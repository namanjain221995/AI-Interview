# Intake Interview kit, version v1 (round_type: intake).
#
# Structured content of Intake_Interview_Kit.docx (repo root) for the AI Intake Interview. Loaded and
# validated by apps/api/app/services/intake/kit.py (load_intake_kit). Not part of the catalog seed
# (app.seed.loaders never reads samples/intake/).
#
# Rules for this file
# * Passages A-F and topic cards 1-8 are the EXACT kit text (titles, paragraphs, instruction, bullets).
#   tests/unit/intake/test_kit.py re-extracts the DOCX and fails on any drift; source.sha256 pins the file.
# * Every other text is the kit wording unless the coordinator's non-negotiable decisions
#   (docs/design/briefs/intake-common.md) require a change: no misrepresentation of experience, no proxy /
#   interview-support framing, work authorisation in the lawful default form (MQ1), observable behaviour
#   only (never emotion, energy, eye contact, accent or appearance), pronunciation not assessed, no
#   reward for bluffing, red flags become human-review items. Where wording was changed, the original is
#   kept under `kit_original` with `not_for_use: true`: source metadata only, never shown to a candidate,
#   asked, sent to a model or used in a score.
# * Competency keys, labels, kit labels and weights must equal app.services.intake.scoring
#   (INTAKE_COMPETENCIES); bands must equal its thresholds. The loader checks both.
schema_version: 1

source:
  file: Intake_Interview_Kit.docx
  sha256: 01b9c592819fb157217ba12f112100dc9dce965124a285b9a31659b798a3c0c8
  version: v1
  title: "INTAKE INTERVIEW KIT"
  subtitle: "Candidate Screening for the Training Program"

overview:
  purpose: "Screens candidates before they enter mandatory training. The goal is not to test existing AI/ML knowledge — it is to decide whether a candidate is trainable, ready for the training program and able to explain technical material clearly."
  kit_original:
    not_for_use: true
    reason: "The kit frames the program around live interview support (a proxy model). The platform screens for a training program and never misrepresents candidates, so that framing is not used."
    text:
      purpose: "This kit screens candidates before they enter mandatory training. The goal is not to test existing AI/ML knowledge — it is to decide whether a candidate is trainable, marketable, and able to handle live interview support."
      measures: "Whoever passes this interview becomes the trainer team's responsibility, so the bar is simple: can we train this person, place them into a niche, and support them in live interviews without the wheels coming off? The interview scores seven competencies:"

duration:
  min_minutes: 35
  max_minutes: 50
  target_minutes: 45
  kit_note: "Plan for roughly 35–50 minutes end to end. Scenario questions (Part 4) can be dropped into Segments 4–6 whenever you want to test applied reasoning."

timers:
  self_intro_seconds: 90
  drill_a_max_seconds: 180
  drill_b_read_seconds: 30
  topic_card_prepare_seconds: 60
  topic_card_speak_seconds: 120

conduct:
  - "Candidates see only the passages and topic cards (Part 6) — never rubrics, scores, bands or reports."
  - "Do not coach during the drills. Silence and mild pressure are part of the test."
  - "Stay neutral — don't nod along or finish their sentences. You want their unassisted baseline."
  - "Record specifics, not impressions. \"Rated himself 8/10 but couldn't explain a dictionary\" beats \"seemed weak.\""
  - "Time-box every segment. If a candidate cannot self-edit when you cut them off, that itself is data."
conduct_kit_original:
  not_for_use: true
  reason: "Rewritten for an online interview where the platform, not a person, controls what the candidate sees."
  text:
    conduct: "Keep Parts 1–5 to yourself. Only hand over pages from Part 6."

# --------------------------------------------------------------------------------------------- stages
stages:
  - key: greeting
    number: 1
    title: "Greetings & self-presentation"
    kit_title: "Greetings & self-presentation"
    minutes: {min: 5, max: 5}
    measures: "Communication, confidence, structure"
    say:
      - "Thanks for coming in — to start, introduce yourself in about 90 seconds: who you are and what you do. Then walk me through the one project or role you're most proud of, and why."
    do:
      - "Open warmly to settle nerves. At around 90 seconds on the intro, cut in politely and move them to the project."
    follow_ups:
      - text: "What was your specific contribution versus the team's?"
      - text: "What was the hardest part, and how did you handle it?"
      - text: "If you redid it today, what would you change?"
    watch_for:
      - "Structure (situation → action → result, or rambling?)"
      - "whether they answer the actual question"
      - "whether they self-edit when you cut in"
    scores_into:
      - {competency: communication}
      - {competency: composure}
    kit_scores_into: "Communication & presentation; Confidence."
    kit_original:
      not_for_use: true
      reason: "Energy and eye contact are never assessed: composure and communication use observable behaviour in what the candidate says (no affect, voice or facial analysis)."
      text:
        watch_for: "Structure (situation → action → result, or rambling?); energy and eye contact; whether they answer the actual question; whether they self-edit when you cut in."

  - key: resume
    number: 2
    title: "Résumé-related questions"
    kit_title: "Résumé-related questions"
    minutes: {min: 8, max: 10}
    measures: "Honesty; real vs. claimed technical depth"
    say:
      - "You listed [tool / framework]. Tell me the last time you used it and what you specifically built."
      - "This says you improved [metric]. How did you measure it? What was the baseline?"
    do:
      - "Pick 2–3 concrete line items and run the depth ladder on each (full framework in Part 3). Separate \"I was on a team that did X\" from \"I personally did X.\""
    follow_ups:
      - text: "Who else worked on this, and what was yours versus theirs?"
      - text: "Walk me through one decision you made and why."
      - text: "If the data doubled tomorrow, what breaks first?"
    watch_for:
      - "Buzzword-only answers"
      - "inability to explain their own listed tools"
      - "inflated scope"
      - "whether the story holds up under repeated questioning"
      - "This is your honesty check — you'll be marketing this résumé."
    scores_into:
      - {competency: technical}
      - {competency: communication}
      - {competency: composure}
    kit_scores_into: "Technical ability; Communication; Confidence."

  - key: mandatory
    number: 3
    title: "Mandatory screening questions"
    kit_title: "Mandatory screening questions"
    minutes: {min: 3, max: 5}
    measures: "Eligibility checks + calibration (work authorisation when enabled, role, language, experience)"
    say: []
    do:
      - "Ask every enabled mandatory question here, once you understand the candidate's background, and record every answer."
      - "MQ1 (work authorisation) is collected only when the organisation's policy enables it, in its lawful default wording, as structured answers in the onboarding form — never asked or discussed live. Its answers go to human review only — never to a model and never into a score."
      - "No answer ends the interview or rejects the candidate automatically. A disqualifying work-authorisation answer or a hard mismatch on role, training commitment or experience level becomes a human-review item with the candidate's own words as evidence."
    follow_ups: []
    watch_for: []
    mandatory_questions: [mq1, mq2, mq3, mq4]
    scores_into: []
    kit_original:
      not_for_use: true
      reason: "Work authorisation is optional, policy-configured and lawful by default; gate failures become human-review items, never an automatic stop or rejection."
      text:
        measures: "Eligibility gates + calibration (visa, role, language, experience)"
        do: "Ask all four here, once you understand the candidate's background. Capture every answer on the scorecard or tracker. Because work authorization (MQ1) is a hard gate, many interviewers confirm it in the first minute and leave the rest for this point — either way, don't skip it. If MQ1 is disqualifying, you can stop after this segment."
        gate_check: "Gate check:  If MQ1 is disqualifying, stop here. If MQ2–MQ4 reveal a hard mismatch — won't do AI/ML when that's all you place, won't commit to training, or isn't comfortable with the experience level — the remaining activities are optional. Record the mismatch and close politely."

  - key: reading
    number: 4
    title: "Technical reading & relay"
    kit_title: "Doc-reading / proxy simulation"
    minutes: {min: 7, max: 8}
    measures: "Technical reading skill (read aloud + relay)"
    say: []
    do:
      - "Tests technical reading and relay. Use passages from Part 6. Run both drills."
    activities:
      - key: drill_a
        title: "Cold read aloud"
        kit_title: "Drill A — Cold read aloud"
        minutes: {min: 2, max: 3}
        material: passage
        required: true
        say:
          - "Read this out loud at a natural pace, as if speaking to an interviewer."
        do:
          - "Hand over a passage."
        watch_for:
          - "fluency: pace, pauses and restarts"
          - "whether every sentence and technical term is read, in order"
          - "whether they sound natural or robotic"
        platform_notes:
          - "The passage is shown on screen for at most 3 minutes; the final transcript is aligned to the passage (completeness, word error rate, omissions, substitutions, insertions, repetitions) and timed (duration, words per minute, pauses)."
          - "Pronunciation is not assessed and accent is never penalised; near-miss speech-recognition variants of technical terms count as read."
        kit_original:
          not_for_use: true
          reason: "No pronunciation model is deployed and accent is never penalised, so pronunciation is reported as not assessed."
          text:
            watch_for: "Watch pronunciation of technical terms, fluency, and whether they sound natural or robotic."
      - key: drill_b
        title: "Read-and-relay"
        kit_title: "Drill B — Read-and-relay"
        minutes: {min: 4, max: 5}
        material: passage
        required: true
        say:
          - "Read this silently for 30 seconds. I'll take it away, then explain it back in your own words, confidently, without reading."
        do:
          - "Give a different passage."
          - "Take the page."
        watch_for:
          - "whether they paraphrase or parrot"
          - "how they recover on a term they didn't catch"
        platform_notes:
          - "The passage is shown for exactly 30 seconds (server-authoritative timer), then removed from the client. It never appears in the candidate transcript and cannot be reopened during the relay."
          - "The relay is scored against the passage's key concepts (relay_concepts)."
    follow_ups:
      - text: "What part were you least sure about?"
        purpose: "self-awareness"
      - text: "Now explain the same idea to a non-technical person in two sentences."
      - text: "What might an interviewer ask about this, and how would you answer?"
    watch_for:
      - "Fluency"
      - "composure under mild pressure"
      - "paraphrase vs. parrot"
      - "recovery"
      - "A candidate who reads flawlessly but can't relay a single idea is weak on this competency."
    scores_into:
      - {competency: technical_reading, primary: true}
      - {competency: composure}
      - {competency: communication}
    kit_scores_into: "Doc-reading / proxy ability (primary); Confidence; Communication."
    kit_original:
      not_for_use: true
      reason: "The platform screens for a training program; the kit's proxy / interview-support framing is not used."
      text:
        measures: "Interview-support skill (read aloud + relay)"
        do: "Tests the skill unique to your support model. Use passages from Part 6. Run both drills."
        watch_for: "Fluency, composure under mild pressure, paraphrase vs. parrot, recovery. A candidate who reads flawlessly but can't relay a single idea is a weak support hire."

  - key: topic
    number: 5
    title: "Structured answer / gap-filling"
    kit_title: "Structured-answer / gap-filling"
    minutes: {min: 7, max: 8}
    measures: "Structured delivery on a general topic"
    say:
      - "Here's a topic with four bullet points. Take about 60 seconds to think, then give me a 2-minute spoken answer connecting all four into one flowing explanation."
    do:
      - "Use one topic card from Part 6. The topics are deliberately general — anyone from any background can speak to them — so this drill isolates structured thinking, delivery, and gap-filling from domain knowledge. (The technical assessment happens through the doc-reading passages, MQ3, and the résumé deep-dive.)"
    activities:
      - key: topic_card
        title: "Topic card"
        kit_title: "Topic card"
        minutes: {min: 3, max: 3}
        material: topic_card
        required: true
        say: []
        do: []
        watch_for: []
        platform_notes:
          - "60 seconds to prepare, then up to 120 seconds to speak (server-authoritative timers)."
    follow_ups:
      - text: "Which of the four points were you least confident on?"
      - text: "Give me a different analogy than the one you just used."
      - text: "If I said your analogy breaks down at [point], how would you respond?"
    watch_for:
      - "Can they connect disjointed points into a narrative?"
      - "Do they handle gaps honestly and gracefully, or expose them awkwardly?"
      - "Can they invent an analogy on the spot?"
      - "Do they cover all four bullets?"
    scores_into:
      - {competency: structured_answer, primary: true}
      - {competency: communication}
      - {competency: composure}
      - {competency: technical}
    kit_scores_into: "Gap-filling / structured answer (primary); Communication; Confidence; Technical ability."
    kit_original:
      not_for_use: true
      reason: "Bluffing and confident misinformation are never rewarded; honest, graceful handling of gaps is."
      text:
        watch_for: "Can they connect disjointed points into a narrative? Do they bluff gracefully or expose the gap awkwardly? Can they invent an analogy on the spot? Do they cover all four bullets?"

  - key: learning
    number: 6
    title: "Niche-fit & trainability probe"
    kit_title: "Niche-fit & trainability probe"
    minutes: {min: 5, max: 5}
    measures: "Learning attitude; AI/ML coping ability"
    say:
      - "You've mostly done [their field]. If we put you through three weeks of intensive AI/ML training, how would you approach learning it?"
      - "Teach me something technical you learned recently — anything — in two minutes."
    do: []
    follow_ups:
      - text: "What's the last new skill you taught yourself, start to finish?"
      - text: "When you got stuck, what did you actually do?"
      - text: "How do you know when you've truly learned something versus just recognizing it?"
    watch_for:
      - "Growth mindset vs. rigidity"
      - "a real, described learning process vs. a vague \"I just Google it\""
      - "genuine openness to AI/ML"
      - "The \"teach me something\" prompt reveals learning-to-teaching transfer — a strong trainability signal."
    scores_into:
      - {competency: trainability}
      - {competency: adaptability}
      - {competency: communication}
    kit_scores_into: "Trainability; Niche-fit; Communication."

  - key: close
    number: 7
    title: "Candidate questions & close"
    kit_title: "Candidate questions & close"
    minutes: {min: 3, max: 5}
    measures: "Seriousness, engagement"
    say:
      - "What questions do you have for me — about the training, the process, expectations, anything?"
      - "Anything you hoped I'd ask that I didn't?"
    do:
      - "Explain next steps and close. Do not reveal the score or decision."
    follow_ups: []
    watch_for:
      - "Questions about the training, the process and expectations are an engagement signal."
      - "Having no questions at all is weaker engagement evidence; questions about pay or timing are legitimate and never count against the candidate."
    scores_into:
      - {competency: composure}
      - {competency: trainability, note: "engagement signal"}
    kit_scores_into: "Confidence; Trainability (engagement signal)."
    kit_original:
      not_for_use: true
      reason: "Questions about pay or timing are legitimate and are not penalised."
      text:
        watch_for: "Serious candidates ask about training, marketing, and expectations. Disengaged ones ask only about money or timing, or have nothing."

# ---------------------------------------------------------------------------- mandatory questions
mandatory_questions:
  - key: mq1
    code: MQ1
    title: "Work authorisation"
    kit_title: "MQ1 — Work authorization / visa status"
    ask:
      - "Are you legally authorised to work in {country} for this role?"
      - "Will you need sponsorship now or in the future?"
    placeholders: [country]
    purpose: "Optional eligibility check, enabled and worded by organisation / job / jurisdiction policy. The default wording asks only whether the candidate is legally authorised to work in the configured country and whether they will need sponsorship."
    policy_note: "Never ask about citizenship, nationality or visa type unless the organisation explicitly enables a reviewed variant. Answers are stored for human review only: never sent to any model, never used in any score."
    follow_ups: []
    record: "Store both answers exactly as given (structured, from the onboarding form), for human review only."
    flag: "A reviewer checks the answers against the organisation's placement policy (review item work_authorization_review); never an automatic stop or rejection."
    policy_configured: true
    send_to_model: false
    used_in_scoring: false
    informs: []
    review_flags: [work_authorization_review]
    kit_original:
      not_for_use: true
      reason: "Asks for visa status, validity and restrictions. Replaced by the lawful default wording (intake-common.md decision 6); kept only as source metadata."
      text:
        ask: "What is your current work-authorization / visa status, and how long is it valid?"
        purpose: "Hard eligibility gate. Determines whether — and where — the candidate can be placed, plus their availability and timeline."
        follow_ups:
          - "When does it expire, or when would you need a transfer or renewal?"
          - "Any restrictions on employer type, location, or the kind of work?"
          - "Are you currently on a project? When could you start?"
          - "Will you need sponsorship now or later?"
        record_flag: "Note exact status, validity, and availability. Flag as a gate if the status doesn't fit your typical placements."

  - key: mq2
    code: MQ2
    title: "Target role"
    kit_title: "MQ2 — Target role"
    ask:
      - "What role are you targeting — AI/ML, Data Analyst, or Product Manager? If PM, is that technical PM or growth PM?"
    purpose: "Decides which niche to market them into and which competencies to weight. Since AI/ML is the primary market, gauge fit and flexibility."
    follow_ups:
      - text: "Why that role — what draws you to it?"
      - text: "What on your résumé maps directly to it?"
      - text: "If demand is stronger in AI/ML than in your first choice, how open are you to being marketed there?"
      - text: "In your own words, what's the difference between a technical PM and a growth PM?"
        when: "If PM"
        purpose: "checks they understand the distinction they just named"
    record: "Stated preference + flexibility."
    flag: "Flag rigidity if they'll accept only one narrow role you don't place."
    informs: [adaptability]
    review_flags: [mandatory_mismatch]

  - key: mq3
    code: MQ3
    title: "Backend language, scripting & self-rating"
    kit_title: "MQ3 — Backend language, scripting & self-rating"
    ask:
      - "Which backend language are you most comfortable with? Have you done scripting? On a 1–10 scale, how do you rate yourself in that language?"
    purpose: "Baseline technical grounding plus a calibration and honesty check. The self-rating only matters once you test whether it holds up."
    follow_ups_note: "verify the rating — this is the real test"
    follow_ups:
      - text: "You said [X]/10 — what would someone at [X+2] know or do that you don't yet?"
      - text: "Tell me about the last thing you built in it."
      - text: "What scripting have you done — automation, data processing, glue code?"
      - text: "Have you used it with any data or ML libraries?"
      - text: "One quick language-specific reality check (see table below)."
        instruction: true
    record: "Language, scripting Y/N, self-rating, and whether the follow-ups confirm or contradict it."
    flag: "Strong flag if the rating is high but unsupported — that's a calibration and honesty risk you'd be marketing."
    informs: [technical]
    review_flags: [claims_not_supported]

  - key: mq4
    code: MQ4
    title: "Experience level & training commitment"
    kit_title: "MQ4 — Comfort with experience level & training commitment"
    ask:
      - "This program prepares people for roles that usually expect around five years of hands-on experience. Are you comfortable with the responsibilities and skills expected at that level, and can you commit to the training needed?"
    purpose: "Confirms the candidate understands the responsibilities the target roles usually expect and commits to the training that prepares them for it. Records the candidate's real experience exactly as stated; the platform never inflates, rounds up or re-states experience."
    follow_ups:
      - text: "How many years of hands-on experience do you have, and in what kind of work?"
        purpose: "records the candidate's actual experience"
      - text: "Where's the gap between your hands-on experience and what roles at that level expect, and how will you close it?"
      - text: "Are you comfortable fielding detailed, senior-level questions in a live interview?"
      - text: "The training is intensive and time-boxed — can you commit the hours?"
    record: "Comfort Y/N, commitment level, any hesitation, and the candidate's actual hands-on experience as stated (never adjusted)."
    flag: "Flag for human review if uncomfortable with the responsibilities expected at that level or unable to commit to training."
    informs: [trainability]
    review_flags: [mandatory_mismatch]
    kit_original:
      not_for_use: true
      reason: "Misrepresentation: the kit presents every candidate with around 5 years of experience regardless of their real experience. Replaced by the coordinator's reframed question (intake-common.md decision 1); the interview-support-model follow-up is dropped."
      text:
        ask: "We present your profile with around 5 years of experience. Are you comfortable representing and performing at that level in interviews and on the job, and committing to the training required to back it up?"
        purpose: "Confirms the candidate is aligned with how they'll be marketed and understands they must perform at that level — which is exactly what the training and this screening prepare them for. Also a commitment check."
        follow_ups:
          - "Where's the gap between your hands-on experience and a 5-year profile, and how will you close it?"
          - "Are you comfortable fielding detailed, senior-level questions in a live interview?"
          - "The training is intensive and time-boxed — can you commit the hours?"
          - "How do you feel about our interview-support model?"
        record_flag: "Comfort Y/N, commitment level, any hesitation. Flag if uncomfortable with the experience level or unable to commit to training."

# ------------------------------------------------------------------------ language verification
language_verification:
  instruction: "Pick one question matched to the candidate's language. Anyone rating 6+ should answer it easily; if they can't, the rating is inflated."
  expected_from_rating: 6
  languages:
    - key: python
      label: "Python"
      aliases: [python, python3, py]
      questions:
        - text: "Difference between a list and a dictionary, and when you'd use each?"
          key_points:
            - "A list is an ordered sequence accessed by integer position."
            - "A dictionary maps unique, hashable keys to values for fast lookup by key."
            - "Use a list for ordered items you iterate over, a dictionary to look values up by a key."
        - text: "What does a list comprehension do?"
          key_points:
            - "Builds a new list from an iterable in a single expression."
            - "Can transform each item and filter with an if clause, e.g. [x * x for x in nums if x > 0]."
    - key: java
      label: "Java"
      aliases: [java]
      questions:
        - text: "Difference between an interface and an abstract class?"
          key_points:
            - "A class can implement many interfaces but extend only one (abstract) class."
            - "An abstract class can hold state, constructors and implemented methods."
            - "An interface defines a contract with no instance state (default and static methods exist since Java 8)."
        - text: "What is the JVM?"
          key_points:
            - "The Java Virtual Machine runs compiled Java bytecode."
            - "It makes Java programs platform-independent (write once, run anywhere)."
            - "It manages memory with garbage collection and JIT-compiles frequently run code."
    - key: javascript
      label: "JavaScript / Node"
      aliases: [javascript, js, node, nodejs, node.js, typescript, ts]
      questions:
        - text: "Difference between == and ===?"
          key_points:
            - "== compares after type coercion (\"5\" == 5 is true)."
            - "=== compares value and type without coercion (\"5\" === 5 is false)."
            - "Prefer === to avoid surprising coercions."
        - text: "What is an async function or a Promise?"
          key_points:
            - "A Promise represents a value that becomes available later (pending, then fulfilled or rejected)."
            - "An async function always returns a Promise."
            - "await pauses the async function until the Promise settles, without blocking the event loop."
    - key: csharp
      label: "C# / .NET"
      aliases: ["c#", csharp, "c sharp", ".net", dotnet, "asp.net"]
      questions:
        - text: "Difference between a class and a struct?"
          key_points:
            - "A class is a reference type; a struct is a value type."
            - "Assigning a struct copies its data; assigning a class instance copies the reference."
            - "Structs suit small, often immutable data; classes support inheritance."
        - text: "What is a using statement for?"
          key_points:
            - "It disposes an IDisposable object automatically when the block ends."
            - "Releases resources such as files, streams or database connections, even when an exception is thrown."
            - "It is equivalent to try/finally calling Dispose()."
    - key: sql
      label: "SQL"
      aliases: [sql, mysql, postgresql, postgres, "t-sql", "pl/sql", "sql server", sqlite]
      questions:
        - text: "Difference between WHERE and HAVING?"
          key_points:
            - "WHERE filters rows before grouping."
            - "HAVING filters groups after GROUP BY, so it can use aggregates such as COUNT or SUM."
            - "WHERE cannot use aggregate functions."
        - text: "What does a JOIN do?"
          key_points:
            - "Combines rows from two or more tables based on a related column."
            - "INNER JOIN keeps matching rows; LEFT, RIGHT and FULL OUTER JOIN also keep unmatched rows from one or both sides."

# --------------------------------------------------------------------------- résumé framework
resume_framework:
  instruction: "Supports Segment 2. Résumés differ, so these are adaptable templates. Before the interview, mark 2–3 concrete line items and run this ladder on each."
  depth_ladder:
    - key: ownership
      label: "Ownership"
      question: "What did you personally build or do here, versus the team?"
    - key: mechanics
      label: "Mechanics"
      question: "Walk me through how it actually worked / how you measured that result."
    - key: stress
      label: "Stress"
      question: "What would break if the data doubled, a key assumption changed, or you had to redo it today?"
  claim_probes:
    - key: tool_or_framework
      claim: "Claims a tool or framework (TensorFlow, Django, Spring, etc.)"
      questions:
        - "When did you last use it?"
        - "What specifically did you build?"
        - "What did you find hard?"
    - key: metric_improvement
      claim: "Claims a metric improvement (\"improved accuracy 15%\")"
      questions:
        - "How did you measure it?"
        - "What was the baseline?"
        - "What drove the improvement?"
    - key: project_or_product
      claim: "Claims a project or product"
      questions:
        - "What was your role?"
        - "What was the hardest technical decision?"
        - "What would you do differently?"
    - key: leadership
      claim: "Claims leadership"
      questions:
        - "How big was the team?"
        - "Which decisions were yours?"
        - "Give one example of a call you got wrong."
    - key: thin_or_vague
      claim: "Thin or vague résumé"
      questions:
        - "Tell me about the most technical thing you've ever done, in detail — even a course or personal project."
  honesty_signals_title: "Honesty flags"
  honesty_signals_note: "Signals for the evidence trail and human review (review item claims_not_supported); never an automatic decision."
  honesty_signals:
    - "Answers get vaguer as you go deeper — real experience gets more specific under questioning."
    - "Uses \"we\" for everything and never \"I\"."
    - "Recites the résumé line back instead of explaining it."
    - "Cannot name the basic components of a tool they claim to know."
    - "Self-rating (from MQ3) doesn't survive the language reality check."

# ------------------------------------------------------------------------------- probe bank (4.1)
probe_bank:
  instruction: "Follow-ups are where real signal lives — they separate rehearsed answers from real understanding. Use the funnel: start broad, then drill into specifics. Keep asking \"why\", \"how\", and \"what specifically\" until the answer either deepens (real experience) or thins out (rehearsed). Use any of these, adapted to what the candidate just said:"
  categories:
    - key: depth_mechanics
      label: "Depth / mechanics"
      probes:
        - "How exactly did that work under the hood?"
        - "Walk me through it step by step."
        - "What was happening at each stage?"
    - key: ownership
      label: "Ownership"
      probes:
        - "What did you personally do versus the team?"
        - "Whose decision was that?"
        - "What part are you proudest of?"
    - key: honesty_edges
      label: "Honesty / edges"
      probes:
        - "What part were you least sure about?"
        - "Where does this break down?"
        - "What would someone more senior know that you don't yet?"
    - key: trade_offs
      label: "Trade-offs"
      probes:
        - "What did you give up by choosing that?"
        - "What was the alternative, and why didn't you pick it?"
    - key: trainability
      label: "Trainability"
      probes:
        - "How did you learn that?"
        - "What did you do when you got stuck?"
        - "How would you get up to speed on something brand new?"
    - key: application
      label: "Application"
      probes:
        - "How would you apply that to a different situation?"
        - "What changes if the data doubles or the client changes the requirement?"

# --------------------------------------------------------------------------- scenario bank (4.2)
scenario_bank:
  instruction: "Scenario questions test whether a candidate can apply judgment to a new situation, not recite. Drop 2–3 into Segments 4–6. For each, the strong- and weak-answer signals below help you score consistently. Each scenario feeds the competency noted in brackets."
  use_in_stages: [reading, topic, learning]
  per_interview: {min: 2, max: 3}
  signals_note: "Strong and weak signals describe the approach the candidate describes for the hypothetical situation; they are never a judgement of the candidate's own emotional state during the interview."
  groups:
    - key: A
      title: "Composure & thinking on your feet"
      kit_competencies: "Confidence · Communication"
      competencies: [composure, communication]
      scenarios:
        - key: A1
          prompt: "In a live interview you're asked something outside everything you prepared, and you don't immediately know the answer. What do you do in that moment?"
          tests: "Composure, reasoning aloud, honest gap-handling, not freezing."
          strong: "Stays calm, buys a moment (\"let me think that through\"), reasons from first principles or adjacent knowledge, and is candid about the edge of their knowledge while showing what they do know."
          weak: "Freezes, goes silent, panics, or bluffs with obvious nonsense."
        - key: A2
          prompt: "You're halfway through an answer and realise you've made a factual mistake. What do you do?"
          tests: "Honesty, composure, recovery."
          strong: "Corrects it cleanly and moves on without spiralling (\"Actually, let me correct that —\")."
          weak: "Doubles down on the error, or loses confidence for the rest of the conversation."
        - key: A3
          prompt: "The interviewer interrupts and challenges your answer, saying they disagree. How do you react?"
          tests: "Composure under pressure; defending or updating a view gracefully."
          strong: "Stays composed, asks a clarifying question, defends with reasoning or concedes the valid point without crumbling."
          weak: "Gets defensive and flustered, or immediately abandons a correct answer under mild pushback."
    - key: B
      title: "Technical reasoning — applied to new problems"
      kit_competencies: "Technical · Gap-filling"
      competencies: [technical, structured_answer]
      scenarios:
        - key: B1
          prompt: "A model shows 99% accuracy in training but only 60% once deployed. Walk me through what could be wrong and how you'd investigate."
          tests: "Applied ML reasoning — overfitting, data drift, leakage, train/test mismatch."
          strong: "Names several plausible causes, proposes a diagnostic order, and distinguishes overfitting from distribution shift."
          weak: "Just says \"the model is bad\", or recites a definition with no diagnostic path."
        - key: B2
          prompt: "A client wants to predict which customers will cancel. You have 50,000 rows and 30 mixed features. How would you approach it end-to-end, at a high level?"
          tests: "Whether they can structure a pipeline (EDA → preprocessing → model choice → evaluation) and justify choices."
          strong: "Walks the stages and names a decision at each — handling imbalance, which metric, which model family, how to validate."
          weak: "Jumps straight to \"use a neural network\" with no pipeline or justification."
        - key: B3
          prompt: "Your email classifier is 90% accurate on a dataset that's 1,000 spam and 9,000 non-spam. The client is impressed. Should they be?"
          tests: "Understanding of class imbalance and metric choice."
          strong: "Points out 90% is roughly what you'd get by always predicting \"not spam\"; recommends precision, recall, F1, or a confusion matrix."
          weak: "Accepts 90% as good without questioning the imbalance."
        - key: B4
          prompt: "A client asks, \"Why did your model predict this specific customer would churn?\" How do you answer, and which models make this easy versus hard?"
          tests: "Explainability awareness."
          strong: "Distinguishes interpretable models (logistic regression, decision trees) from black boxes (deep nets, large ensembles), and mentions feature-importance or SHAP-style explanations for the hard cases."
          weak: "Says \"the model just knows\", or can't tell interpretable from opaque models."
    - key: C
      title: "Learning agility & trainability"
      kit_competencies: "Trainability"
      competencies: [trainability]
      scenarios:
        - key: C1
          prompt: "You're staffed on a project using a framework you've never touched, and you're expected to contribute in two weeks. How do you get up to speed?"
          tests: "Self-directed learning process."
          strong: "A concrete plan — read the docs, reproduce examples, build something small, ask targeted questions, ship fast."
          weak: "Vague (\"I'd just Google it\") or expects to be hand-held through it."
        - key: C2
          prompt: "During training you're falling behind on a concept everyone else seems to grasp. What do you do?"
          tests: "Resourcefulness, willingness to ask for help, resilience."
          strong: "Seeks help early, breaks the concept down, finds alternate explanations, practises deliberately."
          weak: "Hides it, gives up, or blames the material."
    - key: D
      title: "Professional judgment & client situations"
      kit_competencies: "Confidence · Trainability"
      competencies: [composure, trainability]
      scenarios:
        - key: D1
          prompt: "A client asks you to do something you don't yet know how to do. How do you handle it honestly while protecting the relationship?"
          tests: "Honesty plus client management."
          strong: "Doesn't over-promise; buys reasonable time, learns fast, communicates a plan, and delivers."
          weak: "Either flatly says \"I can't\" and stops, or over-promises and then disappears."
        - key: D2
          prompt: "You get critical feedback from a client mid-contract. How do you respond?"
          tests: "Maturity and coachability."
          strong: "Takes it professionally, asks for specifics, adjusts, and follows up."
          weak: "Gets defensive, dismissive, or crumbles."
        - key: D3
          prompt: "You disagree with a technical approach your team lead insists on. What do you do?"
          tests: "Judgment, communication, disagree-and-commit."
          strong: "Raises the concern with reasoning, listens, and either aligns or commits to the decision professionally."
          weak: "Stays silently resentful, or becomes openly combative."

# ------------------------------------------------------------------------------------- rubric
rubric:
  instruction: "Score each competency from 1 to 5. The weighted total maps to a decision band. The accompanying scorecard and tracker calculate the total and band automatically, and capture the mandatory-screening answers."
  scale: {min: 1, max: 5}
  competencies:
    - key: communication
      label: "Communication & Presentation"
      kit_label: "Communication & presentation"
      weight: "0.20"
      kit_weight: "20%"
      description: "Clarity, structure and relevance of what the candidate says: answers the actual question in a logical order that is easy to follow."
      anchors:
        "1": "Rambling and hard to follow; answers often drift away from the question"
        "3": "Clear but unstructured"
        "5": "Structured, clear and relevant; easy to follow from start to finish"
      excluded_signals: [accent, pronunciation, appearance, voice affect, energy, eye contact]
      kit_original:
        not_for_use: true
        reason: "Communication is judged on clarity, structure and relevance only — never energy, confidence display, accent or appearance (intake-common.md decision 3)."
        text:
          anchors: ["Rambling, hard to follow, low energy", "Clear but unstructured", "Structured, confident, engaging"]
    - key: technical_reading
      label: "Technical Reading & Relay"
      kit_label: "Doc-reading / proxy ability"
      weight: "0.20"
      kit_weight: "20%"
      description: "Reading a technical passage aloud completely and fluently (Drill A) and relaying its key ideas in one's own words after 30 seconds of silent reading (Drill B)."
      anchors:
        "1": "Stumbles, robotic, or freezes on relay"
        "3": "Reads okay, weak paraphrase"
        "5": "Fluent, natural, relays in own words"
      excluded_signals: [pronunciation, accent]
      components:
        - key: drill_a
          label: "Drill A: reading delivery"
          weight: "0.4"
          method: "Transcript-to-passage alignment and timing (app.services.intake.reading.align_reading -> delivery_score 1-5)."
        - key: drill_b
          label: "Drill B: comprehension and relay"
          weight: "0.6"
          method: "Coverage of the passage's key concepts in the candidate's own words (relay_concepts), scored 1-5."
      kit_original:
        not_for_use: true
        reason: "The kit describes this as the skill unique to its interview-support (proxy) model; the platform assesses technical reading and relay for training readiness."
        text:
          description: "Doc-reading / proxy ability — the skill unique to your interview-support model"
    - key: structured_answer
      label: "Structured Answer / Gap-Filling"
      kit_label: "Gap-filling / structured answer"
      weight: "0.15"
      kit_weight: "15%"
      description: "Connecting the four points of a general topic into one structured, flowing answer and handling the points they know less about honestly."
      anchors:
        "1": "Can't connect the bullets; points come out disjointed, are skipped, or are covered with made-up facts"
        "3": "Covers the points woodenly"
        "5": "Connects all points into a natural flow and handles gaps honestly and gracefully"
      excluded_signals: [bluffing rewarded, confident misinformation rewarded]
      kit_original:
        not_for_use: true
        reason: "Bluffing and confident misinformation are never rewarded (intake-common.md decision 3)."
        text:
          anchors: ["Can't connect bullets, exposes gaps", "Covers the points woodenly", "Flows naturally, bluffs gaps gracefully"]
    - key: technical
      label: "Actual Technical Ability"
      kit_label: "Technical ability (actual)"
      weight: "0.15"
      kit_weight: "15%"
      description: "Real technical depth versus what the résumé claims: explains their own tools, decisions and results, and the MQ3 self-rating holds up under the language check."
      anchors:
        "1": "Buzzwords only, can't explain own résumé"
        "3": "Real but shallow depth"
        "5": "Solid depth, explains clearly"
      excluded_signals: []
    - key: trainability
      label: "Trainability & Learning Attitude"
      kit_label: "Trainability / learning attitude"
      weight: "0.15"
      kit_weight: "15%"
      description: "A real, described learning process, commitment to the training, and the ability to teach back something recently learned."
      anchors:
        "1": "Rigid, no learning process"
        "3": "Willing but passive"
        "5": "Hungry, self-directed, learns fast"
      excluded_signals: []
    - key: composure
      label: "Confidence & Composure"
      kit_label: "Confidence & composure"
      weight: "0.10"
      kit_weight: "10%"
      description: "Observable behaviour under mild pressure: keeps going when unsure, handles follow-ups and challenges, and recovers from mistakes."
      anchors:
        "1": "Stops or abandons answers when unsure or challenged, and does not recover from mistakes"
        "3": "Keeps going on familiar ground but stalls when unsure or challenged"
        "5": "Keeps going when unsure, handles follow-ups and challenges, and recovers from mistakes cleanly"
      excluded_signals: [emotion, voice affect, energy, eye contact, facial analysis, accent, appearance]
      kit_original:
        not_for_use: true
        reason: "Composure is observable behaviour only — never emotion, voice affect, energy, eye contact or facial analysis (intake-common.md decision 3)."
        text:
          anchors: ["Nervous, crumbles under pressure", "Steady only in comfort zone", "Composed even when unsure"]
    - key: adaptability
      label: "Niche-Fit & Adaptability"
      kit_label: "Niche-fit / adaptability"
      weight: "0.05"
      kit_weight: "5%"
      description: "Whether a candidate from outside AI/ML is open to moving into it and copes with the material."
      anchors:
        "1": "Refuses to move off their field"
        "3": "Open but hesitant"
        "5": "Eager to adapt to AI/ML"
      excluded_signals: []

# ------------------------------------------------------------------------------ decision guide
decision_guide:
  note: "The band is an AI recommendation for human reviewers, never an automatic decision. Totals are exact (Decimal) and never rounded before banding; intervals are half-open with no gaps."
  bands:
    - key: strong_accept
      label: "Strong accept"
      min_inclusive: "4.20"
      max_exclusive: null
      kit_range: "4.2 – 5.0"
      kit_decision: "Strong accept — fast-track into training"
      guidance: "fast-track into training"
    - key: accept_with_notes
      label: "Accept with notes"
      min_inclusive: "3.30"
      max_exclusive: "4.20"
      kit_range: "3.3 – 4.1"
      kit_decision: "Accept with notes — flag weak areas for the trainer team"
      guidance: "flag weak areas for the trainer team"
    - key: borderline
      label: "Borderline"
      min_inclusive: "2.50"
      max_exclusive: "3.30"
      kit_range: "2.5 – 3.2"
      kit_decision: "Borderline — second interview or a conditional offer"
      guidance: "second interview or a conditional offer"
    - key: reject
      label: "Reject"
      min_inclusive: null
      max_exclusive: "2.50"
      kit_range: "Below 2.5"
      kit_decision: "Reject"
      guidance: "recommend not proceeding; a human reviewer decides"
  insufficient_evidence:
    key: insufficient_evidence
    label: "Insufficient evidence"
    description: "At least one competency lacks sufficient evidence. No band is recommended; the partial total re-normalised over the scored competencies is shown and labelled as partial."
  normalized_100_note: "Optional out-of-100 view = weighted total / 5 x 100, labelled as a conversion; the band always uses the 1-5 total."
  human_decisions:
    - key: accept
      label: "Accept"
    - key: accept_with_notes
      label: "Accept with notes"
    - key: second_interview
      label: "Second interview"
    - key: reject
      label: "Reject"
    - key: request_evidence
      label: "Request evidence"
  human_decision_rule: "Every human decision records a rationale, the reviewer and a timestamp, and is audited."

# -------------------------------------------------------------------------------- review flags
review_flags:
  note: "Each item is raised for a human reviewer with its evidence. It never overrides the score, never rejects automatically and never ends the interview."
  kit_original:
    not_for_use: true
    reason: "Automatic red flags become human-review items with evidence (intake-common.md decision 5)."
    text:
      intro: "Any one of these overrides the score — move the candidate to reject or re-interview regardless of the total:"
  flags:
    - key: claims_not_supported
      label: "Résumé claim or self-rating not supported"
      description: "A résumé claim, or the MQ3 self-rating, did not hold up under follow-up questions or the language reality check."
      trigger: "Follow-ups or the language verification question contradict a claim, or a self-rating of 6+ is not supported by the answer."
      evidence:
        - "the claim or self-rating as stated"
        - "the follow-up questions and the candidate's answers"
        - "the language verification question and answer"
      sources: [resume, mandatory]
      kit_text: "Dishonesty about résumé claims, or a self-rating that collapses under the reality check."
      automatic_rejection: false
    - key: reading_not_completed
      label: "Passage not read aloud"
      description: "Drill A stopped early or most of the passage was not read."
      trigger: "No reading captured, or Drill A completeness below 0.50 (share of the passage's content words read, ASR variants counted as read)."
      evidence:
        - "Drill A reading metrics (completeness, word error rate, duration, pauses)"
        - "the transcript of the attempt"
      sources: [reading]
      kit_text: "Cannot read a simple technical passage aloud — fatal for interview support."
      automatic_rejection: false
      note: "Pronunciation and accent are never part of this check."
    - key: work_authorization_review
      label: "Work authorisation answer for review"
      description: "MQ1 is enabled for this interview: its answers (collected in the onboarding form) go to a human reviewer, who checks them against the organisation's placement policy. MQ1 answers are never sent to a model or used in a score."
      trigger: "Every interview in which MQ1 is enabled."
      evidence:
        - "the MQ1 questions as worded and the candidate's answers from the onboarding form"
      sources: [mandatory]
      kit_text: "Fails the mandatory gate — work authorization is disqualifying, or a hard mismatch on role, training, or experience level."
      automatic_rejection: false
    - key: mandatory_mismatch
      label: "Hard mismatch on role, training or experience level"
      description: "MQ2-MQ4 show a hard mismatch: will accept only a role the program does not place, will not commit to the training, or is not comfortable with the responsibilities expected at the target level."
      trigger: "The candidate's MQ2, MQ3 or MQ4 answer states the mismatch."
      evidence:
        - "the mandatory question and the candidate's answer in their own words"
      sources: [mandatory]
      kit_text: "Fails the mandatory gate — work authorization is disqualifying, or a hard mismatch on role, training, or experience level."
      automatic_rejection: false
    - key: communication_unclear
      label: "Communication clarity concern"
      description: "Answers were hard to follow across several stages (clarity, structure, relevance)."
      trigger: "Communication scored 1, with transcript excerpts from at least two stages."
      evidence:
        - "transcript excerpts from the stages concerned"
      sources: [greeting, resume, topic, learning]
      kit_text: "Communication so unclear that training cannot quickly fix it."
      automatic_rejection: false
      note: "Never based on accent, pronunciation or appearance."

# ------------------------------------------------------------------------------------ passages
passages:
  - key: A
    header: "PASSAGE A  ·  Read this aloud"
    title: "What Is an API?"
    index_topic: "What is an API?"
    level: easy
    level_label: "Easy"
    suggested_use: "Drill A (read aloud) or B (relay)"
    drills: [read_aloud, relay]
    paragraphs:
      - "An API, or Application Programming Interface, is a set of rules that lets two software programs talk to each other. Think of it like a waiter in a restaurant: you don't walk into the kitchen to cook your own food — you tell the waiter what you want, and the waiter brings it back."
      - "The API takes your request, passes it to the system, and returns the response. Most modern web and mobile applications rely on APIs to fetch data. For example, a weather app calls a weather API to get the current temperature instead of measuring it itself."
    terms: [API, Application Programming Interface, software, programs, restaurant, applications, APIs, temperature]
    relay_concepts:
      - key: definition
        text: "An API (Application Programming Interface) is a set of rules."
        cues: ["set of rules", "rules", "application programming interface", "interface"]
      - key: purpose
        text: "It lets two software programs talk to each other."
        cues: ["talk to each other", "communicat*", "two programs", "two software", "between programs", "between applications", "connect*"]
      - key: analogy
        text: "It works like a waiter in a restaurant."
        cues: ["waiter", "restaurant"]
      - key: no_direct_access
        text: "You don't go into the kitchen yourself: the waiter (the API) goes to the system for you."
        cues: ["kitchen", "directly", "yourself", "for you", "on your behalf"]
      - key: request_response
        text: "The API takes your request, passes it to the system and returns the response."
        cues: ["request*", "response*", "returns", "brings back", "brings it back"]
      - key: everywhere
        text: "Most modern web and mobile apps rely on APIs to fetch data."
        cues: ["web", "mobile", "fetch*", "get data", "rely on"]
      - key: example
        text: "A weather app calls a weather API for the current temperature instead of measuring it."
        cues: ["weather", "temperature"]

  - key: B
    header: "PASSAGE B  ·  Read this aloud"
    title: "Gradient Descent"
    index_topic: "Gradient descent"
    level: intermediate
    level_label: "Intermediate"
    suggested_use: "Drill A or B"
    drills: [read_aloud, relay]
    paragraphs:
      - "Gradient descent is an optimisation algorithm used to train machine learning models. The goal is to minimise a cost function, which measures how wrong the model's predictions are."
      - "Imagine standing on a foggy hill and wanting to reach the lowest point. You can't see far, so you feel the slope beneath your feet and take a step in the steepest downhill direction, and you repeat this until the ground is flat."
      - "In the same way, gradient descent measures the slope of the error and adjusts the model's parameters step by step. The size of each step is called the learning rate: too large and you overshoot the valley, too small and training takes forever."
    terms: [gradient descent, optimisation, algorithm, machine learning, cost function, predictions, parameters, learning rate, overshoot]
    relay_concepts:
      - key: what
        text: "Gradient descent is an optimisation algorithm used to train machine learning models."
        cues: ["optimi*", "algorithm", "train*"]
      - key: goal
        text: "Its goal is to minimise a cost function."
        cues: ["cost function", "loss*", "minimi*", "lowest", "reduce the error"]
      - key: cost_meaning
        text: "The cost function measures how wrong the model's predictions are."
        cues: ["how wrong", "error*", "mistake*", "wrong"]
      - key: analogy
        text: "Like walking down a foggy hill towards the lowest point by feeling the slope."
        cues: ["hill", "fog*", "mountain", "valley", "downhill", "slope"]
      - key: iterative
        text: "It measures the slope of the error and adjusts the parameters step by step."
        cues: ["step by step", "adjust*", "parameter*", "repeat*", "iterat*", "small steps"]
      - key: learning_rate
        text: "The size of each step is called the learning rate."
        cues: ["learning rate", "step size", "size of each step", "size of the step"]
      - key: tradeoff
        text: "Too large a step overshoots the valley; too small makes training take forever."
        cues: ["overshoot*", "too large", "too big", "too small", "forever", "slow*"]

  - key: C
    header: "PASSAGE C  ·  Read this aloud"
    title: "Overfitting"
    index_topic: "Overfitting"
    level: intermediate
    level_label: "Intermediate"
    suggested_use: "Drill B (relay)"
    drills: [relay]
    paragraphs:
      - "Overfitting happens when a machine learning model learns the training data too well — including its noise and random quirks — instead of the underlying pattern. Such a model performs beautifully on data it has already seen but fails on new, unseen data."
      - "A useful analogy is a student who memorises the answers to last year's exam without understanding the concepts. They ace the practice test but panic when the real questions are different."
      - "Common defences against overfitting include using more training data, simplifying the model, and a technique called regularisation, which penalises overly complex solutions."
    terms: [overfitting, machine learning, training data, quirks, underlying pattern, memorises, regularisation, penalises]
    relay_concepts:
      - key: definition
        text: "Overfitting is when a model learns the training data too well."
        cues: ["too well", "memori*", "training data"]
      - key: noise
        text: "It learns the noise and random quirks instead of the underlying pattern."
        cues: ["noise", "quirk*", "random", "pattern*"]
      - key: consequence
        text: "It does well on data it has seen but fails on new, unseen data."
        cues: ["new data", "unseen", "fail*", "generali*", "real world"]
      - key: analogy
        text: "Like a student who memorises last year's exam answers without understanding the concepts."
        cues: ["student", "exam", "memori*"]
      - key: analogy_outcome
        text: "The student aces the practice test but struggles when the real questions are different."
        cues: ["practice test", "practice", "different questions", "questions are different", "panic*"]
      - key: more_data
        text: "One defence is using more training data."
        cues: ["more data", "more training data"]
      - key: simpler_model
        text: "Another defence is simplifying the model."
        cues: ["simplif*", "simpler", "less complex"]
      - key: regularisation
        text: "Regularisation penalises overly complex solutions."
        cues: ["regulari*", "penali*"]

  - key: D
    header: "PASSAGE D  ·  Read this aloud"
    title: "How a Neural Network Learns"
    index_topic: "How a neural network learns"
    level: advanced
    level_label: "Advanced"
    suggested_use: "Drill A (pronunciation stress test)"
    drills: [read_aloud]
    platform_note: "Used as a technical-vocabulary reading test (every term read, fluency and pace). Pronunciation itself is not assessed and accent is never penalised."
    paragraphs:
      - "A neural network learns through a process called backpropagation. During the forward pass, input data flows through layers of interconnected neurons, each applying weights and a nonlinear activation function to produce an output."
      - "The network then compares its output to the correct answer and computes the error. Backpropagation works backward through the network, using the chain rule from calculus to determine how much each weight contributed to the error, and adjusts the weights accordingly."
      - "This cycle repeats across many iterations, called epochs, gradually reducing the error. The efficiency of this algorithm is what makes it feasible to train deep networks with millions of parameters."
    terms: [neural network, backpropagation, forward pass, interconnected, neurons, weights, nonlinear, activation function, chain rule, calculus, iterations, epochs, efficiency, algorithm, parameters]
    relay_concepts:
      - key: backpropagation
        text: "Neural networks learn through backpropagation."
        cues: ["backpropagation", "back propagation", "backprop"]
      - key: forward_pass
        text: "In the forward pass, input data flows through layers of neurons."
        cues: ["forward pass", "forward", "layer*", "neuron*"]
      - key: weights_activation
        text: "Each neuron applies weights and a nonlinear activation function."
        cues: ["activation", "nonlinear", "non linear", "weights"]
      - key: error
        text: "The output is compared to the correct answer to compute the error."
        cues: ["error", "compar*", "correct answer", "loss"]
      - key: chain_rule
