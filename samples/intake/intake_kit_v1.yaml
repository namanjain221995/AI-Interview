  - key: E
    header: "PASSAGE E  ·  Read this aloud"
    title: "Transformers and Attention"
    index_topic: "Transformers & attention"
    level: advanced
    level_label: "Advanced"
    suggested_use: "Drill A or B (stronger candidates)"
    drills: [read_aloud, relay]
    paragraphs:
      - "Transformer models rely on a mechanism called self-attention, which lets the model weigh the importance of every word in a sentence relative to every other word. Unlike earlier recurrent architectures that processed text one step at a time, transformers process all tokens in parallel, which dramatically accelerates training."
      - "Because parallel processing discards word order, transformers add positional encodings to preserve the sequence. Multi-head attention lets the model focus on several kinds of relationships at once — one head might track subject-verb agreement while another tracks long-range context."
      - "This architecture is the foundation of large language models such as GPT."
