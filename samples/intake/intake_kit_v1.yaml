  - key: F
    header: "PASSAGE F  ·  Read this aloud"
    title: "Version Control with Git"
    index_topic: "Version control with Git"
    level: intermediate
    level_label: "Intermediate (general)"
    suggested_use: "Drill A or B"
    drills: [read_aloud, relay]
    paragraphs:
      - "Version control is a system that records changes to files over time, so you can recall specific versions later. Git, the most widely used version control tool, lets many developers work on the same project without overwriting each other's work."
      - "Each developer works on their own copy, makes changes in isolated branches, and then merges those changes back into the main codebase. If two people edit the same line, Git flags a merge conflict that must be resolved manually."
      - "This workflow makes it possible for large teams to collaborate on complex software without descending into chaos."
