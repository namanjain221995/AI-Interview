# Technical: ML engineering (4/4) - MLOps, CI/CD for models, release safety and platform.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [ml]
questions:
  # ------------------------------------------------------------- CI and release
  - external_key: technical.ml_engineering.ml_pull_request_checks
    competency_key: mlops
    topic: Continuous integration for an ML project
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What does continuous integration look like on an ML project you've worked on? What runs on every pull
      request, and what runs less often?
    expected_concepts:
      - linting, type checks and unit tests
      - data transformation tests on small fixtures
      - a short training smoke run
      - heavier evaluation on merge or nightly
      - building and scanning serving images
    rubric:
      excellent: Describes a real pipeline with fast checks per pull request and heavier training and evaluation runs on merge or a schedule, with reasons for the split.
      good: Runs unit tests and some form of model or data check automatically.
      weak: Has no automated checks, or runs full training on every commit without considering cost.
    followups:
      - How do you keep the pull request checks under ten minutes?
    common_errors:
      - Treating ML code as untestable and skipping CI entirely.

  - external_key: technical.ml_engineering.registry_promotion_gates
    competency_key: mlops
    topic: Automated gates before model promotion
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What automated checks would you require before a newly trained model can be promoted to production in
      the model registry?
    expected_concepts:
      - beating the current model on a frozen evaluation set
      - no regression on important slices
      - latency and memory within serving limits
      - input and output schema compatibility
      - behavioural tests and sanity checks
      - recorded lineage and approvals
    rubric:
      excellent: Defines comparative quality gates including slices, serving performance and schema compatibility checks, behavioural tests, and requires lineage and an audit record for each promotion.
      good: Requires the new model to beat the current one and pass basic compatibility checks.
      weak: Promotes any model whose training finished successfully.
    followups:
      - How much better must the new model be before you promote it?
    common_errors:
      - Comparing against a fixed threshold instead of the current production model.

  - external_key: technical.ml_engineering.registry_metadata
    competency_key: mlops
    topic: Using a model registry
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How have you used a model registry, and what information do you make sure every registered model
      carries?
    expected_concepts:
      - version and stage such as staging or production
      - training data and code versions
      - evaluation results
      - input and output signature
      - owner and approval history
    rubric:
      excellent: Describes real registry use with stages and promotion, and lists metadata that makes models traceable, comparable and safely deployable.
      good: Has used a registry and records versions and metrics.
      weak: Stores model files in a shared folder with no metadata.
    followups:
      - How do you find which model version is serving right now?
    common_errors:
      - Registering models without the data version they were trained on.

  - external_key: technical.ml_engineering.audit_old_prediction
    competency_key: mlops
    topic: Tracing an old prediction back to its sources
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An internal auditor asks which data and code produced a particular prediction your model made eight
      months ago. How would you answer, and what needs to be in place to make that possible?
    expected_concepts:
      - prediction logs with model version and request id
      - model version linked to training run, code and data
      - logged input features for the request
      - retention policies for logs and artifacts
      - ability to replay the prediction
    rubric:
      excellent: Traces the prediction through logs to model version, training run, code and data versions, uses logged inputs to replay it, and names the retention and lineage that must exist in advance.
      good: Knows predictions must be logged with model versions linked to training metadata.
      weak: Could not answer and has no plan for lineage.
    followups:
      - What would you do if the training data has since been deleted for privacy reasons?
    common_errors:
      - Logging the model name but not the exact version that served the request.

  - external_key: technical.ml_engineering.notebook_vs_container_outputs
    competency_key: python
    topic: Different predictions in notebook and serving container
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A model gives slightly different predictions in the serving container than in the notebook where it was
      trained, for the same inputs. How would you track down the difference?
    expected_concepts:
      - comparing library versions and pinned dependencies
      - preprocessing code differences
      - floating point and hardware differences
      - serialisation and loading differences
      - comparing intermediate outputs step by step
    rubric:
      excellent: Compares environments and dependencies, diffs intermediate outputs to locate the first divergence, and separates harmless numerical noise from real preprocessing or version bugs.
      good: Checks library versions and preprocessing and compares outputs.
      weak: Accepts the difference without investigating or reinstalls everything at random.
    followups:
      - How small a difference would you accept, and why?
    common_errors:
      - Leaving dependencies unpinned so the container installs different versions.

  - external_key: technical.ml_engineering.packaging_models
    competency_key: mlops
    topic: Packaging a model for deployment
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you package a model and its dependencies for deployment, and how do you keep the training and
      serving environments consistent?
    expected_concepts:
      - container images with pinned dependencies
      - model artifact stored separately from code or baked in
      - shared preprocessing package
      - same base image or lock file for training and serving
      - scanning and minimising image size
    rubric:
      excellent: Describes a concrete packaging approach with pinned dependencies, shared preprocessing code and a deliberate choice about baking or fetching weights, with reasons.
      good: Uses containers with pinned dependencies.
      weak: Installs dependencies by hand on servers.
    followups:
      - When would you bake the weights into the image instead of downloading them at startup?
    common_errors:
      - Copying preprocessing code into the serving repository, where it drifts from training.

  - external_key: technical.ml_engineering.behavioural_model_tests
    competency_key: testing
    topic: Behavioural tests for models
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Beyond aggregate metrics, what behavioural tests do you write for a model, such as invariance or
      directional checks, and how do they fit into your release process?
    expected_concepts:
      - invariance tests where predictions should not change
      - directional expectation tests
      - minimum functionality tests on known cases
      - tests from past production failures
      - running them as release gates
    rubric:
      excellent: Gives concrete invariance, directional and known-case tests tied to the product, grows them from past incidents, and runs them as gates with clear pass criteria.
      good: Knows behavioural testing and gives at least one realistic example.
      weak: Relies only on accuracy on a test set.
    followups:
      - How strict should a directional test be, given models are statistical?
    common_errors:
      - Writing behavioural tests so strict that every retrain fails them.

  - external_key: technical.ml_engineering.canary_without_labels
    competency_key: mlops
    topic: Deciding a canary with no labels yet
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your canary for a new model looks fine on latency and errors, but you only have an hour of traffic and
      outcome labels take days. What would you base the promote-or-rollback decision on?
    expected_concepts:
      - prediction distribution compared with the current model
      - agreement rate between old and new model
      - early proxy metrics such as clicks or immediate actions
      - guardrail business metrics
      - longer bake time or staged ramp for risky changes
    rubric:
      excellent: Uses prediction distribution, disagreement analysis and early proxies, sets guardrails, and adjusts bake time to the risk, accepting that final confirmation comes when labels arrive.
      good: Compares prediction distributions and watches proxy metrics before ramping.
      weak: Promotes because there were no errors.
    followups:
      - Which requests would you look at closely where the two models disagree?
    common_errors:
      - Treating a healthy service as a sign of a good model.

  - external_key: technical.ml_engineering.rollback_retired_pipeline
    competency_key: mlops
    topic: Rolling back when the old features are gone
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You need to roll back a model, but the new version depends on a new feature and the old feature
      pipeline has already been switched off. How would you get out of this, and how would you avoid it next
      time?
    expected_concepts:
      - restarting or backfilling the retired pipeline
      - interim fallback model or rules
      - keeping old feature pipelines until the new model is proven
      - treating model plus features as one versioned release
      - testing rollback as part of release
    rubric:
      excellent: Proposes a realistic short-term recovery and, for the future, versions models and features together, keeps old pipelines until a bake period ends and tests rollback before release.
      good: Proposes restarting the old pipeline and keeping it running longer in future.
      weak: Has no recovery path beyond fixing forward under pressure.
    followups:
      - How long would you keep the old pipeline running after a launch?
    common_errors:
      - Assuming model rollback is a single registry change when its inputs have changed.

  - external_key: technical.ml_engineering.internal_ml_platform
    competency_key: system_design
    topic: Core components of an internal ML platform
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      If you were designing an internal ML platform for a dozen product teams, what would its core components
      be, and which would you build first?
    expected_concepts:
      - training orchestration and compute scheduling
      - experiment tracking and model registry
      - feature management
      - deployment and serving
      - monitoring and lineage
      - prioritising by team pain and adoption
    rubric:
      excellent: Names the main components with clear interfaces between them, prioritises by measured team pain, and plans adoption, ownership and the build-versus-adopt decision for each piece.
      good: Lists the right components and gives a reasonable order.
      weak: Lists tools without a plan, or tries to build everything at once.
    followups:
      - How would you measure whether the platform is succeeding?
    common_errors:
      - Designing the platform around tools rather than the workflows teams follow.

  - external_key: technical.ml_engineering.notebook_handoff
    competency_key: mlops
    topic: Productionising a notebook model
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A data scientist hands you a notebook that produces a good model and asks you to put it into production.
      What are your first steps?
    expected_concepts:
      - reproducing the result outside the notebook
      - extracting code into modules with tests
      - pinning data sources and dependencies
      - agreeing on serving requirements and metrics
      - working with the author rather than rewriting alone
    rubric:
      excellent: Reproduces the result first, refactors into tested, versioned code with the author, clarifies serving and monitoring requirements and keeps the original as a reference to compare outputs.
      good: Refactors the notebook into scripts, pins dependencies and adds tests.
      weak: Runs the notebook on a schedule as the production system.
    followups:
      - How would you confirm your refactored version matches the notebook's model?
    common_errors:
      - Rewriting everything without first reproducing the original result.

  - external_key: technical.ml_engineering.declarative_model_deploys
    competency_key: ci_cd
    topic: Declarative model deployments
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you manage model deployments declaratively, so that what's running in each environment is
      defined in version control?
    expected_concepts:
      - environment config referencing model versions
      - pull requests to promote a model
      - reconciliation tools that apply the desired state
      - rollback by reverting a commit
      - separating model artifacts from deployment config
    rubric:
      excellent: Defines environments in version control with pinned model versions, promotes through reviewed changes, uses automated reconciliation and explains rollback by revert.
      good: Keeps deployment configs in version control and promotes by changing them.
      weak: Deploys by running scripts by hand with no record of what is live.
    followups:
      - How would an automated retraining job fit into this flow?
    common_errors:
      - Referencing a floating latest tag, so what is deployed changes without a commit.

  - external_key: technical.ml_engineering.upstream_data_contracts
    competency_key: data_engineering
    topic: Data contracts with upstream producers
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you set up data contracts between the teams producing raw data and the ML pipelines that
      consume it?
    expected_concepts:
      - schema, semantics and freshness expectations
      - automated checks in the producer's CI
      - versioned contracts and change notice
      - clear ownership and escalation
      - consumer-driven tests
    rubric:
      excellent: Defines contracts covering schema, meaning, units and freshness, enforces them automatically on the producer side, versions changes with notice and names owners.
      good: Agrees schemas with producers and validates data on arrival.
      weak: Relies on informal agreements and fixes breakages after the fact.
    followups:
      - How do you get a producing team to care about a contract they don't benefit from?
    common_errors:
      - Validating only on the consumer side, so breakages are found after they ship.

  - external_key: technical.ml_engineering.run_to_run_variance
    competency_key: machine_learning
    topic: Nondeterminism between training runs
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Two training runs with the same code, data and seed give models whose metrics differ by a noticeable
      amount. What sources of nondeterminism would you look at, and how much determinism is worth paying for?
    expected_concepts:
      - nondeterministic GPU kernels and atomic operations
      - data loader ordering and worker seeding
      - distributed reduction order
      - library and driver version differences
      - measuring variance across seeds instead of single runs
      - performance cost of deterministic modes
    rubric:
      excellent: Lists concrete sources across kernels, data loading and distributed reductions, weighs the speed cost of deterministic settings, and argues for reporting variance over several seeds when comparing models.
      good: Names GPU nondeterminism and data ordering and knows deterministic settings exist.
      weak: Assumes setting a seed makes training fully deterministic.
    followups:
      - How many seeds would you run before claiming a model change helps?
    common_errors:
      - Declaring an improvement that is smaller than the run-to-run noise.

  - external_key: technical.ml_engineering.model_documentation
    competency_key: mlops
    topic: Documenting a model before launch
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What do you document about a model before it goes to production, and who actually reads that
      documentation?
    expected_concepts:
      - intended use and known limitations
      - training data and evaluation results including slices
      - inputs, outputs and dependencies
      - owners and on-call runbook
      - audiences such as on-call engineers, reviewers and product teams
    rubric:
      excellent: Documents intended use, limits, data, slice results, dependencies and runbooks, and tailors it to the people who use it, such as on-call engineers and reviewers.
      good: Documents data, metrics and owners in a model card or similar.
      weak: Documentation is the code or a slide deck that is never updated.
    followups:
      - How do you keep that documentation current after retraining?
    common_errors:
      - Writing documentation once at launch and never updating it.

  - external_key: technical.ml_engineering.sensitive_training_data_access
    competency_key: security
    topic: Protecting sensitive training data
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your training data includes customer records with personal information. How would you control access to
      that data and to the model artifacts across the ML pipeline?
    expected_concepts:
      - least-privilege access through roles and service accounts
      - masking, tokenisation or removing fields not needed
      - encryption at rest and in transit
      - audit logs of data access
      - models memorising data and artifact access control
      - retention and deletion requests
    rubric:
      excellent: Minimises sensitive fields before training, enforces least privilege with audited access, protects artifacts that may memorise data, and handles retention and deletion requests.
      good: Restricts access by role and encrypts or masks sensitive fields.
      weak: Copies production data into shared buckets or laptops for convenience.
    followups:
      - How would you handle a deletion request for data a model was already trained on?
    common_errors:
      - Protecting the raw data but leaving derived datasets and models open.

  - external_key: technical.ml_engineering.public_model_attacks
    competency_key: security
    topic: Defending a public prediction API
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Which attacks against a deployed model worry you most, such as model extraction, adversarial inputs or
      data poisoning, and how would you defend a public prediction API?
    expected_concepts:
      - extraction through many queries
      - adversarial or evasion inputs
      - poisoning through feedback data
      - rate limiting and query monitoring
      - returning less information such as labels instead of scores
      - validating feedback before it enters training
    rubric:
      excellent: Matches threats to the product, defends with rate limits, anomaly detection, reduced output detail and adversarial testing, and protects the retraining loop from poisoned feedback.
      good: Knows the main attack types and proposes rate limiting and input validation.
      weak: Treats the model as safe because the weights are private.
    followups:
      - How would you notice someone systematically probing your model?
    common_errors:
      - Exposing full probability scores that make extraction much easier.

  - external_key: technical.ml_engineering.zero_predictions_page
    competency_key: incident_response
    topic: On-call page for a model outage in one region
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're on call and get paged because a model's prediction volume dropped to zero for one region. Walk me
      through your first thirty minutes.
    expected_concepts:
      - confirming the alert and the scope of impact
      - checking recent deployments and config changes
      - tracing the request path for that region
      - mitigation through rollback or fallback first
      - communicating status to stakeholders
    rubric:
      excellent: Confirms scope quickly, checks recent changes, mitigates before root-causing, follows the request path for that region and keeps stakeholders informed with clear updates.
      good: Checks recent changes and logs and applies a fallback or rollback.
      weak: Starts debugging model code at random with no mitigation or communication.
    followups:
      - When would you roll back before you know the cause?
    common_errors:
      - Spending the first thirty minutes on root cause while the outage continues.

  - external_key: technical.ml_engineering.environment_promotion
    competency_key: ci_cd
    topic: Promoting models through environments
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you move a model from development to staging to production, and what's different about how you
      test it at each stage?
    expected_concepts:
      - same artifact promoted rather than retrained
      - integration tests in staging with realistic data
      - performance and load checks before production
      - staged rollout in production
      - approvals and audit
    rubric:
      excellent: Promotes one immutable artifact, explains the purpose of tests at each stage, uses realistic staging data and finishes with a staged production rollout.
      good: Describes environments with tests before production.
      weak: Retrains separately in each environment or deploys straight to production.
    followups:
      - What can staging never tell you about a model?
    common_errors:
      - Retraining per environment, so production runs a model that was never tested.

  - external_key: technical.ml_engineering.daily_ctr_retraining
    competency_key: system_design
    topic: Continuous training for a click-through model
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You need a continuous training setup for a click-through-rate model that retrains every day on fresh
      data. What would the main components be, and what failure modes would you design against?
    expected_concepts:
      - incremental data ingestion and validation
      - warm starting versus training from scratch
      - automated evaluation against the live model
      - staged deployment with rollback
      - delayed or missing clicks and label windows
      - pipeline failure handling and stale-model alerts
    rubric:
      excellent: Designs ingestion, validation, training, evaluation and deployment stages with label windows, warm-start choices and automated rollback, and handles failures such as missing data and stale models.
      good: Covers the main pipeline stages with evaluation and deployment gates.
      weak: Describes a cron job that retrains and overwrites the model.
    followups:
      - How long would you wait before counting an impression as not clicked?
    common_errors:
      - Training on yesterday's impressions before their clicks have arrived.

  - external_key: technical.ml_engineering.flaky_nightly_pipeline
    competency_key: mlops
    topic: Making an unreliable training pipeline reliable
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your nightly training pipeline fails about one night in five, each time for a different reason. How
      would you make it reliable?
    expected_concepts:
      - categorising failures over several weeks
      - retries for transient errors with idempotent steps
      - validation to fail fast on bad inputs
      - resource limits and capacity issues
      - alerting and ownership
    rubric:
      excellent: Collects and categorises failures first, fixes the largest categories, adds safe retries for transient errors and early validation, and sets alerting and ownership so issues are acted on.
      good: Adds retries and better error handling after looking at recent failures.
      weak: Reruns the pipeline by hand each morning.
    followups:
      - How would you tell a transient failure from a real bug automatically?
    common_errors:
      - Retrying every failure blindly, hiding real bugs behind eventual success.

  - external_key: technical.ml_engineering.training_on_kubernetes
    competency_key: kubernetes
    topic: Running training jobs on Kubernetes
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How have you run training jobs on Kubernetes, and what problems come up with GPUs, large datasets and
      long-running jobs there?
    expected_concepts:
      - GPU device plugins and resource requests
      - job operators for distributed training
      - gang scheduling so all workers start together
      - data access through volumes or streaming from storage
      - preemption, node failures and checkpointing
    rubric:
      excellent: Describes real experience with GPU scheduling, distributed job operators, gang scheduling, data access patterns and handling node loss for long jobs.
      good: Has run training as Kubernetes jobs and names GPU and data challenges.
      weak: Has no experience and no sense of the GPU or scheduling issues.
    followups:
      - What happens if only half of a distributed job's workers get scheduled?
    common_errors:
      - Ignoring gang scheduling, leaving partially started jobs holding GPUs.

  - external_key: technical.ml_engineering.inherited_ml_debt
    competency_key: mlops
    topic: Paying down ML technical debt
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You inherit a production ML system with undocumented features, hand-run retraining and several models
      feeding each other's inputs. How would you prioritise paying down that debt?
    expected_concepts:
      - mapping dependencies and data flows first
      - monitoring before refactoring
      - automating retraining with validation
      - untangling hidden model-to-model dependencies
      - removing unused features and dead code
      - risk-based prioritisation with stakeholders
    rubric:
      excellent: Maps the system and its dependencies, adds monitoring first to make change safe, prioritises by risk and business impact, and sequences automation, decoupling and cleanup with stakeholders.
      good: Proposes documenting, adding monitoring and automating retraining in a sensible order.
      weak: Proposes a full rewrite immediately.
    followups:
      - How would you justify the time to product stakeholders?
    common_errors:
      - Refactoring before there is monitoring to tell whether something broke.

  - external_key: technical.ml_engineering.large_artifacts_in_ci
    competency_key: mlops
    topic: Large model files slowing CI
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your CI pipeline slows to a crawl because every build pulls a model file several gigabytes in size. How
      would you restructure things?
    expected_concepts:
      - storing artifacts in a registry or object store, not the repository
      - caching artifacts on CI runners
      - small stand-in models for most tests
      - running full-model tests only where needed
      - referencing models by version
    rubric:
      excellent: Moves weights out of the code repository, caches them, uses small stand-in models for most tests and keeps full-model tests to targeted jobs.
      good: Caches the model or moves it to artifact storage.
      weak: Accepts the slowdown or removes the tests that need the model.
    followups:
      - Which tests genuinely need the real model?
    common_errors:
      - Committing model weights directly into the source repository.

  - external_key: technical.ml_engineering.accuracy_cost_decision
    competency_key: machine_learning
    topic: Weighing accuracy against serving cost
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your product team wants to deploy a model that is two points more accurate but costs three times as
      much to serve. How would you frame that decision?
    expected_concepts:
      - translating the accuracy gain into business value
      - full cost per prediction including infrastructure and operations
      - confirming the gain online, not only offline
      - cheaper alternatives such as distillation or routing
      - using the large model only where it matters
    rubric:
      excellent: Converts the gain and the cost into comparable business terms, validates the gain online, explores cheaper paths like distillation or selective routing and presents a clear recommendation.
      good: Compares business value with cost and considers optimising the larger model.
      weak: Picks the more accurate model automatically or rejects it on cost alone.
    followups:
      - How would you route only the hardest requests to the expensive model?
    common_errors:
      - Assuming an offline accuracy gain translates directly into business value.
