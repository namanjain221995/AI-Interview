# Curated questions: product management (part 3 of 4).
# Roadmaps, requirements and scoping, and working with engineering on technical trade-offs
# (estimates, build versus buy, non-functional requirements, dependencies, migrations).
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [product_manager]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.product_manager.outcome_vs_feature_roadmap
    competency_key: product_sense
    topic: Outcome-based versus feature-based roadmaps
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      In practice, how does a roadmap built around outcomes differ from one built around a list of
      features? Tell me which kind you've worked with and how it went.
    expected_concepts:
      - outcomes describe problems or measurable results, features describe solutions
      - outcome roadmaps leave room to change the solution
      - feature lists are easier for stakeholders to read but lock in answers early
      - combining outcomes with example bets underneath
      - how progress is reported for each
    rubric:
      excellent: Explains the practical differences, gives a real example of working with one or both, and describes how stakeholders reacted and what they adjusted.
      good: Explains the difference clearly with a real example.
      weak: Describes a roadmap only as a list of features with dates and cannot articulate an alternative.
    followups:
      - How did sales or leadership react to a roadmap without specific features?
      - How do you show progress on an outcome that hasn't moved yet?
    common_errors:
      - Relabelling features as outcomes without changing how decisions are made.

  - external_key: technical.product_manager.what_goes_in_a_spec
    competency_key: requirements_analysis
    topic: What a product spec should contain
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you hand a piece of work to engineering, what goes into your requirements document, and what do
      you deliberately leave out?
    expected_concepts:
      - the problem, users and why it matters
      - success measures and scope, including non-goals
      - key user flows and edge cases
      - open questions and constraints
      - leaving implementation choices to engineering
    rubric:
      excellent: Describes a clear structure grounded in a real spec, explains why they leave the how to engineering, and how the document evolves with the team's input.
      good: Covers problem, scope, success measures and main flows.
      weak: Describes either a one-line ticket or a document dictating the technical implementation.
    followups:
      - How do engineers and designers contribute to the document?
      - What part of your specs most often turns out to be missing?
    common_errors:
      - Omitting non-goals, so scope grows during the build.

  - external_key: technical.product_manager.shared_definition_of_done
    competency_key: requirements_analysis
    topic: Writing acceptance criteria
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you write acceptance criteria so that engineers, testers and you all agree on when a piece of
      work is done? Give me an example of criteria you've written.
    expected_concepts:
      - specific, testable conditions
      - covering error, empty and edge states
      - examples or given-when-then style scenarios
      - agreeing criteria with engineering and testing before work starts
      - avoiding implementation detail
    rubric:
      excellent: Gives concrete, testable criteria from real work including edge and error cases, and explains how they were agreed with the team before the build.
      good: Writes testable criteria with a reasonable example.
      weak: Gives vague criteria such as "works correctly" or "user-friendly".
    followups:
      - What do you do when a tester finds behaviour the criteria didn't cover?
      - How detailed do criteria need to be for a small change?
    common_errors:
      - Covering only the happy path.

  - external_key: technical.product_manager.first_version_scope
    competency_key: product_sense
    topic: Scoping a first version
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide what goes into the first version of a feature and what waits for later? Use
      something you've shipped as the example.
    expected_concepts:
      - the smallest scope that solves the core problem end to end
      - what you need to learn from the first release
      - quality bar that cannot be cut
      - deferring nice-to-haves with a plan to revisit
      - involving engineering and design in the cuts
    rubric:
      excellent: Explains the reasoning behind specific cuts in a real feature, ties the first version to a learning goal, and describes what happened when it launched.
      good: Explains scope cuts sensibly with a real example.
      weak: Ships everything at once or cuts so much that the first version doesn't solve the problem.
    followups:
      - What did you cut that you later regretted?
      - How did you explain the reduced scope to stakeholders?
    common_errors:
      - Treating the first version as a low-quality version rather than a smaller one.

  - external_key: technical.product_manager.customer_asks_for_date
    competency_key: communication
    topic: Answering roadmap date questions
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      On a call, a customer asks you exactly when a feature on your public roadmap will be ready, and you
      aren't sure yourself. How would you answer?
    expected_concepts:
      - not inventing a date to please the customer
      - sharing the current stage and level of certainty
      - understanding why the timing matters to them
      - offering to follow up with a firmer answer
      - keeping the account team informed
    rubric:
      excellent: Gives an accurate, non-committal answer, explores what the customer needs the date for, and commits to a specific follow-up.
      good: Avoids making up a date and offers to follow up.
      weak: Gives a specific date with no basis for it, or dismisses the question.
    followups:
      - What if the customer says the date decides their renewal?
      - How would you keep them updated afterwards?
    common_errors:
      - Quoting an optimistic date that then becomes a commitment.

  - external_key: technical.product_manager.estimate_much_larger
    competency_key: project_management
    topic: When an estimate is far larger than expected
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Engineering estimates a feature at three times what you had expected. How would you handle that
      conversation?
    expected_concepts:
      - asking what drives the estimate
      - finding which parts of the scope are expensive
      - exploring smaller or alternative versions
      - checking whether the value still justifies the cost
      - respecting the estimate rather than negotiating it down
    rubric:
      excellent: Explores the drivers of cost with engineering, looks for scope changes that keep most of the value, and re-evaluates the priority with the new cost.
      good: Asks about the estimate and considers reducing scope.
      weak: Pushes engineers to lower the estimate or accepts it without exploring options.
    followups:
      - What if the expensive part is the piece the customer cares about most?
      - How would you update stakeholders?
    common_errors:
      - Pressuring the team to shrink the estimate without changing the scope.

  - external_key: technical.product_manager.spec_missed_empty_state
    competency_key: requirements_analysis
    topic: Handling a gap found mid-build
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Halfway through a sprint, engineers find that your spec doesn't say what should happen when a new
      user has no data yet. How would you handle it, and what would you change in how you write specs?
    expected_concepts:
      - quick decision with design and engineering to unblock the team
      - checking impact on scope and timeline
      - updating the spec so it stays the source of truth
      - reviewing for other missing states
      - adding edge-case review to future specs
    rubric:
      excellent: Unblocks the team quickly with a sensible decision, updates documentation, checks for similar gaps, and names a concrete change to their spec process.
      good: Makes a decision with the team and updates the spec.
      weak: Leaves engineers to decide alone or blames them for not asking earlier.
    followups:
      - How do you review a spec for missing states before work starts?
      - Who should make the call in the moment?
    common_errors:
      - Fixing this one gap without asking what else the spec might be missing.

  # ---------------------------------------------------------------- medium
  - external_key: technical.product_manager.roadmap_time_horizons
    competency_key: project_management
    topic: Roadmap detail across time horizons
    difficulty: medium
    kind: technical
    text: >-
      How do you build a roadmap that's specific enough for teams to plan around, without pretending you
      know what you'll be building nine months from now?
    expected_concepts:
      - near-term items committed, later items as problems or themes
      - formats such as now, next and later
      - confidence levels made explicit
      - regular review cadence
      - distinguishing commitments from intentions in communication
    rubric:
      excellent: Describes a roadmap format with decreasing detail over time, explicit confidence, a review cadence, and how they handle stakeholders who want dates for later items.
      good: Explains a horizon-based roadmap and why it suits uncertainty.
      weak: Commits to detailed features and dates far into the future.
    followups:
      - How do you handle a stakeholder who needs a firm date for something marked later?
      - How often do you revise it, and what triggers a change?
    common_errors:
      - Presenting distant items with the same certainty as next month's work.

  - external_key: technical.product_manager.drop_item_sales_promised
    competency_key: stakeholder_management
    topic: Removing a roadmap item customers expect
    difficulty: medium
    kind: scenario
    text: >-
      You need to drop an item from the roadmap, but the sales team has already mentioned it to several
      customers. How would you handle the change?
    expected_concepts:
      - telling sales early, before customers find out elsewhere
      - explaining the reason clearly
      - identifying affected customers and their real needs
      - offering alternatives or workarounds
      - agreeing how roadmap items are shared externally in future
    rubric:
      excellent: Informs sales early with clear reasoning, works with them on a plan for each affected customer including alternatives, and fixes the process for external roadmap sharing.
      good: Communicates the change with reasons and supports the sales team.
      weak: Lets customers discover the change on their own, or keeps the item to avoid a difficult conversation.
    followups:
      - Would you join the customer calls yourself?
      - What would you change about how the roadmap is shared with sales?
    common_errors:
      - Telling sales only once the item is already late.

  - external_key: technical.product_manager.build_or_buy
    competency_key: problem_solving
    topic: Build versus buy decisions
    difficulty: medium
    kind: technical
    text: >-
      Walk me through how you'd decide whether to build a capability in-house or use a third-party
      service, using a decision you've been part of.
    expected_concepts:
      - whether the capability differentiates the product
      - total cost including maintenance and integration
      - time to market
      - vendor risks such as lock-in, pricing changes and data handling
      - fit with requirements and how much control is needed
    rubric:
      excellent: Describes a real decision with differentiation, total cost, timing and vendor risk weighed explicitly, and reflects on whether it was the right call.
      good: Covers the main factors with a reasonable example.
      weak: Decides on a single factor such as upfront cost.
    followups:
      - What would make you switch from the vendor to building it later?
      - How did you involve engineering and security in the decision?
    common_errors:
      - Comparing licence cost with build cost and ignoring ongoing maintenance.

  - external_key: technical.product_manager.non_functional_requirements
    competency_key: requirements_analysis
    topic: Non-functional requirements with engineering
    difficulty: medium
    kind: technical
    text: >-
      Beyond what a feature does, how do you work out requirements like speed, reliability or security
      with your engineers? Give me an example where getting this wrong would have hurt users.
    expected_concepts:
      - translating user expectations into measurable targets such as response time
      - expected load and growth
      - availability needs and what failure looks like for users
      - security and privacy requirements of the data involved
      - engineering proposes targets, product weighs cost against need
    rubric:
      excellent: Gives a concrete example with measurable targets derived from user needs, explains the trade-off conversation with engineering, and the consequence of missing them.
      good: Recognises the categories and gives a sensible example.
      weak: Leaves these entirely to engineering or states vague goals like "it should be fast".
    followups:
      - How did you decide what level of availability was enough?
      - How would you know after launch that the targets were met?
    common_errors:
      - Asking for maximum reliability everywhere without considering the cost.

  - external_key: technical.product_manager.six_week_rebuild_request
    competency_key: stakeholder_management
    topic: Evaluating a large engineering rebuild
    difficulty: medium
    kind: scenario
    text: >-
      Your tech lead says the team needs six weeks to rebuild a core service, with no visible change for
      users. How would you evaluate the request and explain your decision to stakeholders?
    expected_concepts:
      - understanding the problem the rebuild solves, such as incidents or slow delivery
      - quantifying cost of not doing it
      - exploring incremental alternatives
      - tying the outcome to user or business impact
      - explaining it to stakeholders in terms of risk and speed
    rubric:
      excellent: Digs into the evidence for the rebuild, explores incremental options with the tech lead, ties the decision to measurable impact, and explains it to stakeholders in business terms.
      good: Takes the request seriously, asks for evidence and communicates the decision.
      weak: Refuses because users won't see anything, or approves without understanding why.
    followups:
      - How would you measure whether the rebuild delivered what was promised?
      - What if the evidence is mostly the team's frustration with the code?
    common_errors:
      - Accepting an all-or-nothing rewrite without exploring a staged approach.

  - external_key: technical.product_manager.quick_or_scalable_option
    competency_key: product_sense
    topic: Choosing between a quick and a scalable build
    difficulty: medium
    kind: scenario
    text: >-
      Engineering offers you two options: a quick version in two weeks that won't cope beyond current
      volumes, or a robust version in two months. How would you decide?
    expected_concepts:
      - how soon volume will exceed the quick version's limit
      - what you'll learn from shipping early
      - cost and risk of rework later
      - whether the quick version can be evolved or must be thrown away
      - agreeing a trigger for building the robust version
    rubric:
      excellent: Weighs learning speed against growth timelines and rework cost, considers whether the quick path is evolvable, and sets an explicit trigger for the follow-up work.
      good: Considers volume growth and rework and makes a reasoned choice.
      weak: Always picks the fastest option or always the most robust without analysis.
    followups:
      - How would you make sure the follow-up work actually gets scheduled?
      - What would a middle option look like?
    common_errors:
      - Choosing the quick version without agreeing when the robust one will be built.

  - external_key: technical.product_manager.technical_depth_changed_decision
    competency_key: communication
    topic: Technical understanding shaping product decisions
    difficulty: medium
    kind: technical
    text: >-
      How deep do you go into the technical design of the features your team builds? Give me an example
      where understanding the technical detail changed a product decision.
    expected_concepts:
      - understanding architecture at the level that affects user experience and cost
      - asking engineers to explain constraints and options
      - spotting cheaper alternatives that meet the need
      - knowing when to defer to engineering judgement
      - translating technical constraints for stakeholders
    rubric:
      excellent: Gives a concrete example where their technical understanding led to a better scope or trade-off, and is clear about where they defer to engineers.
      good: Shows a working understanding of their team's system and a relevant example.
      weak: Shows no interest in technical detail, or tries to make engineering decisions for the team.
    followups:
      - How did you build that technical understanding?
      - When have you gone too deep and got in the team's way?
    common_errors:
      - Confusing technical understanding with dictating the implementation.

  - external_key: technical.product_manager.public_api_as_product
    competency_key: product_sense
    topic: Managing an API as a product
    difficulty: medium
    kind: technical
    text: >-
      If you were managing a public API as a product, how would your approach to changes and releases
      differ from managing a user-facing app?
    expected_concepts:
      - developers as users with integration costs
      - backward compatibility and versioning
      - deprecation policies with long notice periods
      - documentation and developer experience as part of the product
      - usage metrics such as active integrations and error rates
    rubric:
      excellent: Explains why breaking changes are costly for API consumers, describes versioning and deprecation practices, and names how they would measure the API's success.
      good: Recognises compatibility and documentation needs.
      weak: Treats API changes like UI changes that can be shipped and adjusted freely.
    followups:
      - How would you handle a breaking change your largest customer depends on?
      - How would you learn what developers struggle with?
    common_errors:
      - Removing or changing fields without a deprecation period.

  - external_key: technical.product_manager.dependency_deprioritised
    competency_key: project_management
    topic: A dependency is deprioritised by another team
    difficulty: medium
    kind: scenario
    text: >-
      Your launch depends on another team's work, and that team has just told you they've deprioritised it.
      What would you do?
    expected_concepts:
      - understanding their reasons and priorities
      - quantifying the impact on your launch and goals
      - options such as your team doing the work, scope changes or a workaround
      - escalating with data if priorities truly conflict
      - updating your own stakeholders and plan
    rubric:
      excellent: Understands the other team's position, quantifies impact, explores several options including doing the work themselves, escalates appropriately and updates their plan.
      good: Negotiates with the other team and considers alternatives.
      weak: Escalates immediately without understanding, or silently lets the launch slip.
    followups:
      - How would you avoid being surprised like this next time?
      - What would you need to make the case to leadership?
    common_errors:
      - Escalating before talking to the other team's product manager.

  - external_key: technical.product_manager.slice_by_user_value
    competency_key: project_management
    topic: Slicing large features into usable increments
    difficulty: medium
    kind: technical
    text: >-
      How do you break a large feature into smaller pieces that each deliver something usable, rather than
      slicing it by technical layer like database first, then backend, then interface?
    expected_concepts:
      - thin end-to-end slices through the user journey
      - starting with the simplest path, then adding cases
      - each slice releasable or testable with users
      - ordering slices by learning and risk
      - working with engineering on what can be released safely
    rubric:
      excellent: Explains vertical slicing with a real example, shows how slices were ordered for learning and risk, and what was learned from early slices.
      good: Explains user-value slicing with a reasonable example.
      weak: Breaks work into technical tasks that deliver nothing usable until the end.
    followups:
      - What do you do when a slice can't be released to users on its own?
      - How did early slices change the later plan?
    common_errors:
      - Calling a backend-only milestone a release.

  - external_key: technical.product_manager.planning_under_uncertainty
    competency_key: project_management
    topic: Planning when the approach is unknown
    difficulty: medium
    kind: technical
    text: >-
      When engineering can't estimate something because the technical approach is still unclear, how do you
      handle planning around that uncertainty?
    expected_concepts:
      - time-boxed technical investigation or spike
      - defining the questions the investigation must answer
      - ranges rather than single estimates
      - sequencing risky parts first
      - communicating uncertainty to stakeholders
    rubric:
      excellent: Describes time-boxed investigations with clear questions, how they communicate ranges and risk, and a real example where this changed the plan.
      good: Uses spikes or ranges sensibly.
      weak: Demands a fixed estimate anyway or plans without addressing the uncertainty.
    followups:
      - What if the spike comes back with no clear answer?
      - How do you explain a range estimate to a stakeholder who wants one date?
    common_errors:
      - Letting an investigation run open-ended with no time box.

  - external_key: technical.product_manager.personalisation_privacy_concerns
    competency_key: product_sense
    topic: Using customer data responsibly
    difficulty: medium
    kind: scenario
    text: >-
      Your team wants to use customer usage data to power a new personalised feature, and your privacy and
      legal colleagues have raised concerns. How would you work through it?
    expected_concepts:
      - understanding the specific concerns and applicable rules
      - minimising data collected and how long it is kept
      - transparency and user control such as opt-out
      - adjusting the design rather than working around the concern
      - involving privacy early in future features
    rubric:
      excellent: Engages with the concerns early, adjusts the design through data minimisation, transparency and user control, and treats privacy as a product requirement.
      good: Works with legal to find an acceptable design.
      weak: Treats the concerns as a blocker to get around, or abandons the feature without exploring options.
    followups:
      - How would users see what data is used and why?
      - What would you measure to know users are comfortable with it?
    common_errors:
      - Bringing privacy colleagues in only after the feature is built.

  # ------------------------------------------------------------------ hard
  - external_key: technical.product_manager.strategy_to_roadmap
    competency_key: product_sense
    topic: Connecting strategy to the roadmap
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you connect a product strategy to a roadmap, so that someone reading the roadmap can see why
      each item is there? Walk me through one you've built.
    expected_concepts:
      - a clear strategy with target customers, problems and differentiators
      - themes or goals linking strategy to roadmap items
      - explicit choices about what not to do
      - each item traced to a goal and expected impact
      - revisiting the roadmap when the strategy or evidence changes
    rubric:
      excellent: Walks through a real strategy and roadmap with a clear chain from choices to themes to items, including what was deliberately excluded and how it was revised.
      good: Shows a reasonable link between strategy and roadmap items.
      weak: Presents a roadmap as a collection of requests with no strategic logic.
    followups:
      - What did you leave off the roadmap because of the strategy?
      - How did you handle an important request that didn't fit any theme?
    common_errors:
      - Writing a strategy so broad that every request appears to fit it.

  - external_key: technical.product_manager.migrate_to_rebuilt_product
    competency_key: project_management
    topic: Migrating customers to a rebuilt product
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your company has to move customers from an old version of the product to a rebuilt one, and some
      customers rely on features the new version doesn't have yet. How would you plan the migration?
    expected_concepts:
      - mapping which customers use which features
      - migrating in waves, starting with customers whose needs are fully covered
      - closing feature gaps or providing workarounds for later waves
      - running both versions and the cost of doing so
      - clear communication, timelines and support for customers
      - success and rollback criteria per wave
    rubric:
      excellent: Builds a usage-based migration plan in waves, deals with feature gaps explicitly, accounts for the cost of running both versions, and defines communication, success and rollback criteria.
      good: Plans a phased migration with attention to feature gaps.
      weak: Proposes a single cut-over date, or rebuilding every old feature before migrating anyone.
    followups:
      - How would you decide which old features never get rebuilt?
      - What would you do with a large customer who refuses to move?
    common_errors:
      - Assuming every feature in the old product must be rebuilt.

  - external_key: technical.product_manager.unowned_performance_decline
    competency_key: product_sense
    topic: Making the case for performance work
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your product's pages have become noticeably slower over the past year, but no one owns performance and
      every team has feature commitments. How would you make the case and get it fixed?
    expected_concepts:
      - measuring real user performance and its trend
      - linking speed to conversion, engagement or support
      - finding the main causes with engineering
      - proposing ownership, budgets or targets across teams
      - quick wins alongside a longer plan
    rubric:
      excellent: Quantifies the decline and its business impact, works with engineering to find causes, proposes lasting ownership such as performance budgets, and plans both quick wins and structural work.
      good: Builds a data-backed case and proposes a plan.
      weak: Asks for a one-off cleanup sprint without measurement or lasting ownership.
    followups:
      - How would you stop performance from slipping again?
      - What if you can't show a direct link to revenue?
    common_errors:
      - Fixing it once without putting anything in place to prevent the next decline.

  - external_key: technical.product_manager.influenced_architecture
    competency_key: problem_solving
    topic: Product influence on architecture decisions
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Tell me about a technical architecture decision where you, as product manager, meaningfully
      influenced the outcome. What product considerations did you bring, and how did it turn out?
    expected_concepts:
      - future product direction affecting flexibility needs
      - expected scale and usage patterns
      - cost, time to market and reversibility
      - customer requirements such as data location or integrations
      - respecting engineering ownership of the final design
    rubric:
      excellent: Describes a specific decision where they contributed product context that changed the design, explains the trade-offs and reflects on the outcome.
      good: Gives a credible example of contributing useful context.
      weak: Cannot give an example, or describes overriding engineers on technical choices.
    followups:
      - What would have happened without your input?
      - How did you know which information engineers needed from you?
    common_errors:
      - Over-specifying future needs and pushing the team into unnecessary complexity.

  - external_key: technical.product_manager.annual_roadmap_for_board
    competency_key: stakeholder_management
    topic: Long-range roadmap in a fast-changing market
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Leadership asks you for a twelve-month roadmap with dates for a board presentation, but your product
      is in a fast-moving market. How would you meet their need without committing to things you can't
      know?
    expected_concepts:
      - understanding what the board needs to decide or see
      - committing to outcomes and investment areas rather than detailed features
      - firm near-term milestones with clearly marked uncertainty later
      - scenarios or decision points tied to market signals
      - a plan to update leadership as things change
    rubric:
      excellent: Starts from what the board needs, provides firm near-term commitments and outcome-based later themes with explicit decision points, and sets expectations for revisions.
      good: Offers a roadmap that balances commitments with stated uncertainty.
      weak: Produces a detailed dated feature list for the full year or refuses the request.
    followups:
      - How would you present a change to that roadmap three months later?
      - What would you do if leadership insisted on feature-level dates?
    common_errors:
      - Treating a request for dates as a request for a full feature list.

  - external_key: technical.product_manager.language_model_feature_quality
    competency_key: product_sense
    topic: Quality bar for a language-model feature
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Suppose your team is adding a feature powered by a large language model. How would you define the
      quality bar for launch, and how would the product handle cases where the model gets it wrong?
    expected_concepts:
      - evaluation sets based on real user tasks
      - defining acceptable error rates by type and severity
      - design for failure such as review steps, citations or easy correction
      - monitoring quality, cost and latency after launch
      - collecting user feedback to improve the evaluation
    rubric:
      excellent: Defines task-based evaluation with severity-weighted error thresholds, designs the experience around mistakes, and plans ongoing monitoring of quality, cost and latency.
      good: Proposes testing against examples and some safeguards in the product.
      weak: Relies on demos or expects the model to be correct without measurement.
    followups:
      - Which kinds of mistake would block launch, and which would you accept?
      - How would you know quality is degrading after launch?
    common_errors:
      - Judging quality from a handful of impressive demo examples.
