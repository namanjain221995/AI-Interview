# Curated questions: mobile engineering, part 3.
# Testing, declarative UI, analytics, auth, uploads, paging, state management, OTA updates, accessibility,
# location, release trains, encryption, data integrity, cross-platform migration and resilience.
# round_types follow difficulty: easy -> screening/combined, medium -> all three, hard -> deep/combined.
version: 1
defaults:
  role_tags: [mobile]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.mobile.test_strategy_layers
    competency_key: testing
    topic: Mobile test strategy
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you split testing in a mobile app between unit tests, integration tests and UI tests run on a device?
      What do you put at each level in the apps you've worked on?
    expected_concepts:
      - fast unit tests for state holders, view models and business logic
      - integration tests for repositories, database and networking with fakes
      - a smaller set of UI tests (Espresso, XCUITest, Detox, integration_test) for critical flows
      - device and emulator costs and flakiness
      - running tests in CI on every change
    rubric:
      excellent: Describes a balanced split with concrete examples per level, explains why UI tests are kept to critical journeys, and how tests run in CI.
      good: Writes unit tests for logic plus some UI tests for main flows.
      weak: Relies only on manual testing or only on slow end-to-end UI tests.
    followups:
      - How do you test code that talks to the camera or location services?
      - What would you test first in an app with no tests at all?
    common_errors:
      - Putting business logic in views so it can only be tested through the UI.

  - external_key: technical.mobile.secrets_in_app_binary
    competency_key: security
    topic: Secrets in the app binary
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A teammate wants to put a third-party API key with billing access directly into the app's source code.
      What would you tell them, and what would you do instead?
    expected_concepts:
      - anything in the binary can be extracted by decompiling
      - obfuscation only slows attackers down
      - proxy sensitive calls through your backend
      - restrict keys by app signature or bundle id and scope
      - rotate keys and monitor usage
    rubric:
      excellent: Explains that shipped secrets are effectively public, routes privileged calls through the backend, restricts and scopes any unavoidable client keys, and plans for rotation and monitoring.
      good: Recommends moving the call behind the backend and explains why.
      weak: Suggests hiding the key in a config file, native code or obfuscation and considers it safe.
    followups:
      - Some SDKs genuinely require a client key. How do you limit the damage if it leaks?
      - How would you find secrets already committed in the codebase?
    common_errors:
      - Believing a key in native code or resources cannot be read.

  - external_key: technical.mobile.crash_on_older_os
    competency_key: debugging
    topic: OS version compatibility
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      After a release, the app crashes on launch for everyone on an older OS version you still support, but works fine on newer ones.
      What would you check first?
    expected_concepts:
      - APIs used that are unavailable below a certain OS version
      - availability checks and lint warnings (NewApi, available checks)
      - library updates that raised their minimum version
      - testing on the minimum supported OS in CI or device labs
      - deciding whether to raise the minimum version
    rubric:
      excellent: Suspects an unguarded newer API or a dependency raising its minimum, confirms from the stack trace, adds availability checks, and adds the minimum OS to the test matrix.
      good: Identifies a newer API call and guards it with a version check.
      weak: Proposes dropping support for the older version immediately without investigating.
    followups:
      - How would you decide when it's time to raise the minimum supported version?
      - Which tools can warn you about this before release?
    common_errors:
      - Suppressing the lint warning instead of guarding the call.

  - external_key: technical.mobile.declarative_ui_state
    competency_key: mobile_development
    topic: Declarative UI and state
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      In Jetpack Compose or SwiftUI, how does a change in state make the screen update, and what's the difference between
      state that a view owns and state that's passed into it?
    expected_concepts:
      - UI as a function of state
      - recomposition or view body re-evaluation when observed state changes
      - remember or State versus Observable or StateFlow from a state holder
      - state hoisting to make components reusable and testable
      - avoiding side effects in composables or view bodies
    rubric:
      excellent: Explains observed state triggering re-evaluation, contrasts local and hoisted state with reasons to hoist, and warns about side effects in rendering code.
      good: Knows state changes trigger the UI to update and can describe local versus passed-in state.
      weak: Mutates views imperatively or cannot explain what triggers an update.
    followups:
      - Where would you start a network request in a Compose or SwiftUI screen?
      - Why might a list item recompose far more often than you expect?
    common_errors:
      - Starting network calls directly inside the composable or view body.

  - external_key: technical.mobile.low_push_opt_in
    competency_key: mobile_development
    topic: Notification opt-in
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Only about a third of new iOS users allow notifications, and the product team wants that number higher.
      What would you change in the app, and how would you know it worked?
    expected_concepts:
      - pre-permission explanation at a moment of clear value
      - delay the system prompt instead of asking at first launch
      - provisional authorisation on iOS
      - in-app settings and re-engagement for users who declined
      - A/B test and measure opt-in plus long-term retention
    rubric:
      excellent: Moves the prompt to a value moment with a soft pre-prompt, considers provisional notifications, measures with an experiment and also watches for users disabling notifications later.
      good: Delays the prompt and explains the value before asking.
      weak: Shows the prompt repeatedly or tricks users into accepting.
    followups:
      - How would you bring back users who said no the first time?
      - What would make you stop sending a particular type of notification?
    common_errors:
      - Asking for permission on the first screen before the user understands the app.

  - external_key: technical.mobile.analytics_event_design
    competency_key: mobile_development
    topic: Analytics and instrumentation
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      The product team asks you to add analytics to a new checkout flow. How do you decide which events to track,
      and how do you implement them so the data is trustworthy?
    expected_concepts:
      - start from the questions the team wants answered (funnel steps)
      - consistent naming and a tracking plan
      - a single analytics wrapper instead of SDK calls everywhere
      - offline batching and delivery
      - no personal data in events and respecting user consent
      - verifying events in debug and QA
    rubric:
      excellent: Derives events from the funnel questions, uses a tracking plan and an abstraction layer, batches offline, avoids personal data and verifies events before release.
      good: Tracks the main funnel steps through a shared wrapper with consistent names.
      weak: Logs everything ad hoc or sends raw user data such as emails in events.
    followups:
      - How do you stop event names drifting between iOS and Android?
      - How would you respect a user who opts out of tracking?
    common_errors:
      - Calling the analytics SDK directly from dozens of screens with inconsistent names.

  - external_key: technical.mobile.localized_text_overflow
    competency_key: mobile_development
    topic: Localisation and layout
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Right after you add German and Arabic translations, testers report cut-off buttons and some screens that look mirrored wrong.
      How would you fix these and avoid them in the future?
    expected_concepts:
      - flexible layouts that grow with text
      - right-to-left support with start and end instead of left and right
      - mirroring icons where appropriate
      - pseudo-localisation and long-string testing
      - screenshot tests across locales
    rubric:
      excellent: Fixes fixed-width layouts, uses leading and trailing constraints for right-to-left, handles icon mirroring and adds pseudo-localisation and multi-locale screenshot tests.
      good: Makes layouts flexible and uses start and end alignment.
      weak: Shortens the translated strings or hard-codes sizes per language.
    followups:
      - Which icons should not be mirrored in a right-to-left layout?
      - How would you catch these problems before translations arrive?
    common_errors:
      - Using left and right margins instead of start and end.

  # ------------------------------------------------------------------ medium
  - external_key: technical.mobile.dependency_injection
    competency_key: code_quality
    topic: Dependency injection on mobile
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you wire up dependencies in your mobile apps, and what do you gain or lose with a framework like Hilt,
      Koin or a hand-rolled container compared with doing it manually?
    expected_concepts:
      - constructor injection and depending on interfaces
      - scopes tied to app, activity, screen or user session
      - compile-time versus runtime resolution trade-offs
      - testability by swapping fakes
      - startup cost and build-time cost
    rubric:
      excellent: Explains constructor injection and scoping with a real example, compares compile-time and runtime frameworks with their costs, and shows how it helps tests and user-session scoping.
      good: Uses a DI framework and can explain scopes and testing benefits.
      weak: Uses service locators or singletons everywhere and cannot explain the trade-offs.
    followups:
      - How would you scope objects to the logged-in user so they reset on logout?
      - When is a DI framework overkill?
    common_errors:
      - Making everything a singleton for convenience.

  - external_key: technical.mobile.flaky_ui_tests
    competency_key: testing
    topic: Flaky UI tests
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team's UI test suite fails randomly about one run in five in CI, and people have started ignoring it.
      How would you get it back to a state people trust?
    expected_concepts:
      - track flakiness per test and quarantine offenders
      - replace sleeps with proper synchronisation (idling resources, expectations)
      - hermetic tests with mocked network and seeded data
      - disable animations and control device state
      - shard and retry carefully without hiding real failures
    rubric:
      excellent: Measures flakiness per test, quarantines and fixes root causes like timing, shared state and real network calls, makes tests hermetic and sets a policy so new flakes are handled quickly.
      good: Removes sleeps, mocks the network and isolates tests.
      weak: Adds automatic retries everywhere or disables the suite.
    followups:
      - When is a retry acceptable, and when does it hide a real bug?
      - How would you stop new flaky tests from being merged?
    common_errors:
      - Using fixed sleeps to wait for UI to settle.

  - external_key: technical.mobile.biometric_unlock
    competency_key: security
    topic: Biometric authentication
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're adding Face ID and fingerprint unlock to a finance app. How would you implement it so it actually protects
      the user's credentials instead of just showing a prompt?
    expected_concepts:
      - bind a key or Keychain item to biometric authentication (access control flags, CryptoObject)
      - cryptographic operation only after successful biometric check
      - invalidation when new biometrics are enrolled
      - fallback to device passcode or app PIN
      - server session still required and revocable
    rubric:
      excellent: Ties a hardware-backed key or Keychain item to biometric access control so secrets are only released after authentication, handles enrolment changes and fallbacks, and keeps the server session revocable.
      good: Uses the biometric APIs with secure storage and handles fallback.
      weak: Treats a boolean success callback as authentication, which is trivially bypassed on a compromised device.
    followups:
      - What should happen when the user adds a new fingerprint?
      - How does this change on devices with only weak biometrics?
    common_errors:
      - Gating access on a success callback with no cryptographic binding.

  - external_key: technical.mobile.resumable_video_upload
    competency_key: mobile_development
    topic: Large uploads
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Users record five-minute videos in your app and upload them, often on mobile data. Uploads fail a lot and restart from zero.
      How would you redesign the upload?
    expected_concepts:
      - chunked or resumable upload protocol (tus, multipart, resumable sessions)
      - background transfer sessions or WorkManager with constraints
      - persisting upload progress and resuming after app kill
      - compression or transcoding before upload
      - network type preferences and user-visible progress
    rubric:
      excellent: Uses a resumable chunked protocol with persisted progress, runs uploads with background transfer APIs, compresses first, respects network preferences and shows clear progress and retry states.
      good: Splits uploads into chunks and retries failed parts in the background.
      weak: Simply increases the timeout or keeps retrying the whole file.
    followups:
      - What happens if the user deletes the video while it's uploading?
      - How would the server know which chunks it already has?
    common_errors:
      - Running the upload in a normal in-app request that dies when the app is suspended.

  - external_key: technical.mobile.paging_with_local_cache
    competency_key: mobile_development
    topic: Pagination and local caching
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you implement an infinite feed that loads pages from the API, works offline from cached pages and doesn't
      show duplicates when new items arrive at the top?
    expected_concepts:
      - cursor-based pagination rather than offsets
      - database as the single source of truth with a paging layer (Paging 3 RemoteMediator or similar)
      - stable item ids and de-duplication
      - refresh and prepend handling
      - cache expiry and limiting stored pages
    rubric:
      excellent: Uses cursor pagination with the database as the source of truth, de-duplicates by stable ids, handles refresh and prepend, and limits cache size.
      good: Uses a paging library with cursor pagination and caches pages locally.
      weak: Uses offset pagination and keeps everything in memory, producing duplicates or gaps.
    followups:
      - Why do offset-based pages cause duplicates in a live feed?
      - How do you restore the user's scroll position after process death?
    common_errors:
      - Using page numbers on a feed where items are inserted constantly.

  - external_key: technical.mobile.rn_animation_stutter
    competency_key: mobile_development
    topic: React Native performance
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a React Native app, animations stutter and taps feel delayed whenever a large list of data finishes loading.
      How would you diagnose and fix it?
    expected_concepts:
      - JS thread busy with processing and re-renders
      - profiling with React DevTools profiler and performance monitor
      - memoisation and avoiding unnecessary re-renders
      - FlatList or FlashList tuning with stable keys
      - native driver or Reanimated worklets for animations
      - moving heavy processing off the JS thread or to native
    rubric:
      excellent: Identifies a saturated JS thread, profiles renders, reduces re-renders and list cost, runs animations on the UI thread with the native driver or Reanimated and moves heavy work out of the render path.
      good: Uses the native driver and reduces unnecessary re-renders.
      weak: Blames React Native in general and suggests rewriting natively without profiling.
    followups:
      - How can you tell whether the JS thread or the UI thread is the bottleneck?
      - Why does a new inline function in props matter for list items?
    common_errors:
      - Running animations on the JS thread while it does heavy data processing.

  - external_key: technical.mobile.flutter_state_management
    competency_key: mobile_development
    topic: Flutter state management
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      There are many state management options in Flutter, such as Provider, Riverpod and Bloc. Which have you used, and how
      would you choose one for a medium-sized app with a team of five?
    expected_concepts:
      - ephemeral versus app state
      - separation of business logic from widgets
      - testability and predictability of state changes
      - dependency scoping and disposal
      - team familiarity and consistency over novelty
    rubric:
      excellent: Distinguishes local and shared state, compares options on testability, boilerplate, scoping and team fit with real experience, and stresses one consistent approach.
      good: Has used at least one approach well and can justify it for the scenario.
      weak: Uses setState for everything or picks a library without any reasoning.
    followups:
      - How would you test a Bloc or Riverpod provider without widgets?
      - What would you do if the team is already split across two approaches?
    common_errors:
      - Mixing several state management libraries without a convention.

  - external_key: technical.mobile.silent_push_sync_unreliable
    competency_key: mobile_development
    topic: Background sync via silent push
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your iOS app uses silent push notifications to trigger a background data sync, but in production a lot of those syncs
      never seem to run. Why might that be, and what would you do?
    expected_concepts:
      - silent pushes are throttled and low priority
      - not delivered if the user force-quit the app
      - limited execution time and low power mode effects
      - combine with background app refresh and sync on open
      - visible notifications for truly time-sensitive content
    rubric:
      excellent: Explains platform throttling, force-quit and time limits, treats silent push as a hint rather than a guarantee and designs sync that also runs on launch and via background refresh.
      good: Knows silent pushes are not guaranteed and adds a fallback sync.
      weak: Expects every silent push to wake the app and tries sending more of them.
    followups:
      - How would you measure how many silent pushes actually wake the app?
      - What would be different on Android with FCM data messages?
    common_errors:
      - Sending more silent pushes, which leads to more throttling.

  - external_key: technical.mobile.over_the_air_updates
    competency_key: mobile_development
    topic: Over-the-air code updates
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some cross-platform apps ship JavaScript or Dart updates over the air without a store release.
      How does that work, and what rules and risks would you put around using it?
    expected_concepts:
      - replacing the script bundle while the native binary stays fixed
      - store policies allow only non-native changes that don't alter app purpose
      - bundle compatibility with the native version
      - staged rollouts and automatic rollback on crashes
      - signing and integrity of update bundles
    rubric:
      excellent: Explains what can and cannot be changed, ties bundles to native versions, follows store policies and adds staged rollout, signing and rollback.
      good: Understands the mechanism and the need to match native versions and stay within store rules.
      weak: Treats over-the-air updates as a way to bypass store review for any change.
    followups:
      - An update needs a new native module. What happens if you ship it over the air?
      - How would you roll back a bad over-the-air update?
    common_errors:
      - Shipping a bundle that calls native code missing from older binaries.

  - external_key: technical.mobile.large_text_and_accessibility
    competency_key: accessibility
    topic: Dynamic type and accessible layouts
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you build screens that still work when a user sets the largest system font size, uses a screen reader
      or needs high contrast? Tell me about an app where you had to get this right.
    expected_concepts:
      - scalable text units (Dynamic Type, sp) and layouts that reflow
      - minimum touch target sizes
      - semantic labels, headings and focus order
      - colour contrast and not relying on colour alone
      - testing with accessibility tools and real settings
    rubric:
      excellent: Gives a concrete example covering scalable text with reflowing layouts, touch targets, semantics, contrast, and a testing approach using platform tools and real settings.
      good: Supports scalable text and adds labels for screen readers.
      weak: Fixes font sizes or treats accessibility as an afterthought with no testing.
    followups:
      - A design only fits on one line at default size. How do you handle the largest setting?
      - How do you make accessibility part of the definition of done?
    common_errors:
      - Capping text scaling to protect the layout.

  - external_key: technical.mobile.location_tracking_battery
    competency_key: mobile_development
    topic: Location tracking
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're building a courier app that needs to track drivers during their shift. How would you get reliable location
      updates without killing the battery, and how do you deal with the platform restrictions?
    expected_concepts:
      - foreground service with notification on Android, background location mode on iOS
      - accuracy and interval tuning, significant change or geofencing
      - batching uploads of location points
      - permission levels (while in use versus always) and justification
      - handling gaps, bad fixes and app kills
    rubric:
      excellent: Uses the right platform mechanisms with clear user disclosure, tunes accuracy and frequency to the use case, batches network traffic, handles noisy or missing points and stops tracking outside the shift.
      good: Uses a foreground service or background mode with reasonable accuracy settings.
      weak: Requests always-on high-accuracy GPS with frequent single uploads.
    followups:
      - How would you detect and discard a location point that jumps two kilometres?
      - What happens if the OS kills the app mid-shift?
    common_errors:
      - Keeping high-accuracy GPS on when the driver is stationary.

  - external_key: technical.mobile.release_train_design
    competency_key: mobile_development
    topic: Release cadence
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Twenty engineers across four teams ship to the same app, and releases keep slipping because one feature isn't ready.
      How would you set up the release process?
    expected_concepts:
      - fixed-cadence release train with a branch cut
      - feature flags so unfinished work ships dark
      - release owner and checklist, regression and QA window
      - beta channels (TestFlight, internal testing tracks)
      - staged rollout and monitoring gates
    rubric:
      excellent: Proposes a fixed train with branch cuts, feature flags to decouple shipping from launching, a rotating release owner, beta testing and staged rollout with health gates.
      good: Suggests a regular release schedule and feature flags for unfinished work.
      weak: Keeps waiting for features or ships whenever someone asks.
    followups:
      - A critical bug is found after the branch cut. How does it get into the release?
      - How do you clean up feature flags once features launch?
    common_errors:
      - Holding the whole release for a single late feature.

  # ------------------------------------------------------------------ hard
  - external_key: technical.mobile.encrypting_local_data
    competency_key: security
    topic: Protecting sensitive data at rest
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      A healthcare client requires that patient records cached on the phone are protected at rest.
      How would you design that, including where the keys live and what happens with backups?
    expected_concepts:
      - platform file protection classes and encryption at rest
      - database encryption (SQLCipher or similar) with keys in Keystore or Keychain
      - hardware-backed keys and when keys become available
      - excluding sensitive files from backups
      - minimising cached data and wiping on logout or remote revoke
      - screenshots and app switcher snapshots
    rubric:
      excellent: Layers OS data protection with database encryption using hardware-backed keys, controls backups, minimises and expires cached data, and covers snapshot leaks and remote wipe.
      good: Encrypts the database with a key stored in Keychain or Keystore and excludes it from backups.
      weak: Hard-codes an encryption key in the app or assumes device encryption covers every case.
    followups:
      - The app needs to sync in the background while the phone is locked. How does that affect your key choices?
      - What do you do if the Keystore key is invalidated?
    common_errors:
      - Storing the database encryption key next to the database.

  - external_key: technical.mobile.local_data_corruption
    competency_key: debugging
    topic: Local data integrity
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After an update, a small but growing number of users report missing or garbled data, and some crash reports show database
      errors on open. How would you investigate and protect users while you do?
    expected_concepts:
      - correlate with app version, migration path and device storage state
      - concurrent access from multiple processes or connections
      - writes interrupted by app kill without transactions
      - integrity checks and safe recovery or re-sync from server
      - halt rollout and ship mitigation
    rubric:
      excellent: Correlates reports with migration paths and storage conditions, looks for unsafe concurrent or non-transactional writes, adds integrity checks and recovery from the server, and halts the rollout while fixing.
      good: Suspects the migration or concurrent writes and adds recovery logic.
      weak: Asks users to reinstall the app as the fix.
    followups:
      - How would you reproduce a corruption that depends on the app being killed mid-write?
      - What data can you safely rebuild from the server and what can't you?
    common_errors:
      - Opening the same database from several processes without coordination.

  - external_key: technical.mobile.rn_new_arch_migration
    competency_key: mobile_development
    topic: Migrating to the React Native new architecture
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You own a large React Native app still on the old architecture with dozens of third-party native libraries.
      How would you plan and de-risk moving it to the new architecture?
    expected_concepts:
      - audit libraries for new architecture support and interop layer
      - upgrade React Native incrementally and keep native code compiling
      - migrate in-house modules to TurboModules and Fabric components with codegen
      - performance and crash baselines before and after
      - staged rollout with a flag or build variant
    rubric:
      excellent: Audits dependencies, plans incremental upgrades using the interop layer, migrates internal modules with codegen, measures baselines and rolls out gradually with a clear fallback.
      good: Checks library compatibility and upgrades in steps with testing.
      weak: Proposes flipping the flag and fixing whatever breaks.
    followups:
      - A critical library has no support and no maintainer. What are your options?
      - What would you measure to show the migration was worth it?
    common_errors:
      - Skipping several React Native versions in one jump.

  - external_key: technical.mobile.shared_business_logic
    competency_key: mobile_development
    topic: Sharing code across platforms
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your Android and iOS apps keep implementing the same pricing and validation rules differently. How would you evaluate
      sharing that logic, for example with Kotlin Multiplatform or a shared C++ or Rust core?
    expected_concepts:
      - what to share (domain logic, networking, persistence) versus keep native (UI)
      - interop costs (Swift interop, memory model, threading)
      - build and tooling impact for iOS engineers
      - team ownership and skills
      - alternatives such as server-driven rules or shared test vectors
      - incremental adoption on one module first
    rubric:
      excellent: Defines a clear sharing boundary, weighs interop, tooling and team costs against consistency, considers server-side or test-vector alternatives and proposes a small pilot with success criteria.
      good: Recommends sharing business logic while keeping UI native and notes some interop costs.
      weak: Proposes rewriting everything in one shared framework without assessing cost.
    followups:
      - How would iOS engineers debug a problem inside shared Kotlin code?
      - What would make you abandon the pilot?
    common_errors:
      - Ignoring how much the iOS team's workflow changes.

  - external_key: technical.mobile.remote_kill_switch
    competency_key: mobile_development
    topic: Remote configuration and kill switches
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A newly launched feature is sending wrong prices to a payment provider, and a fixed build will take days to get through
      review and onto phones. What would you want to already have in place, and how would you use it right now?
    expected_concepts:
      - remote config or feature flags evaluated on launch and refresh
      - server-side enforcement and validation as the real safety net
      - cached flag values and safe defaults when offline
      - targeting by app version and gradual re-enable
      - expedited review request and communication
    rubric:
      excellent: Uses a remote flag to disable the feature immediately, relies on server-side validation for safety, explains flag caching and defaults, and plans a version-targeted fix with expedited review.
      good: Disables the feature remotely and blocks bad requests on the server.
      weak: Has no plan beyond waiting for the next store release.
    followups:
      - The flag only refreshes on app start. How long until most users are protected?
      - What default should the app use if it can't fetch the config at all?
    common_errors:
      - Defaulting new features to on when remote config fails to load.

  - external_key: technical.mobile.checkout_interrupted_midway
    competency_key: mobile_development
    topic: Interrupted critical flows
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A user pays in your app, gets bounced to their bank's app to approve the payment, and the system kills your app while
      they're away. When they come back, how should your app figure out what happened and continue?
    expected_concepts:
      - persist checkout state before leaving the app
      - return via deep link or app link with the payment reference
      - query the server for authoritative payment status
      - idempotent order creation and no double charging
      - clear user messaging for pending, failed or completed states
    rubric:
      excellent: Persists the in-flight checkout, treats the server as the source of truth on return, uses idempotency to avoid duplicate charges and designs clear pending and recovery states even if the redirect never arrives.
      good: Saves state before redirecting and checks payment status with the server on return.
      weak: Assumes the app will still be in memory and relies on in-memory callbacks.
    followups:
      - The user never returns through the redirect link. How does the order get resolved?
      - How would you test this flow reliably?
    common_errors:
      - Trusting the client-side redirect result instead of confirming with the server.
