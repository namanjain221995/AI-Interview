# Curated questions: mobile engineering, part 2.
# Navigation and deep links, permissions, networking, cross-platform, release tooling, security and sync.
# round_types follow difficulty: easy -> screening/combined, medium -> all three, hard -> deep/combined.
version: 1
defaults:
  role_tags: [mobile]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.mobile.deep_link_types
    competency_key: mobile_development
    topic: Deep links and universal links
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Marketing wants links in emails to open the right screen inside the app. How do custom URL schemes differ from
      universal links and Android App Links, and which would you use here?
    expected_concepts:
      - custom schemes can be claimed by any app and fail if the app is missing
      - universal links and App Links use verified https domains
      - apple-app-site-association and assetlinks.json files
      - fallback to the website when the app isn't installed
      - routing the link to the correct screen and back stack
    rubric:
      excellent: Explains domain verification and why verified links are safer and degrade to the web, mentions the association files, and covers routing into the right screen with a sensible back stack.
      good: Prefers universal links and App Links and knows they need domain verification.
      weak: Only knows custom schemes or cannot explain what happens when the app isn't installed.
    followups:
      - The link opens the website instead of the app for some users. What would you check?
      - What should the back button do after a user arrives through a deep link?
    common_errors:
      - Forgetting to host or update the domain association file.

  - external_key: technical.mobile.runtime_permission_requests
    competency_key: mobile_development
    topic: Runtime permissions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you approach asking users for permissions like camera, location or notifications, both technically and in
      terms of when and how you ask?
    expected_concepts:
      - request in context when the feature is used
      - explain the benefit before the system prompt
      - handle denial and permanent denial gracefully
      - link to settings and degrade the feature
      - request the narrowest permission (approximate location, while-in-use)
    rubric:
      excellent: Asks in context with an explanation, requests the least access needed, handles every outcome including permanent denial, and keeps the app usable without the permission.
      good: Requests permissions at the point of use and handles denial.
      weak: Requests everything at first launch or crashes or blocks the app when a permission is denied.
    followups:
      - On iOS you only get one chance at the system prompt. How does that change your design?
      - How would you measure whether your permission prompt works well?
    common_errors:
      - Assuming a permission granted once stays granted forever.

  - external_key: technical.mobile.images_flicker_in_list
    competency_key: mobile_development
    topic: Image loading in lists
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      In a product list, images flicker, sometimes show the wrong picture for a moment, and reload every time you scroll back up.
      What's going on, and how would you fix it?
    expected_concepts:
      - recycled cells or views showing stale images
      - cancel or ignore previous requests when a cell is reused
      - memory and disk caching
      - use an image loading library (Glide, Coil, Kingfisher, SDWebImage, cached_network_image)
      - placeholders and stable keys
    rubric:
      excellent: Explains cell reuse causing stale images and request races, fixes it with cancellation or identity checks, and adds memory and disk caching through a proven library.
      good: Identifies missing caching and suggests an image library.
      weak: Proposes disabling view recycling or loading all images up front.
    followups:
      - How large should the memory cache be, and who decides?
      - What changes if the server returns huge original photos?
    common_errors:
      - Setting the image in a callback without checking the cell still shows the same item.

  - external_key: technical.mobile.version_and_build_numbers
    competency_key: mobile_development
    topic: App versioning
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you manage version names and build numbers for a mobile app across many releases, and why do the stores
      care about them?
    expected_concepts:
      - user-facing version name versus internal build number or version code
      - build numbers must increase for each upload
      - automating increments in CI
      - mapping crash reports and support tickets to exact builds
      - semantic or calendar versioning conventions
    rubric:
      excellent: Distinguishes the two numbers, explains store rules for increasing them, automates them in CI and ties them to crash reports and release notes.
      good: Knows the difference and that build numbers must increase.
      weak: Treats them as the same thing or updates them by hand inconsistently.
    followups:
      - Two branches both need to ship a build this week. How do you avoid number clashes?
      - How would you tag the source code so you can rebuild any shipped version?
    common_errors:
      - Reusing a build number and having the upload rejected late in the release.

  - external_key: technical.mobile.device_specific_bug
    competency_key: debugging
    topic: Device-specific bugs
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A bug report says the camera screen shows a black preview, but only on a couple of phone models you don't own.
      How would you go about reproducing and fixing it?
    expected_concepts:
      - gather device model, OS version and manufacturer skin
      - crash and analytics data to see the spread
      - remote device labs or cloud device farms
      - logging around the camera setup for that device
      - fallbacks for vendor-specific behaviour
    rubric:
      excellent: Collects precise device and OS data, reproduces on a cloud device or borrowed hardware, adds targeted logging and fixes with a guarded workaround while checking the wider device spread.
      good: Gathers device details and tries to reproduce on matching hardware.
      weak: Closes it as cannot reproduce without trying to get access to the device.
    followups:
      - You can't get the device at all. How do you still make progress?
      - How would you stop a device-specific workaround from breaking other phones?
    common_errors:
      - Assuming the emulator or simulator reflects vendor camera behaviour.

  - external_key: technical.mobile.cross_platform_vs_native
    competency_key: mobile_development
    topic: Cross-platform versus native
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you were starting a new app tomorrow, how would you decide between going fully native, React Native or Flutter?
      What factors would push you one way or the other?
    expected_concepts:
      - team skills and hiring
      - need for deep platform features or heavy native SDKs
      - performance-sensitive UI or graphics
      - code sharing and time to market across platforms
      - platform look and feel versus custom design system
      - long-term maintenance and upgrade costs
    rubric:
      excellent: Weighs team skills, product needs, platform integration, performance and maintenance cost, and gives concrete examples of products suited to each choice.
      good: Names several real trade-offs and reaches a reasoned recommendation.
      weak: Picks one framework as always best without considering the product or team.
    followups:
      - What would make you migrate an existing cross-platform app back to native?
      - How would you mix native screens into a React Native or Flutter app?
    common_errors:
      - Assuming cross-platform means writing no native code at all.

  - external_key: technical.mobile.screen_state_ownership
    competency_key: mobile_development
    topic: Screen state and architecture
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you structure a typical screen in your apps, from where the data is loaded to where the UI state lives?
      Walk me through one you built recently.
    expected_concepts:
      - separation of UI from state holder (ViewModel, Bloc, store)
      - repository or data layer for network and database
      - single immutable UI state with loading, content and error
      - unidirectional data flow and events
      - testability of the state holder
    rubric:
      excellent: Describes clear layers with a state holder exposing an immutable UI state, a repository abstracting sources, one-way data flow, and explains how this makes the screen testable.
      good: Separates UI, state and data layers with a sensible pattern.
      weak: Loads data and holds state directly in the view or Activity with no separation.
    followups:
      - How do you handle one-off events like showing a toast or navigating?
      - What would you change if two screens need to share the same state?
    common_errors:
      - Exposing mutable state that the view can change directly.

  - external_key: technical.mobile.screen_reader_icon_button
    competency_key: accessibility
    topic: Screen reader support
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A user who relies on VoiceOver tells you they can't use the checkout screen because buttons are announced as just
      button, button, button. How would you fix this and make sure it doesn't happen again?
    expected_concepts:
      - accessibility labels for icon-only controls
      - roles, traits and state (selected, disabled)
      - grouping and focus order
      - testing with VoiceOver and TalkBack
      - automated accessibility checks and lint
    rubric:
      excellent: Adds meaningful labels, roles and states, checks focus order and grouping, tests with real screen readers and adds automated checks or review steps to prevent regressions.
      good: Adds accessibility labels and tests with a screen reader.
      weak: Only adds visible text or does not know how to test with a screen reader.
    followups:
      - How would you label a button that toggles between favourite and not favourite?
      - Which automated tools have you used to catch accessibility issues?
    common_errors:
      - Writing labels that repeat the control type, such as save button button.

  # ------------------------------------------------------------------ medium
  - external_key: technical.mobile.lifecycle_aware_concurrency
    competency_key: mobile_development
    topic: Lifecycle-aware async work
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you make sure asynchronous work, like a network call or a database query, is cancelled or handled correctly
      when the user leaves a screen? Explain with Kotlin coroutines, Swift concurrency or whatever you use day to day.
    expected_concepts:
      - structured concurrency and scopes (viewModelScope, lifecycleScope, Task)
      - cancellation propagation and cooperative cancellation
      - collecting flows only while visible (repeatOnLifecycle)
      - main actor or dispatcher for UI updates
      - work that must outlive the screen goes to a longer-lived scope or scheduler
    rubric:
      excellent: Ties work to the right scope, explains cooperative cancellation and when work should outlive the screen, and shows how UI updates are confined to the main thread.
      good: Uses lifecycle-bound scopes and understands that leaving the screen cancels the work.
      weak: Launches work in global scopes or doesn't consider what happens after the screen is gone.
    followups:
      - The user taps save and immediately leaves. How do you make sure the save still finishes?
      - What happens if your code catches the cancellation exception and carries on?
    common_errors:
      - Using GlobalScope or detached tasks for screen-level work.

  - external_key: technical.mobile.duplicate_orders_flaky_network
    competency_key: api_design
    topic: Retries and idempotency on flaky networks
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Customers on trains sometimes end up with two identical orders after tapping place order once. What's likely happening,
      and how would you fix it on both the app and the API?
    expected_concepts:
      - request succeeded server-side but response was lost
      - automatic or manual retries resend the request
      - idempotency key generated on the client per order attempt
      - server deduplicates by key and returns the original result
      - disable double taps and show pending state
    rubric:
      excellent: Explains the lost-response scenario, introduces a client-generated idempotency key stored with the pending order, has the server return the same result for repeats, and fixes the UI double-submit.
      good: Identifies retries as the cause and proposes deduplication on the server.
      weak: Only disables the button, or removes retries and accepts failed orders.
    followups:
      - Where do you store the idempotency key so it survives the app being killed?
      - How long should the server remember keys?
    common_errors:
      - Generating a new idempotency key on every retry.

  - external_key: technical.mobile.http_response_caching
    competency_key: mobile_development
    topic: Caching network responses
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you cache API responses in a mobile app so screens load instantly but don't show badly outdated data?
      Talk me through the options you've used.
    expected_concepts:
      - HTTP cache headers, ETags and conditional requests
      - stale-while-revalidate pattern showing cached data then refreshing
      - database-backed cache as source of truth
      - per-endpoint freshness rules and invalidation on writes
      - clearing user-specific cache on logout
    rubric:
      excellent: Combines HTTP caching or a local store with stale-while-revalidate, chooses freshness per data type, invalidates on writes and handles user-specific data safely on logout.
      good: Shows cached data first and refreshes in the background with some invalidation.
      weak: Caches everything forever or never caches and relies on the network.
    followups:
      - The user changes data on the web. How does the app learn its cache is stale?
      - What would you never cache on disk?
    common_errors:
      - Ignoring cache invalidation after the user's own writes.

  - external_key: technical.mobile.app_size_growth
    competency_key: mobile_development
    topic: App size
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your app's download size has grown past 150 megabytes and the growth team says it's hurting installs in markets with
      expensive data. How would you find what's taking the space and bring it down?
    expected_concepts:
      - size analysis tools (APK Analyzer, app thinning report, bundle size reports)
      - app bundles, per-device splits and app thinning
      - unused resources, images and code shrinking (R8, dead code stripping)
      - large SDKs and duplicate dependencies
      - on-demand assets or dynamic feature delivery
      - size budgets in CI
    rubric:
      excellent: Measures with platform tools to find the biggest contributors, applies shrinking, asset optimisation and per-device delivery, moves rarely used content to on-demand downloads and adds a CI size budget.
      good: Analyses the bundle and removes large assets or unused dependencies.
      weak: Suggests removing features at random without measuring.
    followups:
      - Download size and install size differ. Which matters for this problem?
      - How would you stop the size creeping back up?
    common_errors:
      - Optimising code size when images and fonts are the real bulk.

  - external_key: technical.mobile.rn_native_module_design
    competency_key: mobile_development
    topic: React Native native modules
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Tell me about a time you had to write or modify a native module for a React Native app. How did you design the interface
      between JavaScript and native code, and what did you watch out for?
    expected_concepts:
      - typed interface via codegen or TurboModule spec
      - threading (which queue native work runs on)
      - promises or events for async results
      - consistent behaviour across iOS and Android implementations
      - error handling and testing both sides
    rubric:
      excellent: Gives a concrete example, describes a small typed API, explains threading and async result delivery, and shows how they kept iOS and Android behaviour consistent and tested.
      good: Has written a native module and explains how results and errors return to JavaScript.
      weak: Has never looked below the JavaScript layer or describes a chatty interface with no regard for threading.
    followups:
      - How would you send a stream of sensor readings to JavaScript without flooding it?
      - When would you look for a community library instead of writing your own?
    common_errors:
      - Doing heavy native work on the main queue inside the module.

  - external_key: technical.mobile.flutter_isolates_heavy_work
    competency_key: mobile_development
    topic: Flutter isolates and async work
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In Flutter, what's the difference between making something async with a Future and moving it to an isolate?
      When have you needed an isolate, and what did you have to consider?
    expected_concepts:
      - Dart is single-threaded per isolate with an event loop
      - async code still runs on the UI isolate
      - isolates have separate memory and communicate by messages
      - compute or Isolate.run for CPU-heavy work like parsing or image processing
      - cost of copying data between isolates
    rubric:
      excellent: Explains the event loop and why async does not mean parallel, gives a real case for an isolate, and discusses message passing and copying costs.
      good: Knows that CPU-heavy work belongs in an isolate and how to start one.
      weak: Believes marking a function async moves it off the UI thread.
    followups:
      - Why can't you just share an object between two isolates?
      - How would you keep a long-lived background isolate for repeated work?
    common_errors:
      - Spawning a new isolate for tiny tasks where copying costs more than the work.

  - external_key: technical.mobile.app_store_rejection
    competency_key: mobile_development
    topic: Store review rejections
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Two days before a marketing launch, Apple rejects your build citing a guideline about in-app purchases for digital content.
      How would you handle this?
    expected_concepts:
      - read the cited guideline and rejection details carefully
      - use Resolution Center to ask for clarification
      - decide between a compliant change, a feature flag or appeal
      - inform stakeholders and adjust the launch plan
      - add store guideline checks to release planning
    rubric:
      excellent: Reads the guideline precisely, engages through Resolution Center, evaluates fixing, hiding the feature remotely or appealing, communicates the risk early and prevents it in future planning.
      good: Understands the guideline, makes a compliant change and resubmits quickly.
      weak: Resubmits the same build hoping for a different reviewer or tries to hide the feature from review only.
    followups:
      - How would you avoid a similar surprise next time?
      - What risks come from flagging a feature off for review and turning it on later?
    common_errors:
      - Planning launch dates with no buffer for store review.

  - external_key: technical.mobile.code_signing_in_ci
    competency_key: mobile_development
    topic: Code signing and CI builds
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How have you set up automated builds that produce signed release binaries for both stores, and how did you handle certificates,
      provisioning profiles and signing keys?
    expected_concepts:
      - fastlane, Gradle tasks or Xcode Cloud style pipelines
      - certificates and profiles managed centrally (match or API keys)
      - Android upload key versus Play App Signing key
      - secrets stored in the CI secret store, not the repo
      - reproducible builds and artefact archiving with symbols
    rubric:
      excellent: Describes a concrete pipeline, central certificate and profile management, secret handling, Play App Signing and archiving symbols with each build.
      good: Has a working CI pipeline that signs builds using secrets from the CI system.
      weak: Builds releases manually on a laptop or keeps keystores in the repository.
    followups:
      - What happens if the Android upload key is lost or leaked?
      - How do you handle an expiring distribution certificate without breaking releases?
    common_errors:
      - Committing keystore passwords or certificates to source control.

  - external_key: technical.mobile.notification_tap_routing
    competency_key: mobile_development
    topic: Opening the app from a notification
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Tapping a message notification correctly opens the conversation when the app is in the background, but when the app was
      fully closed it just lands on the home screen. How would you debug and fix that?
    expected_concepts:
      - different entry points for cold start versus warm start
      - reading the launch intent or notification response on startup
      - deferring navigation until auth and app initialisation complete
      - building the correct back stack
      - testing each app state explicitly
    rubric:
      excellent: Identifies the cold-start path as separate, captures the notification payload at launch, holds it until the app is ready and the user is authenticated, then routes with a proper back stack.
      good: Realises cold start is handled differently and reads the payload during launch.
      weak: Only tests with the app in the background or adds delays to make it work.
    followups:
      - What if the notification is for a different account than the one logged in?
      - How would you write an automated test for this?
    common_errors:
      - Navigating before the navigation stack is ready and losing the event.

  - external_key: technical.mobile.local_db_migrations
    competency_key: mobile_development
    topic: Local database migrations
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you evolve the schema of an on-device database across app versions, given that users may jump from a very
      old version straight to the latest one?
    expected_concepts:
      - versioned migrations applied in sequence
      - migration tests from each historical schema
      - never relying on destructive fallback for user data
      - data that can be refetched versus irreplaceable data
      - running migrations safely at startup without ANR or watchdog kills
    rubric:
      excellent: Writes incremental migrations, tests upgrades from old versions, separates cached from irreplaceable data and keeps large migrations off the main thread or in stages.
      good: Uses versioned migrations and tests the latest upgrade path.
      weak: Deletes and recreates the database on schema change or doesn't consider skipped versions.
    followups:
      - A migration fails halfway on some devices. What should the app do?
      - How would you migrate a table with millions of rows on a low-end phone?
    common_errors:
      - Turning on destructive migration fallback and silently losing user data.

  - external_key: technical.mobile.data_leak_after_logout
    competency_key: security
    topic: Account switching and data isolation
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A tester logs out, logs in as a different user on the same phone, and briefly sees the previous user's messages.
      How would you find every place this could happen and fix it properly?
    expected_concepts:
      - in-memory caches, singletons and view models holding old data
      - disk caches, databases and image caches per user
      - HTTP cache and cookies
      - background jobs and pending syncs from the old session
      - push tokens re-registered to the new user
      - scoping data by user or clearing everything on logout
    rubric:
      excellent: Inventories every store including memory, disk, HTTP and image caches, cancels in-flight work and re-binds push tokens, and fixes it structurally by scoping data and dependencies to the user session.
      good: Clears databases and caches on logout and resets in-memory state.
      weak: Only clears the token and treats the rest as a UI refresh problem.
    followups:
      - How would you make this hard to regress as new features add new caches?
      - A sync job from the old account finishes after the new user logs in. What happens?
    common_errors:
      - Forgetting to unregister or reassign the push token on logout.

  # ------------------------------------------------------------------ hard
  - external_key: technical.mobile.offline_outbox_ordering
    competency_key: mobile_development
    topic: Offline write queues
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Design the queue that sends a user's offline changes to the server. Some changes depend on others, like creating a
      project and then adding tasks to it. How do you keep them ordered, retryable and safe?
    expected_concepts:
      - durable outbox in the local database
      - client-generated ids so dependent items can reference unsynced parents
      - ordering per entity or dependency graph rather than global serial
      - idempotency keys and retry with backoff
      - poison messages and user-visible failures
      - mapping temporary ids to server ids or using client ids end to end
    rubric:
      excellent: Designs a durable outbox with client ids, dependency-aware ordering, idempotent retries with backoff, and handling for permanent failures that need user action.
      good: Persists queued operations in order and retries them with idempotency.
      weak: Fires requests in parallel when online or keeps the queue only in memory.
    followups:
      - One request keeps failing with a validation error. What happens to everything queued behind it?
      - How do you collapse many edits to the same record before sending?
    common_errors:
      - Blocking the whole queue forever on one permanently failing item.

  - external_key: technical.mobile.tampered_client_fraud
    competency_key: security
    topic: Rooted devices and tampered clients
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your rewards app is losing money because some users run modified versions of the app on rooted phones to claim
      bonuses they shouldn't. What can you realistically do about it?
    expected_concepts:
      - never trust the client; enforce rules on the server
      - Play Integrity and App Attest or DeviceCheck for attestation
      - root and jailbreak detection as signals, not guarantees
      - obfuscation and tamper detection raise cost only
      - server-side anomaly detection and rate limiting
    rubric:
      excellent: Moves enforcement to the server, adds attestation as a risk signal, explains the limits of client-side checks and combines them with fraud analytics and rate limits.
      good: Uses attestation or root detection and validates important actions on the server.
      weak: Relies entirely on root detection or obfuscation inside the app.
    followups:
      - How do you avoid locking out legitimate users whose devices fail attestation?
      - What would you log to spot this abuse earlier?
    common_errors:
      - Treating root detection as a security boundary.

  - external_key: technical.mobile.modularization_build_times
    competency_key: mobile_development
    topic: Modularisation and build performance
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      A large app has a single module and clean builds take twenty minutes, slowing down thirty engineers.
      How would you approach modularising it, and how would you know it's paying off?
    expected_concepts:
      - feature, core and shared library modules with clear dependency rules
      - api versus implementation modules to limit recompilation
      - build caching and configuration caching
      - measure incremental and clean build times before and after
      - incremental migration rather than a big-bang rewrite
      - ownership boundaries for teams
    rubric:
      excellent: Proposes a layered module graph with dependency rules, explains how it reduces recompilation, migrates incrementally and tracks build metrics to prove the gains.
      good: Splits by feature with shared core modules and uses build caching.
      weak: Splits into modules arbitrarily or expects modularisation alone to fix builds without measurement.
    followups:
      - Two feature modules need to navigate to each other. How do you avoid a circular dependency?
      - What's the cost of having too many modules?
    common_errors:
      - Creating a common module that everything depends on and that changes constantly.

  - external_key: technical.mobile.silent_termination_ios
    competency_key: debugging
    topic: Terminations without crash reports
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Users say the iOS app keeps restarting from scratch when they come back to it, but your crash reporter shows nothing.
      How would you work out what is terminating the app?
    expected_concepts:
      - jetsam or memory-pressure terminations are not crashes
      - watchdog terminations for slow launch or resume
      - MetricKit diagnostics and Xcode Organizer terminations
      - background memory footprint and image or cache growth
      - distinguishing expected suspension kills from bugs
    rubric:
      excellent: Recognises out-of-memory and watchdog terminations as invisible to normal crash reporters, uses MetricKit and Organizer data, profiles memory footprint in the background and reduces it, while restoring state properly.
      good: Suspects memory pressure and profiles memory use.
      weak: Concludes there is no problem because there are no crash reports.
    followups:
      - How would you tell an out-of-memory kill apart from a normal background eviction?
      - What would you release from memory when the app enters the background?
    common_errors:
      - Assuming every termination will appear as a crash report.

  - external_key: technical.mobile.realtime_updates_strategy
    competency_key: mobile_development
    topic: Real-time updates on mobile
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You need live order-status updates in a delivery app. Compare WebSockets, server-sent events, polling and push notifications
      for this on mobile, and tell me what you'd actually build.
    expected_concepts:
      - persistent connections only while in foreground
      - reconnect with backoff and resuming from a cursor
      - push for background updates
      - polling cost on battery and radio
      - network changes (Wi-Fi to cellular) and connection health
      - fallbacks when sockets are blocked
    rubric:
      excellent: Uses a socket or stream in the foreground with reconnection and resume, push for background updates, explains battery and radio trade-offs, and handles network transitions and missed events.
      good: Chooses WebSockets in the foreground plus push in the background with reconnection.
      weak: Keeps a socket open in the background indefinitely or polls every few seconds without considering battery.
    followups:
      - The socket reconnects after thirty seconds offline. How do you make sure no status change was missed?
      - How would you test this on a flaky network?
    common_errors:
      - Not resynchronising state after a reconnect.

  - external_key: technical.mobile.crash_rate_after_os_update
    competency_key: debugging
    topic: OS update regressions
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A new major Android version ships, and within a week your crash-free users rate drops noticeably even though you haven't
      released anything. How do you handle that?
    expected_concepts:
      - segment crashes by OS version
      - review behaviour changes in the new platform release
      - target SDK versus runtime OS behaviour differences
      - reproduce on the new OS (emulators, beta devices)
      - hotfix with guarded code paths and earlier beta testing next time
    rubric:
      excellent: Segments by OS to confirm the cause, maps clusters to documented platform behaviour changes, reproduces, ships a targeted fix, and sets up testing on beta OS releases to catch it earlier.
      good: Notices the OS correlation and investigates platform changes.
      weak: Waits for the OS vendor to fix it or does not segment the data.
    followups:
      - Why might the crash appear only once you raise your target SDK?
      - How would you build OS beta testing into your normal process?
    common_errors:
      - Skipping beta OS releases and learning about changes from users.
