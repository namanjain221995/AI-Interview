# Curated questions: Data engineering (part 2 of 4).
# Warehouse and lakehouse data modelling, slowly changing dimensions, table formats, serving and metrics.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data]
questions:
  # ------------------------------------------------------------- dimensional modelling basics
  - external_key: technical.data_engineering.facts_and_dimensions
    competency_key: data_engineering
    topic: Facts and dimensions in a model you built
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Pick a warehouse model you've built or worked with closely. Which tables were facts, which were
      dimensions, and how did you decide where each attribute belonged?
    expected_concepts:
      - facts hold measurable events or transactions
      - dimensions hold descriptive context used to filter and group
      - foreign keys from facts to dimensions
      - additive, semi-additive and non-additive measures
      - attributes placed where analysts naturally slice by them
    rubric:
      excellent: Describes a real model clearly, explains the role of each table, justifies placement of tricky attributes and mentions measure additivity such as balances being semi-additive.
      good: Correctly separates facts and dimensions in a concrete example.
      weak: Uses the terms loosely or cannot describe a model they built.
    followups:
      - Which attribute in that model was hardest to place, and why?
      - How did analysts actually query it day to day?
    common_errors:
      - Storing descriptive text that changes often directly on a huge fact table.

  - external_key: technical.data_engineering.fact_table_grain
    competency_key: data_engineering
    topic: Declaring the grain of a fact table
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      People say you should decide the grain of a fact table before anything else. What does grain mean in
      practice, and what goes wrong when it isn't clear?
    expected_concepts:
      - grain is what a single row represents
      - every measure and key must be true at that grain
      - mixed grains cause double counting
      - choosing the lowest useful grain keeps options open
      - aggregates built separately from atomic facts
    rubric:
      excellent: Defines grain as the meaning of one row, explains how mixing grains leads to double counting or wrong averages with a concrete example, and argues for the lowest practical grain with separate aggregates.
      good: Defines grain correctly and names double counting as the risk.
      weak: Confuses grain with partitioning or table size.
    followups:
      - An order table also carries a shipping cost per order. What happens when you join it to order lines?
      - When would you deliberately store a coarser grain?
    common_errors:
      - Adding header-level amounts to a line-level table and summing them.

  - external_key: technical.data_engineering.denormalising_dimensions
    competency_key: data_engineering
    topic: Denormalised versus normalised dimensions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When modelling something like a product hierarchy of category, subcategory and brand, how do you decide
      whether to flatten it into one dimension or keep it in separate normalised tables?
    expected_concepts:
      - flattened dimensions mean fewer joins and simpler queries
      - normalised tables reduce duplication and update anomalies
      - columnar storage makes repeated values cheap
      - how BI tools and analysts write queries
      - hierarchies that change shape or depth
    rubric:
      excellent: Weighs query simplicity and performance against duplication and maintenance, notes columnar compression makes flattening cheap, and considers how the consumers query the data, with a real example.
      good: Prefers flattening for analytics and gives one sensible reason.
      weak: Applies transactional normalisation rules to the warehouse without considering analysts.
    followups:
      - How would you model a hierarchy where depth varies from product to product?
      - What changes if the category names are edited often?
    common_errors:
      - Normalising dimensions deeply and forcing analysts into five-way joins for basic reports.

  - external_key: technical.data_engineering.scd_history_choice
    competency_key: data_engineering
    topic: Keeping history of changing attributes
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A customer moves to a different sales region. Some reports should credit past sales to the old region
      and others want everything under the new one. How do you model the customer dimension to support
      that?
    expected_concepts:
      - type 1 overwrites and loses history
      - type 2 adds a new row with validity dates
      - current-value columns alongside historical rows
      - facts joined to the version valid at the event time
      - choosing per attribute which history matters
    rubric:
      excellent: Explains type 1 and type 2 behaviour, shows how facts link to the right version, offers a hybrid with current-value columns for "as of now" reporting, and decides per attribute.
      good: Proposes type 2 history with effective dates and explains the difference from overwriting.
      weak: Overwrites the region and does not see the reporting problem.
    followups:
      - How does a fact row know which version of the customer to point to?
      - Which attributes would you not track history for, and why?
    common_errors:
      - Tracking history on every column, which multiplies rows for trivial changes.

  - external_key: technical.data_engineering.surrogate_keys
    competency_key: data_engineering
    topic: Surrogate keys in the warehouse
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Why do warehouse designs often use surrogate keys for dimensions instead of the IDs from the source
      system? When have you found that useful, or found it unnecessary?
    expected_concepts:
      - one dimension row per version needs a key beyond the source id
      - integrating several sources with colliding ids
      - insulation from source key changes or reuse
      - hash-based keys versus sequences in distributed pipelines
      - cost of looking keys up during fact loads
    rubric:
      excellent: Ties surrogate keys to versioned history and multi-source integration, compares sequence and hash keys for parallel loads, and gives a real example including when they added little value.
      good: Explains history tracking and source independence as the main reasons.
      weak: Thinks surrogate keys are just a convention with no practical purpose.
    followups:
      - How do you generate surrogate keys when many jobs load in parallel?
      - What happens to fact loads when the dimension row has not arrived yet?
    common_errors:
      - Using auto-increment keys that differ between environments and break reproducible rebuilds.

  - external_key: technical.data_engineering.warehouse_lake_lakehouse
    competency_key: data_engineering
    topic: Warehouse, lake and lakehouse
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you explain the practical differences between a data warehouse, a data lake and a lakehouse
      to a new colleague, using platforms you've actually worked with?
    expected_concepts:
      - warehouse with managed storage, SQL and strong schema
      - lake as cheap object storage of open files with schema on read
      - lakehouse adds table formats with transactions on lake storage
      - multiple engines over the same open data
      - governance, performance and cost trade-offs
    rubric:
      excellent: Explains each in terms of storage, schema, transactions and engines, uses real platforms as examples, and describes the trade-offs in cost, openness and performance without treating one as always best.
      good: Gives correct distinctions with at least one concrete platform.
      weak: Uses the terms as buzzwords or cannot say what a lakehouse adds.
    followups:
      - What does an open table format give you that a folder of Parquet files doesn't?
      - Where would you still prefer a managed warehouse?
    common_errors:
      - Describing a data lake as just a bigger database.

  - external_key: technical.data_engineering.layered_architecture
    competency_key: data_engineering
    topic: Raw, cleaned and curated layers
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Many teams organise data into layers such as raw, cleaned and curated, sometimes called bronze, silver
      and gold. What belongs in each layer in your experience, and why bother keeping the raw data at all?
    expected_concepts:
      - raw keeps data as received for replay and audit
      - cleaned layer applies types, deduplication and conformance
      - curated layer holds business-ready models and aggregates
      - reprocessing from raw when logic changes
      - access control and retention differ per layer
    rubric:
      excellent: Describes concrete responsibilities per layer, explains replay and audit as the value of raw data with a real reprocessing example, and mentions retention and access differences.
      good: Correctly describes the layers and why raw data helps with reprocessing.
      weak: Lists the layer names without explaining what changes between them.
    followups:
      - How long would you keep raw data, and what drives that decision?
      - Who should be allowed to query the raw layer?
    common_errors:
      - Applying business logic at ingestion so the original values are lost.

  - external_key: technical.data_engineering.conflicting_revenue_dashboards
    competency_key: data_engineering
    topic: Two dashboards with different numbers
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Two dashboards show last month's revenue, and they disagree by about four percent. Both teams say theirs
      is right. How would you go about finding out why?
    expected_concepts:
      - compare the definitions such as gross versus net, refunds, taxes
      - compare time zone and date boundaries
      - compare filters, currencies and source tables
      - reconcile step by step down to row level
      - agree one documented definition with the owners
    rubric:
      excellent: Systematically compares definitions, time boundaries, filters and sources, narrows the gap with reconciliations down to specific rows, and ends with an agreed, documented single definition.
      good: Checks definitions and filters and compares the underlying queries.
      weak: Picks the number they trust more without investigating.
    followups:
      - The difference comes down to refunds. Who decides which version is correct?
      - How would you stop this from happening again?
    common_errors:
      - Fixing one dashboard to match the other without agreeing on the definition.

  # ------------------------------------------------------------- modelling, medium
  - external_key: technical.data_engineering.scd2_merge_implementation
    competency_key: sql
    topic: Implementing type 2 history with MERGE
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Talk me through how you would implement a type 2 slowly changing dimension in SQL, including what
      happens when one batch contains several changes for the same customer.
    expected_concepts:
      - detect changes by comparing tracked attributes or a hash
      - close the current row with an end date and insert a new version
      - order multiple changes in a batch by their change timestamp
      - current flag or open-ended end date
      - idempotency when the same batch is loaded twice
    rubric:
      excellent: Describes change detection, expiring and inserting versions in one atomic operation, sequencing several changes within a batch, and making reruns produce no extra versions.
      good: Correctly closes old rows and inserts new versions with effective dates.
      weak: Only inserts new rows without expiring old ones, or overwrites history.
    followups:
      - How would you detect changes efficiently on a dimension with forty columns?
      - A change arrives with an effective date earlier than the current version. What do you do?
    common_errors:
      - Keeping only the latest change when a batch has several, which loses intermediate history.

  - external_key: technical.data_engineering.late_arriving_dimension
    competency_key: data_engineering
    topic: Facts that arrive before their dimension rows
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Order events arrive in the warehouse a few hours before the customer record they reference. Your fact
      load can't find the customer key. What do you do with those orders?
    expected_concepts:
      - inferred or placeholder dimension members
      - updating the placeholder when the real record arrives
      - unknown member rows versus holding facts back
      - re-keying facts later if needed
      - monitoring how many facts point to placeholders
    rubric:
      excellent: Uses inferred members that get filled in when the real record arrives, compares that with holding or re-keying facts, and monitors placeholder counts so problems are visible.
      good: Proposes an unknown or placeholder customer and fixes it later.
      weak: Drops the orders or fails the whole load.
    followups:
      - What if the dimension is type 2 and the real record arrives with history?
      - How would analysts see that some orders have incomplete customer data?
    common_errors:
      - Pointing all such facts at one unknown row that can never be corrected.

  - external_key: technical.data_engineering.order_lifecycle_model
    competency_key: data_engineering
    topic: Modelling a process with several milestones
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Operations wants to analyse how long orders take between being placed, paid, shipped and delivered,
      and where they get stuck. How would you model that in the warehouse?
    expected_concepts:
      - accumulating snapshot with one row per order updated as milestones happen
      - milestone timestamps and derived durations
      - an event-level table for full history alongside
      - handling of skipped or repeated milestones
      - orders still in progress and how they are counted
    rubric:
      excellent: Proposes an accumulating snapshot per order with milestone dates and lag measures, keeps the event-level history for detail, and handles in-flight, skipped or repeated steps explicitly.
      good: Suggests one row per order with timestamps per stage and computed durations.
      weak: Leaves the analysis to ad hoc queries over raw status events.
    followups:
      - An order is shipped in three parcels. How does your model cope?
      - How would you show orders that are currently stuck?
    common_errors:
      - Recording only the latest status, which loses the time spent in each stage.

  - external_key: technical.data_engineering.open_table_formats
    competency_key: data_engineering
    topic: What open table formats add
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What do table formats like Apache Iceberg, Delta Lake or Hudi give you over plain Parquet files in
      folders, and what did adopting one change for your team?
    expected_concepts:
      - atomic commits and snapshot isolation for readers
      - row-level updates, deletes and merges
      - schema evolution tracked in metadata
      - time travel to earlier snapshots
      - file-level statistics and hidden partitioning
      - new maintenance duties such as compaction and snapshot expiry
    rubric:
      excellent: Explains transactional metadata and what it enables (consistent reads, merges, evolution, time travel, pruning), and is concrete about the operational work and pitfalls the team took on.
      good: Names transactions, updates and time travel as the main benefits.
      weak: Treats it as just another file format.
    followups:
      - How do readers avoid seeing half-written data during a commit?
      - What maintenance did you have to schedule after adopting it?
    common_errors:
      - Assuming time travel is free and keeping every snapshot forever.

  - external_key: technical.data_engineering.lakehouse_table_maintenance
    competency_key: data_engineering
    topic: Routine maintenance of lakehouse tables
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Once you have dozens of Iceberg or Delta tables being written every few minutes, what housekeeping do
      they need, and how would you schedule it so it doesn't get in the way of writers?
    expected_concepts:
      - compacting files written by frequent commits
      - expiring old snapshots and their files
      - removing orphan files from failed writes
      - rewriting manifests or metadata
      - conflicts between maintenance and concurrent writers
      - per-table policies driven by write rate and query pattern
    rubric:
      excellent: Lists compaction, snapshot expiry, orphan clean-up and metadata rewrites, explains how they can conflict with writers and how to schedule or scope them, and sets policy per table.
      good: Knows compaction and snapshot expiry are needed and runs them on a schedule.
      weak: Unaware that the tables need any maintenance.
    followups:
      - How would you decide how many snapshots to keep?
      - A compaction job keeps failing with commit conflicts. What would you change?
    common_errors:
      - Deleting orphan files too aggressively and removing files a running write still needs.

  - external_key: technical.data_engineering.upstream_schema_evolution
    competency_key: data_engineering
    topic: Schema evolution reaching the lake
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An upstream service adds two new fields, renames one, and changes another from an integer to a string.
      What happens to your ingestion and downstream tables, and how should the pipeline handle each of these
      changes?
    expected_concepts:
      - additive columns are usually safe to evolve automatically
      - renames look like a drop plus an add without metadata
      - type changes may be widening or breaking
      - quarantining or failing on breaking changes
      - communicating with downstream consumers
    rubric:
      excellent: Treats each change type differently, lets safe additions through, flags renames and narrowing type changes as breaking with a quarantine or fail-fast policy, and explains how consumers are told.
      good: Distinguishes additive from breaking changes and suggests alerting on the breaking ones.
      weak: Lets the pipeline infer schemas and break whenever something changes.
    followups:
      - How would you keep old and new names queryable during a transition?
      - Who should approve a breaking change to a shared table?
    common_errors:
      - Turning on automatic schema merge everywhere and silently filling columns with nulls.

  - external_key: technical.data_engineering.clustering_and_sort_keys
    competency_key: data_engineering
    topic: Clustering and sort keys beyond partitioning
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Beyond partitioning, warehouses and table formats let you cluster or sort data, for example with
      clustering keys or Z-ordering. When have you used that, and how did you choose the columns?
    expected_concepts:
      - co-locating rows with similar values to make statistics selective
      - choosing columns from frequent filters and joins
      - multi-column ordering such as Z-order for several filters
      - cost of re-clustering as new data arrives
      - measuring bytes scanned before and after
    rubric:
      excellent: Explains how clustering makes file statistics useful, chooses columns from real query patterns, weighs re-clustering cost against savings and verifies with scanned-bytes measurements.
      good: Clusters on commonly filtered columns and knows it reduces data scanned.
      weak: Cannot explain how clustering differs from partitioning or indexing.
    followups:
      - How do you know when clustering has degraded?
      - Why might clustering on a high-cardinality column help when partitioning on it would hurt?
    common_errors:
      - Clustering on many columns at once so none of them gets good locality.

  - external_key: technical.data_engineering.slowing_merge_upserts
    competency_key: data_engineering
    topic: MERGE into a large table getting slower
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A job upserts about a million changed rows a day into a lakehouse table that now holds several
      billion rows, and the MERGE gets slower every week. What is likely happening, and how would you speed it
      up?
    expected_concepts:
      - merge rewrites every file containing a matched row
      - updates scattered across the whole table touch many files
      - narrowing the target with partition or key range predicates
      - clustering by the merge key to localise updates
      - merge-on-read or deletion vectors versus copy-on-write
      - compaction to control file counts
    rubric:
      excellent: Explains that scattered matches cause wide file rewrites, narrows the target scan with predicates, improves locality by clustering on the key, and considers merge-on-read options with their read-side cost.
      good: Adds partition filters to the merge condition and compacts the table.
      weak: Suggests a bigger cluster without understanding why the merge is slow.
    followups:
      - How would you measure how many files each merge rewrites?
      - When would a full rewrite of the table be cheaper than merging?
    common_errors:
      - Merging on a condition with no partition filter, forcing a scan of the whole target.

  - external_key: technical.data_engineering.governed_metric_definitions
    competency_key: data_engineering
    topic: Keeping metric definitions consistent across tools
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Analysts, finance and the product team all compute active customers in their own tools. How would you
      make sure everyone uses one definition without making them all write the same SQL?
    expected_concepts:
      - a semantic layer or metrics layer with defined measures
      - curated tables owned by the data team
      - version-controlled definitions with review
      - documentation and certification of trusted datasets
      - exposing metrics to several BI tools through one interface
    rubric:
      excellent: Centralises definitions in a governed, version-controlled layer that several tools consume, pairs it with owned curated tables and certification, and explains how changes to definitions are reviewed and communicated.
      good: Proposes curated tables or a semantic layer with documented definitions.
      weak: Relies on a wiki page of definitions that each tool implements separately.
    followups:
      - How would you handle a team that genuinely needs a slightly different definition?
      - What happens to historical reports when the definition changes?
    common_errors:
      - Creating one shared view per dashboard, which multiplies definitions instead of reducing them.

  - external_key: technical.data_engineering.one_big_table_tradeoffs
    competency_key: data_engineering
    topic: One wide table versus a star schema
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some teams now serve analysts a single very wide table instead of a star schema. What are the
      trade-offs, and when would you build one?
    expected_concepts:
      - fewer joins and simpler self-service queries
      - columnar storage makes wide tables cheap to scan selectively
      - duplication and rebuild cost when dimensions change
      - history semantics baked in at build time
      - often built on top of a dimensional model rather than instead of it
    rubric:
      excellent: Weighs usability and query speed against rebuild cost and frozen dimension values, and positions wide tables as a serving layer derived from a maintained dimensional core, with a real use case.
      good: Names simplicity versus duplication and gives a case for each.
      weak: Dismisses one approach outright without reasons.
    followups:
      - A product is renamed. How does each approach reflect that?
      - How wide is too wide for your tools?
    common_errors:
      - Building wide tables straight from raw sources with no reusable model underneath.

  - external_key: technical.data_engineering.many_to_many_bridge
    competency_key: data_engineering
    topic: Many-to-many relationships and double counting
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a B2B product, users can belong to several accounts and accounts have many users. Analysts joining
      revenue through users keep getting totals that are too high. How would you model this so it reports
      correctly?
    expected_concepts:
      - recognise a many-to-many relationship causing fan-out
      - a bridge table between accounts and users
      - keeping revenue at its natural account grain
      - allocation weights when splitting is needed
      - guidance or guard rails in the semantic layer
    rubric:
      excellent: Diagnoses fan-out from the many-to-many join, models it with a bridge table, keeps measures at their natural grain and allocates only when the business asks, with guard rails so the mistake isn't repeated.
      good: Identifies the join fan-out and proposes a bridge table or aggregating before joining.
      weak: Suggests adding distinct to the query.
    followups:
      - Sales wants revenue attributed to individual users. How would you split it?
      - How would you detect this kind of double counting automatically?
    common_errors:
      - Using count distinct to hide fan-out while sums remain inflated.

  # ------------------------------------------------------------- hard
  - external_key: technical.data_engineering.reproduce_past_report
    competency_key: data_engineering
    topic: Reproducing a report exactly as it was
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Auditors ask you to reproduce last quarter's revenue report exactly as it was published, even though
      corrections and late data have changed the underlying tables since. How would you design the platform
      so that's possible?
    expected_concepts:
      - distinguish when something happened from when the warehouse learned about it
      - bitemporal modelling or append-only corrections
      - table snapshots or time travel with retention policy
      - versioned transformation code tied to each published run
      - storing published report outputs as immutable artefacts
    rubric:
      excellent: Separates valid time from recorded time, combines snapshots or bitemporal tables with versioned code and immutable published outputs, and accounts for retention and cost of keeping that history.
      good: Proposes snapshots or time travel together with versioned code.
      weak: Suggests rerunning today's pipeline, which reflects later corrections.
    followups:
      - How long would you keep the snapshots, and who decides?
      - How would you show the difference between the published figure and today's corrected one?
    common_errors:
      - Relying on time travel with a seven-day retention for a quarterly audit need.

  - external_key: technical.data_engineering.concurrent_table_writers
    competency_key: data_engineering
    topic: Concurrent writers on a lakehouse table
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Two pipelines, a streaming ingest and a nightly correction job, both write to the same Iceberg or Delta
      table, and you see commit failures and sometimes lost updates. How does concurrency control work in
      these formats, and how would you design around it?
    expected_concepts:
      - optimistic concurrency with retries at commit time
      - conflicts arise when both touch the same files or partitions
      - isolation levels and what each format checks
      - partitioning writes so jobs touch disjoint data
      - catalog or lock service requirements on object storage
      - serialising conflicting work through one writer
    rubric:
      excellent: Explains optimistic commits and conflict detection, why overlapping files cause failures, how isolation settings affect correctness, and designs writers to touch disjoint partitions or funnel through one writer, noting catalog requirements.
      good: Understands optimistic concurrency and suggests separating the jobs' partitions or scheduling.
      weak: Thinks the format handles any number of concurrent writers with no design effort.
    followups:
      - Why does object storage need a catalog or lock service for safe commits?
      - What would lost updates look like in the data, and how would you detect them?
    common_errors:
      - Retrying failed commits blindly without re-reading the table state.

  - external_key: technical.data_engineering.erasure_in_data_lake
    competency_key: data_engineering
    topic: Erasing one person's data from a lake
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Legal tells you that customer erasure requests must be honoured within thirty days across the whole
      platform, which includes years of Parquet files, lakehouse snapshots and derived tables. How would you
      implement that?
    expected_concepts:
      - locate personal data through cataloguing and lineage
      - row-level deletes in table formats followed by snapshot expiry
      - batching deletion requests to control rewrite cost
      - pseudonymisation with key tables so erasing the mapping suffices
      - backups, raw zones and derived aggregates
      - evidence and audit of completion
    rubric:
      excellent: Finds all personal data via lineage, deletes in batches with table-format deletes plus snapshot and file clean-up, uses pseudonymisation to shrink the problem, covers raw zones and backups, and records proof of completion.
      good: Deletes rows across tables and remembers that old snapshots still hold the data.
      weak: Only deletes from the main customer table.
    followups:
      - How do you handle aggregates that include the person's data?
      - How would you prove to an auditor that the erasure is complete?
    common_errors:
      - Deleting rows but leaving them recoverable through time travel.

  - external_key: technical.data_engineering.fact_grain_redesign
    competency_key: data_engineering
    topic: Changing the grain of a core fact table
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your central sales fact table is at order level, but the business now needs product-level analysis, so
      the grain has to become order line. Around two hundred dashboards depend on the current table. How would
      you make that change?
    expected_concepts:
      - build the new line-level fact alongside the old one
      - derive or replace the order-level table from the new fact
      - usage analysis of which dashboards and queries rely on what
      - reconciliation so totals match between old and new
      - migration plan, deprecation window and communication
    rubric:
      excellent: Builds the new grain in parallel, rebuilds the old table as a derived aggregate to protect existing consumers, reconciles totals, uses query logs to plan migrations and runs a communicated deprecation.
      good: Creates a new table and migrates dashboards gradually with validation.
      weak: Changes the existing table in place.
    followups:
      - Header-level charges such as shipping need to land on lines. How would you allocate them?
      - How would you find dashboards that use the table indirectly through views?
    common_errors:
      - Breaking existing reports because order-level measures now sum across lines.

  - external_key: technical.data_engineering.slow_dashboard_on_large_fact
    competency_key: data_engineering
    topic: Making dashboard queries on huge tables fast
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A heavily used dashboard queries a fact table with about two billion rows and takes ninety seconds to
      load. Leadership wants it under five seconds without the warehouse bill exploding. What options would
      you consider and how would you choose?
    expected_concepts:
      - study the actual queries and filters the dashboard sends
      - pre-aggregated tables or materialised views at the needed grain
      - clustering and pruning on the main filters
      - result caching and extract or OLAP serving stores
      - refresh cost and freshness trade-offs
      - measuring latency and cost before and after
    rubric:
      excellent: Starts from the dashboard's real query patterns, matches aggregates or materialised views to them, tunes layout for pruning, considers a dedicated serving store only when justified, and compares refresh cost and freshness with measurements.
      good: Proposes aggregate tables and clustering and checks the queries.
      weak: Suggests scaling up the warehouse as the only fix.
    followups:
      - Users can filter on twelve dimensions. How does that affect pre-aggregation?
      - When would you move this workload to a dedicated OLAP engine?
    common_errors:
      - Building a materialised view per chart, leading to dozens of costly refreshes.

  - external_key: technical.data_engineering.warehouse_to_lakehouse_decision
    competency_key: data_engineering
    topic: Evaluating a move from warehouse to lakehouse
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your company runs everything on a managed cloud warehouse, and some engineers are pushing to move to a
      lakehouse on open table formats. You're asked for a recommendation. How would you evaluate it?
    expected_concepts:
      - current pain points with evidence such as cost, lock-in or ML access
      - workload profile across BI, ad hoc, ML and streaming
      - total cost including people and operations, not just storage
      - team skills and platform maturity
      - incremental or hybrid paths and a pilot with success criteria
    rubric:
      excellent: Anchors the decision in measured problems and workloads, compares total cost of ownership including operations and skills, considers hybrid options, and proposes a bounded pilot with clear success criteria.
      good: Lists reasonable pros and cons for both and suggests a pilot.
      weak: Recommends one side based on trends or personal preference.
    followups:
      - What would you measure in the pilot?
      - What would make you recommend staying put?
    common_errors:
      - Comparing storage prices only and ignoring compute, tooling and staffing.
