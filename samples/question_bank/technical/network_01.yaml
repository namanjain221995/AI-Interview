# Curated questions: network engineering (part 1 of 4) — TCP/IP fundamentals, addressing,
# switching, first-hop redundancy, interior and exterior routing, data-centre fabrics.
# `defaults` are merged into every question (question keys win). Medium is the default
# difficulty band; easy and hard questions override round_types.
version: 1
defaults:
  role_tags: [network]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.network.tcp_connection_lifecycle
    competency_key: networking
    topic: TCP connection setup and teardown
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Walk me through how a TCP connection gets set up and torn down, and tell me about a time those
      details actually mattered when you were debugging something.
    expected_concepts:
      - SYN, SYN-ACK, ACK three-way handshake
      - initial sequence numbers and acknowledgements
      - FIN and ACK exchange versus RST for abrupt close
      - TIME_WAIT on the side that closes first
      - recognising a missing SYN-ACK or an RST in a capture
    rubric:
      excellent: Describes setup and both graceful and abrupt teardown accurately and ties them to a concrete debugging case, such as spotting unanswered SYNs or unexpected resets in a capture.
      good: Describes the three-way handshake and FIN-based close correctly but the practical example is thin.
      weak: Cannot describe the handshake order or confuses TCP setup with the TLS handshake.
    followups:
      - What would it tell you if the client keeps sending SYNs and never gets a reply?
      - Who sends a reset, and in what situations?
    common_errors:
      - Mixing up the TCP handshake with the TLS handshake.
      - Thinking TIME_WAIT is a sign of a bug rather than normal behaviour.

  - external_key: technical.network.tcp_or_udp_choice
    competency_key: networking
    topic: Choosing TCP or UDP
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide whether an application should run over TCP or UDP? Use voice calls and large file
      transfers as examples to explain your reasoning.
    expected_concepts:
      - reliability and ordering guarantees of TCP
      - head-of-line blocking and retransmission delay
      - real-time traffic preferring late data to be dropped
      - application-level recovery and jitter buffers over UDP
      - firewall and NAT behaviour differences for UDP
    rubric:
      excellent: Explains the trade-off in terms of latency versus reliability, shows why voice tolerates loss but not delay, and mentions practical effects such as NAT timeouts or protocols like QUIC that build reliability on UDP.
      good: Correctly maps voice to UDP and file transfer to TCP with a reasonable explanation of why.
      weak: Says UDP is simply faster or TCP is simply better without explaining the trade-off.
    followups:
      - What happens to a voice call if you force it over TCP on a lossy link?
      - Why do firewalls and NAT devices need special handling for UDP flows?
    common_errors:
      - Claiming UDP is faster in all cases without mentioning loss handling.

  - external_key: technical.network.office_subnet_plan
    competency_key: network_engineering
    topic: Subnetting a new office
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Say you're given a /22 for a new office with about three hundred staff, a small server segment,
      printers and a management network. How would you carve that space up, and why?
    expected_concepts:
      - sizing subnets for current hosts plus growth
      - separate subnets per function (users, servers, printers, management, guest)
      - aligning subnets on bit boundaries for clean summarisation
      - reserving space for future segments
      - gateway and DHCP scope placement
    rubric:
      excellent: Produces a sensible split with correct sizes, leaves room for growth, keeps the block summarisable and explains why each segment is separate.
      good: Splits the space correctly into a few subnets but gives little thought to growth or summarisation.
      weak: Makes arithmetic errors with prefix sizes or puts everything in one flat subnet.
    followups:
      - How many usable addresses does a /24 give you, and where does the gateway usually go?
      - The office doubles in two years. How painful is your plan to extend?
    common_errors:
      - Forgetting the network and broadcast addresses when sizing.
      - Choosing subnets that overlap or cannot be summarised.

  - external_key: technical.network.local_vs_remote_delivery
    competency_key: network_engineering
    topic: ARP and local versus remote delivery
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a host sends a packet to another machine on its own subnet, how does it figure out where to
      send the frame? And what changes when the destination is on a different subnet?
    expected_concepts:
      - comparing the destination with its own subnet mask
      - ARP request and reply to learn the MAC address
      - ARP cache and timeouts
      - sending remote traffic to the default gateway's MAC
      - destination IP stays the same while the MAC changes per hop
    rubric:
      excellent: Explains the subnet comparison, ARP for local hosts, ARP for the gateway for remote hosts, and that layer 2 addresses change hop by hop while the IP stays the same.
      good: Explains ARP and the role of the default gateway but is vague about which MAC is used for remote traffic.
      weak: Believes the host ARPs for remote destinations directly or cannot explain ARP.
    followups:
      - What symptoms would a wrong subnet mask on one host cause?
      - What is gratuitous ARP used for?
    common_errors:
      - Thinking the destination MAC is the remote server's MAC for off-subnet traffic.

  - external_key: technical.network.vlans_and_trunks
    competency_key: network_engineering
    topic: VLANs and trunk ports
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me how you've used VLANs and trunk ports to separate traffic, and what goes wrong when the
      trunk settings don't match on the two ends of a link.
    expected_concepts:
      - VLANs as separate broadcast domains
      - access versus trunk ports and 802.1Q tagging
      - native VLAN and untagged traffic
      - allowed VLAN lists on trunks
      - routing between VLANs on a layer 3 device
      - native VLAN mismatch and pruned VLANs causing outages
    rubric:
      excellent: Gives a real example of segmentation, explains tagging and native VLANs, and describes concrete mismatch symptoms such as one VLAN not passing or traffic leaking into the wrong VLAN.
      good: Explains access versus trunk ports and tagging correctly with a basic example.
      weak: Treats VLANs as physical separation only or cannot say how traffic moves between VLANs.
    followups:
      - How does traffic get from one VLAN to another?
      - Why do some teams avoid carrying user traffic on the native VLAN?
    common_errors:
      - Forgetting that inter-VLAN traffic needs a router or layer 3 switch.

  - external_key: technical.network.offsubnet_unreachable
    competency_key: network_engineering
    topic: Host reaches only its own subnet
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A user can reach other machines on their floor but nothing outside their own subnet. What would you
      check, and in what order?
    expected_concepts:
      - host IP, mask and default gateway settings
      - pinging the gateway and checking the ARP entry for it
      - gateway interface state and VLAN membership
      - return route from the rest of the network
      - ACLs or firewall rules applied to the segment
    rubric:
      excellent: Works outward methodically from the host's configuration to the gateway and then the return path, explaining what each check rules in or out.
      good: Checks the host settings and the gateway but does not consider the return path or filtering.
      weak: Jumps to rebooting devices or replacing cables without a plan.
    followups:
      - The host can ping its gateway but nothing beyond. Where do you look now?
      - Only this one user is affected. How does that narrow it down?
    common_errors:
      - Not considering that the return route may be missing.

  - external_key: technical.network.private_ranges_and_nat
    competency_key: network_engineering
    topic: Private addressing and outbound NAT
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Why do most internal networks use private address ranges, and how does traffic from one of those
      hosts make it out to the internet and back?
    expected_concepts:
      - RFC 1918 ranges are not routed on the internet
      - source NAT or PAT at the edge translates to a public address
      - translation table maps source ports to inside hosts
      - return traffic matched against the translation
      - address conservation and overlapping range problems when networks merge
    rubric:
      excellent: Explains why private ranges exist, walks the outbound and return path through port address translation, and notes side effects such as overlapping ranges or inbound reachability.
      good: Explains that NAT translates private to public addresses and back with reasonable accuracy.
      weak: Thinks private addresses are routed on the internet or cannot explain how replies return.
    followups:
      - What problems show up when two companies with the same private ranges need to connect?
      - Why doesn't inbound traffic reach those hosts by default?
    common_errors:
      - Describing NAT as a security feature in itself rather than a side effect of state.

  - external_key: technical.network.ipv6_introduction
    competency_key: network_engineering
    topic: Introducing IPv6
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What practical differences would you expect when bringing IPv6 into a network that has only run IPv4
      until now?
    expected_concepts:
      - much larger address space and standard /64 subnets
      - SLAAC and DHCPv6 for addressing
      - neighbour discovery replacing ARP
      - router advertisements and the need for RA guard
      - firewall policy must be written for IPv6 too
      - dual stack operation during transition
    rubric:
      excellent: Covers addressing, neighbour discovery, address assignment options and security implications such as forgotten IPv6 firewall rules or rogue router advertisements.
      good: Notes the larger address space and dual stack and mentions at least one operational difference.
      weak: Thinks IPv6 is just longer addresses and needs no other changes.
    followups:
      - Why is a /64 the normal size for a LAN segment?
      - How could a network that "doesn't run IPv6" still have IPv6 traffic on it?
    common_errors:
      - Forgetting to apply equivalent firewall rules to IPv6.

  # ---------------------------------------------------------------- medium
  - external_key: technical.network.long_fat_pipe_throughput
    competency_key: networking
    topic: Throughput on high-latency links
    difficulty: medium
    kind: scenario
    text: >-
      A file transfer between two data centres with about eighty milliseconds of round-trip time tops out
      at a small fraction of the link's bandwidth, and there's no packet loss. What's likely limiting it,
      and how would you confirm?
    expected_concepts:
      - bandwidth-delay product
      - TCP receive window and window scaling
      - socket buffer sizes on sender and receiver
      - measuring with iperf and parallel streams
      - checking window sizes in a packet capture
    rubric:
      excellent: Calculates or reasons with the bandwidth-delay product, identifies window or buffer limits, and proposes concrete evidence from captures or tests with tuned buffers or parallel streams.
      good: Suspects the TCP window and suggests tuning but cannot explain the relationship to latency.
      weak: Blames the link or the provider without considering how TCP behaves over distance.
    followups:
      - Roughly how large does the window need to be to fill a one gigabit link at eighty milliseconds?
      - Why does running several parallel streams often help?
    common_errors:
      - Assuming more bandwidth will fix a window-limited transfer.

  - external_key: technical.network.outbound_port_exhaustion
    competency_key: networking
    topic: Ephemeral port exhaustion
    difficulty: medium
    kind: scenario
    text: >-
      A service that opens lots of short outbound connections starts failing with errors saying it can't
      assign the requested address. What's happening, and how would you fix it properly?
    expected_concepts:
      - ephemeral port range per source and destination tuple
      - connections lingering in TIME_WAIT
      - checking socket state counts with ss or netstat
      - connection pooling and keep-alive
      - widening the port range or adding source addresses as mitigations
    rubric:
      excellent: Identifies port exhaustion against a single destination, shows how to confirm it from socket states, and prefers connection reuse over kernel tweaks while explaining the risks of those tweaks.
      good: Recognises ephemeral port exhaustion and suggests sensible mitigations.
      weak: Suggests restarting the service or adding memory without understanding the cause.
    followups:
      - Why does the problem often affect only one destination?
      - What are the risks of aggressively reusing TIME_WAIT sockets?
    common_errors:
      - Treating TIME_WAIT as the bug instead of the connection pattern.

  - external_key: technical.network.retransmission_analysis
    competency_key: networking
    topic: Reading retransmissions in a capture
    difficulty: medium
    kind: technical
    text: >-
      When you open a packet capture and see a lot of retransmissions and duplicate acknowledgements, how do
      you work out whether the cause is loss on the path, a slow receiver or something else?
    expected_concepts:
      - where the capture was taken relative to the loss
      - duplicate ACKs and fast retransmit versus timeout retransmits
      - zero window and window full indicators for slow receivers
      - comparing captures from both ends
      - interface drops and queue counters on the path
    rubric:
      excellent: Distinguishes path loss from receiver-side problems using specific capture signals, explains why capture location matters and correlates with device counters.
      good: Recognises loss versus zero-window conditions but relies on a single capture point.
      weak: Treats every retransmission as a network fault without examining the evidence.
    followups:
      - How would you prove the loss happens on a particular segment?
      - What does a zero window advertisement tell you?
    common_errors:
      - Capturing on only one side and drawing firm conclusions.

  - external_key: technical.network.switching_loop_recovery
    competency_key: network_engineering
    topic: Layer 2 loops and spanning tree
    difficulty: medium
    kind: scenario
    text: >-
      Someone patched a cable between two access switches, and shortly afterwards the network on that whole
      floor became unusable. Explain what probably happened and how you'd recover and prevent it.
    expected_concepts:
      - broadcast storm from a layer 2 loop
      - spanning tree blocking redundant paths
      - MAC address table flapping
      - BPDU guard and edge port configuration
      - storm control
      - finding the loop from interface counters and logs
    rubric:
      excellent: Explains the storm mechanism, finds the offending link using counters or MAC flaps, restores service quickly and prevents recurrence with BPDU guard, storm control and consistent spanning tree design.
      good: Identifies a loop and spanning tree as the protection but is light on how to locate it quickly.
      weak: Cannot explain why one cable could take down a floor.
    followups:
      - Why didn't spanning tree stop it in this case?
      - How would you pick which switch should be the root bridge?
    common_errors:
      - Assuming spanning tree is always running and correctly configured on every port.

  - external_key: technical.network.link_aggregation_imbalance
    competency_key: network_engineering
    topic: Link aggregation and load distribution
    difficulty: medium
    kind: technical
    text: >-
      How have you used link aggregation between switches or to servers, and why might one member link end
      up carrying far more traffic than the others?
    expected_concepts:
      - LACP negotiation versus static bundles
      - per-flow hashing on addresses and ports
      - elephant flows concentrating on one member
      - choosing hash inputs appropriate to the traffic
      - multi-chassis aggregation for device redundancy
    rubric:
      excellent: Describes a real deployment, explains per-flow hashing and why few large flows cause imbalance, and suggests changing hash inputs or design while noting the limits.
      good: Explains LACP and hashing at a basic level with an example.
      weak: Believes traffic is split per packet evenly across all links.
    followups:
      - What happens to traffic on a member link that fails?
      - Why can't one flow use the full bandwidth of a four-link bundle?
    common_errors:
      - Expecting a single TCP flow to use the combined capacity.

  - external_key: technical.network.gateway_redundancy
    competency_key: network_engineering
    topic: First-hop redundancy
    difficulty: medium
    kind: technical
    text: >-
      How do you make the default gateway redundant for a server VLAN, and what failure scenarios does your
      approach still leave exposed?
    expected_concepts:
      - VRRP or HSRP with a virtual IP and MAC
      - priority, preemption and timers
      - interface or object tracking for upstream failure
      - split-brain when the hello path fails
      - anycast gateway in modern fabrics
    rubric:
      excellent: Explains the virtual gateway mechanism, uses tracking so failover reacts to upstream loss, and names remaining gaps such as split-brain, slow timers or asymmetric return paths.
      good: Describes VRRP or HSRP correctly but not tracking or residual risks.
      weak: Suggests configuring two gateways on each host or cannot describe how failover works.
    followups:
      - What happens if the active router loses its uplink but its LAN interface stays up?
      - Would you enable preemption? Why or why not?
    common_errors:
      - Not tracking the uplink, so failover never triggers on upstream failure.

  - external_key: technical.network.static_or_dynamic_routing
    competency_key: network_engineering
    topic: Static versus dynamic routing
    difficulty: medium
    kind: technical
    text: >-
      In a network you've run, how did you decide where static routes were good enough and where you needed
      a dynamic routing protocol?
    expected_concepts:
      - number of paths and rate of change
      - failover needs and convergence
      - operational overhead of maintaining static routes
      - floating static routes as backup
      - stub sites and default routes
      - filtering and summarisation with dynamic protocols
    rubric:
      excellent: Uses a real network to justify choices by size, redundancy and change rate, and mentions techniques like floating statics and summarisation where they fit.
      good: Gives sensible general criteria with a basic example.
      weak: Argues one is always better without considering the environment.
    followups:
      - What can go wrong with a static route pointing at a next hop that silently fails?
      - How did you keep routing tables from growing too large?
    common_errors:
      - Ignoring that static routes do not react to remote failures.

  - external_key: technical.network.ospf_adjacency_troubleshooting
    competency_key: network_engineering
    topic: OSPF adjacency problems
    difficulty: medium
    kind: scenario
    text: >-
      Two routers that should be OSPF neighbours either never see each other or get stuck partway through
      forming the adjacency. How would you troubleshoot that?
    expected_concepts:
      - area ID, subnet and mask mismatches
      - hello and dead timer mismatches
      - authentication mismatch
      - MTU mismatch stalling the database exchange
      - network type and passive interfaces
      - neighbour state output and debug logs
    rubric:
      excellent: Uses the neighbour state to narrow the cause, lists parameters that must match, and singles out MTU mismatch as the classic cause of a stall during database exchange.
      good: Lists several parameters that must match and knows to inspect neighbour state.
      weak: Only checks that the interfaces are up or suggests restarting the process.
    followups:
      - What does it usually mean when neighbours sit in the exchange or exstart state?
      - The adjacency forms but routes are missing. What next?
    common_errors:
      - Not knowing that MTU must match for the database exchange to complete.

  - external_key: technical.network.route_selection_order
    competency_key: network_engineering
    topic: How a router picks a route
    difficulty: medium
    kind: technical
    text: >-
      A router has learned routes to the same prefix from OSPF, from BGP and from a static entry, and also
      has a more specific prefix learned somewhere else. Walk me through how it decides where to send a
      packet.
    expected_concepts:
      - longest prefix match first
      - administrative distance between sources
      - protocol metric within a source
      - ECMP when costs tie
      - routing table versus forwarding table
    rubric:
      excellent: States that the most specific prefix wins regardless of source, then explains administrative distance and metrics in the right order with a clear example.
      good: Explains administrative distance and metrics but hesitates about longest prefix match.
      weak: Thinks the lowest metric or a particular protocol always wins regardless of prefix length.
    followups:
      - How could a more specific route cause an outage nobody expected?
      - When would you deliberately change administrative distance?
    common_errors:
      - Ranking administrative distance above longest prefix match.

  - external_key: technical.network.ecmp_behaviour
    competency_key: network_engineering
    topic: Equal-cost multipath
    difficulty: medium
    kind: technical
    text: >-
      How does equal-cost multipath decide which path a flow takes, and what problems have you seen, or
      would you expect, from it?
    expected_concepts:
      - per-flow hashing on header fields
      - polarisation across layers of devices
      - uneven load from large flows
      - rehashing when a path is added or removed
      - partial failures on one path affecting a subset of flows
    rubric:
      excellent: Explains hashing and its consequences, including polarisation, rehash disruption and gray failures that only hit some flows, and how to diagnose them.
      good: Explains per-flow hashing and uneven distribution.
      weak: Believes ECMP sprays packets evenly with no side effects.
    followups:
      - Why might only some connections between two hosts fail?
      - How does resilient or consistent hashing help?
    common_errors:
      - Assuming per-packet load sharing, which would reorder packets.

  - external_key: technical.network.ip_address_chaos
    competency_key: network_engineering
    topic: Bringing IP address management under control
    difficulty: medium
    kind: scenario
    text: >-
      You've inherited a network where addresses are tracked in an old spreadsheet and IP conflicts happen
      every week. How would you bring it under control?
    expected_concepts:
      - discovery through ARP tables, DHCP leases and scans
      - an IPAM system as the source of truth
      - DHCP reservations instead of ad hoc static addresses
      - conflict detection and DHCP snooping with dynamic ARP inspection
      - process for requesting and releasing addresses
    rubric:
      excellent: Starts with discovery to build an accurate picture, introduces a source of truth with a clear process, and adds technical controls that prevent conflicts rather than just recording them.
      good: Proposes an IPAM tool and reservations but light on discovery or prevention.
      weak: Suggests just cleaning up the spreadsheet.
    followups:
      - How would you find the device that keeps taking an address it shouldn't?
      - How do you stop the new system from drifting out of date?
    common_errors:
      - Introducing a tool without a process for keeping it accurate.

  # ------------------------------------------------------------------ hard
  - external_key: technical.network.inbound_traffic_shift
    competency_key: network_engineering
    topic: Inbound traffic engineering with BGP
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your company announces its prefixes to two upstream providers. One morning most inbound traffic has
      moved onto the more expensive link and some users report slow access. How would you investigate, and
      what levers do you have to steer it back?
    expected_concepts:
      - looking glasses and route views to see how the internet reaches you
      - changes in AS path length or upstream policy
      - AS path prepending
      - provider communities to adjust local preference
      - more specific announcements and their side effects
      - checking whether a prefix was withdrawn from one provider
    rubric:
      excellent: Gathers external evidence of how prefixes are seen, checks for withdrawn or changed announcements, and weighs prepending, communities and more-specifics with their limits and side effects.
      good: Knows inbound control is harder than outbound and names prepending and more-specifics.
      weak: Tries to fix inbound traffic with local preference or outbound settings only.
    followups:
      - Why does prepending sometimes have no visible effect?
      - What are the downsides of announcing more specific prefixes?
    common_errors:
      - Confusing outbound attributes such as local preference with inbound control.

  - external_key: technical.network.bgp_session_safeguards
    competency_key: network_engineering
    topic: Protecting BGP sessions from bad routes
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      What safeguards would you put on BGP sessions with upstream providers and peers so your network
      neither accepts bad routes nor leaks routes it shouldn't?
    expected_concepts:
      - inbound filters for bogons and your own prefixes
      - outbound prefix lists allowing only your announcements
      - maximum prefix limits
      - RPKI route origin validation
      - IRR-based filters for peers and customers
      - session authentication and TTL security
    rubric:
      excellent: Covers inbound and outbound filtering, max-prefix limits and RPKI, explains a real-world style leak or hijack each prevents, and mentions keeping filters maintained automatically.
      good: Names prefix filtering and max-prefix with sound reasoning.
      weak: Relies on the provider to filter or has no concept of route leaks.
    followups:
      - What happens if you leak a full table from one provider to the other?
      - How would you roll out RPKI validation without dropping legitimate routes?
    common_errors:
      - Filtering inbound but not outbound announcements.

  - external_key: technical.network.congestion_control_behaviour
    competency_key: networking
    topic: TCP congestion control on difficult paths
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How does TCP congestion control behave on a long, slightly lossy path, and how does the choice of
      algorithm, say a loss-based one versus something like BBR, change what users actually experience?
    expected_concepts:
      - slow start and congestion avoidance
      - loss interpreted as congestion collapsing the window
      - throughput falling with loss and round-trip time
      - model-based algorithms estimating bandwidth and RTT
      - bufferbloat and queueing delay
      - fairness between different algorithms on shared links
    rubric:
      excellent: Explains why random loss cripples loss-based algorithms on long paths, contrasts model-based behaviour, and discusses queueing delay and fairness trade-offs with an example.
      good: Describes slow start and the reaction to loss and knows newer algorithms behave differently.
      weak: Cannot explain how loss affects throughput.
    followups:
      - Where would you change the congestion control algorithm, and who benefits?
      - What is bufferbloat and how would you spot it?
    common_errors:
      - Assuming all loss means congestion.

  - external_key: technical.network.dc_fabric_design
    competency_key: network_engineering
    topic: Data-centre fabric topology
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're designing a new data-centre network for a few hundred servers that's expected to grow. How
      would you approach the topology, and why have so many teams moved away from the classic three-tier
      design?
    expected_concepts:
      - spine and leaf with predictable hop counts
      - east-west traffic dominating
      - layer 3 to the leaf with ECMP instead of spanning tree
      - oversubscription ratios and port planning
      - scaling by adding spines or leaves
      - dual-homing servers to leaf pairs
    rubric:
      excellent: Designs a spine and leaf fabric with justified oversubscription, routing choices and growth path, and explains how traffic patterns and spanning tree limits drove the shift.
      good: Proposes spine and leaf and explains the east-west argument at a basic level.
      weak: Proposes a large flat layer 2 network without considering scale or failure domains.
    followups:
      - How would you decide on the oversubscription ratio?
      - What happens to traffic when one spine fails?
    common_errors:
      - Ignoring failure domains when extending layer 2 across the fabric.

  - external_key: technical.network.vxlan_evpn_tradeoffs
    competency_key: network_engineering
    topic: VXLAN and EVPN overlays
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      What does VXLAN with an EVPN control plane give you in a data-centre fabric, and what new operational
      problems does it introduce?
    expected_concepts:
      - layer 2 segments stretched over a routed underlay
      - BGP EVPN distributing MAC and IP reachability
      - reduced flood and learn behaviour
      - distributed anycast gateway
      - encapsulation overhead and MTU planning
      - harder troubleshooting across underlay and overlay
    rubric:
      excellent: Explains the overlay and control plane clearly, names concrete benefits such as workload mobility and multitenancy, and is candid about MTU, visibility and operational complexity.
      good: Explains that VXLAN stretches layer 2 over layer 3 and that EVPN avoids flooding.
      weak: Cannot explain what the control plane adds or treats it as a VLAN replacement only.
    followups:
      - How would you troubleshoot two hosts in the same overlay segment that can't reach each other?
      - What MTU would you set on the underlay and why?
    common_errors:
      - Forgetting the extra encapsulation bytes in MTU planning.

  - external_key: technical.network.ospf_scaling_redesign
    competency_key: network_engineering
    topic: Scaling an OSPF network
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      An OSPF network running in a single area has grown to several hundred routers, and you're seeing slow
      convergence and CPU spikes whenever a link flaps. How would you redesign it?
    expected_concepts:
      - multiple areas with a backbone
      - summarisation at area borders
      - stub or totally stubby areas for branches
      - SPF throttling and LSA pacing
      - finding and dampening flapping links
      - migration plan with minimal disruption
    rubric:
      excellent: Proposes an area design with summarisation and stub areas, addresses the flapping source and timers, and lays out a staged migration with rollback.
      good: Proposes splitting into areas with summarisation but no migration plan.
      weak: Suggests faster hardware or switching protocols without addressing the design.
    followups:
      - How would you move routers into new areas without a big-bang change?
      - What do you lose when you summarise at an area border?
    common_errors:
      - Not addressing the flapping link that triggers the recalculations.
