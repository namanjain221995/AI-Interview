# Technical questions: security engineering, part 2 (secure code review, API security, cryptography and
# the secure development lifecycle).
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [security]
questions:
  # ------------------------------------------------------------- easy
  - external_key: technical.security.pr_review_priorities
    competency_key: code_quality
    topic: Prioritising a security code review
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you're handed a pull request to review for security, what do you look at first, and why in that
      order?
    expected_concepts:
      - identifying trust boundaries and where untrusted input enters
      - changes to authentication, authorisation and session handling
      - data flowing into dangerous sinks such as queries, shell calls or templates
      - cryptography, secrets and configuration changes
      - new dependencies
      - error handling and logging of sensitive data
    rubric:
      excellent: Starts from trust boundaries and the riskiest changes, follows untrusted data to sinks, and explains how the order maximises the chance of finding high-impact issues in limited time.
      good: Has a sensible checklist covering input handling, authorisation and secrets.
      weak: Reads the diff top to bottom looking for style issues or relies only on a scanner.
    followups:
      - How do you review a change when the risky part is in code that wasn't modified?
      - How long would you spend on a five-hundred-line change, and how do you decide?
    common_errors:
      - Reviewing only the changed lines and missing how they alter the behaviour of unchanged callers.

  - external_key: technical.security.validation_vs_encoding
    competency_key: security
    topic: Input validation versus output encoding
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you explain the difference between validating input and encoding output to a junior
      developer, and when is each one the right defence?
    expected_concepts:
      - validation enforces expected shape, type and range at entry
      - encoding makes data safe for a specific output context
      - the same data may need different encoding for HTML, URLs, SQL or shell
      - allowlist validation over blocklists
      - neither replaces the other
    rubric:
      excellent: Gives a crisp distinction with examples, explains why encoding must be context-specific and applied at the sink, and shows how both layers work together.
      good: Explains both correctly with at least one example of each.
      weak: Treats sanitising input as a complete defence against injection.
    followups:
      - Give me an example where valid input is still dangerous without encoding.
    common_errors:
      - Encoding data once on input and storing the encoded form, which breaks other contexts.

  - external_key: technical.security.sensitive_data_in_logs
    competency_key: security
    topic: Sensitive data in logs
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      During a review you notice the application logs full request bodies at info level, including on the
      login and payment endpoints. What concerns would you raise, and what would you suggest instead?
    expected_concepts:
      - passwords, tokens, card data and personal data ending up in logs
      - logs having broader access and longer retention than the source systems
      - structured logging with allowlisted fields and redaction
      - log injection through unescaped user input
      - purging or restricting logs that already contain sensitive data
    rubric:
      excellent: Explains why logs become a secondary data store with weaker controls, proposes allowlisted structured logging with redaction, and deals with the data already captured.
      good: Identifies credential and personal data exposure and suggests redaction.
      weak: Suggests only lowering the log level.
    followups:
      - How would you clean up the logs that already contain passwords?
    common_errors:
      - Relying on regex masking alone, which misses new fields and formats.

  - external_key: technical.security.verbose_error_disclosure
    competency_key: security
    topic: Information disclosure in error handling
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A production API returns full stack traces and raw database error messages to clients whenever
      something fails. Why is that a problem, and how would you change the error handling?
    expected_concepts:
      - disclosure of framework versions, file paths, queries and schema
      - helping attackers tune injection or enumeration attempts
      - generic client messages with a correlation identifier
      - detailed errors logged server-side only
      - disabling debug modes in production through configuration
    rubric:
      excellent: Explains how detail aids attackers, designs consistent client errors with correlation IDs, and makes sure debugging remains possible through server-side logs.
      good: Recommends generic errors and server-side logging.
      weak: Sees it only as a user-experience issue.
    followups:
      - How do you keep error responses consistent across many services?
    common_errors:
      - Hiding errors so completely that operators cannot trace failures.

  - external_key: technical.security.hash_encrypt_encode
    competency_key: security
    topic: Hashing, encryption and encoding
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Developers often mix up hashing, encryption and encoding. How would you explain when to use each one,
      using examples from real application work?
    expected_concepts:
      - encoding such as Base64 is reversible and provides no secrecy
      - encryption is reversible with a key and protects confidentiality
      - hashing is one-way and used for integrity or verification
      - keyed hashes such as HMAC for authenticity
      - password hashing as a special slow case
    rubric:
      excellent: Distinguishes all three precisely with realistic examples and adds HMAC and password hashing as important special cases.
      good: Correct definitions with at least one example each.
      weak: Calls Base64 encryption or suggests encrypting passwords for storage.
    followups:
      - When would you use an HMAC instead of a plain hash?
    common_errors:
      - Treating Base64-encoded secrets in configuration as protected.

  - external_key: technical.security.third_party_library_tracking
    competency_key: security
    topic: Software composition analysis
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you keep track of vulnerable third-party libraries in the applications you're responsible for,
      and how do you keep updates from becoming a constant fire drill?
    expected_concepts:
      - software composition analysis on lockfiles including transitive dependencies
      - software bills of materials for deployed artifacts
      - automated update pull requests with tests
      - prioritising by reachability and exploitability
      - fix deadlines by severity and ownership
    rubric:
      excellent: Describes an automated pipeline from detection to update, explains how transitive dependencies and reachability affect priority, and keeps routine updates small and frequent.
      good: Uses a scanner and an update bot and has a sense of prioritisation.
      weak: Checks dependencies manually when someone remembers.
    followups:
      - How would you handle a vulnerable transitive dependency the direct library hasn't updated yet?
    common_errors:
      - Ignoring transitive dependencies because they are not listed in the manifest.

  - external_key: technical.security.framework_secure_defaults
    competency_key: security
    topic: Framework security defaults
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What security protections do you expect a modern web framework to give you by default, and where have
      you seen teams accidentally switch them off?
    expected_concepts:
      - auto-escaping in templates and component frameworks
      - built-in CSRF protection
      - parameterised queries through the ORM
      - secure cookie and session defaults
      - escape hatches such as raw HTML rendering, safe filters, CSRF exemptions and raw SQL
      - searching for and reviewing those escape hatches
    rubric:
      excellent: Names the default protections and the specific escape hatches that disable them, and proposes tracking those escape hatches in review or with lint rules.
      good: Knows the main defaults and gives one example of bypassing them.
      weak: Assumes the framework makes the application secure without further thought.
    followups:
      - How would you flag uses of those escape hatches automatically?
    common_errors:
      - Exempting an endpoint from CSRF protection to fix a bug without understanding why it failed.

  # ------------------------------------------------------------- medium
  - external_key: technical.security.sast_rollout_triage
    competency_key: security
    topic: Rolling out static analysis
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team just turned on a static analysis tool and it reported four thousand findings across the
      codebase. How do you turn that into something developers will actually act on?
    expected_concepts:
      - tuning rules and removing noisy checks
      - baselining existing findings and gating only new ones in pull requests
      - triaging the backlog by severity, reachability and exposure
      - measuring and reducing false positives
      - clear ownership and fix guidance for developers
    rubric:
      excellent: Proposes baselining plus gating new issues, a risk-based burn-down of the backlog, and a feedback loop on rule quality so developers trust the tool.
      good: Prioritises by severity and tunes false positives.
      weak: Files four thousand tickets or blocks every build until all are fixed.
    followups:
      - How do you decide that a rule is too noisy to keep?
    common_errors:
      - Measuring success by number of findings closed rather than risk reduced.

  - external_key: technical.security.partner_api_auth
    competency_key: api_design
    topic: Authentication for a public partner API
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you design authentication and authorisation for a public REST API that third-party
      integrators use to access their customers' data?
    expected_concepts:
      - OAuth 2.0 with scoped, customer-consented access
      - client credentials for machine-to-machine access
      - API keys stored hashed, scoped and rotatable
      - least-privilege scopes and per-tenant authorisation
      - rate limiting, audit logging and revocation
    rubric:
      excellent: Separates partner identity from customer consent, designs granular scopes and revocation, and covers key storage, rotation and auditing.
      good: Chooses OAuth or scoped API keys with rotation and rate limits.
      weak: Issues one shared static key per partner with full access.
    followups:
      - How would a customer see and revoke what a partner can access?
    common_errors:
      - Storing API keys in plain text so a database leak exposes them all.

  - external_key: technical.security.graphql_risks
    competency_key: api_design
    topic: GraphQL security
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What security concerns are specific to GraphQL APIs compared with REST, and how would you address
      them?
    expected_concepts:
      - query depth and complexity limits against resource exhaustion
      - field-level and resolver-level authorisation
      - batching and aliasing used to bypass rate limits
      - introspection exposure in production
      - persisted or allowlisted queries
      - error messages leaking schema details
    rubric:
      excellent: Covers denial of service via expensive queries, authorisation at the resolver level, batching abuse and schema exposure, with concrete mitigations for each.
      good: Names complexity limits and per-field authorisation.
      weak: Treats GraphQL as just another endpoint needing no special controls.
    followups:
      - Why can a single GraphQL request defeat a per-request rate limit?
    common_errors:
      - Checking permissions only on the top-level query and not on nested resolvers.

  - external_key: technical.security.aes_ecb_hardcoded_key
    competency_key: security
    topic: Cryptographic misuse in code review
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a code review you find customer data being encrypted with AES in ECB mode, using a key that's hard
      coded in the source. Walk me through everything that's wrong and what you'd recommend.
    expected_concepts:
      - ECB leaking patterns because identical blocks encrypt identically
      - no integrity protection without authenticated encryption
      - authenticated modes such as AES-GCM with unique nonces
      - keys in source control being exposed to everyone with repository access
      - key management service and envelope encryption
      - rotating the key and re-encrypting existing data
    rubric:
      excellent: Explains each flaw and its consequence, recommends a high-level AEAD library with managed keys, and plans the migration and re-encryption of existing data.
      good: Flags ECB and the hard-coded key and recommends GCM and a key store.
      weak: Only suggests moving the key to an environment variable.
    followups:
      - What happens if a nonce is reused with AES-GCM?
      - How would you migrate the existing ciphertext without downtime?
    common_errors:
      - Switching to CBC without adding integrity protection.

  - external_key: technical.security.token_randomness
    competency_key: security
    topic: Secure random token generation
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Where have you seen weak randomness cause real problems, and how do you make sure tokens and
      identifiers in your applications are generated safely?
    expected_concepts:
      - general-purpose random functions being predictable
      - cryptographically secure generators such as the OS CSPRNG
      - enough entropy, typically at least 128 bits for secrets
      - time-based or sequential identifiers being guessable
      - lint rules or wrappers to steer developers to the right API
    rubric:
      excellent: Gives concrete examples of predictable tokens being exploited, specifies the right APIs and entropy, and proposes guardrails so developers cannot easily get it wrong.
      good: Knows to use a cryptographically secure generator and why.
      weak: Thinks any random function or a timestamp hash is fine for tokens.
    followups:
      - Is a UUID a safe password reset token? Why or why not?
    common_errors:
      - Hashing a timestamp and calling the result random.

  - external_key: technical.security.typosquatted_package
    competency_key: security
    topic: Malicious dependency response
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A developer added a new npm package last week, and you've just learned it was a typosquatted
      malicious package that runs a post-install script. What do you do?
    expected_concepts:
      - finding every repository, build and developer machine that installed it
      - working out what the script did, such as stealing tokens or environment variables
      - rotating credentials reachable from affected machines and CI
      - removing the package and checking lockfiles and caches
      - reviewing logs for exfiltration or follow-on access
      - prevention through registry proxies, install-script restrictions and new-package review
    rubric:
      excellent: Scopes exposure across developer laptops and CI, analyses the payload to target rotation, hunts for follow-on use, and proposes durable supply-chain controls.
      good: Removes the package, rotates secrets and checks where it was installed.
      weak: Removes the package and considers the matter closed.
    followups:
      - How would you know which secrets the script could reach on a CI runner?
    common_errors:
      - Forgetting developer workstations and focusing only on production.

  - external_key: technical.security.appsec_program_bootstrap
    competency_key: security
    topic: Building a secure development lifecycle
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Suppose you joined a company with no application security program at all. How would you build security
      into the development lifecycle over your first six months?
    expected_concepts:
      - understanding the most important assets and current risks first
      - quick wins such as dependency and secret scanning in CI
      - threat modelling for new high-risk features
      - security champions within engineering teams
      - secure-by-default libraries and paved roads
      - metrics and a feedback loop with engineering leadership
    rubric:
      excellent: Sequences the work by risk and effort, emphasises building with engineering rather than gatekeeping, and defines how progress will be measured.
      good: Lists sensible program elements with some prioritisation.
      weak: Proposes buying several tools or mandating sign-off on every release without a plan.
    followups:
      - What would you deliberately not do in the first six months?
    common_errors:
      - Rolling out blocking gates before teams have a way to fix what they flag.

  - external_key: technical.security.path_traversal_download
    competency_key: security
    topic: Path traversal
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A download endpoint takes a filename parameter and reads that file from a reports directory. What would
      you check during review, and what does a robust implementation look like?
    expected_concepts:
      - traversal sequences and their encoded variants
      - canonicalising the path and verifying it stays under the base directory
      - symbolic links escaping the directory
      - using opaque identifiers mapped to files instead of names
      - authorisation per file, not just per directory
    rubric:
      excellent: Identifies traversal and encoding bypasses, recommends indirect references or canonical-path checks, and remembers per-file authorisation.
      good: Recognises path traversal and suggests canonicalisation.
      weak: Proposes removing "../" from the string.
    followups:
      - How would an attacker bypass a filter that strips "../" once?
    common_errors:
      - Validating the path before decoding or normalising it.

  - external_key: technical.security.command_injection_patterns
    competency_key: security
    topic: Command injection
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How does command injection usually creep into application code, and which patterns do you push
      developers towards instead?
    expected_concepts:
      - building shell command strings with user input
      - invoking a shell implicitly through convenience APIs
      - passing arguments as arrays without a shell
      - argument injection through values beginning with dashes
      - using native libraries instead of shelling out
      - running such processes with least privilege
    rubric:
      excellent: Distinguishes shell injection from argument injection, recommends avoiding the shell and using libraries, and explains the end-of-options convention for edge cases.
      good: Recommends argument arrays without a shell.
      weak: Relies on escaping or blocklisting special characters.
    followups:
      - Why could an argument array still be dangerous when calling a tool like git or tar?
    common_errors:
      - Assuming quoting the input fully prevents injection.

  - external_key: technical.security.secret_scanning_program
    competency_key: security
    topic: Preventing secrets in source control
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you stop secrets from being committed to source control across hundreds of repositories, and
      what would you do about the ones already sitting in history?
    expected_concepts:
      - server-side push protection and pre-commit hooks
      - scanning full history across all repositories
      - verifying whether found credentials are still valid
      - rotating rather than relying on rewriting history
      - giving developers an easy secrets manager to use instead
      - routing findings to owners with deadlines
    rubric:
      excellent: Combines prevention at push time with a historical sweep, prioritises live credentials, insists on rotation, and makes the secure path easier than the risky one.
      good: Proposes scanning and pre-commit hooks and rotating discovered secrets.
      weak: Proposes rewriting git history as the fix.
    followups:
      - How do you handle false positives without developers learning to bypass the hook?
    common_errors:
      - Believing a secret is safe once it is deleted in a later commit.

  - external_key: technical.security.webhook_signing
    competency_key: api_design
    topic: Securing webhooks
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your service receives webhooks from a payment provider and also sends webhooks to your own customers.
      How do you secure both directions?
    expected_concepts:
      - verifying HMAC signatures over the raw body with constant-time comparison
      - timestamps and replay windows
      - idempotent processing of duplicate deliveries
      - per-customer signing secrets with rotation
      - outbound delivery guarded against SSRF to internal addresses
      - not trusting webhook content without fetching authoritative state when needed
    rubric:
      excellent: Covers signature verification, replay protection and idempotency inbound, plus signing, secret rotation and SSRF protection outbound.
      good: Verifies signatures inbound and signs outbound.
      weak: Relies on a secret URL or IP allowlisting alone.
    followups:
      - Why does verifying the signature over a re-serialised body cause problems?
    common_errors:
      - Comparing signatures with a normal string comparison.

  # ------------------------------------------------------------- hard
  - external_key: technical.security.field_level_encryption_design
    competency_key: security
    topic: Field-level encryption and key management
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Walk me through how you'd design encryption of sensitive customer fields in a database, including how
      keys are managed, rotated and audited.
    expected_concepts:
      - envelope encryption with data keys wrapped by a KMS or HSM key
      - key separation per tenant or data class
      - rotation by re-wrapping data keys and gradual re-encryption
      - access policies separating who can decrypt from who administers
      - searching encrypted fields via blind indexes and their trade-offs
      - audit logging of decrypt operations and crypto-shredding for deletion
    rubric:
      excellent: Designs envelope encryption with clear key hierarchy, rotation and access separation, discusses queryability trade-offs, and ties auditing and deletion into the design.
      good: Uses a KMS with data keys and describes rotation.
      weak: Relies on disk encryption or a single application-wide key in configuration.
    followups:
      - What threat does field-level encryption address that disk encryption does not?
      - How would you support exact-match search on an encrypted email column?
    common_errors:
      - Storing the data keys unwrapped next to the data they protect.

  - external_key: technical.security.custom_static_rules
    competency_key: code_quality
    topic: Custom code analysis rules
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you go beyond off-the-shelf scanners to catch a vulnerability pattern that's specific to your
      own codebase, such as new endpoints that forget the tenant check?
    expected_concepts:
      - writing custom rules in tools like Semgrep or CodeQL
      - data-flow or taint-tracking queries rather than pattern matching alone
      - framework-level guardrails that make the safe path the default
      - running rules in CI with measured false-positive rates
      - tests that enumerate routes and assert required checks
    rubric:
      excellent: Combines custom analysis with architectural guardrails and route-level tests, and discusses how to keep rules accurate as the code evolves.
      good: Writes a custom rule and runs it in CI.
      weak: Asks reviewers to remember the check.
    followups:
      - When is it better to change the framework than to write a detection rule?
    common_errors:
      - Writing rules so broad that developers learn to suppress them by habit.

  - external_key: technical.security.artifact_provenance
    competency_key: security
    topic: Build provenance and artifact integrity
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you give your organisation real confidence that the artifact running in production was built
      from reviewed source code and hasn't been tampered with along the way?
    expected_concepts:
      - protected branches with mandatory review
      - isolated, ephemeral and ideally hermetic builds
      - signed provenance attestations such as SLSA
      - artifact signing and verification at deploy or admission time
      - reproducible builds as a stronger check
      - detecting deployments that bypass the pipeline
    rubric:
      excellent: Builds a verifiable chain from review to build to deploy, enforces verification at admission, and explains which attacks each link stops.
      good: Mentions signing images and verifying signatures before deployment.
      weak: Relies on trusting the CI system and the container registry.
    followups:
      - What does signing an image prove, and what does it not prove?
    common_errors:
      - Signing artifacts but never enforcing verification at deploy time.

  - external_key: technical.security.bounty_variant_hunt
    competency_key: security
    topic: Variant analysis after a reported bug
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A bug bounty researcher reports an authorisation bypass in one API endpoint. Beyond fixing that
      endpoint, how do you work out whether the same mistake exists elsewhere and keep it from coming back?
    expected_concepts:
      - understanding the root cause rather than the symptom
      - variant analysis with code search or query-based tools
      - checking logs for prior exploitation
      - fixing at the framework or shared library level
      - regression tests and new detection rules
      - communicating with the researcher and rewarding fairly
    rubric:
      excellent: Moves from symptom to root cause, hunts variants systematically, checks for historical exploitation, and prevents recurrence with structural fixes and tests.
      good: Fixes the endpoint, searches for similar code and adds tests.
      weak: Patches the single endpoint and closes the report.
    followups:
      - How would you decide whether customers need to be notified?
    common_errors:
      - Skipping the log review for past exploitation.

  - external_key: technical.security.timing_side_channels
    competency_key: security
    topic: Timing side channels
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How can timing differences leak secrets or account information in a web application, and how would you
      design an authentication path that resists that?
    expected_concepts:
      - early-exit comparisons of tokens, MACs or API keys
      - user enumeration because password hashing only runs for existing accounts
      - constant-time comparison functions
      - performing equivalent work for unknown users
      - statistical attacks overcoming network jitter
    rubric:
      excellent: Explains both secret-comparison and enumeration timing leaks, why network noise does not save you, and how to equalise work and use constant-time primitives.
      good: Knows about constant-time comparison for secrets.
      weak: Believes network latency makes timing attacks impractical.
    followups:
      - How would you test whether your login endpoint leaks account existence through timing?
    common_errors:
      - Adding a random sleep, which averages out over many requests.

  - external_key: technical.security.customer_code_execution
    competency_key: security
    topic: Running untrusted customer code
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your product is adding a feature that lets customers run their own scripts on your platform. What
      security architecture would you put in place?
    expected_concepts:
      - strong isolation such as microVMs or gVisor rather than plain containers
      - no access to platform credentials, metadata or internal networks
      - restricted egress and per-tenant separation
      - CPU, memory, time and disk limits
      - seccomp and minimal kernel surface
      - ephemeral environments and monitoring for escape attempts
    rubric:
      excellent: Chooses an isolation boundary justified by the threat, removes access to secrets and internal networks, adds resource limits and monitoring, and considers abuse such as crypto mining.
      good: Isolates execution in containers with resource limits and no network.
      weak: Runs customer code in the main application process or a shared container.
    followups:
      - Why might a standard container not be a strong enough boundary here?
      - How would you detect abuse like cryptocurrency mining?
    common_errors:
      - Leaving the cloud metadata endpoint reachable from the sandbox.

  - external_key: technical.security.checkout_logic_review
    competency_key: security
    topic: Business logic flaws in code review
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're reviewing a change to the checkout service that applies discounts and calculates the final
      price. Which business logic flaws would you look for that automated scanners won't catch?
    expected_concepts:
      - trusting prices or totals sent by the client
      - negative or extreme quantities and rounding errors
      - stacking or reusing discounts
      - skipping workflow steps such as payment confirmation
      - currency mismatches and integer overflow
      - recalculating everything server-side from authoritative data
    rubric:
      excellent: Thinks like an attacker about the workflow, lists concrete abuse cases with fixes, and insists on server-side recalculation and invariants enforced in one place.
      good: Identifies client-trusted prices and discount abuse.
      weak: Focuses only on injection and other generic vulnerability classes.
    followups:
      - How would you write tests that encode these business rules as security invariants?
    common_errors:
      - Validating the client-supplied total instead of recomputing it.
