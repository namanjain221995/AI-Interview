# Curated questions: product management (part 2 of 4).
# Metrics and goal setting (success metrics, north star, metric trees, guardrails, OKRs, diagnosing
# metric changes, cohorts and funnels) and prioritisation trade-offs.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [product_manager]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.product_manager.feature_success_metric
    competency_key: product_sense
    topic: Choosing a success metric for a feature
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you ship a new feature, how do you choose the metric that tells you whether it worked? Use a
      feature you've actually shipped as the example.
    expected_concepts:
      - metric tied to the user problem the feature solves
      - baseline measured before launch
      - target or expected change set in advance
      - a time window for judging the result
      - instrumentation in place before launch
    rubric:
      excellent: Explains the link from user problem to metric for a real feature, describes setting a baseline and target before launch, and says what they concluded from the result.
      good: Picks a sensible metric for a real feature and explains why.
      weak: Uses generic numbers such as page views or "usage went up" with no link to the problem.
    followups:
      - What did the metric actually do after launch?
      - What would you measure differently if you launched it again?
    common_errors:
      - Picking the metric after launch based on whichever number moved.

  - external_key: technical.product_manager.metric_worth_tracking
    competency_key: product_sense
    topic: Actionable versus vanity metrics
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What makes a metric useful for making product decisions, rather than just looking good in a report?
      Give me an example of a metric you stopped tracking or replaced.
    expected_concepts:
      - metric changes when user value changes
      - the team can influence it with its work
      - normalised rates rather than ever-growing totals
      - clear definition that people interpret the same way
      - leads to a decision when it moves
    rubric:
      excellent: Gives clear criteria, a concrete example of a replaced metric, and explains which decisions the replacement enabled.
      good: Distinguishes cumulative or vanity numbers from actionable ones with an example.
      weak: Lists metrics without any criteria for judging their usefulness.
    followups:
      - Who resisted dropping the old metric, and why?
      - How do you stop the team from tracking too many metrics?
    common_errors:
      - Reporting cumulative totals that can only go up.

  - external_key: technical.product_manager.early_signals_for_slow_outcomes
    competency_key: product_sense
    topic: Leading indicators for slow outcomes
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Outcomes like revenue and long-term retention can take months to move. How do you pick earlier
      signals that tell you whether your work is on track?
    expected_concepts:
      - behaviours that predict the long-term outcome
      - checking the historical link between the signal and the outcome
      - examples such as activation or early repeat use
      - revisiting the signal when the relationship weakens
      - avoiding signals that are easy to inflate
    rubric:
      excellent: Names concrete leading indicators from their own product, explains how they verified the link to the lagging outcome, and how they would notice if the link broke.
      good: Explains leading versus lagging indicators with a plausible example.
      weak: Picks early numbers without any reason to believe they predict the outcome.
    followups:
      - How strong did the relationship need to be before you trusted the signal?
      - Has a leading indicator ever misled you?
    common_errors:
      - Assuming any early activity metric predicts retention without checking.

  - external_key: technical.product_manager.define_active_user
    competency_key: product_sense
    topic: Defining an active user
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Every product team talks about active users, but the definition varies a lot. How did you define an
      active user for a product you've worked on, and why that definition?
    expected_concepts:
      - activity that reflects real value, not just logging in
      - time window matched to natural usage frequency
      - excluding bots, internal and test accounts
      - consistent definition across reports
      - how the definition affects decisions and targets
    rubric:
      excellent: Gives a specific definition tied to the core value action and natural usage cadence, explains alternatives considered, and how the definition changed what the team prioritised.
      good: Gives a reasoned definition beyond simple logins.
      weak: Counts any visit or login without considering what activity matters.
    followups:
      - How did the numbers change when you tightened the definition?
      - How would the definition differ for a product people use monthly?
    common_errors:
      - Choosing a daily window for a product people naturally use once a week.

  - external_key: technical.product_manager.scoring_framework_limits
    competency_key: product_sense
    topic: Limits of scoring frameworks
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Many teams score ideas on things like reach, impact and effort. How have you used a scoring approach
      like that, and where did it let you down?
    expected_concepts:
      - scores are estimates with large uncertainty
      - scoring can hide strategic fit or dependencies
      - inputs can be gamed by people advocating for an idea
      - useful for comparing similar-sized items and starting discussion
      - final decision still needs judgement and strategy
    rubric:
      excellent: Describes real use of a framework, gives a concrete case where it pointed the wrong way, and explains how they adjusted the process.
      good: Uses a framework sensibly and names at least one limitation.
      weak: Treats the score as the decision, or has never used any structured approach.
    followups:
      - How did you estimate impact before you had data?
      - What did you do when two items scored almost the same?
    common_errors:
      - Presenting precise scores built on guessed inputs as if they were objective.

  - external_key: technical.product_manager.leader_squeeze_in_request
    competency_key: stakeholder_management
    topic: Responding to an off-plan request from a leader
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A senior leader asks your team to squeeze in a small feature that doesn't fit this quarter's goals.
      How would you respond?
    expected_concepts:
      - understanding the reason and urgency behind the request
      - making the trade-off visible, what would slip
      - checking whether it connects to a goal you're missing
      - offering options such as later, smaller or another team
      - agreeing a decision and communicating it
    rubric:
      excellent: Explores the underlying need, presents the concrete trade-off and options, and reaches a clear decision without damaging the relationship or the team's focus.
      good: Asks about the need and explains the trade-off before deciding.
      weak: Agrees immediately without assessing impact, or refuses without discussion.
    followups:
      - What if the leader says it will only take a day?
      - How would you explain the decision to your team?
    common_errors:
      - Saying yes to small requests repeatedly until the quarter's goals quietly slip.

  - external_key: technical.product_manager.bugs_versus_new_feature
    competency_key: product_sense
    topic: Splitting effort between bugs and new work
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your backlog has a long tail of small bugs that users complain about, alongside a new feature that
      leadership is excited about. How would you decide how to split the team's next few weeks?
    expected_concepts:
      - grouping bugs by user impact and frequency
      - effect of bugs on retention, support load and trust
      - expected value and timing of the new feature
      - quick wins versus larger fixes
      - agreeing an explicit split with the team and leadership
    rubric:
      excellent: Quantifies the bugs' impact, compares it with the feature's expected value, proposes a concrete split and explains how they would communicate it.
      good: Weighs both sides and proposes a reasonable split.
      weak: Always prioritises new features or always fixes every bug first, without reasoning.
    followups:
      - How would you track whether the bug work made a difference?
      - What would make you pause the feature entirely?
    common_errors:
      - Treating all bugs as equal rather than ranking them by impact.

  - external_key: technical.product_manager.unused_dashboard
    competency_key: communication
    topic: Fixing a dashboard nobody uses
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've inherited a product dashboard with forty charts on it, and nobody on the team looks at it. How
      would you rework what the team tracks and how it's shared?
    expected_concepts:
      - starting from the team's goals and decisions
      - a handful of core metrics with clear definitions
      - targets or expected ranges to make changes meaningful
      - a regular ritual to review the numbers
      - removing or archiving charts nobody uses
    rubric:
      excellent: Rebuilds from goals and decisions, cuts to a few well-defined metrics with targets, and builds a review habit so the numbers drive action.
      good: Proposes trimming to key metrics and reviewing them regularly.
      weak: Adds more charts or redesigns the visuals without addressing why nobody uses it.
    followups:
      - How would you know the new version is being used?
      - What would you put in a weekly metrics update?
    common_errors:
      - Fixing the layout while leaving metrics with no link to decisions.

  # ---------------------------------------------------------------- medium
  - external_key: technical.product_manager.north_star_choice
    competency_key: product_sense
    topic: Choosing a north star metric
    difficulty: medium
    kind: technical
    text: >-
      How would you choose a single north star metric for a product you know well, and what risks come
      with a team focusing on one number?
    expected_concepts:
      - metric captures value delivered to users and the business
      - teams can influence it through input metrics
      - responsive enough to see change within weeks
      - risk of over-optimising and neglecting other areas
      - pairing with guardrail metrics
    rubric:
      excellent: Proposes a specific north star for a real product, explains why it reflects user value and business success, and names concrete risks with mitigations.
      good: Gives a reasonable north star and mentions the risk of narrow focus.
      weak: Picks revenue or sign-ups without considering user value or side effects.
    followups:
      - Which input metrics would teams own under it?
      - When would you change the north star?
    common_errors:
      - Choosing a metric that can rise while users get less value.

  - external_key: technical.product_manager.metric_tree_inputs
    competency_key: product_sense
    topic: Breaking goals into input metrics
    difficulty: medium
    kind: technical
    text: >-
      How do you break a top-level goal like revenue down into input metrics that individual teams can
      actually influence? Walk me through a breakdown you've used.
    expected_concepts:
      - decomposing into multiplicative or additive drivers
      - examples such as acquisition, conversion, retention and price
      - assigning ownership of inputs to teams
      - checking that moving an input moves the output
      - avoiding double counting across teams
    rubric:
      excellent: Walks through a concrete tree with clear drivers, assigns ownership, and explains how they validated the relationships and resolved overlaps between teams.
      good: Produces a sensible breakdown with reasonable drivers.
      weak: Lists unrelated metrics with no structure connecting them to the goal.
    followups:
      - Which input turned out to have less effect than you expected?
      - How do you handle two teams influencing the same input?
    common_errors:
      - Assigning teams inputs they have no realistic way to influence.

  - external_key: technical.product_manager.guardrail_metrics
    competency_key: product_sense
    topic: Guardrails against harmful optimisation
    difficulty: medium
    kind: technical
    text: >-
      When you set a goal to increase one metric, how do you make sure the team doesn't hit it in a way
      that harms the product somewhere else?
    expected_concepts:
      - guardrail or counter metrics defined up front
      - examples such as complaints, unsubscribes, latency or refunds
      - thresholds that trigger a review or rollback
      - reviewing quality alongside quantity
      - a culture of discussing trade-offs openly
    rubric:
      excellent: Names specific guardrails for a real goal, explains thresholds and the action taken when one is breached, and gives an example where a guardrail caught a problem.
      good: Explains the guardrail idea with sensible examples.
      weak: Focuses only on hitting the primary metric.
    followups:
      - What guardrail would you set on a goal to increase notification clicks?
      - What happens when a guardrail and the primary goal conflict?
    common_errors:
      - Setting guardrails but never reviewing them until after a problem.

  - external_key: technical.product_manager.writing_okrs
    competency_key: project_management
    topic: Writing objectives and key results
    difficulty: medium
    kind: technical
    text: >-
      Walk me through how you'd write quarterly objectives and key results for your team. What separates a
      good key result from a list of tasks?
    expected_concepts:
      - objective describes a meaningful outcome
      - key results are measurable outcomes, not outputs
      - baselines and realistic but stretching targets
      - small number of key results
      - initiatives listed separately as bets toward the results
    rubric:
      excellent: Gives a concrete example objective with outcome-based key results and baselines, and explains how they set targets and reviewed progress during the quarter.
      good: Distinguishes outcomes from outputs with a reasonable example.
      weak: Writes key results such as "launch feature X", or cannot explain the difference.
    followups:
      - How did you set the target number for that key result?
      - How do you grade a key result you only partly hit?
    common_errors:
      - Writing key results that are just launch dates.

  - external_key: technical.product_manager.signups_dropped_monday
    competency_key: problem_solving
    topic: Diagnosing a sudden metric drop
    difficulty: medium
    kind: scenario
    text: >-
      You come in on Monday and weekly sign-ups have dropped twenty percent. Walk me through how you'd work
      out what happened.
    expected_concepts:
      - checking for data, tracking or reporting issues first
      - recent releases, experiments and configuration changes
      - segmenting by platform, channel, region and step in the funnel
      - external factors such as seasonality, marketing changes or outages
      - forming and testing hypotheses rather than guessing
    rubric:
      excellent: Starts by ruling out measurement problems, then segments systematically to localise the drop, checks internal and external causes, and explains how they would confirm the cause and respond.
      good: Follows a sensible order of checks and segments the data.
      weak: Jumps to a single explanation or starts changing the product before understanding the cause.
    followups:
      - The drop is only on Android in one channel. What next?
      - Who would you involve, and what would you tell leadership while investigating?
    common_errors:
      - Skipping the check for broken tracking before investigating the product.

  - external_key: technical.product_manager.retention_cohorts_flat
    competency_key: statistics_experimentation
    topic: Using cohorts to judge retention progress
    difficulty: medium
    kind: scenario
    text: >-
      Overall monthly retention has looked flat for a year, even though the team has shipped a lot of
      improvements. How would you use cohort analysis to find out whether things are actually getting
      better?
    expected_concepts:
      - grouping users by sign-up period and comparing retention curves
      - changing mix of new versus existing users hiding improvements
      - segmenting cohorts by acquisition channel or plan
      - looking at where curves flatten
      - linking cohort changes to release dates
    rubric:
      excellent: Explains how blended numbers can hide cohort improvements, describes comparing curves by cohort and segment, and how to tie changes to specific releases.
      good: Describes building cohort curves and comparing them over time.
      weak: Looks only at the overall retention number again.
    followups:
      - What if newer cohorts retain better but come from a different channel?
      - How long do you need to wait before judging a cohort?
    common_errors:
      - Comparing cohorts that came from very different acquisition channels as if like for like.

  - external_key: technical.product_manager.payment_step_dropoff
    competency_key: problem_solving
    topic: Investigating a funnel drop-off
    difficulty: medium
    kind: scenario
    text: >-
      Your checkout funnel shows that most of the users who leave do so at the payment step. How would you
      figure out why, and decide what to change?
    expected_concepts:
      - segmenting by device, payment method and region
      - checking errors, latency and failed payment rates with engineering
      - session recordings or usability tests of the step
      - distinguishing technical failure from user hesitation, such as price surprise
      - prioritising fixes and testing them
    rubric:
      excellent: Combines quantitative segmentation, technical error investigation and qualitative observation, separates failure from hesitation, and proposes testable fixes.
      good: Investigates with data and some user observation before proposing changes.
      weak: Redesigns the page based on assumptions without investigating causes.
    followups:
      - What if the drop is concentrated on one payment provider?
      - How would you measure whether your fix worked?
    common_errors:
      - Assuming the drop is a design problem when payments are actually failing.

  - external_key: technical.product_manager.three_top_priorities
    competency_key: stakeholder_management
    topic: Deciding between competing top priorities
    difficulty: medium
    kind: scenario
    text: >-
      Three teams each tell you their request is the top priority, and each has a credible business case.
      Your team can only do one this quarter. How would you decide, and how would you explain the outcome?
    expected_concepts:
      - comparing the cases on a common basis tied to company goals
      - checking the evidence behind each case
      - looking for smaller versions or sequencing
      - involving the right decision-maker when it is beyond your remit
      - transparent communication of the reasoning to all three teams
    rubric:
      excellent: Compares the requests against shared goals with evidence, explores sequencing or smaller scopes, escalates appropriately, and explains how they would communicate the decision so all three teams understand it.
      good: Applies clear criteria and communicates the decision.
      weak: Picks the most senior or loudest requester, or tries to do all three.
    followups:
      - What would you say to the team whose request was not chosen?
      - When would you escalate instead of deciding yourself?
    common_errors:
      - Splitting the team across all three requests so none is finished.

  - external_key: technical.product_manager.capacity_allocation
    competency_key: project_management
    topic: Allocating team capacity across types of work
    difficulty: medium
    kind: technical
    text: >-
      How do you decide how much of your team's capacity goes to new features, improvements to existing
      features, and engineering work like reliability or upgrades? How has that split changed over time on
      a team you've worked with?
    expected_concepts:
      - explicit allocation agreed with engineering leadership
      - adjusting by product stage and system health
      - signals such as incident rate, delivery speed or support load
      - reviewing the split regularly
      - protecting the allocation from being raided
    rubric:
      excellent: Describes an explicit, agreed allocation with reasons, the signals they use to adjust it, and a real example of changing the split and the result.
      good: Explains a reasonable split and why it should vary.
      weak: Has no deliberate approach and lets engineering work happen only when there is spare time.
    followups:
      - What signal told you it was time to shift the balance?
      - How did you explain engineering-led work to stakeholders?
    common_errors:
      - Letting feature work consume everything until an outage forces a pause.

  - external_key: technical.product_manager.cost_of_delay
    competency_key: product_sense
    topic: Factoring timing into prioritisation
    difficulty: medium
    kind: technical
    text: >-
      Some work is worth much more if it ships sooner, and some can wait with little loss. How do you
      factor timing and the cost of delay into prioritisation?
    expected_concepts:
      - identifying time-sensitive value such as seasonal or contractual deadlines
      - value that decays or windows that close
      - ranking by value per unit of time and duration
      - delaying low-urgency work without guilt
      - revisiting as conditions change
    rubric:
      excellent: Explains how cost of delay changes ordering, gives a real example where timing reshaped the plan, and shows how they estimated the cost.
      good: Recognises time-sensitive value and gives a reasonable example.
      weak: Orders work only by size of value or by request date.
    followups:
      - How do you handle a deadline that turns out to be artificial?
      - How did you estimate what a month of delay would cost?
    common_errors:
      - Treating every stakeholder deadline as a real cost of delay without checking.

  - external_key: technical.product_manager.key_result_off_track
    competency_key: project_management
    topic: Responding to a key result that is off track
    difficulty: medium
    kind: scenario
    text: >-
      Halfway through the quarter, it's clear your team will miss its main key result by a wide margin.
      What would you do?
    expected_concepts:
      - understanding why, whether the bets failed or the target was wrong
      - deciding whether to change approach, scope or the target
      - raising it early with leadership along with a plan
      - what the team has learned so far
      - updating dependent teams
    rubric:
      excellent: Diagnoses the reason, considers changing the bets or the target with evidence, communicates early with a revised plan, and extracts learning for future planning.
      good: Raises the issue early and proposes some adjustment.
      weak: Waits until the end of the quarter or quietly redefines the key result.
    followups:
      - What would you say in the update to leadership?
      - How would this change how you set targets next quarter?
    common_errors:
      - Rushing out more features late in the quarter without asking why the first ones didn't work.

  # ------------------------------------------------------------------ hard
  - external_key: technical.product_manager.growth_vs_retention_conflict
    competency_key: product_sense
    topic: Conflicting goals between teams
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your growth team is measured on sign-ups and your team is measured on early retention. Their latest
      onboarding change raised sign-ups but early retention fell. How would you work through this with
      them?
    expected_concepts:
      - checking whether the new sign-ups are a different, lower-intent mix
      - looking at absolute retained users, not just rates
      - agreeing a shared goal such as retained users
      - analysing the change by segment
      - escalating to align goals if needed
    rubric:
      excellent: Separates mix effects from real harm by analysing absolute retained users and segments, then proposes a shared outcome metric and works with the other team on it.
      good: Investigates the data and seeks a shared measure with the other team.
      weak: Asks for the change to be rolled back without analysis, or ignores the conflict.
    followups:
      - What if the absolute number of retained users went up?
      - How would you prevent goals between teams conflicting like this again?
    common_errors:
      - Reading a falling retention rate as a worse product when the denominator changed.

  - external_key: technical.product_manager.measure_trust_or_quality
    competency_key: product_sense
    topic: Measuring hard-to-measure outcomes
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you measure success for something that doesn't show up neatly in usage data, such as the
      quality of search results or how much users trust your recommendations?
    expected_concepts:
      - behavioural proxies such as reformulated searches or abandonment
      - human rating or labelled evaluation sets
      - periodic surveys alongside behaviour
      - combining several imperfect signals
      - checking the proxies agree with each other
    rubric:
      excellent: Proposes a combination of behavioural proxies, human evaluation and periodic survey signals, explains how each could mislead, and how they would validate the proxies.
      good: Suggests sensible proxies and some human evaluation.
      weak: Relies on a single usage number or says it cannot be measured.
    followups:
      - How would you set up a human evaluation that stays consistent over time?
      - Which proxy could improve while real quality gets worse?
    common_errors:
      - Treating click-through on results as a direct measure of result quality.

  - external_key: technical.product_manager.metric_stopped_meaning
    competency_key: product_sense
    topic: When a target metric stops reflecting reality
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Tell me about a time a metric your team was targeting stopped reflecting what it was meant to
      measure. How did you notice, and what did you change?
    expected_concepts:
      - targeting a number changes behaviour around it
      - signs such as the metric rising while related outcomes stay flat
      - qualitative checks to catch divergence
      - redefining or replacing the metric
      - communicating the change and resetting targets
    rubric:
      excellent: Gives a real example of a metric being gamed or drifting, describes the signals that revealed it, and the concrete redesign of the metric and incentives.
      good: Describes a real case and a reasonable fix.
      weak: Cannot give an example or treats targets as always reliable.
    followups:
      - Was anyone deliberately gaming it, or did it happen naturally?
      - How do you design metrics that are harder to inflate?
    common_errors:
      - Adding more targets on top instead of fixing the broken one.

  - external_key: technical.product_manager.safe_bets_vs_big_bets
    competency_key: product_sense
    topic: Balancing incremental work and big bets
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you balance a product's investment between safe, incremental improvements and big bets that
      might fail? How do you decide on the mix and defend it?
    expected_concepts:
      - portfolio view with an explicit allocation
      - mix depends on product maturity and competitive position
      - staging big bets with milestones and kill criteria
      - different success measures for each type of work
      - explaining the risk profile to leadership
    rubric:
      excellent: Describes a deliberate portfolio with reasons for the mix, how big bets are de-risked in stages with kill criteria, and a real example of defending or adjusting it.
      good: Recognises the need for a balance and gives reasonable criteria.
      weak: Only does incremental work, or backs big bets without any staging or exit criteria.
    followups:
      - Tell me about a big bet that failed and what you did with it.
      - How do you judge a big bet before it has users?
    common_errors:
      - Judging big bets by the same short-term metrics as incremental work.

  - external_key: technical.product_manager.first_pm_no_data
    competency_key: problem_solving
    topic: Setting up prioritisation from scratch
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You join a startup as its first product manager. There are a few hundred customers, almost no
      analytics, and a founder with strong opinions about what to build. How would you set up
      prioritisation in your first couple of months?
    expected_concepts:
      - learning the strategy and founder's reasoning first
      - talking to many customers quickly
      - adding basic instrumentation for key behaviours
      - a lightweight, visible process for decisions
      - earning trust with early wins rather than imposing a framework
    rubric:
      excellent: Lays out a pragmatic plan that builds evidence quickly, adds minimal analytics, creates a transparent decision process with the founder, and earns trust through early results.
      good: Plans to gather customer evidence and introduce some structure.
      weak: Imposes a heavy framework immediately or simply executes the founder's list.
    followups:
      - How would you handle a disagreement with the founder?
      - Which few events would you instrument first?
    common_errors:
      - Spending the first months building a perfect analytics setup before making any decisions.

  - external_key: technical.product_manager.which_change_worked
    competency_key: statistics_experimentation
    topic: Attributing impact across several launches
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team shipped five changes in the same month, and the core metric rose eight percent. Leadership
      wants to know which change worked. How would you answer?
    expected_concepts:
      - without controlled tests, attribution is uncertain
      - ruling out external factors such as seasonality or marketing
      - analysing by exposure where changes affected different users
      - holdouts or staged rollouts for future launches
      - stating clearly how certain the answer is
    rubric:
      excellent: Explains why attribution is uncertain, uses whatever natural variation exists to estimate contributions, states the uncertainty clearly and proposes holdouts or experiments to avoid the problem in future.
      good: Acknowledges the attribution problem and suggests some analysis by segment.
      weak: Credits the change they like best or splits credit evenly without analysis.
    followups:
      - How would you design launches next month so this question is answerable?
      - What would you do if leadership wanted a single answer anyway?
    common_errors:
      - Ignoring external factors that might explain the whole rise.
