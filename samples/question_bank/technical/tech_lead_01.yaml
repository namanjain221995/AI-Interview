# Tech lead, part 1: architecture decisions, design docs and design reviews.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [tech_lead]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.tech_lead.decision_record_contents
    competency_key: system_design
    topic: Recording architecture decisions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When your team makes an architecture decision, how do you capture it so that someone joining a year later
      understands not just what was chosen but why? Walk me through what goes into that record.
    expected_concepts:
      - context and the problem or constraint that forced the decision
      - options that were considered and why they were rejected
      - the decision itself and its known consequences or costs
      - status, date and who was involved
      - keeping records close to the code, for example in the repository
    rubric:
      excellent: Describes a lightweight, consistently used format with context, alternatives, consequences and status, explains where records live and how superseded decisions are linked, and gives a real example of a record being useful later.
      good: Records the decision and reasoning in a findable place and mentions alternatives considered.
      weak: Relies on meeting notes, chat threads or memory, or records only the outcome without the reasoning.
    followups:
      - How do you mark a decision that has been replaced by a newer one?
      - Who on your team writes these records, and how do you keep the habit going?
    common_errors:
      - Writing long documents nobody reads instead of short, focused records.

  - external_key: technical.tech_lead.when_design_doc_needed
    competency_key: system_design
    topic: Deciding when a design doc is needed
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Not every change deserves a design document. How do you decide when a piece of work needs one, and when
      a ticket and a pull request are enough?
    expected_concepts:
      - reversibility and cost of getting it wrong
      - impact on other teams, public contracts or data models
      - size, duration and number of engineers involved
      - novelty or uncertainty in the approach
      - scaling the document to the risk, from a one-pager to a full review
    rubric:
      excellent: Gives clear criteria tied to risk, reversibility and cross-team impact, scales the depth of the document to the decision, and gives examples on both sides of the line from their own work.
      good: Names sensible triggers such as new services, schema changes or cross-team impact.
      weak: Either requires documents for everything or never writes them, with no reasoning about risk.
    followups:
      - Tell me about a change you shipped without a doc that you later wished had one.
      - How do you stop the design doc step from slowing down small changes?
    common_errors:
      - Equating document length with rigour, so small decisions get heavy documents and big ones get none.

  - external_key: technical.tech_lead.goals_and_non_goals
    competency_key: system_design
    topic: Goals and non-goals in a design
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you use goals and non-goals when you write up a design, and can you give me an example where
      spelling out a non-goal saved the team trouble later?
    expected_concepts:
      - goals stated as measurable outcomes
      - non-goals that bound scope and prevent creep
      - aligning reviewers on what the design is not trying to solve
      - revisiting non-goals when requirements change
    rubric:
      excellent: Explains how explicit non-goals focus review and protect scope, gives a concrete example where one prevented rework or argument, and writes goals as checkable outcomes.
      good: Understands the purpose of non-goals and gives a reasonable example.
      weak: Treats non-goals as a formality or confuses them with future work items.
    followups:
      - What happens when a stakeholder objects to one of your non-goals?
    common_errors:
      - Listing non-goals that nobody would have assumed were in scope, which adds nothing.

  - external_key: technical.tech_lead.pinning_non_functional_requirements
    competency_key: system_design
    topic: Pinning down non-functional requirements
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Product requirements usually describe features, not latency, availability or data retention. How do you
      make sure those non-functional requirements get pinned down before your team commits to a design?
    expected_concepts:
      - asking targeted questions about load, latency and availability expectations
      - turning vague words like fast or real time into numbers
      - data retention, privacy and compliance needs
      - documenting assumptions when numbers are unknown
      - revisiting assumptions as usage data arrives
    rubric:
      excellent: Describes a deliberate way of drawing out concrete numbers from stakeholders, writes assumptions down when data is missing, and shows how those numbers changed a real design choice.
      good: Asks about scale and performance and records the answers in the design.
      weak: Designs from the feature list alone and discovers performance or retention needs after launch.
    followups:
      - What do you do when nobody can tell you the expected traffic?
    common_errors:
      - Accepting words like fast or scalable without asking for numbers.

  - external_key: technical.tech_lead.evaluating_new_library
    competency_key: code_quality
    topic: Evaluating a new library or framework
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An engineer on your team wants to bring a new third-party library into a core service because it would
      save a lot of code. How would you evaluate whether to adopt it?
    expected_concepts:
      - maintenance activity, release history and community health
      - licence compatibility
      - security track record and transitive dependencies
      - fit with existing stack and team familiarity
      - cost of removing it later and how widely it would spread
      - a small trial behind a clear boundary
    rubric:
      excellent: Weighs maintenance, licence, security, fit and exit cost, suggests isolating it behind an interface or trialling it in a limited area, and involves the proposing engineer in doing the evaluation.
      good: Checks maintenance, licence and fit, and makes a reasoned call.
      weak: Accepts or rejects it on gut feel or popularity alone.
    followups:
      - What would make you say no even if the library is technically excellent?
      - How would you let the engineer own the evaluation?
    common_errors:
      - Ignoring the transitive dependencies a library pulls in.

  - external_key: technical.tech_lead.reversible_vs_one_way_decisions
    competency_key: system_design
    topic: Reversible versus hard-to-reverse decisions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Some technical decisions are cheap to undo and some lock you in for years. How do you tell them apart, and
      how does that change the way you and your team make the call?
    expected_concepts:
      - public APIs, data models and storage choices as hard to reverse
      - internal implementation details as easy to change
      - spending deliberation proportional to reversal cost
      - letting engineers decide reversible things quickly
      - designs that keep later options open
    rubric:
      excellent: Classifies decisions by the cost of reversal with concrete examples, delegates and speeds up the cheap ones, and adds review, prototypes or wider input for the expensive ones.
      good: Recognises that schemas and APIs need more care than internal code.
      weak: Applies the same heavy or light process to every decision.
    followups:
      - Give me an example of a decision that looked reversible but turned out not to be.
    common_errors:
      - Treating database schema and public API choices as easy to change later.

  - external_key: technical.tech_lead.explaining_design_time_to_pm
    competency_key: stakeholder_management
    topic: Justifying time spent on design
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your product manager asks why the team is spending a week on design for a feature when they'd like
      engineers writing code now. How do you handle that conversation?
    expected_concepts:
      - explaining which risks the design work is reducing
      - linking design time to fewer rewrites or schedule surprises
      - time-boxing the design phase with a clear output
      - starting low-risk implementation in parallel where possible
      - showing the PM the open questions being resolved
    rubric:
      excellent: Frames design in terms of risks and schedule the PM cares about, offers a time-box and a visible outcome, and finds parallel work so progress is visible.
      good: Explains why design matters and agrees a reasonable timeline.
      weak: Dismisses the concern or abandons design entirely under pressure.
    followups:
      - What if the PM is right and the team is over-designing?
    common_errors:
      - Arguing for design time in purely technical terms the PM cannot weigh.

  - external_key: technical.tech_lead.useful_design_diagrams
    competency_key: communication
    topic: Diagrams that help design reviews
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Which kinds of diagrams have you found actually help reviewers understand a design, and how do you keep
      them from going out of date once the system changes?
    expected_concepts:
      - context or component diagrams for boundaries
      - sequence diagrams for request flows and failure paths
      - data flow and ownership diagrams
      - diagrams as code stored next to the source
      - updating diagrams as part of the change that alters the design
    rubric:
      excellent: Matches diagram types to the question a reviewer needs answered, keeps them versioned with the code, and makes updating them part of the normal change process.
      good: Uses a couple of appropriate diagram types and has some way to keep them current.
      weak: Draws one large box-and-arrow picture with no clear meaning, or never updates diagrams.
    followups:
      - When would you draw a sequence diagram rather than a component diagram?
    common_errors:
      - Mixing logical components, deployment units and data flow in one diagram so none of them is clear.

  # ---------------------------------------------------------------- medium
  - external_key: technical.tech_lead.build_versus_buy
    competency_key: system_design
    topic: Build versus buy
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team needs a capability such as feature flagging or full-text search, and there are managed products
      available as well as the option of building it in-house. How would you lead that decision?
    expected_concepts:
      - core differentiator versus commodity capability
      - total cost of ownership including operations and on-call
      - vendor lock-in, data residency and exit cost
      - integration effort and fit with existing systems
      - time to value and team capacity
      - a short evaluation with explicit criteria
    rubric:
      excellent: Sets explicit criteria before comparing, accounts for long-term running costs and exit paths, distinguishes differentiating work from commodity work, and describes a real decision with its outcome.
      good: Compares cost, effort and fit sensibly and reaches a justified choice.
      weak: Defaults to building because it is more interesting, or buying because it is faster, without weighing ongoing costs.
    followups:
      - How would you protect the team if the vendor raised prices or shut down?
      - What evidence would make you reverse the decision a year later?
    common_errors:
      - Comparing only licence cost against build effort and ignoring years of maintenance and on-call.

  - external_key: technical.tech_lead.running_design_review
    competency_key: leadership
    topic: Running a design review that reaches a decision
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you run a design review so that it ends with a decision rather than an open-ended discussion?
      Describe what happens before, during and after the meeting.
    expected_concepts:
      - document shared in advance with specific questions for reviewers
      - inviting the right people, including those affected
      - a named decision maker and a clear decision rule
      - separating blocking concerns from preferences
      - recording the outcome and follow-up actions
    rubric:
      excellent: Describes preparation, a clear owner of the decision, focused discussion on open questions, and written outcomes with owners, and explains how disagreements that remain are resolved.
      good: Shares documents ahead of time and records decisions.
      weak: Reviews are unstructured, with decisions left implicit or reopened repeatedly.
    followups:
      - How do you handle a reviewer who raises a major concern for the first time in the meeting?
      - When would you skip the meeting and review asynchronously?
    common_errors:
      - Ending the meeting without saying who decides or what was decided.

  - external_key: technical.tech_lead.presenting_alternatives_fairly
    competency_key: system_design
    topic: Presenting alternatives fairly
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you write a design and you already have a favourite option, how do you make sure the alternatives
      get a fair hearing rather than being set up to lose?
    expected_concepts:
      - shared evaluation criteria applied to every option
      - asking someone who prefers another option to write it up
      - stating the real strengths of rejected options
      - stating the risks and weaknesses of the preferred option
      - including the do-nothing option
    rubric:
      excellent: Uses common criteria, invites advocates of other options to contribute, is open about the weaknesses of their own choice, and gives an example where a review changed their mind.
      good: Lists alternatives with genuine pros and cons.
      weak: Lists alternatives only to dismiss them, or cannot describe ever changing a preferred design.
    followups:
      - Tell me about a time a reviewer's alternative turned out to be better than yours.
    common_errors:
      - Leaving out the option of doing nothing or deferring the change.

  - external_key: technical.tech_lead.extracting_a_service
    competency_key: system_design
    topic: Deciding whether to split out a service
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some engineers on your team want to pull a module out of the monolith into its own service. How would you
      evaluate whether that's worth doing right now?
    expected_concepts:
      - the concrete problem the split would solve (deploy coupling, scaling, ownership)
      - clean data and code boundaries before extraction
      - operational cost of a new service (deploys, monitoring, on-call)
      - network calls, latency and consistency changes
      - modularising inside the monolith as an alternative first step
    rubric:
      excellent: Starts from the problem to be solved, checks whether the boundary is already clean, weighs operational and consistency costs, and considers a modular monolith step before committing.
      good: Identifies several real trade-offs and makes a reasoned recommendation.
      weak: Assumes microservices are always better, or rejects the idea without examining the problem.
    followups:
      - What would you need to see in the code before extraction is safe?
      - How would you handle data the module shares with the rest of the monolith?
    common_errors:
      - Splitting the code while leaving both sides sharing the same database tables.

  - external_key: technical.tech_lead.settling_storage_disagreement
    competency_key: system_design
    topic: Settling a design disagreement with evidence
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Two experienced engineers on your team disagree on how to store data for a new feature. One wants a
      relational schema, the other a document store, and the debate has gone on for a week. How would you move
      it forward?
    expected_concepts:
      - restating the requirements and access patterns both options must meet
      - identifying the specific questions the disagreement hinges on
      - a time-boxed prototype or benchmark against real access patterns
      - considering operational familiarity and existing infrastructure
      - making and recording the call, with the rationale
    rubric:
      excellent: Reframes the debate around requirements and access patterns, uses a short experiment to settle the factual questions, makes a clear call with recorded reasoning, and keeps both engineers engaged in the outcome.
      good: Gathers both views, compares against requirements and decides.
      weak: Lets the debate continue indefinitely, or picks a side without explaining why.
    followups:
      - How would you make sure the engineer whose option lost stays engaged?
    common_errors:
      - Benchmarking synthetic workloads that do not match the feature's real access patterns.

  - external_key: technical.tech_lead.revisiting_old_decisions
    competency_key: system_design
    topic: Revisiting an earlier architecture decision
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you know when an architecture decision your team made a while ago should be revisited, and what
      does that process look like for you?
    expected_concepts:
      - the original context or assumptions no longer holding
      - signals such as repeated workarounds, incidents or slow delivery in one area
      - comparing cost of change against cost of staying
      - writing a new decision that supersedes the old one
      - avoiding churn from revisiting decisions too often
    rubric:
      excellent: Ties revisiting to changed assumptions and concrete signals, weighs migration cost, records a superseding decision, and gives an example from experience.
      good: Recognises when circumstances change and describes a reasonable re-evaluation.
      weak: Either never revisits decisions or reopens them whenever someone new disagrees.
    followups:
      - How do you keep the team from relitigating settled decisions?
    common_errors:
      - Deleting or rewriting the old decision record instead of marking it superseded.

  - external_key: technical.tech_lead.contract_first_api
    competency_key: api_design
    topic: Agreeing a service contract with consumers
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When your team builds a service that other teams will call, how do you design and agree the contract with
      them before the implementation is finished?
    expected_concepts:
      - writing the contract first in a schema such as OpenAPI or protobuf
      - reviewing it with consuming teams and their real use cases
      - mock servers or stubs so consumers can start early
      - versioning and compatibility rules
      - contract tests to catch drift
    rubric:
      excellent: Describes a contract-first flow with consumer review, early stubs, explicit compatibility rules and automated contract tests, and gives an example of feedback that changed the API.
      good: Shares a spec with consumers and handles versioning.
      weak: Builds the service first and documents the API afterwards.
    followups:
      - How do you handle one consumer asking for something that would complicate the API for everyone else?
    common_errors:
      - Sharing the API with consumers only after it is deployed, when changes are expensive.

  - external_key: technical.tech_lead.translating_real_time_requirement
    competency_key: system_design
    topic: Turning vague requirements into design constraints
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A product manager tells you a new inventory feature must be real time and always accurate. How would you
      turn that into concrete requirements your team can actually design against?
    expected_concepts:
      - asking what goes wrong for the user if data is stale and for how long
      - defining acceptable latency and staleness in numbers
      - identifying where strong consistency is truly needed, such as reservations
      - cost and complexity of stronger guarantees
      - writing the agreed numbers into the design
    rubric:
      excellent: Uses questions about user impact to separate the operations that need strong consistency from those that can tolerate delay, agrees numeric targets, and explains the cost of each guarantee in terms the PM understands.
      good: Pushes for specific latency and accuracy numbers and reflects them in the design.
      weak: Accepts the wording at face value and over-engineers everything, or ignores it.
    followups:
      - What would you say if the PM insisted every screen needs strong consistency?
    common_errors:
      - Applying the strictest consistency to every operation because one operation needs it.

  - external_key: technical.tech_lead.operability_in_design
    competency_key: system_design
    topic: Designing for operations
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Before you sign off on a design, what do you expect it to say about running the system in production, and
      why do you insist on that at design time rather than before launch?
    expected_concepts:
      - key metrics, logs and traces and what alerts will fire
      - rollout and rollback plan
      - failure modes and behaviour of dependencies under failure
      - capacity estimates and limits
      - ownership and on-call expectations
    rubric:
      excellent: Lists concrete operability expectations and explains how addressing them early changes the design itself, for example idempotency or feature flags, with an example where it mattered.
      good: Expects monitoring, rollout and failure handling to be covered.
      weak: Treats operations as something to add after the code is written.
    followups:
      - Which failure mode do teams most often forget to design for?
    common_errors:
      - Leaving rollback for schema or data changes out of the design.

  - external_key: technical.tech_lead.security_privacy_at_design_time
    competency_key: security
    topic: Security and privacy in the design phase
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you bring security and privacy thinking into a design before any code is written, rather than
      relying on a review at the end?
    expected_concepts:
      - lightweight threat modelling of trust boundaries and data flows
      - classifying the data handled and minimising what is collected
      - authentication and authorisation decisions made explicitly
      - involving security specialists early on risky designs
      - secure defaults captured as team patterns
    rubric:
      excellent: Describes a practical threat modelling habit, data classification and minimisation, explicit authorisation design and early specialist involvement, with an example of a design that changed as a result.
      good: Includes a security section in designs and considers sensitive data.
      weak: Leaves security to a separate team or a pre-launch checklist.
    followups:
      - How do you keep threat modelling lightweight enough that engineers actually do it?
    common_errors:
      - Assuming internal services do not need authorisation checks.

  - external_key: technical.tech_lead.stalled_design_doc
    competency_key: leadership
    topic: Unblocking a stalled design document
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A design document from one of your engineers has collected sixty comments over two weeks, and there's
      still no agreement. What would you do?
    expected_concepts:
      - grouping comments into the few real open questions
      - separating blocking concerns from style or preference
      - a focused discussion with the key reviewers
      - naming a decision maker and a deadline
      - supporting the author rather than taking the doc over
    rubric:
      excellent: Distils the comments into a small set of decisions, brings the right people together with a deadline, makes or delegates the call explicitly, and coaches the author through it.
      good: Steps in to drive a decision and clears the backlog of comments.
      weak: Waits for consensus to emerge or rewrites the document themselves.
    followups:
      - How would you prevent the next design doc from ending up in the same place?
    common_errors:
      - Replying to every comment individually instead of identifying the few real decisions.

  # ------------------------------------------------------------------ hard
  - external_key: technical.tech_lead.target_architecture_path
    competency_key: system_design
    topic: Evolving towards a target architecture
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Suppose the current architecture of your product is holding the team back. How would you define where you
      want to get to, and plan a path there without a big-bang rewrite or a feature freeze?
    expected_concepts:
      - describing the target state and the problems it solves
      - incremental steps that each deliver value on their own
      - strangler or branch-by-abstraction techniques
      - sequencing by risk and business priority
      - measuring progress and checkpoints to adjust the target
      - keeping feature work flowing alongside
    rubric:
      excellent: Defines a target grounded in concrete problems, lays out independently valuable increments using proven migration patterns, sequences by risk and value, and builds in checkpoints to change course, ideally drawing on a real migration.
      good: Proposes incremental migration with a sensible order and progress tracking.
      weak: Proposes a rewrite or a vague end state with no path, or ignores ongoing feature work.
    followups:
      - How do you stop the migration stalling halfway, leaving two architectures to maintain?
      - How would you explain the plan's cost to leadership?
    common_errors:
      - Defining the end state in detail but leaving the intermediate states unworkable.

  - external_key: technical.tech_lead.evaluating_rewrite_proposal
    competency_key: system_design
    topic: Evaluating a rewrite proposal
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A strong engineer proposes rewriting a core service from scratch in a different language, arguing it will
      be faster and easier to maintain. How would you evaluate that proposal?
    expected_concepts:
      - identifying the actual problems with the current service and their evidence
      - hidden behaviour and edge cases encoded in the old code
      - cost of running two systems during migration
      - team skills, hiring and operational tooling for the new language
      - incremental alternatives such as refactoring or partial replacement
      - a bounded proof of concept with success criteria
    rubric:
      excellent: Separates the real problems from the appeal of something new, quantifies the hidden cost of rewrites, considers incremental options, and proposes a bounded experiment with clear criteria while treating the engineer's concerns seriously.
      good: Raises the major risks of a rewrite and asks for evidence before committing.
      weak: Approves because the idea sounds exciting, or rejects it outright without engaging with the underlying problems.
    followups:
      - What result from a proof of concept would convince you to go ahead?
      - How would you capture the behaviour of the old service before replacing it?
    common_errors:
      - Underestimating how much undocumented behaviour the old service handles.

  - external_key: technical.tech_lead.designing_under_load_uncertainty
    competency_key: system_design
    topic: Designing when scale is uncertain
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're designing a new system and nobody can tell you whether it will see ten times or a thousand times
      today's traffic within two years. How do you design so you don't over-build now but aren't trapped later?
    expected_concepts:
      - designing for the near term with headroom, not the extreme case
      - identifying the parts that are hard to change later, such as data partitioning keys and IDs
      - keeping stateless layers easy to scale out
      - leading indicators and load tests to trigger the next step
      - documenting the scaling plan and its thresholds
    rubric:
      excellent: Invests early only in the hard-to-change decisions such as data model, keys and interfaces, keeps everything else simple, defines measurable thresholds that trigger the next phase, and backs this with a concrete example.
      good: Builds for moderate scale and identifies a few things to get right up front.
      weak: Designs for the largest possible scale from day one, or ignores growth entirely.
    followups:
      - Which single decision would be most painful to change if traffic grew a thousand times?
    common_errors:
      - Introducing sharding or many services up front for traffic that may never arrive.

  - external_key: technical.tech_lead.architecture_guardrails_vs_autonomy
    competency_key: leadership
    topic: Architecture guardrails versus team autonomy
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      When several teams build on the same product, how do you keep the architecture coherent without making
      every decision go through a central review?
    expected_concepts:
      - a small set of explicit principles and non-negotiable standards
      - paved paths and templates that make the right thing easy
      - review only for decisions above a defined risk or impact threshold
      - shared decision records visible across teams
      - automated checks for the rules that matter most
    rubric:
      excellent: Describes a layered approach with few firm rules, defaults that make compliance easy, review reserved for high-impact decisions and automation for enforceable rules, and discusses how they would know if the balance was wrong.
      good: Proposes shared standards and some review process without making it a bottleneck.
      weak: Proposes either full central control or no coordination at all.
    followups:
      - How would you notice that teams are working around the guardrails?
    common_errors:
      - Publishing standards without tooling or templates, so following them costs teams extra effort.

  - external_key: technical.tech_lead.unwinding_a_championed_design
    competency_key: ownership
    topic: Correcting a design you championed
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Six months after your team adopted an event-driven design you pushed for, debugging has become painful and
      data is duplicated across several services. What would you do?
    expected_concepts:
      - acknowledging the problem openly with the team
      - diagnosing whether the issue is the pattern or how it was applied
      - targeted fixes such as tracing, clearer event ownership or schema contracts
      - weighing partial reversal against improvement
      - recording what was learned in a new decision
    rubric:
      excellent: Owns the original call without defensiveness, separates flaws in the approach from flaws in the execution, proposes concrete improvements or a staged reversal with costs weighed, and shares the lessons.
      good: Admits the problem and proposes reasonable fixes.
      weak: Defends the design despite the evidence or reverses everything without analysis.
    followups:
      - How would you explain the change of course to stakeholders who supported the original plan?
    common_errors:
      - Blaming the team's execution without examining whether the original decision fitted the problem.

  - external_key: technical.tech_lead.enforcing_architecture_rules
    competency_key: code_quality
    topic: Keeping code aligned with the intended architecture
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Over time, codebases drift away from the architecture everyone agreed on, with layers calling each other in
      the wrong direction and modules reaching into each other's internals. How do you detect and prevent that
      drift on an ongoing basis?
    expected_concepts:
      - automated dependency or layering rules in the build
      - module boundaries enforced by packaging or visibility
      - metrics such as coupling or cycles tracked over time
      - review guidance on boundary changes
      - handling legitimate exceptions explicitly
    rubric:
      excellent: Uses automated checks for dependency direction and module boundaries, tracks structural metrics over time, has a clear path for approved exceptions, and gives an example of drift they caught.
      good: Relies on some tooling plus review to keep boundaries in place.
      weak: Relies only on reviewers noticing, or does not see drift as a problem.
    followups:
      - How would you introduce these checks into a codebase that already violates them in many places?
    common_errors:
      - Turning on strict rules all at once and producing hundreds of failures nobody fixes.
