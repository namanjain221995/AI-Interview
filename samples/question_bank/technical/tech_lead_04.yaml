# Tech lead, part 4: delivery risk, estimation under uncertainty, launch safety and quality ownership.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [tech_lead]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.tech_lead.early_drift_signals
    competency_key: project_management
    topic: Early signs a project is drifting
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What early signals tell you a technical project is drifting off track, well before a deadline actually
      slips?
    expected_concepts:
      - tasks repeatedly carried over or growing after being started
      - open questions and unknowns not shrinking
      - integration and end-to-end testing pushed later
      - dependencies without firm dates
      - engineers vague about what is left
    rubric:
      excellent: Names specific leading indicators, explains how they watch for them in normal team routines, and gives an example where spotting one early let them correct course.
      good: Identifies several meaningful warning signs.
      weak: Relies on the deadline itself or burndown charts alone to notice problems.
    followups:
      - Which of those signals is most often ignored, and why?
    common_errors:
      - Treating the percentage of tickets closed as a reliable measure of progress.

  - external_key: technical.tech_lead.time_boxed_spikes
    competency_key: project_management
    topic: Using spikes and prototypes to reduce risk
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When do you use a time-boxed spike or prototype on your team, and how do you make sure it actually answers
      the question it was meant to answer?
    expected_concepts:
      - a specific question or risk stated up front
      - a fixed time-box
      - a clear output such as a recommendation or measurement
      - throwing away prototype code or hardening it deliberately
      - feeding findings back into the plan and estimates
    rubric:
      excellent: Starts each spike from a written question and time-box, insists on a concrete answer at the end, decides deliberately what happens to the code, and gives an example where a spike changed the plan.
      good: Uses spikes for unknowns with a time limit and a result.
      weak: Uses spikes as open-ended exploration with no defined question or end.
    followups:
      - What do you do when the time-box ends without a clear answer?
    common_errors:
      - Letting spike code drift into production without the testing it needs.

  - external_key: technical.tech_lead.flags_for_delivery_risk
    competency_key: code_quality
    topic: Feature flags as a delivery tool
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How does your team use feature flags to reduce delivery risk, and how do you stop old flags from piling up
      and making the code harder to follow?
    expected_concepts:
      - merging unfinished work safely behind flags
      - gradual rollout and quick switch-off
      - testing both flag states
      - an owner and expiry for each flag
      - removing the flag and dead path after rollout
    rubric:
      excellent: Uses flags for safe merging and staged rollout, tests both paths, and has a concrete practice for owning and removing flags, with an example of flag debt they cleaned up.
      good: Uses flags for rollout and has some plan to remove them.
      weak: Uses flags without any cleanup, or does not see their value.
    followups:
      - How would you find flags that have been fully on for months?
    common_errors:
      - Leaving both code paths in place long after the rollout is complete.

  - external_key: technical.tech_lead.definition_of_done
    competency_key: ownership
    topic: What done means for a feature
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      On your team, what does it mean for a feature to be done? I'm interested in what goes beyond the code being
      merged.
    expected_concepts:
      - tests at the right levels passing
      - deployed and verified in production
      - monitoring and alerts in place
      - documentation or runbooks updated
      - feature flags cleaned up and users or stakeholders informed
    rubric:
      excellent: Describes a definition of done that ends with the feature verified in production and supported, explains how the team keeps to it, and gives an example of a problem it prevented.
      good: Includes testing, deployment and some operational readiness.
      weak: Considers a feature done once the pull request is merged.
    followups:
      - Who checks that the definition of done was met?
    common_errors:
      - Closing tickets at merge time and never checking the feature works in production.

  - external_key: technical.tech_lead.vendor_api_gap_mid_sprint
    competency_key: project_management
    topic: Discovering a blocking gap mid-sprint
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Halfway through a sprint, an engineer finds that the third-party API you're integrating with doesn't support
      an operation the feature depends on. What would you do first, and what happens next?
    expected_concepts:
      - confirming the finding quickly, including with the vendor
      - informing the product owner early
      - identifying options such as a workaround, reduced scope or another provider
      - estimating the impact of each option
      - adjusting the sprint plan openly
    rubric:
      excellent: Verifies the gap fast, raises it immediately with clear options and their costs, lets the product owner make an informed choice, and captures the lesson about validating integrations earlier.
      good: Raises the issue promptly and proposes alternatives.
      weak: Keeps the team pushing on quietly hoping to find a workaround.
    followups:
      - How could the team have found this before the sprint started?
    common_errors:
      - Waiting until the sprint review to tell the product owner.

  - external_key: technical.tech_lead.estimate_on_the_spot
    competency_key: stakeholder_management
    topic: Being asked for an estimate on the spot
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      In a meeting, a product manager asks you how long a new feature will take. The details are still fuzzy. How
      do you respond?
    expected_concepts:
      - giving a range rather than a single number
      - stating the main assumptions and unknowns
      - offering a firmer estimate after a short investigation
      - asking what decision the estimate is for
      - involving the engineers who will do the work
    rubric:
      excellent: Gives a useful rough range with explicit assumptions, asks what the estimate will be used for, and commits to a refined estimate by a specific time after consulting the team.
      good: Avoids a false precise number and explains the uncertainty.
      weak: Gives a single number to satisfy the room, or refuses to give anything.
    followups:
      - What if the PM writes your rough range down as a commitment?
    common_errors:
      - Quoting a best-case number that later becomes the deadline.

  - external_key: technical.tech_lead.ship_or_hold_release
    competency_key: ownership
    topic: Deciding whether to ship with a known bug
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      The day before a planned release, testing finds a bug that isn't critical but that customers will notice.
      How do you decide whether to ship or hold?
    expected_concepts:
      - severity, reach and workaround for affected users
      - cost of delay to customers and the business
      - option to ship with the feature flagged off or partially rolled out
      - effort and risk of a quick fix
      - involving the product owner in the decision
    rubric:
      excellent: Weighs user impact against the cost of delay, looks for middle options such as flagging or limiting rollout, involves the product owner, and makes and communicates a clear decision.
      good: Considers impact and options and decides sensibly with stakeholders.
      weak: Always ships or always holds by rule, or rushes a risky last-minute fix.
    followups:
      - What would change your answer?
    common_errors:
      - Rushing an untested fix into the release, which adds more risk than the bug.

  # ---------------------------------------------------------------- medium
  - external_key: technical.tech_lead.communicating_estimate_ranges
    competency_key: stakeholder_management
    topic: Communicating uncertainty in long estimates
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      For a technical project of several months, how do you communicate the estimate so stakeholders understand
      the uncertainty, and how do you update them as you learn more?
    expected_concepts:
      - ranges or likely and pessimistic dates
      - naming the biggest unknowns and when they will be resolved
      - milestones that narrow the range
      - regular re-forecasting
      - early notice when the range moves
    rubric:
      excellent: Communicates ranges tied to specific unknowns, shows how milestones narrow the range, re-forecasts on a regular rhythm, and raises changes early, with an example of how stakeholders responded.
      good: Uses ranges and updates stakeholders periodically.
      weak: Gives a single date and only reports when it is missed.
    followups:
      - How do you handle a stakeholder who insists on a single date?
    common_errors:
      - Padding a single estimate secretly instead of making the uncertainty visible.

  - external_key: technical.tech_lead.technical_risk_tracking
    competency_key: project_management
    topic: Identifying and tracking technical risks
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      At the start of a project, how do you identify the technical risks and keep track of them as the work goes
      on? Walk me through a real risk you managed.
    expected_concepts:
      - a structured pass over new technology, integrations, scale and data
      - likelihood and impact for each risk
      - mitigation steps and owners
      - tackling the biggest risks early in the schedule
      - reviewing the list regularly
    rubric:
      excellent: Uses a structured way to find risks, assigns owners and mitigations, schedules risk reduction early, reviews regularly, and walks through a specific risk from identification to outcome.
      good: Lists risks with mitigations and revisits them.
      weak: Identifies risks only when they turn into problems.
    followups:
      - Which risk did you miss entirely, and why?
    common_errors:
      - Writing a risk list at kick-off and never looking at it again.

  - external_key: technical.tech_lead.slicing_delivery_for_risk
    competency_key: project_management
    topic: Slicing a large feature into increments
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you break a large feature into increments that each either deliver value to users or reduce a real
      risk, rather than just splitting it by technical layer?
    expected_concepts:
      - a thin end-to-end slice early
      - ordering slices by risk and learning value
      - releasing increments to real users or internal users
      - avoiding horizontal layers that deliver nothing on their own
      - adjusting later slices based on feedback
    rubric:
      excellent: Starts with a thin end-to-end slice, orders increments by risk and value, gets real feedback from each, and gives a concrete example of a feature they sliced this way.
      good: Understands vertical slicing and applies it reasonably.
      weak: Plans by layer such as database then API then UI, with nothing usable until the end.
    followups:
      - How would you slice a feature where the hardest part is a data migration?
    common_errors:
      - Leaving integration of all the pieces until the final increment.

  - external_key: technical.tech_lead.testing_strategy_new_service
    competency_key: testing
    topic: Setting a testing strategy for a new service
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      As tech lead on a new service, how do you decide the testing strategy, meaning what mix of tests the team
      writes and where they run?
    expected_concepts:
      - fast unit tests for logic
      - integration tests against real dependencies such as databases
      - contract tests with other services
      - a small number of end-to-end checks for critical journeys
      - what runs on each commit versus before release
      - keeping the suite fast and reliable
    rubric:
      excellent: Chooses the mix based on where the service's risks lie, explains which tests run where and why, plans for speed and reliability, and describes how they got the team to adopt it.
      good: Proposes a sensible layered strategy with reasons.
      weak: Recites a test pyramid without connecting it to the service's actual risks.
    followups:
      - How would you deal with a suite that has become slow and flaky?
    common_errors:
      - Relying mainly on end-to-end tests, which are slow and hard to diagnose.

  - external_key: technical.tech_lead.observability_expectations
    competency_key: observability
    topic: Observability expectations for new features
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What observability do you expect a new feature to ship with, and how do you make that a habit on your team
      instead of something added after the first incident?
    expected_concepts:
      - metrics for usage, errors and latency of the feature
      - structured logs and trace context
      - dashboards and alerts tied to user impact
      - observability as part of design and definition of done
      - reviewing it in pull requests and launch checks
    rubric:
      excellent: Defines concrete expectations, builds them into design, review and definition of done, makes it easy with shared libraries or templates, and gives an example where it shortened an investigation.
      good: Expects metrics, logs and alerts and checks for them.
      weak: Adds monitoring reactively after problems occur.
    followups:
      - How would you check whether an alert is actually useful?
    common_errors:
      - Adding many metrics but no alerts tied to user impact.

  - external_key: technical.tech_lead.rollback_safety_rules
    competency_key: system_design
    topic: Rules for rollback-safe changes
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What rules do you set on your team so changes can be rolled back safely, especially when they involve schema
      changes or several services deploying in sequence?
    expected_concepts:
      - expand and contract schema migrations
      - backward and forward compatible data formats and APIs
      - decoupling deploy from release with flags
      - deploy order rules for dependent services
      - testing the rollback path, not just the rollout
    rubric:
      excellent: Sets clear compatibility rules such as expand and contract and versioned APIs, separates deploy from release, defines deploy ordering, and practises rollbacks, with an example where these rules prevented an outage.
      good: Knows the main techniques and applies them to schema and API changes.
      weak: Assumes rollback means redeploying the previous version and ignores data changes.
    followups:
      - What would you do when a migration genuinely can't be reversed?
    common_errors:
      - Dropping or renaming a column in the same release as the code that stops using it.

  - external_key: technical.tech_lead.key_engineer_leaves_mid_project
    competency_key: project_management
    topic: Losing a key engineer mid-project
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Halfway through a critical project, the engineer who designed most of the core component tells you they're
      moving to another team in three weeks. How would you handle the transition and the delivery risk?
    expected_concepts:
      - prioritising knowledge transfer while they are still available
      - pairing others on their in-flight work
      - documenting design decisions and open issues
      - re-planning scope and dates realistically
      - reducing single points of knowledge in future
    rubric:
      excellent: Uses the remaining time deliberately for hands-on handover, re-plans and communicates the impact openly, and addresses the underlying knowledge concentration so the team is more resilient.
      good: Organises a handover and adjusts the plan.
      weak: Asks for a document on the last day, or keeps the original plan unchanged.
    followups:
      - How would you have reduced this risk before it happened?
    common_errors:
      - Relying on written handover alone without anyone making real changes alongside them.

  - external_key: technical.tech_lead.fixed_date_launch_rollout
    competency_key: ownership
    topic: Planning the rollout for a fixed-date launch
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Marketing has announced a launch date for a feature that will get a large spike of traffic on day one. How
      would you plan the technical rollout to keep the risk low?
    expected_concepts:
      - load testing against realistic expected traffic
      - dark launching or deploying early behind a flag
      - gradual exposure where the announcement allows it
      - kill switches and graceful degradation
      - launch-day monitoring and staffed response
    rubric:
      excellent: Separates deployment from the public launch, validates capacity with realistic load tests, prepares kill switches and degradation paths, and plans launch-day monitoring and staffing.
      good: Plans load testing, early deployment and monitoring.
      weak: Deploys on launch day and hopes it holds.
    followups:
      - What would you degrade first if the system started to struggle?
    common_errors:
      - Load testing only the new feature and not the shared dependencies it will stress.

  - external_key: technical.tech_lead.urgent_escalation_pulls_capacity
    competency_key: project_management
    topic: Absorbing an urgent interruption mid-project
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Mid-project, you're asked to pull two of your five engineers onto an urgent customer escalation for two
      weeks. How do you manage the impact on the project?
    expected_concepts:
      - confirming the priority and expected duration
      - choosing who moves based on skills and in-flight work
      - re-planning to keep the critical path moving
      - communicating the schedule impact to stakeholders
      - returning engineers and handling the context switch
    rubric:
      excellent: Confirms the trade-off with whoever set priorities, staffs the escalation thoughtfully, re-sequences the project to protect the critical path, and communicates the new forecast promptly.
      good: Adjusts the plan and informs stakeholders of the impact.
      weak: Absorbs the loss silently and lets the project slip without telling anyone.
    followups:
      - What if the escalation runs for six weeks instead of two?
    common_errors:
      - Assuming the original dates still hold after losing forty percent of the team.

  - external_key: technical.tech_lead.rising_defects_after_releases
    competency_key: code_quality
    topic: Quality dropping while velocity holds
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team is shipping at a good pace, but the number of bugs reported after each release has been climbing
      for two months. How would you diagnose what's going on and respond?
    expected_concepts:
      - analysing where defects come from by area and type
      - checking test coverage and review depth for those areas
      - pressure or incentives pushing speed over care
      - targeted fixes in testing, review or release process
      - tracking whether the trend reverses
    rubric:
      excellent: Diagnoses with defect data before changing anything, looks at both technical and process causes including schedule pressure, applies targeted fixes, and monitors the trend.
      good: Investigates causes and introduces sensible quality measures.
      weak: Adds a manual QA phase or slows everything down without understanding the cause.
    followups:
      - How would you discuss the trade-off with a product manager who is happy with the pace?
    common_errors:
      - Adding process across the board when the defects come from one area.

  - external_key: technical.tech_lead.stuck_at_ninety_percent
    competency_key: project_management
    topic: A task stuck at almost done
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      For the third week running, an engineer reports that their task is ninety percent done. How would you handle
      that?
    expected_concepts:
      - a supportive conversation about what is actually left
      - breaking the remaining work into concrete pieces
      - looking for a hidden technical blocker or unclear requirement
      - offering pairing or help
      - adjusting the plan and making progress visible
    rubric:
      excellent: Digs into the remaining work without blame, uncovers the real blocker, breaks it into visible steps, offers help, and improves how the team reports progress.
      good: Talks to the engineer and helps break down the remaining work.
      weak: Keeps accepting the status or pressures the engineer to finish faster.
    followups:
      - How could the team make this kind of situation visible sooner?
    common_errors:
      - Treating it as a motivation issue when the task was underspecified or blocked.

  # ------------------------------------------------------------------ hard
  - external_key: technical.tech_lead.parallelising_new_system_work
    competency_key: project_management
    topic: Structuring work for parallel development
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You have five engineers starting on a brand-new system. How would you structure the work so they can make
      progress in parallel without constantly blocking or breaking each other?
    expected_concepts:
      - a walking skeleton built first to fix the overall shape
      - agreeing interfaces and contracts early
      - stubs and mocks so components can progress independently
      - ownership areas aligned with clear boundaries
      - continuous integration of the pieces
      - regular design syncs as interfaces evolve
    rubric:
      excellent: Builds a thin skeleton and agrees interfaces before splitting work, assigns ownership along clean boundaries, uses stubs to decouple progress, integrates continuously, and explains how they would handle interface changes.
      good: Splits work by component with agreed interfaces.
      weak: Assigns tasks without considering interfaces, leading to late integration.
    followups:
      - What would you do in the first week before parallel work begins?
    common_errors:
      - Integrating separately built components only near the end.

  - external_key: technical.tech_lead.running_a_pre_mortem
    competency_key: project_management
    topic: Running a pre-mortem
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you run a pre-mortem for a major technical project, and can you tell me about something one
      changed in a plan you were part of?
    expected_concepts:
      - imagining the project has failed and listing reasons
      - collecting views independently before discussion
      - including people from outside the core team
      - grouping and ranking the failure causes
      - turning the top ones into concrete mitigations with owners
    rubric:
      excellent: Describes a structured session that collects independent input, ranks the likely failure modes, and turns them into scheduled mitigations, with a concrete example of a plan that changed as a result.
      good: Understands the technique and how to get useful output from it.
      weak: Describes a generic risk discussion with no follow-through.
    followups:
      - How do you make it safe for people to raise uncomfortable failure scenarios?
    common_errors:
      - Generating a list of risks and assigning no owner or action to any of them.

  - external_key: technical.tech_lead.architecture_misses_target_midway
    competency_key: ownership
    topic: Architecture won't meet the target halfway through
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Three months into a six-month project, load tests show the chosen architecture won't meet the performance
      target. How would you handle the technical decision and the conversation with stakeholders?
    expected_concepts:
      - confirming the result and finding the real bottleneck
      - options from targeted optimisation to partial redesign
      - re-checking whether the target itself is right
      - a revised plan with cost, risk and dates for each option
      - telling stakeholders promptly with a recommendation
    rubric:
      excellent: Validates the finding, identifies the bottleneck, lays out options with trade-offs including challenging the target, recommends a path, and communicates early and openly with a revised plan.
      good: Investigates and proposes a credible adjusted plan to stakeholders.
      weak: Hides the result hoping to optimise later, or proposes starting over without analysis.
    followups:
      - How would you decide whether to challenge the target rather than the architecture?
    common_errors:
      - Waiting until optimisation is attempted before telling stakeholders there is a problem.

  - external_key: technical.tech_lead.public_date_with_major_unknown
    competency_key: stakeholder_management
    topic: Committing to a date with a major unknown
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Leadership wants to announce a public date for a product that depends on something nobody has proven yet,
      for example whether a new model can reach the required accuracy. How would you respond?
    expected_concepts:
      - making the unknown and its consequences explicit
      - proposing an experiment that resolves the unknown quickly
      - committing to a decision point instead of a launch date
      - fallback scope that can ship if the unknown fails
      - agreeing in writing what is and isn't committed
    rubric:
      excellent: Explains the specific unknown and its impact, proposes a short experiment and a decision point, offers a fallback product that could hit a date, and secures shared understanding of what is committed.
      good: Pushes back with reasons and proposes a staged commitment.
      weak: Agrees to the date to avoid conflict, or refuses without offering alternatives.
    followups:
      - What if leadership announces the date anyway?
    common_errors:
      - Accepting the date and planning as if the unknown will work out.

  - external_key: technical.tech_lead.late_security_design_flaw
    competency_key: security
    topic: A security flaw found just before launch
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Two weeks before launch, a security review finds a design flaw in how your services authorise requests
      between each other, and fixing it properly touches several services. How do you decide what to do?
    expected_concepts:
      - assessing exploitability and impact with security experts
      - interim mitigations such as network restrictions or narrowed scope
      - a plan and date for the full fix
      - involving stakeholders in the launch decision with clear risk statements
      - understanding why the flaw was not caught at design time
    rubric:
      excellent: Assesses the real risk with security, considers interim mitigations and a committed full fix, makes the launch decision transparently with stakeholders, and fixes the design review gap that let it through.
      good: Takes the flaw seriously and plans a fix with a clear launch decision.
      weak: Launches without addressing it, or delays indefinitely without assessing risk.
    followups:
      - Who should have the final say on launching with a known risk?
    common_errors:
      - Treating an interim mitigation as the permanent fix.

  - external_key: technical.tech_lead.deliberate_shortcuts_for_date
    competency_key: ownership
    topic: Choosing which corners to cut
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      To hit an important date, you agree with leadership that the team will take some shortcuts. How do you decide
      which shortcuts are acceptable, and how do you keep the resulting debt under control?
    expected_concepts:
      - never cutting on data integrity, security or irreversible decisions
      - preferring shortcuts that are local and easy to undo
      - recording each shortcut with its cost and owner
      - a scheduled follow-up agreed with stakeholders before launch
      - checking the follow-up actually happens
    rubric:
      excellent: Draws clear lines on what cannot be compromised, chooses contained and reversible shortcuts, records them with owners, secures an agreed time to repay them before launch, and follows through.
      good: Picks sensible shortcuts and plans to address them afterwards.
      weak: Cuts wherever is fastest, or makes no plan to repay the debt.
    followups:
      - What would you do if the follow-up time keeps getting taken by new features?
    common_errors:
      - Skipping tests or monitoring, which makes every later shortcut harder to undo safely.

  - external_key: technical.tech_lead.multi_team_critical_path
    competency_key: project_management
    topic: Coordinating a multi-team launch on the critical path
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team is on the critical path of a launch that needs four teams' work to come together. How would you
      coordinate the technical integration and spot slippage in other teams before it's too late?
    expected_concepts:
      - agreed interfaces and integration milestones across teams
      - an early end-to-end integration environment
      - shared tracking of cross-team dependencies
      - regular integration checkpoints using working software
      - fallback plans if one team's piece slips
    rubric:
      excellent: Drives early and repeated end-to-end integration across teams, relies on working software rather than status reports, tracks dependencies visibly, and prepares fallbacks for the riskiest pieces.
      good: Sets milestones and checks in with other teams regularly.
      weak: Relies on each team's status updates and plans integration for the end.
    followups:
      - What would you do if one team keeps reporting green but nothing works end to end?
    common_errors:
      - Trusting status reports instead of testing the integrated system.
