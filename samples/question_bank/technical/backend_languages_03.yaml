# Curated questions: backend language depth, part 3 (Go runtime, GC, concurrency, errors, modules, testing).
# `defaults` are merged into every question (question keys win).
# Round types follow difficulty: easy -> technical_screening + combined; medium -> + deep_technical;
# hard -> deep_technical + combined.
version: 1
defaults:
  role_tags: [backend]
questions:
  # ------------------------------------------------------------- errors
  - external_key: technical.backend_languages.go_error_wrapping
    competency_key: go
    topic: Wrapping and inspecting errors in Go
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you handle and wrap errors in Go so that callers can still make decisions based on them? Talk me
      through how you use errors.Is and errors.As in practice.
    expected_concepts:
      - wrapping with fmt.Errorf and the percent w verb to add context
      - errors.Is for sentinel values through a wrap chain
      - errors.As for typed errors carrying data
      - adding context once per layer without duplicating logs
      - deciding which errors are part of a package's API
    rubric:
      excellent: Wraps with context at each layer, uses Is for sentinels and As for typed errors with a real example, avoids logging and returning the same error repeatedly, and treats exported errors as API.
      good: Wraps errors with context and knows the difference between Is and As.
      weak: Compares error strings or discards errors with the blank identifier.
    followups:
      - When would you deliberately not wrap an error so callers can't depend on it?
      - How do you avoid the same error being logged at every layer?
    common_errors:
      - Matching on the text of error messages.

  - external_key: technical.backend_languages.go_panic_as_exceptions
    competency_key: go
    topic: Panic and recover in service code
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A teammate proposes using panic and recover throughout a Go service as a kind of exception mechanism, to
      avoid all the error checks. How would you respond in the code review?
    expected_concepts:
      - errors as values are the Go convention for expected failures
      - panic for programmer errors and impossible states
      - recover at goroutine or request boundaries only
      - panics in goroutines without recover crash the whole process
      - helper functions or patterns to reduce repetitive checks
    rubric:
      excellent: Explains why explicit errors are the convention, where panics are appropriate, the process-crash risk in goroutines, and offers practical ways to reduce boilerplate, delivered as constructive review feedback.
      good: Rejects the approach and explains when panics are acceptable.
      weak: Accepts the idea, or rejects it only with an appeal to style without reasons.
    followups:
      - Where in an HTTP server is a recover genuinely useful?
      - What happens if a goroutine started by a handler panics?
    common_errors:
      - Assuming a recover in the HTTP handler also protects goroutines it spawned.

  - external_key: technical.backend_languages.go_typed_nil_error
    competency_key: debugging
    topic: A nil error that isn't nil
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A Go function returns a pointer to a custom error type that is nil, yet the caller's check says an error
      occurred. How would you explain what's going on and fix it?
    expected_concepts:
      - an interface value holds both a type and a value
      - a typed nil pointer inside an interface is not a nil interface
      - returning the error interface type and a literal nil on success
      - linters that flag this pattern
    rubric:
      excellent: Explains the interface type and value pair clearly, shows how the typed nil arises, fixes it by returning a plain nil error, and mentions how linting or review catches it.
      good: Identifies the typed nil inside an interface and the fix.
      weak: Adds extra nil checks in the caller without understanding the cause.
    followups:
      - Where else can this interface behaviour surprise you?
      - How would you write a test that catches this?
    common_errors:
      - Declaring the return type as the concrete error pointer instead of the error interface.

  # ------------------------------------------------------------- modules and dependencies
  - external_key: technical.backend_languages.go_modules_updates
    competency_key: go
    topic: Go modules and dependency updates
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Walk me through how Go modules manage a service's dependencies, and how you keep those dependencies up to
      date safely.
    expected_concepts:
      - go.mod declares requirements and go.sum records checksums
      - minimal version selection picks the minimum satisfying version
      - go mod tidy and reviewing diffs to go.mod and go.sum
      - the checksum database and module proxy
      - vulnerability scanning with govulncheck
      - small regular updates with tests
    rubric:
      excellent: Explains go.mod, go.sum and minimal version selection accurately, describes a routine update process with tidy, tests and govulncheck, and knows the role of the proxy and checksum database.
      good: Knows the files involved and updates dependencies with go get and tests.
      weak: Cannot explain go.sum or updates everything at once without review.
    followups:
      - How does minimal version selection differ from how npm or pip resolve versions?
      - When would you use a replace directive, and why shouldn't it stay forever?
    common_errors:
      - Assuming Go always picks the newest available version of a dependency.

  - external_key: technical.backend_languages.go_breaking_library_release
    competency_key: go
    topic: Releasing a breaking change in a Go module
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You maintain a Go library that several teams import, and you need to make a breaking change to its API. How
      do you release it without breaking the services that depend on it?
    expected_concepts:
      - semantic import versioning with a v2 module path
      - both major versions can coexist in one build
      - deprecation comments and a migration guide
      - adding new APIs alongside old ones before removing
      - tooling or automated pull requests to migrate consumers
    rubric:
      excellent: Explains the major version path rule, plans a deprecation period with both APIs available, communicates and helps consumers migrate, and considers whether the break can be avoided entirely.
      good: Knows a new major version needs a new module path and communicates the change.
      weak: Pushes the breaking change under the same version or tag and lets consumers find out.
    followups:
      - What happens if two dependencies of a service need different major versions of your library?
      - How would you decide whether the break is worth it?
    common_errors:
      - Tagging a breaking release as v2 without changing the module path.

  # ------------------------------------------------------------- interfaces, generics and design
  - external_key: technical.backend_languages.go_interface_placement
    competency_key: go
    topic: Where Go interfaces belong
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide where to define interfaces in a Go codebase and how large they should be?
    expected_concepts:
      - small interfaces defined by the consumer
      - accept interfaces and return concrete types
      - implicit satisfaction without declaring implementation
      - avoiding interfaces with a single implementation created only for mocks
      - composition of small interfaces
    rubric:
      excellent: Defines interfaces at the point of use with only the methods needed, returns concrete types, explains how implicit satisfaction enables this, and warns against speculative interfaces, with a real example.
      good: Prefers small interfaces and knows they are satisfied implicitly.
      weak: Creates large interfaces next to every implementation as in a Java-style design without reasons.
    followups:
      - How does this choice affect testing?
      - When would a package export an interface itself?
    common_errors:
      - Defining a large interface in the provider package that every consumer must depend on.

  - external_key: technical.backend_languages.go_generics_judgement
    competency_key: go
    topic: When generics help in Go
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Where have you found generics genuinely useful in Go, and where do you think they make the code worse?
    expected_concepts:
      - type-safe containers and collection helpers
      - constraints and type sets
      - replacing code generation or empty interface plus assertions
      - interfaces are still better for behaviour polymorphism
      - readability cost of heavily parameterised code
    rubric:
      excellent: Gives concrete good uses, explains constraints, contrasts generics with interfaces for behaviour, and names cases where generics reduced clarity, showing restraint.
      good: Gives at least one appropriate use and one caution.
      weak: Either avoids generics without reasons or wants to make everything generic.
    followups:
      - How would you choose between a generic function and one accepting an interface?
      - What did Go code do before generics for the same problem?
    common_errors:
      - Using generics where a plain interface would express the behaviour more simply.

  - external_key: technical.backend_languages.go_context_in_structs_review
    competency_key: code_quality
    topic: Reviewing context misuse in Go
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      In a review you find a Go codebase that stores the database transaction and the current user in context
      values, and keeps contexts in struct fields. What problems do you expect, and how would you guide the team?
    expected_concepts:
      - context values are untyped and hide dependencies
      - request-scoped metadata only, such as trace ids
      - contexts stored in structs outlive the request and break cancellation
      - passing dependencies explicitly as parameters or fields
      - unexported key types to avoid collisions
      - incremental refactoring plan and team guidelines
    rubric:
      excellent: Explains hidden dependencies, lost type safety and lifetime problems, separates legitimate request metadata from dependencies, proposes explicit passing with a gradual refactor, and turns it into team guidance rather than a one-off comment.
      good: Identifies that dependencies should be passed explicitly and contexts shouldn't be stored in structs.
      weak: Accepts the pattern as idiomatic or only comments on naming.
    followups:
      - Which values do you think genuinely belong in a context?
      - How would you handle a transaction that needs to span several repository calls?
    common_errors:
      - Using plain string keys for context values, which can collide across packages.

  # ------------------------------------------------------------- concurrency
  - external_key: technical.backend_languages.go_context_cancellation
    competency_key: go
    topic: Using context for deadlines and cancellation
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What is context.Context for in a Go service, and how do you thread it through your code from the handler
      down to database and HTTP calls?
    expected_concepts:
      - carrying deadlines and cancellation across API boundaries
      - context as the first parameter by convention
      - WithTimeout and WithCancel with deferred cancel calls
      - passing it to database and HTTP clients so they stop work
      - checking Done in long-running loops
    rubric:
      excellent: Explains cancellation and deadline propagation, follows the first-parameter convention, always calls the cancel function, and shows how downstream clients and loops honour cancellation.
      good: Passes context through calls and uses timeouts.
      weak: Uses context.Background everywhere or treats context as a general-purpose bag of values.
    followups:
      - What happens if you forget to call the cancel function?
      - How would you give one downstream call a shorter timeout than the request?
    common_errors:
      - Creating a fresh background context deep in the call stack, which drops the caller's deadline.

  - external_key: technical.backend_languages.go_mutex_or_channel
    competency_key: go
    topic: Mutexes versus channels
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When do you protect shared state with a mutex in Go, and when do you use channels instead? Give me an
      example of each from real code.
    expected_concepts:
      - mutexes for guarding simple shared state such as caches or counters
      - channels for passing ownership and coordinating work
      - RWMutex trade-offs under contention
      - atomic operations for simple counters
      - keeping the critical section small and avoiding holding locks during I/O
    rubric:
      excellent: Chooses by intent, ownership transfer versus guarding state, gives real examples of each, discusses RWMutex and atomics with their costs, and avoids holding locks across I/O.
      good: Gives a sensible rule of thumb with at least one example.
      weak: Insists channels should always be used, or cannot explain when a mutex is simpler.
    followups:
      - When can an RWMutex be slower than a plain mutex?
      - How would you protect a map that is read constantly and updated once an hour?
    common_errors:
      - Building complex channel choreography where a mutex would be clearer.

  - external_key: technical.backend_languages.go_bounded_fanout_errgroup
    competency_key: go
    topic: Bounded fan-out with cancellation
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Say a Go handler needs to call several backends concurrently, cancel the rest when one fails, and never
      run more than ten calls at once. How would you build that?
    expected_concepts:
      - errgroup with a derived context
      - SetLimit or a semaphore to bound concurrency
      - first error cancels the shared context
      - collecting results safely into indexed slices or with a mutex
      - an overall deadline for the whole operation
    rubric:
      excellent: Uses errgroup with context and a concurrency limit, explains how cancellation reaches in-flight calls, collects results without races, and adds an overall deadline.
      good: Uses goroutines with a WaitGroup or errgroup and handles errors and limits reasonably.
      weak: Starts unbounded goroutines with no cancellation or error propagation.
    followups:
      - What happens to calls that ignore the context?
      - How would you return partial results when only some backends are required?
    common_errors:
      - Writing results into a shared map from several goroutines without synchronization.

  - external_key: technical.backend_languages.go_intermittent_data_race
    competency_key: debugging
    topic: Finding an intermittent data race
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A Go service occasionally returns corrupted entries from a shared in-memory map, and sometimes crashes with
      a concurrent map write error. You can't reproduce it locally. How would you find and fix the problem?
    expected_concepts:
      - running tests and a staging build with the race detector
      - writing a concurrent test that stresses the code path
      - auditing every access to the shared map
      - protecting it with a mutex or using sync.Map where it fits
      - copying data before returning it to callers
    rubric:
      excellent: Uses the race detector with a targeted concurrent test, audits all access paths including returned references, applies proper synchronization, and makes the race detector part of CI.
      good: Recognises a data race and fixes it with a mutex, using the race detector to confirm.
      weak: Adds sleeps or retries, or does not know about the race detector.
    followups:
      - Why might returning a slice from a protected map still be unsafe?
      - What does the race detector cost, and where would you run it?
    common_errors:
      - Locking writes but not reads.

  - external_key: technical.backend_languages.go_loop_variable_capture
    competency_key: go
    topic: Loop variables captured by goroutines
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      In a Go service built with an older toolchain, goroutines started inside a for loop all seem to process the
      last item. What's happening, and how would you fix it and prevent it in future?
    expected_concepts:
      - the loop variable was shared across iterations before Go 1.22
      - closures capture variables, not values
      - passing the value as an argument or shadowing it
      - newer Go versions create a new variable per iteration
      - vet and linters that flag the pattern
    rubric:
      excellent: Explains variable capture precisely, gives the fix for old toolchains, knows the language change in newer Go and its dependency on the go directive version, and suggests linting.
      good: Identifies the capture problem and gives a working fix.
      weak: Adds sleeps or channels without understanding the capture.
    followups:
      - Which setting decides whether a module gets the new loop semantics?
      - Where else can closures capturing variables surprise you?
    common_errors:
      - Assuming upgrading the toolchain alone changes semantics without updating the go version in go.mod.

  - external_key: technical.backend_languages.go_graceful_shutdown
    competency_key: go
    topic: Graceful shutdown of a Go service
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      During deploys, a Go HTTP service drops in-flight requests and leaves half-processed queue messages behind.
      How would you implement a graceful shutdown?
    expected_concepts:
      - catching SIGTERM with signal.NotifyContext
      - failing readiness first so traffic drains
      - http.Server Shutdown with a timeout
      - stopping consumers from fetching and finishing in-flight messages
      - acknowledging messages only after successful processing
      - grace period aligned with the orchestrator's termination timeout
    rubric:
      excellent: Orders the steps correctly, readiness off, stop accepting, drain with a deadline, stop consumers and finish work, close resources, and aligns timeouts with the platform while keeping at-least-once processing safe.
      good: Handles SIGTERM and calls Shutdown on the HTTP server with a timeout.
      weak: Relies on the process being killed or uses os.Exit on the signal.
    followups:
      - What should happen to a message whose processing doesn't finish within the grace period?
      - How do you test shutdown behaviour?
    common_errors:
      - Exiting as soon as the signal arrives, before in-flight work completes.

  - external_key: technical.backend_languages.go_http_client_hangs
    competency_key: go
    topic: HTTP client calls that never return
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A Go service calling a partner API sometimes hangs indefinitely, and the goroutine count creeps up for hours
      afterwards. What's probably missing in how the HTTP client is used, and how would you fix it?
    expected_concepts:
      - the default client has no overall timeout
      - per-request context deadlines
      - transport timeouts for dial, TLS handshake and response headers
      - always closing and draining response bodies
      - reusing one client so connections are pooled
      - goroutine profiles to confirm where they are blocked
    rubric:
      excellent: Names the missing timeouts at client, transport and request level, body closing and client reuse, and confirms the cause using a goroutine profile before and after.
      good: Adds a timeout and closes response bodies.
      weak: Restarts the service periodically or adds retries without timeouts.
    followups:
      - How would you see where the stuck goroutines are waiting?
      - Why does creating a new client per request hurt?
    common_errors:
      - Not closing response bodies, which leaks connections.

  - external_key: technical.backend_languages.go_stalled_worker
    competency_key: debugging
    topic: A Go worker that silently stops making progress
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A Go worker service stops making progress after a few hours. There are no errors, CPU is idle, and the
      process is still alive. How would you diagnose it, and what kinds of bugs would you look for?
    expected_concepts:
      - goroutine dumps through pprof or SIGQUIT
      - goroutines blocked on channel sends or receives with no partner
      - lock ordering deadlocks and forgotten unlocks
      - unbuffered channels with an exited reader
      - missing timeouts on network calls
      - progress metrics and alerts on work completed
    rubric:
      excellent: Captures goroutine stacks, groups them by blocking location, identifies classic channel and lock bugs, adds timeouts or select with context, and adds progress-based alerting.
      good: Uses a goroutine dump to find blocked goroutines and suggests likely channel or lock issues.
      weak: Restarts the worker on a schedule without looking for the cause.
    followups:
      - How would you expose goroutine profiles safely in production?
      - What alert would have caught this sooner?
    common_errors:
      - Relying on liveness checks that pass while no real work is happening.

  # ------------------------------------------------------------- memory, GC and runtime
  - external_key: technical.backend_languages.go_escape_analysis
    competency_key: go
    topic: Stack versus heap allocation in Go
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How does Go decide whether a value lives on the stack or the heap, and how have you used that to reduce
      allocations in hot code?
    expected_concepts:
      - escape analysis at compile time
      - gcflags with m to see escape decisions
      - values escaping through pointers, interfaces or closures
      - preallocating slices and reusing buffers
      - benchmarks with allocation reporting to verify
    rubric:
      excellent: Explains escape analysis and common escape causes, shows how to inspect decisions, gives a real allocation reduction verified with benchmarks, and avoids premature optimisation elsewhere.
      good: Knows the compiler decides via escape analysis and names some techniques to reduce allocations.
      weak: Believes new or make always means heap and pointers always mean slower, without evidence.
    followups:
      - Why can passing a value to an interface parameter cause an allocation?
      - How do you decide a hot path is worth this effort?
    common_errors:
      - Returning pointers everywhere to avoid copies, which increases heap allocation.

  - external_key: technical.backend_languages.go_memory_limit_tuning
    competency_key: go
    topic: GOGC and GOMEMLIMIT in containers
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A Go service in a container with a one-gigabyte limit gets OOM-killed during traffic bursts, even though its
      live heap is normally around four hundred megabytes. How would you tune the runtime and the code?
    expected_concepts:
      - GOGC lets the heap grow to a multiple of live data before collecting
      - GOMEMLIMIT as a soft limit below the container limit
      - risk of GC thrashing near the limit
      - reducing burst allocations and bounding concurrency
      - heap profiles during bursts
    rubric:
      excellent: Explains how GOGC sets heap growth, sets GOMEMLIMIT with headroom, warns about thrashing, and fixes the source of burst allocations with profiling and concurrency limits.
      good: Knows GOMEMLIMIT or GOGC and applies it sensibly.
      weak: Only increases the container limit or calls the garbage collector manually.
    followups:
      - What happens if the live heap itself exceeds GOMEMLIMIT?
      - Which metrics would you watch after the change?
    common_errors:
      - Setting GOMEMLIMIT equal to the container limit, leaving no room for non-heap memory.

  - external_key: technical.backend_languages.go_gc_design
    competency_key: go
    topic: How Go's garbage collector works
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Explain at a high level how Go's garbage collector works, including concurrent marking, the pacer and
      write barriers, and how that design shapes the way you write latency-sensitive code.
    expected_concepts:
      - concurrent tri-colour mark and sweep without compaction
      - write barriers during marking
      - the pacer and GC assist slowing allocating goroutines
      - short stop-the-world phases
      - cost driven by allocation rate and pointer-heavy heaps
      - reducing pointers and allocations in hot paths
    rubric:
      excellent: Describes concurrent marking with write barriers, the pacer and mark assists, why pauses are short but CPU cost scales with allocation and pointers, and links this to concrete coding practices.
      good: Knows the collector is concurrent and non-generational and that allocation rate drives cost.
      weak: Describes a generic stop-the-world or generational collector or cannot connect GC to coding choices.
    followups:
      - Why do mark assists show up as latency in request handlers?
      - Why might a large map of pointers be expensive for the collector?
    common_errors:
      - Assuming Go's collector is generational like the JVM's.

  - external_key: technical.backend_languages.go_gc_cpu_reduction
    competency_key: go
    topic: Reducing garbage collection CPU
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      CPU profiles show a Go service spending about thirty percent of its time in garbage collection. Walk me
      through how you'd find where the allocations come from and bring that number down.
    expected_concepts:
      - allocation profiles with alloc_space and alloc_objects
      - benchmarks with allocation reporting for hot functions
      - common sources such as string concatenation, fmt, conversions and JSON
      - buffer reuse and preallocation
      - tuning GOGC with memory headroom as a complementary lever
      - measuring before and after under realistic load
    rubric:
      excellent: Uses allocation profiles to rank sources, fixes the top ones with targeted changes verified by benchmarks, considers GOGC tuning against memory budget, and measures the real effect under load.
      good: Uses pprof to find allocation hot spots and reduces some of them.
      weak: Turns off the garbage collector or tunes flags blindly without profiling.
    followups:
      - What's the difference between in-use and allocated space in a heap profile?
      - When is raising GOGC a reasonable fix on its own?
    common_errors:
      - Looking at in-use memory instead of allocation volume when the problem is GC CPU.

  - external_key: technical.backend_languages.go_sync_pool_usage
    competency_key: go
    topic: When sync.Pool is worth it
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What is sync.Pool good for, and when have you seen it misused or simply not worth the complexity?
    expected_concepts:
      - reusing short-lived temporary objects such as buffers
      - pooled objects can be dropped at any garbage collection
      - resetting objects before reuse
      - retaining very large buffers wastes memory
      - only worthwhile when profiles show allocation pressure
    rubric:
      excellent: Explains the right use case, the GC-cleared semantics, the need to reset state, the risk of hoarding oversized buffers, and insists on profiling evidence first.
      good: Knows it reduces allocations for temporary objects and must be reset.
      weak: Uses it as a connection pool or long-lived cache.
    followups:
      - Why would you avoid putting a huge buffer back into the pool?
      - What bug appears if you forget to reset a pooled object?
    common_errors:
      - Treating sync.Pool as a cache with guaranteed retention.

  - external_key: technical.backend_languages.go_scheduler_blocking
    competency_key: go
    topic: The Go scheduler and blocking work
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How does the Go scheduler map goroutines onto operating system threads, and why does that matter when a
      goroutine makes a blocking system call or runs a tight CPU loop?
    expected_concepts:
      - the G, M and P model
      - GOMAXPROCS and container CPU limits
      - handoff of the P when a thread blocks in a syscall
      - network poller for non-blocking network I/O
      - asynchronous preemption of long-running loops
      - thread growth from many blocking syscalls or cgo calls
    rubric:
      excellent: Explains the G, M and P model, syscall handoff, the network poller, preemption, and practical implications such as GOMAXPROCS in containers and thread explosion from blocking calls.
      good: Knows goroutines are multiplexed over threads and that GOMAXPROCS limits parallelism.
      weak: Thinks each goroutine is an operating system thread or cannot explain how blocking is handled.
    followups:
      - Why might a Go service in a container with a CPU limit of two show high latency if GOMAXPROCS is sixty-four?
      - What can cause the number of operating system threads to keep growing?
    common_errors:
      - Assuming GOMAXPROCS respects container CPU limits on every Go version.

  - external_key: technical.backend_languages.go_cgo_tradeoffs
    competency_key: go
    topic: Costs of cgo
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      What does using cgo cost a Go service, and how would you decide between wrapping an existing C library and
      reimplementing the functionality in Go?
    expected_concepts:
      - call overhead crossing the boundary
      - loss of easy cross-compilation and static binaries
      - C memory not managed or seen by the Go runtime
      - cgo calls occupying threads
      - security and crash risk from native code
      - maturity and correctness of the C library versus rewrite cost
    rubric:
      excellent: Covers performance, build, memory, threading and safety costs, and makes a reasoned decision framework weighing library maturity, call frequency and maintenance, ideally from experience.
      good: Names build complexity and call overhead and considers a pure Go alternative.
      weak: Sees no trade-offs or cannot describe what cgo changes.
    followups:
      - How would you batch work to reduce boundary crossings?
      - How would you debug a crash inside the C code?
    common_errors:
      - Calling into C in a tight loop where the crossing cost dominates.

  # ------------------------------------------------------------- testing
  - external_key: technical.backend_languages.go_table_driven_tests
    competency_key: testing
    topic: Table-driven tests in Go
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you structure tests in Go? Tell me when table-driven tests work well and when separate test
      functions are clearer.
    expected_concepts:
      - a slice of named cases with inputs and expected outputs
      - subtests with t.Run for clear failure output
      - parallel subtests and their pitfalls
      - separate functions when setup or assertions differ a lot
      - helpers marked with t.Helper
    rubric:
      excellent: Explains the pattern and its benefits, uses named subtests and helpers, notes parallel-test pitfalls, and knows when the table becomes harder to read than separate tests.
      good: Uses table-driven tests with subtests correctly.
      weak: Writes one long test with many assertions or cannot describe the pattern.
    followups:
      - What goes wrong when tables grow flags that change the test's behaviour?
      - How do you make a failing case easy to identify?
    common_errors:
      - Cramming different behaviours into one table with conditional logic inside the loop.

  - external_key: technical.backend_languages.go_fuzz_and_benchmarks
    competency_key: testing
    topic: Fuzzing and benchmarks in Go
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you use Go's built-in benchmarks and fuzzing? Tell me about a time either one caught something that
      ordinary tests missed.
    expected_concepts:
      - benchmarks with b.N and allocation reporting
      - comparing results statistically with benchstat
      - fuzz targets with seed corpora
      - failing inputs saved as regression cases
      - good fuzzing targets such as parsers and decoders
    rubric:
      excellent: Uses both tools correctly, compares benchmarks with statistical care, describes a real bug or regression found, and keeps fuzz findings as permanent regression tests.
      good: Has written benchmarks or fuzz tests and understands their purpose.
      weak: Measures performance with a single manual timing or has never used either tool.
    followups:
      - Why can a single benchmark run be misleading?
      - Where would you run fuzzing given it can take a long time?
    common_errors:
      - Letting the compiler optimise away the benchmarked work.
