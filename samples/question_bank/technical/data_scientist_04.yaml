# Curated questions: data scientist, part 4 — bias, interpretability, communicating results and
# applied modelling (forecasting, segmentation, anomalies, text, policy evaluation).
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_scientist]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.data_scientist.explain_model_to_business
    competency_key: communication
    topic: Explaining how a model works to the business
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Think of a model you built that business people relied on. How did you explain to them what it does,
      what drives its predictions and when they shouldn't trust it?
    expected_concepts:
      - plain-language description of inputs, output and purpose
      - main drivers illustrated with examples
      - performance expressed in business terms
      - known limitations and cases where the model is unreliable
      - checking understanding and adapting to the audience
    rubric:
      excellent: Gives a concrete example with a clear, jargon-free explanation, translates performance into business impact, and states limitations explicitly so users know when to override the model.
      good: Explains the model in accessible terms with a real example and some limitations.
      weak: Relies on technical metrics or jargon, or cannot describe how users should interpret the output.
    followups:
      - What question from the business surprised you, and how did you answer it?
      - How did you explain the model's error rate?
    common_errors:
      - Leading with algorithm details instead of what the output means for decisions.

  - external_key: technical.data_scientist.feature_importance_methods
    competency_key: machine_learning
    topic: Different kinds of feature importance
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tree models give you a feature importance chart out of the box. What does that chart actually measure,
      and what other ways of measuring importance do you use?
    expected_concepts:
      - impurity-based importance is computed on training data
      - bias toward high-cardinality and continuous features
      - permutation importance on held-out data
      - correlated features share or split importance
      - importance is not the direction or causal effect
    rubric:
      excellent: Explains how built-in importance is computed and its biases, uses permutation importance or SHAP on held-out data, and warns about correlation and causal misreadings.
      good: Knows built-in importance has limits and names an alternative.
      weak: Treats the default chart as the definitive ranking of what matters.
    followups:
      - Two correlated features both look unimportant under permutation. Why might that happen?
      - How would you show the direction of a feature's effect?
    common_errors:
      - Reading high importance as evidence that changing the feature changes the outcome.

  - external_key: technical.data_scientist.survivorship_bias
    competency_key: data_analysis
    topic: Survivorship bias in analysis
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Sales leadership asks you to study the company's most successful customer accounts to work out what makes
      an account succeed. What's the risk in that approach, and how would you design the analysis instead?
    expected_concepts:
      - survivorship bias from looking only at successes
      - include failed and churned accounts for comparison
      - define success and the starting cohort in advance
      - control for account size and time since onboarding
      - treat findings as hypotheses for testing
    rubric:
      excellent: Names survivorship bias, redesigns the study around a full cohort including failures, controls for obvious confounders, and frames results as hypotheses to test.
      good: Recognises the need to compare with unsuccessful accounts.
      weak: Profiles successful accounts only and presents common traits as causes.
    followups:
      - How would you define the starting cohort?
      - What would you do with the findings once you have them?
    common_errors:
      - Treating traits common among winners as drivers without checking how common they are among losers.

  - external_key: technical.data_scientist.customer_segmentation
    competency_key: machine_learning
    topic: Building customer segments with clustering
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Marketing asks you to create customer segments they can target differently. How would you approach the
      clustering, and how would you know whether the segments are any good?
    expected_concepts:
      - agree on the business use of the segments first
      - feature choice and scaling drive the result
      - choosing the number of clusters with metrics and judgement
      - stability of clusters across samples or time
      - segments must be distinct, actionable and explainable
    rubric:
      excellent: Starts from how segments will be used, makes deliberate feature and scaling choices, evaluates both statistical quality and business usefulness, and checks stability.
      good: Describes a sensible clustering workflow and some way of choosing and validating clusters.
      weak: Runs k-means with an arbitrary k and hands over the labels.
    followups:
      - How would you describe each segment to marketing?
      - What would you do if the segments change every time you rerun the clustering?
    common_errors:
      - Judging segments only by a silhouette score without asking whether they are actionable.

  - external_key: technical.data_scientist.forecast_uncertainty_presentation
    competency_key: communication
    topic: Presenting forecast uncertainty
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Leadership wants one number for next quarter's sales forecast. How do you present the forecast so they
      understand the uncertainty without being overwhelmed?
    expected_concepts:
      - point forecast together with a prediction interval
      - scenarios such as low, expected and high
      - explaining the main assumptions and drivers
      - linking uncertainty to the decisions it affects
      - reporting past forecast accuracy
    rubric:
      excellent: Combines a headline number with a range or scenarios, explains assumptions, ties uncertainty to concrete decisions such as inventory or hiring, and builds trust by showing past accuracy.
      good: Presents a point forecast with an interval and a short explanation.
      weak: Gives a single number with no indication of uncertainty or overwhelms the audience with technical detail.
    followups:
      - They push back and say a range is not useful. How do you respond?
      - How do you show how accurate past forecasts were?
    common_errors:
      - Presenting a confidence interval for the mean when the audience needs a prediction interval for the outcome.

  - external_key: technical.data_scientist.unwelcome_findings
    competency_key: communication
    topic: Communicating results stakeholders didn't want
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Tell me about a time your analysis showed that a project or feature leadership was invested in wasn't
      working. How did you present the result, and what happened?
    expected_concepts:
      - double-checking the analysis before sharing
      - presenting evidence clearly with uncertainty
      - previewing findings with key stakeholders before the big meeting
      - offering options and next steps
      - outcome and what was learned
    rubric:
      excellent: Describes a real case with careful verification, clear evidence, early stakeholder preview, constructive recommendations, and the actual outcome.
      good: Gives a real example with a clear presentation and a sensible next step.
      weak: Gives a hypothetical answer or describes softening the result until it no longer reflected the data.
    followups:
      - What pushback did you get, and how did you handle it?
      - What would you do differently next time?
    common_errors:
      - Describing what they would do instead of a real past situation.

  - external_key: technical.data_scientist.model_performance_visuals
    competency_key: communication
    topic: Showing model performance to non-technical audiences
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you had to show a classification model's performance to people who don't know what precision or AUC
      means, what would you put on the slide and why?
    expected_concepts:
      - outcomes in business units such as cases caught and false alarms
      - a confusion matrix expressed in counts per thousand or per week
      - gains or lift chart showing value of targeting top scores
      - comparison with the current process or baseline
      - trade-off at different thresholds
    rubric:
      excellent: Chooses visuals that translate errors into business outcomes, compares against the current process, and shows the threshold trade-off in a way the audience can act on.
      good: Uses a counts-based confusion matrix or lift chart and explains it plainly.
      weak: Shows ROC curves and metric tables without translation.
    followups:
      - How would you show the trade-off of reviewing more or fewer cases?
      - Which chart would you avoid with this audience?
    common_errors:
      - Reporting accuracy on an imbalanced problem, which looks impressive but misleads.

  # ---------------------------------------------------------------- medium
  - external_key: technical.data_scientist.shap_in_practice
    competency_key: machine_learning
    topic: Using SHAP values responsibly
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Explain how SHAP values work at the level you'd explain them to another data scientist, and tell me where
      you've seen them misinterpreted.
    expected_concepts:
      - additive attribution of a prediction relative to a baseline
      - grounded in Shapley values from game theory
      - choice of background dataset affects results
      - correlated features distort attributions
      - explanations describe the model, not the real world
    rubric:
      excellent: Gives a clear account of the additive attribution and baseline, explains the effect of background data and correlation, and describes concrete misinterpretations such as causal readings.
      good: Explains SHAP as per-feature contributions summing to the prediction and names a pitfall.
      weak: Describes SHAP only as a feature importance plot without understanding the mechanism.
    followups:
      - How does the choice of background data change the explanation?
      - When would you prefer a simpler explanation method?
    common_errors:
      - Interpreting a SHAP value as the effect of intervening on that feature.

  - external_key: technical.data_scientist.partial_dependence_pitfalls
    competency_key: machine_learning
    topic: Partial dependence and individual conditional expectation
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you use partial dependence or individual conditional expectation plots to understand a model, and
      when can they be misleading?
    expected_concepts:
      - average effect of varying one feature while holding others fixed
      - ICE curves reveal heterogeneity hidden by the average
      - unrealistic combinations when features are correlated
      - accumulated local effects as an alternative
      - sparse regions of the feature space
    rubric:
      excellent: Explains how both plots are computed, uses ICE to reveal interactions, and explains extrapolation into unrealistic data with an alternative such as ALE.
      good: Describes partial dependence and names one limitation.
      weak: Reads partial dependence plots as causal effects without caveats.
    followups:
      - How would you show the data density alongside the plot?
      - What does it mean when ICE curves cross each other?
    common_errors:
      - Ignoring that the plot averages over impossible feature combinations.

  - external_key: technical.data_scientist.adverse_decision_reasons
    competency_key: machine_learning
    topic: Explaining individual automated decisions
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A credit model declined an applicant and they've asked for the main reasons. How would you generate
      reasons that are accurate, understandable and useful to that person?
    expected_concepts:
      - local explanation methods such as SHAP or reason codes
      - mapping features to plain-language reasons
      - actionable reasons rather than immutable ones
      - consistency and stability of explanations
      - regulatory and documentation requirements
    rubric:
      excellent: Uses a local attribution method mapped to clear reason statements, considers actionability and stability, and addresses review and documentation requirements.
      good: Proposes a local explanation method and translation into plain language.
      weak: Shows global feature importance as the reason for an individual decision.
    followups:
      - What would you do if two very similar applicants got different reasons?
      - How would you tell the applicant what might change the decision?
    common_errors:
      - Giving global feature importance instead of reasons specific to the individual case.

  - external_key: technical.data_scientist.group_fairness_audit
    competency_key: machine_learning
    topic: Auditing a model for unequal outcomes across groups
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're asked to check whether a lending model treats protected groups unfairly, even though protected
      attributes aren't used as inputs. How would you carry out that audit?
    expected_concepts:
      - excluding an attribute does not prevent proxies such as postcode
      - group metrics such as approval rates, error rates and calibration per group
      - obtaining group information lawfully for auditing
      - sample size and uncertainty for small groups
      - reporting findings and options for mitigation
    rubric:
      excellent: Explains proxy effects, measures several group metrics with uncertainty, handles data access lawfully, and lays out mitigation options with their trade-offs.
      good: Recognises proxies and compares outcome or error rates across groups.
      weak: Concludes the model is fair because protected attributes are not inputs.
    followups:
      - How would you find which features act as proxies?
      - Which fairness metric would you prioritise for lending, and why?
    common_errors:
      - Assuming that removing a protected attribute removes its influence.

  - external_key: technical.data_scientist.selective_labels
    competency_key: machine_learning
    topic: Labels shaped by past decisions
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're training a model to predict which insurance claims are fraudulent, but historically only claims
      that investigators chose to look at ever got a fraud label. What problems does that create, and how
      would you deal with them?
    expected_concepts:
      - selective labels where outcomes are only observed for investigated cases
      - uninvestigated claims are not confirmed legitimate
      - the model can learn past investigators' selection patterns
      - random audit samples to estimate true rates
      - reweighting or treating unlabelled data carefully
    rubric:
      excellent: Explains how the labelling process biases both training and evaluation, proposes random audits to get unbiased labels, and adjusts the training and evaluation design accordingly.
      good: Recognises the bias from selective labelling and suggests collecting unbiased labels.
      weak: Treats uninvestigated claims as legitimate without question.
    followups:
      - How large would the random audit sample need to be?
      - How would you evaluate the new model fairly against the old process?
    common_errors:
      - Evaluating the model only on previously investigated claims.

  - external_key: technical.data_scientist.demand_forecasting_approach
    competency_key: machine_learning
    topic: Approaches to demand forecasting
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You need weekly demand forecasts for a few thousand products. How would you approach it, from baselines to
      the model you'd eventually put in production?
    expected_concepts:
      - seasonal naive and moving-average baselines
      - classical models such as exponential smoothing or ARIMA per series
      - global models such as gradient boosting with lag and calendar features
      - handling new products, intermittent demand and promotions
      - backtesting and hierarchical consistency
    rubric:
      excellent: Starts from strong baselines, compares local and global approaches, handles cold starts and intermittent demand, and evaluates with backtests tied to inventory decisions.
      good: Proposes a baseline and a reasonable model with time-aware evaluation.
      weak: Jumps to a complex model without baselines or proper backtesting.
    followups:
      - How would you forecast a product launched last week?
      - How would you make product forecasts add up to category totals?
    common_errors:
      - Not beating a seasonal naive baseline and not noticing.

  - external_key: technical.data_scientist.anomaly_detection_methods
    competency_key: machine_learning
    topic: Anomaly detection with few labels
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You need to flag unusual transactions, but you have almost no labelled examples of the problems you're
      looking for. What approaches would you consider, and how would you evaluate them?
    expected_concepts:
      - statistical rules and baselines per entity
      - unsupervised methods such as isolation forest or density-based approaches
      - domain features that capture expected behaviour
      - evaluation with analyst feedback, precision at the top of the list
      - feedback loop to build labels over time
    rubric:
      excellent: Combines simple statistical baselines with unsupervised methods, designs useful features, evaluates through analyst review of top-ranked cases, and plans to accumulate labels for a supervised model.
      good: Proposes an unsupervised method and a practical way to evaluate it.
      weak: Applies an algorithm without any plan for evaluation or alert volume.
    followups:
      - How would you keep the alert volume manageable for analysts?
      - When would you switch to a supervised model?
    common_errors:
      - Equating statistically unusual with operationally important.

  - external_key: technical.data_scientist.dimensionality_reduction_use
    competency_key: machine_learning
    topic: When to use dimensionality reduction
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When has dimensionality reduction such as PCA actually helped you, and when would you avoid it? How do
      methods like t-SNE or UMAP fit in?
    expected_concepts:
      - PCA captures linear variance, useful for compression and noise reduction
      - loss of interpretability of components
      - variance is not the same as predictive relevance
      - t-SNE and UMAP are mainly for visualisation and distort global distances
      - fitting the reduction on training data only
    rubric:
      excellent: Gives a concrete case where reduction helped, explains when it hurts, and correctly positions t-SNE and UMAP as visualisation tools with their distortions.
      good: Explains PCA's purpose and a limitation, and knows t-SNE is for visualisation.
      weak: Uses t-SNE outputs as model features or reads cluster distances from them literally.
    followups:
      - How would you choose how many components to keep?
      - What might cause clusters in a UMAP plot that aren't really there?
    common_errors:
      - Interpreting distances between clusters in a t-SNE plot as meaningful.

  - external_key: technical.data_scientist.model_value_in_money
    competency_key: communication
    topic: Translating model improvements into business value
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team improved a churn model's AUC from 0.81 to 0.84, and the head of product asks what that's worth.
      How would you answer?
    expected_concepts:
      - AUC gains do not map directly to value
      - simulating the decision process at the operating threshold
      - extra customers correctly targeted and retention rate of the intervention
      - uncertainty in the estimate
      - validating with an experiment
    rubric:
      excellent: Simulates the actual decision at the operating point to estimate extra saved customers and revenue, states assumptions and uncertainty, and proposes an experiment to confirm.
      good: Translates the improvement into business outcomes with a reasonable method.
      weak: Repeats the AUC improvement or gives a number without any reasoning.
    followups:
      - What if the retention team can only contact the top five percent anyway?
      - How would you confirm the value after launch?
    common_errors:
      - Assuming a percentage improvement in AUC equals the same percentage gain in revenue.

  - external_key: technical.data_scientist.interpretable_vs_accurate
    competency_key: machine_learning
    topic: Trading accuracy for interpretability
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Compliance requires that a pricing model be explainable. A gradient boosted model beats your scorecard
      by three points of AUC. How would you approach the decision?
    expected_concepts:
      - what explainability the regulator or business actually requires
      - value of the accuracy gain in business terms
      - interpretable alternatives such as monotonic constraints or generalised additive models
      - post-hoc explanations and their limits
      - documentation and governance
    rubric:
      excellent: Clarifies the explainability requirement, quantifies the accuracy gain's value, explores constrained or additive models that close the gap, and recommends a decision with governance considered.
      good: Weighs both sides and proposes an interpretable alternative or explanation approach.
      weak: Picks the more accurate model and assumes post-hoc explanations will satisfy compliance.
    followups:
      - How do monotonic constraints help here?
      - What would you need to document for an auditor?
    common_errors:
      - Assuming post-hoc explanations are equivalent to an inherently interpretable model.

  - external_key: technical.data_scientist.support_ticket_classifier
    competency_key: machine_learning
    topic: Building a text classifier
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're asked to automatically route support tickets into twenty categories using historical tickets that
      agents tagged by hand. How would you build and evaluate this?
    expected_concepts:
      - checking label quality and agreement between agents
      - simple baseline such as TF-IDF with a linear model
      - embeddings or fine-tuned language models when justified
      - class imbalance and per-class metrics
      - confidence threshold with human fallback
    rubric:
      excellent: Audits label consistency, starts with a strong simple baseline, escalates to embeddings or fine-tuning only when justified, evaluates per class, and designs a fallback for low-certainty tickets.
      good: Builds a reasonable baseline and evaluates per category.
      weak: Goes straight to a large model without checking labels or evaluation design.
    followups:
      - Agents disagree on twenty percent of the tags. What does that mean for your target accuracy?
      - How would you handle a brand-new category?
    common_errors:
      - Reporting overall accuracy while small categories perform poorly.

  # ------------------------------------------------------------------ hard
  - external_key: technical.data_scientist.explanations_are_not_causal
    competency_key: machine_learning
    topic: Model explanations versus causal effects
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      A stakeholder sees that discount level is the top driver in your demand model and wants to raise discounts
      across the board. Why can't the model's explanation answer that question, and how would you answer it
      properly?
    expected_concepts:
      - predictive associations reflect how discounts were assigned historically
      - confounding, for example discounts given in low-demand periods
      - explanations describe the model, not interventions
      - experiments or causal methods such as price tests or double machine learning
      - distinguishing prediction tasks from decision tasks
    rubric:
      excellent: Explains the confounding mechanism concretely, distinguishes predictive from causal questions, and proposes a credible causal approach such as randomised price tests or causal estimation with its assumptions.
      good: Explains that the model shows association and suggests an experiment.
      weak: Endorses the stakeholder's interpretation.
    followups:
      - How would you design a discount experiment that's acceptable to the business?
      - If you can't experiment, what observational approach would you try?
    common_errors:
      - Treating the sign of a SHAP value as the effect of changing the feature.

  - external_key: technical.data_scientist.model_feedback_loops
    competency_key: machine_learning
    topic: Feedback loops from deployed models
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your fraud model blocks suspicious transactions, and you retrain it monthly on the latest labelled data.
      Over time the model looks better and better offline, but losses aren't falling. What could be happening?
    expected_concepts:
      - blocked transactions never receive a true outcome label
      - training data increasingly reflects the model's own decisions
      - fraudsters adapt to the model
      - random exploration or holdout traffic for unbiased labels
      - offline metrics on biased data are misleading
    rubric:
      excellent: Explains how blocking censors labels and creates a self-reinforcing loop, accounts for adversarial adaptation, and proposes exploration or holdouts with counterfactual evaluation.
      good: Identifies the feedback loop and suggests keeping some unbiased traffic.
      weak: Suggests retraining more often or adding features without understanding the loop.
    followups:
      - How much traffic would you let through unblocked for exploration, and how would you justify the cost?
      - How would you evaluate a new model against the current one in this setting?
    common_errors:
      - Evaluating a new model on data filtered by the old model's decisions.

  - external_key: technical.data_scientist.fairness_criteria_conflict
    competency_key: machine_learning
    topic: Conflicting fairness criteria
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Different fairness definitions, such as equal approval rates, equal error rates and equal calibration
      across groups, often can't all be satisfied at once. Why is that, and how would you help a team decide
      which to prioritise?
    expected_concepts:
      - incompatibility when base rates differ between groups
      - definitions encode different notions of harm
      - context-specific costs of false positives and false negatives
      - legal and policy requirements
      - involving domain, legal and affected-stakeholder input and documenting the choice
    rubric:
      excellent: Explains why the criteria conflict when base rates differ, connects each to a type of harm in context, and describes a structured, documented decision process involving the right stakeholders.
      good: Recognises the conflict and links the choice to the application context.
      weak: Claims one metric is always correct or that fairness can be fully solved technically.
    followups:
      - Which criterion would matter most for a medical screening tool, and why?
      - What mitigation methods exist at the data, training and threshold stages?
    common_errors:
      - Choosing a fairness metric because it is easy to compute rather than because it fits the harm.

  - external_key: technical.data_scientist.validating_proxy_metrics
    competency_key: product_sense
    topic: Validating proxy metrics
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team optimises a model for click-through rate because it moves quickly, but the business cares about
      ninety-day retention. How would you check whether clicks are a good enough proxy, and what would you do if
      they aren't?
    expected_concepts:
      - correlation across users is not the same as causal alignment across experiments
      - using historical experiments to compare effects on proxy and long-term outcome
      - surrogate index combining several short-term signals
      - Goodhart effects when the proxy is optimised directly
      - guardrails and periodic long-term holdouts
    rubric:
      excellent: Validates the proxy using past experiments rather than cross-sectional correlation, considers a surrogate index, anticipates gaming of the proxy, and maintains long-term holdouts.
      good: Proposes checking the relationship between clicks and retention and adding guardrails.
      weak: Assumes clicks and retention are aligned because they are correlated.
    followups:
      - How many past experiments would you need for this validation?
      - What does it look like when a proxy starts being gamed?
    common_errors:
      - Validating the proxy with user-level correlation instead of treatment-level effects.

  - external_key: technical.data_scientist.model_documentation
    competency_key: communication
    topic: Documenting a model for decision makers
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Another team will use your model's scores to make decisions you won't be involved in. What would you put
      in the documentation you hand over, and why does each part matter?
    expected_concepts:
      - intended use and explicitly out-of-scope uses
      - training data, time period and label definition
      - performance overall and across important slices with uncertainty
      - known limitations, failure modes and assumptions
      - monitoring, retraining plan and ownership contacts
    rubric:
      excellent: Covers intended use, data, sliced performance, limitations, monitoring and ownership, explaining how each prevents a specific type of misuse.
      good: Covers most of the key sections with a reason for including them.
      weak: Describes only the algorithm and headline accuracy.
    followups:
      - How would you know if the other team starts using the scores in a way you didn't intend?
      - How would you keep the documentation current after retraining?
    common_errors:
      - Omitting what the model should not be used for.

  - external_key: technical.data_scientist.offline_policy_evaluation
    competency_key: statistics_experimentation
    topic: Evaluating a new policy from logged data
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You want to estimate how a new offer-targeting policy would perform, but you only have logs from the
      current policy. How could you evaluate the new policy offline, and what conditions make that possible?
    expected_concepts:
      - counterfactual outcomes are unobserved for actions not taken
      - inverse propensity scoring using logged action probabilities
      - doubly robust estimators combining a model with propensities
      - overlap or support requirements and high variance
      - importance of logging propensities and some randomisation in the old policy
    rubric:
      excellent: Explains the counterfactual problem, describes inverse propensity and doubly robust estimators, explains overlap and variance issues, and stresses logging propensities and exploration.
      good: Describes inverse propensity weighting and the need for logged probabilities.
      weak: Evaluates the new policy only on cases where it agrees with the old one, or cannot see the bias.
    followups:
      - What happens to the estimate when the new policy picks actions the old one almost never took?
      - How would you change logging today so this is easier next year?
    common_errors:
      - Ignoring that the old policy was deterministic, which leaves no overlap for other actions.

  - external_key: technical.data_scientist.slice_underperformance
    competency_key: machine_learning
    topic: Underperformance on a slice of data
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your model's overall metrics are strong, but when you break results down you find it performs much worse
      for customers who joined in the last three months. How would you diagnose the cause and decide what to do?
    expected_concepts:
      - check sample size and uncertainty for the slice
      - missing or sparse history features for new customers
      - different label rates or behaviour patterns
      - options such as slice-specific features, separate models or fallback rules
      - business impact of the slice and ongoing slice monitoring
    rubric:
      excellent: Confirms the gap is real, diagnoses feature sparsity and behavioural differences, compares targeted fixes with their trade-offs, and sets up slice-level monitoring.
      good: Investigates the likely cause and proposes a reasonable fix.
      weak: Accepts the overall metric or immediately builds a separate model without diagnosis.
    followups:
      - How would you decide between a separate model and new features?
      - Which other slices would you check routinely?
    common_errors:
      - Trusting large differences on very small slices without checking uncertainty.
