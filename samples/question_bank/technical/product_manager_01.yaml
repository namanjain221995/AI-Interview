# Curated questions: product management (part 1 of 4).
# Product discovery: validating problems, customer research, synthesis, opportunity sizing,
# assumption testing, segments and reading demand signals.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [product_manager]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.product_manager.validate_problem_worth_solving
    competency_key: product_sense
    topic: Validating that a problem is worth solving
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Think of a time you had to work out whether a problem was really worth solving before anything got
      built. How did you go about validating it, and what evidence convinced you either way?
    expected_concepts:
      - talking directly to affected users about recent, concrete occurrences
      - looking for existing workarounds or spend as a sign of real pain
      - checking frequency and severity, not just whether the problem exists
      - using existing data such as support tickets or usage to size it
      - a clear decision rule for go or no-go
    rubric:
      excellent: Describes a real case with several independent sources of evidence, explains what would have counted as a no, and states the decision and its outcome.
      good: Gives a credible example with user conversations or data, though the decision criteria are only loosely defined.
      weak: Treats a stakeholder request or a hunch as validation, or describes building first and checking later.
    followups:
      - What was the weakest piece of evidence you relied on, looking back?
      - How long did the validation take, and was that the right amount of time?
    common_errors:
      - Asking users whether they would use a feature and treating yes as proof of demand.

  - external_key: technical.product_manager.interview_behaviour_not_opinion
    competency_key: ux_research
    topic: Running customer interviews that reveal behaviour
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you sit down with a customer for a discovery interview, how do you run the conversation so you
      learn what they actually do, rather than collecting opinions about your idea?
    expected_concepts:
      - asking about the last specific time they faced the problem
      - open questions and letting the customer talk
      - avoiding pitching or describing the solution early
      - probing for workarounds, tools used and cost of the problem
      - capturing exact quotes and observations separately from interpretation
    rubric:
      excellent: Describes a concrete interview approach anchored on past behaviour, explains how they avoid leading the customer, and gives an example of an insight that only came from that approach.
      good: Knows to ask open, past-focused questions and avoid pitching, with a reasonable example.
      weak: Describes showing the idea and asking whether people like it or would pay for it.
    followups:
      - How do you handle a customer who keeps jumping to feature requests?
      - Who else from the team do you bring into these interviews, and why?
    common_errors:
      - Asking hypothetical future questions such as "would you use this?" and trusting the answers.

  - external_key: technical.product_manager.choose_research_method
    competency_key: ux_research
    topic: Choosing between interviews, surveys and analytics
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Suppose you have an open question about how users behave in your product. How do you decide whether
      to answer it with interviews, a survey, or by digging into product analytics?
    expected_concepts:
      - analytics shows what happens and how often, interviews explain why
      - surveys for measuring how widespread a known pattern is
      - matching the method to whether the question is exploratory or confirmatory
      - time, cost and sample size of each method
      - combining methods to triangulate
    rubric:
      excellent: Ties each method to the kind of question it answers well, gives an example of combining two methods, and mentions the limits of each.
      good: Distinguishes qualitative from quantitative methods and picks sensibly for an example.
      weak: Defaults to one method for everything or cannot say what each method is good for.
    followups:
      - When has a survey given you a misleading answer?
      - What would you do if the analytics you needed weren't instrumented?
    common_errors:
      - Running a large survey to answer a why question that needs conversation.

  - external_key: technical.product_manager.describe_user_job
    competency_key: product_sense
    topic: Framing users by the job they need done
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you describe who a product is for, how do you go beyond a broad audience label to capture what
      those users are actually trying to get done? Walk me through an example from your work.
    expected_concepts:
      - describing the goal or job and the situation that triggers it
      - what users do today to get the job done and its shortcomings
      - how success looks from the user's point of view
      - segmenting by need or behaviour rather than broad labels
      - using the framing to guide scope decisions
    rubric:
      excellent: Gives a concrete job statement from their own product, explains how it changed a design or scope decision, and contrasts it with the earlier label-based view.
      good: Explains needs-based framing clearly with a reasonable example.
      weak: Describes users only by job title or market segment with no sense of the underlying goal.
    followups:
      - How did that framing change what the team decided to build?
      - How would you notice if the job itself was changing over time?
    common_errors:
      - Describing the job as a feature, such as 'users need a dashboard'.

  - external_key: technical.product_manager.export_button_request
    competency_key: requirements_analysis
    topic: Uncovering the need behind a feature request
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An account manager for one of your biggest customers asks you to add an export-to-spreadsheet button
      by next month. How would you work out what the customer actually needs before agreeing to anything?
    expected_concepts:
      - talking to the people who would use the export
      - asking what they do with the data after exporting it
      - discovering the underlying workflow, such as reporting or reconciliation
      - checking whether other customers have the same need
      - considering alternative solutions to the real need
    rubric:
      excellent: Plans to talk to the end users, explores what happens downstream of the export, considers alternatives like built-in reports or an integration, and checks how widespread the need is before committing.
      good: Asks why the customer wants the export and checks with a few other customers.
      weak: Accepts the request as specified or rejects it without understanding the need.
    followups:
      - What if the customer's renewal depends on getting it by that date?
      - What would you tell the account manager in the meantime?
    common_errors:
      - Treating the requested solution as the requirement.

  - external_key: technical.product_manager.weigh_lost_deal_feedback
    competency_key: product_sense
    topic: Weighing sales feedback about lost deals
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      The sales team keeps telling you that deals are being lost because of one missing feature. How would
      you decide how much weight to give that feedback?
    expected_concepts:
      - quantifying how many deals and how much revenue were affected
      - checking lost-deal notes or talking to the prospects directly
      - distinguishing the stated reason from the deciding reason
      - whether the deals were in the target segment
      - comparing with retention and existing-customer needs
    rubric:
      excellent: Proposes concrete ways to verify the claim, separates stated from real loss reasons, checks fit with the target customer, and weighs it against other opportunities.
      good: Wants data on the affected deals and some direct validation before deciding.
      weak: Either builds the feature because sales asked or dismisses sales feedback outright.
    followups:
      - How would you close the loop with sales whichever way you decide?
      - What if the deals were large but outside your target customer profile?
    common_errors:
      - Counting how loudly a request is repeated instead of how much revenue or retention it affects.

  - external_key: technical.product_manager.which_pain_points_matter
    competency_key: product_sense
    topic: Deciding which pain points are significant
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A round of customer conversations usually leaves you with a long list of pain points. How do you
      decide which ones are significant enough to act on, given you only spoke to a handful of people?
    expected_concepts:
      - how often a pain point came up and how severe it was for those affected
      - whether people already spend time or money working around it
      - checking prevalence with usage data, tickets or a quick survey
      - fit with the product strategy and target users
      - treating small-sample findings as hypotheses rather than facts
    rubric:
      excellent: Combines frequency, severity and workaround evidence, sizes the top candidates with a second source, and explains how that ranking fed a real decision.
      good: Ranks pain points by how often and how strongly they came up, with some cross-checking.
      weak: Acts on whichever complaint was most vivid or came from the most important customer.
    followups:
      - Tell me about a pain point that sounded big in interviews but turned out to be rare.
      - How do you treat a severe problem that only a few users have?
    common_errors:
      - Treating the number of interviewees who mentioned something as a statistically reliable rate.

  - external_key: technical.product_manager.mine_support_backlog
    competency_key: ux_research
    topic: Learning from a support ticket backlog
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've just joined a product team and there's a backlog of about two thousand support tickets that
      nobody has looked at in months. How would you use them to learn about your users' problems?
    expected_concepts:
      - sampling or tagging tickets rather than reading every one
      - categorising by problem, feature area and severity
      - quantifying frequency and trend over time
      - working with support staff who know the context
      - turning top themes into hypotheses to validate
    rubric:
      excellent: Proposes a practical sampling and tagging approach, partners with support, quantifies themes and explains how the output feeds prioritisation and further research.
      good: Plans to categorise tickets and find the most common problems.
      weak: Plans to read tickets ad hoc or fix whatever issues stand out first.
    followups:
      - What can't support tickets tell you about your users?
      - How would you keep this insight flowing after the first pass?
    common_errors:
      - Assuming ticket volume equals user impact, ignoring problems users never bother to report.

  # ---------------------------------------------------------------- medium
  - external_key: technical.product_manager.size_opportunity_without_data
    competency_key: product_sense
    topic: Sizing an opportunity with little data
    difficulty: medium
    kind: technical
    text: >-
      How do you estimate the size of an opportunity when you have no direct data on it yet? Talk me
      through one you've actually done.
    expected_concepts:
      - building a bottom-up estimate from units such as users, frequency and value
      - using proxies from adjacent data, market sources or existing behaviour
      - stating assumptions explicitly and testing sensitivity to them
      - giving a range rather than a single number
      - identifying cheap ways to firm up the riskiest assumption
    rubric:
      excellent: Walks through a real bottom-up estimate with explicit assumptions, a range, a sensitivity check, and explains how the estimate influenced the decision.
      good: Builds a reasonable estimate with stated assumptions for a real case.
      weak: Quotes a top-down market figure without connecting it to what the product could realistically capture.
    followups:
      - Which assumption moved the answer the most?
      - How did the real result compare with your estimate?
    common_errors:
      - Using total market size as if the product could capture all of it.

  - external_key: technical.product_manager.shared_problem_statement
    competency_key: communication
    topic: Aligning the team on a problem statement
    difficulty: medium
    kind: scenario
    text: >-
      Engineering, design and sales each describe the problem behind your next project differently. How
      would you get everyone to a shared problem statement before work starts?
    expected_concepts:
      - collecting each group's framing and the evidence behind it
      - a written problem statement with users, pain and impact
      - explicit success measures that everyone signs up to
      - a working session to resolve disagreements
      - what is out of scope
    rubric:
      excellent: Describes gathering the views, grounding the discussion in evidence, writing a concise problem statement with success measures and non-goals, and getting explicit agreement.
      good: Plans a meeting or document to align on the problem and success criteria.
      weak: Picks one group's framing, or starts work and expects alignment to emerge.
    followups:
      - What would you do if one group still disagreed after the session?
      - How do you check months later that the team still shares that understanding?
    common_errors:
      - Writing a problem statement that is really a description of the planned solution.

  - external_key: technical.product_manager.riskiest_assumptions
    competency_key: product_sense
    topic: Testing the riskiest assumptions first
    difficulty: medium
    kind: technical
    text: >-
      Before committing a team to a new feature, how do you identify the riskiest assumptions behind it and
      test them as cheaply as you can?
    expected_concepts:
      - listing assumptions across value, usability, feasibility and viability
      - ranking by uncertainty and impact if wrong
      - choosing the cheapest test that could disprove each one
      - defining in advance what result would change the plan
      - involving engineering and design in feasibility and usability risks
    rubric:
      excellent: Uses a structured approach to surface and rank assumptions, gives a real example of a cheap test with a pre-agreed threshold, and explains what changed as a result.
      good: Identifies key assumptions and describes reasonable tests for them.
      weak: Cannot name assumptions beyond "users will like it", or tests only after building.
    followups:
      - What's the cheapest test you've ever run that saved a lot of work?
      - Which kind of risk do product managers most often overlook?
    common_errors:
      - Testing the easiest assumptions to check rather than the ones most likely to sink the idea.

  - external_key: technical.product_manager.prototype_before_build
    competency_key: ux_research
    topic: Testing solutions with prototypes
    difficulty: medium
    kind: technical
    text: >-
      Walk me through a time you used a prototype to test a solution with users before engineering built
      it. What did you learn that changed the plan?
    expected_concepts:
      - choosing prototype fidelity to match the question
      - realistic tasks for participants rather than guided tours
      - observing where users struggle or misunderstand
      - iterating between sessions
      - concrete changes to scope or design as a result
    rubric:
      excellent: Gives a specific example with the question being tested, the fidelity chosen and why, what users did, and a clear change to the plan that followed.
      good: Describes a real prototype test and a sensible outcome.
      weak: Describes a demo to stakeholders or users rather than a test, with no change resulting.
    followups:
      - What can a prototype test not tell you?
      - How many sessions did you run, and how did you know it was enough?
    common_errors:
      - Explaining the prototype to participants so thoroughly that the test no longer shows real usability problems.

  - external_key: technical.product_manager.make_room_for_discovery
    competency_key: project_management
    topic: Balancing discovery and delivery
    difficulty: medium
    kind: scenario
    text: >-
      Your team is fully booked on delivery work, yet you know the bets planned for next quarter haven't
      been validated at all. How would you make room for discovery without stalling delivery?
    expected_concepts:
      - running discovery in parallel with a small slice of team time
      - involving a designer and an engineer lead in discovery
      - time-boxed, cheap validation activities
      - making the risk of unvalidated bets visible to leadership
      - adjusting the next quarter plan based on findings
    rubric:
      excellent: Proposes a concrete, time-boxed discovery track with the right people, explains how to protect delivery commitments, and how to escalate the risk of unvalidated bets.
      good: Suggests dedicating some time to discovery and gives examples of lightweight methods.
      weak: Either drops discovery entirely or pauses delivery without considering commitments.
    followups:
      - How would you explain the trade-off to a manager who only tracks delivery dates?
      - What would you cut first to make the time?
    common_errors:
      - Treating discovery as a separate phase that must finish before any delivery can start.

  - external_key: technical.product_manager.opposing_segment_needs
    competency_key: product_sense
    topic: Serving segments with conflicting needs
    difficulty: medium
    kind: scenario
    text: >-
      Your two biggest user groups want opposite things from the same workflow. Power users want more
      controls, while new users already find it too complicated. How would you approach the decision?
    expected_concepts:
      - understanding the value and size of each group
      - which group matters most to the product strategy
      - design patterns such as progressive disclosure or sensible defaults
      - testing the options with both groups
      - measures to watch for each group after the change
    rubric:
      excellent: Grounds the decision in strategy and data about both groups, explores design options that avoid a zero-sum choice, and defines how each group's outcomes will be monitored.
      good: Weighs the two groups and suggests a reasonable design compromise.
      weak: Picks one group arbitrarily or tries to add every requested control.
    followups:
      - What if the strategy says growth comes from new users but revenue comes from power users?
      - How would you know if the compromise hurt either group?
    common_errors:
      - Hiding the complexity behind a settings page that neither group discovers.

  - external_key: technical.product_manager.study_why_customers_cancel
    competency_key: ux_research
    topic: Researching why customers cancel
    difficulty: medium
    kind: technical
    text: >-
      How would you design research to understand why customers cancel, knowing that people who have
      already left are hard to reach and often don't give the full story?
    expected_concepts:
      - combining cancellation data, usage history and exit surveys
      - interviewing recently churned and at-risk customers
      - looking at behaviour leading up to cancellation
      - separating stated reasons from patterns in usage
      - talking to customer success or support about context
    rubric:
      excellent: Designs a mixed-method study that triangulates exit reasons with behaviour data, includes at-risk customers, and explains how to handle biased or vague stated reasons.
      good: Combines exit surveys with some interviews and data analysis.
      weak: Relies on a single exit survey reason code.
    followups:
      - How would you make it worthwhile for a churned customer to talk to you?
      - What would you do with findings that point to pricing rather than product?
    common_errors:
      - Taking the most common exit-survey answer, often price, as the root cause without further digging.

  - external_key: technical.product_manager.skeptical_of_survey_love
    competency_key: statistics_experimentation
    topic: Spotting bias in survey results
    difficulty: medium
    kind: technical
    text: >-
      You're reading results from an in-app survey where most respondents say they love a particular
      feature. What would make you cautious about trusting that, and how would you check it?
    expected_concepts:
      - self-selection of who sees and answers the survey
      - leading question wording or response options
      - low response rate and non-response bias
      - comparing stated preference with actual usage
      - small samples and margin of error
    rubric:
      excellent: Identifies several specific bias sources, explains how each would distort the result, and proposes checks such as comparing respondents to the user base and to usage data.
      good: Names selection bias or leading questions and suggests comparing with behaviour.
      weak: Takes the result at face value or dismisses surveys entirely.
    followups:
      - How would you redesign the survey to get a more useful signal?
      - When is a survey the right tool despite these issues?
    common_errors:
      - Ignoring that only engaged users of the feature were shown the survey.

  - external_key: technical.product_manager.match_competitor_launch
    competency_key: product_sense
    topic: Responding to a competitor launch
    difficulty: medium
    kind: scenario
    text: >-
      A competitor launches a feature that gets a lot of attention, and your leadership asks how quickly you
      can match it. How would you respond?
    expected_concepts:
      - understanding what problem the feature solves and for whom
      - checking whether your customers have that problem and the evidence of impact
      - assessing differentiation versus parity
      - estimating cost and what it would displace
      - giving leadership a clear, evidence-based recommendation and timeline
    rubric:
      excellent: Investigates the customer need and actual impact on wins and churn, frames parity versus differentiation, and responds to leadership with a clear recommendation and its trade-offs.
      good: Wants to understand customer impact before committing and explains the trade-off.
      weak: Starts copying immediately or dismisses the concern without investigating.
    followups:
      - What evidence would make you recommend matching it quickly?
      - How would you build something better than a copy?
    common_errors:
      - Assuming press attention for a competitor feature means customers are switching because of it.

  - external_key: technical.product_manager.fake_door_tests
    competency_key: product_sense
    topic: Measuring demand before building
    difficulty: medium
    kind: technical
    text: >-
      Fake door or smoke tests are one way to measure demand before building anything. Tell me about a time
      you used one, or something similar, and what risks you had to manage.
    expected_concepts:
      - defining the action that signals demand and a success threshold
      - limiting exposure and handling the user who clicks with a clear message
      - risk of eroding trust or frustrating users
      - interest is not the same as sustained usage
      - legal, brand or support implications
    rubric:
      excellent: Describes a real test with a pre-set threshold and a respectful user experience for the people who clicked, and discusses the limits of what interest data proves.
      good: Explains how the test works and at least one risk with a plausible example.
      weak: Treats click counts as proof of value or ignores the impact on users.
    followups:
      - What threshold did you set, and how did you choose it?
      - When would you not run a test like this?
    common_errors:
      - Leaving the fake entry point live for weeks and annoying the users who click it.

  - external_key: technical.product_manager.promised_feature_weak_evidence
    competency_key: stakeholder_management
    topic: Research contradicts a public commitment
    difficulty: medium
    kind: scenario
    text: >-
      Your research shows that a feature your VP has already promised to customers solves a problem very few
      of them actually have. How would you handle it?
    expected_concepts:
      - sharing the evidence privately and early with the VP
      - quantifying the cost of building versus the value
      - options such as a smaller version, reframing or a different solution
      - managing the customer commitment and relationship
      - documenting the decision
    rubric:
      excellent: Brings the evidence to the VP early and privately, offers several options including a scaled-down commitment, and considers how to manage the customer expectation either way.
      good: Raises the concern with evidence and suggests an alternative.
      weak: Builds it silently despite the evidence or challenges the VP publicly.
    followups:
      - What would you do if the VP insisted on building it as promised?
      - How would you prevent this situation next time?
    common_errors:
      - Waiting until the feature is half built before raising the concern.

  # ------------------------------------------------------------------ hard
  - external_key: technical.product_manager.new_customer_type_discovery
    competency_key: product_sense
    topic: Discovery for a new customer type
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your company sells to small businesses, and leadership asks you to assess whether to build a product
      for large enterprises. How would you structure the discovery work, and what would make you recommend
      against it?
    expected_concepts:
      - understanding enterprise buying process, stakeholders and requirements
      - requirements such as single sign-on, permissions, audit and compliance
      - impact on sales motion, support and pricing
      - interviews with target accounts and lost enterprise deals
      - opportunity cost to the existing customer base
      - explicit go or no-go criteria
    rubric:
      excellent: Lays out a staged discovery plan covering buyers, users and non-product requirements, quantifies the opportunity and cost, and gives concrete conditions that would lead to a no.
      good: Identifies key enterprise needs and proposes a reasonable research plan.
      weak: Treats enterprises as bigger small businesses or recommends going ahead without discovery.
    followups:
      - Which existing customers would you talk to as part of this?
      - How would you test willingness to pay before building?
    common_errors:
      - Focusing only on product features and ignoring the sales, support and compliance changes enterprise customers require.

  - external_key: technical.product_manager.qual_quant_disagree
    competency_key: ux_research
    topic: Reconciling qualitative and quantitative evidence
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Tell me about a time your qualitative research and your quantitative data pointed in different
      directions. How did you work out which to trust, and what did you decide?
    expected_concepts:
      - checking whether both measured the same population and behaviour
      - sample and selection differences between the sources
      - instrumentation or definition problems in the data
      - forming hypotheses that could explain both results
      - running a targeted follow-up to resolve the conflict
    rubric:
      excellent: Describes a real conflict, investigates the reasons systematically, forms an explanation consistent with both, and shows how the follow-up changed the decision.
      good: Gives a real example and a sensible way they resolved it.
      weak: Picks the source that supports their preference without investigating why they differed.
    followups:
      - What did you learn about the limits of each source?
      - How did you explain the conflict to stakeholders?
    common_errors:
      - Assuming the larger data set must be right without checking what it actually measured.

  - external_key: technical.product_manager.kill_a_liked_idea
    competency_key: product_sense
    topic: Deciding when to commit or kill an idea
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you decide when to stop exploring an idea and either commit to it or kill it? Give me an
      example where you killed something that people liked.
    expected_concepts:
      - setting decision criteria and a time box up front
      - evidence on value, feasibility and strategic fit
      - avoiding sunk cost reasoning
      - communicating the decision and reasoning to supporters
      - preserving learnings for later
    rubric:
      excellent: Gives a real kill decision with the criteria used, how they dealt with stakeholders who liked the idea, and what the team learned or reused.
      good: Explains reasonable criteria and a real example.
      weak: Cannot recall killing anything or relies purely on gut feel.
    followups:
      - What would have needed to be true for you to commit instead?
      - How did the people who championed the idea react, and how did you handle it?
    common_errors:
      - Continuing an idea because of the time already spent on it rather than the evidence ahead.

  - external_key: technical.product_manager.general_vs_specific_requests
    competency_key: product_sense
    topic: Platform capability versus one-off solutions
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Four internal teams come to you asking for similar but slightly different notification features. How
      would you decide whether to build one general capability or solve each team's case individually?
    expected_concepts:
      - identifying the common core and true differences across requests
      - cost and delay of building a general solution versus speed of one-offs
      - likelihood of further similar requests
      - ownership and maintenance after launch
      - starting with one case and extracting the general capability later
    rubric:
      excellent: Analyses the shared and differing needs, weighs time to value against long-term cost, and proposes a staged path such as building for the first team while designing for reuse.
      good: Weighs general versus specific with sensible reasoning.
      weak: Defaults to a big platform build or to custom work without analysing the requests.
    followups:
      - How would you handle the team whose deadline can't wait for a general solution?
      - Who should own the capability once it exists?
    common_errors:
      - Designing a general platform before seeing enough real cases to know what is common.

  - external_key: technical.product_manager.buyer_versus_user
    competency_key: product_sense
    topic: When buyers and users are different people
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      In many business products the person who buys is not the person who uses the product every day. How
      has that shaped the way you do discovery and prioritisation?
    expected_concepts:
      - researching both buyers and end users separately
      - buyer needs such as reporting, control and cost versus user needs such as speed and ease
      - balancing features that win deals with features that drive adoption
      - adoption affects renewal even if the buyer signs
      - measuring success for both groups
    rubric:
      excellent: Gives concrete examples of conflicting buyer and user needs, explains how they balanced them in prioritisation, and ties user adoption to renewal outcomes.
      good: Recognises the split and describes researching both groups.
      weak: Treats buyer and user as the same person, or optimises for one without considering the other.
    followups:
      - Tell me about a feature that helped win deals but users ignored.
      - How do you get access to end users when the buyer controls the relationship?
    common_errors:
      - Building only for the buyer's demo and then seeing low adoption at renewal time.

  - external_key: technical.product_manager.unexpected_power_usage
    competency_key: statistics_experimentation
    topic: Investigating unexpected usage patterns
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Usage data shows a small group of customers using a feature in a way you never designed for, and they
      happen to be your best-retained customers. How would you work out whether this is a real
      opportunity?
    expected_concepts:
      - avoiding assuming the usage causes the retention
      - comparing with similar customers who don't use it that way
      - interviewing those customers to understand the job
      - estimating how many other customers share that need
      - a small test to see if promoting the behaviour helps others
    rubric:
      excellent: Separates correlation from causation explicitly, combines comparison analysis with interviews, sizes the broader need and proposes a controlled test before investing.
      good: Investigates with interviews and data and is cautious about causation.
      weak: Concludes that pushing all users toward the behaviour will improve retention.
    followups:
      - What would a convincing test look like here?
      - How would you avoid breaking the workflow these customers rely on?
    common_errors:
      - Concluding that the feature causes retention when already-engaged customers are simply the ones who find it.
