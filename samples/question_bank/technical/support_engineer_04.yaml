# Curated questions: technical support engineering (part 4 of 4) — escalation to engineering,
# customer communication, knowledge bases, ticket hygiene, incidents and support operations.
# `defaults` are merged into every question (question keys win). Medium is the default
# difficulty band; easy and hard questions override round_types.
version: 1
defaults:
  role_tags: [support_engineer]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.support_engineer.explaining_cause_plainly
    competency_key: customer_communication
    topic: Explaining a technical cause to a non-technical customer
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you explain a technical cause to a customer who isn't technical? Use an example like a file sync
      failing because an access token expired.
    expected_concepts:
      - leading with what happened and what it means for them
      - plain language or a simple analogy instead of jargon
      - clear steps they need to take, in order
      - confirming they were able to complete the steps
      - how to avoid it happening again
    rubric:
      excellent: Gives a clear plain-language explanation of the example, puts the impact and action first, lists concrete steps and checks understanding, without talking down to the customer.
      good: Explains the cause reasonably plainly but the next steps are vague or buried.
      weak: Uses jargon the customer would not follow or gives no clear action.
    followups:
      - How would your explanation change for the customer's IT administrator?
      - How do you check that the customer actually understood?
    common_errors:
      - Explaining the internal mechanism at length before saying what the customer should do.

  - external_key: technical.support_engineer.updates_on_long_tickets
    competency_key: customer_communication
    topic: Keeping customers updated on long investigations
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a ticket is going to take several days to resolve, how do you keep the customer informed, and what goes
      into a good update?
    expected_concepts:
      - agreeing an update cadence that matches the severity
      - what has been done, what was found and what happens next
      - when the next update will arrive
      - anything needed from the customer
      - updating even when there is no new progress
    rubric:
      excellent: Sets and keeps a cadence tied to severity, and each update covers progress, findings, next steps, the next update time and any customer action, even when there is little news.
      good: Sends regular updates with progress but does not commit to timing or say what is needed from the customer.
      weak: Only contacts the customer when the issue is resolved or when they chase.
    followups:
      - What do you write when there has been no progress since the last update?
      - How do you handle a customer who wants updates every hour?
    common_errors:
      - Going silent while waiting on engineering.

  - external_key: technical.support_engineer.kb_article_structure
    competency_key: technical_support
    topic: Writing a useful knowledge base article
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What makes a knowledge base article genuinely useful to customers? Walk me through how you'd structure one for
      a common error message.
    expected_concepts:
      - the exact error text in the title so search finds it
      - who it applies to, such as versions or plans
      - likely causes and how to tell which one applies
      - step-by-step resolution with expected results
      - when to contact support and what to include
    rubric:
      excellent: Proposes a searchable title with the exact error, scope, causes with ways to distinguish them, numbered steps with expected outcomes, and a clear path to support.
      good: Covers the problem and resolution steps but neglects searchability or scope.
      weak: Describes a long narrative or internal notes with no clear steps.
    followups:
      - How would you know whether the article actually helps?
      - What would you leave out of a customer-facing article that belongs in an internal one?
    common_errors:
      - Writing the title in internal terms that customers would never search for.

  - external_key: technical.support_engineer.deciding_to_escalate
    competency_key: technical_support
    topic: When to escalate to engineering
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide when it's time to escalate a ticket to engineering rather than keep working it yourself?
    expected_concepts:
      - evidence of a product defect rather than configuration or usage
      - severity and customer impact
      - having exhausted documented troubleshooting
      - time spent without progress against agreed targets
      - needing access or knowledge only engineering has
    rubric:
      excellent: Uses clear criteria including evidence of a defect, impact, exhausted troubleshooting and time limits, and escalates early for high-severity cases while doing the groundwork first for others.
      good: Escalates on reasonable grounds but the criteria are loose or purely time-based.
      weak: Escalates everything immediately or holds on to tickets far too long.
    followups:
      - What would you do before escalating so engineering does not bounce it back?
      - When would you escalate even though you have not finished troubleshooting?
    common_errors:
      - Escalating without the basic information engineering will ask for first.

  - external_key: technical.support_engineer.internal_ticket_notes
    competency_key: technical_support
    topic: Writing internal ticket notes
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What do you write in a ticket's internal notes so a teammate could pick it up tomorrow without asking you
      anything?
    expected_concepts:
      - current status and the last customer contact
      - what has been tried and the results
      - current hypothesis and next planned step
      - links to logs, related tickets and bug reports
      - any commitments made to the customer
    rubric:
      excellent: Describes notes that capture status, what was tried with results, current theory, next step, links and commitments, so a handover needs no conversation.
      good: Records what was tried but leaves out the next step or customer commitments.
      weak: Writes notes only for themselves or relies on memory.
    followups:
      - How would your notes differ for an urgent ticket handed to another time zone?
      - What should never go into internal notes?
    common_errors:
      - Leaving out what was promised to the customer, so the next person breaks that promise.

  - external_key: technical.support_engineer.presenting_workaround
    competency_key: customer_communication
    topic: Finding and offering workarounds
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a proper fix is weeks away, how do you go about finding a workaround and presenting it to the customer?
    expected_concepts:
      - understanding what the customer is ultimately trying to achieve
      - testing the workaround before offering it
      - being clear about its limitations or risks
      - keeping the ticket linked to the real fix and following up when it ships
      - documenting it for others with the same issue
    rubric:
      excellent: Starts from the customer's goal, tests the workaround, explains its limits plainly, keeps the ticket tied to the permanent fix, and shares the workaround with the team.
      good: Offers a reasonable tested workaround but does not explain limitations or follow up on the fix.
      weak: Offers an untested workaround or presents it as the final solution.
    followups:
      - What would you do if the only workaround carries some risk?
      - How do you make sure the customer hears when the real fix ships?
    common_errors:
      - Closing the ticket once the workaround is in place and forgetting about the real fix.

  - external_key: technical.support_engineer.confirming_resolution
    competency_key: technical_support
    topic: Confirming a ticket is resolved
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide a ticket is actually resolved and ready to close? What do you check before you close it?
    expected_concepts:
      - customer confirmation that the original problem is gone
      - verifying the fix through logs or reproduction where possible
      - a clear summary of cause and resolution in the ticket
      - knowledge base or bug updates if needed
      - leaving a simple way to reopen
    rubric:
      excellent: Confirms with the customer and with evidence, writes a closing summary of cause and fix, updates related knowledge or bugs, and makes reopening easy.
      good: Gets customer confirmation and closes with a short summary but skips verification or documentation.
      weak: Closes tickets when the customer stops replying without any confirmation or summary.
    followups:
      - How long would you wait for a customer reply before closing?
      - What goes into a good closing summary?
    common_errors:
      - Closing tickets automatically on silence for problems that may still be happening.

  # ---------------------------------------------------------------- medium
  - external_key: technical.support_engineer.escalation_write_up
    competency_key: technical_support
    topic: Writing an escalation engineering can act on
    difficulty: medium
    kind: technical
    text: >-
      Walk me through how you write up a bug for engineering so it gets picked up and fixed quickly. What does a
      great escalation contain?
    expected_concepts:
      - clear summary of the symptom and the expected behaviour
      - exact reproduction steps, environment and versions
      - evidence such as logs, request ids and timestamps
      - customer impact, number affected and any workaround
      - what support already ruled out
    rubric:
      excellent: Describes a concise escalation with summary, reproduction steps, environment, evidence, impact and what was ruled out, written so an engineer can start immediately.
      good: Includes steps and logs but leaves out impact or what was already ruled out.
      weak: Forwards the customer's message with little added information.
    followups:
      - How do you show business impact without overstating it?
      - What do you do when you cannot provide reproduction steps?
    common_errors:
      - Leaving out impact, so the bug sits in the backlog unprioritised.

  - external_key: technical.support_engineer.working_as_designed_reply
    competency_key: technical_support
    topic: Handling a working-as-designed response
    difficulty: medium
    kind: technical
    text: >-
      How do you respond when engineering says an issue is working as designed, but the customer is still clearly
      blocked?
    expected_concepts:
      - confirming you understand the intended design and its reasoning
      - restating the customer's goal and the business impact
      - looking for alternative ways to meet the goal within the product
      - routing it as a feature request or design gap to product with evidence
      - explaining the outcome to the customer clearly
    rubric:
      excellent: Understands the design decision, looks for alternatives, turns the gap into a well-supported product request with impact data, and communicates a clear outcome to the customer.
      good: Accepts the answer and logs a feature request but does not look for alternatives or quantify impact.
      weak: Tells the customer it is not a bug and closes the ticket, or argues with engineering without new information.
    followups:
      - How would you gather evidence that other customers have the same need?
      - What do you say to the customer if the answer is no?
    common_errors:
      - Ending the conversation at working as designed while the customer is still blocked.

  - external_key: technical.support_engineer.outage_ticket_flood
    competency_key: technical_support
    topic: Handling a flood of tickets during an outage
    difficulty: medium
    kind: scenario
    text: >-
      During an outage, dozens of tickets about the same problem arrive within a few minutes. How would you handle
      the queue and the customers?
    expected_concepts:
      - confirming it is one issue and linking tickets to a parent incident
      - a prepared or quick acknowledgement message
      - pointing customers to the status page for updates
      - feeding customer symptoms and scope to the incident team
      - updating all linked tickets when the issue is resolved
    rubric:
      excellent: Groups tickets under a parent, acknowledges quickly with consistent messaging, points to the status page, passes useful customer evidence to the incident team, and closes the loop for every ticket.
      good: Links tickets and sends acknowledgements but does not feed information back to the incident team.
      weak: Works through the tickets one at a time with individual investigations.
    followups:
      - How would you spot a ticket in the flood that is actually a different problem?
      - What would you send once the incident is resolved?
    common_errors:
      - Missing an unrelated urgent ticket hidden among the outage tickets.

  - external_key: technical.support_engineer.keeping_kb_current
    competency_key: technical_support
    topic: Keeping a knowledge base accurate
    difficulty: medium
    kind: technical
    text: >-
      How would you keep a knowledge base accurate when the product changes every few weeks? Tell me what process
      you'd put in place.
    expected_concepts:
      - article owners and review dates
      - linking articles to features so releases trigger reviews
      - flagging articles from ticket feedback or agent reports
      - retiring or archiving outdated content
      - version labels so readers know what applies to them
    rubric:
      excellent: Proposes ownership, review dates, release-driven updates, feedback flags and retirement of stale content, with version labels so readers trust what they see.
      good: Suggests periodic reviews and feedback but lacks ties to releases or clear ownership.
      weak: Updates articles only when a customer complains.
    followups:
      - How would you persuade busy colleagues to keep articles updated?
      - How would you find the articles that are most out of date?
    common_errors:
      - Adding new articles constantly without retiring outdated ones.

  - external_key: technical.support_engineer.explaining_outage_impact
    competency_key: customer_communication
    topic: Explaining an outage to an affected customer
    difficulty: medium
    kind: technical
    text: >-
      After we fix an outage that disrupted a customer's business for two hours, how do you explain what happened to
      them? What do you include, and what do you leave out?
    expected_concepts:
      - a clear timeline of impact from the customer's perspective
      - the cause in plain terms without unnecessary internal detail
      - what was done to fix it and to prevent a repeat
      - acknowledging the impact on their business
      - not speculating or promising things that are not confirmed
    rubric:
      excellent: Describes a structured explanation with timeline, plain-language cause, fix and prevention, acknowledges impact, and avoids speculation, blame or internal detail that does not help the customer.
      good: Covers cause and fix accurately but misses prevention or acknowledgement of impact.
      weak: Gives a vague or overly technical explanation, or promises it will never happen again.
    followups:
      - How would you handle a request for compensation?
      - Who would you involve before sending the explanation?
    common_errors:
      - Sharing unconfirmed causes that later turn out to be wrong.

  - external_key: technical.support_engineer.missing_capability_not_bug
    competency_key: customer_communication
    topic: When a reported bug is a missing feature
    difficulty: medium
    kind: technical
    text: >-
      How do you handle a customer who insists a missing capability is a bug that must be fixed urgently, when it's
      actually something the product doesn't do?
    expected_concepts:
      - understanding the underlying need and its impact
      - explaining clearly and respectfully what the product supports
      - offering alternatives, workarounds or integrations
      - logging a feature request with the use case and passing it to product
      - avoiding promises about future features
    rubric:
      excellent: Digs into the real need, explains the product's current behaviour clearly, offers alternatives, records a strong feature request, and sets realistic expectations without promises.
      good: Explains it is not supported and logs a feature request but offers no alternatives.
      weak: Argues about the definition of a bug or promises the feature will be added.
    followups:
      - What makes a feature request useful to the product team?
      - What would you say if the customer points to a competitor that has it?
    common_errors:
      - Hinting that a feature is coming when nothing has been committed.

  - external_key: technical.support_engineer.ticket_trends_to_product
    competency_key: technical_support
    topic: Using ticket data to drive product fixes
    difficulty: medium
    kind: technical
    text: >-
      Tell me about a time you used ticket data to push for a product fix. How did you find the pattern, and how did
      you make the case to engineering or product?
    expected_concepts:
      - consistent tagging or categorisation of tickets
      - quantifying volume, time spent and customers affected
      - linking tickets to a bug or improvement request
      - presenting the cost of not fixing it
      - following through and measuring the drop afterwards
    rubric:
      excellent: Gives a concrete example of finding a pattern in data, quantifies the impact in tickets, time and customers, makes a clear case, and measures the result after the fix.
      good: Describes noticing a pattern and raising it with some numbers but no follow-through.
      weak: Has no example or relies on anecdotes without data.
    followups:
      - How did you make sure the tagging was reliable enough to trust?
      - What did you do if the fix was not prioritised?
    common_errors:
      - Raising issues anecdotally without numbers, so they lose out to other priorities.

  - external_key: technical.support_engineer.remote_session_rules
    competency_key: technical_support
    topic: Working safely in customer systems
    difficulty: medium
    kind: technical
    text: >-
      When you join a screen share or remote session on a customer's production system, what rules do you follow to
      keep it safe?
    expected_concepts:
      - explaining what you plan to do before doing it
      - the customer performing or approving each change
      - read-only checks first and backups before changes
      - avoiding exposure of data you do not need to see
      - recording what was changed in the ticket
    rubric:
      excellent: Describes explicit consent, explaining actions before taking them, read-only first, backups before changes, minimal data exposure, and a written record of every change.
      good: Gets permission and is careful but does not mention backups or documenting changes.
      weak: Takes control and makes changes freely to resolve the problem quickly.
    followups:
      - What would you do if you notice something unrelated but risky during the session?
      - How do you handle being shown data you should not see?
    common_errors:
      - Making changes without telling the customer exactly what was changed.

  - external_key: technical.support_engineer.queue_near_target_breach
    competency_key: technical_support
    topic: Managing a queue against response targets
    difficulty: medium
    kind: technical
    text: >-
      How do you manage your queue when several tickets are close to breaching their response targets at the same
      time and you only have time for one deep investigation?
    expected_concepts:
      - a quick meaningful first response to each ticket
      - ordering by impact and severity rather than age alone
      - asking teammates or a lead for help early
      - setting expectations about when the deeper work will happen
      - flagging capacity problems if this keeps happening
    rubric:
      excellent: Sends substantive first responses to all, prioritises the deep work by impact, asks for help early, sets clear expectations and raises recurring capacity issues.
      good: Prioritises sensibly and responds to everyone but does not ask for help or flag the pattern.
      weak: Sends empty holding replies to stop the clock or works on the oldest ticket only.
    followups:
      - What makes a first response meaningful rather than a holding reply?
      - When would you ask your lead to step in?
    common_errors:
      - Sending generic replies just to stop a timer without moving the ticket forward.

  - external_key: technical.support_engineer.minimal_reproduction_case
    competency_key: debugging
    topic: Building a minimal reproduction
    difficulty: medium
    kind: technical
    text: >-
      How do you reduce a customer's complex setup to a minimal case that engineering can reproduce? Walk me through
      an example.
    expected_concepts:
      - starting from the customer's failing case and removing parts one at a time
      - checking the failure still happens after each removal
      - replacing customer data with small synthetic data
      - a short script or step list that anyone can run
      - noting which elements turned out to be necessary
    rubric:
      excellent: Describes stripping the setup down step by step while confirming the failure each time, ends with a small runnable case using synthetic data, and reports which factors were essential.
      good: Describes simplifying the setup but not verifying the failure at each step.
      weak: Passes the customer's entire setup to engineering without simplifying it.
    followups:
      - What do you do if the problem disappears as you simplify?
      - How do you share the reproduction so engineering can run it easily?
    common_errors:
      - Removing several parts at once and losing track of which one mattered.

  - external_key: technical.support_engineer.unknown_answer_on_call
    competency_key: customer_communication
    topic: Not knowing the answer on a live call
    difficulty: medium
    kind: technical
    text: >-
      How do you handle a detailed technical question on a live customer call when you don't know the answer?
    expected_concepts:
      - saying clearly that you will confirm rather than guessing
      - capturing the exact question and any context needed
      - giving a specific time for the follow-up
      - finding the answer from documentation or the right expert
      - following up as promised and sharing the answer with the team
    rubric:
      excellent: Avoids guessing, captures the exact question, commits to a specific follow-up time, finds an authoritative answer, and follows through while sharing it internally.
      good: Promises to find out and follows up but does not set a time or capture enough detail.
      weak: Guesses an answer to avoid looking unsure or never follows up.
    followups:
      - What would you do if the answer turns out to be one the customer will not like?
      - How would you prepare for calls to make this happen less often?
    common_errors:
      - Improvising an answer that later turns out to be wrong.

  # ------------------------------------------------------------------ hard
  - external_key: technical.support_engineer.major_incident_support_lead
    competency_key: technical_support
    topic: Support's role in a major incident
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      During a major incident affecting many customers, what does a support lead need to coordinate, and how do you
      keep customer communication accurate and consistent?
    expected_concepts:
      - a single liaison between the incident team and support
      - approved message templates and a single source of truth such as the status page
      - feeding customer-reported symptoms and scope into the incident
      - prioritising key or most-affected customers for direct contact
      - planned update times and a final resolution message
    rubric:
      excellent: Describes a clear liaison role, one source of truth, approved messaging, two-way flow of information with the incident team, targeted outreach and a timed update plan through to resolution.
      good: Covers status page updates and messaging but not the flow of customer information into the incident.
      weak: Leaves each agent to reply individually with whatever they know.
    followups:
      - How would you handle a customer who demands updates more detailed than the status page?
      - What would you track during the incident for the review afterwards?
    common_errors:
      - Agents giving conflicting estimates of when service will return.

  - external_key: technical.support_engineer.evidence_contradicts_customer
    competency_key: customer_communication
    topic: When the evidence points at the customer's change
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A customer's senior engineer is certain our product caused their outage, but your evidence points to a
      configuration change on their side. How would you handle that?
    expected_concepts:
      - double-checking our side first so the conclusion is solid
      - presenting a clear timeline and evidence rather than opinion
      - inviting them to review the data together
      - staying open to new evidence that changes the picture
      - helping them recover regardless of where the cause lies
    rubric:
      excellent: Verifies our side thoroughly, presents a factual timeline and evidence collaboratively, remains open to being wrong, and keeps the focus on getting the customer back to normal.
      good: Shares evidence clearly but in a way that becomes a debate, or does not double-check our side first.
      weak: Either accepts blame without evidence or tells the customer flatly that it is their fault.
    followups:
      - What would you do if they still disagree after seeing the evidence?
      - Who else would you involve, and when?
    common_errors:
      - Framing the conversation around blame rather than resolution.

  - external_key: technical.support_engineer.automating_support_task
    competency_key: technical_support
    topic: Automating repetitive support work
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Tell me about a repetitive support task you automated or would automate. How did you decide it was worth doing,
      and how did you make it safe?
    expected_concepts:
      - measuring frequency and time spent on the task
      - choosing between a script, a macro, a tool feature or a product fix
      - safety measures such as dry runs, read-only modes and logging
      - permission controls and review before running against customer data
      - measuring the time saved afterwards
    rubric:
      excellent: Gives a concrete example with data on frequency and time, chose an appropriate level of automation, built in safety such as dry runs, logging and access control, and measured the outcome.
      good: Describes a real automation and its benefit but is thin on safety or measurement.
      weak: Has no example, or describes a script that changes customer data without safeguards.
    followups:
      - When is automation the wrong answer compared with fixing the product?
      - How did you get others on the team to adopt it?
    common_errors:
      - Automating a task that should have been fixed in the product instead.

  - external_key: technical.support_engineer.measuring_kb_effectiveness
    competency_key: technical_support
    topic: Measuring knowledge base impact
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you measure whether our knowledge base is actually reducing tickets, and what would you change based
      on what you find?
    expected_concepts:
      - searches with no results or no click as content gaps
      - article views followed by a ticket on the same topic
      - ticket volume trends for topics with new articles
      - article feedback and agent linking of articles in replies
      - acting on findings by rewriting, merging or creating articles
    rubric:
      excellent: Proposes several complementary signals such as failed searches, view-then-ticket rates and topic volume trends, recognises their limits, and ties each finding to a concrete content action.
      good: Suggests views and feedback ratings and some volume tracking but does not connect findings to actions.
      weak: Measures only the number of articles or page views.
    followups:
      - Why can a popular article still be a bad sign?
      - How would you separate the effect of an article from a product fix released at the same time?
    common_errors:
      - Treating high page views as proof that an article is reducing tickets.

  - external_key: technical.support_engineer.vulnerability_in_ticket
    competency_key: technical_support
    topic: Security reports arriving through support
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How should support handle a ticket where a customer reports what looks like a security vulnerability in our
      product?
    expected_concepts:
      - routing it immediately to the security team through the defined process
      - restricting who can see the ticket and its details
      - not trying to reproduce it against other customers' data or production
      - acknowledging the report without confirming details prematurely
      - keeping the reporter updated through the security team's process
    rubric:
      excellent: Escalates straight to security through the defined channel, restricts visibility, avoids risky reproduction, acknowledges carefully, and coordinates updates through security.
      good: Escalates to security promptly but does not restrict the ticket or think about communication.
      weak: Investigates alone, discusses it openly in shared channels, or treats it as a normal bug.
    followups:
      - What would you say to the customer in your first reply?
      - What if the customer says they have already posted it publicly?
    common_errors:
      - Leaving vulnerability details visible in a normal ticket queue that many people can read.

  - external_key: technical.support_engineer.breaking_reopen_loop
    competency_key: technical_support
    topic: Owning a ticket that keeps bouncing
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you take ownership of a ticket that's been reopened several times and bounced between support and two
      engineering teams?
    expected_concepts:
      - reading the full history and restating the actual problem
      - checking what each previous fix did and why it did not hold
      - getting the teams together with one clear owner and next action
      - resetting expectations with the customer and committing to an update plan
      - a review afterwards on why the handoffs failed
    rubric:
      excellent: Rebuilds a clear problem statement from the history, finds why earlier fixes failed, gets one owner and plan across teams, resets expectations with the customer, and follows up on the process gap.
      good: Takes ownership and coordinates the teams but does not address why earlier attempts failed.
      weak: Passes it to another team again or applies another quick fix.
    followups:
      - What would you say to the customer when you first take over?
      - How would you prevent the same pattern on future tickets?
    common_errors:
      - Starting from scratch without reading what has already been tried.

  - external_key: technical.support_engineer.post_incident_review_input
    competency_key: technical_support
    topic: Support's input to post-incident reviews
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      After an incident, what does support bring to the post-incident review, and how do you make sure customer
      impact is captured accurately?
    expected_concepts:
      - ticket counts, affected customers and timeline of first reports
      - gaps between when customers noticed and when monitoring alerted
      - quality and timeliness of customer communication
      - customer-facing follow-up actions such as articles or proactive outreach
      - support-side improvements to detection and messaging
    rubric:
      excellent: Brings quantified impact, the timeline of customer reports against internal detection, an assessment of communication, and concrete support-side actions, using ticket data rather than impressions.
      good: Reports ticket volume and some customer feedback but does not compare detection timing or propose actions.
      weak: Does not see a role for support in the review.
    followups:
      - What would it mean if customers reported the problem well before alerts fired?
      - How would you follow up with customers once the review is complete?
    common_errors:
      - Reporting impressions of impact instead of data from tickets.
