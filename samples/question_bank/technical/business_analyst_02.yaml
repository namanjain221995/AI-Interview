# Curated questions: business analysis (part 2 of 4).
# Process modelling (current and future state, BPMN, swimlanes), gap analysis, business rules and
# decision tables, root cause analysis, integration and data migration requirements.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; medium also in deep_technical; hard in deep_technical
# and combined.
version: 1
defaults:
  role_tags: [business_analyst]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.business_analyst.current_state_mapping
    competency_key: process_modeling
    topic: Mapping a current-state process
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Talk me through how you'd map the current process for something like handling customer complaints,
      from the first conversation to a finished diagram the team agrees reflects reality.
    expected_concepts:
      - defining the start and end points and scope of the process
      - talking to and observing the people who perform each step
      - capturing roles, handoffs, systems and decision points
      - noting volumes, timings and workarounds
      - walking the draft back through with participants to validate it
    rubric:
      excellent: Describes a clear sequence from scoping to validation, captures handoffs, systems and timings, and explains how they checked the map against what actually happens rather than the official procedure.
      good: Describes interviewing participants and drawing the process with roles and decisions.
      weak: Draws the process from a policy document or one manager's description without validation.
    followups:
      - How do you handle a step that different people describe differently?
      - What level of detail do you stop at?
    common_errors:
      - Mapping the process as it is supposed to work rather than as it really runs.

  - external_key: technical.business_analyst.swimlane_diagram_use
    competency_key: process_modeling
    topic: Swimlane diagrams and handoffs
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Why would you choose a swimlane diagram for a process, and what kinds of problems does it tend to
      reveal that a simple flowchart might hide?
    expected_concepts:
      - lanes show which role or system owns each step
      - handoffs between lanes become visible
      - waiting time and rework loops at handoffs
      - steps with unclear or duplicated ownership
      - easier conversations with each team about their part
    rubric:
      excellent: Explains the ownership and handoff view with a real example of a delay, ownership gap or rework loop that the lanes made obvious.
      good: Explains that lanes show responsibilities and handoffs with a reasonable example.
      weak: Describes swimlanes only as a drawing style without explaining what they reveal.
    followups:
      - Would you put systems in their own lanes? Why or why not?
      - How many lanes before a diagram becomes unreadable?
    common_errors:
      - Drawing lanes by department while missing the external parties where most delays occur.

  - external_key: technical.business_analyst.bpmn_core_elements
    competency_key: process_modeling
    topic: Practical BPMN notation
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you've used BPMN, which parts of the notation do you actually rely on day to day, and how do you
      keep diagrams readable for business people who've never seen it?
    expected_concepts:
      - events, tasks and gateways as the core set
      - exclusive versus parallel gateways
      - message flows between pools
      - using a limited subset for business audiences
      - legends, consistent naming with verb-noun tasks
    rubric:
      excellent: Names the elements they use with correct meaning, explains when they'd use a parallel versus exclusive gateway, and describes deliberate simplification for business readers.
      good: Correctly describes the main elements and keeps diagrams reasonably simple.
      weak: Confuses gateway types or cannot explain how they make diagrams accessible.
    followups:
      - When would you use an intermediate timer event?
      - Have you ever drawn a technical version and a business version of the same process?
    common_errors:
      - Using exotic notation that only other modellers can read.

  - external_key: technical.business_analyst.gap_analysis_basics
    competency_key: process_modeling
    topic: Running a gap analysis
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Describe how you've carried out a gap analysis between how things work today and where the business
      wants to be. What did the output look like?
    expected_concepts:
      - clear definition of the target state and its goals
      - comparing current and target across process, people, data and technology
      - listing each gap with its impact
      - options or actions to close each gap
      - prioritising gaps by value and effort
    rubric:
      excellent: Gives a real example covering several dimensions, shows a structured output with impact and recommended actions, and explains how it informed decisions.
      good: Describes comparing current and future states and listing gaps with actions.
      weak: Produces a list of complaints or a wish list without a defined target state.
    followups:
      - Who used your gap analysis, and what decisions came from it?
      - How did you size the effort to close each gap?
    common_errors:
      - Only looking at system features and missing skills, data or policy gaps.

  - external_key: technical.business_analyst.decision_table_rules
    competency_key: requirements_analysis
    topic: Capturing business rules in decision tables
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A shipping fee depends on order value, destination region and whether the customer is a member.
      How would you capture those rules so nothing is missed or contradictory?
    expected_concepts:
      - a decision table with conditions and outcomes
      - covering every combination of conditions
      - spotting contradictions and missing cases
      - confirming rules and boundaries with the business owner
      - using the table as a basis for test cases
    rubric:
      excellent: Builds or describes a decision table, explains how it exposes missing and conflicting combinations, handles boundaries precisely and links it to testing.
      good: Proposes a table or matrix and validates it with the business.
      weak: Writes rules as paragraphs that leave combinations unspecified.
    followups:
      - How would you show the rules when there are too many combinations for one table?
      - What's an example of a boundary you'd need to pin down here?
    common_errors:
      - Leaving boundaries like "orders over 50" unclear on whether 50 itself qualifies.

  - external_key: technical.business_analyst.handoff_delay_scenario
    competency_key: process_modeling
    topic: Spotting waste in a process
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      New employee laptops take three weeks to arrive, but when you add up the actual work involved it's
      about two hours. How would you go about finding where the time goes?
    expected_concepts:
      - mapping each step with work time versus waiting time
      - identifying queues, approvals and handoffs
      - tracing a few real requests end to end
      - finding rework from missing information
      - proposing changes that target the biggest waits
    rubric:
      excellent: Traces real requests end to end, separates touch time from waiting time, identifies specific causes like serial approvals or missing information, and proposes targeted changes.
      good: Maps the process and identifies handoffs and approvals as likely delays.
      weak: Suggests a new tool or asks people to work faster without understanding the delay.
    followups:
      - Which data sources would show you where requests wait?
      - What quick win would you look for first?
    common_errors:
      - Optimising the steps that take effort rather than the queues where the time actually goes.

  - external_key: technical.business_analyst.root_cause_recurring_issue
    competency_key: problem_solving
    topic: Root cause analysis of a recurring business issue
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Customers keep receiving invoices with the wrong address, and every month someone fixes them by
      hand. How would you find the root cause rather than just the latest instance?
    expected_concepts:
      - gathering examples and looking for patterns
      - tracing where the address data enters and changes
      - techniques such as five whys or a fishbone diagram
      - distinguishing process, data and system causes
      - verifying the cause before proposing a fix
    rubric:
      excellent: Uses real examples to find a pattern, traces the data's path through systems and processes, applies a structured technique and confirms the cause with evidence before recommending a fix.
      good: Applies a structured technique and investigates the data flow.
      weak: Proposes more manual checking or blames individual users.
    followups:
      - What if you find two different causes contributing?
      - How would you show the fix actually worked?
    common_errors:
      - Stopping at the first plausible cause without checking it against the examples.

  - external_key: technical.business_analyst.sop_vs_model
    competency_key: communication
    topic: Turning process models into usable procedures
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've finished a future-state process model, and the operations team says they need something
      their staff can follow on day one. What would you give them, and how would you make sure it's used?
    expected_concepts:
      - step-by-step procedures or work instructions per role
      - screenshots, examples and decision guidance for exceptions
      - testing the instructions with real staff
      - keeping procedures and model in sync
      - training or walkthroughs before go-live
    rubric:
      excellent: Translates the model into role-based instructions with examples and exception handling, tests them with real users, and sets up ownership so they stay current.
      good: Produces role-based procedures and supports training.
      weak: Hands over the BPMN diagram and assumes it is enough.
    followups:
      - Who should own these procedures after the project ends?
      - How would you know if staff are not following the new process?
    common_errors:
      - Writing procedures nobody has tried out before go-live.

  # ---------------------------------------------------------------- medium
  - external_key: technical.business_analyst.future_state_design
    competency_key: process_modeling
    topic: Designing a future-state process
    difficulty: medium
    kind: technical
    text: >-
      Once you've mapped the current process, how do you go about designing the future one? Walk me
      through the reasoning you'd use, not just the diagramming.
    expected_concepts:
      - starting from goals and measurable targets for the process
      - eliminating, combining or automating steps
      - designing exception paths and not just the happy path
      - checking feasibility with system, policy and people constraints
      - estimating and later measuring the improvement
    rubric:
      excellent: Starts from the target outcomes, applies clear redesign principles, covers exceptions, tests feasibility with the people involved and describes how the benefit would be measured.
      good: Describes removing waste and automating steps with stakeholder input.
      weak: Redraws the current process with a new system in it and calls it the future state.
    followups:
      - Which constraint most often limits a future-state design in your experience?
      - How do you avoid designing an ideal process the organisation can't adopt?
    common_errors:
      - Automating a broken process instead of simplifying it first.

  - external_key: technical.business_analyst.process_metrics_baseline
    competency_key: process_modeling
    topic: Baselining process performance
    difficulty: medium
    kind: technical
    text: >-
      Before recommending a process change, how would you establish a baseline so you can later prove
      whether the change improved anything?
    expected_concepts:
      - choosing metrics such as cycle time, throughput, error rate and cost per case
      - extracting timestamps from systems or sampling manually
      - accounting for seasonality and volume variation
      - agreeing the definitions with stakeholders
      - recording the baseline before change begins
    rubric:
      excellent: Picks relevant metrics with precise definitions, explains how they'd get the data even when systems don't capture it, accounts for variation and agrees the baseline before any change.
      good: Names sensible metrics and a way to measure them.
      weak: Relies on stakeholder impressions with no numbers.
    followups:
      - What would you do if the system has no timestamps for key steps?
      - How long a baseline period is enough?
    common_errors:
      - Measuring the baseline after the team has already started changing how they work.

  - external_key: technical.business_analyst.fit_gap_package
    competency_key: requirements_analysis
    topic: Fit-gap analysis for an off-the-shelf package
    difficulty: medium
    kind: scenario
    text: >-
      Your company is moving its HR processes onto a well-known SaaS platform. During fit-gap sessions,
      the business keeps asking for customisations to match how they work today. How would you approach
      this?
    expected_concepts:
      - starting from the package's standard process
      - classifying gaps as fit, configure, workaround or customise
      - challenging whether each difference adds real value
      - cost and upgrade risk of customisation
      - decision forum for approving customisations
    rubric:
      excellent: Leads with the standard process, classifies each gap with cost and upgrade implications, challenges low-value differences and routes the rest to a clear decision forum.
      good: Distinguishes configuration from customisation and pushes back on unnecessary changes.
      weak: Documents every requested customisation as a requirement.
    followups:
      - How would you persuade a team to change a long-standing practice to fit the package?
      - Which kinds of gaps would you accept customising for?
    common_errors:
      - Customising the package so heavily that every vendor upgrade becomes a project.

  - external_key: technical.business_analyst.integration_requirements
    competency_key: requirements_analysis
    topic: Specifying integration requirements
    difficulty: medium
    kind: technical
    text: >-
      Your CRM needs to send new customer accounts to the billing system. As the analyst, what would you
      specify for that integration, and what would you leave to the developers?
    expected_concepts:
      - business trigger and timing such as real time or batch
      - data fields, mappings and ownership of each field
      - validation rules and what happens on rejected records
      - error handling, retries and who gets notified
      - leaving protocol and technical design choices to engineering
    rubric:
      excellent: Specifies trigger, timing, field mapping, data ownership, validation and business handling of failures, and draws a sensible line with the engineers on technical design.
      good: Covers the data mapping and timing with some error handling.
      weak: Says "the systems should sync" or tries to dictate low-level technical design.
    followups:
      - What should happen if billing rejects a record at two in the morning?
      - How would you handle a customer edited in both systems?
    common_errors:
      - Forgetting updates and deletions and specifying only the creation of new records.

  - external_key: technical.business_analyst.data_migration_requirements
    competency_key: data_analysis
    topic: Requirements for a data migration
    difficulty: medium
    kind: scenario
    text: >-
      You're the analyst on a project moving ten years of customer and order data from an old system to
      a new one. What requirements and decisions would you need from the business before migration starts?
    expected_concepts:
      - what data to migrate versus archive, and how much history
      - field mapping and transformation rules
      - data cleansing ownership and rules for bad records
      - reconciliation checks and acceptance criteria for the migration
      - cutover timing and handling of in-flight transactions
    rubric:
      excellent: Covers scope of history, mapping, cleansing ownership, reconciliation criteria and cutover, and explains the business decisions each one requires.
      good: Covers mapping, cleansing and some form of validation.
      weak: Treats migration as a purely technical copy with no business decisions.
    followups:
      - How would you prove to the business that the migration was complete and correct?
      - Who decides what happens to records that can't be cleaned?
    common_errors:
      - Leaving data cleansing until the last trial migration.

  - external_key: technical.business_analyst.process_exception_paths
    competency_key: process_modeling
    topic: Modelling exceptions and rework
    difficulty: medium
    kind: technical
    text: >-
      In most real processes the exceptions take more effort than the main flow. How do you model and
      analyse exception paths without making the diagram unreadable?
    expected_concepts:
      - capturing exception frequency and effort
      - separate sub-process diagrams for major exceptions
      - focusing redesign effort on the most costly exceptions
      - showing rework loops explicitly
      - root causes that generate exceptions upstream
    rubric:
      excellent: Describes layering or sub-processes, quantifies exception volume and cost, and uses that to target root causes upstream.
      good: Models key exceptions separately and notes how often they occur.
      weak: Leaves exceptions out or crams everything into one diagram.
    followups:
      - How would you find out how often each exception happens?
      - Give me an exception you eliminated rather than modelled.
    common_errors:
      - Treating exceptions as rare without checking how often they really occur.

  - external_key: technical.business_analyst.raci_for_process
    competency_key: process_modeling
    topic: Clarifying process ownership
    difficulty: medium
    kind: scenario
    text: >-
      In a supplier onboarding process, procurement, legal and finance each think another team is
      responsible for checking supplier bank details. How would you resolve the ownership question?
    expected_concepts:
      - mapping who currently does what at that step
      - a responsibility matrix such as RACI
      - control and fraud risk of an unowned check
      - getting the process owner or sponsor to decide
      - reflecting the agreed ownership in the process and system permissions
    rubric:
      excellent: Makes the gap visible, explains the risk in concrete terms, facilitates a decision with the accountable owner and embeds the outcome in process documents and system controls.
      good: Uses a RACI and gets the teams to agree an owner.
      weak: Assigns the task to one team themselves without agreement or lets it drift.
    followups:
      - What if no team wants to take the step on?
      - How would you check later that the check is really being done?
    common_errors:
      - Agreeing ownership in a meeting but never updating the procedures or system access.

  - external_key: technical.business_analyst.capability_mapping
    competency_key: process_modeling
    topic: Business capability mapping
    difficulty: medium
    kind: technical
    text: >-
      Have you used a business capability map, and how did it help you compare processes or systems
      across different parts of an organisation?
    expected_concepts:
      - capabilities describe what the business does independent of how
      - stable structure across organisational changes
      - mapping systems and processes to capabilities
      - spotting duplicated systems or under-supported capabilities
      - heat-mapping to prioritise investment
    rubric:
      excellent: Explains what distinguishes capabilities from processes, gives an example of using the map to find duplication or gaps and how it guided investment decisions.
      good: Describes the concept and a sensible use.
      weak: Confuses capabilities with departments or process steps.
    followups:
      - How deep would you go in levels of capability?
      - Who in the business would you validate the map with?
    common_errors:
      - Naming capabilities after current teams, so the map changes at every reorganisation.

  - external_key: technical.business_analyst.automation_candidate_selection
    competency_key: process_modeling
    topic: Choosing process steps to automate
    difficulty: medium
    kind: scenario
    text: >-
      Leadership asks you to identify which back-office tasks in accounts payable should be automated
      first. How would you build that shortlist?
    expected_concepts:
      - volume, effort and error rate per task
      - rule-based and stable tasks versus judgement-heavy ones
      - quality and structure of the input data
      - expected benefit versus build and maintenance cost
      - effect on controls and the people doing the work
    rubric:
      excellent: Gathers task-level data, scores candidates on volume, rule clarity, input quality, benefit and risk, and explains the trade-offs behind the top picks.
      good: Uses volume and repetitiveness to rank candidates with some cost-benefit reasoning.
      weak: Picks the tasks people complain about most without analysis.
    followups:
      - What would make a high-volume task a poor candidate?
      - How would you involve the AP team in the analysis?
    common_errors:
      - Automating a step whose input data is too inconsistent for rules to handle.

  - external_key: technical.business_analyst.data_flow_diagram
    competency_key: process_modeling
    topic: Data flow and system context diagrams
    difficulty: medium
    kind: technical
    text: >-
      When do you reach for a data flow or context diagram rather than a process map, and what questions
      does it help you answer?
    expected_concepts:
      - shows where data comes from, where it goes and where it is stored
      - external entities and system boundaries
      - identifying sources of truth and duplicated stores
      - privacy and security of sensitive data flows
      - scoping interfaces for a project
    rubric:
      excellent: Contrasts data flow with process flow clearly, and gives an example where the diagram exposed a duplicated store, unclear source of truth or sensitive data path.
      good: Explains what the diagram shows and when it is useful.
      weak: Uses the terms interchangeably with process maps.
    followups:
      - How would you show which system is the master for customer data?
      - Who usually finds these diagrams most useful?
    common_errors:
      - Mixing process steps and data flows in one diagram so neither is clear.

  - external_key: technical.business_analyst.policy_change_impact
    competency_key: requirements_analysis
    topic: Impact analysis of a policy change
    difficulty: medium
    kind: scenario
    text: >-
      The company changes its returns policy from thirty days to fourteen. You're asked what needs to
      change. How would you work out the full impact across processes, systems and teams?
    expected_concepts:
      - tracing every process step and system rule that uses the return window
      - customer communications, website content and contracts
      - reports and metrics affected
      - training for store and support staff
      - transition rules for orders placed before the change
    rubric:
      excellent: Systematically traces the rule through processes, systems, documents, reports and people, and raises transition rules for existing orders.
      good: Identifies the main systems and processes plus communications.
      weak: Only considers updating one system setting.
    followups:
      - How would you find every place the thirty-day rule is hard-coded?
      - Which group would you most worry about missing?
    common_errors:
      - Forgetting the orders already in flight when the new rule takes effect.

  # ------------------------------------------------------------------ hard
  - external_key: technical.business_analyst.end_to_end_process_redesign
    competency_key: process_modeling
    topic: Redesigning a cross-functional process
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Order-to-cash at your company involves sales, operations, finance and two legacy systems, and it
      takes an average of 45 days from order to payment. You're asked to cut that substantially. How would
      you approach it end to end?
    expected_concepts:
      - mapping the full flow with timing data across teams
      - finding the largest contributors such as disputes, invoicing delays or credit holds
      - root causes in data quality and handoffs
      - redesign options sequenced by impact and feasibility
      - agreed target metrics and governance across functions
    rubric:
      excellent: Quantifies where the days go using system data, finds root causes across teams, proposes sequenced changes with measurable targets and sets up cross-functional ownership and tracking.
      good: Maps the process, identifies major delays and proposes improvements with metrics.
      weak: Proposes a new system or generic efficiency ideas without analysis.
    followups:
      - How would you get finance and sales to share one metric?
      - Which improvement would you pilot first, and how?
    common_errors:
      - Optimising one department's piece while total cycle time stays the same.

  - external_key: technical.business_analyst.process_mining_insight
    competency_key: process_modeling
    topic: Using event logs to discover real process variants
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      If you had event logs from a ticketing or ERP system, how would you use them to discover how a
      process really runs, and what would you need to be careful about?
    expected_concepts:
      - case identifier, activity and timestamp as the minimum data
      - discovering variants and their frequency
      - finding loops, skipped steps and bottlenecks
      - data quality issues such as missing events or clock differences
      - validating findings with the people doing the work
    rubric:
      excellent: Explains the data needed, how variants and bottlenecks emerge, the pitfalls of incomplete logs and work done outside the system, and how they would confirm findings with people.
      good: Explains extracting events and analysing paths and durations.
      weak: Has no clear idea how logs would be turned into a process view.
    followups:
      - What part of the process would the logs not show you?
      - How would you present ten thousand variants to a business audience?
    common_errors:
      - Treating the log as the whole truth when key steps happen in email or spreadsheets.

  - external_key: technical.business_analyst.target_operating_model_gaps
    competency_key: process_modeling
    topic: Gap analysis for an operating model change
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Three regional finance teams, each with their own processes, are being merged into one shared
      service centre. How would you analyse the gaps and design a common process everyone can adopt?
    expected_concepts:
      - mapping each region's current process and comparing variants
      - separating justified local differences such as legal requirements from habit
      - designing a standard process with controlled local variations
      - people, skills, systems and data gaps for the transition
      - phased migration and measures of adoption
    rubric:
      excellent: Compares regional variants systematically, distinguishes legal or genuine needs from preference, designs a standard with controlled variations and plans the transition with measurable adoption.
      good: Maps the regions, identifies differences and proposes a harmonised process.
      weak: Picks one region's process as the standard without analysis.
    followups:
      - How would you decide which variation is legitimate?
      - Which data would you track to see the new centre is working?
    common_errors:
      - Ignoring local statutory requirements that genuinely differ between regions.

  - external_key: technical.business_analyst.complex_rules_engine
    competency_key: requirements_analysis
    topic: Managing a large, changing set of business rules
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      An insurance product has hundreds of pricing and eligibility rules that change every quarter. How
      would you structure, document and govern those rules so the business can change them safely?
    expected_concepts:
      - a rules catalogue with owner, source and effective dates
      - separating rules from process and code where possible
      - decision models or tables for groups of rules
      - versioning and testing changes against example cases
      - change approval and audit trail
    rubric:
      excellent: Proposes a structured rules catalogue with ownership and effective dating, decision models, regression testing with example cases and a governed change process with audit.
      good: Suggests documenting rules centrally with owners and testing changes.
      weak: Leaves rules spread across documents and code without governance.
    followups:
      - How would you detect two rules that contradict each other?
      - Who should be allowed to change a pricing rule?
    common_errors:
      - Not recording effective dates, so nobody can explain how an old quote was priced.

  - external_key: technical.business_analyst.migration_reconciliation_design
    competency_key: data_analysis
    topic: Designing migration reconciliation
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      For a migration of customer balances into a new finance system, how would you design the
      reconciliation so the business can confidently sign off that nothing was lost or changed?
    expected_concepts:
      - record counts per entity and status
      - control totals such as sum of balances by category
      - field-level sampling and full comparisons for critical fields
      - explained and categorised differences with owners
      - sign-off criteria agreed before the trial runs
    rubric:
      excellent: Designs layered checks from counts to control totals to field-level comparisons, agrees tolerances and sign-off criteria up front and explains how differences are explained and resolved.
      good: Proposes counts, totals and sampling with business sign-off.
      weak: Relies on spot checks of a few records.
    followups:
      - What would you do with a difference of a few cents across thousands of accounts?
      - How many trial migrations would you plan?
    common_errors:
      - Comparing totals only, which can hide offsetting errors.

  - external_key: technical.business_analyst.process_change_resistance
    competency_key: stakeholder_management
    topic: Driving adoption of a redesigned process
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You've launched a redesigned purchase approval process, and three months later the data shows half
      the requests still bypass it through email. How would you investigate and respond?
    expected_concepts:
      - analysing who bypasses it and in which situations
      - talking to users to understand the friction or missing cases
      - distinguishing design flaws from awareness or training gaps
      - adjusting the process or system rather than only enforcing
      - leadership support and controls where bypass creates risk
    rubric:
      excellent: Segments the bypass data, finds the real reasons through conversations, fixes genuine design gaps, combines that with targeted communication and controls, and tracks adoption afterwards.
      good: Investigates reasons and proposes both process tweaks and communication.
      weak: Proposes forcing compliance with no attempt to understand why people avoid the process.
    followups:
