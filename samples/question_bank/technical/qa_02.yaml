# Curated questions: QA / quality engineering (part 2 of 4).
# Exploratory testing, test design, defect triage, risk-based testing, performance testing,
# environments and test data at scale.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [qa]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.qa.exploratory_session
    competency_key: test_automation
    topic: Running an exploratory testing session
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      You've been given ninety minutes to explore a brand-new feature before it goes to customers. How do you
      plan and run that session so it's more than just clicking around?
    expected_concepts:
      - a charter or mission for the session
      - focusing on risky areas and user goals
      - heuristics such as boundaries, interruptions and invalid input
      - taking notes of what was covered and found
      - debrief and follow-up bugs or questions
    rubric:
      excellent: Sets a clear charter, targets risks and user goals, applies named heuristics, records coverage and findings as they go, and closes with a debrief that feeds bugs and new test ideas.
      good: Has a focus area and takes notes of what was tried and found.
      weak: Describes random clicking with no plan or record.
    followups:
      - Tell me about a bug you found through exploration that scripted tests would have missed.
      - How do you share what you covered with the rest of the team?
    common_errors:
      - Not recording coverage, so nobody knows what was actually explored.

  - external_key: technical.qa.vague_acceptance_criteria
    competency_key: test_automation
    topic: Making stories testable
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A user story arrives for refinement that just says users should be able to filter orders easily. How
      would you help the team turn that into something testable?
    expected_concepts:
      - asking clarifying questions about filters, data and users
      - concrete acceptance criteria and examples
      - edge cases such as no results and large result sets
      - non-functional expectations like speed
      - agreeing the criteria with product and developers before work starts
    rubric:
      excellent: Asks specific questions, proposes concrete example-based criteria including edge and empty cases and performance expectations, and gets agreement from product and developers before development.
      good: Asks clarifying questions and writes clearer acceptance criteria.
      weak: Waits for the build and tests whatever was implemented.
    followups:
      - Give me two example acceptance criteria you would write for that story.
      - What would you do if the product owner says to just build it and see?
    common_errors:
      - Writing criteria that restate the story without measurable outcomes.

  - external_key: technical.qa.test_data_creation
    competency_key: test_automation
    topic: Creating data for automated tests
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you usually create the data your automated tests need, and what problems have you hit with the
      approach you used?
    expected_concepts:
      - creating data through APIs or factories
      - seeding databases with known fixtures
      - avoiding dependence on pre-existing environment data
      - unique values per test
      - cleanup after tests
    rubric:
      excellent: Describes a deliberate approach such as API-based factories with unique values, explains why it beats relying on shared environment data, and names a real problem they hit and how they fixed it.
      good: Creates data in setup and cleans up afterwards.
      weak: Relies on records someone created manually in the test environment.
    followups:
      - What happens to your tests if someone wipes the test environment overnight?
      - How do you create data for a state that takes many steps to reach?
    common_errors:
      - Building data through the UI, which makes setup slow and fragile.

  - external_key: technical.qa.smoke_suite_selection
    competency_key: test_automation
    topic: Choosing a smoke test suite
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide which tests belong in a smoke suite that runs right after each deployment, and how is
      that different from your full regression suite?
    expected_concepts:
      - critical user journeys and revenue paths
      - verifies the deployment is healthy, not every rule
      - runs in a few minutes
      - safe to run against the target environment
      - triggers rollback or alerting on failure
    rubric:
      excellent: Picks a small set of critical journeys, explains the smoke suite's purpose as fast deploy verification, keeps it safe for the target environment, and links failures to rollback or alerts.
      good: Distinguishes a short critical-path smoke suite from full regression.
      weak: Uses the full regression suite or a random subset as the smoke test.
    followups:
      - How would you run a smoke test safely against production?
      - What should happen automatically when the smoke suite fails?
    common_errors:
      - Letting the smoke suite grow until it's as slow as regression.

  - external_key: technical.qa.customer_bug_unreproducible
    competency_key: debugging
    topic: Reproducing a customer-reported bug
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A customer reports that their order total was wrong, but you can't reproduce it with the steps they gave.
      What would you do next?
    expected_concepts:
      - gathering more detail such as account, time and device
      - checking logs and order records for that customer
      - comparing data, configuration and feature flags
      - variations in locale, currency, discounts and timing
      - keeping the reporter informed
    rubric:
      excellent: Collects specifics, uses logs and the actual order data, systematically varies conditions such as account state, locale, promotions and flags, and keeps support or the customer updated while investigating.
      good: Asks for more details and checks logs.
      weak: Closes the bug as cannot reproduce after one attempt.
    followups:
      - What information would you ask support to collect next time something like this comes in?
      - The logs show nothing unusual. Where else would you look?
    common_errors:
      - Testing only with a fresh account when the customer has years of history and settings.

  - external_key: technical.qa.browser_device_coverage
    competency_key: test_automation
    topic: Prioritising browsers and devices
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You have two days to test a redesigned sign-up page, and there are far more browsers and devices than
      you can cover. How would you choose what to test on?
    expected_concepts:
      - analytics on actual user browsers and devices
      - covering rendering engines rather than every browser
      - mobile versus desktop split
      - cloud device or browser grids
      - deeper testing on the most used, quick checks elsewhere
    rubric:
      excellent: Bases the choice on real usage data, covers distinct engines and form factors, uses a device cloud for breadth, and explains how depth differs between primary and secondary targets.
      good: Uses usage statistics to pick a few key browsers and devices.
      weak: Tests only on their own browser, or tries to cover everything superficially.
    followups:
      - What kinds of defects are actually browser-specific these days?
      - How would you automate some of this coverage for future releases?
    common_errors:
      - Ignoring mobile Safari, which often behaves differently from desktop browsers.

  - external_key: technical.qa.nightly_mass_failure
    competency_key: test_automation
    topic: Triaging a red nightly run
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You come in on Monday and the nightly regression run has thirty failed tests. What are your first steps?
    expected_concepts:
      - looking for a common cause before individual tests
      - checking environment health and deployments
      - grouping failures by error message or area
      - comparing with the previous passing run and recent changes
      - separating product bugs from test or environment problems
    rubric:
      excellent: Looks for a shared cause first (environment down, deployment, data reset, credentials), groups failures by signature, compares with the last green run, then triages remaining failures into product, test and environment issues.
      good: Checks the environment and then goes through failures one by one.
      weak: Re-runs everything and hopes it goes green, or files thirty separate bugs.
    followups:
      - How would you make this kind of triage faster next time?
      - Who would you tell, and what would you tell them?
    common_errors:
      - Investigating each failure individually when one environment issue caused them all.

  - external_key: technical.qa.input_field_test_design
    competency_key: testing
    topic: Test design techniques for inputs
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Say a booking form accepts a number of guests between one and twelve. How would you design the test
      cases, and which techniques would guide you?
    expected_concepts:
      - equivalence partitioning
      - boundary values at 0, 1, 12 and 13
      - invalid types such as text, decimals and empty input
      - client-side and server-side validation
      - interactions with other fields such as room capacity
    rubric:
      excellent: Applies equivalence classes and boundary values precisely, includes invalid types and empty input, checks both front-end and API validation, and considers dependencies on other fields.
      good: Identifies boundaries and some invalid inputs.
      weak: Tests a few random numbers with no technique.
    followups:
      - How would the cases change if the limit depended on the room type?
      - Which of these would you automate and at what level?
    common_errors:
      - Testing only the UI validation and missing that the API accepts invalid values.

  # ---------------------------------------------------------------- medium
  - external_key: technical.qa.change_based_test_selection
    competency_key: test_automation
    topic: Selecting tests by change impact
    difficulty: medium
    kind: technical
    text: >-
      How would you decide which automated tests to run for a given change, instead of always running the
      whole suite? What risks come with doing that?
    expected_concepts:
      - mapping tests to code or components
      - dependency graphs from the build system
      - coverage-based selection
      - always-run critical tests
      - periodic full runs as a safety net
      - risk of missed indirect dependencies such as config or data
    rubric:
      excellent: Explains at least two selection methods (dependency graph, coverage mapping, tagging), keeps a critical always-run set and scheduled full runs, and names concrete ways selection can miss regressions.
      good: Uses tags or module mapping and keeps a full run somewhere.
      weak: Picks tests manually by gut feel each time, or sees no risk in skipping tests.
    followups:
      - How would you know if the selection logic missed a regression?
      - How do configuration and database changes fit into this?
    common_errors:
      - Ignoring changes outside code, such as configuration or schema, which affect many tests.

  - external_key: technical.qa.risk_based_payments_plan
    competency_key: test_automation
    topic: Risk-based plan for a new feature
    difficulty: medium
    kind: scenario
    text: >-
      Your team is adding a new payment method and you have two weeks of testing time, which isn't enough to
      test everything. How would you build a risk-based test plan?
    expected_concepts:
      - identifying risks with product and developers
      - likelihood times impact ranking
      - money movement, refunds and failure handling
      - integration with the payment provider sandbox
      - security and compliance concerns
      - communicating what will not be tested
    rubric:
      excellent: Runs a risk workshop, ranks by likelihood and impact, focuses depth on money movement, failures, refunds and provider integration, covers security, and makes residual risk explicit to stakeholders.
      good: Prioritises the main payment flows and failure cases.
      weak: Tests in feature order until time runs out with no prioritisation.
    followups:
      - Which risks would you accept, and how would you communicate that?
      - How would you test what happens when the provider times out after taking the money?
    common_errors:
      - Spending most time on happy paths while failure and refund paths go untested.

  - external_key: technical.qa.risk_identification
    competency_key: test_automation
    topic: Identifying and ranking product risks
    difficulty: medium
    kind: technical
    text: >-
      When you say testing is risk-based, how do you actually identify risks and decide how much testing each
      one deserves? Give me an example from a project.
    expected_concepts:
      - sources such as past defects, complexity and change frequency
      - business impact and user exposure
      - input from developers, product and support
      - likelihood and impact scoring
      - mapping risk level to test depth
      - revisiting the assessment as things change
    rubric:
      excellent: Names concrete sources of risk, scores them with stakeholders, maps each level to a defined depth of testing, and shows a real project where this changed what was tested.
      good: Explains likelihood and impact and gives a reasonable example.
      weak: Uses risk as a buzzword without a method or example.
    followups:
      - How did you handle disagreement about how risky something was?
      - When did you last revise a risk ranking mid-project, and why?
    common_errors:
      - Assessing risk once at the start and never updating it.

  - external_key: technical.qa.exploratory_heuristics
    competency_key: test_automation
    topic: Heuristics in exploratory testing
    difficulty: medium
    kind: technical
    text: >-
      Which heuristics or mental models do you lean on during exploratory testing, and can you tell me about
      a time one of them led you to an important bug?
    expected_concepts:
      - named heuristics or mnemonics
      - consistency oracles such as comparable products and claims
      - interruptions, concurrency and state changes
      - data extremes and unusual sequences
      - personas and user goals
    rubric:
      excellent: Describes several heuristics and oracles they genuinely use, explains how they choose between them, and tells a specific story of a heuristic uncovering a significant defect.
      good: Names a couple of heuristics and gives an example.
      weak: Cannot describe any approach beyond trying things out.
    followups:
      - How do you decide when a session has gone deep enough?
      - How do you turn what you learned into automated checks?
    common_errors:
      - Naming mnemonics without being able to show how they shaped real testing.

  - external_key: technical.qa.exploratory_scripted_mix
    competency_key: test_automation
    topic: Balancing exploratory and scripted testing
    difficulty: medium
    kind: technical
    text: >-
      How do you decide how much of a release's testing time goes to scripted or automated checks versus
      exploratory testing?
    expected_concepts:
      - automation for known regressions
      - exploration for new and changed areas
      - risk and novelty of the change
      - maturity of the automated suite
      - time-boxed sessions with charters
    rubric:
      excellent: Ties the split to what automation already covers, how new and risky the change is, and the maturity of the suite, and describes how exploratory findings feed back into automation.
      good: Explains that automation handles regression and exploration targets new work.
      weak: Treats exploratory testing as something done only if time is left over.
    followups:
      - How would this change for a small bug fix versus a major redesign?
      - How do you justify exploratory time to a manager who wants everything scripted?
    common_errors:
      - Assuming high automation coverage removes the need for exploration.

  - external_key: technical.qa.defect_triage_process
    competency_key: test_automation
    topic: Running defect triage
    difficulty: medium
    kind: technical
    text: >-
      How have you run defect triage with developers and product so that bugs get the right priority quickly
      and the backlog doesn't spiral?
    expected_concepts:
      - regular cadence and the right attendees
      - shared severity and priority definitions
      - decisions to fix, defer or close
      - assigning owners and target releases
      - handling duplicates and stale bugs
      - tracking trends rather than individual bugs only
    rubric:
      excellent: Describes a real triage routine with agreed definitions, clear outcomes and owners, rules for duplicates and stale items, and use of trends to spot problem areas.
      good: Has a regular meeting with agreed priorities and owners.
      weak: Bugs are assigned ad hoc and nobody decides what to defer.
    followups:
      - What do you do with low-priority bugs that keep getting deferred?
      - How did you handle disagreements between QA and product on priority?
    common_errors:
      - Letting severity be set by whoever shouts loudest rather than agreed definitions.

  - external_key: technical.qa.escaped_defect_review
    competency_key: test_automation
    topic: Learning from an escaped defect
    difficulty: medium
    kind: scenario
    text: >-
      A bug slipped through to production and caused incorrect invoices for some customers. After it's fixed,
      how would you analyse why testing didn't catch it and what would you change?
    expected_concepts:
      - blameless review of the timeline
      - why existing tests missed it
      - gaps in requirements, data or environments
      - adding a regression test at the right level
      - process or coverage changes beyond the single test
      - tracking escaped defects as a metric
    rubric:
      excellent: Runs a blameless analysis covering requirements, test design, data and environment gaps, adds a regression test at the lowest effective level, and makes a systemic improvement that would catch the whole class of bug.
      good: Identifies the gap and adds a test for it.
      weak: Blames a person or only adds one end-to-end test for the exact scenario.
    followups:
      - How would you tell whether it was a test gap or a requirement gap?
      - What would you report back to the wider team?
    common_errors:
      - Fixing the single symptom without asking what class of defects shares the same gap.

  - external_key: technical.qa.load_test_sales_event
    competency_key: test_automation
    topic: Planning a load test for a peak event
    difficulty: medium
    kind: scenario
    text: >-
      The business expects five times the usual traffic during a big sale next month. How would you plan
      performance testing to give them confidence?
    expected_concepts:
      - workload model from real traffic patterns
      - realistic user journeys and data volumes
      - production-like environment or careful production testing
      - load, spike and soak scenarios
      - success criteria such as latency percentiles and error rates
      - monitoring during the test and finding the breaking point
    rubric:
      excellent: Builds a workload model from real traffic, agrees success criteria up front, runs load, spike and soak tests in a representative environment with full monitoring, finds the breaking point and reports bottlenecks and headroom.
      good: Plans realistic load tests with defined targets.
      weak: Fires a large number of identical requests at one endpoint and reports the average.
    followups:
      - The test environment is a quarter the size of production. How do you interpret results?
      - What would you do with the results if the system falls over at three times normal load?
    common_errors:
      - Testing with tiny data sets so caches make everything look fast.

  - external_key: technical.qa.perf_results_reading
    competency_key: test_automation
    topic: Interpreting performance test results
    difficulty: medium
    kind: technical
    text: >-
      When you look at the results of a load test, which numbers matter to you and how do you decide whether
      the run passed or failed?
    expected_concepts:
      - percentiles rather than averages
      - throughput and error rate together
      - resource utilisation on servers and dependencies
      - comparison against agreed targets and a baseline
      - checking the load generator was not the bottleneck
    rubric:
      excellent: Focuses on latency percentiles, throughput and error rate together, correlates with resource metrics, compares against agreed targets and a baseline, and checks the test tooling itself wasn't the limit.
      good: Uses percentiles and error rates against targets.
      weak: Reports average response time only.
    followups:
      - Why can an average look fine when users are having a bad time?
      - How do you know your load generator wasn't the bottleneck?
    common_errors:
      - Ignoring errors because latency looked good, when fast failures make latency look better.

  - external_key: technical.qa.unreliable_sandbox
    competency_key: test_automation
    topic: Testing against an unreliable third party
    difficulty: medium
    kind: scenario
    text: >-
      Your end-to-end tests depend on a shipping provider's sandbox that is down or slow about a third of the
      time. How would you keep testing reliably without losing confidence in the integration?
    expected_concepts:
      - service virtualisation or stubs for most tests
      - recording and replaying realistic responses
      - simulating errors and timeouts on purpose
      - a small scheduled suite against the real sandbox
      - contract or schema checks against provider documentation
    rubric:
      excellent: Stubs the provider for routine tests including deliberate failure scenarios, keeps a separate small check against the real sandbox, and describes how to keep the stub accurate as the provider changes.
      good: Introduces mocks or stubs and still tests the real integration occasionally.
      weak: Keeps re-running against the sandbox or drops integration testing entirely.
    followups:
      - How do you stop your stub from drifting away from how the real provider behaves?
      - Which failure modes would you simulate first?
    common_errors:
      - Stubbing only success responses, so error handling is never exercised.

  - external_key: technical.qa.per_pr_environments
    competency_key: ci_cd
    topic: Ephemeral test environments
    difficulty: medium
    kind: technical
    text: >-
      Several teams share one staging environment and keep breaking each other's tests. What are the pros and
      cons of moving to short-lived environments per pull request, and how would you make it work?
    expected_concepts:
      - isolation and parallel testing per change
      - infrastructure as code and containers
      - seeded test data on creation
      - dependencies stubbed or shared
      - cost, start-up time and cleanup
      - a shared integrated environment still needed for some checks
    rubric:
      excellent: Weighs isolation against cost, start-up time and dependency complexity, explains provisioning from code with seeded data, how external dependencies are handled, automatic teardown, and what stays in a shared environment.
      good: Explains the isolation benefit and some practical costs.
      weak: Sees only benefits, or does not know how such environments are created.
    followups:
      - A service has twenty dependencies. Do you spin all of them up per pull request?
      - How do you keep environment costs under control?
    common_errors:
      - Forgetting automatic teardown, so abandoned environments run up large bills.

  # ------------------------------------------------------------------ hard
  - external_key: technical.qa.workload_model_realism
    competency_key: test_automation
    topic: Realistic performance workload models
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      A lot of load tests produce reassuring numbers that don't match what happens in production. What makes
      a performance workload realistic, and what mistakes in test design lead to misleading results?
    expected_concepts:
      - mix of journeys and arrival rates from production data
      - open versus closed workload models
      - coordinated omission in latency measurement
      - realistic data volume, cache state and think time
      - warm-up and test duration
      - dependencies and third parties in the path
    rubric:
      excellent: Explains deriving the mix from production telemetry, the difference between open and closed models, coordinated omission, data and cache realism and warm-up, with a concrete example of misleading results they've corrected.
      good: Covers realistic journeys, data volumes and think time.
      weak: Thinks more virtual users is all that matters.
    followups:
      - Why would a closed model underestimate latency when the system slows down?
      - How would you validate that your model matches real traffic?
    common_errors:
      - Hitting the same few records so everything is served from cache.

  - external_key: technical.qa.perf_regression_in_pipeline
    competency_key: ci_cd
    topic: Continuous performance testing
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You want to catch performance regressions on every merge rather than in a big test before release. How
      would you design that so the signal is trustworthy despite noisy shared CI machines?
    expected_concepts:
      - small focused benchmarks or short load tests
      - dedicated or stable runners
      - repeated runs and statistical comparison against a baseline
      - thresholds based on variance rather than fixed numbers
      - trend tracking over time
      - fuller load tests on a schedule
    rubric:
      excellent: Combines short targeted tests on stable hardware with repeated runs, statistical comparison against a rolling baseline and variance-aware thresholds, tracks trends to catch slow drift, and keeps heavier scheduled tests.
      good: Runs a small performance test per merge and compares with a baseline.
      weak: Runs a full load test on shared runners and fails on any slowdown.
    followups:
      - How would you catch a regression that adds two percent per release?
      - What would you do when the gate fails but nobody believes the result?
    common_errors:
      - Fixed thresholds on noisy hardware that flip-flop and get ignored.

  - external_key: technical.qa.test_data_service
    competency_key: test_automation
    topic: Test data management for many teams
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Many teams share integrated test environments, and test data is the main reason tests fail or can't be
      written. How would you design test data management across the organisation?
    expected_concepts:
      - self-service data creation through APIs or a data service
      - versioned seed datasets per environment
      - isolation by tenant, namespace or unique keys
      - masking and privacy controls
      - environment refresh and cleanup policy
      - data for hard-to-reach states
    rubric:
      excellent: Proposes self-service creation APIs, versioned baseline seeds, isolation conventions, privacy controls, refresh and cleanup policies, and support for complex states, with clear ownership.
      good: Suggests a shared data creation approach and isolation rules.
      weak: Proposes a shared spreadsheet of test accounts.
    followups:
      - How would you create data for an account that is three years into a subscription?
      - Who should own this service, and how would teams request new data types?
    common_errors:
      - Relying on long-lived shared records that tests silently mutate.

  - external_key: technical.qa.pii_in_test_envs
    competency_key: security
    topic: Personal data in test environments
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You discover that test environments are refreshed weekly from a raw production copy containing customer
      names, addresses and payment details, and many teams depend on it. How would you deal with this?
    expected_concepts:
      - escalating as a privacy and security risk
      - restricting access immediately
      - masking or tokenising during refresh
      - keeping referential integrity and realistic distributions
      - synthetic data for most needs
      - migration plan that keeps teams unblocked
    rubric:
      excellent: Treats it as an urgent risk with security and privacy owners, contains access quickly, designs an irreversible masking or synthetic pipeline that preserves relationships, and migrates teams in steps with verification that no raw data remains.
      good: Escalates and proposes masking the data before refresh.
      weak: Treats it as acceptable because the environment is internal.
    followups:
      - How would you verify the masking actually removes the risk?
      - A team says masked data breaks their tests. What do you do?
    common_errors:
      - Reversible or inconsistent masking that still allows re-identification.

  - external_key: technical.qa.daily_release_gates
    competency_key: ci_cd
    topic: Gates for daily releases
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A product with a web front end, a backend and mobile apps is moving from monthly releases to deploying
      the backend daily. How would you redesign the quality gates in the pipeline?
    expected_concepts:
      - fast pre-merge checks and contract tests
      - automated post-deploy verification and smoke tests
      - progressive delivery with canaries and automatic rollback
      - backward compatibility with older mobile clients
      - feature flags to separate deploy from release
      - observability and alerting as part of the gate
    rubric:
      excellent: Redesigns gates around speed and risk, adds contract and compatibility tests for mobile clients, uses canaries with automated health checks and rollback, separates deploy from release with flags, and treats monitoring as part of verification.
      good: Shifts tests earlier, automates smoke tests and adds rollback.
      weak: Tries to squeeze the monthly manual regression into each day.
    followups:
      - Which gate would you trust to block a deploy without a human looking?
      - How do you test a backend change against app versions still in the field?
    common_errors:
      - Ignoring that mobile apps lag behind the backend by weeks or months.

  - external_key: technical.qa.monorepo_test_selection
    competency_key: ci_cd
    topic: Test selection at monorepo scale
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      In a large monorepo, running all tests on every change takes hours. How would you design test selection
      so developers get fast feedback without letting regressions through?
    expected_concepts:
      - build graph dependency analysis
      - hermetic builds and cached test results
      - predictive or history-based prioritisation
      - post-merge full runs and bisecting failures
      - measuring missed regressions
      - handling non-code inputs
    rubric:
      excellent: Combines dependency-graph selection with caching, adds history-based prioritisation, keeps post-merge or batched full runs with automatic bisection, and measures how often selection misses failures.
      good: Uses dependency analysis and still runs the full suite after merge.
      weak: Proposes picking tests by folder name or skipping slow tests.
    followups:
      - How would you find which commit broke the build if full runs happen only every hour?
      - What makes test result caching unsafe?
    common_errors:
      - Caching results for tests that are not hermetic, so stale passes hide breakages.
