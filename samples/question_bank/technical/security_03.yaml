# Technical questions: security engineering, part 3 (threat modelling, cloud security posture, identity
# and secrets).
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [security]
questions:
  # ------------------------------------------------------------- easy
  - external_key: technical.security.threat_modelling_intro
    competency_key: security
    topic: Introducing threat modelling
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you explain threat modelling to an engineering team that has never done it, and what does a
      lightweight session look like in practice?
    expected_concepts:
      - what are we building, what can go wrong, what will we do about it, did we do a good job
      - a simple data-flow diagram with trust boundaries
      - a structured prompt such as STRIDE
      - keeping it short and tied to a real design
      - concrete follow-up actions with owners
    rubric:
      excellent: Describes a practical, time-boxed session with a diagram, trust boundaries and a structured way to brainstorm threats, ending in tracked actions.
      good: Knows the main questions and mentions diagrams and STRIDE.
      weak: Describes a long document exercise with no clear outcomes.
    followups:
      - At what point in a project would you run the first session?
    common_errors:
      - Producing a threat list with no prioritisation or owners.

  - external_key: technical.security.image_upload_threats
    competency_key: security
    topic: Threat modelling a small feature
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Picture a simple feature where users upload a picture that gets resized and shown on their public
      page. Walk me through the threats you would consider.
    expected_concepts:
      - malicious files targeting the image processing library
      - SVG or HTML content causing script execution when served
      - oversized or decompression-bomb images exhausting resources
      - EXIF metadata leaking location data
      - storage permissions and who can overwrite another user's file
      - abusive or illegal content and moderation
    rubric:
      excellent: Walks systematically across the data flow from upload to processing to storage to display, covering parser, content, privacy and authorisation threats with mitigations.
      good: Identifies several realistic threats such as malicious files and resource exhaustion.
      weak: Mentions only file size limits.
    followups:
      - Which of these would you fix before launch, and which could wait?
    common_errors:
      - Overlooking metadata embedded in the uploaded images.

  - external_key: technical.security.broad_permission_request
    competency_key: aws
    topic: Right-sizing a broad permission request
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A developer asks for full storage permissions on every bucket in the account because their new feature
      "needs storage access", and they're blocked on a deadline. How do you work out what they actually need
      and get them moving?
    expected_concepts:
      - asking which operations and which buckets or prefixes the feature uses
      - granting specific actions on specific resources to the workload role
      - using access logs or policy generation from a test run to confirm needs
      - temporary broader access in a non-production account if it unblocks work
      - avoiding write or delete permissions the feature does not need
    rubric:
      excellent: Unblocks the developer quickly with a narrowly scoped policy built from the feature's real behaviour, explains the risk of the broad grant in concrete terms, and shows how to verify and tighten afterwards.
      good: Scopes the permission to the relevant bucket and actions and explains why.
      weak: Grants the broad permission to avoid friction, or refuses without offering a path forward.
    followups:
      - How would you make this kind of request self-service without losing control?
    common_errors:
      - Granting permissions to a human user instead of the role the workload runs as.

  - external_key: technical.security.public_bucket_finding
    competency_key: aws
    topic: Publicly exposed object storage
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A scanner flags that one of your storage buckets is publicly readable. What do you check before and
      after you change anything?
    expected_concepts:
      - what data is in the bucket and who owns it
      - whether public access is intentional, for example static assets
      - access logs to see who read objects while it was public
      - blocking public access at bucket and account level
      - serving intended public content through a CDN with restricted origin access
      - assessing whether this is a reportable data exposure
    rubric:
      excellent: Balances quick containment with checking intent, investigates access history to assess exposure, and fixes the class of issue with account-level controls.
      good: Locks the bucket down and checks what was in it.
      weak: Makes it private immediately without checking logs or owner, or ignores the finding as probably intentional.
    followups:
      - What would you do if access logging was never enabled on that bucket?
    common_errors:
      - Closing the finding without determining whether anyone accessed the data.

  - external_key: technical.security.mfa_methods_compared
    competency_key: security
    topic: Comparing MFA methods
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Which forms of multi-factor authentication have you worked with, and how do they compare in terms of
      the attacks they actually stop?
    expected_concepts:
      - SMS codes and SIM-swap or interception risks
      - authenticator app codes being phishable
      - push approvals and fatigue attacks, number matching
      - FIDO2 or WebAuthn as phishing-resistant
      - account recovery as the weakest link
    rubric:
      excellent: Compares methods by attack resistance, explains why origin binding makes FIDO2 phishing-resistant, and points out that recovery flows often undo strong MFA.
      good: Ranks methods sensibly and knows SMS is weakest.
      weak: Treats all MFA as equivalent.
    followups:
      - How would you design account recovery so it doesn't undermine the second factor?
    common_errors:
      - Assuming time-based codes cannot be phished.

  - external_key: technical.security.three_tier_network_controls
    competency_key: networking
    topic: Network access controls for a three-tier app
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you structure network access controls, such as security groups or firewall rules, for a
      typical three-tier application in the cloud?
    expected_concepts:
      - only the load balancer exposed to the internet
      - application tier reachable only from the load balancer
      - database reachable only from the application tier
      - referencing security groups rather than broad address ranges
      - no administrative ports open to the internet, using a bastion or session manager
      - egress restrictions where practical
    rubric:
      excellent: Lays out tier-by-tier rules referencing groups, removes direct administrative exposure, and considers egress and private subnets.
      good: Describes correct ingress between tiers and keeps the database private.
      weak: Opens wide ranges for convenience or leaves SSH open to the internet.
    followups:
      - Why does restricting outbound traffic matter for security?
    common_errors:
      - Ignoring egress entirely.

  - external_key: technical.security.leaver_access_removal
    competency_key: security
    topic: Removing access when someone leaves
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An engineer has left the company and you're asked to make sure they no longer have any access. How do
      you go about it, and what tends to get missed?
    expected_concepts:
      - disabling the identity provider account and revoking active sessions
      - automated deprovisioning through SCIM to connected apps
      - personal access tokens, SSH keys and API keys
      - cloud IAM users or keys created outside SSO
      - shared credentials they knew that need rotation
      - SaaS tools not connected to SSO
    rubric:
      excellent: Covers central deprovisioning plus the long tail of tokens, keys, shared secrets and unmanaged SaaS, and proposes reducing that tail over time.
      good: Disables SSO and revokes keys and tokens.
      weak: Only disables the email account.
    followups:
      - How would you find SaaS tools the engineer used that IT doesn't know about?
    common_errors:
      - Assuming disabling the SSO account immediately ends existing sessions and tokens.

  - external_key: technical.security.cspm_prioritisation
    competency_key: security
    topic: Cloud security posture findings
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What kinds of misconfiguration does a cloud security posture tool usually catch, and how do you decide
      which findings to fix first?
    expected_concepts:
      - public exposure of storage, databases and compute
      - overly permissive IAM and unused credentials
      - missing encryption or audit logging
      - prioritising by internet exposure, data sensitivity and exploitability
      - combinations of findings that form an attack path
    rubric:
      excellent: Names the common categories and prioritises with context such as exposure, data and chained risks rather than raw severity.
      good: Knows typical findings and fixes public exposure first.
      weak: Works through findings in the order the tool lists them.
    followups:
      - How would you stop the same misconfigurations reappearing next month?
    common_errors:
      - Treating every finding as equally urgent.

  # ------------------------------------------------------------- medium
  - external_key: technical.security.refund_api_threat_model
    competency_key: security
    topic: Threat modelling an internal tool
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're asked to threat model a new internal API that lets support staff issue refunds to customers.
      Which threats concern you most, and which controls would you ask for?
    expected_concepts:
      - insider misuse and compromised support accounts
      - role-based authorisation and amount limits
      - approval workflows or separation of duties for large refunds
      - tamper-evident audit logging
      - anomaly detection on refund patterns
      - strong authentication for staff tools
    rubric:
      excellent: Treats insiders and compromised accounts as primary threats, designs layered limits, approvals and auditing, and proposes monitoring that would catch abuse.
      good: Adds authorisation, audit logs and some limits.
      weak: Assumes internal tools are trusted and need little protection.
    followups:
      - How would you detect a support agent slowly issuing small fraudulent refunds?
    common_errors:
      - Applying weaker controls to internal tools than to customer-facing ones.

  - external_key: technical.security.iam_escalation_paths
    competency_key: aws
    topic: IAM privilege escalation
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Which IAM permissions would you treat as effectively equivalent to admin, even though they don't look
      like it, and how would you find them in an account?
    expected_concepts:
      - passing a privileged role to new compute
      - creating or attaching policy versions
      - changing role trust policies
      - updating function code that runs with a privileged role
      - creating access keys or login profiles for other users
      - graph-based tools and access analysers to find escalation paths
    rubric:
      excellent: Names several concrete escalation primitives, explains why they lead to admin, and uses graph or analyser tooling to find them systematically.
      good: Knows PassRole and policy modification as escalation paths.
      weak: Only considers policies with full wildcard permissions as dangerous.
    followups:
      - How would you allow developers to deploy functions without giving them an escalation path?
    common_errors:
      - Reviewing policies one at a time without considering how permissions combine.

  - external_key: technical.security.multi_account_access
    competency_key: aws
    topic: Cross-account access without long-lived keys
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you set up access across many cloud accounts so engineers and pipelines get what they need
      without anyone holding long-lived keys?
    expected_concepts:
      - central identity with SSO and permission sets
      - role assumption with short-lived credentials
      - OIDC federation for CI pipelines
      - external IDs for third-party roles
      - organisation-level guardrails
      - session duration and audit of assumed roles
    rubric:
      excellent: Designs federated human and machine access with short-lived credentials, protects third-party roles from confused deputy attacks, and adds guardrails and auditing.
      good: Uses SSO and role assumption and federates CI.
      weak: Creates IAM users with access keys per account.
    followups:
      - What does an external ID protect against?
    common_errors:
      - Leaving old IAM user keys active after federation is in place.

  - external_key: technical.security.org_guardrails
    competency_key: security
    topic: Organisation-wide cloud guardrails
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're responsible for security across fifty cloud accounts owned by different teams. How would you
      put guardrails in place that teams can't accidentally turn off?
    expected_concepts:
      - organisation policies or service control policies
      - denying the disabling of audit logging and threat detection
      - region and service restrictions
      - preventive versus detective controls
      - standard account provisioning with baselines
      - an exception process that is fast enough to be used
    rubric:
      excellent: Combines preventive policies for non-negotiables with detective controls for the rest, automates account baselines, and designs a workable exception path.
      good: Uses organisation-level policies to protect logging and restrict risky actions.
      weak: Relies on documentation and asking teams to follow it.
    followups:
      - How do you test a deny policy before it breaks fifty teams?
    common_errors:
      - Rolling out deny policies without testing their impact in a sandbox organisational unit.

  - external_key: technical.security.runtime_secret_delivery
    competency_key: security
    topic: Delivering secrets to workloads at runtime
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How should an application running in containers receive its secrets at runtime, and what are the
      trade-offs between environment variables, mounted files and fetching from a secrets service?
    expected_concepts:
      - environment variables leaking through crash dumps, child processes and debug endpoints
      - mounted files on in-memory volumes with tight permissions
      - fetching from a secrets service using workload identity
      - handling rotation without restarts
      - caching and availability if the secrets service is down
    rubric:
      excellent: Compares the options on leakage, rotation and availability, and recommends an approach that fits workload identity and rotation needs.
      good: Prefers files or a secrets service over environment variables and explains why.
      weak: Bakes secrets into the image or does not see any difference between options.
    followups:
      - How would your application pick up a rotated secret without a restart?
    common_errors:
      - Assuming environment variables are invisible to other processes and tooling.

  - external_key: technical.security.shared_db_credentials_migration
    competency_key: security
    topic: Migrating away from shared credentials
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your main database credentials are shared by twelve services and haven't been changed in three years.
      How would you migrate to something better without causing an outage?
    expected_concepts:
      - inventory of every consumer of the credential
      - per-service accounts with least privilege
      - dynamic or short-lived credentials from a secrets service
      - dual credentials to allow overlap during rotation
      - staged rollout and monitoring for authentication failures
      - finally revoking the old shared credential
    rubric:
      excellent: Plans discovery, per-service identities, overlapping rotation and a staged cutover with monitoring, ending with revocation of the shared credential.
      good: Proposes per-service credentials and a rotation plan.
      weak: Rotates the shared password in one step and fixes whatever breaks.
    followups:
      - How would you find consumers that nobody documented?
    common_errors:
      - Forgetting batch jobs and scripts that also use the credential.

  - external_key: technical.security.cloud_audit_logging
    competency_key: security
    topic: Security logging baseline in the cloud
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What security logging would you insist on in a new cloud environment from day one, and how would you
      protect those logs from an attacker?
    expected_concepts:
      - control-plane audit logs in every region and account
      - data access logs for sensitive stores
      - network flow logs and DNS query logs
      - central log archive in a separate account
      - immutability through object lock and restricted deletion
      - alerting when logging is disabled or changed
    rubric:
      excellent: Covers control, data and network planes, centralises logs in an isolated account with immutability, and alerts on tampering.
      good: Enables audit logs centrally and restricts access to them.
      weak: Keeps logs in the same account with default retention.
    followups:
      - Which logs are expensive enough that you'd scope them carefully?
    common_errors:
      - Storing logs where a compromised admin in the same account can delete them.

  - external_key: technical.security.partner_data_sharing
    competency_key: security
    topic: Controlled data sharing with a partner
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A team wants to share an encrypted dataset with a partner company. How would you set that up so you stay
      in control of the access over time?
    expected_concepts:
      - minimising the data shared
      - a dedicated encryption key for the shared data
      - cross-account access scoped to specific roles and resources
      - time-bounded access and the ability to revoke via key policy
      - audit logging of partner access
      - contractual and retention requirements
    rubric:
      excellent: Designs minimal, scoped, revocable access with a dedicated key and auditing, and considers what happens to data the partner already copied.
      good: Uses scoped cross-account access and logging.
      weak: Sends an export with a password shared over email.
    followups:
      - What control do you lose once the partner has downloaded the data?
    common_errors:
      - Reusing the key that protects other internal data.

  - external_key: technical.security.phishing_resistant_rollout
    competency_key: security
    topic: Rolling out phishing-resistant MFA
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      After a phishing incident, leadership wants phishing-resistant MFA for all staff within a quarter. How
      would you plan the rollout?
    expected_concepts:
      - security keys or platform passkeys
      - prioritising administrators and high-risk roles
      - enrolment logistics and backup authenticators
      - secure recovery and help-desk verification processes
      - blocking legacy protocols and weaker fallbacks
      - tracking adoption and exceptions
    rubric:
      excellent: Phases the rollout by risk, plans enrolment and recovery carefully, closes weaker fallback paths, and measures progress.
      good: Prioritises admins and plans enrolment and support.
      weak: Announces a deadline without planning recovery or fallbacks.
    followups:
      - How would you stop attackers from social-engineering the help desk into resetting a key?
    common_errors:
      - Leaving SMS or legacy authentication enabled as a fallback.

  - external_key: technical.security.k8s_rbac_review
    competency_key: security
    topic: Reviewing Kubernetes RBAC
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you review role-based access control in a Kubernetes cluster, and which permissions worry you
      the most?
    expected_concepts:
      - cluster-admin bindings and wildcard rules
      - read access to secrets
      - permission to create pods or exec into them as an escalation path
      - bind, escalate and impersonate verbs
      - default service account tokens mounted automatically
      - tooling to enumerate effective permissions
    rubric:
      excellent: Identifies the indirect escalation paths (pod creation, secrets, bind or impersonate), uses tooling to compute effective access, and proposes tighter defaults.
      good: Looks for cluster-admin and secrets access.
      weak: Only checks who has cluster-admin.
    followups:
      - Why is permission to create pods in a namespace often equivalent to reading its secrets?
    common_errors:
      - Overlooking service accounts while reviewing only human users.

  - external_key: technical.security.data_classification_controls
    competency_key: security
    topic: Data classification driving controls
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you use data classification to decide which security controls a system needs, and how do you
      keep it from turning into a paperwork exercise?
    expected_concepts:
      - a small number of clear classification levels
      - mapping each level to concrete controls such as encryption, access and logging
      - automated discovery and tagging of sensitive data
      - data owners accountable for classification
      - using classification in design reviews and tooling
    rubric:
      excellent: Ties classification directly to enforceable controls and automation, keeps the scheme simple, and builds it into everyday engineering processes.
      good: Defines levels and maps them to controls.
      weak: Describes a spreadsheet of systems with labels and no consequences.
    followups:
      - How would you find sensitive data in systems where nobody classified it?
    common_errors:
      - Creating so many levels that teams cannot apply them consistently.

  # ------------------------------------------------------------- hard
  - external_key: technical.security.scaling_threat_modelling
    competency_key: security
    topic: Scaling threat modelling across an organisation
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you scale threat modelling across an engineering organisation of several hundred developers
      when the security team is only three people?
    expected_concepts:
      - risk-based triage of which designs need deep review
      - self-service templates and question checklists
      - security champions running sessions
      - reusable threat libraries for common patterns
      - secure-by-default platforms reducing what needs review
      - tracking outcomes and quality over time
    rubric:
      excellent: Designs a tiered model where most teams self-serve, security focuses on high-risk work, and paved roads remove common threats, with feedback to measure effectiveness.
      good: Uses champions and templates with some triage.
      weak: Proposes that the security team reviews every design.
    followups:
      - How would you know whether self-service threat models are any good?
    common_errors:
      - Measuring the number of threat models produced rather than issues prevented.

  - external_key: technical.security.federated_admin_session_hijack
    competency_key: incident_response
    topic: Compromised cloud administrator session
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You discover that an attacker has obtained a session token for a cloud administrator's federated login.
      What do you do in the first hour, and how do you make sure they haven't left a foothold behind?
    expected_concepts:
      - disabling the user at the identity provider and revoking active cloud sessions
      - knowing that issued temporary credentials can outlive the identity provider session
      - reviewing audit logs for new users, keys, roles and trust policy changes
      - persistence through functions, scheduled tasks or cross-account trusts
      - organisation-level deny policies as an emergency brake
      - working out how the token was stolen
    rubric:
      excellent: Revokes access at every layer including already-issued credentials, hunts systematically for persistence in audit logs, and addresses the theft vector.
      good: Disables the account, revokes sessions and reviews audit logs.
      weak: Resets the password and considers the incident resolved.
    followups:
      - How would you revoke temporary credentials that were already issued?
      - Which audit events would you search for first?
    common_errors:
      - Assuming a password reset invalidates stolen session tokens.

  - external_key: technical.security.identity_architecture
    competency_key: security
    topic: Enterprise identity architecture
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Design the identity architecture for a company that has employees, contractors and customer-facing
      applications across several cloud providers. Where would you draw the boundaries, and why?
    expected_concepts:
      - separating workforce identity from customer identity
      - federation from one workforce identity provider to each cloud
      - automated lifecycle and provisioning for contractors with expiry
      - conditional access based on device and risk
      - break-glass accounts with strong protection and monitoring
      - just-in-time privileged access
    rubric:
      excellent: Draws clear boundaries between workforce and customer identity, centralises workforce federation, handles contractor lifecycle and privileged access, and plans for identity provider failure.
      good: Uses a central identity provider with federation to clouds and separates customer identity.
      weak: Manages users separately in each cloud and application.
    followups:
      - What happens to your access model if the identity provider has an outage?
    common_errors:
      - Mixing customer accounts into the workforce directory.

  - external_key: technical.security.chained_cloud_attack_path
    competency_key: security
    topic: Breaking a cloud attack path
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      In a cloud assessment you find a web server with an SSRF bug, an instance role that can read the secrets
      store, and among those secrets a CI token with deploy rights. How would you present this, and which
      links in the chain would you break first?
    expected_concepts:
      - presenting the full attack path and business impact rather than separate findings
      - enforcing token-based metadata access to blunt SSRF
      - narrowing the instance role to only the secrets it needs
      - scoping and shortening the CI token
      - fixing the SSRF bug itself
      - detections along the path
    rubric:
      excellent: Communicates the chain as a single critical risk, breaks the cheapest high-leverage links first, and adds detection, explaining the reasoning for the order.
      good: Explains the chain and fixes the SSRF and role permissions.
      weak: Reports three medium findings without connecting them.
    followups:
      - How would you explain the business impact to a non-technical executive?
    common_errors:
      - Fixing only the SSRF bug and leaving the over-privileged role in place.

  - external_key: technical.security.just_in_time_access
    competency_key: security
    topic: Just-in-time privileged access
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you design just-in-time privileged access to production, so engineers can still fix incidents
      quickly but standing admin access goes away?
    expected_concepts:
      - time-bound elevation through a request workflow
      - approval rules, including fast paths for on-call responders
      - break-glass access with alerting
      - session logging or recording
      - integration with chat and paging tools
      - regular review of how elevation is used
    rubric:
      excellent: Balances speed and control with automatic approval paths tied to on-call status, strong auditing, break-glass handling and periodic review of usage.
      good: Designs time-limited elevation with approvals and logging.
      weak: Keeps standing admin access for the on-call team because incidents need speed.
    followups:
      - How would you stop people from requesting maximum duration every time?
    common_errors:
      - Requiring human approval at 3 a.m. with no fallback, which drives people to workarounds.

  - external_key: technical.security.saas_oauth_breach
    competency_key: security
    topic: Third-party SaaS breach with repository access
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A third-party SaaS tool that has OAuth access to your company's code repositories announces it was
      breached. What do you do?
    expected_concepts:
      - revoking the integration's tokens and grants
      - determining what access scopes it held
      - reviewing repository audit logs for clones and unusual activity
      - rotating secrets that may live in those repositories
      - checking for malicious commits or changed workflows
      - tightening third-party integration approval
    rubric:
      excellent: Revokes access quickly, scopes exposure from audit logs, rotates exposed secrets, checks integrity of code and pipelines, and improves third-party governance.
      good: Revokes access and reviews what was exposed.
      weak: Waits for the vendor to report what happened.
    followups:
      - How would you decide which secrets in the repositories to rotate first?
    common_errors:
      - Ignoring the possibility of code or pipeline tampering, not just data theft.
