# Curated questions: Database engineer / DBA (part 4 of 4).
# Capacity, partitioning, sharding, configuration, monitoring and upgrades.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [dba]
questions:
  # ----------------------------------------------------- capacity and operations
  - external_key: technical.dba.partitioning_purpose
    competency_key: database_administration
    topic: What table partitioning is for
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What problems does table partitioning actually solve, and which kinds of partitioning, such as range,
      list or hash, have you used and for what?
    expected_concepts:
      - easier retention by dropping or detaching old partitions
      - partition pruning for queries on the partition key
      - smaller indexes and maintenance per partition
      - range for time series, list for categories, hash for spreading load
      - partitioning is not a general speed-up for every query
    rubric:
      excellent: Ties partitioning to concrete problems such as retention and maintenance, matches each strategy to a real use, and is clear that queries not filtering on the key can get slower.
      good: Explains range partitioning for time-based data and pruning.
      weak: Thinks partitioning automatically makes all queries faster.
    followups:
      - What kind of query would get slower after partitioning?
    common_errors:
      - Partitioning a table by a column that most queries never filter on.

  - external_key: technical.dba.disk_usage_jump
    competency_key: database_administration
    topic: Sudden disk usage growth
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Disk usage on the database server jumps from seventy to ninety-two percent overnight. How do you find
      what's using the space, and how do you buy yourself time safely?
    expected_concepts:
      - check data files, logs, temp files and backups separately
      - retained write-ahead or binary logs from a stuck consumer or archive failure
      - large temp files from a runaway query
      - table or index growth from a bulk load or bloat
      - safe short-term actions such as expanding the volume rather than deleting logs by hand
    rubric:
      excellent: Breaks usage down by category, checks the common culprits such as stuck log retention and temp files, buys time by expanding storage or fixing the consumer, and never deletes database logs manually.
      good: Finds the largest directories or tables and identifies the cause.
      weak: Deletes log files from the data directory to free space.
    followups:
      - What happens if the disk fills completely on the primary?
    common_errors:
      - Removing transaction log files by hand and corrupting the database.

  - external_key: technical.dba.first_dashboard_metrics
    competency_key: observability
    topic: Core database metrics
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you set up monitoring for a production database, what are the first metrics you put on the
      dashboard, and why those?
    expected_concepts:
      - query throughput and latency
      - connections in use versus the limit
      - CPU, memory, disk I/O latency and free space
      - replication lag
      - lock waits, deadlocks and long transactions
      - cache hit ratio and checkpoint activity
    rubric:
      excellent: Picks metrics that cover load, saturation, errors and replication, explains what each would reveal, and separates paging signals from diagnostic ones.
      good: Lists sensible resource and replication metrics.
      weak: Lists only CPU and memory.
    followups:
      - Which of these would you actually page someone on?
    common_errors:
      - Watching averages only and missing latency spikes in the tail.

  - external_key: technical.dba.storage_growth_estimate
    competency_key: database_administration
    topic: Estimating storage needs for next year
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your manager asks how much storage the main database will need a year from now. How would you work out
      an answer you can stand behind?
    expected_concepts:
      - historical growth trend from monitoring
      - growth per table, including indexes and logs
      - planned business changes and new features
      - retention policies and purges
      - headroom for maintenance, backups and spikes
    rubric:
      excellent: Builds the estimate from measured per-table growth, adjusts for known business plans and retention, adds headroom for operations, and states assumptions and a review date.
      good: Uses past growth to project forward with some headroom.
      weak: Guesses or doubles the current size without data.
    followups:
      - What would make your estimate wrong, and how would you notice early?
    common_errors:
      - Forgetting that index rebuilds and online schema changes temporarily need extra space.

  - external_key: technical.dba.memory_settings_first
    competency_key: database_administration
    topic: Initial memory configuration
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      On a new database server, which memory settings do you look at first, and how do you decide how much
      memory to give the buffer cache?
    expected_concepts:
      - buffer pool or shared buffers size
      - per-operation and per-connection memory
      - leaving room for the operating system and file cache
      - number of connections multiplying per-session memory
      - validating with cache hit ratio and I/O metrics
    rubric:
      excellent: Explains how the engine's cache interacts with the OS cache, budgets memory across shared and per-session use, and validates with real metrics after the change.
      good: Names the main cache setting and a reasonable starting proportion.
      weak: Gives all memory to the database cache or never changes defaults.
    followups:
      - How could the server run out of memory even with a modest buffer cache?
    common_errors:
      - Ignoring how per-session memory multiplies with many connections.

  - external_key: technical.dba.slow_query_logging_setup
    competency_key: observability
    topic: Setting up slow query logging
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've inherited a database with no query monitoring at all. How would you set up slow query logging
      so it's useful without drowning you in noise or slowing the server?
    expected_concepts:
      - sensible duration threshold and adjusting it over time
      - sampling for high-volume workloads
      - aggregation by normalised query fingerprint
      - log volume and disk impact
      - capturing plans for the worst offenders
    rubric:
      excellent: Starts with a reasoned threshold, uses sampling and fingerprint aggregation, watches log volume, and turns the output into a ranked list for action.
      good: Enables slow query logging with a threshold and reviews it.
      weak: Logs every statement permanently on a busy server.
    followups:
      - How would you pick the threshold for an OLTP system?
    common_errors:
      - Logging all statements and filling the disk.

  - external_key: technical.dba.weekly_maintenance_routine
    competency_key: database_administration
    topic: Routine operational checks
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What does your regular routine look like for keeping a production database in good shape week to week?
      Which checks and maintenance tasks do you run, and which ones have you automated?
    expected_concepts:
      - backup success and periodic restore checks
      - statistics, cleanup and index maintenance status
      - storage growth and capacity trends
      - replication status and lag
      - security patches and minor version updates
      - reviewing slow query and error trends
    rubric:
      excellent: Describes a structured routine covering backups, replication, maintenance, capacity and patching, and explains which tasks are automated with alerts and which still need human review.
      good: Lists backups, monitoring and some maintenance tasks.
      weak: Only reacts when something breaks.
    followups:
      - Which of these checks has caught a real problem for you?
    common_errors:
      - Never checking whether automated maintenance jobs are actually succeeding.

  # --------------------------------------------- partitioning and scaling
  - external_key: technical.dba.events_partition_retention
    competency_key: database_administration
    topic: Partitioning a high-volume events table
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An events table grows by about fifty million rows a day, and you only need to keep ninety days. How
      would you design partitioning and retention for it?
    expected_concepts:
      - range partitioning by event time
      - choosing daily or weekly partitions by size and count
      - dropping or detaching old partitions instead of deleting
      - creating future partitions ahead of time
      - indexes and primary keys that include the partition key
    rubric:
      excellent: Picks a partition interval from data size and planner overhead, automates creation and dropping, explains why dropping beats deleting, and handles keys and indexes on partitioned tables.
      good: Uses time-based partitions and drops old ones.
      weak: Keeps one table and runs a nightly delete.
    followups:
      - What happens if no partition exists for incoming data?
    common_errors:
      - Forgetting to pre-create partitions, so inserts fail at midnight.

  - external_key: technical.dba.partition_pruning_failures
    competency_key: database_administration
    topic: When partition pruning fails
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What is partition pruning, and what kinds of queries or mistakes stop it from happening?
    expected_concepts:
      - planner skips partitions that cannot match the filter
      - plan-time versus run-time pruning
      - functions or casts on the partition key
      - filters on other columns only
      - joins where the key value is not known in advance
    rubric:
      excellent: Explains pruning at plan and run time, gives concrete examples that defeat it such as wrapping the key in a function or mismatched types, and shows how to confirm pruning in a plan.
      good: Explains pruning and that queries must filter on the partition key.
      weak: Cannot explain how the database decides which partitions to read.
    followups:
      - How would you confirm from a plan that pruning happened?
    common_errors:
      - Filtering on a date cast of a timestamp key and scanning every partition.

  - external_key: technical.dba.convert_to_partitioned
    competency_key: database_administration
    topic: Converting a large table to partitioned
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You have a two-terabyte unpartitioned table in production that really should be partitioned. How would
      you convert it with minimal downtime?
    expected_concepts:
      - new partitioned table alongside the old one
      - attaching the existing table as an old partition where supported
      - copying data in batches or via logical replication
      - capturing ongoing writes during the copy
      - short cut-over with rename and verification
    rubric:
      excellent: Presents a staged migration such as attaching the old table as a historical partition or copying while capturing changes, with a brief verified cut-over and rollback option.
      good: Creates a new partitioned table and migrates data in batches.
      weak: Proposes a single offline copy without considering downtime.
    followups:
      - How would you keep new writes from being lost during the copy?
    common_errors:
      - Validating a constraint on the attached partition in a way that holds a long lock.

  - external_key: technical.dba.hot_shard_rebalance
    competency_key: distributed_systems
    topic: Rebalancing a hot shard
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      One shard in your cluster is running much hotter than the others. How would you work out why, and how
      would you rebalance without downtime?
    expected_concepts:
      - identify hot keys or tenants causing the skew
      - splitting or moving key ranges or tenants
      - online data movement with change capture
      - updating routing metadata atomically
      - choosing finer-grained or more even keys going forward
    rubric:
      excellent: Measures load per key or tenant, moves or splits the hot portion online with change capture and an atomic routing switch, and addresses the key design that caused the skew.
      good: Identifies the hot tenant and moves it to another shard.
      weak: Adds more shards without understanding why one is hot.
    followups:
      - What if the hot spot is a single key that can't be split?
    common_errors:
      - Rebalancing data while the routing layer still points at the old location.

  - external_key: technical.dba.resource_bottleneck_diagnosis
    competency_key: database_administration
    topic: Identifying the limiting resource
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you tell whether a database is limited by storage I/O, CPU, memory or locking, and which numbers
      convince you?
    expected_concepts:
      - wait event or wait statistics analysis
      - disk latency and queue depth versus throughput
      - CPU saturation and run queue
      - cache hit ratio and memory pressure
      - lock wait time
    rubric:
      excellent: Uses wait analysis as the primary lens, backs it up with specific OS and engine metrics for each resource, and explains how they corroborate each other.
      good: Checks CPU, disk and memory metrics and looks at waits.
      weak: Looks only at CPU percentage.
    followups:
      - How can high CPU actually be a symptom of an I/O problem or vice versa?
    common_errors:
      - Reading high disk utilisation as the cause without checking latency.

  - external_key: technical.dba.periodic_write_spikes
    competency_key: database_administration
    topic: Periodic write latency spikes
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Every few minutes write latency spikes and then recovers. You suspect checkpoints or log flushing. How
      would you confirm that, and how would you smooth it out?
    expected_concepts:
      - correlate spikes with checkpoint or flush logs and metrics
      - checkpoint frequency and completion target
      - log size and dirty page limits
      - storage throughput and fsync latency
      - placing logs on faster or separate storage
    rubric:
      excellent: Correlates spikes with checkpoint activity, tunes frequency and spreading of writes, checks storage limits, and verifies the change flattens latency.
      good: Suspects checkpoints and adjusts their settings.
      weak: Increases memory without confirming the cause.
    followups:
      - What is the trade-off of making checkpoints less frequent?
    common_errors:
      - Spacing out checkpoints without considering longer crash recovery time.

  - external_key: technical.dba.major_upgrade_methods
    competency_key: database_administration
    topic: Major version upgrade approaches
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What approaches have you used for a major database version upgrade, and how do you choose between an
      in-place upgrade, dump and restore, and a replication-based switchover?
    expected_concepts:
      - in-place upgrade tools and their downtime
      - dump and restore for small databases or platform changes
      - logical replication to a new version with a short cut-over
      - extension, driver and application compatibility testing
      - rollback plan and post-upgrade statistics refresh
    rubric:
      excellent: Compares downtime, risk and rollback for each method, ties the choice to database size and downtime tolerance, and covers compatibility tests and post-upgrade steps.
      good: Describes at least two methods and when to use them.
      weak: Has only upgraded in place without a rollback plan.
    followups:
      - How would you roll back if a problem surfaces a day after the upgrade?
    common_errors:
      - Not testing application queries against the new version's planner before cut-over.

  - external_key: technical.dba.launch_traffic_prep
    competency_key: database_administration
    topic: Preparing for a traffic surge
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Traffic is expected to triple for a product launch in six weeks. How would you prepare the database?
    expected_concepts:
      - load testing with a realistic workload
      - finding the first bottleneck and its headroom
      - tuning top queries and indexes
      - scaling options such as larger instances, replicas or caching
      - connection pool limits and runbooks for launch day
    rubric:
      excellent: Builds a realistic load test, identifies the first limits with numbers, prioritises query and capacity fixes, and prepares monitoring and runbooks for launch day.
      good: Plans load testing and scaling with some query tuning.
      weak: Just buys a bigger server without testing.
    followups:
      - How would you make your load test resemble real production traffic?
    common_errors:
      - Load testing with uniform synthetic queries that miss real hot spots.

  - external_key: technical.dba.alert_paging_design
    competency_key: observability
    topic: Designing database alerts
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you design database alerts so that someone is paged only when action is needed? Give me
      examples you'd page on and examples you'd only show on a dashboard.
    expected_concepts:
      - alert on symptoms and imminent failures
      - paging alerts for replication broken, disk nearly full, backups failing
      - dashboard-only signals such as cache ratio changes
      - thresholds with duration and trend-based alerts
      - runbooks linked to every page
    rubric:
      excellent: Separates paging from informational signals with clear examples, uses durations and forecasts to reduce noise, and links each page to a runbook.
      good: Gives reasonable paging alerts and avoids alerting on every metric.
      weak: Pages on every CPU spike or has no alerting strategy.
    followups:
      - How would you alert on disk space so you get warned days ahead instead of minutes?
    common_errors:
      - Paging on transient spikes without a duration condition.

  - external_key: technical.dba.least_privilege_roles
    competency_key: database_administration
    topic: Roles and least privilege
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you set up database roles and permissions so that applications, analysts and administrators
      each get only what they need?
    expected_concepts:
      - separate roles per application and purpose
      - read-only roles for analysts, ideally on replicas
      - no superuser access for applications
      - default privileges for new objects
      - auditing and periodic access review
    rubric:
      excellent: Designs role groups per purpose, keeps application accounts away from DDL and superuser rights, handles default privileges, and audits and reviews access regularly.
      good: Separates application and read-only roles.
      weak: Gives everyone the same administrative account.
    followups:
      - How would you handle a migration tool that needs DDL rights the application shouldn't have?
    common_errors:
      - Forgetting default privileges so new tables are not covered by the role design.

  - external_key: technical.dba.analytics_on_oltp
    competency_key: database_administration
    topic: Heavy analytics on the production database
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Analysts are running heavy reports directly on the production transactional database and slowing the
      application down. What would you propose?
    expected_concepts:
      - dedicated read replica for reporting
      - resource limits or workload management
      - change data capture into a warehouse
      - summary tables for common reports
      - agreeing data freshness requirements with analysts
    rubric:
      excellent: Proposes a short-term isolation step and a longer-term path such as a warehouse fed by change data capture, weighing freshness, cost and effort with the analysts.
      good: Suggests a read replica for reporting.
      weak: Blocks analyst access without offering an alternative.
    followups:
      - What problems can long reports cause even on a replica?
    common_errors:
      - Pointing analysts at the failover replica, which then lags behind.

  - external_key: technical.dba.live_shard_migration
    competency_key: distributed_systems
    topic: Migrating a single database to shards
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The team has decided to move from one large database to sharding by tenant. How would you migrate live
      data onto the shards without downtime and with a way back if things go wrong?
    expected_concepts:
      - routing layer or directory mapping tenants to shards
      - moving tenants in waves starting with small ones
      - copy plus change capture per tenant
      - brief per-tenant write freeze and routing switch
      - verification and reverse replication for rollback
      - cross-tenant queries and global tables
    rubric:
      excellent: Plans tenant-by-tenant moves with change capture, verification and a short write freeze per tenant, keeps a reverse path for rollback, and addresses global data and cross-shard queries.
      good: Moves tenants gradually using a routing table and data copy.
      weak: Proposes a one-time big-bang migration over a weekend.
    followups:
      - How would you handle data that every tenant shares?
    common_errors:
      - Having no rollback path once a tenant's writes land on the new shard.

  - external_key: technical.dba.partitioned_table_limits
    competency_key: database_administration
    topic: Limitations of partitioned tables
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      What limitations have you run into with partitioned tables, such as unique constraints, global indexes,
      foreign keys or planning time with many partitions, and how did you work around them?
    expected_concepts:
      - unique constraints must include the partition key in many engines
      - no true global indexes in some engines
      - foreign keys to or from partitioned tables
      - planning and locking overhead with thousands of partitions
      - workarounds such as lookup tables or application checks
    rubric:
      excellent: Describes real limitations from experience with a specific engine, explains their cause and gives practical workarounds and their costs, including partition count trade-offs.
      good: Names the unique constraint limitation and the overhead of many partitions.
      weak: Unaware of any limitations of partitioned tables.
    followups:
      - How would you enforce uniqueness on a column that isn't the partition key?
    common_errors:
      - Creating thousands of tiny partitions that slow planning for every query.

  - external_key: technical.dba.short_window_major_upgrade
    competency_key: database_administration
    topic: Major upgrade with a five-minute window
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You need to do a major-version upgrade of a ten-terabyte database, and the business will only accept
      about five minutes of downtime. Walk me through your plan.
    expected_concepts:
      - build the new version as a logical replica or use an in-place link mode on a copy
      - handling sequences, DDL freeze and large objects
      - rehearsal with timing on a production copy
      - performance validation of the new version under replayed traffic
      - cut-over steps with connection draining and verification
      - rollback by reverse replication
    rubric:
      excellent: Chooses a replication-based or link-based approach with clear reasoning, rehearses with timings, validates performance, scripts a short cut-over, and keeps a reverse replication path for rollback.
      good: Uses logical replication to a new cluster and a planned cut-over.
      weak: Plans a dump and restore or an untested in-place upgrade.
    followups:
      - What would you freeze during the replication period, and how would you enforce it?
    common_errors:
      - Forgetting that sequences are not replicated logically and must be synced at cut-over.

  - external_key: technical.dba.linux_storage_tuning
    competency_key: linux
    topic: Operating system tuning for databases
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Which operating system and storage settings matter for database performance on Linux, and how have you
      verified that a change actually helped?
    expected_concepts:
      - swappiness and avoiding swapping the buffer cache
      - transparent huge pages and huge pages
      - filesystem choice and mount options
      - I/O scheduler and device queue settings
      - dirty page writeback settings
      - benchmarking before and after with realistic load
    rubric:
      excellent: Names specific settings with the reason each matters for a database, describes measuring their effect with benchmarks or production metrics, and is careful about changing several at once.
      good: Names a few relevant settings such as swappiness and huge pages.
      weak: Cannot name operating system settings that matter or changes them without measuring.
    followups:
      - Why do many databases recommend disabling transparent huge pages?
    common_errors:
      - Copying tuning guides wholesale without measuring the effect on their own workload.

  - external_key: technical.dba.noisy_tenant_isolation
    competency_key: database_administration
    topic: Noisy tenants on a shared database
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      On a shared multi-tenant database, one tenant's workload regularly degrades performance for everyone
      else. How would you isolate it in the short term and in the long term?
    expected_concepts:
      - attribute load to the tenant through query tags or statistics
      - rate limiting or query timeouts per tenant
      - resource governance features in the engine
      - moving the tenant to its own database or shard
      - pricing or product limits agreed with the business
    rubric:
      excellent: Proves the attribution with data, applies fast limits such as timeouts or rate limits, plans durable isolation such as a dedicated shard, and involves the business on limits.
      good: Identifies the tenant and moves or throttles it.
      weak: Scales up the whole database to absorb one tenant's load.
    followups:
      - How would you attribute database load to tenants if queries don't carry a tenant tag?
    common_errors:
      - Throttling without first proving which tenant causes the load.

  - external_key: technical.dba.capacity_model
    competency_key: database_administration
    topic: Building a database capacity model
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you build a capacity model for a database cluster that connects business growth to CPU,
      storage, IOPS and connections, and how do you keep that model honest over time?
    expected_concepts:
      - business drivers such as orders or active users
      - measured resource cost per unit of business activity
      - peak versus average and seasonal patterns
      - saturation thresholds and lead time for scaling
      - comparing forecasts to actuals and recalibrating
    rubric:
      excellent: Links business drivers to measured per-unit resource costs, models peaks and lead times, defines thresholds that trigger action, and regularly compares forecast to actual to recalibrate.
      good: Projects resource use from growth trends and sets thresholds.
      weak: Extrapolates one metric without linking it to business drivers.
    followups:
      - How would a new feature with different query patterns break your model?
    common_errors:
      - Modelling only averages so peak load surprises the team.

  - external_key: technical.dba.peak_cpu_saturation
    competency_key: incident_response
    topic: Database CPU saturation during peak
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The main database hits a hundred percent CPU during peak hours, latency spikes across the product, and
      the cause isn't obvious. Walk me through your first thirty minutes.
    expected_concepts:
      - confirm impact and communicate status
      - live activity and top queries by CPU right now
      - recent changes such as deploys, plan changes or traffic patterns
      - mitigations such as killing runaway queries, disabling a feature or shedding load
      - preserving evidence for the root cause
    rubric:
      excellent: Runs a structured triage that pairs fast mitigation with evidence gathering, checks recent changes, coordinates with the incident lead and records data needed for the root cause.
      good: Finds the expensive queries and takes action to reduce load.
      weak: Restarts the database or scales up blindly without looking at activity.
    followups:
      - When would you choose to fail over during an incident like this, and when would that make things worse?
    common_errors:
      - Restarting the database and losing the evidence of what caused the spike.
