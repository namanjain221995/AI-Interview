# Technical: ML engineering (2/4) - model serving, latency and compute efficiency.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [ml]
questions:
  # ------------------------------------------------------------- serving patterns
  - external_key: technical.ml_engineering.batch_or_online_inference
    competency_key: mlops
    topic: Batch versus online inference
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide whether a model should serve predictions in real time or precompute them in batch?
      Give me an example of each from your own work.
    expected_concepts:
      - whether inputs are known ahead of time
      - latency and freshness requirements
      - cost of keeping a service running versus scheduled jobs
      - number of entities to score
      - hybrid approaches with precomputed candidates and online re-scoring
    rubric:
      excellent: Uses clear criteria such as input availability, freshness, entity count and cost, gives a real example of each, and mentions hybrid designs.
      good: Explains the basic trade-off with at least one concrete example.
      weak: Defaults to real-time serving for everything without considering cost or need.
    followups:
      - What breaks when a batch-scored prediction is used a day later?
    common_errors:
      - Ignoring that batch scoring cannot handle entities that did not exist at scoring time.

  - external_key: technical.ml_engineering.p99_budget_overrun
    competency_key: mlops
    topic: Bringing a model endpoint within its latency budget
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your recommendation endpoint has a p99 latency budget of 100 milliseconds and it's currently sitting at
      250. How would you break down where the time goes and bring it down?
    expected_concepts:
      - distributed tracing per request stage
      - feature fetch, preprocessing, inference and postprocessing timings
      - parallelising independent feature lookups
      - model optimisation such as quantisation or a smaller model
      - reducing candidate counts or precomputing parts
      - tail causes such as cold caches and garbage collection
    rubric:
      excellent: Instruments each stage with tracing, finds the dominant contributors at the tail rather than the mean, and proposes targeted fixes across features, model and system with a way to verify each.
      good: Breaks latency into stages and suggests reasonable optimisations for the slowest one.
      weak: Jumps to bigger hardware or a different model without measuring where time goes.
    followups:
      - Why might fixing the average latency not fix the p99?
      - Which part would you be willing to trade accuracy for, and how would you measure the cost?
    common_errors:
      - Optimising model inference when most of the time is spent fetching features.

  - external_key: technical.ml_engineering.dynamic_batching_tuning
    competency_key: mlops
    topic: Dynamic batching for GPU inference
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Explain how server-side dynamic batching works for GPU inference, and how you'd tune it for a service
      that is sensitive to latency.
    expected_concepts:
      - grouping concurrent requests into one forward pass
      - maximum batch size and maximum queue delay
      - throughput gains versus added wait time
      - padding cost for variable-length inputs
      - load testing at realistic concurrency
    rubric:
      excellent: Explains the queue-and-flush mechanism, tunes maximum delay and batch size against the latency budget using load tests, and addresses padding or bucketing for variable inputs.
      good: Understands batching trades a small delay for throughput and names the main settings.
      weak: Thinks batching always reduces latency, or cannot describe how requests are grouped.
    followups:
      - What happens to latency at very low traffic with a long queue delay?
    common_errors:
      - Setting a large maximum delay that dominates latency when traffic is light.

  - external_key: technical.ml_engineering.quantization_quality_check
    competency_key: machine_learning
    topic: Quantising a model for inference
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Tell me about your experience quantising a model for inference. How did you check that you hadn't lost
      too much quality?
    expected_concepts:
      - post-training versus quantisation-aware training
      - INT8 or lower-bit weights and activations
      - calibration data for activation ranges
      - comparing task metrics and per-slice results with the full model
      - measuring the actual speed and memory gain on target hardware
    rubric:
      excellent: Describes a concrete quantisation with the method and calibration used, compares quality overall and on slices, and measures real latency and memory gains on the target hardware.
      good: Has quantised a model and compared its accuracy with the original.
      weak: Assumes quantisation is free or has only read about it.
    followups:
      - Which layers would you keep in higher precision, and why?
    common_errors:
      - Reporting speedups from model size alone without benchmarking on the deployment hardware.

  - external_key: technical.ml_engineering.distillation_setup
    competency_key: machine_learning
    topic: Knowledge distillation for serving
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      When would you use knowledge distillation to get a smaller serving model, rather than just quantising
      or pruning the large one, and how would you set up the distillation run?
    expected_concepts:
      - when the size reduction needed is beyond what compression gives
      - teacher soft targets and temperature
      - choosing the student architecture for the target latency
      - unlabelled or synthetic transfer data
      - comparing student, teacher and a student trained from scratch
    rubric:
      excellent: Justifies distillation by the size gap and latency target, designs the loss with soft targets and temperature, chooses transfer data and student architecture, and evaluates against both teacher and a from-scratch baseline.
      good: Understands training a small model on the large model's outputs and when it helps.
      weak: Confuses distillation with quantisation or cannot describe the training setup.
    followups:
      - Where would you get enough transfer data if labelled data is scarce?
    common_errors:
      - Not comparing against a student trained directly on labels, so the benefit is unproven.

  - external_key: technical.ml_engineering.serving_stack_choice
    competency_key: mlops
    topic: Choosing a model serving stack
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What have you used to serve models in production, whether a plain web service wrapping the model or a
      dedicated model server, and what drove that choice?
    expected_concepts:
      - simple web framework wrapping a model
      - dedicated servers with batching and multi-model support
      - hardware and framework support
      - operational features such as metrics and versioning
      - team familiarity and maintenance cost
    rubric:
      excellent: Describes the stack actually used with the reasons, names what a dedicated server adds such as batching, model versioning and metrics, and knows when a simple service is enough.
      good: Has served models with a named tool and can explain basic reasons for the choice.
      weak: Has never deployed a model or cannot say why a tool was chosen.
    followups:
      - What would make you switch from your current approach?
    common_errors:
      - Loading the model on every request instead of once at startup.

  - external_key: technical.ml_engineering.slow_replica_startup
    competency_key: mlops
    topic: Cold starts when autoscaling large models
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your model service autoscales with traffic, but a new replica takes three minutes to load a large model,
      so latency spikes during every surge. What would you do about it?
    expected_concepts:
      - faster model loading from local or cached storage
      - pre-baked images or node-level model caches
      - readiness probes that wait for warm-up
      - scaling earlier on leading signals or schedules
      - keeping headroom or warm standby replicas
    rubric:
      excellent: Attacks both load time and scaling policy, such as caching weights near nodes and warm-up before readiness, plus predictive or earlier scaling with some headroom, and quantifies the cost of idle capacity.
      good: Suggests keeping spare replicas and speeding up model loading.
      weak: Only suggests a larger minimum replica count without considering cost or load time.
    followups:
      - How would you decide the right amount of headroom?
    common_errors:
      - Marking replicas ready before the model is loaded and warmed, sending traffic to cold instances.

  - external_key: technical.ml_engineering.cpu_or_gpu_inference
    competency_key: cloud_cost_optimization
    topic: CPU or GPU for inference
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide whether to run inference for a particular model on CPUs or GPUs?
    expected_concepts:
      - model size and compute per request
      - traffic volume and ability to batch
      - latency requirement
      - cost per thousand predictions on each option
      - benchmarking on realistic inputs
    rubric:
      excellent: Benchmarks both options on realistic traffic, compares cost per prediction at the required latency, and explains how model size and batching change the answer.
      good: Gives sensible criteria such as model size, traffic and latency.
      weak: Assumes GPUs are always better for any model.
    followups:
      - Which kinds of models usually run well on CPUs?
    common_errors:
      - Comparing hourly instance prices instead of cost per prediction.

  - external_key: technical.ml_engineering.many_small_models
    competency_key: system_design
    topic: Serving many small, low-traffic models
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're running hundreds of small per-customer models, each with low and spiky traffic. How would you
      serve them without paying for a dedicated replica for each one?
    expected_concepts:
      - multi-model servers loading models on demand
      - caching models in memory with eviction
      - routing requests to replicas that already hold the model
      - shared base model with per-customer adapters or parameters
      - isolation and noisy-neighbour limits
      - cold load latency for rarely used models
    rubric:
      excellent: Designs on-demand loading with caching and affinity routing, considers a shared base with small per-customer parts, handles cold loads and isolation, and estimates memory and cost.
      good: Proposes multi-model serving with lazy loading and some eviction.
      weak: Deploys one service per model or merges everything into one model without considering trade-offs.
    followups:
      - How would you keep one heavy customer from starving the others?
      - What would you do about the first request to a model that isn't loaded?
    common_errors:
      - Ignoring the latency of loading a cold model on the first request.

  - external_key: technical.ml_engineering.request_validation
    competency_key: mlops
    topic: Validating requests to a model endpoint
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What checks do you put on incoming requests to a model endpoint before they reach the model, and why do
      they matter?
    expected_concepts:
      - schema and type validation
      - range and allowed-value checks
      - handling missing fields consistently with training
      - size limits on payloads
      - logging and counting rejected or defaulted inputs
    rubric:
      excellent: Validates schema, ranges and sizes, handles missing values the same way as training, and logs rejections so silent garbage is visible in monitoring.
      good: Validates schema and types and returns clear errors.
      weak: Passes requests straight to the model and trusts callers.
    followups:
      - When should you reject a request versus fill in a default?
    common_errors:
      - Silently defaulting bad inputs so the model returns plausible but wrong predictions.

  - external_key: technical.ml_engineering.caching_predictions
    competency_key: system_design
    topic: Caching predictions and embeddings
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When does it make sense to cache model predictions or embeddings, and what makes caching harder for ML
      outputs than for ordinary data?
    expected_concepts:
      - repeated inputs and expensive computation
      - cache key including model version and feature values
      - invalidation when the model or features change
      - staleness tolerance of predictions
      - hit rate measurement and memory cost
    rubric:
      excellent: Identifies when inputs repeat enough to benefit, builds keys that include model version and relevant features, plans invalidation on model or feature changes, and measures hit rate against staleness.
      good: Knows where caching helps and that model updates need invalidation.
      weak: Caches by user id alone and ignores model versions or changing features.
    followups:
      - How would you roll out a new model version when half the cache was written by the old one?
    common_errors:
      - Leaving the model version out of the cache key, so old predictions survive a deployment.

  - external_key: technical.ml_engineering.missing_feature_fallback
    competency_key: mlops
    topic: Degrading gracefully when features are missing
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your ranking model depends on a feature service that sometimes times out. How should the prediction
      service behave when some features are missing or late?
    expected_concepts:
      - strict timeouts per feature fetch
      - fallback values the model saw during training
      - simpler fallback model or heuristic
      - tracking the rate of degraded predictions
      - circuit breakers to protect the dependency
    rubric:
      excellent: Sets timeouts and defines fallbacks consistent with training, such as trained-on missing values or a simpler model, protects the dependency with circuit breaking, and monitors degraded-prediction rates.
      good: Uses timeouts and default values or a fallback model.
      weak: Lets the whole request fail or block until the feature service answers.
    followups:
      - How would you make sure the model handles missing values sensibly?
    common_errors:
      - Filling missing features with values the model never saw in training.

  - external_key: technical.ml_engineering.optimized_runtime_export
    competency_key: mlops
    topic: Exporting to an optimised inference runtime
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're asked to cut inference latency by exporting a PyTorch model to an optimised runtime such as ONNX
      Runtime or TensorRT. How would you go about it, and how would you make sure the outputs still match?
    expected_concepts:
      - export with dynamic shapes as needed
      - unsupported operators and custom ops
      - numerical comparison with tolerances on a test set
      - precision settings such as FP16 or INT8
      - benchmarking latency on target hardware
      - keeping preprocessing identical
    rubric:
      excellent: Plans export with shape handling, deals with unsupported operators, compares outputs numerically and on task metrics, benchmarks on the target hardware and keeps preprocessing identical.
      good: Exports the model and compares outputs and latency with the original.
      weak: Exports and deploys without verifying outputs.
    followups:
      - What tolerance would you accept between the two outputs, and how would you choose it?
    common_errors:
      - Exporting with fixed input shapes, then failing on real variable-length inputs.

  - external_key: technical.ml_engineering.idle_inference_gpus
    competency_key: cloud_cost_optimization
    topic: Underused inference GPUs
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your inference GPUs average fifteen percent utilisation, but you can't remove replicas without missing
      latency targets. What options would you explore?
    expected_concepts:
      - dynamic batching to raise work per pass
      - running several models or replicas per GPU
      - smaller GPU types or partitioned GPUs
      - model optimisation to cut per-request compute
      - autoscaling on queue depth or latency
      - understanding why peak and average differ
    rubric:
      excellent: Explains why low average utilisation coexists with latency limits, then combines batching, co-locating models, smaller or partitioned GPUs and better autoscaling, with a way to measure cost per prediction.
      good: Suggests batching and packing more models per GPU.
      weak: Removes replicas and accepts missed targets, or says nothing can be done.
    followups:
      - What risks come with putting two models on one GPU?
    common_errors:
      - Treating utilisation as the goal rather than cost at the required latency.

  - external_key: technical.ml_engineering.endpoint_load_testing
    competency_key: testing
    topic: Load testing a model endpoint
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you load test a model serving endpoint before launch, and which numbers do you pay attention to?
    expected_concepts:
      - realistic request payloads and mixes
      - latency percentiles, not only averages
      - throughput at the latency limit
      - resource usage such as GPU, CPU and memory
      - ramp-up and sustained load phases
    rubric:
      excellent: Uses realistic payloads and traffic shapes, reports latency percentiles and saturation throughput, watches resource usage, and tests ramp and sustained load.
      good: Runs a load test and reports percentiles and throughput.
      weak: Sends repeated identical requests and reports average latency only.
    followups:
      - Why could identical repeated requests give misleading results?
    common_errors:
      - Load testing with one cached input so results look far better than production.

  - external_key: technical.ml_engineering.latency_spikes_python_service
    competency_key: debugging
    topic: Intermittent latency spikes in a model service
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A Python model service shows occasional latency spikes of a couple of seconds that don't line up with
      traffic changes. How would you hunt down the cause?
    expected_concepts:
      - correlating spikes with traces and host metrics
      - garbage collection pauses
      - thread pool or worker exhaustion and the GIL
      - lazy initialisation or recompilation on new input shapes
      - noisy neighbours and CPU throttling
      - sampling profilers in production
    rubric:
      excellent: Gathers evidence with tracing and sampling profiles, forms concrete hypotheses such as garbage collection, worker starvation, shape-triggered recompilation or CPU throttling, and tests each one.
      good: Names several plausible causes and suggests profiling.
      weak: Adds replicas or retries without investigating.
    followups:
      - How would you confirm CPU throttling from container limits?
      - What would you look for if spikes follow requests with unusual input sizes?
    common_errors:
      - Looking only at average latency graphs where the spikes disappear.

  - external_key: technical.ml_engineering.ann_index_freshness
    competency_key: system_design
    topic: Keeping a vector index fresh
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      In a two-stage recommender that retrieves candidates from an approximate nearest-neighbour index, how
      do you keep the index fresh as items and embeddings change without hurting serving latency?
    expected_concepts:
      - incremental inserts and deletes versus periodic rebuilds
      - building a new index offline and swapping atomically
      - query and item embeddings from the same model version
      - recall measurement against exact search
      - filtering removed or unavailable items
    rubric:
      excellent: Combines incremental updates with periodic full rebuilds and atomic swaps, keeps query and item embedding versions aligned, filters deleted items, and tracks recall against exact search.
      good: Rebuilds the index periodically and swaps it in, with some handling of new items.
      weak: Rebuilds in place while serving, or ignores embedding version mismatches.
    followups:
      - What happens if you update the embedding model but not the index?
    common_errors:
      - Mixing embeddings from two model versions in the same index.

  - external_key: technical.ml_engineering.training_bill_doubled
    competency_key: cloud_cost_optimization
    topic: Reducing training compute spend
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team's monthly GPU bill for training doubled in one quarter. How would you work out where the money
      is going and bring it down without slowing the team's work too much?
    expected_concepts:
      - attributing cost by team, project and job
      - finding idle or forgotten resources
      - spot or preemptible capacity with checkpointing
      - early stopping of unpromising runs
      - right-sizing instances and improving utilisation
      - budgets and visibility for teams
    rubric:
      excellent: Attributes spend to jobs and teams first, then targets idle resources, wasteful experiments, spot capacity and utilisation, and adds budgets and dashboards so the savings last.
      good: Finds idle resources and suggests spot instances and better scheduling.
      weak: Proposes cutting experiments across the board without data.
    followups:
      - How would you make cost visible to the people launching jobs?
    common_errors:
      - Cutting compute before knowing which jobs actually drive the cost.

  - external_key: technical.ml_engineering.gpu_sharing_methods
    competency_key: mlops
    topic: Sharing one GPU between inference models
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you share a single GPU between several small inference models, and what are the trade-offs
      between hardware partitioning such as MIG, time slicing, and running the models in one process?
    expected_concepts:
      - hardware partitions with memory and fault isolation
      - time slicing with no memory isolation
      - single process with several models and shared streams
      - interference on latency between models
      - memory budgeting per model
    rubric:
      excellent: Compares isolation, latency interference, memory limits and operational complexity of each approach, and picks one for a stated workload with a plan to measure interference.
      good: Knows the approaches exist and that isolation differs between them.
      weak: Assumes models can share a GPU freely without any memory or latency impact.
    followups:
      - What failure would hit every model at once in the single-process approach?
    common_errors:
      - Ignoring that one model's memory growth can crash its neighbours when there is no isolation.

  - external_key: technical.ml_engineering.on_device_model
    competency_key: machine_learning
    topic: Moving a model onto devices
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your product team wants the model to run offline on customers' phones instead of in your servers. How
      would that change the way you train, compress and update it?
    expected_concepts:
      - size, memory and battery constraints
      - quantisation and smaller architectures
      - device runtime and operator support
      - shipping updates through app releases or downloads
      - monitoring with limited telemetry
      - testing across device types
    rubric:
      excellent: Covers hardware constraints, compression, runtime support, update delivery, device-level testing and how to monitor quality with limited data back from devices.
      good: Mentions shrinking the model and how updates would be delivered.
      weak: Treats it as copying the server model to the phone.
    followups:
      - How would you know the model is underperforming on some devices?
    common_errors:
      - Forgetting that older app versions keep running old models for a long time.

  - external_key: technical.ml_engineering.nightly_scoring_window
    competency_key: data_engineering
    topic: Speeding up a large nightly scoring job
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You score 500 million records every night, and the batch job keeps creeping past its time window. How
      would you speed it up?
    expected_concepts:
      - profiling read, feature, inference and write stages
      - parallelising across partitions
      - batching inference and using vectorised or accelerated runtimes
      - scoring only changed records
      - efficient columnar input and output formats
    rubric:
      excellent: Profiles stage by stage, parallelises the bottleneck, batches inference, reduces work by scoring only changed records, and fixes slow I/O formats, with expected gains.
      good: Proposes parallelism and batching after identifying the slow stage.
      weak: Adds machines without knowing which stage is slow.
    followups:
      - How would you make the job resumable if it fails at 80 percent?
    common_errors:
      - Calling the model one record at a time inside a loop.

  - external_key: technical.ml_engineering.prediction_api_versioning
    competency_key: api_design
    topic: Versioning a model's prediction API
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you version a model's prediction API so that you can change features or output formats without
      breaking the services that call it?
    expected_concepts:
      - separating API version from model version
      - backward-compatible additive changes
      - versioned endpoints or schema negotiation
      - returning model version in responses
      - deprecation timelines for callers
    rubric:
      excellent: Separates API contract from model version, prefers additive changes, versions breaking changes explicitly, returns model version for traceability and manages deprecation with callers.
      good: Versions the endpoint and keeps old versions running during migration.
      weak: Changes the response format in place and expects callers to adapt.
    followups:
      - A new model's scores are on a different scale. Is that a breaking change?
    common_errors:
      - Treating a change in score distribution as non-breaking when callers use fixed thresholds.

  - external_key: technical.ml_engineering.throughput_latency_tradeoff
    competency_key: mlops
    topic: Throughput versus latency in serving
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Explain the trade-off between throughput and latency in model serving, using an example where you had to
      favour one over the other.
    expected_concepts:
      - batching raises throughput but adds wait time
      - concurrency and queueing effects near saturation
      - offline jobs favour throughput
      - interactive requests favour latency
      - cost per prediction
    rubric:
      excellent: Explains the mechanism behind the trade-off, including batching and queueing near saturation, and gives a concrete example with the choice made and why.
      good: Explains the trade-off correctly with a reasonable example.
      weak: Treats throughput and latency as the same thing.
    followups:
      - What happens to latency as you push utilisation toward one hundred percent?
    common_errors:
      - Assuming more replicas always reduce latency even when the model itself is slow.

  - external_key: technical.ml_engineering.inference_profiling
    competency_key: debugging
    topic: Profiling a slow inference path
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Walk me through how you'd profile a slow PyTorch inference path, from the request handler all the way
      down to the GPU kernels.
    expected_concepts:
      - request-level tracing to isolate the model call
      - framework profiler for operator and kernel time
      - host to device transfer and synchronisation points
      - preprocessing on the CPU
      - kernel launch overhead and small operations
      - graph compilation or fusion to reduce overhead
    rubric:
      excellent: Narrows from request tracing to operator and kernel profiles, accounts for asynchronous execution when timing, finds transfers, synchronisation and launch overhead, and proposes compilation or fusion where it helps.
      good: Uses a profiler to find slow operators and checks data transfers.
      weak: Times code with wall-clock prints without accounting for asynchronous GPU execution.
    followups:
      - Why can timing GPU code with ordinary timers give misleading numbers?
    common_errors:
      - Measuring GPU work without synchronising, so time is attributed to the wrong line.

  - external_key: technical.ml_engineering.feature_lookup_latency
    competency_key: mlops
    topic: Slow online feature lookups
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Most of your prediction latency turns out to come from fetching features from the online store. What
      could you change to reduce it?
    expected_concepts:
      - batching lookups into fewer round trips
      - fetching independent features in parallel
      - co-locating the store with the service
      - precomputing and denormalising features per entity
      - local caching of slow-changing features
    rubric:
      excellent: Proposes several concrete changes such as batched and parallel lookups, denormalised per-entity records, co-location and caching, and explains how each is measured.
      good: Suggests batching or parallelising lookups and caching.
      weak: Suggests a faster model, which does not address the problem.
    followups:
      - Which features would be safe to cache in the service, and for how long?
    common_errors:
      - Fetching each feature in a separate sequential call.
