# Curated questions: Database engineer / DBA (part 2 of 4).
# Replication, failover, backups and point-in-time recovery.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [dba]
questions:
  # ----------------------------------------------------------------- replication
  - external_key: technical.dba.physical_vs_logical_replication
    competency_key: database_administration
    topic: Physical versus logical replication
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What's the difference between physical and logical replication, and when would you pick one over the
      other?
    expected_concepts:
      - physical replication ships block-level or log changes for an identical copy
      - logical replication ships row changes per table
      - physical replicas need the same major version and platform
      - logical replication allows selective tables, upgrades and different schemas
      - logical replication gaps such as DDL or sequences
    rubric:
      excellent: Explains both mechanisms, matches physical to high availability and identical standbys and logical to upgrades, migrations and selective sharing, and names logical replication's gaps.
      good: Describes the basic difference and gives one use case for each.
      weak: Cannot explain how they differ beyond naming them.
    followups:
      - Which would you use to move data into a newer major version with little downtime?
    common_errors:
      - Assuming logical replication carries schema changes automatically.

  - external_key: technical.dba.sync_vs_async_replication
    competency_key: database_administration
    topic: Synchronous versus asynchronous replication
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do synchronous and asynchronous replication trade off data loss against write latency, and which
      have you run in production and why?
    expected_concepts:
      - synchronous commits wait for a replica acknowledgement
      - asynchronous commits may lose recent transactions on failover
      - added latency from network round trips
      - availability risk if the synchronous replica is down
      - quorum or semi-synchronous options
    rubric:
      excellent: Explains the commit path for each mode, quantifies the latency and data-loss trade-off, covers what happens when the synchronous standby fails, and justifies the mode chosen for a real system.
      good: Correctly explains the data loss versus latency trade-off.
      weak: Believes replicas always have every committed transaction.
    followups:
      - What happens to writes if your only synchronous replica goes down?
    common_errors:
      - Running a single synchronous replica and causing write outages when it fails.

  - external_key: technical.dba.replica_lag_alert
    competency_key: database_administration
    topic: Responding to replica lag
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You get an alert that a read replica is thirty minutes behind the primary. What do you check first,
      and what would you do about the traffic it's serving?
    expected_concepts:
      - whether lag is in receiving or in applying changes
      - long-running queries on the replica blocking apply
      - large transactions or bulk jobs on the primary
      - replica resources such as I/O and CPU
      - removing the lagging replica from read traffic
    rubric:
      excellent: Separates network or receive lag from apply lag, checks for big primary transactions and conflicting replica queries, and takes the replica out of rotation while stale reads would hurt users.
      good: Checks replication status and looks for heavy load on either side.
      weak: Restarts replication immediately without understanding the cause.
    followups:
      - How would you tell receive lag from replay lag?
    common_errors:
      - Leaving a far-behind replica serving reads that users expect to be current.

  - external_key: technical.dba.full_incremental_differential
    competency_key: database_administration
    topic: Full, differential and incremental backups
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Walk me through how full, differential and incremental backups differ, and how your choice affects
      how long a restore takes.
    expected_concepts:
      - full backup copies everything
      - differential copies changes since the last full
      - incremental copies changes since the last backup of any type
      - restore needs the full plus one differential or a chain of incrementals
      - storage cost versus restore time and chain fragility
    rubric:
      excellent: Defines each precisely, explains the restore chain for each with its time and failure risk, and describes a schedule that balances storage and recovery time.
      good: Defines all three correctly.
      weak: Confuses differential and incremental backups.
    followups:
      - What happens to your restore if one incremental in the chain is corrupt?
    common_errors:
      - Ignoring that a long incremental chain makes restores slow and fragile.

  - external_key: technical.dba.logical_dump_vs_physical_backup
    competency_key: database_administration
    topic: Logical dumps versus physical backups
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When would you take a logical dump instead of a physical backup, and where does each approach start to
      struggle on a large database?
    expected_concepts:
      - logical dumps are portable across versions and platforms
      - logical restores are slow because indexes must be rebuilt
      - physical backups are fast to restore and support point-in-time recovery
      - physical backups are tied to version and platform
      - restoring a single table is easier from a logical dump
    rubric:
      excellent: Compares portability, speed, granularity and point-in-time support, gives clear use cases for each, and explains why multi-terabyte logical restores are impractical.
      good: Knows logical dumps are portable but slow and physical backups are faster.
      weak: Treats a nightly dump as sufficient for any size of database.
    followups:
      - How would you restore one table from a physical backup?
    common_errors:
      - Relying only on logical dumps for a multi-terabyte database.

  - external_key: technical.dba.rpo_rto_design
    competency_key: database_administration
    topic: RPO and RTO in practice
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you explain RPO and RTO to a product owner, and how do those two numbers shape the backup and
      replication setup you'd choose?
    expected_concepts:
      - RPO is the acceptable data loss window
      - RTO is the acceptable time to restore service
      - replication and log archiving reduce RPO
      - standbys and automation reduce RTO
      - cost grows as targets tighten
    rubric:
      excellent: Explains both in plain business terms, maps each target to specific mechanisms, and discusses the cost of tighter targets and how they would be verified by testing.
      good: Defines both correctly and links them to backups and replicas.
      weak: Mixes up the two or cannot connect them to technical choices.
    followups:
      - How would you prove to the business that you can meet the RTO?
    common_errors:
      - Promising targets that have never been measured in a restore test.

  - external_key: technical.dba.restore_testing_program
    competency_key: database_administration
    topic: Setting up regular restore testing
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your team takes nightly backups, but nobody has restored one in over a year. How would you set up
      restore testing so the team can actually trust those backups?
    expected_concepts:
      - automated scheduled restores to a separate environment
      - validating data with row counts, checksums or application checks
      - measuring restore duration against the RTO
      - testing point-in-time recovery, not only full restores
      - alerting when a restore test fails
    rubric:
      excellent: Proposes automated recurring restores with data validation and timing, covers point-in-time recovery, and makes failures visible through alerts or reports.
      good: Suggests periodic test restores into a separate environment.
      weak: Checks only that backup jobs report success.
    followups:
      - What would you check after a restore to call it successful?
    common_errors:
      - Treating a successful backup job as proof that a restore will work.

  # ------------------------------------------------- recovery and failover
  - external_key: technical.dba.pitr_dropped_table
    competency_key: database_administration
    topic: Point-in-time recovery of a dropped table
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Someone accidentally dropped an important table on the primary at five past two this afternoon. Walk
      me through recovering it with point-in-time recovery while keeping everything else running.
    expected_concepts:
      - restore a base backup to a separate instance
      - replay logs to just before the drop
      - finding the exact transaction or timestamp of the drop
      - copying the table back into production
      - reconciling rows written after the drop
    rubric:
      excellent: Restores to a separate instance, replays to a precise stop point found from logs, copies the table back without rolling back the whole database, and plans how to reconcile later writes.
      good: Restores to a point before the drop on a separate server and copies the table back.
      weak: Restores the entire production database to the earlier point and loses all other changes.
    followups:
      - How would you find the exact moment the drop happened?
      - What if a delayed replica were available?
    common_errors:
      - Overwriting production with the restored copy and losing hours of unrelated writes.

  - external_key: technical.dba.log_archiving_chain
    competency_key: database_administration
    topic: Log archiving for point-in-time recovery
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How does archiving the write-ahead log or binary log make point-in-time recovery possible, and what
      can quietly break that chain?
    expected_concepts:
      - base backup plus continuous log archive
      - replaying logs up to a target time or transaction
      - gaps from failed archive commands or missing files
      - logs removed before archiving or retention too short
      - monitoring archive success and lag
    rubric:
      excellent: Explains the base backup plus replay model, lists realistic ways the chain breaks, and describes monitoring and verification that would catch a gap before it is needed.
      good: Explains replaying archived logs onto a base backup.
      weak: Thinks a nightly backup alone allows recovery to any point in time.
    followups:
      - How would you detect a missing log segment before you need it?
    common_errors:
      - Not alerting on failed archive attempts until disk fills or a restore fails.

  - external_key: technical.dba.primary_host_failover
    competency_key: database_administration
    topic: Failing over after primary loss
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      The primary database host has just died. Walk me through the failover, whether manual or automated,
      and what you'd verify before declaring the service back to normal.
    expected_concepts:
      - confirm the primary is really down and fence it
      - choose the most up-to-date replica
      - promote and redirect application connections
      - repoint remaining replicas to the new primary
      - verify writes, replication and backups on the new primary
    rubric:
      excellent: Confirms and fences the old primary, picks the most current replica, promotes and redirects traffic, rebuilds the replication topology and restarts backups, and checks for lost transactions.
      good: Promotes a replica and updates connections, then checks the application works.
      weak: Promotes any replica without checking lag or making sure the old primary cannot come back.
    followups:
      - How do you know which replica has the most data?
      - What do you do about backups and archiving right after the promotion?
    common_errors:
      - Forgetting to resume backups and log archiving on the new primary.

  - external_key: technical.dba.split_brain_prevention
    competency_key: distributed_systems
    topic: Split brain, fencing and quorum
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What is split brain in a replicated database cluster, and how do fencing and quorum keep it from
      happening?
    expected_concepts:
      - two nodes both accepting writes as primary
      - divergent data that is hard to reconcile
      - quorum or consensus store deciding the leader
      - fencing by power, network or storage isolation
      - leader leases and timeouts
    rubric:
      excellent: Describes how split brain arises from partitions, explains quorum-based leader election and concrete fencing methods, and describes the data repair problem if it does happen.
      good: Defines split brain and knows quorum and fencing are used to prevent it.
      weak: Unaware of split brain or believes a heartbeat alone prevents it.
    followups:
      - Why is a two-node cluster without a witness risky?
    common_errors:
      - Running two nodes with no third vote or witness.

  - external_key: technical.dba.read_after_write_on_replicas
    competency_key: database_administration
    topic: Stale reads from replicas
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Users complain that right after saving their profile, the page still shows the old values. Reads go to
      replicas. How would you solve this without sending everything back to the primary?
    expected_concepts:
      - replication lag causing stale reads
      - read-your-writes by routing a user's reads to the primary for a short window
      - waiting for the replica to reach a known log position
      - session or token-based consistency
      - monitoring lag to bound staleness
    rubric:
      excellent: Diagnoses replica lag, proposes targeted read-your-writes such as sticky primary reads after a write or waiting on a log position, and bounds the impact on primary load.
      good: Suggests sending reads after writes to the primary.
      weak: Moves all reads to the primary or suggests caching without addressing lag.
    followups:
      - How would you implement waiting for a replica to catch up to a specific write?
    common_errors:
      - Fixing staleness by routing all traffic back to the primary.

  - external_key: technical.dba.retained_log_disk_risk
    competency_key: database_administration
    topic: Replication slots and retained logs
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What risks come with replication slots, or any setup where the primary retains logs until a consumer
      reads them, and how do you guard against them?
    expected_concepts:
      - inactive or slow consumers make the primary keep logs
      - disk filling up on the primary
      - retained old row versions blocking cleanup
      - limits on retained log size
      - monitoring slot lag and dropping abandoned slots
    rubric:
      excellent: Explains how an abandoned consumer causes unbounded log retention and blocked cleanup, sets size limits and alerts, and has a procedure for dropping or recreating slots.
      good: Knows an inactive slot can fill the disk and monitors it.
      weak: Unaware that replication consumers can cause log build-up on the primary.
    followups:
      - What happens to the downstream consumer if you drop its slot?
    common_errors:
      - Leaving a slot from a decommissioned replica or CDC tool in place for weeks.

  - external_key: technical.dba.replica_drift_rebuild
    competency_key: database_administration
    topic: Detecting drift and rebuilding replicas
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You suspect a replica has quietly drifted from the primary and is returning slightly different data.
      How would you confirm that, and how would you rebuild it with the least impact on the primary?
    expected_concepts:
      - checksum or row comparison tools across primary and replica
      - causes such as writes on the replica or skipped errors
      - making replicas read-only
      - rebuilding from a backup and catching up from logs
      - throttling the rebuild to protect the primary
    rubric:
      excellent: Confirms drift with a chunked checksum comparison, identifies how it happened, rebuilds from a backup rather than copying from the primary under load, and enforces read-only replicas.
      good: Compares data and rebuilds the replica from a fresh copy.
      weak: Skips replication errors to make the alert go away.
    followups:
      - How can a replica end up with different data in the first place?
    common_errors:
      - Skipping replication errors without understanding the data they leave behind.

  - external_key: technical.dba.backup_retention_protection
    competency_key: database_administration
    topic: Backup retention, encryption and protection
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you design backup storage and retention, including encryption, off-site copies, and protection
      against someone deleting or encrypting the backups along with production?
    expected_concepts:
      - retention tiers for recent, monthly and yearly needs
      - encryption at rest with managed keys
      - off-site or cross-account copies
      - immutable or write-once storage
      - separate credentials so production access cannot delete backups
      - key availability during a restore
    rubric:
      excellent: Defines retention from recovery and compliance needs, uses encryption with key management that survives a disaster, keeps immutable off-site copies with separated credentials, and tests restores from them.
      good: Mentions encryption, off-site copies and a retention schedule.
      weak: Keeps backups on the same server or account with the same credentials as production.
    followups:
      - What happens if the encryption key is lost along with the primary site?
    common_errors:
      - Storing backups where a compromised production credential can delete them.

  - external_key: technical.dba.backup_window_overrun
    competency_key: database_administration
    topic: Backups overrunning into business hours
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your eight-terabyte database's nightly backup now runs into business hours and slows production down.
      What options would you consider?
    expected_concepts:
      - taking backups from a replica
      - incremental or block-level backups
      - storage snapshots
      - compression and parallelism trade-offs
      - throttling backup I/O
      - checking restore time, not only backup time
    rubric:
      excellent: Moves load off the primary, switches to incremental or snapshot-based methods, tunes parallelism and throttling, and checks that the new approach still meets restore time targets.
      good: Suggests taking backups from a replica or using incremental backups.
      weak: Simply reduces backup frequency or proposes skipping backups.
    followups:
      - What must be true for a storage snapshot to be a consistent database backup?
    common_errors:
      - Speeding up backups in a way that makes restores much slower.

  - external_key: technical.dba.delayed_replica_use
    competency_key: database_administration
    topic: Delayed replicas
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What is a delayed replica good for, and how does it compare with relying on point-in-time recovery
      from backups?
    expected_concepts:
      - replica applies changes after a fixed delay
      - fast recovery from human errors within the delay window
      - pausing replay before the bad change
      - no protection beyond the delay or for slow-noticed errors
      - point-in-time recovery covers longer windows but restores more slowly
    rubric:
      excellent: Explains how a delayed replica works, how to pause and extract data before the bad change, its blind spots, and how it complements rather than replaces point-in-time recovery.
      good: Understands it protects against recent mistakes within the delay.
      weak: Thinks a delayed replica replaces backups.
    followups:
      - How would you choose the length of the delay?
    common_errors:
      - Using a delayed replica as the failover target for high availability.

  - external_key: technical.dba.reintegrating_old_primary
    competency_key: database_administration
    topic: Reintegrating the old primary after failover
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      After a failover, the old primary comes back online. How do you bring it back into the cluster safely,
      and what would you check before failing back to it?
    expected_concepts:
      - it may hold transactions never replicated
      - rewinding or rebuilding it as a replica
      - preventing it from accepting writes on startup
      - comparing log positions to find divergence
      - planned, low-risk failback only if needed
    rubric:
      excellent: Keeps the old primary from taking writes, finds any divergent transactions, rewinds or rebuilds it as a replica, and treats failback as a planned switchover with checks.
      good: Rejoins it as a replica after resynchronising.
      weak: Starts it up and lets it rejoin as primary or as a replica without checking divergence.
    followups:
      - What would you do with transactions that exist only on the old primary?
    common_errors:
      - Rejoining a diverged old primary as a replica without rewind or rebuild.

  - external_key: technical.dba.app_reconnect_after_failover
    competency_key: database_administration
    topic: Routing applications to the new primary
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do applications find the new primary after a failover, and what have you seen go wrong with DNS,
      proxies or connection strings at that moment?
    expected_concepts:
      - virtual IPs, DNS records, proxies or service discovery
      - DNS caching and TTLs delaying the switch
      - connection pools holding stale connections
      - multi-host connection strings with target role
      - application retry behaviour on failed writes
    rubric:
      excellent: Compares routing mechanisms, explains real failure modes such as cached DNS and pools stuck on the old node, and describes retries and health checks that make the switch fast and safe.
      good: Knows a common routing mechanism and that clients must reconnect.
      weak: Assumes applications reconnect correctly on their own.
    followups:
      - How would you test that clients reconnect within your RTO?
    common_errors:
      - Ignoring client-side DNS caching that keeps traffic on the dead node.

  - external_key: technical.dba.region_loss_dr
    competency_key: database_administration
    topic: Cross-region disaster recovery design
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A payments database has to survive the loss of an entire region with under a minute of data loss and
      under fifteen minutes of downtime. How would you design that, and how would you prove it works?
    expected_concepts:
      - cross-region replica with lag monitoring against the RPO
      - latency cost of synchronous cross-region commits
      - promotion runbook or automation and traffic redirection
      - dependencies such as secrets, DNS and application tier in the second region
      - regular region failover drills
      - backups stored in a third location
    rubric:
      excellent: Chooses replication mode from the latency and RPO trade-off, covers promotion, traffic and dependency readiness, and proves the design through scheduled drills with measured RPO and RTO.
      good: Proposes a cross-region replica and a failover plan.
      weak: Relies on backups copied to another region without considering the RTO.
    followups:
      - How do you keep the standby region from silently rotting between drills?
    common_errors:
      - Never running a real regional failover, so hidden dependencies surface during an outage.

  - external_key: technical.dba.automated_failover_tuning
    competency_key: database_administration
    topic: Automated failover risks and tuning
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      What makes automated failover risky, and how do you tune it to avoid both flapping and slow failovers?
      Use a tool you've worked with, such as Patroni, Orchestrator or an availability group, as your example.
    expected_concepts:
      - false positives from network blips or long pauses
      - timeouts and health check thresholds
      - maximum lag allowed for promotion candidates
      - preventing repeated failovers in a short window
      - consensus store or witness as a dependency
    rubric:
      excellent: Explains the detection versus false positive trade-off with real thresholds from a named tool, covers lag limits for candidates, anti-flapping safeguards and the dependency on the consensus layer.
      good: Describes how their tool detects failure and decides on promotion.
      weak: Treats automated failover as risk-free or has never configured one.
    followups:
      - What happens to your cluster if the consensus store itself is unavailable?
    common_errors:
      - Setting detection timeouts so low that a garbage collection pause triggers a failover.

  - external_key: technical.dba.page_corruption_on_primary
    competency_key: database_administration
    topic: Responding to data corruption
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Queries on the primary start failing with checksum or page corruption errors on one table, while the
      replicas look fine. Walk me through what you'd do.
    expected_concepts:
      - assess scope with integrity checks
      - check storage and hardware logs
      - fail over to a healthy physical replica if corruption is local
      - restore affected pages or table from backup when needed
      - avoid repair options that discard data without understanding them
      - preserve evidence before repair
    rubric:
      excellent: Contains the problem quickly, determines whether corruption is local to the primary's storage, uses a healthy replica or backup to recover, avoids data-discarding repairs, and investigates the hardware cause.
      good: Runs integrity checks and considers failing over to a replica.
      weak: Runs a data-discarding repair immediately or ignores the error.
    followups:
      - Why might a logical replica not be the right source to recover from here?
    common_errors:
      - Running a repair that silently drops corrupt rows before taking a copy.

  - external_key: technical.dba.logical_replication_conflicts
    competency_key: database_administration
    topic: Logical and bidirectional replication conflicts
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      When you run logical replication, especially bidirectional or multi-writer, how do conflicts arise,
      and how do you handle sequences, schema changes and conflict resolution?
    expected_concepts:
      - concurrent updates of the same row on both sides
      - unique key and primary key collisions
      - sequence offsets or globally unique identifiers
      - schema changes applied in a coordinated order
      - conflict resolution rules such as last writer wins and their data-loss risk
      - avoiding conflicts by partitioning writes
    rubric:
      excellent: Explains the main conflict types, designs to avoid them by partitioning ownership of writes, handles sequences and DDL ordering, and is clear about what automatic resolution loses.
      good: Knows conflicts happen on concurrent writes and that sequences need special handling.
      weak: Assumes multi-writer replication keeps data consistent automatically.
    followups:
      - How would you roll out a new column when both sides accept writes?
    common_errors:
      - Relying on last-writer-wins for data where losing an update is unacceptable.

  - external_key: technical.dba.lost_confirmed_writes
    competency_key: incident_response
    topic: Lost writes after an asynchronous failover
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After an unplanned failover with asynchronous replication, the business reports that some orders
      customers saw as confirmed are missing. How do you investigate, recover what you can, and change the
      setup afterwards?
    expected_concepts:
      - transactions committed on the old primary but not replicated
      - extracting the missing transactions from the old primary's data or logs
      - reconciling against downstream systems such as payment providers
      - communicating scope to the business
      - moving to synchronous or quorum commit for critical writes
    rubric:
      excellent: Explains the replication gap, recovers missing transactions from the old primary or logs, reconciles with external systems, communicates scope, and changes commit settings or failover rules to bound future loss.
      good: Identifies async lag as the cause and tries to recover data from the old primary.
      weak: Cannot explain how confirmed writes were lost or only suggests restoring a backup.
    followups:
      - How would you decide which records to replay without creating duplicates?
    common_errors:
      - Rebuilding the old primary before extracting its unreplicated transactions.

  - external_key: technical.dba.multi_database_consistent_backup
    competency_key: database_administration
    topic: Consistent backups across databases or shards
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you take backups that can be restored to a consistent point when related data spans several
      databases or shards?
    expected_concepts:
      - independent backups land at different moments
      - restore points or markers written to every node
      - point-in-time recovery to a common timestamp or marker
      - clock skew and in-flight distributed transactions
      - application-level reconciliation
    rubric:
      excellent: Explains why independent backups are inconsistent, uses coordinated restore markers or a common recovery target, accounts for in-flight cross-node transactions and clock skew, and validates with reconciliation checks.
      good: Recognises the consistency problem and suggests restoring all nodes to the same time.
      weak: Assumes nightly backups of each node are consistent with each other.
    followups:
      - How would you verify cross-shard consistency after a restore?
    common_errors:
      - Restoring each shard to the same wall-clock time while ignoring clock skew.
