# Frontend core (3/4): accessibility (WCAG) and web performance (Core Web Vitals).
# Round types follow difficulty: easy -> screening/combined, medium -> all three,
# hard -> deep technical/combined.
version: 1
defaults:
  role_tags: [frontend]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.frontend_core.headings_landmarks
    competency_key: accessibility
    topic: Headings, landmarks and page structure
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do screen-reader users typically move around a web page, and how does that shape the way you
      structure headings and landmark regions in your markup?
    expected_concepts:
      - navigating by headings, landmarks and links lists
      - one logical heading outline without skipped levels for styling
      - landmark elements such as header, nav, main and footer
      - labelling repeated landmarks such as two navigation regions
      - visual styling separated from heading level
    rubric:
      excellent: Describes how assistive technology users scan by headings and landmarks, builds a logical outline independent of font size, and labels repeated regions.
      good: Uses semantic landmarks and sensible heading levels.
      weak: Picks heading levels by visual size or builds pages entirely from generic divs.
    followups:
      - How would you check a page's heading outline quickly?
      - What would you do if the design wants a small heading that is logically a level two?
    common_errors:
      - Choosing heading levels for their default font size.

  - external_key: technical.frontend_core.keyboard_navigation
    competency_key: accessibility
    topic: Keyboard access, focus order and tabindex
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you make sure everything in an interface works with a keyboard alone? Tell me how you think about
      focus order, visible focus and the tabindex attribute.
    expected_concepts:
      - native interactive elements are focusable and operable by default
      - focus order follows DOM order
      - visible focus indicators and focus-visible
      - tabindex zero and minus one, and avoiding positive values
      - skip links and avoiding keyboard traps
    rubric:
      excellent: Relies on native elements, keeps DOM order aligned with visual order, keeps focus visible, uses tabindex correctly with reasons and tests by actually tabbing through flows.
      good: Knows to use buttons and links and keep focus visible.
      weak: Removes focus outlines for aesthetics or uses positive tabindex values to fix order.
    followups:
      - Why are positive tabindex values a problem?
      - What's a keyboard trap, and where have you seen one?
    common_errors:
      - Removing the focus outline globally without a replacement.

  - external_key: technical.frontend_core.contrast_and_colour_cues
    competency_key: accessibility
    topic: Colour contrast and not relying on colour alone
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A designer hands you a dashboard where status is shown only by red and green dots and the secondary
      text is a pale grey on white. What concerns would you raise, and what would you suggest instead?
    expected_concepts:
      - WCAG contrast ratios for normal and large text
      - contrast for icons, borders and focus indicators
      - colour must not be the only way to convey information
      - adding text labels, icons or patterns
      - checking with contrast tools and colour-vision simulators
    rubric:
      excellent: Cites the relevant contrast requirements, explains the colour-only problem for people with colour-vision deficiencies, proposes concrete alternatives and keeps the conversation with the designer collaborative.
      good: Raises contrast and colour-only issues with a fix for each.
      weak: Sees it purely as a visual preference.
    followups:
      - Which tools would you use to check contrast during development?
      - How would you handle a brand colour that fails contrast?
    common_errors:
      - Checking text contrast but ignoring icons and form field borders.

  - external_key: technical.frontend_core.alt_text_choices
    competency_key: accessibility
    topic: Text alternatives for images and icons
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide what alternative text an image should have? Walk me through how you'd treat a product
      photo, a decorative background flourish and an icon-only button.
    expected_concepts:
      - alt text describes the purpose of the image in context
      - empty alt for decorative images
      - functional images and icon buttons need an accessible name for the action
      - avoiding phrases like image of
      - complex images such as charts need a longer description
    rubric:
      excellent: Adjusts the alternative to context and purpose, uses empty alt for decoration, names icon buttons by action and handles complex images with fuller descriptions.
      good: Writes meaningful alt text and knows decorative images get empty alt.
      weak: Uses the file name or omits alt entirely.
    followups:
      - How would you handle alt text for user-uploaded images?
      - What's the difference between a missing alt attribute and an empty one?
    common_errors:
      - Icon buttons with no accessible name at all.

  - external_key: technical.frontend_core.lab_vs_field_data
    competency_key: frontend_react
    topic: Lab tools versus real-user performance data
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What's the difference between a Lighthouse score and real-user performance data, and what do the Core
      Web Vitals actually measure from a user's point of view?
    expected_concepts:
      - lab tests run once on a controlled device and network
      - field data reflects real devices, networks and behaviour
      - LCP measures loading of the main content
      - INP measures responsiveness to interactions
      - CLS measures unexpected layout movement
      - field metrics are judged at the seventy-fifth percentile
    rubric:
      excellent: Explains what each vital captures in user terms, why lab and field results disagree and when to use each, and mentions percentile-based assessment.
      good: Names the three vitals correctly and knows lab and field differ.
      weak: Treats the Lighthouse score as the definitive measure of user experience.
    followups:
      - Why might a page score well in Lighthouse but fail INP for real users?
      - Where would you get field data for your own site?
    common_errors:
      - Optimising only the lab score.

  - external_key: technical.frontend_core.image_delivery
    competency_key: frontend_react
    topic: Delivering images efficiently
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Images make up most of the page weight on many sites. How do you make sure the images you ship are
      appropriately sized and fast to load?
    expected_concepts:
      - modern formats such as AVIF and WebP
      - responsive images with srcset and sizes
      - native lazy loading for offscreen images only
      - width and height attributes to reserve space
      - image CDNs and caching
    rubric:
      excellent: Combines format choice, responsive sizing, selective lazy loading and reserved dimensions, explains why above-the-fold images should not be lazy-loaded, and automates it in the build or a CDN.
      good: Mentions compression, responsive images and lazy loading.
      weak: Only suggests compressing images.
    followups:
      - How does the browser pick a candidate from srcset?
      - Which images should never be lazy-loaded?
    common_errors:
      - Lazy-loading the main hero image.

  - external_key: technical.frontend_core.feels_slow_triage
    competency_key: frontend_react
    topic: Turning a vague slowness complaint into measurements
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A product manager tells you the checkout page feels slow but can't say more. What would you do first
      to understand what's actually slow?
    expected_concepts:
      - clarify which part feels slow (loading, interactions, navigation)
      - check field data segmented by device and network
      - reproduce with throttling in DevTools
      - inspect network waterfall and main-thread activity
      - agree on a measurable target
    rubric:
      excellent: Narrows the complaint into specific phases, uses field data and throttled reproduction, inspects the network and main thread and agrees a measurable goal before changing code.
      good: Reproduces with DevTools and looks at network and performance panels.
      weak: Starts optimising code at random.
    followups:
      - What questions would you ask the product manager?
      - How would you show progress once you start fixing things?
    common_errors:
      - Testing only on a fast development machine and network.

  # ---------------------------------------------------------------- medium
  - external_key: technical.frontend_core.aria_when_and_how
    competency_key: accessibility
    topic: Using ARIA correctly
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When do you reach for ARIA attributes, and when does ARIA make things worse? Give me an example of
      ARIA you've added that was genuinely needed.
    expected_concepts:
      - native semantics first, ARIA only to fill gaps
      - roles, states and properties are different kinds of attributes
      - ARIA changes semantics but adds no behaviour
      - states such as aria-expanded must be kept in sync
      - incorrect ARIA can hide or misrepresent content
    rubric:
      excellent: States the native-first principle, explains that ARIA adds no keyboard behaviour, gives a well-chosen real example with synchronised state, and recognises harmful patterns.
      good: Knows to prefer native elements and uses common attributes correctly.
      weak: Adds roles and labels everywhere believing more ARIA is always better.
    followups:
      - What happens when you put role button on a div and stop there?
      - When would aria-hidden cause harm?
    common_errors:
      - Adding a role without the matching keyboard behaviour.
      - Leaving aria-expanded stuck in one state.

  - external_key: technical.frontend_core.accessible_authentication
    competency_key: accessibility
    topic: Accessible sign-in and CAPTCHAs
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your login page blocks pasting into the password field, has a session timeout of two minutes and uses an
      image puzzle CAPTCHA. What problems do you see, and what would you change?
    expected_concepts:
      - blocking paste breaks password managers and pushes weaker passwords
      - WCAG 2.2 accessible authentication avoids memory or puzzle tests
      - CAPTCHA alternatives such as invisible risk scoring or other modalities
      - warning before timeouts and allowing users to extend them
      - correct autocomplete attributes for credentials and one-time codes
    rubric:
      excellent: Explains how each choice harms usability and security, cites the relevant WCAG criteria, and proposes concrete alternatives such as password-manager support, timeout warnings and less intrusive bot protection.
      good: Identifies the paste and CAPTCHA problems with reasonable fixes.
      weak: Sees the restrictions as good security without considering who they exclude.
    followups:
      - Which autocomplete values would you set on a sign-in form with a one-time code?
      - How would you defend against bots without a visual puzzle?
    common_errors:
      - Assuming blocking paste makes passwords more secure.

  - external_key: technical.frontend_core.live_regions
    competency_key: accessibility
    topic: Announcing dynamic updates with live regions
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you make sure screen-reader users hear about things like toast notifications, search result
      counts or a background save finishing?
    expected_concepts:
      - aria-live polite versus assertive
      - status and alert roles
      - the live region must exist before content changes
      - keeping announcements short and avoiding noise
      - toasts that disappear too quickly or contain actions
    rubric:
      excellent: Chooses politeness levels sensibly, explains that regions must be present before updates, keeps announcements concise and handles timed toasts and actionable messages.
      good: Uses aria-live or status roles correctly for the examples.
      weak: Relies on visual toasts only or marks everything assertive.
    followups:
      - Why might a live region that is injected along with its message never be read?
      - What's the problem with a toast that disappears after three seconds and has an undo button?
    common_errors:
      - Creating the live region at the same moment as the message.

  - external_key: technical.frontend_core.target_size_pointer
    competency_key: accessibility
    topic: Target size and pointer interactions
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Support tickets show people on phones keep hitting the wrong icon in a tightly packed toolbar, and a few
      have deleted items by accident. What would you look at, and how would you redesign it?
    expected_concepts:
      - minimum target size and spacing in WCAG 2.2
      - icon-only buttons need accessible names and visible labels or tooltips
      - pointer cancellation so actions fire on release and can be aborted
      - confirmation or undo for destructive actions
      - testing with real devices and people who use them
    rubric:
      excellent: Applies target size and spacing requirements, makes actions fire on release with a way to back out, adds undo for destructive actions, and improves labelling, validating changes on real devices.
      good: Enlarges or spaces the targets and adds confirmation or undo for delete.
      weak: Treats it purely as users being careless.
    followups:
      - Why is undo often better than a confirmation dialog?
      - How would you fit larger targets into a dense toolbar?
    common_errors:
      - Triggering destructive actions on pointer down with no way to cancel.

  - external_key: technical.frontend_core.user_preferences_zoom_motion
    competency_key: accessibility
    topic: Zoom, reflow, text spacing and reduced motion
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some users browse at high zoom, enlarge text, or have asked their system to reduce motion. What do you
      do in your CSS and components to respect those preferences?
    expected_concepts:
      - reflow at four hundred percent zoom without horizontal scrolling
      - relative units for text and not blocking pinch zoom
      - text spacing overrides without clipping
      - prefers-reduced-motion to tone down animation
      - forced colours and high-contrast modes
    rubric:
      excellent: Covers zoom and reflow, text resizing and spacing, reduced motion and forced colours with concrete CSS techniques and explains how each is tested.
      good: Handles reduced motion and relative units.
      weak: Disables zoom in the viewport meta tag or ignores system preferences.
    followups:
      - What would you change about a parallax hero for someone who prefers reduced motion?
      - How do you test reflow at high zoom quickly?
    common_errors:
      - Fixed-height containers that clip enlarged text.

  - external_key: technical.frontend_core.a11y_in_workflow
    competency_key: accessibility
    topic: Building accessibility checks into the team workflow
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team keeps shipping accessibility regressions that are only found in yearly audits. How would you
      build accessibility checking into everyday development?
    expected_concepts:
      - lint rules and automated checks such as axe in component and end-to-end tests
      - automated tools catch only part of the issues
      - manual keyboard and screen-reader checks in the definition of done
      - accessible primitives in the shared component library
      - design reviews that include accessibility annotations
    rubric:
      excellent: Layers automated checks in CI with manual testing and accessible shared components, is clear about what automation misses, and makes it part of the team's definition of done.
      good: Adds automated testing plus some manual checks.
      weak: Relies on the annual audit or a single browser extension.
    followups:
      - What kinds of issues will automated tools never catch?
      - How would you get designers involved earlier?
    common_errors:
      - Treating a clean automated scan as proof of accessibility.

  - external_key: technical.frontend_core.lcp_breakdown
    competency_key: frontend_react
    topic: Diagnosing a slow Largest Contentful Paint
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      On a product page, Largest Contentful Paint is around four and a half seconds at the seventy-fifth
      percentile, and the LCP element is the main product image. How would you break that time down and
      decide what to fix?
    expected_concepts:
      - splitting LCP into server response, resource load delay, load duration and render delay
      - making the image discoverable in the HTML rather than injected by script
      - fetchpriority high or preload for the LCP image
      - right-sized modern image formats and CDN caching
      - render-blocking resources delaying the paint
    rubric:
      excellent: Breaks LCP into its phases with evidence, targets the largest phase first (discoverability, priority, size or blocking resources) and validates with field data after release.
      good: Prioritises and optimises the image and checks server response time.
      weak: Applies generic optimisations without identifying which part of the time dominates.
    followups:
      - How do you know whether the image was discovered late?
      - What if the server response alone takes two seconds?
    common_errors:
      - Lazy-loading or client-rendering the LCP image.

  - external_key: technical.frontend_core.cls_sources
    competency_key: frontend_react
    topic: Finding and fixing layout shifts
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Users say the article page jumps around while it loads and they sometimes tap the wrong link. How would
      you find out what is shifting and stop it?
    expected_concepts:
      - layout shift attribution in DevTools or from field data
      - images and embeds without reserved dimensions or aspect ratio
      - ads, banners and consent bars injected above content
      - web font swaps changing text size
      - shifts outside the input grace period count against the score
    rubric:
      excellent: Uses attribution to find the shifting elements, reserves space for media and dynamic slots, handles fonts and late-injected banners, and confirms improvement in field data.
      good: Reserves space for images and ads and names common causes.
      weak: Does not know how to identify which element moved.
    followups:
      - How would you reserve space for an ad slot whose size varies?
      - Why don't shifts right after a user's tap count against CLS?
    common_errors:
      - Inserting cookie or promotional banners at the top after content renders.

  - external_key: technical.frontend_core.inp_phases
    competency_key: javascript
    topic: What makes an interaction slow
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When a click on a filter button takes half a second to show any visual response, where can that time
      go? Explain the parts of an interaction and how you'd shorten each.
    expected_concepts:
      - input delay from other tasks already on the main thread
      - processing time in the event handlers
      - presentation delay for style, layout and paint
      - yielding to the main thread so the next frame can paint
      - giving immediate visual feedback before heavy work
    rubric:
      excellent: Separates input delay, processing and presentation delay, maps causes to each, and uses yielding, deferring non-urgent work and early feedback to shorten them.
      good: Knows long tasks and heavy handlers hurt responsiveness and suggests breaking them up.
      weak: Only suggests adding a loading spinner.
    followups:
      - How would you find which script is responsible for the input delay?
      - What does yielding mean in practice, and how do you do it?
    common_errors:
      - Doing all work synchronously in the click handler before updating the UI.

  - external_key: technical.frontend_core.http_cache_headers
    competency_key: frontend_react
    topic: HTTP caching for frontend assets
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you set caching for your HTML documents compared with your hashed JavaScript and CSS bundles,
      and what goes wrong if you get it backwards?
    expected_concepts:
      - long max-age and immutable for content-hashed assets
      - no-cache or short lifetimes with revalidation for HTML
      - ETags and conditional requests
      - CDN and browser caches behaving differently
      - stale HTML referencing missing assets, or users stuck on old versions
    rubric:
      excellent: Gives correct header strategies for each resource type, explains revalidation and CDN layers, and describes the concrete failures of each mistake.
      good: Caches hashed assets long and HTML briefly.
      weak: Applies one cache duration to everything.
    followups:
      - What's the difference between no-cache and no-store?
      - How would you purge a bad release from the CDN?
    common_errors:
      - Caching the HTML shell for a long time and stranding users on old releases.

  - external_key: technical.frontend_core.resource_hints
    competency_key: frontend_react
    topic: Preload, preconnect, prefetch and priority hints
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you decide when to use preload, preconnect, prefetch or fetch priority hints, and have you
      seen any of them make performance worse?
    expected_concepts:
      - preload for late-discovered critical resources on this page
      - preconnect for critical third-party origins
      - prefetch for likely next navigations at low priority
      - fetchpriority to raise or lower individual resources
      - overusing hints competes for bandwidth with critical resources
    rubric:
      excellent: Matches each hint to a concrete situation, explains how they interact with browser prioritisation, and gives an example of a hint backfiring with how it was measured.
      good: Knows what each hint does and uses them sensibly.
      weak: Preloads many resources without considering priority or cost.
    followups:
      - What happens if you preload something the page never uses?
      - How many origins would you preconnect to, and why so few?
    common_errors:
      - Preloading so much that the LCP resource is delayed.

  - external_key: technical.frontend_core.third_party_tags
    competency_key: frontend_react
    topic: Controlling the cost of third-party scripts
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Marketing has added a tag manager that now loads fifteen third-party scripts on every page, and your
      vitals have dropped. How would you handle it, both technically and with the marketing team?
    expected_concepts:
      - measuring each script's cost in main-thread time and bytes
      - loading non-critical tags late or after interaction
      - facades for heavy embeds such as chat widgets and videos
      - moving work off the main thread or server-side where possible
      - a review process and performance budget for new tags
    rubric:
      excellent: Quantifies each tag's impact, proposes loading strategies and facades, and sets up a shared governance process with marketing based on data rather than vetoes.
      good: Measures the scripts and defers the non-critical ones.
      weak: Removes tags unilaterally or accepts the regression.
    followups:
      - How would you show marketing the business cost of a tag?
      - What does a facade for a chat widget look like?
    common_errors:
      - Assuming async loading makes a third-party script free.

  # ------------------------------------------------------------------ hard
  - external_key: technical.frontend_core.accessible_charts
    competency_key: accessibility
    topic: Making interactive charts accessible
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your analytics product is built around interactive charts with hover tooltips. How would you make the
      information in those charts available to screen-reader and keyboard users?
    expected_concepts:
      - a text summary of the key insight and an accessible name for the chart
      - an equivalent data table or downloadable data
      - keyboard navigation through data points with announced values
      - not relying on colour alone, using patterns or direct labels
      - tooltips reachable by focus as well as hover
      - semantics for SVG or canvas output
    rubric:
      excellent: Provides layered alternatives (summary, table and keyboard exploration), handles SVG or canvas semantics, avoids colour-only encoding and makes tooltip content reachable without a mouse, with assistive technology testing.
      good: Adds a text alternative or data table and keyboard-accessible tooltips.
      weak: Adds alt text that just says chart.
    followups:
      - How would you describe a trend rather than list hundreds of data points?
      - What's different about making a canvas chart accessible compared with SVG?
    common_errors:
      - Information available only on mouse hover.

  - external_key: technical.frontend_core.wcag_remediation_plan
    competency_key: accessibility
    topic: Planning a WCAG conformance remediation
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A large customer requires WCAG 2.2 level AA conformance within one quarter, and an external audit has
      just reported four hundred issues across your product. How would you plan the work?
    expected_concepts:
      - grouping issues by root cause and shared components
      - prioritising by user impact on critical journeys
      - fixing primitives in the design system to resolve many issues at once
      - tracking progress and documenting conformance accurately in an accessibility statement or conformance report
      - regression prevention with automated and manual checks
    rubric:
      excellent: Groups findings into systemic fixes, prioritises critical journeys and severity, fixes shared components first, communicates status transparently and builds safeguards against regression.
      good: Prioritises by severity and fixes shared components.
      weak: Works through the list from top to bottom one ticket at a time.
    followups:
      - How would you decide what to fix first?
      - What would you tell the customer if not everything is fixed by the deadline?
    common_errors:
      - Fixing symptoms page by page instead of in the shared components.

  - external_key: technical.frontend_core.performance_budgets
    competency_key: frontend_react
    topic: Preventing performance regressions across teams
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Ten teams ship to the same web app, and every quarter the hard-won performance gains slowly disappear.
      How would you set things up so regressions are caught and owned?
    expected_concepts:
      - performance budgets for bundle size and key metrics
      - automated checks in CI such as size limits and lab runs
      - real-user monitoring with alerts on regressions
      - attributing regressions to routes, teams or releases
      - dashboards, ownership and review of budget exceptions
    rubric:
      excellent: Combines CI budgets with field monitoring and alerting, attributes regressions to owners, and defines a lightweight process for exceptions so the system is sustained over time.
      good: Adds bundle-size checks and monitoring.
      weak: Proposes a periodic manual performance review only.
    followups:
      - How do you stop CI lab measurements from being too noisy to act on?
      - What happens when a team needs to exceed the budget for a launch?
    common_errors:
      - Budgets that block merges on noisy lab scores, so teams learn to ignore them.

  - external_key: technical.frontend_core.service_worker_caching
    competency_key: javascript
    topic: Service worker caching and updates
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      If you used a service worker to make an app load fast on repeat visits and work offline, how would you
      choose caching strategies, and how would you handle shipping updates safely?
    expected_concepts:
      - cache-first for versioned assets, network-first or stale-while-revalidate for data
      - precaching the app shell during install
      - service worker lifecycle with install, waiting and activate
      - skipWaiting and the risk of mixing old and new assets
      - prompting users to reload and a kill switch for a broken worker
    rubric:
      excellent: Picks strategies per resource type, explains the lifecycle and why updates wait, handles version mixing and user prompts, and has a recovery plan for a broken worker.
      good: Knows the main strategies and the install and activate steps.
      weak: Caches everything forever without an update strategy.
    followups:
      - How would you recover users stuck on a buggy service worker?
      - What's the risk of calling skipWaiting immediately?
    common_errors:
      - Serving a cached HTML shell that points to assets which no longer exist.

  - external_key: technical.frontend_core.hydration_unresponsive
    competency_key: frontend_react
    topic: Server-rendered pages that are not yet interactive
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your server-rendered pages look complete quickly, but on mid-range phones buttons do nothing for the
      first three seconds and INP is poor. What's going on, and how would you fix it?
    expected_concepts:
      - hydration runs large amounts of JavaScript on the main thread
      - shipping less JavaScript and splitting by route
      - progressive or selective hydration and islands
      - server components or static parts that need no hydration
      - deferring non-critical scripts and breaking up long tasks
    rubric:
      excellent: Explains the hydration gap and its long tasks, measures it, and reduces it through less JavaScript, selective or partial hydration and deferring non-critical work, with trade-offs.
      good: Identifies hydration cost and proposes code splitting.
      weak: Suggests turning off server rendering without analysis.
    followups:
      - How would you measure how long hydration takes for real users?
      - What happens to clicks that occur before hydration completes?
    common_errors:
      - Hydrating static content such as footers and article bodies.

  - external_key: technical.frontend_core.rum_pipeline
    competency_key: frontend_react
    topic: Designing real-user performance monitoring
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      If you were to build real-user performance monitoring for your app instead of buying a product, what
      would you collect, how would you send it, and how would you analyse it so it leads to fixes?
    expected_concepts:
      - collecting vitals with attribution such as the LCP element and slow interaction target
      - sending reliably with sendBeacon on page hide
      - sampling and privacy considerations
      - percentile analysis segmented by route, device class, network and release
      - alerting on regressions and linking to traces
    rubric:
      excellent: Designs collection with attribution, reliable delivery and sampling, analyses by percentile and segment, ties metrics to releases and makes the output actionable for teams.
      good: Collects vitals, sends them reliably and looks at percentiles.
      weak: Collects averages only or sends data in a way that is often lost.
    followups:
      - Why are averages misleading for performance data?
      - How would you know which release caused a regression?
    common_errors:
      - Sending metrics on unload events that browsers often skip.
