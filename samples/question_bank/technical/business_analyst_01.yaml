# Curated questions: business analysis (part 1 of 4).
# Requirements elicitation, problem framing, user stories, acceptance criteria, non-functional
# requirements, prioritisation and scope.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; medium also in deep_technical; hard in deep_technical
# and combined.
version: 1
defaults:
  role_tags: [business_analyst]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.business_analyst.choosing_elicitation_technique
    competency_key: requirements_analysis
    topic: Choosing an elicitation technique
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you start gathering requirements for a new piece of work, how do you decide whether to run
      one-to-one interviews, a group workshop, a survey or simply sit and observe people doing the job?
    expected_concepts:
      - interviews for depth and sensitive topics with individual experts
      - workshops to build shared understanding and resolve differences quickly
      - observation or job shadowing to see what people actually do versus what they say
      - surveys for breadth across many users with simple questions
      - combining techniques and validating findings from one with another
    rubric:
      excellent: Matches each technique to the situation (number of stakeholders, tacit knowledge, politics, time available) with a real example, and explains how they cross-checked results from one technique with another.
      good: Describes several techniques and when they are useful, with a reasonable example.
      weak: Uses the same meeting format for everything or only lists technique names without saying when to use them.
    followups:
      - Tell me about a time observation showed you something interviews had missed.
      - How do you prepare for a requirements workshop so it doesn't turn into a general discussion?
    common_errors:
      - Relying only on what managers describe instead of talking to the people who do the work.

  - external_key: technical.business_analyst.problem_behind_request
    competency_key: requirements_analysis
    topic: Finding the problem behind a solution request
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A sales manager comes to you and says, "We need a new button that exports the customer list to
      Excel." Walk me through how you'd respond and what you'd want to find out before writing anything
      down.
    expected_concepts:
      - asking what the exported list is used for and by whom
      - separating the underlying need from the proposed solution
      - asking how often, how much data and what happens after export
      - checking whether existing reports or features already meet the need
      - data sensitivity of exporting customer data
    rubric:
      excellent: Probes the purpose and downstream use before accepting the solution, considers alternatives such as an in-app report, and raises data-protection concerns about bulk export.
      good: Asks why the export is needed and who uses it, then documents the requirement with that context.
      weak: Writes the requirement exactly as requested without asking about the underlying problem.
    followups:
      - Suppose the real goal is weekly pipeline review. What might you propose instead?
      - How would you handle it if the manager insists on the export anyway?
    common_errors:
      - Treating the requested button as the requirement and never learning what the list is used for.

  - external_key: technical.business_analyst.good_user_story
    competency_key: requirements_analysis
    topic: Qualities of a well-written user story
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Take a user story you wrote recently, or make one up for an online ordering system. What makes it a
      good story that a developer and tester can actually work from?
    expected_concepts:
      - clear user role, goal and benefit
      - small enough to finish within an iteration
      - testable acceptance criteria attached
      - independent and negotiable rather than a fixed specification
      - focus on user value rather than implementation detail
    rubric:
      excellent: Gives a concrete story, explains why each part matters, ties it to criteria such as INVEST, and shows how the acceptance criteria make it testable.
      good: Writes a correctly structured story with sensible acceptance criteria.
      weak: Writes a task or technical instruction disguised as a story, with no acceptance criteria.
    followups:
      - What would you change if the developers said the story was too big for one sprint?
      - Which part of a story do people most often leave vague, in your experience?
    common_errors:
      - Writing stories from the system's point of view, such as "the database stores the order", with no user or benefit.

  - external_key: technical.business_analyst.acceptance_criteria_writing
    competency_key: requirements_analysis
    topic: Writing testable acceptance criteria
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Imagine a story for letting customers reset their password by email. How would you write the
      acceptance criteria so that anyone on the team could tell whether it's done?
    expected_concepts:
      - given-when-then or checklist format with observable outcomes
      - happy path plus failure cases such as unknown email or expired link
      - specific values like link expiry time and number of attempts
      - security behaviour such as not revealing whether an email exists
      - avoiding vague words like fast or user-friendly
    rubric:
      excellent: Produces precise criteria covering the main flow and several edge cases with concrete values, and avoids leaking whether an account exists.
      good: Writes clear criteria for the main flow and at least one failure case.
      weak: Writes criteria that cannot be tested, such as "the reset works correctly".
    followups:
      - Who would you involve in reviewing these criteria before development starts?
      - How do you stop acceptance criteria turning into a full test plan?
    common_errors:
      - Covering only the successful reset and ignoring expired, reused or invalid links.

  - external_key: technical.business_analyst.functional_vs_nonfunctional
    competency_key: requirements_analysis
    topic: Functional versus non-functional requirements
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Using a system you've worked on, explain how you captured non-functional requirements like
      performance, availability or audit logging, and how they differed from the functional ones.
    expected_concepts:
      - functional describes what the system does, non-functional how well or under what constraints
      - measurable targets such as response time at a given load
      - sources such as security, compliance and operations teams
      - where they were recorded so they were not lost
      - testing or verifying non-functional requirements
    rubric:
      excellent: Gives real examples with measurable targets, explains who supplied them and how they were verified before go-live.
      good: Explains the difference clearly with examples, though targets are only partly measurable.
      weak: Cannot give examples or leaves non-functional requirements as vague statements like "the system must be fast".
    followups:
      - Which non-functional requirement caused the most trouble late in a project you worked on?
      - How do you get a business stakeholder to put a number on "fast enough"?
    common_errors:
      - Discovering performance or audit needs only during user acceptance testing.

  - external_key: technical.business_analyst.moscow_prioritisation
    competency_key: requirements_analysis
    topic: Prioritising requirements
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a stakeholder group gives you forty requirements and says they're all essential, how do you
      help them prioritise?
    expected_concepts:
      - a prioritisation method such as MoSCoW, value versus effort or ranking
      - linking each requirement to a business objective
      - forcing trade-offs with a fixed budget or capacity
      - involving the decision owner rather than averaging opinions
      - recording the agreed priority and the reasoning
    rubric:
      excellent: Describes a concrete method they've used, how they made stakeholders trade off against capacity and objectives, and how the decision was recorded and later revisited.
      good: Names a reasonable method and explains how they applied it.
      weak: Accepts that everything is essential or decides priorities alone without the business.
    followups:
      - What do you do when two senior stakeholders rank the same item very differently?
      - How do you stop the "must have" category growing back to everything?
    common_errors:
      - Letting the loudest stakeholder set the order instead of the agreed objectives.

  - external_key: technical.business_analyst.clarifying_ambiguous_requirement
    competency_key: communication
    topic: Resolving an ambiguous requirement
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A developer messages you mid-sprint saying the requirement "show recent orders" can be read three
      different ways. How would you handle that, and what would you do to stop it happening again?
    expected_concepts:
      - responding quickly to avoid blocking the developer
      - going back to the business owner to confirm the intended meaning
      - defining terms precisely such as a time window or count
      - updating the story and telling everyone affected
      - adding a glossary or examples to future requirements
    rubric:
      excellent: Unblocks the developer quickly, confirms the meaning with the right business owner, updates the artefact with a precise definition and example, and adds a preventive habit such as a glossary or refinement checklist.
      good: Clarifies with the business and updates the story.
      weak: Picks an interpretation themselves without checking, or tells the developer to choose.
    followups:
      - What if the business owner is unavailable for two days?
      - How would you use examples to make requirements like this unambiguous?
    common_errors:
      - Fixing the single story without addressing the vague wording that caused the confusion.

  - external_key: technical.business_analyst.prototype_to_validate
    competency_key: requirements_analysis
    topic: Using prototypes and wireframes to validate requirements
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your stakeholders keep approving written requirements and then saying "that's not what I meant" when
      they see the built screen. How would you use mock-ups or prototypes to fix that?
    expected_concepts:
      - low-fidelity sketches or wireframes early in elicitation
      - walking users through realistic tasks on the prototype
      - capturing feedback and turning it into requirements
      - making clear the prototype is not the final design
      - choosing fidelity based on the questions to be answered
    rubric:
      excellent: Describes introducing quick, task-based walkthroughs of low-fidelity prototypes, how feedback was captured and fed back into stories, and how they managed expectations about the prototype.
      good: Suggests wireframes or clickable prototypes and reviewing them with users.
      weak: Proposes writing longer documents or getting more formal sign-offs as the only fix.
    followups:
      - How do you avoid stakeholders fixating on colours and fonts during a prototype review?
      - When would a prototype be a waste of time?

  # ---------------------------------------------------------------- medium
    common_errors:
      - Building a polished prototype so early that stakeholders assume the product is almost finished.
  - external_key: technical.business_analyst.story_splitting
    competency_key: requirements_analysis
    topic: Splitting large stories
    difficulty: medium
    kind: technical
    text: >-
      You have an epic like "customers can manage their subscription": upgrade, downgrade, pause and
      cancel, with proration and billing changes. How would you split it into stories that each deliver
      something usable?
    expected_concepts:
      - vertical slices that deliver end-to-end value rather than layers
      - splitting by workflow step, business rule variation or data type
      - deferring complex rules like proration to later slices
      - keeping each slice independently testable and releasable
      - ordering slices by value and risk
    rubric:
      excellent: Proposes concrete vertical slices with a clear rationale, names splitting patterns, sequences them by value and risk, and explains how the simplest slice can ship first.
      good: Produces sensible smaller stories mostly split by feature, with acceptance criteria in mind.
      weak: Splits by technical layer (database, API, UI) or into tasks that deliver nothing on their own.
    followups:
      - Which slice would you deliver first and why?
      - How would you handle a rule like proration that touches every slice?
    common_errors:
      - Splitting into front-end and back-end stories that only make sense together.

  - external_key: technical.business_analyst.edge_cases_discovery
    competency_key: requirements_analysis
    topic: Discovering edge cases and exception flows
    difficulty: medium
    kind: technical
    text: >-
      Stakeholders usually describe the happy path. What techniques do you use to uncover the exceptions
      and edge cases before development starts?
    expected_concepts:
      - walking through each step asking what could go wrong
      - boundary values, missing data and duplicate submissions
      - concurrency and timing such as two people editing the same record
      - involving testers and support staff who see failures
      - reviewing historical incidents, complaints or manual workarounds
    rubric:
      excellent: Describes a systematic approach (step-by-step what-ifs, boundaries, timing, permissions) and real sources such as support tickets, with an example of an edge case that would otherwise have shipped broken.
      good: Uses what-if questioning and involves testers, with at least one example.
      weak: Relies on developers or testers to find edge cases later.
    followups:
      - Which edge case cost the most when it was found late on one of your projects?
      - How do you decide which edge cases are worth handling versus documenting as out of scope?
    common_errors:
      - Assuming testers will find the exceptions, so business rules for them are never agreed.

  - external_key: technical.business_analyst.measurable_nfr_targets
    competency_key: requirements_analysis
    topic: Making non-functional requirements measurable
    difficulty: medium
    kind: scenario
    text: >-
      The business says the new claims portal "must be fast and always available." How would you turn that
      into requirements the delivery team can design and test against?
    expected_concepts:
      - response-time targets at a percentile under a defined load
      - availability target with business hours and maintenance windows
      - expected user volumes and peak periods
      - cost and design trade-offs of higher targets
      - agreeing how targets will be measured and verified
    rubric:
      excellent: Converts the statement into specific percentile, load and availability targets, explains the cost of higher targets to the business, and agrees how they will be measured in testing and production.
      good: Produces numeric targets and identifies the need for load figures.
      weak: Leaves the requirement vague or invents numbers without consulting the business or engineers.
    followups:
      - What questions would you ask to estimate peak load?
      - How would you explain to a sponsor why 99.99 percent costs much more than 99.9 percent?
    common_errors:
      - Using averages instead of percentiles, which hides the slow requests users actually notice.

  - external_key: technical.business_analyst.conflicting_requirements
    competency_key: stakeholder_management
    topic: Resolving conflicting requirements between departments
    difficulty: medium
    kind: scenario
    text: >-
      Finance wants every refund over a small amount approved by a manager, but customer service wants
      agents to refund instantly to keep customers happy. Both are stakeholders on your project. How would
      you work this through?
    expected_concepts:
      - understanding each side's underlying goal such as fraud control versus satisfaction
      - gathering data on refund volumes, values and fraud rates
      - exploring options like thresholds, risk rules or post-hoc review
      - escalating to the decision owner with options and trade-offs if needed
      - documenting the decision and its rationale
    rubric:
      excellent: Uncovers the interests behind each position, uses data to frame options that satisfy both, facilitates a decision with the right owner and records the rationale.
      good: Brings both sides together and proposes a reasonable compromise.
      weak: Picks the more senior department's view or passes the conflict to developers to decide.
    followups:
      - What data would you pull before the meeting?
      - What if the two sides still can't agree after seeing the options?
    common_errors:
      - Documenting both requirements as stated and leaving the conflict for the build team to discover.

  - external_key: technical.business_analyst.elicitation_workshop_design
    competency_key: requirements_analysis
    topic: Planning and facilitating a requirements workshop
    difficulty: medium
    kind: technical
    text: >-
      Describe how you'd plan and run a half-day workshop to gather requirements for a new onboarding
      process involving HR, IT and line managers.
    expected_concepts:
      - clear objectives and agenda shared in advance
      - choosing the right participants and decision makers
      - structured activities such as process walkthroughs or story mapping
      - managing dominant voices and keeping to time with a parking lot
      - documented outputs and follow-up actions with owners
    rubric:
      excellent: Gives a concrete plan with objectives, participant selection, specific facilitation techniques, how they'd handle dominant voices and what artefacts and actions come out of it.
      good: Describes a sensible agenda and outputs with some facilitation detail.
      weak: Describes an open discussion with notes but no structure or follow-up.
    followups:
      - How do you make sure quieter participants contribute?
      - What do you send out in the 24 hours after the workshop?
    common_errors:
      - Inviting too many people without decision rights, so the session produces opinions but no agreements.

  - external_key: technical.business_analyst.definition_of_ready
    competency_key: requirements_analysis
    topic: Definition of ready and backlog refinement
    difficulty: medium
    kind: technical
    text: >-
      How do you decide a backlog item is ready to be pulled into a sprint, and what's your role in
      refinement sessions to get it there?
    expected_concepts:
      - agreed definition of ready such as criteria, dependencies and designs
      - acceptance criteria understood by developers and testers
      - dependencies and open questions identified and resolved
      - sized by the team and small enough for the sprint
      - BA preparing items ahead of refinement rather than in the meeting
    rubric:
      excellent: Explains a definition of ready they used, how they prepared items ahead of refinement, and how they balanced readiness against over-specifying.
      good: Lists sensible readiness criteria and describes taking part in refinement.
      weak: Treats readiness as "the story is written" with no shared criteria.
    followups:
      - Has a definition of ready ever slowed a team down? What did you change?
      - How far ahead of the sprint do you try to keep refined items?
    common_errors:
      - Using readiness as a gate that blocks collaboration instead of a shared checklist.

  - external_key: technical.business_analyst.story_mapping
    competency_key: product_sense
    topic: User story mapping for release planning
    difficulty: medium
    kind: technical
    text: >-
      Explain how you'd use a user story map to plan the first release of a new booking app, and what it
      gives you that a flat backlog doesn't.
    expected_concepts:
      - backbone of user activities in sequence
      - stories placed under each activity by priority
      - horizontal release slices forming a minimum viable journey
      - visibility of gaps in the end-to-end journey
      - shared understanding with stakeholders and team
    rubric:
      excellent: Describes building the backbone, slicing a thin end-to-end first release, and gives a concrete example of a gap or scope decision the map exposed.
      good: Explains the structure of a story map and how releases are sliced.
      weak: Describes it as a prioritised list or cannot explain how it differs from a backlog.
    followups:
      - Who would you invite to build the map?
      - How did you keep the map current after the first release?
    common_errors:
      - Slicing the first release by whole activities so the user cannot complete a journey end to end.

  - external_key: technical.business_analyst.scope_creep_mid_project
    competency_key: requirements_analysis
    topic: Handling scope creep
    difficulty: medium
    kind: scenario
    text: >-
      Halfway through a fixed-deadline project, the sponsor keeps adding "small" requests in meetings.
      Individually they look minor but the team is falling behind. What would you do?
    expected_concepts:
      - logging every request through a change process
      - impact analysis on effort, timeline and risk
      - presenting trade-offs so the sponsor chooses what to drop or defer
      - linking requests back to the original objectives
      - transparent tracking of the cumulative effect
    rubric:
      excellent: Makes the cumulative impact visible with a simple change log and impact analysis, and gets the sponsor to make explicit trade-off decisions without damaging the relationship.
      good: Introduces a change process and impact assessment.
      weak: Absorbs the requests silently or refuses them without analysis.
    followups:
      - How do you raise this with a sponsor who doesn't like hearing "no"?
      - Which requests, if any, would you let through without formal change control?
    common_errors:
      - Saying yes in the meeting and only assessing the impact afterwards.

  - external_key: technical.business_analyst.bdd_scenarios_with_examples
    competency_key: requirements_analysis
    topic: Specification by example
    difficulty: medium
    kind: technical
    text: >-
      Some teams use concrete examples, like Gherkin scenarios or example tables, as the main way of
      expressing requirements. How have you used examples this way, and where did it help or fall short?
    expected_concepts:
      - collaborative example discovery with developers and testers
      - example tables covering rule variations and boundaries
      - examples doubling as automated acceptance tests
      - risk of brittle UI-level scenarios or too many scenarios
      - keeping scenarios in business language
    rubric:
      excellent: Describes real use with a specific example table, explains the collaboration around it, and gives a balanced account of its limits such as scenario sprawl or UI coupling.
      good: Explains the approach and gives a reasonable example.
      weak: Only knows the Given-When-Then syntax without the collaborative purpose.
    followups:
      - How many scenarios would you aim for on a typical story?
      - How did testers use your examples?
    common_errors:
      - Writing scenarios as click-by-click UI scripts that break with every screen change.

  - external_key: technical.business_analyst.unavailable_subject_expert
    competency_key: requirements_analysis
    topic: Eliciting with limited access to experts
    difficulty: medium
    kind: scenario
    text: >-
      The only person who really understands a legacy billing process has about two hours a week for you,
      and your requirements are due in a month. How would you make the most of that time?
    expected_concepts:
      - preparing from documentation, system screens and data before sessions
      - focused agendas with specific questions
      - asking the expert to walk through real cases or record a demo
      - writing up assumptions for the expert to confirm asynchronously
      - flagging the dependency as a risk to the sponsor
    rubric:
      excellent: Describes extensive self-directed preparation, using sessions only for what needs the expert, confirming assumptions asynchronously, and escalating the access risk early.
      good: Prepares questions in advance and uses the sessions efficiently.
      weak: Waits for the expert's sessions to learn the process from scratch.
    followups:
      - What would you read or look at before the first session?
      - How would you capture knowledge so the team isn't dependent on one person afterwards?
    common_errors:
      - Spending the expert's limited time on questions that existing documents or data could answer.

  - external_key: technical.business_analyst.requirements_level_of_detail
    competency_key: requirements_analysis
    topic: Choosing the right level of documentation
    difficulty: medium
    kind: technical
    text: >-
      How do you decide how much detail and formality to put into requirements, say for an agile product
      team compared with an outsourced vendor build or a regulated system?
    expected_concepts:
      - audience and how much shared context they have
      - contractual and regulatory need for formal specifications
      - just-in-time detail for collaborative co-located teams
      - risk and cost of misunderstanding
      - keeping documents maintainable and current
    rubric:
      excellent: Contrasts contexts with real examples, explains the factors that drove the choice and what went wrong when the level was misjudged.
      good: Recognises different contexts need different detail and gives sensible reasons.
      weak: Applies one template regardless of context.
    followups:
      - Tell me about a time you wrote too much documentation. How did you notice?
      - What's the minimum you'd always write down, even in a fast-moving team?

  # ------------------------------------------------------------------ hard
    common_errors:
      - Handing an external vendor the same lightweight stories an embedded team would use.
  - external_key: technical.business_analyst.solution_first_sponsor
    competency_key: requirements_analysis
    topic: Challenging a pre-decided solution
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A senior sponsor has already bought a workflow tool and asks you to "gather the requirements to
      configure it." As you go, you find the real problem is poor data quality upstream, which the tool
      won't fix. How would you handle that?
    expected_concepts:
      - gathering evidence that links the symptoms to the upstream data issue
      - quantifying the impact in business terms
      - raising it privately with the sponsor first rather than in a public forum
      - proposing options that still use the investment where it helps
      - documenting risks if the sponsor proceeds unchanged
    rubric:
      excellent: Builds an evidence-based case, presents it to the sponsor respectfully with options that address the root cause while salvaging the tool's value, and records the risk if the decision stands.
      good: Raises the issue with the sponsor and suggests addressing data quality alongside the tool.
      weak: Configures the tool as asked without raising the issue, or bluntly declares the purchase a mistake.
    followups:
      - What evidence would be most convincing to this sponsor?
      - If the sponsor says to carry on anyway, what do you do next?
    common_errors:
      - Challenging the purchase in a large meeting and putting the sponsor on the defensive.

  - external_key: technical.business_analyst.requirements_for_ml_feature
    competency_key: requirements_analysis
    topic: Requirements for a predictive or AI feature
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Suppose the business wants a feature that predicts which invoices will be paid late so collectors
      can call those customers first. How would you approach the requirements differently from a normal
      rules-based feature?
    expected_concepts:
      - defining the decision being supported and the action taken on a prediction
      - success metrics such as precision at the top of the list versus current approach
      - available historical data, labels and how late is defined
      - handling of wrong predictions and human override
      - monitoring, explainability and review of the model after launch
    rubric:
      excellent: Frames requirements around the business decision and measurable outcome, covers data and label definitions, error costs, human-in-the-loop handling and post-launch monitoring.
      good: Recognises the need for data, accuracy targets and some handling of wrong predictions.
      weak: Writes it as a normal feature with fixed rules and no thought about accuracy or data.
    followups:
      - How would you decide whether the model is good enough to launch?
      - Which baseline would you compare it against?
    common_errors:
      - Promising a fixed accuracy before anyone has looked at the historical data.

  - external_key: technical.business_analyst.multi_system_requirements
    competency_key: requirements_analysis
    topic: Requirements spanning several systems and teams
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Tell me how you've organised requirements for an initiative that touched several systems owned by
      different teams, for example a change to how orders flow from the website through warehouse and
      finance systems.
    expected_concepts:
      - end-to-end view of the business process before system-level detail
      - identifying system owners and interface responsibilities
      - interface or integration requirements with data contracts
      - dependency and sequencing across teams' backlogs
      - traceability from business requirement to each system change
    rubric:
      excellent: Describes a layered structure from business outcome to end-to-end process to per-system requirements and interface contracts, with how dependencies and cross-team sign-off were managed, using a real example.
      good: Describes splitting requirements per system with an overall view and coordination.
      weak: Writes requirements per system in isolation with no end-to-end view.
    followups:
      - Which interface caused the most rework, and why?
      - How did you test the end-to-end flow?
    common_errors:
      - Leaving interface ownership undefined so each team assumes the other will transform the data.

  - external_key: technical.business_analyst.value_based_scope_cut
    competency_key: product_sense
    topic: Cutting scope to hit a fixed date
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A regulatory change must be live by a fixed date, and the team's estimate shows you can deliver only
      about sixty percent of the agreed requirements. How would you decide, with the business, what goes
      live and what doesn't?
    expected_concepts:
      - separating mandatory compliance items from desirable enhancements
      - interim manual workarounds for deferred items
      - risk assessment of each deferral
      - explicit decision by the accountable owner with documented rationale
      - plan for delivering deferred items afterwards
    rubric:
      excellent: Prioritises legal must-haves first, designs workable interim workarounds and their cost, makes risks explicit and gets an accountable decision with a follow-up plan.
      good: Separates mandatory from optional items and proposes deferring the rest.
      weak: Suggests the team works overtime to deliver everything or cuts items without business involvement.
    followups:
      - How would you validate a manual workaround is sustainable for three months?
      - Who signs off the final scope in this situation?
    common_errors:
      - Deferring items without checking whether the remaining scope still meets the regulation.

  - external_key: technical.business_analyst.implicit_requirements
    competency_key: requirements_analysis
    topic: Surfacing tacit and assumed requirements
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Some of the most expensive misses are things nobody thought to say, because "obviously it works like
      the old system." How do you find those unstated requirements when replacing an existing system?
    expected_concepts:
      - analysing the current system's behaviour, reports and outputs
      - observing users and noting workarounds and side uses
      - looking at downstream consumers of data and reports
      - reviewing configuration, batch jobs and hidden business rules
      - explicitly listing assumptions for stakeholders to confirm
    rubric:
      excellent: Uses several concrete techniques to reverse-engineer existing behaviour, including downstream consumers and hidden jobs, with a real example of a tacit requirement they caught or missed.
      good: Studies the old system and asks users about their workarounds.
      weak: Relies only on what stakeholders tell them in interviews.
    followups:
      - Which downstream consumer of data is easiest to forget?
      - How would you document legacy behaviour you've decided not to keep?
    common_errors:
      - Assuming the new system's defaults match the old system's behaviour.

  - external_key: technical.business_analyst.requirements_quality_review
    competency_key: requirements_analysis
    topic: Measuring and improving requirements quality
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      If you were asked to improve the quality of requirements across a team of business analysts, how
      would you tell where the problems are and what would you change?
    expected_concepts:
      - evidence such as defects traced to requirements and rework rates
      - peer reviews and quality checklists
      - common templates and examples of good work
      - feedback loops from developers and testers
      - tracking improvement over time
    rubric:
      excellent: Starts from evidence of where requirements cause rework, introduces targeted practices like peer review and examples, and measures whether they helped.
      good: Suggests reviews and templates with some way to check improvement.
      weak: Suggests a longer template or more sign-offs without diagnosing the problem.
    followups:
      - How would you classify a defect as a requirements defect versus a build defect?
      - How would you get buy-in from experienced analysts?
    common_errors:
      - Adding more template sections, which makes documents longer but not clearer.
