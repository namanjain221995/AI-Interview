# Curated questions: mobile engineering, part 4.
# Navigation, build variants, API robustness, web views, crash tooling, release builds, images, threading,
# token refresh, testing, upgrades, platform channels, purchases, deep-link security, low-end devices,
# delta sync, keychain availability, performance regression gates, vitals, architecture, extensions and SDK risk.
# round_types follow difficulty: easy -> screening/combined, medium -> all three, hard -> deep/combined.
version: 1
defaults:
  role_tags: [mobile]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.mobile.navigation_back_stack
    competency_key: mobile_development
    topic: Navigation and back stack
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you manage navigation in your apps, and how do you make sure the back button or swipe-back takes users where
      they expect, for example after finishing a sign-up flow?
    expected_concepts:
      - navigation library or coordinator pattern (Navigation component, NavigationStack, go_router, React Navigation)
      - popping completed flows off the back stack
      - nested graphs or stacks for tabs and flows
      - passing results back to previous screens
      - Android system back and predictive back versus iOS swipe gestures
    rubric:
      excellent: Describes a structured navigation approach, removes completed flows from the stack, handles tabs and nested stacks, and accounts for platform back behaviour differences.
      good: Uses a navigation library and clears the sign-up screens from the stack after completion.
      weak: Pushes screens without managing the stack, so back returns to stale or invalid screens.
    followups:
      - How would you return a selected value from a picker screen?
      - What should happen to each tab's stack when the user switches tabs?
    common_errors:
      - Leaving login screens in the back stack after successful login.

  - external_key: technical.mobile.build_variants_environments
    competency_key: mobile_development
    topic: Build variants and environments
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you set up a mobile project so developers, QA and production users each get the right backend, settings and app
      icon, without anyone accidentally shipping a debug configuration?
    expected_concepts:
      - build types and flavours on Android, schemes and configurations on iOS
      - environment values injected at build time, not hard-coded switches
      - different bundle ids or application id suffixes so builds install side by side
      - debug-only tooling excluded from release builds
      - CI producing each variant automatically
    rubric:
      excellent: Uses build variants or configurations with build-time injected settings, separate ids for side-by-side installs, excludes debug tooling from release and automates variant builds in CI.
      good: Uses flavours or schemes to separate environments.
      weak: Switches environments by editing a constant before each build.
    followups:
      - How would QA switch backends without needing a new build?
      - How do you make sure debug menus never appear in the store build?
    common_errors:
      - Toggling a hard-coded flag by hand before release builds.

  - external_key: technical.mobile.keyboard_hides_input
    competency_key: mobile_development
    topic: Keyboard and input handling
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      On a payment form, the keyboard covers the field the user is typing into and the submit button, especially on smaller phones.
      How would you fix that properly on the platform you know best?
    expected_concepts:
      - keyboard insets and safe areas (WindowInsets, keyboard layout guide)
      - scrollable container that brings the focused field into view
      - adjustResize or imePadding style handling
      - appropriate keyboard types and return-key actions to move between fields
      - testing on small screens and with different keyboards
    rubric:
      excellent: Uses the platform's keyboard inset APIs with a scrollable layout that keeps the focused field visible, adds field navigation and correct keyboard types, and tests on small screens.
      good: Makes the form scrollable and adjusts for the keyboard height.
      weak: Hard-codes an offset or moves fields up by a fixed amount.
    followups:
      - What changes when the app supports split-screen or a floating keyboard?
      - How would you make the submit action reachable without scrolling?
    common_errors:
      - Hard-coding a keyboard height that differs between devices and keyboards.

  - external_key: technical.mobile.robust_api_parsing
    competency_key: mobile_development
    topic: Defensive API parsing
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      The backend adds a new enum value to an API response, and an older version of your app crashes for everyone.
      How do you write your models and parsing so this doesn't happen?
    expected_concepts:
      - tolerant decoding that ignores unknown fields
      - unknown enum fallback values
      - optional versus required fields and defaults
      - fail one item rather than the whole response where sensible
      - contract agreement with backend and logging of decode failures
    rubric:
      excellent: Designs tolerant models with unknown enum cases, sensible defaults and per-item failure handling, logs decode errors and agrees evolution rules with the backend.
      good: Adds unknown fallbacks and ignores unknown fields.
      weak: Uses force-unwraps or strict parsing and expects the backend never to change.
    followups:
      - When should a missing field fail loudly instead of falling back?
      - How would you get the backend team to agree on rules for changing responses?
    common_errors:
      - Strict enum decoding that throws on any new value.

  - external_key: technical.mobile.stale_after_refresh
    competency_key: mobile_development
    topic: Stale data in the UI
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A user changes their delivery address on one screen, goes back, and the previous screen still shows the old address
      even after pulling to refresh. How would you track down why?
    expected_concepts:
      - multiple sources of truth or copies of the same data
      - cache returning stale data or HTTP cache headers
      - observing a shared repository or database instead of one-off fetches
      - invalidating caches after writes
      - verifying the network response actually changes
    rubric:
      excellent: Traces where each screen gets its data, finds the stale copy or cache, and fixes it by having both screens observe a single source of truth with invalidation after writes.
      good: Finds the cache causing stale data and invalidates it after the update.
      weak: Adds a forced reload on every screen appearance without understanding the cause.
    followups:
      - How would you confirm whether the problem is the client cache or the server?
      - What pattern stops this class of bug across the app?
    common_errors:
      - Passing copies of objects between screens instead of ids.

  - external_key: technical.mobile.webview_trade_offs
    competency_key: mobile_development
    topic: Web views in native apps
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When would you embed web content in a mobile app with a web view, and what problems have you run into or would
      you watch out for?
    expected_concepts:
      - good for frequently changing content or existing web flows
      - performance and native feel trade-offs
      - JavaScript bridge security and allowed origins
      - authentication and cookie sharing between native and web
      - back navigation, file uploads and deep links inside web content
    rubric:
      excellent: Gives sensible use cases, discusses UX and performance costs, and covers security of the JavaScript bridge, origin restrictions and session sharing.
      good: Explains when web views fit and names some UX or security concerns.
      weak: Uses web views for everything or ignores security of exposed bridges.
    followups:
      - How do you stop a web view from loading arbitrary external sites?
      - How would you keep the user logged in across native and web screens?
    common_errors:
      - Exposing a JavaScript interface to any page the web view can load.

  - external_key: technical.mobile.crash_tooling_before_launch
    competency_key: debugging
    topic: Crash and error reporting setup
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You're two weeks from launching a brand-new app and there's no crash or error monitoring set up yet.
      What would you put in place before launch, and why?
    expected_concepts:
      - crash reporting SDK with symbol and mapping uploads
      - non-fatal error and breadcrumb logging
      - release health dashboards (crash-free users and sessions)
      - alerting on new crash clusters or spikes
      - avoiding personal data in logs
    rubric:
      excellent: Sets up crash reporting with automated symbol uploads, non-fatals and breadcrumbs, health dashboards and alerts, while keeping personal data out of reports.
      good: Adds a crash reporter with symbols and checks it after release.
      weak: Plans to rely on store reviews and user emails to find crashes.
    followups:
      - Which non-fatal errors are worth reporting?
      - How do you verify crash reporting actually works before launch?
    common_errors:
      - Forgetting to upload symbols or mapping files so reports are unreadable.

  # ------------------------------------------------------------------ medium
  - external_key: technical.mobile.release_build_only_crash
    competency_key: debugging
    topic: Release-only crashes
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      QA finds that the release build crashes when opening the profile screen, but the debug build never does.
      What kinds of differences would you suspect, and how would you narrow it down?
    expected_concepts:
      - code shrinking and obfuscation removing or renaming classes (R8, ProGuard keep rules)
      - reflection-based serialisation breaking after renaming
      - compiler optimisations exposing undefined behaviour or races
      - release-only configuration or missing debug dependencies
      - reproducing with a debuggable release-like build and mapping files
    rubric:
      excellent: Names shrinking and obfuscation as prime suspects with reflection and serialisation examples, reproduces with a release-like build, uses mapping files and fixes with keep rules or code-generated serialisers.
      good: Suspects obfuscation and adds keep rules after checking the stack trace.
      weak: Disables minification in release to make the problem go away.
    followups:
      - How would you make sure this is caught before QA next time?
      - Why do code-generated serialisers avoid this problem?
    common_errors:
      - Turning off code shrinking entirely instead of adding targeted rules.

  - external_key: technical.mobile.image_memory_management
    competency_key: mobile_development
    topic: Image memory management
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A photo gallery screen causes out-of-memory crashes on mid-range phones. Explain how image memory actually works on
      mobile and what you'd change.
    expected_concepts:
      - decoded bitmap size is width times height times bytes per pixel, not file size
      - downsampling to display size when decoding
      - memory cache sizing and eviction
      - reusing bitmaps and releasing off-screen images
      - responding to memory warnings or trim callbacks
    rubric:
      excellent: Explains decoded memory cost, downsamples to target size, bounds caches and responds to memory pressure, ideally with numbers to show the impact.
      good: Knows full-resolution decoding is the problem and resizes images.
      weak: Increases heap size or blames the device.
    followups:
      - Roughly how much memory does a 12 megapixel photo take when decoded?
      - What should you release when the system signals memory pressure?
    common_errors:
      - Assuming a 2 megabyte JPEG uses 2 megabytes in memory.

  - external_key: technical.mobile.shared_state_data_races
    competency_key: mobile_development
    topic: Thread safety in mobile apps
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Tell me about a race condition or threading bug you've hit in a mobile app. How did you find it, and how do you design
      shared state to avoid those bugs in the first place?
    expected_concepts:
      - shared mutable state accessed from several threads
      - confinement to one thread or actor, immutable data
      - Swift actors and Sendable checks, Kotlin Mutex or single-threaded dispatchers
      - tools such as Thread Sanitizer
      - reproducing intermittent bugs with stress tests
    rubric:
      excellent: Gives a real example with how it was diagnosed, explains confinement, immutability and actors or mutexes as design tools, and mentions detection tools.
      good: Describes a real threading bug and a reasonable fix using locks or confinement.
      weak: Fixes threading issues with delays or cannot give an example.
    followups:
      - How do Swift's strict concurrency checks change how you write this code?
      - Why can a lock on the main thread lead to an ANR?
    common_errors:
      - Adding sleeps or delays to hide a race.

  - external_key: technical.mobile.token_refresh_storm
    competency_key: mobile_development
    topic: Concurrent token refresh
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When the access token expires, the home screen fires six requests at once, they all get a 401, and the app sends six refresh
      requests and sometimes logs the user out. How would you fix the networking layer?
    expected_concepts:
      - single in-flight refresh shared by all waiting requests
      - authenticator or interceptor that queues and retries after refresh
      - refresh token rotation and why parallel refreshes invalidate each other
      - proactive refresh before expiry
      - only log out on a definitive refresh failure
    rubric:
      excellent: Serialises refresh into one shared operation, queues and replays waiting requests, explains rotation-induced logouts, refreshes proactively and logs out only on definitive failure.
      good: Ensures only one refresh happens at a time and retries the failed requests.
      weak: Logs the user out on any 401 or adds random delays.
    followups:
      - The refresh request itself times out. What should the waiting requests do?
      - How would you test this concurrency in a unit test?
    common_errors:
      - Each failing request triggering its own refresh call.

  - external_key: technical.mobile.screenshot_tests
    competency_key: testing
    topic: Screenshot and snapshot testing
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How have you used screenshot or snapshot tests for mobile UI, and what makes them valuable rather than a constant source
      of noise?
    expected_concepts:
      - rendering components in many states, sizes, themes and locales
      - deterministic rendering (fixed fonts, devices, time and data)
      - reviewing diffs as part of code review
      - running on JVM or simulator for speed (Paparazzi, Roborazzi, swift-snapshot-testing)
      - limiting scope to components and key screens
    rubric:
      excellent: Describes deterministic snapshot setup across states, themes and text sizes, integrates diff review into pull requests and keeps the suite focused to avoid noise.
      good: Uses snapshot tests for key components and updates them deliberately.
      weak: Records snapshots without review or abandons them because they break often.
    followups:
      - Snapshots differ between developer machines and CI. How do you fix that?
      - Which bugs do snapshot tests catch that unit tests miss?
    common_errors:
      - Re-recording failing snapshots without checking the diff.

  - external_key: technical.mobile.outdated_rn_upgrade
    competency_key: mobile_development
    topic: Upgrading an outdated framework
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You join a team whose React Native app is five major versions behind, and the stores will soon require a newer target SDK.
      How would you plan the upgrade?
    expected_concepts:
      - step through versions using the upgrade helper or diff
      - audit and update third-party libraries first
      - upgrade on a branch with automated tests and smoke checks
      - native project changes (Gradle, CocoaPods, Xcode settings)
      - beta release and staged rollout
    rubric:
      excellent: Plans incremental version steps, audits dependencies, updates native project config, relies on tests and a beta channel, and keeps the deadline in view with clear milestones.
      good: Upgrades step by step and fixes broken libraries along the way.
      weak: Tries to jump straight to the latest version in one large change with no testing plan.
    followups:
      - How do you keep feature work going on the main branch during the upgrade?
      - How would you prevent the app falling this far behind again?
    common_errors:
      - Underestimating native build configuration changes between versions.

  - external_key: technical.mobile.flutter_platform_channels
    competency_key: mobile_development
    topic: Flutter platform integration
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your Flutter app needs a native SDK that only exists for iOS and Android. How do you integrate it, and how do you keep that
      boundary maintainable?
    expected_concepts:
      - method channels and event channels
      - type-safe generated bindings with Pigeon or FFI for C libraries
      - threading on the native side and returning to the platform thread
      - wrapping in a plugin with a Dart interface and fakes for tests
      - consistent error handling across platforms
    rubric:
      excellent: Uses typed bindings or channels wrapped in a plugin with a clean Dart API, handles threading and errors consistently and keeps the boundary testable with fakes.
      good: Uses method channels and can explain how results return to Dart.
      weak: Scatters raw channel calls with string method names throughout the app.
    followups:
      - How would you stream continuous events from the native SDK into Dart?
      - What happens if the native call is slow and runs on the main thread?
    common_errors:
      - Untyped string-based channel calls that break silently when renamed.

  - external_key: technical.mobile.purchases_not_unlocking
    competency_key: mobile_development
    topic: In-app purchases
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some users say they paid for a subscription in your app but premium features never unlocked. How would you investigate,
      and how should purchases be handled to avoid this?
    expected_concepts:
      - transaction listener running from app launch
      - server-side receipt or purchase token validation
      - finishing or acknowledging transactions only after entitlement is granted
      - restore purchases and cross-device entitlements
      - store server notifications for renewals and refunds
    rubric:
      excellent: Checks for missed or unacknowledged transactions, validates purchases on the server, grants entitlements before finishing transactions, supports restore and uses server notifications for lifecycle events.
      good: Validates receipts on a server and listens for pending transactions on launch.
      weak: Unlocks features based only on a client callback with no restore or validation.
    followups:
      - What happens on Android if you never acknowledge a purchase?
      - How would you support a user who bought on iOS and now uses Android?
    common_errors:
      - Finishing the transaction before the entitlement is saved.

  - external_key: technical.mobile.deep_link_input_validation
    competency_key: security
    topic: Securing app entry points
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Deep links, intents and other apps can all open screens in your app with data you didn't create.
      How do you secure those entry points?
    expected_concepts:
      - treat all incoming parameters as untrusted input
      - avoid exported components that don't need to be exported
      - never perform sensitive actions directly from a link without confirmation and auth
      - validate URLs before loading them in web views
      - intent redirection and pending intent risks on Android
    rubric:
      excellent: Treats incoming data as untrusted, minimises exported components, requires authentication and confirmation for sensitive actions, validates URLs and knows Android-specific intent risks.
      good: Validates link parameters and requires login before sensitive screens.
      weak: Lets a link trigger actions such as payments or loads any URL it is given.
    followups:
      - A link opens an in-app web view with a URL parameter. What could go wrong?
      - How would you review an Android manifest for exposed components?
    common_errors:
      - Loading arbitrary URLs from deep link parameters into an authenticated web view.

  - external_key: technical.mobile.low_end_device_market
    competency_key: mobile_development
    topic: Performance on low-end devices and slow networks
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      The business is expanding into a market where most users have entry-level Android phones with 2 gigabytes of RAM and
      patchy 3G. What would you change or test in the app before launch?
    expected_concepts:
      - testing on real low-end devices and throttled networks
      - reducing memory footprint and app size
      - lighter images and payloads, compression and caching
      - offline-tolerant flows and clear loading states
      - startup and frame performance budgets
    rubric:
      excellent: Tests on representative devices and networks, sets performance budgets, trims size, memory and payloads, and makes key flows tolerant of slow or missing connectivity.
      good: Tests on low-end devices and reduces image and payload sizes.
      weak: Assumes the app is fine because it runs well on flagship phones.
    followups:
      - Which metrics would you watch in the first month after launch?
      - Would you consider a lighter version of the app, and what are the costs?
    common_errors:
      - Only testing on an emulator with network throttling.

  - external_key: technical.mobile.crash_prioritisation
    competency_key: debugging
    topic: Crash triage and prioritisation
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your crash dashboard lists two hundred distinct crash issues. How do you decide which to fix first, and what metrics
      do you use to track overall stability?
    expected_concepts:
      - crash-free users versus crash-free sessions
      - impact by users affected, frequency and trend
      - regressions in new versions versus long-standing issues
      - crashes in critical flows such as login or checkout
      - grouping quality and merging duplicates
    rubric:
      excellent: Prioritises by user impact, trend and criticality of the flow, separates new regressions from old noise, tracks crash-free users and sessions with targets, and fixes grouping issues.
      good: Prioritises by number of users affected and focuses on new regressions.
      weak: Fixes crashes in the order listed or only by raw event count.
    followups:
      - One crash affects few users but always happens during payment. Where does it rank?
      - What crash-free rate would you set as a target, and why?
    common_errors:
      - Ranking by event count, which over-weights a few users who crash repeatedly.

  # ------------------------------------------------------------------ hard
  - external_key: technical.mobile.delta_sync_protocol
    competency_key: api_design
    topic: Incremental sync protocol
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your app downloads a user's entire dataset of tens of thousands of records every time it syncs.
      How would you design an incremental sync between the server and the app?
    expected_concepts:
      - change feed or sync token per client
      - server-side change tracking with monotonic sequence numbers
      - tombstones so deletions propagate
      - paging large change sets and resumable sync
      - full resync fallback when tokens expire
      - permissions changes that remove access to records
    rubric:
      excellent: Designs a cursor-based change feed with monotonic sequences, tombstones, paging and resumability, a full-resync fallback and handling for access changes.
      good: Uses an updated-since timestamp or token with deletions handled.
      weak: Uses device clock timestamps and forgets deletions.
    followups:
      - Why is updated-since with server timestamps risky under concurrent writes?
      - How long should the server keep tombstones?
    common_errors:
      - Not propagating deletes, so removed records live forever on devices.

  - external_key: technical.mobile.logged_out_after_restart
    competency_key: security
    topic: Keychain availability and data protection
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After a release, some iOS users are randomly logged out, mostly early in the morning. Logs show the app could not read
      the stored token during a background refresh. What's going on, and how would you fix it?
    expected_concepts:
      - Keychain accessibility classes and data protection
      - items unavailable before first unlock after a restart or while locked
      - background tasks running while the device is locked
      - treat read failure as unavailable, not as logged out
      - choosing after-first-unlock accessibility where appropriate
    rubric:
      excellent: Connects the timing to the device being locked or just restarted, explains Keychain accessibility classes, fixes the logic to distinguish unavailable from missing and chooses an appropriate accessibility level with its security trade-off.
      good: Identifies Keychain access restrictions while locked and adjusts accessibility.
      weak: Blames the server or adds retries without understanding data protection.
    followups:
      - What is the security cost of moving to after-first-unlock?
      - How would you reproduce this reliably on a test device?
    common_errors:
      - Clearing the session whenever a Keychain read fails.

  - external_key: technical.mobile.performance_regression_gates
    competency_key: testing
    topic: Catching performance regressions in CI
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Performance keeps regressing between releases and nobody notices until users complain. How would you build automated
      performance checks into the development process?
    expected_concepts:
      - macrobenchmarks or XCTest metrics on real devices
      - key journeys measured (startup, scroll, screen load)
      - noise control (dedicated devices, multiple iterations, statistics)
      - thresholds and trend tracking rather than single runs
      - field monitoring as a complement to lab tests
    rubric:
      excellent: Defines key journeys, runs benchmarks on dedicated real devices with repeated iterations and statistical thresholds, tracks trends and pairs lab gates with field metrics.
      good: Adds automated benchmarks for startup and scrolling to CI with thresholds.
      weak: Relies on manual testing or single noisy emulator runs.
    followups:
      - Benchmark results vary by ten percent between runs. How do you set a threshold?
      - How do you attribute a regression to a specific change?
    common_errors:
      - Running benchmarks on emulators and trusting single measurements.

  - external_key: technical.mobile.excessive_wakeups_vitals
    competency_key: mobile_development
    topic: Android vitals and background behaviour
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Play Console warns that your app has excessive wakeups and stuck partial wake locks, which can hurt its visibility in the store.
      How would you find the code responsible and fix it?
    expected_concepts:
      - vitals breakdown by wake lock tag and alarm
      - named wake lock tags and auditing SDKs that hold them
      - replacing exact alarms with WorkManager or inexact scheduling
      - releasing wake locks in finally blocks with timeouts
      - verifying with field vitals after release
    rubric:
      excellent: Uses wake lock and alarm tags to locate sources including third-party SDKs, replaces exact alarms with system-scheduled work, ensures wake locks are released with timeouts and confirms the fix in vitals.
      good: Finds the alarms or wake locks and moves to WorkManager.
      weak: Ignores the warning or cannot explain what a wake lock does.
    followups:
      - The wake lock belongs to a third-party SDK. What can you do?
      - Why do exact alarms hurt battery more than inexact ones?
    common_errors:
      - Acquiring wake locks without a timeout or release in error paths.

  - external_key: technical.mobile.architecture_for_large_team
    competency_key: system_design
    topic: App architecture at scale
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Imagine an app where fifty engineers in eight feature teams all ship code every week. What architecture and conventions
      would you put in place so teams can move independently without breaking each other?
    expected_concepts:
      - feature modules with owned boundaries and public APIs
      - shared design system and core libraries with clear owners
      - navigation and dependency contracts between features
      - feature flags and per-team release gating
      - automated checks (dependency rules, tests, CODEOWNERS)
      - architecture decision records and lightweight governance
    rubric:
      excellent: Describes owned feature modules with explicit contracts, shared platform layers with owners, automated enforcement of dependency rules, feature flags for independent shipping and lightweight governance.
      good: Proposes feature modules and shared libraries with some ownership rules.
      weak: Relies on everyone following conventions informally in one shared codebase.
    followups:
      - How do you evolve a shared core library without blocking every team?
      - Who owns the app's startup time when every team adds something to it?
    common_errors:
      - A shared utilities module that grows without an owner.

  - external_key: technical.mobile.widget_extension_data_sharing
    competency_key: mobile_development
    topic: App extensions and widgets
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You're adding a home screen widget and a share extension to an existing app. How do they get data and authentication from
      the main app, and what constraints do you have to design around?
    expected_concepts:
      - separate processes with app groups or shared containers
      - shared Keychain access groups for tokens
      - strict memory and execution limits for extensions
      - widget timelines or update schedules controlled by the system
      - concurrent database access across processes
    rubric:
      excellent: Explains separate processes and sharing through app groups and Keychain groups, designs for tight memory and runtime limits and system-controlled refresh, and handles safe cross-process database access.
      good: Uses shared containers and Keychain groups and knows extensions have limits.
      weak: Assumes the extension can call into the running main app's memory.
    followups:
      - How do you refresh the widget when data changes in the main app?
      - What happens if the main app and extension write to the database at the same moment?
    common_errors:
      - Opening the same database from two processes without coordination.

  - external_key: technical.mobile.third_party_sdk_startup_crash
    competency_key: debugging
    topic: Third-party SDK risk
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      An analytics SDK pushes a server-side configuration change and suddenly five percent of your users crash on startup,
      even though you didn't release anything. How do you respond now, and what would you change afterwards?
    expected_concepts:
      - identify the SDK from crash stacks and correlate with timing
      - contact the vendor to revert the configuration
      - remote kill switch to skip initialising the SDK
      - wrap third-party initialisation defensively and defer it
      - vendor risk review and limits on remote-configurable SDK behaviour
    rubric:
      excellent: Confirms the SDK from stacks and timing, gets the vendor to revert while using a kill switch if available, and afterwards isolates and defers SDK initialisation with remote control and a vendor risk policy.
      good: Identifies the SDK, escalates to the vendor and plans a release that guards its initialisation.
      weak: Waits for the vendor to fix it with no mitigation or blames users' devices.
    followups:
      - If you had no kill switch, what's the fastest way to protect users?
      - How would you evaluate a new SDK before adding it to the app?
    common_errors:
      - Initialising every SDK synchronously at startup with no way to turn them off.
