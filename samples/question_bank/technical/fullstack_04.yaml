# Curated questions: full-stack engineering (part 4 of 4) — debugging across the stack, observability, testing
# and end-to-end feature design. `defaults` are merged into every question (question keys win). Round types
# follow difficulty: easy -> technical_screening + combined, medium -> + deep_technical, hard -> deep_technical + combined.
version: 1
defaults:
  role_tags: [fullstack]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------- debugging across the stack
  - external_key: technical.fullstack.browser_error_to_backend_logs
    competency_key: observability
    topic: Correlating browser errors with server logs
    difficulty: medium
    kind: technical
    text: >-
      A user sends a screenshot of an error message. How would you set things up so you can go from that
      screenshot straight to the matching backend logs and database queries?
    expected_concepts:
      - request or correlation id generated per request and returned in responses
      - id shown in the UI error and attached to frontend error reports
      - trace context propagated through services and jobs
      - structured logs searchable by that id
      - user and session identifiers without logging personal data
    rubric:
      excellent: Designs end-to-end correlation with an id surfaced in the UI, propagated through services and background jobs, and searchable in structured logs and traces, while keeping personal data out of logs.
      good: Adds a request id to responses and logs.
      weak: Relies on matching timestamps by hand.
    followups:
      - How does the id follow work that is handed to a background job?
      - What would you show the user so support can find the request?
    common_errors:
      - Generating ids only on the server so frontend error reports cannot be linked.

  - external_key: technical.fullstack.works_locally_fails_staging
    competency_key: debugging
    topic: Works locally, fails in staging
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A feature you built works perfectly on your machine, but in staging the same action returns a 500 error.
      How would you go about finding the cause?
    expected_concepts:
      - read the server logs and stack trace for that request first
      - compare configuration, environment variables and secrets
      - differences in data, migrations or service versions
      - reproduce against staging-like data locally
      - check the deployed version is what you think it is
    rubric:
      excellent: Starts with evidence from logs, then works through a structured list of environment differences, confirms the deployed version, and reproduces the issue before fixing.
      good: Checks logs and compares configuration between environments.
      weak: Redeploys or makes speculative changes without looking at logs.
    followups:
      - The logs show nothing useful. What next?
      - How would you stop this class of problem reaching staging?
    common_errors:
      - Assuming the code deployed to staging is the same as the local branch.

  - external_key: technical.fullstack.slow_page_breakdown
    competency_key: debugging
    topic: Finding where page load time goes
    difficulty: medium
    kind: scenario
    text: >-
      A key page takes around six seconds to become usable. How would you work out how much of that is the
      browser, the network, the API and the database, and decide what to fix first?
    expected_concepts:
      - browser performance and network waterfall to separate client and server time
      - server timing or traces per request broken into spans
      - slow query logs and query plans
      - request waterfalls and blocking resources on the client
      - real-user metrics versus a fast developer machine
      - prioritising by impact on the user
    rubric:
      excellent: Breaks the six seconds down layer by layer with real tools, distinguishes waterfalls from slow individual calls, validates with real-user data and prioritises fixes by measured impact.
      good: Uses browser tools and backend timing to find the biggest contributor.
      weak: Jumps to a favourite optimisation such as adding a cache without measuring.
    followups:
      - The API is fast in traces but slow from the browser. What could explain that?
      - How would you keep this page from getting slow again?
    common_errors:
      - Measuring only on a fast machine and network.

  - external_key: technical.fullstack.intermittent_502s
    competency_key: debugging
    topic: Intermittent 502 errors
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      About one in a thousand requests returns a 502 from the load balancer, with no matching error in your
      application logs. How would you investigate?
    expected_concepts:
      - 502 means the proxy got a bad or no response from upstream
      - keep-alive timeout mismatch where the app closes idle connections first
      - instances restarting, being killed or failing during deploys
      - load balancer access logs and upstream connection errors
      - correlating timing with deploys, autoscaling and memory limits
      - graceful shutdown and connection draining
    rubric:
      excellent: Reasons from what a 502 means, checks proxy logs for upstream errors, considers keep-alive mismatches, restarts and draining, and correlates with deploys or scaling events.
      good: Looks at load balancer logs and suspects instances restarting.
      weak: Adds retries in the frontend without finding the cause.
    followups:
      - Why would the app's keep-alive timeout need to be longer than the load balancer's?
      - How would you verify graceful shutdown actually works?
    common_errors:
      - Searching only application logs for an error that the proxy generated.

  - external_key: technical.fullstack.frontend_error_reporting
    competency_key: observability
    topic: Monitoring errors in the frontend
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you find out about errors that happen in users' browsers in production? Tell me what you've set up
      and what it caught.
    expected_concepts:
      - error tracking tool with global handlers and error boundaries
      - uploading source maps privately for readable stack traces
      - release version and route attached to each report
      - filtering noise from extensions and third-party scripts
      - avoiding personal data in error payloads
    rubric:
      excellent: Describes a working setup with source maps, release tagging, noise filtering and privacy controls, and gives a real example of a bug it surfaced.
      good: Uses an error tracking tool with source maps.
      weak: Relies on users reporting problems.
    followups:
      - How do you keep browser extensions from flooding your error reports?
      - How would you know a release made things worse?
    common_errors:
      - Publishing source maps publicly without considering what they expose.

  - external_key: technical.fullstack.save_button_does_nothing
    competency_key: debugging
    topic: Vague bug report triage
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A customer writes in saying the Save button doesn't work. That's all the detail you get. How would you go
      from that to a reproducible bug?
    expected_concepts:
      - gather account, page, time, browser and the exact steps
      - check error tracking and server logs for that user and time
      - check whether a request was sent and what came back
      - try to reproduce with the same data and permissions
      - distinguishing no request, failed request and silent success
    rubric:
      excellent: Gathers specific context, uses logs and error tracking to find the user's requests, separates the possible failure points and reproduces with matching data before changing code.
      good: Asks for steps and checks logs.
      weak: Tries it once on their own account and closes it as cannot reproduce.
    followups:
      - The request succeeded but nothing changed. What would you look at?
      - What would you change so the next report like this is easier?
    common_errors:
      - Testing only as an admin user with clean data.

  - external_key: technical.fullstack.devtools_and_server_logs
    competency_key: debugging
    topic: Using browser tools with server logs
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Pick a real bug you've chased that crossed the frontend and the backend. How did you use the browser's
      developer tools together with server-side logs to pin it down?
    expected_concepts:
      - network tab to inspect request payload, headers, status and timing
      - console errors and breakpoints in the frontend
      - matching the request to server logs
      - replaying the request with curl or an API client
      - narrowing whether the client sent bad data or the server mishandled good data
    rubric:
      excellent: Tells a specific story that shows deliberate use of the network tab, request replay and server logs to decide which side was at fault, ending with a verified fix.
      good: Describes using the network tab and logs sensibly in a real example.
      weak: Stays generic or describes only adding print statements.
    followups:
      - How did you confirm the fix?
      - Which part of that investigation took longest, and why?
    common_errors:
      - Not checking the actual request payload before blaming the backend.

  # ------------------------------------------------------------- testing
  - external_key: technical.fullstack.contract_tests_frontend_api
    competency_key: testing
    topic: Contract tests between UI and API
    difficulty: medium
    kind: technical
    text: >-
      Unit tests on both sides pass, yet the frontend still breaks when the API changes. How would you use
      contract tests to catch that, and where would they run?
    expected_concepts:
      - consumer-driven contracts or schema-based checks
      - the frontend's expectations recorded and verified against the provider
      - running verification in the provider's CI before merge
      - versioned contracts for clients still deployed
      - contract tests complement rather than replace end-to-end tests
    rubric:
      excellent: Explains how contracts are produced and verified, runs verification in the provider pipeline, accounts for older deployed clients and positions contract tests against end-to-end tests.
      good: Proposes schema or contract checks in CI.
      weak: Proposes only more end-to-end tests or mocking the API in frontend tests.
    followups:
      - Who owns the contract when two teams disagree?
      - What can contract tests not catch?
    common_errors:
      - Using hand-written mocks that drift from the real API.

  - external_key: technical.fullstack.e2e_test_data_and_login
    competency_key: testing
    topic: Test data and login in browser tests
    difficulty: medium
    kind: technical
    text: >-
      For browser-based end-to-end tests running in CI, how do you handle test data and logging in so the tests
      are fast and don't interfere with each other?
    expected_concepts:
      - seeding data through APIs or fixtures per test
      - unique data per test to allow parallel runs
      - logging in programmatically and reusing session state instead of the UI each time
      - one test that does cover the real login flow
      - resetting or isolating the database between runs
    rubric:
      excellent: Isolates data per test, logs in programmatically with saved state, still covers the real login once, and explains how this enables parallelism and reliable reruns.
      good: Seeds data and avoids logging in through the UI every time.
      weak: Shares one test account and fixed data across all tests.
    followups:
      - A test leaves data behind that breaks another test. How do you prevent it?
      - What does your CI database look like for these tests?
    common_errors:
      - Tests depending on the order they run in.

  - external_key: technical.fullstack.test_plan_for_feature
    competency_key: testing
    topic: Testing a feature that spans the stack
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Suppose you've just built a feature that adds a form, a new endpoint and a new table. Which tests would you
      write for it, and what would each one prove?
    expected_concepts:
      - unit tests for validation and business rules
      - API tests for status codes, authorization and persistence
      - component tests for form behaviour and error display
      - one end-to-end happy path through the real stack
      - migration tested against realistic data
    rubric:
      excellent: Proposes a balanced set at each level, says what each test proves, includes authorization and error paths, and keeps end-to-end coverage lean.
      good: Covers unit, API and UI tests with reasonable intent.
      weak: Writes only end-to-end tests or only unit tests with mocks everywhere.
    followups:
      - Which of those tests would you skip if you were short on time, and why?
      - How would you test that another user cannot read the new data?
    common_errors:
      - Forgetting to test the unauthorised path.

  # ------------------------------------------------------------- performance and data issues
  - external_key: technical.fullstack.new_filter_slows_queries
    competency_key: databases
    topic: A new UI filter making queries slow
    difficulty: medium
    kind: scenario
    text: >-
      You shipped new filter and sort options on a list page, and now the page is slow for your largest
      customers. How would you find the problem and fix it without removing the feature?
    expected_concepts:
      - capture the slow queries and look at the execution plans
      - indexes that match common filter and sort combinations
      - avoiding leading-wildcard searches and functions on indexed columns
      - keyset pagination and limiting total counts
      - search engine or materialised views for very flexible filtering
    rubric:
      excellent: Finds the actual slow queries, reads plans, adds indexes for the common combinations, rethinks expensive counts and pagination, and knows when flexible filtering needs a search index.
      good: Checks the query plan and adds an index.
      weak: Adds an index on every column or caches the whole page.
    followups:
      - Users can combine eight filters. How do you choose which indexes to add?
      - Do you really need the exact total count?
    common_errors:
      - Testing against a small dataset that hides the problem.

  - external_key: technical.fullstack.bundle_size_regression
    competency_key: frontend_react
    topic: A sudden bundle size jump
    difficulty: medium
    kind: scenario
    text: >-
      After adding a charting library, your main JavaScript bundle grew by over a megabyte and the app loads
      noticeably slower on phones. How would you investigate and fix it?
    expected_concepts:
      - bundle analyser to see what was added
      - lazy-loading the charts route or component
      - tree shaking and importing only the needed modules
      - lighter alternative libraries
      - size budgets enforced in CI
    rubric:
      excellent: Measures with an analyser, splits the library out of the critical path, checks tree shaking and alternatives, and adds a CI budget to prevent repeats.
      good: Uses code splitting to load the library only where needed.
      weak: Accepts the cost or relies only on compression.
    followups:
      - How would you know whether users actually got slower?
      - What budget would you set, and what happens when a PR exceeds it?
    common_errors:
      - Importing the whole library through a barrel file so tree shaking cannot help.

  - external_key: technical.fullstack.garbled_characters_round_trip
    competency_key: debugging
    topic: Text corrupted between layers
    difficulty: medium
    kind: scenario
    text: >-
      Names containing characters like é or emoji look fine when typed, but show up garbled in the admin panel
      and in CSV exports. How would you find where the text gets corrupted?
    expected_concepts:
      - checking the bytes at each hop from form to database to export
      - UTF-8 throughout, including database and connection settings
      - legacy charsets such as utf8 versus utf8mb4 in MySQL
      - CSV opened in spreadsheets needing a byte order mark or explicit encoding
      - normalisation and length limits counted in characters versus bytes
    rubric:
      excellent: Inspects the actual bytes at each layer, identifies where the encoding changes, fixes configuration end to end and handles the spreadsheet import quirk separately.
      good: Suspects encoding mismatches and checks database settings.
      weak: Strips special characters from input.
    followups:
      - How would you repair the rows already stored incorrectly?
      - What does a length limit of fifty mean for an emoji-heavy name?
    common_errors:
      - Fixing the display while leaving corrupted data in the database.

  - external_key: technical.fullstack.overselling_last_item
    competency_key: databases
    topic: Overselling stock under concurrency
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      During a flash sale, you sold more units of a product than you had in stock. The code checks stock, then
      creates the order. Walk me through why that happened and how you'd fix it.
    expected_concepts:
      - check-then-act race between concurrent requests
      - atomic conditional update that decrements only when stock remains
      - row locking with select for update and its cost
      - reservation with expiry for items held in carts
      - testing with concurrent requests to prove the fix
      - handling the oversold orders already placed
    rubric:
      excellent: Explains the race precisely, fixes it with an atomic conditional update or appropriate locking, considers reservations and contention under load, proves it with a concurrent test and plans for existing oversold orders.
      good: Identifies the race and proposes a lock or atomic update.
      weak: Adds a second stock check or a sleep.
    followups:
      - How does your fix behave when ten thousand people hit Buy at once?
      - How would you write a test that reliably reproduces the race?
    common_errors:
      - Relying on an application-level lock when several server instances are running.

  - external_key: technical.fullstack.repair_corrupted_records
    competency_key: debugging
    topic: Fixing a bug that already damaged data
    difficulty: medium
    kind: scenario
    text: >-
      A bug in last week's release has been writing wrong values into some customer records. You've found the
      code fix. How do you repair the data that's already wrong?
    expected_concepts:
      - identify affected records precisely, using logs, timestamps or audit trails
      - backup or snapshot before changing anything
      - repair script that is idempotent, tested on a copy and run in batches
      - dry run with counts reviewed before applying
      - records changed by users since the bug need care
      - communicating with affected customers
    rubric:
      excellent: Scopes the damage precisely, backs up, writes an idempotent tested repair with a dry run, handles records edited since, and plans communication.
      good: Writes a script to fix affected rows after taking a backup.
      weak: Runs an ad hoc update in production without scoping or backup.
    followups:
      - How do you tell a wrong value from one a user legitimately changed later?
      - Who reviews the repair before it runs?
    common_errors:
      - Overwriting changes customers made after the bug.

  - external_key: technical.fullstack.logging_without_personal_data
    competency_key: observability
    topic: What to log across the stack
    difficulty: medium
    kind: technical
    text: >-
      What do you log on the frontend and the backend for a typical feature, and how do you make sure passwords,
      tokens and personal details never end up in those logs?
    expected_concepts:
      - structured logs with levels and request context
      - logging events and outcomes rather than raw payloads
      - central redaction of sensitive fields and headers
      - avoiding tokens in URLs because URLs get logged
      - retention and access control for logs
    rubric:
      excellent: Describes structured, purposeful logging with request context, central redaction, awareness of URLs and third-party tools as leak paths, and sensible retention and access.
      good: Logs useful context and redacts obvious secrets.
      weak: Logs full request and response bodies by default.
    followups:
      - Where else can a token leak besides your own logs?
      - How would you find out if secrets were already logged?
    common_errors:
      - Logging the Authorization header or full request bodies during debugging and leaving it on.

  - external_key: technical.fullstack.user_journey_alerting
    competency_key: observability
    topic: Monitoring a critical user journey
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you monitor a signup-to-first-purchase journey end to end, so you'd find out it's broken before
      customers or the business tell you?
    expected_concepts:
      - service-level indicators for each step such as success rate and latency
      - synthetic checks that run the journey continuously
      - real-user monitoring from the browser
      - business metrics such as conversion as a signal
      - alerting on symptoms with sensible thresholds and runbooks
    rubric:
      excellent: Combines per-step indicators, synthetic journeys, browser telemetry and business conversion metrics, alerts on user-facing symptoms and explains how to avoid noisy alerts.
      good: Adds synthetic checks and error rate alerts on the main endpoints.
      weak: Monitors only CPU and server uptime.
    followups:
      - Conversion drops but no errors fire. How would you notice?
      - How do you keep synthetic tests from polluting real data?
    common_errors:
      - Alerting only on server errors and missing failures that happen in the browser.

  - external_key: technical.fullstack.launch_load_test
    competency_key: testing
    topic: Load testing before a launch
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Marketing expects ten times the usual traffic for a launch next month. How would you load test the full
      application realistically and decide whether you're ready?
    expected_concepts:
      - modelling realistic user journeys and traffic mix
      - production-like environment and data volumes
      - ramping load and finding the breaking point, not just a target
      - watching database, connection pools, queues and third-party limits
      - fixing bottlenecks and retesting, plus a plan for degradation
    rubric:
      excellent: Models realistic traffic, tests in a representative environment, finds limits and the first bottleneck, accounts for dependencies such as third-party rate limits, and ends with fixes and a degradation plan.
      good: Runs a load test against the main endpoints and watches key metrics.
      weak: Hammers one endpoint from a laptop and calls it done.
    followups:
      - Which component would you expect to break first, and why?
      - How do you load test without calling the real payment provider?
    common_errors:
      - Testing with a tiny dataset where every query hits the cache.

  # ------------------------------------------------------------- security and quality practices
  - external_key: technical.fullstack.csp_rollout_existing_app
    competency_key: security
    topic: Introducing a Content Security Policy
    difficulty: medium
    kind: technical
    text: >-
      How would you introduce a Content Security Policy to an existing app that uses inline scripts and several
      third-party tools, without breaking it in production?
    expected_concepts:
      - start in report-only mode and collect violations
      - inventory of scripts, styles and third-party origins
      - nonces or hashes instead of unsafe-inline
      - tightening gradually and enforcing per route where needed
      - monitoring violation reports after enforcement
    rubric:
      excellent: Rolls out in report-only mode, inventories sources, removes inline code or uses nonces, tightens in steps and keeps monitoring after enforcement.
      good: Uses report-only first and then enforces a reasonable policy.
      weak: Enables a strict policy directly or allows everything with wildcards.
    followups:
      - How do nonces work with server-rendered pages?
      - A marketing tag needs to inject scripts. How do you handle it?
    common_errors:
      - Allowing unsafe-inline, which removes most of the XSS protection.

  - external_key: technical.fullstack.vulnerable_dependency_alert
    competency_key: security
    topic: Responding to a vulnerable dependency
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An automated alert says one of your npm packages has a critical vulnerability. How do you decide how urgent
      it really is, and how do you handle it?
    expected_concepts:
      - check whether the vulnerable code path is reachable in your app
      - direct versus transitive dependency
      - upgrade, override or patch, then run the test suite
      - lockfiles and reproducible builds
      - regular dependency updates to keep upgrades small
    rubric:
      excellent: Assesses real exploitability, chooses an upgrade or override path for direct or transitive packages, verifies with tests and explains habits that keep this cheap.
      good: Upgrades the package and runs tests.
      weak: Ignores the alert or upgrades every dependency at once without testing.
    followups:
      - There is no fixed version yet. What do you do?
      - How do you keep dependencies from drifting years out of date?
    common_errors:
      - Assuming dev-only or transitive dependencies never matter.

  - external_key: technical.fullstack.reviewing_cross_stack_pr
    competency_key: code_quality
    topic: Reviewing a pull request across UI and API
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you review a pull request that touches both the UI and the API, what do you look for beyond whether
      the code works?
    expected_concepts:
      - authorization and input validation on new endpoints
      - backwards compatibility of the API change
      - error and loading states in the UI
      - migrations and performance of new queries
      - tests at the right levels and readable naming
    rubric:
      excellent: Gives a prioritised checklist covering security, compatibility, data and performance, UX states and tests, with an example of something they caught in review.
      good: Mentions several relevant concerns beyond style.
      weak: Focuses only on formatting and naming.
    followups:
      - What was the most important thing you have caught in a review?
      - How do you handle a review where you disagree with the design?
    common_errors:
      - Approving API changes without checking existing clients.

  - external_key: technical.fullstack.team_invitations_design
    competency_key: system_design
    topic: Designing team invitations end to end
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Let's design a feature end to end. Admins can invite people to their team by email, invitees accept and get
      the right role. Walk me through the data model, the API, the emails and the UI states.
    expected_concepts:
      - invitation record with token, role, inviter, status and expiry
      - accepting for new versus existing accounts and email mismatch
      - authorization on who can invite and which roles they can grant
      - resend, revoke and expiry handling
      - rate limiting and abuse prevention
      - UI states for pending, accepted, expired and revoked
    rubric:
      excellent: Produces a coherent design across data, API, email and UI, handles existing accounts, mismatched emails, privilege escalation, expiry, revoke and abuse, and explains trade-offs made.
      good: Covers the main flow with tokens, expiry and role assignment.
      weak: Describes only the happy path or lets the invite link grant any role requested.
    followups:
      - The invite was sent to one email but the user signs in with another. What happens?
      - How do you stop an admin granting a role higher than their own?
    common_errors:
      - Trusting a role parameter from the accept request instead of the stored invitation.

  - external_key: technical.fullstack.signups_dropped_no_errors
    competency_key: debugging
    topic: Conversion drop with no errors
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The day after a release, signups drop by thirty percent, but there are no errors in your dashboards and all
      the tests pass. How would you investigate?
    expected_concepts:
      - confirm the drop is real and not a tracking change
      - funnel analysis to find the step where users drop
      - segmenting by browser, device, region and traffic source
      - diffing the release for UI, validation, third-party scripts or redirects
      - session replays or synthetic runs of the signup flow
      - rolling back or flagging off the suspect change to confirm
    rubric:
      excellent: Validates the measurement, finds the failing funnel step, segments to isolate who is affected, inspects the release diff and confirms the cause by reverting or flagging off.
      good: Looks at the funnel and the release changes.
      weak: Waits to see if numbers recover or blames marketing.
    followups:
      - Only one browser is affected. What does that suggest?
      - How would you catch this kind of regression before release next time?
    common_errors:
      - Trusting the absence of errors as proof that the flow works.

  - external_key: technical.fullstack.logout_on_refresh_one_browser
    competency_key: debugging
    topic: Session lost on refresh in one browser
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Users on one particular browser are logged out every time they refresh the page, while everyone else is
      fine. Your app and its API run on different domains. What would you suspect, and how would you prove it?
    expected_concepts:
      - third-party cookie blocking and tracking prevention treating the API cookie as cross-site
      - SameSite None and Secure requirements
      - partitioned cookies and storage restrictions
      - verifying in that browser's tools that the cookie is set but not sent
      - serving the API from the same site or proxying through the app's domain
    rubric:
      excellent: Connects the cross-domain setup to the browser's cookie restrictions, proves it by inspecting set and sent cookies in that browser, and fixes it structurally by moving to a same-site API or proxy.
      good: Suspects cookie handling differences in that browser and checks the cookie attributes.
      weak: Moves the token to localStorage as a quick fix without considering the security trade-off.
    followups:
      - Why does putting the API on a subdomain of the app's domain help?
      - How would you add this scenario to your regular testing?
    common_errors:
      - Assuming all browsers handle cross-site cookies the same way.

  - external_key: technical.fullstack.audit_trail_admin_actions
    competency_key: api_design
    topic: Audit trail for admin changes
    difficulty: medium
    kind: technical
    text: >-
      Customers want to see who changed what in their account settings and when. How would you build an audit
      log that's trustworthy and that you can show in the UI?
    expected_concepts:
      - append-only records with actor, action, target, before and after, timestamp
      - written in the same transaction as the change or via a reliable outbox
      - including system and support actions with the real actor
      - filtering and pagination for display, with tenant scoping
      - retention policy and excluding sensitive values
    rubric:
      excellent: Designs append-only, transactionally consistent records with the real actor, tenant-scoped querying for the UI, careful handling of sensitive values and a retention policy.
      good: Records who, what and when for each change and shows it in a list.
      weak: Relies on application logs or an updated-by column.
    followups:
      - How do you make sure an audit entry is never lost when the change succeeds?
      - Which values would you avoid storing in the audit log?
    common_errors:
      - Writing audit entries outside the transaction so they can go missing or record changes that rolled back.
