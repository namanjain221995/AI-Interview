# Technical: ML engineering (3/4) - drift monitoring and evaluation in production.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [ml]
questions:
  # ------------------------------------------------------------- drift and monitoring
  - external_key: technical.ml_engineering.data_vs_concept_drift
    competency_key: machine_learning
    topic: Data drift versus concept drift
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Explain the difference between data drift and concept drift, using an example from a model you've
      worked on or know well.
    expected_concepts:
      - input distribution changes (data drift)
      - change in the relationship between inputs and target (concept drift)
      - concept drift can happen with stable inputs
      - different detection signals for each
      - different responses such as retraining or redesign
    rubric:
      excellent: Defines both precisely, gives a concrete example of each from real work, and explains how each would be detected and handled differently.
      good: Correct definitions with one reasonable example.
      weak: Treats all drift as the same thing or cannot give an example.
    followups:
      - Which of the two can you detect without labels?
    common_errors:
      - Assuming stable input distributions mean the model is still accurate.

  - external_key: technical.ml_engineering.drift_thresholds
    competency_key: statistics_experimentation
    topic: Drift metrics and alert thresholds
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Which statistical measures have you used to detect feature drift, such as PSI or a KS test, and how do
      you set thresholds so the alerts mean something instead of firing constantly?
    expected_concepts:
      - PSI, KS, Jensen-Shannon or chi-square for categorical features
      - large samples make tiny shifts statistically significant
      - thresholds calibrated on historical variation
      - weighting features by importance
      - choosing reference and comparison windows
    rubric:
      excellent: Uses suitable measures for numeric and categorical features, knows significance tests over-fire on large samples, calibrates thresholds from historical noise and focuses alerts on important features.
      good: Has used a drift measure with fixed thresholds and knows alerts can be noisy.
      weak: Cannot name a drift measure or alerts on any change at all.
    followups:
      - Why can a KS test be misleading with millions of rows?
    common_errors:
      - Alerting on p-values from huge samples, which flags trivially small shifts.

  - external_key: technical.ml_engineering.overnight_drift_alert
    competency_key: mlops
    topic: Triaging a drift alert
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A drift alert fires overnight on one of your model's most important features. Walk me through how you'd
      decide whether it actually needs action.
    expected_concepts:
      - checking for upstream pipeline or schema bugs first
      - size and shape of the shift
      - effect on prediction distribution and any available outcomes
      - whether the change is real-world or seasonal
      - deciding between fix, retrain, rollback or accept
    rubric:
      excellent: Separates data bugs from genuine change, measures the impact on predictions and business metrics, checks seasonality, and chooses a proportionate response with a clear owner.
      good: Investigates whether the data source changed and checks prediction impact.
      weak: Retrains immediately on every alert or ignores alerts.
    followups:
      - How would you tell an upstream bug from a real change in user behaviour?
    common_errors:
      - Retraining on corrupted data and baking the bug into the model.

  - external_key: technical.ml_engineering.silent_unit_change
    competency_key: data_engineering
    topic: Catching silent upstream unit changes
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An upstream team changes a field from dollars to cents without telling you. How would your monitoring
      catch it, and how quickly?
    expected_concepts:
      - range and distribution checks on inputs
      - comparison against recent baselines
      - checks at ingestion rather than only at the model
      - data contracts with upstream owners
      - alert routing to the right owner
    rubric:
      excellent: Describes concrete range and distribution checks at ingestion with a baseline comparison, estimates detection time, and adds contracts so upstream changes are announced.
      good: Proposes distribution or range monitoring that would catch the change.
      weak: Relies on noticing a drop in business metrics later.
    followups:
      - What should the model service do in the hours before the fix lands?
    common_errors:
      - Checking only schema and types, which a unit change does not break.

  - external_key: technical.ml_engineering.model_dashboard_contents
    competency_key: observability
    topic: What a model monitoring dashboard shows
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What would you put on a monitoring dashboard for a production model, beyond standard service metrics like
      latency and error rate?
    expected_concepts:
      - prediction distribution over time
      - input feature distributions and missing rates
      - data freshness
      - quality metrics once outcomes arrive
      - business metrics the model drives
      - breakdowns by important segments
    rubric:
      excellent: Covers inputs, predictions, freshness, delayed quality metrics and business impact, with breakdowns by segment and a clear idea of which panels have alerts.
      good: Includes prediction and input distributions plus accuracy when available.
      weak: Lists only infrastructure metrics.
    followups:
      - Which of those would you alert on, and which would you only chart?
    common_errors:
      - Monitoring the service perfectly while having no view of what the model outputs.

  - external_key: technical.ml_engineering.model_ab_design
    competency_key: statistics_experimentation
    topic: Designing an A/B test for a new model
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you design an online A/B test to decide whether a new model should replace the current one?
    expected_concepts:
      - primary metric and guardrail metrics chosen up front
      - randomisation unit such as user rather than request
      - power analysis for sample size and duration
      - avoiding early peeking or using sequential methods
      - checking that traffic is split as intended
    rubric:
      excellent: Defines primary and guardrail metrics in advance, picks a randomisation unit, sizes the test with power analysis, handles peeking and validates the split before reading results.
      good: Splits traffic, picks a metric and runs for a sensible duration.
      weak: Compares before and after periods or stops as soon as the result looks good.
    followups:
      - Why randomise by user instead of by request for a ranking model?
    common_errors:
      - Stopping the test the first day the result is significant.

  - external_key: technical.ml_engineering.guardrail_regression
    competency_key: statistics_experimentation
    topic: Primary metric wins, guardrail regresses
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your new model wins on the primary metric in an A/B test, but a guardrail metric such as support
      tickets got a little worse. How do you decide what to do?
    expected_concepts:
      - checking whether the guardrail change is statistically real
      - pre-agreed tolerance for guardrails
      - understanding the mechanism behind the regression
      - segment analysis to find who is affected
      - involving stakeholders in the trade-off
    rubric:
      excellent: Checks significance and pre-agreed tolerances, investigates why the guardrail moved and for whom, quantifies the trade-off and brings it to the right decision makers with a recommendation.
      good: Investigates the guardrail change before deciding and weighs both metrics.
      weak: Ships because the primary metric won and ignores the guardrail.
    followups:
      - Could you change the model to keep the gain without the regression?
    common_errors:
      - Setting guardrail tolerances only after seeing the results.

  - external_key: technical.ml_engineering.interleaving_tests
    competency_key: statistics_experimentation
    topic: Interleaving for ranking models
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      For ranking models, when would you use interleaving instead of a standard A/B test, and what are its
      limitations?
    expected_concepts:
      - mixing results from both rankers in one list
      - attributing clicks to each ranker
      - much higher sensitivity with less traffic
      - measures preference, not business impact
      - position bias and team-draft methods
    rubric:
      excellent: Explains how interleaving merges rankings and credits clicks, why it needs far less traffic, its blind spots on business metrics and long-term effects, and uses it as a fast filter before A/B tests.
      good: Understands interleaving compares two rankers in the same list and is more sensitive.
      weak: Has not heard of it or describes it as a regular A/B test.
    followups:
      - Why can't interleaving tell you the change in revenue?
    common_errors:
      - Treating an interleaving win as proof of business impact.

  - external_key: technical.ml_engineering.recommendation_feedback_loop
    competency_key: machine_learning
    topic: Feedback loops from a model's own decisions
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your model decides which items users see, and its training data comes from what users then clicked.
      What problems does that create over time, and how would you counter them?
    expected_concepts:
      - exposure bias since unseen items get no feedback
      - popularity reinforcement and narrowing
      - logging propensities of what was shown
      - exploration traffic or randomisation
      - inverse propensity weighting or counterfactual evaluation
    rubric:
      excellent: Explains exposure and position bias and how they compound, logs propensities, adds controlled exploration, and corrects training or evaluation with propensity-based methods.
      good: Recognises the self-reinforcing loop and suggests some exploration.
      weak: Does not see a problem with training on the model's own outcomes.
    followups:
      - How much exploration would you allow, and how would you limit its cost?
    common_errors:
      - Evaluating new models offline on logs produced by the old model without any correction.

  - external_key: technical.ml_engineering.segment_performance
    competency_key: machine_learning
    topic: Checking performance across segments
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you check that a model performs well across different segments, such as regions, device types or
      new versus returning users, rather than only on average?
    expected_concepts:
      - defining important slices up front
      - per-slice metrics with confidence intervals
      - minimum sample sizes per slice
      - automated slice comparison between model versions
      - finding problem slices with error analysis
    rubric:
      excellent: Defines slices in advance, reports per-slice metrics with uncertainty, gates releases on slice regressions and uses error analysis to discover slices nobody thought of.
      good: Breaks metrics down by a few relevant segments and compares versions.
      weak: Reports only the overall metric.
    followups:
      - How would you handle a slice with very few examples?
    common_errors:
      - Reacting to noisy differences in tiny slices without checking uncertainty.

  - external_key: technical.ml_engineering.outcome_join_pipeline
    competency_key: data_engineering
    topic: Joining predictions with delayed outcomes
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you build the pipeline that joins logged predictions with outcomes that arrive days or weeks
      later, so you can compute real production accuracy?
    expected_concepts:
      - stable prediction ids logged with model version and features
      - outcome events keyed to the same id
      - maturity windows before an outcome counts as negative
      - handling late and corrected outcomes
      - metrics computed per model version and cohort
    rubric:
      excellent: Logs predictions with ids, versions and features, joins outcomes by id with explicit maturity windows, handles late or corrected labels, and reports metrics by version and cohort.
      good: Logs predictions with ids and joins outcomes later to compute metrics.
      weak: Has no plan for linking predictions to outcomes.
    followups:
      - How do you treat a prediction whose outcome hasn't arrived yet?
    common_errors:
      - Counting immature records as negatives and underestimating positive rates.

  - external_key: technical.ml_engineering.shadow_mode_value
    competency_key: mlops
    topic: What shadow deployment can and cannot show
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When would you run a new model in shadow mode, and what does it tell you that offline evaluation
      can't?
    expected_concepts:
      - running on real traffic without affecting users
      - checking latency, errors and resource use in production
      - comparing predictions with the live model
      - catching feature and integration problems
      - cannot measure user response to the new model
    rubric:
      excellent: Explains shadow mode's value for real-traffic integration, latency and prediction comparison, and states clearly that it cannot measure user outcomes, so an online test is still needed.
      good: Knows shadow mode mirrors traffic without serving results and gives one benefit.
      weak: Thinks shadow mode proves the model improves business results.
    followups:
      - How would you mirror traffic without doubling load on the feature store?
    common_errors:
      - Letting the shadow model write side effects such as cache entries or notifications.

  - external_key: technical.ml_engineering.retraining_policy
    competency_key: mlops
    topic: When to retrain a model
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you decide when to retrain a model, whether on a fixed schedule, on drift signals or on measured
      drops in performance, and what have you used in practice?
    expected_concepts:
      - measuring how fast performance decays
      - scheduled retraining for predictable decay
      - triggered retraining on drift or quality drops
      - cost of retraining and validation
      - validating each retrained model before promotion
    rubric:
      excellent: Bases the cadence on measured decay, combines schedules with triggers, accounts for retraining and validation cost, and always gates retrained models before promotion.
      good: Describes a schedule or trigger used in practice with a reason.
      weak: Retrains arbitrarily or never.
    followups:
      - How would you measure how fast your model goes stale?
    common_errors:
      - Assuming a newly retrained model is always better than the current one.

  - external_key: technical.ml_engineering.unattended_retraining
    competency_key: mlops
    topic: Safeguards for automated retraining
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team wants fully automated retraining and deployment every night with no human in the loop. What
      safeguards would you insist on before agreeing?
    expected_concepts:
      - input data validation before training
      - evaluation gates against the current model and slices
      - canary or staged rollout with automatic rollback
      - protection against poisoned or corrupted data
      - audit trail and alerting for each automated release
      - easy manual override
    rubric:
      excellent: Layers data validation, comparative evaluation gates including slices, staged rollout with automatic rollback, data poisoning safeguards, auditability and a manual kill switch.
      good: Requires evaluation gates and a rollback path.
      weak: Agrees without safeguards or rejects automation outright without reasoning.
    followups:
      - What should happen if the gate fails three nights in a row?
    common_errors:
      - Gating only on overall metrics, letting slice regressions through every night.

  - external_key: technical.ml_engineering.flag_rate_jump
    competency_key: machine_learning
    topic: Sudden jump in positive predictions
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Overnight, the share of transactions your fraud model flags jumps from one percent to four percent. What
      would you check first?
    expected_concepts:
      - recent deployments of model, code or config
      - input feature distributions and missing values
      - upstream data pipeline changes
      - a genuine attack or traffic change
      - threshold or calibration changes
    rubric:
      excellent: Checks recent changes first, then inputs and upstream data, considers a real fraud wave, and knows how to limit customer impact while investigating.
      good: Checks for recent deployments and input data problems.
      weak: Immediately raises the threshold to restore the old rate without investigating.
    followups:
      - How would you protect customers while you investigate?
    common_errors:
      - Assuming a real-world fraud spike before ruling out a data bug.

  - external_key: technical.ml_engineering.calibration_monitoring
    competency_key: machine_learning
    topic: Calibration in production
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Why does probability calibration matter for some production models, and how would you monitor and fix it
      over time?
    expected_concepts:
      - downstream decisions using probabilities directly
      - reliability diagrams and expected calibration error
      - calibration drift as base rates change
      - Platt scaling or isotonic recalibration
      - effect of resampling or class weights on calibration
    rubric:
      excellent: Explains when calibrated probabilities matter, measures calibration with reliability curves, monitors it as base rates move, and recalibrates on fresh held-out data.
      good: Knows what calibration is and how to measure and fix it.
      weak: Equates good ranking metrics with good calibration.
    followups:
      - Why would training with oversampling hurt calibration?
    common_errors:
      - Recalibrating on the same data used to train the model.

  - external_key: technical.ml_engineering.bad_model_postmortem
    competency_key: mlops
    topic: Following up on a costly model incident
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A bad model version was live for two days before anyone noticed, and it cost the business real money.
      How would you run the follow-up, and what would you change in your release and monitoring process?
    expected_concepts:
      - blameless timeline of what happened
      - why pre-release gates missed it
      - why monitoring did not detect it sooner
      - concrete action items with owners
      - quantifying impact and time to detect
    rubric:
      excellent: Runs a blameless review with a timeline, explains both the gate gap and the detection gap, and turns them into owned, specific improvements to tests, rollout and alerts.
      good: Identifies what went wrong and proposes better tests or monitoring.
      weak: Blames an individual or proposes only being more careful.
    followups:
      - Which single change would most shorten detection time?
    common_errors:
      - Fixing only the specific bug without asking why detection took two days.

  - external_key: technical.ml_engineering.out_of_distribution_requests
    competency_key: machine_learning
    topic: Spotting inputs far from training data
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How can a serving system tell that a particular request is far outside what the model was trained on,
      and what should it do with that request?
    expected_concepts:
      - range checks against training statistics
      - density or distance-based novelty scores
      - uncertainty estimates from ensembles or similar
      - fallback rules or human review
      - logging novel inputs for future training
    rubric:
      excellent: Combines simple range checks with learned novelty or uncertainty scores, defines a fallback such as rules or review, and feeds flagged inputs back into data collection.
      good: Uses training statistics or uncertainty to flag unusual inputs and has a fallback.
      weak: Trusts the model's predicted probability as a sign it knows the input.
    followups:
      - Why isn't a high softmax probability enough to trust a prediction?
    common_errors:
      - Treating model confidence scores as a reliable novelty detector.

  - external_key: technical.ml_engineering.monitoring_hundreds_of_models
    competency_key: observability
    topic: Monitoring at the scale of hundreds of models
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You run three hundred models in production across many teams. How would you design monitoring so it
      scales without each team hand-building its own dashboards and alerts?
    expected_concepts:
      - standard prediction and feature logging contract
      - automatic baseline and drift computation per model
      - default alerts with per-model overrides
      - tiering models by business criticality
      - ownership metadata for alert routing
      - sampling and storage cost control
    rubric:
      excellent: Defines a standard logging contract, computes metrics and baselines automatically, tiers models by criticality with sensible default alerts, routes alerts by ownership and controls storage cost.
      good: Proposes a shared monitoring service with standard metrics and alerts.
      weak: Expects each team to build its own monitoring or proposes one dashboard for everything.
    followups:
      - How would you stop alert fatigue across that many models?
    common_errors:
      - Applying the same alert thresholds to every model regardless of traffic or criticality.

  - external_key: technical.ml_engineering.seasonal_drift_alerts
    competency_key: statistics_experimentation
    topic: Drift monitoring with seasonality
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your drift detector compares this week with the training window, and it fires every December during the
      holiday peak. How would you redesign the monitoring to handle seasonality?
    expected_concepts:
      - year-over-year or same-period baselines
      - modelling expected seasonal ranges
      - focusing on prediction quality rather than raw input change
      - including seasonal periods in training data
      - suppressing known calendar effects
    rubric:
      excellent: Uses seasonal baselines or expected ranges, shifts emphasis to quality and prediction behaviour, makes sure training covers seasonal periods, and keeps real anomalies detectable during peaks.
      good: Compares against the same period last year or widens thresholds during known peaks.
      weak: Disables alerts in December.
    followups:
      - How would you still catch a real problem that happens during the peak?
    common_errors:
      - Muting alerts during peaks, exactly when failures are most expensive.

  - external_key: technical.ml_engineering.long_term_effects
    competency_key: statistics_experimentation
    topic: Measuring long-term model effects
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you measure the long-term effect of a personalisation model, beyond what a two-week A/B test
      can show?
    expected_concepts:
      - long-running holdout groups
      - novelty and learning effects
      - surrogate metrics validated against long-term outcomes
      - cost of keeping users in a holdout
      - cumulative effects on retention
    rubric:
      excellent: Uses long-term holdouts with an explicit cost, separates novelty from lasting effects, validates short-term surrogates against long-term outcomes and tracks retention over months.
      good: Proposes a holdout group kept for longer and is aware of novelty effects.
      weak: Assumes the two-week result holds forever.
    followups:
      - How large should the holdout be, and who pays for it?
    common_errors:
      - Extrapolating a short test's lift linearly over a year.

  - external_key: technical.ml_engineering.sample_ratio_mismatch
    competency_key: statistics_experimentation
    topic: Unequal group sizes in a model experiment
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Halfway through a model A/B test, you notice the treatment group has noticeably fewer users than control,
      even though traffic was meant to split fifty-fifty. What could cause that, and what would you do?
    expected_concepts:
      - sample ratio mismatch test
      - treatment errors or timeouts dropping users
      - bot filtering or logging differences between arms
      - assignment or redirect bugs
      - results are untrustworthy until the cause is fixed
    rubric:
      excellent: Confirms the mismatch statistically, investigates assignment, logging, errors and filtering per arm, explains why results are invalid until it is fixed, and restarts the test properly.
      good: Recognises the mismatch invalidates the comparison and looks for assignment or logging bugs.
      weak: Reweights the groups and reads the results anyway.
    followups:
      - How could a slower model create a sample ratio mismatch?
    common_errors:
      - Correcting the imbalance statistically instead of finding the bug causing it.

  - external_key: technical.ml_engineering.explaining_predictions
    competency_key: machine_learning
    topic: Explaining individual predictions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a stakeholder asks why the model made a particular prediction, how do you answer in practice, and
      which tools or techniques have you used?
    expected_concepts:
      - local attribution methods such as SHAP or LIME
      - global feature importance versus local explanations
      - checking the input features for that case
      - limits of attribution with correlated features
      - explaining in business terms
    rubric:
      excellent: Uses local attribution tools with awareness of their limits, checks the actual inputs for the case, and translates the explanation into terms the stakeholder can act on.
      good: Has used an attribution method and can explain a prediction at a basic level.
      weak: Says models are black boxes and cannot be explained.
    followups:
      - When would a feature attribution be misleading?
    common_errors:
      - Presenting global feature importance as the reason for one specific prediction.

  - external_key: technical.ml_engineering.fixed_eval_set_upkeep
    competency_key: testing
    topic: Keeping a regression evaluation set useful
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you use a fixed evaluation set to catch regressions between model versions, and how do you stop
      that set from going stale?
    expected_concepts:
      - frozen versioned evaluation data
      - covering known hard cases and important slices
      - adding examples from production failures
      - periodic refresh with recent data
      - keeping it separate from training data
    rubric:
      excellent: Keeps a versioned frozen set with hard cases and slices, grows it from production failures, refreshes it on a schedule while keeping old versions comparable, and guards against leakage into training.
      good: Uses a fixed test set across versions and refreshes it occasionally.
      weak: Re-splits the data each time, so versions are never compared on the same examples.
    followups:
      - How do you compare a new model with one evaluated on the previous version of the set?
    common_errors:
      - Letting evaluation examples leak into training data over time.

  - external_key: technical.ml_engineering.missing_rate_spike
    competency_key: mlops
    topic: Sudden spike in missing feature values
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Overnight, the share of missing values in one model input jumps from two percent to forty percent. How
      would you respond, and what should the model service do in the meantime?
    expected_concepts:
      - tracing the feature back to its source pipeline
      - measuring the effect on predictions
      - fallback model or rules while degraded
      - notifying the upstream owner
      - backfill after the fix
    rubric:
      excellent: Traces the source quickly, measures how predictions are affected, applies a safe fallback while degraded, involves the upstream owner and plans a backfill and a check to catch it earlier.
      good: Investigates the pipeline and considers a fallback.
      weak: Waits for the upstream team without assessing model impact.
    followups:
      - How would you decide whether to switch to the fallback?
    common_errors:
      - Letting the model treat forty percent missing values as normal because it was trained with some missing data.
