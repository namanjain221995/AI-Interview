# LLM application engineering, part 4: fine-tuning versus prompting, serving, latency, cost, caching and
# running LLM features in production.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [llm]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.llm_engineering.streaming_responses
    competency_key: llm_engineering
    topic: Streaming responses end to end
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Why do most chat products stream tokens as they're generated, and what does streaming change about how you build
      the backend and the client?
    expected_concepts:
      - lower perceived latency through time to first token
      - server-sent events or websockets
      - proxies and load balancers buffering streams
      - validating or post-processing partial output
      - handling cancellation and disconnects
    rubric:
      excellent: Explains the perceived-latency benefit and the real engineering consequences, including transport choice, buffering proxies, cancellation, and how validation or moderation works on partial output.
      good: Knows streaming improves perceived speed and names a transport mechanism.
      weak: Thinks streaming makes generation faster overall, or cannot say what changes in the code.
    followups:
      - How would you stop generation and billing when the user closes the tab?
      - How do you stream when the output must be valid JSON?
    common_errors:
      - A reverse proxy buffering the whole response so streaming silently stops working.

  - external_key: technical.llm_engineering.style_finetune_request
    competency_key: llm_engineering
    topic: Prompting before fine-tuning
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your manager suggests fine-tuning a model because its outputs don't match the company's writing style. What would
      you try first, and what results would convince you that fine-tuning really is needed?
    expected_concepts:
      - style guide and examples in the prompt
      - retrieving example documents in the house style
      - measuring style adherence on a test set
      - cost, data and maintenance burden of fine-tuning
      - evidence that prompting has plateaued
    rubric:
      excellent: Tries explicit style guidance and examples first with a measurable style evaluation, and names concrete thresholds or plateau evidence plus available data that would justify fine-tuning and its upkeep.
      good: Tries prompting with examples first and would fine-tune if it falls short.
      weak: Agrees to fine-tune immediately, or rejects it without any test.
    followups:
      - How would you measure whether text matches the house style?
      - How much training data would you need for a style task?
    common_errors:
      - Fine-tuning without first measuring how far prompting alone gets.

  - external_key: technical.llm_engineering.cost_estimate_prelaunch
    competency_key: llm_engineering
    topic: Estimating cost before launch
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you estimate the monthly cost of a new LLM feature before launch, and which of your assumptions would
      you be most careful about?
    expected_concepts:
      - requests per user and active users
      - input and output tokens per request, including retrieved context
      - multiple model calls per user action
      - retries, evaluations and background jobs
      - sensitivity analysis on the uncertain inputs
    rubric:
      excellent: Builds a per-request token model from realistic inputs, multiplies by usage, includes hidden calls such as retries, rewrites and evaluation, and shows which assumptions swing the result most.
      good: Estimates tokens per request times expected volume and prices.
      weak: Guesses a number or prices only the visible user prompt.
    followups:
      - How would you validate the estimate during a beta?
      - Which single change would cut the estimate most?
    common_errors:
      - Ignoring the retrieved context and system prompt that are sent with every request.

  - external_key: technical.llm_engineering.provider_rate_limits
    competency_key: llm_engineering
    topic: Hitting provider rate limits
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your app starts hitting the model provider's rate limits during peak hours and users see errors. How would you deal
      with it now, and what would you change for the longer term?
    expected_concepts:
      - retries with exponential backoff and jitter
      - queueing and prioritizing interactive requests over batch work
      - reducing tokens per request
      - requesting higher limits or using multiple deployments
      - client-side token budgeting and monitoring
    rubric:
      excellent: Adds backoff and queueing immediately, separates interactive from background traffic, reduces token usage, plans capacity with the provider or multiple deployments, and monitors usage against limits.
      good: Adds retries with backoff and asks for a higher limit.
      weak: Retries immediately in a tight loop, making the problem worse.
    followups:
      - How would you tell users about a delay instead of showing an error?
      - Which limit is usually hit first, requests or tokens?
    common_errors:
      - Retrying without backoff and amplifying the overload.

  - external_key: technical.llm_engineering.provider_outage_fallback
    competency_key: llm_engineering
    topic: Degrading gracefully during a provider outage
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your only model provider has a two-hour outage and your feature is completely down. How would you design the
      application so it degrades more gracefully next time?
    expected_concepts:
      - fallback to a second provider or self-hosted model
      - timeouts and circuit breakers
      - prompts and evaluation for the fallback model
      - reduced functionality modes and clear user messaging
      - health checks and alerting on provider errors
    rubric:
      excellent: Adds timeouts and circuit breakers, a tested fallback model with adapted prompts, reduced modes and user messaging, and alerting, while noting quality differences of the fallback.
      good: Adds a second provider with automatic failover.
      weak: Shows a generic error page and waits for the provider.
    followups:
      - How would you know the fallback still works when you haven't used it for months?
      - What features would you switch off rather than fail over?
    common_errors:
      - Configuring a fallback model that was never evaluated with your prompts.

  - external_key: technical.llm_engineering.hosted_vs_open_model
    competency_key: llm_engineering
    topic: Choosing between hosted and open models
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you choose between a large hosted model and a smaller open model for a new feature? Walk me through the
      factors you'd weigh.
    expected_concepts:
      - quality on your own task evaluation
      - latency and throughput needs
      - cost at expected volume
      - data privacy and residency constraints
      - operational burden of self-hosting
      - customization options such as fine-tuning
    rubric:
      excellent: Decides from an evaluation on their task plus latency, cost at volume, privacy and operational capacity, and mentions starting with a strong model and moving down once quality targets are known.
      good: Weighs quality, cost and privacy with some reasoning.
      weak: Picks whichever model is most popular.
    followups:
      - What team skills does self-hosting require?
      - When would you use both?
    common_errors:
      - Comparing price per token without accounting for GPU utilization and operations cost.

  - external_key: technical.llm_engineering.request_tracing
    competency_key: llm_engineering
    topic: Tracing LLM requests for debugging
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What would you log or trace for each request in an LLM application so that you can debug a bad answer a user
      reports days later?
    expected_concepts:
      - full prompt as sent, including retrieved passages
      - model name, version and sampling settings
      - prompt template version
      - tool calls with inputs and outputs
      - latency and token counts per step
      - request id linking user feedback to the trace
    rubric:
      excellent: Captures everything needed to replay the request (assembled prompt, retrieved content, model and settings, versions, tool calls, timings) linked by a request id, while respecting privacy controls.
      good: Logs prompt, response, model and latency.
      weak: Logs only the user question and the final answer.
    followups:
      - How would you replay that request against a new prompt version?
      - How do you balance trace detail against privacy?
    common_errors:
      - Logging the prompt template instead of the fully assembled prompt.

  # ------------------------------------------------------------------ medium
  - external_key: technical.llm_engineering.per_customer_adapters
    competency_key: llm_engineering
    topic: Customized models for many customers
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Fifty enterprise customers each want a model customized to their own terminology and formats. How would you approach
      the fine-tuning and the serving for that?
    expected_concepts:
      - checking whether per-customer prompts or retrieval suffice
      - parameter-efficient adapters per customer
      - serving many adapters on one base model
      - per-customer evaluation sets
      - retraining pipeline when the base model changes
      - data isolation between customers
    rubric:
      excellent: Tests lighter options first, uses per-customer adapters on a shared base with multi-adapter serving, keeps customer data and evaluation separate and plans for retraining when the base model is upgraded.
      good: Proposes adapters per customer on a shared base model.
      weak: Plans fifty fully fine-tuned models each on its own hardware.
    followups:
      - What happens to all the adapters when you upgrade the base model?
      - How would you route a request to the right adapter safely?
    common_errors:
      - Overlooking the ongoing cost of retraining every adapter after a base model change.

  - external_key: technical.llm_engineering.sft_dataset_preparation
    competency_key: llm_engineering
    topic: Preparing supervised fine-tuning data
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you prepare a dataset for supervised fine-tuning? I'd like to hear where the examples come from, how you
      clean them, and how you decide the data is good enough.
    expected_concepts:
      - sources such as expert-written, production logs or synthetic data
      - deduplication and filtering low-quality examples
      - consistent formatting and chat templates
      - coverage of input types and balance
      - held-out split and reviewing samples by hand
      - removing personal data
    rubric:
      excellent: Describes sourcing with quality controls, deduplication, format consistency with the model's chat template, coverage analysis, privacy scrubbing and a held-out split, with manual review of samples.
      good: Cleans and deduplicates data and keeps a validation split.
      weak: Dumps raw logs into training without review.
    followups:
      - When would you use synthetic examples, and how would you check them?
      - How would you notice labelling inconsistencies?
    common_errors:
      - Training on production outputs that include the very mistakes you want to fix.

  - external_key: technical.llm_engineering.distillation_narrow_task
    competency_key: llm_engineering
    topic: Distilling into a smaller model
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you use a large model to train a smaller, cheaper model for a narrow task, and what would you watch out
      for along the way?
    expected_concepts:
      - generating labels or outputs with the large model
      - filtering teacher outputs for quality
      - covering the real input distribution
      - comparing student to teacher on a held-out set
      - license and terms of use for generated data
      - monitoring for drift once deployed
    rubric:
      excellent: Generates and filters teacher data over realistic inputs, trains and compares the student on held-out data, checks provider terms, and plans monitoring and a fallback to the large model for hard cases.
      good: Uses the large model to create training data and evaluates the small one.
      weak: Expects the small model to match the large one without checking.
    followups:
      - How would you route the hardest inputs back to the large model?
      - What happens when inputs drift away from the training data?
    common_errors:
      - Copying the teacher's mistakes into the student without filtering.

  - external_key: technical.llm_engineering.preference_tuning
    competency_key: llm_engineering
    topic: Supervised versus preference tuning
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What's the practical difference between supervised fine-tuning and preference-based methods like DPO or RLHF, and
      when would the extra work of preference tuning be worth it?
    expected_concepts:
      - supervised tuning imitates target outputs
      - preference tuning learns from chosen versus rejected pairs
      - useful when good outputs are easier to compare than to write
      - collecting consistent preference data
      - risk of reward hacking or verbosity drift
    rubric:
      excellent: Explains both methods and their data needs, identifies tasks where comparing is easier than writing, and covers preference data quality and side effects like verbosity drift with evaluation to catch them.
      good: Knows preference tuning uses pairs of better and worse outputs and is usually applied after supervised tuning.
      weak: Cannot distinguish the two or names them only.
    followups:
      - How would you collect preference pairs efficiently?
      - How would you detect the model learning to just write longer answers?
    common_errors:
      - Collecting preference labels without guidelines, producing inconsistent pairs.

  - external_key: technical.llm_engineering.slow_first_token
    competency_key: llm_engineering
    topic: Finding where response time goes
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Users say your document assistant feels slow — the first word appears after about three seconds. Walk me through
      how you'd find where the time goes and cut it down.
    expected_concepts:
      - per-stage timing of rewrite, retrieval, rerank and generation
      - prompt length driving prefill time
      - sequential calls that could run in parallel
      - smaller models for intermediate steps
      - prefix caching and streaming
      - measuring percentiles, not averages
    rubric:
      excellent: Instruments every stage, finds the critical path, then shortens prompts, parallelizes or removes calls, uses smaller models for intermediate steps and caching, and tracks percentile latency before and after.
      good: Measures stage timings and reduces the slowest one.
      weak: Switches to a faster model without measuring where time goes.
    followups:
      - Which stages could start before the user has finished typing?
      - What did you trade away for each saving?
    common_errors:
      - Optimizing average latency while the slow tail remains.

  - external_key: technical.llm_engineering.model_cascade_routing
    competency_key: llm_engineering
    topic: Routing between cheap and expensive models
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you design a router or cascade that sends easy requests to a cheap model and hard ones to an expensive
      model? How do you decide what counts as hard?
    expected_concepts:
      - a classifier or rules predicting difficulty
      - cascade with escalation when a check fails
      - labelled data on where the cheap model fails
      - measuring quality and cost of the combined system
      - router errors and added latency
    rubric:
      excellent: Builds difficulty labels from where the cheap model actually fails, chooses routing or escalation with quality checks, and measures the combined cost and quality against using one model, including router errors.
      good: Routes by a simple classifier or rules and checks overall quality.
      weak: Routes by request length alone with no evaluation.
    followups:
      - What does it cost you when the router misroutes a hard request?
      - How would you keep the router current as models change?
    common_errors:
      - Measuring savings without measuring the quality lost on misrouted requests.

  - external_key: technical.llm_engineering.quantization_decision
    competency_key: mlops
    topic: Deciding whether to quantize
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you serve an open model yourself, how do you decide whether to quantize it, and how would you find out what
      quality you've given up?
    expected_concepts:
      - memory savings allowing smaller or fewer GPUs
      - weight-only versus weight-and-activation quantization
      - throughput and latency effects depend on hardware and kernels
      - task-specific evaluation, not only perplexity
      - sensitive tasks such as maths, code and long context
    rubric:
      excellent: Ties the decision to memory and cost goals, picks a method suited to the hardware, benchmarks throughput and latency, and evaluates on their own tasks with attention to sensitive categories.
      good: Knows quantization saves memory with some quality loss and evaluates on a test set.
      weak: Quantizes as far as possible without measuring quality.
    followups:
      - Why might a quantized model be slower on some hardware?
      - Which tasks would you test first for degradation?
    common_errors:
      - Judging quality loss only from a general benchmark score.

  - external_key: technical.llm_engineering.semantic_cache_risks
    competency_key: llm_engineering
    topic: Semantic caching risks
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Someone proposes a semantic cache that returns stored answers for similar questions, promising to cut costs in
      half. What risks would you raise, and how would you make it safe if you went ahead?
    expected_concepts:
      - similar wording with different meaning returning wrong answers
      - stale answers after source data changes
      - cross-user leakage of personalized answers
      - similarity threshold tuning on labelled pairs
      - scoping cache keys and invalidation
    rubric:
      excellent: Identifies wrong-match, staleness and leakage risks, limits caching to non-personalized content, scopes and invalidates entries, tunes thresholds on labelled pairs and measures real hit rate and error rate.
      good: Raises wrong matches and staleness and suggests a strict threshold.
      weak: Adopts it for all traffic based on the cost estimate alone.
    followups:
      - How would you estimate the real hit rate before building it?
      - Which queries should never be cached?
    common_errors:
      - Caching personalized answers under keys shared between users.

  - external_key: technical.llm_engineering.prefix_caching
    competency_key: llm_engineering
    topic: Prompt prefix caching
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How does prompt or prefix caching work at the model level, and how would you structure your prompts to get the
      most out of it?
    expected_concepts:
      - reusing computed attention state for identical prefixes
      - static content first, variable content last
      - exact match requirement for the prefix
      - cache lifetime and pricing differences
      - measuring cache hit rate
    rubric:
      excellent: Explains reuse of computed state for identical prefixes, orders prompts with stable content first, avoids variable values early in the prompt, and measures hit rate and savings.
      good: Knows to keep the shared prefix identical and at the start.
      weak: Confuses it with caching whole responses.
    followups:
      - What small change could silently break your cache hit rate?
      - How would this affect the order of retrieved passages and the system prompt?
    common_errors:
      - Putting a timestamp or user id at the top of the system prompt.

  - external_key: technical.llm_engineering.gradual_quality_decline
    competency_key: mlops
    topic: Investigating a gradual quality decline
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Two weeks after launch, complaints about your summarization feature are slowly rising, but nothing in your code has
      changed. How would you investigate, and what monitoring would have caught it earlier?
    expected_concepts:
      - changes in input distribution
      - provider model updates behind an alias
      - upstream data or parsing changes
      - sampled production evaluation over time
      - dashboards of quality proxies, lengths and refusals
    rubric:
      excellent: Checks input drift, provider model versions and upstream changes, compares sampled outputs over time with automated scoring, and proposes continuous sampled evaluation with alerts on quality proxies.
      good: Looks at whether inputs or the model changed and samples recent outputs.
      weak: Assumes users are mistaken or rewrites the prompt without investigating.
    followups:
      - How would you detect a silent model change from the provider?
      - Which cheap signals correlate with summary quality?
    common_errors:
      - Calling a model through an alias that the provider can update without notice.

  - external_key: technical.llm_engineering.model_deprecation_plan
    competency_key: mlops
    topic: Planning for a model retirement
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your provider is retiring the model version you use in sixty days. How would you plan the switch to its successor so
      nothing breaks for users?
    expected_concepts:
      - inventory of every feature and prompt using the model
      - running evaluation suites on the successor early
      - prompt and parser adjustments for behaviour differences
      - latency and cost comparison
      - staged rollout with monitoring and a rollback window
    rubric:
      excellent: Inventories every dependency, evaluates early per feature, fixes prompts and parsers, compares cost and latency and rolls out in stages before the deadline with a rollback window.
      good: Evaluates the new version and rolls out gradually.
      weak: Waits until the deadline and switches everything at once.
    followups:
      - What if one feature gets worse with the new model and you can't fix it in time?
      - How would you make the next migration easier?
    common_errors:
      - Discovering late that a downstream parser depended on the old model's exact formatting.

  # ------------------------------------------------------------------ hard
  - external_key: technical.llm_engineering.continuous_batching_kv_cache
    competency_key: mlops
    topic: Throughput, batching and the KV cache
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Explain how continuous batching and the KV cache affect throughput and latency when you self-host a model, and how
      you'd size GPUs for a target load.
    expected_concepts:
      - prefill versus decode phases
      - KV cache memory growing with sequence length and batch size
      - continuous batching admitting requests mid-generation
      - paged attention reducing fragmentation
      - load testing with realistic prompt and output lengths
      - trade-off between throughput and per-request latency
    rubric:
      excellent: Explains prefill and decode, computes KV cache memory from model shape and lengths, describes continuous batching and paging, and sizes capacity from load tests with realistic length distributions and latency targets.
      good: Knows batching raises throughput, the KV cache consumes memory, and load testing is needed.
      weak: Sizes GPUs from model weight size alone.
    followups:
      - How would long prompts from a few users affect everyone else's latency?
      - Roughly how much KV cache does one long request need for your model?
    common_errors:
      - Load testing with short uniform prompts that look nothing like real traffic.

  - external_key: technical.llm_engineering.self_hosting_cost_case
    competency_key: llm_engineering
    topic: Self-hosting versus API cost analysis
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your company spends a large amount each month on a hosted model API, and finance asks whether self-hosting an open
      model would be cheaper. How would you build that analysis?
    expected_concepts:
      - quality parity check on real tasks first
      - token volume and traffic shape including peaks
      - GPU cost at realistic utilization
      - engineering and on-call cost
      - latency, reliability and scaling risk
      - break-even point and sensitivity
    rubric:
      excellent: Establishes quality parity first, models traffic peaks and real utilization, includes people and operations costs, compares latency and reliability and presents break-even under different assumptions.
      good: Compares API cost with GPU cost at expected volume and checks quality.
      weak: Compares per-token API price with hourly GPU price at full utilization.
    followups:
      - How would bursty traffic change the answer?
      - What non-cost reasons might decide it either way?
    common_errors:
      - Assuming GPUs run at full utilization around the clock.

  - external_key: technical.llm_engineering.post_finetune_regression
    competency_key: llm_engineering
    topic: Regressions after fine-tuning
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After fine-tuning, your model is excellent at the target task, but support reports it now handles general questions
      badly and ignores some of its safety rules. What happened, and how would you fix it?
    expected_concepts:
      - catastrophic forgetting from narrow data
      - safety behaviour eroded by fine-tuning
      - mixing general and safety examples into training data
      - lower learning rate, fewer epochs or adapters
      - broad regression and safety evaluation before release
    rubric:
      excellent: Diagnoses forgetting and safety erosion, mixes in general and safety data, adjusts training intensity or method, and adds broad capability and safety evaluations as release gates, possibly routing out-of-scope queries elsewhere.
      good: Recognises forgetting and suggests adding general data and evaluating more broadly.
      weak: Adds more task data, which makes the problem worse.
    followups:
      - How would you scope the model so off-task questions go to a general model?
      - Which evaluations would you make mandatory before each fine-tuned release?
    common_errors:
      - Evaluating the fine-tuned model only on the target task.

  - external_key: technical.llm_engineering.speculative_decoding
    competency_key: mlops
    topic: Speculative decoding
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How does speculative decoding speed up generation, and in which situations would it give you little or no benefit?
    expected_concepts:
      - draft model or heads proposing several tokens
      - target model verifying proposals in one pass
      - output distribution preserved by acceptance sampling
      - speedup depends on acceptance rate
      - less benefit at high batch sizes or with poorly matched drafts
    rubric:
      excellent: Explains draft and verify with acceptance sampling preserving outputs, ties speedup to acceptance rate, and explains why gains shrink under high load or with a mismatched draft, with a plan to measure it.
      good: Knows a small model drafts tokens that the large model checks.
      weak: Thinks it trades quality for speed or cannot explain the mechanism.
    followups:
      - How would you choose or train a draft model?
      - Why does speculative decoding help memory-bound decoding in particular?
    common_errors:
      - Assuming the speedup measured at batch size one holds under production load.

  - external_key: technical.llm_engineering.production_feedback_loop
    competency_key: llm_engineering
    topic: Learning from production feedback
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You want to use production conversations and user ratings to keep improving the system over time. How would you
      design that loop, and what could go wrong with it?
    expected_concepts:
      - consent, privacy and retention for training use
      - selection bias in who gives ratings
      - human review before data enters training or evaluation sets
      - keeping held-out evaluation separate from training data
      - feedback loops amplifying existing errors
      - versioned datasets and rollback
    rubric:
      excellent: Designs a reviewed, consented and privacy-scrubbed pipeline that feeds prompts, evaluation and training separately, accounts for rating bias and self-reinforcing loops, and keeps versioned data with rollback.
      good: Filters and reviews feedback before using it and protects personal data.
      weak: Trains directly on thumbs-up conversations automatically.
    followups:
      - How would you stop users from deliberately steering the model with ratings?
      - Which improvements should come from prompts or retrieval rather than training?
    common_errors:
      - Letting the same feedback data flow into both training and the evaluation used to judge it.

  - external_key: technical.llm_engineering.peak_capacity_priority
    competency_key: mlops
    topic: Capacity planning for traffic spikes
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your self-hosted model serves a product whose traffic jumps tenfold during a monthly event. How would you plan
      capacity and protect latency for the most important requests?
    expected_concepts:
      - load testing at peak with realistic length distributions
      - pre-scaling given slow GPU and model startup
      - priority queues and admission control
      - shedding or deferring batch and low-priority work
      - burst capacity through a hosted fallback
      - token limits during peak
    rubric:
      excellent: Plans from peak load tests, pre-scales for slow model startup, adds priority classes with admission control and load shedding, has a burst fallback and degrades gracefully with shorter outputs.
      good: Pre-scales and prioritizes interactive traffic.
      weak: Relies on autoscaling reacting in real time.
    followups:
      - How long does a new model replica take to become ready, and why does that matter?
      - What would you degrade first when capacity runs out?
    common_errors:
      - Assuming GPU autoscaling reacts as quickly as stateless web servers.

  - external_key: technical.llm_engineering.finetune_data_leakage
    competency_key: security
    topic: Personal data leaking from fine-tuned models
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      If you fine-tune on customer support transcripts, how could the model end up revealing personal data, and what would
      you do before, during and after training to prevent it?
    expected_concepts:
      - memorization of rare or repeated sequences
      - scrubbing personal data before training
      - deduplication to reduce memorization
      - extraction testing with targeted prompts
      - output filtering and access controls on the model
      - handling deletion requests for trained models
    rubric:
      excellent: Explains memorization risk, scrubs and deduplicates data, limits training intensity, probes the model with extraction tests, filters outputs and has a plan for deletion requests that may require retraining.
      good: Removes personal data before training and filters outputs.
      weak: Assumes fine-tuned models cannot reproduce their training data.
    followups:
      - How would you test whether a specific customer's details were memorized?
      - What would you do if a customer asks to have their data removed from the model?
    common_errors:
      - Relying on output filters alone while training on unscrubbed transcripts.
