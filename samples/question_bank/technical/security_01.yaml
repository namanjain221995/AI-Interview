# Technical questions: security engineering, part 1 (web application security and the OWASP Top 10).
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [security]
questions:
  # ------------------------------------------------------------- easy
  - external_key: technical.security.sqli_root_cause
    competency_key: security
    topic: SQL injection root cause and fix
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you had to explain SQL injection to a developer who has never run into it, how would you describe
      the real root cause, and what would you tell them to do instead of escaping input by hand?
    expected_concepts:
      - user data being interpreted as part of the query code
      - parameterised queries or prepared statements
      - raw-query escape hatches in ORMs that reintroduce the risk
      - allowlisting for identifiers such as column names or sort order that cannot be parameterised
      - least-privilege database accounts to limit impact
    rubric:
      excellent: Explains the code-versus-data confusion clearly, recommends parameterisation as the primary fix, and covers the places it cannot be used (identifiers, ORM raw queries) plus least privilege as a second layer.
      good: Recommends prepared statements and gives a correct example of how injection happens.
      weak: Relies on escaping, blocklisting quotes or a web application firewall as the main fix.
    followups:
      - How would you safely let users choose which column a report is sorted by?
      - Where have you seen ORMs still end up vulnerable to injection?
    common_errors:
      - Treating input sanitisation or a WAF as equivalent to parameterised queries.

  - external_key: technical.security.xss_variants
    competency_key: security
    topic: Stored, reflected and DOM-based XSS
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Walk me through how stored, reflected and DOM-based cross-site scripting differ from each other, and
      how the fix changes depending on which one you're dealing with.
    expected_concepts:
      - stored payloads persisted and served to other users
      - reflected payloads echoed from the request
      - DOM-based flaws entirely in client-side JavaScript sinks such as innerHTML
      - context-aware output encoding and framework auto-escaping
      - safe DOM APIs such as textContent and sanitising libraries for rich HTML
      - Content Security Policy as defence in depth
    rubric:
      excellent: Distinguishes where the payload lives and executes for each type, matches fixes to server-side encoding versus client-side sink hygiene, and mentions CSP as a backstop rather than the fix.
      good: Describes all three correctly and names output encoding as the main defence.
      weak: Cannot separate the types or proposes input filtering of angle brackets as the solution.
    followups:
      - Why doesn't server-side encoding help with DOM-based XSS?
      - How do frameworks like React protect you, and how do developers bypass that protection?
    common_errors:
      - Assuming HTML encoding is correct in every context, including inside JavaScript or URLs.

  - external_key: technical.security.csrf_defences
    competency_key: security
    topic: Cross-site request forgery defences
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What does a cross-site request forgery attack actually exploit, and which defences would you rely on in
      a modern web application?
    expected_concepts:
      - browsers attaching ambient credentials such as cookies to cross-site requests
      - SameSite cookie attribute and its limits
      - synchroniser or double-submit anti-CSRF tokens
      - checking Origin or Referer headers on state-changing requests
      - never changing state on GET requests
      - APIs using bearer tokens in headers are not exposed the same way
    rubric:
      excellent: Explains the ambient-credential root cause, layers SameSite with tokens or origin checks, and knows when an API is or is not exposed based on how it authenticates.
      good: Describes the attack correctly and names anti-CSRF tokens or SameSite cookies.
      weak: Confuses CSRF with XSS or suggests CORS configuration as the defence.
    followups:
      - Which SameSite value would you choose for a session cookie, and what breaks with Strict?
      - How does an XSS flaw undermine CSRF tokens?
    common_errors:
      - Believing CORS prevents the forged request from being sent.

  - external_key: technical.security.idor_order_lookup
    competency_key: security
    topic: Direct object reference authorisation flaws
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A tester reports that changing the order number in a URL like slash orders slash 1042 shows another
      customer's order. How would you fix this properly, and how would you check whether the same flaw exists
      elsewhere in the app?
    expected_concepts:
      - broken object-level authorisation
      - server-side ownership or permission check on every object access
      - scoping queries by the authenticated user rather than checking afterwards
      - random identifiers are not an access control
      - automated tests that try other users' objects
      - searching for similar handlers and centralising the check
    rubric:
      excellent: Fixes the check server-side by scoping data access to the caller, rejects obscured IDs as a fix, and describes a systematic sweep with tests and a shared authorisation layer.
      good: Adds an ownership check to the endpoint and mentions reviewing similar endpoints.
      weak: Proposes switching to UUIDs or hiding the ID as the fix.
    followups:
      - Should the API return 403 or 404 in this case, and why?
      - How would you write a test that catches this for every new endpoint?
    common_errors:
      - Treating unguessable identifiers as sufficient protection.

  - external_key: technical.security.password_storage
    competency_key: security
    topic: Password storage
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How should an application store user passwords today, and what makes that approach better than simply
      hashing them with SHA-256?
    expected_concepts:
      - slow, memory-hard password hashing such as Argon2id, scrypt or bcrypt
      - unique per-user salts
      - tunable work factors and re-hashing on login when parameters change
      - fast hashes being cheap to brute-force on GPUs
      - optional pepper stored outside the database
    rubric:
      excellent: Recommends a modern adaptive algorithm with sensible parameters, explains why speed is the enemy for password hashes, and covers salts and upgrading old hashes transparently.
      good: Names bcrypt or Argon2 and explains salting.
      weak: Suggests SHA-256 or MD5 with a salt, or reversible encryption of passwords.
    followups:
      - How would you migrate a user table that currently stores unsalted SHA-1 hashes?
      - How do you choose the work factor?
    common_errors:
      - Thinking a salt alone makes a fast hash safe for passwords.

  - external_key: technical.security.response_headers_review
    competency_key: security
    topic: Security response headers
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you review a web application, which HTTP response headers do you check, and what does each one
      actually protect against?
    expected_concepts:
      - Content-Security-Policy against script injection
      - Strict-Transport-Security against downgrade and SSL stripping
      - X-Content-Type-Options nosniff against MIME confusion
      - frame-ancestors or X-Frame-Options against clickjacking
      - Referrer-Policy against leaking URLs to third parties
    rubric:
      excellent: Names the key headers and ties each to a specific attack, and notes headers are defence in depth that do not fix underlying bugs.
      good: Names three or four headers with roughly correct purposes.
      weak: Lists headers without knowing what they do, or treats them as the primary fix for vulnerabilities.
    followups:
      - What are the risks of turning on HSTS with preload too early?
      - How would you check these headers across hundreds of services?
    common_errors:
      - Assuming X-XSS-Protection still provides meaningful protection in modern browsers.

  - external_key: technical.security.session_cookie_attributes
    competency_key: security
    topic: Secure session management
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you set up session cookies and session handling securely, and which attack does each choice you
      make defend against?
    expected_concepts:
      - HttpOnly to keep scripts from reading the session
      - Secure so the cookie only travels over HTTPS
      - SameSite to reduce cross-site sending
      - rotating the session identifier on login to prevent fixation
      - idle and absolute timeouts plus server-side invalidation on logout
      - narrow Domain and Path scoping
    rubric:
      excellent: Covers cookie attributes, rotation on privilege change, timeouts and server-side invalidation, linking each to theft, fixation or cross-site abuse.
      good: Names HttpOnly, Secure and SameSite with correct reasons.
      weak: Only mentions encrypting the cookie or cannot explain what the attributes do.
    followups:
      - What is session fixation, and how does rotating the ID stop it?
      - How would you let a user sign out of all their devices?
    common_errors:
      - Keeping the same session identifier before and after login.

  - external_key: technical.security.open_redirect
    competency_key: security
    topic: Open redirects
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      During a review you find a login page that sends users to whatever URL is in a "next" parameter after
      they sign in. Why does that matter, and how would you fix it without breaking legitimate redirects?
    expected_concepts:
      - phishing that borrows the trusted domain
      - leaking OAuth codes or tokens to attacker-controlled hosts
      - allowing only relative paths or an allowlist of destinations
      - careful URL parsing, since prefix and substring checks are bypassable
      - mapping redirect targets to server-side identifiers
    rubric:
      excellent: Explains phishing and token-leak impact, proposes an allowlist or relative-only approach with robust parsing, and gives examples of bypasses like protocol-relative URLs.
      good: Explains the phishing risk and proposes validating the destination.
      weak: Dismisses it as harmless or suggests a simple "starts with our domain" check.
    followups:
      - How could an attacker bypass a check that the URL starts with your domain name?
    common_errors:
      - Validating with string prefix matching instead of parsing the URL.

  # ------------------------------------------------------------- medium
  - external_key: technical.security.ssrf_link_preview
    competency_key: security
    topic: Server-side request forgery
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your product has a feature that fetches a URL the user pastes in, to generate a link preview. How could
      an attacker abuse that, and how would you design it so it's safe?
    expected_concepts:
      - reaching internal services and the cloud metadata endpoint
      - blocking private, loopback and link-local ranges after DNS resolution
      - DNS rebinding and redirects that bypass naive checks
      - running fetches through an isolated egress proxy or separate network
      - IMDSv2 or equivalent metadata protections
      - limiting schemes, ports, response size and timeouts
    rubric:
      excellent: Describes metadata and internal-service abuse, defends against rebinding and redirects by validating the resolved address at connect time, and isolates the fetcher at the network level.
      good: Identifies SSRF and proposes blocking internal IP ranges and the metadata address.
      weak: Proposes a hostname blocklist only, or does not see the internal-network risk.
    followups:
      - How does DNS rebinding defeat a check done before the request is made?
      - What would you log so you could detect someone probing this feature?
    common_errors:
      - Validating the hostname string but connecting to whatever it later resolves to.

  - external_key: technical.security.csp_legacy_rollout
    competency_key: security
    topic: Rolling out Content Security Policy
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You've been asked to roll out a Content Security Policy on a large legacy application that is full of
      inline scripts and third-party tags. How would you get there without breaking production?
    expected_concepts:
      - starting in report-only mode and collecting violation reports
      - nonce-based or hash-based policies instead of unsafe-inline
      - strict-dynamic for script loaders
      - refactoring inline event handlers
      - phasing by page or route and tightening over time
      - governance for adding new third-party scripts
    rubric:
      excellent: Lays out a phased plan from report-only to enforcement with nonces, explains how reports are triaged, and addresses third-party tags and long-term governance.
      good: Uses report-only mode first and knows unsafe-inline weakens the policy.
      weak: Ships a policy with unsafe-inline and wildcards and calls it done, or enforces immediately.
    followups:
      - Why does an allowlist of domains often fail to stop XSS?
      - How do you deal with the noise from browser extensions in violation reports?
    common_errors:
      - Adding unsafe-inline to make violations disappear, which removes most of the XSS protection.

  - external_key: technical.security.multitenant_authorization
    competency_key: security
    topic: Tenant isolation in authorisation
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you design authorisation in a multi-tenant SaaS application so that one forgotten check in a
      single endpoint can't leak data across tenants?
    expected_concepts:
      - taking tenant identity from the authenticated token, never the request body
      - enforcing tenant scoping at the data-access layer
      - database row-level security or per-tenant schemas
      - deny-by-default policy middleware
      - automated cross-tenant tests for every endpoint
      - auditing and alerting on cross-tenant access attempts
    rubric:
      excellent: Pushes isolation down to a layer developers cannot forget (repository scoping or row-level security), explains where tenant identity comes from, and backs it with automated cross-tenant tests.
      good: Describes consistent tenant checks in middleware and mentions testing.
      weak: Relies on each developer remembering a WHERE clause.
    followups:
      - What are the trade-offs between row-level security and separate databases per tenant?
      - How would background jobs and admin tools fit into this model?
    common_errors:
      - Reading the tenant identifier from a request parameter the client controls.

  - external_key: technical.security.unsafe_deserialization
    competency_key: security
    topic: Unsafe deserialisation
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Why is deserialising untrusted data so dangerous in some languages, and what would you look for in a
      codebase to find that risk?
    expected_concepts:
      - native object deserialisation that can instantiate arbitrary types
      - gadget chains leading to remote code execution
      - risky APIs such as Java ObjectInputStream, Python pickle or unsafe YAML loading
      - preferring data-only formats like JSON with schema validation
      - class allowlists or signing when native formats are unavoidable
    rubric:
      excellent: Explains how type instantiation plus gadget chains lead to code execution, names concrete dangerous APIs, and proposes data-only formats with validation.
      good: Knows it can lead to code execution and names one or two risky APIs.
      weak: Treats it as an input validation problem fixable by checking string contents.
    followups:
      - A session cookie contains a serialised object — how would you assess that?
      - Does signing the payload fully solve the problem?
    common_errors:
      - Assuming a format is safe because the data comes from an internal queue or cookie the app wrote itself.

  - external_key: technical.security.document_upload_parsing
    competency_key: security
    topic: Secure handling of uploaded documents
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A service accepts document uploads and parses them, including XML-based formats such as Office files
      and SVG images. What risks would you look for, and how would you lock it down?
    expected_concepts:
      - XML external entity attacks and disabling DTD processing
      - decompression bombs and resource exhaustion
      - script content in SVG and HTML served back to users
      - validating type by content and enforcing size limits
      - serving user content from a separate domain with Content-Disposition
      - sandboxing parsers and scanning for malware
    rubric:
      excellent: Covers parser attacks (XXE, bombs), stored XSS via served files, and isolation of both processing and serving, with concrete configuration choices.
      good: Identifies XXE or malicious file content and suggests validation and size limits.
      weak: Relies on checking the file extension.
    followups:
      - Why serve user uploads from a different domain than the main app?
      - How would you isolate the parsing step if the library itself has a vulnerability?
    common_errors:
      - Trusting the client-supplied Content-Type or file extension.

  - external_key: technical.security.jwt_pitfalls
    competency_key: security
    topic: JSON Web Token pitfalls
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What mistakes have you seen, or would you look for, when a team uses JSON Web Tokens for
      authentication?
    expected_concepts:
      - accepting the none algorithm or algorithm confusion between RS256 and HS256
      - not validating signature, issuer, audience and expiry
      - long-lived tokens with no revocation strategy
      - sensitive data in the readable payload
      - storage in places reachable by XSS
      - key rotation and kid handling
    rubric:
      excellent: Names verification failures, lifetime and revocation trade-offs, payload exposure and key management, and recommends pinning the expected algorithm in a vetted library.
      good: Mentions signature verification and expiry and knows the payload is only encoded.
      weak: Believes JWTs are encrypted or that they are inherently more secure than sessions.
    followups:
      - How would you log a user out everywhere if your tokens last an hour?
      - What is the audience claim for, and what happens if nobody checks it?
    common_errors:
      - Decoding the token and trusting its claims without verifying the signature.

  - external_key: technical.security.mass_assignment
    competency_key: security
    topic: Mass assignment
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A user managed to make themselves an administrator by adding an is_admin field to an ordinary profile
      update request. Explain what went wrong and how you'd prevent that whole class of bug across the
      codebase.
    expected_concepts:
      - binding request bodies directly onto data models
      - explicit input schemas or DTOs with allowlisted fields
      - separate models for create, update and admin operations
      - framework settings that forbid unknown fields
      - tests and review checks for privileged attributes
    rubric:
      excellent: Names mass assignment, fixes it with explicit input schemas rather than blocklists, and proposes framework-level defaults plus tests that apply to every endpoint.
      good: Explains the auto-binding cause and suggests allowlisting fields.
      weak: Proposes stripping the is_admin field specifically.
    followups:
      - How would you find other endpoints with the same weakness quickly?
    common_errors:
      - Blocklisting known sensitive fields instead of allowlisting accepted ones.

  - external_key: technical.security.credential_stuffing_response
    competency_key: security
    topic: Credential stuffing attacks
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your login endpoint is suddenly receiving millions of attempts from thousands of IP addresses, using
      real username and password pairs from other sites' breaches. How do you respond in the short term, and
      how do you harden it for the long term?
    expected_concepts:
      - rate limiting by account, device fingerprint and network, not only by IP
      - bot detection and challenges for suspicious traffic
      - monitoring successful logins and forcing resets on compromised accounts
      - checking passwords against breached-password lists
      - encouraging or requiring MFA
      - avoiding responses that reveal whether an account exists
    rubric:
      excellent: Separates immediate containment from long-term hardening, focuses on detecting and remediating successful takeovers, and explains why per-IP limits alone fail against distributed attacks.
      good: Proposes rate limiting, CAPTCHA and MFA with reasonable reasoning.
      weak: Only suggests blocking the IP addresses seen so far.
    followups:
      - How would you tell which successful logins during the attack were the attacker?
      - What would you communicate to affected users?
    common_errors:
      - Returning different error messages for unknown users and wrong passwords.

  - external_key: technical.security.password_reset_design
    competency_key: security
    topic: Password reset flows
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Talk me through how you'd design a secure password reset flow, and which weaknesses you'd test for in
      one somebody else built.
    expected_concepts:
      - high-entropy, single-use, short-lived tokens stored hashed
      - identical responses whether or not the account exists
      - building reset links from configuration, not the Host header
      - invalidating existing sessions after a reset
      - notifying the user and rate limiting requests
    rubric:
      excellent: Designs a token lifecycle carefully, covers enumeration and host-header poisoning, and handles session invalidation and notifications.
      good: Uses random expiring tokens and avoids revealing whether an email is registered.
      weak: Uses security questions or emails a new password in plain text.
    followups:
      - How could a Host header injection lead to account takeover here?
      - Should a reset also disable MFA, and how would you handle a lost second factor?
    common_errors:
      - Leaving reset tokens valid after use or for days.

  - external_key: technical.security.oidc_spa_mobile
    competency_key: security
    topic: OAuth and OpenID Connect integration
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you integrate an OAuth or OpenID Connect login into a single-page or mobile app, which flow do you
      use, and which security checks matter most?
    expected_concepts:
      - authorisation code flow with PKCE
      - avoiding the implicit flow
      - state parameter against login CSRF and nonce against replay
      - exact redirect URI matching
      - validating ID token signature, issuer, audience and expiry
      - backend-for-frontend pattern to keep tokens out of the browser
    rubric:
      excellent: Chooses code flow with PKCE, explains what state, nonce and redirect matching each prevent, and discusses where tokens should live.
      good: Knows PKCE is the right flow and mentions validating tokens.
      weak: Uses the implicit flow or confuses authentication with authorisation scopes.
    followups:
      - What attack does PKCE prevent on a mobile device?
      - Why might a backend-for-frontend be worth the extra component?
    common_errors:
      - Allowing wildcard or prefix-matched redirect URIs.

  - external_key: technical.security.cors_reflection
    competency_key: security
    topic: CORS misconfiguration
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You notice an API reflects back whatever Origin header it receives and also allows credentials. What
      can an attacker actually do with that, and how would you fix it?
    expected_concepts:
      - malicious sites reading authenticated responses from a victim's browser
      - strict allowlist of trusted origins
      - never combining credentials with reflected or wildcard origins
      - the null origin and subdomain matching mistakes
      - Vary Origin for caches
      - CORS relaxes the same-origin policy and is not a CSRF control
    rubric:
      excellent: Explains cross-origin data theft clearly, fixes with an exact allowlist, and calls out regex and null-origin mistakes and the caching implication.
      good: Understands that authenticated data can be read cross-origin and proposes an allowlist.
      weak: Thinks CORS protects the server from requests or misreads the impact.
    followups:
      - How could a regular expression meant to allow your subdomains go wrong?
    common_errors:
      - Adding Access-Control-Allow-Origin wildcard and expecting credentials to work safely.

  # ------------------------------------------------------------- hard
  - external_key: technical.security.request_smuggling
    competency_key: security
    topic: HTTP request smuggling
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Explain HTTP request smuggling: why it happens between a front-end proxy and a back-end server, and how
      you'd defend a stack against it.
    expected_concepts:
      - disagreement over request boundaries from Content-Length and Transfer-Encoding
      - HTTP/2 to HTTP/1.1 downgrade issues
      - impact such as bypassing front-end controls, poisoning caches or hijacking other users' requests
      - rejecting ambiguous requests and normalising at the edge
      - using HTTP/2 end to end or consistent parsers
      - not reusing back-end connections across clients where it matters
    rubric:
      excellent: Explains the parsing disagreement precisely, gives realistic impacts, and proposes layered defences including normalisation, rejection of ambiguity and protocol choices.
      good: Understands the core boundary confusion and knows ambiguous headers should be rejected.
      weak: Confuses it with request forgery or cannot explain why two servers disagree.
    followups:
      - How would you test your own stack for this safely?
      - Why does connection reuse between the proxy and back end matter?
    common_errors:
      - Assuming a WAF in front of the application prevents smuggling by default.

  - external_key: technical.security.promo_code_race
    competency_key: security
    topic: Race conditions in business logic
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A promo code that should be redeemable only once was used fifty times by a single account in under a
      second. How would you investigate it, and how would you design redemption so this can't happen again?
    expected_concepts:
      - time-of-check to time-of-use race conditions under concurrent requests
      - atomic operations such as unique constraints or conditional updates
      - transactions with appropriate isolation or row locking
      - idempotency keys
      - reproducing with parallel requests in testing
      - reviewing logs to size the financial impact
    rubric:
      excellent: Diagnoses the check-then-act race, fixes it with database-enforced atomicity rather than application checks, and describes how to test for concurrency and assess impact.
      good: Identifies a race condition and proposes locking or a unique constraint.
      weak: Adds a client-side check, a sleep, or more validation in the same non-atomic path.
    followups:
      - Would a default READ COMMITTED transaction have prevented this?
      - Where else in a typical product would you look for the same pattern?
    common_errors:
      - Assuming wrapping the code in a transaction automatically prevents the race.

  - external_key: technical.security.second_order_injection
    competency_key: security
    topic: Second-order injection
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do second-order injection flaws slip past input validation and code review, and how would you
      hunt for them in a large codebase?
    expected_concepts:
      - data stored safely and later used unsafely in another context
      - internal or admin tools, reports and batch jobs trusting database content
      - treating every sink as untrusted regardless of source
      - taint tracking through storage with data-flow analysis tools
      - parameterisation and encoding at every sink
    rubric:
      excellent: Explains the stored-then-reused pattern with a concrete example, argues for sink-based defences, and describes a realistic hunting approach using data-flow tooling and review of internal consumers.
      good: Understands the delayed nature and proposes consistent parameterisation.
      weak: Believes validating input at the point of entry prevents it.
    followups:
      - Which internal systems tend to be most exposed to this?
    common_errors:
      - Treating data read from the application's own database as trusted.

  - external_key: technical.security.template_injection
    competency_key: security
    topic: Server-side template injection
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The marketing team wants customers to write their own email templates with placeholders, rendered on
      the server. What could go wrong, and how would you build it safely?
    expected_concepts:
      - server-side template injection leading to code execution
      - logic-less template languages instead of full engines
      - sandboxed rendering and its history of escapes
      - isolating the renderer with no secrets and restricted network
      - output escaping for the email context
      - resource limits to prevent denial of service
    rubric:
      excellent: Identifies template injection with code-execution impact, chooses a logic-less approach, and adds process isolation and resource limits as defence in depth.
      good: Recognises the template injection risk and proposes restricting template features.
      weak: Proposes blocklisting dangerous keywords in the template.
    followups:
      - How much would you trust a template engine's built-in sandbox mode?
    common_errors:
      - Relying on a keyword blocklist inside a full-featured template engine.

  - external_key: technical.security.microservice_authz_propagation
    competency_key: security
    topic: Authorisation across microservices
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      In a system of dozens of microservices, how do you keep authorisation decisions consistent, and how do
      you stop an internal service from being tricked into acting on behalf of the wrong user?
    expected_concepts:
      - the confused deputy problem
      - propagating signed end-user context rather than trusting headers
      - token exchange or downscoped tokens per hop
      - separating service identity from user identity
      - central policy engines or shared libraries for decisions
      - audit trails of who acted for whom
    rubric:
      excellent: Names the confused deputy risk, designs verifiable user context propagation with per-hop scoping, and balances central policy with local enforcement and auditing.
      good: Propagates user identity in tokens and checks permissions in each service.
      weak: Trusts any request from inside the network or relies on the gateway alone.
    followups:
      - What breaks if every service just trusts an X-User-Id header set by the gateway?
      - How would asynchronous jobs carry user context safely?
    common_errors:
      - Treating network location inside the cluster as proof of authorisation.

  - external_key: technical.security.cdn_cache_poisoning
    competency_key: security
    topic: Web cache poisoning
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Users report that your homepage occasionally loads a script from a domain you don't own, and it seems
      to come and go. Your site sits behind a CDN. How would you approach this?
    expected_concepts:
      - web cache poisoning through unkeyed inputs such as forwarded host headers
      - comparing cached and origin responses and reviewing cache keys
      - purging the cache as immediate mitigation
      - alternative causes like a compromised third-party script or tag manager
      - stripping or validating untrusted headers at the edge
      - Subresource Integrity for external scripts
    rubric:
      excellent: Forms competing hypotheses (cache poisoning, third-party compromise, local malware), gathers evidence to separate them, mitigates fast, and fixes the root cause in cache key or header handling.
      good: Suspects cache poisoning or a compromised script and proposes purging and investigating.
      weak: Assumes users have malware and closes the report.
    followups:
      - Which headers would you test as unkeyed inputs first?
      - How does Subresource Integrity help, and where can it not be used?
    common_errors:
      - Purging the cache and stopping there without finding the unkeyed input.
