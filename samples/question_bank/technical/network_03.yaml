# Curated questions: network engineering (part 3 of 4) — TLS and certificates, VPNs,
# firewalls, segmentation, access control, QoS, wireless and DDoS.
# `defaults` are merged into every question (question keys win). Medium is the default
# difficulty band; easy and hard questions override round_types.
version: 1
defaults:
  role_tags: [network]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.network.tls_trust_basics
    competency_key: networking
    topic: What a TLS handshake establishes
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      In plain terms, what does a TLS handshake accomplish, and how does a client decide whether to trust
      the certificate the server presents?
    expected_concepts:
      - agreeing on version and cipher suite
      - key exchange producing session keys
      - server certificate chain to a trusted root
      - hostname matching the certificate names
      - validity dates and revocation
    rubric:
      excellent: Explains negotiation, key exchange and authentication clearly, and describes chain building, hostname checks and expiry as the trust decision.
      good: Explains encryption setup and certificate validation with minor gaps.
      weak: Thinks the certificate itself encrypts the traffic or cannot explain trust.
    followups:
      - What is an intermediate certificate for?
      - What does SNI let a server do?
    common_errors:
      - Believing a self-signed certificate is trusted as long as traffic is encrypted.

  - external_key: technical.network.certificate_warning_outage
    competency_key: networking
    topic: Certificate warnings for every visitor
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A customer-facing site suddenly shows certificate warnings to every visitor. What would you check
      first, and how would you stop it happening again?
    expected_concepts:
      - expired certificate
      - wrong certificate served after a change
      - hostname not covered by the certificate
      - checking what the server presents with openssl or a browser
      - expiry monitoring and automated renewal
    rubric:
      excellent: Quickly checks expiry, served chain and names, restores service with a valid certificate and puts monitoring and automated renewal in place.
      good: Suspects expiry and knows how to check, with a basic prevention idea.
      weak: Tells users to accept the warning or cannot say how to inspect the certificate.
    followups:
      - The certificate on the server is valid but users still see the old one. Where else could it live?
      - How far ahead should expiry alerts fire?
    common_errors:
      - Renewing the certificate in one place while a load balancer still serves the old one.

  - external_key: technical.network.stateful_vs_stateless_filtering
    competency_key: network_engineering
    topic: Stateful versus stateless filtering
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Explain the difference between a stateful firewall and a stateless packet filter, and how that changes
      the rules you write.
    expected_concepts:
      - session table tracking connections
      - automatic return traffic for established sessions
      - stateless rules needing explicit return rules
      - ephemeral port ranges for return traffic
      - cloud examples such as security groups and network ACLs
    rubric:
      excellent: Explains connection tracking, shows how rule sets differ including return traffic on ephemeral ports, and gives a real example of each.
      good: Explains the difference correctly but the rule implications are brief.
      weak: Cannot explain what state means for a firewall.
    followups:
      - What happens to existing sessions when you change a stateful rule?
      - Why are stateless filters still used?
    common_errors:
      - Forgetting return traffic when writing stateless rules.

  - external_key: technical.network.vpn_types_compared
    competency_key: network_engineering
    topic: Site-to-site versus remote-access VPN
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Compare site-to-site and remote-access VPNs. Where would you use each, and what do you need to think
      about when setting them up?
    expected_concepts:
      - connecting networks versus individual users
      - IPsec for sites and TLS or IPsec clients for users
      - authentication with certificates and MFA for users
      - routing of the remote networks or client pools
      - capacity and redundancy
    rubric:
      excellent: Distinguishes the two by purpose and design, and covers authentication, routing, address pools and redundancy with practical examples.
      good: Distinguishes them correctly with some setup considerations.
      weak: Treats them as the same thing.
    followups:
      - How do the remote site's routes get into your network?
      - How would you authenticate remote users?
    common_errors:
      - Overlapping the VPN client pool with an existing internal range.

  - external_key: technical.network.is_it_the_firewall
    competency_key: network_engineering
    topic: Confirming firewall blocks
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An application team says a firewall is blocking their traffic to a database server. How would you
      confirm or rule that out quickly?
    expected_concepts:
      - firewall logs and deny hits for the flow
      - policy lookup or packet tracer tools
      - testing the port from the source with a TCP check
      - checking the service is listening on the server
      - host-based firewalls on the server
    rubric:
      excellent: Uses firewall logs or policy simulation and a test from the source, and checks the server side so the conclusion is based on evidence either way.
      good: Checks firewall logs and tests the port.
      weak: Opens a broad rule to see if it helps.
    followups:
      - The firewall shows the traffic allowed but the connection still fails. What next?
      - How do you tell a timeout from a refused connection, and what does each suggest?
    common_errors:
      - Not checking whether the service is listening at all.

  - external_key: technical.network.why_segment
    competency_key: network_engineering
    topic: Network segmentation decisions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Why would you segment a corporate network into zones, and how have you decided which systems belong in
      which segment?
    expected_concepts:
      - limiting lateral movement
      - grouping by trust level and function
      - compliance scope reduction
      - controlled flows between zones
      - guest, IoT and management networks kept apart
    rubric:
      excellent: Gives concrete security and operational reasons and describes a real zoning decision based on trust and data flows.
      good: Explains the benefits and names typical zones.
      weak: Thinks VLANs alone provide security without filtering between them.
    followups:
      - How do you find out which flows need to be allowed between zones?
      - Where would you put a building management system?
    common_errors:
      - Creating segments but allowing any traffic between them.

  - external_key: technical.network.weak_wifi_area
    competency_key: network_engineering
    topic: Wi-Fi problems in one area
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      People in one corner of the office say the Wi-Fi is slow and keeps dropping, while it's fine
      elsewhere. How would you investigate?
    expected_concepts:
      - signal strength and coverage at the location
      - co-channel interference and channel plan
      - access point load and client counts
      - roaming behaviour between access points
      - controller logs and a site survey
    rubric:
      excellent: Measures coverage and interference at the location, checks the access point and controller data, and distinguishes coverage, capacity and interference problems.
      good: Considers coverage and interference and checks the access point.
      weak: Suggests rebooting the access point or adding one without investigating.
    followups:
      - What would you look for in the access point's client statistics?
      - Why can adding more access points make things worse?
    common_errors:
      - Turning up transmit power without considering interference.

  # ---------------------------------------------------------------- medium
  - external_key: technical.network.chain_trust_errors
    competency_key: networking
    topic: Incomplete certificate chains
    difficulty: medium
    kind: scenario
    text: >-
      A new TLS certificate works in desktop browsers, but some mobile apps and API clients fail with trust
      errors. What's the likely cause, and how would you verify it?
    expected_concepts:
      - intermediate certificate missing from the served chain
      - browsers fetching or caching intermediates
      - inspecting the chain with openssl s_client
      - differing trust stores on older clients
      - certificate pinning in apps
    rubric:
      excellent: Identifies the missing intermediate as the most likely cause, verifies the served chain directly, and considers trust store differences and pinning.
      good: Suspects a chain problem and knows how to inspect it.
      weak: Regenerates the certificate without understanding the cause.
    followups:
      - Why do browsers hide this problem?
      - How would certificate pinning in a mobile app change your rollout plan?
    common_errors:
      - Serving only the leaf certificate.

  - external_key: technical.network.tls_termination_placement
    competency_key: networking
    topic: Where to terminate TLS
    difficulty: medium
    kind: technical
    text: >-
      Where would you terminate TLS in an architecture with a load balancer in front of many backend
      services, and what are the trade-offs of terminating at the edge versus passing it through?
    expected_concepts:
      - termination at the load balancer for layer 7 routing
      - re-encryption to backends
      - passthrough preserving end-to-end encryption
      - certificate management and key exposure
      - visibility for logging and security inspection
    rubric:
      excellent: Compares termination, re-encryption and passthrough clearly in terms of security, visibility, routing capability and operations, and picks one for a stated context.
      good: Explains termination versus passthrough with a sensible preference.
      weak: Does not see why traffic behind the load balancer might need encryption.
    followups:
      - What does passthrough prevent the load balancer from doing?
      - How would you protect private keys held on the edge tier?
    common_errors:
      - Assuming the internal network is trusted by default.

  - external_key: technical.network.ipsec_wont_establish
    competency_key: network_engineering
    topic: IPsec tunnel will not come up
    difficulty: medium
    kind: scenario
    text: >-
      A site-to-site IPsec tunnel to a partner worked yesterday, and today it won't come up. Walk me through
      how you'd troubleshoot it.
    expected_concepts:
      - which phase is failing from logs
      - proposal mismatch for encryption, hashing or DH group
      - pre-shared key or certificate problems
      - peer address change or NAT traversal
      - UDP 500 and 4500 and ESP reachability
      - what changed on either side
    rubric:
      excellent: Uses logs to locate the failing phase, checks reachability, proposals and authentication systematically, and asks what changed on both ends.
      good: Checks logs and lists likely mismatches.
      weak: Deletes and recreates the tunnel without diagnosis.
    followups:
      - The partner swears nothing changed. How do you prove where the failure is?
      - What changes when one side sits behind NAT?
    common_errors:
      - Not checking whether a certificate used for authentication has expired.

  - external_key: technical.network.tunnel_up_traffic_fails
    competency_key: network_engineering
    topic: VPN tunnel up but no traffic
    difficulty: medium
    kind: scenario
    text: >-
      The IPsec tunnel shows as up on both sides, but traffic between the two networks still doesn't flow.
      What would you look at next?
    expected_concepts:
      - traffic selectors or proxy IDs not matching
      - routes toward the tunnel on both sides
      - firewall policy allowing the traffic
      - NAT rules translating traffic before it enters the tunnel
      - encrypt and decrypt counters on each side
    rubric:
      excellent: Uses packet counters to find which direction fails, then checks selectors, routing, NAT exemption and policy on the relevant side.
      good: Names routing and selectors as likely causes.
      weak: Assumes the tunnel is fine because it shows as up.
    followups:
      - Counters show packets encrypted on your side but never decrypted on theirs. What does that suggest?
      - Why does NAT exemption matter here?
    common_errors:
      - Forgetting to exclude tunnel traffic from outbound NAT.

  - external_key: technical.network.firewall_rule_cleanup
    competency_key: network_engineering
    topic: Cleaning up a legacy rule base
    difficulty: medium
    kind: scenario
    text: >-
      You inherit a firewall with several thousand rules, many of them overly broad or undocumented. How
      would you clean it up without breaking production?
    expected_concepts:
      - hit counts and logs to find unused rules
      - identifying shadowed and redundant rules
      - narrowing broad rules based on observed traffic
      - owners and documentation for each rule
      - staged changes with disable before delete
      - review process to prevent regrowth
    rubric:
      excellent: Uses traffic data to drive changes, stages removals safely with rollback, involves rule owners and puts a review process in place.
      good: Uses hit counts and removes unused rules carefully.
      weak: Deletes rules that look wrong in one change.
    followups:
      - A rule has zero hits over three months. Is it safe to remove?
      - How would you stop the rule base from growing back?
    common_errors:
      - Treating zero hits over a short window as proof a rule is unused.

  - external_key: technical.network.split_or_full_tunnel
    competency_key: network_engineering
    topic: Split versus full tunnel VPN
    difficulty: medium
    kind: technical
    text: >-
      For a remote-access VPN, how do you decide between a full tunnel and a split tunnel, and what security
      and performance consequences come with each?
    expected_concepts:
      - full tunnel sends all traffic through the corporate network
      - split tunnel sends only internal traffic
      - bandwidth and latency for SaaS and video calls
      - loss of inspection for direct traffic
      - endpoint security controls compensating
      - DNS behaviour with split tunnels
    rubric:
      excellent: Weighs inspection and control against performance and capacity, includes DNS handling, and describes compensating controls for split tunnelling.
      good: Explains both options and one major trade-off of each.
      weak: Declares one option always correct.
    followups:
      - How would you handle DNS for internal names with a split tunnel?
      - What happens to VPN capacity if everyone works from home on a full tunnel?
    common_errors:
      - Ignoring DNS leakage and resolution of internal names.

  - external_key: technical.network.voice_quality_wan
    competency_key: network_engineering
    topic: QoS for voice over a busy WAN
    difficulty: medium
    kind: scenario
    text: >-
      Voice calls between two offices become choppy whenever large backups run over the WAN link. How would
      you design quality of service to fix it?
    expected_concepts:
      - classifying and marking traffic with DSCP
      - priority queueing for voice with a cap
      - shaping to the real link rate
      - trust boundaries for markings
      - consistent policy on both ends and through the provider
      - measuring jitter, loss and latency before and after
    rubric:
      excellent: Designs classification, marking, queueing and shaping end to end, explains why shaping to the real rate matters, and verifies with call quality metrics.
      good: Proposes prioritising voice and limiting backups.
      weak: Suggests just buying more bandwidth.
    followups:
      - Why does QoS do nothing if you don't shape below the provider's rate?
      - Who should you trust to mark traffic?
    common_errors:
      - Applying QoS in one direction only.

  - external_key: technical.network.tls_policy_retirement
    competency_key: security
    topic: TLS versions and cipher policy
    difficulty: medium
    kind: technical
    text: >-
      How would you decide which TLS versions and cipher suites to allow on public endpoints, and how would
      you retire older ones without cutting off real clients?
    expected_concepts:
      - TLS 1.2 and 1.3 as a baseline
      - forward secrecy and AEAD ciphers
      - measuring negotiated versions from logs
      - identifying and contacting legacy clients
      - staged rollout with monitoring
    rubric:
      excellent: Bases policy on current guidance and measured client data, plans a staged retirement with communication and monitoring, and explains why certain ciphers are excluded.
      good: Chooses modern versions and ciphers and mentions checking clients.
      weak: Disables old versions without checking who uses them, or keeps everything for compatibility.
    followups:
      - How would you find out which clients still negotiate older versions?
      - What would you do about a large partner that can't upgrade yet?
    common_errors:
      - Changing the policy without measuring negotiated protocol versions first.

  - external_key: technical.network.intrusion_detection_placement
    competency_key: security
    topic: Placing IDS and IPS
    difficulty: medium
    kind: technical
    text: >-
      Where would you place intrusion detection or prevention in a network, and how do you keep it useful
      rather than drowning the team in false positives?
    expected_concepts:
      - placement at the perimeter and between internal zones
      - detection versus inline prevention trade-offs
      - visibility limits with encrypted traffic
      - tuning signatures to the environment
      - feeding alerts into a triage process
    rubric:
      excellent: Chooses placements for specific threats, weighs inline risk against detection, and describes a tuning and triage loop that keeps alerts actionable.
      good: Proposes reasonable placement and mentions tuning.
      weak: Enables every signature inline and expects it to work.
    followups:
      - When would you run in detection-only mode first?
      - How does encryption limit what it can see?
    common_errors:
      - Ignoring east-west traffic entirely.

  - external_key: technical.network.port_based_access_control
    competency_key: network_engineering
    topic: Network access control
    difficulty: medium
    kind: technical
    text: >-
      How would you control which devices are allowed onto wired and wireless networks in an office, and how
      do you handle devices like printers that can't do proper authentication?
    expected_concepts:
      - 802.1X with RADIUS
      - certificate or credential based device authentication
      - MAC authentication bypass for limited devices
      - dynamic VLAN or policy assignment
      - profiling and a restricted segment for unknown devices
      - monitor mode before enforcement
    rubric:
      excellent: Designs 802.1X with sensible fallbacks, contains weaker devices with restricted policies, and plans a phased rollout starting in monitor mode.
      good: Explains 802.1X and MAC bypass for printers.
      weak: Relies only on port security or hidden SSIDs.
    followups:
      - Why is MAC authentication weaker, and how do you limit the damage?
      - How would you roll this out without locking people out?
    common_errors:
      - Enforcing immediately without a monitor phase.

  - external_key: technical.network.egress_filtering_rollout
    competency_key: security
    topic: Egress filtering
    difficulty: medium
    kind: technical
    text: >-
      Many networks focus on inbound rules. Why does egress filtering matter, and how would you introduce it
      on a network that currently allows all outbound traffic?
    expected_concepts:
      - limiting data exfiltration and command and control
      - learning current outbound flows from logs
      - allow lists by segment and destination
      - forcing traffic through proxies and approved DNS
      - phased enforcement with exceptions process
    rubric:
      excellent: Explains the threat model, uses observed traffic to build policy, and introduces it in phases with a clear exceptions process.
      good: Explains why egress control matters and proposes starting with logging.
      weak: Blocks everything outbound in one change.
    followups:
      - How would you handle servers that need to reach software update services?
      - What role does DNS play in egress control?
    common_errors:
      - Not controlling outbound DNS, leaving an easy bypass.

  - external_key: technical.network.wireless_capacity_plan
    competency_key: network_engineering
    topic: Planning wireless coverage
    difficulty: medium
    kind: technical
    text: >-
      When you plan wireless coverage for a busy office floor, what decides the number and placement of
      access points and the channel plan?
    expected_concepts:
      - designing for capacity, not just coverage
      - building materials and attenuation
      - channel widths and reuse in 5 GHz and 6 GHz
      - client density and application needs
      - predictive survey followed by a validation survey
    rubric:
      excellent: Plans for capacity and client density, accounts for building materials and channel reuse, and validates with a survey after installation.
      good: Considers coverage and channels with some attention to density.
      weak: Places access points evenly without considering capacity or interference.
    followups:
      - Why might you choose narrower channels in a dense area?
      - How do you validate the design once it's installed?
    common_errors:
      - Planning only for signal strength rather than client load.

  # ------------------------------------------------------------------ hard
  - external_key: technical.network.zero_trust_transition
    competency_key: network_engineering
    topic: Moving toward zero trust
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Leadership wants to move away from a flat, VPN-based network toward a zero trust model. How would you
      plan that transition from the network side?
    expected_concepts:
      - inventory of users, devices, applications and flows
      - identity-aware access proxies per application
      - device posture as part of access decisions
      - segmentation to limit lateral movement
      - phased migration by application with VPN as fallback
      - logging and continuous verification
    rubric:
      excellent: Lays out a phased plan grounded in an inventory of flows, explains the roles of identity, device posture and segmentation, and manages risk during coexistence with the VPN.
      good: Explains the main ideas and proposes a reasonable phased approach.
      weak: Treats zero trust as a product to buy or as simply adding MFA.
    followups:
      - Which applications would you move first, and why?
      - How do legacy applications that can't support modern authentication fit in?
    common_errors:
      - Removing the VPN before replacement access paths are proven.

  - external_key: technical.network.undocumented_microsegmentation
    competency_key: network_engineering
    topic: Microsegmentation with unknown flows
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you implement microsegmentation in a data centre where workloads talk to each other in ways
      nobody has fully documented?
    expected_concepts:
      - discovering flows from flow logs or host agents
      - grouping workloads by application and role labels
      - policy in visibility or alert mode first
      - enforcing per application with rollback
      - handling shared services like DNS, monitoring and backups
      - keeping policy current as applications change
    rubric:
      excellent: Starts with flow discovery, builds label-based policy, runs it in observe mode before enforcing per application, and plans for shared services and ongoing change.
      good: Proposes discovery before enforcement with a reasonable policy model.
      weak: Writes rules from guesswork and enforces them all at once.
    followups:
      - A rarely used quarterly job breaks after enforcement. How do you avoid that?
      - Where would you enforce the policy, on hosts or in the network?
    common_errors:
      - Observing for too short a period to catch infrequent flows.

  - external_key: technical.network.volumetric_ddos_response
    competency_key: network_engineering
    topic: Responding to a volumetric DDoS
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your public services are hit by a volumetric DDoS attack that saturates your internet links. What can
      you do during the attack, and what would you put in place afterwards?
    expected_concepts:
      - on-premises filtering cannot help once links are full
      - upstream provider filtering and blackholing
      - scrubbing services via BGP or DNS diversion
      - remotely triggered blackhole trade-offs
      - CDN and anycast absorption
      - runbooks and pre-arranged contacts
    rubric:
      excellent: Recognises that mitigation must happen upstream, uses provider and scrubbing options with their trade-offs, and plans durable protections and rehearsed runbooks.
      good: Contacts the provider and proposes a scrubbing service.
      weak: Tries to block attack traffic on the local firewall.
    followups:
      - What does a remotely triggered blackhole cost you?
      - How would you prepare so diversion takes minutes rather than hours?
    common_errors:
      - Expecting the local firewall to absorb an attack that has already filled the link.

  - external_key: technical.network.outbound_tls_inspection
    competency_key: security
    topic: Decrypting outbound TLS
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your security team wants to decrypt and inspect outbound TLS traffic at the firewall. What would you
      need to consider before agreeing, and how would you implement it?
    expected_concepts:
      - internal CA trusted by managed devices
      - exemptions for pinned apps and sensitive categories
      - privacy and legal review
      - performance and capacity impact
      - unmanaged devices and certificate errors
      - protecting the inspection CA key
    rubric:
      excellent: Weighs security value against privacy, breakage and performance, defines exemptions and governance, and secures the CA used for re-signing.
      good: Explains the CA requirement and some breakage risks.
      weak: Enables decryption for everything without considering impact.
    followups:
      - Which categories of traffic would you exempt, and why?
      - What happens if the inspection CA's private key leaks?
    common_errors:
      - Ignoring applications that pin certificates.

  - external_key: technical.network.branch_connectivity_resilience
    competency_key: network_engineering
    topic: Resilient branch connectivity
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You need to connect fifty branch offices so that a single tunnel, device or internet provider failure
      doesn't take any branch offline. How would you design it?
    expected_concepts:
      - dual internet links from different providers
      - redundant hub sites or SD-WAN controllers
      - dynamic routing over tunnels
      - fast failure detection with BFD or path probes
      - application-aware path selection
      - templated configuration and central monitoring
    rubric:
      excellent: Removes single points of failure at each layer, explains how failures are detected and routed around quickly, and covers operating fifty sites consistently.
      good: Proposes dual links and redundant hubs with dynamic routing.
      weak: Adds a backup link without describing how failover works.
    followups:
      - How quickly should a branch fail over, and what drives that?
      - Both links use the same physical path into the building. What do you do?
    common_errors:
      - Assuming two providers means two physically diverse paths.

  - external_key: technical.network.internal_pki_design
    competency_key: security
    topic: Internal certificate authority design
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      If you had to build an internal certificate authority for services and network devices, how would you
      design it, and how would you handle issuing, rotating and revoking certificates at scale?
    expected_concepts:
      - offline root and online issuing intermediates
      - protecting keys with HSMs or equivalent
      - automated enrolment with ACME or SCEP
      - short-lived certificates reducing revocation reliance
      - revocation with CRL or OCSP where needed
      - inventory and expiry monitoring
    rubric:
      excellent: Designs a tiered hierarchy with strong key protection, automates issuance and rotation, and explains why short lifetimes beat relying on revocation.
      good: Proposes a root and intermediate with some automation.
      weak: Issues long-lived certificates by hand from a single CA.
    followups:
      - How would you get network devices to renew automatically?
      - What happens if the issuing CA is compromised?
    common_errors:
      - Keeping the root CA online.
