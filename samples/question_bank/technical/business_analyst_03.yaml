# Curated questions: business analysis (part 3 of 4).
# Data analysis with SQL and spreadsheets for analysts: querying and reconciling data, data quality,
# metric and KPI definitions, reporting and dashboard requirements, sizing and business cases.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; medium also in deep_technical; hard in deep_technical
# and combined.
version: 1
defaults:
  role_tags: [business_analyst]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.business_analyst.sql_to_answer_business_question
    competency_key: sql
    topic: Answering a business question with SQL
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A product owner asks how many customers placed more than one order last quarter. You have a
      customers table and an orders table. Talk me through how you'd write that query and how you'd check
      the answer is right.
    expected_concepts:
      - filtering orders to the quarter by order date
      - grouping by customer and counting orders
      - HAVING to keep customers with more than one order
      - counting the resulting customers
      - sanity checks such as comparing to total customers or spot-checking a few
    rubric:
      excellent: Describes a correct query using GROUP BY and HAVING with a precise date filter, raises questions like whether cancelled orders count, and validates the result with independent checks.
      good: Describes a correct query and some way of checking it.
      weak: Cannot structure the aggregation or uses WHERE where HAVING is needed.
    followups:
      - Should cancelled or refunded orders count? How would you find out?
      - How would the query change to show this per month?
    common_errors:
      - Using an inclusive end date that pulls in orders from the first day of the next quarter.

  - external_key: technical.business_analyst.join_types_missing_rows
    competency_key: sql
    topic: Choosing joins without losing records
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      You need a list of all products with their total sales, including products that haven't sold
      anything yet. How would you join the tables, and what would go wrong with the wrong join?
    expected_concepts:
      - LEFT JOIN from products to sales
      - inner join silently drops unsold products
      - COALESCE to show zero instead of null
      - filtering in the ON clause versus WHERE affecting the outer join
      - checking the row count matches the product count
    rubric:
      excellent: Uses a left join from products with aggregation and COALESCE, explains how a WHERE filter on the sales table can turn it back into an inner join, and validates the row count.
      good: Chooses a left join correctly and explains why.
      weak: Uses an inner join or cannot explain how rows go missing.
    followups:
      - How would you only count sales from this year without losing unsold products?
      - What would a duplicate in the product table do to your totals?
    common_errors:
      - Putting the date filter in WHERE on the outer table and losing the zero-sales products.

  - external_key: technical.business_analyst.spreadsheet_data_checks
    competency_key: data_analysis
    topic: Checking a spreadsheet extract before analysis
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Someone sends you a spreadsheet export of last year's sales and asks for insights by Friday. What
      do you check before you start analysing it?
    expected_concepts:
      - where the data came from and what filters were applied
      - row counts and totals against a known figure
      - duplicates, blanks and inconsistent formats
      - dates and numbers stored as text
      - definitions of each column with the data owner
    rubric:
      excellent: Describes a systematic set of checks on source, completeness, duplicates and formats, reconciles to a known total and confirms column definitions before analysis.
      good: Checks for duplicates, blanks and obvious errors.
      weak: Starts building charts straight away without checking.
    followups:
      - Which spreadsheet features do you use for these checks?
      - What would you do if the total didn't match the finance figure?
    common_errors:
      - Trusting an extract without knowing which filters were applied when it was pulled.

  - external_key: technical.business_analyst.pivot_analysis_example
    competency_key: data_analysis
    topic: Exploring data with pivot tables
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Give me an example of how you've used pivot tables or a similar tool to explore a dataset and find
      something the business didn't already know.
    expected_concepts:
      - starting with a question or hypothesis
      - slicing by relevant dimensions such as region, product or time
      - comparing counts, sums and rates rather than raw totals only
      - drilling down to the underlying records to confirm
      - turning the finding into a recommendation
    rubric:
      excellent: Gives a concrete example with a clear question, the slicing that revealed the insight, verification against detailed records and the business action that followed.
      good: Describes a reasonable pivot analysis with a finding.
      weak: Describes the mechanics of pivot tables with no real insight or example.
    followups:
      - Why did you use rates instead of totals there, or would you now?
      - How did you present the finding?
    common_errors:
      - Comparing raw totals across groups of very different sizes.

  - external_key: technical.business_analyst.lookup_mismatch
    competency_key: data_analysis
    topic: Matching records across two lists
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You're matching a list of supplier invoices from finance against purchase orders from procurement
      in a spreadsheet, and about a fifth of them don't match. How would you work out why?
    expected_concepts:
      - checking key formats such as leading zeros, spaces and case
      - partial matches and differing identifiers between systems
      - genuine missing records versus timing differences
      - categorising unmatched items by reason
      - fixing the cause upstream rather than only the spreadsheet
    rubric:
      excellent: Investigates format issues systematically, distinguishes data mismatches from real missing records and timing, categorises the remainder and recommends fixing the upstream cause.
      good: Checks key formats and investigates a sample of mismatches.
      weak: Assumes the data is missing or fixes rows by hand without understanding the cause.
    followups:
      - How would you present the unmatched items to finance and procurement?
      - What would you do if the two systems use different supplier IDs?
    common_errors:
      - Overlooking trailing spaces or numbers stored as text when lookups fail.

  - external_key: technical.business_analyst.kpi_definition_dispute
    competency_key: data_analysis
    topic: Agreeing a metric definition
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Sales and marketing report different numbers for "active customers" in the same meeting. You're
      asked to sort it out. What would you do?
    expected_concepts:
      - finding each team's definition and data source
      - showing exactly where and why the numbers differ
      - agreeing one definition with the metric owner
      - documenting it in a shared glossary or data dictionary
      - updating reports to use the agreed definition
    rubric:
      excellent: Reconciles the two numbers by definition and source, facilitates agreement on a single owned definition, documents it and gets reports changed.
      good: Identifies the definitional difference and proposes a common definition.
      weak: Picks one team's number as correct without understanding the difference.
    followups:
      - What if both definitions are legitimate for different purposes?
      - Where would you record the agreed definition?
    common_errors:
      - Agreeing a definition verbally without changing the reports that produce the numbers.

  - external_key: technical.business_analyst.report_requirements_gathering
    competency_key: requirements_analysis
    topic: Gathering requirements for a report or dashboard
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A regional manager asks for "a dashboard with all the sales data." How would you turn that into a
      useful set of requirements?
    expected_concepts:
      - which decisions the dashboard will support and how often
      - the key measures and their definitions
      - dimensions and filters needed such as region and period
      - data freshness and access permissions
      - a quick mock-up to confirm before building
    rubric:
      excellent: Starts from the decisions the manager makes, narrows to a few defined measures, covers freshness and access, and confirms the design with a mock-up.
      good: Asks what metrics and filters are needed and confirms with a sketch.
      weak: Lists every available field as a requirement.
    followups:
      - How would you know a few months later whether the dashboard is being used?
      - What would you leave out of the first version?
    common_errors:
      - Building a dashboard of everything, so no number stands out and nobody acts on it.

  # ---------------------------------------------------------------- medium
  - external_key: technical.business_analyst.duplicate_inflated_totals
    competency_key: sql
    topic: Diagnosing totals inflated by a join
    difficulty: medium
    kind: scenario
    text: >-
      Your query for revenue by region comes out about thirty percent higher than the finance report.
      You suspect your joins. How would you investigate and fix it?
    expected_concepts:
      - checking for one-to-many joins that duplicate order rows
      - comparing row counts before and after each join
      - aggregating at the right grain before joining
      - checking filters such as status, currency and date basis against finance
      - reconciling to the finance figure step by step
    rubric:
      excellent: Diagnoses fan-out by checking counts at each join, fixes it by aggregating at the right grain, and reconciles remaining differences like status, currency or date basis with finance.
      good: Identifies duplicate rows from joins and how to fix them.
      weak: Applies DISTINCT everywhere or adjusts numbers without finding the cause.
    followups:
      - When is SELECT DISTINCT a bad fix here?
      - What other differences besides joins could explain the gap?
    common_errors:
      - Hiding the duplication with DISTINCT, which also merges legitimate identical rows.

  - external_key: technical.business_analyst.window_function_use
    competency_key: sql
    topic: Using window functions for analysis
    difficulty: medium
    kind: technical
    text: >-
      Tell me about an analysis where you needed something like a running total, a ranking within groups
      or each customer's first purchase. How did you approach it in SQL?
    expected_concepts:
      - window functions with PARTITION BY and ORDER BY
      - ROW_NUMBER or RANK for first or top items per group
      - running totals with SUM over an ordered window
      - LAG or LEAD to compare with the previous record
      - the difference from GROUP BY, which collapses rows
    rubric:
      excellent: Describes a real analysis, writes or explains the window function correctly, and explains why it was better than self-joins or GROUP BY for that question.
      good: Explains window functions correctly with a plausible example.
      weak: Can only describe solving it with manual spreadsheet work or cannot explain partitioning.
    followups:
      - How would you handle ties when picking the top product per region?
      - How would you calculate days between a customer's consecutive orders?
    common_errors:
      - Forgetting ORDER BY inside the window, so the running total order is undefined.

  - external_key: technical.business_analyst.funnel_conversion_analysis
    competency_key: data_analysis
    topic: Analysing a conversion funnel
    difficulty: medium
    kind: scenario
    text: >-
      Online loan applications are being started but only a small share get submitted. You have event
      data for each step. How would you analyse where and why people drop off?
    expected_concepts:
      - defining funnel steps and per-step conversion
      - segmenting by device, channel and applicant type
      - time spent and error events at each step
      - comparing against changes over time such as releases
      - combining data with qualitative input such as session recordings or support calls
    rubric:
      excellent: Builds a step-by-step funnel, segments it to find where drop-off concentrates, looks at errors and timing, and combines data with qualitative evidence to form testable hypotheses.
      good: Builds the funnel and segments it to locate the biggest drop.
      weak: Reports the overall conversion rate with no breakdown.
    followups:
      - How would you count a user who returns two days later and finishes?
      - What change would you propose testing first?
    common_errors:
      - Counting sessions rather than applicants, so returning users look like drop-offs.

  - external_key: technical.business_analyst.data_quality_rules
    competency_key: data_analysis
    topic: Defining data quality rules
    difficulty: medium
    kind: technical
    text: >-
      If you were asked to define data quality requirements for customer master data, how would you
      decide what "good" means and how it gets measured?
    expected_concepts:
      - dimensions such as completeness, validity, uniqueness, consistency and timeliness
      - rules tied to business use of the data
      - thresholds and measurement queries for each rule
      - ownership and remediation process for failures
      - prevention at the point of entry
    rubric:
      excellent: Defines specific, measurable rules across several dimensions tied to business impact, with owners, thresholds, monitoring and prevention at entry.
      good: Names quality dimensions and gives measurable example rules.
      weak: Says data should be "accurate and complete" without measurable rules.
    followups:
      - Which quality issue in customer data costs the business most, in your experience?
      - How would you detect duplicate customers with slightly different names?
    common_errors:
      - Setting rules nobody owns, so failures are reported and never fixed.

  - external_key: technical.business_analyst.sizing_estimate
    competency_key: data_analysis
    topic: Sizing an opportunity with limited data
    difficulty: medium
    kind: scenario
    text: >-
      The business wants to know whether adding a click-and-collect option is worth building. There's no
      direct data on demand. How would you estimate the potential benefit?
    expected_concepts:
      - breaking the estimate into drivers such as orders, adoption rate and savings
      - using proxies like delivery complaints, store traffic or competitor data
      - stating assumptions and ranges explicitly
      - sensitivity analysis on the most uncertain drivers
      - proposing a small pilot to validate
    rubric:
      excellent: Builds a driver-based estimate with clearly stated assumptions and ranges, identifies which assumption matters most, and proposes a cheap way to test it.
      good: Builds a reasonable estimate with stated assumptions.
      weak: Gives a guess or refuses to estimate without perfect data.
    followups:
      - Which assumption would you most want to validate first?
      - How would you present the uncertainty to the sponsor?
    common_errors:
      - Presenting a single precise number that hides how uncertain the inputs are.

  - external_key: technical.business_analyst.data_dictionary_ownership
    competency_key: data_analysis
    topic: Building a data dictionary
    difficulty: medium
    kind: technical
    text: >-
      On a reporting project, how would you build and maintain a data dictionary that analysts and
      business users actually trust and use?
    expected_concepts:
      - business definition, source, calculation and owner for each field or metric
      - examples and known caveats
      - starting with the most used and disputed terms
      - linking the dictionary into reports and tools
      - a change process when definitions change
    rubric:
      excellent: Describes the content of each entry, a pragmatic rollout starting with high-value terms, embedding it where people work and governance for changes.
      good: Describes useful fields in the dictionary and keeping it up to date.
      weak: Proposes a one-off spreadsheet of column names with no owner.
    followups:
      - How would you handle a term that means different things to two departments?
      - Who keeps it current after the project ends?
    common_errors:
      - Documenting technical column names but not the business meaning and calculation.

  - external_key: technical.business_analyst.cohort_retention_analysis
    competency_key: data_analysis
    topic: Cohort and retention analysis
    difficulty: medium
    kind: technical
    text: >-
      How would you analyse whether customers who joined this year are sticking around better or worse
      than those who joined last year?
    expected_concepts:
      - grouping customers into cohorts by start month
      - defining retention or activity precisely
      - comparing retention at the same tenure across cohorts
      - controlling for mix changes such as channel or plan
      - presenting as a cohort table or retention curves
    rubric:
      excellent: Defines cohorts and the activity measure precisely, compares at equal tenure, checks for mix differences and presents it clearly, ideally with how they'd compute it in SQL or a spreadsheet.
      good: Describes a cohort table with a sensible retention definition.
      weak: Compares overall active counts this year versus last year.
    followups:
      - How would a price change mid-year affect your comparison?
      - How would you build the cohort table in SQL?
    common_errors:
      - Comparing newer cohorts at shorter tenure against older cohorts at longer tenure.

  - external_key: technical.business_analyst.presenting_findings
    competency_key: communication
    topic: Presenting data findings to decision makers
    difficulty: medium
    kind: scenario
    text: >-
      Your analysis shows that a popular discount programme is losing money. You have ten minutes with
      the leadership team who championed it. How would you structure what you present?
    expected_concepts:
      - leading with the conclusion and its business impact
      - a small number of clear charts supporting the point
      - explaining method and assumptions briefly and openly
      - anticipating objections with backup analysis
      - recommending options and next steps
    rubric:
      excellent: Leads with the key finding, supports it with a few clear visuals, addresses likely objections with evidence and offers options rather than just criticism.
      good: Structures the message clearly with evidence and a recommendation.
      weak: Walks through the whole analysis chronologically or overloads the slides with tables.
    followups:
      - What question would you expect first, and how would you answer it?
      - How would you handle it if they disagree with your assumptions?
    common_errors:
      - Burying the conclusion after many slides of method.

  - external_key: technical.business_analyst.excel_model_robustness
    competency_key: data_analysis
    topic: Building a reliable spreadsheet model
    difficulty: medium
    kind: technical
    text: >-
      When you build a spreadsheet model that other people will reuse, say for a cost-benefit case, what
      do you do to keep it understandable and to avoid formula errors?
    expected_concepts:
      - separating inputs, calculations and outputs
      - no hard-coded numbers inside formulas
      - consistent formulas and named ranges
      - checks and control totals built into the sheet
      - documenting assumptions and version control
    rubric:
      excellent: Describes a clear structure, specific practices to prevent and catch errors, built-in checks and documentation, with an example of an error they caught or prevented.
      good: Separates inputs and calculations and adds some checks.
      weak: Builds everything on one sheet with typed-in numbers and no checks.
    followups:
      - How would someone else review your model?
      - When would you move the analysis out of a spreadsheet?
    common_errors:
      - Overwriting a formula with a typed value that silently breaks later updates.

  - external_key: technical.business_analyst.anomaly_in_report
    competency_key: data_analysis
    topic: Investigating a sudden change in a metric
    difficulty: medium
    kind: scenario
    text: >-
      On Monday the weekly report shows returns jumped forty percent. Before anyone acts on it, how would
      you work out whether it's real and what's behind it?
    expected_concepts:
      - checking for data pipeline or definition changes first
      - breaking the change down by product, channel and region
      - comparing with seasonality and prior periods
      - checking related operational events such as a new policy or bad batch
      - communicating findings and confidence promptly
    rubric:
      excellent: Rules out data or definition issues first, decomposes the change to find where it concentrates, considers business events and seasonality and communicates a clear explanation with appropriate caveats.
      good: Checks for data errors and breaks the number down by dimension.
      weak: Takes the number at face value or only guesses at causes.
    followups:
      - Who would you contact first while investigating?
      - How would you tell leadership if the jump turns out to be a data error?
    common_errors:
      - Jumping to a business explanation before ruling out a reporting change.

  - external_key: technical.business_analyst.sql_case_segmentation
    competency_key: sql
    topic: Segmenting data with conditional logic in SQL
    difficulty: medium
    kind: technical
    text: >-
      Suppose the business wants customers grouped into bands such as new, regular and lapsed based on
      their order history. How would you build that segmentation in SQL, and how would you agree the
      rules?
    expected_concepts:
      - computing per-customer measures like first order, last order and order count
      - CASE expressions to assign segments
      - ordered, mutually exclusive conditions
      - agreeing thresholds with the business and documenting them
      - checking that every customer lands in exactly one segment
    rubric:
      excellent: Builds per-customer measures first, uses a CASE with mutually exclusive ordered conditions, validates coverage and counts per segment, and agrees thresholds with the business.
      good: Uses aggregation plus CASE correctly with some validation.
      weak: Cannot express the logic or leaves overlapping conditions.
    followups:
      - How would you handle customers with no orders at all?
      - How would you show how customers move between segments month to month?
    common_errors:
      - Overlapping CASE conditions where order of evaluation silently decides the segment.

  - external_key: technical.business_analyst.reporting_nfr_freshness
    competency_key: requirements_analysis
    topic: Data freshness and access requirements for reporting
    difficulty: medium
    kind: technical
    text: >-
      For a new operational reporting solution, how would you work out with the business how up to date
      the data needs to be and who should see what?
    expected_concepts:
      - linking freshness to the decisions made and how quickly they're acted on
      - cost and complexity trade-off of real-time versus daily
      - row-level and role-based access to sensitive data
      - historical retention and point-in-time reporting needs
      - agreed service levels for data availability
    rubric:
      excellent: Derives freshness from decision timing, explains cost trade-offs to stakeholders, defines access rules for sensitive data and agrees measurable service levels.
      good: Captures freshness and access requirements with reasons.
      weak: Accepts "real time" by default or ignores access controls.
    followups:
      - What would make you push back on a real-time request?
      - How would you test that a regional manager only sees their region?
    common_errors:
      - Asking users how fresh they want the data rather than what decision depends on it.

  # ------------------------------------------------------------------ hard
  - external_key: technical.business_analyst.misleading_average
    competency_key: data_analysis
    topic: Avoiding misleading conclusions from aggregates
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After a new support tool rolled out, average resolution time went up, and leadership wants to
      roll it back. When you dig in, each support team is actually faster than before. How could that
      happen, and how would you present it?
    expected_concepts:
      - change in the mix of ticket types or teams
      - Simpson's paradox when aggregated rates hide subgroup trends
      - comparing like-for-like segments
      - medians and distributions alongside averages
      - clear visual showing both the overall and segment view
    rubric:
      excellent: Explains the mix shift precisely, shows how to verify it with segmented data and distributions, and proposes a clear way to present it so leadership reaches the right decision.
      good: Identifies the mix change and recommends segment-level comparison.
      weak: Cannot reconcile the numbers or simply defends the tool.
    followups:
      - What data would you need to confirm the mix explanation?
      - How would you set up the metric so this doesn't mislead again?
    common_errors:
      - Arguing from averages alone when the population being averaged has changed.

  - external_key: technical.business_analyst.causal_claim_caution
    competency_key: data_analysis
    topic: Distinguishing correlation from impact
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      A stakeholder shows you that customers who use the mobile app spend more and wants to push
      everyone onto the app to raise revenue. How would you assess whether the app is actually causing
      the extra spend?
    expected_concepts:
      - selection effect since high spenders may adopt the app
      - comparing before and after for the same customers
      - matched comparison groups or controlling for prior spend
      - a randomised test such as an incentive to some customers
      - communicating the limits of the evidence
    rubric:
      excellent: Identifies the selection problem, proposes progressively stronger evidence from before-after and matched comparisons to a controlled test, and explains the limits in business terms.
      good: Recognises correlation is not causation and suggests a test or comparison.
      weak: Accepts the causal claim or rejects it without proposing how to test it.
    followups:
      - How would you design a fair test with the marketing team?
      - What would you say if the test isn't possible?
    common_errors:
      - Comparing app users with non-users without accounting for how they differed beforehand.

  - external_key: technical.business_analyst.business_case_build
    competency_key: product_sense
    topic: Building a business case
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Walk me through how you'd build a business case for replacing a manual claims-handling process with
      a new system, in a way the finance team would accept.
    expected_concepts:
      - clear problem statement and options including do nothing
      - quantified benefits with stated assumptions and owners
      - full costs including implementation, licences, change and running costs
      - payback, NPV or similar measures over a realistic horizon
      - risks, sensitivity and how benefits will be tracked
    rubric:
      excellent: Compares options against a do-nothing baseline, quantifies benefits with owned assumptions, includes full lifecycle costs, uses standard financial measures and plans benefit tracking.
      good: Covers costs, benefits and a payback estimate with some assumptions.
      weak: Lists qualitative benefits only or ignores ongoing costs.
    followups:
      - How would you avoid double counting benefits?
      - Who would you ask to own each benefit?
    common_errors:
      - Counting time saved as cash saved without a plan for how the capacity is used.

  - external_key: technical.business_analyst.sql_reconcile_two_systems
    competency_key: sql
    topic: Reconciling records between two systems in SQL
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You have order data from the e-commerce platform and from the ERP, and they're supposed to match.
      How would you write the SQL to find orders missing from either side and orders whose amounts differ?
    expected_concepts:
      - full outer join or union of anti-joins on the order key
      - comparing amounts with a tolerance for rounding
      - normalising keys, currencies and status before comparing
      - categorising differences into missing, extra and mismatched
      - handling timing windows for orders in transit
    rubric:
      excellent: Designs a full comparison with outer or anti-joins, key normalisation, tolerance, categorised differences and a timing window, and explains how results go to the owners.
      good: Uses joins to find missing and mismatched records correctly.
      weak: Compares only totals or can only find records missing on one side.
    followups:
      - How would you handle null amounts in the comparison?
      - How would you run this daily and track whether differences are resolved?
    common_errors:
      - Comparing amounts with plain equality so null values never show up as mismatches.

  - external_key: technical.business_analyst.metric_gaming_risk
    competency_key: product_sense
    topic: Designing KPIs that drive the right behaviour
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A contact centre is about to be measured on average call handling time. You've been asked to help
      design the KPI set. What risks do you see, and what would you propose?
    expected_concepts:
      - risk of rushed calls and repeat contacts
      - balancing measures such as first contact resolution and customer satisfaction
      - linking metrics to the business outcome
      - segmenting by call type so complex calls aren't penalised
      - reviewing the metrics for unintended effects after launch
    rubric:
      excellent: Explains how the single metric could be gamed, proposes a balanced set tied to outcomes with segmentation, and plans to review for unintended behaviour.
      good: Identifies the risk and adds balancing metrics.
      weak: Accepts handling time as the KPI or proposes too many metrics with no clear purpose.
    followups:
      - How would you detect agents transferring calls to keep their times low?
      - Which one metric would you show on the floor display?
    common_errors:
      - Adding a balancing metric that is measured so rarely it has no effect.

  - external_key: technical.business_analyst.regulatory_report_lineage
    competency_key: data_analysis
    topic: Data lineage for a regulatory report
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A regulator has questioned a figure in a quarterly report, and nobody can explain exactly which
      systems and adjustments produced it. You're asked to make the report defensible. How would you go
      about it?
    expected_concepts:
      - tracing the figure back through each source, transformation and manual adjustment
      - documenting lineage and calculation logic per reported line
      - controls and sign-offs on manual adjustments
      - reconciliation to source systems each period
      - reducing spreadsheet steps and assigning owners
    rubric:
      excellent: Reconstructs lineage for the questioned figure first, then sets up documented lineage, reconciliations, controlled adjustments and clear ownership so every figure can be explained.
      good: Traces the data sources and documents the calculation with some controls.
      weak: Focuses only on rewriting the report's queries without lineage or controls.
    followups:
      - Which manual steps would you target for removal first?
      - How would you evidence the controls to an auditor?
    common_errors:
      - Documenting lineage once without a process to keep it current as systems change.
