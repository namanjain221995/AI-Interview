# Curated questions: UX / UI designer (part 1 of 4).
# User research: method choice, planning, recruiting, interviewing, synthesis, surveys, analytics,
# journey maps, research operations and turning research into product decisions.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [ux_designer]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.ux_designer.research_method_choice
    competency_key: ux_research
    topic: Choosing a research method
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a product team brings you a new question about their users, how do you decide which research
      method to use? Walk me through a recent example where you picked one method over another.
    expected_concepts:
      - starting from the decision the research must inform
      - generative versus evaluative questions
      - attitudinal versus behavioural data
      - qualitative depth versus quantitative scale
      - time, budget and access to participants as constraints
    rubric:
      excellent: Frames the method choice around the decision and the type of question, compares at least two methods with clear trade-offs, and grounds it in a real study with what it changed.
      good: Explains a sensible choice for a real project and names one alternative they considered.
      weak: Uses the same method for every question or chooses a method because it is familiar, without linking it to what the team needed to learn.
    followups:
      - What would have made you choose the other method instead?
      - Looking back, did the method you picked answer the question the team actually had?
    common_errors:
      - Jumping to usability testing when the team does not yet know what problem to solve.

  - external_key: technical.ux_designer.interview_guide_neutral
    competency_key: ux_research
    topic: Writing a neutral interview guide
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Talk me through how you put together a discussion guide for user interviews. How do you make sure
      your questions don't steer people toward the answer you are hoping for?
    expected_concepts:
      - research goals mapped to question areas
      - open questions about past behaviour rather than hypotheticals
      - avoiding leading or loaded wording
      - warm-up, core and wrap-up structure
      - follow-up probes such as asking for the last time something happened
      - piloting the guide before the real sessions
    rubric:
      excellent: Describes a structured guide tied to goals, gives concrete examples of rewriting a leading question into a neutral one, and stresses past behaviour and piloting.
      good: Knows to use open, non-leading questions and has a basic structure, with a reasonable example.
      weak: Asks users what features they want or whether they would use something, with no awareness of bias in wording.
    followups:
      - Give me an example of a question you rewrote after a pilot session.
      - How do you handle a participant who keeps giving very short answers?
    common_errors:
      - Asking people to predict future behaviour instead of describing what they did.

  - external_key: technical.ux_designer.wrong_participants
    competency_key: ux_research
    topic: Recruiting the right participants
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Imagine you're halfway through a round of interviews and you realise most of the participants the
      recruiting agency sent don't really match the users you are designing for. What would you do?
    expected_concepts:
      - pausing to assess how far off the sample is
      - tightening the screener with behavioural criteria
      - deciding which sessions still provide usable signal
      - telling stakeholders how the findings are limited
      - adjusting the schedule rather than presenting misleading results
    rubric:
      excellent: Diagnoses why the screener failed, fixes it with behavioural questions, salvages what is usable, and is open with the team about how the gap affects the findings and timeline.
      good: Recognises the problem, fixes recruiting and reruns some sessions.
      weak: Carries on and reports the findings as if the sample were representative.
    followups:
      - What does a good screener question look like compared with a weak one?
      - How would you explain the delay to a product manager who needs answers this week?
    common_errors:
      - Blaming the agency without fixing the screener that let the wrong people through.

  - external_key: technical.ux_designer.interviews_to_findings
    competency_key: ux_research
    topic: Separating observation from interpretation in synthesis
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Think of the last round of user sessions you analysed. How did you keep what you actually observed
      separate from your own interpretation, and how did you decide which patterns were solid enough to
      present to the team?
    expected_concepts:
      - capturing observations close to the session
      - clustering or affinity mapping to find patterns
      - separating observations from interpretations
      - supporting each theme with evidence and quotes
      - turning themes into implications or design opportunities
    rubric:
      excellent: Describes a clear synthesis process that distinguishes what was seen from what it means, backs themes with evidence, and ends with prioritised implications the team can act on.
      good: Uses affinity mapping or a similar method and produces sensible themes with examples.
      weak: Lists interesting quotes or individual opinions without identifying patterns or implications.
    followups:
      - Tell me about a pattern you dropped because the evidence turned out thinner than it first looked.
      - How do you involve the product team in synthesis without slowing it down?
    common_errors:
      - Reporting the most memorable quote as if it were a pattern across participants.

  - external_key: technical.ux_designer.research_plan_contents
    competency_key: ux_research
    topic: Planning a research study
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Before you run a study, what goes into your research plan, and how do you use it to get the product
      team aligned on what you're going to learn?
    expected_concepts:
      - background and the decision the study supports
      - research questions and assumptions to test
      - method, participants and recruiting criteria
      - timeline, roles and logistics
      - how findings will be shared and used
    rubric:
      excellent: Describes a concise plan anchored on research questions and decisions, explains how they review it with stakeholders to agree scope, and mentions what is explicitly out of scope.
      good: Lists the main parts of a plan and shares it with the team before starting.
      weak: Starts sessions without a written plan or with only a list of tasks.
    followups:
      - Tell me about a time a stakeholder review of the plan changed the study.
    common_errors:
      - Writing research questions that are really interview questions, so the plan never states what the team needs to decide.

  - external_key: technical.ux_designer.say_versus_do
    competency_key: ux_research
    topic: When stated preferences and behaviour disagree
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      In interviews, many customers tell you they really want an advanced reporting feature. But usage data
      shows hardly anyone opens the reports you already have. How would you make sense of that?
    expected_concepts:
      - stated preference versus observed behaviour
      - digging into the underlying job or outcome behind the request
      - checking whether discoverability or quality explains low usage
      - looking at who uses the existing reports and how
      - designing a small test before building the feature
    rubric:
      excellent: Treats the conflict as a signal, proposes ways to find the real need behind the request, checks alternative explanations for low usage, and suggests a cheap way to test before committing.
      good: Recognises that what people say and do can differ and proposes some further investigation.
      weak: Picks one data source and ignores the other, or simply builds what was asked for.
    followups:
      - What questions would you ask the customers who requested the feature?
      - What would convince you the feature is worth building?
    common_errors:
      - Treating feature requests as requirements instead of clues to an underlying need.

  - external_key: technical.ux_designer.personas_in_use
    competency_key: ux_research
    topic: Personas and jobs to be done
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Personas often end up as posters nobody looks at. How have you created personas or jobs-to-be-done
      statements that the team actually used when making decisions?
    expected_concepts:
      - grounding them in research data rather than assumptions
      - focusing on goals, behaviours and context over demographics
      - keeping the set small and distinct
      - referencing them in critiques, prioritisation and acceptance criteria
      - revisiting them as new research comes in
    rubric:
      excellent: Explains how the artefacts were built from evidence, centred on goals and behaviours, and gives concrete examples of them shaping decisions, plus how they were kept current.
      good: Describes research-based personas or job statements and at least one way the team used them.
      weak: Describes fictional profiles with invented demographic details and no link to decisions.
    followups:
      - When would you choose job statements over personas, or the other way round?
    common_errors:
      - Filling personas with invented demographic detail that adds no design value.

  - external_key: technical.ux_designer.no_time_for_research
    competency_key: ux_research
    topic: Research under a tight deadline
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A product manager tells you there's no time for research because the feature has to ship in two
      weeks. How would you respond, and what would you actually do?
    expected_concepts:
      - identifying the riskiest assumptions
      - lightweight methods such as quick tests, existing data or support tickets
      - fitting research alongside design rather than before it
      - agreeing what to learn after launch
      - framing research as reducing delivery risk
    rubric:
      excellent: Proposes a realistic lightweight plan focused on the riskiest assumption, uses existing evidence, keeps the timeline, and sets up post-launch learning, framing it in terms the PM cares about.
      good: Suggests some quick research methods that fit the timeline.
      weak: Either insists on a full study regardless of the deadline or skips research entirely without discussion.
    followups:
      - What existing sources of user insight would you check first?
      - What would you want to measure in the first month after launch?
    common_errors:
      - Framing research as a gate that blocks delivery rather than a way to reduce risk.

  # ---------------------------------------------------------------- medium
  - external_key: technical.ux_designer.survey_design
    competency_key: ux_research
    topic: Designing a useful survey
    difficulty: medium
    kind: technical
    text: >-
      Tell me about a survey you designed. How did you decide a survey was the right tool, and what did you
      do to make sure the results would be trustworthy?
    expected_concepts:
      - surveys for measuring known topics at scale rather than discovering new ones
      - clear single-concept questions and balanced scales
      - avoiding double-barrelled and leading items
      - sampling, response bias and who is likely to respond
      - piloting and planning the analysis before sending
    rubric:
      excellent: Justifies the survey against other methods, gives concrete wording decisions, discusses sampling and non-response bias, and explains how the analysis plan shaped the questions.
      good: Designs reasonable questions and is aware of some sources of bias.
      weak: Uses a survey to ask open-ended discovery questions or reports raw percentages without considering who responded.
    followups:
      - How did you handle open-text answers at scale?
      - What would you do differently if you ran it again?
    common_errors:
      - Asking two things in one question so the answer cannot be interpreted.

  - external_key: technical.ux_designer.funnel_dropoff_investigation
    competency_key: ux_research
    topic: Combining analytics with qualitative research
    difficulty: medium
    kind: scenario
    text: >-
      Analytics shows that about forty percent of people abandon the sign-up flow on the step where they
      connect their bank account. How would you find out why, and decide what to change?
    expected_concepts:
      - segmenting the analytics by device, source and user type
      - looking at session recordings, errors and support tickets
      - qualitative sessions or intercept surveys at the drop-off point
      - forming hypotheses such as trust, effort or technical failure
      - testing changes and measuring the effect on completion
    rubric:
      excellent: Uses quantitative data to narrow down where and for whom the problem occurs, qualitative methods to explain why, forms several competing hypotheses including trust and technical failure, and plans to measure the fix.
      good: Combines analytics with some user research and proposes reasonable changes.
      weak: Jumps straight to a redesign based on a guess about the cause.
    followups:
      - What would make you suspect a technical problem rather than a design problem?
      - How would you know the change you shipped actually helped?
    common_errors:
      - Assuming the drop-off is a usability problem without ruling out errors, latency or third-party failures.

  - external_key: technical.ux_designer.contextual_inquiry
    competency_key: ux_research
    topic: Observing users in context
    difficulty: medium
    kind: technical
    text: >-
      When have you observed people doing their work in their own environment, rather than interviewing
      them in a meeting room or on a call? What did you learn that you wouldn't have learned otherwise?
    expected_concepts:
      - observing real workflows, tools and workarounds
      - the master and apprentice style of questioning
      - capturing environment, interruptions and collaboration
      - noticing gaps between described and actual process
      - turning observations into design opportunities
    rubric:
      excellent: Describes a real field study, how they observed and asked questions without disrupting work, specific surprising findings such as workarounds, and how those changed the design direction.
      good: Has done some observational research and can name useful insights it produced.
      weak: Has only done remote interviews and cannot explain the value of observing context.
    followups:
      - How did you take notes or record without getting in the way?
      - How did you share the context with teammates who weren't there?
    common_errors:
      - Turning an observation session into an interview and missing what people actually do.

  - external_key: technical.ux_designer.diary_study
    competency_key: ux_research
    topic: Studying behaviour over time
    difficulty: medium
    kind: technical
    text: >-
      Some behaviours only show up over weeks, like how people manage a budget or adopt a new tool. How would
      you design a study to understand that kind of behaviour over time?
    expected_concepts:
      - diary or longitudinal study design
      - prompts and cadence that keep participants engaged
      - mixing in-the-moment entries with follow-up interviews
      - managing drop-off and incentives
      - analysing change over time rather than single moments
    rubric:
      excellent: Designs a concrete longitudinal study with sensible prompts, cadence, engagement and drop-off handling, combines it with interviews, and explains how analysis focuses on change and triggers.
      good: Proposes a diary study with reasonable structure.
      weak: Suggests a single interview or survey that asks people to remember weeks of behaviour.
    followups:
      - How would you keep participants contributing in week three?
      - What tools would you use to collect entries?
    common_errors:
      - Asking for long daily entries, so participants drop out after the first few days.

  - external_key: technical.ux_designer.research_contradicts_exec
    competency_key: stakeholder_management
    topic: When research contradicts a senior stakeholder
    difficulty: medium
    kind: scenario
    text: >-
      A senior leader is convinced that customers churn because the product lacks a particular integration.
      Your research suggests the real problem is a confusing setup experience. How would you handle this?
    expected_concepts:
      - understanding the leader's evidence and reasoning
      - presenting findings with clear evidence such as clips and data
      - acknowledging uncertainty and what the research cannot tell
      - proposing a way to test both explanations
      - keeping the focus on the shared goal of reducing churn
    rubric:
      excellent: Seeks to understand the leader's view first, presents evidence persuasively and fairly, admits the limits of the study, and proposes a test that could settle the question.
      good: Presents the evidence clearly and tries to persuade without being dismissive.
      weak: Either drops the findings to avoid conflict or argues that the leader is simply wrong.
    followups:
      - What would you do if the leader still wants to build the integration first?
      - Which pieces of evidence tend to be most persuasive with senior people?
    common_errors:
      - Presenting the findings as a verdict on the leader rather than evidence about customers.

  - external_key: technical.ux_designer.actionable_journey_map
    competency_key: ux_research
    topic: Making journey maps actionable
    difficulty: medium
    kind: technical
    text: >-
      Walk me through a customer journey map or service blueprint you created. How did you build it, and
      how did the team use it after the workshop ended?
    expected_concepts:
      - basing stages and pain points on research evidence
      - including actions, touchpoints, needs and pain points
      - showing backstage processes and owners in a service blueprint
      - prioritising opportunities by impact and effort
      - assigning owners and following up on opportunities
    rubric:
      excellent: Explains how the map was built from evidence, what layers it showed and why, and gives concrete examples of opportunities that were owned, prioritised and delivered.
      good: Describes a well-structured map with a few outcomes.
      weak: Describes a workshop artefact built on assumptions that was not used afterwards.
    followups:
      - When would you choose a service blueprint over a journey map?
      - How did you keep the map up to date?
    common_errors:
      - Producing a map with no owners or next steps, so it becomes wall decoration.

  - external_key: technical.ux_designer.insight_repository
    competency_key: ux_research
    topic: Making research findings reusable
    difficulty: medium
    kind: technical
    text: >-
      Teams often repeat research because nobody can find what was learned last year. How have you made
      research findings easy to find and reuse across a team or company?
    expected_concepts:
      - a shared repository or library of findings
      - atomic insights tagged by product area, user type and date
      - linking insights to raw evidence
      - lightweight habits so it gets maintained
      - signalling when findings are outdated
    rubric:
      excellent: Describes a concrete system with tagging, evidence links and maintenance habits, explains how people actually discover insights in it, and addresses findings going stale.
      good: Has stored findings in a shared, searchable place with some structure.
      weak: Findings live in individual slide decks with no way to search them.
    followups:
      - How did you encourage product managers to check the repository before requesting new research?
    common_errors:
      - Building an elaborate repository that depends on one person and stops being updated.

  - external_key: technical.ux_designer.buyer_versus_user
    competency_key: ux_research
    topic: Researching B2B buyers and end users
    difficulty: medium
    kind: scenario
    text: >-
      You're designing for a B2B product where the person who buys it is an IT manager, but the people who
      use it every day are warehouse staff. How would you approach research when those two groups want
      different things?
    expected_concepts:
      - researching both groups separately
      - mapping buyer criteria such as security and cost against daily usability needs
      - access challenges such as shift work and site visits
      - showing how end-user experience affects adoption and renewals
      - finding design solutions that serve both
    rubric:
      excellent: Plans research with both groups, addresses practical access to end users, explains how to connect end-user pain to buyer outcomes like adoption and renewal, and looks for designs serving both.
      good: Recognises the two groups and plans to talk to both.
      weak: Only researches the buyer or the person who is easiest to reach.
    followups:
      - How would you get access to warehouse staff who can't leave the floor?
    common_errors:
      - Letting the buyer speak for the end users' daily experience.

  - external_key: technical.ux_designer.small_sample_challenge
    competency_key: ux_research
    topic: Defending qualitative sample sizes
    difficulty: medium
    kind: scenario
    text: >-
      An engineer pushes back on your findings and says, "You only talked to six people, that's not
      statistically significant." How would you respond?
    expected_concepts:
      - the purpose of qualitative research is understanding why, not measuring how many
      - saturation and repeated patterns across participants
      - where quantitative validation is appropriate
      - being clear about the claims the study supports
      - proposing a follow-up measure if the decision needs it
    rubric:
      excellent: Explains the difference between qualitative and quantitative claims without being defensive, shows which claims the data supports, and offers a way to quantify if the decision warrants it.
      good: Explains that small samples are suitable for finding usability issues and patterns.
      weak: Either agrees the research is worthless or overstates the findings as if they were statistically proven.
    followups:
      - What kind of finding would you not report from six sessions?
    common_errors:
      - Quoting percentages from a handful of sessions as if they described the whole user base.

  - external_key: technical.ux_designer.research_consent_data
    competency_key: ux_research
    topic: Consent and participant data
    difficulty: medium
    kind: technical
    text: >-
      How do you handle consent, recordings and personal data when you run research sessions, especially
      when you share clips with the wider company?
    expected_concepts:
      - informed consent explaining purpose, recording and use
      - the right to stop or withdraw
      - storing recordings securely with limited access
      - redacting personal or sensitive information in shared material
      - retention periods and deleting data when no longer needed
    rubric:
      excellent: Describes a consistent consent process, secure storage, redaction before sharing, retention rules and respect for withdrawal, with a concrete example of applying them.
      good: Gets consent and stores recordings carefully.
      weak: Treats recordings like ordinary files and shares them freely.
    followups:
      - What would you do if a participant revealed sensitive customer data on screen?
    common_errors:
      - Sharing unedited recordings in public channels where participants' details are visible.

  - external_key: technical.ux_designer.concept_testing
    competency_key: ux_research
    topic: Testing early concepts
    difficulty: medium
    kind: technical
    text: >-
      When you test an early concept, people often just say "yes, I'd use that." How do you test early
      ideas in a way that tells you whether they really solve a problem?
    expected_concepts:
      - grounding sessions in participants' real current behaviour
      - showing several concepts rather than one
      - asking people to use the concept on their own scenario
      - looking for trade-offs and what they would give up
      - behavioural signals such as sign-ups or fake-door tests
    rubric:
      excellent: Explains why direct desirability questions mislead, describes techniques like comparing multiple concepts, using real scenarios and behavioural signals, and gives an example.
      good: Knows to avoid asking whether people like an idea and suggests some better approaches.
      weak: Shows a single polished concept and asks participants whether they would use it.
    followups:
      - When is a fake-door test appropriate and when is it not?
    common_errors:
      - Treating politeness from participants as validation.

  # ------------------------------------------------------------------ hard
  - external_key: technical.ux_designer.mixed_methods_programme
    competency_key: ux_research
    topic: Planning a mixed-methods research programme
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your company wants to move into small business accounting, a market it knows little about. You have
      one quarter and a small budget. How would you plan the research programme?
    expected_concepts:
      - starting from the key strategic decisions and unknowns
      - desk research and existing data first
      - generative interviews or field visits with target businesses
      - a survey or market data to size segments and validate patterns
      - sequencing so each phase informs the next
      - regular readouts to leadership
    rubric:
      excellent: Builds a sequenced plan tied to strategic questions, combines generative and quantitative methods sensibly, uses the budget realistically, and describes how and when findings reach leadership.
      good: Proposes several suitable methods in a reasonable order.
      weak: Proposes a single method or a list of activities with no link to decisions.
    followups:
      - How would you decide which segment to focus on first?
      - What would you cut if the budget halved?
    common_errors:
      - Starting with a large survey before knowing which questions matter to the target businesses.

  - external_key: technical.ux_designer.research_influence_roadmap
    competency_key: product_sense
    topic: Getting research into the roadmap
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You've done solid research for six months, but the roadmap keeps being set by sales requests and
      leadership opinions. How would you change that so research actually shapes what gets built?
    expected_concepts:
      - involving stakeholders in research so findings are shared
      - framing findings in business terms such as revenue, retention and cost
      - timing research to planning cycles
      - creating opportunity backlogs alongside the roadmap
      - showing results from past research-led decisions
    rubric:
      excellent: Diagnoses why research is being ignored, proposes concrete changes in timing, framing and stakeholder involvement, and gives examples of building credibility with measurable wins.
      good: Suggests making research more visible and connected to business goals.
      weak: Blames stakeholders or proposes producing more reports.
    followups:
      - Which stakeholder would you try to win over first, and why?
    common_errors:
      - Delivering findings after planning decisions are already made.

  - external_key: technical.ux_designer.conflicting_segments
    competency_key: product_sense
    topic: Designing for conflicting user needs
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Research shows that power users of your project management tool want dense, configurable screens, while
      new users get lost and churn in the first week. How would you approach the design?
    expected_concepts:
      - sizing each segment and its business value
      - progressive disclosure and sensible defaults
      - onboarding paths that adapt to experience
      - avoiding separate products or modes unless justified
      - measuring outcomes for both groups
    rubric:
      excellent: Uses data to understand both segments, proposes patterns such as progressive disclosure and adaptive onboarding with clear trade-offs, and plans metrics that protect both groups.
      good: Suggests a reasonable compromise such as simplified defaults with advanced options.
      weak: Designs for one group only or adds a toggle without considering the trade-offs.
    followups:
      - How would you avoid making things worse for power users during the change?
    common_errors:
      - Averaging the two groups' needs into a design that serves neither well.

  - external_key: technical.ux_designer.research_impact_measurement
    competency_key: ux_research
    topic: Showing the impact of research
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you show the value of research work to leadership? Give me an example where you could connect
      a research finding to a measurable outcome.
    expected_concepts:
      - tracking decisions influenced by research
      - linking changes to product metrics like conversion, retention or support volume
      - avoided cost from not building the wrong thing
      - baselines before the change
      - being careful about attribution
    rubric:
      excellent: Gives a specific example tracing a finding to a decision and a measured outcome, explains how attribution was handled, and describes a broader way of tracking research impact.
      good: Gives an example where research led to a change that improved a metric.
      weak: Measures research by number of studies run or cannot point to any outcome.
    followups:
      - How do you account for research that stopped a project?
    common_errors:
      - Claiming full credit for a metric change that had several causes.

  - external_key: technical.ux_designer.hard_to_reach_users
    competency_key: ux_research
    topic: Researching hard-to-reach users
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're designing software for field engineers who maintain wind turbines. They work long shifts in
      remote places with poor connectivity and little time to talk. How would you learn what they need?
    expected_concepts:
      - working through supervisors or customer contacts for access
      - short, flexible or asynchronous methods
      - site visits or ride-alongs where feasible
      - using proxies such as support logs and trainers carefully
      - testing prototypes in realistic conditions such as gloves, glare and offline use
    rubric:
      excellent: Plans realistic access and methods for the constraints, accounts for environmental conditions in testing, uses proxies with care, and respects participants' time.
      good: Proposes some practical ways to reach and research the users.
      weak: Proposes standard lab sessions or relies only on managers' opinions.
    followups:
      - What could go wrong if you relied only on the customer's managers for insight?
    common_errors:
      - Testing only in an office setting that hides the real working conditions.

  - external_key: technical.ux_designer.team_synthesis_bias
    competency_key: ux_research
    topic: Running collaborative synthesis without bias
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You want product managers and engineers to join research synthesis, but some of them come in with
      strong opinions about the answer. How do you run synthesis so it is collaborative but still rigorous?
    expected_concepts:
      - stating hypotheses up front so they can be checked
      - starting from raw observations rather than conclusions
      - requiring evidence for each theme
      - actively looking for disconfirming evidence
      - the researcher owning final quality of the findings
    rubric:
      excellent: Describes a facilitation approach that brings in different views while guarding against confirmation bias, such as explicit hypotheses, evidence rules and searching for counterexamples, with a real example.
      good: Involves the team and uses evidence to check themes.
      weak: Either excludes stakeholders entirely or lets the loudest opinion decide the themes.
    followups:
      - What do you do when a stakeholder insists on a theme with thin evidence?
    common_errors:
      - Starting synthesis by asking the group what the main themes are before reviewing the evidence.
