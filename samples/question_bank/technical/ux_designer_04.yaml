# Curated questions: UX / UI designer (part 4 of 4).
# Design systems (components, tokens, contribution, versioning, theming, adoption) and working with
# engineers and product managers: handoff, design QA, scope, metrics, critique and stakeholder feedback.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [ux_designer]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.ux_designer.new_component_or_reuse
    competency_key: ux_design
    topic: Reusing versus creating components
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When the existing design system doesn't quite fit what you need for a feature, how do you decide
      whether to adapt an existing component, propose a new one or design a one-off?
    expected_concepts:
      - checking whether the need is really different or just unfamiliar
      - how often the pattern is likely to be reused
      - talking to the design system owners early
      - cost of one-offs for consistency and maintenance
      - documenting the decision
    rubric:
      excellent: Gives a clear decision process weighing reuse, real user need and maintenance cost, involves system owners, and illustrates it with a real example.
      good: Prefers existing components and has a sensible reason for exceptions.
      weak: Creates new components whenever the existing ones feel limiting, or forces a poor fit without question.
    followups:
      - Tell me about a one-off you designed that later became a system component.
    common_errors:
      - Creating a near-copy of an existing component with small visual differences.

  - external_key: technical.ux_designer.design_tokens_usage
    competency_key: ux_design
    topic: Working with design tokens
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How have you used design tokens for things like colour, spacing and typography, and what difference
      did they make to the way design and engineering worked together?
    expected_concepts:
      - named values shared between design tools and code
      - semantic tokens such as text-primary rather than raw colours
      - enabling themes such as dark mode
      - reducing hard-coded values and drift
      - naming conventions agreed with engineering
    rubric:
      excellent: Explains raw versus semantic tokens with real examples, shows how tokens enabled theming or consistency, and describes agreeing names and syncing with engineering.
      good: Has used tokens and understands why they help consistency.
      weak: Describes tokens as just a colour palette in the design file.
    followups:
      - How did you name tokens so both designers and developers understood them?
    common_errors:
      - Naming tokens after their value, such as blue-500, where the meaning should be.

  - external_key: technical.ux_designer.engineering_handoff
    competency_key: collaboration
    topic: Handing designs over to engineering
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Walk me through how you hand a design over to engineers. What do you provide, and how do you stay
      involved after the handoff?
    expected_concepts:
      - involving engineers before the final handoff
      - specs covering states, edge cases and responsive behaviour
      - linking to design system components and tokens
      - a walkthrough session and a channel for questions
      - reviewing the build before release
    rubric:
      excellent: Treats handoff as an ongoing collaboration, provides complete specs including states and edge cases, walks engineers through the work, and reviews the build.
      good: Provides clear specs and is available for questions.
      weak: Shares a design file link and moves on to the next project.
    followups:
      - What questions from engineers do you get most often, and how have you reduced them?
    common_errors:
      - Handing over only the ideal screens and leaving edge cases for engineers to invent.

  - external_key: technical.ux_designer.engineer_feasibility_pushback
    competency_key: collaboration
    topic: Responding to feasibility pushback
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An engineer tells you the interaction you designed would take three weeks to build and suggests a much
      simpler version. How would you work through that with them?
    expected_concepts:
      - understanding what makes it expensive
      - clarifying which part of the design delivers the user value
      - exploring alternatives together
      - deciding with the product manager based on value and cost
      - phasing the richer version if it is worth it
    rubric:
      excellent: Gets curious about the cost, separates the essential user value from the details, works out alternatives with the engineer, and involves the PM in the trade-off.
      good: Is open to simplifying while protecting the core experience.
      weak: Either insists on the original design or accepts any simplification without considering users.
    followups:
      - Tell me about a time an engineer's suggestion made the design better.
    common_errors:
      - Treating the engineer's estimate as a negotiating position instead of information.

  - external_key: technical.ux_designer.solution_request_reframe
    competency_key: product_sense
    topic: Reframing solution requests into problems
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A product manager comes to you and says, "We need an export to Excel button on this page by next
      sprint." How would you respond?
    expected_concepts:
      - asking what users are trying to do with the export
      - understanding who asked and how often
      - checking whether a better in-product solution exists
      - delivering something quickly if the need is real and urgent
      - not blocking simple requests unnecessarily
    rubric:
      excellent: Explores the underlying need with good questions while respecting the timeline, and proposes how to deliver value quickly without missing a better solution.
      good: Asks about the problem behind the request before designing.
      weak: Designs the button with no questions, or refuses to work on it until full research is done.
    followups:
      - What would you do if the answer is simply that a big customer asked for it?
    common_errors:
      - Turning every small request into a lengthy discovery exercise.

  - external_key: technical.ux_designer.running_design_critique
    competency_key: communication
    topic: Giving and running design critique
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you give feedback on another designer's work in a critique so it's useful rather than just
      personal taste? Give me an example of feedback you gave recently.
    expected_concepts:
      - understanding the goals and constraints first
      - tying feedback to user goals and principles
      - being specific about what works and what doesn't
      - asking questions rather than prescribing solutions
      - separating blocking issues from suggestions
    rubric:
      excellent: Describes a structured critique approach rooted in goals and evidence, gives a concrete example of specific actionable feedback, and distinguishes severity of points.
      good: Gives specific, goal-related feedback with an example.
      weak: Gives opinions such as "I don't like the colour" without reasons.
    followups:
      - How do you take feedback on your own work that you disagree with?
    common_errors:
      - Redesigning the other person's work in the meeting instead of helping them improve it.

  - external_key: technical.ux_designer.design_qa_mismatch
    competency_key: collaboration
    topic: Design QA before release
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Two days before release you review the build and find spacing is off, a few states are missing and an
      error message is different from the design. What do you do?
    expected_concepts:
      - sorting issues by impact on users
      - distinguishing must-fix issues from polish
      - logging issues clearly with screenshots and expected behaviour
      - agreeing with engineering and product what to fix now and later
      - improving the process so issues are caught earlier
    rubric:
      excellent: Triages issues by user impact, communicates them clearly, agrees a realistic plan with the team, and changes the process to catch issues earlier next time.
      good: Prioritises the issues and works with engineers to fix the important ones.
      weak: Demands every pixel be fixed before launch or ignores the issues.
    followups:
      - How would you catch these earlier in the next project?
    common_errors:
      - Raising issues in a long unprioritised list that engineers can't act on.

  # ---------------------------------------------------------------- medium
  - external_key: technical.ux_designer.system_contribution_model
    competency_key: ux_design
    topic: Design system contribution model
    difficulty: medium
    kind: technical
    text: >-
      How should product designers contribute new patterns back into a design system? Describe a
      contribution process you've used or would set up.
    expected_concepts:
      - proposals that show the need across teams
      - review criteria covering accessibility, consistency and reuse
      - pairing with the system team on design and code
      - documentation and examples before release
      - a path for experimental or team-specific patterns
    rubric:
      excellent: Describes a clear, lightweight process with review criteria, joint design and code work, documentation, and a way to handle experiments, with an example.
      good: Has a sensible proposal and review process.
      weak: Either has no process or relies on a single gatekeeper approving everything.
    followups:
      - How do you stop the contribution process from becoming a bottleneck?
    common_errors:
      - Accepting contributions into the design library without matching coded components.

  - external_key: technical.ux_designer.detached_components
    competency_key: ux_design
    topic: Teams working around the design system
    difficulty: medium
    kind: scenario
    text: >-
      You notice that many designers are detaching design system components and modifying them, so the
      product is drifting into inconsistency. How would you deal with it?
    expected_concepts:
      - finding out why components are being detached
      - identifying missing variants or flexibility
      - improving components or documentation in response
      - making the right path easier rather than policing
      - tracking detach rates over time
    rubric:
      excellent: Treats detaching as feedback on the system, investigates the reasons, improves components and guidance, and tracks improvement with data.
      good: Talks to designers and fixes some common gaps.
      weak: Responds only with rules against detaching.
    followups:
      - What would you do about a team that needs something truly unique?
    common_errors:
      - Blaming designers for inconsistency without looking at gaps in the system.

  - external_key: technical.ux_designer.component_variants_with_code
    competency_key: ux_design
    topic: Aligning component variants with code
    difficulty: medium
    kind: technical
    text: >-
      When you design a component like a button or an input, how do you define its variants, sizes and
      states so they line up with how engineers build it?
    expected_concepts:
      - agreeing variant names and properties with engineering
      - covering all states such as hover, focus, disabled, loading and error
      - limiting variants to what is really needed
      - documenting usage guidance and do's and don'ts
      - keeping the design library and code in sync
    rubric:
      excellent: Shows how variants and properties map to the coded component, covers the full state set, constrains combinations deliberately, and keeps library and code aligned.
      good: Designs complete states and agrees names with engineering.
      weak: Designs visual variations without considering how they would be implemented.
    followups:
      - Which combinations of variants did you deliberately not allow, and why?
    common_errors:
      - Creating a variant for every request until the component becomes hard to use.

  - external_key: technical.ux_designer.design_in_agile_sprints
    competency_key: collaboration
    topic: Fitting design into agile delivery
    difficulty: medium
    kind: technical
    text: >-
      How do you fit design work into a team that ships in two-week sprints, so engineers aren't waiting for
      designs but you still have time to explore and test?
    expected_concepts:
      - working one or two sprints ahead on discovery
      - dual-track discovery and delivery
      - breaking designs into shippable slices
      - staying involved during the delivery sprint
      - aligning with the product backlog and planning
    rubric:
      excellent: Describes a practical rhythm that balances exploration and delivery, slices work sensibly, stays engaged during build, and gives an example of what worked or failed.
      good: Works a sprint or so ahead and collaborates during delivery.
      weak: Either designs everything upfront in a big phase or designs only within the same sprint as development.
    followups:
      - What happens when discovery reveals the planned work shouldn't be built?
    common_errors:
      - Being so far ahead that designs are stale by the time engineers start.

  - external_key: technical.ux_designer.scope_cut_under_deadline
    competency_key: product_sense
    topic: Cutting scope while protecting the experience
    difficulty: medium
    kind: scenario
    text: >-
      Midway through a project the team learns it has half the time it planned. The PM asks you what can be
      cut from the design. How would you decide?
    expected_concepts:
      - identifying the core user problem and must-have flow
      - cutting breadth rather than quality of the core path
      - keeping essentials like error handling and accessibility
      - planning a follow-up release for deferred items
      - making trade-offs visible to stakeholders
    rubric:
      excellent: Prioritises by user value and risk, keeps the core path complete and robust, protects essentials, and makes deferred work and its risks explicit.
      good: Proposes reasonable cuts while keeping the main flow intact.
      weak: Cuts quality across the board or refuses to cut anything.
    followups:
      - Which items do you never cut, even under deadline pressure?
    common_errors:
      - Cutting error states and edge cases first because they are less visible.

  - external_key: technical.ux_designer.feature_success_metrics
    competency_key: product_sense
    topic: Defining success for a design change
    difficulty: medium
    kind: technical
    text: >-
      Before you start designing a feature, how do you work with the product manager to define what success
      looks like? Tell me about the metrics you agreed on for a recent feature.
    expected_concepts:
      - linking the feature to a user and business outcome
      - a primary metric and guardrail metrics
      - baselines and realistic targets
      - qualitative signals alongside numbers
      - making sure the metrics can actually be measured
    rubric:
      excellent: Describes a concrete feature with a primary metric, guardrails, baselines and qualitative signals, agreed with the PM before design, and what happened after launch.
      good: Agreed sensible metrics with the PM for a real feature.
      weak: Leaves success measurement to the PM or uses output metrics like number of screens shipped.
    followups:
      - What guardrail metric did you choose, and why?
    common_errors:
      - Choosing a metric that the feature can't plausibly move in a measurable timeframe.

  - external_key: technical.ux_designer.conflicting_stakeholder_feedback
    competency_key: stakeholder_management
    topic: Handling conflicting stakeholder feedback
    difficulty: medium
    kind: scenario
    text: >-
      In a design review, legal wants more disclosure text, marketing wants a cleaner page, and sales wants a
      comparison table added. How would you move forward?
    expected_concepts:
      - understanding the goal behind each piece of feedback
      - going back to the agreed user and business goals
      - finding design options that satisfy the real constraints
      - using evidence or testing to settle disagreements
      - clarifying who makes the final decision
    rubric:
      excellent: Uncovers the underlying concerns, separates hard constraints such as legal requirements from preferences, finds options that address them, uses evidence, and is clear about decision ownership.
      good: Listens to all parties and works toward a balanced design.
      weak: Tries to include every request or simply follows the most senior voice.
    followups:
      - How would you handle a stakeholder who comes back after the decision was made?
    common_errors:
      - Treating every comment as a requirement instead of asking what problem it solves.

  - external_key: technical.ux_designer.design_debt_prioritisation
    competency_key: product_sense
    topic: Making the case for fixing design debt
    difficulty: medium
    kind: scenario
    text: >-
      The product has accumulated years of inconsistent patterns, with five different date pickers and three
      styles of modal. How would you get time on the roadmap to fix it?
    expected_concepts:
      - auditing and documenting the inconsistencies
      - linking debt to user problems, support cost or development speed
      - fixing debt alongside planned feature work
      - prioritising by traffic and impact
      - showing results to earn further investment
    rubric:
      excellent: Builds an evidence-based case in business terms, proposes a practical plan that piggybacks on feature work, prioritises by impact, and measures results.
      good: Audits the problems and proposes a phased cleanup.
      weak: Argues for a full redesign based on aesthetics.
    followups:
      - Which numbers would be most convincing to an engineering manager?
    common_errors:
      - Asking for a dedicated quarter of cleanup with no link to user or business impact.

  - external_key: technical.ux_designer.early_engineering_involvement
    competency_key: collaboration
    topic: Involving engineers early in design
    difficulty: medium
    kind: technical
    text: >-
      At what point do you bring engineers into the design process, and what do you get from them at each
      stage? Give me an example where that changed the outcome.
    expected_concepts:
      - involving engineers during problem framing and exploration
      - learning technical constraints and opportunities early
      - joint sketching or review sessions
      - shared understanding that reduces rework
      - respecting engineers' time with focused sessions
    rubric:
      excellent: Describes deliberate involvement at several stages, explains what each stage gained, and gives an example where early input changed the design for the better.
      good: Involves engineers before handoff and values their input.
      weak: Shares designs with engineers only once they are finished.
    followups:
      - How do you keep engineers engaged without pulling them into every meeting?
    common_errors:
      - Inviting engineers only to approve a finished design.

  - external_key: technical.ux_designer.executive_design_presentation
    competency_key: communication
    topic: Presenting design direction to executives
    difficulty: medium
    kind: scenario
    text: >-
      You have fifteen minutes with the leadership team to get approval for a new design direction for the
      product's main dashboard. How would you prepare and structure that presentation?
    expected_concepts:
      - starting with the problem and business impact
      - showing evidence from research and data
      - a clear recommendation with alternatives considered
      - focusing on key screens or a short prototype rather than every detail
      - stating the decision or support needed
    rubric:
      excellent: Structures a short narrative from problem to evidence to recommendation and ask, tailors it to leadership priorities, anticipates objections, and keeps detail in reserve.
      good: Presents a clear recommendation with supporting evidence.
      weak: Walks through every screen without stating the problem or what decision is needed.
    followups:
      - How would you prepare for the toughest question you expect?
    common_errors:
      - Spending the time on visual details while leaders want to understand impact and risk.

  - external_key: technical.ux_designer.responsive_behaviour_specs
    competency_key: ux_design
    topic: Specifying responsive behaviour
    difficulty: medium
    kind: technical
    text: >-
      How do you communicate how a layout should behave across screen sizes, not just at the two or three
      widths you happened to draw?
    expected_concepts:
      - layout grids and breakpoints agreed with engineering
      - describing behaviour rules such as wrapping, stacking and truncation
      - content priority as space shrinks
      - testing with real content at in-between widths
      - reviewing in the browser rather than only in static mock-ups
    rubric:
      excellent: Describes rules-based specs for resizing behaviour, content priority and truncation, and how they validate in-between widths in real builds.
      good: Provides designs at key breakpoints with some notes about behaviour.
      weak: Provides fixed mock-ups only and leaves behaviour between them to developers.
    followups:
      - How do you decide what gets truncated versus wrapped?
    common_errors:
      - Designing only at exact device widths that rarely match real browser windows.

  # ------------------------------------------------------------------ hard
  - external_key: technical.ux_designer.design_system_rollout
    competency_key: ux_design
    topic: Rolling out a design system across teams
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your company has ten product teams, each with its own UI built over the years. You're asked to lead the
      rollout of a new design system. How would you plan it?
    expected_concepts:
      - auditing existing patterns and choosing high-value components first
      - partnering with one or two pilot teams
      - pairing design components with coded components
      - adoption support such as documentation, office hours and migration guides
      - measuring adoption and its effect on speed and consistency
    rubric:
      excellent: Plans a phased rollout grounded in an audit, starts with pilots, delivers design and code together, supports adoption actively, and measures outcomes rather than component counts.
      good: Proposes a sensible phased rollout with team involvement.
      weak: Designs a complete library in isolation and expects teams to adopt it.
    followups:
      - How would you handle a team that refuses to migrate?
      - Which components would you build first, and why?
    common_errors:
      - Building a large component library before any team has committed to using it.

  - external_key: technical.ux_designer.system_breaking_changes
    competency_key: ux_design
    topic: Versioning and deprecation in a design system
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You need to make a breaking change to a widely used design system component, such as replacing the old
      modal with a new pattern. How would you manage that change across design files and code?
    expected_concepts:
      - versioning and clear release notes
      - deprecation periods and warnings
      - migration guides and tooling such as codemods
      - finding where the component is used
      - coordinating timelines with product teams
    rubric:
      excellent: Plans versioning, deprecation, migration support and usage tracking across design and code, and coordinates timelines with consuming teams.
      good: Communicates the change and gives teams a migration path.
      weak: Updates the component in place and lets teams discover the change.
    followups:
      - How would you know when it's safe to remove the old version?
    common_errors:
      - Changing the design library without a matching code release, so designs and product diverge.

  - external_key: technical.ux_designer.multi_brand_theming
    competency_key: ux_design
    topic: Supporting multiple brands in one system
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your company sells the same product under three brands, plus a white-label version for partners. How
      would you structure the design system so it supports all of them without becoming four systems?
    expected_concepts:
      - layered tokens with brand-level overrides
      - shared component behaviour with themeable styling
      - limits on what brands can customise
      - accessibility checks for every theme
      - testing and previewing all themes in design and code
    rubric:
      excellent: Proposes a layered token architecture, defines what is shared versus themeable, sets customisation boundaries, and ensures every theme meets accessibility requirements.
      good: Uses tokens and themes to share components across brands.
      weak: Maintains separate libraries per brand.
    followups:
      - What would you not allow a partner to change, and why?
    common_errors:
      - Letting partners pick any colours, producing themes that fail contrast.

  - external_key: technical.ux_designer.vision_and_increments
    competency_key: product_sense
    topic: Balancing a long-term vision with incremental delivery
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Leadership asks you for a bold three-year vision for the product experience, but teams ship small
      changes every two weeks. How would you create a vision that actually guides those incremental
      decisions?
    expected_concepts:
      - grounding the vision in research and strategy
      - expressing it through principles and key scenarios as well as visuals
      - breaking it into milestones teams can deliver
      - using it to guide prioritisation and reviews
      - revisiting it as the team learns
    rubric:
      excellent: Creates a vision grounded in evidence, translates it into principles and deliverable milestones, embeds it in planning and reviews, and plans to update it.
      good: Produces a vision and connects it to the roadmap.
      weak: Produces polished concept screens with no plan for how teams use them.
    followups:
      - How would you tell whether teams are actually moving toward the vision?
    common_errors:
      - Treating the vision as a fixed specification instead of a direction.

  - external_key: technical.ux_designer.design_system_value
    competency_key: ux_design
    topic: Measuring the value of a design system
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      A finance leader asks why the company should keep funding a design system team. How would you measure
      and explain the value the system delivers?
    expected_concepts:
      - adoption and coverage across products
      - delivery speed and reduced duplicate work
      - consistency and accessibility quality improvements
      - fewer UI defects and less maintenance
      - satisfaction of designers and engineers using it
    rubric:
      excellent: Proposes a balanced set of measurable outcomes with baselines, translates them into business terms such as time and cost, and is careful about attribution.
      good: Names several relevant measures such as adoption and speed.
      weak: Points to the number of components or the library's appearance.
    followups:
      - How would you gather data on delivery speed without slowing teams down?
    common_errors:
      - Reporting the number of components built as if it were impact.

  - external_key: technical.ux_designer.launch_with_known_issues
    competency_key: stakeholder_management
    topic: Deciding whether to launch with known usability issues
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The day before a big launch, final testing shows that about a third of participants fail a key step
      in the new flow. Product wants to launch anyway because of a marketing commitment. What would you do?
    expected_concepts:
      - clearly quantifying the risk and its likely impact
      - proposing quick mitigations such as copy fixes or guidance
      - options such as a staged rollout or feature flag
      - monitoring and a plan to fix fast after launch
      - escalating appropriately and accepting the final decision owner
    rubric:
      excellent: Presents the risk with evidence, proposes concrete mitigations and rollout options, plans monitoring and rapid fixes, and handles the decision process maturely.
      good: Raises the issue clearly and proposes some mitigations.
      weak: Stays quiet to avoid conflict or insists on blocking the launch without alternatives.
    followups:
      - Which signals after launch would make you push for a rollback?
    common_errors:
      - Framing it as a choice between launching broken and delaying, missing middle options.

  - external_key: technical.ux_designer.design_code_source_of_truth
    competency_key: collaboration
    topic: Keeping the design library and code in sync
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The design library and the coded component library have drifted apart. Designers keep designing things
      that don't exist in code and engineers keep building things that aren't in the design files. How would
      you fix this?
    expected_concepts:
      - auditing the gaps between the two libraries
      - agreeing which side is the source of truth for what
      - shared naming, tokens and release process
      - joint ownership between design and engineering
      - tooling such as token pipelines or documentation with live code
    rubric:
      excellent: Diagnoses why the drift happened, establishes ownership and a shared process, uses tooling where it helps, and plans a realistic path to close the existing gaps.
      good: Proposes an audit and a regular sync between design and engineering.
      weak: Proposes a one-time cleanup without changing how the libraries are maintained.
    followups:
      - Who should approve a change to a shared component?
    common_errors:
      - Fixing the current gaps without changing the process that created them.
