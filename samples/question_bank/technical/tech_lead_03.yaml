# Tech lead, part 3: technical debt management and cross-team technical alignment.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [tech_lead]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.tech_lead.debt_versus_preference
    competency_key: code_quality
    topic: Telling real debt from preference
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you tell the difference between technical debt that's worth tracking and code that simply isn't how
      you would have written it?
    expected_concepts:
      - debt has an ongoing cost such as slower changes, defects or incidents
      - code that is rarely touched may not be worth fixing
      - evidence from churn, bug reports or onboarding friction
      - distinguishing deliberate shortcuts from accidental complexity
    rubric:
      excellent: Defines debt by its measurable cost to the team, ignores ugly but stable code, and gives examples of both kinds from their own codebase.
      good: Connects debt to impact on delivery or quality.
      weak: Treats every piece of code they dislike as debt that must be fixed.
    followups:
      - Give me an example of messy code you deliberately left alone.
    common_errors:
      - Prioritising cleanup of code nobody changes over code the team edits every week.

  - external_key: technical.tech_lead.tracking_debt
    competency_key: code_quality
    topic: Keeping track of technical debt
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How does your team keep track of technical debt so it doesn't just live in people's heads or in scattered
      code comments?
    expected_concepts:
      - a visible backlog or register with an owner
      - describing impact and rough cost to fix for each item
      - linking items to the code and to incidents or slowdowns they caused
      - regular review and pruning of the list
      - pulling items into planning alongside feature work
    rubric:
      excellent: Describes a lightweight, maintained register with impact and cost for each item, regular review, and a clear route from the list into planned work, with an example of an item that got fixed this way.
      good: Tracks debt in a shared backlog with enough detail to prioritise.
      weak: Relies on TODO comments or memory, or keeps a list nobody reviews.
    followups:
      - How do you stop the debt list from growing into hundreds of stale items?
    common_errors:
      - Logging debt without any statement of its impact, so it can never be prioritised.

  - external_key: technical.tech_lead.cleanup_during_feature_work
    competency_key: code_quality
    topic: Small improvements during feature work
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When your team is building a feature and runs into messy code along the way, how do you handle small
      improvements without bloating the change or the schedule?
    expected_concepts:
      - improving code that the feature touches anyway
      - preparatory refactors in a separate commit or pull request
      - time-boxing opportunistic cleanup
      - logging larger issues rather than fixing them on the spot
    rubric:
      excellent: Encourages focused cleanup in code being changed, keeps refactors separate from behaviour changes, time-boxes it, and records bigger problems for planned work, with an example.
      good: Allows small improvements in touched code and keeps them separate.
      weak: Either forbids any cleanup or lets features turn into broad rewrites.
    followups:
      - How would you review a feature pull request that also renames half the module?
    common_errors:
      - Mixing refactoring with behaviour changes so reviewers cannot see what actually changed.

  - external_key: technical.tech_lead.keeping_dependencies_current
    competency_key: ownership
    topic: Keeping dependencies up to date
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you keep third-party dependencies and framework versions reasonably current on your team, and what
      have you seen happen when a team falls far behind?
    expected_concepts:
      - automated update tools that open pull requests
      - good test coverage to make upgrades safe
      - small regular upgrades rather than large jumps
      - tracking end-of-life dates for runtimes and frameworks
      - security advisories as a trigger
    rubric:
      excellent: Describes a routine of small automated upgrades backed by tests, watches end-of-life dates, prioritises security fixes, and gives a concrete example of the cost of falling behind.
      good: Has a regular upgrade practice and some tooling.
      weak: Upgrades only when something breaks or a security issue forces it.
    followups:
      - How would you handle a major framework upgrade that needs code changes in many places?
    common_errors:
      - Merging automated upgrade pull requests without tests that would catch breakage.

  - external_key: technical.tech_lead.estimate_inflated_by_debt
    competency_key: stakeholder_management
    topic: Explaining debt through an estimate
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your team estimates a feature at three times what the product manager expected, mostly because of the state
      of the code in that area. How would you explain that and what options would you offer?
    expected_concepts:
      - explaining concretely what in the code makes the change expensive
      - separating the feature cost from the cleanup cost
      - options such as a smaller version, a workaround or fixing the area first
      - showing how fixing the area would speed up future work there
      - letting the PM make an informed trade-off
    rubric:
      excellent: Explains the cost in terms the PM understands, breaks the estimate into feature and debt components, offers realistic options with their trade-offs, and connects cleanup to future roadmap items.
      good: Explains the reason and offers at least one alternative.
      weak: Presents the number without explanation or quietly cuts corners to hit the expected estimate.
    followups:
      - What if the PM picks the quick workaround that adds even more debt?
    common_errors:
      - Blaming past engineers instead of explaining the practical constraint.

  - external_key: technical.tech_lead.consistent_conventions_across_teams
    competency_key: collaboration
    topic: Which conventions to share across teams
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When several teams work on one product, which technical conventions do you think should be consistent
      across all of them, and which should each team be free to choose?
    expected_concepts:
      - shared needs such as logging format, tracing, error formats and API style
      - authentication and security practices
      - team choice for internal structure and tooling that does not leak out
      - deciding based on whether inconsistency costs other teams
      - documenting shared conventions in one place
    rubric:
      excellent: Uses a clear principle, standardising what crosses team boundaries or affects operations, and leaving internal choices to teams, with concrete examples of each.
      good: Names sensible shared conventions and allows some team freedom.
      weak: Wants everything standardised or nothing at all.
    followups:
      - How would you get teams to adopt a shared logging format they didn't choose?
    common_errors:
      - Standardising internal implementation details that never affect other teams.

  - external_key: technical.tech_lead.upstream_breaking_change
    competency_key: collaboration
    topic: An upstream team breaks your service
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Another team changes their API without notice and your service starts failing in production. How would you
      handle the immediate problem, and what would you do afterwards to stop it happening again?
    expected_concepts:
      - restoring service first, through rollback or a workaround
      - contacting the other team directly and factually
      - a joint review focused on the process gap
      - versioning or compatibility agreements
      - contract tests or consumer-driven tests
    rubric:
      excellent: Restores service quickly, works with the other team without blame, and puts in place durable fixes such as compatibility rules, contract tests and change notification.
      good: Fixes the immediate problem and agrees better communication.
      weak: Escalates angrily or patches around it silently with no follow-up.
    followups:
      - How would you make the agreement stick when the other team is busy?
    common_errors:
      - Fixing only their side of the integration and leaving the process gap in place.

  # ---------------------------------------------------------------- medium
  - external_key: technical.tech_lead.quantifying_debt_impact
    competency_key: stakeholder_management
    topic: Building the case for paying down debt
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you want a specific piece of technical debt prioritised, what evidence do you gather to show its
      impact, and how do you present it to people who decide the roadmap?
    expected_concepts:
      - time lost per change in the affected area
      - incidents, defects or support load linked to it
      - risk exposure such as unsupported versions or security issues
      - the roadmap items it slows down
      - expected payoff and cost of the fix
    rubric:
      excellent: Gathers concrete data on time lost, incidents and risk, ties it to roadmap goals, presents a sized fix with an expected return, and gives a real example where this changed priorities.
      good: Brings some data and connects debt to business impact.
      weak: Argues from engineering preference with no evidence.
    followups:
      - What do you do when the data you need isn't being collected?
    common_errors:
      - Presenting the cost of fixing the debt without the cost of leaving it.

  - external_key: technical.tech_lead.incremental_legacy_replacement
    competency_key: system_design
    topic: Replacing a legacy module incrementally
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Walk me through how you would replace a tangled legacy module piece by piece while other engineers keep
      shipping features that depend on it.
    expected_concepts:
      - characterisation tests to pin down current behaviour
      - introducing a seam or interface in front of the module
      - routing callers to the new implementation gradually
      - running old and new in parallel or comparing outputs
      - removing the old code once traffic has moved
    rubric:
      excellent: Describes a concrete strangler or branch-by-abstraction plan with characterisation tests, gradual routing, comparison of results and a clear removal step, and explains how feature work continues safely.
      good: Proposes an incremental approach with tests and a sensible order.
      weak: Proposes freezing features for a rewrite, or has no way to check behaviour is preserved.
    followups:
      - How would you handle new features that need to change both the old and new code?
    common_errors:
      - Never removing the old path, leaving two implementations to maintain.

  - external_key: technical.tech_lead.deprecating_internal_api
    competency_key: stakeholder_management
    topic: Deprecating an internal API
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team owns an internal API that a dozen other teams call, and you need to retire it in favour of a new
      one. How would you plan and run that deprecation?
    expected_concepts:
      - finding every caller through logs or traffic data
      - a migration guide and support for consumers
      - a published timeline agreed with stakeholders
      - tracking adoption per consumer
      - warnings, brownouts or rate limits before shutdown
      - handling teams that cannot migrate on time
    rubric:
      excellent: Identifies callers from data, makes migration easy with guides or tooling, agrees and communicates a timeline, tracks progress per team, and has an escalation path and final shutdown plan.
      good: Communicates the change, supports consumers and tracks migration.
      weak: Announces an end date and switches the old API off without checking who still uses it.
    followups:
      - What would you do about a team that ignores every reminder?
    common_errors:
      - Relying on a list of known consumers instead of checking actual traffic.

  - external_key: technical.tech_lead.debt_capacity_allocation
    competency_key: project_management
    topic: Allocating capacity to debt
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some teams reserve a fixed share of every sprint for technical debt, while others tie debt work to the
      features that touch it. What has worked for you, and why?
    expected_concepts:
      - pros and cons of a fixed allocation
      - tying cleanup to roadmap areas for visible payoff
      - dedicated larger efforts for structural problems
      - making the allocation visible to stakeholders
      - adjusting based on outcomes
    rubric:
      excellent: Compares the approaches from experience, explains when each fits, describes how they kept debt work visible and accountable, and shows evidence the approach paid off.
      good: Has a working approach and can explain its benefits.
      weak: Has no deliberate approach, or does debt work only when nobody is watching.
    followups:
      - How do you stop reserved debt time from being quietly spent on features?
    common_errors:
      - Spending reserved time on low-value cleanup because nobody prioritised the list.

  - external_key: technical.tech_lead.untested_service_change
    competency_key: code_quality
    topic: Changing a service nobody wants to touch
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You inherit a service with almost no tests that everyone is afraid to change, and next quarter it needs a
      significant new capability. How would you prepare your team to work on it safely?
    expected_concepts:
      - reading production behaviour through logs and metrics
      - characterisation tests around the areas to be changed
      - adding observability before changing behaviour
      - small, reversible changes behind flags
      - building knowledge across more than one engineer
    rubric:
      excellent: Uses the time before the deadline to add characterisation tests and observability around the areas that will change, plans small reversible steps, and spreads knowledge across the team.
      good: Adds tests and monitoring before making changes.
      weak: Starts the new feature directly or proposes a full rewrite.
    followups:
      - Where would you start adding tests if you could only cover a small part of it?
    common_errors:
      - Trying to reach high coverage across the whole service instead of protecting the parts being changed.

  - external_key: technical.tech_lead.finding_costly_hotspots
    competency_key: code_quality
    topic: Finding the most costly parts of a codebase
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a large codebase, how would you find out which areas are costing your team the most, so you know where
      improvement effort will pay off?
    expected_concepts:
      - change frequency combined with complexity
      - defect and incident history by area
      - files that frequently change together
      - review time and lead time per area
      - asking the team where they lose time
    rubric:
      excellent: Combines version control history, complexity, defect and incident data with the team's own experience to find hotspots, and explains how this changed what they chose to fix.
      good: Uses some data sources to identify problem areas.
      weak: Relies only on opinion or static analysis scores across the whole codebase.
    followups:
      - What would you do if the data and the team's opinion pointed at different areas?
    common_errors:
      - Ranking areas by complexity alone, including code that never changes.

  - external_key: technical.tech_lead.cross_team_proposal_process
    competency_key: stakeholder_management
    topic: Running a proposal that affects several teams
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you propose a technical change that affects several teams, such as a new shared authentication approach,
      how do you run the process so those teams are heard and a decision still gets made?
    expected_concepts:
      - talking to affected teams before writing the proposal
      - a written proposal with a comment period and deadline
      - a clear decision maker or forum
      - addressing objections explicitly in the document
      - communicating the decision and the migration plan
    rubric:
      excellent: Engages affected teams early, runs a time-boxed written review with a clear decision owner, records how objections were handled, and follows through on communication and rollout.
      good: Collects input from affected teams and reaches a clear decision.
      weak: Announces the change without consultation or lets the review drag on with no owner.
    followups:
      - What would you do if one team strongly objects after the decision is made?
    common_errors:
      - Collecting feedback without saying who makes the final call.

  - external_key: technical.tech_lead.overlapping_team_solutions
    competency_key: collaboration
    topic: Reconciling duplicate solutions across teams
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You discover that your team and another team have each built their own wrapper for the same job queue, with
      different retry and error-handling behaviour. You're asked to sort it out. How would you approach it?
    expected_concepts:
      - comparing the two implementations and their users
      - understanding why each team built its own
      - agreeing which behaviour is correct with both teams
      - choosing one, merging, or keeping both with justification
      - ownership and a migration plan for the chosen version
    rubric:
      excellent: Understands both solutions and the reasons behind them, involves both teams in deciding, picks a direction based on merit rather than ownership, and settles long-term ownership and migration.
      good: Brings the teams together and converges on one approach.
      weak: Picks their own team's version by default, or leaves both in place without discussion.
    followups:
      - How would you prevent the same duplication happening with the next shared component?
    common_errors:
      - Consolidating code without agreeing who will own and support the result.

  - external_key: technical.tech_lead.shared_library_ownership
    competency_key: system_design
    topic: Owning and versioning shared libraries
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What's your view on internal shared libraries used by many teams? How should they be owned and versioned so
      they help rather than become a bottleneck or a source of breakage?
    expected_concepts:
      - a clear owning team with a support model
      - semantic versioning and compatibility guarantees
      - keeping libraries small and focused
      - automated tests against real consumer use
      - knowing when a service or copy is better than a library
    rubric:
      excellent: Discusses ownership, compatibility rules, release practice and testing against consumers, and weighs when a shared library is the wrong tool, with a real example of one that worked or failed.
      good: Covers ownership and versioning sensibly.
      weak: Treats shared libraries as always good, or has no view on ownership.
    followups:
      - How would you roll out a breaking change in a library used by twenty services?
    common_errors:
      - Putting business logic in a shared library so every team must upgrade together.

  - external_key: technical.tech_lead.blocked_by_platform_team
    competency_key: stakeholder_management
    topic: Depending on a platform team's roadmap
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your launch depends on a change in a platform owned by another team, and they've said it won't make their
      roadmap until next quarter. What options would you explore?
    expected_concepts:
      - understanding their priorities and constraints
      - quantifying the impact of the delay for both teams
      - offering to build the change in their codebase under their review
      - a temporary workaround with a planned removal
      - escalating with data when trade-offs need a higher decision
    rubric:
      excellent: Explores several options including contributing the change and a bounded workaround, frames the trade-off with data, escalates only when needed and without blame, and protects the relationship.
      good: Negotiates and finds at least one workable alternative.
      weak: Waits passively or builds a permanent workaround without telling anyone.
    followups:
      - What would make you choose the workaround over contributing to their codebase?
    common_errors:
      - Building a workaround that duplicates the platform and is never removed.

  - external_key: technical.tech_lead.surfacing_dependencies_early
    competency_key: project_management
    topic: Surfacing cross-team dependencies in planning
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you uncover technical dependencies on other teams early enough in planning that they don't surprise
      you halfway through a project?
    expected_concepts:
      - walking through the design end to end with dependencies in mind
      - talking to dependency owners during planning
      - recording dependencies with owners and needed-by dates
      - tackling the riskiest dependency first
      - regular check-ins on dependency status
    rubric:
      excellent: Has a deliberate method of finding dependencies during design, gets explicit commitments with dates, sequences work to reduce dependency risk early, and tracks them actively.
      good: Identifies dependencies during planning and follows up on them.
      weak: Discovers dependencies when blocked.
    followups:
      - How do you track a dependency the other team has only verbally agreed to?
    common_errors:
      - Treating an informal yes from another team as a scheduled commitment.

  - external_key: technical.tech_lead.temporary_fix_became_permanent
    competency_key: ownership
    topic: A temporary fix that became permanent
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A quick fix your team shipped under deadline pressure was meant to be temporary, but it's been in place for
      a year and other code now depends on it. How would you deal with it?
    expected_concepts:
      - assessing the actual risk and cost of the fix today
      - mapping what now depends on it
      - deciding whether to formalise it or replace it
      - planning a staged removal if replacing
      - changing how temporary fixes are tracked in future
    rubric:
      excellent: Assesses real cost and risk, decides deliberately whether to harden or replace it, plans the change around its dependants, and fixes the process so temporary work has an owner and an expiry.
      good: Plans a sensible remediation and recognises the process issue.
      weak: Rips it out without understanding dependants or ignores it entirely.
    followups:
      - How would you make sure the next temporary fix actually gets removed?
    common_errors:
      - Assuming the fix must be removed when hardening it would be cheaper and safe.

  # ------------------------------------------------------------------ hard
  - external_key: technical.tech_lead.end_of_life_upgrade_many_teams
    competency_key: leadership
    topic: Coordinating an end-of-life upgrade across teams
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A framework used by forty services across many teams reaches end of life in nine months, and you're asked to
      lead the upgrade even though none of those teams report to you. How would you approach it?
    expected_concepts:
      - inventory of affected services and their state
      - upgrading a few representative services first to learn the path
      - codemods, guides and tooling to reduce per-team effort
      - a tracking dashboard visible to leadership
      - agreed deadlines and escalation for stragglers
      - offering hands-on help to teams with the least capacity
    rubric:
      excellent: Builds an accurate inventory, proves the path on pilot services, cuts per-team cost with tooling, makes progress visible, secures leadership backing for the deadline, and has a plan for the teams that fall behind.
      good: Plans the rollout with tooling and tracking.
      weak: Sends an announcement and expects teams to upgrade on their own.
    followups:
      - What would you do with the last three services two weeks before the deadline?
    common_errors:
      - Underestimating the variation between services and assuming one guide fits all.

  - external_key: technical.tech_lead.shared_tables_between_teams
    competency_key: system_design
    topic: Untangling data shared between teams
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Two teams' services both read and write the same database tables, and every schema change now needs both
      teams to coordinate. How would you untangle that?
    expected_concepts:
      - deciding a single owner for each piece of data
      - an API or events in place of direct table access for the other team
      - mapping all reads and writes from each service
      - staged migration with dual writes or views to keep compatibility
      - agreeing the plan and timeline with both teams
    rubric:
      excellent: Establishes data ownership, maps current access, introduces an owned interface, migrates in compatible stages, and agrees the plan across both teams, discussing consistency and performance trade-offs.
      good: Proposes clear ownership and an API boundary with a migration path.
      weak: Proposes copying the tables or freezing schema changes.
    followups:
      - What if the other team's queries need joins your API can't serve efficiently?
    common_errors:
      - Moving the tables without handling the period when both access paths must work.

  - external_key: technical.tech_lead.compounding_debt_types
    competency_key: code_quality
    topic: Which debt compounds fastest
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Not all technical debt grows at the same rate. Which kinds have you seen compound fastest, for example a
      wrong data model compared with messy code inside a module, and how does that shape what you fix first?
    expected_concepts:
      - data model and schema debt spreading into every consumer
      - public API and contract debt locking in other teams
      - missing tests slowing every future change
      - local code messiness being cheap to fix later
      - prioritising by how fast the cost grows, not just its size
    rubric:
      excellent: Explains why structural and contract debt compounds while local debt stays contained, prioritises accordingly, and gives an example of debt that became much more expensive by waiting.
      good: Distinguishes structural from local debt and prioritises sensibly.
      weak: Treats all debt as equal or prioritises by visibility.
    followups:
      - How would you explain this compounding effect to a non-technical stakeholder?
    common_errors:
      - Cleaning up visible code smells while a spreading data model problem goes untouched.

  - external_key: technical.tech_lead.platform_mandate_conflict
    competency_key: stakeholder_management
    topic: A platform mandate conflicts with a launch
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The platform group mandates that all teams move to a new deployment pipeline this quarter, but adopting it now
      would put your team's most important launch at risk. How would you handle it?
    expected_concepts:
      - understanding the reason and deadline behind the mandate
      - quantifying the effort and the risk to the launch
      - proposing a sequenced plan or limited exception
      - meeting the mandate's underlying goal another way where possible
      - agreeing the outcome with both leaderships in writing
    rubric:
      excellent: Respects the purpose of the mandate, quantifies the conflict, proposes a concrete sequenced plan or bounded exception that still serves the platform's goal, and reaches an explicit agreement.
      good: Negotiates a reasonable compromise with clear reasons.
      weak: Ignores the mandate or drops the launch without discussion.
    followups:
      - What if the platform team says no exceptions?
    common_errors:
      - Asking for an exception without offering a date or plan to comply.

  - external_key: technical.tech_lead.showing_debt_work_paid_off
    competency_key: project_management
    topic: Showing debt reduction worked
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      After your team spends a quarter reducing technical debt, how would you show that it was worth it, and what
      would you do if the results are unclear?
    expected_concepts:
      - baseline measures taken before the work
      - lead time, change failure rate or defect trends in the affected areas
      - incidents and on-call load
      - team feedback on ease of change
      - being open about results that did not move
    rubric:
      excellent: Plans measurement before the work starts, uses delivery and reliability measures tied to the improved areas, combines data with team feedback, and treats unclear results as a reason to adjust rather than to spin.
      good: Tracks some relevant before and after measures.
      weak: Reports activity, such as tickets closed, rather than outcomes.
    followups:
      - Which measure would you choose if you could only report one?
    common_errors:
      - Measuring results only after the work is done, with no baseline to compare against.

  - external_key: technical.tech_lead.slipping_cross_team_actions
    competency_key: ownership
    topic: Cross-team follow-ups that keep slipping
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After a serious incident, the review produced action items for three different teams, and two months later
      most of them are still open. As the tech lead who ran the review, what would you do?
    expected_concepts:
      - checking whether the actions are still the right ones
      - reprioritising with each team's lead and making trade-offs explicit
      - clear owners and dates for each action
      - visible tracking reviewed regularly
      - escalating the risk, not the people, when actions stall
    rubric:
      excellent: Revalidates the actions, works with each team to fit them into plans with explicit trade-offs, tracks them visibly, and escalates the remaining risk with data, while improving how future action items are written.
      good: Follows up with owners and gets the important ones scheduled.
      weak: Sends reminders without addressing why the work is not prioritised.
    followups:
      - How would you write action items so they are more likely to get done?
    common_errors:
      - Producing a long list of vague actions that no team can realistically prioritise.
