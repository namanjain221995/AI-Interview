# Curated questions: React state management, data fetching, caching and performance
# (technical.frontend_react, part 2 of 4). Difficulty decides round types: easy -> screening/combined,
# medium -> screening/deep/combined, hard -> deep/combined.
version: 1
defaults:
  role_tags: [frontend]
questions:
  # ------------------------------------------------------------- easy
  - external_key: technical.frontend_react.global_store_structure
    competency_key: frontend_react
    topic: Structuring a client-side global store
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me about a global store you've worked with, such as Redux Toolkit, Zustand or Jotai. How was it
      organised, and what did you deliberately keep out of it?
    expected_concepts:
      - slices or stores grouped by feature
      - actions or methods that describe intent
      - selectors for reading data
      - keeping server data, form state and purely local UI state out of it
      - devtools and predictable updates for debugging
    rubric:
      excellent: Describes a real store with feature-based organisation, explains clear rules for what belongs there and what does not, and shows how selectors and actions kept it maintainable.
      good: Describes a sensible structure and names at least one kind of state kept elsewhere.
      weak: Puts everything into the store by default, or cannot describe how it was organised.
    followups:
      - What would make you remove something from the global store?
      - How did new team members learn where state should go?
    common_errors:
      - Storing every input's value globally.
      - Components reaching directly into store internals instead of using selectors.

  - external_key: technical.frontend_react.cache_freshness
    competency_key: frontend_react
    topic: Choosing cache freshness for server data
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      With a server-state library like TanStack Query or SWR, how do you decide how long fetched data should
      count as fresh? Give me examples of data you'd treat differently.
    expected_concepts:
      - stale time controls when a refetch is considered
      - cache or garbage-collection time controls how long unused data is kept
      - rarely changing reference data can stay fresh for long periods
      - fast-changing data such as stock or status needs short freshness or live updates
      - refetch on window focus and reconnect
    rubric:
      excellent: Separates freshness from cache retention, matches settings to how volatile each kind of data is with real examples, and mentions focus and reconnect refetching.
      good: Understands stale-while-revalidate and gives sensible examples.
      weak: Uses the defaults everywhere without knowing what they do, or disables caching entirely.
    followups:
      - What does the user see when stale data is shown while a refetch runs?
      - When would you turn off refetch on window focus?
    common_errors:
      - Confusing stale time with cache time.
      - Polling everything every few seconds to keep data fresh.

  - external_key: technical.frontend_react.query_key_filters
    competency_key: frontend_react
    topic: Query keys and cache identity
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A product list fetched with a query library doesn't update when the user changes the category filter,
      even though the fetch function reads the filter. What's the likely cause, and how would you fix it?
    expected_concepts:
      - the query key identifies the cached data
      - every input the fetch depends on must be part of the key
      - a new key creates a new cache entry and triggers a fetch
      - keeping previous data visible while the new result loads
    rubric:
      excellent: Pinpoints the missing filter in the key, explains key-based caching, adds the filter to the key and mentions placeholder or previous data to avoid flicker.
      good: Identifies the query key problem and fixes it.
      weak: Calls refetch manually in an effect when the filter changes.
    followups:
      - How would you structure keys so you can invalidate all product lists at once?
      - What lint rule or convention would catch this earlier?
    common_errors:
      - Fetch functions that close over values missing from the key.
      - Manual refetching that fights the cache.

  - external_key: technical.frontend_react.immutable_updates
    competency_key: frontend_react
    topic: Updating nested state immutably
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you update deeply nested state in React, for example changing one task's status inside a project
      inside a list of projects? Talk me through your approach and any tools you use.
    expected_concepts:
      - React compares references, so state must be replaced, not mutated
      - spreading each level along the changed path
      - helpers like Immer that allow mutable-looking drafts
      - flattening or normalising state to avoid deep nesting
      - unchanged branches keep their references for memoisation
    rubric:
      excellent: Explains why immutability matters for change detection, updates only the changed path, uses Immer or normalisation when nesting gets deep, and notes that untouched branches keep their identity.
      good: Correctly copies each level or uses Immer.
      weak: Mutates the nested object and calls setState with the same reference.
    followups:
      - What does structural sharing buy you for memoised components?
      - When would you reshape the state instead of writing deeper updates?
    common_errors:
      - Mutating the object and then spreading only the top level.
      - Deep cloning the entire state on every update.

  - external_key: technical.frontend_react.profiler_walkthrough
    competency_key: frontend_react
    topic: Using the React DevTools Profiler
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me how you'd use the React DevTools Profiler to understand why a page feels slow. What do you look at
      first, and what would make you suspicious?
    expected_concepts:
      - record an interaction and inspect commits
      - flame graph and ranked views to find expensive components
      - why did this render information
      - components rendering when their output did not change
      - confirm with the browser performance panel for non-React work
    rubric:
      excellent: Describes a recording workflow, reads flame and ranked charts, uses render reasons to find unnecessary renders and knows when the problem lies outside React.
      good: Can record a profile and identify slow or frequently rendering components.
      weak: Has not used the profiler and would guess by adding memo.
    followups:
      - What if the profiler shows React work is fast but the page still stutters?
      - How do you profile a production build?
    common_errors:
      - Profiling a development build and trusting absolute timings.
      - Ignoring non-React main-thread work.

  - external_key: technical.frontend_react.route_code_splitting
    competency_key: frontend_react
    topic: Code splitting with lazy and Suspense
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you use code splitting in a React app, and how do you decide where the split points should be?
    expected_concepts:
      - React.lazy with dynamic import and a Suspense fallback
      - splitting by route as the default
      - splitting rarely used heavy widgets such as editors or charts
      - preloading likely next chunks
      - avoid splitting tiny components into many requests
    rubric:
      excellent: Splits by route and heavy features, preloads on intent, avoids over-splitting, and checks results with a bundle analyser.
      good: Uses lazy with Suspense at route level.
      weak: Has never split code or splits every component.
    followups:
      - How would you handle a chunk that fails to load after a new deploy?
      - How do you avoid a loading flash when navigating?
    common_errors:
      - Lazy-loading components needed on the first screen.
      - No error handling for failed chunk loads.

  - external_key: technical.frontend_react.derived_state_effect
    competency_key: frontend_react
    topic: Derived values kept in state
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A teammate stores a filtered list in state and updates it inside a useEffect whenever the search text or
      the items change. Users sometimes see the old list for a moment. What would you suggest instead?
    expected_concepts:
      - compute the filtered list during render
      - the effect causes an extra render with stale output first
      - useMemo only if the computation is measurably expensive
      - one source of truth instead of two values that can drift
    rubric:
      excellent: Explains the extra render and stale frame, removes the state and effect in favour of computing during render, and adds useMemo only when profiling shows a cost.
      good: Recommends deriving the list during render.
      weak: Adds more dependencies to the effect or a second effect to keep things in sync.
    followups:
      - When is a derived value worth memoising?
      - How would you spot other effects in the codebase that shouldn't exist?
    common_errors:
      - Syncing state to state with effects.
      - Memoising trivial calculations by default.

  - external_key: technical.frontend_react.store_selectors
    competency_key: frontend_react
    topic: Subscribing to a global store efficiently
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A small header component reads one value from a global store like Redux or Zustand, yet it renders again
      whenever anything in the store changes. Why would that happen, and how would you fix it?
    expected_concepts:
      - subscribing to the whole store instead of a slice
      - selectors that return only what the component needs
      - selectors creating new objects or arrays each time
      - shallow equality or memoised selectors
    rubric:
      excellent: Explains selector-based subscriptions, spots new-object selectors as a second cause, and fixes both with narrow selectors, shallow comparison or memoised selectors.
      good: Uses a narrower selector to fix it.
      weak: Wraps the component in memo, which does not affect store subscriptions.
    followups:
      - Why can a selector that maps over an array cause renders on every change?
      - How would you confirm the fix?
    common_errors:
      - Selecting the entire state object.
      - Returning a freshly built object from a selector.

  # ------------------------------------------------------------- medium
  - external_key: technical.frontend_react.effect_or_event_handler
    competency_key: frontend_react
    topic: Effects versus event handlers
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      After a successful save, a component sets a submitted flag, and a useEffect watching that flag shows a
      toast and navigates to another page. It occasionally fires twice or at the wrong time. How would you
      restructure it, and what rule of thumb would you share with the team?
    expected_concepts:
      - logic caused by a specific user action belongs in the event handler
      - effects are for synchronising with external systems because something rendered
      - flag-and-effect chains cause extra renders and repeat firing
      - run the toast and navigation after the awaited save
      - fewer pieces of state to reset
    rubric:
      excellent: Moves the side effects into the submit handler after the awaited save, explains the difference between event-driven and render-driven logic, and gives a clear rule the team can apply.
      good: Moves the logic into the handler and explains why the effect misfired.
      weak: Adds another flag or a ref guard to stop the effect firing twice.
    followups:
      - Give me an example where an effect really is the right place.
      - What happens to this logic if the component unmounts mid-save?
    common_errors:
      - Chains of effects that set state that triggers other effects.
      - Guard refs that hide the underlying design problem.

  - external_key: technical.frontend_react.request_deduplication
    competency_key: frontend_react
    topic: Sharing one request across components
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Five components on the same page each need the signed-in user's profile and each fetches it on mount.
      How would you avoid five identical requests while keeping the components independent of each other?
    expected_concepts:
      - a shared cache keyed by request so concurrent calls reuse one in-flight promise
      - a custom hook wrapping the query so callers stay decoupled
      - server-state libraries deduplicate by key out of the box
      - fetching higher up and passing data down as an alternative
      - consistent freshness rules for all consumers
    rubric:
      excellent: Explains in-flight deduplication by key, wraps it in a reusable hook so components stay independent, compares this with lifting the fetch, and sets one freshness policy.
      good: Uses a server-state library or shared cache to deduplicate.
      weak: Stores the profile in a global variable populated by whichever component loads first.
    followups:
      - How would you build deduplication yourself without a library?
      - What should happen when one consumer needs fresher data than the others?
    common_errors:
      - Module-level variables without invalidation or error handling.
      - Prop drilling the profile through unrelated components.

  - external_key: technical.frontend_react.query_retry_policy
    competency_key: frontend_react
    topic: Retry behaviour for failed queries
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your data library retries every failed request three times with backoff. Users opening a deleted record
      now stare at a spinner for several seconds before seeing not found, while flaky 503s are still sometimes
      surfaced as errors. How would you tune the retry behaviour?
    expected_concepts:
      - retry only transient failures such as network errors, 503 and 429
      - never retry 4xx errors like 404 or 403
      - exponential backoff with jitter and respecting Retry-After
      - authentication errors handled globally rather than retried
      - showing stale data or a retry action while failing
      - only retrying safe or idempotent mutations
    rubric:
      excellent: Classifies errors into retryable and not, configures retries per error type with backoff and jitter, handles auth errors centrally, keeps mutations safe and gives users a clear recovery path.
      good: Stops retrying client errors and keeps retries for transient failures.
      weak: Turns retries off entirely or increases the count.
    followups:
      - Why should mutations usually not retry automatically?
      - How would you make error types available to the retry function?
    common_errors:
      - Retrying 404 and 403 responses.
      - Automatically retrying non-idempotent writes.

  - external_key: technical.frontend_react.request_waterfalls
    competency_key: frontend_react
    topic: Eliminating request waterfalls
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A dashboard page takes four seconds to load. In the network panel you see requests starting one after
      another as each nested component mounts and fetches its own data. How would you restructure it?
    expected_concepts:
      - fetch-on-render creates waterfalls
      - start independent requests in parallel
      - hoist fetching to route loaders or the page level
      - prefetching during navigation
      - backend aggregation endpoints when calls are truly dependent
      - Suspense boundaries to reveal sections independently
    rubric:
      excellent: Diagnoses fetch-on-render, parallelises independent calls, moves fetching to the route or server, uses boundaries to stream sections, and considers an aggregated endpoint for dependent data.
      good: Identifies the waterfall and fetches in parallel at a higher level.
      weak: Adds a bigger spinner or caches responses without addressing the sequencing.
    followups:
      - What if the second request genuinely needs data from the first?
      - How would you verify the improvement on slow networks?
    common_errors:
      - Each nested component waiting for its parent's data before fetching.
      - Fixing the symptom with longer caching only.

  - external_key: technical.frontend_react.virtualized_table
    competency_key: frontend_react
    topic: Virtualising large tables
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Operations staff need a table of about ten thousand shipments with sticky headers, rows of varying height
      and in-row editing. Rendering everything freezes the browser. How would you approach it?
    expected_concepts:
      - windowing to render only visible rows plus overscan
      - measuring dynamic row heights
      - stable keys and memoised rows
      - server-side pagination or filtering as an alternative
      - keeping editing state outside individual rows
      - accessibility of virtualised rows
    rubric:
      excellent: Applies virtualisation with dynamic measurement, keeps edit state stable as rows unmount, questions whether all rows are needed client-side, and addresses keyboard and screen-reader behaviour.
      good: Uses a virtualisation library and handles variable heights.
      weak: Renders every row and suggests a faster machine or pagination without considering the workflow.
    followups:
      - What happens to an in-progress edit when its row scrolls out of view?
      - How does browser find-in-page behave with a virtualised list?
    common_errors:
      - Storing edit state inside rows that unmount when scrolled away.
      - Assuming a fixed row height when content wraps.

  - external_key: technical.frontend_react.memo_referential_equality
    competency_key: frontend_react
    topic: Why memoised children still re-render
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You wrapped an expensive chart component in memo, but the profiler shows it still renders every time its
      parent does. What would you check, and how would you fix it?
    expected_concepts:
      - inline objects, arrays and functions create new references
      - memo compares props shallowly
      - useMemo and useCallback to stabilise props
      - children passed as JSX are new each render
      - context consumed inside the chart
      - moving state down so the parent renders less
    rubric:
      excellent: Systematically checks each prop's identity, stabilises the right ones, recognises children and context as causes, and considers restructuring state instead of more memoisation.
      good: Identifies unstable function or object props and stabilises them.
      weak: Adds a custom comparison that always returns true.
    followups:
      - When is a custom comparison function for memo justified?
      - How would you find which prop changed?
    common_errors:
      - Passing a new style object or options literal on each render.
      - Custom comparators that hide real updates.

  - external_key: technical.frontend_react.transitions_heavy_tabs
    competency_key: frontend_react
    topic: Transitions for heavy view switches
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Clicking between tabs on an analytics page freezes the UI for half a second because each tab renders a lot
      of content. How could transitions help here, and where do they stop helping?
    expected_concepts:
      - startTransition or useTransition marks the update as non-urgent
      - React can interrupt the transition to handle input
      - isPending to show the old view with a pending indicator
      - transitions do not make the rendering itself cheaper
      - non-React main-thread work is unaffected
    rubric:
      excellent: Explains interruptible rendering and pending state, shows how it keeps the tab bar responsive, and is clear that expensive rendering still needs optimisation or splitting.
      good: Uses useTransition and knows it keeps input responsive.
      weak: Thinks transitions run work on another thread or speed up rendering.
    followups:
      - How does Suspense interact with a transition when the new tab loads data?
      - What would you do if a single component's render takes 400 milliseconds?
    common_errors:
      - Wrapping controlled input updates in a transition.
      - Expecting transitions to fix slow synchronous code.

  - external_key: technical.frontend_react.row_selection_rerenders
    competency_key: frontend_react
    topic: Selection state in large lists
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a list of a thousand contacts, clicking one row to select it makes every row render again and the
      highlight appears with a visible delay. The selected id lives in the parent. How would you restructure
      this so only the affected rows update?
    expected_concepts:
      - pass each row a boolean isSelected rather than the whole selection
      - memoised rows with stable callbacks that take an id
      - per-row subscriptions to an external store with selectors
      - avoid recreating item objects on each parent render
      - measure with the profiler before and after
    rubric:
      excellent: Narrows each row's props to what it needs, stabilises callbacks, memoises rows, considers per-row store subscriptions for very large lists and confirms with profiling that only two rows render.
      good: Memoises rows and passes a per-row selected flag with stable handlers.
      weak: Passes the whole selection array to every row or moves the selection into each row's local state.
    followups:
      - How would multi-select with shift-click change the design?
      - At what list size would you add virtualisation as well?
    common_errors:
      - Passing a new inline click handler per row on every render.
      - Giving every row the full selection set as a prop.

  - external_key: technical.frontend_react.normalized_store
    competency_key: frontend_react
    topic: Normalising client-side entities
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a project management app, the same user object appears inside tasks, comments and project members.
      When would you normalise that data on the client, and how?
    expected_concepts:
      - store entities once by id with lookup tables
      - references by id in other entities
      - a single update reflects everywhere
      - entity adapters or normalisation libraries
      - when the server-state cache makes normalisation unnecessary
    rubric:
      excellent: Explains the consistency and update benefits, shows the id-map structure, discusses tooling and recognises cases where a server-state cache with invalidation is simpler.
      good: Describes storing entities by id and referencing them.
      weak: Keeps nested copies and updates each one manually.
    followups:
      - How do you build a denormalised view efficiently for rendering?
      - What are the costs of normalising everything?
    common_errors:
      - Nested duplicates that drift out of sync.
      - Normalising data that is only ever read once.

  - external_key: technical.frontend_react.ui_state_machines
    competency_key: frontend_react
    topic: Modelling UI with state machines
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Have you ever modelled a complex piece of UI, like a checkout or a media player, as an explicit state
      machine? Explain when that approach is worth it and how it changes the code.
    expected_concepts:
      - finite states with allowed transitions instead of many booleans
      - impossible states become unrepresentable
      - events drive transitions
      - libraries such as XState or a reducer with a status field
      - easier testing and visualisation of flows
      - overhead for simple components
    rubric:
      excellent: Gives a real example, shows how explicit states and transitions removed impossible combinations, explains implementation options from a typed reducer to XState, and recognises when it is overkill.
      good: Understands the benefit over boolean flags and describes a plausible implementation.
      weak: Unfamiliar with the idea and models everything with independent booleans.
    followups:
      - How would you handle a timeout or cancellation in that machine?
      - How would you test every transition?
    common_errors:
      - isLoading, isError and isSuccess flags that can all be true.
      - Introducing a state-machine library for a two-state toggle.

  - external_key: technical.frontend_react.intent_prefetching
    competency_key: frontend_react
    topic: Prefetching on user intent
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How have you used prefetching to make navigation feel instant, and how do you avoid wasting bandwidth or
      server capacity doing it?
    expected_concepts:
      - prefetch data and code on hover, focus or viewport visibility
      - route loaders that start fetching before render
      - seeding detail views from list data
      - respecting data saver and slow connections
      - limiting concurrency and freshness of prefetched data
    rubric:
      excellent: Gives concrete prefetch triggers for both code and data, seeds caches from list data, and limits waste by respecting connection hints and freshness rules.
      good: Prefetches on hover or route transitions with some awareness of cost.
      weak: Prefetches everything on page load.
    followups:
      - How would you measure whether prefetching paid off?
      - What about touch devices that have no hover?
    common_errors:
      - Prefetching data that is stale by the time it is used.
      - Ignoring metered connections.

  # ------------------------------------------------------------- hard
  - external_key: technical.frontend_react.multi_tab_consistency
    competency_key: frontend_react
    topic: Consistency across browser tabs
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Users often keep your app open in several tabs. They edit a record in one tab and see stale data in
      another, and logging out in one tab leaves the others still signed in. How would you solve both problems?
    expected_concepts:
      - BroadcastChannel or storage events between tabs
      - invalidate or update caches when another tab mutates data
      - refetch on focus as a fallback
      - broadcasting logout and clearing sensitive caches
      - one tab acting as leader for shared polling or connections
    rubric:
      excellent: Uses a cross-tab channel to propagate mutations and logout, clears caches on logout, avoids every tab duplicating polling or connections, and keeps refetch on focus as a safety net.
      good: Broadcasts changes and logout between tabs.
      weak: Only suggests telling users to refresh.
    followups:
      - How would you stop every open tab from polling the same endpoint?
      - What data must be cleared from memory on logout?
    common_errors:
      - Broadcasting full records between tabs instead of an invalidation signal.
      - Leaving cached personal data visible after logout.

  - external_key: technical.frontend_react.suspense_data_architecture
    competency_key: frontend_react
    topic: Suspense boundaries and streaming
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you design the Suspense boundaries for a product page that has a hero section, reviews,
      recommendations and a personalised price? I'd like to hear how loading order, streaming and layout shift
      play into your choices.
    expected_concepts:
      - boundaries group content that should appear together
      - critical content outside slow boundaries
      - streaming server rendering reveals sections progressively
      - start fetches early to avoid waterfalls inside boundaries
      - fallbacks sized to prevent layout shift
      - transitions keep existing content visible on updates
    rubric:
      excellent: Places boundaries by user priority, keeps the hero and price fast, streams slower sections, prevents waterfalls by hoisting fetches, sizes fallbacks to avoid shifts and uses transitions for later updates.
      good: Sensible boundary placement with awareness of streaming and fallbacks.
      weak: One boundary around the whole page or a spinner per component.
    followups:
      - What happens if a component suspends during a transition?
      - How would you handle an error in the reviews section only?
    common_errors:
      - Too many tiny boundaries causing a popcorn effect.
      - Fetching inside the boundary so requests start late.

  - external_key: technical.frontend_react.redux_to_server_state
    competency_key: frontend_react
    topic: Migrating server data out of a global store
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You inherit a large app where every API response is stored in Redux with hand-written loading flags and
      thunks, and stale data bugs are common. How would you plan a move to a server-state library without a big
      rewrite?
    expected_concepts:
      - separate server state from genuine client state
      - migrate feature by feature behind existing selectors or hooks
      - co-existence and bridging during the transition
      - define cache keys and invalidation rules up front
      - tests and metrics to confirm fewer stale-data bugs
    rubric:
      excellent: Audits which state is server data, migrates incrementally behind stable hooks, plans a co-existence period with clear invalidation, and measures the outcome in bugs and code removed.
      good: Incremental feature-by-feature migration with a clear separation of state types.
      weak: Rewrites everything at once or keeps duplicating server data in both places.
    followups:
      - How would components that read old selectors keep working during the move?
      - Which piece would you migrate first, and why?
    common_errors:
      - Keeping data in both Redux and the query cache indefinitely.
      - Migrating without agreeing on invalidation rules.

  - external_key: technical.frontend_react.dashboard_widget_polling
    competency_key: frontend_react
    topic: Data flow for a dashboard of many widgets
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      An operations dashboard has about forty widgets, each polling its own endpoint on its own timer. After an
      hour the page is sluggish, the API team is unhappy about traffic and widgets disagree with each other.
      How would you redesign the data flow?
    expected_concepts:
      - consolidate polling into shared queries or a batched endpoint
      - pause polling for hidden tabs and off-screen widgets
      - push updates over a single connection where appropriate
      - consistent snapshot times so widgets agree
      - limit re-render scope per widget
      - check memory growth from accumulated data
    rubric:
      excellent: Consolidates and batches requests, pauses work when not visible, considers server push, aligns widgets on one snapshot, scopes re-renders and investigates memory growth over time.
      good: Reduces duplicate polling and pauses hidden widgets.
      weak: Increases the polling interval everywhere without addressing duplication or consistency.
    followups:
      - How would you decide between polling and server push here?
      - How would you prove the page no longer degrades after hours of use?
    common_errors:
      - Independent timers that never stop for hidden tabs.
      - Arrays of history data that grow without limit.

  - external_key: technical.frontend_react.external_store_tearing
    competency_key: frontend_react
    topic: Tearing with external stores
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      What is tearing in concurrent React, and how would you make sure a custom state store you built doesn't
      show inconsistent values across components during a render?
    expected_concepts:
      - concurrent rendering can yield mid-render
      - an external store can change between components rendering
      - different parts of the screen show different versions
      - useSyncExternalStore forces consistent snapshots
      - immutable, cached snapshots for stable comparisons
    rubric:
      excellent: Defines tearing precisely, explains why yielding causes it with mutable external stores, and integrates the store with useSyncExternalStore using immutable cached snapshots.
      good: Understands tearing and knows useSyncExternalStore addresses it.
      weak: Has not heard of tearing or believes React state alone can never be inconsistent with external data.
    followups:
      - Why must getSnapshot return the same value when nothing changed?
      - What trade-off does useSyncExternalStore make with transitions?
    common_errors:
      - Subscribing with useEffect and useState for a frequently changing store.
      - Returning a new object from every snapshot call.

  - external_key: technical.frontend_react.ssr_cache_hydration
    competency_key: frontend_react
    topic: Handing server-fetched data to the client cache
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      In a server-rendered React app that uses a client-side query cache, how do you make sure data fetched on
      the server is reused in the browser instead of being fetched again right after hydration?
    expected_concepts:
      - prefetch on the server and serialise the cache into the HTML
      - hydrate or seed the client cache before components render
      - one cache instance per request on the server to avoid leaking data between users
      - stale time set so hydration does not trigger an immediate refetch
      - safe serialisation that escapes script-breaking content
      - streaming data with Suspense as a newer approach
    rubric:
      excellent: Describes prefetch, dehydrate and hydrate, creates a fresh cache per request to prevent cross-user leaks, tunes freshness to avoid refetching, escapes serialised data and discusses streaming alternatives.
      good: Explains passing server data into the client cache and avoiding a refetch.
      weak: Fetches on the server and again in a client effect, or shares one cache across requests.
    followups:
      - What could go wrong if the server reused a single cache instance?
      - How large can the serialised payload get before it hurts performance?
    common_errors:
      - A module-level cache on the server shared between users.
      - Unescaped JSON in a script tag.
