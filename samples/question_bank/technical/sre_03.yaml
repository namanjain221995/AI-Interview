# Site reliability engineering, part 3: capacity, load testing, chaos engineering, toil and change safety.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [sre]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.sre.early_capacity_signals
    competency_key: system_design
    topic: Early signs of running out of capacity
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What signals tell you a service is getting close to its capacity limits before users start to notice?
    expected_concepts:
      - saturation signals such as queue depth, thread or connection pool usage
      - latency creeping up at peak while errors stay flat
      - resource trends against known limits (disk, memory, quotas)
      - throttling events such as CPU throttling or rate-limit rejections
      - comparing peak demand with tested capacity
    rubric:
      excellent: Names leading saturation indicators rather than lagging ones, ties them to known limits from load tests, and explains how they are reviewed or alerted on.
      good: Mentions rising latency at peak and resource trends.
      weak: Waits for errors or outages to reveal capacity problems.
    followups:
      - Which of those would you put on a weekly capacity review?
      - How do you know what the real limit is in the first place?
    common_errors:
      - Watching averages over a day, which hide the peak hour.

  - external_key: technical.sre.performance_test_types
    competency_key: system_design
    topic: Kinds of performance tests
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me about the different kinds of performance tests you've run, such as steady load, stress, spike
      or long soak tests, and what question each one was meant to answer.
    expected_concepts:
      - load tests to confirm behaviour at expected traffic
      - stress tests to find the breaking point and failure mode
      - spike tests for sudden surges and autoscaling response
      - soak tests for leaks and slow degradation over hours
      - clear pass or fail criteria for each
    rubric:
      excellent: Describes each test type from real experience, the specific question it answered, and what was found, including a failure mode only one type revealed.
      good: Correctly distinguishes the types with at least one real example.
      weak: Treats all performance testing as one activity or cannot give examples.
    followups:
      - What did a soak test find that a short test would have missed?
      - How would you test autoscaling behaviour?
    common_errors:
      - Running tests for only a few minutes and missing leaks.

  - external_key: technical.sre.toil_example_decision
    competency_key: problem_solving
    topic: Deciding whether to automate a task
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Give me an example of repetitive operational work from a team you've been on, and explain how you
      decided whether it was worth automating.
    expected_concepts:
      - frequency and time spent per occurrence
      - risk of human error in the manual process
      - effort and maintenance cost of the automation
      - whether the need could be removed entirely
      - result measured after the change
    rubric:
      excellent: Gives a specific example with numbers on frequency and time, weighs risk and maintenance cost, considers eliminating the root need, and reports the outcome.
      good: Gives a real example and a sensible reason to automate it.
      weak: Has no concrete example or automated something with no thought about cost or benefit.
    followups:
      - What was the hardest part of the automation to get right?
      - What would have made you decide not to automate it?
    common_errors:
      - Ignoring the ongoing maintenance cost of the automation itself.

  - external_key: technical.sre.instance_termination_prereqs
    competency_key: distributed_systems
    topic: Before terminating instances on purpose
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your team wants to start randomly terminating instances in a staging environment to test resilience.
      What would you want in place before running that, and what would you watch while it runs?
    expected_concepts:
      - expected behaviour stated in advance
      - monitoring that shows user-facing impact clearly
      - a way to stop the experiment immediately
      - announcing the experiment to other teams sharing the environment
      - recording results and follow-up actions
    rubric:
      excellent: Defines expected behaviour, ensures visibility of impact, has a kill switch and stakeholder notice, and explains what results would trigger follow-up work.
      good: Mentions monitoring and a way to stop the experiment.
      weak: Starts terminating instances with no expectation or monitoring.
    followups:
      - What would you do if staging behaves very differently from production?
      - What would you expect to happen to in-flight requests?
    common_errors:
      - Running the experiment without telling teams who share the environment.

  - external_key: technical.sre.canary_comparison_metrics
    competency_key: observability
    topic: Judging a canary
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you roll a new version out to a small canary group, what do you compare against the rest of the
      fleet to decide whether it's safe to continue?
    expected_concepts:
      - error rate and latency compared with a baseline running at the same time
      - resource usage such as memory and CPU per request
      - business or functional signals, not only system metrics
      - enough traffic and time for a meaningful comparison
      - automatic halt or rollback criteria
    rubric:
      excellent: Compares canary against a concurrent baseline on errors, latency, resources and business signals, explains statistical limits of small traffic, and defines automatic halt criteria.
      good: Compares error rate and latency between canary and the rest of the fleet.
      weak: Watches only whether the canary pods stay running.
    followups:
      - Why compare with a fresh baseline rather than the whole old fleet?
      - How long would you let a canary run before deciding?
    common_errors:
      - Declaring success after a few minutes with too little traffic to see a difference.

  - external_key: technical.sre.right_after_resolution
    competency_key: incident_response
    topic: Right after an incident is resolved
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An incident you were handling was resolved an hour ago. What do you do before you go back to your
      normal work?
    expected_concepts:
      - confirm recovery with metrics, not assumption
      - remove or record temporary mitigations
      - send a resolution update to stakeholders
      - capture the timeline and evidence while it is fresh
      - schedule the postmortem and open follow-up tickets
    rubric:
      excellent: Verifies recovery, tidies temporary changes, communicates resolution, captures the timeline and evidence, and sets up the review with owners.
      good: Confirms recovery, communicates and starts the postmortem.
      weak: Moves straight on to other work once the alert clears.
    followups:
      - What evidence tends to disappear if you wait a few days?
      - Who decides whether a postmortem is needed?
    common_errors:
      - Leaving temporary workarounds in place that nobody remembers later.

  - external_key: technical.sre.percentiles_over_averages
    competency_key: observability
    topic: Why percentiles beat averages
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Why do reliability teams usually talk about high percentiles of latency rather than the average? Use an
      example from a system you know.
    expected_concepts:
      - averages hide slow outliers
      - a small share of slow requests affects many users across a session
      - pages with many backend calls are dominated by the tail
      - percentiles need histograms or raw data, not averages of averages
    rubric:
      excellent: Explains with a concrete example how the tail affects real users, including fan-out amplification, and notes how percentiles must be computed correctly.
      good: Explains that averages hide slow requests with a reasonable example.
      weak: Thinks averages are sufficient or cannot explain why the tail matters.
    followups:
      - If a page makes twenty backend calls, how does the p99 of each call affect the page?
      - Can the average go down while users have a worse experience?
    common_errors:
      - Believing the p99 affects only one percent of users.

  - external_key: technical.sre.recurring_manual_restart
    competency_key: problem_solving
    topic: Recurring manual restart
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Every week or so, someone on the team has to manually restart a background worker that gets stuck. How
      would you deal with that?
    expected_concepts:
      - gather evidence when it next gets stuck (thread dumps, logs, metrics)
      - add detection for the stuck state
      - safe automatic restart as a stop-gap
      - fix the underlying cause rather than living with the restart
      - track whether the problem recurs
    rubric:
      excellent: Captures diagnostic evidence before restarting, adds detection and a temporary safe auto-restart, and drives a fix for the underlying cause with tracking.
      good: Adds monitoring and automation for the restart and plans to look at the cause.
      weak: Writes a cron job to restart it every night and stops there.
    followups:
      - What would you capture before restarting it next time?
      - When is an automatic restart a reasonable permanent answer?
    common_errors:
      - Restarting so quickly that the evidence needed to find the cause is lost.

  # ---------------------------------------------------------------- medium
  - external_key: technical.sre.misleading_load_tests
    competency_key: system_design
    topic: Load tests that mislead
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What are the common ways a load test produces results that look better than production will really
      be?
    expected_concepts:
      - unrealistically high cache hit rates from repeated requests
      - small or unrepresentative data sets
      - mocked or unlimited dependencies
      - load generator saturation or closed-loop measurement hiding queueing
      - missing background work such as batch jobs and replication
    rubric:
      excellent: Lists several concrete pitfalls with an explanation of why each flatters results, including load generator effects, and describes how they were avoided in practice.
      good: Names realistic data and cache effects as common problems.
      weak: Cannot name ways a test might mislead.
    followups:
      - How would you generate realistic request parameters?
      - What would you do about dependencies you can't load test?
    common_errors:
      - Replaying the same few requests so everything is served from cache.

  - external_key: technical.sre.rightsizing_overprovisioned
    competency_key: system_design
    topic: Safely reducing over-provisioning
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Finance points out that a large service averages twenty-five percent CPU and wants it scaled down. How
      would you decide how much you can safely cut?
    expected_concepts:
      - look at peak, not average, and at the real bottleneck resource
      - account for failure and deploy headroom
      - check latency against SLOs as capacity is reduced
      - reduce in steps with a rollback plan
      - autoscaling or scheduling to match demand over the day
    rubric:
      excellent: Uses peak demand and the true bottleneck, reserves headroom for failures, reduces gradually while watching SLOs, and proposes autoscaling to capture savings safely.
      good: Considers peaks and headroom and reduces capacity gradually.
      weak: Cuts to a target average utilisation without considering peaks or failures.
    followups:
      - What if memory, not CPU, is the limiting resource?
      - How would you present the risk and savings to finance?
    common_errors:
      - Sizing to the daily average and failing at the morning peak.

  - external_key: technical.sre.fault_injection_blast_radius
    competency_key: distributed_systems
    topic: Limiting blast radius in production experiments
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      If you run fault injection in production, how do you limit the blast radius and decide when to stop an
      experiment?
    expected_concepts:
      - start with a small share of traffic, hosts or users
      - automated abort on SLO or key metric thresholds
      - time limits and easy manual stop
      - avoid running during peaks or other risky changes
      - widen scope gradually as confidence grows
    rubric:
      excellent: Describes progressive scoping, automated and manual abort conditions tied to user impact, timing constraints and how scope is widened only after evidence.
      good: Limits scope and defines conditions for stopping.
      weak: Runs experiments across the whole fleet with no stop condition.
    followups:
      - What metric would you use as the automatic abort trigger?
      - How do you make sure an experiment can't outlive its own controller?
    common_errors:
      - Relying on a person watching graphs as the only stop mechanism.

  - external_key: technical.sre.latency_injection_findings
    competency_key: distributed_systems
    topic: Latency injection exposing weak timeouts
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In an experiment, you add half a second of latency to a recommendations service and the entire checkout
      flow starts timing out. What does that tell you, and what would you fix?
    expected_concepts:
      - a soft dependency is behaving as a hard one
      - missing or too-long timeouts on the call
      - synchronous call on the critical path
      - thread or connection pool exhaustion from waiting calls
      - fallbacks, circuit breakers and moving the call off the critical path
    rubric:
      excellent: Diagnoses the dependency as effectively hard, explains the pool exhaustion mechanism, and proposes tight timeouts, fallbacks, circuit breaking and decoupling with a re-test.
      good: Recognises missing timeouts and proposes fallbacks.
      weak: Concludes the recommendations service needs to be faster.
    followups:
      - How would you choose the timeout value for that call?
      - How would you verify the fix?
    common_errors:
      - Setting a timeout longer than the caller's own deadline.

  - external_key: technical.sre.auto_remediation_guardrails
    competency_key: problem_solving
    topic: Guardrails for automated remediation
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What risks come with automated remediation, like automatic restarts or failovers, and what guardrails
      do you put around it?
    expected_concepts:
      - automation hiding real problems from humans
      - acting on bad signals and amplifying an outage
      - rate limits and caps on how much it can change at once
      - notification and audit trail of every action
      - easy way to pause automation during incidents
    rubric:
      excellent: Explains how automation can mask problems and amplify outages, and describes concrete guardrails such as rate limits, safety caps, audit trails and a pause switch.
      good: Mentions limits on automation and alerting when it acts.
      weak: Sees no downside to automating every remediation.
    followups:
      - How would you know if automation is restarting something hundreds of times a day?
      - Who should be able to pause it?
    common_errors:
      - Letting automation act without recording what it did.

  - external_key: technical.sre.reduce_ops_load_split
    competency_key: problem_solving
    topic: Getting operational load under control
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team is spending about seventy percent of its time on operational work, and product teams keep
      asking for more features. How would you get to a sustainable balance?
    expected_concepts:
      - measure and categorise the operational work
      - agree a target cap on operational time with leadership
      - push work back to owning teams or improve their tooling
      - invest in the biggest sources first and show results
      - error budgets or service ownership agreements as leverage
    rubric:
      excellent: Quantifies the work, agrees an explicit cap with leadership, chooses high-leverage fixes and handbacks, and reports progress with data.
      good: Measures the work and proposes reducing the largest sources.
      weak: Asks for more headcount or keeps absorbing the work.
    followups:
      - How would you hand operational work back to a development team?
      - What would you show leadership after three months?
    common_errors:
      - Trying to fix everything at once instead of the largest sources first.

  - external_key: technical.sre.config_rollout_safety
    competency_key: ci_cd
    topic: Making configuration changes safe
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Many outages are caused by configuration changes rather than code. How would you make configuration
      rollout as safe as a code deploy?
    expected_concepts:
      - configuration in version control with review
      - schema validation and automated checks before rollout
      - staged rollout to a canary then wider
      - fast, tested rollback of configuration
      - recording config changes as events visible on dashboards
    rubric:
      excellent: Treats configuration as code with review, validation, staged rollout, fast rollback and change events on dashboards, and gives an example of a failure it would have prevented.
      good: Proposes validation and staged rollout for config changes.
      weak: Relies on people being careful.
    followups:
      - How would you handle a global setting that can't be rolled out gradually?
      - What about feature flags, which change behaviour without a deploy?
    common_errors:
      - Pushing configuration to every region at once.

  - external_key: technical.sre.untested_failover_plan
    competency_key: incident_response
    topic: Validating a never-tested failover plan
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your disaster recovery plan says you can fail over to a second region in thirty minutes, but nobody
      has ever tried it. How would you find out whether that's true?
    expected_concepts:
      - review the plan for dependencies and manual steps
      - tabletop exercise before a live test
      - staged tests starting with non-critical components
      - measure actual recovery time and data loss against objectives
      - fix gaps and make failover a regular exercise
    rubric:
      excellent: Moves from tabletop review to staged and then full tests, measures recovery time and data loss against targets, and makes the exercise regular with fixes tracked.
      good: Plans a controlled failover test and measures the outcome.
      weak: Trusts the document, or attempts a full failover in production without preparation.
    followups:
      - What hidden dependency would you expect to find?
      - How often would you repeat the exercise?
    common_errors:
      - Testing only infrastructure and forgetting DNS, credentials or third-party allowlists.

  - external_key: technical.sre.backup_restore_confidence
    competency_key: system_design
    topic: Confidence that backups restore
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you actually know your backups will work when you need them, and how do recovery point and
      recovery time objectives shape the backup design?
    expected_concepts:
      - regular automated restore tests, not just backup success
      - verifying data integrity after restore
      - recovery point objective drives backup frequency or continuous replication
      - recovery time objective drives restore method and rehearsal
      - backups isolated from the primary account against deletion or ransomware
    rubric:
      excellent: Describes routine automated restore tests with integrity checks, maps RPO and RTO to concrete design choices, and covers isolation of backups from the main environment.
      good: Tests restores periodically and understands RPO and RTO.
      weak: Considers a successful backup job as proof that recovery works.
    followups:
      - How long would a full restore of your largest database take?
      - How do you protect backups from an attacker with admin access?
    common_errors:
      - Never timing a full restore, so the real recovery time is unknown.

  - external_key: technical.sre.batch_noisy_neighbour
    competency_key: kubernetes
    topic: Batch jobs hurting latency-sensitive pods
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Latency spikes on some of your API pods line up with batch jobs running on the same nodes. How would
      you confirm that and fix it?
    expected_concepts:
      - correlate spikes with node placement and batch schedules
      - CPU throttling, memory pressure and disk or network contention
      - requests and limits, and quality-of-service classes
      - separate node pools, taints and affinity for batch work
      - priority classes and scheduling batch work off-peak
    rubric:
      excellent: Proves the correlation with node-level data, identifies the contended resource, and fixes it with resource settings, isolation through node pools or taints, and scheduling policy.
      good: Separates batch jobs from API pods after confirming the correlation.
      weak: Scales up the API without investigating.
    followups:
      - How would CPU limits on the API pods themselves make things worse?
      - What if disk I/O is the contended resource?
    common_errors:
      - Setting tight CPU limits that cause throttling on latency-sensitive pods.

  - external_key: technical.sre.monitoring_the_monitoring
    competency_key: observability
    topic: Monitoring the monitoring system
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you make sure you'll find out when your monitoring and alerting system itself is broken?
    expected_concepts:
      - an always-firing heartbeat alert checked by an external service
      - monitoring ingestion lag and scrape failures
      - independent cross-monitoring between two systems
      - alerting on missing data, not just bad values
      - running monitoring outside the failure domain it watches
    rubric:
      excellent: Uses an external dead man's switch, monitors scrape and ingestion health, alerts on absent data, and places monitoring outside the failure domain it watches.
      good: Has an external heartbeat or second system checking the first.
      weak: Assumes silence means everything is fine.
    followups:
      - What happens to your alerts if the network to your monitoring cluster fails?
      - How do you alert on a metric that has stopped being reported?
    common_errors:
      - Running monitoring on the same cluster it is supposed to watch.

  # ------------------------------------------------------------------ hard
  - external_key: technical.sre.littles_law_sizing
    competency_key: system_design
    topic: Sizing pools with queueing reasoning
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Walk me through how you'd use queueing reasoning, such as Little's Law, to size a worker pool or a
      database connection pool for a service.
    expected_concepts:
      - concurrency equals arrival rate times time in system
      - using peak rate and realistic latency including tail
      - headroom for latency increases during incidents
      - downstream limits such as database connection capacity
      - validating the estimate with a load test
    rubric:
      excellent: Applies the formula correctly with a worked example, accounts for peak and tail latency, checks the result against downstream limits, and validates it empirically.
      good: Applies Little's Law to estimate concurrency with sensible inputs.
      weak: Picks pool sizes by guesswork or believes bigger is always better.
    followups:
      - What happens to the pool when the database latency doubles?
      - Why can a pool that's too large hurt the database?
    common_errors:
      - Using average latency and ignoring that slow periods need far more concurrency.

  - external_key: technical.sre.load_test_vs_production_gap
    competency_key: system_design
    topic: Load test and production disagree
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your load test reports a p99 of fifty milliseconds at a given rate, but production at the same rate
      shows eight hundred. What could explain the gap, and how would you find out?
    expected_concepts:
      - coordinated omission in closed-loop load generators
      - different data, cache state or traffic mix
      - background jobs, noisy neighbours or replication in production
      - client-side and network latency not measured in the test
      - comparing traces from both environments
    rubric:
      excellent: Explains coordinated omission and how to fix the generator, lists environmental and traffic-mix differences, and proposes comparing traces to pinpoint where time goes.
      good: Identifies differences in data and environment and how to compare them.
      weak: Assumes production is simply under-provisioned.
    followups:
      - How does an open-loop generator differ from a closed-loop one?
      - How would you make the test traffic more like production?
    common_errors:
      - Measuring latency only after the request is sent, missing time spent waiting to send it.

  - external_key: technical.sre.chaos_findings_to_action
    competency_key: distributed_systems
    topic: Making chaos findings change things
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your chaos experiments keep finding the same kinds of weaknesses, but teams rarely fix them. How would
      you change the programme so it actually improves reliability?
    expected_concepts:
      - tie findings to SLO risk and error budget impact
      - findings tracked as owned tickets with deadlines
      - reliability requirements or readiness reviews that include experiment results
      - automate recurring experiments as regression tests
      - report trends to leadership to secure time for fixes
    rubric:
      excellent: Connects findings to business risk, creates ownership and tracking, embeds experiments into regular pipelines or readiness checks, and uses leadership reporting to fund the fixes.
      good: Tracks findings as tickets and follows up with teams.
      weak: Runs more experiments without changing how results are acted on.
    followups:
      - How would you prioritise findings across many teams?
      - Which experiments would you run continuously rather than occasionally?
    common_errors:
      - Presenting findings as blame on teams, which reduces participation.

  - external_key: technical.sre.region_loss_capacity
    competency_key: system_design
    topic: Capacity to survive losing a region
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you plan capacity so the service survives losing an entire region, and how would you explain
      the cost of that to leadership?
    expected_concepts:
      - active-active versus active-passive capacity models
      - with N regions each must run at most (N minus 1) over N of capacity
      - stateful data replication and failover limits
      - warm-up time, quotas and scaling speed in surviving regions
      - quantifying cost against expected outage impact
    rubric:
      excellent: Calculates per-region headroom for different region counts, addresses data and scaling constraints, and frames the cost as a business trade-off with expected loss from outages.
      good: Explains that surviving regions need spare capacity and proposes a model.
      weak: Assumes autoscaling in other regions will absorb the load instantly.
    followups:
      - How does going from two regions to three change the spare capacity you need?
      - What would you do about cloud quotas in the surviving regions?
    common_errors:
      - Forgetting that cloud capacity may be scarce in other regions during a large outage.

  - external_key: technical.sre.automation_removed_fleet
    competency_key: problem_solving
    topic: Remediation automation causing an outage
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      During a network partition, your automation that replaces unhealthy nodes decided half the fleet was
      broken and removed it. How would you redesign that automation?
    expected_concepts:
      - distinguish node failure from monitoring or network failure
      - cap the fraction of the fleet that can be acted on at once
      - stop and escalate to humans when too many nodes look bad
      - check from multiple vantage points before acting
      - rate limiting and gradual action
    rubric:
      excellent: Explains why the automation misread a correlated failure, and adds vantage-point checks, global safety caps, rate limits and escalation to humans when conditions look abnormal.
      good: Adds a cap on how many nodes can be removed and alerts humans.
      weak: Disables automation entirely with no replacement plan.
    followups:
      - What percentage cap would you choose, and why?
      - How would you test the new safety checks?
    common_errors:
      - Trusting a single health signal that can fail for reasons unrelated to the node.

  - external_key: technical.sre.incident_metrics_pitfalls
    competency_key: incident_response
    topic: Incident metrics and their traps
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Which incident metrics, like time to detect or time to resolve, have you tracked, and how can those
      numbers mislead you?
    expected_concepts:
      - time to detect, mitigate and resolve as separate measures
      - small samples and heavy-tailed distributions make averages unreliable
      - incentives to downgrade or not declare incidents
      - inconsistent definitions of start and end times
      - pairing metrics with qualitative learning from reviews
    rubric:
      excellent: Distinguishes the stages being timed, explains statistical and incentive problems with incident metrics, and describes how to use them alongside qualitative review without gaming.
      good: Tracks detection and resolution times and notes some limitations.
      weak: Treats mean time to resolve as a target to drive down at any cost.
    followups:
      - What would you report to leadership instead of a single average?
      - How would you stop teams from avoiding declaring incidents to protect their numbers?
    common_errors:
      - Comparing average resolution times across quarters with only a handful of incidents.
