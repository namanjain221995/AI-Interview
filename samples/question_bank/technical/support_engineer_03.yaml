# Curated questions: technical support engineering (part 3 of 4) — web and API troubleshooting,
# browser evidence, SQL for support, integrations (SSO, webhooks, email), performance and data issues.
# `defaults` are merged into every question (question keys win). Medium is the default
# difficulty band; easy and hard questions override round_types.
version: 1
defaults:
  role_tags: [support_engineer]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.support_engineer.status_code_triage
    competency_key: technical_support
    topic: Using HTTP status codes to triage
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a customer reports an error from our API, how do you use the HTTP status code to decide where to look
      first? Give me a few examples.
    expected_concepts:
      - 4xx pointing to the request, such as bad input, auth or missing resources
      - 5xx pointing to the server or something upstream
      - 401 versus 403 as authentication versus authorisation
      - 429 as rate limiting and the retry headers
      - reading the response body for an error code and request id
    rubric:
      excellent: Groups codes by meaning, gives accurate examples such as 400, 401, 403, 404, 429, 500 and 503, and explains how each changes the next step and what to read in the response body.
      good: Knows the 4xx versus 5xx split and a few common codes but is vague on how they change the investigation.
      weak: Treats all error codes the same or confuses which side each class points to.
    followups:
      - What would you do with a 500 that includes a request id?
      - Why might a 404 be returned when the record does exist?
    common_errors:
      - Mixing up 401 and 403.

  - external_key: technical.support_engineer.browser_devtools_use
    competency_key: debugging
    topic: Browser developer tools for support
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you use a browser's developer tools to troubleshoot a page that isn't behaving for a customer?
    expected_concepts:
      - console errors from scripts
      - network tab for failed requests, status codes and timing
      - checking response bodies for error details and request ids
      - disabling cache and testing in a private window
      - storage such as cookies and local storage for stale state
    rubric:
      excellent: Uses the console and network tab together to find the failing script or request, reads response details and ids, and rules out cache and stored state methodically.
      good: Knows to check the console and network tab but does not interpret what they find in much depth.
      weak: Only suggests refreshing the page or trying another browser.
    followups:
      - How would you guide a non-technical customer to open the console and send you what you need?
      - What does a request marked as blocked or cancelled tell you?
    common_errors:
      - Ignoring the network tab and focusing only on console warnings that are unrelated.

  - external_key: technical.support_engineer.stale_page_after_fix
    competency_key: technical_support
    topic: Caching and stale content
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A customer still sees the old behaviour of a page even though we shipped a fix yesterday. What would you
      check, and what would you ask them to try?
    expected_concepts:
      - browser cache and a hard refresh or private window
      - CDN or proxy caches between the customer and us
      - confirming which version the page is actually loading
      - whether the fix has rolled out to the customer's region or tier
      - service workers keeping old assets
    rubric:
      excellent: Confirms which version is served and whether the rollout reached them, then works through browser, service worker, proxy and CDN caching in a sensible order.
      good: Suggests clearing the cache and checks the release, but does not consider CDN or proxy caching.
      weak: Assumes the fix did not work and reopens the bug without checking.
    followups:
      - How could you tell which build of the front end the browser loaded?
      - What would you do if a corporate proxy is caching the old file?
    common_errors:
      - Assuming the fix failed before checking whether the customer received it.

  - external_key: technical.support_engineer.sql_check_order_state
    competency_key: sql
    topic: Using SQL to confirm data state
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me how you'd use SQL to check whether a customer's order actually reached our database and what state
      it's in.
    expected_concepts:
      - filtering by customer or account and a time window
      - joining to related tables such as status history or payments
      - selecting only the columns needed
      - using read-only access or a replica
      - comparing what the database shows with what the customer sees
    rubric:
      excellent: Writes a sensible filtered query, joins to related status or history tables, uses read-only access, and compares the result with the customer's view to locate the problem.
      good: Writes a correct basic query but does not consider related tables or read-only access.
      weak: Cannot describe a query beyond select star from the table, or would run it without any filter.
    followups:
      - What would it mean if the order exists but its status never changed?
      - How would you find orders that were created twice?
    common_errors:
      - Querying a busy production table without a filter or limit.

  - external_key: technical.support_engineer.api_suddenly_unauthorised
    competency_key: technical_support
    topic: Sudden authentication failures
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A developer at a customer says their API calls suddenly started returning unauthorised errors. How would
      you help them work out why?
    expected_concepts:
      - expired, rotated or revoked keys or tokens
      - header format mistakes such as a missing Bearer prefix
      - using the wrong environment's credentials
      - checking our logs for the auth failure reason
      - scope or permission changes on the key
    rubric:
      excellent: Checks expiry, rotation, environment and header format, uses server-side logs for the exact failure reason, and guides the developer to fix it without exposing secrets.
      good: Suggests checking the key and regenerating it but does not use server-side evidence.
      weak: Asks the customer to paste their API key into the ticket.
    followups:
      - How would you confirm which key they are sending without seeing the secret?
      - What changes on our side could cause this for many customers at once?
    common_errors:
      - Asking customers to share full secrets in tickets or chat.

  - external_key: technical.support_engineer.har_file_analysis
    competency_key: technical_support
    topic: Collecting and reading HAR files
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When would you ask a customer for a HAR file from their browser, and what do you look for once you have it?
    expected_concepts:
      - when the problem is in browser requests and cannot be seen on our side
      - failed requests, status codes and redirect loops
      - timing breakdown for slow requests
      - request ids to match with server logs
      - HAR files containing cookies and tokens that must be handled carefully
    rubric:
      excellent: Explains when a HAR helps, what to look for in failures, redirects and timings, matches requests to server logs, and warns about the session data a HAR contains.
      good: Knows how to read failed requests in a HAR but does not mention its sensitive contents.
      weak: Does not know what a HAR file is or asks for one on every ticket without a reason.
    followups:
      - How would you ask a customer to capture a HAR file so it includes the problem?
      - What would you do with the file after the ticket is closed?
    common_errors:
      - Storing HAR files with live session tokens in a shared ticket indefinitely.

  - external_key: technical.support_engineer.reset_email_not_arriving
    competency_key: technical_support
    topic: Missing system emails
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A user says they never receive our password reset emails. How would you troubleshoot that?
    expected_concepts:
      - confirming the address on the account matches what the user expects
      - checking our email provider's logs for delivery, bounces or suppression
      - spam folders and corporate filtering or quarantine
      - domain-level issues such as SPF or DKIM failures
      - checking whether other users on the same domain are affected
    rubric:
      excellent: Checks the account address, our sending logs for delivered, bounced or suppressed status, the recipient domain's filtering, and whether the issue is domain-wide.
      good: Checks spam and the account address but not the sending logs or suppression lists.
      weak: Resends the email repeatedly or tells the user to check spam and stops there.
    followups:
      - What would you do if the address is on a bounce suppression list?
      - What would you ask the customer's IT team to check?
    common_errors:
      - Not checking whether the address is suppressed after an earlier bounce.

  # ---------------------------------------------------------------- medium
  - external_key: technical.support_engineer.sync_rate_limited
    competency_key: technical_support
    topic: Rate limiting
    difficulty: medium
    kind: scenario
    text: >-
      A customer's nightly sync started failing with rate limit errors after they added more users. How would you
      explain what's happening and help them fix it?
    expected_concepts:
      - what our limits are and how they are scoped, such as per key or per account
      - retry-after and rate limit headers
      - backoff with jitter and retrying only the failed calls
      - batching or bulk endpoints and incremental sync
      - spreading load over time or requesting a limit increase when justified
    rubric:
      excellent: Explains the limit and its scope, points to the response headers, and helps redesign the job with backoff, batching and incremental changes, raising limits only as a justified last step.
      good: Explains rate limiting and suggests backoff but does not address the job's design.
      weak: Simply asks engineering to raise the limit.
    followups:
      - How would you explain backoff with jitter to a developer who has not heard of it?
      - When would you support raising their limit?
    common_errors:
      - Suggesting immediate retries, which make the throttling worse.

  - external_key: technical.support_engineer.webhooks_not_received
    competency_key: technical_support
    topic: Webhook delivery problems
    difficulty: medium
    kind: scenario
    text: >-
      A customer says our webhooks stopped reaching their system. How would you work out which side the problem
      is on?
    expected_concepts:
      - our delivery logs with response codes, errors and retries
      - whether the endpoint was disabled after repeated failures
      - their endpoint's TLS, DNS and firewall allow list for our sending addresses
      - signature verification failures after a secret rotation
      - slow responses causing our timeouts
    rubric:
      excellent: Starts with our delivery logs, reads the response codes or connection errors to decide the side, and checks disabling, allow lists, signature secrets and timeouts as likely causes.
      good: Checks our delivery logs and asks the customer to verify their endpoint, but misses common causes like signature or timeout failures.
      weak: Asks the customer to check their server without looking at our delivery records.
    followups:
      - How would you help them replay the events they missed?
      - What would a pattern of timeouts in our logs suggest about their handler?
    common_errors:
      - Not checking whether we automatically disabled the endpoint.

  - external_key: technical.support_engineer.dashboard_slow_complaint
    competency_key: debugging
    topic: Turning a slowness complaint into a measurement
    difficulty: medium
    kind: scenario
    text: >-
      A customer says a dashboard takes forever to load. How would you turn that vague complaint into something
      measurable and find the cause?
    expected_concepts:
      - asking for which page, filters, time and how long it actually takes
      - measuring with browser timings or a HAR file
      - server-side timings for the slowest requests
      - data volume or date range driving query cost
      - comparing with a smaller account or a narrower filter
    rubric:
      excellent: Defines the slowness precisely, measures it on both the client and server, identifies the slowest request, and ties it to a cause such as data volume or filter choice.
      good: Measures load time and checks server logs but does not isolate the specific slow request.
      weak: Tells the customer their internet connection is slow or escalates as a general performance bug.
    followups:
      - What would you do if one API call accounts for nearly all the time?
      - How would you set expectations while engineering investigates?
    common_errors:
      - Escalating without any measurements, so engineering has to start from scratch.

  - external_key: technical.support_engineer.safe_production_queries
    competency_key: sql
    topic: Safe SQL habits on production data
    difficulty: medium
    kind: technical
    text: >-
      When you run SQL against a production database to investigate a ticket, what habits do you follow to make
      sure you don't cause harm?
    expected_concepts:
      - read-only accounts or replicas
      - limits and selective filters on indexed columns
      - avoiding long-running queries and locks during busy hours
      - never changing data without an approved, reviewed process
      - minimising and protecting personal data in results
    rubric:
      excellent: Describes read-only access, careful filtering, awareness of query cost and locking, a strict change process for data fixes, and care with personal data in results.
      good: Uses read-only access and limits but does not think about query cost or data protection.
      weak: Runs ad hoc updates in production or does not see any risk in querying it.
    followups:
      - How would you tell whether a query will be expensive before running it?
      - What process would you follow if a data fix is truly needed?
    common_errors:
      - Running an update without a where clause or a transaction.

  - external_key: technical.support_engineer.invoice_total_mismatch
    competency_key: sql
    topic: Finding where numbers diverge
    difficulty: medium
    kind: scenario
    text: >-
      A customer says their invoice total doesn't match the sum of their line items. How would you use queries to
      find where the numbers diverge?
    expected_concepts:
      - summing line items with group by and comparing to the stored total
      - rounding and currency precision differences
      - discounts, taxes or credits applied at the invoice level
      - soft-deleted or duplicated line items
      - narrowing to the first invoice where the mismatch appears
    rubric:
      excellent: Writes comparison queries that isolate mismatched invoices, checks rounding, invoice-level adjustments and deleted or duplicated lines, and narrows to when the mismatch began.
      good: Sums line items and compares totals correctly but considers only one or two causes.
      weak: Recalculates by hand on one invoice and cannot generalise.
    followups:
      - How would you find every invoice affected, not just this one?
      - What would you include when escalating this to engineering?
    common_errors:
      - Ignoring rows that are soft-deleted but still counted in one of the totals.

  - external_key: technical.support_engineer.sso_partial_login_failure
    competency_key: technical_support
    topic: Single sign-on problems
    difficulty: medium
    kind: scenario
    text: >-
      After a customer switched on single sign-on, some of their users can't log in while others can. How would
      you investigate?
    expected_concepts:
      - comparing working and failing users' attributes and group assignments
      - mismatched identifiers such as email case or a changed username
      - users not assigned to the app in the identity provider
      - reading the SAML or OIDC response for the claims sent
      - existing local accounts that need linking
    rubric:
      excellent: Compares working and failing users, inspects the identity provider's assertion or claims, and checks assignment, identifier mismatches and account linking.
      good: Checks identity provider assignment and our logs but does not inspect the assertion.
      weak: Asks the customer to turn single sign-on off and back on.
    followups:
      - How would you safely look at the contents of a SAML response?
      - What would you check if the failures started after users changed their email addresses?
    common_errors:
      - Not comparing a working user with a failing one.

  - external_key: technical.support_engineer.cors_error_explained
    competency_key: debugging
    topic: Cross-origin errors
    difficulty: medium
    kind: technical
    text: >-
      A customer's web app calling our API fails in the browser with a CORS error, but the same call works from a
      command-line client. Explain what's going on and how you'd help them.
    expected_concepts:
      - browsers enforce cross-origin rules while command-line clients do not
      - preflight OPTIONS requests for certain methods and headers
      - allowed origins configured on our side
      - an error response missing CORS headers showing up as a CORS failure
      - whether calling the API from the browser is a supported pattern at all
    rubric:
      excellent: Explains that the browser enforces the policy, checks the preflight and allowed origins, notes that an underlying error can surface as a CORS failure, and considers whether a server-side call is the right design.
      good: Explains the browser enforcement and suggests adding their origin, but does not consider preflight or masked errors.
      weak: Thinks CORS is a server bug or suggests disabling browser security.
    followups:
      - Why might a 500 error appear to the browser as a CORS problem?
      - When would you advise them not to call our API from the browser at all?
    common_errors:
      - Telling the customer to use a browser extension that disables CORS.

  - external_key: technical.support_engineer.large_import_timeout
    competency_key: technical_support
    topic: Large payload timeouts
    difficulty: medium
    kind: scenario
    text: >-
      Small imports work fine, but a customer's large CSV import times out every time. How would you troubleshoot
      it, and what would you tell them in the meantime?
    expected_concepts:
      - which layer times out, such as browser, proxy, load balancer or application
      - file size limits and documented import limits
      - malformed rows or encoding problems in large files
      - splitting the file or using a bulk API as a workaround
      - escalating with the file characteristics and timing
    rubric:
      excellent: Identifies which layer times out, checks limits and file content issues, gives a practical workaround like splitting or a bulk endpoint, and escalates with precise details.
      good: Suggests splitting the file and checks size limits but does not find which layer is timing out.
      weak: Asks the customer to keep retrying or says large files are not supported without checking.
    followups:
      - How would you tell a proxy timeout from an application timeout?
      - What if a particular row is the real cause?
    common_errors:
      - Assuming size is the only problem when the file has bad encoding partway through.

  - external_key: technical.support_engineer.duplicate_order_created
    competency_key: technical_support
    topic: Duplicate records from retries
    difficulty: medium
    kind: scenario
    text: >-
      A customer says one click created two identical orders. How would you investigate what happened using logs
      and data?
    expected_concepts:
      - finding both records and their creation times and request ids
      - double submits from the user interface or client retries after timeouts
      - idempotency keys and whether the client sent them
      - checking whether other customers show the same pattern
      - fixing the duplicate through the proper process and reporting the bug
    rubric:
      excellent: Uses timestamps and request ids to tell double submission from retries, checks idempotency handling, looks for a wider pattern, and resolves the duplicate through a controlled process.
      good: Finds both records and suspects a retry but does not confirm it or check for a wider pattern.
      weak: Deletes one record and closes the ticket.
    followups:
      - What evidence would show it was a client retry rather than a double click?
      - What would you recommend to the customer's developers if they call our API directly?
    common_errors:
      - Removing the duplicate without investigating, so it keeps happening.

  - external_key: technical.support_engineer.crash_on_one_device_model
    competency_key: debugging
    topic: Device-specific mobile crashes
    difficulty: medium
    kind: scenario
    text: >-
      Our mobile app crashes only on one older phone model. How would you gather enough information to get it
      reproduced and fixed?
    expected_concepts:
      - OS version, app version and device model
      - crash reports from the crash reporting tool and their stack traces
      - exact steps or screen where it crashes
      - device-specific factors such as memory, screen size or OS features
      - testing on a matching device or emulator image
    rubric:
      excellent: Pulls crash reports and stack traces, gathers device, OS and app versions plus exact steps, and arranges a matching device or emulator to reproduce before escalating.
      good: Gathers device and version details and checks crash reports but lacks a plan to reproduce.
      weak: Tells the customer the device is old and unsupported without checking the support policy.
    followups:
      - What would you do if no crash reports arrive from that device?
      - How would you tell how many users this affects?
    common_errors:
      - Not checking the crash reporting tool before asking the customer for details.

  - external_key: technical.support_engineer.report_missing_customers
    competency_key: sql
    topic: Joins dropping rows
    difficulty: medium
    kind: technical
    text: >-
      You're investigating why some customers are missing from a report and you suspect the query behind it. How
      would you check whether the joins are dropping rows?
    expected_concepts:
      - inner joins removing rows without a match
      - using left joins and checking for nulls to find unmatched rows
      - counting rows at each step of the query
      - filters in the where clause turning a left join back into an inner join
      - checking a specific missing customer against each table
    rubric:
      excellent: Counts rows step by step, uses left joins with null checks to find unmatched records, and knows how a where filter can undo a left join, confirming with a specific missing customer.
      good: Understands inner versus left joins and finds unmatched rows but misses the where-clause trap.
      weak: Cannot explain how a join would drop rows.
    followups:
      - How would you show the report owner which customers are missing and why?
      - What could cause a join to duplicate rows instead?
    common_errors:
      - Putting a filter on the right-hand table in the where clause and silently losing rows.

  - external_key: technical.support_engineer.suspected_provider_outage
    competency_key: technical_support
    topic: Third-party dependency failures
    difficulty: medium
    kind: scenario
    text: >-
      Several customers report failures, and you suspect a third-party provider we depend on is having problems.
      How would you confirm that, and what would you tell customers?
    expected_concepts:
      - our own error logs and metrics pointing to the dependency
      - the provider's status page and support channels
      - checking whether all affected tickets share the dependency
      - escalating to our incident process and linking tickets
      - customer updates that are factual and avoid blaming
    rubric:
      excellent: Confirms with our own evidence and the provider's status, links related tickets, triggers the incident process, and sends factual updates with next steps and timing.
      good: Checks the provider's status and informs customers but does not use our own evidence or incident process.
      weak: Tells customers it is the provider's fault and offers nothing further.
    followups:
      - What would you do if the provider's status page says everything is fine?
      - How much detail about the provider would you share with customers?
    common_errors:
      - Relying only on the provider's status page, which often lags behind real problems.

  # ------------------------------------------------------------------ hard
  - external_key: technical.support_engineer.migration_count_mismatch
    competency_key: sql
    topic: Reconciling migrated data
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After we migrated a customer's data from their old system, they say the record counts don't match. How
      would you reconcile it?
    expected_concepts:
      - agreeing on exactly what is being counted on both sides
      - comparing by key to list missing and extra records rather than totals
      - rejected rows from validation or mapping errors
      - duplicates merged or split during transformation
      - documenting the reconciliation for the customer's sign-off
    rubric:
      excellent: Defines the comparison precisely, reconciles record by record using keys, categorises differences such as rejects, merges and filters, and produces clear documentation the customer can verify.
      good: Compares totals by category and finds some causes but does not reconcile at the record level.
      weak: Re-runs the migration hoping the counts match.
    followups:
      - How would you handle records that were intentionally excluded?
      - How would you present the result to a customer who no longer trusts the migration?
    common_errors:
      - Comparing totals only, where missing and extra records cancel each other out.

  - external_key: technical.support_engineer.gradual_slowdown_onprem
    competency_key: debugging
    topic: Gradual degradation in a customer deployment
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A customer's self-hosted installation of our server gets slower over a few days until they restart it. How
      would you gather evidence to get this fixed, given you can't attach a debugger in their environment?
    expected_concepts:
      - tracking memory, threads, connections and descriptors over time
      - heap or thread dumps at intervals to compare growth
      - correlating with workload patterns or specific features in use
      - checking whether other customers on the same version see it
      - a safe scheduled restart as an interim workaround
    rubric:
      excellent: Plans time-series collection and periodic dumps to show what grows, ties it to workload or features, checks other deployments, and agrees an interim workaround while engineering fixes the leak.
      good: Collects memory metrics and a dump but only at one point in time.
      weak: Recommends a nightly restart as the permanent solution.
    followups:
      - How would you get dumps safely without causing an outage?
      - What would you need to share with engineering to make the evidence useful?
    common_errors:
      - Taking a single snapshot, which cannot show what is growing.

  - external_key: technical.support_engineer.one_tenant_slow
    competency_key: technical_support
    topic: Performance problems for one tenant
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      One large customer is seeing slow responses on our multi-tenant service while every other tenant is fine.
      How would you investigate?
    expected_concepts:
      - their data volume and usage patterns compared with other tenants
      - specific endpoints or queries that are slow for them
      - tenant-specific configuration, features or integrations
      - noisy neighbours or shard and partition placement
      - working with engineering on query plans or capacity
    rubric:
      excellent: Compares the tenant's data and usage against others, finds the specific slow operations, and considers configuration, placement and scaling limits, bringing engineering clear evidence.
      good: Identifies data volume as a likely factor and finds slow endpoints but does not consider placement or configuration.
      weak: Asks the customer to use the product less or escalates with no data.
    followups:
      - How would you tell whether their own usage is causing it or a neighbour's?
      - What would you say to the customer while the investigation runs?
    common_errors:
      - Assuming the whole platform is fine because averages look normal.

  - external_key: technical.support_engineer.personal_data_in_diagnostics
    competency_key: technical_support
    topic: Handling personal data in diagnostics
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Customers often send logs, screenshots and database extracts that contain personal data. How do you handle
      that safely while still getting what you need to solve the problem?
    expected_concepts:
      - asking only for the minimum data needed
      - masking or redacting before sharing, ideally with tooling
      - approved storage and access controls rather than email or chat
      - retention and deletion once the ticket is resolved
      - handling accidental oversharing such as exposed credentials
    rubric:
      excellent: Applies data minimisation, provides redaction tooling or guidance, uses approved storage with access control and retention rules, and has a clear process when secrets or personal data are shared by accident.
      good: Knows to avoid unnecessary personal data and use secure storage but has no process for retention or accidental exposure.
      weak: Collects whatever the customer sends and stores it in tickets or chat indefinitely.
    followups:
      - What would you do if a customer pastes a live password into a ticket?
      - How would you redact logs without losing the details you need?
    common_errors:
      - Forwarding unredacted customer data to engineering channels.

  - external_key: technical.support_engineer.pagination_missing_records
    competency_key: debugging
    topic: Inconsistent pagination
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A customer's integration pages through our API to export all their records, and each run ends up with a few
      missing or duplicated items. How would you investigate?
    expected_concepts:
      - offset pagination shifting when records are added or deleted mid-export
      - ordering by a non-unique or unstable field
      - cursor-based pagination as the recommended approach
      - comparing exported ids against a known full set
      - checking the customer's loop for off-by-one or early termination
    rubric:
      excellent: Explains how offset paging plus concurrent changes or unstable ordering causes gaps and duplicates, proves it by comparing ids, and recommends cursor pagination or stable ordering.
      good: Suspects data changing during the export but does not mention ordering or how to prove it.
      weak: Assumes the customer's code is wrong without investigating our API behaviour.
    followups:
      - How would you show the customer exactly which records went missing?
      - What would you ask engineering to document about our pagination?
    common_errors:
      - Not considering that the data changes while the export is running.

  - external_key: technical.support_engineer.values_flip_back_on_refresh
    competency_key: debugging
    topic: Stale reads and replication lag
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Users say they save a change, refresh and see the old value, then refresh again and the new one is back.
      What could cause that, and how would you prove it?
    expected_concepts:
      - read replicas lagging behind the primary
      - several caches or servers serving different versions
      - load balancing across nodes with inconsistent state
      - capturing which server or replica answered each request
      - timing between the write and the stale read
    rubric:
      excellent: Proposes replication lag and inconsistent caches as candidates, proves it by capturing which node answered each request and measuring timing, and gives engineering precise evidence.
      good: Suspects caching or replication but has a weak plan to prove which.
      weak: Tells users to clear their cache or treats it as a browser problem.
    followups:
      - What headers or logs would show you which server answered?
      - How would you explain eventual consistency to the customer?
    common_errors:
      - Blaming the browser cache without checking server-side behaviour.
