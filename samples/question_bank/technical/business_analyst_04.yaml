# Curated questions: business analysis (part 4 of 4).
# User acceptance testing, go-live readiness, traceability and change control, stakeholder alignment,
# vendor evaluation, privacy requirements and benefits realisation.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; medium also in deep_technical; hard in deep_technical
# and combined.
version: 1
defaults:
  role_tags: [business_analyst]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.business_analyst.uat_scenario_design
    competency_key: testing
    topic: Designing UAT scenarios
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you put together user acceptance test scenarios for a new feature, and how do they differ
      from the test cases the QA team writes?
    expected_concepts:
      - scenarios based on real business tasks end to end
      - derived from acceptance criteria and business processes
      - realistic data and roles used by actual users
      - focus on fitness for purpose rather than every technical path
      - expected results the business can judge
    rubric:
      excellent: Builds scenarios from real business workflows and acceptance criteria, uses realistic data and roles, and clearly explains how UAT confirms business fitness while QA verifies the specification in depth.
      good: Writes business-focused scenarios linked to requirements and explains the difference from QA testing.
      weak: Reuses QA test scripts or cannot explain what UAT is for.
    followups:
      - Who writes the scenarios, you or the business users?
      - How many scenarios would a typical feature need?
    common_errors:
      - Writing UAT scripts so detailed that users just follow clicks and never judge whether the process works.

  - external_key: technical.business_analyst.uat_entry_exit_criteria
    competency_key: testing
    topic: UAT entry and exit criteria
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What conditions would you want in place before starting user acceptance testing, and what would
      need to be true before you'd call it finished?
    expected_concepts:
      - system testing completed with no open critical defects
      - stable environment with realistic test data and access for testers
      - scenarios prepared and testers available and briefed
      - exit based on scenario pass rate and no open high-severity defects
      - formal sign-off by the business owner
    rubric:
      excellent: Gives specific entry and exit criteria, explains why each matters and describes how they handled pressure to start or finish early.
      good: Lists reasonable entry and exit criteria including sign-off.
      weak: Starts UAT whenever the build is available and ends it when time runs out.
    followups:
      - What happens if the environment isn't ready on the planned start date?
      - Who decides whether an open defect blocks exit?
    common_errors:
      - Starting UAT on an unstable build, so users lose trust in the system before it's ready.

  - external_key: technical.business_analyst.uat_defect_or_change
    competency_key: requirements_analysis
    topic: Telling a defect from a change request in UAT
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      During user acceptance testing, a user logs a defect saying the report should also show the
      customer's phone number. It was never in the requirements. How would you handle that?
    expected_concepts:
      - checking the agreed requirements and acceptance criteria
      - classifying it as a change request rather than a defect
      - understanding why the user needs it
      - assessing impact and priority with the product owner
      - explaining the outcome to the user and logging it properly
    rubric:
      excellent: Checks against the baseline, reclassifies it as a change without dismissing the need, assesses its importance with the owner and keeps the user informed.
      good: Identifies it as a change request and routes it through the right process.
      weak: Adds it straight into the current release or rejects it without discussion.
    followups:
      - What if the user insists the system is unusable without it?
      - How would you prevent a flood of these during UAT?
    common_errors:
      - Treating every UAT request as a defect, which inflates defect counts and hides scope growth.

  - external_key: technical.business_analyst.stakeholder_analysis
    competency_key: stakeholder_management
    topic: Identifying and analysing stakeholders
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      At the start of a project, how do you work out who your stakeholders are and how to engage each of
      them?
    expected_concepts:
      - identifying groups affected by or influencing the change
      - assessing influence and interest, for example with a grid
      - noting each group's concerns and what success means to them
      - tailoring engagement and communication to each group
      - revisiting the analysis as the project progresses
    rubric:
      excellent: Describes a structured analysis with a real example, including easily missed groups such as support or compliance, and how engagement differed by group.
      good: Uses a stakeholder map or grid and adapts communication.
      weak: Only lists the sponsor and the immediate users.
    followups:
      - Which stakeholder group have you missed in the past, and what happened?
      - How do you engage someone with high influence but little interest?
    common_errors:
      - Forgetting operational teams who will run the process after go-live.

  - external_key: technical.business_analyst.traceability_purpose
    competency_key: requirements_analysis
    topic: Requirements traceability
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How have you traced requirements through to design, build and testing on a project, and what did
      that traceability actually help you do?
    expected_concepts:
      - links from business objectives to requirements, stories and tests
      - checking every requirement is covered by tests
      - impact analysis when a requirement changes
      - evidence for audit or compliance
      - keeping it lightweight using tools like issue trackers
    rubric:
      excellent: Describes a practical approach with tools they used, gives a concrete example where traceability helped with impact analysis or coverage, and keeps the effort proportionate.
      good: Explains traceability and its main benefits with some practical detail.
      weak: Describes a matrix that was filled in once and never used.
    followups:
      - How much traceability would you keep in a fast-moving agile team?
      - When did traceability help you catch something?
    common_errors:
      - Maintaining a large matrix by hand that falls out of date within weeks.

  - external_key: technical.business_analyst.disengaged_stakeholder
    competency_key: stakeholder_management
    topic: Re-engaging a disengaged stakeholder
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A department head whose team will use the new system keeps skipping your review sessions and sends
      a junior person with no authority. What would you do?
    expected_concepts:
      - understanding why they are disengaged
      - explaining what's at stake for their team in their terms
      - adjusting format such as shorter or one-to-one sessions
      - agreeing who can make decisions on their behalf
      - escalating through the sponsor if decisions stall
    rubric:
      excellent: Seeks to understand the reason, reframes the value for their team, adapts the engagement format, secures a delegated decision maker and escalates only if needed.
      good: Reaches out directly and adapts how they engage.
      weak: Escalates immediately or carries on without the department's input.
    followups:
      - What would you say in your first conversation with them?
      - How would you record decisions made by the delegate?
    common_errors:
      - Taking the junior attendee's agreement as the department's sign-off.

  - external_key: technical.business_analyst.new_domain_ramp_up
    competency_key: requirements_analysis
    topic: Learning an unfamiliar business domain quickly
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You join a project in a business area you've never worked in, say trade finance, and requirements
      sessions start next week. How would you get up to speed fast enough to be useful?
    expected_concepts:
      - reading existing documentation, process maps and glossaries
      - building a glossary of domain terms
      - looking at the current system and real transactions
      - short sessions with experts focused on core concepts
      - being open about what you don't know and asking good questions
    rubric:
      excellent: Describes a concrete, prioritised ramp-up plan using documents, systems, data and experts, and explains how they'd use not knowing the domain to ask useful clarifying questions.
      good: Describes reading up and talking to experts with a sensible plan.
      weak: Expects to learn everything in the sessions or pretends to know the domain.
    followups:
      - Tell me about a domain you had to learn quickly. What worked best?
      - What would you put in your first-week glossary?
    common_errors:
      - Copying domain jargon into requirements without understanding what it means.

  # ---------------------------------------------------------------- medium
  - external_key: technical.business_analyst.uat_signoff_open_defects
    competency_key: stakeholder_management
    topic: Go or no-go with open UAT defects
    difficulty: medium
    kind: scenario
    text: >-
      It's the end of UAT, there are twelve open defects, two of them moderate, and the business wants to
      go live on schedule. How would you help the team reach a sound go or no-go decision?
    expected_concepts:
      - assessing each defect's business impact and frequency
      - available workarounds and their cost
      - risk of delaying versus risk of releasing
      - clear plan and dates for fixing deferred defects
      - documented decision by the accountable business owner
    rubric:
      excellent: Leads a structured review of each defect's impact and workaround, frames the risks of both choices and secures an informed, documented decision with a fix plan.
      good: Reviews defects with the business and documents agreed workarounds.
      weak: Pushes for go-live regardless or blocks without analysing impact.
    followups:
      - How would you communicate the workarounds to end users?
      - What defect would make you strongly recommend delaying?
    common_errors:
      - Making the go-live decision on defect counts rather than business impact.

  - external_key: technical.business_analyst.uat_low_participation
    competency_key: stakeholder_management
    topic: Getting business users to take part in UAT
    difficulty: medium
    kind: scenario
    text: >-
      UAT is scheduled for two weeks, but the business testers are busy with their day jobs and only a
      handful of scenarios have been run after the first week. What would you do?
    expected_concepts:
      - understanding the blockers for testers
      - securing protected time through their managers or the sponsor
      - prioritising the most critical scenarios
      - making testing easier with guidance, data and support on hand
      - reporting progress and risk transparently
    rubric:
      excellent: Diagnoses the blockers, gets protected time agreed with managers, focuses on critical scenarios, removes friction for testers and reports the risk openly to the sponsor.
      good: Escalates for more tester time and prioritises key scenarios.
      weak: Runs the scenarios themselves and reports UAT as complete.
    followups:
      - How would you plan the next UAT so this doesn't recur?
      - What does a useful daily UAT status report contain?
    common_errors:
      - Having the project team execute UAT in place of business users, which defeats its purpose.

  - external_key: technical.business_analyst.uat_test_data_prep
    competency_key: testing
    topic: Preparing realistic UAT data
    difficulty: medium
    kind: technical
    text: >-
      What makes test data good enough for user acceptance testing, and how have you prepared it,
      particularly when production data contains personal information?
    expected_concepts:
      - data reflecting real variety, volumes and edge cases
      - anonymised or masked copies of production data
      - synthetic data for cases not present in production
      - data that supports end-to-end flows across systems
      - privacy rules and approvals for using any real data
    rubric:
      excellent: Explains what realistic data needs to cover, how they produced it safely with masking or synthetic data, and how they kept it consistent across connected systems.
      good: Recognises the need for realistic, masked data and how to get it.
      weak: Uses a handful of made-up records or copies production data without considering privacy.
    followups:
      - How would you test a scenario that depends on data from three systems?
      - Who approves the use of masked production data?
    common_errors:
      - Masking data in a way that breaks the business rules being tested.

  - external_key: technical.business_analyst.go_live_readiness
    competency_key: requirements_analysis
    topic: Business readiness for go-live
    difficulty: medium
    kind: technical
    text: >-
      Beyond the system working, what do you check to make sure the business is actually ready for a
      go-live?
    expected_concepts:
      - trained users and updated procedures
      - data migrated and verified
      - support model and escalation routes in place
      - communications to customers or affected teams
      - rollback or contingency plan and early-life support
    rubric:
      excellent: Covers people, process, data, support and contingency, with a readiness checklist and an example of a gap they caught before go-live.
      good: Covers training, support and communications.
      weak: Considers only technical deployment.
    followups:
      - Who should own the business readiness checklist?
      - What would you monitor in the first week after go-live?
    common_errors:
      - Training users weeks before go-live so they have forgotten it by launch day.

  - external_key: technical.business_analyst.exec_bypasses_backlog
    competency_key: stakeholder_management
    topic: Handling requests that bypass the agreed process
    difficulty: medium
    kind: scenario
    text: >-
      A senior executive keeps going directly to developers with feature requests, and they start working
      on them, disrupting sprint commitments. As the analyst, how would you handle it?
    expected_concepts:
      - understanding what the executive needs and why they bypass the process
      - working with the product owner to channel requests properly
      - making the impact on committed work visible
      - giving the executive a fast, credible path for urgent needs
      - supporting the developers to redirect requests
    rubric:
      excellent: Addresses the root cause with the product owner, gives the executive a responsive route that respects priorities, makes the cost visible and protects the team without confrontation.
      good: Involves the product owner and explains the impact to the executive.
      weak: Lets it continue or confronts the executive publicly.
    followups:
      - How would you raise this with the executive directly?
      - What would you tell the developers in the meantime?
    common_errors:
      - Blaming the developers for doing what a senior person asked.

  - external_key: technical.business_analyst.late_change_after_signoff
    competency_key: requirements_analysis
    topic: Change requests after sign-off
    difficulty: medium
    kind: scenario
    text: >-
      Requirements were signed off two months ago. Now a new compliance officer says a key workflow must
      include an extra approval step. Development is half done. What would you do?
    expected_concepts:
      - confirming the regulatory basis of the request
      - impact analysis across requirements, design, build and tests
      - options such as phasing or interim manual controls
      - formal change request and decision by the sponsor
      - updating artefacts and communicating to the team
    rubric:
      excellent: Validates the compliance basis, analyses impact across artefacts using traceability, presents options with trade-offs and gets a formal decision, then updates everything consistently.
      good: Raises a change request with impact analysis.
      weak: Refuses because requirements are signed off, or adds it informally.
    followups:
      - How would traceability help you here?
      - What would you do if the compliance officer and sponsor disagree?
    common_errors:
      - Updating the stories but forgetting the test cases and training material.

  - external_key: technical.business_analyst.developer_pushback
    competency_key: collaboration
    topic: When developers challenge a requirement
    difficulty: medium
    kind: scenario
    text: >-
      During refinement, the lead developer says a requirement you've written is far too complex and
      proposes a much simpler approach that covers most but not all of the business need. How would you
      handle that?
    expected_concepts:
      - understanding the technical concern and cost difference
      - checking which part of the need would be lost and how much it matters
      - taking options and trade-offs back to the business owner
      - looking for a phased approach
      - recording the decision and reasoning
    rubric:
      excellent: Treats the challenge as useful input, quantifies what the simpler option gives up, lets the business owner decide with clear trade-offs and documents the outcome.
      good: Discusses the options and checks with the business.
      weak: Defends the requirement without considering the alternative or accepts it without consulting the business.
    followups:
      - When have you changed a requirement because of developer feedback?
      - How would you explain the trade-off to a non-technical owner?
    common_errors:
      - Agreeing the simpler approach with developers without telling the business what changed.

  - external_key: technical.business_analyst.vendor_evaluation
    competency_key: requirements_analysis
    topic: Evaluating vendors against requirements
    difficulty: medium
    kind: technical
    text: >-
      If you were asked to help select a vendor for a new CRM, how would you structure the evaluation so
      the decision is based on requirements and not on the best sales demo?
    expected_concepts:
      - prioritised requirements and weighted scoring criteria agreed in advance
      - scripted demos using the company's own scenarios
      - non-functional, integration, cost and vendor viability criteria
      - reference checks and proofs of concept for key risks
      - documented scoring and decision rationale
    rubric:
      excellent: Defines weighted criteria before seeing vendors, uses scripted scenario-based demos and proofs of concept, includes total cost and viability, and records the rationale.
      good: Uses a scoring matrix against requirements and includes cost.
      weak: Relies on open vendor demos and general impressions.
    followups:
      - How would you stop the scoring from being bent towards a favourite?
      - What would you test in a proof of concept?
    common_errors:
      - Letting vendors run their own demo scripts, which only show their strengths.

  - external_key: technical.business_analyst.privacy_requirements
    competency_key: requirements_analysis
    topic: Capturing data privacy requirements
    difficulty: medium
    kind: technical
    text: >-
      When a new feature collects or uses customers' personal data, what requirements would you make sure
      are captured, and who would you involve?
    expected_concepts:
      - lawful basis and purpose for each data item
      - data minimisation and retention periods
      - customer rights such as access, correction and deletion
      - access controls and audit logging
      - involving the privacy or legal team and any impact assessment
    rubric:
      excellent: Covers purpose, minimisation, retention, data subject rights and access controls, explains how these become testable requirements and involves the privacy team early.
      good: Captures retention, consent or access controls and involves legal or privacy staff.
      weak: Leaves privacy entirely to the legal team or only mentions encryption.
    followups:
      - How would you write a testable requirement for a deletion request?
      - What if the business wants to keep data indefinitely for analytics?
    common_errors:
      - Collecting extra personal fields "in case they're useful later".

  - external_key: technical.business_analyst.post_release_feedback
    competency_key: product_sense
    topic: Turning post-release feedback into backlog decisions
    difficulty: medium
    kind: scenario
    text: >-
      A month after release, you have support tickets, user comments and usage data about the new
      feature, much of it contradictory. How would you turn that into clear next steps for the backlog?
    expected_concepts:
      - grouping feedback into themes and counting frequency
      - checking themes against usage data and business goals
      - separating defects, usability issues and new requests
      - following up with users to understand the important themes
      - prioritising with the product owner and closing the loop with users
    rubric:
      excellent: Synthesises qualitative and quantitative sources into themes, weighs them against goals and frequency, distinguishes defect types and agrees priorities, then tells users what will change.
      good: Groups feedback into themes and prioritises them with the product owner.
      weak: Adds every comment to the backlog or reacts only to the loudest feedback.
    followups:
      - How would you treat a request from your largest customer that few others want?
      - How would you measure whether the changes helped?
    common_errors:
      - Treating the volume of complaints as the size of the problem without checking usage data.

  - external_key: technical.business_analyst.demo_reveals_mismatch
    competency_key: communication
    topic: Handling a mismatch revealed at a sprint review
    difficulty: medium
    kind: scenario
    text: >-
      At a sprint review, a stakeholder sees a feature that meets every acceptance criterion and says,
      "This isn't what we need at all." How would you handle the moment, and what would you do afterwards?
    expected_concepts:
      - staying curious and asking what specifically doesn't meet the need
      - separating a genuine misunderstanding from a changed need
      - agreeing next steps without committing the team on the spot
      - tracing back how the gap arose in elicitation or refinement
      - changing practice such as earlier demos or examples
    rubric:
      excellent: Draws out the specific gap without becoming defensive, distinguishes misunderstanding from new need, agrees a sensible next step with the product owner and fixes the upstream cause in how requirements are confirmed.
      good: Clarifies the gap and agrees follow-up actions with the product owner.
      weak: Argues that the criteria were signed off, or promises an immediate rebuild.
    followups:
      - What would you change so this surfaces mid-sprint instead of at the review?
      - How would you explain it to the developers who built it?
    common_errors:
      - Using the signed-off criteria to win the argument while the business need stays unmet.

  # ------------------------------------------------------------------ hard
  - external_key: technical.business_analyst.uat_strategy_programme
    competency_key: testing
    topic: UAT strategy for a large programme
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      For an ERP rollout affecting finance, procurement and inventory across several sites, how would
      you plan user acceptance testing so it gives a reliable signal without dragging on for months?
    expected_concepts:
      - risk-based prioritisation of business processes
      - end-to-end cross-functional scenarios as well as functional ones
      - test cycles aligned to builds and data migration rehearsals
      - representative testers from each site with clear roles
      - defect triage governance and progress reporting
    rubric:
      excellent: Designs a risk-based, multi-cycle strategy with end-to-end scenarios across functions, aligned with migration rehearsals, clear tester roles and governed triage and reporting.
      good: Plans cycles with business testers and prioritises critical processes.
      weak: Plans UAT as one long phase of every scenario at the end.
    followups:
      - How would you handle a site whose processes differ from the others?
      - What would you report weekly to the steering committee?
    common_errors:
      - Testing each module separately and never testing the end-to-end flows between them.

  - external_key: technical.business_analyst.benefits_realisation
    competency_key: product_sense
    topic: Measuring benefits after delivery
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Projects often promise benefits that nobody checks after go-live. How would you set up benefits
      tracking for a change you analysed, and what would you do if the benefits don't appear?
    expected_concepts:
      - measurable benefits with baselines and named owners
      - leading and lagging indicators and timing of measurement
      - separating the project's effect from other changes
      - regular review and reporting after go-live
      - investigating shortfalls and adjusting adoption or process
    rubric:
      excellent: Defines benefits with baselines, owners and timing, uses leading indicators, accounts for other influences, and describes a concrete response when benefits fall short.
      good: Sets measurable benefits and reviews them after go-live.
      weak: Considers the project done at go-live or measures nothing.
    followups:
      - What leading indicator would you use for a process automation benefit?
      - Who should be accountable for realising the benefit?
    common_errors:
      - Assigning benefits to the project team, who move on right after go-live.

  - external_key: technical.business_analyst.requirements_across_agile_teams
    competency_key: requirements_analysis
    topic: Keeping requirements coherent across several agile teams
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      When four agile teams are building parts of the same customer journey, how do you keep the
      requirements consistent and avoid gaps or overlaps between their backlogs?
    expected_concepts:
      - shared end-to-end journey or feature map above team backlogs
      - common glossary, business rules and data definitions
      - cross-team refinement and dependency mapping
      - clear ownership of each part of the journey and interfaces
      - integrated acceptance testing of the full journey
    rubric:
      excellent: Describes a shared journey view, common definitions, cross-team refinement and dependency management, clear ownership boundaries and end-to-end acceptance, with a real example of a gap caught this way.
      good: Proposes a shared view and regular cross-team coordination.
      weak: Leaves each team to define its own requirements with no shared view.
    followups:
      - How would you handle a business rule that all four teams need to implement?
      - Who arbitrates when two teams both think something is out of their scope?
    common_errors:
      - Each team defining the same business term slightly differently.

  - external_key: technical.business_analyst.failing_uat_near_deadline
    competency_key: stakeholder_management
    topic: Recovering a failing UAT close to launch
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Two weeks before a launch date that's been announced to customers, UAT is uncovering serious
      defects and users are losing faith in the system. What would you do as the lead analyst?
    expected_concepts:
      - rapid triage of defects by business impact and root cause
      - checking whether defects stem from unclear requirements
      - transparent risk assessment to the sponsor with options
      - options such as reduced scope launch, phased rollout or delay
      - rebuilding user trust with visible fixes and communication
    rubric:
      excellent: Triages by impact and cause, identifies whether requirements gaps are behind defects, gives the sponsor clear options with risks, and plans to restore user trust with visible progress.
      good: Prioritises defects and escalates with options to the sponsor.
      weak: Keeps pushing users to test without addressing the cause or hides the severity.
    followups:
      - How would you present a delay option to a sponsor who announced the date?
      - How would you tell whether the defects come from requirements or build?
    common_errors:
      - Presenting only a go or delay choice without middle options such as a phased launch.

  - external_key: technical.business_analyst.sponsor_vs_end_users
    competency_key: stakeholder_management
    topic: When the sponsor and end users want different things
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The sponsor wants a new field-service app to capture extensive data on every visit for reporting,
      but the engineers in the field say it will double their time per job and they'll find ways around
      it. How would you navigate this?
    expected_concepts:
      - understanding which data the sponsor really needs and why
      - quantifying the time cost and data quality risk of heavy input
      - options such as automatic capture, defaults or sampling
      - bringing evidence from prototypes or field trials
      - facilitating an agreed decision with both sides
    rubric:
      excellent: Gets to the decisions behind the sponsor's reporting needs, uses field trials or data to quantify the cost, designs options that capture what matters with minimal effort and facilitates an agreed outcome.
      good: Balances the two needs with sensible options and involves both sides.
      weak: Sides with the sponsor because they have authority, or with users without addressing the business need.
    followups:
      - How would you run a field trial to settle this?
      - Which data could be captured without the engineer typing anything?
    common_errors:
      - Ignoring that burdensome data entry produces poor-quality data the sponsor can't use anyway.

  - external_key: technical.business_analyst.vendor_build_not_to_spec
    competency_key: requirements_analysis
    topic: Vendor delivery that doesn't meet the business need
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      An external vendor delivers a module that passes the contractual specification, but users say it
      doesn't support how they work. The vendor says any change is a paid change request. How would you
      work through this?
    expected_concepts:
      - comparing delivery against the specification line by line
      - separating real specification defects from missed or unclear requirements
      - assessing business impact and options such as workarounds or prioritised changes
      - working with procurement or contract owners on the commercial side
      - lessons for how requirements are specified for vendors
    rubric:
      excellent: Separates vendor defects from requirement gaps objectively, quantifies impact, negotiates a pragmatic path with the contract owner and identifies how specifications should change in future.
      good: Reviews the specification, identifies what is the vendor's responsibility and proposes options.
      weak: Blames the vendor without evidence or accepts all costs without analysis.
    followups:
      - What evidence would you bring to the vendor discussion?
      - How would you write specifications differently next time?
    common_errors:
      - Not admitting where the specification itself was ambiguous, which weakens the negotiation.

  - external_key: technical.business_analyst.inherited_poor_requirements
    competency_key: requirements_analysis
    topic: Taking over a project with weak requirements
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You take over as analyst on a project that's already in build. The requirements are thin, the
      testers keep raising questions and the original analyst has left. What would your first few weeks
      look like?
    expected_concepts:
      - quickly assessing the state of requirements and open questions
      - prioritising gaps by what the team is building next
      - re-establishing relationships with key business owners
      - capturing decisions and assumptions as they are made
      - flagging delivery risk to the sponsor early
    rubric:
      excellent: Gives a prioritised plan that unblocks the team immediately while systematically closing the most important gaps, rebuilds stakeholder access and is open with the sponsor about risk.
      good: Reviews the existing artefacts, resolves open questions and works closely with the team.
      weak: Tries to rewrite all the requirements from scratch before helping the team.
    followups:
      - How would you decide which gaps to close first?
      - What would you tell the sponsor at the end of week one?
    common_errors:
      - Pausing development to redo the full requirements set, which stalls delivery.
