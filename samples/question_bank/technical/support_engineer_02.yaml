# Curated questions: technical support engineering (part 2 of 4) — Linux and networking for
# support: services, disk, memory, permissions, ports, DNS, proxies, TLS, captures, path problems.
# `defaults` are merged into every question (question keys win). Medium is the default
# difficulty band; easy and hard questions override round_types.
version: 1
defaults:
  role_tags: [support_engineer]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.support_engineer.agent_service_stopped
    competency_key: linux
    topic: Checking a service on a customer's Linux host
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A customer says our monitoring agent isn't sending anything from one of their Linux servers. What would
      you walk them through to check whether it's running, and why it might have stopped?
    expected_concepts:
      - systemctl status for state, exit code and recent log lines
      - journalctl for the service's logs around the time it stopped
      - checking whether it is enabled to start at boot
      - ps to confirm the process and the user it runs as
      - the agent's own log file and configuration check
    rubric:
      excellent: Gives a clear order of checks using systemctl status, journalctl, enablement at boot and the agent's own logs, and interprets exit codes or recent errors to explain why it stopped.
      good: Knows to check the service status and logs but does not interpret what the output means or check boot enablement.
      weak: Suggests reinstalling the agent or rebooting the server as the first step.
    followups:
      - What would an exit code or a failed state in systemctl tell you?
      - How would you check whether it can reach our servers once it is running?
    common_errors:
      - Restarting the service before reading why it stopped.

  - external_key: technical.support_engineer.write_failures_disk_check
    competency_key: linux
    topic: Disk space and inode exhaustion
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An application on a customer's Linux server suddenly can't write files. How would you check whether disk
      space is the problem, and what would you look at beyond plain free space?
    expected_concepts:
      - df to check usage per filesystem
      - df -i for inode exhaustion from many small files
      - du to find what is consuming space
      - deleted files still held open by a process
      - read-only remounts after filesystem errors
    rubric:
      excellent: Checks space and inodes on the right filesystem, finds the large consumers, and knows about deleted-but-open files and read-only remounts as less obvious causes.
      good: Uses df and du correctly but misses inode exhaustion or deleted files held open.
      weak: Only checks overall disk size or suggests deleting files at random.
    followups:
      - What would you recommend so this does not happen again?
      - How would you find a deleted file that is still using space?
    common_errors:
      - Checking the root filesystem when the application writes to a different mount.

  - external_key: technical.support_engineer.config_permission_denied
    competency_key: linux
    topic: File permissions on Linux
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Our service fails to start on a customer's Linux host because it gets permission denied reading its own
      configuration file. How would you troubleshoot that?
    expected_concepts:
      - which user the service runs as
      - file owner, group and mode bits
      - execute permission on every parent directory
      - security modules such as SELinux or AppArmor denying access
      - fixing with least privilege rather than making the file world-readable
    rubric:
      excellent: Checks the service user against owner, group and mode, checks parent directory permissions and security module denials, and fixes it with minimal permissions.
      good: Checks owner and mode bits and fixes them but does not consider parent directories or SELinux.
      weak: Recommends chmod 777 or running the service as root.
    followups:
      - How would you tell whether SELinux is the cause?
      - Why does the directory permission matter if the file itself is readable?
    common_errors:
      - Opening permissions far wider than needed to make the error go away.

  - external_key: technical.support_engineer.ping_works_connection_fails
    competency_key: networking
    topic: Reachability versus port connectivity
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If a customer can ping our server but their client still can't connect to it, what does that tell you,
      and what would you check next?
    expected_concepts:
      - ping uses ICMP and only shows basic reachability
      - testing the actual TCP port with tools such as nc, telnet or curl
      - firewalls allowing ICMP but blocking the application port
      - service not listening or listening on the wrong interface
      - proxy or TLS problems above the transport layer
    rubric:
      excellent: Explains that ping only proves ICMP reachability, tests the specific port, and separates firewall blocking, nothing listening and higher-layer failures based on the result.
      good: Knows to test the port directly but cannot interpret different results such as timeout versus connection refused.
      weak: Concludes the network is fine because ping works.
    followups:
      - What is the difference between a connection timing out and being refused?
      - What would you check if the port connects but the application still fails?
    common_errors:
      - Treating a successful ping as proof the application path works.

  - external_key: technical.support_engineer.site_down_for_one_customer
    competency_key: networking
    topic: Checking DNS from the customer's side
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A customer says our web app is down, but it loads fine for everyone else. How would you check whether DNS
      on their side is the cause?
    expected_concepts:
      - nslookup or dig from the customer's machine
      - comparing the answer to the expected public records
      - trying a public resolver to compare results
      - local overrides such as the hosts file or a corporate DNS view
      - cached stale records after a recent change
    rubric:
      excellent: Has the customer resolve the name, compares the result with known-good records and a public resolver, and checks local overrides and caching to pinpoint the cause.
      good: Uses nslookup to check resolution but does not compare resolvers or consider local overrides.
      weak: Skips DNS and asks the customer to reinstall their browser.
    followups:
      - What would it mean if their resolver returns a private IP address?
      - How would you get them working while their network team fixes it?
    common_errors:
      - Testing DNS from our own network instead of the customer's.

  - external_key: technical.support_engineer.service_start_logs
    competency_key: linux
    topic: Finding logs for a failed service start
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Where do you look for logs on a modern Linux system when a service fails to start, and how do you filter
      them down to what matters?
    expected_concepts:
      - journalctl filtered by unit
      - filtering by time with since and until or by current boot
      - application log files under directories like var log
      - following logs live while starting the service
      - kernel messages through dmesg for lower-level failures
    rubric:
      excellent: Uses journalctl with unit, time and boot filters, follows logs live while reproducing, and knows when to check application files or kernel messages.
      good: Knows journalctl and var log but uses few filters.
      weak: Does not know where logs live or only reads syslog from the top.
    followups:
      - How would you see logs from before the last reboot?
      - What would you send to engineering from these logs?
    common_errors:
      - Reading only the last line of output and missing the real error a few lines above.

  - external_key: technical.support_engineer.corporate_network_only_failure
    competency_key: networking
    topic: Proxies in customer networks
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Our desktop app works for a customer's staff at home but not from inside their office network. What would
      you suspect first, and how would you confirm it?
    expected_concepts:
      - outbound proxy that the app is not configured to use
      - firewall rules blocking required domains or ports
      - TLS inspection replacing certificates
      - comparing behaviour on the office network versus a hotspot
      - giving the network team a list of required hosts and ports
    rubric:
      excellent: Suspects proxy, firewall or TLS inspection, confirms by comparing networks and checking app logs for connection errors, and gives the customer's network team a precise list of endpoints and ports.
      good: Identifies a proxy or firewall as likely but has a vague plan to confirm it.
      weak: Treats it as an app bug and asks the customer to reinstall.
    followups:
      - How would the error look different for a proxy issue versus a blocked port?
      - What documentation would you want to have ready for network teams?
    common_errors:
      - Not asking whether the office uses a proxy at all.

  - external_key: technical.support_engineer.curl_api_connection
    competency_key: networking
    topic: Using curl to troubleshoot API access
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you use curl when troubleshooting a customer's connection to an API? Walk me through the options you
      reach for and what each one shows you.
    expected_concepts:
      - verbose output to see DNS, connection, TLS and headers
      - including response headers and status codes
      - sending the same headers, method and body as the failing client
      - timing output to see where time is spent
      - proxy and certificate options to test those paths
    rubric:
      excellent: Uses verbose mode and timing to see each stage, replicates the client's exact request, and uses proxy or certificate options to isolate network versus application problems.
      good: Uses verbose output and checks the status code but does not replicate the full request or measure timing.
      weak: Only runs a bare curl against the URL and reads the body.
    followups:
      - How would you test whether the customer's proxy is the problem with curl?
      - What would you be careful about when a customer pastes curl output with headers?
    common_errors:
      - Asking customers to share curl output that includes their API key without warning them to mask it.

  # ---------------------------------------------------------------- medium
  - external_key: technical.support_engineer.afternoon_cpu_spike
    competency_key: linux
    topic: Finding a resource-hungry process
    difficulty: medium
    kind: scenario
    text: >-
      A customer says their server gets sluggish every afternoon and they suspect our software. How would you
      work out which process is responsible and why?
    expected_concepts:
      - top or htop to see CPU, memory and load during the slowdown
      - checking IO wait and disk activity with tools like iostat or iotop
      - scheduled jobs such as cron, backups or scans at that time
      - collecting data over time with sar or monitoring history
      - correlating with our product's own scheduled tasks and logs
    rubric:
      excellent: Captures CPU, memory and IO data during the slow period, checks scheduled jobs on both sides, and uses historical metrics to tie the slowdown to a specific process and cause.
      good: Uses top to find a busy process but does not consider IO wait or scheduled jobs.
      weak: Accepts the customer's suspicion and escalates without collecting data.
    followups:
      - What would a high load average with low CPU usage suggest?
      - How would you capture the data if the slowdown happens when nobody is watching?
    common_errors:
      - Looking only at CPU while the real bottleneck is disk IO.

  - external_key: technical.support_engineer.silent_restarts_oom
    competency_key: linux
    topic: Unexplained service restarts
    difficulty: medium
    kind: scenario
    text: >-
      Our service on a customer's Linux host keeps restarting, but there's no error in the application's own
      log. How would you investigate?
    expected_concepts:
      - kernel OOM killer messages in dmesg or the journal
      - systemd restart reasons and exit signals
      - container or cgroup memory limits
      - memory growth over time pointing to a leak versus undersized limits
      - health checks or watchdogs restarting the process
    rubric:
      excellent: Looks outside the application log to kernel and systemd evidence, checks memory limits and growth, and distinguishes a leak from an undersized limit or an external watchdog.
      good: Suspects running out of memory and checks dmesg but does not examine limits or growth patterns.
      weak: Only reads the application log and concludes nothing is wrong.
    followups:
      - How would you tell a memory leak apart from a limit that is simply too low?
      - What would you tell the customer to do in the meantime?
    common_errors:
      - Raising the memory limit without checking whether usage keeps growing.

  - external_key: technical.support_engineer.address_already_in_use
    competency_key: linux
    topic: Port conflicts
    difficulty: medium
    kind: technical
    text: >-
      Our service won't start and the log says the address is already in use. How would you find what's holding
      the port and decide what to do about it?
    expected_concepts:
      - ss or lsof to find the listening process
      - identifying whether it is a stale copy of our own service or another product
      - sockets in TIME_WAIT versus an active listener
      - choosing between stopping the other process and changing our port
      - documenting port requirements for the customer
    rubric:
      excellent: Uses ss or lsof to identify the owning process, distinguishes a stale instance from a genuine conflict, and recommends a safe resolution while considering what else depends on that port.
      good: Finds the process with the right tool but does not think about which side should change.
      weak: Reboots the server or kills whatever process is found without checking what it is.
    followups:
      - What if the process holding the port belongs to another critical application?
      - How could a duplicate instance of our own service end up running?
    common_errors:
      - Killing an unknown process belonging to another application.

  - external_key: technical.support_engineer.renewed_cert_client_errors
    competency_key: networking
    topic: Certificate chain problems
    difficulty: medium
    kind: scenario
    text: >-
      After a customer renewed their server certificate, some API clients started failing with certificate errors
      while browsers still work fine. How would you troubleshoot that?
    expected_concepts:
      - missing intermediate certificate in the served chain
      - browsers filling gaps from cached or fetched intermediates
      - inspecting the served chain with openssl s_client or similar
      - client trust stores that are outdated or pinned
      - hostname mismatch and expiry checks
    rubric:
      excellent: Inspects the actual chain served, explains why browsers can tolerate a missing intermediate while other clients cannot, and also checks client trust stores, pinning and hostname coverage.
      good: Suspects the chain or trust store and checks the certificate, but cannot explain why browsers behave differently.
      weak: Tells clients to disable certificate verification.
    followups:
      - How would you see exactly which certificates the server sends?
      - What would you tell a customer who has pinned the old certificate?
    common_errors:
      - Recommending that clients turn off certificate verification as a fix.

  - external_key: technical.support_engineer.slow_from_far_region
    competency_key: networking
    topic: Separating network delay from application delay
    difficulty: medium
    kind: technical
    text: >-
      A customer in another region says our service is slow for them. How would you work out whether the delay
      is in the network path or in our application?
    expected_concepts:
      - breaking down time into DNS, connect, TLS, first byte and transfer
      - server-side processing time from our logs or metrics
      - traceroute or mtr for path latency and loss
      - comparing with nearby test points or synthetic monitors
      - CDN or regional endpoint routing
    rubric:
      excellent: Breaks a request into phases, compares client-side timings with server-side processing time, and uses path tools and regional comparisons to locate the delay.
      good: Uses traceroute or ping and checks server response times but does not separate the phases of a request.
      weak: Assumes distance is the cause or that the application is slow without measuring.
    followups:
      - What would high time to first byte but fast connection setup suggest?
      - How would you read packet loss showing on a middle hop in mtr?
    common_errors:
      - Reading loss on an intermediate traceroute hop as the problem when the final hop shows none.

  - external_key: technical.support_engineer.new_server_blocked_endpoint
    competency_key: networking
    topic: Firewall and routing changes
    difficulty: medium
    kind: scenario
    text: >-
      A customer's new server can't reach our licensing endpoint, but their old server could. How would you narrow
      down whether a firewall or routing change is to blame?
    expected_concepts:
      - comparing the two servers' network settings, subnets and routes
      - testing DNS, then the TCP port, then TLS from the new server
      - firewall rules or security groups scoped to the old server's address
      - egress allow lists and NAT addresses registered with us
      - proxy settings present on the old server only
    rubric:
      excellent: Compares the two servers layer by layer, tests each stage from the new host, and checks address-based allow lists on both sides including any IP restrictions we enforce.
      good: Suspects a firewall and tests the port but does not compare the two servers' configuration systematically.
      weak: Assumes our endpoint is down without testing from the old server.
    followups:
      - How would you check whether our side has an IP allow list for this customer?
      - What would a timeout versus an immediate reset tell you here?
    common_errors:
      - Forgetting that the new server may leave the network through a different public IP.

  - external_key: technical.support_engineer.packet_capture_case
    competency_key: networking
    topic: Using packet captures in support
    difficulty: medium
    kind: technical
    text: >-
      Tell me about a time you needed a packet capture to solve a support issue. How did you capture it, filter
      it, and what did you look for?
    expected_concepts:
      - capturing on the right host and interface with tcpdump or Wireshark
      - capture filters to limit by host and port
      - looking at handshakes, resets, retransmissions and timing
      - capturing on both ends to compare when possible
      - handling sensitive data in captures
    rubric:
      excellent: Gives a concrete case with sensible capture placement and filters, explains what they found in handshakes, resets or retransmissions, and handled the data carefully.
      good: Describes taking and reading a capture correctly but the example is thin or the analysis is basic.
      weak: Has never used a capture and cannot describe what they would look for.
    followups:
      - Why does it help to capture on both sides of the connection?
      - What can you still learn from a capture when the traffic is encrypted?
    common_errors:
      - Capturing everything without filters and producing a file too large to analyse.

  - external_key: technical.support_engineer.works_manually_not_scheduled
    competency_key: linux
    topic: Environment differences between shell and service
    difficulty: medium
    kind: scenario
    text: >-
      Our command-line tool works when the customer runs it by hand but fails when it runs from cron. What's
      likely going on, and how would you prove it?
    expected_concepts:
      - different environment variables, especially PATH and proxy settings
      - different user account and home directory
      - relative paths and working directory
      - missing shell profile settings in the scheduled context
      - capturing the scheduled run's environment and output to a log
    rubric:
      excellent: Names the environment, user and working directory differences, and proves it by capturing the scheduled job's environment and output and comparing it with the interactive run.
      good: Identifies PATH or user differences but does not describe how to capture evidence from the scheduled run.
      weak: Suggests the scheduler is unreliable or asks the customer to run it manually instead.
    followups:
      - How would you capture what the scheduled job sees?
      - How would you make the tool more robust to this in future?
    common_errors:
      - Not redirecting the scheduled job's output, so its error is never seen.

  - external_key: technical.support_engineer.product_in_docker
    competency_key: linux
    topic: Troubleshooting a containerised deployment
    difficulty: medium
    kind: technical
    text: >-
      When a customer runs our product in Docker containers, how do you get at the logs, configuration and
      resource limits you need to troubleshoot it?
    expected_concepts:
      - docker logs and inspect for output, exit codes and configuration
      - exec into the container for live checks when allowed
      - environment variables and mounted volumes as the source of configuration
      - memory and CPU limits and OOM-killed status
      - container networking and published ports
    rubric:
      excellent: Uses logs, inspect and exec appropriately, checks environment, volumes, limits and networking, and knows the container may be restarted with logs lost unless they are collected.
      good: Knows logs and exec but is unsure where configuration and limits live.
      weak: Treats the container like a normal server and looks for log files that do not exist.
    followups:
      - How would you tell that a container was killed for using too much memory?
      - What if the container restarts too quickly for you to exec into it?
    common_errors:
      - Losing evidence by recreating the container before capturing its logs.

  - external_key: technical.support_engineer.intermittent_502s
    competency_key: networking
    topic: Errors behind a load balancer
    difficulty: medium
    kind: scenario
    text: >-
      Users behind a load balancer are getting occasional 502 errors. How would you work out whether the problem
      is the load balancer, one of the backends or something in between?
    expected_concepts:
      - what a 502 means, an invalid or missing response from upstream
      - load balancer logs showing which backend and the upstream status
      - one unhealthy backend versus all backends
      - idle timeout mismatches between the load balancer and the backend
      - backend restarts or deploys during the errors
    rubric:
      excellent: Uses load balancer logs to find the backend and upstream behaviour, checks for a single bad node, timeout mismatches and deploys, and confirms the cause against the error timing.
      good: Knows a 502 points to the upstream and checks backend health but does not consider timeout mismatches.
      weak: Treats 502 as a generic server error and restarts everything.
    followups:
      - How do keep-alive timeouts cause occasional 502s?
      - How would the picture differ if users saw 504s instead?
    common_errors:
      - Confusing 502 with 504 and looking for slow requests instead of dropped connections.

  - external_key: technical.support_engineer.old_ip_after_migration
    competency_key: networking
    topic: DNS caching after a migration
    difficulty: medium
    kind: scenario
    text: >-
      We moved a service to new IP addresses, and a day later some customers are still hitting the old ones. How
      would you explain that and get them onto the new addresses?
    expected_concepts:
      - DNS record TTLs and how long resolvers may cache
      - resolvers or applications that ignore TTLs or cache indefinitely
      - hard-coded IPs or hosts file entries
      - finding which customers still connect through old-address logs
      - lowering TTLs before future migrations and keeping old addresses alive temporarily
    rubric:
      excellent: Explains TTL caching and the clients that ignore it, uses old-address traffic to find affected customers, gives them specific steps, and recommends better migration practice.
      good: Explains TTL caching and suggests flushing caches but does not find the affected customers proactively.
      weak: Says DNS just takes time and waits.
    followups:
      - How would you have planned the migration to avoid this?
      - What would you check for a customer whose Java application keeps the old address?
    common_errors:
      - Forgetting hard-coded addresses in customer firewalls or configuration.

  # ------------------------------------------------------------------ hard
  - external_key: technical.support_engineer.vpn_large_transfers_hang
    competency_key: networking
    topic: Path MTU problems
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A customer on a VPN can log in and load small pages, but large uploads and some bigger API responses just
      hang. How would you investigate?
    expected_concepts:
      - MTU reduced by VPN encapsulation
      - blocked ICMP breaking path MTU discovery
      - testing with ping using do-not-fragment and varying sizes
      - packet captures showing retransmissions of large segments
      - fixes such as MSS clamping or lowering the interface MTU
    rubric:
      excellent: Recognises the classic path MTU pattern, tests it with sized do-not-fragment pings or captures, and recommends MSS clamping or MTU changes on the right device.
      good: Suspects packet size or the VPN and tests it, but cannot explain why ICMP blocking matters.
      weak: Blames our server's performance or upload size limits without testing.
    followups:
      - Why do small requests work when large ones hang rather than fail?
      - Who would need to make the change, and how would you explain it to them?
    common_errors:
      - Raising server timeouts when the packets are never arriving.

  - external_key: technical.support_engineer.tokens_rejected_some_hosts
    competency_key: linux
    topic: Clock skew and time-based auth
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Authentication tokens from a customer's identity provider are being rejected as not yet valid or already
      expired, but only on some of their machines. How would you track this down?
    expected_concepts:
      - clock skew between the issuer and the validating hosts
      - checking time sync status with tools like timedatectl or chronyc
      - comparing token issued-at and expiry claims with host time
      - allowed clock tolerance in the validating software
      - virtual machines drifting after suspend or with sync disabled
    rubric:
      excellent: Connects the symptom to clock skew, compares token time claims with host clocks, checks time sync on the failing machines, and explains tolerance settings and long-term fixes.
      good: Suspects time differences and checks the clock but does not inspect the token claims or sync configuration.
      weak: Blames the identity provider or asks users to log in again repeatedly.
    followups:
      - How would you read the time claims inside the token safely?
      - Why might a virtual machine's clock drift more than a physical server's?
    common_errors:
      - Increasing token lifetimes instead of fixing the clocks.

  - external_key: technical.support_engineer.too_many_open_files
    competency_key: linux
    topic: File descriptor limits
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Under heavy load, our service on a customer's server starts failing with too many open files. How would you
      diagnose it, and what would you recommend?
    expected_concepts:
      - per-process limits versus system-wide limits
      - checking the running process's actual limit in proc rather than the shell's ulimit
      - systemd LimitNOFILE overriding limits.conf
      - counting open descriptors over time to spot a leak
      - distinguishing a leak from a legitimately high connection count
    rubric:
      excellent: Checks the live process limit, knows systemd overrides shell limits, tracks descriptor counts over time, and separates a leak needing a bug fix from a limit needing tuning.
      good: Knows the error relates to ulimit and suggests raising it but does not verify the running process or look for a leak.
      weak: Recommends rebooting the server or does not know what file descriptors are.
    followups:
      - How would you see which kinds of descriptors are open, such as sockets versus files?
      - What evidence would you give engineering if you suspect a leak?
    common_errors:
      - Changing limits.conf and finding the service, which systemd starts, still has the old limit.

  - external_key: technical.support_engineer.tls_inspection_appliance
    competency_key: networking
    topic: TLS-intercepting security appliances
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A customer's security appliance inspects outbound encrypted traffic, and our client only fails to connect
      from inside their network. How would you prove that's the cause, and what options would you give them?
    expected_concepts:
      - comparing the certificate issuer seen inside versus outside the network
      - client-side trust stores lacking the corporate root certificate
      - certificate pinning or mutual TLS breaking under interception
      - bypass or exclusion rules for our domains on the appliance
      - documenting supported options and their security trade-offs
    rubric:
      excellent: Proves interception by comparing certificate issuers, explains why pinning or mutual TLS breaks, and gives options such as bypass rules or trusting the corporate root with their security implications.
      good: Identifies the appliance as the likely cause and suggests a bypass but has a weak way to prove it.
      weak: Suggests disabling certificate checks in our client.
    followups:
      - Which option would you recommend for a client that uses mutual TLS?
      - How would you document this for future customers with the same setup?
    common_errors:
      - Advising the customer to turn off certificate validation.

  - external_key: technical.support_engineer.hanging_cli_no_output
    competency_key: linux
    topic: Finding what a hung process waits on
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      A command-line tool hangs on a customer's machine with no output at all. How would you find out what it's
      actually waiting on?
    expected_concepts:
      - strace to see the blocking system call
      - lsof or proc to see open files and sockets
      - process state such as waiting on disk IO
      - DNS lookups or connections timing out to unreachable hosts
      - stack dumps through language-specific tools where available
    rubric:
      excellent: Uses strace and open-descriptor inspection to identify the blocking call and its target, such as a socket or file, and links it to a cause like an unreachable host or locked file.
      good: Knows strace exists and roughly what it shows but struggles to interpret the blocking call.
      weak: Only suggests waiting longer or rerunning the tool.
    followups:
      - What would it tell you if the process is blocked in a connect call?
      - How would you get similar information on a system where strace is not installed?
    common_errors:
      - Killing the process before collecting any evidence about where it was stuck.

  - external_key: technical.support_engineer.thirty_second_connect_delay
    competency_key: networking
    topic: Long delays before connections succeed
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Connections from a customer's network sometimes take about thirty seconds before they succeed, then work
      normally. How would you investigate?
    expected_concepts:
      - DNS resolver timeouts and fallback to a secondary resolver
      - IPv6 attempted first over a broken path before falling back to IPv4
      - reverse DNS lookups on the server side
      - timing the phases of a connection to see which one stalls
      - packet captures showing the retry pattern
    rubric:
      excellent: Recognises the fixed delay as a timeout followed by fallback, tests DNS, IPv6 and reverse lookups as candidates, and confirms with phase timing or a capture.
      good: Suspects DNS and tests it but does not consider IPv6 fallback or confirm with timings.
      weak: Treats it as general slowness and suggests more bandwidth.
    followups:
      - Why is a consistent delay length such a strong clue?
      - How would you confirm the IPv6 theory?
    common_errors:
      - Ignoring that a near-constant delay usually points to a timeout and fallback.
