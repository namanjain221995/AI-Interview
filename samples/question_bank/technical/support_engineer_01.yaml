# Curated questions: technical support engineering (part 1 of 4) — troubleshooting method,
# triage, reproducing issues, reading logs and stack traces, isolating causes.
# `defaults` are merged into every question (question keys win). Medium is the default
# difficulty band; easy and hard questions override round_types.
version: 1
defaults:
  role_tags: [support_engineer]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.support_engineer.first_questions_vague_ticket
    competency_key: technical_support
    topic: Gathering information from a vague ticket
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A ticket comes in that just says the app is broken. What would you want to find out first, and how
      would you get it without going back and forth with the customer five times?
    expected_concepts:
      - what the user was trying to do and what they expected versus what happened
      - exact error text or screenshot, time it happened and how often
      - scope, such as one user, many users or everyone
      - environment details like version, browser or operating system
      - asking all key questions in one structured reply or using a ticket form
    rubric:
      excellent: Lists a focused set of questions covering symptom, scope, timing and environment, and explains how to bundle them into one clear request while checking what can be found internally first.
      good: Asks sensible questions about the error and environment but does not think about reducing round trips or checking internal data first.
      weak: Asks only a generic question such as what is wrong, or starts guessing at fixes without gathering information.
    followups:
      - What could you check on your own side before you even reply?
      - How would you word the request so a non-technical user can answer it?
    common_errors:
      - Sending one question at a time and stretching a simple ticket over several days.

  - external_key: technical.support_engineer.judging_ticket_urgency
    competency_key: technical_support
    topic: Judging ticket urgency
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide how urgent a ticket is? Walk me through what you weigh when two customers report
      problems at the same moment and you can only start on one.
    expected_concepts:
      - business impact, such as production down versus a cosmetic issue
      - number of users affected and whether a workaround exists
      - contractual response targets or service tiers
      - risk of data loss or security exposure
      - telling the waiting customer when they can expect a response
    rubric:
      excellent: Uses clear criteria such as impact, scope, workaround and data or security risk, applies them to the two-customer case, and makes sure the second customer still gets an acknowledgement.
      good: Weighs impact and contractual targets sensibly but misses one major factor such as data risk or the waiting customer.
      weak: Works strictly first in, first out or by whoever is loudest, with no reasoning about impact.
    followups:
      - How would your answer change if one customer is on a premium support plan?
      - What would make you raise a ticket's severity after you have started on it?
    common_errors:
      - Treating the customer's chosen severity as final without checking actual impact.

  - external_key: technical.support_engineer.reproduce_empty_export
    competency_key: debugging
    topic: Reproducing a reported bug
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A customer says exporting a report to CSV gives them an empty file. How would you go about reproducing
      that on your side?
    expected_concepts:
      - matching the customer's version, account settings and permissions
      - using the same filters, date range and data volume
      - checking whether the report actually has rows in the user interface
      - trying the same steps with similar or anonymised test data
      - recording exact steps once it reproduces
    rubric:
      excellent: Describes matching the customer's version, permissions, filters and data shape, checks whether the source data is really non-empty, and writes down precise steps once the bug reproduces.
      good: Tries the same steps in a test environment and asks for filters and version, but does not consider data or permission differences.
      weak: Tries the export once on their own account and concludes it works.
    followups:
      - What would you do if it only reproduces with the customer's data?
      - How would you get similar data without copying their real records?
    common_errors:
      - Testing with an admin account when the customer has restricted permissions.

  - external_key: technical.support_engineer.reading_stack_trace
    competency_key: debugging
    topic: Reading a stack trace
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When someone hands you a stack trace from an application error, how do you read it to work out where the
      problem actually is? Talk me through what you look at first.
    expected_concepts:
      - the exception type and message
      - finding the first frame in our own code rather than framework or library code
      - caused-by or nested exceptions that hold the real root error
      - matching the trace to the version the customer is running
      - searching for the same trace in known issues or other tickets
    rubric:
      excellent: Reads the exception type and message, finds the deepest caused-by error and the first frame in product code, and uses the trace to search known issues for the matching version.
      good: Knows to read the exception and the top frames but does not mention nested causes or version matching.
      weak: Only reads the last line or treats the whole trace as noise and asks engineering to look at it.
    followups:
      - What does it mean when the trace only shows framework code?
      - How would you use the trace to decide which engineering team to involve?
    common_errors:
      - Stopping at the outer exception and missing the caused-by section with the real error.

  - external_key: technical.support_engineer.using_log_levels
    competency_key: debugging
    topic: Log levels during an investigation
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you use log levels like error, warning, info and debug when you're investigating something, and
      when would you ask a customer to switch on debug logging?
    expected_concepts:
      - what each level usually records
      - errors as a starting point but warnings often show the earlier cause
      - debug logging for a short, targeted window when normal logs are not enough
      - performance and disk impact of verbose logging
      - sensitive data that debug logs can contain and turning it back off
    rubric:
      excellent: Explains how each level helps, looks at warnings before the error, and asks for debug logging only for a bounded window with a plan to revert it and handle sensitive data.
      good: Understands the levels and when debug logging helps but does not mention its cost or reverting it.
      weak: Asks for debug logging on every ticket by default or cannot describe what the levels mean.
    followups:
      - What would you ask the customer to do once they have reproduced the problem with debug logging on?
      - Have you ever seen debug logs cause a problem themselves?
    common_errors:
      - Leaving debug logging enabled in production after the ticket is closed.

  - external_key: technical.support_engineer.one_change_at_a_time
    competency_key: technical_support
    topic: Isolating variables
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me how you narrow a problem down by changing one thing at a time. Give me an example from a real
      issue where that approach got you to the answer.
    expected_concepts:
      - forming a hypothesis before changing anything
      - changing a single variable such as browser, network, account or data
      - recording what was tried and the result
      - comparing a working case to a failing case
      - reverting changes that did not help
    rubric:
      excellent: Gives a concrete example where they compared working and failing cases, changed one variable at a time, kept notes, and reached a clear cause.
      good: Describes the approach correctly with a reasonable example but is vague about how results were recorded or compared.
      weak: Describes changing several settings at once or cannot give a real example.
    followups:
      - How do you keep track of what you have already ruled out?
      - When is it reasonable to change more than one thing at once?
    common_errors:
      - Changing several things at once and not knowing which one fixed the problem.

  - external_key: technical.support_engineer.cannot_reproduce_next_steps
    competency_key: debugging
    topic: When the issue does not reproduce
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've followed the customer's steps exactly and everything works fine for you. What would you do next?
    expected_concepts:
      - confirming the steps with the customer, ideally by watching them reproduce it
      - comparing environment details such as version, browser, network and permissions
      - checking server-side logs for the customer's failed attempt
      - asking for a recording, HAR file or exact timestamps
      - keeping the customer updated rather than closing the ticket as not reproducible
    rubric:
      excellent: Treats it as a difference to find, uses the customer's own failed attempt in server logs, asks for a screen share or recording, and compares environments systematically.
      good: Asks for more detail and compares versions but does not use server-side evidence from the customer's attempt.
      weak: Tells the customer it works on our side and closes the ticket or suggests clearing their cache with no further investigation.
    followups:
      - What would you look for during a screen share with the customer?
      - How long would you keep investigating before asking engineering for help?
    common_errors:
      - Closing the ticket as cannot reproduce without checking logs from the customer's attempt.

  - external_key: technical.support_engineer.using_the_timeline
    competency_key: technical_support
    topic: Using when it started
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a customer says something stopped working yesterday, how do you use that timing to guide your
      investigation?
    expected_concepts:
      - pinning down the exact time of the first failure
      - checking our releases, configuration changes and incidents around that time
      - asking about changes on the customer side such as updates, network or credential changes
      - comparing logs from before and after that time
      - expiry events such as certificates, passwords or licences
    rubric:
      excellent: Narrows the start time precisely and lines it up against changes on both sides, including releases, configuration, credentials and expiry dates, using before-and-after evidence.
      good: Checks our recent releases and asks what changed on the customer side but does not tighten the time window.
      weak: Ignores the timing and starts general troubleshooting from scratch.
    followups:
      - Where would you find a list of what changed on our side yesterday?
      - What do you do when the customer says nothing changed on their side?
    common_errors:
      - Accepting that nothing changed without checking for expiries or automatic updates.

  # ---------------------------------------------------------------- medium
  - external_key: technical.support_engineer.intermittent_upload_failures
    competency_key: debugging
    topic: Intermittent failures
    difficulty: medium
    kind: scenario
    text: >-
      A customer reports that roughly one in twenty file uploads fails with a generic error, and they can't
      predict which ones. How would you approach tracking that down?
    expected_concepts:
      - collecting several failing and succeeding examples with timestamps and request ids
      - looking for a pattern in file size, type, name characters, time of day or server
      - checking server and proxy logs for the failed requests
      - considering timeouts, size limits and a single unhealthy backend
      - building a repeatable test that runs many uploads to measure the failure rate
    rubric:
      excellent: Collects many examples, compares failing against succeeding ones on concrete attributes such as size, type and serving node, uses request ids to find the server-side cause, and builds a repeatable test to confirm the fix.
      good: Looks at logs for the failing uploads and checks file size or type but does not compare against successes or build a repeatable test.
      weak: Asks the customer to retry or clear their cache and treats it as random.
    followups:
      - How would you tell whether one server behind the load balancer is the problem?
      - What would you change if failures only happen during business hours?
    common_errors:
      - Studying only failing requests without comparing them to the successful ones.

  - external_key: technical.support_engineer.tracing_request_across_services
    competency_key: debugging
    topic: Following a request through several services
    difficulty: medium
    kind: technical
    text: >-
      How do you follow a single customer request through logs from several different services? What do you
      rely on to stitch the story together?
    expected_concepts:
      - correlation or request ids passed between services
      - narrowing by timestamp, account and endpoint when no id exists
      - centralised log search with filters
      - tracing tools that show spans across services
      - noting where the id stops appearing as the likely failure point
    rubric:
      excellent: Uses a correlation id or trace across services, falls back to time, account and endpoint when ids are missing, and treats the point where the request disappears as the key clue.
      good: Uses request ids and a central log tool but has no fallback when ids are missing.
      weak: Searches each service's logs separately by guesswork without any way to link entries.
    followups:
      - What would you do if one service does not log the correlation id?
      - How would you get a request id from a customer who only sees a generic error page?
    common_errors:
      - Matching log lines by timestamp alone on a busy system and following the wrong request.

  - external_key: technical.support_engineer.aligning_timestamps
    competency_key: debugging
    topic: Comparing timestamps across sources
    difficulty: medium
    kind: technical
    text: >-
      Tell me how you handle timestamps when you're comparing a customer's logs with our server logs, especially
      when they're in different time zones or the clocks don't agree.
    expected_concepts:
      - converting everything to UTC
      - checking the time zone and format each log uses
      - spotting clock drift by lining up a known shared event
      - widening the search window when clocks are uncertain
      - daylight saving changes shifting offsets
    rubric:
      excellent: Normalises to UTC, confirms each source's time zone, uses a known shared event to measure drift, and allows for daylight saving shifts when matching events.
      good: Converts to a single time zone correctly but does not consider clock drift or daylight saving.
      weak: Compares raw timestamps directly and draws conclusions from mismatched times.
    followups:
      - How would you find a shared event to line the two logs up?
      - What problems can clock drift cause beyond confusing log analysis?
    common_errors:
      - Assuming customer logs are in UTC when they are in local time.

  - external_key: technical.support_engineer.searching_large_log_file
    competency_key: linux
    topic: Searching a large log file on the command line
    difficulty: medium
    kind: technical
    text: >-
      You've been given a two-gigabyte log file and need to find out why a job failed sometime overnight. How
      would you work through it on the command line?
    expected_concepts:
      - narrowing to the time window first rather than reading from the top
      - grep with context lines, case-insensitive and inverted matches
      - counting and grouping errors with tools like sort, uniq and awk
      - zgrep or less for compressed or very large files
      - following the job id or thread id through the matching lines
    rubric:
      excellent: Narrows by time, then uses grep with context, counting and grouping to find the first relevant error and follows the job id through the surrounding lines.
      good: Uses grep for errors and less to browse but does not narrow by time or summarise patterns.
      weak: Opens the whole file in a text editor or reads it from the top.
    followups:
      - How would you find the first error rather than the most common one?
      - What would you do if the file is rotated and compressed?
    common_errors:
      - Fixating on the most frequent error, which is often harmless noise, instead of the first one near the failure.

  - external_key: technical.support_engineer.prod_versus_staging_difference
    competency_key: technical_support
    topic: Finding environment differences
    difficulty: medium
    kind: scenario
    text: >-
      A bug reproduces on a customer's production system but not on their staging system, which they say is
      identical. How would you find what's actually different?
    expected_concepts:
      - comparing versions of our product and its dependencies
      - diffing configuration files and environment settings
      - data volume and specific records that exist only in production
      - network differences such as proxies, firewalls or load balancers
      - integrations, permissions and certificates that differ between environments
    rubric:
      excellent: Systematically compares versions, configuration, data, network path and integrations, using tools to diff rather than trusting the claim that they match, and tests the most likely difference first.
      good: Checks versions and configuration but overlooks data or network differences.
      weak: Accepts that the systems are identical and keeps retrying the same steps.
    followups:
      - How would you compare configuration safely without copying secrets around?
      - What if the difference turns out to be production data you cannot access?
    common_errors:
      - Trusting the customer's statement that the environments match without checking.

  - external_key: technical.support_engineer.slowdown_after_upgrade
    competency_key: technical_support
    topic: Regression after an upgrade
    difficulty: medium
    kind: scenario
    text: >-
      Right after upgrading to our latest version, a customer says a workflow that used to take seconds now
      takes minutes. How would you work out whether the upgrade caused it and what changed?
    expected_concepts:
      - confirming the timing and measuring the slowdown precisely
      - reading release notes and changelogs between the two versions
      - reproducing on both old and new versions with comparable data
      - checking for migration steps that did not finish, such as index rebuilds
      - checking whether other customers on the same version report it
    rubric:
      excellent: Measures the slowdown, compares old and new versions with similar data, checks release notes and unfinished migration steps, and looks for other affected customers before escalating with evidence.
      good: Suspects the upgrade and reads the release notes but does not reproduce on both versions.
      weak: Recommends a rollback straight away without investigating, or dismisses the upgrade as a cause.
    followups:
      - When would you advise the customer to roll back?
      - How would you present this to engineering so they can act quickly?
    common_errors:
      - Assuming correlation proves cause without testing the old version.

  - external_key: technical.support_engineer.designing_diagnostic_bundle
    competency_key: technical_support
    topic: What a diagnostic bundle should contain
    difficulty: medium
    kind: technical
    text: >-
      If you could define what goes into the diagnostic bundle customers send with a ticket, what would you
      include, and what would you deliberately leave out?
    expected_concepts:
      - product version, configuration and enabled features
      - recent logs covering the failure window
      - system information such as OS, resources and network settings
      - excluding or masking secrets, passwords and personal data
      - keeping it small and easy to generate with one command
    rubric:
      excellent: Proposes a focused bundle covering version, configuration, logs, and system state, with automatic masking of secrets and personal data and a one-step way to generate it.
      good: Lists sensible contents but gives little thought to privacy or ease of collection.
      weak: Asks for everything, including full databases or unmasked configuration with credentials.
    followups:
      - How would you make sure secrets never end up in the bundle?
      - What would you add for a performance problem specifically?
    common_errors:
      - Including configuration files with credentials in plain text.

  - external_key: technical.support_engineer.ranking_hypotheses
    competency_key: debugging
    topic: Choosing which hypothesis to test first
    difficulty: medium
    kind: technical
    text: >-
      How do you decide which theory to test first when you have several plausible causes for a problem? Use an
      example from your own work.
    expected_concepts:
      - likelihood based on evidence and past tickets
      - cost and speed of testing each theory
      - testing cheap checks that rule out many causes first
      - risk of a test disturbing the customer's system
      - updating the ranking as new evidence comes in
    rubric:
      excellent: Weighs likelihood against cost and risk of each test, starts with quick checks that eliminate large areas, and gives a real example where the ordering saved time.
      good: Prioritises by likelihood with a reasonable example but does not consider cost or risk of testing.
      weak: Tests theories in whatever order they come to mind or has no real example.
    followups:
      - When have you been wrong about the most likely cause, and what did you learn?
      - How do you avoid getting stuck on your first theory?
    common_errors:
      - Spending hours on the most interesting theory instead of the quickest one to rule out.

  - external_key: technical.support_engineer.access_error_with_right_role
    competency_key: debugging
    topic: Misleading error messages
    difficulty: medium
    kind: scenario
    text: >-
      The customer sees an access denied message, but their account clearly has the right role. How would you
      dig into what's really going on?
    expected_concepts:
      - checking effective permissions, not just the assigned role
      - group membership, inherited or overriding policies and per-object sharing
      - stale sessions or tokens issued before the role change
      - server logs for the exact authorisation decision
      - the error being a generic message for a different failure
    rubric:
      excellent: Treats the message as a clue rather than a fact, checks effective permissions, object-level rules and session freshness, and confirms the actual reason in server-side logs.
      good: Checks role assignments and asks the user to log out and back in but does not look at the server-side decision.
      weak: Reassigns the role or grants admin rights to make the error go away.
    followups:
      - Why might logging out and back in fix this?
      - What would you do if the logs show a different error from what the user sees?
    common_errors:
      - Granting broader permissions as a fix without finding the cause.

  - external_key: technical.support_engineer.single_user_affected
    competency_key: technical_support
    topic: Using scope to narrow a problem
    difficulty: medium
    kind: scenario
    text: >-
      Only one user in a fifty-person customer organisation is hitting a problem; everyone else is fine. How
      would you use that fact to narrow things down?
    expected_concepts:
      - comparing the user's settings, role and data to a working colleague
      - checking device, browser, extensions and local network
      - trying the user's account on another device, and another account on theirs
      - looking for data unique to that user, such as unusual characters or large records
      - server logs filtered to that user
    rubric:
      excellent: Uses a working colleague as a baseline and swaps account and device to separate account-side from device-side causes, then checks user-specific data and logs.
      good: Checks the user's browser and settings and compares with a colleague but does not cross-test account and device.
      weak: Reinstalls or resets the user's account without trying to understand the difference.
    followups:
      - What would it mean if the problem follows the user to another machine?
      - How would you approach it if it affected three users instead of one?
    common_errors:
      - Resetting the user's account and losing the evidence of what was different.

  - external_key: technical.support_engineer.matching_known_issues
    competency_key: technical_support
    topic: Matching tickets to known issues
    difficulty: medium
    kind: technical
    text: >-
      How do you check whether a new ticket is a known issue or a duplicate of something already being worked,
      and what do you do when it only partly matches?
    expected_concepts:
      - searching by error text, symptoms, version and component
      - checking the bug tracker, knowledge base and open incidents
      - comparing environment and version details before linking
      - linking related tickets so engineering sees the count and impact
      - opening a new issue when key details differ
    rubric:
      excellent: Searches several sources by symptom and error text, verifies version and environment before linking, and opens a new issue with a reference when the match is partial rather than forcing it.
      good: Searches the tracker and links duplicates but is less careful about partial matches.
      weak: Links tickets on a similar title alone or never checks for existing issues.
    followups:
      - Why does linking duplicate tickets matter to engineering?
      - How do you tell the customer their issue is a known bug?
    common_errors:
      - Attaching a ticket to an existing bug that looks similar but has a different cause, so it never gets fixed.

  # ------------------------------------------------------------------ hard
  - external_key: technical.support_engineer.debug_logging_hides_bug
    competency_key: debugging
    topic: Problems that vanish under observation
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Turning on debug logging makes a customer's intermittent problem disappear. What might that tell you, and
      how would you keep investigating?
    expected_concepts:
      - timing-sensitive causes such as concurrency or race conditions
      - extra logging slowing things down or changing ordering
      - lighter-weight observation like metrics, sampling or targeted logging
      - capturing state at the moment of failure, such as thread dumps
      - sharing the pattern with engineering as evidence in itself
    rubric:
      excellent: Recognises the timing sensitivity, explains how logging changes timing, proposes low-overhead observation and state capture at failure, and frames the finding as useful evidence for engineering.
      good: Suspects a timing issue but proposes only limited alternative ways to observe it.
      weak: Concludes the problem is fixed and closes the ticket, or keeps debug logging on permanently.
    followups:
      - What kind of targeted logging would you ask engineering to add?
      - How would you explain this to the customer while the investigation continues?
    common_errors:
      - Treating the disappearance as a fix rather than as a clue.

  - external_key: technical.support_engineer.locked_down_onprem_investigation
    competency_key: technical_support
    topic: Troubleshooting with very limited access
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're supporting an on-premises customer in a locked-down environment. You can't access their systems,
      and they can only share screenshots and short text excerpts. How would you run the investigation?
    expected_concepts:
      - giving precise commands and exactly what output to send back
      - scripts or built-in tools that collect and mask diagnostics in a reviewable form
      - reproducing their setup in a lab as closely as possible
      - keeping a shared log of steps and results
      - agreeing on approval paths for anything that changes their system
    rubric:
      excellent: Turns the customer's staff into effective hands with precise, reviewable commands, builds a lab replica, collects masked diagnostics they can approve, and keeps a clear shared record of results.
      good: Provides commands and asks for specific output but does not think about a lab replica or the customer's approval process.
      weak: Asks for remote access anyway or relies on vague instructions like check the logs.
    followups:
      - How would you write instructions so they can be run safely by someone unfamiliar with our product?
      - What would you do if the customer cannot share any logs at all?
    common_errors:
      - Sending long, ambiguous instructions that produce unusable output.

  - external_key: technical.support_engineer.three_party_blame
    competency_key: technical_support
    topic: Resolving issues across several parties
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A customer's integration is failing, and their team, a third-party vendor and our engineering team each
      say the problem is on someone else's side. How would you get to the real answer?
    expected_concepts:
      - mapping the full request path and who owns each hop
      - collecting evidence at each boundary such as request and response logs or captures
      - a joint call with a shared timeline and a specific failing example
      - reproducing with a minimal client to isolate each side
      - owning the coordination and keeping the customer informed
    rubric:
      excellent: Maps the path and ownership, gathers evidence at each boundary for one concrete failing request, uses a minimal reproduction to rule sides in or out, and drives a joint conversation with facts rather than opinions.
      good: Gathers logs from our side and asks the others for theirs but lacks a plan to isolate where the failure occurs.
      weak: Proves it is not our fault and hands the problem back to the customer.
    followups:
      - What evidence would most convincingly show the problem is at the vendor's end?
      - How do you keep the customer from feeling stuck in the middle?
    common_errors:
      - Stopping once our side is cleared even though the customer is still blocked.

  - external_key: technical.support_engineer.records_changed_unexpectedly
    competency_key: technical_support
    topic: Investigating reported data changes
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A customer says some of their records changed values with nobody editing them. How would you investigate,
      and how would you handle the situation while you don't yet know the cause?
    expected_concepts:
      - audit logs showing who or what changed the records and when
      - automation, integrations, imports or API clients writing to the same data
      - checking whether other customers are affected and escalating quickly if it may be a bug
      - preserving evidence and taking backups before anything is changed
      - careful customer updates that avoid premature conclusions
    rubric:
      excellent: Uses audit trails to identify the actor, considers integrations and automations, preserves evidence, treats a possible platform bug as high severity with fast escalation, and keeps the customer informed without guessing.
      good: Checks audit logs and integrations but does not think about evidence preservation or impact on other customers.
      weak: Restores the old values or tells the customer someone on their team must have done it without evidence.
    followups:
      - What would you do if the audit log shows the change came from a system account?
      - When would you consider this a security incident?
    common_errors:
      - Fixing the data before understanding the cause, which destroys the evidence.

  - external_key: technical.support_engineer.reproducing_concurrent_edits
    competency_key: debugging
    topic: Reproducing timing-dependent bugs
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you go about reproducing a problem you suspect only happens when two users act on the same record
      at almost the same moment?
    expected_concepts:
      - confirming from logs that the two actions overlapped in time
      - scripting simultaneous requests rather than relying on manual clicking
      - repeating many times to raise the chance of hitting the timing window
      - adding delays or throttling to widen the window in a test environment
      - describing the expected and observed final state precisely for engineering
    rubric:
      excellent: Confirms the overlap from evidence, scripts concurrent requests in a loop, uses delays to widen the window, and reports the exact sequence and outcome to engineering.
      good: Proposes having two people try at the same time and checking logs, but has no repeatable scripted approach.
      weak: Tries once by hand and concludes it cannot be reproduced.
    followups:
      - What would you look for in the logs to prove the actions overlapped?
      - How would you tell engineering about it if you never manage to reproduce it?
    common_errors:
      - Giving up after a few manual attempts at a bug that depends on millisecond timing.

  - external_key: technical.support_engineer.symptom_fix_versus_root_cause
    competency_key: debugging
    topic: Root cause versus symptom
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Tell me about an issue where the first fix you found only addressed the symptom. How did you realise it,
      and how did you get to the underlying cause?
    expected_concepts:
      - the signal that the fix was incomplete, such as recurrence or other affected customers
      - asking why repeatedly or tracing back through the chain of causes
      - distinguishing a workaround from a fix in communication
      - evidence that confirmed the real cause
      - follow-up actions such as a bug fix, monitoring or knowledge base update
    rubric:
      excellent: Gives a specific example, explains what showed the first fix was superficial, walks through how they traced the real cause with evidence, and describes lasting follow-up to prevent recurrence.
      good: Gives a real example with a reasonable root cause but is light on how they confirmed it or what followed.
      weak: Has no concrete example or describes restarting a service as finding the root cause.
    followups:
      - How did you explain the difference between the workaround and the fix to the customer?
      - What would you have done differently in hindsight?
    common_errors:
      - Calling a restart or cache clear the root cause.
