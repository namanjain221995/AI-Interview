# Curated questions: network engineering (part 4 of 4) — troubleshooting methodology,
# cloud networking, monitoring and telemetry, automation, change and incident handling.
# `defaults` are merged into every question (question keys win). Medium is the default
# difficulty band; easy and hard questions override round_types.
version: 1
defaults:
  role_tags: [network]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.network.slow_network_method
    competency_key: network_engineering
    topic: Structured troubleshooting method
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When someone tells you the network is slow, how do you structure your troubleshooting so you're not
      just guessing?
    expected_concepts:
      - defining the symptom, scope and timing
      - who and what is affected versus not affected
      - working through layers or splitting the path in half
      - forming and testing one hypothesis at a time
      - checking recent changes
      - recording findings
    rubric:
      excellent: Describes a repeatable method that starts by clarifying scope and timing, narrows the problem with tests that rule things in or out, and checks recent changes.
      good: Describes a reasonable layered approach with some scoping questions.
      weak: Jumps straight to a favourite tool or cause without scoping.
    followups:
      - What questions do you ask the person reporting it?
      - How do you decide when to escalate to another team?
    common_errors:
      - Not asking what changed or who else is affected.

  - external_key: technical.network.traceroute_interpretation
    competency_key: network_engineering
    topic: Interpreting traceroute
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you read traceroute output, and why can it mislead you when a hop in the middle shows high
      latency or timeouts?
    expected_concepts:
      - TTL expiry and ICMP time exceeded replies
      - routers rate-limiting or deprioritising ICMP
      - latency that does not persist to later hops is usually harmless
      - asymmetric return paths
      - UDP, ICMP and TCP probe differences
    rubric:
      excellent: Explains how traceroute works and why intermediate hop results are unreliable, and focuses on whether latency or loss carries through to the destination.
      good: Explains TTL-based discovery and knows routers may not reply.
      weak: Treats any slow or missing hop as the cause of the problem.
    followups:
      - When would you use a TCP-based traceroute?
      - What does mtr add over a single traceroute?
    common_errors:
      - Reporting a mid-path hop's latency as the fault when later hops are fine.

  - external_key: technical.network.port_443_unreachable
    competency_key: network_engineering
    topic: Connection to a server port failing
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A developer says they can't connect to a server on port 443 from their laptop. Talk me through the
      first five minutes of your troubleshooting.
    expected_concepts:
      - name resolution to the right address
      - basic reachability to the server
      - TCP connection test to the port
      - refused versus timed out
      - checking whether others can connect
      - proxies or VPN in the path
    rubric:
      excellent: Moves logically from name resolution to reachability to the port, uses the type of failure to choose the next step, and quickly checks whether the problem is limited to this client.
      good: Checks DNS, ping and the port with sensible tools.
      weak: Relies on ping alone and concludes from that.
    followups:
      - Ping fails but the port connects. What does that tell you?
      - The connection times out instead of being refused. Where do you look?
    common_errors:
      - Treating a failed ping as proof the server is down.

  - external_key: technical.network.cloud_sg_vs_nacl
    competency_key: aws
    topic: Security groups versus network ACLs
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      In a cloud network, how do security groups and network ACLs differ in practice, and which do you rely
      on for what?
    expected_concepts:
      - security groups are stateful and attached to interfaces
      - network ACLs are stateless and attached to subnets
      - allow-only versus allow and deny rules
      - referencing other security groups
      - ephemeral ports for return traffic in ACLs
    rubric:
      excellent: Explains state, scope and rule semantics accurately, explains how they combine, and uses security groups as the main control with ACLs as coarse guard rails.
      good: Correctly identifies stateful versus stateless and where each attaches.
      weak: Thinks they are interchangeable.
    followups:
      - A connection works outbound but replies never arrive. Which control would you suspect?
      - When would you deliberately use a network ACL deny rule?
    common_errors:
      - Forgetting ephemeral return ports in stateless ACLs.

  - external_key: technical.network.core_device_monitoring
    competency_key: observability
    topic: Monitoring core network devices
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What would you monitor on a set of core switches and routers, and how would you collect that data?
    expected_concepts:
      - interface utilisation, errors and discards
      - device CPU, memory and temperature
      - routing protocol neighbour state
      - SNMP polling versus streaming telemetry
      - syslog collection
      - thresholds and baselines for alerting
    rubric:
      excellent: Covers device, interface and protocol health, explains collection methods and their trade-offs, and connects metrics to useful alerts.
      good: Lists the key metrics and one collection method.
      weak: Only monitors whether the device responds to ping.
    followups:
      - Which of these would you alert on immediately, and which only trend?
      - What does a rising discard counter tell you that utilisation doesn't?
    common_errors:
      - Ignoring routing protocol state changes.

  - external_key: technical.network.crc_errors_port
    competency_key: network_engineering
    topic: Interface errors on a switch port
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Monitoring shows a switch port with steadily rising CRC errors, and users of the connected server
      report slow file copies. What would you do?
    expected_concepts:
      - physical layer causes such as cabling, optics or connectors
      - checking optic light levels
      - duplex or speed mismatch
      - swapping components one at a time
      - correlating errors with traffic and retransmissions
    rubric:
      excellent: Treats it as a physical layer issue first, checks optics and negotiation, isolates the faulty component by swapping one thing at a time, and confirms the fix from counters.
      good: Suspects cabling or duplex and suggests replacing parts.
      weak: Clears the counters and moves on.
    followups:
      - Errors show up on only one side of the link. What does that tell you?
      - How do CRC errors turn into slow file copies?
    common_errors:
      - Replacing several components at once so the real cause stays unknown.

  - external_key: technical.network.urgent_core_change
    competency_key: network_engineering
    topic: Making an urgent production change safely
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You need to change the routing configuration on a core router during business hours because of an
      urgent issue. How would you prepare and carry out the change safely?
    expected_concepts:
      - backing up the current configuration
      - written steps and a tested rollback
      - commit-confirm or scheduled rollback features
      - out-of-band access in case you lose connectivity
      - checks before and after
      - telling affected teams and a second person reviewing
    rubric:
      excellent: Prepares backups, rollback and out-of-band access, uses automatic rollback features where available, verifies before and after, and communicates.
      good: Backs up the config and plans a rollback.
      weak: Makes the change live without preparation.
    followups:
      - How do you avoid locking yourself out of a remote device?
      - What would you check right after the change?
    common_errors:
      - Not having out-of-band access before touching remote routing.

  # ---------------------------------------------------------------- medium
  - external_key: technical.network.large_transfers_hang_vpn
    competency_key: networking
    topic: MTU and path MTU discovery
    difficulty: medium
    kind: scenario
    text: >-
      Users connected through a new VPN can open small web pages, but large downloads and some HTTPS sites
      just hang. What's your theory, and how would you prove it?
    expected_concepts:
      - tunnel overhead reducing the effective MTU
      - blocked ICMP breaking path MTU discovery
      - testing with do-not-fragment pings of varying size
      - TCP MSS clamping on the tunnel
      - captures showing large segments never acknowledged
    rubric:
      excellent: Identifies an MTU black hole, proves it with sized pings or captures, and fixes it with MSS clamping or correct MTU while allowing the needed ICMP.
      good: Suspects MTU and suggests lowering it.
      weak: Blames the websites or the browser.
    followups:
      - Why do small pages load but large ones don't?
      - Which ICMP messages must be allowed for path MTU discovery to work?
    common_errors:
      - Blocking all ICMP at the firewall.

  - external_key: technical.network.capture_point_strategy
    competency_key: network_engineering
    topic: Planning packet captures
    difficulty: medium
    kind: technical
    text: >-
      When you're chasing a problem that crosses several devices, how do you decide where to take packet
      captures, and what do you look for when you compare them?
    expected_concepts:
      - capturing at both ends and at key midpoints
      - capture filters to limit volume
      - time synchronisation between capture points
      - matching packets across captures by sequence numbers or IDs
      - what changed between points such as NAT, drops or delays
      - capture limits like port mirroring drops
    rubric:
      excellent: Picks capture points to split the path, synchronises and filters them, and explains how to match packets across points to find where loss, delay or modification happens.
      good: Captures at both ends and compares.
      weak: Takes one capture and draws conclusions.
    followups:
      - How do you match the same packet across two captures when NAT is in between?
      - What are the risks of capturing on a busy production link?
    common_errors:
      - Trusting a mirrored port that silently drops packets under load.

  - external_key: technical.network.daily_latency_spike
    competency_key: network_engineering
    topic: Recurring latency spikes
    difficulty: medium
    kind: scenario
    text: >-
      Every day at around the same time, latency between two sites spikes and some applications time out.
      How would you find the cause?
    expected_concepts:
      - correlating with scheduled jobs such as backups or replication
      - link utilisation and queue drops during the window
      - flow data to identify top talkers
      - provider-side issues
      - continuous probes between the sites
    rubric:
      excellent: Uses the timing as a clue, correlates utilisation, queue drops and flow data to find the traffic responsible, and proposes scheduling, shaping or QoS fixes.
      good: Suspects a scheduled job and checks utilisation.
      weak: Raises a ticket with the provider without gathering evidence.
    followups:
      - Utilisation looks normal on five-minute graphs. Could the link still be congested?
      - How would you prove the provider is at fault if it isn't you?
    common_errors:
      - Relying on averaged graphs that hide short bursts.

  - external_key: technical.network.many_vnets_interconnect
    competency_key: network_engineering
    topic: Connecting many virtual networks
    difficulty: medium
    kind: technical
    text: >-
      When you have to connect dozens of VPCs or virtual networks, how do you choose between direct peering,
      a central transit hub, and private endpoints for individual services?
    expected_concepts:
      - peering is non-transitive and grows as a mesh
      - transit gateway or hub for central routing and inspection
      - private endpoints exposing one service without full network access
      - cost and throughput differences
      - non-overlapping address planning
      - route table segmentation
    rubric:
      excellent: Matches each option to scale, segmentation and inspection needs, notes transitivity and cost, and stresses address planning.
      good: Explains peering versus hub and when each fits.
      weak: Proposes full mesh peering everywhere without considering scale.
    followups:
      - How would you keep production and development networks apart on a shared hub?
      - When would a private endpoint be better than any network-level connection?
    common_errors:
      - Assuming peered networks can route through each other.

  - external_key: technical.network.private_endpoint_dns_mismatch
    competency_key: networking
    topic: Private endpoints and DNS
    difficulty: medium
    kind: scenario
    text: >-
      After switching a cloud storage service to a private endpoint, some workloads still reach it over the
      public internet and others can't reach it at all. What's going on?
    expected_concepts:
      - private DNS zones linked to the right networks
      - workloads using custom or on-premises resolvers
      - public access disabled for clients still resolving publicly
      - checking what each workload resolves the name to
      - conditional forwarding for hybrid clients
    rubric:
      excellent: Identifies inconsistent name resolution as the root cause, checks it per workload, and fixes zone links and forwarding so every client resolves the private address.
      good: Suspects DNS and checks the private zone.
      weak: Focuses on routes or firewall rules only.
    followups:
      - How would on-premises servers resolve the private address?
      - Why do some workloads ignore the private zone?
    common_errors:
      - Linking the private zone to only some of the virtual networks.

  - external_key: technical.network.flow_records_value
    competency_key: observability
    topic: Using flow data
    difficulty: medium
    kind: technical
    text: >-
      How have you used flow data such as NetFlow, sFlow or VPC flow logs, and what questions does it answer
      that interface counters can't?
    expected_concepts:
      - who is talking to whom and on which ports
      - top talkers behind utilisation spikes
      - sampling and its accuracy limits
      - security investigations and unexpected flows
      - building segmentation policy from observed flows
    rubric:
      excellent: Gives concrete uses from experience, explains sampling trade-offs, and contrasts flow data with counters and full packet capture.
      good: Explains what flow data contains and one or two uses.
      weak: Cannot distinguish flow data from interface statistics.
    followups:
      - What can sampled flow data miss?
      - How would you keep flow data costs under control in the cloud?
    common_errors:
      - Treating sampled data as exact counts.

  - external_key: technical.network.alert_fatigue_redesign
    competency_key: observability
    topic: Redesigning noisy network alerting
    difficulty: medium
    kind: scenario
    text: >-
      Your network team gets hundreds of alerts a day and has started ignoring them. How would you redesign
      network alerting so the important ones stand out?
    expected_concepts:
      - reviewing which alerts led to action
      - alerting on impact such as reachability and loss
      - suppressing dependent alerts behind a failed upstream device
      - severity levels and routing
      - deduplication and grouping
      - ongoing review of alert quality
    rubric:
      excellent: Uses data on past alerts to cut noise, shifts alerts toward user impact, adds dependency suppression and grouping, and builds a review habit.
      good: Proposes removing noisy alerts and setting severities.
      weak: Raises thresholds across the board.
    followups:
      - A core switch fails and fifty downstream alerts fire. How should that look instead?
      - How do you decide something should be a dashboard rather than an alert?
    common_errors:
      - Removing noise without checking whether real incidents would still be caught.

  - external_key: technical.network.data_transfer_cost_spike
    competency_key: networking
    topic: Cloud data transfer charges
    difficulty: medium
    kind: scenario
    text: >-
      The monthly cloud bill shows a big jump in data transfer charges. How would you find which traffic is
      responsible and bring the cost down?
    expected_concepts:
      - breaking down costs by type such as internet egress, cross-zone or NAT processing
      - flow logs to find sources and destinations
      - NAT gateway processing for traffic that could use endpoints
      - cross-zone chatter between services
      - CDN, caching and compression
    rubric:
      excellent: Breaks the bill down by transfer type, traces flows to responsible workloads, and proposes targeted fixes such as private endpoints, zone-aware routing or caching.
      good: Uses billing data and flow logs to find the source with some reasonable fixes.
      weak: Suggests a different instance type or region without investigating.
    followups:
      - Why does traffic to a storage service sometimes cost more through a NAT gateway?
      - How would you stop a similar surprise next month?
    common_errors:
      - Overlooking cross-zone traffic as a cost.

  - external_key: technical.network.config_automation_start
    competency_key: network_engineering
    topic: Starting network automation
    difficulty: medium
    kind: technical
    text: >-
      How would you start automating configuration on a network that's currently managed by hand over SSH,
      and how do you stop automation from pushing a bad change everywhere at once?
    expected_concepts:
      - source of truth for intended state
      - templates and version control
      - starting with read-only tasks like backups and audits
      - dry runs and diffs before deployment
      - staged rollout to a canary set of devices
      - peer review of changes
    rubric:
      excellent: Proposes an incremental path from read-only to write, built on a source of truth and version control, with dry runs, canaries and review to limit blast radius.
      good: Proposes templates and a tool with some safety checks.
      weak: Writes scripts that push to every device without staging.
    followups:
      - Which tasks would you automate first, and why?
      - How do you deal with devices that were changed by hand outside the tool?
    common_errors:
      - Automating writes before having an accurate source of truth.

  - external_key: technical.network.config_drift_detection
    competency_key: network_engineering
    topic: Configuration backups and drift
    difficulty: medium
    kind: technical
    text: >-
      How do you make sure you always know the current and previous configuration of every network device,
      and can tell when someone changes something outside the normal process?
    expected_concepts:
      - scheduled configuration backups into version control
      - diffs and change notifications
      - comparing running state to intended state
      - linking changes to approved change records
      - AAA logging of who changed what
    rubric:
      excellent: Describes automated backups with history, drift detection against intended state, and auditing of who made changes tied to change records.
      good: Backs up configurations regularly and compares versions.
      weak: Relies on manual copies.
    followups:
      - A drift alert shows an unapproved ACL change. What do you do?
      - How do you handle secrets in stored configurations?
    common_errors:
      - Storing configurations with plaintext secrets.

  - external_key: technical.network.pod_egress_path
    competency_key: networking
    topic: Container traffic leaving a cluster
    difficulty: medium
    kind: technical
    text: >-
      When a containerised application talks to a service outside its cluster, what happens to its packets
      on the way out, and where can that path break?
    expected_concepts:
      - container interface into the node's network namespace
      - overlay or routed pod networking
      - source NAT to the node address
      - connection tracking on the node
      - network policies restricting egress
      - external firewalls seeing node addresses instead of pod addresses
    rubric:
      excellent: Traces the packet from the container through the node and NAT to the outside, and names specific failure points such as policies, conntrack limits and firewall allow lists based on node addresses.
      good: Explains that traffic is NATed to the node and one failure point.
      weak: Cannot describe the path beyond the container.
    followups:
      - An external firewall only allows certain source addresses. How do you handle pods that move between nodes?
      - How would you capture traffic for a single pod?
    common_errors:
      - Expecting external systems to see the pod's own address.

  # ------------------------------------------------------------------ hard
  - external_key: technical.network.hybrid_name_resolution
    competency_key: networking
    topic: Hybrid DNS resolution
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      In a hybrid setup, on-premises servers need to resolve names in cloud private zones, and cloud
      workloads need to resolve internal corporate names. How would you design that, and how would you debug
      it when it fails?
    expected_concepts:
      - inbound and outbound resolver endpoints in the cloud
      - conditional forwarders in both directions
      - avoiding forwarding loops
      - redundancy of resolvers across zones and sites
      - firewall rules for DNS over UDP and TCP
      - querying each hop directly when debugging
    rubric:
      excellent: Designs forwarding in both directions with redundancy and no loops, and has a step-by-step debugging approach that queries each resolver in the chain.
      good: Proposes conditional forwarders and resolver endpoints.
      weak: Proposes copying records between systems manually.
    followups:
      - Resolution works from one data centre but not the other. Where do you look?
      - Why must DNS over TCP be allowed too?
    common_errors:
      - Creating a forwarding loop between on-premises and cloud resolvers.

  - external_key: technical.network.conntrack_table_full
    competency_key: linux
    topic: Connection tracking exhaustion
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A Linux-based firewall or NAT host starts dropping new connections at peak traffic, even though CPU and
      bandwidth look fine. What would you suspect, and how would you confirm it?
    expected_concepts:
      - connection tracking table full
      - kernel log messages about dropped packets
      - comparing conntrack count with its maximum
      - timeouts holding entries for idle or closed flows
      - raising limits and hash table size with memory in mind
      - skipping tracking for traffic that doesn't need it
    rubric:
      excellent: Identifies conntrack exhaustion, confirms it from kernel logs and counters, and fixes it by tuning limits and timeouts and excluding untracked traffic, explaining memory trade-offs.
      good: Suspects conntrack and knows how to check the count.
      weak: Suggests a bigger machine without diagnosis.
    followups:
      - Which timeouts would you look at first?
      - What kind of traffic is a good candidate for skipping tracking?
    common_errors:
      - Raising the maximum without considering the hash table and memory.

  - external_key: technical.network.partial_loss_fabric
    competency_key: network_engineering
    topic: Gray failures in a fabric
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You see a small percentage of packet loss between some pairs of servers in a large fabric but not
      others, and no interface errors anywhere. How would you track down the faulty component?
    expected_concepts:
      - ECMP hashing sending some flows over a bad path
      - probing with varied source ports to map paths
      - silent drops in line cards or forwarding tables
      - comparing drop counters beyond interface errors
      - draining suspect devices to confirm
    rubric:
      excellent: Recognises a partial path failure hidden by ECMP, uses port-varied probes to map and isolate the path, and confirms by draining the suspect device.
      good: Suspects one path in the fabric and proposes testing paths individually.
      weak: Looks only at server-side settings or interface error counters.
    followups:
      - Why does the same pair of servers see loss on some connections but not others?
      - How would you detect this kind of problem automatically?
    common_errors:
      - Concluding the network is fine because no interface errors are reported.

  - external_key: technical.network.segregated_multi_region_design
    competency_key: network_engineering
    topic: Multi-region hybrid network design
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      An application will run in two cloud regions plus an on-premises data centre, with strict separation
      between production and non-production. What are the key network design decisions you'd make?
    expected_concepts:
      - address plan with room for growth and no overlaps
      - separate routing domains or route tables per environment
      - redundant private connectivity to each region
      - inter-region links and failover behaviour
      - centralised or distributed inspection and egress
      - DNS design across all three locations
    rubric:
      excellent: Makes and justifies decisions on addressing, segmentation, connectivity redundancy, inspection and DNS, and explains how separation is enforced and tested.
      good: Covers connectivity and environment separation with reasonable choices.
      weak: Draws a single flat network connecting everything.
    followups:
      - How would you prove that non-production can't reach production?
      - What happens to on-premises traffic if one region's private link fails?
    common_errors:
      - Separating environments by convention only, without enforced routing boundaries.

  - external_key: technical.network.link_capacity_planning
    competency_key: network_engineering
    topic: WAN and internet capacity planning
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you do capacity planning for WAN and internet links, and how do you decide whether to upgrade a
      link or engineer the traffic differently?
    expected_concepts:
      - percentile utilisation rather than averages
      - growth trends and planned projects
      - headroom for failover when a link is lost
      - provider lead times
      - traffic engineering, caching or QoS as alternatives
      - cost comparison of options
    rubric:
      excellent: Uses percentile data and growth trends, plans for failure scenarios and lead times, and compares upgrades against traffic engineering on cost and risk.
      good: Uses utilisation trends and plans upgrades ahead of time.
      weak: Upgrades only after users complain.
    followups:
      - If one of two links fails, can the other carry the load? How do you plan for that?
      - Why might average utilisation be misleading?
    common_errors:
      - Not planning capacity for the failure case.

  - external_key: technical.network.routing_change_outage
    competency_key: incident_response
    topic: Leading a network outage response
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A core routing change causes a partial outage across several sites, and you're leading the network side
      of the incident. How do you run the response and the follow-up?
    expected_concepts:
      - rolling back first to restore service
      - clear roles and a single communication channel
      - regular status updates to stakeholders
      - preserving evidence such as logs and configs
      - blameless review with contributing factors
      - actions to improve change validation
    rubric:
      excellent: Prioritises restoring service through rollback, coordinates roles and communication, keeps evidence, and drives a blameless review with concrete change-process improvements.
      good: Rolls back and communicates, with a basic review afterwards.
      weak: Debugs the change live while the outage continues.
    followups:
      - The rollback doesn't fully restore service. What now?
      - What would you change so a similar change is caught before production?
    common_errors:
      - Trying to fix forward under pressure instead of rolling back.

  - external_key: technical.network.proactive_path_monitoring
    competency_key: observability
    topic: Detecting user-visible network problems
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you build monitoring that catches user-visible network problems, such as a degraded path to
      a cloud provider or a SaaS application, before users report them?
    expected_concepts:
      - synthetic probes from user locations
      - measuring latency, loss and jitter over time
      - application-level checks like DNS, TLS and HTTP timings
      - baselines and anomaly detection
      - path visibility through providers
      - correlating with device and flow data
    rubric:
      excellent: Designs synthetic monitoring from the user's perspective with application-level timings, baselining and correlation that points toward which segment is degraded.
      good: Proposes synthetic probes and alerts on latency and loss.
      weak: Relies only on device health monitoring.
    followups:
      - Where would you place the probes, and why?
      - How would you tell whether the problem is in your network or the provider's?
    common_errors:
      - Monitoring only infrastructure inside your own network.
