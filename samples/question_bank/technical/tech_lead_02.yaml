# Tech lead, part 2: code review standards and mentoring through code.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [tech_lead]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.tech_lead.writing_review_guidelines
    competency_key: code_quality
    topic: Writing a team's code review guidelines
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you were writing your team's code review guidelines from scratch, what would you put in them, and what
      would you deliberately leave out?
    expected_concepts:
      - purpose of review such as correctness, shared understanding and maintainability
      - what authors owe reviewers, like context, small changes and tests
      - how to label comments as blocking or optional
      - expected response times
      - leaving formatting and style to automated tools
    rubric:
      excellent: Produces short, purposeful guidelines covering both author and reviewer responsibilities and comment severity, explains what was left out and why, and mentions how the guidelines were adopted on a real team.
      good: Covers the main expectations for reviewers and authors with sensible priorities.
      weak: Lists style rules or a long checklist with no sense of purpose or priority.
    followups:
      - How would you get the team to actually follow the guidelines rather than just agree to them?
    common_errors:
      - Writing guidelines only for reviewers and saying nothing about what authors should provide.

  - external_key: technical.tech_lead.review_turnaround_expectations
    competency_key: collaboration
    topic: Keeping code review from becoming a bottleneck
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What expectations do you set for how quickly pull requests get reviewed, and how do you keep review from
      becoming the thing that slows your team down?
    expected_concepts:
      - an explicit turnaround target, such as within one working day
      - reviewing before starting new work
      - small pull requests that are quick to review
      - visibility of waiting reviews, for example a dashboard or channel
      - spreading review across the team
    rubric:
      excellent: Sets a clear turnaround norm, explains the habits and tooling that make it achievable, ties it to pull request size, and describes how they noticed and fixed a slow review culture.
      good: Has a reasonable target and a couple of practices to meet it.
      weak: Has no expectations, or speeds review up by lowering the bar to rubber-stamping.
    followups:
      - What would you look at first if pull requests were routinely waiting three days?
    common_errors:
      - Measuring speed alone and ignoring whether reviews still catch problems.

  - external_key: technical.tech_lead.automating_standards
    competency_key: code_quality
    topic: Enforcing standards with tooling
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Which code standards do you prefer to enforce with tooling instead of human reviewers, and how would you
      introduce a new lint rule into a codebase that already breaks it in hundreds of places?
    expected_concepts:
      - formatters, linters and type checkers in CI
      - pre-commit hooks for fast feedback
      - baselining existing violations and blocking only new ones
      - automated fixes where available
      - agreeing on rules with the team first
    rubric:
      excellent: Moves mechanical rules into tooling, introduces new rules with a baseline or ratchet so they block only new code, uses autofix where possible and gets team agreement on the rule set.
      good: Enforces formatting and linting in CI and has a sensible rollout for new rules.
      weak: Relies on reviewers to point out style issues, or turns on rules that break the build everywhere at once.
    followups:
      - How do you decide whether a rule is worth the friction it adds?
    common_errors:
      - Fixing every existing violation in one huge pull request that is impossible to review.

  - external_key: technical.tech_lead.encouraging_small_changes
    competency_key: code_quality
    topic: Keeping pull requests small
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you encourage your team to send small, reviewable pull requests, especially when the feature itself
      is large?
    expected_concepts:
      - splitting by layer or by vertical slice
      - feature flags to merge incomplete work safely
      - stacked or dependent pull requests
      - separating refactors from behaviour changes
      - planning the breakdown before coding
    rubric:
      excellent: Gives concrete techniques for splitting work, explains how flags allow merging unfinished features, and shows how they built the habit through planning and example rather than rules alone.
      good: Knows a few splitting techniques and why small changes help.
      weak: Asks for small pull requests without offering any way to achieve them.
    followups:
      - How would you split a new API endpoint plus database changes plus UI into separate changes?
    common_errors:
      - Splitting purely by file count so each piece makes no sense on its own.

  - external_key: technical.tech_lead.teaching_through_review_comments
    competency_key: mentoring
    topic: Review comments that teach
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you review code from a less experienced engineer, how do you write comments so they learn the reasoning
      behind a change, not just make the fix you asked for?
    expected_concepts:
      - explaining the why and the risk being avoided
      - asking questions that lead them to the problem
      - linking to examples, docs or prior incidents
      - labelling comments by importance
      - following up in person for larger lessons
    rubric:
      excellent: Explains reasoning and consequences, mixes questions with direct guidance depending on importance, calibrates severity, and moves larger topics to a conversation, with a real example.
      good: Explains reasons in comments and stays respectful and clear.
      weak: Leaves terse instructions or rewrites the code themselves.
    followups:
      - When do you just tell someone the answer instead of asking a leading question?
    common_errors:
      - Burying the one important issue among a dozen minor style comments.

  - external_key: technical.tech_lead.pairing_for_mentoring
    competency_key: mentoring
    topic: Pair programming as a mentoring tool
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When do you choose to pair with someone instead of reviewing their code afterwards, and how do you run a
      pairing session so the other person is doing the learning?
    expected_concepts:
      - pairing for unfamiliar areas, tricky designs or debugging
      - letting the learner drive the keyboard
      - thinking aloud to share reasoning
      - agreeing a goal and time-box for the session
      - stepping back as their skill grows
    rubric:
      excellent: Chooses pairing deliberately for situations where it beats async review, lets the learner drive, narrates their own reasoning, and describes how they tapered off support.
      good: Uses pairing sensibly and lets the other person take part actively.
      weak: Pairs by taking over the keyboard, or never pairs.
    followups:
      - How do you know when to stop pairing with someone on a particular area?
    common_errors:
      - Solving the problem quickly while the other person watches.

  - external_key: technical.tech_lead.new_hire_first_pull_request
    competency_key: mentoring
    topic: Reviewing a new hire's first pull request
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A new engineer's first pull request has a lot of problems, from missing tests to code that doesn't follow
      the team's patterns. How would you approach that review?
    expected_concepts:
      - prioritising the few issues that matter most
      - explaining team conventions and where they are documented
      - offering a short call or pairing instead of many comments
      - recognising what was done well
      - noting gaps in onboarding material
    rubric:
      excellent: Focuses on the most important issues, uses a conversation for the rest, points to conventions, and treats the volume of issues as a sign of onboarding gaps to fix.
      good: Gives clear, prioritised feedback in a supportive way.
      weak: Leaves dozens of comments at once or approves to avoid discouraging them.
    followups:
      - What would you change about onboarding after seeing this pull request?
    common_errors:
      - Lowering the standard for new hires instead of helping them meet it.

  - external_key: technical.tech_lead.rubber_stamp_approvals
    competency_key: code_quality
    topic: Addressing rubber-stamp approvals
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You notice that one engineer approves almost every pull request within minutes and never leaves comments.
      How would you look into that and what would you do?
    expected_concepts:
      - checking the facts before assuming a problem
      - a private conversation to understand why
      - possible causes such as time pressure, unclear expectations or unfamiliarity with the code
      - clarifying what a review approval means on the team
      - pairing on reviews to model what good looks like
    rubric:
      excellent: Investigates before concluding, understands the cause, clarifies what an approval commits the reviewer to, and models good reviews, while checking whether team incentives encourage speed over care.
      good: Has a direct conversation and resets expectations.
      weak: Ignores it, or calls the person out publicly.
    followups:
      - What if the cause is that the team is under heavy deadline pressure?
    common_errors:
      - Assuming fast approvals are always careless without looking at the changes involved.

  # ---------------------------------------------------------------- medium
  - external_key: technical.tech_lead.reviewing_small_risky_config
    competency_key: code_quality
    topic: Reviewing a small but risky change
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A three-line pull request changes the default value of a configuration setting used by every customer. It
      looks trivial. How would you review a change like that?
    expected_concepts:
      - recognising that blast radius matters more than diff size
      - understanding which code paths read the setting
      - staged rollout or feature flag instead of a global default change
      - monitoring and a quick way to revert
      - asking for evidence the new value has been tested
    rubric:
      excellent: Judges the change by its impact rather than its size, traces where the setting is used, requires a staged rollout with monitoring and rollback, and gives an example of a small change that caused a large incident.
      good: Recognises the risk and asks for testing and a rollback plan.
      weak: Approves quickly because the diff is small.
    followups:
      - How could your review process flag high-risk files automatically?
    common_errors:
      - Assessing review effort by lines changed rather than by what the change can affect.

  - external_key: technical.tech_lead.judging_test_adequacy
    competency_key: testing
    topic: Judging whether tests are adequate
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you review a pull request, how do you judge whether its tests are actually adequate, beyond looking at a
      coverage number?
    expected_concepts:
      - tests exercise the behaviour that changed, including edge and failure cases
      - a bug fix comes with a test that failed before the fix
      - assertions that would catch a regression, not just run the code
      - the right level of test for the risk
      - tests that are readable as documentation
    rubric:
      excellent: Checks that tests target changed behaviour and failure paths, insists on regression tests for bug fixes, looks at assertion strength and test level, and explains why coverage alone misleads.
      good: Looks for edge cases and meaningful assertions in addition to coverage.
      weak: Accepts any tests that make the coverage tool happy.
    followups:
      - How would you check that a test would actually fail if the code were wrong?
    common_errors:
      - Treating line coverage as proof the behaviour is tested.

  - external_key: technical.tech_lead.spreading_review_load
    competency_key: collaboration
    topic: Spreading review load and knowledge
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      On many teams, one or two people end up reviewing most of the code. How do you spread review work so it
      doesn't all fall on a few people and knowledge spreads across the team?
    expected_concepts:
      - code ownership files that list several reviewers per area
      - rotating or round-robin assignment
      - pairing a less familiar reviewer with an expert
      - tracking review distribution
      - the lead deliberately stepping back from some reviews
    rubric:
      excellent: Uses ownership rules and assignment to spread load, pairs newer reviewers with experts to build knowledge, watches the distribution over time, and deliberately reduces their own role as gatekeeper.
      good: Rotates reviewers and encourages wider participation.
      weak: Accepts that the most senior people review everything.
    followups:
      - What if only one person truly understands a critical part of the system?
    common_errors:
      - The tech lead insisting on approving every change personally.

  - external_key: technical.tech_lead.recurring_mistake_pattern
    competency_key: mentoring
    topic: Addressing a recurring mistake pattern
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Over several pull requests, you notice a mid-level engineer keeps making the same kind of mistake, say
      unsafe retries without idempotency. How would you address it beyond commenting on each pull request?
    expected_concepts:
      - a one-to-one conversation about the underlying concept
      - pairing on the next change in that area
      - pointing to examples or incidents that show the risk
      - checking whether the team lacks a shared pattern or helper
      - automation or a checklist item if the mistake is common
    rubric:
      excellent: Addresses the root concept directly with the engineer, provides practice and examples, and also asks whether the codebase or team guidance makes the mistake easy to repeat, fixing that too.
      good: Talks to the engineer and helps them understand the concept.
      weak: Keeps leaving the same comment or escalates without trying to teach.
    followups:
      - How would you tell whether the lesson has stuck?
    common_errors:
      - Treating a repeated mistake as a single person's failing when the codebase invites it.

  - external_key: technical.tech_lead.delegating_a_stretch_task
    competency_key: mentoring
    topic: Delegating work you could do faster yourself
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      There's a tricky piece of work you could finish in two days, while a less experienced engineer would probably
      need a week. How do you decide who does it, and if you hand it over, how do you set them up to succeed?
    expected_concepts:
      - weighing deadline pressure against growth and team resilience
      - clear scope, success criteria and checkpoints
      - an early design discussion before coding starts
      - being available without taking over
      - recognising when to step in
    rubric:
      excellent: Makes an explicit trade-off between short-term speed and long-term capability, sets the task up with clear goals and early checkpoints, and describes a real case including how they handled a point where the engineer got stuck.
      good: Delegates with reasonable support and check-ins.
      weak: Always does it themselves, or hands it over with no support.
    followups:
      - At what point would you take the work back, and how would you do that?
    common_errors:
      - Delegating the task but then reviewing so heavily that the engineer learns nothing.

  - external_key: technical.tech_lead.establishing_review_standards
    competency_key: leadership
    topic: Introducing review standards to a team
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You join a team as tech lead and find there are no real review standards. Some changes get merged without
      review and quality varies widely. How would you raise the bar without stalling delivery?
    expected_concepts:
      - observing and understanding current practice first
      - agreeing a small set of standards with the team
      - branch protection and required reviews for critical areas first
      - automating style and checks to keep reviews focused
      - modelling good reviews personally
      - checking the effect after a few weeks
    rubric:
      excellent: Learns why things are the way they are, introduces a few agreed standards gradually starting with the riskiest areas, automates what can be automated, models the behaviour, and measures the effect on both quality and delivery.
      good: Introduces reasonable standards with team input.
      weak: Imposes strict rules on day one or leaves the situation unchanged.
    followups:
      - How would you handle someone who says reviews just slow them down?
    common_errors:
      - Introducing rules before understanding what pressures produced the current habits.

  - external_key: technical.tech_lead.maintainability_feedback
    competency_key: code_quality
    topic: Feedback on maintainability
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Beyond passing tests, what makes code maintainable in your view? Give me examples of the kind of feedback
      you've given about naming, structure or boundaries.
    expected_concepts:
      - names that express intent in the domain language
      - functions and modules with a single clear responsibility
      - clear boundaries and dependency direction
      - explicit error handling
      - avoiding premature abstraction as well as duplication
    rubric:
      excellent: Gives specific, real examples of maintainability feedback, explains the future cost each one avoided, and balances simplicity against abstraction rather than following rules mechanically.
      good: Names several sensible maintainability qualities with some examples.
      weak: Talks only in generalities like clean code, or focuses on formatting.
    followups:
      - Tell me about a time you pushed back on an abstraction that was introduced too early.
    common_errors:
      - Treating any duplication as a defect and creating abstractions that couple unrelated code.

  - external_key: technical.tech_lead.growing_debugging_skill
    competency_key: mentoring
    topic: Teaching debugging
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When someone on your team is stuck on a bug, how do you help them become a better debugger rather than just
      pointing at the problem?
    expected_concepts:
      - asking what they have observed and tried
      - teaching hypothesis-driven debugging
      - showing tools such as debuggers, logs, tracing and bisecting
      - letting them drive while you ask questions
      - reflecting afterwards on what would have found it faster
    rubric:
      excellent: Coaches a structured approach through questions, introduces the right tools at the right moment, lets the engineer drive, and closes with a short reflection, with an example of someone who improved.
      good: Guides rather than solves and shares useful techniques.
      weak: Finds and fixes the bug for them.
    followups:
      - How do you balance teaching against an urgent production issue?
    common_errors:
      - Coaching through questions during an outage when the priority is restoring service.

  - external_key: technical.tech_lead.self_merging_senior
    competency_key: leadership
    topic: A senior engineer bypassing review
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An experienced engineer on your team regularly merges large changes without waiting for review, saying it's
      urgent and that they know the code best. How would you handle it?
    expected_concepts:
      - a private conversation to understand the pressures involved
      - explaining the purpose of review beyond catching bugs
      - agreeing a fast path for genuine emergencies with review afterwards
      - branch protection applied equally to everyone
      - involving them in shaping the review process
    rubric:
      excellent: Understands the reasons, explains the risk and the knowledge-sharing cost, offers a legitimate emergency path, applies the same rules to everyone, and gives the engineer a role in improving the process.
      good: Addresses it directly and sets clear expectations.
      weak: Tolerates it because the engineer is senior, or only adds a technical block without discussion.
    followups:
      - What if a manager supports the engineer because they deliver quickly?
    common_errors:
      - Making exceptions for senior engineers, which tells everyone else the rules are optional.

  - external_key: technical.tech_lead.wrong_approach_in_finished_pr
    competency_key: code_quality
    topic: A finished pull request with the wrong approach
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A large, well-written pull request lands in your queue, but you think the overall approach is wrong for the
      system. The engineer has spent two weeks on it. How do you respond, and what would you change so it doesn't
      happen again?
    expected_concepts:
      - talking it through in person before writing review comments
      - separating parts worth keeping from the approach itself
      - weighing the cost of the wrong approach against rework
      - agreeing a path, possibly merging with follow-up work
      - earlier design check-ins for larger tasks
    rubric:
      excellent: Moves to a conversation, explains the concern with concrete consequences, makes a proportionate call about rework, salvages what is good, and fixes the process gap by introducing earlier design discussions.
      good: Raises the concern clearly and agrees a way forward.
      weak: Approves to avoid friction, or rejects the work outright in comments.
    followups:
      - What if the wrong approach is only somewhat worse but fixing it would delay a release?
    common_errors:
      - Treating it purely as the engineer's mistake when nobody checked the approach early.

  - external_key: technical.tech_lead.reviewing_ai_assisted_code
    competency_key: code_quality
    topic: Review standards for AI-assisted code
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      More and more code is written with AI coding assistants. How has that changed, or how should it change,
      the way your team writes and reviews code?
    expected_concepts:
      - the author stays accountable for understanding every line
      - closer checks on plausible but subtly wrong logic and invented APIs
      - security issues and licence concerns in generated code
      - larger diffs and the risk of review fatigue
      - stronger reliance on tests and automated checks
    rubric:
      excellent: Keeps author accountability clear, names specific failure modes of generated code, adapts review and testing practice accordingly, and describes concrete team norms they have set or would set.
      good: Recognises the main risks and requires authors to understand and test generated code.
      weak: Either bans the tools without reasoning or reviews generated code no differently.
    followups:
      - How would you notice if generated code was lowering quality over time?
    common_errors:
      - Assuming generated code that compiles and passes a few tests is correct.

  # ------------------------------------------------------------------ hard
  - external_key: technical.tech_lead.measuring_review_health
    competency_key: code_quality
    topic: Measuring the health of code review
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you tell whether your team's code review process is actually healthy? Which signals would you
      look at, and how would you avoid people gaming them?
    expected_concepts:
      - time to first review and time to merge
      - pull request size distribution
      - review distribution across people
      - escaped defects and incidents traced back to reviewed changes
      - qualitative feedback from the team
      - using metrics for conversation, not individual targets
    rubric:
      excellent: Combines flow, quality and distribution signals with team feedback, explains the limitations of each metric, uses them to start conversations rather than rank people, and describes an improvement driven by the data.
      good: Picks several meaningful metrics and recognises some limitations.
      weak: Relies on a single number such as comments per pull request or sets individual targets.
    followups:
      - Which metric would you never put on a team dashboard, and why?
    common_errors:
      - Turning review metrics into individual performance targets.

  - external_key: technical.tech_lead.mentoring_at_scale
    competency_key: mentoring
    topic: Growing technical skill across a team
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You can't pair with everyone on your team every week. How do you raise the technical skill of several
      engineers at once while still delivering?
    expected_concepts:
      - understanding each person's goals and gaps
      - matching work assignments to growth areas
      - peer mentoring and pairing between team members
      - design reviews and incident reviews as teaching moments
      - shared learning sessions or code walkthroughs
      - checking progress over time
    rubric:
      excellent: Uses work itself as the main teaching tool, creates peer learning structures so mentoring does not depend on them, tailors growth to individuals, and gives evidence of engineers who grew as a result.
      good: Uses a mix of approaches beyond one-to-one mentoring.
      weak: Relies on ad hoc help or courses with no link to actual work.
    followups:
      - How do you make sure quieter engineers get stretch opportunities too?
    common_errors:
      - Giving the most interesting work only to the strongest engineers to protect the schedule.

  - external_key: technical.tech_lead.incident_from_approved_change
    competency_key: ownership
    topic: An incident caused by a change you approved
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A production incident is traced back to a change you reviewed and approved. How do you handle the aftermath,
      and what would you change in how your team reviews code?
    expected_concepts:
      - owning the shared responsibility openly
      - a blameless review focused on the system and process
      - understanding why the review did not catch it
      - preventive changes such as tests, automation or staged rollout
      - not expecting review alone to catch everything
    rubric:
      excellent: Takes visible shared ownership, leads a blameless analysis of why the defect passed review, and puts in systemic safeguards beyond more careful reviewing, recognising review as one layer among several.
      good: Owns the mistake and proposes reasonable process improvements.
      weak: Places blame on the author or concludes that reviewers just need to try harder.
    followups:
      - How would you protect the author from feeling singled out?
    common_errors:
      - Adding more mandatory reviewers, which slows delivery without addressing the gap.

  - external_key: technical.tech_lead.handing_over_a_subsystem
    competency_key: ownership
    topic: Handing over ownership of a subsystem you built
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You built a core subsystem and you're still the only person who really understands it, so every change
      waits for you. How would you transfer ownership so you stop being the bottleneck?
    expected_concepts:
      - choosing and agreeing on new owners
      - documentation of design, failure modes and runbooks
      - new owners making real changes with your support, then without it
      - handing over on-call and decision rights explicitly
      - deliberately stepping back from reviews and questions
    rubric:
      excellent: Plans a staged handover with real changes led by the new owners, writes the documentation that only they can write, transfers decision rights explicitly, and resists stepping back in, with a measure of when the handover is complete.
      good: Documents the system and gives others hands-on experience.
      weak: Writes documentation alone and assumes ownership has moved.
    followups:
      - How would you know when the handover is really complete?
    common_errors:
      - Continuing to answer every question, so the team never needs the new owners.

  - external_key: technical.tech_lead.inner_source_contributions
    competency_key: collaboration
    topic: Accepting contributions from other teams
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Other teams have started sending pull requests to your team's codebase so they don't have to wait for you,
      but the quality is uneven and your team is spending a lot of time on review. How would you set this up to work
      well?
    expected_concepts:
      - contribution guidelines and architecture notes for outsiders
      - early design discussion for larger contributions
      - templates, tests and CI checks that catch common issues
      - a named contact or rotation for external reviews
      - clear ownership of contributed code after merge
    rubric:
      excellent: Treats contributions as a product with clear guidelines, early design check-ins, automated checks and a review rotation, and settles who maintains contributed code, while keeping the benefit of unblocking other teams.
      good: Writes guidelines and sets expectations for contributors.
      weak: Stops accepting contributions or accepts them without standards.
    followups:
      - Who should be on call for a feature another team contributed?
    common_errors:
      - Leaving ownership of contributed code unclear until it breaks.

  - external_key: technical.tech_lead.risk_based_review_rigour
    competency_key: code_quality
    topic: Matching review rigour to risk
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Should every part of the codebase get the same level of review? How would you decide how strict review and
      testing should be for, say, payment logic versus an internal admin tool versus a prototype?
    expected_concepts:
      - classifying areas by impact of failure
      - stricter rules such as two reviewers or domain experts for critical paths
      - lighter review for low-risk or throwaway code
      - code ownership rules to route reviews by area
      - clear criteria for when a prototype must meet production standards
    rubric:
      excellent: Defines explicit risk tiers with matching review and testing expectations, enforces them through tooling, and sets a clear rule for when prototype code must be brought up to production standard.
      good: Applies stricter review to critical areas with sensible reasons.
      weak: Applies one standard everywhere, or relaxes standards without criteria.
    followups:
      - How do you stop a prototype quietly becoming production code?
    common_errors:
