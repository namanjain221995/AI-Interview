# Curated questions: backend API design (authentication, authorization and API security).
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [backend]
questions:
  - external_key: technical.backend_apis.sessions_vs_bearer_tokens
    competency_key: security
    topic: Cookie sessions versus bearer tokens
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      For an API used by your own web app, how do you decide between cookie-based sessions and bearer
      tokens? What trade-offs have you seen in practice?
    expected_concepts:
      - HttpOnly, Secure and SameSite cookies
      - cookies need CSRF protection
      - tokens readable by JavaScript are exposed to XSS
      - server-side sessions are easy to revoke
      - mobile and third-party clients favour tokens
      - backend-for-frontend pattern
    rubric:
      excellent: Compares storage, XSS and CSRF exposure, revocation and client types, and justifies a choice for the web app (often secure cookies or a backend-for-frontend) with experience.
      good: Explains the main security difference and picks one with a reason.
      weak: Stores long-lived tokens in local storage without seeing a risk, or cannot compare the options.
    followups:
      - Where would you store tokens in a single-page app, and why?
      - How does your choice change if a mobile app uses the same API?
    common_errors:
      - Believing JWTs remove the need for any server-side state or revocation.

  - external_key: technical.backend_apis.jwt_validation_checks
    competency_key: security
    topic: Validating JWTs
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When your service receives a JWT, what exactly should it check before trusting it?
    expected_concepts:
      - signature using an expected algorithm only
      - rejecting alg none and algorithm confusion
      - issuer and audience
      - expiry and not-before with small clock skew
      - keys fetched from JWKS by kid and cached
      - required claims such as scopes
    rubric:
      excellent: Lists signature, algorithm pinning, issuer, audience, time claims and key handling, explains the attack each prevents, and notes that a JWT is signed, not encrypted.
      good: Checks signature, expiry and audience or issuer.
      weak: Only decodes the token or checks just the signature.
    followups:
      - Why does the audience check matter if the signature is valid?
      - What happens when the identity provider rotates its signing keys?
    common_errors:
      - Trusting the algorithm named in the token header.

  - external_key: technical.backend_apis.revoking_access_tokens
    competency_key: security
    topic: Revoking short-lived tokens
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You use short-lived JWT access tokens, and the security team asks how you would immediately cut off
      a user whose account has been compromised. What's your answer?
    expected_concepts:
      - short access-token lifetime limits exposure
      - revoking refresh tokens server-side
      - denylist by token id or a per-user 'valid after' timestamp
      - token introspection for high-risk operations
      - ending sessions and forcing re-authentication
      - latency and availability cost of each check
    rubric:
      excellent: Explains why stateless tokens cannot be revoked by themselves, combines refresh-token revocation with a cheap per-user check, and weighs the cost of introspection against risk.
      good: Revokes refresh tokens and adds a denylist for access tokens.
      weak: Claims nothing can be done until the token expires, or only changes the password.
    followups:
      - How would you make the denylist check cheap on every request?
      - How long should access tokens live, and what drives that?
    common_errors:
      - Assuming changing the password invalidates existing tokens.

  - external_key: technical.backend_apis.refresh_token_theft
    competency_key: security
    topic: Refresh token design
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Walk me through how you'd design refresh tokens for a mobile app so that a stolen refresh token is
      detected and contained.
    expected_concepts:
      - rotation on every use
      - reuse detection that revokes the whole token family
      - secure storage such as the platform keychain or keystore
      - binding tokens to a client or device
      - idle and absolute expiry
      - grace handling for legitimate concurrent refreshes
    rubric:
      excellent: Designs rotation with family-wide revocation on reuse, explains the race with concurrent refreshes and how to handle it, and covers storage, binding and expiry.
      good: Rotates refresh tokens and revokes them on suspicious use.
      weak: Issues long-lived refresh tokens that never rotate.
    followups:
      - Two requests from the app refresh at the same moment — how do you avoid logging the user out?
      - What does the user see when reuse is detected?
    common_errors:
      - Reuse detection that revokes only the reused token instead of the family.

  - external_key: technical.backend_apis.oauth_flow_selection
    competency_key: security
    topic: Choosing OAuth 2 flows
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Which OAuth 2 flows would you use for a single-page app, a mobile app and a backend job that calls
      another service, and why?
    expected_concepts:
      - authorization code with PKCE for single-page and mobile apps
      - the implicit flow is deprecated
      - client credentials for machine-to-machine calls
      - public versus confidential clients
      - refresh tokens and their storage
      - narrow scopes per client
    rubric:
      excellent: Picks the right flow for each client with reasons, explains what PKCE protects against, distinguishes public from confidential clients, and covers secret and token storage.
      good: Chooses authorization code with PKCE and client credentials correctly.
      weak: Recommends the implicit flow or embeds client secrets in mobile apps.
    followups:
      - What attack does PKCE prevent?
      - How would the backend job's credentials be stored and rotated?
    common_errors:
      - Shipping a client secret inside a mobile app.

  - external_key: technical.backend_apis.oauth_scope_design
    competency_key: security
    topic: Designing OAuth scopes
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're designing OAuth scopes for a new third-party developer platform. How do you decide how fine-
      grained they should be?
    expected_concepts:
      - least privilege
      - resource and action granularity, such as orders:read
      - avoiding an explosion of scopes
      - consent screens users can understand
      - scopes do not replace per-user permission checks
      - incremental authorization
    rubric:
      excellent: Balances least privilege against usability with a concrete scheme, explains that scopes cap what an app may do while user permissions still apply, and plans for adding scopes later.
      good: Proposes read and write scopes per resource with a reason.
      weak: Uses one all-access scope or invents scopes with no structure.
    followups:
      - How would you add a new scope for an existing integration's users?
      - How do scopes interact with the user's own role?
    common_errors:
      - Treating a granted scope as enough to access any user's data.

  - external_key: technical.backend_apis.broken_object_authorization
    competency_key: security
    topic: Object-level authorization
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A tester finds that changing the order id in a GET request lets one customer read another customer's
      order. How did this happen, and how would you fix it across the whole API, not just this endpoint?
    expected_concepts:
      - missing object-level authorization (BOLA or IDOR)
      - checking ownership on every access
      - scoping queries by the authenticated user or tenant
      - a central data-access or policy layer
      - automated cross-account tests
      - unguessable ids alone are not a fix
    rubric:
      excellent: Names the vulnerability class, fixes it structurally with scoped data access or central policy, adds tests across every endpoint, and checks logs for past exploitation.
      good: Adds an ownership check and suggests reviewing other endpoints.
      weak: Fixes only this endpoint or proposes switching to random ids as the fix.
    followups:
      - Would you return 403 or 404 for someone else's order?
      - How would you find out whether this was exploited before?
    common_errors:
      - Relying on the frontend to only show the user's own ids.

  - external_key: technical.backend_apis.permission_models
    competency_key: security
    topic: Permission models
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How have you modelled permissions in an API — roles, attributes, relationships — and where did the
      simple approach start to break down?
    expected_concepts:
      - role-based access control and role explosion
      - attribute-based rules and conditions
      - relationship-based access for sharing
      - policy engines such as OPA or Cedar
      - central decisions with local enforcement
      - testing and auditing policies
    rubric:
      excellent: Describes a real model, the specific requirement that broke it (sharing, per-resource rules, delegation), how they evolved it, and how policies were tested.
      good: Explains RBAC and when attributes or relationships are needed.
      weak: Only knows an admin flag versus regular users.
    followups:
      - How would you implement 'share this document with a colleague'?
      - How do you list only the resources a user may see without checking each one?
    common_errors:
      - Hard-coding role names in checks scattered across the codebase.

  - external_key: technical.backend_apis.tenant_isolation
    competency_key: security
    topic: Tenant data isolation
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      In a multi-tenant API backed by a shared database, how do you guarantee that one tenant can never
      see another tenant's data, even when a developer forgets a filter?
    expected_concepts:
      - tenant taken from the authenticated identity, never the request body
      - row-level security in the database
      - repository or ORM default scoping
      - separate schemas or databases for stronger isolation
      - cache keys, search indexes and files also scoped by tenant
      - automated cross-tenant tests
    rubric:
      excellent: Builds defence in depth so a single forgotten filter cannot leak data, covers caches, background jobs and search as well as SQL, and verifies isolation with tests.
      good: Uses a tenant id from the token with a default query scope.
      weak: Relies on every developer remembering to add a WHERE clause.
    followups:
      - How does a background job know which tenant it's working for?
      - When would you move a tenant to its own database?
    common_errors:
      - Forgetting that caches and search indexes need tenant scoping too.

  - external_key: technical.backend_apis.customer_api_keys
    competency_key: security
    topic: Designing API keys
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you design API keys for customers — how they're issued, stored, used and rotated?
    expected_concepts:
      - high-entropy random keys
      - recognisable prefixes for identification and secret scanning
      - storing only a hash
      - showing the full key once
      - multiple active keys for rotation without downtime
      - scopes, expiry, last-used tracking and revocation
    rubric:
      excellent: Covers the full lifecycle with hashing, prefixes, overlapping keys for rotation, scoping and usage visibility, and explains the reason for each.
      good: Generates random keys, stores them hashed and supports revocation.
      weak: Stores keys in plain text or allows only one key per account.
    followups:
      - Why does a key prefix help if the key leaks?
      - How would a customer rotate a key used by ten servers?
    common_errors:
      - Storing API keys in plain text in the database.

  - external_key: technical.backend_apis.leaked_customer_key
    competency_key: security
    topic: Responding to a leaked API key
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A customer accidentally pushes one of their API keys to a public code repository. What should happen
      next, both in your process and in what your platform does automatically?
    expected_concepts:
      - detection through secret scanning
      - revoking the key or notifying the customer immediately
      - reviewing usage since the leak
      - issuing a replacement key with minimal downtime
      - clear communication with the customer
      - anomaly controls to limit damage
    rubric:
      excellent: Describes automated detection and fast revocation or notification, investigates usage during exposure, supports smooth rotation, and improves defaults to reduce future impact.
      good: Revokes the key, issues a new one and checks usage logs.
      weak: Waits for the customer to notice or only asks them to delete the commit.
    followups:
      - Would you revoke automatically, or ask the customer first?
      - Why isn't deleting the commit enough?
    common_errors:
      - Assuming removing the key from the repository history makes it safe.

  - external_key: technical.backend_apis.service_to_service_auth
    competency_key: security
    topic: Authenticating internal service calls
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you authenticate calls between internal services, and why isn't being inside the private
      network enough on its own?
    expected_concepts:
      - zero-trust assumption that the network may be compromised
      - mutual TLS with workload identities
      - short-lived service tokens
      - per-caller authorization
      - passing end-user identity separately, for example token exchange
      - automated certificate and credential rotation
    rubric:
      excellent: Explains the risk of network-only trust, uses workload identity with mTLS or signed short-lived tokens, authorizes per caller, and keeps user identity distinct from service identity.
      good: Uses mTLS or service tokens and explains why the network alone is insufficient.
      weak: Relies on firewall rules or a shared static secret across all services.
    followups:
      - How does the receiving service know which end user the call is for?
      - What happens when a service certificate expires at 3 a.m.?
    common_errors:
      - One shared secret used by every service.

  - external_key: technical.backend_apis.cors_configuration
    competency_key: security
    topic: CORS for a cross-origin web app
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Explain what CORS actually protects against, and how you'd configure it for an API called from your
      own web app on a different domain.
    expected_concepts:
      - browser-enforced same-origin policy
      - preflight OPTIONS requests
      - an allow-list of origins instead of a wildcard
      - credentials and Access-Control-Allow-Credentials
      - CORS is not server-side access control
      - caching preflights
    rubric:
      excellent: Explains that CORS relaxes the browser's same-origin policy rather than protecting the server, configures a strict origin allow-list with credentials handled correctly, and avoids reflecting arbitrary origins.
      good: Configures allowed origins correctly and understands preflights.
      weak: Sets a wildcard origin with credentials or thinks CORS blocks non-browser clients.
    followups:
      - Why is reflecting the request's Origin header back dangerous?
      - Does CORS stop someone calling your API with curl?
    common_errors:
      - Believing CORS is an authentication mechanism.

  - external_key: technical.backend_apis.csrf_defences
    competency_key: security
    topic: Cross-site request forgery
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      If your API uses cookies for authentication, how do you defend against cross-site request forgery?
    expected_concepts:
      - SameSite cookie attribute
      - CSRF tokens such as synchronizer or double-submit
      - checking Origin or Referer headers
      - no state changes on GET
      - requiring a custom header for API calls
      - layering defences rather than one control
    rubric:
      excellent: Explains the attack, layers SameSite with tokens or origin checks, keeps GET safe, and knows the limits of each control.
      good: Uses CSRF tokens or SameSite cookies correctly.
      weak: Thinks HTTPS or CORS alone prevents CSRF.
    followups:
      - What does SameSite=Lax still allow?
      - Why doesn't a bearer token in a header need CSRF protection?
    common_errors:
      - Relying on SameSite alone for older browsers or subdomain attacks.

  - external_key: technical.backend_apis.mass_assignment_escalation
    competency_key: security
    topic: Mass assignment
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A user discovers they can make themselves an admin by adding a role field to the JSON body of the
      update-my-profile request. What went wrong, and how do you prevent this class of bug?
    expected_concepts:
      - binding request bodies directly to database models
      - explicit input schemas with allowed fields
      - separate privileged endpoints with their own authorization
      - rejecting or ignoring unknown fields
      - tests that try to set protected fields
    rubric:
      excellent: Names mass assignment, explains how auto-binding caused it, and prevents it structurally with explicit input models and separate privileged operations, plus tests and a review of other endpoints.
      good: Uses an allow-list of updatable fields.
      weak: Adds a check for the role field only.
    followups:
      - How would you check whether anyone has already exploited this?
      - Where else in a codebase would you look for the same pattern?
    common_errors:
      - Block-listing just the role field instead of allow-listing what can change.

  - external_key: technical.backend_apis.overexposed_responses
    competency_key: security
    topic: Excessive data exposure
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your user API returns the full database record, including internal flags and password hashes, and
      the frontend simply hides those fields. How would you fix this and stop it happening again?
    expected_concepts:
      - explicit response schemas or serializers
      - never relying on the client to filter data
      - field-level authorization for sensitive fields
      - tests or reviews on response shapes
      - assessing exposure and rotating if needed
    rubric:
      excellent: Replaces model dumping with explicit response models, assesses what was exposed and acts on it, and adds guardrails such as schema tests so new columns don't leak.
      good: Defines explicit response objects without sensitive fields.
      weak: Removes only the password hash field.
    followups:
      - A new column is added to the users table next month — what stops it leaking?
      - How would you assess the impact of what was already exposed?
    common_errors:
      - Serialising ORM models directly in responses.

  - external_key: technical.backend_apis.where_authz_lives
    competency_key: security
    topic: Where authorization is enforced
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      In a system with a gateway, several microservices and background workers, where should authorization
      decisions be made and enforced? Talk me through the design you'd choose.
    expected_concepts:
      - coarse checks at the gateway
      - object-level checks in the service that owns the data
      - propagating verified identity and claims, not trusting raw headers
      - workers acting with a recorded principal
      - central policy decisions versus embedded checks
      - the confused deputy problem
    rubric:
      excellent: Places each kind of check where the needed context lives, propagates identity securely, handles asynchronous work and the confused deputy problem, and explains how policy stays consistent.
      good: Does authentication at the gateway and authorization in services.
      weak: Puts all authorization in the gateway or trusts any internal caller.
    followups:
      - A worker processes a job hours later — whose permissions apply?
      - How do you keep policies consistent across services in different languages?
    common_errors:
      - Workers running every job with full system privileges.

  - external_key: technical.backend_apis.ssrf_url_import
    competency_key: security
    topic: Server-side request forgery
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your API lets customers register a URL that you fetch to import data. A security researcher reports
      that they used it to read your cloud metadata endpoint. How would you fix it properly?
    expected_concepts:
      - server-side request forgery
      - allow-listed schemes and ports
      - resolving DNS and blocking private and link-local ranges
      - rechecking after redirects and DNS rebinding
      - fetching through an isolated egress proxy
      - hardened metadata service, such as IMDSv2, plus timeouts and size limits
    rubric:
      excellent: Explains SSRF, blocks internal targets with checks that survive redirects and DNS rebinding, isolates fetching in a separate network path, hardens the metadata service and investigates what was exposed.
      good: Blocks private IP ranges and validates URLs.
      weak: Uses a string check on the hostname or a block-list of a few names.
    followups:
      - Why is checking the hostname before the request not enough?
      - Which credentials would you rotate after this report?
    common_errors:
      - Validating the URL once and then following redirects freely.

  - external_key: technical.backend_apis.secrets_out_of_logs
    competency_key: security
    topic: Keeping secrets out of logs
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Which kinds of data should never end up in your API's logs, and how do you enforce that rather than
      relying on people remembering?
    expected_concepts:
      - passwords, tokens, API keys and Authorization headers
      - personal and payment data
      - redaction in logging middleware
      - allow-listed structured log fields
      - automated scanning of logs
      - access control and retention for logs
    rubric:
      excellent: Names concrete sensitive data, enforces exclusion through tooling (redaction, allow-listed fields, scanning) rather than discipline, and limits who can read logs and for how long.
      good: Lists sensitive fields and uses a redaction filter.
      weak: Logs full request bodies and headers for convenience.
    followups:
      - How would you find out if a token has already been logged?
      - How do you debug a failing request without logging its body?
    common_errors:
      - Logging the full Authorization header.

  - external_key: technical.backend_apis.step_up_authentication
    competency_key: security
    topic: Step-up authentication
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some API actions, like changing a payout bank account, are much riskier than others. How would you
      design the API so those actions require stronger proof that it's really the account owner?
    expected_concepts:
      - step-up re-authentication or MFA
      - checking authentication time and level claims
      - short-lived elevated tokens
      - notifying the account owner of the change
      - holding periods before changes take effect
      - audit trail
    rubric:
      excellent: Designs step-up based on token claims with a short-lived elevated grant, adds out-of-band notification and a delay for high-risk changes, and records everything.
      good: Requires MFA or re-entering the password for sensitive actions.
      weak: Treats every authenticated request the same.
    followups:
      - How would the API tell the client that step-up is needed?
      - How long should the elevated access last?
    common_errors:
      - Checking step-up only in the frontend.

  - external_key: technical.backend_apis.support_impersonation
    competency_key: security
    topic: Safe impersonation for support
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Support staff need to see the product exactly as a specific customer sees it in order to debug
      issues. How would you design impersonation in your API so it's safe and auditable?
    expected_concepts:
      - separate token carrying both actor and subject
      - read-only or limited scope by default
      - linking to a ticket or customer consent
      - time-limited sessions
      - audit log of the real actor
      - blocking sensitive actions while impersonating
    rubric:
      excellent: Models impersonation explicitly with actor and subject identities, limits scope and duration, blocks high-risk actions, audits everything under the real actor and makes it visible.
      good: Uses a time-limited, logged impersonation session.
      weak: Lets staff log in with the customer's password or a shared master key.
    followups:
      - How would downstream services know an action came from support staff?
      - Which actions would you never allow while impersonating?
    common_errors:
      - Audit records that show the customer, not the staff member, as the actor.

  - external_key: technical.backend_apis.password_reset_flow
    competency_key: security
    topic: Password reset API
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Design the API for a password reset flow, and tell me which attacks you're defending against at each
      step.
    expected_concepts:
      - identical responses whether or not the account exists
      - single-use, high-entropy, short-lived tokens
      - storing reset tokens hashed
      - rate limiting reset requests
      - invalidating existing sessions after reset
      - notifying the user and keeping tokens out of logs and referrers
    rubric:
      excellent: Walks the flow step by step and maps each control to an attack (enumeration, token guessing, theft, replay, session persistence).
      good: Uses expiring single-use tokens and generic responses.
      weak: Emails the password or uses predictable tokens.
    followups:
      - What should happen to sessions on other devices after a reset?
      - How would you stop someone flooding a user's inbox with reset emails?
    common_errors:
      - Reset tokens that never expire or can be reused.

  - external_key: technical.backend_apis.oauth_vs_oidc
    competency_key: security
    topic: OAuth 2 versus OpenID Connect
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you add 'log in with' a third-party identity provider, what's the difference between using
      OAuth 2 and OpenID Connect, and why does it matter?
    expected_concepts:
      - OAuth 2 is delegated authorization
      - OpenID Connect adds authentication with an ID token
      - validating the ID token's issuer, audience and nonce
      - using the subject claim as the stable user key, not the email
      - an access token is not proof of who logged in to your app
    rubric:
      excellent: Explains authorization versus authentication, why using a plain access token for login is unsafe, and how to validate ID tokens and link accounts by subject.
      good: Knows OIDC adds an ID token for login.
      weak: Treats them as the same thing.
    followups:
      - Why is matching users by email address risky?
      - What does the nonce protect against?
    common_errors:
      - Linking accounts by unverified email.

  - external_key: technical.backend_apis.customer_audit_log
    competency_key: security
    topic: Audit logs for customers
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Enterprise customers ask for an audit log of every change made through your API. How would you
      design what gets recorded and how they access it?
    expected_concepts:
      - actor, including API keys and impersonation
      - action, target and before and after values
      - time, source and request id
      - append-only, tamper-evident storage
      - writing audit records reliably with the change, for example in the same transaction
      - an audit API with filtering, pagination, export and retention
    rubric:
      excellent: Defines a complete audit record, guarantees it is written whenever the change is, protects it from tampering, excludes secrets, and gives customers a usable query and export API.
      good: Records who did what and when, with an endpoint to list events.
      weak: Relies on application logs as the audit trail.
    followups:
      - How do you guarantee an audit record exists for every change?
      - Should customers be able to delete their audit records?
    common_errors:
      - Writing audit events asynchronously in a way that can be lost.

  - external_key: technical.backend_apis.hardening_before_partner_launch
    competency_key: security
    topic: Hardening an API for external use
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You've inherited an API that's about to be opened to external partners, and you have two weeks to
      harden it. How would you prioritise what to check?
    expected_concepts:
      - inventory of all endpoints, including old versions
      - object-level and function-level authorization
      - authentication strength
      - rate limits and resource consumption
      - input validation and mass assignment
      - data exposure, logging and monitoring
    rubric:
      excellent: Starts with an inventory and a quick threat model, prioritises by impact (authorization and data exposure first), combines automated scanning with targeted manual tests, and plans what to defer safely.
      good: Covers authorization, input validation and rate limiting with a sensible order.
      weak: Runs a scanner and declares it secure.
    followups:
      - What would you do if you found a serious issue on day thirteen?
      - How do you find endpoints nobody remembers exist?
    common_errors:
      - Ignoring old or undocumented endpoints that are still reachable.
