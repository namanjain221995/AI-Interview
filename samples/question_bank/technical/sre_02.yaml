# Site reliability engineering, part 2: alerting, on-call, incident handling, overload and dependencies.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [sre]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.sre.page_ticket_or_dashboard
    competency_key: observability
    topic: Page, ticket or dashboard
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide whether a condition should wake someone up, open a ticket for working hours, or just
      be visible on a dashboard? Give me examples from systems you've run.
    expected_concepts:
      - page only for urgent, user-impacting, actionable conditions
      - tickets for problems that need attention but can wait
      - dashboards or logs for diagnostic information
      - urgency judged by how fast the problem harms users or the error budget
      - every page should have a clear human action
    rubric:
      excellent: Gives a clear decision rule based on urgency, user impact and actionability, backs it with real examples of each tier, and mentions how classifications are revisited.
      good: Distinguishes urgent from non-urgent alerts with sensible examples.
      weak: Pages on everything that looks unusual, or cannot explain the difference.
    followups:
      - Where would a disk that will fill up in four days belong?
      - What do you do with an alert that pages but never needs any action?
    common_errors:
      - Paging on resource thresholds that have no direct effect on users.

  - external_key: technical.sre.paged_for_unknown_service
    competency_key: incident_response
    topic: Paged for an unfamiliar service
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You get paged for a service you've never worked on and its owning team isn't answering. How do you get
      your bearings in the first few minutes?
    expected_concepts:
      - read the alert, its runbook and linked dashboard
      - establish user impact before diving into internals
      - check recent changes to the service and its dependencies
      - escalate through the documented path while investigating
      - prefer safe, reversible mitigations
    rubric:
      excellent: Orients quickly through the alert, runbook and impact, checks recent changes, escalates in parallel, and limits actions to safe reversible mitigations while noting everything done.
      good: Uses the runbook and dashboards and escalates to find the owners.
      weak: Starts changing configuration or restarting things without understanding the service.
    followups:
      - What would you consider safe to do without the owners?
      - What would you change afterwards so the next person has an easier time?
    common_errors:
      - Waiting passively for the owning team instead of assessing impact.

  - external_key: technical.sre.incident_status_updates
    competency_key: incident_response
    topic: Status updates during an incident
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What makes a good status update during an incident for people outside engineering, and how often do
      you send them?
    expected_concepts:
      - current user impact in plain language
      - what is being done and what is known or unknown
      - time of the next update even if nothing changes
      - avoiding speculative causes and internal jargon
      - one channel or page as the source of truth
    rubric:
      excellent: Describes a consistent update format covering impact, actions, unknowns and next update time, explains cadence by severity, and avoids speculation and jargon.
      good: Communicates impact and progress at regular intervals.
      weak: Sends technical detail only, or updates only when the incident is fixed.
    followups:
      - How would you word an update when you still have no idea what's wrong?
      - Who decides what goes on the public status page?
    common_errors:
      - Promising a fix time before the cause is understood.

  - external_key: technical.sre.oncall_handoff
    competency_key: incident_response
    topic: On-call handoffs
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When your on-call shift ends, what do you hand over to the next person, and how do you make sure
      nothing falls through the cracks?
    expected_concepts:
      - open incidents and their current state
      - noisy or suspicious alerts seen during the shift
      - risky changes in flight or scheduled
      - temporary mitigations that need to be reverted
      - a written handoff note plus a short live conversation for anything active
    rubric:
      excellent: Lists the concrete contents of a handoff, including temporary mitigations and pending risks, and uses a written record plus a live handover for active issues.
      good: Covers open issues and recent alerts in a handoff note.
      weak: Relies on the next person reading the chat history.
    followups:
      - How do you hand over an incident that's still in progress?
      - What patterns from handoffs would you bring to the team's weekly review?
    common_errors:
      - Forgetting to mention temporary workarounds that will later break something.

  - external_key: technical.sre.customers_noticed_first
    competency_key: observability
    topic: Customers reported it before alerts
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Customers reported an outage before any of your alerts fired. Once things are fixed, how would you
      work out why monitoring missed it?
    expected_concepts:
      - check whether the failure showed up in any existing metric
      - measurement point too far from users (missed load balancer, DNS or client failures)
      - thresholds or windows too lenient for the failure shape
      - missing coverage for that path or feature
      - alert routing or silencing problems
    rubric:
      excellent: Systematically checks whether the signal existed, was measured in the wrong place, was alerted on with the wrong threshold, or was routed or silenced, and proposes targeted fixes.
      good: Identifies missing coverage and proposes a new alert or probe.
      weak: Adds a generic alert without understanding why detection failed.
    followups:
      - What if the metric did show it, but the alert threshold was never crossed?
      - How would you track time to detection across incidents?
    common_errors:
      - Assuming an alert was missing when it actually fired and was silenced or misrouted.

  - external_key: technical.sre.single_host_triage
    competency_key: linux
    topic: Triage of a single misbehaving host
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When one Linux host in a fleet is behaving badly, what do you look at first, and what are you trying
      to rule in or out with each check?
    expected_concepts:
      - CPU usage, run queue and steal time
      - memory pressure, swap and OOM events
      - disk usage, inode exhaustion and I/O wait
      - network errors, retransmits and connection counts
      - kernel and system logs
      - comparing against healthy peers in the fleet
    rubric:
      excellent: Works methodically through CPU, memory, disk and network for utilisation, saturation and errors, explains what each finding would mean, and compares with healthy peers.
      good: Checks the main resources with appropriate tools.
      weak: Reboots the host first, or checks only CPU.
    followups:
      - What does high steal time suggest?
      - When would you just remove the host from service rather than debug it?
    common_errors:
      - Ignoring inode exhaustion when disk space looks fine.

  - external_key: technical.sre.when_to_declare_incident
    competency_key: incident_response
    topic: When to declare an incident
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide when to formally declare an incident rather than quietly fixing the problem
      yourself?
    expected_concepts:
      - clear criteria based on user impact, data risk or SLO burn
      - declaring early is cheap and can be downgraded
      - need for coordination beyond one person
      - visibility for stakeholders and other teams
      - avoiding a culture where declaring feels like admitting fault
    rubric:
      excellent: Uses explicit impact-based criteria, argues for declaring early and downgrading later, and explains how the team's culture makes declaring normal.
      good: Gives reasonable criteria such as user impact or needing help.
      weak: Declares only when the problem is huge, or prefers to fix things quietly.
    followups:
      - What does it cost to declare an incident that turns out to be minor?
      - How would you encourage engineers who hesitate to declare?
    common_errors:
      - Waiting to declare until the cause is known.

  # ---------------------------------------------------------------- medium
  - external_key: technical.sre.alert_threshold_tuning
    competency_key: observability
    topic: Tuning alert thresholds and durations
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you choose the threshold and the duration for an alert so it neither flaps all night nor fires
      too late to matter?
    expected_concepts:
      - base thresholds on user impact or budget burn, not on round numbers
      - pending duration trades detection time for noise
      - using historical data to backtest the rule
      - hysteresis or separate resolve conditions
      - reviewing precision and recall of alerts after incidents
    rubric:
      excellent: Ties thresholds to impact, uses historical data to backtest, explains the detection time versus noise trade-off of durations, and reviews alert quality over time.
      good: Picks thresholds from historical baselines and uses a pending duration to reduce flapping.
      weak: Picks arbitrary thresholds and adjusts them only after complaints.
    followups:
      - How would you backtest a new alert rule before enabling it?
      - What do you do with an alert that is right half of the time?
    common_errors:
      - Lengthening durations to stop noise until real incidents are detected far too late.

  - external_key: technical.sre.alert_storm_shared_dependency
    competency_key: observability
    topic: Alert storm from a shared dependency
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When a shared database has a problem, on-call receives a hundred and fifty alerts from twenty different
      services within a few minutes. How would you change alerting so the real problem is obvious?
    expected_concepts:
      - grouping and deduplication in the alert router
      - inhibition rules that suppress downstream alerts when an upstream one fires
      - alerting on the dependency itself with clear ownership
      - symptom alerts per service routed to owners, not all to one person
      - dependency map available during incidents
    rubric:
      excellent: Combines grouping, inhibition based on dependency relationships and a clear upstream alert with ownership, while ensuring real independent failures are not hidden.
      good: Proposes grouping or suppressing related alerts and alerting on the database directly.
      weak: Mutes the noisy alerts or turns down sensitivity everywhere.
    followups:
      - What is the risk of an inhibition rule that is too broad?
      - How would the responder see which services are actually affected?
    common_errors:
      - Suppressing downstream alerts so aggressively that an unrelated outage is hidden.

  - external_key: technical.sre.testing_alert_rules
    competency_key: observability
    topic: Testing that alerts fire
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you know an alert will actually fire, and reach a human, when the problem it covers really
      happens?
    expected_concepts:
      - unit tests for alert rules with synthetic series
      - reviewing alert rules in code like any other change
      - end-to-end tests of the paging path
      - fault injection or game days that trigger real alerts
      - detecting rules that reference metrics which no longer exist
    rubric:
      excellent: Covers rule-level unit tests, code review, end-to-end checks of routing and paging, and exercises alerts through deliberate fault injection, including detection of stale rules.
      good: Tests rules in some way and verifies the paging integration.
      weak: Assumes alerts work because they were configured once.
    followups:
      - How would you catch an alert whose metric was renamed last month?
      - How do you test the paging path without waking anyone up unnecessarily?
    common_errors:
      - Never noticing that a metric rename silently disabled an alert.

  - external_key: technical.sre.migration_blocks_rollback
    competency_key: incident_response
    topic: When rollback isn't safe
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A deploy is causing errors, but it included a database schema migration, so rolling back the code
      isn't safe. How would you mitigate?
    expected_concepts:
      - check whether the old code is compatible with the new schema
      - roll forward with a targeted fix or feature flag
      - disable the failing path or degrade the feature
      - data integrity checks for writes made during the incident
      - backward-compatible expand and contract migrations to avoid this in future
    rubric:
      excellent: Assesses schema compatibility, chooses between flagging off, rolling forward and partial rollback with their risks, checks data written during the incident, and proposes expand and contract migrations for the future.
      good: Suggests a fix forward or feature flag and checks data correctness.
      weak: Rolls back anyway or restores the database from backup as a first step.
    followups:
      - What would make it safe to roll the code back after all?
      - How should migrations be structured so this doesn't happen again?
    common_errors:
      - Restoring a backup and losing every write since it was taken.

  - external_key: technical.sre.drain_unhealthy_region
    competency_key: incident_response
    topic: Deciding to drain a region
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      One of your three regions is returning errors on about twenty percent of requests. Talk me through how
      you'd decide whether to move its traffic to the other two.
    expected_concepts:
      - confirm the problem is regional and not a global change
      - check that the remaining regions have capacity for the extra load
      - consider data locality, replication lag and stateful sessions
      - shift gradually and watch the receiving regions
      - plan how and when to shift traffic back
    rubric:
      excellent: Confirms the regional scope, checks capacity and data constraints in the other regions, shifts traffic gradually with monitoring, and plans the return path.
      good: Drains the region after checking that the others can take the load.
      weak: Drains immediately without checking capacity, or never considers draining.
    followups:
      - What if the other regions are already at seventy percent utilisation?
      - What could go wrong when you send traffic back?
    common_errors:
      - Overloading the healthy regions and turning a partial outage into a global one.

  - external_key: technical.sre.oncall_sustainability
    competency_key: incident_response
    topic: Sustainable on-call rotations
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you measure whether an on-call rotation is sustainable, and what have you changed when it
      wasn't?
    expected_concepts:
      - pages per shift and out-of-hours pages
      - share of pages that were actionable
      - time spent on interrupts versus planned work
      - rotation size, follow-the-sun or secondary on-call
      - feeding pager data into prioritised reliability work
    rubric:
      excellent: Uses concrete metrics such as pages per shift, actionability and out-of-hours load, and describes specific changes made (alert cleanup, rotation design, reliability fixes) with their results.
      good: Tracks page volume and has taken steps to reduce noise.
      weak: Judges sustainability only by anecdote, or accepts a heavy pager as normal.
    followups:
      - What would you do if one service generates most of the pages?
      - How many people do you think a rotation needs, and why?
    common_errors:
      - Fixing load by adding people to the rotation instead of reducing the pages.

  - external_key: technical.sre.cold_cache_stampede
    competency_key: distributed_systems
    topic: Cold cache stampede
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your cache cluster restarted during maintenance, and the database behind it was immediately overwhelmed
      by requests. What would you do in the moment, and what would you change afterwards?
    expected_concepts:
      - shed or rate-limit load to let the database recover
      - warm the cache gradually or restore it in stages
      - request coalescing so one miss triggers one fetch
      - staggered expiry with jitter
      - capacity planning that assumes the cache can be cold
    rubric:
      excellent: Stabilises the database by shedding or throttling, warms the cache in a controlled way, and proposes coalescing, jittered expiry and capacity for cold-cache scenarios.
      good: Throttles traffic and suggests warming the cache or request coalescing.
      weak: Only restarts the database or scales it up during the incident.
    followups:
      - How does request coalescing work?
      - How would you test that the database survives a cold cache?
    common_errors:
      - Treating the cache as optional when the database cannot survive without it.

  - external_key: technical.sre.trace_context_propagation
    competency_key: observability
    topic: Trace context across async boundaries
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How does trace context get carried from one service to the next, including through message queues and
      background jobs, and where have you seen traces break?
    expected_concepts:
      - standard context headers such as W3C trace context
      - instrumentation libraries injecting and extracting context
      - carrying context in message metadata for queues
      - links rather than parent spans for batch or fan-in work
      - breaks at proxies, thread pools or custom clients
    rubric:
      excellent: Explains propagation through headers and message metadata, handles async and batch cases with span links, and gives real examples of where context was lost and how it was fixed.
      good: Knows headers carry context and that queues need explicit handling.
      weak: Believes tracing works automatically everywhere once an agent is installed.
    followups:
      - How would you trace a request that fans out into fifty background jobs?
      - What happens to context when work moves to another thread?
    common_errors:
      - Losing context in thread pools or async callbacks.

  - external_key: technical.sre.log_pipeline_drops_data
    competency_key: observability
    topic: Log pipeline losing data under load
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      During big incidents your log pipeline drops data or lags by twenty minutes, exactly when you need it
      most. How would you diagnose that and redesign it?
    expected_concepts:
      - find the bottleneck stage (agents, buffer, ingestion, indexing)
      - error logging spikes during incidents
      - buffering with backpressure and durable queues
      - rate limiting or sampling noisy sources at the edge
      - monitoring pipeline lag and drop counts
    rubric:
      excellent: Locates the bottleneck with pipeline metrics, explains why incidents create log spikes, and designs buffering, per-source limits and lag monitoring so critical logs survive.
      good: Adds buffering or capacity and reduces noisy sources.
      weak: Only increases the size of the logging cluster.
    followups:
      - How would you protect the logs from your most critical services during a spike?
      - What metrics would tell you the pipeline itself is in trouble?
    common_errors:
      - Not monitoring the pipeline, so nobody knows data is missing until it is needed.

  - external_key: technical.sre.headroom_for_failures
    competency_key: system_design
    topic: Sizing headroom for failures and deploys
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you decide how much spare capacity a service needs, taking into account things like losing a
      zone or running a rolling deploy?
    expected_concepts:
      - N plus one or N plus two planning
      - surviving the loss of a zone at peak traffic
      - capacity removed during rolling deploys
      - autoscaling speed versus sudden demand
      - peak-to-average ratio and growth between reviews
    rubric:
      excellent: Calculates headroom from concrete failure scenarios at peak, includes deploy capacity and autoscaling lag, and connects the result to cost.
      good: Plans for losing at least one instance or zone at peak.
      weak: Picks a flat percentage with no reasoning.
    followups:
      - With three zones, what utilisation can each zone run at and still survive losing one?
      - How does autoscaling change the calculation?
    common_errors:
      - Planning headroom against average traffic instead of peak.

  - external_key: technical.sre.throughput_plateau
    competency_key: system_design
    topic: Throughput plateau in a load test
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a load test, throughput stops growing at about four thousand requests per second while CPU sits at
      fifty percent. What would you investigate?
    expected_concepts:
      - check the load generator itself is not the bottleneck
      - connection pool, thread pool or worker limits
      - lock contention or single-threaded hot paths
      - downstream dependency or database limits
      - network, file descriptor or bandwidth limits
    rubric:
      excellent: First rules out the load generator, then systematically checks pools, contention, dependencies and OS limits with appropriate evidence for each.
      good: Names several plausible non-CPU bottlenecks and how to check them.
      weak: Concludes the service needs more CPU or more instances.
    followups:
      - How would you tell lock contention apart from a slow dependency?
      - How do you verify the load generator is keeping up?
    common_errors:
      - Assuming low CPU means the service has spare capacity.

  - external_key: technical.sre.game_day_planning
    competency_key: distributed_systems
    topic: Planning a game day
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you plan and run a game day for a business-critical service, from choosing scenarios to
      following up afterwards?
    expected_concepts:
      - scenarios drawn from real risks and past incidents
      - goals for both the system and the people (detection, runbooks, communication)
      - safety measures, abort criteria and stakeholder notice
      - observers recording what happened
      - findings turned into tracked improvements
    rubric:
      excellent: Picks scenarios from real risk, tests both technical resilience and human response, sets clear safety limits, and has a concrete follow-up process.
      good: Describes a structured exercise with scenarios and a review afterwards.
      weak: Describes a vague exercise with no goals, safety plan or follow-up.
    followups:
      - How would you decide whether to tell on-call in advance?
      - What would make you stop the exercise early?
    common_errors:
      - Treating the exercise as a pass or fail test instead of a learning opportunity.

  # ------------------------------------------------------------------ hard
  - external_key: technical.sre.silent_data_corruption
    competency_key: incident_response
    topic: Silent data corruption incident
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You discover that a bug has been silently writing wrong values to an important table for the last six
      hours. How would you run this incident differently from an ordinary outage?
    expected_concepts:
      - stop the bleeding first (disable the writer or feature)
      - scope affected records and downstream consumers
      - preserve evidence and avoid destructive fixes
      - repair strategy using backups, change logs or recomputation
      - involve data owners, support and possibly legal or customer communication
    rubric:
      excellent: Stops new corruption immediately, scopes impact including downstream systems, preserves evidence, chooses a careful repair approach, and brings in the right business stakeholders.
      good: Stops the bug and plans to fix affected rows from backups.
      weak: Fixes the code and moves on without repairing or scoping the data.
    followups:
      - How would you find every downstream system that consumed the bad data?
      - How would you verify the repair was correct?
    common_errors:
      - Restoring the whole table from backup and losing correct writes made since.

  - external_key: technical.sre.slo_for_async_pipeline
    competency_key: observability
    topic: SLOs for pipelines and queues
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you define SLOs for an asynchronous pipeline, like a queue of jobs or a nightly data
      process, where there's no user waiting on a request?
    expected_concepts:
      - freshness or end-to-end delay as an indicator
      - completeness and correctness of the output
      - throughput or backlog age for queues
      - measuring from the consumer's point of view
      - alerting on backlog age rather than queue length
    rubric:
      excellent: Defines freshness, completeness and correctness indicators from the consumer's view, explains how to measure them reliably, and designs alerts on age or lag rather than raw counts.
      good: Proposes freshness or processing delay as the main indicator.
      weak: Uses CPU or job success counts only, or says SLOs don't apply.
    followups:
      - Why is the age of the oldest message often better than queue length?
      - How would you measure correctness without checking every record?
    common_errors:
      - Alerting on queue length, which varies normally with load.

  - external_key: technical.sre.overload_protection_design
    competency_key: distributed_systems
    topic: Designing overload protection
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After an outage, your service stayed degraded long after the original trigger was gone because it was
      flooded with retries and backlog. How would you design the system to recover on its own next time?
    expected_concepts:
      - metastable failure sustained by its own load
      - client-side retry budgets and server-side rejection signals
      - bounded queues and dropping stale work
      - LIFO or deadline-aware processing under overload
      - admission control and fast rejection being cheaper than work
    rubric:
      excellent: Explains the self-sustaining failure mode and designs bounded queues, deadline propagation, cheap rejection, retry budgets and stale-work dropping so the system returns to steady state without intervention.
      good: Proposes bounded queues and retry limits.
      weak: Suggests bigger queues or more instances.
    followups:
      - Why can a bigger queue make the problem worse?
      - How would a server know a request's caller has already given up?
    common_errors:
      - Processing requests whose callers have already timed out.

  - external_key: technical.sre.traffic_event_readiness
    competency_key: system_design
    topic: Preparing for a planned traffic surge
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Marketing tells you a campaign in three weeks could bring ten times normal traffic for a few hours.
      How would you get the platform ready?
    expected_concepts:
      - clarify expected traffic shape and which journeys it hits
      - find bottlenecks with load tests at target levels
      - pre-scale, raise quotas and confirm third-party limits
      - degradation plan and feature switches to protect core paths
      - change freeze, staffed war room and clear communication
    rubric:
      excellent: Pins down the traffic model, tests the real bottlenecks including dependencies and quotas, pre-scales, prepares a degradation plan with switches, and organises the human side of the event.
      good: Load tests, pre-scales and plans monitoring during the event.
      weak: Relies on autoscaling to absorb the surge.
    followups:
      - Which limits outside your own systems would you check?
      - What would you turn off first if things still got overloaded?
    common_errors:
      - Forgetting third-party rate limits and cloud quotas.

  - external_key: technical.sre.single_tenant_slowness
    competency_key: observability
    topic: Debugging one slow tenant
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You can't put customer ids on metrics because of cardinality, but support keeps asking why one
      particular customer is slow. How would you design observability so you can answer that?
    expected_concepts:
      - high-cardinality data in traces and structured events rather than metrics
      - wide events queried by arbitrary dimensions
      - exemplars linking metrics to example traces
      - targeted sampling for specific tenants
      - per-tenant aggregates for the largest customers only
    rubric:
      excellent: Separates low-cardinality metrics from high-cardinality events and traces, explains querying wide events, and adds targeted sampling or bounded per-tenant data with cost awareness.
      good: Uses traces or logs with customer ids to investigate individual tenants.
      weak: Adds customer id as a metric label anyway.
    followups:
      - How would you keep the cost of wide events under control?
      - How would you make sure that customer's requests are always traced?
    common_errors:
      - Expecting a metrics system to answer per-request questions.

  - external_key: technical.sre.critical_path_dependencies
    competency_key: distributed_systems
    topic: Removing hard dependencies
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you map the dependencies of a critical service and make sure a failure in a non-critical one
      can't take it down?
    expected_concepts:
      - dependency inventory from traces and code, not only diagrams
      - classifying dependencies as hard or soft per request path
      - timeouts, fallbacks and circuit breakers for soft dependencies
      - asynchronous decoupling where possible
      - fault injection to verify each soft dependency really is soft
    rubric:
      excellent: Builds the map from real data, classifies dependencies per path, applies timeouts and fallbacks to soft ones, and proves the classification with fault injection.
      good: Identifies dependencies and adds timeouts and fallbacks.
      weak: Relies on architecture diagrams and assumes optional calls fail safely.
    followups:
      - How would you discover a dependency nobody documented?
      - What should the fallback be if a recommendation service is down?
    common_errors:
      - Missing hidden dependencies such as DNS, configuration services or authentication.
