# Frontend core (1/4): JavaScript language and runtime, TypeScript.
# Round types follow difficulty: easy -> screening/combined, medium -> all three,
# hard -> deep technical/combined.
version: 1
defaults:
  role_tags: [frontend]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.frontend_core.this_binding
    competency_key: javascript
    topic: How this is bound in functions and arrow functions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How does JavaScript decide what this refers to inside a function, and how do arrow functions change
      that? If you've ever lost this when passing a method as a callback, tell me what happened.
    expected_concepts:
      - this is set by how a function is called, not where it is defined
      - method call, plain call, new and explicit call, apply or bind
      - arrow functions capture this lexically from the enclosing scope
      - detached methods lose their receiver when passed as callbacks
      - fixes such as bind, arrow wrappers or class field arrow functions
    rubric:
      excellent: Explains call-site binding rules clearly, contrasts lexical this in arrow functions, and describes a concrete callback bug with a sensible fix and its trade-off.
      good: Knows that the call site matters and that arrow functions keep the outer this, with a basic example.
      weak: Thinks this always refers to the object where the function was written, or cannot explain arrow function behaviour.
    followups:
      - Why is an arrow function a poor choice for an object method that needs this?
      - What does this point to inside a plain function in strict mode?
    common_errors:
      - Assuming this is fixed at definition time for regular functions.
      - Using bind inside render paths and creating new functions on every call without realising it.

  - external_key: technical.frontend_core.object_copying
    competency_key: javascript
    topic: References, shallow copies and deep copies
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you copy an object or an array in JavaScript, what are your options, and how do you decide
      between a shallow copy and a deep copy?
    expected_concepts:
      - objects and arrays are assigned by reference
      - spread and Object.assign create shallow copies
      - nested objects remain shared after a shallow copy
      - structuredClone for deep copies and its limits (functions, class instances)
      - JSON round-tripping loses dates, undefined and other types
    rubric:
      excellent: Explains reference semantics, shows how a shallow copy still shares nested data, compares structuredClone with JSON round-tripping and their limits, and ties the choice to a real case.
      good: Distinguishes shallow and deep copies and names at least one way to do each.
      weak: Believes the spread operator copies nested objects, or does not recognise reference sharing.
    followups:
      - What does structuredClone refuse to copy?
      - How would you update one deeply nested field without mutating the original?
    common_errors:
      - Mutating nested state after a shallow copy and changing the original.
      - Using JSON stringify and parse and silently losing dates.

  - external_key: technical.frontend_core.async_await_errors
    competency_key: javascript
    topic: Error handling with async and await
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you handle errors in code that uses async and await, and what happens to a promise that rejects
      when nobody is awaiting or catching it?
    expected_concepts:
      - try and catch around awaited calls
      - an async function always returns a promise
      - unhandled rejections and the unhandledrejection event
      - forgetting to await loses the error
      - deciding where to handle versus rethrow
    rubric:
      excellent: Explains try and catch with await, shows how a missing await lets a rejection escape, describes global unhandled rejection reporting, and has a clear rule for where errors get handled.
      good: Uses try and catch correctly and knows unhandled rejections are a problem.
      weak: Thinks try and catch catches a rejected promise that was never awaited.
    followups:
      - Where in an application would you put a last-resort handler for rejections?
      - When would you deliberately let an error propagate instead of catching it?
    common_errors:
      - Calling an async function without await or a catch, so failures vanish.
      - Wrapping every line in try and catch and swallowing errors silently.

  - external_key: technical.frontend_core.sort_mutation_bug
    competency_key: javascript
    topic: Mutating array methods
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A teammate sorts a list of products inside a component to display it, and suddenly a different part
      of the page shows the products in the wrong order too. What do you think is going on, and how would
      you fix it?
    expected_concepts:
      - sort mutates the array in place
      - the same array reference is shared between consumers
      - copy before sorting or use non-mutating methods such as toSorted
      - other mutating methods such as reverse and splice
      - treating shared data as immutable
    rubric:
      excellent: Identifies in-place mutation of a shared reference, gives a non-mutating fix, names other mutating methods, and suggests a convention or lint rule to prevent it.
      good: Recognises that sort mutates and copies the array before sorting.
      weak: Blames rendering or the framework without considering mutation.
    followups:
      - Which other common array methods change the original array?
      - How would you catch this kind of mutation earlier in development?
    common_errors:
      - Not knowing that sort and reverse change the original array.

  - external_key: technical.frontend_core.esm_vs_commonjs
    competency_key: javascript
    topic: ES modules versus CommonJS
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What are the practical differences between ES modules and CommonJS, and why do bundlers care which
      one a library ships?
    expected_concepts:
      - static import and export versus dynamic require
      - static structure enables tree shaking
      - live bindings versus copied values
      - asynchronous loading and top-level await in ES modules
      - interop issues and dual packages
    rubric:
      excellent: Explains static versus dynamic module structure, connects it to tree shaking and bundle size, and mentions interop pain points with a real example.
      good: Knows the syntax difference and that ES modules allow better tree shaking.
      weak: Sees them as two spellings of the same thing.
    followups:
      - Why does a CommonJS dependency often end up fully included in a bundle?
      - What problems have you seen when mixing the two in one project?
    common_errors:
      - Assuming any import statement guarantees unused code is removed.

  - external_key: technical.frontend_core.ts_null_handling
    competency_key: typescript
    topic: strictNullChecks, optional chaining and nullish coalescing
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How does TypeScript's strict null checking change the way you write code, and when do you reach for
      optional chaining or the nullish coalescing operator instead of a logical or?
    expected_concepts:
      - null and undefined become explicit in types
      - narrowing before use
      - optional chaining short-circuits on null or undefined
      - nullish coalescing keeps valid falsy values such as zero and empty string
      - avoiding the non-null assertion as a shortcut
    rubric:
      excellent: Explains how strict null checks surface missing-value bugs, shows the zero or empty-string pitfall with logical or, and treats non-null assertions as a last resort with a reason.
      good: Knows both operators and the falsy-value difference.
      weak: Uses non-null assertions everywhere or cannot explain the difference from logical or.
    followups:
      - When is a non-null assertion actually justified?
      - What bug appears if a quantity of zero is defaulted with logical or?
    common_errors:
      - Defaulting numeric values with logical or and replacing a valid zero.
      - Sprinkling non-null assertions to silence the compiler.

  - external_key: technical.frontend_core.untyped_api_response
    competency_key: typescript
    topic: Typing data from APIs
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      The backend renamed a field in an API response, and the frontend broke in production even though
      TypeScript compiled cleanly. How could that happen, and what would you change so it's caught next time?
    expected_concepts:
      - types are erased at runtime and the response was asserted or typed as any
      - runtime validation at the boundary (for example with a schema library)
      - generating types from an OpenAPI or schema contract
      - contract tests between frontend and backend
      - failing visibly instead of rendering undefined
    rubric:
      excellent: Explains that compile-time types do not check runtime data, proposes validation at the network boundary plus a shared or generated contract, and mentions how failures would surface.
      good: Suggests runtime validation or generated types.
      weak: Suggests adding more type annotations, unaware that they do not exist at runtime.
    followups:
      - What should the user see if validation fails?
      - How would you keep generated types in sync with the backend?
    common_errors:
      - Casting fetch results with as and trusting them.

  - external_key: technical.frontend_core.float_money
    competency_key: javascript
    topic: Floating point numbers and money
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A shopping cart total on your site shows a price like 0.30000000000000004. Explain why that happens
      and how you'd handle money correctly on the frontend.
    expected_concepts:
      - JavaScript numbers are binary floating point
      - decimal fractions such as 0.1 are not exactly representable
      - store and calculate in integer minor units such as cents
      - format with Intl.NumberFormat for display
      - let the server be the source of truth for totals
    rubric:
      excellent: Explains binary floating point representation, recommends integer minor units or a decimal library, formats with Intl, and keeps the authoritative total on the server.
      good: Knows it is floating point imprecision and suggests integer cents or rounding at display.
      weak: Proposes calling toFixed everywhere without understanding the cause.
    followups:
      - How would you display prices for different locales and currencies?
      - Where could rounding errors still creep in with integer cents?
    common_errors:
      - Rounding intermediate values repeatedly and drifting from the server total.

  # ---------------------------------------------------------------- medium
  - external_key: technical.frontend_core.promise_combinators
    competency_key: javascript
    topic: Promise.all, allSettled, race and any
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Imagine a dashboard that loads six independent widgets from different endpoints. How would you
      coordinate those requests, and which promise combinator would you choose and why?
    expected_concepts:
      - Promise.all fails fast on the first rejection
      - Promise.allSettled lets each widget succeed or fail independently
      - Promise.race and Promise.any for timeouts or fastest response
      - rendering widgets progressively rather than waiting for all
      - limiting concurrency when there are many requests
    rubric:
      excellent: Chooses per-widget independence (allSettled or separate handling), explains why all would blank the whole dashboard, and discusses progressive rendering, timeouts and concurrency limits.
      good: Correctly contrasts all and allSettled for this case.
      weak: Awaits each request one after another or uses all without considering partial failure.
    followups:
      - How would you add a timeout to one slow widget?
      - What if there were two hundred requests instead of six?
    common_errors:
      - Sequential awaits that make independent requests run one after another.
      - Letting one failed widget blank the whole page.

  - external_key: technical.frontend_core.prototype_chain
    competency_key: javascript
    topic: Prototypes underneath class syntax
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What actually happens under the hood when you write a class in JavaScript and call a method on an
      instance? Walk me through how the prototype chain resolves it.
    expected_concepts:
      - methods live on the prototype object, not on each instance
      - property lookup walks the prototype chain
      - extends links prototypes and super calls the parent
      - class fields are created per instance
      - private fields are truly private, unlike underscore conventions
    rubric:
      excellent: Describes lookup along the chain precisely, explains where methods versus fields live and the memory implications, and covers inheritance and private fields.
      good: Knows classes are built on prototypes and that lookup walks up the chain.
      weak: Believes JavaScript classes work like Java classes with copied methods.
    followups:
      - Why might defining a method as an arrow-function class field use more memory?
      - How would you add behaviour to many existing objects without changing their class?
    common_errors:
      - Thinking each instance gets its own copy of every method.

  - external_key: technical.frontend_core.search_debounce
    competency_key: javascript
    topic: Debouncing, throttling and cancelling requests
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A search-as-you-type box sends a request on every keystroke, and the backend team is complaining
      about load while users occasionally see results for an older query. How would you fix both problems?
    expected_concepts:
      - debouncing input before sending requests
      - difference between debounce and throttle
      - cancelling stale requests with AbortController
      - ignoring out-of-order responses by tracking the latest query
      - caching recent results and a minimum query length
    rubric:
      excellent: Separates the load problem (debounce, minimum length, caching) from the ordering problem (cancel or discard stale responses), explains why debounce alone does not fix ordering, and picks sensible timings.
      good: Proposes debouncing and some way to discard stale responses.
      weak: Only suggests debouncing and misses the out-of-order results.
    followups:
      - When would you prefer throttling over debouncing?
      - How long a debounce delay would you choose, and how would you decide?
    common_errors:
      - Assuming debounce prevents responses arriving out of order.

  - external_key: technical.frontend_core.weak_references_gc
    competency_key: javascript
    topic: Garbage collection, WeakMap and WeakRef
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How does the JavaScript garbage collector decide what it can free, and when would you use a WeakMap
      instead of a regular Map, for example to cache data about DOM elements?
    expected_concepts:
      - reachability from roots determines what is collected
      - a Map holds strong references to its keys
      - WeakMap keys do not prevent collection
      - WeakMap is not iterable and has no size
      - WeakRef and FinalizationRegistry are rarely the right tool
    rubric:
      excellent: Explains reachability, shows how a regular Map keyed by elements leaks removed nodes, uses WeakMap correctly and explains why its keys cannot be enumerated.
      good: Knows WeakMap keys can be collected and gives a sensible use.
      weak: Thinks setting a variable to null frees memory immediately, or cannot say why WeakMap exists.
    followups:
      - Why can't you iterate over a WeakMap?
      - When would timing-dependent cleanup with FinalizationRegistry be a bad idea?
    common_errors:
      - Caching per-element data in a Map and leaking removed DOM nodes.

  - external_key: technical.frontend_core.async_iterators_pagination
    competency_key: javascript
    topic: Generators and async iterators
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Suppose you need to consume a paginated API where each page tells you the cursor for the next one.
      How could generators or async iterators help, and how would that compare to a plain loop?
    expected_concepts:
      - async generator yielding items or pages lazily
      - for await consumption
      - the consumer controls how much is fetched
      - stopping early with break triggers cleanup
      - error handling and cancellation inside the generator
    rubric:
      excellent: Sketches an async generator that hides cursor handling, explains lazy consumption and early termination, and weighs it fairly against a simple loop for readability.
      good: Knows async iterators fit this case and roughly how to write one.
      weak: Does not know what a generator does or fetches every page up front.
    followups:
      - What happens to the generator if the consumer breaks out of the loop?
      - How would you add a limit on pages fetched?
    common_errors:
      - Eagerly loading every page into memory before processing any.

  - external_key: technical.frontend_core.abort_propagation
    competency_key: javascript
    topic: Cancelling chains of async work
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A report page kicks off several dependent requests and some client-side processing. If the user
      navigates away halfway through, the work keeps running and sometimes updates a page that's gone. How
      would you design cancellation for this?
    expected_concepts:
      - AbortController and passing a signal down the call chain
      - fetch rejects with an AbortError that should not be reported as a failure
      - checking signal.aborted between steps of long processing
      - cleaning up on route change or unmount
      - combining signals, for example with AbortSignal.any or timeouts
    rubric:
      excellent: Threads one signal through every layer, distinguishes aborts from real errors, checks for cancellation in long processing, and ties cleanup to the navigation lifecycle.
      good: Uses AbortController for the fetches and cleans up on navigation.
      weak: Uses a boolean flag only for the final state update while all the work continues.
    followups:
      - How would you also give the whole operation a timeout?
      - Should an aborted request show an error to the user?
    common_errors:
      - Logging every aborted request as an error.
      - Cancelling the fetch but not the processing that follows it.

  - external_key: technical.frontend_core.ts_generic_constraints
    competency_key: typescript
    topic: Generics with keyof constraints
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you type a helper that takes a list of objects and a property name and groups the objects
      by that property, so the compiler rejects property names that don't exist?
    expected_concepts:
      - generic type parameter for the item
      - second parameter constrained with keyof
      - indexed access type for the property value
      - the returned record keyed by that value type
      - letting inference work instead of explicit type arguments
    rubric:
      excellent: Writes or describes a signature with a keyof-constrained key and indexed access types, explains the inferred return type, and handles keys whose values are not valid record keys.
      good: Uses a generic with a keyof constraint correctly.
      weak: Types the key as string and the result as any.
    followups:
      - What happens if the grouped property can be undefined?
      - How do you restrict the key to properties whose values are strings?
    common_errors:
      - Accepting any string as the key and losing type safety.

  - external_key: technical.frontend_core.ts_mapped_conditional
    competency_key: typescript
    topic: Mapped and conditional types
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Tell me about a time you derived one type from another instead of writing it by hand, for example
      turning a domain model into a form-state type. Which TypeScript features did you use and why?
    expected_concepts:
      - utility types such as Partial, Pick, Omit and Record
      - mapped types over keyof
      - conditional types and infer
      - template literal types for derived keys
      - keeping one source of truth so types cannot drift
    rubric:
      excellent: Gives a real example of deriving types, explains the mapped or conditional mechanics, and judges when derived types become too clever to maintain.
      good: Uses the built-in utility types sensibly and understands mapped types.
      weak: Duplicates types by hand and has not used mapped or conditional types.
    followups:
      - How would you make every field of a nested object optional?
      - When does a type become too complex for the team to maintain?
    common_errors:
      - Copying interfaces that then drift out of sync with the model.

  - external_key: technical.frontend_core.ts_runtime_narrowing
    competency_key: typescript
    topic: Type guards and assertion functions
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your frontend receives messages over a WebSocket that can be one of several shapes, such as a chat
      message, a typing indicator or a presence update. How would you handle them safely in TypeScript?
    expected_concepts:
      - discriminated union keyed by a type field
      - validating unknown input before narrowing
      - user-defined type guards and assertion functions
      - exhaustive handling with a never check
      - ignoring or logging unknown message types for forward compatibility
    rubric:
      excellent: Validates the raw payload as unknown, narrows into a discriminated union with guards, handles every case exhaustively, and plans for message types the client does not recognise yet.
      good: Uses a union with a discriminant and switches on it.
      weak: Casts the parsed message straight to a type and trusts it.
    followups:
      - What's the risk of a type guard that returns true too generously?
      - How would an older client cope when the server adds a new message type?
    common_errors:
      - Writing type guards that check one field and assume the rest.

  - external_key: technical.frontend_core.ts_enums_const
    competency_key: typescript
    topic: Enums, literal unions, as const and satisfies
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      For a fixed set of values like order statuses, how do you choose between a TypeScript enum, a union of
      string literals and a constant object, and where does the satisfies operator fit in?
    expected_concepts:
      - enums emit runtime code and numeric enums are loosely typed
      - string literal unions are erased and work well with JSON
      - as const objects give runtime values plus literal types
      - satisfies checks a shape without widening the inferred type
      - consistency across the codebase
    rubric:
      excellent: Compares runtime output, type safety and ergonomics of each option, explains what satisfies preserves that an annotation loses, and states a reasoned team convention.
      good: Knows the trade-off between enums and literal unions and has a preference with a reason.
      weak: Cannot distinguish the options beyond syntax.
    followups:
      - How would you get a list of all statuses at runtime from a union type?
      - Give an example where an annotation would lose information that satisfies keeps.
    common_errors:
      - Using numeric enums that accept any number.

  - external_key: technical.frontend_core.chunk_load_after_deploy
    competency_key: javascript
    topic: Dynamic imports failing after a deploy
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Right after each deploy, your error tracker fills up with failures to load dynamically imported
      chunks, mostly from users who already had the app open. What's happening and how would you fix it?
    expected_concepts:
      - old pages reference hashed chunk files that were removed by the deploy
      - keeping previous assets available for a period
      - catching import failures and reloading or prompting for a refresh
      - detecting new versions and notifying the user
      - cache headers for HTML versus hashed assets
    rubric:
      excellent: Explains the stale-client and deleted-asset mechanism, keeps old assets around, handles failures gracefully with a guarded reload, and adds version detection.
      good: Identifies stale chunk references and proposes a reload or keeping old files.
      weak: Treats it as random network flakiness.
    followups:
      - How would you avoid an infinite reload loop?
      - How long would you keep old assets, and what decides that?
    common_errors:
      - Deleting all previous build assets on every deploy.

  # ------------------------------------------------------------------ hard
  - external_key: technical.frontend_core.worker_large_file
    competency_key: javascript
    topic: Offloading heavy work to Web Workers
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Users need to upload and preview a 200 megabyte CSV file entirely in the browser, and the current
      implementation freezes the tab for half a minute. How would you redesign it?
    expected_concepts:
      - parsing in a Web Worker to keep the main thread free
      - streaming the file in chunks instead of reading it whole
      - structured clone cost versus transferable objects
      - progressive results and progress reporting
      - memory limits, virtualised preview and cancellation
    rubric:
      excellent: Moves parsing off the main thread with streaming, explains message-passing costs and transferables, shows partial results early, and addresses memory and cancellation.
      good: Moves the work to a worker and processes the file in chunks.
      weak: Suggests a loading spinner or a faster parsing library only.
    followups:
      - What does it cost to send a large array from a worker to the main thread?
      - How would you let the user cancel halfway through?
    common_errors:
      - Posting huge objects between threads and freezing the main thread on deserialisation.
      - Reading the whole file into one string.

  - external_key: technical.frontend_core.ts_library_api_types
    competency_key: typescript
    topic: Designing types for a shared library
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You're publishing an internal TypeScript library used by a dozen apps. How do you design its public
      types so they're pleasant to use, and how do you avoid breaking consumers when the types change?
    expected_concepts:
      - inference-friendly generics instead of required type arguments
      - overloads versus unions and their error messages
      - exporting stable named types and hiding internals
      - type changes can be breaking changes under semantic versioning
      - testing types with tools that assert expected types
      - generated declaration files and compatible compiler settings
    rubric:
      excellent: Designs for inference and readable errors, treats type changes as part of the versioned contract, tests types explicitly, and describes how consumers with different compiler settings are supported.
      good: Thinks about inference and semantic versioning for types.
      weak: Exports everything as any or ignores that type changes can break consumers.
    followups:
      - Give an example of a type-only change that would break a consumer's build.
      - How would you test that a misuse of the API fails to compile?
    common_errors:
      - Requiring callers to pass explicit type arguments everywhere.

  - external_key: technical.frontend_core.ts_soundness_gaps
    competency_key: typescript
    topic: Where TypeScript is unsound
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      TypeScript catches a lot, but it isn't a fully sound type system. Where have you seen it let a bug
      through, and what settings or practices do you use to close those gaps?
    expected_concepts:
      - any and type assertions bypass checking
      - array and record index access assumed to exist (noUncheckedIndexedAccess)
      - method parameter bivariance
      - mutable arrays and covariance
      - untrusted runtime data at the boundaries
      - stricter compiler flags and lint rules
    rubric:
      excellent: Names several specific unsound areas with real examples, explains why they exist, and describes concrete flags, lint rules and boundary validation that reduce the risk.
      good: Names assertions, any and index access as gaps with a mitigation.
      weak: Believes code that compiles cannot have type errors at runtime.
    followups:
      - What does noUncheckedIndexedAccess change, and what does it cost?
      - Why are method parameters checked bivariantly?
    common_errors:
      - Treating a clean compile as proof the data is the right shape.

  - external_key: technical.frontend_core.autosave_ordering
    competency_key: javascript
    topic: Ordering concurrent writes from the client
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A document editor autosaves every few seconds. Occasionally a slow save finishes after a newer one and
      the server ends up with older content. How would you make autosave reliable?
    expected_concepts:
      - serialising saves through a queue or allowing only one in flight
      - coalescing pending changes into the next save
      - version numbers or revision ids with conditional updates
      - handling conflicts from other tabs or devices
      - flushing on page hide and showing save status
    rubric:
      excellent: Prevents overlapping writes on the client, adds server-side versioning to reject stale writes, handles conflicts and unload, and communicates save state to the user.
      good: Serialises saves or uses version checks.
      weak: Increases the debounce interval and hopes it goes away.
    followups:
      - What should happen if the same document is open in two tabs?
      - How would you save the final edits when the user closes the tab?
    common_errors:
      - Relying on request order matching response order.

  - external_key: technical.frontend_core.tree_shaking_failure
    competency_key: javascript
    topic: Why tree shaking fails
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your bundle analyser shows an entire utility library and a whole icon set in the main bundle even
      though the app imports only a few functions and icons. How would you investigate and fix it?
    expected_concepts:
      - CommonJS builds that cannot be statically analysed
      - module side effects and the package sideEffects flag
      - barrel files that re-export everything
      - checking which import path pulls the code in
      - per-function imports, ES module builds or code splitting
    rubric:
      excellent: Traces why the code is retained (module format, side effects, barrel re-exports), verifies with the analyser and bundler output, fixes the root cause and adds a size check to stop it returning.
      good: Names CommonJS or side effects as causes and switches to targeted imports.
      weak: Proposes minifying more or does not know how bundlers remove unused code.
    followups:
      - What does marking a package as side-effect free promise to the bundler?
      - How would you stop this from regressing?
    common_errors:
      - Assuming named imports are always tree-shaken.

  - external_key: technical.frontend_core.stale_data_after_account_switch
    competency_key: debugging
    topic: Data from a previous session showing after sign-in
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A customer reports that after signing out and a colleague signing in on the same shared computer, parts
      of the app briefly showed the previous person's data. How would you investigate where that data could be
      coming from?
    expected_concepts:
      - in-memory client caches and global stores not reset on sign-out
      - persisted storage such as localStorage or IndexedDB
      - service worker or HTTP caches holding personalised API responses
      - missing Cache-Control private or no-store on authenticated responses
      - other open tabs still holding the old session
      - treating it as a potential data exposure incident
    rubric:
      excellent: Enumerates every client and cache layer that could hold the data, reproduces methodically, fixes sign-out to clear state and caching headers to prevent reuse, and escalates it as a privacy issue.
      good: Checks client state and storage clearing on sign-out and caching of API responses.
      weak: Assumes the backend returned the wrong user's data without checking the client.
    followups:
      - How would you prove whether the data came from the network or from a cache?
      - What would a complete sign-out need to clear on the client?
    common_errors:
      - Clearing the auth token but not the cached query data.
