# Curated questions: data analyst — metric definitions, product analytics, cohorts and funnels.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_analyst]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.data_analyst.monthly_churn_calculation
    competency_key: data_analysis
    topic: Calculating subscription churn
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you calculate monthly churn for a subscription business, and what decisions do you have to make
      along the way that change the number?
    expected_concepts:
      - customers at the start of the month as the denominator
      - customer churn versus revenue churn
      - how to treat new customers who join and leave within the month
      - pauses, downgrades and reactivations
      - voluntary versus failed-payment churn
    rubric:
      excellent: Defines numerator and denominator precisely, distinguishes logo and revenue churn, and explains how mid-month sign-ups, pauses and payment failures change the result.
      good: Gives a correct basic formula and names one or two definitional choices.
      weak: Divides cancellations by total customers at month end without considering who was eligible to churn.
    followups:
      - How would annual plans affect a monthly churn number?
      - When would revenue churn tell a different story from customer churn?
    common_errors:
      - Including customers who signed up during the month in the starting base.

  - external_key: technical.data_analyst.signup_funnel_steps
    competency_key: data_analysis
    topic: Defining a funnel
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Suppose you're asked to build a funnel for a new sign-up flow that goes from landing page to a completed
      profile. How would you choose the steps and decide what to measure at each one?
    expected_concepts:
      - steps that map to distinct user actions with reliable events
      - user-level versus session-level counting
      - step-to-step and overall conversion
      - a time window for completing the funnel
      - time between steps as well as drop-off
    rubric:
      excellent: Picks steps tied to tracked actions, chooses users as the unit with a completion window, reports step and overall conversion plus time-to-complete, and checks the tracking exists before building.
      good: Lists sensible steps and step-to-step conversion.
      weak: Lists pages without thinking about the counting unit or time window.
    followups:
      - What would you do if one step has no reliable event?
      - Why might time between steps matter as much as drop-off?
    common_errors:
      - Mixing session-based and user-based counts across steps.

  - external_key: technical.data_analyst.reading_retention_triangle
    competency_key: data_analysis
    topic: Reading a cohort retention table
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Imagine I show you a cohort retention table with sign-up month down the side and months since sign-up
      across the top. What do you look for when you read it, and what can it tell you?
    expected_concepts:
      - reading along a row for one cohort's decay
      - reading down a column to compare cohorts at the same age
      - where the curve flattens as the retained core
      - diagonals revealing calendar-time effects
      - cohort size affecting reliability
    rubric:
      excellent: Explains rows, columns and diagonals, identifies flattening as a sign of a retained core, ties diagonal patterns to calendar events, and notes that small cohorts are noisy.
      good: Correctly reads rows and columns and compares newer and older cohorts.
      weak: Reads it as a simple time series or cannot explain what the cells represent.
    followups:
      - What would a dip running diagonally across the table suggest?
      - How would you show the same information as a chart?
    common_errors:
      - Comparing cohorts at different ages and calling it a trend.

  - external_key: technical.data_analyst.orders_dropped_first_steps
    competency_key: problem_solving
    topic: First response to a sudden metric drop
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You come in on Monday morning and daily orders for Sunday are fifteen percent below normal. What do you do
      in the first half hour?
    expected_concepts:
      - checking data freshness and pipeline completeness first
      - comparing with the same day in previous weeks
      - looking for known events such as releases, outages or holidays
      - slicing by platform, region and channel
      - telling stakeholders what is known and when to expect more
    rubric:
      excellent: Rules out data problems first, compares against the right baseline, checks for known events, slices to locate the drop, and sends a short status note with what is and isn't known.
      good: Checks data quality and breaks the metric down by a few dimensions.
      weak: Immediately reports a business problem or starts a long analysis without basic checks.
    followups:
      - Which slice would you check first, and why?
      - What would you write in a two-line message to the team at this point?
    common_errors:
      - Comparing Sunday with Saturday instead of with previous Sundays.

  - external_key: technical.data_analyst.choosing_one_key_metric
    competency_key: product_sense
    topic: Choosing a primary product metric
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you had to pick a single metric that best shows whether a product you've worked on is delivering value
      to customers, what would it be, and why that one over the alternatives?
    expected_concepts:
      - linking the metric to customer value, not just activity
      - being influenced by the team's work
      - leading indicator of revenue or retention
      - supporting metrics and guardrails alongside it
      - weaknesses of the chosen metric
    rubric:
      excellent: Chooses a metric tied to value delivered, explains why it leads to business outcomes, compares it with at least one alternative, and acknowledges its blind spots and the guardrails needed.
      good: Picks a reasonable metric with a clear justification.
      weak: Picks revenue or total users by default with no reasoning about the product.
    followups:
      - How could a team improve that metric while making the product worse?
      - What metric would you pair with it as a guardrail?
    common_errors:
      - Choosing a metric the team cannot meaningfully influence.

  - external_key: technical.data_analyst.total_registered_users_kpi
    competency_key: product_sense
    topic: Vanity versus actionable metrics
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      The marketing director wants total registered users as the headline number on the executive dashboard.
      What would you say, and what might you suggest instead?
    expected_concepts:
      - cumulative metrics only ever go up
      - not reflecting engagement or retention
      - suggesting active users, new activated users or retention
      - understanding what decision the director wants to support
      - keeping registrations as context rather than the headline
    rubric:
      excellent: Explains why a cumulative count hides problems, asks what decision the dashboard should support, and proposes an actionable alternative while respecting the director's goal.
      good: Points out the metric always grows and suggests an active-user metric.
      weak: Builds it as asked without comment, or dismisses the request without offering an alternative.
    followups:
      - The director insists. How do you handle it?
      - How would you define an activated user for this product?
    common_errors:
      - Swapping in a different metric without first understanding what the stakeholder needs.

  - external_key: technical.data_analyst.payment_step_drop
    competency_key: data_analysis
    topic: Investigating funnel drop-off
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your checkout funnel shows that far more people abandon at the payment step than at any other step. How
      would you dig into why?
    expected_concepts:
      - segmenting by device, browser, payment method and country of card issue
      - comparing with historical drop-off at the same step
      - checking error logs and declined payments
      - looking at session recordings or qualitative feedback
      - checking whether the event tracking itself is reliable
    rubric:
      excellent: Compares with history to see if the drop is new, segments to find where it concentrates, checks errors and declines, validates the tracking, and adds qualitative evidence before recommending changes.
      good: Segments the drop-off and checks for errors.
      weak: Assumes price or user intent without investigating.
    followups:
      - How would you separate payment declines from users choosing to leave?
      - Who would you talk to outside the data team?
    common_errors:
      - Not checking whether the payment step's tracking event fires reliably.

  - external_key: technical.data_analyst.dau_mau_stickiness
    competency_key: data_analysis
    topic: Interpreting stickiness ratios
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What does the ratio of daily to monthly active users tell you about a product, and when can it be
      misleading?
    expected_concepts:
      - how often the typical monthly user comes back
      - depends on the product's natural usage frequency
      - shifts caused by a surge of new users
      - being a ratio, it can rise while both counts fall
      - looking at the distribution of active days instead
    rubric:
      excellent: Explains the ratio as visit frequency, notes it only makes sense for products meant to be used daily, shows how growth or decline in either count moves it, and suggests a days-active distribution as a richer view.
      good: Explains what it measures and gives one way it misleads.
      weak: Treats a higher ratio as always better regardless of the product.
    followups:
      - What would a sudden drop in the ratio after a big marketing campaign mean?
      - What would you use instead for a product people need once a month?
    common_errors:
      - Comparing the ratio across products with very different natural usage patterns.

  # ---------------------------------------------------------------- medium
  - external_key: technical.data_analyst.choosing_cohort_definition
    competency_key: data_analysis
    topic: Choosing how to define cohorts
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you build a retention analysis, how do you decide whether to group customers by sign-up date, first
      purchase date, acquisition channel or something else? Walk me through an example.
    expected_concepts:
      - matching the cohort definition to the question being asked
      - sign-up versus activation or first purchase as the start event
      - behavioural cohorts versus time-based cohorts
      - cohort size and comparability
      - keeping the definition stable over time
    rubric:
      excellent: Starts from the question, explains how the start event changes the answer, chooses time or behavioural cohorts accordingly with a concrete example, and considers cohort size and stability.
      good: Gives a sensible choice with a reason for one example.
      weak: Always uses sign-up month without thinking about the question.
    followups:
      - Why might first purchase be a better start event than sign-up?
      - What is the risk of cohorting by a behaviour that happens after sign-up?
    common_errors:
      - Defining behavioural cohorts without accounting for how long users had to perform the behaviour.

  - external_key: technical.data_analyst.onboarding_retention_impact
    competency_key: product_sense
    topic: Judging a retention change from cohorts
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A redesigned onboarding flow launched two months ago, and the team wants to know if it improved retention.
      There was no experiment. How would you use cohort data to give them an answer?
    expected_concepts:
      - comparing cohorts before and after launch at the same age
      - checking for other changes in the same period such as campaigns or seasonality
      - early retention proxies because long-term data is not yet available
      - comparing like-for-like segments and channels
      - stating the limits of a before-and-after comparison
    rubric:
      excellent: Compares pre and post cohorts at equal ages, controls for channel mix and seasonality, uses early leading indicators while long-term data matures, and is explicit that the result is suggestive rather than causal.
      good: Compares cohorts before and after and mentions other confounding changes.
      weak: Compares overall retention this month with last month and attributes any difference to onboarding.
    followups:
      - A big campaign started the same week. How do you deal with that?
      - What would you recommend for the next launch so this question is easier to answer?
    common_errors:
      - Comparing new cohorts at one month old with older cohorts at three months old.

  - external_key: technical.data_analyst.ordered_funnel_query
    competency_key: sql
    topic: Funnel with ordering and time windows
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You need a funnel where a user only counts at a step if they completed the previous step first, and the
      whole thing has to happen within seven days of the first step. How would you build that from an events
      table?
    expected_concepts:
      - first timestamp of each step per user
      - requiring each step's time to be after the previous step's time
      - bounding all steps within the window from the entry event
      - left joins or conditional aggregation per step
      - users who repeat steps or enter several times
    rubric:
      excellent: Builds per-user step timestamps, enforces ordering and the window relative to the entry event, handles repeat entries deliberately, and explains the choice of first or any qualifying occurrence.
      good: Gets ordering and the window right with some prompting on repeats.
      weak: Counts distinct users per step independently, so the funnel is not actually ordered.
    followups:
      - A user starts the funnel twice in a month. Which attempt counts?
      - How would you make the window configurable for analysts who reuse your query?
    common_errors:
      - Taking the minimum time of each step independently, so a later step can appear before an earlier one.

  - external_key: technical.data_analyst.users_skipping_steps
    competency_key: data_analysis
    topic: Non-linear user journeys in funnels
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a real product, users jump into the middle of a funnel from a shared link, skip optional steps or switch
      devices halfway through. How do you handle that when you report funnel conversion?
    expected_concepts:
      - open versus closed funnel definitions
      - stitching identities across devices after login
      - treating optional steps separately from required ones
      - reporting entry points as their own segments
      - path analysis to see real journeys
    rubric:
      excellent: Distinguishes open and closed funnels and when each is useful, explains identity stitching and its limits, separates optional steps, and uses path analysis to understand actual journeys.
      good: Recognises the issue and proposes a sensible way to count mid-funnel entrants.
      weak: Forces every user through the defined steps and drops anyone who doesn't fit.
    followups:
      - How would anonymous browsing before login affect your numbers?
      - When would a path analysis be more useful than a funnel?
    common_errors:
      - Counting the same person twice because they used two devices.

  - external_key: technical.data_analyst.churn_early_warning
    competency_key: data_analysis
    topic: Finding leading indicators of churn
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      The customer success team wants an early warning list of business accounts likely to cancel in the next
      quarter. How would you approach the analysis behind it?
    expected_concepts:
      - defining churn and the prediction horizon
      - candidate signals such as usage decline, seat reductions, support tickets
      - comparing churned and retained accounts on behaviour before churn
      - validating on past periods
      - making the output actionable for the team
    rubric:
      excellent: Defines the target and horizon, looks at behaviour in the period before churn compared with retained accounts, validates the signals on historical data, and shapes the output into something the success team can act on with clear reasons per account.
      good: Identifies sensible signals and checks them against past churn.
      weak: Lists signals from intuition without testing them on data.
    followups:
      - How would you measure whether the list is actually useful to the team?
      - What would you do if the strongest signal is something the team can't influence?
    common_errors:
      - Using signals that only appear after the customer has already decided to cancel.

  - external_key: technical.data_analyst.revenue_driver_decomposition
    competency_key: data_analysis
    topic: Decomposing a metric into drivers
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Online revenue is down this month. How would you break revenue into its component drivers so you can tell
      the team where the change actually came from?
    expected_concepts:
      - revenue as visitors times conversion times average order value
      - further splitting by new versus returning or by channel
      - quantifying each driver's contribution to the change
      - checking interactions between drivers
      - turning the result into a short explanation
    rubric:
      excellent: Builds a driver tree with multiplicative components, quantifies how much of the change each explains, splits further where it matters, and summarises the main driver in plain language.
      good: Splits revenue into traffic, conversion and order value and compares each.
      weak: Lists possible causes without a structured breakdown.
    followups:
      - Conversion and order value moved in opposite directions. How do you report that?
      - How would you automate this breakdown for the weekly business review?
    common_errors:
      - Adding percentage changes of multiplicative drivers as if they were additive.

  - external_key: technical.data_analyst.engagement_guardrails
    competency_key: product_sense
    topic: Counter-metrics for a growth feature
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A team is launching more frequent push notifications to increase engagement. Which metrics would you track
      alongside engagement to make sure the change isn't doing hidden harm?
    expected_concepts:
      - notification opt-outs and app uninstalls
      - longer-term retention rather than short-term sessions
      - complaints and support contacts
      - quality of engagement such as meaningful actions per session
      - effects on other features or channels
    rubric:
      excellent: Proposes specific guardrails for user harm and long-term value, explains how each could move in the wrong direction, and suggests thresholds that would stop the rollout.
      good: Names opt-outs, uninstalls and retention as guardrails.
      weak: Only tracks sessions or opens.
    followups:
      - How long would you watch the guardrails before calling it safe?
      - Which guardrail would you treat as a hard stop?
    common_errors:
      - Measuring only short-term engagement that the notifications directly cause.

  - external_key: technical.data_analyst.feature_users_retain_better
    competency_key: data_analysis
    topic: Selection bias in feature analysis
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A product manager shows you that customers who use the saved-lists feature retain twice as well as those
      who don't, and wants to push every new user into it. How would you respond?
    expected_concepts:
      - self-selection of already engaged users
      - reverse causality since retained users have more time to discover features
      - controlling for prior engagement or tenure
      - matched comparisons or an experiment to test causality
      - still treating it as a useful hypothesis
    rubric:
      excellent: Explains self-selection and reverse causality clearly, proposes controlling for prior engagement and tenure, recommends an experiment such as prompting a random group, and keeps the idea alive as a hypothesis worth testing.
      good: Raises correlation versus causation and suggests an experiment.
      weak: Accepts the claim, or dismisses it without proposing a way to test it.
    followups:
      - How would you design a quick test of the PM's idea?
      - What would you look at before the experiment to make the comparison fairer?
    common_errors:
      - Comparing users over different lengths of time since sign-up.

  - external_key: technical.data_analyst.ltv_with_short_history
    competency_key: data_analysis
    topic: Estimating customer lifetime value
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your subscription product is only a year old, and the finance team wants an estimate of customer lifetime
      value to set marketing budgets. How would you produce something useful with so little history?
    expected_concepts:
      - margin per customer per period, not just revenue
      - extrapolating retention curves from early cohorts
      - ranges or scenarios rather than one number
      - segmenting by channel or plan
      - revisiting the estimate as cohorts mature
    rubric:
      excellent: Builds the estimate from margin and a fitted or assumed retention curve, shows scenarios with stated assumptions, segments where it matters for budgeting, and plans to update it as data matures.
      good: Combines revenue per customer with observed retention to give an estimate and mentions uncertainty.
      weak: Multiplies monthly revenue by an arbitrary lifetime with no reasoning.
    followups:
      - Which assumption would move the answer most, and how would you show that?
      - Why might lifetime value differ sharply between acquisition channels?
    common_errors:
      - Using revenue instead of margin, which overstates what can be spent on acquisition.

  - external_key: technical.data_analyst.month_on_month_seasonality
    competency_key: data_analysis
    topic: Separating growth from seasonality
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Sales in November were twenty percent higher than October, and the sales director wants to credit the new
      pricing page. How would you check whether that growth is real?
    expected_concepts:
      - year-over-year comparison for the same period
      - calendar effects such as number of weekends or promotions
      - seasonal patterns in previous years
      - comparing segments exposed and not exposed to the change
      - presenting the adjusted estimate with caveats
    rubric:
      excellent: Compares with the same months in prior years, adjusts for calendar and promotional effects, looks for a comparison group not exposed to the pricing page, and gives a measured estimate with caveats.
      good: Mentions seasonality and year-over-year comparison.
      weak: Accepts the month-on-month growth as caused by the pricing page.
    followups:
      - What if you only have one year of history?
      - How would you present this to the director without dismissing their idea?
    common_errors:
      - Comparing months with different numbers of trading days without adjusting.

  - external_key: technical.data_analyst.agreeing_active_customer
    competency_key: stakeholder_management
    topic: Aligning teams on one metric definition
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Sales, product and finance each define an active customer differently, and leadership keeps seeing
      conflicting numbers. You've been asked to fix it. How would you get to one definition people actually use?
    expected_concepts:
      - documenting each current definition and its purpose
      - quantifying how far apart the numbers are
      - proposing a definition with clear rules and edge cases
      - agreeing an owner and a decision-maker
      - naming variants explicitly when different purposes need them
      - publishing it in a shared metrics layer or glossary
    rubric:
      excellent: Surfaces each definition and why it exists, quantifies the differences, facilitates a decision with a clear owner, allows clearly named variants where needed, and makes the definition the default in shared tools.
      good: Brings the teams together to agree a definition and documents it.
      weak: Picks their own definition and expects others to adopt it, or leaves it unresolved.
    followups:
      - Finance refuses to change its definition. What do you do?
      - How do you make sure dashboards actually switch to the new definition?
    common_errors:
      - Forcing one definition where teams legitimately need different measures, instead of naming them differently.

  # ------------------------------------------------------------------ hard
  - external_key: technical.data_analyst.weekly_actives_slow_decline
    competency_key: problem_solving
    topic: Diagnosing a gradual metric decline
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Weekly active users have slid about eight percent over three weeks. There were no big launches and no
      outages. Walk me through how you'd find the cause.
    expected_concepts:
      - confirming the data and definition have not changed
      - external factors such as seasonality, competitors or marketing spend
      - decomposing into new, returning and resurrected users
      - segmenting by platform, version, channel and geography
      - checking small releases, app store or tracking changes
      - forming and testing hypotheses rather than slicing endlessly
    rubric:
      excellent: Validates the data first, decomposes the metric into user flows, segments systematically to localise the decline, checks small changes and external factors, and works hypothesis by hypothesis to a conclusion with evidence.
      good: Checks data quality, segments the metric and considers external causes.
      weak: Slices randomly without a plan or jumps to a single explanation.
    followups:
      - The decline is only on one app version. What do you do next?
      - How would you know when to stop investigating and report back?
    common_errors:
      - Looking only at total users and missing that new user inflow, not retention, changed.

  - external_key: technical.data_analyst.marketplace_health_metrics
    competency_key: product_sense
    topic: Measuring a two-sided marketplace
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Say you join a marketplace that connects local cleaners with households. How would you design the set of
      metrics that tells leadership whether the marketplace is healthy?
    expected_concepts:
      - demand-side metrics such as repeat bookings
      - supply-side metrics such as cleaner utilisation and earnings
      - liquidity, like the share of requests that get matched
      - quality signals such as cancellations and ratings
      - local market-level views rather than only global totals
      - tension between the sides and guardrails
    rubric:
      excellent: Covers both sides and liquidity, measures at the local market level, includes quality and repeat behaviour, and explains how improving one side can hurt the other with guardrails to catch it.
      good: Includes both supply and demand metrics and a liquidity measure.
      weak: Lists only revenue or bookings totals.
    followups:
      - Which single metric would you watch most closely in a brand new city?
      - How could a promotion for households hurt the cleaner side?
    common_errors:
      - Aggregating globally and hiding cities where one side is starved.

  - external_key: technical.data_analyst.channel_attribution_limits
    competency_key: data_analysis
    topic: Marketing attribution
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Marketing wants to know which channels deserve more budget, and asks you for an attribution report. How
      would you approach attribution, and what would you warn them about?
    expected_concepts:
      - last-touch, first-touch and multi-touch rule-based models
      - attribution rewarding channels that capture existing demand
      - tracking gaps across devices and privacy limits
      - incrementality tests such as geo or holdout experiments
      - marketing mix modelling for spend-level decisions
    rubric:
      excellent: Compares attribution models and their biases, explains that attribution does not measure incrementality, proposes holdout or geo tests for key channels, and frames the report's limits clearly for budget decisions.
      good: Describes several attribution models and their trade-offs.
      weak: Presents last-click results as the true value of each channel.
    followups:
      - Branded search looks like the best channel. Why might that be misleading?
      - How would you design a test to measure one channel's real impact?
    common_errors:
      - Treating attributed conversions as conversions the channel caused.

  - external_key: technical.data_analyst.retention_drop_from_mix
    competency_key: data_analysis
    topic: Separating mix effects in retention
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Retention for recent cohorts is clearly worse, but over the same period the company doubled paid
      acquisition. Leadership wants to know if the product got worse. How would you separate those two
      explanations?
    expected_concepts:
      - comparing retention within each acquisition channel
      - reweighting recent cohorts to the old channel mix
      - quality differences within paid campaigns
      - checking organic cohorts as a cleaner baseline
      - reporting both the mix effect and any real change
    rubric:
      excellent: Splits retention by channel, reweights to a fixed mix to estimate the like-for-like change, examines campaign-level quality, and presents both effects with their sizes so leadership can act on each.
      good: Segments by channel and recognises the mix effect.
      weak: Answers yes or no from the blended curve.
    followups:
      - Organic retention is also slightly down. How do you report that?
      - What would you tell the growth team about their campaigns?
    common_errors:
      - Reporting the blended decline as a product problem.

  - external_key: technical.data_analyst.price_change_no_experiment
    competency_key: statistics_experimentation
    topic: Estimating impact without an experiment
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A price increase was rolled out to some markets but not others, with no experiment, and leadership wants to
      know what it did to sales. How would you estimate the impact?
    expected_concepts:
      - using unaffected markets as a comparison group
      - difference-in-differences
      - checking parallel pre-trends
      - synthetic control or matched markets as alternatives
      - sensitivity checks and a stated range
    rubric:
      excellent: Uses the untouched markets for a difference-in-differences estimate, checks pre-period trends, considers synthetic control when markets differ, runs sensitivity checks, and reports a range with stated assumptions.
      good: Compares changed and unchanged markets before and after, recognising the need for similar trends.
      weak: Compares sales before and after in the changed markets only.
    followups:
      - The comparison markets were already trending differently. What now?
      - How would you explain the method to a non-technical leadership team?
    common_errors:
      - Ignoring how the markets were chosen for the increase, which can bias the comparison.

  - external_key: technical.data_analyst.metric_becomes_target
    competency_key: product_sense
    topic: Designing metrics that resist gaming
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Once a support team was measured on average handle time, tickets got closed faster but customers started
      reopening them. How do you design metrics for teams so they don't get gamed like that?
    expected_concepts:
      - Goodhart's law
      - pairing efficiency metrics with quality and outcome metrics
      - measuring the customer outcome, such as resolution without reopening
      - reviewing metrics periodically for unintended behaviour
      - involving the team in choosing the measures
    rubric:
      excellent: Names the gaming dynamic, pairs speed with outcome and quality measures, prefers metrics close to customer value, and builds in regular review to catch unintended behaviour.
      good: Suggests adding a quality metric such as reopen rate.
      weak: Proposes stricter monitoring of the same metric.
    followups:
      - How would you detect gaming early from the data?
      - Which metric would you put first for this support team, and why?
    common_errors:
      - Adding more targets without considering how they interact.
