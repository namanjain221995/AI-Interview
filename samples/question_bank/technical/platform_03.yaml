# Platform engineering (3/4): developer experience metrics, shared CI/CD, GitOps, environments,
# the inner loop and observability by default.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [platform]
questions:
  # ------------------------------------------------------------ developer experience metrics
  - external_key: technical.platform.dora_metrics_collection
    competency_key: ci_cd
    topic: Collecting delivery metrics
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Say you want to report the four DORA metrics for your engineering organisation. Where would the data for
      each one actually come from in your tooling?
    expected_concepts:
      - deployment frequency from deploy events per service
      - lead time from commit or merge timestamps to production deploy
      - change failure rate by linking deploys to incidents or rollbacks
      - time to restore from incident open and resolve times
      - consistent definitions agreed across teams
    rubric:
      excellent: Names a concrete source for each metric, explains how deploys are linked to commits and incidents, and calls out the definitional choices that make numbers comparable.
      good: Correctly names the four metrics and plausible sources for most of them.
      weak: Cannot name the metrics or proposes asking teams to self-report.
    followups:
      - How would you decide whether a deploy counts as a failure?
      - Which of the four is hardest to measure accurately, and why?
    common_errors:
      - Measuring lead time from ticket creation, which mixes in planning time.

  - external_key: technical.platform.ranking_teams_by_metrics
    competency_key: ci_cd
    topic: Misuse of delivery metrics
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An executive sees your new delivery metrics dashboard and asks for a league table ranking teams by
      deployment frequency. How would you respond, and what would you offer instead?
    expected_concepts:
      - metrics used as targets get gamed
      - teams differ in architecture, domain and risk profile
      - using metrics for trends and improvement within a team
      - pairing speed with stability measures
      - offering an organisation-level view and bottleneck analysis
    rubric:
      excellent: Explains how ranking distorts behaviour and ignores context, pairs throughput with stability, and offers trend-based and organisation-level views that support the executive's real goal.
      good: Pushes back on ranking and suggests trends over time.
      weak: Builds the league table without concern or refuses without offering an alternative.
    followups:
      - What question do you think the executive is really trying to answer?
      - How would you spot a team gaming deployment frequency?
    common_errors:
      - Presenting a single metric without its counterbalancing stability measure.

  - external_key: technical.platform.developer_experience_measurement
    competency_key: product_sense
    topic: Measuring developer experience beyond DORA
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      DORA metrics tell you about delivery, but not much about how it feels to build software at your
      company. How would you measure developer experience more completely?
    expected_concepts:
      - periodic developer surveys on friction points
      - frameworks such as SPACE or DevEx (flow, feedback loops, cognitive load)
      - system measures like build time, review wait and environment setup time
      - combining perceptual and system data
      - acting on results and closing the loop with developers
    rubric:
      excellent: Combines survey-based perception with system telemetry using a coherent framework, explains how the two validate each other and how results feed decisions visible to developers.
      good: Proposes surveys plus a few system measures.
      weak: Relies solely on DORA or on anecdotal feedback.
    followups:
      - How would you keep survey response rates useful over time?
      - Survey results say builds are slow but build metrics look fine. What now?
    common_errors:
      - Running surveys without acting on them, which kills participation.

  - external_key: technical.platform.platform_value_evidence
    competency_key: product_sense
    topic: Showing the platform was worth it
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A year after your platform launched, the VP of engineering asks whether the investment paid off. What
      evidence would you bring to that conversation?
    expected_concepts:
      - baseline measurements taken before the platform
      - adoption and satisfaction among product teams
      - time saved in provisioning, onboarding and deploys
      - reliability and security improvements such as fewer incidents or faster patching
      - costs of the platform compared with the value delivered
    rubric:
      excellent: Compares against baselines across adoption, developer time saved, reliability, security and cost, is candid about where the platform underdelivered, and translates results into business terms.
      good: Brings adoption and a few before-and-after measures.
      weak: Lists features shipped as proof of value.
    followups:
      - You never captured a baseline. How would you reconstruct one?
      - Which result would you expect to be weakest, and how would you present it?
    common_errors:
      - Reporting activity, such as number of features or tickets closed, as outcome.

  - external_key: technical.platform.ci_pipeline_telemetry
    competency_key: observability
    topic: Instrumenting the CI system
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you were responsible for the shared CI system, which measurements would you track to know whether
      developers are having a good experience with it?
    expected_concepts:
      - queue time before a job starts
      - pipeline duration at median and p95
      - success rate and failure categories (infrastructure versus test failures)
      - flaky test rate
      - runner capacity, utilisation and cost
    rubric:
      excellent: Tracks queue time, duration percentiles, failure categories separating platform from code failures, flakiness and capacity, and explains which ones developers feel most.
      good: Tracks duration and success rate plus one more relevant metric.
      weak: Only tracks whether the CI system is up.
    followups:
      - Why does the p95 matter more than the average here?
      - How would you tell an infrastructure failure from a test failure automatically?
    common_errors:
      - Counting infrastructure failures as developer test failures.

  - external_key: technical.platform.flaky_tests_org_wide
    competency_key: ci_cd
    topic: Flaky tests across the organisation
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Developers across the company have started re-running pipelines by reflex because tests fail randomly.
      What could the platform team do about flaky tests at an organisational level?
    expected_concepts:
      - detecting flakiness from retry and history data
      - quarantining flaky tests with owners and deadlines
      - reporting flakiness per team and test
      - fixing platform-caused flakiness (shared resources, noisy runners)
      - limited automatic retries with visibility, not hidden
    rubric:
      excellent: Detects flakiness from historical data, quarantines with ownership and deadlines, separates platform-caused from test-caused flakiness, and makes retries visible rather than masking problems.
      good: Detects and quarantines flaky tests and reports them to owners.
      weak: Adds blanket automatic retries everywhere.
    followups:
      - How do you stop the quarantine from becoming a permanent graveyard?
      - Which flakiness would you consider the platform's own fault?
    common_errors:
      - Silent retries that hide real race conditions.

  # ------------------------------------------------------------ shared CI/CD
  - external_key: technical.platform.reusable_pipeline_definitions
    competency_key: ci_cd
    topic: Reusable pipeline definitions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How have you shared pipeline logic across many repositories, for example with reusable workflows or
      included templates, and how did teams pick up new versions of it?
    expected_concepts:
      - central reusable workflows or includes
      - versioned references (tags) rather than a moving branch
      - inputs for per-repository customisation
      - automated version bump pull requests
      - balancing central control with team flexibility
    rubric:
      excellent: Describes a concrete reusable pipeline setup, versioned references with automated upgrades, a sensible input interface and how breaking changes were communicated.
      good: Has used shared templates with some versioning.
      weak: Copies pipeline files between repositories by hand.
    followups:
      - What went wrong when a shared pipeline change broke many repositories?
      - What should teams be allowed to override?
    common_errors:
      - Referencing the main branch of the shared template, so every change hits every repository at once.

  - external_key: technical.platform.mandatory_pipeline_step_rollout
    competency_key: ci_cd
    topic: Adding a required step to every pipeline
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Security now requires an SBOM and a vulnerability scan for every production artifact. You have three
      hundred repositories, some on shared pipeline templates at various versions and some with fully custom
      pipelines. How would you get to full coverage?
    expected_concepts:
      - inventory of repositories and their pipeline type and version
      - adding the step to the shared templates and bumping consumers automatically
      - handling custom pipelines with contributed changes or a platform-run job
      - verifying coverage at deploy or admission time (attestations required)
      - deadlines, dashboards and exception handling
    rubric:
      excellent: Inventories pipelines, updates templates and automates upgrades, has a plan for custom pipelines, and closes the loop by requiring the SBOM attestation at deploy time so coverage is enforced rather than hoped for.
      good: Updates the templates, chases custom pipelines and tracks coverage.
      weak: Announces the requirement and relies on teams to add the step.
    followups:
      - How would you know an artifact in production has no SBOM?
      - Could the platform generate SBOMs without touching every pipeline?
    common_errors:
      - Measuring coverage by pipelines changed rather than by artifacts deployed.

  # ------------------------------------------------------------ GitOps
  - external_key: technical.platform.gitops_benefits
    competency_key: kubernetes
    topic: Why platforms use GitOps
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What does a GitOps approach, using something like Argo CD or Flux, give a platform team compared with
      pipelines that push changes straight into clusters?
    expected_concepts:
      - Git as the desired state and audit history
      - pull-based reconciliation with credentials kept inside the cluster
      - drift detection and correction
      - easy rollback by reverting commits
      - recreating clusters from the repository
    rubric:
      excellent: Explains pull-based reconciliation, drift handling, audit history, credential placement and disaster recovery benefits, and notes the trade-offs such as secrets handling and repository sprawl.
      good: Names audit history, rollback and drift detection.
      weak: Describes GitOps as storing YAML in Git without the reconciliation part.
    followups:
      - What is awkward to manage with GitOps?
      - How do secrets fit into a GitOps workflow?
    common_errors:
      - Not realising GitOps tools will revert manual changes made in the cluster.

  - external_key: technical.platform.gitops_repository_layout
    competency_key: kubernetes
    topic: Structuring GitOps configuration at scale
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      With fifty teams, three environments and ten clusters, how would you lay out the GitOps repositories so
      that teams can move fast without stepping on each other or on platform components?
    expected_concepts:
      - separating platform components from application config
      - per-team repositories or directories with ownership rules
      - base and overlays (Kustomize or Helm values) per environment
      - generators such as ApplicationSets for clusters and tenants
      - promotion between environments through pull requests
    rubric:
      excellent: Proposes a layout that separates platform and tenant concerns, enforces ownership, uses bases and overlays, generates per-cluster applications and supports promotion between environments through reviewed changes.
      good: A reasonable structure with environment overlays and per-team ownership.
      weak: One repository with copied YAML per environment and no ownership boundaries.
    followups:
      - Where would you put environment-specific secrets references?
      - How would you prevent a team from changing another team's manifests?
    common_errors:
      - Long-lived environment branches that drift apart.

  - external_key: technical.platform.gitops_reverted_manual_fix
    competency_key: kubernetes
    topic: GitOps reverting a manual hotfix
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      During an incident, an engineer scaled a deployment up by hand, and a few minutes later the GitOps
      controller reverted it, making the outage worse. How would you handle that situation now, and what
      would you change afterwards?
    expected_concepts:
      - making the change through Git as the fast path
      - pausing sync for the specific application during an incident
      - ignoring fields managed by autoscalers (replicas)
      - documenting the incident procedure for GitOps-managed resources
      - fast merge paths for emergency changes
    rubric:
      excellent: Restores service by committing or pausing sync in a controlled way, fixes the underlying config such as ignoring autoscaler-managed fields, and creates a documented emergency path that keeps Git the source of truth.
      good: Pauses sync or commits the change and reviews the procedure.
      weak: Disables GitOps for the cluster or blames the engineer.
    followups:
      - Why might replicas not belong in Git at all?
      - How do you make sure a paused application gets resumed?
    common_errors:
      - Leaving sync disabled after the incident so drift accumulates.

  # ------------------------------------------------------------ environments and inner loop
  - external_key: technical.platform.preview_environments_design
    competency_key: kubernetes
    topic: Per-pull-request preview environments
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Teams want a temporary environment for every pull request so reviewers can try the change. How would
      you design that on your platform?
    expected_concepts:
      - namespace or lightweight environment per pull request created by automation
      - which dependencies are real, shared or mocked
      - test data seeding and isolation
      - unique URLs and authentication
      - automatic teardown on merge or inactivity
      - cost and capacity limits
    rubric:
      excellent: Designs automated creation and teardown, makes deliberate choices about which dependencies are shared versus per-environment, handles test data, URLs and access, and caps cost.
      good: Automates namespace-per-PR creation with teardown.
      weak: Proposes a full copy of production per pull request without considering cost or data.
    followups:
      - A service depends on twelve others. Do you deploy all of them each time?
      - How would you handle database schema changes in a preview environment?
    common_errors:
      - No teardown, so abandoned environments accumulate.

  - external_key: technical.platform.ephemeral_env_cost_spike
    competency_key: cloud_cost_optimization
    topic: Ephemeral environment costs out of control
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Three months after you launched preview environments, the cloud bill for your non-production
      clusters has tripled. How would you investigate and bring it back under control without taking the
      feature away?
    expected_concepts:
      - attributing cost to environments by labels
      - finding orphaned or long-lived environments
      - time-to-live and idle shutdown
      - smaller resource requests and shared dependencies
      - spot or scale-to-zero capacity for preview workloads
      - budgets and alerts per team
    rubric:
      excellent: Attributes cost per environment, finds orphans and oversized requests, adds TTLs, idle shutdown and cheaper capacity, and puts budgets and visibility in front of the teams creating environments.
      good: Finds leftovers, adds automatic cleanup and right-sizes.
      weak: Simply limits the number of environments or turns the feature off.
    followups:
      - Which would you expect to be the biggest contributor, and why?
      - How would you make cost visible to the developer who opens the pull request?
    common_errors:
      - Copying production resource requests into preview environments.

  - external_key: technical.platform.slow_inner_loop
    competency_key: docker
    topic: Slow local feedback loop
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Developers complain that it takes about ten minutes from saving a file to seeing the change running
      against the rest of the system. How would you find out where those minutes go and shorten them?
    expected_concepts:
      - timing each step (build, image push, deploy, startup)
      - build caching and smaller rebuilds
      - live sync or hot reload instead of full image rebuilds
      - running only the changed service locally against shared dependencies
      - measuring the loop before and after changes
    rubric:
      excellent: Breaks the loop into measured steps, targets the largest ones with caching, file sync or hot reload, and avoids rebuilding images for every change, verifying improvement with numbers.
      good: Suggests caching and hot reload with some measurement.
      weak: Suggests faster laptops without investigating.
    followups:
      - Which tools have you used for syncing code into a running container?
      - When does running everything locally stop being practical?
    common_errors:
      - Optimising the image build when most time is spent in deployment or startup.

  - external_key: technical.platform.local_dev_for_microservices
    competency_key: docker
    topic: Local development approaches for many services
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      For a system made of dozens of services, compare a few ways developers can work locally, such as
      Docker Compose, tools like Tilt or Skaffold, or connecting a local process to a remote cluster. When
      would you recommend each?
    expected_concepts:
      - Compose for small sets of services
      - Tilt or Skaffold for Kubernetes-like dev loops with sync
      - traffic interception tools (Telepresence, mirrord) against a shared cluster
      - fidelity versus resource usage on laptops
      - shared environment conflicts and isolation
    rubric:
      excellent: Contrasts fidelity, laptop resource usage, speed and isolation of each approach and recommends based on system size and dependency shape, with practical experience of at least one.
      good: Describes two approaches and their main trade-off.
      weak: Knows only one approach and cannot compare.
    followups:
      - What problems arise when several developers intercept traffic in the same shared cluster?
      - How would you keep the local setup from rotting?
    common_errors:
      - Ignoring how local setups drift from production configuration.

  - external_key: technical.platform.cloud_dev_environments
    competency_key: system_design
    topic: Remote development environments at scale
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your company wants every engineer to develop in cloud-hosted workspaces instead of on laptops. How
      would you design that service so it's fast to start, secure and affordable?
    expected_concepts:
      - workspace definitions as code (devcontainers) per repository
      - prebuilt images and warm pools for fast startup
      - persistent storage for home directories and caches
      - identity-based access, network isolation and secrets handling
      - idle shutdown and cost controls
      - IDE connectivity and latency considerations
    rubric:
      excellent: Covers workspace definitions, prebuilds and warm pools for startup time, persistence, identity and network isolation, secrets, idle shutdown and cost, and IDE latency, with clear trade-offs.
      good: Covers images, startup time, security and cost at a reasonable level.
      weak: Proposes one large shared VM or ignores security and cost.
    followups:
      - How would you get startup time under one minute for a large monorepo?
      - What would you do about developers who need GPUs occasionally?
    common_errors:
      - Long-lived workspaces with broad production credentials.

  # ------------------------------------------------------------ observability and production readiness
  - external_key: technical.platform.observability_by_default
    competency_key: observability
    topic: Observability built into the platform
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How can a platform make sure every new service gets useful logs, metrics and traces without each team
      having to set it up themselves?
    expected_concepts:
      - collectors or agents deployed by the platform
      - structured logging and instrumentation libraries in templates
      - automatic instrumentation where available (OpenTelemetry)
      - default dashboards and alerts per service
      - consistent labels for service, team and environment
    rubric:
      excellent: Combines platform-run collection, instrumentation in templates or auto-instrumentation, consistent identifying labels and generated dashboards and alerts, and notes what still needs team input.
      good: Platform-run collectors plus templated instrumentation.
      weak: Leaves observability entirely to each team.
    followups:
      - Which signals still need application-specific work?
      - How would you control cost as log volume grows?
    common_errors:
      - Inconsistent service labels that make cross-service queries impossible.

  - external_key: technical.platform.auto_instrumentation_overhead
    competency_key: observability
    topic: Default instrumentation causing overhead
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The platform recently started injecting tracing auto-instrumentation into every service. Two teams now
      report higher latency, and the tracing backend bill has doubled. Some teams want to opt out entirely.
      How would you respond?
    expected_concepts:
      - measuring the overhead per service before deciding
      - sampling strategies (head and tail sampling) and rate limits
      - tuning which instrumentation libraries are enabled
      - collector-side filtering and attribute reduction
      - opt-out with a minimum baseline and visible trade-off
    rubric:
      excellent: Quantifies overhead, tunes sampling and instrumentation scope, reduces volume at the collector, and offers controlled opt-outs while keeping a minimum tracing baseline for incidents.
      good: Introduces sampling and lets affected teams tune or disable instrumentation.
      weak: Removes instrumentation for everyone or ignores the complaints.
    followups:
      - How does tail-based sampling change the cost and infrastructure picture?
      - What tracing baseline would you insist on keeping?
    common_errors:
      - Assuming instrumentation overhead is negligible without measuring it.

  - external_key: technical.platform.production_readiness_scorecards
    competency_key: system_design
    topic: Production readiness scorecards
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some platforms score every service against production readiness checks such as having an owner,
      alerts and a runbook. How would you design scorecards like that so they improve reliability instead
      of becoming box-ticking?
    expected_concepts:
      - checks verified automatically from real data, not self-declared
      - tiers so critical services have stricter requirements
      - linking checks to incidents and outcomes
      - visibility to teams with clear next actions
      - evolving checks over time
    rubric:
      excellent: Uses automatically verified checks tiered by criticality, ties checks to real failure modes from incidents, presents clear next actions and reviews whether the checks correlate with better outcomes.
      good: Proposes automated checks with tiers.
      weak: Proposes a self-reported checklist with no verification.
    followups:
      - How would you verify that a runbook is actually useful?
      - What would you do with a critical service that has scored red for months?
    common_errors:
      - Rewarding the presence of an artifact rather than its quality.

  - external_key: technical.platform.dependency_update_bot_noise
    competency_key: ci_cd
    topic: Automated dependency updates nobody merges
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You switched on an automated dependency update bot across four hundred repositories. A month later
      teams are drowning in its pull requests and mostly ignore them. How would you make dependency updates
      something teams actually keep up with?
    expected_concepts:
      - grouping and scheduling updates to cut volume
      - auto-merging low-risk updates when tests pass
      - test coverage good enough to trust automated merges
      - prioritising security fixes over routine version bumps
      - shared presets owned by the platform with per-repository overrides
      - tracking staleness per repository
    rubric:
      excellent: Reduces noise with grouping, schedules and auto-merge for low-risk changes backed by tests, separates security updates with their own urgency, manages configuration centrally and measures dependency staleness across the fleet.
      good: Groups updates and enables auto-merge for minor and patch versions.
      weak: Turns the bot off or asks teams to try harder.
    followups:
      - Which kinds of update would you never auto-merge?
      - A repository has almost no tests. How does that change your approach?
    common_errors:
      - Treating every update with the same urgency so security fixes get lost in the noise.

  - external_key: technical.platform.curated_base_images
    competency_key: docker
    topic: Curated base images
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If your platform team provides curated base images for teams to build on, what would you put in them,
      what would you leave out, and how would you keep them current?
    expected_concepts:
      - minimal or distroless images with only needed runtime pieces
      - non-root user and security defaults
      - regular scheduled rebuilds and scanning
      - versioning and tagging scheme
      - variants per language runtime
    rubric:
      excellent: Keeps images minimal and secure with non-root defaults, rebuilds and scans on a schedule, versions them clearly, and explains how consumers receive updates.
      good: Mentions minimal images, scanning and regular updates.
      weak: Adds debugging tools and everything teams might want, or never rebuilds.
    followups:
      - How would developers debug a container that has no shell?
      - How would teams learn about a new base image version?
    common_errors:
      - Using a floating latest tag so rebuilds are not reproducible.

  - external_key: technical.platform.progressive_delivery_default
    competency_key: ci_cd
    topic: Progressive delivery as a platform default
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You want every service on the platform to get canary releases with automatic rollback, without each
      team building it themselves. How would you design that as a platform capability?
    expected_concepts:
      - controller-driven rollouts (Argo Rollouts, Flagger) or mesh traffic shifting
      - standard health metrics available for every service (error rate, latency)
      - automated analysis comparing canary with baseline
      - sensible default steps with per-service overrides
      - handling low-traffic services and non-HTTP workloads
      - visibility of rollout decisions to developers
    rubric:
      excellent: Builds on standard per-service golden signals, automated canary analysis and traffic shifting with defaults and overrides, and addresses low-traffic and non-HTTP services and how developers see rollout decisions.
      good: Proposes a rollout controller with metric-based promotion and rollback.
      weak: Describes canaries manually checked by humans or assumes every service has meaningful traffic.
    followups:
      - How would canary analysis work for a service with ten requests a minute?
      - What happens to database migrations during a canary?
    common_errors:
      - Analysis thresholds so loose that bad releases always pass.

  - external_key: technical.platform.build_once_promotion
    competency_key: ci_cd
    topic: Promoting artifacts across environments
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you design the way a change moves from development to staging to production on your
      platform, so that what you tested is exactly what you release?
    expected_concepts:
      - build once and promote the same immutable artifact
      - referencing images by digest
      - environment config separated from the artifact
      - promotion through pull requests or a release controller with gates
      - recording which version is in each environment
    rubric:
      excellent: Builds once, promotes immutable digests, separates configuration from artifacts, gates promotion with automated checks and records environment state so differences are always visible.
      good: Promotes the same image between environments with some gating.
      weak: Rebuilds per environment or deploys from branches.
    followups:
      - How would you handle a configuration change that should go to production without a new build?
      - What gates would you require before production?
    common_errors:
      - Rebuilding the image for production, so the tested artifact is not the one released.

  - external_key: technical.platform.tool_sprawl_cognitive_load
    competency_key: system_design
    topic: Reducing tool sprawl
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Product engineers at your company now touch about fifteen different tools to get a change to
      production, and surveys say they feel overwhelmed. How would you assess that and decide what to
      consolidate, hide or remove?
    expected_concepts:
      - mapping the developer journey and which tools are touched at each step
      - usage data and survey detail per tool
      - distinguishing essential from accidental complexity
      - consolidating behind a unified interface or portal where it helps
      - migration and deprecation plans for removed tools
      - measuring cognitive load before and after
    rubric:
      excellent: Maps the journey with usage data, separates essential from accidental complexity, chooses between consolidating, hiding behind an interface and removing tools with explicit migration plans, and measures the result.
      good: Inventories tools and proposes consolidation with a plan.
      weak: Adds another tool or portal on top without removing anything.
    followups:
      - Which tool would be hardest to remove, and why?
      - How would you know cognitive load actually went down?
    common_errors:
      - Hiding tools behind a portal while still requiring developers to debug in each of them.

  - external_key: technical.platform.ci_platform_slos
    competency_key: observability
    topic: SLOs for the delivery platform
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your CI and deployment platform had three significant outages this quarter, and product teams are
      losing trust in it. How would you define service level objectives for the platform itself and use them
      to rebuild that trust?
    expected_concepts:
      - SLIs from the developer's view (queue time, pipeline success excluding user errors, deploy latency)
      - targets agreed with product teams
      - error budgets driving reliability versus feature work
      - excluding user-caused failures accurately
      - transparent reporting and postmortems
    rubric:
      excellent: Defines developer-centred SLIs, separates platform failures from user errors, sets targets with product teams, uses error budgets to rebalance work and reports transparently.
      good: Proposes availability and latency SLOs for the main platform services.
      weak: Proposes uptime of servers as the measure, or no SLOs.
    followups:
      - How would you classify a pipeline failure caused by a flaky test?
      - What would you stop doing if the error budget was exhausted?
    common_errors:
      - Measuring component uptime while developers experience failures the metrics never see.
