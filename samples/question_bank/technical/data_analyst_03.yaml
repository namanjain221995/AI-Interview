# Curated questions: data analyst — reading A/B tests, practical statistics and communicating uncertainty.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_analyst]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.data_analyst.questions_before_calling_test
    competency_key: statistics_experimentation
    topic: Questioning an A/B test readout
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A product manager drops a screenshot in chat showing the new checkout variant up three percent on
      conversion with a p-value of point zero three, and asks if they can ship. What would you want to know
      before you answer?
    expected_concepts:
      - whether the primary metric and duration were decided in advance
      - sample size and whether the planned runtime was reached
      - whether the split between groups was as expected
      - guardrail metrics such as revenue or refunds
      - the size and range of the effect, not just significance
    rubric:
      excellent: Asks about pre-registration of the metric and duration, sample size, the traffic split, guardrails and the interval around the lift, and explains why each matters before a decision.
      good: Asks about sample size, test duration and at least one guardrail metric.
      weak: Approves shipping because the p-value is below point zero five.
    followups:
      - It turns out they checked the result every day and stopped when it went significant. Does that change your answer?
      - What range of lifts would you want to see before shipping?
    common_errors:
      - Treating a single significant metric as enough evidence on its own.

  - external_key: technical.data_analyst.p_value_for_stakeholders
    competency_key: statistics_experimentation
    topic: Explaining a p-value in plain language
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you explain what a p-value means to a marketing manager who has no statistics background, in a
      way that is still correct?
    expected_concepts:
      - assumes there is no real difference between the groups
      - how surprising the observed result would be under that assumption
      - not the probability that the variant is better
      - not a measure of how big or important the effect is
      - a practical analogy or example
    rubric:
      excellent: Gives a correct plain-language explanation built around how surprising the data would be if nothing had changed, explicitly corrects the common misreadings, and uses a relatable example.
      good: Gives a mostly correct explanation with one misreading addressed.
      weak: Says it is the probability that the result is due to chance or that the variant wins.
    followups:
      - The manager asks whether point zero one is a better result than point zero four. What do you say?
      - What would you show them instead of a p-value?
    common_errors:
      - Describing the p-value as the probability the hypothesis is true.

  - external_key: technical.data_analyst.presenting_lift_with_interval
    competency_key: statistics_experimentation
    topic: Reporting effects with intervals
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you report the result of a test, why might you show a range for the lift rather than just the single
      best estimate, and how would you present it so people actually use it?
    expected_concepts:
      - the point estimate alone hides uncertainty
      - confidence intervals showing plausible effect sizes
      - whether the range includes zero or harmful values
      - translating the range into business terms such as revenue
      - a simple visual such as an interval chart
    rubric:
      excellent: Explains that the range shows plausible effects, uses it to discuss the worst and best realistic cases in business terms, and presents it visually and in words that a decision-maker can act on.
      good: Explains confidence intervals correctly and why they add information.
      weak: Reports only the point estimate and a significant or not label.
    followups:
      - The interval runs from minus one to plus seven percent. How do you describe that to leadership?
      - How would the range change if the test ran twice as long?
    common_errors:
      - Describing a ninety-five percent interval as a ninety-five percent chance the true value is inside this specific range without care.

  - external_key: technical.data_analyst.significant_but_tiny_lift
    competency_key: statistics_experimentation
    topic: Statistical versus practical significance
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A test on a very high-traffic page came back statistically significant, but the lift is a tenth of a
      percent. The new version also adds maintenance work for engineers. What would you recommend, and how
      would you reason about it?
    expected_concepts:
      - large samples make tiny effects significant
      - translating the lift into annual revenue or users
      - comparing benefit against cost and complexity
      - the minimum effect worth acting on, set in advance
      - guardrail metrics
    rubric:
      excellent: Explains why huge samples detect tiny effects, sizes the impact in business terms, weighs it against maintenance cost, and refers to a pre-agreed minimum worthwhile effect.
      good: Distinguishes statistical from practical significance and considers the cost.
      weak: Recommends shipping because the result is significant, or dismisses it without sizing the impact.
    followups:
      - How would you set a minimum worthwhile effect before the next test?
      - What if the same tiny lift were on a revenue metric for the whole business?
    common_errors:
      - Not converting the relative lift into absolute business impact.

  - external_key: technical.data_analyst.how_long_test_runs
    competency_key: statistics_experimentation
    topic: What drives test duration
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A stakeholder asks why their A/B test needs to run for three weeks when they get plenty of traffic in a
      few days. How would you explain what determines how long a test should run?
    expected_concepts:
      - baseline rate of the metric
      - smallest effect worth detecting
      - desired power and significance level
      - traffic available per group
      - covering full weekly cycles
    rubric:
      excellent: Explains how baseline, minimum detectable effect, power and traffic set the sample size, and why running whole weeks protects against day-of-week effects, in language the stakeholder can follow.
      good: Names sample size and minimum effect as drivers and mentions weekly cycles.
      weak: Picks a duration by habit or says longer is always better.
    followups:
      - What happens to the required sample if they want to detect half the effect?
      - Why not just run it until it becomes significant?
    common_errors:
      - Stopping after a few days of high traffic and missing weekday versus weekend differences.

  - external_key: technical.data_analyst.randomisation_unit_choice
    competency_key: statistics_experimentation
    topic: Choosing the unit of randomisation
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you set up an experiment, how do you decide whether to randomise by user, by session or by page
      view? Give me an example where the wrong choice would cause problems.
    expected_concepts:
      - consistency of experience for the same user
      - matching the analysis unit to the randomisation unit
      - independence between units
      - logged-out users and cookie churn
      - more units giving more power at finer levels
    rubric:
      excellent: Explains the trade-off between consistency and sample size, gives a concrete failure such as users seeing both versions, and stresses analysing at the unit that was randomised.
      good: Prefers user-level randomisation for most product changes with a sensible reason.
      weak: Does not see why the choice matters.
    followups:
      - You randomised by user but want to report conversion per session. What is the risk?
      - When would page-level randomisation be acceptable?
    common_errors:
      - Analysing per session while randomising per user and understating the variance.

  - external_key: technical.data_analyst.survey_of_forty_customers
    competency_key: communication
    topic: Drawing conclusions from small samples
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your manager wants to present that sixty percent of customers prefer the new design, based on a survey of
      forty people who replied to an email. How would you handle this?
    expected_concepts:
      - wide uncertainty with forty responses
      - self-selection of who replies
      - showing the counts and the range, not only the percentage
      - framing it as directional evidence
      - suggesting how to get stronger evidence
    rubric:
      excellent: Explains both the sampling uncertainty and the response bias, proposes wording that presents it as directional with counts and a range, and suggests a better follow-up such as a larger random sample or a test.
      good: Flags the small sample and suggests caveating the claim.
      weak: Presents the sixty percent as representative of all customers.
    followups:
      - Roughly how wide would the plausible range be here?
      - How would you word the slide title?
    common_errors:
      - Focusing only on sample size and ignoring who chose to reply.

  # ---------------------------------------------------------------- medium
  - external_key: technical.data_analyst.daily_peeking_pressure
    competency_key: statistics_experimentation
    topic: Peeking and early stopping
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You built the results page for a pricing test, and the growth lead has started messaging you each morning
      asking to end it as soon as the variant shows a significant win. How would you explain why that's risky,
      and what process would you put in place?
    expected_concepts:
      - repeated checking inflates the false positive rate
      - fixing the sample size or duration in advance
      - sequential testing methods that allow interim looks
      - safety stopping rules for harmful results
      - showing the planned end date on the dashboard
    rubric:
      excellent: Explains why repeated looks inflate false positives with an intuitive example, proposes a fixed horizon or a proper sequential method, and keeps a harm-based stopping rule so the team still feels safe.
      good: Explains the peeking problem and recommends waiting for the planned sample.
      weak: Agrees to stop early or cannot explain why peeking is a problem.
    followups:
      - What would you do if the variant was clearly harming revenue after two days?
      - How would you redesign the dashboard so it discourages peeking?
    common_errors:
      - Banning anyone from looking instead of offering a valid interim analysis.

  - external_key: technical.data_analyst.split_not_fifty_fifty
    competency_key: statistics_experimentation
    topic: Sample ratio mismatch
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A test was configured as a fifty-fifty split, but you see fifty-two percent of users in control and
      forty-eight in the variant, with large numbers in each group. What does that tell you, and what would you
      do about the results?
    expected_concepts:
      - sample ratio mismatch as a sign of a broken assignment or logging
      - a chi-square test to check the imbalance
      - causes such as redirects, crashes, bot filtering or late assignment
      - not trusting the metric results until explained
      - checking the mismatch by segment to locate it
    rubric:
      excellent: Recognises a sample ratio mismatch, tests whether it is beyond chance, lists concrete causes, segments to find where it happens, and refuses to interpret the metrics until it is resolved.
      good: Recognises the imbalance as a red flag and suggests investigating the assignment.
      weak: Reweights the groups or ignores the imbalance and reads the results.
    followups:
      - The mismatch only appears on one browser. What does that suggest?
      - Could you salvage any of the results?
    common_errors:
      - Assuming a two-point imbalance is random noise without testing it.

  - external_key: technical.data_analyst.lift_fading_over_weeks
    competency_key: statistics_experimentation
    topic: Novelty and learning effects
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A redesigned home page showed a big jump in clicks during the first week of the test, and the lift has
      been shrinking every week since. How would you interpret that and what would you report?
    expected_concepts:
      - novelty effect among returning users
      - comparing new versus returning users
      - plotting the effect by days since first exposure
      - waiting for the effect to stabilise
      - reporting the long-run estimate, not the first-week peak
    rubric:
      excellent: Names novelty as a likely cause, separates new and returning users, looks at the effect by exposure age, and reports a stabilised estimate while explaining the decay.
      good: Identifies the novelty effect and suggests running longer.
      weak: Reports the average lift across the whole period as the expected long-term impact.
    followups:
      - What would the opposite pattern, a lift that grows over time, suggest?
      - How would you decide when the effect has stabilised?
    common_errors:
      - Quoting the first-week lift in the launch announcement.

  - external_key: technical.data_analyst.two_of_twenty_metrics_significant
    competency_key: statistics_experimentation
    topic: Multiple comparisons
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An experiment report tracks twenty metrics, and two of them came out significant while the primary metric
      didn't move. How do you read a result like that?
    expected_concepts:
      - expected false positives when testing many metrics
      - the primary metric decided before the test
      - corrections such as Bonferroni or false discovery rate
      - treating secondary wins as hypotheses for a new test
      - plausibility of the mechanism
    rubric:
      excellent: Explains that one or two false positives are expected among twenty, anchors the decision on the pre-declared primary metric, mentions corrections, and treats secondary findings as hypotheses to confirm.
      good: Recognises the multiple-testing problem and focuses on the primary metric.
      weak: Reports the two significant metrics as wins.
    followups:
      - One of the significant metrics has a very plausible mechanism. Does that change anything?
      - How would you structure the report so readers don't over-read secondary metrics?
    common_errors:
      - Choosing the primary metric after looking at the results.

  - external_key: technical.data_analyst.winning_segment_after_flat
    competency_key: statistics_experimentation
    topic: Post-hoc segment analysis
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A test was flat overall, but a product manager has found that the variant wins strongly for Android users
      in one region and wants to launch it just for them. What's your response?
    expected_concepts:
      - post-hoc slicing finds chance wins
      - small segment sizes and wide intervals
      - whether there is a plausible reason for that segment
      - validating with a new targeted test
      - cost of maintaining segment-specific experiences
    rubric:
      excellent: Explains how slicing many segments produces spurious wins, checks segment size and plausibility, and proposes a confirmatory test in that segment while weighing the cost of a fork.
      good: Flags the risk of chance findings and suggests a follow-up test.
      weak: Supports the targeted launch based on the segment result.
    followups:
      - How many segments do you think they looked at before finding this one?
      - When would you trust a segment result without a new test?
    common_errors:
      - Ignoring that the segment was found after the fact.

  - external_key: technical.data_analyst.flat_test_so_it_failed
    competency_key: communication
    topic: Communicating an inconclusive test
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A test the team was excited about came back inconclusive, and a director asks you, so it didn't work? How
      would you answer, and what would you put in the write-up?
    expected_concepts:
      - inconclusive is not the same as no effect
      - the range of effects the test could rule out
      - whether the test had enough power
      - what was learned and possible next steps
      - a clear recommendation despite the uncertainty
    rubric:
      excellent: Explains what the test ruled in and out using the interval, states whether it was adequately powered, gives a clear recommendation, and records learnings and next steps without spinning the result.
      good: Distinguishes inconclusive from failed and suggests next steps.
      weak: Says it failed, or claims a positive trend that the data doesn't support.
    followups:
      - The team wants to say it's trending positive. How do you respond?
      - When is shipping an inconclusive change reasonable?
    common_errors:
      - Describing a non-significant positive estimate as a directional win.

  - external_key: technical.data_analyst.low_traffic_test_options
    competency_key: statistics_experimentation
    topic: Experimenting with limited traffic
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your B2B product only gets a few hundred sign-ups a month, and the power calculation says a test on
      conversion would need four months. What options would you put to the team?
    expected_concepts:
      - testing a bigger, bolder change
      - a metric higher in the funnel with more events
      - variance reduction using pre-experiment data
      - accepting lower power or a larger minimum effect knowingly
      - qualitative research or staged rollouts instead
    rubric:
      excellent: Offers several concrete options with their trade-offs, including a more sensitive metric, variance reduction and bolder changes, and is clear about what risk the team is accepting with each.
      good: Suggests a proxy metric or a bigger change.
      weak: Runs the test for two weeks anyway or abandons evidence altogether.
    followups:
      - What makes a good proxy metric, and how would you check it?
      - How would you explain lower power to the team in plain terms?
    common_errors:
      - Picking a proxy metric that doesn't actually move with the outcome the team cares about.

  - external_key: technical.data_analyst.heavy_tailed_revenue_test
    competency_key: statistics_experimentation
    topic: Testing on skewed revenue metrics
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You need to compare revenue per user between two test groups, but most users spend nothing and a few spend
      a lot. What problems does that cause, and how would you analyse it?
    expected_concepts:
      - high variance from heavy tails
      - a few big spenders landing in one group by chance
      - capping or winsorising extreme values
      - splitting into purchase rate and spend among buyers
      - bootstrap or larger samples for intervals
    rubric:
      excellent: Explains how skew inflates variance and makes results unstable, proposes capping with a pre-agreed rule, decomposes into conversion and spend among buyers, and uses appropriate interval methods.
      good: Recognises the skew problem and suggests capping or a decomposition.
      weak: Compares raw means and treats any difference as real.
    followups:
      - How would you choose where to cap?
      - The result flips when you remove the top spender. What do you report?
    common_errors:
      - Removing high spenders entirely, which biases the revenue estimate.

  - external_key: technical.data_analyst.signup_forecast_range
    competency_key: communication
    topic: Presenting a forecast with uncertainty
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      The head of sales asks you for next quarter's sign-up forecast and says, just give me one number. How would
      you build the forecast, and how would you present the uncertainty without losing them?
    expected_concepts:
      - a simple, explainable forecasting approach
      - a central estimate with a likely range
      - key assumptions stated explicitly
      - scenarios tied to decisions such as hiring
      - tracking forecast accuracy over time
    rubric:
      excellent: Gives a central number they can plan around, plus a range and scenarios linked to their decisions, states the main assumptions, and plans to track accuracy and update.
      good: Provides a number with a range and the main assumptions.
      weak: Gives a single number with no indication of uncertainty, or overwhelms them with statistics.
    followups:
      - Which assumption would you monitor most closely during the quarter?
      - How would you present a forecast that turned out badly wrong last quarter?
    common_errors:
      - Presenting a range so wide it cannot inform any decision, without explaining why.

  - external_key: technical.data_analyst.bootstrap_for_median
    competency_key: statistics_experimentation
    topic: Bootstrapping intervals
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You want to show how much the median delivery time changed after a process change, along with a range of
      uncertainty. How would you get that range, and why might a textbook formula not be enough?
    expected_concepts:
      - no simple closed-form interval for a median difference
      - resampling with replacement many times
      - percentile intervals from the bootstrap distribution
      - resampling at the right unit, for example by day or driver if correlated
      - limits with small samples or extreme values
    rubric:
      excellent: Explains the bootstrap procedure clearly, resamples at the correct independent unit, reads a percentile interval from the results, and notes when the method can mislead.
      good: Describes the bootstrap correctly for this case.
      weak: Uses a formula for the mean on the median or cannot describe how to get a range.
    followups:
      - Deliveries on the same day are correlated. How does that change your resampling?
      - How many resamples would you run, and why?
    common_errors:
      - Resampling individual deliveries when they are clustered by driver or day.

  - external_key: technical.data_analyst.survey_score_interpretation
    competency_key: data_analysis
    topic: Interpreting survey and satisfaction data
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      The quarterly customer satisfaction score dropped five points, and leadership is worried. What would you
      check before treating that as a real decline in how customers feel about the product?
    expected_concepts:
      - change in who responded and response rate
      - changes in survey timing, channel or wording
      - sampling error for the number of responses
      - breakdown by customer segment
      - linking to behavioural data such as retention or tickets
    rubric:
      excellent: Checks response composition and survey method changes, quantifies sampling noise, segments the drop, and triangulates with behavioural data before concluding.
      good: Considers response bias and sample size.
      weak: Treats the drop as a real decline without checking how the survey was run.
    followups:
      - The survey moved from email to in-app this quarter. How does that matter?
      - Which behavioural signal would you check first?
    common_errors:
      - Comparing scores across quarters when the respondent mix changed.

  - external_key: technical.data_analyst.worst_stores_improved
    competency_key: statistics_experimentation
    topic: Regression to the mean
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Last quarter the ten worst-performing stores were given extra coaching, and this quarter they improved far
      more than the average store. The operations team wants to roll coaching out everywhere. What would you
      point out?
    expected_concepts:
      - regression to the mean for units selected on extreme values
      - comparing with similar low performers that were not coached
      - noise in quarterly store metrics
      - designing a randomised or staggered rollout
      - the programme may still work
    rubric:
      excellent: Explains regression to the mean clearly, proposes a comparison with similarly poor uncoached stores or a staggered rollout to measure the real effect, and stays open to the programme working.
      good: Identifies regression to the mean and suggests a comparison group.
      weak: Credits the coaching with the full improvement.
    followups:
      - How would you design the next rollout so you can measure the effect properly?
      - How would you explain regression to the mean to the operations team?
    common_errors:
      - Comparing coached stores with the average store rather than with similar low performers.

  # ------------------------------------------------------------------ hard
  - external_key: technical.data_analyst.marketplace_test_interference
    competency_key: statistics_experimentation
    topic: Interference between test groups
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      In a ride-hailing marketplace, a test gives riders in the variant a discount, and they book more rides. Why
      might that result overstate the true effect of rolling the discount out to everyone, and how would you
      design a better test?
    expected_concepts:
      - treatment and control sharing the same driver supply
      - variant riders taking rides from control riders
      - biased estimates from user-level randomisation
      - geographic or time-based switchback designs
      - trade-offs in power and complexity of cluster designs
    rubric:
      excellent: Explains how shared supply makes control a poor counterfactual, quantifies the direction of bias, proposes switchback or market-level randomisation, and discusses the loss of power and how to mitigate it.
      good: Identifies interference and suggests randomising by market or time.
      weak: Does not see a problem with the user-level result.
    followups:
      - What is the downside of randomising by city?
      - How would you check for interference in a test that has already run?
    common_errors:
      - Assuming more units always means a better test even when units affect each other.

  - external_key: technical.data_analyst.pre_period_variance_reduction
    competency_key: statistics_experimentation
    topic: Variance reduction with pre-experiment data
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your experiments keep coming back with intervals too wide to be useful. How could you use data from before
      the experiment started to get more precise results, and what are the conditions for doing it correctly?
    expected_concepts:
      - a covariate correlated with the outcome, such as pre-period spend
      - CUPED or regression adjustment
      - the covariate must be unaffected by the treatment
      - handling new users with no pre-period data
      - variance reduction depending on the correlation
    rubric:
      excellent: Explains regression or CUPED-style adjustment and why it narrows intervals, insists the covariate is measured before treatment, handles users without history, and relates the gain to the strength of the correlation.
      good: Describes using pre-period values to reduce variance in general terms.
      weak: Suggests running tests longer as the only option.
    followups:
      - Why would using a covariate measured during the test be a mistake?
      - What would you do for a test aimed only at brand new users?
    common_errors:
      - Adjusting with a variable that the treatment itself can change.

  - external_key: technical.data_analyst.conversion_up_revenue_down
    competency_key: statistics_experimentation
    topic: Deciding with conflicting test metrics
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A new free-trial offer increased paid conversions by eight percent, but revenue per user in the first month
      dropped, and you don't yet know what happens to retention. Leadership wants a recommendation this week.
      What would you do?
    expected_concepts:
      - modelling expected long-term value under different retention assumptions
      - break-even retention needed to justify the offer
      - quality of the extra converters compared with existing ones
      - options such as a partial rollout or a holdout
      - a clear recommendation with stated risks
    rubric:
      excellent: Frames the trade-off in long-term value, calculates the break-even retention, examines who the extra converters are, and recommends a concrete path such as a limited rollout with a holdout and a decision date.
      good: Recognises the trade-off and proposes waiting for retention data or a limited rollout.
      weak: Picks whichever metric looks best or refuses to recommend without full data.
    followups:
      - What early signal would tell you the extra converters will retain poorly?
      - How would you present the break-even analysis on one slide?
    common_errors:
      - Comparing first-month revenue only and ignoring lifetime value.

  - external_key: technical.data_analyst.short_tests_long_effects
    competency_key: statistics_experimentation
    topic: Long-term effects beyond the test window
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Most of your company's experiments run for two weeks, but the decisions they drive affect customers for
      years. How would you make sure the experiment programme isn't systematically missing long-term effects?
    expected_concepts:
      - long-running holdout groups
      - validated short-term proxies for long-term outcomes
      - re-testing or reversing past winners
      - tracking the cumulative effect of many small wins
      - effects such as fatigue or ad blindness that build slowly
    rubric:
      excellent: Proposes long-term holdouts and validated proxy metrics, checks whether the sum of past wins shows up in top-line metrics, and gives examples of slow-building harms to watch for.
      good: Suggests a holdout group or longer tests for key changes.
      weak: Assumes short-term lifts persist indefinitely.
    followups:
      - The sum of last year's test wins is bigger than the actual growth. What could explain that?
      - How would you validate that a short-term metric predicts retention?
    common_errors:
      - Summing individual test lifts and expecting them to add up in the top-line metric.

  - external_key: technical.data_analyst.vp_wants_rerun_until_win
    competency_key: stakeholder_management
    topic: Handling pressure on a test result
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A VP strongly believes in a feature that tested flat, and asks you to rerun it with a few tweaks until it
      shows a win. How would you handle that conversation and what would you propose?
    expected_concepts:
      - understanding why the VP believes in the feature
      - explaining the false positive risk of repeated reruns
      - agreeing success criteria before any new test
      - alternatives such as qualitative research or a meaningfully different version
      - documenting the decision either way
    rubric:
      excellent: Engages with the VP's reasoning, explains clearly why rerunning until it wins produces false results, proposes a principled next test with criteria agreed in advance, and keeps the relationship constructive.
      good: Explains the risk of rerunning and suggests agreeing criteria up front.
      weak: Agrees to rerun until it wins, or refuses without offering a path forward.
    followups:
      - The VP decides to ship anyway. What do you do?
      - How would you record this so the organisation learns from it?
    common_errors:
      - Treating it purely as a statistics argument and ignoring the business reasons behind the request.

  - external_key: technical.data_analyst.probability_variant_better
    competency_key: statistics_experimentation
    topic: Bayesian framing for decision-makers
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Some stakeholders want test results framed as the probability that the variant is better. How would you
      produce that kind of answer, and what would you be careful about when presenting it?
    expected_concepts:
      - Bayesian analysis with a posterior distribution
      - the choice of prior and its influence
      - probability of being better versus expected size of the gain
      - expected loss as a decision criterion
      - avoiding peeking problems being relabelled rather than solved
    rubric:
      excellent: Explains how a posterior gives the probability of being better, discusses priors and sensitivity to them, pairs the probability with the expected gain or loss, and warns that the framing does not remove the need for a decision rule set in advance.
      good: Describes a Bayesian approach and the role of the prior.
      weak: Converts a p-value into a probability of being better.
    followups:
      - There is a ninety percent chance the variant is better, but the expected gain is tiny. What do you recommend?
      - How would you choose a prior for a checkout test?
    common_errors:
      - Presenting a probability of being better without saying by how much.
