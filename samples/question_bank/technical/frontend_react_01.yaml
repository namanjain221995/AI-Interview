# Curated questions: React components, hooks and rendering (technical.frontend_react, part 1 of 4).
# Spoken by the AI interviewer. Difficulty decides round types: easy -> screening/combined,
# medium -> screening/deep/combined, hard -> deep/combined.
version: 1
defaults:
  role_tags: [frontend]
questions:
  # ------------------------------------------------------------- easy
  - external_key: technical.frontend_react.controlled_vs_uncontrolled
    competency_key: frontend_react
    topic: Controlled and uncontrolled inputs
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you build an input in React, how do you decide whether it should be controlled or uncontrolled?
      Talk me through a case where you picked each one.
    expected_concepts:
      - controlled inputs keep the value in React state and update through onChange
      - uncontrolled inputs keep the value in the DOM and are read through refs or form data
      - controlled suits instant validation, formatting or dependent fields
      - uncontrolled suits simple forms, file inputs and fewer re-renders
      - switching between the two mid-life causes warnings and bugs
    rubric:
      excellent: Explains where the source of truth lives in each model, ties the choice to concrete needs such as live formatting versus a simple submit-only form, and mentions file inputs and the controlled-to-uncontrolled warning.
      good: Correctly distinguishes the two and gives at least one sensible use for each.
      weak: Thinks every input must be controlled, or cannot say where the value is stored in the uncontrolled case.
    followups:
      - What causes the warning about a component changing from uncontrolled to controlled?
      - How do form libraries mix the two approaches?
    common_errors:
      - Initialising a controlled value with undefined and later setting a string.
      - Controlling every field of a large form and paying for re-renders on each keystroke.

  - external_key: technical.frontend_react.rerender_triggers
    competency_key: frontend_react
    topic: What triggers a re-render
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      In your own words, what actually causes a React component to render again, and what does not? I'm
      interested in how you'd explain it to a junior teammate who keeps guessing.
    expected_concepts:
      - a state update in the component itself
      - the parent rendering again, regardless of whether props changed
      - a change in a consumed context value
      - mutating an object or ref does not schedule a render
      - rendering is not the same as committing changes to the DOM
    rubric:
      excellent: Lists state, parent renders and context precisely, corrects the myth that changed props are the trigger, explains that mutation and ref changes do not render, and separates render from commit.
      good: Names state and parent renders and knows mutation does not trigger an update.
      weak: Believes components render only when their props change, or that every render rewrites the DOM.
    followups:
      - Why does setting state to the same value usually not render again?
      - What changes if the child is wrapped in memo?
    common_errors:
      - Mutating an array in state and wondering why the screen does not update.
      - Assuming a re-render always means expensive DOM work.

  - external_key: technical.frontend_react.functional_state_updates
    competency_key: frontend_react
    topic: Batching and functional state updates
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A teammate writes a click handler that calls setCount with count plus one three times in a row, expecting
      the counter to jump by three, but it only goes up by one. How would you explain what's happening and fix it?
    expected_concepts:
      - the handler reads the count captured for this render
      - updates are batched and applied after the handler finishes
      - functional updater form receives the latest pending value
      - automatic batching in React 18 and later
    rubric:
      excellent: Explains that each call sees the same snapshot, describes batching, fixes it with the updater function and generalises when to prefer the functional form.
      good: Identifies the snapshot problem and fixes it with the updater function.
      weak: Suggests adding delays or extra state variables without understanding the snapshot behaviour.
    followups:
      - Would the result change if the calls were inside a setTimeout?
      - When else do you routinely use the updater form?
    common_errors:
      - Believing setState updates the variable immediately.
      - Reaching for flushSync to work around a simple updater problem.

  - external_key: technical.frontend_react.custom_hook_extraction
    competency_key: frontend_react
    topic: Extracting custom hooks
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me about a custom hook you've written. What made you pull that logic out of the component, and how
      did you decide what the hook should return?
    expected_concepts:
      - reusing stateful logic rather than markup
      - each call gets its own independent state
      - a small, purpose-named return value (object or tuple)
      - hooks follow the same rules as built-in hooks
      - testing the hook through a component or renderHook
    rubric:
      excellent: Describes a real hook with a clear reason for extracting it, explains that state is not shared between callers, and justifies the shape of the return value.
      good: Gives a plausible example and understands that hooks share logic, not state.
      weak: Thinks a custom hook makes state global, or cannot give an example beyond renaming a useEffect.
    followups:
      - What would you change if two components needed to share the same state?
      - When is a custom hook the wrong abstraction?
    common_errors:
      - Expecting two components using the same hook to see the same state.
      - Wrapping a single useState in a hook that adds nothing.

  - external_key: technical.frontend_react.conditional_hook_crash
    competency_key: frontend_react
    topic: Rules of hooks
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A component calls useState inside an if block that depends on a prop. It works most of the time, but
      occasionally the app crashes with an error about rendering more hooks than before. What's going on, and
      how would you restructure it?
    expected_concepts:
      - React identifies hooks by call order
      - the order must be the same on every render
      - move the hook to the top level and branch on its value instead
      - split into separate components when behaviour differs
      - the eslint rules-of-hooks check
    rubric:
      excellent: Explains call-order identity clearly, shows how the condition shifts every later hook, offers both the top-level and split-component fixes and mentions the lint rule.
      good: Knows hooks must not be conditional and moves the call to the top level.
      weak: Recites the rule without knowing why, or proposes wrapping the hook in a try block.
    followups:
      - Why does an early return above a hook cause the same problem?
      - How does the new use API differ from other hooks here?
    common_errors:
      - Returning early before some hooks have run.
      - Disabling the lint rule instead of restructuring.

  - external_key: technical.frontend_react.composition_over_props
    competency_key: frontend_react
    topic: Composition with children and slots
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Have you worked with a component that had grown dozens of props to cover every variation? How would you
      use composition, like children or slot props, to make it simpler?
    expected_concepts:
      - passing children instead of configuring content through flags
      - named slot props such as header or actions
      - fewer boolean props and impossible combinations
      - callers control layout and content
      - composition also reduces prop drilling
    rubric:
      excellent: Gives a concrete before-and-after, shows how slots replace boolean flags, and notes that composition also helps with prop drilling and testing.
      good: Explains using children or slot props to replace configuration props.
      weak: Proposes adding more props or a giant config object.
    followups:
      - When is a single prop still better than a slot?
      - How does composition help with passing data through many levels?
    common_errors:
      - Boolean props like showHeader and showFooterButton multiplying over time.
      - Copying the whole component for each variation.

  - external_key: technical.frontend_react.useref_vs_state
    competency_key: frontend_react
    topic: useRef versus state
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When do you reach for useRef instead of useState? Give me a couple of real situations from your work.
    expected_concepts:
      - refs hold mutable values that do not need to render
      - DOM element access such as focus or measuring
      - storing timer ids, previous values or instance flags
      - changing a ref does not trigger a render
      - do not read or write refs during render for displayed data
    rubric:
      excellent: Gives both DOM and non-DOM examples, explains that ref changes are invisible to rendering, and warns against using refs for anything shown on screen.
      good: Knows refs are for DOM access and values that persist without re-rendering.
      weak: Only knows refs for DOM nodes, or uses refs to avoid re-renders for visible data.
    followups:
      - What goes wrong if the screen depends on a value stored in a ref?
      - How would you keep the latest callback in a ref for an event listener?
    common_errors:
      - Displaying a ref value and expecting it to update.
      - Writing to a ref during render.

  - external_key: technical.frontend_react.stray_zero_render
    competency_key: frontend_react
    topic: Conditional rendering pitfalls
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A product list page shows a lone zero in the corner whenever a user has no items. The JSX uses the array
      length with a double ampersand to decide whether to render the list. What's happening, and how would you
      write that condition instead?
    expected_concepts:
      - logical AND returns the left operand when it is falsy
      - React renders the number zero but not false, null or undefined
      - compare explicitly with greater than zero or convert to boolean
      - ternary with an explicit empty state
    rubric:
      excellent: Explains short-circuit evaluation and what React renders for each falsy value, fixes the condition and suggests showing a proper empty state.
      good: Identifies the zero from the length and fixes it with an explicit comparison.
      weak: Cannot explain why the zero appears or patches it with CSS.
    followups:
      - Which falsy values does React render and which does it skip?
      - How would you design the empty state for this list?
    common_errors:
      - Using a number directly as a condition in JSX.
      - Forgetting the empty state entirely.

  # ------------------------------------------------------------- medium
  - external_key: technical.frontend_react.usereducer_choice
    competency_key: frontend_react
    topic: When to switch to useReducer
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      At what point do you move a component from several useState calls to a useReducer? Describe a component
      where that change made the code clearer.
    expected_concepts:
      - several pieces of state that change together
      - next state depends on previous state in complex ways
      - named actions describe intent and are easy to log
      - reducers are pure and easy to unit test
      - stable dispatch can be passed down without memoisation
    rubric:
      excellent: Gives a real example such as a multi-status request or editor state, explains how actions remove inconsistent intermediate states, and mentions testability and stable dispatch.
      good: Explains that related or complex transitions fit a reducer and gives a plausible example.
      weak: Treats useReducer as a replacement for a global store or cannot say when it helps.
    followups:
      - How would you prevent impossible combinations like loading and error at once?
      - Would you ever combine useReducer with context, and what are the trade-offs?
    common_errors:
      - Performing side effects such as fetches inside the reducer.
      - Mutating the previous state object in the reducer.

  - external_key: technical.frontend_react.subscription_cleanup
    competency_key: frontend_react
    topic: Effects that subscribe to external sources
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Suppose a component needs to listen to something outside React, such as window resize events, a WebSocket
      or a browser API. How do you set up and tear down that subscription correctly?
    expected_concepts:
      - subscribe in an effect and return a cleanup function
      - dependencies that resubscribe when inputs change
      - handlers that read the latest values without resubscribing
      - useSyncExternalStore for reading external state consistently
      - sharing one connection rather than one per component
    rubric:
      excellent: Writes a symmetric subscribe and cleanup, handles changing inputs and latest-value access, knows when useSyncExternalStore fits and avoids opening a connection per component.
      good: Subscribes in an effect with correct cleanup and dependencies.
      weak: Subscribes without cleanup or adds listeners during render.
    followups:
      - How would you avoid opening fifty WebSocket connections for fifty list items?
      - What does useSyncExternalStore give you that an effect does not?
    common_errors:
      - Removing a listener with a different function reference than the one added.
      - Leaving listeners attached after unmount.

  - external_key: technical.frontend_react.strict_mode_double_effects
    competency_key: frontend_react
    topic: StrictMode and resilient effects
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      After enabling StrictMode, a teammate notices that an analytics event fires twice in development and wants
      to turn StrictMode off. How would you respond, and what would you change in the code?
    expected_concepts:
      - StrictMode mounts, unmounts and remounts components in development
      - it surfaces effects that lack proper cleanup
      - fire one-off events from event handlers where possible
      - make effects idempotent or clean up correctly
      - production behaviour is unaffected
    rubric:
      excellent: Explains why StrictMode re-runs effects, argues for keeping it, moves the analytics call to the event that caused it or makes the effect safe to repeat, and confirms production runs it once.
      good: Knows the double run is development-only and suggests fixing cleanup instead of disabling StrictMode.
      weak: Disables StrictMode or adds a global flag to skip the second call without understanding why.
    followups:
      - Which real-world bugs is the remount check designed to catch?
      - Where should a page-view event live in a single-page app?
    common_errors:
      - Using a module-level boolean to skip the second effect run.
      - Treating effects as a place for user-triggered actions.

  - external_key: technical.frontend_react.layout_effect_flicker
    competency_key: frontend_react
    topic: Measuring layout before paint
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You've built a tooltip that measures its anchor and positions itself, but users see it flash in the wrong
      spot for a frame before jumping into place. Why does that happen, and how would you fix it?
    expected_concepts:
      - useEffect runs after the browser paints
      - useLayoutEffect runs before paint and blocks it
      - measuring with getBoundingClientRect then setting position
      - cost of synchronous layout work
      - server rendering caveat for layout effects
    rubric:
      excellent: Explains the timing of both effect types, uses a layout effect for measure-then-position, notes the blocking cost and SSR warning, and mentions positioning libraries or CSS anchoring as alternatives.
      good: Identifies the effect timing and switches to useLayoutEffect.
      weak: Adds a setTimeout or hides the flicker with an opacity transition.
    followups:
      - Why should you avoid useLayoutEffect for most work?
      - How would you handle the tooltip when the page scrolls or resizes?
    common_errors:
      - Using layout effects everywhere and slowing down every render.
      - Forgetting to reposition on scroll or resize.

  - external_key: technical.frontend_react.state_preservation_keys
    competency_key: frontend_react
    topic: Preserving and resetting component state
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How does React decide whether to keep a component's state or throw it away between renders? Use that to
      explain how you'd reset an edit form when the user switches from one customer to another.
    expected_concepts:
      - state is tied to the component's position and type in the tree
      - same type at the same position keeps its state
      - changing the type or position remounts and resets state
      - a key derived from the record id forces a fresh instance
      - avoid effects that copy props into state to reset
    rubric:
      excellent: Explains position and type identity precisely, uses a key such as the customer id to reset the form, and explains why an effect-based reset is fragile.
      good: Knows that changing the key resets state and applies it correctly.
      weak: Resets fields one by one in an effect watching the customer id, unaware of keys.
    followups:
      - What happens to state if you render the same component in both branches of a ternary?
      - When would remounting be too expensive, and what would you do instead?
    common_errors:
      - Declaring a component inside another component so it remounts every render.
      - Syncing form state from props inside an effect.

  - external_key: technical.frontend_react.context_split
    competency_key: frontend_react
    topic: Splitting an overloaded context
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your app has one AppContext holding the current user, theme, feature flags and a live notifications count.
      Every new notification makes large parts of the app render again. How would you restructure it?
    expected_concepts:
      - every consumer renders when the context value changes
      - split contexts by how often values change
      - memoise the provider value object
      - separate state and dispatch contexts
      - move fast-changing data to a store with selectors
    rubric:
      excellent: Explains why all consumers render, splits by update frequency, memoises provider values, and suggests a selector-based store for the live counter, verifying with the profiler.
      good: Proposes splitting the context and memoising the value.
      weak: Wraps every consumer in memo, which does not stop context-triggered renders.
    followups:
      - Why doesn't memo on a consumer stop it rendering when context changes?
      - How would you confirm the fix actually reduced rendering?
    common_errors:
      - Creating a new provider value object on every render.
      - Using context as a high-frequency event bus.

  - external_key: technical.frontend_react.compound_components
    competency_key: frontend_react
    topic: Compound component APIs
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Imagine you're designing a reusable Tabs component that other teams will use with their own content and
      layouts. What would the API look like, and how would the pieces talk to each other internally?
    expected_concepts:
      - compound components such as Tabs, TabList, Tab and TabPanel
      - shared state through context rather than cloning children
      - controlled and uncontrolled modes
      - accessible roles, ids and keyboard support
      - flexibility in layout without extra props
    rubric:
      excellent: Proposes a compound API with internal context, supports controlled and uncontrolled use, covers ARIA roles and arrow-key navigation, and explains why it beats a config-array prop.
      good: Sensible compound or config API with shared state and some accessibility awareness.
      weak: A single component with an array of tab objects and many styling props, with no keyboard support.
    followups:
      - How would you let a consumer control the selected tab from outside?
      - What breaks if you rely on cloneElement to inject props?
    common_errors:
      - Depending on the direct children order through cloneElement.
      - Forgetting arrow-key navigation and ARIA roles.

  - external_key: technical.frontend_react.error_boundaries
    competency_key: frontend_react
    topic: Error boundaries and render failures
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you stop one broken widget from taking down the whole page in a React app? Tell me where you place
      error boundaries and what they won't catch.
    expected_concepts:
      - error boundaries catch errors during render, lifecycle and constructors
      - they do not catch event handler, async or server errors
      - granular boundaries around independent widgets and routes
      - fallback UI with a retry or reset
      - reporting errors to monitoring
    rubric:
      excellent: Places boundaries at route and widget level, lists what is not caught and how to handle those cases, provides reset and retry, and reports errors with context.
      good: Uses error boundaries with fallbacks and knows event handler errors are not caught.
      weak: Wraps only the root, or believes a boundary catches every error including async ones.
    followups:
      - How would you reset a boundary when the user navigates away and back?
      - How do you surface an error from an async handler into a boundary?
    common_errors:
      - A single top-level boundary that blanks the whole app.
      - Swallowing errors without reporting them.

  - external_key: technical.frontend_react.modal_portals
    competency_key: frontend_react
    topic: Modals and portals
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Walk me through building a modal dialog in React from scratch. What do portals solve here, and what else
      does a good dialog need to handle?
    expected_concepts:
      - portals render outside overflow and stacking contexts
      - React events still bubble through the component tree, not the DOM tree
      - focus moves into the dialog, is trapped and returns on close
      - Escape to close and an accessible name
      - background scroll lock and inert content
      - the native dialog element as an option
    rubric:
      excellent: Explains what portals fix and their event-bubbling quirk, covers focus trap and restore, Escape, labelling, scroll lock and inert background, and weighs the native dialog element or a headless library.
      good: Uses a portal and handles focus and Escape.
      weak: Positions a div with a high z-index and ignores keyboard and screen-reader users.
    followups:
      - Why might a click inside the portal trigger a handler on a parent component?
      - How do you handle a dialog that opens another dialog?
    common_errors:
      - Not returning focus to the trigger when the dialog closes.
      - Background content still reachable with the Tab key.

  - external_key: technical.frontend_react.imperative_refs
    competency_key: frontend_react
    topic: Exposing imperative methods through refs
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A parent needs to focus or scroll a custom input component you own. How would you expose that capability,
      and how much of the underlying DOM node would you let callers reach?
    expected_concepts:
      - forwarding refs (forwardRef or ref as a prop in React 19)
      - useImperativeHandle to expose a narrow API
      - prefer declarative props where possible
      - merging internal and external refs
      - typing the ref handle
    rubric:
      excellent: Forwards the ref correctly for the React version in use, limits exposure with useImperativeHandle when appropriate, handles ref merging and explains when a declarative prop is better.
      good: Forwards a ref to the DOM input and focuses it from the parent.
      weak: Reaches into the child's DOM with querySelector or passes a callback to trigger focus through state toggling.
    followups:
      - How do you combine a ref you need internally with one the parent passes in?
      - When would you deliberately hide the raw DOM node?
    common_errors:
      - Overwriting the caller's ref with an internal one.
      - Using imperative handles for things that should be props.

  - external_key: technical.frontend_react.typed_component_props
    competency_key: typescript
    topic: Typing reusable component props
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you write the TypeScript props for a reusable Button that supports your own variants but should
      also accept every native button attribute, including a ref?
    expected_concepts:
      - extending ComponentPropsWithoutRef or ComponentProps of the button element
      - a union type for variants and sizes
      - Omit to avoid conflicting attribute names
      - spreading the remaining props onto the element
      - forwarding the ref with the correct element type
    rubric:
      excellent: Extends the native props correctly, constrains variants with unions, handles conflicts with Omit, spreads the rest, forwards a correctly typed ref and mentions defaulting type to button.
      good: Extends native button props and adds variant unions.
      weak: Lists a few attributes by hand or types props as any.
    followups:
      - Why is it worth defaulting the type attribute to button?
      - How would you type a component that can render as either a link or a button?
    common_errors:
      - Hand-copying a handful of HTML attributes.
      - Forgetting to forward the remaining props, breaking aria attributes.

  # ------------------------------------------------------------- hard
  - external_key: technical.frontend_react.render_purity
    competency_key: frontend_react
    topic: Pure rendering under concurrency
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      React insists that rendering be pure. Why does that matter more now with concurrent rendering, and can you
      describe a bug that a side effect during render could cause?
    expected_concepts:
      - renders may be started, paused, thrown away or repeated
      - side effects during render can run more than once or for discarded work
      - mutating shared or module-level values during render
      - effects and event handlers are the place for side effects
      - StrictMode double rendering exposes impurity
    rubric:
      excellent: Explains that concurrent rendering can discard or repeat renders, gives a concrete bug such as a counter or cache mutated during render, and shows where the side effect belongs.
      good: Understands renders can run more than once and keeps side effects out of render.
      weak: Thinks purity is only a style preference or that each render maps to exactly one commit.
    followups:
      - Is lazily initialising a ref during render acceptable, and why?
      - How would you track down an impurity that only shows up in production?
    common_errors:
      - Pushing to a module-level array while rendering.
      - Assuming a render always commits.

  - external_key: technical.frontend_react.cross_tab_storage_hook
    competency_key: frontend_react
    topic: Designing a shared persistence hook
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Several teams want a hook that keeps a value in localStorage, stays in sync across browser tabs and works
      with server rendering. How would you design it, and what edge cases would you plan for?
    expected_concepts:
      - useSyncExternalStore with subscribe and getSnapshot
      - the storage event for other tabs plus in-tab notification
      - server snapshot and hydration consistency
      - serialisation, parse failures and schema changes
      - storage being unavailable or full
      - caching the snapshot to avoid infinite renders
    rubric:
      excellent: Builds on useSyncExternalStore with a stable cached snapshot, handles same-tab and cross-tab updates, supplies a server snapshot, and covers parse errors, quota errors and versioned values.
      good: Uses an effect or external store with the storage event and handles JSON errors.
      weak: Reads localStorage during render without guarding against the server or other tabs.
    followups:
      - Why doesn't the storage event fire in the tab that made the change?
      - How would you migrate a stored value whose shape has changed?
    common_errors:
      - Returning a freshly parsed object from getSnapshot on every call.
      - Accessing window during server rendering.

  - external_key: technical.frontend_react.compiler_memoization
    competency_key: frontend_react
    topic: React Compiler and manual memoisation
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your team is debating whether to adopt the React Compiler and stop writing useMemo and useCallback by hand.
      How would you evaluate that decision for a large existing codebase?
    expected_concepts:
      - the compiler memoises automatically based on code analysis
      - it relies on code following the rules of React
      - incremental adoption per directory with opt-outs
      - measuring render counts and interaction latency before and after
      - effects that depended on referential identity
      - lint tooling to find incompatible code
    rubric:
      excellent: Frames it as a measured, incremental rollout, explains that rule-breaking code may be skipped or behave differently, plans profiling and lint-based readiness checks, and considers effect dependency behaviour.
      good: Understands what the compiler does and proposes a trial with measurement.
      weak: Removes all manual memoisation at once or dismisses it without evaluation.
    followups:
      - What kinds of existing code would make the compiler bail out?
      - How would you prove the change improved real user experience?
    common_errors:
      - Assuming the compiler fixes code that mutates props or state.
      - No baseline measurements before rolling out.

  - external_key: technical.frontend_react.imperative_library_integration
    competency_key: frontend_react
    topic: Wrapping imperative libraries in React
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team needs to embed an imperative mapping library, something like Leaflet or Mapbox, inside a React
      page where markers come from props and users can pan and click. How would you build the wrapper component
      so React and the library don't fight over the same DOM?
    expected_concepts:
      - React owns a container element and the library owns everything inside it
      - create the instance once in an effect and destroy it in cleanup
      - sync prop changes to the instance with targeted imperative calls
      - library events bridged to callbacks kept fresh through refs
      - surviving StrictMode remounts and avoiding duplicate instances
      - lazy-loading the heavy library
    rubric:
      excellent: Draws a clear ownership boundary, manages the instance lifecycle with correct cleanup, diffs prop changes into imperative updates, handles fresh callbacks and StrictMode remounts, and loads the library lazily.
      good: Creates and destroys the instance in an effect and updates it when props change.
      weak: Recreates the whole map on every render or lets React render children inside the library's DOM.
    followups:
      - How would you avoid recreating every marker when one item in the list changes?
      - How would you expose methods like flyTo to the parent?
    common_errors:
      - Initialising the library on every render.
      - Event handlers that capture stale props.

  - external_key: technical.frontend_react.server_client_boundary
    competency_key: frontend_react
    topic: Server and client component boundaries
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      In an app using React Server Components, how do you decide which parts should be server components and
      which need to be client components? Walk me through a page you'd split that way.
    expected_concepts:
      - server components fetch data and send no JavaScript for themselves
      - client components are needed for state, effects and browser APIs
      - push the client boundary down to small interactive leaves
      - passing server components as children into client components
      - props across the boundary must be serialisable
      - keeping secrets and heavy libraries on the server
    rubric:
      excellent: Splits a real page sensibly, keeps the interactive leaves small, explains serialisable props and the children pattern, and discusses bundle size, data-fetching and secret-handling benefits.
      good: Correctly identifies what needs to be a client component and why.
      weak: Marks whole pages as client components or believes server components can use state.
    followups:
      - What happens if a client component imports a server-only module?
      - How do you handle a mutation from a server-rendered list?
    common_errors:
      - Placing the use client directive at the top of the tree.
      - Passing functions or class instances across the boundary.

  - external_key: technical.frontend_react.class_to_hooks_migration
    competency_key: frontend_react
    topic: Migrating class components and HOCs
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You join a team whose React codebase is mostly class components wrapped in several layers of higher-order
      components. How would you modernise it to hooks without pausing feature work or causing regressions?
    expected_concepts:
      - migrate opportunistically, starting with shared logic
      - convert higher-order components into hooks while keeping adapters
      - characterisation tests before refactoring
      - lifecycle methods do not map one-to-one to effects
      - tracking progress and stopping new class components with lint
    rubric:
      excellent: Proposes an incremental plan with tests first, hook-plus-adapter for shared HOCs, careful lifecycle translation, progress tracking and guardrails against new legacy code.
      good: Incremental plan that converts components as they are touched, with tests.
      weak: Proposes a big-bang rewrite or a mechanical one-to-one translation of lifecycles into effects.
    followups:
      - How would you translate a componentDidUpdate that compares previous props?
      - Which components would you deliberately leave as classes?
    common_errors:
      - Treating useEffect as a direct replacement for componentDidMount.
      - Removing a higher-order component that other teams still import.
