# Curated questions: UX / UI designer (part 3 of 4).
# Usability testing (planning, moderation, metrics, experiments) and accessibility from the designer's
# side: colour, annotations, custom components, charts, motion, plain language and inclusive research.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [ux_designer]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.ux_designer.usability_task_writing
    competency_key: ux_research
    topic: Writing usability test tasks
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you write the tasks for a usability test so they feel realistic and don't give the answer away?
      Give me an example of a task you'd write for a travel booking site.
    expected_concepts:
      - scenarios based on real user goals
      - avoiding the exact words used in the interface
      - a clear end point so success can be judged
      - realistic details such as dates and constraints
      - ordering tasks so earlier ones don't teach later ones
    rubric:
      excellent: Writes a realistic, goal-based example task without interface words, explains how success is defined, and considers task order and piloting.
      good: Writes reasonable scenario-based tasks with a clear goal.
      weak: Writes instructions like "click the search button" that test whether people can follow directions.
    followups:
      - How would you define success for the task you just described?
    common_errors:
      - Using the label of the button being tested inside the task wording.

  - external_key: technical.ux_designer.moderating_stuck_participant
    competency_key: ux_research
    topic: Moderating usability sessions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      During a usability session a participant gets stuck and asks you, "What am I supposed to do here?" How
      do you handle that moment, and how do you moderate sessions in general so you don't bias them?
    expected_concepts:
      - redirecting questions back to the participant
      - letting silence and struggle play out for a while
      - knowing when to help so the session can continue
      - neutral prompts for thinking aloud
      - noting where help was given when analysing results
    rubric:
      excellent: Gives concrete neutral phrasing, explains how they balance observing struggle with keeping the session useful, and records assisted tasks separately in analysis.
      good: Knows to avoid answering directly and to encourage thinking aloud.
      weak: Explains the interface whenever participants hesitate.
    followups:
      - What do you say when a participant asks whether they did it right?
    common_errors:
      - Rescuing participants too quickly so the real problem is never seen.

  - external_key: technical.ux_designer.usability_issue_severity
    competency_key: ux_research
    topic: Prioritising usability findings
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      After a round of usability testing you have a list of thirty issues. How do you decide which ones to
      fix first and present them so the team acts on them?
    expected_concepts:
      - severity based on impact on task completion
      - frequency across participants
      - how important the affected task is to users and the business
      - effort to fix and quick wins
      - presenting top issues with evidence such as clips
    rubric:
      excellent: Uses a clear severity scheme combining impact, frequency and task importance, weighs effort, and presents a short prioritised list with evidence and recommended fixes.
      good: Prioritises issues sensibly and shares them with the team.
      weak: Hands over an unprioritised list of every issue.
    followups:
      - How would you treat a severe issue that only one participant hit?
    common_errors:
      - Ranking issues by how often they occurred while ignoring how badly they blocked users.

  - external_key: technical.ux_designer.brand_colours_contrast
    competency_key: accessibility
    topic: Brand colours that fail contrast
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      The brand team has just launched a new pale teal as the primary colour, and on white it doesn't pass
      contrast requirements for text or buttons. How would you handle it in the product?
    expected_concepts:
      - contrast requirements for text and interface components
      - darker shades or tonal variants for interactive elements
      - using the brand colour where contrast is not needed
      - not relying on colour alone to convey meaning
      - working with the brand team on an accessible palette
    rubric:
      excellent: Knows the relevant contrast requirements, proposes practical palette solutions that keep brand character, and works with the brand team to make an accessible palette part of the system.
      good: Recognises the problem and proposes darker variants or alternative uses.
      weak: Uses the colour as is or treats contrast as a nice-to-have.
    followups:
      - How would you test contrast across hover, focus and disabled states?
    common_errors:
      - Checking contrast for body text only and forgetting buttons, icons and input borders.

  - external_key: technical.ux_designer.accessibility_handoff_annotations
    competency_key: accessibility
    topic: Accessibility annotations in design handoff
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you hand designs over to engineers, what accessibility information do you include in the specs,
      and why does it need to come from design rather than being left to developers?
    expected_concepts:
      - heading structure and landmarks
      - reading and focus order
      - labels and text alternatives for icons and images
      - focus states and keyboard behaviour for interactive elements
      - announcements for dynamic changes and errors
    rubric:
      excellent: Lists concrete annotations, explains that many accessibility decisions are design decisions, and describes how they review the build against the annotations.
      good: Includes focus order, labels and alt text in handoff.
      weak: Assumes accessibility is purely an engineering concern.
    followups:
      - How do you check the built version against what you annotated?
    common_errors:
      - Designing a visible focus state that disappears into the brand colour.

  - external_key: technical.ux_designer.target_size_spacing
    competency_key: accessibility
    topic: Touch targets and pointer precision
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you size and space interactive elements so people can use them easily, including people with
      tremors, people using a phone one-handed on a bus, or anyone using a stylus or a mouse?
    expected_concepts:
      - minimum target sizes from platform and accessibility guidance
      - spacing between adjacent targets
      - the whole row or card as a clickable area where sensible
      - avoiding precise gestures such as drag-only interactions
      - placing frequent actions within easy reach
    rubric:
      excellent: Gives concrete sizing guidance with reasoning, covers spacing, alternatives to precise gestures and reach, and links them to real design decisions.
      good: Knows minimum target sizes and the importance of spacing.
      weak: Sizes targets to fit the visual design without considering use.
    followups:
      - Where have you had to trade off density against target size?
    common_errors:
      - Making a small icon the only clickable area even when a larger target is available.

  - external_key: technical.ux_designer.stakeholders_observing_sessions
    competency_key: ux_research
    topic: Stakeholders observing usability sessions
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      After watching just one usability session, a product manager announces in the team channel that the
      whole navigation needs to be rebuilt. How would you handle that?
    expected_concepts:
      - encouraging stakeholders to watch sessions while setting expectations
      - waiting for patterns across sessions
      - structured debriefs after each session
      - sharing a synthesis before decisions are made
      - keeping the stakeholder's interest as an asset
    rubric:
      excellent: Responds constructively, explains why one session is not enough, sets up debriefs and a clear point where decisions get made, and keeps the PM engaged.
      good: Explains the need to wait for more sessions before deciding.
      weak: Either goes along with the rebuild or discourages stakeholders from observing.
    followups:
      - How do you brief observers before sessions start?
    common_errors:
      - Banning stakeholders from sessions instead of guiding how they interpret them.

  # ---------------------------------------------------------------- medium
  - external_key: technical.ux_designer.moderated_vs_unmoderated
    competency_key: ux_research
    topic: Moderated versus unmoderated testing
    difficulty: medium
    kind: technical
    text: >-
      How do you choose between moderated and unmoderated usability testing? Tell me about a study where
      that choice affected what you learned.
    expected_concepts:
      - moderated for complex flows, early concepts and probing why
      - unmoderated for speed, scale and simple well-defined tasks
      - prototype robustness needed for unmoderated sessions
      - participant quality and screening on testing platforms
      - analysis effort for recordings
    rubric:
      excellent: Explains trade-offs clearly with a concrete study, covers prototype and task design needs for unmoderated testing, and discusses participant quality issues.
      good: Knows when each approach fits and has used both.
      weak: Uses one approach for everything or cannot explain the differences.
    followups:
      - How do you spot low-quality participants in unmoderated tests?
    common_errors:
      - Running unmoderated tests on a fragile prototype so participants get lost in dead ends.

  - external_key: technical.ux_designer.usability_benchmarking
    competency_key: ux_research
    topic: Measuring usability before and after a redesign
    difficulty: medium
    kind: technical
    text: >-
      Leadership asks you to prove the redesigned checkout is easier to use than the old one. How would you
      measure that?
    expected_concepts:
      - a baseline measurement of the old design
      - task success, time on task and error rates
      - standard questionnaires such as SUS or SEQ
      - comparable tasks, participants and sample sizes
      - pairing benchmarks with live metrics such as conversion
    rubric:
      excellent: Designs a fair before-and-after comparison with suitable metrics and sample sizes, uses standard instruments, and connects lab metrics to live product data.
      good: Proposes measuring success rate and time on both designs.
      weak: Relies on asking people which version they prefer.
    followups:
      - How many participants would you need to see a meaningful difference?
    common_errors:
      - Measuring the new design without a baseline from the old one.

  - external_key: technical.ux_designer.flat_ab_test_result
    competency_key: product_sense
    topic: Interpreting a disappointing experiment
    difficulty: medium
    kind: scenario
    text: >-
      You redesigned a product page and usability testing went well, but the A/B test shows no change in
      conversion after two weeks. What would you do next?
    expected_concepts:
      - checking the experiment setup, sample size and duration
      - segmenting results by device and user type
      - looking at secondary metrics and behaviour changes
      - questioning whether conversion was the right measure for the change
      - deciding whether to iterate, ship or roll back
    rubric:
      excellent: Checks the validity of the test, digs into segments and secondary metrics, reflects on whether usability gains should affect conversion, and makes a clear recommendation.
      good: Investigates the result rather than dismissing it and suggests next steps.
      weak: Dismisses the experiment or keeps running it until something looks significant.
    followups:
      - When would you ship a design that didn't move the main metric?
    common_errors:
      - Stopping or extending the test based on watching daily results.

  - external_key: technical.ux_designer.rapid_iterative_testing
    competency_key: ux_research
    topic: Rapid iterative testing
    difficulty: medium
    kind: technical
    text: >-
      Have you ever changed a prototype between usability sessions instead of waiting until the end of the
      study? Walk me through how that worked and when you think it's a good idea.
    expected_concepts:
      - fixing obvious issues quickly between sessions
      - the team watching and deciding changes together
      - tracking which version each participant saw
      - when consistency across sessions matters more, such as benchmarking
      - documenting changes and the evidence for them
    rubric:
      excellent: Describes running iterative testing with clear rules on when to change, tracks versions and evidence, and explains when it is not appropriate.
      good: Has iterated between sessions and can describe benefits.
      weak: Has never considered it or changes the prototype after every comment.
    followups:
      - How did you decide an issue was clear enough to fix after one or two sessions?
    common_errors:
      - Losing track of which participant saw which version.

  - external_key: technical.ux_designer.accessible_date_range_picker
    competency_key: accessibility
    topic: Specifying an accessible custom component
    difficulty: medium
    kind: scenario
    text: >-
      Your product needs a custom date range picker for booking hotel stays. How would you design and
      specify it so it works with a keyboard and a screen reader, not just a mouse?
    expected_concepts:
      - allowing typed date entry as well as a calendar
      - keyboard behaviour for moving through days, weeks and months
      - announcing selected ranges and unavailable dates
      - focus management when opening and closing the calendar
      - testing the build with assistive technology
    rubric:
      excellent: Specifies typed input and full keyboard behaviour, describes how selections and unavailable dates are announced and how focus moves, and plans testing with assistive technology.
      good: Covers keyboard access and labels, with some thought about announcements.
      weak: Designs only the visual calendar and assumes developers will make it accessible.
    followups:
      - Would you build this from scratch or start from an existing pattern, and why?
    common_errors:
      - Offering only a mouse-driven calendar with no way to type a date.

  - external_key: technical.ux_designer.assistive_tech_design_review
    competency_key: accessibility
    topic: Reviewing designs with assistive technology
    difficulty: medium
    kind: technical
    text: >-
      As a designer, how do you check your work with assistive technology such as screen readers, screen
      magnifiers or voice control, and what kinds of problems has that uncovered for you?
    expected_concepts:
      - using a screen reader on built pages or coded prototypes
      - testing at high zoom and with magnification
      - voice control relying on visible labels matching accessible names
      - learning the basics of the tools rather than guessing
      - feeding findings into patterns and the design system
    rubric:
      excellent: Describes a hands-on practice with more than one assistive technology, gives concrete problems found and fixed, and explains how lessons were fed back into patterns.
      good: Has used a screen reader to check designs and can describe some findings.
      weak: Relies only on automated checkers or has never tried assistive technology.
    followups:
      - What's the biggest difference between what a design shows and what a screen reader announces?
    common_errors:
      - Assuming a passing automated scan means the experience works with assistive technology.

  - external_key: technical.ux_designer.motion_design_guidelines
    competency_key: accessibility
    topic: Using motion responsibly
    difficulty: medium
    kind: technical
    text: >-
      How do you decide when animation actually helps users, and how do you specify motion so it doesn't
      cause problems for people who find movement distracting or disorienting?
    expected_concepts:
      - motion with a purpose such as showing relationships or state changes
      - subtle durations and easing that don't slow tasks
      - respecting the operating system's reduced motion setting
      - avoiding large parallax, flashing and auto-playing movement
      - controls to pause moving content
    rubric:
      excellent: Ties motion to clear purposes, gives concrete guidance on duration and scale, designs reduced-motion alternatives, and covers flashing and pause controls.
      good: Uses purposeful motion and knows about reduced motion settings.
      weak: Uses animation mainly for decoration without considering its effects.
    followups:
      - What would the reduced-motion version of a page transition look like?
    common_errors:
      - Removing all feedback in reduced-motion mode instead of replacing movement with a subtler change.

  - external_key: technical.ux_designer.plain_language_cognitive_load
    competency_key: accessibility
    topic: Reducing cognitive load and using plain language
    difficulty: medium
    kind: technical
    text: >-
      Accessibility isn't only about screen readers. How do you design for people who find complex text,
      memory-heavy tasks or time limits difficult? Give me examples from your work.
    expected_concepts:
      - plain language and short, scannable content
      - consistent navigation and predictable behaviour
      - not relying on users remembering information between steps
      - avoiding or extending time limits and saving progress
      - clear error recovery and confirmation
    rubric:
      excellent: Gives concrete examples across language, consistency, memory and timing, explains how they tested them, and shows these choices help all users.
      good: Names several relevant techniques such as plain language and saving progress.
      weak: Thinks of accessibility only as visual and screen reader support.
    followups:
      - How do you test whether content is easy to understand?
    common_errors:
      - Session timeouts that discard a long form without warning.

  - external_key: technical.ux_designer.accessible_charts
    competency_key: accessibility
    topic: Accessible data visualisation
    difficulty: medium
    kind: scenario
    text: >-
      Your analytics product shows line charts with six coloured series, and a customer reports that their
      colour-blind users and screen reader users can't make sense of them. How would you redesign the charts?
    expected_concepts:
      - distinguishing series with more than colour such as labels, patterns or markers
      - direct labelling instead of a distant legend
      - text summaries of the key takeaway
      - accessible data tables as an alternative view
      - keyboard access to data points and tooltips
    rubric:
      excellent: Proposes multiple complementary fixes across colour, labelling, summaries, tables and keyboard access, and explains how they would validate with affected users.
      good: Fixes colour reliance and adds a table or text alternative.
      weak: Only changes the colour palette.
    followups:
      - What should a text summary of a chart actually say?
    common_errors:
      - Hiding critical values inside hover-only tooltips.

  - external_key: technical.ux_designer.inclusive_research_participants
    competency_key: accessibility
    topic: Including assistive technology users in research
    difficulty: medium
    kind: scenario
    text: >-
      Your team has never included people who use screen readers, magnifiers or switch devices in its
      research. How would you start doing that, and what would you change about how sessions are run?
    expected_concepts:
      - recruiting through specialist panels or community organisations
      - letting participants use their own devices and settings
      - accessible consent forms, scheduling and prototypes
      - allowing extra session time and fair incentives
      - feeding findings into design decisions and patterns
    rubric:
      excellent: Plans practical recruiting, adapts session logistics and materials, ensures prototypes work with participants' own tools, and connects findings to design changes.
      good: Recognises the need and proposes recruiting and some session adjustments.
      weak: Proposes simulating the experience internally instead of including real users.
    followups:
      - What would you do if your prototype doesn't work with a participant's screen reader?
    common_errors:
      - Asking participants to use an unfamiliar lab computer instead of their own set-up.

  - external_key: technical.ux_designer.remote_mobile_testing
    competency_key: ux_research
    topic: Usability testing mobile apps remotely
    difficulty: medium
    kind: technical
    text: >-
      How do you run usability tests on a mobile app when participants are remote? What do you do to see
      what's happening on their screen and keep the sessions realistic?
    expected_concepts:
      - screen sharing or recording tools for mobile
      - capturing taps and gestures as well as screens
      - testing on participants' own devices
      - realistic contexts such as one-handed use or interruptions
      - pilot sessions to sort out technical set-up
    rubric:
      excellent: Describes a working remote mobile set-up, handles gesture visibility and device variety, considers realistic context, and pilots the logistics.
      good: Has run remote mobile tests and can describe the tools used.
      weak: Tests mobile designs on a desktop browser or ignores how gestures are observed.
    followups:
      - What problems did you only discover because participants used their own phones?
    common_errors:
      - Spending half of each session fixing screen-sharing problems because no pilot was run.

  - external_key: technical.ux_designer.competitive_usability_benchmark
    competency_key: ux_research
    topic: Benchmarking against competitors
    difficulty: medium
    kind: scenario
    text: >-
      Sales keeps saying customers find a competitor's onboarding easier than yours. How would you find out
      whether that's true and what you can learn from it?
    expected_concepts:
      - a comparative usability study with the same tasks on both products
      - consistent metrics such as success, time and ease ratings
      - counterbalancing the order of products
      - learning why patterns work rather than copying them
      - talking to customers who switched or evaluated both
    rubric:
      excellent: Designs a fair comparative study with counterbalancing and shared metrics, complements it with switcher interviews, and focuses on principles to learn rather than copying screens.
      good: Proposes testing both products with users.
      weak: Copies the competitor's design based on a walkthrough.
    followups:
      - How would you avoid participants favouring whichever product they saw second?
    common_errors:
      - Comparing a competitor's polished flow with your product's unrepresentative edge cases.

  # ------------------------------------------------------------------ hard
  - external_key: technical.ux_designer.accessibility_in_design_system
    competency_key: accessibility
    topic: Building accessibility into a design system
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      If you were responsible for making accessibility part of the design system rather than something each
      team remembers on its own, what would you put in place?
    expected_concepts:
      - accessible tokens such as colour pairs that pass contrast
      - components with keyboard, focus and labelling behaviour built in and documented
      - usage guidance covering what teams must still get right
      - accessibility criteria in component review and release
      - training, office hours and tracking adoption
    rubric:
      excellent: Covers tokens, component behaviour, documentation, review gates and enablement, recognises what a system cannot guarantee for teams, and explains how progress would be measured.
      good: Proposes accessible components and documentation.
      weak: Relies on a checklist or a one-off audit.
    followups:
      - Which accessibility problems can a design system not solve for product teams?
    common_errors:
      - Assuming that using accessible components makes the whole page accessible.

  - external_key: technical.ux_designer.accessible_drag_and_drop
    competency_key: accessibility
    topic: Alternatives to drag-and-drop interactions
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team's kanban board relies on dragging cards between columns and reordering them. How would you
      design it so people who can't use a mouse precisely, or who use a keyboard or screen reader, can do
      everything others can?
    expected_concepts:
      - keyboard pick-up, move and drop interactions
      - non-drag alternatives such as a move menu or status field
      - announcing position and result of moves
      - focus behaviour after a card moves
      - testing with keyboard and assistive technology users
    rubric:
      excellent: Designs both keyboard drag and simpler non-drag alternatives, specifies announcements and focus behaviour, and plans testing with real users of these tools.
      good: Provides a keyboard or menu-based alternative to dragging.
      weak: Treats drag-and-drop as mouse-only or adds an alternative that loses functionality.
    followups:
      - How would the screen reader announce a card moving from one column to another?
    common_errors:
      - Offering keyboard moving between columns but not reordering within a column.

  - external_key: technical.ux_designer.continuous_testing_cadence
    competency_key: ux_research
    topic: Setting up continuous usability testing
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You join a company where usability testing happens once a year, if ever. How would you build a
      regular testing rhythm that product teams actually use?
    expected_concepts:
      - a standing participant panel and recruiting operations
      - a regular cadence such as weekly or fortnightly sessions
      - templates and lightweight reporting
      - enabling designers and PMs to run sessions with guidance
      - showing early wins to build demand
    rubric:
      excellent: Sets up recruiting operations, cadence and templates, enables others to test with quality controls, and explains how to build demand and measure the programme's value.
      good: Proposes a regular testing schedule with shared logistics.
      weak: Proposes running more large studies personally.
    followups:
      - How would you keep the quality high if many people are running sessions?
    common_errors:
      - Building a cadence that relies entirely on one researcher's calendar.

  - external_key: technical.ux_designer.ux_metrics_framework
    competency_key: product_sense
    topic: Defining UX quality metrics
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you set up a way to track the quality of the user experience over time for a product, so the
      team knows whether design work is improving things?
    expected_concepts:
      - a framework such as HEART or goals, signals and metrics
      - combining behavioural data with attitudinal measures
      - task-level metrics for key journeys
      - instrumentation work with engineering
      - reviewing metrics regularly and avoiding vanity metrics
    rubric:
      excellent: Builds a structured framework from goals to metrics, mixes behavioural and attitudinal data, plans instrumentation, and explains how the metrics will drive decisions.
      good: Proposes sensible metrics such as task success and satisfaction scores.
      weak: Relies on a single satisfaction score or page views.
    followups:
      - Which metric in your framework would be easiest to game, and how would you guard against that?
    common_errors:
      - Tracking metrics that nobody reviews or acts on.

  - external_key: technical.ux_designer.lab_vs_live_conflict
    competency_key: product_sense
    topic: When lab results and live data disagree
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Usability tests showed the new search experience was clearly better, but after release, live data shows
      searches per session went up and purchases dipped slightly. How would you work out what is going on?
    expected_concepts:
      - checking whether the metric change is good or bad behaviour
      - differences between test tasks and real user goals
      - segmenting by new versus returning users and learning effects
      - looking for technical or relevance problems
      - follow-up research with real users of the live product
    rubric:
      excellent: Questions the interpretation of each metric, considers task realism, learning effects and technical causes, segments the data, and plans focused follow-up research and a decision.
      good: Investigates both sources and proposes follow-up work.
      weak: Trusts one source and dismisses the other.
    followups:
      - How long would you wait before deciding to roll back?
    common_errors:
      - Assuming more searches means more engagement when it may mean people can't find things.

  - external_key: technical.ux_designer.evaluating_long_workflows
    competency_key: ux_research
    topic: Evaluating long, complex workflows
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're designing a tool that financial analysts use to build a quarterly forecast over several days.
      A one-hour usability session can't capture that. How would you evaluate whether the design works?
    expected_concepts:
      - breaking the workflow into testable segments
      - beta programmes with real data and analytics
      - diary or check-in studies over the real cycle
      - expert reviews and walkthroughs with power users
      - measuring outcomes such as errors, rework and time to complete
    rubric:
      excellent: Combines segmented testing, real-world beta use and longitudinal methods, defines outcome measures for the full workflow, and acknowledges what each method misses.
      good: Proposes a beta or longitudinal study in addition to short tests.
      weak: Runs ordinary one-hour sessions and assumes the results cover the whole workflow.
    followups:
      - How would you get analysts to use an unfinished tool with real data?
    common_errors:
      - Testing each screen in isolation and missing problems in hand-offs between steps.
