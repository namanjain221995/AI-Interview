# Cloud engineering (technical.cloud), part 3: compute, storage, managed databases, serverless and
# messaging choices on AWS, Azure and GCP.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [cloud]
questions:
  # ------------------------------------------------------------- compute and storage basics
  - external_key: technical.cloud.compute_model_choice
    competency_key: system_design
    topic: VMs, containers or serverless
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide whether a workload should run on virtual machines, a managed container service or
      serverless functions? Use a service you've actually built or run as the example.
    expected_concepts:
      - control versus operational burden
      - execution time and resource limits of functions
      - traffic shape and scaling to zero
      - cost model at steady versus spiky load
      - cold starts and latency needs
      - long-running or stateful processes
    rubric:
      excellent: Grounds the choice in a real workload, weighs traffic shape, runtime limits, latency, cost and team skills, and explains what would make them choose differently.
      good: Gives sensible criteria for each option with an example.
      weak: Always picks the same option or chooses by trend rather than workload characteristics.
    followups:
      - At what traffic level would serverless stop being the cheaper option for that service?
      - What would push you back to virtual machines?
    common_errors:
      - Ignoring function time limits for long-running jobs.

  - external_key: technical.cloud.storage_type_choice
    competency_key: system_design
    topic: Object, block and file storage
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Explain when you'd use object storage, block storage and a managed file share in the cloud, with a
      real example of each.
    expected_concepts:
      - object storage for unstructured data accessed over HTTP APIs
      - block volumes attached to a single instance for databases and boot disks
      - managed file shares for shared POSIX or SMB access
      - durability and replication differences
      - performance characteristics and cost per gigabyte
    rubric:
      excellent: Matches each storage type to concrete workloads with reasons around access pattern, sharing, durability and cost, and names the services on at least one provider.
      good: Correctly distinguishes the three with an example of each.
      weak: Confuses block and object storage or would mount object storage as a database disk.
    followups:
      - Why is putting a database on a network file share usually a bad idea?
      - How does block volume durability differ from object storage durability?
    common_errors:
      - Treating object storage like a file system with cheap renames and appends.

  - external_key: technical.cloud.object_tiering_lifecycle
    competency_key: cloud_cost_optimization
    topic: Storage classes and lifecycle rules
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you use storage classes and lifecycle rules to keep object storage costs down for data that's
      read heavily for a month and then rarely touched?
    expected_concepts:
      - transitions from standard to infrequent access to archive tiers
      - minimum storage durations and retrieval fees
      - automatic tiering features such as S3 automatic tiering or GCS Autoclass
      - expiring old versions and incomplete multipart uploads
      - checking real access patterns before choosing
    rubric:
      excellent: Designs transitions based on measured access, accounts for retrieval fees, minimum durations and per-object overhead, and cleans up versions and incomplete uploads.
      good: Sets lifecycle transitions to cheaper tiers and an expiry policy.
      weak: Moves everything to archive immediately without considering retrieval cost or time.
    followups:
      - When does moving lots of tiny objects to a cheaper tier cost more than it saves?
      - How would you find out how often data is really read?
    common_errors:
      - Forgetting that versioned buckets keep paying for old versions.

  - external_key: technical.cloud.vm_autoscaling_setup
    competency_key: aws
    topic: Autoscaling a VM-based web tier
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your web tier runs on a fixed number of VMs and struggles every Monday morning when traffic spikes. How
      would you set up autoscaling for it?
    expected_concepts:
      - an autoscaling group, scale set or managed instance group across zones
      - choosing a metric such as CPU or requests per target
      - target tracking policies
      - instance warm-up and launch time
      - scheduled scaling ahead of predictable peaks
      - instances built from images so they come up ready
    rubric:
      excellent: Picks a metric that reflects load, combines target tracking with scheduled scale-out for the known peak, accounts for boot time, and makes instances stateless and image-based.
      good: Sets up an autoscaling group with a reasonable metric and minimum size.
      weak: Suggests just adding more fixed VMs or scaling on a metric unrelated to load.
    followups:
      - New instances take eight minutes to become ready; how does that change your design?
      - What has to be true about the application before autoscaling works?
    common_errors:
      - Storing session state on instances that autoscaling will terminate.

  - external_key: technical.cloud.database_service_choice
    competency_key: databases
    topic: Choosing a managed database
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a team asks for a database in the cloud, how do you help them choose between a managed relational
      database, a key-value or document store, and running their own on VMs?
    expected_concepts:
      - access patterns and query flexibility
      - transactions and consistency needs
      - scale characteristics and key design in NoSQL stores
      - operational burden of self-managing
      - built-in backups, failover and patching of managed services
      - cost and lock-in
    rubric:
      excellent: Starts from access patterns and consistency needs, explains what each option makes easy or hard, and only self-manages for a concrete reason.
      good: Gives sensible criteria and defaults to a managed service.
      weak: Picks NoSQL for scale by default or self-manages without justification.
    followups:
      - What would make you run a database yourself on VMs today?
      - How would you know a team picked the wrong database six months later?
    common_errors:
      - Choosing a key-value store before knowing the queries the application needs.

  - external_key: technical.cloud.azure_vm_disk_bottleneck
    competency_key: azure
    topic: Disk performance on Azure VMs
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An application on an Azure VM is slow and the team suspects the disk. How would you confirm that, and
      what options would you consider?
    expected_concepts:
      - disk IOPS and throughput metrics against the disk's limits
      - VM-level caps on disk throughput
      - disk tiers such as Standard SSD, Premium SSD, Premium SSD v2 and Ultra
      - host caching settings
      - burst credits running out
      - striping multiple disks or resizing the VM
    rubric:
      excellent: Compares observed IOPS and throughput with both disk and VM limits, checks bursting and caching, and picks the cheapest fix that removes the real bottleneck.
      good: Checks disk metrics and suggests a faster disk tier.
      weak: Upgrades the disk without checking whether the VM size caps throughput anyway.
    followups:
      - Why might a faster disk make no difference at all?
      - How would you test the change before moving production?
    common_errors:
      - Ignoring the VM size's own throughput limit.

  - external_key: technical.cloud.serverless_cold_starts
    competency_key: gcp
    topic: Cold starts in serverless services
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A team moved an API to Cloud Run or a similar serverless platform, and users now complain that the
      first request after a quiet period is slow. What's going on, and what would you suggest?
    expected_concepts:
      - cold starts when new instances are created
      - image or package size and startup work
      - minimum instances or provisioned concurrency
      - lazy initialisation and lighter runtimes
      - cost of keeping instances warm
    rubric:
      excellent: Explains the cold start mechanism, measures it, reduces startup work and image size, and uses minimum instances where the latency matters, weighing the cost.
      good: Identifies cold starts and suggests minimum instances.
      weak: Suggests scheduled pings as the only fix or does not recognise cold starts.
    followups:
      - How would you measure how often users actually hit a cold start?
      - What startup work in the application could be deferred?
    common_errors:
      - Keeping instances warm with pings that don't match real concurrency.

  - external_key: technical.cloud.instance_sizing_request
    competency_key: aws
    topic: Choosing an instance type and size
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A team asks which VM size to use for a new Java service and just wants something big to be safe. How
      would you help them pick a sensible instance type and size?
    expected_concepts:
      - CPU to memory ratio of the workload
      - instance families such as general purpose, compute or memory optimised
      - caveats of burstable instances
      - load testing to find real needs
      - preferring scale-out over one large instance
      - newer generations or ARM-based instances for price-performance
    rubric:
      excellent: Profiles the workload, picks a family by resource ratio, validates with load tests, prefers smaller instances scaled out, and plans to revisit using real metrics.
      good: Matches the instance family to the workload and suggests testing.
      weak: Picks the largest instance offered or chooses without any data.
    followups:
      - When would a burstable instance hurt you?
      - What would you check before moving this service to ARM instances?
    common_errors:
      - Using burstable instances for steady CPU-heavy work.

  # ------------------------------------------------------------- databases, containers, messaging
  - external_key: technical.cloud.key_value_key_design
    competency_key: databases
    topic: Partition and sort key design
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you design partition and sort keys for a DynamoDB table or a similar key-value store, and
      what happens when you get them wrong?
    expected_concepts:
      - designing from the access patterns first
      - high-cardinality partition keys to spread load
      - hot partitions and throttling
      - sort keys for range queries and hierarchies
      - secondary indexes for other access patterns
      - single-table design trade-offs
    rubric:
      excellent: Designs keys from listed access patterns, explains hot partitions and how to avoid them, and uses sort keys and indexes deliberately.
      good: Knows to choose a well-distributed partition key and uses sort keys for ranges.
      weak: Designs tables like relational tables and expects to query any attribute efficiently.
    followups:
      - How would you handle a single very popular item that every request reads?
      - What does it cost you to add a new access pattern later?
    common_errors:
      - Using a low-cardinality attribute like status or date as the partition key.

  - external_key: technical.cloud.cosmos_consistency_levels
    competency_key: azure
    topic: Cosmos DB consistency levels
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Cosmos DB offers several consistency levels. How would you choose one for a globally distributed
      application, and what are you trading off?
    expected_concepts:
      - strong, bounded staleness, session, consistent prefix and eventual
      - latency and availability cost of stronger levels across regions
      - request unit cost differences
      - session consistency for read-your-own-writes
      - multi-region write conflicts and resolution
      - partition key choice still matters
    rubric:
      excellent: Explains the levels with concrete user-visible effects, links each to latency and cost, and picks session or stronger based on a real requirement.
      good: Knows the main levels and that stronger consistency costs latency.
      weak: Picks strong consistency everywhere without understanding the cost.
    followups:
      - What user-visible bug might eventual consistency cause in a shopping cart?
      - How are conflicts handled when several regions accept writes?
    common_errors:
      - Assuming session consistency holds across different client sessions.

  - external_key: technical.cloud.managed_db_low_downtime_move
    competency_key: databases
    topic: Moving a database to a managed service
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You need to move a three terabyte on-premises PostgreSQL database to a managed cloud database with
      less than fifteen minutes of downtime. How would you plan it?
    expected_concepts:
      - full load followed by change data capture or logical replication
      - Database Migration Service or native tooling
      - extension and version compatibility checks
      - network bandwidth and initial load time
      - data validation before cutover
      - rehearsed cutover runbook with a rollback plan
    rubric:
      excellent: Uses initial load plus continuous replication, checks compatibility early, rehearses the cutover with timing, validates data and keeps a way back.
      good: Proposes replication-based migration with a planned cutover.
      weak: Plans a dump and restore during a short window that can't fit three terabytes.
    followups:
      - How would you fall back if problems appear an hour after cutover?
      - Which PostgreSQL features would you check for compatibility first?
    common_errors:
      - Not rehearsing the cutover, so its real duration is unknown.

  - external_key: technical.cloud.gcp_database_selection
    competency_key: gcp
    topic: Choosing among GCP databases
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      On GCP, how would you decide between Cloud SQL, AlloyDB, Spanner and Firestore for a new transactional
      system?
    expected_concepts:
      - single-primary scale limits of Cloud SQL
      - AlloyDB for PostgreSQL compatibility with higher performance
      - Spanner for horizontal scale with strong consistency
      - Firestore for document data and mobile or web clients
      - minimum cost and operational differences
      - schema and query model differences
    rubric:
      excellent: Matches each service to scale, consistency, compatibility and cost needs, and avoids paying for global scale the system doesn't need.
      good: Correctly positions Cloud SQL and Spanner and knows Firestore is a document store.
      weak: Chooses Spanner by default or cannot distinguish the services.
    followups:
      - What would make you migrate from Cloud SQL to Spanner later, and how painful would it be?
      - How do Spanner's primary keys affect hotspots?
    common_errors:
      - Using monotonically increasing primary keys in Spanner.

  - external_key: technical.cloud.container_platform_selection
    competency_key: system_design
    topic: Managed Kubernetes or a simpler container service
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you choose between a managed Kubernetes service and a simpler container platform like ECS,
      Cloud Run or Azure Container Apps for a team's new services?
    expected_concepts:
      - operational complexity and skills required
      - portability and ecosystem needs
      - scale to zero and request-based scaling
      - networking, service mesh or custom controller needs
      - cost of control planes and idle capacity
      - number of services and teams sharing the platform
    rubric:
      excellent: Weighs the team's skills and number of services against features they truly need, and describes when they would outgrow the simpler option.
      good: Gives clear pros and cons of each with a reasonable recommendation.
      weak: Picks Kubernetes by default without considering operational cost.
    followups:
      - What signals would tell you a team has outgrown the simpler platform?
      - What does it take to move from one to the other later?
    common_errors:
      - Underestimating the ongoing upgrade and add-on maintenance of Kubernetes.

  - external_key: technical.cloud.serverless_db_connection_storm
    competency_key: aws
    topic: Serverless functions exhausting database connections
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A Lambda function that writes to a relational database works in testing, but under load the database
      starts refusing connections. What's going on, and how would you fix it?
    expected_concepts:
      - each concurrent function instance opens its own connections
      - database connection limits
      - RDS Proxy or another connection pooler
      - reusing connections outside the handler
      - reserved concurrency to cap parallelism
      - buffering writes through a queue
    rubric:
      excellent: Explains how concurrency maps to connections, adds pooling through a proxy, caps concurrency and considers queue-based buffering, with metrics to confirm.
      good: Identifies connection exhaustion and suggests a proxy or connection reuse.
      weak: Increases the database size or connection limit only.
    followups:
      - What happens to requests when you cap the function's concurrency?
      - Would you still use a relational database for this workload?
    common_errors:
      - Opening a new connection on every invocation.

  - external_key: technical.cloud.vm_image_pipeline
    competency_key: aws
    topic: Golden VM images and fleet rollout
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you build and roll out machine images for VM fleets so that servers stay consistent and
      patching doesn't mean logging into boxes?
    expected_concepts:
      - an automated image pipeline such as Packer or EC2 Image Builder
      - versioned images with scanning and tests
      - rolling instance refresh in autoscaling groups
      - minimal configuration at boot
      - deprecating old images
      - replacing rather than patching instances in place
    rubric:
      excellent: Builds versioned, scanned images automatically, rolls them out by replacing instances gradually with health checks, and retires old images.
      good: Uses an image pipeline and replaces instances to patch.
      weak: Patches servers by hand or with ad hoc scripts on live instances.
    followups:
      - How would you roll back a bad image across the fleet?
      - What belongs in the image and what should be configured at boot?
    common_errors:
      - Baking secrets or environment-specific settings into the image.

  - external_key: technical.cloud.managed_db_major_upgrade
    competency_key: databases
    topic: Major version upgrade of a managed database
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your managed PostgreSQL version reaches end of support in three months, and the provider will force an
      upgrade after that. How would you plan the major version upgrade with minimal disruption?
    expected_concepts:
      - testing on a restored copy of production
      - extension and parameter compatibility
      - blue-green deployments or logical replication to the new version
      - performance regression checks on key queries
      - understanding the rollback options
      - scheduling before the forced date
    rubric:
      excellent: Tests on a production copy, checks compatibility and query performance, uses a blue-green or replication approach to cut downtime, and plans a realistic rollback.
      good: Tests the upgrade first and schedules it in a maintenance window.
      weak: Waits for the provider's forced upgrade or upgrades in place without testing.
    followups:
      - Why is rolling back a major version upgrade harder than rolling it forward?
      - What would you watch in the first day after the upgrade?
    common_errors:
      - Forgetting to refresh statistics after the upgrade and blaming the new version.

  - external_key: technical.cloud.event_fanout_design
    competency_key: distributed_systems
    topic: Fan-out with managed messaging
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you design fan-out so that one event, like an order being placed, reliably reaches several
      independent consumers using managed cloud messaging services?
    expected_concepts:
      - topic with a separate subscription or queue per consumer
      - SNS to SQS, EventBridge, Pub/Sub or Service Bus topics
      - independent retries and dead-letter handling per consumer
      - idempotent consumers
      - reliable publishing such as the outbox pattern
      - event schema versioning
    rubric:
      excellent: Gives each consumer its own queue with independent failure handling, makes publishing reliable and consumers idempotent, and plans for schema evolution.
      good: Uses a topic with multiple subscriptions and dead-letter queues.
      weak: Has the producer call each consumer directly or shares one queue between all consumers.
    followups:
      - How do you make sure the event is published if the database write succeeds but the publish fails?
      - How would you add a new consumer that needs past events?
    common_errors:
      - Several consumer types reading from one shared queue and stealing each other's messages.

  - external_key: technical.cloud.service_quota_failure
    competency_key: aws
    topic: Hitting a service quota in production
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A production deployment fails because you've hit a cloud service quota, such as the vCPU limit or the
      number of load balancers. How would you handle it right now, and how would you stop quotas surprising
      you again?
    expected_concepts:
      - identifying the exact quota from the error
      - requesting an increase and lead times
      - freeing capacity or shifting regions as a stopgap
      - monitoring usage against quotas with alerts
      - quota requests as part of capacity planning
      - managing quotas as code for new accounts
    rubric:
      excellent: Restores service quickly through an increase or temporary measure, then sets up monitoring and alerts on quota usage and builds quota checks into planning and account setup.
      good: Requests an increase and adds monitoring afterwards.
      weak: Retries the deployment hoping it works or doesn't know how to find the limit.
    followups:
      - Which quotas would you watch most closely for an autoscaled service?
      - How do API rate limits differ from resource quotas?
    common_errors:
      - Discovering quotas only during an incident or a launch.

  # ------------------------------------------------------------- advanced
  - external_key: technical.cloud.managed_vs_self_hosted_db
    competency_key: databases
    topic: Self-managed database versus a managed service
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team runs a large self-managed database cluster on VMs, and leadership asks whether moving to a
      managed service would be cheaper and safer. How would you evaluate it?
    expected_concepts:
      - total cost including engineering time, not just instance prices
      - feature, extension and version parity
      - performance limits and maximum instance sizes
      - built-in high availability, backups and patching
      - migration effort and risk
      - loss of low-level control and lock-in
    rubric:
      excellent: Builds a fair total cost comparison including people and risk, tests performance and compatibility on real workloads, and presents a recommendation with its conditions.
      good: Compares costs and features and identifies migration risks.
      weak: Compares instance prices only, or decides based on preference.
    followups:
      - What would make you recommend staying self-managed?
      - How would you test whether the managed service handles your peak load?
    common_errors:
      - Leaving engineering time and on-call load out of the cost comparison.

  - external_key: technical.cloud.file_ingestion_pipeline
    competency_key: system_design
    topic: Event-driven file processing pipeline
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Customers upload files that you need to validate, process and then notify them about, and uploads come
      in huge bursts at month end. How would you build that pipeline on a cloud provider of your choice?
    expected_concepts:
      - direct upload to object storage with pre-signed URLs
      - storage events feeding a queue rather than invoking processors directly
      - autoscaled workers or functions with concurrency limits
      - idempotent processing and retries with a dead-letter queue
      - tracking job status for notifications
      - protecting downstream systems from bursts
    rubric:
      excellent: Decouples upload, processing and notification with queues, makes processing idempotent with clear retry and failure handling, and controls concurrency so bursts don't overwhelm dependencies.
      good: Uses object storage events and a queue with workers.
      weak: Processes files synchronously inside the upload request.
    followups:
      - How do you handle a file that crashes the processor every time?
      - How would a customer see the status of their upload?
    common_errors:
      - Triggering functions directly from storage events with no buffer or concurrency control.

  - external_key: technical.cloud.small_objects_at_scale
    competency_key: aws
    topic: Billions of small objects in object storage
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team stores billions of small objects in S3, and listing and processing them has become slow and
      expensive. How would you rethink the design?
    expected_concepts:
      - per-request costs dominate for small objects
      - inventory reports instead of repeated listing
      - compacting small objects into larger files such as Parquet
      - event notifications instead of scanning
      - keeping metadata in a database or table format
      - lifecycle costs per object when changing tiers
    rubric:
      excellent: Identifies request and per-object overheads as the cost driver, replaces listing with inventories or events, and compacts data with a metadata index.
      good: Suggests batching objects and avoiding repeated listing.
      weak: Proposes more parallel listing or a bigger compute cluster.
    followups:
      - How would you migrate existing data without stopping current consumers?
      - What does a table format like Iceberg add here?
    common_errors:
      - Transitioning billions of tiny objects to a cheaper tier and paying more in transition fees.

  - external_key: technical.cloud.launch_capacity_readiness
    competency_key: aws
    topic: Securing capacity for a major launch
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Launch day needs ten times your normal compute in one region, and last time you hit insufficient
      capacity errors when scaling out. How do you prepare?
    expected_concepts:
      - on-demand capacity reservations for critical instance types
      - diversifying instance types and availability zones
      - raising quotas well in advance
      - load testing at target scale
      - pre-scaling instead of relying on reactive autoscaling
      - fallback plans such as another region or degraded features
    rubric:
      excellent: Secures capacity through reservations and flexible instance choices, pre-scales ahead of the peak, proves it with load tests and has a fallback if capacity still runs short.
      good: Reserves capacity and raises quotas before launch.
      weak: Relies on autoscaling to find capacity on the day.
    followups:
      - How do you avoid paying for reserved capacity long after launch?
      - What would you degrade first if you still ran short?
    common_errors:
      - Restricting the autoscaling group to a single instance type.

  - external_key: technical.cloud.database_capacity_modes
    competency_key: cloud_cost_optimization
    topic: Provisioned, on-demand and serverless database capacity
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you decide between provisioned capacity and on-demand or serverless modes for managed databases,
      such as DynamoDB on-demand, Aurora Serverless or Cosmos DB autoscale?
    expected_concepts:
      - predictability of the traffic pattern
      - cost crossover point between modes
      - scaling speed and limits of serverless modes
      - minimum capacity and idle costs
      - throttling risk during sudden spikes
      - reviewing the choice with real usage data
    rubric:
      excellent: Models cost against real traffic to find the crossover, explains scaling behaviour and throttling risk of each mode, and schedules a review once real usage is known.
      good: Knows on-demand suits unpredictable traffic and provisioned suits steady load.
      weak: Chooses serverless assuming it is always cheaper.
    followups:
      - How would you model the cost before launch with no traffic history?
      - What happens to a serverless database during a sudden tenfold spike?
    common_errors:
      - Ignoring minimum capacity charges for serverless databases.

  - external_key: technical.cloud.proprietary_service_tradeoff
    competency_key: system_design
    topic: Proprietary managed services versus portable options
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you decide between a provider's proprietary managed service and a portable open-source option
      for something like messaging or a database, and when is the lock-in worth accepting?
    expected_concepts:
      - speed of delivery and reduced operations from proprietary services
      - real cost of building portability layers
      - data gravity and egress costs as the real lock-in
      - open interfaces such as PostgreSQL wire protocol or Kafka APIs
      - exit plans for critical dependencies
      - business likelihood of ever switching provider
    rubric:
      excellent: Treats lock-in as a cost to weigh against speed and operations, recognises where it really lives such as data and skills, and gives examples of when each choice made sense.
      good: Gives balanced pros and cons and a sensible default.
      weak: Rejects all proprietary services on principle or ignores lock-in entirely.
    followups:
      - What would a realistic exit plan for a proprietary queue look like?
      - Where have you seen portability abstractions cost more than they saved?
    common_errors:
      - Building lowest-common-denominator abstractions that lose the managed benefits.

  - external_key: technical.cloud.serverless_growth_limits
    competency_key: distributed_systems
    topic: Serverless architectures at scale
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      What starts to break when a serverless architecture grows from a handful of functions to hundreds
      handling thousands of requests per second, and how would you design around those limits?
    expected_concepts:
      - account and regional concurrency limits and throttling
      - downstream systems overwhelmed by parallelism
      - retries amplifying failures
      - tracing and debugging across many functions
      - cold starts in tail latency
      - cost crossover with containers at steady load
    rubric:
      excellent: Names concrete scaling limits and failure modes, protects downstreams with queues and concurrency controls, invests in tracing, and knows when to move hot paths to containers.
      good: Identifies concurrency limits and downstream overload.
      weak: Believes serverless scales infinitely without side effects.
    followups:
      - How would you stop one noisy function from consuming the account's whole concurrency?
      - Which parts of the system would you move off functions first?
    common_errors:
      - Letting automatic retries multiply load during a downstream outage.
