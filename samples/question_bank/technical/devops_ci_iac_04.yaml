# Curated questions: DevOps CI/CD and infrastructure as code (part 4 of 4).
# Release strategies, progressive delivery, GitOps and safe schema changes.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [devops]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.devops_ci_iac.rollback_or_roll_forward
    competency_key: ci_cd
    topic: Rolling back versus rolling forward
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a release goes wrong in production, how do you decide whether to roll back or roll forward with
      a fix?
    expected_concepts:
      - restoring service first is usually the priority
      - rollback is fastest when the previous version is known good
      - schema or data changes can make rollback unsafe
      - roll forward when the fix is small, understood and quick to ship
      - having a tested, fast rollback path available
    rubric:
      excellent: Defaults to the fastest safe recovery, explains what makes rollback unsafe such as data changes, and describes when a quick fix forward is the better call, ideally with a real example.
      good: Prefers rollback for speed and knows when it might not work.
      weak: Always tries to debug and fix in production while users are affected.
    followups:
      - What would make rolling back impossible for a particular release?
    common_errors:
      - Never practising rollbacks, so the rollback path fails when it's finally needed.

  - external_key: technical.devops_ci_iac.feature_flags_release
    competency_key: ci_cd
    topic: Feature flags in the release process
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do feature flags change the way a team releases software, and what do you have to watch out for
      once a team starts using lots of them?
    expected_concepts:
      - separate deploying code from releasing features
      - gradual exposure to a percentage or group of users
      - instant kill switch without a redeploy
      - flag debt and cleaning up old flags
      - testing combinations of flag states
    rubric:
      excellent: Explains decoupling deploy from release with concrete use cases and addresses flag lifecycle, ownership, cleanup and testing complexity.
      good: Describes gradual rollout and quick disable through flags.
      weak: Sees flags only as configuration switches with no lifecycle concerns.
    followups:
      - How would you make sure old flags actually get removed?
    common_errors:
      - Leaving flags in the code for years, creating untested code paths.

  - external_key: technical.devops_ci_iac.gitops_explained
    competency_key: ci_cd
    topic: GitOps fundamentals
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you explain GitOps to a developer who has just joined your team, including what actually
      changes about how their code reaches production?
    expected_concepts:
      - Git as the source of truth for desired state
      - an in-cluster agent pulls and reconciles, such as Argo CD or Flux
      - deployments happen through pull requests to config
      - drift is detected and corrected automatically
      - rollback by reverting a commit
    rubric:
      excellent: Explains the pull-based reconciliation model clearly, describes the developer's day-to-day workflow and mentions benefits such as auditability and drift correction along with limits.
      good: Describes Git as source of truth with an agent syncing the cluster.
      weak: Describes it as just storing YAML in Git while the pipeline runs kubectl apply.
    followups:
      - How is this different from a pipeline that runs kubectl apply after merge?
    common_errors:
      - Confusing GitOps with simply keeping manifests in a repository.

  - external_key: technical.devops_ci_iac.manifest_packaging_choice
    competency_key: kubernetes
    topic: Helm, Kustomize or plain manifests
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you package Kubernetes manifests for several environments, how do you choose between Helm,
      Kustomize or plain manifests?
    expected_concepts:
      - Helm templating, packaging and release tracking
      - Kustomize overlays without templates
      - plain manifests for very simple cases
      - readability and reviewability of rendered output
      - consuming third-party charts versus writing your own
    rubric:
      excellent: Compares the tools on templating complexity, reviewability and distribution, gives a real choice they made and why, and reviews rendered output rather than templates alone.
      good: Knows what each tool does and picks one sensibly for a scenario.
      weak: Uses one tool for everything without being able to explain the alternatives.
    followups:
      - How would you review what a Helm chart change actually does to the cluster?
    common_errors:
      - Building deeply nested templates that nobody can read without rendering them.

  - external_key: technical.devops_ci_iac.canary_ambiguous_signal
    competency_key: ci_cd
    topic: Interpreting a canary with low traffic
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've sent five percent of traffic to a canary, and its error rate looks slightly higher than the
      stable version's, but the traffic volume is low. What do you do next?
    expected_concepts:
      - low volume makes small differences statistically unreliable
      - look at what the errors actually are
      - hold the rollout rather than promoting
      - wait for more traffic or increase sample carefully
      - compare against a baseline running the old version under equal conditions
    rubric:
      excellent: Recognises the sample-size problem, inspects the actual errors, pauses rather than promoting, and explains how to get a reliable comparison before deciding.
      good: Pauses the rollout and investigates the errors.
      weak: Promotes anyway because the difference is small, or rolls back without looking.
    followups:
      - Which signals besides error rate would you compare?
    common_errors:
      - Comparing the canary against the whole stable fleet when traffic mixes differ.

  - external_key: technical.devops_ci_iac.config_change_outage
    competency_key: ci_cd
    topic: Configuration changes as releases
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A deploy that changed nothing but a configuration value has just broken production. How would you
      treat configuration changes in future so they get the same safety as code changes?
    expected_concepts:
      - configuration versioned and reviewed like code
      - validation and schema checks before rollout
      - gradual rollout of config changes, not everywhere at once
      - fast rollback of configuration
      - monitoring tied to config change events
    rubric:
      excellent: Brings configuration through the same versioning, validation, staged rollout and rollback path as code, and marks config changes on dashboards to speed diagnosis.
      good: Adds review and validation for configuration and a rollback option.
      weak: Treats it as human error and simply tells people to be more careful.
    followups:
      - How would you validate a configuration change automatically before it ships?
    common_errors:
      - Pushing configuration to every region at once because it seems low risk.

  - external_key: technical.devops_ci_iac.blue_green_post_cutover
    competency_key: ci_cd
    topic: Errors after a blue/green cutover
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You're doing a blue/green deploy, you've just switched traffic to green, and a few minutes later
      support reports a spike in errors. Walk me through what you do.
    expected_concepts:
      - switch traffic back to blue, which should still be running
      - confirm errors drop after switching back
      - keep green running for investigation
      - consider shared state such as database changes that blue may not understand
      - only tear down blue after a bake period
    rubric:
      excellent: Switches back immediately, verifies recovery, keeps green for diagnosis, and checks whether shared state changes affect blue as well.
      good: Switches traffic back to blue and then investigates.
      weak: Starts debugging green while users keep hitting errors.
    followups:
      - Blue was already scaled down to save cost. What does that change?
    common_errors:
      - Decommissioning the old environment immediately after cutover, removing the instant rollback.

  # ------------------------------------------------------------------ medium
  - external_key: technical.devops_ci_iac.expand_contract_migration
    competency_key: ci_cd
    topic: Zero-downtime schema changes
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A release needs to rename a column in a busy production database while old and new versions of the
      application run side by side during the rollout. How would you get that through the pipeline safely?
    expected_concepts:
      - expand and contract over several releases
      - add the new column, write to both, backfill, switch reads, then drop the old one
      - migrations that are backward compatible with the running version
      - lock-safe migrations on large tables
      - migrations run as a separate, controlled pipeline step
    rubric:
      excellent: Lays out expand and contract across multiple deployments, keeps every step compatible with both app versions, handles backfill and locking on a large table and controls migration execution in the pipeline.
      good: Splits the rename into backward-compatible steps across releases.
      weak: Renames the column in one migration as part of the deploy.
    followups:
      - How would you backfill a billion rows without hurting production traffic?
    common_errors:
      - Running a migration that takes a long table lock during peak traffic.

  - external_key: technical.devops_ci_iac.automated_canary_analysis
    competency_key: ci_cd
    topic: Automating canary decisions
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you automate the decision to promote or abort a canary? Which signals would you compare,
      and how would you avoid false alarms?
    expected_concepts:
      - error rate, latency percentiles and saturation compared to a baseline
      - business or user-level metrics where possible
      - statistical comparison with minimum sample sizes
      - staged steps with bake times
      - automatic rollback on breach, with human override
    rubric:
      excellent: Compares canary to a concurrent baseline on technical and business metrics with statistical rigour, defines staged steps and bake times, and explains how thresholds are tuned to avoid noise.
      good: Defines metric thresholds that promote or roll back automatically.
      weak: Watches dashboards manually and decides by gut feeling.
    followups:
      - Your canary analysis rolls back healthy releases twice a week. What would you change?
    common_errors:
      - Using static thresholds that ignore normal daily variation in traffic.

  - external_key: technical.devops_ci_iac.gitops_emergency_changes
    competency_key: ci_cd
    topic: Emergency changes under GitOps
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      With Argo CD managing a cluster, an engineer hot-fixed a deployment with kubectl during an incident,
      and Argo keeps reverting it. How should the team handle emergency changes in a GitOps setup?
    expected_concepts:
      - make the emergency fix through Git with a fast-track review path
      - temporarily pausing auto-sync for a specific application, with a record
      - reconcile the manual change back into Git afterwards
      - RBAC limiting direct cluster write access
      - post-incident review of why Git was too slow
    rubric:
      excellent: Keeps Git as the source of truth with a fast emergency path, uses controlled sync pauses when truly needed, ensures changes are reconciled back and restricts direct access.
      good: Commits the fix to Git or pauses sync and records it.
      weak: Disables GitOps reconciliation permanently to allow manual changes.
    followups:
      - How would you make the Git path fast enough to use during an incident?
    common_errors:
      - Pausing auto-sync during an incident and forgetting to turn it back on.

  - external_key: technical.devops_ci_iac.gitops_repo_layout
    competency_key: ci_cd
    topic: Structuring GitOps repositories
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you structure Git repositories for GitOps, thinking about application code versus
      deployment configuration and how environments are represented?
    expected_concepts:
      - separate config repository or folder from application source
      - directories or overlays per environment rather than long-lived branches
      - CI updates image versions in config via commits or pull requests
      - ownership and access control per path
      - avoiding feedback loops between CI and config commits
    rubric:
      excellent: Separates source from deployment config, represents environments with folders or overlays, describes how CI updates versions and how access and ownership map onto the layout, with trade-offs.
      good: Proposes a config repository with per-environment folders.
      weak: Uses one branch per environment and merges between them.
    followups:
      - What problems come with using a branch per environment?
    common_errors:
      - Having CI commit to the same repository it triggers on, causing endless build loops.

  - external_key: technical.devops_ci_iac.gitops_environment_promotion
    competency_key: ci_cd
    topic: Promoting releases in GitOps
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a GitOps setup, how would you promote a new version from staging to production so that the
      promotion is gated, auditable and easy to reverse?
    expected_concepts:
      - promotion as a pull request changing the production version
      - automated checks that staging is healthy before promotion
      - approvals or policies on production paths
      - Git history as the audit trail
      - rollback by reverting the promotion commit
    rubric:
      excellent: Describes promotion as a gated change to config with automated health checks, approvals tied to ownership, a clear audit trail and simple reversal, possibly automated with a promotion tool.
      good: Promotes via a pull request to production config with review.
      weak: Engineers edit production manifests directly without any gate.
    followups:
      - How would you promote the same version across twenty clusters in waves?
    common_errors:
      - Promoting by tag rather than by digest, so production may get a different image than staging.

  - external_key: technical.devops_ci_iac.gitops_secret_handling
    competency_key: security
    topic: Secrets in a GitOps workflow
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team is moving to GitOps and asks how secrets fit in when everything is supposed to live in Git.
      What would you propose?
    expected_concepts:
      - never commit plaintext secrets
      - encrypted secrets in Git, such as Sealed Secrets or SOPS
      - references in Git to an external secret manager
      - key management and rotation for the encryption keys
      - trade-offs between encrypted-in-Git and reference-only approaches
    rubric:
      excellent: Compares encrypted-in-Git and reference-to-external-store approaches on rotation, recovery and access control, and recommends one with clear reasoning.
      good: Proposes one workable approach such as Sealed Secrets or an external secret operator.
      weak: Commits base64-encoded Kubernetes Secrets to the repository.
    followups:
      - The key used to decrypt your sealed secrets is lost. What happens?
    common_errors:
      - Forgetting to back up and rotate the decryption key for encrypted secrets.

  - external_key: technical.devops_ci_iac.silent_feature_breakage
    competency_key: ci_cd
    topic: Catching silent breakage after release
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A release passed every check, rolled out fully, and two hours later customers reported that a
      feature was quietly broken with no errors in the logs. How would you change your release process to
      catch this kind of problem sooner?
    expected_concepts:
      - business and user-journey metrics, not only error rates
      - synthetic checks of key user flows after deploy
      - gradual rollout with these signals as gates
      - feature flags to limit exposure
      - add a regression test for the specific failure
    rubric:
      excellent: Identifies the gap in what was measured, adds business-level signals and synthetic journeys, gates rollout on them and limits blast radius with progressive exposure.
      good: Adds monitoring of key user flows after deploys.
      weak: Only adds more unit tests for the specific bug.
    followups:
      - Which business metric would you watch for a checkout service, and how quickly does it react?
    common_errors:
      - Only alerting on HTTP 5xx errors, which miss wrong-but-successful responses.

  - external_key: technical.devops_ci_iac.delivery_performance_metrics
    competency_key: ci_cd
    topic: Measuring delivery performance
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you measure whether your organisation's delivery process is actually getting better, and
      what would you be careful about when sharing those numbers?
    expected_concepts:
      - deployment frequency and lead time for changes
      - change failure rate and time to restore service
      - collecting data automatically from pipelines and incidents
      - using metrics for team learning, not individual ranking
      - gaming risks when metrics become targets
    rubric:
      excellent: Uses speed and stability metrics together, explains how to collect them reliably and warns about gaming and misuse, focusing on trends and team-level improvement.
      good: Names the main delivery metrics and how to track them.
      weak: Measures only number of deploys or lines of code.
    followups:
      - A team's deploy frequency doubled but so did incidents. How would you read that?
    common_errors:
      - Comparing teams with very different systems against each other on the same metrics.

  - external_key: technical.devops_ci_iac.slow_upgrading_clients
    competency_key: ci_cd
    topic: Releasing APIs used by slow-updating clients
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your backend API is used by a mobile app that many people only update every few months. How does
      that change your release and rollback strategy for the backend?
    expected_concepts:
      - backward compatibility for older client versions
      - API versioning and deprecation windows
      - contract tests against supported client versions
      - server-side feature flags and minimum version enforcement
      - rollback must not break newer clients either
    rubric:
      excellent: Designs for long-lived compatibility with contract tests and versioning, controls exposure server-side and considers both old and new clients when rolling back.
      good: Keeps the API backward compatible and versions breaking changes.
      weak: Assumes all clients update at the same time as the backend.
    followups:
      - How would you know when it's safe to remove an old API version?
    common_errors:
      - Rolling back the backend and breaking clients that already use the newer API.

  - external_key: technical.devops_ci_iac.ring_based_rollout
    competency_key: ci_cd
    topic: Rollouts in rings or waves
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you stage a rollout across regions or customer groups, sometimes called rings or waves,
      and how do you decide how long each stage should bake?
    expected_concepts:
      - internal or low-risk ring first, largest or most critical last
      - bake time based on traffic patterns and how quickly problems surface
      - automated health gates between waves
      - stopping and rolling back a wave independently
      - balancing safety with the total rollout duration
    rubric:
      excellent: Orders rings by risk and representativeness, sets bake times from how long issues take to show, automates gates between waves and handles halting partway.
      good: Rolls out region by region with checks between stages.
      weak: Deploys everywhere at once and relies on monitoring afterwards.
    followups:
      - A bug only shows up under peak load, which only happens once a day. How does that affect your bake times?
    common_errors:
      - Choosing a first ring with too little traffic to reveal any problems.

  - external_key: technical.devops_ci_iac.helm_release_stuck
    competency_key: kubernetes
    topic: Recovering a stuck Helm release
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A helm upgrade failed partway through, and the release is now stuck in a pending state that blocks
      every further deploy from the pipeline. How would you recover, and how would you stop it happening
      again?
    expected_concepts:
      - inspect release history and status
      - roll back to the last deployed revision or clean up the pending release record
      - check what was actually applied to the cluster
      - atomic upgrades with timeouts and automatic rollback
      - pipelines that don't get killed mid-upgrade
    rubric:
      excellent: Inspects history, recovers with rollback or careful cleanup of the pending revision, checks real cluster state and adds atomic upgrades and proper timeouts in the pipeline.
      good: Rolls back the release and re-runs the deploy.
      weak: Uninstalls the release in production to get unblocked.
    followups:
      - Why might the pipeline have been killed mid-upgrade in the first place?
    common_errors:
      - Deleting Helm's release records without checking which resources were already changed.

  # ------------------------------------------------------------------ hard
  - external_key: technical.devops_ci_iac.progressive_delivery_platform
    competency_key: ci_cd
    topic: Progressive delivery as a platform capability
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you design a progressive delivery capability that every service team can use, covering
      canaries, automated analysis and rollback, without each team building its own?
    expected_concepts:
      - a standard controller such as Argo Rollouts or Flagger
      - traffic shifting through a service mesh or ingress
      - default analysis templates with per-service overrides
      - consistent metrics conventions across services
      - onboarding, documentation and gradual adoption
      - handling services that cannot canary, such as batch jobs
    rubric:
      excellent: Designs a shared, opinionated capability with traffic shifting, reusable analysis, metric standards and an adoption plan, and handles edge cases like stateful or non-HTTP workloads.
      good: Proposes a common rollout controller with shared templates.
      weak: Leaves every team to script its own canary logic.
    followups:
      - How would you handle services that don't expose the metrics your analysis needs?
    common_errors:
      - Assuming all workloads are HTTP services that can be split by traffic percentage.

  - external_key: technical.devops_ci_iac.cross_service_feature_release
    competency_key: ci_cd
    topic: Shipping a feature across several services
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A new feature needs coordinated changes in four services plus a schema change, owned by three
      different teams. How would you ship it without a big-bang release?
    expected_concepts:
      - backward-compatible changes deployable independently in any order
      - dependency order from data layer to consumers
      - feature flag to switch on the behaviour once everything is deployed
      - contract tests between services
      - a clear plan for who turns on what and how to turn it off
    rubric:
      excellent: Breaks the work into independently deployable, compatible steps, sequences by dependency, gates the user-facing change behind a flag and coordinates teams with a clear enable and disable plan.
      good: Uses backward-compatible changes and a feature flag to release.
      weak: Schedules all teams to deploy together at the same time.
    followups:
      - One team's service rolls back after the flag is on. What happens to the feature?
    common_errors:
      - Introducing a hidden ordering dependency between deployments.

  - external_key: technical.devops_ci_iac.gitops_at_scale
    competency_key: ci_cd
    topic: Scaling GitOps across many clusters
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your Argo CD instance now manages around three hundred applications across twenty clusters, and
      syncs have become slow and unreliable. How would you re-architect it?
    expected_concepts:
      - diagnose bottlenecks such as repo server, controller sharding and Git polling
      - controller sharding and resource limits
      - webhooks instead of frequent polling
      - instance per cluster or region versus central hub, with trade-offs
      - ApplicationSets and templating to reduce duplication
    rubric:
      excellent: Starts by measuring where time goes, scales the components that are bottlenecked, weighs hub-and-spoke against per-cluster instances and reduces configuration sprawl with generators.
      good: Shards the controller and switches to webhooks with some reasoning.
      weak: Only increases the size of the Argo CD pods.
    followups:
      - What failure modes come with a single central Argo CD managing every cluster?
    common_errors:
      - Rendering huge Helm charts repeatedly without caching, overloading the repo server.

  - external_key: technical.devops_ci_iac.stateful_cutover_strategy
    competency_key: ci_cd
    topic: Release strategies for stateful services
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Blue/green is straightforward for stateless services. How would you approach it, or an alternative,
      for a service that owns a large datastore or holds long-lived client connections?
    expected_concepts:
      - both environments sharing a datastore with compatible schemas
      - replicating data to the new environment and cutting over at a consistent point
      - draining long-lived connections gracefully
      - rolling or in-place upgrades as an alternative
      - rollback plan when data was written by the new version
    rubric:
      excellent: Explains why state complicates blue/green, compares shared-datastore, replication and rolling approaches, and addresses connection draining and data-aware rollback.
      good: Recognises the shared-data problem and proposes a workable approach.
      weak: Applies blue/green unchanged, duplicating the database without thinking about consistency.
    followups:
      - How would you cut over websocket clients without a reconnect storm?
    common_errors:
      - Assuming rollback is safe after the new version has written data in a new format.

  - external_key: technical.devops_ci_iac.irreversible_migration_bug
    competency_key: ci_cd
    topic: Bad release after an irreversible migration
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You've shipped a release that ran a data migration, the release turns out to have a serious bug, and
      the migration can't simply be reversed. What do you do, and how would you design to avoid being in
      that position again?
    expected_concepts:
      - stop the damage, for example by disabling the feature or writes
      - roll forward with a targeted fix when rollback isn't possible
      - restore or repair affected data from backups or audit logs
      - separate schema migrations from code releases
      - backward-compatible, reversible migrations and pre-migration backups
    rubric:
      excellent: Contains impact first, chooses a credible roll-forward and data repair plan, and redesigns the process so migrations are decoupled, backward compatible and tested for rollback.
      good: Fixes forward and repairs data, then suggests safer migration practices.
      weak: Attempts an untested restore of the whole database without weighing data loss.
    followups:
      - How would you test that a release can be rolled back before you ship it?
    common_errors:
      - Restoring a full backup and losing every transaction written since it was taken.

  - external_key: technical.devops_ci_iac.untested_branch_deployed
    competency_key: ci_cd
    topic: Pipeline deployed an untested branch
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A misconfigured pipeline deployed an untested feature branch straight to production. After restoring
      service, how would you investigate it and what controls would you put in place?
    expected_concepts:
      - blameless review of how the trigger or condition was misconfigured
      - why review of the pipeline change didn't catch it
      - production deploys only from protected branches and approved artifacts
      - environment protection rules and deployment approvals
      - verify provenance of what is deployed at admission or deploy time
    rubric:
      excellent: Runs a blameless investigation into both the misconfiguration and the missing safeguards, then adds layered controls such as protected environments, artifact provenance checks and policy on pipeline changes.
      good: Fixes the pipeline condition and adds branch protection for production deploys.
      weak: Blames the engineer who changed the pipeline and adds a manual checklist.
    followups:
      - How would you make sure only artifacts built from main can ever reach production?
    common_errors:
      - Relying on a single pipeline condition as the only barrier to production.

  - external_key: technical.devops_ci_iac.deploy_safety_controls
    competency_key: ci_cd
    topic: Change freezes and deployment guardrails
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you design deployment guardrails like change freezes, deploy windows and automatic halts,
      so they actually reduce risk instead of just pushing changes into large, risky batches?
    expected_concepts:
      - freezes create batches that are riskier when they end
      - risk-based controls instead of blanket bans
      - automatic halts when error budgets or alerts fire
      - allowing low-risk and urgent fixes through during freezes
      - measuring the effect of controls on failure rates
    rubric:
      excellent: Explains how blanket freezes backfire, designs risk-aware automated guardrails tied to system health and error budgets, with exceptions for urgent fixes and evidence that the controls work.
      good: Proposes automated halts on alerts and limited, well-defined freezes.
      weak: Recommends longer freezes and fewer deploys as the main safety measure.
    followups:
      - How would you handle the backlog of changes waiting when a holiday freeze ends?
    common_errors:
      - Treating every change as equally risky regardless of size or component.
