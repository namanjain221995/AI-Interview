# LLM application engineering, part 2: prompt design, sampling, tool use, agents, context management
# and long-document workflows.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [llm]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.llm_engineering.system_prompt_structure
    competency_key: llm_engineering
    topic: Structuring a production system prompt
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you structure a system prompt for a feature that's going to production? Talk me through the parts you
      usually include and why each one is there.
    expected_concepts:
      - role and task definition
      - explicit rules and constraints with priorities
      - output format specification
      - clear separation of instructions from untrusted input
      - examples of good and bad outputs
      - guidance for unclear or out-of-scope requests
    rubric:
      excellent: Describes a deliberate structure from a real feature, separates instructions from user and retrieved content with delimiters, specifies format and fallback behaviour, and explains how each part was validated.
      good: Covers role, rules and output format with sensible reasoning.
      weak: Writes one paragraph of instructions and adjusts by trial and error without any structure.
    followups:
      - How do you keep a system prompt maintainable as rules pile up?
      - What goes in the system prompt versus the user message?
    common_errors:
      - Mixing user-provided text into the instructions without delimiters.

  - external_key: technical.llm_engineering.few_shot_selection
    competency_key: llm_engineering
    topic: Choosing few-shot examples
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When do you add few-shot examples to a prompt, and how do you choose them so they help instead of steering the
      model the wrong way?
    expected_concepts:
      - examples teach format and edge cases better than description
      - diverse examples covering different input types
      - models copying surface features of examples
      - dynamically selected examples similar to the input
      - token cost of examples
    rubric:
      excellent: Explains when examples beat instructions, chooses diverse and representative examples, watches for the model copying content or label balance, and considers retrieving examples per input with cost in mind.
      good: Uses a few varied examples and knows they can bias outputs.
      weak: Adds examples without considering how they shape outputs or what they cost.
    followups:
      - What happens if all your examples have the same label?
      - How would you test whether the examples are helping at all?
    common_errors:
      - Using examples so similar to each other that the model copies their wording into every answer.

  - external_key: technical.llm_engineering.sampling_settings
    competency_key: llm_engineering
    topic: Temperature and sampling settings
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide on temperature and other sampling settings for different tasks — say, extracting fields
      from an invoice versus brainstorming product names? Tell me what you've seen go wrong.
    expected_concepts:
      - low temperature for extraction and classification
      - higher temperature for diverse creative output
      - top-p and top-k as alternative controls
      - low temperature does not guarantee correctness
      - testing settings against an evaluation set
    rubric:
      excellent: Matches settings to the task with reasons, understands what temperature and top-p do to the distribution, notes that low temperature does not fix wrong answers, and tunes settings with evaluation.
      good: Uses low temperature for factual tasks and higher for creative ones.
      weak: Leaves defaults everywhere or believes temperature zero makes outputs correct.
    followups:
      - When might you sample several outputs and pick one?
      - Why might temperature zero still produce repetitive or looping text?
    common_errors:
      - Treating temperature zero as a fix for factual errors.

  - external_key: technical.llm_engineering.prompt_version_management
    competency_key: llm_engineering
    topic: Managing and versioning prompts
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your team edits prompts directly in the code, and nobody can tell which change broke last week's behaviour.
      How would you set up prompt management going forward?
    expected_concepts:
      - prompts versioned alongside model and parameters
      - logging the prompt version with every request
      - review and evaluation before a prompt change ships
      - ability to roll back a prompt independently
      - changelog linking changes to evaluation results
    rubric:
      excellent: Versions prompts together with model and settings, logs the version per request, gates changes on evaluation and supports quick rollback, with a concrete example of tooling.
      good: Puts prompts under version control and logs which version served a request.
      weak: Suggests being more careful when editing prompts.
    followups:
      - Would you let non-engineers edit prompts, and how would you keep that safe?
      - How would you compare two versions on live traffic?
    common_errors:
      - Versioning the prompt text but not the model and sampling settings it was tested with.

  - external_key: technical.llm_engineering.token_budgeting
    competency_key: llm_engineering
    topic: Tokens, context limits and budgets
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Explain how tokens relate to context limits and cost, and how you'd work out whether a new feature fits within a
      model's budget.
    expected_concepts:
      - tokenization varies by language and content type
      - context window shared by input and output
      - input and output tokens priced differently
      - measuring real token counts with the model's tokenizer
      - reserving room for retrieved context and history growth
    rubric:
      excellent: Explains that input and output share the window, measures token counts with the real tokenizer on representative inputs, budgets each prompt section and estimates cost per request.
      good: Knows tokens are not words, that the window covers input and output, and that cost scales with tokens.
      weak: Estimates by word count only or ignores output tokens.
    followups:
      - Why might the same text cost more tokens in another language?
      - What would you cut first when a prompt exceeds the budget?
    common_errors:
      - Forgetting to reserve space for the model's output within the context window.

  - external_key: technical.llm_engineering.ignored_prompt_rule
    competency_key: llm_engineering
    topic: Debugging an ignored instruction
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A model keeps breaking one of the rules in your prompt — for example, it still recommends competitor products
      even though you told it not to. How would you debug and fix that?
    expected_concepts:
      - reproducing with a set of failing inputs
      - conflicting or buried instructions
      - stating the rule positively and specifically with examples
      - checking whether retrieved content pushes against the rule
      - adding a deterministic output check as a backstop
    rubric:
      excellent: Collects failing cases, looks for conflicts and placement problems, rewrites the rule specifically, checks whether context pulls the other way, adds a post-generation check and measures the fix.
      good: Rewrites or repositions the rule and tests on the failing examples.
      weak: Adds capital letters or repeats the rule several times and declares it fixed.
    followups:
      - How would you know the fix didn't break something else?
      - When would you stop relying on the prompt and enforce it in code?
    common_errors:
      - Validating the fix on the one example that was reported instead of a set of cases.

  - external_key: technical.llm_engineering.tool_schema_design
    competency_key: llm_engineering
    topic: Designing tools for function calling
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you give a model tools to call, how do you write the tool names, descriptions and parameters so that it
      picks the right tool and fills in the arguments correctly?
    expected_concepts:
      - clear distinct names and descriptions of when to use each tool
      - typed parameters with enums and constraints
      - small number of focused tools
      - documenting units, formats and examples
      - helpful error messages returned to the model
    rubric:
      excellent: Writes descriptions that say when and when not to use a tool, constrains parameters with types and enums, keeps the tool set small and distinct, and returns error messages the model can act on.
      good: Gives clear descriptions and typed parameters.
      weak: Exposes raw internal APIs with vague names and expects the model to figure them out.
    followups:
      - What would you do if two tools overlap and the model keeps picking the wrong one?
      - How many tools is too many for one prompt?
    common_errors:
      - Exposing many near-identical tools whose descriptions don't explain the difference.

  # ------------------------------------------------------------------ medium
  - external_key: technical.llm_engineering.step_by_step_reasoning_cost
    competency_key: llm_engineering
    topic: Step-by-step reasoning trade-offs
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When does asking a model to reason step by step actually help, and what does it cost you in latency, tokens and
      in how you handle the reasoning text afterwards?
    expected_concepts:
      - helps multi-step logic, maths and planning
      - little benefit for simple lookup or classification
      - extra output tokens increase latency and cost
      - separating reasoning from the final answer for parsing
      - reasoning text may be wrong or should not be shown to users
    rubric:
      excellent: Identifies task types that benefit, measures the quality gain against added latency and tokens, separates reasoning from the answer and decides deliberately whether users see it.
      good: Knows it helps complex tasks and adds tokens and latency.
      weak: Adds step-by-step instructions everywhere by default without measuring the effect.
    followups:
      - How would you get the benefit of reasoning in a latency-sensitive product?
      - Can you trust the reasoning text as an explanation of the answer?
    common_errors:
      - Parsing the final answer from free text that mixes reasoning and output.

  - external_key: technical.llm_engineering.splitting_monolithic_prompt
    competency_key: llm_engineering
    topic: Decomposing a monolithic prompt
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You have one giant prompt that classifies a support ticket, extracts fields from it and drafts a reply, and the
      quality of all three is mediocre. How would you think about splitting it up?
    expected_concepts:
      - separate steps with focused prompts
      - choosing smaller models for simple steps
      - passing structured outputs between steps
      - evaluating each step independently
      - latency and cost of extra calls, with parallelism where possible
    rubric:
      excellent: Splits into focused steps with structured handoffs, evaluates each step, picks models per step and weighs added latency against quality, running independent steps in parallel.
      good: Proposes separate prompts per task and testing each.
      weak: Keeps one prompt and adds more instructions.
    followups:
      - How do errors in the first step propagate to the reply?
      - When would you keep tasks together in one call?
    common_errors:
      - Splitting into steps but only measuring the final reply.

  - external_key: technical.llm_engineering.tool_argument_errors
    competency_key: llm_engineering
    topic: Reducing bad tool calls
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your assistant calls an internal booking API with wrong or missing arguments about five percent of the time.
      How would you bring that down, and what should happen at runtime when a call fails?
    expected_concepts:
      - analysing failed calls by error type
      - stricter schemas, enums and server-side validation
      - returning actionable errors so the model can retry
      - bounded retries
      - asking the user for missing information
      - evaluation set of tool-use cases
    rubric:
      excellent: Categorises failures from logs, tightens schemas and descriptions, validates server-side, feeds clear errors back for a bounded retry, asks the user when information is missing and tracks the rate on a test set.
      good: Validates arguments and retries with the error message.
      weak: Retries the same call blindly or only rewrites the prompt.
    followups:
      - Which of these failures are dangerous rather than just annoying?
      - How would you test tool use before each release?
    common_errors:
      - Letting the model guess required values the user never provided.

  - external_key: technical.llm_engineering.agent_loop_limits
    competency_key: llm_engineering
    topic: Bounding agent loops
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      If you build an agent that loops — reason, call a tool, look at the result, repeat — how do you stop it from
      running forever or burning through your budget?
    expected_concepts:
      - maximum steps, tokens, time and cost limits
      - detecting repeated identical actions
      - clear completion criteria and a final-answer tool
      - graceful exit with partial results
      - tracing each step for debugging
    rubric:
      excellent: Combines hard limits on steps, time and cost with loop detection and explicit stop conditions, returns partial results gracefully and traces every step.
      good: Sets a maximum iteration count and some cost limit.
      weak: Relies on the model to decide when to stop.
    followups:
      - What should the user see when the agent hits its limit?
      - How would you choose sensible limits?
    common_errors:
      - Counting steps but not tokens, so a few huge steps still blow the budget.

  - external_key: technical.llm_engineering.conversation_memory
    competency_key: llm_engineering
    topic: Managing long conversation history
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you manage conversation history in a long-running chat so it stays within the context window without
      losing facts the user mentioned earlier?
    expected_concepts:
      - sliding window of recent turns
      - rolling summaries of older turns
      - extracting durable facts into structured memory
      - retrieving relevant past turns on demand
      - testing recall of early facts in long conversations
    rubric:
      excellent: Combines recent turns, summaries and extracted facts or retrieval over history, explains what each loses, and tests recall of early details in long conversations.
      good: Uses a window plus summarization of older turns.
      weak: Truncates history from the start without thinking about what is lost.
    followups:
      - How would you stop errors in a summary from becoming permanent?
      - What would you keep across separate sessions, and what would you need the user's agreement for?
    common_errors:
      - Summarizing repeatedly until early details are silently lost.

  - external_key: technical.llm_engineering.context_ordering
    competency_key: llm_engineering
    topic: Placement and ordering of context
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How does the position of information inside a long prompt affect whether the model uses it, and how does that
      change how you order retrieved passages and instructions?
    expected_concepts:
      - models attend better to the beginning and end
      - information in the middle being missed
      - placing the most relevant passages at the edges
      - restating the question after long context
      - testing with planted facts at different positions
    rubric:
      excellent: Explains the position effect, orders passages and instructions deliberately, restates the task after the context, and verifies with position tests on their own model.
      good: Knows the middle of long prompts is used less and orders by relevance.
      weak: Assumes order does not matter.
    followups:
      - How would you test this on your own model rather than trusting papers?
      - Would you rather send fewer passages or reorder them?
    common_errors:
      - Placing the user's question before many pages of context and never repeating it.

  - external_key: technical.llm_engineering.output_nondeterminism
    competency_key: llm_engineering
    topic: Non-deterministic outputs
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Product wants the same input to always produce the same output, but even at temperature zero you see different
      answers between runs. Why does that happen, and what can you realistically offer them?
    expected_concepts:
      - floating-point and batching effects on inference
      - provider-side model updates
      - seed parameters and their limits
      - caching responses for identical inputs
      - designing for consistency of meaning rather than exact text
    rubric:
      excellent: Explains numerical and batching sources of variation and provider updates, offers pinned versions, seeds, response caching and structured outputs, and reframes the requirement around consistent decisions.
      good: Knows outputs can vary at temperature zero and suggests caching or pinning.
      weak: Promises determinism by setting temperature to zero.
    followups:
      - How would you measure how inconsistent the outputs actually are?
      - Which parts of the product truly need identical output?
    common_errors:
      - Promising exact reproducibility from a hosted model.

  - external_key: technical.llm_engineering.prompt_portability
    competency_key: llm_engineering
    topic: Moving prompts between model families
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You need to move a feature from one model provider to another, and all your prompts were tuned for the first
      model. How would you approach the migration?
    expected_concepts:
      - running the existing evaluation set on the new model first
      - differences in prompt formats, tool-calling and system prompt handling
      - re-tuning prompts for the new model
      - comparing quality, latency and cost
      - gradual rollout with fallback
    rubric:
      excellent: Starts with a baseline evaluation, adapts prompts and tool definitions to the new model's conventions, compares quality, latency and cost by category, and rolls out gradually with a fallback.
      good: Re-runs evaluations and adjusts prompts where results drop.
      weak: Swaps the model name and ships.
    followups:
      - How would you keep prompts portable in future?
      - What if the new model is better overall but worse on one critical category?
    common_errors:
      - Comparing only average scores and missing a category that regressed badly.

  - external_key: technical.llm_engineering.llm_classifier_design
    competency_key: llm_engineering
    topic: Using an LLM as a classifier
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you use an LLM as a classifier — say for routing incoming requests — how do you design the label set,
      the prompt and the output so you can measure and trust the results?
    expected_concepts:
      - mutually exclusive, well-defined labels with an other category
      - constrained output to the label set
      - labelled test set with precision and recall per class
      - confusion analysis between similar labels
      - comparison with a cheaper classical classifier
    rubric:
      excellent: Defines clear labels with an explicit fallback, constrains output, measures per-class precision and recall on a labelled set, studies confusions and compares against a simpler baseline.
      good: Constrains output to labels and measures accuracy on a test set.
      weak: Lets the model answer in free text and eyeballs results.
    followups:
      - How would you get a usable certainty signal out of the classifier?
      - When would you replace it with a small trained model?
    common_errors:
      - Reporting overall accuracy when one class dominates the data.

  - external_key: technical.llm_engineering.long_contract_extraction
    competency_key: llm_engineering
    topic: Field extraction from long documents
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You need to extract about forty fields from contracts that are sometimes two hundred pages long. How would you
      design that pipeline so the results are accurate and checkable?
    expected_concepts:
      - locating relevant sections before extraction
      - grouping related fields per call
      - schema-constrained output with nulls for missing fields
      - recording the source page or span for each value
      - field-level evaluation and human review for low-certainty fields
    rubric:
      excellent: Locates relevant sections, groups fields, uses a schema with explicit missing values, records evidence spans, evaluates per field and routes uncertain fields to review.
      good: Splits the document and extracts with a schema, with some evaluation.
      weak: Sends the whole document with all forty fields in one prompt and trusts the output.
    followups:
      - How would you handle a field whose value is amended in a later section?
      - Which metric would you use per field?
    common_errors:
      - Not distinguishing a missing field from one the model failed to find.

  - external_key: technical.llm_engineering.multilingual_quality
    competency_key: llm_engineering
    topic: Quality across languages
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your assistant launches in Spanish, Hindi and Japanese, and quality drops noticeably compared with English. How
      would you investigate and improve it?
    expected_concepts:
      - per-language evaluation sets reviewed by fluent speakers
      - checking retrieval and embeddings per language
      - tokenization cost and context budget differences
      - cross-lingual retrieval or translation strategies
      - prompting in the user's language versus English
    rubric:
      excellent: Builds per-language evaluation, separates retrieval from generation problems, checks embedding coverage and tokenization cost, and compares strategies such as cross-lingual retrieval or translation with measured results.
      good: Creates per-language test sets and checks whether retrieval is the weak point.
      weak: Translates everything to English without measuring whether it helps.
    followups:
      - How would you handle documents that exist only in English?
      - What would you check in the tokenizer for each language?
    common_errors:
      - Using machine-translated English test sets as the only evaluation for other languages.

  - external_key: technical.llm_engineering.long_document_summarization
    competency_key: llm_engineering
    topic: Summarizing beyond the context window
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you summarize documents that are far longer than the model's context window, and how would you check
      that the summary doesn't drop or invent important points?
    expected_concepts:
      - map-reduce or hierarchical summarization
      - refine-style sequential summarization
      - preserving key entities, numbers and dates across stages
      - checking summary claims against the source
      - coverage evaluation using reference key points
    rubric:
      excellent: Chooses a hierarchical or refine approach with reasons, protects numbers and entities across stages, verifies claims against the source and measures coverage of key points.
      good: Describes chunked summarization and some form of checking.
      weak: Truncates the document to fit, or has no way to check the result.
    followups:
      - How do errors compound across levels of a hierarchical summary?
      - How would the approach change if the reader needs a decision rather than a summary?
    common_errors:
      - Losing exact figures because each stage paraphrases the previous one.

  # ------------------------------------------------------------------ hard
  - external_key: technical.llm_engineering.multi_agent_tradeoffs
    competency_key: llm_engineering
    topic: Multi-agent versus single-agent designs
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      When is a multi-agent design actually worth it compared with a single model calling tools? Give me an example
      where you'd choose each, and what you'd measure to justify the choice.
    expected_concepts:
      - parallelizable independent subtasks
      - context isolation for specialized roles
      - coordination overhead and error propagation
      - higher cost and latency
      - debugging and tracing difficulty
      - comparing against a single-agent baseline
    rubric:
      excellent: Gives concrete cases for each design, explains coordination costs and failure propagation, and proposes measuring quality, cost and latency against a single-agent baseline.
      good: Sees parallelism and specialization benefits and the added complexity.
      weak: Assumes more agents always produce better results.
    followups:
      - How would you trace a failure across several cooperating agents?
      - How do agents share state without contradicting each other?
    common_errors:
      - Never building the simpler single-agent baseline to compare against.

  - external_key: technical.llm_engineering.agent_trajectory_evaluation
    competency_key: llm_engineering
    topic: Evaluating multi-step agents
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you evaluate an agent that takes many steps and calls tools, when there are lots of valid paths to the
      right outcome?
    expected_concepts:
      - outcome-based checks on final state
      - trajectory checks for forbidden or wasteful actions
      - sandboxed or simulated tool environments
      - repeated runs to measure success rate variance
      - cost, steps and latency as metrics
    rubric:
      excellent: Evaluates final outcomes in a reproducible sandbox, adds trajectory checks for unsafe or wasteful actions, runs each task several times to measure reliability and tracks cost and steps.
      good: Checks final outcomes and some properties of the steps taken.
      weak: Compares the agent's steps to one fixed expected sequence.
    followups:
      - How would you build realistic tool environments without hitting production systems?
      - How many runs per task do you need for a stable success rate?
    common_errors:
      - Running each task once and treating a lucky success as reliable.

  - external_key: technical.llm_engineering.overfit_prompt_tuning
    competency_key: llm_engineering
    topic: Overfitting prompts to an evaluation set
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team has tuned a prompt for weeks against a two-hundred-example evaluation set, and scores keep climbing,
      but users aren't noticing any improvement. What might be happening, and what would you change?
    expected_concepts:
      - overfitting to a small fixed evaluation set
      - evaluation set no longer representative of traffic
      - held-out set used rarely
      - refreshing evaluation data from production samples
      - connecting offline scores to online metrics
    rubric:
      excellent: Diagnoses overfitting and distribution mismatch, introduces a held-out set and refreshed production samples, checks score noise, and ties offline metrics to online outcomes.
      good: Recognises overfitting to the evaluation set and suggests new data.
      weak: Keeps tuning on the same set or concludes users are wrong.
    followups:
      - How would you tell real gains from run-to-run noise?
      - How often should the evaluation set change?
    common_errors:
      - Adding every failing production example to the same set used for tuning and reporting.

  - external_key: technical.llm_engineering.agent_tool_permissions
    competency_key: llm_engineering
    topic: Containing high-impact agent actions
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're giving an agent the ability to change customer records and issue refunds. How would you design its tool
      layer so that mistakes and misuse are contained?
    expected_concepts:
      - least-privilege, narrowly scoped tools
      - server-side business rule limits independent of the model
      - human approval for high-impact actions
      - idempotency and reversibility
      - audit logging of every action with its reasoning context
      - rate limits and anomaly alerts
    rubric:
      excellent: Designs narrow tools with server-enforced limits, approval steps for risky actions, idempotent and reversible operations, full audit trails and monitoring, and assumes the model can be manipulated.
      good: Limits permissions and adds human approval for refunds.
      weak: Gives the agent broad API access and relies on the prompt to prevent misuse.
    followups:
      - Which limits must live in the backend rather than the prompt?
      - How would you detect a slow pattern of small abusive refunds?
    common_errors:
      - Enforcing refund limits only through instructions to the model.

  - external_key: technical.llm_engineering.constrained_decoding_internals
    competency_key: llm_engineering
    topic: How constrained decoding works
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How does grammar- or schema-constrained decoding work under the hood, and what problems can it create for
      output quality or performance?
    expected_concepts:
      - masking invalid tokens at each decoding step
      - compiling a schema or grammar into a state machine
      - token boundaries not aligning with grammar symbols
      - forcing the model down low-probability paths
      - field order affecting quality, such as reasoning before answer
      - compile and per-token overhead
    rubric:
      excellent: Explains token masking driven by a compiled grammar, token-boundary issues, how forced low-probability tokens can degrade content, effects of field order and the performance costs.
      good: Knows invalid tokens are masked so output always parses.
      weak: Thinks it is the same as asking for JSON in the prompt.
    followups:
      - Why might valid JSON still contain wrong values?
      - How would you design a schema to reduce the quality cost?
    common_errors:
      - Assuming syntactically valid output means semantically correct output.

  - external_key: technical.llm_engineering.long_running_agent_state
    competency_key: llm_engineering
    topic: State for long-running agents
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      An agent that runs for an hour on a data migration task forgets earlier decisions and redoes work it has
      already finished. How would you redesign its state and memory?
    expected_concepts:
      - explicit external task state such as a plan and checklist
      - durable checkpoints outside the context window
      - summarizing completed steps with their results
      - idempotent steps that can be safely resumed
      - context compaction strategy
    rubric:
      excellent: Moves task state into an explicit durable store the agent reads and updates, checkpoints progress, compacts context with structured summaries, and makes steps idempotent so resuming is safe.
      good: Keeps a written plan or progress log outside the conversation.
      weak: Increases the context window and hopes it remembers.
    followups:
      - How would you resume after the process crashes halfway?
      - How would you stop a stale summary from misleading the agent?
    common_errors:
      - Storing progress only in the conversation context.
