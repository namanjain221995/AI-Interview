# Platform engineering (1/4): platform foundations, golden paths, templates, service catalog,
# self-service infrastructure and platform API design.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [platform]
questions:
  # ------------------------------------------------------------ platform foundations
  - external_key: technical.platform.idp_problem_statement
    competency_key: system_design
    topic: What an internal developer platform is for
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      People use the phrase internal developer platform in very different ways. What does it mean to you,
      and what problem was the platform you most recently worked on actually trying to solve?
    expected_concepts:
      - a curated, self-service layer over infrastructure and tooling
      - reducing cognitive load and ticket-driven waiting for product teams
      - consistency of security, deployment and observability practices
      - concrete capabilities such as deploys, environments, databases or secrets
      - the platform has users and is run like a product
    rubric:
      excellent: Gives a crisp definition grounded in a real platform, names the specific friction it removed for developers and the capabilities it offered, and separates the platform from the tools underneath it.
      good: Describes a self-service layer with a couple of real capabilities and a reasonable motivation.
      weak: Equates the platform with a single tool such as Kubernetes or a portal, or cannot say what problem it solved.
    followups:
      - Who were the users, and how did you know it was helping them?
      - What did the platform deliberately not do?
    common_errors:
      - Describing a list of tools with no statement of the developer problem.

  - external_key: technical.platform.first_capability_priority
    competency_key: product_sense
    topic: Deciding what the platform builds first
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Leadership has just funded a small platform team and asked you to lead the technical direction.
      Twenty product teams all have opinions about what you should build. How would you decide what the
      platform delivers in its first quarter?
    expected_concepts:
      - discovery with developers (interviews, ticket analysis, shadowing a deploy)
      - quantifying pain such as wait time, toil hours or incident causes
      - picking a thin vertical slice with visible value
      - finding early adopter teams to co-build with
      - defining success measures before building
    rubric:
      excellent: Grounds prioritisation in evidence gathered from developers and existing tickets, picks a narrow high-leverage capability, recruits early adopter teams and states up front how success will be measured.
      good: Talks to teams and picks the most common pain point, with some idea of how to measure progress.
      weak: Picks a technology to roll out (a portal, a service mesh) without any discovery or success criteria.
    followups:
      - Two loud teams want opposite things. How do you break the tie?
      - What would make you stop and change direction after six weeks?
    common_errors:
      - Starting with a developer portal because it is visible rather than because it removes the biggest pain.

  # ------------------------------------------------------------ golden paths
  - external_key: technical.platform.golden_path_contents
    competency_key: ci_cd
    topic: What a golden path contains
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Imagine explaining the idea of a golden path to an engineer who just joined. Using one you've built or
      relied on, what does it actually include from an empty repository through to running in production?
    expected_concepts:
      - an opinionated, supported default rather than a mandate
      - repository scaffold with build, test and lint wired in
      - a ready-made pipeline and deployment target
      - logging, metrics, tracing and alerts preconfigured
      - security defaults such as secrets handling and image scanning
      - documentation for the path
    rubric:
      excellent: Walks end to end through a concrete path (scaffold, pipeline, deploy, observability, security defaults, docs) and explains why it is supported and opinionated rather than enforced.
      good: Describes a template plus pipeline and deployment with a real example.
      weak: Defines it only as a document of recommended tools, or describes something that stops at repository creation.
    followups:
      - Which part of that path saved developers the most time?
      - What did teams most often change after scaffolding, and what did that tell you?
    common_errors:
      - Treating a wiki page of best practices as a golden path.

  - external_key: technical.platform.golden_path_optional_vs_mandatory
    competency_key: system_design
    topic: Paved road adoption without mandates
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some organisations make the golden path mandatory and others keep it optional and try to make it the
      easiest choice. Where do you land on that, and how do you keep the paved road attractive enough that
      teams choose it?
    expected_concepts:
      - mandating only true non-negotiables such as security and compliance controls
      - making the supported path faster than the alternative
      - clear support boundaries for teams who leave the path
      - measuring adoption and the reasons teams opt out
      - feeding off-path needs back into the roadmap
    rubric:
      excellent: Separates the small set of enforced controls from the opinionated defaults, explains how speed and support make the path win on merit, and uses opt-out reasons as product feedback.
      good: Prefers an optional path with a few mandatory controls and gives some ways to drive adoption.
      weak: Picks one extreme without trade-offs, for example forcing every team onto one stack with no exceptions.
    followups:
      - Which controls would you enforce even for teams that leave the path?
      - How would you notice the path is falling behind what teams need?
    common_errors:
      - Assuming adoption numbers alone prove the path is good when it was mandated.

  - external_key: technical.platform.off_path_language_request
    competency_key: system_design
    topic: Team wants to leave the golden path
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your golden path supports Java and Go. A data team wants to ship a production service in Rust and asks
      the platform team to support it. How would you handle that request?
    expected_concepts:
      - understanding the underlying need and expected scale of usage
      - what the platform guarantees for unsupported stacks (deploy, observability, security baseline)
      - cost of adding a stack to the supported set
      - a bring-your-own path with clear ownership on the requesting team
      - criteria for promoting a stack to fully supported
    rubric:
      excellent: Probes the real need, offers a bring-your-own route that still meets the platform's baseline contract, makes ownership explicit and has objective criteria for when a stack becomes officially supported.
      good: Offers a reasonable compromise with the team owning the extra tooling.
      weak: Flatly refuses or immediately agrees to support every requested language without considering cost.
    followups:
      - What is the minimum contract a service must meet to run on the platform regardless of language?
      - Three more teams now want Rust. What changes?
    common_errors:
      - Ignoring the long-term maintenance cost of each supported stack.

  # ------------------------------------------------------------ templates and scaffolding
  - external_key: technical.platform.service_template_day_one
    competency_key: ci_cd
    topic: Designing a new-service template
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you were designing the template a team uses to create a brand-new service, what would you put in it
      so that the service can be deployed to a real environment on the first day?
    expected_concepts:
      - working skeleton with health endpoints
      - build, test and container image definitions
      - CI pipeline and deployment manifests wired to environments
      - catalog registration and ownership metadata
      - default dashboards, alerts and structured logging
      - secrets and configuration conventions
    rubric:
      excellent: Lists the pieces that make a first deploy possible (pipeline, manifests, health checks, ownership, observability, config) and explains which are generated versus inherited from shared components.
      good: Covers code skeleton, pipeline and deployment config with a few extras.
      weak: Describes only a code skeleton or a README.
    followups:
      - Which of those should be copied into the repository and which should be referenced from a shared place?
      - How do you stop the template from becoming bloated?
    common_errors:
      - Copying everything into each repository so nothing can be updated centrally later.

  - external_key: technical.platform.template_drift_existing_services
    competency_key: ci_cd
    topic: Updating services created from an old template
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Over two years, two hundred services were generated from your service template. You've now improved
      it with a new logging library and a security fix to the Dockerfile. How would you get those changes
      into the services that already exist?
    expected_concepts:
      - scaffold-once templates diverge, so updates need a separate mechanism
      - moving shared parts into versioned libraries, base images or pipeline includes
      - automated pull requests across repositories (Renovate-style bots or codemods)
      - tracking which template version each service was generated from
      - prioritising the security fix with a deadline and visibility
      - handling heavily customised services individually
    rubric:
      excellent: Recognises the copy-and-forget problem, uses automated cross-repository changes for the urgent fix, moves shared concerns into centrally versioned components for the future, and tracks rollout with a dashboard and deadline.
      good: Proposes automated pull requests or a script across repos and tracks progress.
      weak: Asks each team to update manually from release notes with no tracking.
    followups:
      - Forty pull requests sit unmerged after a month. What do you do?
      - How would you design the next template so this is easier?
    common_errors:
      - Not knowing which services came from which template version.
      - Treating a security fix with the same urgency as a cosmetic change.

  - external_key: technical.platform.template_testing
    competency_key: testing
    topic: Testing the templates themselves
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A change to a service template once broke every newly generated project for a week before anyone
      noticed. How would you test templates so that kind of thing gets caught before it reaches developers?
    expected_concepts:
      - generating a project from the template in CI on every change
      - building, testing and deploying the generated project to a sandbox
      - covering the main parameter combinations
      - smoke tests of health endpoints and pipeline execution
      - versioned template releases and quick rollback
    rubric:
      excellent: Renders the template in CI across key parameter combinations, runs the full build and a real deploy of the generated service, and releases templates with versions so a bad change can be rolled back.
      good: Renders the template and builds the result automatically.
      weak: Relies on manual review of template changes or on users reporting breakage.
    followups:
      - The parameter matrix has hundreds of combinations. How do you choose what to test?
      - What would you alert on for the template itself?
    common_errors:
      - Linting the template files without ever building what they produce.

  # ------------------------------------------------------------ service catalog
  - external_key: technical.platform.service_catalog_metadata
    competency_key: system_design
    topic: Service catalog contents
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What information would you want in a service catalog, and how have you seen that information actually
      get used day to day?
    expected_concepts:
      - owning team and on-call rotation
      - lifecycle stage and tier or criticality
      - links to repository, dashboards, runbooks and documentation
      - dependencies and APIs exposed
      - use during incidents, audits and migrations
    rubric:
      excellent: Lists the ownership, criticality, links and dependency metadata and ties each to a real use such as incident routing, compliance reporting or finding affected services in a migration.
      good: Names ownership and links with one or two concrete uses.
      weak: Describes the catalog as a list of service names with no clear use.
    followups:
      - Which single field matters most during an incident, and why?
      - Where should that metadata live so it stays close to the code?
    common_errors:
      - Collecting many fields that nobody reads or maintains.

  - external_key: technical.platform.catalog_stale_ownership
    competency_key: system_design
    topic: Fixing an inaccurate service catalog
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      During a major incident the on-call engineer looked up the failing service in the catalog and found the
      owning team had been disbanded months ago. You suspect a lot of the catalog is like that. How would you
      fix it in a way that stays fixed?
    expected_concepts:
      - metadata stored in the repository next to the code
      - validation in CI and checks against the identity directory
      - automated detection of orphaned or inconsistent entries
      - ownership transfer as part of team reorganisation processes
      - making the catalog useful so teams have a reason to keep it current
    rubric:
      excellent: Does an initial cleanup, then makes accuracy self-sustaining through metadata in repositories, automated validation against the org directory, orphan detection with escalation and tooling that depends on the data.
      good: Cleans up the data and adds some automated checks.
      weak: Proposes a one-off manual audit or a reminder email.
    followups:
      - How would you handle a service nobody will admit to owning?
      - What would you measure to know the catalog is trustworthy?
    common_errors:
      - Fixing the data once without changing the process that let it rot.

  # ------------------------------------------------------------ self-service infrastructure
  - external_key: technical.platform.self_service_database
    competency_key: terraform
    topic: Replacing database tickets with self-service
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Teams currently file a ticket and wait about two weeks for a new PostgreSQL database. You've been asked
      to make it self-service. How would you design that flow end to end?
    expected_concepts:
      - a small set of approved sizes and configurations behind a simple request
      - infrastructure as code modules or a control-plane resource doing the provisioning
      - backups, encryption, monitoring and network access built in
      - credentials delivered through the secrets system, not by hand
      - cost visibility and ownership tags
      - day-two operations such as upgrades, resizing and deletion
    rubric:
      excellent: Designs a constrained request interface backed by tested modules, bakes in backups, encryption, monitoring and secret delivery, and thinks through ownership, cost and day-two operations rather than just creation.
      good: Uses infrastructure as code with sensible defaults and automated credential delivery.
      weak: Automates creation only, leaving backups, access and lifecycle undefined.
    followups:
      - A team needs a configuration your options do not cover. What happens?
      - How do you handle major version upgrades for hundreds of these databases?
    common_errors:
      - Exposing every cloud setting, which recreates the expertise problem.
      - Forgetting deletion and orphaned resource cleanup.

  - external_key: technical.platform.terraform_module_consumer_interface
    competency_key: terraform
    topic: Designing modules for other teams
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you write a Terraform module that dozens of other teams will consume, what do you do differently
      from a module that only your own team uses?
    expected_concepts:
      - small, intention-revealing input interface with safe defaults
      - input validation and clear descriptions
      - semantic versioning and a changelog
      - outputs that downstream modules need
      - automated tests (plan checks or terratest-style applies)
      - avoiding provider configuration inside the module
    rubric:
      excellent: Treats the module as a public API with a minimal validated interface, safe defaults, semantic versioning, documentation and automated tests, and explains why provider configuration stays outside it.
      good: Mentions versioning, documented inputs and defaults.
      weak: Exposes every resource attribute as a variable or ships unversioned changes from a main branch.
    followups:
      - How do you decide whether a setting should be an input or a fixed default?
      - How would you test that a change is safe for existing consumers?
    common_errors:
      - Consumers pinning to a branch so every change lands on them unannounced.

  - external_key: technical.platform.module_breaking_change
    competency_key: terraform
    topic: Shipping a breaking change to a shared module
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A networking module used by about eighty Terraform root configurations needs a breaking change: a
      resource has to be restructured, and a naive upgrade would destroy and recreate load balancers. How
      would you plan and roll that out?
    expected_concepts:
      - major version bump with clear upgrade notes
      - moved blocks or state migration so resources are not recreated
      - a plan-diff check showing no destroys before applying
      - piloting on non-production configurations first
      - discovering all consumers and tracking migration status
      - supporting the old major version for a defined window
    rubric:
      excellent: Uses a major version, moved blocks or scripted state moves to avoid replacement, verifies with plans that show no destroys, pilots on low-risk stacks, tracks every consumer and sets a deprecation window for the old version.
      good: Bumps the major version and uses state moves with a staged rollout.
      weak: Releases the change and lets consumers discover the replacement in their plans.
    followups:
      - How would you automatically block an apply that would destroy a load balancer?
      - Some consumers never upgrade. How long do you support the old version?
    common_errors:
      - Not knowing about moved blocks or state mv, so recreation looks unavoidable.

  - external_key: technical.platform.control_plane_vs_pipeline_provisioning
    competency_key: kubernetes
    topic: Control-plane versus pipeline provisioning
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      For self-service infrastructure, some platforms run Terraform from pipelines while others use a
      Kubernetes-style control plane such as Crossplane or custom operators that continuously reconcile.
      How would you compare those approaches, and which would you pick for your environment?
    expected_concepts:
      - one-shot apply versus continuous reconciliation and drift correction
      - state management in Terraform versus resource status in the API server
      - developer interface (pull request and plan versus applying a custom resource)
      - maturity of providers and debugging experience
      - blast radius and permissions of a long-running controller
      - composition or abstraction layers on top of either
    rubric:
      excellent: Contrasts execution model, drift handling, state, interface, provider maturity, operational burden and security of a privileged controller, then makes a reasoned choice tied to team skills and existing tooling.
      good: Explains continuous reconciliation versus pipeline apply and gives a sensible preference.
      weak: Picks one on popularity or cannot explain how the approaches differ in behaviour.
    followups:
      - How would you debug a resource stuck not ready in a control-plane approach?
      - Could you run both? Where would you draw the line?
    common_errors:
      - Overlooking that a reconciling controller holds broad, always-on cloud credentials.

  - external_key: technical.platform.self_service_without_admin
    competency_key: security
    topic: Self-service without cloud admin access
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How can you let developers create the cloud resources they need on their own without handing them
      broad administrator access to the cloud account?
    expected_concepts:
      - provisioning through an automated system with its own scoped identity
      - pre-approved modules or resource types
      - permission boundaries or service control policies
      - per-team accounts or projects
      - audit trail of who requested what
    rubric:
      excellent: Moves the privilege into an automated provisioning path with limited, audited permissions, offers pre-approved building blocks and backs them with account-level guardrails such as boundaries or organisation policies.
      good: Suggests infrastructure as code through a pipeline with restricted roles.
      weak: Gives developers admin in a shared account and relies on reviews afterwards.
    followups:
      - What would you still let developers do directly in the console?
      - How would you prevent the pipeline identity itself from becoming the weak spot?
    common_errors:
      - Moving admin rights to a pipeline that any repository can trigger.

  - external_key: technical.platform.automate_ticket_queue_first
    competency_key: product_sense
    topic: Choosing which requests to automate
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your platform team's queue has hundreds of infrastructure requests a month, from DNS records to new
      Kafka topics. How would you decide which kinds of request to turn into self-service first?
    expected_concepts:
      - categorising tickets by type and counting volume
      - measuring wait time and effort per request type
      - favouring frequent, repetitive and low-risk requests
      - checking which requests block delivery the most
      - validating the choice with the requesting teams
    rubric:
      excellent: Analyses the queue by type, frequency, wait time and effort, prioritises frequent low-risk repetitive requests that block delivery, and confirms the choice with requesters.
      good: Picks the most frequent request types based on some data.
      weak: Picks whatever is technically interesting or automates everything at once.
    followups:
      - A rare request takes three days of senior time each time. Does that change your ranking?
      - How would you know the automation actually reduced waiting?
    common_errors:
      - Ignoring risk, so a dangerous operation gets automated before safe common ones.

  # ------------------------------------------------------------ abstractions and platform APIs
  - external_key: technical.platform.abstraction_thickness
    competency_key: kubernetes
    topic: How much of Kubernetes to hide
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Platform teams argue about whether developers should write Kubernetes manifests directly or describe
      their app in a higher-level format that the platform translates. How do you think about where that
      abstraction line should sit?
    expected_concepts:
      - cognitive load of raw manifests versus flexibility
      - leaky abstractions during debugging
      - a simple application spec covering most services
      - the ability to override or drop to lower layers
      - cost of maintaining a translation layer
      - developer skill mix in the organisation
    rubric:
      excellent: Weighs cognitive load against flexibility and debuggability, proposes a high-level spec for the common case with defined ways to reach lower layers, and recognises the maintenance cost of owning an abstraction.
      good: Prefers an abstraction for common cases and acknowledges the need for overrides.
      weak: Argues hiding everything or exposing everything with no discussion of trade-offs.
    followups:
      - A pod is crash-looping and the developer only knows the high-level spec. How do they debug it?
      - What signals tell you an abstraction is leaking too much?
    common_errors:
      - Building an abstraction that hides errors, so developers cannot see why deploys fail.

  - external_key: technical.platform.escape_hatches
    competency_key: system_design
    topic: Designing escape hatches
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Every opinionated platform eventually meets a team whose needs it doesn't cover. How would you design
      escape hatches so those teams aren't blocked, without the platform losing its guarantees?
    expected_concepts:
      - layered abstractions where teams can drop one level
      - raw resource passthrough with policy still applied
      - explicit, visible opt-outs recorded in metadata
      - clear support boundaries for customised parts
      - reviewing escape-hatch usage to find missing features
    rubric:
      excellent: Designs layered escape routes that keep security and policy enforcement in place, records opt-outs visibly, defines support boundaries and mines usage of the escape hatches to drive the roadmap.
      good: Allows raw overrides while keeping some guardrails.
      weak: Either forbids any deviation or lets teams bypass the platform entirely with no guardrails.
    followups:
      - Which guarantees should survive any escape hatch?
      - Half the teams use the escape hatch. What does that tell you?
    common_errors:
      - Escape hatches that silently bypass policy enforcement.

  - external_key: technical.platform.application_resource_api
    competency_key: api_design
    topic: Designing a platform application API
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Suppose you're designing the core resource of your platform API, something like an Application that a
      developer declares to get a running service. Which fields would you expose, and how would you report
      progress and failures back to the developer?
    expected_concepts:
      - minimal intent-level fields (image, ports, scaling, resources, dependencies)
      - environment-specific overrides
      - separating spec (desired) from status (observed)
      - status conditions with reasons and human-readable messages
      - ownership and metadata labels
      - validation with clear error messages at submission time
    rubric:
      excellent: Proposes a small intent-level spec, a separate status with conditions, reasons and messages that point developers to the fix, validation at admission time and a clear story for overrides per environment.
      good: Reasonable field list and some form of status reporting.
      weak: Mirrors raw Deployment fields or offers no way to see why something failed.
    followups:
      - How would you represent a dependency on a database the platform also provisions?
      - How would you add a new optional field without breaking existing clients?
    common_errors:
      - Mixing desired and observed state in the same fields.

  - external_key: technical.platform.api_version_evolution
    competency_key: api_design
    topic: Evolving a platform API version
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your platform's custom resources have been at v1alpha1 for a year, hundreds of objects exist, and you
      now want a v1 with a cleaner schema that renames and restructures fields. How would you evolve the API
      without breaking the teams that rely on it?
    expected_concepts:
      - serving multiple versions with one storage version
      - conversion webhooks or conversion logic, round-trip safety
      - migrating stored objects to the new storage version
      - updating clients, templates and GitOps repositories
      - deprecation warnings and a published timeline
      - testing conversion with real stored objects
    rubric:
      excellent: Serves both versions with lossless conversion, migrates stored objects, updates templates and repositories, communicates deprecation with warnings and timelines, and tests conversion against real data before switching.
      good: Knows multiple versions can be served with conversion and plans a deprecation period.
      weak: Proposes deleting and recreating objects under the new schema or a hard cutover.
    followups:
      - A v1 field has no equivalent in v1alpha1. How do you avoid losing data on round trips?
      - How do you know when it is safe to stop serving the old version?
    common_errors:
      - Forgetting that objects stay stored in the old version until they are rewritten.

  # ------------------------------------------------------------ portals and strategy
  - external_key: technical.platform.portal_beyond_links
    competency_key: system_design
    topic: Making a developer portal useful
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Many developer portals end up as a page of links nobody visits. In your view, what makes a portal
      something developers actually open every day?
    expected_concepts:
      - actions, not just information (create service, request resources)
      - per-service views pulling live data (deploys, alerts, costs)
      - accurate ownership and search
      - documentation close to the services
      - fast and reliable, with usage tracked
    rubric:
      excellent: Argues that a portal earns usage by enabling real tasks and showing live, accurate, service-specific data, and describes how usage data informs what to add or remove.
      good: Names self-service actions and accurate catalog data as key.
      weak: Focuses only on look and feel or on adding more links.
    followups:
      - What would you measure to know the portal is valuable?
      - Which feature would you build first if you only had a month?
    common_errors:
      - Launching a portal before the underlying self-service capabilities exist.

  - external_key: technical.platform.roadmap_discovery
    competency_key: product_sense
    topic: Understanding developer needs
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your platform roadmap so far has been driven by whatever the platform engineers found interesting.
      Adoption is flat. How would you change the way the team learns what developers actually need?
    expected_concepts:
      - user interviews and observing developers do real tasks
      - analysing support tickets, chat questions and workarounds
      - developer experience surveys with follow-up
      - telemetry from platform tools (funnels, drop-offs)
      - design partners and regular feedback loops
    rubric:
      excellent: Combines qualitative discovery (interviews, shadowing) with quantitative signals (tickets, telemetry, surveys), sets up recurring feedback with design partner teams and shows how findings turn into priorities.
      good: Proposes surveys and interviews with some follow-through into the roadmap.
      weak: Proposes a single survey or simply asks teams for feature requests.
    followups:
      - What did you learn the last time you watched a developer use your tooling?
      - How do you avoid building only for the loudest team?
    common_errors:
      - Treating feature requests as needs without understanding the underlying problem.

  - external_key: technical.platform.portal_build_vs_buy
    competency_key: system_design
    topic: Build versus adopt for a developer portal
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your organisation wants a developer portal. The options on the table are adopting an open-source
      framework like Backstage, buying a commercial product, or building something small in-house. How would
      you run that decision?
    expected_concepts:
      - required capabilities and integration points listed first
      - total cost of ownership including plugin maintenance and upgrades
      - team skills (for example TypeScript for Backstage)
      - time to first value and lock-in risk
      - a time-boxed proof of concept with real users
      - data model ownership and portability
    rubric:
      excellent: Starts from requirements, compares total cost of ownership, skills, integration effort, time to value and lock-in, validates with a time-boxed pilot with real teams and defines criteria for revisiting the decision.
      good: Compares the options on cost and effort and suggests a pilot.
      weak: Chooses based on popularity or a demo, ignoring maintenance cost.
    followups:
      - What hidden costs did you see the last time a team adopted an open-source framework like this?
      - How would you keep catalog data portable if you later switch products?
    common_errors:
      - Underestimating the ongoing engineering needed to keep an open-source portal upgraded.

  - external_key: technical.platform.first_platform_engineer
    competency_key: system_design
    topic: Minimum viable platform at a growing company
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're the first platform engineer at a company of sixty engineers. Each team deploys differently,
      there's one shared Kubernetes cluster that a few people understand, and incidents are rising. What
      would you focus on in your first six months, and what would you deliberately leave alone?
    expected_concepts:
      - assessing current state and the main sources of incidents and toil
      - standardising the deploy path for the most common service type
      - making the shared cluster reproducible (infrastructure as code, GitOps)
      - baseline observability and ownership
      - explicitly deferring portals, meshes and other heavy tooling
      - incremental adoption with early teams
    rubric:
      excellent: Starts with discovery, stabilises and codifies the cluster, standardises one deploy path with early adopters, adds baseline observability and ownership, and explicitly defers heavy tooling with reasons tied to the company's size.
      good: Proposes infrastructure as code, a standard pipeline and observability in a sensible order.
      weak: Proposes a large platform rebuild or a long list of tools with no sequencing.
    followups:
      - What would you need to see before hiring a second platform engineer?
      - Which risk in that setup worries you most in the first month?
    common_errors:
      - Building a full internal developer platform for a company that needs a reliable deploy path first.

  - external_key: technical.platform.slow_first_deploy_onboarding
    competency_key: ci_cd
    topic: Shortening time to first deploy
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      New engineers at your company take about two weeks before they ship their first change to production.
      How would you find out where that time goes and shorten it?
    expected_concepts:
      - mapping the steps (access, laptop setup, local build, review, deploy)
      - measuring or shadowing new joiners
      - automating access requests and environment setup
      - a starter task that exercises the full delivery path
      - tracking time to first deploy as a metric
    rubric:
      excellent: Maps the journey with real data from recent joiners, identifies the biggest waits, automates access and setup, and tracks time to first deploy as an ongoing metric.
      good: Identifies setup and access as bottlenecks and proposes automation.
      weak: Proposes better documentation only, without finding where the time goes.
    followups:
      - Which of those steps would you expect to be slowest, and why?
      - How would you keep the improvements from decaying over time?
    common_errors:
      - Fixing tooling while the real delay is waiting for access approvals.
