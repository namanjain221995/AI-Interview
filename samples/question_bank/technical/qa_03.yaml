# Curated questions: QA / quality engineering (part 3 of 4).
# Test design and isolation, API security and accessibility checks, BDD, visual and async testing,
# feature flags, testing in production, quality metrics and shared frameworks.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [qa]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.qa.hotfix_regression_scope
    competency_key: test_automation
    topic: Testing an urgent hotfix
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A hotfix for a login problem needs to go out in two hours. How would you decide what to test before it
      ships?
    expected_concepts:
      - verifying the fix against the original reproduction
      - understanding exactly what code changed
      - targeted regression around the changed area
      - running the automated smoke or critical suite
      - monitoring after release and a rollback plan
    rubric:
      excellent: Confirms the fix with the original reproduction, reviews the diff to scope nearby risk, runs targeted checks plus the automated critical suite, and agrees post-release monitoring and rollback.
      good: Verifies the fix and runs a smoke test of key flows.
      weak: Either tests only the exact fix or insists on the full regression cycle regardless of urgency.
    followups:
      - What would you look at in the code change itself?
      - What would you watch in production in the first hour after release?
    common_errors:
      - Not asking what else the changed code touches, such as password reset or single sign-on.

  - external_key: technical.qa.reviewing_test_code
    competency_key: code_quality
    topic: Reviewing automated test code
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you review a teammate's pull request that adds automated tests, what do you look for?
    expected_concepts:
      - tests check meaningful behaviour with clear assertions
      - readable names that describe the scenario
      - no hard-coded waits or environment values
      - independent setup and cleanup
      - reuse of existing helpers instead of duplication
      - would fail if the feature broke
    rubric:
      excellent: Checks that each test would actually fail when the behaviour breaks, has clear names and assertions, avoids sleeps and hard-coded data, is independent and reuses existing helpers.
      good: Looks at readability, assertions and duplication.
      weak: Only checks that the tests pass.
    followups:
      - How do you check that a new test can actually fail?
      - What review comment do you find yourself leaving most often?
    common_errors:
      - Approving tests that pass but assert almost nothing.

  - external_key: technical.qa.order_independent_tests
    competency_key: testing
    topic: Independent and repeatable tests
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you make sure your automated tests can run in any order, on their own or all together, and
      still give the same result?
    expected_concepts:
      - each test sets up its own state
      - no reliance on data left by another test
      - resetting shared state such as caches and global config
      - randomised ordering to expose dependencies
      - cleanup that runs even when a test fails
    rubric:
      excellent: Explains self-contained setup, avoiding shared mutable state, reliable cleanup, and using randomised order or isolated runs to catch hidden dependencies, with an example of one they found.
      good: Knows each test should create its own data and clean up.
      weak: Chains tests where one creates data and the next uses it.
    followups:
      - How did you discover a hidden dependency between tests in the past?
      - When, if ever, is a shared setup across tests acceptable?
    common_errors:
      - Tests that pass only because an earlier test happened to create the needed data.

  - external_key: technical.qa.api_permission_checks
    competency_key: security
    topic: Testing API authentication and permissions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you test that an API correctly enforces who is allowed to see or change which data?
    expected_concepts:
      - requests with no token, expired and invalid tokens
      - each role against each operation
      - accessing another user's or tenant's records by id
      - correct status codes such as 401 and 403
      - no sensitive data leaking in errors
    rubric:
      excellent: Builds a role-by-operation matrix, tests missing and invalid credentials, specifically tries accessing other users' or tenants' records by changing ids, and checks status codes and error contents.
      good: Tests different roles and unauthenticated access.
      weak: Only tests with an admin user.
    followups:
      - How would you automate the role matrix without writing hundreds of tests by hand?
      - What does it mean if you get a 404 rather than a 403 for another tenant's record?
    common_errors:
      - Testing only the UI hiding a button, not the API enforcing the rule.

  - external_key: technical.qa.accessibility_in_testing
    competency_key: accessibility
    topic: Including accessibility in everyday testing
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you include accessibility checks in your normal testing of a web feature, rather than leaving
      it for a separate audit?
    expected_concepts:
      - keyboard-only navigation and focus order
      - screen reader checks of labels and announcements
      - automated scanners in the pipeline
      - colour contrast and zoom or text resizing
      - accessibility criteria in the definition of done
    rubric:
      excellent: Describes keyboard, screen reader, contrast and zoom checks as part of each feature, runs an automated scanner in CI, and makes accessibility part of acceptance criteria.
      good: Mentions keyboard navigation and an automated tool.
      weak: Leaves accessibility entirely to a yearly audit or doesn't know how to check it.
    followups:
      - What kinds of issues do automated scanners miss?
      - Which screen reader and browser combination do you test with, and why?
    common_errors:
      - Relying only on an automated score as proof of accessibility.

  - external_key: technical.qa.mock_or_real_dependency
    competency_key: testing
    topic: When to mock a dependency
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide whether a test should talk to a real database or service, or use a mock or stub
      instead?
    expected_concepts:
      - level and purpose of the test
      - speed and reliability of the dependency
      - real dependencies in containers for integration tests
      - mocks hiding integration bugs
      - mocking what you don't own through adapters
    rubric:
      excellent: Ties the choice to what the test is meant to prove, uses real dependencies such as containerised databases where integration matters, mocks slow or unreliable external services, and names the risk of mocks diverging from reality.
      good: Mocks external services and uses real dependencies for integration tests.
      weak: Mocks everything by default or never mocks anything.
    followups:
      - Tell me about a bug that slipped through because a mock behaved differently from the real thing.
      - How do you keep a mock in step with the real service?
    common_errors:
      - Mocking the database in tests whose whole point is to verify queries.

  - external_key: technical.qa.actionable_test_reports
    competency_key: test_automation
    topic: Making test results actionable
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When an automated test fails in the pipeline, what information should the report give so someone can
      understand the problem without re-running it?
    expected_concepts:
      - clear test name and failing step
      - assertion message with expected and actual
      - screenshots, video or traces for UI tests
      - request and response details for API tests
      - environment, build and test data used
      - history showing whether it failed before
    rubric:
      excellent: Lists specific artefacts for UI and API failures, readable assertion messages, environment and build context and failure history, and explains how this shortens triage.
      good: Mentions screenshots, logs and clear messages.
      weak: Thinks a pass or fail count is enough.
    followups:
      - How would you show whether a failure is new or has been flaky for weeks?
      - What did you change in a report that made triage noticeably faster?
    common_errors:
      - Generic assertion messages like expected true but was false.

  # ---------------------------------------------------------------- medium
  - external_key: technical.qa.bdd_when_useful
    competency_key: test_automation
    topic: Value and cost of BDD
    difficulty: medium
    kind: technical
    text: >-
      What's your experience with behaviour-driven development and Gherkin-style scenarios? When has it
      genuinely helped, and when has it become overhead?
    expected_concepts:
      - shared understanding through examples
      - collaboration between product, developers and testers
      - living documentation
      - step definition sprawl and maintenance cost
      - becomes overhead when only testers read the scenarios
    rubric:
      excellent: Distinguishes BDD as a collaboration practice from the tooling, gives a real case where examples improved understanding and one where scenarios became costly, and explains how to keep step libraries maintainable.
      good: Explains benefits and some drawbacks with an example.
      weak: Equates BDD with writing tests in Gherkin syntax.
    followups:
      - How do you stop step definitions from multiplying into hundreds of near-duplicates?
      - Who should write the scenarios, and when?
    common_errors:
      - Writing UI-click-level steps in Gherkin, which defeats the readable intent.

  - external_key: technical.qa.visual_regression_testing
    competency_key: test_automation
    topic: Visual regression testing
    difficulty: medium
    kind: technical
    text: >-
      How would you use visual regression testing on a web product, and how do you keep it from producing
      a flood of false alarms?
    expected_concepts:
      - screenshot comparison against approved baselines
      - stable rendering through fixed fonts, viewport and data
      - masking dynamic content such as dates and ads
      - component-level snapshots versus full pages
      - review workflow for approving changes
    rubric:
      excellent: Explains baselines and review workflow, controls sources of noise (fonts, animations, dynamic data, viewport), prefers component-level snapshots, and sets sensible thresholds.
      good: Understands baseline comparison and masking dynamic areas.
      weak: Compares full pages pixel by pixel with live data and accepts constant false positives.
    followups:
      - What kinds of bugs does visual testing catch that functional tests don't?
      - How do you handle intentional design changes that touch hundreds of screens?
    common_errors:
      - Running visual comparisons across different operating systems and blaming the tool for font differences.

  - external_key: technical.qa.message_driven_flow_testing
    competency_key: test_automation
    topic: Testing asynchronous event flows
    difficulty: medium
    kind: scenario
    text: >-
      An order service publishes an event, and three other services consume it to send email, reserve stock
      and update analytics. How would you test this flow?
    expected_concepts:
      - testing each consumer in isolation with sample events
      - contract or schema checks on event payloads
      - polling or waiting on observable outcomes instead of sleeps
      - duplicate, out-of-order and malformed messages
      - dead-letter queues and retries
      - correlation ids to trace a flow
    rubric:
      excellent: Tests producers and consumers separately with agreed event schemas, uses a few end-to-end checks that poll for outcomes with timeouts, and covers duplicates, ordering, poison messages and retries.
      good: Tests consumers individually and has an end-to-end check.
      weak: Publishes an event and sleeps before checking the database.
    followups:
      - How would you check that a consumer handles the same event delivered twice?
      - How do you find out which service lost a message?
    common_errors:
      - Only testing the happy path where every message arrives once and in order.

  - external_key: technical.qa.microservice_test_layers
    competency_key: test_automation
    topic: Test strategy for microservices
    difficulty: medium
    kind: technical
    text: >-
      How does your test strategy change when you move from a single monolith to a system of a dozen
      microservices?
    expected_concepts:
      - component tests per service with dependencies stubbed
      - contract tests between services
      - fewer cross-service end-to-end tests
      - independent deployment requires independent verification
      - observability and testing in production
      - versioning and backward compatibility
    rubric:
      excellent: Shifts weight to per-service component and contract tests, keeps a small cross-service end-to-end layer, addresses independent deployability and compatibility, and uses production monitoring as part of quality.
      good: Mentions service-level tests and contract tests with fewer end-to-end tests.
      weak: Proposes the same large end-to-end suite across all services.
    followups:
      - Which end-to-end journeys would you still keep, and why?
      - How do you test a service whose dependencies are owned by other teams?
    common_errors:
      - Requiring every service to be deployed together for testing, which removes independent releases.

  - external_key: technical.qa.schema_migration_testing
    competency_key: databases
    topic: Testing database migrations
    difficulty: medium
    kind: scenario
    text: >-
      A release includes a database migration that splits one table into two and backfills millions of rows.
      How would you test it before it runs in production?
    expected_concepts:
      - running against production-sized data
      - verifying row counts and data integrity after migration
      - timing and locking impact
      - compatibility with the old and new application versions
      - rollback or roll-forward plan tested
      - idempotency if the migration is re-run
    rubric:
      excellent: Tests on realistic data volume, checks integrity with counts and sampled comparisons, measures duration and locking, verifies both app versions work during rollout, and rehearses rollback or recovery.
      good: Tests on a copy of data and verifies the results.
      weak: Runs it on an empty test database and checks it doesn't error.
    followups:
      - How would you check that no data was lost or corrupted?
      - What if the migration takes four hours on real data?
    common_errors:
      - Ignoring that old application instances keep running during a rolling deploy.

  - external_key: technical.qa.feature_flag_testing
    competency_key: test_automation
    topic: Testing with feature flags
    difficulty: medium
    kind: technical
    text: >-
      Your team ships most work behind feature flags. How does that change the way you test, and how do you
      avoid an explosion of flag combinations?
    expected_concepts:
      - testing both on and off states for each flag
      - focusing on combinations that interact
      - defaults matching what production will run
      - testing the switch itself, such as mid-session toggles
      - removing stale flags and their tests
    rubric:
      excellent: Tests both states for each flag, identifies the interacting flags worth combining instead of every combination, matches production configuration, tests toggling live, and pushes for flag cleanup.
      good: Tests on and off states and the production configuration.
      weak: Tests only with the flag on.
    followups:
      - What happens to a user who is mid-checkout when a flag flips?
      - How would you know which flag combinations are actually live in production?
    common_errors:
      - Forgetting the off path, which is what most users see during a gradual rollout.

  - external_key: technical.qa.testing_in_production_practices
    competency_key: observability
    topic: Testing safely in production
    difficulty: medium
    kind: technical
    text: >-
      Some teams test in production as well as before release. What practices make that safe and useful,
      and have you used any of them?
    expected_concepts:
      - synthetic monitoring of key journeys
      - canary releases with automated health checks
      - feature flags for limited exposure
      - test accounts and data isolated from real customers
      - alerting and fast rollback
    rubric:
      excellent: Describes concrete practices such as synthetic journeys, canaries with automatic rollback, flagged exposure and isolated test accounts, explains the safeguards, and gives a real example.
      good: Knows canaries and monitoring and why test data must be isolated.
      weak: Thinks testing in production means skipping pre-release testing.
    followups:
      - How do you keep synthetic test orders out of revenue reports?
      - What would make you abort a canary automatically?
    common_errors:
      - Running destructive tests against real customer data.

  - external_key: technical.qa.inherited_brittle_suite
    competency_key: test_automation
    topic: Rescuing an inherited test suite
    difficulty: medium
    kind: scenario
    text: >-
      You inherit fifteen hundred UI tests full of duplicated steps and hard-coded data, and about a fifth of
      them fail every run. Nobody trusts the results. What would you do?
    expected_concepts:
      - measuring failure and flakiness per test
      - restoring trust with a small reliable core suite
      - deleting or archiving low-value tests
      - refactoring shared steps into reusable components
      - moving checks down to API level
      - incremental cleanup rather than a big rewrite
    rubric:
      excellent: Uses data to triage the suite, carves out a small trusted core quickly, deletes low-value tests, refactors common steps, pushes checks down the pyramid, and improves incrementally while keeping coverage visible.
      good: Fixes the worst tests and refactors common code over time.
      weak: Proposes a complete rewrite from scratch or keeps fixing tests one by one with no plan.
    followups:
      - How would you decide which tests are safe to delete?
      - How would you show the team that the suite can be trusted again?
    common_errors:
      - Launching a full rewrite that leaves no working regression safety net for months.

  - external_key: technical.qa.security_checks_for_testers
    competency_key: security
    topic: Security testing as part of QA
    difficulty: medium
    kind: technical
    text: >-
      What security testing do you consider part of a QA engineer's job, and what do you leave to dedicated
      security specialists?
    expected_concepts:
      - input validation and injection checks
      - authentication, session and authorisation tests
      - access to other users' data by id manipulation
      - dependency and static scans in the pipeline
      - sensitive data in logs, errors and responses
      - deep penetration testing by specialists
    rubric:
      excellent: Lists practical checks a tester can own (authorisation, id tampering, input handling, session behaviour, data exposure, pipeline scanners), explains where specialist pen testing adds value, and gives an issue they found.
      good: Covers authorisation and injection checks and scanners.
      weak: Considers security entirely someone else's job.
    followups:
      - Tell me about a security issue you found during functional testing.
      - How would you add some of these checks to the automated suite?
    common_errors:
      - Testing only through the UI, where client-side checks hide server-side gaps.

  - external_key: technical.qa.a11y_automation_limits
    competency_key: accessibility
    topic: Limits of automated accessibility testing
    difficulty: medium
    kind: technical
    text: >-
      Automated accessibility scanners are easy to add to a pipeline. What do they catch well, what do they
      miss, and how do you cover the gap?
    expected_concepts:
      - catches missing labels, alt text and contrast
      - misses meaningful alt text, focus order and usable flows
      - keyboard traps and dynamic content announcements
      - manual screen reader and keyboard passes
      - recognised success criteria such as WCAG
    rubric:
      excellent: Gives concrete examples of what scanners catch and miss, describes structured manual keyboard and screen reader checks for the gaps, and ties testing to recognised criteria.
      good: Knows scanners find only part of the issues and adds manual checks.
      weak: Treats a passing scanner score as full accessibility compliance.
    followups:
      - How would you test that a modal dialog is accessible?
      - Which accessibility checks would you make blocking in CI?
    common_errors:
      - Assuming any alt text passes, even when it describes nothing useful.

  - external_key: technical.qa.device_lab_strategy
    competency_key: mobile_development
    topic: Mobile device testing strategy
    difficulty: medium
    kind: technical
    text: >-
      For a consumer mobile app, how do you decide between emulators, simulators, a cloud device farm and
      real devices in your own lab?
    expected_concepts:
      - emulators for fast feedback in CI
      - real devices for performance, sensors and hardware behaviour
      - device and OS selection from usage analytics
      - cloud farms for breadth
      - cost and parallel execution
    rubric:
      excellent: Uses emulators for fast automated feedback, real devices for performance, camera, push and network behaviour, picks the device matrix from usage data, and balances farm cost against coverage.
      good: Explains emulator speed versus real device fidelity.
      weak: Tests only on their personal phone or only on emulators.
    followups:
      - What bugs have you seen only on real devices?
      - How often would you revisit the device list?
    common_errors:
      - Ignoring older low-memory devices that many real users still have.

  - external_key: technical.qa.quality_metrics_used
    competency_key: test_automation
    topic: Quality metrics that drive action
    difficulty: medium
    kind: technical
    text: >-
      Which quality metrics have you tracked, and can you give me an example of one that actually changed a
      decision the team made?
    expected_concepts:
      - escaped defects and their severity
      - change failure rate and time to restore
      - flaky test rate and pipeline duration
      - defect trends by component
      - avoiding vanity metrics such as test case counts
    rubric:
      excellent: Names outcome-focused metrics such as escaped defects, change failure rate and feedback time, explains how they were collected, and describes a specific decision driven by one of them.
      good: Tracks meaningful metrics and can explain their purpose.
      weak: Reports test case counts or pass percentages without connecting them to decisions.
    followups:
      - Which metric would you stop tracking because it misleads people?
      - How do you prevent a metric from being gamed?
    common_errors:
      - Using the number of bugs found as a measure of tester productivity.

  # ------------------------------------------------------------------ hard
  - external_key: technical.qa.shared_framework_governance
    competency_key: test_automation
    topic: A shared automation framework for many teams
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Ten teams use a shared in-house test automation framework, and every upgrade breaks somebody. How would
      you design, version and govern a framework like that?
    expected_concepts:
      - small stable core with extension points
      - semantic versioning and changelogs
      - teams pin versions and upgrade on their schedule
      - deprecation periods and migration guides
      - framework's own tests run against consumer suites
      - clear ownership and contribution model
    rubric:
      excellent: Keeps a minimal core with extensions, uses semantic versioning with deprecation windows and migration notes, tests changes against real consumer suites before release, and defines ownership and contribution rules.
      good: Versions the framework and lets teams upgrade when ready.
      weak: Pushes every change to all teams at once from a shared branch.
    followups:
      - When should a team build something outside the framework instead?
      - How would you get teams off a very old version?
    common_errors:
      - Letting the shared framework absorb every team's special case until nobody can change it.

  - external_key: technical.qa.fault_injection_design
    competency_key: distributed_systems
    topic: Fault injection and resilience testing
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you design resilience testing for a service that depends on a database, a cache and two
      external APIs, so you know how it behaves when those dependencies fail or slow down?
    expected_concepts:
      - hypotheses about expected degraded behaviour
      - injecting latency, errors and outages per dependency
      - timeouts, retries, circuit breakers and fallbacks verified
      - blast radius control and abort conditions
      - starting in test environments before production
      - observing user-facing impact through metrics
    rubric:
      excellent: Defines expected behaviour per failure, injects latency, errors and outages one dependency at a time, checks timeouts, retries, breakers and fallbacks, controls blast radius, and measures user-facing impact.
      good: Plans to simulate dependency failures and check the service degrades gracefully.
      weak: Proposes randomly killing servers without hypotheses or safety limits.
    followups:
      - Why can a slow dependency be worse than a dead one?
      - What would make you stop an experiment early?
    common_errors:
      - Testing only total outages and never partial slowness, which causes most cascading failures.

  - external_key: technical.qa.llm_feature_testing
    competency_key: llm_engineering
    topic: Testing a feature built on a language model
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your product adds an assistant that summarises support tickets using a large language model, so the
      output differs every time. How would you test it before release and keep testing it afterwards?
    expected_concepts:
      - curated evaluation set with expected properties
      - property and rubric checks instead of exact matches
      - automated scoring plus human review samples
      - safety cases such as leaking data or prompt injection
      - regression runs when prompts or models change
      - production monitoring and user feedback
    rubric:
      excellent: Builds a representative evaluation set, checks properties rather than exact text, combines automated scoring with sampled human review, covers safety and injection cases, reruns evaluations on every prompt or model change, and monitors production quality.
      good: Uses a set of sample tickets and reviews outputs against criteria.
      weak: Tries exact-match assertions or relies on manually reading a few outputs.
    followups:
      - How would you decide a new model version is better, not just different?
      - What would you check to make sure a summary never includes another customer's data?
    common_errors:
      - Treating non-deterministic output as untestable instead of testing its properties.

  - external_key: technical.qa.regulated_traceability
    competency_key: test_automation
    topic: Testing in a regulated domain
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're responsible for testing in a regulated financial product where auditors want evidence that every
      requirement was tested, yet the team wants to release weekly. How would you meet both needs?
    expected_concepts:
      - traceability from requirements to automated tests
      - evidence generated automatically from CI runs
      - risk classification of requirements
      - change control and approvals built into the pipeline
      - versioned test results tied to releases
    rubric:
      excellent: Automates traceability and evidence collection from the pipeline, classifies requirements by risk to decide depth, builds approvals into the workflow, and keeps versioned results per release so audits don't slow delivery.
      good: Links tests to requirements and keeps records of runs.
      weak: Proposes manual sign-off documents for every release, or ignores the audit need.
    followups:
      - What would you show an auditor who asks how a specific requirement was verified last month?
      - How do you handle an urgent fix that needs to bypass the normal cycle?
    common_errors:
      - Producing evidence by hand after the fact, which is slow and unreliable.

  - external_key: technical.qa.bugs_per_tester_kpi
    competency_key: test_automation
    topic: Pushing back on a harmful quality metric
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Leadership proposes measuring testers by the number of bugs each one logs per month. How would you
      respond, and what would you offer instead?
    expected_concepts:
      - incentive to log trivial or duplicate bugs
      - discourages prevention and collaboration
      - conflict between testers and developers
      - team-level outcome metrics instead
      - understanding what leadership actually wants to know
    rubric:
      excellent: Explains the behavioural incentives and how they damage quality and collaboration, uncovers the real question leadership is asking, and proposes team-level outcome measures with a plan to introduce them.
      good: Explains why the metric is harmful and suggests better ones.
      weak: Accepts the metric, or objects without offering an alternative.
    followups:
      - How would you present this to a leader who is set on the idea?
      - What would you use to show the value of the testing team?
    common_errors:
      - Arguing against measurement in general rather than proposing better measures.

  - external_key: technical.qa.telemetry_informed_testing
    competency_key: observability
    topic: Using production data to guide testing
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How can production telemetry such as logs, traces, error rates and usage analytics make your testing
      more effective? Describe how you've used it or would set it up.
    expected_concepts:
      - usage data to prioritise journeys and platforms
      - error and crash data to find untested paths
      - real request shapes to build test data and load models
      - comparing pre-release and post-release signals
      - alerting as a safety net for gaps in testing
    rubric:
      excellent: Gives concrete uses such as prioritising coverage by usage, mining errors for missing tests, deriving load and data models from real traffic, and closing the loop with release comparisons, with a real or well-reasoned example.
      good: Uses analytics and error data to decide what to test.
      weak: Sees monitoring as only an operations concern.
    followups:
      - What privacy concerns come up when you use production data this way?
      - How would you spot a feature path that no test ever covers?
    common_errors:
      - Copying raw production payloads into test suites without removing personal data.
