# Curated questions: QA / quality engineering (part 1 of 4).
# Test pyramid, UI and API automation, contract testing, test data, flaky tests, CI gates.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [qa]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.qa.pyramid_balance
    competency_key: testing
    topic: Balancing unit, API and UI tests
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Think about the last web application you tested. How did you decide which checks belonged in unit
      tests, which in API tests and which in end-to-end UI tests?
    expected_concepts:
      - most logic covered cheaply at unit level
      - API or service tests for business rules and integration
      - a thin layer of UI tests for critical user journeys
      - feedback speed and maintenance cost per level
      - avoiding duplicate coverage of the same rule at every level
    rubric:
      excellent: Uses a concrete product to explain the split, ties each level to cost, speed and the kind of defect it catches, and describes deliberately keeping UI tests to key journeys.
      good: Describes the pyramid correctly with a sensible example of what goes at each level.
      weak: Recites the pyramid shape without applying it, or automates everything through the UI.
    followups:
      - Which tests in that suite gave you the most value per minute of runtime?
      - Where did you end up with the same rule tested at three levels, and was that intentional?
    common_errors:
      - Treating the pyramid as a fixed ratio rather than a cost and risk trade-off.

  - external_key: technical.qa.what_not_to_automate
    competency_key: test_automation
    topic: Choosing what not to automate
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Not every test case is worth automating. How do you decide what to leave as a manual or exploratory
      check, and can you give me an example where you chose not to automate something?
    expected_concepts:
      - frequency of execution and regression risk
      - stability of the feature and UI under test
      - cost to build and maintain versus manual effort
      - checks needing human judgement such as usability or visual feel
      - one-off or rarely run scenarios
    rubric:
      excellent: Gives clear criteria (repetition, stability, risk, maintenance cost, need for human judgement) and a real example with the reasoning and what they did instead.
      good: Names two or three sensible criteria and a plausible example.
      weak: Says everything should be automated, or cannot explain any criteria.
    followups:
      - Did you ever automate something and later delete the test? Why?
      - How do you make sure the manual checks you kept still get run?
    common_errors:
      - Automating unstable, still-changing features and then spending weeks fixing the tests.

  - external_key: technical.qa.ui_test_structure
    competency_key: test_automation
    topic: Structuring UI automation code
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you structure UI automation code so that a change to one screen doesn't force you to edit dozens
      of tests?
    expected_concepts:
      - page objects or screen and component objects
      - keeping locators in one place
      - tests expressed as user intent rather than clicks
      - reusable helpers and fixtures for setup
      - no assertions hidden inside page objects or kept deliberately minimal
    rubric:
      excellent: Explains a concrete pattern such as page or component objects with centralised locators and intent-level test steps, and shows how a UI change ripples to one place only.
      good: Describes page objects and reusable helpers correctly.
      weak: Copies locators and click sequences into every test, or cannot describe any structure.
    followups:
      - How do you handle a component, like a date picker, that appears on many pages?
      - Where do you draw the line between a page object method and a test step?
    common_errors:
      - Page objects that grow into thousand-line god classes with test logic inside.

  - external_key: technical.qa.locator_strategy
    competency_key: test_automation
    topic: Stable element locators
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What's your approach to choosing element locators in UI tests so they survive routine front-end changes?
    expected_concepts:
      - dedicated test ids agreed with developers
      - accessible roles and labels as locators
      - avoiding brittle absolute XPath and styling classes
      - avoiding positional indexes
      - working with developers to add hooks
    rubric:
      excellent: Prefers test ids or accessible role and label queries, explains why styling classes and positional XPath break, and describes agreeing a locator convention with the front-end team.
      good: Knows to avoid absolute XPath and prefers ids or data attributes.
      weak: Relies on recorder-generated XPath or CSS classes without considering stability.
    followups:
      - The developers don't want test-only attributes in production markup. How would you respond?
      - How do role-based locators help with accessibility at the same time?
    common_errors:
      - Using generated class names from CSS-in-JS libraries that change every build.

  - external_key: technical.qa.waits_not_sleeps
    competency_key: test_automation
    topic: Synchronisation in UI tests
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A UI test sometimes fails because it clicks a button before the page has finished loading data. A
      teammate's fix is to add a five-second sleep. What would you do instead, and why?
    expected_concepts:
      - waiting for a specific condition rather than fixed time
      - explicit waits or auto-waiting in modern frameworks
      - waiting on network responses or app-ready signals
      - sleeps slow the suite and still fail under load
      - keeping sensible timeouts
    rubric:
      excellent: Replaces the sleep with a wait on the precise condition (element state, network call or ready flag), explains why fixed sleeps are both slow and still flaky, and mentions framework auto-waiting.
      good: Recommends explicit waits for the element and explains that sleeps are unreliable.
      weak: Accepts the sleep or suggests a longer one.
    followups:
      - What if the button is visible but disabled until a background request completes?
      - How would you set timeouts so real performance problems still surface?
    common_errors:
      - Waiting only for element visibility when the real condition is that data has loaded.

  - external_key: technical.qa.new_endpoint_checks
    competency_key: test_automation
    topic: Testing a new REST endpoint
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A developer has just added an endpoint that creates a customer order. What would you check when you
      test it at the API level?
    expected_concepts:
      - status codes for success and failure cases
      - response body and schema
      - validation of required and malformed fields
      - authentication and authorisation
      - side effects such as the record being persisted
      - duplicate submissions and idempotency
    rubric:
      excellent: Covers happy path, validation errors, auth and permission checks, response schema, persisted side effects and duplicate or concurrent submissions, and explains how they'd automate it.
      good: Covers status codes, body content and a few negative cases.
      weak: Only checks that the endpoint returns 200.
    followups:
      - How would you verify the order actually landed in the database or downstream system?
      - What happens if the client retries after a timeout?
    common_errors:
      - Checking only the status code and ignoring the response content.

  - external_key: technical.qa.bug_report_quality
    competency_key: test_automation
    topic: Writing useful bug reports
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What goes into a bug report that a developer can act on straight away? Walk me through one you wrote
      that you were happy with.
    expected_concepts:
      - clear title describing the symptom
      - minimal reproduction steps
      - expected versus actual result
      - environment, build and data used
      - evidence such as logs, screenshots or request ids
      - impact and frequency
    rubric:
      excellent: Describes a real report with a precise title, minimal steps, expected versus actual, environment and build, evidence and user impact, and explains how they narrowed the steps down.
      good: Lists the standard elements and gives a reasonable example.
      weak: Describes reports like "checkout is broken" with no steps or evidence.
    followups:
      - How do you report an issue you can only reproduce one time in five?
      - How do you decide what severity to give it?
    common_errors:
      - Including long, unrelated steps instead of the minimal reproduction.

  - external_key: technical.qa.severity_vs_priority
    competency_key: test_automation
    topic: Severity versus priority
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You find two bugs on release day. One is a spelling mistake on the checkout button, and the other is a
      crash in an admin report that a handful of internal users run monthly. How would you rate and prioritise
      them, and why?
    expected_concepts:
      - severity as technical impact
      - priority as business urgency
      - visibility and brand impact of customer-facing issues
      - number of affected users and workarounds
      - involving the product owner in the call
    rubric:
      excellent: Separates severity from priority, reasons about customer visibility, user count, workarounds and timing, and explains who makes the final release call.
      good: Distinguishes severity and priority and gives a defensible ranking.
      weak: Ranks purely on whether it's a crash, with no notion of business priority.
    followups:
      - What would change your answer about the admin crash?
      - Who should decide whether either one blocks the release?
    common_errors:
      - Treating severity and priority as the same field.

  # ---------------------------------------------------------------- medium
  - external_key: technical.qa.framework_from_scratch
    competency_key: test_automation
    topic: Building a UI automation framework
    difficulty: medium
    kind: scenario
    text: >-
      You join a team that has no UI automation at all and you're asked to set it up. What are the key
      decisions you'd make in the first few weeks, and how would you make them?
    expected_concepts:
      - choosing a tool that fits the stack and team skills
      - same language and repository as the application where sensible
      - project structure and patterns such as page objects
      - test data and environment strategy
      - running in CI with reports from day one
      - starting with a few high-value journeys
    rubric:
      excellent: Prioritises a small set of critical journeys, justifies the tool and language against the team and stack, plans data, environments, CI and reporting early, and explains how developers will contribute.
      good: Makes reasonable tool and structure choices and plans to run in CI.
      weak: Picks a tool by popularity and plans to automate the entire manual regression pack first.
    followups:
      - How would you get developers to write and maintain these tests too?
      - What would you show stakeholders after the first month?
    common_errors:
      - Building an elaborate framework before a single valuable test runs in CI.

  - external_key: technical.qa.api_framework_design
    competency_key: test_automation
    topic: Designing an API test framework
    difficulty: medium
    kind: technical
    text: >-
      How would you structure an API test framework for a service with around fifty endpoints so that the
      tests stay readable and cheap to maintain?
    expected_concepts:
      - typed client or wrapper per resource
      - request builders and data factories
      - schema validation of responses
      - fixtures for auth tokens and setup or teardown
      - environment configuration outside the code
      - clear failure messages with request and response details
    rubric:
      excellent: Describes layers (client, builders, fixtures, tests), schema checks, configuration per environment, auth handling and diagnostic logging on failure, with a reason for each.
      good: Uses a client abstraction, fixtures and some data builders.
      weak: Raw HTTP calls with hard-coded URLs, tokens and payloads in every test.
    followups:
      - How do you keep the client in sync when the API changes?
      - What do you log when a test fails so someone can debug it without re-running?
    common_errors:
      - Hard-coding environment URLs and credentials in test code.

  - external_key: technical.qa.contract_testing_value
    competency_key: test_automation
    topic: Consumer-driven contract testing
    difficulty: medium
    kind: technical
    text: >-
      Explain how consumer-driven contract testing works, and tell me about a situation where it would catch
      a problem that your end-to-end tests would miss or catch too late.
    expected_concepts:
      - consumer records expectations as a contract
      - provider verifies the contract in its own pipeline
      - contract broker or shared storage
      - catching breaking changes before deployment
      - faster and more isolated than full end-to-end environments
    rubric:
      excellent: Explains the consumer-provider flow and verification, mentions a broker and deploy checks, and gives a concrete breaking change (renamed field, changed type) caught before merge.
      good: Explains the idea correctly and why it is faster than end-to-end tests.
      weak: Confuses contract tests with schema docs or with mocking only.
    followups:
      - What does contract testing not tell you about the provider?
      - How would you handle a provider with many consumers that each want different fields?
    common_errors:
      - Believing contract tests verify the provider's business logic.

  - external_key: technical.qa.schema_vs_value_checks
    competency_key: api_design
    topic: Schema validation versus value assertions
    difficulty: medium
    kind: technical
    text: >-
      In API tests, how do you decide between validating the response against a schema and asserting on
      specific field values? Where has each one helped or let you down?
    expected_concepts:
      - schema checks catch structure and type drift broadly
      - value assertions verify business behaviour
      - schemas too loose or too strict
      - generated schemas from OpenAPI specs
      - combining both at the right level
    rubric:
      excellent: Explains what each approach proves, gives a real case where a schema check passed yet behaviour was wrong (or vice versa), and describes using both deliberately.
      good: Understands that schemas cover shape and values cover behaviour.
      weak: Relies on one approach only and cannot explain its blind spots.
    followups:
      - How do you stop optional fields from making a schema check meaningless?
      - Where do you get the schema from, and who keeps it current?
    common_errors:
      - Assuming a passing schema check means the response is correct.

  - external_key: technical.qa.parallel_data_collisions
    competency_key: test_automation
    topic: Test data collisions in parallel runs
    difficulty: medium
    kind: scenario
    text: >-
      Your suite was stable when it ran serially, but after you turned on parallel execution, tests started
      failing because they share the same user accounts and records. How would you redesign the test data?
    expected_concepts:
      - each test creates its own data
      - unique identifiers per run or worker
      - setup through APIs rather than the UI
      - cleanup or disposable data
      - avoiding order dependencies between tests
      - limited pools with locking only where creation is impossible
    rubric:
      excellent: Moves to per-test data created through APIs with unique keys, handles cleanup or isolation, removes inter-test dependencies, and has a fallback such as leased accounts for resources that can't be created.
      good: Proposes unique data per test and cleanup.
      weak: Turns parallelism back off or adds more retries.
    followups:
      - Some accounts must be provisioned by another team and you only have ten. What then?
      - How do you stop leftover test data from piling up in the environment?
    common_errors:
      - Cleaning up in teardown only, so a crashed test leaves data that breaks the next run.

  - external_key: technical.qa.synthetic_vs_masked_data
    competency_key: test_automation
    topic: Synthetic versus masked production data
    difficulty: medium
    kind: technical
    text: >-
      When do you use synthetic generated data for testing and when do you use masked copies of production
      data? What are the trade-offs you've run into?
    expected_concepts:
      - synthetic data is safe, controllable and repeatable
      - production-like data finds real-world edge cases
      - masking quality and re-identification risk
      - referential integrity after masking
      - size and refresh cost of copies
    rubric:
      excellent: Weighs control, realism, privacy and cost, explains masking pitfalls such as broken relationships and re-identification, and gives a real choice they made and why.
      good: Explains both options and the privacy concern with real data.
      weak: Copies raw production data without considering privacy, or never considers realism.
    followups:
      - How would you test with realistic data volumes without copying production?
      - What would you check before trusting a masked dataset?
    common_errors:
      - Assuming masking only names and emails is enough to protect personal data.

  - external_key: technical.qa.flaky_quarantine
    competency_key: test_automation
    topic: Quarantining flaky tests
    difficulty: medium
    kind: technical
    text: >-
      Some teams quarantine flaky tests so they stop blocking merges. How would you run a quarantine process
      so it doesn't just become a place where tests go to die?
    expected_concepts:
      - automatic detection of flaky tests from history
      - quarantined tests still run but don't block
      - an owner and a deadline per quarantined test
      - visibility through dashboards or tickets
      - fix, rewrite or delete decisions
      - limit on quarantine size
    rubric:
      excellent: Describes detection, non-blocking execution, named owners with time limits, a visible backlog and an explicit fix-or-delete rule, and notes the coverage risk while a test is quarantined.
      good: Quarantines with tickets and owners.
      weak: Simply disables or skips flaky tests with no follow-up.
    followups:
      - What would you do with a flaky test that covers the payment flow?
      - How would you measure whether quarantine is actually improving the suite?
    common_errors:
      - Forgetting that a quarantined test leaves a coverage hole for real regressions.

  - external_key: technical.qa.ci_only_ui_flakiness
    competency_key: test_automation
    topic: UI tests flaky only in CI
    difficulty: medium
    kind: scenario
    text: >-
      Your browser tests pass every time on your laptop, but about eight percent of runs fail in CI with
      timeouts and missing elements. How would you investigate?
    expected_concepts:
      - collecting traces, videos, screenshots and logs from CI
      - CI resource limits and slower machines
      - headless versus headed differences and screen size
      - shared environment and data contention
      - parallel workers interfering
      - reproducing with CI-like constraints locally
    rubric:
      excellent: Gathers artefacts first, lists environmental differences (CPU, headless mode, viewport, parallelism, shared data, network), reproduces under similar constraints and fixes the root cause rather than raising timeouts.
      good: Checks CI logs and screenshots and suspects timing or environment differences.
      weak: Increases timeouts or adds retries without investigating.
    followups:
      - How would you reproduce CI conditions on your own machine?
      - The failures cluster at certain times of day. What does that suggest?
    common_errors:
      - Raising global timeouts, which hides the cause and slows every run.

  - external_key: technical.qa.pr_vs_release_gates
    competency_key: ci_cd
    topic: Quality gates per pipeline stage
    difficulty: medium
    kind: technical
    text: >-
      Which quality checks would you make blocking on every pull request, and which would you run later in
      the pipeline before a release? How do you decide?
    expected_concepts:
      - fast deterministic checks on pull requests
      - lint, unit, component and contract tests early
      - broader integration, end-to-end and performance later
      - time budget for pull request feedback
      - gates must be trustworthy to be blocking
      - security and dependency scans
    rubric:
      excellent: Places checks by speed, reliability and risk, sets a feedback time budget, explains that only trustworthy checks should block, and describes what happens when a late-stage gate fails.
      good: Sensible split of fast checks early and slow checks later.
      weak: Runs everything on every commit or has no blocking gates at all.
    followups:
      - A slow end-to-end suite keeps catching real bugs late. How would you move that signal earlier?
      - Who is allowed to override a failing gate, and how is that recorded?
    common_errors:
      - Making a flaky check blocking, which trains people to ignore or bypass gates.

  - external_key: technical.qa.coverage_gate_debate
    competency_key: ci_cd
    topic: Code coverage thresholds
    difficulty: medium
    kind: scenario
    text: >-
      An engineering manager wants to block every merge that drops code coverage below eighty percent. How
      would you respond, and what would you propose?
    expected_concepts:
      - coverage shows what isn't tested, not test quality
      - gaming through assertion-free tests
      - diff or new-code coverage rather than global numbers
      - risk-weighted targets per area
      - combining with review and mutation testing
    rubric:
      excellent: Acknowledges the goal, explains the limits and gaming risk of a global threshold, proposes alternatives such as new-code coverage, critical-path targets or mutation scores, and frames it constructively for the manager.
      good: Explains that coverage doesn't measure quality and suggests a softer or diff-based gate.
      weak: Accepts any threshold without discussion, or dismisses coverage entirely.
    followups:
      - How would you show the manager a case where high coverage still missed a bug?
      - What number, if any, would you track instead?
    common_errors:
      - Equating line coverage with having tested the behaviour.

  - external_key: technical.qa.slow_regression_suite
    competency_key: test_automation
    topic: Shrinking a slow regression suite
    difficulty: medium
    kind: scenario
    text: >-
      The regression suite takes three hours, so developers only see results the next morning. You're asked
      to get meaningful feedback within twenty minutes. How would you approach it?
    expected_concepts:
      - measuring where the time goes
      - parallelising and sharding
      - pushing checks down to API or unit level
      - removing redundant or low-value tests
      - faster setup through APIs and seeded data
      - tiering into a fast critical set and a fuller later run
    rubric:
      excellent: Starts with data on the slowest and least valuable tests, combines sharding, moving checks down the pyramid, faster setup and pruning, and keeps a full run on a slower schedule so coverage isn't silently lost.
      good: Proposes parallelism and a smaller smoke subset.
      weak: Simply deletes tests to hit the target or buys more machines without analysis.
    followups:
      - How would you prove the twenty-minute set still catches most real regressions?
      - What would you do with tests that are slow because the application itself is slow?
    common_errors:
      - Parallelising tests that share state, which trades slowness for flakiness.

  # ------------------------------------------------------------------ hard
  - external_key: technical.qa.org_quality_strategy
    competency_key: test_automation
    topic: Quality strategy across many teams
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You join a company as its first quality engineering lead. There are twenty product teams, each testing
      in its own way, and customers are complaining about regressions. How would you shape a quality strategy
      over your first few months?
    expected_concepts:
      - discovery through escaped defects and incident data
      - identifying the riskiest products and journeys
      - shared principles rather than one mandated tool
      - quick wins on the worst pain points
      - quality metrics with baselines
      - teams owning quality with enablement from the centre
    rubric:
      excellent: Starts with evidence from escaped defects and incidents, prioritises by risk, sets a few shared standards and metrics with baselines, delivers early wins, and builds team ownership rather than a central testing gate.
      good: Has a sensible plan to assess, standardise some practices and measure results.
      weak: Proposes forcing one tool on everyone or creating a separate QA team to test everything before release.
    followups:
      - How would you know after six months whether it worked?
      - One team strongly resists changing how they test. What do you do?
    common_errors:
      - Centralising all testing into a bottleneck team instead of enabling product teams.

  - external_key: technical.qa.contract_rollout_microservices
    competency_key: test_automation
    topic: Rolling out contract testing at scale
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      An organisation has about thirty microservices, a shared staging environment that's always broken, and
      slow end-to-end tests. You want to introduce contract testing. How would you roll it out and fit it into
      deployments?
    expected_concepts:
      - starting with the most critical or most-broken integrations
      - contract broker with versioned contracts
      - provider verification in provider pipelines
      - deployment safety check against what is in each environment
      - handling pending or work-in-progress contracts
      - reducing end-to-end tests once contracts are trusted
    rubric:
      excellent: Plans an incremental rollout starting with high-value pairs, explains broker, versioning, provider verification and pre-deploy compatibility checks, handles new contracts without breaking providers, and describes shrinking the end-to-end suite as trust grows.
      good: Explains broker, provider verification and an incremental adoption plan.
      weak: Proposes writing contracts for everything at once with no deployment integration.
    followups:
      - How do you handle asynchronous message contracts as well as HTTP?
      - What would you keep in end-to-end tests even after contracts are in place?
    common_errors:
      - Running contract verification but never checking compatibility at deploy time.

  - external_key: technical.qa.provider_breaking_change
    competency_key: api_design
    topic: Managing a breaking API change
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A provider team needs to rename a field that five consumer services rely on, and some consumers are
      mobile apps that users don't update quickly. How would you make sure the change ships without breaking
      anyone, from a testing point of view?
    expected_concepts:
      - expand and contract change in steps
      - supporting old and new fields in parallel
      - contract tests per consumer version
      - tracking which client versions are still in use
      - deprecation timeline and monitoring
      - testing old app versions against the new API
    rubric:
      excellent: Lays out an expand-and-contract sequence, uses consumer contracts and usage telemetry to know when the old field can go, explicitly tests older mobile versions, and describes monitoring after each step.
      good: Proposes keeping both fields for a period and testing consumers before removal.
      weak: Suggests coordinating a simultaneous release of everything, or ignores old mobile clients.
    followups:
      - How would you test against app versions that are two years old?
      - What signal would tell you it's safe to remove the old field?
    common_errors:
      - Forgetting that mobile clients in the field cannot be upgraded on the provider's schedule.

  - external_key: technical.qa.flakiness_program
    competency_key: test_automation
    topic: Reducing flakiness across an organisation
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Across your organisation, roughly one in seven main-branch builds is red because of flaky tests, and
      developers have started re-running pipelines by habit. How would you tackle flakiness as a program
      rather than one test at a time?
    expected_concepts:
      - measuring flake rate per test from CI history
      - ranking by impact on builds and developer time
      - categorising root causes
      - ownership routed to the teams that own the tests
      - quarantine with deadlines and blocking rules for new flaky tests
      - shared fixes for common causes such as waits and data
      - tracking trust metrics over time
    rubric:
      excellent: Builds flake detection from CI data, prioritises by cost, classifies causes and fixes shared root causes centrally, routes the rest to owners with deadlines, prevents new flaky tests from landing, and reports progress with a clear metric.
      good: Measures flaky tests, assigns owners and introduces quarantine.
      weak: Adds automatic retries everywhere and calls it solved.
    followups:
      - What would you do to stop newly written tests from being flaky in the first place?
      - How would you show leadership the cost of flakiness in engineering time?
    common_errors:
      - Blanket retries that hide real intermittent product bugs such as race conditions.

  - external_key: technical.qa.nondeterminism_sources
    competency_key: debugging
    topic: Hunting non-deterministic test failures
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Some test failures only appear once in a few hundred runs. What sources of non-determinism do you look
      for, and what techniques have you used to reproduce failures that rare?
    expected_concepts:
      - time and timezone dependence
      - test ordering and shared global state
      - concurrency and async timing
      - random data without fixed seeds
      - external services and network
      - stress loops, randomised order and logging seeds to reproduce
    rubric:
      excellent: Lists concrete categories (clock, ordering, shared state, concurrency, unseeded randomness, external calls), and describes techniques such as running the test in a loop under load, shuffling order, recording seeds and adding targeted logging, with a real example.
      good: Names several causes and at least one way to reproduce.
      weak: Can only suggest re-running or increasing timeouts.
    followups:
      - How would you tell a flaky test apart from a real race condition in the product?
      - What would you log to make the next occurrence diagnosable?
    common_errors:
      - Dismissing rare failures as noise when they point to a real concurrency bug.

  - external_key: technical.qa.latency_regression_isolation
    competency_key: debugging
    topic: Isolating a performance regression
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After a release, your load test shows the ninety-ninth percentile response time on the search endpoint
      has doubled, while the median barely moved. How would you track down the cause?
    expected_concepts:
      - comparing builds under identical load and data
      - tail latency points to contention, garbage collection or slow dependencies
      - tracing and profiling the slow requests
      - database query plans and connection pools
      - bisecting the changes between releases
      - confirming the fix with a repeat run
    rubric:
      excellent: Confirms the regression is real with controlled repeat runs, explains what tail-only regressions usually mean, uses traces, profiles and resource metrics to locate the slow component, bisects commits, and verifies the fix the same way.
      good: Compares releases and uses monitoring or profiling to find the slow part.
      weak: Looks only at averages or guesses at the cause without evidence.
    followups:
      - How would you rule out noise in the test environment itself?
      - What would you add to the pipeline so this is caught before release next time?
    common_errors:
      - Comparing runs with different data volumes or environment sizes.
