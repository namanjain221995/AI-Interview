# Site reliability engineering, part 1: SLIs, observability foundations, first incident skills.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [sre]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.sre.sli_from_user_journey
    competency_key: observability
    topic: Choosing SLIs from a user journey
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Think of a user journey you've supported, something like signing in and loading a home page. How did
      you decide which indicators really reflect what the user experiences, as opposed to what the servers
      are doing?
    expected_concepts:
      - start from the user journey, not from available infrastructure metrics
      - success ratio and latency as typical indicators
      - measuring as close to the user as practical (load balancer, client, synthetic)
      - defining what counts as a good event versus a valid event
      - excluding traffic that should not count, such as health probes or bad client requests
    rubric:
      excellent: Walks through a real journey, defines good and valid events precisely, explains where the measurement is taken and why, and discusses what was deliberately excluded.
      good: Picks sensible availability and latency indicators for the journey with a reasonable measurement point.
      weak: Lists CPU, memory or uptime of hosts as the indicators, or cannot connect metrics to user experience.
    followups:
      - Which requests would you exclude from the denominator, and why?
      - What would change if most of your users were on a mobile app?
    common_errors:
      - Counting 4xx caused by bad client input as service failures.
      - Measuring only at the application server and missing load balancer or network failures.

  - external_key: technical.sre.sli_slo_sla_in_practice
    competency_key: observability
    topic: SLIs, SLOs and SLAs in practice
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Using a service you've worked on as the example, explain how its indicators, internal objectives and
      any contractual commitments related to each other, and who in the organisation cared about each one.
    expected_concepts:
      - SLI as the measurement, SLO as the internal target, SLA as the external promise with consequences
      - SLOs set tighter than SLAs to leave a safety margin
      - engineering owns SLOs, business or legal owns SLAs
      - SLOs used to guide prioritisation and release risk
    rubric:
      excellent: Uses a concrete service to show how the three layers fit, explains why the internal target is stricter than the contract, and names who used each for which decisions.
      good: Correctly distinguishes the three and gives a plausible example.
      weak: Uses the terms interchangeably or cannot relate them to a real service.
    followups:
      - What happens in practice when the SLO is missed but the SLA is still met?
      - Why might a service have an SLO but no SLA at all?
    common_errors:
      - Setting the internal objective equal to the contractual commitment, leaving no margin.

  - external_key: technical.sre.first_metrics_new_service
    competency_key: observability
    topic: Instrumenting a new service
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you instrument a brand-new service from scratch, which metrics do you add first, and how do you
      decide on their names and labels?
    expected_concepts:
      - request rate, errors and duration per endpoint (RED)
      - utilisation, saturation and errors for resources (USE)
      - histograms rather than precomputed averages for latency
      - bounded, low-cardinality labels such as route, method and status class
      - consistent naming conventions and units
    rubric:
      excellent: Names a clear starting set grounded in RED and USE, explains histogram use for latency, and shows deliberate label choices that avoid unbounded cardinality.
      good: Covers rate, errors and latency with sensible labels.
      weak: Lists only CPU and memory, or proposes labels such as user id or full URL.
    followups:
      - Which saturation signal would you add for a service that reads from a queue?
      - How would you label errors so they are useful without exploding the series count?
    common_errors:
      - Using the raw request path with ids as a label.

  - external_key: technical.sre.severity_for_partial_degradation
    competency_key: incident_response
    topic: Severity for a partial degradation
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You're on call and support tells you image uploads are slow for some users, though they do eventually
      succeed. How would you decide how serious this is and what to do next?
    expected_concepts:
      - quantify scope from metrics (share of users, regions, platforms)
      - compare against SLOs and severity definitions
      - check recent changes and dependencies such as storage
      - decide whether to declare an incident and who to inform
      - set a time to re-evaluate severity as information arrives
    rubric:
      excellent: Quantifies impact with data before choosing a severity, maps it to defined levels, starts the right communication, and revisits severity as the picture changes.
      good: Checks metrics to confirm scope and picks a reasonable severity with some communication.
      weak: Ignores it because uploads succeed, or escalates to the highest severity without checking scope.
    followups:
      - What would make you raise the severity an hour later?
      - Who would you tell, and what would the first message say?
    common_errors:
      - Treating anything that eventually succeeds as having no user impact.

  - external_key: technical.sre.useful_log_lines
    competency_key: observability
    topic: Making logs useful during incidents
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What makes a log line genuinely useful when you're debugging at two in the morning, and what changes
      have you made to a service's logging to get there?
    expected_concepts:
      - structured logs (key-value or JSON) instead of free text
      - request or trace ids for correlation
      - consistent fields such as service, version, level and error type
      - logging decisions and failures with context, not every step
      - avoiding secrets and personal data in logs
    rubric:
      excellent: Describes concrete improvements made (structure, correlation ids, consistent fields, removing noise and sensitive data) and how they shortened a real investigation.
      good: Knows structured logging and correlation ids and why they help.
      weak: Thinks more log volume is always better, or has never changed logging.
    followups:
      - How do you stop logs from leaking tokens or customer data?
      - How do you deal with one noisy component flooding the log pipeline?
    common_errors:
      - Logging full request bodies, including credentials or personal data.

  - external_key: technical.sre.oncall_dashboard_redesign
    competency_key: observability
    topic: Designing an on-call dashboard
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've inherited a service whose main dashboard has forty graphs, and new on-call engineers say they
      can't tell whether anything is wrong. How would you redesign it?
    expected_concepts:
      - top row of user-facing signals tied to SLOs
      - drill-down from overview to component dashboards
      - consistent time ranges, units and thresholds marked
      - deploy and change annotations
      - removing or moving graphs nobody uses
    rubric:
      excellent: Proposes a layered design starting from user-facing health against the SLO, adds change annotations and drill-downs, and validates the design with the people on call.
      good: Groups graphs sensibly and puts the most important user-facing signals first.
      weak: Adds more graphs or only changes colours and layout cosmetically.
    followups:
      - How would you find out which of the forty graphs anyone actually uses?
      - What belongs on the overview versus a debugging dashboard?
    common_errors:
      - Leading with host-level resource graphs instead of user-facing signals.

  - external_key: technical.sre.synthetic_probes
    competency_key: observability
    topic: Synthetic and black-box monitoring
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When would you add synthetic probes that exercise a service from the outside, alongside its internal
      metrics, and what kinds of problems have they caught for you that internal metrics missed?
    expected_concepts:
      - black-box view of what users see
      - catches DNS, TLS, CDN and load balancer failures
      - detects outages when there is no traffic to measure
      - probing from multiple locations
      - keeping probes realistic but cheap, and avoiding test data pollution
    rubric:
      excellent: Explains the black-box versus white-box trade-off, gives concrete failure classes probes catch (expired certificate, DNS, zero traffic), and discusses probe placement and limits.
      good: Knows probes check from outside and gives at least one example of their value.
      weak: Sees probes as a replacement for metrics or cannot say what they add.
    followups:
      - Why can a probe pass while real users still fail?
      - Would you page on a single failing probe location?
    common_errors:
      - Paging on a single failed probe from one location, causing noisy alerts.

  - external_key: technical.sre.runbook_quality
    competency_key: incident_response
    topic: Runbooks that stay useful
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What goes into a runbook that actually helps the person who gets paged, and how have you kept
      runbooks from going stale?
    expected_concepts:
      - what the alert means and its user impact
      - first diagnostic steps with links to dashboards and queries
      - safe mitigation actions and when to escalate
      - linked directly from the alert
      - reviewed after incidents and owned by the team
    rubric:
      excellent: Describes a concise runbook structure linked from alerts, covers diagnosis, mitigation and escalation, and has a working mechanism (post-incident updates, ownership, review) to keep it current.
      good: Covers diagnosis and mitigation steps and mentions linking from alerts.
      weak: Describes runbooks as long wiki pages or has no way of keeping them current.
    followups:
      - When would you turn a runbook step into automation instead?
      - How do you know a runbook is wrong before an incident proves it?
    common_errors:
      - Writing runbooks once at launch and never updating them after incidents.

  # ---------------------------------------------------------------- medium
  - external_key: technical.sre.error_budget_policy
    competency_key: observability
    topic: Writing an error budget policy
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you write an error budget policy that product and engineering leaders actually agree to
      follow, and what should it say happens when the budget runs out?
    expected_concepts:
      - agreed in advance and signed off by product and engineering leadership
      - clear thresholds and actions (slow releases, freeze risky changes, reliability work)
      - exceptions such as security fixes and outages caused by dependencies
      - escalation path when teams disagree
      - periodic review of whether the SLO itself is right
    rubric:
      excellent: Describes a policy negotiated before it is needed, with specific graduated actions, explicit exceptions and an escalation path, and explains how it is reviewed when the SLO proves wrong.
      good: Defines what happens when the budget is exhausted and who agrees to it.
      weak: Treats the budget as a dashboard number with no consequences, or proposes a blanket freeze with no exceptions.
    followups:
      - What would you do if a team blew its budget because of another team's dependency?
      - How should the policy treat a single huge outage versus slow steady burn?
    common_errors:
      - Writing the policy without product leadership, so nobody honours it.

  - external_key: technical.sre.unrealistic_slo_target
    competency_key: observability
    topic: Negotiating an unrealistic SLO
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A product manager asks for four nines on a new internal service, but it depends on a database that
      only offers three nines. How would you handle that conversation?
    expected_concepts:
      - serial dependencies multiply availability downwards
      - what four nines means in minutes of allowed downtime
      - asking what users actually need and what it costs
      - options such as caching, redundancy or graceful degradation to exceed a dependency
      - agreeing on a target backed by data
    rubric:
      excellent: Explains the composition maths with numbers, turns the conversation to real user need and cost, and offers concrete architecture options if the higher target is truly justified.
      good: Points out that the dependency limits achievable availability and proposes a lower target.
      weak: Accepts the target without question or refuses without explaining why.
    followups:
      - Roughly how many minutes a month is the difference between three and four nines?
      - How could a service legitimately be more available than one of its dependencies?
    common_errors:
      - Ignoring that a serial dependency caps the achievable availability.

  - external_key: technical.sre.latency_sli_measurement
    competency_key: observability
    topic: Measuring a latency SLI correctly
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you turn latency into an SLI you can set an objective on, and what are the details people often
      get wrong when they measure it?
    expected_concepts:
      - threshold form such as the share of requests faster than 300 ms
      - histograms with bucket boundaries near the threshold
      - percentiles cannot be averaged across instances or windows
      - measure where the user experiences it, including queueing time
      - separating fast failures from successful requests
    rubric:
      excellent: Frames latency as a proportion of good requests, explains histogram buckets and why percentiles cannot be averaged, and covers measurement point and fast-failure distortion.
      good: Uses percentiles or thresholds sensibly and knows averages hide tail latency.
      weak: Proposes average response time as the SLI.
    followups:
      - Why can a spike of fast errors make your latency look better?
      - How do bucket boundaries affect the accuracy of your SLI?
    common_errors:
      - Averaging per-host p99 values to get a fleet p99.

  - external_key: technical.sre.cardinality_explosion
    competency_key: observability
    topic: Metric cardinality explosion
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your metrics backend starts running out of memory and queries time out, and you suspect a series
      explosion. How would you find the cause and stop it from happening again?
    expected_concepts:
      - query the backend for top series counts by metric and label
      - identify unbounded labels such as ids, URLs or error messages
      - drop or relabel at scrape or ingestion time as immediate relief
      - fix the instrumentation at the source
      - guardrails such as per-target series limits and review of new metrics
    rubric:
      excellent: Finds the offending metric and label with backend tooling, applies immediate relief via relabelling or limits, fixes the source, and adds lasting guardrails.
      good: Identifies high-cardinality labels as the likely cause and removes them.
      weak: Only scales the metrics backend up or deletes data without finding the cause.
    followups:
      - How would you still answer questions that needed that per-user label?
      - What limit would you set per scrape target, and what happens when it is hit?
    common_errors:
      - Raising memory limits on the metrics backend without finding the offending label.

  - external_key: technical.sre.trace_sampling_strategy
    competency_key: observability
    topic: Trace sampling strategy
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Keeping every trace is too expensive for a high-traffic system. How would you decide what to sample,
      and what do you lose with each approach?
    expected_concepts:
      - head-based probabilistic sampling and its simplicity
      - tail-based sampling to keep errors and slow requests
      - collector memory and complexity cost of tail sampling
      - consistent sampling decisions propagated across services
      - keeping rare but important traffic (low-volume endpoints)
    rubric:
      excellent: Compares head and tail sampling with their costs, explains propagating the decision across services, and designs rules that keep errors, slow requests and rare endpoints.
      good: Knows the difference between head and tail sampling and when each fits.
      weak: Proposes a flat low percentage without considering what gets lost.
    followups:
      - How would you make sure a trace for a specific failing customer request is kept?
      - What breaks if each service makes its own sampling decision?
    common_errors:
      - Sampling independently in each service, producing broken partial traces.

  - external_key: technical.sre.mitigate_before_cause
    competency_key: incident_response
    topic: Mitigation options before root cause
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Error rates on an API have been climbing for twenty minutes, and there have been no deploys in the
      last day. What mitigation options would you consider before you understand the cause?
    expected_concepts:
      - look beyond deploys (config, feature flags, traffic shifts, dependencies, certificates)
      - shift traffic away from a bad zone or instance
      - scale out or shed lower-priority load
      - disable features or fall back to degraded mode
      - weigh the risk of each mitigation and keep notes of what was changed
    rubric:
      excellent: Widens the search for changes beyond deploys and lists several mitigations with their risks, choosing based on what the signals show, while keeping a record of every action.
      good: Suggests a couple of reasonable mitigations and checks other kinds of change.
      weak: Only digs for root cause, or restarts everything without a hypothesis.
    followups:
      - Which non-deploy changes would you check first?
      - How do you avoid making things worse with a mitigation?
    common_errors:
      - Assuming nothing changed because there was no code deploy.

  - external_key: technical.sre.retry_storm_recovery
    competency_key: distributed_systems
    topic: Retry storms after a dependency blip
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A downstream dependency had a two-minute blip, but your service stayed broken for thirty minutes after
      the dependency recovered. What could explain that, and how would you fix it?
    expected_concepts:
      - retries multiplying load across layers
      - queued or backlogged work arriving all at once
      - exponential backoff with jitter and retry budgets
      - circuit breakers and timeouts aligned across layers
      - recovering by shedding load or temporarily reducing traffic
    rubric:
      excellent: Explains retry amplification and backlog effects clearly, proposes backoff with jitter, retry budgets and circuit breakers, and describes how to get out of the stuck state during the incident.
      good: Identifies retries or backlog as the likely cause and suggests backoff.
      weak: Blames the dependency and does not see why recovery was delayed.
    followups:
      - If three layers each retry three times, how much load does one user request create?
      - How would you get the system out of that state while it is happening?
    common_errors:
      - Retrying at every layer of the stack.

  - external_key: technical.sre.capacity_forecast
    competency_key: system_design
    topic: Building a capacity forecast
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you build a capacity forecast for a service for the next six months, and how would you know
      if the forecast is going wrong?
    expected_concepts:
      - historical demand trends and seasonality
      - business inputs such as launches, marketing and customer onboarding
      - mapping demand to the limiting resource
      - provisioning lead times and headroom
      - comparing actuals to forecast and revising regularly
    rubric:
      excellent: Combines organic trend, seasonality and planned business events, maps demand to the actual bottleneck resource, accounts for lead time, and tracks forecast accuracy to revise it.
      good: Uses historical growth and adds headroom with some business input.
      weak: Extrapolates a single metric linearly or plans to react only when alerts fire.
    followups:
      - How do you identify which resource will run out first?
      - What would you do if a big customer is about to onboard with no usage history?
    common_errors:
      - Forecasting from CPU alone when another resource is the real bottleneck.

  - external_key: technical.sre.load_test_design
    competency_key: system_design
    topic: Designing a meaningful load test
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you design a load test that tells you something real about production capacity rather than just
      producing a nice number?
    expected_concepts:
      - clear question and success criteria tied to SLOs
      - realistic traffic mix, payloads and data volume
      - environment parity or explicit differences
      - ramping load to find the knee, not one fixed rate
      - observing resource saturation and dependencies during the run
    rubric:
      excellent: Starts from the question being answered, models realistic traffic and data, ramps to find the saturation point against SLOs, and explains how the environment differs from production.
      good: Mentions realistic traffic and measuring latency and errors as load increases.
      weak: Hammers one endpoint with a fixed rate and reports requests per second.
    followups:
      - How would you build a realistic traffic mix?
      - What would you watch on the dependencies while the test runs?
    common_errors:
      - Testing against an empty database or warm cache that production never has.

  - external_key: technical.sre.first_chaos_experiment
    competency_key: distributed_systems
    topic: Starting with chaos engineering
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      If you were introducing chaos engineering to a team that has never done it, how would you pick and run
      the first experiment?
    expected_concepts:
      - a stated hypothesis about steady-state behaviour
      - pick a failure the system is believed to tolerate
      - start in a non-production or low-risk scope
      - abort conditions and a rollback plan
      - sharing results and turning findings into work
    rubric:
      excellent: Defines steady state and a falsifiable hypothesis, chooses a low-risk but meaningful first fault, sets abort criteria, and explains how results become tracked fixes and build trust.
      good: Describes a controlled experiment with a hypothesis and a safety plan.
      weak: Proposes randomly breaking production with no hypothesis or safety measures.
    followups:
      - What would you do if the experiment immediately caused user-facing errors?
      - How would you get buy-in from a sceptical team?
    common_errors:
      - Running experiments without defining steady state, so results cannot be judged.

  - external_key: technical.sre.measure_toil
    competency_key: problem_solving
    topic: Measuring and prioritising toil
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your team says most of its week goes on manual operational work. How would you measure what that work
      actually is and decide what to automate first?
    expected_concepts:
      - characteristics of toil (manual, repetitive, automatable, scales with load)
      - collecting data from tickets, pages and time tracking
      - ranking by frequency, time cost and risk
      - eliminating the cause versus automating the task
      - tracking toil percentage over time
    rubric:
      excellent: Gathers real data on the work, classifies what is toil, ranks by cost and risk, considers removing the need entirely, and sets a measurable target.
      good: Proposes tracking the work and automating the most frequent tasks.
      weak: Jumps to automating whatever is most annoying without measuring.
    followups:
      - Give me an example of toil that's better removed than automated.
      - How would you show leadership that the effort paid off?
    common_errors:
      - Counting all operational work as toil, including valuable project or incident work.

  # ------------------------------------------------------------------ hard
  - external_key: technical.sre.multiwindow_burn_rate
    competency_key: observability
    topic: Multiwindow burn-rate alerting
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Design the paging alerts for a 99.9 percent, thirty-day availability SLO. Which burn rates and time
      windows would you use, and why?
    expected_concepts:
      - burn rate as the ratio of observed error rate to the budgeted rate
      - fast burn page (for example 14.4 over one hour) and slower burn page or ticket
      - pairing a long window with a short window so alerts reset quickly
      - budget consumed before detection and detection time trade-off
      - low-traffic and recording-rule considerations
    rubric:
      excellent: Explains burn rate precisely, picks justified thresholds and window pairs, shows how much budget is consumed before each alert fires, and explains why a short window prevents lingering alerts.
      good: Uses burn-rate alerts with at least two speeds and explains the general idea.
      weak: Alerts on a static error-rate threshold or on the budget being exhausted.
    followups:
      - How much of the monthly budget is gone when the fast-burn alert fires?
      - Why add the short window at all?
    common_errors:
      - Using only a long window, so the alert keeps firing long after recovery.

  - external_key: technical.sre.gray_failure
    competency_key: incident_response
    topic: Gray failure with green dashboards
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      All health checks are green and the dashboards look normal, yet several customers report intermittent
      failures. How would you approach a problem like that?
    expected_concepts:
      - gray failure where internal checks and user experience disagree
      - slicing by customer, region, client version and backend instance
      - reproducing from the customer side or synthetic checks
      - looking for a subset of bad instances or paths hidden by aggregates
      - improving checks and SLIs afterwards to catch it
    rubric:
      excellent: Recognises the gap between system view and user view, slices data to find the hidden subset, gets evidence from the customer side, and closes the detection gap afterwards.
      good: Breaks metrics down by dimensions and checks individual instances or routes.
      weak: Dismisses the reports because the dashboards are green.
    followups:
      - What dimensions would you slice by first, and why?
      - How would you change your health checks so this is caught next time?
    common_errors:
      - Trusting aggregate dashboards that average away a small broken subset.

  - external_key: technical.sre.overload_cascade
    competency_key: distributed_systems
    topic: Preventing cascading overload
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      One replica of a service slows down, the load balancer shifts its traffic to the others, they slow
      down too, and the whole fleet collapses. How would you redesign the system so that doesn't happen?
    expected_concepts:
      - load shedding and admission control at each instance
      - concurrency limits rather than pure request-rate limits
      - outlier detection and ejection in the load balancer
      - capacity headroom so losing instances does not overload the rest
      - prioritising critical traffic and degrading features
    rubric:
      excellent: Explains the cascade mechanism and combines per-instance shedding, adaptive concurrency limits, outlier ejection, headroom and prioritisation into a coherent design with trade-offs.
      good: Proposes load shedding or rate limiting and some headroom.
      weak: Only suggests adding more replicas.
    followups:
      - How should a server decide which requests to reject first?
      - How do you stop health checks from removing every instance at once?
    common_errors:
      - Retrying rejected requests immediately, which adds to the overload.

  - external_key: technical.sre.utilisation_and_queueing
    competency_key: system_design
    topic: Utilisation, queueing and headroom
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Why does latency often get sharply worse as a service approaches full utilisation, and how does that
      shape the utilisation targets you set for capacity planning?
    expected_concepts:
      - queueing delay grows non-linearly as utilisation nears 100 percent
      - variability of arrival and service times makes it worse
      - targets depend on the latency SLO, not a fixed percentage
      - headroom for failures and deploys on top of queueing margin
      - measuring saturation directly (queue depth, wait time)
    rubric:
      excellent: Explains the non-linear queueing effect and the role of variability, ties utilisation targets to the latency objective and failure headroom, and suggests measuring saturation directly.
      good: Knows latency rises steeply near full utilisation and sets a sensible target below it.
      weak: Believes running at 95 percent CPU is efficient and safe.
    followups:
      - Why might one service be fine at 80 percent while another struggles at 50?
      - What would you measure instead of CPU to see saturation?
    common_errors:
      - Using average CPU as the only capacity signal while queues build up.

  - external_key: technical.sre.observability_cost_cut
    competency_key: observability
    topic: Cutting observability cost
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your observability bill has grown much faster than traffic and finance wants it cut by forty percent.
      How would you approach that without losing the ability to debug incidents?
    expected_concepts:
      - break down cost by signal, team and source
      - find unused dashboards, metrics and high-volume low-value logs
      - sampling, retention tiers and aggregation
      - converting verbose logs to metrics where appropriate
      - per-team budgets or showback to keep it under control
    rubric:
      excellent: Starts with an attribution of cost, targets the biggest low-value sources, uses sampling, retention tiers and log-to-metric conversion, and adds ownership so costs do not creep back.
      good: Proposes reducing retention and log volume with some analysis.
      weak: Proposes cutting signals across the board without knowing what is used.
    followups:
      - How would you prove that removing data didn't hurt incident response?
      - What would you never cut?
    common_errors:
      - Cutting the data that incidents rely on because nobody checked usage first.

  - external_key: technical.sre.postmortem_trend_analysis
    competency_key: incident_response
    topic: Learning across many postmortems
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You have two years of postmortems for your organisation. How would you use them to decide where to
      invest in reliability next year?
    expected_concepts:
      - tagging incidents by contributing factor, detection and trigger
      - weighting by user impact and budget consumed, not just count
      - finding recurring themes (config changes, dependencies, capacity)
      - checking whether past action items were completed and effective
      - turning themes into a prioritised roadmap with expected impact
    rubric:
      excellent: Describes a structured analysis of contributing factors weighted by impact, checks follow-through on past actions, and turns recurring themes into a prioritised, measurable plan.
      good: Looks for recurring causes and proposes investment in the top ones.
      weak: Reads the most recent few postmortems and picks fixes intuitively.
    followups:
      - How would you deal with postmortems that were written inconsistently?
      - How would you measure whether the investments worked?
    common_errors:
      - Ranking themes by incident count only and ignoring severity and impact.
