# Curated questions: backend API design (gRPC, GraphQL, contracts, testing and developer experience).
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [backend]
questions:
  - external_key: technical.backend_apis.rest_grpc_graphql_choice
    competency_key: api_design
    topic: Choosing REST, gRPC or GraphQL
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide whether a new API should be REST, gRPC or GraphQL? Tell me about a choice you made
      and what drove it.
    expected_concepts:
      - "who the consumers are: browsers, partners or internal services"
      - binary protobuf, streaming and generated clients with gRPC
      - client-driven data fetching and aggregation with GraphQL
      - HTTP caching and broad tooling with REST
      - team experience and operational cost
    rubric:
      excellent: Grounds the choice in consumers, performance, caching and operational needs, gives a real decision with its trade-offs, and notes what they gave up.
      good: Describes the strengths of each with a sensible example.
      weak: Picks one by fashion or preference with no reasoning.
    followups:
      - What would make you regret choosing GraphQL?
      - Could you mix them in one system, and where would each live?
    common_errors:
      - Choosing gRPC for a public browser API without considering client support.

  - external_key: technical.backend_apis.protobuf_schema_evolution
    competency_key: api_design
    topic: Evolving protobuf contracts
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you evolve protobuf messages in a gRPC API without breaking existing clients and servers?
    expected_concepts:
      - never reuse or renumber field numbers
      - reserving removed field numbers and names
      - adding new optional fields
      - not changing field types
      - an unspecified zero value for enums
      - automated breaking-change checks such as buf breaking
    rubric:
      excellent: Explains wire compatibility through field numbers, reserves removed fields, handles enums and defaults safely, and automates checks in CI.
      good: Knows to add fields and never reuse field numbers.
      weak: Renames or renumbers fields freely, believing generated code keeps things safe.
    followups:
      - What happens when an old client receives a field it doesn't know?
      - Why should the first enum value mean 'unspecified'?
    common_errors:
      - Reusing the number of a deleted field for a new one.

  - external_key: technical.backend_apis.grpc_error_handling
    competency_key: api_design
    topic: gRPC errors
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do errors work in gRPC compared with HTTP status codes, and how do you give a client useful
      detail about what went wrong?
    expected_concepts:
      - gRPC status codes such as INVALID_ARGUMENT, NOT_FOUND, FAILED_PRECONDITION and UNAVAILABLE
      - rich error details such as google.rpc.Status with ErrorInfo or BadRequest
      - which codes are safe to retry
      - mapping to HTTP when transcoding
      - not leaking internal details
    rubric:
      excellent: Uses precise status codes, attaches structured details for clients, knows which codes are retryable, and keeps internal details out.
      good: Maps common failures to the right gRPC codes.
      weak: Returns UNKNOWN or INTERNAL for everything, or puts errors in a success response.
    followups:
      - When would you use FAILED_PRECONDITION versus INVALID_ARGUMENT?
      - How should a client react to UNAVAILABLE versus DEADLINE_EXCEEDED?
    common_errors:
      - Returning success with an error field inside the response message.

  - external_key: technical.backend_apis.grpc_streaming_use
    competency_key: api_design
    topic: gRPC streaming
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When would you use server streaming, client streaming or bidirectional streaming in gRPC instead of
      plain unary calls, and what operational problems come with streams?
    expected_concepts:
      - use cases such as large result sets, uploads and live updates
      - flow control and backpressure
      - long-lived streams versus load balancing
      - reconnecting and resuming from a position
      - deadlines and keepalives
      - proxy idle timeouts
    rubric:
      excellent: Matches each streaming mode to a real use case and covers backpressure, rebalancing, resume semantics and timeouts with examples from experience.
      good: Gives correct use cases for streaming and mentions at least one operational concern.
      weak: Uses streams everywhere or cannot say what they are for.
    followups:
      - How does a client resume a stream after a disconnect without missing messages?
      - How do you deploy a new version when clients hold streams open for hours?
    common_errors:
      - Streams without deadlines that hold resources forever.

  - external_key: technical.backend_apis.grpc_uneven_load
    competency_key: distributed_systems
    topic: Uneven load with gRPC
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After moving a service to gRPC on Kubernetes, you notice one backend pod gets almost all the traffic
      while the others sit idle. What's going on, and how would you fix it?
    expected_concepts:
      - HTTP/2 multiplexes requests over long-lived connections
      - connection-level load balancing pins clients to one pod
      - client-side load balancing with a headless service
      - a proxy or service mesh doing per-request balancing
      - maximum connection age to force rebalancing
      - behaviour after scaling events
    rubric:
      excellent: Explains why connection-level balancing fails with HTTP/2, compares client-side, proxy and mesh fixes with their costs, and covers rebalancing after scale-out.
      good: Identifies long-lived connections as the cause and proposes client-side or proxy balancing.
      weak: Suggests adding more pods or restarting without understanding the cause.
    followups:
      - Why does scaling out not help on its own?
      - What does a service mesh add here, and at what cost?
    common_errors:
      - Assuming the Kubernetes Service balances per request.

  - external_key: technical.backend_apis.exposing_grpc_externally
    competency_key: api_design
    topic: Exposing gRPC services to web and partner clients
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your internal services speak gRPC, but now web and partner clients need access to some of them. How
      would you expose these APIs?
    expected_concepts:
      - gRPC-Web or Connect for browsers
      - JSON transcoding through a gateway
      - a separate public REST facade with its own versioning
      - authentication at the edge
      - not exposing the internal surface wholesale
      - documentation for external developers
    rubric:
      excellent: Compares transcoding, gRPC-Web and a dedicated public facade, chooses with reasons about stability and audience, and avoids leaking internal contracts.
      good: Proposes a gateway with transcoding or gRPC-Web with sensible auth.
      weak: Opens internal gRPC ports directly to the internet.
    followups:
      - What happens to the public API when an internal service refactors its protos?
      - Which errors would external clients see, and in what format?
    common_errors:
      - Coupling the public contract directly to internal message definitions.

  - external_key: technical.backend_apis.graphql_n_plus_one
    competency_key: api_design
    topic: N+1 queries in GraphQL
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A GraphQL query that lists fifty orders with their customers and line items makes several hundred
      database queries. How would you fix it?
    expected_concepts:
      - N+1 caused by per-field resolvers
      - batching with DataLoader
      - per-request caching
      - joins or look-ahead at the query plan
      - monitoring query counts per operation
      - tests that assert query counts
    rubric:
      excellent: Explains how resolver structure causes N+1, batches with per-request loaders, considers look-ahead joins for hot paths, and adds monitoring or tests to stop regressions.
      good: Uses DataLoader to batch the lookups.
      weak: Adds caching or indexes without addressing the number of queries.
    followups:
      - Why must the loader be created per request?
      - How would you find the worst N+1 queries in production?
    common_errors:
      - Sharing a DataLoader cache across requests and users.

  - external_key: technical.backend_apis.graphql_expensive_queries
    competency_key: security
    topic: Expensive queries against public GraphQL
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you protect a public GraphQL API from clients sending queries that are deeply nested or
      enormously expensive?
    expected_concepts:
      - depth limits
      - cost or complexity analysis before execution
      - required pagination arguments with maximums
      - persisted queries or allow-lists
      - execution timeouts
      - rate limiting by cost rather than request count
    rubric:
      excellent: Combines static analysis (depth, cost) with persisted queries where possible, enforces pagination limits and timeouts, and limits clients by computed cost.
      good: Adds depth limits and timeouts.
      weak: Relies on request-count rate limits alone.
    followups:
      - How would you estimate the cost of a query before running it?
      - What do persisted queries cost you in flexibility?
    common_errors:
      - Counting requests rather than work, so one huge query costs the same as a tiny one.

  - external_key: technical.backend_apis.graphql_authorization
    competency_key: security
    topic: Authorization in GraphQL
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Where do you put authorization checks in a GraphQL API, given that the same object can be reached
      through many different query paths?
    expected_concepts:
      - checks in the business or data layer rather than only in root resolvers
      - per-type and per-field rules
      - consistent checks for node or id lookups
      - field-level protection for sensitive data
      - partial results with null and errors
      - tests covering several paths to the same object
    rubric:
      excellent: Pushes authorization down to where objects are loaded so every path is covered, adds field-level rules for sensitive data, and tests multiple access paths.
      good: Checks permissions on each type's resolver.
      weak: Checks only at the top-level query.
    followups:
      - A user can't see an order, but can they see it through a customer's orders field?
      - Would you hide unauthorised fields from the schema or return errors?
    common_errors:
      - Authorizing only the entry point of a query.

  - external_key: technical.backend_apis.graphql_schema_evolution
    competency_key: api_design
    topic: Evolving a GraphQL schema
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      GraphQL is often called versionless. How do you actually evolve a GraphQL schema that has many
      client apps in production, including old mobile versions?
    expected_concepts:
      - additive changes
      - the deprecated directive with a reason
      - field usage analytics per client and operation
      - nullability trade-offs
      - schema registry and breaking-change checks
      - the long tail of old mobile versions
    rubric:
      excellent: Uses field-level usage data to drive deprecation, checks changes against real operations in a registry, and plans for old mobile clients that can't be forced to upgrade.
      good: Adds fields and deprecates old ones before removal.
      weak: Removes or renames fields whenever the web client no longer needs them.
    followups:
      - Is changing a field from nullable to non-null safe?
      - How would you know no client still uses a deprecated field?
    common_errors:
      - Removing fields based only on the current version of the clients.

  - external_key: technical.backend_apis.graphql_errors_and_caching
    competency_key: api_design
    topic: Errors, monitoring and caching in GraphQL
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      GraphQL usually returns HTTP 200 even when parts of a query fail, and most requests are POSTs. How
      does that change the way you handle errors, monitoring and caching compared with REST?
    expected_concepts:
      - partial data with an errors array
      - error codes in extensions instead of HTTP status
      - modelling expected domain errors as typed results in the schema
      - per-operation metrics
      - POST requests bypass HTTP and CDN caches
      - persisted queries over GET and normalised client caches
    rubric:
      excellent: Explains partial results and how to monitor them, models domain errors in the schema, sets up per-operation metrics, and restores caching through persisted GET queries and client caches.
      good: Knows status codes don't reflect errors and monitors the errors array.
      weak: Monitors only HTTP status codes and sees no errors.
    followups:
      - How would you set an alert for a GraphQL operation that is failing?
      - When would you put an error in the schema versus the errors array?
    common_errors:
      - Dashboards based on HTTP status that show the API as healthy during failures.

  - external_key: technical.backend_apis.consumer_driven_contracts
    competency_key: testing
    topic: Consumer-driven contract testing
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you use contract testing to let a team change its API safely when several other teams
      depend on it?
    expected_concepts:
      - consumer-driven contracts such as Pact
      - consumers publish the interactions they rely on
      - provider verification in CI
      - a broker and checks before deploying
      - contracts cover only what consumers use
      - complementing, not replacing, integration tests
    rubric:
      excellent: Describes the full workflow from consumer expectations to provider verification and deployment gating, and is clear about what contract tests do and don't catch.
      good: Explains consumer contracts verified by the provider in CI.
      weak: Equates contract testing with validating against an OpenAPI file once.
    followups:
      - What do contract tests miss that end-to-end tests catch?
      - How do you handle a consumer whose contract blocks a needed change?
    common_errors:
      - Contracts that assert on every field rather than those the consumer uses.

  - external_key: technical.backend_apis.spec_first_vs_code_first
    competency_key: api_design
    topic: Spec-first versus code-first
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me about the trade-offs between writing an OpenAPI or protobuf definition first and generating
      the spec from code. Which have you used, and how did it go?
    expected_concepts:
      - spec-first enables design review and parallel work with mocks
      - code generation for servers and clients
      - drift risk with code-first annotations
      - validating the spec in CI
      - a single source of truth for the contract
    rubric:
      excellent: Compares both approaches from experience, explains how drift was prevented, and describes how the spec fed reviews, mocks, generation and tests.
      good: Describes one approach with its main benefits and drawbacks.
      weak: Has never kept a spec, or treats documentation as an afterthought.
    followups:
      - How did you keep the spec and implementation from drifting apart?
      - Who reviewed the spec, and at what stage?
    common_errors:
      - A hand-maintained spec that no test checks against the implementation.

  - external_key: technical.backend_apis.endpoint_test_coverage
    competency_key: testing
    topic: Testing an API endpoint thoroughly
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What would a good automated test suite for a REST endpoint cover beyond the happy path?
    expected_concepts:
      - validation errors and boundary values
      - missing or invalid authentication
      - access to another user's resources
      - status codes, headers and error format
      - conflicts, retries and idempotency
      - pagination edges and response schema conformance
    rubric:
      excellent: Covers validation, authentication, authorization, contract shape and concurrency cases with concrete examples, and explains which test level each belongs at.
      good: Includes error and authentication cases as well as the happy path.
      weak: Tests only the successful response.
    followups:
      - Which of these would you test at unit level and which through HTTP?
      - How do you test that one user can't reach another user's data?
    common_errors:
      - Skipping authorization tests because authentication is tested.

  - external_key: technical.backend_apis.authorization_test_matrix
    competency_key: testing
    topic: Testing authorization at scale
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you test authorization across an API with dozens of endpoints and several roles, so that a
      missing check doesn't slip through?
    expected_concepts:
      - role and endpoint matrix as data-driven tests
      - deny by default
      - enumerating every registered route automatically
      - cross-tenant and cross-user object tests
      - unit tests for policies
      - failing CI when a route has no declared policy
    rubric:
      excellent: Builds systematic, data-driven coverage that discovers routes automatically, so a new endpoint without a policy fails the build, and includes object-level cases.
      good: Writes tests for each role against important endpoints.
      weak: Tests a handful of endpoints manually.
    followups:
      - How do you make sure a newly added endpoint is included automatically?
      - How would you keep the matrix maintainable as roles grow?
    common_errors:
      - A hand-written list of endpoints that falls out of date.

  - external_key: technical.backend_apis.launch_load_test
    competency_key: testing
    topic: Load testing an API before launch
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Before a big marketing launch, you're asked to prove that your API can handle ten times today's
      traffic. How would you plan and run the load test?
    expected_concepts:
      - a realistic traffic mix derived from production
      - a production-like environment and data volume
      - ramp, peak and soak phases
      - p95 and p99 latency and error rates against targets
      - finding the first bottleneck such as database or pools
      - third-party limits and autoscaling behaviour
    rubric:
      excellent: Designs a realistic test, defines pass criteria up front, finds and fixes the first bottlenecks iteratively, and accounts for dependencies and autoscaling.
      good: Runs a ramped test with realistic traffic and watches latency and errors.
      weak: Hammers one endpoint from a laptop and reports requests per second.
    followups:
      - How would you avoid hitting a third-party provider with test traffic?
      - The test passes, but the database is at 90 percent CPU — what now?
    common_errors:
      - Testing against a small database that hides real query costs.

  - external_key: technical.backend_apis.type_change_broke_clients
    competency_key: testing
    topic: Preventing response shape regressions
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A mobile app crashed in production because your API started returning a field as a string instead of
      a number. How would you stop this kind of change from slipping through again?
    expected_concepts:
      - validating responses against the spec in tests
      - contract tests with consumers
      - typed response models
      - spec diffs in CI
      - tolerant parsing on the client side
    rubric:
      excellent: Finds the gap that let the change through, adds automated response-shape checks and contract tests, and suggests client-side resilience as a second layer.
      good: Adds schema validation of responses in tests.
      weak: Asks developers to be more careful.
    followups:
      - How do you fix the clients that are already crashing?
      - Who should have caught this, and at what stage?
    common_errors:
      - Fixing only the one field without adding a check.

  - external_key: technical.backend_apis.api_fuzzing
    competency_key: testing
    topic: Fuzzing and property-based API testing
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you use property-based testing or fuzzing against your API, and what kinds of bugs would
      you expect it to find?
    expected_concepts:
      - generating inputs from the OpenAPI schema, for example with Schemathesis
      - invariants such as no 5xx and schema-conformant responses
      - stateful sequences of calls
      - unusual Unicode, huge values and boundary cases
      - shrinking failures to minimal examples
      - running in CI with a time budget
    rubric:
      excellent: Defines useful properties beyond 'doesn't crash', uses schema-driven and stateful generation, and explains how failures are reproduced and triaged in CI.
      good: Generates inputs from the schema and checks for server errors.
      weak: Has no clear idea of what properties to check.
    followups:
      - What property would you check for a create-then-get sequence?
      - How do you keep fuzzing in CI from being flaky?
    common_errors:
      - Treating every 4xx as a failure and drowning in noise.

  - external_key: technical.backend_apis.helpful_api_docs
    competency_key: api_design
    topic: API documentation
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What makes API documentation genuinely useful to a developer integrating for the first time? Think
      of the best and worst docs you've used.
    expected_concepts:
      - a quickstart to the first successful call
      - reference docs generated from the spec
      - runnable examples
      - a catalogue of errors and what to do about them
      - clear explanation of authentication
      - a changelog and a test environment
    rubric:
      excellent: Draws on concrete examples of good and bad docs, prioritises time to first successful call, and keeps reference material accurate by generating it from the spec.
      good: Names several useful elements such as examples and a quickstart.
      weak: Says only that the docs should list the endpoints.
    followups:
      - How do you keep examples from going stale?
      - How would you measure whether your docs are working?
    common_errors:
      - Reference docs written by hand that drift from the real behaviour.

  - external_key: technical.backend_apis.partner_sandbox
    competency_key: api_design
    topic: Sandbox mode for a public API
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you design a sandbox or test mode for a public API so partners can build integrations
      without touching real data or money?
    expected_concepts:
      - separate test credentials mapped to isolated data
      - the same code paths and contract as production
      - deterministic triggers to simulate failures
      - webhooks in test mode
      - limits and cleanup of test data
      - no leakage between test and live modes
    rubric:
      excellent: Designs strict isolation with production parity, gives partners ways to simulate edge cases and failures, and keeps test traffic from affecting live systems.
      good: Separates test keys and data while keeping behaviour similar.
      weak: Points partners at a shared staging server with real-looking data.
    followups:
      - How would a partner simulate a declined payment?
      - Where can sandbox and production behaviour safely differ?
    common_errors:
      - A sandbox whose behaviour drifts from production.

  - external_key: technical.backend_apis.parallel_run_v2
    competency_key: api_design
    topic: Migrating clients to a redesigned endpoint
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're replacing a widely used REST endpoint with a redesigned version two that changes the response
      shape. How would you run both side by side and prove version two returns equivalent results before
      moving clients over?
    expected_concepts:
      - shared domain logic with thin adapters per version
      - shadow traffic comparing both responses
      - normalising differences before diffing
      - per-client feature flags
      - metrics and gradual migration
      - keeping version one as an adapter over version two
    rubric:
      excellent: Plans a parallel run with shadow comparisons and normalised diffs, shares logic so the versions can't drift, migrates gradually with flags, and defines when version one can go.
      good: Runs both versions and compares outputs for a sample of traffic.
      weak: Builds version two separately and switches everyone over on a date.
    followups:
      - How would you shadow requests that have side effects?
      - What level of mismatch would you accept before moving on?
    common_errors:
      - Duplicating business logic in two code paths that drift apart.

  - external_key: technical.backend_apis.screen_needs_six_calls
    competency_key: api_design
    topic: Chatty APIs for mobile screens
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A mobile screen needs data from six different endpoints, and the app feels slow. How do you think
      about designing the API for that screen — finer endpoints, a combined endpoint, a backend-for-
      frontend or something else?
    expected_concepts:
      - round trips dominate latency on mobile networks
      - backend-for-frontend or aggregation layer
      - expand or include parameters
      - GraphQL as an option
      - coupling of screen-specific endpoints
      - server-side parallel fan-out and caching
    rubric:
      excellent: Diagnoses round-trip latency, compares aggregation options with their coupling and caching costs, and recommends one with a plan to measure the improvement.
      good: Proposes a backend-for-frontend or an aggregated endpoint with a reason.
      weak: Suggests only making each endpoint faster.
    followups:
      - Who should own a backend-for-frontend?
      - How do you cache an aggregated response whose parts change at different rates?
    common_errors:
      - Building one-off endpoints for every screen with no shared model.

  - external_key: technical.backend_apis.events_vs_request_response
    competency_key: api_design
    topic: Event streams as an API
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      When would you expose a capability to other teams as an asynchronous event stream instead of a
      request-response API, and what does the contract look like then?
    expected_concepts:
      - decoupling and fan-out to many consumers
      - schema registry and compatibility rules
      - event versioning
      - ordering and partition keys
      - delivery guarantees and deduplication
      - documentation such as AsyncAPI and clear ownership
    rubric:
      excellent: Chooses events for the right reasons, defines the contract (schema, compatibility, ordering, delivery and retention), and keeps request-response for queries that need immediate answers.
      good: Explains when events fit and mentions schema versioning.
      weak: Treats events as fire-and-forget with no contract.
    followups:
      - How do you make a breaking change to an event schema?
      - A new consumer needs last year's events — what do you offer?
    common_errors:
      - Publishing internal database changes directly as the public event contract.

  - external_key: technical.backend_apis.latency_regression_ci
    competency_key: testing
    topic: Catching latency regressions
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you catch a latency regression in an API before it reaches production, given that
      performance tests are noisy?
    expected_concepts:
      - stable benchmark environment
      - comparison with a baseline using statistical thresholds
      - tracking percentiles rather than averages
      - deterministic proxies such as query counts
      - canary analysis in production
      - profiling when a regression is flagged
    rubric:
      excellent: Combines deterministic signals with statistically sound benchmarks and production canaries, and explains how to handle noise without ignoring real regressions.
      good: Runs performance tests in CI and compares against a baseline.
      weak: Relies on users reporting slowness.
    followups:
      - Which deterministic checks catch the most regressions cheaply?
      - How would you set a threshold that isn't constantly flaky?
    common_errors:
      - Failing builds on single noisy runs until the team ignores the check.

  - external_key: technical.backend_apis.partner_gets_401
    competency_key: debugging
    topic: Debugging a partner's 401 errors
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A partner says their integration keeps getting 401 responses even though they're sure their
      credentials are right. How would you help them track down the cause?
    expected_concepts:
      - 401 means unauthenticated, 403 means not allowed
      - header format, such as a missing Bearer prefix
      - expired tokens or clock skew
      - test credentials used against production or the reverse
      - audience or issuer mismatch
      - using the request id and server logs; clearer error details
    rubric:
      excellent: Works through likely causes systematically using the request id and logs, explains 401 versus 403, and improves error responses so the next partner can self-diagnose.
      good: Checks the header, token expiry and environment.
      weak: Tells the partner to regenerate credentials and try again.
    followups:
      - What would you change in your error response to make this faster next time?
      - How would you debug it if no request id reached your logs?
    common_errors:
      - Mixing up 401 and 403 semantics.
