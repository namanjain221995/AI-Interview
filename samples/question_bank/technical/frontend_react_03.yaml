# Curated questions: React forms and testing with Testing Library (technical.frontend_react, part 3 of 4).
# Difficulty decides round types: easy -> screening/combined, medium -> screening/deep/combined,
# hard -> deep/combined.
version: 1
defaults:
  role_tags: [frontend]
questions:
  # ------------------------------------------------------------- easy
  - external_key: technical.frontend_react.validation_timing
    competency_key: frontend_react
    topic: When to show form validation errors
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a user fills in a sign-up form, at what moments do you show validation errors, and why? Tell me how
      you've balanced being helpful against nagging people while they're still typing.
    expected_concepts:
      - validate on blur or on submit rather than on every keystroke at first
      - re-validate on change once a field has shown an error
      - summarise errors and move focus on submit
      - server-side validation still required
      - clear, specific error messages
    rubric:
      excellent: Describes a deliberate strategy such as blur-then-live re-validation, handles submit with focus on the first error, keeps server validation authoritative and writes actionable messages.
      good: Chooses a sensible timing and explains the user-experience reasoning.
      weak: Shows errors on every keystroke from the start or only validates on the server with a generic message.
    followups:
      - How would you handle a field like username that needs a server check?
      - What makes an error message actually useful?
    common_errors:
      - Flagging an email as invalid after the first character.
      - Relying only on client-side checks.

  - external_key: technical.frontend_react.async_default_values
    competency_key: frontend_react
    topic: Edit forms with values loaded from an API
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      For an edit profile form whose current values come from an API call, how do you initialise the fields,
      and what do you do about the moment before the data has arrived?
    expected_concepts:
      - render the form only once data is available, or show a skeleton
      - pass loaded data as default values or reset the form when it arrives
      - avoid uncontrolled inputs ignoring later default values
      - do not overwrite edits the user already made with a background refetch
      - key the form by record id when switching records
    rubric:
      excellent: Waits for data or resets the form explicitly, explains why defaultValue changes are ignored after mount, protects user edits from background refetches and resets per record.
      good: Loads data first and initialises the form correctly.
      weak: Renders empty inputs and expects them to fill in when the data arrives.
    followups:
      - What happens if the data refetches while the user is typing?
      - How would you show which fields the user has changed?
    common_errors:
      - Changing defaultValue after mount and expecting the input to update.
      - Background refetches wiping in-progress edits.

  - external_key: technical.frontend_react.form_library_choice
    competency_key: frontend_react
    topic: Using a form library
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Why would you bring in a form library such as React Hook Form or Formik instead of managing every field
      with useState? Tell me about a form where that choice paid off or got in your way.
    expected_concepts:
      - registration, dirty and touched tracking handled for you
      - validation integration with schemas
      - fewer re-renders with uncontrolled registration
      - submit handling and error mapping
      - cost of an extra abstraction for tiny forms
    rubric:
      excellent: Explains the specific problems a library solves, the rendering model it uses, schema integration, and when a simple form does not need one, with a concrete example.
      good: Names several concrete benefits and gives an example.
      weak: Uses a library by habit without being able to say what it does.
    followups:
      - How would you integrate a third-party date picker with the library?
      - When would you not use a library at all?
    common_errors:
      - Using a library and still mirroring every value in useState.
      - Fighting the library for custom components instead of using its controller API.

  - external_key: technical.frontend_react.testing_query_priority
    competency_key: testing
    topic: Choosing Testing Library queries
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you write a React Testing Library test, how do you choose which query to use to find an element, and
      when do you fall back to a test id?
    expected_concepts:
      - prefer getByRole with an accessible name
      - label text for form fields
      - text queries for non-interactive content
      - test ids as a last resort for elements without semantics
      - get, query and find variants for presence, absence and async
    rubric:
      excellent: Prioritises role and label queries, explains that this mirrors how users find elements and doubles as an accessibility check, and uses query and find variants correctly.
      good: Prefers role or label queries and knows the get, query and find differences.
      weak: Uses test ids or container query selectors everywhere.
    followups:
      - How do you assert that something is not on the screen?
      - What does it tell you when getByRole cannot find your button?
    common_errors:
      - Using getBy to assert absence, which throws.
      - Querying by CSS class names.

  - external_key: technical.frontend_react.async_test_flake
    competency_key: testing
    topic: Waiting for asynchronous UI in tests
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A component test checks for a list of results right after rendering, and it fails because the data loads
      asynchronously. A colleague's fix is to add a short sleep. What would you do instead?
    expected_concepts:
      - findBy queries that wait for elements
      - waitFor for assertions that become true over time
      - mocked network responses that resolve predictably
      - asserting on the loading state first
      - avoid side effects inside waitFor callbacks
    rubric:
      excellent: Replaces the sleep with findBy or waitFor, mocks the network deterministically, also asserts the loading state and explains why fixed sleeps are slow and flaky.
      good: Uses findBy or waitFor correctly.
      weak: Keeps or lengthens the sleep.
    followups:
      - What should and shouldn't go inside a waitFor callback?
      - How would you test that the spinner disappears?
    common_errors:
      - Fixed timeouts in tests.
      - Firing user events inside waitFor.

  - external_key: technical.frontend_react.user_event_vs_fire_event
    competency_key: testing
    topic: Simulating user interaction in tests
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      In Testing Library, what's the practical difference between fireEvent and user-event, and which do you use
      when testing something like typing into a search box?
    expected_concepts:
      - fireEvent dispatches a single DOM event
      - user-event simulates the full sequence a real user produces
      - keyboard, focus, pointer and input events in order
      - user-event methods are asynchronous and should be awaited
      - fireEvent for events user-event does not model
    rubric:
      excellent: Explains that user-event reproduces realistic event sequences including focus and key events, awaits its calls, and knows the rare cases where fireEvent is appropriate.
      good: Prefers user-event and knows why it is more realistic.
      weak: Uses fireEvent change for everything and cannot explain the difference.
    followups:
      - What could a fireEvent test miss that user-event would catch?
      - Why do you set up a user-event instance per test?
    common_errors:
      - Forgetting to await user-event calls.
      - Testing typing with a single change event.

  - external_key: technical.frontend_react.what_to_test
    competency_key: testing
    topic: Deciding what to test for a new feature
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      You've just built a new checkout address form in React. How do you decide what to cover with component
      tests, what to leave to end-to-end tests and what not to test at all?
    expected_concepts:
      - component tests for validation, error states and interactions
      - end-to-end tests for the critical happy path across pages
      - unit tests for pure helpers such as formatting
      - do not test library internals or styling details
      - cost and speed trade-offs of each layer
    rubric:
      excellent: Allocates behaviours to the right layer with reasons, focuses on user-visible behaviour and risk, and avoids duplicating the same checks across layers.
      good: Sensible split between component and end-to-end tests.
      weak: Only writes snapshots or wants everything covered by end-to-end tests.
    followups:
      - Which single test would you write first, and why?
      - How do you avoid end-to-end tests becoming slow and flaky?
    common_errors:
      - Testing that the form library itself works.
      - Duplicating every component test at the end-to-end level.

  # ------------------------------------------------------------- medium
  - external_key: technical.frontend_react.custom_field_integration
    competency_key: frontend_react
    topic: Connecting custom inputs to a form library
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your design system has its own Select, DatePicker and rich text components. How do you make them work
      smoothly with a form library, including validation, focus on errors and touched state?
    expected_concepts:
      - controller or field APIs for components that are not native inputs
      - mapping value and onChange to the component's own props
      - forwarding refs so the library can focus the field on error
      - calling onBlur so touched and blur validation work
      - converting values such as dates to and from the stored format
    rubric:
      excellent: Uses the library's controller API, maps value, change and blur correctly, forwards refs for error focus, handles value conversion and builds reusable form-aware wrappers.
      good: Integrates the components through a controller with value and onChange.
      weak: Mirrors each component's value into separate state and copies it into the form on submit.
    followups:
      - Why does a missing onBlur break some validation modes?
      - Would you make design-system components aware of the form library, or keep them separate?
    common_errors:
      - Not forwarding the ref, so focus-on-error silently does nothing.
      - Storing formatted display strings instead of real values.

  - external_key: technical.frontend_react.dependent_form_fields
    competency_key: frontend_react
    topic: Dependent fields with async options
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a shipping form, choosing a country loads its regions from an API, and choosing a region loads its
      delivery options. Users who change the country quickly sometimes end up with a region that doesn't belong
      to it. How would you build these fields correctly?
    expected_concepts:
      - reset dependent fields when their parent changes
      - query keys that include the parent value
      - ignore or cancel responses for outdated selections
      - disabled or loading states for fields waiting on data
      - validate the combination on submit and on the server
    rubric:
      excellent: Resets dependants on parent change, keys option requests by the parent so stale responses cannot apply, shows loading and disabled states, and validates the combination on both client and server.
      good: Resets the dependent fields and handles loading states.
      weak: Leaves stale selections in place and relies on the server to reject the submission.
    followups:
      - What if an existing saved address has a region that's no longer offered?
      - How would you keep this accessible as options load?
    common_errors:
      - Responses for an earlier country overwriting the current options.
      - Keeping a selected value that is not in the new option list.

  - external_key: technical.frontend_react.testing_form_validation
    competency_key: testing
    topic: Testing form behaviour with Testing Library
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You've built a registration form with field validation, a submit button and server-side errors. Which
      tests would you write with Testing Library, and what would a good one look like?
    expected_concepts:
      - fill fields by their labels using user-event
      - assert visible error messages and accessible error state
      - submit with valid data and assert the request payload
      - mock a server error and assert it appears on the right field
      - assert focus moves to the first invalid field
    rubric:
      excellent: Covers invalid, valid and server-error paths through the UI, finds fields by label, asserts on what users perceive including focus and error association, and checks the submitted payload at the network boundary.
      good: Tests validation messages and a successful submit through user interactions.
      weak: Calls the submit handler directly or asserts on the form library's internal state.
    followups:
      - How would you avoid repeating the same fill-in steps in every test?
      - How would you test the button's pending state during submission?
    common_errors:
      - Asserting on internal form state rather than visible output.
      - Spying on the submit handler instead of checking what was sent.

  - external_key: technical.frontend_react.dynamic_line_items
    competency_key: frontend_react
    topic: Dynamic field arrays
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An invoice form lets users add, remove and reorder line items, and shows a running total. How would you
      build it so it stays correct and responsive with fifty or more rows?
    expected_concepts:
      - field array helpers with stable generated ids as keys
      - derive totals rather than storing them
      - isolate re-renders to the edited row
      - validation per row and for the whole list
      - precise money arithmetic
    rubric:
      excellent: Uses stable ids rather than indexes, derives totals, scopes re-renders per row, validates rows and the collection, and handles currency precisely.
      good: Uses a field array with stable keys and derived totals.
      weak: Uses index keys and stores totals in state updated by effects.
    followups:
      - Why is floating-point arithmetic risky for money, and what would you do?
      - How would you let keyboard users reorder rows?
    common_errors:
      - Index keys causing values to jump between rows on delete.
      - Totals stored in state that drift from the rows.

  - external_key: technical.frontend_react.unsaved_changes_guard
    competency_key: frontend_react
    topic: Guarding unsaved changes
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Users complain they lose long edits when they accidentally click a link or close the tab. How would you
      protect unsaved changes in a React single-page app?
    expected_concepts:
      - tracking dirty state against initial values
      - router navigation blockers with a confirmation
      - beforeunload for tab close and reload
      - autosaving drafts as an alternative
      - not blocking after a successful save
    rubric:
      excellent: Tracks dirtiness accurately, blocks in-app navigation and tab close appropriately, considers autosave as the better experience, and clears the guard after saving.
      good: Uses dirty tracking with a navigation prompt and beforeunload.
      weak: Shows a confirm dialog on every navigation regardless of changes.
    followups:
      - What are the limits of what you can show in a beforeunload prompt?
      - How would autosave change the design?
    common_errors:
      - Prompting even when nothing changed.
      - Leaving the guard active after a successful save.

  - external_key: technical.frontend_react.network_mocking_states
    competency_key: testing
    topic: Testing data-driven components with mocked APIs
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you test a component's loading, error and retry behaviour without calling the real API, and where
      do you put the mocks?
    expected_concepts:
      - mocking at the network layer with Mock Service Worker
      - per-test overrides for error and slow responses
      - fresh query cache per test
      - asserting what the user sees in each state
      - avoid mocking your own hooks or modules
    rubric:
      excellent: Mocks at the network boundary with default handlers and per-test overrides, isolates caches between tests, asserts user-visible states including retry, and explains why module mocks are brittle.
      good: Uses network-level mocks and covers success and error states.
      weak: Mocks the component's data hook so the network path is never exercised.
    followups:
      - Why can a shared query client make tests depend on each other?
      - How would you simulate a slow response?
    common_errors:
      - Cached data leaking from one test into the next.
      - Mocking internals so the test passes while the real integration breaks.

  - external_key: technical.frontend_react.act_warnings
    competency_key: testing
    topic: Understanding act warnings
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your test output is full of warnings saying an update was not wrapped in act. What do those warnings
      actually mean, and how do you get rid of them properly?
    expected_concepts:
      - a state update happened outside of an awaited interaction
      - usually an async update after the test finished asserting
      - awaiting findBy or waitFor for the final state
      - Testing Library already wraps its helpers in act
      - timers or subscriptions left running after the test
    rubric:
      excellent: Explains that an update landed after the test stopped observing, fixes it by awaiting the final UI state or cleaning up timers, and avoids sprinkling act manually.
      good: Knows it relates to async updates and awaits the right query.
      weak: Wraps everything in act or silences console warnings.
    followups:
      - Why does wrapping render in act yourself usually not help?
      - How could this warning point to a real bug in the component?
    common_errors:
      - Silencing console errors globally.
      - Ending tests before pending requests resolve.

  - external_key: technical.frontend_react.testing_custom_hooks
    competency_key: testing
    topic: Testing custom hooks
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you test a custom hook, for example one that manages pagination state and fetches pages? When would
      you test it directly and when through a component?
    expected_concepts:
      - renderHook for hooks with reusable logic and many edge cases
      - testing through a real component when the hook is an implementation detail
      - wrappers for required providers
      - act or waitFor around updates
      - asserting on returned values and side effects
    rubric:
      excellent: Chooses between renderHook and component tests with clear reasoning, sets up providers through wrappers, handles async updates correctly and covers edge cases.
      good: Uses renderHook correctly with providers.
      weak: Calls the hook outside a component or only tests it indirectly without knowing why.
    followups:
      - How do you change the hook's arguments between assertions?
      - What makes a hook worth testing in isolation?
    common_errors:
      - Calling hooks as plain functions in tests.
      - Missing providers causing confusing failures.

  - external_key: technical.frontend_react.test_provider_setup
    competency_key: testing
    topic: Rendering components that need providers
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Most of your components depend on a router, a query client, a theme and an auth context. How do you set
      up tests so each one doesn't repeat thirty lines of boilerplate?
    expected_concepts:
      - a custom render helper that wraps standard providers
      - options to override route, user or initial data per test
      - fresh instances per test for isolation
      - returning a configured user-event instance
      - keeping helpers simple and discoverable
    rubric:
      excellent: Builds a custom render with overridable providers, creates fresh instances per test, and keeps the helper small enough that tests stay readable.
      good: Uses a shared render wrapper with providers.
      weak: Copies provider setup into every test or shares global singletons across tests.
    followups:
      - How would you render a component at a specific route with route parameters?
      - What state could leak between tests through shared providers?
    common_errors:
      - A shared query client or store across tests.
      - Helpers so magical that nobody knows what a test renders.

  - external_key: technical.frontend_react.testing_navigation_flows
    competency_key: testing
    topic: Testing routing and navigation
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      After saving a new project, your app should navigate to the project's detail page, and that page reads the
      id from the route. How would you test this flow at the component level without a real browser?
    expected_concepts:
      - render with an in-memory router and initial entries
      - define the routes the flow touches in the test
      - assert on the destination page's content rather than a mocked navigate call
      - mock the create request and the detail request
      - route parameters supplied through the URL
    rubric:
      excellent: Uses a memory router with the real route definitions, drives the flow through the UI, asserts the destination content, and avoids mocking the router's navigate function.
      good: Renders inside a test router and checks the destination page appears.
      weak: Mocks the navigate function and only asserts it was called.
    followups:
      - When would you leave this flow to an end-to-end test instead?
      - How would you test a redirect for a signed-out user?
    common_errors:
      - Mocking router hooks so the real routing is never exercised.
      - Forgetting route parameters in the initial entry.

  - external_key: technical.frontend_react.fake_timers_debounce
    competency_key: testing
    topic: Testing time-based behaviour
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you test a search box that debounces input by 300 milliseconds before fetching, without making
      the test slow or flaky?
    expected_concepts:
      - fake timers to control time
      - configuring user-event to advance fake timers
      - asserting no request before the delay and one after
      - only the final query is sent after rapid typing
      - restoring real timers after the test
    rubric:
      excellent: Uses fake timers integrated with user-event, asserts both that no request fires early and only one fires after rapid typing, and restores timers to avoid leaking into other tests.
      good: Uses fake timers and checks the request happens after the delay.
      weak: Waits 300 milliseconds of real time or does not test the debounce at all.
    followups:
      - What goes wrong if user-event and fake timers are not configured together?
      - How would you test cancellation of the earlier request?
    common_errors:
      - Fake timers left enabled for later tests.
      - Awaiting user-event while timers are frozen, causing the test to hang.

  - external_key: technical.frontend_react.keyboard_interaction_tests
    competency_key: testing
    topic: Testing keyboard behaviour of widgets
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You've built a custom dropdown menu that must support arrow keys, Escape and Enter. How would you write
      tests that give you real confidence it works for keyboard users?
    expected_concepts:
      - user-event keyboard and tab interactions
      - asserting the focused element after each key
      - aria-expanded and active option state
      - Escape returns focus to the trigger
      - automated accessibility checks as a supplement
    rubric:
      excellent: Drives the widget only with keyboard events, asserts focus and ARIA state at each step, covers Escape and focus return, and complements tests with axe checks and a manual screen-reader pass.
      good: Tests main keyboard paths and asserts focus.
      weak: Only tests mouse clicks or asserts on internal state.
    followups:
      - What can automated accessibility checks not tell you here?
      - Which behaviours would you leave to a real browser test?
    common_errors:
      - Asserting on component state instead of the focused element.
      - Skipping focus restoration checks.

  # ------------------------------------------------------------- hard
  - external_key: technical.frontend_react.form_actions_optimistic
    competency_key: frontend_react
    topic: Form actions and progressive enhancement
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      React now supports passing functions as form actions, along with hooks such as useActionState and
      useOptimistic. How do these change the way you build a comment form, and what trade-offs do you see?
    expected_concepts:
      - form action functions and pending state through useFormStatus
      - useActionState for results and errors from the action
      - useOptimistic for showing the comment before confirmation
      - progressive enhancement with server actions
      - validation and security still on the server
    rubric:
      excellent: Explains how actions replace manual submit handlers, combines pending, result and optimistic state correctly, discusses progressive enhancement and keeps validation and authorisation on the server.
      good: Understands the new hooks and builds a working form with pending and error state.
      weak: Unaware of the APIs or treats them as a renamed onSubmit with no change in behaviour.
    followups:
      - What happens to the optimistic comment if the action throws?
      - How would this work before JavaScript has loaded?
    common_errors:
      - Trusting client-provided data inside a server action.
      - Not reverting optimistic state after an error.

  - external_key: technical.frontend_react.large_form_performance
    competency_key: frontend_react
    topic: Performance of very large forms
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      An admin configuration screen has around two hundred fields with conditional sections, and typing into any
      field lags noticeably. How would you find the cause and redesign it?
    expected_concepts:
      - profile to see which components render per keystroke
      - subscriptions scoped to individual fields
      - uncontrolled registration or field-level state
      - expensive validation moved off the keystroke path
      - splitting into sections or steps
      - memoising heavy sections and conditional rendering
    rubric:
      excellent: Measures first, isolates field subscriptions so a keystroke renders one field, moves expensive validation to blur or async, splits the form sensibly and verifies the fix with profiling.
      good: Identifies whole-form re-rendering and limits it.
      weak: Debounces all inputs or adds memo everywhere without measuring.
    followups:
      - How would watching a field for conditional sections affect rendering?
      - What would you change in the design rather than in the code?
    common_errors:
      - Watching the entire form state at the top level.
      - Running full-schema validation on every keystroke.

  - external_key: technical.frontend_react.slow_component_suite
    competency_key: testing
    topic: Speeding up a slow component test suite
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your React component test suite has grown to take twenty-five minutes in CI, and developers have stopped
      running it locally. How would you find where the time goes and bring it down?
    expected_concepts:
      - profile per-file timings to find the slowest tests
      - expensive setup such as rendering whole apps or large providers
      - heavy transforms and module graphs, barrel imports
      - runner choice and configuration, parallelism and sharding
      - replacing real timers and network waits with controlled ones
      - running affected tests first in local and pull request runs
    rubric:
      excellent: Measures before changing, targets the slowest files and setup costs, fixes import and transform overhead, uses fake timers and mocked network, shards in CI and adds change-based selection for fast feedback.
      good: Identifies a few major causes and parallelises the suite.
      weak: Deletes slow tests or only adds more CI machines.
    followups:
      - How do barrel files slow down a test suite?
      - How would you stop the suite from slowing down again?
    common_errors:
      - Rendering the entire application for every component test.
      - Real network or timer delays hidden in tests.

  - external_key: technical.frontend_react.snapshot_suite_cleanup
    competency_key: testing
    topic: Replacing a snapshot-heavy test suite
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your codebase has around eight hundred snapshot tests, and developers routinely update them all without
      reading the diffs. How would you turn this into a suite people trust?
    expected_concepts:
      - identify which snapshots have ever caught a real bug
      - replace with focused behavioural assertions
      - keep small inline snapshots only where output is the contract
      - visual regression for appearance concerns
      - migrate gradually by area with clear guidelines
    rubric:
      excellent: Uses data to find valuable versus noisy snapshots, replaces them with behavioural or visual tests, keeps a narrow justified use of snapshots and runs a gradual migration with team guidelines.
      good: Plans to replace most snapshots with behavioural assertions.
      weak: Deletes all tests at once or keeps updating snapshots blindly.
    followups:
      - When is a snapshot actually the right tool?
      - How would you stop new large snapshots being added?
    common_errors:
      - Deleting snapshots without replacing the coverage they gave.
      - Moving appearance checks into DOM snapshots instead of visual tests.

  - external_key: technical.frontend_react.testing_suspense_streaming
    competency_key: testing
    topic: Testing Suspense and concurrent features
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you test components that rely on Suspense for data, lazy-loaded children and transitions, so
      the tests cover the fallback and the final state without being timing-dependent?
    expected_concepts:
      - assert the fallback first, then await the resolved content
      - controllable promises or network mocks for deterministic timing
      - lazy modules resolve asynchronously in tests
      - transitions keep old content visible while pending
      - error boundaries for rejected promises
    rubric:
      excellent: Uses deterministic, controllable data sources, asserts fallback, pending and resolved states in order, covers error boundaries, and understands how transitions change what is visible.
      good: Awaits final content and checks the fallback appears.
      weak: Mocks Suspense away entirely or relies on arbitrary delays.
    followups:
      - How would you test that old content stays visible during a transition?
      - What would you leave to a browser-level test instead?
    common_errors:
      - Fresh unresolved promises created on every render in test doubles.
      - Not testing the error path.

  - external_key: technical.frontend_react.jsdom_vs_browser_tests
    competency_key: testing
    topic: Simulated DOM versus real-browser component tests
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your component tests run in jsdom, and several bugs slipped through because they involved layout,
      scrolling or focus behaviour that jsdom doesn't really implement. Part of the team wants to move component
      tests into a real browser. How would you evaluate that and decide what runs where?
    expected_concepts:
      - jsdom lacks layout, real focus behaviour, CSS and many browser APIs
      - real-browser component testing tools such as Vitest browser mode or Playwright component tests
      - speed, flakiness and CI cost trade-offs
      - keeping fast jsdom tests for pure logic and simple interaction
      - piloting on the components where bugs escaped
    rubric:
      excellent: Names concrete jsdom gaps tied to the escaped bugs, compares real-browser options on fidelity, speed and maintenance, proposes a split by component type and validates with a measured pilot.
      good: Understands jsdom limitations and suggests running the affected components in a real browser.
      weak: Mocks the missing browser APIs further, or moves every test to end-to-end tests.
    followups:
      - Which of your components would you move first, and why?
      - How would you keep real-browser tests from becoming slow and flaky?
    common_errors:
      - Stubbing getBoundingClientRect and trusting layout-dependent assertions.
      - Migrating the whole suite at once without measuring the benefit.
