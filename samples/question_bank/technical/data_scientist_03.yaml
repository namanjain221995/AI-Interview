# Curated questions: data scientist, part 3 — feature engineering, model selection, validation and leakage.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_scientist]
  competency_key: machine_learning
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.data_scientist.high_cardinality_categoricals
    topic: Encoding high-cardinality categorical features
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      You have a categorical feature like postal code or product ID with tens of thousands of distinct values.
      What options do you have for using it in a model, and how do you choose between them?
    expected_concepts:
      - one-hot encoding becomes sparse and wide
      - grouping rare categories
      - frequency or target encoding with care for leakage
      - hashing or learned embeddings
      - model type affects which encodings work well
    rubric:
      excellent: Compares several encodings with their trade-offs, flags leakage risk in target encoding, handles unseen and rare categories, and ties the choice to the model and data size.
      good: Names at least two reasonable encodings with a short rationale.
      weak: Only suggests one-hot encoding or label-encoding as integers for a linear model.
    followups:
      - How would you handle a category that appears in production but never in training?
      - When might you drop the feature entirely?
    common_errors:
      - Encoding categories as arbitrary integers and feeding them to a linear model.

  - external_key: technical.data_scientist.missing_value_strategy
    topic: Handling missing values
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide what to do about missing values in a dataset you're modelling? Tell me about a case
      where the missingness itself turned out to be informative.
    expected_concepts:
      - understanding why data is missing
      - missing completely at random versus not at random
      - imputation strategies such as median, model-based or indicator flags
      - models that handle missing values natively
      - fitting imputation on training data only
    rubric:
      excellent: Starts from the missingness mechanism, chooses imputation accordingly, adds indicators when missingness carries signal, avoids leakage by fitting on training data, and gives a concrete example.
      good: Describes sensible imputation options and considers why data is missing.
      weak: Always drops rows or fills with zero without considering the consequences.
    followups:
      - What happens if missingness patterns are different in production?
      - When would dropping rows be acceptable?
    common_errors:
      - Computing imputation statistics on the full dataset before splitting.

  - external_key: technical.data_scientist.scaling_sensitive_models
    topic: Which models need feature scaling
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Which of the models you use regularly are sensitive to the scale of input features, which aren't, and what
      actually goes wrong if you forget to scale?
    expected_concepts:
      - distance-based methods such as k-nearest neighbours and k-means
      - regularised linear models penalise coefficients unevenly
      - gradient-based training converges slowly
      - tree-based models are largely scale-invariant
      - fit scaler on training data only
    rubric:
      excellent: Correctly sorts common models, explains the mechanism of failure for each sensitive type, and mentions fitting the scaler inside the training pipeline.
      good: Identifies the main scale-sensitive models and tree models as insensitive.
      weak: Claims all models require scaling or none do.
    followups:
      - Would you choose standardisation or min-max scaling for a feature with extreme values?
      - Why does regularisation make scaling matter for linear models?
    common_errors:
      - Fitting the scaler on the full dataset including test data.

  - external_key: technical.data_scientist.baseline_first
    topic: Starting with a baseline model
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've just been handed a new prediction problem and a dataset. What's the first model you build, and why
      do you start there?
    expected_concepts:
      - simple heuristic or majority-class baseline
      - simple interpretable model such as linear or logistic regression
      - establishes what improvement is worth
      - surfaces data issues and leakage early
      - quick end-to-end pipeline before optimising
    rubric:
      excellent: Starts with a trivial and a simple model baseline, explains how baselines expose data problems and set the bar, and describes building the full pipeline early.
      good: Proposes a simple baseline model with a sensible reason.
      weak: Starts with a complex model without any reference point.
    followups:
      - What if the baseline is already good enough for the business?
      - How do you decide when to stop improving the model?
    common_errors:
      - Skipping a naive baseline, so improvements cannot be judged.

  - external_key: technical.data_scientist.three_way_split
    topic: Training, validation and test splits
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Why do you keep a separate test set on top of a validation set, and what goes wrong when people tune
      their models against the test set?
    expected_concepts:
      - validation set used for model and hyperparameter selection
      - test set gives an unbiased final estimate
      - tuning on the test set leads to optimistic estimates
      - cross-validation as an alternative to a single validation split
      - test set should reflect production data
    rubric:
      excellent: Explains each split's role, describes how repeated test-set use causes selection bias, and discusses cross-validation and representative test data.
      good: Explains the roles of each split and why tuning on test is a problem.
      weak: Treats validation and test sets as the same thing.
    followups:
      - How large should the test set be?
      - What would you do if you had already looked at the test set many times?
    common_errors:
      - Using the test set to choose between candidate models.

  - external_key: technical.data_scientist.new_dataset_checks
    competency_key: data_analysis
    topic: Checking a dataset before modelling
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Another team hands you a dataset for a modelling project. What do you check before you trust it enough to
      start building anything?
    expected_concepts:
      - how the data was generated and what each row represents
      - duplicates, missing values and unexpected ranges
      - label definition and how labels were produced
      - time coverage and changes in definitions over time
      - comparing to a trusted source or known totals
    rubric:
      excellent: Starts from data provenance and the unit of observation, checks quality systematically, validates labels and time coverage, and reconciles against known figures.
      good: Covers basic quality checks and asks about how the data was collected.
      weak: Starts modelling immediately or only looks at summary statistics.
    followups:
      - What would you do if the totals don't match the finance report?
      - How would you document what you found for the next person?
    common_errors:
      - Not confirming what a single row represents.

  - external_key: technical.data_scientist.datetime_features
    topic: Engineering features from timestamps
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A raw timestamp column is rarely useful by itself. How do you usually turn timestamps into features, and
      what mistakes have you seen people make with them?
    expected_concepts:
      - calendar features such as day of week, hour or month
      - cyclical encoding for periodic features
      - holidays and business events
      - elapsed time since a previous event
      - time zones and avoiding information from the future
    rubric:
      excellent: Covers calendar, cyclical, elapsed-time and event features, and highlights pitfalls such as time zones and leakage from future information.
      good: Names several useful derived features and one pitfall.
      weak: Uses the raw timestamp as a numeric feature without thought.
    followups:
      - When would you use sine and cosine encoding for hour of day?
      - How would you handle users in many time zones?
    common_errors:
      - Computing aggregates that include events after the prediction time.

  - external_key: technical.data_scientist.linear_vs_boosted_trees
    topic: Choosing between linear models and boosted trees
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      For a tabular prediction problem, how do you decide between a logistic regression and a gradient boosted
      tree model? Tell me about a time you made that choice.
    expected_concepts:
      - non-linearity and interactions captured by trees
      - interpretability and stability of linear models
      - data size and number of features
      - latency, maintenance and monitoring considerations
      - comparing both on the same validation setup
    rubric:
      excellent: Weighs accuracy, interpretability, data size and operational needs, compares both empirically, and gives a real example with the reasoning behind the final choice.
      good: Explains the main trade-offs between the two families.
      weak: Always picks one family without considering the problem.
    followups:
      - What would push you toward the linear model even if trees score slightly better?
      - How do you tune a boosted tree model to avoid overfitting?
    common_errors:
      - Assuming the more complex model is better without validating it.

  # ---------------------------------------------------------------- medium
  - external_key: technical.data_scientist.target_encoding_safely
    topic: Using target encoding without leakage
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Target encoding can be very powerful but also very dangerous. How do you implement it so it doesn't leak
      information into your model?
    expected_concepts:
      - encoding computed using the label of the same row leaks
      - out-of-fold encoding during training
      - smoothing toward the global mean for rare categories
      - fitting encodings on training data and applying to validation and test
      - time-aware encoding for temporal data
    rubric:
      excellent: Explains the leakage mechanism, implements out-of-fold encoding with smoothing, handles rare and unseen categories, and adapts the method for temporal data.
      good: Mentions out-of-fold encoding or smoothing and why they help.
      weak: Computes category means on the full dataset including the row itself.
    followups:
      - How would you choose the smoothing strength?
      - What symptoms would tell you leakage had slipped through?
    common_errors:
      - Computing encodings before splitting into training and validation.

  - external_key: technical.data_scientist.time_series_validation
    topic: Validating time-dependent models
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're building a model to forecast weekly demand. How would you set up validation so the scores you
      report reflect how the model will perform after deployment?
    expected_concepts:
      - training only on the past and validating on the future
      - rolling or expanding window backtests
      - gap between training and validation to match deployment latency
      - multiple folds to cover different seasons
      - features available at forecast time only
    rubric:
      excellent: Designs rolling-origin backtests with a realistic gap, uses features available at forecast time, covers seasonality across folds and reports variation across folds.
      good: Uses time-ordered splits and avoids random shuffling.
      weak: Uses random k-fold cross-validation on time series data.
    followups:
      - How would you handle a period like a pandemic year in your backtests?
      - What gap would you leave between training and validation, and why?
    common_errors:
      - Using lag features that would not yet be available at prediction time.

  - external_key: technical.data_scientist.grouped_validation
    topic: Grouped cross-validation
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your model scored very well in cross-validation but performed much worse on new customers in production.
      You realise each customer has many rows in the data. What happened, and how would you fix the validation?
    expected_concepts:
      - rows from the same customer in both training and validation folds
      - model memorises customer-specific patterns
      - group k-fold by customer
      - validation should mirror the production scenario of unseen customers
      - checking other grouping keys such as household or device
    rubric:
      excellent: Explains the leakage through shared customers, applies grouped splits matched to the production scenario, and checks for other hidden groupings.
      good: Identifies the overlap problem and proposes grouping by customer.
      weak: Blames production data drift without examining the validation setup.
    followups:
      - What if the model will be used for both existing and new customers?
      - How would you find hidden groupings you didn't know about?
    common_errors:
      - Fixing the split but leaving customer-identifying features in the model.

  - external_key: technical.data_scientist.pipeline_leakage
    topic: Preprocessing leakage
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Walk me through the ways preprocessing steps like scaling, imputation, feature selection or resampling
      can leak information from validation data into training, and how you structure your code to prevent it.
    expected_concepts:
      - fitting transformations on the full dataset before splitting
      - feature selection using all labels inflates scores
      - oversampling before splitting duplicates rows across folds
      - pipelines that fit transformations inside each fold
      - consistent transformations between training and serving
    rubric:
      excellent: Gives several distinct leakage paths with their impact, describes a pipeline structure that fits everything inside folds, and connects this to consistency in production.
      good: Explains at least two leakage paths and uses pipelines.
      weak: Is unaware that preprocessing can leak or only mentions scaling.
    followups:
      - How much can feature selection on the full dataset inflate a score?
      - How do you make sure the same transformations run at serving time?
    common_errors:
      - Oversampling before the train-validation split.

  - external_key: technical.data_scientist.suspicious_top_feature
    topic: Investigating a suspiciously strong feature
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your new churn model has an AUC of 0.98, and the most important feature is the number of support tickets
      in the last thirty days. Something feels off. How would you investigate?
    expected_concepts:
      - results that look too good often indicate leakage
      - check whether the feature window overlaps the churn event or label window
      - cancellation-related tickets created as part of churning
      - rebuild features as of the prediction time
      - compare performance with and without the feature
    rubric:
      excellent: Treats the score as a red flag, checks feature timing against the label window, identifies how cancellation tickets could leak the label, and rebuilds point-in-time features to measure the true performance.
      good: Suspects leakage and checks the timing of the feature.
      weak: Celebrates the result or removes the feature without understanding why it was strong.
    followups:
      - How would you prevent this class of leakage in future feature pipelines?
      - What AUC would you consider plausible for churn, and why?
    common_errors:
      - Dropping the feature but keeping other features with the same timing problem.

  - external_key: technical.data_scientist.hyperparameter_search
    topic: Approaches to hyperparameter tuning
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you approach hyperparameter tuning when you have a limited compute budget? Tell me which methods
      you use and how you avoid fooling yourself with the results.
    expected_concepts:
      - random search is more efficient than grid search in high dimensions
      - Bayesian optimisation or successive halving
      - focusing on the most influential parameters
      - early stopping
      - tuning on validation folds and reporting on held-out data
    rubric:
      excellent: Prioritises influential parameters, uses efficient search methods with early stopping, and separates tuning data from final evaluation to avoid optimistic estimates.
      good: Uses random or Bayesian search and understands the overfitting risk.
      weak: Exhaustively grid searches everything and reports the best validation score as final performance.
    followups:
      - Which hyperparameters matter most for gradient boosted trees?
      - When is extra tuning not worth the effort?
    common_errors:
      - Reporting the best cross-validation score after hundreds of trials as the expected performance.

  - external_key: technical.data_scientist.l1_vs_l2_choice
    topic: Choosing a regularisation penalty
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you've used regularised linear models, how did you choose between an L1 penalty, an L2 penalty or a
      mix of both? What did each one do to your model?
    expected_concepts:
      - L1 drives coefficients to zero and performs selection
      - L2 shrinks coefficients smoothly and handles correlated features
      - L1 picks arbitrarily among correlated features
      - elastic net combines both
      - choosing strength through cross-validation and scaling features first
    rubric:
      excellent: Explains the geometric or practical difference, discusses behaviour with correlated features, and grounds the choice in a real model with tuning through cross-validation.
      good: Explains sparsity versus shrinkage and when to prefer each.
      weak: Knows the names but cannot explain how they behave differently.
    followups:
      - Why might the features L1 selects change between retrains?
      - How does regularisation relate to the bias-variance trade-off in your example?
    common_errors:
      - Treating L1-selected features as the true causal drivers.

  - external_key: technical.data_scientist.wide_data_feature_selection
    topic: Feature selection with many candidate features
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You have two thousand candidate features and fifty thousand rows. How would you narrow down to a feature
      set you'd be comfortable putting into production?
    expected_concepts:
      - remove constant, duplicate and highly correlated features
      - filter, wrapper and embedded selection methods
      - selection inside cross-validation to avoid optimistic scores
      - stability of selected features across folds
      - cost of computing and maintaining each feature in production
    rubric:
      excellent: Combines cheap filtering with embedded methods, performs selection within validation folds, checks stability, and weighs maintenance cost and data availability in production.
      good: Proposes a reasonable selection method and validates the result.
      weak: Keeps everything or selects features using correlation with the label on the full dataset.
    followups:
      - How would you decide between two feature sets with similar validation scores?
      - Which features would you drop first for operational reasons?
    common_errors:
      - Selecting features on the full dataset and then cross-validating on the same data.

  - external_key: technical.data_scientist.cost_based_threshold
    topic: Setting a decision threshold from business costs
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your model scores insurance claims for possible fraud, and an investigator can review two hundred claims a
      day. How would you decide where to set the threshold for sending a claim to review?
    expected_concepts:
      - default 0.5 threshold is rarely right
      - capacity constraint versus cost of missed fraud and wasted reviews
      - expected value per claim based on probability and claim size
      - calibrated probabilities make thresholds meaningful
      - revisiting the threshold as volumes and fraud rates change
    rubric:
      excellent: Frames the threshold as a business optimisation with costs and capacity, considers claim value, relies on calibrated scores, and plans to monitor and adjust it.
      good: Picks a threshold based on capacity or costs rather than a default.
      weak: Uses 0.5 or the threshold that maximises accuracy.
    followups:
      - Would you rank by probability of fraud or by expected loss?
      - How would you know if the threshold needs to change next month?
    common_errors:
      - Ignoring review capacity when choosing the threshold.

  - external_key: technical.data_scientist.probability_calibration
    topic: Calibrating predicted probabilities
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When does it matter that a model's predicted probabilities are well calibrated, and how do you check and
      fix calibration?
    expected_concepts:
      - calibration means predicted probabilities match observed frequencies
      - matters when probabilities feed decisions, pricing or expected value
      - reliability diagrams and Brier score or expected calibration error
      - Platt scaling or isotonic regression on held-out data
      - resampling and class weights distort calibration
    rubric:
      excellent: Explains when calibration matters versus ranking only, describes diagnostics and fixes on held-out data, and notes how resampling or class weighting affects calibration.
      good: Defines calibration and names a diagnostic and a fix.
      weak: Confuses calibration with accuracy or AUC.
    followups:
      - Why can a model have a great AUC and still be poorly calibrated?
      - When would you prefer isotonic regression over Platt scaling?
    common_errors:
      - Calibrating on the same data the model was trained on.

  - external_key: technical.data_scientist.regression_error_metrics
    topic: Choosing an error metric for regression
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      For a regression or forecasting model, how do you choose between metrics like RMSE, MAE and MAPE, and how
      do you connect that choice to what the business actually cares about?
    expected_concepts:
      - RMSE penalises large errors heavily
      - MAE is robust and targets the median
      - MAPE breaks down near zero and is asymmetric
      - asymmetric business costs of over- and under-prediction
      - training loss should match the evaluation metric where possible
    rubric:
      excellent: Explains each metric's behaviour and failure modes, links the choice to asymmetric business costs, and aligns training loss with the evaluation metric.
      good: Explains the main differences and picks one for a stated reason.
      weak: Uses one metric by default without understanding what it rewards.
    followups:
      - Stockouts cost three times more than overstock. How would that change your setup?
      - Which metric would you use when actual values are often zero?
    common_errors:
      - Using MAPE for series with many zero or near-zero values.

  # ------------------------------------------------------------------ hard
  - external_key: technical.data_scientist.nested_cross_validation
    topic: Unbiased performance estimates during model selection
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You compared fifteen model families with extensive tuning, and the winner's cross-validation score is what
      you'd like to report. Why might that number be optimistic, and how would you get an estimate you can
      defend?
    expected_concepts:
      - selection bias from choosing the best of many noisy estimates
      - nested cross-validation separating selection from evaluation
      - an untouched hold-out test set
      - variance across folds and confidence in differences between models
      - practical cost trade-offs of nested validation
    rubric:
      excellent: Explains the optimism from selecting the maximum, describes nested cross-validation or a clean hold-out precisely, and discusses uncertainty in comparing close models.
      good: Recognises the optimism and proposes nested CV or a held-out test set.
      weak: Reports the best cross-validation score as the expected production performance.
    followups:
      - How would you decide whether the winning model is meaningfully better than the runner-up?
      - When is nested cross-validation too expensive, and what would you do instead?
    common_errors:
      - Using the same folds for hyperparameter selection and final evaluation.

  - external_key: technical.data_scientist.new_market_shift
    topic: Validating a model for a new population
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your model was trained on customers in one country, and the business wants to use it in a new market where
      you have very little labelled data. How would you assess whether it will work there and adapt it?
    expected_concepts:
      - covariate shift and concept shift
      - comparing feature distributions, for example with adversarial validation
      - evaluating on a small labelled sample from the new market with uncertainty
      - importance weighting, fine-tuning or retraining with new data
      - staged rollout with monitoring and fallback rules
    rubric:
      excellent: Distinguishes covariate from concept shift, quantifies distribution differences, uses a small labelled sample with explicit error bars, proposes adaptation methods and a monitored staged rollout.
      good: Checks for distribution shift and proposes collecting labels in the new market.
      weak: Deploys the existing model without any assessment.
    followups:
      - How does adversarial validation work, and what would you do with its output?
      - How many labelled examples would you need before trusting the evaluation?
    common_errors:
      - Assuming that similar feature distributions guarantee the same relationship with the label.

  - external_key: technical.data_scientist.churn_label_definition
    topic: Defining labels and prediction windows
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You need to predict churn for a pay-as-you-go product where customers never formally cancel; they just stop
      using it. How would you define the label and set up the training data?
    expected_concepts:
      - inactivity-based definition with a chosen inactivity period
      - analysing return rates to pick the inactivity threshold
      - observation window, prediction point and outcome window
      - excluding customers who already look churned at prediction time
      - aligning the label with an action the business can take
    rubric:
      excellent: Derives the inactivity threshold from data on returning customers, clearly separates feature, prediction and outcome windows, avoids trivial cases, and links the definition to a business intervention.
      good: Defines a reasonable inactivity label and separates feature and label windows.
      weak: Picks an arbitrary definition without checking it, or mixes feature and label periods.
    followups:
      - How would you validate that your inactivity threshold is sensible?
      - How far ahead should the model predict to be useful to the retention team?
    common_errors:
      - Including customers who are already inactive at prediction time, which inflates performance.

  - external_key: technical.data_scientist.point_in_time_training_sets
    topic: Point-in-time correct training data
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      When you build a training set by joining features from several tables onto historical labels, how do you
      make sure every feature reflects only what was known at the moment of prediction?
    expected_concepts:
      - as-of joins on event time
      - slowly changing or overwritten source tables lose history
      - ingestion delay versus event time
      - snapshots or append-only history tables
      - comparing training feature values against what serving would have produced
    rubric:
      excellent: Describes as-of joins with event and availability times, handles overwritten tables and late data, and validates training-serving consistency with a concrete check.
      good: Uses time-based joins and recognises overwritten data as a risk.
      weak: Joins the current version of each table to historical labels.
    followups:
      - A source table only stores the latest value for each customer. What can you do?
      - How would you detect training-serving skew after deployment?
    common_errors:
      - Using event timestamps while ignoring when the data actually became available.

  - external_key: technical.data_scientist.stacking_ensembles
    topic: Stacking and ensembling
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      When is stacking or ensembling several models worth it in a real product, and how do you build a stacked
      model without leaking information into the meta-model?
    expected_concepts:
      - gains come from diverse models with uncorrelated errors
      - meta-model trained on out-of-fold predictions
      - separate hold-out for evaluating the full stack
      - added latency, maintenance and debugging cost
      - often small gains relative to complexity
    rubric:
      excellent: Explains why diversity matters, describes out-of-fold training of the meta-model precisely, and weighs the gain against operational cost with an example of when it was or wasn't worth it.
      good: Describes out-of-fold stacking and some trade-offs.
      weak: Trains the meta-model on in-sample predictions or cannot explain when ensembling helps.
    followups:
      - How would you measure whether the base models are diverse enough?
      - How do you explain a stacked model's prediction to a stakeholder?
    common_errors:
      - Training the meta-model on predictions from base models fitted on the same rows.

  - external_key: technical.data_scientist.tiny_labelled_dataset
    topic: Modelling with very few labels
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You have only three hundred labelled examples because each label requires an expert's review, but plenty
      of unlabelled data. How would you approach building and evaluating a model?
    expected_concepts:
      - simple, strongly regularised models and domain-informed features
      - repeated cross-validation with uncertainty estimates
      - pre-trained representations or transfer learning
      - active learning to choose which examples to label next
      - semi-supervised or weak supervision with label quality checks
    rubric:
      excellent: Combines simple models, careful repeated validation with intervals, transfer learning and active learning, and is clear about how uncertain the performance estimate is.
      good: Proposes reasonable modelling and labelling strategies for small data.
      weak: Trains a large model on three hundred rows and reports a single validation score.
    followups:
      - How would you pick the next fifty examples for the experts to label?
      - How would you check label quality between different experts?
    common_errors:
      - Using a single small hold-out set and treating its score as precise.
