# Curated questions: data scientist, part 1 — statistics and probability reasoning.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_scientist]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.data_scientist.p_value_meaning
    competency_key: statistics_experimentation
    topic: Interpreting a p-value
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A product manager tells you a test came back with a p-value of 0.03 and asks whether that means there's a
      97 percent chance the new feature works. How would you explain what that p-value actually tells you?
    expected_concepts:
      - probability of data at least this extreme assuming the null hypothesis is true
      - not the probability that the hypothesis is true or false
      - says nothing about effect size or business value
      - depends on the significance threshold chosen before the test
      - false positives still happen at the chosen alpha
    rubric:
      excellent: Gives a correct conditional definition in plain language, explicitly corrects the misreading, and redirects the conversation to effect size, confidence intervals and practical significance.
      good: Correctly states that the p-value is computed assuming no real effect and that it is not the probability the feature works.
      weak: Agrees with the 97 percent reading or gives a definition that confuses the p-value with the probability of the hypothesis.
    followups:
      - What would you show the product manager instead of, or alongside, the p-value?
      - How would your answer change if this was the only one of fifteen metrics that moved?
    common_errors:
      - Describing the p-value as the probability that the null hypothesis is true.
      - Treating a small p-value as proof that the effect is large.

  - external_key: technical.data_scientist.confidence_interval_explained
    competency_key: statistics_experimentation
    topic: Explaining confidence intervals
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How would you explain a 95 percent confidence interval to a stakeholder who isn't technical, and what
      would you want them to take away when the interval is very wide?
    expected_concepts:
      - range of plausible values for the true quantity given the data
      - repeated-sampling interpretation of the 95 percent
      - width driven by sample size and variability
      - wide interval means the data cannot distinguish meaningfully different outcomes
      - decision implications such as collecting more data
    rubric:
      excellent: Gives an accurate yet plain-language explanation, connects width to sample size and noise, and explains what decisions a wide interval does and does not support.
      good: Explains the interval as a plausible range and links width to uncertainty.
      weak: Says there is a 95 percent chance the value is in this specific interval without nuance, or cannot explain why width matters.
    followups:
      - If the interval for a lift runs from minus one percent to plus six percent, what would you recommend?
      - How would you shrink that interval in the next iteration?
    common_errors:
      - Confusing the confidence interval with the range that 95 percent of individual data points fall in.

  - external_key: technical.data_scientist.mean_vs_median_skew
    competency_key: data_analysis
    topic: Summarising skewed data
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You're asked to report the typical order value for an online store, and a handful of corporate buyers
      place orders a hundred times larger than everyone else. How would you decide what number, or numbers,
      to report?
    expected_concepts:
      - mean is pulled by extreme values while the median is robust
      - looking at the full distribution first
      - reporting percentiles or segmenting large buyers separately
      - matching the statistic to the business question, for example revenue planning versus typical customer
      - checking whether the extremes are valid data
    rubric:
      excellent: Starts from the question being answered, compares mean, median and percentiles, suggests segmenting the corporate buyers, and checks the extreme values are genuine.
      good: Recommends the median or percentiles for a typical customer and explains why the mean is misleading here.
      weak: Reports the mean without considering skew, or drops the large orders without justification.
    followups:
      - Finance wants total revenue projections. Does your choice change?
      - How would you present this on a dashboard so nobody misreads it?
    common_errors:
      - Deleting large orders as outliers when they are real and important for revenue.

  - external_key: technical.data_scientist.error_types_tradeoff
    competency_key: statistics_experimentation
    topic: False positives versus false negatives in testing
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Talk me through Type I and Type II errors using a decision from your own work, and explain how you
      decided which one was more costly in that situation.
    expected_concepts:
      - Type I as a false positive, rejecting a true null
      - Type II as a false negative, missing a real effect
      - alpha and power as the controls for each
      - business cost asymmetry drives the trade-off
      - sample size as the way to reduce both
    rubric:
      excellent: Defines both errors correctly, grounds them in a real decision, explains how cost asymmetry shaped the chosen alpha or power, and notes that more data reduces both.
      good: Correct definitions with a reasonable example and some discussion of which error mattered more.
      weak: Mixes up the two errors or cannot connect them to any real decision.
    followups:
      - How did you pick the sample size or threshold in that case?
      - Give me a situation where you'd accept a higher false positive rate on purpose.
    common_errors:
      - Swapping the definitions of Type I and Type II errors.

  - external_key: technical.data_scientist.base_rate_reasoning
    competency_key: statistics_experimentation
    topic: Base rates and conditional probability
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Say about one percent of transactions are fraudulent, and a rule catches 95 percent of fraud but also flags
      five percent of legitimate transactions. Walk me through how you'd reason about how likely it is that a
      flagged transaction is actually fraud.
    expected_concepts:
      - Bayes rule or a natural-frequency count over a fixed population
      - roughly 16 percent of flagged transactions are fraud
      - low base rate means false positives dominate
      - implications for review queues and precision
    rubric:
      excellent: Works through the numbers clearly, for example with ten thousand transactions, arrives at roughly one in six, and explains the operational consequence for analysts reviewing alerts.
      good: Sets up the conditional probability correctly and gets close to the right answer.
      weak: Answers 95 percent or ignores the base rate.
    followups:
      - How would you improve the precision without losing much recall?
      - How would this change if fraud became five percent of transactions?
    common_errors:
      - Confusing the probability of a flag given fraud with the probability of fraud given a flag.

  - external_key: technical.data_scientist.correlation_not_causation
    competency_key: data_analysis
    topic: Correlation versus causation in product data
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A dashboard shows that users who turn on notifications retain twice as well, and leadership wants to force
      notifications on for everyone. How would you respond, and what would you do to find out whether the
      effect is real?
    expected_concepts:
      - selection effect where engaged users opt in
      - confounding variables
      - running a randomised experiment
      - observational alternatives such as matching when experiments are not possible
      - possible harms such as unsubscribes or uninstalls
    rubric:
      excellent: Explains self-selection clearly, proposes a randomised test with the right metrics and guardrails, and offers an observational fallback with its limitations.
      good: Identifies that correlation does not prove causation and suggests an experiment.
      weak: Agrees with the plan or rejects it without proposing a way to find out.
    followups:
      - Leadership says an experiment takes too long. What could you do in the meantime?
      - Which guardrail metrics would you watch?
    common_errors:
      - Stating that correlation is not causation without explaining the likely mechanism behind the gap.

  - external_key: technical.data_scientist.outlier_decisions
    competency_key: data_analysis
    topic: Deciding how to treat outliers
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me how you decide what to do with outliers in a dataset. If you can, use an example where the
      decision actually changed a result.
    expected_concepts:
      - first determine whether the value is an error or a genuine extreme
      - investigate the source system or data pipeline
      - options include fixing, capping or winsorising, transforming, or robust methods
      - impact depends on the model or statistic used
      - documenting and checking sensitivity of results
    rubric:
      excellent: Separates errors from genuine extremes, lists several treatments tied to the analysis goal, checks sensitivity with and without them, and gives a concrete example.
      good: Investigates before removing and names at least two treatments.
      weak: Always deletes values beyond a fixed threshold without investigation.
    followups:
      - How would your approach differ for a tree model versus a linear regression?
      - What if the outliers are exactly the cases the business cares about most?
    common_errors:
      - Applying a three standard deviation rule to heavily skewed data without thinking about the distribution.

  - external_key: technical.data_scientist.count_data_modeling
    competency_key: statistics_experimentation
    topic: Modelling count data
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Suppose you need to model the number of support tickets a team receives each day. How would you approach
      it, and how would you check whether your chosen distribution actually fits?
    expected_concepts:
      - Poisson as a starting point for counts
      - overdispersion when variance exceeds the mean
      - negative binomial as an alternative
      - covariates such as weekday, releases or seasonality
      - checking fit by comparing observed and predicted distributions or residuals
    rubric:
      excellent: Starts with Poisson, explains why overdispersion is likely and how to detect it, moves to negative binomial or a regression with covariates, and validates fit against held-out days.
      good: Chooses a sensible count model and names a way to check fit.
      weak: Uses a normal distribution without considering that the data are non-negative counts, or cannot describe any fit check.
    followups:
      - The data has many days with zero tickets. What does that suggest?
      - How would you use the model to set staffing levels?
    common_errors:
      - Assuming variance equals the mean without checking.

  # ---------------------------------------------------------------- medium
  - external_key: technical.data_scientist.bootstrap_uncertainty
    competency_key: statistics_experimentation
    topic: Bootstrap for uncertainty estimates
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When would you reach for the bootstrap to put uncertainty around an estimate, and where have you seen it
      give misleading answers?
    expected_concepts:
      - resampling with replacement to approximate the sampling distribution
      - useful for complex statistics like medians, ratios or model metrics
      - assumes independent observations, so resample at the right unit
      - struggles with small samples, extremes and heavy tails
      - percentile versus bias-corrected intervals
    rubric:
      excellent: Explains the mechanism, gives a practical use case, and clearly identifies failure modes such as dependent data, small samples and statistics like the maximum, with remedies such as block or cluster bootstrap.
      good: Explains how it works and gives a valid use case with at least one limitation.
      weak: Describes it only as resampling without knowing when it is appropriate or where it fails.
    followups:
      - How would you bootstrap when each user contributes many sessions?
      - How many resamples do you usually use, and why?
    common_errors:
      - Resampling individual rows when observations are clustered by user.

  - external_key: technical.data_scientist.many_segments_one_win
    competency_key: statistics_experimentation
    topic: Multiple comparisons across segments
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An analyst on your team split a test result into twenty customer segments and found one where the effect
      is significant at the five percent level. They want to ship the change only to that segment. How would you
      handle it?
    expected_concepts:
      - with twenty comparisons about one false positive is expected by chance
      - corrections such as Bonferroni, Holm or false discovery rate
      - pre-registered versus post-hoc segments
      - treating the finding as a hypothesis and confirming it in a new test
      - plausibility of a mechanism for that segment
    rubric:
      excellent: Quantifies the chance of a spurious win, explains corrections and their trade-offs, and proposes a confirmatory test while coaching the analyst constructively.
      good: Recognises the multiple-comparison problem and suggests a correction or follow-up test.
      weak: Accepts the segment result at face value.
    followups:
      - When would you prefer controlling the false discovery rate over the family-wise error rate?
      - How would you set up the analysis plan for the next test to avoid this?
    common_errors:
      - Applying Bonferroni blindly without noting how much power it costs.

  - external_key: technical.data_scientist.bayesian_vs_frequentist
    competency_key: statistics_experimentation
    topic: Choosing a Bayesian or frequentist approach
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In your own work, when have you chosen a Bayesian approach over a frequentist one, or the other way round,
      and what drove that choice?
    expected_concepts:
      - posterior probabilities versus long-run error rates
      - priors encode existing knowledge and need justification
      - Bayesian methods help with small samples and hierarchical structure
      - computational cost and communication to stakeholders
      - results often agree with weak priors and enough data
    rubric:
      excellent: Contrasts the interpretations accurately, grounds the choice in a real problem, explains how the prior was chosen and checked for sensitivity, and discusses how results were communicated.
      good: Explains the main difference and gives a plausible use case for each.
      weak: Treats the choice as a matter of taste or cannot explain what a prior does.
    followups:
      - How would you defend your prior to a sceptical reviewer?
      - How do you explain a credible interval to a stakeholder?
    common_errors:
      - Claiming Bayesian methods remove the need for adequate sample sizes.

  - external_key: technical.data_scientist.regression_assumptions_in_practice
    competency_key: statistics_experimentation
    topic: Linear regression assumptions for inference and prediction
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Which assumptions behind linear regression actually matter in practice, and how does that answer change
      depending on whether you're using the model to explain something or to predict?
    expected_concepts:
      - linearity and correct functional form
      - independence of errors
      - constant variance and its effect on standard errors
      - normality of residuals matters mainly for small-sample inference
      - prediction cares about out-of-sample error more than coefficient validity
      - residual plots and diagnostics
    rubric:
      excellent: Distinguishes inference from prediction clearly, ranks assumptions by impact, explains which diagnostics reveal each problem and what to do about it, such as robust standard errors or transformations.
      good: Lists the main assumptions and a way to check each.
      weak: Recites assumptions without knowing their consequences, or claims the features must be normally distributed.
    followups:
      - What would you do if the residuals fan out as the prediction grows?
      - How would you handle a feature whose effect is clearly non-linear?
    common_errors:
      - Believing the input features themselves must be normally distributed.

  - external_key: technical.data_scientist.logistic_coefficients_explained
    competency_key: statistics_experimentation
    topic: Interpreting logistic regression coefficients
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You've fitted a logistic regression for customer conversion. How would you explain what one of its
      coefficients means to a marketing lead, and what caveats would you add?
    expected_concepts:
      - coefficient is a change in log-odds per unit of the feature
      - exponentiating gives an odds ratio
      - effect on probability depends on the baseline
      - holding other features constant
      - scaling and encoding of the feature affect magnitude
      - association rather than causation
    rubric:
      excellent: Translates log-odds to odds ratios and then to a probability change at a realistic baseline, states the conditional interpretation and warns against causal reading.
      good: Correctly explains log-odds or odds ratios with a simple example.
      weak: Describes the coefficient as a direct change in probability.
    followups:
      - How would you compare the importance of features measured on different scales?
      - What happens to the interpretation if two features are strongly correlated?
    common_errors:
      - Reading a coefficient as a fixed percentage-point change in conversion probability.

  - external_key: technical.data_scientist.coefficient_sign_flip
    competency_key: statistics_experimentation
    topic: Multicollinearity and unstable coefficients
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You add a new feature to a regression and the coefficient on an existing feature flips from positive to
      negative. A stakeholder asks which one is right. How would you investigate and explain this?
    expected_concepts:
      - correlation between the new and existing feature
      - coefficients are conditional on other variables in the model
      - variance inflation factors or examining the correlation structure
      - possible confounding or mediation
      - whether the goal is prediction or interpretation
    rubric:
      excellent: Explains that both can be correct for different questions, diagnoses collinearity or confounding concretely, and recommends a model specification based on the causal question or prediction goal.
      good: Identifies multicollinearity and suggests a diagnostic such as VIF.
      weak: Picks one coefficient as right without explaining why the sign changed.
    followups:
      - When would you drop one of the correlated features, and when would you keep both?
      - How would regularisation change what you see?
    common_errors:
      - Assuming collinearity hurts predictive accuracy as much as it hurts interpretation.

  - external_key: technical.data_scientist.simpsons_paradox
    competency_key: data_analysis
    topic: Aggregate trends that reverse within groups
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Overall conversion went up this quarter, but when you break it down, conversion fell in every single
      region. Your director thinks the data is broken. How would you explain what could be happening and
      confirm it?
    expected_concepts:
      - change in the mix of traffic across regions
      - weighted averages and composition effects
      - decomposing the change into rate and mix components
      - verifying data correctness before concluding
      - which view answers the business question
    rubric:
      excellent: Explains the mix shift with a simple numeric illustration, proposes a rate-versus-mix decomposition, and recommends which view leadership should act on.
      good: Recognises a composition effect and suggests checking the regional mix.
      weak: Assumes a data error or cannot explain how both statements can be true.
    followups:
      - How would you present this on a single slide?
      - Which number should the regional managers be measured on?
    common_errors:
      - Stopping at naming the paradox without showing the decomposition.

  - external_key: technical.data_scientist.nonparametric_tests
    competency_key: statistics_experimentation
    topic: When standard tests don't fit the data
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When the assumptions behind a t-test look shaky, what alternatives do you consider, and how do you make
      sure you're still answering the question you actually care about?
    expected_concepts:
      - t-test robustness with large samples via the central limit theorem
      - rank-based tests such as Mann-Whitney test a different hypothesis than means
      - permutation tests
      - bootstrap intervals for the mean or median
      - transformations change the quantity being compared
    rubric:
      excellent: Weighs sample size and the target quantity, explains that rank tests compare distributions rather than means, and offers permutation or bootstrap options matched to the question.
      good: Names a reasonable alternative and a reason to prefer it.
      weak: Switches to a non-parametric test by default without understanding what it tests.
    followups:
      - The business cares about average revenue. Does Mann-Whitney answer that?
      - How would you run a permutation test by hand?
    common_errors:
      - Describing Mann-Whitney as a test of medians in all cases.

  - external_key: technical.data_scientist.survey_nonresponse
    competency_key: data_analysis
    topic: Non-response bias in surveys
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A customer satisfaction survey went to everyone and only eight percent responded. The results look great.
      How much would you trust them, and what would you do to get a more reliable picture?
    expected_concepts:
      - non-response bias where respondents differ from non-respondents
      - comparing respondent characteristics with the full customer base
      - weighting or post-stratification
      - linking to behavioural data such as churn or usage
      - follow-up sampling of non-respondents
    rubric:
      excellent: Explains why low response threatens validity, compares respondents to the population on known attributes, applies weighting with its limits, and triangulates with behavioural data.
      good: Recognises non-response bias and proposes weighting or a comparison with the population.
      weak: Trusts the results because the absolute number of responses is large.
    followups:
      - What can weighting not fix?
      - How would you design the next survey to reduce this problem?
    common_errors:
      - Assuming a large number of responses removes bias.

  - external_key: technical.data_scientist.small_sample_rankings
    competency_key: statistics_experimentation
    topic: Ranking entities with very different sample sizes
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Operations wants a ranking of stores by return rate, but some stores have ten orders and others have ten
      thousand. The top and bottom of the list are full of tiny stores. How would you build a ranking you'd
      stand behind?
    expected_concepts:
      - small samples produce extreme rates by chance
      - confidence intervals or minimum sample thresholds
      - empirical Bayes or hierarchical shrinkage toward the overall rate
      - ranking by a lower bound or posterior estimate
      - explaining the adjustment to operations
    rubric:
      excellent: Explains why small stores dominate the extremes, proposes shrinkage or interval-based ranking with a concrete method, and describes how to explain it to the operations team.
      good: Proposes minimum volume thresholds or intervals and explains why.
      weak: Ranks by raw rate or simply drops small stores without considering what is lost.
    followups:
      - How would you choose the strength of the shrinkage?
      - A store manager complains their ranking was adjusted. How do you explain it?
    common_errors:
      - Using an arbitrary minimum-order cutoff that hides genuinely problematic small stores.

  - external_key: technical.data_scientist.regression_to_the_mean
    competency_key: statistics_experimentation
    topic: Regression to the mean in programme evaluation
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Last quarter the ten worst-performing sales territories got extra coaching, and this quarter they improved
      a lot. The sales director wants to roll coaching out everywhere. What would you want to check first?
    expected_concepts:
      - regression to the mean when units are selected on extreme values
      - need for a comparison group with similar starting performance
      - seasonality and company-wide trends
      - randomised or staggered rollout to measure the effect
    rubric:
      excellent: Names regression to the mean, explains why selection on poor results guarantees some improvement, and proposes a comparison group or randomised rollout to estimate the true effect.
      good: Questions the causal claim and suggests a comparison group.
      weak: Accepts the improvement as evidence the coaching works.
    followups:
      - How would you design the rollout so you can measure the effect properly?
      - What if the director insists every struggling territory must get coaching?
    common_errors:
      - Comparing coached territories to the company average instead of to similar territories.

  # ------------------------------------------------------------------ hard
  - external_key: technical.data_scientist.clustered_standard_errors
    competency_key: statistics_experimentation
    topic: Repeated observations and standard errors
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your dataset has many rows per customer, and you're estimating the effect of a feature on purchase value.
      How does that structure affect your standard errors, and what would you do about it?
    expected_concepts:
      - rows within a customer are correlated, so the effective sample size is smaller
      - naive standard errors are too small and p-values too optimistic
      - cluster-robust standard errors at the customer level
      - mixed-effects or hierarchical models with random effects
      - aggregating to the customer level as a simple alternative
    rubric:
      excellent: Explains the within-cluster correlation and its effect on variance, compares cluster-robust errors, mixed models and aggregation with their trade-offs, and mentions what happens with few clusters.
      good: Identifies the correlation problem and proposes clustered errors or aggregation.
      weak: Treats every row as independent.
    followups:
      - What goes wrong with cluster-robust errors when you only have a handful of clusters?
      - How would you choose between random effects and fixed effects here?
    common_errors:
      - Clustering at a finer level than the unit that is actually correlated.

  - external_key: technical.data_scientist.censored_churn_timing
    competency_key: statistics_experimentation
    topic: Time-to-event analysis with censoring
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're asked how long new subscribers typically stay before cancelling, but most subscribers who joined
      this year are still active. How would you approach the analysis, and why not just average the tenure of
      people who already left?
    expected_concepts:
      - right censoring of active subscribers
      - averaging only churned users biases tenure downward
      - Kaplan-Meier survival curves and median survival time
      - Cox proportional hazards or other survival regressions for covariates
      - checking the proportional hazards assumption
    rubric:
      excellent: Explains the censoring bias clearly, uses survival curves to estimate retention and median tenure, extends to covariates with a survival model, and discusses assumptions such as non-informative censoring.
      good: Recognises censoring and proposes Kaplan-Meier or a survival model.
      weak: Averages tenure of churned users or drops active users.
    followups:
      - How would you compare retention between two acquisition channels?
      - What would make the censoring informative, and why does that matter?
    common_errors:
      - Treating still-active subscribers as if they churned on the analysis date.

  - external_key: technical.data_scientist.zero_events_rate
    competency_key: statistics_experimentation
    topic: Estimating rare event rates with no observed events
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A new payment flow has processed three thousand transactions with zero failures, and the team wants to
      announce a zero percent failure rate. How would you estimate the failure rate and communicate the
      uncertainty?
    expected_concepts:
      - zero observed events does not mean a zero rate
      - exact binomial or rule-of-three upper bound of about three over n
      - Bayesian beta-binomial with an informed prior from the old flow
      - comparing against the acceptable failure threshold
      - how many more transactions would be needed to rule out a given rate
    rubric:
      excellent: Gives a concrete upper bound, explains the reasoning, offers a Bayesian alternative using prior knowledge, and frames the communication around what can and cannot be ruled out.
      good: Rejects the zero claim and gives a sensible upper bound or interval.
      weak: Accepts zero percent or cannot quantify any uncertainty.
    followups:
      - How many transactions would you need to show the rate is below one in ten thousand?
      - How would you set the prior, and how sensitive is the answer to it?
    common_errors:
      - Using a normal approximation interval, which collapses to zero width here.

  - external_key: technical.data_scientist.autocorrelated_tests
    competency_key: statistics_experimentation
    topic: Statistical testing with autocorrelated data
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Someone compares daily error rates before and after a change with a standard t-test across days. Why
      might that be misleading, and how would you do the comparison properly?
    expected_concepts:
      - daily values are autocorrelated, violating independence
      - standard errors are understated
      - trends and seasonality confound before-after comparisons
      - time series approaches such as interrupted time series or segmented regression
      - Newey-West or other HAC standard errors, or a proper control series
    rubric:
      excellent: Explains how autocorrelation shrinks effective sample size, addresses trend and seasonality, and proposes an interrupted time series or control-series design with appropriate standard errors.
      good: Identifies autocorrelation or trend as a problem and suggests a time-aware method.
      weak: Accepts the t-test or only suggests collecting more days.
    followups:
      - How would you check how strong the autocorrelation is?
      - What if another change shipped the same week?
    common_errors:
      - Adding more days of data without addressing the dependence structure.

  - external_key: technical.data_scientist.heavy_tailed_averages
    competency_key: statistics_experimentation
    topic: Estimation with heavy-tailed distributions
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      You're estimating average spend per user, and the sample average keeps jumping every time a new big
      spender shows up, even with a large sample. What's going on statistically, and how would you produce a
      stable, useful estimate?
    expected_concepts:
      - heavy-tailed or power-law distributions with very high or undefined variance
      - slow convergence of the sample mean
      - robust alternatives such as trimmed means, winsorising or medians
      - log transforms and modelling the tail separately
      - segmenting high spenders and the trade-off between bias and variance
    rubric:
      excellent: Identifies heavy tails and why the central limit theorem converges slowly, compares robust estimators and their bias, and suggests segmenting or modelling the tail explicitly depending on the business question.
      good: Recognises skew and proposes a robust estimator or transformation.
      weak: Suggests collecting more data without recognising the distributional problem.
    followups:
      - Finance needs total revenue, not a typical user. How does that change your approach?
      - How would you check how heavy the tail actually is?
    common_errors:
      - Reporting the mean of log values as if it were the mean spend.

  - external_key: technical.data_scientist.maximum_likelihood_in_practice
    competency_key: statistics_experimentation
    topic: Maximum likelihood estimation
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Explain maximum likelihood estimation as you'd explain it to a junior colleague, and then tell me how it
      connects to the loss functions and regularisation you use when training models.
    expected_concepts:
      - choosing parameters that make the observed data most probable
      - log-likelihood for numerical stability
      - squared error corresponds to Gaussian noise and log loss to Bernoulli outcomes
      - regularisation as a prior in maximum a posteriori estimation
      - limitations such as overfitting with small data
    rubric:
      excellent: Gives a clear intuitive and mathematical explanation, connects common losses to likelihoods, explains regularisation as a prior, and discusses when maximum likelihood estimates are unreliable.
      good: Explains the core idea and links at least one loss function to a likelihood.
      weak: Can define the term but cannot connect it to model training.
    followups:
      - Which likelihood would you choose for a count target, and what loss does that give you?
      - Why might maximum likelihood estimates be biased for small samples?
    common_errors:
      - Confusing the likelihood of parameters with a probability distribution over parameters.
