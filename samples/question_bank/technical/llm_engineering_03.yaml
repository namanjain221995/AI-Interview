# LLM application engineering, part 3: evaluation, hallucination mitigation, guardrails, safety and
# privacy.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [llm]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.llm_engineering.first_eval_set
    competency_key: llm_engineering
    topic: Starting an evaluation set from nothing
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you were starting evaluation for a brand-new LLM feature with no data at all, what would your first
      evaluation set look like, and where would the examples come from?
    expected_concepts:
      - small curated set covering main use cases
      - edge cases and known hard inputs
      - expected answers or grading criteria per example
      - input from domain experts or product owners
      - growing the set from production failures later
    rubric:
      excellent: Describes a small, deliberately varied first set with clear grading criteria, sourced from experts and realistic inputs, including edge and adversarial cases, and a plan to grow it from real traffic.
      good: Collects realistic examples with expected outputs and some edge cases.
      weak: Plans to test by chatting with the feature until it seems fine.
    followups:
      - How many examples would you start with, and why that number?
      - How would you decide what counts as a correct answer for open-ended outputs?
    common_errors:
      - Writing only easy, happy-path examples that the first prompt already passes.

  - external_key: technical.llm_engineering.why_models_fabricate
    competency_key: llm_engineering
    topic: Why models produce fluent wrong answers
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      In your own words, why do language models sometimes produce fluent, plausible answers that are simply wrong,
      and what does that tell you about how to design around it?
    expected_concepts:
      - next-token prediction rewards plausibility, not truth
      - gaps or outdated facts in training data
      - pressure to answer rather than abstain
      - grounding answers in supplied sources
      - verification and allowing the model to say it does not know
    rubric:
      excellent: Explains the training objective and knowledge gaps as root causes, and derives concrete design responses such as grounding, allowing abstention, verification and narrowing the task.
      good: Explains that models predict likely text and suggests grounding with retrieval.
      weak: Describes it as random glitches with no link to design choices.
    followups:
      - Why might a model invent a citation even when given the right document?
      - Which tasks are most prone to this?
    common_errors:
      - Believing a bigger model eliminates fabricated answers.

  - external_key: technical.llm_engineering.third_party_api_privacy
    competency_key: llm_engineering
    topic: Privacy review before sending data to a model API
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your support chatbot will send customer messages to a third-party model API. What privacy questions would you
      want answered before launch?
    expected_concepts:
      - provider data retention and training-use terms
      - data processing agreements and data residency
      - minimizing or redacting personal data before sending
      - what is logged on your side and for how long
      - telling users how their data is handled
    rubric:
      excellent: Covers provider retention and training terms, contracts and residency, data minimization and redaction, internal logging and retention, and user transparency, with an example of acting on one of these.
      good: Asks about retention and training use and suggests redacting sensitive fields.
      weak: Assumes the provider handles privacy and raises no questions.
    followups:
      - Which fields would you redact, and what would that break?
      - Who in the company would you involve in this review?
    common_errors:
      - Overlooking the application's own prompt and response logs as a store of personal data.

  - external_key: technical.llm_engineering.input_output_checks
    competency_key: llm_engineering
    topic: Placing input and output checks
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Where in an LLM application would you put checks on what goes in and what comes out, and what kinds of problems
      would each check catch?
    expected_concepts:
      - input checks for abuse, out-of-scope requests and injection patterns
      - output checks for policy violations and leaked data
      - format and business-rule validation of outputs
      - deterministic rules versus model-based classifiers
      - logging and handling of blocked requests
    rubric:
      excellent: Places specific checks before and after generation with clear purposes, mixes cheap deterministic rules with classifiers, and explains what happens to blocked content and how false positives are tracked.
      good: Names input moderation and output filtering with examples.
      weak: Relies entirely on the model's built-in safety behaviour.
    followups:
      - How do you measure false positives from these checks?
      - Which checks can run in parallel with generation?
    common_errors:
      - Checking inputs only and never validating what the model returns.

  - external_key: technical.llm_engineering.user_feedback_signals
    competency_key: llm_engineering
    topic: Learning from user signals
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What signals from real users would you collect to tell whether an LLM feature is actually helping, and how would
      you act on them?
    expected_concepts:
      - explicit ratings and their low response rates
      - implicit signals like edits, copies, retries and abandonment
      - task completion or downstream business outcomes
      - sampling conversations for review
      - feeding failures into the evaluation set
    rubric:
      excellent: Combines explicit and implicit signals with task outcomes, understands the bias in who leaves ratings, reviews samples and turns failures into evaluation cases.
      good: Collects ratings and some behavioural signals and reviews negatives.
      weak: Relies on thumbs up or down counts alone.
    followups:
      - What does a user regenerating an answer tell you?
      - How would you avoid reading too much into a handful of complaints?
    common_errors:
      - Treating a low volume of explicit ratings as representative of all users.

  - external_key: technical.llm_engineering.over_refusal
    competency_key: llm_engineering
    topic: Fixing excessive refusals
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      After you tightened the safety rules, your assistant now refuses lots of perfectly harmless requests. How would
      you find and fix the over-refusal without opening the door to real misuse?
    expected_concepts:
      - measuring refusal rate on a benign request set
      - paired evaluation with genuinely harmful requests
      - narrowing overly broad rules or classifier thresholds
      - examples of allowed borderline requests in the prompt
      - monitoring refusal rates in production
    rubric:
      excellent: Builds benign and harmful test sets, measures both refusal and miss rates, narrows rules or thresholds with examples, and monitors refusals after release.
      good: Collects false refusals and loosens the rules while testing on harmful cases.
      weak: Removes the safety rules or ignores the problem.
    followups:
      - How would you find over-refusals in production logs?
      - Who decides where the line between allowed and refused requests sits?
    common_errors:
      - Measuring only one side, so fixing refusals quietly lets harmful requests through.

  - external_key: technical.llm_engineering.accurate_citations
    competency_key: llm_engineering
    topic: Citations that are actually accurate
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Product asks that every answer from your document assistant show its sources. How would you implement citations
      so they actually point at the passages that support each claim?
    expected_concepts:
      - giving passages stable ids in the prompt
      - asking for citations per sentence or claim
      - validating cited ids exist among retrieved passages
      - checking cited passage supports the claim
      - linking to the exact location in the source
    rubric:
      excellent: Labels passages with ids, requests claim-level citations, validates ids and support automatically, links to exact source locations and measures citation precision.
      good: Labels passages and asks the model to cite them, checking ids are valid.
      weak: Lists all retrieved documents under every answer regardless of use.
    followups:
      - How would you measure citation accuracy?
      - What should happen to a sentence with no supporting citation?
    common_errors:
      - Accepting citation ids without checking they were in the retrieved set.

  - external_key: technical.llm_engineering.task_specific_metrics
    competency_key: llm_engineering
    topic: Choosing metrics per feature
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      For a feature that answers customer questions, which quality metrics would you track, and how would they differ
      from the metrics for a feature that drafts marketing copy?
    expected_concepts:
      - correctness and groundedness for question answering
      - resolution or deflection rate as an outcome
      - style, brand guideline adherence and edit distance for drafting
      - human preference ratings for creative tasks
      - latency and cost for both
    rubric:
      excellent: Picks metrics that follow from each task's purpose, combining correctness and grounding for answers with adherence, preference and edit effort for drafting, plus outcome, latency and cost.
      good: Distinguishes accuracy-focused metrics from quality or style ratings.
      weak: Uses the same generic score for both, or only measures latency.
    followups:
      - How would you measure how much a user had to edit a draft?
      - Which of these would you check automatically on every change?
    common_errors:
      - Applying exact-match metrics to open-ended generated text.

  # ------------------------------------------------------------------ medium
  - external_key: technical.llm_engineering.judge_rubric_design
    competency_key: llm_engineering
    topic: Designing an LLM judge
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Walk me through how you'd design an LLM-based judge for answer quality — the rubric, the prompt, and how you'd
      check that it agrees with expert reviewers.
    expected_concepts:
      - specific, observable criteria scored separately
      - reference answers or source passages given to the judge
      - reasoning before the score
      - agreement measured against human labels
      - spot checks and recalibration over time
    rubric:
      excellent: Builds a criterion-level rubric with references, asks for reasoning before scoring, measures agreement with expert labels per criterion and iterates on disagreements.
      good: Uses a rubric and compares judge scores with some human ratings.
      weak: Asks the judge to rate quality from one to ten with no rubric or validation.
    followups:
      - What agreement level would make you trust the judge?
      - Would you use the same model as judge and as the system under test?
    common_errors:
      - Using one holistic score that hides which criterion failed.

  - external_key: technical.llm_engineering.pairwise_evaluation
    competency_key: llm_engineering
    topic: Pairwise comparison and position bias
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When would you use pairwise comparisons instead of absolute scores to evaluate two versions of a system, and how
      would you handle position and length bias?
    expected_concepts:
      - pairwise judgements are more consistent than absolute scales
      - win rate with ties
      - swapping order and averaging
      - judges preferring longer answers
      - statistical significance of win rates
    rubric:
      excellent: Explains when pairwise is more reliable, runs both orderings, controls for verbosity, reports win rates with ties and confidence intervals, and validates against human preferences.
      good: Knows to swap positions and compute win rates.
      weak: Unaware that order and length bias judgements.
    followups:
      - How many comparisons do you need to detect a small improvement?
      - How do you turn pairwise results across several versions into a ranking?
    common_errors:
      - Always presenting the new version second and reading the bias as improvement.

  - external_key: technical.llm_engineering.groundedness_checking
    competency_key: llm_engineering
    topic: Automatic groundedness checks
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you automatically check whether an answer is actually supported by the retrieved context, and where do
      those checks tend to fail?
    expected_concepts:
      - splitting answers into atomic claims
      - entailment checking with NLI models or LLM judges
      - per-claim support scores aggregated to an answer score
      - failures on paraphrase, implicit reasoning and numbers
      - calibration against human-labelled examples
    rubric:
      excellent: Decomposes answers into claims, checks each against sources with an entailment model or judge, aggregates scores, names failure modes such as arithmetic and implied facts, and validates on labelled data.
      good: Uses an LLM or NLI model to check answers against context.
      weak: Checks word overlap between answer and context only.
    followups:
      - How would you use this check at runtime rather than offline?
      - What would you do with an answer that is correct but not supported by the context?
    common_errors:
      - Counting general knowledge in the answer as a failure when the product allows it, or the reverse.

  - external_key: technical.llm_engineering.privacy_safe_logging
    competency_key: llm_engineering
    topic: Logging prompts without creating a privacy problem
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Logs of prompts and responses are invaluable for debugging, but they're full of customer personal data. How would
      you design logging that stays useful without creating a privacy problem?
    expected_concepts:
      - redacting or tokenizing personal data before storage
      - separating metadata logs from full content
      - short retention and access controls for content
      - honoring deletion requests across logs and eval sets
      - audit trails for who viewed content
    rubric:
      excellent: Separates always-on metadata from restricted, short-lived content logs, redacts before storage, controls and audits access, and handles deletion requests including copies in evaluation data.
      good: Redacts personal data and limits retention and access.
      weak: Logs everything indefinitely, or logs nothing and loses the ability to debug.
    followups:
      - How would you debug a bad answer when the content was redacted?
      - How do you know your redaction isn't missing things?
    common_errors:
      - Copying production conversations into evaluation sets with no retention rules.

  - external_key: technical.llm_engineering.noisy_eval_release_gates
    competency_key: llm_engineering
    topic: Release gates with noisy evaluation scores
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your evaluation scores bounce around by a couple of points between identical runs, which makes it hard to tell
      whether a prompt change helped. How would you set release gates that account for that noise?
    expected_concepts:
      - measuring run-to-run variance
      - repeated runs and confidence intervals
      - paired comparison on the same examples
      - per-category guardrail thresholds on critical cases
      - larger or more targeted evaluation sets
    rubric:
      excellent: Measures the noise floor, uses paired comparisons and repeated runs with intervals, sets thresholds above noise with hard gates on critical categories, and grows the set where variance is high.
      good: Runs evaluations several times and compares averages.
      weak: Ships whenever the score goes up, regardless of noise.
    followups:
      - Where does the noise come from in the first place?
      - How would you keep evaluation time and cost reasonable with repeated runs?
    common_errors:
      - Treating a one-point change from a single run as a real improvement.

  - external_key: technical.llm_engineering.pre_launch_red_teaming
    competency_key: llm_engineering
    topic: Red-teaming before launch
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're about to launch a public-facing assistant. How would you plan red-teaming before launch, and what would you
      do with what you find?
    expected_concepts:
      - threat model of likely misuse and harms
      - manual testing by varied testers plus automated attack generation
      - jailbreaks, data extraction and harmful content categories
      - triage by severity and fix verification
      - turning findings into regression tests
    rubric:
      excellent: Starts from a threat model, combines manual and automated attacks across categories, triages by severity, fixes with layered defences and keeps findings as regression tests after launch.
      good: Tests known jailbreak types and fixes the worst issues.
      weak: Tries a few attacks personally and calls it done.
    followups:
      - How would you decide a finding is serious enough to delay launch?
      - How do you keep red-teaming going after launch?
    common_errors:
      - Fixing each finding with a prompt patch that fails on the next variation.

  - external_key: technical.llm_engineering.poisoned_corpus_document
    competency_key: security
    topic: Poisoned documents in a RAG corpus
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You discover that a document in your RAG corpus contains hidden text telling the model to add a particular link to
      every answer. How could you detect this kind of attack and limit the damage?
    expected_concepts:
      - treating retrieved content as untrusted data
      - scanning ingested content for instruction-like text and hidden formatting
      - restricting who can add content to the corpus
      - output checks for unexpected links and domains
      - provenance tracking to trace and purge affected documents
    rubric:
      excellent: Treats the corpus as an attack surface, controls and tracks provenance of content, scans for hidden instructions, constrains outputs such as link allow-lists, and can trace and purge affected documents quickly.
      good: Sanitizes ingested documents and filters suspicious links from answers.
      weak: Removes the one document and adds a prompt line saying to ignore instructions.
    followups:
      - How would you find other answers already affected?
      - Why can't you rely on the model to spot injected instructions?
    common_errors:
      - Trusting internal documents by default because they come from inside the company.

  - external_key: technical.llm_engineering.render_exfiltration
    competency_key: security
    topic: Data leakage through rendered output
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How can an LLM chat interface leak data through what it renders — things like markdown images or links — and
      what would you do to prevent it?
    expected_concepts:
      - image URLs carrying data in query strings fetched automatically
      - injected instructions causing the model to build such URLs
      - allow-listing domains for images and links
      - sanitizing or disabling rendering of untrusted markup
      - content security policy on the client
    rubric:
      excellent: Explains how an injected instruction makes the model embed data in an auto-fetched URL, and layers domain allow-lists, sanitized rendering and a content security policy, testing with attack examples.
      good: Knows rendered images or links can send data out and suggests restricting them.
      weak: Does not see the rendering layer as a risk.
    followups:
      - Which other output channels could carry data out?
      - How would you test that the defence works?
    common_errors:
      - Sanitizing user input but rendering model output as trusted markup.

  - external_key: technical.llm_engineering.online_experiments
    competency_key: llm_engineering
    topic: Online experiments for LLM changes
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you run an online experiment comparing two prompt or model versions, and what makes that harder for LLM
      features than for an ordinary UI change?
    expected_concepts:
      - choosing outcome metrics tied to user value
      - randomizing by user or session for consistency
      - higher variance and novelty effects
      - guardrail metrics for cost, latency and safety
      - combining with offline evaluation and sampled review
    rubric:
      excellent: Defines outcome and guardrail metrics, randomizes at the right unit, plans sample size for noisy outcomes, monitors safety and cost, and complements results with sampled qualitative review.
      good: Splits traffic and compares a user metric plus latency and cost.
      weak: Compares the two versions on different weeks or on a handful of conversations.
    followups:
      - What would you do if the new version wins on engagement but loses on accuracy?
      - How long would you run the experiment?
    common_errors:
      - Randomizing per request so one user sees both versions inside one conversation.

  - external_key: technical.llm_engineering.scarce_expert_review
    competency_key: llm_engineering
    topic: Human evaluation with scarce experts
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're building an assistant for insurance claim handlers, and only experienced adjusters can judge whether its
      answers are right. How would you organise human evaluation when their time is very limited?
    expected_concepts:
      - clear review guidelines and a simple labelling interface
      - prioritizing uncertain or high-risk samples for review
      - calibrating a cheaper automated judge on expert labels
      - measuring agreement between reviewers
      - reusing labels as a permanent test set
    rubric:
      excellent: Uses experts where they add most, with targeted sampling, clear guidelines and agreement checks, and leverages their labels to calibrate automated judges and build a reusable test set.
      good: Has experts label a small sample regularly with guidelines.
      weak: Asks experts to review everything or skips expert review.
    followups:
      - How would you handle two adjusters disagreeing on an answer?
      - How would you keep the experts' work from being wasted when the system changes?
    common_errors:
      - Asking experts for an overall thumbs up or down that cannot guide fixes.

  - external_key: technical.llm_engineering.actionable_output_validation
    competency_key: llm_engineering
    topic: Validating outputs before acting on them
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Beyond checking that the format is right, how do you make sure an LLM's output is safe to act on — for example a
      generated discount code amount or a database query it wrote?
    expected_concepts:
      - business rule validation in code
      - allow-lists and range checks
      - read-only or sandboxed execution of generated queries
      - query analysis or parameterization
      - human confirmation for high-impact actions
    rubric:
      excellent: Enforces business rules, ranges and allow-lists in code, runs generated queries with least privilege and limits, analyses them before execution and adds confirmation for high-impact actions.
      good: Validates values against rules and runs queries with restricted permissions.
      weak: Executes output directly once it parses.
    followups:
      - How would you limit a generated query that scans a huge table?
      - Where would you draw the line for requiring human confirmation?
    common_errors:
      - Running generated SQL with the application's full database credentials.

  # ------------------------------------------------------------------ hard
  - external_key: technical.llm_engineering.eval_contamination
    competency_key: llm_engineering
    topic: Contamination in evaluation
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you make sure your evaluation results aren't inflated by contamination — test examples leaking into
      prompts, few-shot examples, fine-tuning data or even the model's pretraining?
    expected_concepts:
      - strict separation of tuning and test sets
      - deduplication with near-duplicate detection
      - private, recently written test items
      - checking public benchmarks for memorization
      - tracking data lineage of every set
    rubric:
      excellent: Separates development and held-out sets, deduplicates by near-duplicate matching across every data source, writes fresh private test items, probes for memorization and tracks lineage.
      good: Keeps test data out of prompts and training and deduplicates exact matches.
      weak: Unaware contamination can happen through few-shot examples or pretraining.
    followups:
      - How would you detect that a model has memorized a public benchmark?
      - How often would you refresh the held-out set?
    common_errors:
      - Choosing few-shot examples from the same pool as the test set.

  - external_key: technical.llm_engineering.hallucination_rate_definition
    competency_key: llm_engineering
    topic: Defining a hallucination rate metric
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Leadership wants a single hallucination rate for your product reported every month. How would you define and
      measure it so the number actually means something?
    expected_concepts:
      - clear operational definition of an unsupported claim
      - representative sampling of production traffic
      - claim-level versus answer-level rates
      - human-validated automated measurement
      - severity weighting and confidence intervals
      - keeping the method stable for trend comparison
    rubric:
      excellent: Defines unsupported claims precisely, samples traffic representatively, measures with a judge validated against humans, reports intervals and severity, and keeps the method fixed so month-to-month changes are real.
      good: Samples answers, labels them against sources and reports a rate.
      weak: Reports a number from a handful of hand-checked answers or a vendor benchmark.
    followups:
      - What would you do if the product mix changes and the rate shifts?
      - Would you report one number or several?
    common_errors:
      - Changing the measurement method between months and reporting the difference as progress.

  - external_key: technical.llm_engineering.multi_tenant_isolation
    competency_key: security
    topic: Tenant isolation on an LLM platform
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You run a multi-tenant LLM platform with shared caches, shared vector stores and per-customer fine-tuned
      adapters. How would you make sure one customer's data never shows up in another customer's answers?
    expected_concepts:
      - tenant id enforced at every data access layer
      - cache keys scoped by tenant
      - partitioned or filtered vector indexes with enforced filters
      - adapter routing tied to authenticated tenant
      - training data separation for shared models
      - automated cross-tenant leakage tests
    rubric:
      excellent: Enforces tenant scope in the data layer for caches, vectors, adapters and logs, separates training data, and proves isolation with automated cross-tenant tests and audits.
      good: Partitions vector data and scopes caches by tenant.
      weak: Relies on the application passing the right filter with no enforcement or testing.
    followups:
      - How would a prompt cache leak data across tenants?
      - What would you do if a leak was reported?
    common_errors:
      - Sharing a response cache across tenants keyed only on the prompt text.

  - external_key: technical.llm_engineering.guardrail_latency_budget
    competency_key: llm_engineering
    topic: Guardrails within a tight latency budget
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your safety checks add around six hundred milliseconds to every response in a voice product, and users notice the
      delay. How would you restructure them to keep the protection but lose the latency?
    expected_concepts:
      - running input checks in parallel with generation
      - streaming output checks on partial text
      - small, fast classifiers instead of large models
      - risk-based tiering of checks
      - ability to stop or retract speech mid-stream
    rubric:
      excellent: Runs checks concurrently, streams output checks chunk by chunk with the ability to stop playback, uses small fast classifiers and tiers checks by risk, and measures both latency and catch rate.
      good: Runs checks in parallel and uses faster models.
      weak: Removes the checks or accepts the latency.
    followups:
      - What happens if an unsafe sentence has already been spoken?
      - How would you verify the faster checks catch as much as the old ones?
    common_errors:
      - Waiting for the full response before checking it in a streaming product.

  - external_key: technical.llm_engineering.judge_model_drift
    competency_key: llm_engineering
    topic: Keeping LLM judges trustworthy over time
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your LLM judge was calibrated six months ago, and since then the vendor has upgraded the judge model. What risks
      does that create, and how do you manage judges over time?
    expected_concepts:
      - pinning judge model versions
      - re-validating against a stored human-labelled set
      - score shifts breaking trend comparisons
      - versioning judge prompts and models together
      - re-baselining historic results when changing judges
    rubric:
      excellent: Pins and versions judges, re-checks agreement with a stored human set on any change, re-baselines historic scores and treats the judge as a component with its own tests.
      good: Pins the judge version and re-checks against human labels when it changes.
      weak: Assumes the judge stays the same over time.
    followups:
      - What would you do if the pinned judge version is being retired?
      - How large should the stored human-labelled set be?
    common_errors:
      - Comparing scores from different judge versions as if they were one series.

  - external_key: technical.llm_engineering.abstention_calibration
    competency_key: llm_engineering
    topic: Calibrated abstention
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you give an LLM application a dependable way to say "I don't know", and how would you measure whether it
      abstains at the right times?
    expected_concepts:
      - retrieval score and evidence-coverage signals
      - self-consistency across multiple samples
      - token log probabilities or verifier scores
      - abstention as an explicit allowed output
      - coverage versus accuracy curves on a labelled set
    rubric:
      excellent: Combines several uncertainty signals, makes abstention an explicit option, tunes the threshold on a labelled set using coverage versus accuracy trade-offs and checks it per question category.
      good: Lets the model abstain when evidence is weak and measures wrong answers versus abstentions.
      weak: Asks the model to rate its own certainty and trusts the number.
    followups:
      - How would you choose the operating point for a high-risk domain?
      - What does a user need to see when the assistant abstains?
    common_errors:
      - Trusting the model's self-reported certainty without checking it against outcomes.
