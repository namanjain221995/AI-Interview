# Curated questions: product management (part 4 of 4).
# Launches (readiness, rollouts, launch incidents, betas, reviews, pricing changes, sunsetting)
# and experiments (hypotheses, sample size, peeking, guardrails, novelty, interference, validity).
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [product_manager]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.product_manager.launch_readiness
    competency_key: project_management
    topic: Deciding a feature is ready to launch
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What do you check before you consider a feature ready to launch? Walk me through a launch you ran
      yourself.
    expected_concepts:
      - acceptance criteria met and quality checked
      - instrumentation and dashboards ready
      - support, documentation and internal teams prepared
      - rollout and rollback plan
      - launch criteria agreed with engineering and stakeholders in advance
    rubric:
      excellent: Describes a concrete launch with readiness criteria across quality, measurement, operations and communication, agreed in advance, plus a rollback plan.
      good: Covers the main readiness areas with a real example.
      weak: Equates readiness with code being finished.
    followups:
      - What was missing from that launch that you only noticed afterwards?
      - Who made the final go decision?
    common_errors:
      - Forgetting to prepare support before customers start asking questions.

  - external_key: technical.product_manager.experiment_hypothesis_upfront
    competency_key: statistics_experimentation
    topic: Writing down an experiment plan in advance
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Before you start an A/B test, what do you write down, and why does it matter to agree on it before
      the test begins?
    expected_concepts:
      - hypothesis linking the change to a user behaviour
      - primary metric and guardrail metrics
      - expected effect size and planned duration
      - decision rule for ship, iterate or drop
      - prevents choosing metrics after seeing results
    rubric:
      excellent: Lists hypothesis, primary and guardrail metrics, duration and decision rule, and explains how pre-registration protects against biased reading of results, with an example.
      good: Names a hypothesis and a primary metric and understands why to set them first.
      weak: Starts tests without a plan and decides what to look at afterwards.
    followups:
      - Tell me about a test where agreeing the plan in advance saved an argument later.
      - How specific should the hypothesis be?
    common_errors:
      - Looking at many metrics afterwards and reporting whichever one improved.

  - external_key: technical.product_manager.instrument_before_launch
    competency_key: requirements_analysis
    topic: Planning feature instrumentation
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you make sure a new feature is instrumented well enough to answer the questions you'll have
      after launch?
    expected_concepts:
      - starting from the questions and metrics, not a list of clicks
      - defining events and their properties with engineering
      - including the steps before and after the feature
      - checking the data in testing before launch
      - consistent naming and documentation
    rubric:
      excellent: Starts from the decisions the data must support, defines events and properties with engineering, verifies the tracking before launch, and keeps it documented.
      good: Plans events in advance and checks them.
      weak: Asks to track everything or adds tracking only after questions come up.
    followups:
      - What did you once forget to track, and what did it cost you?
      - How do you keep event names consistent across teams?
    common_errors:
      - Not verifying the events in a test environment, so launch data is broken.

  - external_key: technical.product_manager.prepare_internal_teams
    competency_key: communication
    topic: Preparing internal teams for a launch
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When a feature launches, how do you prepare support, sales and marketing so they can talk about it
      accurately?
    expected_concepts:
      - briefing early with what changed, who it is for and why
      - known limitations and answers to likely questions
      - demos or training for customer-facing teams
      - a channel for feedback and issues after launch
      - timing aligned with the rollout
    rubric:
      excellent: Describes a concrete enablement plan with materials, known limitations, timing tied to the rollout, and a feedback loop, using a real launch.
      good: Briefs internal teams with useful material before launch.
      weak: Sends a release note on launch day or leaves enablement to others.
    followups:
      - How did you find out whether sales were describing the feature correctly?
      - What do you tell them about what the feature doesn't do?
    common_errors:
      - Briefing teams on features without saying which customers it is not suitable for.

  - external_key: technical.product_manager.mixed_launch_feedback
    competency_key: product_sense
    topic: Responding to mixed feedback after launch
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A feature you launched last week is getting mixed feedback. Some users like it, and others say it
      made their workflow harder. What would you do in the first few days?
    expected_concepts:
      - finding out which users are unhappy and why
      - checking usage and metrics against expectations
      - separating adjustment to change from real problems
      - quick fixes or options for affected users
      - communicating with users and internal teams
    rubric:
      excellent: Segments the feedback, checks behaviour data, distinguishes adjustment friction from real regressions, and takes targeted action while keeping users and teams informed.
      good: Investigates who is affected and responds sensibly.
      weak: Rolls back immediately on the first complaints or ignores the negative feedback.
    followups:
      - What would make you roll the change back?
      - How would you follow up with the users who complained?
    common_errors:
      - Treating the loudest complaints as representative of all users.

  - external_key: technical.product_manager.inconclusive_test_result
    competency_key: statistics_experimentation
    topic: Deciding after an inconclusive test
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your A/B test has finished and the result isn't statistically significant, but your designer still
      believes the new version is better. How would you decide what to ship?
    expected_concepts:
      - no significant difference is not proof of no effect
      - checking whether the test had enough power
      - considering other evidence such as usability or consistency benefits
      - cost of maintaining the change
      - making a decision and moving on rather than rerunning indefinitely
    rubric:
      excellent: Explains what an inconclusive result does and doesn't mean, checks power, weighs other evidence and costs, and makes a clear decision with the designer.
      good: Understands that the result is inconclusive and makes a reasoned call.
      weak: Treats the result as proof that the change failed, or ships based purely on opinion.
    followups:
      - When would you rerun the test with more traffic?
      - How would you document the decision?
    common_errors:
      - Reading a non-significant result as proof that the versions perform the same.

  - external_key: technical.product_manager.run_beta_program
    competency_key: product_sense
    topic: Running a beta or early access programme
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you run a beta or early access programme so that you actually learn something before the full
      launch?
    expected_concepts:
      - clear learning goals for the beta
      - choosing participants who represent target users
      - structured feedback channels and usage tracking
      - criteria for exiting the beta
      - acting on findings and telling participants what changed
    rubric:
      excellent: Describes a beta with explicit goals, deliberate participant selection, structured feedback, exit criteria and real changes made as a result.
      good: Runs a beta with feedback collection and sensible participants.
      weak: Treats the beta as a soft launch with no learning goals.
    followups:
      - How did you recruit participants?
      - What did a beta teach you that changed the launch?
    common_errors:
      - Choosing only the most engaged power users, who don't represent typical users.

  # ---------------------------------------------------------------- medium
  - external_key: technical.product_manager.staged_rollout_plan
    competency_key: project_management
    topic: Planning a staged rollout
    difficulty: medium
    kind: technical
    text: >-
      How do you decide how to roll out a risky change, for example to internal users first or to a small
      percentage of customers, and what tells you it's safe to expand?
    expected_concepts:
      - feature flags and percentage rollouts
      - choosing early groups by risk and representativeness
      - success and health criteria for each stage
      - monitoring errors, performance and key metrics
      - rollback plan and who decides
    rubric:
      excellent: Describes a staged plan with clear criteria for each step, monitoring, an agreed rollback trigger and owner, using a real example.
      good: Explains staged rollouts with sensible monitoring.
      weak: Releases to everyone at once or expands without defined criteria.
    followups:
      - What would make you pause the rollout halfway?
      - How long do you wait at each stage?
    common_errors:
      - Expanding the rollout on a schedule regardless of what the metrics show.

  - external_key: technical.product_manager.launch_day_errors
    competency_key: communication
    topic: Handling a broken launch
    difficulty: medium
    kind: scenario
    text: >-
      On launch day, your new feature starts causing errors for a portion of users, and marketing has
      already sent the announcement email. What would you do?
    expected_concepts:
      - assessing severity and scope with engineering
      - turning off the feature or rolling back if needed
      - clear, timely communication with support, marketing and users
      - deciding whether to pause further announcements
      - a review afterwards to prevent repeats
    rubric:
      excellent: Prioritises limiting user harm, makes a clear rollback decision with engineering, coordinates communication internally and externally, and plans a blameless review.
      good: Works with engineering on the fix and keeps stakeholders informed.
      weak: Focuses on protecting the announcement or waits for engineering without coordinating communication.
    followups:
      - What would you say to users who clicked the email and hit errors?
      - What would you change about the next launch?
    common_errors:
      - Keeping a broken feature live to avoid admitting the launch had problems.

  - external_key: technical.product_manager.experiment_duration_low_traffic
    competency_key: statistics_experimentation
    topic: Experiment duration and detectable effect
    difficulty: medium
    kind: technical
    text: >-
      How do you work out how long an experiment needs to run and how big an effect it can realistically
      detect? And what do you do when your traffic is too low?
    expected_concepts:
      - baseline rate, minimum detectable effect and power
      - running full weekly cycles
      - low traffic means only large effects are detectable
      - alternatives such as bigger changes, more sensitive metrics or qualitative testing
      - deciding whether a test is worth running at all
    rubric:
      excellent: Explains the relationship between baseline, detectable effect, sample size and duration, and gives practical options for low traffic with an example.
      good: Understands sample size and power at a working level and suggests alternatives.
      weak: Runs tests until something looks significant or ignores sample size.
    followups:
      - What minimum effect would be worth detecting for your product?
      - How would you test a change on a page with a few hundred visitors a week?
    common_errors:
      - Running a test for a few days and stopping when the numbers look good.

  - external_key: technical.product_manager.stop_test_early_request
    competency_key: statistics_experimentation
    topic: Pressure to stop an experiment early
    difficulty: medium
    kind: scenario
    text: >-
      A week into a planned three-week experiment, a stakeholder sees that the new version is ahead and asks
      you to stop the test and ship it. How would you respond?
    expected_concepts:
      - early results fluctuate and repeated checking inflates false positives
      - weekly patterns and novelty effects
      - the cost of a wrong decision versus waiting two more weeks
      - sequential testing methods if early stopping is needed
      - explaining this in plain language
    rubric:
      excellent: Explains in plain terms why stopping early is risky, weighs the cost of waiting, mentions designed early-stopping approaches, and keeps the stakeholder on side.
      good: Recommends waiting with a clear explanation.
      weak: Stops the test because the numbers look good, or refuses without explanation.
    followups:
      - When would stopping early be reasonable?
      - How would you set up future tests so this pressure is easier to handle?
    common_errors:
      - Checking results daily and stopping at the first significant reading.

  - external_key: technical.product_manager.conversion_up_refunds_up
    competency_key: statistics_experimentation
    topic: Primary metric up, guardrail down
    difficulty: medium
    kind: scenario
    text: >-
      Your experiment increased conversion, but it also increased refund requests. How would you decide
      whether to ship?
    expected_concepts:
      - net impact on revenue and customer value
      - understanding why refunds rose, such as misleading copy
      - segmenting who converted and who asked for refunds
      - longer-term effects on trust and retention
      - iterating to keep the gain without the harm
    rubric:
      excellent: Quantifies net impact, investigates why refunds rose, considers longer-term trust and retention, and proposes a revised variant rather than a simple yes or no.
      good: Weighs both metrics and looks at net impact.
      weak: Ships because the primary metric won, or drops the change without understanding it.
    followups:
      - What if the net revenue was positive?
      - How would you redesign the variant?
    common_errors:
      - Counting the conversion gain without subtracting the cost of refunds and support.

  - external_key: technical.product_manager.novelty_effect
    competency_key: statistics_experimentation
    topic: Telling lasting effects from novelty
    difficulty: medium
    kind: technical
    text: >-
      How do you tell whether an experiment's positive result will last, rather than being driven by users
      reacting to something new and different?
    expected_concepts:
      - looking at the effect over time within the test
      - comparing new users with existing users
      - running longer or checking later cohorts
      - holdouts to measure the effect after launch
      - the opposite case where users initially resist change
    rubric:
      excellent: Describes concrete checks such as effect over time and new versus existing users, uses holdouts after launch, and notes that change aversion can hide real gains.
      good: Recognises novelty effects and suggests checking over time.
      weak: Assumes any positive result will persist.
    followups:
      - How would you spot the opposite, where users dislike change at first?
      - How long would you keep a holdout?
    common_errors:
      - Judging a redesign on its first few days of data.

  - external_key: technical.product_manager.when_not_to_ab_test
    competency_key: statistics_experimentation
    topic: When not to run an A/B test
    difficulty: medium
    kind: technical
    text: >-
      When would you choose not to run an A/B test, and what would you do instead to judge whether a change
      worked?
    expected_concepts:
      - too little traffic or a very long feedback loop
      - changes that must apply to everyone, such as legal or pricing parity
      - obvious fixes where testing adds little
      - alternatives such as before and after analysis, staged rollouts or qualitative testing
      - accepting weaker evidence and being clear about it
    rubric:
      excellent: Gives several realistic situations where testing is impractical or unnecessary, and describes credible alternative methods with their limitations.
      good: Names a couple of good reasons and an alternative.
      weak: Believes everything should be A/B tested, or never tests.
    followups:
      - How would you strengthen a before and after comparison?
      - Have you tested something that wasn't worth testing?
    common_errors:
      - Comparing before and after without accounting for seasonality or other launches.

  - external_key: technical.product_manager.main_plan_price_rise
    competency_key: product_sense
    topic: Planning a price increase
    difficulty: medium
    kind: scenario
    text: >-
      Your company wants to raise prices on its main plan. As the product manager, how would you help decide
      the change and plan the rollout?
    expected_concepts:
      - understanding value delivered and willingness to pay by segment
      - competitor pricing and positioning
      - impact on conversion, churn and revenue
      - grandfathering or notice for existing customers
      - communication tied to value and monitoring after the change
    rubric:
      excellent: Grounds the decision in value and willingness-to-pay research, models revenue and churn impact, plans the transition for existing customers, and sets up monitoring.
      good: Considers customer impact and plans communication.
      weak: Treats it as just changing a number on the pricing page.
    followups:
      - How would you research willingness to pay?
      - What would make you reverse the change?
    common_errors:
      - Ignoring how existing customers will be moved to the new price.

  - external_key: technical.product_manager.retire_low_usage_feature
    competency_key: product_sense
    topic: Retiring a low-usage feature
    difficulty: medium
    kind: scenario
    text: >-
      A feature is used by about three percent of customers but costs a lot to maintain. How would you
      decide whether to remove it, and how would you go about it?
    expected_concepts:
      - who the users are and how much they depend on it
      - revenue and contracts tied to those customers
      - maintenance cost and opportunity cost
      - alternatives or migration paths
      - notice period and clear communication
    rubric:
      excellent: Analyses who depends on the feature and the revenue at stake against cost, offers alternatives, and plans a respectful deprecation with notice and support.
      good: Weighs usage and cost and plans communication.
      weak: Removes it based on the usage percentage alone, or keeps it to avoid complaints.
    followups:
      - What if one of those customers is among your largest accounts?
      - How would you measure whether the removal went well?
    common_errors:
      - Looking only at the percentage of users, not who they are.

  - external_key: technical.product_manager.post_launch_review
    competency_key: product_sense
    topic: Reviewing a launch afterwards
    difficulty: medium
    kind: technical
    text: >-
      A few weeks after a launch, how do you run a review so the team actually learns something, rather
      than just celebrating or moving on?
    expected_concepts:
      - comparing results with the original hypothesis and targets
      - what went well and what didn't in the process
      - user feedback and data together
      - deciding next steps for the feature
      - sharing learnings beyond the team
    rubric:
      excellent: Describes a structured review against original goals, covering both outcome and process, leading to concrete next steps and shared learning.
      good: Reviews results against goals with the team.
      weak: Does not review launches, or only reports activity.
    followups:
      - What did a launch review change about how your team works?
      - How do you keep the review blameless?
    common_errors:
      - Reviewing only whether the feature shipped on time, not whether it worked.

  - external_key: technical.product_manager.improve_activation
    competency_key: product_sense
    topic: Improving new-user activation
    difficulty: medium
    kind: scenario
    text: >-
      Lots of new users sign up for your product but never complete the first key action. How would you go
      about improving activation?
    expected_concepts:
      - defining the activation moment linked to retention
      - finding where in the journey users drop off
      - talking to users who signed up and stalled
      - hypotheses such as unclear value, setup effort or wrong audience
      - testing changes and measuring downstream retention
    rubric:
      excellent: Defines activation with evidence of its link to retention, diagnoses drop-off with data and conversations, and tests targeted changes while measuring retention, not just activation.
      good: Investigates the drop-off and proposes testable changes.
      weak: Adds tooltips or emails without understanding why users stall.
    followups:
      - How would you check that the activation action predicts retention?
      - What if the users are simply not the right audience?
    common_errors:
      - Forcing users through the key action, which raises activation without improving retention.

  # ------------------------------------------------------------------ hard
  - external_key: technical.product_manager.uneven_experiment_split
    competency_key: statistics_experimentation
    topic: Detecting a broken experiment split
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your experiment was meant to split users fifty-fifty, but the control group ended up with noticeably
      more users than the treatment group. What could cause that, and what would you do with the results?
    expected_concepts:
      - sample ratio mismatch means results may be biased
      - causes such as redirects, crashes, bot filtering or assignment bugs
      - checking the split by platform and over time
      - not trusting the results until the cause is found
      - fixing and rerunning the test
    rubric:
      excellent: Recognises the mismatch as a validity problem, lists plausible technical causes and how to find them, and refuses to act on the results until fixed.
      good: Identifies the issue as a sign of a bug and investigates before trusting results.
      weak: Ignores the imbalance or simply reweights the groups.
    followups:
      - How would you check for this automatically in future tests?
      - What if the cause is that the new version crashes for some users?
    common_errors:
      - Assuming a mismatch is random noise and reading the results anyway.

  - external_key: technical.product_manager.experiment_interference
    competency_key: statistics_experimentation
    topic: Experiments where groups affect each other
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you test a change in a marketplace or social product where users in the test group affect
      the experience of users in the control group?
    expected_concepts:
      - interference between groups biases simple user-level tests
      - randomising by cluster such as region, market or network
      - switchback or time-based designs
      - trade-off of fewer units and less statistical power
      - measuring both sides of the marketplace
    rubric:
      excellent: Explains how interference biases results with a concrete example, proposes cluster or switchback designs, and discusses the power trade-off and two-sided metrics.
      good: Recognises the interference problem and suggests a cluster-based design.
      weak: Runs a standard user-level test without noticing the problem.
    followups:
      - How would you choose the cluster size?
      - What would you do if there were too few clusters for a reliable test?
    common_errors:
      - Reading a gain in the treatment group as a net gain when it took demand from the control.

  - external_key: technical.product_manager.segments_move_opposite_ways
    competency_key: statistics_experimentation
    topic: Opposite effects across segments
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      An experiment shows no overall effect, but when you split the results, new users improved a lot and
      existing users got worse. How would you interpret that and decide what to do?
    expected_concepts:
      - checking whether the segment split was planned or found after the fact
      - risk of false findings when slicing many ways
      - plausible reasons such as change aversion among existing users
      - confirming with a follow-up test targeted at segments
      - options such as targeting the change or adjusting it for existing users
    rubric:
      excellent: Treats post-hoc segment findings cautiously, considers plausible causes, proposes a confirmatory test, and lays out targeted shipping options with their trade-offs.
      good: Recognises the segment effect and proposes a sensible next step.
      weak: Ships to new users immediately based on an unplanned slice, or ignores the segment results.
    followups:
      - How would you design the follow-up test?
      - What are the costs of running different experiences for different users?
    common_errors:
      - Treating a segment found after slicing many ways as a confirmed result.

  - external_key: technical.product_manager.wins_dont_add_up
    competency_key: statistics_experimentation
    topic: Experiment wins that don't add up
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your company runs hundreds of experiments a year, and teams keep reporting wins that don't seem to add
      up in the overall numbers. What might be going on, and how would you improve the experimentation
      practice?
    expected_concepts:
      - false positives from many tests and many metrics
      - stopping early and selective reporting
      - novelty effects and overlapping tests
      - pre-registration, review and replication of big wins
      - long-term holdouts to measure cumulative impact
    rubric:
      excellent: Identifies several mechanisms that inflate wins, proposes concrete practice changes such as pre-registration, review, replication and holdouts, and explains how to get teams to adopt them.
      good: Names false positives and early stopping and suggests fixes.
      weak: Assumes the wins are real and the overall numbers are wrong.
    followups:
      - How would you get teams to accept stricter rules?
      - How would you estimate the real cumulative effect?
    common_errors:
      - Adding up individual test lifts and expecting the total to show in company metrics.

  - external_key: technical.product_manager.major_product_line_launch
    competency_key: project_management
    topic: Running a major cross-functional launch
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're responsible for launching a major new product line in three months, with engineering,
      marketing, sales, support and legal all involved. How would you plan and run the launch?
    expected_concepts:
      - clear launch goals and success metrics
      - a single plan with owners, milestones and dependencies
      - launch tiers and readiness reviews
      - risk management and contingency for slips
      - communication rhythm and decision rights
      - post-launch monitoring and review
    rubric:
      excellent: Lays out a structured plan with goals, owners, dependencies, readiness gates, risk and contingency planning, clear decision rights, and post-launch measurement.
      good: Describes a reasonable cross-functional plan with owners and milestones.
      weak: Focuses only on the engineering build or only on marketing.
    followups:
      - What would you do if legal review threatened the date?
      - How would you decide whether to slip the date or cut scope?
    common_errors:
      - Treating the launch date as fixed without agreeing what can be cut if things slip.

  - external_key: technical.product_manager.did_small_wins_add_up
    competency_key: statistics_experimentation
    topic: Measuring cumulative long-term impact
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Leadership asks whether all the small experiments your team shipped this year actually added up to
      anything. Each test only ran for a few weeks. How would you answer that now, and how would you set
      things up to answer it better next year?
    expected_concepts:
      - limits of summing short-term test results
      - looking at longer-term cohort trends and retention
      - long-running holdout groups that don't receive changes
      - costs and fairness of holding back improvements from some users
      - being clear about what can and cannot be concluded
    rubric:
      excellent: Gives a careful answer using available long-term data with clear caveats, and designs a holdout approach for next year with its costs and trade-offs.
      good: Recognises the limits of summing results and proposes a holdout.
      weak: Adds up the individual lifts and presents the total as the answer.
    followups:
      - How large should a long-term holdout be?
      - What changes would you exclude from the holdout?
    common_errors:
      - Keeping a holdout so long that those users get a noticeably worse product.

  - external_key: technical.product_manager.launch_despite_serious_bug
    competency_key: stakeholder_management
    topic: Go or no-go under external pressure
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The night before a big launch, testing finds a serious bug affecting a small group of customers.
      Leadership wants to launch anyway because of a press commitment. How would you make the call?
    expected_concepts:
      - understanding severity, who is affected and possible harm such as data loss
      - options such as launching without the affected path or excluding those customers
      - workarounds and fix timeline from engineering
      - presenting a clear recommendation with risks to leadership
      - communication plan for affected customers
    rubric:
      excellent: Quantifies severity and harm, explores options that protect affected customers while meeting the commitment where possible, and gives leadership a clear recommendation with risks and a communication plan.
      good: Assesses the bug and presents options to leadership.
      weak: Defers entirely to leadership or blocks the launch without exploring options.
    followups:
      - What would make the bug an absolute blocker for you?
      - How would you handle it if leadership overruled your recommendation?
    common_errors:
      - Framing the decision as all or nothing instead of looking for partial launch options.
