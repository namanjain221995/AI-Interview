# Frontend core (2/4): browser rendering, the event loop in the browser, the DOM and CSS layout.
# Round types follow difficulty: easy -> screening/combined, medium -> all three,
# hard -> deep technical/combined.
version: 1
defaults:
  role_tags: [frontend]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.frontend_core.script_async_defer
    competency_key: frontend_react
    topic: Script loading with async, defer and modules
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do plain script tags, async scripts, deferred scripts and module scripts differ in how they load and
      run, and how do you decide which to use on a page?
    expected_concepts:
      - classic scripts block HTML parsing while they download and run
      - async runs as soon as it downloads, in no guaranteed order
      - defer runs in order after parsing finishes
      - module scripts are deferred by default
      - independent third-party scripts suit async, app code suits defer or modules
    rubric:
      excellent: Explains parsing, download and execution timing for each option, including ordering guarantees, and maps them to concrete script types on a real page.
      good: Correctly distinguishes async and defer and knows blocking scripts delay rendering.
      weak: Thinks async and defer are the same, or places blocking scripts in the head without concern.
    followups:
      - Which would you use for an analytics snippet, and why?
      - What happens if a deferred script depends on an async one?
    common_errors:
      - Using async for scripts that depend on each other's execution order.

  - external_key: technical.frontend_core.event_delegation
    competency_key: javascript
    topic: Event bubbling, capturing and delegation
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Say you have a list with a thousand rows, each with a delete button. How would you attach the click
      handling, and how do bubbling and capturing come into play?
    expected_concepts:
      - events propagate in capture, target and bubble phases
      - one listener on a common ancestor (delegation)
      - event.target and closest to find the clicked row
      - stopPropagation and its side effects
      - delegation works for rows added later
    rubric:
      excellent: Explains the propagation phases, implements delegation with target and closest, notes it handles dynamic rows, and warns about overusing stopPropagation.
      good: Proposes delegation and knows events bubble.
      weak: Attaches a thousand listeners without considering alternatives, or cannot explain bubbling.
    followups:
      - Which events don't bubble, and how would you handle those?
      - Why can stopPropagation break unrelated features such as analytics or dropdowns?
    common_errors:
      - Checking event.target directly when the click lands on a nested icon inside the button.

  - external_key: technical.frontend_core.box_model
    competency_key: frontend_react
    topic: The CSS box model and box-sizing
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Explain the CSS box model in your own words. Why might a box set to one hundred percent width overflow
      its container, and how would you prevent it?
    expected_concepts:
      - content, padding, border and margin
      - content-box versus border-box sizing
      - padding and border added on top of width by default
      - vertical margin collapsing
      - global border-box reset as a common convention
    rubric:
      excellent: Describes each layer, explains the overflow with content-box sizing, recommends border-box with a reason, and mentions margin collapsing.
      good: Knows the layers and that border-box fixes the overflow.
      weak: Cannot explain why padding changes the box's rendered size.
    followups:
      - When do vertical margins collapse, and how do you stop it?
      - Where would you still want content-box sizing?
    common_errors:
      - Fixing overflow with overflow hidden instead of understanding the sizing.

  - external_key: technical.frontend_core.flex_or_grid
    competency_key: frontend_react
    topic: Choosing Flexbox or Grid
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide between Flexbox and CSS Grid for a layout? Give me an example from something you've
      built where you picked one over the other.
    expected_concepts:
      - Flexbox for one-dimensional distribution along a row or column
      - Grid for two-dimensional layouts with aligned rows and columns
      - content-driven versus layout-driven sizing
      - gap, alignment and wrapping behaviour
      - combining both, for example Grid for the page and Flexbox in components
    rubric:
      excellent: Gives a clear one-dimensional versus two-dimensional rule with a real example, discusses content versus layout sizing and combines both sensibly.
      good: States the dimensional difference and gives a plausible example.
      weak: Uses one for everything with no reason, or still relies on floats for layout.
    followups:
      - How would you build a card grid that fills the row with as many cards as fit?
      - Why do flex items sometimes refuse to shrink below their content width?
    common_errors:
      - Fighting Flexbox to align items across rows when Grid would do it directly.

  - external_key: technical.frontend_core.style_not_applied
    competency_key: frontend_react
    topic: Cascade, specificity and debugging styles
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've added a CSS rule to change a button's colour, but the button still looks the same in the
      browser. How would you figure out why?
    expected_concepts:
      - inspecting the element and the computed styles in DevTools
      - specificity and source order
      - selector not matching or a typo
      - stylesheet not loaded or overridden by inline or important styles
      - cascade layers and inheritance
    rubric:
      excellent: Uses DevTools to see which rule wins and why, reasons about specificity, order and layers, and fixes it without escalating specificity or adding important.
      good: Inspects the element and identifies specificity as a likely cause.
      weak: Adds important or more selectors until it works.
    followups:
      - How would you calculate which of two selectors wins?
      - How do cascade layers change specificity battles in a large codebase?
    common_errors:
      - Escalating to important instead of finding the conflicting rule.

  - external_key: technical.frontend_core.desktop_to_mobile
    competency_key: frontend_react
    topic: Making a desktop layout responsive
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You're handed a page that was built only for desktop screens and asked to make it work well on phones.
      How would you approach it?
    expected_concepts:
      - the viewport meta tag
      - mobile-first styles with min-width media queries
      - relative units and fluid sizing such as clamp
      - flexible layouts with wrapping, Grid or Flexbox
      - touch target size and testing on real devices
    rubric:
      excellent: Plans a structured approach (viewport, mobile-first breakpoints based on content, fluid units, flexible layout), considers touch and performance, and tests on real devices.
      good: Uses media queries and relative units sensibly.
      weak: Hides content on small screens or relies on device-specific pixel widths.
    followups:
      - How do you choose breakpoints?
      - What changes besides layout when users are on touch devices?
    common_errors:
      - Breakpoints tied to specific device models instead of the content.

  - external_key: technical.frontend_core.browser_storage_choice
    competency_key: javascript
    topic: localStorage, sessionStorage, IndexedDB and cookies
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What kinds of client-side storage do browsers offer, and how do you decide which one to use for things
      like user preferences, a draft form or a large offline dataset?
    expected_concepts:
      - localStorage is synchronous, string-only and small
      - sessionStorage is scoped to one tab
      - IndexedDB is asynchronous and suits large structured data
      - cookies are sent with every request
      - anything stored is readable by scripts on the page, so no secrets
    rubric:
      excellent: Matches each storage type to the examples with reasons covering size, sync versus async, scope and lifetime, and raises security and eviction concerns.
      good: Knows the main options and picks reasonable ones for the examples.
      weak: Puts everything in localStorage including sensitive data.
    followups:
      - Why can heavy localStorage use slow the page down?
      - What happens to stored data when the browser is low on disk space?
    common_errors:
      - Storing large datasets in localStorage and blocking the main thread.

  - external_key: technical.frontend_core.text_overflow_narrow
    competency_key: frontend_react
    topic: Overflowing content on narrow screens
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A card layout looks fine on desktop, but on a small phone some cards push the page sideways because of
      long URLs or product names. How would you track down and fix the overflow?
    expected_concepts:
      - finding the overflowing element with DevTools
      - long unbroken strings and overflow-wrap or word-break
      - flex and grid items default to a minimum content size (min-width auto)
      - min-width zero or minmax in grid tracks
      - truncation with ellipsis where appropriate
    rubric:
      excellent: Finds the culprit element methodically, explains the min-content sizing default of flex or grid items, and applies wrapping or truncation deliberately instead of hiding overflow.
      good: Uses overflow-wrap or truncation and finds the element.
      weak: Sets overflow hidden on the body and moves on.
    followups:
      - Why does adding min-width zero to a flex child fix this?
      - When is truncating text a poor choice?
    common_errors:
      - Hiding horizontal overflow on the body and masking the real problem.

  # ---------------------------------------------------------------- medium
  - external_key: technical.frontend_core.critical_rendering_path
    competency_key: frontend_react
    topic: The critical rendering path
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Walk me through what the browser does from receiving the first bytes of HTML until pixels appear on
      screen, and point out which resources can hold up that first paint.
    expected_concepts:
      - parsing HTML into the DOM and CSS into the CSSOM
      - CSS is render-blocking and blocking scripts pause the parser
      - style, layout, paint and compositing
      - the preload scanner discovering resources early
      - inlining critical CSS and deferring the rest
    rubric:
      excellent: Describes the pipeline in order, identifies render-blocking CSS and parser-blocking scripts, explains the preload scanner and gives concrete techniques to shorten the path.
      good: Covers DOM, CSSOM, layout and paint and knows CSS blocks rendering.
      weak: Describes it vaguely as downloading then showing the page.
    followups:
      - Why is a stylesheet loaded with JavaScript invisible to the preload scanner?
      - What would you inline, and what are the costs of inlining?
    common_errors:
      - Assuming scripts at the end of the body never delay first paint.

  - external_key: technical.frontend_core.layout_thrashing
    competency_key: javascript
    topic: Forced synchronous layout
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An accordion animation stutters badly, and the code loops over many elements, reading each one's height
      and then setting a new style on it. What's going wrong, and how would you fix it?
    expected_concepts:
      - reading layout after a style write forces synchronous layout
      - interleaved reads and writes cause repeated layout (thrashing)
      - batching all reads before all writes
      - requestAnimationFrame for writes
      - seeing forced reflows in the Performance panel
    rubric:
      excellent: Explains how read-write interleaving forces layout on every iteration, batches reads then writes, confirms it in the profiler and considers transform-based animation instead.
      good: Identifies layout thrashing and batches reads and writes.
      weak: Blames the number of elements or suggests a faster machine.
    followups:
      - Which properties or methods trigger layout when you read them?
      - How would you animate height changes more cheaply?
    common_errors:
      - Animating height or top every frame instead of transform.

  - external_key: technical.frontend_core.compositor_animations
    competency_key: frontend_react
    topic: Cheap and expensive CSS animations
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Why do some CSS animations stay smooth even when the page is busy while others jank? How do you decide
      which properties to animate, and when would you use will-change?
    expected_concepts:
      - layout, paint and composite costs differ by property
      - transform and opacity can run on the compositor
      - animating width, top or margin triggers layout
      - will-change promotes layers but costs memory
      - verifying with the rendering and layers tools in DevTools
    rubric:
      excellent: Ties each property to the pipeline stage it triggers, explains compositor-driven animation, uses will-change sparingly with its memory cost, and verifies in DevTools.
      good: Knows transform and opacity are cheaper to animate.
      weak: Adds will-change everywhere or cannot explain why some properties are expensive.
    followups:
      - What can go wrong if hundreds of elements get their own layers?
      - How would you animate an element's size without animating width?
    common_errors:
      - Applying will-change permanently to many elements.

  - external_key: technical.frontend_core.raf_vs_timers
    competency_key: javascript
    topic: requestAnimationFrame, timers and idle callbacks
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      If you need to update something visual on every frame, such as a progress bar or a drag position, why
      would you use requestAnimationFrame instead of a timer? And where does requestIdleCallback fit?
    expected_concepts:
      - requestAnimationFrame runs before the next paint, in sync with the display
      - timers drift and can run more or less often than frames
      - rAF pauses in background tabs
      - idle callbacks for low-priority work with a deadline
      - coalescing many input events into one update per frame
    rubric:
      excellent: Explains frame alignment, background throttling and coalescing updates per frame, and places idle callbacks correctly for non-urgent work with their caveats.
      good: Knows rAF aligns with repaint and is better for animation.
      weak: Thinks a sixteen millisecond timer is equivalent to rAF.
    followups:
      - How would you handle a pointermove that fires faster than the display refreshes?
      - Why shouldn't you change the DOM inside an idle callback?
    common_errors:
      - Updating the DOM on every pointer event instead of once per frame.

  - external_key: technical.frontend_core.z_index_stacking
    competency_key: frontend_react
    topic: Stacking contexts and z-index
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A dropdown menu shows up behind a neighbouring card even though the dropdown has a huge z-index. How
      would you explain what's going on, and how would you fix it properly?
    expected_concepts:
      - stacking contexts limit where z-index applies
      - properties that create stacking contexts such as transform, opacity and position with z-index
      - z-index compares only within the same context
      - rendering overlays in a top-level layer or portal
      - a defined z-index scale for the app
    rubric:
      excellent: Explains stacking contexts and what creates them, finds the ancestor that traps the dropdown, and fixes it structurally with a portal, top layer or a defined scale.
      good: Identifies stacking contexts as the cause and moves the menu out of the trapping ancestor.
      weak: Keeps increasing z-index values.
    followups:
      - How would you find which ancestor created the stacking context?
      - What does the native popover attribute or dialog top layer change here?
    common_errors:
      - Escalating z-index numbers across the codebase.

  - external_key: technical.frontend_core.browser_observers
    competency_key: javascript
    topic: IntersectionObserver, ResizeObserver and MutationObserver
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Product wants to record an impression only when at least half of a promotion card has been on screen
      for one second. How would you build that, and why would you avoid doing it with scroll events?
    expected_concepts:
      - IntersectionObserver with a threshold of one half
      - starting and cancelling a timer as visibility changes
      - scroll handlers run often and force layout reads
      - pausing when the tab is hidden via the Page Visibility API
      - batching impression events and sending them with sendBeacon
      - ResizeObserver and MutationObserver for other kinds of change
    rubric:
      excellent: Uses IntersectionObserver thresholds with a visibility timer, handles hidden tabs and removed elements, batches reporting reliably, and explains why scroll-based geometry checks are costly.
      good: Uses IntersectionObserver with a threshold and some timing logic.
      weak: Calculates element positions on every scroll event.
    followups:
      - What happens to your timers if the user switches tabs?
      - How would you make sure the events are sent when the page is closed?
    common_errors:
      - Forgetting to unobserve elements that are removed from the page.

  - external_key: technical.frontend_core.modern_selectors_specificity
    competency_key: frontend_react
    topic: Newer CSS selectors, nesting and specificity
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Newer CSS features such as the has selector, the is and where pseudo-classes and native nesting change
      what you can do without JavaScript. How have you used them, and what do they do to specificity?
    expected_concepts:
      - the has selector styles a parent based on its descendants or state
      - is takes the specificity of its most specific argument
      - where always has zero specificity, useful for overridable defaults
      - native nesting and how nested selectors resolve
      - checking browser support and the cost of very broad has selectors
    rubric:
      excellent: Gives practical examples that replaced JavaScript or extra classes, explains the specificity behaviour of is versus where precisely, and considers support and selector performance.
      good: Knows what the selectors do and that where has zero specificity.
      weak: Has not used them and cannot reason about their specificity.
    followups:
      - Where would you use where in a component library's base styles?
      - How would you style a form group that contains an invalid input without JavaScript?
    common_errors:
      - Wrapping selectors in is and unintentionally raising their specificity.

  - external_key: technical.frontend_core.css_scaling_strategy
    competency_key: frontend_react
    topic: Organising CSS in a large application
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      In a large app, styles from one feature keep leaking into others and nobody dares to delete old CSS.
      How would you restructure the styling approach?
    expected_concepts:
      - scoped styles such as CSS modules or naming conventions
      - cascade layers to order resets, libraries and components
      - utility-first CSS and its trade-offs
      - runtime cost of some CSS-in-JS approaches
      - design tokens as custom properties
      - finding and removing dead CSS safely
    rubric:
      excellent: Diagnoses the global-cascade problem, compares scoping options with real trade-offs including runtime cost, proposes an incremental migration and a way to detect unused styles.
      good: Recommends a scoping approach with reasons.
      weak: Suggests rewriting everything in the newest framework without a migration path.
    followups:
      - How would you safely find and delete unused CSS?
      - What are the performance costs of runtime CSS-in-JS?
    common_errors:
      - Rewriting all styles at once instead of migrating feature by feature.

  - external_key: technical.frontend_core.web_components
    competency_key: javascript
    topic: Custom elements and Shadow DOM
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When would you build a widget as a web component with Shadow DOM rather than as a framework component,
      and what trade-offs have you run into or would you expect?
    expected_concepts:
      - framework-agnostic reuse across apps
      - style encapsulation and theming through custom properties and parts
      - lifecycle callbacks of custom elements
      - form participation and labelling across the shadow boundary
      - server rendering and framework interop limits
    rubric:
      excellent: Gives a fitting use case such as sharing across frameworks, explains encapsulation and theming, and raises real costs around forms, accessibility references and server rendering.
      good: Knows the encapsulation benefit and one or two drawbacks.
      weak: Cannot describe what Shadow DOM isolates.
    followups:
      - How would a label outside the shadow root refer to an input inside it?
      - How would you let consumers theme the component?
    common_errors:
      - Assuming Shadow DOM isolates scripts or provides security.

  - external_key: technical.frontend_core.sticky_header
    competency_key: frontend_react
    topic: Positioning and sticky elements
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A table header set to position sticky scrolls away with the content instead of staying put. What
      could cause that, and how would you debug it?
    expected_concepts:
      - sticky needs an offset such as top
      - an ancestor with overflow becomes the scroll container
      - the sticky element is limited to its parent's box
      - table and display quirks
      - inspecting scroll containers in DevTools
    rubric:
      excellent: Explains sticky positioning relative to the nearest scrolling ancestor and its containing block, lists the common causes and debugs systematically up the ancestor chain.
      good: Names a missing offset or an overflow ancestor as causes.
      weak: Switches to position fixed with JavaScript scroll handlers.
    followups:
      - How does sticky differ from fixed positioning?
      - How would you keep a table header and first column both sticky?
    common_errors:
      - Overlooking an overflow setting on a distant ancestor.

  - external_key: technical.frontend_core.passive_listeners
    competency_key: javascript
    topic: Scroll and touch listeners on mobile
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Scrolling on mobile feels sticky on one page, and you find a few touch and wheel listeners attached to
      the document. How do those listeners affect scrolling, and what would you change?
    expected_concepts:
      - the browser waits for non-passive listeners in case they cancel scrolling
      - passive listeners let scrolling start immediately
      - heavy work in scroll handlers
      - CSS alternatives such as touch-action and overscroll-behavior
      - scroll-driven effects with observers or CSS instead of handlers
    rubric:
      excellent: Explains why non-passive listeners delay scrolling, marks them passive where possible, moves work out of handlers and uses CSS properties where they fit.
      good: Knows about passive listeners and why they help.
      weak: Debounces the scroll handler without understanding the blocking.
    followups:
      - What if a handler genuinely needs to prevent scrolling?
      - How would you build a parallax effect without a scroll handler?
    common_errors:
      - Calling preventDefault in listeners on the document for convenience.

  # ------------------------------------------------------------------ hard
  - external_key: technical.frontend_core.scroll_jank_profile
    competency_key: debugging
    topic: Profiling scroll jank in the Performance panel
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A long feed scrolls at around twenty frames per second on mid-range phones. Walk me through how you'd
      profile it and the kinds of root causes you'd expect to find.
    expected_concepts:
      - recording with CPU throttling or on a real device
      - reading the main thread flame chart and frame timings
      - distinguishing scripting, style recalculation, layout, paint and compositing
      - large paint areas, expensive effects such as shadows and filters
      - DOM size and style invalidation scope
      - verifying improvements with repeat measurements
    rubric:
      excellent: Profiles realistically, reads the trace to separate script, style, layout, paint and composite costs, maps each to concrete causes and fixes, and measures again.
      good: Uses the Performance panel and identifies script or layout as hot spots.
      weak: Guesses at fixes without profiling.
    followups:
      - How do you tell whether paint or layout is the bottleneck?
      - Why might a big box-shadow on many items be expensive?
    common_errors:
      - Profiling only on a fast laptop without throttling.

  - external_key: technical.frontend_core.mobile_viewport_quirks
    competency_key: frontend_react
    topic: Mobile viewport units, safe areas and the on-screen keyboard
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      On phones, your full-height checkout layout has its pay button hidden behind the browser toolbar, cut off
      by the notch on some devices, and covered by the on-screen keyboard when typing. How would you fix these
      layout problems?
    expected_concepts:
      - 100vh differs from the visible area as browser toolbars show and hide
      - dynamic, small and large viewport units such as dvh and svh
      - safe-area insets with viewport-fit cover and env values
      - the on-screen keyboard and the visualViewport API or interactive-widget setting
      - testing on real iOS and Android devices
    rubric:
      excellent: Explains why each problem happens, chooses appropriate viewport units, handles safe areas and the keyboard with the right APIs or meta settings, and verifies on real devices of both platforms.
      good: Fixes the height with newer viewport units and handles safe areas.
      weak: Hard-codes pixel offsets for specific phone models.
    followups:
      - When would you choose svh over dvh?
      - How would you keep a focused input visible above the keyboard?
    common_errors:
      - Using 100vh for full-height mobile layouts.

  - external_key: technical.frontend_core.browser_threads
    competency_key: javascript
    topic: Main thread, compositor and browser processes
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Explain how a modern browser splits work between the main thread, the compositor and other processes,
      and why that matters for the decisions you make as a frontend engineer.
    expected_concepts:
      - main thread runs JavaScript, style, layout and paint recording
      - compositor thread handles scrolling and layer composition
      - raster and GPU work in separate threads or processes
      - site isolation puts origins in separate processes
      - why compositor-only animations and scrolling survive main-thread work
    rubric:
      excellent: Describes the architecture accurately, explains which work can bypass a busy main thread and connects it to concrete choices around animation, scroll handlers and long tasks.
      good: Knows the main thread is shared and the compositor handles some animation and scrolling.
      weak: Believes all browser work happens in one thread with no practical implications.
    followups:
      - Why can a non-passive wheel listener pull scrolling back onto the main thread?
      - What does site isolation mean for cross-origin iframes?
    common_errors:
      - Assuming Web Workers can touch the DOM.

  - external_key: technical.frontend_core.font_loading
    competency_key: frontend_react
    topic: Web font loading and its side effects
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you load custom web fonts so that text appears quickly and the page doesn't jump when the font
      swaps in? Talk me through the trade-offs.
    expected_concepts:
      - invisible text versus fallback text while loading
      - font-display values and their effects
      - preloading critical fonts and self-hosting
      - metric overrides such as size-adjust to match the fallback
      - subsetting and variable fonts to cut bytes
    rubric:
      excellent: Explains the invisible versus unstyled text trade-off, chooses font-display deliberately, preloads only critical fonts and uses metric overrides and subsetting to avoid shifts.
      good: Knows font-display swap and preloading.
      weak: Loads many weights from a third-party service without considering the effect.
    followups:
      - Why can preloading too many fonts make things worse?
      - How would you measure the layout shift caused by a font swap?
    common_errors:
      - Preloading every weight and style of a font family.

  - external_key: technical.frontend_core.theming_custom_properties
    competency_key: frontend_react
    topic: Theming and dark mode with CSS custom properties
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you implement light, dark and high-contrast themes for a large server-rendered app using
      CSS custom properties, without the page flashing the wrong theme on load?
    expected_concepts:
      - semantic design tokens as custom properties rather than raw colours
      - prefers-color-scheme plus a stored user override
      - applying the theme before first paint, for example with a tiny inline script or a cookie read on the server
      - the color-scheme property for native controls and scrollbars
      - forced colours mode and contrast checks for each theme
    rubric:
      excellent: Designs a semantic token layer, resolves the theme before first paint, respects system preferences and overrides, and covers native controls, forced colours and contrast for every theme.
      good: Uses custom properties with a data attribute or class and knows about the flash problem.
      weak: Duplicates whole stylesheets per theme or toggles colours with JavaScript after the page renders.
    followups:
      - Where would you store the user's choice so the server can render the right theme?
      - How does Windows forced colours mode interact with your custom colours?
    common_errors:
      - Naming tokens after colours, such as blue-500, instead of their purpose.

  - external_key: technical.frontend_core.spa_navigation_restore
    competency_key: javascript
    topic: History, scroll restoration and the back-forward cache
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      In your single-page app, pressing back from a detail page drops users at the top of a long list, while
      a plain server-rendered page returns them to exactly where they were. Why the difference, and how
      would you fix it?
    expected_concepts:
      - the History API and history.scrollRestoration
      - restoring scroll only after the list data has rendered
      - caching list data so back navigation is instant
      - the back-forward cache and what makes pages ineligible
      - focus and announcements after navigation
    rubric:
      excellent: Explains why client routing loses native restoration, restores scroll after data is available, caches data for back navigation, explains back-forward cache eligibility and handles focus.
      good: Saves and restores scroll position per history entry.
      weak: Stores everything in memory and accepts losing it on navigation.
    followups:
      - What prevents a page from entering the back-forward cache?
      - Where would you store the scroll position for each history entry?
    common_errors:
      - Restoring scroll before the list has rendered.
