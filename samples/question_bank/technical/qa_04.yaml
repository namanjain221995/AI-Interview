# Curated questions: QA / quality engineering (part 4 of 4).
# Defect handling, localisation and mobile checks, release readiness, legacy code, retries,
# concurrency, data pipelines, test effectiveness and quality engineering in continuous delivery.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [qa]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.qa.works_on_my_machine
    competency_key: debugging
    topic: Bugs that only reproduce in one environment
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You raise a bug, and the developer closes it saying it works on their machine. How would you move it
      forward?
    expected_concepts:
      - comparing environment, build, configuration and data
      - providing precise evidence such as logs and request ids
      - reproducing together or screen sharing
      - checking feature flags, browser and account state
      - keeping the conversation focused on the problem
    rubric:
      excellent: Gathers concrete evidence, lists environment differences to compare (build, config, data, flags, browser), proposes reproducing together, and keeps it collaborative until the cause is found.
      good: Provides more evidence and asks the developer to check in the test environment.
      weak: Reopens the bug repeatedly without new information, or drops it.
    followups:
      - What differences between environments most often explain this?
      - How would you prevent this back-and-forth in future reports?
    common_errors:
      - Arguing about who is right instead of finding the environmental difference.

  - external_key: technical.qa.new_language_launch
    competency_key: test_automation
    topic: Testing a new language release
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Your web app is about to launch in German and Japanese for the first time. What would you test
      specifically for that launch?
    expected_concepts:
      - text expansion and truncation in layouts
      - character encoding and fonts
      - date, number, currency and address formats
      - untranslated or hard-coded strings
      - sorting, search and input of non-Latin text
      - translations reviewed in context
    rubric:
      excellent: Covers layout expansion, encoding, locale formats, hard-coded strings, input and search with non-Latin scripts, and in-context translation review, and suggests pseudo-localisation to catch issues early.
      good: Checks translations, layout and date or currency formats.
      weak: Only checks that the words appear translated.
    followups:
      - How could you catch hard-coded strings before translations even exist?
      - What would you automate here and what would you leave to reviewers?
    common_errors:
      - Ignoring that emails, PDFs and error messages also need localising.

  - external_key: technical.qa.performance_test_kinds
    competency_key: test_automation
    topic: Kinds of performance tests
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me about the different kinds of performance tests you've run or seen, such as load, stress or soak
      tests. What question was each one answering?
    expected_concepts:
      - load test for expected traffic
      - stress test to find the breaking point
      - spike test for sudden bursts
      - soak test for leaks and degradation over time
      - choosing the type based on the risk being checked
    rubric:
      excellent: Explains each type by the question it answers, gives real or realistic examples, and links the choice of test to a specific risk such as memory leaks or flash sales.
      good: Correctly distinguishes load, stress and soak tests.
      weak: Uses the terms interchangeably.
    followups:
      - What kind of problem would a soak test reveal that a one-hour test wouldn't?
      - Which tool did you use, and what was difficult about it?
    common_errors:
      - Running tests for a few minutes and concluding there are no memory or connection leaks.

  - external_key: technical.qa.manual_pack_one_day
    competency_key: test_automation
    topic: Prioritising manual test cases under time pressure
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      There are four hundred manual regression cases and only one day before a release. How do you decide
      which ones to run?
    expected_concepts:
      - what changed in this release
      - critical business flows first
      - areas with a history of defects
      - cases already covered by automation skipped
      - communicating what was not covered
    rubric:
      excellent: Prioritises by change impact, business criticality and defect history, skips what automation already covers, splits work across people if possible, and tells stakeholders what remains untested.
      good: Focuses on critical flows and changed areas.
      weak: Runs cases in order until the day ends.
    followups:
      - How would you record what was skipped so it can be picked up later?
      - What would make you ask for the release to be delayed?
    common_errors:
      - Not telling anyone which areas went untested.

  - external_key: technical.qa.mobile_real_world_conditions
    competency_key: mobile_development
    topic: Mobile app real-world conditions
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You're testing a mobile banking app's money transfer screen. Beyond the normal flow, what real-world
      conditions would you test?
    expected_concepts:
      - poor or switching networks and offline mode
      - interruptions such as calls and notifications
      - app backgrounded and restored, session expiry
      - double taps and repeated submissions
      - rotation, low battery and low storage
      - different OS versions and screen sizes
    rubric:
      excellent: Covers network loss mid-transfer, interruptions and backgrounding, session expiry, duplicate submissions and device conditions, and explains what the correct behaviour should be in each case.
      good: Tests network issues and interruptions.
      weak: Only tests the happy path on a good Wi-Fi connection.
    followups:
      - What should happen if the network drops right after the user taps send?
      - How would you simulate a slow or flaky network reliably?
    common_errors:
      - Not checking for duplicate transfers when the user retries after a timeout.

  - external_key: technical.qa.weekly_flaky_test
    competency_key: test_automation
    topic: First response to a flaky test
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A test in your suite fails about once a week and passes when you re-run it. What do you do about it?
    expected_concepts:
      - not ignoring or blindly retrying
      - collecting failure logs and artefacts across occurrences
      - looking for timing, data or ordering causes
      - checking whether the product itself is intermittent
      - fixing or quarantining with a ticket
    rubric:
      excellent: Treats it as a real signal, gathers evidence from multiple failures, investigates timing, data and ordering causes, considers a genuine product bug, and fixes it or quarantines with an owner.
      good: Investigates the logs and tries to find the cause.
      weak: Re-runs it whenever it fails or deletes it immediately.
    followups:
      - How would you know whether the bug is in the test or in the product?
      - What evidence would you want captured automatically on the next failure?
    common_errors:
      - Assuming flakiness is always the test's fault.

  - external_key: technical.qa.meaningful_assertions
    competency_key: testing
    topic: Writing meaningful assertions
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What makes an assertion in an automated test good or bad? Give me an example of each from tests you've
      seen.
    expected_concepts:
      - asserts the behaviour the test is named for
      - specific enough to catch a wrong result
      - not tied to irrelevant details
      - clear failure message
      - avoiding tests with no or trivial assertions
    rubric:
      excellent: Explains that assertions should verify the intended behaviour precisely without coupling to incidental details, gives contrasting real examples, and mentions readable failure messages.
      good: Distinguishes specific assertions from weak ones with an example.
      weak: Thinks any assertion that passes is good enough.
    followups:
      - When is asserting on an entire response body a bad idea?
      - How would you test that a test fails when it should?
    common_errors:
      - Asserting only that an element exists rather than what it shows.

  # ---------------------------------------------------------------- medium
  - external_key: technical.qa.go_no_go_call
    competency_key: test_automation
    topic: Release readiness with open bugs
    difficulty: medium
    kind: scenario
    text: >-
      It's the day of a planned release. Testing is done, but there are six open bugs, two of them medium
      severity. How would you prepare the information for a go or no-go decision?
    expected_concepts:
      - impact and likelihood of each open bug
      - workarounds and affected users
      - coverage achieved and areas not tested
      - risk of delaying versus releasing
      - mitigations such as flags, monitoring and rollback
      - the decision belongs to accountable stakeholders
    rubric:
      excellent: Summarises each bug's user impact and workaround, states coverage and untested areas, lays out mitigations and the cost of delay, and presents a clear recommendation while leaving the decision to the accountable owner.
      good: Summarises the bugs and gives a recommendation.
      weak: Blocks the release by default or approves it without analysis.
    followups:
      - What would you need to see to recommend releasing with a known bug?
      - How do you track bugs that ship as known issues?
    common_errors:
      - Presenting a bug count without explaining what users would actually experience.

  - external_key: technical.qa.legacy_characterisation
    competency_key: testing
    topic: Testing legacy code with no tests
    difficulty: medium
    kind: scenario
    text: >-
      A team needs to change a ten-year-old pricing module that has no automated tests and no documentation.
      How would you help them change it safely?
    expected_concepts:
      - characterisation tests that capture current behaviour
      - using production inputs and outputs as examples
      - testing at the module boundary first
      - golden master or approval testing
      - adding tests around each change as you go
    rubric:
      excellent: Proposes characterisation or approval tests built from real inputs at the module boundary, distinguishes current behaviour from correct behaviour, and grows coverage alongside each change.
      good: Suggests writing tests for current behaviour before changing it.
      weak: Proposes manual testing after the change or a full rewrite first.
    followups:
      - What if the current behaviour turns out to be a bug that customers depend on?
      - Where would you get realistic input data for these tests?
    common_errors:
      - Writing tests for what the code should do and having them fail on day one.

  - external_key: technical.qa.early_qa_involvement
    competency_key: test_automation
    topic: Involving QA early in design
    difficulty: medium
    kind: technical
    text: >-
      People talk about shifting testing left. In practical terms, what do you do during design and planning
      to prevent defects, rather than finding them later?
    expected_concepts:
      - reviewing requirements and designs for testability
      - example mapping or three amigos sessions
      - identifying risks and edge cases before coding
      - agreeing test approach and test hooks with developers
      - pairing with developers on tests
    rubric:
      excellent: Describes specific activities such as example mapping, design reviews for testability, early risk identification and agreeing test hooks, with an example where this prevented a defect.
      good: Joins refinement and asks questions about edge cases.
      weak: Defines shift left as starting testing a little earlier in the same way.
    followups:
      - Give me an example of a defect you prevented this way.
      - How do you get invited to design discussions if the team doesn't include you?
    common_errors:
      - Treating shift left as testers doing all the testing earlier rather than the team building quality in.

  - external_key: technical.qa.api_negative_testing
    competency_key: api_design
    topic: Negative and robustness testing for APIs
    difficulty: medium
    kind: technical
    text: >-
      Beyond the happy path, which negative and robustness cases do you focus on when testing a REST API, and
      why those?
    expected_concepts:
      - malformed and missing fields, wrong types
      - boundary and very large payloads
      - unsupported methods and content types
      - concurrent updates and conflicts
      - pagination edges and large result sets
      - retries and idempotency keys
    rubric:
      excellent: Covers malformed and boundary input, oversized payloads, wrong methods and content types, concurrency conflicts, pagination edges and retry behaviour, and explains which defects each class tends to reveal.
      good: Lists several negative input cases and expected error responses.
      weak: Only checks a missing required field.
    followups:
      - How would you test two clients updating the same record at once?
      - What should a good error response contain?
    common_errors:
      - Accepting 500 errors as a valid response to bad input.

  - external_key: technical.qa.staging_prod_config_drift
    competency_key: debugging
    topic: Passes in staging, fails in production
    difficulty: medium
    kind: scenario
    text: >-
      A feature passed every test in staging but broke as soon as it reached production. On investigation,
      the environments turn out to be configured differently. How would you prevent this happening again?
    expected_concepts:
      - environments defined as code from the same templates
      - configuration diffing and drift detection
      - production-like settings for integrations, limits and flags
      - post-deploy smoke tests in production
      - explicit list of known environment differences
    rubric:
      excellent: Proposes defining environments from shared code, automated drift detection, keeping known differences explicit, and post-deploy verification in production to catch what staging can't.
      good: Suggests aligning configurations and adding a production smoke test.
      weak: Only fixes the one setting that differed.
    followups:
      - Which differences between staging and production are acceptable?
      - How would you find drift before it causes an incident?
    common_errors:
      - Assuming staging can ever be identical to production and skipping production checks.

  - external_key: technical.qa.automation_payoff
    competency_key: test_automation
    topic: Judging the payoff of automation
    difficulty: medium
    kind: technical
    text: >-
      A product manager asks whether the time spent automating tests is paying off. How would you work out
      the answer and present it?
    expected_concepts:
      - time saved per regression cycle
      - faster feedback and release frequency
      - defects caught by automation before release
      - maintenance cost of the suite
      - confidence to refactor and ship
    rubric:
      excellent: Combines build and maintenance cost with concrete benefits such as cycle time saved, defects caught pre-release and release frequency, uses real data, and is open about areas where automation hasn't paid off.
      good: Estimates time saved and bugs caught.
      weak: Claims automation always pays off without evidence.
    followups:
      - Which part of your suite would you say is not worth its cost?
      - How would you track defects caught by automation?
    common_errors:
      - Ignoring maintenance effort, which is often the biggest cost.

  - external_key: technical.qa.cross_service_bug_ownership
    competency_key: test_automation
    topic: Bugs that span two services
    difficulty: medium
    kind: scenario
    text: >-
      You find a bug where an order shows as paid in one service but unpaid in another. Each team says the
      problem is in the other team's service. How would you get it resolved?
    expected_concepts:
      - tracing the request across both services
      - correlation ids, logs and the exact payloads exchanged
      - checking the agreed contract between the services
      - narrowing down which side violates it
      - bringing both teams together with evidence
    rubric:
      excellent: Traces the flow with correlation ids and actual payloads, compares them against the agreed contract to pin down which side is wrong, and brings both teams together with evidence, adding a contract test afterwards.
      good: Collects logs from both services and escalates with evidence.
      weak: Assigns it to one team arbitrarily or leaves the teams to argue.
    followups:
      - What if there is no written contract between the two services?
      - What test would you add so this is caught earlier next time?
    common_errors:
      - Escalating without evidence of where the data diverged.

  - external_key: technical.qa.major_upgrade_testing
    competency_key: test_automation
    topic: Testing a major dependency upgrade
    difficulty: medium
    kind: scenario
    text: >-
      The team is upgrading the web framework the application is built on by a major version. How would you
      plan testing for that upgrade?
    expected_concepts:
      - reading release notes for breaking changes
      - running the full automated suite as a baseline
      - comparing behaviour before and after
      - performance and memory comparison
      - areas automation doesn't cover, explored manually
      - staged rollout and monitoring
    rubric:
      excellent: Uses release notes to target risky areas, runs and compares the full suite and performance baselines before and after, explores gaps automation doesn't cover, and plans a staged rollout with monitoring.
      good: Runs the full regression and focuses on areas mentioned in the changelog.
      weak: Relies on the app compiling and starting up.
    followups:
      - How would you compare performance before and after fairly?
      - What would you do if half the UI tests break because of locator changes?
    common_errors:
      - Not checking behaviour changes in defaults, such as serialisation or security settings.

  - external_key: technical.qa.automatic_retries_tradeoff
    competency_key: ci_cd
    topic: Automatic retries in CI
    difficulty: medium
    kind: technical
    text: >-
      Many test runners can automatically retry failed tests. What are the trade-offs, and how would you set
      up retries if you use them at all?
    expected_concepts:
      - retries reduce noise and keep pipelines moving
      - retries hide real intermittent bugs
      - recording and reporting tests that passed on retry
      - limits on retry count and scope
      - retry data feeding flaky test detection
    rubric:
      excellent: Weighs reduced noise against hidden intermittent defects, limits retries, always reports pass-on-retry results, feeds them into flakiness tracking, and avoids retrying critical checks silently.
      good: Understands retries hide problems and wants them tracked.
      weak: Enables unlimited retries everywhere, or never considers them.
    followups:
      - Would you allow retries for tests covering payments?
      - How would you report a test that passed on its second attempt?
    common_errors:
      - Treating a pass on retry as a clean pass with no record kept.

  - external_key: technical.qa.inverted_pyramid_fix
    competency_key: testing
    topic: Fixing an inverted test pyramid
    difficulty: medium
    kind: scenario
    text: >-
      A team has nine hundred end-to-end UI tests and only a few dozen unit tests, and their pipeline is slow
      and unreliable. How would you help them rebalance?
    expected_concepts:
      - mapping what each UI test actually verifies
      - pushing business rules down to unit and API tests
      - keeping UI tests for key journeys only
      - developers owning lower-level tests
      - gradual migration with coverage tracked
    rubric:
      excellent: Analyses what the UI tests verify, moves rules down to unit and API level with developers, keeps a small set of journey tests, retires migrated UI tests, and tracks coverage so nothing is lost.
      good: Proposes adding unit and API tests and reducing UI tests.
      weak: Only tries to speed up the UI tests.
    followups:
      - How would you convince developers to write more of the lower-level tests?
      - How do you know a UI test is safe to delete once a lower-level test exists?
    common_errors:
      - Deleting UI tests before equivalent lower-level coverage exists.

  - external_key: technical.qa.double_booking_race
    competency_key: testing
    topic: Testing for race conditions
    difficulty: medium
    kind: scenario
    text: >-
      Customers occasionally manage to book the same hotel room for the same night twice. How would you
      design tests to reproduce and guard against this?
    expected_concepts:
      - concurrent requests fired at the same moment
      - repeating the test many times to surface timing issues
      - checking database constraints and locking
      - double clicks and client retries
      - asserting the final state is consistent
    rubric:
      excellent: Designs concurrent tests with synchronised requests repeated many times, includes double submits and retries, checks the final state rather than responses alone, and points to database constraints or locking as the real guard.
      good: Proposes sending simultaneous requests and checking for duplicates.
      weak: Tries to reproduce it manually by clicking quickly.
    followups:
      - How would you make the concurrent requests truly simultaneous?
      - Which part of the system should ultimately prevent the double booking?
    common_errors:
      - Running the concurrency test once and assuming the bug is fixed when it passes.

  # ------------------------------------------------------------------ hard
  - external_key: technical.qa.data_pipeline_quality
    competency_key: data_engineering
    topic: Testing a data pipeline
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're asked to own quality for a nightly pipeline that loads sales data from several sources into a
      warehouse that finance reports depend on. How would you test it and keep it trustworthy?
    expected_concepts:
      - unit tests for transformations
      - data quality checks on volume, nulls, uniqueness and ranges
      - reconciliation of totals against source systems
      - schema change detection from upstream
      - freshness monitoring and alerting
      - test datasets with known edge cases
    rubric:
      excellent: Combines transformation unit tests, automated data quality checks, reconciliation against sources, upstream schema change detection and freshness alerts, and uses curated edge-case datasets, with a plan for what happens when a check fails.
      good: Adds data quality checks and validates totals.
      weak: Only checks that the job finished without errors.
    followups:
      - An upstream team adds a new currency without telling you. What catches it?
      - Should a failed quality check stop the load or just alert?
    common_errors:
      - Treating a successful job run as proof the data is correct.

  - external_key: technical.qa.mutation_testing_effectiveness
    competency_key: testing
    topic: Measuring test effectiveness
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Coverage tells you which code ran, not whether your tests would notice a bug. How would you measure how
      effective a test suite really is, and where does mutation testing fit?
    expected_concepts:
      - mutation testing introduces small faults and checks tests fail
      - surviving mutants reveal weak assertions
      - cost and runtime, so targeting critical modules
      - escaped defect analysis as an outcome measure
      - fault seeding or historical bug replay
    rubric:
      excellent: Explains mutation testing and how to act on surviving mutants, addresses runtime cost by targeting critical code or changed lines, and combines it with outcome measures such as escaped defects and replaying historical bugs.
      good: Explains mutation testing and why it is better than coverage alone.
      weak: Equates effectiveness with coverage or test count.
    followups:
      - How would you deal with equivalent mutants that can't be killed?
      - Where in the pipeline would you run mutation testing given its cost?
    common_errors:
      - Running mutation testing across the entire codebase on every commit and abandoning it as too slow.

  - external_key: technical.qa.environment_strategy_tradeoffs
    competency_key: test_automation
    topic: Choosing a test environment strategy
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Compare shared staging, ephemeral per-change environments, local stacks with stubs, and testing in
      production. How would you combine them for a product with around forty services?
    expected_concepts:
      - local and stubbed environments for fast developer feedback
      - ephemeral environments for isolated integration
      - a shared integrated environment for cross-team checks
      - production verification for what can't be replicated
      - cost, fidelity and maintenance trade-offs
      - which tests run where
    rubric:
      excellent: Explains the fidelity, speed, isolation and cost of each option, assigns test types to each environment deliberately, and describes how data, dependencies and ownership work across them.
      good: Describes a sensible mix with reasons.
      weak: Picks a single environment type for everything.
    followups:
      - Who owns the shared environment, and how do you keep it healthy?
      - What would you never test outside production, and why?
    common_errors:
      - Pursuing a perfect production replica that is too expensive to keep accurate.

  - external_key: technical.qa.bug_backlog_cleanup
    competency_key: test_automation
    topic: Taming a large bug backlog
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You take over quality for a product with six hundred open bugs, some of them years old, and nobody
      trusts the backlog any more. How would you turn it into something useful?
    expected_concepts:
      - bulk closing stale or unreproducible bugs with clear rules
      - re-verifying high-severity items
      - clustering by component and root cause
      - agreeing priority definitions with product
      - preventing regrowth with triage cadence and limits
      - using trends to target quality investment
    rubric:
      excellent: Defines explicit rules to close stale items, re-checks severe ones, clusters the rest to find systemic causes, agrees definitions with product, and sets up a sustainable triage routine with metrics.
      good: Cleans out old bugs and introduces regular triage.
      weak: Proposes going through all six hundred individually in order.
    followups:
      - How would you justify closing bugs nobody has looked at?
      - What patterns might the clustering reveal, and what would you do about them?
    common_errors:
      - Cleaning the backlog once without changing the process that let it grow.

  - external_key: technical.qa.failure_signature_triage
    competency_key: test_automation
    topic: Automating failure triage at scale
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your pipelines run tens of thousands of tests a day, and people spend hours deciding whether each
      failure is a product bug, a test problem or an environment issue. How would you automate that triage?
    expected_concepts:
      - normalised failure signatures from stack traces and messages
      - grouping failures with the same signature
      - linking signatures to known issues and tickets
      - history to flag new versus recurring failures
      - environment health checks to tag infrastructure failures
      - routing to owning teams
    rubric:
      excellent: Designs signature extraction and grouping, links groups to known issues, uses history and environment health data to classify, routes to owners automatically, and keeps humans reviewing new signatures.
      good: Groups failures by error message and links them to tickets.
      weak: Proposes more people to look at failures.
    followups:
      - How would you avoid wrongly grouping two different bugs under one signature?
      - How would you measure whether the automation saves time?
    common_errors:
      - Classifying by test name alone, which merges unrelated failures.

  - external_key: technical.qa.continuous_deployment_role
    competency_key: test_automation
    topic: Quality engineering without a test phase
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your company is moving from fortnightly releases with a testing phase to continuous deployment with no
      separate test stage. How would quality engineering need to change, and what would you focus on first?
    expected_concepts:
      - developers owning automated tests in the pipeline
      - QA as coaches and toolsmiths
      - fast, reliable automated gates
      - progressive delivery and automated rollback
      - monitoring as part of verification
      - exploratory testing earlier, on features behind flags
    rubric:
      excellent: Redefines the role toward enabling teams, prioritises fast trustworthy gates, progressive delivery with rollback and observability, moves exploration earlier behind flags, and sequences the transition sensibly.
      good: Explains moving testing into the pipeline and adding monitoring.
      weak: Sees no change needed, or says testing is no longer necessary.
    followups:
      - What would make you pause the move to continuous deployment?
      - How would you keep exploratory testing alive without a test phase?
    common_errors:
      - Removing the test phase before automated gates and rollback are trustworthy.

  - external_key: technical.qa.configurable_saas_combinations
    competency_key: test_automation
    topic: Testing a highly configurable product
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your SaaS product lets each customer turn on dozens of settings and modules, so there are far more
      configurations than you could ever test. How would you decide what to cover?
    expected_concepts:
      - analysing which configurations customers actually use
      - pairwise or combinatorial test design
      - identifying settings that interact
      - representative customer profiles as test fixtures
      - testing configuration validation and defaults
      - monitoring errors by configuration in production
    rubric:
      excellent: Uses real usage data to find common and high-value configurations, applies pairwise techniques for breadth, focuses depth on interacting settings, builds profile-based fixtures, and uses production signals to catch the rest.
      good: Prioritises popular configurations and uses some combinatorial technique.
      weak: Tests only the default configuration.
    followups:
      - How would you find out which settings interact with each other?
      - A large customer hits a bug in a rare combination. How do you add coverage?
    common_errors:
      - Testing every setting in isolation and never in combination.
