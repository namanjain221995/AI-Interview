# Technical questions: security engineering, part 4 (vulnerability management, detection engineering and
# incident handling).
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [security]
questions:
  # ------------------------------------------------------------- easy
  - external_key: technical.security.vuln_prioritisation_beyond_cvss
    competency_key: security
    topic: Prioritising vulnerabilities beyond CVSS
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide how urgently to fix a vulnerability, beyond just reading its CVSS score?
    expected_concepts:
      - evidence of active exploitation, such as known-exploited lists or EPSS
      - whether the asset is internet-facing
      - business criticality and data sensitivity of the asset
      - whether the vulnerable code path is reachable
      - compensating controls already in place
      - remediation deadlines tied to the combined risk
    rubric:
      excellent: Combines exploitability, exposure, asset value and reachability into a clear prioritisation approach and explains how it changes deadlines.
      good: Considers exposure and exploitation in addition to the score.
      weak: Fixes strictly in CVSS order.
    followups:
      - When would you treat a medium-severity finding as more urgent than a critical one?
    common_errors:
      - Treating CVSS base score as a measure of risk to your specific environment.

  - external_key: technical.security.zero_day_library_exposure
    competency_key: security
    topic: Assessing exposure to a newly disclosed vulnerability
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A critical vulnerability in a widely used open-source library is announced on a Friday afternoon. How
      do you figure out where you're affected and what to do first?
    expected_concepts:
      - asset and software inventories or SBOMs
      - scanning repositories, running images and hosts including transitive dependencies
      - vendor and SaaS products that embed the library
      - prioritising internet-facing systems
      - interim mitigations such as WAF rules or configuration changes
      - clear communication and tracking of status
    rubric:
      excellent: Uses inventories and scanning to scope quickly, remembers transitive and vendor exposure, mitigates the most exposed systems first, and keeps stakeholders updated.
      good: Searches code and images for the library and patches exposed systems first.
      weak: Waits for the scanner's next scheduled run.
    followups:
      - How would you track progress when dozens of teams own affected services?
    common_errors:
      - Searching only direct dependencies in manifests.

  - external_key: technical.security.impossible_travel_triage
    competency_key: incident_response
    topic: Triaging a suspicious login alert
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An alert fires saying a user signed in from two distant locations forty minutes apart. How would you
      triage it?
    expected_concepts:
      - common benign causes such as VPNs, proxies and mobile networks
      - checking device, browser and MFA details for each session
      - reviewing what the suspicious session actually did
      - contacting the user through a trusted channel
      - containing by revoking sessions if it looks malicious
      - feeding results back to tune the rule
    rubric:
      excellent: Gathers context to separate benign from malicious quickly, checks post-login activity, contains when warranted, and improves the detection afterwards.
      good: Checks VPN usage and device details and contacts the user.
      weak: Either ignores it as probably a VPN or locks the account without investigation.
    followups:
      - What would make you escalate this immediately instead of investigating further?
    common_errors:
      - Closing the alert without looking at what the session did after login.

  - external_key: technical.security.first_detection_sources
    competency_key: incident_response
    topic: Choosing log sources for detection
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      If you were setting up detection for a typical web company from scratch, which log sources would you
      want first, and why those?
    expected_concepts:
      - identity provider sign-in and admin logs
      - cloud control-plane audit logs
      - endpoint detection telemetry from laptops and servers
      - application authentication and authorisation events
      - email security and DNS logs
      - choosing by likely attack paths and cost
    rubric:
      excellent: Prioritises sources by how attackers are likely to get in and move, explains what each source would reveal, and is mindful of cost and noise.
      good: Lists sensible sources with reasons.
      weak: Wants to collect everything without a priority order.
    followups:
      - Which of these would you drop if your budget were cut in half?
    common_errors:
      - Collecting logs nobody writes detections against.

  - external_key: technical.security.incident_lifecycle
    competency_key: incident_response
    topic: Phases of security incident handling
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Talk me through the phases of handling a security incident, and what good looks like in each one.
    expected_concepts:
      - preparation with runbooks, access and contacts
      - detection and analysis to confirm and scope
      - containment while preserving evidence
      - eradication and recovery
      - post-incident review and improvements
      - communication and documentation throughout
    rubric:
      excellent: Describes each phase with concrete examples of good practice, stresses evidence preservation and communication, and shows how lessons feed back into preparation.
      good: Names the phases correctly with brief descriptions.
      weak: Jumps straight to fixing the problem with no structure.
    followups:
      - What preparation makes the biggest difference when an incident actually happens?
    common_errors:
      - Wiping and rebuilding systems before capturing evidence.

  - external_key: technical.security.credential_phish_response
    competency_key: incident_response
    topic: Responding to a phished employee
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An employee reports that they clicked a link in a suspicious email and typed in their password. What do
      you do next?
    expected_concepts:
      - resetting the password and revoking active sessions and tokens
      - checking sign-in logs and MFA prompts for attacker activity
      - looking for new mailbox rules, forwarding or app consents
      - finding and removing the same email from other inboxes
      - blocking the phishing domain
      - thanking the reporter to encourage future reporting
    rubric:
      excellent: Contains the account fully, hunts for attacker persistence such as mailbox rules and OAuth grants, scopes the campaign across the organisation, and reinforces reporting.
      good: Resets credentials, revokes sessions and checks logs.
      weak: Only resets the password.
    followups:
      - What signs would show the attacker already used the credentials?
    common_errors:
      - Missing malicious inbox rules or third-party app grants left behind.

  - external_key: technical.security.patching_at_scale
    competency_key: security
    topic: Regular patching of servers and images
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you organise regular patching for servers and container images so that it actually happens,
      instead of piling up?
    expected_concepts:
      - automated rebuilds from updated base images
      - immutable infrastructure replacing rather than patching in place
      - staged rollouts with automated testing
      - clear ownership and deadlines
      - dashboards showing patch age and coverage
    rubric:
      excellent: Makes patching routine through automation and rebuilds, rolls out safely, and tracks coverage and age with clear ownership.
      good: Has a scheduled process with testing and some automation.
      weak: Patches manually when a big vulnerability is in the news.
    followups:
      - How do you handle a system nobody is willing to restart?
    common_errors:
      - Patching hosts in place while running containers keep their old vulnerable images.

  # ------------------------------------------------------------- medium
  - external_key: technical.security.missed_remediation_deadlines
    competency_key: security
    topic: Remediation deadlines that keep slipping
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A product team keeps missing the deadline for fixing high-severity vulnerabilities, and says feature
      work always comes first. How do you handle it?
    expected_concepts:
      - understanding the blockers behind the missed deadlines
      - showing concrete risk in terms the team and its leaders care about
      - a formal risk acceptance process with an owner and expiry
      - reducing fix effort through automation or platform changes
      - escalating through agreed governance when needed
    rubric:
      excellent: Diagnoses why fixes slip, makes risk visible and owned through acceptance with expiry, lowers the cost of fixing, and escalates constructively only when needed.
      good: Talks with the team, explains the risk and escalates if it continues.
      weak: Escalates immediately or quietly extends deadlines.
    followups:
      - What would a good risk acceptance record contain?
    common_errors:
      - Treating it purely as a compliance failure without asking why fixes are hard.

  - external_key: technical.security.detection_rule_lifecycle
    competency_key: incident_response
    topic: Building a reliable detection
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you go from an idea for a detection, say an attacker creating new access keys for a dormant
      user, to a rule that's reliable in production?
    expected_concepts:
      - defining the behaviour and confirming the data exists
      - writing the query and testing it against historical data
      - simulating the attack to confirm it fires
      - tuning for false positives with context and allowlists
      - a runbook for responders
      - managing detections as code with review and tests
    rubric:
      excellent: Describes an engineering lifecycle from hypothesis to tested, tuned, documented rule managed as code, with ongoing measurement of quality.
      good: Writes and tests the rule and tunes false positives.
      weak: Writes the query and deploys it without testing.
    followups:
      - How would you know if this detection silently stopped working?
    common_errors:
      - Never validating that the rule fires on a real simulation.

  - external_key: technical.security.alert_fatigue
    competency_key: incident_response
    topic: Reducing alert fatigue
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your security operations team is getting five hundred alerts a day, and analysts have started skimming
      past them. How would you fix that?
    expected_concepts:
      - measuring precision per rule
      - retiring or tuning low-value rules
      - enriching alerts with context
      - automating triage of common benign cases
      - aggregating related signals into risk-based alerts
      - analyst feedback loops
    rubric:
      excellent: Uses data on each rule's value to cut noise, adds enrichment and automation, and restructures alerting around risk so analysts see fewer, better alerts.
      good: Tunes the noisiest rules and adds automation.
      weak: Hires more analysts or raises thresholds across the board.
    followups:
      - How would you make sure you don't tune away a real attack?
    common_errors:
      - Disabling noisy rules without replacing the coverage they provided.

  - external_key: technical.security.contain_or_observe
    competency_key: incident_response
    topic: Containment decisions during an active intrusion
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You've confirmed a production web server is compromised, and the attacker appears to still be active.
      How do you decide between cutting it off immediately and watching to learn more?
    expected_concepts:
      - risk of ongoing data loss or damage
      - value of understanding scope before tipping off the attacker
      - capturing memory and disk evidence before isolation
      - network isolation over shutting the machine down
      - coordinated eradication across all footholds
      - involving legal and leadership in the decision
    rubric:
      excellent: Weighs ongoing harm against investigative value with clear criteria, preserves evidence, and plans coordinated containment so the attacker cannot simply move elsewhere.
      good: Isolates the host after capturing some evidence.
      weak: Powers it off immediately or watches indefinitely without criteria.
    followups:
      - What would push you to contain right away, even with little information?
    common_errors:
      - Shutting the machine down and losing volatile evidence.

  - external_key: technical.security.linux_evidence_order
    competency_key: incident_response
    topic: Evidence collection from a compromised host
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      What evidence would you collect from a compromised Linux host, and in what order?
    expected_concepts:
      - order of volatility from memory to disk
      - memory capture, running processes and network connections
      - disk snapshot or image
      - system, authentication and application logs
      - hashing and chain of custody
      - avoiding changes to the system during collection
    rubric:
      excellent: Follows order of volatility with specific artefacts, uses trusted tooling, and documents and hashes evidence to preserve integrity.
      good: Captures memory and logs before disk and avoids tampering.
      weak: Starts by logging in and running commands that modify the system, or only copies logs.
    followups:
      - How would this change if the host is a cloud virtual machine?
    common_errors:
      - Relying on tools from the compromised system itself.

  - external_key: technical.security.linux_persistence_hunt
    competency_key: linux
    topic: Finding persistence on Linux
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      If you suspected an attacker had a foothold on a Linux server, where would you look for the ways they
      might keep access?
    expected_concepts:
      - cron jobs and systemd units or timers
      - authorized_keys files and new or modified accounts
      - shell startup files and sudoers changes
      - LD_PRELOAD and modified system binaries
      - kernel modules and rootkits
      - web shells in application directories
    rubric:
      excellent: Covers a wide range of persistence mechanisms, compares against a known-good baseline, and recognises when the host can no longer be trusted and must be rebuilt.
      good: Checks cron, systemd, SSH keys and new users.
      weak: Only looks at running processes.
    followups:
      - At what point would you stop investigating the host and rebuild it?
    common_errors:
      - Trusting output from system tools that may have been replaced.

  - external_key: technical.security.pentest_scoping
    competency_key: security
    topic: Getting value from a penetration test
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're preparing for an external penetration test of your main product. How do you scope it and make
      sure you get real value out of the report?
    expected_concepts:
      - clear objectives tied to the riskiest areas
      - scope, rules of engagement and environment choice
      - authenticated testing with several roles
      - sharing architecture context to focus effort
      - remediation plan and retesting
      - feeding findings into broader fixes and training
    rubric:
      excellent: Designs the test around specific risk questions, equips testers to go deep, and turns results into root-cause fixes and verified remediation.
      good: Defines scope and rules and plans to fix and retest.
      weak: Treats it as a checkbox and files the report away.
    followups:
      - When would you choose a black-box test, and when a white-box one?
    common_errors:
      - Restricting scope so tightly that the most important flows are excluded.

  - external_key: technical.security.lateral_movement_signals
    competency_key: incident_response
    topic: Detecting lateral movement
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Which signals would you use to detect an attacker moving laterally inside a corporate or cloud
      network?
    expected_concepts:
      - unusual authentication patterns between hosts
      - service accounts used from new sources
      - unusual east-west connections or remote administration tools
      - chains of role assumptions in the cloud
      - credential dumping behaviour on endpoints
      - honeytokens and decoy credentials
    rubric:
      excellent: Combines identity, network and endpoint signals, baselines normal behaviour, and uses deception for high-confidence alerts.
      good: Names unusual logins and network connections.
      weak: Relies only on perimeter firewall logs.
    followups:
      - How would you place honeytokens so they produce useful alerts?
    common_errors:
      - Monitoring only north-south traffic at the edge.

  - external_key: technical.security.ransomware_tabletop
    competency_key: incident_response
    topic: Designing a ransomware tabletop exercise
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're running a tabletop exercise on a ransomware scenario with engineering and leadership. How would
      you design it so it exposes real gaps?
    expected_concepts:
      - a realistic scenario built on your own environment
      - injects that force decisions under time pressure
      - testing backups, restore times and dependencies
      - communication, legal and regulatory decisions
      - clear roles and decision rights
      - capturing gaps as tracked actions
    rubric:
      excellent: Builds a realistic, decision-heavy scenario across technical and business roles, tests assumptions about recovery and communications, and turns gaps into owned actions.
      good: Includes realistic injects and both technical and leadership participants.
      weak: Walks through a generic script with no decisions.
    followups:
      - Which decision do you expect leadership to struggle with most?
    common_errors:
      - Assuming backups work without testing restore times.

  - external_key: technical.security.dns_tunnelling
    competency_key: networking
    topic: Suspicious DNS activity
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Network monitoring shows a single host making thousands of DNS queries for long, random-looking
      subdomains of one domain. What might be going on, and how would you investigate it?
    expected_concepts:
      - DNS tunnelling for data exfiltration or command and control
      - legitimate causes such as security or CDN products
      - identifying the process responsible on the host
      - query length, entropy and volume analysis
      - domain age and reputation
      - blocking the domain and containing the host
    rubric:
      excellent: Forms hypotheses including benign ones, pivots from network data to the responsible process, estimates data volume, and contains appropriately.
      good: Recognises possible tunnelling and investigates the host and domain.
      weak: Blocks the domain and closes the alert without investigating the host.
    followups:
      - How could you estimate how much data might have left?
    common_errors:
      - Ignoring legitimate products that use DNS in similar ways.

  - external_key: technical.security.disclosure_intake
    competency_key: security
    topic: Running vulnerability disclosure intake
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      If you ran intake for a bug bounty or vulnerability disclosure program, how would you triage and respond
      to incoming reports?
    expected_concepts:
      - reproducing and validating the report
      - consistent severity rating and deduplication
      - response time targets and regular researcher updates
      - safe harbour and clear policy
      - routing to owners and verifying fixes
      - consistent rewards and learning from root causes
    rubric:
      excellent: Describes a consistent, timely process from validation to fix verification, treats researchers as partners, and uses reports to drive systemic fixes.
      good: Validates, rates and routes reports with reasonable response times.
      weak: Handles reports ad hoc or dismisses ones that are hard to reproduce.
    followups:
      - How would you handle a researcher who threatens to publish before a fix is ready?
    common_errors:
      - Leaving researchers without updates for weeks.

  - external_key: technical.security.vuln_program_metrics
    competency_key: security
    topic: Measuring vulnerability management
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Which metrics would you use to show whether a vulnerability management program is actually reducing
      risk?
    expected_concepts:
      - time to remediate by severity and exposure
      - deadline compliance rates
      - exposure windows for actively exploited vulnerabilities
      - scanning coverage of assets
      - recurrence of the same issue types
      - age and volume of risk acceptances
    rubric:
      excellent: Chooses outcome metrics tied to exposure and coverage, explains how each can be gamed, and links them to decisions.
      good: Uses time to remediate and deadline compliance.
      weak: Reports the total number of open vulnerabilities.
    followups:
      - How could a team make these numbers look good without reducing risk?
    common_errors:
      - Ignoring assets that are not scanned at all.

  # ------------------------------------------------------------- hard
  - external_key: technical.security.customer_data_exfil_investigation
    competency_key: incident_response
    topic: Investigating customer data theft
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You find evidence that an attacker queried a customer database containing personal data over several
      weeks. How do you lead the investigation and work out what was actually taken?
    expected_concepts:
      - preserving evidence and containing access
      - building a timeline from database, application and network logs
      - determining exact records and fields accessed
      - estimating exfiltrated volume from egress data
      - engaging legal counsel early for notification deadlines
      - coordinated communication with customers and regulators
    rubric:
      excellent: Leads a structured investigation that scopes affected records precisely, works in parallel with legal on notification obligations, and plans communication and root-cause fixes.
      good: Contains, reviews logs to scope impact and involves legal.
      weak: Focuses only on closing the hole without determining impact.
    followups:
      - What do you do if the database had no query logging?
      - How do notification deadlines shape the order of your work?
    common_errors:
      - Assuming the worst case or best case without evidence when scoping impact.

  - external_key: technical.security.detection_coverage_validation
    competency_key: incident_response
    topic: Measuring detection coverage
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you measure and improve detection coverage across your environment, and how do you avoid
      fooling yourself that coverage is better than it really is?
    expected_concepts:
      - mapping detections to a framework such as MITRE ATT&CK
      - validating with attack simulation or purple teaming
      - checking that telemetry is actually collected from all assets
      - monitoring data source health and rule failures
      - prioritising gaps using threat intelligence
    rubric:
      excellent: Distinguishes paper coverage from tested coverage, validates continuously with simulation and telemetry checks, and prioritises gaps by realistic threats.
      good: Maps detections to ATT&CK and runs some tests.
      weak: Counts rules per technique and calls it coverage.
    followups:
      - How often would you rerun simulations, and why?
    common_errors:
      - Assuming a mapped rule works without testing it against real activity.

  - external_key: technical.security.backdoored_vendor_update
    competency_key: incident_response
    topic: Responding to a compromised vendor update
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A vendor tells you that a software update you deployed to every server last week contained a backdoor.
      How do you run the response?
    expected_concepts:
      - inventory of every affected host
      - hunting with vendor and community indicators of compromise
      - reviewing outbound connections for command-and-control activity
      - isolating or rebuilding affected systems
      - rotating credentials reachable from affected hosts
      - vendor coordination and timeline reconstruction
    rubric:
      excellent: Scopes systematically, hunts for actual attacker activity rather than just presence of the update, makes risk-based rebuild and rotation decisions, and coordinates across teams and the vendor.
      good: Removes the update, hunts for indicators and rotates credentials.
      weak: Uninstalls the update and waits for the vendor's patch.
    followups:
      - How would you decide whether to rebuild hosts or clean them?
    common_errors:
      - Treating removal of the update as removal of any access the attacker gained.

  - external_key: technical.security.cloud_forensics_readiness
    competency_key: incident_response
    topic: Forensic readiness in the cloud
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How does investigating an incident in a cloud environment differ from one on traditional servers, and
      what would you prepare in advance?
    expected_concepts:
      - ephemeral resources and autoscaling destroying evidence
      - automated snapshotting and isolation through APIs
      - audit log retention long enough for investigations
      - a dedicated forensic account with pre-approved responder roles
      - difficulty of memory capture on managed services
      - shared responsibility and provider support processes
    rubric:
      excellent: Explains the cloud-specific evidence challenges and prepares tooling, accounts, roles and retention in advance so responders can act quickly.
      good: Notes ephemeral evidence and the importance of audit logs and snapshots.
      weak: Applies an on-premise disk imaging approach without adaptation.
    followups:
      - How would you collect evidence from a container that has already been terminated?
    common_errors:
      - Discovering during an incident that responders lack permissions to snapshot resources.

  - external_key: technical.security.departing_engineer_data_alert
    competency_key: security
    topic: Possible data theft by a departing employee
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Data loss alerts show that an engineer downloaded a large volume of source code and customer exports in
      the week before handing in their notice. How do you handle it?
    expected_concepts:
      - establishing facts before drawing conclusions
      - checking for a legitimate business reason
      - involving legal and HR early and keeping the matter confidential
      - preserving evidence properly
      - adjusting access proportionately
      - assessing customer data exposure and obligations
    rubric:
      excellent: Handles it as a fact-finding exercise with legal and HR, preserves evidence, takes proportionate access steps, and assesses customer-data obligations without prejudging the person.
      good: Involves HR and legal, preserves evidence and restricts access.
      weak: Confronts the engineer directly or ignores it because they are leaving anyway.
    followups:
      - What evidence would help distinguish normal work from deliberate data theft?
    common_errors:
      - Acting on the alert before confirming what was actually downloaded.

  - external_key: technical.security.long_dwell_post_incident
    competency_key: incident_response
    topic: Post-incident review after a long intrusion
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You've just closed a serious incident where an attacker was in the environment for three months before
      anyone noticed. How would you run the post-incident review so it leads to lasting improvements?
    expected_concepts:
      - a blameless review focused on systems and decisions
      - a detailed timeline including missed signals
      - why existing detections failed or never existed
      - contributing factors across people, process and technology
      - prioritised actions with owners and follow-up tracking
      - measuring dwell time going forward
    rubric:
      excellent: Runs a blameless, evidence-based review that explains each missed opportunity to detect, produces prioritised actions with owners, and tracks them to completion.
      good: Builds a timeline and produces actions to improve detection.
      weak: Focuses on who was at fault or produces a long unprioritised list.
    followups:
      - How do you make sure the actions are still being worked on six months later?
    common_errors:
      - Ending the review with recommendations that have no owners or deadlines.
