# Curated questions: data analyst — dashboards, data storytelling and working with stakeholders.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_analyst]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.data_analyst.sales_dashboard_kickoff
    competency_key: data_visualization
    topic: Starting a dashboard request
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      The head of sales asks you for a new dashboard for the sales leadership team. Before you open any BI tool,
      what do you do?
    expected_concepts:
      - who will use it and how often
      - the decisions or actions the dashboard should support
      - the handful of metrics that matter and their definitions
      - data availability and freshness requirements
      - a quick sketch or mock-up reviewed with users
    rubric:
      excellent: Interviews the actual users about decisions and cadence, agrees a small set of defined metrics, checks the data can support them, and validates a rough mock-up before building.
      good: Clarifies audience and key metrics before building.
      weak: Starts building charts from whatever data is available and asks for feedback at the end.
    followups:
      - What questions would you ask to find out what decisions it should support?
      - How would you decide what goes at the top of the page?
    common_errors:
      - Collecting a long wish list of charts instead of the decisions behind them.

  - external_key: technical.data_analyst.choosing_chart_types
    competency_key: data_visualization
    topic: Matching chart type to the question
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide which kind of chart to use for a particular message? Give me a couple of examples from
      work where the choice of chart made a real difference.
    expected_concepts:
      - line charts for trends over time
      - bar charts for comparing categories
      - histograms or box plots for distributions
      - scatter plots for relationships
      - avoiding pie charts with many slices and 3D effects
    rubric:
      excellent: Starts from the question being answered, matches chart forms to comparisons, trends, distributions and relationships, and gives real examples where a better chart changed how the audience understood the data.
      good: Gives correct general rules with at least one example.
      weak: Chooses charts by habit or appearance without linking them to the message.
    followups:
      - When would you use a table instead of a chart?
      - How would you show a distribution to an audience that has never seen a box plot?
    common_errors:
      - Using a pie chart to compare many similar-sized categories.

  - external_key: technical.data_analyst.charts_that_mislead
    competency_key: data_visualization
    topic: Avoiding misleading charts
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What are some of the ways a chart can mislead people even when the underlying numbers are correct, and
      what do you do to avoid that in your own work?
    expected_concepts:
      - truncated or non-zero axes on bar charts
      - dual axes implying relationships
      - inconsistent scales across small multiples
      - cherry-picked time ranges
      - missing context such as targets, prior periods or sample sizes
    rubric:
      excellent: Names several distinct techniques with concrete examples, explains when a non-zero axis is acceptable, and describes habits they use to keep charts fair.
      good: Names two or three common issues such as truncated axes and selective time ranges.
      weak: Can only name one issue or thinks accurate numbers guarantee a fair chart.
    followups:
      - When is it fine for a line chart not to start at zero?
      - Have you ever had to push back on a chart someone else made? What happened?
    common_errors:
      - Applying the start-at-zero rule to line charts where it hides meaningful variation.

  - external_key: technical.data_analyst.vague_numbers_request
    competency_key: stakeholder_management
    topic: Scoping an ad hoc request
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Someone from the operations team messages you, can you pull the numbers on late deliveries? What do you do
      before you start writing queries?
    expected_concepts:
      - asking what decision or question the numbers are for
      - clarifying the definition of late
      - time range, granularity and segments needed
      - deadline and level of precision required
      - confirming scope back in writing
    rubric:
      excellent: Asks what the request is for, pins down the definition and scope, agrees format and deadline, and confirms back briefly so expectations are clear.
      good: Clarifies the definition and time range before starting.
      weak: Pulls a large extract immediately and sends it without context.
    followups:
      - How do you keep clarifying questions from slowing small requests down?
      - What would you do if the request turns out to be a much bigger project?
    common_errors:
      - Delivering a raw extract when the stakeholder actually needed an answer to a question.

  - external_key: technical.data_analyst.analysis_for_non_technical
    competency_key: communication
    topic: Presenting analysis to a non-technical audience
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Tell me about an analysis you presented to people without a data background. How did you structure it, and
      how did you know whether it landed?
    expected_concepts:
      - leading with the answer or recommendation
      - a few key numbers in business terms
      - visuals simplified for the audience
      - methodology kept brief or in an appendix
      - checking understanding and follow-up actions
    rubric:
      excellent: Describes a real case where they led with the conclusion, translated findings into business terms, kept the method in the background, and can point to a decision or action that followed.
      good: Gives a real example with a clear structure and audience adaptation.
      weak: Describes walking through every query and chart in the order they did the work.
    followups:
      - What did you leave out, and why?
      - What question from the audience surprised you?
    common_errors:
      - Presenting in the order the analysis was done rather than leading with the finding.

  - external_key: technical.data_analyst.operations_kpi_selection
    competency_key: data_visualization
    topic: Choosing headline KPIs
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      For a warehouse operations dashboard that shift managers look at during the day, how would you decide
      which few numbers go at the very top?
    expected_concepts:
      - metrics the managers can act on during the shift
      - comparison against target or normal range
      - freshness appropriate to intraday decisions
      - limiting to a small number of headline figures
      - drill-down for detail rather than crowding the top
    rubric:
      excellent: Prioritises actionable intraday metrics with targets or normal ranges, keeps the top section to a few figures, and puts detail in drill-downs, justifying choices by what managers can change during a shift.
      good: Picks sensible operational metrics and adds context such as targets.
      weak: Puts monthly or strategic metrics at the top, or lists everything.
    followups:
      - How would the top of the page differ for the regional director?
      - How would you show that a number is outside its normal range?
    common_errors:
      - Showing numbers without a target or comparison, so readers can't tell whether they are good.

  - external_key: technical.data_analyst.checks_before_sending
    competency_key: data_analysis
    topic: Sanity checks before sharing results
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You've just finished an analysis and the meeting where you'll present it starts in an hour. What do you
      check before you send the numbers out?
    expected_concepts:
      - comparing totals with a trusted source or dashboard
      - checking that numbers are plausible against history
      - reviewing filters, date ranges and joins
      - making sure definitions are stated on the slides
      - asking a colleague for a quick review where possible
    rubric:
      excellent: Describes a concrete routine covering reconciliation to trusted totals, plausibility, filter and join review and labelled definitions, and asks for a second pair of eyes on anything high-stakes.
      good: Checks totals and reviews the main query for mistakes.
      weak: Sends the numbers without checks, relying on the query having run without errors.
    followups:
      - Which mistake have you caught this way before?
      - What do you do if a number looks wrong ten minutes before the meeting?
    common_errors:
      - Treating a query that runs successfully as a correct query.

  # ---------------------------------------------------------------- medium
  - external_key: technical.data_analyst.dashboard_nobody_opens
    competency_key: data_visualization
    topic: Low dashboard adoption
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Two months after you launched a dashboard the team asked for, the usage logs show almost nobody opens it.
      How would you find out why, and what would you do?
    expected_concepts:
      - talking to intended users about how they actually work
      - checking whether it answers their real questions
      - trust issues such as numbers not matching other sources
      - performance, discoverability or access problems
      - delivering insights where people already work, such as email or chat summaries
      - retiring it if it isn't needed
    rubric:
      excellent: Investigates with users and usage data, considers relevance, trust, speed and discoverability, adapts delivery to existing workflows, and is willing to retire the dashboard if it no longer serves a need.
      good: Talks to users and identifies a plausible reason with a fix.
      weak: Sends reminders or adds more charts without understanding the cause.
    followups:
      - What would you do differently at the start of the next dashboard project?
      - How do you decide when to retire a dashboard?
    common_errors:
      - Assuming low usage means users need training.

  - external_key: technical.data_analyst.two_revenue_dashboards
    competency_key: stakeholder_management
    topic: Conflicting numbers before an exec meeting
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      The evening before a leadership meeting, you notice that your dashboard and the finance team's dashboard
      show different revenue figures for last month. What do you do tonight, and what do you do afterwards?
    expected_concepts:
      - quickly identifying the cause of the gap if possible
      - contacting the finance counterpart before the meeting
      - agreeing which number is presented and with what caveat
      - a short note explaining the difference
      - fixing the root cause and aligning definitions afterwards
    rubric:
      excellent: Prioritises a quick diagnosis and a coordinated message with finance before the meeting, agrees which figure to show and why, and follows up with a root-cause fix and shared definition.
      good: Investigates the gap and coordinates with finance before the meeting.
      weak: Says nothing and hopes no one notices, or presents both numbers without explanation.
    followups:
      - You can't find the cause tonight. What do you say in the meeting?
      - How would you stop this happening again?
    common_errors:
      - Fixing the number quietly without telling stakeholders why it changed.

  - external_key: technical.data_analyst.exec_writeup_structure
    competency_key: communication
    topic: Structuring a written analysis for leaders
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you structure a written analysis for senior leaders who might only read the first paragraph? Walk me
      through the sections you'd use and why.
    expected_concepts:
      - the key finding and recommendation first
      - supporting evidence ordered by importance
      - confidence level and main caveats stated plainly
      - clear next steps and owners
      - methods and detail in an appendix
    rubric:
      excellent: Puts the answer and recommendation in the first lines, follows with prioritised evidence, states limitations in plain words, ends with concrete next steps, and moves methodology to an appendix.
      good: Leads with a summary and keeps detail lower down.
      weak: Mirrors the chronology of the work, with conclusions at the end.
    followups:
      - How do you write a title that tells the reader the conclusion?
      - Where would you put a finding that contradicts your recommendation?
    common_errors:
      - Burying the recommendation after pages of methodology.

  - external_key: technical.data_analyst.forty_charts_request
    competency_key: data_visualization
    topic: Pushing back on dashboard clutter
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A stakeholder wants forty charts on a single dashboard page so that everything is in one place. How would
      you handle that request?
    expected_concepts:
      - understanding the underlying needs behind each chart
      - grouping by audience or question into tabs or pages
      - a summary view with drill-down
      - load time and cognitive load concerns
      - prototyping both options and testing with users
    rubric:
      excellent: Uncovers the needs behind the request, proposes a layered design with a summary and drill-downs, explains the performance and readability costs, and tests the design with actual users rather than arguing in the abstract.
      good: Suggests organising into a summary and detail pages with reasons.
      weak: Builds all forty charts as asked or refuses without an alternative.
    followups:
      - How would you decide which charts make the summary view?
      - The stakeholder still wants everything on one page. What then?
    common_errors:
      - Arguing about design principles instead of the stakeholder's actual questions.

  - external_key: technical.data_analyst.dashboard_trust_signals
    competency_key: data_visualization
    topic: Building trust in dashboard data
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      People often stop trusting dashboards after a couple of bad experiences. What do you build into a
      dashboard so that readers know how far they can rely on what they're seeing?
    expected_concepts:
      - last refreshed timestamp and data freshness
      - metric definitions accessible from the page
      - known issues or incident banners
      - data quality checks that block or flag bad loads
      - a named owner and a way to report problems
    rubric:
      excellent: Combines visible freshness, accessible definitions, known-issue notices and automated quality checks with clear ownership, and explains how each prevents a specific loss of trust.
      good: Mentions refresh timestamps, definitions and an owner.
      weak: Relies on users noticing problems themselves.
    followups:
      - What would you do when a data load fails overnight?
      - How would you communicate a correction to historical numbers on the dashboard?
    common_errors:
      - Showing stale data with no indication that it is stale.

  - external_key: technical.data_analyst.launch_hurt_revenue
    competency_key: communication
    topic: Delivering unwelcome findings
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your analysis shows that a launch the product team is proud of has reduced revenue. How would you share
      that with them?
    expected_concepts:
      - double-checking the analysis before sharing
      - sharing with the team first, before wider audiences
      - focusing on evidence, not blame
      - acknowledging what went well and the uncertainty
      - proposing next steps such as a fix or a test
    rubric:
      excellent: Verifies the result, briefs the owning team privately first, presents evidence and uncertainty neutrally, and moves the conversation towards next steps they can own.
      good: Checks the analysis and shares it directly with the team with evidence.
      weak: Softens the result until it is meaningless, or announces it widely before talking to the team.
    followups:
      - The team challenges your method. How do you respond?
      - When would you escalate the finding beyond the team?
    common_errors:
      - Presenting the finding to leadership before the product team has seen it.

  - external_key: technical.data_analyst.repeat_requests_self_serve
    competency_key: data_analysis
    topic: Reducing repeated ad hoc requests
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Half your week goes on small requests that are variations of the same few questions. How would you change
      things so stakeholders can answer more of these themselves?
    expected_concepts:
      - analysing the request log for recurring patterns
      - curated, documented data models or a semantic layer
      - parameterised dashboards or explores for common questions
      - training and office hours for stakeholders
      - guardrails such as certified metrics to avoid inconsistent answers
    rubric:
      excellent: Uses the request history to identify patterns, builds well-defined reusable models and self-serve tools for them, trains users, and protects consistency with certified definitions.
      good: Proposes self-serve dashboards for the common questions.
      weak: Suggests simply saying no to requests or giving everyone raw database access.
    followups:
      - How would you measure whether self-serve actually reduced requests?
      - What would you keep as an analyst-only service, and why?
    common_errors:
      - Opening raw tables to everyone, which multiplies inconsistent numbers.

  - external_key: technical.data_analyst.colour_and_readability
    competency_key: data_visualization
    topic: Readable and accessible chart design
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you make sure your charts can be read by everyone in the audience, including people with colour
      vision deficiency or who view them in a printout or on a phone?
    expected_concepts:
      - colour-blind-safe palettes and not relying on red versus green alone
      - direct labels instead of legends where possible
      - sufficient contrast and readable font sizes
      - redundant encoding with shape, position or pattern
      - checking how charts render in print and on small screens
    rubric:
      excellent: Describes specific practices such as safe palettes, direct labelling, redundant encoding and contrast, and tests output in the formats people actually use.
      good: Mentions colour-blind-safe palettes and clear labelling.
      weak: Relies on default colours and legends without considering the audience.
    followups:
      - How would you show good versus bad status without red and green?
      - What changes would you make for a chart that will be printed in black and white?
    common_errors:
      - Encoding meaning only through colour.

  - external_key: technical.data_analyst.five_teams_one_analyst
    competency_key: stakeholder_management
    topic: Prioritising competing requests
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're the only analyst supporting five teams, and this week each of them says their request is urgent. How
      do you decide what to work on, and how do you communicate it?
    expected_concepts:
      - understanding the decision and deadline behind each request
      - estimating effort and business impact
      - agreeing priorities with a manager or shared forum
      - transparent queue and expected timelines
      - offering quicker partial answers where they suffice
    rubric:
      excellent: Assesses each request by impact, deadline and effort, involves the right decision-maker in trade-offs, makes the queue visible, and offers lighter-weight answers where full analysis isn't needed.
      good: Prioritises by impact and deadline and tells stakeholders what to expect.
      weak: Works first-come first-served or on whoever is loudest, without communicating.
    followups:
      - Two directors both insist their request is top priority. What do you do?
      - How do you tell someone their request won't be done this month?
    common_errors:
      - Silently delaying lower-priority requests instead of telling the requester.

  - external_key: technical.data_analyst.churn_findings_to_actions
    competency_key: product_sense
    topic: Turning findings into recommendations
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You were asked why customers cancel, and your analysis found several patterns. How do you turn those
      findings into recommendations the product team can actually act on?
    expected_concepts:
      - separating causes from symptoms
      - sizing each opportunity by affected customers or revenue
      - linking each finding to a concrete, testable action
      - prioritising by impact and effort with the team
      - defining how success of each action will be measured
    rubric:
      excellent: Distinguishes likely causes from symptoms, sizes each opportunity, proposes specific testable actions with success measures, and prioritises them together with the product team.
      good: Proposes actions tied to the main findings with rough sizing.
      weak: Hands over a list of observations with no prioritisation or recommendations.
    followups:
      - One finding is big but the team can't do much about it. How do you present it?
      - How would you follow up to see whether the actions worked?
    common_errors:
      - Recommending actions without estimating how many customers they would affect.

  - external_key: technical.data_analyst.kpi_anomaly_alerts
    competency_key: data_analysis
    topic: Alerting on metric anomalies
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Leadership wants to be alerted automatically when a key business metric does something unusual. How would
      you design those alerts so they catch real problems without crying wolf?
    expected_concepts:
      - baselines that account for weekly and seasonal patterns
      - thresholds based on historical variability rather than fixed percentages
      - checking data completeness before alerting
      - routing alerts to an owner with context
      - reviewing and tuning false positive rates
    rubric:
      excellent: Uses seasonality-aware baselines and variability-based thresholds, suppresses alerts on incomplete data, routes them to owners with context, and plans to measure and tune alert quality.
      good: Compares against a seasonal baseline with a sensible threshold.
      weak: Alerts on any fixed percentage change from yesterday.
    followups:
      - How would you handle holidays and promotions in the baseline?
      - What would you put in the alert message itself?
    common_errors:
      - Alerting on day-over-day changes that are just normal weekly patterns.

  # ------------------------------------------------------------------ hard
  - external_key: technical.data_analyst.one_number_wide_range
    competency_key: communication
    topic: Giving a decision-maker a usable estimate
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The CEO asks how much revenue a new product line could bring in next year, and your realistic estimate
      ranges from two to twelve million. How would you present that so it actually helps the decision?
    expected_concepts:
      - identifying the decision and its break-even point
      - explaining the main drivers of the range
      - scenarios with probabilities or likelihood language
      - what information would narrow the range and how quickly
      - a clear recommendation despite uncertainty
    rubric:
      excellent: Anchors on the decision and break-even threshold, explains what drives the range, presents scenarios clearly, proposes ways to reduce uncertainty such as a pilot, and still gives a recommendation.
      good: Presents the range with scenarios and the main assumptions.
      weak: Gives only the midpoint, or presents the range with no guidance on what to do.
    followups:
      - The CEO says, just tell me the most likely number. What do you say?
      - Which single piece of information would narrow the range most?
    common_errors:
      - Presenting precision the data can't support, such as a single number to the nearest thousand.

  - external_key: technical.data_analyst.wrong_number_in_board_deck
    competency_key: communication
    topic: Correcting a published error
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You discover that a retention figure you supplied for last month's board deck was overstated because of a
      filter mistake. What do you do?
    expected_concepts:
      - confirming the error and the correct figure
      - telling your manager and the deck owner promptly
      - assessing which decisions or materials relied on it
      - a clear correction with what changed and why
      - preventing recurrence through review or tests
    rubric:
      excellent: Verifies the correct figure, raises it promptly with the right people, assesses downstream impact, supplies a clear written correction, and puts a concrete safeguard in place.
      good: Corrects the number and informs the stakeholders promptly.
      weak: Fixes it silently in future reports or waits to see whether anyone notices.
    followups:
      - The correct number changes the story the deck told. How do you handle that?
      - What safeguard would you add to your process?
    common_errors:
      - Correcting the dashboard without telling the people who used the old number.

  - external_key: technical.data_analyst.find_data_that_supports
    competency_key: stakeholder_management
    topic: Requests to support a predetermined conclusion
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A director asks you to find data that supports a decision they've already made, for a presentation to the
      leadership team next week. How would you handle that request?
    expected_concepts:
      - understanding the decision and the director's reasoning
      - reframing the work as testing the case, not only supporting it
      - presenting supporting and contradicting evidence fairly
      - raising concerns privately and early
      - escalating only if asked to misrepresent data
    rubric:
      excellent: Engages with the director's goals, reframes the analysis as testing the decision, shares findings privately and early including contradicting evidence, and holds a clear line against misrepresentation while staying helpful.
      good: Agrees to do the analysis but insists on reporting all relevant findings.
      weak: Cherry-picks data as asked, or refuses outright without engaging.
    followups:
      - The data partly supports and partly contradicts the decision. How do you present it?
      - The director asks you to drop a slide that weakens the case. What do you do?
    common_errors:
      - Treating the request as purely adversarial instead of first understanding the business reasons.

  - external_key: technical.data_analyst.certified_metrics_governance
    competency_key: data_analysis
    topic: Governing shared metric definitions
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your company has hundreds of dashboards and the same metric is calculated a dozen different ways. If you
      were asked to fix that across the organisation, how would you approach it?
    expected_concepts:
      - inventorying metrics and dashboard usage
      - prioritising the most important and most contested metrics
      - a central semantic or metrics layer as the single definition
      - ownership, certification and change management for definitions
      - deprecating duplicates and migrating dashboards
      - versioning when a definition changes
    rubric:
      excellent: Starts with an inventory and prioritisation, centralises definitions in a metrics layer with owners and certification, plans migration and deprecation, and explains how definition changes are versioned and communicated.
      good: Proposes a central metric layer with owners and documentation.
      weak: Suggests writing a glossary document and hoping teams follow it.
    followups:
      - How would you handle a definition change that alters historical numbers?
      - How do you get teams to give up their own versions?
    common_errors:
      - Trying to certify every metric at once instead of starting with the critical ones.

  - external_key: technical.data_analyst.slow_dashboard_billions_rows
    competency_key: databases
    topic: Designing fast dashboards on large data
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      A self-serve dashboard sits on top of an event table with billions of rows, and filters take a minute to
      respond. How would you redesign the data behind it, and what trade-offs would you discuss with the users?
    expected_concepts:
      - aggregate tables at the grains users actually filter on
      - partitioning and clustering by date and common filters
      - extracts or caching in the BI tool
      - limiting high-cardinality filters or dimensions
      - freshness versus speed versus flexibility trade-offs
    rubric:
      excellent: Proposes pre-aggregated models matched to real filter patterns with good partitioning, uses caching appropriately, and lays out the freshness and flexibility trade-offs for users to decide on.
      good: Suggests aggregates and partitioning to speed it up.
      weak: Only suggests adding more compute or tells users to wait.
    followups:
      - Users still need occasional row-level detail. How do you support that?
      - How would you decide which aggregate tables to build?
    common_errors:
      - Building aggregates that don't match the filters users actually apply, so queries fall back to raw data.

  - external_key: technical.data_analyst.where_to_invest_next_year
    competency_key: problem_solving
    topic: Planning an open-ended strategic analysis
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A new head of product asks you, where should we invest next year? and gives you three weeks. How would you
      plan and run that analysis?
    expected_concepts:
      - clarifying the decision, constraints and options being considered
      - structuring the problem into a tree of questions
      - sizing opportunities such as segments, features or markets
      - combining quantitative data with qualitative inputs
      - interim check-ins and a timeboxed plan
      - recommendations with confidence levels
    rubric:
      excellent: Clarifies the decision and options, breaks the question into a structured set of sub-questions, sizes opportunities with available data, blends qualitative inputs, timeboxes with check-ins, and ends with ranked recommendations and stated uncertainty.
      good: Breaks the question down and sizes a few opportunities.
      weak: Starts pulling data without a plan or delivers a broad data dump.
    followups:
      - What would you deliver at the end of the first week?
      - How would you decide what to leave out given three weeks?
    common_errors:
      - Spending most of the time on data preparation and leaving no time for the recommendation.

  - external_key: technical.data_analyst.support_volume_forecast
    competency_key: data_analysis
    topic: Building and validating a simple forecast
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      The support team needs a weekly forecast of ticket volume for the next three months to plan staffing. How
      would you build it, check it's any good, and explain its error to them?
    expected_concepts:
      - understanding trend, weekly and seasonal patterns
      - known drivers such as customer growth or product launches
      - a simple baseline such as seasonal naive to beat
      - backtesting on held-out past periods
      - error expressed in tickets or staff hours
      - updating the forecast as actuals arrive
    rubric:
      excellent: Explores trend, seasonality and drivers, compares a candidate model against a simple baseline with backtesting, expresses accuracy in staffing terms with a range, and sets up a refresh process.
      good: Builds a reasonable seasonal forecast and validates it on past data.
      weak: Extends the recent average forward without validation or error measures.
    followups:
      - A big product launch is planned for month two. How do you include it?
      - Which error measure would you use, and why?
    common_errors:
      - Evaluating the forecast on the same data it was fitted to.
