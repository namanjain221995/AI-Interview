# Curated questions: UX / UI designer (part 2 of 4).
# Information architecture, interaction design, forms and content, visual hierarchy, prototyping,
# complex product patterns and design ethics.
# `defaults` are merged into every question (question keys win). Easy questions run in
# technical_screening and combined rounds; hard questions in deep_technical and combined.
version: 1
defaults:
  role_tags: [ux_designer]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.ux_designer.card_sort_navigation
    competency_key: ux_design
    topic: Card sorting for navigation design
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me about a time you used card sorting, or a similar exercise, to shape a site's navigation. How
      did you set it up and what did you do with the results?
    expected_concepts:
      - open versus closed card sorts and when to use each
      - choosing representative content cards
      - looking at similarity and agreement across participants
      - translating groups into categories and labels
      - validating the structure afterwards, for example with tree testing
    rubric:
      excellent: Explains why they chose an open or closed sort, how the cards were selected, how they analysed agreement rather than copying one participant, and how the structure was validated afterwards.
      good: Ran a card sort and used the groupings sensibly to inform the navigation.
      weak: Describes the exercise vaguely or treats the raw groups as the final navigation.
    followups:
      - What did you do with cards that participants placed in many different groups?
    common_errors:
      - Using internal team or department names as cards, which biases the groupings toward the org chart.

  - external_key: technical.ux_designer.beyond_happy_path_states
    competency_key: ux_design
    topic: Designing empty, loading and error states
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you design a screen, which states do you design beyond the ideal case with perfect data, and how
      do you make sure none of them get forgotten before development?
    expected_concepts:
      - empty and first-use states
      - loading and partial-loading states
      - error, offline and permission states
      - extreme content such as very long names or many items
      - a checklist or state inventory shared with engineering
    rubric:
      excellent: Lists a full range of states with examples of good design for each, and describes a repeatable way such as a state checklist or annotated specs to make sure they are covered.
      good: Covers empty, loading and error states with sensible examples.
      weak: Designs only the populated ideal screen and leaves other states to developers.
    followups:
      - Show me how you'd design the empty state for a new user's project list.
    common_errors:
      - Using a generic "Something went wrong" for every error without telling users what to do next.

  - external_key: technical.ux_designer.prototype_fidelity_choice
    competency_key: ux_design
    topic: Choosing prototype fidelity
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide whether to sketch on paper, build a clickable wireframe or make a high-fidelity
      prototype? Give me an example of when you picked each.
    expected_concepts:
      - matching fidelity to the question being answered
      - low fidelity for exploring concepts and flows quickly
      - high fidelity for detailed interaction, visual or content questions
      - cost of building and willingness to throw work away
      - how fidelity affects the feedback people give
    rubric:
      excellent: Links fidelity choices to the question and audience, gives concrete examples of each, and notes how polished prototypes can shut down useful critique.
      good: Explains low versus high fidelity trade-offs with an example.
      weak: Always builds high-fidelity prototypes or cannot explain why fidelity matters.
    followups:
      - When did a prototype's polish mislead stakeholders about how finished the work was?
    common_errors:
      - Polishing visuals before the flow has been validated.

  - external_key: technical.ux_designer.long_form_abandonment
    competency_key: ux_design
    topic: Reducing friction in long forms
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An insurance quote form has around thirty fields and lots of people abandon it halfway. How would you
      go about redesigning it?
    expected_concepts:
      - questioning whether every field is needed at this point
      - grouping and splitting into logical steps with progress
      - smart defaults, prefill and conditional questions
      - clear labels, inline validation and helpful errors
      - measuring where people drop off before and after
    rubric:
      excellent: Starts by challenging which fields are needed and when, proposes concrete structural and field-level improvements, and plans to measure field-level drop-off before and after.
      good: Suggests sensible improvements such as steps, grouping and better validation.
      weak: Only restyles the form or splits it into steps without addressing the content.
    followups:
      - Who would you need to talk to in order to remove fields?
      - How would you handle a question that users often don't know the answer to?
    common_errors:
      - Splitting a form into many steps without reducing the effort, which hides length rather than removing it.

  - external_key: technical.ux_designer.cluttered_screen_hierarchy
    competency_key: ux_design
    topic: Fixing visual hierarchy on a cluttered screen
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You're handed an account overview screen where everything is bold, coloured and competing for
      attention, and users say they can't find what matters. How would you approach fixing it?
    expected_concepts:
      - identifying the primary user tasks and information
      - using size, weight, contrast and spacing to rank elements
      - grouping related content and removing or demoting the rest
      - consistent use of colour for meaning
      - checking the result with quick tests such as first-click or five-second tests
    rubric:
      excellent: Starts from user priorities, explains specific hierarchy techniques and why, removes or demotes content rather than restyling everything, and checks the outcome with users.
      good: Applies sensible hierarchy principles and simplifies the layout.
      weak: Focuses on making it look nicer without deciding what matters most.
    followups:
      - How would you handle a stakeholder who insists their banner stays prominent?
    common_errors:
      - Adding more emphasis to the important item instead of reducing emphasis everywhere else.

  - external_key: technical.ux_designer.error_message_writing
    competency_key: ux_design
    topic: Writing helpful error messages and microcopy
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you approach writing error messages and other small pieces of interface text? Tell me about a
      message you improved and why the new version worked better.
    expected_concepts:
      - saying what happened in plain language
      - telling the user how to fix it
      - avoiding blame and technical jargon
      - placing the message near the problem
      - working with content designers and keeping terminology consistent
    rubric:
      excellent: Gives a concrete before and after, explains the principles behind the change, and mentions consistency, placement and collaboration with content or engineering.
      good: Knows the basics of clear, actionable messages and gives an example.
      weak: Treats copy as filler or leaves wording to developers.
    followups:
      - How do you get accurate error causes from engineering so the message can be specific?
    common_errors:
      - Showing raw system error codes to users with no explanation or next step.

  - external_key: technical.ux_designer.desktop_to_mobile_flow
    competency_key: ux_design
    topic: Adapting a flow for small screens
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      You have a desktop workflow with a big table and a side panel for editing details. How would you adapt
      it for a phone?
    expected_concepts:
      - understanding which tasks people actually do on mobile
      - prioritising content and actions for small screens
      - list and detail patterns instead of wide tables
      - touch target size and thumb reach
      - keeping data and behaviour consistent across devices
    rubric:
      excellent: Starts from mobile use cases, proposes concrete patterns such as list-detail views with clear trade-offs, and addresses touch, reach and consistency.
      good: Proposes reasonable responsive changes for the table and panel.
      weak: Shrinks the desktop layout or relies on horizontal scrolling for everything.
    followups:
      - Which tasks would you deliberately leave out of the mobile version?
    common_errors:
      - Assuming mobile users want exactly the same tasks as desktop users.

  - external_key: technical.ux_designer.flows_before_screens
    competency_key: ux_design
    topic: Mapping user flows before screens
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Before you start drawing screens, how do you map out the flow of a feature? Walk me through how you did
      that on a recent project.
    expected_concepts:
      - starting from user goals and entry points
      - mapping steps, decisions and branches
      - including error paths and exits
      - reviewing the flow with product and engineering early
      - using the flow to spot unnecessary steps
    rubric:
      excellent: Describes a concrete flow-mapping practice that covers entry points, branches and error paths, and shows how it surfaced problems or simplifications before screens were designed.
      good: Maps the main path and some branches before designing screens.
      weak: Goes straight to high-fidelity screens and discovers flow problems later.
    followups:
      - What did the flow reveal that you would have missed if you had started with screens?
    common_errors:
      - Mapping only the main path and forgetting how users arrive and leave.

  # ---------------------------------------------------------------- medium
  - external_key: technical.ux_designer.tree_testing_labels
    competency_key: ux_design
    topic: Validating navigation with tree testing
    difficulty: medium
    kind: technical
    text: >-
      You've drafted a new navigation structure for a help centre. How would you check that people can
      actually find things in it before anyone builds it?
    expected_concepts:
      - tree testing with realistic findability tasks
      - success rate, directness and time per task
      - analysing where people first go wrong
      - comparing against the current structure as a baseline
      - iterating on labels and grouping
    rubric:
      excellent: Describes a well-designed tree test with realistic tasks and a baseline, interprets success, directness and first-click data, and explains how they would iterate labels and structure.
      good: Proposes tree testing or a similar method with sensible tasks.
      weak: Asks stakeholders whether the navigation looks right.
    followups:
      - How would you write a task without giving away the label you're testing?
    common_errors:
      - Writing tasks that use the exact words of the target label.

  - external_key: technical.ux_designer.wide_data_table
    competency_key: ux_design
    topic: Designing complex data tables
    difficulty: medium
    kind: scenario
    text: >-
      Operations analysts use a table with forty columns and thousands of rows every day, and they keep
      exporting to a spreadsheet because the product's table is hard to work with. How would you approach
      redesigning it?
    expected_concepts:
      - observing what analysts do after they export
      - column choice, ordering, saved views and pinning
      - sorting, filtering and search that match their tasks
      - density options, readable numbers and alignment
      - bulk actions and performance with large data
    rubric:
      excellent: Uses the export behaviour as a research signal, designs table features matched to observed tasks, considers density, performance and bulk actions, and plans how to measure reduced exports.
      good: Proposes sensible table features such as filtering, column control and saved views.
      weak: Makes visual changes without understanding why people export.
    followups:
      - How would you decide whether to support editing inside the table?
    common_errors:
      - Trying to prevent exports instead of learning what the spreadsheet does better.

  - external_key: technical.ux_designer.destructive_action_patterns
    competency_key: ux_design
    topic: Confirmations versus undo for destructive actions
    difficulty: medium
    kind: technical
    text: >-
      How do you decide between a confirmation dialog, an undo option or some other safeguard when users can
      delete or overwrite something important?
    expected_concepts:
      - severity and reversibility of the action
      - confirmation fatigue when dialogs are overused
      - undo and soft-delete for common reversible actions
      - stronger friction such as typing a name for irreversible bulk actions
      - clear wording that names what will be lost
    rubric:
      excellent: Matches the safeguard to severity and frequency, explains confirmation fatigue, gives examples of undo, soft delete and strong friction, and covers precise wording.
      good: Distinguishes between reversible and irreversible actions with appropriate patterns.
      weak: Uses an "Are you sure?" dialog for everything.
    followups:
      - What does engineering need to build to support undo properly?
    common_errors:
      - Confirmation buttons labelled only "OK" and "Cancel" that don't say what will happen.

  - external_key: technical.ux_designer.catalogue_search_filters
    competency_key: ux_design
    topic: Search and filtering for a large catalogue
    difficulty: medium
    kind: scenario
    text: >-
      An online store has fifty thousand products and customers say they can't find what they want. How
      would you approach the search and filtering experience?
    expected_concepts:
      - analysing search logs, zero-result queries and refinements
      - facets that match how customers think about products
      - autocomplete, spelling tolerance and synonyms with engineering
      - showing applied filters and easy reset
      - mobile filter patterns and result counts
    rubric:
      excellent: Starts from search and behaviour data, designs facets and query assistance matched to customer language, handles filter visibility and mobile, and works with engineering on relevance.
      good: Proposes useful filtering and search improvements.
      weak: Focuses only on the look of the search box or adds every attribute as a filter.
    followups:
      - What would zero-result searches tell you, and how would you design that page?
    common_errors:
      - Building filters from the product database schema instead of customer vocabulary.

  - external_key: technical.ux_designer.notification_overload
    competency_key: ux_design
    topic: Designing a notification system
    difficulty: medium
    kind: scenario
    text: >-
      Users of a collaboration app complain they get too many notifications and have started turning them
      all off, so they miss important ones. How would you redesign the notification experience?
    expected_concepts:
      - auditing notification types, volume and value
      - prioritising by urgency and relevance to the user
      - batching, digests and smart defaults
      - granular but understandable settings
      - measuring opt-out rates and engagement with important alerts
    rubric:
      excellent: Audits the current system with data, introduces priority tiers, batching and better defaults, keeps settings understandable, and defines metrics for success.
      good: Suggests reducing volume and giving users more control.
      weak: Adds a large settings page and leaves users to sort it out.
    followups:
      - Who should decide whether a notification is urgent?
    common_errors:
      - Solving overload with ever more detailed settings that few people open.

  - external_key: technical.ux_designer.complex_tool_onboarding
    competency_key: ux_design
    topic: Onboarding into a complex product
    difficulty: medium
    kind: scenario
    text: >-
      New customers of an analytics product sign up but most never create their first report. How would you
      design onboarding to get them to real value faster?
    expected_concepts:
      - defining the activation moment that predicts retention
      - finding where new users get stuck
      - sample data, templates and guided first tasks
      - showing help in context rather than long tours
      - measuring time to first value and activation
    rubric:
      excellent: Defines activation using data, diagnoses blockers, designs onboarding around a meaningful first success with templates or sample data, and measures time to value.
      good: Proposes a guided first-run experience with sensible elements.
      weak: Adds a product tour of every feature.
    followups:
      - What would you do for users who arrive without any data of their own yet?
    common_errors:
      - Long upfront tours that users skip and forget.

  - external_key: technical.ux_designer.realistic_prototype_data
    competency_key: ux_design
    topic: Building realistic prototypes for testing
    difficulty: medium
    kind: technical
    text: >-
      What do you do to make a prototype realistic enough that a usability test gives you trustworthy
      results? Tell me about a prototype where this mattered.
    expected_concepts:
      - realistic content and data instead of placeholder text
      - personalising data to the participant's context when useful
      - supporting the paths participants are likely to take
      - handling dead ends without breaking the session
      - choosing tools or coded prototypes for complex interactions
    rubric:
      excellent: Explains how unrealistic content distorts results, gives specific techniques for realistic data and paths, and describes choosing tools based on the interactions being tested.
      good: Uses realistic content and covers the main paths.
      weak: Tests prototypes full of placeholder text and single happy-path links.
    followups:
      - When have you built a coded prototype instead of using a design tool?
    common_errors:
      - Testing with neat sample data that hides how real, messy content breaks the layout.

  - external_key: technical.ux_designer.merge_two_navigations
    competency_key: ux_design
    topic: Merging two products' information architecture
    difficulty: medium
    kind: scenario
    text: >-
      Your company has acquired a competitor, and leadership wants the two products combined into one
      navigation within six months. Each has loyal users and different terminology. How would you approach
      the information architecture?
    expected_concepts:
      - auditing content and features of both products
      - understanding each user base's mental model and vocabulary
      - deciding shared terminology with evidence
      - testing the combined structure with both groups
      - a migration plan with communication and wayfinding for existing users
    rubric:
      excellent: Plans a content audit and research with both user groups, resolves terminology with evidence, tests the merged structure, and designs a transition that helps existing users find familiar things.
      good: Proposes auditing both products and testing a merged structure.
      weak: Picks one product's navigation and bolts the other on.
    followups:
      - How would you decide which product's term wins when they name the same thing differently?
    common_errors:
      - Organising the merged navigation around the two former companies instead of user tasks.

  - external_key: technical.ux_designer.design_for_localisation
    competency_key: ux_design
    topic: Designing for multiple languages
    difficulty: medium
    kind: technical
    text: >-
      Your product is launching in German, Japanese and Arabic. What changes in how you design screens and
      components so they work in all of those languages?
    expected_concepts:
      - text expansion and flexible layouts
      - right-to-left mirroring and which elements should not flip
      - date, number, currency and name formats
      - avoiding text in images and concatenated strings
      - testing with real translations or pseudo-localisation
    rubric:
      excellent: Covers expansion, right-to-left layouts with nuance about what mirrors, locale formats, string handling and testing with real translations, with examples from components.
      good: Mentions text expansion and right-to-left support with some practical design changes.
      weak: Assumes translation is only a content task with no design impact.
    followups:
      - Which icons would you mirror for right-to-left and which would you leave alone?
    common_errors:
      - Designing fixed-width buttons that only fit the English label.

  - external_key: technical.ux_designer.cancellation_dark_pattern
    competency_key: product_sense
    topic: Pushback on manipulative design
    difficulty: medium
    kind: scenario
    text: >-
      A product manager asks you to make subscription cancellation harder, with extra screens and a hidden
      cancel link, to improve retention numbers. How would you respond?
    expected_concepts:
      - recognising the request as a manipulative pattern
      - legal and regulatory risk around cancellation
      - long-term trust, complaints and chargebacks
      - proposing fair retention options such as pause or downgrade
      - understanding why customers cancel through research
    rubric:
      excellent: Pushes back clearly with business, legal and user arguments, proposes concrete fair alternatives that address the retention goal, and suggests researching cancellation reasons.
      good: Raises concerns and suggests some fair retention ideas.
      weak: Builds the hidden flow as asked or refuses without offering any alternative.
    followups:
      - What would you do if the PM insisted after hearing your concerns?
    common_errors:
      - Treating the request as only a design problem and ignoring legal exposure.

  - external_key: technical.ux_designer.decision_dashboard
    competency_key: ux_design
    topic: Designing dashboards for decisions
    difficulty: medium
    kind: technical
    text: >-
      When you design a dashboard, how do you decide what goes on it and how it's laid out? Walk me through a
      dashboard you designed and the decisions it was meant to support.
    expected_concepts:
      - starting from users' decisions and questions
      - a small set of key metrics with context such as targets or trends
      - layout from summary to detail
      - appropriate chart types and consistent definitions
      - paths from an alert or anomaly to action
    rubric:
      excellent: Ties every element to a decision, explains layout and chart choices, adds context and drill-down, and shows how the dashboard was evaluated in use.
      good: Designs a focused dashboard with sensible metrics and layout.
      weak: Includes every available metric with no hierarchy or clear purpose.
    followups:
      - How did you find out which metrics people actually looked at?
    common_errors:
      - Showing numbers with no comparison, so users can't tell whether a value is good or bad.

  # ------------------------------------------------------------------ hard
  - external_key: technical.ux_designer.legacy_workflow_redesign
    competency_key: ux_design
    topic: Redesigning a legacy expert workflow
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Claims handlers use a fifteen-year-old internal tool for eight hours a day. It's ugly, but they are
      very fast with it because of keyboard shortcuts and memorised layouts. Leadership wants it redesigned.
      How would you approach this?
    expected_concepts:
      - measuring current task times and error rates as a baseline
      - observing expert habits such as shortcuts and scanning patterns
      - preserving efficiency and muscle memory where it matters
      - incremental rollout versus big-bang replacement
      - involving handlers in testing and transition support
    rubric:
      excellent: Treats expert efficiency as a requirement, sets measurable baselines, protects keyboard-driven workflows, plans an incremental rollout with expert involvement, and explains how to judge success.
      good: Researches current use and plans to keep key efficiencies while modernising.
      weak: Focuses on visual modernisation and assumes a cleaner interface will be faster.
    followups:
      - How would you handle a period when old and new tools run side by side?
      - What would make you stop the rollout?
    common_errors:
      - Measuring success by satisfaction with the new look while task times get worse.

  - external_key: technical.ux_designer.cross_platform_consistency
    competency_key: ux_design
    topic: Consistency across web, iOS and Android
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How do you keep a product feeling consistent across web, iOS and Android while still respecting each
      platform's conventions? Tell me where you drew that line on a real product.
    expected_concepts:
      - consistency of concepts, terminology and flows versus platform-native controls
      - following platform guidance for navigation, gestures and system components
      - shared design tokens with platform-specific components
      - feature parity decisions and release coordination
      - testing with users of each platform
    rubric:
      excellent: Explains a clear principle for what stays consistent and what goes native, gives concrete examples of decisions, and covers tokens, parity and coordination across teams.
      good: Understands the tension and gives reasonable examples of following platform conventions.
      weak: Makes every platform look identical or lets each drift apart with no shared basis.
    followups:
      - Which pattern caused the most debate between platform teams, and how was it settled?
    common_errors:
      - Copying iOS patterns onto Android, or the other way round, because the designer only uses one platform.

  - external_key: technical.ux_designer.content_ia_at_scale
    competency_key: ux_design
    topic: Information architecture for a large content estate
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Imagine a company website with eight thousand pages, several audiences and content owned by many
      teams. Findability is poor and pages keep multiplying. How would you go about fixing the information
      architecture?
    expected_concepts:
      - content inventory and audit with analytics
      - audience and task research to define top tasks
      - a structure and metadata model or taxonomy
      - governance on who can publish and how content is retired
      - phased migration and measuring findability
    rubric:
      excellent: Combines audit, research and taxonomy work, addresses the governance problem that causes page sprawl, plans a phased migration, and defines how findability will be measured.
      good: Proposes an audit and a new structure tested with users.
      weak: Redesigns the top navigation without dealing with content or governance.
    followups:
      - How would you get dozens of content owners to delete pages?
    common_errors:
      - Fixing the menu while the underlying content keeps growing without ownership.

  - external_key: technical.ux_designer.ai_feature_uncertainty
    competency_key: ux_design
    topic: Designing for uncertain AI output
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team is adding an AI assistant that drafts replies to customer support tickets. The drafts are
      usually good but sometimes wrong in subtle ways. How would you design the interaction?
    expected_concepts:
      - keeping the agent in control with review before sending
      - making it easy to edit, regenerate or discard
      - showing sources or reasoning to support verification
      - signalling uncertainty without overwhelming the user
      - feedback loops and measuring edit rate and errors
    rubric:
      excellent: Designs for human review and correction, supports verification with sources, handles uncertainty and failure modes thoughtfully, and defines metrics and feedback loops.
      good: Keeps humans in the loop with editable drafts and some feedback mechanism.
      weak: Designs as if the AI output is always correct or auto-sends drafts.
    followups:
      - How would you stop agents from approving drafts without reading them?
    common_errors:
      - Treating a single disclaimer as enough to manage wrong outputs.

  - external_key: technical.ux_designer.tradeoff_rationale
    competency_key: ux_design
    topic: Explaining design trade-offs
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Tell me about a design decision you made where there was no clearly right answer. What options did you
      consider, how did you weigh them, and how did you explain the choice to the team?
    expected_concepts:
      - clearly framed options with pros and cons
      - criteria based on user goals, business goals and constraints
      - evidence used to weigh options
      - documenting the decision and its rationale
      - planning how to revisit it if assumptions prove wrong
    rubric:
      excellent: Presents a genuinely difficult trade-off, explains explicit criteria and evidence, shows how the rationale was recorded and communicated, and describes how the decision would be revisited.
      good: Describes a real decision with sensible reasoning and options.
      weak: Describes a choice based on personal taste or cannot name the alternatives considered.
    followups:
      - Did the decision hold up after launch?
    common_errors:
      - Presenting only the chosen option so others can't evaluate the reasoning.

  - external_key: technical.ux_designer.collaborative_editing_conflicts
    competency_key: ux_design
    topic: Interaction design for real-time collaboration
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're designing a shared planning document where several people edit at the same time, sometimes with
      a patchy connection. How would you design presence, editing and conflict handling so people trust it?
    expected_concepts:
      - showing who is present and where they are working
      - clear save and sync status including offline
      - preventing conflicts where possible, such as locking or field-level merging
      - understandable conflict resolution when it happens
      - version history and restore
    rubric:
      excellent: Designs presence, sync status and conflict prevention with awareness of technical options, makes conflict resolution and history understandable, and plans testing under poor connectivity.
      good: Covers presence indicators, sync state and version history.
      weak: Ignores conflicts or assumes the last save simply wins without telling users.
    followups:
      - What would you need to agree with engineering about how merging works?
    common_errors:
      - Silently overwriting someone's changes so trust is lost the first time it happens.
