# Curated questions: network engineering (part 2 of 4) — DNS, DHCP, NAT, load balancing,
# proxies, HTTP versions and global traffic steering.
# `defaults` are merged into every question (question keys win). Medium is the default
# difficulty band; easy and hard questions override round_types.
version: 1
defaults:
  role_tags: [network]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.network.first_time_lookup
    competency_key: networking
    topic: Recursive DNS resolution
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Explain, step by step, what happens when a laptop on your network looks up a hostname it has never
      resolved before.
    expected_concepts:
      - stub resolver and local cache
      - configured recursive resolver
      - root, TLD and authoritative servers
      - referrals and the final answer
      - caching according to TTL at each layer
    rubric:
      excellent: Describes the full chain from stub resolver to authoritative answer, explains referrals and caching, and notes where it commonly breaks.
      good: Describes the resolver walking from root to authoritative server with minor gaps.
      weak: Thinks the laptop queries the authoritative server directly or cannot describe caching.
    followups:
      - Where would you look if one laptop gets a different answer than everyone else?
      - What role does the hosts file play?
    common_errors:
      - Leaving out caching at the recursive resolver.

  - external_key: technical.network.dns_record_choice
    competency_key: networking
    topic: Working with DNS record types
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Tell me about the DNS record types you work with most, and describe a situation where the wrong
      record or a badly set one caused a problem.
    expected_concepts:
      - A and AAAA records
      - CNAME and its restriction at the zone apex
      - MX, TXT and SRV uses
      - PTR records for reverse lookups
      - TTL as part of the record
    rubric:
      excellent: Explains the common types with their real uses and gives a concrete incident, such as a CNAME at the apex, a missing PTR breaking mail or a stale TTL delaying a fix.
      good: Explains the common types correctly with a generic example.
      weak: Can only name A records or confuses record purposes.
    followups:
      - Why can't you normally put a CNAME at the root of a domain?
      - Which systems care about reverse DNS, and why?
    common_errors:
      - Placing a CNAME alongside other records for the same name.

  - external_key: technical.network.dns_cutover_plan
    competency_key: networking
    topic: Planning a DNS cutover
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You need to move a public website to a new IP address next week with as little disruption as
      possible. How would you plan the DNS side of the change?
    expected_concepts:
      - lowering the TTL well before the change
      - keeping the old address serving during propagation
      - verifying answers from several resolvers
      - restoring a normal TTL afterwards
      - rollback by pointing back to the old address
    rubric:
      excellent: Plans the TTL reduction ahead of time, keeps both sites working during the overlap, verifies from multiple vantage points and has a rollback.
      good: Knows to lower the TTL and verify, but misses running both addresses in parallel.
      weak: Simply changes the record and expects everyone to switch immediately.
    followups:
      - Some clients still hit the old address a day later. Why?
      - How would you verify the change from outside your network?
    common_errors:
      - Lowering the TTL at the same moment as the change, which has no effect on cached answers.

  - external_key: technical.network.vlan_no_dhcp_leases
    competency_key: network_engineering
    topic: Clients not getting DHCP addresses
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Users on one VLAN suddenly can't get an IP address, while every other VLAN is fine. How would you
      track down the cause?
    expected_concepts:
      - DHCP relay or helper address on the VLAN interface
      - scope exhaustion on the server
      - server reachability from the relay
      - DHCP snooping trust settings on uplinks
      - checking with a capture for discover and offer messages
    rubric:
      excellent: Follows the discover, offer, request, acknowledge exchange to find where it stops, and checks relay configuration, scope usage and snooping trust in a logical order.
      good: Checks the relay and the scope but without a clear method for finding where the exchange fails.
      weak: Suggests giving users static addresses as the fix.
    followups:
      - The scope is full of leases from devices you don't recognise. What now?
      - What changes when the DHCP server is in a different subnet?
    common_errors:
      - Forgetting that the relay must be configured on the VLAN's gateway interface.

  - external_key: technical.network.lb_method_selection
    competency_key: networking
    topic: Choosing a load-balancing method
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you choose a load-balancing method, such as round robin, least connections or hashing, for a
      particular service? Give me examples where each one made sense.
    expected_concepts:
      - round robin for similar short requests
      - least connections for long or uneven requests
      - hashing for cache affinity or stickiness
      - weights for uneven backend capacity
      - effect of long-lived connections on balance
    rubric:
      excellent: Matches methods to traffic patterns with concrete examples and explains failure modes such as long-lived connections skewing round robin.
      good: Describes each method correctly with at least one example.
      weak: Treats all methods as equivalent.
    followups:
      - What happens to a hashed distribution when a backend is added?
      - How do long-lived websocket connections affect your choice?
    common_errors:
      - Ignoring that connections, not requests, are often what gets balanced.

  - external_key: technical.network.backend_check_design
    competency_key: networking
    topic: Designing backend health checks
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What makes a good health check for servers behind a load balancer, and what goes wrong when the check
      is too shallow or too deep?
    expected_concepts:
      - port check versus application endpoint
      - shallow checks keep broken servers in rotation
      - deep checks on shared dependencies remove every server at once
      - intervals and failure thresholds
      - fail-open behaviour when all backends fail
    rubric:
      excellent: Explains the trade-off clearly with an example of each failure mode and describes sensible thresholds and what happens when every backend is marked down.
      good: Prefers application-level checks over port checks with a reasonable explanation.
      weak: Thinks a successful TCP connection proves the service is healthy.
    followups:
      - A database outage marked every web server unhealthy. How would you have avoided that?
      - How quickly should a failed backend be removed?
    common_errors:
      - Checking shared dependencies in every server's health endpoint.

  - external_key: technical.network.published_service_unreachable
    competency_key: network_engineering
    topic: Inbound NAT and published services
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A partner says they can't reach a service you published through the firewall with a port forward,
      although it works from inside your network. How would you work through it?
    expected_concepts:
      - destination NAT rule and matching security policy
      - firewall logs or session table for the partner's traffic
      - server's default gateway and return path
      - testing from an external vantage point
      - partner-side or ISP filtering
    rubric:
      excellent: Confirms whether traffic arrives, checks the NAT and policy match, verifies the return path through the same firewall and tests from outside before blaming the partner.
      good: Checks the NAT and firewall rules but not the return path.
      weak: Asks the partner to fix their side without gathering any evidence.
    followups:
      - Why does testing from inside your own network not prove much here?
      - What would the server's routing have to do with it?
    common_errors:
      - Forgetting that replies must return through the device that did the translation.

  - external_key: technical.network.forward_and_reverse_proxies
    competency_key: networking
    topic: Forward versus reverse proxies
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      Explain the difference between a forward proxy and a reverse proxy, and describe where you've used
      each one in a network.
    expected_concepts:
      - forward proxy acts for clients reaching outside
      - reverse proxy acts for servers receiving requests
      - content filtering and egress control
      - TLS termination, caching and routing at a reverse proxy
      - explicit versus transparent proxying
    rubric:
      excellent: Distinguishes the two by whose behalf they act, gives real deployments of each, and explains operational details such as explicit configuration or TLS handling.
      good: Correctly distinguishes them with a basic example of each.
      weak: Confuses the two or can only describe one.
    followups:
      - How do clients find a forward proxy?
      - What problems does a transparent proxy cause for HTTPS?
    common_errors:
      - Describing a load balancer and a reverse proxy as unrelated concepts.

  # ---------------------------------------------------------------- medium
  - external_key: technical.network.split_horizon_dns
    competency_key: networking
    topic: Split-horizon DNS
    difficulty: medium
    kind: technical
    text: >-
      How would you set up DNS so internal users resolve a service to a private address while external
      users get the public one, and what pitfalls have you run into with that setup?
    expected_concepts:
      - separate internal and external views or zones
      - keeping records in sync between views
      - VPN users and which view they get
      - DNSSEC and validation complications
      - debugging by checking which resolver answered
    rubric:
      excellent: Describes a working implementation and specific pitfalls such as drift between views, remote users getting the wrong answer and confusing troubleshooting.
      good: Explains the concept and one implementation without many pitfalls.
      weak: Proposes editing hosts files or cannot explain how different clients get different answers.
    followups:
      - How do you prevent the internal and external records drifting apart?
      - A laptop on VPN gets the public address. Why might that be?
    common_errors:
      - Forgetting that the internal zone must contain every record, not just the overridden ones.

  - external_key: technical.network.intermittent_name_failures
    competency_key: networking
    topic: Intermittent DNS resolution failures
    difficulty: medium
    kind: scenario
    text: >-
      Some users report that a website fails to load every few attempts, and you trace it to name
      resolution. What could cause intermittent resolution failures, and how would you prove which one it
      is?
    expected_concepts:
      - one of several configured resolvers failing
      - one authoritative server returning stale or wrong data
      - truncated responses and TCP fallback blocked
      - firewall dropping large UDP or fragmented responses
      - querying each resolver and authoritative server directly
    rubric:
      excellent: Builds hypotheses around individual resolvers, authoritative servers and response size, and tests each directly with targeted queries.
      good: Suspects a bad resolver or server and knows to query them individually.
      weak: Flushes caches and hopes without isolating the cause.
    followups:
      - How would you check whether every authoritative server returns the same answer?
      - Why might only large responses fail?
    common_errors:
      - Testing only through the default resolver rather than each server.

  - external_key: technical.network.new_record_not_resolving
    competency_key: networking
    topic: Negative caching of new records
    difficulty: medium
    kind: scenario
    text: >-
      You created a new DNS record ten minutes ago, but some clients still say the name doesn't exist while
      others resolve it fine. Why, and what would you do about it?
    expected_concepts:
      - negative caching of NXDOMAIN answers
      - SOA minimum or negative TTL
      - clients that queried before the record existed
      - secondary servers not yet updated
      - flushing caches you control and waiting out the rest
    rubric:
      excellent: Explains negative caching and the SOA-derived TTL, checks serial numbers on secondaries, and gives a practical plan for the caches you control.
      good: Recognises caching as the cause but not specifically negative caching.
      weak: Recreates the record repeatedly or blames clients.
    followups:
      - How would you avoid this when launching a new service name?
      - How do you check whether all authoritative servers have the record?
    common_errors:
      - Assuming only positive answers are cached.

  - external_key: technical.network.sticky_sessions_tradeoffs
    competency_key: networking
    topic: Session persistence at the load balancer
    difficulty: medium
    kind: technical
    text: >-
      When does an application really need session persistence at the load balancer, and what are the
      trade-offs between cookie-based and source-address stickiness?
    expected_concepts:
      - server-side session state as the real driver
      - uneven load caused by stickiness
      - source address affinity breaking behind NAT
      - cookie persistence requiring layer 7 and TLS termination
      - failover losing sessions
      - moving state to a shared store instead
    rubric:
      excellent: Questions whether stickiness is needed, compares both methods with concrete failure modes such as large NAT pools, and proposes removing the dependency where possible.
      good: Explains both methods and at least one drawback of each.
      weak: Treats stickiness as a default with no downsides.
    followups:
      - A big customer sits behind one NAT address. What happens with source stickiness?
      - What happens to sticky users when their backend is drained?
    common_errors:
      - Not realising cookie persistence needs the load balancer to see HTTP.

  - external_key: technical.network.graceful_backend_removal
    competency_key: networking
    topic: Draining backends without errors
    difficulty: medium
    kind: scenario
    text: >-
      During deployments, users see errors every time a backend is taken out of the pool. How would you
      change the load balancer and server setup so maintenance stops dropping requests?
    expected_concepts:
      - connection draining or deregistration delay
      - failing the health check before shutdown
      - application handling termination signals gracefully
      - keep-alive and idle timeout alignment
      - retries for idempotent requests
    rubric:
      excellent: Describes the full sequence of removing from rotation, draining, then stopping, aligns timeouts, and checks that the application finishes in-flight work.
      good: Mentions connection draining and health checks but misses timeout alignment or application behaviour.
      weak: Suggests deploying at night instead of fixing the mechanism.
    followups:
      - How long should the drain period be?
      - Why can idle timeout mismatches cause errors even without deployments?
    common_errors:
      - Stopping the process before the load balancer has stopped sending traffic.

  - external_key: technical.network.real_client_address
    competency_key: networking
    topic: Preserving the client IP through proxies
    difficulty: medium
    kind: technical
    text: >-
      Once traffic passes through a load balancer or proxy, how do backends learn the real client IP address,
      and what risks come with each approach?
    expected_concepts:
      - X-Forwarded-For and Forwarded headers
      - spoofed headers from untrusted sources
      - PROXY protocol for layer 4
      - transparent proxying or direct server return
      - trusting only known proxy addresses
    rubric:
      excellent: Compares header, PROXY protocol and transparent approaches, explains header spoofing and how to trust only known hops, and notes the logging and security consequences.
      good: Knows about X-Forwarded-For and the PROXY protocol.
      weak: Unaware that the backend sees the proxy's address by default.
    followups:
      - How would an attacker abuse a backend that trusts any forwarded header?
      - What breaks if one side expects the PROXY protocol and the other doesn't?
    common_errors:
      - Trusting the left-most forwarded address without validating the chain.

  - external_key: technical.network.nat_pool_exhaustion
    competency_key: network_engineering
    topic: Source NAT port exhaustion
    difficulty: medium
    kind: scenario
    text: >-
      Hundreds of internal servers share a small pool of public NAT addresses, and outbound calls to one
      popular API start failing at peak hours. Explain what's likely going on and how you'd fix it.
    expected_concepts:
      - ports per public address per destination
      - NAT translation table counters and drops
      - adding public addresses to the pool
      - connection reuse by applications
      - idle timeouts holding translations open
    rubric:
      excellent: Identifies per-destination port exhaustion, confirms it from translation counters, and combines more addresses, timeout tuning and application connection reuse.
      good: Identifies NAT exhaustion and suggests adding addresses.
      weak: Blames the external API without checking the NAT device.
    followups:
      - Why does the problem show up for one destination before others?
      - How would you monitor this before it causes an outage?
    common_errors:
      - Not realising the limit applies per destination address and port.

  - external_key: technical.network.http_versions_impact
    competency_key: networking
    topic: HTTP/2 and HTTP/3 on the network
    difficulty: medium
    kind: technical
    text: >-
      What changes for the network and for troubleshooting when services move from HTTP/1.1 to HTTP/2, or to
      HTTP/3 over QUIC?
    expected_concepts:
      - multiplexing many requests on one connection
      - head-of-line blocking at the TCP layer for HTTP/2
      - QUIC running over UDP port 443
      - firewalls blocking UDP and clients falling back
      - encrypted transport headers reducing visibility
      - load balancer and connection balancing effects
    rubric:
      excellent: Explains the protocol differences in terms of network behaviour and gives practical consequences for firewalls, load balancing and troubleshooting tools.
      good: Explains multiplexing and that QUIC uses UDP.
      weak: Cannot describe any network-level difference.
    followups:
      - Why might HTTP/3 traffic quietly fall back to HTTP/2 in a corporate network?
      - How does one long HTTP/2 connection affect load balancing?
    common_errors:
      - Forgetting UDP 443 needs to be allowed for QUIC.

  - external_key: technical.network.nearest_healthy_region
    competency_key: networking
    topic: Global traffic steering
    difficulty: medium
    kind: technical
    text: >-
      How would you route users to the nearest healthy region for a service deployed in several regions, and
      what limits how quickly failover actually happens?
    expected_concepts:
      - DNS-based global load balancing with health checks
      - geolocation or latency-based answers
      - TTL and resolver caching delaying failover
      - anycast as an alternative
      - resolver location versus user location
    rubric:
      excellent: Compares DNS steering and anycast, explains how TTLs, resolver caching and client behaviour bound failover time, and mentions health check design.
      good: Describes DNS-based steering with health checks and notes the TTL effect.
      weak: Assumes DNS changes take effect instantly for everyone.
    followups:
      - Some users are sent to a distant region. Why might that happen?
      - How would you test failover without a real outage?
    common_errors:
      - Ignoring clients and resolvers that hold answers longer than the TTL.

  - external_key: technical.network.unexpected_address_range
    competency_key: network_engineering
    topic: Rogue DHCP server
    difficulty: medium
    kind: scenario
    text: >-
      Several users on a floor are getting addresses from an unexpected range and can't reach anything. How
      would you find what's going on and stop it from happening again?
    expected_concepts:
      - rogue DHCP server, often a consumer router
      - finding the server's MAC from the offer
      - tracing the MAC through switch tables to a port
      - DHCP snooping with trusted uplinks
      - releasing and renewing affected clients
    rubric:
      excellent: Identifies a rogue server, traces it to a physical port from the offer's source, restores clients and enables DHCP snooping with correct trust settings.
      good: Suspects a rogue server and suggests DHCP snooping.
      weak: Reconfigures the clients manually without finding the source.
    followups:
      - How do you find the switch port when you only know a MAC address?
      - What else can DHCP snooping enable once it's on?
    common_errors:
      - Turning on snooping without marking the real server's path as trusted.

  - external_key: technical.network.subdomain_delegation
    competency_key: networking
    topic: DNS delegation
    difficulty: medium
    kind: technical
    text: >-
      Walk me through how you'd delegate a subdomain to a different DNS provider or team, and what usually
      breaks when delegation is done wrong.
    expected_concepts:
      - NS records in the parent zone
      - matching NS records in the child zone
      - glue records when name servers are inside the zone
      - lame delegation
      - DS records when DNSSEC is used
    rubric:
      excellent: Describes parent and child configuration, glue and DNSSEC implications, and recognisable failure symptoms such as lame delegation or validation failures.
      good: Knows to add NS records in the parent and configure the child.
      weak: Thinks a CNAME is how delegation works.
    followups:
      - How would you verify delegation from outside?
      - What happens if the parent has a DS record the child can't satisfy?
    common_errors:
      - Updating the child zone but not the parent.

  # ------------------------------------------------------------------ hard
  - external_key: technical.network.anycast_tradeoffs
    competency_key: networking
    topic: Anycast for DNS and edge services
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How does anycast work for something like DNS or a CDN edge, and what problems does it create for
      stateful protocols and for troubleshooting?
    expected_concepts:
      - same prefix announced from many sites
      - BGP choosing the nearest site by routing, not distance
      - route changes moving flows mid-connection
      - withdrawing routes when a site is unhealthy
      - identifying which site served a request
    rubric:
      excellent: Explains the mechanism and its reliance on routing policy, describes how path changes break long-lived TCP sessions, and explains health-driven withdrawal and debugging techniques.
      good: Explains the same address announced from many places and that BGP picks a site.
      weak: Confuses anycast with DNS geolocation or multicast.
    followups:
      - How do you work out which site a particular user is reaching?
      - Why is anycast easier for UDP-based DNS than for long TCP sessions?
    common_errors:
      - Assuming routing always reaches the geographically closest site.

  - external_key: technical.network.dnssec_rollout
    competency_key: networking
    topic: Rolling out DNSSEC
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your team wants to enable DNSSEC on the company's main domains. How would you roll it out safely, and
      how could a mistake take those domains offline?
    expected_concepts:
      - signing the zone before publishing DS at the registrar
      - key signing and zone signing keys
      - signature expiry and automated re-signing
      - key rollover procedures
      - validation failures causing resolution to fail completely
      - monitoring signatures and the chain of trust
    rubric:
      excellent: Orders the steps correctly, explains how validating resolvers fail closed, and plans for automated signing, key rollover and monitoring.
      good: Understands signing and DS records and that mistakes cause failures.
      weak: Treats DNSSEC as encryption or a simple checkbox.
    followups:
      - What happens if signatures expire over a weekend?
      - How would you move a signed zone to a new DNS provider?
    common_errors:
      - Believing DNSSEC encrypts DNS queries.

  - external_key: technical.network.massive_connection_scale
    competency_key: networking
    topic: Load balancing at very high connection counts
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      If you had to handle a few million concurrent connections for a public service, how would you design
      the load-balancing tiers, and where do the bottlenecks usually show up?
    expected_concepts:
      - ECMP from routers to a layer 4 tier
      - consistent hashing to keep flows stable
      - layer 7 tier behind layer 4
      - connection tracking and memory limits
      - direct server return
      - scaling and draining load balancer nodes
    rubric:
      excellent: Designs layered balancing with justified choices, identifies state, memory, ports and rehashing as the bottlenecks, and explains how to add capacity without breaking connections.
      good: Proposes multiple tiers and identifies some bottlenecks.
      weak: Proposes one bigger load balancer.
    followups:
      - What happens to existing connections when you add a layer 4 node?
      - Why might you avoid connection tracking on the first tier?
    common_errors:
      - Overlooking per-node state as the limiting factor.

  - external_key: technical.network.asymmetric_path_firewalls
    competency_key: network_engineering
    topic: Asymmetric routing through stateful firewalls
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      After adding a second internet link and a second firewall, some sessions hang at random while others
      work fine. You suspect asymmetric routing. How would you confirm it and fix it?
    expected_concepts:
      - stateful firewalls dropping traffic without a matching session
      - captures or session tables on both firewalls
      - outbound path selection versus inbound path
      - NAT tying return traffic to one device
      - state synchronisation or symmetric routing policy
    rubric:
      excellent: Proves asymmetry with session tables or captures from both paths, explains why stateful inspection drops it, and fixes it with routing policy, NAT design or a clustered firewall pair.
      good: Explains why asymmetric routing breaks stateful firewalls and suggests a reasonable fix.
      weak: Disables stateful inspection as the fix.
    followups:
      - Why do some sessions work while others hang?
      - What are the risks of synchronising state between the firewalls?
    common_errors:
      - Turning off state checks instead of fixing the path.

  - external_key: technical.network.authoritative_dns_resilience
    competency_key: networking
    topic: Resilient authoritative DNS
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you make an organisation's authoritative DNS resilient to both a provider outage and a large
      DDoS attack?
    expected_concepts:
      - multiple independent providers
      - keeping zones in sync through transfers or automation
      - anycast name servers
      - TTL choices balancing agility against cache protection
      - DNSSEC coordination across providers
      - testing failover of each provider
    rubric:
      excellent: Proposes a multi-provider design with reliable zone sync, explains how TTLs help ride out outages, and covers DNSSEC and feature differences between providers.
      good: Proposes a secondary provider and anycast.
      weak: Relies on one provider's availability promise.
    followups:
      - How do features like weighted records complicate multiple providers?
      - Why might longer TTLs actually help during an attack?
    common_errors:
      - Adding a second provider without automating record sync.

  - external_key: technical.network.ipv6_only_segments
    competency_key: network_engineering
    topic: IPv6-only networks reaching IPv4 services
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're planning to run some segments IPv6-only. How would hosts there still reach IPv4-only services,
      and what tends to break?
    expected_concepts:
      - NAT64 with DNS64
      - synthesised AAAA records
      - applications using literal IPv4 addresses
      - 464XLAT for client devices
      - DNSSEC interaction with synthesised records
      - logging and troubleshooting translated flows
    rubric:
      excellent: Explains NAT64 and DNS64 end to end, identifies literal addresses and old software as breakage, and covers mitigations and operational visibility.
      good: Names NAT64 and DNS64 and one source of breakage.
      weak: Thinks IPv6-only hosts can reach IPv4 natively.
    followups:
      - How would you find which applications break before you switch?
      - Why might DNSSEC validation fail with DNS64?
    common_errors:
      - Overlooking hard-coded IPv4 addresses in applications and configs.
