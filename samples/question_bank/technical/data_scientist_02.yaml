# Curated questions: data scientist, part 2 — experiment design and causal inference.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_scientist]
  competency_key: statistics_experimentation
questions:
  # ------------------------------------------------------------------ easy
  - external_key: technical.data_scientist.ab_test_from_scratch
    topic: Setting up an A/B test end to end
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A team wants to test a redesigned checkout page. Walk me through how you'd set up that experiment from
      the very beginning, before any data comes in.
    expected_concepts:
      - clear hypothesis and primary metric
      - randomisation unit and assignment
      - sample size and duration from baseline, minimum detectable effect and power
      - guardrail metrics
      - analysis plan and decision rule agreed in advance
    rubric:
      excellent: Covers hypothesis, metric, randomisation unit, sample size and duration, guardrails and a pre-agreed decision rule in a logical order, with reasoning tied to the checkout context.
      good: Covers the main steps including metric, randomisation and sample size.
      weak: Jumps straight to splitting traffic and comparing results without planning.
    followups:
      - How long would you run it, and why not stop as soon as it looks significant?
      - Which guardrail metrics matter most for a checkout change?
    common_errors:
      - Choosing the metric after seeing the results.

  - external_key: technical.data_scientist.primary_and_guardrail_metrics
    topic: Choosing primary and guardrail metrics
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You're testing a new onboarding flow for a mobile app. How would you choose the primary metric for the
      experiment, and which other metrics would you watch alongside it?
    expected_concepts:
      - primary metric tied to the goal of onboarding, such as activation
      - sensitive enough to move within the test window
      - guardrails such as crashes, latency, uninstalls or support contacts
      - secondary diagnostic metrics along the funnel
      - avoiding too many decision metrics
    rubric:
      excellent: Picks a measurable primary metric linked to long-term value, explains sensitivity trade-offs, and names specific guardrail and diagnostic metrics with a reason for each.
      good: Chooses a sensible primary metric and at least two guardrails.
      weak: Lists many metrics without a clear primary or picks something unrelated to onboarding.
    followups:
      - The metric you want is thirty-day retention, but the test can only run two weeks. What now?
      - How would you decide if a guardrail drop is acceptable?
    common_errors:
      - Choosing a vanity metric such as screens viewed that can rise without real value.

  - external_key: technical.data_scientist.why_randomize
    topic: Why randomisation matters
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A team proposes giving a new feature to the customers their account managers think will benefit most and
      comparing them with everyone else. Why would that comparison be hard to trust, and what does random
      assignment buy you?
    expected_concepts:
      - selection bias from hand-picked groups
      - groups differ in ways that also affect outcomes
      - randomisation balances known and unknown confounders on average
      - allows a causal interpretation of the difference
      - checking balance after assignment
    rubric:
      excellent: Explains how hand-picking introduces confounding with a concrete example, explains why randomisation balances unknown factors, and suggests a practical randomised design that still respects the account managers.
      good: Identifies selection bias and states that randomisation removes it on average.
      weak: Thinks the comparison is fine if the group is large.
    followups:
      - How would you check that randomisation actually worked?
      - The account managers refuse to let some customers miss out. What design could you propose?
    common_errors:
      - Believing randomisation guarantees perfect balance in every sample.

  - external_key: technical.data_scientist.test_duration_inputs
    topic: Deciding how long to run a test
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you decide how long an experiment needs to run? Tell me what goes into that decision and what
      you'd do if the answer came out too long.
    expected_concepts:
      - baseline rate and variance of the metric
      - minimum detectable effect that matters to the business
      - significance level and power
      - available traffic per day
      - covering full weekly cycles
    rubric:
      excellent: Names all the power analysis inputs, explains how each affects duration, adds weekly cycles and novelty considerations, and offers realistic options when duration is too long.
      good: Names most inputs and explains the role of minimum detectable effect.
      weak: Picks a fixed duration such as one week without reasoning.
    followups:
      - Halving the minimum detectable effect does what to the required sample size?
      - Why run full weeks even if you hit the sample size earlier?
    common_errors:
      - Setting the minimum detectable effect to whatever makes the test short, not to what matters.

  - external_key: technical.data_scientist.peeking_problem
    topic: Repeatedly checking results before the end
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      A stakeholder checks the experiment dashboard every morning and wants to stop the test the first day it
      shows a significant result. How would you explain why that's a problem?
    expected_concepts:
      - repeated looks inflate the false positive rate
      - random fluctuations cross the threshold by chance over time
      - fixed-horizon tests assume a single analysis
      - sequential testing methods allow valid early stopping
      - stopping early for harm via guardrails is different
    rubric:
      excellent: Explains the inflation intuitively, quantifies or illustrates it, distinguishes stopping for harm from stopping for success, and offers sequential testing as a principled alternative.
      good: Explains that repeated checking increases false positives and suggests waiting for the planned duration.
      weak: Agrees that stopping at the first significant result is fine.
    followups:
      - How would you still let them monitor the test without causing this problem?
      - When is it appropriate to stop a test early?
    common_errors:
      - Thinking peeking is fine as long as the final p-value is below the threshold.

  - external_key: technical.data_scientist.flat_result_next_steps
    topic: Communicating an inconclusive experiment
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      An experiment the team was excited about ended with no significant difference. What do you tell the team,
      and how do you help them decide what to do next?
    expected_concepts:
      - absence of evidence is not evidence of no effect
      - report the confidence interval and which effects are ruled out
      - check the test was healthy, for example sample ratio and exposure
      - consider whether the change was large enough to matter
      - decide based on cost, risk and learning, not only significance
    rubric:
      excellent: Uses the interval to explain what is and is not ruled out, checks test health, and helps the team reach a decision such as ship for other reasons, iterate or abandon.
      good: Explains that the result is inconclusive rather than negative and suggests a next step.
      weak: Declares the feature useless or suggests rerunning until it is significant.
    followups:
      - When would you ship a feature that didn't show a significant win?
      - How would you look for segments without fishing?
    common_errors:
      - Rerunning the same test hoping for a different answer.

  - external_key: technical.data_scientist.before_after_launch
    topic: Evaluating a launch without a control group
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      A feature was released to everyone, and the team compared the week before with the week after and saw a
      ten percent lift. What concerns would you raise, and how could they get a better estimate?
    expected_concepts:
      - seasonality, holidays and other launches confound the comparison
      - external events and marketing campaigns
      - a staggered rollout or holdout group for future launches
      - comparison series such as unaffected regions or platforms
      - longer pre-period to understand normal variation
    rubric:
      excellent: Names specific confounders, proposes a credible retrospective approach such as a comparison series, and recommends a holdout or staged rollout for future launches.
      good: Identifies seasonality or other confounders and suggests a control group next time.
      weak: Accepts the ten percent as the effect of the feature.
    followups:
      - What would you look at to know whether ten percent is outside normal week-to-week variation?
      - How small could a holdout group be and still be useful?
    common_errors:
      - Ignoring normal week-to-week variance when judging the lift.

  # ---------------------------------------------------------------- medium
  - external_key: technical.data_scientist.low_traffic_experiments
    topic: Experimenting with limited traffic
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your product has modest traffic and the power analysis says the test needs three months. The team can't
      wait that long. What options would you put in front of them?
    expected_concepts:
      - test bolder changes with larger expected effects
      - more sensitive or upstream proxy metrics
      - variance reduction with pre-experiment covariates
      - accept a higher significance level or lower power with explicit risk
      - sequential or Bayesian designs and qualitative research
    rubric:
      excellent: Offers several distinct options with their trade-offs, quantifies at least one, and helps the team choose based on the risk of a wrong decision.
      good: Proposes two or three reasonable options with some trade-off discussion.
      weak: Suggests running a shorter test and trusting whatever it shows.
    followups:
      - How would you validate that a proxy metric actually predicts the outcome you care about?
      - When is not running an experiment the right call?
    common_errors:
      - Lowering rigour silently instead of making the risk explicit to decision makers.

  - external_key: technical.data_scientist.sample_ratio_mismatch
    topic: Diagnosing a sample ratio mismatch
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You set up a fifty-fifty test, but after a week the treatment group has noticeably fewer users than
      control, and a chi-squared check says it's very unlikely by chance. What would you do?
    expected_concepts:
      - sample ratio mismatch invalidates the comparison
      - causes such as redirects, crashes, bot filtering or logging differences
      - checking assignment versus exposure logging
      - slicing by platform, browser or day to locate the issue
      - not trusting the metrics until the cause is fixed
    rubric:
      excellent: Treats the mismatch as a blocker, lists concrete root causes, describes how to localise the issue through slicing and logs, and explains why the treatment effect estimate is biased.
      good: Recognises the results cannot be trusted and names likely causes.
      weak: Reweights the groups and continues analysing.
    followups:
      - The mismatch only appears on one mobile app version. What does that suggest?
      - How would you prevent this from going unnoticed in future tests?
    common_errors:
      - Correcting the counts by weighting instead of finding why users are missing.

  - external_key: technical.data_scientist.randomization_unit_choice
    topic: Choosing the unit of randomisation
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How do you decide whether to randomise by user, by session, by page view or by something larger like a
      store or a city? Give me an example where the choice really mattered.
    expected_concepts:
      - consistency of the user experience
      - interference between units
      - more units give more power but may break independence
      - analysis unit should match or account for the randomisation unit
      - logged-out users and identity stitching
    rubric:
      excellent: Explains trade-offs between power, consistency and interference, ties the analysis method to the unit, and gives a concrete example of a choice and its consequences.
      good: Explains user versus session trade-offs and mentions interference.
      weak: Always randomises by user without considering alternatives or consequences.
    followups:
      - How would you analyse a metric defined per page view when you randomised by user?
      - What happens when the same person uses several devices?
    common_errors:
      - Computing variance as if page views were independent when users were randomised.

  - external_key: technical.data_scientist.novelty_and_primacy
    topic: Novelty and learning effects
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A new recommendation widget showed a big lift in the first week of a test, and the lift has been shrinking
      every day since. How would you figure out what the long-term effect is likely to be?
    expected_concepts:
      - novelty effect versus genuine improvement
      - plotting the effect over time and by days since first exposure
      - comparing new users with existing users
      - running longer or keeping a holdout
      - primacy effects in the opposite direction
    rubric:
      excellent: Separates calendar time from exposure time, uses new users as a cleaner signal, and proposes a longer run or holdout to estimate the steady-state effect.
      good: Identifies the novelty effect and suggests running longer.
      weak: Reports the average lift over the whole period as the long-term effect.
    followups:
      - How would you look at the effect for users who first saw the widget in week three?
      - What would a primacy effect look like in this data?
    common_errors:
      - Assuming the effect has stabilised because the cumulative average looks flat.

  - external_key: technical.data_scientist.variance_reduction_covariates
    topic: Variance reduction with pre-experiment data
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How can you use data from before an experiment started to get tighter results from the same amount of
      traffic? Explain how the method works and when it helps the most.
    expected_concepts:
      - adjusting the outcome using a pre-period covariate, as in CUPED or regression adjustment
      - variance reduction proportional to the correlation with the covariate
      - covariates must be unaffected by treatment
      - unbiased because assignment is random
      - limited benefit for new users without history
    rubric:
      excellent: Explains the adjustment mechanism and why it stays unbiased, relates the gain to correlation, and covers limitations such as new users and covariates affected by treatment.
      good: Describes CUPED or regression adjustment and why it reduces variance.
      weak: Confuses variance reduction with changing the hypothesis or uses post-treatment variables.
    followups:
      - What covariate would you use for a metric like weekly purchases?
      - What would go wrong if you used a covariate measured after the test started?
    common_errors:
      - Using covariates measured during the experiment, which can introduce bias.

  - external_key: technical.data_scientist.ratio_metric_variance
    topic: Analysing ratio metrics correctly
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You randomise by user but the metric is click-through rate, total clicks divided by total impressions.
      How would you compute the variance and the test properly?
    expected_concepts:
      - numerator and denominator are both random and correlated within users
      - treating impressions as independent understates variance
      - delta method for the ratio of means
      - bootstrap at the user level as an alternative
      - difference between mean of ratios and ratio of means
    rubric:
      excellent: Explains why impression-level variance is wrong, applies the delta method or user-level bootstrap correctly, and distinguishes ratio-of-means from mean-of-ratios with their meanings.
      good: Recognises the independence problem and proposes a user-level approach.
      weak: Runs a standard proportion test on impressions.
    followups:
      - Which of the two ratio definitions would you report to the business, and why?
      - What happens if treatment also changes the number of impressions?
    common_errors:
      - Ignoring that the treatment can change the denominator.

  - external_key: technical.data_scientist.conflicting_metrics
    topic: Deciding when metrics disagree
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      An experiment increased the primary metric, revenue per visitor, but a guardrail, customer support
      contacts, also went up significantly. How would you help the team decide whether to ship?
    expected_concepts:
      - quantify both effects in comparable business terms
      - investigate the mechanism behind the support increase
      - check whether the increase is temporary or structural
      - pre-agreed decision criteria and thresholds
      - options such as iterating to remove the harm before shipping
    rubric:
      excellent: Converts both effects into comparable costs, investigates why contacts rose, considers longer-term effects, and recommends a decision or iteration with clear reasoning.
      good: Weighs both metrics and looks into the cause of the guardrail movement.
      weak: Ships because the primary metric won or blocks automatically without analysis.
    followups:
      - How would you have set the guardrail threshold before the test?
      - Who should make the final call, and what do you bring to that meeting?
    common_errors:
      - Ignoring guardrails because they were not the primary metric.

  - external_key: technical.data_scientist.post_hoc_targeting
    topic: Shipping to the best-performing segment
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      After a test with a small overall lift, a product manager notices that new users on Android had a huge
      lift and wants to target the change at just that group. How would you evaluate whether that's a sound
      decision?
    expected_concepts:
      - post-hoc segment findings are prone to false positives
      - check whether the segment was pre-specified
      - interaction test rather than separate per-segment significance
      - plausible mechanism for the difference
      - confirm with a targeted follow-up experiment
    rubric:
      excellent: Explains why post-hoc segments mislead, tests the interaction properly, considers mechanism and sample size, and proposes a confirmatory experiment.
      good: Flags the multiple-comparison risk and suggests a follow-up test.
      weak: Supports targeting the segment based on the observed lift alone.
    followups:
      - How would you test whether the effect really differs between segments?
      - What would make you believe the segment result without a new test?
    common_errors:
      - Comparing significance in each segment instead of testing the difference between them.

  - external_key: technical.data_scientist.difference_in_differences
    topic: Difference-in-differences
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A new pricing policy was launched in one city but not in others, and you need to estimate its effect.
      How would you use a difference-in-differences approach, and what has to be true for it to work?
    expected_concepts:
      - compare the change in the treated city with the change in control cities
      - parallel trends assumption
      - checking pre-period trends visually and with placebo tests
      - other events affecting only the treated city
      - standard errors with few treated units
    rubric:
      excellent: Sets up the estimator correctly, explains and tests the parallel trends assumption, considers city-specific shocks, and discusses inference with a single treated unit.
      good: Explains the comparison of changes and the parallel trends assumption.
      weak: Compares the treated city before and after without a control, or cannot state the key assumption.
    followups:
      - The pre-period trends clearly diverge. What would you try next?
      - How would you pick the control cities?
    common_errors:
      - Not checking pre-period trends before trusting the estimate.

  - external_key: technical.data_scientist.opt_in_program_effect
    topic: Estimating effects of opt-in programmes
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Customers choose whether to join a loyalty programme, and members spend much more than non-members. How
      would you estimate how much of that difference the programme actually causes?
    expected_concepts:
      - self-selection of high spenders into the programme
      - matching or propensity score methods on pre-join behaviour
      - comparing spend before and after joining against matched non-members
      - unobserved confounding remains a limitation
      - sensitivity analysis or a randomised encouragement design
    rubric:
      excellent: Explains selection bias, builds a credible comparison using pre-join behaviour, checks overlap and balance, and is clear about unobserved confounding with a sensitivity analysis or randomised encouragement option.
      good: Proposes matching or propensity scores with a recognition of selection bias.
      weak: Reports the raw spend difference as the programme effect.
    followups:
      - How would you check that the matched groups are actually comparable?
      - What would a randomised encouragement design look like here?
    common_errors:
      - Matching on behaviour measured after joining, which the programme itself influences.

  - external_key: technical.data_scientist.skewed_revenue_experiment
    topic: Testing on revenue with extreme spenders
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're running a test where the main metric is revenue per user, and a few very large customers land in
      one group by chance and swing the result. How would you analyse this experiment?
    expected_concepts:
      - high variance from heavy tails reduces power
      - winsorising or capping at a pre-agreed percentile
      - stratified randomisation or blocking on prior spend
      - variance reduction with pre-period spend
      - reporting both capped and uncapped results transparently
    rubric:
      excellent: Proposes pre-registered capping and stratification, explains the bias-variance trade-off of capping, uses pre-period data, and reports results transparently.
      good: Suggests capping or stratification with a reason.
      weak: Removes the large customers after seeing the results.
    followups:
      - How would you choose the capping threshold without biasing the result?
      - How would stratifying the randomisation have helped?
    common_errors:
      - Deciding on outlier handling after looking at which group the large customers fell into.

  - external_key: technical.data_scientist.long_term_holdouts
    topic: Long-term holdout groups
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Some teams keep a small group of users away from all new features for months. What does a long-term
      holdout tell you that individual experiments don't, and what does it cost?
    expected_concepts:
      - cumulative effect of many launches
      - long-term effects that short tests miss
      - checks whether individual wins add up as expected
      - cost of worse experience for held-out users and engineering complexity
      - holdout size, refresh and contamination
    rubric:
      excellent: Explains cumulative and long-term measurement, discusses user and engineering costs, and addresses design details such as size, duration, refresh and contamination.
      good: Explains the purpose and at least one cost.
      weak: Cannot explain why a holdout adds information beyond individual tests.
    followups:
      - The holdout shows much less total lift than the sum of individual wins. Why might that be?
      - How large would you make the holdout?
    common_errors:
      - Forgetting that holdout users may still be affected through shared systems or other users.

  # ------------------------------------------------------------------ hard
  - external_key: technical.data_scientist.marketplace_interference
    topic: Experiments with interference in marketplaces
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You want to test a new pricing algorithm in a two-sided marketplace where buyers and sellers share the
      same inventory. Why would a standard user-level A/B test give a biased answer, and how would you design
      the experiment instead?
    expected_concepts:
      - treatment and control compete for the same supply, violating independence between units
      - bias in either direction from cannibalisation
      - cluster randomisation by region or market
      - switchback designs alternating over time
      - trade-off between bias and power, and carryover effects
    rubric:
      excellent: Explains the interference mechanism concretely, compares cluster and switchback designs with their trade-offs, and addresses carryover, power and analysis methods.
      good: Identifies interference and proposes cluster or switchback randomisation.
      weak: Proposes a standard user-level test without recognising the shared inventory problem.
    followups:
      - How would you choose the switchback interval?
      - How would you estimate how biased a user-level test would have been?
    common_errors:
      - Assuming that a large sample size fixes interference bias.

  - external_key: technical.data_scientist.sequential_testing_design
    topic: Designing tests with valid early stopping
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Your company wants experiments that can be stopped early when there's a clear winner without inflating
      false positives. How would you design that, and what do you give up?
    expected_concepts:
      - group sequential designs with alpha spending
      - always-valid inference such as mixture sequential probability ratio tests
      - Bayesian approaches with decision thresholds and their error properties
      - wider intervals or more samples at the planned horizon
      - early estimates overstate effects when stopping on significance
    rubric:
      excellent: Describes at least one sequential method in detail, explains the cost in power or sample size, and mentions effect size inflation when stopping early, with guidance on how to report results.
      good: Names a valid sequential method and explains why it controls false positives.
      weak: Suggests simply lowering the threshold without a principled method.
    followups:
      - Why do effects estimated at early stopping tend to be overstated?
      - How would you explain an always-valid p-value to product managers?
    common_errors:
      - Assuming Bayesian methods are immune to the effects of optional stopping on error rates.

  - external_key: technical.data_scientist.threshold_discontinuity
    topic: Regression discontinuity designs
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Customers with a risk score above a cutoff automatically get a premium support tier. You want to know if
      premium support reduces churn, but you can't run an experiment. How could you use that cutoff to estimate
      the effect?
    expected_concepts:
      - regression discontinuity comparing customers just above and below the cutoff
      - effect is local to the cutoff
      - bandwidth choice and functional form
      - checking for manipulation around the threshold and covariate balance
      - fuzzy design if assignment at the cutoff is not perfect
    rubric:
      excellent: Sets up the design correctly, explains the local nature of the estimate, covers bandwidth, manipulation and balance checks, and handles a fuzzy cutoff.
      good: Describes comparing customers near the cutoff and states key assumptions.
      weak: Compares all premium to all non-premium customers.
    followups:
      - How would you know whether customers or staff manipulate scores around the cutoff?
      - Can you generalise the result to customers far from the cutoff?
    common_errors:
      - Using a very wide bandwidth that reintroduces confounding.

  - external_key: technical.data_scientist.campaign_without_control
    topic: Measuring a national campaign with no control group
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Marketing ran a nationwide brand campaign with no holdout, and they want to know how many sign-ups it
      drove. How would you build the most credible estimate you can?
    expected_concepts:
      - counterfactual forecast from pre-period data
      - synthetic control or Bayesian structural time series using related unaffected series
      - geographic variation in campaign intensity if available
      - validating the model on placebo periods
      - wide uncertainty and recommending holdouts for future campaigns
    rubric:
      excellent: Builds a counterfactual with a clear method, validates it with placebo tests, communicates uncertainty as a range rather than a single number, and recommends geo holdouts for future campaigns.
      good: Proposes a time series counterfactual or synthetic control with some validation.
      weak: Compares sign-ups before and during the campaign.
    followups:
      - Which control series would you use, and how would you check they weren't affected?
      - How would you design the next campaign so it can be measured?
    common_errors:
      - Choosing control series that the campaign also influenced.

  - external_key: technical.data_scientist.uplift_targeting
    topic: Uplift modelling for targeting
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      The retention team sends discount coupons to customers the churn model flags as high risk. You suspect
      many of them would have stayed anyway, and some would leave regardless. How would you target the coupons
      better?
    expected_concepts:
      - predicting the treatment effect rather than the outcome
      - persuadables, sure things, lost causes and customers harmed by contact
      - randomised data needed to train and evaluate uplift models
      - meta-learners such as two-model or transformed outcome approaches
      - evaluation with uplift or Qini curves and cost-based targeting
    rubric:
      excellent: Distinguishes response from uplift modelling, explains the need for randomised training data, describes a modelling approach and an evaluation with uplift curves tied to coupon cost.
      good: Proposes modelling incremental effect and running a randomised test.
      weak: Suggests improving the churn model's accuracy as the solution.
    followups:
      - How would you evaluate an uplift model when you never observe both outcomes for one customer?
      - How big does the randomised training set need to be?
    common_errors:
      - Evaluating uplift models with ordinary classification metrics such as AUC.

  - external_key: technical.data_scientist.winners_curse_audit
    topic: Auditing past experiment wins
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Leadership notices that the sum of all reported experiment wins last year is far larger than the actual
      growth in the business. They ask you to find out why. How would you investigate and what would you change?
    expected_concepts:
      - winner's curse where selected significant results overestimate effects
      - false positives from many tests, peeking and multiple metrics
      - non-additivity and interactions between launches
      - novelty effects and decay over time
      - remedies such as holdouts, replication, shrinkage of reported effects and A/A tests
    rubric:
      excellent: Identifies several mechanisms with a way to measure each, proposes process changes such as shrinkage of reported effects, holdouts and pre-registration, and explains how to communicate this without discrediting the programme.
      good: Names winner's curse or false positives and suggests a remedy.
      weak: Assumes the business numbers are wrong or that the experiments were simply mismeasured.
    followups:
      - How would you estimate the false discovery rate of your experimentation programme?
      - How would shrinkage of reported effects work in practice?
    common_errors:
      - Assuming every significant result's point estimate is an unbiased measure of impact.
