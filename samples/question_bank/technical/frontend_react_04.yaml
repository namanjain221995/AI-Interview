# Curated questions: design systems, accessibility, security and production concerns in React
# (technical.frontend_react, part 4 of 4). Difficulty decides round types: easy -> screening/combined,
# medium -> screening/deep/combined, hard -> deep/combined.
version: 1
defaults:
  role_tags: [frontend]
questions:
  # ------------------------------------------------------------- easy
  - external_key: technical.frontend_react.design_tokens_usage
    competency_key: frontend_react
    topic: Design tokens in components
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      What are design tokens, and how have you used them in React components instead of hard-coding colours,
      spacing and font sizes?
    expected_concepts:
      - named values for colour, spacing, typography, radius and shadow
      - semantic tokens such as surface or danger over raw palette values
      - exposed as CSS custom properties or a theme object
      - a single place to change the visual language
      - tokens shared between design tools and code
    rubric:
      excellent: Explains raw versus semantic tokens, shows how components consume them through CSS variables or a theme, and describes keeping design files and code in sync.
      good: Understands tokens as shared named values and uses them consistently.
      weak: Thinks tokens are just a list of hex colours in a constants file used inconsistently.
    followups:
      - Why name a token for its purpose rather than its colour?
      - How do tokens get from the design tool into the codebase?
    common_errors:
      - Components referencing raw palette values directly.
      - One-off magic numbers for spacing scattered through styles.

  - external_key: technical.frontend_react.variant_api_design
    competency_key: frontend_react
    topic: Variant props versus style overrides
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      When you design a Button for a shared component library, how do you handle visual variations like primary,
      secondary and destructive, and how much styling freedom do you give callers?
    expected_concepts:
      - a small set of named variant and size props
      - limiting arbitrary style overrides to keep consistency
      - className or style escape hatches with clear rules
      - variant helpers such as class-variance-authority
      - documenting when to use each variant
    rubric:
      excellent: Defines a constrained variant API, explains the trade-off between consistency and flexibility, offers a controlled escape hatch and documents intended usage.
      good: Uses named variant props and limits overrides sensibly.
      weak: Lets every caller pass arbitrary colours and paddings, or creates a separate component per variant.
    followups:
      - A team needs a variant you don't support yet. What do you do?
      - How do you stop variants multiplying over time?
    common_errors:
      - Boolean props like isPrimary and isDanger that can conflict.
      - Unlimited style overrides that erode consistency.

  - external_key: technical.frontend_react.component_documentation
    competency_key: frontend_react
    topic: Documenting shared components
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you document shared React components so other engineers use them correctly without having to ask
      you? Tell me what's worked well for you.
    expected_concepts:
      - interactive examples in a tool such as Storybook
      - stories covering states and edge cases
      - prop tables generated from types
      - usage guidance including when not to use a component
      - accessibility notes and keyboard behaviour
    rubric:
      excellent: Describes living, generated documentation with states, do and don't guidance and accessibility notes, and keeps it current by tying stories to tests.
      good: Uses Storybook or similar with examples and prop documentation.
      weak: Relies on reading the source code or a stale wiki page.
    followups:
      - How do you keep documentation from going stale?
      - Can stories double as tests, and how?
    common_errors:
      - Only documenting the default happy state.
      - Docs that drift from the actual props.

  - external_key: technical.frontend_react.icon_components
    competency_key: frontend_react
    topic: Standardising icons in a React codebase
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      You notice the app uses four different icon sets, icons are imported as images in some places and inline
      SVG in others, and sizes are inconsistent. How would you clean this up into one approach?
    expected_concepts:
      - a single icon component or generated set of SVG components
      - sizing and colour through props or currentColor
      - decorative icons hidden from assistive technology
      - accessible labels for icon-only buttons
      - per-icon imports so unused icons are not bundled
    rubric:
      excellent: Proposes one generated SVG component set with consistent sizing and currentColor theming, handles decorative versus meaningful icons and labels on icon-only buttons, and keeps imports tree-shakeable.
      good: Consolidates on one icon component with consistent sizing and some accessibility handling.
      weak: Picks a favourite icon library without addressing sizing, colour or accessibility.
    followups:
      - How should an icon-only delete button be announced to a screen reader?
      - How would you migrate the existing usages without a huge pull request?
    common_errors:
      - Importing an entire icon font or sprite for a handful of icons.
      - Icon-only buttons with no accessible name.

  - external_key: technical.frontend_react.text_field_api
    competency_key: frontend_react
    topic: Designing a form field component
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Every team wires labels, hint text and error messages around inputs differently, and some forget labels
      altogether. How would you design a shared TextField component to fix that?
    expected_concepts:
      - label, hint and error built into the component
      - ids generated with useId and linked automatically
      - aria-describedby and aria-invalid handled internally
      - passing native input props through
      - a lower-level building block for unusual layouts
    rubric:
      excellent: Designs a component that makes the accessible structure the default, generates and links ids automatically, passes native props through and offers composable parts for edge cases.
      good: Builds label, hint and error into one component with correct associations.
      weak: A styled input that still leaves labels and error wiring to each caller.
    followups:
      - Why use useId rather than a random number or a counter?
      - How would the component work with a form library?
    common_errors:
      - Hard-coded ids that collide when the component is used twice.
      - Making the label optional with no accessible fallback.

  - external_key: technical.frontend_react.generalize_or_duplicate
    competency_key: frontend_react
    topic: When to generalise a component
    difficulty: easy
    kind: scenario
    round_types: [technical_screening, combined]
    text: >-
      Two teams have built product cards that look about eighty percent the same. Someone proposes merging them
      into one generic Card component. How would you decide whether that's a good idea?
    expected_concepts:
      - whether they change for the same reasons
      - shared primitives versus shared feature components
      - risk of a component with many conditional props
      - composition to share layout while keeping content separate
      - cost of coupling two teams' release cycles
    rubric:
      excellent: Judges by whether the components evolve together, suggests extracting shared primitives or a composable shell rather than a configurable mega-component, and weighs the coupling cost.
      good: Weighs duplication against complexity with a sensible conclusion.
      weak: Always merges similar-looking code or never shares anything.
    followups:
      - What signals tell you a shared component has become the wrong abstraction?
      - How would you undo a bad abstraction safely?
    common_errors:
      - Merging on visual similarity alone.
      - Adding a flag for every difference between the two.

  - external_key: technical.frontend_react.protected_routes
    competency_key: frontend_react
    topic: Authentication-aware routing
    difficulty: easy
    kind: technical
    round_types: [technical_screening, combined]
    text: >-
      How do you handle pages that require the user to be logged in, in a React single-page app? Walk me through
      what happens when a signed-out user opens a deep link.
    expected_concepts:
      - a route guard or loader that checks the session
      - redirect to login preserving the intended destination
      - returning to the original page after login
      - avoiding a flash of protected content while checking
      - the server must still enforce authorisation
    rubric:
      excellent: Guards routes centrally, preserves and validates the return URL, avoids flashing protected content, handles session expiry and stresses that the API enforces access.
      good: Redirects to login and back to the original page.
      weak: Hides links in the menu and treats that as protection.
    followups:
      - Why should you validate the return URL before redirecting to it?
      - What should happen when the session expires mid-task?
    common_errors:
      - Treating client-side checks as security.
      - Open redirects through an unvalidated return URL.

  # ------------------------------------------------------------- medium
  - external_key: technical.frontend_react.polymorphic_components
    competency_key: frontend_react
    topic: Polymorphic components and asChild
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Your design system's Button sometimes needs to render as a router link instead of a button element. How
      would you support that, and what are the trade-offs between an as prop and an asChild style approach?
    expected_concepts:
      - an as prop that changes the rendered element
      - asChild or Slot merging props into the single child element
      - typing props correctly for each element
      - merging event handlers, classes and refs
      - semantics of links versus buttons
    rubric:
      excellent: Compares both patterns with their typing and composition costs, explains prop and ref merging, and reminds that navigation should be a link and actions a button.
      good: Implements one approach correctly and understands the semantic difference.
      weak: Wraps a button inside an anchor or uses onClick navigation on a button.
    followups:
      - What goes wrong when a link is nested inside a button?
      - How would you type an as prop so link-only props are allowed only for links?
    common_errors:
      - Interactive elements nested inside other interactive elements.
      - Losing the child's own handlers when merging props.

  - external_key: technical.frontend_react.headless_vs_custom
    competency_key: frontend_react
    topic: Headless libraries versus building from scratch
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      For components like comboboxes, menus and date pickers, would you build them yourself or start from a
      headless library such as Radix or React Aria? How would you make that call?
    expected_concepts:
      - complex keyboard and ARIA behaviour is hard to get right
      - headless libraries provide behaviour while you own styling
      - evaluation of accessibility quality, bundle size and maintenance
      - lock-in and escape hatches
      - building in-house only for unusual needs
    rubric:
      excellent: Recognises the accessibility and edge-case cost of building from scratch, evaluates libraries on behaviour quality, size and maintenance, and reserves custom builds for justified cases.
      good: Prefers a headless library for complex widgets with sensible reasons.
      weak: Builds every widget from scratch with divs, or adopts a fully styled kit without considering design needs.
    followups:
      - How would you test that a library's combobox behaves well with screen readers?
      - What would make you replace a library later?
    common_errors:
      - Underestimating keyboard and screen-reader requirements.
      - Wrapping a library so tightly that upgrades become impossible.

  - external_key: technical.frontend_react.styling_strategy
    competency_key: frontend_react
    topic: Choosing a styling approach
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you choose between runtime CSS-in-JS, CSS Modules and a utility framework like Tailwind for a
      server-rendered React app with a design system?
    expected_concepts:
      - runtime CSS-in-JS costs during render and with streaming
      - compatibility with server components
      - zero-runtime or build-time extraction options
      - utility classes and design-token alignment
      - co-location, theming and dead-code removal
    rubric:
      excellent: Compares approaches on runtime cost, server rendering and server component support, theming with tokens and maintainability, and gives a reasoned recommendation for the stated context.
      good: Knows the main trade-offs and makes a defensible choice.
      weak: Picks by personal taste without any technical criteria.
    followups:
      - How would you theme components with each approach?
      - What would a migration away from runtime CSS-in-JS involve?
    common_errors:
      - Ignoring the render cost of runtime style injection.
      - Mixing several styling systems with no rules.

  - external_key: technical.frontend_react.render_props_vs_hooks
    competency_key: frontend_react
    topic: Render props, hooks and slots today
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Hooks replaced most render props and higher-order components for sharing logic. Are there still cases
      where you'd choose a render prop or a component that takes a function as children? Tell me how you decide.
    expected_concepts:
      - hooks share logic but leave rendering to the caller
      - render props let a component control where and when content renders
      - examples such as virtualised rows or measured containers
      - higher-order components for cross-cutting wrappers in legacy code
      - readability and nesting costs of each pattern
    rubric:
      excellent: Explains what each pattern actually controls, gives realistic cases where a render prop still fits, and compares readability, typing and performance trade-offs.
      good: Prefers hooks and names at least one valid render-prop use.
      weak: Cannot explain the difference or uses higher-order components for everything.
    followups:
      - What problem did hooks solve that render props couldn't?
      - How do render props interact with memoisation?
    common_errors:
      - Deeply nested render props producing unreadable trees.
      - Inline render functions defeating memoised children.

  - external_key: technical.frontend_react.toast_notifications
    competency_key: frontend_react
    topic: An app-wide notification system
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Teams want to show toast notifications from anywhere, including from inside data-fetching callbacks that
      aren't React components. How would you design the API and the implementation?
    expected_concepts:
      - a provider plus a hook, or an external store with an imperative function
      - rendering through a portal in a single region
      - live region announcements with appropriate politeness
      - durations, pausing on hover or focus, and dismiss controls
      - queueing and limiting simultaneous toasts
      - avoiding toasts for critical errors that need action
    rubric:
      excellent: Designs a store-backed API callable outside components, renders one accessible region, handles timing, pausing, queueing and dismissal, and sets guidance on when not to use toasts.
      good: Provides a hook and a portal-rendered list with timeouts and some accessibility consideration.
      weak: Each component renders its own absolutely positioned message with no announcements.
    followups:
      - How do keyboard users reach an action button inside a toast?
      - What would you show instead of a toast for an error that blocks the user?
    common_errors:
      - Toasts that vanish before screen-reader users hear them.
      - Messages stacking without limit.

  - external_key: technical.frontend_react.design_system_drift
    competency_key: frontend_react
    topic: Teams overriding or forking shared components
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You maintain a design system and discover that several product teams have copied components into their
      own repositories and heavily overridden the styles. How would you find out why and respond?
    expected_concepts:
      - talk to the teams to learn the unmet needs
      - measure usage and overrides with code scanning
      - add missing variants or composition points
      - make upgrading easy with codemods and changelogs
      - a clear contribution path
    rubric:
      excellent: Treats forks as feedback, gathers usage data and team input, fixes gaps in the API, lowers upgrade friction and sets up a contribution process.
      good: Investigates the reasons and adds missing capabilities.
      weak: Mandates usage and blocks overrides without understanding the cause.
    followups:
      - Which metrics would show the design system is healthy?
      - How would you bring a forked component back into the library?
    common_errors:
      - Blaming teams instead of examining the API.
      - Adding a flag for each team's special case.

  - external_key: technical.frontend_react.breaking_change_definition
    competency_key: frontend_react
    topic: What counts as a breaking change in a component library
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      When you maintain a React component library with semantic versioning, which kinds of changes do you treat
      as breaking? Some are obvious, like removing a prop, but I'm interested in the less obvious ones.
    expected_concepts:
      - removing or renaming props and changing their types
      - changes to rendered DOM structure that consumers style or query
      - changes to default behaviour, focus or keyboard handling
      - visual changes to spacing or size that affect layouts
      - raising the supported React or peer dependency versions
      - exported CSS class names or tokens
    rubric:
      excellent: Goes beyond the props API to DOM structure, default behaviour, accessibility semantics, layout-affecting visuals and peer dependencies, and explains how deprecations and changelogs soften the impact.
      good: Identifies API and some behavioural changes as breaking.
      weak: Considers only prop removals as breaking.
    followups:
      - How would you discover that consumers depend on your internal DOM structure?
      - How long would you keep a deprecated prop working?
    common_errors:
      - Shipping a DOM restructure as a patch release.
      - No deprecation period before removing props.

  - external_key: technical.frontend_react.library_packaging
    competency_key: frontend_react
    topic: Packaging and publishing a component library
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      How would you package and publish a React component library so it works well in consumers' apps,
      including server-rendered ones, without bloating their bundles?
    expected_concepts:
      - React and React DOM as peer dependencies
      - ES module output that supports tree shaking and side-effect flags
      - shipped type declarations
      - a CSS delivery strategy consumers can load predictably
      - client directives for interactive components used with server components
      - per-component entry points
    rubric:
      excellent: Uses peer dependencies, tree-shakeable ESM with accurate side-effect metadata, type declarations, a clear CSS strategy, server-component-friendly directives and per-component entry points.
      good: Publishes ESM with peer dependencies and types.
      weak: Bundles its own copy of React or ships a single large CommonJS file.
    followups:
      - What breaks when an app ends up with two copies of React?
      - How would you test the package as a consumer before publishing?
    common_errors:
      - Listing React as a regular dependency.
      - Marking CSS imports as side-effect free so styles are dropped.

  - external_key: technical.frontend_react.controllable_state_api
    competency_key: frontend_react
    topic: Supporting controlled and uncontrolled component usage
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're building a shared Accordion or Select that some callers want to control from outside while others
      just want it to manage itself. How would you design the props and internal state to support both?
    expected_concepts:
      - value and defaultValue props with an onChange callback
      - internal state used only when uncontrolled
      - a reusable controllable-state hook
      - warning when a component switches between modes
      - calling onChange in both modes
    rubric:
      excellent: Follows the value and defaultValue convention, implements a reusable controllable-state hook, notifies callers in both modes and guards against mode switching.
      good: Supports both modes with the standard prop conventions.
      weak: Syncs the controlled prop into internal state with an effect, causing drift.
    followups:
      - What should happen if a caller passes value without onChange?
      - How would you test both modes?
    common_errors:
      - Copying the controlled value into state and letting them diverge.
      - Skipping onChange when uncontrolled.

  - external_key: technical.frontend_react.feature_flag_ui
    competency_key: frontend_react
    topic: Rolling out UI behind feature flags
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      You're rolling out a redesigned checkout to ten percent of users behind a feature flag. How would you wire
      the flag into the React app so users don't see the old version flash before the new one?
    expected_concepts:
      - evaluate flags on the server or before first render
      - bootstrap flag values into the initial payload
      - stable assignment per user
      - code splitting both variants
      - cleaning up flags after rollout
    rubric:
      excellent: Evaluates flags before render or on the server, bootstraps values to avoid flashes, keeps assignment stable, splits variant code and plans flag removal.
      good: Avoids the flash by loading flags before rendering.
      weak: Fetches flags in an effect after mount and swaps the UI.
    followups:
      - How would you test both variants?
      - What happens if the flag service is down?
    common_errors:
      - Flags fetched after the first render, causing flicker.
      - Old flags never removed.

  - external_key: technical.frontend_react.list_exit_animations
    competency_key: frontend_react
    topic: Animating items entering and leaving
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      Designers want items in a task list to fade and slide out when deleted and the remaining items to move
      smoothly into place. Removing an item from state makes it vanish instantly. How would you implement this?
    expected_concepts:
      - keeping the element mounted until its exit animation finishes
      - presence components from animation libraries
      - layout animations using transform measured before and after the change
      - stable keys so the right elements animate
      - respecting the reduced-motion preference
      - the View Transitions API as an option
    rubric:
      excellent: Explains why unmounting prevents an exit animation, uses a presence pattern or library, animates reordering with transforms, relies on stable keys, and respects reduced motion.
      good: Delays removal until an exit animation completes, using a library or timer.
      weak: Hides items with CSS while leaving them in state indefinitely.
    followups:
      - What could go wrong if the user deletes several items quickly?
      - How would screen-reader users learn the item was removed?
    common_errors:
      - Index keys causing the wrong item to animate out.
      - Animating height and position properties that trigger layout each frame.

  # ------------------------------------------------------------- hard
  - external_key: technical.frontend_react.multi_brand_theming
    competency_key: frontend_react
    topic: Multi-brand theming with tokens
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Your company is acquiring two brands and wants one React component library to serve all three products,
      each with its own look, plus light and dark modes. How would you design the theming system?
    expected_concepts:
      - layered tokens from primitives to semantic to component level
      - brand and mode as independent theme dimensions
      - CSS custom properties scoped at a root or subtree
      - a token build pipeline that outputs per platform
      - contrast checks for every brand and mode combination
      - limits on what brands may customise
    rubric:
      excellent: Designs layered tokens with brand and mode as separate axes, scopes themes with CSS variables, automates token builds and contrast checks, and sets clear boundaries on brand customisation.
      good: Uses semantic tokens and CSS variables with per-brand theme files.
      weak: Copies the library per brand or adds brand conditionals inside components.
    followups:
      - How would you render two brands on the same page, for example in a preview?
      - Which decisions would you deliberately keep out of brand control?
    common_errors:
      - Brand checks hard-coded inside component logic.
      - Only checking contrast for the default theme.

  - external_key: technical.frontend_react.micro_frontends
    competency_key: frontend_react
    topic: Multiple React apps on one page
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      Three teams want to ship parts of the same page independently, each with its own React app and release
      schedule. How would you evaluate whether micro-frontends are worth it, and how would you build them if so?
    expected_concepts:
      - organisational independence versus runtime cost
      - module federation or build-time composition
      - shared dependencies and React version alignment
      - shared design system and routing contracts
      - communication through events or a narrow API
      - performance budgets and failure isolation
    rubric:
      excellent: Questions whether the organisational problem justifies the cost, compares runtime and build-time composition, handles shared React and design system versions, defines contracts and protects performance and failure isolation.
      good: Describes a workable composition approach with shared dependencies.
      weak: Recommends micro-frontends by default or loads three copies of React without concern.
    followups:
      - What happens if two teams need different major versions of React?
      - How would one team's crash be kept from breaking the whole page?
    common_errors:
      - Duplicated framework bundles on every page.
      - Shared global state between independently deployed apps.

  - external_key: technical.frontend_react.escape_hatch_editor
    competency_key: frontend_react
    topic: Escaping React rendering for high-frequency updates
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      Imagine building a collaborative whiteboard where shapes move at sixty frames per second while several
      people edit. Where would you let React manage the UI, and where would you deliberately step outside it?
    expected_concepts:
      - React for chrome such as toolbars and panels
      - canvas or direct DOM updates for high-frequency rendering
      - external store with fine-grained subscriptions
      - batching remote updates per animation frame
      - CRDT or operational transform layer for collaboration
    rubric:
      excellent: Draws a clear boundary between React-managed chrome and an imperative rendering layer, uses fine-grained subscriptions and frame batching, and keeps the collaboration model separate from the view.
      good: Recognises React state per frame is too slow and proposes a canvas or ref-based layer.
      weak: Stores every pointer move in React state and relies on memo.
    followups:
      - How would React panels stay in sync with the selected shape?
      - How would you test the imperative layer?
    common_errors:
      - Pushing per-frame data through React state or context.
      - Mixing the collaboration model into components.

  - external_key: technical.frontend_react.costly_shared_components
    competency_key: frontend_react
    topic: Performance cost of shared components
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      A product team reports that a table with five hundred rows is slow, and profiling shows that most of the
      time is spent inside your design system's Tooltip and Menu components, which each row renders. How would
      you investigate and fix this at the library level?
    expected_concepts:
      - per-instance costs such as portals, listeners, context providers and positioning
      - lazy mounting of popup content until first interaction
      - a single shared tooltip or menu instance driven by delegation
      - benchmarks for library components at scale
      - keeping the public API unchanged for consumers
    rubric:
      excellent: Measures the per-instance cost, defers expensive work until interaction, considers a shared instance with delegation, keeps the API stable and adds scale benchmarks to the library's CI.
      good: Identifies eager per-instance work and makes it lazy.
      weak: Tells the product team to virtualise or remove tooltips without fixing the library.
    followups:
      - How would you test that the lazy version is still accessible?
      - What benchmark would you add so this doesn't regress?
    common_errors:
      - Every instance registering global scroll and resize listeners.
      - Mounting hidden popup content for every row upfront.

  - external_key: technical.frontend_react.accessible_data_grid
    competency_key: accessibility
    topic: Keyboard navigation in data grids
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you make an editable spreadsheet-style grid in React fully usable from the keyboard and by
      screen-reader users, including when it's virtualised?
    expected_concepts:
      - grid roles with row and column indexes
      - roving tabindex so the grid is a single tab stop
      - arrow, Home, End and page navigation
      - entering and leaving edit mode with Enter and Escape
      - aria-rowcount and aria-rowindex for virtualised rows
      - announcing sort and edit changes
    rubric:
      excellent: Applies the grid pattern with roving tabindex and full key support, separates navigation from edit mode, handles virtualisation with row and column counts and indexes, and tests with assistive technology.
      good: Implements arrow-key navigation with correct roles and a single tab stop.
      weak: Makes every cell a separate tab stop or relies on mouse interaction.
    followups:
      - When should you use a plain table instead of the grid pattern?
      - How do you keep focus stable when the focused row is virtualised away?
    common_errors:
      - Hundreds of tab stops inside the grid.
      - Missing row and column counts in virtualised grids.

  - external_key: technical.frontend_react.major_upgrade
    competency_key: frontend_react
    topic: Upgrading React across a large codebase
    difficulty: hard
    kind: scenario
    round_types: [deep_technical, combined]
    text: >-
      You're responsible for upgrading a large app to the next major version of React. Several third-party
      libraries haven't declared support yet. How would you plan and run the upgrade?
    expected_concepts:
      - reading release notes and deprecations in advance
      - fixing deprecation warnings on the current version first
      - auditing dependencies and their compatibility
      - running codemods
      - upgrading on a branch with full tests and staged rollout
      - patching or replacing unmaintained libraries
    rubric:
      excellent: Prepares by clearing deprecations, audits and plans for incompatible libraries, uses codemods, validates with tests and real-user monitoring, and rolls out gradually with a rollback path.
      good: Plans dependency checks, testing and a staged rollout.
      weak: Bumps the version and fixes whatever breaks in production.
    followups:
      - What would you do with a critical library that is no longer maintained?
      - How would you detect behaviour changes that tests do not cover?
    common_errors:
      - Ignoring deprecation warnings until the upgrade.
      - Upgrading everything in one massive change.

  - external_key: technical.frontend_react.layered_component_architecture
    competency_key: frontend_react
    topic: Layering a component library
    difficulty: hard
    kind: technical
    round_types: [deep_technical, combined]
    text: >-
      How would you structure a design system's code so behaviour, styling and product patterns are separate
      layers? Walk me through what lives in each layer and how teams consume them.
    expected_concepts:
      - tokens as the foundation
      - headless behaviour hooks or primitives handling state, keyboard and ARIA
      - styled components built on those primitives
      - composite patterns such as data tables or page templates
      - teams can drop down a layer when they need flexibility
      - separate versioning or packaging trade-offs
    rubric:
      excellent: Defines clear layers from tokens through headless primitives to styled components and patterns, explains how teams can use lower layers for custom needs, and weighs packaging and versioning implications.
      good: Separates behaviour from styling with a sensible structure.
      weak: One flat set of components with behaviour and styling tightly mixed.
    followups:
      - Which layer would you let product teams contribute to most freely?
      - How do you stop the pattern layer from becoming a dumping ground?
    common_errors:
      - Accessibility logic duplicated in each styled component.
      - Patterns that hard-code product-specific business logic.
