# Curated questions: problem solving, debugging, data structures and algorithms (verbal, no editor).
version: 1
defaults:
  role_tags: [general, backend, frontend, fullstack, devops, data]
  round_types: [problem_solving, technical_screening, coding, combined]
questions:
  - external_key: general.problem_solving.unreproducible_bug
    competency_key: debugging
    topic: Intermittent bug you can't reproduce
    difficulty: easy
    kind: scenario
    text: >-
      A customer reports a bug that happens "sometimes", and nobody on the team can reproduce it. How do you
      approach it?
    expected_concepts:
      - gather details (time, user, environment, steps)
      - check logs, traces and error reports around occurrences
      - look for patterns (data, timing, concurrency, version)
      - add targeted instrumentation
      - form and test hypotheses
      - write a regression test once found
    rubric:
      excellent: Collects evidence first, looks for patterns across occurrences, adds instrumentation where needed, tests hypotheses one at a time and closes with a regression test.
      good: Structured approach with logs and hypotheses.
      weak: Tries random code changes or closes the ticket as "cannot reproduce".
    followups:
      - What instrumentation would you add, and how would you avoid logging sensitive data?
      - How would you test a theory that it's a race condition?
    common_errors:
      - Changing several things at once and not knowing which fixed it.
      - Ignoring environment differences such as versions or feature flags.

  - external_key: general.data_structures.choosing_structures
    competency_key: data_structures
    topic: Arrays, linked lists and hash maps
    difficulty: easy
    kind: technical
    text: >-
      When would you choose an array, a linked list or a hash map? Tell me about the costs of the common
      operations for each.
    expected_concepts:
      - O(1) index access in arrays
      - insertion and deletion costs
      - average O(1) lookup in hash maps with worst-case caveats
      - memory locality and cache friendliness
      - ordering guarantees
    rubric:
      excellent: Compares operation costs accurately, mentions cache locality and hash-map worst cases, and grounds choices in real examples.
      good: Correct complexities and sensible choices.
      weak: Confuses complexities or always uses one structure.
    followups:
      - Why are arrays often faster than linked lists in practice even for insertions?
      - What makes a hash map degrade to O(n)?
    common_errors:
      - Claiming linked lists are always better for insertions.
      - Ignoring hash collisions.

  - external_key: general.algorithms.binary_search
    competency_key: algorithms
    topic: Binary search and its preconditions
    difficulty: easy
    kind: technical
    text: >-
      Explain how binary search works, its time complexity, and a real situation outside a coding exercise where
      you'd use the same idea.
    expected_concepts:
      - sorted input or monotonic condition
      - halving the search space
      - O(log n) time
      - off-by-one and termination conditions
      - applications such as git bisect or searching for a capacity threshold
    rubric:
      excellent: Explains the invariant and edge conditions precisely, states O(log n), and generalises to searching over a monotonic predicate with a practical example such as bisecting a regression.
      good: Correct algorithm and complexity with one application.
      weak: Unaware that the input must be sorted or monotonic.
    followups:
      - How does git bisect apply this idea?
      - How would you find the first bad deploy among 200?
    common_errors:
      - Infinite loops from incorrect mid-point updates.
      - Applying it to unsorted data.

  - external_key: general.algorithms.bfs_dfs
    competency_key: algorithms
    topic: BFS versus DFS
    difficulty: easy
    kind: technical
    text: >-
      What's the difference between breadth-first and depth-first search, and when would you pick one over the
      other?
    expected_concepts:
      - queue versus stack or recursion
      - BFS finds shortest paths in unweighted graphs
      - DFS for exhaustive exploration, cycle detection and topological order
      - memory characteristics
      - visited sets to avoid revisits
    rubric:
      excellent: Explains mechanics and use cases precisely, including shortest paths, memory trade-offs and recursion depth limits.
      good: Correct mechanics and at least one use case each.
      weak: Mixes up the two or omits visited tracking.
    followups:
      - Which would you use to find the fewest network hops between two services?
      - What can go wrong with recursive DFS on a very large graph?
    common_errors:
      - Forgetting visited tracking and looping forever on cycles.
      - Using DFS when the shortest path is required.

  - external_key: general.problem_solving.estimation_storage
    competency_key: problem_solving
    topic: Back-of-the-envelope storage estimate
    difficulty: medium
    kind: scenario
    round_types: [problem_solving, system_design, technical_screening, combined]
    text: >-
      Roughly how much storage would a photo-sharing app need for one year if it had a million daily active
      users? Talk me through your assumptions.
    expected_concepts:
      - explicit assumptions (uploads per user, photo size)
      - multiple resolutions or thumbnails
      - replication or redundancy overhead
      - metadata size versus media size
      - order-of-magnitude arithmetic
      - sanity checks
    rubric:
      excellent: States assumptions clearly, computes step by step with round numbers, includes replicas and thumbnails, sanity-checks the result and notes which assumption matters most.
      good: Reasonable assumptions and arithmetic within an order of magnitude.
      weak: Guesses a number without structure.
    followups:
      - Which assumption changes the answer the most?
      - How does the estimate change if videos are allowed?
    common_errors:
      - Forgetting replication overhead.
      - Unit mistakes between megabytes and gigabytes.

  - external_key: general.data_structures.lru_cache
    competency_key: data_structures
    topic: Designing an LRU cache
    difficulty: medium
    kind: technical
    text: >-
      How would you design an LRU cache where both get and put run in constant time? Which data structures would
      you combine, and why?
    expected_concepts:
      - hash map for O(1) lookup
      - doubly linked list for recency order
      - move to front on access
      - evict from the tail
      - thread safety considerations
    rubric:
      excellent: Combines a hash map with a doubly linked list, explains each operation step by step with O(1) costs and discusses concurrency and alternatives.
      good: Correct structures with a reasonable explanation.
      weak: Uses a list scan for eviction or cannot reach O(1).
    followups:
      - Why does the list need to be doubly linked?
      - How would you make it safe for concurrent access?
    common_errors:
      - Scanning to find the least recently used item.
      - Forgetting to update the map on eviction.

  - external_key: general.debugging.partial_user_errors
    competency_key: debugging
    topic: Errors affecting only some users
    difficulty: medium
    kind: scenario
    text: >-
      After a release, a small percentage of users get an error on the checkout page while everyone else is
      fine. How would you work out what those users have in common?
    expected_concepts:
      - segmenting errors by attributes (region, device, account type, feature flag)
      - correlation with release and canary groups
      - inspecting failing requests and payloads
      - data-dependent bugs (nulls, locales, unusual values)
      - rollback or flag off while investigating
    rubric:
      excellent: Segments failing requests by attributes to find the common factor, checks data-dependent edge cases and flags, mitigates quickly and confirms the fix with the affected segment.
      good: Looks for commonalities using logs and metrics.
      weak: Tries to reproduce with their own account only.
    followups:
      - The common factor turns out to be a specific locale — what might be going on?
      - Would you roll back for 2 percent of users?
    common_errors:
      - Testing only with typical data.
      - Not mitigating while investigating.

  - external_key: general.code_quality.refactoring
    competency_key: code_quality
    topic: Refactoring a large legacy function
    difficulty: medium
    kind: scenario
    round_types: [problem_solving, technical_screening, coding, combined, deep_technical]
    text: >-
      You need to change the behaviour of a 2,000-line function with no tests that the whole billing system
      depends on. How do you approach it safely?
    expected_concepts:
      - characterisation tests to capture current behaviour
      - small, incremental refactors
      - extracting functions with clear names
      - feature flags or parallel runs for risky changes
      - code review and monitoring after release
    rubric:
      excellent: Pins behaviour with characterisation tests, refactors in small verified steps, isolates the change behind a flag or parallel run, and monitors after release.
      good: Adds tests first and refactors incrementally.
      weak: Rewrites the function from scratch in one go.
    followups:
      - How do you write tests for code whose correct behaviour nobody knows?
      - When is a rewrite justified?
    common_errors:
      - Big-bang rewrites without a safety net.
      - Mixing refactoring and behaviour changes in one commit.

  - external_key: general.problem_solving.conflicting_constraints
    competency_key: problem_solving
    topic: Deciding under conflicting constraints
    difficulty: hard
    kind: scenario
    round_types: [problem_solving, behavioral, technical_screening, combined]
    text: >-
      Suppose a critical customer launch is in two weeks, a security review just found a serious issue in the
      feature, and fixing it properly would take three weeks. How would you think this through?
    expected_concepts:
      - clarifying severity and exploitability
      - options analysis (mitigations, reduced scope, delay)
      - involving stakeholders and owners of risk
      - interim controls such as feature flags or limited rollout
      - documenting the decision and follow-up
    rubric:
      excellent: Quantifies the risk, generates several options including interim mitigations and scope cuts, involves the right decision-makers and documents the decision with a plan for the full fix.
      good: Considers trade-offs and involves stakeholders.
      weak: Picks one extreme (ship regardless or cancel) without analysis.
    followups:
      - Who should make the final call, and why?
      - What would make you insist on a delay?
    common_errors:
      - Hiding the security issue to meet the date.
      - Treating it as a purely technical decision.

  - external_key: general.algorithms.heavy_hitters
    competency_key: algorithms
    topic: Top K items in a huge stream
    difficulty: hard
    kind: technical
    round_types: [problem_solving, technical_screening, system_design, deep_technical]
    text: >-
      How would you find the top 100 most frequent search queries from a stream of billions of queries per day
      using limited memory?
    expected_concepts:
      - exact counting needs memory proportional to distinct keys
      - min-heap of size k
      - approximate sketches (Count-Min Sketch)
      - heavy-hitter algorithms (Misra-Gries, Space-Saving)
      - sharding and merging partial results
      - error bounds
    rubric:
      excellent: Explains why exact counting is too expensive, combines a sketch or Space-Saving with a heap, discusses error bounds and distributed merging.
      good: Hash map plus heap with awareness of memory limits and sharding.
      weak: Sorts all queries every time.
    followups:
      - What error does a Count-Min Sketch introduce?
      - How do you merge results from many machines?
    common_errors:
      - Assuming everything fits in one hash map.
      - Merging top-k lists from shards without counts.

  - external_key: general.debugging.race_condition
    competency_key: debugging
    topic: Investigating a suspected race condition
    difficulty: hard
    kind: scenario
    round_types: [problem_solving, technical_screening, deep_technical]
    text: >-
      Inventory counts occasionally go negative in production although the code checks stock before
      decrementing it. How would you confirm a concurrency problem and fix it?
    expected_concepts:
      - check-then-act race
      - reproducing with concurrent load tests
      - atomic updates (conditional UPDATE, compare-and-set)
      - row locks or optimistic concurrency with versions
      - idempotency of retries
      - monitoring for invariant violations
    rubric:
      excellent: Identifies the check-then-act race, reproduces it with concurrent requests, fixes it with an atomic conditional update or locking, and adds invariant monitoring.
      good: Recognises the race and proposes locking or atomic updates.
      weak: Adds a sleep or a retry and hopes.
    followups:
      - Show me the SQL for an atomic decrement that never goes below zero.
      - What are the trade-offs of optimistic versus pessimistic locking here?
    common_errors:
      - Application-level locks that do not work across multiple instances.
      - Testing only single-threaded.
