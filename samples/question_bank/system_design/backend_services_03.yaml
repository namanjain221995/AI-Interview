# Curated questions: system design for backend services (part 3 of 4).
# Idempotent APIs, payments and money movement, workflows, inventory and bookings.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [backend, fullstack]
  kind: system_design
  round_types: [system_design, deep_technical, combined]
questions:
  # ------------------------------------------------------------------------ idempotent APIs
  - external_key: system_design.backend_services.idempotent_create_order
    competency_key: api_design
    topic: Server side of an idempotent create endpoint
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      A mobile client creates orders and retries when the network drops, which has produced duplicate orders.
      Walk me through how you'd make the create-order endpoint safe to retry, from the request the client sends to
      what the server stores.
    expected_concepts:
      - client-generated idempotency key sent with the request
      - key stored with the result, unique per client or account
      - replaying the original response on a repeat
      - key stored in the same transaction as the order
      - expiry of stored keys
    rubric:
      excellent: Has the client send a stable key, stores it atomically with the order under a unique constraint, returns the original result on repeats and sets a sensible retention period.
      good: Uses an idempotency key and checks it before creating the order.
      weak: De-duplicates by comparing order contents or relies on the client not retrying.
    followups:
      - The client retries with the same key but a different basket. What should happen?
      - Why should the key be generated by the client rather than the server?
    common_errors:
      - Checking for the key and inserting it in two separate steps.

  - external_key: system_design.backend_services.idempotency_store_design
    competency_key: api_design
    topic: Idempotency key store edge cases
    difficulty: medium
    text: >-
      You're building idempotency support as shared middleware for all write endpoints. Two identical requests with
      the same key arrive within a millisecond, and some handlers take ten seconds. How would you design the key
      store and its states?
    expected_concepts:
      - in-progress, completed and failed states for a key
      - atomic claim of the key before running the handler
      - concurrent duplicate gets a conflict or waits
      - request fingerprint to detect key reuse with a different body
      - storing the response to replay it
      - which failures release the key for retry
    rubric:
      excellent: Defines key states with an atomic claim, handles concurrent duplicates explicitly, fingerprints requests to reject mismatched reuse, replays stored responses and decides which errors free the key.
      good: Locks the key while processing and stores the response.
      weak: Only checks for a completed record, so concurrent duplicates both run.
    followups:
      - The handler crashes halfway with the key in progress. How does the client ever succeed?
      - Should a validation error be replayed for the same key or allow a fresh attempt?
    common_errors:
      - Caching only successful responses so a concurrent duplicate runs the side effect twice.

  - external_key: system_design.backend_services.unknown_outcome_external_call
    competency_key: distributed_systems
    topic: Unknown outcomes from an external payment call
    difficulty: hard
    text: >-
      Your checkout service calls a payment provider, and the call times out. You don't know whether the card was
      charged. How would you design the flow so the customer is never charged twice and never gets goods without
      paying?
    expected_concepts:
      - pending payment state recorded before the external call
      - passing your own idempotency key to the provider
      - status lookup or reconciliation for unknown outcomes
      - provider webhooks as another source of truth
      - customer-facing pending state instead of an error
      - final reconciliation against settlement data
    rubric:
      excellent: Persists intent before calling out, uses provider idempotency keys, resolves unknown outcomes through status queries, webhooks and reconciliation, and shows the customer an accurate pending state.
      good: Records a pending payment and checks the provider before retrying.
      weak: Retries the charge on timeout or treats the timeout as a decline.
    followups:
      - The provider has no status lookup API. What can you still do?
      - What does the customer see in the app while the outcome is unknown?
    common_errors:
      - Treating a timeout as a failure and letting the customer pay again.

  # ----------------------------------------------------------------- payments and money
  - external_key: system_design.backend_services.double_entry_ledger
    competency_key: databases
    topic: Double-entry ledger for balances
    difficulty: medium
    text: >-
      You're building a wallet feature where users top up, pay merchants and get refunds. How would you model the
      money movements so balances are always explainable and auditable?
    expected_concepts:
      - double-entry journal with balanced debits and credits
      - immutable, append-only entries
      - balance derived from entries or cached with checks
      - corrections as reversing entries, not edits
      - integer minor units and currency on every entry
      - linking entries to the business operation that caused them
    rubric:
      excellent: Uses an append-only double-entry journal where every transaction balances, derives or verifies balances from entries, corrects by reversal and stores amounts safely with currency.
      good: Records transactions as immutable entries and computes balances from them.
      weak: Stores a mutable balance column updated in place with no history.
    followups:
      - How would you get a user's balance quickly if they have a million entries?
      - A refund was posted to the wrong account. How do you fix it?
    common_errors:
      - Updating or deleting ledger rows to fix mistakes.

  - external_key: system_design.backend_services.marketplace_payments
    competency_key: system_design
    topic: Payments for a two-sided marketplace
    difficulty: hard
    text: >-
      Design the payments system for a marketplace where buyers pay at checkout, the platform takes a fee, sellers
      get paid out later, and refunds or disputes can happen weeks after the sale.
    expected_concepts:
      - payment intent and order linkage
      - ledger accounts for buyer, platform fee and seller balance
      - holding funds until fulfilment or a release date
      - payouts as a separate scheduled process
      - refunds and disputes after payout, including negative balances
      - reconciliation with the payment provider
    rubric:
      excellent: Models money flow through ledger accounts from charge to fee to seller balance to payout, handles refunds and disputes after payout including negative balances, and reconciles with the provider.
      good: Separates charging, fees and payouts with a ledger.
      weak: Charges the buyer and immediately pays the seller with no model for later reversals.
    followups:
      - A dispute arrives after the seller has already been paid. Where does the money come from?
      - How would you prove at month end that every cent is accounted for?
    common_errors:
      - No way to represent money the seller owes back to the platform.

  - external_key: system_design.backend_services.settlement_reconciliation
    competency_key: system_design
    topic: Reconciling with provider settlement reports
    difficulty: medium
    text: >-
      Every day your payment provider sends a settlement file listing what it actually processed. How would you
      design reconciliation between that file and your own records, and what should happen when they disagree?
    expected_concepts:
      - matching on provider transaction IDs
      - categories of mismatch such as missing, extra and amount differences
      - fees and currency conversions in the comparison
      - timing differences across day boundaries
      - exception queue with owners and ageing
      - automated fixes versus manual review
    rubric:
      excellent: Matches on stable IDs, classifies mismatch types including timing and fee differences, routes exceptions to an owned queue and limits automatic corrections to safe cases.
      good: Compares records by ID and flags differences for review.
      weak: Compares only daily totals or auto-adjusts the ledger to match the file.
    followups:
      - The file shows a charge you have no record of. What are the possible causes?
      - Which mismatches would you allow the system to fix automatically?
    common_errors:
      - Adjusting internal records to match the provider without investigation.

  - external_key: system_design.backend_services.refund_workflow
    competency_key: system_design
    topic: Full and partial refunds
    difficulty: medium
    text: >-
      Customers can request full or partial refunds, sometimes several on the same order, and refunds can fail at
      the provider. How would you design the refund workflow and its states?
    expected_concepts:
      - refund as its own entity linked to the payment
      - guard against refunding more than was captured
      - state machine with requested, pending, succeeded and failed
      - idempotent calls to the provider
      - concurrent refund requests on one order
      - ledger entries and customer notifications per state
    rubric:
      excellent: Models refunds as separate records with a state machine, enforces the remaining refundable amount under concurrency, calls the provider idempotently and records ledger effects.
      good: Tracks refund records and checks the amount before refunding.
      weak: Updates the order's amount in place or allows two concurrent refunds to exceed the total.
    followups:
      - Two support agents refund the same order at the same time. What stops an over-refund?
      - A refund fails at the provider three days later. Who finds out and how?
    common_errors:
      - Validating the refundable amount without locking or a conditional update.

  - external_key: system_design.backend_services.hot_merchant_balance
    competency_key: distributed_systems
    topic: Hot balances under heavy concurrent writes
    difficulty: hard
    text: >-
      A large merchant's balance account receives thousands of credits a second during a sale, and every credit
      locks the same balance row. How would you redesign this to keep up while keeping the balance correct?
    expected_concepts:
      - append-only entries instead of updating one row
      - sub-accounts or sharded balances summed on read
      - batching credits into periodic balance updates
      - credits versus debits needing different consistency
      - checking available funds for withdrawals
      - effect on reporting and reconciliation
    rubric:
      excellent: Removes the single-row hotspot through append-only entries, sharded sub-balances or batching, keeps strict checks only where debits need them, and explains the read cost and reconciliation impact.
      good: Proposes sharding or batching the balance updates.
      weak: Suggests a bigger database server or a looser isolation level.
    followups:
      - The merchant requests a payout during the sale. How do you know the available balance?
      - How would you prove the sharded balances sum to the right figure?
    common_errors:
      - Lowering isolation so concurrent updates overwrite each other.

  - external_key: system_design.backend_services.checkout_saga
    competency_key: distributed_systems
    topic: Checkout across inventory, payment and shipping
    difficulty: medium
    text: >-
      Checkout touches three services: inventory reserves stock, payments charges the card, and shipping creates a
      shipment. There is no distributed transaction. How would you coordinate them and handle a failure halfway?
    expected_concepts:
      - saga with ordered steps
      - compensating actions such as releasing stock or refunding
      - orchestrator or choreography choice
      - persisted saga state for recovery
      - idempotent steps and compensations
      - ordering steps to minimise compensation
    rubric:
      excellent: Designs a saga with persisted state, orders steps so the hardest to undo comes last, defines idempotent compensations and explains recovery after the coordinator crashes.
      good: Describes a saga with compensations for each step.
      weak: Proposes a two-phase commit across services or ignores partial failure.
    followups:
      - The refund compensation itself fails. What then?
      - Why might you charge the card after reserving stock rather than before?
    common_errors:
      - Assuming compensations always succeed.

  - external_key: system_design.backend_services.durable_workflow_engine
    competency_key: distributed_systems
    topic: Engine for long-running business workflows
    difficulty: hard
    text: >-
      Several teams run business processes that last days, like onboarding a merchant with document checks, waits
      and approvals. Design a workflow engine they can share, with timers, retries and a way to change workflow
      logic while instances are still running.
    expected_concepts:
      - persisted workflow state or event history
      - durable timers and resumption after restarts
      - activity retries with timeouts and backoff
      - versioning of workflow definitions for in-flight instances
      - visibility into stuck or failed instances
      - multi-tenant isolation between teams
    rubric:
      excellent: Persists workflow progress, implements durable timers and retries, has a clear strategy for versioning in-flight instances and gives operators visibility and control over stuck workflows.
      good: Stores state per workflow with retries and scheduled resumption.
      weak: Runs workflows in long-lived threads or cron jobs with no persisted progress.
    followups:
      - You deploy a new version that adds a step. What happens to instances already halfway through?
      - How would an operator fix one stuck instance without touching others?
    common_errors:
      - Ignoring how definition changes affect running instances.

  - external_key: system_design.backend_services.shopping_cart_service
    competency_key: system_design
    topic: Shopping cart for guests and signed-in users
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Design the shopping cart service for an online store. Guests can add items without an account, and when they
      sign in their cart should merge with any saved cart.
    expected_concepts:
      - cart keyed by user ID or anonymous session ID
      - merge rules on sign-in
      - storing references and quantities, not prices
      - validating price and stock at checkout
      - expiry of abandoned guest carts
    rubric:
      excellent: Keys carts by user or anonymous ID, defines clear merge rules, keeps prices and stock authoritative at checkout and expires abandoned carts.
      good: Persists carts for both cases with a sensible merge.
      weak: Stores prices in the cart and trusts them at checkout.
    followups:
      - The price of an item changes while it sits in the cart. What does the customer see?
      - What storage would you pick, and why?
    common_errors:
      - Trusting prices saved in the cart when charging.

  - external_key: system_design.backend_services.flash_sale_inventory
    competency_key: distributed_systems
    topic: Inventory for a flash sale
    difficulty: medium
    text: >-
      You have ten thousand units of a product and expect a million users to try to buy in the first minute of a
      sale. How would you design inventory handling so you never oversell and the site stays up?
    expected_concepts:
      - atomic decrement in a single authority or partitioned stock buckets
      - reservation with a timeout before payment
      - queue or admission control in front of checkout
      - rejecting quickly once sold out
      - releasing expired reservations
      - reconciling counters with orders
    rubric:
      excellent: Uses atomic, possibly bucketed stock decrements with expiring reservations, puts admission control in front, fails fast after sell-out and reconciles the counter against orders.
      good: Uses atomic decrements and reservations to avoid overselling.
      weak: Reads stock and then writes it back, or locks the product row for the whole checkout.
    followups:
      - Many reservations are never paid for. How fast do units return to stock?
      - Why might you split the stock into several buckets?
    common_errors:
      - Holding a database lock across the payment call.

  - external_key: system_design.backend_services.seat_holds
    competency_key: system_design
    topic: Reserved seating with expiring holds
    difficulty: hard
    text: >-
      Design ticketing for concerts with assigned seats. When a user picks seats they're held for ten minutes
      while they pay, and popular shows have a hundred thousand people trying to buy at once.
    expected_concepts:
      - per-seat state with conditional updates
      - hold records with expiry, released reliably
      - waiting room or queue to admit buyers
      - seat map reads served from a cache with eventual freshness
      - payment completing after a hold has expired
      - fairness against bots
    rubric:
      excellent: Holds seats atomically with expiry, admits users through a waiting room, serves seat maps from a cache while enforcing correctness at hold time, and handles payment arriving after expiry and bot traffic.
      good: Implements atomic seat holds with expiry and some admission control.
      weak: Checks seat availability from a cache and books without an atomic check.
    followups:
      - A payment succeeds one second after the hold expired and another user took the seat. What happens?
      - How fresh does the seat map need to be?
    common_errors:
      - Letting the cached seat map decide availability.

  - external_key: system_design.backend_services.appointment_booking
    competency_key: system_design
    topic: Appointment booking across many clinics
    difficulty: medium
    text: >-
      Design the booking backend for a chain of clinics where customers book appointment slots with practitioners
      online, staff change schedules, and cancellations should free slots for others.
    expected_concepts:
      - practitioner schedules and generated slots
      - preventing double booking with constraints or atomic claims
      - time zones per clinic
      - schedule changes affecting existing bookings
      - waitlists for freed slots
      - availability search performance
    rubric:
      excellent: Models schedules and slots, enforces no double booking atomically, handles time zones and schedule changes that affect existing bookings, and designs fast availability search and waitlists.
      good: Prevents double booking and supports cancellation and search.
      weak: Checks availability and inserts separately with no guard.
    followups:
      - A practitioner's shift is cancelled and forty booked appointments are affected. What happens?
      - How would you return available slots across ten clinics quickly?
    common_errors:
      - Ignoring time zones when clinics are in different regions.

  - external_key: system_design.backend_services.coupon_redemption
    competency_key: system_design
    topic: Promo codes with redemption limits
    difficulty: medium
    text: >-
      Marketing wants promo codes with rules like "first thousand redemptions only" and "once per customer", and a
      popular code may be used by thousands of people at once. How would you design redemption?
    expected_concepts:
      - global redemption counter with atomic conditional increment
      - per-customer uniqueness constraint
      - reserving at checkout and confirming on payment
      - releasing reservations for abandoned checkouts
      - rule evaluation such as dates, minimum basket and eligibility
      - abuse through multiple accounts
    rubric:
      excellent: Enforces global and per-customer limits atomically, reserves then confirms redemptions tied to payment, releases abandoned reservations and considers abuse.
      good: Uses atomic counters and per-customer constraints.
      weak: Counts redemptions after the fact so the limit is exceeded.
    followups:
      - The checkout is abandoned after the code was applied. When does the redemption count go back down?
      - How would you spot one person using many accounts to reuse a code?
    common_errors:
      - Counting redemptions only when an order completes, letting concurrent checkouts exceed the limit.

  - external_key: system_design.backend_services.subscription_billing
    competency_key: system_design
    topic: Subscription billing with renewals and upgrades
    difficulty: hard
    text: >-
      Design subscription billing for a SaaS product with monthly and yearly plans, mid-cycle upgrades and
      downgrades, automatic renewals and retries when a card payment fails.
    expected_concepts:
      - subscription, plan and invoice entities
      - proration for mid-cycle changes
      - renewal scheduler with idempotent invoice creation
      - dunning with retries and grace periods
      - entitlement state driven by billing state
      - customer time zones and billing anchors
    rubric:
      excellent: Separates subscriptions, invoices and entitlements, handles proration and idempotent renewals, runs a dunning process with grace periods and keeps access in sync with billing state.
      good: Covers renewals, upgrades and retry of failed payments.
      weak: Charges on a fixed date for everyone and ignores plan changes or failed payments.
    followups:
      - A renewal job runs twice for the same customer. What prevents a double charge?
      - What does a customer keep access to during the grace period?
    common_errors:
      - Coupling access checks directly to the payment provider instead of local entitlement state.

  - external_key: system_design.backend_services.order_state_machine
    competency_key: system_design
    topic: Order lifecycle states
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Sketch the lifecycle of an e-commerce order from placement to delivery or cancellation. How would you
      enforce in the backend that an order only moves through valid transitions?
    expected_concepts:
      - explicit states and allowed transitions
      - conditional updates that check the current state
      - transition history or events
      - side effects triggered on transitions
      - terminal states
    rubric:
      excellent: Defines states and transitions explicitly, enforces them with conditional updates so concurrent changes cannot skip states, records history and ties side effects to transitions.
      good: Lists sensible states and validates transitions in code.
      weak: Lets any code set any status directly.
    followups:
      - Two services try to cancel and ship the same order at the same time. What happens?
      - Where would you record why an order was cancelled?
    common_errors:
      - Validating the transition in memory and then writing without checking the current state.

  - external_key: system_design.backend_services.multi_currency_payments
    competency_key: system_design
    topic: Accepting payments in many currencies
    difficulty: medium
    text: >-
      Your platform starts accepting payments in twenty currencies but reports and pays out in US dollars. How would
      you handle exchange rates, amounts and reporting in the backend?
    expected_concepts:
      - storing original amount and currency alongside converted amounts
      - rate source, timestamp and rate locking at quote time
      - minor units and differing decimal places by currency
      - rounding rules and where they apply
      - refunds in the original currency
      - foreign exchange gains or losses in reporting
    rubric:
      excellent: Keeps original amounts and currency, records which rate was used and when, handles minor units and rounding explicitly, refunds in the original currency and accounts for rate differences.
      good: Stores both currencies and the rate used.
      weak: Converts everything to dollars at write time and discards the original amount.
    followups:
      - A refund happens a month later at a different rate. Who absorbs the difference?
      - Which currencies would break an assumption of two decimal places?
    common_errors:
      - Using floating-point numbers for amounts.

  - external_key: system_design.backend_services.fraud_check_in_path
    competency_key: system_design
    topic: Fraud screening within a latency budget
    difficulty: hard
    text: >-
      Every payment must be scored by a fraud model before authorisation, and checkout needs to stay under three
      hundred milliseconds. How would you build the fraud check into the payment flow?
    expected_concepts:
      - precomputed features in a fast lookup store
      - strict timeout on the scoring call
      - fail-open or fail-closed policy by risk tier
      - rules engine alongside the model
      - asynchronous post-authorisation review
      - logging decisions and outcomes for model retraining
    rubric:
      excellent: Keeps scoring fast with precomputed features and tight timeouts, defines an explicit fallback policy by risk level, combines rules and models and closes the loop with outcome data.
      good: Calls a scoring service with a timeout and a fallback decision.
      weak: Computes features from raw history synchronously or has no plan if scoring is slow.
    followups:
      - The fraud service is down. Do you accept or decline payments? Does it depend on anything?
      - How would you learn whether approved payments later turned out fraudulent?
    common_errors:
      - No defined behaviour when the scoring call times out.

  - external_key: system_design.backend_services.seller_payouts
    competency_key: system_design
    topic: Scheduled payouts to sellers
    difficulty: medium
    text: >-
      Each week your marketplace pays out to a hundred thousand sellers through a bank transfer API. How would you
      design the payout run so nobody is paid twice and failures are handled?
    expected_concepts:
      - computing payable balance from the ledger at a cutoff
      - one payout record per seller per period with a unique key
      - idempotent calls to the bank API
      - returned or failed transfers credited back
      - holds for sellers under review
      - resumable batch with progress tracking
    rubric:
      excellent: Computes payouts from the ledger at a fixed cutoff, creates unique payout records, calls the bank idempotently, handles returns by crediting balances and supports holds and resumable runs.
      good: Runs a batch with per-seller records and retries.
      weak: Loops over sellers sending transfers with no record of what was already paid.
    followups:
      - The payout job crashes after sending forty thousand transfers. How do you resume?
      - A transfer is returned by the seller's bank a week later. What happens to the money?
    common_errors:
      - Recomputing the payable amount on retry and paying a different figure.

  - external_key: system_design.backend_services.payment_provider_migration
    competency_key: system_design
    topic: Migrating to a new payment provider
    difficulty: hard
    text: >-
      Your company is moving from one payment provider to another, with millions of saved cards and active
      subscriptions. How would you plan and design the migration so customers notice nothing?
    expected_concepts:
      - abstraction layer over providers
      - migrating stored card tokens between providers
      - routing new payments gradually by percentage
      - both providers live during transition, including refunds on old charges
      - reconciliation across both providers
      - rollback plan
    rubric:
      excellent: Introduces a provider abstraction, plans token migration with the providers, ramps traffic gradually with monitoring, keeps the old provider for refunds and disputes, and has a rollback path.
      good: Abstracts the provider and migrates traffic in stages.
      weak: Plans a single cutover weekend with no way back.
    followups:
      - A customer requests a refund for a charge made on the old provider after cutover. How is it routed?
      - What metrics would tell you to pause the rollout?
    common_errors:
      - Forgetting that old charges still need refunds and disputes through the old provider.

  - external_key: system_design.backend_services.invoice_documents
    competency_key: system_design
    topic: Generating invoice documents
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Customers need a PDF invoice for every order, available to download for years. How would you design
      generating, storing and serving those documents?
    expected_concepts:
      - asynchronous generation after the order completes
      - immutable stored documents in object storage
      - invoice numbering rules
      - access control on downloads, such as signed URLs
      - regenerating versus storing the original
    rubric:
      excellent: Generates invoices asynchronously, stores them immutably with sequential numbering, serves them through access-controlled links and explains why regenerating old invoices is risky.
      good: Generates PDFs in the background and stores them for download.
      weak: Renders the PDF on every download from current data.
    followups:
      - The company's address changes. What should old invoices show?
      - How would you stop one customer from downloading another's invoice?
    common_errors:
      - Regenerating invoices from current data so old documents change.

  - external_key: system_design.backend_services.loyalty_points
    competency_key: system_design
    topic: Loyalty points with earn, redeem and expiry
    difficulty: medium
    text: >-
      Design a loyalty points system where customers earn points on purchases, redeem them at checkout, and points
      expire twelve months after they were earned.
    expected_concepts:
      - points ledger with earn, redeem and expire entries
      - lots or buckets to track expiry per earning
      - consuming oldest points first on redemption
      - reversing points when an order is refunded
      - atomic redemption during checkout
      - scheduled expiry processing
    rubric:
      excellent: Uses a points ledger with lots so expiry is per earning, redeems oldest first atomically, reverses points on refunds and runs expiry as an idempotent scheduled job.
      good: Tracks earn and redeem transactions with an expiry date.
      weak: Keeps a single points balance that cannot express when points expire.
    followups:
      - A customer refunds an order after spending the points they earned from it. What happens?
      - How would you tell a customer how many points expire next month?
    common_errors:
      - A single balance number that loses track of when points were earned.

  - external_key: system_design.backend_services.split_shipment_capture
    competency_key: system_design
    topic: Authorise once, capture per shipment
    difficulty: hard
    text: >-
      An order contains items from three sellers that ship on different days. You authorise the card at checkout
      but should only capture money as each part ships, and card authorisations expire after about a week. How
      would you design this?
    expected_concepts:
      - authorisation at checkout and partial captures per shipment
      - tracking remaining authorised amount
      - authorisation expiry and re-authorisation
      - items cancelled before shipping releasing the remainder
      - provider support for multiple partial captures
      - ledger entries per capture
    rubric:
      excellent: Designs partial captures tied to shipments with a tracked remaining amount, handles authorisation expiry through re-authorisation or fallback, releases unused amounts and checks provider limitations.
      good: Captures per shipment and handles cancellations.
      weak: Captures everything at checkout or ignores authorisation expiry.
    followups:
      - The last seller ships after the authorisation has expired. What happens?
      - What if the provider only allows a single capture per authorisation?
    common_errors:
      - Assuming an authorisation stays valid until every item ships.

  - external_key: system_design.backend_services.pricing_service
    competency_key: system_design
    topic: Consistent prices from cart to charge
    difficulty: medium
    text: >-
      Prices in your store depend on base price, active promotions, customer tier and taxes. How would you design a
      pricing service so the price shown in the cart matches what's charged, while still staying fast?
    expected_concepts:
      - single pricing service as the source of truth
      - price quotes with an ID and expiry
      - caching rules and base prices with invalidation
      - re-quoting when a quote expires or inputs change
      - explaining the price breakdown
      - versioned promotion rules
    rubric:
      excellent: Centralises calculation, issues time-limited quotes that checkout honours or refreshes, caches inputs with clear invalidation and records the breakdown used for each charge.
      good: Uses one pricing component and recalculates at checkout.
      weak: Lets each client compute prices or charges whatever price was displayed.
    followups:
      - A promotion ends while a customer is on the payment page. What do they pay?
      - How would you explain to support why an order cost what it did?
    common_errors:
      - Different services computing prices with duplicated rules.
