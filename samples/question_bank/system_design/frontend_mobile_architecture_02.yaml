# Curated system design questions: frontend and mobile client architecture, part 2.
# Micro-frontends (composition, shared dependencies, routing, communication, deploys, testing,
# performance, server-side composition, extension platforms) and design-system delivery
# (versioning, tokens, packaging, multi-framework and native parity, quality, adoption, governance).
# round_types follow difficulty: easy -> system_design/combined; medium and hard -> system_design/deep_technical/combined.
version: 1
defaults:
  role_tags: [frontend, mobile, fullstack]
  kind: system_design
  round_types: [system_design, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: system_design.frontend_mobile_architecture.mfe_when_to_split
    competency_key: system_design
    topic: Deciding whether to adopt micro-frontends
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      A director asks whether we should split our web app into micro-frontends because teams keep blocking
      each other on releases. How would you go about deciding, and what would you want to know first?
    expected_concepts:
      - the actual source of friction (release coupling, ownership, build times)
      - number of teams and how cleanly the product splits into domains
      - costs such as duplicated dependencies, consistency and operational overhead
      - cheaper alternatives like modular monolith, better CI or ownership boundaries
      - a small pilot before committing
    rubric:
      excellent: Starts from the specific problem, weighs organisational and technical costs against cheaper alternatives, and proposes criteria and a pilot before committing.
      good: Lists pros and cons of micro-frontends and relates some of them to the team's situation.
      weak: Recommends micro-frontends or rejects them outright without asking what the problem is.
    followups:
      - What would convince you that a modular monolith is enough?
      - How would you measure whether the change actually helped?
    common_errors:
      - Treating micro-frontends as a performance optimisation.

  - external_key: system_design.frontend_mobile_architecture.ds_release_versioning
    competency_key: system_design
    topic: Versioning and releasing a component library
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      You own a shared component library used by six product apps. How would you set up versioning and releases
      so teams can upgrade with confidence and know what changed?
    expected_concepts:
      - semantic versioning with a clear definition of a breaking change
      - generated changelogs from change descriptions
      - deprecation warnings before removal
      - pre-release channels for early testing
      - an upgrade guide for major versions
    rubric:
      excellent: Defines what counts as breaking for a UI library (props, behaviour, visuals, accessibility), automates changelogs and releases, and uses deprecation periods and pre-releases to make upgrades predictable.
      good: Uses semantic versioning with changelogs and some deprecation approach.
      weak: Publishes whenever something changes with no versioning discipline or communication.
    followups:
      - Is a visual change to a button's padding a breaking change?
      - How would you know which apps are still on an old major version?
    common_errors:
      - Only treating API changes as breaking and ignoring visual or behavioural changes.

  - external_key: system_design.frontend_mobile_architecture.ds_docs_playground
    competency_key: system_design
    topic: Documentation site for a design system
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Engineers keep rebuilding components that already exist in our design system because they can't find them
      or don't trust them. How would you design the documentation and playground for the system?
    expected_concepts:
      - live, interactive examples generated from the real components
      - props tables generated from types
      - usage guidance with do and don't examples
      - accessibility notes per component
      - search, versioned docs and a status for each component
    rubric:
      excellent: Proposes docs generated from source with live examples, guidance and accessibility notes, plus versioning, search and component status so the docs stay accurate and discoverable.
      good: Proposes a component explorer with examples and some written guidance.
      weak: Suggests a wiki page that is maintained by hand.
    followups:
      - How would you keep the docs from drifting out of date with the code?
      - How could teams tell which components are stable and which are experimental?
    common_errors:
      - Hand-written props tables that go stale.

  - external_key: system_design.frontend_mobile_architecture.ds_icon_delivery
    competency_key: system_design
    topic: Delivering an icon set to apps
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Our design team maintains about eight hundred icons, and the web and mobile apps each import them in
      different ways. How would you design the way icons get from the designers to the apps?
    expected_concepts:
      - a single source of SVGs exported from the design tool
      - automated optimisation and generation of per-platform assets
      - individually importable icons so unused ones are tree-shaken
      - accessible defaults for decorative versus meaningful icons
      - versioned releases and visual review of changes
    rubric:
      excellent: Designs an automated pipeline from a single source to optimised per-platform outputs, keeps bundles small through per-icon imports, and handles accessibility and versioning.
      good: Proposes a shared icon package generated from SVGs with tree-shaking.
      weak: Suggests a single icon font or copying files into each app manually.
    followups:
      - How would you stop the whole icon set ending up in every bundle?
      - What would change for the mobile apps?
    common_errors:
      - Shipping one large sprite or font containing every icon to every page.

  # ---------------------------------------------------------------- medium
  - external_key: system_design.frontend_mobile_architecture.mfe_composition_approach
    competency_key: system_design
    topic: Choosing how micro-frontends are composed
    difficulty: medium
    text: >-
      Six teams each own part of an e-commerce site, such as search, product, basket and account. If we go with
      micro-frontends, how would you compare the different ways of putting the pieces together, and which would
      you choose?
    expected_concepts:
      - build-time composition through packages
      - runtime composition through module federation or import maps
      - server-side or edge composition of fragments
      - iframes for strong isolation
      - trade-offs in independence, performance, SEO and consistency
    rubric:
      excellent: Compares build-time, runtime, server-side and iframe composition on deploy independence, performance, SEO and isolation, and justifies a choice for this specific site.
      good: Describes two or three approaches with some trade-offs.
      weak: Knows only one approach or picks a tool without explaining why.
    followups:
      - What do you lose if you compose at build time?
      - Where would you still use an iframe?
    common_errors:
      - Ignoring that build-time composition removes independent deployment.

  - external_key: system_design.frontend_mobile_architecture.mfe_shared_dependencies
    competency_key: system_design
    topic: Shared libraries across micro-frontends
    difficulty: medium
    text: >-
      In our micro-frontend setup, one team is on a newer major version of the UI framework than the others, and
      pages now download two copies of it. How would you design dependency sharing so teams stay independent
      without bloating every page?
    expected_concepts:
      - shared singletons negotiated at runtime with version ranges
      - which libraries must be singletons (framework, router, design system context)
      - a platform-wide version policy and upgrade windows
      - fallback to a bundled copy when versions are incompatible
      - monitoring duplicate dependencies in production bundles
    rubric:
      excellent: Distinguishes libraries that must be singletons from those that can be duplicated, designs runtime sharing with version ranges and fallbacks, and pairs it with an upgrade policy and monitoring.
      good: Proposes sharing the framework as a singleton and aligning versions.
      weak: Forces every team onto the same version at all times or ignores the duplication.
    followups:
      - What breaks if two copies of the framework run on the same page?
      - How would you roll out a framework major version across ten teams?
    common_errors:
      - Sharing everything as a singleton, which recreates lockstep upgrades.

  - external_key: system_design.frontend_mobile_architecture.mfe_cross_app_communication
    competency_key: system_design
    topic: Communication between micro-frontends
    difficulty: medium
    text: >-
      When a shopper adds an item in the product micro-frontend, the basket icon owned by another team has to
      update. How would you design communication between micro-frontends so teams stay loosely coupled?
    expected_concepts:
      - custom events or a small typed event bus with a published contract
      - URL as shared state for navigation-level information
      - backend as the source of truth with each part refetching or subscribing
      - avoiding a shared global store across teams
      - versioning event contracts
    rubric:
      excellent: Prefers minimal, versioned contracts such as typed events and the URL, keeps the backend as source of truth, and explains why a shared global store couples teams.
      good: Proposes an event bus or custom events with some contract.
      weak: Lets micro-frontends call each other's internals or share one global store freely.
    followups:
      - The basket micro-frontend loads after the event was fired; how does it catch up?
      - How would you change the shape of an event without breaking listeners?
    common_errors:
      - Events with no schema, so changes silently break other teams.

  - external_key: system_design.frontend_mobile_architecture.mfe_routing_shell
    competency_key: system_design
    topic: Routing and the app shell in micro-frontends
    difficulty: medium
    text: >-
      Let's say a host shell loads different micro-frontends for different parts of the URL space. How would you
      design routing so deep links, nested routes and the back button all work, and teams can add routes
      without changing the shell?
    expected_concepts:
      - shell owns top-level route prefixes, each micro-frontend owns its sub-routes
      - a route manifest or registry so new routes do not need shell releases
      - a single shared history instance
      - loading states and error handling when a micro-frontend fails to load
      - consistent not-found and auth redirect behaviour
    rubric:
      excellent: Splits route ownership cleanly, uses a manifest for registration, shares one history, and handles load failures, not-found and auth redirects consistently.
      good: Describes prefix-based routing with each part handling its own sub-routes.
      weak: Has the shell hard-code every route or lets each micro-frontend manipulate history independently.
    followups:
      - How would a link from the account area into a specific product page work?
      - What does the user see if the product micro-frontend fails to load?
    common_errors:
      - Two routers fighting over the browser history.

  - external_key: system_design.frontend_mobile_architecture.mfe_style_isolation
    competency_key: system_design
    topic: Styling conflicts between micro-frontends
    difficulty: medium
    text: >-
      After composing several micro-frontends on one page, teams find their styles leaking into each other's
      areas and the page looks inconsistent. How would you design styling so parts are isolated but still look
      like one product?
    expected_concepts:
      - scoped styles through CSS modules, prefixes or cascade layers
      - shadow DOM where strong isolation is worth its costs
      - shared design tokens through CSS custom properties
      - one owner for the global reset and base styles
      - lint rules banning global selectors in micro-frontends
    rubric:
      excellent: Combines scoping, cascade layers or shadow DOM where justified, with shared tokens and a single owner for global styles, and enforces rules with tooling.
      good: Proposes scoping styles per micro-frontend and shared tokens.
      weak: Relies on teams being careful or increases selector specificity to win conflicts.
    followups:
      - What are the downsides of putting every micro-frontend in shadow DOM?
      - Two teams ship different versions of the design system's styles; what happens?
    common_errors:
      - Each micro-frontend shipping its own global reset.

  - external_key: system_design.frontend_mobile_architecture.ds_token_pipeline
    competency_key: system_design
    topic: Design token pipeline across platforms
    difficulty: medium
    text: >-
      We want colours, spacing and typography defined once and used consistently across the website, the iOS app
      and the Android app. How would you design the pipeline that takes design tokens from the source of truth
      to each platform?
    expected_concepts:
      - tokens stored as structured data in version control
      - tiers of tokens such as primitive, semantic and component
      - a build step generating CSS variables, Swift and Kotlin or XML outputs
      - modes for themes like dark mode
      - review and visual checks on token changes
    rubric:
      excellent: Designs a tiered token model in version control with automated generation per platform, theme modes, and a review process that shows the visual impact of changes.
      good: Proposes a token file transformed into platform formats.
      weak: Copies values into each codebase by hand or uses raw colour values in components.
    followups:
      - Why would components use semantic tokens rather than primitive colours?
      - How would designers propose a change and see its effect?
    common_errors:
      - Exposing only primitive tokens, so theming requires editing every component.

  - external_key: system_design.frontend_mobile_architecture.ds_breaking_change_rollout
    competency_key: system_design
    topic: Rolling out a breaking design system change
    difficulty: medium
    text: >-
      The design system needs to replace its form input components with a new API, and they are used in about
      four thousand places across many repositories. How would you plan and deliver that change?
    expected_concepts:
      - shipping the new API alongside the old one for a period
      - codemods for mechanical migration
      - usage scanning across repositories to track progress
      - deprecation warnings and a published timeline
      - support for edge cases teams cannot migrate automatically
    rubric:
      excellent: Plans coexistence, automated codemods, usage tracking and deprecation timelines, and explains how to handle the long tail that codemods cannot fix.
      good: Proposes deprecation and a migration guide with some automation.
      weak: Releases a major version and expects teams to migrate on their own.
    followups:
      - How would you know when it is safe to delete the old components?
      - What would you do about a team that cannot migrate this quarter?
    common_errors:
      - Removing the old API before measuring remaining usage.

  - external_key: system_design.frontend_mobile_architecture.ds_adoption_tracking
    competency_key: system_design
    topic: Measuring design system adoption
    difficulty: medium
    text: >-
      Leadership wants to know whether the design system is actually being used and where teams work around it.
      How would you design a way to measure adoption across our web and mobile codebases?
    expected_concepts:
      - static analysis of imports and component usage across repositories
      - detecting local reimplementations and overridden styles
      - version distribution of the library per app
      - runtime or screenshot-based coverage of screens
      - regular reporting and feedback loops with teams
    rubric:
      excellent: Combines static usage scanning, detection of workarounds and version tracking, and turns findings into action such as identifying missing components.
      good: Proposes scanning code for imports and tracking versions.
      weak: Proposes a survey or counting downloads of the package.
    followups:
      - A team overrides the button styles everywhere; what does that tell you?
      - How would you measure adoption in the mobile apps?
    common_errors:
      - Treating installation of the package as proof of adoption.

  - external_key: system_design.frontend_mobile_architecture.ds_accessible_by_default
    competency_key: accessibility
    topic: Building accessibility into a design system
    difficulty: medium
    text: >-
      We want every product built on our design system to be accessible without every team becoming an
      accessibility expert. How would you design the system, its components and its tooling to make that happen?
    expected_concepts:
      - components with correct semantics, keyboard support and focus management built in
      - APIs that make the accessible path the easy path, such as required labels
      - automated accessibility checks in the library's tests
      - documented patterns for composition that cannot be enforced automatically
      - testing with assistive technologies on each platform
    rubric:
      excellent: Builds accessibility into component behaviour and APIs, enforces what can be automated, documents what cannot, and includes testing with real assistive technologies.
      good: Ensures components have proper semantics and keyboard support with some automated checks.
      weak: Relies on teams to add ARIA attributes or runs an audit once at the end.
    followups:
      - How would the API of an icon-only button make it hard to forget a label?
      - Which accessibility problems can a design system not solve for product teams?
    common_errors:
      - Assuming automated checks cover most accessibility issues.

  - external_key: system_design.frontend_mobile_architecture.ds_multi_framework_consumers
    competency_key: system_design
    topic: One design system for several web frameworks
    difficulty: medium
    text: >-
      Our design system is built in React, but some teams use Angular and Vue and are rebuilding the same
      components. How would you design the system so it can serve all three without maintaining three copies?
    expected_concepts:
      - web components as a framework-neutral core
      - thin framework wrappers for idiomatic APIs, events and forms
      - tokens and CSS as shared layers regardless of framework
      - limits of web components such as server rendering and form participation
      - cost of maintaining wrappers versus native implementations
    rubric:
      excellent: Weighs a framework-neutral core with thin wrappers against per-framework implementations, explains real limitations such as server rendering and forms, and shares tokens and styles regardless.
      good: Proposes web components with wrappers and notes some limitations.
      weak: Suggests forcing every team onto React or maintaining three full copies without analysis.
    followups:
      - How would forms built with your components work in Angular's form system?
      - What would make you keep a native React implementation anyway?
    common_errors:
      - Ignoring server rendering and hydration behaviour of web components.

  - external_key: system_design.frontend_mobile_architecture.ds_quality_pipeline
    competency_key: system_design
    topic: Quality gates for a shared component library
    difficulty: medium
    text: >-
      A small change to a shared component recently broke layouts in three products. How would you design the
      testing and release pipeline for the component library so changes like that are caught before release?
    expected_concepts:
      - visual regression tests across themes, sizes and states
      - interaction and keyboard tests per component
      - automated accessibility checks
      - testing release candidates against consumer apps
      - review of visual diffs by design and engineering
    rubric:
      excellent: Combines visual, interaction and accessibility tests in the library with consumer-app checks on release candidates, and explains how visual diffs are reviewed without slowing every change.
      good: Proposes visual regression and unit tests with review.
      weak: Relies on unit tests of props or on consumers reporting bugs.
    followups:
      - How would you keep visual tests from being flaky because of fonts or animation?
      - How would you run consumer apps' tests against an unreleased version?
    common_errors:
      - Snapshotting markup instead of rendered output.

  - external_key: system_design.frontend_mobile_architecture.ds_package_granularity
    competency_key: system_design
    topic: One package or many for a component library
    difficulty: medium
    text: >-
      For a component library with around a hundred components, would you publish one package or a package per
      component? Talk me through how you'd decide and what the consequences are for consumers.
    expected_concepts:
      - impact on bundle size and tree-shaking
      - version compatibility between components that depend on each other
      - release overhead and dependency management for consumers
      - peer dependencies on the framework and theme
      - side effects such as global CSS imports
    rubric:
      excellent: Compares both models on bundle size, versioning compatibility, release overhead and consumer experience, and explains how side-effect-free modules let a single package tree-shake well.
      good: Identifies main trade-offs and makes a reasoned choice.
      weak: Picks one without reasons or believes per-component packages are needed for small bundles.
    followups:
      - What happens when two components from different versions end up on one page?
      - How would you make sure a single package tree-shakes properly?
    common_errors:
      - Global CSS imports that pull in styles for every component.

  - external_key: system_design.frontend_mobile_architecture.ds_federated_contributions
    competency_key: system_design
    topic: Scaling contributions to a design system
    difficulty: medium
    text: >-
      The central design system team has become a bottleneck, with a backlog of component requests from product
      teams. How would you design the contribution model and technical setup so other teams can safely contribute?
    expected_concepts:
      - tiers such as core, shared and experimental components
      - contribution guidelines, templates and checklists
      - ownership and review rules with clear service levels
      - automated checks that enforce quality on contributions
      - promoting proven local components into the shared set
    rubric:
      excellent: Designs tiers of maturity, clear contribution paths backed by automated quality gates, ownership after contribution and a promotion process from local to shared.
      good: Proposes contribution guidelines and a review process.
      weak: Keeps all work in the central team or allows unreviewed contributions.
    followups:
      - Who maintains a component after another team contributes it?
      - How would you stop the experimental tier from becoming a dumping ground?
    common_errors:
      - Accepting contributions with no plan for long-term ownership.

  # ------------------------------------------------------------------ hard
  - external_key: system_design.frontend_mobile_architecture.mfe_independent_deploys
    competency_key: system_design
    topic: Independent deployment of micro-frontends
    difficulty: hard
    text: >-
      Each micro-frontend team wants to deploy whenever they like, but the composed site must stay working. How
      would you design the deployment model, including version discovery, canaries and rolling back one team's
      release without touching the others?
    expected_concepts:
      - a runtime manifest mapping each micro-frontend to its current version
      - immutable versioned assets on a CDN
      - per-team canary by serving a different manifest to a slice of traffic
      - contract or compatibility checks before promotion
      - rollback by updating the manifest entry
      - monitoring errors attributed to each micro-frontend version
    rubric:
      excellent: Designs a manifest-driven runtime with immutable assets, per-team canary and rollback, pre-promotion compatibility checks and error attribution per version.
      good: Uses a manifest or import map and versioned assets with some rollback approach.
      weak: Rebuilds and redeploys the whole site for any change, or has no rollback story.
    followups:
      - How would you test a combination of versions that has never run together?
      - A shared contract changes; how do you deploy both sides safely?
    common_errors:
      - Pointing the shell at a latest URL that changes underneath open sessions.

  - external_key: system_design.frontend_mobile_architecture.mfe_page_performance
    competency_key: system_design
    topic: Performance of a page assembled from micro-frontends
    difficulty: hard
    text: >-
      Our home page is assembled from eight micro-frontends and is now much slower than before the split. How
      would you investigate and redesign the composition so it performs well without taking away team autonomy?
    expected_concepts:
      - measuring per micro-frontend contribution to size and main-thread time
      - duplicated dependencies and runtime sharing
      - loading waterfalls from manifest, remote entry and data fetching
      - preloading critical remotes and deferring below-the-fold parts
      - performance budgets owned per team
      - server-side rendering or streaming for above-the-fold content
    rubric:
      excellent: Attributes cost to each part with measurement, fixes duplication and waterfalls, prioritises critical content through preloading and deferral, and introduces per-team budgets.
      good: Identifies duplicate dependencies and waterfalls with sensible fixes.
      weak: Proposes merging everything back together or generic tips without diagnosis.
    followups:
      - How would you show each team its own share of the page's cost?
      - Which parts would you load only when the user scrolls to them?
    common_errors:
      - Loading every micro-frontend's entry eagerly regardless of visibility.

  - external_key: system_design.frontend_mobile_architecture.mfe_integration_testing
    competency_key: system_design
    topic: Testing independently deployed micro-frontends
    difficulty: hard
    text: >-
      Teams deploy their micro-frontends independently, and last month a change in one team's event payload
      broke checkout in another. How would you design a testing strategy that catches integration breakages
      without bringing back release coordination?
    expected_concepts:
      - consumer-driven contract tests for events and shared interfaces
      - testing a candidate against the currently deployed versions of the others
      - a small set of end-to-end journeys on the composed site
      - synthetic monitoring in production after deploys
      - schemas and types published for shared contracts
    rubric:
      excellent: Combines contract tests, testing against live versions of other parts, a focused set of composed end-to-end journeys and post-deploy synthetic checks, keeping teams independent.
      good: Proposes contract tests or end-to-end tests on a shared environment.
      weak: Proposes a shared release train with manual regression testing.
    followups:
      - Which journeys would you keep in the end-to-end suite, and why so few?
      - Who owns a contract between two teams?
    common_errors:
      - Large end-to-end suites that every team must pass, which recreate coupling.

  - external_key: system_design.frontend_mobile_architecture.third_party_extension_platform
    competency_key: system_design
    topic: Letting partners extend the product UI
    difficulty: hard
    text: >-
      We want external partners to build extensions that appear inside our web app, like panels and actions on a
      record page. How would you design the extension platform so partners can build rich UI without
      compromising security or performance?
    expected_concepts:
      - sandboxed iframes on a separate origin
      - a versioned postMessage API with origin checks and capability-based permissions
      - user consent for data access per extension
      - UI kit and resizing protocol so extensions look native
      - resource limits, timeouts and the ability to disable an extension
      - review and publishing process
    rubric:
      excellent: Isolates extensions in sandboxed cross-origin frames, designs a permissioned, versioned messaging API with consent, addresses visual consistency, performance limits and kill switches.
      good: Uses iframes with a message API and some permission model.
      weak: Loads partner JavaScript directly into the app's page.
    followups:
      - How would an extension ask for the current record's data?
      - An extension starts consuming lots of CPU; what can the host do?
    common_errors:
      - Accepting messages without checking origin and source.

  - external_key: system_design.frontend_mobile_architecture.ds_native_web_parity
    competency_key: system_design
    topic: Design system parity across web, iOS and Android
    difficulty: hard
    text: >-
      Our design system has a web implementation, and the iOS and Android apps keep drifting from it. How would you
      design a cross-platform design system that stays consistent while still feeling native on each platform?
    expected_concepts:
      - shared tokens and component specifications as the contract
      - native implementations in SwiftUI and Jetpack Compose where platform behaviour matters
      - deliberate platform differences documented in the spec
      - parity tracking across platforms per component
      - screenshot testing on each platform against the spec
    rubric:
      excellent: Uses shared tokens and specifications as the contract, implements natively per platform with documented intentional differences, and tracks parity with automated screenshot checks.
      good: Shares tokens and specifications and implements per platform.
      weak: Forces web views or identical behaviour everywhere, or leaves each platform to interpret designs independently.
    followups:
      - Which components should behave differently on iOS and Android?
      - How would you know a component is out of date on one platform?
    common_errors:
      - Copying web interaction patterns that feel wrong on mobile.

  - external_key: system_design.frontend_mobile_architecture.ds_runtime_white_label_theming
    competency_key: system_design
    topic: Runtime theming for white-label customers
    difficulty: hard
    text: >-
      We sell our product white-labelled to about forty customers, each with their own colours, fonts, logos and
      some layout preferences, on web and mobile. How would you design theming so new customers are configured
      without a new build?
    expected_concepts:
      - themes as data mapped onto semantic tokens
      - loading the theme before first paint to avoid flashes
      - validation of theme values such as contrast ratios
      - caching and versioning theme configurations
      - limits on what themes can change to keep the product supportable
    rubric:
      excellent: Designs themes as validated data on semantic tokens, applies them before first render on both web and mobile, enforces accessibility constraints and limits customisation scope.
      good: Loads theme configuration at runtime and maps it to CSS variables or native styles.
      weak: Builds a separate app per customer or allows arbitrary CSS overrides.
    followups:
      - A customer picks a brand colour with poor contrast; what happens?
      - How would a mobile app get a theme update without a store release?
    common_errors:
      - Letting customers inject arbitrary CSS, which breaks with every release.

  - external_key: system_design.frontend_mobile_architecture.mfe_ssr_fragment_composition
    competency_key: system_design
    topic: Server-side composition of micro-frontend fragments
    difficulty: hard
    text: >-
      Our storefront needs server rendering for search engines and fast first paint, but it's built from
      micro-frontends owned by different teams. How would you design server-side composition of those fragments?
    expected_concepts:
      - a composition layer at the edge or server assembling HTML fragments
      - streaming fragments in order with timeouts and fallbacks
      - per-fragment caching with its own lifetime
      - hydrating each fragment independently on the client
      - de-duplicating shared scripts and styles across fragments
    rubric:
      excellent: Designs fragment-based server composition with per-fragment caching, streaming with timeouts and fallbacks, independent hydration and shared asset deduplication.
      good: Proposes server-side includes or a composition service with caching.
      weak: Renders everything in one server application, removing team independence, or skips server rendering.
    followups:
      - One fragment's service is down; what does the page look like?
      - How does a fragment's client code find the data it was rendered with?
    common_errors:
      - Letting the slowest fragment block the entire response.

  - external_key: system_design.frontend_mobile_architecture.mfe_shared_session_context
    competency_key: system_design
    topic: Shared session and user context across micro-frontends
    difficulty: hard
    text: >-
      Several micro-frontends from different teams all need the signed-in user, their tenant, locale and feature
      flags. How would you design how that context is provided and refreshed without each team building its own
      auth handling?
    expected_concepts:
      - the shell owns authentication and token refresh
      - a small versioned context API exposed to micro-frontends
      - micro-frontends never store tokens themselves
      - change notifications on tenant switch, sign-out or flag updates
      - avoiding duplicate requests for the same user context
    rubric:
      excellent: Centralises auth in the shell with a narrow versioned context API, ensures tokens stay out of micro-frontend code, and handles change events like sign-out and tenant switching cleanly.
      good: Shares user context from the shell and handles refresh centrally.
      weak: Lets each micro-frontend implement login and token storage independently.
    followups:
      - The user signs out in one part of the page; how does every other part react?
      - How would you test a micro-frontend in isolation without the shell?
    common_errors:
      - Several independent refresh flows racing and invalidating each other's tokens.
