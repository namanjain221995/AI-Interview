# Curated questions: system design for ML and LLM systems (2 of 4).
# Taking models to production: serving architecture, rollout, monitoring, pipelines and ML platforms.
# `defaults` are merged into every question (question keys win). Easy questions override round_types.
version: 1
defaults:
  role_tags: [ml, llm, data_scientist]
  kind: system_design
  round_types: [system_design, deep_technical, combined]
questions:
  # ------------------------------------------------------------- easy
  - external_key: system_design.ml_llm_systems.prediction_logging
    competency_key: mlops
    topic: What a model service should log
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      You're about to launch a model behind an API. What would you log for each prediction, and how would you
      store it so it's useful for debugging and for training the next version?
    expected_concepts:
      - request id, timestamp and model version
      - input features as actually served
      - the prediction and any decision taken from it
      - a way to join later outcomes or labels
      - sampling, retention and handling of personal data
    rubric:
      excellent: Logs version, served features, outputs and a join key for outcomes, stores them in an analysable form and addresses volume, retention and personal data.
      good: Logs inputs, outputs and model version in a reasonable store.
      weak: Relies on application error logs or logs only the prediction.
    followups:
      - Why log features at serving time instead of recomputing them later?
      - How would you keep the logs from becoming the most expensive part of the system?
    common_errors:
      - Not logging the model version, so nobody can tell which model made a bad prediction.

  - external_key: system_design.ml_llm_systems.notebook_to_service
    competency_key: mlops
    topic: From notebook model to first production service
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      A data scientist has a churn model that lives in a notebook and the business wants it used by the
      customer success tool. Walk me through the path you'd take to get it into production in a maintainable
      way.
    expected_concepts:
      - turning the notebook into versioned, tested training code
      - saving the model artifact with its preprocessing
      - deciding batch scores versus an online endpoint based on the use case
      - a scheduled pipeline for retraining or rescoring
      - basic monitoring and an owner
    rubric:
      excellent: Moves training into versioned code, packages preprocessing with the model, picks batch or online based on how the tool uses scores, and sets up scheduling, monitoring and ownership.
      good: Describes packaging and deploying the model with some thought about scheduling.
      weak: Proposes running the notebook on a schedule or copying the model file to a server by hand.
    followups:
      - How would you make sure the preprocessing at prediction time matches what training did?
      - Who gets paged if the scores stop updating?
    common_errors:
      - Separating preprocessing from the model so training and serving transform inputs differently.

  - external_key: system_design.ml_llm_systems.model_registry_basics
    competency_key: mlops
    topic: Tracking which model is in production
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Someone asks which model is currently in production for pricing, what data it was trained on and who
      approved it, and nobody knows. How would you set up the system so that question always has an answer?
    expected_concepts:
      - a model registry storing artifacts with versions
      - linking each version to code commit, data snapshot and metrics
      - stages such as staging, production and archived
      - approvals recorded with the promotion
      - deployments pulling from the registry instead of ad hoc files
    rubric:
      excellent: Designs a registry linking versions to code, data and evaluation results, with recorded promotions and deployments that only pull registered artifacts.
      good: Proposes a registry with versions and metadata.
      weak: Suggests naming conventions in a shared folder or a wiki page.
    followups:
      - How would you stop someone deploying a model that isn't in the registry?
      - What metadata would you require before a model can be promoted?
    common_errors:
      - Recording the model file but not the exact data snapshot it was trained on.

  - external_key: system_design.ml_llm_systems.first_model_dashboard
    competency_key: mlops
    topic: First monitoring for a newly launched model
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      You've just launched a model that flags support tickets as urgent. What would you put on its first
      monitoring dashboard, and which of those things would you alert on?
    expected_concepts:
      - service health such as latency, errors and throughput
      - prediction distribution such as the share of tickets flagged
      - input data checks such as missing fields or new categories
      - quality signals from agent corrections or feedback
      - alerts on sharp changes, not on every wiggle
    rubric:
      excellent: Covers service health, prediction distribution, input quality and a quality proxy from agent feedback, and distinguishes what deserves an alert from what belongs on a dashboard.
      good: Monitors service metrics and prediction distribution.
      weak: Monitors only uptime and latency.
    followups:
      - The share of tickets flagged urgent doubles overnight. What do you check first?
      - How would you get a quality signal before true labels exist?
    common_errors:
      - Treating a healthy service as proof that the model's predictions are still good.

  # ------------------------------------------------------------- medium
  - external_key: system_design.ml_llm_systems.shadow_traffic_infra
    competency_key: mlops
    topic: Infrastructure for shadow-testing models
    difficulty: medium
    text: >-
      Your team wants every candidate model to see real production traffic in shadow mode before it can serve
      users. How would you build that infrastructure so it doesn't affect production latency or cause side
      effects?
    expected_concepts:
      - asynchronous mirroring of requests to candidate models
      - isolation of shadow capacity from the production path
      - suppressing side effects such as writes or downstream calls
      - logging paired outputs for comparison at scale
      - sampling rates and cost control
    rubric:
      excellent: Mirrors traffic asynchronously with isolated capacity, prevents side effects, logs paired outputs keyed by request and builds comparison reports, with cost controlled by sampling.
      good: Describes asynchronous mirroring and comparison of outputs.
      weak: Calls the shadow model inline in the request path or ignores side effects.
    followups:
      - The shadow model needs features that the production model doesn't fetch. How do you handle that?
      - What comparisons would make you comfortable promoting the candidate?
    common_errors:
      - Running shadow inference synchronously so a slow candidate adds production latency.

  - external_key: system_design.ml_llm_systems.retraining_trigger_policy
    competency_key: mlops
    topic: Deciding when models retrain
    difficulty: medium
    text: >-
      One team retrains its demand forecast every night, another retrains only when someone notices a problem.
      How would you design a retraining system that decides when to retrain, and what would it take into
      account?
    expected_concepts:
      - scheduled, drift-triggered and performance-triggered retraining
      - cost of retraining and validation versus staleness
      - measuring how quickly performance decays to choose cadence
      - automated validation gates before promotion
      - guarding against retraining on corrupted or anomalous data
    rubric:
      excellent: Compares trigger types, chooses cadence from measured decay and cost, gates every retrain with validation and protects against training on bad data.
      good: Proposes a sensible trigger policy with validation before deployment.
      weak: Retrains as often as possible and deploys automatically with no checks.
    followups:
      - How would you measure how quickly this model goes stale?
      - Last week's data includes a one-off outage. What stops the retrain from learning it?
    common_errors:
      - Triggering retraining on input drift alone even when model performance is unaffected.

  - external_key: system_design.ml_llm_systems.human_review_queue
    competency_key: system_design
    topic: Routing uncertain predictions to human reviewers
    difficulty: medium
    text: >-
      A content moderation model handles clear cases automatically and sends uncertain ones to human reviewers.
      Design the system around that, including the review queue and how reviewer decisions flow back into the
      model.
    expected_concepts:
      - confidence thresholds tuned against reviewer capacity and error costs
      - prioritised queues with service-level targets
      - capturing reviewer decisions as labels with reviewer agreement checks
      - sampling auto-decided items for audit
      - feeding labels into retraining without biasing toward uncertain cases only
    rubric:
      excellent: Sets thresholds against capacity and error costs, prioritises the queue, audits automatic decisions by sampling, and explains how reviewer labels feed retraining without skewing the data.
      good: Designs thresholds and a queue and captures reviewer labels.
      weak: Sends a fixed percentage to review with no prioritisation or feedback loop.
    followups:
      - The queue backs up to three days. What does the system do?
      - Why might training only on reviewed items give you a biased model?
    common_errors:
      - Never auditing high-confidence automatic decisions, so systematic errors go unseen.

  - external_key: system_design.ml_llm_systems.reason_codes_service
    competency_key: mlops
    topic: Serving explanations with predictions
    difficulty: medium
    text: >-
      A lending product must give every declined applicant the main reasons for the decision, and the reasons
      have to match the model that actually made it. How would you design the serving system to produce those
      explanations?
    expected_concepts:
      - attribution methods computed per prediction
      - mapping raw features to approved, understandable reason codes
      - latency and cost of computing attributions online versus asynchronously
      - storing the explanation with the decision and model version
      - testing that explanations stay stable and consistent across model updates
    rubric:
      excellent: Designs per-decision attribution mapped to approved reason codes, weighs online versus asynchronous computation, stores explanations with the decision for audit and validates them on model changes.
      good: Computes feature attributions and maps them to reasons, stored with the decision.
      weak: Uses global feature importance as the reason for every individual decision.
    followups:
      - Two correlated features split the attribution between them. How does that affect the reasons you show?
      - How would you test explanations before a model update ships?
    common_errors:
      - Giving applicants generic global reasons that do not reflect their specific decision.

  - external_key: system_design.ml_llm_systems.publish_batch_scores
    competency_key: data_engineering
    topic: Publishing nightly scores to an online store
    difficulty: medium
    text: >-
      A nightly job scores every customer and the app reads those scores from a key-value store during the day.
      How would you design the publishing step so the app never sees a half-written or broken set of scores?
    expected_concepts:
      - write a new versioned table or keyspace and switch atomically
      - validation of row counts and score distributions before switching
      - keeping the previous version for instant rollback
      - handling customers missing from the new run
      - throttling bulk loads so they do not hurt read latency
    rubric:
      excellent: Writes to a new version, validates counts and distributions, switches atomically with rollback available, handles missing keys and protects read latency during the load.
      good: Uses a versioned write and swap with some validation.
      weak: Overwrites scores in place while the app is reading them.
    followups:
      - The job fails halfway through. What does the app serve the next morning?
      - How would you detect that tonight's scores are all suspiciously similar?
    common_errors:
      - Updating rows in place, so the app serves a mix of old and new scores for hours.

  - external_key: system_design.ml_llm_systems.shared_model_monitoring
    competency_key: mlops
    topic: Central monitoring for many teams' models
    difficulty: medium
    text: >-
      There are about two hundred models in production across twenty teams, each monitored differently or not
      at all. How would you design a shared monitoring service that teams actually adopt?
    expected_concepts:
      - a standard prediction log format as the integration point
      - automatic metrics for inputs, outputs and service health
      - pluggable delayed-label joins for quality metrics
      - per-model configuration of thresholds and alert routing to owners
      - low onboarding effort and sensible defaults
    rubric:
      excellent: Uses a standard logging contract as the integration point, computes default drift and health metrics automatically, supports delayed labels and routes alerts to owners with low onboarding effort.
      good: Designs centralised metric computation and alerting with some per-model configuration.
      weak: Builds one dashboard with no ownership, configuration or label handling.
    followups:
      - How would you avoid flooding teams with drift alerts that don't matter?
      - What's the smallest thing a team must do to onboard a model?
    common_errors:
      - Alerting on every drifting feature, which trains owners to ignore the alerts.

  - external_key: system_design.ml_llm_systems.automated_retraining_pipeline
    competency_key: mlops
    topic: Automated retraining with promotion gates
    difficulty: medium
    text: >-
      Design an automated pipeline that retrains a model weekly, evaluates it and promotes it to production
      only when it's genuinely better. What are the stages and gates?
    expected_concepts:
      - orchestrated steps from data extraction through training and evaluation
      - data validation before training
      - comparing against the current production model on the same fixed and fresh test sets
      - slice-level checks so aggregate gains do not hide regressions
      - staged deployment after the gate and recorded lineage
    rubric:
      excellent: Defines orchestrated stages with data validation, champion-versus-challenger comparison on consistent data including slices, and a staged rollout with lineage and a manual override.
      good: Lists sensible stages with an evaluation gate before deployment.
      weak: Retrains and deploys automatically with no comparison against the current model.
    followups:
      - The new model is better overall but worse for one important customer segment. What does the pipeline do?
      - How do you keep the evaluation set from going stale?
    common_errors:
      - Comparing the new model on fresh data against the old model's historical metrics on different data.

  - external_key: system_design.ml_llm_systems.upstream_data_contracts
    competency_key: data_engineering
    topic: Protecting models from upstream data changes
    difficulty: medium
    text: >-
      Your models depend on tables owned by other teams, and twice this quarter someone changed a column's
      meaning without telling you. How would you design the data flow so changes like that are caught before
      they reach training or serving?
    expected_concepts:
      - data contracts with schemas and semantic expectations
      - automated checks on distributions, nulls and categories at ingestion
      - versioned interfaces so breaking changes require a new version
      - lineage so producers know who consumes their data
      - failing safely by holding the last good data
    rubric:
      excellent: Combines explicit contracts and lineage with automated distribution checks at ingestion, versioned breaking changes and a safe fallback to the last good data.
      good: Adds validation checks and some agreement with producer teams.
      weak: Relies on asking other teams to announce changes.
    followups:
      - A column's unit changes from dollars to cents and the schema stays the same. How would you catch it?
      - Who should own the contract, the producer or the consumer?
    common_errors:
      - Checking only schemas, which misses changes in meaning where types stay the same.

  - external_key: system_design.ml_llm_systems.headline_bandit_service
    competency_key: system_design
    topic: A bandit service for choosing content variants
    difficulty: medium
    text: >-
      Editors write several headlines for each article and want the system to learn which one works best while
      the article is still fresh. How would you design a service that does this across thousands of articles?
    expected_concepts:
      - multi-armed bandit such as Thompson sampling per article
      - low-latency arm selection at page render
      - reward events joined back to the chosen variant
      - delayed and noisy rewards and choosing the reward metric
      - state storage and updates at scale
    rubric:
      excellent: Designs per-article bandits with fast selection, a reward pipeline joined by impression id, sensible reward choice and handling of delay and low traffic.
      good: Uses a bandit with a reasonable update loop.
      weak: Runs fixed A/B tests that finish after the article is no longer read.
    followups:
      - An article gets only a few hundred views. What does your service do?
      - Why might optimising for clicks reward misleading headlines, and how would you guard against it?
    common_errors:
      - Updating arm statistics from clicks without recording which variant was actually shown.

  - external_key: system_design.ml_llm_systems.claims_document_pipeline
    competency_key: system_design
    topic: Classifying and routing incoming documents
    difficulty: medium
    text: >-
      An insurer receives thousands of scanned claim documents a day and wants them classified, key fields
      extracted and routed to the right team. Design that pipeline.
    expected_concepts:
      - ingestion and OCR with quality checks
      - document classification and field extraction models
      - confidence thresholds with human review for uncertain cases
      - queue-based asynchronous processing with retries
      - auditing and capturing corrections as training data
    rubric:
      excellent: Designs an asynchronous pipeline from OCR through classification and extraction, human review driven by confidence thresholds, retries, audit trail and a feedback loop from corrections.
      good: Describes the main stages and a review step for low confidence.
      weak: Treats it as a single model call with no handling of bad scans or uncertainty.
    followups:
      - A batch of faxed documents comes through barely readable. Where does your pipeline catch that?
      - How would you measure extraction accuracy per field in production?
    common_errors:
      - Trusting extracted fields without per-field confidence or validation rules.

  - external_key: system_design.ml_llm_systems.lending_decision_lineage
    competency_key: mlops
    topic: Reproducing past model decisions for audit
    difficulty: medium
    text: >-
      In a regulated lending product, an auditor may ask you to explain and reproduce a specific decision made
      eighteen months ago. How would you design the ML system so you can do that?
    expected_concepts:
      - immutable storage of inputs, outputs, model version and policy version per decision
      - registry retaining old model artifacts and environments
      - code and data lineage for each model version
      - ability to replay a decision with the original artifact
      - retention policies aligned with regulation
    rubric:
      excellent: Stores immutable per-decision records with versions, retains artifacts and environments to replay decisions exactly, and links each model to its code and data under suitable retention.
      good: Logs decisions with model versions and keeps old models.
      weak: Plans to retrain the old model from scratch when asked.
    followups:
      - The old model depends on a library version you no longer support. How do you still replay it?
      - What if a feature's definition changed since then?
    common_errors:
      - Storing the model version but not the exact feature values used for the decision.

  - external_key: system_design.ml_llm_systems.business_metric_anomalies
    competency_key: machine_learning
    topic: Anomaly detection over many business metrics
    difficulty: medium
    text: >-
      A company wants automatic alerts when any of about a million business time series, like sales per store
      per product, behaves unusually. How would you design that system so people don't drown in alerts?
    expected_concepts:
      - forecasting baselines with seasonality per series
      - scalable batch or streaming scoring across many series
      - hierarchy so related anomalies roll up into one alert
      - ranking anomalies by business impact
      - feedback on alerts to tune thresholds
    rubric:
      excellent: Uses seasonal baselines at scale, groups related anomalies through the hierarchy, ranks by impact and closes the loop with user feedback on alerts.
      good: Proposes per-series baselines with thresholds and some grouping.
      weak: Uses fixed thresholds per series and alerts on every breach.
    followups:
      - A public holiday shifts sales everywhere. How does your system avoid a flood of alerts?
      - How would you handle series with very little data?
    common_errors:
      - Ignoring seasonality, so every Monday morning looks anomalous.

  - external_key: system_design.ml_llm_systems.central_embedding_service
    competency_key: mlops
    topic: A shared embedding service for many teams
    difficulty: medium
    text: >-
      Several teams compute their own text embeddings for search, recommendations and classification. You're
      asked to build a central embedding service. How would you design it, including what happens when the
      embedding model changes?
    expected_concepts:
      - online endpoint and batch path for bulk embedding
      - versioned models with every vector tagged by version
      - stored embeddings for shared entities to avoid recomputation
      - coordinated migration with backfill and dual versions during transition
      - capacity planning on GPUs and per-team quotas
    rubric:
      excellent: Offers online and batch paths, tags every vector with its model version, plans backfills and dual-running for upgrades so consumers migrate safely, and handles quotas and capacity.
      good: Designs a versioned service with batch and online access.
      weak: Upgrades the model in place, silently mixing incompatible vectors across teams.
    followups:
      - One team needs the old model for six more months. How does your service support that?
      - How would you prioritise a large backfill against live traffic?
    common_errors:
      - Not recording which model produced each stored vector.

  # ------------------------------------------------------------- hard
  - external_key: system_design.ml_llm_systems.ml_platform_roadmap
    competency_key: mlops
    topic: Designing an ML platform for a growing team
    difficulty: hard
    text: >-
      A company has fifteen data scientists who each deploy models their own way, with a mix of cron jobs,
      notebooks and hand-built APIs. You're asked to design the ML platform for the next two years. What would
      you build first, and how would the pieces fit together?
    expected_concepts:
      - understanding the most painful bottlenecks before building
      - paved path for training, registry, deployment and monitoring
      - prioritising by impact, such as reproducible training and safe deployment first
      - adopting managed or open-source components versus building
      - migration plan for existing models and adoption incentives
      - success metrics such as time to production and incident counts
    rubric:
      excellent: Starts from measured pain points, sequences a paved path with clear priorities, makes build-versus-buy decisions explicitly and includes migration, adoption and success metrics.
      good: Describes a sensible set of platform components with some prioritisation.
      weak: Lists every possible tool to build at once with no sequencing or adoption plan.
    followups:
      - What would you deliberately not build in the first year?
      - How would you convince teams to move their existing models onto the platform?
    common_errors:
      - Building an elaborate platform before any team has committed to use it.

  - external_key: system_design.ml_llm_systems.online_learning_guards
    competency_key: machine_learning
    topic: Continuously updating models from streaming data
    difficulty: hard
    text: >-
      For a fast-changing ad marketplace, the team wants the model to update continuously from streaming data
      instead of daily retrains. How would you design that system, and what would stop a bad stream of data
      from wrecking the model?
    expected_concepts:
      - streaming training consuming joined labels with bounded delay
      - frequent checkpoints published to serving with versioning
      - automated validation of each checkpoint on held-out recent data
      - anomaly detection on incoming data and labels
      - fast rollback to a known good checkpoint
      - periodic full retrains to correct drift in incremental updates
    rubric:
      excellent: Designs streaming training with validated, versioned checkpoints, guards on input data, fast rollback and a reconciliation retrain, and explains the trade-off between freshness and stability.
      good: Describes streaming updates with some validation and rollback.
      weak: Pushes every update to production immediately with no checks.
    followups:
      - A bot attack floods the stream with fake clicks for an hour. What happens?
      - How would you test that continuous updates actually beat daily retrains?
    common_errors:
      - Having no way to roll back to a previous checkpoint quickly.

  - external_key: system_design.ml_llm_systems.multi_region_model_rollout
    competency_key: distributed_systems
    topic: Serving and rolling out models across regions
    difficulty: hard
    text: >-
      Your ranking models serve users from five regions with separate infrastructure. How would you design
      model distribution and rollout so a bad model doesn't hit every region at once, and users don't get
      inconsistent behaviour mid-session?
    expected_concepts:
      - artifact replication to regional stores from a central registry
      - region-by-region staged rollout with automated health gates
      - version pinning so features and model versions match within a region
      - session or user stickiness during rollout
      - handling regional data differences and fallback when a region lags
    rubric:
      excellent: Replicates artifacts centrally to regions, stages rollouts with automated gates, keeps model and feature versions consistent per region, pins sessions and handles regional lag and failover.
      good: Staged regional rollouts with health checks and artifact replication.
      weak: Deploys everywhere at once or ignores consistency between model and features.
    followups:
      - A region's feature pipeline is a day behind. Can it run the new model?
      - During failover, users move to another region on a different model version. What happens?
    common_errors:
      - Rolling out a model to a region whose feature pipeline has not yet been updated to match.

  - external_key: system_design.ml_llm_systems.continuous_skew_detection
    competency_key: mlops
    topic: Continuously detecting training-serving skew
    difficulty: hard
    text: >-
      Training-serving skew has caused three incidents this year, each found weeks late. How would you design
      a system that continuously detects skew between what models saw in training and what they get in
      production?
    expected_concepts:
      - logging served features and recomputing them through the offline path for comparison
      - per-feature distribution and row-level mismatch metrics
      - distinguishing skew from genuine drift over time
      - prioritising features by importance for alerting
      - integrating checks into launches as well as ongoing monitoring
    rubric:
      excellent: Compares served features against offline recomputation at row level and in distribution, separates skew from drift, weights alerts by feature importance and adds pre-launch checks.
      good: Compares training and serving distributions and alerts on large differences.
      weak: Relies on model accuracy dropping to reveal skew.
    followups:
      - How do you tell skew from real-world drift when both show up as distribution changes?
      - How much of the traffic would you sample for row-level comparison?
    common_errors:
      - Comparing distributions only, which can miss row-level bugs that keep aggregates similar.

  - external_key: system_design.ml_llm_systems.model_cascade
    competency_key: system_design
    topic: Cascading cheap and expensive models
    difficulty: hard
    text: >-
      An image moderation service runs a large, accurate model that costs too much at full traffic. Design a
      cascade where cheaper checks handle most traffic and only hard cases reach the expensive model.
    expected_concepts:
      - cheap first stage such as hashing known content and a small model
      - confidence thresholds for routing to the next stage
      - choosing thresholds against cost, latency and error trade-offs
      - monitoring the share routed at each stage and per-stage accuracy
      - asynchronous stages where latency allows
    rubric:
      excellent: Designs a multi-stage cascade with known-content matching and a small model, sets routing thresholds from measured cost and error trade-offs and monitors each stage and the routing mix.
      good: Proposes a two-stage cascade that routes on confidence thresholds.
      weak: Samples traffic randomly for the expensive model.
    followups:
      - The cheap model becomes overconfident after an update. What breaks, and how would you notice?
      - How would you set the threshold if errors in one direction cost far more than the other?
    common_errors:
      - Routing on raw scores from an uncalibrated small model.

  - external_key: system_design.ml_llm_systems.multi_model_decision_service
    competency_key: distributed_systems
    topic: Combining models from several teams in one decision
    difficulty: hard
    text: >-
      A payment risk decision combines six models owned by four teams, each with its own service, and the
      whole decision must finish in about two hundred milliseconds. How would you design the orchestration so
      one slow or broken model doesn't break checkout?
    expected_concepts:
      - parallel fan-out with per-call timeouts and a total budget
      - defined fallback values or partial-decision policies per model
      - versioned contracts between the orchestrator and model services
      - logging which models contributed to each decision
      - testing the combined decision when any one model changes
    rubric:
      excellent: Fans out in parallel with strict budgets, defines explicit degraded policies per model, versions contracts, logs contributions and tests the combined decision on component changes.
      good: Uses parallel calls with timeouts and fallbacks.
      weak: Calls models sequentially or lets any failure fail the decision.
    followups:
      - One team ships a model whose score range changed. How does your design catch that?
      - What decision is made if two of six models time out?
    common_errors:
      - Assuming each model's output scale is stable across versions owned by other teams.

  - external_key: system_design.ml_llm_systems.many_regional_models
    competency_key: mlops
    topic: Retraining hundreds of per-segment models
    difficulty: hard
    text: >-
      A retailer has a separate demand forecast for each of about eight hundred stores, retrained weekly. How
      would you design the training and deployment system so failures are isolated and nobody has to review
      eight hundred models by hand?
    expected_concepts:
      - parallel orchestration with per-model tasks and retries
      - automated per-model validation against a baseline
      - deploying only models that pass and keeping the last good model otherwise
      - aggregate dashboards highlighting outliers for review
      - considering a global model with store features as an alternative
    rubric:
      excellent: Orchestrates per-store training with isolated failure, automated per-model gates with fallback to the last good model, exception-based review and a reasoned comparison with a single global model.
      good: Parallelises training with automated validation and fallbacks.
      weak: Retrains all models in one job that fails entirely if one store's data is bad.
    followups:
      - When would you replace eight hundred models with one global model?
      - A new store opens with two weeks of data. What does your system do?
    common_errors:
      - Requiring all models to succeed before any are deployed.

  - external_key: system_design.ml_llm_systems.deletion_requests_in_ml
    competency_key: mlops
    topic: Honouring data deletion requests across ML systems
    difficulty: hard
    text: >-
      Users can request that their data be deleted, and legal says that has to cover your ML systems too.
      How would you design deletion across feature stores, training datasets, logs and trained models?
    expected_concepts:
      - inventory and lineage of where user data lives
      - deletion propagation to feature stores, logs and datasets
      - dataset versioning that supports removal and rebuilding
      - policy for trained models, such as retraining on schedule without deleted data
      - auditable records that deletion completed within deadlines
    rubric:
      excellent: Builds lineage to find every copy, propagates deletion through stores, logs and dataset versions, sets a clear policy for models already trained and proves completion with audit records.
      good: Covers deleting from stores and datasets and has a plan for models.
      weak: Deletes from the main database only and ignores derived data and models.
    followups:
      - Immutable dataset snapshots are central to your reproducibility story. How do you reconcile that with deletion?
      - How would you prove to an auditor that a user's data is gone?
    common_errors:
      - Forgetting derived copies such as cached features, embeddings and logged training examples.
