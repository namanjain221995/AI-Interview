# Curated system design questions: frontend and mobile client architecture, part 1.
# Large single-page apps and web client architecture: codebase structure, rendering strategy,
# client data and state, routing and loading, telemetry, i18n, forms, offline web, deploys,
# heavy in-browser workloads and legacy migration.
# round_types follow difficulty: easy -> system_design/combined; medium and hard -> system_design/deep_technical/combined.
version: 1
defaults:
  role_tags: [frontend, mobile, fullstack]
  kind: system_design
  round_types: [system_design, deep_technical, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: system_design.frontend_mobile_architecture.spa_codebase_for_many_teams
    competency_key: system_design
    topic: Structuring a single-page app for several teams
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Say you're kicking off a new single-page app that five product teams will build features in over the
      next few years. How would you lay out the codebase so each team can work on its own features without
      constantly stepping on the others?
    expected_concepts:
      - feature-based folders or packages instead of grouping by file type
      - a shared layer for design system, API client and utilities with clear ownership
      - enforced import boundaries (lint rules or package boundaries)
      - routing owned per feature and lazily loaded
      - code ownership files and review rules per area
    rubric:
      excellent: Proposes feature-oriented modules with an explicit shared layer, explains how boundaries are enforced by tooling rather than convention, and links the structure to ownership, routing and lazy loading.
      good: Suggests grouping by feature with some shared code and mentions ownership, but enforcement or loading is vague.
      weak: Groups by technical type (all components, all hooks) or says structure does not matter much.
    followups:
      - How would you stop one feature importing another feature's internals?
      - What would make you move something into the shared layer, and who approves it?
    common_errors:
      - A giant shared folder that every team edits, which becomes a coupling hotspot.

  - external_key: system_design.frontend_mobile_architecture.rendering_strategy_per_route
    competency_key: system_design
    topic: Choosing rendering per route in a mixed product
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Picture a product with public marketing pages, a large searchable help centre and a logged-in
      dashboard full of live charts. How would you decide how each of those areas gets rendered, and what
      would you pick for each?
    expected_concepts:
      - static generation or caching for marketing pages
      - server rendering or incremental regeneration for searchable, SEO-relevant help content
      - client rendering behind auth for the highly interactive dashboard
      - criteria such as SEO, freshness, personalisation and interactivity
      - CDN caching implications of each choice
    rubric:
      excellent: Picks a rendering approach per area with clear reasons tied to SEO, freshness, personalisation and interactivity, and mentions how each choice affects caching and hosting.
      good: Makes sensible choices for each area with partial reasoning.
      weak: Applies one rendering mode to everything without considering the differences between the areas.
    followups:
      - The help centre articles change several times a day; how does that affect your choice?
      - What would push you to server render part of the dashboard?
    common_errors:
      - Assuming server rendering is always faster for logged-in, data-heavy screens.

  - external_key: system_design.frontend_mobile_architecture.product_listing_page
    competency_key: system_design
    topic: Product listing page for an online store
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Let's design the product listing page for an online store, the page with a grid of products, filters on
      the side and sorting at the top. Walk me through how you'd build the front end of that page.
    expected_concepts:
      - filters, sort and page kept in the URL for sharing and back button
      - server or edge rendering of the first page for speed and SEO
      - pagination or load-more with cursors
      - responsive, lazily loaded images with fixed aspect ratios
      - loading, empty and error states
      - debouncing filter changes and cancelling stale requests
    rubric:
      excellent: Covers URL-driven state, first-render speed, pagination, image handling and stale-request handling, and explains the trade-offs between infinite scroll and paged results for a store.
      good: Covers the main components and data fetching with a couple of performance points.
      weak: Lists UI components only, without discussing state, data loading or performance.
    followups:
      - How would you keep the page fast on a mid-range phone on a slow network?
      - What happens when a user clicks a product and then presses back?
    common_errors:
      - Keeping filters only in component state so links and back navigation lose them.

  - external_key: system_design.frontend_mobile_architecture.in_app_notification_centre
    competency_key: system_design
    topic: In-app notification centre
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      We want a notification bell in the header of our web app that shows an unread count and opens a list of
      recent notifications. How would you design the client side of that feature?
    expected_concepts:
      - fetching an initial page plus unread count
      - receiving new notifications in real time or by polling
      - marking as read optimistically and syncing with the server
      - paginating older notifications
      - keeping counts consistent across open tabs
    rubric:
      excellent: Designs data loading, real-time updates, read state with optimistic updates and pagination, and considers consistency across tabs and devices.
      good: Covers fetching, display and marking as read with a reasonable update mechanism.
      weak: Only describes the visual component, or polls the full list constantly without considering cost.
    followups:
      - How would the unread count stay correct if the user reads notifications on their phone?
      - What would you change if some users get thousands of notifications a day?
    common_errors:
      - Recomputing the unread count on the client from a partial list.

  # ---------------------------------------------------------------- medium
  - external_key: system_design.frontend_mobile_architecture.route_chunking_strategy
    competency_key: frontend_react
    topic: Loading strategy for a very large admin app
    difficulty: medium
    text: >-
      Imagine an internal admin app with around two hundred screens, and the initial download has grown to
      several megabytes of JavaScript. How would you design its loading strategy so the first screen is quick
      but moving between screens still feels instant?
    expected_concepts:
      - route-level code splitting as the primary boundary
      - a deliberate shared vendor chunk versus per-route dependencies
      - prefetching likely next routes on hover, idle time or visibility
      - per-route bundle budgets enforced in CI
      - long-term caching with content-hashed file names
      - analysing bundle composition to find heavy libraries
    rubric:
      excellent: Designs route-based splitting with a clear chunking policy, intent-based prefetching and caching, and adds measurement plus CI budgets so the problem does not return.
      good: Proposes route-level splitting and some prefetching or caching, with limited thought about governance.
      weak: Suggests minifying or upgrading the bundler without restructuring how code is loaded.
    followups:
      - How would you avoid a slow spinner every time someone opens a rarely used screen?
      - One heavy charting library is used on twenty screens; where should it live?
    common_errors:
      - Splitting into hundreds of tiny chunks and creating request waterfalls.

  - external_key: system_design.frontend_mobile_architecture.shared_entity_state
    competency_key: frontend_react
    topic: One record shown and edited in many places
    difficulty: medium
    text: >-
      In a CRM web app, the same customer record appears in a list, a detail panel and a side drawer, and
      people can edit it from any of them. How would you design the client-side data layer so all three always
      show the same thing?
    expected_concepts:
      - a single cache keyed by entity id as the source of truth
      - separating server state from local UI state
      - invalidation or targeted cache updates after mutations
      - optimistic updates with rollback on failure
      - handling updates pushed from the server or other users
    rubric:
      excellent: Designs one keyed source of truth for server data, explains how mutations update or invalidate every view, and covers optimistic updates, rollback and external changes.
      good: Uses a shared cache or store and refetches after edits so views stay consistent.
      weak: Copies the record into each component's state and syncs them with events or props.
    followups:
      - How would you handle a list that shows a summary while the drawer needs the full record?
      - Two users edit the same customer at once; what does each of them see?
    common_errors:
      - Duplicating fetched data into several stores that drift apart.

  - external_key: system_design.frontend_mobile_architecture.event_tracking_sdk
    competency_key: system_design
    topic: Product analytics tracking layer for many teams
    difficulty: medium
    text: >-
      Twenty teams want to send product analytics events from our web app, and today every team calls the
      vendor's script in its own way. How would you design a shared tracking layer that keeps the data trustworthy?
    expected_concepts:
      - typed event schemas in a shared registry with review
      - batching and sending with sendBeacon or keepalive on page hide
      - consent handling and removing personal data before sending
      - a vendor-neutral interface so the backend tool can change
      - validation in development and monitoring of malformed events
    rubric:
      excellent: Proposes a schema-governed, typed API with batching, reliable delivery on page unload, consent and data minimisation, and a vendor abstraction, plus a way to detect bad events.
      good: Suggests a wrapper with common event names and batching, with some attention to consent.
      weak: Suggests a naming convention document and leaves each team to call the vendor directly.
    followups:
      - How would you avoid losing events when the user closes the tab?
      - How do teams add a new event without waiting days for a central team?
    common_errors:
      - Ignoring consent and sending identifiers before the user has agreed.

  - external_key: system_design.frontend_mobile_architecture.i18n_rtl_architecture
    competency_key: frontend_react
    topic: Localising a web app into many languages including right-to-left
    difficulty: medium
    text: >-
      Our web app is launching in twelve languages, including Arabic and Hebrew. How would you design the
      localisation setup, from how strings are written in code through to how translations reach users?
    expected_concepts:
      - message keys with ICU plural and select formatting
      - loading translation bundles per locale and per route
      - logical CSS properties and dir attribute for right-to-left layouts
      - locale-aware number, date and currency formatting with Intl
      - extraction and translator workflow, with pseudo-localisation to catch issues
      - fallback locale for missing strings
    rubric:
      excellent: Covers message formatting, lazy-loaded bundles, right-to-left layout through logical properties, Intl formatting and the translation workflow including pseudo-localisation and fallbacks.
      good: Describes translation files, a library and basic right-to-left handling.
      weak: Proposes string concatenation or mirroring the layout with one CSS flip without considering plurals or formatting.
    followups:
      - How would you catch a hard-coded English string before it ships?
      - Which parts of the UI should not be mirrored in right-to-left languages?
    common_errors:
      - Building sentences by concatenating translated fragments.

  - external_key: system_design.frontend_mobile_architecture.dashboard_widget_plugins
    competency_key: system_design
    topic: Customisable dashboard with widgets from several teams
    difficulty: medium
    text: >-
      We want a dashboard where users pick and arrange widgets, and the widgets are built by different teams.
      How would you design the widget contract and the host page so it stays fast and one broken widget can't
      take everything down?
    expected_concepts:
      - a widget interface covering configuration, data needs, sizing and lifecycle
      - lazy loading each widget's code
      - error boundaries and timeouts per widget
      - persisting each user's layout and configuration on the server
      - deduplicating shared data requests and loading only visible widgets
    rubric:
      excellent: Defines a clear widget contract, isolates failures per widget, loads code and data lazily with shared request deduplication, and stores layouts server-side with versioning.
      good: Describes a widget registry, lazy loading and error isolation.
      weak: Hard-codes widgets into the page or ignores failure isolation and loading cost.
    followups:
      - A team needs to change a widget's configuration format; what happens to saved layouts?
      - How would you stop twelve widgets from each fetching the same user data?
    common_errors:
      - Letting widgets reach into the host's global state directly.

  - external_key: system_design.frontend_mobile_architecture.command_palette_search
    competency_key: system_design
    topic: Global command palette and quick search
    difficulty: medium
    text: >-
      Let's design a keyboard-driven command palette for a large web app, where users press a shortcut and can
      jump to any project, person, document or action. How would you build it so results feel instant?
    expected_concepts:
      - local index of actions and recent items for zero-latency results
      - server search for large entity sets, debounced and cancellable
      - merging and ranking results from several sources
      - accessible combobox with keyboard navigation
      - caching recent queries and respecting permissions
    rubric:
      excellent: Combines a local index with cancellable server search, explains ranking and merging, and covers keyboard accessibility and permission-aware results.
      good: Describes debounced server search with keyboard navigation and some caching.
      weak: Sends a request per keystroke and renders whatever arrives last, with no accessibility consideration.
    followups:
      - How would you rank a document the user opened yesterday against a better text match?
      - What would you do about results the user is no longer allowed to see?
    common_errors:
      - Letting a slow earlier response overwrite newer results.

  - external_key: system_design.frontend_mobile_architecture.schema_driven_forms
    competency_key: system_design
    topic: Schema-driven form engine
    difficulty: medium
    text: >-
      An insurance company has around three hundred forms that change often, with conditional sections and
      complex validation. How would you design a form engine so most forms can be defined as data rather than
      hand-written code?
    expected_concepts:
      - a versioned form schema describing fields, layout, conditions and validation
      - a renderer mapping field types to design-system components
      - validation rules shared with or mirrored by the server
      - saving drafts and resuming partially completed forms
      - escape hatches for custom fields
      - accessibility of generated forms
    rubric:
      excellent: Designs a versioned schema with conditional logic, a component registry, shared validation and draft saving, and explains where custom code is still allowed and how schema changes affect in-progress submissions.
      good: Describes a JSON schema and a renderer with validation and conditional fields.
      weak: Suggests writing every form by hand or a schema with no story for validation or versioning.
    followups:
      - A form definition changes while a customer has a half-finished draft; what happens?
      - How would you test hundreds of forms without testing each one by hand?
    common_errors:
      - Building a general programming language into the schema that nobody can maintain.

  - external_key: system_design.frontend_mobile_architecture.social_feed_web
    competency_key: system_design
    topic: Infinite social feed on the web
    difficulty: medium
    text: >-
      Let's design the web client for an infinite social feed with text, images and video posts. How would you
      handle loading, rendering and keeping the user's place as they scroll for a long time?
    expected_concepts:
      - cursor-based pagination with deduplication by post id
      - list virtualisation with variable item heights
      - lazy loading media and autoplaying only visible video
      - showing a new posts pill instead of shifting content
      - restoring scroll position after navigating to a post and back
    rubric:
      excellent: Covers cursor pagination with dedup, virtualisation with variable heights, media loading policy, non-disruptive new content and scroll restoration, with attention to memory over long sessions.
      good: Covers pagination, lazy images and some form of virtualisation.
      weak: Appends items forever without virtualisation and refetches the whole feed on return.
    followups:
      - How do you keep memory under control after the user scrolls through a thousand posts?
      - How would you insert ads or recommendations without layout jumps?
    common_errors:
      - Inserting new items above the viewport and pushing the content the user is reading.

  - external_key: system_design.frontend_mobile_architecture.capability_based_ui_permissions
    competency_key: system_design
    topic: Permission-aware UI for multi-tenant apps
    difficulty: medium
    text: >-
      In a multi-tenant business app, what users can see and do depends on their role, their plan and
      per-tenant settings. How would you design the way the front end learns about permissions and applies them
      across hundreds of screens?
    expected_concepts:
      - fetching a capability set from the server rather than hard-coding role names
      - a single helper or component for gating routes, actions and fields
      - server-side enforcement remains the real control
      - refreshing capabilities when the user switches tenant or an admin changes roles
      - consistent UX for hidden versus disabled actions
    rubric:
      excellent: Proposes server-issued capabilities consumed through one gating mechanism, keeps the server as the enforcement point, and handles tenant switching and live permission changes.
      good: Centralises permission checks in the client and notes that the server must also enforce.
      weak: Scatters role-name checks through components or treats client hiding as security.
    followups:
      - What should happen in the UI if an admin removes a permission while the user is mid-task?
      - How would you test that a new screen respects permissions?
    common_errors:
      - Checking role names in components, so a new role means editing dozens of files.

  - external_key: system_design.frontend_mobile_architecture.pwa_field_service
    competency_key: system_design
    topic: Offline-capable web app for field technicians
    difficulty: medium
    text: >-
      Field technicians use our web app on tablets in basements and plant rooms with no signal. How would you
      design it as an installable web app that keeps working offline and syncs when it reconnects?
    expected_concepts:
      - service worker precaching of the app shell with versioned updates
      - IndexedDB for job data and a queue of pending changes
      - syncing on reconnect with retries and idempotent requests
      - storage limits, persistence requests and eviction risk
      - clear offline and pending-sync indicators in the UI
      - handling app updates while unsynced data exists
    rubric:
      excellent: Designs the shell caching, local data store, outbox sync with idempotency and the update flow, and accounts for browser storage limits and visible sync state.
      good: Uses a service worker and IndexedDB with a basic sync on reconnect.
      weak: Relies on the browser cache alone or assumes background sync works everywhere.
    followups:
      - How would you roll out a new app version without losing a technician's unsynced work?
      - Which browsers' limitations would you plan around?
    common_errors:
      - Storing pending work in localStorage and hitting size limits or blocking the main thread.

  - external_key: system_design.frontend_mobile_architecture.frontend_monorepo_structure
    competency_key: system_design
    topic: Monorepo for several web apps and shared packages
    difficulty: medium
    text: >-
      We have four web apps and a dozen shared packages, and builds and CI keep getting slower. How would you
      structure a monorepo for this so teams stay fast as it grows?
    expected_concepts:
      - workspace packages with explicit dependencies and boundaries
      - task graph with build caching, local and remote
      - running only affected builds and tests in CI
      - deciding between internal source packages and prebuilt packages
      - consistent tooling versions and dependency policies
    rubric:
      excellent: Designs package boundaries, a cached task graph and affected-only CI, discusses how shared packages are consumed, and addresses dependency version policy.
      good: Proposes workspaces with caching and some affected-only CI.
      weak: Proposes faster CI machines or splitting into many repositories without addressing the coupling.
    followups:
      - How would you stop a change in a low-level utility package from rebuilding everything every time?
      - When might separate repositories actually be the better choice?
    common_errors:
      - Allowing every app to import any file from any package.

  - external_key: system_design.frontend_mobile_architecture.client_experimentation
    competency_key: system_design
    topic: Running A/B experiments in the client
    difficulty: medium
    text: >-
      The product team wants to run dozens of A/B experiments at once on our web app, including on server
      rendered pages. How would you design the client side of experimentation so results are reliable and users
      don't see the page flicker between variants?
    expected_concepts:
      - deterministic assignment from a stable id, done server-side or at the edge
      - passing assignments into rendering to avoid flicker
      - logging exposure only when the variant is actually shown
      - cache keys that account for variants on CDN-cached pages
      - cleaning up finished experiments and their code paths
    rubric:
      excellent: Places assignment before render, logs exposure accurately, handles caching of variant pages and plans experiment cleanup.
      good: Uses a stable assignment and some way to avoid flicker.
      weak: Swaps content in the browser after load and logs exposure for every user regardless of what they saw.
    followups:
      - How would you cache a page that has three experiments running on it?
      - What goes wrong if exposure is logged at assignment time instead of render time?
    common_errors:
      - Assigning variants randomly on each visit so users switch between them.

  # ------------------------------------------------------------------ hard
  - external_key: system_design.frontend_mobile_architecture.browser_spreadsheet
    competency_key: system_design
    topic: Browser-based spreadsheet with formulas
    difficulty: hard
    text: >-
      Let's design a spreadsheet that runs in the browser, with sheets of a hundred thousand rows, formulas that
      reference other cells and smooth scrolling. How would you architect the rendering and the calculation engine?
    expected_concepts:
      - virtualised or canvas-based rendering of only visible cells
      - sparse cell storage rather than full arrays
      - dependency graph with incremental recalculation of affected cells
      - running calculation in a web worker off the main thread
      - cycle detection and error values
      - edit history for undo and efficient persistence of changes
    rubric:
      excellent: Separates rendering from a worker-based calculation engine with a dependency graph and incremental recalculation, uses sparse storage and viewport rendering, and addresses cycles, undo and saving deltas.
      good: Uses virtualisation and a dependency graph, with some thought about performance.
      weak: Renders a full DOM table and recalculates every formula on every change.
    followups:
      - A user pastes ten thousand formulas at once; what happens in your design?
      - How would you add a second user editing the same sheet later?
    common_errors:
      - Recalculating the whole sheet on each edit.

  - external_key: system_design.frontend_mobile_architecture.multi_tab_connection_sharing
    competency_key: system_design
    topic: Sharing one real-time connection across many tabs
    difficulty: hard
    text: >-
      Operations staff keep ten or more tabs of our monitoring web app open all day, and each one opens its own
      WebSocket and refreshes its own auth token, which is overloading the servers. How would you redesign the
      client so tabs share work?
    expected_concepts:
      - a SharedWorker or a leader tab elected through BroadcastChannel or Web Locks
      - one connection fanning out messages to all tabs
      - coordinated token refresh so only one tab refreshes
      - leader failover when the leading tab closes or sleeps
      - per-tab subscriptions aggregated into one upstream subscription set
      - fallbacks for browsers without SharedWorker
    rubric:
      excellent: Designs a single shared connection with leader election or a shared worker, aggregated subscriptions, coordinated auth refresh and robust failover, and notes browser support and background-tab throttling.
      good: Proposes BroadcastChannel or a shared worker so one tab holds the connection.
      weak: Suggests longer polling intervals or limiting the number of tabs users may open.
    followups:
      - The leader tab is backgrounded and its timers are throttled; what happens to the others?
      - How does a tab know which subscriptions are still needed after another tab closes?
    common_errors:
      - Forgetting that tabs can be frozen or discarded without a close event.

  - external_key: system_design.frontend_mobile_architecture.streaming_ssr_personalised
    competency_key: system_design
    topic: Fast personalised product pages with server rendering
    difficulty: hard
    text: >-
      A retailer's product pages must load very fast from search results, but parts of each page are
      personalised, like price for the signed-in customer, stock near them and recommendations. How would you
      design rendering and caching for those pages?
    expected_concepts:
      - caching the shared shell and product content at the CDN or edge
      - streaming or deferring personalised fragments
      - hydrating only interactive islands to cut JavaScript cost
      - cache keys and variation that avoid leaking one user's data to another
      - fallbacks when personalisation services are slow
    rubric:
      excellent: Splits the page into cacheable and personalised parts, streams or defers the personalised parts with timeouts and fallbacks, limits hydration cost and explicitly prevents cross-user cache leaks.
      good: Caches the static parts and loads personalised data separately on the client.
      weak: Server renders the whole page per user with no caching, or caches personalised HTML globally.
    followups:
      - The recommendations service takes two seconds at peak; what does the user see?
      - How would you make sure a cached page never shows another customer's price?
    common_errors:
      - Caching responses that contain user-specific data under a shared key.

  - external_key: system_design.frontend_mobile_architecture.atomic_deploy_rollback
    competency_key: system_design
    topic: Deploying and rolling back a large web client safely
    difficulty: hard
    text: >-
      Our single-page app ships ten times a day to millions of users. How would you design the build and
      deployment pipeline so releases are atomic, can be canaried and can be rolled back within a minute?
    expected_concepts:
      - immutable, content-hashed assets kept across releases
      - a small entry document or manifest that points at a release
      - canary by routing a share of users to the new manifest at the edge
      - rollback by repointing the manifest without rebuilding
      - error and performance monitoring tagged with release version
      - handling users mid-session on an old version
    rubric:
      excellent: Separates immutable assets from a switchable entry point, explains canary and instant rollback at the edge, keeps old assets available for open sessions, and ties monitoring to release versions for automatic decisions.
      good: Uses hashed assets and a CDN with a manual rollback path and some monitoring.
      weak: Overwrites files in place on deploy and relies on a rebuild to roll back.
    followups:
      - How long would you keep old asset files around, and why?
      - What signal would make the canary roll itself back?
    common_errors:
      - Deleting old chunks on deploy so open sessions fail to load code.

  - external_key: system_design.frontend_mobile_architecture.browser_photo_editor
    competency_key: system_design
    topic: Photo editor running in the browser
    difficulty: hard
    text: >-
      Let's design an in-browser photo editor that handles large camera images, supports layers and filters, and
      has unlimited undo. How would you keep it responsive and avoid running out of memory?
    expected_concepts:
      - processing in web workers with OffscreenCanvas, WebGL or WebAssembly
      - transferring buffers instead of copying them
      - working on downscaled previews and applying edits to full size on export
      - storing edits as a command history rather than full image snapshots
      - tiling large images and freeing GPU and canvas memory
    rubric:
      excellent: Moves heavy processing off the main thread with zero-copy transfers, uses preview resolution with non-destructive command history, and manages memory explicitly for large images and many layers.
      good: Uses workers or the GPU for filters and some form of history.
      weak: Applies filters on the main thread and keeps a full copy of the image for every undo step.
    followups:
      - How would undo work for a filter that is expensive to recompute?
      - What would you do on a low-memory phone browser?
    common_errors:
      - Snapshotting full-resolution bitmaps for each history step.

  - external_key: system_design.frontend_mobile_architecture.legacy_spa_strangler
    competency_key: system_design
    topic: Incrementally replacing a legacy front end
    difficulty: hard
    text: >-
      You inherit a very large single-page app on an old framework that still earns most of the company's
      revenue. A full rewrite has been ruled out. How would you design an incremental migration to a modern stack
      while features keep shipping?
    expected_concepts:
      - a shell that routes between old and new screens
      - migrating by route or feature in priority order
      - bridging shared state, auth and events between the two worlds
      - shared design tokens so both look consistent during the transition
      - measuring progress and retiring old code paths
      - guarding performance from loading two frameworks
    rubric:
      excellent: Designs a strangler approach with a routing shell, state and auth bridges, visual consistency and a prioritised migration order, and manages the cost of running two frameworks and the end state.
      good: Proposes migrating route by route with some bridging between old and new code.
      weak: Proposes a big-bang rewrite or migrating random components without a shell or plan.
    followups:
      - Which screens would you migrate first, and why?
      - How would you stop new features being built in the old framework?
    common_errors:
      - Never finishing, leaving two frameworks in production indefinitely.

  - external_key: system_design.frontend_mobile_architecture.live_vehicle_map
    competency_key: system_design
    topic: Live map of tens of thousands of moving vehicles
    difficulty: hard
    text: >-
      A logistics company wants a web dashboard showing about fifty thousand vehicles moving on a map in near
      real time, with filtering and click-through to details. How would you design the client so it stays smooth?
    expected_concepts:
      - GPU-based rendering with WebGL layers instead of DOM markers
      - clustering or aggregation at low zoom levels
      - subscribing only to the visible area and filtered set
      - delta updates batched per frame and interpolated movement
      - decoding and indexing in a web worker
    rubric:
      excellent: Combines WebGL rendering, viewport-based subscriptions, batched deltas with interpolation and clustering, and moves data processing off the main thread with a spatial index for hit testing.
      good: Uses a map library with clustering and limits updates to the viewport.
      weak: Creates a DOM marker per vehicle and re-renders everything on every message.
    followups:
      - How would clicking a single vehicle work when it is drawn on the GPU?
      - The network drops for thirty seconds; what does the map show?
    common_errors:
      - Pushing every position update through framework state and re-rendering the whole map.

  - external_key: system_design.frontend_mobile_architecture.news_freshness_caching
    competency_key: system_design
    topic: Caching layers for a breaking-news site
    difficulty: hard
    text: >-
      A news site gets huge traffic spikes during breaking stories, and readers expect updates within seconds.
      How would you design caching across the CDN, service worker and the page itself so it survives the spike
      and still feels live?
    expected_concepts:
      - short CDN lifetimes with stale-while-revalidate and request collapsing
      - purging or tag-based invalidation on publish
      - live updates pushed or polled for the developing story only
      - service worker strategies per resource type
      - graceful degradation and static fallbacks when origins struggle
    rubric:
      excellent: Designs layered caching with explicit lifetimes per content type, invalidation on publish, collapsed origin requests and a lightweight live update channel, plus degraded modes under extreme load.
      good: Uses CDN caching with short lifetimes and some live update mechanism.
      weak: Disables caching to keep content fresh, or caches everything for a long time.
    followups:
      - A correction is published to a story; how quickly does every reader see it?
      - How would you keep the live update channel itself from overloading the servers?
    common_errors:
      - A cache-first service worker that keeps showing yesterday's front page.

  - external_key: system_design.frontend_mobile_architecture.video_learning_player
    competency_key: system_design
    topic: Video player for an online learning platform
    difficulty: hard
    text: >-
      Let's design the video experience for an online learning platform, where learners watch long lectures
      on web and phones, switch devices mid-lesson and sometimes download lessons to watch later. How would you
      design the client side?
    expected_concepts:
      - adaptive bitrate streaming with HLS or DASH
      - saving playback progress periodically and resuming across devices
      - offline downloads with licence or expiry handling
      - captions, transcripts and playback speed controls
      - analytics on watch time and buffering
    rubric:
      excellent: Covers adaptive streaming, robust progress sync with conflict rules across devices, offline downloads with expiry or protection, accessibility features and quality-of-experience metrics.
      good: Covers streaming and saving progress with some offline or accessibility discussion.
      weak: Serves a single MP4 and saves progress only when the video ends.
    followups:
      - The learner watched further on their phone while offline; which position wins when they open the laptop?
      - How would you detect that a particular region is getting poor playback quality?
    common_errors:
      - Writing progress on every timeupdate event and flooding the server.
