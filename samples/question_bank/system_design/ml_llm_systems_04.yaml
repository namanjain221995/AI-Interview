# Curated questions: system design for ML and LLM systems (4 of 4).
# Evaluation pipelines, labelling and feedback, safety layers, GPU scheduling and training infrastructure.
# `defaults` are merged into every question (question keys win). Easy questions override round_types.
version: 1
defaults:
  role_tags: [ml, llm, data_scientist]
  kind: system_design
  round_types: [system_design, deep_technical, combined]
questions:
  # ------------------------------------------------------------- easy
  - external_key: system_design.ml_llm_systems.prompt_change_check
    competency_key: llm_engineering
    topic: Automated checks before prompt changes ship
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Every week someone tweaks a prompt to fix one case and something else quietly breaks. How would you set
      up a simple automated check that runs before prompt changes go live?
    expected_concepts:
      - a set of representative test inputs including past failures
      - deterministic checks such as format and required content
      - model-graded or reference-based scoring for open-ended outputs
      - comparing against the current version and blocking on regressions
      - running it in CI on every prompt change
    rubric:
      excellent: Builds a versioned test set from real traffic and past bugs, combines deterministic and graded checks, compares against the current prompt and wires it into CI as a gate.
      good: Proposes a test set run automatically before release with some scoring.
      weak: Relies on the author trying a few examples by hand.
    followups:
      - Outputs vary between runs even with the same input. How does your check cope?
      - Where would the test cases come from as the product grows?
    common_errors:
      - Adding only the case being fixed, so the suite never covers what else might break.

  - external_key: system_design.ml_llm_systems.small_team_gpu_sharing
    competency_key: mlops
    topic: Sharing a few GPU servers within a team
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Six researchers share two servers with eight GPUs between them, and people keep killing each other's
      jobs or leaving GPUs idle. What lightweight system would you put in place?
    expected_concepts:
      - a job queue or scheduler instead of direct logins
      - requesting a number of GPUs and a time limit per job
      - visibility of what is running and queued
      - interactive versus batch jobs with different limits
      - checkpointing so jobs can be preempted or resumed
    rubric:
      excellent: Introduces a simple scheduler with resource requests and time limits, separates interactive from batch use, provides visibility and expects jobs to checkpoint.
      good: Proposes a queue or booking system with basic limits.
      weak: Suggests a shared calendar or asking people to coordinate in chat.
    followups:
      - Someone needs all eight GPUs for a two-day run. How does your system handle that fairly?
      - How would you find GPUs that are allocated but idle?
    common_errors:
      - Letting interactive notebooks hold GPUs indefinitely while doing nothing.

  - external_key: system_design.ml_llm_systems.assistant_feedback_capture
    competency_key: llm_engineering
    topic: Collecting and using user feedback on an assistant
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      You're adding thumbs up and thumbs down to an assistant's answers. How would you design what gets
      captured and how the team actually uses that feedback?
    expected_concepts:
      - storing feedback linked to the full trace and versions
      - optional reason categories or free-text comments
      - implicit signals such as copying, retrying or rephrasing
      - triage of negative feedback into an error taxonomy
      - turning confirmed failures into evaluation cases
    rubric:
      excellent: Links feedback to traces and versions, adds reasons and implicit signals, triages failures into categories and feeds them into evaluation sets and fixes.
      good: Stores feedback with the conversation and reviews negative cases.
      weak: Tracks only an overall thumbs-up percentage.
    followups:
      - Only two percent of users ever click the buttons. What other signals would you use?
      - How would you avoid the feedback set being dominated by one type of user?
    common_errors:
      - Collecting feedback without the prompt and model version, so it cannot be acted on.

  # ------------------------------------------------------------- medium
  - external_key: system_design.ml_llm_systems.llm_judge_pipeline
    competency_key: llm_engineering
    topic: Building an LLM-as-judge evaluation pipeline
    difficulty: medium
    text: >-
      Your team wants to use a model to grade thousands of assistant responses each night. How would you
      design that grading pipeline so its scores can be trusted?
    expected_concepts:
      - specific rubrics per criterion rather than one overall score
      - calibrating the judge against human labels and measuring agreement
      - known judge biases such as position, length and self-preference
      - pairwise comparison versus absolute scoring
      - versioning the judge prompt and model and re-checking agreement on changes
      - cost and sampling strategy
    rubric:
      excellent: Uses criterion-level rubrics, measures agreement against human labels, mitigates known judge biases, versions the judge and re-validates it, and controls cost through sampling.
      good: Uses a rubric-based judge with some comparison to human judgement.
      weak: Asks a model to rate answers from one to ten and trusts the average.
    followups:
      - The judge consistently prefers longer answers. How would you detect and correct for that?
      - What would you do if the judge disagrees with humans on one category?
    common_errors:
      - Changing the judge model and comparing new scores directly with old ones.

  - external_key: system_design.ml_llm_systems.shared_offline_eval_platform
    competency_key: mlops
    topic: An offline evaluation platform for many models
    difficulty: medium
    text: >-
      Every ML team evaluates models with its own scripts, so results can't be compared or reproduced. Design
      a shared offline evaluation platform.
    expected_concepts:
      - registered, versioned evaluation datasets
      - pluggable metrics with standard implementations
      - slice definitions and reporting per slice
      - runs tied to model, data and code versions
      - comparison views against baselines with uncertainty
      - integration with the registry and promotion gates
    rubric:
      excellent: Designs versioned datasets, standard pluggable metrics, slice reporting, fully versioned runs and baseline comparisons with uncertainty, integrated into promotion.
      good: Centralises datasets, metrics and run tracking for comparison.
      weak: Proposes a shared spreadsheet of results.
    followups:
      - How would you stop teams overfitting to the shared evaluation sets?
      - A metric implementation had a bug for six months. How do you recover?
    common_errors:
      - Reporting single numbers without confidence intervals, so noise looks like progress.

  - external_key: system_design.ml_llm_systems.production_quality_sampling
    competency_key: llm_engineering
    topic: Measuring LLM quality on live traffic
    difficulty: medium
    text: >-
      Offline tests pass, but you want to know how the assistant is actually doing on real conversations every
      day. How would you design ongoing quality measurement on production traffic?
    expected_concepts:
      - stratified sampling of conversations
      - automated graders for defined failure types
      - human review of a smaller sample to calibrate graders
      - trending quality by intent, version and customer segment
      - privacy controls and consent for reviewing conversations
    rubric:
      excellent: Samples by meaningful strata, scores with calibrated automated graders plus human review, trends results by version and segment and applies privacy controls.
      good: Samples traffic for automated or human grading and tracks results.
      weak: Relies on complaints or the overall feedback rate.
    followups:
      - A rare but serious failure happens in one conversation in ten thousand. How does your sampling catch it?
      - Who is allowed to read sampled conversations?
    common_errors:
      - Uniform sampling that almost never surfaces rare high-impact failures.

  - external_key: system_design.ml_llm_systems.annotation_platform
    competency_key: mlops
    topic: A human labelling platform
    difficulty: medium
    text: >-
      Your company needs hundreds of thousands of labels a month across several projects, from internal
      experts and a vendor. Design the labelling platform and the quality controls around it.
    expected_concepts:
      - task definitions with guidelines and versioning
      - routing tasks by skill and project priority
      - gold questions and overlap to measure agreement
      - adjudication of disagreements
      - active learning to choose the most useful items
      - export of versioned labelled datasets with provenance
    rubric:
      excellent: Designs versioned task guidelines, skill-based routing, gold checks and overlap for agreement, adjudication, active selection of items and versioned exports with provenance.
      good: Covers task management and quality checks such as gold questions or agreement.
      weak: Sends spreadsheets to annotators and merges the results.
    followups:
      - Guidelines change halfway through a project. What happens to earlier labels?
      - How would you tell a hard item from a careless annotator?
    common_errors:
      - Measuring throughput only, with no agreement or accuracy checks.

  - external_key: system_design.ml_llm_systems.guardrail_layer
    competency_key: llm_engineering
    topic: Input and output safety checks around a chatbot
    difficulty: medium
    text: >-
      A consumer chatbot needs checks on what users send and what the model says back, without making replies
      noticeably slower. How would you design that safety layer?
    expected_concepts:
      - fast input classifiers for abuse, jailbreak attempts and out-of-scope requests
      - output checks for policy violations and sensitive data
      - running checks in parallel with generation where possible
      - handling streaming by checking incrementally or buffering sentences
      - configurable policies and logging of blocks for review
      - measuring false positive and false negative rates
    rubric:
      excellent: Designs fast parallel input and output checks, reconciles them with streaming, keeps policies configurable, logs decisions and measures both missed and wrongly blocked cases.
      good: Adds input and output classifiers with some latency awareness.
      weak: Relies on a line in the system prompt asking the model to behave.
    followups:
      - How do you check output that's being streamed word by word?
      - Legitimate medical questions keep getting blocked. How would you fix that?
    common_errors:
      - Measuring only how much harmful content is blocked and not how many good requests are refused.

  - external_key: system_design.ml_llm_systems.pii_redaction_flow
    competency_key: security
    topic: Handling personal data in an LLM application
    difficulty: medium
    text: >-
      Customers paste account numbers, addresses and other personal details into your assistant. How would you
      design the data flow so that information is protected in prompts, logs, evaluation sets and any data used
      for training?
    expected_concepts:
      - detection and redaction or tokenisation before logging
      - reversible pseudonymisation when the model needs the value
      - provider data retention and training terms
      - separate access controls and retention for raw versus redacted data
      - excluding or scrubbing personal data in evaluation and training sets
    rubric:
      excellent: Traces every place personal data flows, applies redaction or reversible tokenisation appropriately, sets retention and access per store and checks provider terms and training data hygiene.
      good: Redacts personal data in logs and considers provider retention.
      weak: Assumes the provider handles it or plans to remove data manually later.
    followups:
      - The model needs the real account number to call a tool. How does that work with tokenisation?
      - How would you measure how much personal data your redaction misses?
    common_errors:
      - Redacting the logs but copying raw conversations into evaluation datasets.

  - external_key: system_design.ml_llm_systems.gpu_quota_borrowing
    competency_key: mlops
    topic: GPU quotas with borrowing and preemption
    difficulty: medium
    text: >-
      A research group and two product teams share a GPU cluster. Each is promised a guaranteed share, but when
      one is idle the others should be able to use its GPUs. Design the quota and scheduling policy.
    expected_concepts:
      - guaranteed quotas per team with borrowing of idle capacity
      - preemption of borrowed capacity when the owner needs it back
      - priority classes for production versus experiments
      - checkpointing requirements for preemptible jobs
      - fair-share accounting over time and visibility of usage
    rubric:
      excellent: Defines guaranteed quotas with borrowing and reclaim, priority classes, preemption with grace periods and checkpointing expectations, and fair-share accounting with transparent usage.
      good: Proposes quotas with borrowing and preemption.
      weak: Proposes fixed partitions or first come, first served.
    followups:
      - A borrowed job is two hours from finishing when the owner reclaims GPUs. What happens?
      - How would you stop one team from gaming the system?
    common_errors:
      - Allowing borrowing without preemption, so owners cannot get their guaranteed share back.

  - external_key: system_design.ml_llm_systems.gang_scheduling_topology
    competency_key: distributed_systems
    topic: Scheduling large multi-node training jobs
    difficulty: medium
    text: >-
      Your cluster runs both small single-GPU jobs and training jobs that need sixty-four GPUs at once across
      several nodes. The big jobs often wait for days. How would you design scheduling for this mix?
    expected_concepts:
      - gang scheduling so all workers start together or not at all
      - fragmentation from small jobs scattered across nodes
      - reservations with backfill of short jobs
      - network topology awareness for placement
      - bin-packing small jobs onto fewer nodes
    rubric:
      excellent: Explains fragmentation and partial-allocation deadlocks, applies gang scheduling, reservations with backfill, packing of small jobs and topology-aware placement.
      good: Recognises the need to allocate all GPUs together and reduce fragmentation.
      weak: Lets workers start one by one as GPUs free up.
    followups:
      - Why does placing workers on nodes that are far apart in the network slow training?
      - How do you backfill without delaying the reserved job?
    common_errors:
      - Starting some workers before the rest are placed, holding GPUs while waiting.

  - external_key: system_design.ml_llm_systems.inference_training_colocation
    competency_key: mlops
    topic: Sharing GPUs between online inference and training
    difficulty: medium
    text: >-
      Your inference traffic peaks during the day and drops sharply at night, while training jobs could run any
      time. How would you design a shared GPU pool that serves both without hurting inference?
    expected_concepts:
      - inference as top priority with headroom
      - training as preemptible, scaling into spare capacity
      - forecasting the inference load to plan capacity handover
      - fast scale-up of inference including model loading time
      - checkpointing and resuming training jobs
    rubric:
      excellent: Prioritises inference with headroom, runs checkpointing training jobs in spare capacity, uses load forecasts and accounts for model load time when reclaiming GPUs.
      good: Runs preemptible training when inference load is low.
      weak: Splits the GPUs permanently between the two uses.
    followups:
      - A traffic spike arrives while every spare GPU is training. How fast can inference recover?
      - How would you measure what this sharing actually saves?
    common_errors:
      - Ignoring how long it takes to load a model onto a GPU when reclaiming capacity.

  - external_key: system_design.ml_llm_systems.self_serve_fine_tuning
    competency_key: mlops
    topic: A self-serve fine-tuning service for internal teams
    difficulty: medium
    text: >-
      Product teams want to fine-tune open models on their own data without asking the ML team each time.
      Design a self-serve fine-tuning service.
    expected_concepts:
      - dataset upload with format, quality and sensitive data checks
      - templated training configurations with sensible defaults
      - job scheduling on shared GPUs with quotas
      - automatic evaluation against the base model and team-provided tests
      - registration and deployment of adapters with access control
    rubric:
      excellent: Validates datasets including sensitive data, offers safe defaults, schedules jobs under quotas, evaluates against the base model before release and registers outputs with access control.
      good: Covers data upload, job running and evaluation.
      weak: Gives teams raw GPU access and a training script.
    followups:
      - A team's fine-tuned model is worse than the base model on their own tests. What does the service tell them?
      - How would you stop a team training on data they aren't allowed to use?
    common_errors:
      - Deploying fine-tuned models without comparing them to the base model.

  - external_key: system_design.ml_llm_systems.synthetic_data_pipeline
    competency_key: llm_engineering
    topic: Generating synthetic training and evaluation data
    difficulty: medium
    text: >-
      You don't have enough labelled examples for a new classification task, so the team wants to generate
      synthetic data with a large model. How would you design that pipeline so the data actually helps?
    expected_concepts:
      - seeding generation with real examples and varied instructions
      - diversity controls and deduplication
      - filtering with validators or a second model and human spot checks
      - keeping evaluation on real data separate from synthetic training data
      - measuring the gain from synthetic data on a real held-out set
    rubric:
      excellent: Seeds and diversifies generation, filters and deduplicates, spot-checks quality, keeps real held-out evaluation separate and measures the actual gain.
      good: Generates and filters data with some quality checks.
      weak: Generates a large batch and trains on it directly.
    followups:
      - The synthetic examples all sound alike. How would you detect and fix that?
      - Why shouldn't you evaluate on synthetic data from the same generator?
    common_errors:
      - Evaluating on synthetic data, which rewards matching the generator rather than the real task.

  - external_key: system_design.ml_llm_systems.eval_dataset_lifecycle
    competency_key: mlops
    topic: Managing evaluation datasets over time
    difficulty: medium
    text: >-
      Your assistant's evaluation set was built a year ago, the product has changed a lot since, and the scores
      no longer predict how users feel about it. How would you design how evaluation data is collected,
      versioned and refreshed?
    expected_concepts:
      - sampling new cases from production by intent and segment
      - versioned datasets with documented provenance
      - fixed regression sets alongside rotating fresh sets
      - retiring obsolete cases and tracking coverage of current features
      - checking that offline scores correlate with online outcomes
    rubric:
      excellent: Refreshes data from production with coverage tracking, versions everything, keeps stable regression sets beside rotating ones, retires obsolete cases and validates offline-online correlation.
      good: Adds new cases periodically with versioning.
      weak: Keeps using the old set or replaces it wholesale with no versioning.
    followups:
      - How do you compare a model's score on version three of the set with an old score on version one?
      - How would you know a part of the product isn't covered by the evaluation set?
    common_errors:
      - Replacing the dataset without versioning, so historical comparisons become meaningless.

  - external_key: system_design.ml_llm_systems.red_team_pipeline
    competency_key: llm_engineering
    topic: Continuous adversarial testing of an LLM product
    difficulty: medium
    text: >-
      Before each release, a few people spend an afternoon trying to break the assistant. How would you turn
      that into a continuous adversarial testing system?
    expected_concepts:
      - a growing library of attack prompts organised by category
      - automated generation of attack variants with a model
      - scoring attacks with classifiers or judges plus human review
      - running the suite in CI and on schedule against production configs
      - tracking attack success rates over versions
      - feeding successful attacks into mitigations and regression tests
    rubric:
      excellent: Builds a categorised attack library expanded automatically, scores results reliably, runs continuously and in CI, tracks success rates and closes the loop into fixes and regression tests.
      good: Automates a set of attack prompts with scoring in CI.
      weak: Keeps manual testing before releases only.
    followups:
      - How would you keep the attack library from going stale as attackers adapt?
      - What success rate would block a release, and who decides?
    common_errors:
      - Testing only single-turn attacks when real attacks often build over several turns.

  # ------------------------------------------------------------- hard
  - external_key: system_design.ml_llm_systems.large_run_fault_tolerance
    competency_key: distributed_systems
    topic: Keeping a thousand-GPU training run productive
    difficulty: hard
    text: >-
      You're running a training job on about a thousand GPUs for several weeks, and some hardware fails almost
      every day. How would you design the training infrastructure to keep the run making progress?
    expected_concepts:
      - frequent asynchronous or sharded checkpointing to fast storage
      - automatic detection of failed or slow nodes
      - hot spare nodes and automatic restart from the latest checkpoint
      - pre-flight health checks before nodes join
      - measuring goodput and time lost per failure
      - detecting silent data corruption and loss spikes
    rubric:
      excellent: Designs fast sharded checkpoints, automated detection of failed and slow nodes, hot spares with automatic restart, health checks and goodput tracking, including silent corruption.
      good: Covers checkpointing and automatic restart after failures.
      weak: Restarts the job by hand from the last daily checkpoint.
    followups:
      - How would you choose the checkpoint interval?
      - One node is twenty percent slower but hasn't failed. What does that do to the whole run?
    common_errors:
      - Checkpointing synchronously to slow storage, stalling all GPUs for minutes each time.

  - external_key: system_design.ml_llm_systems.gpu_capacity_forecast
    competency_key: mlops
    topic: Planning next year's GPU capacity
    difficulty: hard
    text: >-
      You're asked to recommend how much GPU capacity to reserve for next year across training and inference,
      choosing between owned hardware, reserved cloud capacity and on-demand. How would you build that plan?
    expected_concepts:
      - forecasting inference demand from product growth and model size
      - training demand from the planned roadmap of runs
      - mixing committed capacity for the baseline with on-demand for peaks
      - utilisation assumptions and efficiency improvements
      - hardware generation changes and lock-in risk
      - revisiting the plan with actual usage each quarter
    rubric:
      excellent: Builds separate demand models for inference and training, sizes committed versus flexible capacity against utilisation and risk, accounts for hardware changes and plans quarterly reviews.
      good: Forecasts demand and proposes a mix of reserved and on-demand capacity.
      weak: Extrapolates this year's bill or guesses a number.
    followups:
      - A new model architecture halves inference cost mid-year. How does your plan handle that?
      - What's the cost of being wrong in each direction?
    common_errors:
      - Assuming full utilisation of reserved capacity when planning.

  - external_key: system_design.ml_llm_systems.benchmark_contamination
    competency_key: machine_learning
    topic: Keeping training data free of evaluation content
    difficulty: hard
    text: >-
      You train your own language models on large web and internal corpora, and you suspect some evaluation
      questions have leaked into the training data, inflating scores. How would you design the data and
      evaluation systems to detect and prevent that?
    expected_concepts:
      - n-gram or embedding overlap detection between eval sets and training data
      - decontamination as a pipeline stage before training
      - private held-out evaluation sets with restricted access
      - fresh evaluation sets created after the training data cutoff
      - comparing performance on contaminated and clean subsets
    rubric:
      excellent: Builds overlap detection into the data pipeline, keeps private and freshly created evaluation sets, and quantifies contamination by comparing clean and overlapping subsets.
      good: Proposes overlap checks between training and evaluation data.
      weak: Trusts benchmark scores or only checks exact string matches.
    followups:
      - Paraphrased versions of test questions are in the training data. How would you find them?
      - How would you keep a private evaluation set from leaking over time?
    common_errors:
      - Checking only exact matches, which misses reformatted or paraphrased copies.

  - external_key: system_design.ml_llm_systems.preference_data_pipeline
    competency_key: machine_learning
    topic: Preference data and reward model pipeline
    difficulty: hard
    text: >-
      Your team wants to improve an assistant with preference-based fine-tuning. Design the pipeline from
      collecting human preference comparisons through training a reward model or tuning directly on the
      preferences.
    expected_concepts:
      - sampling prompts and candidate responses that cover target behaviours
      - pairwise comparison interfaces with clear guidelines and agreement checks
      - reward model training and validation on held-out preferences
      - risks such as reward hacking and length bias
      - direct preference optimisation as an alternative to a separate reward model
      - evaluation of the tuned policy on independent tests
    rubric:
      excellent: Designs prompt and response sampling, quality-controlled comparison labelling, reward model or direct preference training with validation, and guards against reward hacking with independent evaluation.
      good: Covers collecting comparisons and training on them with some evaluation.
      weak: Describes the idea at a high level with no data quality or evaluation plan.
    followups:
      - The tuned model starts writing much longer answers. What happened, and how do you fix it?
      - How would you choose which prompts to collect preferences on?
    common_errors:
      - Evaluating the tuned model with the same reward model it was optimised against.

  - external_key: system_design.ml_llm_systems.model_version_migration
    competency_key: llm_engineering
    topic: Migrating many features to a new model version
    difficulty: hard
    text: >-
      Your provider is retiring the model behind about thirty prompts across different product features, and
      the replacement behaves differently. How would you design the migration so nothing breaks badly?
    expected_concepts:
      - inventory of every prompt, owner and dependency on the old model
      - running each feature's evaluation suite on the new model
      - prioritising by traffic and risk
      - adapting prompts per feature and re-evaluating
      - staged rollout with monitoring and fallback while the old model remains available
      - building model-agnostic evaluation so the next migration is easier
    rubric:
      excellent: Inventories prompts and owners, evaluates each feature on the new model, prioritises by risk, adapts prompts, rolls out in stages with fallback and leaves reusable evaluation in place.
      good: Evaluates features on the new model and migrates in stages.
      weak: Switches the model name everywhere on the deadline.
    followups:
      - Five features have no evaluation suite at all. What do you do with them?
      - The new model is better on average but worse on one high-revenue feature. How do you proceed?
    common_errors:
      - Starting the migration days before the retirement date with no evaluation in place.

  - external_key: system_design.ml_llm_systems.multi_cloud_gpu_placement
    competency_key: distributed_systems
    topic: Scheduling GPU work across clouds and regions
    difficulty: hard
    text: >-
      GPU shortages mean your company now has capacity spread across three clouds and several regions, while
      training data lives mostly in one. How would you design a scheduler that places jobs across this fleet?
    expected_concepts:
      - a global view of capacity, price and availability
      - data locality and egress cost in placement decisions
      - caching or replicating datasets close to compute
      - policies for which workloads may run where, such as data residency
      - consistent environments and credentials across providers
      - failure handling when a region loses capacity
    rubric:
      excellent: Builds a global capacity view and places jobs weighing data locality, egress and price, replicates data deliberately, enforces residency policies, standardises environments and handles regional loss.
      good: Places jobs by availability and cost with attention to data movement.
      weak: Picks whichever cloud has free GPUs and copies the full dataset every time.
    followups:
      - A job would start a day earlier in another region but needs ten terabytes moved. How does the scheduler decide?
      - How would you handle a dataset that legally can't leave one region?
    common_errors:
      - Ignoring egress costs, which can exceed the compute savings.

  - external_key: system_design.ml_llm_systems.llm_inference_autoscaling
    competency_key: mlops
    topic: Autoscaling a GPU fleet for LLM inference
    difficulty: hard
    text: >-
      Your self-hosted LLM traffic swings five times between quiet and busy hours with sudden spikes, and a new
      replica takes several minutes to become ready. How would you design autoscaling for this fleet?
    expected_concepts:
      - scaling on signals such as queue depth, KV cache usage or tokens in flight rather than CPU
      - predictive scaling from daily patterns
      - reducing cold start with cached images, local weights and faster loading
      - headroom and load shedding or priority queues during spikes
      - cost versus latency targets
    rubric:
      excellent: Scales on inference-specific signals, combines predictive and reactive scaling, cuts replica start time, keeps headroom and sheds or prioritises load during spikes against explicit cost and latency targets.
      good: Uses meaningful metrics with predictive scaling and some cold start mitigation.
      weak: Uses CPU-based autoscaling and accepts minutes of degraded service on every spike.
    followups:
      - Which single metric would you scale on first, and why?
      - What would you do with low-priority batch requests during a spike?
    common_errors:
      - Scaling on GPU utilisation, which looks high even when latency is fine.

  - external_key: system_design.ml_llm_systems.safety_incident_response
    competency_key: llm_engineering
    topic: Responding to a harmful output in production
    difficulty: hard
    text: >-
      A screenshot of your public assistant giving dangerous advice is spreading online. Design the systems
      that let you contain this quickly, find how widespread it is and stop it from happening again.
    expected_concepts:
      - kill switches and feature flags to disable or restrict features quickly
      - searchable traces to find similar outputs across traffic
      - fast mitigations such as blocklists or classifier rules while root cause is investigated
      - reproducing the failure with the exact versions involved
      - adding the case to adversarial and regression suites
      - incident process with clear owners and communication
    rubric:
      excellent: Designs fast containment controls, trace search to scope impact, layered interim mitigations, exact-version reproduction and permanent regression tests within a clear incident process.
      good: Covers turning the feature off, investigating logs and adding tests.
      weak: Patches the prompt and moves on without scoping or prevention.
    followups:
      - You can't reproduce the output with the same prompt. What next?
      - How would you decide between disabling the whole assistant and narrowing it?
    common_errors:
      - Having no way to restrict the assistant quickly without a full deployment.

  - external_key: system_design.ml_llm_systems.training_corpus_pipeline
    competency_key: data_engineering
    topic: Building a large training corpus pipeline
    difficulty: hard
    text: >-
      Your team is assembling a multi-terabyte text corpus from web crawls, licensed data and internal
      documents to train a domain model. Design the processing pipeline from raw data to tokenised training
      shards.
    expected_concepts:
      - distributed processing with idempotent stages
      - language identification, quality filtering and toxicity filtering
      - exact and near-duplicate removal such as MinHash
      - removing personal data and honouring licences per source
      - data mixture weights and versioned outputs
      - reproducible tokenisation and shuffled sharding
    rubric:
      excellent: Designs idempotent distributed stages for filtering, deduplication, personal data removal and licence tracking, controls mixture weights and produces versioned, reproducible shards.
      good: Covers filtering, deduplication and tokenisation at scale.
      weak: Concatenates the sources and tokenises them.
    followups:
      - How would you decide the mixture weights between web, licensed and internal data?
      - A licence for one source is revoked after training. What does your pipeline let you do?
    common_errors:
      - Not recording per-document provenance, making licence or deletion requests impossible to honour.
