# System design: infrastructure and platforms (4 of 4) — internal developer platforms and self-service.
# Design prompts with expected discussion points; spoken by the AI interviewer.
version: 1
defaults:
  role_tags: [devops, platform, sre]
  round_types: [system_design, deep_technical, combined]
  kind: system_design
questions:
  # ------------------------------------------------------------------ easy
  - external_key: system_design.infrastructure_platform.self_service_repo_bootstrap
    competency_key: ci_cd
    topic: Self-service for a new repository and pipeline
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Right now a developer files a ticket and waits three days to get a new repository with a working build
      pipeline. Design a self-service flow that gets them there in minutes.
    expected_concepts:
      - a form or command backed by an automation workflow
      - creating the repository from a template
      - pipeline, permissions and branch protection set up automatically
      - registering the service and its owner
      - idempotent steps that can be retried
    rubric:
      excellent: Designs an automated, idempotent workflow that creates the repository from a template with pipeline, permissions and protections, registers ownership, and reports progress or failures clearly.
      good: Automates repository and pipeline creation from a template.
      weak: Proposes speeding up the ticket queue or a checklist for the platform team.
    followups:
      - What happens if step four of six fails?
      - How would you keep the template from going stale?
    common_errors:
      - Non-idempotent automation that leaves half-created resources when retried.

  - external_key: system_design.infrastructure_platform.service_ownership_registry
    competency_key: system_design
    topic: Registry of services and owners
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      During an incident it took forty minutes to find out which team owned a failing service. Design a
      simple registry that maps services to owning teams and on-call rotations, and keeps itself accurate.
    expected_concepts:
      - ownership metadata stored next to the code
      - links to on-call schedules and chat channels
      - automatic discovery of running services
      - flagging services with no valid owner
      - integration with alerting and incident tools
    rubric:
      excellent: Keeps ownership metadata with the code, links it to live on-call data, detects running services missing from the registry or with stale owners, and feeds it into alerting.
      good: Proposes a central registry linked to on-call schedules.
      weak: Proposes a wiki page or spreadsheet maintained by hand.
    followups:
      - How would you detect that an owner listed in the registry no longer exists?
      - Where would this information show up during an incident?
    common_errors:
      - Relying on manual updates with no check against what is actually running.

  - external_key: system_design.infrastructure_platform.internal_dns_self_service
    competency_key: networking
    topic: Self-service internal DNS
    difficulty: easy
    round_types: [system_design, combined]
    text: >-
      Teams need DNS records for their internal services and currently ask the network team by email. Design a
      self-service way for them to manage records safely.
    expected_concepts:
      - records managed as code or through an API
      - ownership of zones or name prefixes per team
      - validation against conflicts and typos
      - automatic records for services from the platform
      - audit history and quick rollback
    rubric:
      excellent: Lets teams manage records in owned namespaces through code or an API, validates for conflicts, generates records automatically where possible and keeps audited, revertible history.
      good: Moves records into code or an API with review and ownership.
      weak: Gives everyone write access to the DNS console.
    followups:
      - How would you stop one team from changing another team's records?
      - What TTLs would you recommend and why?
    common_errors:
      - No ownership model, so any team can overwrite any record.

  # ---------------------------------------------------------------- medium
  - external_key: system_design.infrastructure_platform.database_as_a_service
    competency_key: databases
    topic: Databases as a platform service
    difficulty: medium
    text: >-
      Design a self-service database offering for your internal platform, so teams can get a production-ready
      PostgreSQL instance without becoming database experts.
    expected_concepts:
      - a small catalogue of approved sizes and configurations
      - automated backups, point-in-time recovery and restore testing
      - high availability and maintenance handled by the platform
      - credentials issued through the secrets system
      - monitoring and alerting included by default
      - clear shared responsibility for schema and queries
    rubric:
      excellent: Offers a curated catalogue with backups, recovery, availability and monitoring built in, issues credentials through the secrets system, and draws a clear line between what the platform and the team own.
      good: Automates provisioning with backups, monitoring and credentials.
      weak: Automates instance creation but leaves backups, upgrades and monitoring to each team.
    followups:
      - Who gets paged when a team's query overloads its database?
      - How would you handle major version upgrades across hundreds of instances?
    common_errors:
      - Leaving the responsibility for backups and upgrades undefined.

  - external_key: system_design.infrastructure_platform.streaming_as_a_service
    competency_key: distributed_systems
    topic: Shared event streaming platform
    difficulty: medium
    text: >-
      Design a shared Kafka platform that dozens of teams use for event streaming. How do teams get topics,
      how do you keep tenants from hurting each other, and how do you run it?
    expected_concepts:
      - self-service topic creation with naming and ownership
      - quotas on throughput and storage per tenant
      - access control per topic and consumer group
      - schema registry and compatibility rules
      - capacity planning and partition limits
      - cluster upgrades and rebalancing without downtime
    rubric:
      excellent: Provides self-service topics with ownership, enforces quotas and access control, governs schemas, plans capacity and partitions, and explains how upgrades and rebalancing happen safely.
      good: Covers self-service topics, quotas and access control.
      weak: Runs one shared cluster where anyone can create topics with no limits.
    followups:
      - One producer suddenly sends ten times its usual volume — what happens?
      - When would you give a team its own cluster?
    common_errors:
      - No per-tenant quotas, so one producer can saturate brokers for everyone.

  - external_key: system_design.infrastructure_platform.chatops_deploy_bot
    competency_key: ci_cd
    topic: Chat-based deployment bot
    difficulty: medium
    text: >-
      Teams want to deploy, roll back and check status from the company chat tool. Design that chat bot so it
      is convenient but doesn't become a security or reliability risk.
    expected_concepts:
      - bot as a thin client calling the deploy API
      - mapping chat users to real identities and permissions
      - confirmation for destructive actions
      - audit trail in both chat and the deploy system
      - independence from chat for incident operations
    rubric:
      excellent: Keeps the bot thin over the existing deploy API, enforces real identity and permissions, confirms risky actions, audits everything and ensures deploys and rollbacks still work when chat is down.
      good: Describes a bot calling the deploy system with authentication and audit.
      weak: Gives the bot broad credentials and lets anyone in a channel trigger deploys.
    followups:
      - The chat service has an outage during an incident — what do engineers do?
      - How would you stop someone deploying to production from the wrong channel?
    common_errors:
      - Authorising based on channel membership rather than individual identity.

  - external_key: system_design.infrastructure_platform.platform_quota_service
    competency_key: system_design
    topic: Quota service across platform resources
    difficulty: medium
    text: >-
      Your platform hands out clusters, databases, queues and cloud accounts, and each has its own ad hoc
      limits. Design a central quota service that every provisioning path checks.
    expected_concepts:
      - quota per team and resource type
      - reservation then commit to avoid races
      - usage reconciled from actual resources
      - requesting and approving increases
      - visibility of usage against limits
      - behaviour when the quota service is unavailable
    rubric:
      excellent: Models quotas per team and resource, reserves before provisioning to avoid races, reconciles against real usage, supports increase requests and defines a fail-open or fail-closed stance per resource.
      good: Central limits checked at provisioning time with visibility of usage.
      weak: Keeps a spreadsheet of limits checked manually.
    followups:
      - Two requests arrive at the same moment for the last unit of quota — what happens?
      - Should provisioning fail if the quota service is down?
    common_errors:
      - Check-then-create without reservation, allowing concurrent requests to exceed quota.

  - external_key: system_design.infrastructure_platform.cost_anomaly_service
    competency_key: cloud_cost_optimization
    topic: Detecting cost anomalies quickly
    difficulty: medium
    text: >-
      A misconfigured job once burned through a month of cloud budget in a weekend and nobody noticed until the
      invoice arrived. Design a service that spots cost anomalies within hours and routes them to the right team.
    expected_concepts:
      - ingesting billing exports plus faster usage signals
      - attribution to teams through tags or accounts
      - baselines with seasonality for anomaly detection
      - routing alerts to owners with context
      - guardrails like budgets or automatic limits for sandboxes
      - handling untagged spend
    rubric:
      excellent: Combines billing data with faster usage metrics, attributes spend to owners, detects anomalies against seasonal baselines, routes actionable alerts and adds hard guardrails where appropriate.
      good: Uses billing data with budgets and alerts attributed to teams.
      weak: Relies on monthly reports or a single company-wide budget alert.
    followups:
      - Billing data lags by a day — how do you detect faster?
      - What would you do about spend that has no owner tag?
    common_errors:
      - Depending only on delayed billing data for detection.

  - external_key: system_design.infrastructure_platform.runbook_automation_engine
    competency_key: incident_response
    topic: Automating operational runbooks
    difficulty: medium
    text: >-
      On-call engineers run the same multi-step runbooks by hand several times a week. Design a platform for
      turning runbooks into safe, reusable automation.
    expected_concepts:
      - workflows defined as code with typed inputs
      - durable execution with step state and resume
      - approvals and dry-run for risky steps
      - least-privilege credentials per workflow
      - rate limits and blast radius controls
      - audit and links from alerts to workflows
    rubric:
      excellent: Defines workflows as reviewed code with durable step state, approvals and dry runs, scopes credentials per workflow, limits blast radius and audits every run, linking them from alerts.
      good: Describes a workflow engine with approvals and logging.
      weak: Proposes a folder of shell scripts run from a shared server.
    followups:
      - A workflow fails halfway through — how does the engineer continue safely?
      - Which steps would you never automate, and why?
    common_errors:
      - Giving automation broad administrative credentials for convenience.

  - external_key: system_design.infrastructure_platform.infra_inventory_service
    competency_key: system_design
    topic: Inventory of all infrastructure resources
    difficulty: medium
    text: >-
      Security asks for a complete, current list of every cloud resource, cluster and server the company runs,
      with owner and environment. Design a service that maintains that inventory.
    expected_concepts:
      - collectors per cloud account and platform
      - event-driven updates plus periodic full scans
      - normalised data model with relationships
      - owner and environment from tags or provisioning metadata
      - reporting untagged or unknown resources
      - query API and history
    rubric:
      excellent: Collects from every provider using events and full scans, normalises resources with relationships and ownership, surfaces unknown or unowned resources and supports historical queries.
      good: Aggregates resources from providers into a central store with ownership tags.
      weak: Exports lists manually from each cloud console.
    followups:
      - How would you find accounts that aren't connected to the inventory at all?
      - What would you do with resources that have no owner?
    common_errors:
      - Relying only on periodic scans, so short-lived resources are never seen.

  - external_key: system_design.infrastructure_platform.load_testing_platform
    competency_key: system_design
    topic: Internal load testing platform
    difficulty: medium
    text: >-
      Teams want to load test their services before big launches but each team builds its own throwaway
      tooling. Design a shared load testing platform.
    expected_concepts:
      - distributed load generators that scale out
      - test definitions as code with realistic traffic shapes
      - safety controls like abort thresholds and target allow-lists
      - isolation of test data from real users
      - results tied to service metrics and previous runs
      - scheduling and cost limits
    rubric:
      excellent: Scales generators horizontally, defines realistic tests as code, builds in abort thresholds and target restrictions, isolates test data and compares results against service metrics and earlier runs.
      good: Provides shared generators, test definitions and result reporting.
      weak: Provides a single machine running a load tool with no safety controls.
    followups:
      - How do you stop someone accidentally load testing a third-party API?
      - What would make results comparable from one run to the next?
    common_errors:
      - Load generators becoming the bottleneck and producing misleading results.

  - external_key: system_design.infrastructure_platform.vm_image_bakery
    competency_key: linux
    topic: Golden virtual machine images
    difficulty: medium
    text: >-
      Many workloads still run on virtual machines, each configured differently at boot by long scripts. Design
      a golden image pipeline that produces hardened, versioned images for the whole company.
    expected_concepts:
      - images built from code on a schedule and on change
      - hardening baseline and vulnerability scanning
      - automated tests that boot and verify the image
      - versioning, promotion and deprecation of images
      - distribution across regions and accounts
      - minimal boot-time configuration
    rubric:
      excellent: Builds images from code regularly, hardens and scans them, boot-tests before promotion, versions and deprecates them deliberately, distributes them everywhere and keeps boot-time configuration minimal.
      good: Automates image builds with hardening and some testing.
      weak: Snapshots a manually configured machine and copies it around.
    followups:
      - How do you get teams off images that are six months old?
      - What belongs in the image and what belongs in boot-time configuration?
    common_errors:
      - Building images without automated tests, so broken images reach production.

  - external_key: system_design.infrastructure_platform.platform_usage_telemetry
    competency_key: observability
    topic: Measuring how the platform is used
    difficulty: medium
    text: >-
      Your platform team has no data on which features developers use, where they get stuck, or how long
      common tasks take. Design the telemetry system that would answer those questions.
    expected_concepts:
      - instrumenting portal, CLI, API and pipelines with events
      - defining journeys such as time to first deploy
      - joining events to teams while respecting privacy
      - dashboards for adoption, errors and latency of platform operations
      - combining usage data with surveys
    rubric:
      excellent: Instruments every interface with consistent events, defines key journeys and measures them, attributes usage to teams with privacy in mind, and combines the numbers with direct developer feedback.
      good: Collects usage events and builds adoption and failure dashboards.
      weak: Counts page views on the portal only.
    followups:
      - Which single metric would you show leadership first, and why?
      - How would you avoid the telemetry being used to rank individual developers?
    common_errors:
      - Measuring only adoption and missing where developers fail or give up.

  - external_key: system_design.infrastructure_platform.sandbox_account_vending
    competency_key: aws
    topic: Vending sandbox cloud accounts
    difficulty: medium
    text: >-
      Engineers want their own cloud sandbox to experiment in, and security wants them isolated and cheap.
      Design an account vending system for sandboxes.
    expected_concepts:
      - automated account creation within the organisation structure
      - guardrail policies applied at creation
      - budgets with alerts and hard limits
      - automatic expiry and resource cleanup
      - no connectivity to production networks
      - single sign-on access and ownership records
    rubric:
      excellent: Automates account creation under guardrail policies, enforces budgets with hard limits, expires and cleans sandboxes, isolates them from production and ties each to an owner through single sign-on.
      good: Automates accounts with guardrails and budgets.
      weak: Shares one sandbox account among everyone with admin rights.
    followups:
      - How do you clean up resources that cleanup tools struggle to delete?
      - What happens when a sandbox hits its budget?
    common_errors:
      - No expiry, so sandboxes accumulate forgotten resources and cost.

  - external_key: system_design.infrastructure_platform.internal_api_gateway_platform
    competency_key: api_design
    topic: Internal API gateway as a platform product
    difficulty: medium
    text: >-
      Teams expose internal APIs to each other and each implements its own authentication, rate limiting and
      documentation. Design an internal API gateway offering that standardises this.
    expected_concepts:
      - self-service route and policy registration
      - identity-based authentication and authorisation
      - per-consumer rate limits
      - generated documentation and API catalogue
      - gateway availability and latency budget
      - versioning and deprecation support
    rubric:
      excellent: Provides self-service registration with consistent identity-based auth, per-consumer limits and a generated catalogue, keeps the gateway highly available with a small latency cost and supports versioning.
      good: Centralises auth and rate limiting with self-service configuration.
      weak: Puts a single shared proxy in front with one set of global rules.
    followups:
      - How would you keep the gateway from becoming a single point of failure?
      - Which concerns should stay inside each service instead of the gateway?
    common_errors:
      - Pushing business logic into the gateway.

  - external_key: system_design.infrastructure_platform.org_wide_change_campaigns
    competency_key: system_design
    topic: Tooling for organisation-wide changes
    difficulty: medium
    text: >-
      Every few months the platform team needs to make the same change across eight hundred repositories, like
      replacing a logging library or updating a base image. Design tooling to run and track those campaigns.
    expected_concepts:
      - codemods or scripted changes applied per repository
      - automated pull requests with tests
      - batching and rate limiting
      - tracking status per repository and team
      - automatically merging safe changes where allowed
      - escalation for stalled repositories
    rubric:
      excellent: Applies scripted changes as tested pull requests in batches, tracks progress per team, auto-merges where policy allows and has a clear path for stalled or failing repositories.
      good: Automates pull requests across repositories with progress tracking.
      weak: Emails teams asking them to make the change themselves.
    followups:
      - How would you handle repositories whose tests are already failing?
      - What makes a change safe enough to merge automatically?
    common_errors:
      - Opening hundreds of pull requests at once with no tracking or follow-up.

  # ------------------------------------------------------------------ hard
  - external_key: system_design.infrastructure_platform.idp_reference_architecture
    competency_key: system_design
    topic: End-to-end internal developer platform
    difficulty: hard
    text: >-
      You're asked to design the internal developer platform for an organisation of a thousand engineers.
      Walk me through its layers, from the interfaces developers touch down to the infrastructure, and how the
      pieces fit together.
    expected_concepts:
      - developer interfaces such as portal, CLI and Git
      - an orchestration or control-plane layer translating intent to resources
      - integration with CI/CD, identity, secrets and observability
      - resource layer across clusters, databases and cloud services
      - golden paths with escape hatches
      - platform as a product with its own reliability targets
    rubric:
      excellent: Describes clear layers from interfaces through a control plane to resources, integrates identity, secrets, delivery and observability, balances golden paths with escape hatches and treats the platform as a product with reliability targets.
      good: Describes the main layers and how a developer request flows through them.
      weak: Lists tools without explaining how they connect or what problems they solve.
    followups:
      - Where would you start if you could only build one layer this year?
      - How would the platform behave if its control plane were down?
    common_errors:
      - Starting from a portal user interface instead of the underlying capabilities.

  - external_key: system_design.infrastructure_platform.multi_cloud_abstraction
    competency_key: system_design
    topic: Abstracting over several clouds
    difficulty: hard
    text: >-
      After an acquisition, half the company runs on one cloud and half on another. Leadership asks for a
      platform where teams don't need to care which cloud they're on. Design it, and tell me where you'd draw
      the line.
    expected_concepts:
      - abstracting at the workload and service contract level
      - provider-specific implementations behind common resource types
      - accepting lowest common denominator costs or not
      - identity, networking and data gravity across clouds
      - placement policy for new workloads
      - cost of maintaining the abstraction
    rubric:
      excellent: Abstracts at the level of workloads and a few common services, implements providers behind them, explicitly weighs the lowest-common-denominator cost, handles identity, networking and data gravity and defines placement rules.
      good: Proposes common interfaces with provider-specific back ends and some trade-off discussion.
      weak: Promises full portability of every service without discussing costs or limits.
    followups:
      - What would you do when a team needs a service only one cloud offers?
      - How do you avoid expensive cross-cloud data transfer?
    common_errors:
      - Ignoring data gravity and the cost of moving data between clouds.

  - external_key: system_design.infrastructure_platform.declarative_infra_control_plane
    competency_key: kubernetes
    topic: Declarative control plane for infrastructure
    difficulty: hard
    text: >-
      Design a declarative control plane where teams request infrastructure such as databases, buckets and
      queues as simple resources, and controllers continuously reconcile them. It needs to manage fifty
      thousand resources reliably.
    expected_concepts:
      - simple claim resources mapped to provider resources
      - reconciliation loops with idempotent operations
      - rate limiting against cloud provider APIs
      - status, conditions and error reporting to users
      - handling deletion and orphaned resources
      - sharding controllers and protecting against mass deletion
    rubric:
      excellent: Maps simple claims onto composed provider resources, reconciles idempotently with rate limiting, reports clear status, handles deletion and orphans safely, shards controllers for scale and guards against bugs that delete many resources.
      good: Describes claims, controllers and reconciliation with status reporting.
      weak: Describes a pipeline that runs scripts once on request with no reconciliation.
    followups:
      - A controller bug starts deleting databases — what stops it?
      - How do you handle cloud API rate limits at this scale?
    common_errors:
      - No safeguard against a controller misinterpreting state and deleting resources en masse.

  - external_key: system_design.infrastructure_platform.acquisition_platform_integration
    competency_key: system_design
    topic: Bringing an acquired company onto the platform
    difficulty: hard
    text: >-
      Your company acquires a business with its own cloud accounts, CI system and deployment tooling, and it
      needs to join your platform over the next year without disrupting its customers. Design the integration.
    expected_concepts:
      - discovery and risk assessment of the existing estate
      - early identity and access consolidation
      - network connectivity and security baseline first
      - phased migration of pipelines and workloads
      - coexistence period with bridges between systems
      - success measures and decommissioning
    rubric:
      excellent: Starts with discovery and security baselines, unifies identity early, builds connectivity, migrates in phases with coexistence bridges, defines measures of success and plans decommissioning.
      good: Lays out a phased plan covering identity, network and migration.
      weak: Proposes rebuilding everything on the platform at once.
    followups:
      - What would you integrate in the first thirty days, and why?
      - How would you decide which of their tools to keep?
    common_errors:
      - Postponing identity and access consolidation, leaving security gaps for months.

  - external_key: system_design.infrastructure_platform.internal_faas_platform
    competency_key: system_design
    topic: Internal functions platform
    difficulty: hard
    text: >-
      Teams want to run small event-driven functions without managing services. Design an internal functions
      platform on top of your existing Kubernetes fleet.
    expected_concepts:
      - event sources and triggers
      - scale to zero and cold start mitigation
      - isolation between tenants' functions
      - concurrency limits and back pressure
      - packaging, versioning and traffic splitting
      - observability and cost attribution per function
    rubric:
      excellent: Handles triggers, scaling to zero with cold start mitigation, tenant isolation, concurrency and back pressure, versioning with traffic splitting and per-function observability and cost.
      good: Describes triggers, autoscaling and deployment of functions.
      weak: Describes running each function as a normal always-on deployment.
    followups:
      - What would you do for a function that can't tolerate cold starts?
      - How would you stop one function from flooding a downstream database?
    common_errors:
      - Ignoring how scaling from zero interacts with downstream connection limits.

  - external_key: system_design.infrastructure_platform.sovereign_region_platform
    competency_key: security
    topic: Isolated sovereign deployment of the platform
    difficulty: hard
    text: >-
      A regulated customer requires your entire service to run in a dedicated, isolated environment in their
      country, operated only by approved staff, with no data or control traffic leaving it. Design how your
      platform supports such an environment.
    expected_concepts:
      - fully independent copy of the platform control plane
      - artifacts imported through a controlled, signed path
      - operator access restricted to approved staff with audit
      - observability kept inside the boundary
      - keeping it in step with the main platform
      - testing changes before they reach the isolated environment
    rubric:
      excellent: Runs an independent platform copy with a signed import path for artifacts, restricts and audits operator access, keeps telemetry inside the boundary and has a release process that keeps it current without breaking isolation.
      good: Describes an isolated copy with controlled artifact transfer and restricted access.
      weak: Proposes a new region managed from the existing global control plane.
    followups:
      - How would you debug an incident there without exporting logs?
      - How do you stop the isolated environment drifting far behind the main platform?
    common_errors:
      - Leaving a dependency on a global service, such as identity or telemetry, outside the boundary.

  - external_key: system_design.infrastructure_platform.edge_site_fleet_platform
    competency_key: kubernetes
    topic: Platform for hundreds of small edge sites
    difficulty: hard
    text: >-
      Your company needs to run software in five hundred retail stores, each with a couple of small servers
      and an unreliable internet connection. Design the platform that deploys and operates workloads there.
    expected_concepts:
      - lightweight cluster or runtime per site
      - pull-based delivery tolerant of disconnection
      - local operation when offline
      - staged rollouts across groups of sites
      - remote observability with buffering
      - zero-touch provisioning and hardware replacement
    rubric:
      excellent: Uses a lightweight runtime per site, pulls desired state so sites tolerate disconnection, keeps working offline, rolls out in waves, buffers telemetry and supports zero-touch provisioning for replacements.
      good: Describes per-site runtimes, pull-based updates and staged rollout.
      weak: Pushes deployments from a central server that needs a live connection to every store.
    followups:
      - A store's server dies — how does a non-technical employee get it replaced?
      - What happens to a rollout when a fifth of stores are offline?
    common_errors:
      - Assuming constant connectivity to the edge sites.

  - external_key: system_design.infrastructure_platform.self_service_network_connectivity
    competency_key: networking
    topic: Self-service connectivity between services and accounts
    difficulty: hard
    text: >-
      Teams spread across hundreds of cloud accounts keep filing tickets to get network access between their
      services. Design a self-service connectivity system that is fast for teams and acceptable to security.
    expected_concepts:
      - connectivity requests expressed as intent between services
      - automated provisioning of routes, firewall rules or private endpoints
      - approval by the owner of the destination
      - policy guardrails for sensitive zones
      - expiry and periodic review of access
      - visibility of who can reach what
    rubric:
      excellent: Captures intent at service level, automates the underlying network changes, requires destination-owner approval, enforces guardrails for sensitive zones and keeps access reviewable and expiring.
      good: Automates rule creation with approval and audit.
      weak: Opens broad network ranges between accounts to reduce tickets.
    followups:
      - How do you show a security reviewer every path into a sensitive database?
      - What happens to connectivity rules when a service is deleted?
    common_errors:
      - Granting connectivity by IP range rather than service identity, so rules rot as addresses change.

  - external_key: system_design.infrastructure_platform.workload_rightsizing_service
    competency_key: cloud_cost_optimization
    topic: Automated rightsizing of workloads
    difficulty: hard
    text: >-
      Across five thousand workloads, resource requests are mostly guesses, wasting money in some places and
      causing throttling in others. Design a service that recommends and applies right-sized requests safely.
    expected_concepts:
      - collecting usage percentiles over representative windows
      - separate handling of CPU and memory risks
      - recommendations with an estimated certainty level and headroom
      - applying changes gradually with rollback
      - opt-in, opt-out and owner review
      - measuring savings and reliability impact
    rubric:
      excellent: Bases recommendations on usage percentiles over representative periods, treats memory more conservatively than CPU, adds headroom, applies changes gradually with rollback and owner control, and tracks both savings and reliability.
      good: Recommends requests from historical usage with some safety margin.
      weak: Sets requests to average usage across the board.
    followups:
      - How would you handle a workload with monthly spikes?
