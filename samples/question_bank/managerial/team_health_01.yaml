# Curated questions: managerial round, team health (part 1 of 4) - workload, sustainable pace,
# on-call load and preventing burnout. Questions stay on observable work signals and the actions the
# candidate took; they never ask about anyone's personal life or medical details.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: managerial.team_health.overload_signals
    competency_key: people_management
    topic: Spotting unsustainable workload early
    difficulty: easy
    text: >-
      In the day-to-day work, what do you watch for that tells you someone on your team is carrying more than
      they can sustain?
    expected_concepts:
      - work-visible signals such as late-night commits, slipping reviews or missed one-to-ones
      - changes from the person's usual pattern rather than absolute numbers
      - asking directly in one-to-ones instead of guessing
      - checking the workload itself, not only the person
      - acting early before deadlines are missed
    rubric:
      excellent: Names several concrete, work-based signals, explains comparing against the person's normal pattern, and describes checking in directly and adjusting the work early.
      good: Gives a few reasonable signals and says they would raise it in a one-to-one.
      weak: Relies on waiting for the person to complain or only notices once deliverables slip.
    followups:
      - Which of those signals has turned out to be misleading for you?
      - What did you do the last time you spotted one?
    common_errors:
      - Speculating about people's private lives instead of looking at the work.
      - Treating long hours as a sign of commitment rather than a risk.

  - external_key: managerial.team_health.realistic_sprint_commitment
    competency_key: project_management
    topic: Committing to a sustainable amount of work
    difficulty: easy
    text: >-
      How do you decide how much work your team commits to in a sprint or planning cycle, so the plan is
      realistic without people working evenings to hit it?
    expected_concepts:
      - using historical throughput or velocity rather than hope
      - reserving capacity for support, incidents and unplanned work
      - accounting for time off and meetings
      - letting the team own the estimate
      - reviewing misses to recalibrate
    rubric:
      excellent: Bases commitments on measured capacity, explicitly reserves room for unplanned work and absences, involves the team in the estimate and recalibrates after misses.
      good: Uses past velocity and leaves some buffer.
      weak: Plans to full theoretical capacity or lets stakeholders set the amount.
    followups:
      - How much capacity do you hold back for unplanned work, and how did you arrive at that number?
      - What happens when the team consistently finishes early or late?
    common_errors:
      - Planning at one hundred percent capacity.

  - external_key: managerial.team_health.modelling_working_habits
    competency_key: leadership
    topic: Modelling sustainable working habits
    difficulty: easy
    text: >-
      How do your own working habits as a lead, such as when you send messages or whether you take your time
      off, shape what your team thinks is expected of them? Give me an example.
    expected_concepts:
      - awareness that leaders set implicit norms
      - scheduling messages or stating no reply is expected
      - visibly taking and protecting time off
      - an example where their behaviour changed team behaviour
    rubric:
      excellent: Recognises the leader's habits set norms, gives a concrete example of changing their own behaviour, and describes the observable effect on the team.
      good: Acknowledges the effect and describes one sensible practice.
      weak: Claims their own hours have no effect on the team or describes always being online as a positive example.
    followups:
      - Was there a time you realised your habits were sending the wrong signal?
    common_errors:
      - Saying "I tell people they don't need to reply" while continuing to expect fast replies.

  - external_key: managerial.team_health.real_time_off
    competency_key: people_management
    topic: Making sure people take real time off
    difficulty: easy
    text: >-
      How do you make sure people on your team actually take their time off and can properly disconnect while
      they're away?
    expected_concepts:
      - noticing who has not taken leave
      - handover and cover before someone leaves
      - removing single points of dependency
      - discouraging contact during leave except for genuine emergencies
      - protecting the plan from depending on absent people
    rubric:
      excellent: Describes tracking and encouraging leave, structured handovers and cover, and concrete steps that remove the need to contact people while away.
      good: Encourages time off and arranges basic handover.
      weak: Leaves it entirely to individuals or accepts that key people will be contacted while away.
    followups:
      - What do you do when one person is the only one who can handle a critical system?
    common_errors:
      - Encouraging leave verbally while the plan still depends on that person.

  - external_key: managerial.team_health.after_hours_norms
    competency_key: communication
    topic: Norms for out-of-hours communication
    difficulty: easy
    text: >-
      What norms have you set for messages and requests outside working hours, and how did you get the team and
      the people around it to follow them?
    expected_concepts:
      - explicit, written expectations
      - clear definition of what counts as urgent and which channel to use
      - on-call or escalation path for genuine emergencies
      - applying the norms to stakeholders, not just the team
      - revisiting when the norms are not followed
    rubric:
      excellent: Describes explicit norms with a clear urgent path, explains how they were agreed and communicated to stakeholders, and how breaches were handled.
      good: Has reasonable norms and communicated them to the team.
      weak: No norms, or norms that exist only on paper.
    followups:
      - How did you handle a stakeholder who kept ignoring those norms?
    common_errors:
      - Setting norms for the team but not for the people who send the requests.

  - external_key: managerial.team_health.urgent_request_at_capacity
    competency_key: stakeholder_management
    topic: Urgent requests when the team is full
    difficulty: easy
    text: >-
      A stakeholder brings you an urgent request when your team is already fully loaded. Walk me through how
      you handle it so the team doesn't simply absorb it on top of everything else.
    expected_concepts:
      - understanding the real urgency and impact
      - making the trade-off visible
      - asking what should be dropped or delayed
      - involving the right decision maker on priorities
      - communicating the decision back to the team
    rubric:
      excellent: Clarifies urgency, makes the trade-off explicit, gets a priority decision from the right person and changes the plan rather than adding the work silently.
      good: Pushes back reasonably and asks what can move.
      weak: Accepts the work without adjusting anything, or refuses without understanding the need.
    followups:
      - What if the stakeholder insists that nothing else can move?
    common_errors:
      - Saying yes and hoping the team will find the time.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.team_health.burnout_example
    competency_key: people_management
    topic: Responding to someone heading toward burnout
    difficulty: medium
    text: >-
      Tell me about a time you noticed someone on your team heading toward burnout because of their workload.
      What did you notice, and what did you change about their work?
    expected_concepts:
      - specific work signals that prompted action
      - a private conversation focused on the work
      - concrete changes to scope, deadlines or responsibilities
      - respecting privacy and pointing to company support if appropriate
      - following up over the following weeks
      - addressing the cause so it did not recur
    rubric:
      excellent: Gives a real example with specific signals, describes concrete changes to workload, respects privacy, follows up over time and fixes the underlying cause.
      good: Real example with a supportive conversation and some workload change.
      weak: Hypothetical answer, or only offers encouragement without changing the work.
    followups:
      - How did you redistribute the work without overloading someone else?
      - What would you do sooner next time?
    common_errors:
      - Asking for or sharing personal details instead of focusing on the work.
      - Telling the person to take a break while leaving the workload unchanged.

  - external_key: managerial.team_health.justified_crunch
    competency_key: project_management
    topic: Deciding on and limiting a crunch period
    difficulty: medium
    text: >-
      Tell me about a time your team had to push hard to meet a deadline. How did you decide the extra effort
      was justified, how did you limit it, and what did you do afterwards to recover?
    expected_concepts:
      - clear reason the date mattered
      - explored scope cuts before extra hours
      - time-boxed the push and made it voluntary where possible
      - shared the load fairly
      - explicit recovery time afterwards
      - retrospective on why the crunch was needed
    rubric:
      excellent: Explains why the date mattered, shows scope was cut first, time-boxed and shared the effort, gave recovery time and changed planning so it would not recur.
      good: Justifies the push and gives some recovery afterwards.
      weak: Treats crunch as normal or gives no recovery or learning.
    followups:
      - What did you cut from scope before asking for extra effort?
      - How did the next planning cycle change because of it?
    common_errors:
      - Describing repeated crunches as one-off events.

  - external_key: managerial.team_health.fair_on_call
    competency_key: people_management
    topic: Fair and sustainable on-call rotations
    difficulty: medium
    text: >-
      How have you made an on-call or support rotation fair and sustainable for your team? Tell me what you
      changed and how you knew it was working.
    expected_concepts:
      - measuring pages per shift and out-of-hours interruptions
      - rotation size and frequency
      - reducing noisy alerts and toil
      - recovery time after heavy shifts
      - compensation or time-in-lieu per company policy
      - reviewing on-call load regularly
    rubric:
      excellent: Measures load, reduces it at the source by fixing noisy alerts, balances the rotation, provides recovery after heavy shifts and tracks the effect over time.
      good: Balances the rotation and reduces some alert noise.
      weak: Only adjusts the schedule without reducing the underlying load, or has no measure of it.
    followups:
      - What metric told you the change had worked?
      - How did you handle someone who wanted to opt out of on-call?
    common_errors:
      - Treating on-call pain as a scheduling problem rather than a reliability problem.

  - external_key: managerial.team_health.hero_rescuer
    competency_key: leadership
    topic: Moving away from hero culture
    difficulty: medium
    text: >-
      One engineer on your team keeps rescuing every incident late at night, and the rest of the team has come
      to rely on it. How would you handle that?
    expected_concepts:
      - recognising the risk to the person and to the team
      - spreading knowledge through pairing and runbooks
      - putting incidents through the normal rotation
      - recognising the person's contribution while changing the pattern
      - fixing the recurring causes of the incidents
    rubric:
      excellent: Sees both the individual and single-point-of-failure risk, spreads knowledge deliberately, routes incidents through the rotation, fixes recurring causes and keeps the person valued in the process.
      good: Spreads knowledge and talks to the engineer about stepping back.
      weak: Praises the heroics and leaves the pattern in place.
    followups:
      - What would you do if the engineer resisted handing things over?
    common_errors:
      - Rewarding heroics in a way that reinforces the pattern.

  - external_key: managerial.team_health.pushback_on_pace
    competency_key: stakeholder_management
    topic: Pushing back on leadership to protect pace
    difficulty: medium
    text: >-
      Tell me about a time you pushed back on a commitment from senior leadership because meeting it would have
      required an unsustainable pace from your team. How did you make the case?
    expected_concepts:
      - understanding the business goal behind the commitment
      - data on capacity and risk
      - offering options such as reduced scope, phased delivery or later date
      - framing in terms of business risk, including quality and attrition
      - the outcome and how it was communicated to the team
    rubric:
      excellent: Real example where they understood the goal, used data, offered concrete alternatives framed as business risk and reached a workable agreement they communicated back.
      good: Pushed back with reasonable arguments and some alternatives.
      weak: Either complied without discussion or refused without offering options.
    followups:
      - What would you have done if leadership had held firm?
    common_errors:
      - Arguing only that the team is tired rather than presenting trade-offs.

  - external_key: managerial.team_health.split_across_two_products
    competency_key: project_management
    topic: Limiting context switching across two products
    difficulty: medium
    text: >-
      Your team is asked to look after a second product for a few months while still running its own, and
      people are already bouncing between the two all day. How would you organise the work so they aren't
      constantly switching context?
    expected_concepts:
      - dedicating people or time blocks to each product rather than splitting everyone
      - rotating assignments on a predictable schedule
      - a single intake and priority order across both products
      - agreeing reduced scope or service levels with stakeholders
      - checking in on load and adjusting
    rubric:
      excellent: Organises focus deliberately through dedicated owners or time blocks, sets one priority order, negotiates reduced commitments for the extra product and monitors the load.
      good: Assigns clear owners for each product and sets priorities.
      weak: Expects everyone to handle both products as requests arrive.
    followups:
      - How would you decide who works on which product?
      - What would you agree with stakeholders about response times for the second product?
    common_errors:
      - Taking on the extra product without reducing any existing commitment.

  - external_key: managerial.team_health.uneven_load
    competency_key: people_management
    topic: Rebalancing uneven workload
    difficulty: medium
    text: >-
      How do you notice when work is spread unevenly across the team, with a few people overloaded and others
      underused, and what have you done to rebalance it?
    expected_concepts:
      - visibility of who holds which work, including reviews and support
      - recognising knowledge concentration as the cause
      - deliberate pairing and handover to spread work
      - giving underused people meaningful work, not leftovers
      - checking the balance over time
    rubric:
      excellent: Describes concrete visibility of load, diagnoses why it became uneven, and rebalances through knowledge transfer and meaningful assignments with follow-up.
      good: Notices imbalance and reassigns some work.
      weak: Only reacts when someone complains, or moves tasks without addressing why the imbalance exists.
    followups:
      - How do you count invisible work such as reviews and mentoring?
    common_errors:
      - Reassigning tasks without the knowledge needed to do them.

  - external_key: managerial.team_health.lead_own_bandwidth
    competency_key: leadership
    topic: Managing your own load as a lead
    difficulty: medium
    text: >-
      How do you manage your own workload as a lead so you still have time for your team when they need you?
      Tell me about something you stopped doing or delegated to make that possible.
    expected_concepts:
      - recognising that an overloaded lead becomes a bottleneck
      - deliberately protecting time for one-to-ones and unblocking
      - delegating work that grows others
      - declining or dropping lower-value commitments
      - a concrete example with the effect on the team
    rubric:
      excellent: Explains why their own availability matters to the team, gives a concrete example of delegating or dropping work, and describes the effect on responsiveness and on the person who took it on.
      good: Gives an example of delegating or prioritising their own time.
      weak: Describes simply working longer hours to cover everything.
    followups:
      - How did the person you delegated to get on with it?
    common_errors:
      - Holding on to hands-on work that the team could own.

  - external_key: managerial.team_health.overcommitting_performer
    competency_key: people_management
    topic: Helping a strong performer who overcommits
    difficulty: medium
    text: >-
      Tell me about a strong performer on your team who kept taking on more than they could deliver. How did you
      help them scale back without making them feel held back?
    expected_concepts:
      - recognising overcommitment through work signals
      - a direct conversation about priorities and impact
      - helping them say no or delegate
      - redirecting ambition toward higher-leverage work
      - checking in on the outcome
    rubric:
      excellent: Real example with a direct conversation, concrete help to prioritise and delegate, and a redirect toward higher-impact work, followed up over time.
      good: Helped the person prioritise and reduce load.
      weak: Simply removed work without discussion or let the pattern continue.
    followups:
      - How did their output change afterwards?
    common_errors:
      - Treating overcommitment as purely the individual's problem rather than also a planning issue.

  - external_key: managerial.team_health.pace_indicators
    competency_key: project_management
    topic: Data that shows whether pace is sustainable
    difficulty: medium
    text: >-
      Beyond whether deadlines are met, what data would you look at to tell whether your team's pace is
      sustainable over the long run?
    expected_concepts:
      - out-of-hours activity and pages
      - carry-over and unplanned work trends
      - quality signals such as defect and rollback rates
      - leave being taken
      - team survey or retro feedback
      - attrition and transfer requests
    rubric:
      excellent: Names several leading indicators across workload, quality and team feedback, explains how they interpret trends and how they would act on them without using them to monitor individuals.
      good: Names a few relevant indicators.
      weak: Only looks at delivery dates or velocity.
    followups:
      - Which of these would you share with leadership, and which would you keep within the team?
    common_errors:
      - Turning indicators into individual surveillance metrics.

  - external_key: managerial.team_health.overwhelmed_one_to_one
    competency_key: communication
    topic: Responding when someone says they are overwhelmed
    difficulty: medium
    text: >-
      In a one-to-one, an engineer tells you they're overwhelmed by their workload. How do you respond in that
      conversation, and what do you do in the week that follows?
    expected_concepts:
      - listening first and asking what is driving it
      - going through the actual list of work together
      - deciding what to drop, delay or hand off
      - following through quickly on what was agreed
      - checking back on progress
    rubric:
      excellent: Listens, works through the concrete workload together, makes specific changes and follows through within days, then checks back.
      good: Listens and agrees some changes to priorities.
      weak: Offers reassurance only, or jumps to solutions without understanding the cause.
    followups:
      - What if the work they want to drop is a commitment to another team?
    common_errors:
      - Responding with general advice about time management.

  - external_key: managerial.team_health.post_incident_recovery
    competency_key: people_management
    topic: Looking after people after a long incident
    difficulty: medium
    text: >-
      After a long incident that kept several people working through the night, what do you do in the following
      days, both for the people involved and for the team's plans?
    expected_concepts:
      - recovery time for those involved
      - adjusting sprint commitments to reflect lost capacity
      - recognising the effort
      - blameless review scheduled after recovery
      - informing stakeholders about the impact on plans
    rubric:
      excellent: Gives recovery time, explicitly re-plans commitments, recognises the work, runs a blameless review at a sensible time and updates stakeholders.
      good: Gives time off and runs a review.
      weak: Expects business as usual the next morning.
    followups:
      - How do you handle the plan if a deadline is close?
    common_errors:
      - Holding the post-incident review the next morning while people are exhausted.

  - external_key: managerial.team_health.shielding_priority_churn
    competency_key: stakeholder_management
    topic: Shielding the team from priority churn
    difficulty: medium
    text: >-
      How do you protect your team from constantly changing priorities from stakeholders, without hiding
      important context from them? Give me an example.
    expected_concepts:
      - a clear intake and prioritisation process
      - agreeing when priorities can change, for example at planning boundaries
      - sharing the reasons behind changes that do happen
      - pushing back on low-value churn
      - keeping the team informed of the bigger picture
    rubric:
      excellent: Describes a concrete process that limits mid-cycle churn, explains how they negotiated it with stakeholders, and how they kept the team informed rather than in the dark.
      good: Batches changes and explains reasons to the team.
      weak: Passes every change straight through, or hides context to "protect" the team.
    followups:
      - When was an exception to that process the right call?
    common_errors:
      - Filtering so much that the team loses sight of why the work matters.

  # ------------------------------------------------------------------ hard
  - external_key: managerial.team_health.chronic_overload_no_headcount
    competency_key: leadership
    topic: Chronic overload with no new headcount
    difficulty: hard
    text: >-
      Your team has been overloaded for two quarters, people have started leaving, and leadership has said there
      is no budget for new headcount. What would you do?
    expected_concepts:
      - quantifying the load and the cost of attrition
      - cutting or deferring lower-value work explicitly
      - automation and toil reduction
      - renegotiating commitments with leadership using data
      - retaining remaining people through clear priorities and support
      - transparent communication with the team
    rubric:
      excellent: Builds a data-backed case, makes explicit decisions about what to stop, reduces toil, renegotiates commitments and keeps the team informed, treating attrition as a business cost.
      good: Proposes reducing scope and raising the issue with leadership.
      weak: Asks the team to work harder or waits for headcount that is not coming.
    followups:
      - What would you stop doing first, and how would you get agreement?
      - How would you present the cost of attrition to leadership?
    common_errors:
      - Relying on goodwill and overtime to cover the gap indefinitely.

  - external_key: managerial.team_health.stop_doing
    competency_key: project_management
    topic: Stopping work to make load sustainable
    difficulty: hard
    text: >-
      Tell me about a time you made your team stop doing something it had been doing, such as supporting a
      product, running a process or honouring an old commitment, to make the workload sustainable. How did you
      decide and get agreement?
    expected_concepts:
      - analysis of cost versus value of the work
      - identifying who depended on it
      - transition plan or alternative for affected users
      - agreement from the relevant stakeholders
      - effect on team capacity afterwards
    rubric:
      excellent: Real example with a clear cost-value analysis, stakeholder agreement, a transition plan for dependants and a measurable gain in capacity.
      good: Stopped something with reasonable justification and communication.
      weak: Cannot name anything they stopped, or stopped work unilaterally with no transition.
    followups:
      - Who objected, and how did you handle it?
    common_errors:
      - Only ever adding work and never retiring any.

  - external_key: managerial.team_health.weekend_track_record
    competency_key: people_management
    topic: Resetting pace built on overtime
    difficulty: hard
    text: >-
      You join as a manager and discover that the team's strong delivery record was achieved through months of
      regular weekend work, and stakeholders now expect that same rate. How would you reset the pace without
      losing credibility?
    expected_concepts:
      - measuring real sustainable capacity
      - resetting expectations with stakeholders using data
      - phasing the change rather than a sudden drop
      - reducing waste and toil to recover some throughput
      - explaining the change and its reasons to the team
      - tracking delivery and quality after the reset
    rubric:
      excellent: Quantifies the gap, resets expectations proactively with data and a phased plan, recovers throughput through efficiency and tracks results to maintain credibility.
      good: Stops the weekend work and explains it to stakeholders.
      weak: Keeps the pattern to avoid conflict or drops output suddenly without warning anyone.
    followups:
      - What would you say in the first conversation with your main stakeholder?
    common_errors:
      - Ending the overtime without telling stakeholders that delivery will change.

  - external_key: managerial.team_health.stretch_versus_overload
    competency_key: leadership
    topic: Healthy stretch versus overload
    difficulty: hard
    text: >-
      How do you tell the difference between healthy stretch that grows someone and overload that wears them
      down? Tell me how that shaped a specific assignment decision you made.
    expected_concepts:
      - stretch means new challenge with support, not just more volume
      - agreeing goals and support up front
      - removing other work to make room
      - checkpoints to adjust early
      - the person's own input into the decision
    rubric:
      excellent: Draws a clear distinction between challenge and volume, gives a real assignment decision with support, removed work and checkpoints, and shows how they adjusted.
      good: Makes a reasonable distinction and gives an example.
      weak: Equates stretch with taking on more work or has no concrete example.
    followups:
      - When did you get that balance wrong?
    common_errors:
      - Adding a stretch project on top of a full workload.

  - external_key: managerial.team_health.timezone_out_of_hours
    competency_key: people_management
    topic: Unequal out-of-hours burden across locations
    difficulty: hard
    text: >-
      Your team is split across two distant time zones, and the people in one location consistently end up
      handling the urgent issues and late calls. How would you redesign the arrangement without reducing
      coverage?
    expected_concepts:
      - measuring the current split of out-of-hours work
      - follow-the-sun ownership or handover rotations
      - building capability in both locations
      - moving shared meetings to fair times or rotating them
      - asynchronous handover practices
      - reviewing the balance regularly
    rubric:
      excellent: Measures the imbalance, designs a follow-the-sun or rotating model, builds skills in both locations, rotates meeting times and reviews the result.
      good: Rotates responsibilities and meeting times.
      weak: Accepts the imbalance as an unavoidable consequence of location.
    followups:
      - What if only one location has the expertise for a critical system?
    common_errors:
      - Fixing meeting times while urgent work still lands on the same people.

  - external_key: managerial.team_health.post_launch_quarter
    competency_key: project_management
    topic: Planning after a sustained push
    difficulty: hard
    text: >-
      After a major launch that took months of sustained overtime, leadership wants to start the next big project
      straight away. How would you plan the following quarter?
    expected_concepts:
      - explicit recovery and stabilisation time
      - addressing debt and defects created during the push
      - realistic capacity for the new project
      - negotiating start date or phasing with leadership
      - retrospective on why overtime was needed
    rubric:
      excellent: Plans recovery and stabilisation explicitly, budgets for debt from the launch, negotiates a realistic start or phased plan, and feeds lessons into how the next project is planned.
      good: Includes some recovery time and debt work in the plan.
      weak: Starts the new project at full speed immediately.
    followups:
      - How would you justify the stabilisation work to leadership?
    common_errors:
      - Ignoring the shortcuts taken during the launch, which then slow the next project.
