# Curated questions: managerial round, cross-team coordination (part 4 of 4). Trust with neighbours, escalation, shared experts, joint incidents, rotations and repairing strained collaborations. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - engineering_manager
  - project_manager
  - tech_lead
  round_types:
  - managerial
  kind: leadership
questions:

- external_key: managerial.cross_team.building_trust_with_neighbours
  competency_key: collaboration
  topic: Building trust with a team you depend on
  difficulty: easy
  text: >-
    When you start depending on a team you barely know, what do you do in the first weeks to build a working
    relationship?
  expected_concepts:
  - meeting the lead and key engineers
  - learning their goals and constraints
  - making small reliable commitments
  - agreeing how to raise problems
  - sharing your own context
  rubric:
    excellent: >-
      Describes specific early steps such as learning their goals, keeping small promises and agreeing
      how to raise issues, and an example where this paid off during a later problem.
    good: Introduces themselves and sets up regular contact.
    weak: Waits until a problem arises.
  followups:
  - What did you learn about their constraints?
  - How do you keep it going?
  common_errors:
  - Making contact only when a request or complaint arises.

- external_key: managerial.cross_team.escalating_between_teams
  competency_key: stakeholder_management
  topic: When and how to escalate a cross-team issue
  difficulty: easy
  text: >-
    How do you decide when to escalate a problem with another team, and how do you do it so that it stays
    constructive?
  expected_concepts:
  - trying direct resolution first
  - stating facts and impact
  - informing the other lead before escalating
  - asking for a specific decision
  - keeping the relationship
  rubric:
    excellent: >-
      Tries direct resolution first, tells the other lead before escalating, presents facts and impact
      and asks for a specific decision.
    good: Escalates after direct attempts with facts.
    weak: Escalates immediately or never.
  followups:
  - Tell me about the last time you escalated.
  - How did the other lead respond?
  common_errors:
  - Escalates immediately or never.

- external_key: managerial.cross_team.cross_team_meeting_value
  competency_key: communication
  topic: Making cross-team meetings worthwhile
  difficulty: easy
  text: >-
    What makes a meeting that involves several teams worth attending, and what do you do to make yours
    useful?
  expected_concepts:
  - a clear purpose and decision
  - the right attendees
  - pre-read
  - time limits
  - notes and actions shared
  rubric:
    excellent: >-
      Sets a clear purpose and decisions, invites the right people, sends a pre-read, keeps time and shares
      notes and actions.
    good: Plans an agenda and sends notes.
    weak: Runs status rounds with no decisions.
  followups:
  - Which meeting did you cancel?
  - How do you pick the attendees?
  common_errors:
  - Runs status rounds with no decisions.

- external_key: managerial.cross_team.credit_across_teams
  competency_key: leadership
  topic: Sharing credit for joint results
  difficulty: easy
  text: >-
    When a result is delivered jointly by several teams, how do you make sure credit is shared properly?
  expected_concepts:
  - naming teams and individuals
  - crediting in leadership forums
  - thanking publicly
  - asking others to present
  - fixing omissions
  rubric:
    excellent: >-
      Names teams and individuals, credits them in front of leaders, lets others present and corrects
      omissions.
    good: Thanks partner teams in updates.
    weak: Reports only their own team's role.
  followups:
  - How did the partner team respond?
  - When did you correct an omission?
  common_errors:
  - Reports only their own team's role.

- external_key: managerial.cross_team.helping_neighbour_with_context
  competency_key: mentoring
  topic: Helping another team understand your domain
  difficulty: easy
  text: >-
    A neighbouring team keeps misunderstanding how your system works. What do you do to help them?
  expected_concepts:
  - finding the common misunderstandings
  - a short explanation or walkthrough
  - documentation they can find
  - office hours
  - asking what they need
  rubric:
    excellent: >-
      Finds common misunderstandings, gives a short walkthrough and findable documentation, offers office
      hours and checks what helps.
    good: Explains it and shares docs.
    weak: Tells them to read the code.
  followups:
  - What was the misunderstanding?
  - How did you know it helped?
  common_errors:
  - Tells them to read the code.

- external_key: managerial.cross_team.cross_team_retro
  competency_key: project_management
  topic: Reviewing how teams worked together
  difficulty: easy
  text: >-
    After a project that spanned several teams, how do you review how the collaboration went?
  expected_concepts:
  - joint session
  - focus on process not people
  - specific examples
  - agreeing a few changes
  - follow-up
  rubric:
    excellent: >-
      Holds a joint session focused on process, uses examples, agrees a few changes with owners and follows
      up.
    good: Holds a retrospective with all teams.
    weak: Reviews only within own team.
  followups:
  - What change came out of it?
  - How do you avoid blame?
  common_errors:
  - Reviews only within own team.

- external_key: managerial.cross_team.two_leads_in_conflict
  competency_key: stakeholder_management
  topic: Two team leads in conflict
  difficulty: medium
  text: >-
    Two team leads in neighbouring teams, both of whom you work with, are in open conflict. How do you
    handle it?
  expected_concepts:
  - listening to each separately
  - separating facts from interpretations
  - identifying the shared goal
  - bringing them together with a specific agenda
  - involving managers if needed
  rubric:
    excellent: >-
      Listens to each, separates facts from interpretation, anchors on shared goals, facilitates a focused
      conversation and involves managers only if needed.
    good: Talks to both and encourages them to resolve it.
    weak: Takes sides or avoids the situation.
  followups:
  - What was the root cause?
  - How did you stay neutral?
  common_errors:
  - Takes sides or avoids the situation.

- external_key: managerial.cross_team.joint_hiring
  competency_key: leadership
  topic: Hiring for a role shared between teams
  difficulty: medium
  text: >-
    Two teams need a person to support both of them. How do you work out the role, the hiring and the
    day-to-day arrangement?
  expected_concepts:
  - clarifying shared expectations
  - split of time and priorities
  - who manages
  - how conflicts are resolved
  - review after a period
  rubric:
    excellent: >-
      Clarifies expectations and split of time, names a manager, agrees how conflicts are resolved and
      plans a review after a period.
    good: Agrees a split and a manager.
    weak: Leaves priorities to the individual to sort out.
  followups:
  - Who sets the priorities?
  - How did you review it?
  common_errors:
  - Leaves priorities to the individual to sort out.

- external_key: managerial.cross_team.mapping_stakeholder_teams
  competency_key: project_management
  topic: Understanding which teams a project touches
  difficulty: medium
  text: How do you work out all the teams a project will touch before it starts?
  expected_concepts:
  - reviewing dependencies in systems and processes
  - asking neighbouring leads
  - checking past similar projects
  - including support and operations
  - updating as you learn
  rubric:
    excellent: >-
      Reviews dependencies, asks neighbouring leads, checks past projects, includes support and operations,
      and updates as they learn.
    good: Lists teams from known dependencies.
    weak: Discovers teams during delivery.
  followups:
  - Which team did you miss once?
  - How do you keep the list current?
  common_errors:
  - Discovers teams during delivery.

- external_key: managerial.cross_team.common_quality_bar
  competency_key: project_management
  topic: Agreeing a shared quality bar
  difficulty: medium
  text: >-
    Teams working on the same product have different ideas of what ready means. How do you establish a
    common bar?
  expected_concepts:
  - examples of the problems
  - agreed minimal definition
  - automation
  - lightweight exceptions
  - revisiting
  rubric:
    excellent: >-
      Shows examples of the problems, agrees a minimum definition, automates checks, allows lightweight
      exceptions and revisits.
    good: Agrees a shared definition.
    weak: Imposes a checklist.
  followups:
  - What was in the definition?
  - How did you handle a team that didn't meet it?
  common_errors:
  - Imposes a checklist.

- external_key: managerial.cross_team.rotation_between_teams
  competency_key: mentoring
  topic: Rotating engineers between teams
  difficulty: medium
  text: >-
    You are considering a temporary rotation of engineers between two teams. How do you decide and run
    it?
  expected_concepts:
  - purpose
  - fit and volunteers
  - clear scope and manager
  - handover on both sides
  - review and decision at the end
  rubric:
    excellent: >-
      Defines purpose, picks volunteers where possible, sets scope and manager, plans handovers and reviews
      at the end.
    good: Arranges a rotation with a purpose.
    weak: Moves people to fill a gap without planning.
  followups:
  - What did people learn?
  - What went wrong?
  common_errors:
  - Moves people to fill a gap without planning.

- external_key: managerial.cross_team.bad_news_to_neighbour
  competency_key: communication
  topic: Telling another team that you are letting them down
  difficulty: medium
  text: >-
    You need to tell a team that depends on you that you can't deliver what they expected. How do you
    do it?
  expected_concepts:
  - telling them early and directly
  - explaining facts
  - offering options
  - owning the impact
  - agreeing next steps
  rubric:
    excellent: >-
      Tells them early and directly, explains facts, offers options, owns the impact and agrees next steps.
    good: Informs them with an explanation.
    weak: Delays or sends a message without discussion.
  followups:
  - What options did you offer?
  - How did they react?
  common_errors:
  - Delays or sends a message without discussion.

- external_key: managerial.cross_team.fair_use_of_shared_expert
  competency_key: stakeholder_management
  topic: Sharing a scarce expert across teams
  difficulty: medium
  text: >-
    One expert is wanted by several teams. How do you make the allocation fair and sustainable?
  expected_concepts:
  - transparent requests
  - priority criteria
  - time limits
  - knowledge sharing to reduce dependency
  - reviewing
  rubric:
    excellent: >-
      Uses transparent requests, priority criteria, time limits, knowledge sharing and review.
    good: Sets a schedule and criteria.
    weak: Allocates on who asks loudest.
  followups:
  - What criteria did you use?
  - How did you reduce dependency?
  common_errors:
  - Allocates on who asks loudest.

- external_key: managerial.cross_team.support_and_engineering_link
  competency_key: collaboration
  topic: Working with support teams on recurring issues
  difficulty: medium
  text: >-
    Customer support keeps escalating the same kinds of issues to your team. How do you work with them
    to reduce this?
  expected_concepts:
  - analysing the patterns
  - fixes and self-service tools
  - shared dashboards
  - clear escalation criteria
  - feedback loop
  rubric:
    excellent: >-
      Analyses patterns, fixes root causes, provides tools, agrees escalation criteria and keeps a feedback
      loop.
    good: Reviews issues and fixes common ones.
    weak: Handles each escalation individually.
  followups:
  - What pattern did you find?
  - How did support respond?
  common_errors:
  - Handles each escalation individually.

- external_key: managerial.cross_team.security_review_partnership
  competency_key: collaboration
  topic: Working with a security or compliance team
  difficulty: medium
  text: >-
    You need approvals from a security or compliance team that has a long queue. How do you work with
    them effectively?
  expected_concepts:
  - involving them early
  - understanding their requirements
  - providing complete information
  - automating evidence
  - respecting their capacity
  rubric:
    excellent: >-
      Involves them early, understands requirements, provides complete information, automates evidence
      and respects capacity.
    good: Submits requests with notice.
    weak: Approaches them at the end.
  followups:
  - What did you automate?
  - What was the delay?
  common_errors:
  - Approaches them at the end.

- external_key: managerial.cross_team.design_and_data_partners
  competency_key: collaboration
  topic: Coordinating with design and data teams
  difficulty: medium
  text: >-
    Your work depends on design and data teams who have their own plans. How do you coordinate so nobody
    is blocked?
  expected_concepts:
  - shared planning points
  - early sharing of needs
  - agreed handoffs
  - visible dependencies
  - regular check-ins
  rubric:
    excellent: >-
      Uses shared planning points, shares needs early, agrees handoffs, makes dependencies visible and
      checks in.
    good: Coordinates through regular meetings.
    weak: Waits until the work is ready for handoff.
  followups:
  - What was a handoff?
  - How did you spot a blocked item?
  common_errors:
  - Waits until the work is ready for handoff.

- external_key: managerial.cross_team.progress_reporting_multi_team
  competency_key: communication
  topic: Reporting across several teams on one programme
  difficulty: medium
  text: >-
    You must report progress for a programme spanning many teams. How do you make the report accurate
    without burdening them?
  expected_concepts:
  - minimal consistent inputs
  - source from systems when possible
  - focus on risks and decisions
  - validated with teams
  - avoiding surprises
  rubric:
    excellent: >-
      Uses minimal consistent inputs, sources data from systems, focuses on risks and decisions, validates
      with teams and avoids surprises.
    good: Collects updates and summarises.
    weak: Asks teams for long manual reports.
  followups:
  - What do you ask teams for?
  - How do you detect optimistic updates?
  common_errors:
  - Asks teams for long manual reports.

- external_key: managerial.cross_team.absorbing_team_members
  competency_key: leadership
  topic: Taking on members of a team that is being closed
  difficulty: hard
  text: >-
    A neighbouring team is being closed and some of its people and systems will join yours. How do you
    handle the transition?
  expected_concepts:
  - understanding what they own
  - welcoming people respectfully
  - clear roles
  - knowledge transfer
  - fair treatment with existing members
  rubric:
    excellent: >-
      Understands ownership, welcomes people, defines roles, plans knowledge transfer and treats everyone
      fairly.
    good: Plans onboarding and ownership.
    weak: Treats them as extra capacity.
  followups:
  - What did you learn from them?
  - What did you keep from their way of working?
  common_errors:
  - Treats them as extra capacity.

- external_key: managerial.cross_team.joint_incident_ownership
  competency_key: ownership
  topic: Incidents that involve several teams
  difficulty: hard
  text: >-
    A large incident involved the actions of several teams. How do you run the response and the review
    so that you learn and keep working relationships intact?
  expected_concepts:
  - a single incident lead
  - clear roles
  - blameless review
  - shared actions with owners
  - follow-up across teams
  rubric:
    excellent: >-
      Uses a single incident lead and clear roles, runs a blame-free review, shares actions with named
      owners and follows up across teams.
    good: Coordinates and holds a review.
    weak: Assigns fault to one team.
  followups:
  - Who owned the actions?
  - What changed afterwards?
  common_errors:
  - Assigns fault to one team.

- external_key: managerial.cross_team.conflicting_roadmaps_leaders
  competency_key: project_management
  topic: Leaders insisting their team's work comes first
  difficulty: hard
  text: >-
    Leaders of two teams each insist their work must go first, and both depend on a third team. How do
    you resolve it?
  expected_concepts:
  - making the trade-off explicit
  - sizing impact
  - bringing the leaders together
  - escalating for a decision with options
  - communicating the result
  rubric:
    excellent: >-
      Makes the trade-off explicit with impact, brings leaders together, escalates with options if needed
      and communicates the result.
    good: Facilitates a discussion and escalates.
    weak: Chooses by relationship.
  followups:
  - Who decided?
  - How did the other team react?
  common_errors:
  - Chooses by relationship.

- external_key: managerial.cross_team.unwinding_a_failed_collaboration
  competency_key: ownership
  topic: A collaboration between teams that went wrong
  difficulty: hard
  text: >-
    A joint effort between teams failed and relations are strained. How do you repair things?
  expected_concepts:
  - reviewing facts jointly
  - owning your share
  - agreeing lessons
  - rebuilding with a small joint task
  - checking in
  rubric:
    excellent: >-
      Reviews jointly, owns their share, agrees lessons, rebuilds trust through a small joint task and
      checks in.
    good: Holds a conversation and moves on.
    weak: Avoids the other team.
  followups:
  - What was your share?
  - What small task did you choose?
  common_errors:
  - Avoids the other team.

- external_key: managerial.cross_team.cross_team_dependencies_vendor
  competency_key: stakeholder_management
  topic: Coordinating a vendor and several internal teams
  difficulty: hard
  text: >-
    A project relies on an external vendor and three internal teams with different priorities. How do
    you keep it coordinated?
  expected_concepts:
  - a single point of contact
  - clear milestones and responsibilities
  - regular joint check-ins
  - risk log
  - escalation routes
  rubric:
    excellent: >-
      Appoints a single point of contact, agrees milestones and responsibilities, holds joint check-ins,
      keeps a risk log and defines escalation routes.
    good: Coordinates meetings and tracks tasks.
    weak: Lets each team deal with the vendor.
  followups:
  - How did you handle vendor delay?
  - What was in the risk log?
  common_errors:
  - Lets each team deal with the vendor.

- external_key: managerial.cross_team.building_shared_culture
  competency_key: leadership
  topic: Building a common way of working across teams
  difficulty: hard
  text: >-
    You lead several teams that have drifted into very different ways of working. How do you bring about
    common working practices without flattening them?
  expected_concepts:
  - identifying what must be common
  - learning from the best practices
  - co-creating
  - gradual adoption
  - leaving room for variation
  rubric:
    excellent: >-
      Identifies what must be common, learns from the best practices, co-creates, adopts gradually and
      leaves room for variation.
    good: Sets some common practices with input.
    weak: Imposes one team's way.
  followups:
  - What did you leave different?
  - What was adopted from each team?
  common_errors:
  - Imposes one team's way.

- external_key: managerial.cross_team.influencing_outside_chain
  competency_key: stakeholder_management
  topic: Getting a team outside your chain of command to act
  difficulty: medium
  text: >-
    You need a team outside your reporting line to change their plan to help you, and you have no authority
    over them. How do you proceed?
  expected_concepts:
  - understanding their goals
  - making the benefit mutual
  - asking their lead directly
  - offering help
  - agreeing dates
  rubric:
    excellent: >-
      Understands their goals, shows mutual benefit, asks their lead directly, offers help in return and
      agrees dates.
    good: Asks politely with reasons.
    weak: Demands or goes to their manager at once.
  followups:
  - What did you offer?
  - What if they said no?
  common_errors:
  - Demands or goes to their manager at once.

- external_key: managerial.cross_team.shared_standup_overhead
  competency_key: project_management
  topic: Cutting coordination overhead between teams
  difficulty: medium
  text: >-
    Your teams spend a lot of time in coordination meetings across teams. How do you reduce the overhead
    without losing alignment?
  expected_concepts:
  - measuring the time spent
  - deciding which interactions need live discussion
  - written updates
  - clearer interfaces
  - removing duplicate forums
  rubric:
    excellent: >-
      Measures the time, decides which interactions need live discussion, moves updates to writing, clarifies
      interfaces and removes duplicate forums.
    good: Cuts some meetings and shares notes.
    weak: Adds more meetings to fix misalignment.
  followups:
  - Which meeting did you remove?
  - How did you check alignment held?
  common_errors:
  - Adding more coordination meetings in response to misalignment.
