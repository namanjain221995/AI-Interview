# Curated questions: managerial round, stakeholder management (part 2 of 4). Planning trade-offs,
# commitments and renegotiation, ownership boundaries, platform customers, vendors and building
# stakeholder relationships. Questions ask for real past examples or concrete approaches; evaluation
# is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  - external_key: managerial.stakeholders.planning_cut_line
    competency_key: project_management
    topic: Communicating what missed the planning cut
    difficulty: medium
    text: >-
      In a planning cycle there are almost always more requests than capacity. Walk me through how you ran the conversation
      with the stakeholders whose requests fell below the line, using a recent example.
    expected_concepts:
      - transparent ranking criteria agreed before the cut
      - telling affected stakeholders directly rather than letting them find out
      - explaining the reasoning and what would change the decision
      - options such as a later slot, a smaller version or self-service
      - a path to revisit the decision
    rubric:
      excellent: Uses criteria agreed in advance, tells each affected stakeholder directly with the reasoning, offers realistic options and explains what new information would change the ranking.
      good: Communicated the cut with reasons and some options.
      weak: Lets stakeholders discover the omission themselves, or gives no reasoning beyond lack of time.
    followups:
      - Which stakeholder took it hardest, and what did you do?
      - Did anything below the line get pulled back in during the quarter?
    common_errors:
      - Keeping a long tail of requests as maybe so nobody hears a clear answer.

  - external_key: managerial.stakeholders.lending_engineers
    competency_key: stakeholder_management
    topic: A peer asking to borrow your engineers
    difficulty: medium
    text: >-
      Tell me about a time a peer manager asked to borrow engineers from your team for their project. How did you decide
      what to agree to, and how did you set it up so it didn't drift?
    expected_concepts:
      - weighing the wider business priority against your own commitments
      - involving the engineers and your own manager in the decision
      - clear scope, duration and return date
      - telling your own stakeholders what changes as a result
      - checking in during and after the loan
    rubric:
      excellent: Weighed the request against overall business priority rather than team territory, agreed explicit scope and an end date, adjusted their own commitments openly and followed through to bring the engineers back.
      good: Made a reasonable decision with some agreed terms.
      weak: Refused on territorial grounds, or agreed with no terms so the loan became open-ended.
    followups:
      - How did the engineers who moved feel about it, and how did you find out?
      - Did the loan end when it was supposed to?
    common_errors:
      - Forgetting to reset the expectations of their own team's stakeholders.

  - external_key: managerial.stakeholders.compliance_deadline_displacement
    competency_key: project_management
    topic: A mandatory deadline displacing committed work
    difficulty: hard
    text: >-
      Tell me about a time a mandatory deadline, such as a regulatory or security requirement, forced you to drop work you
      had already committed to other stakeholders. How did you re-plan, and how did you handle the people who lost out?
    expected_concepts:
      - confirming the true scope and date of the mandatory work
      - re-planning with explicit trade-offs
      - telling affected stakeholders early with the reason
      - minimising disruption through partial delivery or sequencing
      - restoring the displaced work afterwards
    rubric:
      excellent: Verified what the mandatory requirement actually needed, re-planned with explicit trade-offs, told each affected stakeholder early with options and followed through on the displaced commitments afterwards.
      good: Re-planned sensibly and communicated the change.
      weak: Tried to absorb both with overtime, or dropped commitments without telling the owners.
    followups:
      - Did you challenge the scope of the mandatory requirement, and what did you find?
      - What happened to the displaced work in the end?
      - How did the affected stakeholders respond?
    common_errors:
      - Accepting the broadest interpretation of the requirement without checking.

  - external_key: managerial.stakeholders.executive_attention_customer_issue
    competency_key: stakeholder_management
    topic: Managing executive attention during a customer issue
    difficulty: hard
    text: >-
      Picture a serious problem with a large customer that has reached your executives, who now want constant updates while
      your team is trying to fix it. Tell me how you managed that kind of attention, using a situation you've been in.
    expected_concepts:
      - a single point of contact for updates
      - a predictable update cadence with clear content
      - protecting the people doing the fix from interruptions
      - clear asks of executives such as customer contact or resources
      - follow-up review shared with the same audience
    rubric:
      excellent: Set up a single channel and predictable cadence, protected the people fixing the problem, used executives for specific help such as customer communication, and closed with a review shared with the same audience.
      good: Provided regular updates and kept the team mostly focused.
      weak: Let executives contact engineers directly, or gave irregular updates that drove more escalation.
    followups:
      - What did you actually ask the executives to do?
      - How did you decide the update frequency?
    common_errors:
      - Spending more time producing updates than helping resolve the problem.

  - external_key: managerial.stakeholders.acceptance_criteria
    competency_key: project_management
    topic: Agreeing what done means before building
    difficulty: easy
    text: >-
      Tell me how you make sure a stakeholder and your team agree on what done looks like before the work starts, so you
      don't end up hearing that's not what I asked for.
    expected_concepts:
      - written acceptance criteria or examples
      - walking through scenarios or mock-ups with the stakeholder
      - agreeing non-functional expectations such as performance
      - early check-ins on partial work
    rubric:
      excellent: Describes concrete practices such as written acceptance criteria, example walkthroughs and early check-ins, with an example where this caught a misunderstanding.
      good: Uses some form of agreed criteria before work starts.
      weak: Relies on the original request text and finds out at the end.
    followups:
      - Tell me about a time it still went wrong despite agreed criteria.
    common_errors:
      - Agreeing criteria with the requester but not the people who actually sign off.

  - external_key: managerial.stakeholders.disagreeing_with_product_partner
    competency_key: leadership
    topic: Disagreeing with your product partner on what to build
    difficulty: medium
    text: >-
      Tell me about a time you and your product partner disagreed about what the team should build next. How did you work
      it through, and how did you present a united direction to the team?
    expected_concepts:
      - understanding the partner's reasoning and data
      - bringing engineering evidence such as cost, risk or opportunity
      - finding a decision rule or experiment rather than a contest
      - respecting decision rights
      - a consistent message to the team
    rubric:
      excellent: Engaged with the partner's reasoning, brought engineering evidence, reached a decision through agreed criteria or an experiment, and presented a single direction to the team.
      good: Resolved the disagreement constructively with a clear outcome.
      weak: Took the disagreement to the team, or simply deferred without contributing a view.
    followups:
      - Who had the final say, and was that clear to both of you?
      - How did the decision turn out?
    common_errors:
      - Letting the team see two competing sets of priorities.

  - external_key: managerial.stakeholders.raising_risk_without_alarm
    competency_key: communication
    topic: Raising a risk that may never happen
    difficulty: medium
    text: >-
      How do you raise a risk with stakeholders when it might never materialise, so they take it seriously without thinking
      you're crying wolf? Tell me about one you raised.
    expected_concepts:
      - likelihood and impact stated plainly
      - a trigger or date by which it will be clearer
      - mitigation already in progress
      - a decision or support needed from stakeholders
      - following up when the risk resolves either way
    rubric:
      excellent: Describes stating likelihood and impact, a clear trigger point, current mitigation and a specific ask, and closing the loop whether or not the risk happened.
      good: Raised the risk clearly with some mitigation.
      weak: Either stays silent until it happens or raises every possible risk with equal weight.
    followups:
      - Did the risk materialise, and how did you follow up?
    common_errors:
      - Raising a risk without any ask, so stakeholders don't know what to do with it.

  - external_key: managerial.stakeholders.useful_demo_feedback
    competency_key: stakeholder_management
    topic: Getting useful feedback from stakeholder demos
    difficulty: easy
    text: >-
      How do you run a demo or review with stakeholders so you come away with feedback you can actually use, rather than
      polite nodding?
    expected_concepts:
      - showing real working software in a realistic scenario
      - specific questions prepared in advance
      - inviting the people who will actually use it
      - recording feedback and reporting what changed
    rubric:
      excellent: Describes preparing specific questions, demoing realistic scenarios to actual users, and closing the loop on what changed, with an example of a useful finding.
      good: Runs demos with some structure for gathering feedback.
      weak: Treats demos as a presentation with no mechanism for feedback.
    followups:
      - What's the most useful thing a demo ever told you?
    common_errors:
      - Demoing only the happy path with prepared data.

  - external_key: managerial.stakeholders.late_hidden_approver
    competency_key: stakeholder_management
    topic: An approver who surfaced late
    difficulty: medium
    text: >-
      Tell me about a time a group you hadn't involved, such as security, legal or finance, appeared late in a project and
      raised objections. How did you handle it, and what did you change afterwards?
    expected_concepts:
      - treating the objection on its merits rather than as an obstacle
      - quickly understanding their requirements
      - re-planning with the affected stakeholders informed
      - adding the group to future project checklists
    rubric:
      excellent: Engaged constructively with the late group, found the minimum change to satisfy real requirements, re-planned openly and changed their process so that group is involved early in future.
      good: Resolved the objection and made some change.
      weak: Tried to work around the group or escalated to override them without understanding their concern.
    followups:
      - Were their objections valid?
      - How did this affect the timeline?
    common_errors:
      - Blaming the other group for raising issues late rather than asking why they weren't involved.

  - external_key: managerial.stakeholders.walking_back_commitment
    competency_key: stakeholder_management
    topic: Going back on a commitment you made
    difficulty: hard
    text: >-
      Tell me about a time you realised a commitment you had personally made to a stakeholder was a mistake. How did you go
      back to them, and what happened to their trust in you?
    expected_concepts:
      - recognising the mistake promptly
      - owning it without excuses
      - explaining what changed or what was misjudged
      - offering the best available alternative
      - changing how they make commitments
    rubric:
      excellent: Raised it promptly, owned the misjudgement plainly, offered a credible alternative and describes a concrete change to how they commit, with evidence of how trust was maintained or rebuilt.
      good: Went back to the stakeholder with an explanation and alternative.
      weak: Let the commitment fail quietly, or blamed circumstances without owning the misjudgement.
    followups:
      - Why did you make the commitment in the first place?
      - What do you do differently now before saying yes?
    common_errors:
      - Waiting until the commitment is already missed.

  - external_key: managerial.stakeholders.stakeholder_dictating_solution
    competency_key: stakeholder_management
    topic: A stakeholder prescribing the implementation
    difficulty: medium
    text: >-
      Tell me about a stakeholder who came to your team not with a problem but with a specific technical solution they
      wanted built. How did you handle it, and what got built in the end?
    expected_concepts:
      - asking about the underlying problem and goal
      - respecting their domain knowledge
      - proposing alternatives with trade-offs
      - agreeing a split where they own the what and the team owns the how
    rubric:
      excellent: Uncovered the actual problem, compared the prescribed solution with alternatives on real trade-offs, and reached a solution both sides supported, with a clearer division of responsibilities afterwards.
      good: Redirected the conversation to the problem and reached a reasonable outcome.
      weak: Built exactly what was prescribed despite concerns, or dismissed the stakeholder's idea without engaging.
    followups:
      - Was their proposed solution actually better in any way?
    common_errors:
      - Assuming the stakeholder's solution is wrong because it came from outside engineering.

  - external_key: managerial.stakeholders.async_alignment_distributed
    competency_key: communication
    topic: Keeping distributed stakeholders aligned
    difficulty: easy
    text: >-
      When your stakeholders are spread across several time zones and rarely in the same meeting, how do you keep everyone
      aligned on decisions and progress?
    expected_concepts:
      - written updates and decision records as the default
      - rotating or recorded meetings so no group is always excluded
      - clear owners and deadlines for input
      - one shared place for current status
    rubric:
      excellent: Describes written-first practices, fair meeting arrangements, explicit deadlines for input and a single source of truth, with an example of it working.
      good: Uses written updates and some coordination practices.
      weak: Relies on meetings that some stakeholders can never attend.
    followups:
      - How do you make a decision when one group hasn't responded by the deadline?
    common_errors:
      - Making decisions in a meeting and assuming absent groups will catch up.

  - external_key: managerial.stakeholders.sharing_business_context
    competency_key: mentoring
    topic: Helping engineers understand the business context
    difficulty: easy
    text: >-
      How do you help engineers on your team understand the business reasons behind what stakeholders ask for, so they can
      make better decisions on their own?
    expected_concepts:
      - sharing goals and customer problems, not just tickets
      - bringing engineers into stakeholder or customer conversations
      - explaining the reasoning behind priority decisions
      - encouraging engineers to ask why
    rubric:
      excellent: Describes concrete practices for sharing context and gives an example where an engineer used that understanding to make a better decision or suggestion.
      good: Shares context regularly in some form.
      weak: Passes on tasks without context, keeping business reasoning with the manager.
    followups:
      - Can you give an example where that context changed what an engineer built?
    common_errors:
      - Sharing context only in large meetings where engineers can't ask questions.

  - external_key: managerial.stakeholders.ownership_boundary_dispute
    competency_key: stakeholder_management
    topic: Resolving who owns a piece of work
    difficulty: medium
    text: >-
      Tell me about a time another team kept handing your team work you believed belonged to them. How did you resolve who
      owned it, and how did you avoid damaging the relationship?
    expected_concepts:
      - clarifying the facts of what is being handed over and why
      - a direct conversation about ownership with the other lead
      - looking at what makes sense for the system and the business
      - writing down the agreed ownership
      - escalating only if needed
    rubric:
      excellent: Discussed ownership directly with the other lead using the work's nature and business sense rather than convenience, recorded the agreement, and kept the relationship workable.
      good: Reached a clear ownership agreement with a reasonable process.
      weak: Quietly absorbed the work, or refused it without discussion.
    followups:
      - Was it truly their work, or did you end up taking some of it?
      - What did you write down, and where?
    common_errors:
      - Arguing ownership on workload grounds alone.

  - external_key: managerial.stakeholders.platform_many_customers
    competency_key: stakeholder_management
    topic: A platform team with many internal customers
    difficulty: hard
    text: >-
      When a team serves many internal customers who each want something different from it, how do you decide what to
      build and explain those decisions to the teams who don't get what they asked for? Tell me how you've done this.
    expected_concepts:
      - understanding demand across customers rather than the loudest one
      - criteria such as breadth of impact and strategic fit
      - a published roadmap and request process
      - self-service or extension points instead of one-off work
      - regular forums with customer teams
    rubric:
      excellent: Uses explicit criteria across all customer teams, publishes decisions with reasoning, reduces one-off requests through self-service or extension points, and shows how they handled a customer team that was unhappy.
      good: Has a sensible prioritisation method and communicates it.
      weak: Builds for whoever escalates most, or lets the platform fragment into one-off features.
    followups:
      - How did you handle a powerful internal customer whose request you declined?
      - How do you measure whether the platform is serving its customers well?
      - When do you accept a one-off customisation?
    common_errors:
      - Treating the largest customer team's roadmap as the platform's roadmap.

  - external_key: managerial.stakeholders.stakeholder_changes_mind
    competency_key: stakeholder_management
    topic: A stakeholder whose requirements keep changing
    difficulty: medium
    text: >-
      Tell me about a stakeholder whose requirements kept changing week to week. How did you work out why it was
      happening, and what did you change in how you worked with them?
    expected_concepts:
      - finding the cause such as unclear goals or pressure from their own leadership
      - showing the cost of changes in time or rework
      - shorter feedback loops or prototypes to settle direction earlier
      - an agreed way to handle changes
    rubric:
      excellent: Diagnosed why the requirements were changing, made the cost of change visible, and introduced a practical change such as prototypes or decision checkpoints that reduced churn.
      good: Managed the changes with some structure and visibility.
      weak: Absorbed every change silently, or became rigid without understanding the cause.
    followups:
      - What was really driving the changes?
      - How did the stakeholder respond when you showed them the cost?
    common_errors:
      - Freezing requirements completely when the real problem was an unclear goal.

  - external_key: managerial.stakeholders.relationship_after_missed_delivery
    competency_key: stakeholder_management
    topic: Repairing a relationship after a missed delivery
    difficulty: medium
    text: >-
      Tell me about a time your team missed a significant commitment to another group. Apart from fixing the delivery, what
      did you do to repair the working relationship with them?
    expected_concepts:
      - acknowledging the impact on their plans directly
      - understanding the knock-on effects they suffered
      - a credible recovery plan with checkpoints
      - more frequent, transparent updates for a period
      - evidence the relationship recovered
    rubric:
      excellent: Acknowledged the impact on the other group directly, understood their knock-on costs, delivered a credible recovery with visible checkpoints and shows how the relationship was rebuilt over time.
      good: Acknowledged the miss and recovered the delivery with good communication.
      weak: Focused only on the technical recovery, or minimised the impact on the other group.
    followups:
      - What did the miss cost the other group?
      - How did you know the relationship had recovered?
    common_errors:
      - Offering a new date without explaining why it is more reliable than the last one.

  - external_key: managerial.stakeholders.recording_decisions
    competency_key: communication
    topic: Stopping decisions from being reopened
    difficulty: medium
    text: >-
      Have you worked somewhere decisions kept getting reopened weeks after they were made? Tell me what you did to make
      decisions stick without making the process heavy.
    expected_concepts:
      - lightweight written decision records
      - recording who decided, options considered and reasoning
      - sharing decisions with everyone affected
      - a clear bar for reopening, such as new information
    rubric:
      excellent: Introduced a lightweight decision record with owner, options and reasoning, shared it with affected groups and agreed when reopening is legitimate, with evidence it reduced churn.
      good: Introduced some documentation of decisions that helped.
      weak: Relies on memory or meeting notes nobody reads, or forbids revisiting decisions even with new information.
    followups:
      - What does a decision record look like in practice for you?
    common_errors:
      - Making the process so heavy that people avoid recording decisions at all.

  - external_key: managerial.stakeholders.vague_leadership_ask
    competency_key: leadership
    topic: Turning a vague ask from leadership into a plan
    difficulty: easy
    text: >-
      Tell me about a time leadership gave your team a vague goal, something like make it faster or improve reliability.
      How did you turn it into something concrete you could commit to?
    expected_concepts:
      - asking what outcome they want and why now
      - defining a measurable target
      - confirming the interpretation back with leadership
      - a plan with milestones toward the target
    rubric:
      excellent: Clarified the intent, defined a measurable target, confirmed it with leadership before committing and reported progress against it.
      good: Made the goal concrete with some measure.
      weak: Started work on their own interpretation without confirming it.
    followups:
      - What metric did you choose, and did leadership agree with it?
    common_errors:
      - Choosing a metric that is easy to move but doesn't reflect what leadership cared about.

  - external_key: managerial.stakeholders.consistent_voice_across_leads
    competency_key: leadership
    topic: Avoiding mixed messages from your team
    difficulty: medium
    text: >-
      When several people on your team, such as tech leads or senior engineers, talk to the same stakeholders, how do you
      avoid those stakeholders hearing different answers from different people? Give me an example.
    expected_concepts:
      - clear ownership of each stakeholder relationship
      - shared view of priorities and commitments within the team
      - rules for who can commit to dates or scope
      - quick internal sync when conflicting messages appear
    rubric:
      excellent: Describes explicit relationship ownership, a shared view of commitments and clear rules on who can commit, with an example of fixing a mixed message.
      good: Has some coordination to keep messages consistent.
      weak: Funnels everything through themselves, or has no coordination at all.
    followups:
      - What happened when a stakeholder got two different answers?
    common_errors:
      - Fixing inconsistency by becoming the only point of contact.

  - external_key: managerial.stakeholders.renegotiating_team_charter
    competency_key: leadership
    topic: Renegotiating your team's remit
    difficulty: hard
    text: >-
      Tell me about a time your team's remit had grown beyond what it could realistically support. How did you get
      leadership and the affected teams to agree on what your team would stop owning?
    expected_concepts:
      - evidence of the overload and its effect on quality or delivery
      - a proposal for what to hand off, retire or reduce
      - working with receiving teams on transition
      - getting leadership to endorse the change
      - communicating the new remit widely
    rubric:
      excellent: Built an evidence-based case, proposed specific handoffs or retirements, worked with receiving teams on a realistic transition and secured leadership endorsement, with a clearly communicated outcome.
      good: Got some areas handed off with a reasonable process.
      weak: Kept accepting more scope, or tried to drop responsibilities without agreement.
    followups:
      - Which responsibility was hardest to give up, and why?
      - How did the receiving team feel about taking it on?
    common_errors:
      - Handing work to another team without the knowledge or tooling they need.

  - external_key: managerial.stakeholders.vendor_delays
    competency_key: stakeholder_management
    topic: An external vendor putting your plan at risk
    difficulty: medium
    text: >-
      Tell me about an external vendor or partner whose delays threatened something your team had committed to. How did you
      manage them, and what did you tell your own stakeholders?
    expected_concepts:
      - clear contract or agreement terms and escalation routes
      - regular checkpoints and evidence of progress
      - contingency options
      - transparent updates to internal stakeholders
    rubric:
      excellent: Used the agreement and escalation routes effectively, tracked real progress, prepared contingency options and kept internal stakeholders informed with realistic dates.
      good: Managed the vendor actively with reasonable communication internally.
      weak: Waited passively for the vendor and passed the vendor's optimistic dates straight to stakeholders.
    followups:
      - What leverage did you actually have?
      - What would you put in the agreement next time?
    common_errors:
      - Repeating the vendor's dates without independent checks.

  - external_key: managerial.stakeholders.coaching_escalation_timing
    competency_key: mentoring
    topic: Coaching a lead on when to escalate
    difficulty: medium
    text: >-
      Tell me about someone you coached who either escalated problems too quickly or held on to them too long. What did you
      do to help them get the timing right?
    expected_concepts:
      - specific examples discussed with them
      - a practical rule of thumb for when to escalate
      - framing escalation as normal and expected
      - reviewing later escalations together
    rubric:
      excellent: Used concrete past examples to coach, gave a practical heuristic, made escalation feel normal and reviewed real cases together, with evidence of improved judgement.
      good: Gave useful guidance with some follow-up.
      weak: Just told them to escalate more or less, or took over their problems.
    followups:
      - What rule of thumb did you give them?
    common_errors:
      - Criticising an escalation in a way that discourages future ones.

  - external_key: managerial.stakeholders.program_critical_path
    competency_key: project_management
    topic: A cross-team program blocked on the critical path
    difficulty: hard
    text: >-
      Tell me about a program spanning several teams where the critical path ran through a team that couldn't commit to your
      dates. What did you do to get the program delivered?
    expected_concepts:
      - an integrated plan showing the true critical path
      - understanding the blocking team's constraints
      - options such as resequencing, lending people or reducing their scope
      - escalation with a clear decision request
      - tracking and adjusting as the program progressed
    rubric:
      excellent: Built an integrated view of the critical path, understood the blocking team's constraints, created options such as resequencing or shared staffing, escalated with a specific decision when needed and tracked the result.
      good: Identified the critical path and found a workable solution.
      weak: Pressured the blocking team repeatedly without changing the plan, or let the program slip without action.
    followups:
      - How did you find the real critical path?
      - What did leadership decide when you escalated?
      - What would you set up differently from the start?
    common_errors:
      - Managing each team's plan separately with no integrated view.

  - external_key: managerial.stakeholders.first_months_relationships
    competency_key: stakeholder_management
    topic: Building stakeholder relationships in a new role
    difficulty: easy
    text: >-
      When you join a new team or company, what do you do in the first couple of months to build relationships with the
      people your team depends on and serves?
    expected_concepts:
      - identifying key stakeholders early
      - listening conversations about their needs and frustrations
      - learning the history before changing things
      - an early, visible improvement for them
    rubric:
      excellent: Describes a deliberate approach to finding and meeting key stakeholders, listening before acting, and delivering an early improvement that built credibility.
      good: Meets stakeholders early and learns their needs.
      weak: Focuses only on the team internally and meets stakeholders when problems arise.
    followups:
      - What did you learn in those conversations that surprised you?
    common_errors:
      - Announcing changes before understanding the history behind current arrangements.
