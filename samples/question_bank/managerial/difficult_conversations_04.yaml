# Curated questions: managerial round, difficult conversations (part 4 of 4). Upward and peer conversations, confidentiality, ethics under pressure and serious conduct matters. Evaluation is based only on the content of the answer (observable work behaviour, never personal traits).
version: 1
defaults:
  role_tags:
  - engineering_manager
  - project_manager
  - tech_lead
  round_types:
  - managerial
  kind: leadership
questions:

- external_key: managerial.difficult_conversations.feedback_to_your_manager
  competency_key: communication
  topic: Giving feedback upward
  difficulty: easy
  text: >-
    How do you give feedback to your own manager about something that is affecting you or your team?
  expected_concepts:
  - choosing a private setting
  - specific example
  - the effect on work
  - a suggestion
  - asking for their view
  rubric:
    excellent: >-
      Chooses a private setting, uses a specific example, describes the effect on work, offers a suggestion
      and asks for their view.
    good: Raises the issue with an example.
    weak: Complains to peers instead.
  followups:
  - What example did you use?
  - How did they respond?
  common_errors:
  - Raising the issue with colleagues rather than the manager.

- external_key: managerial.difficult_conversations.peer_behaviour_feedback
  competency_key: collaboration
  topic: Giving feedback to a peer
  difficulty: easy
  text: >-
    A peer's habits are making it harder for your team to work with theirs. How do you raise it?
  expected_concepts:
  - asking permission to share an observation
  - specific examples
  - effect on work
  - listening
  - agreeing next steps
  rubric:
    excellent: >-
      Asks permission, gives specific examples and effect, listens and agrees next steps.
    good: Talks to the peer with examples.
    weak: Complains to their manager first.
  followups:
  - How do you open it?
  - What if they dispute it?
  common_errors:
  - Complains to their manager first.

- external_key: managerial.difficult_conversations.saying_no_to_peer_request
  competency_key: stakeholder_management
  topic: Declining a peer's request
  difficulty: easy
  text: >-
    A peer asks for help that you can't give without hurting your own commitments. How do you say no?
  expected_concepts:
  - being direct
  - explaining the constraint
  - offering an alternative
  - staying friendly
  - revisiting later
  rubric:
    excellent: >-
      Is direct, explains the constraint, offers an alternative, stays friendly and says when it could
      be revisited.
    good: Declines politely with a reason.
    weak: Says yes and fails, or declines curtly.
  followups:
  - What alternative did you offer?
  - How did they respond?
  common_errors:
  - Says yes and fails, or declines curtly.

- external_key: managerial.difficult_conversations.correcting_own_mistake
  competency_key: ownership
  topic: Correcting a mistake you made in front of others
  difficulty: easy
  text: >-
    You realise you gave your team wrong information or made a mistake in a decision. How do you address
    it with them?
  expected_concepts:
  - acknowledging quickly
  - stating the correct information
  - explaining impact
  - what you will change
  - no excess apology
  rubric:
    excellent: >-
      Acknowledges quickly, gives the correct information, explains impact, says what changes and avoids
      excess apology.
    good: Corrects and apologises.
    weak: Hides or minimises the mistake.
  followups:
  - When did this happen?
  - How did the team respond?
  common_errors:
  - Hides or minimises the mistake.

- external_key: managerial.difficult_conversations.repair_after_bad_conversation
  competency_key: adaptability
  topic: Following up after a conversation that went badly
  difficulty: easy
  text: A conversation with a team member went poorly. What do you do afterwards?
  expected_concepts:
  - reflecting on what went wrong
  - reaching out soon
  - acknowledging your part
  - restating the intent
  - agreeing how to continue
  rubric:
    excellent: >-
      Reflects, reaches out soon, acknowledges their part, restates intent and agrees how to continue.
    good: Follows up with an apology.
    weak: Avoids the person.
  followups:
  - What did you reflect on?
  - How did they respond?
  common_errors:
  - Avoids the person.

- external_key: managerial.difficult_conversations.confidentiality_boundaries
  competency_key: ownership
  topic: Handling confidential information with the team
  difficulty: easy
  text: >-
    You know about a sensitive decision that hasn't been announced and a team member asks you about it.
    What do you say?
  expected_concepts:
  - not sharing confidential details
  - being truthful that you can't discuss it
  - not lying
  - committing to share when you can
  - keeping trust
  rubric:
    excellent: >-
      Declines to share confidential details, says plainly that they can't discuss it, does not mislead,
      commits to share when possible and keeps trust.
    good: Declines politely.
    weak: Denies knowing or leaks.
  followups:
  - How do you avoid misleading?
  - What do you say next time?
  common_errors:
  - Denies knowing or leaks.

- external_key: managerial.difficult_conversations.disagree_with_manager_plan
  competency_key: stakeholder_management
  topic: Disagreeing with your manager's plan
  difficulty: medium
  text: >-
    Your manager proposes a plan you think won't work. How do you raise your concerns?
  expected_concepts:
  - understanding the goal
  - private conversation
  - evidence and alternatives
  - accepting the decision when made
  - following through
  rubric:
    excellent: >-
      Understands the goal, raises concerns privately with evidence and alternatives, accepts the decision
      and follows through.
    good: Raises concerns respectfully.
    weak: Complies silently or undermines.
  followups:
  - What did you propose?
  - What happened after the decision?
  common_errors:
  - Complies silently or undermines.

- external_key: managerial.difficult_conversations.unreasonable_senior_demand
  competency_key: stakeholder_management
  topic: A senior stakeholder making unreasonable demands
  difficulty: medium
  text: >-
    A senior stakeholder keeps making demands your team can't meet. How do you have that conversation?
  expected_concepts:
  - understanding the underlying need
  - showing facts
  - offering options
  - stating limits
  - seeking a shared way forward
  rubric:
    excellent: >-
      Understands the need, shows facts, offers options, states limits and seeks a shared way forward.
    good: Explains constraints and offers options.
    weak: Refuses or complies.
  followups:
  - What option did you offer?
  - What if they escalate?
  common_errors:
  - Refuses or complies.

- external_key: managerial.difficult_conversations.peer_manager_overstepping
  competency_key: collaboration
  topic: A peer manager making decisions about your team
  difficulty: medium
  text: >-
    A peer manager is directing your team members' work without involving you. How do you address it?
  expected_concepts:
  - gathering facts
  - speaking to the peer directly
  - clarifying roles
  - agreeing how to coordinate
  - involving your manager if needed
  rubric:
    excellent: >-
      Gathers facts, speaks directly, clarifies roles, agrees coordination and involves the manager only
      if needed.
    good: Talks to the peer manager.
    weak: Complains to team or leaders.
  followups:
  - What did the peer say?
  - What was agreed?
  common_errors:
  - Complains to team or leaders.

- external_key: managerial.difficult_conversations.relaying_feedback_from_others
  competency_key: communication
  topic: Passing on feedback from someone else
  difficulty: medium
  text: >-
    A stakeholder gives you critical feedback about a team member. How do you pass it on?
  expected_concepts:
  - checking the facts
  - asking for specifics
  - sharing the substance not gossip
  - being careful about attribution
  - offering support
  rubric:
    excellent: >-
      Checks facts, asks for specifics, shares the substance, handles attribution carefully and offers
      support.
    good: Shares the feedback with examples.
    weak: Passes it on verbatim without checking.
  followups:
  - Do you name the source?
  - What if the feedback is vague?
  common_errors:
  - Passes it on verbatim without checking.

- external_key: managerial.difficult_conversations.personal_matters_affecting_work
  competency_key: leadership
  topic: A team member whose circumstances are affecting their work
  difficulty: medium
  text: >-
    A team member tells you that something outside of work is making it hard for them to deliver. How
    do you respond?
  expected_concepts:
  - listening
  - keeping the focus on work arrangements and options
  - pointing to available company resources
  - keeping confidence
  - not asking for or recording personal details
  rubric:
    excellent: >-
      Listens, focuses on work arrangements and options, points to company resources, keeps confidence
      and doesn't ask for or record personal details.
    good: Listens and adjusts workload.
    weak: Asks for details or ignores it.
  followups:
  - What adjustments can you offer?
  - What do you record?
  common_errors:
  - Asks for details or ignores it.

- external_key: managerial.difficult_conversations.lateness_to_commitments
  competency_key: ownership
  topic: Someone regularly missing meetings or handoffs
  difficulty: medium
  text: >-
    A team member regularly misses meetings or handoffs, and others are affected. How do you talk to them?
  expected_concepts:
  - specific instances
  - effect on others
  - asking about obstacles
  - clear expectations
  - follow-up
  rubric:
    excellent: >-
      Gives specific instances, describes the effect, asks about obstacles, sets clear expectations and
      follows up.
    good: Raises it with examples.
    weak: Ignores it or complains to others.
  followups:
  - What obstacles came up?
  - How did you follow up?
  common_errors:
  - Ignores it or complains to others.

- external_key: managerial.difficult_conversations.resists_feedback
  competency_key: mentoring
  topic: Someone who argues with every piece of feedback
  difficulty: medium
  text: A team member pushes back on all feedback you give. How do you work with them?
  expected_concepts:
  - listening to their view
  - focusing on observable behaviour
  - agreeing shared facts
  - setting clear expectations
  - documenting
  rubric:
    excellent: >-
      Listens to their view, focuses on observable behaviour, agrees shared facts, sets clear expectations
      and documents.
    good: Gives specific feedback and listens.
    weak: Gives up or escalates.
  followups:
  - What facts did you agree?
  - How did you document?
  common_errors:
  - Gives up or escalates.

- external_key: managerial.difficult_conversations.quiet_contributor
  competency_key: mentoring
  topic: A team member who contributes little in discussions
  difficulty: medium
  text: >-
    A team member rarely contributes in discussions but delivers work. How do you address contribution
    to the team's thinking?
  expected_concepts:
  - understanding preferences
  - offering alternative ways to contribute
  - asking their view directly
  - setting expectations
  - recognising contributions
  rubric:
    excellent: >-
      Understands preferences, offers written and other ways to contribute, asks their view, sets expectations
      and recognises contributions.
    good: Invites them to speak.
    weak: Penalises them for being quiet.
  followups:
  - What ways did you offer?
  - How did you recognise it?
  common_errors:
  - Penalises them for being quiet.

- external_key: managerial.difficult_conversations.new_manager_feedback
  competency_key: mentoring
  topic: Giving feedback to someone new to managing
  difficulty: medium
  text: >-
    A new team lead who reports to you is making mistakes in handling their team. How do you give feedback?
  expected_concepts:
  - observing first
  - acknowledging effort
  - specific examples
  - coaching with questions
  - regular one-to-ones
  rubric:
    excellent: >-
      Observes first, acknowledges effort, uses specific examples, coaches with questions and holds regular
      one-to-ones.
    good: Gives feedback with examples.
    weak: Takes over their team.
  followups:
  - What example did you use?
  - How did you coach them?
  common_errors:
  - Takes over their team.

- external_key: managerial.difficult_conversations.customer_escalation_conversation
  competency_key: stakeholder_management
  topic: A tough conversation with a customer
  difficulty: medium
  text: >-
    A customer is unhappy with your team's work and demands a meeting. How do you prepare and run it?
  expected_concepts:
  - understanding the facts
  - listening first
  - acknowledging impact
  - options and timelines
  - follow-up
  rubric:
    excellent: >-
      Understands the facts, listens first, acknowledges impact, offers options and timelines and follows
      up in writing.
    good: Listens and offers a plan.
    weak: Defends the team.
  followups:
  - What did you prepare?
  - How did you follow up?
  common_errors:
  - Defends the team.

- external_key: managerial.difficult_conversations.executive_deadline_negotiation
  competency_key: stakeholder_management
  topic: Negotiating a deadline with an executive
  difficulty: medium
  text: >-
    An executive sets a deadline that you believe is not achievable. How do you handle the conversation?
  expected_concepts:
  - understanding the driver
  - sharing the analysis
  - options of scope, date or resources
  - recording the decision
  - agreeing check-ins
  rubric:
    excellent: >-
      Understands the driver, shares analysis, offers options on scope, date or resources, records the
      decision and agrees check-ins.
    good: Explains and negotiates.
    weak: Accepts without question.
  followups:
  - What options did you offer?
  - How did they respond?
  common_errors:
  - Accepts without question.

- external_key: managerial.difficult_conversations.misinformation_from_senior
  competency_key: communication
  topic: A senior person stating something inaccurate
  difficulty: medium
  text: >-
    A senior leader states something inaccurate about your team's work in a public meeting. What do you
    do?
  expected_concepts:
  - considering the context
  - correcting politely with facts
  - or following up privately
  - avoiding embarrassment
  - ensuring the record is right
  rubric:
    excellent: >-
      Considers the context, corrects with facts politely or follows up privately and makes sure the record
      is right.
    good: Follows up privately.
    weak: Stays silent or contradicts rudely.
  followups:
  - When would you correct publicly?
  - What did you say?
  common_errors:
  - Stays silent or contradicts rudely.

- external_key: managerial.difficult_conversations.ethical_concern_with_instruction
  competency_key: ownership
  topic: Being asked to do something you think is wrong
  difficulty: hard
  text: >-
    Your manager asks you to do something that you believe is unethical or breaks policy. What do you
    do?
  expected_concepts:
  - clarifying the request
  - stating the concern
  - checking policy
  - using the proper channels
  - documenting
  - refusing if needed
  rubric:
    excellent: >-
      Clarifies, states the concern, checks policy, uses proper channels, documents and refuses if needed.
    good: Raises the concern with the manager.
    weak: Complies silently.
  followups:
  - Which channels?
  - What would make you refuse?
  common_errors:
  - Complies silently.

- external_key: managerial.difficult_conversations.unfair_rating_pressure
  competency_key: ownership
  topic: Pressure to rate people in a particular way
  difficulty: hard
  text: >-
    You are pushed to rate team members in a way that doesn't match your evidence. How do you respond?
  expected_concepts:
  - presenting evidence
  - asking for the criteria
  - standing for fairness
  - documenting
  - escalating if needed
  rubric:
    excellent: >-
      Presents evidence, asks for the criteria, stands for fairness, documents and escalates if needed.
    good: Explains evidence and objects.
    weak: Changes ratings to please.
  followups:
  - What evidence did you present?
  - What did you document?
  common_errors:
  - Changes ratings to please.

- external_key: managerial.difficult_conversations.executive_behaviour
  competency_key: leadership
  topic: Raising concerns about a senior leader's conduct
  difficulty: hard
  text: >-
    A senior leader's behaviour is affecting your team's work. How do you raise this?
  expected_concepts:
  - gathering examples
  - considering the right channel
  - speaking to them directly if safe
  - HR or higher leader
  - protecting the team
  rubric:
    excellent: >-
      Gathers examples, considers the right channel, speaks directly if safe, involves HR or a higher
      leader and protects the team.
    good: Raises the issue with the right person.
    weak: Avoids it.
  followups:
  - Which channel did you pick?
  - How did you protect the team?
  common_errors:
  - Avoids it.

- external_key: managerial.difficult_conversations.leak_of_confidential_info
  competency_key: ownership
  topic: Confidential information has been shared improperly
  difficulty: hard
  text: >-
    You learn that confidential information was shared outside the group. How do you handle the conversation
    with the person involved?
  expected_concepts:
  - facts first
  - following the process
  - speaking to the person
  - explaining the impact
  - consequences
  - confidentiality
  rubric:
    excellent: >-
      Establishes facts first, follows the process, speaks to the person, explains impact and consequences
      and maintains confidentiality.
    good: Speaks to them and informs HR.
    weak: Accuses without facts.
  followups:
  - What do you establish first?
  - Who do you inform?
  common_errors:
  - Accuses without facts.

- external_key: managerial.difficult_conversations.termination_for_cause
  competency_key: leadership
  topic: Ending employment after repeated serious issues
  difficulty: hard
  text: >-
    After repeated and documented issues, a team member's employment will end. How do you handle your
    role in this?
  expected_concepts:
  - following HR and legal process
  - documented history
  - clear and respectful message
  - logistics
  - supporting the team
  rubric:
    excellent: >-
      Follows HR and legal process, relies on the documented history, delivers a clear and respectful
      message, handles logistics and supports the team.
    good: Delivers the decision with HR.
    weak: Delivers it informally.
  followups:
  - What do you prepare?
  - How do you communicate to the team?
  common_errors:
  - Delivers it informally.

- external_key: managerial.difficult_conversations.disagreement_with_hr_advice
  competency_key: stakeholder_management
  topic: Differing from HR's advice
  difficulty: hard
  text: >-
    HR advises a course of action in a people matter that you think is wrong for your team. How do you
    handle it?
  expected_concepts:
  - understanding the rationale
  - sharing context
  - considering policy and legal reasons
  - agreeing a path
  - escalating if needed
  rubric:
    excellent: >-
      Understands the rationale, shares context, considers policy and legal reasons, agrees a path and
      escalates if needed.
    good: Discusses with HR.
    weak: Ignores the advice.
  followups:
  - What did you learn from HR?
  - Where did you land?
  common_errors:
  - Ignores the advice.

- external_key: managerial.difficult_conversations.feedback_that_was_wrong
  competency_key: adaptability
  topic: Learning that your earlier feedback was mistaken
  difficulty: medium
  text: >-
    You gave a team member critical feedback and later found that part of it was based on incomplete information.
    What do you do?
  expected_concepts:
  - checking the new facts
  - going back to the person promptly
  - correcting the record
  - acknowledging the effect
  - adjusting how you gather evidence
  rubric:
    excellent: >-
      Checks the new facts, goes back promptly, corrects any record, acknowledges the effect and changes
      how evidence is gathered.
    good: Corrects it with the person.
    weak: Says nothing to avoid undermining their authority.
  followups:
  - How did the person respond?
  - What changed in how you collect evidence?
  common_errors:
  - Leaving the mistaken feedback uncorrected to protect their own authority.
