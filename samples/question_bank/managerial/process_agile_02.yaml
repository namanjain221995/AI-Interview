# Managerial round: agile practices and team process (part 2 of 4).
# Focus: estimation and forecasting, refinement and backlog, product partnership, planning under
# pressure and unplanned work.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ estimation and forecasting
  - external_key: managerial.process_agile.estimation_approach_choice
    competency_key: agile_delivery
    topic: How the team estimates and why
    difficulty: easy
    text: >-
      How does your team estimate work today, and why did you settle on that approach rather than another one?
    expected_concepts:
      - the specific technique, such as points, t-shirt sizes or counting items
      - what the estimates are actually used for
      - effort the technique costs the team
      - how it changed or might change over time
    rubric:
      excellent: Describes the technique precisely, links it to the decisions the estimates support, and explains why alternatives were rejected or tried.
      good: Describes a real technique with some reasoning about why it fits.
      weak: Describes estimation as a ritual with no clear use, or cannot say why that method was chosen.
    followups:
      - Who uses those estimates, and for what?
      - What would make you change the approach?
    common_errors:
      - Estimating in detail when nobody uses the result for a decision.

  - external_key: managerial.process_agile.throughput_forecasting_trial
    competency_key: agile_delivery
    topic: Forecasting from throughput instead of estimates
    difficulty: hard
    text: >-
      Some teams stop estimating individual stories and forecast from their historical throughput instead. Tell
      me about a time you considered or tried something like that, and what you learned about where it works
      and where it doesn't.
    expected_concepts:
      - need for reasonably consistent item sizes
      - using historical data and ranges or probabilistic forecasts
      - time saved versus information lost
      - how stakeholders reacted to range-based forecasts
      - situations where explicit estimates still help, such as large unknown work
    rubric:
      excellent: Describes a real trial or careful evaluation, explains the conditions it depends on, compares forecasting accuracy or effort against the old approach and identifies where explicit estimation is still worthwhile.
      good: Shows a solid understanding with some real experience, but the comparison is mostly qualitative.
      weak: Dismisses or praises the idea without experience or understanding of its preconditions.
    followups:
      - How did you present the forecast to stakeholders?
      - What happened when a very large item came along?
    common_errors:
      - Counting items without first making them roughly similar in size.

  - external_key: managerial.process_agile.data_based_delivery_forecast
    competency_key: project_management
    topic: Producing a delivery forecast from team data
    difficulty: medium
    text: >-
      When a stakeholder asks when a set of features will be ready, how do you produce a forecast from your
      team's actual delivery data? Walk me through the last time you did it.
    expected_concepts:
      - sizing or counting the remaining work
      - using historical throughput or velocity ranges
      - giving a range or confidence level rather than a single date
      - stating assumptions and risks
      - updating the forecast as work progresses
    rubric:
      excellent: Walks through a real forecast built from historical data, presented as a range with explicit assumptions, and explains how it was updated and how close it turned out to be.
      good: Uses real data and gives a reasonable forecast, but presents a single date or does not update it.
      weak: Gives a date from gut feel or simply adds up optimistic estimates.
    followups:
      - How accurate did it turn out to be?
      - What did you do when scope was added halfway through?
    common_errors:
      - Ignoring scope growth that typically happens during delivery.

  # ------------------------------------------------------------ refinement and backlog
  - external_key: managerial.process_agile.refinement_made_useful
    competency_key: agile_delivery
    topic: Making backlog refinement useful
    difficulty: medium
    text: >-
      What does a good backlog refinement session look like on your team, and tell me about a change you made
      that made refinement more useful.
    expected_concepts:
      - clear inputs prepared before the session
      - right people present, including product and testing perspectives
      - outcomes such as acceptance criteria, splits and open questions resolved
      - looking a sprint or two ahead rather than too far
      - a specific change and its effect on planning
    rubric:
      excellent: Describes concrete expectations for a good session, a specific change they made and evidence such as shorter planning or fewer surprises mid-sprint.
      good: Describes a reasonable refinement practice and a change, with limited evidence of impact.
      weak: Treats refinement as a general discussion or as estimation only.
    followups:
      - How far ahead does your team refine, and why?
      - What happens to items that still aren't clear after refinement?
    common_errors:
      - Refining items so far ahead that the detail is stale by the time work starts.

  - external_key: managerial.process_agile.teaching_story_splitting
    competency_key: mentoring
    topic: Teaching people to split large stories
    difficulty: medium
    text: >-
      How have you taught engineers or product owners to split large stories into smaller pieces that still
      deliver something usable? Give me a specific example.
    expected_concepts:
      - splitting by workflow step, rule, data variation or interface
      - keeping each slice end to end rather than by technical layer
      - working through real backlog items together
      - letting others lead the splitting over time
      - effect on cycle time or feedback speed
    rubric:
      excellent: Gives a real coaching example with specific splitting patterns, explains how they built others' skill rather than splitting for them, and shows an effect on delivery.
      good: Describes useful techniques with a real example, but less on how others learned to do it.
      weak: Splits by technical layer, or does the splitting themselves without building others' skill.
    followups:
      - Show me how you'd split one feature you worked on recently.
      - How did you know the person had picked up the skill?
    common_errors:
      - Splitting into front-end, back-end and database tasks that deliver nothing on their own.

  - external_key: managerial.process_agile.definition_of_ready_gate
    competency_key: agile_delivery
    topic: Ready enough without a bottleneck
    difficulty: medium
    text: >-
      Some teams introduce a strict definition of ready, and it ends up as a gate that slows everything down.
      How have you balanced making work ready enough without creating that bottleneck?
    expected_concepts:
      - minimum information really needed before starting
      - allowing open questions to be resolved during the work
      - shared responsibility between product and engineering
      - watching for items bouncing back and forth
      - adjusting the criteria based on what caused problems
    rubric:
      excellent: Describes a lightweight readiness approach from experience, explains how they kept it from becoming a hand-off gate, and gives evidence of fewer surprises without slower flow.
      good: Shows awareness of the trade-off with a real approach, but little evidence of its effect.
      weak: Advocates a long checklist that must be complete before work begins, or has no readiness criteria at all.
    followups:
      - What is the one thing an item must have before your team starts it?
      - How did product respond to the criteria?
    common_errors:
      - Using readiness rules to push all uncertainty back onto the product owner.

  - external_key: managerial.process_agile.product_owner_partnership
    competency_key: collaboration
    topic: Partnering with a product owner on the backlog
    difficulty: medium
    text: >-
      Tell me about how you've worked with a product owner or product manager to keep the backlog in good
      shape. How did you split responsibilities between the two of you?
    expected_concepts:
      - clear ownership of priority versus technical approach
      - regular joint grooming or planning time
      - engineering input on cost, risk and technical work
      - resolving disagreements about ordering
      - keeping the backlog short and current
    rubric:
      excellent: Describes a specific partnership with clear division of responsibilities, regular routines, how technical work got prioritised and how disagreements were settled.
      good: Describes a working relationship with some clarity on roles, but routines or disagreements are not covered.
      weak: Describes the backlog as solely someone else's problem or takes over priority decisions entirely.
    followups:
      - Tell me about a disagreement you had over priorities.
      - How did technical work get onto the backlog?
    common_errors:
      - Leaving all backlog work to product and then complaining about quality of stories.

  - external_key: managerial.process_agile.product_owner_unavailable
    competency_key: stakeholder_management
    topic: Keeping a team moving without product availability
    difficulty: medium
    text: >-
      Tell me about a time your team's product owner was too stretched to be available for questions, planning
      or reviews. How did you keep the team moving, and how did you deal with the underlying problem?
    expected_concepts:
      - short-term workarounds such as batched questions or delegated decisions
      - making the cost of the gap visible
      - agreeing decision rights the team can use
      - raising the capacity issue with the product owner and their manager
      - outcome of the longer-term fix
    rubric:
      excellent: Describes concrete short-term measures, makes the cost visible with evidence, agrees decision rights, and escalates the structural problem constructively with a clear outcome.
      good: Keeps the team moving with sensible workarounds, but the root problem was not addressed.
      weak: Lets the team stall, or quietly takes over product decisions without agreement.
    followups:
      - Which decisions did the team start making on its own?
      - How did you raise it without damaging the relationship?
    common_errors:
      - Making product decisions on the owner's behalf without agreeing that in advance.

  - external_key: managerial.process_agile.review_feedback_changed_plan
    competency_key: stakeholder_management
    topic: Acting on sprint review feedback
    difficulty: medium
    text: >-
      Tell me about a piece of feedback from a sprint review or demo that changed what your team built next. How
      did you make room for that feedback in your plans?
    expected_concepts:
      - showing working software to the right audience
      - capturing and clarifying the feedback
      - assessing impact against the current plan
      - reordering the backlog with the product owner
      - telling stakeholders what changed because of their input
    rubric:
      excellent: Gives a specific piece of review feedback, explains how it was evaluated and worked into the plan, and how stakeholders saw the result.
      good: Gives a real example of feedback changing the plan, with a basic account of how it was handled.
      weak: Reviews are presentations with no feedback loop, or feedback was noted and never acted on.
    followups:
      - What did you defer to make room for it?
      - How did you let the stakeholder know their feedback was used?
    common_errors:
      - Treating every piece of review feedback as a new commitment without prioritising it.

  # ------------------------------------------------------------ planning and commitments
  - external_key: managerial.process_agile.planning_real_capacity
    competency_key: project_management
    topic: Planning against real capacity
    difficulty: easy
    text: >-
      When you plan a sprint or iteration, how do you account for things like support load, time off and
      meetings when deciding how much the team takes on?
    expected_concepts:
      - working out available days per person
      - reserving capacity for support and unplanned work based on history
      - using past delivery rather than ideal capacity
      - leaving slack rather than planning to full utilisation
    rubric:
      excellent: Describes a concrete capacity calculation grounded in historical data, with explicit allowances for support, interruptions and time off, and explains why they leave slack.
      good: Accounts for the main factors in a reasonable way, but not based on data.
      weak: Plans as if everyone is available full time for planned work.
    followups:
      - How did you decide how much to reserve for support?
      - What happens when the reserve isn't used?
    common_errors:
      - Planning to one hundred percent of capacity and then treating overruns as surprises.

  - external_key: managerial.process_agile.commitment_versus_forecast
    competency_key: agile_delivery
    topic: Commitment versus forecast
    difficulty: medium
    text: >-
      How do you explain the difference between a sprint commitment and a forecast to your team and its
      stakeholders, and how has that distinction played out for you in practice?
    expected_concepts:
      - commitment to a goal versus a forecast of scope
      - setting expectations that some scope may move
      - avoiding pressure that leads to hidden overtime or cut corners
      - how stakeholders were brought along
      - a real case where the distinction mattered
    rubric:
      excellent: Explains the distinction clearly, describes how they set expectations with both audiences, and gives a real case where it helped manage a slipping sprint without eroding trust.
      good: Understands the distinction and gives a reasonable example, with less on stakeholder expectations.
      weak: Treats every planned item as a fixed promise or treats plans as meaningless.
    followups:
      - What happens on your team when the sprint goal is at risk?
      - How did a stakeholder react the first time scope moved?
    common_errors:
      - Using the word forecast to avoid any accountability for delivery.

  - external_key: managerial.process_agile.fixed_date_and_scope
    competency_key: stakeholder_management
    topic: Iterating within a fixed date and scope
    difficulty: hard
    text: >-
      Tell me about a project where both the date and the scope were fixed by the business. How did you still
      work iteratively within that, and how did the trade-off conversations go?
    expected_concepts:
      - understanding why both were fixed and what truly could not move
      - finding flexibility in depth, quality of polish or rollout
      - delivering the riskiest parts first
      - frequent visible progress to stakeholders
      - escalating early with data when the plan became unrealistic
    rubric:
      excellent: Describes a real fixed constraint, explains how they found room to iterate, front-loaded risk, kept stakeholders informed with evidence and handled the trade-off conversation with a clear outcome.
      good: Works sensibly within the constraints and communicates, but trade-offs were raised late.
      weak: Accepted the constraints and hoped, or abandoned iteration entirely.
    followups:
      - What did you find that was actually negotiable?
      - When did you first raise the risk, and how?
    common_errors:
      - Waiting until the end to reveal that the plan could not be met.

  - external_key: managerial.process_agile.annual_roadmap_with_iterations
    competency_key: project_management
    topic: Reconciling a dated roadmap with short iterations
    difficulty: hard
    text: >-
      Leadership wants a twelve-month roadmap with dates, while your teams work in short iterations and expect
      plans to change. How have you reconciled those two needs?
    expected_concepts:
      - roadmaps with decreasing precision further out
      - themes or outcomes rather than detailed feature lists
      - regular re-planning cadence with leadership
      - confidence levels on dated items
      - understanding which dates are true external commitments
    rubric:
      excellent: Describes a real roadmap format that combined near-term detail with longer-term themes and confidence levels, a regular re-planning rhythm and how leadership came to trust it.
      good: Describes a sensible compromise with some evidence of how it was used.
      weak: Produces a detailed dated plan they know is fiction, or refuses to give leadership any longer view.
    followups:
      - How did you handle a date that really could not move?
      - How often did the roadmap change, and how did you communicate it?
    common_errors:
      - Presenting distant items with the same certainty as next month's work.

  # ------------------------------------------------------------ unplanned work and interruptions
  - external_key: managerial.process_agile.unplanned_work_stream
    competency_key: agile_delivery
    topic: Handling a steady stream of unplanned work
    difficulty: medium
    text: >-
      How have you handled a steady stream of unplanned work, such as production issues or urgent requests, on a
      team that also has planned feature work? Tell me what you set up and how well it worked.
    expected_concepts:
      - measuring how much unplanned work actually arrives
      - reserved capacity or a dedicated rotation
      - a clear intake and triage rule for what counts as urgent
      - reducing the sources of unplanned work over time
      - results on predictability of planned work
    rubric:
      excellent: Quantifies the unplanned load, describes a specific mechanism for absorbing it, a triage rule, work to reduce the sources and the measurable effect on planned delivery.
      good: Sets up a reasonable mechanism with a real example, but did not measure or reduce the load.
      weak: Lets unplanned work disrupt everyone with no mechanism, or ignores it in planning.
    followups:
      - What was the biggest source of unplanned work, and did it shrink?
      - Who decided what counted as urgent?
    common_errors:
      - Absorbing interrupts without ever tracking them, so planning never improves.

  - external_key: managerial.process_agile.interrupt_duty_rotation
    competency_key: leadership
    topic: Organising interrupt handling
    difficulty: easy
    text: >-
      Some teams name one person each week to absorb interruptions so everyone else can focus. Tell me about how
      you've organised interrupt handling on a team you've led.
    expected_concepts:
      - who handles interruptions and how it rotates
      - what the person on duty does when things are quiet
      - handover between rotations
      - fairness of the load across the team
    rubric:
      excellent: Describes a concrete arrangement with rotation, scope of duties, handover and how they kept it fair, plus what they changed after trying it.
      good: Describes a workable arrangement with a real team, but details on handover or fairness are missing.
      weak: Interruptions go to whoever is most experienced or nearest, with no structure.
    followups:
      - How did you stop the same people ending up with all the interruptions?
      - What did the person on duty work on when it was quiet?
    common_errors:
      - Letting the most experienced engineer absorb every interruption by default.

  - external_key: managerial.process_agile.progress_reporting_upward
    competency_key: communication
    topic: Reporting progress without status overhead
    difficulty: easy
    text: >-
      How do you report your team's progress to senior leadership without creating extra status work for the
      engineers? Tell me what you send and how often.
    expected_concepts:
      - drawing on the existing board or tools rather than separate reports
      - focusing on outcomes, risks and decisions needed
      - a consistent cadence and format
      - tailoring detail to the audience
    rubric:
      excellent: Describes a specific, consistent report built from existing data, focused on outcomes and risks, and explains how they kept the engineers' effort minimal.
      good: Describes a reasonable report and cadence, but it relies on some manual collection from the team.
      weak: Requires engineers to write regular status updates for leadership, or sends no structured updates.
    followups:
      - What does leadership most often ask about after reading it?
      - How do you report bad news in that format?
    common_errors:
      - Reporting activity instead of progress toward outcomes.

  # ------------------------------------------------------------ tooling, backlog health, priorities
  - external_key: managerial.process_agile.board_tool_overhead
    competency_key: agile_delivery
    topic: Simplifying an overgrown tracking setup
    difficulty: medium
    text: >-
      Tell me about a time your team's tracking tool or board had become more work to maintain than it was
      worth. What did you simplify, and how did you keep the information people actually needed?
    expected_concepts:
      - identifying who used which fields and reports
      - removing fields, statuses or rules no one relied on
      - keeping essential information for stakeholders
      - agreeing the change with the team and dependent users
      - checking that the board stayed accurate afterwards
    rubric:
      excellent: Gives a specific example, explains how they found out what was actually used, what they cut, how they protected genuinely needed information and the effect on the team's effort and board accuracy.
      good: Simplified the tool sensibly in a real case, with less attention to who relied on what.
      weak: Added more fields or rules, or changed tools without addressing the underlying overhead.
    followups:
      - Who was unhappy about something you removed?
      - How did you know the board stayed trustworthy?
    common_errors:
      - Switching to a new tool and recreating the same complexity.

  - external_key: managerial.process_agile.inherited_backlog_cleanup
    competency_key: agile_delivery
    topic: Cleaning up an inherited backlog
    difficulty: medium
    text: >-
      Tell me about a backlog you inherited that had grown to hundreds of items nobody looked at. What did you do
      with it, and how did you stop it from growing back?
    expected_concepts:
      - archiving or closing old items with a clear rule
      - keeping a short, ordered near-term backlog
      - agreeing the approach with product and stakeholders
      - an ongoing rule such as expiry or regular pruning
      - outcome on planning and refinement
    rubric:
      excellent: Describes a clear rule for pruning, how they got agreement from product and requesters, the ongoing habit that kept it small and the effect on planning.
      good: Cleaned up a real backlog with a sensible approach, but without an ongoing mechanism.
      weak: Left it alone, or deleted everything without telling the requesters.
    followups:
      - What did you tell people whose requests were closed?
      - How big is that backlog today?
    common_errors:
      - Treating the backlog as a record of every idea rather than a list of likely work.

  - external_key: managerial.process_agile.transparent_priority_ordering
    competency_key: project_management
    topic: Transparent ordering among competing stakeholders
    difficulty: medium
    text: >-
      When several stakeholders all want their item at the top of the backlog, what approach have you used to
      make the ordering transparent and agreed? Walk me through a real situation.
    expected_concepts:
      - shared criteria such as value, cost of delay or strategic fit
      - a forum where stakeholders see trade-offs together
      - involving the product owner or a single decision-maker
      - publishing the order and the reasons
      - revisiting priorities on a regular cadence
    rubric:
      excellent: Describes specific criteria and a forum that made trade-offs visible, who had the final call, and how stakeholders accepted the outcome even when their item was not first.
      good: Uses a reasonable approach in a real situation, though the criteria or decision rights were informal.
      weak: Orders by whoever pushes hardest, or decides privately without explaining.
    followups:
      - How did the stakeholder whose item came last react?
      - What happened when someone went around the process?
    common_errors:
      - Using a scoring model so complex that nobody trusts the numbers.

  - external_key: managerial.process_agile.cross_team_dependency_planning
    competency_key: project_management
    topic: Planning around other teams' dependencies
    difficulty: hard
    text: >-
      Tell me about a time your team's delivery depended on work from two or three other teams running on
      different cadences. How did you plan and coordinate so those dependencies didn't sink your iteration?
    expected_concepts:
      - identifying dependencies early in planning
      - agreeing explicit dates or interfaces with other teams
      - building around dependencies with stubs, contracts or reordering
      - a regular, lightweight cross-team check-in
      - escalation path when a dependency slipped
    rubric:
      excellent: Describes specific dependencies, how they were surfaced and agreed, techniques used to reduce coupling and how a slip was handled, with the result for delivery.
      good: Coordinates sensibly with other teams in a real example, but with limited mitigation when things slipped.
      weak: Discovered dependencies late and waited on other teams with no plan.
    followups:
      - What did you do when one team missed its date?
      - How could the work have been structured to avoid that dependency?
    common_errors:
      - Relying on informal promises with no shared visibility of the dependency.

  - external_key: managerial.process_agile.optimistic_junior_estimate
    competency_key: mentoring
    topic: Coaching on optimistic estimates
    difficulty: easy
    text: >-
      When a junior engineer gives an estimate you think is far too low, how do you handle it? Tell me about a
      time it happened.
    expected_concepts:
      - asking them to walk through the work rather than overriding
      - surfacing missing steps like testing, review and deployment
      - letting the estimate stand when the risk is low and reviewing afterwards
      - using past similar work as reference
    rubric:
      excellent: Describes a specific case where they helped the engineer find what was missing through questions, made a sensible call on the estimate and followed up to build the skill.
      good: Handles it constructively in a real example, but tends to correct rather than coach.
      weak: Silently overrides the estimate or lets it fail without discussion.
    followups:
      - What did the engineer miss in their estimate?
      - How did their estimates change over the following months?
    common_errors:
      - Replacing the engineer's estimate with their own without explanation.

  - external_key: managerial.process_agile.improving_predictability
    competency_key: agile_delivery
    topic: Making an unpredictable team predictable
    difficulty: hard
    text: >-
      Tell me about a team whose delivery was unpredictable and that you helped become more predictable. What did
      you measure before and after, and which changes made the real difference?
    expected_concepts:
      - baseline measure such as plan completion or cycle time spread
      - diagnosis of causes like large items, interrupts or dependencies
      - targeted changes such as smaller items or work-in-progress limits
      - measured improvement over several iterations
      - distinguishing what helped from what did not
    rubric:
      excellent: Gives a measured baseline, a clear diagnosis, specific changes and measured improvement, and explains which changes mattered most and why.
      good: Describes a real improvement with some data, though cause and effect are only loosely connected.
      weak: Claims improvement with no measurement, or improved predictability by padding estimates.
    followups:
      - Which change would you make first on a similar team?
      - Did anything get worse as predictability improved?
    common_errors:
      - Achieving predictability by committing to much less work without addressing the causes.

  - external_key: managerial.process_agile.discovery_in_delivery_rhythm
    competency_key: collaboration
    topic: Fitting discovery work into delivery
    difficulty: medium
    text: >-
      How have you fit discovery work, such as prototypes or user research, into an iterative delivery rhythm
      without it being squeezed out by feature work? Give me an example.
    expected_concepts:
      - explicit capacity or a parallel track for discovery
      - clear questions each discovery effort must answer
      - involving engineers alongside product and design
      - feeding findings into the backlog
      - examples where discovery changed or killed a feature
    rubric:
      excellent: Describes a concrete way discovery was planned and protected, with engineers involved, and an example where it changed what the team built.
      good: Describes a reasonable approach with a real example, but discovery was protected only informally.
      weak: Discovery only happens when there is spare time, or is done entirely separately from the team.
    followups:
      - Tell me about something discovery stopped you from building.
      - How did you size discovery work in planning?
    common_errors:
      - Running discovery with no clear question, so it never finishes.

  - external_key: managerial.process_agile.spike_timeboxing
    competency_key: agile_delivery
    topic: Scoping and timeboxing a spike
    difficulty: easy
    text: >-
      Tell me about a technical spike your team ran. How did you scope and timebox it, and what did the team do
      with the result?
    expected_concepts:
      - a specific question the spike had to answer
      - a fixed timebox agreed up front
      - a short written outcome or recommendation
      - follow-up stories created from the findings
    rubric:
      excellent: Describes a spike with a clear question and timebox, a concrete finding shared with the team, and how it shaped later stories or decisions.
      good: Describes a real spike with a timebox and a useful result, but the question or follow-up was loose.
      weak: Describes open-ended exploration with no question, timebox or outcome.
    followups:
      - What happened when the timebox ran out before you had an answer?
      - How did you share the result?
    common_errors:
      - Letting spikes turn into unplanned production work.

  - external_key: managerial.process_agile.more_output_no_hires
    competency_key: stakeholder_management
    topic: Responding to a demand for more output
    difficulty: hard
    text: >-
      Leadership tells you your team needs to deliver thirty percent more next quarter without any new hires.
      How would you approach that conversation, and what would you look at in your team's process?
    expected_concepts:
      - clarifying what more means, such as outcomes rather than tickets
      - examining where time goes, including waiting, rework and interruptions
      - identifying process waste that could be removed
      - being explicit about what is and is not achievable
      - proposing trade-offs such as dropping lower-value work
    rubric:
      excellent: Clarifies the real goal, proposes a data-based look at where time and flow are lost, identifies credible improvements and gives leadership an evidence-based view of what is achievable and what would have to give.
      good: Responds constructively with some process ideas and a realistic message, but analysis is general.
      weak: Accepts the target and pushes the team to work longer, or rejects it outright without analysis.
    followups:
      - What data would you gather first?
      - What would you tell leadership if your analysis showed only ten percent was realistic?
    common_errors:
      - Promising more by cutting testing or review.
