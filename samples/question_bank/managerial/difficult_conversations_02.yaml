# Curated questions: managerial round, difficult conversations (part 2 of 4). Conflicts between team members, conduct and communication behaviours, dominance, blame and formal escalation. Evaluation is based only on the content of the answer (observable work behaviour, never personal traits).
version: 1
defaults:
  role_tags:
  - engineering_manager
  - project_manager
  - tech_lead
  round_types:
  - managerial
  kind: leadership
questions:

- external_key: managerial.difficult_conversations.mediation_first_step
  competency_key: leadership
  topic: First step when two teammates are in conflict
  difficulty: easy
  text: >-
    Two people on your team have a clear disagreement that is affecting the work. What is the first thing
    you do?
  expected_concepts:
  - talking to each person separately first
  - listening for facts and needs
  - clarifying the impact on the work
  - deciding whether to bring them together
  - setting a follow-up
  rubric:
    excellent: >-
      Meets each person privately, listens for facts and needs, clarifies work impact, decides whether
      and how to bring them together and sets a follow-up.
    good: Talks to both and tries to resolve it.
    weak: Waits for it to resolve or tells them to work it out.
  followups:
  - What do you ask each person?
  - When would you bring them together?
  common_errors:
  - Putting both in a room before understanding each side.

- external_key: managerial.difficult_conversations.feedback_meeting_behaviour
  competency_key: communication
  topic: Giving feedback about behaviour in meetings
  difficulty: easy
  text: >-
    A team member repeatedly talks over others in meetings. How do you raise it with them?
  expected_concepts:
  - private conversation
  - specific observed examples
  - effect on others and the work
  - asking their view
  - agreeing what to try
  rubric:
    excellent: >-
      Raises it privately with specific examples, describes the effect, asks their view and agrees a concrete
      change, then follows up.
    good: Gives feedback with examples.
    weak: Hints in a team meeting or ignores it.
  followups:
  - What example would you use?
  - How do you follow up?
  common_errors:
  - Hints in a team meeting or ignores it.

- external_key: managerial.difficult_conversations.peer_takes_credit
  competency_key: collaboration
  topic: A peer who takes credit for shared work
  difficulty: easy
  text: A colleague regularly presents shared work as their own. How do you handle it?
  expected_concepts:
  - confirming the facts
  - talking to the colleague directly
  - describing impact
  - making contributions visible
  - escalating if it continues
  rubric:
    excellent: >-
      Confirms the facts, speaks to the colleague directly with examples, makes contributions visible
      by other means and escalates only if it continues.
    good: Talks to the colleague and records contributions.
    weak: Complains to others or says nothing.
  followups:
  - What do you say to them?
  - How do you help the person whose work was missed?
  common_errors:
  - Complains to others or says nothing.

- external_key: managerial.difficult_conversations.tone_in_code_review
  competency_key: mentoring
  topic: Harsh tone in code review
  difficulty: easy
  text: >-
    A strong engineer's code review comments come across as harsh and discourage others. How do you address
    it?
  expected_concepts:
  - examples from reviews
  - the effect on others
  - what good comments look like
  - agreeing norms
  - following up
  rubric:
    excellent: >-
      Uses concrete examples, explains the effect on others, shows what good comments look like, agrees
      norms and follows up.
    good: Gives feedback with examples.
    weak: Ignores because the technical content is correct.
  followups:
  - What does a good review comment look like?
  - How do you set team norms?
  common_errors:
  - Ignores because the technical content is correct.

- external_key: managerial.difficult_conversations.overlapping_roles
  competency_key: project_management
  topic: Two people unclear who owns what
  difficulty: easy
  text: >-
    Two team members are stepping on each other's work because their roles overlap. How do you resolve
    it?
  expected_concepts:
  - clarifying responsibilities in writing
  - explaining the reasoning
  - agreeing handoff points
  - checking after a few weeks
  - involving both in the design
  rubric:
    excellent: >-
      Clarifies responsibilities in writing with both, agrees handoff points, checks after a few weeks
      and adjusts.
    good: Divides responsibilities and communicates.
    weak: Lets them work it out.
  followups:
  - How did you decide the split?
  - How did you check it worked?
  common_errors:
  - Lets them work it out.

- external_key: managerial.difficult_conversations.public_disagreement_meeting
  competency_key: communication
  topic: A team member challenging you in front of others
  difficulty: easy
  text: >-
    In a team meeting, an engineer sharply disagrees with your decision in front of everyone. How do you
    respond in the moment and afterwards?
  expected_concepts:
  - staying open and listening in the moment
  - acknowledging the point
  - deferring detail where needed
  - following up privately
  - adjusting if right
  rubric:
    excellent: >-
      Listens and acknowledges the point in the moment, defers detail if needed, follows up privately
      and changes the decision if the point is right.
    good: Responds respectfully and follows up.
    weak: Shuts it down or retaliates.
  followups:
  - How did you follow up?
  - What if they were right?
  common_errors:
  - Shuts it down or retaliates.

- external_key: managerial.difficult_conversations.two_engineers_not_speaking
  competency_key: leadership
  topic: Two team members avoiding each other
  difficulty: medium
  text: >-
    Two engineers on your team have stopped talking to each other and information is not flowing. What
    do you do?
  expected_concepts:
  - finding out what happened
  - talking separately
  - clarifying what the work requires
  - agreeing working rules
  - checking progress
  rubric:
    excellent: >-
      Finds out what happened, meets each separately, clarifies what the work needs, agrees working rules
      and checks progress.
    good: Talks to them and mediates.
    weak: Works around them.
  followups:
  - What working rules did you agree?
  - What if one refuses?
  common_errors:
  - Works around them.

- external_key: managerial.difficult_conversations.recurring_interruptions
  competency_key: communication
  topic: Someone who dominates conversations
  difficulty: medium
  text: >-
    One team member dominates design discussions, and others have gone quiet. How do you rebalance without
    silencing a valuable contributor?
  expected_concepts:
  - observing and gathering examples
  - private feedback
  - changing the format to include written input
  - inviting others directly
  - checking results
  rubric:
    excellent: >-
      Collects examples, gives private feedback, changes format with written input, invites others directly
      and checks results.
    good: Gives feedback and invites others.
    weak: Lets it continue.
  followups:
  - How did the dominant person react?
  - What format change helped?
  common_errors:
  - Lets it continue.

- external_key: managerial.difficult_conversations.blame_shifting
  competency_key: ownership
  topic: A culture of blaming others
  difficulty: medium
  text: >-
    Team members increasingly blame each other when things go wrong. How do you change this?
  expected_concepts:
  - modelling accountability
  - focusing reviews on process
  - naming the pattern
  - clear ownership
  - recognising accountability
  rubric:
    excellent: >-
      Models accountability, focuses reviews on process, names the pattern, clarifies ownership and recognises
      accountable behaviour.
    good: Encourages blame-free reviews.
    weak: Finds who is at fault each time.
  followups:
  - What did you change in reviews?
  - How did you handle a repeated case?
  common_errors:
  - Finds who is at fault each time.

- external_key: managerial.difficult_conversations.withheld_information
  competency_key: collaboration
  topic: A peer holding back information
  difficulty: medium
  text: >-
    A colleague is not sharing information others need to do their work. How do you handle it?
  expected_concepts:
  - confirming it is happening
  - asking about their reasons
  - explaining the impact
  - setting expectations on sharing
  - making information accessible
  rubric:
    excellent: >-
      Confirms it is happening, asks their reasons, explains the impact, sets expectations and makes information
      more accessible.
    good: Speaks to the colleague about sharing.
    weak: Assumes bad intent and escalates.
  followups:
  - What reasons might they have?
  - How did you make it accessible?
  common_errors:
  - Assumes bad intent and escalates.

- external_key: managerial.difficult_conversations.public_criticism_of_colleague
  competency_key: communication
  topic: Public criticism of a teammate
  difficulty: medium
  text: >-
    One engineer criticises a colleague's work in a team channel in a way that embarrasses them. What
    do you do?
  expected_concepts:
  - acting quickly
  - speaking to the critic privately
  - supporting the colleague
  - resetting norms
  - checking later
  rubric:
    excellent: >-
      Acts quickly, speaks to the critic privately, supports the colleague, resets norms and checks later.
    good: Speaks to the critic and the colleague.
    weak: Ignores it.
  followups:
  - What do you say to the colleague?
  - What norms did you reset?
  common_errors:
  - Ignores it.

- external_key: managerial.difficult_conversations.design_decision_dominance
  competency_key: leadership
  topic: One senior person making every design decision
  difficulty: medium
  text: >-
    A senior engineer makes most design decisions and others stop contributing. How do you change this
    dynamic?
  expected_concepts:
  - acknowledging their expertise
  - discussing the effect
  - sharing decision rights
  - rotating design leads
  - coaching on enabling others
  rubric:
    excellent: >-
      Acknowledges expertise, discusses the effect, shares decision rights, rotates design leads and coaches
      on enabling others.
    good: Talks to the senior engineer and spreads decisions.
    weak: Leaves the dynamic.
  followups:
  - How did they respond?
  - How did others step up?
  common_errors:
  - Leaves the dynamic.

- external_key: managerial.difficult_conversations.workload_fairness
  competency_key: project_management
  topic: Dispute about uneven workload
  difficulty: medium
  text: >-
    Team members say the workload is divided unfairly. How do you work out what is going on and respond?
  expected_concepts:
  - gathering data on the work
  - listening to concerns
  - looking at skills and assignments
  - changing the allocation process
  - communicating
  rubric:
    excellent: >-
      Gathers data on the work, listens to concerns, examines how assignments are made, changes the allocation
      process and communicates.
    good: Reviews workloads and rebalances.
    weak: Dismisses the complaint.
  followups:
  - What did the data show?
  - How do you assign work now?
  common_errors:
  - Dismisses the complaint.

- external_key: managerial.difficult_conversations.pm_engineer_dispute
  competency_key: stakeholder_management
  topic: Dispute between a product manager and an engineer
  difficulty: medium
  text: >-
    A product manager and one of your engineers have a recurring dispute about scope and estimates. How
    do you help?
  expected_concepts:
  - listening to both
  - identifying whether it is about process or relationship
  - clarifying who decides what
  - shared planning routines
  - checking
  rubric:
    excellent: >-
      Listens to both, identifies process or relationship issues, clarifies decision rights, sets shared
      planning routines and checks.
    good: Talks to both and facilitates.
    weak: Sides with the engineer.
  followups:
  - What was the cause?
  - What routine did you introduce?
  common_errors:
  - Sides with the engineer.

- external_key: managerial.difficult_conversations.communication_norms_conflict
  competency_key: communication
  topic: Friction from different working patterns
  difficulty: medium
  text: >-
    Team members in different working patterns, such as remote and office, argue about response times
    and availability. How do you resolve it?
  expected_concepts:
  - gathering concerns
  - agreeing availability expectations
  - core overlap hours
  - communication norms
  - revisiting
  rubric:
    excellent: >-
      Gathers concerns, agrees availability expectations and core overlap, sets communication norms and
      revisits.
    good: Sets some expectations.
    weak: Ignores the friction.
  followups:
  - What did the norm say?
  - How did you review it?
  common_errors:
  - Ignores the friction.

- external_key: managerial.difficult_conversations.role_conflict_after_reorg
  competency_key: adaptability
  topic: Conflict over roles after a restructure
  difficulty: medium
  text: >-
    After a team restructure, two people believe they should own the same area. How do you resolve it?
  expected_concepts:
  - reviewing the new structure
  - clarifying decision rights
  - talking to both
  - documenting
  - follow-up
  rubric:
    excellent: >-
      Reviews the structure, clarifies decision rights, talks to both, documents and follows up.
    good: Clarifies responsibilities.
    weak: Leaves them to work it out.
  followups:
  - What did you document?
  - How did you follow up?
  common_errors:
  - Leaves them to work it out.

- external_key: managerial.difficult_conversations.when_to_involve_hr
  competency_key: ownership
  topic: Deciding to involve HR in a conflict
  difficulty: medium
  text: >-
    How do you decide when a conflict between team members should involve HR or a senior leader rather
    than just you?
  expected_concepts:
  - severity and type of conduct
  - patterns
  - legal or policy concerns
  - need for formal process
  - confidentiality
  rubric:
    excellent: >-
      Assesses severity and type of conduct, patterns, policy concerns, need for formal process and confidentiality,
      and gives an example.
    good: Involves HR for serious matters.
    weak: Never involves HR or always does.
  followups:
  - What would make you involve HR immediately?
  - How do you keep confidentiality?
  common_errors:
  - Never involves HR or always does.

- external_key: managerial.difficult_conversations.team_in_camps
  competency_key: leadership
  topic: A team that has split into camps
  difficulty: medium
  text: >-
    Your team has split into two camps over a technical or process disagreement. What do you do?
  expected_concepts:
  - understanding the issue
  - finding shared goals
  - bringing the camps together
  - a decision process
  - reinforcing the team identity
  rubric:
    excellent: >-
      Understands the issue, finds shared goals, brings camps together, uses a decision process and reinforces
      the shared team goal.
    good: Facilitates and decides.
    weak: Takes a side.
  followups:
  - What was the shared goal?
  - How did the camps react?
  common_errors:
  - Takes a side.

- external_key: managerial.difficult_conversations.overly_critical_peer
  competency_key: communication
  topic: Someone whose criticism undermines others
  difficulty: medium
  text: >-
    A team member constantly points out others' flaws, and people are becoming defensive. How do you coach
    them?
  expected_concepts:
  - acknowledging the intention
  - examples
  - focusing on improvement suggestions
  - modelling
  - checking
  rubric:
    excellent: >-
      Acknowledges the intent, gives examples, coaches towards constructive suggestions, models and checks.
    good: Gives feedback with examples.
    weak: Tells them to stop.
  followups:
  - What did you suggest instead?
  - How did the team respond?
  common_errors:
  - Tells them to stop.

- external_key: managerial.difficult_conversations.conduct_report_process
  competency_key: ownership
  topic: Receiving a report of inappropriate conduct
  difficulty: hard
  text: >-
    A team member tells you privately that a colleague's behaviour toward them has crossed a line. What
    do you do?
  expected_concepts:
  - listening and taking it seriously
  - explaining what you must do
  - following the organisation's process
  - preserving confidentiality as far as possible
  - protecting from retaliation
  rubric:
    excellent: >-
      Listens, explains what they must do, follows policy by involving the right function, keeps confidentiality
      as far as possible and watches for retaliation.
    good: Listens and reports to HR.
    weak: Handles it informally or dismisses it.
  followups:
  - What can't you promise?
  - How do you check on the person later?
  common_errors:
  - Handles it informally or dismisses it.

- external_key: managerial.difficult_conversations.senior_leaders_conflict_team
  competency_key: leadership
  topic: Conflict between two senior people on your team
  difficulty: hard
  text: >-
    Two of your most senior engineers are in persistent conflict, and the team is taking sides. How do
    you resolve it?
  expected_concepts:
  - private conversations
  - clarifying behaviours and impact
  - agreeing expectations
  - joint session
  - consequences if it continues
  rubric:
    excellent: >-
      Meets each privately, clarifies behaviours and impact, agrees expectations, holds a joint session
      and states consequences if it continues.
    good: Talks to both and sets expectations.
    weak: Hopes it passes.
  followups:
  - What expectation did you set?
  - What were the consequences?
  common_errors:
  - Hopes it passes.

- external_key: managerial.difficult_conversations.retaliation_concern
  competency_key: ownership
  topic: Concern about retaliation after a complaint
  difficulty: hard
  text: >-
    Someone raised a concern about a colleague and now says others are treating them differently. How
    do you respond?
  expected_concepts:
  - taking it seriously
  - checking facts
  - talking to those involved
  - reinforcing the policy
  - documenting
  - follow-up
  rubric:
    excellent: >-
      Takes it seriously, checks facts, talks to those involved, reinforces policy, documents and follows
      up with the person.
    good: Talks to the people involved.
    weak: Treats it as a normal tension.
  followups:
  - What did you document?
  - How do you protect the person?
  common_errors:
  - Treats it as a normal tension.

- external_key: managerial.difficult_conversations.client_facing_conduct
  competency_key: stakeholder_management
  topic: Poor conduct by an engineer toward customers
  difficulty: hard
  text: >-
    A customer complains that one of your engineers was dismissive and unprofessional in a call. How do
    you handle both the customer and the engineer?
  expected_concepts:
  - listening to the customer and responding quickly
  - gathering the engineer's account
  - feedback with examples
  - expectations
  - repairing the relationship
  rubric:
    excellent: >-
      Responds to the customer quickly, gathers the engineer's account, gives feedback with examples,
      sets expectations and repairs the relationship.
    good: Apologises to the customer and speaks to the engineer.
    weak: Defends the engineer or punishes without facts.
  followups:
  - What did the engineer say?
  - How did you repair things?
  common_errors:
  - Defends the engineer or punishes without facts.

- external_key: managerial.difficult_conversations.long_running_feud
  competency_key: leadership
  topic: A long-running feud affecting delivery
  difficulty: hard
  text: >-
    Two people have had a long-running feud, and deliveries are suffering. What do you do?
  expected_concepts:
  - assessing the impact
  - clear expectations
  - structural changes like separate responsibilities
  - formal steps
  - support
  rubric:
    excellent: >-
      Assesses impact, sets clear expectations, uses structural changes, takes formal steps if needed
      and offers support.
    good: Talks to both and separates work.
    weak: Waits for the feud to fade without acting.
  followups:
  - What structural change helped?
  - When do you take formal steps?
  common_errors:
  - Waits for the feud to fade without acting.

- external_key: managerial.difficult_conversations.own_part_in_conflict
  competency_key: ownership
  topic: Conflict where you contributed
  difficulty: hard
  text: >-
    Tell me about a team conflict that you later realised you had contributed to. What did you do?
  expected_concepts:
  - recognising your part
  - acknowledging it
  - changing your behaviour
  - repairing
  - learning
  rubric:
    excellent: >-
      Recognises their part, acknowledges it to those involved, changes behaviour, repairs and shares
      a lesson.
    good: Recognises and apologises.
    weak: Blames others.
  followups:
  - What did you change?
  - How did you know you'd repaired it?
  common_errors:
  - Blames others.
