# Curated questions: managerial round, stakeholder management (part 3 of 4). Status communication,
# prioritisation criteria, customer requests, quality expectations, difficult decisions and coaching
# others through stakeholder work. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  - external_key: managerial.stakeholders.written_status_update
    competency_key: communication
    topic: What goes into a written status update
    difficulty: easy
    text: >-
      Walk me through what you put in a written status update for stakeholders, and what you deliberately leave out.
    expected_concepts:
      - a headline status at the top
      - progress against milestones rather than activity
      - risks and issues with owners
      - decisions or help needed from readers
      - brevity with links to detail
    rubric:
      excellent: Describes a clear structure led by the headline, progress against milestones, risks with owners and explicit asks, and explains what they leave out and why.
      good: Covers status, progress and risks in a sensible structure.
      weak: Lists activities and tasks completed, with no headline, risks or asks.
    followups:
      - How do you know whether people actually read it?
    common_errors:
      - Reporting busyness instead of progress toward outcomes.

  - external_key: managerial.stakeholders.engineer_first_stakeholder_meeting
    competency_key: mentoring
    topic: Preparing an engineer for stakeholder meetings
    difficulty: easy
    text: >-
      When you bring a less experienced engineer into stakeholder meetings for the first time, how do you prepare them,
      and what do you talk about with them afterwards?
    expected_concepts:
      - context on the stakeholders and their goals
      - a clear role for the engineer in the meeting
      - guidance on what they can and cannot commit to
      - a debrief on what happened and why
    rubric:
      excellent: Describes specific preparation including context and the engineer's role, sets boundaries on commitments, and runs a debrief that builds their understanding, with an example of growth.
      good: Prepares and debriefs in a reasonable way.
      weak: Brings them along with no preparation, or never gives them a real role.
    followups:
      - What did one engineer take away from their first meeting?
    common_errors:
      - Bringing engineers only to observe, so they never practise speaking for the team.

  - external_key: managerial.stakeholders.visible_milestones
    competency_key: project_management
    topic: Milestones stakeholders can see progress on
    difficulty: easy
    text: >-
      How do you break a long project into milestones that stakeholders can actually see and use, rather than ones that only
      mean something to the engineering team?
    expected_concepts:
      - milestones defined by demonstrable outcomes
      - early milestones that reduce the biggest risks
      - something stakeholders can try or review at each step
      - dates or ranges tied to each milestone
    rubric:
      excellent: Defines milestones as demonstrable outcomes stakeholders can review, sequences them to reduce risk early, and gives an example where this improved stakeholder confidence in the plan.
      good: Uses outcome-based milestones with reasonable sequencing.
      weak: Milestones are internal technical phases such as design complete or backend done.
    followups:
      - Which milestone would you put first on a risky project, and why?
    common_errors:
      - Treating percentage complete as a milestone.

  - external_key: managerial.stakeholders.slow_decision_maker
    competency_key: stakeholder_management
    topic: A decision maker who is slow to respond
    difficulty: easy
    text: >-
      Tell me about a time your team was blocked waiting on a decision from a busy stakeholder who wasn't responding. How
      did you get the decision made?
    expected_concepts:
      - making the decision easy with options and a recommendation
      - stating the cost of waiting and a deadline
      - choosing the right channel or a short meeting
      - a default that applies if no decision is made
    rubric:
      excellent: Made the decision easy to take with options and a recommendation, made the cost of delay and the deadline explicit, and used a default or escalation path when needed.
      good: Followed up persistently and got the decision with some structure.
      weak: Waited passively, or made the decision themselves without telling anyone.
    followups:
      - What would you have done if the deadline passed with no answer?
    common_errors:
      - Sending long messages that make the decision harder to take.

  - external_key: managerial.stakeholders.request_response_agreement
    competency_key: project_management
    topic: Agreeing response expectations for requests
    difficulty: easy
    text: >-
      How have you set clear expectations with other teams about how quickly your team will respond to their requests, and
      what happens when something is genuinely urgent?
    expected_concepts:
      - categories of request with different response times
      - a definition of what counts as urgent
      - a single entry point for requests
      - reviewing whether the agreement is being met
    rubric:
      excellent: Describes an agreed set of request categories and response expectations, a clear definition of urgent, and how they reviewed and adjusted it based on how it worked.
      good: Has some agreed expectations for requests.
      weak: Responds on a best-effort basis with no shared expectations.
    followups:
      - How did you handle requests labelled urgent that weren't?
    common_errors:
      - Publishing response times without the capacity to meet them.

  - external_key: managerial.stakeholders.first_conversation_new_request
    competency_key: stakeholder_management
    topic: The first conversation about a new request
    difficulty: easy
    text: >-
      When someone brings your team a new request, what do you want to understand in that first conversation before you
      agree to anything?
    expected_concepts:
      - the problem and who has it
      - why now and the cost of not doing it
      - what success looks like
      - constraints such as deadlines and dependencies
      - who decides and who else is affected
    rubric:
      excellent: Describes probing for the underlying problem, urgency, success criteria, constraints and decision owner, and explains how the answers shape what they commit to.
      good: Asks about the problem and timeline before committing.
      weak: Moves straight to estimating or agreeing to the request as stated.
    followups:
      - Tell me about a request that turned out to be something different once you asked those questions.
    common_errors:
      - Giving an estimate in the first conversation before understanding the problem.

  - external_key: managerial.stakeholders.preparing_to_decline
    competency_key: stakeholder_management
    topic: Preparing for a conversation where you'll decline
    difficulty: easy
    text: >-
      When you know you're going into a meeting where you'll need to turn down a stakeholder's request, how do you prepare
      for it?
    expected_concepts:
      - understanding their goals and pressures
      - a clear reason based on priorities and trade-offs
      - an alternative or partial option to offer
      - aligning with your own manager beforehand if needed
    rubric:
      excellent: Prepares by understanding the stakeholder's goals, a clear trade-off-based reason, an alternative to offer and any necessary alignment with their manager, with an example of how it went.
      good: Prepares reasons and some alternative.
      weak: Goes in unprepared or avoids the meeting and sends a message instead.
    followups:
      - How did a recent conversation like that go?
    common_errors:
      - Hedging so much that the stakeholder leaves thinking the answer was yes.

  - external_key: managerial.stakeholders.prioritisation_criteria_buy_in
    competency_key: project_management
    topic: Getting stakeholders to accept prioritisation criteria
    difficulty: medium
    text: >-
      Tell me about a time you introduced clear criteria for ranking competing requests. How did you get stakeholders to
      accept the criteria before they saw how their own requests ranked?
    expected_concepts:
      - simple criteria tied to business goals
      - agreeing the criteria with stakeholders or leadership first
      - applying them openly and consistently
      - handling exceptions transparently
      - refining the criteria over time
    rubric:
      excellent: Agreed simple, goal-linked criteria with stakeholders before applying them, applied them openly, handled exceptions visibly and adjusted the criteria based on experience.
      good: Introduced reasonable criteria and applied them with some transparency.
      weak: Ranked requests privately and presented the result, or used criteria nobody else understood.
    followups:
      - What happened when the criteria produced a result a senior stakeholder disliked?
    common_errors:
      - A scoring model so complex that people game the inputs.

  - external_key: managerial.stakeholders.reliability_after_incident
    competency_key: stakeholder_management
    topic: Reliability work after an incident versus feature commitments
    difficulty: medium
    text: >-
      After a serious incident, your team needs time for reliability fixes, but stakeholders are still expecting the features
      you promised. Tell me how you handled that tension in a real situation.
    expected_concepts:
      - a clear list of fixes ranked by risk reduction
      - explaining the business risk of not doing them
      - an explicit trade-off with dates on the features
      - stakeholder agreement on the plan
      - reporting completion of the fixes
    rubric:
      excellent: Prioritised fixes by risk reduction, explained the business risk in stakeholder terms, agreed an explicit trade-off on feature dates and reported back when the fixes were done.
      good: Secured time for the important fixes with reasonable communication.
      weak: Skipped the fixes to keep feature dates, or stopped features without agreeing it with stakeholders.
    followups:
      - Which fixes did you defer, and why?
      - Did a similar incident happen again?
    common_errors:
      - Asking for a vague reliability period instead of specific fixes with outcomes.

  - external_key: managerial.stakeholders.launch_coordination
    competency_key: project_management
    topic: Coordinating a launch across functions
    difficulty: medium
    text: >-
      Tell me about a launch that needed several non-engineering groups, such as support, marketing or operations, to be
      ready at the same time. How did you coordinate them?
    expected_concepts:
      - identifying each group's readiness needs early
      - a shared launch plan with owners and dates
      - readiness checkpoints before launch
      - a clear go or no-go decision process
      - communication on launch day and after
    rubric:
      excellent: Involved each group early, ran a shared plan with owners, used readiness checkpoints and a clear decision process, and describes what happened on launch day.
      good: Coordinated the groups with a reasonable plan.
      weak: Treated the launch as an engineering event and informed other groups at the last minute.
    followups:
      - Which group was least ready, and how did you find out?
    common_errors:
      - Forgetting to prepare support for the questions customers will ask.

  - external_key: managerial.stakeholders.one_off_customisation
    competency_key: stakeholder_management
    topic: A one-off customisation for a large customer
    difficulty: medium
    text: >-
      Tell me about a time a customer-facing team asked for a one-off customisation for an important customer. How did you
      decide what to do, and how did you handle the conversation?
    expected_concepts:
      - understanding the customer's actual need
      - the long-term cost of maintaining one-off variants
      - generalising the request so other customers benefit
      - agreeing terms such as scope and ownership
      - decision with the right business owner
    rubric:
      excellent: Weighed the customer's value against the ongoing cost, looked for a general solution, involved the business owner in the decision and agreed clear terms on scope and support.
      good: Made a reasoned decision with the customer team.
      weak: Built the customisation without considering long-term cost, or refused without understanding the business stakes.
    followups:
      - Who carried the cost of maintaining it afterwards?
    common_errors:
      - Ignoring the support and maintenance cost of one-off work.

  - external_key: managerial.stakeholders.wrong_number_cited
    competency_key: communication
    topic: A stakeholder relying on a wrong number
    difficulty: medium
    text: >-
      Tell me about a time a stakeholder was using a number you knew was wrong to argue for a priority. How did you correct
      it without embarrassing them?
    expected_concepts:
      - verifying the correct figure first
      - raising it privately before any group setting
      - explaining the source of the difference
      - reframing the discussion on the correct data
    rubric:
      excellent: Checked the facts, raised the correction privately and respectfully, explained the discrepancy and helped reframe the decision on accurate data.
      good: Corrected the number with reasonable tact.
      weak: Let the wrong number stand, or corrected it publicly in a way that damaged the relationship.
    followups:
      - Did the corrected number change the decision?
    common_errors:
      - Assuming bad intent instead of a data definition problem.

  - external_key: managerial.stakeholders.nonfunctional_expectations
    competency_key: stakeholder_management
    topic: Aligning on quality expectations stakeholders don't see
    difficulty: medium
    text: >-
      Stakeholders usually see features, not performance, security or reliability. Tell me how you've got stakeholders to
      agree expectations on those kinds of quality attributes before they became a problem.
    expected_concepts:
      - translating quality attributes into user or business impact
      - explicit, measurable targets
      - including them in plans and estimates
      - reviewing them alongside features
    rubric:
      excellent: Translated quality attributes into business impact, agreed measurable targets with stakeholders, built them into planning and reported on them alongside features.
      good: Made some quality expectations explicit with stakeholders.
      weak: Handles quality only inside engineering, or raises it only after a failure.
    followups:
      - Which target was hardest to agree, and why?
    common_errors:
      - Setting targets that sound good but have no measurement behind them.

  - external_key: managerial.stakeholders.beta_expectations
    competency_key: stakeholder_management
    topic: Setting expectations for a pilot or beta
    difficulty: medium
    text: >-
      Tell me about a pilot or beta you ran where users or stakeholders started treating it as finished. How did you set or
      reset expectations about what it was?
    expected_concepts:
      - explicit statement of what the pilot is and is not
      - entry and exit criteria
      - limits on support and stability
      - a clear path from pilot to general release
    rubric:
      excellent: Describes how they set out the pilot's purpose and limits, defined exit criteria and recovered expectations when users relied on it too heavily, with lessons applied later.
      good: Set reasonable expectations and handled the situation.
      weak: Let the pilot become production without agreement.
    followups:
      - What would you write down before the next pilot starts?
    common_errors:
      - No exit criteria, so the pilot never ends.

  - external_key: managerial.stakeholders.everything_marked_urgent
    competency_key: stakeholder_management
    topic: A stakeholder who marks everything urgent
    difficulty: medium
    text: >-
      Tell me about a stakeholder who labelled nearly every request as urgent. How did you find out what actually mattered
      most to them?
    expected_concepts:
      - asking them to rank their own requests
      - asking about the consequences of delay for each
      - showing the trade-offs of capacity
      - agreeing a shared meaning for urgent
    rubric:
      excellent: Got the stakeholder to rank their own requests against each other and the cost of delay, reached a shared definition of urgent and shows how this improved the relationship.
      good: Found a way to separate real urgency from noise.
      weak: Treated everything as urgent, or ignored the label entirely.
    followups:
      - What was driving them to label everything urgent?
    common_errors:
      - Accepting the labels at face value and starving other stakeholders.

  - external_key: managerial.stakeholders.misunderstood_commitment
    competency_key: communication
    topic: When stakeholders misunderstood what you committed to
    difficulty: medium
    text: >-
      Tell me about a time stakeholders believed your team had committed to something you thought you hadn't. What caused
      the gap, and how did you sort it out?
    expected_concepts:
      - tracing where the misunderstanding started
      - owning their part of the miscommunication
      - agreeing a corrected understanding
      - written confirmation of commitments in future
    rubric:
      excellent: Traced the source of the misunderstanding, owned their part, agreed a corrected commitment and changed how commitments are confirmed afterwards.
      good: Resolved the misunderstanding with a sensible fix.
      weak: Insisted the stakeholder was wrong without examining their own communication.
    followups:
      - What did you change about how you confirm commitments?
    common_errors:
      - Treating a tentative estimate in a meeting as harmless when it was heard as a promise.

  - external_key: managerial.stakeholders.engineering_voice_in_planning
    competency_key: leadership
    topic: Making engineering concerns count in planning
    difficulty: medium
    text: >-
      As the technical voice in planning discussions, how do you make sure engineering concerns get properly weighed without
      every discussion turning into a debate? Tell me about a time it made a difference.
    expected_concepts:
      - picking the concerns that really matter
      - framing concerns in business impact
      - bringing options rather than only objections
      - building credibility through accurate past calls
    rubric:
      excellent: Picks concerns selectively, frames them in business terms with options, and gives an example where an engineering concern changed a plan for the better.
      good: Raises concerns constructively with some example.
      weak: Either stays silent or objects to everything with technical arguments only.
    followups:
      - Tell me about a concern you chose not to raise.
    common_errors:
      - Raising concerns without proposing what to do.

  - external_key: managerial.stakeholders.challenged_in_large_meeting
    competency_key: communication
    topic: Being challenged on your plan in a large meeting
    difficulty: medium
    text: >-
      Tell me about a time a stakeholder challenged your plan in front of a large group. How did you respond in the room,
      and what did you do afterwards?
    expected_concepts:
      - acknowledging the point and answering factually
      - not getting drawn into a long debate in the room
      - taking it offline with a commitment to follow up
      - following up with the stakeholder and the group
    rubric:
      excellent: Responded factually in the room, acknowledged valid points, moved the detailed discussion to a follow-up and closed the loop with the stakeholder and the wider group.
      good: Handled the moment reasonably and followed up.
      weak: Became defensive, dismissed the challenge, or never followed up.
    followups:
      - Was the challenge valid?
    common_errors:
      - Promising to follow up and never doing it.

  - external_key: managerial.stakeholders.executive_sponsor
    competency_key: stakeholder_management
    topic: Working effectively with an executive sponsor
    difficulty: medium
    text: >-
      How do you work with an executive sponsor on a project, and what do you need from them? Tell me about one sponsor
      relationship that helped or hurt a project.
    expected_concepts:
      - agreeing what the sponsor owns, such as priority and resourcing
      - specific asks such as removing blockers or making decisions
      - a regular, brief touchpoint
      - no surprises on risks
    rubric:
      excellent: Clearly defines what they need from a sponsor, uses them for specific blockers and decisions, keeps them informed without surprises and reflects on what made the relationship work or fail.
      good: Has a working approach to sponsors with an example.
      weak: Treats the sponsor as someone to report to rather than someone who can help.
    followups:
      - What's the most useful thing a sponsor ever did for one of your projects?
    common_errors:
      - Only involving the sponsor when things are already going wrong.

  - external_key: managerial.stakeholders.inherited_overcommitted_roadmap
    competency_key: leadership
    topic: Inheriting an overcommitted roadmap
    difficulty: hard
    text: >-
      Tell me about a time you took over a team or project with commitments made before you arrived that you didn't think
      could be met. How did you reset expectations without simply blaming your predecessor?
    expected_concepts:
      - a quick, evidence-based assessment of the commitments
      - understanding why they were made
      - deciding what to keep, change or drop
      - a reset conversation with stakeholders and leadership
      - early delivery to rebuild credibility
    rubric:
      excellent: Assessed the commitments quickly with evidence, understood their origin, proposed a realistic reset to stakeholders without blame, and delivered early on what was kept.
      good: Reset some commitments with reasonable communication.
      weak: Tried to deliver everything anyway, or reset everything while blaming the previous owner.
    followups:
      - How long did you take before raising it?
      - Which commitment did you keep despite the risk, and why?
      - How did stakeholders react to the reset?
    common_errors:
      - Waiting too long to raise the issue in the hope it would work out.

  - external_key: managerial.stakeholders.unpopular_decision
    competency_key: leadership
    topic: Making and owning an unpopular decision
    difficulty: hard
    text: >-
      Tell me about a decision you made that a significant group of stakeholders disagreed with. How did you reach it, how
      did you communicate it, and how did you handle what came after?
    expected_concepts:
      - gathering input from those affected
      - clear reasoning and trade-offs
      - direct communication to those who disagree
      - commitment to review the decision against evidence
      - managing the aftermath and relationships
    rubric:
      excellent: Gathered input before deciding, communicated the reasoning directly to those who disagreed, set a point to review the decision against evidence and maintained the relationships afterwards.
      good: Made and communicated a reasoned decision with some follow-up.
      weak: Made the decision without input, or reversed at the first sign of pushback.
    followups:
      - Looking back, was it the right decision?
      - What would have made you reverse it?
    common_errors:
      - Announcing the decision broadly before talking to the people most affected.

  - external_key: managerial.stakeholders.capacity_cut_midproject
    competency_key: project_management
    topic: Losing capacity midway through a project
    difficulty: hard
    text: >-
      Tell me about a time your team lost a significant part of its capacity in the middle of a committed project, for
      example people moved to another priority. How did you re-plan and reset expectations?
    expected_concepts:
      - quantifying the impact on scope and dates
      - re-planning with priority tiers
      - presenting options to stakeholders
      - protecting the most critical commitments
      - communicating the new plan
    rubric:
      excellent: Quantified the impact quickly, re-planned around priorities, gave stakeholders concrete options and protected the most important commitments, with a clear account of the outcome.
      good: Re-planned and communicated with reasonable options.
      weak: Kept the original commitments and hoped the remaining team would cover the gap.
    followups:
      - What did you drop, and who agreed to that?
      - How did the remaining team cope with the change in plan?
    common_errors:
      - Not telling stakeholders until the original date was already missed.

  - external_key: managerial.stakeholders.failed_project_review
    competency_key: communication
    topic: Presenting a failed project's review to leadership
    difficulty: hard
    text: >-
      Tell me about a time you presented the review of a project that had failed to senior stakeholders who were looking for
      someone to hold responsible. How did you keep the discussion focused on learning?
    expected_concepts:
      - a factual timeline and causes
      - focus on systemic causes rather than individuals
      - owning their own part
      - concrete changes with owners
      - protecting team members from blame
    rubric:
      excellent: Presented a factual account focused on systemic causes, owned their own part, protected individuals from blame and gained agreement on concrete improvements with owners.
      good: Presented a balanced review with some improvements agreed.
      weak: Allowed blame to land on individuals, or presented a vague account that avoided the real causes.
    followups:
      - What did you own personally in that review?
      - Which improvement actually got implemented?
    common_errors:
      - Over-correcting into a review that names no causes at all.

  - external_key: managerial.stakeholders.refusing_to_skip_security
    competency_key: stakeholder_management
    topic: Holding the line on a security or compliance step
    difficulty: hard
    text: >-
      Tell me about a time a stakeholder pushed your team to skip a security review or another required control to hit a
      date. How did you hold the line while still helping them meet their goal?
    expected_concepts:
      - explaining the risk in business terms
      - not negotiating away the required control
      - finding ways to speed up the control, such as early engagement or reduced scope
      - escalating with the risk documented if pressure continued
    rubric:
      excellent: Held the line on the required control, explained the business risk clearly, found practical ways to reduce the delay and escalated with documented risk where needed.
      good: Kept the control in place and communicated the reasons.
      weak: Skipped or weakened the control, or refused without helping the stakeholder find another path.
    followups:
      - Who had the authority to accept the risk, if anyone?
      - How did the stakeholder respond?
    common_errors:
      - Treating it as a personal standoff instead of an explicit risk decision for the right owner.

  - external_key: managerial.stakeholders.coaching_new_manager_conflict
    competency_key: mentoring
    topic: Coaching a new manager through a stakeholder conflict
    difficulty: hard
    text: >-
      Tell me about a time you coached a manager or lead who reports to you through their first serious conflict with a
      stakeholder. How did you help without taking it over?
    expected_concepts:
      - understanding the situation from their account and others
      - helping them plan the conversation
      - letting them lead while being available
      - stepping in only when needed and explaining why
      - debriefing to build their judgement
    rubric:
      excellent: Helped the person diagnose and plan, let them lead the resolution, stepped in only when necessary with clear reasons, and debriefed so they could handle the next one alone.
      good: Supported them with advice and follow-up.
      weak: Took over the conflict, or left them to handle it with no support.
    followups:
      - Did you have to step in at any point?
      - How did they handle the next conflict?
    common_errors:
      - Undermining the new manager by talking to the stakeholder directly without them.
