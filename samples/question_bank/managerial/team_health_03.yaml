# Curated questions: managerial round, team health (part 3 of 4) - motivation, growth, recognition
# and retention. Questions ask for the candidate's own approach and real examples; they stay on work,
# growth and opportunities, never on personal circumstances.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: managerial.team_health.individual_motivators
    competency_key: people_management
    topic: Learning what motivates each person
    difficulty: easy
    text: >-
      People on a team are motivated by different things. How do you find out what motivates each person you
      work with, and how does that change the way you manage them?
    expected_concepts:
      - asking directly in one-to-ones and career conversations
      - observing which work people gravitate toward
      - revisiting as people's goals change
      - matching assignments and recognition to what matters to each person
    rubric:
      excellent: Describes how they learn each person's motivators directly and through observation, and gives concrete examples of adapting assignments or recognition accordingly.
      good: Asks people and adjusts some assignments.
      weak: Assumes everyone is motivated by the same things.
    followups:
      - Tell me about someone whose motivation surprised you.
    common_errors:
      - Guessing instead of asking.

  - external_key: managerial.team_health.marking_milestones
    competency_key: leadership
    topic: Marking the end of a big piece of work
    difficulty: easy
    text: >-
      How do you mark the end of a big piece of work with your team, and why do you think it matters?
    expected_concepts:
      - pausing to recognise the effort and outcome
      - sharing the results and impact with the team and beyond
      - crediting specific contributions
      - a retrospective to capture lessons
      - deliberately resetting pace before the next project
    rubric:
      excellent: Describes a concrete practice that combines recognition of specific contributions, sharing the impact and capturing lessons, and explains why it helps sustain the team.
      good: Celebrates milestones and thanks the team.
      weak: Moves straight on to the next project without acknowledging the work.
    followups:
      - How do you do this for work that never has a clear launch moment?
    common_errors:
      - Recognising only the most visible contributors.

  - external_key: managerial.team_health.learning_from_each_other
    competency_key: mentoring
    topic: Creating ways to learn from each other
    difficulty: easy
    text: >-
      What have you done to create regular opportunities for people on your team to learn from each other?
    expected_concepts:
      - internal talks, demos or reading groups
      - pairing and rotating code ownership
      - design reviews as teaching moments
      - giving less experienced people chances to present
      - keeping it sustainable and voluntary
    rubric:
      excellent: Describes specific practices they set up, how they kept them going and gives an example of skills spreading across the team as a result.
      good: Describes one or two practices that the team used.
      weak: Relies only on formal training outside the team.
    followups:
      - Which of these faded out, and why?
    common_errors:
      - Starting a practice that only the seniors ever present at.

  - external_key: managerial.team_health.connecting_work_to_impact
    competency_key: leadership
    topic: Connecting the team's work to its impact
    difficulty: easy
    text: >-
      How do you help engineers see why the work they're doing matters to users or to the business? Give me an
      example.
    expected_concepts:
      - sharing customer feedback and usage data
      - involving engineers in customer conversations or research
      - explaining the goal behind each project
      - closing the loop after launch with results
    rubric:
      excellent: Gives a concrete example of exposing the team to real users or outcomes, explaining goals up front and sharing results after launch.
      good: Explains goals and shares some results.
      weak: Assumes the team does not need context beyond the ticket.
    followups:
      - How do you do this for internal or infrastructure work with no direct users?
    common_errors:
      - Sharing goals at kickoff but never showing what happened after launch.

  - external_key: managerial.team_health.sharing_toil_fairly
    competency_key: people_management
    topic: Sharing unpopular work fairly
    difficulty: easy
    text: >-
      Every team has maintenance and support work nobody really wants. How do you share it out fairly?
    expected_concepts:
      - rotation or explicit allocation
      - visibility of who is doing it
      - recognising the work in reviews
      - reducing the toil itself over time
      - not always defaulting to the newest or quietest people
    rubric:
      excellent: Uses a transparent rotation, recognises the work, avoids loading it onto the same people and actively reduces the toil itself.
      good: Rotates the work fairly.
      weak: Lets it fall on whoever is newest or least likely to object.
    followups:
      - How do you handle someone who keeps avoiding their share?
    common_errors:
      - Giving unpopular work to new joiners by default.

  - external_key: managerial.team_health.good_week_bad_week
    competency_key: people_management
    topic: Understanding what makes a good week
    difficulty: easy
    text: >-
      What does a good week look like for the people on your team, and how do you find out whether they're
      getting more good weeks than bad ones?
    expected_concepts:
      - asking people what makes a week productive or frustrating
      - common factors such as focus time, progress and clear priorities
      - lightweight check-ins or retro questions
      - acting on recurring causes of bad weeks
    rubric:
      excellent: Has a concrete view of what makes a good week grounded in what people told them, uses a lightweight way to track it and gives an example of removing a recurring cause of bad weeks.
      good: Asks people regularly and acts on some of the answers.
      weak: Assumes good delivery means people are having good weeks.
    followups:
      - What's a common cause of bad weeks you've removed?
    common_errors:
      - Measuring only output and not the experience of doing the work.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.team_health.impact_visibility_upward
    competency_key: stakeholder_management
    topic: Making the team's impact visible to leadership
    difficulty: medium
    text: >-
      How do you make your team's impact visible to senior leadership, and how has that affected the team's
      motivation and the opportunities people get?
    expected_concepts:
      - reporting outcomes rather than activity
      - letting team members present their own work
      - crediting individuals by name
      - including less glamorous work such as reliability
      - connecting visibility to growth opportunities
    rubric:
      excellent: Describes specific ways of showing outcomes upward, gives team members direct exposure with credit, includes less visible work and shows how it led to recognition or opportunities.
      good: Shares team results with leadership and credits people.
      weak: Presents the team's work as their own or only reports activity.
    followups:
      - How do you show the value of work that prevented problems rather than shipped features?
    common_errors:
      - Being the only voice the leadership ever hears from the team.

  - external_key: managerial.team_health.stay_conversations
    competency_key: people_management
    topic: Understanding why strong people stay
    difficulty: medium
    text: >-
      What do you do to understand why your strongest people stay, before any of them start thinking about
      leaving?
    expected_concepts:
      - stay conversations or direct questions about what keeps them
      - asking what would make them consider leaving
      - acting on the answers
      - watching for work-related warning signs
      - revisiting periodically
    rubric:
      excellent: Holds deliberate stay conversations, acts on what they hear, and describes a case where it changed something before a resignation.
      good: Asks people what they value and acts on some of it.
      weak: Only learns about issues in exit interviews.
    followups:
      - What's something you changed because of a conversation like that?
    common_errors:
      - Only paying attention to retention after a resignation.

  - external_key: managerial.team_health.real_ownership
    competency_key: leadership
    topic: Giving a team real ownership of an area
    difficulty: medium
    text: >-
      How have you given a team real ownership of a product area or system, rather than just a queue of tickets,
      and what effect did that have on the team?
    expected_concepts:
      - clear area of responsibility with outcomes, not tasks
      - involving the team in roadmap and design decisions
      - access to users, data and stakeholders
      - accountability for operating what they build
      - observable effects on initiative and quality
    rubric:
      excellent: Gives a real example of shifting the team from tasks to outcomes with decision rights and direct user access, and describes concrete effects on initiative and quality.
      good: Describes giving the team more say over a defined area.
      weak: Describes ownership in name only while decisions stay elsewhere.
    followups:
      - What decisions did you deliberately keep, and why?
    common_errors:
      - Giving accountability without the authority to make decisions.

  - external_key: managerial.team_health.rotations_for_learning
    competency_key: mentoring
    topic: Rotations to keep people learning
    difficulty: medium
    text: >-
      Tell me how you've used rotations across systems, projects or roles to keep people learning, and what it
      cost the team in the short term.
    expected_concepts:
      - choosing what and who to rotate
      - planned handover and support during rotation
      - short-term slowdown acknowledged in planning
      - longer-term benefits such as resilience and engagement
      - letting people opt out or shape it
    rubric:
      excellent: Gives a real rotation example, plans for the short-term cost openly, supports people through it and shows longer-term gains in learning and resilience.
      good: Describes rotations with some planning.
      weak: Has never rotated people or ignores the short-term cost.
    followups:
      - How did you explain the slowdown to stakeholders?
    common_errors:
      - Rotating people without a handover, which hurts both delivery and confidence in the approach.

  - external_key: managerial.team_health.calibrating_autonomy
    competency_key: leadership
    topic: Calibrating autonomy for each person
    difficulty: medium
    text: >-
      How do you decide how much autonomy to give each person on your team? Tell me what getting it wrong, in
      either direction, taught you.
    expected_concepts:
      - matching autonomy to experience with the specific task
      - agreeing checkpoints and outcomes rather than methods
      - expanding autonomy as trust is shown
      - recognising micromanagement and absent management
      - a real example of correcting course
    rubric:
      excellent: Matches autonomy to task-specific experience, defines outcomes and checkpoints, and gives a real example of getting it wrong and adjusting.
      good: Describes adjusting autonomy to experience.
      weak: Applies the same level to everyone or cannot reflect on mistakes.
    followups:
      - How would someone on your team describe your level of involvement?
    common_errors:
      - Giving full autonomy to someone new to the area and calling it trust.

  - external_key: managerial.team_health.long_tenured_engineer
    competency_key: people_management
    topic: A long-tenured engineer after a wave of new hires
    difficulty: medium
    text: >-
      After a wave of new hires, a long-tenured engineer tells you the team has changed around them and their
      experience no longer seems valued. How would you handle it?
    expected_concepts:
      - understanding what specifically changed for them
      - acknowledging their knowledge and history with the system
      - giving them a visible role such as mentoring or architecture
      - integrating their knowledge into new ways of working
      - following up over time
    rubric:
      excellent: Listens for the specific changes, finds a meaningful and visible role for their experience, connects it to the new team's work and follows up.
      good: Acknowledges their concern and offers a mentoring role.
      weak: Dismisses it as resistance to change.
    followups:
      - How would you handle it if they resisted the team's new practices?
    common_errors:
      - Assuming they simply need to adapt.

  - external_key: managerial.team_health.unexciting_migration
    competency_key: communication
    topic: Keeping people engaged in unexciting work
    difficulty: medium
    text: >-
      Your team has been assigned a year of migration work on a legacy system that nobody is excited about. How
      would you keep people engaged through it?
    expected_concepts:
      - explaining the real reason and impact
      - breaking it into visible milestones
      - rotating people across parts of the work
      - building learning opportunities into it, such as tooling or automation
      - celebrating progress along the way
    rubric:
      excellent: Explains the purpose clearly, structures visible milestones, rotates work and builds in learning such as automation, and marks progress.
      good: Explains the purpose and celebrates milestones.
      weak: Expects people to just get on with it.
    followups:
      - How would you know if engagement was dropping?
    common_errors:
      - Overselling the work as exciting rather than explaining why it matters.

  - external_key: managerial.team_health.team_owned_goals
    competency_key: project_management
    topic: Involving the team in setting its goals
    difficulty: medium
    text: >-
      How do you involve the team in setting its own goals for a quarter so people feel ownership of them, and
      what do you do when leadership's goals for the team are different?
    expected_concepts:
      - sharing company and product context first
      - team drafting goals and measures
      - reconciling with leadership's priorities openly
      - explaining any goals that were imposed and why
      - reviewing progress together during the quarter
    rubric:
      excellent: Gives context, has the team draft goals, reconciles differences with leadership transparently and explains the outcome back to the team, with an example.
      good: Involves the team in drafting goals.
      weak: Hands the team goals with no input or explanation.
    followups:
      - Tell me about a goal the team proposed that leadership rejected.
    common_errors:
      - Asking for input and then ignoring it.

  - external_key: managerial.team_health.key_resignation
    competency_key: people_management
    topic: When a key engineer resigns
    difficulty: medium
    text: >-
      One of your best engineers tells you they've accepted another offer. How do you handle that conversation,
      and what do you do for the team afterwards?
    expected_concepts:
      - respecting the decision and parting on good terms
      - learning what led to it
      - a structured knowledge transfer plan
      - communicating to the team and stakeholders
      - redistributing work without overloading others
    rubric:
      excellent: Handles the conversation respectfully, learns the reasons, runs a structured handover, communicates clearly and rebalances work without overloading remaining people.
      good: Plans a handover and informs the team.
      weak: Focuses only on the gap, or reacts in a way that sours the departure.
    followups:
      - How did you decide whether to backfill the role as it was?
    common_errors:
      - Piling the leaver's work onto the next strongest person.

  - external_key: managerial.team_health.hidden_skills
    competency_key: mentoring
    topic: Finding and using untapped skills
    difficulty: medium
    text: >-
      How have you discovered skills or interests on your team that weren't part of anyone's role, and how did
      you put them to use?
    expected_concepts:
      - asking about interests and side projects
      - creating openings such as hack weeks or small projects
      - matching the interest to real team needs
      - recognising the result
    rubric:
      excellent: Gives a real example of discovering an untapped skill, creating an opportunity matched to a team need and the result for both the person and the team.
      good: Describes asking about interests and finding some use for them.
      weak: Only considers people for the work in their job description.
    followups:
      - How did that change the person's role over time?
    common_errors:
      - Treating side interests as distractions.

  - external_key: managerial.team_health.growth_versus_speed
    competency_key: project_management
    topic: Balancing growth and speed in planning
    difficulty: medium
    text: >-
      When you plan a quarter, how do you balance giving people work that helps them grow against putting the
      most experienced person on each task so it gets done fastest?
    expected_concepts:
      - identifying which work is time-critical
      - pairing experienced and growing people
      - building learning time into estimates
      - limiting growth assignments on the critical path
      - reviewing the mix each quarter
    rubric:
      excellent: Separates critical-path work from growth opportunities, pairs people deliberately, adjusts estimates and reviews the balance every cycle.
      good: Pairs people and considers growth in planning.
      weak: Always optimises for speed, leaving growth to chance.
    followups:
      - What happens to growth assignments when a deadline is threatened?
    common_errors:
      - Not budgeting extra time when assigning work to someone new to it.

  - external_key: managerial.team_health.exit_lessons
    competency_key: people_management
    topic: Learning from people who left
    difficulty: medium
    text: >-
      What have you learned from people who left your teams, and what did you change because of it?
    expected_concepts:
      - exit conversations and follow-ups after some time
      - identifying patterns across departures
      - separating controllable from uncontrollable reasons
      - specific changes made as a result
    rubric:
      excellent: Draws patterns from several departures, distinguishes what was in their control, and names specific changes made and their effect.
      good: Names a lesson and a change.
      weak: Attributes every departure to external factors such as pay elsewhere.
    followups:
      - What would those people say about your team if asked today?
    common_errors:
      - Assuming departures are always about compensation.

  - external_key: managerial.team_health.cancelled_project
    competency_key: leadership
    topic: Leading the team after a cancelled project
    difficulty: medium
    text: >-
      A project your team spent months on is cancelled just before launch. How do you handle the next few days
      with the team?
    expected_concepts:
      - telling the team quickly and directly
      - explaining the real reasons
      - recognising the work and what was learned
      - salvaging reusable parts
      - giving clear direction on what comes next
    rubric:
      excellent: Communicates quickly with the real reasons, acknowledges the effort, captures learning and reusable work, and sets clear next direction.
      good: Explains the decision and moves the team forward.
      weak: Delivers the news without context or blames leadership.
    followups:
      - What would you do if you also disagreed with the cancellation?
    common_errors:
      - Spinning the decision instead of explaining it.

  # ------------------------------------------------------------------ hard
  - external_key: managerial.team_health.attrition_spike
    competency_key: people_management
    topic: Investigating an attrition spike
    difficulty: hard
    text: >-
      Three engineers left your team within two months, and leadership asks what's going on. How would you
      investigate, and what would you present back?
    expected_concepts:
      - exit data and conversations with those who left
      - stay conversations with those remaining
      - looking at workload, growth, management and project signals
      - own role as manager examined openly
      - a concrete action plan with measures
      - managing knowledge loss and risk of further departures
    rubric:
      excellent: Gathers evidence from leavers and remaining staff, examines their own role, identifies root causes across workload and growth, and presents a concrete plan with measures and near-term risk mitigation.
      good: Investigates causes and proposes actions.
      weak: Treats departures as unrelated coincidences.
    followups:
      - What if the main cause turns out to be you?
    common_errors:
      - Presenting the market as the sole explanation.

  - external_key: managerial.team_health.retention_levers
    competency_key: leadership
    topic: Retention with limited formal levers
    difficulty: hard
    text: >-
      When you have little control over compensation, titles or promotion timing, which levers have you actually
      used to keep strong people, and which worked best?
    expected_concepts:
      - meaningful scope and ownership
      - growth through new challenges
      - recognition and visibility with senior leadership
      - reducing friction and toil
      - advocating upward for formal changes when deserved
    rubric:
      excellent: Names levers they have used with real examples, explains which worked best and why, and shows they also advocated upward for formal recognition where deserved.
      good: Lists several levers with an example.
      weak: Says nothing can be done without money or promotions.
    followups:
      - When have you had to advocate for an out-of-cycle change?
    common_errors:
      - Over-relying on perks rather than the work itself.

  - external_key: managerial.team_health.counteroffer_judgement
    competency_key: people_management
    topic: Whether to make a counteroffer
    difficulty: hard
    text: >-
      A key engineer resigns, and your director suggests making a counteroffer. How would you think through
      whether that's the right move for the person and the team?
    expected_concepts:
      - understanding the real reasons for leaving
      - whether a counteroffer addresses those reasons
      - fairness and consistency with the rest of the team
      - risk of short-term retention only
      - respecting the person's decision
    rubric:
      excellent: Starts with the person's reasons, weighs whether the offer addresses them, considers fairness to peers and short-term risk, and respects the decision either way.
      good: Considers the reasons and some fairness implications.
      weak: Treats a counteroffer as an automatic fix.
    followups:
      - What should change for the team regardless of what the person decides?
    common_errors:
      - Ignoring that the underlying reasons may remain.

  - external_key: managerial.team_health.junior_heavy_team
    competency_key: mentoring
    topic: Junior-heavy team with stretched seniors
    difficulty: hard
    text: >-
      Your team is mostly early-career engineers, and the two seniors are stretched thin mentoring everyone. How
      would you restructure things so everyone keeps growing without wearing the seniors out?
    expected_concepts:
      - peer mentoring among mid-level engineers
      - structured learning materials and documentation
      - limiting senior mentoring load explicitly
      - recognising mentoring work in performance reviews
      - adjusting hiring mix over time
    rubric:
      excellent: Spreads mentoring across the team, builds reusable learning materials, caps and recognises senior mentoring load, and plans hiring mix changes.
      good: Introduces some peer mentoring and documentation.
      weak: Expects seniors to keep absorbing the load.
    followups:
      - How would you know the juniors are actually growing?
    common_errors:
      - Not counting mentoring as real work when planning.

  - external_key: managerial.team_health.priority_whiplash
    competency_key: leadership
    topic: Team demotivated by repeated priority changes
    difficulty: hard
    text: >-
      Leadership has changed your team's priorities four times this year, and people have started saying nothing
      they build matters. What would you do, both with the team and with leadership?
    expected_concepts:
      - acknowledging the problem openly with the team
      - showing the real impact of shipped work
      - quantifying the cost of churn for leadership
      - proposing planning practices that reduce churn
      - structuring work into smaller deliverable increments
    rubric:
      excellent: Acknowledges the issue openly, quantifies the cost of churn for leadership, proposes concrete planning changes and restructures work into smaller increments that ship value.
      good: Raises the concern with leadership and reassures the team.
      weak: Passes on changes without question and offers no help to the team.
    followups:
      - How would you present the cost of the changes to leadership?
    common_errors:
      - Agreeing with the team that leadership is the problem without doing anything constructive.

  - external_key: managerial.team_health.key_person_dependency
    competency_key: people_management
    topic: Reducing key-person dependency respectfully
    difficulty: hard
    text: >-
      How do you reduce the risk of depending on one or two people for critical knowledge, without making those
      people feel less valued?
    expected_concepts:
      - framing knowledge sharing as raising their impact
      - pairing and documentation goals
      - giving the experts new challenges once others can cover
      - recognising teaching as a valued contribution
      - measuring coverage through rotations
    rubric:
      excellent: Frames knowledge sharing as expanding the experts' impact, sets concrete transfer goals, recognises teaching and gives the experts new challenges once others can cover.
      good: Introduces pairing and documentation with clear goals.
      weak: Forces handovers without explaining why, or leaves the dependency in place.
    followups:
      - How would you test whether the knowledge transfer worked?
    common_errors:
      - Treating documentation alone as sufficient transfer.
