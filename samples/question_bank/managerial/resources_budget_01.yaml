# Managerial round: resources and budget (part 1 of 4).
# Focus: allocating people across work, headcount requests and freezes, capacity planning.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ allocating people
  - external_key: managerial.resources_budget.two_projects_same_people
    competency_key: project_management
    topic: Two projects competing for the same engineers
    difficulty: easy
    text: >-
      Think of a time when two pieces of work both needed the same few engineers at the same time. How did you
      decide who worked on what, and how did it play out?
    expected_concepts:
      - clarifying the deadlines and business impact of each piece of work
      - matching skills and context of individuals to the work
      - agreeing the decision with the relevant stakeholders
      - communicating the trade-off and what would slip
      - checking afterwards whether the split was right
    rubric:
      excellent: Describes a specific conflict, explains the criteria used to split the engineers, shows how stakeholders were brought into the decision and reports what actually happened to both pieces of work.
      good: Gives a real example with a reasonable decision and some communication, but the criteria or the outcome are thin.
      weak: Says both projects were simply worked on in parallel, or describes the decision being made by someone else with no involvement of their own.
    followups:
      - Who disagreed with the split, and how did you handle that?
      - Looking back, would you split the people the same way?
    common_errors:
      - Splitting everyone fifty-fifty across both projects without considering context-switching cost.

  - external_key: managerial.resources_budget.capacity_for_product_partner
    competency_key: communication
    topic: Explaining realistic capacity to a product partner
    difficulty: easy
    text: >-
      Your product manager comes to quarterly planning with a list that's clearly bigger than the team can
      deliver. How do you explain what the team can realistically take on?
    expected_concepts:
      - capacity in real terms after leave, support load and ongoing commitments
      - historical delivery data rather than optimism
      - ranking the list together by value
      - showing explicitly what falls below the line
      - agreeing how to revisit if things change
    rubric:
      excellent: Explains a concrete capacity calculation grounded in past delivery, works through the list with the product manager by value and makes the items that will not fit explicit and agreed.
      good: Uses some evidence of capacity and negotiates the list, but the method for estimating capacity is vague.
      weak: Accepts the whole list and hopes to catch up, or simply refuses without offering a ranked alternative.
    followups:
      - What numbers do you bring to that conversation?
      - What do you do when the product manager insists everything is a priority?
    common_errors:
      - Counting every engineer at full capacity with no allowance for support, meetings or time off.

  - external_key: managerial.resources_budget.tracking_who_does_what
    competency_key: project_management
    topic: Keeping visibility of who is working on what
    difficulty: easy
    text: >-
      How do you keep track of what each person on your team is working on and how much spare capacity you have
      at any point? Tell me about the approach you use today.
    expected_concepts:
      - a lightweight shared view of work in progress
      - visibility of unplanned and support work, not only roadmap items
      - limiting work in progress per person
      - regular review in team rituals rather than manual status chasing
      - using the view to make allocation decisions
    rubric:
      excellent: Describes a concrete, lightweight system that captures planned and unplanned work, explains how it is kept current without status chasing and gives an example of a decision it informed.
      good: Has a reasonable board or tracker and uses it, but unplanned work or how decisions are made from it is not addressed.
      weak: Relies on memory or asking people individually, or describes a heavy process with no clear use.
    followups:
      - How do you spot that someone is quietly overloaded?
      - What work tends not to show up in that view?
    common_errors:
      - Tracking only roadmap tickets and missing interrupts, reviews and support work.

  - external_key: managerial.resources_budget.request_without_resources
    competency_key: stakeholder_management
    topic: Responding to a request that has no resources behind it
    difficulty: easy
    text: >-
      Tell me about a time a stakeholder asked your team to take on something new without any extra people or
      time. How did you respond?
    expected_concepts:
      - understanding the goal and urgency behind the request
      - making the cost visible in terms of what would be displaced
      - offering options such as a smaller version, later timing or a swap
      - involving whoever owns the priorities when needed
      - a clear agreed outcome
    rubric:
      excellent: Describes a specific request, shows they understood the real need, presented concrete options with their trade-offs and reached an explicit agreement on what would and would not be done.
      good: Pushed back constructively with some options, but the outcome or the trade-off discussion is unclear.
      weak: Either silently absorbed the work or flatly refused without exploring the need.
    followups:
      - What option did the stakeholder pick, and why?
      - How did you explain the decision to your own team?
    common_errors:
      - Treating every new request as a yes or no question instead of offering trade-offs.

  - external_key: managerial.resources_budget.lead_own_time_split
    competency_key: leadership
    topic: How a lead splits their own time
    difficulty: easy
    text: >-
      As a lead, your own time is one of the team's scarcest resources. How do you decide how much of it goes to
      hands-on work, reviews, planning and helping others, and how has that changed over time?
    expected_concepts:
      - deliberate rather than accidental split of time
      - staying off the critical path for delivery when time is fragmented
      - prioritising work only the lead can do
      - adjusting the split as the team grows or changes
      - checking the split against calendar or actual time spent
    rubric:
      excellent: Gives a deliberate split with reasons, explains how they avoid becoming a bottleneck, and describes a concrete change they made after reviewing how their time was actually spent.
      good: Has a reasonable view of the split and some adjustments, but it is described in general terms.
      weak: Says they simply do whatever comes up, or keeps taking critical-path coding work despite constant interruptions.
    followups:
      - What did you stop doing when the team grew?
      - How do you know your split is working for the team?
    common_errors:
      - Holding on to critical-path tasks while spending most of the day in meetings.

  - external_key: managerial.resources_budget.mentoring_time_in_plans
    competency_key: mentoring
    topic: Accounting for mentoring time in capacity plans
    difficulty: easy
    text: >-
      When new people join, your experienced engineers spend real time helping them. How do you account for that
      time when you plan what the team can deliver?
    expected_concepts:
      - explicitly reducing planned capacity of mentors and new joiners
      - estimating ramp-up time from past onboarding
      - choosing starter work that is useful but low risk
      - spreading mentoring load so one person is not swamped
      - recognising mentoring as real work in reviews and plans
    rubric:
      excellent: Describes a concrete adjustment to capacity for both mentors and new joiners, based on past ramp-up data, with mentoring load spread and recognised as real work.
      good: Acknowledges the cost and makes some allowance, but without a clear basis for the numbers.
      weak: Plans as if new joiners are productive from day one and mentoring is free.
    followups:
      - How long did ramp-up actually take for the last person who joined?
      - How do you stop the same senior engineer from always being the mentor?
    common_errors:
      - Assuming more people immediately means more output.

  - external_key: managerial.resources_budget.taking_on_interns
    competency_key: mentoring
    topic: Deciding whether the team can host interns or apprentices
    difficulty: easy
    text: >-
      Suppose your team is offered two interns for a few months. How would you decide whether to say yes, and
      what would you put in place if you did?
    expected_concepts:
      - realistic assessment of mentoring capacity on the team
      - well-scoped projects with real value and clear end points
      - a named mentor with protected time for each intern
      - impact on team commitments during that period
      - how success will be judged for the interns and the team
    rubric:
      excellent: Weighs the mentoring cost against team commitments, describes concrete scoped projects and named mentors with protected time, and defines what success would look like for everyone involved.
      good: Gives a sensible approach with mentors and projects, but does not weigh the impact on delivery.
      weak: Accepts without planning, or declines without considering any benefit to the team.
    followups:
      - What kind of project would you avoid giving an intern?
      - How would you adjust the team's commitments for those months?
    common_errors:
      - Giving interns throwaway work or critical-path work with no support.

  - external_key: managerial.resources_budget.making_headcount_case
    competency_key: stakeholder_management
    topic: Building the case for additional headcount
    difficulty: medium
    text: >-
      Tell me about a time you asked for more people for your team. How did you build the case, and what was the
      result?
    expected_concepts:
      - tying the request to business outcomes rather than workload alone
      - evidence such as demand trends, backlog impact or risk
      - what the team would deliver with and without the hires
      - alternatives considered before asking for headcount
      - outcome and what they learned about making the case
    rubric:
      excellent: Describes a specific request built on outcome-based evidence, shows what would and would not happen without the hires, mentions alternatives considered and reports the result and what they learned.
      good: Makes a reasonable evidence-based case with a clear outcome, but alternatives or business framing are weak.
      weak: Argues only that the team is busy or overworked, with no evidence or link to business goals.
    followups:
      - What alternatives to hiring did you consider first?
      - If you had been the decision maker, what would have convinced you?
    common_errors:
      - Framing the request around team busyness instead of the outcomes that more people would unlock.

  - external_key: managerial.resources_budget.headcount_request_declined
    competency_key: leadership
    topic: Working with the team you have after a declined request
    difficulty: medium
    text: >-
      Describe a time your request for more people was turned down. What did you change about your plans and
      commitments afterwards?
    expected_concepts:
      - accepting the decision and understanding the reasons
      - re-ranking commitments to fit actual capacity
      - explicitly communicating what would no longer happen
      - finding efficiencies such as automation or dropping low-value work
      - revisiting the request later with better evidence if still needed
    rubric:
      excellent: Explains how they reset commitments to real capacity, made the consequences visible to stakeholders, found concrete efficiencies and described how they followed up later.
      good: Adjusted plans sensibly after the decision, but communication of the consequences is thin.
      weak: Kept every commitment and asked the team to work harder, or simply complained about the decision.
    followups:
      - Which commitment did you drop, and who did you tell?
      - Did the decision ever get revisited?
    common_errors:
      - Quietly absorbing the gap through extra hours instead of changing commitments.

  - external_key: managerial.resources_budget.senior_or_two_juniors
    competency_key: people_management
    topic: Choosing the seniority mix of new hires
    difficulty: medium
    text: >-
      Say you have budget that could pay for either one very experienced engineer or two early-career engineers.
      How would you decide which to hire, and what about your current team would change your answer?
    expected_concepts:
      - the kind of problems the team needs solved over the next year
      - existing senior capacity to mentor early-career hires
      - speed to impact versus longer-term growth
      - risk concentration and knowledge spread
      - the career paths available to each hire
    rubric:
      excellent: Ties the choice to the team's upcoming work and current mentoring capacity, weighs speed against long-term growth and risk, and explains clearly which situations would flip the decision.
      good: Considers several relevant factors and reaches a sensible answer, but does not show how the team's makeup changes it.
      weak: Picks one option by default, such as always hiring juniors because it seems cheaper, without reasoning about the team.
    followups:
      - Have you made a choice like this before? How did it turn out?
      - What would make you hire two early-career people even with few seniors?
    common_errors:
      - Assuming two people always produce twice the output of one.

  - external_key: managerial.resources_budget.backfill_or_reshape
    competency_key: leadership
    topic: Deciding how to use a backfill
    difficulty: medium
    text: >-
      When someone leaves your team, you often get to decide what to do with the open role. Tell me about a time
      you chose whether to backfill like for like or reshape the role.
    expected_concepts:
      - reassessing the team's needs rather than copying the old job description
      - skills gaps and upcoming work
      - covering the departing person's responsibilities in the meantime
      - involving the team in what the role should be
      - outcome of the decision
    rubric:
      excellent: Describes a real departure, explains how they re-evaluated the team's needs, chose deliberately between a like-for-like hire and a reshaped role, covered the gap in the meantime and reports the outcome.
      good: Gives a reasonable example with some reassessment, but coverage of the gap or the outcome is unclear.
      weak: Automatically reposted the same role without considering what the team needed.
    followups:
      - How did you cover that person's work while the role was open?
      - Would you make the same choice today?
    common_errors:
      - Treating a departure only as a hiring task and ignoring the knowledge that left with the person.

  - external_key: managerial.resources_budget.capacity_split_maintenance
    competency_key: project_management
    topic: Splitting capacity between features, maintenance and debt
    difficulty: medium
    text: >-
      How do you decide what share of your team's time goes to new features versus maintenance, upgrades and
      technical debt? Walk me through how you set that split on a recent team.
    expected_concepts:
      - measuring how much time currently goes to each kind of work
      - linking the split to reliability, delivery speed or risk signals
      - agreeing the split with product partners
      - protecting the reserved share from being raided
      - adjusting the split when signals change
    rubric:
      excellent: Explains how they measured the current split, used concrete signals to set a target, agreed it with product and describes how it was protected and later adjusted.
      good: Uses a deliberate split agreed with stakeholders, but the basis for the number or how it is defended is thin.
      weak: Handles maintenance only when something breaks, or picks a percentage with no reasoning.
    followups:
      - What signal would make you increase the maintenance share?
      - What happened the last time someone tried to borrow that time for features?
    common_errors:
      - Setting a split once and never checking whether it is actually followed.

  - external_key: managerial.resources_budget.moving_engineer_between_teams
    competency_key: people_management
    topic: Moving an engineer to different work for business reasons
    difficulty: medium
    text: >-
      Tell me about a time you had to move someone onto a different project or team because priorities changed.
      How did you handle it with that person?
    expected_concepts:
      - explaining the business reason clearly and early
      - listening to the person's concerns and goals
      - how the move connects to their growth where possible
      - a clean handover of their current work
      - follow-up after the move
    rubric:
      excellent: Describes a specific move, explains how they made the reasoning clear, took the person's goals into account, arranged a clean handover and followed up afterwards on how it was going.
      good: Handled the conversation reasonably and explained the reasons, but handover or follow-up is missing.
      weak: Announced the move without discussion, or avoided the conversation and let someone else handle it.
    followups:
      - What did the person push back on, and how did you respond?
      - What happened to the work they left behind?
    common_errors:
      - Treating people as interchangeable units and ignoring their context and goals.

  - external_key: managerial.resources_budget.shared_specialist_time
    competency_key: collaboration
    topic: Sharing a scarce specialist across teams
    difficulty: medium
    text: >-
      Imagine one specialist, say the only database expert or designer, is needed by three teams at once. How
      would you arrange their time so it's fair and the most important work gets done?
    expected_concepts:
      - agreeing priorities across the teams rather than first come, first served
      - a visible schedule or intake process for the specialist's time
      - reducing dependence through documentation, templates or teaching others
      - protecting the specialist from constant interruption
      - planning longer term for more coverage of that skill
    rubric:
      excellent: Proposes a transparent intake and prioritisation agreed by the teams, protects the specialist's focus, reduces dependence through knowledge sharing and plans for longer-term coverage.
      good: Proposes a reasonable scheduling approach, but does not address reducing dependence on one person.
      weak: Leaves the specialist to sort it out, or gives priority to whoever shouts loudest.
    followups:
      - Who should make the call when the teams disagree?
      - How would you know the specialist is becoming a bottleneck?
    common_errors:
      - Solving only the scheduling problem and ignoring the single-person risk.

  - external_key: managerial.resources_budget.single_expert_risk
    competency_key: mentoring
    topic: Spreading knowledge held by one person
    difficulty: medium
    text: >-
      Tell me about a time you realised only one person on your team really understood a critical system. How
      did you spread that knowledge without slowing delivery to a crawl?
    expected_concepts:
      - identifying the risk and its potential impact
      - pairing and rotating others into the system's work
      - documentation or runbooks produced as part of real work
      - reducing the expert's load so they had time to teach
      - checking that others could actually operate the system
    rubric:
      excellent: Describes a specific single-expert risk, deliberately rotated others in through pairing and real work, freed the expert's time to teach and verified the result, for example by someone else handling an on-call issue.
      good: Took reasonable steps such as pairing or documentation, but did not verify that knowledge actually spread.
      weak: Asked the expert to write documentation in their spare time and considered it solved.
    followups:
      - How did the expert feel about giving up that work?
      - How did you test that others could handle it?
    common_errors:
      - Relying only on documents nobody reads instead of hands-on rotation.

  - external_key: managerial.resources_budget.interrupt_load
    competency_key: project_management
    topic: Protecting roadmap capacity from interrupts
    difficulty: medium
    text: >-
      Many teams find support requests, on-call and ad hoc asks eating into planned work. Tell me how you measured
      that load on a team you led and what you changed.
    expected_concepts:
      - measuring interrupt volume and time spent
      - a rotation or shield role to absorb interrupts
      - fixing the top sources of repeat requests
      - reflecting interrupt load in planning
      - results after the change
    rubric:
      excellent: Measured interrupt load with real data, introduced a concrete mechanism such as a rotating shield, reduced the top repeat sources and shows how planned delivery improved.
      good: Introduced a reasonable mechanism, but the measurement or the results are vague.
      weak: Asked people to ignore interrupts or simply accepted that planned work would slip.
    followups:
      - What were the biggest sources of interrupts?
      - How did the rest of the company react to the new process?
    common_errors:
      - Only rearranging who handles interrupts without reducing their root causes.

  - external_key: managerial.resources_budget.overcommitted_team_cut
    competency_key: leadership
    topic: Cutting work from an overcommitted team
    difficulty: medium
    text: >-
      Describe a time you realised your team had committed to more than it could deliver. What did you cut, and
      how did you decide?
    expected_concepts:
      - recognising the signs of overcommitment early
      - ranking commitments by value and dependencies
      - consulting stakeholders before cutting
      - communicating clearly what was dropped or delayed
      - preventing the same overcommitment next time
    rubric:
      excellent: Gives a specific example, explains early signals, uses clear criteria to choose what to cut with stakeholder input, communicates the change openly and describes a process change to avoid repeating it.
      good: Cut work sensibly and told stakeholders, but the decision criteria or prevention are unclear.
      weak: Did not cut anything and relied on extra hours, or cut work without telling anyone.
    followups:
      - Who was most affected by what you cut?
      - What did you change in how the team commits to work?
    common_errors:
      - Cutting the quiet, important work such as testing or upgrades instead of lower-value features.

  - external_key: managerial.resources_budget.temporary_task_force
    competency_key: project_management
    topic: Running and unwinding a temporary task force
    difficulty: medium
    text: >-
      Tell me about a time you pulled people off their normal work into a short-term task force for something
      urgent. How did you set it up, and how did you get them back to their original work?
    expected_concepts:
      - clear goal and exit criteria for the task force
      - choosing people based on skills and impact on other work
      - telling affected stakeholders what would pause
      - a planned end date and return process
      - handing ongoing ownership to a permanent home
    rubric:
      excellent: Describes a task force with a clear goal and exit criteria, explains whom they pulled and why, managed the impact on paused work and ended it on purpose with ongoing ownership handed over.
      good: Set up the task force reasonably and achieved the goal, but the exit or impact on other work was not well managed.
      weak: The task force drifted on without an end, or people were pulled in with no communication to anyone affected.
    followups:
      - How did you decide the task force was done?
      - What happened to the work those people had paused?
    common_errors:
      - Creating a task force with no exit criteria so it quietly becomes permanent.

  - external_key: managerial.resources_budget.late_offer_of_more_people
    competency_key: project_management
    topic: Being offered more people late in a project
    difficulty: medium
    text: >-
      Six weeks before an important deadline, leadership offers to add two engineers from another team to your
      project. How would you decide whether to accept, and how would you use them if you did?
    expected_concepts:
      - ramp-up and coordination cost of adding people late
      - whether there is well-separated work they could take independently
      - the burden on existing team members to onboard them
      - alternatives such as scope reduction
      - giving leadership a clear, reasoned answer
    rubric:
      excellent: Weighs ramp-up and coordination costs against genuinely separable work, considers alternatives like scope reduction and gives a specific plan for how any extra people would be used, or a clear reason to decline.
      good: Recognises that adding people late has costs and reaches a sensible answer, but the plan is general.
      weak: Accepts automatically because more people must mean faster delivery.
    followups:
      - What kind of work would you hand to them?
      - How would you explain a decision to decline the offer?
    common_errors:
      - Assuming extra people will speed things up without considering onboarding and coordination.

  - external_key: managerial.resources_budget.hiring_freeze_after_commitments
    competency_key: leadership
    topic: Responding to a hiring freeze after commitments were made
    difficulty: hard
    text: >-
      Your roadmap for the year was agreed on the assumption of three new hires, and then a hiring freeze is
      announced. Walk me through what you'd do in the first few weeks.
    expected_concepts:
      - re-planning against actual capacity rather than hoped-for capacity
      - identifying which commitments depended on the planned hires
      - presenting options and consequences to leadership and stakeholders
      - explaining the change openly to the team
      - looking for efficiencies or lower-value work to stop
      - agreeing a trigger for revisiting if the freeze lifts
    rubric:
      excellent: Lays out a structured re-plan that maps commitments to the missing hires, presents clear options and consequences to leadership, communicates openly with the team and agrees how to revisit later.
      good: Re-plans sensibly and informs stakeholders, but does not tie commitments explicitly to the missing capacity or offer clear options.
      weak: Keeps the original roadmap and expects the existing team to absorb the gap.
    followups:
      - Which commitment would you protect at all costs, and why?
      - How would you keep the team focused while the plan changes?
    common_errors:
      - Waiting to see if the freeze lifts instead of re-planning straight away.

  - external_key: managerial.resources_budget.new_initiative_no_headcount
    competency_key: leadership
    topic: Staffing a new initiative from existing teams
    difficulty: hard
    text: >-
      Leadership asks you to start a significant new initiative, but there's no new headcount for it. How have
      you, or how would you, staff it from people you already have?
    expected_concepts:
      - understanding how important the initiative is relative to existing work
      - explicitly stopping or slowing existing work to free people
      - choosing a small, capable founding group rather than spreading thin
      - protecting the systems left behind with reduced staffing
      - getting leadership to agree the trade-offs openly
    rubric:
      excellent: Insists on explicit trade-offs agreed with leadership, frees a focused founding group by stopping named work, and plans how the remaining systems and teams stay safe with reduced staffing.
      good: Staffs the initiative sensibly and mentions some trade-offs, but does not secure explicit agreement on what stops.
      weak: Asks everyone to contribute a little alongside their current work, with nothing stopped.
    followups:
      - What would you stop to make room, and who would need to agree?
      - How would you choose the people for the new initiative?
    common_errors:
      - Staffing new work with fractions of many people so nobody owns it.

  - external_key: managerial.resources_budget.many_asks_few_slots
    competency_key: leadership
    topic: Choosing between many requests with capacity for a few
    difficulty: hard
    text: >-
      Tell me about a time several teams or stakeholders needed your team's help and you only had capacity for a
      couple of them. How did you choose, and what did you do for the ones you turned down?
    expected_concepts:
      - transparent criteria such as impact, urgency and dependency
      - involving a decision owner or shared forum rather than deciding alone in private
      - explaining the decision to those turned down
      - offering alternatives such as self-service, guidance or later timing
      - checking the impact of the decision afterwards
    rubric:
      excellent: Uses transparent, agreed criteria, involves the right decision makers, explains the outcome directly to those turned down with real alternatives and reviews whether the choice was right.
      good: Makes a reasoned choice and communicates it, but criteria were private or alternatives for others were thin.
      weak: Chose based on relationships or whoever asked first, and left the others to find out on their own.
    followups:
      - How did the teams you turned down react?
      - What would you do differently in the next round?
    common_errors:
      - Saying yes to everyone at reduced effort so nothing gets done well.

  - external_key: managerial.resources_budget.merging_overlapping_teams
    competency_key: leadership
    topic: Reallocating people and systems when teams merge
    difficulty: hard
    text: >-
      Suppose two teams with overlapping responsibilities are being merged under you. How would you decide who
      owns which systems and how people are allocated in the new team?
    expected_concepts:
      - mapping systems, responsibilities and current owners
      - finding duplicated work and systems to consolidate or retire
      - designing the new structure around goals rather than old team lines
      - involving people in the design and listening to their preferences
      - a transition plan that keeps operations safe
    rubric:
      excellent: Starts from a clear map of systems and work, designs ownership around goals rather than old team boundaries, consolidates duplication, involves people in the design and sequences the transition safely.
      good: Gives a reasonable allocation approach, but misses either duplication or a safe transition.
      weak: Keeps both old teams intact under new names, or reassigns people without any analysis or consultation.
    followups:
      - How would you handle two people who both expect to lead the same area?
      - What would you check in the first month after the merge?
    common_errors:
      - Preserving the old team boundaries so the overlap simply continues.

  - external_key: managerial.resources_budget.annual_hiring_plan
    competency_key: project_management
    topic: Sequencing an annual hiring plan
    difficulty: hard
    text: >-
      If you had approval for six hires over the next year, how would you decide which roles to hire first and
      how to time them against the roadmap?
    expected_concepts:
      - mapping roadmap needs to skills and timing
      - realistic time to hire and time to ramp up
      - hiring capacity of the team itself, including interviewers
      - onboarding capacity so hires are not all arriving at once
      - sequencing roles that unlock others, such as a senior before juniors
      - revisiting the plan as the roadmap changes
    rubric:
      excellent: Builds the plan backwards from roadmap needs, accounts realistically for hiring and ramp-up time, staggers arrivals to fit onboarding capacity, sequences enabling roles first and explains how the plan is revisited.
      good: Produces a sensible order of roles linked to the roadmap, but ignores hiring or onboarding lead times.
      weak: Plans to hire all six as fast as possible with no link to the roadmap or onboarding capacity.
    followups:
      - How long does a hire take to become fully productive on your team?
      - What would you do if the first two hires took twice as long as planned?
    common_errors:
      - Assuming a new hire is productive in the same quarter they are approved.

  - external_key: managerial.resources_budget.fair_assignment_of_visible_work
    competency_key: people_management
    topic: Assigning high-visibility work fairly
    difficulty: hard
    text: >-
      There's usually tension between giving important, high-visibility work to the person most likely to
      succeed and giving others the chance to grow. Tell me how you've handled that trade-off in a real
      assignment.
    expected_concepts:
      - weighing delivery risk against growth opportunity explicitly
      - support structures that make a stretch assignment safer
      - transparency about how assignments are decided
      - tracking who gets visible work over time to avoid favouritism
      - outcome for the work and the person
    rubric:
      excellent: Describes a specific assignment, weighs risk against growth explicitly, puts support in place for the stretch option, tracks fairness of assignments over time and reports the result for both work and person.
      good: Gives a thoughtful example with some support for growth, but no view of fairness over time.
      weak: Always gives important work to the same strongest people, or hands out stretch work with no support.
    followups:
      - How did you support the person who took the stretch assignment?
      - How do you check that visible work isn't always going to the same people?
    common_errors:
      - Treating growth assignments as a reward rather than a planned development step with support.
