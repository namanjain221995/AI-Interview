# Managerial round: agile practices and team process (part 4 of 4).
# Focus: flow and bottlenecks, quality under pressure, removing overhead and approval gates, outcome-based
# planning and assessing how teams work.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ overhead and team size
  - external_key: managerial.process_agile.meeting_load_watch
    competency_key: agile_delivery
    topic: Keeping an eye on meeting load
    difficulty: easy
    text: >-
      How do you keep track of how much of your team's week goes into meetings and ceremonies? Tell me about a
      time you did something about it.
    expected_concepts:
      - actually measuring time spent, for example from calendars
      - asking the team which meetings help them
      - shortening, combining or cancelling sessions
      - protecting focus time
    rubric:
      excellent: Describes how they measured meeting load on a real team, the specific changes made and the effect on focus time or delivery.
      good: Gives a real example of reducing meetings, without much measurement.
      weak: Has no sense of the team's meeting load or only ever adds meetings.
    followups:
      - Which meeting did you cut, and did anyone miss it?
      - How much focus time did the team gain?
    common_errors:
      - Judging meeting load by the leader's calendar rather than the engineers'.

  - external_key: managerial.process_agile.small_team_practices
    competency_key: agile_delivery
    topic: Right-sizing practices for a small team
    difficulty: easy
    text: >-
      If you were leading a team of only three or four engineers, which agile practices would you keep, and
      which would you shrink or drop? Tell me how you've handled that with a small team.
    expected_concepts:
      - keeping practices that give fast feedback and visibility
      - merging or shortening ceremonies
      - informal coordination where it works
      - keeping a lightweight retrospective habit
    rubric:
      excellent: Draws on a real small team, explains which practices were kept, merged or dropped and why, and how the team stayed coordinated and kept improving.
      good: Gives sensible choices with some real experience behind them.
      weak: Runs the full set of ceremonies regardless of team size, or drops everything including feedback loops.
    followups:
      - What did you lose by dropping that practice?
      - When would you add it back?
    common_errors:
      - Dropping retrospectives entirely because the team is small.

  - external_key: managerial.process_agile.useful_retro_signals
    competency_key: agile_delivery
    topic: Telling whether retrospectives are useful
    difficulty: easy
    text: >-
      What signals tell you a team's retrospectives are actually useful, and what have you changed when those
      signals were missing?
    expected_concepts:
      - actions completed and visible changes in how the team works
      - new topics rather than the same ones recurring
      - broad participation
      - the team asking for the session rather than tolerating it
      - a specific adjustment when signals were absent
    rubric:
      excellent: Names concrete, observable signals, and describes a real case where those signals were missing and the change they made.
      good: Names sensible signals with a general description of adjustments.
      weak: Judges retrospectives by attendance or whether they happen at all.
    followups:
      - How do you track whether retro actions led to change?
      - What did the team say when you asked about the sessions?
    common_errors:
      - Equating a pleasant session with a useful one.

  - external_key: managerial.process_agile.right_sized_documentation
    competency_key: communication
    topic: Deciding how much to document
    difficulty: easy
    text: >-
      How do you decide how much documentation your team writes for a feature or decision, so it's useful
      without turning into paperwork? Give me an example.
    expected_concepts:
      - who will read it and for what purpose
      - documenting decisions and reasons over restating code
      - lightweight formats such as short design notes or decision records
      - keeping documents near the code or work
    rubric:
      excellent: Ties the amount of documentation to its audience and purpose, gives a specific example and shows how it was kept current and used.
      good: Gives a sensible approach with a real example, but less on how documents stayed useful.
      weak: Documents nothing, or requires long templates for every change.
    followups:
      - What document did someone later find really valuable?
      - How do you stop documents going out of date?
    common_errors:
      - Writing documents that nobody is expected to read.

  - external_key: managerial.process_agile.board_accuracy_without_chasing
    competency_key: leadership
    topic: Keeping the board accurate without policing
    difficulty: easy
    text: >-
      How do you keep your team's board accurate enough to trust, without becoming the person who chases
      everyone to update their tickets?
    expected_concepts:
      - using the board in ceremonies so it matters to the team
      - keeping the workflow simple
      - automation from code and deploy tools
      - showing the team how the board's information is used
    rubric:
      excellent: Describes specific ways the board was made useful to the team itself, with automation and simplification, and how accuracy held without the leader chasing.
      good: Gives reasonable practices from a real team, but still relies partly on reminders.
      weak: Relies entirely on chasing people, or accepts an inaccurate board.
    followups:
      - What automation helped the most?
      - What did the team use the board for, apart from reporting?
    common_errors:
      - Treating the board as a reporting tool for managers rather than a working tool for the team.

  - external_key: managerial.process_agile.iteration_length_change
    competency_key: agile_delivery
    topic: Changing iteration length
    difficulty: easy
    text: >-
      Tell me about a time you changed the length of a team's iteration, or decided not to. What drove the
      decision, and what difference did it make?
    expected_concepts:
      - the problem the change was meant to solve
      - trade-off between feedback speed and planning overhead
      - involving the team and stakeholders
      - observed effect after the change
    rubric:
      excellent: Describes a specific decision, the problem behind it, the trade-offs weighed and the observed effect on planning, feedback or delivery.
      good: Describes a real decision with sensible reasoning, but limited observation of the effect.
      weak: Changed iteration length to hide missed commitments, or cannot explain the reasoning.
    followups:
      - What did stakeholders think about the change?
      - Would you make the same choice again?
    common_errors:
      - Lengthening iterations to fit more work rather than addressing why work did not finish.

  # ------------------------------------------------------------ flow and bottlenecks
  - external_key: managerial.process_agile.urgent_lane_discipline
    competency_key: agile_delivery
    topic: Handling different urgency levels in a flow
    difficulty: medium
    text: >-
      On a flow-based team, how have you handled work of different urgency, such as expedited fixes alongside
      normal features, without the urgent lane swallowing everything? Give me an example.
    expected_concepts:
      - clear rules for what qualifies as expedited
      - a limit on expedited items at any one time
      - who can authorise using the fast lane
      - tracking how much work goes through it
      - reviewing misuse with stakeholders
    rubric:
      excellent: Describes explicit criteria and limits for urgent work, who decides, how usage was tracked and a real case where they reined in overuse.
      good: Has a reasonable arrangement with a real example, but limits or tracking were informal.
      weak: Everything becomes urgent, or there is no way to handle genuine emergencies.
    followups:
      - What share of work ended up in the urgent lane?
      - Who did you have to push back on?
    common_errors:
      - Letting the urgent lane grow until it becomes the normal lane.

  - external_key: managerial.process_agile.finding_where_work_waits
    competency_key: agile_delivery
    topic: Finding where work gets stuck
    difficulty: medium
    text: >-
      Tell me about a time you found out where work was actually getting stuck in your team's flow. How did you
      find it, and what did you change?
    expected_concepts:
      - looking at time in each state or ageing items
      - distinguishing waiting time from working time
      - confirming the finding with the team
      - targeted change at the constraint
      - measured effect on cycle time
    rubric:
      excellent: Describes how they used data to find the stuck stage, confirmed the cause with the team, made a targeted change and measured the improvement.
      good: Found a real bottleneck and made a sensible change, but the diagnosis relied on impressions.
      weak: Assumed where the problem was, or improved a stage that was not the constraint.
    followups:
      - Was the bottleneck where you expected it to be?
      - Where did the bottleneck move next?
    common_errors:
      - Speeding up a step that was not limiting the overall flow.

  - external_key: managerial.process_agile.idea_to_customer_mapping
    competency_key: project_management
    topic: Mapping the path from idea to customer
    difficulty: medium
    text: >-
      Tell me about a time you mapped the full path a piece of work takes from idea to customer across several
      teams. What surprised you, and what did you change as a result?
    expected_concepts:
      - involving people from each stage
      - measuring waiting and hand-off time, not just work time
      - identifying the biggest delays and rework loops
      - choosing a small number of changes to target
      - re-measuring after changes
    rubric:
      excellent: Describes a real mapping exercise with people from each stage, specific findings about waiting and hand-offs, targeted changes and the measured effect on lead time.
      good: Describes a real mapping with useful findings, but changes or results were limited.
      weak: Mapped only their own team's part, or produced a diagram that led to no change.
    followups:
      - Where was most of the time spent waiting?
      - Who owned fixing the cross-team delays?
    common_errors:
      - Mapping the official process rather than how work actually flows.

  # ------------------------------------------------------------ quality, debt and gates
  - external_key: managerial.process_agile.debt_visible_to_business
    competency_key: stakeholder_management
    topic: Making technical debt visible to the business
    difficulty: medium
    text: >-
      How do you make technical debt visible to product and business stakeholders so it gets prioritised
      alongside features? Tell me about one item you got onto the plan that way.
    expected_concepts:
      - describing debt in terms of business impact such as speed, risk or incidents
      - evidence like slower delivery or defect rates in that area
      - putting debt items in the same backlog as features
      - agreeing a capacity share or tying debt to related features
      - showing the result after the work was done
    rubric:
      excellent: Explains how they translated a specific debt item into business terms with evidence, got it prioritised through the normal backlog and showed the benefit afterwards.
      good: Gives a real example of getting debt prioritised with reasonable framing.
      weak: Asks for time for refactoring without explaining the impact, or hides debt work inside estimates.
    followups:
      - What evidence persuaded the product owner?
      - How did you show the benefit after it was done?
    common_errors:
      - Describing debt in purely technical terms that stakeholders cannot weigh against features.

  - external_key: managerial.process_agile.corners_cut_under_pressure
    competency_key: leadership
    topic: Restoring quality standards under deadline pressure
    difficulty: hard
    text: >-
      Tell me about a time deadline pressure led your team to start cutting corners on testing or review. How
      did you notice, and how did you restore the standard without simply missing the deadline?
    expected_concepts:
      - signals such as rising defects or rubber-stamp reviews
      - naming the problem openly with the team
      - negotiating scope rather than quality with stakeholders
      - protecting the essential checks
      - follow-up to address the shortcuts already taken
    rubric:
      excellent: Describes specific signals, an open conversation with the team, a scope negotiation with stakeholders that protected quality, and how the shortcuts already taken were repaired.
      good: Restores standards in a real example with some scope trade-off, but follow-up on earlier shortcuts is missing.
      weak: Accepted the shortcuts as necessary, or enforced standards and let the deadline fail without negotiating.
    followups:
      - What scope did you give up?
      - How did you deal with the code that had already gone out?
    common_errors:
      - Treating quality as the variable to adjust when scope was the real option.

  - external_key: managerial.process_agile.lighter_approval_gate
    competency_key: stakeholder_management
    topic: Persuading another function to lighten an approval gate
    difficulty: hard
    text: >-
      Tell me about a time you persuaded people outside your team, such as security, architecture or operations,
      to replace a manual approval gate with something lighter. How did you address their concerns?
    expected_concepts:
      - understanding the risk the gate was protecting against
      - data on the gate's cost and its actual catch rate
      - proposing an alternative such as automated checks or guidelines with sampling
      - a trial with clear safeguards
      - building trust with the other function
    rubric:
      excellent: Starts from the other function's concerns, uses data on cost and effectiveness, proposes a credible lighter control with safeguards and describes how the trial went and how trust was built.
      good: Achieves a real change through reasonable arguments, though the other side's concerns were only partly addressed.
      weak: Bypassed the gate or argued only that it was slowing the team down.
    followups:
      - What did the gate actually catch, according to the data?
      - What safeguard did they insist on?
    common_errors:
      - Arguing from delivery speed alone without addressing the risk the gate managed.

  - external_key: managerial.process_agile.escalating_retro_issues
    competency_key: communication
    topic: Escalating problems the team cannot fix
    difficulty: medium
    text: >-
      When your team's retrospective identifies a problem that only someone above you can fix, how do you carry
      it upward and report back to the team? Give me a real example.
    expected_concepts:
      - framing the problem with evidence and impact
      - proposing options rather than just complaining
      - choosing the right person and forum
      - reporting the outcome back to the team
      - what the team does in the meantime
    rubric:
      excellent: Describes a specific escalation with evidence and options, the response from above and how they closed the loop with the team, including what they did while waiting.
      good: Escalates a real problem appropriately, but closing the loop with the team is weak.
      weak: The problem is never raised, or raised and then forgotten.
    followups:
      - What did you tell the team when the answer was no?
      - How long did it take to get a decision?
    common_errors:
      - Escalating without proposing what should be done about it.

  - external_key: managerial.process_agile.coaching_stakeholder_new_to_agile
    competency_key: mentoring
    topic: Helping a product or business partner work iteratively
    difficulty: medium
    text: >-
      Tell me about a time you helped a product manager or business stakeholder who was new to agile learn to
      work well with your team. What did you do, and what changed?
    expected_concepts:
      - understanding their goals and constraints
      - showing practices in action rather than lecturing
      - involving them in refinement and reviews
      - adapting team practices to meet their needs
      - observable change in how they worked with the team
    rubric:
      excellent: Describes a specific partner, a practical approach to helping them learn, adaptations made on both sides and clear changes in how they engaged with the team.
      good: Gives a real example of helping a partner with some improvement, but changes were modest.
      weak: Expects the partner to learn agile on their own, or describes training them on terminology.
    followups:
      - What did you change on your side to meet them halfway?
      - What did they find hardest about working this way?
    common_errors:
      - Expecting the partner to adopt the team's jargon instead of meeting their needs.

  - external_key: managerial.process_agile.agile_practice_gone_wrong
    competency_key: agile_delivery
    topic: An agile practice that went wrong
    difficulty: medium
    text: >-
      Which agile practices have you seen go wrong on teams you've worked with, and can you tell me about one you
      helped put right?
    expected_concepts:
      - a specific practice and how it had drifted from its purpose
      - the harm it was causing
      - how they diagnosed the drift
      - what they changed
      - result after the change
    rubric:
      excellent: Gives a specific practice that had drifted, explains the harm and cause, and describes a concrete fix and its result.
      good: Gives a real practice and a reasonable fix, with less detail on the result.
      weak: Lists general criticisms of agile with no example of fixing anything.
    followups:
      - Why do you think it drifted in the first place?
      - What would you watch for to stop it happening again?
    common_errors:
      - Criticising the framework rather than how it was being used.

  - external_key: managerial.process_agile.incidents_eat_the_sprint
    competency_key: agile_delivery
    topic: When incidents consume a sprint
    difficulty: medium
    text: >-
      When a run of production incidents eats into a sprint, how do you handle the planned work and the
      conversation with stakeholders? Tell me about a specific sprint where that happened.
    expected_concepts:
      - quickly reassessing the sprint goal
      - telling stakeholders early what will slip
      - protecting time for incident follow-up actions
      - reviewing whether reliability work needs a bigger share of capacity
    rubric:
      excellent: Describes a specific sprint, how the plan was reshaped, early stakeholder communication and how the incidents led to a change in how capacity was allocated.
      good: Handles the sprint and communication reasonably, but does not address the underlying reliability load.
      weak: Lets the sprint quietly fail, or skips incident follow-up to catch up on features.
    followups:
      - What did you tell stakeholders, and when?
      - Did the incidents change your next planning?
    common_errors:
      - Dropping incident follow-up work to recover feature progress.

  - external_key: managerial.process_agile.team_scope_boundaries
    competency_key: leadership
    topic: Agreeing what the team owns
    difficulty: medium
    text: >-
      How have you helped a team agree what it owns and what it doesn't, so it can say no to work outside its
      scope? Tell me how that played out.
    expected_concepts:
      - writing down the team's mission and ownership
      - agreeing boundaries with neighbouring teams and leadership
      - a consistent way to redirect out-of-scope requests
      - revisiting boundaries as the organisation changes
    rubric:
      excellent: Describes how ownership was defined and agreed with neighbours and leadership, a real out-of-scope request that was redirected and how boundaries were revisited.
      good: Gives a real example of clarifying ownership, with some evidence of it being used.
      weak: The team accepts any request, or refuses work without agreed boundaries.
    followups:
      - Tell me about a request you turned away and how it was received.
      - What was the hardest boundary to agree?
    common_errors:
      - Defining scope inside the team without agreeing it with the teams around it.

  - external_key: managerial.process_agile.leftover_process_audit
    competency_key: leadership
    topic: Auditing and removing leftover process
    difficulty: hard
    text: >-
      Over time, teams accumulate process steps that nobody remembers the reason for. Tell me about how you've
      audited a team's or an organisation's process to find that leftover overhead, and how you got agreement to
      remove it.
    expected_concepts:
      - listing every recurring step, meeting and approval
      - tracing each one to its original purpose
      - estimating the cost of each step
      - consulting the owners and dependents of each step
      - removing in stages and watching for side effects
    rubric:
      excellent: Describes a systematic audit, tracing purposes and costs, consulting the people involved, removing steps in stages with monitoring, and gives specific results.
      good: Removes real overhead with reasonable consultation, but the audit was informal.
      weak: Removes steps by preference without understanding them, or never challenges existing process.
    followups:
      - Which step turned out to be protecting something important?
      - How much time did the team get back?
    common_errors:
      - Removing several steps at once so it is impossible to tell which removal caused a later problem.

  - external_key: managerial.process_agile.pairing_trial
    competency_key: collaboration
    topic: Trying pairing or group programming
    difficulty: medium
    text: >-
      Tell me about introducing pair programming or group programming sessions as part of how a team works. Why
      did you try it, and how did you judge whether to keep it?
    expected_concepts:
      - the problem it was meant to address, such as knowledge silos or review delays
      - how sessions were structured
      - letting people opt in or adjust the format
      - signals used to evaluate it
      - final decision and reasoning
    rubric:
      excellent: Ties the practice to a specific problem, describes how it was run and adapted, and explains the evidence behind the decision to keep, change or drop it.
      good: Describes a real trial with some evaluation, though the decision rested mainly on impressions.
      weak: Mandated it for everyone without a clear reason or review.
    followups:
      - Who found it least useful, and what did you change for them?
      - What happened to review times?
    common_errors:
      - Requiring pairing on all work regardless of whether the task benefits.

  - external_key: managerial.process_agile.data_in_retros_not_people
    competency_key: agile_delivery
    topic: Bringing data into retrospectives safely
    difficulty: medium
    text: >-
      How do you bring data such as cycle times, escaped defects or interruption counts into a retrospective,
      without the discussion turning into a review of individual performance? Give me an example.
    expected_concepts:
      - team-level aggregation rather than per-person figures
      - using data to prompt questions rather than conclusions
      - letting the team interpret the data
      - choosing a small number of relevant measures
      - an example where data changed the discussion
    rubric:
      excellent: Describes specific team-level data used in a real retrospective, how it was framed to prompt discussion and an insight or action that came from it.
      good: Uses team data in a real retro with sensible framing, but the effect on outcomes is unclear.
      weak: Shows per-person numbers, or never uses data in retrospectives.
    followups:
      - What did the data show that people hadn't noticed?
      - How did you handle a chart that pointed at one person's work?
    common_errors:
      - Presenting individual-level metrics that make the session feel like an appraisal.

  - external_key: managerial.process_agile.release_and_iteration_rhythm
    competency_key: project_management
    topic: Aligning iteration rhythm with release cadence
    difficulty: medium
    text: >-
      How have you aligned your team's iteration rhythm with how often you actually release to customers? Tell
      me about a time those two were out of step and what you did.
    expected_concepts:
      - recognising when finished work sat waiting for a release
      - separating deployment from release, for example with feature flags
      - working with release or operations owners
      - shortening feedback from customers
      - effect on lead time
    rubric:
      excellent: Describes a specific mismatch, how they worked with the people involved to change the release approach, and the measured effect on how quickly customers got changes.
      good: Recognises and addresses a real mismatch, with partial improvement.
      weak: Treats sprint completion as the finish line regardless of when customers see the change.
    followups:
      - How long did finished work wait before customers saw it?
      - Who did you have to convince?
    common_errors:
      - Counting work as done at the end of the sprint when customers will not see it for weeks.

  - external_key: managerial.process_agile.mixed_phase_program
    competency_key: project_management
    topic: Mixing phased and iterative work in one program
    difficulty: hard
    text: >-
      Tell me about a program where some parts had to be planned in fixed phases, such as hardware, legal review
      or a partner integration, while other parts were delivered iteratively. How did you plan and track across
      both?
    expected_concepts:
      - identifying the fixed milestones and their lead times
      - planning iterative work to meet those milestones
      - a single view of progress across both styles
      - early integration or testing with the fixed-phase parts
      - managing risk at the points where the two met
    rubric:
      excellent: Describes a real program, how fixed milestones were integrated into iterative planning, a shared tracking view and how risk at the integration points was managed, with outcomes.
      good: Describes a workable approach for a real program, but integration risks were handled late.
      weak: Forces everything into one style regardless of constraints, or tracks the two parts separately with no joint view.
    followups:
      - Where did the two styles clash most?
      - How did you test against the fixed-phase parts early?
    common_errors:
      - Discovering mismatches only when the phased work is delivered at the end.

  - external_key: managerial.process_agile.outcome_based_planning
    competency_key: project_management
    topic: Shifting planning from features to outcomes
    difficulty: hard
    text: >-
      Tell me about a time you shifted a team's planning from shipping a list of features toward achieving a
      measurable outcome. How did planning and review change, and what was hard about it?
    expected_concepts:
      - defining a measurable outcome with product partners
      - generating options to reach it rather than a fixed list
      - reviewing progress against the outcome measure
      - changing course based on results
      - challenges such as stakeholder expectations or slow measures
    rubric:
      excellent: Describes a specific outcome and how it replaced a feature list, how planning and reviews changed, a course change driven by results and the real difficulties encountered.
      good: Describes a real shift with sensible changes, but the outcome measure or course correction is weak.
      weak: Relabels a feature list as outcomes without changing how decisions are made.
    followups:
      - What did you stop building because the measure didn't move?
      - How did you handle stakeholders who still wanted feature dates?
    common_errors:
      - Choosing an outcome measure that takes too long to move to guide decisions.

  - external_key: managerial.process_agile.impediment_beyond_team
    competency_key: agile_delivery
    topic: Removing an impediment outside the team
    difficulty: medium
    text: >-
      Tell me about an impediment your team couldn't remove on its own, such as a slow approval or a dependency
      on another department. How did you get it resolved, and how long did it take?
    expected_concepts:
      - quantifying the impediment's cost to the team
      - finding the person or group who could change it
      - proposing a concrete fix that worked for both sides
      - interim workarounds
      - following through until resolved
    rubric:
      excellent: Describes a specific external impediment, the evidence of its cost, how they found the right decision-maker, the fix agreed and how persistently they followed it through.
      good: Resolves a real impediment through reasonable escalation, with less evidence or follow-through.
      weak: Accepts the impediment as unchangeable, or only complains about it.
    followups:
      - What did the other department get out of the change?
      - What did the team do while waiting?
    common_errors:
      - Raising the impediment once and then accepting it when nothing happens.

  - external_key: managerial.process_agile.assessing_several_teams
    competency_key: agile_delivery
    topic: Assessing how several teams work
    difficulty: hard
    text: >-
      If you were asked to assess how well five teams in a department are working, in terms of delivery and
      process, how would you go about it without it feeling like an audit, and what would you look for?
    expected_concepts:
      - agreeing the purpose with leadership and teams up front
      - combining flow data with conversations and observation
      - looking at outcomes, predictability, quality and dependencies
      - comparing teams to their own past rather than each other
      - sharing findings with each team first
    rubric:
      excellent: Describes a respectful, transparent approach combining data and observation, sensible dimensions to look at, avoids ranking teams against each other and explains how findings lead to team-owned improvements.
      good: Has a reasonable plan with sensible dimensions, but less attention to how teams experience the assessment.
      weak: Proposes a checklist scored by an outsider, or ranks teams on velocity.
    followups:
      - What would you share with leadership versus with each team?
      - Tell me about a time you did something like this.
    common_errors:
      - Comparing teams on measures that only make sense within a single team.
