# Curated questions: managerial round, hiring and interviewing (part 3: onboarding new hires and
# their first months). Evaluation is based only on the substance of the answer (approach, actions,
# results, reflection), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: managerial.hiring.first_week_design
    competency_key: mentoring
    topic: Designing a new hire's first week
    difficulty: easy
    text: >-
      What does a new team member's first week look like on your team, and why did you set it up that way?
    expected_concepts:
      - a planned schedule rather than ad hoc activities
      - meeting key people and understanding the team's purpose
      - working environment set up and a small first change
      - regular check-ins with the manager or lead
    rubric:
      excellent: Describes a deliberate first week with specific activities, explains the purpose of each and how they know it is working from new joiners' feedback.
      good: Gives a reasonable outline of the first week with some structure.
      weak: Has no plan and expects the new person to find their own way.
    followups:
      - What did a recent joiner say about their first week?
      - What would you drop if the week had to be shorter?
    common_errors:
      - Filling the first week only with reading documentation.

  - external_key: managerial.hiring.onboarding_buddy
    competency_key: mentoring
    topic: Choosing and preparing an onboarding buddy
    difficulty: easy
    text: >-
      How do you pick an onboarding buddy for a new hire, and what do you ask that buddy to actually do?
    expected_concepts:
      - choosing someone with relevant context and the time to help
      - clear expectations for the buddy role
      - reducing the buddy's other workload
      - recognising the buddy's contribution
    rubric:
      excellent: Explains selection criteria, gives the buddy clear responsibilities and time, and describes how buddy support is checked and recognised.
      good: Assigns a buddy with some guidance on what to do.
      weak: Names a buddy with no guidance and no time set aside.
    followups:
      - What happens if the buddy is too busy to help?
      - How has being a buddy helped the person doing it?
    common_errors:
      - Choosing the busiest expert as buddy with no change to their workload.

  - external_key: managerial.hiring.first_task_choice
    competency_key: mentoring
    topic: Choosing a new hire's first real piece of work
    difficulty: easy
    text: >-
      How do you choose the first real piece of work for someone who has just joined your team?
    expected_concepts:
      - small, well-scoped and genuinely useful
      - touches the main parts of the delivery process
      - support readily available
      - a quick, visible win
    rubric:
      excellent: Describes criteria for a first task that is small, useful and exercises the full path to production, with an example and how the person was supported.
      good: Picks a small, well-defined task with reasons.
      weak: Gives a task without thought, such as a large vague feature or only reading code.
    followups:
      - What was the first task for your most recent hire?
      - How long did it take them to complete it?
    common_errors:
      - Giving busywork that doesn't touch real systems.

  - external_key: managerial.hiring.before_day_one
    competency_key: project_management
    topic: Preparing before a new hire's first day
    difficulty: easy
    text: >-
      What do you put in place before a new hire's first day so they aren't stuck waiting for
      access, equipment or information?
    expected_concepts:
      - accounts, access and equipment requested in advance
      - a written onboarding plan and schedule
      - buddy and key meetings arranged
      - pre-start contact so they know what to expect
    rubric:
      excellent: Gives a concrete checklist with owners and lead times, explains how they confirm it is done and how they keep contact with the new hire before they start.
      good: Lists most of the preparation needed.
      weak: Starts arranging access and equipment on the first day.
    followups:
      - What has gone wrong with preparation in the past?
      - Who owns the checklist on your team?
    common_errors:
      - Not allowing for long lead times on production access.

  - external_key: managerial.hiring.early_one_on_ones
    competency_key: communication
    topic: One-on-ones in a new hire's first month
    difficulty: easy
    text: >-
      How do you run your one-on-ones with someone in their first month, and how is that different from
      later on?
    expected_concepts:
      - more frequent check-ins early
      - asking what's unclear or blocking them
      - setting and revisiting short-term expectations
      - inviting feedback about the team and onboarding
    rubric:
      excellent: Describes a deliberate early cadence and agenda focused on blockers, expectations and feedback, and explains how it shifts as the person settles in.
      good: Mentions meeting more often and checking on progress.
      weak: Treats early one-on-ones the same as any others or skips them.
    followups:
      - What question do you find most useful in those early meetings?
      - When do you move to a normal cadence?
    common_errors:
      - Using early one-on-ones only for status updates.

  - external_key: managerial.hiring.sharing_team_history
    competency_key: communication
    topic: Helping new people understand why things are the way they are
    difficulty: easy
    text: >-
      How do you help a new person understand why your team's systems and decisions are the way they are,
      not just how they work?
    expected_concepts:
      - architecture overviews with history and trade-offs
      - decision records or design documents
      - sessions with people who made key decisions
      - encouraging questions about current choices
    rubric:
      excellent: Describes specific ways of sharing context such as decision records and walkthroughs with the people involved, and explains how this helps new hires make good decisions sooner.
      good: Mentions documentation and conversations that explain past decisions.
      weak: Expects new hires to pick up context gradually without support.
    followups:
      - How do you keep decision records useful over time?
      - What decision do new joiners question most often on your team?
    common_errors:
      - Presenting current systems as fixed rules rather than past trade-offs.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.hiring.first_three_months
    competency_key: project_management
    topic: Setting expectations for the first three months
    difficulty: medium
    text: >-
      Tell me about how you set expectations for a new hire's first three months. What did you write down,
      and how did you check progress along the way?
    expected_concepts:
      - written goals for thirty, sixty and ninety days or similar milestones
      - goals tied to the role's expectations
      - regular reviews of progress
      - adjusting the plan based on what's learned
    rubric:
      excellent: Describes a written, milestone-based plan tied to role expectations, regular progress reviews and an example of adjusting the plan for a specific person.
      good: Sets clear early goals and checks in on them.
      weak: Has only informal expectations that aren't written or reviewed.
    followups:
      - What did you do when someone was behind on a milestone?
      - Did the new hire help write the plan?
    common_errors:
      - Setting goals so vague that progress can't be judged.

  - external_key: managerial.hiring.remote_onboarding
    competency_key: communication
    topic: Onboarding someone who works remotely
    difficulty: medium
    text: >-
      How have you onboarded someone who works remotely, or in a different time zone from most of the team?
    expected_concepts:
      - deliberate scheduling of overlap hours
      - written documentation and recorded walkthroughs
      - structured pairing sessions
      - extra effort to build working relationships
      - clear channels for asking questions
    rubric:
      excellent: Describes specific adjustments such as overlap planning, pairing, written context and relationship-building, with an example and how they checked it worked.
      good: Mentions video calls, documentation and regular check-ins.
      weak: Onboards remote hires the same way as in-person ones and hopes for the best.
    followups:
      - How did you know the remote hire felt included in decisions?
      - What would you do differently next time?
    common_errors:
      - Relying on informal conversations that remote people miss.

  - external_key: managerial.hiring.senior_hire_onboarding
    competency_key: leadership
    topic: Onboarding an experienced engineer or tech lead
    difficulty: medium
    text: >-
      How is onboarding a senior engineer or a new tech lead different from onboarding someone earlier in
      their career?
    expected_concepts:
      - emphasis on context, stakeholders and history of decisions
      - early relationship-building across teams
      - time to learn before making big changes
      - clear scope of authority and expectations
    rubric:
      excellent: Explains specific differences such as stakeholder introductions, decision history and agreed scope, and the risk of senior hires changing too much too early, with an example.
      good: Recognises that senior hires need more context and relationships.
      weak: Treats all onboarding the same regardless of level.
    followups:
      - How long should a new tech lead observe before proposing changes?
      - Who would you introduce them to first?
    common_errors:
      - Expecting senior hires to need no onboarding at all.

  - external_key: managerial.hiring.new_manager_trust
    competency_key: people_management
    topic: Helping a newly hired manager establish themselves
    difficulty: medium
    text: >-
      If you brought in a new manager to lead one of your teams, how would you help them earn the team's
      trust in their first couple of months?
    expected_concepts:
      - introducing them with context and clear expectations
      - encouraging listening tours and one-on-ones with each person
      - sharing team history and open issues
      - avoiding undermining their authority
      - regular check-ins on how they're settling in
    rubric:
      excellent: Describes a structured handover, encourages listening first, gives the new manager authority while providing support and explains how they'd notice and address early problems.
      good: Provides context and support for the new manager.
      weak: Hands over the team without context or keeps making decisions for them.
    followups:
      - What would you do if team members came to you instead of their new manager?
      - How would you share feedback about them during this period?
    common_errors:
      - Continuing to manage the team directly and bypassing the new manager.

  - external_key: managerial.hiring.onboarding_from_feedback
    competency_key: mentoring
    topic: Improving onboarding from new joiners' feedback
    difficulty: medium
    text: >-
      Tell me about a change you made to your team's onboarding because of what recent hires told you or
      what you saw them struggle with.
    expected_concepts:
      - collecting feedback at set points in the first months
      - identifying a specific recurring issue
      - a concrete change and who owned it
      - checking that the change helped later joiners
    rubric:
      excellent: Gives a specific example of feedback, the change made, who owned it and evidence that later hires had a better experience.
      good: Describes a reasonable change based on feedback.
      weak: Collects no feedback or collects it but makes no changes.
    followups:
      - How do you ask for feedback so new hires feel able to be critical?
      - Who maintains the onboarding material now?
    common_errors:
      - Asking for feedback only once at the end of the first week.

  - external_key: managerial.hiring.early_struggles
    competency_key: people_management
    topic: A new hire struggling early on
    difficulty: medium
    text: >-
      A new hire is about six weeks in and seems to be struggling more than you expected. How do you work
      out what's going on, and what do you do about it?
    expected_concepts:
      - talking with them early and directly
      - checking whether onboarding gave them what they needed
      - separating skill gaps from unclear expectations or context gaps
      - a specific support plan with check-ins
      - documenting progress fairly
    rubric:
      excellent: Starts with a direct conversation, examines onboarding and expectation gaps as possible causes, agrees on a specific support plan and tracks progress fairly.
      good: Talks to the person and offers additional support.
      weak: Waits to see if things improve or quickly concludes the hire was a mistake.
    followups:
      - How would you tell an onboarding gap from a skills gap?
      - What would you do if things hadn't improved after another month?
    common_errors:
      - Judging the person before checking whether the team set them up to succeed.

  - external_key: managerial.hiring.building_relationships
    competency_key: collaboration
    topic: Helping new hires build working relationships
    difficulty: medium
    text: >-
      How do you help a new person build working relationships with the rest of your team and with the
      neighbouring teams they'll depend on?
    expected_concepts:
      - planned introductions with context on each person's role
      - pairing and shared work across teammates
      - inclusion in cross-team meetings early
      - giving them a reason to collaborate, such as a joint task
    rubric:
      excellent: Describes deliberate steps such as targeted introductions, pairing rotations and early cross-team work, with an example of how it helped someone become effective.
      good: Arranges introductions and some pairing.
      weak: Leaves relationship-building entirely to the new person.
    followups:
      - Which relationship did a recent hire need most, and how did you help?
      - How do you include someone who works differently from the rest of the team?
    common_errors:
      - Introducing people without explaining why the relationship matters.

  - external_key: managerial.hiring.cohort_onboarding
    competency_key: project_management
    topic: Onboarding several people at once
    difficulty: medium
    text: >-
      Five people are joining your team in the same month. How would you onboard them without bringing the
      existing team's work to a halt?
    expected_concepts:
      - shared group sessions for common material
      - staggered start dates where possible
      - spreading buddy responsibilities
      - adjusting delivery plans for reduced capacity
      - a starter backlog of well-scoped tasks
    rubric:
      excellent: Plans group sessions, buddy distribution, a prepared starter backlog and adjusted delivery commitments, and explains how they would monitor load on the existing team.
      good: Uses group sessions and spreads mentoring load.
      weak: Onboards each person individually with no plan for team capacity.
    followups:
      - How would you tell stakeholders about the temporary slowdown?
      - What would you prepare in the weeks before they arrive?
    common_errors:
      - Assigning all new joiners to the same overloaded mentor.

  - external_key: managerial.hiring.new_eyes_feedback
    competency_key: leadership
    topic: Using a new hire's fresh perspective
    difficulty: medium
    text: >-
      How do you make use of a new hire's fresh perspective on your team's practices, without either
      overwhelming them or brushing off what they notice?
    expected_concepts:
      - inviting them to record observations early
      - reviewing observations together after some context is gained
      - acting on some suggestions visibly
      - explaining the reasons behind practices that stay
    rubric:
      excellent: Describes a deliberate way to capture early observations, revisit them with context and act on some, with an example of a change that came from a new hire.
      good: Encourages new hires to share ideas and listens to them.
      weak: Expects new hires to adopt existing practices without question.
    followups:
      - What's a change that came from a new joiner's observation?
      - How do you explain why a suggestion won't be adopted?
    common_errors:
      - Asking for ideas and then never following up on them.

  - external_key: managerial.hiring.on_call_readiness
    competency_key: mentoring
    topic: Preparing a new hire for on-call or production duties
    difficulty: medium
    text: >-
      How do you prepare a new team member to take on on-call or production responsibilities safely?
    expected_concepts:
      - runbooks and system overviews
      - shadowing and reverse shadowing on-call shifts
      - practice through incident drills or game days
      - clear escalation paths and backup
      - agreed criteria for being ready
    rubric:
      excellent: Describes a staged path with shadowing, practice incidents, runbooks and clear escalation, plus explicit readiness criteria agreed with the person.
      good: Mentions shadowing and documentation before going on call.
      weak: Adds new hires to the rotation with no preparation.
    followups:
      - How long does it usually take before someone joins the rotation?
      - What would you do if they felt they weren't ready?
    common_errors:
      - Putting new hires on call alone before they know the escalation path.

  - external_key: managerial.hiring.supporting_early_career_hire
    competency_key: mentoring
    topic: Supporting an early-career hire's first months
    difficulty: medium
    text: >-
      Tell me about how you supported someone early in their career through their first few months on your
      team. What made the biggest difference?
    expected_concepts:
      - structured mentoring and regular feedback
      - gradually increasing scope of work
      - building good engineering habits such as testing and code review
      - specific progress made by the person
    rubric:
      excellent: Gives a specific example with the support structure used, how scope increased over time and the measurable progress the person made, reflecting on what mattered most.
      good: Describes mentoring and some resulting growth.
      weak: Gives a generic description without a real example or outcome.
    followups:
      - What would you do differently next time?
      - How did you give feedback on their code?
    common_errors:
      - Protecting new people from real work for too long.

  - external_key: managerial.hiring.role_expectation_mismatch
    competency_key: communication
    topic: When the job differs from what was described in hiring
    difficulty: medium
    text: >-
      A new hire tells you the job is quite different from what they understood during the interviews. How
      would you handle that conversation, and what would you look into afterwards?
    expected_concepts:
      - listening to understand the specific gaps
      - clarifying which differences are temporary or permanent
      - adjusting the role or plan where possible
      - reviewing how the role was described in hiring
      - following up regularly
    rubric:
      excellent: Listens to identify specific gaps, responds openly about what can and cannot change, adjusts where possible and fixes how the role is described in future hiring.
      good: Has the conversation and tries to address the gaps.
      weak: Dismisses the concern or blames the recruiter without acting.
    followups:
      - What would you change in your interview process as a result?
      - What if the gap can't be closed?
    common_errors:
      - Treating it as the new hire's misunderstanding without checking how the role was presented.

  # ------------------------------------------------------------------ hard
  - external_key: managerial.hiring.legacy_system_ramp_up
    competency_key: leadership
    topic: Speeding up ramp-up on a hard legacy system
    difficulty: hard
    text: >-
      Your team owns a large, poorly documented legacy system, and new hires take many months to become
      productive. What would you change, and how would you decide where to invest first?
    expected_concepts:
      - measuring current time to productivity and where people get stuck
      - prioritising the most-touched or riskiest areas for documentation
      - guided learning paths and pairing on real changes
      - tooling such as local environments and tests to make changes safer
      - tracking improvement for later hires
    rubric:
      excellent: Diagnoses where new hires get stuck, prioritises investments by impact, combines documentation, pairing and tooling improvements and measures improvement on the next hires.
      good: Proposes documentation and mentoring improvements with some prioritisation.
      weak: Accepts the long ramp-up as inevitable or proposes rewriting the system.
    followups:
      - How would you get time for this from the roadmap?
      - What would you measure to know it worked?
    common_errors:
      - Writing extensive documentation that nobody keeps current.

  - external_key: managerial.hiring.early_fit_decision
    competency_key: people_management
    topic: Deciding fairly whether a new hire will work out
    difficulty: hard
    text: >-
      Tell me about a time you had to decide whether a new hire was going to work out in the role. How did
      you make sure the decision was fair to them?
    expected_concepts:
      - clear, documented expectations set early
      - specific, timely feedback with examples
      - support and time to improve
      - decision based on job-related evidence
      - involving HR or peers to check fairness
    rubric:
      excellent: Describes clear expectations, documented specific feedback, real support and a decision based on job-related evidence with fairness checks, reflecting on the outcome.
      good: Gave feedback and support before making a decision.
      weak: Decided suddenly without feedback, or avoided the decision for too long.
    followups:
      - What did you learn about your onboarding from this case?
      - How did you communicate the outcome?
    common_errors:
      - Basing the decision on impressions rather than documented evidence.

  - external_key: managerial.hiring.acquired_team_integration
    competency_key: leadership
    topic: Bringing an acquired team into your group
    difficulty: hard
    text: >-
      Your company acquires a small engineering team, and they're joining your group. How would you
      approach bringing them in so they become productive without losing what made them effective?
    expected_concepts:
      - understanding their practices, strengths and concerns first
      - clarity on roles, reporting lines and expectations
      - deciding which practices to align and which to keep
      - pairing and shared projects to build relationships
      - regular feedback and retention risks
    rubric:
      excellent: Starts with listening, makes roles and expectations clear quickly, deliberately decides what to align versus preserve and builds cross-team relationships, with attention to retaining key people.
      good: Plans integration with clear roles and some respect for existing practices.
      weak: Forces immediate adoption of all existing processes without understanding the team.
    followups:
      - Which of their practices would you be most likely to keep?
      - How would you spot that key people were thinking of leaving?
    common_errors:
      - Treating the acquired team as new hires with no expertise to contribute.

  - external_key: managerial.hiring.new_lead_and_informal_leader
    competency_key: leadership
    topic: Introducing a hired lead where someone led informally
    difficulty: hard
    text: >-
      You hire an experienced tech lead into a team where a long-standing engineer had been leading
      informally. How would you set both of them up to succeed?
    expected_concepts:
      - talking to the existing engineer before the hire is announced
      - explaining the reasoning and their own growth path
      - clear division of responsibilities
      - encouraging the new lead to learn from the existing engineer
      - regular check-ins with both
    rubric:
      excellent: Addresses the existing engineer's position early and directly, defines clear roles for both, builds a working relationship between them and follows up to resolve friction.
      good: Communicates with both people and defines roles.
      weak: Announces the new lead without preparing the existing engineer.
    followups:
      - What if the existing engineer had applied for the role?
      - How would you handle disagreements between them in the first months?
    common_errors:
      - Avoiding the conversation with the informal leader until after the new lead starts.

  - external_key: managerial.hiring.onboarding_during_crunch
    competency_key: project_management
    topic: Onboarding someone in the middle of a crunch
    difficulty: hard
    text: >-
      A new hire joins just as your team is in a crunch before a major release. How do you onboard them
      without either neglecting them or slowing the release down?
    expected_concepts:
      - realistic expectations communicated to the new hire
      - protected minimum onboarding time
      - well-scoped tasks that help the release without critical-path risk
      - a buddy outside the most critical release work
      - a fuller onboarding plan after the release
    rubric:
      excellent: Sets clear expectations with the new hire, protects essential onboarding, finds useful low-risk work and plans a proper onboarding after the release, explaining the trade-offs.
      good: Balances some onboarding with release work.
      weak: Either leaves the new hire alone until the release is over or throws them onto critical-path work.
    followups:
      - What would you tell the new hire on day one?
      - What kind of task would you give them?
    common_errors:
      - Putting a new hire on critical-path release work before they know the system.

  - external_key: managerial.hiring.first_year_attrition
    competency_key: people_management
    topic: People leaving within their first year
    difficulty: hard
    text: >-
      Several people who joined in the last year have left within their first twelve months. How would you
      investigate, and what might you change in hiring or onboarding?
    expected_concepts:
      - exit and stay conversations to gather reasons
      - looking for patterns across hiring, onboarding and the role itself
      - checking how roles were described during hiring
      - manager and team factors
      - targeted changes and tracking early retention
    rubric:
      excellent: Gathers evidence from leavers and current recent hires, looks for patterns across the whole journey, makes specific changes and tracks early retention afterwards.
      good: Investigates reasons for leaving and proposes changes.
      weak: Assumes it was about pay or the individuals and changes nothing.
    followups:
      - What would you ask in a stay conversation with someone who joined recently?
      - How would you know your changes worked?
    common_errors:
      - Looking only at onboarding when the cause may be the role description or management.

  - external_key: managerial.hiring.new_location_first_hires
    competency_key: leadership
    topic: First hires in a new location
    difficulty: hard
    text: >-
      You're hiring the first engineers in a new office several time zones away from the rest of the team.
      How would you set them up so they don't become a disconnected satellite?
    expected_concepts:
      - giving them clear ownership of meaningful work
      - travel or in-person time early to build relationships
      - rotating meeting times and written decision-making
      - a local lead or senior anchor hire
      - checking regularly for signs of isolation
    rubric:
      excellent: Plans meaningful ownership, early relationship-building, inclusive communication practices and local leadership, and describes how they'd detect and address isolation.
      good: Considers time zones and communication practices for the new group.
      weak: Treats the new location as extra capacity that receives tasks from the main team.
    followups:
      - Who would you hire first in that location, and why?
      - How would decisions be made across the time zones?
    common_errors:
      - Giving the remote group only overflow or maintenance work.
