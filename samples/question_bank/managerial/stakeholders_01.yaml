# Curated questions: managerial round, stakeholder management (part 1 of 4). Saying no, negotiating
# priorities and scope, setting and resetting expectations, escalation and status reporting.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  - external_key: managerial.stakeholders.say_no_senior_request
    competency_key: stakeholder_management
    topic: Saying no to a senior leader's request
    difficulty: medium
    text: >-
      Tell me about a time a senior leader asked your team to take on something you believed you shouldn't. How
      did you say no, and what happened to the working relationship afterwards?
    expected_concepts:
      - understanding the need behind the request before answering
      - grounding the no in current commitments and their trade-offs
      - offering an alternative, a later slot or a smaller version
      - following up to keep the relationship working
      - the actual outcome of the request
    rubric:
      excellent: Gives a specific example where they explored the underlying need, explained the trade-off against existing commitments, offered a realistic alternative and describes how the relationship held up afterwards.
      good: Clear example of declining with reasons and some alternative, but little on the follow-through.
      weak: Either always says yes, or describes a flat refusal with no reasoning, alternative or follow-up.
    followups:
      - What did that leader actually need, as opposed to what they asked for?
      - Looking back, was declining the right call?
    common_errors:
      - Framing the no as purely about the team being busy, without the trade-off.
      - Describing a refusal that was later overruled without explaining what they learned.

  - external_key: managerial.stakeholders.kickoff_expectations
    competency_key: project_management
    topic: Setting expectations at project kickoff
    difficulty: easy
    text: >-
      When you start a new project with a group of stakeholders, what do you do in the first couple of weeks to
      agree on what success looks like and how you'll keep everyone updated?
    expected_concepts:
      - agreed goals and measurable success criteria
      - explicit scope and non-goals
      - roles and decision rights
      - communication cadence and channels
      - known risks and assumptions written down
    rubric:
      excellent: Describes a concrete kickoff routine covering success criteria, non-goals, decision owners, update cadence and early risks, with an example of how it prevented a later misunderstanding.
      good: Covers goals and communication cadence with a reasonable example.
      weak: Starts building immediately and relies on ad hoc updates, with no shared definition of success.
    followups:
      - How do you capture non-goals so they stick?
      - Who signs off on the success criteria?
    common_errors:
      - Treating a kickoff meeting as a presentation rather than an agreement.

  - external_key: managerial.stakeholders.stakeholder_mapping
    competency_key: stakeholder_management
    topic: Identifying who the stakeholders really are
    difficulty: easy
    text: >-
      Walk me through how you work out who the stakeholders on a project actually are, including the ones who
      won't come to the kickoff but could still block you later.
    expected_concepts:
      - listing groups affected by or able to influence the outcome
      - mapping influence and interest to decide engagement level
      - looking for hidden approvers such as security, legal, finance or operations
      - asking existing stakeholders who else should be involved
      - revisiting the map as the project changes
    rubric:
      excellent: Describes a deliberate mapping approach, names easily missed groups such as security or operations, and adjusts how much each group is involved based on influence and impact.
      good: Lists the obvious stakeholders and some way of deciding how to engage them.
      weak: Only considers the person who made the request and the immediate team.
    followups:
      - Tell me about a stakeholder you missed. How did you find out?
      - How does the map change how you communicate with each group?
    common_errors:
      - Assuming the requester speaks for every affected group.

  - external_key: managerial.stakeholders.two_directors_one_slot
    competency_key: stakeholder_management
    topic: Two leaders each claiming top priority
    difficulty: hard
    text: >-
      Two directors each believe their request is your team's top priority for the quarter, and you only have
      capacity for one. Walk me through how you handled a situation like that, including who made the final call.
    expected_concepts:
      - clarifying each request's business impact and urgency
      - making the capacity constraint and trade-off visible to both
      - getting both in the same conversation rather than negotiating separately
      - escalating to a shared decision-maker when they cannot agree
      - communicating the decision and what the other request gets instead
    rubric:
      excellent: Shows they made the trade-off explicit with impact data, brought both parties together, involved the right decision-maker rather than choosing alone on political grounds, and closed the loop with the losing side including what they would receive and when.
      good: Reasonable approach that compares impact and gets a decision, though the follow-through with the other director is thin.
      weak: Tries to quietly do both, picks whoever is more senior, or leaves the decision unresolved.
    followups:
      - How did the director whose request was deferred respond?
      - What would you have done if the shared manager refused to decide?
      - Did the decision hold for the whole quarter?
    common_errors:
      - Splitting the team across both to avoid saying no, delivering neither well.
      - Negotiating with each director separately and promising both.

  - external_key: managerial.stakeholders.delivering_date_slip
    competency_key: communication
    topic: Telling stakeholders a date will slip
    difficulty: medium
    text: >-
      Tell me about a time you had to tell stakeholders that a date they were counting on was going to slip. How
      did you deliver the news, and what did you put in front of them?
    expected_concepts:
      - raising it as early as the slip was known
      - explaining the cause plainly without blame
      - a new date with its confidence level
      - options such as reduced scope or phased delivery
      - what changes to prevent further slips
    rubric:
      excellent: Raised the slip early, explained the cause without deflecting, offered a credible new plan with options and confidence, and describes how stakeholders used that to adjust their own plans.
      good: Communicated the slip clearly with a new date, but options or timing were limited.
      weak: Waited until the deadline, presented only excuses, or gave a new date with no basis.
    followups:
      - When did you first suspect the date was at risk, and when did you say so?
      - What did the stakeholders have to change on their side?
    common_errors:
      - Delaying the conversation hoping the team would catch up.
      - Giving a new date that was just as optimistic as the first.

  - external_key: managerial.stakeholders.fixed_scope_fixed_date
    competency_key: project_management
    topic: Negotiating when scope and date don't fit
    difficulty: medium
    text: >-
      Describe a time you were handed a fixed date and a fixed scope that clearly didn't fit together. How did you
      work out what should give, and how did you present the options to the people who set them?
    expected_concepts:
      - evidence that the plan does not fit, such as estimates or past throughput
      - separating must-have from nice-to-have scope
      - options across scope, date, people and quality
      - explicit risks of each option
      - getting a recorded decision from the owner
    rubric:
      excellent: Used evidence to show the gap, broke scope into priority tiers, presented two or three concrete options with consequences, and secured a clear decision that the team then delivered against.
      good: Presented the gap and an alternative plan with some evidence.
      weak: Accepted the plan and relied on overtime, or simply said it was impossible without offering options.
    followups:
      - Which option did they choose, and why?
      - Was quality ever one of the options you offered?
    common_errors:
      - Offering to compress testing as the default option.

  - external_key: managerial.stakeholders.representing_team_upward
    competency_key: leadership
    topic: Representing your team's view in leadership forums
    difficulty: medium
    text: >-
      Tell me about a time you were in a leadership discussion where a decision was heading in a direction your team
      would strongly disagree with. How did you represent their view, and what did you tell the team afterwards?
    expected_concepts:
      - knowing the team's concerns and the reasons behind them
      - presenting those concerns with evidence rather than as complaints
      - weighing the team's view against wider business needs
      - accepting and owning the final decision
      - explaining the outcome and reasoning back to the team
    rubric:
      excellent: Brought the team's concerns with concrete evidence, engaged with the wider business reasoning, owned the final decision in front of the team and explained it so the team understood why.
      good: Represented the team's view and communicated the outcome reasonably.
      weak: Stayed silent and later blamed leadership, or argued only from the team's preferences.
    followups:
      - Did the decision change because of what you said?
      - How did the team react when you explained the outcome?
    common_errors:
      - Positioning themselves as on the team's side against leadership when explaining the decision.

  - external_key: managerial.stakeholders.green_status_red_reality
    competency_key: communication
    topic: Status that looked green but wasn't
    difficulty: medium
    text: >-
      Tell me about a project that looked green in status reports while the people doing the work knew it was in
      trouble. What did you do about it, and what did you change in how status gets reported?
    expected_concepts:
      - recognising the gap between reported and actual status
      - surfacing the real status promptly
      - using objective signals such as burn-up, milestones or test results
      - making it safe for the team to report problems
      - changing the reporting format or criteria
    rubric:
      excellent: Describes how they discovered the gap, corrected the status quickly with evidence, and changed both the reporting criteria and the team norms so problems surfaced earlier afterwards.
      good: Corrected the status and made some change to reporting.
      weak: Accepts optimistic reporting as normal, or blames the team without changing anything.
    followups:
      - Why do you think the status was green for so long?
      - What signal do you now look at that you didn't before?
    common_errors:
      - Only adding more reporting rather than changing what is measured.

  - external_key: managerial.stakeholders.escalating_cross_team
    competency_key: stakeholder_management
    topic: Deciding when to escalate
    difficulty: medium
    text: >-
      Tell me about a disagreement with another team that you eventually escalated to your managers. What made you
      decide it was time, and how did you frame the escalation so it didn't feel like an attack on the other team?
    expected_concepts:
      - attempts to resolve it directly first
      - a clear trigger such as an approaching deadline or blocked work
      - telling the other party before escalating
      - a joint, neutral write-up of the options
      - the decision reached and the relationship afterwards
    rubric:
      excellent: Shows they tried direct resolution, escalated at a clear point with the other team's knowledge, presented a neutral summary of options and impact, and maintained the relationship after the decision.
      good: Reasonable escalation with some prior effort and neutral framing.
      weak: Escalated immediately or behind the other team's back, or never escalated and let the work stall.
    followups:
      - What would have happened if you had waited another two weeks?
      - How did the other team's lead feel about the way you raised it?
    common_errors:
      - Treating escalation as a failure to avoid rather than a normal tool.

  - external_key: managerial.stakeholders.dependency_commitment
    competency_key: project_management
    topic: Securing a commitment from a dependency team
    difficulty: medium
    text: >-
      Your project depends on another team that has its own priorities. Tell me about a time a dependency like that
      was at risk and what you did to get the commitment you needed.
    expected_concepts:
      - identifying the dependency and its risk early
      - understanding the other team's priorities and constraints
      - making the shared value or business impact clear
      - agreeing dates, interfaces and checkpoints
      - a fallback plan if the commitment fails
    rubric:
      excellent: Spotted the risk early, negotiated with an understanding of the other team's priorities, secured a concrete commitment with checkpoints and kept a fallback that was ready if needed.
      good: Got a commitment through reasonable negotiation, with less attention to fallback or checkpoints.
      weak: Assumed the other team would deliver, or only escalated after the work was already late.
    followups:
      - What did the other team get out of helping you?
      - Did you ever have to use the fallback?
    common_errors:
      - Accepting a verbal yes with no date or checkpoint.

  - external_key: managerial.stakeholders.maintenance_capacity_deal
    competency_key: stakeholder_management
    topic: Agreeing standing capacity for maintenance work
    difficulty: medium
    text: >-
      How have you persuaded a product partner to set aside ongoing capacity for maintenance and reliability work,
      rather than having to argue for it one item at a time?
    expected_concepts:
      - evidence such as incident counts, cycle time or support load
      - framing the cost in terms the partner cares about
      - a concrete proposal such as a percentage or rotation
      - transparency on how the capacity is used
      - reviewing the agreement against results
    rubric:
      excellent: Describes building a case from evidence, proposing a specific standing arrangement, reporting back on what the capacity delivered and adjusting it over time.
      good: Secured some dedicated time with a reasonable argument but limited reporting on outcomes.
      weak: Relies on hiding maintenance inside feature estimates, or simply complains that product never prioritises it.
    followups:
      - How did you show the partner that the time was well spent?
      - What happened when a big deadline came up and they wanted that capacity back?
    common_errors:
      - Arguing from engineering preference rather than business impact.

  - external_key: managerial.stakeholders.goals_misaligned_midproject
    competency_key: stakeholder_management
    topic: Stakeholders who disagree on what the project is for
    difficulty: hard
    text: >-
      Tell me about a project where you discovered partway through that the key stakeholders had different ideas about
      what it was actually meant to achieve. How did you surface the disagreement and get them aligned?
    expected_concepts:
      - noticing the signals of misaligned goals
      - making each stakeholder's goal explicit and side by side
      - showing how the goals conflict in scope or priority
      - getting the accountable sponsor to decide
      - re-planning and re-communicating the agreed goal
    rubric:
      excellent: Explains how the misalignment showed up, made the competing goals explicit in a shared forum, drove a decision with the accountable sponsor and re-planned the work around the agreed goal, with reflection on how to catch it earlier.
      good: Surfaced the disagreement and reached a working agreement, with less on how the plan changed.
      weak: Tried to satisfy every interpretation at once, or kept building and hoped the disagreement would resolve itself.
    followups:
      - What was the first sign that people wanted different things?
      - What would you do at kickoff now to catch this sooner?
      - Who was unhappy with the outcome, and how did you handle that?
    common_errors:
      - Resolving it through separate side conversations so the stakeholders never actually agree with each other.

  - external_key: managerial.stakeholders.rebuilding_trust_new_partner
    competency_key: stakeholder_management
    topic: Earning trust from a skeptical stakeholder
    difficulty: easy
    text: >-
      Tell me about a stakeholder who started out skeptical of your team, perhaps because of past problems. What did
      you do to earn their trust?
    expected_concepts:
      - listening to understand past problems
      - small early commitments delivered reliably
      - regular, transparent updates including bad news
      - involving them in decisions that affect them
    rubric:
      excellent: Names the source of the skepticism, describes specific actions such as small reliable deliveries and transparent updates, and shows evidence the relationship changed.
      good: Clear example with some concrete actions.
      weak: Relies on general friendliness or a single meeting, with no evidence of change.
    followups:
      - What was the first thing you delivered for them?
      - How did you know the trust had actually improved?
    common_errors:
      - Overpromising early to win them over.

  - external_key: managerial.stakeholders.pushing_back_on_own_manager
    competency_key: leadership
    topic: Pushing back on your own manager's commitment
    difficulty: hard
    text: >-
      Tell me about a time your own manager wanted to commit your team to an initiative you were convinced was the wrong
      bet for the business. How did you push back, and what was the outcome?
    expected_concepts:
      - understanding the manager's pressures and goals
      - presenting evidence on the risks and expected return
      - offering an alternative that meets the underlying goal
      - disagreeing in private and committing once decided
      - how they represented the decision to the team
    rubric:
      excellent: Shows they understood their manager's constraints, made a data-backed case with a viable alternative, and handled the result well either way, including how they explained it to the team without undermining their manager.
      good: Pushed back with reasons and an alternative, with a clear outcome.
      weak: Complied silently and complained to the team, or refused without proposing anything.
    followups:
      - If your manager had overruled you, how would you have presented the decision to your team?
      - What did you learn about how your manager makes decisions?
    common_errors:
      - Undermining the manager in front of the team after losing the argument.
      - Arguing on effort or fairness rather than impact and risk.

  - external_key: managerial.stakeholders.yes_with_conditions
    competency_key: stakeholder_management
    topic: Offering an alternative instead of a flat no
    difficulty: easy
    text: >-
      Tell me about a request you couldn't take on in full, where you offered the stakeholder something different
      instead of simply declining. What did you offer, and how did it land?
    expected_concepts:
      - understanding the problem behind the request
      - a reduced, phased or self-service alternative
      - clarity about what would and would not be done
      - checking that the alternative met the actual need
    rubric:
      excellent: Gives a specific example where they found the underlying need, offered a concrete alternative with clear limits, and confirmed it solved the stakeholder's problem.
      good: Offered a sensible alternative with a reasonable outcome.
      weak: Describes only a flat no or an unconditional yes.
    followups:
      - Was the stakeholder satisfied with the alternative, or did they come back for the full version?
    common_errors:
      - Offering an alternative that quietly grows back into the original request.

  - external_key: managerial.stakeholders.tradeoff_for_non_technical
    competency_key: communication
    topic: Explaining a technical trade-off to a non-technical decision maker
    difficulty: easy
    text: >-
      Tell me about a time a non-technical stakeholder had to make a decision that hinged on a technical trade-off.
      How did you explain it so they could actually choose?
    expected_concepts:
      - translating options into business outcomes such as time, cost and risk
      - avoiding jargon or explaining it simply
      - a small number of clear options
      - a recommendation with reasons
      - checking understanding before the decision
    rubric:
      excellent: Describes framing two or three options in business terms with a clear recommendation, checks the stakeholder understood, and shows the decision they made was informed.
      good: Explained the trade-off in plain language with some framing of consequences.
      weak: Delivers technical detail without translation, or makes the decision for them without explaining.
    followups:
      - What did the stakeholder decide, and would you have chosen the same?
    common_errors:
      - Presenting too many options with no recommendation.

  - external_key: managerial.stakeholders.coaching_yes_to_everything
    competency_key: mentoring
    topic: Coaching someone who says yes to everything
    difficulty: medium
    text: >-
      Tell me about someone on your team who said yes to every stakeholder request and ended up overcommitted. How did
      you coach them, and what changed?
    expected_concepts:
      - noticing the pattern and its effect on their work
      - understanding why they said yes
      - practical techniques such as asking about priority or deferring the answer
      - backing them up when they pushed back
      - observable change over time
    rubric:
      excellent: Describes a specific coaching approach with practical techniques, shows they backed the person up in real situations and gives evidence the behaviour changed.
      good: Gave useful advice and support, with some improvement.
      weak: Took over the stakeholder relationship themselves or simply told the person to say no more often.
    followups:
      - What was the first real request they pushed back on, and how did it go?
      - How did you make sure they weren't punished for saying no?
    common_errors:
      - Fixing the overload by reassigning work without building the skill.

  - external_key: managerial.stakeholders.handing_over_relationship
    competency_key: mentoring
    topic: Handing a stakeholder relationship to someone you're developing
    difficulty: hard
    text: >-
      Tell me about a time you handed ownership of an important stakeholder relationship to someone on your team who
      hadn't owned one before. How did you set them up, and what did you do when it started to wobble?
    expected_concepts:
      - choosing a suitable relationship and person
      - introductions and context transfer
      - a clear signal to the stakeholder about who owns what
      - support without taking it back
      - stepping in carefully when needed and debriefing
    rubric:
      excellent: Describes a deliberate handover with context and introductions, makes the ownership explicit to the stakeholder, supports through a difficult moment without reclaiming ownership, and shows the person's growth.
      good: Reasonable handover with some support during difficulties.
      weak: Either never truly let go or abandoned the person once the handover happened.
    followups:
      - How did the stakeholder react to dealing with someone new?
      - Where is the line between supporting them and taking over?
    common_errors:
      - Staying in every meeting so the stakeholder keeps coming back to them.

  - external_key: managerial.stakeholders.phased_delivery_case
    competency_key: project_management
    topic: Convincing a stakeholder to accept phased delivery
    difficulty: medium
    text: >-
      Tell me about a time a stakeholder wanted everything delivered in one big release and you persuaded them to accept
      it in phases instead. How did you make the case, and how did the phasing work out in practice?
    expected_concepts:
      - risks of a single large release
      - a first phase that delivers real value on its own
      - clear contents and dates for later phases
      - feedback from early phases shaping later ones
      - evidence of the outcome
    rubric:
      excellent: Made a concrete case on risk and earlier value, designed a first phase that was useful by itself, kept the stakeholder informed on later phases and shows how early feedback changed the plan.
      good: Agreed a phased plan with a sensible first phase and reasonable outcome.
      weak: Phases were arbitrary slices with no standalone value, or the stakeholder was not genuinely persuaded.
    followups:
      - What was in the first phase, and why that?
      - Did any later phase get dropped once people saw the first one?
    common_errors:
      - A first phase that is only infrastructure, so the stakeholder sees nothing usable.

  - external_key: managerial.stakeholders.late_change_before_launch
    competency_key: project_management
    topic: A significant change request just before launch
    difficulty: hard
    text: >-
      Two weeks before a launch, a key stakeholder asks for a significant change they say is essential. Walk me through
      how you handled something like that, from understanding the request to the final decision.
    expected_concepts:
      - understanding why the change is essential now
      - assessing impact on date, risk and quality
      - options such as launching then following up, or a feature flag
      - deciding with the right owner and recording it
      - communicating the outcome to everyone affected
    rubric:
      excellent: Probes the real reason and urgency, quantifies the impact, offers options such as a follow-up release or flag, drives a clear decision with the accountable owner and communicates it widely.
      good: Assessed impact and reached a decision, with fewer alternatives explored.
      weak: Accepts the change and risks the launch without discussion, or refuses outright without understanding it.
    followups:
      - What would have happened if you had shipped without it?
      - How did you protect quality if the change went in?
      - Who had the final say?
    common_errors:
      - Accepting the change without re-checking test coverage or the rollback plan.
      - Treating every late change as scope creep without checking whether it is genuinely critical.

  - external_key: managerial.stakeholders.tailoring_updates_by_audience
    competency_key: communication
    topic: Tailoring updates for executives and working teams
    difficulty: easy
    text: >-
      How do you adjust a project update for an executive compared with the people working alongside your team day to
      day? Give me an example of the same news told two different ways.
    expected_concepts:
      - executives get outcome, risk and decisions needed
      - working teams get details, dates and dependencies
      - leading with the headline
      - a consistent underlying message across audiences
    rubric:
      excellent: Gives a concrete example showing different depth and framing for each audience while keeping the facts consistent, and explains what each audience needed to do with it.
      good: Describes sensible differences between audiences.
      weak: Sends the same detailed update to everyone, or changes the substance depending on the audience.
    followups:
      - What do you do when an executive asks for detail you'd normally leave out?
    common_errors:
      - Softening the message for senior audiences.

  - external_key: managerial.stakeholders.shelving_team_work
    competency_key: leadership
    topic: Telling the team their work is being shelved
    difficulty: medium
    text: >-
      Tell me about a time leadership changed priorities mid-quarter and work your team had invested in was shelved. How
      did you explain it to the team, and how did you handle the work that was left half done?
    expected_concepts:
      - understanding and sharing the reasons for the change
      - being direct about what is stopping
      - leaving the shelved work in a recoverable state
      - recognising the work done
      - re-focusing the team on the new priority
    rubric:
      excellent: Explained the reasons openly, was direct about the change, made sure the half-finished work was documented or safely parked, and helped the team re-focus with clear goals.
      good: Communicated the change with reasons and moved the team on.
      weak: Passed the change on without context, or blamed leadership in front of the team.
    followups:
      - Did you agree with the change yourself?
      - What happened to the shelved work later?
    common_errors:
      - Leaving branches, flags or partial infrastructure behind with no owner.

  - external_key: managerial.stakeholders.visible_roadmap
    competency_key: project_management
    topic: Making the team's priorities visible
    difficulty: medium
    text: >-
      How have you made your team's roadmap and current priorities visible to stakeholders, so they can see where their
      request stands without having to chase you? Tell me what difference it made.
    expected_concepts:
      - a single, current source of truth for priorities
      - showing what is not planned as well as what is
      - a regular update rhythm so it stays accurate
      - linking requests to their status and reasoning
      - observable effect such as fewer status questions or better planning conversations
    rubric:
      excellent: Describes a concrete, maintained artefact that shows planned and unplanned work with reasons, explains how it is kept current, and gives evidence it changed how stakeholders engaged.
      good: Has a visible roadmap with a reasonable update rhythm.
      weak: Priorities live only in the manager's head or in a tool nobody outside the team can read.
    followups:
      - How do you keep it from going stale?
      - What do stakeholders see for requests you've decided not to do?
    common_errors:
      - Publishing a roadmap so detailed that every change looks like a broken promise.

  - external_key: managerial.stakeholders.going_around_you
    competency_key: stakeholder_management
    topic: A stakeholder who goes around you
    difficulty: hard
    text: >-
      Tell me about a stakeholder who agreed to a decision in a meeting and then went to your manager to get it changed.
      How did you deal with it, both in the moment and with that person afterwards?
    expected_concepts:
      - aligning with their own manager on the facts
      - a direct conversation with the stakeholder
      - understanding why they did not raise concerns openly
      - making decisions and their owners explicit and recorded
      - an agreed way to revisit decisions in future
    rubric:
      excellent: Aligned quickly with their manager, had a direct and constructive conversation with the stakeholder about the concern behind it, and introduced recorded decisions or a clear revisit process that reduced repeats.
      good: Handled the immediate situation and spoke with the stakeholder.
      weak: Retaliated, complained without addressing it, or let decisions keep being reopened.
    followups:
      - What was the stakeholder's underlying concern?
      - Did it happen again?
      - How did your manager handle the request?
    common_errors:
      - Treating the stakeholder as an adversary rather than finding the concern they didn't voice.

  - external_key: managerial.stakeholders.measuring_satisfaction
    competency_key: stakeholder_management
    topic: Knowing whether stakeholders are satisfied
    difficulty: medium
    text: >-
      How do you find out whether the people who depend on your team are actually satisfied, beyond the fact that nobody
      is complaining? Tell me about something you learned that way and changed.
    expected_concepts:
      - regular one-to-one check-ins with key stakeholders
      - structured feedback such as surveys or retrospectives with partners
      - signals such as escalations, workarounds or shadow tooling
      - acting on feedback and closing the loop
    rubric:
      excellent: Describes deliberate feedback channels, gives a concrete example of a finding they would otherwise have missed, and shows the change they made and how they reported back.
      good: Has some feedback mechanism and an example of acting on it.
      weak: Assumes silence means satisfaction.
    followups:
      - What was the most surprising piece of feedback you got?
    common_errors:
      - Collecting feedback without telling stakeholders what changed as a result.
