# Managerial round: project risks, cross-team dependencies, escalations and unblocking (part 4 of 4).
# Focus: unblocking the team day to day, decision bottlenecks and growing others' skill with risk.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ everyday unblocking
  - external_key: managerial.risk_dependencies.daily_blocker_routine
    competency_key: leadership
    topic: A routine for clearing blockers
    difficulty: easy
    text: >-
      What does your day-to-day routine look like for spotting and clearing blockers for your team? Give me an
      example from a recent week.
    expected_concepts:
      - regular touchpoints where blockers surface
      - a visible list of current blockers
      - acting on blockers quickly and personally when needed
      - distinguishing blockers they should clear from ones the team can
      - closing the loop with the person who was blocked
    rubric:
      excellent: Describes a concrete, regular practice, a real recent blocker they cleared quickly and how they decided which blockers to handle personally.
      good: Has a reasonable routine with an example, but less clarity on prioritising blockers.
      weak: Waits for people to come to them, or describes stand-up attendance as the whole routine.
    followups:
      - Which blocker took you the longest to clear that week?
      - How do you decide which ones to leave to the team?
    common_errors:
      - Hearing blockers in stand-up but not following up afterwards.

  - external_key: managerial.risk_dependencies.noticing_silent_stuck
    competency_key: mentoring
    topic: Noticing someone stuck in silence
    difficulty: easy
    text: >-
      How do you notice when an engineer has been stuck on something for too long but hasn't asked for help? Tell
      me about a time you caught this.
    expected_concepts:
      - signals such as unchanged tasks, quiet pull requests or vague updates
      - asking open questions in one-to-ones or stand-ups
      - offering help without taking the work over
      - agreeing a norm for when to ask for help
      - the outcome for the person and the work
    rubric:
      excellent: Names concrete signals, gives a specific example of stepping in supportively, and describes a norm they set so it happens less.
      good: Spots the issue and helps with a real example, but no lasting norm.
      weak: Relies on people to ask, or takes the work away from them.
    followups:
      - What norm did you agree with the team about asking for help?
      - How did the person respond when you checked in?
    common_errors:
      - Solving the problem for the engineer instead of helping them get unstuck.

  - external_key: managerial.risk_dependencies.stalled_on_signoff
    competency_key: project_management
    topic: Work stuck waiting for sign-off
    difficulty: easy
    text: >-
      Tell me about a time your team's work stalled while waiting on an approval or sign-off. What did you do to
      get it moving?
    expected_concepts:
      - finding out why the approval was delayed
      - making the approval easy, such as a clear summary of what is needed
      - agreeing a date with the approver
      - escalating politely if the date passed
      - preventing the delay next time by asking earlier
    rubric:
      excellent: Diagnoses the reason for the delay, makes the approval easy to give, agrees a date and changes the plan so future approvals are requested earlier.
      good: Gets the approval moving with sensible steps, but with no prevention.
      weak: Waits and reports the delay without acting.
    followups:
      - What was really holding the approver up?
      - When do you ask for approvals now?
    common_errors:
      - Sending reminders without making it easier for the approver to say yes.

  - external_key: managerial.risk_dependencies.small_friction_blockers
    competency_key: leadership
    topic: Removing small recurring friction
    difficulty: easy
    text: >-
      Small blockers like missing access, slow environments or flaky builds can quietly eat a team's week. Tell
      me about one of these you went after and how you fixed it.
    expected_concepts:
      - noticing the friction and its real cost
      - measuring or estimating time lost
      - prioritising the fix against feature work
      - the fix and who did it
      - the time recovered afterwards
    rubric:
      excellent: Quantifies the cost of the friction, justifies the fix against other work and shows the time recovered after fixing it.
      good: Real example of fixing friction with a reasonable result, without much measurement.
      weak: Accepts the friction as normal or only complains about it.
    followups:
      - How did you convince anyone it was worth fixing?
      - What other friction did you find once that one was gone?
    common_errors:
      - Fixing it personally in spare time without making the cost visible.

  - external_key: managerial.risk_dependencies.unclear_requirements_blocker
    competency_key: communication
    topic: Blocked by unclear requirements
    difficulty: easy
    text: >-
      Tell me about a time your team was blocked because the requirements were unclear. How did you get the
      answers you needed?
    expected_concepts:
      - identifying exactly which questions blocked progress
      - getting the right decision maker in the room
      - using examples, mock-ups or prototypes to make choices concrete
      - writing decisions down
      - letting the team proceed on parts that were clear
    rubric:
      excellent: Pinpoints the blocking questions, uses concrete examples to get decisions from the right person, records them and keeps the clear parts moving.
      good: Gets the answers with a reasonable approach, but more slowly or less precisely.
      weak: Waits for clarity or builds on guesses without confirming.
    followups:
      - Which question was hardest to get answered, and why?
      - How did you keep the team busy in the meantime?
    common_errors:
      - Asking a broad "what do you want?" instead of specific, decidable questions.

  - external_key: managerial.risk_dependencies.retro_on_dependency_miss
    competency_key: project_management
    topic: Retrospective after a dependency surprise
    difficulty: easy
    text: >-
      After a project where a dependency or risk caught you out, how do you run the retrospective so the lessons
      actually change the next plan? Give me an example.
    expected_concepts:
      - a factual timeline of what happened
      - focusing on decisions and signals, not individuals
      - involving the other teams affected
      - a small number of concrete actions with owners
      - checking at the next planning that actions were applied
    rubric:
      excellent: Describes a blameless review with the other teams, a few owned actions and evidence those actions changed the next plan.
      good: Ran a useful retrospective with actions, but follow-through is unclear.
      weak: Retrospective produced a long list nobody acted on, or none was held.
    followups:
      - Which action actually made it into the next plan?
      - How did you get the other team to take part?
    common_errors:
      - Producing many actions with no owner, so none happen.

  - external_key: managerial.risk_dependencies.replanning_around_blocked_items
    competency_key: agile_delivery
    topic: Rearranging work around blocked items
    difficulty: easy
    text: >-
      When part of an iteration is blocked on something outside the team, how do you rearrange the work so
      people stay productive? Tell me what you did the last time.
    expected_concepts:
      - pulling forward ready work from the backlog
      - preparing for the blocked item, such as tests or stubs
      - pairing people on other priorities
      - keeping the blocked item visible and chased
      - telling stakeholders about the effect on the goal
    rubric:
      excellent: Describes a concrete re-plan that kept people productive on valuable work, prepared for the blocked item and kept stakeholders informed.
      good: Reassigned work sensibly, with limited attention to communicating impact.
      weak: Lets people start many unrelated tasks or sit idle.
    followups:
      - How did it affect the iteration goal?
      - What happened when the blocker cleared?
    common_errors:
      - Starting lots of new work in progress that is then abandoned.

  # ------------------------------------------------------------ bottlenecks and decisions
  - external_key: managerial.risk_dependencies.lead_as_bottleneck
    competency_key: leadership
    topic: Becoming the team's bottleneck
    difficulty: medium
    text: >-
      Tell me about a time you realised you had become the bottleneck your team was waiting on. How did you
      notice, and what did you change?
    expected_concepts:
      - the signals such as queued reviews or decisions
      - which work they were holding on to and why
      - delegating decisions or reviews with clear guidance
      - building others' ability to take that work on
      - checking that flow improved
    rubric:
      excellent: Recognises the signals, explains why they held on to the work, delegates with guidance and support, and shows flow improved.
      good: Recognised and delegated with a reasonable result, but little on building others' ability.
      weak: Responded by working longer hours rather than changing what they hold.
    followups:
      - What did you find hardest to let go of?
      - How did you make sure quality held after you delegated?
    common_errors:
      - Fixing the bottleneck by doing the same work faster.

  - external_key: managerial.risk_dependencies.stuck_design_debate
    competency_key: leadership
    topic: Ending a stalled design debate
    difficulty: medium
    text: >-
      Your team has been debating a design choice for two weeks and work is piling up behind it. How do you get
      to a decision? Tell me about a real case.
    expected_concepts:
      - clarifying the decision criteria
      - deciding how reversible the choice is
      - time-boxing remaining investigation
      - naming who decides and when
      - recording the decision and reasoning
    rubric:
      excellent: Reframes the debate around criteria and reversibility, sets a time box and decision owner, records the outcome and keeps the team committed.
      good: Gets a decision with a reasonable process, but lacks criteria or recording.
      weak: Lets the debate continue or decides by seniority without reasoning.
    followups:
      - How did the people who disagreed respond?
      - What would make you reopen the decision?
    common_errors:
      - Treating every design choice as irreversible.

  - external_key: managerial.risk_dependencies.key_person_delivery_risk
    competency_key: project_management
    topic: Delivery hanging on one or two people
    difficulty: medium
    text: >-
      On a critical project, how do you spot that delivery depends on one or two people, and what do you do
      about it before it becomes a problem? Give me an example.
    expected_concepts:
      - looking at who holds knowledge, reviews and decisions
      - pairing and rotation to spread knowledge
      - documentation of critical areas
      - planning work so others take on key pieces
      - balancing short-term speed with resilience
    rubric:
      excellent: Describes how they identified the concentration, specific steps to spread knowledge and work, the cost to short-term speed and how it paid off.
      good: Recognised the risk and took some steps, with less evidence of the result.
      weak: Relies on the key people working harder, or notices only after someone leaves.
    followups:
      - How did the key person feel about sharing the work?
      - What did it cost in speed, and was it worth it?
    common_errors:
      - Asking for documentation but never letting anyone else do the work.

  - external_key: managerial.risk_dependencies.coaching_lead_on_dependency
    competency_key: mentoring
    topic: Coaching a lead through a dependency
    difficulty: medium
    text: >-
      Tell me about a time you coached a less experienced lead or engineer to manage a tricky dependency with
      another team themselves, rather than doing it for them. How did you support them?
    expected_concepts:
      - deciding the stretch was right for them
      - preparing them with context and contacts
      - reviewing their plan or messages without taking over
      - being ready to step in if the risk grew too high
      - debriefing what they learned
    rubric:
      excellent: Describes deliberate delegation, preparation, light-touch support, a clear point where they would step in, and a debrief showing the person's growth.
      good: Supported the person effectively, with less detail on stepping-in criteria or growth.
      weak: Handed it over without support or took it back at the first difficulty.
    followups:
      - At what point would you have stepped in?
      - What did they do differently the next time?
    common_errors:
      - Delegating the task but keeping all the conversations themselves.

  - external_key: managerial.risk_dependencies.unblocking_without_authority
    competency_key: stakeholder_management
    topic: Persuading someone with no reason to help
    difficulty: medium
    text: >-
      Tell me about a time you unblocked your team by persuading someone who had no particular reason to help
      you. What did you offer or explain that made the difference?
    expected_concepts:
      - understanding what mattered to that person
      - linking the request to a shared goal
      - making the request small and easy
      - offering something in return
      - thanking them and keeping the relationship
    rubric:
      excellent: Understands the other person's interests, frames the request around shared goals, makes it easy and reciprocal, and builds a lasting relationship.
      good: Gets the help with a reasonable approach, with less attention to the other person's interests.
      weak: Relies on pressure, rank or repeated asking.
    followups:
      - What did they get out of it?
      - Have you worked with them since? How did that go?
    common_errors:
      - Assuming that the importance of their project is obvious to everyone else.

  - external_key: managerial.risk_dependencies.cross_team_sync_practice
    competency_key: agile_delivery
    topic: Cross-team coordination that unblocks
    difficulty: medium
    text: >-
      When several agile teams depend on each other, how have you run cross-team coordination, for example a
      scrum of scrums or a shared dependency board, so it actually unblocks work? What did you change when it
      wasn't working?
    expected_concepts:
      - who attends and how often
      - focus on blockers and upcoming dependencies, not status
      - shared board or planning session across teams
      - actions with owners and deadlines
      - adjusting the format based on feedback
    rubric:
      excellent: Describes a specific format focused on blockers, owned actions and a change they made when it wasn't working, with evidence of fewer blocks.
      good: Ran a reasonable coordination practice with some results.
      weak: Describes a status meeting with no actions or improvements.
    followups:
      - What was the clearest sign it wasn't working?
      - Which change made the biggest difference?
    common_errors:
      - Letting the meeting become a round of status updates.

  - external_key: managerial.risk_dependencies.shielding_from_priority_churn
    competency_key: leadership
    topic: Protecting the team from priority churn
    difficulty: medium
    text: >-
      When priorities change above you every couple of weeks, how do you stop that churn from constantly
      blocking your team's work? Tell me how you handled a period like that.
    expected_concepts:
      - understanding the source of the churn
      - agreeing a planning cadence with stakeholders
      - showing the cost of switching
      - protecting committed work within an iteration
      - keeping the team informed of the reasons for changes
    rubric:
      excellent: Diagnoses the source, agrees a cadence that limits mid-cycle changes, makes the switching cost visible and keeps the team informed, with improved stability.
      good: Reduces the churn's impact with practical steps, but doesn't influence its source.
      weak: Passes every change straight to the team or refuses all changes.
    followups:
      - How did you show stakeholders what the switching was costing?
      - What urgent changes did you still accept, and why?
    common_errors:
      - Hiding all context from the team so they don't understand why work changes.

  - external_key: managerial.risk_dependencies.security_review_backlog
    competency_key: stakeholder_management
    topic: Waiting on a backed-up review
    difficulty: medium
    text: >-
      Your launch is waiting on a security or privacy review that's backed up for weeks. How would you get through
      it without cutting corners? Tell me about a time you dealt with something like this.
    expected_concepts:
      - engaging the review team early with complete materials
      - understanding their priorities and criteria
      - splitting the review or reviewing incrementally
      - planning the launch date around realistic review timing
      - preparing earlier next time
    rubric:
      excellent: Works with the review team to make the review easy and incremental, realistically re-plans the timeline, and changes practice to engage reviewers earlier.
      good: Reasonable steps to speed things up with a real example.
      weak: Pushes to skip or rush the review, or simply waits.
    followups:
      - What could you have sent them earlier?
      - How did you explain the wait to stakeholders?
    common_errors:
      - Treating the review as a formality rather than input into the design.

  - external_key: managerial.risk_dependencies.temporary_workaround_exit
    competency_key: project_management
    topic: Workarounds while a dependency is open
    difficulty: medium
    text: >-
      Tell me about a time you used a temporary workaround, such as a stub, a manual process or a narrowed scope,
      to keep work moving while a dependency was unresolved. How did you make sure the workaround didn't become
      permanent?
    expected_concepts:
      - the workaround chosen and its risks
      - agreement on how long it would last
      - tracking it as a known debt with an owner
      - a trigger or date for removing it
      - whether it was actually removed
    rubric:
      excellent: Explains the workaround and its risks, sets an owner and removal trigger, and shows it was actually removed or consciously kept.
      good: Used a sensible workaround with some tracking, but removal was left loose.
      weak: Workaround stayed indefinitely with no plan or awareness.
    followups:
      - What would have happened if the dependency never arrived?
      - Who decided when it could be removed?
    common_errors:
      - Not recording the workaround anywhere, so it is forgotten.

  - external_key: managerial.risk_dependencies.growing_risk_judgement
    competency_key: mentoring
    topic: Building risk judgement in the team
    difficulty: medium
    text: >-
      How have you helped engineers on your team get better at spotting and raising project risks themselves?
      Give me an example of someone whose judgement on this improved.
    expected_concepts:
      - involving engineers in planning and risk discussions
      - asking coaching questions instead of giving answers
      - giving ownership of real risks
      - reviewing outcomes together
      - a specific person's progress
    rubric:
      excellent: Describes deliberate coaching practices, gives an engineer real risk ownership, and shows concrete evidence of their improved judgement.
      good: Coaches with some practices and a modest example.
      weak: Keeps all risk thinking to themselves.
    followups:
      - What question do you ask most often when coaching on this?
      - What did they spot that you would have missed?
    common_errors:
      - Equating "attended the risk meeting" with developing risk judgement.

  - external_key: managerial.risk_dependencies.blockers_summary_for_director
    competency_key: communication
    topic: A one-page summary of what blocks you
    difficulty: medium
    text: >-
      Your director wants a one-page view of what's blocking your area and what help you need. How would you put
      that together, and what would you leave out?
    expected_concepts:
      - a short list ranked by impact
      - for each, the effect on goals and the specific ask
      - who owns each blocker and its status
      - leaving out items the team can resolve itself
      - keeping it updated on a regular rhythm
    rubric:
      excellent: Produces a ranked, impact-led summary with specific asks and owners, clearly explains what is left out and why, and keeps it current.
      good: Clear summary with impact and asks, but less thought about what to leave out.
      weak: A long list of every issue with no ranking or asks.
    followups:
      - Which item would go at the top, and why?
      - How would you know the director actually used it?
    common_errors:
      - Including everything to look thorough, which hides the real asks.

  # ------------------------------------------------------------ harder unblocking
  - external_key: managerial.risk_dependencies.org_wide_blocker_fix
    competency_key: leadership
    topic: Fixing a blocker shared across teams
    difficulty: hard
    text: >-
      Tell me about a time you noticed that teams across your organisation kept getting blocked by the same
      underlying problem. How did you get it fixed beyond your own team?
    expected_concepts:
      - gathering evidence that it affected several teams
      - quantifying the overall cost
      - building a coalition with other leads
      - finding an owner and funding for the fix
      - tracking adoption and results
    rubric:
      excellent: Collects cross-team evidence, quantifies the cost, rallies other leads, secures an owner and resources and shows the result across teams.
      good: Drives a fix with some cross-team support, but evidence or results are thin.
      weak: Fixes it only for their own team or just complains about it.
    followups:
      - Who ended up owning it, and how did you convince them?
      - How did you measure the result?
    common_errors:
      - Solving it locally and assuming others will copy the fix.

  - external_key: managerial.risk_dependencies.when_to_step_in
    competency_key: mentoring
    topic: Unblocking versus letting people learn
    difficulty: hard
    text: >-
      Removing blockers yourself is fast, but it can stop your team learning to do it. How do you decide when to
      step in and when to let someone work through it? Tell me about a time you got that balance wrong.
    expected_concepts:
      - factors such as urgency, risk and the person's growth goals
      - agreeing with the person how much support they want
      - setting a check-in point
      - a specific case where the balance was wrong
      - what they changed afterwards
    rubric:
      excellent: Explains clear factors for the decision, describes a specific misjudgement with its consequences and the concrete adjustment made since.
      good: Has sensible factors and a real example, but the lesson is general.
      weak: Always steps in or never does, or cannot name a misjudgement.
    followups:
      - How did the person react when you stepped in, or didn't?
      - What signal tells you it's time to step in now?
    common_errors:
      - Describing only times they got the balance right.

  - external_key: managerial.risk_dependencies.dependency_became_conflict
    competency_key: collaboration
    topic: Repairing a dependency turned conflict
    difficulty: hard
    text: >-
      Tell me about a cross-team dependency that turned into a real conflict between the teams. How did you
      repair the working relationship while still getting what your project needed?
    expected_concepts:
      - understanding how the conflict developed
      - meeting the other lead directly to reset
      - acknowledging their side's constraints and any own-team mistakes
      - agreeing a concrete way forward
      - rebuilding trust through follow-through
    rubric:
      excellent: Diagnoses the conflict's history, owns their side's part, agrees a concrete path with the other lead and shows the relationship and the delivery both recovered.
      good: Resolved the conflict sufficiently to deliver, with less repair of the relationship.
      weak: Won the argument through escalation, leaving the relationship damaged.
    followups:
      - What did your team contribute to the conflict?
      - How do the two teams work together now?
    common_errors:
      - Getting the deliverable but leaving the next collaboration harder.

  - external_key: managerial.risk_dependencies.structural_dependency_reduction
    competency_key: leadership
    topic: Reducing structural dependence over time
    difficulty: hard
    text: >-
      Your group's roadmap depends on so many other teams that almost every project slips. Over a year, how
      would you reduce that structural dependence rather than just managing each dependency as it comes?
    expected_concepts:
      - analysing which dependencies recur and why
      - changing team boundaries or ownership
      - investing in self-service interfaces or platforms
      - agreeing longer-term roadmaps with key partners
      - measuring dependency-driven delays over time
    rubric:
      excellent: Uses data on recurring dependencies to propose structural changes such as ownership shifts and self-service, aligns key partners and measures progress over the year.
      good: Proposes sensible structural changes, but without a way to measure progress.
      weak: Proposes better tracking only, or ignores the cost of duplicating other teams' work.
    followups:
      - Which dependency would you tackle first, and why?
      - How would you get the other teams to agree to changing ownership?
    common_errors:
      - Assuming every dependency should be eliminated rather than managed.

  - external_key: managerial.risk_dependencies.executives_wont_decide
    competency_key: stakeholder_management
    topic: Executives who disagree and won't decide
    difficulty: hard
    text: >-
      Your team is ready to build, but two executives disagree on the direction and neither will make the call.
      How do you get a decision without taking sides inappropriately? Tell me if you've faced something like this.
    expected_concepts:
      - laying out both options neutrally with their trade-offs
      - showing the cost of continued delay
      - asking who holds the decision rights
      - proposing a time-boxed experiment or reversible first step
      - keeping the team productive meanwhile
    rubric:
      excellent: Presents options neutrally with the cost of delay, pushes for clear decision rights, offers a reversible step to make progress, and keeps the team working on value.
      good: Pushes for a decision with a fair summary, but no option to make progress meanwhile.
      weak: Picks a side quietly and builds that, or waits indefinitely.
    followups:
      - Who would you ask to own the decision?
      - What work would your team do while waiting?
    common_errors:
      - Lobbying for their own preferred option while claiming neutrality.

  - external_key: managerial.risk_dependencies.scope_trade_for_late_dependency
    competency_key: stakeholder_management
    topic: Trading scope for a late dependency
    difficulty: hard
    text: >-
      A key dependency won't arrive in time, and the only way to hit the date is to launch with a reduced feature
      set. How do you bring stakeholders to agree on that trade? Walk me through a real or similar case.
    expected_concepts:
      - understanding what stakeholders value most in the release
      - defining a reduced scope that still delivers value
      - showing alternatives such as moving the date
      - agreeing what follows once the dependency lands
      - communicating the change to users or customers
    rubric:
      excellent: Builds a reduced scope around what stakeholders value most, compares it with alternatives, secures agreement and a follow-up plan, and handles external messaging.
      good: Gets agreement on a reduced scope, but with less attention to alternatives or follow-up.
      weak: Cuts scope without agreement or insists on the full scope regardless.
    followups:
      - What did stakeholders push back on hardest?
      - How did you make sure the remaining scope actually shipped later?
    common_errors:
      - Choosing what to cut based on engineering ease rather than user value.

  - external_key: managerial.risk_dependencies.measuring_time_lost_waiting
    competency_key: agile_delivery
    topic: Measuring time lost to waiting
    difficulty: hard
    text: >-
      How would you measure how much of your team's time is lost waiting on other teams, and what would you do
      with that data? Tell me about any time you tracked something like this.
    expected_concepts:
      - tracking blocked time or wait states on work items
      - separating waiting from active work in cycle time
      - attributing waits to sources such as reviews, teams or approvals
      - using the data to target the biggest sources
      - avoiding using the data to blame other teams
    rubric:
      excellent: Proposes a practical way to capture wait time, breaks it down by source, uses it to target improvements and shares it constructively with the other teams.
      good: Has a reasonable measurement approach and some use for it.
      weak: Relies on impressions, or would use the data to assign blame.
    followups:
      - How would you get accurate data without adding admin for engineers?
      - What would you show the teams you depend on?
    common_errors:
      - Measuring so precisely that the tracking itself becomes overhead.
