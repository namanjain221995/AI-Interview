# Managerial round: resources and budget (part 4 of 4).
# Focus: communicating and negotiating resource trade-offs, portfolio balance, stopping work,
# delegating budget and coaching others to think about cost.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ easy
  - external_key: managerial.resources_budget.telling_team_project_deprioritised
    competency_key: communication
    topic: Telling a team its project lost priority
    difficulty: easy
    text: >-
      Tell me about a time you had to tell your team that a project they'd been working on was being
      deprioritised so resources could go elsewhere. How did you handle it?
    expected_concepts:
      - explaining the reason behind the decision
      - acknowledging the work already done
      - being clear about what happens to the work, paused or stopped
      - what the team will focus on next
      - answering questions and following up
    rubric:
      excellent: Describes a specific case where they explained the reasoning, recognised the work done, were clear about the project's status and the team's next focus, and followed up afterwards.
      good: Communicated the change clearly, but did not address what happens to the existing work or follow up.
      weak: Let the team hear indirectly, or gave no reason for the change.
    followups:
      - What question from the team was hardest to answer?
      - Did the project ever get picked up again?
    common_errors:
      - Leaving it unclear whether the project is paused or permanently stopped.

  - external_key: managerial.resources_budget.more_people_faster_myth
    competency_key: stakeholder_management
    topic: A stakeholder who thinks more people means faster delivery
    difficulty: easy
    text: >-
      A senior stakeholder says that if you just put more engineers on a project it will finish sooner. How do you
      respond when you think that isn't true for this project?
    expected_concepts:
      - explaining onboarding and coordination costs in plain terms
      - how splittable the remaining work actually is
      - offering options that do speed things up, such as scope changes
      - using evidence from past projects
      - agreeing a realistic plan together
    rubric:
      excellent: Explains coordination and ramp-up costs with evidence from the specific project, identifies whether any work can genuinely be parallelised and offers real alternatives such as scope changes.
      good: Explains the general problem clearly, but does not tie it to the specific project or offer alternatives.
      weak: Accepts the extra people without discussion, or refuses without explaining why.
    followups:
      - When would adding people actually help?
      - What evidence would you show the stakeholder?
    common_errors:
      - Rejecting extra help outright when some separable work could use it.

  - external_key: managerial.resources_budget.recording_resource_decisions
    competency_key: communication
    topic: Recording resource and budget decisions
    difficulty: easy
    text: >-
      How do you record decisions about where people and money go, so that months later people understand why the
      choice was made? Describe what you actually write down.
    expected_concepts:
      - a short written record of the decision and options considered
      - the reasoning and assumptions behind it
      - who was involved and who approved it
      - when and why it should be revisited
      - where the record lives so others can find it
    rubric:
      excellent: Describes a concrete, lightweight record capturing options, reasoning, assumptions, approvers and revisit triggers, and gives an example of it being useful later.
      good: Records decisions with reasoning, but misses assumptions or when to revisit.
      weak: Relies on meetings and memory, so the reasoning is lost over time.
    followups:
      - Tell me about a time a written record settled a later disagreement.
      - How do you keep it short enough that people actually read it?
    common_errors:
      - Recording only the outcome and not the assumptions it depended on.

  - external_key: managerial.resources_budget.asked_for_wrong_resources
    competency_key: ownership
    topic: Realising you asked for the wrong resources
    difficulty: easy
    text: >-
      Tell me about a time you asked for resources, people, money or time, and later realised you'd asked for the
      wrong thing or the wrong amount. What did you do?
    expected_concepts:
      - recognising the mismatch and what revealed it
      - telling the people who approved the request
      - adjusting the plan or returning what wasn't needed
      - understanding why the original request was wrong
      - changes to how they size requests now
    rubric:
      excellent: Describes a specific mismatch, raised it openly with approvers, adjusted or returned resources and explains a concrete change in how they size requests.
      good: Recognised and corrected the mismatch, but the lesson for future requests is vague.
      weak: Kept the mismatch quiet or cannot think of any example.
    followups:
      - How did the approver respond when you raised it?
      - What do you check now before making a request?
    common_errors:
      - Keeping excess resources quietly rather than releasing them.

  - external_key: managerial.resources_budget.working_with_finance_partners
    competency_key: collaboration
    topic: Working with finance and people partners on planning
    difficulty: easy
    text: >-
      How have you worked with your finance or people operations partners on budgets and headcount? What did you
      learn about their process that made you more effective?
    expected_concepts:
      - understanding their planning calendar and deadlines
      - the formats and level of detail they need
      - building a regular working relationship rather than only asking at deadlines
      - sharing early warnings about changes
      - an example where the relationship helped
    rubric:
      excellent: Shows clear understanding of finance and people partners' processes and constraints, describes a regular working relationship and gives a concrete example where it led to a better outcome.
      good: Works with these partners reasonably and understands some of their process, but the example is thin.
      weak: Only contacts them when something is urgent, or sees their process as an obstacle.
    followups:
      - What did you get wrong early on when working with finance?
      - What do they need from you that managers often forget?
    common_errors:
      - Sending requests at the last minute in a format finance can't use.

  - external_key: managerial.resources_budget.making_tradeoffs_visible
    competency_key: stakeholder_management
    topic: Making capacity trade-offs visible to stakeholders
    difficulty: easy
    text: >-
      How do you make it obvious to stakeholders that taking on one thing means something else slips? Describe a
      method or artifact you've actually used.
    expected_concepts:
      - a ranked list or roadmap showing what is above and below the line
      - showing the effect of a new request on existing items
      - a shared, regularly updated view rather than one-off emails
      - involving stakeholders in choosing what moves
    rubric:
      excellent: Describes a concrete shared artifact such as a ranked list with a visible cut line, shows how new requests are placed against it and gives an example of stakeholders choosing what moved.
      good: Uses a reasonable method to show trade-offs, but it is not kept current or shared widely.
      weak: Explains trade-offs only verbally when asked, so stakeholders are surprised later.
    followups:
      - What happened the first time someone saw their item drop below the line?
      - How often do you update it?
    common_errors:
      - Showing only what is planned, never what was traded away.

  # ------------------------------------------------------------ medium
  - external_key: managerial.resources_budget.peer_conflict_over_resource
    competency_key: collaboration
    topic: Resolving a resource conflict with a peer
    difficulty: medium
    text: >-
      Describe a time you and another manager or lead both needed the same scarce resource, like a platform team's
      time or a shared environment. How did you work it out between you?
    expected_concepts:
      - understanding the other side's needs and deadlines
      - finding shared priorities or company goals to decide by
      - creative options such as sequencing or sharing
      - escalating jointly only if needed
      - maintaining the working relationship
    rubric:
      excellent: Describes a real conflict where they understood the peer's needs, used shared goals to decide, found a creative option or sequencing and escalated jointly only when necessary.
      good: Resolved the conflict sensibly, but mostly argued for their own side.
      weak: Escalated straight away, or won the resource without regard for the peer's needs.
    followups:
      - What did the other person need that you hadn't realised?
      - How is your relationship with that person now?
    common_errors:
      - Escalating separately to a shared manager instead of working it out together first.

  - external_key: managerial.resources_budget.escalating_resource_conflict
    competency_key: stakeholder_management
    topic: Escalating a resource conflict well
    difficulty: medium
    text: >-
      Tell me about a time you had to escalate a resource conflict to a more senior leader. How did you frame it,
      and what happened?
    expected_concepts:
      - trying to resolve it at their own level first
      - a neutral description of the options and trade-offs
      - a clear recommendation
      - informing the other party before escalating
      - accepting and acting on the decision
    rubric:
      excellent: Describes an escalation after a real attempt to resolve it, framed neutrally with options, trade-offs and a recommendation, with the other party informed and the decision acted on.
      good: Escalated with a clear description of the problem, but without options or a recommendation.
      weak: Escalated to win an argument, or framed it one-sidedly without telling the other party.
    followups:
      - How did the other party feel about the escalation?
      - What would you do differently next time?
    common_errors:
      - Bringing a complaint rather than a decision that needs to be made.

  - external_key: managerial.resources_budget.coaching_leads_on_cost
    competency_key: mentoring
    topic: Coaching leads to weigh cost and resources
    difficulty: medium
    text: >-
      How have you helped tech leads or senior engineers on your team get better at thinking about cost and
      resource trade-offs, not only technical ones? Give me an example.
    expected_concepts:
      - involving them in real budget or staffing decisions
      - sharing cost and capacity data openly
      - asking them to include cost and effort in proposals
      - giving feedback on their trade-off reasoning
      - visible change in how they made decisions
    rubric:
      excellent: Describes a specific person, how they were involved in real decisions with access to data, the feedback given on their reasoning and a visible change in how they later made trade-offs.
      good: Gives a reasonable example of involving leads in trade-offs, but the change in their behaviour is unclear.
      weak: Keeps resource decisions to themselves and has no example of developing others in this area.
    followups:
      - What did that person get wrong at first?
      - How did you decide how much financial information to share?
    common_errors:
      - Expecting leads to make cost-aware decisions without ever giving them cost data.

  - external_key: managerial.resources_budget.running_quarterly_planning
    competency_key: project_management
    topic: Running quarterly planning with more asks than capacity
    difficulty: medium
    text: >-
      Walk me through how you ran your most recent quarterly planning when there were far more requests than
      capacity. How did the final plan come together?
    expected_concepts:
      - gathering requests with a clear statement of value
      - estimating capacity realistically, including run and support work
      - ranking with stakeholders using agreed criteria
      - a cut line with explicit not-doing list
      - mid-quarter checkpoints to adjust
    rubric:
      excellent: Describes a concrete planning process from intake through realistic capacity, ranking with stakeholders and an explicit not-doing list, plus checkpoints to adjust mid-quarter.
      good: Describes a reasonable process with ranking and capacity, but no explicit not-doing list or checkpoints.
      weak: Describes a plan that included everything, or a process where priorities were set by whoever pushed hardest.
    followups:
      - What ended up below the line, and who objected?
      - How accurate was the capacity estimate by the end of the quarter?
    common_errors:
      - Planning to one hundred percent of capacity with no room for the unplanned.

  - external_key: managerial.resources_budget.blocked_by_team_without_capacity
    competency_key: collaboration
    topic: Depending on a team with no capacity for you
    difficulty: medium
    text: >-
      Your project depends on a change from another team, and they tell you they have no capacity for it this
      quarter. What options would you explore?
    expected_concepts:
      - understanding their priorities and constraints
      - making the business impact of the dependency visible
      - offering to do the work under their review
      - adjusting your own plan or design to remove the dependency
      - escalating through priorities if the impact justifies it
    rubric:
      excellent: Explores several realistic options including contributing the work under their review, redesigning to remove the dependency and making impact visible, escalating only when justified by impact.
      good: Proposes reasonable options, but relies mainly on escalation.
      weak: Waits for the other team or escalates immediately without exploring alternatives.
    followups:
      - What would the other team need to be comfortable with you doing the work?
      - When would you escalate?
    common_errors:
      - Making changes in another team's system without agreeing ownership and review.

  - external_key: managerial.resources_budget.lending_engineers_out
    competency_key: leadership
    topic: Lending engineers to another team
    difficulty: medium
    text: >-
      Tell me about a time you lent people from your team to another team for a while. How did you agree the terms,
      and how did it go for everyone involved?
    expected_concepts:
      - clear scope, duration and return date
      - how the lent engineers would be supported and given feedback
      - adjusting your own team's commitments
      - choosing people for whom it was also a growth opportunity
      - reviewing how it went at the end
    rubric:
      excellent: Describes an arrangement with clear scope and end date, support for the people involved, adjusted commitments on their own team and a review of the outcome for both teams and the individuals.
      good: Agreed reasonable terms and it worked out, but adjustments to their own commitments or support for individuals are thin.
      weak: Lent people informally with no end date, or chose people based only on who was least needed.
    followups:
      - How did you make sure the lent engineers got credit for their work?
      - What would you put in writing next time?
    common_errors:
      - Lending people indefinitely so the arrangement silently becomes a transfer.

  - external_key: managerial.resources_budget.exploration_time_under_pressure
    competency_key: leadership
    topic: Protecting time for exploration
    difficulty: medium
    text: >-
      When delivery pressure is high, time for exploration and improvement is usually the first thing to go. How
      have you protected some of it, and what came out of it?
    expected_concepts:
      - a deliberate, bounded allocation of time
      - linking exploration to team or business problems
      - making results visible to stakeholders
      - adjusting the allocation when pressure peaks rather than abandoning it
      - concrete results that came from it
    rubric:
      excellent: Describes a deliberate, bounded allocation tied to real problems, how it was defended and made visible, and concrete results that justified the time.
      good: Protected some exploration time with a reasonable result, but the link to business problems or visibility is weak.
      weak: Exploration only happens when there is nothing else to do, or the time had no visible outcome.
    followups:
      - What result convinced stakeholders it was worth it?
      - When did you have to suspend it?
    common_errors:
      - Allocating exploration time with no link to problems the team or business actually has.

  - external_key: managerial.resources_budget.checking_reallocation_paid_off
    competency_key: ownership
    topic: Checking whether a reallocation paid off
    difficulty: medium
    text: >-
      After you've moved people or money from one area to another, how do you check whether it was the right call?
      Tell me about one you reviewed.
    expected_concepts:
      - expected outcomes defined at the time of the decision
      - measuring results in both the area that gained and the area that lost
      - a set point in time for the review
      - acting on the result, including reversing if needed
      - sharing the findings
    rubric:
      excellent: Describes a specific reallocation with expected outcomes set in advance, measured effects in both areas at a set review point and acted on what they found.
      good: Reviewed the result of a reallocation, but only looked at the area that gained or had no predefined expectations.
      weak: Never checked whether the decision worked.
    followups:
      - What happened in the area that lost people or money?
      - Did you change anything after the review?
    common_errors:
      - Ignoring the slow decline in the area resources were taken from.

  - external_key: managerial.resources_budget.stretch_assignment_on_deadline
    competency_key: people_management
    topic: Stretch assignments on deadline-critical work
    difficulty: medium
    text: >-
      Tell me about a time you gave someone a stretch assignment on work that had a real deadline, when a more
      experienced person could have done it faster. How did you manage the risk?
    expected_concepts:
      - why the stretch was worth it for the person and the team
      - support such as pairing, check-ins or a named backup
      - early checkpoints to spot trouble
      - being clear with the person about the support available
      - the result for the work and the person's growth
    rubric:
      excellent: Explains why the stretch was worthwhile, put concrete support and early checkpoints in place, and reports both the delivery outcome and the person's growth.
      good: Gives a real example with some support, but checkpoints or reflection on the outcome are thin.
      weak: Gave the assignment with no support, or always gives deadline work to the most experienced person.
    followups:
      - What would have made you step in?
      - How did the experienced person feel about not getting the work?
    common_errors:
      - Taking the work back at the first difficulty instead of coaching through it.

  - external_key: managerial.resources_budget.too_many_systems_small_team
    competency_key: project_management
    topic: A small team owning too many systems
    difficulty: medium
    text: >-
      Imagine a team of five owns a dozen services, and most of its time goes on keeping them running. How would
      you approach reducing that load?
    expected_concepts:
      - inventory of systems with usage, cost and toil
      - options to retire, consolidate, simplify or hand off ownership
      - negotiating ownership transfers with other teams
      - reducing toil through automation for the systems that stay
      - measuring freed capacity
    rubric:
      excellent: Starts with an inventory of toil and value, considers retiring, consolidating, automating and handing off, negotiates transfers fairly and measures the capacity freed.
      good: Proposes reasonable reductions such as automation, but misses retirement or ownership changes.
      weak: Asks for more people as the only answer, or accepts the load as normal.
    followups:
      - Which service would you look at first, and why?
      - How would you convince another team to take one on?
    common_errors:
      - Handing systems to other teams without the knowledge and runbooks to run them.

  - external_key: managerial.resources_budget.fixed_price_contract_risk
    competency_key: project_management
    topic: Managing resource risk on a fixed-price, fixed-date project
    difficulty: medium
    text: >-
      Tell me about a project delivered under a fixed price and a fixed date, such as client work. How did you
      manage people and scope so you stayed within both?
    expected_concepts:
      - a clear, written scope baseline
      - a change control process with cost and time impact
      - tracking burn against budget weekly
      - early identification of overrun risk
      - keeping the client informed of trade-offs
    rubric:
      excellent: Describes a real fixed-price project with a clear scope baseline, change control tied to cost and time, regular burn tracking and early, open conversations with the client about trade-offs.
      good: Managed scope and budget reasonably, but change control or burn tracking was informal.
      weak: Absorbed every change request to keep the client happy, leading to overrun.
    followups:
      - What change request did you push back on?
      - How did you track spend week to week?
    common_errors:
      - Accepting small changes without recording them until they add up to a large overrun.

  - external_key: managerial.resources_budget.investing_in_developer_productivity
    competency_key: leadership
    topic: Investing in developer productivity
    difficulty: medium
    text: >-
      How have you decided how much of your team's capacity to put into improving developer productivity, like
      faster builds or better test environments? Tell me about a specific investment.
    expected_concepts:
      - measuring the current friction, such as build times or waiting time
      - estimating the return across the whole team
      - competing with feature work for the same capacity
      - agreeing the investment with product partners
      - measuring the improvement afterwards
    rubric:
      excellent: Describes a specific investment justified by measured friction and an estimated return, agreed with product partners against feature work and measured afterwards.
      good: Made a reasonable investment with some justification, but did not measure before or after.
      weak: Invested on preference without evidence, or never makes time for such work.
    followups:
      - How did you convince product it was worth the time?
      - What did the numbers look like afterwards?
    common_errors:
      - Assuming the benefit is obvious and never measuring it.

  - external_key: managerial.resources_budget.hire_or_upskill
    competency_key: mentoring
    topic: Hiring a specialist versus developing existing staff
    difficulty: medium
    text: >-
      Your team needs a skill it doesn't really have yet, say machine learning or a new platform. How would you
      decide between hiring a specialist and developing people already on the team?
    expected_concepts:
      - how quickly and how deeply the skill is needed
      - interest and aptitude on the existing team
      - time and cost of training compared with hiring
      - using a specialist to raise the team's skills
      - combining both, such as one hire plus structured learning
    rubric:
      excellent: Weighs urgency and depth of need against existing interest and training cost, considers how a hire could raise the whole team and proposes a combined plan where appropriate.
      good: Compares hiring and training reasonably, but treats them as either-or.
      weak: Defaults to hiring for every new skill, or assumes people will learn on their own time.
    followups:
      - Have you done this before? What did you choose?
      - How would you support someone learning the skill on the job?
    common_errors:
      - Expecting people to pick up a demanding new skill with no time allocated for learning.

  # ------------------------------------------------------------ hard
  - external_key: managerial.resources_budget.delegating_budget_ownership
    competency_key: leadership
    topic: Delegating budget ownership to a sub-team lead
    difficulty: hard
    text: >-
      Suppose you want to hand ownership of part of your budget to one of your team leads. How would you set it up
      so they have real authority without the spending getting out of hand?
    expected_concepts:
      - clear scope and limits of what they control
      - decision rights and thresholds that need approval
      - regular visibility of spend against plan
      - coaching on making and explaining trade-offs
      - backing their decisions publicly while reviewing privately
    rubric:
      excellent: Defines clear scope, thresholds and decision rights, sets up regular visibility, coaches the lead on trade-offs and supports their decisions while reviewing together.
      good: Sets reasonable limits and oversight, but gives little thought to coaching or real authority.
      weak: Delegates without limits or visibility, or keeps approving every item so nothing is really delegated.
    followups:
      - What threshold would you set for decisions that need your approval?
      - What would you do if they made a decision you disagreed with?
    common_errors:
      - Delegating responsibility for the budget but not the authority to make decisions.

  - external_key: managerial.resources_budget.short_term_long_term_portfolio
    competency_key: leadership
    topic: Balancing short-term delivery against long-term bets
    difficulty: hard
    text: >-
      How do you decide how much of your organisation's capacity goes to near-term commitments versus longer-term
      bets that may not pay off for a year or more? Tell me how you've set that balance.
    expected_concepts:
      - an explicit split across time horizons
      - how the split relates to company strategy and stage
      - criteria and checkpoints for continuing or stopping bets
      - protecting long-term work from being raided
      - adjusting the split based on results and context
    rubric:
      excellent: Describes an explicit split tied to strategy, with checkpoints to continue or stop long-term bets, protection from short-term pressure and a real example of adjusting the balance.
      good: Has a deliberate balance with reasons, but checkpoints or protection are vague.
      weak: Long-term work only happens when there is spare time, or bets continue with no review.
    followups:
      - Tell me about a long-term bet you stopped. What signal told you?
      - How do you defend that capacity when a big customer request arrives?
    common_errors:
      - Funding long-term bets with no checkpoints, so they run on indefinitely.

  - external_key: managerial.resources_budget.stopping_project_midway
    competency_key: leadership
    topic: Stopping a project midway to redirect resources
    difficulty: hard
    text: >-
      Tell me about a time you stopped or recommended stopping a project that was already well underway, so the
      people and money could go elsewhere. How did you reach that decision?
    expected_concepts:
      - evidence that the expected value had changed
      - ignoring effort already spent when deciding
      - involving sponsors and the team in the decision
      - wrapping up cleanly and preserving useful work
      - redeploying people thoughtfully
    rubric:
      excellent: Describes a real stop driven by evidence of changed value, explicitly set aside sunk effort, involved sponsors and the team, wrapped up cleanly and redeployed people with care.
      good: Made a well-reasoned decision, but the wrap-up or redeployment was not well handled.
      weak: Kept going because of effort already invested, or stopped abruptly without explanation.
    followups:
      - What made it hard to stop?
      - What did you keep from the work?
    common_errors:
      - Continuing a project because of how much has already been spent.

  - external_key: managerial.resources_budget.compliance_work_squeeze
    competency_key: stakeholder_management
    topic: Mandatory compliance work consuming capacity
    difficulty: hard
    text: >-
      A new compliance requirement will take about forty percent of your team's capacity next quarter, and product
      commitments are already set. How would you handle it with your stakeholders?
    expected_concepts:
      - confirming the real scope and deadline of the requirement
      - looking for ways to reduce the effort, such as reuse or phasing
      - re-planning product commitments explicitly
      - aligning stakeholders and leadership on what moves
      - tracking compliance progress openly
    rubric:
      excellent: Validates the real scope and deadline, looks for ways to reduce effort, re-plans product commitments explicitly with stakeholders and leadership and tracks progress openly.
      good: Re-plans and informs stakeholders sensibly, but does not challenge the scope or look for efficiencies.
      weak: Tries to do everything at once, or treats compliance work as optional.
    followups:
      - Who would decide which product commitment moves?
      - How would you check whether forty percent is really the right estimate?
    common_errors:
      - Accepting the first estimate of compliance effort without checking what is actually required.

  - external_key: managerial.resources_budget.pitching_new_team_funding
    competency_key: communication
    topic: Pitching executives to fund a new team
    difficulty: hard
    text: >-
      If you had to convince executives to fund a brand new team, how would you structure the pitch? Tell me about
      a time you did something similar if you have.
    expected_concepts:
      - the business problem and why now
      - expected outcomes and how they will be measured
      - cost, phasing and the smallest viable starting team
      - risks and what happens if nothing is done
      - checkpoints where funding can be reviewed
    rubric:
      excellent: Structures the pitch around a business problem and timing, measurable outcomes, phased cost starting small, risks of inaction and review checkpoints, ideally drawing on a real experience.
      good: Covers the business case and cost clearly, but omits phasing, risks or checkpoints.
      weak: Focuses on technical interest or the team's wishes rather than business outcomes.
    followups:
      - What would you offer if they would only fund half of it?
      - What question from executives would you prepare for most?
    common_errors:
      - Asking for the full team up front with no smaller first phase.

  - external_key: managerial.resources_budget.replanning_after_departures
    competency_key: leadership
    topic: Re-planning after losing several team members
    difficulty: hard
    text: >-
      Imagine three of your eight engineers move on within two months. How would you re-plan the team's
      commitments and keep critical systems safe?
    expected_concepts:
      - identifying knowledge and ownership gaps immediately
      - prioritising operational safety of critical systems
      - re-planning commitments and informing stakeholders
      - sustainable workload for the remaining team
      - backfill plan and interim help
      - understanding whether there is a common cause behind the departures
    rubric:
      excellent: Moves quickly to cover knowledge and operational gaps, re-plans commitments openly with stakeholders, keeps the remaining team's workload sustainable, sets up backfills and interim help and looks for any common cause.
      good: Re-plans sensibly and covers critical systems, but ignores workload on the remaining team or possible common causes.
      weak: Keeps all commitments and expects the remaining five to cover everything.
    followups:
      - What would you ask the departing engineers to do before they go?
      - How would you find out whether something on the team caused the departures?
    common_errors:
      - Overloading the remaining team, which leads to further departures.
