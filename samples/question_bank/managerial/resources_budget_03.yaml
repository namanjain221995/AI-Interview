# Managerial round: resources and budget (part 3 of 4).
# Focus: build versus buy, vendor selection and management, open source, contractors and outsourcing.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ easy
  - external_key: managerial.resources_budget.vendor_trial_success_criteria
    competency_key: project_management
    topic: Defining success before a vendor trial
    difficulty: easy
    text: >-
      When your team trials a paid product before buying it, how do you decide up front what the trial needs to
      show? Tell me about one you ran.
    expected_concepts:
      - a short list of must-have requirements
      - realistic test cases using real workloads or data
      - who evaluates and how results are recorded
      - a fixed trial length and decision date
      - the decision that came out of the trial
    rubric:
      excellent: Describes a real trial with must-have criteria and realistic test cases agreed beforehand, a fixed decision date and a clear decision based on the results.
      good: Ran a trial with some criteria and reached a decision, but the criteria were loose or set late.
      weak: Let people try the tool informally and decided on general impressions.
    followups:
      - What did the trial reveal that the sales demo didn't?
      - Who had the final say?
    common_errors:
      - Testing with toy examples instead of the team's real workload.

  - external_key: managerial.resources_budget.engineers_want_to_build
    competency_key: leadership
    topic: Engineers keen to build something you could buy
    difficulty: easy
    text: >-
      Your engineers are excited to build an internal tool, but you know a decent product already exists that does
      most of it. How do you handle that conversation with them?
    expected_concepts:
      - taking their reasons seriously and checking for real gaps
      - comparing the full cost of building and maintaining with buying
      - focusing the team's effort on what differentiates the product
      - involving the team in the evaluation
      - explaining the final decision and its reasoning
    rubric:
      excellent: Listens for genuine gaps, involves the team in a fair comparison that includes long-term maintenance, connects the decision to where the team adds most value and explains the outcome clearly.
      good: Explains the trade-offs reasonably, but makes the decision without involving the team.
      weak: Overrules the team with no discussion, or agrees to build because the team wants to.
    followups:
      - What would convince you that building is actually the right call?
      - How do you keep the team motivated if you decide to buy?
    common_errors:
      - Comparing build effort with purchase price but ignoring years of maintenance.

  - external_key: managerial.resources_budget.explaining_buy_after_prototype
    competency_key: communication
    topic: Explaining a buy decision after the team prototyped
    difficulty: easy
    text: >-
      Imagine your team spent a few weeks prototyping something, and then you decide to buy a product instead.
      How would you explain that decision to them?
    expected_concepts:
      - recognising the value of what the prototype taught
      - clear reasons for the decision
      - how their learning shapes the purchase and integration
      - what the team will work on next
      - inviting questions and concerns
    rubric:
      excellent: Acknowledges what the prototype contributed, gives clear reasons, shows how the team's learning feeds into evaluation and integration and makes their next focus clear.
      good: Explains the reasons clearly, but does not connect the prototype's learning to what happens next.
      weak: Announces the change with no reasoning, or implies the prototype was wasted effort.
    followups:
      - How would you reuse what the prototype taught you?
      - What would you do if the team strongly disagreed?
    common_errors:
      - Treating the prototype as wasted work instead of useful learning.

  - external_key: managerial.resources_budget.small_tool_purchase
    competency_key: project_management
    topic: Proportionate decisions on small purchases
    difficulty: easy
    text: >-
      A teammate asks for a paid tool that costs a few hundred a year. How do you decide quickly without either
      rubber-stamping everything or creating a lot of process?
    expected_concepts:
      - a lightweight checklist proportionate to the cost
      - checking for overlap with tools already paid for
      - basic security and data handling questions
      - a named owner for the subscription
      - reviewing small subscriptions periodically
    rubric:
      excellent: Describes a quick, proportionate check covering overlap, security and ownership, and a periodic review so small subscriptions don't pile up.
      good: Uses a sensible quick check, but misses either security or ongoing review.
      weak: Either approves everything without thought or applies the same heavy process as a large purchase.
    followups:
      - At what cost or risk level would you add more process?
      - How do you find subscriptions nobody uses anymore?
    common_errors:
      - Ignoring data handling because the tool is cheap.

  - external_key: managerial.resources_budget.contractor_knowledge_retention
    competency_key: mentoring
    topic: Keeping knowledge when contractors leave
    difficulty: easy
    text: >-
      When contractors have worked on your systems for a while and their contract is ending, how do you make sure
      the knowledge stays with your team? Tell me what you've done.
    expected_concepts:
      - pairing permanent staff with contractors throughout, not just at the end
      - permanent staff owning reviews and key decisions
      - documentation and runbooks as part of the work
      - a structured handover period
      - checking that the team can operate the systems alone
    rubric:
      excellent: Describes practices from the start of the engagement such as pairing and permanent ownership of reviews, a structured handover and verification that the team could operate the systems alone.
      good: Arranged a reasonable handover with documentation, but started late in the engagement.
      weak: Asked for documentation in the final week and assumed that was enough.
    followups:
      - What knowledge was hardest to transfer?
      - How did you test the handover worked?
    common_errors:
      - Leaving knowledge transfer until the last days of the contract.

  - external_key: managerial.resources_budget.vendor_relationship_owner
    competency_key: ownership
    topic: Owning a vendor relationship day to day
    difficulty: easy
    text: >-
      Once your team depends on an external vendor, who owns that relationship day to day, and what does that
      owner actually do? Describe how you've set this up.
    expected_concepts:
      - a named owner on the team
      - tracking the vendor's performance and support issues
      - knowing renewal dates and contract terms
      - regular check-ins and escalation paths
      - a backup owner so the knowledge isn't held by one person
    rubric:
      excellent: Describes a named owner with clear duties covering performance, support, renewals and escalations, plus a backup and a regular review rhythm.
      good: Has an owner and some routine, but renewals or escalation are not covered.
      weak: Nobody clearly owns the relationship, and problems are handled ad hoc when something breaks.
    followups:
      - What went wrong before you put an owner in place?
      - How does that owner escalate when the vendor isn't responsive?
    common_errors:
      - Discovering a renewal only after it has automatically renewed.

  # ------------------------------------------------------------ medium
  - external_key: managerial.resources_budget.build_buy_decision_outcome
    competency_key: leadership
    topic: A build versus buy decision and how it turned out
    difficulty: medium
    text: >-
      Tell me about a real build versus buy decision you led or strongly influenced. What did you choose, and
      looking back now, was it the right call?
    expected_concepts:
      - the capability needed and how central it was to the business
      - options compared, including full ownership costs
      - who was involved in the decision
      - how the decision played out over time
      - lessons applied to later decisions
    rubric:
      excellent: Describes a specific decision with a real comparison of options and long-term costs, explains who was involved, reflects candidly on how it played out and names lessons that changed later decisions.
      good: Gives a clear example with reasonable comparison and outcome, but reflection is shallow.
      weak: Describes the decision without the reasoning behind it, or cannot say how it turned out.
    followups:
      - What cost did you underestimate?
      - What would have had to be different for you to choose the other option?
    common_errors:
      - Judging the decision only by how fast the first version shipped.

  - external_key: managerial.resources_budget.vendor_total_cost
    competency_key: project_management
    topic: Working out the true cost of a vendor product
    difficulty: medium
    text: >-
      Beyond the licence price, what costs do you look at when deciding whether a vendor product is worth it?
      Walk me through a case where those extra costs changed the picture.
    expected_concepts:
      - integration and migration effort
      - ongoing administration and support time
      - how pricing scales with usage or team growth
      - training and change management
      - exit and switching costs
    rubric:
      excellent: Covers integration, operation, scaling of pricing, training and exit costs, and gives a real case where these changed the decision or the negotiation.
      good: Names several hidden costs sensibly, but the example is thin or hypothetical.
      weak: Compares licence prices only.
    followups:
      - How do you estimate how the price will grow with usage?
      - Which of those costs is usually largest in your experience?
    common_errors:
      - Ignoring how per-seat or usage pricing grows as the company grows.

  - external_key: managerial.resources_budget.in_house_tool_hidden_cost
    competency_key: ownership
    topic: An in-house tool that cost more than expected
    difficulty: medium
    text: >-
      Tell me about an internal tool or system your team built that ended up costing far more to maintain than
      anyone expected. How did you discover it, and what did you do?
    expected_concepts:
      - signals such as on-call load, bug backlog or engineer time spent
      - measuring the actual ongoing cost
      - options such as simplifying, replacing or continuing with eyes open
      - making the case to stakeholders
      - what changed in future build decisions
    rubric:
      excellent: Describes how the hidden cost was discovered and measured, evaluated realistic options, made a clear case to stakeholders and changed how future build decisions account for maintenance.
      good: Recognised and addressed the cost sensibly, but measurement or the lasting lesson is thin.
      weak: Accepts the cost as unavoidable, or cannot describe how it was measured.
    followups:
      - How much engineering time was it really taking?
      - Who had to agree before you changed course?
    common_errors:
      - Continuing to invest because of the effort already spent.

  - external_key: managerial.resources_budget.running_vendor_selection
    competency_key: project_management
    topic: Running a vendor selection process
    difficulty: medium
    text: >-
      Walk me through a vendor selection you ran from start to finish. How did you narrow down options, and who
      did you involve along the way?
    expected_concepts:
      - requirements gathered from real users and stakeholders
      - weighted criteria agreed before seeing demos
      - involving security, legal, finance and procurement at the right time
      - reference checks with other customers
      - a documented decision with reasons
    rubric:
      excellent: Describes a structured selection with requirements from real users, weighted criteria agreed in advance, the right functions involved at the right time, reference checks and a documented decision.
      good: Ran a reasonable process with criteria and stakeholders, but some steps such as references or documentation were skipped.
      weak: Chose based on a demo or a single person's preference.
    followups:
      - What criterion turned out to matter most?
      - What did you learn from the reference calls?
    common_errors:
      - Setting criteria after demos, which lets the best salesperson win.

  - external_key: managerial.resources_budget.renewal_price_increase
    competency_key: stakeholder_management
    topic: Preparing for a renewal with a price increase
    difficulty: medium
    text: >-
      A key vendor tells you the renewal price is going up by forty percent. How would you prepare for that
      negotiation, and what options would you put on the table?
    expected_concepts:
      - understanding actual usage and what is really needed
      - knowing realistic alternatives and switching cost
      - working with procurement or finance
      - options such as fewer seats, a different tier, longer terms or phased increases
      - deciding a walk-away point in advance
    rubric:
      excellent: Prepares with actual usage data and realistic alternatives, works with procurement, proposes concrete options and decides a walk-away point before negotiating.
      good: Proposes reasonable options and some preparation, but lacks usage data or a clear alternative.
      weak: Accepts the increase or threatens to leave without a credible alternative.
    followups:
      - How would you make your alternative credible?
      - What would you do if they refused to move?
    common_errors:
      - Negotiating without knowing how many licences are actually used.

  - external_key: managerial.resources_budget.vendor_not_delivering
    competency_key: stakeholder_management
    topic: Handling a vendor that isn't delivering
    difficulty: medium
    text: >-
      Tell me about a time a vendor or external partner wasn't delivering what had been agreed. How did you handle
      it?
    expected_concepts:
      - evidence of the gap against the contract or agreed expectations
      - raising it directly and early with the vendor
      - escalation using contract terms or account management
      - protecting your own commitments in the meantime
      - the outcome and whether the relationship continued
    rubric:
      excellent: Describes a specific gap backed by evidence, raised it early and directly, escalated appropriately using the contract, protected their own commitments and reports the outcome.
      good: Raised the issue and reached a resolution, but evidence or protection of their own commitments was thin.
      weak: Complained internally without raising it with the vendor, or let the problem continue.
    followups:
      - What did the contract say, and did it help?
      - What did you change in later vendor agreements?
    common_errors:
      - Waiting too long because the relationship felt awkward to challenge.

  - external_key: managerial.resources_budget.open_source_or_commercial
    competency_key: leadership
    topic: Open source versus a commercially supported product
    difficulty: medium
    text: >-
      When you're choosing between running an open source tool yourselves and paying for a commercial or hosted
      version, how do you make that call? Give me an example.
    expected_concepts:
      - team skills and time to operate it well
      - support, security patching and upgrade burden
      - cost at current and expected scale
      - licence terms and project health
      - how the decision held up later
    rubric:
      excellent: Gives a real example comparing operating burden, skills, patching, cost at scale and licence terms, and reflects on how the choice held up.
      good: Weighs several relevant factors in a real example, but misses operating burden or licensing.
      weak: Chooses open source because it is free, or commercial because it is safer, with no analysis.
    followups:
      - Who on the team ended up operating it?
      - What would make you switch?
    common_errors:
      - Treating open source as free while ignoring the cost of running it.

  - external_key: managerial.resources_budget.fork_or_upstream
    competency_key: leadership
    topic: Needing changes in an open source dependency
    difficulty: medium
    text: >-
      Your team relies heavily on an open source project, and you need changes it doesn't have. How would you
      decide between contributing upstream, maintaining a fork or paying someone for support?
    expected_concepts:
      - how fast the change is needed and how big it is
      - long-term cost of carrying a fork
      - the maintainers' responsiveness and direction
      - time to budget for upstream contribution
      - commercial support or sponsorship as an option
    rubric:
      excellent: Compares urgency against the long-term burden of a fork, considers maintainers' direction, budgets time for upstream work and treats paid support or sponsorship as a real option.
      good: Weighs fork against upstream sensibly, but ignores paid options or long-term cost.
      weak: Forks without considering the cost of keeping it current.
    followups:
      - Have you lived with a fork before? What did it cost?
      - How would you justify engineer time spent on upstream work?
    common_errors:
      - Underestimating the work of keeping a fork up to date with upstream releases.

  - external_key: managerial.resources_budget.overlapping_tools_cleanup
    competency_key: ownership
    topic: Consolidating overlapping tools
    difficulty: medium
    text: >-
      Tell me about a time you found several teams paying for overlapping tools that did roughly the same job.
      What did you do about it?
    expected_concepts:
      - building an inventory of tools, cost and usage
      - understanding why teams chose different tools
      - choosing a standard with input from users
      - migration support and timeline
      - the savings and lessons for future purchasing
    rubric:
      excellent: Built an inventory, understood real reasons for different choices, agreed a standard with users, supported migration and reports the saving and a lasting purchasing change.
      good: Consolidated tools sensibly, but without much user input or migration support.
      weak: Mandated a single tool overnight, or noticed the overlap but did nothing.
    followups:
      - Which team resisted the most, and why?
      - How do you stop the overlap from growing back?
    common_errors:
      - Forcing a standard that misses a real need some teams had.

  - external_key: managerial.resources_budget.procurement_timeline
    competency_key: collaboration
    topic: Getting a purchase through security, legal and procurement
    difficulty: medium
    text: >-
      Buying a new tool often needs approval from security, legal and procurement, and it can take months. How
      have you kept that process moving without cutting corners?
    expected_concepts:
      - involving those teams early rather than at the end
      - preparing the information they need in advance
      - running reviews in parallel where possible
      - understanding and respecting their concerns
      - planning project timelines around realistic approval time
    rubric:
      excellent: Describes engaging security, legal and procurement early with prepared information, running reviews in parallel, addressing their concerns and building realistic approval time into the plan.
      good: Worked with the teams constructively, but engaged them late or did not plan for the timeline.
      weak: Treats those teams as obstacles, or tries to bypass them.
    followups:
      - What did security ask that you hadn't expected?
      - How did the approval time affect your project plan?
    common_errors:
      - Starting procurement after the project has already committed to a launch date.

  - external_key: managerial.resources_budget.underestimated_integration
    competency_key: project_management
    topic: Underestimated integration effort for a bought product
    difficulty: medium
    text: >-
      Tell me about a time you bought a product expecting it to save effort, and integrating it turned out much
      harder than planned. What happened, and what did you learn?
    expected_concepts:
      - where the integration effort was underestimated
      - how the problem surfaced
      - decisions made, such as pushing on, simplifying or changing vendor
      - communicating the impact to stakeholders
      - how future evaluations changed
    rubric:
      excellent: Describes a specific case, explains what was underestimated and why, the decisions taken and how stakeholders were informed, and how later evaluations changed as a result.
      good: Clear example with a reasonable response, but the lesson is general.
      weak: Blames the vendor entirely without examining their own evaluation.
    followups:
      - What would a better evaluation have checked?
      - Did you ever consider walking away from the product?
    common_errors:
      - Evaluating features in isolation instead of in the team's real environment.

  - external_key: managerial.resources_budget.managing_external_agency
    competency_key: stakeholder_management
    topic: Managing an external development agency
    difficulty: medium
    text: >-
      Tell me about a time you worked with an external agency or outsourced team to build something. How did you
      manage quality and keep the work aligned with what your company needed?
    expected_concepts:
      - clear scope, acceptance criteria and definition of done
      - regular demos and reviews of real working software
      - code review and engineering standards applied to their work
      - a single point of contact and decision maker on your side
      - planning for ownership after the engagement ends
    rubric:
      excellent: Describes a real engagement with clear acceptance criteria, frequent working demos, shared engineering standards, clear decision making on their side and a plan for ownership afterwards.
      good: Managed the engagement reasonably with regular check-ins, but quality controls or the post-engagement plan are thin.
      weak: Handed over a specification and waited for delivery.
    followups:
      - What problem did you catch early because of the demos?
      - Who maintains that code now?
    common_errors:
      - Treating outsourced work as done when delivered, without planning who maintains it.

  # ------------------------------------------------------------ hard
  - external_key: managerial.resources_budget.reversing_build_buy
    competency_key: ownership
    topic: Reversing an earlier build or buy decision
    difficulty: hard
    text: >-
      Tell me about a time you reversed an earlier decision, such as replacing an in-house system with a vendor
      product or bringing something in-house that you'd been buying. Why did you change course, and how did you
      manage the switch?
    expected_concepts:
      - what changed since the original decision
      - evidence used to justify switching
      - full migration cost and risk
      - getting agreement from people invested in the original choice
      - a phased migration with rollback options
      - the result after the switch
    rubric:
      excellent: Explains clearly what changed, backs the switch with evidence, accounts for full migration cost and risk, handles people invested in the original decision and runs a phased migration with a reported result.
      good: Gives a real reversal with sound reasoning, but migration risk or stakeholder handling is thin.
      weak: Describes a switch driven by preference or fashion, or one with no migration planning.
    followups:
      - Who had made the original decision, and how did you handle that?
      - What was the hardest part of the migration?
    common_errors:
      - Assuming the original decision was a mistake rather than recognising that circumstances changed.

  - external_key: managerial.resources_budget.vendor_lock_in
    competency_key: leadership
    topic: Weighing vendor lock-in
    difficulty: hard
    text: >-
      When you're about to depend heavily on one vendor, how do you think about lock-in, and what, if anything,
      do you do to protect yourselves? Give me a real example.
    expected_concepts:
      - identifying which parts of the dependency are hard to reverse
      - deciding where lock-in is an acceptable price for speed
      - abstractions or data export kept where they pay off
      - contract terms covering data, pricing and exit
      - a realistic exit plan rather than full portability everywhere
    rubric:
      excellent: Distinguishes acceptable from risky lock-in in a real case, protects the critical parts with proportionate measures such as data export and contract terms, and has a realistic exit plan without over-engineering portability.
      good: Recognises lock-in risk and takes some sensible steps, but treats all lock-in the same way.
      weak: Either ignores lock-in or insists on full portability regardless of cost.
    followups:
      - Where did you decide lock-in was worth accepting?
      - How long would it really take you to leave that vendor?
    common_errors:
      - Building heavy abstraction layers that cost more than the lock-in they avoid.

  - external_key: managerial.resources_budget.vendor_ending_product
    competency_key: problem_solving
    topic: A critical vendor discontinuing its product
    difficulty: hard
    text: >-
      A vendor your core product depends on announces that it's discontinuing the service in six months. Walk me
      through how you'd respond.
    expected_concepts:
      - assessing how deeply the product depends on the service
      - shortlisting replacements, including building if relevant
      - a migration plan with milestones and buffer
      - reprioritising the roadmap and informing stakeholders
      - negotiating extended support or data export with the vendor
      - managing customer impact
    rubric:
      excellent: Assesses the dependency quickly, evaluates replacements, builds a milestone plan with buffer, reprioritises the roadmap openly, negotiates with the vendor for more time or data, and plans for customer impact.
      good: Proposes a sensible migration plan, but misses roadmap trade-offs or negotiation with the vendor.
      weak: Picks the first replacement and starts migrating without assessing impact or informing stakeholders.
    followups:
      - What would you stop on the roadmap to make room?
      - What would you ask the vendor for?
    common_errors:
      - Spending most of the six months on selection and leaving too little time for migration.

  - external_key: managerial.resources_budget.core_versus_commodity
    competency_key: leadership
    topic: Deciding what is core versus commodity
    difficulty: hard
    text: >-
      How do you decide which capabilities are core to your business and worth building yourselves, and which are
      commodity and should be bought? Tell me about a time that judgement mattered.
    expected_concepts:
      - link between the capability and how the company wins with customers
      - whether owning it creates a lasting advantage
      - maturity of the market for the capability
      - the team's ability to sustain it over years
      - revisiting the classification as the business changes
    rubric:
      excellent: Uses clear reasoning tied to competitive advantage and market maturity, considers long-term ability to sustain the capability, gives a real case where the judgement mattered and explains when they would revisit it.
      good: Distinguishes core from commodity sensibly with an example, but the reasoning is partly generic.
      weak: Treats anything technically interesting as core, or always defaults to buying.
    followups:
      - What capability would you classify differently today?
      - How do you explain that classification to engineers?
    common_errors:
      - Confusing what is technically complex with what differentiates the business.

  - external_key: managerial.resources_budget.outsource_or_in_house_team
    competency_key: leadership
    topic: Outsourcing a product area versus building a team
    difficulty: hard
    text: >-
      Suppose your company wants a new product area delivered within a year and is debating hiring a team versus
      using an outside development firm. How would you help leadership make that decision?
    expected_concepts:
      - time to start and time to deliver for each option
      - long-term ownership and maintenance of the product
      - how strategic the product is
      - cost over a multi-year horizon
      - hybrid options such as an agency with knowledge transfer to a growing internal team
      - risks such as quality control and dependency
    rubric:
      excellent: Compares time, long-term ownership, strategic importance and multi-year cost, considers hybrid options with planned knowledge transfer and names the key risks of each path.
      good: Compares the main options sensibly, but misses long-term ownership or hybrid approaches.
      weak: Picks one option based on short-term speed or cost alone.
    followups:
      - What would make you recommend the outside firm?
      - How would a hybrid arrangement work in practice?
    common_errors:
      - Ignoring who will own and evolve the product after the first release.

  - external_key: managerial.resources_budget.contractors_or_permanent
    competency_key: leadership
    topic: Choosing contractors versus permanent hires
    difficulty: hard
    text: >-
      Tell me about a time you had to decide between bringing in contractors and hiring permanent staff for a
      piece of work. How did you weigh it, and what would you do differently?
    expected_concepts:
      - whether the need was temporary or ongoing
      - speed of getting help versus long-term cost
      - knowledge retention and ownership of the work
      - impact on the existing team's mentoring and review load
      - how the arrangement worked out
    rubric:
      excellent: Describes a real decision weighing duration of need, speed, cost, knowledge retention and the load on the existing team, and reflects on how it worked out with specific lessons.
      good: Gives a sound real example, but misses knowledge retention or the load on the team.
      weak: Defaults to contractors because they are quick, with no plan for ownership.
    followups:
      - How did the permanent team feel about working with contractors?
      - What did the work cost compared with what you expected?
    common_errors:
      - Using contractors for long-term core work and losing the knowledge when they leave.

  - external_key: managerial.resources_budget.multi_year_commitment
    competency_key: stakeholder_management
    topic: Evaluating a multi-year vendor commitment
    difficulty: hard
    text: >-
      A vendor offers a large discount if you commit to a three-year contract instead of one year. How would you
      decide whether to take it?
    expected_concepts:
      - confidence in needing the product for three years
      - the real saving compared with the flexibility lost
      - usage growth or shrinkage and how the contract handles it
      - exit clauses, price protection and termination terms
      - involving finance and procurement
    rubric:
      excellent: Weighs the saving against lost flexibility using realistic usage scenarios, scrutinises exit, growth and price protection terms and involves finance and procurement before deciding.
      good: Considers saving against flexibility sensibly, but does not examine contract terms or usage scenarios.
      weak: Takes the discount because it is cheaper per year, or refuses on principle.
    followups:
      - What contract term would you insist on?
      - How would you model usage over three years?
    common_errors:
      - Committing to seat counts based on peak headcount plans that may never happen.
