# Managerial round: delivery planning (part 2 of 4) - dependencies, risk and de-risking,
# milestones and incremental slicing, scope definition and scope negotiation.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ---------------------------------------------------------------- easy
  - external_key: managerial.delivery_planning.dependency_discovery
    competency_key: project_management
    topic: Finding dependencies at the start of a project
    difficulty: easy
    text: >-
      When you start planning a project, how do you find out which other teams, systems or approvals you're
      going to depend on?
    expected_concepts:
      - walking through the end-to-end flow of the work
      - talking to owning teams early
      - checking non-engineering steps such as legal or security review
      - recording dependencies with owners and dates
    rubric:
      excellent: Uses a systematic walk-through of the work, consults other teams early, includes non-engineering approvals, and records each dependency with an owner and needed-by date.
      good: Identifies the main technical dependencies early and tracks them.
      weak: Relies on discovering dependencies as the work proceeds.
    followups:
      - Which dependency is easiest to overlook?
    common_errors:
      - Only thinking about code dependencies and missing approvals or data access.

  - external_key: managerial.delivery_planning.risk_tracking_habit
    competency_key: project_management
    topic: Keeping track of project risks
    difficulty: easy
    text: >-
      How do you keep track of the risks on a project you're running, and how often do you go back and
      revisit them?
    expected_concepts:
      - a simple shared risk list
      - likelihood and impact for each risk
      - an owner and a mitigation for each
      - regular review cadence
      - retiring risks as they are resolved
    rubric:
      excellent: Keeps a living, shared list with likelihood, impact, owner and mitigation, reviews it on a set cadence and shows how it drove a real decision.
      good: Tracks risks with owners and reviews them periodically.
      weak: Writes a risk list at kickoff and never looks at it again.
    followups:
      - Give me an example of a risk that came true. Was it on your list?
    common_errors:
      - Listing risks without any mitigation or owner.

  - external_key: managerial.delivery_planning.first_version_scope
    competency_key: project_management
    topic: Deciding what goes in a first release
    difficulty: easy
    text: >-
      Tell me about a project where you shipped a smaller first version before the full thing. How did you
      decide what went into that first version?
    expected_concepts:
      - the user problem the first version had to solve
      - criteria for including or excluding features
      - involving product and users in the choice
      - what was learned from releasing early
    rubric:
      excellent: Ties the first version to a specific user problem, explains clear inclusion criteria, and shows what the early release taught the team and how it changed later plans.
      good: Explains a sensible first scope and why it was chosen.
      weak: The first version was simply whatever was finished by the date.
    followups:
      - What did users ask for first after it shipped?
    common_errors:
      - A first version too thin to be useful to anyone.

  - external_key: managerial.delivery_planning.deferring_requests
    competency_key: stakeholder_management
    topic: Turning down or deferring a request
    difficulty: easy
    text: >-
      Tell me about a time you turned down or postponed a request from another team because it didn't fit
      your plan. How did you communicate it?
    expected_concepts:
      - understanding the request and its importance
      - reasoning for the decision
      - offering alternatives or a timeline
      - how the relationship was maintained
    rubric:
      excellent: Understood the requester's need, explained the decision in terms of shared priorities, offered an alternative or later date, and kept the relationship working.
      good: Declined clearly with a reason and some alternative.
      weak: Ignored the request or said no without explanation.
    followups:
      - How did the other team respond?
    common_errors:
      - Saying yes to everything and then missing dates.

  - external_key: managerial.delivery_planning.milestone_definition
    competency_key: project_management
    topic: Defining milestones everyone agrees on
    difficulty: easy
    text: >-
      How do you define milestones for a project so that everyone agrees when one has actually been reached?
    expected_concepts:
      - milestones described as demonstrable outcomes
      - clear acceptance criteria
      - agreement with stakeholders up front
      - spacing milestones to give early feedback
    rubric:
      excellent: Defines milestones as observable outcomes with explicit acceptance criteria agreed with stakeholders, and spaces them to expose problems early.
      good: Uses outcome-based milestones with some criteria.
      weak: Milestones are activity labels or calendar dates with no definition of done.
    followups:
      - Can you give me an example of a milestone you wrote recently?
    common_errors:
      - Milestones such as backend work complete that nobody can verify.

  - external_key: managerial.delivery_planning.shared_scope_understanding
    competency_key: communication
    topic: Aligning on what is in and out of scope
    difficulty: easy
    text: >-
      Before work starts, how do you make sure the team and the stakeholders share the same understanding of
      what's in scope and what isn't?
    expected_concepts:
      - written scope with explicit exclusions
      - walking stakeholders through examples or mock-ups
      - confirming acceptance criteria
      - a way to handle later changes
    rubric:
      excellent: Writes down scope including explicit exclusions, checks understanding with concrete examples, gets agreement on acceptance criteria, and sets out how changes will be handled.
      good: Documents and reviews scope with stakeholders.
      weak: Assumes the ticket or brief is enough.
    followups:
      - When has a misunderstanding about scope still slipped through?
    common_errors:
      - Never writing down what is explicitly out of scope.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.delivery_planning.blocked_by_other_team
    competency_key: collaboration
    topic: Blocked by another team's priorities
    difficulty: medium
    text: >-
      Your project is blocked because another team hasn't delivered an API they promised, and they now have
      other priorities. What do you do?
    expected_concepts:
      - understanding the other team's constraints
      - quantifying the impact of the delay
      - options such as contributing code, a workaround or resequencing
      - escalating with data if needed
      - updating your own stakeholders
    rubric:
      excellent: Understands the other team's position, quantifies the impact, proposes concrete options like contributing or resequencing, escalates jointly if needed, and keeps their own stakeholders informed.
      good: Works with the other team on options and escalates sensibly.
      weak: Waits passively or escalates immediately without talking to the other team.
    followups:
      - When would you offer to build it yourselves?
    common_errors:
      - Escalating before trying to understand the other team's constraints.

  - external_key: managerial.delivery_planning.cross_team_agreement
    competency_key: collaboration
    topic: Agreeing deliverables with a partner team
    difficulty: medium
    text: >-
      Tell me about a time you depended on another team for a critical part of a project. How did you agree
      what they'd deliver and when, and how did you follow it?
    expected_concepts:
      - clear written agreement on interface and timing
      - early integration or contract tests
      - regular check-ins
      - plan for what happens if it slips
    rubric:
      excellent: Describes a concrete agreement on scope, interface and date, early integration to verify it, a regular check-in, and a fallback that was planned in advance.
      good: Real example with a clear agreement and tracking.
      weak: Relied on a verbal promise and found out about problems late.
    followups:
      - Did it arrive as agreed? What happened if not?
    common_errors:
      - Agreeing on a date but not on what exactly would be delivered.

  - external_key: managerial.delivery_planning.choosing_spikes
    competency_key: project_management
    topic: Choosing which unknowns to investigate first
    difficulty: medium
    text: >-
      How do you decide which unknowns in a project to investigate before committing to a plan? Tell me about
      a spike or prototype that changed your plan.
    expected_concepts:
      - ranking unknowns by impact on the plan
      - time-boxing investigation
      - a clear question each spike must answer
      - how the result changed scope, approach or date
    rubric:
      excellent: Ranks unknowns by how much they could move the plan, time-boxes spikes around specific questions, and gives an example where the result materially changed the plan.
      good: Uses spikes sensibly with a relevant example.
      weak: Investigates whatever is interesting, or skips investigation and discovers problems mid-project.
    followups:
      - How do you stop a spike turning into the real implementation?
    common_errors:
      - Spikes with no clear question or end date.

  - external_key: managerial.delivery_planning.work_ordering
    competency_key: project_management
    topic: Ordering risky and easy work
    difficulty: medium
    text: >-
      Some leads tackle the riskiest part of a project first, while others build momentum with easier wins.
      How do you decide the order of work? Give me an example.
    expected_concepts:
      - reducing uncertainty early
      - delivering visible value early
      - dependency and critical path considerations
      - concrete example of the sequence and result
    rubric:
      excellent: Balances retiring the biggest risks early with delivering visible value, accounts for dependencies, and illustrates the reasoning with a real sequence and its outcome.
      good: Gives a reasoned ordering with an example.
      weak: Orders work by convenience or preference without considering risk.
    followups:
      - When would you deliberately leave a risky piece until later?
    common_errors:
      - Leaving the hardest integration until the end.

  - external_key: managerial.delivery_planning.vertical_slicing_coaching
    competency_key: mentoring
    topic: Coaching a team towards vertical slices
    difficulty: medium
    text: >-
      A team proposes building a feature layer by layer, the database first, then the API, then the interface.
      How would you coach them to plan it differently, and why?
    expected_concepts:
      - thin end-to-end slices that deliver usable value
      - earlier feedback and integration
      - helping the team find the first slice themselves
      - when layered work is acceptable
    rubric:
      excellent: Explains the benefits of end-to-end slices, coaches the team to discover a thin first slice through questions, and acknowledges when layered work is reasonable.
      good: Explains vertical slicing and how they would guide the team.
      weak: Simply tells the team to do it differently without explaining or coaching.
    followups:
      - What would a first slice look like for a feature you've worked on?
    common_errors:
      - Dictating the plan instead of building the team's own skill.

  - external_key: managerial.delivery_planning.cutting_scope_before_launch
    competency_key: project_management
    topic: Deciding what to cut close to launch
    difficulty: medium
    text: >-
      You're three weeks from a launch date, and it's clear not everything will make it. How do you decide
      what to cut, and who do you involve?
    expected_concepts:
      - ranking remaining work by user and business value
      - involving product and key stakeholders
      - protecting quality-critical work
      - agreeing on a plan for deferred items
      - communicating the change
    rubric:
      excellent: Ranks remaining work with product by value and risk, protects quality and operational readiness, agrees a plan for deferred items, and communicates the decision clearly.
      good: Makes a reasonable value-based cut with stakeholder input.
      weak: Cuts testing or documentation by default, or decides alone.
    followups:
      - How would you handle a stakeholder whose feature was cut?
    common_errors:
      - Cutting testing and monitoring first because they are invisible to users.

  - external_key: managerial.delivery_planning.scope_reduction_negotiation
    competency_key: stakeholder_management
    topic: Negotiating reduced scope
    difficulty: medium
    text: >-
      Tell me about a time you negotiated a smaller scope with a stakeholder who really wanted everything. How
      did you reach agreement?
    expected_concepts:
      - understanding the stakeholder's underlying goal
      - presenting options with trade-offs
      - finding a version that met the core need
      - agreed plan for the rest
    rubric:
      excellent: Uncovers the goal behind the request, presents clear options with costs, reaches a scope that meets the core need, and agrees what happens to the remainder.
      good: Real negotiation with a reasonable outcome.
      weak: Either gave in entirely or imposed the cut without discussion.
    followups:
      - What did the stakeholder give up, and what did you give up?
    common_errors:
      - Negotiating features one by one instead of around the goal.

  - external_key: managerial.delivery_planning.unrequested_extras
    competency_key: leadership
    topic: Handling work that nobody asked for
    difficulty: medium
    text: >-
      How do you notice when engineers on your team are adding work nobody asked for, like extra polish or
      generalising for future cases, and how do you handle it without discouraging good craftsmanship?
    expected_concepts:
      - signals such as tasks growing without new requirements
      - discussing the trade-off openly with the engineer
      - clear agreement on what good enough means
      - room for deliberate quality investment
    rubric:
      excellent: Describes concrete signals, handles it through a conversation about value and timing, agrees a shared standard for done, and still makes deliberate room for quality work.
      good: Recognises the issue and addresses it constructively.
      weak: Either ignores it or bans any work beyond the ticket.
    followups:
      - How do you tell the difference between gold-plating and necessary design?
    common_errors:
      - Treating all quality work as gold-plating.

  - external_key: managerial.delivery_planning.mid_sprint_change
    competency_key: agile_delivery
    topic: Requirement changes in the middle of a sprint
    difficulty: medium
    text: >-
      A stakeholder asks to change requirements in the middle of a sprint. Walk me through how you decide
      whether to absorb it, swap something out or defer it.
    expected_concepts:
      - understanding urgency and value of the change
      - impact on work already in progress
      - explicit trade-off with the stakeholder
      - involving the team in the decision
    rubric:
      excellent: Assesses urgency and value, makes the cost to in-progress work explicit, agrees a trade-off with the stakeholder, and involves the team before changing their plan.
      good: Has a sensible rule for when to accept changes and applies it.
      weak: Always accepts changes silently, or rigidly refuses any change.
    followups:
      - How often does this happen on your team?
    common_errors:
      - Absorbing changes without removing anything from the sprint.

  - external_key: managerial.delivery_planning.non_engineering_launch_readiness
    competency_key: project_management
    topic: Coordinating non-engineering launch work
    difficulty: medium
    text: >-
      Your launch depends on marketing, legal review and customer support training all being ready at the
      same time as the software. How do you plan and coordinate that?
    expected_concepts:
      - one integrated plan across functions
      - clear owners and lead times for each function
      - early engagement of legal and support
      - shared launch readiness review
    rubric:
      excellent: Builds one integrated plan with owners and lead times for each function, engages slow-moving reviews early, and runs a shared readiness review before launch.
      good: Coordinates the functions with clear owners and dates.
      weak: Plans only the engineering work and informs others near launch.
    followups:
      - Which function has caught you out before, and how?
    common_errors:
      - Engaging legal or support only in the final week.

  - external_key: managerial.delivery_planning.risk_conversation_sponsor
    competency_key: stakeholder_management
    topic: Discussing risks with a sponsor
    difficulty: medium
    text: >-
      How do you talk about project risks with a sponsor so that they take them seriously without assuming
      the project is in trouble? Give me an example.
    expected_concepts:
      - framing risks with likelihood and impact
      - pairing each risk with a mitigation and owner
      - asking for specific help where needed
      - regular rather than one-off risk discussion
    rubric:
      excellent: Presents risks with likelihood, impact and a mitigation, asks the sponsor for specific decisions or help, and keeps the conversation regular so risks are routine rather than alarming.
      good: Communicates risks clearly with mitigations.
      weak: Hides risks until they become problems, or presents a long list with no mitigation.
    followups:
      - What did the sponsor actually do with that information?
    common_errors:
      - Raising risks only when it is too late to mitigate them.

  - external_key: managerial.delivery_planning.non_functional_work_planning
    competency_key: project_management
    topic: Planning non-functional work up front
    difficulty: medium
    text: >-
      How do you make sure work like performance testing, security review and monitoring is part of the plan
      rather than discovered at the end? Tell me about a time it was missed or caught early.
    expected_concepts:
      - explicit non-functional requirements at planning
      - including reviews and their lead times
      - a launch readiness checklist
      - example of the consequence
    rubric:
      excellent: Builds non-functional work and review lead times into the plan from the start, uses a readiness checklist, and gives a real example of the effect of missing or catching it.
      good: Plans for non-functional work with an example.
      weak: Treats it as something to add if time allows.
    followups:
      - Who on the team owns that checklist?
    common_errors:
      - Leaving security review until the week before launch.

  - external_key: managerial.delivery_planning.late_integration_risk
    competency_key: project_management
    topic: Plans that integrate only at the end
    difficulty: medium
    text: >-
      Several teams are each building one part of a feature and plan to integrate everything in the final two
      weeks. What concerns would you raise, and how would you change the plan?
    expected_concepts:
      - risk of late surprises at integration
      - agreeing interfaces early
      - integrating a thin end-to-end path early
      - frequent integration points
      - shared end-to-end testing
    rubric:
      excellent: Explains why late integration is risky, proposes early interface agreements and a thin end-to-end path integrated early, then frequent integration with shared testing.
      good: Identifies the risk and proposes earlier integration.
      weak: Accepts the plan, perhaps adding a little buffer at the end.
    followups:
      - How would you persuade teams who say they aren't ready to integrate yet?
    common_errors:
      - Adding buffer at the end instead of integrating earlier.

  # ---------------------------------------------------------------- hard
  - external_key: managerial.delivery_planning.contended_platform_team
    competency_key: stakeholder_management
    topic: Competing for a shared platform team
    difficulty: hard
    text: >-
      Your project and two others all need changes from the same platform team this quarter, and that team can
      only do one of them well. How would you reach a decision the organisation will accept?
    expected_concepts:
      - shared view of value and cost of delay for each project
      - bringing the other leads together rather than lobbying
      - options such as lending engineers or reducing asks
      - escalating to a single decision maker with a clear framing
      - accepting and communicating the outcome
    rubric:
      excellent: Builds a shared comparison of value and cost of delay with the other leads, explores options like lending people or reducing asks, and brings a clear framing to the right decision maker, accepting the result.
      good: Takes a fair, organisation-wide view and proposes a reasonable decision process.
      weak: Lobbies only for their own project or escalates without a clear framing.
    followups:
      - What would you do if your project lost?
    common_errors:
      - Treating it as a contest to win rather than a decision for the organisation.

  - external_key: managerial.delivery_planning.thin_launch_disagreement
    competency_key: stakeholder_management
    topic: Disagreeing on how thin a first release should be
    difficulty: hard
    text: >-
      Product wants to launch a very thin first version quickly, but you believe it will disappoint key
      customers and hurt adoption. How would you work out the right first scope together?
    expected_concepts:
      - evidence about customer expectations
      - agreeing on success measures for the first release
      - options between the two positions
      - limited or staged rollout to test assumptions
      - committing to the agreed decision
    rubric:
      excellent: Grounds the disagreement in customer evidence and agreed success measures, proposes middle options such as a limited audience release, and commits fully once a decision is made.
      good: Raises the concern constructively and suggests alternatives.
      weak: Defers silently or blocks the launch on personal opinion.
    followups:
      - What evidence would change your mind?
    common_errors:
      - Arguing from opinion without customer data.

  - external_key: managerial.delivery_planning.dependency_fell_through
    competency_key: project_management
    topic: Re-planning after a late dependency failure
    difficulty: hard
    text: >-
      Tell me about a time a dependency you had planned around fell through late in a project. How did you
      re-plan, and what did you change about how you manage dependencies afterwards?
    expected_concepts:
      - how and when the failure was discovered
      - options evaluated and decision made
      - communication with stakeholders
      - lasting change to dependency management
    rubric:
      excellent: Explains the failure, the options considered, the decision and its outcome, and a specific lasting change such as earlier integration or fallback plans for critical dependencies.
      good: Clear example with a reasonable re-plan and a lesson.
      weak: Focuses on blaming the other party with no change in practice.
    followups:
      - Could you have spotted it earlier?
    common_errors:
      - Blaming the other team without reflecting on their own tracking.

  - external_key: managerial.delivery_planning.structural_dependency_reduction
    competency_key: leadership
    topic: Reducing cross-team dependencies structurally
    difficulty: hard
    text: >-
      Your teams keep getting stuck waiting on each other on nearly every project. How would you reduce those
      dependencies over time, beyond managing them project by project?
    expected_concepts:
      - analysing where dependencies come from
      - reshaping team ownership around products or flows
      - self-service platforms and clear interfaces
      - inner source or contribution models
      - measuring wait time to track progress
    rubric:
      excellent: Diagnoses recurring dependency patterns, proposes structural changes such as ownership boundaries, self-service interfaces or contribution models, and measures waiting time to track improvement.
      good: Suggests credible structural changes beyond coordination meetings.
      weak: Proposes only more meetings or more detailed tracking.
    followups:
      - Which change would you make first, and why?
    common_errors:
      - Adding coordination overhead instead of removing the dependency.

  - external_key: managerial.delivery_planning.fixed_bid_change_request
    competency_key: stakeholder_management
    topic: Scope changes on a fixed-price engagement
    difficulty: hard
    text: >-
      You're delivering for a client with fixed scope and a fixed price. Halfway through, they ask for
      changes they see as small but your team sees as significant. How would you handle it?
    expected_concepts:
      - assessing the real impact of the changes
      - referring back to the agreed scope
      - a formal but collaborative change process
      - options such as swapping scope or a change order
      - protecting the relationship
    rubric:
      excellent: Quantifies the impact, refers to the agreed scope without being adversarial, offers options such as swapping items or a priced change, and preserves the relationship.
      good: Uses a change process and offers reasonable options.
      weak: Absorbs the changes and overruns, or refuses flatly.
    followups:
      - How would you have structured the contract differently?
    common_errors:
      - Absorbing small changes until they add up to a large overrun.

  - external_key: managerial.delivery_planning.pre_mortem
    competency_key: project_management
    topic: Running a pre-mortem before a high-stakes launch
    difficulty: hard
    text: >-
      Before a high-stakes launch, how would you run an exercise to find the ways the plan could fail? Tell me
      what came out of one you've run, or what you'd expect to find.
    expected_concepts:
      - imagining failure and working backwards to causes
      - involving people across functions
      - prioritising the most likely and severe failure modes
      - turning findings into owned actions
      - follow-up before launch
    rubric:
      excellent: Describes a structured exercise involving the right people, prioritises failure modes, turns them into owned mitigations, and gives concrete findings that changed the plan.
      good: Describes a reasonable exercise with useful findings.
      weak: Generic risk discussion with no prioritisation or actions.
    followups:
      - Which finding surprised people most?
    common_errors:
      - Producing a list of risks that nobody acts on.
