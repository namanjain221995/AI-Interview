# Managerial round: delivery planning (part 1 of 4) - planning cadence, estimation practice,
# forecasts versus commitments and capacity. Questions ask for real examples or concrete approaches;
# evaluation is based only on the substance of the answer.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ---------------------------------------------------------------- easy
  - external_key: managerial.delivery_planning.team_planning_flow
    competency_key: project_management
    topic: How the team turns ideas into planned work
    difficulty: easy
    text: >-
      Walk me through how your current or most recent team gets from a rough idea on the roadmap to tasks
      that people actually pick up. Which parts of that work well, and what would you change?
    expected_concepts:
      - intake and prioritisation of ideas
      - refinement into scoped, estimable pieces
      - who is involved at each step
      - how the plan is reviewed and adjusted
      - a specific improvement and why it matters
    rubric:
      excellent: Describes each stage of the flow with who does what, points to concrete strengths and weaknesses, and proposes a targeted change tied to an observed problem.
      good: Clear description of the process with at least one sensible improvement.
      weak: Lists ceremony names without explaining how work actually moves, or sees nothing to improve.
    followups:
      - Where does work most often get stuck in that flow?
      - Who decides when something is ready to start?
    common_errors:
      - Describing an idealised textbook process instead of what the team really does.

  - external_key: managerial.delivery_planning.estimate_first_ask
    competency_key: project_management
    topic: Responding to a first request for an estimate
    difficulty: easy
    text: >-
      When someone asks your team for an estimate on a piece of work for the first time, what do you do
      before you give them a number?
    expected_concepts:
      - clarifying the goal and what is being asked
      - understanding how the estimate will be used
      - involving the people who will do the work
      - identifying unknowns and assumptions
      - agreeing when a firmer estimate will follow
    rubric:
      excellent: Clarifies the purpose and scope, involves the engineers doing the work, states assumptions and unknowns, and sets expectations about precision and when it will be refined.
      good: Clarifies scope and involves the team before answering, with some mention of assumptions.
      weak: Gives a number on the spot from personal intuition, or refuses to estimate at all.
    followups:
      - How do you answer if they insist on a number in the meeting?
      - How do you write down the assumptions behind it?
    common_errors:
      - Treating an early rough estimate as if it were a commitment.

  - external_key: managerial.delivery_planning.estimate_units
    competency_key: agile_delivery
    topic: Choosing how the team expresses estimates
    difficulty: easy
    text: >-
      How does your team express its estimates today, whether that's in days, story points or rough sizes,
      and why did you settle on that approach?
    expected_concepts:
      - the method actually in use
      - what decisions the estimates support
      - trade-offs of the chosen unit
      - how estimates are converted into dates when needed
    rubric:
      excellent: Explains the method, the decisions it feeds, its trade-offs against alternatives, and how it is translated into forecasts stakeholders can use.
      good: Explains the method and a reasonable rationale for it.
      weak: Names a method without any reason, or cannot describe how it leads to delivery dates.
    followups:
      - Have you ever changed the method? What prompted it?
      - How do stakeholders outside the team interpret those estimates?
    common_errors:
      - Arguing about units while ignoring whether estimates help any decision.

  - external_key: managerial.delivery_planning.forecast_vs_commitment
    competency_key: communication
    topic: Explaining forecasts versus commitments
    difficulty: easy
    text: >-
      How do you explain the difference between a forecast and a commitment to the people who depend on
      your team? Give me an example of when that distinction really mattered.
    expected_concepts:
      - clear definitions of each
      - when the team is willing to commit
      - how confidence or ranges are expressed
      - a concrete example and its outcome
    rubric:
      excellent: Gives crisp definitions, explains when work moves from forecast to commitment, and shows with a real example how the distinction prevented or resolved a misunderstanding.
      good: Distinguishes the two clearly and gives a relevant example.
      weak: Uses the terms interchangeably or gives no example.
    followups:
      - What happens on your team when a commitment is at risk?
    common_errors:
      - Using the word commitment for everything, which removes its meaning.

  - external_key: managerial.delivery_planning.capacity_basics
    competency_key: project_management
    topic: Calculating realistic team capacity
    difficulty: easy
    text: >-
      When you work out how much your team can take on in a sprint or a quarter, what do you take away from
      the raw number of people and working days, and why?
    expected_concepts:
      - planned time off and public holidays
      - on-call, support and operational load
      - meetings, reviews and other overhead
      - onboarding and ramp-up time
      - historical delivery rate as a check
    rubric:
      excellent: Lists the concrete deductions with rough proportions from their own team, and checks the result against historical throughput.
      good: Identifies several realistic deductions such as time off, support load and overhead.
      weak: Plans against full headcount and working days with no deductions.
    followups:
      - Roughly what share of your team's time goes to unplanned work?
      - How do you check your capacity number was right afterwards?
    common_errors:
      - Assuming every engineer spends all their time on roadmap work.

  - external_key: managerial.delivery_planning.first_plan_new_lead
    competency_key: leadership
    topic: Producing a plan soon after joining a team
    difficulty: easy
    text: >-
      Imagine you've just joined a team as its lead, and in your second week you're asked for a delivery
      plan for next quarter. How would you approach it?
    expected_concepts:
      - learning existing commitments and context
      - involving the team in building the plan
      - using past delivery data where it exists
      - stating assumptions and confidence clearly
      - planning to revisit once more is known
    rubric:
      excellent: Gathers existing commitments and history, builds the plan with the team, is explicit about confidence and assumptions, and schedules a revision point as they learn more.
      good: Involves the team and gathers context before producing the plan.
      weak: Writes the plan alone from the roadmap, or declines to produce anything until fully ramped up.
    followups:
      - Who would you talk to first?
      - How would you flag the parts you're unsure about?
    common_errors:
      - Rewriting the team's plans before understanding why they exist.

  - external_key: managerial.delivery_planning.missed_small_commitment
    competency_key: project_management
    topic: Learning from a missed commitment
    difficulty: easy
    text: >-
      Tell me about a commitment your team made that it didn't meet, even a small one. What happened, and
      what did you take away from it?
    expected_concepts:
      - what was committed and to whom
      - why it was missed
      - how the miss was communicated
      - a concrete change made afterwards
    rubric:
      excellent: Describes the commitment, a clear analysis of the cause, timely communication of the miss, and a specific change to planning that followed.
      good: Real example with a cause and a lesson.
      weak: Blames external factors only, or picks an example with no real stakes.
    followups:
      - When did you first know it would be missed?
      - Did the change you made work?
    common_errors:
      - Lessons limited to trying harder next time.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.delivery_planning.estimate_disagreement
    competency_key: project_management
    topic: Resolving widely different estimates
    difficulty: medium
    text: >-
      During estimation, one senior engineer says a piece of work will take three days and another says three
      weeks. How do you handle that gap?
    expected_concepts:
      - asking each person to explain their reasoning
      - surfacing different assumptions about scope
      - identifying the unknown that drives the gap
      - deciding whether to spike, split or take the range
      - avoiding simple averaging
    rubric:
      excellent: Treats the gap as information, gets both engineers to explain their assumptions, identifies the specific unknown, and chooses a concrete next step such as a spike or splitting the work.
      good: Discusses assumptions with both engineers and reaches a reasoned estimate.
      weak: Averages the numbers or simply picks the most senior person's estimate.
    followups:
      - What if the gap remains after discussion?
      - How would you record the decision?
    common_errors:
      - Averaging the two numbers without understanding why they differ.

  - external_key: managerial.delivery_planning.narrowing_range
    competency_key: project_management
    topic: Narrowing an estimate range as work progresses
    difficulty: medium
    text: >-
      Tell me about a project where you started with a wide range for the delivery date. How did you work out
      the two ends of the range, and how did you narrow it as the work went on?
    expected_concepts:
      - basis for the optimistic and pessimistic ends
      - which unknowns drove the width
      - deliberate work to reduce the biggest unknowns early
      - regular re-forecasting and communication
    rubric:
      excellent: Explains how each end of the range was derived, which unknowns were attacked first to shrink it, and how updated ranges were shared at a set cadence.
      good: Gives a real range with a reasonable basis and describes updating it over time.
      weak: The range was a guess with arbitrary padding and never changed.
    followups:
      - At what point did you feel able to give a single date?
      - Did the final date fall inside the original range?
    common_errors:
      - Waiting for the range to narrow on its own instead of tackling unknowns.

  - external_key: managerial.delivery_planning.historical_data
    competency_key: project_management
    topic: Using past delivery data to plan
    difficulty: medium
    text: >-
      How do you use your team's past delivery data to make better plans? Tell me about a time looking at
      that history changed a plan you were about to commit to.
    expected_concepts:
      - which data is collected, such as throughput or cycle time
      - comparing the plan against historical rates
      - accounting for changes in team or work type
      - concrete adjustment made to the plan
    rubric:
      excellent: Names the data they use, shows how they compared the draft plan against it, explains the adjustment and its effect on the outcome.
      good: Uses historical data sensibly with a real example.
      weak: Relies only on bottom-up estimates and never checks them against history.
    followups:
      - What was misleading about the historical data, if anything?
    common_errors:
      - Using history from a team whose makeup or work has changed a lot.

  - external_key: managerial.delivery_planning.buffer_placement
    competency_key: project_management
    topic: Deciding how much buffer to plan and where
    difficulty: medium
    text: >-
      How do you decide how much buffer to put into a plan, and where in the plan to put it? Give me an
      example from a project you ran.
    expected_concepts:
      - sizing buffer by uncertainty rather than a fixed percentage
      - keeping buffer visible rather than hidden in tasks
      - placing buffer before key milestones or integration points
      - rules for when buffer can be used
    rubric:
      excellent: Sizes buffer from identified risks, keeps it visible and owned, places it at integration or milestone points, and describes how it was consumed in a real project.
      good: Has a reasoned approach to buffer with a relevant example.
      weak: Pads every task quietly or uses no buffer at all.
    followups:
      - How do you explain the buffer to stakeholders who want it removed?
    common_errors:
      - Hiding padding in individual estimates so nobody can see the real risk.

  - external_key: managerial.delivery_planning.pressure_lower_estimate
    competency_key: stakeholder_management
    topic: Pressure to reduce an estimate
    difficulty: medium
    text: >-
      A director tells you your estimate is too high and asks you to bring it down before a planning review.
      How would you respond?
    expected_concepts:
      - understanding what is driving the request
      - explaining the basis of the estimate
      - offering scope, staffing or sequencing options instead of a lower number
      - keeping the estimate tied to evidence
    rubric:
      excellent: Seeks the business need behind the request, walks through the estimate's basis, and offers concrete trade-offs such as reduced scope or phased delivery rather than changing the number without cause.
      good: Defends the estimate with reasoning and offers at least one alternative.
      weak: Lowers the number to please the director, or refuses without engaging.
    followups:
      - What if the director says the date is fixed regardless?
      - How would you involve your team in that conversation?
    common_errors:
      - Cutting the estimate without cutting any scope.

  - external_key: managerial.delivery_planning.commit_vs_stretch
    competency_key: project_management
    topic: Firm commitments versus stretch goals
    difficulty: medium
    text: >-
      When your team sets quarterly goals, how do you decide how much to commit to firmly and how much to
      list as a stretch? Tell me how that played out last time.
    expected_concepts:
      - basing commitments on realistic capacity
      - making stretch goals visible and labelled
      - how stakeholders are told the difference
      - reviewing hit rates afterwards
    rubric:
      excellent: Explains a clear rule for firm versus stretch tied to capacity and confidence, shows how it was communicated, and reflects on the actual outcome.
      good: Distinguishes firm and stretch work with a real example.
      weak: Commits to everything requested, or labels everything as stretch to avoid accountability.
    followups:
      - How did stakeholders treat the stretch items?
    common_errors:
      - Stretch goals that stakeholders quietly treat as commitments.

  - external_key: managerial.delivery_planning.new_joiners_capacity
    competency_key: people_management
    topic: Planning around new team members
    difficulty: medium
    text: >-
      You're planning a quarter in which two new engineers will join the team. How do you account for them in
      your capacity and your plan?
    expected_concepts:
      - realistic ramp-up time for new joiners
      - reduced capacity of the people onboarding them
      - suitable starter work in the plan
      - not counting them before they arrive
    rubric:
      excellent: Models ramp-up and the onboarding cost on existing engineers, plans suitable first tasks, and avoids depending on new joiners for critical-path work early on.
      good: Accounts for ramp-up time and plans some onboarding work.
      weak: Counts the new engineers as full capacity from day one.
    followups:
      - How would you plan if their start dates were uncertain?
    common_errors:
      - Ignoring the time existing engineers spend helping new people.

  - external_key: managerial.delivery_planning.operational_load_visibility
    competency_key: project_management
    topic: Making unplanned operational work visible
    difficulty: medium
    text: >-
      Tell me about a time unplanned operational work kept eating into your team's plans. How did you make it
      visible, and what did you change about how you planned?
    expected_concepts:
      - measuring the unplanned work
      - showing its impact to stakeholders
      - adjusting capacity or reserving time
      - reducing the source of the work
    rubric:
      excellent: Measured the unplanned work, used the data to reset plans with stakeholders, and both reserved capacity and reduced the underlying cause.
      good: Made the work visible and adjusted planning accordingly.
      weak: Kept absorbing the work silently and missing dates.
    followups:
      - What data convinced your stakeholders?
    common_errors:
      - Treating every interruption as unavoidable instead of fixing its source.

  - external_key: managerial.delivery_planning.estimate_ownership
    competency_key: leadership
    topic: Making sure the team owns its estimates
    difficulty: medium
    text: >-
      On your team, who produces estimates, and how do you make sure the people doing the work own them
      rather than having numbers handed down? Give me an example.
    expected_concepts:
      - engineers doing the work produce the estimates
      - the lead's role in challenging and aggregating
      - protecting estimates from outside pressure
      - consequences when the lead overrides estimates
    rubric:
      excellent: Engineers who do the work own estimates, the lead challenges assumptions and aggregates risk, and the example shows how this improved accuracy or commitment.
      good: Team produces estimates with the lead reviewing them.
      weak: The lead or manager sets estimates alone and passes them to the team.
    followups:
      - When have you overridden a team estimate, and why?
    common_errors:
      - Collecting estimates from the team and then quietly changing them.

  - external_key: managerial.delivery_planning.goals_to_plan
    competency_key: project_management
    topic: Turning business goals into a team plan
    difficulty: medium
    text: >-
      Tell me about the last time you took part in a yearly or half-yearly planning cycle. How did you turn
      broad business goals into a plan your team could actually commit to?
    expected_concepts:
      - understanding the goals and how success is measured
      - translating goals into candidate initiatives
      - sizing and prioritising against capacity
      - negotiating the final set with leadership
      - linking the plan back to the goals
    rubric:
      excellent: Shows a clear chain from business goals to initiatives to sized commitments, explains the negotiation over what fit, and how success would be measured.
      good: Explains how goals were translated into a realistic team plan.
      weak: Describes receiving a list of projects with no link to goals or capacity.
    followups:
      - What did you leave out, and how did you explain that?
    common_errors:
      - Committing to initiatives without knowing how they serve the goal.

  - external_key: managerial.delivery_planning.estimate_overrun_rebaseline
    competency_key: project_management
    topic: Re-baselining after an optimistic estimate
    difficulty: medium
    text: >-
      Partway through a project, it becomes clear your original estimate was optimistic by about forty percent.
      Walk me through what you do over the next few days.
    expected_concepts:
      - understanding why the estimate was wrong
      - re-estimating the remaining work
      - options such as cutting scope, resequencing or adding time
      - telling stakeholders early with options
      - checking whether other estimates share the same flaw
    rubric:
      excellent: Diagnoses the cause, re-estimates the remainder with the team, prepares concrete options, informs stakeholders quickly, and checks other plans for the same bias.
      good: Re-estimates and informs stakeholders promptly with some options.
      weak: Hopes to catch up quietly or pushes the team to work longer without re-planning.
    followups:
      - Who would you tell first?
    common_errors:
      - Delaying the news until the date is already missed.

  - external_key: managerial.delivery_planning.planning_with_product
    competency_key: collaboration
    topic: Splitting planning responsibilities with product
    difficulty: medium
    text: >-
      How do you and your product manager split responsibility for what goes into a plan and when it can be
      delivered? Tell me about a time you disagreed with them.
    expected_concepts:
      - product owns what and why, engineering owns how and how long
      - shared ownership of trade-offs
      - how disagreements are resolved
      - outcome of the specific disagreement
    rubric:
      excellent: Describes a clear division with shared trade-off decisions, and a real disagreement resolved through data or options rather than authority, with the result.
      good: Clear working relationship and a reasonable disagreement example.
      weak: Either defers entirely to product or treats product as an obstacle.
    followups:
      - What did you learn about working with that product manager?
    common_errors:
      - Framing the relationship as engineering versus product.

  # ---------------------------------------------------------------- hard
  - external_key: managerial.delivery_planning.firm_date_before_discovery
    competency_key: stakeholder_management
    topic: Firm date requested before discovery is done
    difficulty: hard
    text: >-
      An executive needs a firm date for a customer contract, but your team hasn't finished discovery and the
      realistic range is anywhere from two to six months. What would you do?
    expected_concepts:
      - understanding what the contract really needs
      - separating a committed core from uncertain extras
      - time-boxed discovery to narrow the range
      - contractual options such as phased dates or checkpoints
      - making the risk explicit to the executive
    rubric:
      excellent: Explores the real contractual need, proposes a committed minimal scope with a phased or checkpointed date, runs focused discovery to narrow the range, and makes the remaining risk explicit.
      good: Offers a date with stated risk and a plan to firm it up.
      weak: Gives the earliest date to satisfy the executive, or refuses to engage until discovery is complete.
    followups:
      - What would you need from the executive to make this work?
      - How would you handle it if the customer insisted on the full scope?
    common_errors:
      - Choosing a date from the optimistic end of the range under pressure.

  - external_key: managerial.delivery_planning.estimation_culture_reset
    competency_key: leadership
    topic: Fixing a culture of heavy padding
    difficulty: hard
    text: >-
      You inherit a team that pads estimates heavily because people were blamed for misses in the past. How
      would you change that over the next couple of quarters?
    expected_concepts:
      - understanding the history and incentives
      - separating estimates from performance judgement
      - making uncertainty and buffer explicit at plan level
      - handling misses as learning, not blame
      - measuring improvement in forecast accuracy
    rubric:
      excellent: Addresses the incentive that causes padding, moves buffer to visible plan level, models a no-blame response to misses, and tracks forecast accuracy to show progress.
      good: Recognises the root cause and proposes credible changes over time.
      weak: Simply tells the team to stop padding or cuts their estimates.
    followups:
      - How would you handle the first big miss after the change?
      - What would you need from your own manager?
    common_errors:
      - Cutting estimates by decree, which confirms the team's fear.

  - external_key: managerial.delivery_planning.repeated_quarterly_misses
    competency_key: project_management
    topic: Diagnosing repeated missed commitments
    difficulty: hard
    text: >-
      Tell me about a time your team missed several commitments in a row. How did you work out why, and what
      changed as a result?
    expected_concepts:
      - looking for patterns across the misses
      - separating estimation, scope and execution causes
      - involving the team in the diagnosis
      - systemic changes rather than one-off fixes
      - evidence that the changes worked
    rubric:
      excellent: Analyses the misses for patterns, distinguishes causes such as over-commitment, unplanned work or dependencies, makes systemic changes and shows measured improvement.
      good: Identifies a plausible root cause and a change that helped.
      weak: Treats each miss as bad luck or blames individuals.
    followups:
      - What did you have to stop doing?
      - How did stakeholders react to the changes?
    common_errors:
      - Fixing symptoms of individual misses without looking for the pattern.

  - external_key: managerial.delivery_planning.unfamiliar_domain_commit
    competency_key: project_management
    topic: Committing in an unfamiliar domain
    difficulty: hard
    text: >-
      Your team is asked to commit to a launch in a domain nobody on the team has worked in, such as payments
      or regulatory reporting. How would you build a plan you could stand behind?
    expected_concepts:
      - bringing in domain experts or advisers early
      - identifying domain-specific requirements and approvals
      - learning and discovery time in the plan
      - early checkpoints with external reviewers
      - wider ranges until uncertainty drops
    rubric:
      excellent: Plans for domain learning and expert input, finds the hidden requirements such as audits or approvals early, uses checkpoints, and widens the range to reflect uncertainty.
      good: Recognises the knowledge gap and plans to close it before committing firmly.
      weak: Estimates as if it were familiar work.
    followups:
      - Which unknowns would you tackle in the first two weeks?
    common_errors:
      - Missing approval or compliance steps that sit outside engineering.

  - external_key: managerial.delivery_planning.sales_promised_date
    competency_key: stakeholder_management
    topic: Handling a date promised without engineering input
    difficulty: hard
    text: >-
      You find out a sales leader promised a major customer a feature by a specific date without checking with
      engineering. How do you handle it, both for this customer and to stop it happening again?
    expected_concepts:
      - assessing feasibility quickly
      - working with sales on options for the customer
      - escalating appropriately if the promise can't be met
      - establishing a process for future commitments
      - avoiding blame while fixing the process
    rubric:
      excellent: Quickly assesses what is feasible, works with sales on a realistic customer offer, escalates where needed, and sets up a lightweight process so future promises involve engineering.
      good: Handles the immediate situation sensibly and suggests a process fix.
      weak: Either quietly accepts the date or refuses and leaves sales to deal with it.
    followups:
      - Who would you involve in telling the customer?
      - How would you make the process stick?
    common_errors:
      - Fixing this one case and leaving the process unchanged.

  - external_key: managerial.delivery_planning.probabilistic_forecasting
    competency_key: communication
    topic: Introducing probabilistic forecasts
    difficulty: hard
    text: >-
      How would you get stakeholders who are used to single dates to work with forecasts that carry a
      likelihood, such as eighty percent by a given week? Tell me about a time you tried something like that.
    expected_concepts:
      - how the forecast is produced from data
      - explaining likelihood in plain business terms
      - helping stakeholders choose a confidence level for their decision
      - updating forecasts regularly
      - handling resistance
    rubric:
      excellent: Explains how forecasts are generated, translates likelihood into decisions stakeholders care about, lets them choose the confidence level they need, and describes overcoming resistance in a real case.
      good: Describes a sensible way to introduce probabilistic dates with an example.
      weak: Presents percentages without explaining them, or abandons the idea at the first pushback.
    followups:
      - Which stakeholders found it hardest, and why?
    common_errors:
      - Presenting statistics that stakeholders cannot connect to a decision.
