# Managerial round: delivery planning (part 4 of 4) - planning process and ceremonies, delivery
# metrics, growing planning skill in the team, vendors, roadmap changes and organisation-level planning.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ---------------------------------------------------------------- easy
  - external_key: managerial.delivery_planning.plan_vs_actual_review
    competency_key: project_management
    topic: Comparing the plan with what happened
    difficulty: easy
    text: >-
      After a project finishes, how do you look back at how the original plan compared with what actually
      happened?
    expected_concepts:
      - comparing planned and actual dates and scope
      - identifying the biggest sources of variance
      - involving the team in the review
      - feeding lessons into future plans
    rubric:
      excellent: Compares plan and actuals systematically, identifies the main causes of variance with the team, and shows a concrete way lessons changed later planning.
      good: Reviews the plan against outcomes and draws useful lessons.
      weak: Does no review, or reviews only whether the date was hit.
    followups:
      - What's one lesson from such a review that you still apply?
    common_errors:
      - Collecting lessons that never reach the next plan.

  - external_key: managerial.delivery_planning.planning_session_outcomes
    competency_key: agile_delivery
    topic: Running a planning session
    difficulty: easy
    text: >-
      Walk me through how you run sprint planning, or whatever planning session your team uses, and what you
      expect the team to walk away with.
    expected_concepts:
      - preparation such as a refined backlog
      - a clear goal for the period
      - selecting work against realistic capacity
      - shared understanding of who does what first
    rubric:
      excellent: Describes preparation, a clear goal, selection against realistic capacity, and concrete outcomes such as an agreed goal and first steps, with reasons for each part.
      good: Describes a workable session with a clear outcome.
      weak: Describes filling the sprint with tickets until it is full.
    followups:
      - What happens when the session runs long?
    common_errors:
      - Sessions with a list of tickets but no shared goal.

  - external_key: managerial.delivery_planning.coaching_estimation_skill
    competency_key: mentoring
    topic: Helping a less experienced engineer estimate
    difficulty: easy
    text: >-
      How do you help a less experienced engineer get better at estimating their own work? Give me an example
      of someone you helped.
    expected_concepts:
      - breaking work into smaller pieces together
      - naming assumptions and unknowns
      - comparing estimates with actuals afterwards
      - gradually increasing their ownership
    rubric:
      excellent: Describes a specific person, concrete techniques such as decomposition and naming unknowns, a habit of reviewing estimates against actuals, and visible improvement.
      good: Describes practical coaching with an example.
      weak: Tells them to add a safety margin, or estimates for them.
    followups:
      - How did you know they had improved?
    common_errors:
      - Correcting the estimate instead of teaching the reasoning.

  - external_key: managerial.delivery_planning.backlog_trustworthy
    competency_key: agile_delivery
    topic: Keeping the backlog useful for planning
    difficulty: easy
    text: >-
      How do you keep a team's backlog useful for planning rather than a long list nobody trusts?
    expected_concepts:
      - regular refinement of the top items
      - removing or archiving stale items
      - clear ordering by priority
      - items small and clear enough to start
    rubric:
      excellent: Keeps the near-term items refined and ordered, prunes stale items regularly, and explains how this makes planning faster and more reliable.
      good: Has a sensible refinement and pruning practice.
      weak: Lets the backlog grow indefinitely with no ordering.
    followups:
      - How do you handle stakeholders whose old requests you archive?
    common_errors:
      - Refining items far in the future that will change anyway.

  - external_key: managerial.delivery_planning.urgent_request_first_step
    competency_key: project_management
    topic: First response to an urgent request mid-plan
    difficulty: easy
    text: >-
      When an urgent request lands while your team is in the middle of planned work, what do you do first?
    expected_concepts:
      - checking how urgent and important it really is
      - understanding the impact of switching
      - agreeing a trade-off with the requester or priority owner
      - protecting the team from repeated context switching
    rubric:
      excellent: Verifies the urgency and value, weighs the cost of interrupting current work, agrees an explicit trade-off with the right person, and shields the team from constant switching.
      good: Assesses the request before acting and considers the impact.
      weak: Immediately redirects the team without assessing anything.
    followups:
      - Who decides what gets dropped?
    common_errors:
      - Treating every request labelled urgent as top priority.

  - external_key: managerial.delivery_planning.work_to_goals_link
    competency_key: leadership
    topic: Connecting daily work to organisation goals
    difficulty: easy
    text: >-
      How do you connect your team's day-to-day work to the bigger goals your organisation has set? Give me an
      example from your recent work.
    expected_concepts:
      - understanding the organisation's goals
      - mapping team initiatives to those goals
      - explaining the link to the team
      - using goals to decide between competing work
    rubric:
      excellent: Shows a clear mapping from organisation goals to the team's initiatives, explains how they communicate it to the team, and gives an example of using it to make a prioritisation decision.
      good: Links work to goals and explains it to the team.
      weak: Cannot describe how the team's work relates to wider goals.
    followups:
      - What happens to work that doesn't connect to any goal?
    common_errors:
      - Goals mentioned at planning and then forgotten.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.delivery_planning.delegating_project_planning
    competency_key: mentoring
    topic: Handing project planning to a tech lead
    difficulty: medium
    text: >-
      Tell me about a time you handed ownership of planning a project to a tech lead or senior engineer. How
      did you support them without taking it back?
    expected_concepts:
      - clear expectations of ownership
      - agreed check-in points
      - coaching through questions instead of answers
      - stepping in only on agreed triggers
      - growth outcome for the person
    rubric:
      excellent: Set clear ownership and checkpoints, coached through questions, stepped in only when agreed thresholds were crossed, and describes how the person grew and the project outcome.
      good: Delegated planning with appropriate support.
      weak: Delegated in name but made the decisions, or left them with no support.
    followups:
      - Was there a moment you were tempted to take over?
    common_errors:
      - Rewriting the delegated plan when it differs from what they would have done.

  - external_key: managerial.delivery_planning.velocity_comparison
    competency_key: agile_delivery
    topic: Comparing velocity across teams
    difficulty: medium
    text: >-
      A senior leader wants to compare velocity across teams to judge which ones are performing best. How
      would you respond?
    expected_concepts:
      - velocity is team-relative and not comparable
      - risk of inflation and gaming
      - understanding what the leader really wants to know
      - proposing outcome-based or flow measures instead
    rubric:
      excellent: Explains why velocity is not comparable and invites gaming, explores the leader's underlying question, and offers better measures such as outcomes delivered or flow metrics.
      good: Explains the problem and suggests an alternative.
      weak: Agrees to the comparison, or dismisses the request without offering anything.
    followups:
      - What would you show that leader instead?
    common_errors:
      - Rejecting the request without addressing the real concern behind it.

  - external_key: managerial.delivery_planning.delivery_measures_choice
    competency_key: project_management
    topic: Choosing measures of delivery performance
    difficulty: medium
    text: >-
      If you had to pick a small set of measures to understand how well your team delivers, which would you
      choose, and why?
    expected_concepts:
      - speed measures such as lead or cycle time
      - predictability against commitments
      - quality measures such as change failures or escaped defects
      - outcome measures tied to users or business
      - how the measures are used, not weaponised
    rubric:
      excellent: Chooses a balanced set covering speed, predictability, quality and outcomes, explains why each matters and how it would be used for improvement rather than judgement.
      good: Picks sensible measures with reasons.
      weak: Picks only output counts such as tickets closed or lines of code.
    followups:
      - How would you stop people gaming them?
    common_errors:
      - Measuring output without quality or outcome.

  - external_key: managerial.delivery_planning.vendor_dependent_delivery
    competency_key: stakeholder_management
    topic: Delivering with an outside vendor
    difficulty: medium
    text: >-
      Tell me about a time you depended on an outside vendor or contractor to deliver part of a project. How
      did you plan around them and keep the work on track?
    expected_concepts:
      - clear deliverables and acceptance criteria
      - interim milestones and early demos
      - regular joint reviews
      - contingency for vendor delays
      - managing the relationship
    rubric:
      excellent: Set clear deliverables and acceptance criteria, used interim milestones and early demos to verify progress, held regular reviews, and had a contingency plan, with a concrete outcome.
      good: Real example with sensible vendor management.
      weak: Waited for the final delivery and discovered problems then.
    followups:
      - What would you do differently in the contract or kickoff?
    common_errors:
      - Accepting vendor status reports without seeing working output.

  - external_key: managerial.delivery_planning.fragile_code_estimates
    competency_key: project_management
    topic: Estimating features in fragile code
    difficulty: medium
    text: >-
      How do you account for the extra cost of working in messy or fragile code when your team estimates new
      features? Tell me about an example.
    expected_concepts:
      - identifying risky areas of the codebase
      - including refactoring or testing time in estimates
      - making that cost visible to stakeholders
      - using the data to argue for improvement work
    rubric:
      excellent: Identifies fragile areas explicitly, builds the extra cost into estimates visibly, and uses the repeated cost as evidence for targeted improvement work, with an example.
      good: Accounts for code quality in estimates with an example.
      weak: Estimates as though the code were clean and then overruns.
    followups:
      - How did stakeholders react when you made that cost visible?
    common_errors:
      - Hiding the cost inside estimates so nobody sees the case for fixing it.

  - external_key: managerial.delivery_planning.heavy_planning_process
    competency_key: agile_delivery
    topic: Trimming a heavy planning process
    difficulty: medium
    text: >-
      Your team says planning meetings take too long and don't add much value. How would you work out what to
      keep and what to drop?
    expected_concepts:
      - asking what decisions the planning supports
      - gathering the team's view of what helps
      - trying a lighter process as an experiment
      - checking whether predictability suffers
    rubric:
      excellent: Starts from what decisions planning must support, asks the team what helps, runs a time-boxed experiment with a lighter process, and checks delivery predictability before and after.
      good: Involves the team and makes reasoned cuts.
      weak: Keeps everything as is, or drops planning entirely.
    followups:
      - What would you never drop?
    common_errors:
      - Removing ceremonies without checking the effect on delivery.

  - external_key: managerial.delivery_planning.changing_work_method
    competency_key: agile_delivery
    topic: Changing how a team organises its work
    difficulty: medium
    text: >-
      Tell me about a time you changed how a team organised its work, for example moving from sprints to
      continuous flow or the other way around. What prompted it, and what happened?
    expected_concepts:
      - the problem that prompted the change
      - how the team was involved
      - how the change was trialled
      - measured effect on delivery
    rubric:
      excellent: Describes a specific problem, a change made with the team as a trial, and measured effects on delivery, including what did not work.
      good: Real example with a clear reason and result.
      weak: Changed method because it was fashionable, or cannot describe the effect.
    followups:
      - How did stakeholders outside the team notice the change?
    common_errors:
      - Changing method without a problem it was meant to solve.

  - external_key: managerial.delivery_planning.roadmap_change_comms
    competency_key: communication
    topic: Communicating roadmap changes
    difficulty: medium
    text: >-
      How do you communicate changes to a published roadmap to the people who rely on it? Tell me about a
      time you had to do this.
    expected_concepts:
      - identifying who is affected
      - explaining the reason for the change
      - telling the most affected people directly first
      - keeping a single up-to-date source
    rubric:
      excellent: Identifies affected groups, speaks directly to the most affected before broad announcement, explains the reasoning, and keeps one current source of truth.
      good: Communicates changes clearly with reasons.
      weak: Updates the document silently and expects people to notice.
    followups:
      - Who was most unhappy, and how did you handle it?
    common_errors:
      - Changing the roadmap without telling those who planned around it.

  - external_key: managerial.delivery_planning.discovery_and_delivery_mix
    competency_key: project_management
    topic: Planning discovery work alongside delivery
    difficulty: medium
    text: >-
      How do you plan for work where the team first has to figure out what to build, like research or
      discovery, alongside work with clear requirements?
    expected_concepts:
      - time-boxing discovery with clear questions
      - separating discovery and delivery commitments
      - decision points after discovery
      - capacity split between the two
    rubric:
      excellent: Time-boxes discovery around explicit questions, commits only to delivery work that is understood, sets decision points where discovery turns into delivery, and allocates capacity explicitly.
      good: Separates discovery from delivery in planning.
      weak: Commits to delivery dates for work that has not been discovered yet.
    followups:
      - What does the output of discovery look like for you?
    common_errors:
      - Open-ended discovery with no end date or decision.

  - external_key: managerial.delivery_planning.retro_actions_stick
    competency_key: agile_delivery
    topic: Making retrospective actions stick
    difficulty: medium
    text: >-
      Retrospectives on your team keep producing the same action items about planning. How would you make the
      improvements actually stick?
    expected_concepts:
      - fewer, specific actions with owners
      - reviewing previous actions at the start of each retro
      - making changes part of the process itself
      - finding why earlier actions failed
    rubric:
      excellent: Limits actions to a few specific owned changes, reviews them each time, builds them into the team's process, and investigates why earlier actions didn't land.
      good: Introduces ownership and follow-up for actions.
      weak: Encourages the team to try harder on the same items.
    followups:
      - Which repeated item would you tackle first?
    common_errors:
      - Long lists of vague actions with no owner.

  - external_key: managerial.delivery_planning.individual_overcommitment
    competency_key: mentoring
    topic: Coaching someone who overcommits
    difficulty: medium
    text: >-
      One engineer on your team regularly takes on more than they can finish, which leads to surprises at the
      end of each sprint. How do you coach them?
    expected_concepts:
      - discussing the pattern with specific examples
      - understanding why they overcommit
      - helping them break down and size work
      - practising saying no or negotiating
      - following up over time
    rubric:
      excellent: Raises the pattern with concrete examples, explores the reasons, teaches decomposition and negotiation, and follows up to see improvement.
      good: Has a supportive coaching approach with practical steps.
      weak: Simply assigns them less work without addressing the habit.
    followups:
      - How would you handle it if the pattern continued?
    common_errors:
      - Fixing the symptom by removing work rather than building the skill.

  - external_key: managerial.delivery_planning.distributed_team_planning
    competency_key: collaboration
    topic: Planning across time zones
    difficulty: medium
    text: >-
      How do you run planning for a team spread across several time zones so that everyone contributes and
      commitments stay clear?
    expected_concepts:
      - asynchronous preparation and written proposals
      - rotating or overlapping meeting times
      - clear written outcomes
      - ownership that minimises hand-offs across time zones
    rubric:
      excellent: Uses written async preparation, fair meeting times, clear written outcomes, and structures ownership to reduce cross-time-zone hand-offs, with an example.
      good: Has a practical approach that includes everyone.
      weak: Runs planning at a time convenient for one location only.
    followups:
      - What goes wrong most often in that setup?
    common_errors:
      - Decisions made in a meeting half the team could not attend.

  - external_key: managerial.delivery_planning.done_mismatch
    competency_key: communication
    topic: Mismatch on what done means
    difficulty: medium
    text: >-
      Tell me about a time your team considered something done but stakeholders expected more. What happened,
      and what changed afterwards?
    expected_concepts:
      - what each side expected
      - why the gap was not caught
      - how it was resolved
      - a shared definition of done afterwards
    rubric:
      excellent: Describes both sides' expectations, why the gap went unnoticed, how it was resolved, and a durable change such as agreed acceptance criteria or demos.
      good: Real example with a sensible fix.
      weak: Blames stakeholders for changing their minds.
    followups:
      - How do you check expectations earlier now?
    common_errors:
      - Treating done as code merged rather than value delivered.

  # ---------------------------------------------------------------- hard
  - external_key: managerial.delivery_planning.org_planning_process_design
    competency_key: leadership
    topic: Designing planning for a larger organisation
    difficulty: hard
    text: >-
      You're asked to design the planning process for an engineering group of about sixty people that
      currently plans team by team with no shared view. What would you put in place, and how would you roll it
      out?
    expected_concepts:
      - shared goals and a planning calendar
      - visible cross-team dependencies
      - lightweight, consistent artefacts across teams
      - incremental rollout with feedback
      - measures of whether planning improved
    rubric:
      excellent: Proposes shared goals, a common calendar and light artefacts that expose dependencies, rolls it out incrementally with team input, and defines how they would know it improved delivery.
      good: Proposes a sensible shared process and rollout.
      weak: Imposes a heavy framework on all teams at once.
    followups:
      - What would you leave each team free to decide?
    common_errors:
      - Introducing heavy process that teams work around.

  - external_key: managerial.delivery_planning.commitment_metric_gaming
    competency_key: leadership
    topic: Commitment metrics improving without results
    difficulty: hard
    text: >-
      After leadership began tracking how often teams hit their sprint commitments, the numbers improved but
      customers aren't seeing faster delivery. What do you think is happening, and what would you do?
    expected_concepts:
      - teams committing to less to hit the number
      - output measure detached from outcomes
      - talking with teams without blame
      - replacing or balancing the metric with outcome measures
    rubric:
      excellent: Recognises how the metric invites smaller or safer commitments, investigates with teams without blame, and changes measurement to balance predictability with outcomes customers notice.
      good: Identifies gaming and proposes better measures.
      weak: Pushes teams to commit more or accepts the improved numbers at face value.
    followups:
      - How would you bring this to leadership?
    common_errors:
      - Blaming teams for responding rationally to the incentive.

  - external_key: managerial.delivery_planning.planning_bench_strength
    competency_key: mentoring
    topic: Building planning skill across the team
    difficulty: hard
    text: >-
      How have you built planning and estimation skill across a team so that delivery doesn't depend on you
      personally? Give me concrete examples of what you did and how you knew it worked.
    expected_concepts:
      - rotating planning ownership
      - pairing and coaching on real projects
      - shared practices and templates
      - evidence such as others leading plans successfully
    rubric:
      excellent: Gives concrete practices such as rotating ownership and coaching on real plans, and evidence like others running projects predictably while they were absent.
      good: Describes credible steps to spread planning skill.
      weak: Remains the only person who plans, or offers only generic training.
    followups:
      - Who struggled most, and how did you help them?
    common_errors:
      - Delegating planning without the coaching that builds skill.

  - external_key: managerial.delivery_planning.outsourced_team_late
    competency_key: stakeholder_management
    topic: Late and incomplete outsourced deliveries
    difficulty: hard
    text: >-
      A program you run uses your in-house team plus an outsourced team from another company, and the
      outsourced deliveries keep arriving late and incomplete. How would you diagnose it and change the setup?
    expected_concepts:
      - examining requirements clarity and hand-offs
      - incentives and terms of the contract
      - smaller increments with acceptance checks
      - integrating the teams more closely
      - escalating commercially if needed
    rubric:
      excellent: Diagnoses both sides including unclear requirements and hand-offs, reviews incentives in the contract, moves to small accepted increments and closer integration, and escalates commercially only with evidence.
      good: Identifies likely causes and makes practical changes.
      weak: Blames the vendor and only escalates or threatens penalties.
    followups:
      - What would you look at first?
    common_errors:
      - Assuming the problem lies only with the outsourced team.

  - external_key: managerial.delivery_planning.ambition_vs_predictability
    competency_key: leadership
    topic: Balancing ambitious goals with predictability
    difficulty: hard
    text: >-
      Some leaders want teams to commit only to what they're sure to deliver, while others want ambitious goals
      and accept misses. How do you set that balance for your teams, and how do you explain it to your own
      leadership?
    expected_concepts:
      - where predictability matters, such as external commitments
      - where ambition matters, such as internal goals
      - explicit labelling of goal types
      - how misses are treated
      - aligning leadership on the approach
    rubric:
      excellent: Distinguishes contexts needing predictability from those suited to ambitious goals, labels goals explicitly, sets how misses are treated, and has aligned leadership on that approach.
      good: Offers a reasoned balance with an explanation for leadership.
      weak: Picks one extreme without considering context.
    followups:
      - What happens when an ambitious goal becomes an external promise?
    common_errors:
      - Mixing committed and aspirational goals in the same list.

  - external_key: managerial.delivery_planning.long_initiative_checkpoints
    competency_key: project_management
    topic: Evidence-based checkpoints on a long initiative
    difficulty: hard
    text: >-
      You're leading a twelve-month initiative with a large investment behind it. How would you structure
      checkpoints so leadership can decide to continue, change course or stop based on real evidence?
    expected_concepts:
      - checkpoints tied to evidence, not elapsed time
      - criteria agreed in advance
      - early delivery of measurable value
      - options presented at each checkpoint
      - willingness to recommend stopping
    rubric:
      excellent: Defines evidence-based checkpoints with criteria agreed in advance, delivers measurable value early, presents real options at each one, and is prepared to recommend stopping.
      good: Proposes sensible checkpoints with criteria.
      weak: Reports progress periodically with no decision criteria.
    followups:
      - What evidence would you want after the first three months?
    common_errors:
      - Checkpoints that only report activity and never risk a stop decision.
