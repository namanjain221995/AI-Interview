# Managerial round: performance management and feedback (part 4 of 4).
# Focus: underperformance, improvement plans, separations, coaching other managers and
# keeping the performance process fair and work-related.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ early underperformance
  - external_key: managerial.performance_feedback.early_warning_signs
    competency_key: people_management
    topic: Recognising early signs of underperformance
    difficulty: easy
    text: >-
      What are the early signs in someone's work that tell you their performance might be slipping, and what is the
      first thing you do when you notice them?
    expected_concepts:
      - observable work signals such as missed commitments or quality issues
      - checking the signal against more than one data point
      - an early, private, curious conversation
      - clarifying expectations and offering help
      - noting the conversation for later follow-up
    rubric:
      excellent: Names concrete work-based signals, checks them against evidence and describes an early, curious conversation that clarifies expectations and agrees follow-up.
      good: Names reasonable signals and an early conversation, with less on verification or follow-up.
      weak: Waits until the problem is obvious or jumps straight to formal action.
    followups:
      - When did one of these signals turn out to be a false alarm?
      - How soon after noticing do you act?
    common_errors:
      - Reading meaning into working hours or online presence rather than outcomes.

  - external_key: managerial.performance_feedback.skill_vs_will
    competency_key: people_management
    topic: Diagnosing the cause of a performance gap
    difficulty: medium
    text: >-
      When someone isn't delivering what you expect, how do you work out whether the cause is a skill gap, unclear
      priorities, a problem in the environment or something else? Walk me through a case you diagnosed.
    expected_concepts:
      - testing whether expectations were clear
      - looking at the systems, tooling and dependencies around the work
      - checking for skill gaps through specific tasks
      - asking the person what is getting in the way of the work
      - choosing a response that fits the cause
    rubric:
      excellent: Uses a structured diagnosis that checks expectations, environment and skills, involves the person in identifying work obstacles and matches the response to the cause, with a real example.
      good: Considers several causes with a reasonable example, though the diagnosis is informal.
      weak: Assumes a lack of effort or skill without checking other causes.
    followups:
      - What did you learn that surprised you?
      - How did the response differ once you knew the cause?
    common_errors:
      - Asking about private life rather than work obstacles.

  - external_key: managerial.performance_feedback.team_impact_of_low_performance
    competency_key: leadership
    topic: Team impact of an unresolved performance issue
    difficulty: medium
    text: >-
      Tell me about a time an unresolved performance issue on your team started affecting other people's work. How
      did you balance fairness to that person with fairness to the rest of the team?
    expected_concepts:
      - recognising the impact on others' workload and quality
      - moving faster on the performance conversation
      - redistributing work transparently without public blame
      - keeping the individual's process private
      - reflecting on whether they waited too long
    rubric:
      excellent: Recognises the team impact, acts promptly on the individual issue, manages workload fairly without public blame, keeps the process private and reflects on timing.
      good: Addresses both sides reasonably, though slowly or with limited reflection.
      weak: Lets the team absorb the work indefinitely or discusses the person's performance with peers.
    followups:
      - What did you tell the team, and what did you hold back?
      - What would you do sooner next time?
    common_errors:
      - Quietly routing work around the person instead of addressing the gap.

  # ------------------------------------------------------------ improvement plans
  - external_key: managerial.performance_feedback.improvement_plan_design
    competency_key: people_management
    topic: Designing a formal improvement plan
    difficulty: medium
    text: >-
      If you had to put someone on a formal performance improvement plan, how would you design it so that it gives
      them a genuine chance to succeed? What goes into it?
    expected_concepts:
      - specific, measurable expectations tied to the role
      - a realistic time frame
      - support such as pairing, mentoring or reduced scope
      - frequent documented check-ins
      - clear consequences and partnership with HR
    rubric:
      excellent: Designs a plan with measurable, role-based goals, realistic timelines, real support and documented check-ins, and is explicit and fair about the possible outcomes.
      good: Includes clear goals and check-ins, but support or consequences are thin.
      weak: Treats the plan as paperwork before an exit, with vague or unachievable goals.
    followups:
      - How would you know the goals were achievable for someone at that level?
      - What role does HR play?
    common_errors:
      - Setting goals that are higher than the role's normal expectations.

  - external_key: managerial.performance_feedback.improvement_plan_success
    competency_key: people_management
    topic: An improvement plan that worked
    difficulty: medium
    text: >-
      Tell me about a time someone you managed or led turned their performance around after a serious concern was
      raised. What made the difference, and what was your part in it?
    expected_concepts:
      - clear statement of the concern and expectations
      - specific support the manager provided
      - regular feedback during the recovery
      - the person's own actions
      - how performance was sustained afterwards
    rubric:
      excellent: Describes a real turnaround with clear expectations, specific support and feedback, credits the person's actions and shows how the improvement was sustained.
      good: Gives a credible turnaround story with a reasonable account of their role.
      weak: Cannot give an example, or claims all credit for the change.
    followups:
      - How did you rebuild trust afterwards?
      - Did the issue ever come back?
    common_errors:
      - Ending support as soon as the formal plan closes.

  - external_key: managerial.performance_feedback.improvement_plan_failing
    competency_key: people_management
    topic: Deciding when a plan has not worked
    difficulty: hard
    text: >-
      Partway through an improvement plan, the person is making some progress but is clearly not going to meet all
      the goals by the deadline. How would you decide what to do next?
    expected_concepts:
      - comparing progress against the agreed goals objectively
      - judging whether the trend is credible
      - considering an extension, a different role or an exit
      - consistency with how similar cases were handled
      - clear, documented communication with the person and HR
    rubric:
      excellent: Weighs objective progress and trajectory against agreed goals, considers the realistic options including other roles, ensures consistency and communicates clearly with documentation.
      good: Makes a reasonable decision with some structure, but less attention to consistency or options.
      weak: Extends indefinitely to avoid a decision, or ends employment ignoring real progress.
    followups:
      - When would a different role be the right answer?
      - How would you explain the decision to them?
    common_errors:
      - Moving the goalposts during the plan.

  - external_key: managerial.performance_feedback.documentation_practice
    competency_key: people_management
    topic: Documenting performance conversations
    difficulty: easy
    text: >-
      How do you document performance conversations, both the positive and the difficult ones, and why does that
      matter?
    expected_concepts:
      - short written summaries after significant conversations
      - sharing summaries with the person
      - factual, work-focused language
      - storing records according to company policy
      - using records to keep reviews accurate and fair
    rubric:
      excellent: Keeps factual, timely notes of both positive and difficult conversations, shares summaries with the person and explains how records support fairness.
      good: Documents significant conversations with factual notes.
      weak: Documents only when building a case for dismissal, or not at all.
    followups:
      - What would you never write in those notes?
      - Has documentation ever changed an outcome?
    common_errors:
      - Writing opinions about the person instead of facts about the work.

  - external_key: managerial.performance_feedback.hr_partnership
    competency_key: stakeholder_management
    topic: Working with HR on performance cases
    difficulty: medium
    text: >-
      Tell me about how you worked with HR or a people partner on a difficult performance situation. When did you
      bring them in, and how did you split responsibilities?
    expected_concepts:
      - involving HR early rather than at the end
      - understanding policy and legal requirements
      - manager retains ownership of the feedback and decisions
      - consistent documentation shared appropriately
      - using HR for advice on fairness and consistency
    rubric:
      excellent: Brings HR in early, uses them for policy and consistency advice, keeps ownership of feedback and decisions and maintains clear documentation, with a real example.
      good: Works with HR reasonably, though late in the process.
      weak: Hands the problem to HR or ignores HR until a dispute.
    followups:
      - What advice from HR changed your approach?
      - Where did you disagree with them?
    common_errors:
      - Expecting HR to deliver the difficult message.

  # ------------------------------------------------------------ separations and role changes
  - external_key: managerial.performance_feedback.letting_someone_go
    competency_key: people_management
    topic: Ending employment for performance
    difficulty: hard
    text: >-
      Tell me about a time you had to let someone go for performance reasons. How did you reach the decision, how
      did you handle the conversation, and what did you do with the team afterwards?
    expected_concepts:
      - fair, documented process before the decision
      - clear and respectful final conversation
      - practical support for the transition
      - communicating with the team without sharing private details
      - reflection on what could have happened earlier
    rubric:
      excellent: Shows a fair, documented path to the decision, a clear and respectful conversation, practical transition support, a discreet team message and reflection.
      good: Handles the process fairly with a reasonable account, but limited reflection or team follow-up.
      weak: The decision came as a surprise to the person, or the team was told private details.
    followups:
      - Was there anything the person did not expect?
      - How did you handle the work they left behind?
    common_errors:
      - Delaying the decision so long that the team loses trust in the process.

  - external_key: managerial.performance_feedback.role_mismatch
    competency_key: people_management
    topic: Moving someone to a better-fitting role
    difficulty: medium
    text: >-
      Have you had someone who was struggling in their role but whose skills suited a different role better, such
      as moving from backend work to tooling, or from engineering to a delivery role? Tell me how you handled it.
    expected_concepts:
      - recognising strengths that fit another role
      - discussing options openly with the person
      - working with the receiving manager on expectations
      - a fair trial period with clear goals
      - outcome for the person and both teams
    rubric:
      excellent: Identifies a genuine strengths-based match, involves the person in the choice, sets clear expectations with the receiving team and shows the outcome.
      good: Handles the move sensibly with a reasonable example.
      weak: Moves someone to another team to get rid of the problem.
    followups:
      - What did you tell the receiving manager?
      - How did you make sure it was the person's choice?
    common_errors:
      - Passing a performance problem to another team without disclosure.

  - external_key: managerial.performance_feedback.new_hire_not_working
    competency_key: people_management
    topic: A new hire who is not working out
    difficulty: medium
    text: >-
      A person you hired three months ago is clearly behind where you expected them to be. How would you work out
      what is going wrong, and what would you do about it?
    expected_concepts:
      - checking the onboarding and support they received
      - comparing against realistic ramp-up expectations
      - explicit conversation about the gap
      - focused support with short-term goals
      - reflecting on the hiring process signals
    rubric:
      excellent: Examines onboarding and expectations first, has an explicit conversation, sets short-term goals with support and reflects on what the hiring process missed.
      good: Addresses the gap with support and goals, with less reflection.
      weak: Concludes it was a bad hire without examining onboarding or support.
    followups:
      - What would you change in your hiring loop?
      - At what point would you decide it isn't going to work?
    common_errors:
      - Expecting full productivity before onboarding is complete.

  # ------------------------------------------------------------ coaching managers and leads
  - external_key: managerial.performance_feedback.coaching_new_manager_feedback
    competency_key: mentoring
    topic: Coaching a new manager on hard feedback
    difficulty: hard
    text: >-
      One of the managers who reports to you keeps avoiding a difficult performance conversation with someone on
      their team. How would you coach them through it without taking it over?
    expected_concepts:
      - understanding why they are avoiding it
      - helping them gather specific evidence
      - rehearsing the conversation
      - agreeing a date and debriefing afterwards
      - stepping in only if the delay harms the team or the employee
    rubric:
      excellent: Explores the reasons for avoidance, helps prepare evidence and rehearse, sets a clear deadline with a debrief and knows the point at which to intervene.
      good: Coaches with reasonable steps, but no clear deadline or escalation point.
      weak: Takes over the conversation or lets the delay continue.
    followups:
      - What would you do if they still didn't have the conversation?
      - How would you assess this in their own review?
    common_errors:
      - Rescuing the manager and removing their chance to learn.

  - external_key: managerial.performance_feedback.manager_performance_signals
    competency_key: leadership
    topic: Assessing a manager's performance
    difficulty: hard
    text: >-
      How do you assess how well one of your managers is doing, given that most of their impact comes through other
      people? Tell me about a manager you assessed and what you looked at.
    expected_concepts:
      - team outcomes and delivery over time
      - growth and retention of their reports
      - quality of their reviews and feedback practice
      - upward and peer feedback
      - how they handle difficult people decisions
    rubric:
      excellent: Uses several indirect signals such as team outcomes, report growth, review quality and upward feedback, with a specific example of the assessment and coaching that followed.
      good: Considers delivery and people outcomes with a reasonable example.
      weak: Judges managers mainly on delivery or on how much they agree with their own manager.
    followups:
      - Which signal turned out to be most reliable?
      - What did you tell that manager?
    common_errors:
      - Rewarding managers for heroic personal output rather than team results.

  - external_key: managerial.performance_feedback.tech_lead_coaching_peer
    competency_key: mentoring
    topic: A tech lead helping a struggling teammate
    difficulty: easy
    text: >-
      As a tech lead, tell me about a time you noticed a teammate struggling with their work. What did you do
      yourself, and when did you involve their manager?
    expected_concepts:
      - noticing specific signals in the work
      - offering direct help such as pairing or clarifying scope
      - talking to the person before escalating
      - involving the manager when it went beyond technical help
      - outcome for the teammate
    rubric:
      excellent: Spots specific signals, provides direct practical help, speaks with the person first and involves the manager at the right point, with a clear outcome.
      good: Helps the teammate with a reasonable example, though the manager link is unclear.
      weak: Reported straight to the manager or ignored it as outside their role.
    followups:
      - How did you avoid doing the work for them?
      - What did the manager do with your input?
    common_errors:
      - Taking over the teammate's work to protect the deadline.

  # ------------------------------------------------------------ fairness and judgement
  - external_key: managerial.performance_feedback.likability_bias
    competency_key: people_management
    topic: Separating rapport from performance
    difficulty: medium
    text: >-
      It is easy to rate people you get along with more favourably. What do you do to keep your working relationship
      with someone from influencing how you assess their work?
    expected_concepts:
      - anchoring assessments in documented evidence
      - comparing against written expectations
      - seeking input from people outside the relationship
      - checking for patterns in your own past ratings
      - inviting challenge in calibration
    rubric:
      excellent: Describes concrete safeguards such as evidence-first assessment, outside input and checking their own patterns, with an example where it changed their view.
      good: Names a couple of reasonable safeguards.
      weak: Claims to be unaffected by working relationships.
    followups:
      - When did you catch yourself doing this?
      - How would someone on your team know you are being even-handed?
    common_errors:
      - Assuming awareness alone prevents the effect.

  - external_key: managerial.performance_feedback.flexible_schedule_fairness
    competency_key: people_management
    topic: Judging output fairly across working patterns
    difficulty: medium
    text: >-
      On a team where people work different hours, some part-time and some fully remote, how do you make sure
      performance is judged on outcomes rather than on who is online the most?
    expected_concepts:
      - outcome-based expectations scaled to agreed working time
      - making work visible through artefacts rather than presence
      - consistent feedback for everyone regardless of schedule
      - checking reviews for proximity or presence bias
      - setting clear response-time norms instead of always-on expectations
    rubric:
      excellent: Sets outcome-based, fairly scaled expectations, relies on visible work artefacts, applies consistent feedback and checks for presence bias, with an example.
      good: Focuses on outcomes with reasonable practices.
      weak: Equates availability or meeting attendance with performance.
    followups:
      - How do you set expectations for someone working reduced hours?
      - What norms did you write down for your team?
    common_errors:
      - Rewarding fast replies to messages as a proxy for impact.

  - external_key: managerial.performance_feedback.feedback_on_reliability
    competency_key: people_management
    topic: Addressing missed commitments
    difficulty: easy
    text: >-
      Someone on your team often says a task is nearly done and then misses the date. How would you address that
      with them?
    expected_concepts:
      - specific examples of missed commitments and their impact
      - understanding how they estimate and track progress
      - agreeing on earlier risk signalling
      - smaller milestones and check-ins
      - following up to see if the pattern changes
    rubric:
      excellent: Raises specific examples and impact, explores how they plan and report progress, agrees on earlier risk signalling with smaller milestones and follows up.
      good: Addresses the pattern with examples and a reasonable fix.
      weak: Labels the person unreliable or simply adds more status meetings.
    followups:
      - How would you encourage them to flag risk earlier without fear?
      - What if the dates were set by someone else?
    common_errors:
      - Punishing bad news so that people hide risks.

  - external_key: managerial.performance_feedback.feedback_after_reorg
    competency_key: leadership
    topic: Performance during organisational change
    difficulty: medium
    text: >-
      Tell me about a period of big organisational change, such as a reorganisation or a shift in strategy, and how
      you handled performance expectations and feedback for your team during it.
    expected_concepts:
      - restating expectations clearly during uncertainty
      - adjusting goals to the new reality
      - increasing the frequency of check-ins
      - recognising work that kept things running
      - fair evaluation given the disruption
    rubric:
      excellent: Restates expectations clearly, adjusts goals, increases check-ins, recognises stabilising work and evaluates fairly given the disruption, with a concrete example.
      good: Keeps expectations clear during change with a reasonable example.
      weak: Pauses all performance conversations until things settle.
    followups:
      - What did people find most confusing?
      - How did the change affect that cycle's ratings?
    common_errors:
      - Holding people to plans the organisation no longer supports.

  - external_key: managerial.performance_feedback.contractor_vendor_performance
    competency_key: stakeholder_management
    topic: Managing performance of contractors or vendors
    difficulty: medium
    text: >-
      When contractors or an outside vendor team are part of your delivery, how do you handle feedback and
      performance concerns with them? Tell me about a time it was needed.
    expected_concepts:
      - clear deliverables and quality expectations in the agreement
      - feedback through the right channel such as the vendor lead
      - evidence of the gap and its delivery impact
      - agreed corrective plan and timeline
      - escalation or replacement options
    rubric:
      excellent: Ties feedback to clear agreed expectations, uses the right channel with specific evidence, agrees a corrective plan and knows the escalation options, with a real example.
      good: Raises concerns appropriately with a reasonable outcome.
      weak: Tolerates poor delivery or bypasses the vendor's own management.
    followups:
      - How was this different from feedback to your own team?
      - What would you write into the next agreement?
    common_errors:
      - Giving no feedback until the contract ends.

  - external_key: managerial.performance_feedback.high_performer_burnout_risk
    competency_key: people_management
    topic: Sustainable pace for strong performers
    difficulty: medium
    text: >-
      Your most productive engineer is consistently taking on far more than anyone else, and you are starting to see
      the quality of their work slip. How would you address it?
    expected_concepts:
      - specific observations about workload and quality
      - conversation focused on sustainable pace and priorities
      - redistributing or dropping work
      - fixing the team dependence on one person
      - checking in over the following weeks
    rubric:
      excellent: Raises specific observations, reshapes priorities and workload, reduces the team's dependence on one person and follows up over time.
      good: Reduces workload with a sensible conversation, but does not address the team dependency.
      weak: Praises the output and ignores the slipping quality.
    followups:
      - How would you stop the same pattern from returning?
      - How would you recognise their work without rewarding overload?
    common_errors:
      - Rewarding overwork in reviews in a way that encourages it.

  - external_key: managerial.performance_feedback.feedback_conflicting_priorities
    competency_key: stakeholder_management
    topic: Feedback when an engineer serves two masters
    difficulty: hard
    text: >-
      An engineer on your team splits time between your project and another team, and the other team's lead tells
      you they are unhappy with the engineer's work. How would you handle the feedback and the underlying situation?
    expected_concepts:
      - getting specific examples from the other lead
      - checking whether competing priorities caused the issue
      - clarifying the split and priorities with both leads
      - passing on specific, actionable feedback to the engineer
      - fair assessment that accounts for the split
    rubric:
      excellent: Gathers specifics, checks whether the split itself caused the problem, fixes priorities with both leads and gives the engineer actionable feedback assessed fairly.
      good: Passes on feedback and clarifies priorities, with less investigation.
      weak: Relays the complaint without context or dismisses the other lead.
    followups:
      - Who should own the engineer's review in this setup?
      - How would you prevent this in future shared arrangements?
    common_errors:
      - Blaming the engineer for a priority conflict created by the leads.

  - external_key: managerial.performance_feedback.performance_conversation_reflection
    competency_key: leadership
    topic: Learning from a performance conversation that went badly
    difficulty: medium
    text: >-
      Tell me about a performance conversation you led that didn't go well. What happened, and what did you change
      in how you handle these conversations afterwards?
    expected_concepts:
      - clear account of what went wrong
      - their own contribution to the outcome
      - how they repaired the situation
      - specific change in practice
      - evidence the change helped later
    rubric:
      excellent: Gives a specific account, owns their part, explains the repair and a concrete practice change that helped in later conversations.
      good: Reflects on a real example with a reasonable lesson.
      weak: Blames the other person or picks an example with no real difficulty.
    followups:
      - How did the relationship recover?
      - What would the other person say about that conversation?
    common_errors:
      - Lessons that amount to being nicer rather than being clearer.

  - external_key: managerial.performance_feedback.team_level_performance_issue
    competency_key: leadership
    topic: When the whole team is underperforming
    difficulty: hard
    text: >-
      You take over a team that is consistently missing its commitments and producing low-quality work, and it is
      not about any one person. How would you diagnose and address performance at the team level?
    expected_concepts:
      - diagnosing systemic causes such as unclear goals, process and dependencies
      - listening to the team before acting
      - resetting a small number of clear team expectations
      - quick wins that build momentum
      - individual conversations where gaps remain after systemic fixes
    rubric:
      excellent: Diagnoses systemic causes with the team, resets clear expectations, delivers early wins and addresses individual gaps only after fixing the system, with clear measures of progress.
      good: Has a reasonable plan mixing system fixes and expectations, with fewer measures.
      weak: Starts by putting individuals on plans, or blames the previous leadership.
    followups:
      - What would you measure in your first three months?
      - How would you tell an individual gap from a systemic one?
    common_errors:
      - Treating a systemic problem as many individual performance issues.

  - external_key: managerial.performance_feedback.feedback_tools_lightweight
    competency_key: people_management
    topic: Lightweight tracking of team performance notes
    difficulty: easy
    text: >-
      What simple system do you use to keep track of feedback, achievements and concerns for each person on your
      team throughout the year?
    expected_concepts:
      - a consistent place for notes per person
      - capturing both wins and concerns as they happen
      - sharing relevant notes with the person
      - using the notes in one-to-ones and reviews
      - respecting privacy and company policy
    rubric:
      excellent: Describes a simple, consistently used system capturing wins and concerns, shared appropriately and used in one-to-ones and reviews.
      good: Keeps notes regularly and uses them at review time.
      weak: Relies on memory.
    followups:
      - How do you make the habit stick?
      - What do you keep out of those notes?
    common_errors:
      - Recording only problems, which skews reviews negative.

  - external_key: managerial.performance_feedback.feedback_rebuild_trust
    competency_key: people_management
    topic: Rebuilding trust after a hard review
    difficulty: medium
    text: >-
      After you deliver a tough review, how do you rebuild the working relationship so that the person stays engaged
      and keeps getting value from your feedback? Give me an example.
    expected_concepts:
      - follow-up conversation soon after the review
      - concrete support toward agreed goals
      - recognising progress quickly and specifically
      - consistency in how feedback is given
      - checking how the person is experiencing the relationship
    rubric:
      excellent: Follows up quickly, provides concrete support, recognises progress specifically and keeps feedback consistent, with an example showing the relationship recovered.
      good: Follows up with support and some recognition.
      weak: Treats the review as the end of the matter or avoids the person afterwards.
    followups:
      - How long did it take to get back to normal?
      - What did you do differently in the next one-to-one?
    common_errors:
      - Overcorrecting with praise that undermines the review.
