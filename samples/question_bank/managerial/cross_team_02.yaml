# Curated questions: managerial round, cross-team coordination (part 2 of 4). Aligning roadmaps:
# multi-team planning, sequencing and capacity across teams, deprecations, duplicated effort,
# shared objectives and keeping dependent teams informed when plans change.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  - external_key: managerial.cross_team.explain_roadmap_to_dependents
    competency_key: communication
    topic: Explaining your roadmap to teams that rely on you
    difficulty: easy
    text: >-
      How do you share your team's roadmap with the teams that depend on you so they can actually plan around it,
      rather than just knowing it exists?
    expected_concepts:
      - stating what is committed versus tentative
      - highlighting items that affect each dependent team
      - expected timing with a stated confidence level
      - a channel for questions and requests
      - updating them when it changes
    rubric:
      excellent: Describes tailoring the roadmap for dependents by flagging items that affect them, separating commitments from intentions, giving realistic timing and keeping it current with proactive updates.
      good: Shares the roadmap regularly with some explanation, but does not separate firm from tentative items.
      weak: Publishes a roadmap page and assumes other teams will read it.
    followups:
      - How did a dependent team use it the last time?
      - What do you do when someone treats a tentative item as a promise?
    common_errors:
      - Presenting every roadmap item with the same level of certainty.

  - external_key: managerial.cross_team.reading_other_roadmaps
    competency_key: project_management
    topic: Spotting conflicts in other teams' plans
    difficulty: easy
    text: >-
      When other teams publish their plans for the next quarter, what do you look for in them, and what do you do
      when something in their plan could cause trouble for yours?
    expected_concepts:
      - work your team depends on and its timing
      - changes that could break or affect your systems
      - overlapping or duplicate work
      - raising concerns early with the owning lead
      - adjusting your own plan where needed
    rubric:
      excellent: Names specific things to check such as dependencies, breaking changes and overlap, and gives an example of raising a concern early with the other lead and reaching an adjustment.
      good: Reads other plans for dependencies and raises issues, but examples are thin.
      weak: Does not look at other teams' plans until a problem appears.
    followups:
      - Tell me about a conflict you caught this way.
      - Who did you raise it with first?
    common_errors:
      - Raising the conflict in a large forum before talking to the other team.

  - external_key: managerial.cross_team.multi_team_planning_process
    competency_key: project_management
    topic: Running planning across several teams
    difficulty: medium
    text: >-
      Describe a planning cycle you ran or took part in where several teams had to commit to work that depended on
      each other. How was it organised, and what would you change about it?
    expected_concepts:
      - shared goals as the starting point
      - surfacing dependencies before commitments are final
      - negotiating capacity between teams
      - recording cross-team commitments explicitly
      - reviewing the plan during the quarter
    rubric:
      excellent: Walks through a concrete process from shared goals to dependency mapping, capacity negotiation and explicit commitments, and gives a thoughtful critique with a specific improvement.
      good: Describes the process clearly but the critique is shallow.
      weak: Describes each team planning separately and hoping it fits.
    followups:
      - Where did the process break down?
      - How long did it take, and was that worth it?
    common_errors:
      - Describing the meetings without explaining how dependencies were resolved.

  - external_key: managerial.cross_team.mid_quarter_new_dependency
    competency_key: project_management
    topic: A new dependency appearing after plans are set
    difficulty: medium
    text: >-
      Halfway through a quarter, your team discovers it needs something from another team that wasn't in either
      team's plan. How do you handle it?
    expected_concepts:
      - confirming the need and exploring ways to avoid it
      - talking to the other team about cost and timing
      - offering to contribute effort yourselves
      - making the trade-off visible to whoever sets priorities
      - adjusting your own plan and telling stakeholders
    rubric:
      excellent: First tests whether the dependency can be avoided or reduced, then negotiates options with the other team including contributing effort, makes the trade-off explicit to decision makers and updates their own stakeholders.
      good: Approaches the other team and negotiates, but does not consider avoiding it or contributing effort.
      weak: Expects the other team to absorb the work or escalates immediately.
    followups:
      - What if the other team simply can't take it this quarter?
      - How did you miss it during planning?
    common_errors:
      - Treating the other team's existing commitments as less important than their own.

  - external_key: managerial.cross_team.shared_objective
    competency_key: stakeholder_management
    topic: Proposing a shared goal with another team
    difficulty: medium
    text: >-
      Tell me about a time you set up a joint goal with another team so you were both measured on the same outcome.
      Why did you do it, and how did it work out?
    expected_concepts:
      - the problem with separate goals
      - choosing an outcome both teams influence
      - agreeing each team's contribution
      - getting both managers to support it
      - reviewing progress together
    rubric:
      excellent: Gives a real example, explains why separate goals were failing, describes negotiating a shared measurable outcome with clear contributions and leadership backing, and reflects on the result.
      good: Set up a shared goal sensibly, but the contribution split or result is unclear.
      weak: Shared goal existed only on paper with no change in how the teams worked.
    followups:
      - How did you handle it when one team's effort lagged?
      - Would you do it again?
    common_errors:
      - Choosing a shared metric that only one team can influence.

  - external_key: managerial.cross_team.platform_roadmap_vs_product_asks
    competency_key: leadership
    topic: Balancing a platform roadmap against product team requests
    difficulty: hard
    text: >-
      Suppose you lead a platform team that a dozen product teams depend on, and every one of them has urgent
      requests. How would you build a roadmap that serves them without becoming a ticket queue?
    expected_concepts:
      - platform strategy and outcomes beyond individual requests
      - grouping requests into common needs
      - transparent prioritisation criteria
      - self-service so teams need you less
      - regular review with product team leads
    rubric:
      excellent: Anchors the roadmap in a platform strategy, aggregates requests into common capabilities, uses published criteria to prioritise, invests in self-service and keeps a feedback loop with consumers.
      good: Uses criteria to prioritise requests fairly but stays reactive.
      weak: Serves whichever team pushes hardest.
    followups:
      - How do you handle a product team that needs something only they need?
      - How do you show the platform's value to leadership?
    common_errors:
      - Ignoring the option of letting product teams contribute to the platform.

  - external_key: managerial.cross_team.api_deprecation_rollout
    competency_key: project_management
    topic: Getting many teams off an old interface
    difficulty: hard
    text: >-
      Your team needs to retire an internal interface that around twenty other teams still call. How would you plan
      and run that migration so it actually finishes?
    expected_concepts:
      - inventory of consumers and usage
      - clear timeline with notice and milestones
      - migration guides and tooling to make moving easy
      - tracking progress per team and following up
      - handling teams that can't or won't move in time
    rubric:
      excellent: Lays out discovery, a dated plan with notice, investment in making migration cheap, visible per-team tracking, and a realistic approach to stragglers including help, escalation or temporary support.
      good: Plans communication and a deadline with some support, but no clear handling of laggards.
      weak: Announces a shutdown date and expects teams to comply.
    followups:
      - What would you do with a team whose roadmap has no room for it?
      - How do you decide whether to do some migrations yourselves?
    common_errors:
      - Underestimating the long tail of the last few consumers.

  - external_key: managerial.cross_team.quiet_reprioritisation
    competency_key: stakeholder_management
    topic: A team quietly dropping work you rely on
    difficulty: medium
    text: >-
      You find out by accident that another team has moved work your project depends on off their plan, and nobody
      told you. What do you do?
    expected_concepts:
      - confirming facts with the other lead directly
      - understanding why priorities changed
      - assessing impact and options
      - agreeing how changes will be communicated in future
      - informing your own stakeholders
    rubric:
      excellent: Checks the facts directly, seeks the reason without accusation, works through options together, informs their stakeholders and agrees a way to be told about future changes.
      good: Talks to the other team and finds a workaround, but does not address how to avoid repeats.
      weak: Escalates immediately or complains without speaking to the team.
    followups:
      - What if their manager made the change and the lead didn't feel able to tell you?
      - How did this affect how you track dependencies?
    common_errors:
      - Treating the reprioritisation as bad faith before learning the reason.

  - external_key: managerial.cross_team.tech_roadmap_with_product_partner
    competency_key: leadership
    topic: Fitting technical improvements into partner teams' plans
    difficulty: medium
    text: >-
      Tell me about a technical improvement that needed several teams to give up some feature time. How did you get
      it onto their roadmaps?
    expected_concepts:
      - framing the benefit in each team's terms
      - evidence of the cost of not doing it
      - keeping each team's share of work small and well defined
      - working with product partners, not around them
      - tracking completion across teams
    rubric:
      excellent: Gives a real example, explains how they made the case in terms each team cared about, broke the work into small parts, partnered with product owners and tracked it to completion.
      good: Got the work planned through reasonable persuasion, but tracking or follow-through was weak.
      weak: Relied on a leadership mandate only, or the work never got scheduled.
    followups:
      - Which team was hardest to convince, and why?
      - What did you give up in return?
    common_errors:
      - Arguing on technical merit alone without connecting it to outcomes others care about.

  - external_key: managerial.cross_team.duplicate_effort
    competency_key: leadership
    topic: Two teams building the same thing
    difficulty: medium
    text: >-
      You learn that your team and another team are each partway through building very similar capabilities. How
      would you handle it?
    expected_concepts:
      - comparing scope, progress and requirements on facts
      - talking with the other lead before involving others
      - options such as merging, splitting or continuing both
      - criteria for deciding
      - handling the people whose work gets stopped
    rubric:
      excellent: Compares both efforts on facts, engages the other lead first, weighs options against clear criteria such as fit and long-term ownership, and treats the people affected by stopped work with care.
      good: Proposes a sensible resolution but without clear criteria or attention to the people involved.
      weak: Pushes for their own team's version to win.
    followups:
      - What if both teams have good reasons for their own approach?
      - How would you prevent this happening again?
    common_errors:
      - Choosing based on which effort is further along without considering fit.

  - external_key: managerial.cross_team.roadmap_review_forum
    competency_key: leadership
    topic: Designing a forum to align team roadmaps
    difficulty: hard
    text: >-
      If you were asked to set up a regular forum where team leads align their roadmaps, how would you design it so
      it produces real decisions instead of a round of presentations?
    expected_concepts:
      - clear purpose and decisions it owns
      - pre-reads instead of presentations
      - focus on conflicts, dependencies and trade-offs
      - who attends and who decides
      - recording outcomes and checking follow-through
    rubric:
      excellent: Defines the forum's decision rights, uses pre-reads, focuses time on conflicts and trade-offs, names who decides, and closes the loop on outcomes; ideally references a forum they have run and adjusted.
      good: Proposes a structured agenda but decision rights are unclear.
      weak: Describes a status round-robin.
    followups:
      - How would you know after three months if it was worth the time?
      - What would you do if senior leaders kept overriding it?
    common_errors:
      - Inviting everyone, which makes decisions impossible.

  - external_key: managerial.cross_team.communicate_roadmap_change
    competency_key: communication
    topic: Telling dependents your roadmap changed
    difficulty: easy
    text: >-
      When your team's priorities change and something other teams were expecting moves later, how do you tell them?
    expected_concepts:
      - telling affected teams quickly and directly
      - explaining the reason
      - new expected timing and confidence
      - offering options to reduce their impact
      - confirming they have what they need to replan
    rubric:
      excellent: Tells affected teams promptly and directly, explains why, gives revised timing and alternatives, and checks they can replan.
      good: Communicates the change with reasons, but late or without options.
      weak: Updates the roadmap page and leaves teams to notice.
    followups:
      - Tell me about a time this went badly.
      - Who decides how fast you tell other teams?
    common_errors:
      - Delaying the news until the new date is certain.

  - external_key: managerial.cross_team.cross_team_critical_path
    competency_key: project_management
    topic: Finding the critical path across teams
    difficulty: medium
    text: >-
      On a project where five teams each own a part of the work, how do you figure out which team's work is
      actually on the critical path, and what do you do with that knowledge?
    expected_concepts:
      - mapping dependencies and durations across teams
      - identifying the longest chain and near-critical paths
      - focusing attention and help on critical items
      - looking for ways to shorten or parallelise
      - revisiting as estimates change
    rubric:
      excellent: Describes mapping cross-team dependencies to identify the critical and near-critical chains, explains how they concentrated support and resequenced work, and keeps it updated as things move.
      good: Can identify the critical path but does little with it beyond monitoring.
      weak: Tracks each team's progress separately with no view of the chain.
    followups:
      - How did the critical team react to the extra attention?
      - What changed the critical path partway through?
    common_errors:
      - Treating the critical path as fixed after the first plan.

  - external_key: managerial.cross_team.reserve_capacity_from_other_team
    competency_key: stakeholder_management
    topic: Securing another team's time for next quarter
    difficulty: medium
    text: >-
      Next quarter you'll need a significant chunk of time from another team's engineers. How would you go about
      getting that time reserved before their plan fills up?
    expected_concepts:
      - asking early, before their planning
      - quantifying the effort and timing
      - explaining value in terms their leadership accepts
      - offering to share load or contribute people
      - getting the agreement written and confirmed
    rubric:
      excellent: Approaches early with a quantified request, links it to shared priorities, offers to contribute, and secures an explicit, recorded commitment from the right decision maker.
      good: Makes a clear early request but leaves the commitment informal.
      weak: Raises it at the start of the quarter and hopes there's room.
    followups:
      - What if they agree but their leadership says no?
      - How do you keep the commitment from eroding?
    common_errors:
      - Getting agreement from an engineer rather than the person who sets their priorities.

  - external_key: managerial.cross_team.strategy_shift_realign
    competency_key: leadership
    topic: Realigning several teams after a strategy change
    difficulty: hard
    text: >-
      Midway through the year, leadership changes direction, and the roadmaps of several teams you work with no
      longer fit together. Tell me how you'd approach getting them aligned again, or about a time you did.
    expected_concepts:
      - clarifying what the new strategy actually requires
      - identifying which commitments stand and which stop
      - working with other leads to redraw dependencies
      - communicating changes to teams and stakeholders
      - handling work in flight and its people
    rubric:
      excellent: Starts by getting clarity on the new direction, works with peer leads to decide what continues, stops or changes, redraws cross-team dependencies, and handles in-flight work and communication deliberately.
      good: Realigns their own team sensibly but coordinates only loosely with others.
      weak: Waits for leadership to hand out new plans.
    followups:
      - How do you decide what to stop?
      - How do you keep teams motivated through repeated changes?
    common_errors:
      - Keeping all old commitments and adding the new work on top.

  - external_key: managerial.cross_team.prioritisation_criteria_for_requesters
    competency_key: stakeholder_management
    topic: Fair priorities with many requesting teams
    difficulty: medium
    text: >-
      Your team gets requests from many other teams and can only take a few each quarter. How do you decide which
      ones, and how do you make the decision feel fair to those who miss out?
    expected_concepts:
      - published criteria tied to shared goals
      - consistent intake with the information needed to judge
      - involving requesters or their leads in the trade-off
      - explaining decisions to those turned down
      - revisiting the list when circumstances change
    rubric:
      excellent: Uses transparent criteria tied to company goals, a consistent intake, involves requesting leads in trade-offs, and explains decisions with a path forward for those deferred.
      good: Uses sensible criteria but decisions are made privately.
      weak: Prioritises by who asks loudest or most senior.
    followups:
      - How do you handle a request from a senior leader that doesn't score well?
      - Have your criteria ever changed? Why?
    common_errors:
      - Criteria that exist but are not shared with requesters.

  - external_key: managerial.cross_team.closing_loop_on_requests
    competency_key: communication
    topic: Telling teams what made the plan and what didn't
    difficulty: easy
    text: >-
      After your team finishes planning, what do you tell the other teams whose requests did or didn't make it in?
    expected_concepts:
      - responding to every request
      - reasons for the decision
      - when it might be reconsidered
      - alternatives they could pursue
      - offering to discuss
    rubric:
      excellent: Closes the loop with every requester, giving reasons, a reconsideration point and alternatives, and invites discussion.
      good: Informs requesters of the outcome but with little explanation.
      weak: Only tells the teams that got a yes.
    followups:
      - How do people usually react to a deferral?
      - What alternatives have you offered?
    common_errors:
      - Leaving deferred requests in limbo with no stated next step.

  - external_key: managerial.cross_team.initiative_without_owner_team
    competency_key: leadership
    topic: Driving a cross-team initiative with no dedicated team
    difficulty: hard
    text: >-
      Tell me about a change you drove that needed work from many teams, like a framework upgrade or a new standard,
      where there was no dedicated team to do it. How did you get it done?
    expected_concepts:
      - making the case and gaining sponsorship
      - breaking the work into small team-sized pieces
      - providing tooling, guides or examples
      - visible progress tracking
      - recognising contributions and handling holdouts
    rubric:
      excellent: Gives a real example with a clear case, sponsorship, work broken into easy pieces with support, visible tracking, and a concrete strategy for teams that lagged, with a result.
      good: Drove the change with reasonable tactics but it stalled or relied on a few heroes.
      weak: Announced the change and expected teams to pick it up.
    followups:
      - What share of the work did your own team end up doing?
      - What would you do differently?
    common_errors:
      - Ignoring how the change competes with each team's own priorities.

  - external_key: managerial.cross_team.early_input_from_other_leads
    competency_key: collaboration
    topic: Bringing other leads into a design early
    difficulty: easy
    text: >-
      When your team is designing something that other teams will build on, at what point do you bring their tech
      leads in, and how?
    expected_concepts:
      - involving them before the design is fixed
      - sharing a short early draft or problem statement
      - asking specific questions about their needs
      - incorporating or explaining feedback
      - keeping them updated through the build
    rubric:
      excellent: Brings other leads in at the problem or early-draft stage with targeted questions, shows how feedback changed the design, and keeps them involved.
      good: Shares the design for review before building, but late enough that changes are hard.
      weak: Shares the design after it is built.
    followups:
      - Tell me about feedback that changed your design.
      - How do you avoid design by committee?
    common_errors:
      - Asking for review without saying what kind of feedback is wanted.

  - external_key: managerial.cross_team.roadmap_predictability
    competency_key: project_management
    topic: Improving how reliably teams deliver to each other
    difficulty: hard
    text: >-
      Across a group of teams, commitments made to each other are met maybe half the time. How would you understand
      why, and what would you change to make those commitments more reliable?
    expected_concepts:
      - tracking cross-team commitments and outcomes
      - analysing causes such as overcommitment or unplanned work
      - distinguishing commitments from intentions
      - reserving capacity for dependency work
      - reviewing reliability regularly with leads
    rubric:
      excellent: Starts with data on commitments and causes, distinguishes firm commitments from aspirations, proposes structural fixes such as capacity reservation and earlier risk signals, and reviews progress with leads.
      good: Proposes plausible fixes but without first understanding the causes.
      weak: Asks teams to try harder or adds more status meetings.
    followups:
      - What would you expect to find as the main cause?
      - How would you avoid teams simply committing to less?
    common_errors:
      - Fixing reliability by padding everything heavily.

  - external_key: managerial.cross_team.long_range_plan_uncertainty
    competency_key: project_management
    topic: A year-long plan spanning several teams
    difficulty: hard
    text: >-
      How would you put together a twelve-month plan for an effort spanning several teams when the later months are
      genuinely uncertain, so it's useful without pretending to be precise?
    expected_concepts:
      - near-term detail and later coarse milestones
      - explicit assumptions and unknowns
      - decision points for re-planning
      - cross-team dependencies at milestone level
      - communicating confidence levels to stakeholders
    rubric:
      excellent: Describes rolling-wave detail, explicit assumptions, scheduled decision points, milestone-level cross-team dependencies and clear confidence communication, preferably from a real plan.
      good: Plans in phases with some flexibility but does not state assumptions or decision points.
      weak: Produces a detailed Gantt chart for the full year.
    followups:
      - How did the plan change over the year?
      - How do you stop stakeholders treating the later months as fixed?
    common_errors:
      - Equal detail for month one and month twelve.

  - external_key: managerial.cross_team.cross_team_integration_testing
    competency_key: project_management
    topic: Planning integration across team boundaries
    difficulty: medium
    text: >-
      When several teams build parts that only work together at the end, how do you plan the integration and
      testing so you don't discover the big problems in the final week?
    expected_concepts:
      - early end-to-end slice through all parts
      - agreed contracts and test doubles at boundaries
      - shared integration environment and schedule
      - integration milestones in each team's plan
      - owner for end-to-end testing
    rubric:
      excellent: Plans an early thin end-to-end slice, agreed contracts with tests at boundaries, scheduled integration points and a named owner for end-to-end quality.
      good: Plans integration milestones but late in the project.
      weak: Leaves integration to the end and relies on each team testing its own part.
    followups:
      - Who owned the end-to-end tests on your last project?
      - What problem did early integration catch?
    common_errors:
      - Assuming that well-tested parts integrate without issues.

  - external_key: managerial.cross_team.coaching_dependency_management
    competency_key: mentoring
    topic: Coaching a newer lead on managing dependencies
    difficulty: medium
    text: >-
      How have you coached a newer project manager or tech lead to manage dependencies on other teams well, and
      what did they struggle with?
    expected_concepts:
      - specific skills taught such as mapping and early asks
      - letting them handle real dependencies with support
      - reviewing situations together afterwards
      - common struggles such as reluctance to follow up
      - evidence of improvement
    rubric:
      excellent: Gives a real coaching example with specific skills, a practice-and-debrief approach, insight into what the person found hard and evidence they improved.
      good: Describes reasonable coaching but little on struggles or progress.
      weak: Handled the dependencies for them.
    followups:
      - When did you step in, and when did you let them learn?
      - What would you teach first next time?
    common_errors:
      - Teaching templates without the conversations that make them work.

  - external_key: managerial.cross_team.decoupled_launches
    competency_key: project_management
    topic: Reducing lock-step releases between teams
    difficulty: medium
    text: >-
      Several teams on your product can only release when everyone else is ready, so one late team delays all of
      them. What would you change?
    expected_concepts:
      - backward-compatible interfaces
      - feature flags and dark launches
      - contract testing between teams
      - separate release pipelines
      - agreement on versioning and deprecation
    rubric:
      excellent: Proposes concrete decoupling techniques such as compatible interfaces, feature flags and contract tests, explains the cost of each, and how they would get teams to adopt them.
      good: Suggests one or two decoupling ideas without discussing adoption.
      weak: Suggests a stricter shared release schedule.
    followups:
      - What does this cost the teams in the short term?
      - Which part would you start with?
    common_errors:
      - Assuming feature flags alone solve interface coupling.

  - external_key: managerial.cross_team.cannot_keep_commitment
    competency_key: stakeholder_management
    topic: Your team can't keep a promise to another team
    difficulty: medium
    text: >-
      Tell me about a time your team couldn't deliver something it had committed to another team. How did you
      handle that conversation and what came of it?
    expected_concepts:
      - telling them as soon as the risk was known
      - explaining the cause plainly
      - offering options to reduce impact
      - agreeing a new plan together
      - learning applied to future commitments
    rubric:
      excellent: Raised the issue early and directly, owned the cause, worked out options with the other team, agreed a new plan and changed how they make commitments afterwards.
      good: Communicated the slip and a revised date, but late or without options.
      weak: The other team found out at the deadline, or the answer blames circumstances.
    followups:
      - How did the other team's lead react?
      - What did you change in how you commit?
    common_errors:
      - Choosing an example where the slip had no real effect on the other team.
