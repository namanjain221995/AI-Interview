# Curated questions: managerial round, hiring and interviewing (part 1: defining roles and designing
# fair, structured interview processes). Evaluation is based only on the substance of the answer
# (approach, actions, results, reflection), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: managerial.hiring.role_definition_from_needs
    competency_key: leadership
    topic: Defining a role from real team needs
    difficulty: easy
    text: >-
      When a new role opens on your team, how do you work out what that person actually needs to be able to
      do before anyone writes a job description?
    expected_concepts:
      - starting from the problems or outcomes the team needs covered
      - talking to the team and partners about the gap
      - separating must-have skills from things that can be learned on the job
      - writing down what success looks like after six to twelve months
    rubric:
      excellent: Describes a concrete process that starts from team outcomes and gaps, involves the people who work with the role, and ends with a short written list of essential skills and success measures.
      good: Identifies the main skills needed with some reasoning tied to the team's work.
      weak: Copies an old job description or lists generic technologies without connecting them to real work.
    followups:
      - Who did you involve the last time you did this?
      - How did that definition change once you started interviewing?
    common_errors:
      - Treating the job description as a wish list of every technology the team uses.

  - external_key: managerial.hiring.preparing_to_interview
    competency_key: communication
    topic: Preparing for and running an interview
    difficulty: easy
    text: >-
      Walk me through how you prepare for an interview you're running, from the moment you get the
      candidate's details to the point where you submit your feedback.
    expected_concepts:
      - reviewing the role, the stage's focus area and the resume beforehand
      - planning questions mapped to the competencies being assessed
      - taking notes on evidence during the interview
      - leaving time for the candidate's questions
      - writing feedback promptly while it is fresh
    rubric:
      excellent: Lays out a deliberate routine covering preparation against the stage's focus, evidence-based note taking, time management and prompt written feedback.
      good: Describes reasonable preparation and feedback steps with a few gaps.
      weak: Improvises the interview and writes feedback days later from memory.
    followups:
      - What do you do if the candidate's resume suggests your planned questions won't fit?
      - How long after the interview do you usually write your feedback?
    common_errors:
      - Skipping preparation and asking whatever comes to mind.

  - external_key: managerial.hiring.feedback_write_up
    competency_key: communication
    topic: Writing useful interview feedback
    difficulty: easy
    text: >-
      How do you write up your interview feedback so that someone who wasn't in the room can understand
      exactly why you recommended hiring or not?
    expected_concepts:
      - recording specific things the candidate said or did
      - linking evidence to the competencies or rubric for the stage
      - stating a clear recommendation with reasoning
      - noting gaps where there wasn't enough signal
    rubric:
      excellent: Explains how they tie concrete observed evidence to each assessed area, give an explicit recommendation and flag where signal was missing, so a reader can check the reasoning.
      good: Mentions including examples and a recommendation, with some link to the role's criteria.
      weak: Feedback is mostly impressions such as "seemed strong" with no supporting evidence.
    followups:
      - Can you give me an example of a sentence you'd write for a strong signal?
      - How do you record something you weren't able to assess?
    common_errors:
      - Writing conclusions without the evidence behind them.

  - external_key: managerial.hiring.favourite_question
    competency_key: leadership
    topic: A question you ask and what you listen for
    difficulty: easy
    text: >-
      Tell me about one interview question you like to ask and what you're actually listening for in the
      candidate's answer.
    expected_concepts:
      - the question and the competency it targets
      - what a strong answer contains compared with a weak one
      - follow-up probes used to get past rehearsed answers
      - how the question has been refined over time
    rubric:
      excellent: Names a specific question, explains the job-related skill it tests, describes clear signals separating strong and weak answers and how they probe deeper.
      good: Gives a sensible question and a general idea of what a good answer includes.
      weak: Picks a trick or trivia question, or cannot say what a good answer looks like.
    followups:
      - How do you follow up when the first answer sounds rehearsed?
      - Have you ever dropped a question because it wasn't telling you much?
    common_errors:
      - Choosing a question that tests recall rather than the skills used in the job.

  - external_key: managerial.hiring.recruiter_partnership
    competency_key: stakeholder_management
    topic: Working with a recruiter on a search
    difficulty: easy
    text: >-
      How do you work with a recruiter during a search so that the candidates they bring you are a good
      match for the role?
    expected_concepts:
      - a kickoff conversation on the role, essentials and selling points
      - giving fast, specific feedback on candidates
      - agreeing on timelines and stages
      - adjusting the brief when the market response shows a mismatch
    rubric:
      excellent: Describes a working partnership with a clear kickoff, quick specific feedback on each profile and regular check-ins that adjust the search when needed.
      good: Mentions briefing the recruiter and giving feedback on candidates.
      weak: Expects the recruiter to work it out alone and complains about candidate quality without giving feedback.
    followups:
      - What did you change after a recruiter's early candidates missed the mark?
      - How quickly do you usually respond to a profile they send?
    common_errors:
      - Giving vague feedback like "not senior enough" without explaining what was missing.

  - external_key: managerial.hiring.describing_the_work
    competency_key: communication
    topic: Writing a job posting that describes the real work
    difficulty: easy
    text: >-
      Tell me about a job posting you wrote or rewrote. What did you do to make it describe the real
      day-to-day work rather than a generic list of requirements?
    expected_concepts:
      - describing actual problems and projects the person will work on
      - plain language instead of jargon or buzzwords
      - short, realistic list of essentials
      - information candidates need to self-select, such as team setup and ways of working
    rubric:
      excellent: Gives a specific example of rewriting a posting around real work, explains why each change helps the right people apply, and mentions any effect on applications.
      good: Describes making the posting clearer and more specific to the team.
      weak: Leaves postings to recruiting or reuses templates without considering what candidates learn from them.
    followups:
      - What feedback did you get from candidates about the posting?
      - What did you take out, and why?
    common_errors:
      - Listing every possible technology so the posting reads like a checklist.

  - external_key: managerial.hiring.candidate_experience
    competency_key: communication
    topic: Candidate experience for every applicant
    difficulty: easy
    text: >-
      What do you do to make sure candidates have a good experience with your team's hiring process,
      including the people you end up not hiring?
    expected_concepts:
      - clear explanation of stages and timelines up front
      - prompt updates and decisions
      - interviewers who are prepared and respectful of the candidate's time
      - closing the loop with every candidate
    rubric:
      excellent: Describes concrete practices such as setting expectations early, keeping response times short, preparing interviewers and closing the loop with everyone, with an example of why it mattered.
      good: Mentions timely communication and a respectful process.
      weak: Focuses only on the candidates they want to hire and lets others go silent.
    followups:
      - How do you know whether candidates found the process fair?
      - What's the longest a candidate on your team has waited for an answer, and why?
    common_errors:
      - Treating candidate experience as a recruiting team problem only.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.hiring.loop_design
    competency_key: leadership
    topic: Designing an interview loop
    difficulty: medium
    text: >-
      Tell me about an interview process you designed or redesigned. How did you decide which stages to
      include and what each stage should assess?
    expected_concepts:
      - mapping each stage to specific job-related competencies
      - avoiding overlap so stages don't test the same thing twice
      - keeping total candidate time reasonable
      - documented questions or exercises and scoring guides per stage
      - reviewing whether the loop worked after some hires
    rubric:
      excellent: Walks through a real loop with a clear competency map per stage, explains trade-offs on length and coverage, and describes how they checked and adjusted it after using it.
      good: Describes a sensible set of stages with reasons for most of them.
      weak: Lists stages copied from elsewhere without explaining what each one is meant to find out.
    followups:
      - Which stage gave you the least useful signal, and what did you do about it?
      - How long did the whole process take for a candidate?
    common_errors:
      - Adding more rounds instead of making each round better targeted.

  - external_key: managerial.hiring.scoring_guides
    competency_key: leadership
    topic: Building scoring guides for interviews
    difficulty: medium
    text: >-
      How have you built a scoring guide or rubric for an interview stage, and what did you put in it so
      interviewers could rate answers against the same standard?
    expected_concepts:
      - competencies tied to the role definition
      - concrete descriptions of strong, acceptable and weak answers
      - example behaviours or evidence for each level
      - testing the guide on real or mock interviews and refining it
    rubric:
      excellent: Describes a guide with clearly anchored levels and example evidence, explains how they tested it with interviewers and what they changed as a result.
      good: Has created rubrics with levels and some descriptions of good answers.
      weak: Relies on a single overall score or gut feel with no shared definition of levels.
    followups:
      - How did you handle an answer that didn't fit any of the levels you wrote?
      - Who reviewed the guide before you used it?
    common_errors:
      - Writing level descriptions so vague that two people read them differently.

  - external_key: managerial.hiring.interviewer_calibration
    competency_key: mentoring
    topic: Calibrating interviewers who score differently
    difficulty: medium
    text: >-
      Imagine two interviewers on your panel consistently score similar candidates very differently. How
      would you figure out why, and how would you bring them into alignment?
    expected_concepts:
      - comparing their written feedback and evidence on the same candidates
      - checking whether they interpret the rubric differently
      - shadowing or reverse-shadowing sessions
      - calibration sessions using recorded or mock answers
      - tracking scores over time to see if the gap closes
    rubric:
      excellent: Proposes looking at the evidence behind the scores first, separates rubric ambiguity from interviewer habits, and describes concrete calibration steps with a way to check improvement.
      good: Suggests a calibration discussion and clearer rubrics.
      weak: Simply removes one interviewer or averages the scores without understanding the cause.
    followups:
      - What if it turns out the stricter interviewer was right?
      - How would you discuss this with each interviewer individually?
    common_errors:
      - Assuming the harsher or more lenient interviewer is automatically the problem.

  - external_key: managerial.hiring.training_new_interviewers
    competency_key: mentoring
    topic: Getting a new interviewer ready
    difficulty: medium
    text: >-
      How do you get an engineer who has never interviewed before ready to run interviews for your team on
      their own?
    expected_concepts:
      - explaining the role, rubric and purpose of the stage
      - shadowing experienced interviewers
      - reverse shadowing with feedback
      - guidance on job-related questions and consistent evaluation
      - reviewing their first written feedback
    rubric:
      excellent: Describes a staged path from shadowing to reverse shadowing to solo interviews, with specific coaching on evidence-based feedback and consistent, job-related questions.
      good: Mentions shadowing and some guidance before they interview alone.
      weak: Puts new interviewers straight onto the panel with no preparation.
    followups:
      - How do you know when someone is ready to interview alone?
      - What's the most common mistake you see from new interviewers?
    common_errors:
      - Assuming strong engineers are automatically good interviewers.

  - external_key: managerial.hiring.choosing_technical_exercise
    competency_key: leadership
    topic: Choosing a technical assessment format
    difficulty: medium
    text: >-
      How do you decide what kind of technical exercise to use for a role, for example a take-home task, a
      pairing session or a design discussion, and what trade-offs have you weighed?
    expected_concepts:
      - matching the exercise to the work the role actually does
      - candidate time cost and fairness to people with limited free time
      - signal quality and how easy it is to score consistently
      - interviewer effort and scalability
      - risk of rewarding practice at puzzles over real skill
    rubric:
      excellent: Compares several formats against the role's real work, weighs candidate time, scoring consistency and interviewer cost, and explains a choice they made and how it worked out.
      good: Recognises trade-offs between at least two formats and justifies a preference.
      weak: Uses one format for every role because it is the usual practice.
    followups:
      - How long should a take-home task take, in your view?
      - Have you ever changed format partway through a search?
    common_errors:
      - Choosing algorithm puzzles for roles that never use them.

  - external_key: managerial.hiring.assessing_seniority
    competency_key: leadership
    topic: Telling levels apart in interviews
    difficulty: medium
    text: >-
      In an interview, how do you tell the difference between someone who is ready for a senior role and
      someone who would be a strong hire one level below?
    expected_concepts:
      - scope and ambiguity of problems they have handled
      - influence beyond their own work
      - depth of reasoning about trade-offs
      - level expectations written down in advance
      - probing for their personal contribution
    rubric:
      excellent: Describes specific level signals such as scope, ambiguity, trade-off depth and influence, explains how they probe for them, and ties them to written level expectations.
      good: Gives reasonable differences between levels with some way of testing for them.
      weak: Relies on years in the industry or job titles to decide level.
    followups:
      - What question gives you the clearest signal on this?
      - What do you do when a candidate is strong in some areas and junior in others?
    common_errors:
      - Equating time spent in the industry with seniority.

  - external_key: managerial.hiring.debrief_facilitation
    competency_key: leadership
    topic: Running a fair hiring debrief
    difficulty: medium
    text: >-
      Walk me through how you run a hiring debrief so that the first or most senior voice in the room
      doesn't end up deciding the outcome.
    expected_concepts:
      - written feedback submitted independently before the debrief
      - structured discussion stage by stage against the rubric
      - having junior or quieter interviewers speak first
      - separating evidence from impressions
      - a clear decision owner and rationale recorded
    rubric:
      excellent: Describes independent written feedback, a structured order of discussion, explicit techniques to reduce anchoring and a documented decision tied to evidence.
      good: Mentions collecting feedback before discussing and keeping the debrief focused on evidence.
      weak: Runs an open discussion where people agree with whoever speaks first.
    followups:
      - What do you do when someone changes their score during the debrief?
      - Who makes the final call, and how is it recorded?
    common_errors:
      - Letting interviewers read each other's feedback before writing their own.

  - external_key: managerial.hiring.headcount_case
    competency_key: stakeholder_management
    topic: Making the case for new headcount
    difficulty: medium
    text: >-
      Tell me about a time you had to make the case for a new position on your team. How did you show the
      need, and how did leadership respond?
    expected_concepts:
      - evidence of the gap, such as delivery data, risks or on-call load
      - linking the role to business outcomes
      - alternatives considered, such as reprioritising or borrowing people
      - cost and timing of the hire
      - outcome and follow-through
    rubric:
      excellent: Gives a real example with concrete evidence, explains alternatives they considered and the business impact, and describes the decision and what happened afterwards.
      good: Explains the need with some data and a clear request.
      weak: Argues only that the team is busy, with no evidence or alternatives.
    followups:
      - What would you have done if the request had been turned down?
      - How did you measure whether the hire delivered what you promised?
    common_errors:
      - Asking for headcount without showing what changes if it is approved.

  - external_key: managerial.hiring.skills_gap_review
    competency_key: leadership
    topic: Finding gaps before deciding who to hire
    difficulty: medium
    text: >-
      When you're deciding who to hire next, how do you look at the skills and experience already on your
      team to work out what's missing?
    expected_concepts:
      - mapping current skills against upcoming roadmap needs
      - single points of failure or knowledge silos
      - balance of seniority and mentoring capacity
      - considering growth of current team members before hiring
    rubric:
      excellent: Describes a structured look at skills against the roadmap, identifies risks such as single points of failure, weighs internal growth versus hiring, and gives a resulting hiring choice.
      good: Identifies gaps in skills with a reasonable link to upcoming work.
      weak: Hires for whatever technology is currently causing pain, without a broader view.
    followups:
      - Did you ever decide to develop someone internally instead of hiring?
      - How did you share this analysis with your team?
    common_errors:
      - Hiring clones of existing strong performers rather than filling real gaps.

  - external_key: managerial.hiring.comparable_interviews
    competency_key: leadership
    topic: Keeping interviews comparable across candidates
    difficulty: medium
    text: >-
      How do you make sure every candidate for the same role gets a comparable interview, even when
      different people on your team are running them?
    expected_concepts:
      - a shared question set or exercise per stage
      - the same rubric and level definitions for everyone
      - limits on off-script topics that can't be scored
      - periodic review of feedback for drift
    rubric:
      excellent: Explains a standard set of questions and anchored rubrics, how interviewers are kept on them, and how they check for drift over time with an example.
      good: Mentions shared questions and rubrics for the role.
      weak: Lets each interviewer choose their own approach and compares candidates on overall impressions.
    followups:
      - How much freedom do interviewers have to change questions?
      - How would you spot an interviewer drifting from the agreed approach?
    common_errors:
      - Confusing consistency with reading questions out word for word with no follow-ups.

  - external_key: managerial.hiring.hiring_alongside_delivery
    competency_key: project_management
    topic: Planning hiring without stalling delivery
    difficulty: medium
    text: >-
      You need to hire three engineers within a quarter for a project that starts soon, and your team is
      already busy. How would you plan the hiring work so it doesn't stall current delivery?
    expected_concepts:
      - a hiring plan with stages, owners and target dates
      - spreading interview load across the team
      - adjusting delivery commitments to account for interviewing time
      - working closely with recruiting on pipeline volume
      - contingency if hires arrive late
    rubric:
      excellent: Builds a concrete plan with timelines, owners and interview capacity, explicitly adjusts delivery commitments and has a fallback for late hires.
      good: Plans the hiring steps and recognises the time cost to the team.
      weak: Assumes hiring will fit around existing work without planning for it.
    followups:
      - How would you explain the reduced capacity to stakeholders?
      - What would you do if only one of the three had joined by the project start?
    common_errors:
      - Forgetting that new hires need onboarding time before they add capacity.

  - external_key: managerial.hiring.referrer_conversation
    competency_key: communication
    topic: Telling a referrer their candidate wasn't selected
    difficulty: medium
    text: >-
      A colleague referred someone they know, and that person didn't pass your interviews. How would you
      handle the conversation with your colleague?
    expected_concepts:
      - thanking them for the referral
      - sharing the decision promptly
      - giving appropriate detail without breaching the candidate's confidentiality
      - keeping the decision based on the same standard as everyone else
      - encouraging future referrals
    rubric:
      excellent: Describes a prompt, respectful conversation that protects the candidate's confidentiality, explains that the same standard applied to everyone and keeps the colleague willing to refer again.
      good: Communicates the decision politely with a general reason.
      weak: Avoids the conversation, or shares detailed interview notes inappropriately.
    followups:
      - What if your colleague pushed back and asked you to reconsider?
      - How much detail is appropriate to share?
    common_errors:
      - Sharing the candidate's interview performance in detail with a third party.

  # ------------------------------------------------------------------ hard
  - external_key: managerial.hiring.wrong_signals_in_process
    competency_key: leadership
    topic: Finding out whether interviews measure the wrong things
    difficulty: hard
    text: >-
      New hires on your team pass the interviews comfortably but many of them struggle once they start the
      real work. How would you investigate whether the interview process is measuring the wrong things?
    expected_concepts:
      - comparing interview scores with later performance evidence
      - identifying which skills new hires lack and whether any stage tests them
      - checking onboarding as an alternative cause
      - redesigning or replacing stages to target missing skills
      - re-measuring after changes
    rubric:
      excellent: Proposes a structured investigation linking interview evidence to on-the-job outcomes, rules out onboarding issues, and describes targeted changes with a plan to measure their effect.
      good: Suggests reviewing the process against the skills new hires lack and making changes.
      weak: Simply makes interviews harder or adds a round without diagnosing the problem.
    followups:
      - How many hires would you need before drawing conclusions?
      - How would you tell an interview problem from an onboarding problem?
    common_errors:
      - Blaming the new hires instead of examining the process.

  - external_key: managerial.hiring.pressure_to_fill
    competency_key: stakeholder_management
    topic: Holding the bar under pressure to fill a role
    difficulty: hard
    text: >-
      Tell me about a time you were under real pressure to fill a role quickly and the candidates in front
      of you weren't quite right. What did you decide, and how did it turn out?
    expected_concepts:
      - the source of the pressure and the stakes
      - clarity on which requirements were essential and which were flexible
      - options considered, such as contractors, rescoping or widening the search
      - how they communicated the trade-off to stakeholders
      - outcome and reflection
    rubric:
      excellent: Gives a specific example, explains how they separated essential from flexible requirements, the alternatives they used to relieve pressure and how they aligned stakeholders, with a clear outcome and lesson.
      good: Describes holding a reasonable standard and explaining it to stakeholders.
      weak: Either lowered the bar without analysis or refused to hire with no plan to address the need.
    followups:
      - Looking back, was the decision right?
      - What would have made you change your mind?
    common_errors:
      - Treating every requirement as non-negotiable, which can stall hiring indefinitely.

  - external_key: managerial.hiring.unfamiliar_specialism
    competency_key: leadership
    topic: Hiring a specialist outside your own expertise
    difficulty: hard
    text: >-
      Suppose you need to hire the first specialist in an area you don't know deeply yourself, such as your
      team's first security engineer. How would you design a process that still assesses them well?
    expected_concepts:
      - borrowing expert interviewers from other teams or trusted external peers
      - defining the outcomes the role must deliver for your team
      - work-sample style exercises based on real problems
      - assessing collaboration with the existing team
      - plans to support and evaluate the person after hiring
    rubric:
      excellent: Combines borrowed expertise, outcome-based role definition and realistic exercises, and explains how they would judge the parts they can assess themselves and support the hire afterwards.
      good: Recognises the need for outside expertise and proposes a reasonable process.
      weak: Relies on credentials or certifications alone because they can't assess the skills directly.
    followups:
      - How would you check the judgement of the expert you borrowed?
      - What would the first three months look like for this hire?
    common_errors:
      - Assuming impressive jargon in the interview means real expertise.

  - external_key: managerial.hiring.prestige_bias_in_panel
    competency_key: mentoring
    topic: Addressing an interviewer's job-unrelated preferences
    difficulty: hard
    text: >-
      You notice that one interviewer consistently rates candidates from large, well-known companies higher,
      even when their answers aren't stronger. How would you handle it?
    expected_concepts:
      - checking the pattern against their written evidence
      - a private, specific conversation about the observed pattern
      - reinforcing scoring against the rubric rather than resume signals
      - structural fixes such as independent scoring or limiting resume visibility for some stages
      - following up to see if the pattern changes
    rubric:
      excellent: Verifies the pattern with evidence, gives specific private feedback focused on job-related scoring, adds structural safeguards and follows up to confirm change.
      good: Addresses the issue directly with the interviewer and reinforces the rubric.
      weak: Ignores it, or removes the interviewer without discussion or evidence.
    followups:
      - What if the interviewer disagrees that there's a pattern?
      - How would you know if other interviewers do the same thing?
    common_errors:
      - Treating company names on a resume as evidence of skill.

  - external_key: managerial.hiring.inconsistent_bar_across_teams
    competency_key: leadership
    topic: Aligning hiring standards across teams
    difficulty: hard
    text: >-
      You discover that different teams in your organisation hire for the same level with very different
      standards. How would you approach bringing them closer together?
    expected_concepts:
      - gathering evidence on how levels are assessed in each team
      - shared written level expectations
      - cross-team calibration sessions or shared interviewers
      - involving other managers as partners rather than imposing rules
      - measuring alignment over time
    rubric:
      excellent: Gathers evidence first, builds shared level definitions with peer managers, introduces cross-team calibration and describes how they'd measure whether standards converge.
      good: Proposes shared level definitions and some calibration across teams.
      weak: Mandates one team's process everywhere without understanding differences.
    followups:
      - How would you handle a manager who resists the change?
      - What about people already hired at mismatched levels?
    common_errors:
      - Ignoring how mismatched levels affect fairness for people already on the teams.

  - external_key: managerial.hiring.structure_vs_flexibility
    competency_key: leadership
    topic: Balancing structure with following the candidate's lead
    difficulty: hard
    text: >-
      How do you balance keeping interviews structured and comparable with leaving room to explore what a
      particular candidate brings that your questions didn't anticipate?
    expected_concepts:
      - a fixed core of questions scored on the same rubric
      - planned time for follow-ups tied to the same competencies
      - recording unexpected strengths as evidence without changing the bar
      - avoiding unscored tangents that bias decisions
    rubric:
      excellent: Describes a clear core-plus-flex structure, explains how unexpected evidence is captured against the same competencies and why off-rubric impressions shouldn't drive decisions, with an example.
      good: Recognises the tension and keeps a consistent core while allowing some follow-ups.
      weak: Picks one extreme, either rigid scripts with no follow-up or free-form conversations.
    followups:
      - Can you think of a time a candidate's unexpected strength changed your decision?
      - How would you score something your rubric doesn't cover?
    common_errors:
      - Letting a pleasant tangent override weak evidence on core competencies.
