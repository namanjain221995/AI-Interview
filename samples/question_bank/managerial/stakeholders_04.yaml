# Curated questions: managerial round, stakeholder management (part 4 of 4). Capacity and decision
# rights, being the blocker, client scope, goal negotiation, risk acceptance, sponsor changes and
# relationships between teams. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  - external_key: managerial.stakeholders.communicating_capacity
    competency_key: communication
    topic: Making team capacity understandable to stakeholders
    difficulty: easy
    text: >-
      How do you explain your team's capacity to stakeholders so that conversations are about trade-offs rather than about
      whether the team is working hard enough?
    expected_concepts:
      - showing current commitments alongside available capacity
      - using past delivery data rather than opinions
      - framing new requests as what would move out
      - a simple, repeatable view stakeholders can follow
    rubric:
      excellent: Describes a simple, data-based view of commitments and capacity that turns requests into explicit trade-offs, with an example where it changed a conversation.
      good: Shares capacity information in a way that supports trade-off discussions.
      weak: Argues about effort or busyness without any shared view of capacity.
    followups:
      - What does that view look like in practice?
    common_errors:
      - Presenting capacity in hours or story points that stakeholders cannot interpret.

  - external_key: managerial.stakeholders.clarifying_decision_rights
    competency_key: project_management
    topic: Clarifying who decides on a project
    difficulty: easy
    text: >-
      Tell me about a project where it wasn't clear who got to make which decisions. How did you sort out who decides, who
      is consulted and who just needs to be told?
    expected_concepts:
      - spotting the confusion through stalled or reopened decisions
      - a simple decision-rights model for key decision types
      - agreeing it with stakeholders and leadership
      - publishing it and using it in practice
    rubric:
      excellent: Recognised the problem from its symptoms, introduced a simple decision-rights agreement for the decisions that mattered, secured stakeholder agreement and shows it reduced delays.
      good: Clarified decision ownership in a reasonable way.
      weak: Continued with unclear ownership, or created a large matrix nobody used.
    followups:
      - Which decision was the most contested?
    common_errors:
      - Listing many people as decision makers for the same decision.

  - external_key: managerial.stakeholders.recognition_for_invisible_work
    competency_key: leadership
    topic: Getting stakeholders to see the team's less visible work
    difficulty: easy
    text: >-
      A lot of valuable engineering work, like reliability improvements or tooling, is invisible to stakeholders. How have
      you made sure that work and the people who did it got recognised?
    expected_concepts:
      - describing the work in terms of outcomes stakeholders feel
      - including it in regular updates and reviews
      - naming the people who did the work
      - before and after measures
    rubric:
      excellent: Translates invisible work into outcomes stakeholders value, includes it consistently in updates, credits the individuals and uses before-and-after evidence.
      good: Makes some effort to highlight the work and credit people.
      weak: Only reports feature work, leaving maintenance and tooling unseen.
    followups:
      - Give me an example of how you described one piece of that work.
    common_errors:
      - Describing the work in technical terms stakeholders cannot connect to outcomes.

  - external_key: managerial.stakeholders.relationship_that_worked
    competency_key: stakeholder_management
    topic: A stakeholder relationship that worked well
    difficulty: easy
    text: >-
      Think of a stakeholder relationship that worked really well for you. What did you do to make it work, and what did
      you take from it into other relationships?
    expected_concepts:
      - regular contact beyond formal meetings
      - understanding their goals and pressures
      - reliability on commitments
      - early warning on problems
      - applying the lessons elsewhere
    rubric:
      excellent: Names specific practices they used, such as regular contact, early warnings and reliable follow-through, and shows how they applied them to other relationships.
      good: Describes a good relationship with some practices they contributed.
      weak: Attributes the success only to the other person or to luck.
    followups:
      - Which of those habits has been hardest to keep up?
    common_errors:
      - Describing the relationship without saying what they personally did.

  - external_key: managerial.stakeholders.project_closure
    competency_key: project_management
    topic: Closing a project cleanly with stakeholders
    difficulty: easy
    text: >-
      When a project finishes, what do you do to make sure stakeholders know what was delivered, what wasn't, and who owns
      things from now on?
    expected_concepts:
      - a summary of delivered and deferred scope
      - results against the original goals
      - handover of ownership and support
      - a retrospective including stakeholders
    rubric:
      excellent: Describes a deliberate closure with a delivered and deferred summary, results against goals, explicit ownership handover and a retrospective, with an example of it preventing confusion later.
      good: Closes projects with some summary and handover.
      weak: The project fades out without a clear end, summary or owner.
    followups:
      - What happened to deferred scope on your last project?
    common_errors:
      - Leaving deferred items with no owner, so stakeholders assume they are still coming.

  - external_key: managerial.stakeholders.explaining_how_team_works
    competency_key: communication
    topic: Introducing a new stakeholder to how your team works
    difficulty: easy
    text: >-
      When a new stakeholder starts working with your team, how do you explain how the team plans work, takes requests and
      keeps people updated?
    expected_concepts:
      - a short introduction conversation
      - a written overview of process and contacts
      - how to raise requests and urgent issues
      - what to expect on timing and updates
    rubric:
      excellent: Describes a deliberate introduction covering planning, requests, escalation and update expectations, supported by a short written reference, with an example of it helping.
      good: Gives new stakeholders a reasonable introduction to the process.
      weak: Leaves new stakeholders to learn the process by trial and error.
    followups:
      - What do new stakeholders most often misunderstand about your team?
    common_errors:
      - Overloading them with process detail they won't remember.

  - external_key: managerial.stakeholders.attention_across_projects
    competency_key: project_management
    topic: Splitting your attention across concurrent projects
    difficulty: medium
    text: >-
      When you're responsible for several projects at once, each with its own stakeholders, how do you decide where your
      own attention goes in a given week? Give me a recent example.
    expected_concepts:
      - risk and stage of each project
      - delegating ownership to leads where possible
      - regular, lightweight check-ins on each
      - signals that a project needs more attention
    rubric:
      excellent: Describes a clear method based on risk and stage, delegates sensibly, uses lightweight signals to detect trouble and gives an example of shifting attention at the right time.
      good: Has a reasonable way of balancing projects.
      weak: Attention goes to whoever is loudest, and quieter projects drift.
    followups:
      - Tell me about a project that drifted because you weren't watching it.
    common_errors:
      - Being present in every project meeting instead of delegating.

  - external_key: managerial.stakeholders.your_team_is_the_blocker
    competency_key: stakeholder_management
    topic: When your team is the one blocking others
    difficulty: medium
    text: >-
      Tell me about a time your team was the dependency holding up another team. How did you manage their expectations, and
      what did you do to unblock them?
    expected_concepts:
      - acknowledging the impact on the other team
      - realistic dates and regular updates
      - partial deliveries or interim workarounds
      - re-prioritising internally if justified
    rubric:
      excellent: Acknowledged the impact directly, gave realistic dates, offered interim options such as partial delivery or workarounds and re-prioritised when the business case justified it.
      good: Kept the other team informed and made reasonable efforts to unblock them.
      weak: Gave optimistic dates or avoided the other team until the work was done.
    followups:
      - Did you change your own priorities for them, and how did you decide?
    common_errors:
      - Promising dates to the dependent team that their own team hadn't agreed.

  - external_key: managerial.stakeholders.coaching_unclear_updates
    competency_key: mentoring
    topic: Coaching someone whose updates confused stakeholders
    difficulty: medium
    text: >-
      Tell me about someone on your team whose updates to stakeholders were regularly unclear or caused confusion. How did
      you help them improve?
    expected_concepts:
      - specific examples of unclear updates
      - explaining what the audience needed
      - a simple structure or template
      - reviewing drafts and gradually stepping back
    rubric:
      excellent: Used concrete examples, explained the audience's needs, gave a usable structure, reviewed drafts and stepped back as the person improved, with evidence of improvement.
      good: Gave useful feedback and some structure.
      weak: Rewrote their updates or took over communication entirely.
    followups:
      - What was the most common problem in their updates?
    common_errors:
      - Fixing the update themselves each time, so the person never learns.

  - external_key: managerial.stakeholders.sharp_message_copied_manager
    competency_key: communication
    topic: A sharply worded escalation copying your manager
    difficulty: medium
    text: >-
      A stakeholder sends you a sharply worded message about a missed deliverable and copies your manager. Tell me about a
      time something like this happened and how you responded.
    expected_concepts:
      - not replying in kind
      - checking the facts quickly
      - responding with facts, impact and next steps
      - moving to a direct conversation
      - aligning with their manager
    rubric:
      excellent: Checked the facts, replied promptly with impact and next steps without matching the tone, moved to a direct conversation and kept their manager aligned.
      good: Responded constructively and resolved the issue.
      weak: Responded defensively in writing or ignored the message.
    followups:
      - How did you follow up with your manager?
    common_errors:
      - Turning the reply into a long justification.

  - external_key: managerial.stakeholders.prototype_mistaken_for_done
    competency_key: stakeholder_management
    topic: A prototype mistaken for a nearly finished product
    difficulty: medium
    text: >-
      Tell me about a time a stakeholder saw a prototype or demo and assumed the real thing was almost done. How did you
      reset their expectations about the remaining work?
    expected_concepts:
      - explaining what the prototype skipped
      - making remaining work visible in concrete terms
      - realistic timeline for production readiness
      - labelling prototypes clearly in future
    rubric:
      excellent: Explained concretely what the prototype skipped, made the remaining work visible with a realistic plan and changed how they present prototypes to avoid repeat confusion.
      good: Reset expectations with a reasonable explanation.
      weak: Let the assumption stand, or committed to shipping the prototype as is.
    followups:
      - What do you do differently now when showing early work?
    common_errors:
      - Polishing prototypes so much that they look finished.

  - external_key: managerial.stakeholders.introducing_planning_process
    competency_key: leadership
    topic: Introducing a new planning process to stakeholders
    difficulty: medium
    text: >-
      Tell me about a time you introduced a new way of planning or taking requests that changed how stakeholders worked
      with your team. How did you get them to adopt it?
    expected_concepts:
      - explaining the problem it solves for them
      - involving stakeholders in its design
      - starting small or piloting
      - showing early benefits
      - adjusting based on feedback
    rubric:
      excellent: Framed the change around stakeholder benefits, involved them in shaping it, piloted before scaling and adjusted based on feedback, with evidence of adoption.
      good: Introduced the process with reasonable communication and some adoption.
      weak: Imposed the process without explanation, or abandoned it at the first complaint.
    followups:
      - Who resisted the change most, and why?
    common_errors:
      - Designing the process entirely for the team's convenience.

  - external_key: managerial.stakeholders.engineers_facing_customers
    competency_key: leadership
    topic: Putting engineers directly in front of customers
    difficulty: medium
    text: >-
      How do you decide when engineers on your team should talk directly with customers or business stakeholders, and when
      that should go through you or a product partner? Tell me about a time you got that balance right or wrong.
    expected_concepts:
      - benefits such as better understanding and faster clarification
      - risks such as unplanned commitments or distraction
      - guidance on what engineers can commit to
      - preparation and follow-up for those conversations
    rubric:
      excellent: Weighs the benefits and risks clearly, sets guidance on commitments, prepares engineers and gives an example with a reflection on what they would adjust.
      good: Has a sensible approach with an example.
      weak: Either blocks all direct contact or allows it with no guidance.
    followups:
      - What happened when an engineer made a commitment they shouldn't have?
    common_errors:
      - Assuming direct contact is always better without considering focus or commitments.

  - external_key: managerial.stakeholders.stakeholder_feedback_about_engineer
    competency_key: mentoring
    topic: A stakeholder complaining about one of your engineers
    difficulty: medium
    text: >-
      Tell me about a time a stakeholder told you one of your engineers was difficult to work with. How did you look into it,
      and what did you do with the engineer?
    expected_concepts:
      - gathering specific examples of behaviour and impact
      - hearing the engineer's side
      - separating work behaviours from the stakeholder's frustration
      - specific, actionable feedback and support
      - following up with both parties
    rubric:
      excellent: Gathered specific examples, listened to both sides, gave the engineer actionable feedback about observable behaviour, supported improvement and followed up with both parties.
      good: Investigated fairly and gave useful feedback.
      weak: Passed the complaint on without checking it, or dismissed it without looking into it.
    followups:
      - What did the engineer's side of the story add?
    common_errors:
      - Passing on vague feedback such as difficult without examples.

  - external_key: managerial.stakeholders.business_case_for_priority
    competency_key: communication
    topic: Winning priority with a business case
    difficulty: medium
    text: >-
      Tell me about a time you needed leadership to prioritise something your team believed was important. How did you
      build and present the case?
    expected_concepts:
      - quantified impact on revenue, cost, risk or customers
      - comparison with the alternatives competing for the same capacity
      - a clear ask with scope and timeline
      - anticipating objections
    rubric:
      excellent: Built a quantified case in business terms, compared it with competing work, made a specific ask and handled objections, with a clear outcome.
      good: Presented a reasonable case with some quantification.
      weak: Argued from technical preference without business impact.
    followups:
      - What objection did you not expect?
    common_errors:
      - Overstating the impact so the case loses credibility.

  - external_key: managerial.stakeholders.interface_negotiation
    competency_key: stakeholder_management
    topic: Negotiating an interface between two teams
    difficulty: medium
    text: >-
      Tell me about a time your team and another team needed to agree on an interface or contract between your systems, and
      you wanted different things. How did you reach agreement?
    expected_concepts:
      - understanding each side's constraints and consumers
      - written proposals with trade-offs
      - focusing on long-term ownership and change cost
      - a decision process if consensus fails
    rubric:
      excellent: Understood the other team's constraints, compared written options on long-term ownership and change cost, and reached an agreement with a defined tie-breaker if needed.
      good: Reached a workable agreement through discussion.
      weak: Imposed their own design, or accepted the other team's design despite real concerns.
    followups:
      - How has that interface held up since?
    common_errors:
      - Optimising for the first release rather than how the interface will change.

  - external_key: managerial.stakeholders.reorg_new_stakeholders
    competency_key: stakeholder_management
    topic: Resetting expectations after a reorganisation
    difficulty: medium
    text: >-
      After a reorganisation, your team suddenly has new stakeholders and some old commitments no longer fit. Tell me how
      you handled a change like that.
    expected_concepts:
      - reviewing existing commitments against the new structure
      - meeting new stakeholders to understand their goals
      - explicitly closing or transferring old commitments
      - communicating the new priorities
    rubric:
      excellent: Reviewed commitments promptly, met new stakeholders, explicitly closed or transferred old commitments and communicated the new priorities to everyone affected.
      good: Adapted to the new structure with reasonable communication.
      weak: Let old commitments drop silently or kept serving former stakeholders without agreement.
    followups:
      - Which old commitment was hardest to close?
    common_errors:
      - Assuming former stakeholders knew about the change.

  - external_key: managerial.stakeholders.conflicting_direction_manager_product
    competency_key: leadership
    topic: Conflicting direction from your manager and product partner
    difficulty: medium
    text: >-
      As a lead, tell me about a time your engineering manager and your product partner gave you conflicting direction. How
      did you resolve it?
    expected_concepts:
      - making the conflict explicit to both
      - bringing them together rather than choosing quietly
      - clarifying who owns which decision
      - communicating the outcome to the team
    rubric:
      excellent: Made the conflict visible to both, got them to resolve it together with clear decision ownership and communicated a single direction to the team.
      good: Resolved the conflict with reasonable communication.
      weak: Picked one side quietly or tried to satisfy both with diluted work.
    followups:
      - How did you avoid seeming to take sides?
    common_errors:
      - Acting as a go-between instead of getting the two to talk directly.

  - external_key: managerial.stakeholders.client_late_inputs
    competency_key: project_management
    topic: A client late with their own deliverables
    difficulty: hard
    text: >-
      Tell me about a client or partner engagement where the client was late providing things you depended on, such as data,
      access or decisions, but still expected you to hit the original date. How did you handle it?
    expected_concepts:
      - client dependencies written into the plan with dates
      - tracking and flagging each late input promptly
      - showing the knock-on effect on the delivery date
      - options such as resequencing, interim assumptions or a revised date
      - involving the client's sponsor or account owner
    rubric:
      excellent: Had client dependencies explicit in the plan, flagged each delay promptly with its knock-on effect, offered options such as resequencing or working assumptions and involved the client's sponsor to agree a revised plan without damaging the relationship.
      good: Raised the delays and agreed some adjustment to the plan.
      weak: Absorbed the delays silently and missed the date, or blamed the client without offering options.
    followups:
      - How did you raise the delays without sounding like you were making excuses?
      - What would you put in the plan or agreement from day one next time?
    common_errors:
      - Not recording client-side dependencies, so the slip looks like the delivery team's fault.

  - external_key: managerial.stakeholders.negotiating_unachievable_goals
    competency_key: leadership
    topic: Negotiating goals you believed were unachievable
    difficulty: hard
    text: >-
      Tell me about a time leadership proposed goals for your team that you believed were unachievable. How did you
      negotiate them, and how did the period actually turn out?
    expected_concepts:
      - evidence from past performance and capacity
      - understanding the business need behind the targets
      - a counter-proposal with stretch and committed levels
      - agreeing how progress will be reviewed
      - reflecting on the outcome versus the negotiation
    rubric:
      excellent: Used past evidence and an understanding of the business need to make a counter-proposal with committed and stretch levels, agreed review points and reflects candidly on how the result compared.
      good: Negotiated more realistic goals with a reasonable argument.
      weak: Accepted the goals silently, or rejected them without a counter-proposal.
    followups:
      - What did you end up achieving compared with the original and negotiated goals?
      - Did leadership accept the counter-proposal fully?
    common_errors:
      - Negotiating goals so low that they no longer serve the business need.

  - external_key: managerial.stakeholders.formal_risk_acceptance
    competency_key: stakeholder_management
    topic: Getting a stakeholder to formally own a risk
    difficulty: hard
    text: >-
      Tell me about a time a stakeholder insisted on going ahead despite a risk you had raised. How did you make sure the
      decision and its risk were properly owned?
    expected_concepts:
      - describing the risk in business terms
      - mitigation options
      - documenting the decision and who accepted the risk
      - confirming the stakeholder had authority to accept it
      - monitoring the risk afterwards
    rubric:
      excellent: Explained the risk in business terms, offered mitigation, recorded the decision with the accountable owner who had authority to accept it, and monitored the risk afterwards.
      good: Documented the risk and decision.
      weak: Went ahead without recording the risk, or refused to proceed without escalating appropriately.
    followups:
      - Did the risk materialise, and what happened?
      - What if the stakeholder didn't have the authority to accept it?
    common_errors:
      - Documenting the risk only to protect themselves rather than to inform the decision.

  - external_key: managerial.stakeholders.mutual_blame_between_teams
    competency_key: leadership
    topic: Two teams that blame each other
    difficulty: hard
    text: >-
      Tell me about a time your team and a partner group had fallen into blaming each other for problems. What did you do to
      change the relationship?
    expected_concepts:
      - stopping blame within their own team
      - meeting the other group's leader directly
      - jointly examining shared problems with facts
      - shared goals or joint working arrangements
      - evidence the relationship improved
    rubric:
      excellent: Addressed blame within their own team, engaged the other leader directly, examined shared problems jointly with facts and created shared goals or practices that measurably improved the relationship.
      good: Took steps to improve the relationship with some success.
      weak: Reinforced the blame narrative or escalated without engaging the other group.
    followups:
      - What did your own team do that contributed to the problem?
      - How did you know things had improved?
    common_errors:
      - Tolerating negative talk about the other team within their own team.

  - external_key: managerial.stakeholders.functional_managers_reclaim_people
    competency_key: project_management
    topic: Leading people you don't manage on a project
    difficulty: hard
    text: >-
      Tell me about a project where the people working on it reported to other managers who kept pulling them back to their
      own work. How did you keep the project on track?
    expected_concepts:
      - explicit allocation agreements with functional managers
      - making the impact of pull-backs visible
      - aligning priorities through shared leadership
      - adjusting the plan for realistic availability
      - recognising contributors to their own managers
    rubric:
      excellent: Secured explicit allocation agreements, made the impact of pull-backs visible, escalated priority conflicts to shared leadership and planned around real availability while recognising contributors to their managers.
      good: Negotiated reasonable availability and managed the plan.
      weak: Complained about the managers without changing anything, or pressured individuals directly.
    followups:
      - What did you offer the functional managers in return?
      - How did you track actual availability?
    common_errors:
      - Putting individuals in the middle of a conflict between their manager and the project.

  - external_key: managerial.stakeholders.sponsor_turnover
    competency_key: stakeholder_management
    topic: A new sponsor questioning an ongoing project
    difficulty: hard
    text: >-
      Tell me about a project whose sponsor changed partway through, and the new sponsor questioned whether it should
      continue. How did you handle that?
    expected_concepts:
      - understanding the new sponsor's goals and concerns
      - a clear account of value, progress and remaining cost
      - options including reshaping or stopping
      - respecting the decision even if it ends the project
      - communicating the outcome to the team and stakeholders
    rubric:
      excellent: Engaged the new sponsor early, presented value, progress and remaining cost objectively, offered options including stopping, and handled the decision and communication well.
      good: Made a reasonable case and maintained the project or its outcome.
      weak: Defended the project without engaging the new sponsor's concerns, or let it drift without a decision.
    followups:
      - Would stopping have been the right answer?
      - What did the project look like after the decision?
    common_errors:
      - Treating the new sponsor's questions as a threat rather than a legitimate review.

  - external_key: managerial.stakeholders.colliding_commitments
    competency_key: stakeholder_management
    topic: Two of your commitments colliding
    difficulty: hard
    text: >-
      Tell me about a time two commitments you had already made to different stakeholders turned out to collide, so you
      could only keep one on time. How did you decide, and how did you tell them?
    expected_concepts:
      - recognising the collision as early as possible
      - comparing the impact of missing each
      - involving the stakeholders or a shared leader in the decision
      - telling both parties directly with options
      - changing how they track commitments
    rubric:
      excellent: Spotted the collision early, compared impact objectively, involved the stakeholders or a shared leader in the choice, communicated directly with both and changed how they track commitments.
      good: Made a reasonable decision and communicated it.
      weak: Tried to keep both and missed both, or decided privately and told the affected party late.
    followups:
      - How did the stakeholder whose commitment slipped respond?
      - What would have caught the collision sooner?
    common_errors:
      - Choosing based on who would complain more rather than on impact.
