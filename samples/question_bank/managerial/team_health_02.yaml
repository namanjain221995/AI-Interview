# Curated questions: managerial round, team health (part 2 of 4) - psychological safety, raising
# concerns, feedback culture, blameless learning and interpersonal friction. Questions focus on
# observable work behaviour and the candidate's own actions, never on personal details of anyone.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: managerial.team_health.safe_to_disagree_signals
    competency_key: leadership
    topic: Knowing whether people feel safe to disagree
    difficulty: easy
    text: >-
      How can you tell whether people on your team feel safe disagreeing with you? What specific signals do you
      look for?
    expected_concepts:
      - people challenge decisions openly in meetings and reviews
      - bad news and mistakes are raised early
      - questions come from across the team, not only seniors
      - silence or instant agreement treated as a warning sign
      - actively inviting dissent and checking directly
    rubric:
      excellent: Names several observable signals, treats silence as a warning sign rather than agreement, and describes how they actively invite and test for disagreement.
      good: Names a few reasonable signals.
      weak: Assumes people feel safe because nobody has complained.
    followups:
      - When did you discover that people were not as comfortable disagreeing as you thought?
    common_errors:
      - Equating a quiet team with a happy team.

  - external_key: managerial.team_health.pre_mortem_worries
    competency_key: project_management
    topic: Giving people room to voice worries up front
    difficulty: easy
    text: >-
      Before a big project starts, how do you give people a chance to say what they're worried might go wrong,
      and what do you do with what they tell you?
    expected_concepts:
      - a pre-mortem or risk session at kickoff
      - anonymous or written input so everyone contributes
      - turning concerns into tracked risks with owners
      - showing the team that raised concerns changed the plan
    rubric:
      excellent: Describes a structured way to collect concerns from everyone, turns them into owned risks and gives an example where a raised concern changed the plan.
      good: Holds a kickoff risk discussion and records the concerns.
      weak: Assumes people will raise worries on their own.
    followups:
      - Tell me about a concern raised that way which turned out to matter.
    common_errors:
      - Collecting concerns and then never acting on or revisiting them.

  - external_key: managerial.team_health.unequal_airtime
    competency_key: communication
    topic: Making sure every voice is heard in meetings
    difficulty: easy
    text: >-
      In team meetings a few people often do most of the talking. What have you done to make sure everyone's
      ideas get heard?
    expected_concepts:
      - written input before or during the meeting
      - round-robin or directly inviting contributions
      - sharing agendas in advance so people can prepare
      - asking senior voices to speak last
      - following up with people afterwards
    rubric:
      excellent: Describes several concrete techniques, including written or asynchronous input, and gives an example of an idea that surfaced because of them.
      good: Uses one or two techniques such as round-robin.
      weak: Expects quieter people to speak up on their own.
    followups:
      - How do you handle someone who dominates without realising it?
    common_errors:
      - Putting people on the spot in a way that discourages them further.

  - external_key: managerial.team_health.admitting_own_mistake
    competency_key: leadership
    topic: Admitting your own mistake to the team
    difficulty: easy
    text: >-
      Tell me about a time you admitted a mistake of your own to your team. Why did you choose to share it, and
      what effect did it have?
    expected_concepts:
      - a specific mistake with real consequences
      - sharing it openly and early
      - what they did to fix it
      - the effect on how the team raised its own mistakes
    rubric:
      excellent: Gives a real mistake, explains sharing it openly as a deliberate choice, describes the fix and an observable change in how the team handled mistakes afterwards.
      good: Real example of owning a mistake and fixing it.
      weak: Picks a trivial example or presents a strength as a mistake.
    followups:
      - Did anything change in how others raised their own mistakes?
    common_errors:
      - Choosing a disguised strength instead of a real mistake.

  - external_key: managerial.team_health.basic_questions
    competency_key: mentoring
    topic: Making it easy to ask basic questions
    difficulty: easy
    text: >-
      How do you make it comfortable for newer engineers to ask questions they worry might sound basic?
    expected_concepts:
      - seniors visibly asking questions themselves
      - a named buddy or go-to person
      - channels where questions are welcomed
      - responding to questions without judgement
      - documenting answers so the next person benefits
    rubric:
      excellent: Describes concrete practices, including senior engineers modelling asking questions and a buddy system, and explains how they reinforce good responses.
      good: Offers a buddy or open channel and encourages questions.
      weak: Tells people to "just ask" without changing anything that makes asking easier.
    followups:
      - What would you do if a senior engineer responded dismissively to a question?
    common_errors:
      - Relying on an "open door" that nobody actually uses.

  - external_key: managerial.team_health.retros_that_change_things
    competency_key: communication
    topic: Retrospectives that lead to change
    difficulty: easy
    text: >-
      How do you run retrospectives so people raise real problems and the team actually follows through on what
      comes out of them?
    expected_concepts:
      - varying the format to keep it fresh
      - anonymous or written input for sensitive topics
      - a small number of owned actions
      - reviewing previous actions at the next retro
      - leader not dominating the discussion
    rubric:
      excellent: Describes how they draw out real issues, limit actions to a few with owners, and check progress at the next retro, with an example of a change that came out of it.
      good: Runs regular retros with owned actions.
      weak: Retros produce long lists that nobody follows up.
    followups:
      - What do you do when the same issue comes up retro after retro?
    common_errors:
      - Producing many actions with no owner.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.team_health.blameless_after_outage
    competency_key: leadership
    topic: Blameless follow-up after an engineer's mistake
    difficulty: medium
    text: >-
      An engineer's change caused a production outage. How do you run the follow-up so the team learns from it
      without that engineer being singled out? Tell me about a time you did this.
    expected_concepts:
      - focusing on how the system allowed the failure
      - private support for the engineer involved
      - timeline and contributing factors rather than a culprit
      - concrete preventive actions in tooling or process
      - modelling blameless language in public channels
    rubric:
      excellent: Real example where the review focused on systemic causes, the engineer was supported privately, blameless language was modelled publicly and concrete safeguards were added.
      good: Ran a blameless review with preventive actions.
      weak: Focused on who made the mistake or used the review to assign blame.
    followups:
      - How did you handle someone outside the team who wanted a name?
    common_errors:
      - Calling it blameless while action items amount to "the engineer should be more careful".

  - external_key: managerial.team_health.late_bad_news
    competency_key: people_management
    topic: Bad news reaching you too late
    difficulty: medium
    text: >-
      Tell me about a time you found out about a problem much later than you should have because nobody wanted
      to raise it. What did you change afterwards?
    expected_concepts:
      - reflecting on why people held back, including their own reactions
      - responding to the news without punishing the messenger
      - lighter-weight ways to flag risk early
      - thanking people for raising problems
      - evidence that issues surfaced earlier later on
    rubric:
      excellent: Real example where they examined their own part, changed how they react and how risks are surfaced, and can show problems came up earlier afterwards.
      good: Real example with a reasonable process change.
      weak: Blames the team for not speaking up without examining why.
    followups:
      - What was your own part in people holding back?
    common_errors:
      - Adding more status reporting rather than making it safe to raise problems.

  - external_key: managerial.team_health.public_challenge
    competency_key: leadership
    topic: Handling a public challenge to your decision
    difficulty: medium
    text: >-
      Someone on your team strongly challenges one of your decisions in a team meeting in front of everyone. How
      do you respond in the moment, and what do you do afterwards?
    expected_concepts:
      - taking the substance of the challenge seriously
      - acknowledging valid points openly
      - deciding whether to resolve now or take it offline
      - follow-up conversation with the person
      - reconsidering the decision if warranted and explaining the outcome
    rubric:
      excellent: Engages with the substance in the moment, treats the challenge as legitimate, follows up privately and either changes the decision or explains clearly why not.
      good: Engages respectfully and follows up afterwards.
      weak: Shuts the challenge down or treats it as a discipline issue.
    followups:
      - When would the way the challenge was made itself need addressing?
    common_errors:
      - Defending the decision without considering the argument.

  - external_key: managerial.team_health.hidden_fix
    competency_key: people_management
    topic: Encouraging openness after a hidden mistake
    difficulty: medium
    text: >-
      You discover that an engineer quietly fixed a problem they had caused, without telling anyone, even though it
      had affected customers. How do you respond so that people are more open next time?
    expected_concepts:
      - understanding why they kept it quiet
      - thanking them for fixing it while explaining why visibility matters
      - making sure customer impact is handled properly
      - checking whether the team's reaction to mistakes encourages hiding
      - making reporting easy and blameless
    rubric:
      excellent: Responds without punishment, explains why visibility matters, deals with the customer impact, and looks at what in the team's culture encouraged hiding and changes it.
      good: Talks to the engineer about transparency and handles the impact.
      weak: Reprimands the engineer, which teaches the team to hide mistakes better.
    followups:
      - What would you look at in how your team has reacted to past mistakes?
    common_errors:
      - Treating it purely as an individual discipline issue.

  - external_key: managerial.team_health.seniority_wins_debates
    competency_key: leadership
    topic: When seniority decides technical debates
    difficulty: medium
    text: >-
      You notice that ideas from newer team members are rarely adopted, even when they're good, because the most
      senior people's views tend to win. How would you change the way the team makes technical decisions?
    expected_concepts:
      - written proposals judged on explicit criteria
      - senior people speaking last or reviewing asynchronously
      - clear decision owners and records
      - coaching seniors to build on others' ideas
      - checking whose proposals get adopted over time
    rubric:
      excellent: Introduces concrete decision practices such as written proposals with criteria, changes meeting dynamics, coaches senior engineers and checks the effect over time.
      good: Introduces some structure so newer people's ideas are considered.
      weak: Tells newer people to speak up more.
    followups:
      - How would you bring the senior engineers along with the change?
    common_errors:
      - Putting the burden on newer people instead of changing the process.

  - external_key: managerial.team_health.survey_low_trust
    competency_key: communication
    topic: Survey shows people won't raise concerns with you
    difficulty: medium
    text: >-
      Your team's anonymous survey shows that many people don't feel comfortable raising concerns with you. What
      would you do in the weeks after you read that?
    expected_concepts:
      - sharing the result openly with the team
      - asking for input on causes without hunting for who said it
      - seeking feedback from a skip-level or peer
      - committing to specific changes and reporting on them
      - measuring again later
    rubric:
      excellent: Shares the result openly, seeks input without trying to identify respondents, makes specific changes to their own behaviour, reports progress and re-measures.
      good: Acknowledges the result and asks the team for ideas.
      weak: Dismisses the result or tries to work out who responded.
    followups:
      - What would you change about your own behaviour first?
    common_errors:
      - Trying to identify individual respondents.

  - external_key: managerial.team_health.room_to_fail
    competency_key: leadership
    topic: Room to experiment with a high delivery bar
    difficulty: medium
    text: >-
      How do you give the team room to try ideas that might fail while still holding a high bar for delivery?
      Give me an example.
    expected_concepts:
      - time-boxed experiments with clear hypotheses
      - limiting the blast radius
      - celebrating learning from failed experiments
      - separating experiments from committed work
      - making decisions based on results
    rubric:
      excellent: Real example of a bounded experiment with a clear hypothesis, where a failed result was treated as useful learning and committed delivery was protected.
      good: Describes time-boxed experiments alongside delivery.
      weak: Either never allows failure or has no structure around experiments.
    followups:
      - How did you talk about an experiment that failed?
    common_errors:
      - Encouraging experiments but penalising them at review time when they fail.

  - external_key: managerial.team_health.concerns_upward
    competency_key: stakeholder_management
    topic: Carrying the team's concerns upward
    difficulty: medium
    text: >-
      When your team raises concerns about a decision made above you, how do you make sure those concerns
      actually reach the people who made it, and how do you report back to the team?
    expected_concepts:
      - capturing concerns specifically and with evidence
      - choosing the right forum and decision maker
      - presenting concerns constructively with impact
      - reporting back the outcome and reasoning, even when nothing changes
      - avoiding both dismissing and simply echoing complaints
    rubric:
      excellent: Gives a real example of turning team concerns into a specific, evidence-based case for the right decision maker and closing the loop with the team regardless of the outcome.
      good: Raises concerns upward and tells the team what happened.
      weak: Either dismisses the concerns or passes them on without follow-up.
    followups:
      - What did you tell the team when leadership didn't change the decision?
    common_errors:
      - Never closing the loop, so the team stops raising concerns.

  - external_key: managerial.team_health.stakeholder_blames_engineer
    competency_key: stakeholder_management
    topic: A stakeholder criticises an engineer publicly
    difficulty: medium
    text: >-
      After a missed date, a senior stakeholder criticises one of your engineers by name in a public channel. How
      do you handle it?
    expected_concepts:
      - stepping in and taking accountability as the manager
      - moving the discussion to a private conversation
      - correcting facts without escalating publicly
      - supporting the engineer directly
      - addressing the underlying delivery issue
    rubric:
      excellent: Takes accountability publicly as the manager, moves the conversation private, addresses the stakeholder's concern on substance, supports the engineer and fixes the delivery problem.
      good: Takes the discussion private and supports the engineer.
      weak: Stays silent or argues publicly.
    followups:
      - What would you say to the engineer afterwards?
    common_errors:
      - Ignoring it because the stakeholder is senior.

  - external_key: managerial.team_health.hybrid_inclusion
    competency_key: communication
    topic: Including remote members in a hybrid team
    difficulty: medium
    text: >-
      On a team where some people are in the office and others are remote, how have you made sure the remote
      people aren't left out of discussions and decisions?
    expected_concepts:
      - remote-first meeting practices
      - decisions written down in shared places
      - avoiding hallway decisions
      - rotating who facilitates
      - checking with remote members directly
    rubric:
      excellent: Describes concrete remote-first practices, written decision records, and a way of checking the result with remote members, with an example.
      good: Uses some remote-first practices.
      weak: Assumes video links in meetings are enough.
    followups:
      - How do you handle decisions made informally in the office?
    common_errors:
      - Treating remote participants as an audience rather than participants.

  - external_key: managerial.team_health.unpopular_decision_trust
    competency_key: leadership
    topic: Keeping trust after an unpopular decision
    difficulty: medium
    text: >-
      When you make a decision most of the team disagrees with, how do you explain it and keep their trust? Tell
      me about a specific case.
    expected_concepts:
      - genuinely hearing objections before deciding
      - explaining the reasoning and constraints
      - acknowledging the downsides openly
      - defining when the decision would be revisited
      - following up on how it played out
    rubric:
      excellent: Real case where they listened before deciding, explained the reasoning and trade-offs, set a review point and revisited the decision as promised.
      good: Explains the reasoning clearly to the team.
      weak: Announces the decision without explanation or avoids the conversation.
    followups:
      - Did you ever reverse a decision like that? What happened?
    common_errors:
      - Pretending there are no downsides to the decision.

  - external_key: managerial.team_health.speaking_up_in_incidents
    competency_key: communication
    topic: Junior voices during incidents
    difficulty: medium
    text: >-
      During an incident, how do you make sure the least experienced person on the call feels able to say they
      think the current theory is wrong?
    expected_concepts:
      - incident commander explicitly asking for other hypotheses
      - roles that separate coordination from investigation
      - a shared written timeline where anyone can add observations
      - recognising good catches afterwards regardless of seniority
      - review practices that examine ignored signals
    rubric:
      excellent: Describes concrete incident practices that invite challenge, such as explicit calls for alternatives and shared timelines, and how good catches by junior people are recognised afterwards.
      good: Encourages people to speak up and asks for input during incidents.
      weak: Lets the most senior person drive with no space for others.
    followups:
      - Tell me about a time someone less experienced spotted what others missed.
    common_errors:
      - Assuming that seniority on the call means the right theory.

  # ------------------------------------------------------------------ hard
  - external_key: managerial.team_health.rebuild_trust_after_blame
    competency_key: leadership
    topic: Rebuilding trust after a blame culture
    difficulty: hard
    text: >-
      You inherit a team whose previous manager publicly blamed individuals for failures, and people now avoid
      taking ownership of anything risky. How would you rebuild trust over your first few months?
    expected_concepts:
      - listening first through one-to-ones
      - visibly responding well to the first mistakes and bad news
      - blameless review practices
      - taking accountability upward as the manager
      - giving ownership in small steps with support
      - measuring progress through participation and surveys
    rubric:
      excellent: Lays out a phased plan that starts with listening, uses early incidents to demonstrate a different response, introduces blameless practices, gradually expands ownership and measures change.
      good: Commits to blameless practices and building relationships.
      weak: Expects trust to return simply because the manager changed.
    followups:
      - What would be your first visible signal to the team that things are different?
    common_errors:
      - Criticising the previous manager to the team.

  - external_key: managerial.team_health.split_into_camps
    competency_key: people_management
    topic: Long-running disagreement splitting the team
    difficulty: hard
    text: >-
      Two senior engineers on your team have a long-running technical disagreement that has split the team into
      camps. How would you resolve it?
    expected_concepts:
      - understanding each position and its underlying concern
      - separate then joint conversations
      - a clear decision process and decision owner
      - making a decision with explicit criteria
      - expectations for behaviour after the decision
      - repairing working relationships across the team
    rubric:
      excellent: Understands both positions, sets a clear decision process with criteria and an owner, makes a decision, sets expectations for commitment afterwards and repairs the wider team dynamic.
      good: Mediates and helps reach a decision.
      weak: Lets it continue hoping it resolves, or picks a side without process.
    followups:
      - What if one of them refuses to accept the outcome?
    common_errors:
      - Treating it only as a technical question and ignoring the team split.

  - external_key: managerial.team_health.safety_and_accountability
    competency_key: leadership
    topic: Balancing psychological safety and accountability
    difficulty: hard
    text: >-
      Some people argue that a focus on psychological safety makes it harder to hold people accountable. How do
      you balance the two? Give me an example where you had to do both.
    expected_concepts:
      - safety and high standards are complementary
      - clear expectations and consistent follow-through
      - blameless about mistakes, firm about repeated patterns
      - direct feedback delivered with respect
      - a real example covering both
    rubric:
      excellent: Explains why safety and accountability reinforce each other, distinguishes one-off mistakes from repeated patterns, and gives a real example where they kept high standards and trust together.
      good: Reasonable balance with an example.
      weak: Treats safety as avoiding difficult conversations, or accountability as blame.
    followups:
      - Where do you draw the line between a learning moment and a performance issue?
    common_errors:
      - Confusing psychological safety with comfort.

  - external_key: managerial.team_health.concern_without_action
    competency_key: people_management
    topic: A concern raised with a request not to act
    difficulty: hard
    text: >-
      An engineer privately tells you a colleague has repeatedly made dismissive remarks about their work in
      meetings, but asks you not to do anything about it. How do you handle that?
    expected_concepts:
      - taking the report seriously and thanking them
      - explaining what you can and cannot keep confidential
      - observing directly and addressing behaviour you see yourself
      - knowing when company policy requires escalation to HR
      - checking back with the person
    rubric:
      excellent: Takes it seriously, is clear about the limits of confidentiality, addresses the behaviour through direct observation without exposing the reporter, knows when HR policy applies and follows up.
      good: Supports the person and finds a way to address the behaviour.
      weak: Does nothing because they were asked, or confronts the colleague in a way that exposes the reporter.
    followups:
      - When would you override the request and escalate?
    common_errors:
      - Promising complete confidentiality they cannot keep.

  - external_key: managerial.team_health.leadership_punishes_bad_news
    competency_key: stakeholder_management
    topic: Leadership reacting badly to bad news
    difficulty: hard
    text: >-
      Your own leadership tends to react badly to bad news, and your team has started softening status reports
      as a result. What would you do?
    expected_concepts:
      - keeping reporting accurate and taking the heat as the manager
      - presenting problems with options and plans
      - early warning to avoid surprises
      - giving feedback upward about the effect
      - reassuring the team that accurate reporting is expected
    rubric:
      excellent: Insists on accurate reporting, absorbs the reaction as the manager, frames problems with options, gives constructive feedback upward and resets expectations with the team.
      good: Keeps reports accurate and shields the team.
      weak: Accepts softened reporting to avoid conflict.
    followups:
      - How would you raise this with your own manager?
    common_errors:
      - Hiding problems until they become crises.

  - external_key: managerial.team_health.measure_safety_change
    competency_key: leadership
    topic: Measuring change in psychological safety
    difficulty: hard
    text: >-
      How would you tell whether psychological safety on your team had actually improved over six months, rather
      than relying on a general impression?
    expected_concepts:
      - repeated survey questions with a baseline
      - behavioural indicators such as risks raised early or near misses reported
      - participation spread in meetings and reviews
      - qualitative input from one-to-ones and skip-levels
      - caution about small-team anonymity and noise
    rubric:
      excellent: Combines a survey baseline with behavioural indicators and qualitative input, and recognises the limits of measurement on small teams.
      good: Uses a survey plus some observation.
      weak: Relies on gut feel or a single metric.
    followups:
      - Which indicator would you trust most, and why?
    common_errors:
      - Treating a single survey score as conclusive.

  - external_key: managerial.team_health.after_serious_mistake
    competency_key: people_management
    topic: Supporting an engineer the team now distrusts
    difficulty: hard
    text: >-
      An engineer made a mistake that caused a serious customer-facing incident, and some teammates are now quietly
      asking for that person to be kept off critical work. How would you handle the engineer, the team and the
      work?
    expected_concepts:
      - blameless review that fixes systemic gaps
      - supporting the engineer and restoring their involvement
      - addressing the team's concerns directly
      - safeguards that protect everyone, not just this person
      - distinguishing a one-off mistake from a performance pattern
    rubric:
      excellent: Fixes systemic gaps, supports and gradually restores the engineer's responsibility, addresses the team's concerns openly, and distinguishes a one-off from a pattern.
      good: Supports the engineer and runs a blameless review.
      weak: Removes the engineer from critical work to satisfy the team.
    followups:
      - What would change your approach if it were the third similar incident?
    common_errors:
      - Quietly sidelining the person, which signals that mistakes end careers.
