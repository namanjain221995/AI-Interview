# Managerial round: agile practices and team process (part 1 of 4).
# Focus: retrospectives, stand-ups, working agreements, process experiments and keeping process light.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ retrospectives
  - external_key: managerial.process_agile.last_retro_walkthrough
    competency_key: agile_delivery
    topic: Walking through a recent retrospective
    difficulty: easy
    text: >-
      Walk me through the last retrospective you ran or were closely involved in. How was it structured, and
      what actually came out of it?
    expected_concepts:
      - a clear structure such as gather data, generate insights, decide actions
      - how the format was chosen for that particular team or moment
      - specific actions with an owner and a timeframe
      - how the outcome was followed up afterwards
    rubric:
      excellent: Describes a specific retrospective with a deliberate structure, names the concrete actions that came out of it with owners, and explains how they were followed up and what changed.
      good: Gives a real retrospective with a sensible structure and at least one concrete outcome, though follow-up is thin.
      weak: Describes retrospectives in general terms or as a discussion with no decisions or outcomes.
    followups:
      - Why did you pick that format rather than a different one?
      - Which of those actions was actually completed?
    common_errors:
      - Describing a generic template instead of a specific session.

  - external_key: managerial.process_agile.stale_retros_refresh
    competency_key: agile_delivery
    topic: Reviving retrospectives that have gone stale
    difficulty: medium
    text: >-
      Retrospectives often go stale after a few months, with the same few people talking and the same points
      coming up every time. Tell me about a time you noticed that happening and what you changed.
    expected_concepts:
      - signals that the retrospective had stopped being useful
      - asking the team what was not working about it
      - changing format, focus or data brought into the session
      - narrowing to fewer, more meaningful actions
      - checking whether the change made a difference
    rubric:
      excellent: Names concrete signals of staleness, involves the team in diagnosing it, makes specific changes to format or inputs, and shows evidence the sessions became more productive.
      good: Gives a real example of refreshing the format with some improvement, but diagnosis or evidence is light.
      weak: Only swaps in a new game or template without understanding why the sessions stalled.
    followups:
      - How did you know the change worked rather than just being novel?
      - What did the team say was wrong with the old sessions?
    common_errors:
      - Treating new formats as the fix when the real problem was actions never being done.

  - external_key: managerial.process_agile.retro_hearing_everyone
    competency_key: leadership
    topic: Hearing from everyone in a retrospective
    difficulty: easy
    text: >-
      In a retrospective, how do you make sure you hear from people who rarely speak in a group discussion?
      Tell me what you've actually done on a team.
    expected_concepts:
      - silent writing or individual input before group discussion
      - anonymous or asynchronous input options
      - structured turn-taking or small-group breakouts
      - facilitator managing dominant voices
      - following up one-to-one when useful
    rubric:
      excellent: Describes specific techniques used on a real team, such as silent brainstorming and structured rounds, and gives an example where they surfaced an issue that would otherwise have been missed.
      good: Names sensible techniques and a real team, with limited evidence of the effect.
      weak: Relies on asking whether anyone else has something to add, or puts quieter people on the spot.
    followups:
      - Can you think of an issue that only came out because of that approach?
      - How did you handle someone who tended to dominate the discussion?
    common_errors:
      - Calling on individuals directly without giving them a lower-pressure way to contribute.

  - external_key: managerial.process_agile.retro_choosing_actions
    competency_key: agile_delivery
    topic: Choosing which retrospective actions to pursue
    difficulty: medium
    text: >-
      When a retrospective surfaces ten different problems, how do you decide which one or two the team will
      actually work on? Give me an example from a real session.
    expected_concepts:
      - grouping and voting or another transparent prioritisation method
      - weighing impact against effort and the team's ability to act
      - deliberately limiting the number of actions
      - making each action small, owned and checkable
      - parking the rest visibly rather than discarding them
    rubric:
      excellent: Explains a transparent way the team prioritised, deliberately limited actions to what could be done, made them specific and owned, and describes what happened to the problems that were not chosen.
      good: Describes a reasonable prioritisation with a real example, but actions or follow-up are loosely defined.
      weak: Tries to address everything, or the facilitator picks the actions alone without explanation.
    followups:
      - What happened to the problems you didn't pick?
      - How did you make sure the chosen action was small enough to finish?
    common_errors:
      - Producing long action lists that nobody has capacity to complete.

  - external_key: managerial.process_agile.retro_blame_turn
    competency_key: leadership
    topic: Redirecting a retrospective away from blame
    difficulty: hard
    text: >-
      Tell me about a retrospective where the discussion started turning into blame, either toward a person on
      the team or toward another team. How did you handle it in the room, and what did you do afterwards?
    expected_concepts:
      - recognising the shift toward blame early
      - redirecting to systems, conditions and decisions rather than individuals
      - protecting the person being blamed without dismissing the concern
      - follow-up conversations outside the session
      - changes that made the underlying issue less likely to recur
    rubric:
      excellent: Describes a specific moment, the exact way they reframed the discussion toward causes in the system, how they followed up privately with the people involved, and a lasting change that addressed the real issue.
      good: Gives a real example of steering away from blame with a reasonable follow-up, but the systemic fix is unclear.
      weak: Lets the blame continue, shuts down the topic entirely, or has no real example.
    followups:
      - What did you say to the person who was being blamed afterwards?
      - How did you raise the cross-team problem with the other team?
    common_errors:
      - Ending the discussion without addressing the legitimate problem behind the blame.

  - external_key: managerial.process_agile.manager_in_the_retro
    competency_key: leadership
    topic: The manager's influence on retrospective candour
    difficulty: hard
    text: >-
      As a manager, your presence in a retrospective can change what people are willing to say. How have you
      dealt with that, and how did you know whether your approach was working?
    expected_concepts:
      - awareness of the power dynamic a manager brings
      - options such as joining only part of the session or having someone else facilitate
      - anonymous input channels
      - acting visibly on difficult feedback to build trust
      - evidence such as more critical topics being raised over time
    rubric:
      excellent: Describes concrete choices about their role in the session, explains the trade-offs, and gives evidence that the team raised harder topics over time, including feedback about the manager's own decisions.
      good: Recognises the issue and describes a reasonable approach, with limited evidence of its effect.
      weak: Does not see their presence as a factor, or simply stays away with no plan to hear the feedback.
    followups:
      - Tell me about a piece of critical feedback about your own decisions that came out of a retro.
      - What did you do with it?
    common_errors:
      - Assuming that saying "this is a safe space" is enough.

  - external_key: managerial.process_agile.retro_after_bad_delivery
    competency_key: agile_delivery
    topic: Retrospective after a delivery went badly
    difficulty: medium
    text: >-
      Tell me about a retrospective you ran after a delivery went badly, such as a missed launch or a very
      painful release. How did you structure it so it led to real changes rather than just a list of complaints?
    expected_concepts:
      - building a shared timeline of what happened
      - separating contributing factors from symptoms
      - including people from outside the team when relevant
      - a small number of concrete changes with owners
      - checking in later on whether the changes held
    rubric:
      excellent: Describes a structured review built on facts and a timeline, identifies root contributing factors across process and planning, and names specific changes that were made and their effect on later deliveries.
      good: Gives a real example with a structured discussion and a few changes, but limited follow-through.
      weak: Describes venting or finger-pointing with no structure, or changes that were never implemented.
    followups:
      - Which change made the biggest difference on the next delivery?
      - Who outside the team did you involve, and why?
    common_errors:
      - Jumping to solutions before the team agreed on what actually happened.

  # ------------------------------------------------------------ working agreements and stand-ups
  - external_key: managerial.process_agile.working_agreement_created
    competency_key: collaboration
    topic: Creating a team working agreement
    difficulty: easy
    text: >-
      Tell me about a team working agreement you helped put together. What went into it, and how did the team
      actually use it day to day?
    expected_concepts:
      - drafted with the whole team rather than imposed
      - concrete norms such as review turnaround, meeting times or availability
      - kept short and visible
      - revisited and updated over time
      - referenced when norms were not being followed
    rubric:
      excellent: Describes how the team created the agreement together, gives specific norms it contained, and shows how it was used and revised in practice.
      good: Describes a real agreement with concrete content, but little on how it was used afterwards.
      weak: Describes a document written by the manager alone or a list of vague values.
    followups:
      - Which item in the agreement caused the most debate?
      - When did you last revise it, and why?
    common_errors:
      - Filling the agreement with abstract values rather than specific behaviours.

  - external_key: managerial.process_agile.working_agreement_ignored
    competency_key: leadership
    topic: When the team's own agreement is ignored
    difficulty: medium
    text: >-
      When a team's own working agreement starts being ignored, for example review norms slipping or people
      skipping agreed meetings, how have you handled it? Walk me through a real case.
    expected_concepts:
      - noticing the drift with specific evidence
      - raising it with the team rather than quietly enforcing it
      - asking whether the agreement itself still makes sense
      - updating the agreement or recommitting to it
      - addressing individual patterns privately when needed
    rubric:
      excellent: Gives a specific case, brings it back to the team with evidence, explores whether the norm still fits, and describes the resulting decision and whether behaviour changed.
      good: Gives a real example of raising the issue and recommitting, with modest follow-up.
      weak: Ignores the drift, or enforces the rule unilaterally without questioning whether it still works.
    followups:
      - Did you change the agreement or the behaviour in the end?
      - How did you handle one person who kept breaking it?
    common_errors:
      - Assuming the people are the problem when the agreement no longer fits the work.

  - external_key: managerial.process_agile.standup_purpose
    competency_key: agile_delivery
    topic: What a daily stand-up is for
    difficulty: easy
    text: >-
      What do you think a daily stand-up is for, and how have you shaped one on your team so it actually serves
      that purpose?
    expected_concepts:
      - coordination toward the iteration goal rather than status reporting
      - focus on the work and blockers rather than each person's activity
      - short and timeboxed with detail taken offline
      - walking the board from the right or a similar flow-based approach
      - adjusting the format based on team feedback
    rubric:
      excellent: Explains the coordination purpose clearly and gives specific changes they made to a real stand-up, such as walking the board, and the effect on how the team worked.
      good: States a sensible purpose with a real but general description of how they run it.
      weak: Treats the stand-up as a status report to the manager.
    followups:
      - What did the stand-up look like before you changed it?
      - How do you handle a topic that needs a longer discussion?
    common_errors:
      - Running the stand-up as a round of individual status updates for the lead.

  - external_key: managerial.process_agile.async_standup_switch
    competency_key: agile_delivery
    topic: Moving between live and asynchronous stand-ups
    difficulty: medium
    text: >-
      Tell me about a time you moved a team from a live daily stand-up to written asynchronous updates, or the
      other way round. What prompted it, and what did you watch to decide whether it was working?
    expected_concepts:
      - the specific problem that triggered the change
      - how the team agreed on the new format
      - what the updates contained and where they lived
      - signals watched, such as blockers resolved or coordination misses
      - adjusting or reversing based on what happened
    rubric:
      excellent: Describes a clear trigger, how the team decided, the concrete mechanics of the new format and specific signals used to judge it, including any adjustments made.
      good: Gives a real change with a reasonable rationale but only a general sense of whether it worked.
      weak: Changed the format by preference with no way of telling whether it helped.
    followups:
      - What did the team lose with the new format, and how did you make up for it?
      - Did you ever go back?
    common_errors:
      - Assuming written updates get read without checking.

  - external_key: managerial.process_agile.standup_blockers_resolved
    competency_key: agile_delivery
    topic: Making sure blockers get resolved
    difficulty: easy
    text: >-
      How do you make sure blockers raised in a stand-up actually get resolved rather than just reported again
      the next day? Give me an example from your team.
    expected_concepts:
      - making blockers visible on the board
      - assigning someone to help right after the stand-up
      - escalating quickly when the team cannot resolve it
      - tracking how long items stay blocked
      - looking for recurring blocker patterns
    rubric:
      excellent: Describes a concrete mechanism for visibility, ownership and escalation, with an example of a blocker that was resolved quickly and a recurring pattern they addressed.
      good: Describes a reasonable mechanism with a real example, but no attention to recurring causes.
      weak: Relies on the blocked person to sort it out alone.
    followups:
      - What was a blocker that kept coming back, and what did you do about it?
      - When do you personally step in?
    common_errors:
      - Treating mentioning a blocker as the same as handling it.

  - external_key: managerial.process_agile.definition_of_done_origin
    competency_key: agile_delivery
    topic: Arriving at a definition of done
    difficulty: easy
    text: >-
      How did your current or most recent team define when a piece of work is done, and how did you arrive at
      that definition?
    expected_concepts:
      - explicit criteria such as tested, reviewed, deployed and monitored
      - agreed with the team and relevant partners like QA or operations
      - visible and used during review and acceptance
      - evolved as the team's capabilities improved
    rubric:
      excellent: States specific done criteria, explains how they were agreed with the team and partners, and describes how the definition was used in practice and changed over time.
      good: Gives specific criteria and a reasonable origin, but little on how it evolved.
      weak: Equates done with code merged or has no shared definition.
    followups:
      - What item did you add to it later, and what prompted that?
      - How do you handle work that meets the criteria but still isn't really finished?
    common_errors:
      - Stopping the definition at merged code without testing or release.

  # ------------------------------------------------------------ keeping process light
  - external_key: managerial.process_agile.process_or_conversation
    competency_key: leadership
    topic: Deciding whether a problem needs process at all
    difficulty: medium
    text: >-
      How do you decide whether a problem on your team needs a new process, rather than a conversation or a
      one-off fix? Tell me about a recent case where you chose not to add process.
    expected_concepts:
      - checking how often the problem happens and its real cost
      - considering whether it is a skills, clarity or individual issue
      - preferring the lightest intervention first
      - the ongoing cost a new process adds for everyone
      - revisiting the decision if the problem recurs
    rubric:
      excellent: Gives a clear rule of thumb grounded in frequency and cost, applies it to a specific case where they deliberately avoided new process, and explains what they did instead and how it turned out.
      good: Shows sound judgement with a real example, but reasoning about cost or recurrence is thin.
      weak: Reaches for a new rule or approval step for every problem, or cannot give an example.
    followups:
      - When did that problem come back, if ever?
      - Tell me about a time you did decide to add process.
    common_errors:
      - Creating a team-wide rule in response to a single incident.

  - external_key: managerial.process_agile.removed_ceremony
    competency_key: agile_delivery
    topic: Removing a meeting or approval step
    difficulty: medium
    text: >-
      Tell me about a meeting, ceremony or approval step you removed from a team's way of working. How did you
      decide it could go, and what happened afterwards?
    expected_concepts:
      - understanding what the step was originally meant to achieve
      - evidence that it no longer delivered that value
      - checking with the people who relied on it
      - replacing the useful part with something lighter if needed
      - observing the effect after removal
    rubric:
      excellent: Explains the original purpose of the step, the evidence it was no longer earning its cost, how they consulted the people affected, and what happened after removal including any lighter replacement.
      good: Describes a real removal with sensible reasoning, but limited follow-up on the effect.
      weak: Removed something simply because people disliked it, without checking what it protected.
    followups:
      - Who objected, and how did you address their concern?
      - What would have told you to bring it back?
    common_errors:
      - Removing a step without understanding what risk it was managing.

  - external_key: managerial.process_agile.process_change_as_experiment
    competency_key: agile_delivery
    topic: Running process changes as experiments
    difficulty: medium
    text: >-
      When you try a change to how your team works, how do you set it up as an experiment rather than a
      permanent rule? Walk me through one you ran.
    expected_concepts:
      - a clear hypothesis about what should improve
      - a fixed trial period
      - a simple measure or signal agreed in advance
      - a planned review point with the team
      - willingness to keep, adjust or drop the change
    rubric:
      excellent: Describes a specific experiment with a hypothesis, timebox, agreed signal and review, and explains the decision that came out of the review.
      good: Describes a trial with a review point, but the hypothesis or measure was vague.
      weak: Changes are announced as permanent and never revisited.
    followups:
      - What was the outcome of the review?
      - How did you choose the trial length?
    common_errors:
      - Declaring success based on how the change felt rather than the agreed signal.

  - external_key: managerial.process_agile.rolled_back_process_change
    competency_key: leadership
    topic: Reversing a process change that failed
    difficulty: hard
    text: >-
      Tell me about a process change you introduced that didn't work and that you ended up rolling back. How did
      you recognise it wasn't working, and how did you handle reversing it with the team?
    expected_concepts:
      - specific evidence that the change was failing
      - owning the decision openly with the team
      - understanding why it failed rather than just undoing it
      - what was kept or learned from the attempt
      - how it shaped later changes
    rubric:
      excellent: Gives a real failed change, the evidence that showed it, owns the decision openly, explains the cause of failure and how that lesson changed how they introduce process now.
      good: Gives a real example and a clean reversal, with some reflection on why it failed.
      weak: Cannot name a failed change, or blames the team for not following it.
    followups:
      - What would you do differently if you introduced it again?
      - How did the team react to the reversal?
    common_errors:
      - Keeping a failing change too long to avoid admitting it did not work.

  - external_key: managerial.process_agile.sprints_or_flow_choice
    competency_key: agile_delivery
    topic: Choosing between sprints and continuous flow
    difficulty: medium
    text: >-
      How have you decided between a sprint-based approach and a continuous flow approach for a team? Tell me
      about the team, what you chose and why.
    expected_concepts:
      - nature of the work, such as predictable features versus interrupt-driven work
      - stakeholder need for planning cadence and commitments
      - team size and maturity
      - what each approach costs in overhead
      - revisiting the choice as the work changed
    rubric:
      excellent: Ties the choice to concrete characteristics of the team's work and stakeholders, explains the trade-offs and describes how it worked out, including any later adjustment.
      good: Makes a reasonable choice for a real team with some explanation of the trade-offs.
      weak: Applies one approach by default regardless of the work.
    followups:
      - What would have made you choose the other approach?
      - Which parts of the other approach did you borrow?
    common_errors:
      - Treating the framework as the goal rather than a tool for the work.

  - external_key: managerial.process_agile.inherited_team_process
    competency_key: leadership
    topic: Approaching an inherited team's process
    difficulty: medium
    text: >-
      When you take over an existing team, how do you decide which parts of their current process to keep and
      which to change? Tell me what you did the last time.
    expected_concepts:
      - observing before changing anything
      - asking the team what works and what frustrates them
      - looking at delivery data where it exists
      - keeping what works even if it differs from their own preference
      - sequencing a small number of changes
    rubric:
      excellent: Describes a real handover where they observed and listened first, used evidence to decide, kept practices that worked, and introduced a few changes in sequence with clear reasons.
      good: Describes a sensible approach with a real example, but changes were less clearly justified.
      weak: Immediately replaced the process with their preferred one.
    followups:
      - What did you keep that you would not have chosen yourself?
      - What was the first change, and why that one?
    common_errors:
      - Importing the process from their previous team without checking fit.

  # ------------------------------------------------------------ metrics, goals and pressure
  - external_key: managerial.process_agile.velocity_as_performance
    competency_key: stakeholder_management
    topic: Pushing back on velocity as a performance measure
    difficulty: hard
    text: >-
      Tell me about a time someone above you wanted to use velocity or story points to compare teams or judge
      performance. How did you respond, and what did you offer instead?
    expected_concepts:
      - why points are team-relative and easily inflated
      - understanding what the leader actually needed to know
      - proposing outcome or flow measures instead
      - framing the conversation around their goal rather than refusing
      - the result of the discussion
    rubric:
      excellent: Explains clearly why the measure would be misleading, identifies the leader's underlying need, offers a credible alternative and describes how the conversation ended and what was used afterwards.
      good: Pushes back with sound reasons and some alternative, with a partial outcome.
      weak: Complies without question or refuses without offering anything useful.
    followups:
      - What was the leader really trying to find out?
      - How did the alternative measure land?
    common_errors:
      - Arguing on principle without addressing the stakeholder's real question.

  - external_key: managerial.process_agile.flow_metrics_decision
    competency_key: agile_delivery
    topic: Using flow measures to make decisions
    difficulty: medium
    text: >-
      Which flow measures, such as cycle time, throughput or work in progress, have you actually used with a
      team? Tell me about one decision they helped you make.
    expected_concepts:
      - which measures were tracked and how
      - reading trends rather than single values
      - linking a pattern in the data to a specific cause
      - the decision taken and its result
      - avoiding use of the measures to judge individuals
    rubric:
      excellent: Names the measures used, explains how the team read them, and walks through a specific decision driven by the data with the result that followed.
      good: Uses real flow measures and gives an example decision, but the link between data and action is loose.
      weak: Names metrics without having used them, or uses them only for reporting upward.
    followups:
      - What did the data show that you wouldn't have noticed otherwise?
      - How did the team react to seeing the numbers?
    common_errors:
      - Reporting averages that hide long-tail items stuck for weeks.

  - external_key: managerial.process_agile.meaningful_sprint_goal
    competency_key: agile_delivery
    topic: Writing a meaningful sprint goal
    difficulty: easy
    text: >-
      How do you help a team write a sprint goal that means something beyond the list of tickets? Give me an
      example of a good one from your experience.
    expected_concepts:
      - goal tied to a user or business outcome
      - small enough to be achieved within the iteration
      - used to make trade-offs when scope changes
      - agreed with the product owner and team together
    rubric:
      excellent: Gives a specific, outcome-focused sprint goal and explains how the team created it and used it to make decisions during the sprint.
      good: Gives a reasonable example goal, with limited evidence it guided decisions.
      weak: Describes the goal as finishing all the tickets.
    followups:
      - Tell me about a time the goal helped the team decide what to drop.
      - What makes a sprint goal too vague?
    common_errors:
      - Writing goals that simply restate the backlog items.

  - external_key: managerial.process_agile.mid_sprint_urgent_request
    competency_key: stakeholder_management
    topic: Handling an urgent mid-sprint request
    difficulty: medium
    text: >-
      A senior stakeholder asks your team to drop everything partway through a sprint to handle an urgent
      request. Tell me about a time this happened and how you handled both the request and the sprint.
    expected_concepts:
      - understanding the real urgency and impact
      - making the trade-off explicit, including what will slip
      - involving the product owner in the decision
      - communicating the change to affected stakeholders
      - reviewing afterwards whether such requests can be anticipated
    rubric:
      excellent: Describes a real case where they clarified the urgency, made the cost visible, agreed a trade-off with the right people, communicated clearly and later addressed the pattern behind such requests.
      good: Handles the request sensibly with some explicit trade-off, but no attention to the underlying pattern.
      weak: Absorbs the work silently and lets the sprint fail, or refuses without exploring the need.
    followups:
      - What did you drop to make room?
      - How often did requests like this come up, and did you change anything?
    common_errors:
      - Accepting the request without stating what will not be delivered.

  - external_key: managerial.process_agile.scaled_framework_adoption
    competency_key: agile_delivery
    topic: Evaluating a heavyweight scaled agile framework
    difficulty: hard
    text: >-
      Suppose your organisation is considering a heavyweight scaled agile framework for all engineering teams.
      Drawing on your experience, how would you assess whether it's the right move, and what would you push for?
    expected_concepts:
      - identifying the specific problems the framework is meant to solve
      - cost in roles, ceremonies and planning overhead
      - lighter alternatives for cross-team coordination
      - piloting with a subset of teams and measuring results
      - evidence from past experience of what helped or hurt
    rubric:
      excellent: Starts from the problems the organisation actually has, weighs the framework's overhead against lighter options, proposes a measured pilot and draws on concrete past experience of scaled coordination.
      good: Gives a balanced view with some reference to experience, but no clear way of evaluating the decision.
      weak: Endorses or rejects the framework wholesale without connecting it to the organisation's problems.
    followups:
      - Which part of such a framework would you keep if you adopted only one?
      - How would you measure whether the pilot worked?
    common_errors:
      - Arguing about the framework in the abstract rather than the organisation's real coordination problems.

  - external_key: managerial.process_agile.regulated_iterative_delivery
    competency_key: project_management
    topic: Iterative delivery under compliance controls
    difficulty: hard
    text: >-
      Tell me about working iteratively in an environment with strict compliance or audit requirements. How did
      you keep delivery incremental while still satisfying those controls?
    expected_concepts:
      - understanding the intent of each control
      - building evidence into the normal workflow rather than a separate phase
      - automating traceability such as linked reviews and approvals
      - working with compliance partners early
      - keeping release increments small within the rules
    rubric:
      excellent: Gives a specific environment, explains how controls were built into the everyday workflow with automated evidence, and shows that delivery stayed incremental with compliance partners satisfied.
      good: Describes a real regulated context and reasonable accommodations, but evidence handling was mostly manual.
      weak: Treats compliance as a reason to abandon iterative delivery, or ignores the controls.
    followups:
      - Which control was hardest to fit into short iterations, and what did you do?
      - How did you build trust with the compliance team?
    common_errors:
      - Adding a large approval phase at the end that undoes the benefit of iterating.
