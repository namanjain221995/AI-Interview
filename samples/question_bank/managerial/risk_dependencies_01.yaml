# Managerial round: project risks, cross-team dependencies, escalations and unblocking (part 1 of 4).
# Focus: finding, tracking, responding to and communicating project risk.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ finding risks
  - external_key: managerial.risk_dependencies.kickoff_risk_discovery
    competency_key: project_management
    topic: Finding risks at project kickoff
    difficulty: easy
    text: >-
      When you start a new project, how do you go about finding the things most likely to go wrong? Walk me
      through what you did on the last project you kicked off.
    expected_concepts:
      - involving the team and partner teams rather than working alone
      - looking at unknowns, dependencies, new technology and people constraints
      - drawing on past projects or retrospectives for patterns
      - writing the risks down with a rough likelihood and impact
      - turning the biggest risks into early actions in the plan
    rubric:
      excellent: Describes a concrete kickoff where risks were gathered from several sources, written down with likelihood and impact, and the top ones shaped the early plan.
      good: Gives a real example of identifying risks with the team, but the link to changes in the plan is thin.
      weak: Relies on instinct or says risks are handled as they come up, with no example of looking ahead.
    followups:
      - Which risk from that list turned out to matter most?
      - Who outside your team did you ask, and why them?
    common_errors:
      - Listing generic risks such as "people might be sick" instead of risks specific to the project.

  - external_key: managerial.risk_dependencies.keeping_risk_list_current
    competency_key: project_management
    topic: Keeping a risk list alive
    difficulty: easy
    text: >-
      Once you have a list of project risks, how do you keep it useful instead of letting it go stale after the
      first week? Tell me how you did that on a recent project.
    expected_concepts:
      - a regular review rhythm tied to an existing meeting
      - named owners who update their risks
      - adding new risks and closing retired ones
      - visible status that partners and stakeholders can see
      - connecting risk changes to plan changes
    rubric:
      excellent: Explains a specific routine with owners and a review cadence, shows how risks were added and retired over time, and how changes fed into the plan or stakeholder updates.
      good: Has a regular review with a real example, but ownership or the link to decisions is loose.
      weak: Creates a list once at the start and never mentions revisiting it.
    followups:
      - What made people actually update it?
      - Tell me about a risk you closed. How did you decide it was retired?
    common_errors:
      - Treating the risk register as a document to produce rather than a tool to steer with.

  - external_key: managerial.risk_dependencies.team_raises_risks
    competency_key: leadership
    topic: Getting the team to surface risks
    difficulty: easy
    text: >-
      How do you get engineers on your team to raise risks they're worried about, rather than keeping quiet until
      something slips? Give me an example of what you did.
    expected_concepts:
      - asking directly and regularly in planning and stand-ups
      - responding to raised risks with action, not blame
      - making it easy, for example a shared list or a standing agenda item
      - recognising people who flagged problems early
      - following up visibly so people see their input mattered
    rubric:
      excellent: Gives a specific practice they introduced, an example of a risk raised because of it, and shows how their response encouraged further early warnings.
      good: Describes asking for risks and reacting constructively, with a modest example.
      weak: Expects people to speak up on their own, or describes reacting to slips only after they happen.
    followups:
      - Tell me about a time someone raised a risk that turned out to be wrong. How did you respond?
      - What did you notice about who spoke up and who didn't?
    common_errors:
      - Saying the team is "open" without describing any concrete practice.

  - external_key: managerial.risk_dependencies.risks_in_status_updates
    competency_key: communication
    topic: Presenting risks in status updates
    difficulty: easy
    text: >-
      In your regular project updates, how do you present risks so readers understand what could happen and
      what you need from them? Describe an update you actually sent.
    expected_concepts:
      - stating the risk in plain language with its impact on dates or scope
      - likelihood or trend, not just a label
      - the mitigation already under way
      - a clear ask or decision needed from the reader
      - consistent format so changes stand out
    rubric:
      excellent: Describes a real update that stated impact, trend, mitigation and a specific ask, and explains how readers used it.
      good: Includes risks with impact and mitigation, but the ask or the trend is missing.
      weak: Uses colour codes or vague phrases like "some risk to timeline" without detail or asks.
    followups:
      - How did you decide what was worth including and what wasn't?
      - What did a reader do differently because of that update?
    common_errors:
      - Hiding the important risk in the middle of a long update.

  - external_key: managerial.risk_dependencies.risk_ownership_meaning
    competency_key: project_management
    topic: Assigning risk owners
    difficulty: easy
    text: >-
      How do you decide who owns each risk on a project, and what does owning a risk actually mean on your
      teams?
    expected_concepts:
      - owner chosen by who can act on or monitor the risk
      - clear duties such as watching triggers and driving mitigation
      - owner reports changes rather than waiting to be asked
      - risks outside the team owned by a named person there
      - lead still accountable for the overall picture
    rubric:
      excellent: Explains a clear rule for picking owners, spells out what an owner does day to day, and gives an example where ownership made a difference.
      good: Assigns owners sensibly and describes some duties, with limited example.
      weak: Owns every risk personally, or assigns names without any defined responsibility.
    followups:
      - What happens when the right owner sits in another team?
      - Tell me about an owner who didn't follow through. What did you do?
    common_errors:
      - Assigning risks to whoever happens to be in the meeting.

  - external_key: managerial.risk_dependencies.small_risk_caught_early
    competency_key: project_management
    topic: A risk handled before it grew
    difficulty: easy
    text: >-
      Tell me about a small risk you caught early on a project and dealt with before it became a real problem.
      What tipped you off?
    expected_concepts:
      - the specific early signal they noticed
      - why it could have grown into a larger problem
      - the action taken and who was involved
      - the outcome compared with what might have happened
      - any habit or check that came out of it
    rubric:
      excellent: Names a concrete early signal, explains the potential impact, describes their own timely action and the result, and draws a lesson they still apply.
      good: Real example with a clear action and result, though the signal or the lesson is general.
      weak: Example is vague or the risk was only handled after it caused damage.
    followups:
      - How would it have played out if you'd waited another two weeks?
      - Is there a check you now do routinely because of it?
    common_errors:
      - Describing a problem that had already happened rather than a risk caught early.

  # ------------------------------------------------------------ responding to risks
  - external_key: managerial.risk_dependencies.premortem_exercise
    competency_key: project_management
    topic: Running a pre-mortem
    difficulty: medium
    text: >-
      Tell me about a time you ran a pre-mortem or a similar exercise where the team imagined the project had
      already failed. How did you run it, and what changed in the plan as a result?
    expected_concepts:
      - setting up the exercise so people could speak freely
      - collecting failure causes independently before discussing
      - grouping and ranking the causes
      - turning the top causes into concrete plan changes or owners
      - checking later whether the predicted problems appeared
    rubric:
      excellent: Describes how they facilitated the session, the specific failure causes found and at least one concrete change to the plan, with reflection on whether it paid off.
      good: Ran a credible exercise with some resulting actions, but little follow-up on whether it helped.
      weak: Describes a general risk discussion with no change to the plan, or only explains the concept.
    followups:
      - Which predicted failure came closest to actually happening?
      - How did you stop the most senior voice from dominating?
    common_errors:
      - Explaining what a pre-mortem is instead of describing one they ran.

  - external_key: managerial.risk_dependencies.choosing_risk_response
    competency_key: project_management
    topic: Choosing how to respond to a risk
    difficulty: medium
    text: >-
      For any risk you can try to avoid it, reduce it, hand it to someone better placed, or simply accept it.
      Tell me about a real risk where you deliberately chose one of those responses over the others, and why.
    expected_concepts:
      - clear statement of the risk and its stakes
      - the options considered and their cost
      - reasoning for the chosen response
      - who agreed to the choice
      - what happened and whether the choice held up
    rubric:
      excellent: Walks through a real risk, compares the options with their costs, justifies the choice with clear reasoning and reflects on the outcome.
      good: Explains a sensible choice for a real risk but compares alternatives only briefly.
      weak: Names a response without reasoning, or describes mitigating everything by default.
    followups:
      - What would have made you choose differently?
      - How did you explain the choice to stakeholders?
    common_errors:
      - Treating every risk as something that must be reduced regardless of cost.

  - external_key: managerial.risk_dependencies.accepting_known_risk
    competency_key: stakeholder_management
    topic: Shipping with an accepted risk
    difficulty: medium
    text: >-
      Tell me about a time you and your stakeholders decided to accept a known risk and ship anyway. How did you
      make sure everyone understood what they were accepting?
    expected_concepts:
      - describing the risk and its possible impact in concrete terms
      - the decision maker named and the decision recorded
      - mitigation or monitoring put in place after shipping
      - a plan for what to do if the risk materialised
      - revisiting the decision later
    rubric:
      excellent: Shows the risk was spelled out in business terms, the decision maker and record were explicit, monitoring and a response plan existed, and they revisited it afterwards.
      good: Clear example of an agreed risk with some documentation, but monitoring or follow-up is thin.
      weak: Shipped with a risk that was not clearly communicated or agreed, or cannot give an example.
    followups:
      - Where was that decision written down?
      - Did the risk ever materialise, and what happened then?
    common_errors:
      - Confusing a decision made quietly within the team with stakeholders knowingly accepting the risk.

  - external_key: managerial.risk_dependencies.contingency_plan_used
    competency_key: project_management
    topic: Using a prepared contingency plan
    difficulty: medium
    text: >-
      Describe a time a contingency plan you'd prepared actually had to be used. What did the plan look like,
      and how well did it hold up when you needed it?
    expected_concepts:
      - the risk the plan was designed for
      - what the plan contained, such as fallback scope, people or a rollback
      - the trigger that put it into action
      - how well it worked in practice
      - changes made to planning afterwards
    rubric:
      excellent: Describes a specific prepared plan, the trigger that activated it, a candid assessment of what worked and what didn't, and how later plans improved.
      good: Real contingency used with a reasonable outcome, but limited reflection.
      weak: Describes improvising after a problem rather than a plan prepared in advance.
    followups:
      - What part of the plan turned out to be missing?
      - How much did preparing it cost the team up front?
    common_errors:
      - Calling an after-the-fact scramble a contingency plan.

  - external_key: managerial.risk_dependencies.agreeing_risk_triggers
    competency_key: project_management
    topic: Setting triggers for risk action
    difficulty: medium
    text: >-
      How do you decide in advance the point at which a risk has become a problem that needs action, so the team
      isn't debating it after the fact? Give me an example.
    expected_concepts:
      - measurable trigger such as a date, metric or missed milestone
      - the action agreed for when the trigger is hit
      - who watches the trigger and who decides
      - agreement with stakeholders before the trigger is reached
      - an example where the trigger was hit and the plan followed
    rubric:
      excellent: Gives a concrete trigger tied to a measurable signal, the pre-agreed action and decision maker, and an example of it being used.
      good: Describes reasonable triggers with an example, but the agreed action or the owner is vague.
      weak: Decides case by case when things already look bad, with no advance agreement.
    followups:
      - What did you do when people wanted to move the trigger once it was close?
      - How did you pick that particular threshold?
    common_errors:
      - Using triggers that are too vague to tell whether they've been crossed.

  - external_key: managerial.risk_dependencies.defending_schedule_buffer
    competency_key: stakeholder_management
    topic: Planning and defending buffer
    difficulty: medium
    text: >-
      How do you build slack into a project plan for things you can't foresee, and how do you defend that buffer
      when stakeholders want the date pulled in?
    expected_concepts:
      - sizing buffer from past variance or the level of uncertainty
      - keeping buffer visible rather than hidden in every estimate
      - explaining what the buffer protects against
      - tracking how the buffer is being used
      - trading scope rather than buffer when pressed
    rubric:
      excellent: Explains a reasoned method for sizing buffer, keeps it visible, and gives an example of defending or trading it with stakeholders using evidence.
      good: Adds buffer sensibly and can justify it, with a light example of pushback.
      weak: Pads every estimate quietly, or gives up the buffer as soon as anyone asks.
    followups:
      - How much of that buffer did you actually use?
      - What did you offer instead when they insisted on an earlier date?
    common_errors:
      - Hiding padding inside individual estimates so nobody can see or manage it.

  - external_key: managerial.risk_dependencies.uncertain_date_communication
    competency_key: communication
    topic: Communicating uncertainty in dates
    difficulty: medium
    text: >-
      When a stakeholder asks for a delivery date on work with real unknowns, how do you express the uncertainty
      without sounding evasive? Tell me about a time you did this.
    expected_concepts:
      - giving a range or a target with stated assumptions
      - naming the unknowns that drive the range
      - committing to when the range will narrow
      - offering a firmer date for a smaller scope
      - updating promptly as unknowns resolve
    rubric:
      excellent: Gives a real example of a range with explicit assumptions, a plan for narrowing it and a firmer option, and shows how stakeholders used it.
      good: Communicated a range with some reasoning, but did not explain how or when it would firm up.
      weak: Gave a single date with no caveats, or refused to estimate at all.
    followups:
      - How did the stakeholder react to a range instead of a date?
      - How close was the final delivery to what you said?
    common_errors:
      - Giving a range so wide it is useless for the stakeholder's planning.

  - external_key: managerial.risk_dependencies.spike_before_commitment
    competency_key: project_management
    topic: Paying to retire an unknown early
    difficulty: medium
    text: >-
      Tell me about a time you spent effort up front, for example a spike or prototype, to retire a technical
      unknown before committing to a plan. How did you decide it was worth the time?
    expected_concepts:
      - the specific unknown and why it threatened the plan
      - a time-boxed investigation with a clear question
      - weighing the cost of the spike against the risk
      - what was learned and how the plan changed
      - communicating the delay or cost to stakeholders
    rubric:
      excellent: Names the unknown, explains the time box and the question it answered, and shows how the result changed the plan or commitment.
      good: Credible spike with a useful result, but the cost and benefit reasoning is thin.
      weak: Describes exploratory work with no clear question or no effect on the plan.
    followups:
      - What would you have done if the spike had been inconclusive?
      - How did you keep it from growing into the real implementation?
    common_errors:
      - Letting the spike run without a time box or a defined question.

  - external_key: managerial.risk_dependencies.multi_team_risk_review
    competency_key: project_management
    topic: Running a cross-team risk review
    difficulty: medium
    text: >-
      On a project involving several teams, how have you run a regular risk review so it's useful rather than a
      box-ticking meeting? What did the meeting actually look like?
    expected_concepts:
      - right attendees, usually one owner per team
      - short agenda focused on changes and new risks
      - decisions and actions recorded with owners
      - escalating items that need help beyond the room
      - adjusting or dropping the meeting when it stopped helping
    rubric:
      excellent: Describes the actual format, who attended, how it focused on change and decisions, and a concrete action that came out of it.
      good: Ran a regular review with real outcomes, but the format is loosely described.
      weak: Describes a status meeting where risks were read out with no decisions.
    followups:
      - What did you cut from the meeting over time?
      - Tell me about a decision that came out of one of those reviews.
    common_errors:
      - Reviewing every risk every week regardless of whether anything changed.

  - external_key: managerial.risk_dependencies.unwritten_inherited_risks
    competency_key: project_management
    topic: Uncovering risks on an inherited project
    difficulty: medium
    text: >-
      When you take over a project partway through, how do you work out which risks the previous lead knew about
      but never wrote down?
    expected_concepts:
      - talking with the previous lead and key engineers
      - asking partner teams and stakeholders what worries them
      - reading recent decisions, incidents and commitments
      - comparing the plan with actual progress for hidden gaps
      - writing up and sharing the refreshed risk picture
    rubric:
      excellent: Lays out a concrete set of conversations and sources, gives an example of an unwritten risk they uncovered, and shows how they shared the refreshed picture.
      good: Describes sensible conversations and reviews, with a limited example.
      weak: Trusts the existing documentation or waits for problems to appear.
    followups:
      - What question gave you the most useful answer?
      - How did you share what you found without undermining the previous lead?
    common_errors:
      - Assuming the existing plan and status reports reflect reality.

  - external_key: managerial.risk_dependencies.missed_risk_lessons
    competency_key: project_management
    topic: Learning from a missed risk
    difficulty: medium
    text: >-
      Tell me about a risk you didn't see coming that ended up hurting a project. Looking back, what signals
      were there, and what did you change in how you plan?
    expected_concepts:
      - plain description of the risk and its impact
      - signals that existed but were missed
      - why they were missed
      - concrete change to planning or monitoring
      - evidence the change helped later
    rubric:
      excellent: Owns the miss, identifies the specific signals and why they were overlooked, and describes a concrete change with evidence it has helped since.
      good: Real example with a reasonable lesson, though the change is general.
      weak: Blames the risk on bad luck or others, or the lesson is only "plan better".
    followups:
      - Who else could have spotted it?
      - Where has the change you made paid off since?
    common_errors:
      - Choosing an example where nothing could reasonably have been foreseen, which avoids the lesson.

  - external_key: managerial.risk_dependencies.telling_leader_goal_at_risk
    competency_key: stakeholder_management
    topic: Telling a leader their project is at risk
    difficulty: medium
    text: >-
      Tell me about a time you had to tell a senior leader that a project they cared about was at real risk of
      missing its goal. How did you prepare for that conversation, and how did it go?
    expected_concepts:
      - raising it early rather than near the deadline
      - facts on the cause and size of the gap
      - options with their trade-offs
      - a recommendation and a specific ask
      - follow-up on the decision
    rubric:
      excellent: Describes raising the risk early with clear evidence, presenting options and a recommendation, and what was decided and done afterwards.
      good: Delivered the message with facts and some options, but without a clear recommendation or follow-through.
      weak: Waited until the slip was certain, or delivered the news without options.
    followups:
      - What did you leave out, and why?
      - What would you do differently in that conversation now?
    common_errors:
      - Softening the message so much that the leader didn't grasp the risk.

  - external_key: managerial.risk_dependencies.go_no_go_decision
    competency_key: project_management
    topic: Go or no-go before launch
    difficulty: medium
    text: >-
      Before a significant launch, how do you decide whether the team is actually ready to go? Walk me through a
      go or no-go decision you were part of.
    expected_concepts:
      - readiness criteria agreed before the decision meeting
      - input from engineering, support, operations and other affected groups
      - open risks reviewed with their mitigations
      - rollback or fallback ready
      - clear decision owner and recorded outcome
    rubric:
      excellent: Describes pre-agreed criteria, who gave input, how open risks were weighed, the decision owner and the result, including what they'd change.
      good: Real decision with sensible checks, but criteria were set loosely or late.
      weak: Launch happened because the date arrived, with no structured check.
    followups:
      - Was there a time the answer was no-go? What happened next?
      - Which readiness check turned out to matter most?
    common_errors:
      - Making the go decision on gut feel in the meeting instead of against agreed criteria.

  - external_key: managerial.risk_dependencies.cutover_rollback_authority
    competency_key: project_management
    topic: Planning a risky cutover
    difficulty: medium
    text: >-
      Tell me about a risky cutover or migration you planned. How did you decide what would make you roll back,
      and who had the authority to call it?
    expected_concepts:
      - step-by-step runbook with checkpoints
      - measurable rollback criteria agreed beforehand
      - a single named person with authority to call rollback
      - rehearsal or dry run
      - communication plan to stakeholders during the cutover
    rubric:
      excellent: Describes a rehearsed runbook, explicit rollback criteria and authority agreed in advance, and how the cutover actually went.
      good: Planned the cutover with rollback in mind, but criteria or authority were loosely set.
      weak: Had no clear rollback point or decided on the night by discussion.
    followups:
      - How close did you come to rolling back?
      - What did the rehearsal catch?
    common_errors:
      - Assuming rollback is possible without ever testing it.

  # ------------------------------------------------------------ harder risk judgement
  - external_key: managerial.risk_dependencies.engineers_disagree_on_risk
    competency_key: leadership
    topic: Resolving disagreement about a risk
    difficulty: hard
    text: >-
      Two senior engineers on your team disagree sharply about how serious a risk is. One wants to pause the
      project, the other thinks it's overblown. How would you get to a decision? Tell me about a time something
      like this happened.
    expected_concepts:
      - understanding each position and the evidence behind it
      - finding a cheap way to gather more evidence
      - separating reversible from irreversible consequences
      - making or escalating a decision with clear reasoning
      - keeping both engineers committed after the decision
    rubric:
      excellent: Shows how they drew out the evidence on both sides, reduced uncertainty cheaply where possible, made a reasoned call or escalated it, and kept both engineers engaged afterwards.
      good: Reaches a sensible decision after hearing both sides, but with little effort to gather new evidence or maintain commitment.
      weak: Picks the more senior or louder view, or avoids deciding.
    followups:
      - How did the engineer whose view lost react, and what did you do?
      - How did you later judge whether the call was right?
    common_errors:
      - Splitting the difference in a way that satisfies neither concern.

  - external_key: managerial.risk_dependencies.green_status_hiding_trouble
    competency_key: project_management
    topic: Green status masking real trouble
    difficulty: hard
    text: >-
      Tell me about a time a project reported green for weeks and then turned out to be in serious trouble. How
      did you find out, and what did you change about how status is reported?
    expected_concepts:
      - what made the status misleading, such as subjective ratings or fear of reporting red
      - the signal that revealed the real state
      - immediate recovery steps
      - changing status to rely on evidence such as milestones or demos
      - making it safe and expected to report problems early
    rubric:
      excellent: Diagnoses why status was misleading, describes recovery, and introduces evidence-based reporting plus changes that made early bad news acceptable.
      good: Clear example and recovery, with some reporting change.
      weak: Blames the people reporting without changing the system, or has no example.
    followups:
      - What did you do to make reporting red feel normal?
      - Which evidence do you now ask for instead of a colour?
    common_errors:
      - Fixing the one project but leaving the status process unchanged.

  - external_key: managerial.risk_dependencies.attention_across_projects
    competency_key: leadership
    topic: Spreading attention across risky projects
    difficulty: hard
    text: >-
      If you're responsible for several projects at once and can't de-risk all of them, how do you decide where
      to spend your own attention and your best people? Give me an example of a call you made.
    expected_concepts:
      - comparing projects by business impact and risk exposure
      - looking at reversibility and timing of each risk
      - deliberately accepting more risk on some projects
      - telling stakeholders of lower-priority projects about that choice
      - revisiting the allocation as the picture changes
    rubric:
      excellent: Explains a clear comparison across projects, a deliberate allocation including which risks they left uncovered, how they told the affected stakeholders, and the outcome.
      good: Makes a sensible prioritisation with an example, but doesn't address communicating the trade-off.
      weak: Tries to cover everything equally or follows whoever shouts loudest.
    followups:
      - What did you leave less covered, and did it bite you?
      - How did you tell the people whose project got less attention?
    common_errors:
      - Spreading people thin across every project so none is properly protected.

  - external_key: managerial.risk_dependencies.risk_appetite_gap
    competency_key: stakeholder_management
    topic: Mismatch in risk appetite
    difficulty: hard
    text: >-
      Tell me about a time your appetite for risk on a project was very different from your stakeholders'. Either
      they wanted to move faster than felt safe, or slower than was necessary. How did you close that gap?
    expected_concepts:
      - understanding what was driving the stakeholders' position
      - making the risk concrete with likely outcomes and costs
      - finding options that changed the trade-off, such as staged rollout
      - agreeing who owned the final decision
      - outcome and what they learned about their own judgement
    rubric:
      excellent: Understands the stakeholders' drivers, makes the risk concrete, proposes options that change the trade-off, clarifies decision ownership and reflects on whose judgement was right.
      good: Closes the gap with reasoning and an option or two, with less reflection.
      weak: Either gave in without discussion or overrode stakeholders without agreement.
    followups:
      - Looking back, whose instinct was closer to right?
      - What option changed the conversation most?
    common_errors:
      - Framing the disagreement as stakeholders simply not understanding engineering.

  - external_key: managerial.risk_dependencies.late_compliance_blocker
    competency_key: project_management
    topic: A late compliance blocker
    difficulty: hard
    text: >-
      Late in a project you discover that a legal or compliance requirement nobody had considered could block
      the launch. How would you handle the next few days? If you've been in a similar position, tell me about it.
    expected_concepts:
      - confirming the requirement and its real scope with the right experts
      - telling stakeholders quickly with what is known and unknown
      - options such as reduced scope, phased launch or a short delay
      - assigning owners for the investigation and the fix
      - adding a compliance check to future planning
    rubric:
      excellent: Lays out a fast, structured response that verifies the requirement, communicates early, develops options with owners and fixes the planning gap that let it slip through.
      good: Sensible response that verifies and communicates, but with fewer options or no prevention.
      weak: Tries to launch anyway and deal with it later, or freezes everything without a plan.
    followups:
      - Who would you call first, and why?
      - How would you stop this kind of requirement being missed next time?
    common_errors:
      - Treating the compliance team as an obstacle rather than a partner in finding options.
