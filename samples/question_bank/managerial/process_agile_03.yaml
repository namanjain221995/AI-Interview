# Managerial round: agile practices and team process (part 3 of 4).
# Focus: coaching teams to own their process, distributed teams, introducing and scaling agile ways
# of working, and continuous improvement.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ facilitation and coaching
  - external_key: managerial.process_agile.shared_facilitation
    competency_key: mentoring
    topic: Sharing facilitation across the team
    difficulty: easy
    text: >-
      Tell me about how you've shared the facilitation of team sessions like retrospectives or planning among
      team members. What did you do to help people get good at it?
    expected_concepts:
      - rotating the facilitator role
      - preparing with first-time facilitators beforehand
      - giving simple guides or formats to start from
      - feedback after the session
    rubric:
      excellent: Describes a concrete rotation, how they prepared and supported new facilitators, and how the quality of sessions held up or improved as others took over.
      good: Describes a real rotation with some support, but little on how facilitation skills were built.
      weak: Always facilitates themselves, or rotated the role with no preparation or support.
    followups:
      - What did a first-time facilitator struggle with most?
      - What changed in the sessions once others ran them?
    common_errors:
      - Handing over facilitation without any preparation and then taking it back after one bad session.

  - external_key: managerial.process_agile.coaching_new_facilitator
    competency_key: mentoring
    topic: Coaching someone new to running agile ceremonies
    difficulty: medium
    text: >-
      Tell me about a time you coached someone who was new to running agile ceremonies, such as a new scrum
      master or a first-time tech lead. What did you focus on, and how did they progress?
    expected_concepts:
      - assessing their starting point
      - focusing on purpose of each ceremony rather than mechanics
      - observing sessions and giving specific feedback
      - gradually handing over harder situations
      - evidence of their growth
    rubric:
      excellent: Describes a specific person, a deliberate coaching plan grounded in purpose rather than ritual, concrete feedback given and observable progress in how they ran sessions.
      good: Describes real coaching with useful feedback, but progress is described only in general terms.
      weak: Gives them a template and leaves them to it, or describes coaching in the abstract.
    followups:
      - What was the hardest situation you prepared them for?
      - How did you know they were ready to run things alone?
    common_errors:
      - Teaching the steps of each ceremony without explaining what problem it solves.

  - external_key: managerial.process_agile.stepping_back_for_ownership
    competency_key: leadership
    topic: Stepping back so the team owns its process
    difficulty: hard
    text: >-
      Tell me about a time you deliberately stepped back so a team would take ownership of its own process. What
      did you hand over, what went wrong along the way, and how did you decide when to step back in?
    expected_concepts:
      - explicit handover of specific decisions to the team
      - clear boundaries on what remained the leader's call
      - tolerating some short-term mistakes
      - criteria for stepping back in
      - long-term change in how the team improved its own process
    rubric:
      excellent: Describes specific decisions handed over with clear boundaries, gives a real setback and how they resisted or chose to intervene, and shows the team improving its process independently afterwards.
      good: Describes a genuine handover with some setbacks, but the criteria for intervening were unclear.
      weak: Claims the team self-organised with no description of what changed, or stepped back with no support.
    followups:
      - What did you find hardest to let go of?
      - What did the team decide that you would have done differently?
    common_errors:
      - Saying the team is self-organising while still making every process decision.

  - external_key: managerial.process_agile.delivery_lead_role_value
    competency_key: agile_delivery
    topic: When a dedicated delivery role adds value
    difficulty: medium
    text: >-
      Some organisations question whether teams need a dedicated scrum master or delivery lead. Based on your
      experience, when does that role add the most value, and when have you seen teams manage well without one?
    expected_concepts:
      - contexts where the role helps, such as new teams or heavy cross-team coordination
      - contexts where facilitation can be shared
      - risk of the role becoming an administrator
      - how responsibilities are covered without the role
      - real examples from both situations
    rubric:
      excellent: Gives contrasting real examples, ties the value of the role to specific team conditions, and explains how its responsibilities were covered when it was absent.
      good: Gives a balanced view with at least one real example.
      weak: Takes an absolute position either way without reference to context or experience.
    followups:
      - What did a good delivery lead do on a team you worked with that others couldn't?
      - Who picked up that work on the team without one?
    common_errors:
      - Equating the role with organising meetings and updating tickets.

  # ------------------------------------------------------------ introducing agile and resistance
  - external_key: managerial.process_agile.skeptical_team_adoption
    competency_key: leadership
    topic: Introducing iterative work to a skeptical group
    difficulty: hard
    text: >-
      Tell me about introducing iterative ways of working to a team or organisation that was skeptical of agile,
      perhaps because of a bad earlier experience. How did you earn their buy-in?
    expected_concepts:
      - understanding what went wrong before
      - starting from their real problems rather than a framework
      - avoiding jargon and heavy ceremony
      - small early wins that people could see
      - letting the team shape the practices
    rubric:
      excellent: Describes a specific skeptical group, how they learned the source of skepticism, a problem-first approach with small visible wins and how the group came to own the practices.
      good: Gives a real example with a sensible approach and some buy-in, but the reasons for skepticism were not explored.
      weak: Imposed a framework and attributed resistance to people being difficult.
    followups:
      - What was the first visible win?
      - Which agile terms did you stop using, and why?
    common_errors:
      - Rolling out a full framework at once instead of solving one felt problem.

  - external_key: managerial.process_agile.senior_engineer_skips_ceremonies
    competency_key: leadership
    topic: A strong engineer who skips ceremonies
    difficulty: medium
    text: >-
      A highly productive senior engineer on your team says the ceremonies are a waste of time and starts
      skipping them. Tell me how you've handled a situation like this.
    expected_concepts:
      - listening for valid criticism of the ceremonies
      - explaining what the team loses when they are absent
      - adjusting their involvement or the meetings where reasonable
      - holding a consistent expectation for the team
      - outcome for both the person and the process
    rubric:
      excellent: Treats the criticism as possible signal, improves the ceremonies where it was valid, sets a clear expectation about participation and describes how the situation resolved.
      good: Handles it sensibly in a real or detailed case, but either ignores the valid criticism or the expectation stays fuzzy.
      weak: Gives the person an exemption with no thought for the team, or insists on attendance without listening.
    followups:
      - Was any of their criticism right?
      - How did the rest of the team see the outcome?
    common_errors:
      - Creating a two-tier team where some people are excused from shared practices.

  # ------------------------------------------------------------ distributed teams
  - external_key: managerial.process_agile.remote_ceremonies
    competency_key: collaboration
    topic: Running ceremonies with a remote team
    difficulty: easy
    text: >-
      How do you run retrospectives or planning sessions well when the whole team is remote? Tell me what you've
      tried and what worked.
    expected_concepts:
      - shared online board or collaborative document
      - preparation and input gathered before the session
      - shorter sessions or breaks
      - structured turns so everyone contributes
      - clear written outcomes afterwards
    rubric:
      excellent: Describes specific tools and techniques used with a real remote team, what they changed after trying them and how they ensured outcomes were captured.
      good: Gives reasonable practical techniques from a real team, with less on what they learned.
      weak: Runs remote sessions exactly like in-person ones with no adaptation.
    followups:
      - What didn't work the first time?
      - How do you keep people engaged in a two-hour planning session online?
    common_errors:
      - Not writing down decisions, so remote attendees leave with different understandings.

  - external_key: managerial.process_agile.timezone_ceremony_design
    competency_key: collaboration
    topic: Deciding which ceremonies stay live across time zones
    difficulty: medium
    text: >-
      When a team spans several time zones, how do you decide which ceremonies stay live and which become
      asynchronous? Walk me through a team you've led.
    expected_concepts:
      - which sessions need real-time discussion
      - rotating meeting times so the burden is shared
      - written pre-work and recorded decisions
      - clear decision-making rules for asynchronous threads
      - checking with the team whether it works
    rubric:
      excellent: Describes a real distributed team, explains which sessions stayed live and why, how the inconvenience was shared fairly, and how asynchronous decisions were made and recorded.
      good: Describes a workable arrangement for a real team, but the reasoning about which sessions to keep live is thin.
      weak: Schedules everything at one site's convenience, or drops all live sessions without a plan.
    followups:
      - How did you make sure the same location wasn't always taking the late call?
      - What decision went badly asynchronously, and what did you change?
    common_errors:
      - Always scheduling around the headquarters time zone.

  # ------------------------------------------------------------ continuous improvement
  - external_key: managerial.process_agile.everyday_improvement_habit
    competency_key: agile_delivery
    topic: Building small continuous improvements into the week
    difficulty: medium
    text: >-
      Beyond the retrospective itself, how have you built a habit of small, continuous improvements into a
      team's normal week? Give me a concrete example.
    expected_concepts:
      - visible place for improvement ideas
      - small protected time or capacity for improvements
      - encouraging anyone to fix friction when they hit it
      - celebrating and sharing small improvements
      - examples of improvements made outside retrospectives
    rubric:
      excellent: Describes a concrete mechanism, gives several small improvements it produced and explains how it kept going without the leader driving it.
      good: Describes a real mechanism and at least one improvement, with uncertain sustainability.
      weak: Improvement only happens in retrospectives or when the leader pushes it.
    followups:
      - Which improvement had the biggest effect for the least effort?
      - How did you protect time for it during busy periods?
    common_errors:
      - Saving all improvement ideas for the retrospective, so small fixes wait two weeks.

  - external_key: managerial.process_agile.whole_process_review
    competency_key: agile_delivery
    topic: Periodically reviewing the whole way of working
    difficulty: medium
    text: >-
      How do you periodically check whether your team's process as a whole is still serving it, beyond
      individual retrospectives? Tell me what you did the last time you stepped back to review it.
    expected_concepts:
      - a longer-interval review of all practices together
      - input from the team and from partners such as product and stakeholders
      - delivery data across several months
      - deciding what to keep, change or drop
      - communicating the outcome
    rubric:
      excellent: Describes a specific broader review, the inputs used including data and partner feedback, the decisions made about each practice and what changed afterwards.
      good: Describes a real step-back review with sensible inputs, but outcomes were modest or unclear.
      weak: Never reviews the process as a whole, or reviews it alone without input.
    followups:
      - What did you drop as a result?
      - Who outside the team did you ask for input?
    common_errors:
      - Only reviewing individual problems and never questioning the overall approach.

  # ------------------------------------------------------------ growth and scaling
  - external_key: managerial.process_agile.process_for_fast_growth
    competency_key: leadership
    topic: Adapting process as a team grows quickly
    difficulty: hard
    text: >-
      Tell me about a time your team grew quickly, for example roughly doubling in size. Which parts of your
      process had to change, and how did you avoid adding more structure than you needed?
    expected_concepts:
      - which informal practices broke as the team grew
      - adding structure only where coordination actually failed
      - documentation of decisions and onboarding into the process
      - keeping ceremonies effective at a larger size
      - signals used to judge the process was keeping up
    rubric:
      excellent: Identifies specific practices that broke with growth, explains targeted changes tied to real failures, shows restraint about adding structure and describes how they judged the result.
      good: Describes real changes during growth, with some reasoning about why each was needed.
      weak: Added a standard set of processes pre-emptively, or let things break without adjusting.
    followups:
      - What was the first thing that broke?
      - What did you decide not to add, even though people asked for it?
    common_errors:
      - Copying a large company's process when a small change would have done.

  - external_key: managerial.process_agile.splitting_large_team
    competency_key: leadership
    topic: Splitting a team that has grown too large
    difficulty: hard
    text: >-
      When a team gets too large to run its ceremonies effectively, how have you approached splitting it? Tell me
      how you drew the lines and what happened to the shared process.
    expected_concepts:
      - splitting along product or ownership boundaries to reduce dependencies
      - involving the team in the design of the split
      - deciding which practices stay shared and which become per team
      - handling shared codebases and on-call
      - checking delivery and coordination after the split
    rubric:
      excellent: Explains the reasoning for the split boundaries, how the team was involved, what process stayed shared versus separate and what happened to coordination and delivery afterwards.
      good: Describes a real split with sensible boundaries, but the process implications were handled loosely.
      weak: Split by headcount or seniority without regard to ownership, or never split despite clear problems.
    followups:
      - What dependency between the new teams caused the most friction?
      - Which shared practice did you keep across both teams?
    common_errors:
      - Splitting so that every feature still needs both new teams to deliver.

  - external_key: managerial.process_agile.multi_team_alignment_light
    competency_key: project_management
    topic: Lightweight alignment across several teams
    difficulty: medium
    text: >-
      Tell me how you've coordinated several agile teams working on the same product. What lightweight
      mechanisms did you use to keep them aligned, and which ones did you drop?
    expected_concepts:
      - shared goals or outcomes across teams
      - a short regular cross-team sync
      - shared view of dependencies and integration points
      - joint reviews or demos
      - removing mechanisms that did not add value
    rubric:
      excellent: Describes specific coordination mechanisms, how each was justified, the ones dropped and why, and the effect on integration and delivery across teams.
      good: Describes reasonable mechanisms in a real setting, with less evidence on which ones mattered.
      weak: Relies on managers relaying information between teams, or adds layers of meetings without review.
    followups:
      - Which mechanism did you drop, and what told you it wasn't needed?
      - How did you find integration problems early?
    common_errors:
      - Adding a coordination meeting for every new problem and never removing any.

  - external_key: managerial.process_agile.iteration_case_for_executive
    competency_key: communication
    topic: Explaining iterative delivery to an executive
    difficulty: easy
    text: >-
      How have you explained to a non-technical executive why your team works in short iterations rather than
      delivering everything at the end? What did you say, and what did they most need to hear?
    expected_concepts:
      - framing in terms of business risk and earlier value
      - a concrete example from their own product
      - what visibility and control they gain
      - avoiding process jargon
    rubric:
      excellent: Gives a specific conversation, frames the case in business terms with a concrete example and explains what the executive cared about and how that shaped the message.
      good: Gives a clear explanation in business terms, though not tied to a specific conversation.
      weak: Explains using agile terminology or ceremonies rather than outcomes.
    followups:
      - What objection did they raise?
      - What did you show them after the first few iterations?
    common_errors:
      - Describing the process instead of what the business gets from it.

  - external_key: managerial.process_agile.client_expects_fixed_spec
    competency_key: stakeholder_management
    topic: Bringing a fixed-spec client into iterative delivery
    difficulty: hard
    text: >-
      Tell me about delivering iteratively for an external client or another department that expected a fixed
      specification signed off upfront. How did you bring them into the iterative process?
    expected_concepts:
      - understanding why they wanted a fixed specification
      - agreeing a high-level scope with room to change details
      - frequent demos with the client
      - a clear process for changes and their impact
      - building trust through early delivery
    rubric:
      excellent: Describes a real client relationship, addresses the reasons behind the request for a fixed specification, establishes an agreed way to handle change and shows how trust grew through regular delivery.
      good: Brings the client into some iterative practice with sensible arrangements, though change handling was informal.
      weak: Either delivered waterfall while calling it agile, or ignored the client's need for certainty.
    followups:
      - How did the contract or agreement deal with changing scope?
      - What happened at the first demo?
    common_errors:
      - Promising flexibility without any agreed way to handle its effect on cost or date.

  - external_key: managerial.process_agile.vendor_team_in_cadence
    competency_key: project_management
    topic: Integrating a vendor team into the delivery cadence
    difficulty: medium
    text: >-
      Tell me about working with an outsourced or vendor team as part of your delivery. How did you bring them
      into your planning and review cycles, and what did you change when it wasn't working?
    expected_concepts:
      - shared backlog or clear interfaces between backlogs
      - joint planning and review sessions
      - agreed definition of done for their work
      - contract or commercial constraints affecting flexibility
      - adjustments made when quality or timing slipped
    rubric:
      excellent: Describes concrete integration into planning and reviews, a shared quality bar, how contractual constraints were handled and a specific adjustment when it was not working.
      good: Describes a real arrangement with some integration, but adjustments were limited.
      weak: Treated the vendor as a black box until delivery, or blames them without describing their own actions.
    followups:
      - How did the contract affect your ability to change scope?
      - What did you do when their work didn't meet your definition of done?
    common_errors:
      - Only discovering quality problems at the end of the vendor's delivery.

  - external_key: managerial.process_agile.joining_the_way_we_work
    competency_key: mentoring
    topic: Helping a new joiner learn the team's process
    difficulty: easy
    text: >-
      When a new engineer joins, how do you help them understand how your team plans, tracks and reviews its
      work? Tell me about the most recent person.
    expected_concepts:
      - a short explanation of the team's practices and why they exist
      - pairing them with someone during their first ceremonies
      - giving them a small item to take through the full workflow
      - inviting their fresh view of the process
    rubric:
      excellent: Describes a specific person, the concrete steps used to introduce the team's way of working, and how they asked the newcomer for observations about the process.
      good: Describes a reasonable introduction for a real person, with limited follow-up.
      weak: Expects them to pick it up by attending meetings.
    followups:
      - What did they find confusing about your process?
      - Did any of their observations lead to a change?
    common_errors:
      - Missing the chance to learn from a newcomer's view of the process.

  - external_key: managerial.process_agile.proving_process_gains
    competency_key: agile_delivery
    topic: Showing that process improvements made a difference
    difficulty: hard
    text: >-
      How do you show that the process improvements your team made over a year actually made a difference, both
      to the team and to your own leadership? Tell me about the evidence you used.
    expected_concepts:
      - baseline captured before changes
      - flow and quality measures such as lead time and escaped defects
      - team feedback alongside the numbers
      - separating the effect of process from other changes
      - presenting the story to leadership in terms they care about
    rubric:
      excellent: Describes a baseline, specific before and after measures, team input, a careful view of what caused the change and how it was presented to leadership.
      good: Uses some real data and feedback to show improvement, but attribution is loose.
      weak: Relies on anecdote or a general sense that things got better.
    followups:
      - What else changed that year that could explain the improvement?
      - Which result did leadership care about most?
    common_errors:
      - Claiming credit for improvements without a baseline to compare against.

  - external_key: managerial.process_agile.metric_changed_behaviour
    competency_key: leadership
    topic: A team metric that backfired
    difficulty: medium
    text: >-
      Tell me about a time a team metric you introduced started to change behaviour in ways you didn't intend.
      How did you notice, and what did you change?
    expected_concepts:
      - the original purpose of the metric
      - signals that it was being optimised for its own sake
      - talking with the team about what was happening
      - changing, pairing or retiring the metric
      - lesson applied to later measures
    rubric:
      excellent: Gives a specific metric, describes the unintended behaviour and how it was spotted, explains the change made and what they now do differently when introducing measures.
      good: Gives a real example and a reasonable fix, with limited reflection.
      weak: Cannot give an example, or blames the team for gaming the number.
    followups:
      - What measure did you pair it with to balance it?
      - How do you introduce metrics now?
    common_errors:
      - Blaming people for responding to the incentive the metric created.

  - external_key: managerial.process_agile.recording_team_decisions
    competency_key: communication
    topic: Recording decisions about how the team works
    difficulty: easy
    text: >-
      How does your team record and share decisions about how it works, so that people who missed the meeting,
      or join later, understand why things are done the way they are?
    expected_concepts:
      - a single known place for decisions
      - short records with context and reasons
      - linking to the meeting or discussion where it was made
      - reviewing and retiring outdated decisions
    rubric:
      excellent: Describes a specific, lightweight decision log, what each entry contains and an example where it saved confusion or re-litigation.
      good: Describes a real practice with reasonable content, but it is maintained inconsistently.
      weak: Decisions live only in people's memories or in scattered chat messages.
    followups:
      - When did that record prevent a decision being reopened?
      - How do you remove decisions that no longer apply?
    common_errors:
      - Recording what was decided without why, so it gets questioned again later.

  - external_key: managerial.process_agile.consistency_versus_autonomy
    competency_key: leadership
    topic: Organisation-wide process versus team autonomy
    difficulty: hard
    text: >-
      Your organisation wants every team to follow the same delivery process, while your team has a way of
      working that suits its context. Tell me how you've handled that tension between consistency and team
      autonomy.
    expected_concepts:
      - understanding the organisation's reasons for consistency
      - distinguishing what must be common, like reporting or interfaces, from internal practice
      - evidence that the team's approach delivers
      - negotiating a reasonable agreement
      - complying where it genuinely mattered
    rubric:
      excellent: Describes a real case, separates the organisation's legitimate needs from internal practice, makes an evidence-based case and reaches a workable agreement that served both.
      good: Handles a real tension sensibly, but leans heavily toward either compliance or autonomy without much negotiation.
      weak: Ignores the organisational requirement, or gives up useful practices without discussion.
    followups:
      - What did you agree to standardise?
      - What evidence persuaded people to leave your team's approach alone?
    common_errors:
      - Treating every organisational standard as interference rather than asking what it is for.

  - external_key: managerial.process_agile.new_team_kickoff
    competency_key: leadership
    topic: Setting up a new team's way of working
    difficulty: easy
    text: >-
      When a new team forms or a big new project starts, how do you set up the team's initial way of working?
      Walk me through a kickoff you've run.
    expected_concepts:
      - shared understanding of goals and scope
      - agreeing roles and responsibilities
      - a minimal starting set of ceremonies and tools
      - an early review point to adjust the process
    rubric:
      excellent: Describes a specific kickoff, the goals and roles agreed, a deliberately minimal starting process and an early review where the team adjusted it.
      good: Describes a real kickoff with sensible elements, but no planned adjustment.
      weak: Applies a full standard process without discussion, or skips any explicit setup.
    followups:
      - What did you change after the first few weeks?
      - Which practice did you deliberately leave out at the start?
    common_errors:
      - Starting with every ceremony rather than the few the team needs.

  - external_key: managerial.process_agile.sustained_late_work
    competency_key: leadership
    topic: Planning that relied on long hours
    difficulty: medium
    text: >-
      Tell me about a time your team was regularly working late to hit sprint commitments. How did you spot it,
      and what did you change in how work was planned?
    expected_concepts:
      - signals such as commits late at night or rising carry-over
      - conversation with the team about causes
      - reducing commitments to match real capacity
      - addressing sources of underestimation or interruptions
      - making the change stick with stakeholders
    rubric:
      excellent: Describes how they noticed the pattern, diagnosed causes with the team, changed planning and commitments and handled stakeholder expectations, with evidence the change lasted.
      good: Addresses a real case with sensible planning changes, but the root cause or stakeholder side is thin.
      weak: Did not notice until someone left, or praised the extra hours as commitment.
    followups:
      - How did stakeholders react when the team committed to less?
      - What was the main cause of the overcommitment?
    common_errors:
      - Treating repeated overtime as a sign of a dedicated team rather than a planning problem.

  - external_key: managerial.process_agile.introducing_wip_limits
    competency_key: agile_delivery
    topic: Introducing work-in-progress limits
    difficulty: medium
    text: >-
      Tell me about introducing work-in-progress limits on a team. How did you pick the limits, how did people
      respond, and what happened to delivery?
    expected_concepts:
      - starting from the current level of work in progress
      - explaining why finishing beats starting
      - what people do when the limit is reached, such as swarming or reviewing
      - adjusting limits over time
      - measured effect on cycle time or throughput
    rubric:
      excellent: Describes how the limits were set from real data, how the team was prepared, what people did when limits were hit and measured effects on delivery.
      good: Introduced limits in a real case with some positive effect, but the reasoning for the numbers was loose.
      weak: Set arbitrary limits that were ignored, or cannot describe the effect.
    followups:
      - What did people do when they couldn't pull new work?
      - Did you ever raise a limit, and why?
    common_errors:
      - Setting limits but letting everyone exceed them when it is inconvenient.

  - external_key: managerial.process_agile.bringing_team_along
    competency_key: communication
    topic: Bringing the team along with a process change
    difficulty: medium
    text: >-
      When you want to change how the team works, how do you bring the team along rather than simply announcing
      the change? Tell me about one specific change and how you introduced it.
    expected_concepts:
      - sharing the problem and evidence first
      - inviting the team to propose or shape solutions
      - addressing concerns openly
      - agreeing a trial and review
      - following through on what was agreed
    rubric:
      excellent: Describes a specific change, how the problem was shared with evidence, how the team shaped the solution and concerns were handled, and how the trial and review went.
      good: Involves the team in a real change, though input was gathered after the solution was largely decided.
      weak: Announces changes and expects compliance, or seeks consensus endlessly without deciding.
    followups:
      - What did the team change about your original idea?
      - Who disagreed, and how did you handle it?
    common_errors:
      - Consulting the team only after the decision has already been made.
