# Managerial round: performance management and feedback (part 2 of 4).
# Focus: writing performance reviews, evidence, calibration, ratings and bias in evaluation.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ writing reviews
  - external_key: managerial.performance_feedback.review_evidence_gathering
    competency_key: people_management
    topic: Gathering evidence for a performance review
    difficulty: easy
    text: >-
      When you sit down to write someone's performance review, where does your evidence come from? Walk me through
      how you put together the last review you wrote.
    expected_concepts:
      - running notes kept throughout the period
      - concrete work artefacts such as designs, launches and incidents
      - peer and partner input
      - the person's own self-assessment
      - covering the whole period, not just recent weeks
    rubric:
      excellent: Describes multiple evidence sources gathered across the full period, explains how they weighed them and shows the review rested on specific work examples.
      good: Uses several sources with a reasonable example, but relies heavily on memory or recent work.
      weak: Writes reviews from general impressions or only from the last few weeks.
    followups:
      - How did you handle input that contradicted your own view?
      - What did you wish you had written down earlier?
    common_errors:
      - Letting the last month dominate a full review period.

  - external_key: managerial.performance_feedback.review_writing_quality
    competency_key: communication
    topic: Writing a review someone can act on
    difficulty: medium
    text: >-
      What makes a written performance review genuinely useful to the person reading it? Tell me how you structured
      one you were proud of.
    expected_concepts:
      - clear summary of overall performance against expectations
      - specific examples with impact for strengths and gaps
      - a small number of prioritised growth areas
      - forward-looking actions for the next period
      - language tied to the role expectations
    rubric:
      excellent: Describes a clear structure with specific evidence, prioritised growth areas and concrete next steps, using a real review as the example.
      good: Mentions specific examples and growth areas, but the forward-looking plan is thin.
      weak: Reviews are lists of adjectives or project names without impact or direction.
    followups:
      - How long should a review be, in your view?
      - How did the person use it afterwards?
    common_errors:
      - Listing every minor issue instead of the few that matter.

  - external_key: managerial.performance_feedback.self_assessment_gap
    competency_key: people_management
    topic: When self-assessment and manager view differ
    difficulty: medium
    text: >-
      Tell me about a time someone's self-assessment was much more positive than your own view of their year. How
      did you handle the gap in the review conversation?
    expected_concepts:
      - reading the self-assessment carefully for evidence you missed
      - acknowledging where the person was right
      - explaining the difference with specific examples
      - linking the gap to the role expectations
      - agreeing on what would close the gap
    rubric:
      excellent: Genuinely checks the self-assessment for missed evidence, explains the remaining gap with specifics against expectations and agrees a concrete plan.
      good: Explains the difference with examples, but treats the self-assessment mostly as something to rebut.
      weak: Dismisses the self-assessment or changes the rating to avoid disagreement.
    followups:
      - Did the self-assessment change your view at all?
      - What did that gap tell you about your earlier feedback?
    common_errors:
      - Treating the gap purely as the employee's misjudgement.

  - external_key: managerial.performance_feedback.review_delivery_meeting
    competency_key: communication
    topic: Running the review conversation
    difficulty: easy
    text: >-
      How do you run the meeting where you share a performance review with someone? Describe what happens before,
      during and after the conversation.
    expected_concepts:
      - sharing the written review in advance or at a deliberate moment
      - leading with the overall message clearly
      - time for the person's reactions and questions
      - discussing next steps and growth
      - follow-up meeting or written summary
    rubric:
      excellent: Describes a deliberate before-during-after flow, delivers the overall message clearly, leaves space for discussion and follows up with concrete next steps.
      good: Has a sensible flow with discussion, but limited follow-up.
      weak: Reads the review out or treats the meeting as a formality.
    followups:
      - When do you share the rating itself?
      - What do you do if the conversation turns into a debate?
    common_errors:
      - Burying the overall message under detail.

  - external_key: managerial.performance_feedback.disputed_review
    competency_key: people_management
    topic: Handling a disputed review
    difficulty: hard
    text: >-
      Tell me about a time someone strongly disagreed with the performance review or rating you gave them. What
      did you do, and how did it end?
    expected_concepts:
      - listening and understanding the specific disagreement
      - re-examining evidence without automatically conceding
      - explaining the reasoning and process transparently
      - offering the formal escalation or appeal path
      - preserving the working relationship and agreeing next steps
    rubric:
      excellent: Listens to the specific objection, re-checks evidence in good faith, explains the reasoning transparently, respects the appeal path and keeps a productive working relationship.
      good: Handles the disagreement respectfully with an example, but limited re-examination or follow-up.
      weak: Either defends the rating without listening or changes it simply to end the conflict.
    followups:
      - What would have made you change the rating?
      - How did your working relationship look a few months later?
    common_errors:
      - Treating any disagreement as a sign the person cannot take feedback.

  # ------------------------------------------------------------ calibration
  - external_key: managerial.performance_feedback.calibration_preparation
    competency_key: people_management
    topic: Preparing for a calibration meeting
    difficulty: easy
    text: >-
      How do you prepare for a calibration meeting where managers compare ratings across teams? What do you bring
      for each person?
    expected_concepts:
      - concise summary of impact against level expectations
      - concrete examples and scope of work
      - comparison points with peers at the same level
      - awareness of where your own assessment may be weak
      - readiness to explain context others may lack
    rubric:
      excellent: Brings concise, level-anchored evidence for each person, anticipates comparisons and openly flags uncertain cases.
      good: Prepares summaries with examples, but less thought about comparison or weak spots.
      weak: Arrives with ratings and general adjectives only.
    followups:
      - How do you present someone whose work is mostly invisible to other managers?
      - What did you learn from your last calibration?
    common_errors:
      - Advocating for every report equally hard regardless of evidence.

  - external_key: managerial.performance_feedback.calibration_rating_lowered
    competency_key: stakeholder_management
    topic: When calibration changes your rating
    difficulty: medium
    text: >-
      Tell me about a time a calibration group lowered a rating you had proposed for someone on your team. How did
      you respond in the room, and how did you explain it to the person afterwards?
    expected_concepts:
      - arguing with evidence while staying open to the group's view
      - understanding the reasoning behind the change
      - owning the final rating rather than blaming the process
      - explaining the outcome with specific expectations
      - turning it into a growth plan
    rubric:
      excellent: Advocates with evidence, understands and accepts or escalates appropriately, then owns the message to the employee with specifics and a plan.
      good: Handles both stages reasonably with an example, though the employee conversation is vague.
      weak: Tells the employee the committee overruled them or never really argued the case.
    followups:
      - Did you agree with the group in the end?
      - What did you change in your feedback during the following period?
    common_errors:
      - Hiding behind the calibration process when delivering the rating.

  - external_key: managerial.performance_feedback.calibration_lenient_manager
    competency_key: leadership
    topic: Inconsistent standards across managers
    difficulty: hard
    text: >-
      In calibration you notice one manager consistently rates their team much higher than everyone else, with
      thinner evidence. How would you handle that, both in the meeting and afterwards?
    expected_concepts:
      - asking for specific evidence against level expectations in the meeting
      - focusing on consistency for employees rather than winning the argument
      - private follow-up conversation with the manager
      - shared examples or rubrics to align the bar
      - involving the facilitator or senior leader if the pattern continues
    rubric:
      excellent: Challenges with evidence-based questions in the room, follows up privately to align the bar, proposes concrete calibration aids and knows when to escalate.
      good: Raises the issue constructively, but proposes few mechanisms to fix the pattern.
      weak: Lets it pass to avoid conflict, or attacks the manager publicly.
    followups:
      - What would you say if that manager were more senior than you?
      - How would you check whether your own ratings were too harsh?
    common_errors:
      - Treating calibration as a negotiation between managers.

  - external_key: managerial.performance_feedback.calibration_bias_checks
    competency_key: people_management
    topic: Reducing bias in calibration
    difficulty: hard
    text: >-
      What practices have you used or pushed for to make performance calibration fairer and less dependent on who
      speaks loudest or who is most visible? Give me an example where it changed an outcome.
    expected_concepts:
      - structured evidence templates read before the meeting
      - anchoring discussion on level expectations
      - reviewing outcomes for patterns across teams and demographics through the formal process
      - checking for recency and visibility bias
      - a facilitator who keeps discussion on evidence
    rubric:
      excellent: Describes concrete, structural fairness practices, explains which biases they target and gives an example where they changed an outcome.
      good: Names several reasonable practices, but no concrete example of impact.
      weak: Relies on managers being fair-minded, or names no practices.
    followups:
      - How would you know whether the process had a systematic skew?
      - Which practice was hardest to get adopted?
    common_errors:
      - Assuming awareness of bias is enough to remove it.

  - external_key: managerial.performance_feedback.recency_bias
    competency_key: people_management
    topic: Recency bias in reviews
    difficulty: medium
    text: >-
      Someone on your team had an excellent first nine months and a rough final quarter. How would you assess their
      year, and how would you explain the rating to them?
    expected_concepts:
      - weighing the whole period against expectations
      - understanding what changed in the last quarter
      - specific evidence for both phases
      - clear message about current concerns
      - plan for the next period
    rubric:
      excellent: Assesses the whole period fairly with evidence, investigates the recent change, communicates both the strong year and the current concern clearly and agrees next steps.
      good: Balances the period reasonably, though investigation of the recent change is shallow.
      weak: Rates based mainly on the last quarter or ignores the recent decline.
    followups:
      - What if the decline continued into the next quarter?
      - How would your notes from earlier in the year help here?
    common_errors:
      - Letting the most recent memory decide the rating.

  - external_key: managerial.performance_feedback.glue_work_recognition
    competency_key: people_management
    topic: Valuing less visible contributions
    difficulty: medium
    text: >-
      Some engineers spend a lot of time on less visible work such as onboarding others, improving tooling or
      keeping documentation current. How do you make sure that work counts in their performance review?
    expected_concepts:
      - making the work visible through notes and outcomes
      - tying it to team-level impact
      - checking the career framework recognises it
      - balancing it against role expectations for growth
      - advocating for it in calibration
    rubric:
      excellent: Explains how they capture and quantify less visible work, connect it to team impact, advocate for it in calibration and balance it against growth expectations.
      good: Recognises the work and mentions it in reviews, with less on evidence or balance.
      weak: Counts mainly shipped features and visible launches.
    followups:
      - What if this work is keeping the person from growing in their core role?
      - How did you present it to other managers?
    common_errors:
      - Praising this work privately but not crediting it in the review.

  - external_key: managerial.performance_feedback.impact_vs_effort
    competency_key: people_management
    topic: Rating impact versus effort
    difficulty: medium
    text: >-
      How do you assess someone who worked very hard on a project that was later cancelled or didn't deliver the
      expected results? Tell me how you have handled a case like that.
    expected_concepts:
      - separating outcomes outside the person's control from their decisions
      - assessing quality of judgement and execution
      - recognising effort without rating effort alone
      - learning and adaptation shown during the project
      - consistency with how others are assessed
    rubric:
      excellent: Distinguishes controllable from uncontrollable outcomes, assesses judgement and execution with evidence and applies a consistent standard.
      good: Gives a fair approach with an example, but blurs effort and impact somewhat.
      weak: Rates purely on effort or purely on the project result.
    followups:
      - What would make you rate them lower despite the effort?
      - How did you explain the assessment to them?
    common_errors:
      - Rewarding long hours as if they were impact.

  - external_key: managerial.performance_feedback.engineering_metrics_misuse
    competency_key: people_management
    topic: Using metrics in individual evaluation
    difficulty: hard
    text: >-
      Your director asks you to use metrics such as commit counts, pull requests merged and story points to rank
      engineers for reviews. How would you respond, and what would you propose instead?
    expected_concepts:
      - explaining how activity metrics are gamed and miss impact
      - where metrics are useful as prompts for conversation
      - proposing evidence based on outcomes and level expectations
      - understanding the director's underlying concern
      - offering a concrete alternative the director can trust
    rubric:
      excellent: Engages with the director's goal, explains specific failure modes of activity metrics and proposes a concrete, trustworthy evidence-based alternative.
      good: Pushes back with sound reasons, but the alternative is vague.
      weak: Adopts the metrics without question or refuses without offering anything.
    followups:
      - Which team-level metrics would you be comfortable reporting?
      - What would you do if the director insisted?
    common_errors:
      - Dismissing all measurement instead of reframing it.

  - external_key: managerial.performance_feedback.rating_distribution_pressure
    competency_key: stakeholder_management
    topic: Forced rating distributions
    difficulty: hard
    text: >-
      Your organisation asks every team to fit a rating distribution, but you believe your whole team performed
      strongly this cycle. How would you handle it?
    expected_concepts:
      - rechecking evidence against level expectations rather than relative impressions
      - making the case with comparisons across teams
      - understanding the purpose and flexibility of the guideline
      - transparency with the team about how ratings work
      - accepting the final decision while advocating fairly
    rubric:
      excellent: Re-tests their own view against the bar, advocates with cross-team evidence, understands the guideline's flexibility and communicates the outcome transparently.
      good: Advocates sensibly but does not re-examine their own assessment.
      weak: Assigns low ratings arbitrarily to fit the curve, or refuses to engage with the process.
    followups:
      - How would you explain a lower rating that came from the distribution?
      - What evidence would convince other managers?
    common_errors:
      - Assuming their team is exceptional without checking against the shared bar.

  - external_key: managerial.performance_feedback.peer_feedback_collection
    competency_key: people_management
    topic: Collecting useful peer feedback
    difficulty: easy
    text: >-
      How do you collect peer feedback for someone's review so that it is useful rather than generic? What
      questions do you ask, and whom do you ask?
    expected_concepts:
      - choosing reviewers who worked closely with the person
      - specific questions about observed work and impact
      - asking for both strengths and growth areas
      - reading feedback for patterns rather than single comments
      - protecting reviewer confidentiality
    rubric:
      excellent: Chooses reviewers deliberately, asks specific evidence-seeking questions, looks for patterns and protects confidentiality.
      good: Collects feedback from relevant peers with reasonable questions.
      weak: Sends a generic form to whoever is available and pastes the answers in.
    followups:
      - How do you treat one strongly negative comment?
      - Do you let the person choose their own reviewers?
    common_errors:
      - Quoting peer comments in a way that identifies the author.

  - external_key: managerial.performance_feedback.conflicting_peer_feedback
    competency_key: people_management
    topic: Conflicting feedback about one person
    difficulty: medium
    text: >-
      Tell me about a time you received very different feedback about the same person from different colleagues.
      How did you work out what was true and what to include in their review?
    expected_concepts:
      - looking for the context behind each view
      - asking follow-up questions for specific examples
      - triangulating with your own observations and work artefacts
      - including only well-supported points
      - sharing themes, not individual quotes, with the person
    rubric:
      excellent: Investigates the context behind conflicting views, gathers specifics, triangulates with evidence and includes only well-supported themes.
      good: Reconciles the views reasonably with an example, though investigation is limited.
      weak: Averages the opinions or picks the one that matches their own view.
    followups:
      - What did the difference tell you about how the person works with different groups?
      - How did you present it to them?
    common_errors:
      - Treating every piece of peer feedback as equally reliable.

  - external_key: managerial.performance_feedback.review_for_short_tenure
    competency_key: people_management
    topic: Reviewing someone new to the team
    difficulty: medium
    text: >-
      How do you write a fair review for someone who joined your team only a couple of months before the review
      cycle, or who moved to you from another team mid-year?
    expected_concepts:
      - gathering input from the previous manager or team
      - assessing against expectations appropriate to their ramp-up
      - being clear about the limits of the evidence
      - focusing on trajectory and early outcomes
      - setting clear goals for the next period
    rubric:
      excellent: Combines input from the prior manager with their own evidence, adjusts expectations for ramp-up, is explicit about evidence limits and sets clear goals.
      good: Reasonable approach with some input gathering, but weak on expectations or goals.
      weak: Writes a minimal review or rates based on a few weeks without context.
    followups:
      - What if the previous manager's view is very different from yours?
      - How would calibration treat a short-tenure case?
    common_errors:
      - Defaulting everyone new to a middle rating without evidence.

  - external_key: managerial.performance_feedback.inherited_ratings
    competency_key: people_management
    topic: Inheriting a team with inflated ratings
    difficulty: hard
    text: >-
      You take over a team where the previous manager rated almost everyone as exceeding expectations, and you see
      a different picture. How would you handle your first review cycle with them?
    expected_concepts:
      - early, explicit conversations about expectations before the cycle
      - gathering specific evidence over time
      - avoiding a sudden unexplained drop in ratings
      - aligning with calibration peers and your own manager
      - clear individual plans for anyone below the bar
    rubric:
      excellent: Resets expectations early and transparently, builds evidence, aligns with leadership and calibration and ensures nobody is surprised by their first review.
      good: Recognises the need to reset and has a reasonable plan, but gives people little time to adjust.
      weak: Keeps inflated ratings to avoid conflict, or drops ratings abruptly at review time.
    followups:
      - How would you talk about the previous manager's ratings?
      - What would you tell someone whose rating went down?
    common_errors:
      - Criticising the previous manager to the team.

  - external_key: managerial.performance_feedback.stakeholder_input_review
    competency_key: stakeholder_management
    topic: Using stakeholder input in reviews
    difficulty: medium
    text: >-
      Product managers and other partners often have strong views on your engineers' performance. How do you gather
      and weigh their input when assessing someone? Give me an example.
    expected_concepts:
      - asking partners for specific examples rather than general opinions
      - understanding the partner's context and incentives
      - weighing input against role expectations
      - feeding concerns back to the engineer promptly, not only at review time
      - balancing positive and critical input
    rubric:
      excellent: Gathers specific stakeholder input, weighs it in context against expectations, and shares it with the engineer promptly with a concrete example.
      good: Uses stakeholder input reasonably, but mostly at review time.
      weak: Ignores partners or takes their opinions at face value.
    followups:
      - What if a stakeholder's complaint was really about a product decision?
      - How do you avoid stakeholders effectively choosing your ratings?
    common_errors:
      - Letting the loudest stakeholder define someone's review.

  - external_key: managerial.performance_feedback.tech_lead_review_input
    competency_key: leadership
    topic: Tech lead input into reviews
    difficulty: easy
    text: >-
      As a tech lead, what kind of input do you give a manager about the engineers you lead, and how do you keep it
      fair and evidence-based?
    expected_concepts:
      - specific technical contributions and their impact
      - growth observed over the period
      - balancing strengths and areas to develop
      - telling the engineer directly what you shared
      - avoiding judgements outside what you observed
    rubric:
      excellent: Provides specific, balanced, observed evidence, is transparent with the engineer about it and stays within what they directly saw.
      good: Gives specific input with reasonable fairness, but little transparency with the engineer.
      weak: Offers general opinions or rankings without examples.
    followups:
      - What do you do if your input contradicts the manager's view?
      - How do you make sure your input does not repeat what the engineer has never heard from you?
    common_errors:
      - Sharing feedback with the manager that was never given to the engineer.

  - external_key: managerial.performance_feedback.rating_explanation
    competency_key: communication
    topic: Explaining a "meets expectations" rating
    difficulty: medium
    text: >-
      Someone on your team is disappointed to receive a solid meets-expectations rating because they were hoping for
      more. How would you have that conversation, and what would you offer them?
    expected_concepts:
      - affirming that the rating reflects solid performance
      - explaining the specific difference between their work and the higher rating
      - concrete examples of what higher impact would look like
      - a growth plan with opportunities to show it
      - agreeing on check-in points
    rubric:
      excellent: Explains the rating clearly with specific examples of the higher bar, offers a realistic growth plan with opportunities and sets follow-up points.
      good: Explains the rating and offers some development, but the examples are vague.
      weak: Apologises for the rating or promises a higher one next time.
    followups:
      - How would you avoid this disappointment next cycle?
      - What opportunities could you realistically offer?
    common_errors:
      - Implying the rating is a problem when it reflects good work.

  - external_key: managerial.performance_feedback.review_cycle_design
    competency_key: project_management
    topic: Improving the review process itself
    difficulty: medium
    text: >-
      Tell me about a time you improved how performance reviews worked on your team or in your organisation, such as
      the timeline, templates or calibration steps. What was wrong, and what did you change?
    expected_concepts:
      - specific problem with the existing process
      - gathering input from managers and employees
      - concrete change made
      - piloting and rolling it out
      - evidence that the change helped
    rubric:
      excellent: Identifies a specific process problem, gathers input, implements a concrete change with a rollout plan and shows evidence of improvement.
      good: Describes a useful change with some rollout, but little evidence of results.
      weak: Suggests changes only in theory or complains about the process without acting.
    followups:
      - Who resisted the change, and why?
      - How much time did the new process cost managers?
    common_errors:
      - Adding process steps without removing any.

  - external_key: managerial.performance_feedback.underrated_quiet_performer
    competency_key: people_management
    topic: Advocating for a quiet strong performer
    difficulty: medium
    text: >-
      Tell me about someone on your team whose strong work was not widely noticed. What did you do to make their
      impact visible, both in reviews and day to day?
    expected_concepts:
      - documenting outcomes and scope
      - creating opportunities to present or own visible work
      - coaching on communicating their own impact
      - advocating in calibration with evidence
      - result for the person
    rubric:
      excellent: Documents the person's impact, creates suitable visibility opportunities, coaches on communicating impact and shows a concrete result.
      good: Advocates in reviews with an example, but does little to change day-to-day visibility.
      weak: Expects good work to be noticed on its own.
    followups:
      - How did you respect how much visibility they wanted?
      - What changed in how others saw their work?
    common_errors:
      - Pushing someone into public roles they did not want without discussing it.

  - external_key: managerial.performance_feedback.consistency_across_reports
    competency_key: people_management
    topic: Keeping your own ratings consistent
    difficulty: easy
    text: >-
      How do you check that you are applying the same standard to everyone on your team when you assess
      performance?
    expected_concepts:
      - comparing each person against written level expectations
      - reviewing ratings side by side before finalising
      - looking for patterns in your own past ratings
      - asking a peer manager to challenge your assessments
      - noticing personal working-relationship effects
    rubric:
      excellent: Describes concrete checks against written expectations, side-by-side comparison and outside challenge, and acknowledges how their own relationships could skew assessments.
      good: Compares against expectations with some checks.
      weak: Relies on their sense of fairness without any checks.
    followups:
      - When did one of these checks change a rating?
      - How do you handle someone you work with much more closely than the others?
    common_errors:
      - Rating people against each other instead of against the role.

  - external_key: managerial.performance_feedback.manager_of_managers_reviews
    competency_key: leadership
    topic: Reviewing the reviews your managers write
    difficulty: hard
    text: >-
      If you lead other managers, how do you review the quality of the performance reviews they write before they
      go to employees? Tell me about a time you sent one back.
    expected_concepts:
      - clear quality bar for reviews
      - checking evidence, specificity and alignment with ratings
      - looking for language that judges the person rather than the work
      - coaching the manager rather than rewriting it
      - consistency across the organisation
    rubric:
      excellent: Applies a clear quality bar, catches unsupported or judgemental language, coaches the manager through improvements and gives a real example.
      good: Reviews drafts with a reasonable bar and an example, though coaching is light.
      weak: Does not review drafts or rewrites them without involving the manager.
    followups:
      - What was the most common problem you found?
      - How did the manager take the feedback?
    common_errors:
      - Focusing on wording polish instead of evidence.
