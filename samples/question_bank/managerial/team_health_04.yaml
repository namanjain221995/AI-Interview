# Curated questions: managerial round, team health (part 4 of 4) - change and uncertainty, team
# turnover, cross-team friction, distributed teams and assessing how a team is really doing. Questions
# stay on work, structure and the candidate's actions; never on personal circumstances.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: managerial.team_health.reading_a_new_team
    competency_key: people_management
    topic: Understanding how a new team is really doing
    difficulty: easy
    text: >-
      When you start leading a team you haven't worked with before, what do you do in the first few weeks to
      understand how the team is really doing, beyond what the delivery dashboards show?
    expected_concepts:
      - one-to-ones with everyone early on
      - asking what is working, what is frustrating and what they would change
      - talking to stakeholders and neighbouring teams
      - looking at on-call load, carry-over and attrition history
      - holding back on big changes until patterns are clear
    rubric:
      excellent: Describes structured listening across the team and its neighbours, combines it with concrete signals such as on-call load and attrition, and explains holding off on big changes until patterns are clear.
      good: Holds one-to-ones and asks useful questions.
      weak: Starts changing things immediately based on first impressions.
    followups:
      - What question in those first conversations has told you the most?
    common_errors:
      - Relying only on what the previous lead said.

  - external_key: managerial.team_health.regular_check_practices
    competency_key: communication
    topic: Regular practices to check on the team
    difficulty: easy
    text: >-
      Apart from looking at delivery, what regular practices do you use to check how your team is doing?
    expected_concepts:
      - one-to-ones with consistent questions
      - team health check or short pulse survey
      - retrospectives with a team-wellbeing angle on workload and process
      - watching workload signals such as on-call and carry-over
      - acting visibly on what comes up
    rubric:
      excellent: Uses a mix of conversational and lightweight structured practices, explains how often and why, and gives an example of acting on something they surfaced.
      good: Uses one-to-ones plus one structured practice.
      weak: Only notices problems once delivery suffers.
    followups:
      - How do you keep a survey from turning into a ritual nobody takes seriously?
    common_errors:
      - Collecting feedback without acting on it.

  - external_key: managerial.team_health.leading_through_hard_stretch
    competency_key: leadership
    topic: Day-to-day leadership in a hard stretch
    difficulty: easy
    text: >-
      When your team is going through a hard stretch, such as a tough deadline or a run of incidents, what do you
      do differently as a leader day to day?
    expected_concepts:
      - more frequent, shorter check-ins
      - clearing blockers and taking on coordination work
      - ruthless prioritisation of what matters now
      - shielding the team from non-essential requests
      - clear communication about when the stretch ends
    rubric:
      excellent: Describes concrete changes in their own behaviour, such as taking on coordination, cutting non-essential work and setting a clear end point, with an example.
      good: Increases support and prioritises clearly.
      weak: Increases pressure or status reporting without adding support.
    followups:
      - How do you know when the stretch has gone on too long?
    common_errors:
      - Adding more status meetings during the crunch.

  - external_key: managerial.team_health.too_much_in_progress
    competency_key: project_management
    topic: Limiting work in progress
    difficulty: easy
    text: >-
      How do you stop your team from having too many things in progress at once, and why does that matter for
      the people doing the work?
    expected_concepts:
      - making work in progress visible
      - explicit limits or finishing before starting
      - reducing context switching and half-done work
      - saying no or sequencing incoming requests
      - effect on focus and sense of progress
    rubric:
      excellent: Uses visible limits and sequencing, explains the effect on focus, flow and sense of progress, and gives an example of the change it made.
      good: Limits parallel work and explains why.
      weak: Starts everything at once to keep stakeholders happy.
    followups:
      - What do you do when a stakeholder insists their item must start now?
    common_errors:
      - Assigning one person to several parallel projects as a matter of course.

  - external_key: managerial.team_health.humane_time_zones
    competency_key: communication
    topic: Communication across time zones without late calls
    difficulty: easy
    text: >-
      On a team spread across time zones, how do you keep communication working without pushing people into
      meetings at unreasonable hours?
    expected_concepts:
      - asynchronous updates and written decisions
      - a small overlap window used for the essentials
      - rotating meeting times that cannot avoid being inconvenient
      - recorded sessions and clear handover notes
    rubric:
      excellent: Describes an asynchronous-first approach with written decisions, a protected overlap window and fair rotation of inconvenient times, with an example.
      good: Uses asynchronous updates and some rotation.
      weak: Always schedules for the largest location and expects others to adjust.
    followups:
      - What decisions do you still insist on making live?
    common_errors:
      - Leaving the same location to take every late call.

  - external_key: managerial.team_health.review_friction_first_step
    competency_key: people_management
    topic: Early friction between two teammates
    difficulty: easy
    text: >-
      Two people on your team keep clashing in code reviews, and the comments are getting sharper. What would you
      do first?
    expected_concepts:
      - looking at the actual review threads
      - separate conversations to understand each view
      - clarifying review norms for the whole team
      - focusing feedback on behaviour and its effect
      - following up to see if it improves
    rubric:
      excellent: Looks at the evidence, talks to each person separately, addresses behaviour and its effect, reinforces team-wide review norms and follows up.
      good: Talks to both people and sets expectations.
      weak: Ignores it or publicly reprimands one of them.
    followups:
      - When would you bring them together for a joint conversation?
    common_errors:
      - Waiting until it becomes a formal complaint.

  - external_key: managerial.team_health.clear_weekly_priorities
    competency_key: communication
    topic: Keeping priorities clear for the team
    difficulty: easy
    text: >-
      How do you make sure people on your team know what matters most this week, so they aren't left guessing
      or trying to do everything at once?
    expected_concepts:
      - a single visible priority order
      - regular short planning or check-in moments
      - explaining the reason behind priorities
      - telling people explicitly what can wait
      - updating everyone when priorities change
    rubric:
      excellent: Keeps one visible priority order, explains the reasons, states explicitly what can wait and communicates changes promptly.
      good: Shares priorities regularly with some context.
      weak: Expects people to infer priorities from the backlog.
    followups:
      - How do you handle someone who keeps getting pulled onto other work?
    common_errors:
      - Listing everything as high priority.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.team_health.through_a_reorg
    competency_key: leadership
    topic: Helping a team through a reorganisation
    difficulty: medium
    text: >-
      Tell me about a time your team went through a reorganisation or a big change in direction. How did you
      communicate it, and how did you help people through it?
    expected_concepts:
      - communicating early and directly, before rumours
      - explaining reasons and what is still unknown
      - one-to-ones to address individual concerns about their work
      - clarifying new ownership and priorities quickly
      - checking in over the following weeks
    rubric:
      excellent: Real example where they communicated early and openly, handled individual concerns, clarified new ownership quickly and followed up as the change settled.
      good: Communicated clearly and answered questions.
      weak: Let people learn about it from announcements or rumours.
    followups:
      - What question from the team was hardest to answer?
    common_errors:
      - Overpromising that nothing will change for anyone.

  - external_key: managerial.team_health.merging_two_teams
    competency_key: people_management
    topic: Merging two teams with different practices
    difficulty: medium
    text: >-
      You're asked to merge two teams with quite different ways of working into one. How would you approach the
      first couple of months?
    expected_concepts:
      - understanding each team's practices and why they exist
      - agreeing shared practices together rather than imposing one side's
      - mixing people through pairing and shared projects
      - clear ownership of systems after the merge
      - watching for an us-and-them split
    rubric:
      excellent: Learns both teams' practices, co-creates a shared way of working, deliberately mixes people, settles ownership early and watches for factions.
      good: Agrees shared practices and clarifies ownership.
      weak: Imposes one team's way of working on the other.
    followups:
      - How would you decide which on-call process to keep?
    common_errors:
      - Treating the larger team's habits as the default.

  - external_key: managerial.team_health.sharing_uncertain_news
    competency_key: communication
    topic: Sharing uncertain news with the team
    difficulty: medium
    text: >-
      How do you decide what to share with your team when there's uncertain news, such as possible budget cuts
      or a change of direction, and how do you share it?
    expected_concepts:
      - what is confirmed versus speculative
      - company confidentiality constraints
      - sharing what you can and saying clearly what you don't know
      - committing to when the next update will come
      - avoiding false reassurance
    rubric:
      excellent: Distinguishes confirmed from speculative information, respects confidentiality, shares openly what they can including what is unknown, and sets a clear next update.
      good: Shares what is confirmed and avoids speculation.
      weak: Either shares rumours freely or says nothing until it is final.
    followups:
      - What would you say if someone asked you directly whether their job was safe?
    common_errors:
      - Offering reassurance they cannot back up.

  - external_key: managerial.team_health.internal_transfer_request
    competency_key: people_management
    topic: A respected engineer asks to transfer
    difficulty: medium
    text: >-
      A respected engineer asks to transfer to another team in the company. How do you handle the request and
      the gap it leaves?
    expected_concepts:
      - understanding their reasons and supporting the move
      - learning anything about the team that needs fixing
      - agreeing timing and handover with the receiving team
      - redistributing work and knowledge
      - communicating to the team positively
    rubric:
      excellent: Supports the move, learns from the reasons, agrees a fair timeline and handover, and rebalances work without overloading others.
      good: Supports the transfer and plans a handover.
      weak: Blocks or delays the move to protect delivery.
    followups:
      - What if the timing would put a critical launch at risk?
    common_errors:
      - Holding people back from internal moves, which pushes them to leave the company instead.

  - external_key: managerial.team_health.survey_workload_growth
    competency_key: leadership
    topic: Acting on low survey scores with the team
    difficulty: medium
    text: >-
      Your team's engagement survey comes back with low scores on workload and on career growth. How do you
      decide what to do about it, and how do you involve the team?
    expected_concepts:
      - sharing results openly with the team
      - discussing the scores to understand causes
      - choosing a small number of actions
      - team members owning some actions
      - reviewing progress before the next survey
    rubric:
      excellent: Shares results openly, explores causes with the team, commits to a few concrete actions with shared ownership and reviews progress before the next survey.
      good: Discusses results and agrees some actions.
      weak: Treats the scores as noise or creates a long list of actions nobody owns.
    followups:
      - Which of the two problems would you address first, and why?
    common_errors:
      - Trying to fix everything at once.

  - external_key: managerial.team_health.after_high_turnover
    competency_key: people_management
    topic: Re-forming a team after high turnover
    difficulty: medium
    text: >-
      About half of your team's members have changed over the past year. What would you do to re-establish
      shared ways of working and a sense of ownership?
    expected_concepts:
      - revisiting working agreements with the current team
      - clarifying ownership of systems and areas
      - capturing knowledge lost with departures
      - team-building through shared work, such as a joint project or design exercise
      - checking whether old practices still fit
    rubric:
      excellent: Treats it as a new team, re-agrees working practices and ownership, recovers lost knowledge and builds cohesion through shared work.
      good: Updates practices and clarifies ownership.
      weak: Assumes the old ways still work for the new team.
    followups:
      - Which old practice would you most expect to need changing?
    common_errors:
      - Expecting new members to absorb undocumented norms.

  - external_key: managerial.team_health.cross_team_resentment
    competency_key: stakeholder_management
    topic: Repairing a strained relationship with another team
    difficulty: medium
    text: >-
      Your team and a partner team have built up real resentment after a series of missed handoffs. How would you
      repair the working relationship?
    expected_concepts:
      - talking with the other team's lead first
      - a joint look at what went wrong without blame
      - clear interface agreements and handoff expectations
      - visible early wins
      - discouraging negative talk about the other team within your own
    rubric:
      excellent: Starts with the other lead, runs a blameless joint review, sets concrete handoff agreements, builds early wins and models respectful behaviour within their own team.
      good: Meets the other team and agrees better handoffs.
      weak: Escalates or lets the resentment continue.
    followups:
      - What would you do if your own team was partly at fault?
    common_errors:
      - Defending their own team without examining its part.

  - external_key: managerial.team_health.new_lead_doing_everything
    competency_key: mentoring
    topic: Supporting an overstretched new tech lead
    difficulty: medium
    text: >-
      Someone has just become a tech lead and is trying to keep doing all of their old engineering work on top of
      the new responsibilities. How do you support them?
    expected_concepts:
      - clarifying what the lead role includes and excludes
      - explicitly reducing their individual delivery load
      - coaching on delegation and letting go
      - regular check-ins during the transition
      - signs of overload to watch for
    rubric:
      excellent: Clarifies the role explicitly, reduces their individual load, coaches delegation with examples and checks in regularly through the transition.
      good: Advises them to delegate and checks in.
      weak: Leaves them to work it out alone.
    followups:
      - What work would you suggest they hand over first?
    common_errors:
      - Expecting a new lead to keep full individual output.

  - external_key: managerial.team_health.remote_isolation
    competency_key: people_management
    topic: Noticing isolation on a remote team
    difficulty: medium
    text: >-
      How would you notice that someone on a fully remote team has become isolated from the rest of the team,
      and what would you do about it?
    expected_concepts:
      - work signals such as few reviews exchanged or little collaboration
      - asking directly in one-to-ones
      - pairing and shared ownership of work
      - team practices that create regular collaboration
      - respecting individual working preferences
    rubric:
      excellent: Uses observable collaboration signals and direct conversation, creates work-based connection through pairing and shared ownership and respects individual preferences.
      good: Notices through one-to-ones and encourages collaboration.
      weak: Assumes remote people are fine unless they say otherwise.
    followups:
      - How do you avoid forcing social activities on people who don't want them?
    common_errors:
      - Relying only on optional social events.

  - external_key: managerial.team_health.both_want_you_to_decide
    competency_key: communication
    topic: Resolving a technical argument so both stay committed
    difficulty: medium
    text: >-
      Two engineers bring you an argument about a technical approach, and each wants you to decide in their
      favour. How do you handle it so both stay committed afterwards?
    expected_concepts:
      - helping them define decision criteria together
      - exploring each option's trade-offs
      - pushing the decision back to them where possible
      - making a clear decision with reasons when needed
      - agreeing how to revisit if the approach fails
    rubric:
      excellent: Helps them agree criteria, compares options, lets them decide where possible, decides clearly with reasoning when needed and sets a revisit point.
      good: Listens to both and makes a reasoned decision.
      weak: Picks one without explanation or avoids deciding.
    followups:
      - How would you handle it if you didn't know enough to judge?
    common_errors:
      - Becoming the default arbiter for every disagreement.

  - external_key: managerial.team_health.firefighting_cycle
    competency_key: project_management
    topic: Planning a way out of constant firefighting
    difficulty: medium
    text: >-
      Your team's service has had a run of incidents, and people are spending most of their time firefighting.
      How would you plan your way out of that cycle?
    expected_concepts:
      - analysing incidents for the top recurring causes
      - reserving explicit capacity for reliability fixes
      - negotiating reduced feature commitments
      - protecting fixers from interruptions
      - measuring incident trend and toil over time
    rubric:
      excellent: Finds recurring causes, reserves capacity explicitly, negotiates lighter commitments, protects the people fixing things and tracks the trend.
      good: Prioritises reliability work for a period.
      weak: Keeps firefighting while promising features at the same rate.
    followups:
      - How would you justify the slowdown in features?
    common_errors:
      - Adding reliability work on top of a full roadmap.

  - external_key: managerial.team_health.bypassing_priorities
    competency_key: stakeholder_management
    topic: Stakeholders going straight to engineers
    difficulty: medium
    text: >-
      A product partner keeps going directly to individual engineers with urgent requests, which bypasses the
      team's priorities and puts pressure on people. How would you handle it?
    expected_concepts:
      - understanding why they bypass the process
      - agreeing a clear intake path with them
      - making it easy for engineers to redirect requests
      - making sure the intake path is responsive enough
      - following up if it continues
    rubric:
      excellent: Understands the partner's reasons, agrees an intake path that actually meets their needs, equips engineers to redirect politely and follows up.
      good: Talks to the partner and sets a clear process.
      weak: Leaves engineers to deal with it themselves.
    followups:
      - What if the partner is senior to you?
    common_errors:
      - Fixing the process without making it fast enough for real urgencies.

  # ------------------------------------------------------------------ hard
  - external_key: managerial.team_health.after_headcount_reduction
    competency_key: leadership
    topic: Leading after a headcount reduction
    difficulty: hard
    text: >-
      Your company has just reduced headcount. Your team lost two people, and those remaining are worried and
      stretched. How would you lead the team through the next month?
    expected_concepts:
      - communicating openly what is known and unknown
      - acknowledging the departures respectfully
      - re-planning commitments for the smaller team
      - explicitly dropping work rather than spreading it
      - knowledge recovery for lost areas
      - frequent one-to-ones focused on work concerns
    rubric:
      excellent: Communicates openly, re-plans and explicitly cuts scope with stakeholders, recovers lost knowledge and keeps close contact with each person about their work.
      good: Communicates and adjusts the plan.
      weak: Keeps the same commitments with fewer people.
    followups:
      - How would you decide what to stop doing?
    common_errors:
      - Expecting the remaining team to absorb all the lost work.

  - external_key: managerial.team_health.quarterly_team_report
    competency_key: people_management
    topic: Reporting on team health to leadership
    difficulty: hard
    text: >-
      If your director asked you to report on how your team is really doing each quarter, what would you include,
      and how would you keep it from becoming a box-ticking exercise?
    expected_concepts:
      - a mix of quantitative and qualitative signals
      - workload, attrition, growth and engagement indicators
      - trends and context rather than single numbers
      - protecting individual confidentiality
      - actions taken and their effect
    rubric:
      excellent: Proposes a balanced set of signals with trends and context, protects confidentiality, ties findings to actions and their results, and explains how to avoid gaming.
      good: Includes several relevant indicators.
      weak: Reports only delivery metrics or a single survey score.
    followups:
      - Which signal would you be most wary of being gamed?
    common_errors:
      - Turning the report into a ranking of individuals.

  - external_key: managerial.team_health.failing_team_ninety_days
    competency_key: leadership
    topic: Turning around a struggling team
    difficulty: hard
    text: >-
      You take over a team that has missed its last three commitments, has lost several people, and is seen by
      the rest of the organisation as failing. What's your plan for the first ninety days?
    expected_concepts:
      - diagnosing causes through listening and data
      - stabilising with a few achievable commitments
      - resetting expectations with stakeholders
      - addressing workload and morale drivers
      - quick visible wins to rebuild reputation
      - longer-term structural fixes
    rubric:
      excellent: Gives a phased plan that diagnoses causes, stabilises through realistic commitments, resets stakeholder expectations, addresses team drivers and rebuilds reputation through visible wins.
      good: Sensible plan covering diagnosis and quick wins.
      weak: Pushes the team harder to hit existing commitments.
    followups:
      - What would you tell stakeholders in your first month?
    common_errors:
      - Assuming the team's people are the problem before diagnosing.

  - external_key: managerial.team_health.dropping_valued_work
    competency_key: stakeholder_management
    topic: Asking a team to drop work it cares about
    difficulty: hard
    text: >-
      The business needs your team to take on an urgent strategic project, which means dropping work the team
      cares about and is proud of. How would you handle that with the team and with stakeholders?
    expected_concepts:
      - understanding and conveying the strategic reason
      - negotiating what can be paused cleanly versus dropped
      - preserving the dropped work so it can resume
      - acknowledging the loss openly with the team
      - connecting the new project to people's growth
    rubric:
      excellent: Understands and explains the strategic reason, negotiates a clean pause, preserves the work, acknowledges the loss openly and connects the new project to growth opportunities.
      good: Explains the reasons and plans the transition.
      weak: Announces the change without explanation or argues against it with the team.
    followups:
      - What would you do if a key engineer refused to move?
    common_errors:
      - Pretending the change has no cost to the team.

  - external_key: managerial.team_health.delivering_but_exhausted
    competency_key: people_management
    topic: A lead whose team delivers but is exhausted
    difficulty: hard
    text: >-
      One of the leads who reports to you runs a team that delivers well, but you hear from several people that
      the team is exhausted and reluctant to raise issues. How would you handle it?
    expected_concepts:
      - gathering evidence without exposing those who spoke up
      - looking at workload signals and attrition
      - direct conversation with the lead about what you are seeing
      - coaching the lead and setting clear expectations
      - following up with the team over time
    rubric:
      excellent: Gathers evidence carefully, raises it directly with the lead, coaches them with clear expectations on sustainable practices and monitors the team over time.
      good: Raises it with the lead and checks team signals.
      weak: Ignores it because the team delivers.
    followups:
      - What would you do if the lead disagreed with your assessment?
    common_errors:
      - Valuing short-term delivery over team sustainability.

  - external_key: managerial.team_health.proximity_bias
    competency_key: leadership
    topic: Office presence driving unequal opportunity
    difficulty: hard
    text: >-
      In a hybrid team, you notice that people who are in the office more often are getting the more interesting
      projects and stronger reviews. How would you investigate and correct it?
    expected_concepts:
      - checking assignments and reviews against data
      - evidence-based reviews focused on outcomes
      - transparent criteria for assigning projects
      - remote-friendly visibility of work
      - examining their own patterns
    rubric:
      excellent: Checks the pattern with data, introduces transparent assignment criteria and outcome-based reviews, improves visibility for remote work and examines their own role.
      good: Reviews assignments and makes the process fairer.
      weak: Assumes in-office people are simply more engaged.
    followups:
      - How would you raise this with other managers if it's happening across the group?
    common_errors:
      - Treating office presence as a proxy for commitment.
