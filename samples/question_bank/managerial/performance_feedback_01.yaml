# Managerial round: performance management and feedback (part 1 of 4).
# Focus: setting expectations, one-to-ones and the everyday feedback loop.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ setting expectations
  - external_key: managerial.performance_feedback.expectations_new_report
    competency_key: people_management
    topic: Setting expectations with a new report
    difficulty: easy
    text: >-
      When someone new joins your team, how do you make it clear what doing a good job looks like in their
      first few months? Walk me through what you did with the most recent person.
    expected_concepts:
      - written expectations tied to the role level
      - early, concrete milestones for the first weeks and months
      - explaining how progress will be reviewed
      - regular check-ins to adjust expectations
      - inviting questions and agreement from the new person
    rubric:
      excellent: Describes a specific new joiner, written and level-appropriate expectations with milestones, a review rhythm and how the expectations were checked and adjusted together.
      good: Gives a real example with clear expectations and some follow-up, though milestones or review points are loosely defined.
      weak: Relies on the person figuring it out, or describes only general onboarding tasks with no definition of success.
    followups:
      - How did you know after the first month whether they were on track?
      - What did you change about those expectations later, and why?
    common_errors:
      - Confusing an onboarding checklist with performance expectations.

  - external_key: managerial.performance_feedback.career_ladder_use
    competency_key: people_management
    topic: Using a career framework day to day
    difficulty: medium
    text: >-
      Many companies have a career ladder that describes each engineering level. How have you actually used one
      in conversations with your team, beyond review time? Give me a concrete example.
    expected_concepts:
      - translating abstract level language into concrete behaviours for the team's work
      - using the framework in one-to-ones and growth conversations
      - pointing to examples of work at the next level
      - noticing where the framework is unclear or misses important work
      - consistency across people on the team
    rubric:
      excellent: Shows how they turned ladder wording into concrete, team-specific examples, used it regularly in growth conversations and handled gaps or ambiguity in the framework.
      good: Uses the ladder in growth conversations with a reasonable example, but mostly at review time.
      weak: Treats the ladder as a checklist read once a year, or cannot describe using it at all.
    followups:
      - Which part of the ladder did people find hardest to interpret?
      - How did you make sure two people at the same level were held to the same bar?
    common_errors:
      - Reading the ladder aloud instead of mapping it to real work.

  - external_key: managerial.performance_feedback.unclear_role_expectations
    competency_key: people_management
    topic: Repairing unclear expectations
    difficulty: hard
    text: >-
      Imagine you find out during review season that someone on your team believed they were doing great, while
      you and their peers saw clear gaps. How would you handle that review, and what would you change so it
      doesn't happen again?
    expected_concepts:
      - acknowledging that the surprise is partly a management failure
      - grounding the review in specific, observable examples
      - separating the rating discussion from the forward-looking plan
      - agreeing on explicit expectations and a check-in cadence
      - changing the feedback rhythm so gaps surface early
    rubric:
      excellent: Owns the manager's part in the surprise, delivers specific evidence fairly, sets a clear forward plan and describes concrete process changes such as more frequent written feedback.
      good: Handles the conversation with examples and a plan, but says little about preventing the surprise next time.
      weak: Places the blame on the employee or softens the review to avoid conflict.
    followups:
      - Would you change the rating because the feedback came late?
      - How would you document the new expectations?
    common_errors:
      - Delivering accumulated criticism for the first time in the formal review.

  - external_key: managerial.performance_feedback.expectations_for_tech_lead_role
    competency_key: leadership
    topic: Defining expectations for a new lead role
    difficulty: medium
    text: >-
      Suppose an engineer on your team is stepping into a tech lead role for the first time. How would you define
      what success in that role looks like, and how would you give them feedback during the first quarter?
    expected_concepts:
      - clarifying the split between technical work, coordination and people support
      - concrete outcomes such as design quality, delivery and team unblocking
      - gathering input from the team and partners
      - frequent early check-ins with specific observations
      - support such as shadowing or coaching
    rubric:
      excellent: Defines concrete lead outcomes and boundaries, explains how they would collect evidence from the team and partners, and lays out an early feedback rhythm with specific support.
      good: Defines reasonable responsibilities and some feedback plan, with fewer specifics on evidence or support.
      weak: Says the person will learn on the job, or measures success only by their own coding output.
    followups:
      - What would worry you after the first month?
      - How would you find out how the team experiences them as a lead?
    common_errors:
      - Expecting the new lead to keep the same individual output on top of the new duties.

  # ------------------------------------------------------------ one-to-ones
  - external_key: managerial.performance_feedback.one_to_one_structure
    competency_key: people_management
    topic: Running useful one-to-ones
    difficulty: easy
    text: >-
      How do you run your one-to-ones with the people on your team, and how do you keep them from turning into
      status updates?
    expected_concepts:
      - regular cadence that the manager protects
      - agenda owned or shaped by the report
      - separate channels for project status
      - time for growth, blockers and feedback in both directions
      - notes or follow-ups carried between meetings
    rubric:
      excellent: Describes a consistent cadence, a report-driven agenda, a deliberate way of moving status elsewhere and concrete follow-through on actions between meetings.
      good: Has a regular rhythm and some structure, but status still takes much of the time.
      weak: Holds one-to-ones irregularly or uses them mainly to check task progress.
    followups:
      - What do you do when someone has nothing to bring?
      - How do you track what you agreed in previous meetings?
    common_errors:
      - Cancelling one-to-ones whenever the week gets busy.

  - external_key: managerial.performance_feedback.one_to_one_signal
    competency_key: people_management
    topic: Spotting early signals in one-to-ones
    difficulty: medium
    text: >-
      Tell me about a time a one-to-one helped you catch a performance or engagement problem before it became
      serious. What did you notice, and what did you do next?
    expected_concepts:
      - specific signal observed in the work or the conversation
      - asking open questions to understand the cause
      - agreeing on a concrete next step
      - following up in later meetings
      - outcome compared with what might have happened
    rubric:
      excellent: Gives a specific early signal, explains how they explored it with open questions, the action agreed, follow-up over time and the measurable outcome.
      good: Real example with a reasonable response, but follow-up or outcome is thin.
      weak: Cannot recall catching anything early, or describes a problem found only at review time.
    followups:
      - What would you have missed without that meeting?
      - How did you keep the conversation focused on the work?
    common_errors:
      - Probing into private matters instead of work-related obstacles.

  - external_key: managerial.performance_feedback.skip_level_input
    competency_key: people_management
    topic: Skip-level conversations as a feedback source
    difficulty: hard
    text: >-
      If you manage managers, how do you use skip-level conversations to understand how your managers are doing,
      without undermining them? Tell me about a time this changed how you coached one of them.
    expected_concepts:
      - transparent purpose of skip-levels shared with the managers
      - themes rather than attributing comments to individuals
      - triangulating with other evidence before acting
      - turning themes into coaching for the manager
      - closing the loop with the team where appropriate
    rubric:
      excellent: Explains a transparent skip-level practice, protects confidentiality, triangulates before acting and gives a concrete example of coaching a manager with a measurable change.
      good: Uses skip-levels sensibly with an example, though confidentiality or triangulation is handled loosely.
      weak: Uses skip-levels to bypass managers or acts on single comments without checking.
    followups:
      - How did the manager react when you raised the theme?
      - What would you do if the team told you something you could not share?
    common_errors:
      - Quoting individual team members to their manager.

  # ------------------------------------------------------------ everyday feedback
  - external_key: managerial.performance_feedback.recent_feedback_given
    competency_key: communication
    topic: Giving specific, timely feedback
    difficulty: easy
    text: >-
      Tell me about the most recent piece of constructive feedback you gave someone on your team. How did you
      frame it, and what did they do with it?
    expected_concepts:
      - specific behaviour or piece of work
      - impact of that behaviour
      - timing close to the event
      - private delivery and a two-way conversation
      - agreed change and follow-up
    rubric:
      excellent: Describes a specific recent example, the observed work and its impact, a timely two-way conversation and a visible change afterwards.
      good: Clear example with specific feedback, but the follow-up or result is vague.
      weak: Gives a generic description of their feedback style or an example from long ago without detail.
    followups:
      - How did you check that the message landed the way you intended?
      - Would you deliver it differently now?
    common_errors:
      - Describing feedback as a general impression rather than an observed behaviour.

  - external_key: managerial.performance_feedback.positive_feedback_practice
    competency_key: people_management
    topic: Reinforcing good work
    difficulty: easy
    text: >-
      How do you recognise good work on your team so that it actually reinforces the behaviour you want to see?
      Give me a recent example.
    expected_concepts:
      - specific description of what was done well and why it mattered
      - timely recognition
      - choosing a private or public setting deliberately
      - linking recognition to growth or review evidence
      - recognising less visible work
    rubric:
      excellent: Gives a recent example of specific, timely recognition tied to impact, chooses the setting deliberately and records it as evidence for growth or reviews.
      good: Gives specific recognition with an example, but does not connect it to growth or less visible work.
      weak: Recognition is generic praise or limited to shipping announcements.
    followups:
      - How do you make sure the same few people are not always the ones recognised?
      - Where does that recognition end up at review time?
    common_errors:
      - Praise so general that the person cannot tell what to repeat.

  - external_key: managerial.performance_feedback.feedback_cadence_team
    competency_key: people_management
    topic: Building a feedback rhythm
    difficulty: medium
    text: >-
      How do you make sure feedback on your team happens continuously rather than piling up for the review
      cycle? Describe the habits or mechanisms you have put in place.
    expected_concepts:
      - regular feedback slots in one-to-ones
      - lightweight written notes captured as work happens
      - project retrospectives with individual reflections
      - encouraging peer feedback
      - checking that nothing in the formal review is new to the person
    rubric:
      excellent: Describes concrete, sustained mechanisms such as running notes, regular feedback check-ins and peer input, with a clear test that reviews contain no surprises.
      good: Has some regular habits, though they depend mostly on memory or good intentions.
      weak: Feedback happens mainly at review time or only when something goes wrong.
    followups:
      - How do you capture feedback you hear from other teams?
      - What did your last review cycle tell you about whether this works?
    common_errors:
      - Assuming an open-door policy counts as a feedback process.

  - external_key: managerial.performance_feedback.feedback_to_strong_performer
    competency_key: mentoring
    topic: Constructive feedback for a top performer
    difficulty: medium
    text: >-
      Strong performers often get mostly praise. Tell me about a time you gave meaningful developmental feedback to
      one of the strongest people on your team. What was it about, and what changed?
    expected_concepts:
      - identifying the next-level gap rather than current-level issues
      - specific examples from their recent work
      - framing feedback around their goals
      - agreeing a concrete development step
      - observed growth afterwards
    rubric:
      excellent: Identifies a specific next-level gap in a strong performer, ties it to their goals with examples and shows how the feedback led to observable growth.
      good: Gives developmental feedback with an example, but the link to next-level growth is loose.
      weak: Says strong performers need little feedback, or offers only praise.
    followups:
      - How did they respond at first?
      - How did you know the feedback made a difference?
    common_errors:
      - Neglecting top performers because they are not causing problems.

  - external_key: managerial.performance_feedback.feedback_to_more_experienced
    competency_key: communication
    topic: Feedback to someone more experienced than you
    difficulty: hard
    text: >-
      Tell me about a time you had to give critical feedback to someone with more experience or seniority than you
      in the area being discussed. How did you approach it, and how did it go?
    expected_concepts:
      - grounding feedback in observed impact rather than expertise
      - preparation with concrete examples
      - acknowledging their expertise while being direct
      - inviting their view and adjusting where they were right
      - agreed outcome and later follow-up
    rubric:
      excellent: Describes direct, evidence-based feedback focused on impact, respectful of the other person's expertise, open to their perspective and with a clear resulting change.
      good: Gives a real example with reasonable framing, but hedges the message or lacks a clear outcome.
      weak: Avoided the conversation, escalated instead of speaking directly, or framed it as a personal judgement.
    followups:
      - What would you have done if they had dismissed the feedback?
      - What did you learn from their perspective?
    common_errors:
      - Softening the message so much that the core issue is lost.

  - external_key: managerial.performance_feedback.feedback_without_authority
    competency_key: collaboration
    topic: Feedback when you are not the manager
    difficulty: medium
    text: >-
      As a tech lead or project manager you often coordinate people who don't report to you. How do you give
      feedback on someone's work in that situation, and how does it reach their actual manager? Give me an example.
    expected_concepts:
      - direct feedback to the person first
      - focus on the shared project outcome
      - agreed way of sharing input with the line manager
      - transparency about what is shared
      - balanced input including strengths
    rubric:
      excellent: Gives direct feedback on project impact first, describes a transparent, agreed path to share balanced input with the manager and a concrete example of how it helped.
      good: Gives feedback directly with an example, but the link to the line manager is ad hoc.
      weak: Goes straight to the manager without speaking to the person, or avoids feedback because they lack authority.
    followups:
      - How did the person's manager use your input?
      - What if the person disagreed with your view?
    common_errors:
      - Sharing only negative observations with the manager.

  - external_key: managerial.performance_feedback.written_vs_spoken_feedback
    competency_key: communication
    topic: Choosing the medium for feedback
    difficulty: easy
    text: >-
      How do you decide whether feedback should be given in a conversation, in writing, or both? Walk me through a
      recent case where that choice mattered.
    expected_concepts:
      - conversation first for nuanced or sensitive topics
      - written follow-up for clarity and record keeping
      - matching the medium to urgency and audience
      - avoiding critical feedback in public channels
      - considering distributed or asynchronous teams
    rubric:
      excellent: Explains clear reasoning for choosing the medium, gives a specific example and shows how a written summary reinforced a conversation where it was needed.
      good: Gives sensible rules of thumb with a modest example.
      weak: Uses one medium for everything or gives critical feedback in group chats.
    followups:
      - How do you handle feedback for someone in a very different time zone?
      - When has a written note backfired?
    common_errors:
      - Delivering serious concerns only by message to avoid a difficult conversation.

  - external_key: managerial.performance_feedback.feedback_not_landing
    competency_key: people_management
    topic: When feedback does not lead to change
    difficulty: medium
    text: >-
      Tell me about a time you gave someone the same feedback more than once and nothing changed. What did you do
      differently the second or third time?
    expected_concepts:
      - checking whether the original message was clear and specific
      - exploring obstacles or skill gaps
      - making expectations and consequences explicit
      - writing down agreed actions and dates
      - escalating to a formal plan when needed
    rubric:
      excellent: Reflects on why the first attempt failed, changes the approach with clearer expectations and support, documents agreements and shows a resolution either way.
      good: Shows a reasonable escalation path with an example, but limited reflection on their own delivery.
      weak: Simply repeated the same message or gave up on the issue.
    followups:
      - At what point did you decide this needed a formal process?
      - How did you know whether the gap was skill or priorities?
    common_errors:
      - Assuming the person is ignoring feedback without checking whether it was understood.

  - external_key: managerial.performance_feedback.feedback_in_code_review
    competency_key: mentoring
    topic: Using code and design reviews for growth
    difficulty: medium
    text: >-
      Code and design reviews are a constant source of feedback. How have you used them deliberately to help
      someone improve, rather than just to approve or reject changes?
    expected_concepts:
      - identifying recurring patterns across reviews
      - explaining reasoning, not just requesting changes
      - moving repeated themes into a one-to-one conversation
      - pairing or examples to model the skill
      - tracking improvement over several reviews
    rubric:
      excellent: Gives an example of spotting a pattern across reviews, taking it into a focused coaching conversation, modelling the skill and seeing measurable improvement.
      good: Uses review comments to explain reasoning and coach, with a reasonable example.
      weak: Treats reviews as gatekeeping only, or relies on many small comments without addressing the pattern.
    followups:
      - How did you keep reviews from feeling like a performance evaluation?
      - What changed in their later pull requests?
    common_errors:
      - Leaving dozens of minor comments instead of naming the underlying skill gap.

  - external_key: managerial.performance_feedback.feedback_after_incident
    competency_key: people_management
    topic: Individual feedback after an incident
    difficulty: hard
    text: >-
      After a serious incident, a blameless review found that one engineer skipped a step in the release process.
      How do you handle individual feedback for that engineer while keeping the postmortem blameless?
    expected_concepts:
      - separating the blameless system review from individual coaching
      - examining why the process allowed the step to be skipped
      - private, factual conversation about the decision
      - fixing the process as the main remedy
      - consistency with how others were treated in similar cases
    rubric:
      excellent: Keeps the postmortem blameless and system-focused, holds a separate private coaching conversation grounded in facts and treats the process gap as the main fix.
      good: Handles both sides reasonably, but the line between system and individual feedback is blurry.
      weak: Singles the engineer out publicly, or avoids any individual conversation.
    followups:
      - When would a pattern like this become a performance issue?
      - How would you explain your approach to the wider team?
    common_errors:
      - Turning a process failure into a judgement about one person.

  - external_key: managerial.performance_feedback.receiving_upward_feedback
    competency_key: leadership
    topic: Asking for feedback on your own management
    difficulty: easy
    text: >-
      How do you get feedback from your team about your own management, and can you tell me about something you
      changed because of it?
    expected_concepts:
      - specific, regular prompts rather than open-ended requests
      - anonymous or indirect channels where helpful
      - acting visibly on what is heard
      - closing the loop with the team
      - concrete change in their behaviour
    rubric:
      excellent: Describes a deliberate method for getting candid upward feedback, a specific change they made and how they confirmed the change helped.
      good: Asks for feedback regularly and gives an example of a change, though the method is informal.
      weak: Assumes people would tell them, or cannot name anything they changed.
    followups:
      - Why do you think people felt able to say that?
      - What feedback did you decide not to act on, and why?
    common_errors:
      - Asking "any feedback for me?" and treating silence as approval.

  - external_key: managerial.performance_feedback.feedback_distributed_team
    competency_key: communication
    topic: Feedback in a distributed team
    difficulty: medium
    text: >-
      When your team is spread across locations and time zones, what do you do differently to make sure everyone
      gets regular, fair feedback? Give me an example from a team you managed.
    expected_concepts:
      - rotating meeting times or using asynchronous written feedback
      - avoiding a bias toward people in the manager's location
      - making work visible through documents and demos
      - deliberate check-ins with less visible team members
      - consistent standards across locations
    rubric:
      excellent: Describes concrete practices that equalise feedback across locations, recognises proximity bias and gives evidence that remote members received comparable feedback.
      good: Has reasonable practices with an example, but does not address visibility bias directly.
      weak: Feedback depends on who the manager happens to see most.
    followups:
      - How did you notice whether someone was getting less feedback?
      - How did reviews compare across locations?
    common_errors:
      - Judging contribution by visibility in meetings.

  - external_key: managerial.performance_feedback.behaviour_feedback_impact
    competency_key: people_management
    topic: Addressing behaviour that affects others
    difficulty: hard
    text: >-
      Tell me about a time a high-output engineer was behaving in ways that hurt the rest of the team, for example
      dismissive code reviews or excluding others from decisions. How did you address it?
    expected_concepts:
      - treating team impact as part of performance
      - specific examples of the behaviour and its effect
      - clear expectation of change with a timeline
      - support and follow-up observations
      - willingness to act even with strong individual output
    rubric:
      excellent: Treats collaboration as part of performance, gives specific behaviours and their impact, sets clear expectations with follow-up and accepts consequences regardless of output.
      good: Addresses the behaviour with examples and some follow-up, but hesitates on consequences.
      weak: Tolerates the behaviour because of the person's output or describes it as a clash of styles.
    followups:
      - How did you gather evidence beyond your own observations?
      - How did you rebuild trust with the people affected?
    common_errors:
      - Describing the issue as personal traits instead of observable behaviour.

  - external_key: managerial.performance_feedback.feedback_fear_of_reaction
    competency_key: communication
    topic: Preparing for a difficult conversation
    difficulty: easy
    text: >-
      Before a feedback conversation you expect to be difficult, how do you prepare? Walk me through how you
      prepared for a specific one.
    expected_concepts:
      - clear statement of the key message
      - specific examples and their impact
      - anticipating the other person's perspective
      - planning the desired outcome and next steps
      - choosing time and setting appropriately
    rubric:
      excellent: Describes concrete preparation for a real conversation including the core message, evidence, likely responses and the agreed next step, and reflects on how the preparation helped.
      good: Prepares key points and examples, with a real example but less thought about the other person's view.
      weak: Does not prepare or relies on improvising.
    followups:
      - What happened that you had not prepared for?
      - How did you open the conversation?
    common_errors:
      - Scripting the whole conversation and leaving no room for the other side.

  - external_key: managerial.performance_feedback.feedback_misunderstood
    competency_key: communication
    topic: Recovering when feedback is misunderstood
    difficulty: medium
    text: >-
      Tell me about a time feedback you gave was misunderstood or taken in a way you did not intend. How did you
      find out, and how did you repair it?
    expected_concepts:
      - noticing the misunderstanding through follow-up
      - owning the unclear delivery
      - restating the message with specific examples
      - confirming shared understanding
      - changing how they deliver feedback afterwards
    rubric:
      excellent: Describes how they detected the misunderstanding, owned it, clarified with specifics, confirmed understanding and changed their practice.
      good: Clarified the feedback with a real example, but limited change to their approach.
      weak: Blames the receiver for misunderstanding or never followed up.
    followups:
      - What would you now do at the end of a feedback conversation?
      - How long did it take to notice?
    common_errors:
      - Assuming silence means agreement.

  - external_key: managerial.performance_feedback.project_manager_team_feedback
    competency_key: project_management
    topic: Feedback loops in delivery work
    difficulty: medium
    text: >-
      In a project you ran, how did you give the team feedback on how they were working together, not just on
      what they delivered? What changed as a result?
    expected_concepts:
      - retrospectives with concrete, actionable outcomes
      - using delivery data such as cycle time or carry-over as discussion input
      - feedback on collaboration and handoffs
      - owners and follow-up for agreed actions
      - measurable change in how the team worked
    rubric:
      excellent: Describes a concrete feedback mechanism on ways of working, uses data as a prompt rather than a score and shows a measurable improvement from agreed actions.
      good: Runs retrospectives and gives an example, but actions or results are vague.
      weak: Feedback is limited to deadline reminders or status reports.
    followups:
      - Which retrospective action actually stuck?
      - How did you keep metrics from becoming a target?
    common_errors:
      - Retrospectives that produce the same list of actions every time.

  - external_key: managerial.performance_feedback.feedback_on_communication_skills
    competency_key: mentoring
    topic: Coaching a non-technical skill
    difficulty: medium
    text: >-
      Tell me about a time you coached someone on a skill that wasn't technical, such as writing design documents,
      running meetings or explaining trade-offs to stakeholders. How did you approach it?
    expected_concepts:
      - specific observed gap with examples
      - breaking the skill into practicable parts
      - safe opportunities to practise
      - feedback after each attempt
      - observable improvement over time
    rubric:
      excellent: Names a specific non-technical skill gap, breaks it down, creates practice opportunities with structured feedback and shows clear improvement.
      good: Gives a reasonable coaching example with some improvement, though practice or feedback loops are loose.
      weak: Tells the person to improve without concrete help, or gives no real example.
    followups:
      - How did you measure progress on something so qualitative?
      - What would you do if they did not want to work on it?
    common_errors:
      - Judging style rather than the clarity or effectiveness of the work.

  - external_key: managerial.performance_feedback.feedback_culture_new_team
    competency_key: leadership
    topic: Building a feedback culture on a new team
    difficulty: hard
    text: >-
      Suppose you take over a team where nobody gives each other feedback and reviews have always been a formality.
      What would you do in your first few months to change that, and how would you know it was working?
    expected_concepts:
      - modelling by asking for and acting on feedback first
      - small, low-stakes feedback habits
      - clear expectations that feedback is part of everyone's job
      - mechanisms such as retrospectives and peer input
      - indicators such as fewer review surprises and more peer feedback
    rubric:
      excellent: Lays out a staged plan starting with modelling, introduces low-stakes habits and mechanisms, sets expectations and names concrete signals of progress.
      good: Has a reasonable plan with some mechanisms, but no clear way to measure progress.
      weak: Announces a new feedback process or tool and expects behaviour to change.
    followups:
      - What would you do if a senior engineer resisted?
      - Which signal would tell you the change had taken hold?
    common_errors:
      - Introducing a mandatory form before people trust the process.
