# Managerial round: performance management and feedback (part 3 of 4).
# Focus: growth plans, career development, promotions, stretch work and goal setting.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ growth plans
  - external_key: managerial.performance_feedback.growth_plan_creation
    competency_key: mentoring
    topic: Building an individual growth plan
    difficulty: easy
    text: >-
      Walk me through how you built a growth plan with someone on your team. What went into it, and how did you
      keep it alive after the first conversation?
    expected_concepts:
      - starting from the person's own goals
      - mapping goals to specific skills or level expectations
      - concrete actions and opportunities, not just training
      - regular review points
      - adjusting the plan as circumstances change
    rubric:
      excellent: Describes a plan anchored in the person's goals, tied to concrete skills and real work opportunities, with regular reviews and evidence it was used.
      good: Builds a reasonable plan with the person, but follow-up is irregular.
      weak: Growth plans are a form filled once a year or a list of courses.
    followups:
      - What part of the plan worked best?
      - How often did you revisit it?
    common_errors:
      - Writing the plan for the person instead of with them.

  - external_key: managerial.performance_feedback.unclear_career_goals
    competency_key: mentoring
    topic: Helping someone without clear career goals
    difficulty: medium
    text: >-
      Some people on a team don't know what they want next in their career. How have you helped someone in that
      position work out a direction? Tell me what you actually did.
    expected_concepts:
      - exploring what work energises them and what they avoid
      - exposing them to different kinds of work through small experiments
      - discussing several possible paths without pushing one
      - reflection after each experiment
      - agreeing a short-term focus while the direction forms
    rubric:
      excellent: Uses structured exploration and small, real work experiments, reflects with the person after each and helps them settle on a concrete near-term focus.
      good: Holds helpful exploratory conversations with an example, but little hands-on experimentation.
      weak: Pushes a default path such as management or the next level without exploring.
    followups:
      - How did you avoid steering them toward what the team needed?
      - What did they end up choosing?
    common_errors:
      - Equating growth only with promotion.

  - external_key: managerial.performance_feedback.stretch_assignment
    competency_key: leadership
    topic: Using stretch assignments for growth
    difficulty: medium
    text: >-
      Tell me about a time you gave someone a stretch assignment that was clearly beyond their current level. How
      did you choose it, support them and manage the risk to delivery?
    expected_concepts:
      - matching the assignment to a specific growth goal
      - explaining expectations and the reason for the stretch
      - safety net such as a mentor or regular check-ins
      - managing delivery risk for the wider project
      - debrief and feedback afterwards
    rubric:
      excellent: Chooses the assignment deliberately for a growth goal, provides the right support and safety net, manages delivery risk and debriefs to turn it into growth evidence.
      good: Gives a reasonable stretch example with support, but delivery risk or debrief is thin.
      weak: Throws someone in without support, or never gives stretch work because of delivery risk.
    followups:
      - What would you have done if it started going badly?
      - How did it show up in their next review?
    common_errors:
      - Taking the work back at the first sign of difficulty.

  - external_key: managerial.performance_feedback.growth_vs_team_needs
    competency_key: people_management
    topic: Balancing growth with team needs
    difficulty: hard
    text: >-
      An engineer wants to grow in an area your team doesn't really need right now, while the team badly needs them
      on the work they already do well. How would you handle that conversation and decision?
    expected_concepts:
      - understanding the person's goal and timeline
      - being clear about the team's constraints
      - finding partial or time-boxed opportunities
      - considering opportunities on other teams
      - agreeing an explicit plan with review points
    rubric:
      excellent: States both the person's goals and the team's needs clearly, finds creative partial options including other teams, and agrees an explicit, time-bound plan.
      good: Finds a reasonable compromise, but the plan is vague or open-ended.
      weak: Ignores the person's goals or makes promises that cannot be kept.
    followups:
      - When would you support them moving to another team?
      - How would you keep the arrangement from drifting?
    common_errors:
      - Keeping strong people stuck in one area because it is convenient for the team.

  - external_key: managerial.performance_feedback.learning_budget_use
    competency_key: mentoring
    topic: Making learning time count
    difficulty: easy
    text: >-
      If your team has time or budget for learning, how do you make sure it turns into real improvement in their
      work rather than courses that are quickly forgotten?
    expected_concepts:
      - tying learning to a specific goal or upcoming work
      - applying the learning soon in a real task
      - sharing back with the team
      - following up on what changed
      - mixing formal learning with mentoring and practice
    rubric:
      excellent: Links learning to specific goals, ensures quick application in real work, shares it with the team and follows up on impact.
      good: Connects learning to goals with some follow-up.
      weak: Approves courses without any link to work or follow-up.
    followups:
      - Give me an example where it worked well.
      - What do you do if someone never uses their learning time?
    common_errors:
      - Measuring learning by courses completed.

  - external_key: managerial.performance_feedback.mentoring_pairing
    competency_key: mentoring
    topic: Setting up mentoring relationships
    difficulty: easy
    text: >-
      How do you decide when someone on your team would benefit from a mentor other than you, and how do you set
      that up so it is actually useful?
    expected_concepts:
      - identifying a specific skill or perspective gap
      - choosing a mentor with relevant strengths
      - clear goals and a suggested cadence
      - checking in on whether it is helping
      - recognising the mentor's contribution
    rubric:
      excellent: Matches mentors to specific needs, sets clear goals and cadence, checks effectiveness and recognises the mentor's work.
      good: Sets up mentoring sensibly with some goals.
      weak: Assigns mentors randomly or leaves it entirely to the individuals.
    followups:
      - What do you do if the pairing isn't working?
      - How do you avoid overloading your best mentors?
    common_errors:
      - Setting up a mentor without any defined purpose.

  # ------------------------------------------------------------ goals
  - external_key: managerial.performance_feedback.individual_goal_setting
    competency_key: people_management
    topic: Setting individual goals
    difficulty: easy
    text: >-
      How do you set individual goals with people on your team so that they connect to the team's priorities but
      still belong to the person? Give me an example of a goal you set together.
    expected_concepts:
      - linking goals to team or organisational priorities
      - including growth goals as well as delivery goals
      - specific and observable outcomes
      - co-creating with the person
      - revisiting goals when priorities shift
    rubric:
      excellent: Gives a concrete goal that connects team priorities with the person's growth, is specific and observable, and was revisited as things changed.
      good: Sets reasonable goals with an example, though they lean toward delivery only.
      weak: Goals are vague or simply copied from the team roadmap.
    followups:
      - What happened when priorities changed mid-year?
      - How did that goal show up in their review?
    common_errors:
      - Goals that measure activity rather than outcomes.

  - external_key: managerial.performance_feedback.goals_changed_midcycle
    competency_key: project_management
    topic: Goals invalidated by a change in priorities
    difficulty: medium
    text: >-
      Halfway through the year your team's priorities change completely after a reorganisation, and most of the
      individual goals no longer make sense. How would you handle goals and evaluation for the rest of the cycle?
    expected_concepts:
      - resetting goals promptly and explicitly
      - recording work done against the old goals
      - assessing people on adaptability and new outcomes
      - aligning with calibration on how to treat the change
      - communicating clearly with each person
    rubric:
      excellent: Resets goals quickly with each person, preserves evidence from the first half, agrees with leadership how the change will be treated and communicates clearly.
      good: Resets goals sensibly, but little thought about evaluating the first half.
      weak: Keeps evaluating against obsolete goals or drops goals entirely.
    followups:
      - How would you treat someone whose main project was cancelled?
      - What would you write down at the moment of the change?
    common_errors:
      - Penalising people for goals that the organisation abandoned.

  # ------------------------------------------------------------ promotions
  - external_key: managerial.performance_feedback.promotion_case_building
    competency_key: people_management
    topic: Building a promotion case
    difficulty: medium
    text: >-
      Tell me about a promotion case you built for someone on your team. How did you decide they were ready, and how
      did you put the case together?
    expected_concepts:
      - sustained performance at the next level, not potential alone
      - specific examples mapped to next-level expectations
      - input from peers and partners
      - addressing likely objections in advance
      - outcome and what happened afterwards
    rubric:
      excellent: Shows sustained next-level evidence mapped to expectations, gathers supporting input, anticipates objections and describes the outcome.
      good: Builds a reasonable case with examples, but less mapping to the level or anticipation of objections.
      weak: Bases the case on tenure, effort or a single project.
    followups:
      - What was the weakest part of the case?
      - How long had they been operating at that level?
    common_errors:
      - Promoting for potential rather than demonstrated work.

  - external_key: managerial.performance_feedback.promotion_not_ready
    competency_key: communication
    topic: Telling someone they are not ready
    difficulty: medium
    text: >-
      Someone on your team asks to be put forward for promotion, and you don't believe they are ready yet. How do
      you have that conversation? Tell me about a time you did.
    expected_concepts:
      - clear and direct answer early in the conversation
      - specific gaps against next-level expectations
      - acknowledging their strengths and progress
      - concrete plan and opportunities to close gaps
      - agreed timeline for reassessment
    rubric:
      excellent: Gives a clear answer, explains specific gaps against expectations, recognises progress and agrees a concrete plan with a reassessment date.
      good: Explains the decision with some specifics and development suggestions.
      weak: Gives a vague maybe-next-time answer or blames the process.
    followups:
      - How did they respond?
      - Did they get promoted later, and what changed?
    common_errors:
      - Avoiding a clear no, which leads to repeated disappointment.

  - external_key: managerial.performance_feedback.promotion_rejected_by_committee
    competency_key: stakeholder_management
    topic: Promotion turned down by a committee
    difficulty: hard
    text: >-
      Tell me about a time a promotion you strongly supported was turned down by a committee or senior leader. How
      did you handle it with them and with the person?
    expected_concepts:
      - understanding the specific reasons for the decision
      - re-examining your own case for gaps
      - owning the message to the person without undermining the decision-makers
      - turning feedback into a concrete plan
      - improving how future cases are built
    rubric:
      excellent: Seeks and understands the reasons, critically re-examines their own case, delivers the outcome without blaming the committee and builds a concrete path forward.
      good: Handles both sides reasonably, though limited reflection on their own case.
      weak: Criticises the committee to the employee or does not follow up.
    followups:
      - Did you agree with the decision in the end?
      - What did you change in later promotion cases?
    common_errors:
      - Promising the employee the next attempt will succeed.

  - external_key: managerial.performance_feedback.promotion_to_management
    competency_key: leadership
    topic: Moving someone into management
    difficulty: medium
    text: >-
      An excellent senior engineer tells you they want to move into management. How would you assess whether it is
      a good move and help them test it before committing?
    expected_concepts:
      - understanding their motivation and what they expect the job to be
      - trial opportunities such as leading a project or mentoring
      - feedback from people they lead in those trials
      - clarity that management is a different job, not a promotion
      - keeping a path back to individual work
    rubric:
      excellent: Explores motivations, sets up real trial opportunities with feedback from those led, frames management as a different role and keeps the return path open.
      good: Supports trial opportunities with sensible conversation, but less structure for feedback.
      weak: Moves them into management as a reward for technical work.
    followups:
      - What signals would make you advise against it?
      - How would you support them in the first months?
    common_errors:
      - Treating management as the only route to seniority.

  - external_key: managerial.performance_feedback.level_up_staff
    competency_key: mentoring
    topic: Growing a senior engineer toward staff level
    difficulty: hard
    text: >-
      A strong senior engineer has been at the same level for a while and wants to reach staff level. What would you
      actually do over the next year to help them get there?
    expected_concepts:
      - clarifying what staff impact means in this organisation
      - finding problems with cross-team scope
      - sponsorship and visibility with senior leaders
      - coaching on influence and written communication
      - regular check-ins against a promotion-ready picture
    rubric:
      excellent: Defines staff-level impact concretely, finds or creates cross-team scope, actively sponsors the person and coaches on influence with regular progress checks.
      good: Gives a sensible plan with some opportunities, but limited sponsorship or scope creation.
      weak: Suggests they keep doing great work and wait, or focuses only on technical depth.
    followups:
      - How would you find the right scope if none exists on your team?
      - What would you do if they did not get there within the year?
    common_errors:
      - Treating staff level as more of the same senior work.

  - external_key: managerial.performance_feedback.promotion_equity_check
    competency_key: people_management
    topic: Auditing past promotion outcomes
    difficulty: hard
    text: >-
      Looking back over several promotion cycles in your group, how would you check whether promotions were decided
      consistently, and what would you do if you found that some people had waited much longer than others for the
      same level of impact?
    expected_concepts:
      - comparing time-in-level and evidence across promoted and not-yet-promoted people
      - looking at how cases were written and who sponsored them
      - checking access to promotion-relevant work as a root cause
      - working through the formal people process to review patterns
      - concrete corrective actions such as revisiting cases and changing how scope is assigned
    rubric:
      excellent: Proposes a concrete, evidence-based review of past outcomes, looks for root causes in case-writing and access to scope, works through the formal process and names specific corrective actions.
      good: Suggests a reasonable review and some fixes, but stays at the level of individual cases.
      weak: Assumes past promotions were fair because each one was approved, or proposes no way to check.
    followups:
      - Which data would you need, and who would you involve?
      - How would you handle someone who should have been promoted earlier?
    common_errors:
      - Treating each promotion as an isolated decision and never looking at the pattern.

  - external_key: managerial.performance_feedback.post_promotion_support
    competency_key: mentoring
    topic: Supporting someone after a promotion
    difficulty: medium
    text: >-
      After someone on your team is promoted, what do you do to help them succeed at the new level? Tell me about a
      time this mattered.
    expected_concepts:
      - resetting expectations to the new level
      - adjusting scope and responsibilities
      - early feedback on new-level work
      - helping them let go of old responsibilities
      - watching for overload in the transition
    rubric:
      excellent: Resets expectations and scope deliberately, gives early feedback on new-level work and manages the transition of old responsibilities, with an example.
      good: Offers support and some reset of expectations.
      weak: Treats the promotion as the finish line.
    followups:
      - What did they struggle with first?
      - How did their workload change?
    common_errors:
      - Adding new-level responsibilities without removing any old ones.

  # ------------------------------------------------------------ development approaches
  - external_key: managerial.performance_feedback.delegation_for_growth
    competency_key: leadership
    topic: Delegating to develop people
    difficulty: medium
    text: >-
      Tell me about something you used to do yourself that you deliberately handed to someone on your team so they
      could grow. How did you hand it over, and how did it go?
    expected_concepts:
      - choosing the task for the person's growth goal
      - clear outcome and decision rights
      - support without taking the work back
      - feedback during and after
      - what the manager did with the freed time
    rubric:
      excellent: Chooses delegated work for growth, sets clear decision rights, supports without micromanaging and gives feedback, with a concrete outcome.
      good: Delegates with a reasonable example, but decision rights or feedback are fuzzy.
      weak: Delegates only low-value tasks or keeps checking every detail.
    followups:
      - What did they do differently from how you would have?
      - When did you have to resist stepping in?
    common_errors:
      - Delegating tasks without the authority to make decisions about them.

  - external_key: managerial.performance_feedback.coaching_vs_telling
    competency_key: mentoring
    topic: Coaching versus giving answers
    difficulty: easy
    text: >-
      When someone on your team brings you a problem, how do you decide whether to coach them toward an answer or
      just tell them what to do? Give me an example of each.
    expected_concepts:
      - urgency and risk of the situation
      - the person's experience and growth goals
      - asking questions to draw out their thinking
      - explaining reasoning when giving direction
      - reflecting afterwards on what they learned
    rubric:
      excellent: Gives clear criteria for choosing, a concrete example of each and evidence that coaching led to growth.
      good: Explains a sensible balance with at least one example.
      weak: Always gives answers, or always coaches regardless of urgency.
    followups:
      - When did coaching take too long?
      - How did the person change over time?
    common_errors:
      - Asking leading questions when they already have a fixed answer in mind.

  - external_key: managerial.performance_feedback.skill_matrix_team
    competency_key: people_management
    topic: Planning team skill development
    difficulty: medium
    text: >-
      How do you look at the skills across your whole team to decide where people should grow, and how does that
      connect to individual growth plans?
    expected_concepts:
      - mapping current skills against upcoming needs
      - identifying single points of knowledge
      - matching gaps to individuals' interests
      - rotation, pairing or ownership changes
      - revisiting the picture periodically
    rubric:
      excellent: Maps skills against future needs, spots single points of knowledge, links gaps to individual interests and uses concrete mechanisms such as rotation.
      good: Has a reasonable view of team skills, with a looser link to individuals.
      weak: Plans development individually without considering team needs, or has no view at all.
    followups:
      - Which gap did you close this way?
      - How did you handle a gap nobody wanted to fill?
    common_errors:
      - Using a skills grid as a performance ranking.

  - external_key: managerial.performance_feedback.growth_conversation_frequency
    competency_key: people_management
    topic: Keeping career conversations separate
    difficulty: easy
    text: >-
      How do you keep career and growth conversations from getting crowded out by day-to-day delivery work?
    expected_concepts:
      - dedicated career conversations on a regular schedule
      - written notes and agreed actions
      - linking growth actions to real project assignments
      - protecting the time during busy periods
      - letting the person drive the agenda
    rubric:
      excellent: Describes a dedicated, protected rhythm with notes and actions, linked to real work assignments, with an example of it holding through a busy period.
      good: Holds growth conversations regularly, though they slip under pressure.
      weak: Discusses growth only at review time.
    followups:
      - How often do you hold them?
      - What happened during your last crunch period?
    common_errors:
      - Assuming growth happens on its own through project work.

  - external_key: managerial.performance_feedback.growth_measurement
    competency_key: mentoring
    topic: Knowing whether someone is growing
    difficulty: medium
    text: >-
      How do you tell whether someone on your team is actually growing over a year, beyond them simply saying they
      feel they have learned a lot?
    expected_concepts:
      - comparing scope and complexity of work over time
      - independence and decisions made without help
      - feedback from peers and partners
      - progress against the growth plan
      - examples of teaching others
    rubric:
      excellent: Uses several observable signals such as scope, independence and peer feedback compared over time, with a concrete example.
      good: Uses a couple of reasonable signals with an example.
      weak: Relies on the person's own impression or on tenure.
    followups:
      - Who grew most on your team last year, and how did you know?
      - What signal turned out to be misleading?
    common_errors:
      - Confusing being busy with growing.

  - external_key: managerial.performance_feedback.plateaued_engineer
    competency_key: people_management
    topic: Re-engaging a plateaued senior engineer
    difficulty: hard
    text: >-
      Tell me about a time a capable, experienced engineer on your team had stopped growing and their impact had
      flattened. How did you raise it, and what came of it?
    expected_concepts:
      - noticing the plateau through evidence
      - direct conversation about expectations at their level
      - understanding what would re-engage them in the work
      - new scope or challenge tied to clear outcomes
      - follow-up and result
    rubric:
      excellent: Raises the plateau directly with evidence, explores what would re-engage them in the work, offers concrete new scope with clear outcomes and shows the result.
      good: Raises the issue with some new opportunities, but the expectations or follow-up are loose.
      weak: Leaves it alone because the person is still meeting the minimum.
    followups:
      - What if they were content at their level?
      - How did you separate a plateau from a performance problem?
    common_errors:
      - Treating staying at a level as automatically a problem.

  - external_key: managerial.performance_feedback.feedback_career_path_ic
    competency_key: leadership
    topic: Supporting the senior individual-contributor path
    difficulty: medium
    text: >-
      How have you helped someone grow into a senior individual-contributor role with real influence, without them
      needing to become a manager? Give me a concrete example.
    expected_concepts:
      - defining influence and scope for the role
      - giving decision ownership in technical areas
      - creating forums for their leadership such as design reviews
      - sponsorship with senior stakeholders
      - recognition of that path in reviews and promotions
    rubric:
      excellent: Gives a concrete example of creating ownership, forums and sponsorship for a senior individual contributor and shows the influence they gained.
      good: Supports the path with some opportunities and an example.
      weak: Sees the individual path mainly as staying technical without added influence.
    followups:
      - How did you split responsibilities between yourself and them?
      - How did others in the organisation come to see their role?
    common_errors:
      - Expecting senior individual contributors to lead without any authority or forum.

  - external_key: managerial.performance_feedback.retention_high_performer
    competency_key: people_management
    topic: Keeping a high performer engaged
    difficulty: hard
    text: >-
      One of your strongest engineers tells you they are considering leaving because they feel they are not growing.
      What would you do in the following weeks?
    expected_concepts:
      - listening to understand the specific gaps
      - reflecting on what the manager missed
      - concrete opportunities that can actually be delivered
      - involving leadership where scope or level changes are needed
      - respecting their decision whichever way it goes
    rubric:
      excellent: Understands the specific growth gaps, owns any missed signals, offers concrete deliverable opportunities with a timeline and respects the person's choice.
      good: Responds with reasonable opportunities, but little reflection on what was missed.
      weak: Makes vague promises or reacts only with compensation talk.
    followups:
      - What signals might you have missed before this conversation?
      - What would you do if you had nothing to offer on your team?
    common_errors:
      - Promising scope or promotions they cannot guarantee.

  - external_key: managerial.performance_feedback.project_manager_growth_team
    competency_key: project_management
    topic: Growing people through project roles
    difficulty: medium
    text: >-
      As a project manager or delivery lead, how have you used project roles, such as workstream owner or release
      coordinator, to help team members develop? Tell me about one person in particular.
    expected_concepts:
      - matching the role to the person's development goal
      - clear responsibilities and support
      - feedback during and after the project
      - sharing observations with their line manager
      - impact on the person and the project
    rubric:
      excellent: Matches a project role to a growth goal, sets clear responsibilities with support, gives feedback and shares it with the line manager, with a concrete outcome.
      good: Gives a reasonable example of using project roles for growth.
      weak: Assigns roles purely by availability.
    followups:
      - How did the line manager use what you shared?
      - What did the person find hardest?
    common_errors:
      - Not telling the line manager about growth they observed.

  - external_key: managerial.performance_feedback.feedback_on_estimates
    competency_key: project_management
    topic: Coaching someone on planning and estimates
    difficulty: easy
    text: >-
      Tell me about a time you helped someone on your team get better at planning and estimating their own work.
      What did you do?
    expected_concepts:
      - reviewing past estimates against actuals together
      - breaking work into smaller pieces
      - identifying unknowns and adding checkpoints
      - practice with feedback on each plan
      - visible improvement in accuracy or communication of risk
    rubric:
      excellent: Describes concrete coaching using past data, decomposition and risk identification, with visible improvement in planning or risk communication.
      good: Gives a reasonable example with some improvement.
      weak: Told the person to add buffer or estimated for them.
    followups:
      - How did you avoid making estimates feel like commitments they would be judged on?
      - How long did the improvement take?
    common_errors:
      - Treating every missed estimate as a performance failure.
