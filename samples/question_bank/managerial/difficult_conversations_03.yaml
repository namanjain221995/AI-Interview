# Curated questions: managerial round, difficult conversations (part 3 of 4). Delivering disappointing decisions: ratings, promotions, cancelled work, role changes and exits. Evaluation is based only on the content of the answer (observable work behaviour, never personal traits).
version: 1
defaults:
  role_tags:
  - engineering_manager
  - project_manager
  - tech_lead
  round_types:
  - managerial
  kind: leadership
questions:

- external_key: managerial.difficult_conversations.preparing_hard_conversation
  competency_key: communication
  topic: Preparing for a hard conversation
  difficulty: easy
  text: >-
    Think of the last conversation you knew would be hard to deliver. What did you do beforehand to be
    ready, and what would you add now?
  expected_concepts:
  - clarifying the purpose and key message
  - gathering facts and examples
  - thinking about their perspective
  - choosing setting and time
  - planning what support or next steps to offer
  rubric:
    excellent: >-
      Defines the purpose and key message, gathers facts, considers the other person's view, chooses setting
      and time and prepares next steps.
    good: Plans the message and examples.
    weak: Improvises.
  followups:
  - What do you write down beforehand?
  - How do you choose the setting?
  common_errors:
  - Walking in without a clear message or next steps.

- external_key: managerial.difficult_conversations.declining_an_idea
  competency_key: communication
  topic: Telling someone their idea won't go ahead
  difficulty: easy
  text: A team member proposes something you decide not to pursue. How do you tell them?
  expected_concepts:
  - acknowledging the effort
  - giving clear reasons
  - being direct about the decision
  - offering what could change it
  - encouraging future ideas
  rubric:
    excellent: >-
      Acknowledges the effort, gives clear reasons, is direct about the decision, says what could change
      it and encourages future ideas.
    good: Explains the decision and thanks them.
    weak: Ignores the proposal or gives vague reasons.
  followups:
  - What would change your answer?
  - How do you follow up?
  common_errors:
  - Ignores the proposal or gives vague reasons.

- external_key: managerial.difficult_conversations.good_news_with_caveats
  competency_key: communication
  topic: Sharing news that is partly good and partly bad
  difficulty: easy
  text: >-
    You need to tell someone they got part of what they asked for but not all. How do you frame the message?
  expected_concepts:
  - stating the decision clearly
  - the part that was approved
  - the part that was not and why
  - avoiding burying the main message
  - next steps
  rubric:
    excellent: >-
      States the decision clearly, separates what was approved from what was not, explains why, and gives
      next steps.
    good: Shares both parts with explanations.
    weak: Buries the refusal in positive talk.
  followups:
  - Which part do you say first?
  - How do you check they understood?
  common_errors:
  - Buries the refusal in positive talk.

- external_key: managerial.difficult_conversations.asking_for_feedback_on_delivery
  competency_key: adaptability
  topic: Learning how your hard messages land
  difficulty: easy
  text: >-
    How do you find out whether your difficult messages are coming across the way you intend?
  expected_concepts:
  - asking directly
  - noticing reactions
  - checking the understanding of key points
  - asking a trusted colleague
  - adjusting
  rubric:
    excellent: >-
      Asks directly, checks understanding of key points, seeks a trusted colleague's view and adjusts,
      with a concrete change made.
    good: Asks for feedback sometimes.
    weak: Assumes the message landed.
  followups:
  - What did you change?
  - Whom do you ask?
  common_errors:
  - Assumes the message landed.

- external_key: managerial.difficult_conversations.ending_with_next_steps
  competency_key: project_management
  topic: Closing a hard conversation
  difficulty: easy
  text: >-
    How do you end a difficult conversation so that the person leaves knowing what happens next?
  expected_concepts:
  - summarising what was said
  - agreeing specific next steps
  - dates and owners
  - offering support
  - follow-up message
  rubric:
    excellent: >-
      Summarises, agrees specific next steps with dates and owners, offers support and follows up in writing.
    good: Summarises and agrees next steps.
    weak: Ends abruptly.
  followups:
  - What goes in the follow-up?
  - When do you check back?
  common_errors:
  - Ends abruptly.

- external_key: managerial.difficult_conversations.listening_when_upset
  competency_key: communication
  topic: Staying useful when someone is upset about a decision
  difficulty: easy
  text: >-
    Someone is visibly upset about a decision you've delivered. What do you do in the conversation?
  expected_concepts:
  - letting them express their view
  - acknowledging the impact
  - not rushing to defend
  - separating what can and cannot change
  - offering to continue later
  rubric:
    excellent: >-
      Lets them speak, acknowledges the impact, does not rush to defend, is clear about what can and cannot
      change and offers to continue later.
    good: Listens and explains the decision.
    weak: Argues the decision again.
  followups:
  - What do you say first?
  - When do you pause the conversation?
  common_errors:
  - Argues the decision again.

- external_key: managerial.difficult_conversations.promotion_not_ready
  competency_key: mentoring
  topic: Telling someone they are not ready for promotion
  difficulty: medium
  text: >-
    A team member expects a promotion, and you've concluded they aren't ready yet. How do you have that
    conversation?
  expected_concepts:
  - being clear about the decision
  - evidence against the expectations of the next level
  - strengths acknowledged
  - a plan with specific gaps and support
  - timeline for review
  rubric:
    excellent: >-
      Is clear on the decision, shows evidence against next-level expectations, acknowledges strengths,
      sets a plan with specific gaps and support and a review timeline.
    good: Explains the decision and areas to develop.
    weak: Gives vague reasons or false hope.
  followups:
  - What evidence do you show?
  - How do you handle disagreement?
  common_errors:
  - Gives vague reasons or false hope.

- external_key: managerial.difficult_conversations.rating_lower_than_expected
  competency_key: leadership
  topic: Delivering a rating lower than someone expected
  difficulty: medium
  text: >-
    A team member's performance rating is lower than they expected. How do you explain it?
  expected_concepts:
  - giving the rating clearly
  - linking to evidence and expectations
  - hearing their view
  - explaining how the process works
  - agreeing development steps
  rubric:
    excellent: >-
      Gives the rating clearly, links to evidence and expectations, listens, explains the process and
      agrees development steps.
    good: Explains with examples.
    weak: Blames the process or avoids details.
  followups:
  - What if they disagree?
  - How did you prepare the evidence?
  common_errors:
  - Blames the process or avoids details.

- external_key: managerial.difficult_conversations.project_cancelled
  competency_key: communication
  topic: Telling a team their project is cancelled
  difficulty: medium
  text: >-
    A project the team has worked on for months is cancelled by leadership. How do you tell them and what
    do you do next?
  expected_concepts:
  - telling them quickly and directly
  - explaining the reason
  - acknowledging the work
  - what happens to people and assets
  - next opportunities
  rubric:
    excellent: >-
      Tells them quickly and directly, explains the reason, acknowledges the work, covers what happens
      to people and assets and next opportunities.
    good: Tells the team and explains.
    weak: Delays or presents it as good news.
  followups:
  - What happens to the work?
  - How did the team respond?
  common_errors:
  - Delays or presents it as good news.

- external_key: managerial.difficult_conversations.role_scope_reduced
  competency_key: leadership
  topic: Reducing someone's scope
  difficulty: medium
  text: >-
    You have to reduce the scope of someone's role because of a change in the organisation. How do you
    handle the conversation?
  expected_concepts:
  - explaining the reason
  - being clear on what changes
  - listening to concerns
  - looking for new opportunities
  - follow-up
  rubric:
    excellent: >-
      Explains the reason, is clear on the change, listens, looks for new opportunities and follows up.
    good: Explains and listens.
    weak: Announces it by message.
  followups:
  - What new opportunity did you find?
  - What did they ask?
  common_errors:
  - Announces it by message.

- external_key: managerial.difficult_conversations.reassigned_from_project
  competency_key: adaptability
  topic: Moving someone off a project they care about
  difficulty: medium
  text: >-
    You need to move a strong engineer off a project they care about to cover a more urgent need. How
    do you handle it?
  expected_concepts:
  - explaining the business reason
  - acknowledging their contribution
  - involving them in the transition
  - being clear about duration
  - offering something in return
  rubric:
    excellent: >-
      Explains the reason, acknowledges their work, involves them in the transition, is clear on duration
      and offers something in return.
    good: Explains and thanks them.
    weak: Just moves them.
  followups:
  - What did you offer?
  - How did they respond?
  common_errors:
  - Just moves them.

- external_key: managerial.difficult_conversations.internal_candidate_rejected
  competency_key: stakeholder_management
  topic: Telling an internal candidate they didn't get the role
  difficulty: medium
  text: >-
    An internal candidate applied for a role on your team and wasn't selected. How do you give them the
    news and feedback?
  expected_concepts:
  - telling them promptly and directly
  - evidence-based feedback against the role criteria
  - recognising strengths
  - development suggestions
  - keeping the relationship
  rubric:
    excellent: >-
      Tells them promptly, gives evidence-based feedback against criteria, recognises strengths, suggests
      development and keeps the relationship.
    good: Informs and gives feedback.
    weak: Sends a short rejection or avoids it.
  followups:
  - What feedback would you give?
  - How do you follow up later?
  common_errors:
  - Sends a short rejection or avoids it.

- external_key: managerial.difficult_conversations.probation_concerns
  competency_key: leadership
  topic: Raising concerns with a new hire early
  difficulty: medium
  text: >-
    A new hire is a few weeks in and isn't meeting the expectations set. How do you raise it?
  expected_concepts:
  - checking the expectations were clear
  - giving specific examples early
  - understanding obstacles
  - support plan
  - regular check-ins
  rubric:
    excellent: >-
      Checks the expectations were clear, gives specific examples early, explores obstacles, sets up support
      and holds regular check-ins.
    good: Raises concerns and supports.
    weak: Waits until the end of the period.
  followups:
  - What was your first check?
  - What support did you give?
  common_errors:
  - Waits until the end of the period.

- external_key: managerial.difficult_conversations.headcount_request_denied
  competency_key: stakeholder_management
  topic: Telling a team lead their staffing request was denied
  difficulty: medium
  text: >-
    A team lead asks for additional staff, and you have to say no. How do you handle the conversation?
  expected_concepts:
  - explaining the decision and criteria
  - acknowledging the need
  - exploring alternatives
  - being clear about what is possible
  - revisiting later
  rubric:
    excellent: >-
      Explains the decision and criteria, acknowledges the need, explores alternatives, is clear on what
      is possible and says when it can be revisited.
    good: Explains the decision and offers alternatives.
    weak: Says no without explanation.
  followups:
  - What alternative did you suggest?
  - When will you revisit?
  common_errors:
  - Says no without explanation.

- external_key: managerial.difficult_conversations.intent_to_leave
  competency_key: mentoring
  topic: When a valued team member says they are thinking of leaving
  difficulty: medium
  text: >-
    A valued team member tells you they are considering leaving the team. How do you respond?
  expected_concepts:
  - listening first
  - learning the work-related reasons
  - what could change in the role
  - being plain about what you can offer
  - supporting their decision
  rubric:
    excellent: >-
      Listens first, learns the work-related reasons, explores what could change in the role, is clear
      on what can be offered and supports their decision.
    good: Listens and offers to improve things.
    weak: Argues or makes promises that can't be kept.
  followups:
  - What can you realistically offer?
  - How do you plan for the possibility they leave?
  common_errors:
  - Argues or makes promises that can't be kept.

- external_key: managerial.difficult_conversations.rumours_before_reorg
  competency_key: communication
  topic: People asking about rumours of change
  difficulty: medium
  text: >-
    Rumours of organisational change are spreading, and your team asks you directly about them. How do
    you respond?
  expected_concepts:
  - sharing what is known
  - being open about what you cannot say
  - not speculating
  - regular updates
  - escalating questions
  rubric:
    excellent: >-
      Shares what is known, is open about what can't be said, avoids speculation, updates regularly and
      takes questions upward.
    good: Tells them what you can and that you'll update.
    weak: Denies or dismisses the rumour.
  followups:
  - What do you say you can't share?
  - How did you gather answers?
  common_errors:
  - Denies or dismisses the rumour.

- external_key: managerial.difficult_conversations.critical_review_for_star
  competency_key: leadership
  topic: Giving critical feedback to a top performer
  difficulty: medium
  text: >-
    One of your top performers has a pattern that hurts the team, such as dismissing others' ideas. How
    do you give them feedback?
  expected_concepts:
  - recognising their strengths
  - specific examples
  - the effect on the team and their own goals
  - clear expectations
  - follow-up
  rubric:
    excellent: >-
      Recognises strengths, gives specific examples, connects to team effect and their goals, sets expectations
      and follows up.
    good: Gives feedback with examples.
    weak: Avoids it because of their results.
  followups:
  - How do you link it to their goals?
  - What happened afterwards?
  common_errors:
  - Avoids it because of their results.

- external_key: managerial.difficult_conversations.rating_dispute
  competency_key: stakeholder_management
  topic: An employee formally disagreeing with their review
  difficulty: medium
  text: A team member formally disputes their performance review. How do you handle it?
  expected_concepts:
  - listening to their points
  - reviewing the evidence again
  - involving HR or your manager as the process requires
  - documenting
  - staying fair
  rubric:
    excellent: >-
      Listens, reviews the evidence again, uses the formal process, documents and stays fair, and explains
      the outcome.
    good: Listens and follows the process.
    weak: Defends the review without re-checking.
  followups:
  - Did you change anything?
  - How did you document?
  common_errors:
  - Defends the review without re-checking.

- external_key: managerial.difficult_conversations.ending_contractor_engagement
  competency_key: stakeholder_management
  topic: Ending an external contractor's engagement
  difficulty: medium
  text: >-
    You need to end a contractor's engagement earlier than planned. How do you handle the conversation
    and transition?
  expected_concepts:
  - telling them promptly and directly
  - explaining the business reason
  - respecting contract terms
  - knowledge transfer
  - professional close
  rubric:
    excellent: >-
      Tells them promptly, explains the reason, respects contract terms, plans knowledge transfer and
      closes professionally.
    good: Informs and arranges a handover.
    weak: Cuts access without conversation.
  followups:
  - What was transferred?
  - How did you work with their agency?
  common_errors:
  - Cuts access without conversation.

- external_key: managerial.difficult_conversations.team_reduction_announcement
  competency_key: leadership
  topic: Delivering a team reduction
  difficulty: hard
  text: >-
    Your organisation is reducing headcount in your area. How do you handle communication with the team
    and with those affected?
  expected_concepts:
  - following legal and HR process
  - clear and respectful communication
  - fair criteria
  - support for those leaving
  - support for those staying
  rubric:
    excellent: >-
      Follows process, communicates clearly and respectfully, applies fair criteria, supports those leaving
      and those staying.
    good: Communicates the process and offers support.
    weak: Avoids conversations or shares details improperly.
  followups:
  - What did you say to those staying?
  - How did you maintain confidentiality?
  common_errors:
  - Avoids conversations or shares details improperly.

- external_key: managerial.difficult_conversations.role_eliminated
  competency_key: leadership
  topic: Telling someone their role is going away
  difficulty: hard
  text: A role on your team will be eliminated. How do you have that conversation?
  expected_concepts:
  - follow the process with HR
  - clear and direct message
  - allow time to respond
  - information on support and options
  - respect
  rubric:
    excellent: >-
      Follows the process with HR, gives a clear and direct message, allows time to respond, explains
      support and options and treats the person with respect.
    good: Delivers the message and options.
    weak: Delivers it in a hurry.
  followups:
  - What do you prepare?
  - What can you not say?
  common_errors:
  - Delivers it in a hurry.

- external_key: managerial.difficult_conversations.stepping_back_from_role
  competency_key: leadership
  topic: Moving someone out of a lead role
  difficulty: hard
  text: >-
    Someone in a lead role isn't succeeding, and you decide to move them back to an individual role. How
    do you handle it?
  expected_concepts:
  - evidence and examples
  - clear decision
  - respectful explanation
  - plan for the transition
  - keeping their strengths in use
  rubric:
    excellent: >-
      Uses evidence, is clear on the decision, explains respectfully, plans the transition and keeps their
      strengths in use.
    good: Explains the decision and plans a transition.
    weak: Avoids a direct explanation.
  followups:
  - How did the team learn?
  - What role did you give them?
  common_errors:
  - Avoids a direct explanation.

- external_key: managerial.difficult_conversations.explaining_decision_you_disagree_with
  competency_key: ownership
  topic: Explaining a leadership decision you disagree with
  difficulty: hard
  text: >-
    Leadership makes a decision you disagree with, and you must explain it to your team. How do you handle
    it?
  expected_concepts:
  - raising concerns upward first
  - explaining the decision accurately
  - not undermining it
  - being open about what you know
  - supporting the team
  rubric:
    excellent: >-
      Raises concerns upward first, explains accurately, does not undermine it, is open about what is
      known and supports the team.
    good: Explains it and supports it.
    weak: Distances themselves or criticises leadership to the team.
  followups:
  - How did you raise concerns?
  - What did the team ask?
  common_errors:
  - Distances themselves or criticises leadership to the team.

- external_key: managerial.difficult_conversations.threat_to_quit
  competency_key: stakeholder_management
  topic: A team member using resignation as leverage
  difficulty: hard
  text: A team member says they will leave unless something changes. How do you respond?
  expected_concepts:
  - listening to the concern
  - separating legitimate issues from leverage
  - being clear about what is possible
  - not making commitments you can't keep
  - decision
  rubric:
    excellent: >-
      Listens to the concern, separates legitimate issues from leverage, is clear on what's possible,
      avoids unkeepable commitments and decides.
    good: Listens and negotiates.
    weak: Gives in to avoid losing them.
  followups:
  - What did you offer?
  - What happened later?
  common_errors:
  - Gives in to avoid losing them.

- external_key: managerial.difficult_conversations.tenured_not_promoted
  competency_key: mentoring
  topic: A long-serving person passed over for advancement
  difficulty: hard
  text: >-
    A long-serving team member is passed over for advancement, and expected to be chosen. How do you handle
    the conversation?
  expected_concepts:
  - clear decision
  - evidence against criteria
  - appreciation of their contributions
  - development plan
  - separating length of service from level criteria
  rubric:
    excellent: >-
      Gives a clear decision, evidence against criteria, appreciates their contributions, sets a development
      plan and separates length of service from level criteria.
    good: Explains and offers development.
    weak: Gives vague reasons.
  followups:
  - What did you say about tenure?
  - What followed?
  common_errors:
  - Gives vague reasons.
