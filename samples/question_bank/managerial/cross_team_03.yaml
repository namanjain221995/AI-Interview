# Curated questions: managerial round, cross-team coordination (part 3 of 4). Shared ownership:
# ownership boundaries and transfers, interfaces and contracts between teams, contributions to
# other teams' code, internal service levels, cross-team incident follow-up and shared standards.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  - external_key: managerial.cross_team.ownership_map
    competency_key: project_management
    topic: Making it clear which team owns what
    difficulty: easy
    text: >-
      In an organisation with lots of services and teams, how have you helped people quickly find out who owns a
      given system and how to reach them?
    expected_concepts:
      - a maintained catalogue or ownership record
      - owners tied to teams rather than individuals
      - contact and escalation routes for each system
      - keeping it current through routine checks
      - handling systems with no clear owner
    rubric:
      excellent: Describes a concrete ownership record tied to teams with contact routes, a way of keeping it current, and a process for assigning unowned systems.
      good: Has a list of owners but upkeep or unowned systems are not addressed.
      weak: Relies on asking around in chat.
    followups:
      - How did you keep it accurate after reorganisations?
      - What happened when nobody would claim a system?
    common_errors:
      - Listing individuals as owners so the record breaks when people move.

  - external_key: managerial.cross_team.contributing_to_other_codebase
    competency_key: collaboration
    topic: Changing code another team owns
    difficulty: easy
    text: >-
      When your team needs a change in a codebase that another team owns, how do you go about making it so the
      owning team is glad you did rather than annoyed?
    expected_concepts:
      - talking to the owners before starting
      - following their conventions and review process
      - small, well-explained changes with tests
      - documentation and handing over anything they will maintain
      - being available after merge
    rubric:
      excellent: Agrees the approach with owners first, follows their standards, keeps changes small and tested, and supports the change after merge; gives a real example.
      good: Follows the owner's review process but engages them late.
      weak: Submits a large change and expects it to be merged quickly.
    followups:
      - What did you do when the owning team didn't have time to review?
      - Who maintains what you added?
    common_errors:
      - Leaving the owning team to maintain code they never agreed to.

  - external_key: managerial.cross_team.explaining_team_boundaries
    competency_key: mentoring
    topic: Helping a new engineer understand the team landscape
    difficulty: easy
    text: >-
      How do you help a new engineer on your team understand which other teams they'll work with, who owns what, and
      how to get help from them?
    expected_concepts:
      - a map of neighbouring teams and their areas
      - introductions to key contacts
      - explaining how to make requests to each team
      - early tasks that involve another team
      - a go-to person for questions
    rubric:
      excellent: Describes concrete onboarding steps such as a team map, personal introductions and an early task that requires cross-team work, with a buddy to ask.
      good: Provides documentation and introductions but no real cross-team practice.
      weak: Expects them to pick it up over time.
    followups:
      - What did new people find most confusing?
      - How long did it take them to work independently with other teams?
    common_errors:
      - Covering only their own team's code and ignoring the surrounding organisation.

  - external_key: managerial.cross_team.good_neighbour_reviews
    competency_key: mentoring
    topic: Coaching the team to respond well to other teams
    difficulty: easy
    text: >-
      How have you encouraged your team to respond well when other teams send them questions, requests or code to
      review?
    expected_concepts:
      - agreed response times
      - a rotation so it doesn't fall on one person
      - treating requests as part of the job and planning for it
      - recognising people who help others
      - turning repeated questions into documentation
    rubric:
      excellent: Describes specific practices such as a rotation, response expectations, planned capacity and recognition, and turning repeat questions into self-service.
      good: Sets expectations about responsiveness but without structure.
      weak: Leaves it to individuals.
    followups:
      - How did you balance this against your own team's work?
      - What feedback did other teams give you?
    common_errors:
      - Not planning any capacity for supporting others.

  - external_key: managerial.cross_team.interface_docs_for_self_service
    competency_key: communication
    topic: Documentation that lets other teams help themselves
    difficulty: easy
    text: >-
      Other teams keep asking your team the same questions about how to use something you own. What would you do
      about it?
    expected_concepts:
      - tracking which questions come up most
      - writing docs aimed at those questions
      - examples and quick starts
      - pointing askers to docs and fixing gaps they find
      - improving the interface itself where confusing
    rubric:
      excellent: Uses the repeated questions to drive targeted documentation and examples, improves confusing parts of the interface, and builds a habit of updating docs when gaps appear.
      good: Writes documentation but not driven by the actual questions.
      weak: Keeps answering individually.
    followups:
      - How did you know the docs were working?
      - Which questions did documentation not solve?
    common_errors:
      - Writing comprehensive reference docs nobody reads instead of answering the common questions.

  - external_key: managerial.cross_team.why_help_other_team
    competency_key: leadership
    topic: Explaining to your team why another team's need comes first
    difficulty: easy
    text: >-
      Your team is asked to pause some of its own work to help another team hit an important goal. How would you
      explain that to your team?
    expected_concepts:
      - the reason and the wider goal
      - what is paused and for how long
      - what happens to their own commitments
      - how their contribution will be recognised
      - listening to concerns
    rubric:
      excellent: Explains the wider goal and reasons, is specific about scope and duration, protects or renegotiates their commitments, and listens to and addresses concerns.
      good: Explains the reason but is vague on duration or impact on their own work.
      weak: Simply announces the change.
    followups:
      - What if the team strongly disagrees?
      - How did you make sure the help was time-boxed?
    common_errors:
      - Leaving the team's own deadlines unchanged.

  - external_key: managerial.cross_team.jointly_owned_service
    competency_key: leadership
    topic: A service two teams both think they own
    difficulty: medium
    text: >-
      Two teams both make changes to the same service and each assumes the other is responsible for keeping it
      healthy in production. How would you sort out ownership?
    expected_concepts:
      - identifying the problems the ambiguity causes
      - options such as single owner, split, or explicit shared model
      - who handles on-call, upgrades and quality
      - agreeing with both leads and their managers
      - writing down and communicating the result
    rubric:
      excellent: Names the concrete risks, compares ownership models, assigns operational duties explicitly, gets both leads and managers to agree and records the outcome.
      good: Proposes a single owner sensibly but without covering operations or agreement.
      weak: Suggests the teams work it out between them.
    followups:
      - When does shared ownership actually work?
      - How would the non-owning team still make changes?
    common_errors:
      - Assigning ownership without the people or time to do it.

  - external_key: managerial.cross_team.shared_library_breaking_change
    competency_key: project_management
    topic: Changing a library many teams use
    difficulty: medium
    text: >-
      Your team maintains a library used across the company and needs to make a change that will break some
      callers. How do you plan and communicate it?
    expected_concepts:
      - finding out who will be affected
      - versioning and deprecation period
      - migration guide or automated fix
      - advance notice through the right channels
      - support during the migration
    rubric:
      excellent: Identifies affected callers, uses versioning and a deprecation window, provides migration help or automated fixes, communicates early and supports teams through it.
      good: Versions the change and announces it, with limited migration support.
      weak: Releases the change and fixes breakages as reported.
    followups:
      - How did you find the callers?
      - What if a key team couldn't upgrade in time?
    common_errors:
      - Announcing only in a channel that the affected teams don't read.

  - external_key: managerial.cross_team.negotiating_interface_contract
    competency_key: collaboration
    topic: Agreeing an interface between two teams
    difficulty: medium
    text: >-
      Tell me about a time your team and another team had to agree the interface between your systems. How did you
      reach agreement, and how did it hold up?
    expected_concepts:
      - starting from use cases on both sides
      - written contract with examples
      - handling disagreements over responsibilities
      - contract tests or mocks to work in parallel
      - process for changing it later
    rubric:
      excellent: Gives a real example of agreeing a written contract from use cases, resolving disputes over responsibilities, using contract tests to work in parallel and describing how it evolved.
      good: Agreed an interface sensibly but did not cover change or testing.
      weak: One side dictated the interface and the other adapted.
    followups:
      - What did you get wrong in the first version?
      - How were later changes agreed?
    common_errors:
      - Agreeing field names without agreeing behaviour such as errors and limits.

  - external_key: managerial.cross_team.accepting_external_contributions
    competency_key: leadership
    topic: Accepting changes from other teams into your code
    difficulty: medium
    text: >-
      Other teams want to contribute changes directly to a system your team owns rather than waiting for you. How
      would you set that up so it speeds things up without hurting quality?
    expected_concepts:
      - contribution guidelines and architectural boundaries
      - review commitments from your team
      - automated tests and checks as guardrails
      - agreeing who maintains contributed features
      - designating trusted contributors over time
    rubric:
      excellent: Describes a contribution model with guidelines, timely reviews, automated guardrails, clear maintenance responsibility and a path to trusted contributors.
      good: Welcomes contributions with review but no guidelines or maintenance agreement.
      weak: Refuses contributions or accepts them without structure.
    followups:
      - Which areas would you keep closed to outside changes?
      - What do you do with a low-quality contribution?
    common_errors:
      - Accepting features without agreeing who will support them.

  - external_key: managerial.cross_team.inheriting_system
    competency_key: leadership
    topic: Taking over a system from another team
    difficulty: medium
    text: >-
      Your team is told it will take over a system another team has been running for years. How would you plan the
      handover so nothing gets dropped?
    expected_concepts:
      - inventory of responsibilities including operations
      - knowledge transfer through shadowing and pairing
      - a staged handover with a support period
      - agreeing what condition it must be in
      - making the cost visible in your team's plan
    rubric:
      excellent: Plans an inventory of all duties, staged transfer with shadowing and reverse shadowing, an agreed support period, and explicitly plans the capacity cost.
      good: Arranges knowledge transfer but misses operational duties or support period.
      weak: Accepts it as is and learns when it breaks.
    followups:
      - What would you negotiate before accepting it?
      - How do you tell the handover is complete?
    common_errors:
      - Overlooking undocumented recurring tasks the old team handled.

  - external_key: managerial.cross_team.postmortem_actions_other_team
    competency_key: stakeholder_management
    topic: Follow-up actions owned by another team
    difficulty: medium
    text: >-
      After an incident, some of the most important follow-up actions belong to another team, and months later
      they still aren't done. How would you handle it?
    expected_concepts:
      - understanding why they stalled
      - restating the risk in concrete terms
      - negotiating priority with their lead
      - offering help or alternative mitigations
      - escalating with data if needed
    rubric:
      excellent: Seeks the reason first, makes the risk concrete, negotiates or offers help, considers mitigations on their own side and escalates with evidence only if needed.
      good: Follows up persistently but only by asking.
      weak: Lets it go or escalates without engaging.
    followups:
      - Who decides whether the risk is acceptable?
      - How would you make follow-up actions stick in future?
    common_errors:
      - Assigning actions to another team without their agreement in the review.

  - external_key: managerial.cross_team.intake_process_design
    competency_key: project_management
    topic: Designing how other teams bring work to yours
    difficulty: medium
    text: >-
      Requests from other teams reach yours through hallway chats, direct messages and tickets, and nobody can tell
      what's been agreed. How would you design a better intake?
    expected_concepts:
      - one entry point and required information
      - triage owner and rhythm
      - clear categories such as urgent, planned and questions
      - visible status for requesters
      - avoiding bureaucracy for small asks
    rubric:
      excellent: Proposes a single, lightweight intake with needed information, a triage rotation, categories with expected response times and visible status, and gets other teams to adopt it.
      good: Proposes a ticket queue but not triage or visibility.
      weak: Asks people to stop messaging directly.
    followups:
      - How would you handle urgent asks that bypass it?
      - How would you know it was working?
    common_errors:
      - Making the intake so heavy that teams avoid it.

  - external_key: managerial.cross_team.upstream_quality_issues
    competency_key: stakeholder_management
    topic: An upstream team's quality problems hitting you
    difficulty: medium
    text: >-
      Changes from a team upstream of yours keep breaking your systems, and your team is spending more and more
      time cleaning up. What would you do?
    expected_concepts:
      - collecting data on frequency and cost
      - discussing it constructively with their lead
      - jointly adding contract tests or checks
      - defensive measures on your side
      - agreeing how breakages are reported and handled
    rubric:
      excellent: Quantifies the impact, raises it constructively, proposes joint preventive measures such as contract tests, adds defensive measures and agrees a reporting route.
      good: Raises it with the other team with some proposed fixes.
      weak: Absorbs the cost or blames them in public channels.
    followups:
      - What if their lead says it's your systems that are fragile?
      - What did you change on your side?
    common_errors:
      - Assuming the fix belongs entirely to the other team.

  - external_key: managerial.cross_team.decision_rights_joint_project
    competency_key: leadership
    topic: Who has the final say on a joint project
    difficulty: medium
    text: >-
      On a project run jointly by two teams, how do you settle up front who makes which decisions, so you don't
      argue about it later?
    expected_concepts:
      - listing major decision types
      - assigning a decider for each and who is consulted
      - tie-breaking route
      - writing it down and sharing it
      - revisiting when it isn't working
    rubric:
      excellent: Explains how they would list decision types, assign deciders and consulted parties, agree a tie-break path, record it and revisit it, ideally with an example.
      good: Agrees an overall lead but not who decides what.
      weak: Leaves it to be worked out as issues arise.
    followups:
      - Tell me about a decision that still caused conflict.
      - Who should break ties?
    common_errors:
      - Making one person the decider for everything, creating a bottleneck.

  - external_key: managerial.cross_team.managing_embedded_engineer
    competency_key: mentoring
    topic: Supporting a report working inside another team
    difficulty: medium
    text: >-
      One of your engineers is spending a few months working inside another team. How do you keep supporting their
      growth and get a fair picture of their work while they're away from you?
    expected_concepts:
      - agreeing goals for the period
      - regular check-ins continuing
      - input from the host team's lead
      - helping them handle conflicting priorities
      - planning their return
    rubric:
      excellent: Sets goals for the assignment, keeps regular contact, gathers structured feedback from the host lead, helps with conflicting priorities and plans the return.
      good: Keeps in touch and asks the host lead for feedback, without goals or return plan.
      weak: Hands them over and catches up at review time.
    followups:
      - How do you handle the host team wanting to keep them?
      - What did they bring back?
    common_errors:
      - Basing the review only on their own team's view.

  - external_key: managerial.cross_team.shared_customer_journey
    competency_key: leadership
    topic: A customer journey that several teams own a piece of
    difficulty: hard
    text: >-
      A key customer journey, say sign-up through first purchase, passes through four teams, and its overall success
      rate is falling, but each team says its own part looks fine. How would you get this fixed?
    expected_concepts:
      - end-to-end measurement across team boundaries
      - finding where users are lost
      - assigning ownership for the overall outcome
      - joint working sessions with the teams
      - shared goals so the fix gets prioritised
    rubric:
      excellent: Establishes end-to-end measurement, localises the drop, sets up clear ownership of the overall outcome, runs joint work across teams and aligns goals so fixes are prioritised.
      good: Investigates end to end and coordinates fixes, but leaves no lasting owner.
      weak: Asks each team to double-check its own part.
    followups:
      - Who should own the end-to-end metric?
      - What if the fix needs a team to change something it considers correct?
    common_errors:
      - Assuming the problem must be inside one team's component.

  - external_key: managerial.cross_team.shared_on_call_platform
    competency_key: leadership
    topic: On-call for a platform many teams depend on
    difficulty: hard
    text: >-
      A shared platform is used by many teams, and when it fails, nobody is sure whether the platform team or the
      affected product team should respond first. How would you set up a sensible on-call model?
    expected_concepts:
      - clear first responder for platform-wide issues
      - triage path for issues that might be in either
      - shared runbooks and dashboards
      - service level expectations both ways
      - review of incidents to refine the model
    rubric:
      excellent: Defines first responders and a triage path, shared tooling and expectations, and a review loop, while considering load on the platform team.
      good: Assigns responsibility sensibly but misses triage of ambiguous issues.
      weak: Has everyone join every incident.
    followups:
      - How do you keep the platform team from being overloaded?
      - What should product teams be able to fix themselves?
    common_errors:
      - Defining responsibilities without the access or tools to act on them.

  - external_key: managerial.cross_team.cross_team_postmortem_blame
    competency_key: leadership
    topic: A review where teams blame each other
    difficulty: hard
    text: >-
      You're running the review of an incident that crossed three teams, and the discussion turns into each team
      explaining why it was someone else's fault. How do you get it back on track?
    expected_concepts:
      - refocusing on timeline and contributing factors
      - setting ground rules about blame
      - surfacing gaps at team boundaries
      - actions agreed by each owning team
      - follow-up with leads outside the meeting
    rubric:
      excellent: Resets the meeting on facts and system factors, highlights boundary gaps as the real issue, gets each team to own agreed actions, and follows up with leads privately where needed.
      good: Stops the blame and refocuses but actions remain one-sided.
      weak: Lets the most senior person decide who was at fault.
    followups:
      - What would you do before the meeting to prevent this?
      - How do you handle a lead who keeps deflecting?
    common_errors:
      - Ending with actions only for the team that seemed most at fault.

  - external_key: managerial.cross_team.internal_service_levels
    competency_key: stakeholder_management
    topic: Service expectations between internal teams
    difficulty: hard
    text: >-
      How would you agree service expectations, such as availability or response times, between your team and the
      internal teams that depend on you, and what happens when they're missed?
    expected_concepts:
      - understanding what consumers really need
      - measurable targets tied to those needs
      - capacity and cost of meeting them
      - reporting and review cadence
      - what happens on a miss, including priority of fixes
    rubric:
      excellent: Starts from consumer needs, sets measurable targets with cost in mind, reports them openly and agrees consequences such as reprioritising reliability work when missed.
      good: Sets targets and reports them but consequences are unclear.
      weak: Promises high targets without considering cost or measurement.
    followups:
      - What if a consumer wants more than you can afford to provide?
      - How have missed targets changed your plans?
    common_errors:
      - Setting identical targets for every consumer regardless of need.

  - external_key: managerial.cross_team.shared_infra_costs
    competency_key: stakeholder_management
    topic: Sharing the cost of shared infrastructure
    difficulty: hard
    text: >-
      Costs for shared infrastructure have grown sharply, and nobody wants to own the bill or change their usage.
      How would you approach getting teams to take responsibility for it?
    expected_concepts:
      - visibility of usage by team
      - agreeing an allocation model
      - involving finance and leadership sponsors
      - helping teams reduce waste
      - tracking change over time
    rubric:
      excellent: Makes usage visible by team, agrees a fair allocation model with sponsors, supports teams in reducing waste and tracks results.
      good: Makes costs visible but no agreed accountability.
      weak: Asks teams to be careful or cuts resources unilaterally.
    followups:
      - How do you handle a team whose costs are high for good reasons?
      - What incentive did teams have to change?
    common_errors:
      - Charging teams costs they have no ability to influence.

  - external_key: managerial.cross_team.consistency_vs_autonomy
    competency_key: leadership
    topic: Common standards versus team autonomy
    difficulty: hard
    text: >-
      Across several teams, how do you decide which engineering practices should be standard for everyone and which
      each team should choose for itself? Give me an example of where you drew that line.
    expected_concepts:
      - criteria such as cross-team impact, security and operability
      - involving teams in setting standards
      - a light process for exceptions
      - revisiting standards over time
      - a real example
    rubric:
      excellent: Gives clear criteria for standardising, involves teams, allows reasoned exceptions and illustrates with a real example and its consequences.
      good: Has a sensible view but the example is thin.
      weak: Either standardises everything or nothing.
    followups:
      - What standard did you later regret?
      - How do you handle a team that refuses a standard?
    common_errors:
      - Standardising for neatness rather than for a real cross-team benefit.

  - external_key: managerial.cross_team.handing_off_ownership
    competency_key: project_management
    topic: Transferring a system you own to another team
    difficulty: medium
    text: >-
      Your team needs to hand a system it built over to another team to run long term. How do you make that
      transfer work well for them?
    expected_concepts:
      - explaining why and gaining their agreement
      - documenting operations and known issues
      - fixing the worst problems before handing over
      - a period of joint support
      - clear date when responsibility moves
    rubric:
      excellent: Gains genuine agreement, leaves the system in a reasonable state, documents it, supports jointly for a defined period and sets a clear handover date.
      good: Documents and hands over with some support but leaves known problems.
      weak: Hands over immediately with whatever exists.
    followups:
      - What problems did you fix first?
      - How did the receiving team rate the handover?
    common_errors:
      - Handing over a system with known urgent issues unaddressed.

  - external_key: managerial.cross_team.compliance_change_across_teams
    competency_key: project_management
    topic: A mandatory change every team must make
    difficulty: hard
    text: >-
      A new security or compliance requirement means every team has to change something in their systems by a fixed
      date. If you were coordinating it, how would you get it done?
    expected_concepts:
      - translating the requirement into concrete team tasks
      - reusable tooling or guidance
      - tracking status across teams
      - early warning for teams at risk
      - evidence that it is complete
    rubric:
      excellent: Turns the requirement into concrete tasks, provides tooling to reduce effort, tracks status visibly, intervenes early where teams are at risk and gathers evidence of completion.
      good: Communicates the requirement and tracks progress but offers little help.
      weak: Sends the requirement out and checks at the deadline.
    followups:
      - How would you handle a team that cannot meet the date?
      - How do you avoid duplicated effort across teams?
    common_errors:
      - Leaving each team to interpret the requirement independently.

  - external_key: managerial.cross_team.community_of_practice
    competency_key: leadership
    topic: A group sharing practices across teams
    difficulty: easy
    text: >-
      Have you started or taken part in a group that shares practices across teams, like a testing or frontend
      guild? What did it achieve, and what kept it going or made it fade?
    expected_concepts:
      - purpose of the group
      - concrete outputs or changes
      - who participated and how
      - what sustained or killed it
      - learning about running such groups
    rubric:
      excellent: Describes a specific group, its concrete outputs, how it was sustained and a clear reflection on why it worked or faded.
      good: Took part and can describe benefits, but limited reflection.
      weak: Describes only meetings and no outcome.
    followups:
      - What would you do differently if you started one now?
      - How did members find time for it?
    common_errors:
      - Measuring success by attendance alone.
