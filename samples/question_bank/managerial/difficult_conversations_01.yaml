# Managerial round: difficult conversations (part 1 of 4).
# Focus: raising and working through underperformance in conversation - opening the topic, making the
# gap concrete, responding to pushback and handling harder underperformance situations.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ opening the conversation
  - external_key: managerial.difficult_conversations.first_concern_opening
    competency_key: communication
    topic: Opening a first performance conversation
    difficulty: easy
    text: >-
      When you need to raise a concern about someone's work for the first time, how do you open that
      conversation? Walk me through the first few minutes of one you've actually had.
    expected_concepts:
      - stating the purpose early instead of burying it in small talk
      - one or two specific, recent examples of the work
      - describing the impact on the team or the outcome
      - asking for the other person's view before proposing fixes
      - agreeing a next step before the conversation ends
    rubric:
      excellent: Describes a real conversation that opened with a clear purpose and specific examples, invited the person's perspective early and ended with an agreed next step.
      good: Gives a real example with a clear message and examples, but the person's view or the next step is only lightly covered.
      weak: Talks in generalities, or describes softening the message so much that the concern was never actually stated.
    followups:
      - How did the person respond in those first few minutes?
      - What would you have said differently with hindsight?
    common_errors:
      - Hiding the concern between unrelated praise so it never lands.
      - Opening with conclusions about the person rather than observations about the work.

  - external_key: managerial.difficult_conversations.separating_work_from_person
    competency_key: communication
    topic: Describing the problem without judging the person
    difficulty: easy
    text: >-
      How do you describe a performance problem so it's specific about the work without sounding like a
      verdict on the person? Give me an example of how you actually phrased it.
    expected_concepts:
      - describing observable behaviour and outputs
      - avoiding labels such as lazy or careless
      - linking the observation to its effect on the work
      - phrasing the gap as something that can change
      - an actual example of the wording used
    rubric:
      excellent: Quotes or closely paraphrases real wording that named specific behaviour and its impact, avoided labels, and framed the gap as changeable with a clear expectation.
      good: Explains the principle of describing behaviour rather than character and gives a reasonable example, though the wording is less precise.
      weak: Offers only the principle with no example, or the example itself uses labels about the person.
    followups:
      - How did the person react to that framing?
      - Is there a phrase you've learned to avoid in these conversations?
    common_errors:
      - Using generalisations such as "you always" or "you never".

  - external_key: managerial.difficult_conversations.showing_what_good_looks_like
    competency_key: mentoring
    topic: Making the gap concrete
    difficulty: easy
    text: >-
      When you tell someone their work is below the bar, how do you show them what good would actually look
      like, so the gap is concrete rather than abstract? Tell me about a time you did that.
    expected_concepts:
      - reference examples of work that meets the bar
      - comparing the person's work against clear criteria
      - breaking the gap into specific, learnable pieces
      - checking the person can describe the target in their own words
      - follow-up to review the next piece of work against it
    rubric:
      excellent: Describes using concrete reference work or explicit criteria, breaking the gap into specific improvements and reviewing the next piece of work together against that standard.
      good: Gives a real example where the standard was explained clearly, though follow-up against it was informal.
      weak: Describes telling the person to "do better" or "raise the quality" without ever defining the target.
    followups:
      - Where did you find the examples of good work you used?
      - How did you know the person understood the standard?
    common_errors:
      - Comparing the person unfavourably to a named colleague instead of to a standard.

  - external_key: managerial.difficult_conversations.pm_slipping_task_owner
    competency_key: project_management
    topic: Raising slipping work with someone who isn't your report
    difficulty: easy
    text: >-
      As a project manager, one team member's tasks keep slipping, but they don't report to you. How would
      you raise it with them directly before you think about involving their manager?
    expected_concepts:
      - a private, direct conversation first
      - specific tasks, dates and downstream impact
      - asking what is getting in the way
      - agreeing realistic dates or re-scoping together
      - a clear and transparent point at which their manager is involved
    rubric:
      excellent: Describes a direct, private conversation grounded in specific slipped tasks and their impact, explores blockers, agrees a concrete plan and is open about when and why the manager would be brought in.
      good: Raises it directly with specifics and agrees a plan, but the escalation path is vague.
      weak: Goes straight to the person's manager, or only adds reminders to the tracker without a conversation.
    followups:
      - What if the dates kept slipping after that conversation?
      - How would you tell them you were involving their manager?
    common_errors:
      - Escalating without ever having spoken to the person.

  - external_key: managerial.difficult_conversations.gathering_specific_examples
    competency_key: people_management
    topic: Collecting examples without building a case
    difficulty: easy
    text: >-
      How do you gather the specific examples you need for a conversation about someone's performance, without
      the person feeling you've been quietly building a case against them?
    expected_concepts:
      - raising concerns close to when they happen
      - using first-hand observation and work artefacts
      - recent, representative examples rather than a long list
      - sharing observations as they arise rather than saving them up
      - verifying second-hand reports before using them
    rubric:
      excellent: Explains gathering recent, first-hand and verified examples while raising each concern promptly, so nothing in the conversation comes as a surprise, and keeps the examples representative rather than exhaustive.
      good: Uses real examples and some timeliness, but relies partly on stored-up examples or unverified reports.
      weak: Describes collecting a long private list and presenting it all at once, or using no examples at all.
    followups:
      - How do you handle a concern someone else reported to you that you didn't see yourself?
      - How many examples do you bring into the room, and why that many?
    common_errors:
      - Presenting months of saved-up issues in a single meeting.

  - external_key: managerial.difficult_conversations.quiet_agreement_check
    competency_key: communication
    topic: When someone agrees with everything
    difficulty: easy
    text: >-
      In a conversation about a performance concern, the person says very little and simply agrees with
      everything you raise. How do you find out whether the message has actually landed?
    expected_concepts:
      - asking open questions instead of yes or no checks
      - asking the person to describe the issue and next steps in their own words
      - offering time to reflect and a follow-up conversation
      - watching for change in the work over the next weeks
      - a short written summary of what was agreed
    rubric:
      excellent: Uses open questions and asks the person to restate the issue and plan, offers a follow-up after reflection time, and checks real change in subsequent work.
      good: Asks some open questions or schedules a follow-up, but relies mainly on verbal agreement.
      weak: Takes the agreement at face value and moves on.
    followups:
      - What would you do if the follow-up showed they had understood something different?
    common_errors:
      - Treating silence or agreement as understanding.

  - external_key: managerial.difficult_conversations.tech_lead_rework_rising
    competency_key: mentoring
    topic: Tech lead noticing a drop in code quality
    difficulty: easy
    text: >-
      As a tech lead, you notice that one engineer's pull requests have needed much more rework over the
      last few weeks than they used to. How would you approach that with them?
    expected_concepts:
      - checking the pattern across several pull requests first
      - a private conversation rather than more review comments
      - asking about context such as unfamiliar code or time pressure
      - concrete support such as pairing or earlier design check-ins
      - deciding whether and when the manager needs to know
    rubric:
      excellent: Confirms the pattern with specific examples, raises it privately and curiously, offers concrete support such as pairing or earlier reviews, and is clear about the manager's role.
      good: Has a direct conversation with examples and offers help, but does not check the pattern or think about the manager's involvement.
      weak: Keeps leaving more review comments, or goes to the manager without speaking to the engineer.
    followups:
      - What would change your approach if the engineer was more senior than you?
    common_errors:
      - Trying to fix it purely through stricter code review.

  # ------------------------------------------------------------ during the conversation
  - external_key: managerial.difficult_conversations.sudden_drop_strong_performer
    competency_key: people_management
    topic: A strong performer whose work suddenly drops
    difficulty: medium
    text: >-
      Tell me about a time someone who had been doing well suddenly started missing commitments. How did you
      approach the conversation without jumping to conclusions about why?
    expected_concepts:
      - describing the change in the work factually
      - asking open questions about what had changed in their work
      - respecting privacy and not pressing for personal details
      - adjusting scope or deadlines while things recovered
      - agreeing how and when to review progress
    rubric:
      excellent: Describes a real case where the change was raised factually and openly, the person's privacy was respected, practical adjustments to the work were made and progress was reviewed at agreed points.
      good: Real example with a supportive, factual conversation, but adjustments or follow-up were loosely defined.
      weak: Assumed the cause, pressed the person for private details, or ignored the change until it became serious.
    followups:
      - How long did you wait before raising it, and why?
      - What did you tell the rest of the team about the changed plan?
    common_errors:
      - Speculating about the cause instead of asking.
      - Pressing for personal information that isn't needed to support the work.

  - external_key: managerial.difficult_conversations.job_at_risk_question
    competency_key: communication
    topic: Answering "is my job at risk?"
    difficulty: medium
    text: >-
      Partway through a conversation about a performance concern, the person asks you directly whether their
      job is at risk. How do you answer?
    expected_concepts:
      - a direct answer that matches the actual situation
      - not giving false reassurance or overstating the risk
      - explaining what improvement would look like and the timeline
      - explaining the process if things don't improve
      - checking with HR or own manager beforehand on what can be said
    rubric:
      excellent: Gives a straight answer that reflects the real situation, avoids both false reassurance and threats, explains the expected change, timeline and process, and has prepared for the question in advance.
      good: Answers directly and explains what needs to change, but is vague on timeline or process.
      weak: Deflects the question, promises the job is safe when it may not be, or uses the question to pressure the person.
    followups:
      - How would your answer change if you were already discussing a formal plan with HR?
    common_errors:
      - Offering reassurance that later turns out to be untrue.

  - external_key: managerial.difficult_conversations.blames_tools_or_others
    competency_key: communication
    topic: When the person attributes the problem elsewhere
    difficulty: medium
    text: >-
      Tell me about a time you raised a concern about someone's work and they put it down entirely to other
      people, unclear requirements or the tools they'd been given. How did you move the conversation forward?
    expected_concepts:
      - acknowledging the parts of the explanation that were valid
      - investigating and fixing genuine external causes
      - separating what was in the person's control from what wasn't
      - agreeing specific actions the person owns
      - revisiting the outcome after the external issues were addressed
    rubric:
      excellent: Takes the explanation seriously, checks and fixes genuine external causes, then clearly separates what was within the person's control and agrees specific actions for that part.
      good: Acknowledges the other factors and refocuses on the person's actions, but doesn't verify or address the external causes.
      weak: Dismisses the explanation outright, or accepts it completely and drops the concern.
    followups:
      - What did you find when you looked into the things they blamed?
      - How did the conversation change after that?
    common_errors:
      - Arguing about blame rather than agreeing on what happens next.

  - external_key: managerial.difficult_conversations.long_hours_low_output
    competency_key: people_management
    topic: Working very long hours with low output
    difficulty: medium
    text: >-
      Someone on your team is working very long hours, but what they deliver is still well below what the
      role needs. How would you approach that conversation?
    expected_concepts:
      - focusing on outcomes rather than hours worked
      - discussing the unsustainable hours as a concern in itself
      - understanding where the time actually goes
      - fixing approach problems such as prioritisation or getting stuck alone
      - setting clear expectations on both output and working hours
    rubric:
      excellent: Addresses both the output gap and the unsustainable hours, digs into where time goes, offers concrete changes in approach and support, and sets explicit expectations on results and on working reasonable hours.
      good: Focuses on outcomes and offers help, but treats the long hours only in passing.
      weak: Credits effort as if it were performance, or simply asks the person to work even harder.
    followups:
      - What did you find when you looked at where their time was going?
    common_errors:
      - Treating visible effort as a substitute for results.

  - external_key: managerial.difficult_conversations.remote_underperformance
    competency_key: communication
    topic: Performance conversations with remote team members
    difficulty: medium
    text: >-
      How do you handle a performance conversation with someone who works fully remotely, perhaps in a
      different time zone from you? Tell me about one you've had.
    expected_concepts:
      - a live video conversation rather than chat or email for the main message
      - scheduling at a reasonable time for the other person
      - extra effort to check understanding without in-person cues
      - written recap afterwards
      - more frequent short check-ins to replace informal contact
    rubric:
      excellent: Describes a real remote conversation held live at a fair time, with deliberate checks for understanding, a written recap and a structured follow-up rhythm to replace hallway contact.
      good: Holds the conversation live and follows up, but doesn't adapt much for the remote context.
      weak: Delivers the concern over chat or email, or schedules it at an unreasonable hour for the other person.
    followups:
      - What would you avoid putting in writing alone?
    common_errors:
      - Delivering serious feedback only through written messages.

  - external_key: managerial.difficult_conversations.expectations_you_failed_to_set
    competency_key: leadership
    topic: When your own unclear expectations contributed
    difficulty: medium
    text: >-
      Tell me about a time you realised someone's disappointing results were partly caused by expectations you
      hadn't made clear. How did you raise that with them, and what did you change?
    expected_concepts:
      - owning own part of the gap openly with the person
      - still addressing the remaining performance gap
      - resetting expectations clearly, ideally in writing
      - giving a fair window under the clarified expectations
      - changing own practice for the rest of the team
    rubric:
      excellent: Acknowledges own contribution directly to the person, resets expectations precisely, gives a fair window to meet them and changes own practice more widely.
      good: Admits the gap and resets expectations, but doesn't describe a broader change in own practice.
      weak: Puts the problem entirely on the other person, or drops the concern altogether once own part is recognised.
    followups:
      - How did the person respond when you said that part of it was on you?
    common_errors:
      - Treating own mistake as a reason to ignore the remaining gap.

  - external_key: managerial.difficult_conversations.choosing_support
    competency_key: mentoring
    topic: Choosing the right kind of support
    difficulty: medium
    text: >-
      When someone is struggling, what kinds of support have you actually put in place, such as pairing,
      smaller scope or extra coaching, and how did you decide which one fitted? Give me an example.
    expected_concepts:
      - matching support to the diagnosed cause
      - options such as pairing, narrower scope, training or closer review
      - agreeing the support with the person rather than imposing it
      - a time limit and a way to judge whether it helped
      - adjusting when the first support didn't work
    rubric:
      excellent: Ties the chosen support to a clear diagnosis, agrees it with the person, sets a time frame and measure, and adapts when the first approach doesn't work.
      good: Real example with sensible support, but the link to the cause or the way success was judged is loose.
      weak: Applies the same generic support to everyone, or offers support without any way to judge its effect.
    followups:
      - What support have you tried that didn't help, and why?
    common_errors:
      - Assigning a mentor and assuming the problem is handled.

  - external_key: managerial.difficult_conversations.senior_not_at_level
    competency_key: mentoring
    topic: A senior engineer not operating at their level
    difficulty: medium
    text: >-
      Tell me about a senior engineer who was writing solid code but not doing the wider parts of a senior
      role, such as leading designs or guiding others. How did you have that conversation?
    expected_concepts:
      - reference to the expectations for the level
      - concrete examples of missed senior-level opportunities
      - acknowledging the strength of their individual work
      - specific opportunities to show senior-level scope
      - support and checkpoints for those opportunities
    rubric:
      excellent: Uses the level expectations and concrete missed opportunities to explain the gap, recognises their strengths, and creates specific senior-scope opportunities with support and checkpoints.
      good: Explains the gap against the level and offers opportunities, but with little follow-through described.
      weak: Treats strong coding as sufficient, or criticises the person without explaining what senior-level work looks like.
    followups:
      - What did the person say they wanted from their role?
      - How did you judge whether they'd closed the gap?
    common_errors:
      - Leaving level expectations implicit and expecting the person to infer them.

  - external_key: managerial.difficult_conversations.tech_lead_weak_coordination
    competency_key: leadership
    topic: A technically strong lead with weak coordination
    difficulty: medium
    text: >-
      One of your tech leads produces technically strong designs, but their team keeps missing dates because
      work isn't broken down or coordinated well. How would you raise that with them?
    expected_concepts:
      - acknowledging the technical strength explicitly
      - specific evidence such as missed dates and blocked handoffs
      - framing planning and coordination as core to the lead role
      - concrete practices such as breakdowns, dependency tracking and check-ins
      - support such as pairing with a project manager or coaching
    rubric:
      excellent: Credits the technical work, uses specific delivery evidence, frames coordination as part of the role, and agrees concrete practices plus support with a way to track improvement.
      good: Raises the coordination gap with examples and suggests practices, but support or follow-up is thin.
      weak: Takes over the planning for them, or treats missed dates purely as the team's problem.
    followups:
      - How would you know three months later whether things had improved?
    common_errors:
      - Quietly doing the coordination for them instead of raising it.

  - external_key: managerial.difficult_conversations.plan_check_ins
    competency_key: people_management
    topic: Running improvement plan check-ins
    difficulty: medium
    text: >-
      Once someone is on a formal improvement plan, how do you run the regular check-ins so they're genuinely
      useful to them rather than a box-ticking exercise? Tell me about one you ran.
    expected_concepts:
      - a fixed, frequent rhythm agreed at the start
      - reviewing evidence against each goal
      - recognising real progress as well as remaining gaps
      - adjusting support based on what each check-in shows
      - a written note after each check-in shared with the person
    rubric:
      excellent: Describes a regular rhythm, evidence reviewed against each goal, balanced acknowledgement of progress and gaps, adjustments to support and shared written notes.
      good: Held regular check-ins with evidence, but notes or adjustments to support were inconsistent.
      weak: Check-ins were infrequent, purely procedural, or the person only learned how they were doing at the end.
    followups:
      - What did you do in a check-in where there was no progress at all?
    common_errors:
      - Saving the overall assessment for the final meeting.

  - external_key: managerial.difficult_conversations.stuck_without_asking
    competency_key: mentoring
    topic: Someone who stays stuck instead of asking for help
    difficulty: medium
    text: >-
      Tell me about a time someone on your team stayed stuck on a problem for days without asking for help,
      and it put the work at risk. How did you raise it with them?
    expected_concepts:
      - raising the pattern without punishing the specific delay
      - understanding why they didn't ask
      - agreeing a clear threshold for asking for help
      - making help easy to get, such as pairing or regular check-ins
      - checking whether team norms discourage asking
    rubric:
      excellent: Raises the impact factually, explores why they didn't ask, agrees an explicit threshold for asking and makes help easier to get, and checks whether team norms contributed.
      good: Explains the expectation to ask sooner and offers help, without exploring the reasons.
      weak: Only tells them to ask sooner, or criticises them for the delay itself.
    followups:
      - Did you change anything about the team's habits as a result?
    common_errors:
      - Assuming the person simply didn't care about the deadline.

  - external_key: managerial.difficult_conversations.customer_complaint_engineer
    competency_key: communication
    topic: Customer complaint about an engineer
    difficulty: medium
    text: >-
      A customer escalates a complaint about how one of your engineers handled a support call. How do you talk
      to the engineer about it?
    expected_concepts:
      - getting the engineer's account before drawing conclusions
      - looking at the actual evidence such as tickets or recordings
      - separating what went wrong from the customer's framing
      - agreeing specific changes for future interactions
      - backing the engineer where the complaint was unfair
    rubric:
      excellent: Hears the engineer's side, checks the evidence, separates valid points from unfair ones, agrees specific changes and supports the engineer where the complaint went too far.
      good: Gets both sides and agrees improvements, but doesn't look at the underlying evidence.
      weak: Accepts the complaint at face value, or dismisses it without looking into it.
    followups:
      - What would you tell the customer afterwards?
    common_errors:
      - Treating the customer's account as the full story.

  # ------------------------------------------------------------ harder underperformance situations
  - external_key: managerial.difficult_conversations.well_liked_underperformer
    competency_key: people_management
    topic: A well-liked person who isn't delivering
    difficulty: hard
    text: >-
      One person on your team is well liked and generous with their time for others, but their own delivery
      has been well below what the role requires for several months. How would you address it?
    expected_concepts:
      - separating their helpfulness from delivery of their own work
      - checking whether helping others is untracked but valuable work
      - a clear conversation on expectations for their own output
      - rebalancing their role formally if the helping work matters
      - keeping the conversation private and the process consistent with others
    rubric:
      excellent: Checks whether the help is valuable untracked work and either formalises it or makes delivery expectations explicit, holds a clear private conversation and applies the same standard as for anyone else.
      good: Addresses the delivery gap clearly while acknowledging their contribution to others, but doesn't consider redesigning the role.
      weak: Avoids the issue because the person is popular, or dismisses their help to others as irrelevant.
    followups:
      - How would you respond if teammates pushed back on your decision?
    common_errors:
      - Letting popularity delay a needed conversation.

  - external_key: managerial.difficult_conversations.hard_to_measure_goals
    competency_key: people_management
    topic: Improvement goals for hard-to-measure work
    difficulty: hard
    text: >-
      How do you set improvement goals for someone whose work is hard to measure, such as an engineer doing
      mostly design, mentoring or platform work, so that both of you can tell clearly whether they've met them?
    expected_concepts:
      - defining observable outputs such as design documents or adopted decisions
      - feedback from the people the work serves
      - specific examples of what meeting the goal looks like
      - checkpoints agreed in advance
      - avoiding vanity metrics that are easy to game
    rubric:
      excellent: Turns the work into observable outputs and evidence from the people it serves, agrees concrete examples of success up front and avoids gameable metrics, so both sides would reach the same conclusion.
      good: Defines reasonable outputs and checkpoints, but success criteria still leave room for disagreement.
      weak: Uses vague goals such as "show more leadership", or forces in easily gamed numbers.
    followups:
      - How would you handle it if the person disagreed with your judgement at the end?
    common_errors:
      - Goals that only the manager can judge.

  - external_key: managerial.difficult_conversations.critical_launch_underperformer
    competency_key: project_management
    topic: Underperformance close to a critical launch
    difficulty: hard
    text: >-
      You're three weeks from a major launch, and the engineer who owns a critical component is falling behind
      and producing buggy work. How do you protect the launch while handling the performance issue fairly?
    expected_concepts:
      - immediate risk assessment of the component
      - adding support or pairing rather than silently replacing them
      - a direct conversation about what is happening and what will change
      - separating the short-term delivery decision from the longer performance discussion
      - telling stakeholders about the risk without blaming the individual
    rubric:
      excellent: Acts quickly on delivery risk with added support, is clear and direct with the engineer about the changes, keeps the longer performance discussion separate and communicates the risk to stakeholders without naming blame.
      good: Protects the launch and talks to the engineer, but mixes the delivery fix with performance judgement or is vague with stakeholders.
      weak: Quietly reassigns the work without telling the engineer, or lets the launch slip to avoid the conversation.
    followups:
      - When would you have the longer performance conversation?
      - How would you explain the added support to the engineer?
    common_errors:
      - Removing the work without a conversation, which damages trust for the rest of the team.

  - external_key: managerial.difficult_conversations.peer_demands_removal
    competency_key: people_management
    topic: A senior engineer demanding a colleague's removal
    difficulty: hard
    text: >-
      A senior engineer insists a colleague is dragging the team down and wants them taken off the project, but
      your own evidence is mixed. How do you handle the conversations with each of them?
    expected_concepts:
      - asking the senior engineer for specific evidence
      - forming own view from direct observation and the work itself
      - not making staffing decisions on one person's say-so
      - addressing any real gaps with the colleague directly
      - giving the senior engineer feedback on how they raised it if needed
    rubric:
      excellent: Gathers specific evidence and own observations before acting, addresses real gaps with the colleague directly, keeps staffing decisions with the manager and gives the senior engineer feedback on constructive ways to raise concerns.
      good: Investigates and has fair conversations with both, but doesn't address how the concern was raised.
      weak: Acts on the senior engineer's demand without checking, or dismisses it without looking into it.
    followups:
      - What would you say to the senior engineer if you found little evidence?
    common_errors:
      - Letting the louder voice decide the outcome.

  - external_key: managerial.difficult_conversations.peer_pm_struggling
    competency_key: collaboration
    topic: Raising concerns about a peer project manager
    difficulty: hard
    text: >-
      As a tech lead, you notice the project manager on your team is losing track of risks and dependencies,
      and engineers have started working around them. How would you raise it, given that you're peers?
    expected_concepts:
      - a direct, private conversation with the project manager first
      - specific examples of missed risks and their effects
      - offering help and agreeing a shared way of tracking work
      - stopping engineers from bypassing the project manager
      - deciding when to involve the project manager's own manager
    rubric:
      excellent: Raises it directly with specific examples, offers practical collaboration, stops the team working around the project manager and has a clear, transparent threshold for involving their manager.
      good: Has the direct conversation with examples and offers help, but leaves the workaround behaviour in the team unaddressed.
      weak: Lets the team route around the project manager, or complains to their manager without talking to them.
    followups:
      - How would you handle it if they told you the engineers were the problem?
    common_errors:
      - Taking over the project manager's work informally.

  - external_key: managerial.difficult_conversations.someone_you_championed
    competency_key: leadership
    topic: When someone you championed isn't working out
    difficulty: hard
    text: >-
      Tell me about a time someone you had personally hired or pushed for in a role wasn't working out. How did
      you make sure your own investment in them didn't delay or soften the conversation?
    expected_concepts:
      - recognising own bias toward the person's success
      - seeking an outside view such as a peer manager or own manager
      - raising the concern at the same point as for anyone else
      - being clear with the person about the gap
      - reflecting on what the hiring or selection decision missed
    rubric:
      excellent: Names the bias explicitly, uses outside views to check it, raises the issue with the same timeliness and clarity as for others, and reflects on what the original decision missed.
      good: Recognises the bias and addresses the issue, but with some delay or without an outside check.
      weak: Cannot name a case, or describes protecting the person for longer than they would have anyone else.
    followups:
      - Who did you ask for a second opinion?
      - What did you change about how you hire or select people?
    common_errors:
      - Rationalising the delay as giving the person more time.
