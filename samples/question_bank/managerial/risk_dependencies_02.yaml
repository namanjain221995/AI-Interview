# Managerial round: project risks, cross-team dependencies, escalations and unblocking (part 2 of 4).
# Focus: cross-team and external dependencies, from agreeing them to recovering when they slip.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ tracking and agreeing dependencies
  - external_key: managerial.risk_dependencies.dependency_tracking_visibility
    competency_key: project_management
    topic: Making dependencies visible
    difficulty: easy
    text: >-
      Once you know your project depends on work from other teams, how do you keep track of those dependencies
      so everyone can see where each one stands? Describe what you actually used.
    expected_concepts:
      - a single shared place listing each dependency
      - the providing team, owner, need-by date and current status
      - linking dependencies to the milestones they affect
      - regular updates from the providing side
      - visibility for stakeholders as well as the team
    rubric:
      excellent: Describes a concrete shared tracker with owners, need-by dates and status, explains how it stayed current and how it helped spot a slip early.
      good: Uses a real tracker with owners and dates, but upkeep or use in decisions is vague.
      weak: Keeps dependencies in their head or in scattered chat threads.
    followups:
      - Who updated it, you or the other teams?
      - Tell me about a slip the tracker helped you catch.
    common_errors:
      - Tracking the dependency's existence but not the date your project actually needs it.

  - external_key: managerial.risk_dependencies.first_ask_unfamiliar_team
    competency_key: collaboration
    topic: Opening a request to an unfamiliar team
    difficulty: easy
    text: >-
      When your team needs something from a team you've never worked with before, how do you open that
      conversation so you end up with a real commitment rather than a vague maybe?
    expected_concepts:
      - finding the right person and their intake process
      - explaining the need, the why and the date clearly
      - understanding their priorities and constraints
      - agreeing a concrete next step and date
      - confirming the agreement in writing
    rubric:
      excellent: Describes researching the team and its process, a clear request with context and dates, listening to their constraints, and a written confirmation of what was agreed.
      good: Makes a clear request and gets agreement, but pays little attention to the other team's priorities.
      weak: Sends a message and waits, or assumes a friendly chat equals a commitment.
    followups:
      - What did you do when their intake process was slower than your timeline?
      - How did you follow up after that first conversation?
    common_errors:
      - Asking for a delivery date before explaining why the work matters.

  - external_key: managerial.risk_dependencies.stalled_waiting_work
    competency_key: project_management
    topic: Keeping waiting work from going quiet
    difficulty: easy
    text: >-
      How do you make sure work that's waiting on another team doesn't sit quietly for days without anyone
      chasing it? Give me an example from your team.
    expected_concepts:
      - marking blocked work visibly on the board
      - a named person responsible for chasing each blocked item
      - a time limit before it gets raised further
      - reviewing blocked items in stand-ups or planning
      - picking up other work in the meantime
    rubric:
      excellent: Describes a specific practice with visible blocked status, named chasers and a time limit before escalation, with an example of it working.
      good: Blocked work is visible and someone follows up, but without a clear time limit.
      weak: Relies on individuals remembering to chase, with no shared practice.
    followups:
      - How long does something wait before you get involved personally?
      - What do engineers work on while they wait?
    common_errors:
      - Flagging the block in stand-up every day without anyone taking an action.

  - external_key: managerial.risk_dependencies.being_the_dependency
    competency_key: collaboration
    topic: When your team is the dependency
    difficulty: easy
    text: >-
      Tell me about a time your team was the dependency another team was waiting on. How did you keep them
      informed and fit their needs into your own work?
    expected_concepts:
      - understanding what the other team needed and by when
      - fitting the work into the team's priorities openly
      - proactive updates, especially on slips
      - early delivery of partial pieces where useful
      - checking that what was delivered met their need
    rubric:
      excellent: Gives a specific example of planning the other team's need into the roadmap, keeping them updated proactively including bad news, and checking the outcome worked for them.
      good: Delivered for the other team with reasonable communication, though updates were mostly on request.
      weak: Treated the request as a distraction or only communicated when chased.
    followups:
      - What did you do when it clashed with your own priorities?
      - How did the other team describe working with you?
    common_errors:
      - Only thinking about dependencies from the receiving side.

  - external_key: managerial.risk_dependencies.unowned_dependency_stall
    competency_key: project_management
    topic: A dependency nobody owned
    difficulty: easy
    text: >-
      Tell me about a time a cross-team dependency stalled because nobody on either side clearly owned it. What
      did you put in place afterwards?
    expected_concepts:
      - how the lack of ownership showed up
      - the impact on the project
      - how they got it moving again
      - naming an owner on both sides for each dependency
      - checking ownership as part of planning
    rubric:
      excellent: Describes the stall and its cost, how they restarted it, and a lasting practice that names owners on both sides of every dependency.
      good: Real example with a fix for that case, but a weaker lasting change.
      weak: Describes the problem without a clear fix or blames the other team.
    followups:
      - How did you find the right person on the other side?
      - Has that practice held up since?
    common_errors:
      - Naming a team as the owner rather than a person.

  - external_key: managerial.risk_dependencies.vendor_progress_visibility
    competency_key: project_management
    topic: Tracking a vendor's progress
    difficulty: easy
    text: >-
      When a project depends on an outside vendor delivering something, how do you stay on top of their
      progress without relying only on their own status reports?
    expected_concepts:
      - clear deliverables and acceptance criteria in the agreement
      - intermediate milestones with something to see or test
      - regular working sessions, not just status calls
      - early integration or test access
      - a named contact on both sides
    rubric:
      excellent: Describes concrete intermediate checkpoints with inspectable evidence such as demos or test builds, and an example where this revealed a problem early.
      good: Sets milestones and regular calls, but relies mostly on the vendor's word.
      weak: Waits for the final delivery date to find out where things stand.
    followups:
      - Tell me about a time those checks revealed something the vendor hadn't mentioned.
      - What was in the agreement that helped or hurt you?
    common_errors:
      - Equating regular status calls with real visibility.

  - external_key: managerial.risk_dependencies.dependency_agreement_contents
    competency_key: project_management
    topic: What a dependency agreement covers
    difficulty: medium
    text: >-
      When another team agrees to deliver something you depend on, what do you agree with them beyond a date?
      Walk me through a dependency agreement you set up and how it held up.
    expected_concepts:
      - scope and definition of done
      - interface details or acceptance criteria
      - intermediate checkpoints
      - how changes and slips will be communicated
      - who to go to if priorities conflict
    rubric:
      excellent: Describes a specific agreement covering scope, acceptance, checkpoints and how slips or changes would be handled, and reflects on which parts proved most valuable.
      good: Agreement covers scope and date with some checkpoints, with a real example.
      weak: Agreement is only a date, or is informal and undocumented.
    followups:
      - Which part of the agreement got tested first?
      - What would you add next time?
    common_errors:
      - Agreeing on a date without agreeing what "done" means.

  - external_key: managerial.risk_dependencies.contract_first_parallel_work
    competency_key: project_management
    topic: Agreeing an interface early
    difficulty: medium
    text: >-
      Tell me about a time you agreed an API or data contract with another team early so both sides could build
      in parallel. How did you handle changes to that contract later on?
    expected_concepts:
      - defining the contract jointly and writing it down
      - stubs or mocks so each side could build independently
      - contract tests or integration checks
      - a change process both teams agreed to
      - early integration to catch mismatches
    rubric:
      excellent: Describes a written contract, stubs or contract tests for parallel work, an agreed change process and an example of a change handled through it.
      good: Agreed a contract and worked in parallel, but changes were handled ad hoc.
      weak: Built separately and integrated at the end, or let the contract drift without notice.
    followups:
      - What was the most painful change to the contract?
      - How did you catch mismatches before integration?
    common_errors:
      - Treating the first contract draft as final and being surprised by changes.

  - external_key: managerial.risk_dependencies.dependency_three_weeks_late
    competency_key: project_management
    topic: Responding to a late dependency
    difficulty: medium
    text: >-
      The team building a component you need tells you it'll be three weeks late, and your launch is five weeks
      away. Walk me through what you'd do in the first day or two.
    expected_concepts:
      - understanding why it is late and how reliable the new date is
      - working out the impact on your critical path
      - options such as resequencing, stubbing, reduced scope or helping them
      - telling stakeholders early with options
      - agreeing tighter checkpoints with the other team
    rubric:
      excellent: Verifies the new date, quantifies the impact, generates several concrete options, informs stakeholders quickly with a recommendation and sets up closer tracking.
      good: Assesses impact and proposes reasonable options, but is slower or vaguer on communication.
      weak: Accepts the new date at face value and simply moves the launch, or blames the other team.
    followups:
      - How would you judge whether the new date is believable?
      - Which option would you favour, and what would change your mind?
    common_errors:
      - Assuming the second date will be met when the first one wasn't.

  - external_key: managerial.risk_dependencies.removing_dependency_by_design
    competency_key: leadership
    topic: Designing a dependency away
    difficulty: medium
    text: >-
      Tell me about a time you deliberately changed a project's approach or scope to remove a dependency on
      another team rather than manage it. What did that cost, and was it worth it?
    expected_concepts:
      - why the dependency was too risky to keep
      - the alternative chosen and its cost
      - agreement with the other team so nothing was duplicated unnecessarily
      - impact on delivery
      - long-term consequences such as ownership or duplication
    rubric:
      excellent: Explains the reasoning, the alternative and its full cost including long-term ownership, how they handled the other team, and an evidence-based reflection on the result.
      good: Clear example with a sensible trade-off, though long-term costs are glossed over.
      weak: Built around the other team without telling them, or cannot weigh the cost.
    followups:
      - What would you have done if the other team had objected?
      - Who owns that piece now?
    common_errors:
      - Ignoring the maintenance burden created by building your own version.

  - external_key: managerial.risk_dependencies.shared_environment_contention
    competency_key: collaboration
    topic: Contention over shared resources
    difficulty: medium
    text: >-
      Several teams share a staging environment or test data, and they keep blocking each other. Tell me how
      you've dealt with that kind of contention over a shared resource.
    expected_concepts:
      - understanding the real pattern of conflicts
      - short-term rules such as booking or ownership windows
      - longer-term fixes such as separate or on-demand environments
      - agreement across teams on the approach
      - measuring whether blocking dropped
    rubric:
      excellent: Diagnoses the contention, introduces a short-term agreement across teams and pushes a structural fix, with evidence that blocking decreased.
      good: Puts a workable agreement in place, but does not address the root cause.
      weak: Only fights for their own team's access.
    followups:
      - Who paid for the longer-term fix?
      - How did you get the other teams to agree?
    common_errors:
      - Solving it for their own team only, which shifts the contention elsewhere.

  - external_key: managerial.risk_dependencies.request_ranked_low_by_other_team
    competency_key: stakeholder_management
    topic: Getting another team to prioritise your need
    difficulty: medium
    text: >-
      Another team agrees your request matters but keeps ranking it below items on their own roadmap. How do you
      make the case for it without immediately going over their heads?
    expected_concepts:
      - understanding their roadmap and constraints
      - quantifying the business impact of the delay
      - offering help such as people, design work or reduced scope
      - finding a smaller version they could fit in
      - agreeing together when to take it to shared leadership
    rubric:
      excellent: Understands their constraints, quantifies impact, offers concrete help or a smaller ask, and agrees jointly on escalation if needed, with an example.
      good: Makes a reasoned case and offers some help, with limited example.
      weak: Repeats the request more forcefully or escalates without trying alternatives.
    followups:
      - What would make you decide it was time to involve leadership?
      - What did you offer them in return?
    common_errors:
      - Arguing only from their own team's deadline, not the wider business impact.

  - external_key: managerial.risk_dependencies.lending_people_to_dependency
    competency_key: collaboration
    topic: Lending your people to unblock a dependency
    difficulty: medium
    text: >-
      Tell me about a time you offered your own team's people or time to help another team finish work you were
      waiting on. How did you set it up, and how did it go?
    expected_concepts:
      - agreement with the other team's lead on scope and ownership
      - who reviews and owns the code afterwards
      - impact on your own team's plan
      - knowledge sharing between the teams
      - outcome for the dependency and the relationship
    rubric:
      excellent: Describes a clear arrangement on scope, review and long-term ownership, explains the cost to their own plan and the result for both teams.
      good: Lent help successfully, but the ownership or cost was handled loosely.
      weak: Sent engineers into another codebase without agreement, causing friction or orphaned work.
    followups:
      - Who maintained that work afterwards?
      - What did it cost your own roadmap?
    common_errors:
      - Not agreeing who owns the contributed work after it ships.

  - external_key: managerial.risk_dependencies.time_zone_handoffs
    competency_key: communication
    topic: Dependencies across time zones
    difficulty: medium
    text: >-
      When a dependency sits with a team many time zones away, how do you stop hand-offs from turning into
      day-long delays? Describe what worked for you.
    expected_concepts:
      - written requests complete enough to act on without a call
      - a small overlap window used for decisions
      - clear owners on each side
      - asynchronous status in a shared place
      - batching questions so one round trip answers them
    rubric:
      excellent: Describes concrete practices such as complete written hand-offs, a protected overlap window and async status, with an example of delays shrinking.
      good: Uses some practical techniques with a real example.
      weak: Relies on meetings at awkward hours or accepts the delays as unavoidable.
    followups:
      - What did a good hand-off note contain?
      - How did you handle urgent issues outside the overlap?
    common_errors:
      - Sending one question at a time and waiting a full day for each answer.

  - external_key: managerial.risk_dependencies.vendor_missed_deliverable
    competency_key: stakeholder_management
    topic: A vendor that failed to deliver
    difficulty: medium
    text: >-
      Tell me about a time an outside vendor or contractor failed to deliver what your project needed. How did
      you respond, and what changed in how you work with vendors?
    expected_concepts:
      - how and when the failure became clear
      - immediate response to protect the project
      - use of the contract, relationship or escalation with the vendor
      - communication with internal stakeholders
      - lasting changes such as milestones, acceptance tests or alternatives
    rubric:
      excellent: Describes the failure, a decisive response protecting the project, how they worked the vendor relationship, and concrete changes to vendor management afterwards.
      good: Handled the situation reasonably and learned something, but the changes are general.
      weak: Absorbed the failure without action or only blames the vendor.
    followups:
      - Looking back, when could you have seen it coming?
      - Did you keep working with that vendor? Why or why not?
    common_errors:
      - Waiting until the final deadline to discover the vendor is not ready.

  - external_key: managerial.risk_dependencies.upstream_breaking_change
    competency_key: collaboration
    topic: An upstream change that broke your work
    difficulty: medium
    text: >-
      An upstream team changed something without warning and it broke your work just before a deadline. Tell me
      how you handled it, both in the moment and with that team afterwards.
    expected_concepts:
      - fast mitigation such as pinning or rolling back
      - contacting the upstream team factually
      - protecting the deadline or resetting expectations
      - agreeing a notification or versioning practice afterwards
      - keeping the relationship constructive
    rubric:
      excellent: Mitigates quickly, works with the upstream team without blame, and agrees a lasting practice such as versioning or change notices that prevented repeats.
      good: Handles the immediate issue well and raises it with the team, with a lighter lasting change.
      weak: Patches around it silently or reacts with blame.
    followups:
      - What did you agree with them to prevent a repeat?
      - What could your team have done to detect it sooner?
    common_errors:
      - Fixing the breakage locally without telling the upstream team, so it happens again.

  - external_key: managerial.risk_dependencies.dependencies_in_commitments
    competency_key: project_management
    topic: Committing dates that rely on others
    difficulty: medium
    text: >-
      How do you account for cross-team dependencies when you estimate and commit to a delivery date? Tell me
      about a commitment you made where this mattered.
    expected_concepts:
      - identifying which dependencies sit on the critical path
      - getting a date from the providing team, not assuming one
      - adding margin for dependency risk
      - stating the commitment as conditional on named dependencies
      - re-planning when a dependency moves
    rubric:
      excellent: Explains how dependencies shape the commitment, gets real dates from providers, states clear conditions and gives an example where this protected them or forced a re-plan.
      good: Considers dependencies in the estimate, with a reasonable example.
      weak: Commits based only on the team's own work.
    followups:
      - How did stakeholders react to a conditional commitment?
      - What happened when one of those conditions failed?
    common_errors:
      - Treating another team's estimate as certain.

  - external_key: managerial.risk_dependencies.avoiding_big_bang_integration
    competency_key: project_management
    topic: Avoiding late integration across teams
    difficulty: medium
    text: >-
      On a project where several teams build pieces that only work together at the end, how have you avoided a
      painful last-minute integration? Walk me through what you did.
    expected_concepts:
      - an early thin end-to-end slice through all components
      - regular integration points or shared test environments
      - contract or end-to-end tests
      - a shared integration owner
      - surfacing mismatches weeks before launch
    rubric:
      excellent: Describes an early end-to-end slice and a regular integration rhythm with an owner, and an example of a mismatch caught early because of it.
      good: Integrates periodically with some testing, but late in the project.
      weak: Integrated at the end and dealt with the fallout.
    followups:
      - What was the first thing that broke when you integrated?
      - Who owned integration across teams?
    common_errors:
      - Letting each team declare itself done before anything works together.

  # ------------------------------------------------------------ harder dependency situations
  - external_key: managerial.risk_dependencies.mutual_wait_deadlock
    competency_key: leadership
    topic: Two teams waiting on each other
    difficulty: hard
    text: >-
      Two teams each say they can't start until the other finishes, and both are working toward your launch.
      How would you break that deadlock? Tell me about anything similar you've faced.
    expected_concepts:
      - getting both teams together to map the actual dependency
      - finding the smallest piece that can unblock one side
      - agreeing interfaces or stubs to allow parallel work
      - making a decision on sequencing if they can't agree
      - follow-up checkpoints to keep both moving
    rubric:
      excellent: Brings both teams together, breaks the circular wait into smaller pieces or stubbed interfaces, makes or secures a sequencing decision and tracks it to completion.
      good: Breaks the deadlock with a sensible approach, though with less structure on follow-up.
      weak: Asks each team to try harder or escalates without analysing the dependency.
    followups:
      - What if neither team wanted to compromise on its design?
      - How would you stop it recurring?
    common_errors:
      - Accepting each team's description of the blocker without checking the actual technical need.

  - external_key: managerial.risk_dependencies.overloaded_central_platform
    competency_key: stakeholder_management
    topic: Depending on an overloaded platform team
    difficulty: hard
    text: >-
      Your team is one of a dozen depending on a central platform team that's badly overloaded. Beyond lobbying
      for your own requests, what have you done, or would you do, to improve the situation for everyone?
    expected_concepts:
      - understanding the platform team's demand and constraints
      - coordinating with other dependent teams on shared priorities
      - contributing work back under an agreed model
      - proposing self-service or fewer custom requests
      - raising the capacity problem to leadership with data
    rubric:
      excellent: Thinks beyond their own team, coordinates with other consumers, offers contributions or self-service ideas and makes a data-backed case for capacity to leadership.
      good: Offers constructive help and some coordination, but stays mostly focused on their own needs.
      weak: Competes harder for the platform team's attention or works around them in ways that add load.
    followups:
      - How would you get other teams to agree on shared priorities?
      - What would you ask leadership for, specifically?
    common_errors:
      - Building shadow versions of platform features that the platform team later has to support.

  - external_key: managerial.risk_dependencies.program_critical_path
    competency_key: project_management
    topic: Critical path across many teams
    difficulty: hard
    text: >-
      You're leading a program with eight teams and dozens of dependencies between them. How do you keep the
      critical path visible, and how do you decide which dependencies deserve your personal attention?
    expected_concepts:
      - a dependency map tied to milestones
      - identifying the critical path and near-critical paths
      - focusing personal effort on high-impact, high-uncertainty dependencies
      - delegating routine dependencies to team leads
      - updating the map as dates move
    rubric:
      excellent: Describes a maintained dependency map, how they find the critical and near-critical paths, a clear rule for where their own attention goes, and how delegation covers the rest.
      good: Tracks dependencies and the critical path well, but is less clear on prioritising their own attention.
      weak: Tries to track every dependency personally or has no view of the critical path.
    followups:
      - How often did the critical path change, and how did you notice?
      - What did you delegate, and to whom?
    common_errors:
      - Giving every dependency equal attention regardless of its effect on the end date.

  - external_key: managerial.risk_dependencies.provider_team_dissolved
    competency_key: leadership
    topic: The team you depended on disappears
    difficulty: hard
    text: >-
      Midway through your project, a reorganisation breaks up the team that owned a component you depend on. How
      would you make sure the work still lands? Tell me if you've been through something like this.
    expected_concepts:
      - finding out quickly who now owns the component
      - capturing knowledge and state from the departing people
      - deciding whether to take it on, wait or reduce scope
      - getting leadership to confirm ownership
      - updating stakeholders on the new risk
    rubric:
      excellent: Moves quickly to establish new ownership, preserves knowledge, weighs taking it on versus other options and secures a clear leadership decision, communicating the new risk.
      good: Reasonable steps to secure the work, but slower on ownership or knowledge capture.
      weak: Waits for the reorganisation to settle and hopes the work continues.
    followups:
      - What would you need to know before taking the component on yourself?
      - Who would you ask to confirm ownership?
    common_errors:
      - Assuming the work will carry on under whoever inherits the people.

  - external_key: managerial.risk_dependencies.low_leverage_vendor
    competency_key: stakeholder_management
    topic: A critical vendor you can't pressure
    difficulty: hard
    text: >-
      Tell me about a time a critical vendor dependency put your delivery at risk and you had little leverage
      over them. How did you protect the project?
    expected_concepts:
      - understanding why leverage was low
      - building relationships with the right people at the vendor
      - using internal channels such as procurement or senior sponsors
      - reducing reliance, for example alternatives or reduced scope
      - adjusting plans and stakeholder expectations
    rubric:
      excellent: Combines relationship building and internal escalation with a parallel plan to reduce reliance, and keeps stakeholders informed, with a concrete outcome.
      good: Uses some sensible levers, but has no fallback plan.
      weak: Waits on the vendor and reports delays as outside their control.
    followups:
      - What fallback did you prepare, and what did it cost?
      - What would you negotiate differently in the next contract?
    common_errors:
      - Treating the vendor as entirely outside their influence.

  - external_key: managerial.risk_dependencies.delivered_but_unusable
    competency_key: collaboration
    topic: A dependency that arrived but doesn't fit
    difficulty: hard
    text: >-
      The other team delivered the component you were waiting for on time, but it doesn't really work for your
      use case. How do you handle that, given you still need to ship? Give me a real example if you have one.
    expected_concepts:
      - working out where the misunderstanding came from
      - separating must-have gaps from nice-to-haves
      - agreeing a fix plan with the other team
      - short-term workarounds and their risks
      - improving how requirements are shared next time
    rubric:
      excellent: Diagnoses the root of the mismatch without blame, triages gaps, agrees fixes and workarounds with the other team, and changes how requirements are validated early.
      good: Gets to a workable outcome with the other team, but with little on prevention.
      weak: Rejects the delivery and blames the other team, or quietly rebuilds it.
    followups:
      - When could the mismatch have been caught earlier?
      - How did you explain the delay to your stakeholders?
    common_errors:
      - Assuming the written request was clear without checking how the other team understood it.

  - external_key: managerial.risk_dependencies.external_partner_launch
    competency_key: project_management
    topic: Launching with an external partner
    difficulty: hard
    text: >-
      Tell me about a launch that depended on an external partner delivering their part of the plan. How did you
      coordinate the two organisations, and what did you do when their plan changed?
    expected_concepts:
      - shared plan and milestones across both organisations
      - named counterparts at working and senior levels
      - joint testing and readiness checks
      - a process for changes on either side
      - options when the partner's plan shifted
    rubric:
      excellent: Describes a shared plan with counterparts at several levels, joint testing, a change process and a concrete response to the partner's change that protected the launch.
      good: Coordinated well with a real example, but the response to the change was reactive.
      weak: Treated the partner as a black box until launch.
    followups:
      - Who on their side did you most need a relationship with?
      - What did the change cost, and who absorbed it?
    common_errors:
      - Relying on a single contact at the partner organisation.
