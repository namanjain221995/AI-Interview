# Managerial round: resources and budget (part 2 of 4).
# Focus: owning and planning budgets, cost cuts, overruns, cloud and tooling spend, return on investment.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ owning a budget
  - external_key: managerial.resources_budget.first_budget_owned
    competency_key: project_management
    topic: Owning a budget for the first time
    difficulty: easy
    text: >-
      Tell me about the first time you were responsible for a budget, whether for a team, a project or a set of
      tools. How did you plan it, and what surprised you?
    expected_concepts:
      - understanding what the budget covered and who approved it
      - building the plan from concrete line items
      - tracking actual spend against the plan
      - something learned that changed how they plan now
    rubric:
      excellent: Describes a specific budget, how it was built from concrete items, how spend was tracked through the period and a clear lesson that changed their later practice.
      good: Gives a real example with planning and some tracking, but the lessons are general.
      weak: Cannot describe how the budget was built or tracked, or the example involves no real responsibility.
    followups:
      - Who did you go to when you weren't sure how something should be costed?
      - What would you plan differently now?
    common_errors:
      - Describing approving expenses rather than planning and owning a budget.

  - external_key: managerial.resources_budget.tracking_spend_against_plan
    competency_key: project_management
    topic: Tracking spend against plan during the year
    difficulty: easy
    text: >-
      Once a budget is agreed, how do you keep track of spending through the year so you're not surprised at the
      end? Describe what you actually do.
    expected_concepts:
      - a regular cadence for reviewing actual against planned spend
      - breaking spend into categories with clear owners
      - early warning thresholds or alerts
      - acting on variances rather than just noting them
      - working with finance partners on the numbers
    rubric:
      excellent: Describes a concrete review rhythm, clear ownership of spend categories, early warning signals and an example of acting on a variance before it became a problem.
      good: Reviews spend regularly and knows the main categories, but gives no example of acting on a variance.
      weak: Leaves tracking entirely to finance and only looks at spend at year end.
    followups:
      - Tell me about a variance you caught early. What did you do?
      - Which part of your spend is hardest to predict?
    common_errors:
      - Reviewing totals only, so growing spend in one category is hidden by savings in another.

  - external_key: managerial.resources_budget.learning_budget_allocation
    competency_key: mentoring
    topic: Allocating a limited learning budget
    difficulty: easy
    text: >-
      Your team has a small learning budget for courses, books and conferences, and requests add up to far more
      than it covers. How do you decide who gets what?
    expected_concepts:
      - linking spending to individual growth plans and team needs
      - transparent and consistent criteria
      - sharing what people learn back with the team
      - low-cost alternatives such as internal sessions or pairing
      - fairness across the team over time
    rubric:
      excellent: Uses transparent criteria tied to growth plans and team needs, spreads opportunities fairly over time, expects knowledge to be shared back and uses low-cost alternatives to stretch the budget.
      good: Makes reasonable, fair decisions with some link to growth, but criteria are not visible to the team.
      weak: First come, first served, or always funds the same people.
    followups:
      - How do you make sure the money led to something useful?
      - What do you do for someone whose request you couldn't fund?
    common_errors:
      - Treating the learning budget as a perk rather than linking it to growth goals.

  - external_key: managerial.resources_budget.tool_requests_beyond_budget
    competency_key: communication
    topic: Saying no to tool requests and explaining why
    difficulty: easy
    text: >-
      Engineers on your team keep asking for new paid tools and services, and you can't fund them all. How do you
      decide, and how do you explain the decisions so people understand the reasoning?
    expected_concepts:
      - simple criteria such as time saved, risk reduced and overlap with existing tools
      - involving the team in ranking requests
      - explaining the budget constraint openly
      - trialling before committing where possible
      - revisiting declined requests when circumstances change
    rubric:
      excellent: Uses simple, shared criteria, involves the team in prioritising, explains the constraint openly and offers trials or later review for declined requests.
      good: Makes sensible decisions and explains them, but the criteria are mostly in their own head.
      weak: Approves or declines based on who asks, without explaining the reasoning.
    followups:
      - Tell me about a request you declined. How did the person respond?
      - How do you avoid paying for tools nobody uses after a few months?
    common_errors:
      - Declining requests without giving the reasoning, which leads to repeated asks and frustration.

  - external_key: managerial.resources_budget.unspent_budget_year_end
    competency_key: ownership
    topic: Handling unspent budget near year end
    difficulty: easy
    text: >-
      Near the end of a budget year you notice your team has a meaningful amount left unspent. What do you do,
      and why?
    expected_concepts:
      - understanding why the underspend happened
      - avoiding waste just to use up the money
      - telling finance early so the money can be used elsewhere
      - using the information to plan the next budget better
      - funding genuinely valuable deferred items if appropriate
    rubric:
      excellent: Investigates the cause of the underspend, avoids spending for its own sake, flags it early to finance and uses the lesson to improve the next plan.
      good: Avoids wasteful spending and considers useful options, but does not mention informing finance or improving planning.
      weak: Rushes to spend everything so the budget isn't cut next year.
    followups:
      - What caused the underspend?
      - How would you set next year's number differently?
    common_errors:
      - Treating unspent budget as something to burn so it is not lost.

  - external_key: managerial.resources_budget.cost_visibility_for_engineers
    competency_key: communication
    topic: Making costs visible to engineers
    difficulty: easy
    text: >-
      How do you help engineers on your team understand what their choices cost, for example cloud resources or
      third-party services, so they can make good trade-offs themselves?
    expected_concepts:
      - sharing cost data per service or feature with the team
      - translating costs into terms the team can relate to
      - including cost in design reviews
      - celebrating cost improvements alongside feature work
      - avoiding blame so cost data is used openly
    rubric:
      excellent: Describes concrete ways cost data reaches engineers, how it is made relatable, how it appears in design decisions and gives an example of the team acting on it.
      good: Shares cost information with the team, but it is not clearly part of everyday decisions.
      weak: Keeps cost information with management only, or uses it mainly to criticise.
    followups:
      - Give me an example of an engineer making a different decision because of cost data.
      - How do you stop cost from becoming the only thing people optimise?
    common_errors:
      - Sharing a monthly total that nobody can connect to their own work.

  - external_key: managerial.resources_budget.project_running_over_budget
    competency_key: ownership
    topic: A project heading over budget
    difficulty: medium
    text: >-
      Tell me about a project that was heading over its budget. When did you notice, and what did you do about
      it?
    expected_concepts:
      - the signal that revealed the overrun and how early it appeared
      - understanding the root cause of the overrun
      - options such as reducing scope, changing approach or requesting more funds
      - informing sponsors early with a recommendation
      - the outcome and what changed in later estimates
    rubric:
      excellent: Describes a specific overrun, explains how it was detected and why it happened, presented sponsors with options and a recommendation early and reports the outcome and the lasting change to estimating.
      good: Took reasonable action and informed sponsors, but detection was late or the root cause is unclear.
      weak: Hid or ignored the overrun until it was unavoidable, or blamed others without taking action.
    followups:
      - How much earlier could you have spotted it?
      - What did the sponsor decide, and did you agree?
    common_errors:
      - Waiting until the money is gone before telling anyone.

  - external_key: managerial.resources_budget.costing_a_project
    competency_key: project_management
    topic: Building a cost estimate for a project
    difficulty: medium
    text: >-
      When you need to estimate what a project will cost, not just how long it will take, what goes into your
      estimate? Walk me through one you put together.
    expected_concepts:
      - people time converted to cost
      - infrastructure, licences and third-party services
      - ongoing run and maintenance cost after launch
      - contingency for known risks
      - stating assumptions and the range of uncertainty
    rubric:
      excellent: Walks through a real estimate covering people, infrastructure, licences and ongoing run costs, states assumptions, uses ranges and contingency, and compares the estimate with what it actually cost.
      good: Covers the major cost categories for a real project, but omits ongoing costs or uncertainty.
      weak: Estimates only engineering time, or produces a single number with no assumptions.
    followups:
      - How close was the estimate to the final cost?
      - Which cost do people most often forget?
    common_errors:
      - Ignoring the cost of running and maintaining the system after it ships.

  - external_key: managerial.resources_budget.cloud_bill_growth
    competency_key: ownership
    topic: Getting a team to own its cloud spend
    difficulty: medium
    text: >-
      Imagine the cloud bill for your team's services has grown much faster than usage over the last two
      quarters. How would you investigate, and how would you get the team to take ownership of it?
    expected_concepts:
      - breaking down spend by service, environment and resource type
      - comparing cost growth with usage or traffic growth
      - quick wins such as idle resources and oversized instances
      - longer-term changes in architecture or defaults
      - ongoing ownership through dashboards, budgets or alerts
    rubric:
      excellent: Breaks down spend to find the drivers, separates quick wins from structural fixes, and builds lasting team ownership through visibility, budgets and alerts.
      good: Investigates sensibly and proposes savings, but lasting ownership is not addressed.
      weak: Asks someone to make a one-off cleanup without understanding why spend grew.
    followups:
      - Who on the team would you make responsible, and how?
      - How would you know the problem isn't coming back?
    common_errors:
      - Doing a one-time cleanup and letting costs drift up again.

  - external_key: managerial.resources_budget.value_of_hard_to_measure_work
    competency_key: communication
    topic: Showing the return on hard-to-measure work
    difficulty: medium
    text: >-
      Some engineering investments, like internal tooling or reliability work, are hard to put a number on. Tell
      me about a time you had to show leadership or finance that such an investment was worth it.
    expected_concepts:
      - choosing proxy measures such as time saved, incidents avoided or lead time
      - establishing a baseline before the investment
      - translating results into business terms
      - being clear about uncertainty and assumptions
      - reporting results after delivery, not only before
    rubric:
      excellent: Describes a specific investment, chose sensible proxy measures with a baseline, translated them into business terms with clear assumptions and reported the actual results after delivery.
      good: Made a reasonable case with some measures, but there was no baseline or follow-up after delivery.
      weak: Argued only that the work was important, with no evidence or translation into business impact.
    followups:
      - What baseline did you capture before you started?
      - How did leadership respond to the numbers?
    common_errors:
      - Claiming exact savings figures that the data cannot support.

  - external_key: managerial.resources_budget.cost_of_delay
    competency_key: stakeholder_management
    topic: Using cost of delay in prioritisation
    difficulty: medium
    text: >-
      How do you help stakeholders see what it costs to delay one piece of work in favour of another? Give me an
      example where that changed a decision.
    expected_concepts:
      - estimating the value lost per week or month of delay
      - comparing urgency as well as total value
      - making the estimate simple enough for stakeholders to use
      - using it in a real prioritisation discussion
      - the decision that changed as a result
    rubric:
      excellent: Gives a real example where a simple cost-of-delay estimate was built, explains how it compared urgency and value, and shows how it changed the decision.
      good: Understands cost of delay and has used it in discussion, but the example lacks a clear outcome.
      weak: Prioritises by gut feel or whoever is most senior, with no way to compare urgency.
    followups:
      - How rough was the estimate, and did that matter?
      - Who disagreed with the result?
    common_errors:
      - Ranking only by total value and ignoring how quickly that value decays.

  - external_key: managerial.resources_budget.roadmap_to_budget_ask
    competency_key: project_management
    topic: Turning a roadmap into a budget request
    difficulty: medium
    text: >-
      Walk me through how you've turned a roadmap into a budget request during annual planning. What did you
      include, and how did you handle the uncertainty?
    expected_concepts:
      - linking each budget line to roadmap outcomes
      - people, infrastructure, tools and external services
      - tiers or scenarios such as minimum, expected and stretch
      - assumptions and risks stated explicitly
      - aligning with finance timelines and formats
    rubric:
      excellent: Describes a concrete planning cycle where budget lines were tied to roadmap outcomes, presented as scenarios with explicit assumptions and aligned with finance's process.
      good: Built a reasonable request tied to the roadmap, but presented a single number without scenarios or assumptions.
      weak: Took last year's budget and added a percentage without reference to the roadmap.
    followups:
      - What happened to the request in the end?
      - Which assumption turned out to be wrong?
    common_errors:
      - Presenting one fixed number so any cut forces an unplanned re-plan.

  - external_key: managerial.resources_budget.unexpected_cost_increase
    competency_key: problem_solving
    topic: Absorbing an unexpected cost increase
    difficulty: medium
    text: >-
      Tell me about a time an unexpected cost landed in the middle of the year, such as a price increase from a
      supplier or a sudden jump in usage charges. How did you deal with it?
    expected_concepts:
      - understanding the size and permanence of the increase
      - options such as negotiation, usage reduction or switching
      - reprioritising other spend to absorb it
      - informing finance and stakeholders early
      - preventing similar surprises
    rubric:
      excellent: Describes a specific cost shock, quickly assessed its scale, explored concrete options including negotiation and usage changes, informed finance early and put protection in place for the future.
      good: Handled the increase sensibly, but did not consider several options or prevention.
      weak: Simply paid it and hoped the budget would stretch, or did not notice until finance raised it.
    followups:
      - Which option did you choose, and why?
      - What early warning would have helped?
    common_errors:
      - Treating a permanent cost increase as a one-off.

  - external_key: managerial.resources_budget.ai_assistant_licences
    competency_key: leadership
    topic: Deciding whether to fund AI coding assistants
    difficulty: medium
    text: >-
      Your engineers want paid AI coding assistants for the whole team, which would be a noticeable line in your
      budget. How would you decide whether it's worth it?
    expected_concepts:
      - a time-boxed pilot with a subset of the team
      - defining measures of value before the pilot
      - security, data handling and licensing checks
      - comparing cost against time saved or quality changes
      - reviewing adoption and value after rollout
    rubric:
      excellent: Proposes a time-boxed pilot with success measures agreed in advance, covers security and data handling, compares cost with measured value and plans to review adoption after rollout.
      good: Proposes a pilot and weighs cost against benefit, but measures or security checks are missing.
      weak: Approves or rejects based on opinion or hype without any evaluation.
    followups:
      - What would you measure during the pilot?
      - What would make you cancel the licences later?
    common_errors:
      - Measuring only how much the tool is used rather than whether it improves outcomes.

  - external_key: managerial.resources_budget.feature_unit_cost_rising
    competency_key: ownership
    topic: A feature whose running cost grows faster than usage
    difficulty: medium
    text: >-
      A feature your team owns relies on a paid external API, and its cost is growing faster than the number of
      users. How would you lead the response?
    expected_concepts:
      - measuring cost per user or per request over time
      - finding the drivers such as retries, caching gaps or inefficient calls
      - engineering options such as caching, batching or cheaper alternatives
      - involving product on pricing or usage limits where needed
      - setting cost alerts and targets going forward
    rubric:
      excellent: Starts from unit cost data to find drivers, combines engineering fixes with product options where needed, and sets up ongoing targets and alerts so the trend stays visible.
      good: Proposes sensible technical fixes, but does not measure unit cost or set ongoing controls.
      weak: Asks for more budget without investigating why unit cost is rising.
    followups:
      - Who outside engineering would you involve, and why?
      - What target would you set for cost per user?
    common_errors:
      - Looking at total spend only, which hides whether efficiency is getting worse.

  - external_key: managerial.resources_budget.retire_to_free_resources
    competency_key: leadership
    topic: Retiring a system or product to free up resources
    difficulty: medium
    text: >-
      Tell me about a time you proposed retiring a system, feature or product so that money and people could be
      used elsewhere. How did you make the case and carry it out?
    expected_concepts:
      - evidence of low usage or value against ongoing cost
      - identifying and supporting affected users
      - getting agreement from owners and stakeholders
      - a migration and shutdown plan
      - confirming the freed resources were actually redeployed
    rubric:
      excellent: Describes a specific retirement backed by usage and cost evidence, managed affected users and stakeholders, carried out a clear shutdown plan and confirmed the freed capacity went to higher-value work.
      good: Made a reasonable case and retired the system, but impact on users or redeployment of resources is thin.
      weak: Proposed it without evidence, or switched it off without warning affected users.
    followups:
      - Who objected, and how did you respond?
      - Where did the freed people or money go?
    common_errors:
      - Underestimating the effort needed to migrate the last few users.

  - external_key: managerial.resources_budget.protecting_contingency
    competency_key: project_management
    topic: Building and protecting contingency
    difficulty: medium
    text: >-
      How do you build contingency into a project's budget or schedule, and how do you stop it from being used up
      on things it wasn't meant for?
    expected_concepts:
      - sizing contingency based on identified risks and past variance
      - keeping contingency visible rather than hidden in estimates
      - clear rules for who can release it and for what
      - tracking its use as risks materialise
      - returning unused contingency
    rubric:
      excellent: Sizes contingency from specific risks and history, keeps it visible with clear release rules and gives an example of tracking or returning it.
      good: Includes contingency on purpose, but how it is controlled or sized is vague.
      weak: Pads every estimate quietly, or includes no contingency at all.
    followups:
      - Tell me about a time contingency got used. What for?
      - How do you explain contingency to a sponsor who wants it removed?
    common_errors:
      - Hiding padding in each task so it gets silently consumed by scope growth.

  - external_key: managerial.resources_budget.pilot_before_big_spend
    competency_key: project_management
    topic: Running a pilot before a large investment
    difficulty: medium
    text: >-
      Tell me about a time you ran a small pilot or experiment before committing a large amount of money or
      people to something. How did you design it, and what did it tell you?
    expected_concepts:
      - the key uncertainty the pilot was meant to answer
      - success and failure criteria set in advance
      - keeping the pilot small and time-boxed
      - the decision made based on the result
      - avoiding a pilot that drifts into production without a decision
    rubric:
      excellent: Describes a pilot designed around a specific uncertainty with criteria agreed in advance, kept it bounded and shows how the result drove a clear go or no-go decision.
      good: Ran a reasonable pilot that informed the decision, but criteria were defined loosely or after the fact.
      weak: The pilot had no clear question or criteria, or simply became the full project.
    followups:
      - What would a failed pilot have looked like?
      - Did the full investment perform like the pilot?
    common_errors:
      - Defining success criteria only after seeing the results.

  - external_key: managerial.resources_budget.tooling_instead_of_hiring
    competency_key: leadership
    topic: Spending on tools or infrastructure instead of hiring
    difficulty: medium
    text: >-
      Have you ever chosen to spend money on tools, automation or infrastructure instead of hiring someone, or the
      other way round? Tell me how you weighed the two.
    expected_concepts:
      - the problem both options were meant to solve
      - full cost comparison over a realistic period
      - speed to impact for each option
      - flexibility and the cost of reversing the decision
      - results after the choice
    rubric:
      excellent: Describes a real choice, compares the full cost and time to impact of each option over a realistic period, considers reversibility and reports how it worked out.
      good: Gives a real example and reasonable comparison, but the cost analysis is partial.
      weak: Discusses the options in general terms without a real example or comparison.
    followups:
      - What would have made you choose the other option?
      - How did the team react to the decision?
    common_errors:
      - Comparing a tool's licence price to a full salary without counting setup and maintenance.

  # ------------------------------------------------------------ hard
  - external_key: managerial.resources_budget.twenty_percent_cut
    competency_key: leadership
    topic: Making a significant non-headcount budget cut
    difficulty: hard
    text: >-
      Midway through the year you're told to cut twenty percent of your team's non-headcount spend, things like
      tools, services and travel. How would you decide what to cut, and how would you roll it out?
    expected_concepts:
      - full inventory of current spend with usage and value
      - separating essential, valuable and nice-to-have items
      - contract terms and the real timing of savings
      - risks introduced by each cut, such as security or reliability
      - communicating the decisions and reasons to the team
      - monitoring impact after the cuts
    rubric:
      excellent: Builds a full inventory, ranks items by value and risk, checks contract terms for when savings actually land, avoids cuts that create security or reliability risk, explains decisions to the team and monitors impact.
      good: Takes a structured approach to choosing cuts, but misses contract timing or risk.
      weak: Cuts the same percentage from every line, or cuts whatever is easiest without assessing impact.
    followups:
      - What would you refuse to cut, and how would you defend that?
      - How would you know a cut had gone too deep?
    common_errors:
      - Cancelling tools whose contracts can't end this year, so the saving never appears.

  - external_key: managerial.resources_budget.defending_team_size
    competency_key: stakeholder_management
    topic: Responding to a proposal to shrink the team
    difficulty: hard
    text: >-
      Leadership is considering reducing your team by a third to save cost. You have a week before the decision.
      How would you use that time?
    expected_concepts:
      - understanding the savings target and the decision makers' concerns
      - showing concretely what would stop or degrade at a smaller size
      - risks such as reliability, security and key-person dependency
      - offering alternative savings or a phased approach
      - preparing a credible plan for the smaller team if the decision goes ahead
    rubric:
      excellent: Understands the business goal, presents concrete consequences and risks of the reduction, offers credible alternatives and also prepares a realistic plan for operating at the smaller size.
      good: Makes a clear case about impact and offers some alternatives, but does not prepare for the decision going ahead.
      weak: Argues only that the team is essential, or simply accepts without showing any consequences.
    followups:
      - What would you be willing to give up to keep the team intact?
      - If the reduction happens, what's the first thing you would change?
    common_errors:
      - Arguing from loyalty to the team instead of business impact and risk.

  - external_key: managerial.resources_budget.cost_versus_reliability
    competency_key: leadership
    topic: Balancing cost reduction against reliability
    difficulty: hard
    text: >-
      Tell me about a time you were under pressure to reduce infrastructure or operating costs and those savings
      could have hurt reliability or quality. How did you decide where the line was?
    expected_concepts:
      - understanding reliability targets and what customers rely on
      - quantifying the risk introduced by each saving
      - choosing savings with low reliability impact first
      - making the remaining trade-off explicit to decision makers
      - monitoring reliability after changes
    rubric:
      excellent: Describes a real tension, quantified the risk of each saving against reliability targets, chose low-risk savings first, made the remaining trade-off explicit to decision makers and monitored the result.
      good: Made sensible choices with reliability in mind, but the trade-off was not made explicit or monitored.
      weak: Either refused any savings or cut costs without assessing the impact on reliability.
    followups:
      - What reliability signal did you watch after the change?
      - Who made the final call on the riskier savings?
    common_errors:
      - Removing redundancy that only matters during rare failures without stating that risk.

  - external_key: managerial.resources_budget.messaging_cost_cuts_to_team
    competency_key: communication
    topic: Explaining cost-cutting decisions to the team
    difficulty: hard
    text: >-
      Tell me about a time you had to explain an unpopular cost decision to your team, like cancelling a tool,
      reducing travel or pausing a project people cared about. How did you handle the conversation?
    expected_concepts:
      - explaining the business reason clearly and directly
      - being open about what was decided and what was still uncertain
      - listening to concerns and the real impact on people's work
      - adjusting where feedback revealed a real problem
      - following up after the change
    rubric:
      excellent: Describes a specific decision, explained the reasoning openly, listened to the impact on people's work, made adjustments where feedback showed a real problem and followed up afterwards.
      good: Communicated the decision clearly and answered questions, but did not adjust or follow up.
      weak: Blamed leadership, avoided the conversation or announced the decision with no explanation.
    followups:
      - What concern from the team did you not expect?
      - Did you change anything because of their feedback?
    common_errors:
      - Distancing themselves from the decision by blaming leadership.

  - external_key: managerial.resources_budget.shared_platform_chargeback
    competency_key: stakeholder_management
    topic: Splitting shared platform costs across teams
    difficulty: hard
    text: >-
      Suppose you run a shared platform, and product teams start complaining about how its costs are charged back
      to them. How would you approach designing or fixing the cost model?
    expected_concepts:
      - understanding what drives the platform's costs
      - choosing an allocation method teams can understand and influence
      - balancing accuracy against simplicity
      - avoiding incentives that push teams to unsafe workarounds
      - consulting teams and rolling out changes predictably
    rubric:
      excellent: Bases the model on real cost drivers, chooses an understandable allocation that teams can influence, weighs accuracy against simplicity, anticipates bad incentives and rolls changes out with consultation and notice.
      good: Proposes a reasonable allocation method, but misses either incentives or how teams are consulted.
      weak: Splits costs evenly or by headcount without considering usage or behaviour.
    followups:
      - What behaviour might your model accidentally encourage?
      - How would you handle a team that says they can't afford the new charges?
    common_errors:
      - Designing a precise model that nobody can understand or act on.

  - external_key: managerial.resources_budget.negotiating_shared_pool
    competency_key: collaboration
    topic: Negotiating a shared budget with peer managers
    difficulty: hard
    text: >-
      Tell me about a time a fixed pool of money or headcount had to be split between you and other managers. How
      did you negotiate your share while keeping a good working relationship with your peers?
    expected_concepts:
      - understanding peers' needs and the organisation's priorities
      - making the case in terms of shared goals
      - proposing a fair process or criteria for the split
      - accepting a result that was best overall even if not best for their team
      - maintaining collaboration afterwards
    rubric:
      excellent: Describes a specific negotiation, framed requests around shared goals, proposed or used fair criteria, accepted an outcome that served the organisation and kept a working relationship with peers.
      good: Negotiated reasonably and reached an agreement, but focused mostly on their own team's needs.
      weak: Treated it as a contest to win, or went around peers to a manager without trying to agree.
    followups:
      - What did you give up, and why?
      - How did the decision affect your relationship with those peers?
    common_errors:
      - Inflating their own request to leave room for negotiation.
