# Curated questions: managerial round, cross-team coordination (part 1 of 4). Distributed and
# multi-time-zone collaboration: async decisions, shared vocabulary, regional coverage, partner-team
# relationships and the people who act as bridges between sites.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  - external_key: managerial.cross_team.decision_log_across_regions
    competency_key: communication
    topic: Carrying decisions across regions
    difficulty: easy
    text: >-
      When a decision gets made in a meeting that colleagues in another region couldn't attend, what do you do so
      they learn about it, understand the reasoning, and still have a chance to push back?
    expected_concepts:
      - written record of the decision, options and reasoning
      - one known place where decisions are kept
      - a window for absent people to raise objections
      - naming an owner who answers questions
      - checking that the record was actually read
    rubric:
      excellent: Describes a concrete habit such as a short decision record with context and alternatives, posted where everyone looks, with an explicit window for comments and an owner who follows up.
      good: Writes decisions down and shares them, but says little about how absent colleagues can still influence them.
      weak: Relies on meeting notes or word of mouth and assumes people will catch up on their own.
    followups:
      - Tell me about a time someone in the other region reopened a decision. How did you handle it?
      - How long do you keep a decision open for comment?
    common_errors:
      - Treating a shared recording as enough without a written summary.

  - external_key: managerial.cross_team.learning_partner_team_rhythm
    competency_key: collaboration
    topic: Learning how a partner team plans
    difficulty: easy
    text: >-
      Say your team starts depending on a team in another office whose leads you've never worked with. What would
      you try to learn about how they plan and prioritise, and how would you go about learning it?
    expected_concepts:
      - their planning cadence and when commitments are made
      - how requests reach them and who decides priority
      - their current goals and pressures
      - meeting the lead and a few engineers directly
      - agreeing how to contact each other for urgent issues
    rubric:
      excellent: Lists specific things to learn such as planning cycle, intake route and decision makers, and describes a practical plan to learn them through direct conversations before the first request lands.
      good: Recognises the need to understand the other team's process and proposes meeting them, but the list of what to learn is thin.
      weak: Would simply send requests and wait to see what happens.
    followups:
      - What would make you adjust your own planning to fit theirs?
      - How did that play out the last time you did it?
    common_errors:
      - Focusing only on social rapport and never on how work actually gets prioritised.

  - external_key: managerial.cross_team.sync_or_async_choice
    competency_key: communication
    topic: Choosing a live call or a written thread
    difficulty: easy
    text: >-
      When a question comes up that involves two or three teams in different time zones, how do you decide whether
      to settle it in writing or to get people on a call together?
    expected_concepts:
      - urgency and cost of waiting a day
      - how contested or ambiguous the topic is
      - number of people who need to be involved
      - fairness of meeting time for each location
      - writing up the outcome either way
    rubric:
      excellent: Gives clear criteria such as urgency, level of disagreement and number of parties, explains when a written thread stalls and a call is worth it, and always captures the outcome in writing.
      good: Has a sensible default with a rough sense of when to switch, but the criteria are loose.
      weak: Always defaults to one approach regardless of the situation.
    followups:
      - Give me an example of a written thread that should have been a call.
      - How do you keep a call from excluding the location that can't attend?
    common_errors:
      - Ignoring who bears the inconvenient meeting hour.

  - external_key: managerial.cross_team.status_words_mean_different
    competency_key: communication
    topic: Teams using the same words differently
    difficulty: medium
    text: >-
      Have you run into a situation where two teams said a piece of work was done, ready or committed, and meant
      quite different things by it? What happened, and how did you sort it out?
    expected_concepts:
      - noticing the mismatch and its consequence
      - making the definitions explicit
      - agreeing shared criteria at the boundary between teams
      - adjusting plans affected by the misunderstanding
      - preventing repeats in later work
    rubric:
      excellent: Gives a specific example of a costly mismatch, explains how they surfaced the different meanings, agreed explicit criteria at the hand-off point and changed how the teams report status afterwards.
      good: Describes the misunderstanding and a reasonable fix, with limited follow-through.
      weak: Blames the other team for being unclear without describing any shared resolution.
    followups:
      - Where did you write the agreed definition down?
      - How did you catch it the next time before it caused a slip?
    common_errors:
      - Fixing the one incident without changing the shared vocabulary.

  - external_key: managerial.cross_team.retire_stale_sync
    competency_key: communication
    topic: A recurring cross-team meeting that lost its purpose
    difficulty: easy
    text: >-
      Think of a recurring cross-team meeting you were part of that had stopped being useful. What did you notice,
      and what did you do about it?
    expected_concepts:
      - signs the meeting had lost value
      - asking attendees what they need from it
      - changing format, frequency or attendance, or ending it
      - replacing it with a written update where suitable
      - checking that information still flowed afterwards
    rubric:
      excellent: Gives concrete signals such as low attendance or status read aloud, describes gathering input from the other teams, and explains the change made and how they checked nothing important was lost.
      good: Changed or cancelled the meeting sensibly but did not check the effect.
      weak: Kept attending without acting, or cancelled it unilaterally without telling the other teams.
    followups:
      - Who else did you need to agree with before changing it?
      - What replaced the information it used to provide?
    common_errors:
      - Cancelling the meeting with no replacement for the decisions it used to make.

  - external_key: managerial.cross_team.cross_team_demo
    competency_key: communication
    topic: Showing progress to neighbouring teams
    difficulty: easy
    text: >-
      What have you done to let teams that depend on yours see what you're building before it's finished, and what
      did you get out of it?
    expected_concepts:
      - regular demos or previews for dependent teams
      - choosing what to show and when
      - collecting feedback that changes the work
      - catching integration problems early
      - keeping it short enough that people attend
    rubric:
      excellent: Describes a specific practice such as a recurring demo or preview build, gives an example of feedback from another team that changed the design or caught a problem early, and explains how they kept it worthwhile.
      good: Has shared progress with other teams and can say what it helped, but the example is general.
      weak: Only shares work once it is released, or cannot name any benefit.
    followups:
      - What feedback surprised you most?
      - How did you stop the demo becoming a status meeting?
    common_errors:
      - Describing a demo to leadership rather than to the teams that depend on the work.

  - external_key: managerial.cross_team.docs_as_source_of_truth
    competency_key: communication
    topic: Keeping one source of truth for a shared effort
    difficulty: easy
    text: >-
      On a project that involves several teams, how do you make sure everyone works from the same up-to-date picture
      of scope, owners and dates?
    expected_concepts:
      - a single shared page or tracker everyone knows about
      - named owner responsible for keeping it current
      - linking team-level trackers rather than duplicating them
      - routine for updating it
      - pointing conversations back to it
    rubric:
      excellent: Describes a single maintained artefact with a clear owner and update routine, explains how team trackers feed it and how they steer people back to it when facts drift in chat.
      good: Keeps a shared document but ownership or upkeep is loose.
      weak: Relies on each team's own tools and meetings with no shared view.
    followups:
      - What did you do when the page and reality disagreed?
      - How much detail do you put there versus in each team's tracker?
    common_errors:
      - Creating a shared document that nobody owns and that goes stale within weeks.

  - external_key: managerial.cross_team.headquarters_bias
    competency_key: leadership
    topic: One location always making the calls
    difficulty: medium
    text: >-
      Imagine engineers at one of your sites tell you that important technical decisions always seem to be made by
      the people in the main office. How would you find out whether that's true, and what would you change if it is?
    expected_concepts:
      - looking at evidence of where and how decisions were made
      - talking to people at both sites
      - changing decision forums and timing to include both
      - giving the other site real ownership of areas
      - checking later whether the pattern changed
    rubric:
      excellent: Checks recent decisions for evidence, hears from both sites, and proposes structural changes such as written proposals, rotating meeting times and owned areas at the other site, with a way to tell whether it worked.
      good: Takes the concern seriously and proposes reasonable inclusion steps, but without checking the facts or measuring change.
      weak: Dismisses the concern or answers only with more video calls.
    followups:
      - What if the main office leads disagree that there's a problem?
      - Have you seen ownership of an area move to a remote site? How did it go?
    common_errors:
      - Treating it purely as a communication issue rather than one of decision rights.

  - external_key: managerial.cross_team.incident_across_regions
    competency_key: leadership
    topic: An incident when the owning team is offline
    difficulty: medium
    text: >-
      Tell me about an incident where the people who could fix the problem were in another time zone and off shift.
      How did you get it resolved, and what did you change afterwards?
    expected_concepts:
      - how the right people were reached or the issue contained
      - deciding when to wake someone versus mitigate locally
      - clear communication during the incident
      - follow-up on runbooks, access or escalation paths
      - sharing knowledge so the local team could act next time
    rubric:
      excellent: Gives a concrete incident, explains the decision about paging versus local mitigation, and describes specific follow-up such as runbooks, access or cross-region escalation agreements that reduced dependence on the offline team.
      good: Describes getting the incident resolved with a sensible process but the follow-up is vague.
      weak: Describes waiting for the other team to wake up with no mitigation or later improvement.
    followups:
      - What did the team that got woken up think of the process?
      - Which follow-up action made the biggest difference?
    common_errors:
      - Telling the incident story without any change to how the teams work across regions.

  - external_key: managerial.cross_team.release_timing_for_other_region
    competency_key: project_management
    topic: Timing a release that lands on another region
    difficulty: medium
    text: >-
      Your team ships changes at the end of your working day, which is the start of the day for a team in another
      region who then deals with any fallout. How would you approach that situation?
    expected_concepts:
      - recognising the cost pushed onto the other team
      - talking with that team about the impact
      - adjusting release timing or adding overlap coverage
      - rollback, feature flags and monitoring to reduce fallout
      - clear handover notes for every release
    rubric:
      excellent: Names the unfair cost, involves the other team, and proposes a mix of timing changes, safer release mechanics and handover practice, with a way to check the fallout fell.
      good: Proposes changing release time or adding handover notes, but considers only one lever.
      weak: Sees no problem because the other team is on shift anyway.
    followups:
      - What if moving the release time slows your team down a lot?
      - How would you know the change worked?
    common_errors:
      - Solving it for your team's convenience without asking the affected team.

  - external_key: managerial.cross_team.split_work_between_sites
    competency_key: leadership
    topic: Dividing work between two sites
    difficulty: hard
    text: >-
      If you were leading a product built by teams in two distant locations, how would you decide how to divide the
      work between them, and what trade-offs have you seen with the different ways of splitting it?
    expected_concepts:
      - splitting by component or service versus by feature or customer journey
      - minimising hand-offs that need real-time collaboration
      - giving each site end-to-end ownership of something meaningful
      - interfaces and contracts at the boundaries
      - revisiting the split as the product changes
    rubric:
      excellent: Compares at least two split strategies with concrete costs, explains a choice driven by reducing cross-site hand-offs and giving each site real ownership, and draws on an example where a split worked or failed.
      good: Proposes a sensible split with some reasoning but does not weigh alternatives.
      weak: Divides work by whoever is available, or gives one site only maintenance or testing work.
    followups:
      - What signs would tell you the split is wrong?
      - How would you move an area from one site to the other if needed?
    common_errors:
      - Ignoring how much daily coordination the chosen split will require.

  - external_key: managerial.cross_team.in_person_investment
    competency_key: leadership
    topic: Deciding when to bring people together in person
    difficulty: medium
    text: >-
      With a limited budget for travel, how have you decided when it's worth getting people from different teams
      or locations in the same room, and what did you plan for that time?
    expected_concepts:
      - choosing moments with highest value such as kickoffs or hard planning
      - planning the time around decisions and relationships, not status
      - including people who rarely travel
      - preparing beforehand so time is used well
      - following up afterwards
    rubric:
      excellent: Gives a real example of a deliberate choice of timing, describes an agenda built around hard decisions and relationship building, and explains what changed in cross-team work afterwards.
      good: Explains sensible reasons to meet in person but the planning or outcome is generic.
      weak: Treats in-person time as social only or has no view on when it is worth it.
    followups:
      - What would you do if only some people could travel?
      - What did that time achieve that video calls couldn't?
    common_errors:
      - Filling in-person time with presentations that could have been documents.

  - external_key: managerial.cross_team.review_latency_across_zones
    competency_key: project_management
    topic: Slow code reviews between distant teams
    difficulty: medium
    text: >-
      Changes that need a review from a team on the other side of the world keep taking two or three days to merge.
      How would you work out what's going on and speed things up?
    expected_concepts:
      - measuring where the time goes
      - smaller changes and clearer descriptions
      - review owners or rotations at each location
      - delegating review rights where risk allows
      - agreed response time expectations
    rubric:
      excellent: Starts by measuring the delay, then combines practical fixes such as smaller changes, review rotations, delegated approval for low-risk areas and agreed turnaround, and explains how they'd negotiate these with the other team.
      good: Suggests reasonable fixes like smaller changes or review rotations without diagnosing first.
      weak: Asks the other team to review faster with no other change.
    followups:
      - Which changes would you still insist go through the other team?
      - How would you get the other team to agree?
    common_errors:
      - Removing the review requirement entirely without considering risk.

  - external_key: managerial.cross_team.rfc_across_time_zones
    competency_key: communication
    topic: Getting comments on a proposal from many teams
    difficulty: medium
    text: >-
      Tell me about a time you wrote a technical or process proposal that several teams in different locations had
      to review. How did you get useful input from all of them and reach a decision?
    expected_concepts:
      - writing for readers without shared context
      - naming specific reviewers from each team
      - a clear comment window and decision date
      - resolving disagreements visibly
      - announcing the final decision and its reasoning
    rubric:
      excellent: Describes a real proposal, explains how they made it readable for outsiders, sought named reviewers, ran a time-boxed review, resolved objections and closed with a clear decision record.
      good: Shared a proposal widely and gathered comments, but the path to a decision was informal.
      weak: Sent a document with no structure for review and decided once comments dried up.
    followups:
      - Which objection was hardest to resolve, and how did you handle it?
      - What did you do about teams that never commented?
    common_errors:
      - Equating silence with agreement.

  - external_key: managerial.cross_team.site_lead_as_bottleneck
    competency_key: leadership
    topic: The only bridge between two sites
    difficulty: medium
    text: >-
      On a team split across two locations, one tech lead has become the only person who really talks to the other
      site, and everything flows through them. What would you do about that?
    expected_concepts:
      - risk of a single point of failure and overload
      - creating direct engineer-to-engineer relationships
      - pairing and shared ownership across sites
      - writing down what currently lives in that person's head
      - keeping the lead's role valued while spreading it
    rubric:
      excellent: Names the risks, proposes concrete steps to build direct links between engineers at both sites, and handles the lead's role thoughtfully so they become a facilitator rather than a relay.
      good: Recognises the bottleneck and suggests spreading contact, with few specifics.
      weak: Sees the arrangement as efficient and would leave it in place.
    followups:
      - How would you talk to the tech lead about this?
      - How would you know the dependency had reduced?
    common_errors:
      - Removing the lead from the role abruptly without a transition.

  - external_key: managerial.cross_team.mentoring_across_zones
    competency_key: mentoring
    topic: Mentoring someone in a distant time zone
    difficulty: medium
    text: >-
      How have you mentored or coached someone who worked in a very different time zone from you, and what did you
      have to do differently compared with mentoring someone nearby?
    expected_concepts:
      - agreeing a regular slot that is fair to both
      - using written feedback and review comments
      - finding local people for day-to-day help
      - setting clear goals for the mentoring
      - checking progress over time
    rubric:
      excellent: Gives a real example, explains concrete adaptations such as written feedback loops, shared goals and a local buddy, and describes the person's progress.
      good: Describes sensible adaptations but the outcome is unclear.
      weak: Describes mentoring identical to in-person work or only occasional chats.
    followups:
      - What did you find hardest to coach at a distance?
      - How did you know it was working?
    common_errors:
      - Making the mentee carry all the inconvenient meeting times.

  - external_key: managerial.cross_team.handoff_commitments_missed
    competency_key: stakeholder_management
    topic: A partner team repeatedly missing handover commitments
    difficulty: medium
    text: >-
      A team in another region keeps missing the handover points you agreed, so your team regularly starts the day
      blocked. How would you handle it with them?
    expected_concepts:
      - collecting specific examples and impact
      - talking with their lead to understand causes
      - jointly redesigning the handover
      - agreeing what happens when a handover will be late
      - escalating only after joint attempts
    rubric:
      excellent: Brings evidence, seeks the other team's causes before proposing fixes, agrees a redesigned handover with early warning when it will slip, and has a measured plan for escalation.
      good: Raises the issue directly and proposes fixes, but does not explore the other team's constraints.
      weak: Escalates straight away or quietly works around it.
    followups:
      - What if the cause is that their priorities have shifted?
      - When would you involve your manager?
    common_errors:
      - Assuming carelessness before asking about the other team's constraints.

  - external_key: managerial.cross_team.channel_sprawl
    competency_key: communication
    topic: Too many places to follow cross-team discussion
    difficulty: medium
    text: >-
      Cross-team conversations on your project are scattered across chat channels, email, tickets and documents,
      and important things keep getting missed. How would you bring some order to it?
    expected_concepts:
      - agreeing which channel is for what
      - one place for decisions and announcements
      - reducing or archiving duplicate channels
      - leading by example and redirecting gently
      - checking whether important items are still missed
    rubric:
      excellent: Proposes a simple, agreed map of channels by purpose, a single place for decisions, explains how they'd get other teams to adopt it and how they'd tell if fewer things were missed.
      good: Proposes consolidating channels but without agreement from other teams or a check on results.
      weak: Suggests adding another tool or channel to fix the problem.
    followups:
      - How would you get another team to change their habits?
      - What would you do with urgent messages?
    common_errors:
      - Imposing rules on other teams without agreeing them.

  - external_key: managerial.cross_team.coverage_without_overlap
    competency_key: project_management
    topic: Getting help when no one overlaps
    difficulty: hard
    text: >-
      Your team depends on a specialist team whose working hours don't overlap with yours at all. How would you set
      things up so your team isn't stuck for a full day every time it needs them?
    expected_concepts:
      - request templates with full context so one round trip suffices
      - self-service documentation and tooling
      - agreed urgent escalation path
      - a small rotating overlap or office hours
      - building limited expertise inside your own team
    rubric:
      excellent: Combines several approaches such as complete requests, self-service, an agreed escalation path and building some in-house capability, and explains how they would negotiate the arrangement with the specialist team.
      good: Proposes one or two helpful practices without addressing urgent cases.
      weak: Expects the specialist team to change their hours or accepts the delays as unavoidable.
    followups:
      - Which kinds of requests would you stop sending to them altogether?
      - How would the specialist team benefit?
    common_errors:
      - Designing the arrangement entirely around their own team's needs.

  - external_key: managerial.cross_team.night_escalation_shared_release
    competency_key: project_management
    topic: Escalation plan for a release spanning regions
    difficulty: hard
    text: >-
      You're coordinating a release that several teams in different regions contribute to, and it will roll out
      over a full day. Walk me through how you'd plan who makes decisions and who gets contacted if something goes
      wrong at each point.
    expected_concepts:
      - a timeline showing which region is on duty when
      - a named decision maker for each phase
      - clear rollback criteria agreed beforehand
      - contact list and escalation path per component
      - handover points between regions during the rollout
    rubric:
      excellent: Lays out a phase-by-phase plan with named decision makers, pre-agreed rollback criteria, per-component contacts and explicit handovers between regions, and mentions rehearsing or reviewing the plan with teams beforehand.
      good: Covers contacts and rollback but decision rights or handovers are fuzzy.
      weak: Relies on whoever is online to decide in the moment.
    followups:
      - What would you do if the decision maker can't be reached?
      - How would you review the plan with the other teams?
    common_errors:
      - Leaving rollback criteria to be decided during the incident.

  - external_key: managerial.cross_team.measuring_distributed_collaboration
    competency_key: leadership
    topic: Knowing whether distributed collaboration is working
    difficulty: hard
    text: >-
      If you led several teams spread across locations, how would you tell whether they were collaborating well or
      just tolerating each other, and what would you look at beyond people saying it's fine?
    expected_concepts:
      - wait times on cross-team requests and reviews
      - rework or incidents caused at team boundaries
      - who participates in decisions from each location
      - direct contact between engineers, not only leads
      - regular structured feedback from each team
    rubric:
      excellent: Names specific observable signals such as cross-team wait times, boundary defects and participation in decisions, combines them with structured feedback, and explains what they'd do with a bad signal.
      good: Has a few sensible signals but leans mostly on asking people.
      weak: Relies on whether anyone complains.
    followups:
      - Which signal have you actually tracked, and what did it show?
      - How would you avoid the measures becoming targets?
    common_errors:
      - Measuring activity such as meeting counts instead of outcomes.

  - external_key: managerial.cross_team.outsourced_team_integration
    competency_key: stakeholder_management
    topic: Integrating an outsourced team in another region
    difficulty: hard
    text: >-
      Tell me about working with an outsourced or partner engineering team in another region whose output wasn't
      meeting your quality expectations. How did you improve things?
    expected_concepts:
      - making quality expectations explicit and testable
      - understanding their constraints and incentives
      - involving them earlier in design and review
      - working through their management and the contract where needed
      - tracking whether quality improved
    rubric:
      excellent: Describes a real case, explains how they made expectations concrete, worked with the partner's leads and incentives, integrated them into design and review, and shows measurable improvement or a reasoned decision to change the arrangement.
      good: Took reasonable steps to clarify expectations and review more closely, with a partial result.
      weak: Rewrote the work in-house or complained about the vendor without trying to fix the collaboration.
    followups:
      - What did you learn about how they were set up to work?
      - When would you decide the arrangement can't work?
    common_errors:
      - Adding inspection at the end instead of improving how the work is specified.

  - external_key: managerial.cross_team.coaching_site_point_of_contact
    competency_key: mentoring
    topic: Developing someone to represent a remote site
    difficulty: hard
    text: >-
      How would you develop an engineer at a smaller remote site into the person who represents that site in
      cross-team technical decisions, and how would you know they were ready?
    expected_concepts:
      - choosing someone with interest and relevant strengths
      - gradually increasing responsibility in real forums
      - preparing together and reviewing afterwards
      - introducing them to key people at the main site
      - observable signs of readiness
    rubric:
      excellent: Describes a staged plan with real responsibility, preparation and debriefs, sponsorship with key people, and concrete readiness signs such as others seeking their view or decisions they drove.
      good: Has a reasonable plan for coaching but readiness criteria are vague.
      weak: Simply gives the title and expects the person to grow into it alone.
    followups:
      - What if senior people at the main site keep going around them?
      - Have you done this before? What happened?
    common_errors:
      - Delegating the role without the authority or access it needs.

  - external_key: managerial.cross_team.partner_team_reorganised
    competency_key: stakeholder_management
    topic: A partner team's structure changes under you
    difficulty: medium
    text: >-
      Partway through a joint effort, a partner team you depend on reorganises and your usual contacts move on.
      What would you do in the next couple of weeks to keep your shared work on track?
    expected_concepts:
      - finding out who now owns the commitments
      - restating agreed scope and dates in writing to new owners
      - assessing risk to the plan and telling stakeholders
      - building relationships with the new contacts
      - adjusting the plan if commitments change
    rubric:
      excellent: Moves quickly to identify new owners, re-confirms commitments in writing, assesses and communicates the risk, and invests in new relationships while preparing a fallback.
      good: Finds new contacts and re-confirms work, but does not assess risk or prepare a fallback.
      weak: Assumes the commitments carry over unchanged.
    followups:
      - What if the new owners don't recognise the old commitment?
      - Who would you tell, and when?
    common_errors:
      - Waiting until a missed date to discover the commitment was dropped.

  - external_key: managerial.cross_team.new_lead_introductions
    competency_key: communication
    topic: Introducing yourself to neighbouring teams as a new lead
    difficulty: easy
    text: >-
      When you take over leading a team, how do you go about introducing yourself and your team to the other teams
      you work with, and what do you want to learn from them?
    expected_concepts:
      - identifying the teams that depend on yours and those you depend on
      - one-to-one conversations with their leads
      - asking what works and what frustrates them
      - sharing your team's current priorities
      - following up on what you heard
    rubric:
      excellent: Describes a deliberate plan to map neighbouring teams, hold early conversations focused on listening, share priorities and follow up visibly on at least one concern raised.
      good: Meets the other teams' leads early but the purpose is mostly introductions.
      weak: Waits for cross-team issues to come up naturally.
    followups:
      - What was the most useful thing you learned last time you did this?
      - How did you act on it?
    common_errors:
      - Spending the conversations presenting plans instead of listening.
