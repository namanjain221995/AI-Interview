# Curated questions: managerial round, hiring and interviewing (part 4: interviewing technique,
# evaluating evidence, partners in the process and building a hiring practice). Evaluation is based
# only on the substance of the answer (approach, actions, results, reflection), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: managerial.hiring.interviewing_project_managers
    competency_key: project_management
    topic: Interviewing a project manager
    difficulty: easy
    text: >-
      If you were interviewing a project manager, what would you ask them to walk you through to see how
      they really plan and track work?
    expected_concepts:
      - a real project they planned end to end
      - how they identified dependencies and risks
      - how they tracked progress and reported status
      - what they did when the plan slipped
    rubric:
      excellent: Proposes asking for a walkthrough of a real project with targeted probes on planning, risks, tracking and recovery, and explains what strong and weak answers would reveal.
      good: Suggests relevant questions about planning and tracking work.
      weak: Asks about tools or certifications rather than how the person actually manages work.
    followups:
      - What answer would worry you?
      - How would you check what they personally did versus their team?
    common_errors:
      - Judging project managers on familiarity with a specific tool.

  - external_key: managerial.hiring.candidate_gets_stuck
    competency_key: mentoring
    topic: When a candidate gets stuck in an exercise
    difficulty: easy
    text: >-
      When a candidate gets stuck during a technical exercise, what do you do, and how does that affect how
      you score them?
    expected_concepts:
      - giving consistent, graduated hints
      - noting what hints were needed
      - observing how they use help and recover
      - scoring against the rubric rather than whether they finished
    rubric:
      excellent: Describes a consistent hinting approach used for every candidate, records how hints were used and explains how they score recovery and reasoning against the rubric.
      good: Offers hints and considers the candidate's reasoning when scoring.
      weak: Watches the candidate struggle silently or fails anyone who doesn't finish.
    followups:
      - How do you make sure every candidate gets the same level of help?
      - What's the difference between a small and a large hint in your scoring?
    common_errors:
      - Giving some candidates much more help than others.

  - external_key: managerial.hiring.tech_lead_hiring_role
    competency_key: leadership
    topic: A tech lead's part in hiring
    difficulty: easy
    text: >-
      What part have you played in hiring for a team you worked on, and how did you work with the hiring
      manager on it?
    expected_concepts:
      - specific responsibilities such as designing exercises or interviewing
      - input into role definition and level expectations
      - sharing evaluations through agreed channels
      - involvement in onboarding new hires
    rubric:
      excellent: Describes concrete responsibilities in the process, how they coordinated with the hiring manager and the impact of their contribution on hiring outcomes.
      good: Explains a clear role in interviewing or evaluation.
      weak: Had minimal involvement or describes it only in general terms.
    followups:
      - What did you change about the process from your position?
      - How did you split responsibilities with the manager?
    common_errors:
      - Describing only attending interviews without any contribution to the process.

  - external_key: managerial.hiring.lone_dissent_in_debrief
    competency_key: communication
    topic: Disagreeing with the rest of the panel
    difficulty: easy
    text: >-
      What do you do in a hiring debrief when your view of a candidate is different from everyone else's?
    expected_concepts:
      - stating their view with specific evidence
      - listening to the evidence behind other views
      - being open to changing their assessment for the right reasons
      - making sure the disagreement is recorded
    rubric:
      excellent: Explains how they present specific evidence for their view, engage with others' evidence and either update or hold their position for stated reasons, with a real example.
      good: Shares their view with reasons and listens to others.
      weak: Stays quiet to avoid conflict or insists without evidence.
    followups:
      - Has your dissent ever changed the outcome?
      - When have you changed your mind in a debrief?
    common_errors:
      - Going along with the majority without sharing their evidence.

  - external_key: managerial.hiring.probing_resume_projects
    competency_key: leadership
    topic: Separating personal contribution from team achievement
    difficulty: easy
    text: >-
      How do you dig into a project on a candidate's resume to find out what they personally did, as
      opposed to what their team did?
    expected_concepts:
      - asking them to describe their own decisions and actions
      - probing for technical detail and trade-offs
      - asking what they would do differently
      - noticing when answers stay at the team level
    rubric:
      excellent: Describes specific probing techniques for individual contribution, decisions and trade-offs, and explains how they interpret answers that stay vague.
      good: Asks follow-up questions about the candidate's personal role.
      weak: Accepts resume claims at face value.
    followups:
      - What's a good follow-up when a candidate keeps saying "we"?
      - How do you avoid penalising people who worked in highly collaborative teams?
    common_errors:
      - Treating "we" in an answer as a negative without probing further.

  - external_key: managerial.hiring.keeping_candidates_updated
    competency_key: communication
    topic: Keeping candidates informed during delays
    difficulty: easy
    text: >-
      How do you keep candidates informed while your team is still deciding, especially when the process is
      taking longer than you planned?
    expected_concepts:
      - proactive updates rather than silence
      - giving realistic new timelines
      - explaining the reason for delay at an appropriate level
      - coordinating messages with the recruiter
    rubric:
      excellent: Describes proactive, regular updates with realistic timelines coordinated with recruiting, and explains why this matters for candidates and the team's reputation.
      good: Keeps candidates updated when delays happen.
      weak: Lets candidates wait without updates until a decision is ready.
    followups:
      - How often would you update a candidate during a delay?
      - Have you ever lost a candidate because of a slow process?
    common_errors:
      - Waiting until there is good news before contacting the candidate.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.hiring.assessing_collaboration
    competency_key: communication
    topic: Assessing how candidates work with others
    difficulty: medium
    text: >-
      How do you find out in an interview how someone works with other people, without simply asking them
      to describe themselves?
    expected_concepts:
      - asking for specific past examples of collaboration and disagreement
      - pairing or interactive exercises
      - observing how they handle feedback during the interview
      - focusing on actions and outcomes rather than self-descriptions
    rubric:
      excellent: Describes specific behavioural questions and interactive formats that produce evidence of collaboration, with clear criteria for interpreting the evidence fairly.
      good: Uses examples-based questions about working with others.
      weak: Relies on self-descriptions or a general sense of whether they'd get along with the candidate.
    followups:
      - What evidence would make you concerned?
      - How do you keep this assessment tied to the job rather than to whether you'd enjoy working together?
    common_errors:
      - Confusing similarity to the interviewer with good collaboration.

  - external_key: managerial.hiring.assessing_learning_ability
    competency_key: leadership
    topic: Assessing how quickly someone learns new areas
    difficulty: medium
    text: >-
      How do you assess in an interview whether someone can get up to speed quickly in an area they haven't
      worked in before?
    expected_concepts:
      - asking about a time they learned something new under pressure
      - giving new information during the interview and seeing how they use it
      - looking at how they ask clarifying questions
      - evidence of applying learning to deliver results
    rubric:
      excellent: Combines past-example questions with in-interview exercises that introduce unfamiliar information, and explains what evidence distinguishes fast learners.
      good: Asks about past learning experiences with some probing.
      weak: Infers learning ability from credentials or the number of technologies listed.
    followups:
      - Can you describe an exercise you've used for this?
      - How did a hire you assessed this way perform?
    common_errors:
      - Equating a long list of technologies with ability to learn.

  - external_key: managerial.hiring.ai_assisted_assessments
    competency_key: leadership
    topic: Adapting assessments to AI-assisted work
    difficulty: medium
    text: >-
      Candidates now often use AI assistants on take-home exercises. How have you adapted, or how would you
      adapt, your technical assessment so it still tells you what you need to know?
    expected_concepts:
      - deciding whether AI use reflects how the job is actually done
      - clear rules communicated to candidates
      - follow-up discussion of the submission and design choices
      - live extension or modification of their own solution
      - assessing judgement and review skills rather than typing output
    rubric:
      excellent: Takes a clear position based on how the job is done, sets transparent rules and redesigns assessment to test reasoning and judgement through discussion and extension of the work.
      good: Adds follow-up discussion or live components to verify understanding.
      weak: Bans AI without enforcement or ignores the issue entirely.
    followups:
      - Would you allow AI tools in a live interview?
      - How would you assess someone's ability to review AI-generated code?
    common_errors:
      - Setting rules that some candidates follow and others ignore, which rewards rule-breaking.

  - external_key: managerial.hiring.staffing_missing_skills
    competency_key: project_management
    topic: Staffing a project that needs new skills
    difficulty: medium
    text: >-
      You're staffing a new project that needs skills nobody on your team has today. How do you decide
      between hiring, borrowing people from other teams and developing your own people?
    expected_concepts:
      - project timeline versus time to hire and ramp up
      - whether the skill is needed long term
      - growth opportunities for current team members
      - availability and cost of borrowing from other teams
      - combining options
    rubric:
      excellent: Weighs timing, long-term need, development opportunities and cost, often proposing a combination, and gives an example of a decision and its outcome.
      good: Compares the options with reasonable criteria.
      weak: Defaults to hiring for every new skill.
    followups:
      - How would you choose who on the team to develop?
      - What if the borrowed people were pulled back mid-project?
    common_errors:
      - Ignoring how long a new hire takes to become effective.

  - external_key: managerial.hiring.conflicting_stage_signals
    competency_key: leadership
    topic: Making sense of conflicting interview signals
    difficulty: medium
    text: >-
      One interviewer says a candidate was outstanding in the design discussion, and another says they
      struggled with basic coding. How would you make sense of that and reach a decision?
    expected_concepts:
      - reviewing the written evidence from both stages
      - considering whether either stage went wrong
      - weighing which skills matter most for the role
      - deciding whether more evidence is needed
    rubric:
      excellent: Examines the evidence behind both signals, considers interviewer or exercise issues, weighs the skills against the role's needs and explains a reasoned decision path.
      good: Looks at both pieces of feedback and weighs them against the role.
      weak: Averages the scores or goes with the more senior interviewer.
    followups:
      - When is it fair to add another interview?
      - What would make you discount one of the signals?
    common_errors:
      - Ignoring the possibility that an exercise or interviewer caused the weak signal.

  - external_key: managerial.hiring.partners_on_panel
    competency_key: stakeholder_management
    topic: Involving cross-functional partners in hiring
    difficulty: medium
    text: >-
      How do you involve product managers, designers or other partners in hiring for your team, and what
      do you ask them to evaluate?
    expected_concepts:
      - a defined stage with a specific focus
      - training partners on the rubric and process
      - weighting their input in the decision
      - avoiding overlap with engineering stages
    rubric:
      excellent: Gives partners a defined, rubric-based stage focused on cross-functional work, prepares them properly and explains how their input feeds into the decision.
      good: Involves partners with a clear purpose.
      weak: Adds partners as informal chats without criteria, or excludes them entirely.
    followups:
      - How do you handle a partner's strong objection to a candidate?
      - What did a partner catch that engineers missed?
    common_errors:
      - Letting a partner's informal chat override structured evidence.

  - external_key: managerial.hiring.negotiating_role_shape
    competency_key: stakeholder_management
    topic: Negotiating the level or shape of a role
    difficulty: medium
    text: >-
      Tell me about a time you negotiated the level or type of a role with your manager or with finance,
      for example asking for one senior hire instead of two junior ones.
    expected_concepts:
      - the reasoning behind the requested shape
      - cost and impact comparisons
      - understanding the other side's constraints
      - the outcome and any compromise
    rubric:
      excellent: Gives a specific example with clear reasoning, quantified trade-offs, awareness of the stakeholder's constraints and a concrete outcome.
      good: Describes a reasonable negotiation with some evidence.
      weak: Simply accepted whatever was approved or argued from preference only.
    followups:
      - What would you have done if they had said no?
      - How did the hire work out?
    common_errors:
      - Arguing for seniority without showing what it would deliver.

  - external_key: managerial.hiring.leveling_disagreement
    competency_key: people_management
    topic: Resolving disagreement about level
    difficulty: medium
    text: >-
      A candidate did well, but the panel disagrees about what level to offer them. How do you resolve it,
      and why does getting the level right matter?
    expected_concepts:
      - comparing evidence against written level expectations
      - effect of under-leveling on retention and fairness
      - effect of over-leveling on performance expectations
      - consistency with existing team members
      - a clear decision owner
    rubric:
      excellent: Resolves the disagreement with evidence against level definitions, explains the consequences of getting it wrong in both directions and considers fairness relative to the current team.
      good: Uses level criteria and evidence to decide.
      weak: Picks the lower level by default to be safe.
    followups:
      - How would you explain the level to the candidate?
      - What happens if they push back on the level?
    common_errors:
      - Leveling down by default, which can be unfair to the candidate and cause attrition later.

  - external_key: managerial.hiring.shortening_the_process
    competency_key: project_management
    topic: Speeding up a slow hiring process
    difficulty: medium
    text: >-
      Your hiring process takes six weeks from first call to offer, and you're losing good candidates
      along the way. How would you shorten it without cutting corners on the assessment?
    expected_concepts:
      - measuring time spent in each stage
      - removing wait time between stages rather than assessment
      - batching interviews or scheduling them together
      - faster decision and feedback turnaround
      - merging overlapping stages
    rubric:
      excellent: Diagnoses where time is spent, targets waiting time and overlap first, proposes specific scheduling and decision changes and keeps assessment quality intact.
      good: Proposes reasonable ways to speed up scheduling and decisions.
      weak: Simply removes interview stages without considering the signal lost.
    followups:
      - Which stage do you think usually causes the most delay?
      - How would you measure the impact on hire quality?
    common_errors:
      - Cutting assessment stages when the delay is actually in scheduling.

  - external_key: managerial.hiring.coaching_weak_interviewer
    competency_key: mentoring
    topic: Coaching an interviewer whose write-ups are thin
    difficulty: medium
    text: >-
      How would you give feedback to an interviewer on your panel whose write-ups are too thin to be useful
      in a hiring decision?
    expected_concepts:
      - specific examples of what was missing
      - a model of what good feedback looks like
      - understanding the reason, such as lack of time or unclear expectations
      - follow-up on later write-ups
    rubric:
      excellent: Gives specific, private feedback with examples and a model, addresses the underlying cause and follows up to confirm improvement.
      good: Talks to the interviewer and explains what's expected.
      weak: Ignores it or silently discounts their feedback.
    followups:
      - What would you do if the write-ups stayed thin?
      - How could the process make good write-ups easier?
    common_errors:
      - Silently discounting the interviewer's input instead of addressing it.

  - external_key: managerial.hiring.video_interviews
    competency_key: communication
    topic: Running interviews well over video
    difficulty: medium
    text: >-
      What do you do differently when interviews are held over video, so candidates can still show what
      they're capable of?
    expected_concepts:
      - testing tools and sharing setup instructions in advance
      - using collaborative editors suited to the exercise
      - planning for connection problems
      - explicit structure and clear verbal cues
      - consistent setup across candidates
    rubric:
      excellent: Describes specific preparation, tooling and fallback plans, and explains how they keep the experience consistent and fair across candidates.
      good: Mentions preparing tools and handling technical issues.
      weak: Runs video interviews with no adjustments and penalises candidates for technical problems.
    followups:
      - What do you do if the call keeps dropping?
      - How do you handle a candidate unfamiliar with the editor you use?
    common_errors:
      - Counting technical problems against the candidate.

  - external_key: managerial.hiring.interview_insights_to_onboarding
    competency_key: mentoring
    topic: Carrying interview insights into onboarding
    difficulty: medium
    text: >-
      What do you carry over from the interview process into a new hire's onboarding, and how do you use
      it?
    expected_concepts:
      - strengths observed that can be used early
      - development areas identified during interviews
      - tailoring the first tasks and mentoring
      - sharing relevant evidence appropriately with the buddy or lead
    rubric:
      excellent: Explains how they use specific interview evidence to tailor first tasks and development plans, while sharing it appropriately and checking assumptions with the new hire.
      good: Uses interview observations to shape some early work.
      weak: Treats hiring and onboarding as unrelated.
    followups:
      - How do you avoid labelling someone based on one interview?
      - Who sees the interview notes after someone joins?
    common_errors:
      - Sharing raw interview notes widely with the team.

  - external_key: managerial.hiring.assessing_ownership
    competency_key: leadership
    topic: Assessing whether a candidate takes ownership
    difficulty: medium
    text: >-
      What questions or exercises have you used to see whether a candidate takes ownership of outcomes, and
      what in their answers convinced you either way?
    expected_concepts:
      - asking for situations where something went wrong
      - probing for what they personally did and followed through on
      - looking for impact beyond the assigned task
      - checking whether they own mistakes and their fixes
    rubric:
      excellent: Describes targeted questions with specific probes, explains what concrete evidence indicated ownership and gives an example of how it informed a decision.
      good: Uses behavioural questions about past responsibilities.
      weak: Asks hypothetical questions only or relies on a general impression.
    followups:
      - Did a hire assessed this way meet your expectations?
      - What answer would raise a concern?
    common_errors:
      - Accepting statements of intent as evidence of ownership.

  # ------------------------------------------------------------------ hard
  - external_key: managerial.hiring.process_from_scratch
    competency_key: leadership
    topic: Building a hiring process from nothing
    difficulty: hard
    text: >-
      You're the first engineering manager at a startup that has no hiring process at all. How would you
      set one up in your first couple of months while still needing to hire?
    expected_concepts:
      - defining roles and essential skills first
      - a lightweight but structured loop with rubrics
      - training the few available interviewers
      - candidate communication and tracking
      - iterating on the process as hires are made
    rubric:
      excellent: Proposes a phased plan that gets a minimal structured process running quickly, trains interviewers, keeps candidates informed and improves the process with evidence over time.
      good: Sets up a reasonable process with some structure and iteration.
      weak: Either hires informally with no structure or spends months designing before hiring anyone.
    followups:
      - What would you set up in the first week?
      - How would you involve the founders?
    common_errors:
      - Copying a large company's heavy process before it fits the startup.

  - external_key: managerial.hiring.exceptional_no_opening
    competency_key: stakeholder_management
    topic: An exceptional candidate with no matching opening
    difficulty: hard
    text: >-
      An exceptional candidate comes through, but you don't have an open role that fits them. How would you
      approach the situation?
    expected_concepts:
      - checking roles in other teams
      - making a case for an opportunistic hire with business reasoning
      - being clear with the candidate about the situation
      - keeping the relationship for future openings
      - fairness to other candidates and existing plans
    rubric:
      excellent: Explores legitimate options across the organisation, builds a business case if justified, communicates openly with the candidate and considers fairness and existing plans.
      good: Looks for options and keeps the candidate informed.
      weak: Creates a role informally without justification or simply lets the candidate go.
    followups:
      - What would justify creating a new role?
      - How would you keep in touch if nothing fits now?
    common_errors:
      - Creating a vague role that later leaves the hire without clear work.

  - external_key: managerial.hiring.strong_skills_weak_collaboration
    competency_key: leadership
    topic: Weighing technical strength against collaboration concerns
    difficulty: hard
    text: >-
      A candidate is technically one of the strongest you've seen, but in the interview they handled
      disagreement poorly. How do you weigh that, and how do you make sure your concern is about job
      behaviour rather than style?
    expected_concepts:
      - identifying the specific observed behaviour
      - checking whether the concern relates to the job's requirements
      - gathering more evidence such as references or another conversation
      - weighing impact on the team against technical value
      - documenting a decision based on evidence
    rubric:
      excellent: Separates concrete job-related behaviour from differences in style, seeks further evidence where appropriate, weighs team impact and documents a reasoned decision.
      good: Considers both the technical strength and the concern with some evidence.
      weak: Hires based on technical skill alone or rejects based on a vague impression.
    followups:
      - What exactly would you need to see to be reassured?
      - How would you set expectations if you did hire them?
    common_errors:
      - Rejecting someone for a communication style that differs from the team's norm.

  - external_key: managerial.hiring.competing_offer_deadline
    competency_key: stakeholder_management
    topic: A competing offer with a tight deadline
    difficulty: hard
    text: >-
      A strong candidate tells you they have a competing offer that expires before your process would
      finish. How would you handle it without lowering your standards?
    expected_concepts:
      - speeding up remaining stages rather than skipping them
      - coordinating with interviewers and recruiting quickly
      - being clear with the candidate on what's possible
      - deciding when to let the candidate go
      - avoiding unfair advantage over other candidates
    rubric:
      excellent: Compresses the timeline while keeping the same assessment, communicates clearly with the candidate and accepts losing them if the process can't be completed properly.
      good: Tries to accelerate the process while keeping key stages.
      weak: Skips stages or makes an offer without the usual evidence.
    followups:
      - Which stages would you refuse to skip?
      - How would you handle other candidates in the same process?
    common_errors:
      - Waiving stages for one candidate that others had to complete.

  - external_key: managerial.hiring.hiring_amid_reorg
    competency_key: communication
    topic: Hiring when the team's future scope is uncertain
    difficulty: hard
    text: >-
      You're hiring for a team whose scope may change in an upcoming reorganisation. How do you handle what
      you tell candidates and how you plan the roles?
    expected_concepts:
      - sharing appropriate uncertainty with candidates
      - defining roles around durable skills rather than narrow scope
      - aligning with leadership on what's confirmed
      - whether to pause or proceed with hiring
      - keeping commitments to new hires realistic
    rubric:
      excellent: Balances confidentiality with fair disclosure to candidates, designs roles that survive likely changes, aligns with leadership and makes a reasoned proceed-or-pause decision.
      good: Is open with candidates about some uncertainty and adjusts role definitions.
      weak: Promises a stable scope it can't guarantee or stops communicating with candidates.
    followups:
      - How much would you tell a candidate who asks directly?
      - What would you do if the reorganisation changed the role after they accepted?
    common_errors:
      - Overpromising scope that the reorganisation may remove.

  - external_key: managerial.hiring.unfair_process_complaint
    competency_key: leadership
    topic: Responding to a candidate's complaint of unfairness
    difficulty: hard
    text: >-
      A rejected candidate complains that your interview was unfair. How would you investigate the
      complaint and respond to them?
    expected_concepts:
      - taking the complaint seriously and acknowledging it promptly
      - reviewing the evidence, questions and scoring involved
      - involving HR or recruiting according to policy
      - responding with what was found and any action taken
      - improving the process if gaps are found
    rubric:
      excellent: Describes a prompt, policy-aligned review of the evidence with the right partners, a clear response to the candidate and process improvements where the review finds gaps.
      good: Investigates the complaint and responds appropriately.
      weak: Dismisses the complaint or responds defensively without reviewing the evidence.
    followups:
      - What would you do if the review found the interviewer did ask something inappropriate?
      - How would you share lessons with the panel?
    common_errors:
      - Treating the complaint as a reputational problem rather than a possible process issue.
