# Curated questions: managerial round, hiring and interviewing (part 2: sourcing, fair selection,
# decisions, offers and building balanced teams). Evaluation is based only on the substance of the
# answer (approach, actions, results, reflection), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: managerial.hiring.sourcing_channels
    competency_key: project_management
    topic: Where strong candidates come from
    difficulty: easy
    text: >-
      Where have you found strong candidates for your teams in the past, and how do you decide where to put
      your sourcing effort for a new role?
    expected_concepts:
      - several channels such as referrals, outreach, communities and job boards
      - tracking which channels produced successful hires
      - matching the channel to the role and seniority
      - avoiding over-reliance on a single source
    rubric:
      excellent: Names specific channels with evidence of what worked, explains how they choose channels for a role and why they avoid depending on one source.
      good: Lists a few channels with a sensible preference for some roles.
      weak: Leaves sourcing entirely to recruiters or posts a job and waits.
    followups:
      - Which channel surprised you by working better than expected?
      - How do you track where your hires came from?
    common_errors:
      - Relying only on the personal networks of the current team.

  - external_key: managerial.hiring.reference_checks
    competency_key: communication
    topic: Getting value from reference checks
    difficulty: easy
    text: >-
      How do you use reference checks, and what kind of questions do you ask a reference to learn something
      genuinely useful about how the person works?
    expected_concepts:
      - open questions about specific situations and work behaviours
      - asking how the person compared with peers at similar scope
      - probing areas the interviews flagged as uncertain
      - keeping questions job-related and consistent across candidates
    rubric:
      excellent: Explains a clear purpose for references, gives examples of specific, job-related open questions and describes how answers have influenced a decision or onboarding plan.
      good: Asks some open questions about work quality and collaboration.
      weak: Treats references as a formality and asks only whether the person was good to work with.
    followups:
      - Has a reference ever changed your decision?
      - How do you handle a reference who only gives vague praise?
    common_errors:
      - Asking leading questions that invite a simple yes.

  - external_key: managerial.hiring.resume_screening
    competency_key: leadership
    topic: Reviewing resumes on job-related evidence
    difficulty: easy
    text: >-
      When you review a resume for a role on your team, what do you look for, and what do you deliberately
      try not to let influence you?
    expected_concepts:
      - evidence of the essential skills defined for the role
      - concrete outcomes and scope of past work
      - ignoring signals unrelated to the job such as school or company prestige
      - consistent criteria applied to every resume
    rubric:
      excellent: Describes screening against written essential criteria, looks for evidence of outcomes and scope, and names specific job-unrelated signals they consciously set aside.
      good: Looks for relevant skills and achievements with some awareness of unhelpful signals.
      weak: Screens on famous company names, schools or formatting polish.
    followups:
      - How do you treat a resume that's short on detail but shows relevant work?
      - What would make you pass someone to interview despite a missing requirement?
    common_errors:
      - Treating resume polish as evidence of ability.

  - external_key: managerial.hiring.realistic_preview
    competency_key: communication
    topic: Giving candidates a realistic view of the job
    difficulty: easy
    text: >-
      When you really want a candidate to accept your offer, how do you make sure they understand what the
      job will actually be like, including the less exciting parts?
    expected_concepts:
      - describing current challenges and known problems
      - letting the candidate talk to future teammates
      - being clear about on-call, legacy work or ambiguity
      - answering questions directly rather than overselling
    rubric:
      excellent: Describes giving a balanced, specific picture including drawbacks, arranging conversations with the team and explains how this leads to better retention.
      good: Mentions being open about challenges as well as strengths.
      weak: Focuses only on selling the role and avoids mentioning difficulties.
    followups:
      - Has being open about a drawback ever cost you a candidate?
      - What part of your current team's work would you warn a candidate about?
    common_errors:
      - Overselling the role and causing early attrition.

  - external_key: managerial.hiring.involving_the_team
    competency_key: collaboration
    topic: Involving the team in a hiring push
    difficulty: easy
    text: >-
      How do you keep your existing team informed and involved while you're hiring for new positions on
      that team?
    expected_concepts:
      - explaining why the roles are being added
      - involving team members as interviewers or in role definition
      - sharing progress and expected start dates
      - preparing the team to welcome and support new joiners
    rubric:
      excellent: Describes involving the team early in defining needs and interviewing, keeping them updated and preparing them for the arrival of new people, with an example.
      good: Shares hiring plans and asks some team members to interview.
      weak: Keeps hiring separate from the team and announces new people on their first day.
    followups:
      - How did you handle team members who worried about how new hires would change their work?
      - Who on your team interviews, and how did you choose them?
    common_errors:
      - Treating hiring as a manager-only activity.

  - external_key: managerial.hiring.first_hiring_lessons
    competency_key: leadership
    topic: Lessons from your earliest hiring
    difficulty: easy
    text: >-
      Think back to one of the first hires you made or helped make. What did that experience teach you
      about hiring that you still apply today?
    expected_concepts:
      - a specific hiring situation
      - what went well or badly
      - a concrete lesson about the process or criteria
      - how that lesson shows up in current practice
    rubric:
      excellent: Describes a specific early hire, draws a concrete lesson about process or evaluation and shows how it changed their current approach.
      good: Gives an example with a reasonable lesson.
      weak: Offers a vague lesson that isn't tied to any real hiring experience.
    followups:
      - What would you do differently if you made that hire today?
      - Did that person succeed in the role?
    common_errors:
      - Drawing lessons about the individual rather than the process.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.hiring.referral_concentration
    competency_key: leadership
    topic: When most hires come from referrals
    difficulty: medium
    text: >-
      Most of your team's recent hires came through employee referrals. What would you look at to decide
      whether that's a strength or a problem, and what might you change?
    expected_concepts:
      - referrals tend to reproduce the existing network
      - comparing performance and retention by source
      - checking whether strong applicants from other channels were screened out
      - applying the same process and bar to referred candidates
      - adding other sourcing channels
    rubric:
      excellent: Weighs the benefits of referrals against the risk of a narrow candidate pool, proposes evidence to examine and specific changes that keep the process equal for all sources.
      good: Recognises the risk of a narrow pipeline and suggests diversifying channels.
      weak: Sees referrals as purely positive or bans them without analysis.
    followups:
      - Would you give referred candidates any shortcut in the process?
      - How would you explain a change to the team?
    common_errors:
      - Fast-tracking referred candidates past stages others must complete.

  - external_key: managerial.hiring.narrow_pipeline
    competency_key: leadership
    topic: Reaching strong candidates you're missing
    difficulty: medium
    text: >-
      Your candidate pipeline for a role keeps looking very similar, with people from the same few
      companies and schools. What would you change to reach strong candidates you're currently missing?
    expected_concepts:
      - reviewing the job posting and requirements for unnecessary filters
      - new sourcing channels and communities
      - skills-based screening instead of credential screening
      - checking where in the funnel candidates drop out
      - measuring the effect of changes
    rubric:
      excellent: Diagnoses the funnel from posting to screen, removes job-unrelated filters, adds new channels and skills-based screening, and explains how they would measure the result.
      good: Suggests widening sourcing and loosening some requirements.
      weak: Accepts the pipeline as it is or assumes there is no one else available.
    followups:
      - Which requirement would you look at first?
      - How would you keep the bar the same while widening the pool?
    common_errors:
      - Lowering the standard instead of removing filters that don't predict success.

  - external_key: managerial.hiring.essential_requirements
    competency_key: stakeholder_management
    topic: Resisting requirements that don't predict success
    difficulty: medium
    text: >-
      How do you decide which requirements for a role are truly essential, and how have you handled
      pressure to add requirements, such as a specific degree or tool, that don't predict success in the job?
    expected_concepts:
      - tying each requirement to tasks the person will actually do
      - skills that can be learned quickly versus those that cannot
      - discussing evidence with the stakeholder pushing for the requirement
      - effect of unnecessary requirements on who applies
    rubric:
      excellent: Explains a method for testing each requirement against real work, gives an example of pushing back with evidence and describes the effect on the candidate pool.
      good: Distinguishes essential from nice-to-have requirements with reasoning.
      weak: Accepts every requested requirement or lists them without considering their effect.
    followups:
      - Which requirement have you removed, and what happened?
      - How did you handle the stakeholder who wanted it kept?
    common_errors:
      - Using a degree as a stand-in for skills that can be assessed directly.

  - external_key: managerial.hiring.non_traditional_paths
    competency_key: leadership
    topic: Assessing candidates with non-traditional paths
    difficulty: medium
    text: >-
      How have you assessed a candidate whose experience came from a different field or a non-traditional
      route into tech, such as a bootcamp or a career change?
    expected_concepts:
      - assessing the same essential skills as for everyone else
      - looking for transferable skills and evidence of learning
      - work-sample exercises over credential checks
      - planning the support they would need after joining
    rubric:
      excellent: Describes a specific case where they assessed job-related skills fairly, recognised transferable experience and planned support, with the outcome of the hire or decision.
      good: Explains focusing on skills rather than the route the person took.
      weak: Screens such candidates out by default or applies a different, harder bar.
    followups:
      - What transferable skill turned out to matter most?
      - How did onboarding differ for that person?
    common_errors:
      - Lowering expectations instead of assessing the same skills fairly.

  - external_key: managerial.hiring.seniority_mix
    competency_key: leadership
    topic: Balancing seniority on a team
    difficulty: medium
    text: >-
      If your team were made up almost entirely of senior engineers, or almost entirely of early-career
      ones, what problems would you expect, and how would that shape your next few hires?
    expected_concepts:
      - all-senior teams lacking growth paths and having costly routine work
      - all-junior teams lacking review depth and technical direction
      - mentoring capacity as a constraint
      - planning a mix that matches the roadmap
    rubric:
      excellent: Identifies concrete risks of each extreme, links the right mix to mentoring capacity and upcoming work, and describes a resulting hiring plan.
      good: Recognises that a mix is useful and gives a few reasons.
      weak: Always prefers senior hires, or always prefers cheaper junior hires, without considering the team's needs.
    followups:
      - What's the ratio on your current team, and is it working?
      - How many early-career hires can one senior engineer realistically support?
    common_errors:
      - Hiring early-career engineers without anyone having time to mentor them.

  - external_key: managerial.hiring.contractor_or_permanent
    competency_key: project_management
    topic: Contractors versus permanent hires
    difficulty: medium
    text: >-
      How do you decide whether a need on your team should be filled by a contractor or by a permanent
      hire, and what has gone well or badly with the choices you've made?
    expected_concepts:
      - whether the need is temporary or ongoing
      - knowledge retention and ownership after the work ends
      - speed to start and cost trade-offs
      - integrating contractors into team practices
    rubric:
      excellent: Weighs duration, ownership, knowledge transfer and cost, and gives a real example with what they learned about making the arrangement work.
      good: Explains sensible criteria for choosing between the two.
      weak: Chooses based only on what's quickest to approve, ignoring long-term ownership.
    followups:
      - How did you handle knowledge transfer when a contractor left?
      - What would make you convert a contractor role into a permanent one?
    common_errors:
      - Giving contractors core ownership with no plan for when they leave.

  - external_key: managerial.hiring.internal_or_external
    competency_key: people_management
    topic: Promoting internally versus hiring externally
    difficulty: medium
    text: >-
      When a lead position opens on your team, how do you decide between promoting someone internally and
      hiring from outside?
    expected_concepts:
      - readiness of internal candidates against the role's expectations
      - a fair, open process for internal applicants
      - what the team gains or loses with each option
      - development plans for internal candidates who aren't selected
    rubric:
      excellent: Describes a transparent process that assesses internal and external candidates against the same criteria, weighs team impact and supports internal candidates who aren't chosen.
      good: Considers internal readiness and external options with reasons.
      weak: Defaults to one option, or quietly appoints a favourite without a process.
    followups:
      - How did you give feedback to an internal candidate who wasn't chosen?
      - Did you ever hire externally when the team expected a promotion?
    common_errors:
      - Assessing internal candidates against a different standard from external ones.

  - external_key: managerial.hiring.declined_offer
    competency_key: communication
    topic: Learning from a declined offer
    difficulty: medium
    text: >-
      Tell me about a candidate you really wanted who turned down your offer. What did you learn from it,
      and did you change anything afterwards?
    expected_concepts:
      - understanding the real reasons for the decline
      - reviewing their experience of the process
      - specific changes to process speed, communication or the role
      - keeping a good relationship with the candidate
    rubric:
      excellent: Gives a specific example, explains how they found out why the offer was declined, and describes concrete changes they made and whether those helped.
      good: Reflects on likely reasons and makes some adjustment.
      weak: Attributes it entirely to factors outside their control and changes nothing.
    followups:
      - How did you find out the real reason?
      - Did you stay in touch with that candidate?
    common_errors:
      - Assuming the decline was only about money without checking.

  - external_key: managerial.hiring.hiring_metrics
    competency_key: project_management
    topic: Using hiring metrics to make decisions
    difficulty: medium
    text: >-
      What hiring metrics have you tracked for your team, and tell me about a decision you made because of
      what they showed.
    expected_concepts:
      - funnel conversion by stage
      - time to hire and time in each stage
      - offer acceptance rate
      - quality-of-hire signals after joining
      - acting on a specific trend
    rubric:
      excellent: Names relevant metrics, explains what they indicated and describes a specific change made in response, with its effect.
      good: Tracks some metrics and can explain what they mean.
      weak: Tracks only the number of hires, or no metrics at all.
    followups:
      - Which metric did you find misleading?
      - How did you measure the quality of a hire?
    common_errors:
      - Optimising speed of hiring while ignoring quality after joining.

  - external_key: managerial.hiring.close_call
    competency_key: leadership
    topic: Making a close hiring decision
    difficulty: medium
    text: >-
      Tell me about a hiring decision that was a genuine close call. How did you make the decision, and how
      did it turn out?
    expected_concepts:
      - mixed evidence across stages
      - weighing essential versus less critical competencies
      - gathering more evidence where needed
      - a clear decision and rationale
      - reflection on the outcome
    rubric:
      excellent: Describes the specific mixed evidence, how they weighed it against essential criteria, any extra steps to reduce uncertainty, and reflects on the outcome.
      good: Explains the trade-off and the decision with reasonable logic.
      weak: Decided on a hunch or deferred entirely to someone else without reasoning.
    followups:
      - Would you make the same call again?
      - Did you add an extra interview, and was that fair to the candidate?
    common_errors:
      - Adding extra rounds only for some candidates without a clear reason.

  - external_key: managerial.hiring.polish_versus_substance
    competency_key: leadership
    topic: Separating presentation polish from demonstrated skill
    difficulty: medium
    text: >-
      How do you make sure that how polished or practised a candidate sounds doesn't outweigh what they
      actually showed they can do in the interview?
    expected_concepts:
      - scoring against the evidence required by the rubric
      - probing for specifics behind fluent answers
      - giving quieter or less practised candidates structured prompts
      - reviewing written evidence before making a decision
    rubric:
      excellent: Explains specific techniques for anchoring evaluation on demonstrated skill, such as probing for specifics and scoring against evidence, with an example of where it changed an outcome.
      good: Recognises the issue and focuses on concrete evidence in answers.
      weak: Treats a fluent, polished delivery as a strong signal in itself.
    followups:
      - Have you ever changed your view of a candidate after rereading your notes?
      - How do you probe an answer that sounds impressive but stays general?
    common_errors:
      - Rewarding interview practice rather than ability to do the job.

  - external_key: managerial.hiring.sharing_interview_load
    competency_key: project_management
    topic: Sharing interview load during heavy hiring
    difficulty: medium
    text: >-
      During a heavy hiring period, how do you share the interviewing work so it doesn't wear out your best
      interviewers or hurt the team's delivery?
    expected_concepts:
      - tracking interviews per person per week
      - training more interviewers to widen the pool
      - setting limits and protecting focus time
      - recognising interviewing as real work in planning and reviews
    rubric:
      excellent: Describes a concrete approach to tracking and capping load, growing the interviewer pool and accounting for interview time in planning, with an example.
      good: Mentions rotating interviewers and limiting load.
      weak: Keeps using the same few people until they burn out.
    followups:
      - What weekly limit did you set, and why?
      - How did interviewing show up in people's performance reviews?
    common_errors:
      - Ignoring interview time when committing to delivery dates.

  - external_key: managerial.hiring.rejection_feedback
    competency_key: communication
    topic: Giving feedback to candidates who weren't selected
    difficulty: medium
    text: >-
      What's your approach to giving feedback to candidates you don't hire, and how have you handled a
      candidate who asked you directly why they weren't selected?
    expected_concepts:
      - following company policy on what can be shared
      - specific, job-related and constructive feedback
      - consistency in what different candidates are told
      - respectful tone and timeliness
    rubric:
      excellent: Describes a consistent, policy-aware approach to sharing specific job-related feedback, gives an example of a direct request and how they handled it constructively.
      good: Provides some feedback when asked and keeps it respectful.
      weak: Never gives feedback or gives vague reasons that don't help the candidate.
    followups:
      - What kind of feedback do you avoid giving, and why?
      - Has a candidate ever reapplied after your feedback?
    common_errors:
      - Giving feedback based on impressions rather than the evidence in the scorecard.

  # ------------------------------------------------------------------ hard
  - external_key: managerial.hiring.leader_pushes_candidate
    competency_key: stakeholder_management
    topic: Pressure from a senior leader to hire someone
    difficulty: hard
    text: >-
      A senior leader strongly pushes you to hire someone they know personally, and your interviewers
      weren't convinced. How would you handle it?
    expected_concepts:
      - reviewing the evidence from the process
      - explaining the decision and evidence to the leader
      - holding the same standard as for every candidate
      - offering options such as a different role if genuinely suitable
      - escalation or documentation if pressure continues
    rubric:
      excellent: Holds a consistent standard, explains the evidence respectfully to the leader, explores legitimate alternatives and knows how they would escalate, while protecting the panel's independence.
      good: Explains the decision to the leader and keeps the standard.
      weak: Gives in to the pressure or refuses with no explanation.
    followups:
      - What if the leader is your own manager?
      - How would you protect the interviewers involved?
    common_errors:
      - Quietly re-running the process until it produces the wanted answer.

  - external_key: managerial.hiring.rebuild_after_departures
    competency_key: leadership
    topic: Rebuilding capability after several departures
    difficulty: hard
    text: >-
      Several experienced people left your team within a short period. How would you plan hiring to rebuild
      the team's capability without just replacing each person like for like?
    expected_concepts:
      - assessing what knowledge and skills were lost
      - re-evaluating team needs against the roadmap
      - short-term risk mitigation and knowledge capture
      - mix of hires and internal growth opportunities
      - understanding why people left before hiring
    rubric:
      excellent: Starts by understanding why people left and what capability was lost, mitigates immediate risk, then plans a hiring and growth mix based on future needs rather than past roles.
      good: Identifies gaps and plans hiring with some prioritisation.
      weak: Immediately opens the same roles without understanding the departures or future needs.
    followups:
      - How would you keep the remaining team from being overloaded?
      - What would you tell stakeholders about delivery in the meantime?
    common_errors:
      - Ignoring the reasons people left, which may drive away new hires too.

  - external_key: managerial.hiring.auditing_for_unfair_screening
    competency_key: leadership
    topic: Checking whether the process screens out capable people
    difficulty: hard
    text: >-
      If you suspected your hiring process was screening out capable people for reasons unrelated to the
      job, how would you go about finding out and fixing it?
    expected_concepts:
      - analysing pass rates at each stage
      - reviewing questions and exercises for job relevance
      - looking for stages with high interviewer variance
      - gathering candidate feedback about the process
      - changing one thing at a time and measuring the result
    rubric:
      excellent: Proposes a data-driven review of each stage, checks job relevance of every assessment, identifies inconsistent evaluation and describes measured, incremental fixes.
      good: Suggests reviewing the process and data to find problem stages.
      weak: Relies on anecdotes or makes broad changes without evidence.
    followups:
      - Which stage would you look at first, and why?
      - How would you involve your interviewers in the review?
    common_errors:
      - Assuming a process is fair because it is applied the same way to everyone.

  - external_key: managerial.hiring.mis_hire_lessons
    competency_key: people_management
    topic: Learning from a hire that didn't work out
    difficulty: hard
    text: >-
      Tell me about a hire that didn't work out. Looking back at the interview process, what signals did you
      miss, and what did you change because of it?
    expected_concepts:
      - a specific example and how the issues showed up
      - how the situation was handled with the person
      - which signals were missed or misread in the interviews
      - concrete process changes made afterwards
    rubric:
      excellent: Gives a specific example, handles the person's situation fairly, traces the issue back to specific gaps in the interview process and describes changes that addressed them.
      good: Reflects on what went wrong and makes some change.
      weak: Blames the person entirely and draws no lesson about the process.
    followups:
      - How did you support the person once the problem became clear?
      - Has the change you made caught a similar problem since?
    common_errors:
      - Focusing on the person's faults instead of the hiring process.

  - external_key: managerial.hiring.freeze_mid_search
    competency_key: stakeholder_management
    topic: Handling a hiring freeze mid-search
    difficulty: hard
    text: >-
      A hiring freeze is announced while you're halfway through filling two critical roles. How would you
      handle the candidates in your process, your team and your delivery commitments?
    expected_concepts:
      - prompt, respectful communication with candidates in process
      - clarifying exceptions and the process to request them
      - rescoping or re-sequencing delivery commitments
      - updating stakeholders on impact and risks
      - keeping relationships with strong candidates for later
    rubric:
      excellent: Covers all three groups with specific actions, communicates promptly and respectfully, renegotiates commitments with evidence and keeps strong candidates engaged appropriately.
      good: Informs candidates and adjusts plans with stakeholders.
      weak: Leaves candidates waiting with no update or keeps all commitments unchanged.
    followups:
      - Would you ask for an exception, and how would you justify it?
      - What would you tell the team?
    common_errors:
      - Delaying candidate communication in the hope the freeze is lifted.

  - external_key: managerial.hiring.doubling_the_team
    competency_key: project_management
    topic: Planning to double a team in a year
    difficulty: hard
    text: >-
      You're asked to double the size of your team within a year. How would you plan it so the team keeps
      delivering and the new people actually become effective?
    expected_concepts:
      - a phased hiring plan with realistic timelines
      - interviewer and mentor capacity as constraints
      - when to split into sub-teams and develop new leads
      - onboarding capacity and ramp-up time in delivery plans
      - risks to quality, shared engineering practices and communication
    rubric:
      excellent: Presents a phased plan that accounts for interviewing, onboarding and mentoring capacity, team structure changes and risks to delivery, with clear milestones.
      good: Plans hiring in phases and considers onboarding load.
      weak: Plans only the hiring numbers without considering how the team absorbs new people.
    followups:
      - At what size would you split the team, and how?
      - How would you know if the growth was going too fast?
    common_errors:
      - Assuming delivery scales immediately with headcount.
