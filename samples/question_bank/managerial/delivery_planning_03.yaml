# Managerial round: delivery planning (part 3 of 4) - tracking progress, early warning,
# communicating slips, fixed dates, launches and go/no-go decisions, multi-team programs.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ---------------------------------------------------------------- easy
  - external_key: managerial.delivery_planning.weekly_on_track_check
    competency_key: project_management
    topic: Knowing whether a project is on track
    difficulty: easy
    text: >-
      How do you know, from week to week, whether a project you're responsible for is actually on track?
    expected_concepts:
      - comparing progress against milestones rather than effort spent
      - working software or demos as evidence
      - trend of remaining work
      - conversations with the people doing the work
    rubric:
      excellent: Uses evidence of completed, demonstrable outcomes against milestones, watches the trend of remaining work, and combines data with direct conversations with the team.
      good: Tracks progress against a plan with some objective evidence.
      weak: Relies on people saying things are fine or on hours spent.
    followups:
      - What would make you doubt a green status?
    common_errors:
      - Measuring activity instead of finished, working outcomes.

  - external_key: managerial.delivery_planning.status_update_example
    competency_key: communication
    topic: Writing a useful status update
    difficulty: easy
    text: >-
      What does a good status update from you look like? Describe one you sent recently and who it was for.
    expected_concepts:
      - tailored to the audience
      - progress against milestones in plain terms
      - risks and decisions needed up front
      - concise and regular
    rubric:
      excellent: Describes an update tailored to its audience that leads with overall status, risks and decisions needed, then progress, and explains why that format worked.
      good: Gives a clear, structured update with risks included.
      weak: Describes a list of completed tasks with no risks or asks.
    followups:
      - How do you change it for an executive audience?
    common_errors:
      - Burying the most important risk at the bottom of a long update.

  - external_key: managerial.delivery_planning.early_slip_signals
    competency_key: project_management
    topic: Early signs of a slipping project
    difficulty: easy
    text: >-
      What are the earliest signs you look for that a project is starting to slip?
    expected_concepts:
      - tasks staying in progress longer than expected
      - scope growing without dates moving
      - repeated blockers or waiting on others
      - vague answers in stand-ups
      - milestones met only on paper
    rubric:
      excellent: Names several specific leading indicators from experience and explains how they act on each before it becomes a missed date.
      good: Identifies a few realistic warning signs.
      weak: Only notices a slip when a deadline is missed.
    followups:
      - Which of those signals has been most reliable for you?
    common_errors:
      - Only looking at lagging signals such as missed milestones.

  - external_key: managerial.delivery_planning.release_readiness_checks
    competency_key: project_management
    topic: Deciding work is ready to release
    difficulty: easy
    text: >-
      How do you decide a piece of work is ready to release? Talk me through the checks your team relies on.
    expected_concepts:
      - acceptance criteria met
      - testing and review complete
      - monitoring and alerting in place
      - rollback or feature flag plan
      - support and documentation ready
    rubric:
      excellent: Describes a concrete readiness checklist covering functional acceptance, testing, observability, rollback and support readiness, and how it is applied in practice.
      good: Covers testing and acceptance plus some operational readiness.
      weak: Ready means the code is merged.
    followups:
      - Who signs off on release for your team?
    common_errors:
      - Ignoring operational readiness such as monitoring and rollback.

  - external_key: managerial.delivery_planning.useful_standups
    competency_key: agile_delivery
    topic: Making stand-ups surface delivery problems
    difficulty: easy
    text: >-
      How do you make sure your team's daily stand-up actually helps spot delivery problems instead of
      turning into a status ritual?
    expected_concepts:
      - focusing on the work and its flow rather than individuals
      - surfacing blockers and ageing items
      - taking detailed discussions offline
      - adjusting the format when it stops helping
    rubric:
      excellent: Focuses stand-ups on work items and flow, highlights blocked or long-running items, keeps it short with follow-ups offline, and has adapted the format based on what the team needed.
      good: Describes practical ways to keep stand-ups focused on problems.
      weak: Describes everyone reading out yesterday and today.
    followups:
      - What would you change if the team found stand-ups useless?
    common_errors:
      - Running stand-ups as a report to the manager.

  - external_key: managerial.delivery_planning.post_launch_review
    competency_key: project_management
    topic: Confirming a launch delivered its intent
    difficulty: easy
    text: >-
      After a launch, what do you do in the first week or two to confirm it delivered what it was meant to?
    expected_concepts:
      - success measures agreed before launch
      - monitoring usage and errors
      - gathering user and support feedback
      - deciding follow-up work
    rubric:
      excellent: Compares results against success measures set before launch, watches operational and usage data, collects feedback from users and support, and decides next steps from that evidence.
      good: Checks usage and stability and gathers feedback after launch.
      weak: Treats the launch date as the end of the project.
    followups:
      - Tell me about a launch that didn't move the measure you expected.
    common_errors:
      - Not defining success measures until after the launch.

  # ---------------------------------------------------------------- medium
  - external_key: managerial.delivery_planning.announcing_a_slip
    competency_key: stakeholder_management
    topic: Raising a likely slip early
    difficulty: medium
    text: >-
      Think of a project where you could see weeks in advance that a promised date wasn't going to hold. How
      did you decide when to raise it, who heard first, and what you put on the table?
    expected_concepts:
      - raising it as early as possible
      - clear explanation of the cause
      - options such as reduced scope or phased delivery
      - a new date with its basis
      - steps to prevent recurrence
    rubric:
      excellent: Raised the slip early, explained the cause plainly, came with concrete options and a well-founded new date, and described what changed to prevent repeats.
      good: Communicated the slip clearly with a new plan.
      weak: Told stakeholders late or with no options or explanation.
    followups:
      - How did the stakeholders react?
    common_errors:
      - Giving a new date that is just as optimistic as the old one.

  - external_key: managerial.delivery_planning.false_green_status
    competency_key: leadership
    topic: Discovering a project reported green is behind
    difficulty: medium
    text: >-
      You discover that a project reported as green for weeks is actually well behind. How do you handle it,
      both with the team and with stakeholders?
    expected_concepts:
      - establishing the real state quickly
      - understanding why reporting was wrong without blame
      - resetting expectations with stakeholders promptly
      - fixing how status is determined
    rubric:
      excellent: Quickly establishes the true position, explores why status was misreported in a blameless way, resets stakeholders promptly with a new plan, and changes status reporting to rely on evidence.
      good: Corrects status and addresses the reporting problem.
      weak: Punishes the reporter or keeps the status quiet while trying to catch up.
    followups:
      - Why do you think people kept reporting green?
    common_errors:
      - Blaming individuals instead of fixing the incentives around reporting.

  - external_key: managerial.delivery_planning.stuck_task_surfacing
    competency_key: people_management
    topic: An engineer stuck without saying so
    difficulty: medium
    text: >-
      An engineer on your team has been stuck on a task for a week but kept saying it was nearly done. How do
      you handle it now, and how do you set things up so this surfaces sooner?
    expected_concepts:
      - private, supportive conversation about the work
      - helping unblock with pairing or splitting the task
      - making asking for help normal
      - smaller tasks and visible work-in-progress age
    rubric:
      excellent: Has a supportive conversation focused on the work, gets the task unblocked through pairing or splitting, and changes team practice so long-running work is visible and asking for help is expected.
      good: Helps the engineer and adds some practice to catch it earlier.
      weak: Reprimands the engineer or takes the task away without addressing why it happened.
    followups:
      - What would you say in that first conversation?
    common_errors:
      - Treating it purely as an individual performance issue.

  - external_key: managerial.delivery_planning.immovable_deadline
    competency_key: project_management
    topic: Planning for an immovable deadline
    difficulty: medium
    text: >-
      Your team has a regulatory deadline that cannot move. How would you plan differently from a normal
      project?
    expected_concepts:
      - defining the minimum compliant scope early
      - front-loading the riskiest and approval work
      - larger buffer and earlier internal deadlines
      - frequent checkpoints with compliance or legal
      - contingency plans
    rubric:
      excellent: Pins down the minimum required scope early, schedules risky and approval work first, sets an internal deadline well ahead of the real one, and builds contingencies with frequent compliance checkpoints.
      good: Prioritises the required scope and adds extra margin.
      weak: Plans as normal and hopes the date holds.
    followups:
      - What would you do if you fell behind halfway through?
    common_errors:
      - Gold-plating beyond what the regulation actually requires.

  - external_key: managerial.delivery_planning.event_tied_launch
    competency_key: project_management
    topic: Launch tied to a public event
    difficulty: medium
    text: >-
      Your product launch is tied to a conference keynote ten weeks away. How would you structure the plan,
      and how would you decide when to make the go or no-go call?
    expected_concepts:
      - working back from the date with key milestones
      - defining must-have versus nice-to-have scope
      - a feature-complete date well before the event
      - explicit go or no-go criteria and decision date
      - fallback options such as a preview or limited release
    rubric:
      excellent: Works back from the event with milestones and a code-complete date, separates must-have scope, sets explicit go or no-go criteria and a decision date, and prepares fallbacks like a limited preview.
      good: Plans backwards from the date with a defined decision point.
      weak: Plans to work until the event with no decision point.
    followups:
      - Who would be involved in the go or no-go call?
    common_errors:
      - Making the go or no-go decision the day before the event.

  - external_key: managerial.delivery_planning.multi_team_cadence
    competency_key: collaboration
    topic: Coordinating rhythm across several teams
    difficulty: medium
    text: >-
      When you coordinate a project across four or five teams, what rhythm of meetings and updates do you set
      up, and how do you keep it from turning into overhead?
    expected_concepts:
      - a regular cross-team sync with a clear purpose
      - shared view of milestones and dependencies
      - asynchronous updates where possible
      - clear decision owners
      - pruning meetings that stop adding value
    rubric:
      excellent: Describes a lean, purposeful cadence with a shared plan, async updates, clear decision owners, and examples of removing or changing meetings that stopped helping.
      good: Sets up a sensible coordination rhythm.
      weak: Adds many meetings without a clear purpose.
    followups:
      - How do you know the coordination is working?
    common_errors:
      - Inviting everyone to everything.

  - external_key: managerial.delivery_planning.escalation_judgement
    competency_key: stakeholder_management
    topic: When and how to escalate delivery problems
    difficulty: medium
    text: >-
      When do you escalate a delivery problem to your manager or to leadership, and how do you frame it? Give
      me a real example.
    expected_concepts:
      - clear threshold for escalation
      - attempting resolution at the right level first
      - framing with impact, options and a recommendation
      - escalating early enough to matter
    rubric:
      excellent: Has a clear threshold, tries to resolve it first without delaying, frames escalations with impact, options and a recommendation, and the example shows a useful result.
      good: Escalates sensibly with a reasonable framing.
      weak: Never escalates until too late, or escalates every issue without options.
    followups:
      - Have you ever escalated too late? What happened?
    common_errors:
      - Escalating a problem without a recommendation.

  - external_key: managerial.delivery_planning.delivery_signals_misleading
    competency_key: project_management
    topic: Automated delivery signals and their limits
    difficulty: medium
    text: >-
      Which signals do you track to see how delivery is going, such as burn-up charts or cycle time? Tell me
      about a time one of them helped you, and a time it misled you.
    expected_concepts:
      - specific signals used and why
      - how they inform decisions
      - limits and ways they can mislead
      - combining data with conversation
    rubric:
      excellent: Names specific signals, explains a decision each informed, gives a concrete example of a misleading reading and what they learned about interpreting it.
      good: Uses meaningful signals and recognises their limits.
      weak: Tracks nothing, or trusts charts without question.
    followups:
      - Which signal would you drop if you could only keep one?
    common_errors:
      - Trusting a chart that reflects ticket updates rather than real progress.

  - external_key: managerial.delivery_planning.go_or_delay_decision
    competency_key: leadership
    topic: Deciding whether to launch or delay
    difficulty: medium
    text: >-
      Tell me about a launch where you had to decide whether to go ahead or delay. What information did you
      use, and who made the final call?
    expected_concepts:
      - criteria used for the decision
      - quality, risk and business inputs
      - who was consulted and who decided
      - outcome and reflection
    rubric:
      excellent: Describes explicit criteria, balanced quality and business inputs, a clear decision owner, and reflects on whether the decision was right given the outcome.
      good: Real example with reasoned decision-making.
      weak: Decision was made by default or by whoever pushed hardest.
    followups:
      - Would you make the same call again?
    common_errors:
      - No clear owner for the final decision.

  - external_key: managerial.delivery_planning.priorities_changed_midway
    competency_key: leadership
    topic: Re-planning after priorities change mid-project
    difficulty: medium
    text: >-
      Halfway through a project, business priorities change and part of what you've built is no longer needed.
      How do you re-plan and bring the team along?
    expected_concepts:
      - understanding and explaining the reason for the change
      - salvaging reusable work
      - resetting scope and plan
      - acknowledging the team's effort
      - wrapping up or shelving work cleanly
    rubric:
      excellent: Understands and explains the reason, salvages what is reusable, resets the plan with the team, recognises the work done, and shelves the rest cleanly with notes for the future.
      good: Re-plans sensibly and explains the change to the team.
      weak: Passes on the change without context, or keeps building the old plan.
    followups:
      - How did the team respond?
    common_errors:
      - Leaving half-finished code paths behind without cleanup.

  - external_key: managerial.delivery_planning.staged_rollout_planning
    competency_key: project_management
    topic: Planning a staged rollout for a risky change
    difficulty: medium
    text: >-
      How would you plan the rollout of a risky change, such as a new billing flow, so you can deliver in
      stages and back out if needed?
    expected_concepts:
      - feature flags or parallel running
      - small initial audience and gradual expansion
      - clear success and rollback criteria per stage
      - monitoring and owners during each stage
      - time in the plan for each stage
    rubric:
      excellent: Plans staged exposure with flags or parallel runs, defines success and rollback criteria per stage, assigns owners and monitoring, and builds rollout time into the delivery plan.
      good: Uses a staged rollout with rollback plans.
      weak: Plans a single big release with no rollback.
    followups:
      - How long would you wait between stages?
    common_errors:
      - Leaving rollout time out of the delivery estimate.

  - external_key: managerial.delivery_planning.late_discovered_work
    competency_key: project_management
    topic: Significant work discovered late
    difficulty: medium
    text: >-
      Tell me about a time significant work was discovered late in a project, like a data migration nobody had
      planned for. How did you handle the plan and the stakeholders?
    expected_concepts:
      - sizing the new work quickly
      - options to absorb, cut or delay
      - stakeholder communication
      - why it was missed and how planning changed
    rubric:
      excellent: Sized the new work, laid out options, communicated promptly, and changed their planning approach so similar work is caught at the start.
      good: Handled the discovery reasonably with a lesson learned.
      weak: Absorbed it silently or treated it as unforeseeable.
    followups:
      - What question at kickoff would have caught it?
    common_errors:
      - Treating the miss as bad luck rather than a planning gap.

  # ---------------------------------------------------------------- hard
  - external_key: managerial.delivery_planning.program_without_authority
    competency_key: leadership
    topic: Running a launch across teams you don't manage
    difficulty: hard
    text: >-
      You're accountable for a launch that needs eight teams across two departments, none of whom report to
      you. How would you set up planning and tracking so you find problems early?
    expected_concepts:
      - shared goal and sponsor backing
      - joint planning with each team's leads
      - visible integrated plan with milestones and dependencies
      - lightweight regular checkpoints and early integration
      - escalation path agreed in advance
    rubric:
      excellent: Secures a clear sponsor and shared goal, plans jointly with team leads, maintains an integrated plan with real milestones and early integration, and agrees an escalation path up front.
      good: Proposes a credible coordination structure with early checkpoints.
      weak: Relies on sending status requests and hoping teams deliver.
    followups:
      - What would you do if one team kept missing checkpoints?
    common_errors:
      - Assuming accountability gives authority without building agreement.

  - external_key: managerial.delivery_planning.rebuild_estimate_trust
    competency_key: stakeholder_management
    topic: Rebuilding trust after repeated slips
    difficulty: hard
    text: >-
      Your team has slipped two dates in a row on an important project, and stakeholders have stopped trusting
      your estimates. How would you rebuild that trust?
    expected_concepts:
      - acknowledging the misses and their causes
      - shorter, verifiable milestones
      - ranges and visible progress evidence
      - delivering small commitments reliably
      - inviting stakeholders into reviews or demos
    rubric:
      excellent: Acknowledges the causes, resets with short verifiable milestones and ranges, shows working progress regularly, and builds credibility through a run of reliably met small commitments.
      good: Proposes credible steps to make progress visible and reliable.
      weak: Promises to do better or gives another single date.
    followups:
      - How long would you expect it to take?
    common_errors:
      - Promising a more aggressive plan to make up for lost time.

  - external_key: managerial.delivery_planning.extra_hours_request
    competency_key: leadership
    topic: Pressure to work extra hours to hit a date
    difficulty: hard
    text: >-
      Leadership suggests the team work extra hours for the next month to hit a date. How do you respond, and
      what alternatives would you put forward?
    expected_concepts:
      - understanding the importance of the date
      - realistic effect of extra hours on output and quality
      - alternatives such as scope, sequencing or phased launch
      - protecting sustainable pace while showing commitment
      - involving the team in the decision
    rubric:
      excellent: Engages with why the date matters, explains the limited and risky gains of extended hours, proposes concrete alternatives, and if any extra effort is agreed keeps it short, voluntary and bounded.
      good: Pushes back with reasoning and offers alternatives.
      weak: Accepts and passes the pressure straight to the team, or refuses without engaging.
    followups:
      - When, if ever, would you accept a short push?
    common_errors:
      - Treating extra hours as free capacity with no quality cost.

  - external_key: managerial.delivery_planning.adding_people_late
    competency_key: project_management
    topic: Accepting extra engineers on a late project
    difficulty: hard
    text: >-
      A late project is offered three extra engineers from another team. How do you decide whether to accept
      them, and how would you use them?
    expected_concepts:
      - onboarding and coordination cost
      - whether work can be split into independent pieces
      - using them on separable work or to free up experts
      - effect on the date given remaining time
    rubric:
      excellent: Weighs onboarding and coordination cost against remaining time, identifies separable work or ways to free up key engineers, and decides based on whether it truly brings the date in.
      good: Recognises the cost of adding people and uses them thoughtfully.
      weak: Accepts them assuming the work will go proportionally faster.
    followups:
      - What would make you say no?
    common_errors:
      - Assuming more people always means faster delivery.

  - external_key: managerial.delivery_planning.stop_or_reshape_project
    competency_key: leadership
    topic: Recommending a project stop or change course
    difficulty: hard
    text: >-
      Tell me about a project you recommended stopping or significantly reshaping because the cost of
      delivering it no longer matched its value. How did you make the case?
    expected_concepts:
      - evidence that value or cost had changed
      - avoiding sunk-cost reasoning
      - alternatives presented
      - how the decision was made and communicated
      - handling the team's reaction to the change
    rubric:
      excellent: Presents clear evidence, separates sunk cost from future value, offers alternatives, and describes how the decision was made, communicated and handled with the team.
      good: Real example with a reasoned case.
      weak: No real example, or continued the project out of momentum.
    followups:
      - Who disagreed, and why?
    common_errors:
      - Justifying continuation by how much has already been spent.

  - external_key: managerial.delivery_planning.serious_defect_before_launch
    competency_key: stakeholder_management
    topic: Serious defect found the day before launch
    difficulty: hard
    text: >-
      The day before a big launch, your team finds a defect that seriously affects a small fraction of users.
      The executive sponsor wants to launch anyway. What do you do?
    expected_concepts:
      - assessing severity and who is affected
      - options such as excluding affected users or disabling the feature path
      - clear statement of risk to the sponsor
      - agreement on who owns the decision
      - mitigation and communication plan if launching
    rubric:
      excellent: Assesses severity quickly, proposes options like excluding affected users or launching with that path disabled, states the risk clearly, agrees who decides, and prepares mitigation and communication.
      good: Raises the risk clearly with options.
      weak: Silently goes along with the sponsor or blocks the launch without offering options.
    followups:
      - At what severity would you refuse to support the launch?
    common_errors:
      - Framing it as all or nothing instead of looking for partial launch options.

  - external_key: managerial.delivery_planning.org_wide_reforecast
    competency_key: communication
    topic: Reforecasting commitments across an organisation
    difficulty: hard
    text: >-
      You lead several teams, and midway through a quarter it's clear about a third of the committed work
      won't land. How would you reforecast and communicate that across the organisation?
    expected_concepts:
      - establishing what will and won't land with evidence
      - reprioritising with stakeholders
      - one clear message rather than piecemeal surprises
      - tailoring detail to each audience
      - learning for the next planning cycle
    rubric:
      excellent: Establishes the real picture with evidence, reprioritises with stakeholders, delivers one clear reforecast tailored to each audience, and feeds the causes into next quarter's planning.
      good: Reforecasts promptly and communicates clearly.
      weak: Lets stakeholders find out item by item as deadlines pass.
    followups:
      - Who would you tell first?
    common_errors:
      - Spreading the cuts evenly instead of reprioritising.
