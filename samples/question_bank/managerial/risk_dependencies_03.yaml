# Managerial round: project risks, cross-team dependencies, escalations and unblocking (part 3 of 4).
# Focus: escalations, both raising them well and handling those aimed at your team.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes), never on delivery style.
version: 1
defaults:
  role_tags: [engineering_manager, project_manager, tech_lead]
  round_types: [managerial]
  kind: leadership
questions:
  # ------------------------------------------------------------ escalation basics
  - external_key: managerial.risk_dependencies.deciding_to_escalate
    competency_key: project_management
    topic: Deciding when to escalate
    difficulty: easy
    text: >-
      How do you decide when a problem should be escalated rather than worked out at your own level? Give me an
      example of something you chose to escalate.
    expected_concepts:
      - impact on goals, dates or customers
      - whether it is within their authority to resolve
      - having tried reasonable steps first
      - time sensitivity and cost of waiting
      - the outcome of the escalation in the example
    rubric:
      excellent: States clear criteria such as impact, authority and time sensitivity, and illustrates them with an escalation that was well timed and led to a decision.
      good: Reasonable criteria with a real example, though the timing reasoning is thin.
      weak: Escalates everything or nothing, or cannot describe how they decide.
    followups:
      - Tell me about something you decided not to escalate. How did that turn out?
      - How long had you been working on it before you escalated?
    common_errors:
      - Treating escalation as a failure to be avoided at all costs.

  - external_key: managerial.risk_dependencies.escalation_message_contents
    competency_key: communication
    topic: Writing an actionable escalation
    difficulty: easy
    text: >-
      When you escalate an issue to your manager or another team's leader, what do you put in that message so
      they can act on it quickly? Describe one you actually sent.
    expected_concepts:
      - a one-line summary of the problem and its impact
      - what has already been tried
      - the decision or help needed and by when
      - options with a recommendation
      - who else is involved or affected
    rubric:
      excellent: Describes a real message with impact, history, a specific ask with a deadline and a recommendation, and explains how it led to quick action.
      good: Message is clear with a specific ask, but lacks options or history.
      weak: Describes forwarding a long thread or a vague request for help.
    followups:
      - How long did it take to get a response?
      - What would you change about that message now?
    common_errors:
      - Burying the ask at the bottom of a long background section.

  - external_key: managerial.risk_dependencies.escalating_without_blame
    competency_key: collaboration
    topic: Escalating without blaming another team
    difficulty: easy
    text: >-
      How do you escalate a problem involving another team without it coming across as a complaint about them?
      Tell me how you handled it the last time.
    expected_concepts:
      - framing around the shared goal and impact
      - stating facts rather than judgements about people
      - involving the other team's lead before or during the escalation
      - asking for a decision rather than a reprimand
      - preserving the working relationship afterwards
    rubric:
      excellent: Gives a real example where the escalation was framed around shared goals and facts, the other lead was involved, and the relationship held up afterwards.
      good: Kept the escalation factual and fair, though the other team was not involved early.
      weak: Describes escalation as reporting the other team's failings.
    followups:
      - How did the other team's lead react?
      - What did you do to keep working well with them afterwards?
    common_errors:
      - Copying the other team's manager in to apply pressure rather than to solve the problem.

  - external_key: managerial.risk_dependencies.coaching_when_to_raise
    competency_key: mentoring
    topic: Coaching others to raise problems
    difficulty: easy
    text: >-
      How do you help newer engineers on your team learn when and how to raise a problem beyond themselves? Give
      me an example of someone you coached on this.
    expected_concepts:
      - explaining what is worth raising and how quickly
      - modelling good escalations
      - reviewing a draft message together
      - praising timely raising of problems
      - gradually letting them handle it independently
    rubric:
      excellent: Describes coaching a specific person with concrete techniques such as reviewing drafts and debriefing, and shows how their judgement improved.
      good: Gives reasonable guidance with a real example, but little evidence of progress.
      weak: Expects people to learn by experience or handles all escalations personally.
    followups:
      - What mistake did they make first, and how did you respond?
      - How did you know they'd got the hang of it?
    common_errors:
      - Telling engineers to "just ask" without explaining what or how.

  - external_key: managerial.risk_dependencies.finding_the_decider
    competency_key: stakeholder_management
    topic: Finding who can decide
    difficulty: easy
    text: >-
      Tell me about a time you needed a decision but it wasn't clear who had the authority to make it. How did
      you find the right person?
    expected_concepts:
      - mapping who was affected and who owned the area
      - asking managers or peers for guidance
      - proposing a decision owner when none existed
      - getting the decision recorded
      - clarifying ownership for next time
    rubric:
      excellent: Describes working out ownership methodically, proposing a decision owner when needed, getting a recorded decision and clarifying ownership for the future.
      good: Found the decision maker and got an answer, with no lasting clarification.
      weak: Waited for someone to step forward or made the decision without authority.
    followups:
      - How long did it take to get the decision?
      - What did you do so the next person wouldn't have the same problem?
    common_errors:
      - Collecting opinions from many people and treating the result as a decision.

  - external_key: managerial.risk_dependencies.warning_before_escalating
    competency_key: stakeholder_management
    topic: Giving notice before escalating
    difficulty: easy
    text: >-
      Before you take an issue above someone's head, what do you do with that person first? Tell me about a time
      you handled this well, or one you'd handle differently now.
    expected_concepts:
      - talking to them directly first
      - telling them you plan to escalate and why
      - inviting them to join or co-author the escalation
      - presenting it as seeking a decision rather than a complaint
      - following up with them afterwards
    rubric:
      excellent: Describes speaking to the person first, being open about the escalation, inviting them in and keeping the relationship intact, with a real example.
      good: Talked to the person first, though they weren't involved in the escalation itself.
      weak: Goes straight above the person without telling them.
    followups:
      - What would you do if they asked you not to escalate?
      - How did the relationship look afterwards?
    common_errors:
      - Treating a warning as a threat rather than an invitation to solve it together.

  # ------------------------------------------------------------ escalations in practice
  - external_key: managerial.risk_dependencies.escalation_backfired
    competency_key: leadership
    topic: An escalation that went badly
    difficulty: medium
    text: >-
      Tell me about an escalation you made that didn't go the way you'd hoped. What went wrong, and how would
      you approach it now?
    expected_concepts:
      - the situation and what they escalated
      - what went wrong, such as timing, framing or audience
      - the effect on the problem and relationships
      - how they repaired it
      - a specific change in their approach since
    rubric:
      excellent: Gives a candid account of what went wrong including their own part, how they repaired it and a specific change in how they escalate since.
      good: Real example with a reasonable lesson, but limited ownership of their part.
      weak: Example where the failure was entirely someone else's fault.
    followups:
      - What did you do to repair any damage?
      - When did you next use the changed approach?
    common_errors:
      - Choosing an example where the only lesson is that the other people were wrong.

  - external_key: managerial.risk_dependencies.escalated_too_late
    competency_key: project_management
    topic: Waiting too long to escalate
    difficulty: medium
    text: >-
      Tell me about a time you waited too long to escalate something. What held you back, and what do you do
      differently now?
    expected_concepts:
      - the situation and the cost of the delay
      - the reason for waiting, such as optimism or wanting to fix it alone
      - when they realised it was too late
      - a concrete rule or habit adopted since
      - an example of applying it
    rubric:
      excellent: Explains clearly why they delayed, the cost, and a concrete rule such as time limits or triggers they now use, with a later example.
      good: Reflects on the delay with a real lesson, but no concrete practice.
      weak: Cannot name such a time, or the lesson is just "escalate sooner".
    followups:
      - What would earlier escalation have changed?
      - What signal do you now watch for?
    common_errors:
      - Describing it as bad luck rather than a judgement they could improve.

  - external_key: managerial.risk_dependencies.hearing_secondhand_escalation
    competency_key: stakeholder_management
    topic: Learning your team was escalated about
    difficulty: medium
    text: >-
      Another team's lead escalates to your manager that your team is blocking them, and you hear about it
      secondhand. How do you respond? Tell me about a similar situation if you've had one.
    expected_concepts:
      - understanding the complaint's substance before reacting
      - contacting the other lead directly
      - checking the facts with their own team
      - fixing the real issue or explaining the constraint
      - agreeing a direct channel for next time
    rubric:
      excellent: Focuses on the substance, reaches out to the other lead directly, checks facts, resolves or explains the issue and sets up a direct channel to avoid repeats.
      good: Addresses the issue constructively, though the follow-up on communication is light.
      weak: Defends the team reflexively or complains about being escalated.
    followups:
      - What would you say to your manager?
      - What if the escalation was partly unfair?
    common_errors:
      - Spending the effort on who was right instead of unblocking the other team.

  - external_key: managerial.risk_dependencies.escalating_with_options
    competency_key: communication
    topic: Bringing options to an escalation
    difficulty: medium
    text: >-
      When you escalate, how do you frame the choices for the decision maker rather than just handing them the
      problem? Walk me through an escalation where you laid out options.
    expected_concepts:
      - a short list of realistic options
      - the cost, risk and impact of each
      - a clear recommendation with reasoning
      - what happens if no decision is made
      - the decision deadline
    rubric:
      excellent: Describes a real escalation with distinct options, trade-offs, a recommendation and the cost of no decision, and shows how it sped up the outcome.
      good: Presented options with some trade-offs, but no clear recommendation.
      weak: Escalated a problem without options or with only one.
    followups:
      - Did the decision maker pick your recommendation? Why or why not?
      - How did you choose which options to present?
    common_errors:
      - Presenting options that are not realistic just to make the preferred one look good.

  - external_key: managerial.risk_dependencies.raising_above_manager
    competency_key: stakeholder_management
    topic: Raising a concern above your manager
    difficulty: medium
    text: >-
      Tell me about a time you had to raise a concern above your own manager's level. How did you handle the
      relationship with your manager while doing it?
    expected_concepts:
      - why it needed to go above the manager
      - discussing it with the manager first
      - being open about the next step
      - keeping the focus on the issue rather than the person
      - follow-up with the manager afterwards
    rubric:
      excellent: Explains why it had to go higher, shows openness with the manager throughout, keeps the issue factual and describes the relationship and outcome afterwards.
      good: Handled the escalation sensibly, with some attention to the manager relationship.
      weak: Went around the manager without telling them, or avoided raising a serious concern.
    followups:
      - How did your manager react?
      - What would you do if your manager disagreed with you raising it?
    common_errors:
      - Treating skip-level conversations as a way to win an argument.

  - external_key: managerial.risk_dependencies.recurring_escalations
    competency_key: leadership
    topic: Stopping recurring escalations
    difficulty: medium
    text: >-
      If the same kind of problem keeps being escalated to you every few weeks, how do you deal with it? Tell me
      about a recurring escalation you put a stop to.
    expected_concepts:
      - noticing the pattern across individual cases
      - finding the underlying cause
      - fixing ownership, process or tooling
      - giving others authority to resolve it without escalating
      - checking the escalations actually stopped
    rubric:
      excellent: Identifies the pattern, gets to the underlying cause, changes ownership or process so others can resolve it, and shows the escalations stopped.
      good: Fixed the root cause with a real example, but with less evidence it lasted.
      weak: Keeps resolving each escalation individually.
    followups:
      - How did you notice it was a pattern?
      - Who resolves those issues now?
    common_errors:
      - Becoming the permanent resolver instead of removing the cause.

  - external_key: managerial.risk_dependencies.escalation_paths_agreed_upfront
    competency_key: project_management
    topic: Agreeing escalation paths in advance
    difficulty: medium
    text: >-
      On a larger project, how have you agreed up front which kinds of issues get escalated, to whom and how
      quickly? Describe the arrangement and whether people actually used it.
    expected_concepts:
      - categories or severity of issues
      - named people at each level
      - expected response times
      - shared with all teams involved
      - reviewed after use and adjusted
    rubric:
      excellent: Describes a concrete escalation arrangement with categories, names and response times, how it was shared, and evidence of it being used and refined.
      good: Had a clear path with names, but it was rarely tested or reviewed.
      weak: No agreed path; escalations happened informally as needed.
    followups:
      - Tell me about a time it was used. How did it work?
      - What did you change after using it?
    common_errors:
      - Writing an escalation matrix that nobody reads or follows.

  - external_key: managerial.risk_dependencies.escalating_quality_concern
    competency_key: leadership
    topic: Escalating a quality concern before release
    difficulty: medium
    text: >-
      Tell me about a time you escalated because you believed something was about to ship with a serious quality
      problem while others wanted to go ahead. How did you make your case?
    expected_concepts:
      - evidence of the problem and its likely impact on users
      - who they escalated to and why
      - options such as delay, reduced rollout or a fix
      - accepting the decision once made
      - outcome and what it showed
    rubric:
      excellent: Brings concrete evidence and user impact, offers options such as a staged rollout, escalates to the right owner, and handles the decision maturely with a clear outcome.
      good: Makes a reasonable evidence-based case, with fewer options.
      weak: Objects without evidence, or stays quiet and lets it ship.
    followups:
      - What would you have done if they had shipped anyway?
      - How did the people who wanted to ship react afterwards?
    common_errors:
      - Framing the case as personal opinion rather than evidence of user impact.

  - external_key: managerial.risk_dependencies.mediating_lead_conflict
    competency_key: collaboration
    topic: Mediating escalations between leads
    difficulty: medium
    text: >-
      Two leads on teams you work with keep escalating against each other over a shared deadline, and you've been
      asked to help sort it out. How would you approach it?
    expected_concepts:
      - hearing each side separately to understand constraints
      - finding the shared goal and the real point of disagreement
      - getting them together to agree a plan
      - clarifying who decides if they can't agree
      - checking in afterwards to confirm it held
    rubric:
      excellent: Understands each side's constraints, finds the real disagreement, facilitates a joint plan with clear decision rights and follows up.
      good: Brings them together and reaches a plan, but with little attention to decision rights or follow-up.
      weak: Picks a side quickly or passes the problem up again.
    followups:
      - What would you do if one lead clearly had the stronger case?
      - How would you stop the pattern recurring?
    common_errors:
      - Settling the immediate deadline but leaving the working relationship broken.

  - external_key: managerial.risk_dependencies.escalation_follow_through
    competency_key: project_management
    topic: Following through after an escalation
    difficulty: medium
    text: >-
      After an escalation gets a decision, how do you make sure it's actually carried out across the teams
      involved? Give me an example where follow-through mattered.
    expected_concepts:
      - writing up and sharing the decision
      - turning it into owned actions with dates
      - checking progress at agreed points
      - raising again if actions stall
      - closing the loop with the decision maker
    rubric:
      excellent: Describes documenting the decision, owned actions, tracking and closing the loop, with an example where follow-through caught a stall.
      good: Shares and tracks the decision, but closing the loop is missing.
      weak: Considers the escalation finished once a decision is made.
    followups:
      - What did you do when one team didn't act on it?
      - How did you let the decision maker know the outcome?
    common_errors:
      - Assuming everyone heard and understood the decision the same way.

  - external_key: managerial.risk_dependencies.escalating_staffing_gap
    competency_key: stakeholder_management
    topic: Escalating a staffing gap
    difficulty: medium
    text: >-
      Tell me about a time you escalated because your team didn't have enough people to deliver what had been
      committed. How did you make the case, and what came of it?
    expected_concepts:
      - evidence of demand versus capacity
      - impact of the gap on commitments
      - options such as hiring, borrowing people or cutting scope
      - a clear recommendation
      - the decision and how expectations were reset
    rubric:
      excellent: Uses concrete capacity data, shows the impact on commitments, offers options including scope cuts and gets a decision that reset expectations.
      good: Makes a reasonable case with an outcome, though the options were narrow.
      weak: Asks only for more people without evidence or alternatives.
    followups:
      - What did you do while waiting for a decision?
      - If you didn't get the people, what did you stop doing?
    common_errors:
      - Treating headcount as the only answer.

  - external_key: managerial.risk_dependencies.unresponsive_vendor_escalation
    competency_key: stakeholder_management
    topic: Escalating with an unresponsive vendor
    difficulty: medium
    text: >-
      When an outside vendor isn't responding to a problem that's blocking you, how do you escalate within their
      organisation and your own? Tell me what you did in a real case.
    expected_concepts:
      - using the support or contract channels correctly
      - documenting impact and timelines
      - engaging account managers or senior contacts at the vendor
      - involving internal owners such as procurement or the relationship owner
      - parallel workaround planning
    rubric:
      excellent: Describes using formal and relationship channels on both sides with documented impact, plus a parallel workaround, and the outcome.
      good: Escalated through sensible channels with some result.
      weak: Kept filing tickets and waited.
    followups:
      - Who inside your company owned the vendor relationship?
      - What did you document, and why did it matter?
    common_errors:
      - Not knowing what the contract or support agreement actually entitles them to.

  - external_key: managerial.risk_dependencies.escalation_fatigue
    competency_key: communication
    topic: Avoiding escalation fatigue
    difficulty: medium
    text: >-
      How do you keep yourself or your team from escalating so often that leadership starts tuning it out? Tell
      me how you've calibrated this.
    expected_concepts:
      - clear criteria for what reaches leadership
      - resolving more at team level first
      - batching lower-priority items into regular updates
      - reserving urgent escalation for real urgency
      - asking leadership what they want to hear about
    rubric:
      excellent: Describes deliberate calibration with criteria, batching and feedback from leadership, with an example where it kept urgent escalations effective.
      good: Shows awareness and some practices, with a light example.
      weak: Escalates everything or avoids escalating to stay out of trouble.
    followups:
      - When did you last ask leadership how useful your escalations were, and what did they say?
      - What do you hold back from leadership, and why?
    common_errors:
      - Marking every issue as urgent so nothing stands out.

  # ------------------------------------------------------------ harder escalations
  - external_key: managerial.risk_dependencies.escalation_decision_stood
    competency_key: leadership
    topic: When the escalated decision stands
    difficulty: hard
    text: >-
      Tell me about a time you escalated a concern about a decision made by someone more senior, and the decision
      stood anyway. What did you do next?
    expected_concepts:
      - making the case clearly and with evidence
      - accepting the decision and committing to it
      - mitigating the risk within the decision
      - explaining the decision to the team without undermining it
      - revisiting if new evidence emerged
    rubric:
      excellent: Made a clear case, then committed fully, mitigated the risk, supported the decision with the team and set up a way to revisit it with new evidence.
      good: Accepted the decision and moved on constructively, with less on mitigation.
      weak: Kept resisting the decision or undermined it with the team.
    followups:
      - How did you explain it to your team?
      - Was the decision right in the end?
    common_errors:
      - Telling the team the decision was wrong while carrying it out half-heartedly.

  - external_key: managerial.risk_dependencies.urgent_fix_needs_other_org
    competency_key: communication
    topic: Urgent help from another part of the company
    difficulty: hard
    text: >-
      During a serious production problem, the fix needs action from a team in another part of the company that
      isn't treating it as urgent. How do you get them moving quickly? Tell me about a time this happened.
    expected_concepts:
      - stating customer and business impact concretely
      - using the incident process or on-call channels
      - escalating through their management when needed
      - making the ask small and specific
      - follow-up review of the cross-team response
    rubric:
      excellent: Communicates concrete impact through proper incident channels, makes a precise ask, escalates quickly and appropriately, and follows up to improve cross-team response.
      good: Gets the other team moving with a reasonable approach, but with little follow-up.
      weak: Waits for them or escalates aggressively without clarity on the ask.
    followups:
      - What exactly did you ask them to do?
      - What did you change afterwards so it would be faster next time?
    common_errors:
      - Describing the problem without saying exactly what the other team must do.

  - external_key: managerial.risk_dependencies.problem_caused_by_powerful_stakeholder
    competency_key: stakeholder_management
    topic: Escalating a problem a senior stakeholder caused
    difficulty: hard
    text: >-
      Tell me about an escalation where the problem was caused by a senior stakeholder's own decision. How did you
      raise it in a way that got it fixed?
    expected_concepts:
      - understanding the reasoning behind their decision
      - presenting the impact factually
      - raising it with them directly first
      - offering options that let them change course
      - outcome and the effect on the relationship
    rubric:
      excellent: Understands the stakeholder's reasoning, raises the impact directly and factually, offers face-saving options and achieves a change while keeping the relationship.
      good: Raises the issue respectfully with some result.
      weak: Avoids raising it or goes around the stakeholder.
    followups:
      - Why do you think they made the original decision?
      - What would you have done if they had refused to change it?
    common_errors:
      - Framing the problem as the stakeholder's mistake rather than a new fact to act on.

  - external_key: managerial.risk_dependencies.escalated_twice_nothing_changed
    competency_key: leadership
    topic: Escalation that produced nothing
    difficulty: hard
    text: >-
      You've escalated a blocking issue twice and nothing has changed, while the project keeps slipping. What do
      you do next? Walk me through a time you were in this position.
    expected_concepts:
      - reconsidering whether the ask was clear and to the right person
      - quantifying the cost of continued delay
      - changing the plan within their own control
      - making the trade-off explicit in writing to leadership
      - resetting commitments rather than absorbing the slip silently
    rubric:
      excellent: Revisits the framing and audience, quantifies the cost, acts within their own control and forces an explicit decision or commitment reset in writing.
      good: Takes reasonable further steps, but stops short of resetting commitments.
      weak: Keeps escalating the same way or quietly absorbs the delay.
    followups:
      - What did you change about the third escalation?
      - What could you do without anyone's permission?
    common_errors:
      - Repeating the same escalation louder rather than changing the approach.

  - external_key: managerial.risk_dependencies.designing_org_escalations
    competency_key: project_management
    topic: Designing escalation for an organisation
    difficulty: hard
    text: >-
      If you were asked to design how escalations work across an engineering organisation of several hundred
      people, what would you put in place, and what would you deliberately avoid?
    expected_concepts:
      - clear decision rights at each level
      - severity categories with response expectations
      - lightweight channels and templates
      - norms that escalation is normal and blameless
      - review of escalation patterns to fix root causes
      - avoiding bureaucracy that slows urgent issues
    rubric:
      excellent: Proposes clear decision rights, severity levels, simple channels and blameless norms, uses escalation data to fix root causes and names specific pitfalls to avoid.
      good: Proposes a sensible structure with some norms, but little about learning from patterns.
      weak: Proposes a heavy approval process or relies on informal networks.
    followups:
      - How would you measure whether it was working?
      - What would you do about teams that never escalate?
    common_errors:
      - Designing for control rather than for fast decisions.

  - external_key: managerial.risk_dependencies.own_team_mistake_escalated
    competency_key: leadership
    topic: Handling an escalation caused by your team
    difficulty: hard
    text: >-
      Tell me about a time an escalation landed on you because your own team had made a mistake that hurt another
      group. How did you handle it with them and with your team?
    expected_concepts:
      - owning the problem with the affected group
      - fixing the immediate impact quickly
      - finding the cause with the team in a blameless way
      - concrete prevention steps
      - following up with the affected group
    rubric:
      excellent: Takes ownership outwardly, fixes the impact quickly, runs a blameless review with the team, puts prevention in place and closes the loop with the affected group.
      good: Owns it and fixes it, with some prevention.
      weak: Deflects responsibility or blames individuals on the team.
    followups:
      - What did you say to the affected group's lead?
      - How did you talk about it with the engineer involved?
    common_errors:
      - Protecting the team by minimising the impact to the other group.
