# Curated questions: behavioural (STAR). Questions ask for real past situations; evaluation is
# based only on the content of the example (actions, results, reflection) — never on personality,
# emotion, confidence or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # -------------------------------------------------------------- ownership
  - external_key: behavioral.ownership.beyond_scope
    competency_key: ownership
    topic: Taking ownership beyond your role
    difficulty: easy
    text: >-
      Tell me about a time you noticed a problem that wasn't strictly your responsibility and decided to do
      something about it. What did you do, and what happened?
    expected_concepts:
      - specific situation and why it mattered
      - personal actions taken
      - involving the right owners
      - measurable outcome
      - lasting improvement
    rubric:
      excellent: Describes a specific problem, explains why they acted, details their own actions including coordinating with owners, and gives a concrete outcome with a durable fix.
      good: Clear example with personal actions and a positive result.
      weak: Hypothetical or vague answer, or describes only what others did.
    followups:
      - How did the team that owned the area react?
      - What would you do differently next time?
    common_errors:
      - Describing team actions without clarifying their own role.
      - Answering with what they would do instead of what they did.

  - external_key: behavioral.ownership.production_mistake
    competency_key: ownership
    topic: A mistake you made in production
    difficulty: medium
    text: >-
      Tell me about a mistake you made that affected production or customers. How did you handle it at the time,
      and what changed afterwards?
    expected_concepts:
      - clear description of the mistake and its impact
      - immediate mitigation and communication
      - root-cause analysis
      - preventive changes to process or tooling
      - personal learning
    rubric:
      excellent: Owns the mistake plainly, explains fast mitigation and transparent communication, and describes systemic changes that prevent recurrence.
      good: Clear example with mitigation and lessons learned.
      weak: Deflects blame, or chooses an example with no real impact.
    followups:
      - Who did you tell, and how quickly?
      - How did you make sure the fix stuck?
    common_errors:
      - Blaming tools or teammates for their own mistake.
      - Lessons that are only "be more careful".

  - external_key: behavioral.ownership.long_project
    competency_key: ownership
    topic: Seeing a long project through
    difficulty: hard
    text: >-
      Describe a long or difficult project you drove to completion even when it lost momentum or priorities
      shifted. How did you keep it moving?
    expected_concepts:
      - scope and stakes of the project
      - obstacles encountered
      - re-planning and re-negotiating
      - keeping stakeholders engaged
      - result and its measurement
    rubric:
      excellent: Explains the stakes, the specific obstacles and the concrete steps they took to re-plan, secure support and deliver, with a measurable result.
      good: Credible example with persistence and a clear result.
      weak: Generic answer without obstacles or outcomes.
    followups:
      - At what point did you consider stopping, and why didn't you?
      - What would you cut if you had to do it again in half the time?
    common_errors:
      - Describing effort rather than outcomes.
      - No mention of how priorities were negotiated.

  # ---------------------------------------------------------- collaboration
  - external_key: behavioral.collaboration.technical_disagreement
    competency_key: collaboration
    topic: Disagreeing on a technical approach
    difficulty: easy
    text: >-
      Tell me about a time you disagreed with a teammate about a technical decision. How did you work through
      it, and what was the outcome?
    expected_concepts:
      - the disagreement and the stakes
      - understanding the other perspective
      - using data, prototypes or criteria to decide
      - reaching a decision and committing
      - relationship afterwards
    rubric:
      excellent: Shows genuine understanding of the other view, resolves it with evidence or agreed criteria, commits to the outcome (even if not theirs) and reflects on what they learned.
      good: Constructive resolution with a clear outcome.
      weak: Describes winning an argument or escalating immediately.
    followups:
      - What would you have done if you couldn't agree?
      - Looking back, who was right, and how do you know?
    common_errors:
      - Framing the other person negatively.
      - No outcome or decision.

  - external_key: behavioral.collaboration.cross_team
    competency_key: collaboration
    topic: Delivering with another team
    difficulty: medium
    round_types: [behavioral, combined, managerial]
    text: >-
      Describe a project where you depended on another team that had different priorities. How did you get what
      you needed?
    expected_concepts:
      - dependency and its importance
      - understanding the other team's goals
      - finding mutual benefit or offering help
      - clear agreements and follow-up
      - escalation only when necessary
    rubric:
      excellent: Understands the other team's constraints, creates mutual value, sets clear agreements and follows through, escalating thoughtfully only when needed.
      good: Clear communication and a workable agreement.
      weak: Relies solely on escalation or complains about the other team.
    followups:
      - What did you offer them in return?
      - How did you keep the agreement on track?
    common_errors:
      - Escalating before trying to understand the other team.
      - Vague agreements without owners or dates.

  - external_key: behavioral.collaboration.helping_teammate
    competency_key: collaboration
    topic: Helping a struggling teammate
    difficulty: easy
    text: >-
      Tell me about a time you helped a teammate who was stuck or overloaded. What did you do?
    expected_concepts:
      - noticing the situation
      - offering help appropriately
      - concrete assistance (pairing, unblocking, sharing knowledge)
      - respecting the teammate's ownership
      - result for the team
    rubric:
      excellent: Describes noticing early, offering help in a way that preserved the teammate's ownership, specific actions and a concrete team outcome.
      good: Specific help with a positive result.
      weak: Took over the work without discussion or gives no specifics.
    followups:
      - How did you balance helping with your own commitments?
      - What did the teammate learn?
    common_errors:
      - Taking over the task entirely.
      - No concrete example.

  # ---------------------------------------------------------- communication
  - external_key: behavioral.communication.non_technical_audience
    competency_key: communication
    topic: Explaining a technical topic to non-engineers
    difficulty: easy
    round_types: [behavioral, combined, recruiter_screening]
    text: >-
      Tell me about a time you had to explain a complex technical issue to people without a technical
      background. How did you approach it?
    expected_concepts:
      - understanding the audience's goals
      - avoiding jargon and using analogies
      - focusing on impact and decisions needed
      - checking understanding
      - outcome of the conversation
    rubric:
      excellent: Tailors the message to the audience's decisions, uses clear framing and examples, checks understanding and gets a concrete outcome.
      good: Clear example with adapted language.
      weak: Repeats the technical explanation more slowly.
    followups:
      - How did you know they understood?
      - What would you change about how you explained it?
    common_errors:
      - Leading with technical detail rather than impact.
      - No check for understanding.

  - external_key: behavioral.communication.design_doc
    competency_key: communication
    topic: Written proposals and design docs
    difficulty: medium
    round_types: [behavioral, combined, managerial, leadership]
    role_tags: [general, tech_lead]
    text: >-
      Tell me about a written proposal or design document you wrote that changed a decision. How did you
      structure it, and how did you get feedback?
    expected_concepts:
      - problem statement and goals
      - options considered with trade-offs
      - recommendation and rationale
      - soliciting review from the right people
      - incorporating feedback
      - resulting decision
    rubric:
      excellent: Describes a clear structure with alternatives and trade-offs, a deliberate review process and a decision that changed because of the document.
      good: Reasonable structure and some feedback process.
      weak: Cannot describe the document or its impact.
    followups:
      - Which piece of feedback changed your recommendation?
      - How long was it, and who was it for?
    common_errors:
      - Documents that describe a solution without the problem or alternatives.
      - Seeking feedback only after the decision was made.

  - external_key: behavioral.communication.bad_news
    competency_key: communication
    topic: Delivering bad news
    difficulty: hard
    round_types: [behavioral, combined, managerial, leadership]
    text: >-
      Tell me about a time you had to tell a stakeholder or manager something they didn't want to hear — for
      example a slipped deadline or a serious risk. How did you handle it?
    expected_concepts:
      - raising the issue early
      - facts and impact stated clearly
      - options and a recommendation
      - ownership of their part
      - follow-up actions
    rubric:
      excellent: Raised it early with clear facts and impact, came with options and a recommendation, owned their part and followed up on the agreed plan.
      good: Clear, timely communication with a plan.
      weak: Delayed the news or softened it until it was unclear.
    followups:
      - How early did you know, and when did you say something?
      - What did the stakeholder decide?
    common_errors:
      - Waiting until the deadline to raise a slip.
      - Bringing problems without options.

  # --------------------------------------------------------- problem_solving
  - external_key: behavioral.problem_solving.hardest_problem
    competency_key: problem_solving
    topic: The hardest technical problem you've solved
    difficulty: medium
    round_types: [behavioral, combined, technical_screening]
    text: >-
      What's the hardest technical problem you've solved? Take me through how you approached it from start to
      finish.
    expected_concepts:
      - why the problem was hard
      - how they narrowed it down
      - hypotheses tested and evidence used
      - their specific contribution
      - outcome and lessons
    rubric:
      excellent: Explains why it was hard, a methodical approach with hypotheses and evidence, their own decisive contribution and a measurable outcome.
      good: Clear narrative with a sensible approach and result.
      weak: Superficial problem or no clear account of their reasoning.
    followups:
      - Which hypothesis turned out to be wrong, and how did you find out?
      - What would you do faster next time?
    common_errors:
      - Describing the solution without the reasoning that led to it.
      - Overstating their role in a team effort.

  - external_key: behavioral.problem_solving.incomplete_information
    competency_key: problem_solving
    topic: Deciding with incomplete information
    difficulty: hard
    text: >-
      Tell me about an important decision you had to make without all the information you wanted. How did you
      decide, and how did it turn out?
    expected_concepts:
      - what was unknown and why waiting was costly
      - gathering the most valuable information quickly
      - reversible versus irreversible decisions
      - explicit assumptions and risks
      - revisiting the decision with new data
    rubric:
      excellent: Distinguishes what could and couldn't be known, gathers key information quickly, makes the decision reversible where possible, states assumptions and revisits it as facts emerge.
      good: Reasonable decision process and outcome.
      weak: Decision by gut feel with no reflection.
    followups:
      - Was the decision reversible? How did that affect your approach?
      - What new information would have changed your mind?
    common_errors:
      - Waiting for certainty that never arrives.
      - Not revisiting the decision when new data appeared.

  # ------------------------------------------------------------ adaptability
  - external_key: behavioral.adaptability.changed_priorities
    competency_key: adaptability
    topic: Priorities changed mid-project
    difficulty: easy
    text: >-
      Tell me about a time priorities changed suddenly in the middle of your work. What did you do?
    expected_concepts:
      - understanding the reason for the change
      - wrapping up or parking current work cleanly
      - re-planning and communicating impact
      - delivering on the new priority
    rubric:
      excellent: Clarified the reason, parked work cleanly with documentation, re-planned with stakeholders and delivered on the new priority.
      good: Adapted effectively with a clear outcome.
      weak: Describes frustration without describing actions.
    followups:
      - What happened to the work you paused?
      - How did you communicate the impact on other commitments?
    common_errors:
      - Abandoning work without leaving it in a recoverable state.
      - Not communicating changed timelines.

  - external_key: behavioral.adaptability.learning_quickly
    competency_key: adaptability
    topic: Learning a new technology fast
    difficulty: medium
    round_types: [behavioral, combined, recruiter_screening]
    text: >-
      Describe a time you had to become productive with an unfamiliar technology or domain quickly. How did you
      go about learning it?
    expected_concepts:
      - motivation and deadline
      - learning strategy (docs, small experiments, experts)
      - applying knowledge to real work quickly
      - validating understanding
      - result delivered
    rubric:
      excellent: Describes a deliberate learning strategy, early hands-on application, validation with experts or tests, and a concrete delivered result.
      good: Clear learning approach and outcome.
      weak: Vague "I read the docs" with no result.
    followups:
      - What was the hardest concept to grasp?
      - How did you know your understanding was good enough to ship?
    common_errors:
      - No concrete outcome.
      - Learning without validating understanding.

  # ----------------------------------------------------------- culture_values
  - external_key: behavioral.culture_values.feedback
    competency_key: culture_values
    topic: Receiving difficult feedback
    difficulty: easy
    text: >-
      Tell me about a piece of critical feedback you received at work. What did you do with it?
    expected_concepts:
      - the feedback and its context
      - seeking to understand
      - concrete changes made
      - evidence of improvement
    rubric:
      excellent: Describes specific feedback, how they sought to understand it, concrete changes and evidence that the changes worked.
      good: Specific feedback with clear actions taken.
      weak: Chooses trivial feedback or describes disagreeing without acting.
    followups:
      - How did you check that the change made a difference?
      - How do you now ask for feedback?
    common_errors:
      - Picking a disguised strength as the feedback.
      - No evidence of change.

  - external_key: behavioral.culture_values.raising_concern
    competency_key: culture_values
    topic: Raising a quality or ethics concern
    difficulty: medium
    text: >-
      Tell me about a time you raised a concern about quality, security, privacy or doing the right thing for
      users, even though it was inconvenient. What happened?
    expected_concepts:
      - the concern and why it mattered
      - raising it through appropriate channels
      - evidence and proposed alternatives
      - handling pushback
      - outcome
    rubric:
      excellent: Raised a well-founded concern constructively with evidence and alternatives, handled pushback respectfully and achieved or influenced a better outcome.
      good: Clear example of raising a concern with a reasonable outcome.
      weak: No real example, or describes refusing to work without engaging.
    followups:
      - What would you have done if your concern had been dismissed?
      - How did you make it easy for others to act on it?
    common_errors:
      - Raising concerns without proposing alternatives.
      - Escalating publicly before raising it directly.

  - external_key: behavioral.culture_values.inclusive_team
    competency_key: culture_values
    topic: Making sure every voice is heard
    difficulty: hard
    round_types: [behavioral, combined, managerial, leadership]
    text: >-
      Tell me about a time you noticed someone's ideas weren't being heard in team discussions. What did you do
      about it?
    expected_concepts:
      - noticing the dynamic
      - concrete actions (inviting input, changing meeting formats, crediting ideas)
      - respecting the person's preferences
      - effect on decisions or the team
    rubric:
      excellent: Describes specific, respectful actions that changed how the team worked and a concrete effect on decisions, while respecting the person's preferences.
      good: Took a reasonable action with some effect.
      weak: Noticed but did nothing, or gives a generic answer.
    followups:
      - How did the person feel about your intervention?
      - What process changes stuck afterwards?
    common_errors:
      - Speaking for the person instead of creating space.
      - Generic statements without a specific situation.
