# Curated questions: leadership round, influence (part 4 of 4). Objections, audiences, estimates under pressure, narratives, impasses and sustaining influence. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.influence.story_with_data
  competency_key: communication
  topic: Telling a story with numbers
  difficulty: easy
  text: >-
    How do you use data and a short story together when you want a group to take an issue seriously?
  expected_concepts:
  - one clear message
  - a few relevant numbers
  - a concrete example of the effect on a user or team
  - what you propose
  - avoiding overload
  rubric:
    excellent: >-
      Pairs one message with a few relevant numbers and a concrete example, proposes an action and keeps
      it short, with a case where it changed a decision.
    good: Uses data and an example in a presentation.
    weak: Presents many numbers with no clear message.
  followups:
  - Which number matters most?
  - How do you pick the example?
  common_errors:
  - Showing every chart available and leaving the audience to find the point.

- external_key: leadership.influence.find_the_decision_maker
  competency_key: stakeholder_management
  topic: Working out who actually decides
  difficulty: easy
  text: How do you find out who really makes a decision before you try to influence it?
  expected_concepts:
  - asking directly how decisions are made
  - noticing who others defer to
  - learning formal and informal roles
  - finding who advises them
  - checking the timeline
  rubric:
    excellent: >-
      Asks directly, observes who others defer to, understands formal and informal roles and advisers,
      and checks timelines, with an example.
    good: Asks colleagues who decides.
    weak: Assumes the most senior person decides.
  followups:
  - Who surprised you?
  - How do you check your assumption?
  common_errors:
  - Assumes the most senior person decides.

- external_key: leadership.influence.listening_for_the_real_concern
  competency_key: communication
  topic: Hearing what is behind an objection
  difficulty: easy
  text: >-
    When someone raises an objection, how do you work out what is really worrying them?
  expected_concepts:
  - asking follow-up questions
  - restating what you heard
  - separating the stated reason from the underlying one
  - not answering too early
  - checking if the concern is resolved
  rubric:
    excellent: >-
      Asks follow-ups, restates, separates stated from underlying reasons, holds back answers until understanding
      and confirms resolution.
    good: Asks questions and responds to the concern.
    weak: Responds to the first objection with arguments.
  followups:
  - Tell me about an objection that hid another.
  - How do you confirm it is resolved?
  common_errors:
  - Responds to the first objection with arguments.

- external_key: leadership.influence.follow_up_notes
  competency_key: communication
  topic: Following up after a discussion
  difficulty: easy
  text: >-
    After an important conversation where you agreed something, how do you follow up?
  expected_concepts:
  - sending a short written summary
  - listing decisions and owners
  - dates
  - inviting corrections
  - checking progress
  rubric:
    excellent: >-
      Sends a short summary with decisions, owners and dates, invites corrections and checks progress,
      and describes a case where it avoided confusion.
    good: Sends a summary of what was agreed.
    weak: Relies on memory.
  followups:
  - How soon do you send it?
  - What if people disagree with the summary?
  common_errors:
  - Relies on memory.

- external_key: leadership.influence.reliability_builds_trust
  competency_key: ownership
  topic: Building trust through consistency
  difficulty: easy
  text: >-
    How has doing what you said you would do shaped your ability to influence others?
  expected_concepts:
  - keeping small promises
  - flagging problems early
  - being clear about what you cannot do
  - consistent behaviour
  - track record
  rubric:
    excellent: >-
      Gives examples of keeping small promises, flagging early and being clear on limits and links them
      to later influence.
    good: Describes reliability with an example.
    weak: Treats influence as only about arguments.
  followups:
  - When did you have to break a commitment?
  - How did you handle that?
  common_errors:
  - Treats influence as only about arguments.

- external_key: leadership.influence.objections_list
  competency_key: problem_solving
  topic: Preparing for objections
  difficulty: medium
  text: >-
    Before presenting a proposal, how do you identify and prepare for the objections you will face?
  expected_concepts:
  - asking others to challenge the proposal
  - listing objections by stakeholder
  - preparing evidence for each
  - considering changing the proposal
  - deciding which objections to raise yourself
  rubric:
    excellent: >-
      Asks others to challenge it, lists objections by stakeholder, prepares evidence, adjusts the proposal
      and raises key objections first.
    good: Anticipates the main objections and prepares answers.
    weak: Prepares only supporting points.
  followups:
  - What objection changed the proposal?
  - Which do you raise yourself?
  common_errors:
  - Prepares only supporting points.

- external_key: leadership.influence.getting_executive_time
  competency_key: stakeholder_management
  topic: Getting time with senior leaders
  difficulty: medium
  text: >-
    You need time with a senior leader who has little of it. How do you earn the meeting and make it productive?
  expected_concepts:
  - working through an intermediary or sponsor
  - a clear one-line reason
  - sending a pre-read
  - asking for a specific decision
  - respecting the time
  rubric:
    excellent: >-
      Uses a sponsor or intermediary, gives a clear reason, sends a short pre-read, requests a specific
      decision and respects the time.
    good: Requests the meeting with a clear purpose.
    weak: Requests a general catch-up with no purpose.
  followups:
  - Who helped you?
  - What did you send beforehand?
  common_errors:
  - Requests a general catch-up with no purpose.

- external_key: leadership.influence.no_surprises
  competency_key: communication
  topic: Avoiding surprising stakeholders
  difficulty: medium
  text: >-
    How do you make sure important stakeholders are not surprised in a meeting by something you are proposing?
  expected_concepts:
  - pre-conversations
  - sharing drafts early
  - telling each what affects them
  - checking reactions
  - adapting
  rubric:
    excellent: >-
      Holds pre-conversations, shares drafts early, tells each person what affects them, checks reactions
      and adapts the proposal.
    good: Informs key people before the meeting.
    weak: Reveals the proposal in the meeting.
  followups:
  - Who did you speak to first?
  - What happened when someone was still surprised?
  common_errors:
  - Reveals the proposal in the meeting.

- external_key: leadership.influence.different_audiences_message
  competency_key: communication
  topic: Tailoring one message to different audiences
  difficulty: medium
  text: >-
    You must explain the same technical investment to engineers, finance and product leaders. How does
    your message differ?
  expected_concepts:
  - engineers care about work and quality
  - finance about cost and risk
  - product about customers and timing
  - same core facts
  - open trade-offs for each
  rubric:
    excellent: >-
      Keeps core facts consistent while tailoring emphasis to each group's concerns, includes trade-offs
      for each and shows what changed in the result.
    good: Adjusts language and emphasis.
    weak: Uses the same message for all.
  followups:
  - Which audience was hardest?
  - How do you keep messages consistent?
  common_errors:
  - Uses the same message for all.

- external_key: leadership.influence.consensus_or_consent
  competency_key: leadership
  topic: Aiming for agreement versus acceptance
  difficulty: medium
  text: >-
    When you drive a decision, how do you decide whether you need everyone to agree or just to be able
    to live with it?
  expected_concepts:
  - stakes and reversibility
  - who has to act
  - cost of delay
  - testing for consent by asking who cannot support it
  - recording objections
  rubric:
    excellent: >-
      Considers stakes, reversibility and who must act, tests for consent by asking who cannot support
      it, records objections and gives an example.
    good: Prefers consent when consensus is slow.
    weak: Always insists on full agreement or ignores objections.
  followups:
  - How do you ask for consent?
  - What did you do with a recorded objection?
  common_errors:
  - Always insists on full agreement or ignores objections.

- external_key: leadership.influence.estimate_negotiation
  competency_key: project_management
  topic: Negotiating an estimate under pressure
  difficulty: medium
  text: >-
    A stakeholder pushes you to shorten an estimate without changing scope. How do you respond?
  expected_concepts:
  - explaining what the estimate contains
  - showing which assumptions would change it
  - offering scope or staffing options
  - refusing to simply compress
  - agreeing checkpoints
  rubric:
    excellent: >-
      Explains the estimate's basis, shows assumptions, offers scope or staffing options, refuses to compress
      without a change and agrees checkpoints.
    good: Explains the estimate and discusses options.
    weak: Agrees to the shorter date or stonewalls.
  followups:
  - What options did you offer?
  - What happened to the date?
  common_errors:
  - Agreeing to a shorter date without changing scope or resources.

- external_key: leadership.influence.countering_a_narrative
  competency_key: communication
  topic: Correcting a misleading story about your team
  difficulty: medium
  text: >-
    A story is circulating that your team is slow or blocking others, and you think it is incomplete.
    What do you do?
  expected_concepts:
  - finding out the source and basis
  - checking whether any of it is true
  - sharing facts with the right people
  - fixing real issues
  - avoiding defensiveness
  rubric:
    excellent: >-
      Finds the source, checks what is true, shares facts with the right people, fixes real issues and
      avoids defensiveness.
    good: Shares facts with the people involved.
    weak: Ignores it or responds defensively.
  followups:
  - What part was true?
  - How did the narrative change?
  common_errors:
  - Ignores it or responds defensively.

- external_key: leadership.influence.speaking_up_in_leadership_forum
  competency_key: leadership
  topic: Contributing in a room of senior leaders
  difficulty: medium
  text: >-
    You are in a leadership meeting and have a concern that others may not share. How do you decide whether
    and how to speak?
  expected_concepts:
  - judging materiality
  - preparing a short clear point
  - framing around shared goals
  - asking questions
  - following up after
  rubric:
    excellent: >-
      Judges materiality, prepares a short point, frames around shared goals, uses questions and follows
      up afterward.
    good: Raises the point briefly and respectfully.
    weak: Stays silent to avoid friction or raises it unprepared.
  followups:
  - What happened when you raised something?
  - How do you choose which concerns to raise?
  common_errors:
  - Stays silent to avoid friction or raises it unprepared.

- external_key: leadership.influence.org_politics_reorg
  competency_key: adaptability
  topic: Staying effective while the organisation shifts
  difficulty: medium
  text: >-
    Your organisation is changing, and the power dynamics are unclear. How do you keep influencing outcomes
    productively?
  expected_concepts:
  - staying focused on the work and customers
  - keeping relationships across the changes
  - learning the new decision flow
  - being transparent
  - avoiding gossip
  rubric:
    excellent: >-
      Stays focused on the work, keeps relationships, learns the new decision flow, is transparent and
      avoids gossip.
    good: Continues delivering and builds new contacts.
    weak: Takes sides or disengages.
  followups:
  - What did you do first?
  - How did you learn the new flow?
  common_errors:
  - Takes sides or disengages.

- external_key: leadership.influence.supporting_someone_elses_idea
  competency_key: collaboration
  topic: Helping a good idea that is not yours succeed
  difficulty: medium
  text: Tell me about a time you used your influence to support someone else's idea.
  expected_concepts:
  - recognising merit
  - adding credibility or resources
  - letting the originator lead
  - removing blockers
  - sharing credit
  rubric:
    excellent: >-
      Recognises merit, adds credibility or resources, lets the originator lead, removes blockers and
      shares credit, with the result.
    good: Supports the idea with advice.
    weak: Reshapes the idea into their own.
  followups:
  - What did you add?
  - How did the originator respond to your help?
  common_errors:
  - Reshapes the idea into their own.

- external_key: leadership.influence.metrics_to_influence
  competency_key: problem_solving
  topic: Using metrics to move a decision
  difficulty: medium
  text: >-
    How do you choose and present a metric so that it persuades without distorting the picture?
  expected_concepts:
  - relevant to the audience's goals
  - defined clearly
  - showing trends and context
  - including limits
  - avoiding cherry-picking
  rubric:
    excellent: >-
      Chooses metrics relevant to the audience, defines them, shows trends and context, includes limits
      and avoids cherry-picking.
    good: Selects a good metric with context.
    weak: Selects numbers that only support their case.
  followups:
  - What metric backfired?
  - How do you show limits?
  common_errors:
  - Selects numbers that only support their case.

- external_key: leadership.influence.skeptical_board_bet
  competency_key: leadership
  topic: Persuading sceptics of a long-term bet
  difficulty: hard
  text: >-
    You want leadership to invest in something that will take over a year to pay off, and the audience
    is sceptical. How do you make the case?
  expected_concepts:
  - tying to strategic goals
  - staged milestones with interim value
  - costs of waiting
  - risk management
  - stop criteria
  rubric:
    excellent: >-
      Ties it to strategy, defines milestones with interim value, shows costs of waiting, manages risk
      and defines stop criteria.
    good: Presents benefits and a plan.
    weak: Relies on vision alone.
  followups:
  - What interim value did you show?
  - What were the stop criteria?
  common_errors:
  - Relies on vision alone.

- external_key: leadership.influence.two_vp_standoff
  competency_key: stakeholder_management
  topic: Two senior leaders at an impasse
  difficulty: hard
  text: >-
    Two senior leaders are at an impasse on an issue that affects your team, and neither will move. How
    do you help?
  expected_concepts:
  - understanding each position
  - neutral summary of options
  - showing costs of the impasse
  - suggesting a way to decide
  - staying neutral
  rubric:
    excellent: >-
      Understands both positions, offers a neutral options summary, shows impasse costs, suggests a decision
      process and stays neutral.
    good: Facilitates a conversation.
    weak: Picks a side or avoids it.
  followups:
  - What decision process did you suggest?
  - Did you take risk by doing this?
  common_errors:
  - Picks a side or avoids it.

- external_key: leadership.influence.auditors_and_regulators
  competency_key: communication
  topic: Working with auditors or regulators
  difficulty: hard
  text: >-
    An external auditor or regulator has concerns about how your team operates. How do you engage to reach
    a good outcome?
  expected_concepts:
  - understanding the requirement
  - evidence rather than assurances
  - a remediation plan with dates
  - transparent communication
  - fixing the underlying cause
  rubric:
    excellent: >-
      Understands the requirement, provides evidence, proposes a remediation plan with dates, communicates
      transparently and fixes the root cause.
    good: Responds to findings with a plan.
    weak: Defends current practice or hides gaps.
  followups:
  - What evidence did you give?
  - What changed in your practice?
  common_errors:
  - Defends current practice or hides gaps.

- external_key: leadership.influence.culture_of_silence
  competency_key: leadership
  topic: Changing a group where people hold back
  difficulty: hard
  text: >-
    You find that people in a group rarely raise concerns or disagree with leaders. How do you change
    that?
  expected_concepts:
  - finding out why
  - leaders asking for dissent
  - responding well to the first concerns
  - small safe channels
  - showing action on feedback
  rubric:
    excellent: >-
      Finds out why through listening, asks for dissent, responds well to early concerns, provides safe
      channels and shows action taken.
    good: Encourages people to speak.
    weak: Declares an open door and assumes it works.
  followups:
  - What did people tell you?
  - How did you respond to the first hard feedback?
  common_errors:
  - Declares an open door and assumes it works.

- external_key: leadership.influence.influence_across_leadership_changes
  competency_key: adaptability
  topic: Sustaining influence as leaders change
  difficulty: hard
  text: >-
    Your sponsor leaves and a new leader arrives with different priorities. How do you keep your work
    and credibility going?
  expected_concepts:
  - briefing the new leader
  - connecting work to their goals
  - showing results
  - building relationships
  - adjusting plans
  rubric:
    excellent: >-
      Briefs the new leader, links work to their goals, shows results, builds relationships and adjusts
      plans.
    good: Introduces the work and listens to their priorities.
    weak: Waits to be noticed.
  followups:
  - What did they care about?
  - What did you drop?
  common_errors:
  - Waits to be noticed.

- external_key: leadership.influence.resources_in_downturn
  competency_key: stakeholder_management
  topic: Arguing for investment when budgets are tight
  difficulty: hard
  text: >-
    Budgets are being cut and you need to make the case to protect an important area of work. How do you
    do it?
  expected_concepts:
  - showing risk of cutting
  - linking to revenue, cost or risk
  - offering lower-cost options
  - acknowledging constraints
  - being ready to give something up
  rubric:
    excellent: >-
      Shows risk of cutting, links to revenue, cost or risk, offers lower-cost options, acknowledges constraints
      and offers something in return.
    good: Argues the value of the area and offers a smaller option.
    weak: Argues everything is critical.
  followups:
  - What did you offer to give up?
  - How did the decision land?
  common_errors:
  - Argues everything is critical.

- external_key: leadership.influence.after_losing_the_decision
  competency_key: ownership
  topic: Continuing after your case was rejected
  difficulty: hard
  text: You made your best case and the decision went against you. What do you do next?
  expected_concepts:
  - asking what drove the decision
  - supporting implementation
  - keeping records of risks
  - watching for new evidence
  - keeping the relationship
  rubric:
    excellent: >-
      Learns what drove the decision, supports implementation, records risks, watches for new evidence
      and keeps relationships.
    good: Accepts the decision and moves on.
    weak: Undermines the decision or disengages.
  followups:
  - What did you learn about their criteria?
  - Did the issue return?
  common_errors:
  - Undermines the decision or disengages.

- external_key: leadership.influence.influencing_through_pilots_data
  competency_key: problem_solving
  topic: Letting a small result persuade for you
  difficulty: medium
  text: >-
    Describe a time you got a sceptical group to change its mind by running a small test and sharing the
    result rather than arguing.
  expected_concepts:
  - agreeing beforehand what would count as evidence
  - keeping the test cheap
  - sharing raw results openly
  - letting sceptics inspect the method
  - acting on the result either way
  rubric:
    excellent: >-
      Agrees criteria beforehand with the sceptics, runs a cheap test, shares results openly, lets them
      inspect the method and acts on the result whichever way it went.
    good: Runs a test and shares the result.
    weak: Runs a test designed to confirm their view.
  followups:
  - Who designed the test with you?
  - What if the result had gone against you?
  common_errors:
  - Choosing a test that can only confirm your own view.

- external_key: leadership.influence.cross_functional_kickoff
  competency_key: collaboration
  topic: Getting several functions aligned at the start
  difficulty: medium
  text: >-
    You are starting an initiative that needs design, engineering, legal and support to cooperate. How
    do you get them aligned in the first weeks?
  expected_concepts:
  - a short shared brief
  - each function's goals and constraints
  - agreed roles and decision rights
  - early touchpoints
  - a way to raise conflicts
  rubric:
    excellent: >-
      Writes a shared brief, gathers each function's goals and constraints, agrees roles and decision
      rights, schedules early touchpoints and sets a conflict path.
    good: Holds a kickoff and clarifies roles.
    weak: Starts building and involves other functions late.
  followups:
  - Which function was hardest to engage?
  - What did the brief contain?
  common_errors:
  - Starts building and involves other functions late.
