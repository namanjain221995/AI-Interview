# Curated questions: leadership round, driving change (part 4 of 4). Making room for change, measuring effect, exceptions, scaling pilots and competing change programmes. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.driving_change.why_people_resist_basics
  competency_key: leadership
  topic: Reasons people push back on change
  difficulty: easy
  text: >-
    From your own experience, what are the most common reasons people resist a change at work, and how
    do you respond to each?
  expected_concepts:
  - loss of control or familiar routine
  - unclear benefit
  - extra work now for benefit later
  - past changes that failed
  - real flaws in the proposal
  rubric:
    excellent: >-
      Names several distinct reasons from experience, pairs each with a specific response, and recognises
      that some resistance points to real flaws.
    good: Lists a few common reasons with general responses.
    weak: Treats resistance as stubbornness.
  followups:
  - Which reason surprised you?
  - Tell me about resistance that turned out to be right.
  common_errors:
  - Assuming all resistance is a problem with the people.

- external_key: leadership.driving_change.asking_for_help_on_change
  competency_key: collaboration
  topic: Recruiting help for a change
  difficulty: easy
  text: >-
    When you take on a change that is bigger than you can do alone, who do you ask for help and how?
  expected_concepts:
  - identifying skills and reach needed
  - asking specifically with clear scope
  - offering something in return
  - thanking and reporting back
  - accepting different ways of doing it
  rubric:
    excellent: >-
      Identifies needed skills and reach, makes a specific bounded request, offers value in return, and
      reports back on the outcome.
    good: Asks colleagues for help with a reasonable request.
    weak: Tries to do everything alone or asks vaguely.
  followups:
  - Who said no and why?
  - What did you offer?
  common_errors:
  - Tries to do everything alone or asks vaguely.

- external_key: leadership.driving_change.stakeholder_map_for_change
  competency_key: stakeholder_management
  topic: Mapping who is affected
  difficulty: easy
  text: >-
    Before starting a change, how do you work out who will be affected and who can help or block it?
  expected_concepts:
  - listing groups by impact and influence
  - including less obvious groups like support
  - talking to a few of them early
  - keeping the map updated
  rubric:
    excellent: >-
      Maps groups by impact and influence including less visible ones, talks to some early, and updates
      the map; gives an example where it prevented a surprise.
    good: Lists main stakeholders and talks to them.
    weak: Considers only the team making the change.
  followups:
  - Which group did you nearly miss?
  - How often do you update the map?
  common_errors:
  - Considers only the team making the change.

- external_key: leadership.driving_change.what_to_change_first
  competency_key: project_management
  topic: Choosing the first step of a change
  difficulty: easy
  text: >-
    When there are many things you could improve, how do you decide what to change first?
  expected_concepts:
  - impact on the problem
  - effort and risk
  - early learning value
  - dependencies
  - willingness of the group
  rubric:
    excellent: >-
      Weighs impact, effort, risk, learning value and dependencies, picks a starting point that builds
      momentum, and explains with an example.
    good: Picks a sensible starting point using impact and effort.
    weak: Starts with whatever is most visible or easiest regardless of value.
  followups:
  - What did you leave until later?
  - How did you decide it was the right first step?
  common_errors:
  - Starts with whatever is most visible or easiest regardless of value.

- external_key: leadership.driving_change.small_change_big_effect
  competency_key: ownership
  topic: A small change with outsized results
  difficulty: easy
  text: >-
    Tell me about a small change you made that had a bigger effect than you expected. What did you learn
    from it?
  expected_concepts:
  - identifying the leverage point
  - measuring the before and after
  - sharing the result
  - applying the lesson elsewhere
  rubric:
    excellent: >-
      Describes a clear leverage point, measured effect, how it was shared, and how the lesson was applied
      elsewhere.
    good: Describes the change and its effect.
    weak: Gives a vague example with no measured effect.
  followups:
  - How did you measure it?
  - Where else did you apply it?
  common_errors:
  - Gives a vague example with no measured effect.

- external_key: leadership.driving_change.change_in_quarter_plan
  competency_key: project_management
  topic: Finding space for change work in a delivery plan
  difficulty: medium
  text: >-
    Your quarter is full of feature commitments, but you also need to make progress on an important improvement.
    How do you make room?
  expected_concepts:
  - sizing the change work
  - protecting a fixed share of capacity
  - linking improvement to delivery outcomes
  - negotiating with product
  - making the trade-off visible
  rubric:
    excellent: >-
      Sizes the work, protects a stable share of capacity, links it to delivery benefits, negotiates with
      product and makes the trade-off visible.
    good: Reserves some time and discusses with product.
    weak: Does it on the side or never.
  followups:
  - What share did you protect?
  - How did you respond when a deadline hit?
  common_errors:
  - Doing improvement work only when features slow down.

- external_key: leadership.driving_change.unclear_benefit_change
  competency_key: stakeholder_management
  topic: Proposing a change whose benefit is hard to prove
  difficulty: medium
  text: >-
    You believe a change is worthwhile but the benefit is hard to measure up front. How do you make the
    case?
  expected_concepts:
  - stating the problem with whatever evidence exists
  - using proxy measures
  - proposing a trial with criteria
  - naming risks
  - agreeing a review date
  rubric:
    excellent: >-
      States the problem with available evidence, proposes proxy measures and a trial with criteria, names
      risks and agrees a review date.
    good: Makes a reasoned case and proposes a trial.
    weak: Relies on belief or abandons the idea for lack of proof.
  followups:
  - Which proxy did you choose?
  - What happened at the review?
  common_errors:
  - Relies on belief or abandons the idea for lack of proof.

- external_key: leadership.driving_change.tech_debt_campaign
  competency_key: ownership
  topic: Running a campaign to reduce technical debt
  difficulty: medium
  text: >-
    Describe a time you drove a concerted effort to pay down technical debt. How did you pick the targets
    and maintain support?
  expected_concepts:
  - tying debt to delivery pain with evidence
  - choosing a few high-impact targets
  - fixed time allocation
  - reporting visible results
  - stopping when returns diminish
  rubric:
    excellent: >-
      Ties debt to evidence of delivery pain, selects a few targets, sets a time allocation, reports visible
      results and stops when returns fall.
    good: Prioritises debt and gets time for it.
    weak: Argues for a large clean-up without evidence.
  followups:
  - What was the measurable result?
  - How did you stop it growing?
  common_errors:
  - Argues for a large clean-up without evidence.

- external_key: leadership.driving_change.change_leader_leaves
  competency_key: adaptability
  topic: The person driving the change leaves
  difficulty: medium
  text: >-
    The person who was driving an important change leaves, and you inherit it. How do you decide how to
    proceed?
  expected_concepts:
  - reading the history and decisions
  - talking to the people involved
  - checking whether the goal still holds
  - making a clear plan and owner
  - telling stakeholders
  rubric:
    excellent: >-
      Reviews history, talks to people, checks the goal, sets a plan and owner, and tells stakeholders
      where things stand.
    good: Takes over and continues with some review.
    weak: Continues blindly or drops it without discussion.
  followups:
  - What did you discover?
  - What did you change?
  common_errors:
  - Continues blindly or drops it without discussion.

- external_key: leadership.driving_change.measuring_productivity_change
  competency_key: project_management
  topic: Judging whether a process change helped delivery
  difficulty: medium
  text: >-
    You changed how your team plans or releases work. How do you work out whether the change made things
    better?
  expected_concepts:
  - baseline before the change
  - a few relevant measures
  - qualitative input
  - allowing time for the change to settle
  - avoiding gaming of metrics
  rubric:
    excellent: >-
      Takes a baseline, chooses a few relevant measures, adds qualitative input, allows time to settle
      and watches for gaming.
    good: Compares before and after with some measures.
    weak: Judges by impression alone.
  followups:
  - Which measure was misleading?
  - How long did you wait?
  common_errors:
  - Judges by impression alone.

- external_key: leadership.driving_change.internal_tool_replacement
  competency_key: stakeholder_management
  topic: Replacing an internal tool people built habits around
  difficulty: medium
  text: >-
    You need to replace an internal tool that many people use daily and have learned to work around. How
    do you manage the switch?
  expected_concepts:
  - documenting what the old tool does well
  - involving heavy users in design
  - feature parity for critical flows
  - a migration window
  - support at launch
  rubric:
    excellent: >-
      Documents what the old tool does well, involves heavy users, ensures parity for critical flows,
      plans a migration window and gives launch support.
    good: Builds a replacement with user input and a transition.
    weak: Replaces the tool without involving users.
  followups:
  - What was missing at launch?
  - How did you handle heavy users?
  common_errors:
  - Replaces the tool without involving users.

- external_key: leadership.driving_change.external_dependency_change
  competency_key: project_management
  topic: A change that depends on another organisation
  difficulty: medium
  text: >-
    A change you are driving needs action from a team or vendor outside your control. How do you move
    it forward?
  expected_concepts:
  - making the request specific and showing why it matters to them
  - agreeing dates
  - building a fallback
  - regular touchpoints
  - escalating with evidence
  rubric:
    excellent: >-
      Makes a specific request tied to their interests, agrees dates, builds a fallback, keeps regular
      touchpoints and escalates with evidence.
    good: Asks clearly and follows up.
    weak: Waits for the other party or escalates immediately.
  followups:
  - What did you offer them?
  - When did you escalate?
  common_errors:
  - Waits for the other party or escalates immediately.

- external_key: leadership.driving_change.users_push_back
  competency_key: communication
  topic: Customers or users unhappy with a change
  difficulty: medium
  text: >-
    A change you drove is unpopular with the people who use the result. How do you respond?
  expected_concepts:
  - listening to concrete complaints
  - separating real defects from adjustment pain
  - fixing fast where possible
  - explaining reasons
  - revisiting the decision if warranted
  rubric:
    excellent: >-
      Listens to specifics, separates defects from adjustment pain, fixes quickly, explains reasons and
      is willing to revisit.
    good: Listens and addresses some concerns.
    weak: Dismisses complaints or reverses at the first complaint.
  followups:
  - What did you fix?
  - What did you keep?
  common_errors:
  - Dismisses complaints or reverses at the first complaint.

- external_key: leadership.driving_change.persuade_or_enforce
  competency_key: leadership
  topic: When to enforce and when to persuade
  difficulty: medium
  text: >-
    How do you decide when a change should be enforced by policy or tooling and when it should rely on
    persuasion?
  expected_concepts:
  - risk of non-adoption
  - number of affected groups
  - cost of exceptions
  - whether trust exists
  - staged approach from encouragement to enforcement
  rubric:
    excellent: >-
      Considers risk, scale, exceptions and trust, and uses a staged path from encouragement to enforcement
      with an example.
    good: Explains a reasonable preference and example.
    weak: Always enforces or never does.
  followups:
  - When did you move from persuasion to enforcement?
  - How did people respond?
  common_errors:
  - Always enforces or never does.

- external_key: leadership.driving_change.exceptions_policy
  competency_key: stakeholder_management
  topic: Handling requests for exemptions
  difficulty: medium
  text: >-
    Several teams ask for exemptions from a change you're driving. How do you handle these?
  expected_concepts:
  - understanding the reason
  - clear criteria
  - time-limited exceptions
  - recording them
  - helping teams close the gap
  rubric:
    excellent: >-
      Understands the reasons, applies clear criteria, grants time-limited exceptions, records them and
      helps teams close the gap.
    good: Reviews requests and grants some.
    weak: Grants all or none.
  followups:
  - What criteria did you use?
  - How did you track them?
  common_errors:
  - Grants all or none.

- external_key: leadership.driving_change.agile_transformation
  competency_key: leadership
  topic: Moving an organisation to new ways of working
  difficulty: hard
  text: >-
    Tell me about leading, or how you would lead, a large shift in how several teams plan and deliver
    work. How do you keep it practical and not ceremonial?
  expected_concepts:
  - clear problem to solve
  - starting with willing teams
  - adapting practices to context
  - coaching rather than mandating
  - measuring outcomes not ceremonies
  rubric:
    excellent: >-
      Starts with a problem, begins with willing teams, adapts practices, coaches, and measures outcomes
      rather than ceremonies.
    good: Introduces practices with coaching and measures.
    weak: Rolls out a framework wholesale.
  followups:
  - How did you adapt practices?
  - What did you drop?
  common_errors:
  - Rolls out a framework wholesale.

- external_key: leadership.driving_change.new_leadership_old_change
  competency_key: adaptability
  topic: Continuing a change after leadership changes
  difficulty: hard
  text: >-
    A new senior leader arrives and questions a change you have been driving for months. How do you respond?
  expected_concepts:
  - understanding their perspective
  - presenting evidence and progress
  - being open to adjusting
  - seeking their input
  - aligning on goals
  rubric:
    excellent: >-
      Seeks their view, presents evidence and progress, is open to adjustment, and aligns on goals with
      a clear next step.
    good: Explains the change and listens.
    weak: Defends the change defensively or abandons it.
  followups:
  - What did they challenge?
  - What did you adjust?
  common_errors:
  - Defends the change defensively or abandons it.

- external_key: leadership.driving_change.stop_change_midway
  competency_key: ownership
  topic: Deciding to stop a change that is half done
  difficulty: hard
  text: >-
    You are halfway through a change and the costs now look larger than expected. How do you decide whether
    to continue, adjust or stop?
  expected_concepts:
  - re-estimating remaining cost and benefit
  - considering sunk costs
  - looking at partial states that are worse than either end
  - consulting the sponsor and team
  - communicating the decision
  rubric:
    excellent: >-
      Re-estimates remaining cost and benefit, ignores sunk costs, checks whether the half-finished state
      is stable, consults people and communicates.
    good: Reassesses and decides with consultation.
    weak: Continues to avoid admitting the cost.
  followups:
  - Is a half-finished state acceptable?
  - How did you tell the team?
  common_errors:
  - Continues to avoid admitting the cost.

- external_key: leadership.driving_change.roi_of_change_report
  competency_key: communication
  topic: Showing leaders the value of a completed change
  difficulty: hard
  text: >-
    How do you demonstrate the value of a completed change to senior leaders when benefits are spread
    across many teams?
  expected_concepts:
  - baseline and attribution
  - combining hard numbers with stories
  - agreeing metrics with beneficiaries
  - reporting costs too
  - being clear about uncertainty
  rubric:
    excellent: >-
      Uses baseline and sensible attribution, combines numbers with stories, agrees metrics with beneficiaries,
      reports costs and states uncertainty.
    good: Shares metrics and examples.
    weak: Claims benefits without a baseline.
  followups:
  - How did you attribute improvement?
  - What was left out?
  common_errors:
  - Claims benefits without a baseline.

- external_key: leadership.driving_change.change_critical_system
  competency_key: project_management
  topic: Changing a system that cannot go down
  difficulty: hard
  text: >-
    You must make a significant change to a system that the business cannot afford to have down. How do
    you plan and drive it?
  expected_concepts:
  - staged rollout with checks
  - dark launch or parallel run
  - rollback tested in advance
  - change freeze windows
  - clear communication and on-call readiness
  rubric:
    excellent: >-
      Plans staged rollout with checks, parallel running, tested rollback, scheduling around business
      peaks and prepared on-call.
    good: Plans staging and rollback.
    weak: Plans a single change window without tested rollback.
  followups:
  - What did you test beforehand?
  - What was the abort criterion?
  common_errors:
  - Plans a single change window without tested rollback.

- external_key: leadership.driving_change.pilot_does_not_scale
  competency_key: problem_solving
  topic: A pilot that worked but failed to scale
  difficulty: hard
  text: >-
    A pilot succeeded with one team, but the change struggled when extended to others. How do you work
    out why and what to do?
  expected_concepts:
  - comparing conditions between teams
  - hidden support the pilot team received
  - adapting the change for different contexts
  - scaling in steps
  - admitting what the pilot didn't prove
  rubric:
    excellent: >-
      Compares conditions, finds hidden support, adapts for contexts, scales in steps and states what
      the pilot did not prove.
    good: Investigates differences and adjusts.
    weak: Blames the new teams.
  followups:
  - What support did the pilot team have?
  - What did you adapt?
  common_errors:
  - Blames the new teams.

- external_key: leadership.driving_change.competing_changes_org
  competency_key: stakeholder_management
  topic: Two change programmes pulling teams apart
  difficulty: hard
  text: >-
    Two different change programmes from different parts of the organisation are asking the same teams
    to change at once. How do you handle it?
  expected_concepts:
  - surfacing the overlap
  - bringing programme owners together
  - agreeing sequence or merging
  - protecting teams from conflicting asks
  - escalating for a decision
  rubric:
    excellent: >-
      Surfaces the overlap, brings owners together, agrees a sequence or merger, protects teams and escalates
      for a decision if needed.
    good: Talks to the owners and sets an order.
    weak: Lets teams cope or competes for priority.
  followups:
  - Who decided the order?
  - What did the teams need to hear?
  common_errors:
  - Lets teams cope or competes for priority.

- external_key: leadership.driving_change.hackathon_to_adoption
  competency_key: leadership
  topic: Turning an experiment into everyday practice
  difficulty: medium
  text: >-
    A grassroots experiment or hackathon project showed promise. How do you turn it into something the
    organisation adopts properly?
  expected_concepts:
  - finding the real need behind it
  - giving it an owner and time
  - hardening and supporting it
  - engaging the groups who would use it
  - deciding when it is ready to scale
  rubric:
    excellent: >-
      Validates the need, gives the project an owner and time, hardens and supports it, engages future
      users and sets criteria for scaling.
    good: Finds a sponsor and plans adoption.
    weak: Leaves it as a demo or forces it on teams.
  followups:
  - Who owned it afterwards?
  - What did you have to rebuild?
  common_errors:
  - Leaves it as a demo or forces it on teams.

- external_key: leadership.driving_change.onboarding_to_new_way
  competency_key: mentoring
  topic: Making sure new joiners learn the new way
  difficulty: medium
  text: >-
    A change has been in place for some months, and new hires keep slipping back to old habits they bring
    from elsewhere. How do you handle that?
  expected_concepts:
  - including the new way in onboarding
  - explaining the reasons
  - pairing with someone who uses it
  - checking assumptions that it fits
  - listening for improvements newcomers suggest
  rubric:
    excellent: >-
      Builds the new way into onboarding with reasons, pairs newcomers, and listens to their view for
      possible improvements to the change.
    good: Explains the practice at onboarding.
    weak: Expects newcomers to pick it up by osmosis.
  followups:
  - What did newcomers teach you?
  - What do you put in week one?
  common_errors:
  - Expects newcomers to pick it up by osmosis.

- external_key: leadership.driving_change.change_scope_trimming
  competency_key: project_management
  topic: Cutting a change down to what matters
  difficulty: medium
  text: >-
    A change you proposed has grown in scope and is now too heavy for people to absorb. How do you trim
    it?
  expected_concepts:
  - restating the original problem
  - ranking components by value
  - removing or deferring the rest
  - talking to those affected
  - keeping a record of deferred items
  rubric:
    excellent: >-
      Restates the problem, ranks by value, defers the rest with a record, and checks the trimmed version
      with those affected.
    good: Reduces scope with sensible priorities.
    weak: Keeps everything or cuts without discussion.
  followups:
  - What did you defer?
  - How did you decide the cut line?
  common_errors:
  - Keeps everything or cuts without discussion.
