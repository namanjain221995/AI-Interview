# Curated questions: leadership round, mentoring (part 3 of 4).
# Focus: mentoring and growing engineers, delegation, and creating leaders. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.mentoring.explaining_the_why
  competency_key: mentoring
  topic: Explaining reasons behind decisions
  difficulty: easy
  text: >-
    Tell me about a decision you made that a junior colleague did not understand. How did you help them see the reasoning?
  expected_concepts:
  - noticing the confusion
  - laying out options considered
  - sharing the constraints and trade-offs
  - inviting challenge
  - checking it landed
  rubric:
    excellent: >-
      Shows how they opened up the decision, explained options and trade-offs, welcomed disagreement, and checked understanding,
      with a lasting effect on the person's judgment.
    good: Explains the decision clearly but does not invite their view.
    weak: Says the decision was made and expects it to be followed.
  followups:
  - Did they ever change your mind?
  - How do you teach judgment rather than rules?
  common_errors:
  - >-
    Answering in the weak pattern: says the decision was made and expects it to be followed

- external_key: leadership.mentoring.recognising_potential
  competency_key: mentoring
  topic: Spotting someone's potential
  difficulty: easy
  text: >-
    How do you notice that someone on your team has potential for more responsibility, and what do you do about it?
  expected_concepts:
  - signals such as initiative and ownership
  - looking beyond the loudest voices
  - offering a small stretch
  - watching how they respond
  - discussing it with them
  rubric:
    excellent: >-
      Names observable signals, describes checking beyond visibility, offers a bounded stretch, and shows how the person developed.
    good: Notices good signals and gives some opportunity.
    weak: Relies on gut feel or only promotes whoever speaks up most.
  followups:
  - How do you avoid favouring the most visible people?
  - What if the person is not interested?
  common_errors:
  - >-
    Answering in the weak pattern: relies on gut feel or only promotes whoever speaks up most

- external_key: leadership.mentoring.learning_from_a_mentor
  competency_key: mentoring
  topic: A mentor who changed you
  difficulty: easy
  text: >-
    Tell me about someone who mentored you well. What did they do that you now copy when you help others?
  expected_concepts:
  - specific behaviours of the mentor
  - what changed in their own work
  - how they adapted it to their own style
  - limits of the approach
  - passing it on
  rubric:
    excellent: >-
      Names concrete behaviours, links them to changes in their own practice, and shows they adapted rather than copied them.
    good: Describes a good mentor and one or two behaviours adopted.
    weak: Gives a generic description of admiring someone.
  followups:
  - What did they do that you decided not to copy?
  - Where have you used it most recently?
  common_errors:
  - 'Answering in the weak pattern: gives a generic description of admiring someone'

- external_key: leadership.mentoring.pace_of_learning
  competency_key: mentoring
  topic: Mentoring people who learn at different speeds
  difficulty: easy
  text: >-
    How do you adjust your mentoring when two people on your team learn at very different paces?
  expected_concepts:
  - understanding each person's starting point
  - different tasks and support levels
  - avoiding comparisons
  - clear expectations for both
  - checking in on confidence
  rubric:
    excellent: >-
      Describes tailoring support and challenge per person without comparing them, keeps shared standards, and gives an example.
    good: Adjusts support sensibly but with little thought to standards.
    weak: Uses one approach for everyone or compares them against each other.
  followups:
  - How do you keep the faster learner engaged?
  - What do you do if the slower learner loses confidence?
  common_errors:
  - >-
    Answering in the weak pattern: uses one approach for everyone or compares them against each other

- external_key: leadership.mentoring.small_stretch_assignment
  competency_key: mentoring
  topic: Choosing a stretch assignment
  difficulty: easy
  text: >-
    Describe a stretch assignment you gave someone. How did you pick it, and how did you make sure it was safe to fail?
  expected_concepts:
  - matching the task to their growth goal
  - limiting the blast radius
  - agreeing support available
  - defining success up front
  - debriefing afterwards
  rubric:
    excellent: >-
      Explains the choice, the limited risk, the support offered, the success criteria and a reflective debrief, with a clear
      result.
    good: Gives a reasonable stretch with some safeguards.
    weak: Hands a hard task with no support or safety net.
  followups:
  - What would a failure have looked like?
  - What did they learn that surprised you?
  common_errors:
  - 'Answering in the weak pattern: hands a hard task with no support or safety net'

- external_key: leadership.mentoring.recognising_quiet_contributors
  competency_key: mentoring
  topic: Making quiet work visible
  difficulty: medium
  text: >-
    Tell me how you make sure the contributions of people who don't promote themselves are noticed and rewarded.
  expected_concepts:
  - tracking contributions yourself
  - asking for input from many
  - encouraging write-ups and demos
  - speaking up for the work
  - checking review outcomes for patterns
  rubric:
    excellent: >-
      Describes deliberate tracking, mechanisms to surface work, advocacy at calibration, and a concrete example.
    good: Aware of the issue and does some advocacy.
    weak: Relies on people to speak for themselves.
  followups:
  - How do you do this without embarrassing the person?
  - How do you check you are not missing people?
  common_errors:
  - 'Answering in the weak pattern: relies on people to speak for themselves'

- external_key: leadership.mentoring.teaching_debugging_skills
  competency_key: mentoring
  topic: Teaching debugging method
  difficulty: medium
  text: >-
    Describe how you've taught someone a systematic way to debug rather than guessing.
  expected_concepts:
  - forming hypotheses
  - narrowing the search space
  - reading evidence before changing code
  - keeping notes
  - reviewing a solved bug afterwards
  rubric:
    excellent: >-
      Walks through a specific method taught by example, shows reflection after a real bug, and describes improved behaviour.
    good: Shares tips with some demonstration.
    weak: Fixes the bug for them.
  followups:
  - What was their old habit?
  - How did you reinforce the new habit?
  common_errors:
  - 'Answering in the weak pattern: fixes the bug for them'

- external_key: leadership.mentoring.sharing_credit
  competency_key: leadership
  topic: Giving credit to others
  difficulty: medium
  text: >-
    Give me an example of when you stepped back so someone else could take visible credit for work they did, even though you
    had helped a lot.
  expected_concepts:
  - why visibility mattered to them
  - preparing them to present
  - being clear on contributions
  - sitting back in meetings
  - the effect on their standing
  rubric:
    excellent: >-
      Chooses to give visibility with preparation, stays out of the way, and shows a tangible effect on the person's growth
      or recognition.
    good: Acknowledges others publicly in a meaningful way.
    weak: Takes the credit or gives token mentions.
  followups:
  - What was hard about it?
  - What did you do when stakeholders still asked for you?
  common_errors:
  - 'Answering in the weak pattern: takes the credit or gives token mentions'

- external_key: leadership.mentoring.mentee_overwhelmed_workload
  competency_key: mentoring
  topic: A mentee overloaded with work
  difficulty: medium
  text: >-
    A person you mentor tells you they feel overloaded and are starting to miss deadlines. What do you do?
  expected_concepts:
  - listening first
  - looking at the actual workload and priorities
  - removing or renegotiating work
  - teaching how to say no
  - follow-up on recovery
  rubric:
    excellent: >-
      Reviews workload facts, acts to reduce or reprioritise, teaches prioritisation and saying no, and checks in over weeks.
    good: Helps rebalance and offers support.
    weak: Tells them to work through it.
  followups:
  - What if the workload cannot be reduced?
  - How do you spot this before they tell you?
  common_errors:
  - 'Answering in the weak pattern: tells them to work through it'

- external_key: leadership.mentoring.documenting_decisions_for_learning
  competency_key: mentoring
  topic: Learning from decisions
  difficulty: medium
  text: >-
    How do you use past decisions, including your own bad ones, as teaching material for your team?
  expected_concepts:
  - short decision records
  - sharing reasoning and what was missed
  - blameless framing
  - discussing in reviews
  - revisiting outcomes
  rubric:
    excellent: >-
      Uses decision records and openly shares mistakes in a blameless way, with an example where it changed a later decision.
    good: Shares experiences and some lessons.
    weak: Only shares successes.
  followups:
  - Which of your decisions have you shared?
  - How do people react when you share errors?
  common_errors:
  - 'Answering in the weak pattern: only shares successes'

- external_key: leadership.mentoring.building_confidence
  competency_key: mentoring
  topic: Building confidence in a hesitant engineer
  difficulty: medium
  text: >-
    How do you help an engineer who is clearly capable but hesitates to take on larger responsibilities?
  expected_concepts:
  - small steps that build evidence
  - pointing to specific past achievements
  - being present in early attempts
  - asking what is holding them back
  - avoiding pushing them too fast
  rubric:
    excellent: >-
      Plans graduated steps with real evidence, offers support, explores the reasons openly, and shows increased responsibility
      taken.
    good: Encourages and creates opportunities.
    weak: Pushes them into large tasks or tells them to just try harder.
  followups:
  - What if they want to stay where they are?
  - What did the first step look like?
  common_errors:
  - >-
    Answering in the weak pattern: pushes them into large tasks or tells them to just try harder

- external_key: leadership.mentoring.teaching_prioritisation
  competency_key: mentoring
  topic: Teaching prioritisation
  difficulty: medium
  text: Tell me about teaching someone to prioritise when everything seems urgent.
  expected_concepts:
  - clarifying impact and deadlines
  - separating urgent from important
  - asking stakeholders when unsure
  - limiting work in progress
  - reviewing their choices after
  rubric:
    excellent: >-
      Shares a practical framework, walks through real priorities, encourages stakeholder questions, and reviews outcomes
      with them.
    good: Gives sound guidance with an example.
    weak: Tells them to do everything faster.
  followups:
  - What did you do when two managers gave conflicting priorities?
  - How did you make this a habit?
  common_errors:
  - 'Answering in the weak pattern: tells them to do everything faster'

- external_key: leadership.mentoring.mentor_peer_conflict
  competency_key: leadership
  topic: When mentoring causes friction
  difficulty: medium
  text: >-
    Describe a time that your support for one team member caused tension with another. How did you handle it?
  expected_concepts:
  - recognising the perception of favouritism
  - transparent reasons for time allocation
  - talking to the person who felt left out
  - changing the approach
  - keeping standards shared
  rubric:
    excellent: >-
      Notices the issue, explains openly, adjusts to ensure fairness, and restores trust.
    good: Resolves the tension with a conversation.
    weak: Dismisses the concern.
  followups:
  - How did you find out?
  - What did you change in how you allocate time?
  common_errors:
  - 'Answering in the weak pattern: dismisses the concern'

- external_key: leadership.mentoring.coaching_through_a_hard_project
  competency_key: mentoring
  topic: Supporting someone on a high-pressure project
  difficulty: medium
  text: >-
    How do you support an inexperienced engineer who has been given a high-visibility project with tight timing?
  expected_concepts:
  - breaking the work into milestones
  - regular check-ins
  - protecting them from extra requests
  - agreeing when to escalate
  - allowing them to present the work
  rubric:
    excellent: >-
      Builds milestones and checkpoints, shields and supports without taking over, agrees escalation points, and lets the
      person own the result.
    good: Offers support and checkpoints.
    weak: Takes over the project or leaves them alone.
  followups:
  - When did you step in?
  - How did you know they were coping?
  common_errors:
  - 'Answering in the weak pattern: takes over the project or leaves them alone'

- external_key: leadership.mentoring.coaching_manager_to_be
  competency_key: people_management
  topic: Preparing a first-time manager
  difficulty: medium
  text: >-
    A strong engineer is about to become a first-time manager. How do you help them prepare for the change?
  expected_concepts:
  - the role is different from engineering
  - handing over technical work
  - learning feedback and one-to-one skills
  - setting expectations on time
  - regular coaching in the first months
  rubric:
    excellent: >-
      Explains the shift in work, prepares practical skills, supports the transition, and has an agreement to review the move
      after some months.
    good: Provides advice and support.
    weak: Assumes technical excellence transfers directly.
  followups:
  - What mistakes do new managers commonly make?
  - How would you handle it if they decide it is not for them?
  common_errors:
  - 'Answering in the weak pattern: assumes technical excellence transfers directly'

- external_key: leadership.mentoring.measured_risk_of_delegating_critical_work
  competency_key: leadership
  topic: Delegating something high-stakes
  difficulty: medium
  text: >-
    What would make you comfortable delegating something critical, and how do you keep a safety net in place without undermining
    the person?
  expected_concepts:
  - assessing capability with evidence
  - clarity on outcome and decision rights
  - visible checkpoints
  - a fallback plan
  - trust expressed openly
  rubric:
    excellent: >-
      Bases delegation on evidence, states the safety net openly, keeps decision rights clear and gives an example.
    good: Delegates with moderate safeguards.
    weak: Refuses to delegate critical work.
  followups:
  - How do you tell them about the safety net?
  - Has the safety net ever been used?
  common_errors:
  - 'Answering in the weak pattern: refuses to delegate critical work'

- external_key: leadership.mentoring.mentoring_decision_review_junior
  competency_key: mentoring
  topic: Reviewing a junior's technical decision
  difficulty: medium
  text: >-
    A junior engineer proposes a technical approach you think is weaker than an alternative. How do you handle the conversation
    so they learn from it?
  expected_concepts:
  - asking about their reasoning first
  - naming trade-offs of both options
  - letting low-risk choices stand
  - agreeing an evaluation point
  - avoiding overriding by status
  rubric:
    excellent: >-
      Explores their reasoning, compares trade-offs openly, lets low-risk decisions stand with a review point, and overrides
      only when risk is high with clear explanation.
    good: Discusses alternatives respectfully and guides toward a decision.
    weak: Tells them to use the alternative without discussion.
  followups:
  - What if the risk is high?
  - Have they ever turned out to be right?
  common_errors:
  - >-
    Answering in the weak pattern: tells them to use the alternative without discussion

- external_key: leadership.mentoring.coaching_on_conflict
  competency_key: mentoring
  topic: Coaching someone through a disagreement with a peer
  difficulty: medium
  text: >-
    A person you mentor is in conflict with a colleague and asks for your advice. What do you do?
  expected_concepts:
  - listening to their account
  - asking about the colleague's view
  - practising the conversation
  - encouraging direct discussion
  - staying out unless needed
  - following up
  rubric:
    excellent: >-
      Helps the person see both sides, rehearses a direct conversation, avoids taking over, and follows up on the result.
    good: Gives sensible advice and encourages direct talk.
    weak: Takes sides or intervenes immediately.
  followups:
  - When would you step in?
  - What happened after they spoke?
  common_errors:
  - 'Answering in the weak pattern: takes sides or intervenes immediately'

- external_key: leadership.mentoring.coaching_toward_a_different_role
  competency_key: people_management
  topic: Helping someone find a better-fit role
  difficulty: hard
  text: >-
    You realise an engineer on your team would do better in a different role, perhaps outside engineering. How do you raise
    this and help them?
  expected_concepts:
  - basing the view on their strengths and interests
  - asking what they want
  - offering options and exploration
  - being clear it is not a demotion or exit
  - supporting a transition
  - protecting their standing
  rubric:
    excellent: >-
      Frames it around strengths and the person's wishes, offers exploration, keeps the person's standing, and helps them
      move with success.
    good: Talks it through and supports the move.
    weak: Pushes them out or says it as a criticism.
  followups:
  - How would they know it was an opportunity?
  - What if they say no?
  common_errors:
  - 'Answering in the weak pattern: pushes them out or says it as a criticism'

- external_key: leadership.mentoring.mentor_credit_conflict
  competency_key: leadership
  topic: A mentee's work attributed to you
  difficulty: hard
  text: >-
    Your own manager praised you for work that in fact a person you mentored did. What do you do?
  expected_concepts:
  - correcting attribution promptly
  - explaining the real contribution
  - preparing the person to present
  - thinking about why it happened
  - keeping a habit of sharing credit
  rubric:
    excellent: >-
      Corrects the record quickly and clearly, builds visibility for the person, and examines how to avoid repeats.
    good: Corrects it when the chance arises.
    weak: Stays silent or accepts the praise.
  followups:
  - How did your manager react?
  - How did the mentee feel?
  common_errors:
  - 'Answering in the weak pattern: stays silent or accepts the praise'

- external_key: leadership.mentoring.mentoring_failure_review
  competency_key: mentoring
  topic: Your biggest mentoring mistake
  difficulty: hard
  text: >-
    What's the biggest mistake you've made as a mentor or delegator, and how has it changed what you do?
  expected_concepts:
  - specific facts of the situation
  - their share of responsibility
  - effect on the person
  - repair attempted
  - lasting change in practice
  rubric:
    excellent: >-
      Names a real mistake with their share, describes the effect on the person, the repair, and a concrete lasting change.
    good: Describes a real mistake with some learning.
    weak: Gives a trivial or disguised-strength answer.
  followups:
  - Did you talk to the person afterwards?
  - Where do you still struggle?
  common_errors:
  - 'Answering in the weak pattern: gives a trivial or disguised-strength answer'

- external_key: leadership.mentoring.mentee_ambition_vs_team_need
  competency_key: leadership
  topic: Conflict between growth wishes and team needs
  difficulty: hard
  text: >-
    A person you mentor wants to work on a new technology, but the team needs them on maintenance work for the next year.
    How do you resolve this?
  expected_concepts:
  - understanding the motivation
  - looking for ways to blend learning into the existing work
  - negotiating a timeline
  - being candid about constraints
  - protecting the relationship
  - considering internal moves
  rubric:
    excellent: >-
      Explores options such as part-time projects and rotation, is open about constraints, agrees a timeline, and the person
      stays engaged.
    good: Finds a partial compromise.
    weak: Dismisses the interest or promises what cannot be delivered.
  followups:
  - What if they leave?
  - What did you actually offer them?
  common_errors:
  - >-
    Answering in the weak pattern: dismisses the interest or promises what cannot be delivered

- external_key: leadership.mentoring.calibrating_standards_across_mentees
  competency_key: mentoring
  topic: Holding a consistent bar
  difficulty: hard
  text: >-
    How do you keep your expectations consistent across the people you develop while still treating each as an individual?
  expected_concepts:
  - shared written criteria
  - different routes to the same standard
  - checking own bias
  - discussing with peers
  - explaining decisions to people
  rubric:
    excellent: >-
      Uses written criteria and calibration with peers, adjusts support but not standards, checks for bias, and explains decisions
      transparently.
    good: Understands the balance with examples.
    weak: Treats everyone identically or varies standards by familiarity.
  followups:
  - Where did you discover you were inconsistent?
  - How do you check?
  common_errors:
  - >-
    Answering in the weak pattern: treats everyone identically or varies standards by familiarity

- external_key: leadership.mentoring.helping_someone_after_public_failure
  competency_key: mentoring
  topic: After a very visible failure
  difficulty: hard
  text: >-
    A person you mentor presented a project that failed badly in front of senior leaders. How do you help them recover and
    learn?
  expected_concepts:
  - immediate support and perspective
  - reviewing what happened facts first
  - separating system issues from personal ones
  - helping repair relationships
  - advocating with leaders
  - gradual return to visible work
  rubric:
    excellent: >-
      Supports first, reviews facts blamelessly, advocates for the person, rebuilds their confidence in stages, and the person
      returns stronger.
    good: Supports the person and reviews lessons.
    weak: Distances themselves or heaps blame.
  followups:
  - What did you say to the leaders?
  - How long did recovery take?
  common_errors:
  - 'Answering in the weak pattern: distances themselves or heaps blame'

- external_key: leadership.mentoring.delegation_of_unpopular_work
  competency_key: leadership
  topic: Distributing undesirable work fairly
  difficulty: hard
  text: >-
    Every team has unglamorous work like on-call or maintenance. How do you distribute it fairly while still developing people?
  expected_concepts:
  - transparent rotation
  - rewarding and recognising it
  - pairing less experienced with more experienced
  - tracking who did what
  - reducing the need for it
  rubric:
    excellent: >-
      Uses an open rotation with tracking, recognises the work, supports newcomers, and reduces the toil, with evidence of
      fairness.
    good: Rotates the work with reasonable fairness.
    weak: Gives it repeatedly to the same people.
  followups:
  - Who ends up taking more of it?
  - How do you recognise it?
  common_errors:
  - 'Answering in the weak pattern: gives it repeatedly to the same people'
