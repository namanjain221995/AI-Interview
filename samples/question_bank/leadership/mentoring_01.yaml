# Curated questions: leadership round, mentoring (part 1 of 4).
# Focus: mentoring and growing engineers, delegation, and creating leaders. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.mentoring.first_mentoring_relationship
  competency_key: mentoring
  topic: Your first formal mentoring relationship
  difficulty: easy
  text: >-
    Tell me about the first time you formally mentored another engineer. How did you start the relationship, and what did
    you focus on in the early weeks?
  expected_concepts:
  - how the arrangement was set up
  - goals agreed with the mentee
  - regular rhythm of meetings
  - what they actually worked on together
  - how progress was noticed
  rubric:
    excellent: >-
      Describes a specific mentee, an agreed purpose, a regular cadence and concrete early actions, and reflects on what they
      would change in how they began.
    good: >-
      Gives a clear example with reasonable structure and some outcome, but the goals or cadence were loose.
    weak: >-
      Speaks only in generalities or describes simply answering questions as they came up.
  followups:
  - How did you decide what to work on first?
  - What did the mentee say helped most?
  common_errors:
  - Treating mentoring as ad hoc help with no shared goal.

- external_key: leadership.mentoring.setting_growth_goals
  competency_key: mentoring
  topic: Agreeing growth goals with an engineer
  difficulty: easy
  text: >-
    How do you work out, together with an engineer on your team, what they should be trying to grow into over the next six
    months?
  expected_concepts:
  - asking about their interests and aspirations
  - relating goals to the team's needs
  - picking one or two goals, not many
  - observable measures of progress
  - revisiting goals on a schedule
  rubric:
    excellent: >-
      Explains a clear conversation structure, balances the person's aims with team needs, limits goals to a few, and describes
      how progress is checked and goals revised.
    good: >-
      Describes sensible goal setting with some follow-up but little on balancing team needs.
    weak: Sets goals alone and hands them down, or never revisits them.
  followups:
  - What if their goal does not match what the team needs?
  - How do you tell whether a goal is working?
  common_errors:
  - >-
    Answering in the weak pattern: sets goals alone and hands them down, or never revisits them

- external_key: leadership.mentoring.helping_stuck_junior
  competency_key: mentoring
  topic: Helping a junior who is stuck
  difficulty: easy
  text: >-
    A junior engineer has been stuck on a bug for two days and hasn't said anything. How do you help them without just fixing
    it yourself?
  expected_concepts:
  - noticing the signal and checking in early
  - asking questions that expose their approach
  - guiding the debugging method
  - leaving the fix to them
  - agreeing when to ask for help next time
  rubric:
    excellent: >-
      Shows a concrete approach of asking diagnostic questions, teaching the method, stepping back, and setting a norm for
      raising blockers sooner, with an example.
    good: >-
      Guides the person and avoids taking over, but gives little on preventing the same silence later.
    weak: Takes over and fixes the bug, or leaves the person alone to struggle.
  followups:
  - How long do you let someone struggle before stepping in?
  - How do you make asking for help feel normal?
  common_errors:
  - Solving the problem for them and calling it mentoring.

- external_key: leadership.mentoring.teaching_through_code_review
  competency_key: mentoring
  topic: Using code review to teach
  difficulty: easy
  text: >-
    How do you use code review as a way of teaching, as opposed to just checking that the code is correct?
  expected_concepts:
  - explaining the reason behind a comment
  - distinguishing must-fix from suggestion
  - linking to examples or docs
  - praising good decisions
  - keeping tone respectful and specific
  rubric:
    excellent: >-
      Gives concrete review habits such as explaining why, labelling severity, offering examples, and recognising strengths,
      and shows how they changed someone's later code.
    good: >-
      Mentions explaining comments and a respectful tone with limited detail on impact.
    weak: Treats review only as a gate and leaves terse corrections.
  followups:
  - Can you give an example of a comment that taught something?
  - How do you handle a repeated mistake?
  common_errors:
  - >-
    Answering in the weak pattern: treats review only as a gate and leaves terse corrections

- external_key: leadership.mentoring.onboarding_buddy
  competency_key: mentoring
  topic: Being an onboarding buddy
  difficulty: easy
  text: >-
    Describe how you have helped a new joiner get productive in their first month. What did you set up for them?
  expected_concepts:
  - a first task that is small and real
  - people and systems introduced early
  - context on how the team works
  - regular check-ins
  - early feedback on what was confusing
  rubric:
    excellent: >-
      Describes a deliberate plan with a small meaningful first task, introductions, regular check-ins, and how feedback from
      the newcomer improved the onboarding.
    good: >-
      Covers a reasonable set of onboarding steps with a good result but little structure.
    weak: Leaves the new joiner to read documents alone or throws them into large work.
  followups:
  - What was the first thing they shipped?
  - What did the newcomer find confusing that you had not expected?
  common_errors:
  - >-
    Answering in the weak pattern: leaves the new joiner to read documents alone or throws them into large work

- external_key: leadership.mentoring.tailoring_delegation_level
  competency_key: leadership
  topic: Matching delegation to the person
  difficulty: medium
  text: >-
    How do you decide how much freedom to give different people on your team when you delegate? Give me an example of two
    people you treated differently and why.
  expected_concepts:
  - assessing skill and confidence for the specific task
  - varying detail of instructions
  - clearer checkpoints for newer people
  - increasing autonomy over time
  - keeping standards equal
  rubric:
    excellent: >-
      Distinguishes competence on the task from seniority, gives clear examples of different levels of support, describes
      how autonomy grew, and keeps outcomes accountable for both.
    good: Varies delegation by person with reasonable justification.
    weak: Delegates the same way to everyone or by seniority alone.
  followups:
  - How did you know it was time to loosen control?
  - What went wrong when you got it wrong?
  common_errors:
  - >-
    Treating all tasks the same for a given person regardless of their experience with that task.

- external_key: leadership.mentoring.delegation_that_failed
  competency_key: leadership
  topic: A delegation that went badly
  difficulty: medium
  text: >-
    Tell me about a time you delegated something and it didn't go well. What happened, and what did you take from it?
  expected_concepts:
  - what was handed over and how clearly
  - where expectations diverged
  - when the problem was noticed
  - how they recovered the situation
  - what changed in later delegation
  rubric:
    excellent: >-
      Takes ownership of their share, such as unclear expectations or late check-ins, explains the recovery and shows a changed
      practice later.
    good: Describes the failure and a sensible recovery with moderate reflection.
    weak: Blames the delegate or recalls no failures.
  followups:
  - When did you first realise it was going off track?
  - How did the person feel about it afterwards?
  common_errors:
  - 'Answering in the weak pattern: blames the delegate or recalls no failures'

- external_key: leadership.mentoring.micromanaging_tendency
  competency_key: leadership
  topic: Catching yourself holding on too tightly
  difficulty: medium
  text: >-
    Have you ever caught yourself micromanaging? Tell me what triggered it and what you did to change.
  expected_concepts:
  - recognising the behaviour from signals or feedback
  - understanding the trigger such as risk or pressure
  - alternative controls such as checkpoints
  - rebuilding trust
  - evidence of change
  rubric:
    excellent: >-
      Self-aware about the trigger, puts specific alternatives in place, seeks feedback and shows a change in team outcomes.
    good: Recognises the issue and changes some habits.
    weak: Denies it happens or says they only did it when necessary with no change.
  followups:
  - What did your team say?
  - What do you do now when you feel the urge?
  common_errors:
  - >-
    Answering in the weak pattern: denies it happens or says they only did it when necessary with no change

- external_key: leadership.mentoring.stuck_mentee_plateau
  competency_key: mentoring
  topic: A mentee who stops progressing
  difficulty: medium
  text: >-
    One of your mentees was growing quickly and now seems to have plateaued. How do you work out what's going on and what
    do you do?
  expected_concepts:
  - asking and listening before diagnosing
  - checking workload and clarity of goals
  - whether the challenge is still right
  - looking for skill gaps versus motivation or context
  - agreeing a new plan
  rubric:
    excellent: >-
      Investigates through conversation and evidence, considers context, goal fit and skill gaps, and agrees a renewed plan
      with the person.
    good: Talks with them and adjusts the plan.
    weak: Assumes lack of effort and increases pressure.
  followups:
  - What would make you decide the goal itself was wrong?
  - How do you separate a temporary dip from a real plateau?
  common_errors:
  - 'Answering in the weak pattern: assumes lack of effort and increases pressure'

- external_key: leadership.mentoring.coaching_not_telling
  competency_key: mentoring
  topic: Coaching rather than giving answers
  difficulty: medium
  text: >-
    Describe a situation where you chose to ask questions instead of giving someone the answer. How did you decide that was
    right, and how did it go?
  expected_concepts:
  - judging stakes and time available
  - open questions that reveal their reasoning
  - letting them reach and test a solution
  - stepping in if the risk becomes real
  - reflecting afterwards
  rubric:
    excellent: >-
      Explains the criteria for coaching versus telling, shows specific questions used, and describes the learning and a safeguard.
    good: >-
      Uses questions effectively on an example but without clear criteria for when to tell.
    weak: Always tells, or always withholds even when time is critical.
  followups:
  - When is it better to just tell them?
  - What did you do when the questions did not help?
  common_errors:
  - Withholding help during a real deadline for the sake of teaching.

- external_key: leadership.mentoring.mentee_disagrees_with_you
  competency_key: mentoring
  topic: A mentee who challenges your advice
  difficulty: medium
  text: >-
    Tell me about a time a person you were mentoring disagreed with your advice and went their own way. How did you handle
    it?
  expected_concepts:
  - listening to their reasoning
  - separating a matter of preference from a real risk
  - allowing them to try
  - agreeing how to evaluate the result
  - keeping the relationship constructive
  rubric:
    excellent: >-
      Shows openness, differentiates low-risk from high-risk choices, supports their experiment with a review point, and reflects
      on who was right and why.
    good: Handles the disagreement respectfully and accepts the choice.
    weak: Insists on their view or withdraws from the relationship.
  followups:
  - Were you right?
  - What would have made you step in?
  common_errors:
  - >-
    Answering in the weak pattern: insists on their view or withdraws from the relationship

- external_key: leadership.mentoring.raising_the_bar_for_senior
  competency_key: mentoring
  topic: Mentoring a strong senior engineer
  difficulty: medium
  text: >-
    How do you mentor someone who is already a strong senior engineer and probably technically better than you in some areas?
  expected_concepts:
  - shifting focus from technical skill to influence and scope
  - asking what they want next
  - connecting them with people who stretch them
  - giving real responsibility
  - candid feedback on impact rather than skill
  rubric:
    excellent: >-
      Redefines mentoring around scope, influence and next-level expectations, gives concrete opportunities, and gets feedback
      in return.
    good: Offers sensible support on career and scope.
    weak: >-
      Feels intimidated and avoids the relationship, or insists on technical corrections.
  followups:
  - What can you offer someone better than you?
  - Give me an example of what you suggested.
  common_errors:
  - >-
    Answering in the weak pattern: feels intimidated and avoids the relationship, or insists on technical corrections

- external_key: leadership.mentoring.growing_a_tech_lead
  competency_key: leadership
  topic: Preparing someone to lead
  difficulty: medium
  text: >-
    Describe how you prepared an engineer to step up to a tech lead role. What did you hand over, and in what order?
  expected_concepts:
  - identifying leadership tasks to share such as planning and reviews
  - gradual increase in scope
  - feedback on facilitation and decisions
  - protection from the worst failures
  - clear signal when they were ready
  rubric:
    excellent: >-
      Lays out a staged handover with feedback at each stage, shows how readiness was judged, and the person succeeded after
      the move.
    good: Hands over some lead tasks over time with moderate structure.
    weak: Promotes without preparation or hands over everything at once.
  followups:
  - What was the hardest thing for them to learn?
  - What did you keep for yourself and why?
  common_errors:
  - >-
    Answering in the weak pattern: promotes without preparation or hands over everything at once

- external_key: leadership.mentoring.junior_overreliance
  competency_key: mentoring
  topic: A colleague who relies on you too much
  difficulty: medium
  text: >-
    A junior colleague keeps coming to you for answers they could work out themselves. How do you change that pattern?
  expected_concepts:
  - noticing the pattern and its causes such as confidence
  - naming it kindly
  - setting an expectation that they try and bring options
  - helping them build a method
  - praising independent progress
  rubric:
    excellent: >-
      Diagnoses causes, has a direct and supportive conversation, introduces a concrete protocol such as bringing two options,
      and tracks the change.
    good: Encourages independence with some structure.
    weak: Refuses to help or continues giving all the answers.
  followups:
  - What if the cause is lack of confidence?
  - How did you tell it was improving?
  common_errors:
  - >-
    Answering in the weak pattern: refuses to help or continues giving all the answers

- external_key: leadership.mentoring.career_conversation
  competency_key: people_management
  topic: A career conversation with a team member
  difficulty: medium
  text: >-
    Walk me through how you would approach a career conversation with someone who wants to be promoted sooner than you think
    is realistic.
  expected_concepts:
  - understanding what they want and why
  - explaining expectations of the next level with evidence
  - separating what is missing from what is strong
  - agreeing specific actions and timelines
  - follow-up
  rubric:
    excellent: >-
      Uses next-level criteria and evidence from their work, is candid about gaps with concrete actions, and agrees follow-up
      checkpoints.
    good: Gives candid feedback and general direction.
    weak: Promises a promotion, deflects, or discourages without reasoning.
  followups:
  - What if they disagree with your assessment?
  - How would you document it?
  common_errors:
  - Making implicit promises about timing.

- external_key: leadership.mentoring.sponsoring_vs_mentoring
  competency_key: leadership
  topic: Putting someone forward
  difficulty: medium
  text: >-
    What's the difference between mentoring someone and sponsoring them, and can you describe a time you actively put someone
    forward for an opportunity?
  expected_concepts:
  - mentoring is advice and sponsoring is using your standing
  - choosing based on contribution
  - preparing the person
  - handling those not chosen
  - checking fairness of who gets opportunities
  rubric:
    excellent: >-
      Clearly distinguishes the two, gives a concrete example based on merit, explains preparation and a fair approach to
      who gets visibility.
    good: Understands the difference and gives a reasonable example.
    weak: Confuses the two or shows favouritism toward the people they know best.
  followups:
  - How do you make sure you are not always picking the same people?
  - What happened afterwards?
  common_errors:
  - >-
    Answering in the weak pattern: confuses the two or shows favouritism toward the people they know best

- external_key: leadership.mentoring.mentoring_remotely
  competency_key: mentoring
  topic: Mentoring in a remote team
  difficulty: medium
  text: >-
    How do you mentor and teach effectively when the team is distributed and you rarely share a room?
  expected_concepts:
  - scheduled one-to-ones and pairing by video
  - written feedback with context
  - noticing signals without hallway contact
  - time zone fairness
  - creating informal channels for questions
  rubric:
    excellent: >-
      Describes practices that replace informal observation, handles time zones, and gives evidence the approach worked.
    good: Adapts a few practices and holds regular contact.
    weak: Treats remote work as the same as in-person without changes.
  followups:
  - How do you notice someone struggling remotely?
  - What did you give up that worked in person?
  common_errors:
  - >-
    Answering in the weak pattern: treats remote work as the same as in-person without changes

- external_key: leadership.mentoring.teaching_system_design_thinking
  competency_key: mentoring
  topic: Growing design judgment
  difficulty: medium
  text: >-
    How have you helped an engineer move from writing code to thinking about design and trade-offs?
  expected_concepts:
  - involving them in design discussions
  - asking for options and trade-offs
  - reviewing their design docs
  - letting small designs fail safely
  - sharing past decisions and reasoning
  rubric:
    excellent: >-
      Describes progressive exposure, specific design reviews, and a concrete improvement in the person's reasoning.
    good: Involves them in design and gives feedback.
    weak: Gives designs to follow with no reasoning.
  followups:
  - What did you do when their design was weak?
  - How did you pick the first design for them to own?
  common_errors:
  - 'Answering in the weak pattern: gives designs to follow with no reasoning'

- external_key: leadership.mentoring.mentor_on_a_failing_team
  competency_key: leadership
  topic: Developing people while the team is struggling
  difficulty: hard
  text: >-
    Your team is behind and under pressure, and you know several engineers need coaching. How do you decide between delivering
    and developing, and what did you do when you faced this?
  expected_concepts:
  - assessing the cost of each option
  - developing through the delivery work itself
  - negotiating scope with stakeholders
  - protecting a floor of coaching
  - communicating the choice openly
  rubric:
    excellent: >-
      Weighs the trade-off explicitly, embeds coaching into delivery, negotiates scope, and describes the outcome and what
      they would change.
    good: Makes a reasoned choice with some compromise.
    weak: Drops development entirely or ignores delivery.
  followups:
  - Who bore the cost of your decision?
  - How would you know the balance was wrong?
  common_errors:
  - 'Answering in the weak pattern: drops development entirely or ignores delivery'

- external_key: leadership.mentoring.underperformer_after_mentoring
  competency_key: people_management
  topic: Mentoring that doesn't work
  difficulty: hard
  text: >-
    You've invested months in mentoring an engineer and performance still hasn't improved. How do you decide what to do next?
  expected_concepts:
  - reviewing what was tried and the evidence
  - clarifying expectations in writing
  - considering fit with role
  - involving the manager or HR processes properly
  - being direct and fair to the person
  rubric:
    excellent: >-
      Reviews evidence, moves to clear expectations and a formal process where needed, treats the person fairly and shows
      a respectful outcome.
    good: Escalates reasonably after earlier efforts.
    weak: Keeps coaching indefinitely or drops the person abruptly.
  followups:
  - When does mentoring stop and performance management begin?
  - What would you say to the person?
  common_errors:
  - Blurring the mentor and performance-review roles without telling the person.

- external_key: leadership.mentoring.developing_a_successor_you_dont_want
  competency_key: leadership
  topic: Developing someone who may take your role
  difficulty: hard
  text: >-
    Have you developed someone who could eventually do your job? How did you feel about it, and how did you handle any conflict
    between your interests and theirs?
  expected_concepts:
  - openly supporting their growth
  - sharing visibility and decisions
  - aligning with your own plans
  - candid conversations about timing
  - support for their move even if elsewhere
  rubric:
    excellent: >-
      Shows real support with concrete actions, handles their own interests transparently, and helps the person progress even
      beyond the team.
    good: Supports growth and acknowledges tension.
    weak: Holds the person back or denies any tension.
  followups:
  - Did it ever cost you?
  - What did you tell your own manager?
  common_errors:
  - 'Answering in the weak pattern: holds the person back or denies any tension'

- external_key: leadership.mentoring.inherited_team_with_a_gap
  competency_key: leadership
  topic: Inheriting a team with no senior people
  difficulty: hard
  text: >-
    You take over a team of mostly junior engineers with no seniors. How do you build capability quickly while still delivering?
  expected_concepts:
  - assessing skills candidly
  - prioritising the highest-risk gaps
  - pairing and external help
  - temporary senior support
  - designing work to grow people
  - setting realistic expectations
  rubric:
    excellent: >-
      Assesses skills, targets key risks with external or temporary senior help, designs work for learning, and keeps stakeholders
      informed with real outcomes.
    good: Builds a sensible plan with some risk awareness.
    weak: Expects juniors to learn on their own at full speed.
  followups:
  - Where would you spend your first month?
  - What risk worried you most?
  common_errors:
  - >-
    Answering in the weak pattern: expects juniors to learn on their own at full speed

- external_key: leadership.mentoring.mentee_leaving_for_better_role
  competency_key: mentoring
  topic: A mentee wants to leave for growth elsewhere
  difficulty: hard
  text: >-
    Someone you've invested heavily in tells you they plan to leave for a bigger opportunity. How do you respond, and how
    do you handle the conversation about what could keep them?
  expected_concepts:
  - reacting supportively
  - understanding the actual reasons
  - checking what you can change
  - avoiding counter-offer pressure
  - planning a clean handover
  - keeping the relationship
  rubric:
    excellent: >-
      Responds with support, explores the reasons, offers real options without pressure, plans the transition, and keeps a
      lasting relationship.
    good: Reacts well and tries to retain where reasonable.
    weak: Takes it personally or pressures them.
  followups:
  - What did you learn about why people leave?
  - Did anything change on your team?
  common_errors:
  - 'Answering in the weak pattern: takes it personally or pressures them'

- external_key: leadership.mentoring.bias_in_who_gets_opportunities
  competency_key: mentoring
  topic: Noticing uneven access to stretch work
  difficulty: hard
  text: >-
    You review who has received stretch assignments over the last year and see that a few people received most of them. What
    do you do?
  expected_concepts:
  - examining the data without blame
  - understanding the reasons such as visibility and trust
  - creating transparent selection
  - asking others what they want
  - revisiting regularly
  rubric:
    excellent: >-
      Looks at evidence, finds the mechanisms, introduces transparent and fair allocation, and checks again later.
    good: Sees the imbalance and takes some corrective step.
    weak: Dismisses it as merit with no check.
  followups:
  - How would you know if your fix worked?
  - What if the people involved resisted?
  common_errors:
  - 'Answering in the weak pattern: dismisses it as merit with no check'

- external_key: leadership.mentoring.disagreement_on_your_mentoring_style
  competency_key: mentoring
  topic: A peer lead thinks you coach too gently
  difficulty: hard
  text: >-
    Another lead tells you that your coaching approach is too gentle and your team isn't being challenged. How do you evaluate
    that?
  expected_concepts:
  - gathering evidence from outcomes and team
  - asking team members
  - separating style from results
  - testing small changes
  - staying open to being wrong
  rubric:
    excellent: >-
      Considers evidence and seeks team input, separates style from outcomes, tries a measured change, and accepts valid critique.
    good: Reflects and tries a few adjustments.
    weak: Dismisses or fully abandons their approach.
  followups:
  - What evidence would convince you?
  - What did you try?
  common_errors:
  - 'Answering in the weak pattern: dismisses or fully abandons their approach'
