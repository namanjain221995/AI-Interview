# Curated questions: leadership round, driving change (part 2 of 4). Rollouts, deprecations, adoption measures, incentives and sustaining or recovering change. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.driving_change.timeline_communication
  competency_key: communication
  topic: Telling people when a change will reach them
  difficulty: easy
  text: >-
    When you roll out a change that affects other people's work, how do you let them know what is happening
    and when?
  expected_concepts:
  - stating what changes and what does not
  - giving dates and milestones
  - naming a contact for questions
  - repeating through more than one channel
  rubric:
    excellent: >-
      Describes a clear plan with milestones, dates, who is affected and how, repeated through several
      channels, and an example showing fewer surprises as a result.
    good: Announces the change with dates and a contact, with limited follow-up.
    weak: Sends a single announcement and assumes it was read.
  followups:
  - How do you find out who missed it?
  - What would you change about your last announcement?
  common_errors:
  - Relying on one announcement for a change that affects daily work.

- external_key: leadership.driving_change.training_for_new_tool
  competency_key: mentoring
  topic: Helping people learn a new tool
  difficulty: easy
  text: >-
    Tell me how you help people become comfortable with a tool or process that is new to them.
  expected_concepts:
  - short hands-on sessions
  - written quick-start guides
  - pairing with early users
  - a place to ask questions
  - allowing time to learn
  rubric:
    excellent: >-
      Combines hands-on practice, concise guides and early-user pairing, allows protected learning time,
      and shows how adoption or error rates improved.
    good: Provides training and documentation with some support.
    weak: Sends a link and expects people to figure it out.
  followups:
  - What worked best?
  - How did you know people were comfortable?
  common_errors:
  - Sends a link and expects people to figure it out.

- external_key: leadership.driving_change.celebrate_small_wins
  competency_key: leadership
  topic: Making progress visible during a long change
  difficulty: easy
  text: >-
    In a change that takes months, how do you keep people aware of progress and motivated to continue?
  expected_concepts:
  - defining visible milestones
  - sharing numbers or examples
  - crediting those who contributed
  - showing what got better for users of the change
  rubric:
    excellent: >-
      Sets visible milestones, shares concrete progress and benefits, names contributors, and adjusts
      based on how the audience responds.
    good: Shares periodic updates and thanks people.
    weak: Reports only at the end or keeps updates vague.
  followups:
  - What did you share and where?
  - How did you choose which wins to highlight?
  common_errors:
  - Reports only at the end or keeps updates vague.

- external_key: leadership.driving_change.feedback_after_rollout
  competency_key: collaboration
  topic: Asking users how the change landed
  difficulty: easy
  text: >-
    After you roll out a change, how do you find out what it is actually like for the people using it?
  expected_concepts:
  - asking directly through short surveys or conversations
  - watching usage data
  - looking for workarounds
  - acting on feedback and saying what changed
  rubric:
    excellent: >-
      Uses both conversations and usage data, notices workarounds, acts on specific feedback and reports
      back what was changed.
    good: Collects feedback and makes some changes.
    weak: Assumes silence means success.
  followups:
  - What did you hear that surprised you?
  - How did you tell people their feedback mattered?
  common_errors:
  - Treating silence as approval.

- external_key: leadership.driving_change.name_the_owner
  competency_key: ownership
  topic: Making sure a change has an owner
  difficulty: easy
  text: >-
    Why does a change need a single named owner, and how do you decide who that should be?
  expected_concepts:
  - one person accountable for progress
  - authority and time to act
  - ability to coordinate across groups
  - clear escalation path
  rubric:
    excellent: >-
      Explains how ownership prevents drift, chooses someone with authority, time and cross-group reach,
      and shows an example where unclear ownership caused delay.
    good: Recognises the need for an owner and picks a sensible person.
    weak: Treats ownership as shared by the whole team.
  followups:
  - What did you do when the owner lacked authority?
  - What happens when the owner leaves?
  common_errors:
  - Assigning ownership to a group so nobody is accountable.

- external_key: leadership.driving_change.deprecating_legacy_service
  competency_key: leadership
  topic: Switching off a service people still use
  difficulty: medium
  text: >-
    You need to turn off a legacy service that several teams still use. Walk me through how you get them
    off it.
  expected_concepts:
  - inventorying actual users from usage data
  - offering a migration path and help
  - setting a firm date with reminders
  - handling stragglers
  - verifying the final shutdown safely
  rubric:
    excellent: >-
      Finds actual users from data, provides a migration path and support, sets a firm date with staged
      reminders, plans for stragglers and shuts down in a reversible way.
    good: Announces a date and supports migration with some inventory.
    weak: Announces a date without checking usage or help.
  followups:
  - How did you find hidden users?
  - What did you do at the deadline?
  common_errors:
  - Announces a date without checking usage or help.

- external_key: leadership.driving_change.migrating_data_store
  competency_key: project_management
  topic: Moving data safely during a migration
  difficulty: medium
  text: >-
    Describe how you drove a migration of a data store that many things relied on. How did you manage
    the risk to users?
  expected_concepts:
  - dual-running or syncing
  - verifying data parity
  - incremental cut-over
  - rollback plan
  - communicating windows
  rubric:
    excellent: >-
      Describes parallel running, parity checks, incremental cut-over and rollback, with communication
      of risk, and the outcome including problems found.
    good: Explains a reasonable plan and outcome with limited verification detail.
    weak: Describes a one-step cut-over without verification or fallback.
  followups:
  - What went wrong and how did you find it?
  - How did you decide to cut over?
  common_errors:
  - Describes a one-step cut-over without verification or fallback.

- external_key: leadership.driving_change.adoption_metrics
  competency_key: project_management
  topic: Measuring whether people actually adopt a change
  difficulty: medium
  text: >-
    How do you tell whether a change has really been adopted rather than just announced? What do you measure?
  expected_concepts:
  - usage metrics that reflect real behaviour
  - comparing against the old way
  - leading and lagging indicators
  - qualitative checks
  - watching for workarounds
  rubric:
    excellent: >-
      Defines behaviour-based adoption metrics, compares with baseline, uses leading and lagging indicators,
      and verifies with conversations; adjusts approach based on findings.
    good: Tracks usage numbers with some qualitative checks.
    weak: Counts attendees or announcements as adoption.
  followups:
  - What metric misled you?
  - What do you do when adoption stalls?
  common_errors:
  - Equating training attendance with adoption.

- external_key: leadership.driving_change.change_fatigue
  competency_key: adaptability
  topic: Too many changes at once
  difficulty: medium
  text: >-
    Your teams are already dealing with several changes, and you want to introduce another. How do you
    decide whether and when?
  expected_concepts:
  - understanding the current change load
  - sequencing by value and urgency
  - stopping or merging other changes
  - asking teams about capacity
  - being clear about the cost to them
  rubric:
    excellent: >-
      Maps current changes, sequences by value, merges or stops lower-value ones, asks teams about capacity,
      and is transparent about the cost.
    good: Considers load and timing with some consultation.
    weak: Adds the change regardless or delays indefinitely.
  followups:
  - What did you stop?
  - How do you gauge capacity?
  common_errors:
  - Adds the change regardless or delays indefinitely.

- external_key: leadership.driving_change.cross_timezone_rollout
  competency_key: collaboration
  topic: Rolling out a change across regions
  difficulty: medium
  text: >-
    You need teams in several regions to adopt a change in the same period. How do you coordinate it?
  expected_concepts:
  - local champions in each region
  - materials in written form
  - sessions at workable times
  - regional feedback channels
  - consistent core with local flexibility
  rubric:
    excellent: >-
      Uses regional champions, written and recorded material, workable session times, and feedback channels,
      with a core standard and room for local adjustments.
    good: Provides materials and sessions across regions.
    weak: Runs everything from one location and time.
  followups:
  - How did you choose champions?
  - What differed by region?
  common_errors:
  - Runs everything from one location and time.

- external_key: leadership.driving_change.mandate_team_disagrees
  competency_key: stakeholder_management
  topic: A mandated change the team does not support
  difficulty: medium
  text: >-
    Leadership has mandated a change that your team thinks is a mistake. How do you handle it with the
    team and with leadership?
  expected_concepts:
  - understanding the reason for the mandate
  - sharing the team's concerns with evidence
  - finding room to implement well
  - being clear about what is fixed
  - not undermining the decision
  rubric:
    excellent: >-
      Learns the reasoning, brings the team's concerns upward with evidence, finds flexibility in how
      to implement, is clear with the team about what is fixed and does not undermine the decision.
    good: Raises concerns and implements as required.
    weak: Complains alongside the team or implements with resentment.
  followups:
  - What came of your concerns?
  - How did you talk to the team?
  common_errors:
  - Complains alongside the team or implements with resentment.

- external_key: leadership.driving_change.remote_adoption
  competency_key: adaptability
  topic: Driving adoption in a mostly remote team
  difficulty: medium
  text: >-
    How do you drive a process change in a team that works mostly remotely and rarely meets in person?
  expected_concepts:
  - written explanations and recorded demos
  - short check-ins
  - visible adoption signals
  - asking for feedback in writing
  - pairing across locations
  rubric:
    excellent: >-
      Uses written and recorded material, short check-ins, visible signals, feedback channels and pairing,
      and adapts based on results.
    good: Uses written communication and meetings with some feedback.
    weak: Relies on a single meeting and email.
  followups:
  - How do you see who hasn't adopted?
  - What was different from an in-person rollout?
  common_errors:
  - Relies on a single meeting and email.

- external_key: leadership.driving_change.middle_managers_slow_down
  competency_key: stakeholder_management
  topic: Managers who stall a change
  difficulty: medium
  text: >-
    A change is accepted by senior leaders and by engineers, but several middle managers keep slowing
    it down. How do you find out why and respond?
  expected_concepts:
  - asking about their constraints
  - showing how the change helps their goals
  - adjusting timing or scope
  - engaging their leaders if needed
  - keeping the relationship constructive
  rubric:
    excellent: >-
      Learns their constraints, links the change to their goals, adjusts the plan, escalates only after
      trying to resolve it, and maintains relationships.
    good: Talks to the managers and adjusts.
    weak: Goes around them or escalates immediately.
  followups:
  - What was the main reason?
  - When would you escalate?
  common_errors:
  - Escalating before trying to understand the manager's constraints.

- external_key: leadership.driving_change.rolling_back_a_change
  competency_key: ownership
  topic: Reversing a change that is not working
  difficulty: medium
  text: >-
    Tell me about a change you rolled out that you ended up rolling back or substantially changing. How
    did you decide, and how did you communicate it?
  expected_concepts:
  - defining criteria for backing out
  - looking at evidence
  - communicating plainly
  - limiting disruption
  - extracting lessons for the next change
  rubric:
    excellent: >-
      Used evidence against pre-set criteria, communicated plainly to affected groups, limited disruption,
      and extracted specific lessons.
    good: Rolled back sensibly with some communication.
    weak: Persisted despite evidence or has no example.
  followups:
  - What was the first sign?
  - How did people react?
  common_errors:
  - Persisted despite evidence or has no example.

- external_key: leadership.driving_change.shadow_workarounds
  competency_key: problem_solving
  topic: People quietly doing it the old way
  difficulty: medium
  text: >-
    You discover many people have quietly kept using the old process alongside the new one. What do you
    do?
  expected_concepts:
  - finding out why
  - separating gaps in the new approach from habits
  - fixing real gaps
  - setting an end date for the old one
  - communicating the change in position
  rubric:
    excellent: >-
      Investigates reasons, separates real gaps from habit, fixes the gaps, sets an end date for the old
      method, and communicates openly.
    good: Talks to the people and fixes some issues.
    weak: Insists on compliance or ignores the workaround.
  followups:
  - What were the real gaps?
  - How did you handle the stragglers?
  common_errors:
  - Insists on compliance or ignores the workaround.

- external_key: leadership.driving_change.incentives_for_adoption
  competency_key: stakeholder_management
  topic: Aligning incentives with a change
  difficulty: medium
  text: >-
    How do you check that people's goals, reviews and daily incentives support a change you want rather
    than work against it?
  expected_concepts:
  - finding conflicting incentives
  - adjusting goals or metrics
  - making the new way the easy way
  - recognising early adopters
  - discussing with managers
  rubric:
    excellent: >-
      Finds specific conflicts in goals or metrics, adjusts them with managers, makes the new path easiest,
      and recognises early adopters.
    good: Spots some conflicts and talks to managers.
    weak: Assumes the case for change is enough.
  followups:
  - Which incentive worked against you?
  - How did you make the new way easy?
  common_errors:
  - Asking for change while leaving the old incentives in place.

- external_key: leadership.driving_change.enablement_docs
  competency_key: communication
  topic: Documentation that makes a change stick
  difficulty: medium
  text: >-
    What documentation or support do you prepare before a change reaches its users, and how do you keep
    it useful afterward?
  expected_concepts:
  - quick-start and common tasks
  - examples from real use
  - ownership of docs
  - feedback loop from questions
  - update after rollout
  rubric:
    excellent: >-
      Prepares task-focused docs with real examples, assigns ownership, uses support questions to improve
      the docs, and updates after rollout.
    good: Writes useful docs with limited upkeep.
    weak: Writes documentation after rollout or leaves it unowned.
  followups:
  - How do you know which questions come up?
  - Who owns updates?
  common_errors:
  - Writes documentation after rollout or leaves it unowned.

- external_key: leadership.driving_change.compliance_driven_change
  competency_key: stakeholder_management
  topic: A change required by compliance
  difficulty: medium
  text: >-
    A compliance requirement forces a change across teams by a fixed date. How do you drive it without
    it feeling like a pure imposition?
  expected_concepts:
  - explaining the requirement and consequences
  - finding the least disruptive way to meet it
  - helping teams with tooling
  - tracking progress openly
  - handling teams that fall behind
  rubric:
    excellent: >-
      Explains the requirement and consequences, designs a low-disruption route, supplies tooling and
      support, tracks progress openly, and works with teams falling behind.
    good: Communicates and tracks with some support.
    weak: Issues a directive and chases late teams.
  followups:
  - How did you reduce the effort for teams?
  - How did you handle laggards?
  common_errors:
  - Issues a directive and chases late teams.

- external_key: leadership.driving_change.multi_year_migration
  competency_key: leadership
  topic: Sustaining a migration over years
  difficulty: hard
  text: >-
    Describe a migration or change that took more than a year. How did you keep it moving through changes
    in people and priorities?
  expected_concepts:
  - breaking it into valuable stages
  - keeping a visible plan and metrics
  - renewing sponsorship
  - handling attrition and handover
  - adjusting scope as conditions changed
  rubric:
    excellent: >-
      Staged the work for early value, kept visible progress, renewed sponsor support, handled handovers,
      and adapted scope with reasons.
    good: Kept the effort going with stages and updates.
    weak: Lost momentum or depended on a single person.
  followups:
  - When did it nearly stall?
  - How did you handle new people joining?
  common_errors:
  - Lost momentum or depended on a single person.

- external_key: leadership.driving_change.ownership_restructure_change
  competency_key: leadership
  topic: Moving ownership of systems between teams
  difficulty: hard
  text: >-
    You need to move ownership of significant systems from one team to another. How do you carry that
    out so service and knowledge are not lost?
  expected_concepts:
  - agreeing reasons and criteria
  - a staged handover with shadowing
  - documenting runbooks
  - clear transition of on-call
  - treating people affected with care
  rubric:
    excellent: >-
      Agrees reasons, runs staged handover with shadowing, documents runbooks, transitions on-call explicitly,
      and treats affected people fairly.
    good: Plans a handover with documentation.
    weak: Announces ownership change and expects knowledge to follow.
  followups:
  - How did you test the handover?
  - How did the original team react?
  common_errors:
  - Announces ownership change and expects knowledge to follow.

- external_key: leadership.driving_change.change_during_incidents
  competency_key: ownership
  topic: Driving change while reliability is poor
  difficulty: hard
  text: >-
    Your systems are having frequent incidents, and you also need to drive a significant change. How do
    you decide how to proceed?
  expected_concepts:
  - judging if the change addresses reliability
  - sequencing risk
  - protecting on-call load
  - reducing blast radius
  - stopping if incidents rise
  rubric:
    excellent: >-
      Judges whether the change helps reliability, sequences it to limit blast radius, protects on-call
      load, sets stop criteria, and communicates the trade-off.
    good: Proceeds with some caution and monitoring.
    weak: Pushes ahead regardless or freezes everything.
  followups:
  - What would make you pause?
  - How did you protect the on-call team?
  common_errors:
  - Pushes ahead regardless or freezes everything.

- external_key: leadership.driving_change.merge_toolchains
  competency_key: collaboration
  topic: Merging two different toolchains
  difficulty: hard
  text: >-
    Two groups in the organisation use different toolchains for the same job, and you are asked to bring
    them together. How do you do that fairly?
  expected_concepts:
  - setting criteria before choosing
  - evaluating each on shared scenarios
  - involving both groups
  - planning the transition for the one that changes
  - keeping what was good from the other
  rubric:
    excellent: >-
      Sets criteria first, evaluates both on shared scenarios, involves both groups, plans transition
      support, and carries across strengths from the other.
    good: Compares and decides with consultation.
    weak: Chooses the bigger group's tool or the one that leaders prefer.
  followups:
  - How did you handle the group that lost?
  - What did you keep from their way?
  common_errors:
  - Chooses the bigger group's tool or the one that leaders prefer.

- external_key: leadership.driving_change.retiring_a_loved_practice
  competency_key: stakeholder_management
  topic: Ending a practice people value
  difficulty: hard
  text: >-
    A practice the team values, like a long-standing meeting or ritual, no longer serves its purpose.
    How do you change it?
  expected_concepts:
  - understanding what people value in it
  - showing evidence it no longer works
  - replacing the need it met
  - trying an alternative for a period
  - being open to being wrong
  rubric:
    excellent: >-
      Learns what people value, shows evidence, proposes a replacement that meets the need, trials it
      for a period, and stays open to revising.
    good: Explains reasons and tries alternatives.
    weak: Cancels it abruptly or avoids touching it.
  followups:
  - What did people value?
  - How did you decide the trial had worked?
  common_errors:
  - Cancels it abruptly or avoids touching it.

- external_key: leadership.driving_change.recovering_failed_change
  competency_key: ownership
  topic: Re-starting after a change that failed
  difficulty: hard
  text: >-
    Tell me about a change effort that failed or lost trust. How did you bring it back, or what did you
    do next?
  expected_concepts:
  - understanding why it failed
  - acknowledging it to the people affected
  - reducing the scope
  - rebuilding trust through small results
  - changing the approach
  rubric:
    excellent: >-
      Diagnoses the real reasons, acknowledges the failure to those affected, narrows scope, rebuilds
      trust with early results and changes approach.
    good: Reflects on causes and tries again with a revised plan.
    weak: Blames others or abandons the topic.
  followups:
  - What did you change the second time?
  - How did you win people back?
  common_errors:
  - Blames others or abandons the topic.

- external_key: leadership.driving_change.vendor_switch_org_wide
  competency_key: stakeholder_management
  topic: Switching a vendor across the organisation
  difficulty: hard
  text: >-
    You are leading the switch from one vendor product to another across a large organisation, and many
    teams depend on the old one. How do you plan and run it?
  expected_concepts:
  - inventory of use and integrations
  - pilots
  - migration tooling
  - overlapping period
  - contract and exit timing
  - support for teams
  rubric:
    excellent: >-
      Builds an inventory, runs pilots, provides tooling and support, plans an overlap aligned with contract
      dates, and tracks progress by team.
    good: Plans phases with support and tracking.
    weak: Sets a hard cut-over date with minimal support.
  followups:
  - How did you handle the contract end date?
  - Which teams were hardest?
  common_errors:
  - Sets a hard cut-over date with minimal support.
