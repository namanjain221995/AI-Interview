# Curated questions: leadership round, inclusive culture (part 4 of 4).
# Focus: building an inclusive, respectful team culture through fair, job-related processes and working practices. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.inclusive_culture.encouraging_questions
  competency_key: collaboration
  topic: Making it normal to say "I don't know"
  difficulty: easy
  text: >-
    How do you create a team where people feel comfortable saying they don't understand something?
  expected_concepts:
  - modelling it yourself
  - rewarding questions
  - no mocking of basic questions
  - learning sessions
  - follow-up on questions asked
  rubric:
    excellent: >-
      Models the behaviour, shows reactions that reward questions, and gives an example of improved learning.
    good: Welcomes questions and answers politely.
    weak: Treats basic questions as a waste of time.
  followups:
  - When did you last say you did not know?
  - How did people respond?
  common_errors:
  - 'Answering in the weak pattern: treats basic questions as a waste of time'

- external_key: leadership.inclusive_culture.planning_social_events
  competency_key: culture_values
  topic: Team events that include everyone
  difficulty: easy
  text: >-
    How do you plan team events and social activities so that everyone can take part?
  expected_concepts:
  - asking the team for ideas
  - offering varied formats and timings
  - no pressure to attend
  - including remote members
  - keeping work-related decisions out of social settings
  rubric:
    excellent: >-
      Consults the team, offers varied formats, makes attendance optional, and ensures no decisions are made only in social
      settings.
    good: Considers different timings and types.
    weak: Plans events that suit the organiser.
  followups:
  - What did you change after feedback?
  - How do you keep decisions out of social settings?
  common_errors:
  - 'Answering in the weak pattern: plans events that suit the organiser'

- external_key: leadership.inclusive_culture.structured_interviews_basics
  competency_key: people_management
  topic: Why structured interviews help
  difficulty: easy
  text: >-
    What practical steps do you take to make your interviews consistent from one candidate to the next?
  expected_concepts:
  - same core questions
  - written scoring guide
  - independent notes before debrief
  - time limits
  - relevance to the role
  rubric:
    excellent: >-
      Describes consistent questions, a scoring guide, independent notes and role relevance, and a result such as clearer
      decisions.
    good: Uses some structure.
    weak: Improvises each interview.
  followups:
  - What happens when a candidate goes off-script?
  - How do you train new interviewers?
  common_errors:
  - 'Answering in the weak pattern: improvises each interview'

- external_key: leadership.inclusive_culture.sharing_glue_work
  competency_key: leadership
  topic: Sharing the invisible work
  difficulty: easy
  text: >-
    Every team has work like taking notes, organising, onboarding and chasing follow-ups. How do you spread it fairly?
  expected_concepts:
  - naming the work
  - rotating it
  - recognising it in reviews
  - avoiding defaulting to the same volunteers
  - tracking
  rubric:
    excellent: >-
      Names the work explicitly, rotates it, recognises it in reviews, and checks who defaults to it.
    good: Rotates some tasks.
    weak: Lets the same people handle it.
  followups:
  - Who used to do it by default?
  - How did you value it?
  common_errors:
  - 'Answering in the weak pattern: lets the same people handle it'

- external_key: leadership.inclusive_culture.inclusive_language_in_work
  competency_key: communication
  topic: Clear and respectful language at work
  difficulty: easy
  text: >-
    How do you encourage respectful, clear language in tickets, documents, and chat on your team?
  expected_concepts:
  - examples of good practice
  - reviewing templates and naming
  - plain terms instead of jargon
  - private word with offenders
  - consistent response
  rubric:
    excellent: >-
      Gives concrete examples of language norms, reviewing shared templates, and handling lapses privately with consistency.
    good: Encourages respectful language.
    weak: Ignores language unless someone complains.
  followups:
  - Can you give an example of a change?
  - How do you correct someone?
  common_errors:
  - 'Answering in the weak pattern: ignores language unless someone complains'

- external_key: leadership.inclusive_culture.team_agreements_on_communication_load
  competency_key: communication
  topic: Fair expectations on response times
  difficulty: medium
  text: >-
    How do you set expectations on responding to messages so that people who work different hours are not penalised?
  expected_concepts:
  - stated response windows
  - urgent channel defined
  - no judging by online presence
  - async-friendly norms
  - reviewing
  rubric:
    excellent: >-
      States windows, defines the urgent route, judges on outcomes and reviews the norm.
    good: Sets some response expectations.
    weak: Rewards instant replies.
  followups:
  - How do you handle genuinely urgent needs?
  - How did people respond?
  common_errors:
  - 'Answering in the weak pattern: rewards instant replies'

- external_key: leadership.inclusive_culture.shared_ownership_of_culture
  competency_key: culture_values
  topic: Spreading responsibility for team norms
  difficulty: medium
  text: >-
    How do you get the whole team involved in upholding respectful working practices, and not just rely on you?
  expected_concepts:
  - team-defined norms
  - peer reminders
  - rotating roles like facilitator
  - recognising good behaviour
  - reviewing
  rubric:
    excellent: >-
      Co-creates norms, shares responsibility with rotating roles and recognises good behaviour, so practices persist without
      the leader.
    good: Involves the team.
    weak: Enforces norms alone.
  followups:
  - What happened when you were absent?
  - Who took the lead?
  common_errors:
  - 'Answering in the weak pattern: enforces norms alone'

- external_key: leadership.inclusive_culture.handling_exclusion_in_planning
  competency_key: project_management
  topic: Including all the people affected in planning
  difficulty: medium
  text: >-
    Planning sessions often involve only some of the people who will do the work. How do you bring the others in?
  expected_concepts:
  - invitations to everyone affected
  - pre-work in writing
  - capturing concerns
  - feedback loop
  - revisiting commitments
  rubric:
    excellent: >-
      Invites affected people, uses written pre-work, captures concerns and revises plans, showing more realistic commitments.
    good: Seeks input before commitments.
    weak: Plans with leads only.
  followups:
  - What did you learn from the people you added?
  - How did commitments change?
  common_errors:
  - 'Answering in the weak pattern: plans with leads only'

- external_key: leadership.inclusive_culture.equal_support_for_stretching
  competency_key: mentoring
  topic: Fair support for stretch work
  difficulty: medium
  text: >-
    How do you make sure the people who receive the most support and coaching are chosen on need and potential, not on how
    comfortable they are to work with?
  expected_concepts:
  - criteria for support
  - checking time allocation
  - asking quieter people about needs
  - transparency
  - reviewing
  rubric:
    excellent: Sets criteria, tracks time allocation, asks quieter people and adjusts.
    good: Aims to support all.
    weak: Supports those they like best.
  followups:
  - What did you find in your own time use?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: supports those they like best'

- external_key: leadership.inclusive_culture.inclusive_recognition_programmes
  competency_key: culture_values
  topic: Fair recognition systems
  difficulty: medium
  text: >-
    Your organisation has awards and shout-outs. How do you make sure they reflect the breadth of contributions?
  expected_concepts:
  - clear criteria
  - nominations from many
  - recognising support roles
  - reviewing who wins
  - varied formats
  rubric:
    excellent: >-
      Sets criteria, collects nominations widely, reviews patterns and recognises varied work.
    good: Uses nominations.
    weak: Rewards the most visible results.
  followups:
  - Who was missed?
  - How did you change it?
  common_errors:
  - 'Answering in the weak pattern: rewards the most visible results'

- external_key: leadership.inclusive_culture.fairness_in_estimating_and_commitments
  competency_key: project_management
  topic: Equal accountability for commitments
  difficulty: medium
  text: >-
    How do you make sure that commitments and the consequences of missing them are applied equally across team members?
  expected_concepts:
  - team-owned estimates
  - shared criteria for slippage review
  - blameless first look
  - consistent follow-up
  - fair credit
  rubric:
    excellent: >-
      Uses team-owned estimates, consistent follow-up and blameless review, and applies equal standards.
    good: Reviews slippage consistently.
    weak: Penalises some people more.
  followups:
  - How did you handle repeated slippage?
  - How do you share credit for delivery?
  common_errors:
  - 'Answering in the weak pattern: penalises some people more'

- external_key: leadership.inclusive_culture.bridging_functions_respectfully
  competency_key: stakeholder_management
  topic: Respectful working with other functions
  difficulty: medium
  text: >-
    Engineers on your team sometimes speak dismissively about colleagues in other functions. How do you handle that?
  expected_concepts:
  - addressing it directly
  - explaining the effect on collaboration
  - building contact with the other function
  - modelling respect
  - recognising joint wins
  rubric:
    excellent: >-
      Addresses directly, explains the effect, builds contact and models respect, with improved cooperation.
    good: Reminds the team to be respectful.
    weak: Ignores it.
  followups:
  - What did the other function say?
  - How did you create contact?
  common_errors:
  - 'Answering in the weak pattern: ignores it'

- external_key: leadership.inclusive_culture.handling_unexpected_absences_fairly
  competency_key: people_management
  topic: Covering for someone's absence
  difficulty: medium
  text: >-
    When someone is away unexpectedly, how do you cover their work without burdening the same colleagues each time?
  expected_concepts:
  - shared cover rota
  - cross-training
  - documented tasks
  - thanking cover
  - limiting overload
  - no commentary on the absent person
  rubric:
    excellent: >-
      Uses a shared cover rota, cross-training and recognition, and keeps comments about the absent colleague respectful.
    good: Redistributes work reasonably.
    weak: Leaves cover to volunteers and complains.
  followups:
  - How do you cross-train?
  - How do you thank people?
  common_errors:
  - 'Answering in the weak pattern: leaves cover to volunteers and complains'

- external_key: leadership.inclusive_culture.consistent_rules_on_remote_equipment
  competency_key: people_management
  topic: Fair resourcing
  difficulty: medium
  text: >-
    How do you ensure that all team members get equal access to equipment, tools and support they need to do their work?
  expected_concepts:
  - published standards
  - request process
  - checking allocation
  - responding to specific work needs
  - reviewing
  rubric:
    excellent: Publishes standards, tracks requests and checks allocation against role needs.
    good: Handles requests as they come.
    weak: Gives equipment to whoever pushes hardest.
  followups:
  - Who had the least before?
  - How did you find out?
  common_errors:
  - 'Answering in the weak pattern: gives equipment to whoever pushes hardest'

- external_key: leadership.inclusive_culture.calling_out_micro_patterns
  competency_key: collaboration
  topic: Addressing small repeated patterns
  difficulty: medium
  text: >-
    Small things, like talking over someone repeatedly or dismissing questions, can add up. How do you address a pattern like
    that without making it a big confrontation?
  expected_concepts:
  - noticing and recording instances
  - private feedback with examples
  - agreeing a signal
  - asking the affected person
  - checking later
  rubric:
    excellent: >-
      Records examples, gives private feedback, agrees a way to handle it and checks later.
    good: Mentions it privately.
    weak: Waits until it becomes serious.
  followups:
  - What was the pattern?
  - How did the person respond?
  common_errors:
  - 'Answering in the weak pattern: waits until it becomes serious'

- external_key: leadership.inclusive_culture.fairness_toward_candidates_who_decline
  competency_key: people_management
  topic: Treating candidates well throughout hiring
  difficulty: medium
  text: >-
    How do you make sure every candidate, including those you reject, has a respectful and informative experience?
  expected_concepts:
  - clear communication about stages
  - timely responses
  - useful feedback
  - consistent treatment
  - asking candidates for feedback
  rubric:
    excellent: >-
      Communicates clearly and promptly, gives useful feedback where appropriate and gathers candidate feedback.
    good: Responds to candidates promptly.
    weak: Leaves candidates without news.
  followups:
  - What feedback did candidates give?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: leaves candidates without news'

- external_key: leadership.inclusive_culture.decision_review_for_fairness
  competency_key: leadership
  topic: Reviewing a decision for fairness afterwards
  difficulty: medium
  text: >-
    After a significant decision such as a reorganisation of work, how do you check whether it affected people on your team
    unevenly?
  expected_concepts:
  - listing who was affected
  - gathering views
  - comparing outcomes
  - adjusting
  - sharing what was learned
  rubric:
    excellent: >-
      Lists those affected, gathers views and data, adjusts the decision and shares the result.
    good: Asks the team afterwards.
    weak: Assumes the decision was fair.
  followups:
  - Who was affected most?
  - What did you adjust?
  common_errors:
  - 'Answering in the weak pattern: assumes the decision was fair'

- external_key: leadership.inclusive_culture.reviewing_own_blind_spots
  competency_key: leadership
  topic: Finding your own blind spots as a leader
  difficulty: hard
  text: >-
    What have you done to discover where your own habits as a leader might disadvantage some people on your team?
  expected_concepts:
  - asking for specific feedback
  - reviewing assignment and review patterns
  - seeking outside perspectives
  - sharing findings
  - changing practice
  - repeating the check
  rubric:
    excellent: >-
      Uses data and feedback from multiple sources, finds a specific pattern, changes behaviour and checks again.
    good: Asks for feedback and reflects.
    weak: Believes they treat everyone the same already.
  followups:
  - What did you find?
  - How often do you check?
  common_errors:
  - 'Answering in the weak pattern: believes they treat everyone the same already'

- external_key: leadership.inclusive_culture.handling_pushback_against_inclusion_effort
  competency_key: leadership
  topic: Resistance to fairness measures
  difficulty: hard
  text: >-
    A few team members think your fairness measures, like structured interviews and rotating tasks, are bureaucracy. How do
    you respond?
  expected_concepts:
  - listening to concerns
  - explaining the problem it solves with evidence
  - simplifying where possible
  - keeping the core
  - reviewing results
  rubric:
    excellent: >-
      Listens, shows evidence, simplifies without losing the core and reviews results with the team.
    good: Explains the reason.
    weak: Imposes it or drops it.
  followups:
  - What did you simplify?
  - What did you refuse to drop?
  common_errors:
  - 'Answering in the weak pattern: imposes it or drops it'

- external_key: leadership.inclusive_culture.rebuilding_trust_after_unfair_event
  competency_key: leadership
  topic: Repairing trust after an unfair decision
  difficulty: hard
  text: >-
    A decision you made was seen by the team as unfair, and trust fell. How did you repair it?
  expected_concepts:
  - understanding the perception
  - reviewing the facts
  - acknowledging mistakes
  - changing the process
  - communicating
  - time and consistency
  rubric:
    excellent: >-
      Listens, reviews, acknowledges errors, changes the process, communicates and shows trust returning.
    good: Explains and adjusts.
    weak: Defends the decision.
  followups:
  - What did you get wrong?
  - How long did it take?
  common_errors:
  - 'Answering in the weak pattern: defends the decision'

- external_key: leadership.inclusive_culture.growing_diverse_leadership_pipeline
  competency_key: leadership
  topic: Building a wider leadership pipeline
  difficulty: hard
  text: >-
    Over a few years, what would you do to ensure the people who become leads and managers come from the full breadth of your
    team?
  expected_concepts:
  - clear role criteria
  - leadership development open to all
  - stretch opportunities distributed
  - sponsorship
  - tracking progress
  - reviewing selection
  rubric:
    excellent: >-
      Defines criteria, opens development, distributes opportunity, sponsors and tracks, with evidence of a wider pipeline.
    good: Opens development to all.
    weak: Waits for people to volunteer.
  followups:
  - What did you track?
  - What changed in selection?
  common_errors:
  - 'Answering in the weak pattern: waits for people to volunteer'

- external_key: leadership.inclusive_culture.fair_layoff_or_budget_choices
  competency_key: people_management
  topic: Making reductions fairly
  difficulty: hard
  text: >-
    You must choose where to reduce effort or roles because of budget. How do you make decisions that are fair and defensible?
  expected_concepts:
  - job-related criteria set in advance
  - involvement of HR and legal processes
  - consistency
  - communication and support
  - reviewing for unintended patterns
  rubric:
    excellent: >-
      Sets criteria in advance, follows formal process, checks for unintended patterns and communicates with support.
    good: Uses criteria and process.
    weak: Decides informally by preference.
  followups:
  - How do you handle those remaining?
  - What did you check afterwards?
  common_errors:
  - 'Answering in the weak pattern: decides informally by preference'

- external_key: leadership.inclusive_culture.disagreement_with_hr_process
  competency_key: people_management
  topic: When a policy seems unfair
  difficulty: hard
  text: >-
    A company policy you must follow seems to produce an unfair result for someone on your team. What do you do?
  expected_concepts:
  - complying while raising concerns
  - documenting the case
  - proposing an exception route or change
  - supporting the person
  - escalating respectfully
  rubric:
    excellent: >-
      Complies, raises the concern with evidence, proposes a route, supports the person and escalates respectfully.
    good: Raises the concern.
    weak: Ignores the policy or the person.
  followups:
  - What happened to the person?
  - What changed?
  common_errors:
  - 'Answering in the weak pattern: ignores the policy or the person'

- external_key: leadership.inclusive_culture.cross_team_inclusion_failure
  competency_key: collaboration
  topic: A partner team that excludes yours
  difficulty: hard
  text: >-
    Another team consistently leaves yours out of decisions that affect you. How do you address it constructively?
  expected_concepts:
  - collecting specific instances
  - talking to their lead
  - proposing a shared forum
  - offering something of value
  - escalating if needed
  rubric:
    excellent: >-
      Collects examples, talks to the lead, proposes shared forums and escalates appropriately.
    good: Raises the issue with the lead.
    weak: Complains within the team only.
  followups:
  - What was the root cause?
  - How did the relationship change?
  common_errors:
  - 'Answering in the weak pattern: complains within the team only'

- external_key: leadership.inclusive_culture.ensuring_equal_access_to_oncall_growth
  competency_key: mentoring
  topic: Preparing everyone for responsibility
  difficulty: hard
  text: >-
    Only a few people on your team feel ready to lead incidents. How do you widen the group fairly?
  expected_concepts:
  - structured preparation
  - shadowing and reverse shadowing
  - simulations
  - fair opportunity
  - feedback
  - tracking
  rubric:
    excellent: >-
      Offers structured preparation, simulations, fair opportunities and tracks the group widening.
    good: Offers shadowing to all.
    weak: Lets the same people lead.
  followups:
  - Who stepped up?
  - What did you change in preparation?
  common_errors:
  - 'Answering in the weak pattern: lets the same people lead'
