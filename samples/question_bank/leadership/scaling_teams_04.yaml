# Curated questions: leadership round, scaling teams (part 4 of 4).
# Focus: scaling teams and organisations, team topology and ownership boundaries. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.scaling_teams.decision_rights_clear
  competency_key: leadership
  topic: Clarifying who decides
  difficulty: easy
  text: >-
    How do you clarify who gets to decide what as the number of people and teams grows?
  expected_concepts:
  - decision levels
  - named owners
  - escalation route
  - documentation
  - periodic review
  rubric:
    excellent: >-
      Defines levels, named owners and an escalation route, and shows faster decisions.
    good: Names owners for key decisions.
    weak: Leaves decisions to consensus.
  followups:
  - What happened with disputed decisions?
  - Where is it written?
  common_errors:
  - 'Answering in the weak pattern: leaves decisions to consensus'

- external_key: leadership.scaling_teams.welcoming_second_team
  competency_key: collaboration
  topic: Merging teams
  difficulty: easy
  text: >-
    Tell me about a time two groups were merged into one team. What did you do in the first month?
  expected_concepts:
  - understanding both groups' work
  - shared goals
  - clear roles
  - joint rituals
  - listening to concerns
  - early collaboration on real work
  rubric:
    excellent: >-
      Learns both groups' work, sets shared goals, listens, mixes people on real tasks and checks after a month.
    good: Holds joint sessions and clarifies roles.
    weak: Imposes one group's way.
  followups:
  - What was the biggest friction?
  - What did you keep from both?
  common_errors:
  - 'Answering in the weak pattern: imposes one group''s way'

- external_key: leadership.scaling_teams.handing_over_service
  competency_key: ownership
  topic: Transferring a service to another team
  difficulty: easy
  text: >-
    Describe how you've handed a service or area to another team. What did you give them?
  expected_concepts:
  - documentation
  - runbooks
  - knowledge transfer sessions
  - shadowing period
  - agreement on support
  - success check
  rubric:
    excellent: >-
      Provides docs, runbooks and shadowing, agrees support terms, and verifies the receiving team could operate it.
    good: Provides documentation and a handover meeting.
    weak: Hands over a link and leaves.
  followups:
  - What did the receiving team ask for?
  - How long did you remain on call?
  common_errors:
  - 'Answering in the weak pattern: hands over a link and leaves'

- external_key: leadership.scaling_teams.retaining_context_with_growth
  competency_key: communication
  topic: Keeping everyone informed
  difficulty: easy
  text: >-
    How do you ensure each person still understands the team's goals and priorities as you grow?
  expected_concepts:
  - written goals
  - regular updates
  - open forums
  - linking tasks to goals
  - asking people to explain priorities
  - feedback
  rubric:
    excellent: >-
      Shares goals in writing, updates regularly, checks understanding and corrects gaps.
    good: Shares updates regularly.
    weak: Assumes people know.
  followups:
  - How do you check?
  - What gap did you find?
  common_errors:
  - 'Answering in the weak pattern: assumes people know'

- external_key: leadership.scaling_teams.stepping_back_from_code
  competency_key: leadership
  topic: Moving from doing to leading
  difficulty: easy
  text: How did you change what you spend your time on as your team got larger?
  expected_concepts:
  - reducing hands-on coding
  - investing in planning and people
  - delegating
  - keeping enough technical contact
  - adjusting measures of your own success
  rubric:
    excellent: >-
      Describes the shift in time use, what they delegated and how they kept technical credibility.
    good: Notes a reasonable shift.
    weak: Keeps doing everything personally.
  followups:
  - What was hardest to let go?
  - What do you still do hands-on?
  common_errors:
  - 'Answering in the weak pattern: keeps doing everything personally'

- external_key: leadership.scaling_teams.distributing_expertise
  competency_key: collaboration
  topic: Spreading specialist knowledge
  difficulty: medium
  text: >-
    Only one team has deep knowledge of a key technology. How do you spread it as you scale?
  expected_concepts:
  - communities of practice
  - embedding or rotation
  - documentation
  - training
  - office hours
  - reducing single points of failure
  rubric:
    excellent: >-
      Uses several mechanisms such as rotation and training, reduces single points of failure, and shows spread of expertise.
    good: Runs training and documents.
    weak: Keeps the dependency.
  followups:
  - What worked best?
  - How did you measure spread?
  common_errors:
  - 'Answering in the weak pattern: keeps the dependency'

- external_key: leadership.scaling_teams.onboarding_buddy_system_scale
  competency_key: people_management
  topic: Scaling the buddy system
  difficulty: medium
  text: >-
    Your buddy system worked with three hires a year and now you hire thirty. What do you change?
  expected_concepts:
  - training for buddies
  - capacity limits
  - shared materials
  - cohort sessions
  - feedback
  - recognising the work
  rubric:
    excellent: >-
      Trains buddies, limits load, shares materials and cohort sessions, collects feedback and recognises the work.
    good: Keeps buddies and adds materials.
    weak: Keeps the old approach.
  followups:
  - What was the buddy load?
  - What did new hires say?
  common_errors:
  - 'Answering in the weak pattern: keeps the old approach'

- external_key: leadership.scaling_teams.rotating_people_between_teams
  competency_key: collaboration
  topic: Moving engineers between teams
  difficulty: medium
  text: >-
    Have you rotated engineers between teams? How did you decide who moves and how did you handle the handover?
  expected_concepts:
  - reasons and goals
  - voluntary and fair selection
  - timing
  - knowledge transfer
  - effect on both teams
  - review
  rubric:
    excellent: >-
      States goals, selects fairly, plans handover and timing, and reviews effects on both teams.
    good: Rotates with agreement from the people.
    weak: Moves people to fill gaps.
  followups:
  - Who volunteered?
  - What did the sending team lose?
  common_errors:
  - 'Answering in the weak pattern: moves people to fill gaps'

- external_key: leadership.scaling_teams.spotting_bottleneck_people
  competency_key: leadership
  topic: People who become bottlenecks
  difficulty: medium
  text: >-
    As the organisation grows, a few individuals become bottlenecks for reviews or decisions. How do you spread the load?
  expected_concepts:
  - identifying the bottlenecks with data
  - teaching others
  - delegating decision rights
  - documenting
  - recognising the shift
  - checking
  rubric:
    excellent: >-
      Identifies with data, builds others' capability, delegates decision rights and verifies that waiting time fell.
    good: Spreads review work.
    weak: Accepts the bottleneck.
  followups:
  - How did the bottleneck person react?
  - How long did waiting time take to fall?
  common_errors:
  - 'Answering in the weak pattern: accepts the bottleneck'

- external_key: leadership.scaling_teams.aligning_priorities_across_teams
  competency_key: stakeholder_management
  topic: Shared planning across teams
  difficulty: medium
  text: >-
    How do you run planning across several teams so priorities align without a heavy process?
  expected_concepts:
  - shared goals
  - dependency review
  - lightweight planning rhythm
  - visible plan
  - negotiation
  - trade-off ownership
  rubric:
    excellent: >-
      Uses shared goals and a lightweight rhythm, reviews dependencies, makes the plan visible and settles trade-offs.
    good: Holds a joint planning session.
    weak: Plans separately and fixes conflicts later.
  followups:
  - What did you drop from the process?
  - How did you resolve conflicts?
  common_errors:
  - 'Answering in the weak pattern: plans separately and fixes conflicts later'

- external_key: leadership.scaling_teams.documentation_debt_scale
  competency_key: communication
  topic: Knowledge that lives only in heads
  difficulty: medium
  text: >-
    In a fast-growing team important knowledge is only in people's heads. How do you capture it?
  expected_concepts:
  - identify critical knowledge
  - ask owners to document
  - make it part of work
  - review
  - use onboarding as test
  - reward
  rubric:
    excellent: >-
      Identifies critical knowledge, builds capture into work, uses newcomers to test, and rewards it.
    good: Requests documents for key areas.
    weak: Plans a documentation sprint and stops.
  followups:
  - How did newcomers help?
  - What was captured first?
  common_errors:
  - 'Answering in the weak pattern: plans a documentation sprint and stops'

- external_key: leadership.scaling_teams.technical_leadership_distribution
  competency_key: leadership
  topic: Spreading technical leadership
  difficulty: medium
  text: >-
    How do you build technical leadership across many teams so that it doesn't rest on a few people?
  expected_concepts:
  - roles for technical leads
  - development
  - shared forums
  - rotation
  - recognition
  - decision rights
  rubric:
    excellent: >-
      Creates and develops technical lead roles, sets forums and decision rights, and shows a wider base.
    good: Names leads in teams.
    weak: Relies on a central architect.
  followups:
  - How did you choose leads?
  - How do they share knowledge?
  common_errors:
  - 'Answering in the weak pattern: relies on a central architect'

- external_key: leadership.scaling_teams.cost_of_context_switching
  competency_key: project_management
  topic: Limiting people across too many teams
  difficulty: medium
  text: >-
    People are being asked to support several teams and projects. How do you limit that and why?
  expected_concepts:
  - costs of context switching
  - allocation rules
  - limit on concurrent commitments
  - transparent allocation
  - dealing with exceptions
  rubric:
    excellent: >-
      Explains the cost, limits concurrent commitments and makes allocation transparent with a clear process for exceptions.
    good: Reduces split assignments.
    weak: Spreads people thinly.
  followups:
  - What limit did you set?
  - What exceptions were allowed?
  common_errors:
  - 'Answering in the weak pattern: spreads people thinly'

- external_key: leadership.scaling_teams.handling_two_in_a_box
  competency_key: leadership
  topic: Overlapping leadership roles
  difficulty: medium
  text: >-
    Two leaders have overlapping responsibility for one area and the team is confused. How do you resolve it?
  expected_concepts:
  - gathering facts
  - defining roles and decisions
  - discussing with both
  - clear communication
  - reviewing
  rubric:
    excellent: >-
      Gathers facts, defines roles and decisions with both leaders, communicates and reviews.
    good: Clarifies roles after discussion.
    weak: Allows the confusion to continue.
  followups:
  - What did each leader want?
  - How did the team know who decides?
  common_errors:
  - 'Answering in the weak pattern: allows the confusion to continue'

- external_key: leadership.scaling_teams.designing_for_team_cognitive_load
  competency_key: system_design
  topic: Limiting what a team must know
  difficulty: medium
  text: >-
    How do you decide how much a single team can reasonably own so that it doesn't exceed what people can keep in their heads?
  expected_concepts:
  - number of services and domains
  - on-call load
  - documentation
  - complexity
  - moving responsibilities
  - indicators of overload
  rubric:
    excellent: Assesses scope with indicators, adjusts ownership and shows reduced overload.
    good: Reviews ownership occasionally.
    weak: Adds ownership with no limit.
  followups:
  - What indicators did you use?
  - What did you give up?
  common_errors:
  - 'Answering in the weak pattern: adds ownership with no limit'

- external_key: leadership.scaling_teams.planning_the_next_growth_phase
  competency_key: leadership
  topic: Preparing for the next order of magnitude
  difficulty: medium
  text: >-
    Your team is working well at its current size. How do you prepare for it being twice as large?
  expected_concepts:
  - identify what will break
  - early changes
  - hiring pipeline
  - leadership roles
  - communication
  - staged transitions
  rubric:
    excellent: >-
      Identifies likely breakpoints, prepares early changes and leadership roles, and stages the transition.
    good: Thinks about hiring and structure.
    weak: Waits until problems appear.
  followups:
  - What do you expect to break first?
  - What did you do early?
  common_errors:
  - 'Answering in the weak pattern: waits until problems appear'

- external_key: leadership.scaling_teams.measuring_team_health_at_scale
  competency_key: people_management
  topic: Seeing team health across many teams
  difficulty: medium
  text: >-
    How do you keep an accurate view of how teams are doing when you can't observe all of them?
  expected_concepts:
  - regular surveys
  - one-to-ones with leads
  - delivery and reliability data
  - skip-level conversations
  - patterns
  - follow-up
  rubric:
    excellent: >-
      Combines data and conversations, runs skip-levels, spots patterns and acts on them.
    good: Uses surveys and meetings.
    weak: Relies on reports from leads only.
  followups:
  - What pattern did you find?
  - What did you do about it?
  common_errors:
  - 'Answering in the weak pattern: relies on reports from leads only'

- external_key: leadership.scaling_teams.engineers_leave_after_reorg
  competency_key: people_management
  topic: Attrition after a restructure
  difficulty: hard
  text: After a restructure several valued engineers have left. What do you do?
  expected_concepts:
  - finding the reasons
  - talking to those who remain
  - fixing causes
  - rebuilding trust
  - handling knowledge loss
  - reviewing
  rubric:
    excellent: >-
      Finds reasons through conversations, fixes causes, handles knowledge loss and rebuilds trust.
    good: Talks to people and adjusts.
    weak: Treats it as normal churn.
  followups:
  - What reasons did you hear?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: treats it as normal churn'

- external_key: leadership.scaling_teams.architecture_as_org_design_tool
  competency_key: system_design
  topic: Using architecture to enable team independence
  difficulty: hard
  text: >-
    What architectural changes have you pushed for mainly so that teams could work independently?
  expected_concepts:
  - clear interfaces
  - reducing shared databases
  - independent deployability
  - ownership alignment
  - costs
  - sequencing
  rubric:
    excellent: >-
      Describes changes with costs and sequencing, and shows team independence improved.
    good: Pushes for interfaces and separation.
    weak: Pursues architecture purity without team benefit.
  followups:
  - What was the cost?
  - How did you measure independence?
  common_errors:
  - 'Answering in the weak pattern: pursues architecture purity without team benefit'

- external_key: leadership.scaling_teams.leading_through_hypergrowth
  competency_key: leadership
  topic: Leading through very fast growth
  difficulty: hard
  text: >-
    Describe a period of very fast growth you led. How did your role and priorities change over the period?
  expected_concepts:
  - early signs
  - priorities per stage
  - structure changes
  - people changes
  - your own growth
  - results
  - regrets
  rubric:
    excellent: >-
      Describes stages, priority shifts, structural changes and own learning, with results and regrets.
    good: Gives a clear account with changes.
    weak: Describes growth as only positive.
  followups:
  - What would you do differently?
  - What broke at each stage?
  common_errors:
  - 'Answering in the weak pattern: describes growth as only positive'

- external_key: leadership.scaling_teams.coaching_leaders_through_split
  competency_key: mentoring
  topic: Supporting leads through a team split
  difficulty: hard
  text: >-
    You split a team and put two newly appointed leads in charge. How did you support them through the first six months?
  expected_concepts:
  - expectations and decision rights
  - regular coaching
  - shared context
  - early check-ins on team health
  - stepping in rarely
  - feedback on both leads
  rubric:
    excellent: >-
      Sets rights and expectations, coaches regularly, checks team health, steps in sparingly and shows both leads succeeding.
    good: Supports leads with meetings and advice.
    weak: Leaves them alone after announcing the split.
  followups:
  - What did each lead struggle with?
  - When did you step in?
  common_errors:
  - 'Answering in the weak pattern: leaves them alone after announcing the split'

- external_key: leadership.scaling_teams.regional_expansion_fairness
  competency_key: stakeholder_management
  topic: Dividing work between sites
  difficulty: hard
  text: >-
    Leadership wants to expand to a second site, and teams worry about losing interesting work. How do you plan the division
    of work?
  expected_concepts:
  - ownership principles
  - career paths at both sites
  - communication
  - shared standards
  - leadership presence
  - reviewing fairness
  rubric:
    excellent: >-
      Uses ownership principles, ensures career paths at both sites, communicates openly and reviews fairness.
    good: Divides by area and communicates.
    weak: Moves routine work to the new site.
  followups:
  - What did the existing team say?
  - What did the new site own?
  common_errors:
  - 'Answering in the weak pattern: moves routine work to the new site'

- external_key: leadership.scaling_teams.when_the_structure_must_change_again
  competency_key: leadership
  topic: Revisiting a structure you created
  difficulty: hard
  text: >-
    A structure you designed six months ago isn't working. How do you decide whether to adjust or hold, and what do you tell
    the team?
  expected_concepts:
  - evidence
  - cost of change
  - options
  - consulting
  - admitting the design flaw
  - communication
  - timing
  rubric:
    excellent: >-
      Uses evidence, weighs the cost of change, consults, owns the flaw and communicates clearly.
    good: Adjusts after review.
    weak: Defends the structure or changes it repeatedly.
  followups:
  - What evidence convinced you?
  - How did the team react?
  common_errors:
  - 'Answering in the weak pattern: defends the structure or changes it repeatedly'

- external_key: leadership.scaling_teams.preserving_expertise_in_reorg
  competency_key: system_design
  topic: Keeping deep knowledge in a restructure
  difficulty: hard
  text: >-
    A restructure would spread a small group of specialists across several teams. How do you keep the deep knowledge alive?
  expected_concepts:
  - community of practice
  - rotations
  - documentation
  - key contacts
  - deliberate pairing
  - measuring knowledge health
  rubric:
    excellent: >-
      Builds a community, sets rotations and pairing, documents, and tracks knowledge health.
    good: Creates a regular forum.
    weak: Ignores the knowledge risk.
  followups:
  - What knowledge was most at risk?
  - How did you measure?
  common_errors:
  - 'Answering in the weak pattern: ignores the knowledge risk'

- external_key: leadership.scaling_teams.measuring_org_design_success
  competency_key: project_management
  topic: Judging whether a reorganisation worked
  difficulty: hard
  text: >-
    How do you decide, a year after a reorganisation, whether it has actually helped?
  expected_concepts:
  - goals set beforehand
  - delivery and wait-time measures
  - people measures
  - qualitative feedback
  - unexpected effects
  - decision to adjust
  rubric:
    excellent: >-
      Sets goals beforehand, uses delivery and people measures with qualitative feedback, notes unintended effects and decides
      what to adjust.
    good: Reviews measures and feedback.
    weak: Judges by whether people complain.
  followups:
  - What measure surprised you?
  - What did you adjust?
  common_errors:
  - 'Answering in the weak pattern: judges by whether people complain'
