# Curated questions: leadership round, driving change (part 3 of 4). Standards, practices, incremental migrations, cultural change and large moves. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.driving_change.change_versus_improvement
  competency_key: leadership
  topic: Deciding whether something is worth a formal change
  difficulty: easy
  text: >-
    How do you tell the difference between a small improvement you can just make and a change that needs
    a plan, sign-off and communication?
  expected_concepts:
  - number of people and systems affected
  - reversibility
  - effort for others to adapt
  - risk if it goes wrong
  - who needs to be consulted
  rubric:
    excellent: >-
      Gives a practical test based on who is affected, reversibility and risk, with examples of each side
      and how they handled the consultation.
    good: Gives sensible criteria with one example.
    weak: Treats every change as needing heavy process or none at all.
  followups:
  - Where did you misjudge it once?
  - Who do you consult for a borderline case?
  common_errors:
  - Treats every change as needing heavy process or none at all.

- external_key: leadership.driving_change.write_change_faq
  competency_key: communication
  topic: Answering questions before they are asked
  difficulty: easy
  text: >-
    Before you roll out a change, how do you work out what people will want to know, and where do you
    put the answers?
  expected_concepts:
  - asking a few affected people for their questions
  - covering why, what changes, what stays, what is required of them
  - one findable place
  - updating from real questions
  rubric:
    excellent: >-
      Collects likely questions from affected people, answers why, what and what is needed, keeps one
      findable place and updates it from real questions.
    good: Prepares an FAQ or announcement covering the main points.
    weak: Explains the change only when asked.
  followups:
  - What was the question you hadn't expected?
  - Where do people look for it?
  common_errors:
  - Explains the change only when asked.

- external_key: leadership.driving_change.listen_to_resistance_one_to_one
  competency_key: collaboration
  topic: A one-to-one with someone who opposes a change
  difficulty: easy
  text: >-
    Someone on your team is clearly unhappy about a change you are driving. How do you approach the first
    conversation with them?
  expected_concepts:
  - asking open questions before explaining
  - listening for specific concerns
  - separating valid concerns from habit
  - acknowledging what they raise
  - agreeing next steps
  rubric:
    excellent: >-
      Opens with questions, identifies specific concerns, separates valid risks from habit, acknowledges
      them and agrees a concrete next step.
    good: Listens and explains the reasons.
    weak: Argues the case immediately or avoids the conversation.
  followups:
  - What did you learn that changed your plan?
  - What if they remain unconvinced?
  common_errors:
  - Starting by defending the change instead of asking what worries them.

- external_key: leadership.driving_change.choosing_change_champions
  competency_key: leadership
  topic: Picking people to help carry a change
  difficulty: easy
  text: >-
    When you want help carrying a change across a group, how do you choose who to ask and what do you
    ask them to do?
  expected_concepts:
  - respected by peers
  - close to the daily work
  - mix of enthusiasts and sceptics
  - clear and bounded role
  - recognition for their effort
  rubric:
    excellent: >-
      Picks respected and varied people, defines a clear bounded role, recognises their time and shows
      how they helped.
    good: Chooses willing and credible people with a clear request.
    weak: Chooses only friends or volunteers without clear tasks.
  followups:
  - Would you include a sceptic?
  - How do you avoid overloading champions?
  common_errors:
  - Chooses only friends or volunteers without clear tasks.

- external_key: leadership.driving_change.small_process_tweak
  competency_key: ownership
  topic: Introducing a small improvement yourself
  difficulty: easy
  text: >-
    Tell me about a small improvement to how your team works that you introduced yourself. How did you
    get it started and keep it going?
  expected_concepts:
  - noticing a real pain
  - proposing a small trial
  - asking for volunteers
  - checking result after a short time
  - keeping or dropping it
  rubric:
    excellent: >-
      Shows a real pain point, a small time-boxed trial, a check on results, and a decision to keep or
      drop, with the effect on the team.
    good: Describes introducing an improvement and its effect.
    weak: Describes a change imposed without testing or follow-up.
  followups:
  - How long was the trial?
  - What would you do differently?
  common_errors:
  - Describes a change imposed without testing or follow-up.

- external_key: leadership.driving_change.consumers_of_api_version
  competency_key: project_management
  topic: Moving consumers to a new interface version
  difficulty: medium
  text: >-
    You've built a new version of an interface used by many internal consumers. How do you get them to
    move without breaking things?
  expected_concepts:
  - finding all consumers
  - compatibility period
  - migration guides and tooling
  - deprecation warnings and dates
  - tracking per-consumer progress
  rubric:
    excellent: >-
      Inventories consumers, offers a compatibility period, tooling and guides, issues warnings with dates
      and tracks progress per consumer, and handles the stragglers.
    good: Provides guides and a deadline.
    weak: Announces the new version and removes the old one.
  followups:
  - How did you find unknown consumers?
  - What did you do about those that missed the date?
  common_errors:
  - Announces the new version and removes the old one.

- external_key: leadership.driving_change.code_review_standard
  competency_key: collaboration
  topic: Introducing a shared code review standard
  difficulty: medium
  text: >-
    You want several teams to adopt a common code review standard. How do you introduce it so it is used
    and not resented?
  expected_concepts:
  - involving reviewers in drafting
  - starting with the highest-value rules
  - automating where possible
  - pilot teams
  - revisiting rules with feedback
  rubric:
    excellent: >-
      Drafts with reviewers, starts with high-value rules, automates checks, pilots with a team and revises
      rules from feedback.
    good: Drafts a standard with input and rolls it out.
    weak: Publishes a long document and expects compliance.
  followups:
  - Which rule was contested?
  - How did you automate it?
  common_errors:
  - Publishes a long document and expects compliance.

- external_key: leadership.driving_change.testing_practice_adoption
  competency_key: mentoring
  topic: Raising testing practice across a team
  difficulty: medium
  text: >-
    Tell me about a time you helped a team build a stronger testing habit. What did you actually do?
  expected_concepts:
  - starting from a pain point
  - making tests easy to write
  - pairing and examples
  - gating sensibly in the pipeline
  - measuring escaped defects
  rubric:
    excellent: >-
      Starts from a concrete pain, reduces friction, pairs and shows examples, adds sensible pipeline
      checks and measures defects or confidence.
    good: Encourages tests, adds some tooling and sees improvement.
    weak: Mandates coverage numbers without helping.
  followups:
  - Which metric did you avoid?
  - How did you deal with legacy code?
  common_errors:
  - Using a coverage target as the only measure.

- external_key: leadership.driving_change.observability_adoption
  competency_key: leadership
  topic: Getting teams to instrument their services
  difficulty: medium
  text: >-
    How would you get a set of teams to adopt consistent monitoring and tracing for their services when
    each has other priorities?
  expected_concepts:
  - showing value through a real incident
  - providing libraries and templates
  - defining a minimum standard
  - offering help
  - including it in launch checklists
  rubric:
    excellent: >-
      Shows value via a real incident, provides libraries and templates, defines a minimum standard, helps
      teams adopt and adds it to launch checks.
    good: Provides tools and a standard with some support.
    weak: Issues a mandate without tools.
  followups:
  - What was the first team to adopt?
  - How did you decide the minimum?
  common_errors:
  - Issues a mandate without tools.

- external_key: leadership.driving_change.security_practice_shift
  competency_key: stakeholder_management
  topic: Moving security checks earlier in delivery
  difficulty: medium
  text: >-
    Security reviews currently happen at the end of projects, causing delays. How would you drive a move
    to checking earlier?
  expected_concepts:
  - understanding current delays
  - automating common checks
  - involving security earlier in design
  - clear self-service guidance
  - measuring findings and lead time
  rubric:
    excellent: >-
      Analyses delays, automates common checks, involves security at design time, gives self-service guidance
      and measures findings and lead time.
    good: Adds earlier checks and communication.
    weak: Adds more approvals at the end.
  followups:
  - What did security teams worry about?
  - What did you measure?
  common_errors:
  - Adds more approvals at the end.

- external_key: leadership.driving_change.oncall_rotation_change
  competency_key: ownership
  topic: Changing how on-call works
  difficulty: medium
  text: >-
    You want to change the on-call arrangement so it is fairer and more sustainable. How do you make that
    change?
  expected_concepts:
  - collecting data on load and incidents
  - consulting those on call
  - testing the new rotation
  - improving alerts as part of it
  - reviewing after a cycle
  rubric:
    excellent: >-
      Uses data on load and incidents, consults the people involved, trials the rotation, fixes noisy
      alerts and reviews after a cycle.
    good: Consults the team and trials a new rotation.
    weak: Announces a new rotation without data or input.
  followups:
  - What did the data show?
  - What was the hardest objection?
  common_errors:
  - Announces a new rotation without data or input.

- external_key: leadership.driving_change.monolith_split_incremental
  competency_key: leadership
  topic: Splitting a large system incrementally
  difficulty: medium
  text: >-
    You are leading the effort to break a large system into smaller parts. How do you structure the work
    to get value early and avoid a stalled rewrite?
  expected_concepts:
  - choosing seams by pain and change frequency
  - strangler-style incremental moves
  - keeping delivery of features going
  - measuring benefit
  - stopping criteria
  rubric:
    excellent: >-
      Chooses seams by pain, moves incrementally, keeps features flowing, measures benefits and sets criteria
      for stopping or changing course.
    good: Plans incremental extraction with some measurement.
    weak: Plans a full rewrite before delivering any value.
  followups:
  - Which piece did you move first and why?
  - How did you keep the team motivated?
  common_errors:
  - Plans a full rewrite before delivering any value.

- external_key: leadership.driving_change.standards_enforced_by_tooling
  competency_key: leadership
  topic: Using tooling to make a standard stick
  difficulty: medium
  text: >-
    When you introduce a coding or configuration standard, how do you decide what to enforce with tools
    and what to leave to judgement?
  expected_concepts:
  - automate objective rules
  - keep rules few
  - allow documented exceptions
  - keep false positives low
  - revisit rules
  rubric:
    excellent: >-
      Automates objective rules, keeps the rule set small, supports documented exceptions, watches false
      positives and revisits rules regularly.
    good: Uses linters and reviews sensibly.
    weak: Enforces many rules without exceptions or ignores tooling.
  followups:
  - How do you handle exceptions?
  - What did you drop?
  common_errors:
  - Enforces many rules without exceptions or ignores tooling.

- external_key: leadership.driving_change.incremental_vs_big_bang
  competency_key: leadership
  topic: Choosing between gradual and all-at-once
  difficulty: medium
  text: >-
    How do you decide between a gradual rollout and a single big switch for a change?
  expected_concepts:
  - coupling of the parts
  - cost of running two ways
  - risk and reversibility
  - user disruption
  - ability to learn between steps
  rubric:
    excellent: >-
      Weighs coupling, cost of overlap, reversibility and learning opportunities, with an example of choosing
      each and the result.
    good: Prefers gradual with sound reasons and an example.
    weak: Always chooses one approach without weighing the situation.
  followups:
  - When is big bang the right choice?
  - What did the overlap cost?
  common_errors:
  - Always chooses one approach without weighing the situation.

- external_key: leadership.driving_change.exec_changes_mind
  competency_key: stakeholder_management
  topic: A sponsor who changes direction mid-change
  difficulty: medium
  text: >-
    A senior sponsor who started a change shifts their view halfway through. How do you respond?
  expected_concepts:
  - understanding what changed
  - clarifying whether it is the goal or method
  - showing what has been invested and achieved
  - proposing options
  - getting a clear decision
  rubric:
    excellent: >-
      Finds out what changed, separates goal from method, shows progress and costs, proposes options and
      gets a clear decision.
    good: Talks to the sponsor and adapts.
    weak: Continues unchanged or drops the effort without discussion.
  followups:
  - What options did you offer?
  - How did you tell the team?
  common_errors:
  - Continues unchanged or drops the effort without discussion.

- external_key: leadership.driving_change.cultural_blameless
  competency_key: leadership
  topic: Changing how a group treats mistakes
  difficulty: hard
  text: >-
    You want a team or group to move from blaming individuals for failures to learning from them. How
    do you drive that change?
  expected_concepts:
  - modelling it as a leader
  - reviewing process and system causes
  - sharing review outputs openly
  - handling accountability fairly
  - patience with setbacks
  rubric:
    excellent: >-
      Models the behaviour, reviews system causes, shares outputs, balances learning with fair accountability
      and describes setbacks and persistence.
    good: Introduces reviews and encourages learning.
    weak: Declares a no-blame policy without changing the behaviour.
  followups:
  - How do you handle a repeated mistake?
  - What was a setback?
  common_errors:
  - Announcing no-blame while still singling out individuals.

- external_key: leadership.driving_change.language_migration_org
  competency_key: leadership
  topic: Moving many teams to a new language or framework
  difficulty: hard
  text: >-
    Describe or design how you would move a large part of an organisation to a new language or framework.
    How do you decide it is worth it and keep it from stalling?
  expected_concepts:
  - clear problem and measurable goal
  - pilots
  - training and hiring effects
  - interoperability during the transition
  - limiting scope to what needs moving
  rubric:
    excellent: >-
      Anchors in a measurable problem, pilots, plans training and interoperability, limits scope, and
      sets points to stop or continue.
    good: Plans stages with pilots and training.
    weak: Adopts for taste or plans a complete rewrite.
  followups:
  - What would make you stop?
  - How do you handle teams that don't need to move?
  common_errors:
  - Adopts for taste or plans a complete rewrite.

- external_key: leadership.driving_change.regulatory_deadline_change
  competency_key: project_management
  topic: A required change with a fixed legal deadline
  difficulty: hard
  text: >-
    A regulation requires a major change by a fixed date, and your plan shows it is tight. How do you
    handle it?
  expected_concepts:
  - confirming the exact requirement
  - descoping to the minimum compliant version
  - protecting the critical path
  - early engagement with legal
  - tracking and escalating risk transparently
  rubric:
    excellent: >-
      Clarifies the exact requirement, scopes the minimum compliant version, protects the critical path,
      engages legal early and reports risk transparently.
    good: Prioritises the work and reports progress.
    weak: >-
      Treats the date as negotiable or delivers the full scope at the cost of the deadline.
  followups:
  - What did you cut?
  - What would you escalate and when?
  common_errors:
  - >-
    Treats the date as negotiable or delivers the full scope at the cost of the deadline.

- external_key: leadership.driving_change.cloud_migration_large
  competency_key: project_management
  topic: A large infrastructure move
  difficulty: hard
  text: >-
    Tell me about moving a large portfolio of systems to a new platform or environment. How did you sequence
    it and manage risk?
  expected_concepts:
  - inventory and dependency map
  - wave planning
  - easy wins first and hard ones with extra planning
  - rollback and parity checks
  - communication and support
  rubric:
    excellent: >-
      Builds inventory and dependency map, plans waves, tackles easy and hard systems appropriately, uses
      rollback and parity checks, and supports owners.
    good: Plans waves and manages risks.
    weak: Moves systems ad hoc without dependency knowledge.
  followups:
  - Which wave went worst?
  - How did you handle systems with no owner?
  common_errors:
  - Moves systems ad hoc without dependency knowledge.

- external_key: leadership.driving_change.change_during_reorg
  competency_key: adaptability
  topic: Keeping a change alive during organisational change
  difficulty: hard
  text: >-
    A change you are driving is affected when the organisation restructures and some of its supporters
    move. What do you do?
  expected_concepts:
  - re-mapping stakeholders
  - briefing new owners
  - simplifying the case
  - documenting decisions so they survive
  - deciding whether the change still makes sense
  rubric:
    excellent: >-
      Re-maps stakeholders, briefs new owners, restates the case simply, documents decisions, and reassesses
      whether the change still makes sense.
    good: Updates the right people and continues.
    weak: Waits for things to settle or assumes support continues.
  followups:
  - Who was your new sponsor?
  - Did you change the plan?
  common_errors:
  - Waits for things to settle or assumes support continues.

- external_key: leadership.driving_change.acquired_team_practices
  competency_key: collaboration
  topic: Bringing an acquired team into your way of working
  difficulty: hard
  text: >-
    A newly joined team has different practices, and you are asked to align them with the wider organisation.
    How do you approach it?
  expected_concepts:
  - understanding their practices and reasons
  - identifying what must align versus what can differ
  - adopting good practices from them
  - staging the alignment
  - respectful communication
  rubric:
    excellent: >-
      Learns their practices and reasons, separates must-align from optional, adopts their good ideas,
      stages alignment and communicates respectfully.
    good: Aligns key practices with some consultation.
    weak: Imposes all practices at once.
  followups:
  - What did you adopt from them?
  - What was non-negotiable?
  common_errors:
  - Imposes all practices at once.

- external_key: leadership.driving_change.platform_mandate_vs_pull
  competency_key: stakeholder_management
  topic: Mandating a platform versus earning adoption
  difficulty: hard
  text: >-
    You've built an internal platform and some teams still prefer their own solutions. How do you decide
    between mandating it and earning adoption?
  expected_concepts:
  - understanding why teams stay away
  - fixing gaps
  - showing benefits with data
  - mandating only where risk or cost justifies it
  - giving a migration path
  rubric:
    excellent: >-
      Learns why teams stay away, closes gaps, shows data on benefits, mandates only where justified by
      risk or cost, and provides a migration path.
    good: Improves the platform and encourages adoption.
    weak: Mandates immediately or leaves it optional with no follow-up.
  followups:
  - Where would you mandate?
  - What if a team has a valid reason to stay?
  common_errors:
  - Mandates immediately or leaves it optional with no follow-up.

- external_key: leadership.driving_change.retire_reports_and_dashboards
  competency_key: communication
  topic: Retiring reports people still open
  difficulty: medium
  text: >-
    Your organisation has accumulated many reports and dashboards, and you want to retire most of them.
    How do you do that without upsetting the people who rely on a few?
  expected_concepts:
  - using access data to find what is unused
  - asking owners and heavy users
  - offering a replacement
  - announcing a date
  - archiving rather than deleting at first
  rubric:
    excellent: >-
      Uses access data, consults heavy users, offers replacements for the needed ones, sets a date, and
      archives before deletion.
    good: Checks usage and announces the retirement.
    weak: Deletes without checking usage or asking.
  followups:
  - How did you find the hidden dependency?
  - How did you handle the complaint?
  common_errors:
  - Deletes without checking usage or asking.

- external_key: leadership.driving_change.feature_flag_practice
  competency_key: project_management
  topic: Introducing safer release habits
  difficulty: medium
  text: >-
    You want teams to release in smaller, safer steps using feature flags or similar. How do you help
    them adopt that in practice?
  expected_concepts:
  - demonstrating with a real release
  - shared tooling and conventions
  - rules for cleaning up old flags
  - training
  - measuring release failures and recovery time
  rubric:
    excellent: >-
      Demonstrates with a real release, supplies tooling and conventions, sets flag cleanup rules, trains
      teams and measures failure and recovery rates.
    good: Introduces tooling and encourages use.
    weak: Mandates flags without cleanup rules or measurement.
  followups:
  - What happened to stale flags?
  - Which team resisted and why?
  common_errors:
  - Mandates flags without cleanup rules or measurement.

- external_key: leadership.driving_change.runbook_culture
  competency_key: ownership
  topic: Building a habit of runbooks and handover docs
  difficulty: medium
  text: >-
    Knowledge about how to operate your systems lives mostly in a few people's heads. How do you change
    that habit?
  expected_concepts:
  - starting with the most critical systems
  - making docs part of done
  - reviewing them in drills
  - recognising writers
  - keeping docs short and findable
  rubric:
    excellent: >-
      Starts with critical systems, includes docs in definition of done, tests them in drills, recognises
      writers and keeps them short and findable.
    good: Asks for docs and assigns owners.
    weak: Requests documentation as a one-off project.
  followups:
  - How do you know the docs work?
  - How do you keep them current?
  common_errors:
  - Requests documentation as a one-off project.
