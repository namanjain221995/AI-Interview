# Curated questions: leadership round, scaling teams (part 3 of 4).
# Focus: scaling teams and organisations, team topology and ownership boundaries. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.scaling_teams.cross_team_contact_points
  competency_key: collaboration
  topic: Keeping teams connected after a split
  difficulty: easy
  text: >-
    After splitting a team, how do you keep the two groups connected so they don't drift apart?
  expected_concepts:
  - shared goals
  - regular syncs
  - shared channels
  - joint demos
  - rotating people
  - common standards
  rubric:
    excellent: >-
      Uses a few light mechanisms such as shared goals and demos, and shows retained alignment.
    good: Sets up regular syncs.
    weak: Lets them drift.
  followups:
  - What was the lightest mechanism that worked?
  - What drifted?
  common_errors:
  - 'Answering in the weak pattern: lets them drift'

- external_key: leadership.scaling_teams.simple_team_charter
  competency_key: leadership
  topic: Writing a team mission
  difficulty: easy
  text: >-
    How do you describe what your team is responsible for, so people inside and outside can understand it?
  expected_concepts:
  - purpose and customers
  - what is in and out of scope
  - interfaces
  - contacts
  - reviewing as things change
  rubric:
    excellent: Writes a short charter with scope and interfaces, shares it, and updates it.
    good: Describes team responsibility clearly.
    weak: Describes it only by current tasks.
  followups:
  - What did you say was out of scope?
  - Who read it?
  common_errors:
  - 'Answering in the weak pattern: describes it only by current tasks'

- external_key: leadership.scaling_teams.sharing_on_call_after_growth
  competency_key: ownership
  topic: Adjusting on-call as the team grows
  difficulty: easy
  text: What changes with on-call duty as your team gets bigger, or splits into two?
  expected_concepts:
  - rota size
  - clarity of service ownership
  - runbooks
  - training new people
  - escalation paths
  - load fairness
  rubric:
    excellent: >-
      Updates rota and ownership together, trains people, clarifies escalation and checks load.
    good: Adjusts the rota.
    weak: Keeps the same arrangement.
  followups:
  - What went wrong at first?
  - How did you train new people?
  common_errors:
  - 'Answering in the weak pattern: keeps the same arrangement'

- external_key: leadership.scaling_teams.hiring_for_diverse_skills
  competency_key: people_management
  topic: Balancing skills in a growing team
  difficulty: easy
  text: >-
    As you add people, how do you decide what mix of seniority and skills the team needs?
  expected_concepts:
  - gaps in current skills
  - ratio of senior to junior
  - mentoring capacity
  - roadmap needs
  - team balance
  rubric:
    excellent: >-
      Reasons about gaps and mentoring capacity, plans a balanced mix, and checks its effect.
    good: Hires for visible gaps.
    weak: Hires the same profile each time.
  followups:
  - What was your seniority mix?
  - What would you change?
  common_errors:
  - 'Answering in the weak pattern: hires the same profile each time'

- external_key: leadership.scaling_teams.meeting_overhead
  competency_key: leadership
  topic: Controlling meeting load
  difficulty: easy
  text: >-
    As a team grows meetings can multiply. What do you do to keep the load manageable?
  expected_concepts:
  - purpose and owner for every meeting
  - shorter or written alternatives
  - optional attendance
  - regular audit
  - protecting focus time
  rubric:
    excellent: Audits meetings, removes or replaces them, and measures time recovered.
    good: Cuts some meetings.
    weak: Accepts the growth.
  followups:
  - Which meeting did you remove?
  - How did you measure?
  common_errors:
  - 'Answering in the weak pattern: accepts the growth'

- external_key: leadership.scaling_teams.experienced_vs_new_ratios
  competency_key: people_management
  topic: Balancing experience on a growing team
  difficulty: medium
  text: >-
    Your team has doubled and now has far more newer engineers than experienced ones. How do you maintain quality and speed?
  expected_concepts:
  - pairing and review capacity
  - clearer standards
  - guardrails in tooling
  - scope of independent decisions
  - senior focus
  - hiring more senior people
  rubric:
    excellent: >-
      Protects review and mentoring capacity, adds guardrails and standards, adjusts scope and hires to restore balance.
    good: Increases pairing and review.
    weak: Expects the old speed immediately.
  followups:
  - What quality signals did you watch?
  - What did you stop expecting?
  common_errors:
  - 'Answering in the weak pattern: expects the old speed immediately'

- external_key: leadership.scaling_teams.engineering_metrics_for_scale
  competency_key: project_management
  topic: Measuring a growing organisation
  difficulty: medium
  text: >-
    What measures do you use to know whether your teams are getting faster or slower as they grow?
  expected_concepts:
  - delivery frequency and lead time
  - reliability
  - wait times between teams
  - engagement
  - avoiding gaming
  - trends rather than snapshots
  rubric:
    excellent: >-
      Chooses a few measures including wait time, interprets trends, avoids gaming and acts on them.
    good: Tracks common delivery measures.
    weak: Measures activity such as lines or tickets.
  followups:
  - What did the measures show?
  - How did you avoid gaming?
  common_errors:
  - 'Answering in the weak pattern: measures activity such as lines or tickets'

- external_key: leadership.scaling_teams.handling_the_overlooked_team
  competency_key: stakeholder_management
  topic: A team nobody pays attention to
  difficulty: medium
  text: >-
    One of the teams in your area is doing important but invisible work and is losing support. What do you do?
  expected_concepts:
  - describing its value
  - linking to company goals
  - getting stakeholder attention
  - fair resourcing
  - recognising the work
  rubric:
    excellent: >-
      Describes its value in terms stakeholders care about, secures attention and resources, and recognises the team.
    good: Raises the profile of the team.
    weak: Leaves the team alone.
  followups:
  - How did you show value?
  - What resources did you get?
  common_errors:
  - 'Answering in the weak pattern: leaves the team alone'

- external_key: leadership.scaling_teams.growth_through_acquisition
  competency_key: leadership
  topic: Integrating newly joined teams
  difficulty: medium
  text: >-
    Your organisation absorbed a team from another company or department. How did you integrate it?
  expected_concepts:
  - learning their way of working
  - shared goals
  - respect for what they do well
  - clear roles
  - early joint work
  - patience
  rubric:
    excellent: >-
      Learns, finds shared goals, preserves useful practices, defines roles and creates joint work, with measured integration.
    good: Organises introductions and roles.
    weak: Forces the new team to adopt everything.
  followups:
  - What did you adopt from them?
  - What took longest?
  common_errors:
  - 'Answering in the weak pattern: forces the new team to adopt everything'

- external_key: leadership.scaling_teams.planning_for_regional_teams
  competency_key: project_management
  topic: Adding a team in another location
  difficulty: medium
  text: >-
    You're opening a team in another region or time zone. What do you plan to make it work?
  expected_concepts:
  - ownership of whole areas
  - overlap hours
  - communication practices
  - initial exchange of people
  - leadership presence
  - documentation
  rubric:
    excellent: >-
      Gives the new team whole ownership, plans overlap and rituals, exchanges people and documents, with evidence it worked.
    good: Plans overlap and communication.
    weak: Gives them leftover tasks.
  followups:
  - What did you give them to own?
  - What went wrong first?
  common_errors:
  - 'Answering in the weak pattern: gives them leftover tasks'

- external_key: leadership.scaling_teams.cost_of_growth
  competency_key: stakeholder_management
  topic: Justifying team growth
  difficulty: medium
  text: >-
    How do you make the case to leadership for adding headcount, and what evidence do you bring?
  expected_concepts:
  - demand from roadmap
  - current load and delivery data
  - options other than hiring
  - costs and benefits
  - risks of not hiring
  rubric:
    excellent: >-
      Presents demand, current load and alternatives with costs and risks, and gets a clear decision.
    good: Argues from workload and goals.
    weak: Asks without evidence.
  followups:
  - What alternatives did you consider?
  - What did you get?
  common_errors:
  - 'Answering in the weak pattern: asks without evidence'

- external_key: leadership.scaling_teams.scaling_support_and_triage
  competency_key: project_management
  topic: Handling incoming requests at scale
  difficulty: medium
  text: As more teams depend on yours, requests flood in. How do you manage the intake?
  expected_concepts:
  - single intake path
  - triage rules
  - capacity allocation
  - transparency of priority
  - saying no
  - reviewing
  rubric:
    excellent: >-
      Sets one intake with triage rules and capacity, shows priorities transparently, and says no clearly.
    good: Collects requests and prioritises.
    weak: Accepts requests informally from anyone.
  followups:
  - What percentage of capacity did you allocate?
  - What did you say no to?
  common_errors:
  - 'Answering in the weak pattern: accepts requests informally from anyone'

- external_key: leadership.scaling_teams.sub_team_goals
  competency_key: leadership
  topic: Goals for split teams
  difficulty: medium
  text: >-
    How do you set goals for sub-teams so they work toward a shared outcome and not just their own metrics?
  expected_concepts:
  - shared top-level goal
  - sub-team contributions
  - avoiding conflicting measures
  - review together
  - trade-off rules
  rubric:
    excellent: >-
      Aligns sub-team goals to a shared outcome, avoids conflicts, reviews jointly and resolves trade-offs.
    good: Sets goals that connect.
    weak: Sets separate goals that conflict.
  followups:
  - Where did goals conflict?
  - How did you resolve it?
  common_errors:
  - 'Answering in the weak pattern: sets separate goals that conflict'

- external_key: leadership.scaling_teams.architecture_review_scale
  competency_key: system_design
  topic: Reviewing designs across many teams
  difficulty: medium
  text: >-
    How do you review designs when many teams are making decisions at the same time, without becoming a bottleneck?
  expected_concepts:
  - tiering by risk
  - lightweight templates
  - delegated reviewers
  - async reviews
  - shared principles
  - learning from outcomes
  rubric:
    excellent: >-
      Uses risk tiers and delegated reviewers, async process and principles, and avoids delays.
    good: Reviews important designs with templates.
    weak: Reviews everything personally.
  followups:
  - What counts as high risk?
  - How did you reduce waiting?
  common_errors:
  - 'Answering in the weak pattern: reviews everything personally'

- external_key: leadership.scaling_teams.growing_pains_story
  competency_key: leadership
  topic: Your toughest growth stage
  difficulty: medium
  text: >-
    Describe the hardest stage of growth you've led through. What was breaking, and what did you do?
  expected_concepts:
  - specific symptoms
  - root causes
  - actions
  - trade-offs
  - results
  - lessons
  rubric:
    excellent: >-
      Describes symptoms and root causes, specific actions and trade-offs, measurable results and lessons.
    good: Gives a clear story with actions.
    weak: Gives a vague account.
  followups:
  - What would you do sooner?
  - What did it cost?
  common_errors:
  - 'Answering in the weak pattern: gives a vague account'

- external_key: leadership.scaling_teams.outgrowing_a_process
  competency_key: project_management
  topic: A process that stopped working
  difficulty: medium
  text: >-
    Tell me about a process that worked for a small team and stopped working at scale. How did you replace it?
  expected_concepts:
  - how you noticed
  - why it failed
  - options
  - pilot
  - communication
  - measures
  rubric:
    excellent: >-
      Describes signals, causes, options and a piloted replacement with measured improvement.
    good: Replaces the process after discussion.
    weak: Keeps the process longer than it works.
  followups:
  - Who resisted?
  - How did you pilot?
  common_errors:
  - 'Answering in the weak pattern: keeps the process longer than it works'

- external_key: leadership.scaling_teams.cross_team_on_call_escalation
  competency_key: ownership
  topic: Escalation across teams
  difficulty: medium
  text: >-
    When an incident crosses several teams' services, how do you make sure it is clear who responds and who leads?
  expected_concepts:
  - defined incident roles
  - service ownership map
  - escalation paths
  - practice
  - review after incidents
  - clear authority
  rubric:
    excellent: >-
      Defines roles and escalation, maps ownership, practices and reviews, and shows faster coordination.
    good: Defines escalation paths.
    weak: Lets teams work it out in the moment.
  followups:
  - How do you practise?
  - What went wrong last time?
  common_errors:
  - 'Answering in the weak pattern: lets teams work it out in the moment'

- external_key: leadership.scaling_teams.clear_career_paths_at_scale
  competency_key: people_management
  topic: Career paths for more people
  difficulty: medium
  text: >-
    With more people and levels, how do you keep career paths and expectations clear and consistent?
  expected_concepts:
  - written level criteria
  - calibration across teams
  - examples
  - communicating
  - fairness checks
  - reviewing
  rubric:
    excellent: Writes criteria, calibrates across teams, communicates and checks fairness.
    good: Writes expectations.
    weak: Each manager decides alone.
  followups:
  - How do you calibrate?
  - What examples do you use?
  common_errors:
  - 'Answering in the weak pattern: each manager decides alone'

- external_key: leadership.scaling_teams.handling_growth_and_budget_cut
  competency_key: leadership
  topic: Growing one area while cutting another
  difficulty: hard
  text: >-
    Budget forces you to reduce one team while another needs more people. How do you manage both?
  expected_concepts:
  - criteria for allocation
  - transparent reasoning
  - redeployment
  - communication
  - support
  - reviewing
  rubric:
    excellent: >-
      Sets criteria, redeploys where possible, communicates reasons openly and supports affected people.
    good: Moves some people and explains.
    weak: Cuts without explanation.
  followups:
  - Who moved?
  - How did the affected team react?
  common_errors:
  - 'Answering in the weak pattern: cuts without explanation'

- external_key: leadership.scaling_teams.scaling_trust
  competency_key: leadership
  topic: Keeping trust as you move farther from the work
  difficulty: hard
  text: >-
    As your organisation grows you are further from the day-to-day work. How do you keep trust and good information?
  expected_concepts:
  - skip-levels
  - visible presence
  - open channels
  - sampling the work
  - responding to bad news
  - sharing context
  rubric:
    excellent: >-
      Uses skip-levels and sampling, makes bad news safe, shares context and demonstrates trust built.
    good: Holds open sessions.
    weak: Relies on summaries.
  followups:
  - What did you learn from a skip-level?
  - What bad news reached you?
  common_errors:
  - 'Answering in the weak pattern: relies on summaries'

- external_key: leadership.scaling_teams.consolidating_services_and_teams
  competency_key: system_design
  topic: Reducing sprawl
  difficulty: hard
  text: >-
    Your organisation has many small teams and services, with high overhead. How do you decide what to consolidate?
  expected_concepts:
  - costs of overhead
  - ownership clarity
  - coupling
  - value of autonomy
  - consolidation plan
  - gradual change
  rubric:
    excellent: >-
      Analyses overhead and coupling, picks consolidation targets, plans gradually and measures savings.
    good: Consolidates after analysis.
    weak: Consolidates arbitrarily.
  followups:
  - What did you keep separate?
  - What savings did you see?
  common_errors:
  - 'Answering in the weak pattern: consolidates arbitrarily'

- external_key: leadership.scaling_teams.decision_on_build_internal_team
  competency_key: stakeholder_management
  topic: Building a team versus buying capacity
  difficulty: hard
  text: >-
    Should you build an internal team for a new capability or use vendors or contractors? How do you decide at scale?
  expected_concepts:
  - strategic importance
  - cost over time
  - knowledge retention
  - hiring difficulty
  - risk
  - exit plan
  rubric:
    excellent: >-
      Weighs strategic value, cost over time, risk and exit plans, and decides with evidence.
    good: Compares cost and risk.
    weak: Chooses on short-term cost.
  followups:
  - What would change your answer?
  - How did you plan the exit?
  common_errors:
  - 'Answering in the weak pattern: chooses on short-term cost'

- external_key: leadership.scaling_teams.stalled_growth_plan
  competency_key: project_management
  topic: When hiring falls behind the plan
  difficulty: hard
  text: >-
    Hiring is far behind the plan and delivery commitments depend on it. What do you do?
  expected_concepts:
  - diagnosing the pipeline
  - improving conversion
  - reducing scope
  - contractors or reallocation
  - communication
  - revised plan
  rubric:
    excellent: >-
      Diagnoses the pipeline, improves it, adjusts scope or capacity, communicates and revises the plan.
    good: Adjusts the plan and pushes recruiting.
    weak: Waits and keeps commitments unchanged.
  followups:
  - What was the pipeline problem?
  - What scope did you cut?
  common_errors:
  - 'Answering in the weak pattern: waits and keeps commitments unchanged'

- external_key: leadership.scaling_teams.cultural_dilution_risk
  competency_key: culture_values
  topic: New hires outnumber existing team
  difficulty: hard
  text: >-
    New people now outnumber the original team and the way you work is changing. How do you handle it?
  expected_concepts:
  - naming core practices
  - involving new people
  - adapting practices
  - coaching leaders
  - reviewing
  - letting go of habits
  rubric:
    excellent: >-
      Names practices that matter, involves new people, lets go of what no longer fits and checks results.
    good: Teaches new people existing practices.
    weak: Insists nothing should change.
  followups:
  - What changed?
  - What stayed?
  common_errors:
  - 'Answering in the weak pattern: insists nothing should change'

- external_key: leadership.scaling_teams.multi_site_ownership
  competency_key: ownership
  topic: Ownership split across locations
  difficulty: hard
  text: >-
    A service is worked on by teams in two locations and quality is slipping. How do you restructure ownership?
  expected_concepts:
  - single accountable owner
  - clear boundaries
  - communication practices
  - on-call alignment
  - shared standards
  - review
  rubric:
    excellent: >-
      Assigns a single accountable owner, defines boundaries and on-call, sets communication and standards, and shows quality
      recovering.
    good: Clarifies roles and communication.
    weak: Keeps joint ownership.
  followups:
  - Who became the owner?
  - How did on-call change?
  common_errors:
  - 'Answering in the weak pattern: keeps joint ownership'
