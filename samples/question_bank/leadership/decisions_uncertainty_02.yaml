# Curated questions: leadership round, decisions under uncertainty (part 2 of 4). Pre-mortems, reversals, staged commitments, stakeholder risk and judging decisions. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.decisions_uncertainty.premortem_before_commit
  competency_key: leadership
  topic: Imagining failure before committing
  difficulty: easy
  text: >-
    Before a big commitment, some leaders run a pre-mortem, where the team imagines the project has failed
    and works out why. Have you used something like that, and what came out of it?
  expected_concepts:
  - asking the team to name likely causes of failure
  - surfacing risks people hesitate to raise
  - turning risks into mitigations or checks
  - deciding what changed in the plan
  rubric:
    excellent: >-
      Describes a real pre-mortem or similar exercise, how risks were gathered from quiet voices, and
      a specific change to the plan or a monitoring check that resulted.
    good: >-
      Explains the idea and gives a reasonable example, with limited detail on what changed afterwards.
    weak: >-
      Only describes the technique in theory or says risks were discussed without any resulting action.
  followups:
  - Who spoke up that normally would not?
  - Which risk turned out to be real?
  common_errors:
  - Listing risks without assigning anyone to act on them.

- external_key: leadership.decisions_uncertainty.decision_log_habit
  competency_key: communication
  topic: Recording why a decision was made
  difficulty: easy
  text: >-
    How do you record the reasoning behind a decision made with incomplete information, so that months
    later people can tell what you knew at the time?
  expected_concepts:
  - writing down options considered
  - recording the assumptions and data available then
  - naming who decided and when
  - noting what would trigger a revisit
  rubric:
    excellent: >-
      Describes a lightweight, consistent record with assumptions and alternatives, explains how it was
      used later to review or reverse a decision, and keeps it short enough to be maintained.
    good: Keeps notes or a decision document and explains why, but rarely revisits them.
    weak: Relies on memory or chat history and cannot say how past reasoning is recovered.
  followups:
  - Where do these records live?
  - When did you last look back at one?
  common_errors:
  - Recording only the outcome and not the options or assumptions behind it.

- external_key: leadership.decisions_uncertainty.reading_a_noisy_metric
  competency_key: problem_solving
  topic: Interpreting a noisy early number
  difficulty: easy
  text: >-
    A key metric moved sharply in the first two days after a release, but traffic is low. How do you decide
    whether to react to it?
  expected_concepts:
  - considering sample size and normal variation
  - comparing with past baselines
  - checking for a plausible mechanism
  - deciding what extra data would settle it
  - choosing a reversible reaction first
  rubric:
    excellent: >-
      Weighs noise against signal using baselines and volume, proposes a quick way to get more evidence,
      and picks a low-regret action while waiting.
    good: >-
      Notices that the sample is small and suggests waiting or checking more data without a clear threshold.
    weak: Reacts immediately to the number or dismisses it without examining it.
  followups:
  - What would make you roll back anyway?
  - How long would you wait?
  common_errors:
  - Treating a day-two spike as a trend.

- external_key: leadership.decisions_uncertainty.asking_for_help_deciding
  competency_key: collaboration
  topic: Who to ask when you are unsure
  difficulty: easy
  text: >-
    When you face a decision you don't have much experience with, how do you choose who to ask and what
    to ask them?
  expected_concepts:
  - identifying people who have faced similar decisions
  - asking specific questions rather than for approval
  - seeking a dissenting view
  - taking responsibility for the final call
  rubric:
    excellent: >-
      Gives a clear way of picking advisers with different perspectives, asks pointed questions, and keeps
      ownership of the decision while crediting the input.
    good: >-
      Seeks advice from trusted colleagues and uses it, with less attention to diversity of views or ownership.
    weak: >-
      Defers entirely to whoever is senior or avoids the decision until someone else makes it.
  followups:
  - Tell me about a time advice changed your mind.
  - What did you do when two advisers disagreed?
  common_errors:
  - Asking for approval instead of input and letting the adviser own the decision.

- external_key: leadership.decisions_uncertainty.small_bets_first
  competency_key: leadership
  topic: Starting small when the outcome is unclear
  difficulty: easy
  text: >-
    Tell me about a time you started with a small version of something because you weren't sure it would
    work. How did you decide what the small version should be?
  expected_concepts:
  - identifying the key uncertainty to test
  - limiting cost and time
  - defining what result would justify going further
  - being willing to stop
  rubric:
    excellent: >-
      Picks a small step that tests the riskiest assumption, sets success criteria before starting, and
      shows what they did with the result including stopping or scaling.
    good: Describes a reasonable small trial with some criteria and a clear outcome.
    weak: >-
      Calls something a pilot but had no criteria and kept going regardless of the result.
  followups:
  - What would have made you stop?
  - What did you learn that you didn't expect?
  common_errors:
  - Running a pilot with no success criteria so any result can be called a win.

- external_key: leadership.decisions_uncertainty.reverse_after_new_data
  competency_key: leadership
  topic: Changing a decision when new data arrives
  difficulty: medium
  text: >-
    Tell me about a decision you changed because new information arrived after you had committed. How
    did you handle the change with the people who had acted on your original call?
  expected_concepts:
  - recognising the new evidence directly rather than defending the old call
  - checking how much had already been invested
  - communicating the reversal and the reason
  - limiting the cost to others
  - learning for next time
  rubric:
    excellent: >-
      Shows a decision to reverse promptly with a clear rationale, owns the original call, explains the
      reversal to affected people, and captures a lesson about how the first call was made.
    good: >-
      Reverses with a reasonable explanation but is vague on the effect on others or the lesson.
    weak: >-
      Defends the original decision, blames the data, or cannot give an example of reversing course.
  followups:
  - How did you know the new data was reliable?
  - How did the team react?
  common_errors:
  - >-
    Treating a reversal as a loss of credibility instead of a normal result of learning.

- external_key: leadership.decisions_uncertainty.kill_project_sunk_cost
  competency_key: ownership
  topic: Stopping work already invested in
  difficulty: medium
  text: >-
    Describe a time you stopped a project or piece of work after significant effort had already gone into
    it. How did you reach that decision and how did you tell the team?
  expected_concepts:
  - separating sunk cost from future cost and benefit
  - defining evidence that it was no longer worth it
  - acknowledging the effort
  - reallocating people
  - salvaging reusable parts
  rubric:
    excellent: >-
      Frames the decision on future value, brings specific evidence, handles the announcement with respect
      for the effort, and reuses what was learned or built.
    good: >-
      Stops the work with reasonable logic but shows limited effort on communication or salvage.
    weak: Cannot give an example, or stopped work only when forced from above.
  followups:
  - Who disagreed with you?
  - What did you keep from the work?
  common_errors:
  - >-
    Continuing because of the effort already spent rather than the value still to come.

- external_key: leadership.decisions_uncertainty.launch_timing_incomplete_info
  competency_key: stakeholder_management
  topic: Go or no-go on partial readiness
  difficulty: medium
  text: >-
    A launch date is committed externally, but a week before it you still have unanswered questions about
    stability. How do you decide whether to go ahead?
  expected_concepts:
  - listing the specific unknowns and their potential impact
  - considering partial launch, flags or staged rollout
  - weighing the cost of delay against the cost of failure
  - agreeing on rollback criteria
  - informing stakeholders early
  rubric:
    excellent: >-
      Breaks the readiness into concrete risks, explores staged or reversible launch options, sets criteria
      and a rollback plan, and brings stakeholders into the choice before the deadline.
    good: >-
      Weighs the trade-off sensibly and mentions a mitigation, with less structure on criteria.
    weak: >-
      Defaults to launching because of the date, or delaying without checking alternatives.
  followups:
  - Who needs to agree to a delay?
  - What would the rollback trigger be?
  common_errors:
  - Letting the committed date make the decision without weighing the risks.

- external_key: leadership.decisions_uncertainty.second_order_effects
  competency_key: problem_solving
  topic: Looking past the first effect of a decision
  difficulty: medium
  text: >-
    Think of a decision you made where the most important consequences showed up some time later. What
    did you miss at first, and how do you look for those effects now?
  expected_concepts:
  - identifying downstream effects on other teams or systems
  - gathering views from people close to the consequences
  - checking incentives created
  - reviewing the decision after a set time
  rubric:
    excellent: >-
      Gives a specific delayed consequence, diagnoses what was overlooked, and describes a repeatable
      practice such as consulting affected groups or scheduling a review.
    good: Recognises a missed effect and a general lesson without a concrete practice.
    weak: Believes decisions rarely have unexpected results, or blames outside factors.
  followups:
  - Who could have told you earlier?
  - How do you check an incentive you created?
  common_errors:
  - Judging a decision only by its immediate result.

- external_key: leadership.decisions_uncertainty.conflicting_stakeholder_risk_appetite
  competency_key: stakeholder_management
  topic: Stakeholders who disagree on acceptable risk
  difficulty: medium
  text: >-
    Your product lead wants to move fast and accept some risk, while your operations lead wants more safeguards
    before release. How do you reach a decision both can live with?
  expected_concepts:
  - understanding what each side is protecting
  - making risks and costs concrete
  - offering options in between
  - clarifying who owns the final decision
  - documenting the agreement
  rubric:
    excellent: >-
      Surfaces what each stakeholder fears, quantifies the risks, proposes intermediate options such as
      limited exposure, and ensures a clear decision owner and recorded outcome.
    good: Mediates between the two views and finds a compromise with limited analysis.
    weak: Sides with the louder or more senior party, or avoids the decision.
  followups:
  - What if they still disagree?
  - How would you measure the risk?
  common_errors:
  - Siding with the more senior person without examining the risk.

- external_key: leadership.decisions_uncertainty.forecast_with_wide_range
  competency_key: communication
  topic: Communicating an uncertain forecast
  difficulty: medium
  text: >-
    Leadership wants one number for when a project will finish, but you only have a rough range. How do
    you give them something useful without false precision?
  expected_concepts:
  - presenting a range with assumptions
  - explaining what drives the spread
  - showing how uncertainty will shrink over time
  - agreeing on update points
  - avoiding a single date treated as a promise
  rubric:
    excellent: >-
      Shares a range tied to explicit assumptions, names the main drivers, sets milestones where the estimate
      will be refined, and agrees how the number will be used.
    good: Gives a range and explains it, with limited plan to narrow it.
    weak: Gives a single optimistic number or refuses to estimate.
  followups:
  - What do you do when they insist on a date?
  - What would shrink the range fastest?
  common_errors:
  - Padding silently instead of explaining the range.

- external_key: leadership.decisions_uncertainty.decision_with_team_split
  competency_key: leadership
  topic: Making a call when the team is evenly divided
  difficulty: medium
  text: >-
    Your team is split fairly evenly on an important technical choice and there is no clear data. How
    do you move to a decision?
  expected_concepts:
  - clarifying criteria that matter most
  - letting each side state the strongest case for the other
  - choosing a decision owner
  - setting a timeframe
  - committing and revisiting on agreed signals
  rubric:
    excellent: >-
      Sets criteria first, makes sure both views are heard, decides within a stated timeframe or delegates
      to a named owner, and gets commitment while defining when to revisit.
    good: >-
      Facilitates discussion and makes a call, with limited attention to commitment afterward.
    weak: >-
      Keeps debating without a decision or imposes a choice without hearing the arguments.
  followups:
  - How did people who lost the argument respond?
  - What did you set as the revisit trigger?
  common_errors:
  - Reopening the debate repeatedly after a call has been made.

- external_key: leadership.decisions_uncertainty.hiring_uncertain_demand
  competency_key: project_management
  topic: Committing headcount under uncertain demand
  difficulty: medium
  text: >-
    You need to decide whether to hire permanent engineers for a product whose demand next year is uncertain.
    How do you think it through?
  expected_concepts:
  - scenarios for demand
  - cost of being short versus cost of being over
  - alternatives such as contractors or reassignment
  - lead time to hire
  - commitments that are hard to reverse
  rubric:
    excellent: >-
      Lays out scenarios, compares costs of under and over capacity, considers flexible options and hiring
      lead times, and chooses with clear review points.
    good: Considers a few scenarios and chooses sensibly without exploring flexibility.
    weak: Decides based on a single forecast or hiring habit without weighing downside.
  followups:
  - What signal would make you hire sooner?
  - What would you do if demand disappeared?
  common_errors:
  - Planning from a single forecast with no downside case.

- external_key: leadership.decisions_uncertainty.partial_incident_decision
  competency_key: ownership
  topic: Acting during an incident with unclear cause
  difficulty: medium
  text: >-
    During a production incident you must choose between rolling back, applying a quick fix or waiting
    for diagnosis, and you don't yet know the cause. How do you decide?
  expected_concepts:
  - assessing customer impact and rate of harm
  - favouring reversible actions
  - time-boxing investigation
  - assigning roles
  - communicating status and decision
  rubric:
    excellent: >-
      Prioritises limiting harm with reversible steps, time-boxes diagnosis, clearly assigns who decides,
      and keeps stakeholders informed while recording choices for review.
    good: >-
      Chooses a sensible mitigation and communicates, with limited structure for time-boxing.
    weak: Chases root cause while impact continues or acts without telling anyone.
  followups:
  - Who owns the call in your team?
  - How do you decide the time box?
  common_errors:
  - Diagnosing at length while customers remain affected.

- external_key: leadership.decisions_uncertainty.sunk_in_vendor_selection
  competency_key: stakeholder_management
  topic: Choosing a vendor with limited evidence
  difficulty: medium
  text: >-
    You must choose between two vendors, and neither can fully prove their claims before you sign. How
    do you reduce the risk in that decision?
  expected_concepts:
  - defining must-have criteria
  - running a proof of concept on real data
  - checking references
  - negotiating exit terms
  - limiting commitment length
  rubric:
    excellent: >-
      Defines criteria upfront, tests on a realistic slice of work, checks references with similar use,
      and negotiates terms that limit lock-in and allow exit.
    good: >-
      Does a reasonable evaluation and some reference checking, with limited focus on exit.
    weak: Chooses by demo impressions, price alone or existing relationships.
  followups:
  - What did the proof of concept reveal?
  - What exit terms matter most?
  common_errors:
  - Picking the vendor with the best demo without testing on real work.

- external_key: leadership.decisions_uncertainty.being_wrong_in_public
  competency_key: ownership
  topic: Owning a call that turned out wrong
  difficulty: medium
  text: >-
    Tell me about a decision that turned out to be wrong, where many people were watching. How did you
    handle the aftermath?
  expected_concepts:
  - acknowledging it quickly and plainly
  - explaining the reasoning at the time
  - fixing the immediate effects
  - extracting changes in how decisions are made
  - not shifting blame
  rubric:
    excellent: >-
      Owns the outcome quickly, explains what was known then, leads the fix, and describes a specific
      process change that followed.
    good: Acknowledges the error and fix with a general lesson.
    weak: Minimises the error, blames data or others, or has no example.
  followups:
  - What did you say to the team?
  - What would you do differently in the decision itself?
  common_errors:
  - Explaining the context at length so the ownership gets lost.

- external_key: leadership.decisions_uncertainty.regulatory_ambiguity
  competency_key: leadership
  topic: Deciding when rules are unclear
  difficulty: hard
  text: >-
    You are building something where the rules that apply are unclear and legal advice is cautious but
    inconclusive. How do you decide how far to go?
  expected_concepts:
  - engaging legal and compliance early
  - identifying what is reversible
  - designing to the stricter reading where cheap
  - documenting reasoning
  - monitoring for guidance changes
  rubric:
    excellent: >-
      Works with specialists, separates cheap-to-comply choices from costly ones, builds flexibility to
      adapt, documents the reasoning, and sets a plan to monitor and revisit.
    good: Seeks advice and chooses a cautious approach, with limited plan for change.
    weak: Ignores the ambiguity or blocks all progress without exploring options.
  followups:
  - How did you decide what was cheap to comply with?
  - Who signed off?
  common_errors:
  - Treating unclear rules as permission to proceed without advice.

- external_key: leadership.decisions_uncertainty.option_value_delay
  competency_key: leadership
  topic: Paying to keep options open
  difficulty: hard
  text: >-
    Sometimes it is worth spending to keep a decision open rather than committing now. Tell me about a
    time you chose that path and how you judged it was worth the cost.
  expected_concepts:
  - estimating cost of waiting versus cost of an early wrong commitment
  - identifying what information is expected and when
  - limiting how long options are kept
  - recognising when delay becomes its own cost
  rubric:
    excellent: >-
      Compares the price of flexibility to the expected benefit, identifies what is learned during the
      wait, sets a deadline, and reflects on whether the outcome justified it.
    good: Describes keeping options open with partial reasoning about the cost.
    weak: Treats delay as free or always avoids commitment.
  followups:
  - What made you finally commit?
  - How did you stop the wait from dragging on?
  common_errors:
  - Calling indecision flexibility with no deadline for the choice.

- external_key: leadership.decisions_uncertainty.base_rates_vs_our_case
  competency_key: problem_solving
  topic: Using outside experience against our own story
  difficulty: hard
  text: >-
    Every team believes its project is special, yet most similar projects run late. How do you use outside
    experience when judging your own plan?
  expected_concepts:
  - finding comparable projects and their outcomes
  - adjusting for real differences
  - guarding against optimism
  - presenting an outside view to sponsors
  - building buffers or checkpoints
  rubric:
    excellent: >-
      Seeks comparable data, adjusts explicitly for genuine differences, challenges internal optimism
      constructively, and builds buffers or checkpoints into the plan.
    good: Recognises optimism bias and uses some history, with limited rigor.
    weak: Argues that the team is exceptional or rejects comparisons.
  followups:
  - How did you find comparables?
  - How did the team take it?
  common_errors:
  - Assuming the team's plan is exempt from the usual overrun patterns.

- external_key: leadership.decisions_uncertainty.red_team_a_decision
  competency_key: collaboration
  topic: Deliberately challenging your own plan
  difficulty: hard
  text: >-
    How have you set up a way for people to seriously challenge a major decision of yours before you committed,
    and what happened?
  expected_concepts:
  - nominating a challenger with permission to dissent
  - giving them access to evidence
  - separating the critique from the person
  - deciding what to change
  - closing the loop on feedback
  rubric:
    excellent: >-
      Creates a real challenge process with named roles and access, listens without defensiveness, shows
      a plan that changed, and thanks and informs challengers of the result.
    good: Invites criticism and responds to some of it, with limited structure.
    weak: Seeks validation or treats critique as opposition.
  followups:
  - What did the challenger find?
  - How did you protect against it becoming theatre?
  common_errors:
  - Inviting challenge only after the decision is effectively made.

- external_key: leadership.decisions_uncertainty.cascade_of_dependent_decisions
  competency_key: project_management
  topic: Sequencing decisions that depend on each other
  difficulty: hard
  text: >-
    Several decisions in a large programme depend on each other and all feel uncertain. How do you sequence
    them and decide which to settle first?
  expected_concepts:
  - mapping dependencies between decisions
  - deciding the ones that unlock others first
  - identifying those cheap to defer
  - making provisional assumptions explicit
  - revisiting as facts arrive
  rubric:
    excellent: >-
      Builds a decision map, settles the unlocking and hard-to-reverse choices first, defers the cheap
      ones, records provisional assumptions and sets revisit points.
    good: Prioritises key decisions sensibly with limited tracking of assumptions.
    weak: Decides in the order raised or tries to settle everything together.
  followups:
  - How did you track the provisional ones?
  - What happened when an early assumption broke?
  common_errors:
  - Settling easy decisions first and leaving the unlocking one open.

- external_key: leadership.decisions_uncertainty.high_stakes_irreversible_staff
  competency_key: leadership
  topic: A people decision you could not undo
  difficulty: hard
  text: >-
    Tell me about a decision involving people, such as a restructure or reassignment, that was hard to
    reverse and made with imperfect information. How did you approach it?
  expected_concepts:
  - gathering evidence from multiple sources
  - checking for bias in the information
  - considering impact on those affected
  - consulting HR or peers where appropriate
  - communicating clearly and respectfully
  rubric:
    excellent: >-
      Seeks varied evidence, tests for bias, considers consequences on individuals and the team, uses
      proper process, and communicates directly with care, then reviews the result.
    good: Takes a careful, fair approach with limited evidence-gathering detail.
    weak: Decides on a few impressions or avoids involving others or process.
  followups:
  - What did you do to check your information?
  - How did you support those affected?
  common_errors:
  - Deciding on a few anecdotes without checking them or following process.

- external_key: leadership.decisions_uncertainty.ethics_pressure_incomplete
  competency_key: leadership
  topic: Pressure to decide before the facts are in
  difficulty: hard
  text: >-
    A senior leader wants a decision today, but you think the facts are not yet reliable enough and the
    downside is serious. How do you respond?
  expected_concepts:
  - stating clearly what is unknown and why it matters
  - proposing a smaller or reversible step by the deadline
  - offering a date when facts will exist
  - escalating with evidence if needed
  - keeping the relationship constructive
  rubric:
    excellent: >-
      Clearly explains the specific gaps and risks, offers a reversible interim step and a date for firmer
      facts, and escalates with evidence only if needed.
    good: Pushes back reasonably and suggests a delay with less on alternatives.
    weak: Gives in to pressure, or refuses without offering any path forward.
  followups:
  - What if they still say decide now?
  - How do you separate urgency from importance?
  common_errors:
  - Either complying without raising the gaps or refusing without alternatives.

- external_key: leadership.decisions_uncertainty.portfolio_of_bets
  competency_key: leadership
  topic: Balancing safe and risky initiatives
  difficulty: hard
  text: >-
    How do you decide what share of your team's effort goes to safe, predictable work versus riskier bets
    with higher potential, and how do you adjust that over time?
  expected_concepts:
  - classifying work by risk and payoff
  - setting an explicit allocation
  - defining stop or scale criteria for risky bets
  - protecting the bets from daily pressure
  - reviewing on a cadence
  rubric:
    excellent: >-
      Uses an explicit allocation with reasoning, defines stop and scale criteria, protects risky work
      from being crowded out, and reviews results on a schedule to rebalance.
    good: Has a loose balance with some reasoning and occasional review.
    weak: >-
      Chooses only safe or only risky work, or decides case by case without a view of the total.
  followups:
  - How did you protect the risky work?
  - What caused you to change the split?
  common_errors:
  - Letting urgent work crowd out every risky bet by default.

- external_key: leadership.decisions_uncertainty.stage_gates_for_commitment
  competency_key: project_management
  topic: Committing in stages with review gates
  difficulty: medium
  text: >-
    How do you set up a large uncertain effort so that money and people are released in steps rather than
    all at once, and what do you look at to decide on each step?
  expected_concepts:
  - defining stages with learning goals
  - setting exit and continue criteria per stage
  - limiting spend before evidence
  - agreeing the gates with sponsors
  - preparing for a stop
  rubric:
    excellent: >-
      Describes stages tied to specific uncertainties, with agreed criteria and sponsor buy-in, and shows
      a gate where they paused, changed or stopped.
    good: Uses stages with some criteria and a reasonable review.
    weak: Approves everything upfront or reviews gates without criteria.
  followups:
  - What happened at the first gate?
  - How did sponsors react to a stop?
  common_errors:
  - Holding gate reviews where the answer is always to continue.
