# Curated questions: leadership round, inclusive culture (part 1 of 4).
# Focus: building an inclusive, respectful team culture through fair, job-related processes and working practices. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.inclusive_culture.meeting_airtime
  competency_key: leadership
  topic: Making sure everyone can contribute in meetings
  difficulty: easy
  text: >-
    How do you make sure everyone on your team gets a real chance to contribute in meetings, not just the people who speak
    up fastest?
  expected_concepts:
  - agenda shared in advance
  - deliberate invitations to input
  - written or async options
  - rotating facilitation
  - noticing who has not spoken
  rubric:
    excellent: >-
      Describes several concrete practices such as pre-reads, rotating facilitators and written input, and gives an example
      where it brought out a useful contribution.
    good: Names a couple of sensible practices and a modest example.
    weak: Relies on people to speak up on their own.
  followups:
  - What did you change after noticing a pattern?
  - How do you handle a dominant voice?
  common_errors:
  - 'Answering in the weak pattern: relies on people to speak up on their own'

- external_key: leadership.inclusive_culture.fair_task_allocation
  competency_key: leadership
  topic: Distributing work fairly
  difficulty: easy
  text: >-
    How do you decide who gets which tasks on your team, so that interesting work and routine work are shared fairly?
  expected_concepts:
  - transparent allocation approach
  - matching growth goals
  - rotation of routine work
  - tracking who has done what
  - asking people about their preferences
  rubric:
    excellent: >-
      Describes a transparent method with rotation and tracking, balances growth with team need, and shows that people saw
      it as fair.
    good: Has a reasonable method with some tracking.
    weak: Gives work to whoever is available or most vocal.
  followups:
  - How do you check your own pattern?
  - What did people say about it?
  common_errors:
  - 'Answering in the weak pattern: gives work to whoever is available or most vocal'

- external_key: leadership.inclusive_culture.respectful_code_review
  competency_key: collaboration
  topic: Setting norms for respectful reviews
  difficulty: easy
  text: >-
    What norms have you set for code review comments so that feedback stays specific and respectful?
  expected_concepts:
  - comments on the code not the person
  - reasons given with each request
  - labelling nits and blockers
  - praising good work
  - handling disagreements in conversation
  rubric:
    excellent: >-
      Names concrete norms, shows how they were agreed with the team, and describes an observed improvement in review quality.
    good: Describes sensible norms with limited follow-up.
    weak: Leaves tone to individual preference.
  followups:
  - How did you respond to a harsh comment?
  - How did you introduce the norms?
  common_errors:
  - 'Answering in the weak pattern: leaves tone to individual preference'

- external_key: leadership.inclusive_culture.welcoming_newcomers
  competency_key: collaboration
  topic: Helping a new joiner feel part of the team
  difficulty: easy
  text: >-
    Tell me about how you've made a new team member feel included in the work and in team conversations during their first
    weeks.
  expected_concepts:
  - introductions to the team and context
  - early involvement in discussions
  - a buddy
  - invitations to team rituals
  - asking for their fresh view
  rubric:
    excellent: >-
      Describes a deliberate plan including a buddy, early inclusion in decisions and a request for the newcomer's perspective,
      with feedback from them.
    good: Provides a sensible welcome and support.
    weak: Leaves them to find their own way.
  followups:
  - What did the newcomer say about it?
  - What did you adjust for remote joiners?
  common_errors:
  - 'Answering in the weak pattern: leaves them to find their own way'

- external_key: leadership.inclusive_culture.transparent_decisions
  competency_key: communication
  topic: Explaining how decisions get made
  difficulty: easy
  text: >-
    How do you make the way decisions get made on your team visible, so nobody feels decisions happen behind closed doors?
  expected_concepts:
  - written decision records
  - stating who decides and by when
  - sharing the options considered
  - inviting input before deciding
  - communicating the result and reasons
  rubric:
    excellent: >-
      Describes decision records, clear decision owners, input windows and communication of reasoning, with an example where
      it reduced confusion.
    good: Shares decisions and reasons reasonably.
    weak: Informs people only after decisions are made.
  followups:
  - How do you handle people who disagree?
  - Where do you keep these records?
  common_errors:
  - 'Answering in the weak pattern: informs people only after decisions are made'

- external_key: leadership.inclusive_culture.inclusive_decision_with_dissent
  competency_key: leadership
  topic: Deciding when the team is split
  difficulty: medium
  text: >-
    Your team is split on an important technical decision. How do you run the process so that everyone feels heard even if
    their view doesn't win?
  expected_concepts:
  - framing the decision and who decides
  - collecting views in writing
  - summarising each position fairly
  - explaining reasons for the outcome
  - recording dissent and revisit date
  rubric:
    excellent: >-
      Describes a clear process with fair summaries, a transparent rationale, recorded dissent and a plan to review, and shows
      people committed to the result.
    good: Hears people and explains the decision.
    weak: Decides alone and informs the team.
  followups:
  - How did the losing side react?
  - When did you revisit?
  common_errors:
  - 'Answering in the weak pattern: decides alone and informs the team'

- external_key: leadership.inclusive_culture.unequal_participation
  competency_key: leadership
  topic: Noticing a pattern in who speaks
  difficulty: medium
  text: >-
    You notice that a few people dominate discussions while others stay silent. How do you investigate and change it?
  expected_concepts:
  - observing before acting
  - asking people privately about barriers
  - trying formats like written input
  - coaching the dominant voices
  - reviewing the effect
  rubric:
    excellent: >-
      Observes, asks about barriers, tries formats, coaches and checks if participation changed.
    good: Notices and tries a couple of changes.
    weak: Tells the quiet people to speak up.
  followups:
  - What barrier surprised you?
  - How did you talk to the dominant person?
  common_errors:
  - 'Answering in the weak pattern: tells the quiet people to speak up'

- external_key: leadership.inclusive_culture.calibrating_performance_fairly
  competency_key: people_management
  topic: Fair performance reviews
  difficulty: medium
  text: >-
    How do you make sure performance evaluations on your team are fair and based on work, and what do you do to check yourself?
  expected_concepts:
  - written criteria
  - evidence gathered through the period
  - multiple inputs
  - calibration with peers
  - checking for recency and familiarity effects
  - feedback to people before reviews
  rubric:
    excellent: >-
      Describes criteria, evidence collection, calibration and self-checks, and an example where a check changed a rating.
    good: Uses criteria and evidence.
    weak: Relies on impressions near review time.
  followups:
  - What have you changed in a rating after a check?
  - How do you share evidence with the person?
  common_errors:
  - 'Answering in the weak pattern: relies on impressions near review time'

- external_key: leadership.inclusive_culture.biased_feedback_in_review_cycle
  competency_key: people_management
  topic: Spotting uneven language in reviews
  difficulty: medium
  text: >-
    While drafting reviews you notice you are describing two people with similar results in very different terms. What do
    you do?
  expected_concepts:
  - pausing and comparing evidence
  - rewriting around observable behaviours
  - checking against criteria
  - asking a peer to review
  - revising ratings if needed
  rubric:
    excellent: >-
      Compares evidence, rewrites in observable terms, seeks a second view, and adjusts ratings where needed.
    good: Notices the difference and reworks the wording.
    weak: Dismisses the inconsistency.
  followups:
  - How did you notice?
  - What did you change in your process?
  common_errors:
  - 'Answering in the weak pattern: dismisses the inconsistency'

- external_key: leadership.inclusive_culture.inclusive_hiring_pipeline
  competency_key: people_management
  topic: Widening the candidate pipeline fairly
  difficulty: medium
  text: >-
    You need to hire three engineers and the applicant pool looks very narrow. How do you broaden it while keeping the bar
    fair?
  expected_concepts:
  - review of job description and requirements
  - widening sourcing channels
  - removing unneeded requirements
  - structured evaluation
  - tracking pipeline stages
  rubric:
    excellent: >-
      Reviews requirements for job relevance, widens sourcing, applies identical criteria, and tracks pipeline results.
    good: Broadens sourcing with a consistent bar.
    weak: Lowers the bar or sticks to the usual network.
  followups:
  - Which requirements did you remove?
  - How did you keep the bar consistent?
  common_errors:
  - 'Answering in the weak pattern: lowers the bar or sticks to the usual network'

- external_key: leadership.inclusive_culture.interviewer_calibration
  competency_key: people_management
  topic: Aligning interviewers
  difficulty: medium
  text: >-
    Your interviewers keep scoring candidates very differently. How do you bring them to consistent, evidence-based decisions?
  expected_concepts:
  - shared rubric with examples
  - calibration sessions on real answers
  - written evidence before debrief
  - reviewing score patterns
  - coaching outliers
  rubric:
    excellent: >-
      Builds a shared rubric, runs calibration, reviews patterns and coaches, and shows narrower variance.
    good: Aligns around a rubric.
    weak: Averages the scores.
  followups:
  - How did you spot outliers?
  - How did you handle a senior interviewer who disagreed?
  common_errors:
  - 'Answering in the weak pattern: averages the scores'

- external_key: leadership.inclusive_culture.handling_disrespectful_comment
  competency_key: leadership
  topic: A disrespectful remark in a meeting
  difficulty: medium
  text: >-
    A senior engineer makes a dismissive remark about a colleague's idea in a meeting. What do you do in the moment and afterwards?
  expected_concepts:
  - responding in the moment to refocus on the idea
  - speaking privately to the engineer
  - checking in with the colleague
  - naming the expected behaviour
  - following up
  rubric:
    excellent: >-
      Redirects the discussion respectfully in the moment, talks privately to both people, restates the norm and follows up.
    good: Addresses it afterwards in private.
    weak: Ignores it or calls the person out harshly in public.
  followups:
  - What did the senior engineer say?
  - How did the colleague respond?
  common_errors:
  - Embarrassing the senior engineer in front of the group.

- external_key: leadership.inclusive_culture.repeat_pattern_in_conduct
  competency_key: people_management
  topic: Dealing with a persistent behaviour problem
  difficulty: medium
  text: >-
    One high performer repeatedly belittles teammates' work, despite earlier conversations. How do you address it?
  expected_concepts:
  - documenting specific incidents
  - clear expectations tied to team norms
  - consequences and timeline
  - support to change
  - involving HR and your manager
  - consistent standards for high performers
  rubric:
    excellent: >-
      Documents specifics, sets expectations and consequences, involves the right partners and applies the same standard regardless
      of output.
    good: Has a direct conversation and escalates if needed.
    weak: Tolerates the behaviour because of output.
  followups:
  - What if the team asks you to wait?
  - How do you support the people affected?
  common_errors:
  - 'Answering in the weak pattern: tolerates the behaviour because of output'

- external_key: leadership.inclusive_culture.credit_attribution
  competency_key: collaboration
  topic: Correcting how credit is given
  difficulty: medium
  text: >-
    You find that a quieter team member's idea was presented in a meeting by someone else without credit. How do you respond?
  expected_concepts:
  - restating the origin in the moment or soon after
  - checking with the person
  - talking to the presenter
  - practices for attributing ideas
  - watching for repeat
  rubric:
    excellent: >-
      Corrects attribution quickly, supports the originator, talks to the presenter, and sets a norm of attribution.
    good: Mentions the origin afterwards.
    weak: Lets it pass.
  followups:
  - How did the originator want it handled?
  - What norm did you adopt?
  common_errors:
  - 'Answering in the weak pattern: lets it pass'

- external_key: leadership.inclusive_culture.writing_inclusive_job_posts
  competency_key: people_management
  topic: Writing a job description
  difficulty: medium
  text: >-
    Walk me through how you write a job description so that it attracts a broad range of qualified people and reflects what
    the job really needs.
  expected_concepts:
  - separating must-haves from nice-to-haves
  - plain language
  - realistic experience levels
  - describing the working arrangements
  - reviewing with others
  - removing unneeded credentials
  rubric:
    excellent: >-
      Distinguishes must-haves from preferences, uses plain language, reviews it with others and ties requirements to the
      job.
    good: Writes a clear description with some review.
    weak: Copies an old posting and lists every skill.
  followups:
  - What did you remove?
  - How did you check the effect?
  common_errors:
  - 'Answering in the weak pattern: copies an old posting and lists every skill'

- external_key: leadership.inclusive_culture.onboarding_fairness
  competency_key: people_management
  topic: Equal onboarding for remote and on-site joiners
  difficulty: medium
  text: >-
    Some new joiners work on site and others remotely. How do you make sure they get an equally good start?
  expected_concepts:
  - same checklist and materials
  - deliberate introductions for remote joiners
  - video-first rituals
  - remote-friendly pairing
  - comparing outcomes
  rubric:
    excellent: Uses a shared plan, remote-first practices, and compares outcomes to adjust.
    good: Adapts onboarding for remote joiners.
    weak: Leaves remote joiners with a reduced version.
  followups:
  - What did remote joiners miss?
  - How did you measure the start?
  common_errors:
  - 'Answering in the weak pattern: leaves remote joiners with a reduced version'

- external_key: leadership.inclusive_culture.psychological_safety_building
  competency_key: culture_values
  topic: Building team safety to raise problems
  difficulty: medium
  text: >-
    Describe what you have done to make people feel safe raising problems early, including problems they caused.
  expected_concepts:
  - reacting constructively to bad news
  - blameless reviews
  - sharing own mistakes
  - rewarding early flags
  - checking safety through feedback
  rubric:
    excellent: >-
      Shows consistent constructive reactions, blameless reviews and leader openness about mistakes, with evidence that problems
      surfaced earlier.
    good: Encourages reporting and reacts well.
    weak: Says it is safe without changing reactions.
  followups:
  - How did you react the first time someone raised a problem they caused?
  - How do you measure safety?
  common_errors:
  - 'Answering in the weak pattern: says it is safe without changing reactions'

- external_key: leadership.inclusive_culture.fair_promotion_process
  competency_key: people_management
  topic: Promotion decisions people can trust
  difficulty: medium
  text: >-
    How do you run promotion decisions so that people trust the process and understand the outcome?
  expected_concepts:
  - published criteria
  - evidence from multiple sources
  - peer calibration
  - clear feedback for those not promoted
  - consistent timeline
  - avoiding surprises
  rubric:
    excellent: >-
      Uses published criteria, a calibrated process and clear feedback to all candidates, and shows trust in the process afterwards.
    good: Has criteria and communicates decisions.
    weak: Decides by manager preference with little explanation.
  followups:
  - How do you tell someone they were not promoted?
  - How do you handle exceptions?
  common_errors:
  - >-
    Answering in the weak pattern: decides by manager preference with little explanation

- external_key: leadership.inclusive_culture.handling_complaint_about_you
  competency_key: leadership
  topic: A complaint about your own behaviour
  difficulty: hard
  text: >-
    A team member tells you that something you do in meetings makes it hard for them to contribute. How do you respond, and
    what changes?
  expected_concepts:
  - listening without defending
  - asking for specifics
  - thanking them
  - agreeing changes
  - checking back
  - asking others for input
  rubric:
    excellent: >-
      Listens, asks for specifics, makes visible changes, checks back and seeks wider input.
    good: Accepts feedback and tries to change.
    weak: Defends or minimises.
  followups:
  - What did you change?
  - How did you know it worked?
  common_errors:
  - 'Answering in the weak pattern: defends or minimises'

- external_key: leadership.inclusive_culture.discovering_an_unfair_process
  competency_key: leadership
  topic: Finding a flaw in an established process
  difficulty: hard
  text: >-
    You discover that an established process, like how on-call escalations or project assignments work, systematically disadvantages
    some people. What do you do?
  expected_concepts:
  - confirming with data
  - talking to those affected
  - designing alternatives
  - consulting stakeholders
  - piloting and measuring
  - communicating the change
  rubric:
    excellent: >-
      Verifies with data, hears affected people, designs and pilots an alternative, and communicates the reasons.
    good: Fixes the process after discussion.
    weak: Leaves it because it has always been that way.
  followups:
  - What data did you use?
  - Who resisted the change?
  common_errors:
  - 'Answering in the weak pattern: leaves it because it has always been that way'

- external_key: leadership.inclusive_culture.complaint_investigation_boundaries
  competency_key: people_management
  topic: Handling a conduct complaint properly
  difficulty: hard
  text: >-
    A team member reports that a colleague has been treating them unfairly at work. How do you handle the report, what do
    you do yourself, and what do you pass on?
  expected_concepts:
  - listening and recording facts
  - explaining what happens next
  - involving HR or the proper channel
  - staying neutral
  - avoiding retaliation
  - confidentiality limits
  rubric:
    excellent: >-
      Listens, records facts, follows the formal process, stays neutral, protects the reporter and maintains appropriate confidentiality.
    good: Escalates to the proper channel and supports the person.
    weak: Investigates informally alone or dismisses the concern.
  followups:
  - What if the person asks you to keep it quiet?
  - How do you treat the colleague fairly?
  common_errors:
  - Promising confidentiality that cannot be kept.

- external_key: leadership.inclusive_culture.scoring_pattern_in_hiring_panel
  competency_key: people_management
  topic: A pattern in your hiring outcomes
  difficulty: hard
  text: >-
    You review your team's hiring data and find that candidates from certain types of past employers pass interviews far more
    often. What do you look at, and what do you do?
  expected_concepts:
  - checking whether criteria are job-related
  - reviewing question content
  - checking scoring differences
  - testing for shortcuts
  - adjusting the process
  - monitoring afterwards
  rubric:
    excellent: >-
      Examines the criteria and scoring for shortcuts, adjusts the process, and monitors outcomes.
    good: Reviews the process and makes some changes.
    weak: Concludes the outcomes reflect quality.
  followups:
  - What would you look at first?
  - How would you know it was fixed?
  common_errors:
  - 'Answering in the weak pattern: concludes the outcomes reflect quality'

- external_key: leadership.inclusive_culture.balancing_inclusion_and_speed
  competency_key: leadership
  topic: Inclusion versus delivery pressure
  difficulty: hard
  text: >-
    A deadline is close and wide consultation would slow you down. How do you decide whom to involve and how do you avoid
    excluding people who should be heard?
  expected_concepts:
  - identifying who is affected
  - fast input mechanisms
  - documenting the reasoning
  - revisiting after delivery
  - avoiding repeated exclusion of the same people
  rubric:
    excellent: >-
      Identifies affected people, uses fast channels, records the reasoning and revisits, and avoids a repeat pattern.
    good: Consults the key people quickly.
    weak: Skips input entirely and informs later.
  followups:
  - Who ended up unheard?
  - What did you review afterwards?
  common_errors:
  - 'Answering in the weak pattern: skips input entirely and informs later'

- external_key: leadership.inclusive_culture.remote_first_transformation
  competency_key: leadership
  topic: Moving practices to include a distributed team
  difficulty: hard
  text: >-
    Your team has grown from a co-located group to a distributed one. Which practices did you change so that the work and
    relationships stayed fair?
  expected_concepts:
  - written-first decisions
  - recording meetings
  - shared rituals
  - overlap hours
  - mentoring links
  - evaluating outcomes
  - checking for old habits
  rubric:
    excellent: >-
      Changes decision practices and rituals to be written-first, protects overlap time, tracks outcomes, and corrects habits
      that persisted.
    good: Adapts several practices.
    weak: Keeps office habits and expects remote staff to adapt.
  followups:
  - Which habit was hardest to drop?
  - How did you track fairness?
  common_errors:
  - >-
    Answering in the weak pattern: keeps office habits and expects remote staff to adapt

- external_key: leadership.inclusive_culture.inclusive_incident_oncall_policy
  competency_key: leadership
  topic: On-call policies that work for many circumstances
  difficulty: hard
  text: >-
    Design an on-call policy for a team where people have varied working hours and commitments outside work. How do you keep
    it fair and sustainable?
  expected_concepts:
  - voluntary swaps
  - compensation and recovery time
  - minimum rest
  - fair counting of load
  - gradual onboarding to on-call
  - review of load
  - escalation support
  rubric:
    excellent: >-
      Defines swaps, compensation, rest rules and tracking with periodic review, and shows it kept the team sustainable.
    good: Designs a fair rota with swaps and compensation.
    weak: Mandates a uniform rota with no flexibility.
  followups:
  - How do you handle a request for an exception?
  - How do you detect unfairness?
  common_errors:
  - 'Answering in the weak pattern: mandates a uniform rota with no flexibility'
