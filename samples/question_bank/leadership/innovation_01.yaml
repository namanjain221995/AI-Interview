# Curated questions: leadership round, innovation (part 1 of 4).
# Focus: innovation and continuous improvement, experimentation and learning culture. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.innovation.small_improvement_you_started
  competency_key: problem_solving
  topic: A small improvement you started
  difficulty: easy
  text: >-
    Tell me about a small improvement to how your team works that you started yourself. What prompted it and what happened?
  expected_concepts:
  - noticing a recurring pain
  - a small proposal
  - trying it
  - sharing the result
  - whether it stuck
  rubric:
    excellent: >-
      Describes a specific pain, a lightweight change, evidence of the effect and whether it lasted.
    good: Gives a clear example with a modest result.
    weak: Describes an improvement someone else assigned.
  followups:
  - Who else did you involve?
  - Did it last?
  common_errors:
  - 'Answering in the weak pattern: describes an improvement someone else assigned'

- external_key: leadership.innovation.finding_improvement_ideas
  competency_key: problem_solving
  topic: Where improvement ideas come from
  difficulty: easy
  text: >-
    Where do you look for opportunities to improve how your team works or what it builds?
  expected_concepts:
  - customer feedback
  - incident and support data
  - team retrospectives
  - watching where time goes
  - other teams' practices
  - metrics
  rubric:
    excellent: Names several sources and gives an example where one led to a change.
    good: Names a few sources.
    weak: Waits for others to suggest.
  followups:
  - Which source gave the best idea?
  - How do you pick which to pursue?
  common_errors:
  - 'Answering in the weak pattern: waits for others to suggest'

- external_key: leadership.innovation.running_a_retro_that_matters
  competency_key: collaboration
  topic: Retrospectives that lead to change
  difficulty: easy
  text: How do you make sure the retrospectives you run lead to actual change?
  expected_concepts:
  - few actions with owners
  - follow-up at the next retro
  - small experiments
  - stopping ones that don't help
  - visible tracking
  rubric:
    excellent: >-
      Limits actions, assigns owners, reviews them next time and shows concrete changes.
    good: Runs retros with actions.
    weak: Lists many actions that get forgotten.
  followups:
  - Which action made a difference?
  - How do you choose actions?
  common_errors:
  - 'Answering in the weak pattern: lists many actions that get forgotten'

- external_key: leadership.innovation.trying_a_new_tool
  competency_key: adaptability
  topic: Evaluating a new tool
  difficulty: easy
  text: >-
    Describe a time you tried a new tool or practice in your team. How did you decide to try it and how did you judge it?
  expected_concepts:
  - the problem it solves
  - a small trial
  - success criteria
  - feedback from users
  - deciding to adopt or drop
  rubric:
    excellent: >-
      Names the problem, runs a bounded trial with criteria, collects feedback and makes a clear decision.
    good: Tries the tool and decides.
    weak: Adopts because it is popular.
  followups:
  - What criteria did you use?
  - What happened to the tool?
  common_errors:
  - 'Answering in the weak pattern: adopts because it is popular'

- external_key: leadership.innovation.learning_from_failure_small
  competency_key: problem_solving
  topic: An experiment that did not work
  difficulty: easy
  text: Tell me about an idea you tried that didn't work. What did you learn?
  expected_concepts:
  - the hypothesis
  - how it was tried
  - what was observed
  - what was learned
  - what was done next
  - sharing it
  rubric:
    excellent: >-
      States the hypothesis, the evidence, the lesson and the change of direction, and shared it.
    good: Describes the failure and a lesson.
    weak: Cannot give an example.
  followups:
  - When did you decide to stop?
  - Who did you tell?
  common_errors:
  - 'Answering in the weak pattern: cannot give an example'

- external_key: leadership.innovation.experiment_design
  competency_key: statistics_experimentation
  topic: Designing an experiment
  difficulty: medium
  text: >-
    Walk me through how you design an experiment to test a product or process idea, from hypothesis to decision.
  expected_concepts:
  - clear hypothesis
  - success measure
  - control or baseline
  - sample and duration
  - guardrail measures
  - decision rule
  rubric:
    excellent: >-
      Defines hypothesis, measure, baseline, size and duration, guardrails and a decision rule beforehand.
    good: Designs a sensible test with a measure.
    weak: Runs a change and looks for supporting evidence afterwards.
  followups:
  - What guardrail did you set?
  - What would have made you stop?
  common_errors:
  - Deciding the success measure after seeing the results.

- external_key: leadership.innovation.innovation_vs_delivery
  competency_key: project_management
  topic: Balancing new ideas with commitments
  difficulty: medium
  text: How do you balance exploring new ideas with the commitments your team has made?
  expected_concepts:
  - explicit capacity split
  - time-boxed exploration
  - link to goals
  - stakeholder agreement
  - stopping criteria
  - reviewing
  rubric:
    excellent: >-
      Splits capacity explicitly, time-boxes, agrees with stakeholders and reviews the balance.
    good: Reserves some time.
    weak: Treats exploration as leftover time.
  followups:
  - What split did you use?
  - How did stakeholders respond?
  common_errors:
  - 'Answering in the weak pattern: treats exploration as leftover time'

- external_key: leadership.innovation.convincing_sceptics
  competency_key: leadership
  topic: Getting sceptics to try something
  difficulty: medium
  text: >-
    A few people are sceptical of an idea you want to try. How do you get them involved?
  expected_concepts:
  - understanding concerns
  - small pilot
  - shared criteria
  - involving sceptics in design
  - reporting results
  - respecting outcome
  rubric:
    excellent: >-
      Understands concerns, runs a pilot with shared criteria, involves sceptics and respects the result.
    good: Listens and pilots.
    weak: Overrides objections.
  followups:
  - What was their best objection?
  - Did they change their mind?
  common_errors:
  - 'Answering in the weak pattern: overrides objections'

- external_key: leadership.innovation.killing_an_experiment
  competency_key: leadership
  topic: Stopping something that isn't working
  difficulty: medium
  text: >-
    Tell me about stopping a project or experiment you were attached to. How did you decide?
  expected_concepts:
  - pre-set criteria
  - evidence
  - sunk cost awareness
  - communication
  - redeploying people
  - learning
  rubric:
    excellent: >-
      Uses pre-set criteria and evidence, resists sunk cost, communicates and redeploys people and captures lessons.
    good: Stops after reviewing results.
    weak: Continues because of investment.
  followups:
  - What criteria did you use?
  - How did the team feel?
  common_errors:
  - 'Answering in the weak pattern: continues because of investment'

- external_key: leadership.innovation.prioritising_improvement_ideas
  competency_key: project_management
  topic: Choosing which ideas to pursue
  difficulty: medium
  text: You have many improvement ideas and limited capacity. How do you choose?
  expected_concepts:
  - expected benefit
  - effort
  - confidence
  - alignment with goals
  - reversibility
  - stakeholder input
  - reviewing
  rubric:
    excellent: >-
      Compares benefit, effort and confidence, aligns with goals, and shows the result of the choices.
    good: Prioritises with a simple method.
    weak: Picks the most exciting.
  followups:
  - What method did you use?
  - What did you leave out?
  common_errors:
  - 'Answering in the weak pattern: picks the most exciting'

- external_key: leadership.innovation.failing_safely
  competency_key: adaptability
  topic: Making it safe to try things
  difficulty: medium
  text: How do you structure experiments so that failure is cheap and safe?
  expected_concepts:
  - small scope
  - feature flags or pilots
  - rollback
  - limited audience
  - monitoring
  - blameless handling of results
  rubric:
    excellent: >-
      Limits scope, uses flags or pilots, has rollback and monitoring, and treats failures as learning.
    good: Runs pilots with a rollback.
    weak: Tests changes directly in full production.
  followups:
  - What was your rollback?
  - What failed cheaply?
  common_errors:
  - 'Answering in the weak pattern: tests changes directly in full production'

- external_key: leadership.innovation.evidence_vs_intuition
  competency_key: statistics_experimentation
  topic: Using data and judgment
  difficulty: medium
  text: When do you trust data and when do you trust your judgment about a new idea?
  expected_concepts:
  - quality and size of data
  - novelty
  - cost of being wrong
  - combining sources
  - test cheaply
  - openness about bias
  rubric:
    excellent: >-
      Weighs data quality against novelty and risk, combines sources and tests cheaply when unsure.
    good: Uses both with some reasoning.
    weak: Always follows one.
  followups:
  - When did data mislead you?
  - When did judgment win?
  common_errors:
  - 'Answering in the weak pattern: always follows one'

- external_key: leadership.innovation.innovation_in_regulated_context
  competency_key: adaptability
  topic: Innovating under constraints
  difficulty: medium
  text: >-
    How do you introduce new ways of working when you have strict compliance or reliability constraints?
  expected_concepts:
  - understanding the constraints
  - small safe steps
  - involving compliance
  - evidence for change
  - pilots in low-risk areas
  - documentation
  rubric:
    excellent: >-
      Understands constraints, involves compliance, pilots in low-risk areas and documents evidence.
    good: Works within constraints with a pilot.
    weak: Avoids change because of the constraints.
  followups:
  - Who did you involve?
  - Which area did you start in?
  common_errors:
  - 'Answering in the weak pattern: avoids change because of the constraints'

- external_key: leadership.innovation.copying_vs_inventing
  competency_key: product_sense
  topic: Build novel or adopt proven
  difficulty: medium
  text: >-
    How do you decide between building something novel and adopting a proven solution?
  expected_concepts:
  - strategic value
  - cost
  - risk
  - maintenance
  - team skill
  - time
  - reversibility
  rubric:
    excellent: >-
      Weighs strategic value, cost, risk and maintenance and shows a decision with reasoning.
    good: Compares options.
    weak: Prefers building from excitement.
  followups:
  - What was the deciding factor?
  - How did it turn out?
  common_errors:
  - 'Answering in the weak pattern: prefers building from excitement'

- external_key: leadership.innovation.adoption_of_internal_tools
  competency_key: collaboration
  topic: Getting an internal improvement adopted
  difficulty: medium
  text: >-
    You built something that improves work, but other teams are not using it. What do you do?
  expected_concepts:
  - finding out why
  - user research
  - reducing friction
  - documentation
  - champions
  - measuring adoption
  - being willing to change
  rubric:
    excellent: >-
      Asks users, reduces friction, finds champions and measures adoption, and changes the tool.
    good: Promotes the tool with some feedback.
    weak: Blames users for not adopting.
  followups:
  - What was the main barrier?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: blames users for not adopting'

- external_key: leadership.innovation.technical_exploration_spike
  competency_key: problem_solving
  topic: Exploring an unknown
  difficulty: medium
  text: >-
    How do you run a time-boxed investigation of an unfamiliar technology or approach?
  expected_concepts:
  - questions to answer
  - time box
  - success criteria
  - recording findings
  - decision
  - sharing
  - what to do if inconclusive
  rubric:
    excellent: >-
      Defines questions and time box, records findings and makes or recommends a decision.
    good: Runs a spike with a conclusion.
    weak: Explores without a goal.
  followups:
  - What questions did you set?
  - What if inconclusive?
  common_errors:
  - 'Answering in the weak pattern: explores without a goal'

- external_key: leadership.innovation.risk_of_novelty
  competency_key: leadership
  topic: Risk from new technology
  difficulty: medium
  text: >-
    Your team wants to adopt a new technology. How do you weigh excitement against the risks?
  expected_concepts:
  - problem fit
  - maturity
  - skills
  - support
  - exit options
  - pilot
  - team agreement
  rubric:
    excellent: >-
      Checks problem fit and maturity, plans a pilot and an exit, and gets team agreement.
    good: Weighs pros and cons.
    weak: Adopts for excitement.
  followups:
  - What was the exit option?
  - How did the pilot go?
  common_errors:
  - 'Answering in the weak pattern: adopts for excitement'

- external_key: leadership.innovation.incremental_vs_big_change
  competency_key: leadership
  topic: Small steps or a big rewrite
  difficulty: medium
  text: >-
    Tell me about a time you chose between incremental improvement and a big redesign. What did you choose and why?
  expected_concepts:
  - risk
  - benefit
  - time
  - learning along the way
  - team capacity
  - reversibility
  - outcome
  rubric:
    excellent: >-
      Compares both with risk and timing, chooses with reasoning and reports the outcome.
    good: Picks an option with reasoning.
    weak: Defaults to a rewrite.
  followups:
  - What would have made you choose the other?
  - How did it go?
  common_errors:
  - 'Answering in the weak pattern: defaults to a rewrite'

- external_key: leadership.innovation.learning_culture_after_mistakes
  competency_key: culture_values
  topic: Mistakes as learning
  difficulty: hard
  text: How do you handle mistakes in a way that leads to learning and not hiding?
  expected_concepts:
  - reacting well
  - sharing
  - reviews
  - changing systems
  - modelling
  - follow-up
  rubric:
    excellent: >-
      Reacts constructively, shares own mistakes, reviews and changes systems, and shows more reporting.
    good: Treats mistakes as learning.
    weak: Penalises mistakes.
  followups:
  - What mistake did you share?
  - What changed in the system?
  common_errors:
  - 'Answering in the weak pattern: penalises mistakes'

- external_key: leadership.innovation.leading_through_ambiguity_of_new_domain
  competency_key: leadership
  topic: Entering a domain where nobody knows the answer
  difficulty: hard
  text: >-
    Your team enters a new domain where no one has expertise. How do you lead the learning and decide what to build?
  expected_concepts:
  - learning plan
  - early expert contact
  - small experiments
  - assumptions list
  - decision checkpoints
  - managing stakeholder expectations
  rubric:
    excellent: >-
      Plans learning, consults experts, runs small experiments on explicit assumptions, sets checkpoints and manages expectations.
    good: Experiments and learns.
    weak: Builds a large solution early.
  followups:
  - Which assumption was wrong?
  - How did you manage expectations?
  common_errors:
  - 'Answering in the weak pattern: builds a large solution early'

- external_key: leadership.innovation.innovation_in_a_risk_averse_org
  competency_key: leadership
  topic: Changing a cautious environment
  difficulty: hard
  text: >-
    Your organisation is cautious and punishes failures. How do you create room for experimentation?
  expected_concepts:
  - sponsor
  - small safe pilots
  - language of risk and learning
  - evidence
  - protecting the team
  - gradual scaling
  - leaders' trust
  rubric:
    excellent: >-
      Finds a sponsor, runs small safe pilots, shows evidence, protects the team and scales gradually.
    good: Starts small and builds support.
    weak: Waits for the culture to change.
  followups:
  - Who sponsored you?
  - What was the first pilot?
  common_errors:
  - 'Answering in the weak pattern: waits for the culture to change'

- external_key: leadership.innovation.ending_a_legacy_practice
  competency_key: leadership
  topic: Retiring something people love
  difficulty: hard
  text: >-
    A practice or tool that people like no longer serves the team well. How do you retire it?
  expected_concepts:
  - evidence
  - understanding attachment
  - alternatives
  - transition
  - communication
  - timeline
  - review
  rubric:
    excellent: >-
      Shows evidence, understands attachment, offers alternatives, plans transition and reviews.
    good: Replaces with communication.
    weak: Removes it abruptly.
  followups:
  - Who resisted?
  - What did you give people in return?
  common_errors:
  - 'Answering in the weak pattern: removes it abruptly'

- external_key: leadership.innovation.balancing_exploration_and_exploitation
  competency_key: leadership
  topic: Where to invest effort
  difficulty: hard
  text: >-
    How do you decide how much of your team's capacity should go to exploring new ideas versus improving what already works?
  expected_concepts:
  - stage of product
  - risk
  - portfolio
  - stakeholder expectations
  - evidence
  - periodic rebalancing
  rubric:
    excellent: Uses a portfolio view with explicit proportions, evidence and periodic review.
    good: Splits capacity.
    weak: Decides ad hoc.
  followups:
  - What proportion did you use?
  - When did you change it?
  common_errors:
  - 'Answering in the weak pattern: decides ad hoc'

- external_key: leadership.innovation.evaluating_hype
  competency_key: problem_solving
  topic: Assessing a trend
  difficulty: hard
  text: >-
    Leadership is excited about a trending technology. How do you evaluate it without dismissing or embracing it blindly?
  expected_concepts:
  - problem fit
  - evidence
  - proofs of concept
  - cost
  - skills
  - risks
  - communicating assessment
  rubric:
    excellent: >-
      Defines the problem, runs proofs of concept with criteria, weighs cost and risk and communicates a fair assessment.
    good: Evaluates with a pilot.
    weak: Dismisses or embraces without testing.
  followups:
  - What criteria did you use?
  - What did you conclude?
  common_errors:
  - 'Answering in the weak pattern: dismisses or embraces without testing'

- external_key: leadership.innovation.unsuccessful_big_bet
  competency_key: ownership
  topic: A large initiative that failed
  difficulty: hard
  text: >-
    Describe a large initiative you led that did not deliver the expected value. What did you do and learn?
  expected_concepts:
  - signs of trouble
  - decisions to continue or stop
  - communication
  - costs
  - lessons
  - changes to how you plan bets
  rubric:
    excellent: >-
      Describes signs, decision points, communication and cost, and gives lessons that changed planning.
    good: Describes the failure and learning.
    weak: Blames external causes.
  followups:
  - When did you first doubt it?
  - What would you change?
  common_errors:
  - 'Answering in the weak pattern: blames external causes'
