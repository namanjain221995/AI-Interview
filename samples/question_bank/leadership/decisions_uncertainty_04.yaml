# Curated questions: leadership round, decisions under uncertainty (part 4 of 4). Decision hygiene, key-person and vendor risk, pivots, funding uncertainty and wide-impact decisions. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.decisions_uncertainty.ask_better_questions
  competency_key: problem_solving
  topic: Questions you ask before deciding
  difficulty: easy
  text: >-
    What are the first few questions you ask yourself or others when a decision lands on your desk and
    you don't have the full picture?
  expected_concepts:
  - what problem are we really solving
  - what happens if we do nothing
  - what would change my mind
  - who is affected
  - how reversible is it
  rubric:
    excellent: >-
      Gives a short, specific set of questions with reasons, shows how they changed a real decision, and
      adapts them to the stakes.
    good: Lists sensible questions with a loose example.
    weak: Jumps to options or gives generic answers such as gathering data.
  followups:
  - Which question has been most useful?
  - Which do you skip when time is short?
  common_errors:
  - Starting with solutions before the problem is clear.

- external_key: leadership.decisions_uncertainty.anchoring_awareness
  competency_key: problem_solving
  topic: Noticing when a first number sticks
  difficulty: easy
  text: >-
    Early numbers and first proposals tend to anchor a discussion. Have you noticed that in a decision
    you were part of, and what did you do?
  expected_concepts:
  - recognising anchoring in estimates or proposals
  - asking for independent estimates
  - generating alternatives before debating
  - questioning the source of the first number
  rubric:
    excellent: >-
      Gives a real instance, shows steps such as collecting independent estimates or alternatives first,
      and the effect on the result.
    good: Recognises the pattern with a modest example.
    weak: Does not recognise anchoring or dismisses its relevance.
  followups:
  - How did you collect independent views?
  - Does seniority make anchoring worse?
  common_errors:
  - Letting the first proposal frame all later options.

- external_key: leadership.decisions_uncertainty.decision_doc_for_peers
  competency_key: communication
  topic: Writing up a decision for peers
  difficulty: easy
  text: >-
    When you need peers to understand a decision made under uncertainty, what do you put in the write-up?
  expected_concepts:
  - the problem and context
  - options considered
  - known and unknown facts
  - the choice and the reasons
  - how and when it will be revisited
  rubric:
    excellent: >-
      Describes a compact structure that covers context, options, unknowns, reasons and revisit conditions,
      and shows how readers used it.
    good: Covers the decision and reasons with some of the structure.
    weak: Writes only the conclusion or a long narrative without structure.
  followups:
  - How long should it be?
  - How do you invite objections?
  common_errors:
  - Writing only the conclusion so readers cannot see the reasoning.

- external_key: leadership.decisions_uncertainty.near_miss_learning
  competency_key: ownership
  topic: Learning from a near miss
  difficulty: easy
  text: >-
    Tell me about a time something almost went wrong because of a decision made with limited information.
    What did you change afterward?
  expected_concepts:
  - recognising the near miss as a signal
  - reviewing the decision process
  - sharing the lesson
  - making a specific change in checks or practice
  rubric:
    excellent: >-
      Uses a real near miss, reviews how the decision was made, shares the learning with others, and describes
      a concrete change in checks or practice.
    good: Describes the near miss and a reasonable lesson.
    weak: Cannot give an example or says nothing needed changing because nothing happened.
  followups:
  - How did you share it?
  - What check did you add?
  common_errors:
  - Treating a near miss as proof the process works.

- external_key: leadership.decisions_uncertainty.first_hundred_days_unknowns
  competency_key: adaptability
  topic: Making calls before you know the context
  difficulty: easy
  text: >-
    In a new role there are decisions to make before you really know the history. How do you decide which
    ones to make quickly and which to hold off on?
  expected_concepts:
  - tying decisions to urgency and reversibility
  - asking people with history
  - observing before changing
  - being open that you are learning
  - revisiting early calls
  rubric:
    excellent: >-
      Distinguishes urgent and reversible from deferrable, consults people with context, tells the team
      they are still learning, and reviews early decisions.
    good: Is careful and consults people, with moderate structure.
    weak: Changes things quickly to show impact or avoids decisions altogether.
  followups:
  - What did you leave alone?
  - What did you reverse later?
  common_errors:
  - Making visible changes early just to show impact.

- external_key: leadership.decisions_uncertainty.key_person_risk
  competency_key: project_management
  topic: Planning around a key person who might leave
  difficulty: medium
  text: >-
    A critical team member has hinted they may leave, and you can't be sure. How do you plan and decide
    without acting on a rumour?
  expected_concepts:
  - reducing single points of knowledge anyway
  - discussing career and workload directly with the person
  - documenting and pairing
  - preparing a contingency
  - avoiding premature actions that harm trust
  rubric:
    excellent: >-
      Works on knowledge sharing as ordinary practice, talks with the person directly about what they
      want in their work, prepares contingency quietly, and avoids hasty decisions.
    good: Plans some knowledge transfer and speaks to the person.
    weak: Ignores the risk or acts on the rumour in ways that damage trust.
  followups:
  - How would you start the conversation?
  - What would you do if they left suddenly?
  common_errors:
  - Planning a replacement behind the person's back.

- external_key: leadership.decisions_uncertainty.tool_migration_decision
  competency_key: leadership
  topic: Deciding on a tool migration without proof
  difficulty: medium
  text: >-
    Your team wants to move to a new build or deployment tool, but nobody can show it will actually save
    time here. How do you decide?
  expected_concepts:
  - estimating the cost of the current pain
  - running a trial on one service
  - measuring time or failure rates
  - considering migration effort
  - defining success criteria and rollback
  rubric:
    excellent: >-
      Quantifies the current pain, trials on a representative service, measures outcomes against criteria,
      includes migration cost and a rollback plan.
    good: Trials the tool and gets team opinions, with limited measurement.
    weak: Adopts because the team is keen, or rejects because change is costly.
  followups:
  - How did you pick the pilot service?
  - What would convince you not to proceed?
  common_errors:
  - Counting benefits from vendor claims instead of measuring locally.

- external_key: leadership.decisions_uncertainty.mid_project_pivot
  competency_key: adaptability
  topic: Pivoting mid-project on new signals
  difficulty: medium
  text: >-
    Halfway through a project you get signals that the original goal may no longer be the right one. How
    do you decide whether to pivot?
  expected_concepts:
  - checking how reliable the signals are
  - comparing the value of the original and the new goal
  - reusing completed work
  - consulting the sponsor and team
  - setting a decision date
  rubric:
    excellent: >-
      Tests the signals, compares the original and new value, identifies reusable work, involves sponsor
      and team, and decides by a set date with clear communication.
    good: Considers both paths and consults stakeholders, with less on reuse.
    weak: Pivots on one anecdote or refuses to change from attachment to the plan.
  followups:
  - How did the team react?
  - What did you salvage?
  common_errors:
  - >-
    Pivoting on a single anecdote or refusing to change out of attachment to the plan.

- external_key: leadership.decisions_uncertainty.quality_vs_speed_unknown
  competency_key: ownership
  topic: Speed or quality when the risk is unclear
  difficulty: medium
  text: >-
    A team lead asks to cut testing to hit a date, and neither of you knows how likely a defect is to
    reach customers. How do you decide?
  expected_concepts:
  - identifying the highest-risk areas
  - targeted testing instead of all-or-nothing
  - staged release with monitoring
  - costs of customer defects
  - agreeing the trade-off with the stakeholders
  rubric:
    excellent: >-
      Focuses testing on the riskiest areas, proposes staged rollout and monitoring, makes the risk explicit
      to the stakeholders and agrees the trade-off together.
    good: Proposes targeted testing with some stakeholder discussion.
    weak: Skips testing silently or insists on full testing regardless of cost.
  followups:
  - How did you pick the risky areas?
  - What would you monitor?
  common_errors:
  - Treating the choice as all testing or none.

- external_key: leadership.decisions_uncertainty.team_morale_during_uncertainty
  competency_key: communication
  topic: Leading a team through unclear company direction
  difficulty: medium
  text: >-
    The company's direction is unsettled and your team keeps asking what will happen to their projects.
    How do you communicate when you don't know the answers?
  expected_concepts:
  - sharing what is known and what is not
  - setting regular update times
  - focusing the team on work within their control
  - escalating questions to leadership
  - not speculating
  rubric:
    excellent: >-
      Is clear about known and unknown, commits to regular updates, keeps the team focused on controllable
      work, relays questions upward, and avoids speculation.
    good: Communicates regularly and keeps the team informed, with limited escalation.
    weak: Withholds information or offers reassurance that is not grounded.
  followups:
  - What did you say when you didn't know?
  - How did you get answers from leadership?
  common_errors:
  - Offering reassurance that has no basis in what is known.

- external_key: leadership.decisions_uncertainty.dependency_on_vendor_roadmap
  competency_key: stakeholder_management
  topic: Relying on a vendor's uncertain roadmap
  difficulty: medium
  text: >-
    A feature you plan to launch depends on something a vendor says is coming, but with no firm date.
    How do you plan?
  expected_concepts:
  - asking for a written commitment or date range
  - building a fallback or abstraction
  - scheduling decision points
  - informing your stakeholders of the dependency
  - weighing switching cost
  rubric:
    excellent: >-
      Seeks commitments and dates, builds a fallback or abstraction, sets decision points, and keeps stakeholders
      informed of the dependency and its risk.
    good: Plans a fallback and communicates the risk.
    weak: Plans on the vendor's word alone.
  followups:
  - What would your fallback be?
  - At what point would you switch?
  common_errors:
  - Planning around a vendor promise with no fallback.

- external_key: leadership.decisions_uncertainty.incident_followup_priorities
  competency_key: ownership
  topic: Choosing follow-up actions after an incident
  difficulty: medium
  text: >-
    A review of a major incident produced thirty possible actions and you can't do them all. How do you
    decide which ones to take on?
  expected_concepts:
  - linking actions to causes and risk
  - estimating effort versus risk reduction
  - picking a few with owners and dates
  - accepting some risks explicitly
  - tracking follow-through
  rubric:
    excellent: >-
      Ranks actions by risk reduction and effort, commits to a few with owners and dates, records accepted
      risks, and tracks completion.
    good: Chooses sensible actions with owners.
    weak: Takes everything and completes little, or takes nothing.
  followups:
  - What did you decide not to do?
  - How do you ensure they get done?
  common_errors:
  - Accepting every action item and finishing few of them.

- external_key: leadership.decisions_uncertainty.interpreting_experiment_inconclusive
  competency_key: problem_solving
  topic: An experiment with unclear results
  difficulty: medium
  text: >-
    A test you ran came back with a small difference and wide uncertainty. How do you decide what to do
    next?
  expected_concepts:
  - understanding the confidence of the result
  - asking if it is practically significant
  - considering a longer or larger test
  - weighing cost of acting wrongly
  - deciding with the team
  rubric:
    excellent: >-
      Reads the uncertainty correctly, judges practical importance, decides between extending, stopping
      or acting based on cost of being wrong, and records the reasoning.
    good: Recognises the result is unclear and decides with some reasoning.
    weak: Declares a winner from a small difference or discards the test.
  followups:
  - Would you extend the test?
  - How do you explain this to executives?
  common_errors:
  - Declaring a winner from a difference within the noise.

- external_key: leadership.decisions_uncertainty.hedging_with_contract_terms
  competency_key: stakeholder_management
  topic: Using contract terms to limit exposure
  difficulty: medium
  text: >-
    You are entering a long agreement with a partner whose reliability you can't yet judge. How do you
    structure it to limit your exposure?
  expected_concepts:
  - shorter initial term
  - milestones and review points
  - service levels with remedies
  - exit and data return provisions
  - involving legal and procurement
  rubric:
    excellent: >-
      Proposes staged terms with review points, defined service levels, clear exit and data provisions,
      and involves legal early.
    good: Builds in some protections and reviews.
    weak: Signs a long commitment on trust or avoids partners entirely.
  followups:
  - Which clause would you not compromise on?
  - How would you monitor the partner?
  common_errors:
  - Signing a long commitment on trust before reliability is shown.

- external_key: leadership.decisions_uncertainty.ai_adoption_unknown_risk
  competency_key: leadership
  topic: Adopting an AI tool with unknown risks
  difficulty: hard
  text: >-
    People on your team want to use AI tools in daily work, and the risks to quality, privacy and security
    are not fully understood. How do you decide what to allow?
  expected_concepts:
  - identifying data and risk categories
  - piloting with guardrails
  - involving security and legal
  - defining review requirements
  - measuring effects and adjusting policy
  rubric:
    excellent: >-
      Classifies uses by data sensitivity and risk, pilots with guardrails and review rules, involves
      security and legal, measures effects and updates the policy as learning arrives.
    good: Sets reasonable rules with some pilot and monitoring.
    weak: Bans everything or allows everything without conditions.
  followups:
  - How would you know it works?
  - How do you handle someone breaking the rules?
  common_errors:
  - Writing a permanent policy before learning anything from a pilot.

- external_key: leadership.decisions_uncertainty.conflicting_data_sources_exec
  competency_key: stakeholder_management
  topic: Two sources giving opposite answers to executives
  difficulty: hard
  text: >-
    Two teams present opposite conclusions to an executive group using different data, and you're asked
    to settle it. How do you approach that?
  expected_concepts:
  - understanding definitions and methods behind each
  - reconciling the data
  - agreeing a single definition
  - presenting the difference transparently
  - deciding how to act while unresolved
  rubric:
    excellent: >-
      Traces differences to definitions and methods, reconciles with both teams, proposes a shared definition,
      tells executives plainly what is and isn't known, and recommends a reversible action meanwhile.
    good: Investigates and reconciles with some executive communication.
    weak: Picks the more favourable data or defers to the more senior team.
  followups:
  - How did you handle the team whose numbers were wrong?
  - What did you tell the executives?
  common_errors:
  - Choosing whichever dataset supports the preferred answer.

- external_key: leadership.decisions_uncertainty.reorg_with_partial_info
  competency_key: leadership
  topic: Restructuring a team with limited knowledge
  difficulty: hard
  text: >-
    You are asked to propose changes to how your teams are organised, but you only partly understand how
    work flows today. How do you build confidence in a proposal?
  expected_concepts:
  - mapping actual work flow and handoffs
  - talking to the people doing the work
  - testing a proposal on a small area
  - assessing risks to delivery and morale
  - phasing the change
  rubric:
    excellent: >-
      Maps real flows, listens to people involved, trials in a small area, assesses delivery risks, and
      phases the change with review points.
    good: Gathers input and plans sensible steps.
    weak: Redraws boxes from theory or implements all at once.
  followups:
  - What did the mapping reveal?
  - What did you phase?
  common_errors:
  - Redrawing the organisation chart without understanding the work flow.

- external_key: leadership.decisions_uncertainty.uncertain_funding_roadmap
  competency_key: project_management
  topic: Planning when funding is not confirmed
  difficulty: hard
  text: >-
    Funding for next year hasn't been confirmed, but your teams need a plan now. How do you plan?
  expected_concepts:
  - tiering work into must, should and could
  - sequencing so the early work is valuable alone
  - identifying decision points tied to funding
  - communicating the plan's conditions
  - avoiding commitments that can't be unwound
  rubric:
    excellent: >-
      Tiers the work, orders it so each piece delivers value alone, ties decision points to funding signals,
      communicates conditions and avoids irreversible commitments.
    good: Plans scenarios and tiers work with some communication.
    weak: Plans as though funding is certain or freezes all planning.
  followups:
  - How did you prioritise the tiers?
  - What did you tell the team?
  common_errors:
  - Planning as if funding were certain or freezing all planning.

- external_key: leadership.decisions_uncertainty.reversing_irreversible_mistake
  competency_key: ownership
  topic: When a hard-to-reverse decision proves wrong
  difficulty: hard
  text: >-
    Tell me about a decision that was costly to reverse, turned out wrong, and what you did when you realised.
  expected_concepts:
  - acknowledging the mistake quickly
  - quantifying the cost of continuing versus reversing
  - limiting further damage
  - communicating with those affected
  - capturing lessons
  rubric:
    excellent: >-
      Admits the error early, compares continue and reverse costs, limits further damage, communicates
      with affected people and shares specific lessons.
    good: Takes responsibility and takes sensible steps, with fewer details of lessons.
    weak: Persists to avoid admitting error or shifts blame.
  followups:
  - How did you decide the cost of reversing?
  - What did you share with others?
  common_errors:
  - Continuing to avoid admitting the error.

- external_key: leadership.decisions_uncertainty.coordinated_decision_many_teams
  competency_key: stakeholder_management
  topic: A decision that affects many teams with unclear impacts
  difficulty: hard
  text: >-
    You must make a decision that affects many teams, and nobody knows its full impact. How do you decide
    and bring those teams with you?
  expected_concepts:
  - finding affected teams early
  - sharing a draft with questions
  - piloting with a team or two
  - defining a feedback window
  - clearly stating who decides
  rubric:
    excellent: >-
      Identifies affected teams, shares a draft early, pilots on a few, runs a defined feedback window,
      and states who decides and when.
    good: Consults teams and decides with some staging.
    weak: Announces the decision or waits for universal agreement.
  followups:
  - Which team would you pilot with?
  - What if a team objects after the window?
  common_errors:
  - Announcing the decision without a window for affected teams to respond.

- external_key: leadership.decisions_uncertainty.uncertain_market_pricing
  competency_key: product_sense
  topic: A pricing or packaging decision with little evidence
  difficulty: hard
  text: >-
    You have to choose between two pricing or packaging approaches with limited evidence. How do you decide
    and how do you reduce the risk?
  expected_concepts:
  - gathering customer reactions in small tests
  - segmenting customers
  - modelling revenue scenarios
  - testing with a subset
  - setting criteria to roll back
  rubric:
    excellent: >-
      Collects customer input, segments, models scenarios, tests on a subset with a rollback criterion,
      and decides with finance and sales aligned.
    good: Gathers input and tests, with less modelling.
    weak: Chooses by competitor copying or intuition only.
  followups:
  - How did you pick the subset?
  - What was the rollback criterion?
  common_errors:
  - Copying a competitor's price without checking fit.

- external_key: leadership.decisions_uncertainty.decision_meeting_hygiene
  competency_key: communication
  topic: Running a meeting that must end in a decision
  difficulty: medium
  text: >-
    How do you run a meeting where the group has to reach a decision despite gaps in the information?
  expected_concepts:
  - sharing the pre-read in advance
  - naming the decision and the decider
  - listing the unknowns upfront
  - time-boxing debate
  - recording the decision and next steps
  rubric:
    excellent: >-
      Describes a pre-read, named decision owner, explicit unknowns, time-boxed discussion, and a written
      record with owners and revisit date.
    good: Runs the meeting with an agenda and records outcomes.
    weak: Lets discussion run without a decision or owner.
  followups:
  - What do you do if the decider is absent?
  - How do you handle dominant voices?
  common_errors:
  - Ending the meeting with agreement in principle but no named owner.

- external_key: leadership.decisions_uncertainty.learning_curve_leader_decision
  competency_key: leadership
  topic: Deciding in an area outside your expertise
  difficulty: medium
  text: >-
    Tell me about a time you had to make a call in a technical area you weren't expert in. How did you
    do it responsibly?
  expected_concepts:
  - being open about the limits of your expertise
  - asking domain experts for options and trade-offs
  - learning enough to ask good questions
  - deciding on criteria
  - sharing credit and accountability
  rubric:
    excellent: >-
      Names the limit plainly, draws out trade-offs from experts, learns enough to question them, decides
      on stated criteria, and stays accountable.
    good: Consults experts and decides, with less on criteria.
    weak: Defers entirely or overrides experts without reasons.
  followups:
  - How did you check the experts' advice?
  - What did you learn?
  common_errors:
  - Overruling specialists to show decisiveness.

- external_key: leadership.decisions_uncertainty.change_of_scope_midquarter
  competency_key: project_management
  topic: A major priority arrives mid-quarter
  difficulty: medium
  text: >-
    A new top priority arrives mid-quarter and no one knows how long it will take. How do you decide what
    gives way?
  expected_concepts:
  - sizing the new work roughly
  - identifying what is already in flight and its stage
  - choosing work to pause with the least loss
  - agreeing the trade-off with stakeholders
  - reviewing the estimate soon
  rubric:
    excellent: >-
      Makes a rough size with a range, considers what is nearly finished, selects what to pause with the
      least waste, gets stakeholders to agree the trade-off, and re-checks early.
    good: Reprioritises and communicates with sensible logic.
    weak: Adds the work on top of everything or drops work arbitrarily.
  followups:
  - What do you tell stakeholders whose work was paused?
  - How do you size quickly?
  common_errors:
  - Absorbing the new work silently and letting existing commitments slip.

- external_key: leadership.decisions_uncertainty.conflicting_customer_feedback
  competency_key: product_sense
  topic: Customers asking for opposite things
  difficulty: medium
  text: >-
    Two important customer groups are asking for opposite changes to a product, and you can serve only
    one in the near term. How do you decide?
  expected_concepts:
  - understanding the underlying needs behind each request
  - sizing each group's importance and risk
  - looking for a solution that serves both
  - communicating the decision and timing
  - revisiting later
  rubric:
    excellent: >-
      Digs into underlying needs, weighs strategic importance, searches for a combined approach, communicates
      with both groups, and sets a time to revisit.
    good: Weighs the two groups and decides with communication.
    weak: Chooses the louder customer or tries to do both poorly.
  followups:
  - How did the other group react?
  - How did you check the underlying need?
  common_errors:
  - >-
    Taking the feature request at face value without understanding the need behind it.
