# Curated questions: leadership round, technical direction (part 4 of 4). Design review, mentoring, shared libraries, interface evolution, executive strategy and long-term cost. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.technical_direction.judging_a_design_doc
  competency_key: leadership
  topic: What you look for in a design document
  difficulty: easy
  text: >-
    When someone sends you a design document, what do you look for to judge whether it's ready to build
    from?
  expected_concepts:
  - a clear problem and goals
  - non-goals
  - alternatives considered
  - risks and open questions
  - testing and rollout plan
  rubric:
    excellent: >-
      Looks for a clear problem, goals and non-goals, alternatives, risks and open questions, and a testing
      and rollout plan, and explains how the review improved a real design.
    good: Looks for a clear problem and reasonable solution.
    weak: Looks only at the solution's technical detail.
  followups:
  - What is the most common gap?
  - How do you give the feedback?
  common_errors:
  - Looks only at the solution's technical detail.

- external_key: leadership.technical_direction.ask_why_repeatedly
  competency_key: problem_solving
  topic: Getting to the real requirement
  difficulty: easy
  text: >-
    A team asks for a technical solution. How do you find out whether it is the right solution to the
    problem?
  expected_concepts:
  - asking what problem it solves
  - asking why repeatedly
  - checking alternatives
  - learning the constraints
  - confirming the outcome wanted
  rubric:
    excellent: >-
      Asks what problem it solves and probes with why, checks alternatives and constraints and confirms
      the outcome, with an example where the request changed.
    good: Asks about the underlying problem.
    weak: Implements the solution as asked.
  followups:
  - How did the request change?
  - How do you ask without sounding dismissive?
  common_errors:
  - Building the requested solution without checking the problem.

- external_key: leadership.technical_direction.learning_from_incidents_to_direction
  competency_key: ownership
  topic: Turning incident lessons into technical direction
  difficulty: easy
  text: >-
    Tell me about an incident that changed how you or your team make technical decisions.
  expected_concepts:
  - understanding the root causes
  - seeing patterns across incidents
  - changing standards or defaults
  - sharing the lesson
  - checking the change worked
  rubric:
    excellent: >-
      Identifies root causes and patterns, changes a default or standard, shares the lesson and checks
      the effect.
    good: Describes the incident and a lesson applied.
    weak: Treats the incident as a one-off.
  followups:
  - What changed in practice?
  - How did you check it worked?
  common_errors:
  - Treats the incident as a one-off.

- external_key: leadership.technical_direction.simple_first
  competency_key: leadership
  topic: Starting with the simplest design
  difficulty: easy
  text: >-
    What does starting with the simplest design that could work mean to you, and when have you chosen
    not to?
  expected_concepts:
  - meeting current requirements
  - understanding what is hard to change later
  - leaving room to grow
  - simplicity in operation
  - recognising when complexity is justified
  rubric:
    excellent: >-
      Defines simplicity in terms of current need and operation, identifies what is hard to change, and
      gives a case for each choice.
    good: Prefers simple designs and gives an example.
    weak: Treats simple as lacking planning.
  followups:
  - What was hard to change later?
  - How do you convince a team?
  common_errors:
  - Treats simple as lacking planning.

- external_key: leadership.technical_direction.know_when_to_stop_designing
  competency_key: ownership
  topic: Knowing when a design is good enough
  difficulty: easy
  text: How do you tell when it's time to stop designing and start building?
  expected_concepts:
  - key risks have been addressed
  - open questions are small or reversible
  - the team understands the plan
  - a first slice can be built
  - cost of further analysis
  rubric:
    excellent: >-
      Describes criteria such as addressing key risks, remaining questions being reversible, shared understanding
      and a buildable first slice.
    good: Stops when the main risks are covered.
    weak: Keeps designing for completeness or starts without any design.
  followups:
  - What did you leave open?
  - What if the team disagrees?
  common_errors:
  - Keeps designing for completeness or starts without any design.

- external_key: leadership.technical_direction.architect_role_in_team
  competency_key: leadership
  topic: Defining the role of an architect or senior technical leader
  difficulty: medium
  text: >-
    How should a senior technical leader work with teams so that they improve decisions without becoming
    a bottleneck?
  expected_concepts:
  - being involved early rather than at approval
  - guiding principles
  - coaching others to decide
  - selective deep dives
  - sharing context widely
  rubric:
    excellent: >-
      Gets involved early, sets principles, coaches others to decide, dives deep selectively and shares
      context widely.
    good: Reviews designs and advises.
    weak: Approves all designs personally.
  followups:
  - How do you avoid becoming a bottleneck?
  - What decisions do you leave to teams?
  common_errors:
  - Approves all designs personally.

- external_key: leadership.technical_direction.mentoring_design_skills
  competency_key: mentoring
  topic: Helping engineers learn to design well
  difficulty: medium
  text: How do you help less experienced engineers get better at technical design?
  expected_concepts:
  - letting them draft designs
  - asking questions rather than giving answers
  - reviewing past decisions together
  - explaining trade-offs
  - giving real responsibility
  rubric:
    excellent: >-
      Lets them draft, asks guiding questions, reviews past decisions together, explains trade-offs and
      gives real responsibility, with a specific person's growth.
    good: Reviews designs and gives feedback.
    weak: Gives answers or does the design for them.
  followups:
  - What was their first design?
  - How did you handle a poor design?
  common_errors:
  - Gives answers or does the design for them.

- external_key: leadership.technical_direction.pace_of_technical_change
  competency_key: adaptability
  topic: Setting a sustainable pace of technical change
  difficulty: medium
  text: >-
    Your teams have proposed many technical improvements at once. How do you decide how many to pursue
    at once?
  expected_concepts:
  - limiting concurrent changes
  - sequencing by value and dependency
  - measuring capacity
  - finishing before starting
  - keeping delivery stable
  rubric:
    excellent: >-
      Limits concurrent changes, sequences by value and dependency, measures capacity, finishes before
      starting more and protects delivery.
    good: Prioritises improvements and limits parallel work.
    weak: Pursues everything or nothing.
  followups:
  - What did you stop?
  - How do you say no?
  common_errors:
  - Pursues everything or nothing.

- external_key: leadership.technical_direction.dependency_upgrades_policy
  competency_key: project_management
  topic: Keeping dependencies current
  difficulty: medium
  text: >-
    Teams fall behind on dependency and platform updates until they become emergencies. What direction
    would you set?
  expected_concepts:
  - regular small updates
  - automated pull requests
  - ownership
  - security-driven priorities
  - time allocated
  rubric:
    excellent: >-
      Sets regular small updates with automation, ownership, security-driven priority and allocated time.
    good: Sets a routine and uses tools.
    weak: Updates only when forced.
  followups:
  - How do you manage breaking updates?
  - How do you measure it?
  common_errors:
  - Updates only when forced.

- external_key: leadership.technical_direction.shared_libraries_policy
  competency_key: leadership
  topic: Governing shared libraries
  difficulty: medium
  text: >-
    Several teams use a shared internal library that one team maintains. How do you manage its evolution?
  expected_concepts:
  - clear owner and support
  - versioning and compatibility policy
  - contribution model
  - deprecation process
  - measuring usage
  rubric:
    excellent: >-
      Sets owner and support, a versioning policy, contribution model, deprecation process and usage tracking.
    good: Assigns an owner and a versioning approach.
    weak: Lets anyone change it freely.
  followups:
  - How do you handle breaking changes?
  - How do you accept contributions?
  common_errors:
  - Lets anyone change it freely.

- external_key: leadership.technical_direction.tech_health_metrics
  competency_key: problem_solving
  topic: Measuring the health of the technical estate
  difficulty: medium
  text: >-
    What would you measure to understand whether your technical foundations are healthy, and how would
    you avoid misleading numbers?
  expected_concepts:
  - delivery speed and failure rate
  - incident trends
  - time to onboard
  - age of dependencies
  - qualitative engineer input
  rubric:
    excellent: >-
      Chooses a handful of measures such as delivery metrics, incidents and onboarding time, adds qualitative
      input and guards against gaming.
    good: Chooses sensible measures.
    weak: Chooses vanity metrics or none.
  followups:
  - Which measure misled you?
  - How do you use them?
  common_errors:
  - Chooses vanity metrics or none.

- external_key: leadership.technical_direction.interface_contracts
  competency_key: leadership
  topic: Making agreements between teams explicit
  difficulty: medium
  text: >-
    Two teams depend on each other's interfaces and keep breaking each other. How do you set direction
    to fix that?
  expected_concepts:
  - explicit contracts
  - contract tests
  - versioning and deprecation
  - communication channels
  - owners
  rubric:
    excellent: >-
      Makes contracts explicit with contract tests, versioning and deprecation, communication channels
      and owners.
    good: Documents interfaces and notifies changes.
    weak: Relies on informal notice.
  followups:
  - How do you test contracts?
  - Who owns the contract?
  common_errors:
  - Relies on informal notice.

- external_key: leadership.technical_direction.incident_driven_roadmap
  competency_key: ownership
  topic: Letting incidents drive the roadmap
  difficulty: medium
  text: >-
    After a series of incidents, there is pressure for a big reliability push. How do you decide the scope?
  expected_concepts:
  - pattern analysis across incidents
  - addressing the largest causes first
  - limiting scope
  - measuring improvement
  - communicating trade-offs
  rubric:
    excellent: >-
      Analyses patterns, addresses largest causes, limits scope, measures improvement and communicates
      trade-offs.
    good: Prioritises fixes for the biggest causes.
    weak: Launches a broad programme with no scope.
  followups:
  - What did you leave out?
  - How did you measure?
  common_errors:
  - Launches a broad programme with no scope.

- external_key: leadership.technical_direction.prototype_to_production
  competency_key: project_management
  topic: Moving from prototype to production
  difficulty: medium
  text: >-
    A prototype impressed stakeholders and now they want it in production quickly. How do you handle the
    transition?
  expected_concepts:
  - being clear about what the prototype lacks
  - a list of production needs
  - reuse versus rebuild decision
  - phased release
  - setting expectations
  rubric:
    excellent: >-
      Explains what is missing, lists production needs, decides reuse or rebuild, phases release and sets
      expectations.
    good: Hardens the prototype with a plan.
    weak: Ships the prototype as is.
  followups:
  - What was missing?
  - How did you set expectations?
  common_errors:
  - Ships the prototype as is.

- external_key: leadership.technical_direction.ml_in_product_architecture
  competency_key: leadership
  topic: Integrating a model into a product architecture
  difficulty: medium
  text: >-
    How do you set technical direction when adding a machine-learning component to a product that has
    been entirely rule-based?
  expected_concepts:
  - clear interface
  - fallback to rules
  - evaluation and monitoring
  - data pipeline ownership
  - cost and latency budgets
  rubric:
    excellent: >-
      Defines a clear interface, fallback, evaluation and monitoring, data ownership and cost and latency
      budgets.
    good: Integrates with an API and monitors.
    weak: Embeds the model without fallbacks or evaluation.
  followups:
  - What is the fallback?
  - Who owns the data pipeline?
  common_errors:
  - Embeds the model without fallbacks or evaluation.

- external_key: leadership.technical_direction.data_migration_direction
  competency_key: project_management
  topic: Planning a large data migration
  difficulty: medium
  text: >-
    You must move a large body of data to a new store while the system stays in use. How do you set direction
    and manage risk?
  expected_concepts:
  - migration strategy and phases
  - consistency checks
  - cutover and rollback
  - performance impact
  - communication
  rubric:
    excellent: >-
      Sets phases, consistency checks, cutover and rollback plan, assesses performance impact and communicates.
    good: Plans a staged migration with checks.
    weak: Plans a single cutover.
  followups:
  - How did you check data?
  - What was the rollback plan?
  common_errors:
  - Plans a single cutover.

- external_key: leadership.technical_direction.interface_versioning_strategy
  competency_key: leadership
  topic: Evolving public interfaces over time
  difficulty: medium
  text: >-
    How do you set a strategy for evolving an interface used by customers or partners over several years?
  expected_concepts:
  - backwards-compatible change by default
  - clear versioning rules
  - deprecation windows
  - communication
  - usage telemetry
  rubric:
    excellent: >-
      Defaults to compatible change, sets versioning rules, deprecation windows, communicates and uses
      telemetry.
    good: Uses versioning and notice periods.
    weak: Changes interfaces freely.
  followups:
  - How long is the deprecation window?
  - How do you find out who uses what?
  common_errors:
  - Changes interfaces freely.

- external_key: leadership.technical_direction.tech_strategy_for_executives
  competency_key: communication
  topic: Presenting a technical strategy to executives
  difficulty: hard
  text: >-
    You must present a multi-year technical strategy to executives who care about business outcomes. How
    do you do it?
  expected_concepts:
  - starting with business outcomes
  - a small number of clear bets
  - costs and risks
  - milestones
  - what you are not doing
  rubric:
    excellent: >-
      Starts with business outcomes, a few clear bets, costs and risks, milestones and what is excluded.
    good: Presents plan and benefits.
    weak: Presents technology detail.
  followups:
  - What did you leave out?
  - What questions did executives ask?
  common_errors:
  - Presents technology detail.

- external_key: leadership.technical_direction.ethics_in_technical_direction
  competency_key: ownership
  topic: Raising ethical or privacy concerns in technical choices
  difficulty: hard
  text: >-
    A technical direction would work for the business but raises concerns about user privacy or fairness.
    How do you handle it?
  expected_concepts:
  - stating the concern clearly with specifics
  - consulting legal, security or privacy experts
  - offering alternatives
  - escalating if required
  - documenting
  rubric:
    excellent: >-
      States the concern specifically, consults experts, proposes alternatives, escalates if needed and
      documents.
    good: Raises the concern with leaders.
    weak: Ignores it or blocks without alternatives.
  followups:
  - What alternative did you propose?
  - When would you escalate?
  common_errors:
  - Ignores it or blocks without alternatives.

- external_key: leadership.technical_direction.sunset_platform
  competency_key: stakeholder_management
  topic: Retiring a platform with many dependants
  difficulty: hard
  text: >-
    A platform you own should be retired in favour of another. How do you manage the transition for all
    who depend on it?
  expected_concepts:
  - inventory of users
  - migration support
  - timeline with milestones
  - communication
  - parallel run
  rubric:
    excellent: >-
      Builds an inventory, provides migration support, sets a timeline, communicates regularly and runs
      in parallel.
    good: Announces a plan and supports migration.
    weak: Sets a date and leaves teams to cope.
  followups:
  - Who was hardest to move?
  - What happened at the deadline?
  common_errors:
  - Sets a date and leaves teams to cope.

- external_key: leadership.technical_direction.talent_shapes_direction
  competency_key: leadership
  topic: Letting skills and hiring shape technical choices
  difficulty: hard
  text: >-
    How much should the skills available in your team and in the hiring market influence technical direction?
  expected_concepts:
  - cost of learning
  - hiring pool
  - productivity
  - strategic bets worth building skills for
  - training plans
  rubric:
    excellent: >-
      Weighs learning cost and hiring pool, identifies strategic bets worth skill-building and plans training,
      with a concrete case.
    good: Considers skills in choices.
    weak: Ignores skills or lets them dominate.
  followups:
  - What training did you plan?
  - Where did you decide skills mattered less?
  common_errors:
  - Ignores skills or lets them dominate.

- external_key: leadership.technical_direction.key_technology_risk
  competency_key: problem_solving
  topic: A critical technology showing signs of trouble
  difficulty: hard
  text: >-
    A technology at the heart of your platform shows signs of trouble, such as a vendor in difficulty
    or a project losing maintainers. How do you respond?
  expected_concepts:
  - assessing impact and timeline
  - monitoring signals
  - reducing coupling
  - contingency options
  - communicating to stakeholders
  rubric:
    excellent: >-
      Assesses impact and timeline, monitors signals, reduces coupling, develops contingency options and
      communicates.
    good: Assesses the risk and plans a response.
    weak: Ignores the signals until failure.
  followups:
  - What signal worried you most?
  - What contingency did you prepare?
  common_errors:
  - Ignores the signals until failure.

- external_key: leadership.technical_direction.long_term_cost_of_decisions
  competency_key: leadership
  topic: Counting the long-term cost of choices
  difficulty: hard
  text: >-
    How do you make the long-term cost of a technical choice visible when the short-term benefits are
    what everyone is looking at?
  expected_concepts:
  - lifetime cost including operation and maintenance
  - scenarios
  - comparing with alternatives
  - recording assumptions
  - revisiting after launch
  rubric:
    excellent: >-
      Estimates lifetime cost, builds scenarios, compares alternatives, records assumptions and revisits
      after launch.
    good: Considers maintenance costs in reviews.
    weak: Considers only the build cost.
  followups:
  - What cost surprised you?
  - How do you record the assumptions?
  common_errors:
  - Considers only the build cost.

- external_key: leadership.technical_direction.standards_for_new_services
  competency_key: leadership
  topic: Defining what a new service must have
  difficulty: medium
  text: >-
    What would you require of any new service before it goes into production, and how would you keep this
    from becoming a bureaucratic checklist?
  expected_concepts:
  - ownership and on-call
  - monitoring and alerts
  - security basics
  - runbook
  - automation of the checks
  rubric:
    excellent: >-
      Requires ownership, monitoring, security basics and a runbook, automates checks and reviews the
      list regularly.
    good: Defines a checklist with the main items.
    weak: Writes a long manual checklist.
  followups:
  - What would you remove from the list?
  - How do you automate the checks?
  common_errors:
  - Writes a long manual checklist.

- external_key: leadership.technical_direction.second_system_risk
  competency_key: leadership
  topic: Avoiding an over-ambitious replacement
  difficulty: hard
  text: >-
    A team proposes a replacement system that fixes every flaw of the current one. How do you shape the
    proposal so it delivers?
  expected_concepts:
  - limiting the first version to the core needs
  - keeping the old system running
  - migrating in slices
  - evidence at each step
  - stopping criteria
  rubric:
    excellent: >-
      Limits the first version to core needs, keeps the old system running, migrates in slices, requires
      evidence at each step and sets stop criteria.
    good: Narrows the scope and phases delivery.
    weak: Approves the broad replacement.
  followups:
  - What did you cut from the first version?
  - How did you set stop criteria?
  common_errors:
  - Approves the broad replacement.
