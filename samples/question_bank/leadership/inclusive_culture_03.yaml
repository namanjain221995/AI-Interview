# Curated questions: leadership round, inclusive culture (part 3 of 4).
# Focus: building an inclusive, respectful team culture through fair, job-related processes and working practices. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.inclusive_culture.naming_norms_early
  competency_key: culture_values
  topic: Setting team working agreements
  difficulty: easy
  text: >-
    Have you set working agreements with a team about how you communicate and treat each other? What went into them?
  expected_concepts:
  - created together with the team
  - specific behaviours rather than slogans
  - response time expectations
  - meeting etiquette
  - review and update over time
  rubric:
    excellent: >-
      Describes an agreement built jointly with specific behaviours, applied in practice, and revisited.
    good: Has a working agreement with some specifics.
    weak: Describes a generic list of values on a wall.
  followups:
  - How did you handle a breach?
  - What changed when you revisited it?
  common_errors:
  - 'Answering in the weak pattern: describes a generic list of values on a wall'

- external_key: leadership.inclusive_culture.accessible_documentation
  competency_key: communication
  topic: Making documents usable by everyone
  difficulty: easy
  text: >-
    What do you do to make team documents and tools easy for everyone to use, regardless of how they work or read best?
  expected_concepts:
  - clear structure and plain language
  - alternatives to long meetings
  - text equivalents for diagrams and recordings
  - searchable storage
  - asking colleagues what works
  rubric:
    excellent: >-
      Names several practical steps, such as plain language and text alternatives, and shows that colleagues benefited.
    good: Takes a few sensible steps.
    weak: Has not considered different ways people use documents.
  followups:
  - What feedback have you received?
  - Which change helped most?
  common_errors:
  - >-
    Answering in the weak pattern: has not considered different ways people use documents

- external_key: leadership.inclusive_culture.feedback_equality
  competency_key: people_management
  topic: Consistent feedback standards
  difficulty: easy
  text: >-
    How do you make sure you give people feedback of equal quality and candour, rather than going easier on some and harder
    on others?
  expected_concepts:
  - written criteria
  - reviewing own feedback for patterns
  - specific examples for each person
  - regular feedback to all
  - asking for input on your feedback
  rubric:
    excellent: >-
      Uses criteria and examples, reviews their own feedback patterns, and has corrected a pattern they found.
    good: Aims to be consistent and gives examples.
    weak: Gives feedback according to comfort with each person.
  followups:
  - What pattern did you notice?
  - How do you check?
  common_errors:
  - >-
    Answering in the weak pattern: gives feedback according to comfort with each person

- external_key: leadership.inclusive_culture.listening_to_juniors
  competency_key: collaboration
  topic: Hearing from less experienced people
  difficulty: easy
  text: >-
    How do you make sure the ideas of the most junior people on your team get a proper hearing?
  expected_concepts:
  - asking for their input first
  - protecting their ideas from being talked over
  - crediting their ideas
  - offering coaching after
  - acting on good ideas
  rubric:
    excellent: >-
      Describes asking juniors first, crediting and acting on ideas, and shows one idea that was adopted.
    good: Encourages juniors to speak.
    weak: Defers to senior opinions by default.
  followups:
  - What was a good idea that came from a junior?
  - How did you protect it?
  common_errors:
  - 'Answering in the weak pattern: defers to senior opinions by default'

- external_key: leadership.inclusive_culture.fair_on_call
  competency_key: leadership
  topic: Sharing on-call duties fairly
  difficulty: easy
  text: >-
    How do you design the on-call rota so the load is shared fairly and doesn't fall disproportionately on particular people?
  expected_concepts:
  - transparent rota and swaps
  - accounting for existing obligations
  - compensating out-of-hours work
  - tracking actual load
  - preparing less experienced people
  rubric:
    excellent: >-
      Shares a fair rota with tracking, accommodations through swaps, compensation or time off, and has corrected an imbalance.
    good: Uses a rota with swaps.
    weak: Leaves it to volunteers.
  followups:
  - How did you discover an imbalance?
  - How do you handle a request to swap?
  common_errors:
  - 'Answering in the weak pattern: leaves it to volunteers'

- external_key: leadership.inclusive_culture.fair_use_of_chat_channels
  competency_key: communication
  topic: Keeping decisions in shared channels
  difficulty: medium
  text: >-
    Important discussions on your team sometimes happen in private chats. How do you stop people being left out?
  expected_concepts:
  - default to shared channels
  - summarising private discussions
  - decision records
  - modelling the behaviour
  - explaining why
  rubric:
    excellent: >-
      Sets the default, models it, summarises and records decisions, and explains the reason, with a visible change.
    good: Encourages open channels.
    weak: Accepts private chats as normal.
  followups:
  - What pushback did you get?
  - How do you handle sensitive topics?
  common_errors:
  - 'Answering in the weak pattern: accepts private chats as normal'

- external_key: leadership.inclusive_culture.early_career_hiring
  competency_key: people_management
  topic: Evaluating people with less experience fairly
  difficulty: medium
  text: >-
    How do you evaluate candidates for junior roles so that you assess potential and relevant skills and not just a polished
    background?
  expected_concepts:
  - skills-based exercises
  - asking about projects and learning
  - consistent questions
  - avoiding pedigree shortcuts
  - focusing on trajectory in the work
  rubric:
    excellent: >-
      Uses job-related exercises and consistent questions, assesses learning approach, and shows successful hires from varied
      paths.
    good: Uses practical tasks.
    weak: Prefers familiar backgrounds.
  followups:
  - What task did you use?
  - Which hire surprised you?
  common_errors:
  - 'Answering in the weak pattern: prefers familiar backgrounds'

- external_key: leadership.inclusive_culture.fair_take_home_design
  competency_key: people_management
  topic: Fairness of hiring exercises
  difficulty: medium
  text: >-
    How do you design a hiring exercise so it is fair to people with different amounts of free time and different tool familiarity?
  expected_concepts:
  - time limits
  - allowing common tools
  - clear instructions
  - alternative formats
  - scoring the same way for all
  - considering whether it is needed
  rubric:
    excellent: >-
      Sets time limits and clear scoring, offers alternatives, and checks whether the exercise predicted job performance.
    good: Limits time and gives clear instructions.
    weak: Uses an open-ended exercise with no limits.
  followups:
  - How do you handle candidates who go over?
  - How did you validate the exercise?
  common_errors:
  - 'Answering in the weak pattern: uses an open-ended exercise with no limits'

- external_key: leadership.inclusive_culture.accountability_for_norms
  competency_key: leadership
  topic: Applying norms to everyone
  difficulty: medium
  text: >-
    How do you ensure team norms apply equally to the most senior or most valued people?
  expected_concepts:
  - same expectations in writing
  - consistent response
  - leader following the norms
  - transparent handling
  - consequences matched to conduct
  rubric:
    excellent: >-
      Applies norms consistently, models them, and gives an example where a senior person was held to account.
    good: States norms apply to everyone.
    weak: Makes exceptions for valued people.
  followups:
  - What was the hardest case?
  - What did the team notice?
  common_errors:
  - 'Answering in the weak pattern: makes exceptions for valued people'

- external_key: leadership.inclusive_culture.inclusive_retrospectives
  competency_key: leadership
  topic: Retrospectives where everyone speaks
  difficulty: medium
  text: >-
    How do you run retrospectives so that real issues come out, including ones that people find uncomfortable to raise?
  expected_concepts:
  - anonymous or written input
  - varied formats
  - ground rules
  - follow-up actions with owners
  - reviewing completion
  rubric:
    excellent: >-
      Uses anonymous input and varied formats, produces actions with owners, and shows issues raised that would otherwise
      be silent.
    good: Gathers input from all.
    weak: Runs the same format that favours the vocal.
  followups:
  - What was raised anonymously?
  - What action came from it?
  common_errors:
  - 'Answering in the weak pattern: runs the same format that favours the vocal'

- external_key: leadership.inclusive_culture.fairness_in_remote_vs_office_visibility
  competency_key: people_management
  topic: Avoiding proximity bias
  difficulty: medium
  text: >-
    In a hybrid team, how do you avoid favouring people you see more often when handing out opportunities and evaluating performance?
  expected_concepts:
  - evidence of outcomes not presence
  - scheduled contact with remote staff
  - rotating opportunities
  - structured reviews
  - self-checks on assignments
  rubric:
    excellent: >-
      Uses outcome-based evidence, scheduled contact, self-checks on assignments, and shows equal outcomes.
    good: Aware of the bias and takes some steps.
    weak: Assumes visibility reflects contribution.
  followups:
  - What pattern did you find in your own assignments?
  - How did you correct?
  common_errors:
  - 'Answering in the weak pattern: assumes visibility reflects contribution'

- external_key: leadership.inclusive_culture.feedback_delivery_consistency
  competency_key: communication
  topic: Giving hard feedback in a fair way
  difficulty: medium
  text: >-
    Tell me how you prepare to give difficult feedback so that you treat everyone by the same standard.
  expected_concepts:
  - facts and examples first
  - reference to written expectations
  - the same structure for everyone
  - asking for their view
  - agreed next steps
  rubric:
    excellent: >-
      Prepares with facts and expectations, uses a consistent structure, asks for the person's view and agrees actions.
    good: Uses examples and a clear structure.
    weak: Adapts the standard to how comfortable they are with the person.
  followups:
  - How do you prepare?
  - What do you do when the person disagrees?
  common_errors:
  - >-
    Answering in the weak pattern: adapts the standard to how comfortable they are with the person

- external_key: leadership.inclusive_culture.recognising_unpaid_extra_work
  competency_key: people_management
  topic: Fair credit for extra effort
  difficulty: medium
  text: >-
    Some team members regularly take on extra tasks like mentoring or running events. How do you make sure that effort is
    recognised and not just expected?
  expected_concepts:
  - tracking extra work
  - explicit recognition
  - including it in evaluation
  - capping the load
  - sharing it around
  rubric:
    excellent: Tracks it, recognises it in evaluation, caps the load and shares it around.
    good: Thanks people and mentions it in reviews.
    weak: Treats it as free and expects it to continue.
  followups:
  - How do you stop it falling on the same people?
  - How did you measure it?
  common_errors:
  - 'Answering in the weak pattern: treats it as free and expects it to continue'

- external_key: leadership.inclusive_culture.handling_exclusive_in_groups
  competency_key: leadership
  topic: Informal cliques in the team
  difficulty: medium
  text: >-
    You notice informal groups forming in your team, with some people consistently in the loop and others not. How do you
    respond?
  expected_concepts:
  - observing which information flows where
  - making key information public
  - mixing pairs and groups
  - asking people about their experience
  - reviewing
  rubric:
    excellent: >-
      Observes flows, makes information public, mixes pairings, asks the team and checks the effect.
    good: Mixes the groups for tasks.
    weak: Ignores informal groups.
  followups:
  - What did you notice?
  - How did the groups react?
  common_errors:
  - 'Answering in the weak pattern: ignores informal groups'

- external_key: leadership.inclusive_culture.fair_vendor_interview_questions
  competency_key: people_management
  topic: Keeping interview questions job-related
  difficulty: medium
  text: >-
    A colleague on your interview panel asks a question that isn't related to the job. How do you handle that during and after
    the interview?
  expected_concepts:
  - stepping in neutrally if needed
  - redirecting to job-related topics
  - discussing afterwards
  - reminding the panel of the scorecard
  - discarding the evidence
  rubric:
    excellent: >-
      Redirects at the time, follows up with the colleague, reminds the panel of job-related criteria and excludes irrelevant
      material from the decision.
    good: Raises it afterwards and reminds them.
    weak: Lets it pass and uses the information.
  followups:
  - What would you say to the colleague?
  - How do you brief interviewers beforehand?
  common_errors:
  - 'Answering in the weak pattern: lets it pass and uses the information'

- external_key: leadership.inclusive_culture.welcoming_dissenting_expertise
  competency_key: collaboration
  topic: Valuing a perspective that differs from the majority
  difficulty: medium
  text: >-
    One engineer regularly offers a view that differs from the rest of the team. How do you make sure it gets considered fairly?
  expected_concepts:
  - listening for the substance
  - asking for evidence
  - checking whether the team dismisses it by habit
  - acting on valid points
  - thanking them
  rubric:
    excellent: >-
      Considers the substance, tests it with evidence, checks for habitual dismissal, acts on valid points and thanks them.
    good: Listens and asks for evidence.
    weak: Treats them as a nuisance.
  followups:
  - Were they right sometimes?
  - How did the team change?
  common_errors:
  - 'Answering in the weak pattern: treats them as a nuisance'

- external_key: leadership.inclusive_culture.clear_expectations_for_all_levels
  competency_key: people_management
  topic: Making expectations explicit
  difficulty: medium
  text: >-
    How do you make expectations for each level or role on your team explicit enough that everyone can understand what's expected?
  expected_concepts:
  - written level descriptions
  - examples of expected work
  - checking understanding
  - using them in feedback
  - updating them
  rubric:
    excellent: >-
      Writes level descriptions with examples, uses them in feedback and updates them, and shows people understood the path.
    good: Has written expectations.
    weak: Relies on unwritten expectations.
  followups:
  - How do you handle disagreement about a level?
  - What examples did you include?
  common_errors:
  - 'Answering in the weak pattern: relies on unwritten expectations'

- external_key: leadership.inclusive_culture.response_to_unsolicited_criticism_of_team_practices
  competency_key: leadership
  topic: Hearing criticism of your practices
  difficulty: medium
  text: >-
    A team member tells you that something you consider fair, like the way you assign on-call or reviews, doesn't feel fair
    to them. How do you respond?
  expected_concepts:
  - asking for specifics
  - looking at the data
  - being open to change
  - explaining the reasoning
  - following up
  rubric:
    excellent: >-
      Asks, checks the data, changes where warranted, explains where not and follows up.
    good: Listens and reviews.
    weak: Defends the existing practice.
  followups:
  - What did the data show?
  - What changed?
  common_errors:
  - 'Answering in the weak pattern: defends the existing practice'

- external_key: leadership.inclusive_culture.decision_with_conflicting_working_styles
  competency_key: collaboration
  topic: Working styles clash
  difficulty: hard
  text: >-
    Part of your team prefers fast verbal discussion and part prefers careful written analysis, and the two groups are frustrated.
    How do you design a process that works for both?
  expected_concepts:
  - naming both styles as valid
  - combining written proposal with a discussion
  - time for both
  - agreed decision points
  - reviewing
  rubric:
    excellent: >-
      Combines written proposals with discussion, agrees decision points, reviews, and shows less friction.
    good: Compromises on formats.
    weak: Imposes one style.
  followups:
  - What did each side give up?
  - What did you keep from both?
  common_errors:
  - 'Answering in the weak pattern: imposes one style'

- external_key: leadership.inclusive_culture.escalation_when_leadership_resists
  competency_key: leadership
  topic: Pushing for fair practices upward
  difficulty: hard
  text: >-
    You believe a company-wide process, such as how promotions are decided, is unfair, but your leadership resists change.
    What do you do?
  expected_concepts:
  - gathering evidence
  - proposing alternatives
  - building allies
  - escalating respectfully
  - improving what you control
  - knowing when to stop
  rubric:
    excellent: >-
      Builds an evidence-based case, finds allies, proposes workable alternatives, improves local practice and is clear on
      limits.
    good: Raises the issue with evidence.
    weak: Complains or gives up.
  followups:
  - What evidence did you use?
  - What did you do within your team in the meantime?
  common_errors:
  - 'Answering in the weak pattern: complains or gives up'

- external_key: leadership.inclusive_culture.responding_to_a_public_mistake_of_leader
  competency_key: leadership
  topic: A leader who makes a disrespectful mistake
  difficulty: hard
  text: >-
    You said something in a meeting that came across as dismissive to a colleague. How do you handle it afterwards?
  expected_concepts:
  - recognising it quickly
  - apologising specifically
  - asking what they need
  - changing behaviour
  - not over-centring yourself
  rubric:
    excellent: >-
      Acknowledges it promptly, apologises specifically, asks what would help, changes behaviour and does not make it about
      themselves.
    good: Apologises and moves on.
    weak: Defends or ignores.
  followups:
  - How did the colleague respond?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: defends or ignores'

- external_key: leadership.inclusive_culture.accommodating_working_patterns
  competency_key: people_management
  topic: Flexible working while staying fair to the team
  difficulty: hard
  text: >-
    Team members have different working patterns and availability. How do you balance flexibility with fairness and coverage?
  expected_concepts:
  - shared principles for coverage
  - transparent rules
  - outcome-based expectations
  - avoiding favouritism
  - revisiting regularly
  - consulting the team
  rubric:
    excellent: >-
      Sets shared principles and transparent rules, uses outcome-based expectations, and reviews with the team.
    good: Allows flexibility with coverage rules.
    weak: Decides case by case without consistency.
  followups:
  - How do you handle perceived unfairness?
  - What rules did you set?
  common_errors:
  - 'Answering in the weak pattern: decides case by case without consistency'

- external_key: leadership.inclusive_culture.fair_handling_of_underperformance_signals
  competency_key: people_management
  topic: Applying performance standards consistently
  difficulty: hard
  text: >-
    You realise you have been tolerant of one person's missed commitments and strict with another. What do you do?
  expected_concepts:
  - acknowledging inconsistency
  - reviewing facts against standards
  - resetting expectations for both
  - apologising where appropriate
  - guarding against repeat
  rubric:
    excellent: >-
      Acknowledges, reviews facts, resets expectations consistently, repairs trust and sets safeguards.
    good: Corrects and applies the same standard.
    weak: Continues unevenly.
  followups:
  - How did each person respond?
  - What safeguards did you put in place?
  common_errors:
  - 'Answering in the weak pattern: continues unevenly'

- external_key: leadership.inclusive_culture.widening_who_gets_hired_as_leads
  competency_key: people_management
  topic: Opening leadership paths
  difficulty: hard
  text: >-
    Leadership roles on your team have always gone to the same type of person in terms of work style and visibility. How do
    you open the path?
  expected_concepts:
  - criteria describing the role's real requirements
  - encouraging varied candidates to apply
  - leadership development opportunities
  - structured selection
  - tracking
  rubric:
    excellent: >-
      Defines real requirements, encourages applications, offers development, uses structured selection and tracks results.
    good: Opens applications to all.
    weak: Selects by familiarity.
  followups:
  - What did you change in the criteria?
  - How did you encourage people to apply?
  common_errors:
  - 'Answering in the weak pattern: selects by familiarity'

- external_key: leadership.inclusive_culture.conflict_between_inclusion_and_autonomy
  competency_key: leadership
  topic: Team autonomy versus shared norms
  difficulty: hard
  text: >-
    One sub-team has its own working style that works well for them but excludes people from other teams. How do you handle
    it?
  expected_concepts:
  - understanding the reasons
  - showing the cost to others
  - shared interface norms
  - preserving autonomy where it does not harm
  - agreement and review
  rubric:
    excellent: >-
      Understands, shows the cost, agrees minimal shared norms and preserves autonomy elsewhere.
    good: Negotiates some shared practices.
    weak: Forces uniformity or ignores it.
  followups:
  - What was the cost to others?
  - Which norms did you drop?
  common_errors:
  - 'Answering in the weak pattern: forces uniformity or ignores it'
