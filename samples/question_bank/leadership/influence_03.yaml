# Curated questions: leadership round, influence (part 3 of 4). Listening, timing, managing up, bad news, shared resources and influencing senior audiences. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.influence.understanding_before_persuading
  competency_key: communication
  topic: Understanding the other side first
  difficulty: easy
  text: >-
    Before you try to persuade someone, how do you find out what they care about and what they already
    think?
  expected_concepts:
  - asking open questions
  - listening for their goals and constraints
  - checking your understanding by restating
  - learning what they have tried
  - adjusting your approach
  rubric:
    excellent: >-
      Describes concrete questions and listening habits, shows how what they learned changed the approach
      and the result of the conversation.
    good: Describes asking questions and listening before making a case.
    weak: Prepares only their own argument.
  followups:
  - What question do you ask most?
  - Tell me about a time you were surprised by what someone cared about.
  common_errors:
  - Preparing only your own argument and ignoring the other person's goals.

- external_key: leadership.influence.disagree_in_writing
  competency_key: communication
  topic: Disagreeing constructively in writing
  difficulty: easy
  text: >-
    When you disagree with a proposal in a written thread, how do you write your comment so that it moves
    things forward?
  expected_concepts:
  - acknowledging the aim
  - being specific about the concern
  - giving reasons or evidence
  - suggesting an alternative
  - moving to a call if the thread grows
  rubric:
    excellent: >-
      Acknowledges the aim, states a specific concern with evidence, offers an alternative and moves to
      a conversation if the thread escalates.
    good: Writes a polite comment with reasons.
    weak: Writes a blunt rejection or avoids commenting.
  followups:
  - When do you stop writing and call?
  - Can you give me an example comment?
  common_errors:
  - Writes a blunt rejection or avoids commenting.

- external_key: leadership.influence.finding_common_ground
  competency_key: collaboration
  topic: Starting from shared goals
  difficulty: easy
  text: >-
    Tell me about a time you found common ground with someone who initially disagreed with you.
  expected_concepts:
  - identifying a shared goal
  - separating positions from interests
  - acknowledging valid points
  - proposing something that meets both needs
  rubric:
    excellent: >-
      Identifies the shared goal, separates positions from interests, acknowledges valid points and proposes
      a solution meeting both needs, with the result.
    good: Describes finding a compromise.
    weak: Describes winning the argument.
  followups:
  - What was their underlying interest?
  - What did you give up?
  common_errors:
  - Describes winning the argument.

- external_key: leadership.influence.timing_a_hard_ask
  competency_key: stakeholder_management
  topic: Choosing the right moment to ask
  difficulty: easy
  text: How do you decide when to raise a request or a concern with a senior person?
  expected_concepts:
  - understanding their workload and calendar
  - choosing a private setting for sensitive matters
  - preparing a short version
  - giving advance notice
  - not surprising them
  rubric:
    excellent: >-
      Considers their situation, chooses an appropriate setting, prepares a short version, gives notice
      and avoids surprising them, with an example.
    good: Chooses a reasonable time and setting.
    weak: Raises it whenever it occurs to them.
  followups:
  - When did timing change the response?
  - What do you do when there is no good time?
  common_errors:
  - Raises it whenever it occurs to them.

- external_key: leadership.influence.open_to_being_persuaded
  competency_key: adaptability
  topic: Changing your own mind
  difficulty: easy
  text: >-
    Tell me about a time someone persuaded you to change your position. What made the difference?
  expected_concepts:
  - listening to the argument
  - weighing new evidence
  - separating ego from the issue
  - saying so openly
  - acting on the change
  rubric:
    excellent: >-
      Gives a specific example, explains what evidence or argument worked, says how they acknowledged
      it and what they did differently.
    good: Gives an example with a general reason.
    weak: Cannot recall changing their mind.
  followups:
  - How did you tell them?
  - What kind of argument works on you?
  common_errors:
  - Cannot recall changing their mind.

- external_key: leadership.influence.architecture_board
  competency_key: leadership
  topic: Presenting to an architecture review group
  difficulty: medium
  text: >-
    You have to get your design approved by a review group of senior engineers who do not know your context.
    How do you prepare?
  expected_concepts:
  - pre-reading and context
  - known concerns addressed first
  - clear decisions needed
  - alternatives considered
  - follow-up on feedback
  rubric:
    excellent: >-
      Shares pre-reads, addresses likely concerns, states the decisions needed and alternatives considered,
      and follows up on feedback.
    good: Prepares a presentation and answers questions.
    weak: Presents detail without stating the decision needed.
  followups:
  - What question did you not expect?
  - How did you handle a no?
  common_errors:
  - Presents detail without stating the decision needed.

- external_key: leadership.influence.priority_for_tech_debt
  competency_key: stakeholder_management
  topic: Getting product to accept technical investment
  difficulty: medium
  text: >-
    You need product management to give time for technical improvements. How do you make the case so it
    competes fairly with features?
  expected_concepts:
  - expressing cost in delivery terms
  - evidence of slowdowns or incidents
  - sizing options
  - linking to product goals
  - negotiating a stable allocation
  rubric:
    excellent: >-
      Translates debt into delivery cost with evidence, sizes options, links to product goals and negotiates
      a stable allocation.
    good: Presents evidence and asks for time.
    weak: Argues that technical work matters in general.
  followups:
  - What evidence worked?
  - How did you handle a no?
  common_errors:
  - Argues that technical work matters in general.

- external_key: leadership.influence.managing_up_unrealistic_goal
  competency_key: stakeholder_management
  topic: Responding to an unrealistic goal from above
  difficulty: medium
  text: >-
    Your leader gives you a target that you believe can't be met with the current plan. How do you handle
    it?
  expected_concepts:
  - confirming the goal and constraints
  - showing the analysis
  - offering options such as scope or date changes
  - stating risks
  - agreeing on a path
  rubric:
    excellent: >-
      Confirms the goal, shares analysis, offers options on scope, date or resources, states risks and
      agrees on a path.
    good: Explains concerns and suggests changes.
    weak: Accepts silently or declares it impossible.
  followups:
  - What options did you offer?
  - How did they respond?
  common_errors:
  - Accepts silently or declares it impossible.

- external_key: leadership.influence.remote_influence
  competency_key: communication
  topic: Influencing when you are rarely in the room
  difficulty: medium
  text: >-
    Much of the decision-making in your organisation happens in meetings or informal chats you can't easily
    join. How do you make sure your input counts?
  expected_concepts:
  - written input before decisions
  - one-to-one conversations
  - sharing context asynchronously
  - having an ally in the room
  - following up on outcomes
  rubric:
    excellent: >-
      Writes inputs ahead, builds one-to-one relationships, shares context in writing, has allies in the
      room and follows up on outcomes.
    good: Uses written updates and some conversations.
    weak: Waits to be asked.
  followups:
  - How do you learn what was decided?
  - Who speaks for you in the room?
  common_errors:
  - Waits to be asked.

- external_key: leadership.influence.five_minute_pitch
  competency_key: communication
  topic: Making your case in five minutes
  difficulty: medium
  text: >-
    You have five minutes with a senior leader to get support for an initiative. What do you prepare and
    how do you use the time?
  expected_concepts:
  - leading with the ask
  - one clear reason it matters
  - one or two numbers
  - main risk and plan
  - next step
  rubric:
    excellent: >-
      Leads with the ask, gives the key reason and a few numbers, names the main risk and plan and ends
      with a concrete next step.
    good: Prepares a short summary and an ask.
    weak: Gives the history and detail before the ask.
  followups:
  - What do you leave out?
  - What if they interrupt?
  common_errors:
  - Gives the history and detail before the ask.

- external_key: leadership.influence.not_now_blocker
  competency_key: adaptability
  topic: Handling a "not now" answer
  difficulty: medium
  text: A leader responds "not now" to something you think is important. What do you do?
  expected_concepts:
  - asking what would change the answer
  - learning what has priority
  - reducing the ask
  - keeping the idea visible
  - revisiting at a good time
  rubric:
    excellent: >-
      Asks what would change the answer, learns their priorities, reduces the ask, keeps the idea visible
      and returns at a suitable time.
    good: Accepts the decision and plans to try again.
    weak: Drops the idea or keeps pushing unchanged.
  followups:
  - What changed their answer later?
  - How did you keep the idea visible?
  common_errors:
  - Drops the idea or keeps pushing unchanged.

- external_key: leadership.influence.persuading_team_new_tool
  competency_key: leadership
  topic: Persuading your team to try something new
  difficulty: medium
  text: >-
    You want your own team to try a new tool or practice and several people are doubtful. How do you proceed?
  expected_concepts:
  - finding out what doubts there are
  - choosing a small trial
  - defining what would count as success
  - letting doubters shape the trial
  - reviewing together
  rubric:
    excellent: >-
      Listens to doubts, proposes a small trial, defines success with the team, includes doubters in the
      design and reviews together.
    good: Explains benefits and offers a trial.
    weak: Tells the team to adopt it.
  followups:
  - What did the doubters add?
  - What if the trial failed?
  common_errors:
  - Tells the team to adopt it.

- external_key: leadership.influence.shared_resource_negotiation
  competency_key: stakeholder_management
  topic: Negotiating use of a shared resource
  difficulty: medium
  text: >-
    Your team and another team both need the same scarce resource, such as a shared environment or specialist,
    in the same period. How do you work it out?
  expected_concepts:
  - understanding each team's needs and deadlines
  - sharing information openly
  - proposing a schedule or split
  - agreeing on criteria for conflicts
  - escalating together if needed
  rubric:
    excellent: >-
      Understands both teams' needs, shares information, proposes schedules or splits, agrees criteria
      for conflicts and escalates jointly only if needed.
    good: Discusses and finds a compromise.
    weak: Claims the resource first or complains to managers.
  followups:
  - How did you agree on the criteria?
  - What if the other team had a bigger deadline?
  common_errors:
  - Claims the resource first or complains to managers.

- external_key: leadership.influence.bad_news_upward
  competency_key: communication
  topic: Delivering bad news to leadership
  difficulty: medium
  text: >-
    You have to tell senior leaders that a major project will miss its date. How do you do it?
  expected_concepts:
  - telling them early
  - leading with facts and impact
  - bringing options and a recommendation
  - owning your part
  - agreeing on next steps and updates
  rubric:
    excellent: >-
      Delivers early with facts, impact, options, a recommendation, ownership and a plan for updates.
    good: Reports the delay with some options.
    weak: Delays the news or blames others.
  followups:
  - When did you learn it?
  - How did leaders react?
  common_errors:
  - Waiting until the delay cannot be hidden.

- external_key: leadership.influence.buy_in_for_oncall_change
  competency_key: collaboration
  topic: Building buy-in for a change to team duties
  difficulty: medium
  text: >-
    You need the team to accept a change to on-call or support duties that some will not like. How do
    you build agreement?
  expected_concepts:
  - explaining the problem and data
  - inviting alternatives
  - testing for fairness
  - trial period
  - reviewing and adjusting
  rubric:
    excellent: >-
      Explains the problem with data, invites alternatives, tests fairness, runs a trial period and adjusts
      after review.
    good: Consults the team and trials a change.
    weak: Announces the change.
  followups:
  - What alternative did the team propose?
  - How did you measure fairness?
  common_errors:
  - Announces the change.

- external_key: leadership.influence.advocating_for_a_colleague
  competency_key: mentoring
  topic: Advocating for someone else's work
  difficulty: medium
  text: >-
    A colleague has done strong work that leadership hasn't noticed. How do you advocate for them?
  expected_concepts:
  - knowing their specific contributions
  - using evidence of impact
  - raising it with the right people
  - helping them present it
  - not taking over
  rubric:
    excellent: >-
      Collects specific evidence of impact, raises it with the right people, helps them present it themselves
      and doesn't take over.
    good: Mentions their work to leaders.
    weak: Does nothing or speaks for them in a way that overshadows them.
  followups:
  - Whom did you talk to?
  - How did you support them directly?
  common_errors:
  - Does nothing or speaks for them in a way that overshadows them.

- external_key: leadership.influence.prototype_to_persuade
  competency_key: problem_solving
  topic: Using a demo to move a decision
  difficulty: medium
  text: >-
    Describe a time you built a prototype or demo to persuade people of an idea. Why did it work better
    than a document?
  expected_concepts:
  - making the idea concrete
  - keeping it small
  - showing real data
  - inviting people to try
  - being clear about what it does not prove
  rubric:
    excellent: >-
      Makes the idea concrete and small, uses real data, invites trying it and is clear what it does not
      prove, with the result.
    good: Builds a demo that helped decide.
    weak: Builds a large prototype before testing interest.
  followups:
  - How long did it take?
  - What did people ask after seeing it?
  common_errors:
  - Builds a large prototype before testing interest.

- external_key: leadership.influence.conflicting_senior_leaders_crisis
  competency_key: leadership
  topic: Aligning conflicting leaders under pressure
  difficulty: hard
  text: >-
    During a crisis, two senior leaders give your team conflicting instructions. How do you handle that?
  expected_concepts:
  - protecting the team from conflicting direction
  - bringing the leaders together quickly
  - presenting the conflict neutrally with facts
  - asking for one decision
  - documenting the decision
  rubric:
    excellent: >-
      Shields the team, brings the leaders together quickly, presents the conflict with facts, gets one
      decision and documents it.
    good: Escalates for clarity and informs the team.
    weak: Follows the louder instruction or hides the conflict.
  followups:
  - Who made the final call?
  - How did you keep the team steady?
  common_errors:
  - Follows the louder instruction or hides the conflict.

- external_key: leadership.influence.investor_or_board_expectations
  competency_key: stakeholder_management
  topic: Managing expectations of very senior audiences
  difficulty: hard
  text: >-
    A board or investor group expects results faster than your plan can deliver. How do you influence
    their expectations?
  expected_concepts:
  - understanding what drives their expectations
  - sharing leading indicators
  - presenting the trade-offs
  - offering a credible alternative
  - communicating regularly
  rubric:
    excellent: >-
      Understands the drivers, shares leading indicators, explains trade-offs, offers a credible alternative
      and updates regularly.
    good: Explains constraints and offers a plan.
    weak: Overpromises or refuses to engage.
  followups:
  - What indicators did you use?
  - How did you rebuild trust after a miss?
  common_errors:
  - Overpromises or refuses to engage.

- external_key: leadership.influence.shifting_group_norms
  competency_key: leadership
  topic: Changing norms in a large group
  difficulty: hard
  text: >-
    A large group has a norm you believe holds it back, such as long meetings or avoiding disagreement.
    How do you change it?
  expected_concepts:
  - modelling the new behaviour
  - naming the norm and its cost
  - recruiting respected people
  - small visible experiments
  - recognising progress
  rubric:
    excellent: >-
      Models the behaviour, names the norm and its cost, recruits respected people, runs experiments and
      recognises progress.
    good: Raises the issue and encourages different behaviour.
    weak: Issues rules or complains.
  followups:
  - Who helped you first?
  - How did you know it had shifted?
  common_errors:
  - Issues rules or complains.

- external_key: leadership.influence.hostile_stakeholder
  competency_key: stakeholder_management
  topic: Working with a stakeholder who opposes you
  difficulty: hard
  text: >-
    A stakeholder consistently opposes your team's work in public. How do you deal with it?
  expected_concepts:
  - understanding the underlying concern
  - meeting privately
  - acknowledging valid points
  - finding a shared benefit
  - keeping records and boundaries
  rubric:
    excellent: >-
      Seeks the underlying concern, meets privately, acknowledges valid points, finds shared benefit and
      keeps professional boundaries and records.
    good: Talks to them and addresses their concerns.
    weak: Avoids them or responds in kind.
  followups:
  - What was behind their opposition?
  - What did you do publicly?
  common_errors:
  - Avoids them or responds in kind.

- external_key: leadership.influence.political_pressure_integrity
  competency_key: ownership
  topic: Pressure to support a decision you think is wrong
  difficulty: hard
  text: >-
    You are pressed to publicly support a decision you think is wrong for the product or customers. How
    do you handle it?
  expected_concepts:
  - raising concerns through the right channel
  - presenting evidence
  - understanding whether it is a policy, safety or legal issue
  - distinguishing disagreement from violation
  - deciding what you can support
  rubric:
    excellent: >-
      Raises concerns with evidence through the right channel, distinguishes disagreement from harm or
      violation, decides what to support and documents.
    good: Voices concerns and then supports the decision.
    weak: Complies without raising concerns or refuses without trying.
  followups:
  - Where is your line?
  - What happened after?
  common_errors:
  - Complies without raising concerns or refuses without trying.

- external_key: leadership.influence.influence_without_ownership
  competency_key: leadership
  topic: Influencing a decision you do not own
  difficulty: hard
  text: >-
    A decision that matters to you will be made by someone else with different priorities. How do you
    influence the outcome without overstepping?
  expected_concepts:
  - understanding the decision process
  - providing relevant evidence
  - finding their sponsors
  - making recommendations easy to adopt
  - accepting the outcome
  rubric:
    excellent: >-
      Understands the process, provides evidence, finds their trusted advisers, makes a recommendation
      easy to adopt and accepts the outcome.
    good: Shares evidence with the decision maker.
    weak: Lobbies publicly or works around the decision maker.
  followups:
  - Whom did they trust?
  - How did you handle the result?
  common_errors:
  - Lobbies publicly or works around the decision maker.

- external_key: leadership.influence.turning_down_a_request_gracefully
  competency_key: stakeholder_management
  topic: Saying no without losing the relationship
  difficulty: medium
  text: >-
    Another team asks for something your team cannot take on right now. How do you say no in a way that
    keeps the relationship strong?
  expected_concepts:
  - understanding the need behind the request
  - explaining the constraint with facts
  - offering an alternative or later date
  - pointing to other resources
  - staying open to revisiting
  rubric:
    excellent: >-
      Understands the need, explains the constraint with facts, offers an alternative or later date, points
      to other help and leaves the door open.
    good: Declines politely with a reason.
    weak: Declines bluntly or says yes and fails to deliver.
  followups:
  - What alternative did you offer?
  - Did they come back later?
  common_errors:
  - Agreeing to avoid conflict and then failing to deliver.

- external_key: leadership.influence.influence_through_a_decision_forum
  competency_key: leadership
  topic: Setting up a forum where hard decisions get made
  difficulty: hard
  text: >-
    Decisions that span several teams keep stalling because nobody has a place to make them. How would
    you set up a forum that works, and get people to use it?
  expected_concepts:
  - clear scope and decision rights
  - a prepared agenda with proposals
  - the right attendees
  - a record of decisions
  - review of whether the forum is useful
  rubric:
    excellent: >-
      Defines scope and decision rights, requires prepared proposals, invites the right people, records
      decisions and reviews its usefulness, with evidence it unstuck decisions.
    good: Sets up a regular meeting with some structure.
    weak: Creates a meeting with no decision rights.
  followups:
  - Who has the final say?
  - How did you stop it becoming a status meeting?
  common_errors:
  - Creates a meeting with no decision rights.
