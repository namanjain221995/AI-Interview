# Curated questions: leadership round, influence without authority (part 1 of 4).
# Building consensus, persuading peers and senior stakeholders, and bringing people along on
# change. Questions ask for real past examples or concrete approaches; evaluation is based only on
# the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager, product_manager]
  round_types: [leadership]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: leadership.influence.first_peer_influence
    competency_key: leadership
    topic: Getting peers to act when you had no say over them
    difficulty: easy
    text: >-
      Think back to one of the first times you needed a group of peers to do something differently and you had no
      authority over any of them. What was the situation, and what did you actually do to get them moving?
    expected_concepts:
      - what needed to change and why it mattered
      - how they approached peers individually before asking the group
      - reasons offered that mattered to the peers rather than to themselves
      - concrete result and how many people actually changed
      - what they learned about influencing peers
    rubric:
      excellent: Gives a specific situation, explains how they tailored the ask to what each peer cared about, describes concrete steps and a clear outcome, and reflects on what they would repeat.
      good: Clear example with sensible persuasion steps and a positive result, but limited reflection on why it worked.
      weak: Vague or hypothetical, or the change happened only because a manager stepped in.
    followups:
      - Who was the hardest person to bring along, and why?
      - What would you do differently if you faced the same situation today?
    common_errors:
      - Describing a time they were given authority rather than one where they lacked it.

  - external_key: leadership.influence.learning_other_team_priorities
    competency_key: stakeholder_management
    topic: Understanding another team's priorities before asking
    difficulty: easy
    text: >-
      Before you ask another team to take on something for you, how do you find out what that team is measured on and
      what they're worried about? Walk me through a recent time you did that.
    expected_concepts:
      - reading their roadmap, goals or planning documents
      - talking to their lead or engineers directly before the ask
      - identifying pressures and constraints they face
      - shaping the request so it fits or helps their goals
      - effect this preparation had on the outcome
    rubric:
      excellent: Describes deliberate preparation such as reviewing goals and talking to the team, explains how the findings changed the request, and links it to a better outcome.
      good: Shows awareness of the other team's priorities and adjusts the ask somewhat.
      weak: Makes the request first and learns about the other team only after being refused.
    followups:
      - What did you learn that surprised you?
      - How did you change your request as a result?
    common_errors:
      - Assuming the other team shares their priorities.

  - external_key: leadership.influence.small_team_practice_change
    competency_key: leadership
    topic: Introducing a small practice change in your team
    difficulty: easy
    text: >-
      Tell me about a small change to how your team works, maybe in code review, planning or documentation, that you
      suggested and got people to adopt. How did you get from idea to the team actually doing it?
    expected_concepts:
      - the problem the change addressed
      - involving teammates in shaping the change
      - trying it for a limited period
      - checking whether it helped
      - adjusting or keeping it based on results
    rubric:
      excellent: Explains the problem with evidence, involves the team in shaping the change, runs a trial and uses results to decide whether to keep it.
      good: Describes a reasonable change that was adopted, with some involvement from the team.
      weak: Simply announced the change, or cannot say whether it was adopted or helped.
    followups:
      - How did you know the change was working?
      - Did anyone push back, and how did you respond?
    common_errors:
      - Confusing agreement in a meeting with actual adoption.

  - external_key: leadership.influence.credibility_before_proposing
    competency_key: leadership
    topic: Earning standing before proposing change in a new team
    difficulty: easy
    text: >-
      When you join a team and you can already see things you'd like to change, how do you build enough credibility
      before you start proposing them? Give me an example of how that played out.
    expected_concepts:
      - learning why things are the way they are
      - delivering useful work early
      - asking questions before making proposals
      - choosing a first change with clear value
      - timing and framing of the first proposal
    rubric:
      excellent: Describes learning the history behind current practices, earning credibility through delivery, and choosing a well-timed first change that succeeded, with a specific example.
      good: Shows sensible patience and some credibility building before proposing changes.
      weak: Proposes sweeping changes immediately or describes no strategy for earning standing.
    followups:
      - What did you learn that made you drop one of your original ideas?
      - How long did you wait before your first proposal, and why?
    common_errors:
      - Treating every existing practice as a mistake without understanding its origin.

  - external_key: leadership.influence.short_written_proposal
    competency_key: communication
    topic: Writing a short proposal that gets a decision
    difficulty: easy
    text: >-
      When you need a decision from people who are busy and don't know the details, how do you structure a short
      written proposal so they can actually decide? Tell me about one you wrote.
    expected_concepts:
      - the decision needed stated up front
      - context limited to what the reader needs
      - options considered with trade-offs
      - a clear recommendation and its reasoning
      - deadline and what happens if no decision is made
    rubric:
      excellent: Describes a proposal that leads with the decision needed, compares options with trade-offs, makes a clear recommendation and explains what happened as a result.
      good: Describes a structured proposal with a recommendation, though trade-offs or outcome are thin.
      weak: Describes a long document without a clear ask, or no real example.
    followups:
      - What did you leave out, and why?
      - What questions came back that you hadn't anticipated?
    common_errors:
      - Burying the request under background detail.

  # ---------------------------------------------------------------- medium
  - external_key: leadership.influence.engineers_split_on_design
    competency_key: leadership
    topic: Building consensus between engineers split on a design
    difficulty: medium
    text: >-
      Tell me about a time the engineers you worked with were split between two technical approaches and the debate
      wasn't converging. What did you do to get the group to a decision people could stand behind?
    expected_concepts:
      - making each option's assumptions explicit
      - agreeing decision criteria before debating options
      - gathering evidence such as spikes or benchmarks
      - who made the final call and how it was explained
      - keeping those who lost the argument engaged
    rubric:
      excellent: Describes how they moved the debate from opinions to agreed criteria and evidence, was clear about who decided, and kept the people who disagreed committed to the outcome.
      good: Reaches a decision through a reasonable process with some evidence, but less attention to people who disagreed.
      weak: Picks a side and imposes it, or lets the debate drift without a decision.
    followups:
      - How did the people whose approach wasn't chosen react afterwards?
      - Looking back, was it the right choice?
    common_errors:
      - Equating consensus with everyone agreeing rather than everyone committing.

  - external_key: leadership.influence.funding_reliability_investment
    competency_key: stakeholder_management
    topic: Persuading leadership to fund reliability work
    difficulty: medium
    text: >-
      Tell me about a time you persuaded senior leadership to invest in reliability or infrastructure work that wouldn't
      ship any visible features. How did you build the case, and what did they agree to?
    expected_concepts:
      - quantifying the cost of the current state, such as incidents or lost revenue
      - connecting the work to goals leadership already cared about
      - a scoped proposal with milestones
      - how progress would be measured and reported
      - what was agreed and what was not
    rubric:
      excellent: Builds a case in business terms using real data, offers a scoped plan with measurable milestones, and describes what was funded and how results were reported back.
      good: Makes a reasonable business case and secures some investment, with limited measurement.
      weak: Argues purely on technical merit or describes no real outcome.
    followups:
      - What was the strongest objection, and how did you answer it?
      - How did you show leadership the investment paid off?
    common_errors:
      - Asking for open-ended time without a defined outcome.

  - external_key: leadership.influence.respected_senior_skeptic
    competency_key: leadership
    topic: Winning over a respected senior skeptic
    difficulty: medium
    text: >-
      Tell me about a proposal of yours that a highly respected senior engineer or leader opposed, where others were
      likely to follow their lead. How did you handle their objections?
    expected_concepts:
      - meeting them one to one before the group discussion
      - understanding the substance of their concern
      - changing the proposal where their concern was valid
      - giving them a visible role in shaping the outcome
      - where they ended up and why
    rubric:
      excellent: Engages the skeptic directly, separates valid concerns from preference, adapts the proposal in response, and explains how that changed their stance and the wider group's.
      good: Engages the skeptic respectfully and reaches a workable outcome.
      weak: Works around the skeptic, or treats their opposition as a personal obstacle.
    followups:
      - Which of their concerns turned out to be right?
      - What would you have done if they had never come round?
    common_errors:
      - Trying to outvote the skeptic instead of addressing the concern.

  - external_key: leadership.influence.data_to_end_circular_debate
    competency_key: communication
    topic: Using evidence to end a circular debate
    difficulty: medium
    text: >-
      Tell me about a debate at work that kept going around in circles on opinion until you brought in data or ran an
      experiment. How did you pick what to measure, and how did people respond to the results?
    expected_concepts:
      - identifying the question the data needed to answer
      - agreeing in advance what result would change minds
      - designing a quick, credible measurement
      - presenting results including limitations
      - decision reached and how it held up
    rubric:
      excellent: Agrees in advance what evidence would settle the question, gathers it credibly, presents results with their limits, and shows how that produced a durable decision.
      good: Uses relevant data to move the debate forward, with a clear decision.
      weak: Uses data selectively to win an argument, or the data didn't actually change anything.
    followups:
      - What would you have done if the data had gone against your view?
      - Did anyone challenge the data, and how did you respond?
    common_errors:
      - Collecting data only after taking a position.

  - external_key: leadership.influence.voluntary_platform_adoption
    competency_key: leadership
    topic: Driving adoption of an optional internal platform
    difficulty: medium
    text: >-
      Tell me about a tool, library or platform your team built that other teams were free to ignore. What did you do to
      get them to choose to adopt it?
    expected_concepts:
      - understanding what potential adopters needed
      - finding early adopters and making them successful
      - lowering the cost of migration
      - collecting and sharing results from early adopters
      - adoption numbers and what held back the rest
    rubric:
      excellent: Treats other teams as customers, makes early adopters successful, reduces migration effort and uses their results to drive further adoption, with concrete numbers.
      good: Describes reasonable adoption efforts with some success.
      weak: Expects adoption because the tool is technically better, or relies on a mandate.
    followups:
      - Which team refused, and what did you learn from them?
      - What did you change in the platform because of adopter feedback?
    common_errors:
      - Measuring launch rather than adoption and actual usage.

  - external_key: leadership.influence.finding_executive_sponsor
    competency_key: stakeholder_management
    topic: Finding an executive sponsor for an initiative
    difficulty: medium
    text: >-
      Tell me about an initiative that needed a senior sponsor to succeed. How did you decide who to approach, how did you
      pitch it to them, and what did you ask them to actually do?
    expected_concepts:
      - why the initiative needed sponsorship
      - choosing a sponsor whose goals aligned
      - framing the pitch around the sponsor's priorities
      - specific asks such as air cover, funding or removing blockers
      - keeping the sponsor informed and engaged over time
    rubric:
      excellent: Chooses a sponsor deliberately based on aligned goals, frames the pitch in their terms, makes specific asks and keeps them engaged, with a clear effect on the initiative.
      good: Secures a sponsor with a sensible pitch, though the asks or follow-up are less specific.
      weak: Vague about why a sponsor was needed or what the sponsor did.
    followups:
      - What did the sponsor do that you couldn't have done yourself?
      - How often did you update them, and in what form?
    common_errors:
      - Asking for general support without a concrete request.

  - external_key: leadership.influence.could_not_persuade
    competency_key: ownership
    topic: Making it work after failing to persuade
    difficulty: medium
    text: >-
      Tell me about a time you tried hard to persuade people of something important and didn't succeed. What did you do
      once the decision went the other way?
    expected_concepts:
      - what they argued for and why
      - why the persuasion failed in their own analysis
      - committing to the decision that was made
      - mitigating the risks they had raised
      - what they would change in their approach
    rubric:
      excellent: Analyses candidly why their case didn't land, commits fully to the chosen direction while mitigating the risks they foresaw, and draws a specific lesson about influencing.
      good: Accepts the decision and works within it, with some reflection.
      weak: Continues to resist the decision, or blames others for not listening.
    followups:
      - With hindsight, were they right or were you?
      - What would you do differently in the way you made the case?
    common_errors:
      - Describing quiet non-compliance as commitment.

  - external_key: leadership.influence.engineer_shaping_product_roadmap
    competency_key: stakeholder_management
    topic: Getting engineering input onto the product roadmap
    difficulty: medium
    text: >-
      Tell me about a time you got something onto a product roadmap that the product side hadn't originally planned,
      such as a technical capability or a different user problem. How did you make the case?
    expected_concepts:
      - the opportunity or risk they saw
      - framing it in terms of user or business outcomes
      - working with the product owner rather than around them
      - evidence such as usage data or customer feedback
      - what was added and what was traded off
    rubric:
      excellent: Frames the proposal in user and business outcomes, brings evidence, works through the product owner and explains the resulting trade-off and impact.
      good: Makes a reasonable case and gets the item prioritised.
      weak: Argues only on technical interest, or gets it in by bypassing the product owner.
    followups:
      - What dropped off the roadmap to make room?
      - How did it perform once delivered?
    common_errors:
      - Not acknowledging what had to give to make room.

  - external_key: leadership.influence.sales_commitment_pushback
    competency_key: stakeholder_management
    topic: Influencing a sales team that over-promised
    difficulty: medium
    text: >-
      Tell me about a time a sales or account team promised a customer something your team couldn't deliver as promised.
      How did you work with them to reset expectations without damaging the deal or the relationship?
    expected_concepts:
      - understanding what the customer actually needed
      - offering realistic alternatives or phasing
      - agreeing a joint message to the customer
      - avoiding blame in front of the customer
      - changing the process so it happened less often
    rubric:
      excellent: Gets to the customer's underlying need, builds a realistic alternative with the sales team, presents a united message and fixes the process that allowed the over-promise.
      good: Resolves the situation constructively with a reasonable alternative.
      weak: Simply refuses, or blames the sales team without offering options.
    followups:
      - How did the customer react?
      - What changed in how sales checks commitments with engineering?
    common_errors:
      - Fixing the single case but not the pattern.

  - external_key: leadership.influence.coaching_someone_to_pitch
    competency_key: mentoring
    topic: Coaching someone to make their own case upward
    difficulty: medium
    text: >-
      Tell me about someone on your team who had a good idea that needed leadership approval, where you coached them to
      make the case themselves instead of presenting it for them. What did that coaching look like?
    expected_concepts:
      - deciding to let them present rather than doing it themselves
      - helping them understand the audience and its priorities
      - rehearsing objections and answers
      - their role during the meeting itself
      - outcome for the idea and for the person's growth
    rubric:
      excellent: Describes deliberate coaching on audience, framing and objections, a clear choice to step back during the meeting, and outcomes for both the idea and the person.
      good: Supports the person with useful preparation and gives them visibility.
      weak: Took over the pitch, or offered only general encouragement.
    followups:
      - What did they do in the meeting that you would have done differently?
      - How did they approach the next pitch on their own?
    common_errors:
      - Rescuing the person mid-meeting instead of letting them handle questions.

  - external_key: leadership.influence.decision_meeting_no_owner
    competency_key: leadership
    topic: Getting to a decision when no one in the room owns it
    difficulty: medium
    text: >-
      Tell me about a meeting with several teams where a decision was needed but nobody in the room clearly owned it. What
      did you do to make sure it ended with an actual decision?
    expected_concepts:
      - naming the decision and its deadline explicitly
      - proposing a decision owner or process
      - summarising options and points of agreement
      - recording and sharing the outcome
      - follow-up to make sure it stuck
    rubric:
      excellent: Makes the decision and its owner explicit, structures the options, drives to a recorded outcome and follows up so the decision holds.
      good: Steers the meeting to a decision with reasonable structure.
      weak: Lets the meeting end without a decision, or decides unilaterally without others' agreement.
    followups:
      - How did people react to you taking that role?
      - What happens in your teams now to avoid this situation?
    common_errors:
      - Ending with action items but no decision.

  - external_key: leadership.influence.reframing_after_rejection
    competency_key: communication
    topic: Reframing an argument that didn't land
    difficulty: medium
    text: >-
      Tell me about a time your first attempt to persuade someone fell flat, and you went back with a completely
      different framing. What did you change, and why did the second version work better?
    expected_concepts:
      - why the first framing failed
      - what they learned about the audience's priorities
      - how the new framing connected to those priorities
      - substance kept the same versus presentation changed
      - outcome of the second attempt
    rubric:
      excellent: Diagnoses precisely why the first framing failed, rebuilds the argument around the audience's real priorities without changing the facts, and shows the result.
      good: Describes a sensible reframing that improved the outcome.
      weak: Simply repeated the same argument more forcefully, or cannot explain why the second try differed.
    followups:
      - How did you find out what the audience really cared about?
      - Did any part of the original idea change, or only the framing?
    common_errors:
      - Changing the facts to suit the audience rather than the framing.

  - external_key: leadership.influence.skip_level_without_undermining
    competency_key: leadership
    topic: Taking an idea above your manager without undermining them
    difficulty: medium
    text: >-
      Tell me about a time you needed to take an idea or concern to someone above your own manager. How did you handle it
      so your manager stayed informed and didn't feel bypassed?
    expected_concepts:
      - why it needed to go higher
      - discussing it with their manager first
      - agreeing how and by whom it would be raised
      - how the conversation was framed upward
      - effect on the relationship with their manager
    rubric:
      excellent: Raises it with their manager first, agrees the route together, frames it constructively upward and describes the outcome and the relationship afterwards.
      good: Keeps their manager informed and handles the escalation reasonably.
      weak: Goes around the manager without telling them, or avoids raising it at all.
    followups:
      - What would you have done if your manager had asked you not to raise it?
      - How did the senior leader respond?
    common_errors:
      - Informing the manager only after the fact.

  # ------------------------------------------------------------------ hard
  - external_key: leadership.influence.org_architecture_direction
    competency_key: leadership
    topic: Shifting architecture direction across many teams
    difficulty: hard
    text: >-
      Tell me about a time you changed the architectural direction for multiple teams in your organisation without having
      the authority to mandate it. How did you go from your own conviction to teams actually building that way?
    expected_concepts:
      - the problem with the current direction, backed by evidence
      - early allies and a reference implementation
      - a written proposal open to challenge
      - incremental path and migration support for teams
      - adoption over time and how it was tracked
    rubric:
      excellent: Builds an evidence-based case, recruits allies, proves the approach with a reference implementation, offers an incremental path and shows sustained adoption across teams.
      good: Drives meaningful adoption across some teams with a credible process.
      weak: Relies on a leadership mandate, or describes a proposal that never reached implementation.
    followups:
      - Which team was last to move, and why?
      - What part of your original proposal changed after others challenged it?
    common_errors:
      - Counting agreement on paper as a change in direction.

  - external_key: leadership.influence.executive_already_announced
    competency_key: stakeholder_management
    topic: Challenging a decision an executive already announced
    difficulty: hard
    text: >-
      Tell me about a time an executive had already announced a decision that you believed was wrong. How did you decide
      whether to challenge it, and how did you go about it?
    expected_concepts:
      - assessing the cost of the decision versus the cost of reversing it
      - gathering evidence and testing their own view
      - choosing a private, respectful channel
      - offering a face-saving path such as adjusting rather than reversing
      - outcome and their conduct after it
    rubric:
      excellent: Weighs whether the challenge is worth making, tests their own view, raises it privately with evidence and an alternative that lets the executive adjust, and acts constructively whatever the result.
      good: Raises the concern through an appropriate channel with reasonable evidence.
      weak: Challenges publicly in a way that entrenches the decision, or never raises it.
    followups:
      - What made you think it was worth the political cost?
      - If the decision had stood, what would you have done?
    common_errors:
      - Framing the challenge as the executive being wrong rather than as new information.

  - external_key: leadership.influence.converging_competing_solutions
    competency_key: leadership
    topic: Converging two teams building competing solutions
    difficulty: hard
    text: >-
      Tell me about a time two teams were each building their own solution to the same problem and both were invested in
      theirs. How did you get them to converge, and what happened to the solution that lost?
    expected_concepts:
      - discovering the duplication and its cost
      - neutral criteria for choosing or combining
      - involving both teams' leads in the decision
      - recognition for the work that was retired
      - migration plan and outcome
    rubric:
      excellent: Makes the duplication cost visible, uses neutral criteria that both teams accept, gives credit for retired work and delivers a migration to one solution.
      good: Achieves convergence with a fair process, though less attention to the team that lost.
      weak: Lets both continue, or picks a winner by authority without addressing the losing team.
    followups:
      - How did the team whose solution was retired feel about it, and what did you do about that?
      - Did you take any ideas from the losing solution?
    common_errors:
      - Choosing based on which team was louder.

  - external_key: leadership.influence.senior_voices_during_incident
    competency_key: leadership
    topic: Aligning senior people during a major incident
    difficulty: hard
    text: >-
      During a serious incident, several senior people may be pulling in different directions on how to respond. Tell me
      about a time you had to get that group aligned on one course of action while the incident was still going on.
    expected_concepts:
      - establishing who has decision authority during the incident
      - summarising the options and their risks quickly
      - keeping senior people informed without slowing responders
      - making or securing a decision under time pressure
      - follow-up review of how decisions were made
    rubric:
      excellent: Establishes clear decision authority, frames options and risks quickly, shields responders, secures a timely decision and improves the process afterwards.
      good: Gets the group aligned and the incident handled, with some structure.
      weak: Lets competing instructions reach responders, or cannot describe how a decision was reached.
    followups:
      - How did you handle a senior person who kept second-guessing the plan?
      - What did you change in the incident process afterwards?
    common_errors:
      - Allowing whoever is most senior to decide regardless of who holds the context.

  - external_key: leadership.influence.retiring_relied_on_system
    competency_key: stakeholder_management
    topic: Persuading users to give up a system they rely on
    difficulty: hard
    text: >-
      Tell me about a time you had to persuade teams or customers to give up a system they depended on and liked, so it
      could be retired. How did you get them to move, and how did you handle the ones who refused?
    expected_concepts:
      - clear reason for retirement communicated in their terms
      - understanding which features users actually relied on
      - replacement or workaround for critical use cases
      - timeline with notice and support
      - handling holdouts with escalation as a last resort
    rubric:
      excellent: Explains the case in users' terms, maps real dependencies, provides replacements for critical needs, runs a supported timeline and deals with holdouts constructively before escalating.
      good: Retires the system with reasonable communication and support.
      weak: Announces a deadline without understanding users' needs, or lets the retirement stall indefinitely.
    followups:
      - What dependency did you discover late?
      - Did you have to extend the deadline, and how did you decide?
    common_errors:
      - Treating a hard deadline as a substitute for persuasion.

  - external_key: leadership.influence.deciding_without_consensus
    competency_key: ownership
    topic: Deciding before reaching consensus
    difficulty: hard
    text: >-
      Tell me about a time you chose to make a call before the group had reached consensus, because waiting longer would
      have been costly. How did you decide it was time, and how did you bring people along afterwards?
    expected_concepts:
      - the cost of further delay
      - having heard the main positions first
      - explaining the decision and reasoning openly
      - acknowledging dissent and how it would be revisited
      - outcome and how the group responded
    rubric:
      excellent: Explains why delay was costly, shows they had heard all views, communicates reasoning openly, gives dissenters a way to revisit the call and reports the outcome.
      good: Makes a justified call and explains it adequately.
      weak: Uses urgency as an excuse to skip input, or cannot explain the reasoning.
    followups:
      - What would have made you wait longer?
      - Did you ever revisit the decision?
    common_errors:
      - Not telling people how or when the decision could be reopened.

  - external_key: leadership.influence.persuading_on_thin_evidence
    competency_key: leadership
    topic: Persuading leadership to make a bet on thin evidence
    difficulty: hard
    text: >-
      Tell me about a time you had to persuade leadership to commit to a direction where the evidence was genuinely
      ambiguous. How did you make the case without overstating what you knew?
    expected_concepts:
      - stating clearly what was known and unknown
      - framing it as a bet with defined checkpoints
      - limiting the downside through scope or reversibility
      - criteria for stopping or changing course
      - outcome and how the checkpoints were used
    rubric:
      excellent: Is explicit about uncertainty, frames the commitment as a bounded bet with checkpoints and stop criteria, and describes how those checkpoints were used in practice.
      good: Acknowledges uncertainty and proposes a reasonable plan to reduce it.
      weak: Overstates certainty to win the argument, or offers no way to limit the risk.
    followups:
      - What signal would have made you recommend stopping?
      - How did leadership react to you admitting what you didn't know?
    common_errors:
      - Presenting a guess as a forecast.
