# Curated questions: leadership round, decisions under uncertainty (part 3 of 4). Confidence, delegation, triage, customer commitments and large uncertain bets. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.decisions_uncertainty.default_to_reversible
  competency_key: leadership
  topic: Preferring choices that can be undone
  difficulty: easy
  text: >-
    When you aren't sure which way to go, how do you decide whether to pick the option that is easiest
    to undo?
  expected_concepts:
  - asking what it costs to reverse each option
  - weighing speed of learning
  - recognising when reversibility is not available
  - telling the team the choice is provisional
  rubric:
    excellent: >-
      Explains a clear test for reversibility, gives an example where it sped up learning, and also names
      a case where reversibility was not possible and how they dealt with it.
    good: States a preference for reversible choices with one reasonable example.
    weak: Treats every decision as equally weighty or always waits for certainty.
  followups:
  - What is an example you could not undo?
  - How do you tell the team a choice is provisional?
  common_errors:
  - Assuming every decision needs the same level of analysis.

- external_key: leadership.decisions_uncertainty.confidence_levels_in_updates
  competency_key: communication
  topic: Sharing how sure you are
  difficulty: easy
  text: >-
    When you give your manager or stakeholders an update on something uncertain, how do you let them know
    how confident you are?
  expected_concepts:
  - separating known facts from estimates
  - stating confidence in plain terms
  - naming what would change the picture
  - avoiding both over-promising and hedging everything
  rubric:
    excellent: >-
      Distinguishes facts, estimates and guesses clearly in updates, gives a plain confidence level with
      its reason, and says what new information would change it.
    good: Mentions caveats and ranges in updates with limited structure.
    weak: Gives bare conclusions or buries every statement in hedges.
  followups:
  - Can you give me an example sentence you would use?
  - How did stakeholders use that?
  common_errors:
  - Hedging every sentence so the reader cannot tell what matters.

- external_key: leadership.decisions_uncertainty.good_decision_bad_outcome
  competency_key: leadership
  topic: Separating decision quality from results
  difficulty: easy
  text: >-
    Can you think of a time when a sound decision still led to a poor result, or a weak one worked out
    by luck? What did you take from it?
  expected_concepts:
  - judging the decision by what was known at the time
  - recognising luck and variance
  - reviewing process rather than outcome only
  - avoiding blame for reasonable calls
  rubric:
    excellent: >-
      Gives a real example, separates process quality from outcome, and describes how it changed how the
      team reviews decisions and treats people after poor results.
    good: Recognises the difference and gives an example with limited effect on practice.
    weak: Judges all decisions by results or cannot give an example.
  followups:
  - How did you talk to the team about it?
  - How do you spot a lucky win?
  common_errors:
  - Judging every decision purely by how it turned out.

- external_key: leadership.decisions_uncertainty.fast_info_gathering
  competency_key: problem_solving
  topic: Getting enough facts in a day
  difficulty: easy
  text: >-
    You've been asked to make a recommendation by tomorrow on something you know little about. How do
    you spend the time?
  expected_concepts:
  - identifying the two or three questions that matter
  - finding the person who knows most
  - checking primary data not hearsay
  - stating what remains unknown
  - giving a recommendation with caveats
  rubric:
    excellent: >-
      Narrows to the key questions, goes to primary sources and the best-informed person, and delivers
      a clear recommendation that lists remaining unknowns.
    good: Gathers sensible information and gives a recommendation, with less on unknowns.
    weak: Tries to learn everything or gives an opinion without checking.
  followups:
  - Whom would you call first?
  - What do you leave out?
  common_errors:
  - Collecting broad information without ever narrowing to the key questions.

- external_key: leadership.decisions_uncertainty.prioritising_new_team
  competency_key: project_management
  topic: Deciding where to start in a new team
  difficulty: easy
  text: >-
    When you join a team or take on an area you don't know yet, how do you decide what to focus on in
    the first weeks without full information?
  expected_concepts:
  - listening to people and customers
  - reading incident and delivery history
  - picking a few early checks
  - avoiding big changes at first
  - sharing early observations for correction
  rubric:
    excellent: >-
      Describes a purposeful listening and data-reading plan, selects a few early priorities with reasons,
      avoids premature change, and checks assumptions with the team.
    good: Talks to people and observes, with a looser plan.
    weak: Starts changing things immediately or waits passively.
  followups:
  - What did you learn that surprised you?
  - What did you decide not to touch?
  common_errors:
  - Making large changes before understanding why things work the way they do.

- external_key: leadership.decisions_uncertainty.commit_to_customer_unknown_feasibility
  competency_key: stakeholder_management
  topic: Promising a customer something you are unsure you can build
  difficulty: medium
  text: >-
    A major customer asks for a capability, and your team isn't sure it is feasible by the date they want.
    How do you respond to them and decide internally?
  expected_concepts:
  - finding out quickly what feasibility depends on
  - separating a commitment from an intention
  - offering a phased or alternative deliverable
  - setting the customer's expectation plainly about uncertainty
  - agreeing a date for a firm answer
  rubric:
    excellent: >-
      Runs a fast feasibility check, avoids committing to what is unknown, offers a phased option, and
      gives the customer a clear date by which they will get a firm answer.
    good: >-
      Is cautious with the customer and checks internally, with fewer concrete options.
    weak: Promises to win the deal or refuses outright without investigating.
  followups:
  - What did you check first?
  - What if they insist on a date?
  common_errors:
  - >-
    Promising a date to keep the relationship and finding out later it cannot be met.

- external_key: leadership.decisions_uncertainty.spike_or_commit
  competency_key: project_management
  topic: Spiking before committing to an approach
  difficulty: medium
  text: >-
    When do you ask a team to spend a few days on a spike before choosing an approach, and how do you
    stop it growing into the project itself?
  expected_concepts:
  - choosing the question the spike must answer
  - time-boxing
  - defining what outcomes lead to which decisions
  - keeping throwaway code throwaway
  - presenting findings to the team
  rubric:
    excellent: >-
      Defines a specific question and time box, links possible results to decisions, enforces the stop,
      and shares findings so the decision is made on evidence.
    good: Uses spikes sensibly with a time box, with weaker link to decisions.
    weak: Never spikes, or spikes without a question and ends up building the real thing.
  followups:
  - What did the spike tell you?
  - What did you do when the time box ran out?
  common_errors:
  - Letting a spike turn into the production build with no decision point.

- external_key: leadership.decisions_uncertainty.estimate_new_technology
  competency_key: project_management
  topic: Estimating work in unfamiliar technology
  difficulty: medium
  text: >-
    Your team will use a technology none of them has shipped with before, and you need to commit to a
    plan. How do you estimate and what do you promise?
  expected_concepts:
  - identifying learning curve and unknowns
  - using early prototypes to calibrate
  - giving ranges and re-estimating at checkpoints
  - adding explicit learning time
  - being clear about what is firm
  rubric:
    excellent: >-
      Builds in learning time, calibrates with an early prototype, shares ranges with checkpoints, and
      separates firm commitments from estimates.
    good: Adds buffer and re-estimates later, with limited calibration.
    weak: Estimates as if the technology were familiar.
  followups:
  - How did the first estimate compare with the result?
  - How did you tell stakeholders?
  common_errors:
  - Estimating as though the team already knew the technology.

- external_key: leadership.decisions_uncertainty.expert_opinions_conflict
  competency_key: problem_solving
  topic: Two experts with opposite advice
  difficulty: medium
  text: >-
    Two people you trust give you opposite advice on an important technical call, and both seem well informed.
    How do you decide?
  expected_concepts:
  - understanding the assumptions behind each view
  - asking each to critique the other
  - identifying a test that would discriminate
  - considering the context difference
  - making and owning the call
  rubric:
    excellent: >-
      Digs into the assumptions that drive the difference, brings the two together, finds a test or criterion
      that separates them, and decides with clear ownership.
    good: Weighs the arguments and picks a direction with less probing of assumptions.
    weak: Picks based on seniority or average of the two views.
  followups:
  - What did you find was the real source of disagreement?
  - Did either of them change their mind?
  common_errors:
  - Splitting the difference between two views without understanding either.

- external_key: leadership.decisions_uncertainty.security_risk_acceptance
  competency_key: stakeholder_management
  topic: Accepting a risk you cannot fully measure
  difficulty: medium
  text: >-
    A fix for a security weakness would delay an important release, and nobody can say how likely exploitation
    is. How do you approach the decision?
  expected_concepts:
  - involving security specialists
  - estimating impact if exploited
  - looking for compensating controls
  - deciding who can formally accept a risk
  - recording the acceptance and review date
  rubric:
    excellent: >-
      Brings in security expertise, frames impact and exposure, explores compensating controls, ensures
      the right owner formally accepts any residual risk, and sets a date to revisit.
    good: >-
      Weighs impact against the delay and consults security, with less on formal acceptance.
    weak: Ships without recording the risk or blocks without weighing the cost.
  followups:
  - Who has authority to accept the risk?
  - How would you track it?
  common_errors:
  - Shipping with a known weakness and no recorded owner or review date.

- external_key: leadership.decisions_uncertainty.feature_without_usage_data
  competency_key: product_sense
  topic: Deciding on a feature with little usage data
  difficulty: medium
  text: >-
    You're deciding whether to invest in a feature but have almost no usage data to guide you. What do
    you do?
  expected_concepts:
  - using customer conversations and support signals
  - building the cheapest test
  - defining success measures before building
  - checking the opportunity against other work
  - deciding a stop point
  rubric:
    excellent: >-
      Combines qualitative signals with a cheap test, defines success and stop measures before building,
      and compares the opportunity with the alternatives.
    good: Gathers some signals and runs a modest test, with fuzzy success measures.
    weak: Builds on intuition alone or waits for data that will never exist.
  followups:
  - How many conversations is enough?
  - What would make you kill it?
  common_errors:
  - Waiting for usage data that cannot exist before the feature does.

- external_key: leadership.decisions_uncertainty.surge_capacity_plan
  competency_key: project_management
  topic: Preparing for an uncertain spike in load
  difficulty: medium
  text: >-
    You expect traffic to rise sharply, but nobody agrees on by how much. How do you decide how much capacity
    or readiness to invest in?
  expected_concepts:
  - scenario ranges for demand
  - cost of under- and over-provisioning
  - elastic or staged options
  - load testing to learn limits
  - triggers for scaling up
  rubric:
    excellent: >-
      Frames low, expected and high scenarios, compares the cost of being short versus over, prefers elastic
      options, tests to know real limits, and defines scale-up triggers.
    good: Prepares for a probable case with some buffer and tests.
    weak: Picks one number arbitrarily or does nothing until the spike.
  followups:
  - What triggers would you watch?
  - What do you do if the high case arrives early?
  common_errors:
  - Choosing one forecast number and treating it as certain.

- external_key: leadership.decisions_uncertainty.decision_rights_delegation
  competency_key: leadership
  topic: Deciding what others can decide
  difficulty: medium
  text: >-
    How do you decide which uncertain decisions to delegate and which to keep, and how do you help people
    make the call well?
  expected_concepts:
  - judging stakes and reversibility
  - stating the decision boundaries clearly
  - sharing context and principles
  - being available without taking over
  - reviewing outcomes together
  rubric:
    excellent: >-
      Uses explicit stakes and reversibility criteria, communicates the boundaries and context, supports
      without taking over, and reviews outcomes to calibrate trust.
    good: Delegates sensibly with some guidance and follow-up.
    weak: Keeps most decisions or delegates without context.
  followups:
  - Tell me about a delegated decision that went badly.
  - How did you adjust?
  common_errors:
  - Handing over a decision without the context needed to make it.

- external_key: leadership.decisions_uncertainty.competing_urgent_issues
  competency_key: ownership
  topic: Triage when several issues look urgent
  difficulty: medium
  text: >-
    Three issues arrive in the same hour, each claimed to be critical, and you can't verify any of them
    quickly. How do you triage?
  expected_concepts:
  - asking quick, targeted questions about customer impact
  - separating urgent from important
  - assigning people to confirm
  - communicating the order to requesters
  - reviewing the order as facts come in
  rubric:
    excellent: >-
      Gets rapid impact facts, orders work on impact and reversibility, assigns verification in parallel,
      tells requesters the order and reasoning, and re-evaluates.
    good: Prioritises by apparent impact and informs people.
    weak: Responds to whoever is loudest or tries to do all at once.
  followups:
  - What are your quick questions?
  - How do you handle a senior person who disagrees with the order?
  common_errors:
  - Treating the loudest requester as the most urgent.

- external_key: leadership.decisions_uncertainty.late_requirement_changes
  competency_key: adaptability
  topic: Requirements that keep moving
  difficulty: medium
  text: >-
    A project's requirements keep shifting while you are mid-delivery and the sponsor can't say when they
    will settle. How do you keep making progress and decisions?
  expected_concepts:
  - identifying what is stable and building that first
  - making changes visible with costs
  - setting a change cadence
  - modular choices that tolerate change
  - agreeing a freeze point
  rubric:
    excellent: >-
      Builds stable parts first, makes the cost of changes visible, agrees a cadence and freeze point
      with the sponsor, and designs to keep options open.
    good: Absorbs changes with some communication on impact.
    weak: Accepts every change silently or refuses all changes.
  followups:
  - How did the sponsor respond to seeing the costs?
  - What did you leave flexible?
  common_errors:
  - Accepting each change silently so its cost stays invisible.

- external_key: leadership.decisions_uncertainty.leader_unavailable_must_decide
  competency_key: ownership
  topic: Deciding when your leader is unreachable
  difficulty: hard
  text: >-
    Something urgent comes up and your manager and the usual decision-makers can't be reached. Tell me
    how you decide whether to act and how far to go.
  expected_concepts:
  - judging whether delay causes serious harm
  - choosing the smallest reversible action
  - recording reasoning
  - informing leaders quickly afterward
  - accepting responsibility
  rubric:
    excellent: >-
      Tests whether waiting is harmful, takes the smallest reversible step within their authority, records
      the reasoning, informs the leader at the first chance and owns the outcome.
    good: Acts cautiously and informs afterwards, with less on limits of authority.
    weak: >-
      Does nothing despite harm, or takes drastic action without recording or telling anyone.
  followups:
  - Where is your line on what you would not do alone?
  - How did the leader respond?
  common_errors:
  - Taking a drastic step without recording it or telling anyone afterwards.

- external_key: leadership.decisions_uncertainty.hype_technology_bet
  competency_key: leadership
  topic: Adopting a new technology amid hype
  difficulty: hard
  text: >-
    A new technology is generating a lot of excitement, and people are pushing to adopt it, but there
    is limited evidence it fits your needs. How do you decide?
  expected_concepts:
  - defining the problem it would solve
  - checking maturity and operating cost
  - running a bounded trial on real work
  - considering skills and hiring
  - planning an exit
  rubric:
    excellent: >-
      Anchors on a concrete problem, evaluates maturity and operating burden, runs a bounded trial with
      criteria, accounts for team skills, and keeps an exit path.
    good: >-
      Evaluates with a trial and some criteria, with limited focus on exit and operating cost.
    weak: Adopts because others do or rejects without trying.
  followups:
  - What criteria did you set?
  - How did you handle people who were very keen?
  common_errors:
  - Choosing a technology for its novelty rather than the problem.

- external_key: leadership.decisions_uncertainty.untrusted_metrics
  competency_key: problem_solving
  topic: Deciding when the dashboard is not trustworthy
  difficulty: hard
  text: >-
    Leaders are about to make an expensive decision based on a dashboard you suspect is wrong in ways
    you can't yet prove. What do you do?
  expected_concepts:
  - raising the concern with specifics early
  - sampling data to test the suspicion
  - proposing to delay or hedge the decision
  - finding an independent source
  - fixing the underlying definition
  rubric:
    excellent: >-
      Raises the concern with concrete signs, runs a fast check against an independent source, proposes
      hedging the decision if needed, and follows up on fixing the metric definition.
    good: Flags the concern and investigates, with less on interim decision options.
    weak: Stays quiet to avoid friction or rejects the dashboard without evidence.
  followups:
  - How did you test your suspicion?
  - What if you were wrong?
  common_errors:
  - Staying quiet about a suspected data problem to avoid friction.

- external_key: leadership.decisions_uncertainty.merger_integration_choices
  competency_key: leadership
  topic: Integration choices with partial knowledge
  difficulty: hard
  text: >-
    Two engineering organisations are being combined, and you must make early decisions about tools and
    ownership before you understand either side well. How do you proceed?
  expected_concepts:
  - listening to both groups
  - deciding which choices are urgent
  - defaulting to reversible interim arrangements
  - defining criteria for the permanent choice
  - communicating decisions with reasons
  rubric:
    excellent: >-
      Prioritises urgent choices, uses interim reversible arrangements, sets criteria for permanent decisions
      with both groups, and explains reasons openly.
    good: Makes sensible early calls and consults both groups.
    weak: Imposes one side's tools or delays all decisions.
  followups:
  - Whose tools won and why?
  - How did you handle the ones who lost?
  common_errors:
  - Declaring one side's tools the standard without criteria.

- external_key: leadership.decisions_uncertainty.sunset_a_product
  competency_key: stakeholder_management
  topic: Retiring a product with uncertain consequences
  difficulty: hard
  text: >-
    You're considering retiring a product line whose true effect on customers and revenue is hard to estimate.
    How do you decide and manage the uncertainty?
  expected_concepts:
  - identifying the customers affected
  - estimating a range of impact
  - testing with a limited step like closing to new users
  - planning migrations
  - setting criteria and a communication plan
  rubric:
    excellent: >-
      Assesses affected customers, ranges the impact, takes reversible first steps such as closing to
      new sign-ups, plans migrations and communicates early with a clear decision criteria.
    good: Examines the impact and plans a transition, with limited staged approach.
    weak: Retires by announcement or never decides.
  followups:
  - Which customers worried you most?
  - What did the staged step reveal?
  common_errors:
  - Announcing a retirement without understanding which customers depend on it.

- external_key: leadership.decisions_uncertainty.communicating_partial_facts_crisis
  competency_key: communication
  topic: Updating executives with partial facts in a crisis
  difficulty: hard
  text: >-
    In a serious outage, executives and customers want answers, and you know only part of what happened.
    How do you communicate?
  expected_concepts:
  - stating known, unknown and next update time
  - avoiding speculation
  - giving customers what they can do now
  - keeping a single source of truth
  - correcting quickly when facts change
  rubric:
    excellent: >-
      Shares what is known and unknown with times for next updates, avoids speculation, gives actionable
      guidance, uses one source of truth and corrects openly.
    good: Gives regular updates with a reasonable distinction of fact from guess.
    weak: Stays silent until sure, or speculates about cause.
  followups:
  - What did your update template look like?
  - How did you handle being wrong in an update?
  common_errors:
  - Guessing at a cause in an update and having to retract it.

- external_key: leadership.decisions_uncertainty.budget_cut_uncertain_outcomes
  competency_key: project_management
  topic: Cutting spend without knowing what will be hurt
  difficulty: hard
  text: >-
    You're told to reduce your budget by a significant amount, and it's unclear which cuts will hurt delivery
    or reliability the most. How do you decide?
  expected_concepts:
  - mapping spend to outcomes
  - identifying low-value or duplicated spend
  - running scenarios
  - protecting critical reliability and learning
  - consulting the team and stakeholders
  - planning a review
  rubric:
    excellent: >-
      Maps spend to outcomes, cuts low-value items first, models scenarios, protects critical functions,
      consults affected people, and sets a review to catch harm.
    good: Identifies reasonable cuts and consults leaders, with less rigour on outcomes.
    weak: Cuts evenly across the board or chooses by convenience.
  followups:
  - What did you protect and why?
  - How did you find out if a cut hurt?
  common_errors:
  - Cutting every budget line by the same percentage.

- external_key: leadership.decisions_uncertainty.market_shift_architecture
  competency_key: leadership
  topic: Architecture decisions when the market may shift
  difficulty: hard
  text: >-
    You need to commit to an architecture for the next several years, but the direction of your market
    is uncertain. How do you make that call?
  expected_concepts:
  - identifying scenarios for the market
  - separating stable core from volatile edges
  - investing in modularity where change is likely
  - setting review points
  - avoiding over-engineering for unlikely futures
  rubric:
    excellent: >-
      Builds scenarios, isolates stable core from volatile parts, invests in flexibility selectively,
      defines review points, and guards against over-engineering.
    good: Chooses a flexible architecture with limited scenario reasoning.
    weak: Optimises for the current state or builds speculative generality everywhere.
  followups:
  - Which parts did you leave rigid?
  - What signal would trigger a rethink?
  common_errors:
  - Building generality everywhere for futures that may never come.

- external_key: leadership.decisions_uncertainty.two_roadmap_bets
  competency_key: product_sense
  topic: Choosing between two plausible bets
  difficulty: medium
  text: >-
    You can fund only one of two promising initiatives next quarter, and the evidence for each is thin.
    How do you choose, and what do you tell the team that doesn't get funded?
  expected_concepts:
  - comparing expected value and downside
  - checking which is cheaper to test
  - considering timing and dependencies
  - being explicit about why one was chosen
  - keeping the other alive in a small way
  rubric:
    excellent: >-
      Compares upside, downside, cost to test and timing, picks with stated reasons, and explains the
      decision to the unfunded team along with what would reopen it.
    good: Chooses with reasonable criteria and communicates the result.
    weak: Chooses by preference or seniority, or funds both thinly and delivers neither.
  followups:
  - What would have made you pick the other?
  - How did the unfunded team respond?
  common_errors:
  - Splitting the effort across both so neither gets a fair chance.

- external_key: leadership.decisions_uncertainty.hiring_signal_gaps
  competency_key: leadership
  topic: A hiring decision with mixed evidence
  difficulty: medium
  text: >-
    After the interviews, the evidence about a candidate for a key role is mixed and the panel disagrees.
    How do you move to a decision?
  expected_concepts:
  - reviewing evidence against the role's criteria
  - identifying what is still unknown
  - adding a targeted follow-up assessment
  - checking for bias in the discussion
  - accepting a defined risk or declining
  rubric:
    excellent: >-
      Anchors on job criteria, names the missing evidence, adds a targeted job-related follow-up if useful,
      guards against bias in discussion, and makes a decision with an onboarding or review plan.
    good: >-
      Discusses evidence and reaches a decision, with limited focus on missing evidence.
    weak: Goes with gut feel or the strongest voice on the panel.
  followups:
  - What follow-up would you add?
  - How do you reduce the risk after hiring?
  common_errors:
  - Letting the most senior panel member's impression settle the matter.
