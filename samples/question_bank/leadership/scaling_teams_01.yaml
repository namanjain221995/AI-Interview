# Curated questions: leadership round, scaling teams (part 1 of 4).
# Focus: scaling teams and organisations, team topology and ownership boundaries. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.scaling_teams.signs_team_too_big
  competency_key: leadership
  topic: Recognising when a team is too large
  difficulty: easy
  text: What signs tell you a team has grown too big to work well as one unit?
  expected_concepts:
  - meetings that no longer work
  - slower decisions
  - unclear ownership
  - people unaware of each other's work
  - one-to-one load on the lead
  rubric:
    excellent: >-
      Names several observable signs, ties them to specific experience, and describes what they did when they saw them.
    good: Lists sensible signs with a short example.
    weak: Gives only a headcount number with no reasoning.
  followups:
  - At what size did you notice it?
  - What was the first thing that broke?
  common_errors:
  - 'Answering in the weak pattern: gives only a headcount number with no reasoning'

- external_key: leadership.scaling_teams.first_split_of_a_team
  competency_key: leadership
  topic: Splitting a team in two
  difficulty: easy
  text: >-
    Tell me about a time you split one team into two. How did you decide where to draw the line?
  expected_concepts:
  - grouping by product area or user need
  - keeping dependencies low
  - involving the team in the split
  - clear ownership of each part
  - checking the result later
  rubric:
    excellent: >-
      Describes principles for the split, involves the team, defines ownership for each part, and reflects on what the result
      taught them.
    good: Gives a clear split with reasonable logic.
    weak: Splits by arbitrary headcount.
  followups:
  - What did people think of the split?
  - What dependency did you not expect?
  common_errors:
  - 'Answering in the weak pattern: splits by arbitrary headcount'

- external_key: leadership.scaling_teams.onboarding_when_hiring_fast
  competency_key: people_management
  topic: Onboarding many new people at once
  difficulty: easy
  text: >-
    How do you onboard several new people who join around the same time without overloading the team?
  expected_concepts:
  - a standard onboarding plan
  - shared materials
  - cohort sessions
  - named buddies
  - small first tasks
  - capacity planning
  rubric:
    excellent: >-
      Uses a standard plan with cohort and buddy support, plans the capacity cost, and shows quick effective starts.
    good: Has a plan and buddies.
    weak: Leaves each existing engineer to improvise.
  followups:
  - How much capacity did it cost?
  - What did you improve for the next cohort?
  common_errors:
  - 'Answering in the weak pattern: leaves each existing engineer to improvise'

- external_key: leadership.scaling_teams.ownership_list
  competency_key: ownership
  topic: Making clear who owns what
  difficulty: easy
  text: How do you make it clear who owns each service or area of work in your team?
  expected_concepts:
  - a visible ownership list
  - named teams and contacts
  - links from code or docs
  - review at reorganisations
  - handling unowned areas
  rubric:
    excellent: >-
      Describes a maintained ownership list linked to code and docs, handles unowned areas, and shows reduced confusion.
    good: Keeps a list that is mostly current.
    weak: Relies on people remembering.
  followups:
  - How do you keep it current?
  - What did you do with unowned things?
  common_errors:
  - 'Answering in the weak pattern: relies on people remembering'

- external_key: leadership.scaling_teams.team_communication_growth
  competency_key: communication
  topic: Communication as the team grows
  difficulty: easy
  text: >-
    What happens to communication when a team grows from five to fifteen, and what do you change?
  expected_concepts:
  - more channels and meetings
  - written updates
  - clearer roles
  - fewer all-hands decisions
  - deliberate sharing of context
  rubric:
    excellent: >-
      Explains how overhead grows and describes specific changes such as written updates, decision records and smaller forums.
    good: Notes the problem and some adjustments.
    weak: Keeps using the small-team habits.
  followups:
  - Which habit failed first?
  - What did you put in writing?
  common_errors:
  - 'Answering in the weak pattern: keeps using the small-team habits'

- external_key: leadership.scaling_teams.team_topology_basics
  competency_key: system_design
  topic: Choosing how teams are organised
  difficulty: medium
  text: >-
    How do you decide whether to organise teams around products, components, or customer journeys, and what trade-offs did
    you see in your own experience?
  expected_concepts:
  - how work flows to customers
  - coupling between components
  - ownership of outcomes
  - dependencies created
  - skill concentration
  - effect on speed
  rubric:
    excellent: >-
      Compares options with trade-offs from real experience, explains why one fit their context, and reports how it performed.
    good: Gives a reasonable comparison with limited experience.
    weak: Reorganises by familiar habit.
  followups:
  - What would have changed your choice?
  - What dependency did your structure create?
  common_errors:
  - 'Answering in the weak pattern: reorganises by familiar habit'

- external_key: leadership.scaling_teams.conway_in_practice
  competency_key: system_design
  topic: Team structure shaping architecture
  difficulty: medium
  text: >-
    Tell me about a time team structure and system architecture were in tension. What did you do?
  expected_concepts:
  - spotting the mismatch
  - the cost of coordination
  - changing teams or architecture
  - stage of change
  - communicating
  - checking results
  rubric:
    excellent: >-
      Identifies the mismatch with evidence, chooses to change teams, architecture or both, and describes results.
    good: Notes the tension and takes a step.
    weak: Treats architecture and teams as unrelated.
  followups:
  - Which did you change first?
  - What was the evidence?
  common_errors:
  - 'Answering in the weak pattern: treats architecture and teams as unrelated'

- external_key: leadership.scaling_teams.platform_team_creation
  competency_key: leadership
  topic: Starting a platform team
  difficulty: medium
  text: >-
    Have you set up or worked with a platform or shared services team? How did you decide it was needed and keep it useful?
  expected_concepts:
  - repeated work across teams
  - clear customers
  - product mindset
  - measures of adoption
  - staffing
  - avoiding becoming a bottleneck
  rubric:
    excellent: >-
      Shows evidence of duplicated effort, treats internal teams as customers, measures adoption and avoids bottlenecks.
    good: Explains the reasoning and general design.
    weak: Builds a platform without talking to its users.
  followups:
  - How did you measure usefulness?
  - What risks did you see?
  common_errors:
  - 'Answering in the weak pattern: builds a platform without talking to its users'

- external_key: leadership.scaling_teams.ownership_boundaries_dispute
  competency_key: ownership
  topic: Contested ownership
  difficulty: medium
  text: Two teams both believe a component belongs to the other. How do you resolve it?
  expected_concepts:
  - facts about changes and incidents
  - criteria for ownership
  - talking to both leads
  - deciding with a manager if needed
  - documenting
  - reviewing
  rubric:
    excellent: >-
      Uses facts and criteria, involves both leads, documents the outcome and checks it holds.
    good: Negotiates a split and documents it.
    weak: Leaves it unowned.
  followups:
  - What criteria did you use?
  - How did you make it stick?
  common_errors:
  - 'Answering in the weak pattern: leaves it unowned'

- external_key: leadership.scaling_teams.splitting_a_monolith_team
  competency_key: system_design
  topic: Aligning teams with a service split
  difficulty: medium
  text: >-
    Your organisation is splitting a large codebase into services owned by separate teams. How do you plan the team side of
    that change?
  expected_concepts:
  - ownership map
  - migration order
  - skills
  - shared libraries
  - on-call implications
  - interim arrangements
  - communication
  rubric:
    excellent: >-
      Maps ownership and skills, sequences the change, plans on-call and interim states, and communicates clearly.
    good: Plans teams for the new services.
    weak: Splits the code without changing the teams.
  followups:
  - What interim arrangement did you use?
  - What did you underestimate?
  common_errors:
  - 'Answering in the weak pattern: splits the code without changing the teams'

- external_key: leadership.scaling_teams.hiring_pace_vs_quality
  competency_key: people_management
  topic: Hiring fast without lowering the bar
  difficulty: medium
  text: You're asked to double the team in a year. How do you keep hiring quality high?
  expected_concepts:
  - structured process
  - trained interviewers
  - capacity of the team to onboard
  - staging of hiring
  - measuring outcomes
  - saying no to the pace if needed
  rubric:
    excellent: >-
      Keeps a structured process, trains interviewers, limits the pace to onboarding capacity, and tracks results.
    good: Maintains a process and makes a plan.
    weak: Lowers the bar to meet the number.
  followups:
  - What would make you slow down?
  - How did you measure quality?
  common_errors:
  - 'Answering in the weak pattern: lowers the bar to meet the number'

- external_key: leadership.scaling_teams.interviewer_capacity
  competency_key: people_management
  topic: Interview load on the team
  difficulty: medium
  text: >-
    Hiring takes a large share of your engineers' time. How do you manage the load and keep it fair?
  expected_concepts:
  - interviewer rota
  - training and shadowing
  - load tracking
  - scheduling blocks
  - recognising the work
  - reducing wasted steps
  rubric:
    excellent: Sets a rota, trains, tracks load, streamlines steps and recognises the work.
    good: Spreads the load across engineers.
    weak: Relies on a few people.
  followups:
  - How much time was it per week?
  - What did you cut?
  common_errors:
  - 'Answering in the weak pattern: relies on a few people'

- external_key: leadership.scaling_teams.manager_layer_introduction
  competency_key: leadership
  topic: Introducing a middle layer
  difficulty: medium
  text: >-
    Your team has become too big for one manager. How do you introduce another layer of leadership, and what do you keep for
    yourself?
  expected_concepts:
  - roles and decision rights
  - choosing the new leads
  - transition plan
  - communication to team
  - support
  - avoiding confusion
  rubric:
    excellent: >-
      Defines roles and decision rights, chooses with criteria, supports the transition, and communicates clearly to the team.
    good: Appoints leads and defines areas.
    weak: Adds a layer without defined roles.
  followups:
  - How did you choose?
  - How did the team react?
  common_errors:
  - 'Answering in the weak pattern: adds a layer without defined roles'

- external_key: leadership.scaling_teams.lead_selection_internal_or_external
  competency_key: people_management
  topic: Choosing between internal and external leads
  difficulty: medium
  text: >-
    You need a new lead for a growing team and have both an internal candidate and an external one. How do you decide?
  expected_concepts:
  - role criteria
  - evidence from work
  - structured assessment
  - development of the internal candidate
  - communication with the other candidate
  - team needs
  rubric:
    excellent: >-
      Uses role criteria and equal assessment, communicates fairly with all, and supports whoever is not chosen.
    good: Compares against criteria.
    weak: Chooses by familiarity.
  followups:
  - What if the internal candidate is not ready?
  - How did you tell the other one?
  common_errors:
  - 'Answering in the weak pattern: chooses by familiarity'

- external_key: leadership.scaling_teams.coordination_cost
  competency_key: project_management
  topic: Reducing coordination overhead
  difficulty: medium
  text: >-
    Give an example of reducing the coordination cost between teams. What did you change?
  expected_concepts:
  - measuring where waiting happens
  - clearer interfaces
  - fewer shared deploys
  - self-service tools
  - fewer meetings
  - evidence of improvement
  rubric:
    excellent: >-
      Finds where time is lost, changes interfaces or tooling, and shows measured improvement.
    good: Reduces some coordination.
    weak: Adds a coordinating meeting.
  followups:
  - What did you measure?
  - What cost remained?
  common_errors:
  - 'Answering in the weak pattern: adds a coordinating meeting'

- external_key: leadership.scaling_teams.dependency_map
  competency_key: project_management
  topic: Understanding team dependencies
  difficulty: medium
  text: >-
    How do you map and manage dependencies between your team and others as the organisation grows?
  expected_concepts:
  - dependency mapping
  - identifying the main blockers
  - agreed interfaces
  - planning with partners
  - escalation
  - reducing dependencies over time
  rubric:
    excellent: >-
      Maps dependencies, targets the largest, agrees interfaces and tracks progress in reducing them.
    good: Tracks dependencies in planning.
    weak: Discovers dependencies when blocked.
  followups:
  - Which dependency was worst?
  - How did you reduce it?
  common_errors:
  - 'Answering in the weak pattern: discovers dependencies when blocked'

- external_key: leadership.scaling_teams.new_team_launch
  competency_key: leadership
  topic: Launching a new team
  difficulty: medium
  text: >-
    Walk me through launching a new team from scratch: what do you establish in the first ninety days?
  expected_concepts:
  - mission and scope
  - initial members
  - ways of working
  - first deliverable
  - relationships with partners
  - measures
  rubric:
    excellent: >-
      Sets mission and scope, builds a plan with early deliverables, aligns with partners, and measures the result.
    good: Covers mission, people and process.
    weak: Starts with tasks and no mission.
  followups:
  - What was the first deliverable?
  - What did you change after a month?
  common_errors:
  - 'Answering in the weak pattern: starts with tasks and no mission'

- external_key: leadership.scaling_teams.scaling_decision_making
  competency_key: leadership
  topic: Decentralising decisions
  difficulty: medium
  text: >-
    As your organisation grows, how do you move decisions closer to the people doing the work while keeping alignment?
  expected_concepts:
  - principles and guardrails
  - delegated decision rights
  - decision records
  - escalation
  - review of outcomes
  - training
  rubric:
    excellent: >-
      Sets guardrails, delegates decisions, records outcomes, and shows faster decisions with alignment kept.
    good: Delegates some decisions.
    weak: Keeps all decisions centralised.
  followups:
  - Which decision did you delegate first?
  - What went wrong?
  common_errors:
  - 'Answering in the weak pattern: keeps all decisions centralised'

- external_key: leadership.scaling_teams.ownership_gaps_after_reorg
  competency_key: ownership
  topic: Ownership falling between teams
  difficulty: hard
  text: >-
    After a reorganisation you find that several systems have no clear owner. How do you handle it?
  expected_concepts:
  - inventory
  - criteria for assignment
  - negotiation with leads
  - interim ownership
  - explicit handover
  - follow-up
  rubric:
    excellent: >-
      Takes inventory, applies criteria, negotiates, assigns interim owners, and follows up.
    good: Assigns most owners.
    weak: Waits for problems to show up.
  followups:
  - What was left unowned longest?
  - What incident exposed it?
  common_errors:
  - 'Answering in the weak pattern: waits for problems to show up'

- external_key: leadership.scaling_teams.org_redesign_for_speed
  competency_key: system_design
  topic: Redesigning a structure that slowed delivery
  difficulty: hard
  text: >-
    Delivery slowed because work needed to pass through too many teams. How did you analyse it and what did you change?
  expected_concepts:
  - value-stream mapping
  - counting handoffs
  - identifying bottlenecks
  - changing team boundaries or responsibilities
  - trade-offs
  - measuring
  rubric:
    excellent: >-
      Maps flow, finds bottlenecks, redesigns boundaries with trade-offs, and shows measured improvement.
    good: Reduces some handoffs.
    weak: Adds a coordinator.
  followups:
  - What trade-off did you accept?
  - How did you measure?
  common_errors:
  - 'Answering in the weak pattern: adds a coordinator'

- external_key: leadership.scaling_teams.growth_that_leadership_demands
  competency_key: stakeholder_management
  topic: Pressure to grow faster than you can handle
  difficulty: hard
  text: >-
    Leadership wants the team to triple in six months and you think it will damage delivery. What do you do?
  expected_concepts:
  - modelling the effect
  - options for staging
  - risks
  - alternatives
  - decision escalation
  - commitment and review
  rubric:
    excellent: >-
      Models consequences, proposes staged options, escalates with evidence, and commits to the decision with review points.
    good: Raises concerns and proposes a slower pace.
    weak: Complies without analysis or refuses outright.
  followups:
  - What did the model show?
  - What did you finally agree?
  common_errors:
  - 'Answering in the weak pattern: complies without analysis or refuses outright'

- external_key: leadership.scaling_teams.tech_debt_ownership_at_scale
  competency_key: ownership
  topic: Sharing the cost of old systems
  difficulty: hard
  text: >-
    Several teams depend on an old system that nobody wants to maintain. How do you secure ownership and funding?
  expected_concepts:
  - quantifying cost and risk
  - stakeholder alignment
  - ownership proposals
  - shared funding
  - roadmap
  - milestones
  rubric:
    excellent: >-
      Quantifies cost and risk, aligns stakeholders, secures an owner and funding, and delivers milestones.
    good: Finds an owner after discussion.
    weak: Leaves it unowned.
  followups:
  - What risk got attention?
  - How did you fund it?
  common_errors:
  - 'Answering in the weak pattern: leaves it unowned'

- external_key: leadership.scaling_teams.consolidating_teams
  competency_key: leadership
  topic: Merging teams after a downturn
  difficulty: hard
  text: >-
    A downturn forces you to combine two teams with different cultures and fewer people. How do you lead that?
  expected_concepts:
  - clear explanation of reasons
  - fair role selection
  - combined goals
  - respecting existing strengths
  - support for those leaving
  - communication
  rubric:
    excellent: >-
      Explains reasons, uses fair selection, aligns goals, preserves strengths and supports leavers.
    good: Communicates and forms the team.
    weak: Handles it with little explanation.
  followups:
  - How did you select roles?
  - What happened to morale?
  common_errors:
  - 'Answering in the weak pattern: handles it with little explanation'

- external_key: leadership.scaling_teams.federated_vs_central
  competency_key: system_design
  topic: Central or embedded specialists
  difficulty: hard
  text: >-
    Should specialists such as security, data or quality engineers sit in a central team or be embedded in product teams?
    How did you decide?
  expected_concepts:
  - effects on consistency and responsiveness
  - scale of demand
  - career growth
  - standards
  - embedded model with community
  - hybrid
  rubric:
    excellent: >-
      Weighs trade-offs for their context, chooses a model, describes mitigations and measured results.
    good: Compares both with a choice.
    weak: Picks one without trade-offs.
  followups:
  - What did you lose with your choice?
  - How did you review it?
  common_errors:
  - 'Answering in the weak pattern: picks one without trade-offs'

- external_key: leadership.scaling_teams.second_order_effects_of_growth
  competency_key: leadership
  topic: Anticipating problems before they hit
  difficulty: hard
  text: >-
    When you plan significant growth, how do you anticipate second-order effects like review bottlenecks, onboarding load
    and on-call strain?
  expected_concepts:
  - modelling flows
  - early indicators
  - prevention plans
  - staged growth
  - checkpoints
  - adjusting
  rubric:
    excellent: >-
      Models the effects, defines indicators, plans mitigations and checks them at stages.
    good: Names several likely effects.
    weak: Reacts after the symptoms appear.
  followups:
  - Which indicator warned you?
  - What did you not foresee?
  common_errors:
  - 'Answering in the weak pattern: reacts after the symptoms appear'
