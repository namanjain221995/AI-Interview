# Curated questions: leadership round, innovation (part 4 of 4).
# Focus: innovation and continuous improvement, experimentation and learning culture. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.innovation.reviewing_old_decisions
  competency_key: problem_solving
  topic: Revisiting an old choice
  difficulty: easy
  text: How do you know when it is time to revisit an old technical or process decision?
  expected_concepts:
  - changed conditions
  - recurring pain
  - new options
  - cost of staying
  - recording the original reasons
  - deciding with evidence
  rubric:
    excellent: Names signals, checks the original reasons and revisits with evidence.
    good: Revisits when problems repeat.
    weak: Never revisits.
  followups:
  - What was the last one you revisited?
  - What was decided?
  common_errors:
  - 'Answering in the weak pattern: never revisits'

- external_key: leadership.innovation.celebrating_learning
  competency_key: culture_values
  topic: Recognising learning
  difficulty: easy
  text: >-
    How do you recognise learning and good experiments on your team, even when they don't succeed?
  expected_concepts:
  - sharing lessons publicly
  - thanking people
  - separating outcome from decision quality
  - regular forum
  - leader modelling
  rubric:
    excellent: >-
      Recognises well-run experiments regardless of outcome, shares lessons, and models the behaviour.
    good: Thanks people for trying.
    weak: Recognises only successes.
  followups:
  - What did you celebrate recently?
  - How do people respond?
  common_errors:
  - 'Answering in the weak pattern: recognises only successes'

- external_key: leadership.innovation.team_learning_time
  competency_key: culture_values
  topic: Time for learning
  difficulty: easy
  text: What do you do to give people time to learn new things during working hours?
  expected_concepts:
  - scheduled time
  - goals
  - sharing back
  - budgets
  - managers protecting time
  - tracking
  rubric:
    excellent: Provides protected time with sharing back, and shows examples of use in work.
    good: Offers some learning time.
    weak: Expects learning in personal time.
  followups:
  - How do you protect the time?
  - What did people learn?
  common_errors:
  - 'Answering in the weak pattern: expects learning in personal time'

- external_key: leadership.innovation.idea_to_prototype
  competency_key: problem_solving
  topic: Quickly testing an idea
  difficulty: easy
  text: Describe how you take a rough idea to something people can try quickly.
  expected_concepts:
  - smallest version
  - time box
  - real users
  - feedback
  - deciding whether to continue
  - avoiding over-building
  rubric:
    excellent: >-
      Builds the smallest version in a time box, tests with real users and decides based on feedback.
    good: Builds a prototype and gets feedback.
    weak: Builds a full solution first.
  followups:
  - How small was the prototype?
  - What was the decision?
  common_errors:
  - 'Answering in the weak pattern: builds a full solution first'

- external_key: leadership.innovation.continuous_improvement_habit
  competency_key: leadership
  topic: Making improvement routine
  difficulty: easy
  text: >-
    How do you make continuous improvement a regular habit in the team and not an occasional project?
  expected_concepts:
  - regular slot
  - small changes
  - owner
  - visible list
  - celebrating
  - reviewing results
  rubric:
    excellent: >-
      Sets a regular slot and visible list, small changes with owners, and shows steady improvements.
    good: Has a regular improvement slot.
    weak: Improves only after crises.
  followups:
  - How do you pick items?
  - What improvement lasted longest?
  common_errors:
  - 'Answering in the weak pattern: improves only after crises'

- external_key: leadership.innovation.improving_code_review_process
  competency_key: code_quality
  topic: Improving review turnaround
  difficulty: medium
  text: >-
    Tell me about improving a shared engineering process such as code review or release, using evidence of where the time
    went.
  expected_concepts:
  - measuring current state
  - finding delay causes
  - options
  - trial
  - results
  - sharing
  rubric:
    excellent: >-
      Measures first, finds the actual delay, trials options and reports measured results.
    good: Improves the process after discussion.
    weak: Changes the process on assumptions.
  followups:
  - What did the measures show?
  - What option did you reject?
  common_errors:
  - 'Answering in the weak pattern: changes the process on assumptions'

- external_key: leadership.innovation.ideas_from_customers_support
  competency_key: product_sense
  topic: Mining support tickets
  difficulty: medium
  text: >-
    How have you used support tickets or user complaints as a source of improvement ideas?
  expected_concepts:
  - categorising
  - frequency and cost
  - root causes
  - proposals
  - validating
  - measuring reduction
  rubric:
    excellent: >-
      Categorises tickets, quantifies cost, addresses root causes and measures the reduction.
    good: Fixes common issues.
    weak: Handles tickets one by one.
  followups:
  - What was the largest category?
  - What fell afterwards?
  common_errors:
  - 'Answering in the weak pattern: handles tickets one by one'

- external_key: leadership.innovation.rapid_learning_loops
  competency_key: adaptability
  topic: Shortening feedback loops
  difficulty: medium
  text: >-
    Describe a time you shortened the feedback loop between making a change and learning from it.
  expected_concepts:
  - current delays
  - options such as feature flags or smaller releases
  - implementation
  - measurement
  - effects on quality
  - sharing
  rubric:
    excellent: >-
      Identifies delays, introduces specific options, measures the effect and shares them.
    good: Shortens one loop.
    weak: Does not consider loop length.
  followups:
  - How long was the loop before and after?
  - What did it cost?
  common_errors:
  - 'Answering in the weak pattern: does not consider loop length'

- external_key: leadership.innovation.experimentation_with_hiring_process
  competency_key: problem_solving
  topic: Improving an internal process with a trial
  difficulty: medium
  text: >-
    Have you piloted a change in an internal process like planning or onboarding and compared results? What did you do?
  expected_concepts:
  - hypothesis
  - pilot group
  - comparison
  - feedback
  - decision
  - roll-out
  rubric:
    excellent: >-
      States a hypothesis, runs a pilot with a comparison, collects feedback and decides.
    good: Pilots and decides.
    weak: Changes everyone at once.
  followups:
  - How did you compare?
  - What did you decide?
  common_errors:
  - 'Answering in the weak pattern: changes everyone at once'

- external_key: leadership.innovation.handling_novelty_fatigue
  competency_key: leadership
  topic: Too much change
  difficulty: medium
  text: >-
    Your team is tired of constant changes to tools and practices. How do you respond?
  expected_concepts:
  - listening
  - limiting concurrent changes
  - clear reasons
  - stability periods
  - measuring benefit
  - stopping some
  rubric:
    excellent: >-
      Listens, limits change at once, explains reasons, protects stability and stops low-value changes.
    good: Slows the pace and explains.
    weak: Pushes on.
  followups:
  - What did you stop?
  - How did you decide the pace?
  common_errors:
  - 'Answering in the weak pattern: pushes on'

- external_key: leadership.innovation.sponsoring_a_bottom_up_idea
  competency_key: mentoring
  topic: Supporting someone else's idea
  difficulty: medium
  text: Tell me about helping someone on your team turn their idea into reality.
  expected_concepts:
  - listening
  - shaping
  - resources
  - removing blockers
  - protecting
  - credit
  - reviewing
  rubric:
    excellent: >-
      Shapes the idea with them, finds resources, removes blockers, credits them and reviews.
    good: Supports the idea.
    weak: Takes over the idea.
  followups:
  - What blocker did you remove?
  - How did they grow?
  common_errors:
  - 'Answering in the weak pattern: takes over the idea'

- external_key: leadership.innovation.small_batches
  competency_key: project_management
  topic: Learning by delivering in small pieces
  difficulty: medium
  text: >-
    How has delivering in smaller increments changed what your team learns and how quickly?
  expected_concepts:
  - smaller scope
  - earlier feedback
  - reduced risk
  - changes to planning
  - measures
  - trade-offs
  rubric:
    excellent: >-
      Explains the change in scope, feedback and risk, with measured improvement and trade-offs.
    good: Delivers smaller increments.
    weak: Delivers large releases.
  followups:
  - What was the trade-off?
  - What did you learn earlier?
  common_errors:
  - 'Answering in the weak pattern: delivers large releases'

- external_key: leadership.innovation.deliberate_practice_in_team
  competency_key: mentoring
  topic: Building skills through practice
  difficulty: medium
  text: >-
    What do you do to help the team practise skills such as debugging, design or incident response and not just learn on the
    job?
  expected_concepts:
  - exercises
  - katas or game days
  - review of real cases
  - feedback
  - time
  - tracking
  rubric:
    excellent: Provides regular practice formats with feedback and shows skill improvement.
    good: Runs occasional exercises.
    weak: Relies on learning by doing alone.
  followups:
  - What format worked?
  - What improved?
  common_errors:
  - 'Answering in the weak pattern: relies on learning by doing alone'

- external_key: leadership.innovation.reading_and_applying_research
  competency_key: adaptability
  topic: Turning ideas from literature into practice
  difficulty: medium
  text: >-
    Tell me about something you read or heard that you applied to your team's work. How did you test whether it worked?
  expected_concepts:
  - source
  - relevance
  - small trial
  - measures
  - adaptation
  - sharing
  rubric:
    excellent: Chooses a relevant idea, trials it with measures, adapts and shares.
    good: Applies and observes.
    weak: Adopts it wholesale.
  followups:
  - What did you adapt?
  - Did it work?
  common_errors:
  - 'Answering in the weak pattern: adopts it wholesale'

- external_key: leadership.innovation.automating_quality_checks
  competency_key: code_quality
  topic: Using tooling to improve quality
  difficulty: medium
  text: >-
    Describe how you introduced a quality improvement through tooling, such as linting, contract tests or review bots, and
    handled the team's response.
  expected_concepts:
  - problem
  - tool choice
  - gradual rollout
  - noise control
  - feedback
  - measures
  rubric:
    excellent: >-
      Starts from a problem, rolls out gradually, controls noise, gathers feedback and measures.
    good: Introduces the tool with feedback.
    weak: Imposes the tool.
  followups:
  - What noise did you face?
  - What did you measure?
  common_errors:
  - 'Answering in the weak pattern: imposes the tool'

- external_key: leadership.innovation.decision_records_for_experiments
  competency_key: communication
  topic: Recording what you tried and why
  difficulty: medium
  text: >-
    How do you record experiments and their results so that future team members can learn from them?
  expected_concepts:
  - standard template
  - hypothesis
  - method
  - result
  - decision
  - searchable location
  - links
  rubric:
    excellent: >-
      Uses a template, records results and decisions in a searchable place, and shows reuse.
    good: Records experiments.
    weak: Does not record.
  followups:
  - What goes in the template?
  - When was it used again?
  common_errors:
  - 'Answering in the weak pattern: does not record'

- external_key: leadership.innovation.unexpected_benefit_of_failure
  competency_key: problem_solving
  topic: A failed attempt that taught something valuable
  difficulty: medium
  text: Describe an attempt that failed but led you to a better solution.
  expected_concepts:
  - original idea
  - failure
  - learning
  - new approach
  - result
  - sharing
  rubric:
    excellent: Describes the failure, the learning, the new approach and its result.
    good: Describes failure and new approach.
    weak: Gives a success-only story.
  followups:
  - What did the failure teach?
  - How did you pivot?
  common_errors:
  - 'Answering in the weak pattern: gives a success-only story'

- external_key: leadership.innovation.decision_between_two_promising_paths
  competency_key: leadership
  topic: Choosing between two options with little data
  difficulty: hard
  text: >-
    Two promising approaches each need a month to evaluate and you can afford only one. How do you decide?
  expected_concepts:
  - cheap tests
  - criteria
  - reversibility
  - opinions
  - time
  - deciding
  rubric:
    excellent: >-
      Looks for cheaper tests, applies criteria, considers reversibility and decides with stated assumptions.
    good: Chooses with reasoning.
    weak: Flips a coin.
  followups:
  - Which assumption mattered?
  - How did it turn out?
  common_errors:
  - 'Answering in the weak pattern: flips a coin'

- external_key: leadership.innovation.structured_learning_review
  competency_key: communication
  topic: Reviewing a year of experiments
  difficulty: hard
  text: >-
    Looking back over a year of improvement and experimentation work, how do you review what you learned?
  expected_concepts:
  - portfolio of tests
  - results
  - patterns
  - surprises
  - process improvements
  - sharing
  - planning
  rubric:
    excellent: >-
      Reviews patterns across experiments, identifies surprises, improves process and shares learning.
    good: Reviews results.
    weak: Does not review.
  followups:
  - What pattern did you find?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: does not review'

- external_key: leadership.innovation.teaching_experimentation_mindset
  competency_key: mentoring
  topic: Growing others' curiosity
  difficulty: hard
  text: >-
    How do you help team members develop a habit of forming hypotheses and testing them?
  expected_concepts:
  - modelling
  - asking for hypotheses
  - small safe tests
  - reviewing results
  - recognising learning
  - patience
  rubric:
    excellent: >-
      Models and asks for hypotheses, gives small safe tests, reviews and recognises learning.
    good: Encourages testing.
    weak: Gives answers.
  followups:
  - What was a good hypothesis?
  - How did you review?
  common_errors:
  - 'Answering in the weak pattern: gives answers'

- external_key: leadership.innovation.innovation_budget_negotiation
  competency_key: stakeholder_management
  topic: Funding exploration
  difficulty: hard
  text: >-
    How would you secure time or budget for exploratory work that has no guaranteed return?
  expected_concepts:
  - framing as bounded bets
  - stages
  - milestones
  - stopping rules
  - expected value
  - reporting
  rubric:
    excellent: Frames bounded bets with stages and stopping rules, reports and shows value.
    good: Asks for a limited budget.
    weak: Asks for open-ended time.
  followups:
  - What stopping rules did you set?
  - How did you report?
  common_errors:
  - 'Answering in the weak pattern: asks for open-ended time'

- external_key: leadership.innovation.innovation_during_a_crisis_period
  competency_key: leadership
  topic: Improving when under strain
  difficulty: hard
  text: >-
    Your team is under severe pressure but also needs to change how it works. How do you proceed?
  expected_concepts:
  - stabilising first
  - selecting a few changes
  - small scale
  - protecting capacity
  - involving the team
  - timing
  rubric:
    excellent: >-
      Stabilises, selects few high-value changes, protects capacity and involves the team.
    good: Makes a few changes.
    weak: Changes many things at once.
  followups:
  - What did you postpone?
  - What did you start first?
  common_errors:
  - 'Answering in the weak pattern: changes many things at once'

- external_key: leadership.innovation.open_source_and_community
  competency_key: collaboration
  topic: Learning from external communities
  difficulty: hard
  text: >-
    How have you used open source or external communities to improve how your team works or what it builds, and what did you
    give back?
  expected_concepts:
  - evaluating projects
  - contributing
  - governance
  - risk
  - learning
  - engagement
  rubric:
    excellent: >-
      Evaluates carefully, contributes back, manages risk and learns from community practices.
    good: Uses and sometimes contributes.
    weak: Only consumes.
  followups:
  - What did you contribute?
  - What risk did you manage?
  common_errors:
  - 'Answering in the weak pattern: only consumes'

- external_key: leadership.innovation.organisational_learning_system
  competency_key: leadership
  topic: Building learning systems
  difficulty: hard
  text: >-
    What systems would you build to ensure an organisation of fifty teams learns from its successes and failures?
  expected_concepts:
  - shared review formats
  - searchable repositories
  - communities
  - leadership forums
  - metrics
  - incentives
  - ownership
  rubric:
    excellent: >-
      Builds shared review formats, repositories, forums and incentives with ownership and metrics.
    good: Proposes forums and repositories.
    weak: Relies on informal sharing.
  followups:
  - What would you build first?
  - How do you measure uptake?
  common_errors:
  - 'Answering in the weak pattern: relies on informal sharing'

- external_key: leadership.innovation.weighing_user_harm_in_innovation
  competency_key: product_sense
  topic: When an idea has downsides for some users
  difficulty: hard
  text: >-
    A promising change benefits most users but makes things worse for some. How do you decide?
  expected_concepts:
  - size and severity of harm
  - who is affected
  - mitigations
  - alternatives
  - consultation
  - monitoring
  - transparency
  rubric:
    excellent: >-
      Assesses harm size and severity, designs mitigations, consults those affected and monitors.
    good: Considers harm and mitigates.
    weak: Ignores the minority.
  followups:
  - Who was affected?
  - What mitigation did you use?
  common_errors:
  - 'Answering in the weak pattern: ignores the minority'
