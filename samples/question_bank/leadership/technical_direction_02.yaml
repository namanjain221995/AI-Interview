# Curated questions: leadership round, technical direction (part 2 of 4). Build versus buy, boundaries, standards, technical debt, lock-in and multi-year platform decisions. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.technical_direction.architecture_for_newcomer
  competency_key: communication
  topic: Explaining a system's architecture to a newcomer
  difficulty: easy
  text: >-
    How do you explain the architecture of a system your team owns to someone who has just joined, so
    that they can start making good decisions in it?
  expected_concepts:
  - starting from what the system does for users
  - the main components and their boundaries
  - why key choices were made
  - known weak spots
  - where to find more
  rubric:
    excellent: >-
      Starts with purpose, shows main components and boundaries, explains the reasons behind key choices
      and known weak spots, and points to maintained documentation.
    good: Walks through components with some context.
    weak: Dumps detail without explaining why things are the way they are.
  followups:
  - What do you leave out at first?
  - How do you know they understood?
  common_errors:
  - Dumps detail without explaining why things are the way they are.

- external_key: leadership.technical_direction.adr_habit
  competency_key: communication
  topic: Recording architecture decisions
  difficulty: easy
  text: >-
    How do you capture technical decisions so that people can understand later why the system looks the
    way it does?
  expected_concepts:
  - short decision records
  - context and options considered
  - consequences and trade-offs
  - date and owner
  - stored near the code
  rubric:
    excellent: >-
      Describes short records with context, options, consequences and owner stored with the code, and
      an example of using one to avoid repeating a debate.
    good: Keeps notes or design docs with reasoning.
    weak: Relies on memory or chat history.
  followups:
  - When did a record save you time?
  - What makes the record too heavy?
  common_errors:
  - Relies on memory or chat history.

- external_key: leadership.technical_direction.boring_technology
  competency_key: leadership
  topic: Choosing proven technology
  difficulty: easy
  text: >-
    When is it right to choose a well-established technology over a newer one that looks better on paper?
  expected_concepts:
  - team familiarity
  - operating cost and maturity
  - fit to the problem
  - hiring and support
  - limited number of novel choices
  rubric:
    excellent: >-
      Weighs familiarity, maturity, operating cost and hiring, limits novelty to where it pays off, and
      gives an example from experience.
    good: Prefers proven options for stability with an example.
    weak: Chooses by novelty or by habit alone.
  followups:
  - When did you pick the newer one?
  - How many new things can a project absorb?
  common_errors:
  - Chooses by novelty or by habit alone.

- external_key: leadership.technical_direction.read_before_deciding
  competency_key: problem_solving
  topic: Understanding existing code before changing direction
  difficulty: easy
  text: >-
    Before you propose a change in direction for a system you didn't write, what do you do to understand
    it?
  expected_concepts:
  - reading key code paths
  - looking at incidents and change history
  - talking to long-standing owners
  - running or observing it
  - checking assumptions
  rubric:
    excellent: >-
      Reads code paths, history and incidents, talks to owners, observes it running and checks assumptions
      before proposing.
    good: Reads the code and asks the team.
    weak: Proposes direction from outside knowledge only.
  followups:
  - What did you learn that changed your proposal?
  - Whom did you talk to?
  common_errors:
  - Proposes direction from outside knowledge only.

- external_key: leadership.technical_direction.keeping_design_current
  competency_key: ownership
  topic: Keeping design documents useful
  difficulty: easy
  text: Design documents often go stale. What do you do to keep them useful?
  expected_concepts:
  - keeping them short
  - linking to code
  - assigning owners
  - updating at changes
  - marking outdated sections
  rubric:
    excellent: >-
      Keeps documents short and linked, assigns owners, updates at decision points and marks outdated
      parts, showing a habit that works.
    good: Updates documents during major changes.
    weak: Writes documents once and leaves them.
  followups:
  - Which documents do you not maintain?
  - How do you retire old ones?
  common_errors:
  - Writes documents once and leaves them.

- external_key: leadership.technical_direction.build_vs_buy
  competency_key: stakeholder_management
  topic: Deciding whether to build or buy
  difficulty: medium
  text: >-
    Your team could build a capability itself or buy it. Walk me through how you decide.
  expected_concepts:
  - how core the capability is to the product
  - total cost over time
  - integration and lock-in
  - speed to value
  - exit options
  rubric:
    excellent: >-
      Evaluates how core it is, total cost including maintenance, integration and lock-in, speed and exit
      options, and shows a decision with reasons and outcome.
    good: Compares cost and time with sensible criteria.
    weak: Defaults to building or buying without analysis.
  followups:
  - What was the hidden cost?
  - How did you plan an exit?
  common_errors:
  - Counting only the initial build or licence cost.

- external_key: leadership.technical_direction.language_choice
  competency_key: leadership
  topic: Choosing a language or framework for a new service
  difficulty: medium
  text: >-
    A team wants to build a new service in a language the organisation doesn't use yet. How do you evaluate
    that request?
  expected_concepts:
  - the problem it solves
  - operational support and tooling
  - hiring and learning
  - interoperability
  - precedent for other teams
  rubric:
    excellent: >-
      Looks at the problem it solves, support and tooling, hiring and learning, interoperability and the
      precedent it sets, with a clear decision process.
    good: Weighs benefits and costs and consults the team.
    weak: Refuses new languages on principle or allows everything.
  followups:
  - What would convince you?
  - How do you limit sprawl?
  common_errors:
  - Refuses new languages on principle or allows everything.

- external_key: leadership.technical_direction.rewrite_vs_refactor
  competency_key: leadership
  topic: Rewriting versus improving a system
  difficulty: medium
  text: >-
    A team argues for rewriting an old system from scratch. How do you decide between a rewrite and gradual
    improvement?
  expected_concepts:
  - what is actually wrong with the system
  - business value delivered in the meantime
  - risk of losing hidden behaviour
  - incremental alternatives
  - cost and time evidence
  rubric:
    excellent: >-
      Identifies what is wrong, compares incremental options with a rewrite on value, risk and hidden
      behaviour, and decides with evidence and checkpoints.
    good: Prefers incremental improvement with reasons.
    weak: Agrees to a rewrite for cleanliness or rejects it by reflex.
  followups:
  - What would justify a rewrite?
  - How do you protect hidden behaviour?
  common_errors:
  - Agrees to a rewrite for cleanliness or rejects it by reflex.

- external_key: leadership.technical_direction.service_boundaries
  competency_key: leadership
  topic: Drawing boundaries between services
  difficulty: medium
  text: >-
    How do you decide where to draw boundaries between services or modules in a growing system?
  expected_concepts:
  - business capabilities and ownership
  - change patterns
  - data ownership
  - team structure
  - cost of cross-boundary calls
  rubric:
    excellent: >-
      Uses business capabilities, change patterns, data ownership and team structure and considers the
      cost of crossing boundaries, with an example including a boundary they corrected.
    good: Splits by function with some reasoning.
    weak: Splits by technical layer or by fashion.
  followups:
  - Which boundary did you get wrong?
  - How do you handle shared data?
  common_errors:
  - Splits by technical layer or by fashion.

- external_key: leadership.technical_direction.technology_radar
  competency_key: leadership
  topic: Keeping a view of which technologies to use
  difficulty: medium
  text: >-
    How would you manage which technologies your teams are encouraged to use, trial, hold or retire?
  expected_concepts:
  - clear categories
  - evidence from real use
  - lightweight review
  - team input
  - regular updates
  rubric:
    excellent: >-
      Defines categories, bases them on real use, keeps review lightweight, gathers team input and updates
      regularly.
    good: Maintains a list with some review.
    weak: Leaves choices entirely to individuals or locks the list down.
  followups:
  - How do you add something new?
  - How do you retire a technology?
  common_errors:
  - Leaves choices entirely to individuals or locks the list down.

- external_key: leadership.technical_direction.reviewing_others_designs
  competency_key: mentoring
  topic: Giving useful design review
  difficulty: medium
  text: >-
    How do you review another team's design so that it improves the result without taking it over?
  expected_concepts:
  - understanding the goals first
  - asking questions
  - focusing on risks and irreversible choices
  - distinguishing must-fix from suggestions
  - following up
  rubric:
    excellent: >-
      Understands the goals, asks questions, focuses on risk and irreversible choices, separates must-fix
      from suggestions and follows up.
    good: Gives feedback on main concerns.
    weak: Rewrites the design in the review or nitpicks.
  followups:
  - What is an example of must-fix?
  - How do you give feedback to a senior author?
  common_errors:
  - Rewrites the design in the review or nitpicks.

- external_key: leadership.technical_direction.tech_debt_portfolio
  competency_key: ownership
  topic: Managing technical debt across many systems
  difficulty: medium
  text: >-
    There is technical debt across many systems. How do you decide which to address and which to live
    with?
  expected_concepts:
  - cost of the debt in delivery or risk
  - likelihood of future change
  - effort to fix
  - opportunistic versus planned fixes
  - making debt visible
  rubric:
    excellent: >-
      Rates debt by cost, change likelihood and effort, mixes opportunistic and planned fixes, and keeps
      a visible register.
    good: Prioritises the most painful items.
    weak: Tries to fix everything or ignores it.
  followups:
  - What did you decide to live with?
  - How do you make it visible?
  common_errors:
  - Tries to fix everything or ignores it.

- external_key: leadership.technical_direction.data_store_choice
  competency_key: leadership
  topic: Choosing a data store for a new need
  difficulty: medium
  text: >-
    A team asks to adopt a new type of database for a particular use. How do you decide whether to allow
    it?
  expected_concepts:
  - access patterns and requirements
  - whether existing stores can meet them
  - operating burden
  - backup and recovery
  - skills and support
  rubric:
    excellent: >-
      Clarifies access patterns and requirements, checks if existing stores suffice, assesses operating
      burden, backup and skills, and sets conditions.
    good: Evaluates requirements and operations.
    weak: Allows it for the feature or refuses to consider.
  followups:
  - What conditions did you set?
  - Who operates it?
  common_errors:
  - Allows it for the feature or refuses to consider.

- external_key: leadership.technical_direction.open_source_dependency_risk
  competency_key: leadership
  topic: Managing risk from open-source dependencies
  difficulty: medium
  text: >-
    Your products depend on many open-source libraries. What direction would you set for managing the
    risk?
  expected_concepts:
  - inventory
  - vulnerability and licence scanning
  - update policy
  - criteria for adopting a library
  - contributing back or replacing neglected ones
  rubric:
    excellent: >-
      Sets an inventory, scanning and update policy, adoption criteria, and a path to replace or support
      neglected dependencies.
    good: Introduces scanning and an update routine.
    weak: Adds libraries freely without tracking.
  followups:
  - How do you handle an unmaintained library?
  - How do you keep updates from piling up?
  common_errors:
  - Adds libraries freely without tracking.

- external_key: leadership.technical_direction.simplicity_vs_performance
  competency_key: problem_solving
  topic: Trading simplicity against performance
  difficulty: medium
  text: >-
    An engineer proposes a more complex design to gain performance you don't yet need. How do you respond?
  expected_concepts:
  - asking for measured need
  - cost in complexity
  - time to revisit
  - simplest design that meets targets
  - instruments to detect when it matters
  rubric:
    excellent: >-
      Asks for evidence of the need, weighs complexity cost, chooses the simplest design meeting targets
      and adds measurement to revisit.
    good: Prefers simplicity unless evidence says otherwise.
    weak: Approves optimisation by default or rejects it without a look.
  followups:
  - What data would convince you?
  - How do you keep the door open?
  common_errors:
  - Optimising before a measured need exists.

- external_key: leadership.technical_direction.lockin_awareness
  competency_key: stakeholder_management
  topic: Judging vendor lock-in
  difficulty: medium
  text: >-
    How do you decide how much vendor lock-in is acceptable when choosing a cloud or SaaS service?
  expected_concepts:
  - value gained from the specific service
  - switching cost estimate
  - abstraction layers and their cost
  - contract terms
  - exit plan
  rubric:
    excellent: >-
      Compares value gained with estimated switching cost, avoids over-abstracting, reads contract terms
      and documents an exit plan.
    good: Accepts some lock-in with reasons.
    weak: Avoids all lock-in or ignores it.
  followups:
  - What exit plan did you write?
  - Where did abstraction cost too much?
  common_errors:
  - Avoids all lock-in or ignores it.

- external_key: leadership.technical_direction.api_standards
  competency_key: leadership
  topic: Setting shared interface standards
  difficulty: medium
  text: >-
    Several teams design their own interfaces in different ways. How do you drive more consistency without
    stifling them?
  expected_concepts:
  - guidelines with reasons
  - examples and templates
  - review at design time
  - automated checks
  - allowing justified exceptions
  rubric:
    excellent: >-
      Provides guidelines with reasons, templates, design-time review and automated checks, and allows
      justified exceptions.
    good: Writes guidelines and reviews.
    weak: Mandates a detailed standard with no exceptions.
  followups:
  - How do you handle an exception?
  - What did you automate?
  common_errors:
  - Mandates a detailed standard with no exceptions.

- external_key: leadership.technical_direction.three_year_platform
  competency_key: leadership
  topic: Setting a multi-year platform direction
  difficulty: hard
  text: >-
    You are asked to set the technical platform direction for the next three years. How do you go about
    it?
  expected_concepts:
  - understanding business direction and constraints
  - current pain and strengths
  - principles and a target shape
  - phased roadmap with value early
  - review points
  rubric:
    excellent: >-
      Starts with business direction, assesses pain and strengths, sets principles and target shape, phases
      the roadmap for early value and sets review points.
    good: Sets a target and roadmap with consultation.
    weak: Chooses technologies without business context.
  followups:
  - What principles did you set?
  - How did you phase it?
  common_errors:
  - Chooses technologies without business context.

- external_key: leadership.technical_direction.senior_engineers_disagree
  competency_key: leadership
  topic: Senior engineers who disagree on direction
  difficulty: hard
  text: >-
    Two highly respected engineers disagree about a major technical direction, and each has a following.
    How do you resolve it?
  expected_concepts:
  - clarifying the decision and criteria
  - written arguments
  - an experiment if feasible
  - naming a decider
  - commitment afterwards
  rubric:
    excellent: >-
      Clarifies the decision and criteria, gets written arguments, runs an experiment where feasible,
      names a decider and secures commitment.
    good: Facilitates a discussion and decides.
    weak: Avoids deciding or sides by seniority.
  followups:
  - How did each respond to the result?
  - What if you were the decider and unsure?
  common_errors:
  - Avoids deciding or sides by seniority.

- external_key: leadership.technical_direction.hypergrowth_architecture
  competency_key: leadership
  topic: Architecture during rapid growth
  difficulty: hard
  text: >-
    Your product's usage is growing fast and the architecture is straining. How do you decide what to
    fix now and what to defer?
  expected_concepts:
  - finding the bottlenecks with data
  - fixing the ones that threaten growth soon
  - accepting limits elsewhere
  - capacity planning
  - protecting delivery
  rubric:
    excellent: >-
      Finds bottlenecks with data, fixes those that threaten near-term growth, defers others consciously,
      plans capacity and protects delivery.
    good: Fixes the main bottlenecks and monitors.
    weak: Rebuilds everything or waits for failures.
  followups:
  - How did you find the bottleneck?
  - What did you consciously defer?
  common_errors:
  - Rebuilds everything or waits for failures.

- external_key: leadership.technical_direction.central_or_federated
  competency_key: leadership
  topic: Centralising versus federating technical ownership
  difficulty: hard
  text: >-
    Should shared technical capabilities be centrally owned or left to each team? How do you decide, and
    how do you revisit it?
  expected_concepts:
  - cost of duplication versus cost of coordination
  - maturity of the capability
  - team autonomy
  - support model
  - review as conditions change
  rubric:
    excellent: >-
      Weighs duplication against coordination, considers maturity, autonomy and support, and reviews as
      conditions change, with an example of changing course.
    good: Chooses based on duplication and consistency.
    weak: Applies a fixed preference regardless of context.
  followups:
  - When did you change your answer?
  - What does a central team owe its users?
  common_errors:
  - Applies a fixed preference regardless of context.

- external_key: leadership.technical_direction.ai_features_architecture
  competency_key: leadership
  topic: Adding machine learning features into an existing architecture
  difficulty: hard
  text: >-
    Product wants to add AI-powered features to an established system. How do you shape the architecture
    and the decisions around it?
  expected_concepts:
  - separating experimental from core paths
  - data access and privacy
  - evaluation and monitoring
  - fallback behaviour
  - cost control
  rubric:
    excellent: >-
      Separates experimental from core paths, controls data access and privacy, plans evaluation and monitoring,
      ensures fallbacks and controls costs.
    good: Integrates through a clear interface with monitoring.
    weak: Embeds the feature directly in core paths without fallbacks.
  followups:
  - What is the fallback?
  - How do you evaluate quality?
  common_errors:
  - Embeds the feature directly in core paths without fallbacks.

- external_key: leadership.technical_direction.resilience_investment_case
  competency_key: stakeholder_management
  topic: Justifying investment in resilience
  difficulty: hard
  text: >-
    How do you justify to the business a major investment in resilience whose benefit is mostly the absence
    of future incidents?
  expected_concepts:
  - quantifying past incident costs
  - stating risk exposure
  - defining measurable targets
  - staged investment
  - reporting on results
  rubric:
    excellent: >-
      Quantifies past incident costs and exposure, sets measurable targets, stages investment and reports
      results.
    good: Uses incident history and a plan.
    weak: Argues resilience matters in general.
  followups:
  - What numbers persuaded?
  - What do you report after?
  common_errors:
  - Argues resilience matters in general.

- external_key: leadership.technical_direction.consolidating_stacks_after_merger
  competency_key: leadership
  topic: Consolidating technology after companies combine
  difficulty: hard
  text: >-
    Two companies have combined, each with a different technology stack. How do you decide what to consolidate
    and in what order?
  expected_concepts:
  - inventory and overlap
  - business priorities
  - cost of running both
  - risk and customer impact
  - sequencing
  rubric:
    excellent: >-
      Builds an inventory, maps overlap and business priority, compares running costs and risks, sequences
      with customer impact in mind.
    good: Picks the main overlaps and consolidates.
    weak: Chooses one stack wholesale.
  followups:
  - What did you leave alone?
  - How did you decide the order?
  common_errors:
  - Chooses one stack wholesale.

- external_key: leadership.technical_direction.deprecating_old_technology
  competency_key: project_management
  topic: Retiring a technology the organisation has outgrown
  difficulty: medium
  text: >-
    An older framework or platform is still used in many places but is becoming a liability. How do you
    set direction for retiring it?
  expected_concepts:
  - quantifying the liability
  - finding where it is used
  - offering a migration path
  - sequencing by risk
  - setting an end date and support level in the meantime
  rubric:
    excellent: >-
      Quantifies the liability, inventories use, provides a migration path, sequences by risk and sets
      an end date with interim support.
    good: Plans a migration and communicates a date.
    weak: Declares it deprecated without a path or owner.
  followups:
  - How did you find all the usage?
  - What happened to teams that were late?
  common_errors:
  - Declares it deprecated without a path or owner.
