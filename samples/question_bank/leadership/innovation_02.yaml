# Curated questions: leadership round, innovation (part 2 of 4).
# Focus: innovation and continuous improvement, experimentation and learning culture. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.innovation.making_time_for_improvement
  competency_key: project_management
  topic: Finding time for improvement work
  difficulty: easy
  text: How do you find time for improvement work when the team is busy with delivery?
  expected_concepts:
  - reserving a share of capacity
  - small steps
  - linking to delivery pain
  - showing value
  - protecting the time
  rubric:
    excellent: >-
      Reserves capacity or links improvements to delivery pain, protects the time and shows the value.
    good: Fits improvements in when possible.
    weak: Says there is no time.
  followups:
  - What percentage do you reserve?
  - How do you protect it?
  common_errors:
  - 'Answering in the weak pattern: says there is no time'

- external_key: leadership.innovation.documenting_what_you_learn
  competency_key: communication
  topic: Capturing lessons
  difficulty: easy
  text: How do you capture what your team learns so others don't have to learn it again?
  expected_concepts:
  - short write-ups
  - searchable place
  - lessons from incidents and projects
  - sharing sessions
  - reuse
  rubric:
    excellent: Writes short, findable lessons, shares them and shows that they were reused.
    good: Writes some lessons.
    weak: Lets lessons stay in people's heads.
  followups:
  - Where do you store them?
  - When was one reused?
  common_errors:
  - 'Answering in the weak pattern: lets lessons stay in people''s heads'

- external_key: leadership.innovation.encouraging_team_ideas
  competency_key: culture_values
  topic: Getting ideas from the team
  difficulty: easy
  text: >-
    How do you encourage everyone on your team to bring ideas and not just the usual few?
  expected_concepts:
  - asking directly
  - low-effort ways to suggest
  - responding to every idea
  - trying small ones
  - crediting contributors
  rubric:
    excellent: >-
      Uses several ways to collect ideas, responds to all, trials small ones and credits contributors.
    good: Invites ideas in meetings.
    weak: Relies on volunteers.
  followups:
  - Which quiet person's idea did you try?
  - How do you respond to ideas you reject?
  common_errors:
  - 'Answering in the weak pattern: relies on volunteers'

- external_key: leadership.innovation.hack_day
  competency_key: culture_values
  topic: Dedicated time to explore
  difficulty: easy
  text: >-
    Have you run or taken part in a hack day or exploration time? What came out of it?
  expected_concepts:
  - purpose and rules
  - time boxing
  - sharing results
  - follow-up on promising ideas
  - recognition
  - avoiding waste
  rubric:
    excellent: Describes setup, outputs and follow-through of promising results.
    good: Describes the event and some outcomes.
    weak: Nothing came of it.
  followups:
  - What did you follow up?
  - What did you change for next time?
  common_errors:
  - 'Answering in the weak pattern: nothing came of it'

- external_key: leadership.innovation.measuring_improvement
  competency_key: statistics_experimentation
  topic: Knowing a change helped
  difficulty: easy
  text: >-
    How do you tell whether a change you made to your team's process actually improved things?
  expected_concepts:
  - baseline before the change
  - a clear measure
  - time to see effect
  - feedback from the team
  - avoiding conclusions from one data point
  rubric:
    excellent: >-
      Takes a baseline, picks a clear measure, waits for evidence, collects feedback and avoids over-reading.
    good: Compares before and after.
    weak: Relies on a feeling.
  followups:
  - What measure did you choose?
  - When were you wrong?
  common_errors:
  - 'Answering in the weak pattern: relies on a feeling'

- external_key: leadership.innovation.making_ideas_visible
  competency_key: communication
  topic: Writing a proposal
  difficulty: medium
  text: >-
    How do you write up an improvement proposal so that busy people understand and support it?
  expected_concepts:
  - problem first
  - evidence
  - proposal and options
  - cost and risk
  - the ask
  - success measures
  rubric:
    excellent: >-
      Leads with the problem and evidence, offers options with costs, asks clearly and defines success.
    good: Writes a clear proposal.
    weak: Starts with the solution.
  followups:
  - What was the ask?
  - How did readers respond?
  common_errors:
  - 'Answering in the weak pattern: starts with the solution'

- external_key: leadership.innovation.improving_delivery_flow
  competency_key: project_management
  topic: Speeding up delivery
  difficulty: medium
  text: >-
    Describe how you found and removed the main source of delay in your team's delivery pipeline. What was it and what did
    you change?
  expected_concepts:
  - finding the constraint
  - measuring
  - small changes
  - results
  - team involvement
  - sustaining
  rubric:
    excellent: >-
      Finds the constraint with data, makes targeted changes and shows measured results and sustainability.
    good: Improves flow with some measures.
    weak: Asks people to work faster.
  followups:
  - What was the bottleneck?
  - What was the result?
  common_errors:
  - 'Answering in the weak pattern: asks people to work faster'

- external_key: leadership.innovation.learning_from_incidents_improvement
  competency_key: problem_solving
  topic: Turning failures into improvement
  difficulty: medium
  text: Describe an improvement that came directly from an incident or a failure.
  expected_concepts:
  - understanding contributing factors
  - designing the fix
  - investment decision
  - implementing
  - measuring
  - sharing
  rubric:
    excellent: Moves from contributing factors to a designed fix, measures and shares it.
    good: Implements a sensible fix.
    weak: Only patches the symptom.
  followups:
  - What contributing factor was surprising?
  - How did you measure?
  common_errors:
  - 'Answering in the weak pattern: only patches the symptom'

- external_key: leadership.innovation.innovation_metrics
  competency_key: statistics_experimentation
  topic: Measuring innovation work
  difficulty: medium
  text: How do you know that your team's innovation efforts are worthwhile?
  expected_concepts:
  - leading and lagging measures
  - experiments run
  - adoption
  - business outcomes
  - avoiding vanity measures
  - review
  rubric:
    excellent: >-
      Uses a few leading and lagging measures, avoids vanity metrics and reviews value.
    good: Tracks some outcomes.
    weak: Counts ideas.
  followups:
  - What did you stop measuring?
  - What did the data show?
  common_errors:
  - 'Answering in the weak pattern: counts ideas'

- external_key: leadership.innovation.making_space_for_dissent
  competency_key: culture_values
  topic: Useful challenge of ideas
  difficulty: medium
  text: >-
    How do you invite challenge of new ideas without discouraging the people proposing them?
  expected_concepts:
  - structure for critique
  - criteria
  - focus on idea
  - encouraging improvement
  - thanking
  - decision transparency
  rubric:
    excellent: >-
      Uses a structured critique with criteria that focuses on ideas, thanks proposers and explains decisions.
    good: Invites constructive challenge.
    weak: Lets critics dominate.
  followups:
  - What structure did you use?
  - How did proposers react?
  common_errors:
  - 'Answering in the weak pattern: lets critics dominate'

- external_key: leadership.innovation.cross_functional_innovation
  competency_key: collaboration
  topic: Working with other functions on new ideas
  difficulty: medium
  text: >-
    Describe an innovation that needed people from other functions. How did you bring them in?
  expected_concepts:
  - shared problem
  - early involvement
  - roles
  - regular contact
  - shared success measures
  - credit
  rubric:
    excellent: >-
      Frames a shared problem, involves others early, clarifies roles and shares credit.
    good: Works with other functions.
    weak: Builds alone and presents later.
  followups:
  - Who was hardest to engage?
  - What did each function gain?
  common_errors:
  - 'Answering in the weak pattern: builds alone and presents later'

- external_key: leadership.innovation.scaling_a_successful_pilot
  competency_key: project_management
  topic: Moving from pilot to standard
  difficulty: medium
  text: A pilot worked in one team. How do you roll it out to others?
  expected_concepts:
  - why it worked
  - context differences
  - support
  - champions
  - phases
  - measures
  - adapting
  rubric:
    excellent: >-
      Understands why it worked, adapts to context, supports teams, phases rollout and measures.
    good: Rolls out with support.
    weak: Mandates it everywhere.
  followups:
  - What differed between teams?
  - What failed to scale?
  common_errors:
  - 'Answering in the weak pattern: mandates it everywhere'

- external_key: leadership.innovation.idea_ownership
  competency_key: ownership
  topic: Seeing an idea through
  difficulty: medium
  text: >-
    Tell me about taking an idea from suggestion to being part of how the team works every day.
  expected_concepts:
  - building support
  - first version
  - early adopters
  - feedback
  - handover
  - maintenance
  - measuring
  rubric:
    excellent: >-
      Builds support, ships a first version, gathers feedback, hands over and measures its use.
    good: Sees the idea through to adoption.
    weak: Drops it after the first version.
  followups:
  - Who maintains it now?
  - What was the hardest stage?
  common_errors:
  - 'Answering in the weak pattern: drops it after the first version'

- external_key: leadership.innovation.responding_to_new_technology_wave
  competency_key: adaptability
  topic: A fast-moving technology shift
  difficulty: medium
  text: >-
    A new technology shifts quickly and your team has to decide how to respond. How do you approach it?
  expected_concepts:
  - understanding relevance
  - small experiments
  - skill building
  - risk management
  - stakeholder communication
  - avoiding hype
  rubric:
    excellent: >-
      Assesses relevance, runs small experiments, builds skills, manages risk and avoids hype.
    good: Experiments and builds skills.
    weak: Ignores it or adopts everywhere.
  followups:
  - What did you try first?
  - What did you decide not to do?
  common_errors:
  - 'Answering in the weak pattern: ignores it or adopts everywhere'

- external_key: leadership.innovation.continuous_learning_for_yourself
  competency_key: adaptability
  topic: Your own learning
  difficulty: medium
  text: >-
    How do you keep your own skills current as a leader, and how has it changed your decisions?
  expected_concepts:
  - sources
  - practice
  - peers
  - reflection
  - applying
  - examples of changes
  rubric:
    excellent: Describes habits and a concrete decision changed by learning.
    good: Describes some habits.
    weak: Relies on past knowledge.
  followups:
  - What did you learn recently?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: relies on past knowledge'

- external_key: leadership.innovation.experimentation_ethics
  competency_key: statistics_experimentation
  topic: Responsible experiments
  difficulty: medium
  text: >-
    When you run experiments that involve users, what do you do to make sure they are conducted responsibly?
  expected_concepts:
  - user impact
  - consent and transparency where appropriate
  - limiting harm
  - monitoring
  - stopping rules
  - privacy
  rubric:
    excellent: >-
      Considers user impact, limits harm, monitors and sets stopping rules, and respects privacy.
    good: Considers risk to users.
    weak: Experiments without thought to impact.
  followups:
  - What stopping rule did you set?
  - What did you avoid testing?
  common_errors:
  - 'Answering in the weak pattern: experiments without thought to impact'

- external_key: leadership.innovation.ab_test_misread
  competency_key: statistics_experimentation
  topic: A test result that misled
  difficulty: medium
  text: >-
    Tell me about an experiment result that turned out to be misleading. How did you find out?
  expected_concepts:
  - what the result showed
  - what was wrong
  - checking
  - correcting
  - informing
  - process change
  rubric:
    excellent: >-
      Describes the misleading result, how it was discovered, corrected and the process change.
    good: Finds and corrects the error.
    weak: Cannot recall an example.
  followups:
  - What caused the error?
  - What did you tell stakeholders?
  common_errors:
  - 'Answering in the weak pattern: cannot recall an example'

- external_key: leadership.innovation.managing_innovation_team_dynamics
  competency_key: people_management
  topic: Leading people on risky work
  difficulty: hard
  text: >-
    People on risky exploratory work can feel discouraged when most ideas fail. How do you keep the team effective?
  expected_concepts:
  - setting expectations
  - celebrating learning
  - progress markers
  - rotating
  - stakeholder protection
  - career recognition
  rubric:
    excellent: >-
      Sets expectations, defines progress markers, recognises learning in careers and protects the team.
    good: Encourages and recognises effort.
    weak: Measures only successful outcomes.
  followups:
  - How did you recognise learning in reviews?
  - How did you protect them?
  common_errors:
  - 'Answering in the weak pattern: measures only successful outcomes'

- external_key: leadership.innovation.scaling_experimentation_platform
  competency_key: system_design
  topic: Building experimentation capability
  difficulty: hard
  text: >-
    Your organisation wants experimentation to be routine across teams. What do you put in place?
  expected_concepts:
  - platform and tooling
  - training
  - statistical guidance
  - review process
  - governance of risk
  - culture
  - ownership
  rubric:
    excellent: >-
      Provides tooling, training and statistical guidance, reviews and governance, and shows broader adoption.
    good: Provides tools and training.
    weak: Provides only a tool.
  followups:
  - What mistakes did teams make?
  - How did you review experiments?
  common_errors:
  - 'Answering in the weak pattern: provides only a tool'

- external_key: leadership.innovation.disagreement_on_evidence
  competency_key: statistics_experimentation
  topic: Teams read the same results differently
  difficulty: hard
  text: >-
    Two groups interpret the same experiment results differently and each wants a different decision. How do you resolve it?
  expected_concepts:
  - agree on the question
  - examine data quality
  - limits of the data
  - additional test
  - decision rule
  - decision owner
  rubric:
    excellent: >-
      Agrees the question, examines data quality and limits, proposes an additional test or rule and gets a decision.
    good: Reviews data together.
    weak: Chooses the preferred reading.
  followups:
  - What was the difference in reading?
  - What did you decide?
  common_errors:
  - 'Answering in the weak pattern: chooses the preferred reading'

- external_key: leadership.innovation.protecting_long_term_work
  competency_key: leadership
  topic: Defending improvement when pressure rises
  difficulty: hard
  text: >-
    Under delivery pressure leaders want to cut all improvement work. How do you handle it?
  expected_concepts:
  - showing the cost of cutting
  - minimal protected work
  - link to risk and speed
  - negotiating
  - review after
  rubric:
    excellent: Shows cost of cutting with evidence, protects a minimum, negotiates and reviews.
    good: Argues for protecting some work.
    weak: Drops it entirely.
  followups:
  - What did you protect?
  - How did you show the cost?
  common_errors:
  - 'Answering in the weak pattern: drops it entirely'

- external_key: leadership.innovation.measuring_long_horizon_returns
  competency_key: statistics_experimentation
  topic: Valuing slow benefits
  difficulty: hard
  text: >-
    How do you assess an improvement whose benefits appear only after a year or more?
  expected_concepts:
  - leading indicators
  - milestones
  - assumptions
  - periodic review
  - stakeholder expectations
  - decision to continue
  rubric:
    excellent: >-
      Defines leading indicators and milestones, states assumptions and reviews periodically.
    good: Tracks milestones.
    weak: Waits for the end result.
  followups:
  - What leading indicator did you use?
  - When did you review?
  common_errors:
  - 'Answering in the weak pattern: waits for the end result'

- external_key: leadership.innovation.handling_competing_innovations
  competency_key: leadership
  topic: Too many bets
  difficulty: hard
  text: >-
    Your team has several promising ideas and capacity for one. How do you choose and what do you tell the others?
  expected_concepts:
  - criteria
  - evidence
  - strategic fit
  - effort
  - explaining
  - keeping ideas alive
  - sponsors
  rubric:
    excellent: >-
      Uses explicit criteria, explains decisions, keeps ideas for later and treats proposers well.
    good: Chooses by criteria.
    weak: Chooses by preference.
  followups:
  - How did you tell the others?
  - What happened to the other ideas?
  common_errors:
  - 'Answering in the weak pattern: chooses by preference'

- external_key: leadership.innovation.external_partnerships
  competency_key: stakeholder_management
  topic: Innovating with partners
  difficulty: hard
  text: >-
    You want to innovate jointly with a partner or customer. How do you structure it?
  expected_concepts:
  - shared goals
  - ownership of results
  - intellectual property considerations
  - communication
  - milestones
  - exit
  rubric:
    excellent: Aligns goals, clarifies ownership and rights, sets milestones and an exit.
    good: Sets goals and milestones.
    weak: Starts without agreement.
  followups:
  - What did you agree up front?
  - What went wrong?
  common_errors:
  - 'Answering in the weak pattern: starts without agreement'

- external_key: leadership.innovation.reuse_vs_reinvent
  competency_key: system_design
  topic: Resisting reinvention
  difficulty: hard
  text: >-
    Teams in your organisation keep building their own versions of similar things. How do you balance autonomy with reuse?
  expected_concepts:
  - understanding why
  - shared components
  - discoverability
  - incentives
  - contribution model
  - trade-offs
  rubric:
    excellent: >-
      Understands why teams reinvent, improves discoverability and incentives and sets a contribution model.
    good: Promotes reuse.
    weak: Mandates reuse.
  followups:
  - Why did teams reinvent?
  - What did you provide?
  common_errors:
  - 'Answering in the weak pattern: mandates reuse'
