# Leadership: decision making under uncertainty and incomplete data (part 1 of 4).
# Focus: judging when there is enough information, time-boxing analysis, assumptions, tripwires,
# small experiments, conflicting signals and deciding without precedent. Answers are evaluated only
# on the content of the example: reasoning, actions, outcomes and reflection.
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager, product_manager]
  round_types: [leadership]
  kind: leadership
questions:
  # ------------------------------------------------- knowing when you know enough
  - external_key: leadership.decisions_uncertainty.enough_to_act
    competency_key: leadership
    topic: Judging when you have enough information to act
    difficulty: easy
    text: >-
      Think of a recent decision you made for your team before every question was answered. How did you
      judge that you had learned enough to go ahead, and what were you still unsure about when you did?
    expected_concepts:
      - the decision and why it could not wait
      - what was known versus unknown at the time
      - an explicit threshold or test for "enough"
      - the remaining risk they accepted
      - how the outcome compared with expectations
    rubric:
      excellent: Names a real decision, separates known facts from open questions and explains a deliberate threshold for acting, including the residual risk they knowingly accepted and how it played out.
      good: Gives a clear example and a reasonable rationale for acting, with some awareness of what was still uncertain.
      weak: Describes a decision with no real uncertainty, or cannot say how they decided they knew enough.
    followups:
      - What extra piece of information would have changed your mind?
      - Looking back, did you wait too long or not long enough?
    common_errors:
      - Choosing an example where all the facts were already available.

  - external_key: leadership.decisions_uncertainty.timebox_analysis
    competency_key: leadership
    topic: Time-boxing analysis before a decision
    difficulty: medium
    text: >-
      Tell me about a time you deliberately put a time limit on investigation or analysis so a decision
      would get made. How did you set that limit, and what happened when the time ran out?
    expected_concepts:
      - cost of delay that justified the time box
      - how the duration was chosen
      - what the team focused on inside the time box
      - the decision made at the deadline
      - follow-up once more was learned
    rubric:
      excellent: Explains the cost of waiting, how they sized the time box, how they focused the investigation on the questions that mattered most and how the decision held up afterwards.
      good: Describes a time box that led to a decision, with some reasoning about why it was needed.
      weak: Describes an arbitrary deadline with no link to the decision, or the decision kept slipping anyway.
    followups:
      - What did you deliberately leave uninvestigated?
      - How did the team react to being cut off?
    common_errors:
      - Confusing a project deadline with a decision time box.

  - external_key: leadership.decisions_uncertainty.surfacing_assumptions
    competency_key: leadership
    topic: Making assumptions explicit
    difficulty: medium
    text: >-
      When you make a call with incomplete data, how do you make the assumptions behind it visible to the
      team? Walk me through a specific decision where you did this.
    expected_concepts:
      - listing the key assumptions explicitly
      - ranking assumptions by impact and uncertainty
      - where the assumptions were recorded
      - who owned checking each one
      - what happened when an assumption proved wrong
    rubric:
      excellent: Shows a concrete practice of writing assumptions down, ranking them, assigning owners to validate the riskiest ones and adjusting when one failed.
      good: Gives an example where assumptions were stated and shared, with some follow-through.
      weak: Assumptions stayed in their head or are described only in general terms.
    followups:
      - Which assumption was most fragile, and how did you test it?
      - Who on the team challenged one of your assumptions?
    common_errors:
      - Treating assumptions as facts once the decision was made.

  - external_key: leadership.decisions_uncertainty.tripwires
    competency_key: leadership
    topic: Setting tripwires to revisit a decision
    difficulty: hard
    text: >-
      Describe a decision you made under uncertainty where you agreed in advance on the signals that would
      make you revisit it. What were those signals, and did any of them fire?
    expected_concepts:
      - decision and its main uncertainty
      - specific, measurable tripwire conditions
      - how the signals were monitored and by whom
      - pre-agreed response when a tripwire fired
      - outcome and what it taught them
    rubric:
      excellent: Describes measurable tripwires defined before acting, a monitoring owner and a pre-agreed response, and explains what actually happened, including a revisit if one fired.
      good: Describes conditions for revisiting a decision, though somewhat loosely defined or monitored.
      weak: Only revisited the decision when something went visibly wrong, with no signals set in advance.
    followups:
      - How did you pick thresholds that were neither too sensitive nor too lax?
      - What would you have done if two signals disagreed?
    common_errors:
      - Describing a general review meeting rather than specific triggers.
      - Tripwires that nobody actually watched.

  - external_key: leadership.decisions_uncertainty.cheap_experiment
    competency_key: leadership
    topic: Running a cheap experiment to reduce uncertainty
    difficulty: medium
    text: >-
      Tell me about a time you chose to run a small spike, prototype or experiment instead of debating a
      decision further. How did you design it so the result would actually settle the question?
    expected_concepts:
      - the question the experiment had to answer
      - success and failure criteria set before running it
      - keeping cost and scope small
      - how the result changed or confirmed the decision
      - avoiding the prototype becoming production by accident
    rubric:
      excellent: Frames the experiment around one decisive question, agrees on what result would mean what before running it, keeps it cheap and shows how the result drove the decision.
      good: Describes a useful experiment that informed the decision, with some upfront criteria.
      weak: The experiment had no clear question or criteria, or its result was ignored.
    followups:
      - What result would have made you choose the other option?
      - How did you stop the experiment from growing in scope?
    common_errors:
      - Running an experiment whose outcome would not change the decision.

  - external_key: leadership.decisions_uncertainty.conflicting_signals
    competency_key: leadership
    topic: Deciding when the data points in different directions
    difficulty: hard
    text: >-
      Tell me about a decision where the evidence you had pointed in different directions, for example usage
      data saying one thing and customer feedback or expert opinion saying another. How did you work out
      what to do?
    expected_concepts:
      - the conflicting sources and what each suggested
      - assessing the quality and bias of each source
      - looking for an explanation that reconciles them
      - choosing and stating which evidence carried more weight
      - how the decision turned out
    rubric:
      excellent: Examines why the sources disagreed, weighs their reliability explicitly, seeks a reconciling explanation or extra signal and explains a reasoned choice with its outcome.
      good: Acknowledges the conflict and makes a sensible choice with some reasoning about which source to trust.
      weak: Picks the source that matched their preference without examining why the evidence conflicted.
    followups:
      - What did the source you discounted turn out to be telling you?
      - How did you explain your choice to people who trusted the other evidence?
    common_errors:
      - Averaging the signals instead of understanding the disagreement.

  - external_key: leadership.decisions_uncertainty.no_precedent
    competency_key: leadership
    topic: A decision with no precedent to follow
    difficulty: medium
    text: >-
      Describe a decision you had to make where neither you nor your organisation had done anything similar
      before. How did you build enough understanding to choose a direction?
    expected_concepts:
      - why the situation was genuinely new
      - finding analogies or outside expertise
      - breaking the problem into knowable and unknowable parts
      - choosing a reversible first step
      - what they learned and applied later
    rubric:
      excellent: Explains how they borrowed analogies or expertise, separated what could be learned quickly from what could not and chose a first step that kept options open, with a clear outcome.
      good: Describes a reasonable approach to a new situation and a sensible decision.
      weak: Example is not really novel, or the approach was to wait for someone else to decide.
    followups:
      - Who outside your team did you learn from?
      - Which part did you get most wrong?
    common_errors:
      - Describing a routine decision as unprecedented.

  - external_key: leadership.decisions_uncertainty.proxy_metrics
    competency_key: product_sense
    topic: Using proxies when the real data does not exist yet
    difficulty: medium
    text: >-
      Suppose you need to decide whether to invest further in a feature, but the outcome you care about,
      say retention, won't show up in the data for months. How would you decide what to do in the meantime?
    expected_concepts:
      - leading indicators linked to the real outcome
      - evidence that the proxy actually predicts the outcome
      - qualitative signals such as user interviews
      - a checkpoint when the real data arrives
      - risk of optimising the proxy rather than the goal
    rubric:
      excellent: Proposes specific leading indicators, explains how to check they relate to the true outcome, combines them with qualitative evidence and sets a checkpoint to recalibrate when real data arrives.
      good: Suggests sensible proxy metrics and some plan to revisit the decision later.
      weak: Proposes waiting for the full data, or picks proxies with no link to the outcome.
    followups:
      - How would you know if your proxy was misleading you?
      - What would make you stop investing before the real data arrived?
    common_errors:
      - Treating vanity metrics such as page views as proxies for retention.

  - external_key: leadership.decisions_uncertainty.gut_versus_data
    competency_key: leadership
    topic: Weighing experience-based judgement against thin data
    difficulty: medium
    text: >-
      Tell me about a time your experience told you one thing but the limited data you had suggested
      another. Which did you follow, and how did you decide?
    expected_concepts:
      - what their experience suggested and why
      - what the data showed and its limitations
      - testing the intuition explicitly
      - the decision and how it was explained
      - result and how it calibrated their judgement
    rubric:
      excellent: Articulates the pattern behind their intuition, critiques the data's limits fairly, finds a way to test one against the other and reflects on how the result recalibrated their judgement.
      good: Explains the tension and a reasoned decision, with some reflection on the outcome.
      weak: Dismisses either intuition or data without reasoning, or offers no real example.
    followups:
      - How often has your intuition been right in similar situations?
      - What would have convinced you to go the other way?
    common_errors:
      - Presenting intuition as unexplainable rather than describing the pattern behind it.

  - external_key: leadership.decisions_uncertainty.value_of_information
    competency_key: leadership
    topic: Deciding whether more information is worth the wait
    difficulty: hard
    text: >-
      Your team could gather more data before a significant decision, but doing so would delay the work by a
      few weeks. Walk me through how you would decide whether that extra information is worth the delay.
    expected_concepts:
      - which unknown the data would resolve
      - whether the data could change the decision
      - cost of delay in concrete terms
      - cost of being wrong and how reversible the choice is
      - partial options such as proceeding while collecting data
    rubric:
      excellent: Asks whether the new information could realistically change the choice, compares the cost of delay with the cost of a wrong decision and its reversibility, and considers ways to proceed in parallel.
      good: Weighs delay against risk sensibly, with some attention to reversibility.
      weak: Defaults to always waiting for data or always moving fast, without weighing the specifics.
    followups:
      - Give me an example where you decided the data wasn't worth waiting for.
      - How would you explain the choice to a stakeholder who wanted certainty?
    common_errors:
      - Collecting data that could not change the decision.

  - external_key: leadership.decisions_uncertainty.decision_deadline_imposed
    competency_key: leadership
    topic: Deciding to an externally imposed deadline
    difficulty: easy
    text: >-
      Tell me about a time someone else set the deadline for a decision you owned, and it came before you
      felt ready. How did you approach it?
    expected_concepts:
      - the deadline and why it was fixed
      - prioritising the most important open questions
      - making the best decision possible in the time
      - communicating the risks that remained
      - outcome
    rubric:
      excellent: Describes how they focused limited time on the questions that mattered most, made a clear call by the deadline and stated the remaining risks and a plan to address them.
      good: Met the deadline with a reasonable decision and some communication of risk.
      weak: Missed the deadline, asked for repeated extensions without justification or hid the open risks.
    followups:
      - What did you decide not to look into?
      - Did you push back on the deadline, and how?
    common_errors:
      - Describing only the time pressure without the decision itself.

  - external_key: leadership.decisions_uncertainty.framing_options
    competency_key: leadership
    topic: Framing the real options before deciding
    difficulty: medium
    text: >-
      When a decision is unclear, how do you make sure you are choosing between the right options and not
      just the first two that came up? Give me an example from your own work.
    expected_concepts:
      - restating the underlying goal or problem
      - generating more than two options
      - including a do-nothing or hybrid option
      - criteria for comparing options
      - how the final option differed from the initial framing
    rubric:
      excellent: Shows a concrete habit of reframing the goal, widening the option set including hybrids and doing nothing, and comparing options against explicit criteria, with an example where this changed the outcome.
      good: Describes considering several options with some criteria.
      weak: Only ever compares two options as presented, or gives a generic process without an example.
    followups:
      - Which option did someone else add that you had missed?
      - How do you stop the option list from becoming endless?
    common_errors:
      - Treating option generation as a formality after the choice is already made.

  - external_key: leadership.decisions_uncertainty.biggest_unknown_first
    competency_key: leadership
    topic: Attacking the riskiest unknown first
    difficulty: medium
    text: >-
      On a project with a lot of unknowns, how do you decide which uncertainty to tackle first? Tell me about
      a project where that choice mattered.
    expected_concepts:
      - listing the unknowns
      - ranking them by impact and how cheaply they can be resolved
      - sequencing work to retire the biggest risk early
      - what the early work revealed
      - effect on the overall plan
    rubric:
      excellent: Ranks unknowns by impact and cost to resolve, sequences work to retire the riskiest one early and shows how what they learned reshaped the plan.
      good: Identifies the main risk and tackles it early with a reasonable result.
      weak: Starts with the easiest or most visible work and discovers the critical unknown late.
    followups:
      - What did the team have to postpone to do that first?
      - Was there an unknown you chose to live with?
    common_errors:
      - Front-loading comfortable work and calling it progress.

  - external_key: leadership.decisions_uncertainty.facts_versus_opinions
    competency_key: communication
    topic: Separating facts from opinions in a decision discussion
    difficulty: easy
    text: >-
      In a discussion where people are arguing about what to do and the data is thin, how do you help the
      group separate what is known from what people believe? Tell me about a time you did this.
    expected_concepts:
      - asking for the evidence behind claims
      - capturing facts, assumptions and opinions separately
      - giving each viewpoint a fair hearing
      - turning disagreement into questions that can be checked
      - the decision that resulted
    rubric:
      excellent: Describes a concrete technique for separating facts, assumptions and opinions, turning disagreements into checkable questions and reaching a clearer decision as a result.
      good: Helped the group clarify what was known and move toward a decision.
      weak: Let the loudest view win, or cannot describe how the discussion was structured.
    followups:
      - How did people react when their claim was labelled an assumption?
      - What did you do with the questions nobody could answer?
    common_errors:
      - Treating seniority as evidence.

  - external_key: leadership.decisions_uncertainty.outside_expertise
    competency_key: leadership
    topic: Seeking outside expertise for an unfamiliar decision
    difficulty: easy
    text: >-
      Tell me about a decision in an area you didn't know well where you brought in someone with more
      expertise. How did you use their input without simply handing them the decision?
    expected_concepts:
      - recognising the gap in their own knowledge
      - choosing the right expert and the right questions
      - testing the advice against their context
      - keeping ownership of the final call
      - outcome and what they learned
    rubric:
      excellent: Explains how they framed specific questions for the expert, tested the advice against their own constraints and kept clear ownership of the decision and its outcome.
      good: Sought relevant expertise and used it sensibly in their decision.
      weak: Either ignored available expertise or deferred entirely and disowned the result.
    followups:
      - Where did you disagree with the expert, and why?
      - What did you learn that you now apply yourself?
    common_errors:
      - Describing delegation of the decision rather than use of expertise.

  - external_key: leadership.decisions_uncertainty.ambiguous_problem_definition
    competency_key: leadership
    topic: Deciding when the problem itself is unclear
    difficulty: hard
    text: >-
      Describe a situation where your team was asked to solve a problem that nobody could define clearly,
      for example "make the platform more reliable" or "improve engagement". How did you turn that into
      decisions the team could act on?
    expected_concepts:
      - investigating what the request really meant
      - defining a measurable target or hypothesis
      - agreeing the definition with stakeholders
      - choosing an initial scope and deferring the rest
      - revisiting the definition as they learned
    rubric:
      excellent: Shows how they investigated the real need, proposed a measurable definition, got stakeholder agreement on it, scoped a first increment and adjusted the definition as evidence came in.
      good: Turned the vague request into a concrete plan with some stakeholder alignment.
      weak: Started building against their own interpretation without checking it, or waited for clearer instructions.
    followups:
      - Who disagreed with your definition, and how did you handle it?
      - What would have happened if you had started building immediately?
    common_errors:
      - Equating activity with progress on an undefined goal.

  - external_key: leadership.decisions_uncertainty.sampling_users
    competency_key: product_sense
    topic: Deciding from a small number of customer conversations
    difficulty: medium
    text: >-
      Imagine you've spoken to five customers about a possible change and they're split. You have to decide
      this week whether the team builds it. How would you approach that decision?
    expected_concepts:
      - recognising the small sample and its bias
      - understanding why customers split, not just counting votes
      - checking for other evidence such as usage or support data
      - sizing the cost and reversibility of building
      - a small or staged option to learn more
    rubric:
      excellent: Looks beneath the split to understand which customers and needs differ, adds other evidence, weighs cost and reversibility and proposes a staged option to learn more while moving forward.
      good: Treats the sample with appropriate caution and reaches a sensible decision.
      weak: Counts votes, or claims the decision cannot be made without a large survey.
    followups:
      - Which customer would you weigh most heavily, and why?
      - What would you build first to learn the most?
    common_errors:
      - Treating a handful of interviews as statistically decisive.

  - external_key: leadership.decisions_uncertainty.estimating_impact_range
    competency_key: leadership
    topic: Estimating impact as a range, not a point
    difficulty: medium
    text: >-
      When you're deciding whether a piece of work is worth doing and you can't predict its impact precisely,
      how do you estimate it? Tell me about a decision where you did this.
    expected_concepts:
      - estimating a range or best and worst cases
      - stating the drivers behind the range
      - checking whether the decision changes across the range
      - narrowing the range with cheap data where useful
      - comparing estimate with actual outcome
    rubric:
      excellent: Uses ranges or scenarios, identifies what drives the spread, checks whether the decision holds across the range and later compares the estimate with what actually happened.
      good: Gives a reasoned estimate with some acknowledgement of uncertainty.
      weak: Relies on a single number presented as certain, or declines to estimate at all.
    followups:
      - How wide was your range compared with what really happened?
      - How did stakeholders respond to a range rather than a number?
    common_errors:
      - False precision in impact estimates.

  - external_key: leadership.decisions_uncertainty.missing_key_person
    competency_key: ownership
    topic: Deciding when the person with context is unavailable
    difficulty: easy
    text: >-
      Tell me about a time a decision needed to be made and the person with the most context was unavailable.
      What did you do?
    expected_concepts:
      - urgency of the decision
      - gathering context from other sources
      - making a proportionate, reversible call
      - recording the reasoning for the absent person
      - follow-up when they returned
    rubric:
      excellent: Gathers what context they can, makes a proportionate decision that limits irreversible effects, documents the reasoning and closes the loop with the absent person afterwards.
      good: Made a sensible decision and informed the right people later.
      weak: Stalled the work unnecessarily, or made a large irreversible call without recording why.
    followups:
      - What did that person say when they came back?
      - What would you have needed to see to wait instead?
    common_errors:
      - Waiting by default even when the cost of delay was high.

  - external_key: leadership.decisions_uncertainty.prioritising_without_data
    competency_key: product_sense
    topic: Prioritising a backlog with little usage data
    difficulty: medium
    text: >-
      Suppose you take over a product area that has almost no analytics and a long backlog of requests. How
      would you decide what the team works on first?
    expected_concepts:
      - talking to users, support and sales for qualitative signal
      - a simple scoring approach with stated assumptions
      - adding minimal instrumentation early
      - picking early work that also produces learning
      - revisiting priorities as data arrives
    rubric:
      excellent: Combines qualitative sources with a transparent prioritisation method, invests early in basic instrumentation, picks first items that both deliver value and teach something, and plans a revisit.
      good: Proposes a reasonable way to prioritise using available signals.
      weak: Works through the backlog in order received, or waits to build analytics before prioritising anything.
    followups:
      - What instrumentation would you add first, and why?
      - How would you handle a loud stakeholder pushing one request?
    common_errors:
      - Spending months on analytics before delivering anything.

  - external_key: leadership.decisions_uncertainty.decision_under_scope_change
    competency_key: leadership
    topic: Recommitting when requirements are still moving
    difficulty: hard
    text: >-
      Tell me about a time requirements kept shifting while your team was mid-build, and you had to decide
      whether to pause, push on with the current plan or change direction. How did you make that call?
    expected_concepts:
      - understanding why requirements were moving
      - assessing what was stable versus volatile
      - options considered and their costs
      - the decision and how scope was protected
      - effect on delivery and stakeholders
    rubric:
      excellent: Diagnoses the source of the churn, separates stable from volatile parts, weighs pausing, continuing and pivoting explicitly and explains a decision that protected delivery, with its outcome.
      good: Made a reasonable decision about how to continue, with some analysis of the options.
      weak: Absorbed every change without deciding anything, or froze the work without addressing the cause.
    followups:
      - What did you build that you knew might be thrown away?
      - How did you get the requirement owners to settle anything?
    common_errors:
      - Blaming stakeholders for change without describing their own decision.

  - external_key: leadership.decisions_uncertainty.signal_or_noise
    competency_key: leadership
    topic: Deciding whether a worrying signal is real
    difficulty: medium
    text: >-
      Tell me about a time an early warning sign appeared, like a dip in a metric or a few complaints, and you
      had to decide whether it was real or noise before acting. How did you decide?
    expected_concepts:
      - the signal and what it might mean
      - checking normal variation or baselines
      - looking for corroborating evidence
      - cost of acting versus cost of ignoring it
      - decision and how it turned out
    rubric:
      excellent: Compares the signal with baselines, looks for independent corroboration, weighs the costs of overreacting and underreacting and explains a decision whose outcome they followed up.
      good: Investigated the signal sensibly before deciding.
      weak: Either reacted to every blip or ignored the signal until it became a crisis.
    followups:
      - How long were you willing to watch before acting?
      - What would you change about how that signal was monitored?
    common_errors:
      - Ignoring normal variation when interpreting a single data point.

  - external_key: leadership.decisions_uncertainty.partial_commitment
    competency_key: leadership
    topic: Committing in stages instead of all at once
    difficulty: hard
    text: >-
      Describe a large decision where you chose to commit in stages, with checkpoints, rather than make one
      big commitment upfront. How did you structure the stages, and what did you learn at each one?
    expected_concepts:
      - why a single upfront commitment was too risky
      - defining stages and the question each answered
      - go or no-go criteria at each checkpoint
      - resources released stage by stage
      - outcome including any stage where they changed course
    rubric:
      excellent: Explains why staging reduced risk, defines what each stage needed to prove with clear go or no-go criteria and shows how evidence at a checkpoint changed or confirmed the path.
      good: Describes a staged approach with checkpoints and a reasonable outcome.
      weak: Stages were only a delivery schedule with no decision points, or criteria were never applied.
    followups:
      - Did any checkpoint lead you to stop or change course?
      - How did you keep stakeholders from treating stage one as the full commitment?
    common_errors:
      - Calling phased delivery a staged decision when nothing could be cancelled.

  - external_key: leadership.decisions_uncertainty.uncertain_dependency
    competency_key: leadership
    topic: Planning around another team's uncertain delivery
    difficulty: medium
    text: >-
      Your plan depends on another team delivering something, and they can't tell you when it will be ready.
      How would you decide how to plan your own team's work?
    expected_concepts:
      - getting the best available estimate and its basis
      - identifying what can proceed independently
      - building a fallback or stub
      - a decision date for switching to the fallback
      - communicating the risk upward
    rubric:
      excellent: Extracts the best estimate and its drivers, sequences independent work first, prepares a fallback with a clear date for switching and keeps stakeholders informed of the dependency risk.
      good: Proposes a sensible plan with some contingency for the dependency.
      weak: Plans as if the dependency will arrive on time, or stops work until it does.
    followups:
      - What would a good fallback look like in your last project?
      - How would you decide the date to switch to plan B?
    common_errors:
      - Waiting passively on the other team.
