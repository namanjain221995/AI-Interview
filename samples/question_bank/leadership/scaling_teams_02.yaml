# Curated questions: leadership round, scaling teams (part 2 of 4).
# Focus: scaling teams and organisations, team topology and ownership boundaries. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.scaling_teams.hiring_plan_basics
  competency_key: people_management
  topic: Planning hiring for a growing team
  difficulty: easy
  text: >-
    How do you work out how many people and what skills your team needs to hire over the next year?
  expected_concepts:
  - roadmap demand
  - current capacity and skill gaps
  - attrition
  - hiring lead times
  - budget
  - stakeholder agreement
  rubric:
    excellent: >-
      Links the plan to roadmap and skill gaps, accounts for attrition and lead time, and agrees it with stakeholders.
    good: Works out reasonable numbers from the roadmap.
    weak: Asks for more people without analysis.
  followups:
  - What did you leave out?
  - How did you check the plan later?
  common_errors:
  - 'Answering in the weak pattern: asks for more people without analysis'

- external_key: leadership.scaling_teams.first_line_support_for_new_leads
  competency_key: leadership
  topic: Helping new leads
  difficulty: easy
  text: >-
    When you add a new tech lead or manager as the team grows, what support do you give them?
  expected_concepts:
  - clear expectations
  - regular coaching
  - shared context
  - early small wins
  - a peer group
  - feedback on their work
  rubric:
    excellent: >-
      Sets expectations, coaches regularly, shares context, and creates peer support, with the new lead succeeding.
    good: Gives some guidance and coaching.
    weak: Leaves them to learn alone.
  followups:
  - What did they struggle with?
  - What would you do earlier next time?
  common_errors:
  - 'Answering in the weak pattern: leaves them to learn alone'

- external_key: leadership.scaling_teams.written_team_documentation
  competency_key: communication
  topic: Documents that help a growing team
  difficulty: easy
  text: >-
    What do you write down as the team grows so that people don't depend on asking the same few individuals?
  expected_concepts:
  - ownership and contacts
  - architecture overviews
  - decision records
  - on-call guides
  - onboarding guide
  - upkeep
  rubric:
    excellent: >-
      Lists concrete documents, assigns upkeep, and shows reduced dependence on a few people.
    good: Writes several useful documents.
    weak: Relies on verbal explanation.
  followups:
  - Which document was used most?
  - How do you keep them current?
  common_errors:
  - 'Answering in the weak pattern: relies on verbal explanation'

- external_key: leadership.scaling_teams.one_to_one_load
  competency_key: people_management
  topic: Managing your own span
  difficulty: easy
  text: >-
    How many people can you manage well, and how did you know when your span of control was too wide?
  expected_concepts:
  - time needed for one-to-ones and feedback
  - type of work and seniority
  - signals of neglect
  - delegating to leads
  - adjusting structure
  rubric:
    excellent: >-
      Gives a reasoned span, signs they noticed such as missed one-to-ones, and the structural change they made.
    good: Gives a number with some reasoning.
    weak: Cannot say or claims unlimited capacity.
  followups:
  - What suffered first?
  - How did you fix it?
  common_errors:
  - 'Answering in the weak pattern: cannot say or claims unlimited capacity'

- external_key: leadership.scaling_teams.growing_shared_rituals
  competency_key: project_management
  topic: Adapting team rituals
  difficulty: easy
  text: How have you changed team rituals such as standups and planning as a team grew?
  expected_concepts:
  - purpose of each ritual
  - splitting or shortening
  - written updates replacing meetings
  - sub-team versions
  - review of value
  rubric:
    excellent: >-
      Reviews the purpose of each ritual, adapts or drops it, and shows time saved or better coordination.
    good: Adapts some rituals.
    weak: Keeps the same meetings.
  followups:
  - Which ritual did you drop?
  - How did people react?
  common_errors:
  - 'Answering in the weak pattern: keeps the same meetings'

- external_key: leadership.scaling_teams.growing_without_losing_culture
  competency_key: culture_values
  topic: Preserving good habits as you grow
  difficulty: medium
  text: >-
    What working habits do you want to preserve as a team grows, and how do you pass them on to new people?
  expected_concepts:
  - naming the habits
  - examples and stories
  - onboarding
  - leaders modelling
  - reviewing
  - adapting when needed
  rubric:
    excellent: >-
      Names specific habits, teaches them in onboarding, models them, and adapts those that no longer work.
    good: Describes some habits and how they were shared.
    weak: Assumes habits will spread alone.
  followups:
  - Which habit did you let go?
  - How did you teach it?
  common_errors:
  - 'Answering in the weak pattern: assumes habits will spread alone'

- external_key: leadership.scaling_teams.succession_for_team_lead
  competency_key: leadership
  topic: Preparing others to lead sub-teams
  difficulty: medium
  text: >-
    How have you prepared people to take over leadership of parts of the team as it was divided?
  expected_concepts:
  - identifying candidates
  - stretch assignments
  - shadowing
  - clear transition
  - support after the move
  - feedback
  rubric:
    excellent: >-
      Identifies and prepares candidates, supports the transition and reviews the result.
    good: Prepares candidates informally.
    weak: Appoints without preparation.
  followups:
  - Who did not get a lead role?
  - How did you support them?
  common_errors:
  - 'Answering in the weak pattern: appoints without preparation'

- external_key: leadership.scaling_teams.rebalancing_workload_between_teams
  competency_key: project_management
  topic: Moving work between teams
  difficulty: medium
  text: >-
    One team is overloaded while another has capacity. How do you rebalance without damaging ownership?
  expected_concepts:
  - understanding the causes
  - skills and context transfer
  - temporary loan or permanent move
  - agreeing with both leads
  - communication
  - review
  rubric:
    excellent: >-
      Understands the cause, chooses a temporary or permanent move, agrees with leads, and manages context transfer.
    good: Moves work after discussion.
    weak: Moves people without consultation.
  followups:
  - How did you handle context?
  - What did the overloaded team lose?
  common_errors:
  - 'Answering in the weak pattern: moves people without consultation'

- external_key: leadership.scaling_teams.shared_library_ownership
  competency_key: ownership
  topic: Owning shared code
  difficulty: medium
  text: >-
    Shared libraries and tools are used by many teams but nobody feels responsible. How do you fix that?
  expected_concepts:
  - assigning an owner team
  - contribution rules
  - review model
  - support expectations
  - funding time
  - deprecation policy
  rubric:
    excellent: >-
      Assigns an owner, defines contribution and support rules, funds the time, and shows improved health.
    good: Names an owner and rules.
    weak: Hopes volunteers will care.
  followups:
  - Who owns it now?
  - How do you fund the time?
  common_errors:
  - 'Answering in the weak pattern: hopes volunteers will care'

- external_key: leadership.scaling_teams.growing_hiring_manager_load
  competency_key: people_management
  topic: Managing hiring alongside delivery
  difficulty: medium
  text: >-
    How do you manage your own time between hiring and delivery during a heavy growth period?
  expected_concepts:
  - priorities
  - delegating screening
  - scheduled blocks
  - hiring plan limits
  - telling stakeholders the trade-off
  rubric:
    excellent: >-
      Plans time, delegates parts of the process, informs stakeholders of the trade-off and meets both goals reasonably.
    good: Manages time with some delegation.
    weak: Does everything personally.
  followups:
  - What did you delegate?
  - What slipped?
  common_errors:
  - 'Answering in the weak pattern: does everything personally'

- external_key: leadership.scaling_teams.inner_source
  competency_key: collaboration
  topic: Allowing contribution across teams
  difficulty: medium
  text: >-
    Have you enabled engineers from other teams to contribute to your codebase? How did you make that work?
  expected_concepts:
  - contribution guides
  - review standards
  - response times
  - ownership remains
  - recognition
  - tools
  rubric:
    excellent: >-
      Provides guides, review standards and quick responses, retains ownership, and recognises contributions.
    good: Opens the codebase with some guidance.
    weak: Says yes but ignores contributions.
  followups:
  - How fast did you review?
  - What went wrong?
  common_errors:
  - 'Answering in the weak pattern: says yes but ignores contributions'

- external_key: leadership.scaling_teams.organisational_change_communication
  competency_key: communication
  topic: Explaining a team restructure
  difficulty: medium
  text: >-
    How do you communicate a restructuring of teams so people understand why, what changes for them and what doesn't?
  expected_concepts:
  - reasons first
  - clarity on individual impact
  - timing
  - two-way questions
  - written follow-up
  - revisiting
  rubric:
    excellent: >-
      Explains reasons, impact and timing, invites questions, follows up in writing and checks understanding.
    good: Communicates the changes and listens.
    weak: Announces by email.
  followups:
  - What questions surprised you?
  - How did you follow up?
  common_errors:
  - 'Answering in the weak pattern: announces by email'

- external_key: leadership.scaling_teams.preventing_silos
  competency_key: collaboration
  topic: Avoiding silos in a bigger organisation
  difficulty: medium
  text: How do you keep teams from becoming silos as the organisation grows?
  expected_concepts:
  - shared goals
  - cross-team forums
  - rotations
  - shared standards
  - transparent roadmaps
  - recognition of collaboration
  rubric:
    excellent: >-
      Uses shared goals and forums, rotations and visible roadmaps, and shows collaboration actually increased.
    good: Uses forums and shared updates.
    weak: Considers silos unavoidable.
  followups:
  - Which mechanism helped most?
  - What would you drop?
  common_errors:
  - 'Answering in the weak pattern: considers silos unavoidable'

- external_key: leadership.scaling_teams.engineering_standards_scale
  competency_key: leadership
  topic: Shared standards across teams
  difficulty: medium
  text: >-
    How do you create shared engineering standards across many teams without removing their autonomy?
  expected_concepts:
  - minimal standards where they matter
  - involving teams in creating them
  - paved roads
  - exceptions process
  - review cycles
  rubric:
    excellent: >-
      Limits standards to where they matter, builds with teams, provides paved roads and an exceptions route.
    good: Sets standards with some consultation.
    weak: Mandates standards from above.
  followups:
  - Which standard met resistance?
  - How do you handle exceptions?
  common_errors:
  - 'Answering in the weak pattern: mandates standards from above'

- external_key: leadership.scaling_teams.attrition_in_growth
  competency_key: people_management
  topic: Retaining people during rapid growth
  difficulty: medium
  text: >-
    What did you do to keep your experienced people while the team was growing rapidly?
  expected_concepts:
  - understanding their needs
  - scope and growth opportunities
  - workload
  - recognition
  - involving them in hiring and design
  - listening
  rubric:
    excellent: >-
      Talks with experienced people, creates growth and involvement, manages load, and shows retention.
    good: Pays some attention to them.
    weak: Focuses only on new hires.
  followups:
  - Who left?
  - What did they say?
  common_errors:
  - 'Answering in the weak pattern: focuses only on new hires'

- external_key: leadership.scaling_teams.managing_a_manager
  competency_key: leadership
  topic: Coaching a new manager under you
  difficulty: medium
  text: A manager who reports to you is struggling with a larger team. What do you do?
  expected_concepts:
  - observing and gathering facts
  - asking about their view
  - clarifying expectations
  - coaching
  - adjusting scope
  - checking
  rubric:
    excellent: >-
      Gathers facts, asks about their view, sets clear expectations, coaches and adjusts scope if necessary.
    good: Offers coaching and support.
    weak: Takes over their team.
  followups:
  - What was the root issue?
  - When would you adjust scope?
  common_errors:
  - 'Answering in the weak pattern: takes over their team'

- external_key: leadership.scaling_teams.interface_agreements
  competency_key: collaboration
  topic: Agreements between teams
  difficulty: medium
  text: >-
    How do you set up agreements between teams on what they provide to each other, such as interfaces and response times?
  expected_concepts:
  - written service expectations
  - shared roadmap for changes
  - versioning and deprecation
  - escalation
  - regular review
  rubric:
    excellent: >-
      Writes expectations, plans changes jointly, defines versioning and escalation, and reviews regularly.
    good: Agrees expectations verbally and documents some.
    weak: Relies on goodwill.
  followups:
  - What did you put in the agreement?
  - What happened when it was broken?
  common_errors:
  - 'Answering in the weak pattern: relies on goodwill'

- external_key: leadership.scaling_teams.splitting_unclear_boundaries
  competency_key: system_design
  topic: Dividing a tangled domain
  difficulty: hard
  text: >-
    A domain is tangled and there are no obvious lines for splitting it between teams. How do you find boundaries?
  expected_concepts:
  - studying change patterns
  - mapping data and flows
  - talking with users
  - trial boundaries
  - interim shared ownership
  - evolving
  rubric:
    excellent: >-
      Uses change history and flows, tries boundaries with interim ownership, and adjusts based on evidence.
    good: Defines boundaries after analysis.
    weak: Splits by guesswork.
  followups:
  - What did the change history show?
  - What boundary moved later?
  common_errors:
  - 'Answering in the weak pattern: splits by guesswork'

- external_key: leadership.scaling_teams.ending_a_team
  competency_key: leadership
  topic: Closing down a team
  difficulty: hard
  text: >-
    You have to wind down a team whose work is no longer needed. How do you handle the work, the systems and the people?
  expected_concepts:
  - timeline
  - transfer of systems
  - redeployment options
  - fair communication
  - recognition
  - learning
  rubric:
    excellent: >-
      Plans transitions of systems and people, communicates fairly, finds roles for people and recognises their work.
    good: Handles systems and communicates.
    weak: Handles it abruptly.
  followups:
  - Where did the people go?
  - What did you transfer?
  common_errors:
  - 'Answering in the weak pattern: handles it abruptly'

- external_key: leadership.scaling_teams.manager_of_managers_transition
  competency_key: leadership
  topic: Becoming a leader of leaders
  difficulty: hard
  text: >-
    What changed for you when you moved from leading a team to leading several teams through other leaders?
  expected_concepts:
  - working through others
  - setting direction not tasks
  - trusting without hands-on checks
  - information flow
  - coaching leads
  - new measures of own success
  rubric:
    excellent: >-
      Describes the change in activities, new ways of gaining information, coaching of leads and what they got wrong at first.
    good: Describes the shift and some lessons.
    weak: Continues to manage individuals directly.
  followups:
  - What did you get wrong?
  - How do you keep in touch with the work?
  common_errors:
  - 'Answering in the weak pattern: continues to manage individuals directly'

- external_key: leadership.scaling_teams.unequal_team_performance
  competency_key: people_management
  topic: Different results from similar teams
  difficulty: hard
  text: >-
    Two similar teams have very different results. How do you find out why before you act?
  expected_concepts:
  - gathering data
  - observing
  - talking to both teams
  - checking context differences
  - testing hypotheses
  - sharing practices
  rubric:
    excellent: >-
      Gathers data and observations, compares contexts, tests hypotheses, shares practices and avoids simple blame.
    good: Compares the teams and talks to them.
    weak: Blames the lead of the weaker team.
  followups:
  - What was the cause?
  - What practice transferred?
  common_errors:
  - 'Answering in the weak pattern: blames the lead of the weaker team'

- external_key: leadership.scaling_teams.local_autonomy_vs_alignment
  competency_key: leadership
  topic: Balancing autonomy with alignment
  difficulty: hard
  text: >-
    How do you give teams autonomy while keeping them aligned as the organisation grows?
  expected_concepts:
  - clear goals
  - boundaries and guardrails
  - transparency
  - regular checkpoints
  - trust
  - review
  rubric:
    excellent: >-
      Sets clear goals and guardrails, shares information, checks in lightly and reviews.
    good: Delegates with goals.
    weak: Chooses either control or chaos.
  followups:
  - Where did you draw guardrails?
  - When did you step in?
  common_errors:
  - 'Answering in the weak pattern: chooses either control or chaos'

- external_key: leadership.scaling_teams.unifying_tooling
  competency_key: collaboration
  topic: Converging on shared tools
  difficulty: hard
  text: >-
    Different teams use different tools and processes. How do you decide whether to standardise and how do you do it?
  expected_concepts:
  - cost of variety
  - value of autonomy
  - evidence
  - involving teams
  - migration support
  - exceptions
  rubric:
    excellent: >-
      Weighs costs and autonomy, uses evidence, involves teams, supports migration and defines exceptions.
    good: Standardises where benefits are clear.
    weak: Mandates one tool without consultation.
  followups:
  - What did you leave alone?
  - How did you support migration?
  common_errors:
  - 'Answering in the weak pattern: mandates one tool without consultation'

- external_key: leadership.scaling_teams.executive_pushback_on_structure
  competency_key: stakeholder_management
  topic: Pushing back on a poor structure
  difficulty: hard
  text: >-
    An executive proposes an organisation structure that you believe will create heavy dependencies. How do you respond?
  expected_concepts:
  - understanding the goal
  - modelling the dependencies
  - alternatives
  - evidence
  - keeping the relationship
  - accepting the decision
  rubric:
    excellent: >-
      Understands the goal, shows dependency analysis, proposes alternatives, and accepts and mitigates if overruled.
    good: Raises concerns with some data.
    weak: Complies silently or resists openly.
  followups:
  - What did your analysis show?
  - What happened?
  common_errors:
  - 'Answering in the weak pattern: complies silently or resists openly'

- external_key: leadership.scaling_teams.engineering_managers_span_reset
  competency_key: people_management
  topic: Restructuring after a span problem
  difficulty: hard
  text: >-
    Managers have between twelve and eighteen direct reports and everyone is stretched. How do you restructure with minimal
    disruption?
  expected_concepts:
  - assessing impact
  - designing new teams
  - selecting leads
  - timing
  - communication
  - supporting managers
  - checking
  rubric:
    excellent: >-
      Assesses and designs the structure, selects leads fairly, times the change, communicates and checks results.
    good: Splits the groups sensibly.
    weak: Leaves spans as they are.
  followups:
  - How did you choose leads?
  - What disruption was unavoidable?
  common_errors:
  - 'Answering in the weak pattern: leaves spans as they are'
