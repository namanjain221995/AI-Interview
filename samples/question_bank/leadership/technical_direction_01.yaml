# Curated questions: leadership / technical direction (part 1).
# Decision mechanics: reversible versus hard-to-reverse decisions, decision rights, speed versus
# rigour, and committing under uncertainty. Evaluation is based on the content of the candidate's
# examples and reasoning only.
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager, product_manager]
  round_types: [leadership]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: leadership.technical_direction.hard_to_undo_example
    competency_key: leadership
    topic: A decision you knew would be hard to undo
    difficulty: easy
    text: >-
      Tell me about a technical decision you made that you knew at the time would be hard to undo. What made
      it hard to reverse, and how did that change the way you went about making it?
    expected_concepts:
      - what specifically made the decision costly to reverse (data, contracts, dependants, skills)
      - extra rigour applied, such as prototypes, wider review or more data
      - who was involved and why
      - outcome and whether the extra care paid off
    rubric:
      excellent: Names a concrete decision, explains precisely why it was hard to reverse, and describes deliberate extra steps such as a prototype or wider review that were proportionate to that cost, with a clear outcome.
      good: Gives a real example and explains why it was hard to undo, with some description of how the process differed from routine choices.
      weak: Gives a hypothetical or generic answer, or cannot say what made the decision different from any other.
    followups:
      - Looking back, was the extra care worth the time it took?
      - Was there anything you could have done to make it easier to reverse?
    common_errors:
      - Describing a decision that was actually easy to change and calling it irreversible.

  - external_key: leadership.technical_direction.fast_call_on_cheap_decision
    competency_key: leadership
    topic: Deciding quickly when a choice is cheap to change
    difficulty: easy
    text: >-
      Tell me about a time you deliberately made a technical decision quickly, with incomplete information,
      because you knew it would be easy to change later. How did it play out?
    expected_concepts:
      - why the decision was judged cheap to reverse
      - what information was deliberately not gathered
      - how the team was told the decision could be revisited
      - whether it was later changed and at what cost
    rubric:
      excellent: Describes a specific quick decision, explains the reasoning that it was cheap to reverse, shows how that was communicated, and reports what actually happened including any later change.
      good: Gives a real example of a quick decision and a reasonable explanation of why speed was acceptable.
      weak: Describes rushing a decision without any reasoning about reversibility, or cannot give an example.
    followups:
      - Did the decision turn out to be as easy to change as you expected?
      - How did you stop the quick choice from quietly becoming permanent?
    common_errors:
      - Treating speed as always good without explaining why this decision could tolerate it.

  - external_key: leadership.technical_direction.who_makes_the_call
    competency_key: leadership
    topic: Choosing who makes a technical decision
    difficulty: easy
    text: >-
      When a technical decision comes up on your team, how do you decide whether you make the call yourself,
      hand it to the engineer closest to the work, or bring it to the whole team?
    expected_concepts:
      - scope and blast radius of the decision
      - how hard it is to reverse
      - who has the most context
      - growth opportunity for the person closest to the work
      - making the decision owner explicit
    rubric:
      excellent: Gives clear criteria such as impact, reversibility, context and development value, illustrates them with examples, and makes the decision owner explicit to everyone involved.
      good: Gives sensible criteria for when to decide personally versus delegate, with at least one example.
      weak: Always decides personally or always seeks consensus, with no criteria for choosing.
    followups:
      - Tell me about a time you got that choice wrong.
      - How does the team know who owns a given decision?
    common_errors:
      - Never stating who the decision owner is, so decisions drift.

  - external_key: leadership.technical_direction.knowing_when_enough_information
    competency_key: leadership
    topic: Knowing when you have enough information to decide
    difficulty: easy
    text: >-
      How do you tell when you have enough information to make a technical decision, rather than continuing to
      research? Give me an example from your own work.
    expected_concepts:
      - cost of delay versus cost of being wrong
      - which unknowns would actually change the decision
      - time-boxing investigation
      - accepting residual uncertainty explicitly
    rubric:
      excellent: Explains how they identify the unknowns that would change the outcome, time-boxes research against the cost of delay, and gives a concrete example where they stopped researching and committed.
      good: Mentions time-boxing or cost of delay and gives a reasonable example.
      weak: Says they research until certain, or decides without any reasoning about what was unknown.
    followups:
      - What was still unknown when you decided, and did it matter later?
      - How did you explain the remaining uncertainty to the team?
    common_errors:
      - Equating more research with a better decision regardless of what the research could change.

  - external_key: leadership.technical_direction.explaining_decision_to_dissenters
    competency_key: communication
    topic: Communicating a decision to the team, including dissenters
    difficulty: easy
    text: >-
      After you make a significant technical decision, how do you explain it to your team so people understand
      the reasoning, including the ones who argued for a different option?
    expected_concepts:
      - stating the decision and the reasoning clearly
      - acknowledging the alternatives and their merits
      - what was traded away
      - conditions under which it would be revisited
      - a written record people can refer back to
    rubric:
      excellent: Describes stating the decision, reasoning and trade-offs plainly, acknowledging the strongest alternative fairly, naming when it would be revisited, and recording it in writing, with an example.
      good: Explains the reasoning to the team and acknowledges the alternatives.
      weak: Announces the decision without reasoning, or ignores the people who disagreed.
    followups:
      - How did the people who preferred the other option respond?
      - Where did the explanation live afterwards?
    common_errors:
      - Overstating the case for the chosen option and dismissing the alternatives.

  # ---------------------------------------------------------------- medium
  - external_key: leadership.technical_direction.keeping_an_escape_route
    competency_key: leadership
    topic: Building an escape route into a costly commitment
    difficulty: medium
    text: >-
      Think of a time you had to commit to something expensive to reverse, such as a database engine, a cloud
      service or the shape of a public API. What did you do to keep a way back open, and what did that cost you?
    expected_concepts:
      - abstraction or boundary around the committed choice
      - avoiding proprietary features where they were not needed
      - data export or migration path kept viable
      - explicit cost of the escape route (time, performance, features)
      - judgement about where the escape route was not worth it
    rubric:
      excellent: Describes concrete measures such as a boundary layer, portable data formats or limited use of proprietary features, quantifies what those measures cost, and explains where they chose not to pay for optionality.
      good: Describes at least one realistic measure to keep the decision reversible and acknowledges a cost.
      weak: Claims everything can be made reversible for free, or describes no actual measures.
    followups:
      - Did you ever need that escape route?
      - Where did you decide optionality was not worth paying for?
    common_errors:
      - Wrapping everything in abstractions without weighing the ongoing cost.

  - external_key: leadership.technical_direction.team_overdebating_cheap_choices
    competency_key: leadership
    topic: A team that over-deliberates on cheap decisions
    difficulty: medium
    text: >-
      Suppose your team spends weeks debating choices that could easily be changed later, like a logging library
      or how to lay out folders in the repository. How would you change the way they make those decisions?
    expected_concepts:
      - naming the decision as cheap to reverse
      - assigning a single owner with a short deadline
      - defaults or conventions that remove repeat debates
      - reserving deeper process for costly decisions
      - checking whether the debate hides a real underlying concern
    rubric:
      excellent: Proposes classifying decisions by reversibility, giving cheap decisions a single owner and a time limit, setting defaults to avoid repeat debates, and checks whether the debate is masking a deeper disagreement.
      good: Suggests time-boxing or a single owner for low-stakes decisions.
      weak: Simply imposes personal preferences, or lets the debates continue without any change.
    followups:
      - What if one engineer keeps reopening the decision after it's made?
      - How would you notice the debate was really about something bigger?
    common_errors:
      - Solving it by having the lead make every small decision personally.

  - external_key: leadership.technical_direction.missed_signs_of_one_way_door
    competency_key: ownership
    topic: A hard-to-reverse decision made too quickly
    difficulty: medium
    text: >-
      Tell me about a time a team you were on moved too quickly on a decision that turned out to be hard to undo.
      What signs were missed, and what would you put in place to catch that next time?
    expected_concepts:
      - the decision and why it proved costly to reverse
      - signals that were present but overlooked
      - the candidate's own part in what happened
      - concrete process or checklist changes afterwards
    rubric:
      excellent: Gives a specific example, identifies the overlooked signals precisely, owns their part in it, and describes concrete changes such as a review trigger for data model or contract changes.
      good: Gives a real example and describes a reasonable lesson or change.
      weak: Blames others entirely, or the lesson is only to be more careful.
    followups:
      - What did it eventually cost to live with or undo that decision?
      - Has the change you put in place caught anything since?
    common_errors:
      - Framing the problem as someone else's mistake with no personal reflection.

  - external_key: leadership.technical_direction.committing_to_teams_choice
    competency_key: leadership
    topic: Backing a direction you disagreed with
    difficulty: medium
    text: >-
      Tell me about a time you went ahead with a technical direction your team chose even though you personally
      disagreed with it. Why did you let it proceed, and how did you support it afterwards?
    expected_concepts:
      - why the decision was left with the team (reversibility, ownership, growth)
      - stating the disagreement openly before committing
      - fully supporting the chosen path afterwards
      - agreed checkpoints to review the outcome
      - what actually happened
    rubric:
      excellent: Explains why they chose not to override, voiced their concerns clearly beforehand, actively helped the chosen approach succeed and agreed a point to review it, and reflects on the result.
      good: Describes accepting the team's decision and supporting it, with some reasoning.
      weak: Describes passively going along, or undermining the decision later.
    followups:
      - How did it turn out compared with what you expected?
      - Where is the line for you between letting the team decide and stepping in?
    common_errors:
      - Saying "I told you so" afterwards or quietly working around the decision.

  - external_key: leadership.technical_direction.overruling_the_team
    competency_key: leadership
    topic: Overruling the team on a technical decision
    difficulty: medium
    text: >-
      Tell me about a time you overruled your team on a technical decision. What made you decide this one was
      yours to make, and how did you handle the people who disagreed?
    expected_concepts:
      - why the decision needed the lead's call (risk, irreversibility, cross-team impact)
      - hearing the team's arguments fully first
      - explaining the reasoning and trade-offs
      - following up with the people who disagreed
      - reflection on the outcome
    rubric:
      excellent: Gives a specific case, explains the criteria that made it their call, shows they engaged seriously with the team's arguments, explained the decision openly and followed up with dissenters, and reflects on whether it was right.
      good: Gives a real example with reasonable justification and some explanation to the team.
      weak: Overrules out of preference or seniority alone, or cannot explain why the decision was theirs.
    followups:
      - Looking back, were you right?
      - How often do you think a lead should do this?
    common_errors:
      - Justifying the override only by job title.

  - external_key: leadership.technical_direction.investing_in_shared_data_formats
    competency_key: leadership
    topic: Up-front effort on schemas and formats others consume
    difficulty: medium
    text: >-
      Stored data and event formats tend to outlive the code around them. When your team designs a schema or an
      event that other systems will consume, how do you decide how much effort to put in up front?
    expected_concepts:
      - number and type of consumers
      - evolution and versioning strategy
      - cost of migrating stored data later
      - reviewing with consumers before publishing
      - keeping internal details out of shared formats
    rubric:
      excellent: Ties the effort to how many consumers there are and how costly later migration would be, describes versioning and consumer review, and gives an example of a format decision that held up or did not.
      good: Recognises that shared formats need more care and mentions versioning or consumer input.
      weak: Treats shared schemas like internal code that can be changed at any time.
    followups:
      - Tell me about a format you'd design differently now.
      - How do you stop internal fields leaking into a shared event?
    common_errors:
      - Assuming consumers will update in step with every change.

  - external_key: leadership.technical_direction.abandon_criteria_up_front
    competency_key: ownership
    topic: Agreeing abandonment criteria before an experiment
    difficulty: medium
    text: >-
      When you start trying out a new technology or architecture approach, how do you agree up front on what
      result would make you drop it? Tell me about a time you actually used criteria like that.
    expected_concepts:
      - measurable success and failure criteria set before starting
      - a fixed time or budget for the trial
      - who decides at the end
      - acting on the result even when people are invested
    rubric:
      excellent: Describes setting measurable criteria and a time limit before starting, naming who decides, and gives an example where the criteria were applied, ideally including dropping something people liked.
      good: Mentions setting goals and a time limit for an experiment, with a real example.
      weak: Evaluates experiments only after the fact by impression, or never stops one.
    followups:
      - What happened when the results were ambiguous?
      - How did the people who championed it react to the decision?
    common_errors:
      - Moving the goalposts once the trial is under way.

  - external_key: leadership.technical_direction.paying_for_reversibility_case
    competency_key: stakeholder_management
    topic: Justifying time spent keeping a decision reversible
    difficulty: medium
    text: >-
      A product manager asks why the team wants an extra two weeks to keep a decision reversible, for example by
      putting your own interface in front of a vendor's service. How would you make the case, and when would you
      agree it isn't worth it?
    expected_concepts:
      - likelihood and cost of needing to switch
      - concrete scenarios such as price changes or vendor outages
      - quantifying the two weeks against future switching cost
      - willingness to drop the work if switching is unlikely
      - agreeing the decision jointly
    rubric:
      excellent: Frames the extra work as insurance with an estimated likelihood and payoff, uses concrete business scenarios, and clearly states conditions under which they would drop it, reaching a shared decision with the product manager.
      good: Explains the benefit in business terms and acknowledges it may not always be justified.
      weak: Argues purely on engineering principle, or concedes without weighing the risk.
    followups:
      - What numbers would you bring to that conversation?
      - What if the product manager still says no?
    common_errors:
      - Presenting optionality as always necessary without estimating its value.

  - external_key: leadership.technical_direction.architecture_call_under_time_pressure
    competency_key: leadership
    topic: An architecture call under real time pressure
    difficulty: medium
    text: >-
      Describe a time you had to make an important architecture call under real time pressure, for instance
      during an incident or ahead of a fixed launch. How did you decide, and what did you do afterwards to revisit it?
    expected_concepts:
      - narrowing to the options that fit the time available
      - preferring choices that were easier to undo
      - who was consulted given the time
      - recording the decision and its assumptions
      - scheduled revisit once pressure eased
    rubric:
      excellent: Gives a specific case, explains how they narrowed options and favoured reversible choices under the time limit, recorded assumptions, and later revisited the decision with a clear outcome.
      good: Describes a real time-pressured decision with sensible reasoning and some follow-up.
      weak: Describes the pressure but not how the decision was made, or never revisited it.
    followups:
      - What did you have to clean up later?
      - Who did you wish you had consulted?
    common_errors:
      - Leaving the temporary decision in place with no plan to review it.

  - external_key: leadership.technical_direction.decision_quality_versus_outcome
    competency_key: ownership
    topic: Judging a decision separately from its outcome
    difficulty: medium
    text: >-
      How do you judge whether a technical decision was a good one, separately from whether it happened to turn
      out well? Give me an example where those two didn't line up.
    expected_concepts:
      - evaluating the information and reasoning available at the time
      - role of luck and external factors
      - recording assumptions so they can be checked later
      - learning from good decisions with bad outcomes and vice versa
    rubric:
      excellent: Distinguishes process from outcome clearly, explains how recorded assumptions allow a fair review, and gives a concrete example of a sound decision with a poor result or a lucky one with a good result, with the lesson drawn.
      good: Understands the distinction and gives a reasonable example.
      weak: Judges decisions only by results, or cannot give an example.
    followups:
      - How do you stop a team from over-learning from one bad outcome?
      - What do you write down at decision time to make this easier later?
    common_errors:
      - Rewriting history to make every good outcome look like good judgement.

  - external_key: leadership.technical_direction.unsticking_a_deferred_decision
    competency_key: leadership
    topic: A decision the team kept putting off
    difficulty: medium
    text: >-
      Tell me about a technical decision your team kept putting off. What was the delay actually costing, and how
      did you get it unstuck?
    expected_concepts:
      - why the decision was stalled (missing owner, fear, missing data, conflict)
      - making the cost of delay visible
      - assigning an owner and a deadline
      - narrowing the decision or making part of it reversible
      - outcome after the decision was made
    rubric:
      excellent: Diagnoses why the decision was stuck, quantifies or clearly describes the cost of delay, and explains the specific moves such as owner, deadline or scoping down that broke the deadlock, with the result.
      good: Gives a real example and a reasonable way the decision was unblocked.
      weak: Describes the delay without any action, or forced a decision without understanding why it was stuck.
    followups:
      - Why do you think it had stalled in the first place?
      - What would you do differently if it happened again?
    common_errors:
      - Ignoring the root cause of the stall and simply setting a deadline.

  - external_key: leadership.technical_direction.consulting_without_a_vote
    competency_key: stakeholder_management
    topic: Gathering input without requiring consensus
    difficulty: medium
    text: >-
      How do you gather input from the people affected by a technical decision without turning it into a vote that
      needs everyone to agree? Walk me through a recent example.
    expected_concepts:
      - identifying affected parties early
      - clear statement of who decides and by when
      - structured way to collect concerns (written proposal, comment period)
      - showing how input changed or did not change the decision
      - closing the loop with contributors
    rubric:
      excellent: Describes making the decision owner and deadline explicit, collecting input in a structured way, showing how specific feedback shaped the result, and closing the loop with each group, using a concrete example.
      good: Describes seeking input and then deciding, with some communication back to contributors.
      weak: Either decides without consulting anyone or waits for unanimous agreement.
    followups:
      - How did you handle feedback you chose not to act on?
      - What if a key group did not respond in time?
    common_errors:
      - Collecting feedback but never telling people what happened to it.

  - external_key: leadership.technical_direction.product_promises_locking_tech
    competency_key: product_sense
    topic: Product commitments that lock in technical choices
    difficulty: medium
    text: >-
      How do you spot product commitments that quietly lock in technical choices, such as promising customers a
      particular export format or a guaranteed response time, before they are made?
    expected_concepts:
      - reviewing customer-facing commitments with engineering
      - recognising contractual and public promises as hard to reverse
      - keeping commitments at the level of outcomes rather than implementation
      - involving engineering early in roadmap and contract discussions
    rubric:
      excellent: Explains which kinds of commitments create lasting technical constraints, describes a concrete practice for catching them early, and gives an example where wording a commitment differently preserved flexibility.
      good: Recognises that some product promises constrain the system and mentions involving engineering early.
      weak: Treats product commitments and technical design as separate concerns.
    followups:
      - Tell me about a commitment that turned out to constrain the team later.
      - How would you reword a promise to keep more flexibility?
    common_errors:
      - Only discovering the constraint after the commitment is public.

  # ------------------------------------------------------------------ hard
  - external_key: leadership.technical_direction.proprietary_platform_commitment
    competency_key: leadership
    topic: Committing the core platform to proprietary services
    difficulty: hard
    text: >-
      Your company is considering moving its core data platform onto one cloud provider's proprietary services,
      which would speed up delivery but make leaving very expensive. How would you lead that decision, and who
      would you involve?
    expected_concepts:
      - realistic likelihood and cost of ever leaving
      - delivery speed and operating cost gained
      - which components to commit fully and which to keep portable
      - involving finance, security, legal and product leadership
      - documented decision with conditions for review
    rubric:
      excellent: Frames the decision around the probability and cost of exit versus the value of speed, proposes committing selectively rather than all or nothing, involves the right business functions, and describes how the decision would be documented and revisited.
      good: Weighs lock-in against speed with some concrete factors and involves more than engineering.
      weak: Rejects or accepts lock-in on principle, or treats it as a purely technical choice.
    followups:
      - What would change your recommendation?
      - How would you explain the trade-off to the finance team?
    common_errors:
      - Assuming lock-in is always bad without estimating the cost of avoiding it.

  - external_key: leadership.technical_direction.committing_to_uptime_target
    competency_key: stakeholder_management
    topic: Committing to a contractual uptime target
    difficulty: hard
    text: >-
      Your company wants to commit to a contractual uptime target for a new enterprise product, and once it is
      signed it can't easily be lowered. How would you decide what target to commit to, and what would have to be
      true technically first?
    expected_concepts:
      - current measured reliability and its trend
      - dependencies whose availability caps yours
      - error budget and operational capacity needed
      - what counts as downtime and how it is measured
      - negotiating a target with margin rather than an aspiration
    rubric:
      excellent: Bases the target on measured data and dependency limits, defines measurement and exclusions precisely, identifies the engineering and operational work required before signing, and negotiates margin with the business.
      good: Uses current reliability data and dependencies to suggest a realistic target.
      weak: Picks a number by convention or ambition without evidence.
    followups:
      - Sales wants a higher number than you're comfortable with. What do you do?
      - How would you track whether you're on course to meet it?
    common_errors:
      - Ignoring the availability of third-party dependencies when setting the target.

  - external_key: leadership.technical_direction.disputed_reversibility
    competency_key: leadership
    topic: Disagreement about whether a decision is reversible
    difficulty: hard
    text: >-
      Two senior engineers disagree not about the solution but about whether the decision can be reversed at all.
      One says it's a quick experiment, the other says customers will depend on it within a month. How would you
      resolve that?
    expected_concepts:
      - making the dependency path concrete (who adopts it, when, how)
      - steps that keep the experiment contained (limited audience, flags, labelling)
      - what would make reversal expensive and when that point arrives
      - agreeing a decision process proportionate to the real risk
    rubric:
      excellent: Turns the disagreement into concrete questions about adoption and dependency, proposes ways to keep the experiment contained until a defined point, and agrees a decision process that matches the actual risk, with both engineers' concerns addressed.
      good: Investigates who would depend on it and suggests ways to limit exposure.
      weak: Picks one engineer's view without examining the dependency question.
    followups:
      - How would you know you were approaching the point of no return?
      - What if the experiment succeeds and customers immediately want it permanently?
    common_errors:
      - Treating the experiment as reversible without any controls on who can start relying on it.

  - external_key: leadership.technical_direction.reversing_after_dependants
    competency_key: ownership
    topic: Reversing a decision others already depend on
    difficulty: hard
    text: >-
      Tell me about a time you had to reverse a technical decision after other teams or customers already depended
      on it. How did you weigh the cost of reversing against living with it, and how did you manage the transition?
    expected_concepts:
      - clear accounting of the cost of living with the decision
      - full cost of reversing including dependants' work
      - transition plan (dual running, migration support, deprecation timeline)
      - communication with affected teams or customers
      - what was learned about the original decision
    rubric:
      excellent: Gives a concrete case with a clear comparison of both costs, a well-structured transition that supported dependants, transparent communication, and a reflection that changed how they make similar decisions.
      good: Gives a real example with a reasonable transition and some reflection.
      weak: Glosses over the impact on dependants or cannot explain why reversing was justified.
    followups:
      - What did the teams who depended on it have to do?
      - What would have made the reversal cheaper?
    common_errors:
      - Underestimating the work the change pushed onto other teams.

  - external_key: leadership.technical_direction.escalation_rules_for_costly_choices
    competency_key: leadership
    topic: Which decisions teams make alone and which need review
    difficulty: hard
    text: >-
      If you led several teams, how would you define which technical decisions they can make on their own and which
      need wider review because they are hard to reverse? How would you keep that boundary from turning into bureaucracy?
    expected_concepts:
      - criteria such as shared data, public contracts, security, cost, new technology
      - lightweight review for the costly categories only
      - clear default of team autonomy
      - fast turnaround commitments for reviews
      - periodically adjusting the boundary based on what goes wrong
    rubric:
      excellent: Defines concrete categories of hard-to-reverse decisions, sets team autonomy as the default, designs a fast and lightweight review for the exceptions, and explains how they would detect and correct both over- and under-review.
      good: Proposes reasonable criteria and some way to keep review light.
      weak: Routes everything through central review, or has no criteria at all.
    followups:
      - How would you know the boundary was in the wrong place?
      - What happens when a team skips the review for something important?
    common_errors:
      - Defining the boundary by team seniority rather than by the nature of the decision.

  - external_key: leadership.technical_direction.highest_stakes_decision
    competency_key: leadership
    topic: Structuring a high-stakes technical decision
    difficulty: hard
    text: >-
      Tell me about the highest-stakes technical decision you've been part of, one where getting it wrong would
      have cost months of work or a major customer. How did you structure the decision, and what did you do to
      reduce the risk before committing?
    expected_concepts:
      - clear framing of the options and criteria
      - de-risking steps such as prototypes, benchmarks or staged rollout
      - involving the right experts and decision makers
      - explicit risk acceptance by the decision owner
      - result and reflection
    rubric:
      excellent: Describes the candidate's own role precisely, a structured decision process with explicit criteria, concrete risk-reduction work before committing, and a candid reflection on the outcome.
      good: Gives a real high-stakes example with a reasonable process and some de-risking.
      weak: Describes the stakes but not the process, or overstates their role.
    followups:
      - What would you have done if the prototype had failed?
      - Who formally accepted the remaining risk?
    common_errors:
      - Describing the decision the organisation made without clarifying their personal contribution.

  - external_key: leadership.technical_direction.legal_constraints_in_decisions
    competency_key: stakeholder_management
    topic: Legal and contractual constraints on technical decisions
    difficulty: hard
    text: >-
      Some decisions become hard to undo for legal reasons, such as where customer data is stored or how long it
      is kept. How have you brought constraints like that into technical decision-making early, and what happened
      when one surfaced late?
    expected_concepts:
      - involving legal, privacy or compliance partners early
      - identifying data location and retention as design inputs
      - documenting the constraint and its source
      - handling a late discovery (scope change, phased fix, risk acceptance)
    rubric:
      excellent: Describes a concrete practice for surfacing legal constraints at design time, gives an example of a late discovery, and explains how they re-planned and communicated the impact with the relevant partners.
      good: Recognises the need to involve legal or compliance early and gives a reasonable example.
      weak: Treats legal requirements as a final checklist after the design is finished.
    followups:
      - How do you translate a legal requirement into an engineering requirement?
      - Who should own the risk when a constraint is found late?
    common_errors:
      - Assuming storage location can always be changed later at low cost.
