# Curated questions: leadership round, mentoring (part 4 of 4).
# Focus: mentoring and growing engineers, delegation, and creating leaders. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.mentoring.documenting_for_others
  competency_key: mentoring
  topic: Writing things down for newer colleagues
  difficulty: easy
  text: >-
    What kinds of things do you write down specifically to help less experienced colleagues, and how do you know they use
    them?
  expected_concepts:
  - decision records and the reasons
  - how-to guides for common tasks
  - keeping documents current
  - asking readers for gaps
  - avoiding documents nobody reads
  rubric:
    excellent: >-
      Gives concrete examples of written aids, explains upkeep, and shows evidence people use them, such as fewer repeated
      questions.
    good: Writes useful material and has some sign of use.
    weak: Writes documents once and never checks if anyone reads them.
  followups:
  - How do you keep documents current?
  - What was the best-used document you wrote?
  common_errors:
  - >-
    Answering in the weak pattern: writes documents once and never checks if anyone reads them

- external_key: leadership.mentoring.meeting_cadence
  competency_key: mentoring
  topic: One-to-one meetings with a mentee
  difficulty: easy
  text: >-
    How do you run your regular one-to-ones so they are useful for the other person and not just status updates?
  expected_concepts:
  - the person's agenda comes first
  - a mix of topics such as growth, blockers and feedback
  - notes and actions
  - consistent schedule
  - protecting the time
  rubric:
    excellent: >-
      Describes a person-led agenda, balanced content, written actions and consistency, and shows an outcome from the meetings.
    good: Holds regular meetings with reasonable content.
    weak: Uses meetings for status updates or cancels them when busy.
  followups:
  - What do you do if they have nothing to discuss?
  - How often do you cancel them?
  common_errors:
  - >-
    Answering in the weak pattern: uses meetings for status updates or cancels them when busy

- external_key: leadership.mentoring.praise_and_correction
  competency_key: mentoring
  topic: Correcting a mistake kindly
  difficulty: easy
  text: >-
    Tell me about a time you had to point out a mistake to someone you were mentoring. How did you raise it?
  expected_concepts:
  - private setting
  - describing the facts and impact
  - asking for their view
  - agreeing what to do next
  - following up
  rubric:
    excellent: >-
      Describes a private, factual conversation that asks for the person's view, agrees concrete next steps, and follows up,
      with the person improving.
    good: Raises the issue respectfully and gets a reasonable result.
    weak: Avoids the conversation or criticises in front of others.
  followups:
  - How did they respond at first?
  - What would you do differently?
  common_errors:
  - >-
    Answering in the weak pattern: avoids the conversation or criticises in front of others

- external_key: leadership.mentoring.junior_questions_interrupt
  competency_key: mentoring
  topic: Balancing questions with your own work
  difficulty: easy
  text: >-
    How do you manage the time you spend answering questions from less experienced colleagues alongside your own deliverables?
  expected_concepts:
  - scheduled office hours or pairing slots
  - encouraging self-service through docs
  - asking them to try first
  - recognising urgent versus routine
  - making teaching part of planning
  rubric:
    excellent: >-
      Describes explicit time boundaries, ways to reduce repeat questions, and treats the time as planned work, with a clear
      example.
    good: Shows some structure for handling interruptions.
    weak: Either ignores questions or lets them consume the day.
  followups:
  - How do you decide a question is worth dropping everything for?
  - How do you make it fair across several people?
  common_errors:
  - >-
    Answering in the weak pattern: either ignores questions or lets them consume the day

- external_key: leadership.mentoring.explaining_team_roles
  competency_key: mentoring
  topic: Explaining how the team works to a newcomer
  difficulty: easy
  text: >-
    When someone new joins, how do you explain who does what and how decisions get made on your team?
  expected_concepts:
  - simple map of people and responsibilities
  - how work is planned and reviewed
  - who to ask for what
  - unwritten norms made explicit
  - check-in after a few weeks
  rubric:
    excellent: >-
      Gives a concrete way of making roles and norms explicit, including unwritten ones, and checks the newcomer's understanding
      later.
    good: Explains roles and processes reasonably well.
    weak: Expects them to pick it up by observation.
  followups:
  - What unwritten rules have caught newcomers out?
  - How do you update this explanation?
  common_errors:
  - 'Answering in the weak pattern: expects them to pick it up by observation'

- external_key: leadership.mentoring.helping_with_interviews_prep
  competency_key: mentoring
  topic: Growing someone as an interviewer
  difficulty: medium
  text: >-
    How do you develop an engineer who is starting to interview candidates, so they do it well and fairly?
  expected_concepts:
  - shadowing then reverse shadowing
  - shared question guides and scoring criteria
  - feedback on notes and rubric use
  - practising avoiding bias
  - calibrating with others
  rubric:
    excellent: >-
      Staged shadowing, structured criteria, feedback on written evaluations and calibration, with evidence of improved consistency.
    good: Offers guidance and shadowing.
    weak: Sends them in with no preparation.
  followups:
  - What did their first written feedback look like?
  - How did you check fairness?
  common_errors:
  - 'Answering in the weak pattern: sends them in with no preparation'

- external_key: leadership.mentoring.writing_good_design_docs
  competency_key: mentoring
  topic: Coaching someone on design documents
  difficulty: medium
  text: Describe how you have coached someone to write a good design document.
  expected_concepts:
  - purpose and audience
  - stating problem and non-goals
  - alternatives and trade-offs
  - early review of an outline
  - iterating through comments
  rubric:
    excellent: >-
      Coaches on audience, alternatives and early outline review, iterating over drafts, and shows how the person's documents
      improved.
    good: Reviews drafts and gives useful comments.
    weak: Rewrites the document themselves.
  followups:
  - What did their first draft lack?
  - How did you encourage them to seek review?
  common_errors:
  - 'Answering in the weak pattern: rewrites the document themselves'

- external_key: leadership.mentoring.handling_two_mentee_competition
  competency_key: leadership
  topic: Competition between people you develop
  difficulty: medium
  text: >-
    Two engineers you are growing are both after the same opportunity. How do you handle it?
  expected_concepts:
  - transparent criteria
  - fair chance for each
  - separate candid feedback
  - supporting the one not chosen
  - avoiding private promises
  rubric:
    excellent: >-
      States criteria openly, gives each fair feedback, communicates the decision clearly, and supports the person not chosen
      with a plan.
    good: Decides fairly and communicates.
    weak: Makes private promises or chooses without explanation.
  followups:
  - How did you tell the person not chosen?
  - What did they do afterwards?
  common_errors:
  - >-
    Answering in the weak pattern: makes private promises or chooses without explanation

- external_key: leadership.mentoring.teaching_ownership
  competency_key: ownership
  topic: Teaching ownership
  difficulty: medium
  text: >-
    How have you helped someone move from completing assigned tasks to genuinely owning an outcome?
  expected_concepts:
  - defining the outcome rather than the task
  - giving decision rights
  - letting them communicate with stakeholders
  - supporting after mistakes
  - recognising the shift
  rubric:
    excellent: >-
      Gives outcome-level responsibility with decision rights, supports without taking back control, and shows the shift in
      behaviour.
    good: Gives increased responsibility with some support.
    weak: Keeps assigning tasks and criticises lack of initiative.
  followups:
  - What did they do that told you they owned it?
  - How did you handle early misses?
  common_errors:
  - >-
    Answering in the weak pattern: keeps assigning tasks and criticises lack of initiative

- external_key: leadership.mentoring.learning_through_teaching
  competency_key: mentoring
  topic: What mentoring taught you
  difficulty: medium
  text: >-
    Think about a time when a mentee's question made you reconsider how you do your own job. What changed in your practice?
  expected_concepts:
  - explaining sharpened understanding
  - questions challenged assumptions
  - seeing different approaches
  - improved communication
  - improved patience and feedback skills
  rubric:
    excellent: >-
      Gives specific examples where mentoring changed their own practice or assumptions.
    good: Offers general lessons with an example.
    weak: Says nothing changed for them.
  followups:
  - Which question made you rethink something?
  - How has it changed your reviews?
  common_errors:
  - 'Answering in the weak pattern: says nothing changed for them'

- external_key: leadership.mentoring.post_incident_mentoring
  competency_key: mentoring
  topic: Using incidents to teach
  difficulty: medium
  text: >-
    How do you use incidents or near misses as learning opportunities for less experienced engineers, without making it about
    blame?
  expected_concepts:
  - involving them in the review
  - asking for their observations
  - explaining reasoning during response
  - focusing on system improvements
  - sharing the write-up widely
  rubric:
    excellent: >-
      Involves juniors in reviews, narrates reasoning, keeps a blameless frame, and shows concrete learning.
    good: Shares lessons from incidents.
    weak: Keeps juniors away from incidents.
  followups:
  - Who led the review?
  - How did the junior contribute?
  common_errors:
  - 'Answering in the weak pattern: keeps juniors away from incidents'

- external_key: leadership.mentoring.guiding_architecture_growth
  competency_key: leadership
  topic: Guiding someone toward architectural thinking
  difficulty: medium
  text: >-
    Tell me about helping an engineer broaden their view from one component to the whole system. What did you give them to
    work on?
  expected_concepts:
  - exposure to adjacent systems
  - ownership of a cross-component change
  - reading and presenting designs
  - feedback on trade-off thinking
  - reflecting on outcomes
  rubric:
    excellent: >-
      Gives staged exposure and a real cross-component task, with feedback, and shows broader reasoning afterwards.
    good: Offers exposure and some feedback.
    weak: Keeps them in their component.
  followups:
  - What was the first cross-system task?
  - What gaps appeared?
  common_errors:
  - 'Answering in the weak pattern: keeps them in their component'

- external_key: leadership.mentoring.re_engaging_a_disengaged_engineer
  competency_key: people_management
  topic: Re-engaging someone who has lost interest
  difficulty: medium
  text: >-
    An engineer seems bored and less engaged than they used to be. How do you find out what's happening and help?
  expected_concepts:
  - private open conversation
  - looking at work content and growth
  - offering new challenges
  - checking for workload or team issues
  - agreeing steps and revisiting
  rubric:
    excellent: >-
      Has an open private conversation, explores work-related causes, offers concrete changes, and follows up.
    good: Raises the issue and offers some options.
    weak: Ignores it or assumes it is a performance issue.
  followups:
  - What if they cannot say why?
  - What options did you have available?
  common_errors:
  - 'Answering in the weak pattern: ignores it or assumes it is a performance issue'

- external_key: leadership.mentoring.delegating_up_and_across
  competency_key: leadership
  topic: Delegating to peers and handling shared work
  difficulty: medium
  text: >-
    How do you share work with people who don't report to you, and how do you ensure it gets done?
  expected_concepts:
  - clear ask and outcome
  - reasons and benefits
  - agreed deadline and checkpoint
  - recognition of their help
  - handling slippage
  rubric:
    excellent: >-
      Makes clear requests with context, agrees checkpoints, recognises the contribution, and handles slippage without damaging
      the relationship.
    good: Asks clearly and follows up.
    weak: Dumps tasks or avoids asking.
  followups:
  - What happened when it slipped?
  - How did you thank them?
  common_errors:
  - 'Answering in the weak pattern: dumps tasks or avoids asking'

- external_key: leadership.mentoring.guiding_technical_choice_by_questions
  competency_key: mentoring
  topic: Letting someone make a design mistake
  difficulty: medium
  text: >-
    Describe a time you let someone go ahead with a design you doubted. What did you put in place and what happened?
  expected_concepts:
  - judging that risk was acceptable
  - stating concerns once
  - setting an early test
  - being ready to help
  - debriefing together
  rubric:
    excellent: >-
      Judges the risk, states concerns, sets an early test, supports in the recovery, and debriefs with the person.
    good: Lets the person try and discusses afterwards.
    weak: Said nothing and let them fail or forced a change.
  followups:
  - What did you say before they began?
  - What did they take away?
  common_errors:
  - 'Answering in the weak pattern: said nothing and let them fail or forced a change'

- external_key: leadership.mentoring.mentoring_non_native_communication
  competency_key: communication
  topic: Supporting clear technical writing
  difficulty: medium
  text: >-
    How do you help a colleague improve the clarity of their technical writing and review comments, so that others understand
    them better?
  expected_concepts:
  - giving examples of clear writing
  - templates for common documents
  - reviewing drafts with focus on structure
  - encouraging short sentences
  - reading aloud or peer review
  rubric:
    excellent: >-
      Offers practical aids, structured review of drafts focused on clarity, and shows a measurable improvement in how others
      receive their writing.
    good: Reviews and suggests improvements.
    weak: Rewrites it for them.
  followups:
  - What templates did you use?
  - How did you measure improvement?
  common_errors:
  - 'Answering in the weak pattern: rewrites it for them'

- external_key: leadership.mentoring.teaching_judgment_in_ambiguity
  competency_key: mentoring
  topic: Teaching judgment where there are no rules
  difficulty: medium
  text: >-
    How do you teach engineers to make good decisions when the situation is ambiguous and there's no right answer to look
    up?
  expected_concepts:
  - sharing your own reasoning and doubts
  - case reviews of past decisions
  - frameworks for reversibility and risk
  - supported practice with small decisions
  - reviewing outcomes with openness
  rubric:
    excellent: >-
      Models reasoning aloud, uses past cases, teaches reversibility and risk, gives supported practice, and shows improved
      decisions.
    good: Shares experience and some frameworks.
    weak: Gives rules of thumb as if universal.
  followups:
  - Which decision did you reverse?
  - How do you know it is working?
  common_errors:
  - 'Answering in the weak pattern: gives rules of thumb as if universal'

- external_key: leadership.mentoring.intern_programme_design
  competency_key: leadership
  topic: Designing an internship experience
  difficulty: hard
  text: >-
    You've been asked to host two interns for a summer. How do you design their experience so they learn and the team benefits?
  expected_concepts:
  - scoped project with real value
  - a named buddy and manager
  - milestones and feedback
  - exposure to team practices
  - a path to a final demo
  - fair evaluation criteria
  rubric:
    excellent: >-
      Designs a meaningful scoped project, names support roles, sets milestones, plans a demo, and has fair criteria and a
      way to learn from the programme.
    good: Gives a reasonable project and support plan.
    weak: Gives them leftover tasks.
  followups:
  - What would you do if the project went wrong?
  - How would you evaluate them fairly?
  common_errors:
  - 'Answering in the weak pattern: gives them leftover tasks'

- external_key: leadership.mentoring.coaching_leaders_of_leaders
  competency_key: leadership
  topic: Coaching other leads
  difficulty: hard
  text: >-
    How do you coach people who themselves lead teams, and what is different from coaching engineers?
  expected_concepts:
  - focus on leverage and multiplication
  - asking questions to build their judgment
  - sharing context on organisation
  - candid feedback on their team's results
  - not overriding their decisions
  rubric:
    excellent: >-
      Focuses on leverage, builds judgment through questions, shares context, gives candid feedback on outcomes, and respects
      their decision rights.
    good: Offers support and advice.
    weak: Treats them as engineers or micromanages their teams.
  followups:
  - How do you give them hard feedback?
  - When have you overridden a lead?
  common_errors:
  - >-
    Answering in the weak pattern: treats them as engineers or micromanages their teams

- external_key: leadership.mentoring.growing_people_in_a_stalled_org
  competency_key: leadership
  topic: Developing people when promotions are scarce
  difficulty: hard
  text: >-
    There's a freeze on promotions and headcount. How do you keep growing people and keep them motivated, and what do you
    say to those expecting advancement?
  expected_concepts:
  - candid communication of constraints
  - non-promotion growth such as scope and skills
  - documenting readiness for later
  - recognition
  - managing expectations
  rubric:
    excellent: >-
      Is open about constraints, finds growth beyond title, documents readiness, and reports retention and engagement results.
    good: Communicates and offers some alternatives.
    weak: Offers false hope or ignores the issue.
  followups:
  - Who left, and why?
  - How did you document readiness?
  common_errors:
  - 'Answering in the weak pattern: offers false hope or ignores the issue'

- external_key: leadership.mentoring.handing_over_a_critical_project
  competency_key: leadership
  topic: Fully handing over a project you founded
  difficulty: hard
  text: >-
    You built and led an important project and now must hand it to someone else completely. How did you do it so it continued
    to succeed?
  expected_concepts:
  - choosing the successor with care
  - staged handover
  - sharing context and relationships
  - stepping back despite attachment
  - sustaining support on request
  - measuring success afterwards
  rubric:
    excellent: >-
      Chooses carefully, hands over in stages including relationships, steps back, and follows how the project did.
    good: Hands over with documentation and meetings.
    weak: Drops it abruptly or keeps interfering.
  followups:
  - What did you find hardest?
  - How did the new owner change it?
  common_errors:
  - 'Answering in the weak pattern: drops it abruptly or keeps interfering'

- external_key: leadership.mentoring.inconsistent_feedback_from_multiple_mentors
  competency_key: mentoring
  topic: Conflicting guidance for one person
  difficulty: hard
  text: >-
    One of your mentees receives conflicting advice from you and from another senior engineer. How do you help them?
  expected_concepts:
  - discussing with the other mentor
  - helping the person see the context behind each view
  - teaching them to weigh advice
  - agreeing shared guidance where possible
  - letting them decide
  rubric:
    excellent: >-
      Talks to the other mentor, helps the mentee reason about the difference, aligns where possible, and respects the mentee's
      decision.
    good: Helps the mentee compare views.
    weak: Insists theirs is right.
  followups:
  - What if the other mentor refuses to align?
  - How do you teach someone to weigh advice?
  common_errors:
  - 'Answering in the weak pattern: insists theirs is right'

- external_key: leadership.mentoring.cross_functional_growth
  competency_key: leadership
  topic: Building product and business awareness in engineers
  difficulty: hard
  text: >-
    How have you helped engineers on your team grow their product and business understanding, and what difference did it make?
  expected_concepts:
  - involving them in customer conversations
  - sharing metrics and context
  - asking for their input on priorities
  - rotating who attends planning
  - linking work to outcomes
  rubric:
    excellent: >-
      Creates direct exposure to customers and metrics, shows engineers' improved decisions, and gives measurable change.
    good: Shares context and some exposure.
    weak: Keeps engineers focused on tickets.
  followups:
  - What changed in how they made decisions?
  - Who resisted?
  common_errors:
  - 'Answering in the weak pattern: keeps engineers focused on tickets'

- external_key: leadership.mentoring.protecting_juniors_from_toxic_stakeholder
  competency_key: leadership
  topic: A stakeholder who is hard on your juniors
  difficulty: hard
  text: >-
    A senior stakeholder keeps being harsh with a junior engineer on your team. How do you protect them while still helping
    them handle it?
  expected_concepts:
  - gathering facts
  - talking to the stakeholder directly
  - acting as buffer in the short term
  - coaching the person on dealing with it
  - escalating through proper routes if it continues
  rubric:
    excellent: >-
      Collects facts, addresses the stakeholder's behaviour directly, supports and coaches the person, and escalates appropriately.
    good: Intervenes and supports the junior.
    weak: Ignores it or tells the junior to toughen up.
  followups:
  - What did the stakeholder say?
  - How did you avoid over-shielding?
  common_errors:
  - 'Answering in the weak pattern: ignores it or tells the junior to toughen up'

- external_key: leadership.mentoring.sustaining_mentoring_culture
  competency_key: leadership
  topic: Making mentoring part of how the team works
  difficulty: hard
  text: >-
    How do you make mentoring a habit of the whole team rather than something that depends on you?
  expected_concepts:
  - expectations in role descriptions
  - recognition for helping others
  - norms such as pairing
  - time in planning
  - leaders modelling it
  - checking whether it persists
  rubric:
    excellent: >-
      Embeds mentoring in expectations, recognition and planning, models it, and gives evidence it continued without them.
    good: Encourages the habit and recognises it.
    weak: Relies on volunteers.
  followups:
  - What did you reward?
  - What happened when you were absent?
  common_errors:
  - 'Answering in the weak pattern: relies on volunteers'
