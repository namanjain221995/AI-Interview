# Curated questions: leadership round, mentoring (part 2 of 4).
# Focus: mentoring and growing engineers, delegation, and creating leaders. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.mentoring.sharing_what_you_know
  competency_key: mentoring
  topic: Sharing knowledge across the team
  difficulty: easy
  text: >-
    Tell me about a time you taught a skill or area of the system to colleagues so that you were no longer the only person
    who knew it.
  expected_concepts:
  - the knowledge gap and the risk
  - the format chosen such as pairing or a session
  - making material reusable
  - checking that others could do it alone
  - result on team resilience
  rubric:
    excellent: >-
      Names the single-person risk, picks a suitable teaching format, leaves reusable material, verifies others can work independently,
      and shows a clear result.
    good: >-
      Shares knowledge in a sensible way with some benefit but does not verify understanding.
    weak: Only produced a document that nobody used, or kept the knowledge to themselves.
  followups:
  - How did you know people had really understood?
  - What would you do to keep it from slipping again?
  common_errors:
  - >-
    Answering in the weak pattern: only produced a document that nobody used, or kept the knowledge to themselves

- external_key: leadership.mentoring.giving_encouraging_feedback
  competency_key: mentoring
  topic: Specific positive feedback
  difficulty: easy
  text: >-
    How do you give positive feedback to a team member so it actually helps them repeat what went well?
  expected_concepts:
  - naming the specific behaviour
  - linking to its effect
  - timing it soon after
  - choosing private or public deliberately
  - avoiding vague praise
  rubric:
    excellent: >-
      Gives a concrete example linking behaviour to impact, explains timing and audience choices, and shows that the person
      repeated the behaviour.
    good: >-
      Understands specific praise and gives a plain example with little on audience or timing.
    weak: >-
      Offers only general praise such as "good job" or saves feedback for formal reviews.
  followups:
  - When would you give praise privately instead of publicly?
  - How did the person react?
  common_errors:
  - >-
    Answering in the weak pattern: offers only general praise such as "good job" or saves feedback for formal reviews

- external_key: leadership.mentoring.first_delegated_task
  competency_key: leadership
  topic: Delegating a task for the first time
  difficulty: easy
  text: >-
    Think of an early occasion when you handed a meaningful task to someone else rather than doing it yourself. How did you
    decide what to hand over and how to explain it?
  expected_concepts:
  - choosing a task suited to the person
  - explaining the goal and constraints
  - agreeing a check-in point
  - being available without hovering
  - how the outcome compared with doing it themselves
  rubric:
    excellent: >-
      Explains why that task and person were chosen, how the outcome and boundaries were stated, how check-ins worked, and
      reflects on the trade-off candidly in terms of results.
    good: >-
      Delegates a real task with some clarity and a decent outcome but sparse follow-up.
    weak: Gives a vague handover, or recalls doing most of the work again afterwards.
  followups:
  - What did you do differently from how you would have done it?
  - What did you do when the first draft was not what you hoped?
  common_errors:
  - >-
    Answering in the weak pattern: gives a vague handover, or recalls doing most of the work again afterwards

- external_key: leadership.mentoring.pairing_session
  competency_key: mentoring
  topic: Pairing to grow someone
  difficulty: easy
  text: >-
    Describe how you run a pairing session when your goal is to help the other person learn rather than finish the task fastest.
  expected_concepts:
  - letting them drive
  - asking questions before giving answers
  - narrating reasoning
  - agreeing the goal of the session
  - short reflection at the end
  rubric:
    excellent: >-
      Describes who drives, how they question rather than tell, how reasoning is made visible, and a closing reflection, with
      an example of learning that stuck.
    good: Understands the aim and uses some guiding behaviours but defaults to showing.
    weak: Types while the other person watches.
  followups:
  - How do you stop yourself from taking the keyboard?
  - How do you adapt it for someone more experienced?
  common_errors:
  - 'Answering in the weak pattern: types while the other person watches'

- external_key: leadership.mentoring.asking_for_mentoring_feedback
  competency_key: mentoring
  topic: Getting feedback on your own mentoring
  difficulty: easy
  text: >-
    How do you find out whether your mentoring is actually useful to the person you're working with?
  expected_concepts:
  - asking directly and regularly
  - specific questions rather than "is this ok"
  - making it safe to say no
  - changing the approach visibly
  - watching their progress
  rubric:
    excellent: >-
      Describes regular, specific questions, a safe way to answer, and an example where feedback changed how they mentor.
    good: Asks for feedback occasionally and acts on some of it.
    weak: Assumes it is useful because the mentee seems happy.
  followups:
  - What did you change after the last piece of feedback?
  - How do you handle feedback that stings?
  common_errors:
  - >-
    Answering in the weak pattern: assumes it is useful because the mentee seems happy

- external_key: leadership.mentoring.handling_mentee_mistake_in_production
  competency_key: mentoring
  topic: A mentee causes a production issue
  difficulty: medium
  text: >-
    Someone you mentor made a change that caused a production problem. How do you handle it with them, and with the rest of
    the team?
  expected_concepts:
  - helping fix first
  - blameless review of the process
  - private conversation about learning
  - making the system safer
  - protecting their confidence
  rubric:
    excellent: >-
      Prioritises recovery, runs a blameless review of the process, supports the person privately, improves safeguards, and
      the person grows.
    good: Handles the incident and supports the person.
    weak: Blames them in public or hides the issue.
  followups:
  - What did you tell them?
  - What changed in your process afterwards?
  common_errors:
  - 'Answering in the weak pattern: blames them in public or hides the issue'

- external_key: leadership.mentoring.time_budget_for_mentoring
  competency_key: leadership
  topic: Making time for mentoring
  difficulty: medium
  text: How do you protect time for developing others when delivery pressure is high?
  expected_concepts:
  - scheduling it as real work
  - combining with delivery such as pairing on live tasks
  - prioritising by impact
  - being open with managers about trade-offs
  - avoiding hidden evening work
  rubric:
    excellent: >-
      Explains concrete ways to embed development in delivery, communicates the trade-off to stakeholders, and is clear on
      what they deprioritised.
    good: Finds some time with sensible methods.
    weak: Says there is no time, or relies on unpaid extra hours.
  followups:
  - What did you drop to make time?
  - How do you show the value of it?
  common_errors:
  - >-
    Answering in the weak pattern: says there is no time, or relies on unpaid extra hours

- external_key: leadership.mentoring.measuring_mentoring_impact
  competency_key: mentoring
  topic: Knowing mentoring worked
  difficulty: medium
  text: >-
    How do you judge whether your mentoring has actually made a difference for someone?
  expected_concepts:
  - progress against agreed goals
  - changes in the quality and scope of their work
  - feedback from the person and others
  - independence over time
  - avoiding vanity measures
  rubric:
    excellent: >-
      Offers specific observable indicators tied to goals, collects multiple viewpoints, and gives an example where evidence
      changed the approach.
    good: Uses a few reasonable indicators.
    weak: Relies only on whether the mentee says thanks.
  followups:
  - What would a lack of progress look like?
  - Has the evidence ever told you to stop?
  common_errors:
  - 'Answering in the weak pattern: relies only on whether the mentee says thanks'

- external_key: leadership.mentoring.group_mentoring_programme
  competency_key: leadership
  topic: Starting a mentoring programme
  difficulty: medium
  text: >-
    Suppose you were asked to launch a mentoring programme across several teams. How would you design it so it's useful and
    fair?
  expected_concepts:
  - clear purpose and audience
  - open sign-up and fair matching
  - training for mentors
  - expectations on time and goals
  - feedback and review of the programme
  rubric:
    excellent: >-
      Designs with a clear purpose, open access and criteria for matching, equips mentors, sets expectations and plans a review
      with measures.
    good: Gives a reasonable structure with some fairness consideration.
    weak: Gives a loose plan relying on volunteers with no support.
  followups:
  - How would you handle mentors with poor results?
  - How would you know it worked?
  common_errors:
  - >-
    Answering in the weak pattern: gives a loose plan relying on volunteers with no support

- external_key: leadership.mentoring.mentoring_across_teams
  competency_key: mentoring
  topic: Mentoring someone outside your team
  difficulty: medium
  text: >-
    Describe mentoring an engineer who wasn't on your team. What was different from mentoring someone you manage?
  expected_concepts:
  - no authority and no performance involvement
  - setting boundaries and confidentiality
  - focus on the person's goals
  - coordinating with their manager when needed
  - fresh perspective as a benefit
  rubric:
    excellent: >-
      Names the differences in boundaries and trust, handles manager relationship respectfully, and shows a benefit to both
      sides.
    good: Provides a sensible comparison.
    weak: Treats it the same and oversteps the other manager's role.
  followups:
  - How did you involve their manager?
  - What did you learn from them?
  common_errors:
  - >-
    Answering in the weak pattern: treats it the same and oversteps the other manager's role

- external_key: leadership.mentoring.teaching_how_to_estimate
  competency_key: mentoring
  topic: Teaching estimation
  difficulty: medium
  text: >-
    How have you helped a less experienced engineer improve at estimating and planning their own work?
  expected_concepts:
  - comparing estimates with actuals
  - breaking work into smaller pieces
  - naming unknowns and risk
  - reviewing together regularly
  - making it safe to be wrong
  rubric:
    excellent: >-
      Uses tracked comparisons, decomposition and risk surfacing in a safe setting, and shows a measurable improvement.
    good: Gives useful guidance with some review.
    weak: Criticises missed estimates without teaching method.
  followups:
  - What was their typical mistake?
  - How did you keep them from padding estimates?
  common_errors:
  - >-
    Answering in the weak pattern: criticises missed estimates without teaching method

- external_key: leadership.mentoring.developing_communication_skills
  competency_key: communication
  topic: Improving someone's communication
  difficulty: medium
  text: >-
    Tell me about helping an engineer who was technically strong but struggled to communicate their ideas to others. What
    did you do?
  expected_concepts:
  - concrete observations of when it broke down
  - practice in low-risk settings
  - frameworks such as lead with the conclusion
  - feedback after real meetings
  - patience and measured progress
  rubric:
    excellent: >-
      Bases feedback on observed behaviours, offers structured practice, gives feedback after real events, and shows a visible
      improvement.
    good: Gives useful tips and some practice.
    weak: Tells them to speak up more without support.
  followups:
  - What was the first change you saw?
  - How did you handle meetings where they stayed quiet?
  common_errors:
  - 'Answering in the weak pattern: tells them to speak up more without support'

- external_key: leadership.mentoring.succession_planning
  competency_key: leadership
  topic: Making yourself replaceable
  difficulty: medium
  text: >-
    How have you made sure the team can run without you for a few weeks, and what did that teach you about developing others?
  expected_concepts:
  - identifying single points of failure
  - deputies for decisions
  - documented context
  - letting others own meetings and decisions
  - reviewing what happened when away
  rubric:
    excellent: >-
      Describes concrete steps to share decisions and knowledge, a test such as time away, and what they learned from the
      results.
    good: Delegates and documents some responsibilities.
    weak: Considers themselves indispensable.
  followups:
  - What went wrong while you were away?
  - What did you hand over that was difficult to let go?
  common_errors:
  - 'Answering in the weak pattern: considers themselves indispensable'

- external_key: leadership.mentoring.feedback_loop_with_mentee
  competency_key: mentoring
  topic: A two-way feedback culture
  difficulty: medium
  text: >-
    How do you create a relationship in which a mentee tells you when something you've suggested didn't work or isn't helping?
  expected_concepts:
  - modelling receiving feedback
  - asking specific questions
  - reacting steadily
  - acting visibly on it
  - lowering the power gap
  rubric:
    excellent: >-
      Shows concrete behaviours that signal safety, reacts constructively, and gives an example of a change made following
      criticism.
    good: Invites feedback and responds politely.
    weak: Expects mentees to speak up with no adjustment from their side.
  followups:
  - Tell me about a time a mentee corrected you.
  - What do you do when they stay silent?
  common_errors:
  - >-
    Answering in the weak pattern: expects mentees to speak up with no adjustment from their side

- external_key: leadership.mentoring.picking_between_mentees
  competency_key: leadership
  topic: Dividing your attention fairly
  difficulty: medium
  text: >-
    You have several people who need your time, and one of them is especially demanding. How do you share your attention fairly?
  expected_concepts:
  - setting regular time for each person
  - prioritising on need and impact, not volume
  - saying no or redirecting kindly
  - spotting quiet people
  - reviewing the split
  rubric:
    excellent: >-
      Describes a deliberate split, checks on quieter people, redirects the demanding person with boundaries, and examines
      who gets more time.
    good: Allocates time reasonably.
    weak: Gives time to whoever asks the most.
  followups:
  - How do you notice the people who do not ask?
  - How do you tell the demanding person no?
  common_errors:
  - 'Answering in the weak pattern: gives time to whoever asks the most'

- external_key: leadership.mentoring.junior_promotion_readiness
  competency_key: people_management
  topic: Judging readiness for the next level
  difficulty: medium
  text: >-
    How do you judge whether an engineer you've been developing is ready for promotion, and how do you keep that judgment
    fair?
  expected_concepts:
  - next-level criteria written down
  - evidence over time from multiple sources
  - scope and consistency, not one big win
  - calibration with peers
  - clear feedback on gaps
  rubric:
    excellent: >-
      Uses documented criteria and multiple sources of evidence, checks consistency with calibration, and communicates clearly
      with the person.
    good: Uses criteria and some evidence.
    weak: Relies on recent impressions or tenure.
  followups:
  - How do you handle a strong performer lacking one criterion?
  - How do you guard against recency bias?
  common_errors:
  - 'Answering in the weak pattern: relies on recent impressions or tenure'

- external_key: leadership.mentoring.knowledge_transfer_when_leaving
  competency_key: leadership
  topic: When a key person leaves
  difficulty: medium
  text: >-
    A person who owns a critical area is leaving in four weeks. How do you make sure their knowledge is passed on well?
  expected_concepts:
  - listing what only they know
  - assigning successors early
  - shadowing and reverse shadowing
  - documenting decisions and operational steps
  - verifying with a dry run
  rubric:
    excellent: >-
      Maps the knowledge, pairs successors with the leaver, uses reverse shadowing and a dry run to verify, and notes remaining
      risk.
    good: Plans handover with documentation and meetings.
    weak: Asks for a document in the final week.
  followups:
  - What if there is not enough time?
  - How would you test the handover worked?
  common_errors:
  - 'Answering in the weak pattern: asks for a document in the final week'

- external_key: leadership.mentoring.creating_leaders_not_followers
  competency_key: leadership
  topic: Building independent leaders
  difficulty: hard
  text: >-
    How do you deliberately build leaders on your team so that people take initiative and not just follow your direction?
    Share specifics from a team you led.
  expected_concepts:
  - delegating decisions and not just tasks
  - accepting different solutions
  - sharing context and trade-offs
  - rotating responsibility for meetings or projects
  - recognising initiative
  - letting them fail within limits
  rubric:
    excellent: >-
      Delegates decisions with context, accepts other approaches, rotates ownership, recognises initiative, and gives results
      such as leaders emerging.
    good: Provides growth opportunities with some decision delegation.
    weak: Delegates tasks only and keeps decisions.
  followups:
  - What decisions did you give away?
  - What did you find hard to let go of?
  common_errors:
  - 'Answering in the weak pattern: delegates tasks only and keeps decisions'

- external_key: leadership.mentoring.declining_performance_of_prior_star
  competency_key: people_management
  topic: A strong performer who has declined
  difficulty: hard
  text: >-
    One of your formerly strongest engineers has slipped over the past quarter. How do you approach understanding and addressing
    it?
  expected_concepts:
  - gathering facts about the work
  - asking open questions in private
  - considering workload, role fit or changed context
  - agreeing support and expectations
  - avoiding assumptions
  - following up
  rubric:
    excellent: >-
      Uses facts and open questions, considers work-related causes, agrees support and clear expectations, follows up and
      documents fairly.
    good: Raises it respectfully and offers help.
    weak: Assumes cause without asking or ignores it.
  followups:
  - What if they do not want to discuss it?
  - When would you involve others?
  common_errors:
  - Speculating about reasons outside work.

- external_key: leadership.mentoring.scaling_mentoring_beyond_one_to_one
  competency_key: mentoring
  topic: Mentoring at scale
  difficulty: hard
  text: >-
    You can personally mentor only a handful of people, yet your organisation needs many more engineers developed. How do
    you multiply your impact?
  expected_concepts:
  - training others to mentor
  - shared resources and practices
  - communities and guilds
  - role modelling feedback
  - selecting where your personal time has the most leverage
  - measuring spread
  rubric:
    excellent: >-
      Builds a system where mentors are developed, uses shared resources, chooses personal leverage points, and measures spread
      with an example.
    good: Proposes several scalable methods.
    weak: Assumes one-to-one is the only way.
  followups:
  - What did you stop doing yourself?
  - How do you keep quality across mentors?
  common_errors:
  - 'Answering in the weak pattern: assumes one-to-one is the only way'

- external_key: leadership.mentoring.mentoring_through_a_reorg
  competency_key: leadership
  topic: Maintaining growth through change
  difficulty: hard
  text: >-
    Your team went through a reorganisation, and people lost their projects and mentors. How did you keep development going?
  expected_concepts:
  - acknowledging disruption
  - re-establishing one-to-ones
  - re-mapping growth plans
  - connecting people to new mentors
  - maintaining transparency
  - focusing on what could be controlled
  rubric:
    excellent: >-
      Re-establishes support quickly, updates plans, connects people, stays open about uncertainty, and describes retention
      or growth results.
    good: Maintains contact and adjusts plans.
    weak: Waits for the change to settle.
  followups:
  - Who was hit hardest?
  - What would you do earlier next time?
  common_errors:
  - 'Answering in the weak pattern: waits for the change to settle'

- external_key: leadership.mentoring.correcting_a_wrong_belief_you_taught
  competency_key: mentoring
  topic: You taught something wrong
  difficulty: hard
  text: >-
    Tell me about discovering that something you had been teaching your team was wrong or outdated. What did you do?
  expected_concepts:
  - verifying the facts
  - telling people promptly
  - explaining the corrected understanding
  - examining impact on past work
  - building habits of checking
  rubric:
    excellent: >-
      Verifies, tells everyone quickly, handles the impact, and models openness to learning with a change in habits.
    good: Corrects it and informs the people involved.
    weak: Quietly drops it or defends it.
  followups:
  - Who was most affected?
  - How did the team respond?
  common_errors:
  - 'Answering in the weak pattern: quietly drops it or defends it'

- external_key: leadership.mentoring.mentoring_resistant_engineer
  competency_key: mentoring
  topic: A skilled engineer who rejects feedback
  difficulty: hard
  text: >-
    Describe working with a skilled engineer who tended to reject feedback. How did you get them to a point where they could
    learn from others?
  expected_concepts:
  - understanding what was behind the pushback
  - picking battles
  - using data from outcomes
  - framing feedback around their goals
  - involving trusted peers
  - holding standards
  rubric:
    excellent: >-
      Explores the reasons, ties feedback to their own goals, uses evidence, holds standards, and shows a shift in how they
      take feedback.
    good: Makes steady progress through discussions.
    weak: Gives up or escalates immediately.
  followups:
  - What did not work?
  - At what point did you escalate?
  common_errors:
  - 'Answering in the weak pattern: gives up or escalates immediately'

- external_key: leadership.mentoring.investing_in_someone_who_may_not_stay
  competency_key: leadership
  topic: Developing temporary team members
  difficulty: hard
  text: >-
    How do you decide how much to invest in contractors or people whose roles are temporary, and what did you do in a case
    like that?
  expected_concepts:
  - considering what the organisation and the person gain
  - focusing on transferable skills
  - capturing knowledge
  - being clear about expectations
  - fairness in treatment
  rubric:
    excellent: >-
      Balances value to both sides, sets clear expectations, captures knowledge, treats the person fairly, and shows a good
      outcome.
    good: Invests moderately with reasons.
    weak: Ignores development for temporary people.
  followups:
  - What knowledge did you make sure stayed?
  - How did it affect the permanent team?
  common_errors:
  - 'Answering in the weak pattern: ignores development for temporary people'

- external_key: leadership.mentoring.developing_a_team_after_hero_departure
  competency_key: leadership
  topic: When a hero engineer leaves
  difficulty: hard
  text: >-
    The person who everyone relied on has left the team. How did you help the others step up?
  expected_concepts:
  - assessing what that person actually did
  - redistributing responsibility deliberately
  - supporting people through the discomfort
  - adjusting commitments
  - making the knowledge shared
  rubric:
    excellent: >-
      Maps the duties, redistributes them with support, adjusts commitments openly, and shows growth in several people.
    good: Redistributes with moderate planning.
    weak: Looks for a replacement hero.
  followups:
  - What was lost that you could not recover?
  - Who surprised you?
  common_errors:
  - 'Answering in the weak pattern: looks for a replacement hero'
