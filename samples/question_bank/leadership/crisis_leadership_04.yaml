# Curated questions: leadership round, crisis leadership (part 4 of 4).
# Focus: leading through incidents and crises, calm communication and follow-up. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.crisis_leadership.action_items_follow_up
  competency_key: ownership
  topic: Making sure review actions get done
  difficulty: easy
  text: How do you make sure the actions from an incident review actually happen?
  expected_concepts:
  - owners and dates
  - tracking in the normal backlog
  - priority agreed
  - regular check
  - closing the loop
  rubric:
    excellent: >-
      Assigns owners and dates, tracks in the backlog, reviews progress and closes the loop.
    good: Assigns owners.
    weak: Writes actions that nobody tracks.
  followups:
  - What percent were completed?
  - What blocked them?
  common_errors:
  - 'Answering in the weak pattern: writes actions that nobody tracks'

- external_key: leadership.crisis_leadership.recovering_after_incident
  competency_key: leadership
  topic: Looking after the team afterwards
  difficulty: easy
  text: After a hard incident, what do you do for the team?
  expected_concepts:
  - acknowledging effort
  - time to recover
  - review without blame
  - sharing credit
  - adjusting workload
  rubric:
    excellent: Acknowledges effort, gives recovery time, reviews fairly and adjusts workload.
    good: Thanks the team and gives some time.
    weak: Moves on immediately.
  followups:
  - What did you offer?
  - How did the team respond?
  common_errors:
  - 'Answering in the weak pattern: moves on immediately'

- external_key: leadership.crisis_leadership.monitoring_blind_spot
  competency_key: observability
  topic: An incident your monitoring missed
  difficulty: easy
  text: Describe an incident that your monitoring didn't catch. What did you change?
  expected_concepts:
  - how it was discovered
  - the gap
  - new alerts or checks
  - avoiding noise
  - verifying the change
  rubric:
    excellent: Explains discovery, the gap and the new checks, and verifies them.
    good: Adds a new alert.
    weak: Does nothing different.
  followups:
  - How long was it undetected?
  - How did you avoid alert noise?
  common_errors:
  - 'Answering in the weak pattern: does nothing different'

- external_key: leadership.crisis_leadership.communicating_with_support
  competency_key: communication
  topic: Working with customer support
  difficulty: easy
  text: How do you work with customer support during an outage?
  expected_concepts:
  - early heads-up
  - shared status
  - script or guidance
  - feedback from customers
  - closing the loop
  rubric:
    excellent: >-
      Informs support early, shares status and guidance, collects customer signals and follows up.
    good: Informs support.
    weak: Leaves support to find out alone.
  followups:
  - What did support ask for?
  - What did you learn from support?
  common_errors:
  - 'Answering in the weak pattern: leaves support to find out alone'

- external_key: leadership.crisis_leadership.rollback_decision
  competency_key: incident_response
  topic: Deciding to roll back
  difficulty: easy
  text: >-
    A recent release is the likely cause of a failure. How do you decide whether to roll back?
  expected_concepts:
  - evidence linking release to failure
  - rollback risk
  - data changes
  - time to roll back
  - communication
  - verifying
  rubric:
    excellent: Weighs evidence, risk and time, communicates and verifies recovery.
    good: Rolls back when linked to release.
    weak: Debugs forward by default.
  followups:
  - When would you not roll back?
  - How did you verify?
  common_errors:
  - 'Answering in the weak pattern: debugs forward by default'

- external_key: leadership.crisis_leadership.training_new_responders
  competency_key: mentoring
  topic: Preparing newer people for incidents
  difficulty: medium
  text: How do you train newer engineers to take part in incidents confidently?
  expected_concepts:
  - shadowing
  - simulations
  - runbooks
  - role progression
  - debriefs
  - supportive first experiences
  rubric:
    excellent: >-
      Provides shadowing, simulations, role progression and debriefs, with newer responders participating well.
    good: Pairs them with experienced people.
    weak: Throws them in.
  followups:
  - What was their first role?
  - How did you debrief?
  common_errors:
  - 'Answering in the weak pattern: throws them in'

- external_key: leadership.crisis_leadership.clear_decision_authority
  competency_key: leadership
  topic: Who decides in an incident
  difficulty: medium
  text: How do you make it clear who has authority to make decisions during an incident?
  expected_concepts:
  - documented roles
  - incident lead's authority
  - escalation for big decisions
  - spoken confirmations
  - review
  rubric:
    excellent: >-
      Documents roles and authority, confirms aloud and defines escalation for bigger decisions.
    good: Names a lead.
    weak: Leaves authority unclear.
  followups:
  - What decisions needed escalation?
  - What happened with disagreement?
  common_errors:
  - 'Answering in the weak pattern: leaves authority unclear'

- external_key: leadership.crisis_leadership.customer_compensation_decisions
  competency_key: stakeholder_management
  topic: Compensating affected customers
  difficulty: medium
  text: >-
    An outage has affected customers and you must decide what to offer. How do you approach it?
  expected_concepts:
  - scope of impact
  - fairness
  - contract terms
  - cost
  - communication
  - consistency
  rubric:
    excellent: >-
      Scopes the impact, applies consistent criteria, aligns with contracts and communicates clearly.
    good: Offers a gesture to affected customers.
    weak: Decides case by case without criteria.
  followups:
  - How did you decide the amount?
  - How did customers respond?
  common_errors:
  - 'Answering in the weak pattern: decides case by case without criteria'

- external_key: leadership.crisis_leadership.reducing_mean_time_to_recover
  competency_key: observability
  topic: Improving recovery speed
  difficulty: medium
  text: >-
    What have you done to reduce the time it takes your team to recover from incidents?
  expected_concepts:
  - measuring
  - faster detection
  - better runbooks
  - rollback tools
  - practice
  - removing handoffs
  rubric:
    excellent: >-
      Measures recovery time, improves detection and tooling, practises and shows reduced times.
    good: Improves some tooling.
    weak: Does not measure.
  followups:
  - What was your time before and after?
  - What helped most?
  common_errors:
  - 'Answering in the weak pattern: does not measure'

- external_key: leadership.crisis_leadership.talking_to_the_team_about_failure
  competency_key: communication
  topic: Presenting an incident to the broader team
  difficulty: medium
  text: >-
    How do you present an incident to the wider engineering organisation so that others learn from it?
  expected_concepts:
  - story form
  - facts
  - contributing factors
  - what worked
  - actions
  - openness to questions
  rubric:
    excellent: >-
      Tells the story clearly with facts and actions, highlights what worked and invites questions.
    good: Presents the review.
    weak: Sends a document.
  followups:
  - What did others ask?
  - What did they adopt?
  common_errors:
  - 'Answering in the weak pattern: sends a document'

- external_key: leadership.crisis_leadership.multi_day_crisis
  competency_key: leadership
  topic: A crisis that lasts days
  difficulty: medium
  text: >-
    Tell me about a crisis that lasted several days. How did you sustain the response?
  expected_concepts:
  - shifts
  - rest
  - clear priorities
  - regular updates
  - protecting people
  - adjusting the plan
  - recognition
  rubric:
    excellent: >-
      Plans shifts and rest, maintains priorities and updates, protects people and recognises effort.
    good: Organises shifts.
    weak: Relies on a few heroes.
  followups:
  - How did you pace?
  - Who rested when?
  common_errors:
  - 'Answering in the weak pattern: relies on a few heroes'

- external_key: leadership.crisis_leadership.dealing_with_a_hero
  competency_key: people_management
  topic: An engineer who always saves the day
  difficulty: medium
  text: >-
    One engineer is the hero in every incident. Is that a problem, and what do you do?
  expected_concepts:
  - single point of failure
  - burnout risk
  - sharing knowledge
  - recognition
  - pairing
  - reducing reliance
  rubric:
    excellent: >-
      Recognises the risk, shares knowledge and builds others' capability while valuing the person.
    good: Pairs others with them.
    weak: Welcomes the hero.
  followups:
  - How did the hero react?
  - Who grew in the process?
  common_errors:
  - 'Answering in the weak pattern: welcomes the hero'

- external_key: leadership.crisis_leadership.incident_metrics_use
  competency_key: project_management
  topic: Using incident data
  difficulty: medium
  text: >-
    What do you look at across incidents to find patterns, and what have you done with them?
  expected_concepts:
  - categories
  - time to detect and recover
  - repeat causes
  - trends
  - action completion
  - reporting
  rubric:
    excellent: >-
      Uses categories and times to find patterns and shows actions that reduced incidents.
    good: Collects data and shares it.
    weak: Reviews incidents only individually.
  followups:
  - What pattern did you find?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: reviews incidents only individually'

- external_key: leadership.crisis_leadership.early_decision_to_declare
  competency_key: incident_response
  topic: When to declare an incident
  difficulty: medium
  text: >-
    There is a degraded service but no clear failure yet. How do you decide whether to declare an incident?
  expected_concepts:
  - customer impact signals
  - low cost of declaring
  - criteria
  - culture of declaring early
  - escalation
  - closing out
  rubric:
    excellent: >-
      Uses impact signals and a low threshold, supports the culture of early declaration and closes properly.
    good: Declares when impact is clear.
    weak: Waits for proof.
  followups:
  - Have you declared and been wrong?
  - How did the team respond?
  common_errors:
  - 'Answering in the weak pattern: waits for proof'

- external_key: leadership.crisis_leadership.leadership_during_layoff_news
  competency_key: leadership
  topic: Company-level bad news
  difficulty: medium
  text: >-
    Your company announces difficult news, such as cuts or a failed deal, and your team is worried. How do you lead them?
  expected_concepts:
  - sharing what you know
  - saying what you do not
  - listening
  - keeping priorities clear
  - being available
  - avoiding speculation
  rubric:
    excellent: >-
      Shares what is known and not, listens, keeps priorities clear and remains available.
    good: Holds a team meeting.
    weak: Avoids the topic.
  followups:
  - What questions did people ask?
  - What could you not answer?
  common_errors:
  - 'Answering in the weak pattern: avoids the topic'

- external_key: leadership.crisis_leadership.stepping_back_in_crisis
  competency_key: leadership
  topic: Letting the right person lead
  difficulty: medium
  text: >-
    In a crisis someone on your team has more expertise than you. How do you handle leadership?
  expected_concepts:
  - separating coordination from expertise
  - backing the expert
  - clear communication
  - supporting
  - taking the stakeholder load
  rubric:
    excellent: >-
      Backs the expert technically, takes the coordination and stakeholder load and communicates the arrangement.
    good: Defers to the expert.
    weak: Insists on leading technically.
  followups:
  - What did you do yourself?
  - How did the expert feel?
  common_errors:
  - 'Answering in the weak pattern: insists on leading technically'

- external_key: leadership.crisis_leadership.recovering_customer_data_trust
  competency_key: communication
  topic: Explaining a problem customers will find
  difficulty: medium
  text: >-
    You find a problem that customers will discover, such as a billing error. How do you decide whether and how to tell them?
  expected_concepts:
  - scope
  - harm
  - duty
  - speed
  - clear message
  - remediation
  - internal approvals
  rubric:
    excellent: >-
      Scopes and assesses harm, tells customers quickly and clearly with remediation and gets approvals.
    good: Informs affected customers.
    weak: Waits to see if anyone notices.
  followups:
  - Who approved the message?
  - What remediation did you offer?
  common_errors:
  - 'Answering in the weak pattern: waits to see if anyone notices'

- external_key: leadership.crisis_leadership.recovery_planning_for_disaster
  competency_key: incident_response
  topic: Planning for a catastrophic event
  difficulty: hard
  text: >-
    How have you prepared for a large-scale failure such as loss of a region or critical dataset, and how did you test it?
  expected_concepts:
  - scenarios
  - recovery objectives
  - backups and failover
  - drills
  - gaps found
  - ownership
  - costs
  rubric:
    excellent: >-
      Defines scenarios and objectives, tests with drills, finds and closes gaps and weighs costs.
    good: Has a plan and tested some parts.
    weak: Has a plan that was never tested.
  followups:
  - What failed in the drill?
  - What objective did you set?
  common_errors:
  - 'Answering in the weak pattern: has a plan that was never tested'

- external_key: leadership.crisis_leadership.balancing_transparency_and_panic
  competency_key: communication
  topic: Sharing bad news without causing alarm
  difficulty: hard
  text: >-
    You need to share serious bad news with the organisation without causing unhelpful alarm. How do you do it?
  expected_concepts:
  - facts
  - context
  - actions
  - what people should do
  - timing
  - channels
  - answering questions
  rubric:
    excellent: >-
      Shares facts and context, explains actions and what people should do, uses suitable channels and invites questions.
    good: Shares facts and actions.
    weak: Downplays or exaggerates.
  followups:
  - What reaction did you see?
  - What did you leave out and why?
  common_errors:
  - 'Answering in the weak pattern: downplays or exaggerates'

- external_key: leadership.crisis_leadership.after_action_with_hostile_audience
  competency_key: communication
  topic: A tense review meeting
  difficulty: hard
  text: >-
    You lead a post-incident meeting where participants are defensive and angry. How do you run it?
  expected_concepts:
  - ground rules
  - facts
  - separating issues
  - giving voice
  - keeping to the timeline
  - ending with actions
  rubric:
    excellent: >-
      Sets ground rules, keeps to facts, hears each side, steers to actions and follows up.
    good: Facilitates and keeps order.
    weak: Allows the meeting to turn into an argument.
  followups:
  - How did you start?
  - What would you do differently?
  common_errors:
  - 'Answering in the weak pattern: allows the meeting to turn into an argument'

- external_key: leadership.crisis_leadership.growing_leaders_through_crisis
  competency_key: mentoring
  topic: Developing people during incidents
  difficulty: hard
  text: >-
    How do you use the pressure of incidents to develop future leaders without risking the response?
  expected_concepts:
  - shadowing
  - assigned roles
  - support
  - debrief
  - escalating when needed
  - graduated responsibility
  - feedback
  rubric:
    excellent: >-
      Uses shadowing and graduated roles with support and debriefs, and keeps the response safe.
    good: Gives people lead roles with support.
    weak: Keeps leadership to themselves.
  followups:
  - Who led first?
  - How did you step in?
  common_errors:
  - 'Answering in the weak pattern: keeps leadership to themselves'

- external_key: leadership.crisis_leadership.systemic_fix_vs_firefight_funding
  competency_key: stakeholder_management
  topic: Getting resources for prevention
  difficulty: hard
  text: >-
    After an incident you need budget and time for a structural fix, but leadership wants new features. How do you make the
    case?
  expected_concepts:
  - cost of incidents
  - risk
  - options with cost
  - link to goals
  - milestones
  - agreement on trade-offs
  rubric:
    excellent: >-
      Quantifies cost and risk, presents options linked to goals, agrees milestones and trade-offs.
    good: Presents the risk and asks for time.
    weak: Argues without data.
  followups:
  - What numbers did you use?
  - What did you get?
  common_errors:
  - 'Answering in the weak pattern: argues without data'

- external_key: leadership.crisis_leadership.handling_a_leak_of_crisis_details
  competency_key: communication
  topic: Information leaking during a crisis
  difficulty: hard
  text: >-
    Details of a sensitive crisis leak to outside people before you are ready to speak. What do you do?
  expected_concepts:
  - finding the extent
  - acting on facts
  - speeding communication
  - internal reminder
  - avoiding witch hunts
  - reviewing information handling
  rubric:
    excellent: >-
      Assesses extent, accelerates accurate communication, reminds people of channels without a witch hunt and reviews handling.
    good: Communicates sooner and reminds people.
    weak: Hunts for the culprit.
  followups:
  - What did you say publicly?
  - How did you change information handling?
  common_errors:
  - 'Answering in the weak pattern: hunts for the culprit'

- external_key: leadership.crisis_leadership.lessons_across_many_crises
  competency_key: leadership
  topic: Your approach to crises over time
  difficulty: hard
  text: >-
    Looking across the crises you have led, what has changed in how you lead, and what do you still find hardest?
  expected_concepts:
  - specific changes
  - examples
  - mistakes
  - ongoing difficulty
  - development
  - how it influences the team
  rubric:
    excellent: >-
      Gives specific changes with examples, names mistakes and an ongoing difficulty and shows how it shapes the team.
    good: Describes some changes.
    weak: Gives general statements.
  followups:
  - What do you still get wrong?
  - What do you teach others?
  common_errors:
  - 'Answering in the weak pattern: gives general statements'

- external_key: leadership.crisis_leadership.crisis_ownership_across_org
  competency_key: ownership
  topic: Taking charge when nobody owns the problem
  difficulty: hard
  text: >-
    A serious problem appears that doesn't clearly belong to any team and everyone is waiting for someone else. What do you
    do?
  expected_concepts:
  - acting to avoid delay
  - naming a temporary owner
  - getting leaders' agreement
  - coordinating
  - resolving ownership afterwards
  - avoiding blame
  rubric:
    excellent: >-
      Steps in or names an owner quickly, secures agreement from leaders, coordinates and fixes ownership afterwards.
    good: Escalates to find an owner.
    weak: Waits for someone else.
  followups:
  - Who ended up owning it?
  - What did you do about the ownership gap?
  common_errors:
  - 'Answering in the weak pattern: waits for someone else'
