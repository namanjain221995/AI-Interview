# Curated questions: leadership round, crisis leadership (part 2 of 4).
# Focus: leading through incidents and crises, calm communication and follow-up. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.crisis_leadership.blameless_review_basics
  competency_key: incident_response
  topic: Reviewing an incident
  difficulty: easy
  text: >-
    How do you run a review after an incident so the team learns without anyone being blamed?
  expected_concepts:
  - timeline from evidence
  - contributing factors
  - asking why actions made sense
  - actions with owners
  - sharing results
  rubric:
    excellent: >-
      Builds a timeline, finds contributing factors, assigns actions with owners and shares them.
    good: Holds a review with actions.
    weak: Looks for who made the mistake.
  followups:
  - Who attended?
  - Which action mattered most?
  common_errors:
  - 'Answering in the weak pattern: looks for who made the mistake'

- external_key: leadership.crisis_leadership.asking_for_help_during_incident
  competency_key: incident_response
  topic: Calling in more people
  difficulty: easy
  text: >-
    How do you decide when to call in more people, and how do you do it without causing confusion?
  expected_concepts:
  - severity and time criteria
  - knowing who to call
  - briefing newcomers
  - keeping a single lead
  - rest for responders
  rubric:
    excellent: Uses criteria, briefs newcomers, retains a single lead and plans rest.
    good: Calls help when needed.
    weak: Hesitates to ask.
  followups:
  - Who did you call?
  - How did you brief them?
  common_errors:
  - 'Answering in the weak pattern: hesitates to ask'

- external_key: leadership.crisis_leadership.keeping_a_timeline
  competency_key: incident_response
  topic: Recording what happens
  difficulty: easy
  text: Why do you keep a live timeline during an incident, and what goes in it?
  expected_concepts:
  - timestamps
  - actions and results
  - decisions with reasons
  - observations
  - supports review and handover
  rubric:
    excellent: >-
      Describes the contents, who keeps it, and how it helped during or after the incident.
    good: Keeps a rough log.
    weak: Relies on memory afterwards.
  followups:
  - Who wrote it?
  - How did you use it afterwards?
  common_errors:
  - 'Answering in the weak pattern: relies on memory afterwards'

- external_key: leadership.crisis_leadership.after_hours_incident
  competency_key: incident_response
  topic: An incident outside working hours
  difficulty: easy
  text: >-
    Tell me about an incident that happened out of hours. How did you get the right people involved fairly?
  expected_concepts:
  - on-call system
  - escalation
  - fair rota
  - compensating time
  - handover
  - recovery time after
  rubric:
    excellent: >-
      Describes the escalation, fairness of the rota, compensation or time off and handover.
    good: Handles the escalation sensibly.
    weak: Calls the same people every time.
  followups:
  - How did you decide who to wake?
  - What recovery time did you give?
  common_errors:
  - 'Answering in the weak pattern: calls the same people every time'

- external_key: leadership.crisis_leadership.customer_facing_message
  competency_key: communication
  topic: Writing to customers
  difficulty: easy
  text: >-
    Have you written or approved a message to customers during an outage? What did you include?
  expected_concepts:
  - plain language
  - what happened and impact
  - what you are doing
  - what customers should do
  - next update
  - avoiding speculation
  rubric:
    excellent: >-
      Gives a clear plain message with impact, actions and next update, and avoids speculation.
    good: Gives a clear message.
    weak: Writes in technical jargon or blames others.
  followups:
  - Who approved it?
  - What did customers say?
  common_errors:
  - 'Answering in the weak pattern: writes in technical jargon or blames others'

- external_key: leadership.crisis_leadership.crisis_communication_internal
  competency_key: communication
  topic: Keeping the wider company informed
  difficulty: medium
  text: >-
    A major incident affects many internal teams. How do you keep them informed without disrupting the response?
  expected_concepts:
  - status page or channel
  - scheduled updates
  - audience-specific content
  - point of contact
  - avoiding speculation
  - closing message
  rubric:
    excellent: >-
      Sets a channel and rhythm, tailors content, nominates a contact and closes with a summary.
    good: Posts regular updates.
    weak: Answers each team individually.
  followups:
  - Which teams needed most?
  - How did you close it out?
  common_errors:
  - 'Answering in the weak pattern: answers each team individually'

- external_key: leadership.crisis_leadership.practice_drills
  competency_key: incident_response
  topic: Practising for incidents
  difficulty: medium
  text: Have you run a game day or incident drill? What did you learn?
  expected_concepts:
  - realistic scenario
  - safe setting
  - observers
  - roles practised
  - findings
  - follow-up
  rubric:
    excellent: >-
      Describes a realistic drill, safe conduct, findings and follow-ups that improved response.
    good: Ran a drill and noted gaps.
    weak: Has never practised.
  followups:
  - What gaps appeared?
  - What did you fix?
  common_errors:
  - 'Answering in the weak pattern: has never practised'

- external_key: leadership.crisis_leadership.incident_commander_handover_to_you
  competency_key: leadership
  topic: Taking over a struggling incident
  difficulty: medium
  text: >-
    You join an incident that has been running for hours and isn't going well. How do you take control?
  expected_concepts:
  - asking for a summary
  - confirming roles
  - pausing to take stock
  - setting a plan
  - respecting the current lead
  - communication
  rubric:
    excellent: >-
      Gets a summary, resets roles and plan, respects the existing lead and communicates the change.
    good: Takes over and asks for status.
    weak: Starts changing things without a summary.
  followups:
  - What did you stop?
  - How did the previous lead feel?
  common_errors:
  - 'Answering in the weak pattern: starts changing things without a summary'

- external_key: leadership.crisis_leadership.difficult_customer_escalation
  competency_key: stakeholder_management
  topic: An angry key customer
  difficulty: medium
  text: >-
    A key customer is angry about an outage and demands answers. How do you handle it?
  expected_concepts:
  - listening
  - facts
  - direct contact from the right person
  - commitments you can keep
  - follow-up
  - internal alignment
  rubric:
    excellent: >-
      Listens, shares facts, offers a contact, makes keepable commitments, follows up and aligns internally.
    good: Responds with facts and apology.
    weak: Defends or over-promises.
  followups:
  - What did you commit to?
  - How did you follow up?
  common_errors:
  - 'Answering in the weak pattern: defends or over-promises'

- external_key: leadership.crisis_leadership.ambiguous_alerts
  competency_key: observability
  topic: Responding with unclear signals
  difficulty: medium
  text: >-
    Alerts are firing but nobody can tell what is really wrong. How do you organise the response?
  expected_concepts:
  - confirming real customer impact
  - prioritising alerts
  - gathering evidence
  - dividing investigation
  - avoiding changes without evidence
  - communicating uncertainty
  rubric:
    excellent: >-
      Checks real impact, prioritises, divides the investigation, avoids blind changes and communicates uncertainty.
    good: Investigates with some coordination.
    weak: Chases every alert at once.
  followups:
  - How did you find true impact?
  - What did you ignore?
  common_errors:
  - 'Answering in the weak pattern: chases every alert at once'

- external_key: leadership.crisis_leadership.scope_creep_in_incident
  competency_key: incident_response
  topic: Fixing too many things at once
  difficulty: medium
  text: >-
    During an incident people start proposing unrelated improvements. How do you keep focus?
  expected_concepts:
  - stating the goal
  - parking items
  - recording ideas
  - limiting changes
  - changes one at a time
  - review later
  rubric:
    excellent: >-
      States the goal, parks ideas, limits and sequences changes and picks up ideas in the review.
    good: Keeps people on topic.
    weak: Allows changes without control.
  followups:
  - How do you track parked items?
  - What happened to them?
  common_errors:
  - 'Answering in the weak pattern: allows changes without control'

- external_key: leadership.crisis_leadership.production_change_freeze
  competency_key: project_management
  topic: Using a freeze
  difficulty: medium
  text: >-
    After a series of incidents you consider freezing changes. How do you decide and manage it?
  expected_concepts:
  - weighing cost and benefit
  - criteria and duration
  - exceptions process
  - communication
  - plan to resume
  - root causes
  rubric:
    excellent: >-
      Weighs the costs, sets criteria and exit, defines exceptions, communicates and addresses root causes.
    good: Freezes briefly and explains.
    weak: Freezes without exit criteria.
  followups:
  - What was the exit criterion?
  - What exceptions were allowed?
  common_errors:
  - 'Answering in the weak pattern: freezes without exit criteria'

- external_key: leadership.crisis_leadership.team_conflict_during_crisis
  competency_key: people_management
  topic: Friction between responders
  difficulty: medium
  text: Two responders begin arguing during an incident. What do you do?
  expected_concepts:
  - refocusing on the goal
  - separating them if needed
  - short private word
  - roles
  - follow-up afterwards
  rubric:
    excellent: Refocuses, separates tasks, addresses privately and follows up.
    good: Calls for focus and deals with it later.
    weak: Ignores the argument.
  followups:
  - What did you say to them?
  - What happened later?
  common_errors:
  - 'Answering in the weak pattern: ignores the argument'

- external_key: leadership.crisis_leadership.recognising_emerging_crisis
  competency_key: leadership
  topic: Seeing a crisis building
  difficulty: medium
  text: >-
    Tell me about spotting a problem early before it became a crisis. What signs did you notice?
  expected_concepts:
  - weak signals
  - checking
  - escalation
  - preparing
  - communicating
  - outcome
  rubric:
    excellent: >-
      Describes early signals, verification, early escalation and preparation, with a contained outcome.
    good: Spots a problem and raises it.
    weak: Responds only after impact.
  followups:
  - Who dismissed it?
  - What did you prepare?
  common_errors:
  - 'Answering in the weak pattern: responds only after impact'

- external_key: leadership.crisis_leadership.reputational_incident
  competency_key: stakeholder_management
  topic: A public failure
  difficulty: medium
  text: >-
    Your service has a failure that is reported in the press or on social media. How do you respond?
  expected_concepts:
  - working with communications
  - facts
  - consistent message
  - speed with accuracy
  - customers first
  - review
  rubric:
    excellent: >-
      Coordinates with communications, shares accurate facts quickly, keeps a consistent message and puts customers first.
    good: Responds with a statement.
    weak: Stays silent.
  followups:
  - Who approved the statement?
  - What did you correct?
  common_errors:
  - 'Answering in the weak pattern: stays silent'

- external_key: leadership.crisis_leadership.runbook_gap_in_crisis
  competency_key: incident_response
  topic: Runbook failed during an incident
  difficulty: medium
  text: >-
    The runbook you relied on during an incident was wrong or missing. What did you do then and after?
  expected_concepts:
  - improvising safely
  - recording the gap
  - asking experts
  - updating after
  - testing runbooks
  - ownership of upkeep
  rubric:
    excellent: >-
      Improvises carefully, records the gap, updates and tests the runbook and assigns upkeep.
    good: Updates the runbook afterwards.
    weak: Blames the runbook author.
  followups:
  - How did you improvise?
  - How do you test runbooks now?
  common_errors:
  - 'Answering in the weak pattern: blames the runbook author'

- external_key: leadership.crisis_leadership.on_call_burden_after_incident
  competency_key: people_management
  topic: Reducing the toll of on-call
  difficulty: medium
  text: After a bad month, your on-call people are worn down. What do you change?
  expected_concepts:
  - measuring load
  - reducing noise
  - fixing top causes
  - rota changes
  - time off
  - leadership support
  rubric:
    excellent: >-
      Measures load, reduces noise, fixes top causes, changes the rota and gives time off.
    good: Reduces alerts and adjusts the rota.
    weak: Asks people to cope.
  followups:
  - What was the biggest source of noise?
  - How did you measure improvement?
  common_errors:
  - 'Answering in the weak pattern: asks people to cope'

- external_key: leadership.crisis_leadership.legal_and_pr_collision
  competency_key: stakeholder_management
  topic: Competing demands from legal and communications
  difficulty: hard
  text: >-
    Legal wants minimal public information while customer support wants to be fully open. How do you handle the conflict?
  expected_concepts:
  - understanding each concern
  - shared facts
  - drafting jointly
  - escalating to a decision maker
  - customer interest
  - timing
  rubric:
    excellent: >-
      Understands both positions, builds a joint draft based on facts, escalates when needed and keeps customers' interests
      in view.
    good: Mediates and finds a compromise.
    weak: Sides with one group.
  followups:
  - What was the compromise?
  - Who decided?
  common_errors:
  - 'Answering in the weak pattern: sides with one group'

- external_key: leadership.crisis_leadership.cascading_leader_errors
  competency_key: leadership
  topic: Your boss gives a wrong instruction
  difficulty: hard
  text: >-
    During a crisis your boss gives an instruction that you think will make things worse. What do you do?
  expected_concepts:
  - raising it directly with evidence
  - proposing an alternative
  - clear escalation
  - time pressure
  - accepting the decision
  - documenting
  rubric:
    excellent: >-
      Raises concerns with evidence and an alternative, escalates if the risk is serious, and documents.
    good: States concerns and follows the decision.
    weak: Complies silently or refuses in public.
  followups:
  - What was your evidence?
  - What happened?
  common_errors:
  - 'Answering in the weak pattern: complies silently or refuses in public'

- external_key: leadership.crisis_leadership.post_crisis_organisation_change
  competency_key: leadership
  topic: Making lasting change after a crisis
  difficulty: hard
  text: >-
    A crisis exposed deep problems in your team's practices. How do you turn that into lasting change instead of a short burst
    of effort?
  expected_concepts:
  - sponsorship
  - prioritised roadmap
  - measures
  - ownership
  - regular review
  - avoiding fatigue
  - embedding in routine
  rubric:
    excellent: >-
      Gets sponsorship, creates a prioritised roadmap with owners and measures, embeds changes and reviews regularly.
    good: Plans improvements and tracks them.
    weak: Makes promises that fade.
  followups:
  - What survived after six months?
  - What did you drop?
  common_errors:
  - 'Answering in the weak pattern: makes promises that fade'

- external_key: leadership.crisis_leadership.coordinating_with_unfriendly_team
  competency_key: collaboration
  topic: Needing help from a team that is unhelpful
  difficulty: hard
  text: >-
    During an incident another team is slow to help because they feel blamed. How do you get their help?
  expected_concepts:
  - reducing blame
  - shared goal
  - respectful requests
  - escalation
  - making their work visible
  - repairing afterwards
  rubric:
    excellent: >-
      Reduces blame, frames shared goals, asks respectfully, escalates if needed and repairs the relationship later.
    good: Asks them politely and escalates.
    weak: Complains about them in the channel.
  followups:
  - What did they need from you?
  - How did you repair it?
  common_errors:
  - 'Answering in the weak pattern: complains about them in the channel'

- external_key: leadership.crisis_leadership.limited_information_exec_decision
  competency_key: leadership
  topic: Deciding when evidence is poor
  difficulty: hard
  text: >-
    You must decide in minutes with poor information whether to fail over a major system. How do you decide?
  expected_concepts:
  - what is known
  - cost of delay
  - reversibility
  - expert input
  - stating assumptions
  - a decision point
  - review
  rubric:
    excellent: >-
      States what is known, weighs delay and reversibility, takes expert input, states assumptions and sets a review point.
    good: Decides using available information.
    weak: Waits for complete information.
  followups:
  - What assumptions did you state?
  - How did it turn out?
  common_errors:
  - 'Answering in the weak pattern: waits for complete information'

- external_key: leadership.crisis_leadership.pushing_back_on_recovery_deadlines
  competency_key: stakeholder_management
  topic: An unrealistic recovery demand
  difficulty: hard
  text: >-
    Executives demand that service be restored within an hour, which you believe is unsafe. How do you respond?
  expected_concepts:
  - explaining risks
  - offering options
  - partial recovery
  - being clear on what you can promise
  - agreeing on risk
  - documenting
  rubric:
    excellent: >-
      Explains risk, offers options such as partial recovery, commits to what is credible and documents the agreed risk.
    good: Explains and negotiates.
    weak: Promises the deadline or refuses with no options.
  followups:
  - What option did you offer?
  - What happened?
  common_errors:
  - 'Answering in the weak pattern: promises the deadline or refuses with no options'

- external_key: leadership.crisis_leadership.mistake_in_public_statement
  competency_key: communication
  topic: Correcting something you told customers
  difficulty: hard
  text: You find that an earlier public update contained an error. What do you do?
  expected_concepts:
  - confirming quickly
  - correcting openly
  - explaining briefly
  - informing internal teams
  - learning about approvals
  - avoiding blame
  rubric:
    excellent: >-
      Confirms, corrects openly and promptly, informs internal teams and improves the approval process.
    good: Corrects the statement.
    weak: Leaves it uncorrected.
  followups:
  - How did customers respond?
  - What did you change in approvals?
  common_errors:
  - 'Answering in the weak pattern: leaves it uncorrected'

- external_key: leadership.crisis_leadership.workforce_risk_in_crisis
  competency_key: people_management
  topic: Pushing people too hard
  difficulty: hard
  text: >-
    You realise a crisis has led your team to work dangerously long hours. How do you intervene?
  expected_concepts:
  - recognising signs
  - requiring rest
  - reassigning
  - support
  - adjusting expectations
  - communicating with leaders
  - follow-up
  rubric:
    excellent: >-
      Recognises the risk, enforces rest, redistributes work, resets expectations and checks on wellbeing afterwards in terms
      of workload.
    good: Gives breaks and redistributes.
    weak: Praises the dedication.
  followups:
  - Who pushed back?
  - What did you give up?
  common_errors:
  - 'Answering in the weak pattern: praises the dedication'
