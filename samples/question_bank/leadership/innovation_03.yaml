# Curated questions: leadership round, innovation (part 3 of 4).
# Focus: innovation and continuous improvement, experimentation and learning culture. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.innovation.borrowing_ideas
  competency_key: adaptability
  topic: Learning from other teams
  difficulty: easy
  text: >-
    Tell me about an idea you borrowed from another team or company and adapted. How did you adapt it?
  expected_concepts:
  - noticing the idea
  - understanding why it worked there
  - adjusting to context
  - trial
  - feedback
  rubric:
    excellent: >-
      Understands why it worked, adapts it to the context, trials it and reports the result.
    good: Adopts with some adaptation.
    weak: Copies it unchanged.
  followups:
  - What did you change?
  - What did not transfer?
  common_errors:
  - 'Answering in the weak pattern: copies it unchanged'

- external_key: leadership.innovation.speaking_up_about_old_habits
  competency_key: leadership
  topic: Challenging how things are done
  difficulty: easy
  text: >-
    Describe a time you questioned a long-standing way of doing things in your team. How did you raise it?
  expected_concepts:
  - understanding history
  - evidence
  - respectful framing
  - proposing an alternative
  - listening
  - outcome
  rubric:
    excellent: >-
      Learns the history, brings evidence, proposes an alternative respectfully and reports the outcome.
    good: Raises the issue with an alternative.
    weak: Complains without a proposal.
  followups:
  - What was the history?
  - Who disagreed?
  common_errors:
  - 'Answering in the weak pattern: complains without a proposal'

- external_key: leadership.innovation.automation_of_toil
  competency_key: problem_solving
  topic: Removing repetitive work
  difficulty: easy
  text: >-
    Tell me about automating something your team did by hand over and over. How did you pick it?
  expected_concepts:
  - measuring time spent
  - frequency
  - effort to automate
  - risk
  - maintenance
  - sharing
  rubric:
    excellent: >-
      Measures time and frequency, compares effort to benefit, delivers and maintains, and shares it.
    good: Automates a clear candidate.
    weak: Automates what is interesting.
  followups:
  - How much time did it save?
  - Who maintains it?
  common_errors:
  - 'Answering in the weak pattern: automates what is interesting'

- external_key: leadership.innovation.customer_insight_to_idea
  competency_key: product_sense
  topic: An idea from customers
  difficulty: easy
  text: >-
    Have you turned something you learned from customers or users into a change? Tell me about it.
  expected_concepts:
  - the observation
  - verifying with more users
  - shaping the idea
  - small test
  - result
  rubric:
    excellent: >-
      Makes the link from observation to idea, verifies it, tests it small and reports the result.
    good: Acts on feedback.
    weak: Builds without validating.
  followups:
  - How did you verify it?
  - What did you learn?
  common_errors:
  - 'Answering in the weak pattern: builds without validating'

- external_key: leadership.innovation.sharing_new_knowledge
  competency_key: communication
  topic: Sharing what you learned
  difficulty: easy
  text: How do you share a new approach or technique you've learned with your team?
  expected_concepts:
  - short demos
  - written summary
  - applying it to real work
  - inviting questions
  - follow-up
  rubric:
    excellent: >-
      Uses demos and practical application, invites questions and follows up on adoption.
    good: Gives a talk or write-up.
    weak: Keeps it to themselves.
  followups:
  - What did people adopt?
  - What format works best?
  common_errors:
  - 'Answering in the weak pattern: keeps it to themselves'

- external_key: leadership.innovation.quick_wins_vs_long_bets
  competency_key: project_management
  topic: Short and long term improvements
  difficulty: medium
  text: How do you mix quick wins with longer-term improvements in your plans?
  expected_concepts:
  - portfolio
  - capacity split
  - visible wins to keep support
  - long-term milestones
  - review
  - trade-offs
  rubric:
    excellent: >-
      Splits capacity, uses quick wins to build support and tracks long-term milestones.
    good: Includes both.
    weak: Does only quick wins or only long bets.
  followups:
  - What was the split?
  - What long bet paid off?
  common_errors:
  - 'Answering in the weak pattern: does only quick wins or only long bets'

- external_key: leadership.innovation.improving_onboarding_by_innovation
  competency_key: mentoring
  topic: Improving a process by listening to newcomers
  difficulty: medium
  text: How have you used feedback from new joiners to improve something your team does?
  expected_concepts:
  - asking systematically
  - patterns
  - changes
  - thanking
  - checking again
  - documentation
  rubric:
    excellent: Asks systematically, finds patterns, makes changes and checks again.
    good: Makes changes from feedback.
    weak: Does not ask.
  followups:
  - What did newcomers notice?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: does not ask'

- external_key: leadership.innovation.partnership_with_research
  competency_key: collaboration
  topic: Working with users and researchers
  difficulty: medium
  text: >-
    How do you work with user researchers or customers to shape new ideas before building?
  expected_concepts:
  - early contact
  - shared questions
  - observing real use
  - sharing findings
  - adjusting
  - joint decisions
  rubric:
    excellent: Engages early, shares questions, observes real use and adjusts the plan.
    good: Seeks customer input.
    weak: Builds first.
  followups:
  - What did you observe?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: builds first'

- external_key: leadership.innovation.sustaining_innovation_over_time
  competency_key: leadership
  topic: Keeping the momentum
  difficulty: medium
  text: >-
    How do you keep improvement energy going over a long time and not just for a few weeks?
  expected_concepts:
  - visible wins
  - regular rhythm
  - ownership shared
  - leadership attention
  - removing blockers
  - refreshing goals
  rubric:
    excellent: >-
      Uses visible wins, regular rhythm, shared ownership and refreshed goals, with evidence of sustained effort.
    good: Maintains a rhythm.
    weak: Starts strongly and fades.
  followups:
  - What did you do when it faded?
  - Who kept it going?
  common_errors:
  - 'Answering in the weak pattern: starts strongly and fades'

- external_key: leadership.innovation.inviting_outside_perspectives
  competency_key: adaptability
  topic: Learning from outside
  difficulty: medium
  text: >-
    How do you bring in outside ideas such as from other companies, communities or other disciplines?
  expected_concepts:
  - networks
  - conferences or reading
  - invited talks
  - visiting other teams
  - applying carefully
  - sharing back
  rubric:
    excellent: Uses several channels, applies carefully and shares back, with examples.
    good: Uses some channels.
    weak: Relies on internal ideas only.
  followups:
  - Which idea did you take?
  - What did you reject?
  common_errors:
  - 'Answering in the weak pattern: relies on internal ideas only'

- external_key: leadership.innovation.cost_of_experiments
  competency_key: leadership
  topic: When experiments are too expensive
  difficulty: medium
  text: When is an experiment not worth running, and what do you do instead?
  expected_concepts:
  - cost
  - speed of learning
  - reversibility
  - alternative evidence
  - judgment
  - decision criteria
  rubric:
    excellent: >-
      Weighs costs and learning speed and uses alternatives such as research or expert input.
    good: Declines expensive tests with reasoning.
    weak: Tests everything.
  followups:
  - What alternative did you use?
  - How did you decide?
  common_errors:
  - 'Answering in the weak pattern: tests everything'

- external_key: leadership.innovation.handling_failed_innovation_blame
  competency_key: leadership
  topic: When an idea fails publicly
  difficulty: medium
  text: >-
    An idea you sponsored fails visibly. How do you handle it with your team and leaders?
  expected_concepts:
  - owning it
  - sharing findings
  - protecting people
  - decision quality review
  - what next
  - keeping risk-taking safe
  rubric:
    excellent: >-
      Owns it, shares findings, protects the team, reviews decision quality and keeps risk-taking safe.
    good: Owns it and shares lessons.
    weak: Blames others.
  followups:
  - What did you tell your leaders?
  - What happened next?
  common_errors:
  - 'Answering in the weak pattern: blames others'

- external_key: leadership.innovation.process_simplification
  competency_key: problem_solving
  topic: Removing steps
  difficulty: medium
  text: Tell me about simplifying a process by removing steps instead of adding tools.
  expected_concepts:
  - mapping steps
  - value of each
  - removing
  - checking risk
  - communicating
  - measuring
  rubric:
    excellent: Maps steps, tests the value of each, removes and verifies effect.
    good: Removes some steps.
    weak: Adds tooling.
  followups:
  - What step did you remove?
  - What risk did you check?
  common_errors:
  - 'Answering in the weak pattern: adds tooling'

- external_key: leadership.innovation.competing_improvement_priorities
  competency_key: stakeholder_management
  topic: Aligning improvement work with stakeholders
  difficulty: medium
  text: >-
    Stakeholders think improvement work is a distraction from features. How do you make the case?
  expected_concepts:
  - link to outcomes
  - evidence
  - small steps
  - shared goals
  - agreed capacity
  - reporting results
  rubric:
    excellent: >-
      Links improvements to outcomes with evidence, agrees capacity and reports results.
    good: Explains the benefit.
    weak: Does improvements covertly.
  followups:
  - What evidence worked?
  - What did you agree?
  common_errors:
  - 'Answering in the weak pattern: does improvements covertly'

- external_key: leadership.innovation.idea_from_a_junior
  competency_key: mentoring
  topic: An idea from the newest person
  difficulty: medium
  text: A new team member proposes a different approach. How do you give it a fair test?
  expected_concepts:
  - listening
  - clarifying
  - criteria
  - small trial
  - credit
  - feedback
  rubric:
    excellent: Listens, clarifies, trials against criteria, credits and gives feedback.
    good: Listens and tries.
    weak: Dismisses because of inexperience.
  followups:
  - Did it work?
  - What feedback did you give?
  common_errors:
  - 'Answering in the weak pattern: dismisses because of inexperience'

- external_key: leadership.innovation.shared_learning_across_orgs
  competency_key: communication
  topic: Spreading lessons across teams
  difficulty: medium
  text: >-
    How do you spread what your team learns to other teams so the organisation learns?
  expected_concepts:
  - write-ups
  - communities
  - talks
  - office hours
  - templates
  - measuring uptake
  rubric:
    excellent: Uses several channels, makes lessons easy to reuse and measures uptake.
    good: Shares some lessons.
    weak: Does not share beyond the team.
  followups:
  - What was picked up?
  - How did you make it reusable?
  common_errors:
  - 'Answering in the weak pattern: does not share beyond the team'

- external_key: leadership.innovation.tech_radar_or_standards_change
  competency_key: leadership
  topic: Updating accepted practices
  difficulty: medium
  text: >-
    How do you decide when to change an accepted practice or standard in your organisation?
  expected_concepts:
  - evidence
  - consultation
  - pilots
  - migration cost
  - communication
  - review
  rubric:
    excellent: Uses evidence and pilots, consults, plans migration cost and communicates.
    good: Changes after discussion.
    weak: Never changes or changes by decree.
  followups:
  - What evidence did you gather?
  - How did you manage migration?
  common_errors:
  - 'Answering in the weak pattern: never changes or changes by decree'

- external_key: leadership.innovation.unexpected_use
  competency_key: product_sense
  topic: Discovering a different use
  difficulty: medium
  text: >-
    Have you discovered that people used something your team built in an unexpected way? What did you do?
  expected_concepts:
  - noticing
  - understanding
  - asking users
  - deciding to support
  - adapting
  - sharing
  rubric:
    excellent: >-
      Notices through data or contact, understands the need, adapts and shares the finding.
    good: Learns from the use.
    weak: Ignores it.
  followups:
  - What did users want?
  - What did you change?
  common_errors:
  - 'Answering in the weak pattern: ignores it'

- external_key: leadership.innovation.idea_theft_or_credit
  competency_key: collaboration
  topic: Credit for ideas
  difficulty: hard
  text: Credit for a team's idea goes to a more senior person. How do you handle it?
  expected_concepts:
  - facts
  - private conversation
  - correcting the record
  - protecting the team
  - process changes
  rubric:
    excellent: >-
      Collects facts, talks privately, corrects the record, protects the team and changes the process.
    good: Raises the issue.
    weak: Says nothing.
  followups:
  - What did you say?
  - How did the senior person respond?
  common_errors:
  - 'Answering in the weak pattern: says nothing'

- external_key: leadership.innovation.using_ai_tools_responsibly
  competency_key: adaptability
  topic: Adopting new productivity tools
  difficulty: hard
  text: >-
    Your team wants to adopt AI-based coding or writing tools. How do you decide what to allow and how to manage the risks?
  expected_concepts:
  - use cases
  - data protection
  - quality review
  - licensing
  - training
  - measurement
  - policy
  - feedback
  rubric:
    excellent: >-
      Defines use cases and policy, protects data, keeps review, measures effects and adjusts.
    good: Pilots with guidelines.
    weak: Bans or adopts without guidance.
  followups:
  - What risks did you set limits for?
  - How did you measure value?
  common_errors:
  - 'Answering in the weak pattern: bans or adopts without guidance'

- external_key: leadership.innovation.knowing_when_good_enough
  competency_key: leadership
  topic: Stopping improvement
  difficulty: hard
  text: >-
    When do you decide that something is good enough and improvement effort should go elsewhere?
  expected_concepts:
  - diminishing returns
  - goals
  - cost
  - opportunity cost
  - stakeholders
  - revisiting
  rubric:
    excellent: Uses goals, returns and opportunity cost to decide, communicates and revisits.
    good: Stops at goals.
    weak: Perfects endlessly.
  followups:
  - What was the last thing you stopped improving?
  - How did you know?
  common_errors:
  - 'Answering in the weak pattern: perfects endlessly'

- external_key: leadership.innovation.rewarding_improvement_in_reviews
  competency_key: people_management
  topic: Valuing improvement work in evaluation
  difficulty: hard
  text: >-
    Improvement work is rarely rewarded compared with feature delivery. How do you make sure it counts in performance and
    promotion?
  expected_concepts:
  - criteria
  - evidence of impact
  - recognition
  - calibration
  - examples
  - leader modelling
  rubric:
    excellent: >-
      Includes improvement impact in criteria, collects evidence, calibrates and recognises it.
    good: Mentions it in reviews.
    weak: Rewards only features.
  followups:
  - How did you measure impact?
  - What changed in promotions?
  common_errors:
  - 'Answering in the weak pattern: rewards only features'

- external_key: leadership.innovation.organisation_wide_improvement
  competency_key: leadership
  topic: Improvement across many teams
  difficulty: hard
  text: How would you lead an improvement that needs many teams to change what they do?
  expected_concepts:
  - shared problem
  - evidence
  - coalition
  - pilot teams
  - support
  - incentives
  - measures
  - adaptation
  rubric:
    excellent: >-
      Shares the problem and evidence, builds a coalition, pilots, supports and measures.
    good: Pilots and expands.
    weak: Mandates change.
  followups:
  - Which team was first?
  - What changed after the pilot?
  common_errors:
  - 'Answering in the weak pattern: mandates change'

- external_key: leadership.innovation.cultural_resistance_to_failure
  competency_key: culture_values
  topic: A culture that avoids visible failure
  difficulty: hard
  text: People in your organisation hide failed experiments. What do you do?
  expected_concepts:
  - leader behaviour
  - sharing own failures
  - reviews
  - incentives
  - safe forums
  - measuring reporting
  rubric:
    excellent: Models behaviour, creates safe forums, aligns incentives and measures reporting.
    good: Encourages sharing.
    weak: Demands reporting.
  followups:
  - What did you share yourself?
  - What changed in reporting?
  common_errors:
  - 'Answering in the weak pattern: demands reporting'

- external_key: leadership.innovation.regretted_decision_to_experiment
  competency_key: ownership
  topic: An experiment that caused harm
  difficulty: hard
  text: An experiment you approved caused a problem for users. How did you respond?
  expected_concepts:
  - stopping it
  - informing
  - remediation
  - owning
  - review
  - changes to approval
  rubric:
    excellent: Stops quickly, informs, remediates, owns it and changes approval.
    good: Stops and fixes.
    weak: Defends.
  followups:
  - Who was affected?
  - What approval change did you make?
  common_errors:
  - 'Answering in the weak pattern: defends'
