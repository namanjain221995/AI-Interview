# Curated questions: leadership round, crisis leadership (part 1 of 4).
# Focus: leading through incidents and crises, calm communication and follow-up. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.crisis_leadership.first_big_incident
  competency_key: incident_response
  topic: Your first major incident
  difficulty: easy
  text: >-
    Tell me about the first serious production incident you were involved in leading. What did you do in the first fifteen
    minutes?
  expected_concepts:
  - confirming impact and severity
  - assigning roles
  - opening a shared channel
  - stabilising before diagnosing
  - first update to stakeholders
  rubric:
    excellent: >-
      Describes a clear sequence of confirming impact, assigning roles, communicating and stabilising, and reflects on what
      they would do differently.
    good: Gives a reasonable sequence with some structure.
    weak: Describes jumping straight into debugging with no coordination.
  followups:
  - Who else was involved?
  - What would you do differently?
  common_errors:
  - >-
    Answering in the weak pattern: describes jumping straight into debugging with no coordination

- external_key: leadership.crisis_leadership.roles_in_an_incident
  competency_key: incident_response
  topic: Incident roles
  difficulty: easy
  text: What roles do you set up when an incident starts, and why do you separate them?
  expected_concepts:
  - incident lead
  - technical responders
  - communications owner
  - scribe
  - protecting the lead from hands-on work
  - handover of roles
  rubric:
    excellent: >-
      Names the roles, explains why separating them helps focus, and gives an example of the benefit.
    good: Names most roles with some reasoning.
    weak: Has everyone work on the problem at once.
  followups:
  - Who writes the timeline?
  - When did you hand over the lead role?
  common_errors:
  - 'Answering in the weak pattern: has everyone work on the problem at once'

- external_key: leadership.crisis_leadership.first_message_to_stakeholders
  competency_key: communication
  topic: The first update
  difficulty: easy
  text: >-
    What do you include in the first message to stakeholders during an incident, even when you don't yet know the cause?
  expected_concepts:
  - what is affected
  - what is known and unknown
  - who is working on it
  - when the next update comes
  - a contact point
  rubric:
    excellent: >-
      Shares impact, known and unknown, owners and next update time, with an example message.
    good: Gives impact and an update promise.
    weak: Waits until the cause is known.
  followups:
  - How often do you update?
  - What do you leave out?
  common_errors:
  - 'Answering in the weak pattern: waits until the cause is known'

- external_key: leadership.crisis_leadership.regular_update_rhythm
  competency_key: communication
  topic: Setting an update cadence
  difficulty: easy
  text: >-
    How do you decide how often to update people during a long incident, and what do you say when nothing has changed?
  expected_concepts:
  - cadence by severity
  - saying what has been tried
  - keeping the promise to update
  - naming next steps
  - a single channel
  rubric:
    excellent: >-
      Sets a cadence by severity, reports progress even when nothing changed, and keeps the promise.
    good: Updates regularly.
    weak: Updates only when there is news.
  followups:
  - What if you have nothing to report?
  - Who asks you for extra updates?
  common_errors:
  - 'Answering in the weak pattern: updates only when there is news'

- external_key: leadership.crisis_leadership.stabilise_before_fix
  competency_key: incident_response
  topic: Mitigating before finding the root cause
  difficulty: easy
  text: >-
    Why might you restore service before you understand the cause, and how do you decide?
  expected_concepts:
  - reducing customer impact first
  - rollback or failover options
  - preserving evidence
  - risk of the mitigation
  - follow-up for root cause
  rubric:
    excellent: >-
      Explains impact-first reasoning, names mitigation options, preserves evidence and gives an example.
    good: Understands mitigation first.
    weak: Insists on finding the cause before acting.
  followups:
  - What evidence did you save?
  - When did you not rollback?
  common_errors:
  - 'Answering in the weak pattern: insists on finding the cause before acting'

- external_key: leadership.crisis_leadership.conflicting_theories
  competency_key: incident_response
  topic: Two theories, one outage
  difficulty: medium
  text: >-
    Two engineers in an incident disagree strongly on the cause, and each wants to try a different fix. How do you proceed?
  expected_concepts:
  - stating hypotheses and evidence
  - cheapest reversible test first
  - ordering by risk
  - parallel work if safe
  - recording
  - keeping respect
  rubric:
    excellent: >-
      Frames each hypothesis with evidence, orders tests by risk and reversibility, runs safe tests in parallel and records
      decisions.
    good: Tests one after the other and decides.
    weak: Picks the senior engineer's theory.
  followups:
  - What if both fixes are risky?
  - How did you decide the order?
  common_errors:
  - 'Answering in the weak pattern: picks the senior engineer''s theory'

- external_key: leadership.crisis_leadership.exec_demands_updates
  competency_key: stakeholder_management
  topic: An executive who wants constant updates
  difficulty: medium
  text: >-
    A senior executive keeps interrupting the response with requests for updates. How do you handle it?
  expected_concepts:
  - understanding what they need
  - offering a regular update
  - a single contact
  - explaining the cost of interruption
  - keeping the relationship
  rubric:
    excellent: >-
      Finds out what they need, offers a regular cadence and a single contact, and protects the responders.
    good: Gives updates and asks them to wait.
    weak: Ignores them or lets them direct the response.
  followups:
  - What did they actually need?
  - What did you agree?
  common_errors:
  - 'Answering in the weak pattern: ignores them or lets them direct the response'

- external_key: leadership.crisis_leadership.decision_to_page_everyone
  competency_key: incident_response
  topic: Escalating too early or too late
  difficulty: medium
  text: >-
    How do you decide between waking the whole team and handling an incident with the on-call person, and what have you learned
    from getting it wrong?
  expected_concepts:
  - severity and impact criteria
  - time-based escalation
  - cost of waking people
  - cost of delay
  - learning from past calls
  rubric:
    excellent: >-
      Uses clear criteria and time triggers, discusses a past wrong call and how the criteria changed.
    good: Uses criteria and reflects on one case.
    weak: Decides by instinct each time.
  followups:
  - What time trigger did you set?
  - What did you change afterwards?
  common_errors:
  - 'Answering in the weak pattern: decides by instinct each time'

- external_key: leadership.crisis_leadership.incident_caused_by_you
  competency_key: ownership
  topic: An incident you caused
  difficulty: medium
  text: >-
    Tell me about an incident that you or your team caused. How did you handle communication and recovery?
  expected_concepts:
  - owning it early
  - clear facts
  - fixing first
  - communicating impact
  - review
  - changes made
  rubric:
    excellent: >-
      Takes ownership early, communicates facts, restores service, leads a blameless review and delivers changes.
    good: Owns the problem and fixes it.
    weak: Minimises or deflects.
  followups:
  - Who did you tell first?
  - What was the real contributing factor?
  common_errors:
  - 'Answering in the weak pattern: minimises or deflects'

- external_key: leadership.crisis_leadership.cascading_failure
  competency_key: incident_response
  topic: Failure spreading between systems
  difficulty: medium
  text: Describe an incident that spread across several systems. How did you contain it?
  expected_concepts:
  - identifying dependencies
  - isolating components
  - shedding load
  - prioritising critical paths
  - coordinating teams
  - recovery order
  rubric:
    excellent: >-
      Maps dependencies quickly, isolates and sheds load, prioritises critical services, coordinates teams and sequences recovery.
    good: Contains the spread with some coordination.
    weak: Fixes each system separately.
  followups:
  - How did you coordinate teams?
  - What recovery order did you use?
  common_errors:
  - 'Answering in the weak pattern: fixes each system separately'

- external_key: leadership.crisis_leadership.incident_with_vendor
  competency_key: stakeholder_management
  topic: An outage in a third party
  difficulty: medium
  text: >-
    A vendor you depend on has an outage that takes your service down. What do you do?
  expected_concepts:
  - confirming the source
  - vendor contact
  - workarounds
  - customer communication
  - documenting
  - reviewing dependency risk
  rubric:
    excellent: >-
      Confirms the cause, escalates with the vendor, builds a workaround, communicates and reviews dependency risk afterwards.
    good: Waits with updates to customers.
    weak: Does nothing until the vendor fixes it.
  followups:
  - What workaround did you build?
  - What did you change about the dependency?
  common_errors:
  - 'Answering in the weak pattern: does nothing until the vendor fixes it'

- external_key: leadership.crisis_leadership.data_loss_event
  competency_key: incident_response
  topic: A potential loss of data
  difficulty: medium
  text: >-
    You discover that data may have been lost or corrupted. How do you lead the response?
  expected_concepts:
  - stopping further damage
  - scoping affected data
  - backups and recovery
  - informing the right people
  - legal or compliance duties
  - customer communication
  rubric:
    excellent: >-
      Stops damage, scopes the issue, uses backups, informs stakeholders and compliance, and communicates clearly with customers.
    good: Recovers data and informs people.
    weak: Fixes it quietly.
  followups:
  - Who did you have to inform?
  - How did you scope the damage?
  common_errors:
  - 'Answering in the weak pattern: fixes it quietly'

- external_key: leadership.crisis_leadership.security_incident_lead
  competency_key: security
  topic: A suspected security breach
  difficulty: medium
  text: Your team suspects a security breach. How do you lead in the first hours?
  expected_concepts:
  - involving security and legal early
  - containing
  - preserving evidence
  - limiting who knows
  - clear roles
  - communication plan
  rubric:
    excellent: >-
      Involves security and legal, contains while preserving evidence, controls communication and keeps clear roles.
    good: Informs security and contains.
    weak: Investigates alone and quietly.
  followups:
  - What did you preserve?
  - Who decided what to disclose?
  common_errors:
  - 'Answering in the weak pattern: investigates alone and quietly'

- external_key: leadership.crisis_leadership.burned_out_responders
  competency_key: people_management
  topic: An exhausted team in a long incident
  difficulty: medium
  text: >-
    An incident has gone on for twelve hours and your responders are tired. What do you do?
  expected_concepts:
  - rotating people
  - replacing decisions made while tired
  - rest
  - food and logistics
  - clear shifts
  - support
  rubric:
    excellent: >-
      Rotates responders, sets shifts, double-checks risky decisions, arranges rest and logistics.
    good: Gives breaks.
    weak: Pushes through.
  followups:
  - How did you hand over?
  - What risky decisions did you recheck?
  common_errors:
  - 'Answering in the weak pattern: pushes through'

- external_key: leadership.crisis_leadership.post_incident_blame_pressure
  competency_key: leadership
  topic: Pressure to find someone to blame
  difficulty: medium
  text: >-
    After a major incident, senior leaders want to know who is responsible. How do you respond?
  expected_concepts:
  - explaining the blameless approach
  - presenting system factors
  - accountability for improvements
  - protecting individuals
  - managing leaders' needs
  rubric:
    excellent: >-
      Explains the reasoning, presents system factors and accountable actions, protects individuals and meets leaders' need
      for accountability.
    good: Resists blame and shares findings.
    weak: Names an individual.
  followups:
  - What did leaders want to see?
  - How did you give accountability without blame?
  common_errors:
  - 'Answering in the weak pattern: names an individual'

- external_key: leadership.crisis_leadership.repeat_incident
  competency_key: ownership
  topic: The same incident again
  difficulty: medium
  text: The same type of incident has happened three times. How do you break the cycle?
  expected_concepts:
  - examining earlier actions
  - why they were not completed or not effective
  - deeper cause
  - prioritisation
  - leadership attention
  - verification
  rubric:
    excellent: >-
      Reviews earlier actions, finds why they failed, addresses the deeper cause, escalates priority and verifies.
    good: Reopens the review and adds actions.
    weak: Treats each as separate.
  followups:
  - Why had actions not worked?
  - How did you get priority?
  common_errors:
  - 'Answering in the weak pattern: treats each as separate'

- external_key: leadership.crisis_leadership.incident_during_launch
  competency_key: project_management
  topic: A crisis at a key launch
  difficulty: medium
  text: >-
    Something fails during a major launch. How do you decide between pushing on, delaying and rolling back?
  expected_concepts:
  - customer impact
  - evidence
  - launch criteria
  - stakeholder views
  - reversibility
  - communication
  - decision owner
  rubric:
    excellent: >-
      Weighs impact and evidence against criteria, involves stakeholders, makes a clear decision and communicates it.
    good: Decides after discussion.
    weak: Pushes on because of the date.
  followups:
  - Who made the final call?
  - What would change your mind?
  common_errors:
  - 'Answering in the weak pattern: pushes on because of the date'

- external_key: leadership.crisis_leadership.decision_without_authority
  competency_key: leadership
  topic: Making a call without a senior sign-off
  difficulty: medium
  text: >-
    You need to take an urgent action during an incident but the person who normally approves it is unreachable. What do you
    do?
  expected_concepts:
  - assessing risk
  - reversibility
  - documented authority
  - second opinion
  - informing afterwards
  - learning
  rubric:
    excellent: >-
      Assesses risk and reversibility, checks documented authority, gets a second opinion, records the decision and informs
      afterwards.
    good: Decides carefully and informs afterwards.
    weak: Waits and lets damage continue, or acts recklessly.
  followups:
  - What did you document?
  - How did the approver react?
  common_errors:
  - >-
    Answering in the weak pattern: waits and lets damage continue, or acts recklessly

- external_key: leadership.crisis_leadership.accountability_for_the_miss
  competency_key: ownership
  topic: Owning a failure publicly
  difficulty: hard
  text: >-
    Your team missed something that caused a serious customer problem. How did you handle accountability, internally and externally?
  expected_concepts:
  - owning it without deflecting
  - facts
  - protecting individuals
  - remediation plan
  - executive communication
  - follow-through
  rubric:
    excellent: >-
      Owns the failure at the right level, presents facts and a remediation plan, protects individuals and follows through.
    good: Owns it and presents a plan.
    weak: Blames individuals or other teams.
  followups:
  - What did you say to your own leaders?
  - What did you protect your team from?
  common_errors:
  - 'Answering in the weak pattern: blames individuals or other teams'

- external_key: leadership.crisis_leadership.severity_one_unknown_cause
  competency_key: incident_response
  topic: A prolonged outage with no cause
  difficulty: hard
  text: >-
    A critical service has been down for hours and nobody has found the cause. Walk me through how you would lead, including
    how you would change the approach as time passes.
  expected_concepts:
  - structured hypotheses
  - parallel investigation
  - time-boxed attempts
  - bringing in outside expertise
  - alternative recovery such as failover
  - communication as time grows
  rubric:
    excellent: >-
      Describes structured hypotheses and time-boxing, brings in expertise, pursues alternative recovery and adapts communication
      as time passes.
    good: Gives a sensible approach with some adaptation.
    weak: Keeps trying the same things.
  followups:
  - When would you give up looking for the cause?
  - How would you rotate people?
  common_errors:
  - 'Answering in the weak pattern: keeps trying the same things'

- external_key: leadership.crisis_leadership.ethical_dilemma_in_crisis
  competency_key: ownership
  topic: Disclosure under pressure
  difficulty: hard
  text: >-
    During an incident you learn the problem may affect customers' data, but a senior leader wants to wait before telling
    anyone. What do you do?
  expected_concepts:
  - facts and duty to disclose
  - legal and compliance involvement
  - risk to customers
  - escalation path
  - documenting
  - supporting the decision with transparency
  rubric:
    excellent: >-
      Gathers facts, brings in legal and compliance, argues for timely disclosure based on customer risk, escalates and documents.
    good: Raises concern and escalates.
    weak: Follows the instruction without question or acts alone.
  followups:
  - What would you do if overruled?
  - Who else would you involve?
  common_errors:
  - Taking unilateral action outside the proper channels.

- external_key: leadership.crisis_leadership.crisis_with_no_playbook
  competency_key: leadership
  topic: A novel crisis
  difficulty: hard
  text: >-
    Tell me about a crisis for which you had no playbook. How did you decide what to do?
  expected_concepts:
  - assessing facts
  - principles to guide
  - reversible steps first
  - seeking expertise
  - recording decisions
  - adjusting as you learned
  rubric:
    excellent: >-
      Uses principles and reversible steps, seeks expertise, records decisions and adapts, with a clear outcome and lessons.
    good: Makes reasonable decisions and learns.
    weak: Freezes or acts impulsively.
  followups:
  - Which principles did you use?
  - What would you write in a playbook now?
  common_errors:
  - 'Answering in the weak pattern: freezes or acts impulsively'

- external_key: leadership.crisis_leadership.dual_crises
  competency_key: incident_response
  topic: Two crises at the same time
  difficulty: hard
  text: >-
    Two serious incidents hit at once and you have people for only one. How do you decide?
  expected_concepts:
  - impact comparison
  - reversibility
  - staffing
  - communication to both groups
  - delegation
  - escalation for more help
  rubric:
    excellent: >-
      Compares impact, allocates people, delegates, communicates the trade-off and escalates for resources.
    good: Chooses by impact and informs.
    weak: Splits everyone across both.
  followups:
  - Who was told the second would wait?
  - How did you decide?
  common_errors:
  - 'Answering in the weak pattern: splits everyone across both'

- external_key: leadership.crisis_leadership.leading_after_you_caused_it
  competency_key: ownership
  topic: Leading recovery from your own mistake
  difficulty: hard
  text: >-
    Your own decision led to a significant outage and you are leading recovery. How do you handle the dual role?
  expected_concepts:
  - owning it openly
  - delegating roles to avoid bias
  - focusing on recovery
  - blameless review that includes your role
  - accepting consequences
  rubric:
    excellent: >-
      Owns it openly, structures roles to avoid conflict, leads recovery, includes their own role in the review and accepts
      consequences.
    good: Owns it and leads recovery.
    weak: Hides their role.
  followups:
  - Who led the review?
  - What did you say to the team?
  common_errors:
  - 'Answering in the weak pattern: hides their role'

- external_key: leadership.crisis_leadership.decision_to_shut_down
  competency_key: leadership
  topic: Turning off a service on purpose
  difficulty: hard
  text: >-
    You must decide whether to shut down a service to contain a risk, knowing it will cause a visible outage. How do you decide?
  expected_concepts:
  - comparing harms
  - evidence
  - reversibility
  - stakeholder consultation
  - communication
  - fallback
  - time pressure
  rubric:
    excellent: >-
      Compares harms with evidence, consults decision makers, plans communication and fallback and decides within the time.
    good: Decides after consulting leaders.
    weak: Avoids the decision or decides alone with no communication.
  followups:
  - Who made the call?
  - How did customers react?
  common_errors:
  - >-
    Answering in the weak pattern: avoids the decision or decides alone with no communication
