# Curated questions: leadership round, vision and strategy (part 4 of 4). Strategy versus tactics, leading indicators, failure modes, matrix and cross-team strategy, and hard resets. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.vision_strategy.strategy_versus_tactics
  competency_key: leadership
  topic: Telling strategy from tactics
  difficulty: easy
  text: >-
    How do you tell the difference between strategy and tactics, and why does the difference matter for
    a team lead?
  expected_concepts:
  - strategy as choices about where to focus and how to win
  - tactics as actions
  - consistency between them
  - how to test whether tactics serve the strategy
  - examples
  rubric:
    excellent: >-
      Distinguishes choices from actions with a concrete example and shows how to check that tactics serve
      the strategy.
    good: Gives a reasonable definition and example.
    weak: Treats strategy as a longer list of tasks.
  followups:
  - Can you give an example of a tactic that didn't fit?
  - How do you check?
  common_errors:
  - Treats strategy as a longer list of tasks.

- external_key: leadership.vision_strategy.progress_updates
  competency_key: communication
  topic: Reporting progress against direction
  difficulty: easy
  text: >-
    How do you report progress on a long-term direction so that people see movement without a flood of
    detail?
  expected_concepts:
  - a few headline measures
  - trends not snapshots
  - what changed since last time
  - what is next and what is at risk
  - consistent format
  rubric:
    excellent: >-
      Uses a few headline measures and trends, shows changes, next steps and risks in a consistent format,
      and says how readers use it.
    good: Provides regular updates with key measures.
    weak: Reports activity lists.
  followups:
  - What is in the headline?
  - How do you handle bad news?
  common_errors:
  - Reports activity lists.

- external_key: leadership.vision_strategy.team_principles
  competency_key: leadership
  topic: Setting principles for decisions
  difficulty: easy
  text: >-
    How do you set a few guiding principles that help people make decisions without needing to ask you?
  expected_concepts:
  - derive from real trade-offs
  - few and memorable
  - examples
  - used in reviews
  - revisited
  rubric:
    excellent: >-
      Derives principles from real trade-offs, keeps them few, adds examples, uses them in reviews and
      revises.
    good: Writes a short list with explanation.
    weak: Writes generic values.
  followups:
  - Which principle was used in a real decision?
  - How do you retire one?
  common_errors:
  - Writes generic values.

- external_key: leadership.vision_strategy.feedback_on_direction
  competency_key: adaptability
  topic: Inviting challenge to your direction
  difficulty: easy
  text: >-
    How do you invite people to challenge a direction you've set, and what do you do with what you hear?
  expected_concepts:
  - explicit invitation
  - safe routes
  - listening without defending
  - changing when warranted
  - telling people what changed
  rubric:
    excellent: >-
      Invites challenge explicitly through safe routes, listens, changes when warranted and reports what
      changed.
    good: Asks for feedback and considers it.
    weak: Defends the direction.
  followups:
  - What did you change?
  - How do you handle quiet people?
  common_errors:
  - Defends the direction.

- external_key: leadership.vision_strategy.choosing_focus_area
  competency_key: project_management
  topic: Picking where to focus first
  difficulty: easy
  text: >-
    When many areas need attention, how do you choose where to focus your team first?
  expected_concepts:
  - impact on goals
  - urgency
  - effort
  - dependencies
  - evidence
  rubric:
    excellent: >-
      Compares impact, urgency, effort, dependencies and evidence and explains a real choice and what
      it deferred.
    good: Chooses by impact and effort.
    weak: Chooses by loudest request.
  followups:
  - What did you defer?
  - How did you communicate it?
  common_errors:
  - Chooses by loudest request.

- external_key: leadership.vision_strategy.planning_offsite
  competency_key: collaboration
  topic: Using an offsite to set direction
  difficulty: medium
  text: >-
    How do you plan a strategy session or offsite so that it produces decisions and not just discussion?
  expected_concepts:
  - clear outcomes beforehand
  - pre-work
  - diverse participants
  - structured decisions
  - follow-up owners and dates
  rubric:
    excellent: >-
      Defines outcomes, assigns pre-work, invites diverse participants, structures decisions and assigns
      follow-up owners and dates.
    good: Plans an agenda and follow-up.
    weak: Runs open discussion without outcomes.
  followups:
  - What decision came out?
  - How did you follow up?
  common_errors:
  - Runs open discussion without outcomes.

- external_key: leadership.vision_strategy.aligning_leaders_on_strategy
  competency_key: stakeholder_management
  topic: Aligning leaders who see strategy differently
  difficulty: medium
  text: >-
    Your peers have different views on strategy for a shared area. How do you get alignment?
  expected_concepts:
  - individual conversations
  - finding common ground
  - making options explicit
  - criteria
  - deciding and committing
  rubric:
    excellent: >-
      Holds individual conversations, finds common ground, makes options explicit with criteria and gets
      decision and commitment.
    good: Brings leaders together to agree.
    weak: Avoids the differences.
  followups:
  - What was the main difference?
  - How did you get commitment?
  common_errors:
  - Avoids the differences.

- external_key: leadership.vision_strategy.leading_indicators
  competency_key: problem_solving
  topic: Choosing indicators that arrive early
  difficulty: medium
  text: >-
    Strategic results take a long time to appear. How do you pick early signals that show whether you're
    on the right track?
  expected_concepts:
  - causal link to the outcome
  - measurable soon
  - hard to game
  - baseline
  - reviewing validity
  rubric:
    excellent: >-
      Selects indicators with causal link, measurable early, hard to game, baselined and reviews validity.
    good: Chooses a few early indicators.
    weak: Waits for the final result.
  followups:
  - Which indicator misled you?
  - How did you check the link?
  common_errors:
  - Waits for the final result.

- external_key: leadership.vision_strategy.strategic_debt
  competency_key: ownership
  topic: Noticing when past choices constrain your strategy
  difficulty: medium
  text: >-
    How do you recognise when decisions made earlier are limiting your strategic options, and what do
    you do?
  expected_concepts:
  - signs such as slow change
  - naming the constraint
  - cost to remove
  - staged removal
  - accepting some constraints
  rubric:
    excellent: >-
      Spots signs, names the constraint, estimates removal cost, removes in stages and accepts some constraints.
    good: Recognises constraints and plans changes.
    weak: Ignores them.
  followups:
  - What was the constraint?
  - What did you accept?
  common_errors:
  - Ignores them.

- external_key: leadership.vision_strategy.delegating_strategy_ownership
  competency_key: mentoring
  topic: Giving others ownership of parts of strategy
  difficulty: medium
  text: >-
    How do you hand over ownership of part of a strategy to someone on your team, and keep it coherent?
  expected_concepts:
  - clear outcome and boundaries
  - context and principles
  - regular check-ins
  - support without taking over
  - visibility of results
  rubric:
    excellent: >-
      Defines outcome and boundaries, shares context and principles, checks in regularly, supports without
      taking over and gives visibility.
    good: Delegates with check-ins.
    weak: Delegates tasks but keeps decisions.
  followups:
  - What happened when they decided differently?
  - How did you support?
  common_errors:
  - Delegates tasks but keeps decisions.

- external_key: leadership.vision_strategy.experiment_portfolio
  competency_key: problem_solving
  topic: Running several experiments toward a strategy
  difficulty: medium
  text: >-
    How do you manage a set of experiments so that each one teaches you something relevant to your strategy?
  expected_concepts:
  - hypotheses linked to strategy
  - small scope
  - shared learning
  - decision rules
  - stopping
  rubric:
    excellent: >-
      Links hypotheses to strategy, keeps scope small, shares learning, uses decision rules and stops
      experiments.
    good: Runs experiments and reviews.
    weak: Runs many experiments with no link.
  followups:
  - Which one stopped?
  - How do you share learning?
  common_errors:
  - Runs many experiments with no link.

- external_key: leadership.vision_strategy.failure_modes_of_strategy
  competency_key: problem_solving
  topic: Anticipating how a strategy might fail
  difficulty: medium
  text: Before you commit to a strategy, how do you think about how it might fail?
  expected_concepts:
  - premortem
  - key assumptions
  - early warning signs
  - contingency plans
  - assigning owners
  rubric:
    excellent: >-
      Uses premortem, lists assumptions, defines warning signs, plans contingencies and assigns owners.
    good: Considers risks and mitigation.
    weak: Assumes the plan works.
  followups:
  - Which assumption failed?
  - What was a warning sign?
  common_errors:
  - Assumes the plan works.

- external_key: leadership.vision_strategy.keeping_strategy_alive
  competency_key: communication
  topic: Preventing a strategy from becoming a poster
  difficulty: medium
  text: >-
    Many strategies are published and forgotten. What do you do to keep yours in use?
  expected_concepts:
  - use in planning and reviews
  - referencing in decisions
  - regular storytelling
  - refreshing
  - owner
  rubric:
    excellent: >-
      Uses it in planning and reviews, references it in decisions, tells stories of results, refreshes
      and has an owner.
    good: Refers to it in meetings.
    weak: Publishes it once.
  followups:
  - How was it used last month?
  - Who owns it?
  common_errors:
  - Publishes it once.

- external_key: leadership.vision_strategy.priority_disagreement
  competency_key: collaboration
  topic: Resolving disagreement on priorities inside a team
  difficulty: medium
  text: >-
    Within your team, people disagree about what is most important. How do you resolve it?
  expected_concepts:
  - surfacing the criteria
  - data and customer input
  - hearing each view
  - making a decision
  - revisiting
  rubric:
    excellent: >-
      Surfaces criteria, brings data and customer input, hears views, decides and revisits.
    good: Discusses and decides.
    weak: Decides alone without discussion.
  followups:
  - What data helped?
  - How did you handle those who disagreed?
  common_errors:
  - Decides alone without discussion.

- external_key: leadership.vision_strategy.matrix_org_strategy
  competency_key: stakeholder_management
  topic: Strategy in a matrix organisation
  difficulty: medium
  text: >-
    In a matrix organisation, people serve more than one set of priorities. How do you set direction without
    creating conflict?
  expected_concepts:
  - clarifying decision rights
  - shared goals
  - regular coordination
  - transparency about trade-offs
  - escalation path
  rubric:
    excellent: >-
      Clarifies decision rights, sets shared goals, coordinates regularly, shows trade-offs and has an
      escalation path.
    good: Aligns with other leaders.
    weak: Ignores the other dimension.
  followups:
  - How do you resolve conflicts?
  - What are the decision rights?
  common_errors:
  - Ignores the other dimension.

- external_key: leadership.vision_strategy.strategy_with_budget_cut
  competency_key: stakeholder_management
  topic: Keeping direction when funding is cut
  difficulty: hard
  text: >-
    Your budget is cut by a third midway through the year. How do you revise your strategy?
  expected_concepts:
  - revisiting priorities
  - protecting core outcomes
  - what to stop
  - communicating clearly
  - revising goals
  rubric:
    excellent: >-
      Revisits priorities, protects core outcomes, stops specific items, communicates clearly and revises
      goals.
    good: Cuts lower-priority work.
    weak: Tries to deliver everything with less.
  followups:
  - What did you stop?
  - How did you tell the team?
  common_errors:
  - Tries to deliver everything with less.

- external_key: leadership.vision_strategy.disruptive_competitor
  competency_key: adaptability
  topic: Responding to a disruptive entrant
  difficulty: hard
  text: >-
    A new competitor is changing customer expectations in your market. How do you decide how to respond?
  expected_concepts:
  - understanding what is changing
  - assessing your strengths
  - options
  - speed of response
  - avoiding panic
  rubric:
    excellent: >-
      Understands the change, assesses strengths, evaluates options, sets speed of response and avoids
      panic changes.
    good: Analyses and responds.
    weak: Dismisses or panics.
  followups:
  - What did you test?
  - What did you keep?
  common_errors:
  - Dismisses or panics.

- external_key: leadership.vision_strategy.shared_strategy_sibling_teams
  competency_key: collaboration
  topic: Building one strategy across peer teams
  difficulty: hard
  text: >-
    Several peer teams each have their own direction, and you want a shared strategy. How do you build
    one?
  expected_concepts:
  - shared problem
  - co-creation
  - clear shared outcomes
  - each team's role
  - governance
  rubric:
    excellent: >-
      Frames a shared problem, co-creates, sets shared outcomes, defines roles and governance.
    good: Brings teams together to agree.
    weak: Imposes one team's direction.
  followups:
  - What shared outcome did you choose?
  - How did you handle a team that disagreed?
  common_errors:
  - Imposes one team's direction.

- external_key: leadership.vision_strategy.ethics_in_strategy
  competency_key: ownership
  topic: Strategic choices with ethical implications
  difficulty: hard
  text: >-
    A strategic option would grow the business but could harm users or trust. How do you handle that?
  expected_concepts:
  - identifying harms
  - consulting
  - alternatives
  - long-term trust
  - escalating
  rubric:
    excellent: >-
      Identifies harms, consults, explores alternatives, weighs long-term trust and escalates.
    good: Raises concerns and discusses.
    weak: Ignores or avoids.
  followups:
  - What alternative did you propose?
  - What did leaders say?
  common_errors:
  - Ignores or avoids.

- external_key: leadership.vision_strategy.strategic_bet_failing
  competency_key: ownership
  topic: A major bet that isn't working
  difficulty: hard
  text: >-
    A bet you championed isn't delivering after a long investment. How do you handle it?
  expected_concepts:
  - direct assessment of evidence
  - decision criteria
  - sunk cost
  - communicating
  - learning
  rubric:
    excellent: >-
      Assesses evidence plainly, applies decision criteria, ignores sunk cost, communicates and records
      learning.
    good: Reviews and decides.
    weak: Persists or hides it.
  followups:
  - What did you learn?
  - How did you tell sponsors?
  common_errors:
  - Persists or hides it.

- external_key: leadership.vision_strategy.scaling_strategy_process
  competency_key: leadership
  topic: Scaling strategy-making as the organisation grows
  difficulty: hard
  text: >-
    The organisation is doubling in size. How do you change the way strategy is set and communicated?
  expected_concepts:
  - levels of strategy
  - delegation
  - common language
  - lighter coordination
  - documentation
  rubric:
    excellent: >-
      Defines levels of strategy, delegates, uses common language, coordinates lightly and documents.
    good: Adds structure and communication.
    weak: Keeps doing the same.
  followups:
  - What did you add?
  - What did you delegate?
  common_errors:
  - Keeps doing the same.

- external_key: leadership.vision_strategy.inheriting_bad_strategy
  competency_key: adaptability
  topic: Inheriting a strategy you disagree with
  difficulty: hard
  text: >-
    You inherit a strategy you believe is flawed, with commitments already made. What do you do?
  expected_concepts:
  - understanding history
  - testing your concerns
  - keeping what works
  - honouring commitments
  - proposing changes with evidence
  rubric:
    excellent: >-
      Understands the history, tests concerns, keeps what works, honours commitments and proposes changes
      with evidence.
    good: Reviews and proposes changes.
    weak: Overturns it immediately.
  followups:
  - What did you keep?
  - How did you propose changes?
  common_errors:
  - Overturns it immediately.

- external_key: leadership.vision_strategy.strategy_for_small_team
  competency_key: leadership
  topic: Strategy when you have few people
  difficulty: medium
  text: >-
    How does setting strategy differ for a small team with limited capacity compared with a large organisation?
  expected_concepts:
  - very few priorities
  - leveraging others' platforms and partners
  - saying no more often
  - speed of learning
  - visible focus
  rubric:
    excellent: >-
      Limits to very few priorities, leverages others' platforms and partners, says no often, learns quickly
      and keeps the focus visible, with an example.
    good: Focuses on fewer priorities.
    weak: Copies a large-organisation approach.
  followups:
  - What did you say no to?
  - What did you borrow from others?
  common_errors:
  - Copies a large-organisation approach.

- external_key: leadership.vision_strategy.customer_voice_in_strategy
  competency_key: product_sense
  topic: Keeping real customer input in strategic planning
  difficulty: medium
  text: >-
    How do you make sure real customer input shapes strategic decisions rather than internal opinion?
  expected_concepts:
  - regular direct contact
  - varied sources
  - patterns not anecdotes
  - including engineers
  - testing assumptions
  rubric:
    excellent: >-
      Maintains regular direct contact, uses varied sources, looks for patterns, includes engineers and
      tests assumptions.
    good: Reviews customer feedback regularly.
    weak: Relies on internal assumptions.
  followups:
  - What did you hear that changed plans?
  - How are engineers involved?
  common_errors:
  - Relies on internal assumptions.

- external_key: leadership.vision_strategy.strategy_handover
  competency_key: communication
  topic: Handing strategy to a successor
  difficulty: medium
  text: >-
    You are leaving a role and need to hand over a strategy to a successor. What do you pass on?
  expected_concepts:
  - the reasoning not just the plan
  - assumptions
  - commitments in flight
  - stakeholders
  - open questions and risks
  rubric:
    excellent: >-
      Passes on reasoning, assumptions, commitments, stakeholder context, and open questions and risks,
      in a written handover plus conversation.
    good: Passes on the plan and context.
    weak: Passes on a slide deck only.
  followups:
  - What do you flag as fragile?
  - How do you stay available?
  common_errors:
  - Passes on a slide deck only.
