# Curated questions: leadership round, vision and strategy (part 3 of 4). Opportunity sizing, capability planning, focused strategies for reliability and security, AI direction and portfolio choices. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.vision_strategy.team_mission_pitch
  competency_key: communication
  topic: Describing your team's mission briefly
  difficulty: easy
  text: >-
    Describe in a few sentences what your team exists to do and for whom, as you would to a colleague
    from another department.
  expected_concepts:
  - who the customers are
  - the problem the team solves
  - how success looks
  - plain language
  - what is out of scope
  rubric:
    excellent: >-
      Gives a short plain-language description of customers, problem, success and limits, and explains
      how they check it is understood.
    good: Describes what the team does and for whom.
    weak: Lists technologies or activities without purpose.
  followups:
  - What would a colleague get wrong?
  - How has the description changed?
  common_errors:
  - Lists technologies or activities without purpose.

- external_key: leadership.vision_strategy.learning_from_competitors
  competency_key: product_sense
  topic: Using competitor knowledge in planning
  difficulty: easy
  text: How do you learn from competitors or similar products without just copying them?
  expected_concepts:
  - understanding what customers value
  - noting strengths and gaps
  - looking at why choices were made
  - applying lessons to your context
  - avoiding feature chasing
  rubric:
    excellent: >-
      Studies competitors to understand customer value, notes gaps and reasoning, applies lessons in context
      and avoids feature chasing.
    good: Reviews competitors and takes ideas.
    weak: Copies features or ignores competitors.
  followups:
  - What did you decide not to copy?
  - How do you keep up to date?
  common_errors:
  - Copies features or ignores competitors.

- external_key: leadership.vision_strategy.one_year_goal
  competency_key: project_management
  topic: Setting a one-year goal for a team
  difficulty: easy
  text: >-
    If you had to set one clear goal for your team for the next year, how would you choose it?
  expected_concepts:
  - the biggest problem or opportunity
  - evidence
  - measurable
  - within influence
  - agreement with stakeholders
  rubric:
    excellent: >-
      Chooses by problem or opportunity with evidence, defines measures, checks influence and agrees with
      stakeholders.
    good: Chooses a goal with reasoning.
    weak: Chooses a list of tasks.
  followups:
  - What goals did you reject?
  - How do you measure it?
  common_errors:
  - Chooses a list of tasks.

- external_key: leadership.vision_strategy.admired_strategy
  competency_key: leadership
  topic: A strategy you have learned from
  difficulty: easy
  text: >-
    Think of a strategy, from your own work or elsewhere, that you thought was well designed. What made
    it good?
  expected_concepts:
  - clear choices
  - focus
  - fit with strengths
  - coherent actions
  - evidence of results
  rubric:
    excellent: >-
      Names a specific strategy and explains the clear choices, focus, fit with strengths, coherent actions
      and results.
    good: Describes a strategy and a few reasons.
    weak: Names a goal or slogan.
  followups:
  - What did it say no to?
  - What can you apply from it?
  common_errors:
  - Names a goal or slogan.

- external_key: leadership.vision_strategy.daily_work_to_goals
  competency_key: ownership
  topic: Showing how daily work connects to goals
  difficulty: easy
  text: >-
    How do you help team members see how their daily work connects to the team's goals?
  expected_concepts:
  - linking tasks to goals in planning
  - sharing outcomes
  - recognising contribution
  - asking people to explain the link
  - updating regularly
  rubric:
    excellent: >-
      Links tasks to goals during planning, shares outcomes, recognises contribution and checks understanding
      by asking.
    good: Mentions goals in meetings.
    weak: Assumes people know.
  followups:
  - How do you check they see the link?
  - What if work doesn't connect?
  common_errors:
  - Assumes people know.

- external_key: leadership.vision_strategy.opportunity_sizing
  competency_key: product_sense
  topic: Judging how big an opportunity is
  difficulty: medium
  text: >-
    How do you judge whether an opportunity is large enough to justify a strategic investment?
  expected_concepts:
  - size of the customer need
  - reachable share
  - effort and cost
  - confidence ranges
  - alternative uses of effort
  rubric:
    excellent: >-
      Estimates need, reachable share, effort and cost with ranges for the uncertain inputs and compares
      alternative uses.
    good: Gives a reasonable estimate and comparison.
    weak: Relies on excitement or a single number.
  followups:
  - What range did you use?
  - What changed the estimate?
  common_errors:
  - Relies on excitement or a single number.

- external_key: leadership.vision_strategy.capability_roadmap
  competency_key: leadership
  topic: Planning the capabilities a strategy needs
  difficulty: medium
  text: >-
    A strategy requires capabilities your organisation doesn't yet have. How do you plan to build them?
  expected_concepts:
  - identifying gaps in skills, tools and processes
  - build, hire, buy or partner
  - sequencing
  - early proof points
  - measuring progress
  rubric:
    excellent: >-
      Identifies capability gaps, chooses build, hire, buy or partner, sequences, sets proof points and
      measures progress.
    good: Identifies gaps and plans hiring or training.
    weak: Assumes capabilities will appear.
  followups:
  - What did you buy versus build?
  - What was the first proof point?
  common_errors:
  - Assumes capabilities will appear.

- external_key: leadership.vision_strategy.hiring_plan_from_strategy
  competency_key: stakeholder_management
  topic: Deriving a hiring plan from strategy
  difficulty: medium
  text: How do you turn a strategy into a hiring plan and decide which roles come first?
  expected_concepts:
  - identifying critical skills
  - sequencing by dependency
  - alternatives like training or contractors
  - budget
  - reviewing as strategy changes
  rubric:
    excellent: >-
      Identifies critical skills, sequences by dependency, considers alternatives, works within budget
      and reviews as strategy changes.
    good: Lists needed roles and priorities.
    weak: Hires to fill general gaps.
  followups:
  - Which role came first and why?
  - How did you adjust the plan?
  common_errors:
  - Hires to fill general gaps.

- external_key: leadership.vision_strategy.partner_ecosystem
  competency_key: stakeholder_management
  topic: Strategy that depends on partners
  difficulty: medium
  text: >-
    Your strategy relies partly on partners or integrations. How do you plan around that?
  expected_concepts:
  - what you need from partners
  - their incentives
  - agreements
  - fallback options
  - shared milestones
  rubric:
    excellent: >-
      Clarifies needs, understands partner incentives, agrees terms, plans fallbacks and shares milestones.
    good: Sets expectations and monitors.
    weak: Assumes partners will deliver.
  followups:
  - What was their incentive?
  - What fallback did you have?
  common_errors:
  - Assumes partners will deliver.

- external_key: leadership.vision_strategy.data_strategy
  competency_key: leadership
  topic: Setting direction for how data is used
  difficulty: medium
  text: >-
    How would you set a data strategy for a product organisation, beyond collecting more data?
  expected_concepts:
  - decisions data must support
  - quality and ownership
  - access and privacy
  - shared definitions
  - skills
  rubric:
    excellent: >-
      Starts from decisions data must support, addresses quality, ownership, access, privacy and definitions,
      and builds skills.
    good: Sets goals for quality and access.
    weak: Focuses on collecting and storing more.
  followups:
  - Which decision drove it?
  - How do you handle definitions?
  common_errors:
  - Focuses on collecting and storing more.

- external_key: leadership.vision_strategy.security_posture_strategy
  competency_key: leadership
  topic: Setting direction for security improvements
  difficulty: medium
  text: >-
    How do you decide the direction for security improvements when you can't do everything?
  expected_concepts:
  - top risks
  - effort versus risk reduction
  - building secure defaults
  - shared responsibility
  - measuring progress
  rubric:
    excellent: >-
      Identifies top risks, compares effort to risk reduction, builds defaults, shares responsibility
      and measures progress.
    good: Prioritises risks.
    weak: Tries to address everything or reacts to news.
  followups:
  - What did you defer?
  - How do you measure progress?
  common_errors:
  - Tries to address everything or reacts to news.

- external_key: leadership.vision_strategy.reliability_strategy
  competency_key: ownership
  topic: A strategy for reliability
  difficulty: medium
  text: >-
    How do you set a strategy for improving the reliability of a product, rather than just fixing the
    last outage?
  expected_concepts:
  - user-focused targets
  - analysing patterns
  - investing in the biggest sources
  - practices like reviews and drills
  - tracking trends
  rubric:
    excellent: >-
      Sets user-focused targets, analyses patterns, invests in the biggest sources, builds practices and
      tracks trends.
    good: Sets targets and reviews incidents.
    weak: Reacts to each outage.
  followups:
  - What targets did you set?
  - What pattern did you find?
  common_errors:
  - Reacts to each outage.

- external_key: leadership.vision_strategy.developer_experience_strategy
  competency_key: leadership
  topic: Improving how engineers work
  difficulty: medium
  text: >-
    How would you set direction for improving the experience of engineers building and shipping software
    in your organisation?
  expected_concepts:
  - listening and surveys
  - measuring friction
  - picking a few high-impact problems
  - owning teams
  - showing results
  rubric:
    excellent: >-
      Listens and surveys, measures friction, picks a few high-impact problems, assigns ownership and
      shows results.
    good: Collects feedback and fixes pain points.
    weak: Buys tools without understanding problems.
  followups:
  - What was the biggest friction?
  - How did you measure the improvement?
  common_errors:
  - Buys tools without understanding problems.

- external_key: leadership.vision_strategy.cost_strategy
  competency_key: stakeholder_management
  topic: Strategy for managing costs
  difficulty: medium
  text: >-
    The organisation wants to reduce costs without harming the strategy. How do you decide where to look?
  expected_concepts:
  - spend visibility
  - value per cost
  - waste versus investment
  - protecting critical capabilities
  - communicating reasons
  rubric:
    excellent: >-
      Builds visibility, assesses value per cost, distinguishes waste from investment, protects critical
      capabilities and communicates.
    good: Cuts low-value spending.
    weak: Cuts evenly.
  followups:
  - What did you protect?
  - What was waste?
  common_errors:
  - Cuts evenly.

- external_key: leadership.vision_strategy.sunsetting_features
  competency_key: product_sense
  topic: Ending features that no longer serve the strategy
  difficulty: medium
  text: >-
    How do you decide which features or services to stop supporting as strategy evolves?
  expected_concepts:
  - usage and value
  - maintenance cost
  - strategic fit
  - customer impact
  - communication and transition
  rubric:
    excellent: >-
      Weighs usage, value and cost, strategic fit, customer impact and plans communication and transition.
    good: Reviews usage and cost.
    weak: Keeps everything.
  followups:
  - Which one was hardest?
  - How did customers react?
  common_errors:
  - Keeps everything.

- external_key: leadership.vision_strategy.strategy_review_meeting
  competency_key: communication
  topic: Running a useful strategy review
  difficulty: medium
  text: >-
    How do you run a strategy review so that it leads to decisions rather than updates?
  expected_concepts:
  - pre-read
  - questions and decisions listed
  - evidence
  - time for debate
  - recorded outcomes
  rubric:
    excellent: >-
      Uses a pre-read, lists questions and decisions, brings evidence, leaves time for debate and records
      outcomes.
    good: Prepares an agenda and notes.
    weak: Presents status.
  followups:
  - What decision came from the last one?
  - Who attends?
  common_errors:
  - Presents status.

- external_key: leadership.vision_strategy.customer_segment_focus
  competency_key: product_sense
  topic: Choosing which customers to focus on
  difficulty: medium
  text: >-
    You can't serve all customer segments equally well. How do you decide where to focus?
  expected_concepts:
  - segment value and needs
  - fit with strengths
  - cost to serve
  - strategic direction
  - being explicit about those not prioritised
  rubric:
    excellent: >-
      Assesses value and needs, fit with strengths, cost to serve and direction, and is explicit about
      segments not prioritised.
    good: Chooses segments with reasons.
    weak: Tries to serve all.
  followups:
  - How did you inform the others?
  - What did you drop?
  common_errors:
  - Tries to serve all.

- external_key: leadership.vision_strategy.ai_strategy
  competency_key: leadership
  topic: Setting direction for using AI in the organisation
  difficulty: hard
  text: >-
    Leaders ask you to set a direction for how the organisation will use AI. What do you do?
  expected_concepts:
  - finding valuable problems
  - assessing data and capability readiness
  - risks including privacy and quality
  - pilots with measures
  - governance
  rubric:
    excellent: >-
      Finds valuable problems, assesses readiness, addresses risks, pilots with measures and sets governance.
    good: Identifies use cases and pilots.
    weak: Adopts AI broadly without focus.
  followups:
  - Which use case came first?
  - How did you set governance?
  common_errors:
  - Adopts AI broadly without focus.

- external_key: leadership.vision_strategy.multi_year_transformation
  competency_key: project_management
  topic: Planning a multi-year transformation
  difficulty: hard
  text: >-
    Describe how you would plan and lead a transformation that takes several years and crosses many teams.
  expected_concepts:
  - a clear case
  - stages with value
  - governance and ownership
  - measuring progress
  - adapting
  rubric:
    excellent: >-
      Makes a clear case, plans stages with value, sets governance and ownership, measures progress and
      adapts.
    good: Plans phases and communication.
    weak: Plans a big-bang with no staging.
  followups:
  - What was value at stage one?
  - How did you adapt?
  common_errors:
  - Plans a big-bang with no staging.

- external_key: leadership.vision_strategy.regulated_strategy
  competency_key: stakeholder_management
  topic: Strategy in a regulated environment
  difficulty: hard
  text: >-
    Your strategy has to operate within heavy regulation that limits what you can do and how fast. How
    do you plan?
  expected_concepts:
  - understanding constraints early
  - working with compliance
  - designing within constraints
  - building time for approvals
  - finding room for innovation
  rubric:
    excellent: >-
      Understands constraints early, partners with compliance, designs within them, plans time for approvals
      and finds room for innovation.
    good: Plans around the regulations with compliance input.
    weak: Treats regulation as an obstacle.
  followups:
  - Where was there room?
  - How did you involve compliance?
  common_errors:
  - Treats regulation as an obstacle.

- external_key: leadership.vision_strategy.conflicting_strategies
  competency_key: stakeholder_management
  topic: Two teams with conflicting strategies
  difficulty: hard
  text: >-
    Two teams each have a sensible strategy, but the strategies pull in opposite directions. How do you
    help resolve it?
  expected_concepts:
  - surfacing the conflict
  - understanding each rationale
  - finding the higher-level goal
  - options
  - escalating for a decision
  rubric:
    excellent: >-
      Surfaces the conflict, understands both rationales, refers to the higher-level goal, offers options
      and escalates for a decision.
    good: Discusses and compromises.
    weak: Lets both continue.
  followups:
  - What was the higher goal?
  - Who decided?
  common_errors:
  - Lets both continue.

- external_key: leadership.vision_strategy.cross_team_portfolio
  competency_key: project_management
  topic: Prioritising across a portfolio of teams
  difficulty: hard
  text: >-
    You oversee several teams whose proposals exceed your capacity. How do you prioritise across the portfolio?
  expected_concepts:
  - common criteria
  - evidence
  - dependencies
  - capacity
  - transparency and review
  rubric:
    excellent: >-
      Applies common criteria with evidence, considers dependencies and capacity, is transparent and reviews.
    good: Ranks proposals with criteria.
    weak: Funds by negotiation or seniority.
  followups:
  - What criteria did you use?
  - How did teams react?
  common_errors:
  - Funds by negotiation or seniority.

- external_key: leadership.vision_strategy.inherited_organisation_strategy
  competency_key: leadership
  topic: Building a strategy for an organisation you inherited
  difficulty: hard
  text: >-
    You've taken over a large organisation with no clear strategy. How do you build one that people believe
    in?
  expected_concepts:
  - listening tour
  - analysis of data
  - drafting with leaders
  - testing with teams
  - communicating and iterating
  rubric:
    excellent: >-
      Listens widely, analyses data, drafts with leaders, tests with teams, communicates and iterates.
    good: Consults and writes a strategy.
    weak: Writes a strategy alone.
  followups:
  - Whom did you listen to first?
  - What changed after testing?
  common_errors:
  - Writes a strategy alone.

- external_key: leadership.vision_strategy.strategy_survives_pivot
  competency_key: ownership
  topic: Keeping people committed through a strategic shift
  difficulty: hard
  text: >-
    Your organisation pivots strategically and some people see their earlier work was wasted. How do you
    keep them engaged?
  expected_concepts:
  - explaining reasons
  - acknowledging past contributions
  - connecting to the new direction
  - reusing skills and assets
  - open dialogue
  rubric:
    excellent: >-
      Explains reasons, acknowledges past work, connects to the new direction, reuses skills and assets
      and keeps dialogue open.
    good: Explains the reason and supports.
    weak: Ignores concerns.
  followups:
  - What did you reuse?
  - How did you respond to concerns?
  common_errors:
  - Ignores concerns.

- external_key: leadership.vision_strategy.focus_through_constraints
  competency_key: leadership
  topic: Using constraints to sharpen strategy
  difficulty: medium
  text: >-
    Tell me about a time a hard constraint, such as a small team or a fixed budget, helped make your strategy
    clearer.
  expected_concepts:
  - accepting the constraint as real
  - choosing fewer things
  - dropping lower-value work
  - finding creative routes
  - communicating the focus
  rubric:
    excellent: >-
      Treats the constraint as real, chooses fewer things, drops lower-value work, finds creative routes
      and communicates the focus, with the result.
    good: Describes prioritising under a constraint.
    weak: Describes asking for the constraint to be lifted.
  followups:
  - What did you drop?
  - What did the constraint force you to see?
  common_errors:
  - Describes asking for the constraint to be lifted.
