# Curated questions: leadership round, influence (part 2 of 4). Relationships, requests, product and sales tensions, written proposals and influence without a track record. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.influence.relationships_before_need
  competency_key: collaboration
  topic: Building working relationships ahead of time
  difficulty: easy
  text: >-
    How do you build working relationships with people outside your team before you need something from
    them?
  expected_concepts:
  - learning what other people are working on
  - offering help or information without being asked
  - regular light contact
  - being reliable on small commitments
  - understanding their constraints
  rubric:
    excellent: >-
      Describes deliberate habits such as sharing useful information and following through on small requests,
      and gives an example where an earlier relationship made a later request easy.
    good: Describes sensible habits like meeting people and offering help.
    weak: Contacts others only when a request is needed.
  followups:
  - Whom did you build a relationship with and why?
  - How do you do it when time is short?
  common_errors:
  - Contacts others only when a request is needed.

- external_key: leadership.influence.sharing_credit
  competency_key: leadership
  topic: Giving credit to others
  difficulty: easy
  text: >-
    How do you make sure credit for shared work is given to the right people, especially people who are
    not in the room?
  expected_concepts:
  - naming specific contributions
  - crediting in front of leaders
  - keeping a record of contributors
  - correcting omissions
  - encouraging others to present their work
  rubric:
    excellent: >-
      Names specific contributions in public settings, tracks contributors, corrects omissions and creates
      chances for others to present, with a concrete example.
    good: Mentions crediting colleagues in general terms with an example.
    weak: Takes credit for team results or never considers it.
  followups:
  - When did you correct a missing credit?
  - How does it help your influence?
  common_errors:
  - Takes credit for team results or never considers it.

- external_key: leadership.influence.plain_language_for_nontechnical
  competency_key: communication
  topic: Explaining a technical issue to a non-technical audience
  difficulty: easy
  text: >-
    Suppose you must get an executive with no engineering background to approve a costly fix. How do you
    frame the case so they can make the call?
  expected_concepts:
  - starting with the decision needed
  - using business terms and impact
  - using an analogy or simple picture
  - separating certain from uncertain
  - offering a clear recommendation
  rubric:
    excellent: >-
      Leads with the decision and impact, avoids jargon, uses an apt analogy or picture, separates what
      is known from uncertain and gives a recommendation.
    good: Simplifies the language and gives a clear recommendation.
    weak: Explains the technical detail without linking to a decision.
  followups:
  - What analogy worked well?
  - How do you check they understood?
  common_errors:
  - Explains the technical detail without linking to a decision.

- external_key: leadership.influence.making_a_request
  competency_key: stakeholder_management
  topic: Making an effective request to another team
  difficulty: easy
  text: When you need another team to do something for you, how do you make the request?
  expected_concepts:
  - being specific about what and by when
  - explaining why it matters to them
  - making it easy to act on
  - acknowledging their workload
  - agreeing a way to follow up
  rubric:
    excellent: >-
      Makes a specific request with a reason that matters to the other team, makes it easy to act on,
      respects their workload and agrees follow-up.
    good: Makes a clear request with the reason.
    weak: Sends a vague request or demand.
  followups:
  - What did you do when they said no?
  - How do you follow up?
  common_errors:
  - Sends a vague request or demand.

- external_key: leadership.influence.thanking_and_closing_loop
  competency_key: communication
  topic: Closing the loop with people who helped
  difficulty: easy
  text: >-
    After someone helps you get something done, what do you do to close the loop with them?
  expected_concepts:
  - telling them the outcome
  - thanking specifically
  - sharing what you learned from their input
  - remembering when they need help
  - keeping them updated
  rubric:
    excellent: >-
      Reports the outcome, thanks them for what they specifically did, shares what changed because of
      their input and offers help in return.
    good: Thanks them and shares the result.
    weak: Moves on without telling them how it ended.
  followups:
  - How does that affect future requests?
  - Can you give an example?
  common_errors:
  - Moves on without telling them how it ended.

- external_key: leadership.influence.scope_disagreement_with_product
  competency_key: stakeholder_management
  topic: Disagreeing with a product partner on scope
  difficulty: medium
  text: >-
    You and a product partner disagree on how much to include in a release. How do you work through it?
  expected_concepts:
  - understanding their goals and constraints
  - making trade-offs visible with costs
  - proposing a staged scope
  - agreeing success criteria
  - escalating jointly if still stuck
  rubric:
    excellent: >-
      Learns their goals, shows trade-offs with costs, proposes staged scope, agrees success criteria
      and escalates jointly only if necessary.
    good: Discusses concerns and finds a compromise.
    weak: Digs in or goes to a manager at once.
  followups:
  - What did you propose?
  - How did you reach agreement?
  common_errors:
  - Escalating to a manager before attempting to resolve it directly.

- external_key: leadership.influence.negotiating_deadlines_with_sales
  competency_key: stakeholder_management
  topic: Pushing back on a date a sales team set
  difficulty: medium
  text: >-
    A sales team promised a customer a date your team can't meet. How do you influence the outcome?
  expected_concepts:
  - understanding the customer need behind the date
  - showing what is feasible by when
  - offering options such as a smaller first delivery
  - agreeing how to talk to the customer
  - preventing a repeat
  rubric:
    excellent: >-
      Learns the need behind the date, shows feasible options, offers a staged delivery, agrees customer
      messaging with sales and sets up an earlier check-in process to prevent repeats.
    good: Explains constraints and finds an alternative.
    weak: Refuses the date or complains about sales.
  followups:
  - What option did you offer?
  - How did you prevent the next one?
  common_errors:
  - Refuses the date or complains about sales.

- external_key: leadership.influence.getting_design_review_time
  competency_key: collaboration
  topic: Getting time from busy senior reviewers
  difficulty: medium
  text: >-
    You need senior engineers to review an important design, but they are all busy. How do you get meaningful
    review?
  expected_concepts:
  - making the document short with clear questions
  - stating what feedback you need and by when
  - matching reviewers to concerns
  - offering a walkthrough
  - showing the value of early review
  rubric:
    excellent: >-
      Provides a short document with specific questions, matches reviewers to concerns, offers a walkthrough,
      sets a time frame and follows up.
    good: Shares the document and asks for comments by a date.
    weak: Sends a long document and waits.
  followups:
  - What questions did you ask?
  - What if no one responds?
  common_errors:
  - Sends a long document and waits.

- external_key: leadership.influence.cross_org_standards
  competency_key: leadership
  topic: Getting teams outside your reporting line to adopt a standard
  difficulty: medium
  text: >-
    You want teams that don't report to you to adopt a standard you've proposed. How do you gain traction?
  expected_concepts:
  - finding teams with the same pain
  - co-designing with a few
  - showing a working example
  - minimising effort to adopt
  - letting the standard evolve
  rubric:
    excellent: >-
      Starts with teams who share the pain, co-designs, shows a working example, minimises adoption effort,
      and lets the standard evolve with feedback.
    good: Proposes the standard and gathers feedback.
    weak: Publishes the standard and expects compliance.
  followups:
  - Which team joined first?
  - What did you change after feedback?
  common_errors:
  - Publishes the standard and expects compliance.

- external_key: leadership.influence.influencing_a_vendor
  competency_key: stakeholder_management
  topic: Getting a vendor to act on your needs
  difficulty: medium
  text: >-
    A vendor your teams depend on is not prioritising an issue that matters to you. How do you get them
    to act?
  expected_concepts:
  - documenting business impact
  - finding the right contact
  - aligning with their interests
  - coordinating with other customers
  - using contract levers appropriately
  rubric:
    excellent: >-
      Documents impact, finds the right contacts, links the issue to their interests, coordinates with
      other customers and uses contract levers appropriately.
    good: Escalates with evidence.
    weak: Complains repeatedly or threatens without a plan.
  followups:
  - Whom did you talk to at the vendor?
  - What did you offer?
  common_errors:
  - Complains repeatedly or threatens without a plan.

- external_key: leadership.influence.influence_when_new
  competency_key: adaptability
  topic: Influencing before you have a track record
  difficulty: medium
  text: >-
    You've just joined an organisation and see something that should change. How do you influence people
    when you haven't yet built credibility?
  expected_concepts:
  - learning the history and reasons first
  - finding allies
  - starting with small quick wins
  - asking questions rather than asserting
  - using data
  rubric:
    excellent: >-
      Learns the history, finds allies, delivers small wins first, asks questions, uses data and picks
      timing to raise bigger issues.
    good: Observes, builds relationships and raises ideas.
    weak: Pushes ideas immediately or stays silent.
  followups:
  - What did you hold back?
  - Who became your ally?
  common_errors:
  - Pushes ideas immediately or stays silent.

- external_key: leadership.influence.staffing_request_upward
  competency_key: stakeholder_management
  topic: Persuading leadership to add headcount
  difficulty: medium
  text: >-
    Your team is overloaded and you want to make the case for more people. How do you build and present
    it?
  expected_concepts:
  - showing demand and capacity with evidence
  - connecting to business outcomes
  - presenting options including doing less
  - being clear on cost and benefit
  - anticipating objections
  rubric:
    excellent: >-
      Shows demand and capacity evidence, ties to business outcomes, offers options including reduced
      scope, states costs and benefits and anticipates objections.
    good: Presents workload evidence and a request.
    weak: Says the team is busy without evidence.
  followups:
  - What option did you offer if the answer was no?
  - What objection did you expect?
  common_errors:
  - Says the team is busy without evidence.

- external_key: leadership.influence.raise_the_hiring_bar
  competency_key: leadership
  topic: Influencing hiring standards across groups
  difficulty: medium
  text: >-
    You think the hiring standards used in your area are inconsistent. How do you influence others to
    improve them?
  expected_concepts:
  - using evidence on outcomes
  - proposing a shared rubric
  - piloting with a team
  - training interviewers
  - sharing results
  rubric:
    excellent: >-
      Uses evidence, proposes a shared rubric, pilots, trains interviewers and shares results, with attention
      to fairness.
    good: Proposes improvements and discusses with others.
    weak: Criticises others' interviews without proposing a method.
  followups:
  - How did you show the inconsistency?
  - How did interviewers react?
  common_errors:
  - Criticises others' interviews without proposing a method.

- external_key: leadership.influence.security_team_priority
  competency_key: collaboration
  topic: Getting a specialist team to prioritise your need
  difficulty: medium
  text: >-
    You need a specialist team, such as security or data, to look at your project, and they have a long
    queue. How do you get their attention appropriately?
  expected_concepts:
  - understanding their intake process
  - making the request complete
  - explaining risk and deadlines
  - offering to do preparatory work
  - being flexible on scope
  rubric:
    excellent: >-
      Uses their intake process, submits a complete request, explains risk and date, offers preparatory
      work and flexes on scope.
    good: Submits a request and follows up.
    weak: Escalates around the process.
  followups:
  - What preparatory work did you do?
  - What if they still can't help?
  common_errors:
  - Escalates around the process.

- external_key: leadership.influence.motivating_a_team_not_yours
  competency_key: leadership
  topic: Getting commitment from people you don't manage
  difficulty: medium
  text: >-
    You are leading an initiative with contributors who report to other managers. How do you keep them
    committed?
  expected_concepts:
  - connecting the work to their goals
  - agreeing time with their managers
  - clear small tasks
  - regular visible progress
  - recognition to them and their managers
  rubric:
    excellent: >-
      Connects the work to their goals, agrees time with their managers, gives clear tasks, shows progress
      and recognises them to their managers.
    good: Keeps contributors informed and motivated.
    weak: Assigns tasks as if they report to you.
  followups:
  - How did you talk to their managers?
  - What did you do when someone was pulled away?
  common_errors:
  - Assigns tasks as if they report to you.

- external_key: leadership.influence.coalition_building
  competency_key: stakeholder_management
  topic: Building a coalition behind an idea
  difficulty: medium
  text: >-
    Tell me about building support from several groups for an idea before you presented it formally.
  expected_concepts:
  - identifying who is affected
  - one-to-one conversations
  - incorporating feedback
  - finding a shared benefit
  - presenting with others
  rubric:
    excellent: >-
      Identifies those affected, talks to them individually, incorporates feedback, finds shared benefit
      and presents together.
    good: Talks to several people before presenting.
    weak: Presents the idea cold in a large meeting.
  followups:
  - Whose feedback changed the idea?
  - How did you handle someone who opposed it?
  common_errors:
  - Presents the idea cold in a large meeting.

- external_key: leadership.influence.rfc_written_influence
  competency_key: communication
  topic: Using a written proposal to build agreement
  difficulty: medium
  text: >-
    How do you structure a written proposal so that a wide group can understand it, comment on it and
    reach a decision?
  expected_concepts:
  - problem first
  - options and trade-offs
  - clear recommendation
  - explicit decision deadline and owner
  - managing comments
  rubric:
    excellent: >-
      States the problem, options and trade-offs, a recommendation, decision owner and deadline, and describes
      how comments are handled and resolved.
    good: Writes a clear proposal with comments.
    weak: Writes a long document without a decision process.
  followups:
  - How do you manage conflicting comments?
  - How long is it?
  common_errors:
  - Writes a long document without a decision process.

- external_key: leadership.influence.dominant_senior_voice
  competency_key: communication
  topic: A meeting dominated by one senior voice
  difficulty: medium
  text: >-
    In a meeting, one senior person's opinion carries the room, and you think they're missing something.
    How do you raise it?
  expected_concepts:
  - preparing evidence
  - asking a question first
  - speaking privately before if possible
  - framing as a risk to shared goals
  - accepting their final decision if the case is heard
  rubric:
    excellent: >-
      Prepares evidence, asks a question to open the issue, uses a private conversation if possible, frames
      it as a shared goal and accepts the final decision if heard.
    good: Raises the point respectfully with some evidence.
    weak: Stays silent or confronts publicly.
  followups:
  - Have you changed a senior person's mind?
  - What did you do when you couldn't?
  common_errors:
  - Stays silent or confronts publicly.

- external_key: leadership.influence.persuading_a_peer_vp
  competency_key: stakeholder_management
  topic: Persuading a peer leader whose goals conflict with yours
  difficulty: hard
  text: >-
    A peer at your level in another group has goals that conflict with yours on a shared issue. How do
    you reach a workable outcome?
  expected_concepts:
  - understanding their incentives
  - searching for shared goals
  - offering trade-offs
  - involving a neutral party if needed
  - documenting agreements
  rubric:
    excellent: >-
      Maps their incentives, finds shared goals, offers trade-offs, involves neutral parties if needed
      and documents agreement.
    good: Discusses goals and compromises.
    weak: Escalates the conflict upward immediately.
  followups:
  - What did each of you give up?
  - How did you keep it from recurring?
  common_errors:
  - Escalates the conflict upward immediately.

- external_key: leadership.influence.changing_long_held_strategy
  competency_key: leadership
  topic: Moving leaders off a long-held position
  difficulty: hard
  text: >-
    Senior leaders have held a particular approach for years and you believe it needs to change. How do
    you influence them?
  expected_concepts:
  - respecting why it was chosen
  - showing changed conditions with evidence
  - proposing a small test
  - finding a sponsor
  - allowing the leaders to own the new direction
  rubric:
    excellent: >-
      Respects the original reasons, shows changed conditions with evidence, proposes a small test, finds
      a sponsor and lets leaders own the new direction.
    good: Presents evidence and a recommendation.
    weak: Criticises the old approach.
  followups:
  - What evidence mattered most?
  - How did you deal with defensiveness?
  common_errors:
  - Criticises the old approach.

- external_key: leadership.influence.conflicting_incentives_groups
  competency_key: problem_solving
  topic: Groups with incentives that clash
  difficulty: hard
  text: >-
    Two groups are each rewarded for outcomes that work against each other, so each acts reasonably but
    the combination is bad. How do you influence a fix?
  expected_concepts:
  - making the incentive conflict visible
  - quantifying the shared cost
  - proposing shared goals or metrics
  - involving the leaders who set incentives
  - avoiding blaming either group
  rubric:
    excellent: >-
      Makes the conflict visible with numbers, avoids blame, proposes shared goals or metrics and works
      with those who set incentives.
    good: Brings the groups together to discuss.
    weak: Blames one group.
  followups:
  - What shared metric did you suggest?
  - Who set their goals?
  common_errors:
  - Blames one group.

- external_key: leadership.influence.influencing_customers_externally
  competency_key: communication
  topic: Influencing a customer to change their approach
  difficulty: hard
  text: >-
    A customer's way of using your product causes problems for both sides, and they are resistant to changing.
    How do you influence them?
  expected_concepts:
  - understanding their reasons
  - showing the effect on their outcomes
  - offering a practical alternative
  - involving their technical lead
  - agreeing next steps and following up
  rubric:
    excellent: >-
      Learns their reasons, shows the effect on their outcomes, offers a practical alternative, involves
      technical leads and agrees steps.
    good: Explains the issue and recommends changes.
    weak: Tells them they are wrong.
  followups:
  - What was the turning point?
  - How did you keep the relationship?
  common_errors:
  - Tells them they are wrong.

- external_key: leadership.influence.influence_after_setback
  competency_key: adaptability
  topic: Rebuilding influence after a setback
  difficulty: hard
  text: >-
    A recommendation of yours turned out to be wrong, and you've lost some credibility. How do you rebuild
    it?
  expected_concepts:
  - owning the error openly
  - explaining what you learned
  - delivering reliably on smaller things
  - asking for input more
  - being patient
  rubric:
    excellent: >-
      Owns the error, shares lessons, delivers reliably, seeks more input and shows consistent change
      over time.
    good: Acknowledges the mistake and works to improve.
    weak: Defends the original recommendation.
  followups:
  - What did you change in how you advise?
  - How long did it take?
  common_errors:
  - Defends the original recommendation.

- external_key: leadership.influence.influence_outside_expertise
  competency_key: leadership
  topic: Influencing in a domain where others know more
  difficulty: hard
  text: >-
    You need to influence a decision in an area where you have less expertise than others in the room.
    How do you contribute without bluffing?
  expected_concepts:
  - being clear about what you do not know
  - asking probing questions
  - focusing on goals and constraints
  - relying on experts
  - bringing a perspective others lack
  rubric:
    excellent: >-
      States the limits, asks probing questions, focuses on goals and constraints, uses experts and contributes
      an overlooked perspective.
    good: Asks questions and defers to experts where needed.
    weak: Bluffs or stays quiet.
  followups:
  - What perspective did you add?
  - How did you learn the area?
  common_errors:
  - Bluffs or stays quiet.

- external_key: leadership.influence.ethical_boundaries_of_influence
  competency_key: ownership
  topic: Where persuasion becomes manipulation
  difficulty: hard
  text: >-
    Where do you draw the line between persuading someone and manipulating them, and has that ever come
    up in your work?
  expected_concepts:
  - being transparent about aims
  - presenting evidence including against your case
  - not exploiting someone's position
  - respecting decision rights
  - accepting a no
  rubric:
    excellent: >-
      Defines the line in terms of transparency and respect, shows a concrete case, presents counter-evidence,
      respects decision rights and accepts a no.
    good: Gives a reasonable principle and example.
    weak: Treats any means as acceptable to win.
  followups:
  - Have you been on the receiving end?
  - What did you do?
  common_errors:
  - Treats any means as acceptable to win.
