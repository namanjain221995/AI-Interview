# Curated questions: leadership round, vision and strategy (part 2 of 4). Charters, goals, roadmaps, funding choices, competition, reorganising around strategy and pivots. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.vision_strategy.strategy_matters_to_engineers
  competency_key: communication
  topic: Why strategy matters for people doing the work
  difficulty: easy
  text: >-
    How would you explain to an engineer who is focused on their tasks why the team's strategy matters
    to their day-to-day work?
  expected_concepts:
  - connecting tasks to outcomes
  - helping with trade-off decisions
  - reducing wasted work
  - giving context for priorities
  - inviting questions
  rubric:
    excellent: >-
      Connects tasks to outcomes with a concrete example, shows how strategy helps people make trade-off
      decisions on their own and invites questions.
    good: Explains that strategy gives context and priorities.
    weak: Treats strategy as something for managers only.
  followups:
  - Can you give an example of a decision it helped?
  - How do you check it is understood?
  common_errors:
  - Treats strategy as something for managers only.

- external_key: leadership.vision_strategy.team_charter
  competency_key: leadership
  topic: Writing a charter for a team
  difficulty: easy
  text: >-
    What goes into a short charter for a team, and how would you write one with the team?
  expected_concepts:
  - purpose and customers
  - scope and what is outside it
  - key responsibilities
  - how success is measured
  - how to work with others
  rubric:
    excellent: >-
      Covers purpose, customers, scope and exclusions, responsibilities, success measures and working
      agreements, written with team input and reviewed over time.
    good: Covers purpose and responsibilities with team input.
    weak: Writes a long generic document alone.
  followups:
  - What is outside scope for your team?
  - How often do you revisit it?
  common_errors:
  - Writes a long generic document alone.

- external_key: leadership.vision_strategy.define_success
  competency_key: project_management
  topic: Agreeing what success looks like
  difficulty: easy
  text: >-
    At the start of a piece of work, how do you agree with stakeholders what success will look like?
  expected_concepts:
  - outcomes not outputs
  - a few measurable indicators
  - baseline
  - timeframe
  - who judges
  rubric:
    excellent: >-
      Defines outcomes with a few measurable indicators, baseline and timeframe, and agrees who judges,
      with an example.
    good: Agrees goals and some measures.
    weak: Defines success as completing tasks.
  followups:
  - What was the baseline?
  - What if the stakeholders disagree?
  common_errors:
  - Defines success as completing tasks.

- external_key: leadership.vision_strategy.team_input_on_direction
  competency_key: collaboration
  topic: Asking the team to shape direction
  difficulty: easy
  text: >-
    How do you gather the team's ideas before setting direction, and what do you do with them?
  expected_concepts:
  - structured sessions or written input
  - hearing quieter people
  - clustering themes
  - explaining what was used and not
  - closing the loop
  rubric:
    excellent: >-
      Uses structured and written input so quieter people contribute, clusters themes, explains what was
      used and what not and closes the loop.
    good: Holds discussion sessions and uses ideas.
    weak: Collects ideas but never responds.
  followups:
  - What did the team change?
  - How do you handle ideas you do not use?
  common_errors:
  - Collecting suggestions and never reporting back.

- external_key: leadership.vision_strategy.good_goal_bad_goal
  competency_key: problem_solving
  topic: Telling a good goal from a poor one
  difficulty: easy
  text: What makes a goal useful for a team, and what makes one unhelpful?
  expected_concepts:
  - clear outcome
  - measurable
  - within the team's influence
  - ambitious but credible
  - limited number
  rubric:
    excellent: >-
      Describes outcome focus, measurability, influence, credible ambition and limited numbers, with examples
      of each good and poor goal.
    good: Describes some characteristics with an example.
    weak: Gives vague descriptions.
  followups:
  - What is an example of a poor goal you wrote?
  - How do you revise it?
  common_errors:
  - Gives vague descriptions.

- external_key: leadership.vision_strategy.okr_cascade
  competency_key: project_management
  topic: Linking team goals to company goals
  difficulty: medium
  text: >-
    How do you link your team's goals to company-level goals without turning it into a mechanical cascade?
  expected_concepts:
  - understanding the company priorities
  - deciding where the team contributes most
  - bottom-up input
  - allowing goals not tied to a company item when justified
  - regular check-ins
  rubric:
    excellent: >-
      Understands company priorities, picks where the team contributes most, uses bottom-up input, allows
      justified exceptions and reviews regularly.
    good: Aligns goals with company priorities and reviews.
    weak: Copies company goals onto the team.
  followups:
  - What goal was bottom-up?
  - How do you handle goals that don't link?
  common_errors:
  - Copies company goals onto the team.

- external_key: leadership.vision_strategy.strategy_with_competition
  competency_key: stakeholder_management
  topic: Shaping strategy around competitors
  difficulty: medium
  text: >-
    A competitor launches something that overlaps with your product. How do you decide how to respond
    strategically?
  expected_concepts:
  - understanding what customers value
  - assessing real versus perceived threat
  - identifying your strengths
  - choosing to match, differentiate or ignore
  - avoiding reactive thrash
  rubric:
    excellent: >-
      Learns customer value, assesses the real threat, identifies strengths, chooses match, differentiate
      or ignore with reasons and avoids reactive changes.
    good: Analyses the competitor and chooses a response.
    weak: Copies the competitor or ignores them.
  followups:
  - What did you decide not to match?
  - How did you test your assumption?
  common_errors:
  - Copies the competitor or ignores them.

- external_key: leadership.vision_strategy.roadmap_from_strategy
  competency_key: project_management
  topic: Turning strategy into a roadmap
  difficulty: medium
  text: >-
    How do you turn a strategy into a roadmap that teams can act on without becoming a rigid commitment
    list?
  expected_concepts:
  - themes tied to outcomes
  - time horizons
  - separating committed from exploratory
  - dependencies
  - review cadence
  rubric:
    excellent: >-
      Organises by themes and outcomes, uses horizons, separates committed from exploratory, notes dependencies
      and reviews regularly.
    good: Builds a roadmap from strategic priorities.
    weak: Lists features with dates.
  followups:
  - How do you handle changes?
  - What is committed?
  common_errors:
  - Lists features with dates.

- external_key: leadership.vision_strategy.platform_vs_product_bets
  competency_key: leadership
  topic: Balancing platform investment against product features
  difficulty: medium
  text: >-
    Strategy needs both product features and underlying platform work. How do you decide the balance?
  expected_concepts:
  - customer and revenue impact
  - how platform unlocks speed
  - clear measures of platform benefit
  - sequencing
  - reviewing the balance
  rubric:
    excellent: >-
      Considers customer impact, how the platform unlocks speed, sets measures for platform benefit, sequences
      and reviews the balance.
    good: Allocates a share to each with reasons.
    weak: Prioritises one entirely.
  followups:
  - What measures did you use?
  - How did you adjust over time?
  common_errors:
  - Prioritises one entirely.

- external_key: leadership.vision_strategy.funding_strategy_tradeoffs
  competency_key: stakeholder_management
  topic: Allocating limited funds across strategic goals
  difficulty: medium
  text: You can fund only some of your strategic goals this year. How do you choose?
  expected_concepts:
  - expected value and strategic importance
  - dependencies
  - minimum viable funding for each
  - stop criteria
  - transparency about choices
  rubric:
    excellent: >-
      Compares expected value and importance, considers dependencies, identifies minimum viable funding,
      sets stop criteria and is transparent about choices.
    good: Ranks goals and funds the top ones.
    weak: Spreads funding evenly.
  followups:
  - What did you defer?
  - How did you explain it?
  common_errors:
  - Spreads funding evenly.

- external_key: leadership.vision_strategy.review_cadence
  competency_key: ownership
  topic: Setting a rhythm for revisiting strategy
  difficulty: medium
  text: >-
    How often and how do you revisit strategy so it stays current without constant churn?
  expected_concepts:
  - scheduled reviews
  - triggers for unscheduled reviews
  - evidence reviewed
  - who attends
  - recording changes
  rubric:
    excellent: >-
      Sets scheduled reviews and triggers for unscheduled ones, reviews evidence, involves the right people
      and records changes.
    good: Reviews quarterly with some evidence.
    weak: Reviews only when something goes wrong.
  followups:
  - What triggered an extra review?
  - What do you record?
  common_errors:
  - Reviews only when something goes wrong.

- external_key: leadership.vision_strategy.new_market_entry
  competency_key: product_sense
  topic: Strategy for entering a new market
  difficulty: medium
  text: >-
    Your organisation wants to enter a new market where it has no history. What strategic questions do
    you ask and how do you reduce risk?
  expected_concepts:
  - customer needs in the market
  - competitive position
  - capabilities needed
  - small initial entry
  - learning milestones
  rubric:
    excellent: >-
      Asks about customer needs, competitors and capabilities, enters small with learning milestones and
      reviews.
    good: Researches and plans a pilot.
    weak: Commits fully from assumptions.
  followups:
  - What would you test first?
  - What milestone would make you stop?
  common_errors:
  - Commits fully from assumptions.

- external_key: leadership.vision_strategy.metric_hierarchy
  competency_key: problem_solving
  topic: Structuring measures from top to team level
  difficulty: medium
  text: >-
    How do you structure metrics so that team-level measures connect to the outcomes the business cares
    about?
  expected_concepts:
  - a north-star outcome
  - input metrics teams influence
  - guardrails
  - avoiding too many measures
  - review for gaming
  rubric:
    excellent: >-
      Defines an outcome measure, input metrics teams influence, guardrails, limits the count and reviews
      for gaming.
    good: Chooses a few metrics linked to outcomes.
    weak: Tracks many unconnected metrics.
  followups:
  - Which metric was gamed?
  - What guardrail did you add?
  common_errors:
  - Tracks many unconnected metrics.

- external_key: leadership.vision_strategy.strategy_remote_orgs
  competency_key: communication
  topic: Sharing strategy across distributed teams
  difficulty: medium
  text: >-
    How do you make sure a distributed organisation understands and remembers the strategy?
  expected_concepts:
  - a short written statement
  - recorded walkthroughs
  - regular reinforcement
  - local discussions
  - checking understanding
  rubric:
    excellent: >-
      Uses a short written statement, recorded walkthroughs, repetition, local discussions and checks
      understanding.
    good: Writes it down and shares it in meetings.
    weak: Presents it once.
  followups:
  - How do you check understanding?
  - What do people forget?
  common_errors:
  - Presents it once.

- external_key: leadership.vision_strategy.strategy_and_debt
  competency_key: leadership
  topic: Making room for technical health in strategy
  difficulty: medium
  text: >-
    How do you reflect technical health work in a business strategy without it being seen as a separate
    engineering wish list?
  expected_concepts:
  - link to business outcomes
  - tangible measures
  - sizing
  - fit into themes
  - making trade-offs visible
  rubric:
    excellent: >-
      Links to business outcomes, sets measures, sizes the work, fits it into themes and makes trade-offs
      visible.
    good: Includes technical work with justification.
    weak: Keeps technical work separate.
  followups:
  - What outcome did you link to?
  - How did you measure?
  common_errors:
  - Keeps technical work separate.

- external_key: leadership.vision_strategy.saying_no_to_good_ideas
  competency_key: leadership
  topic: Declining good ideas that don't fit
  difficulty: medium
  text: >-
    How do you say no to good ideas that don't fit the strategy, so that people keep bringing ideas?
  expected_concepts:
  - explaining the criteria
  - acknowledging merit
  - offering where it might fit
  - keeping an idea backlog
  - consistent decisions
  rubric:
    excellent: >-
      Explains the criteria, acknowledges merit, suggests where it might fit, maintains a backlog and
      is consistent.
    good: Declines with reasons.
    weak: Says yes to all or declines without reasons.
  followups:
  - What do you do with the backlog?
  - Tell me about an idea that returned.
  common_errors:
  - Says yes to all or declines without reasons.

- external_key: leadership.vision_strategy.aligning_squads
  competency_key: collaboration
  topic: Keeping several squads pulling the same way
  difficulty: medium
  text: >-
    Several squads own different parts of a strategy. How do you keep them aligned without constant meetings?
  expected_concepts:
  - shared goals and principles
  - written plans
  - regular light syncs
  - clear interfaces
  - resolving conflicts early
  rubric:
    excellent: >-
      Uses shared goals and principles, written plans, light syncs, clear interfaces and early conflict
      resolution.
    good: Holds regular syncs and shares plans.
    weak: Relies on frequent heavy meetings.
  followups:
  - What did you drop from the meetings?
  - How do you spot drift?
  common_errors:
  - Relies on frequent heavy meetings.

- external_key: leadership.vision_strategy.customer_vs_internal_priorities
  competency_key: stakeholder_management
  topic: Balancing customer and internal needs in strategy
  difficulty: medium
  text: >-
    How do you balance work that customers asked for with internal work that makes the whole thing sustainable?
  expected_concepts:
  - customer impact
  - internal cost and risk
  - shared measures
  - explicit allocation
  - communicating the reasoning
  rubric:
    excellent: >-
      Considers customer impact and internal costs, uses shared measures, sets allocations and communicates
      reasoning.
    good: Allocates time to both.
    weak: Prioritises only external requests.
  followups:
  - What is the allocation?
  - How do you explain it to customers?
  common_errors:
  - Prioritises only external requests.

- external_key: leadership.vision_strategy.reorganise_around_strategy
  competency_key: leadership
  topic: Aligning the organisation structure with strategy
  difficulty: hard
  text: >-
    Your strategy changed, but the team structure still reflects the old one. How do you decide whether
    and how to restructure?
  expected_concepts:
  - identifying mismatches between structure and strategy
  - trying lighter changes first
  - considering costs of disruption
  - involving affected people
  - staged approach
  rubric:
    excellent: >-
      Identifies mismatches, tries lighter changes first, weighs disruption, involves people and stages
      the change.
    good: Reorganises teams to match the strategy with consultation.
    weak: Restructures without considering disruption.
  followups:
  - What lighter change did you try?
  - How did people respond?
  common_errors:
  - Restructures without considering disruption.

- external_key: leadership.vision_strategy.strategy_after_leader_change
  competency_key: adaptability
  topic: Keeping strategy coherent when leaders change
  difficulty: hard
  text: >-
    A new executive arrives and wants to change the strategy you built. How do you handle it?
  expected_concepts:
  - understanding their reasoning
  - presenting the evidence behind existing choices
  - identifying what to keep
  - being open to change
  - avoiding whiplash
  rubric:
    excellent: >-
      Understands reasoning, shares evidence, identifies what to keep, is open to changes and manages
      the transition.
    good: Discusses and adapts.
    weak: Defends or drops everything.
  followups:
  - What did you keep?
  - How did you protect your team?
  common_errors:
  - Defends or drops everything.

- external_key: leadership.vision_strategy.turnaround_area
  competency_key: ownership
  topic: Setting direction for a struggling area
  difficulty: hard
  text: >-
    You inherit an area that is struggling with quality, unclear delivery and unclear direction. What
    is your approach to setting direction?
  expected_concepts:
  - diagnosing with data and listening
  - a few priorities
  - quick visible improvements
  - building credibility
  - longer-term plan
  rubric:
    excellent: >-
      Diagnoses with data and listening, chooses a few priorities, delivers visible improvements, builds
      credibility and sets a longer plan.
    good: Diagnoses and sets priorities.
    weak: Imposes a plan without diagnosis.
  followups:
  - What was the first quick win?
  - What did you stop?
  common_errors:
  - Imposes a plan without diagnosis.

- external_key: leadership.vision_strategy.long_term_vs_quarterly
  competency_key: leadership
  topic: Protecting long-term direction against short-term pressure
  difficulty: hard
  text: >-
    Quarterly targets keep pulling attention away from long-term strategy. How do you handle that?
  expected_concepts:
  - protecting a portion of capacity
  - linking long-term work to near-term indicators
  - communicating costs of neglect
  - leadership support
  - checking regularly
  rubric:
    excellent: >-
      Protects capacity, links long-term work to near-term indicators, communicates costs, gets leadership
      support and checks regularly.
    good: Reserves time and explains.
    weak: Gives in to quarterly pressure.
  followups:
  - What share did you protect?
  - What indicator did you use?
  common_errors:
  - Gives in to quarterly pressure.

- external_key: leadership.vision_strategy.acquisition_fit
  competency_key: stakeholder_management
  topic: Evaluating an acquisition against strategy
  difficulty: hard
  text: >-
    Leadership is considering acquiring a company. How would you evaluate whether it fits the strategy
    from a technical and organisational viewpoint?
  expected_concepts:
  - strategic rationale
  - capability fit
  - integration cost and risk
  - people and culture of work
  - alternatives to buying
  rubric:
    excellent: >-
      Tests the rationale, capability fit, integration cost and risk, people and working practices, and
      alternatives.
    good: Evaluates fit and cost.
    weak: Accepts the rationale without testing.
  followups:
  - What would be a red flag?
  - What alternatives did you consider?
  common_errors:
  - Accepts the rationale without testing.

- external_key: leadership.vision_strategy.strategic_pivot
  competency_key: adaptability
  topic: Leading a significant pivot
  difficulty: hard
  text: >-
    Tell me about a time a strategy needed a major pivot. How did you decide and lead the team through
    it?
  expected_concepts:
  - evidence for pivoting
  - what to keep
  - clear explanation
  - revised goals
  - supporting the team
  rubric:
    excellent: >-
      Uses evidence, decides what to keep, explains clearly, revises goals and supports the team, with
      the result.
    good: Describes the pivot and communication.
    weak: Pivots abruptly with little explanation.
  followups:
  - What did you keep?
  - How did the team respond?
  common_errors:
  - Pivots abruptly with little explanation.

- external_key: leadership.vision_strategy.strategy_incomplete_market_view
  competency_key: problem_solving
  topic: Setting strategy with a partial view of the market
  difficulty: hard
  text: >-
    You must set strategy when you only have partial information about the market. How do you do it?
  expected_concepts:
  - stating assumptions
  - seeking diverse inputs
  - focusing on options that perform in several scenarios
  - early experiments
  - review points
  rubric:
    excellent: >-
      States assumptions, seeks diverse inputs, prefers options that work in several scenarios, runs early
      experiments and sets review points.
    good: Gathers information and decides with assumptions.
    weak: Waits for complete information or guesses.
  followups:
  - Which assumption was most uncertain?
  - What experiment did you run?
  common_errors:
  - Waits for complete information or guesses.
