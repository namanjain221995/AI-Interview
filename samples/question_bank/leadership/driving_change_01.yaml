# Curated questions: leadership round, driving organisational and technical change (part 1 of 4).
# Focus: making the case for change, diagnosing the current state, sponsorship, pilots and early
# adopters, and working with sceptics. Answers are judged on the substance of the example only.
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager, product_manager]
  round_types: [leadership]
  kind: leadership
questions:
  # ------------------------------------------------------------ making the case
  - external_key: leadership.driving_change.first_change_you_drove
    competency_key: leadership
    topic: A change you started yourself
    difficulty: easy
    text: >-
      Tell me about a change in how your team worked or built things that you personally got started. What
      prompted it, and what was different once it was in place?
    expected_concepts:
      - the specific problem or opportunity that triggered it
      - why the candidate chose to act rather than wait
      - first concrete steps taken
      - who else had to agree or take part
      - observable difference afterwards
    rubric:
      excellent: Names a specific trigger, describes their own first steps and how they brought others in, and gives a concrete before-and-after difference.
      good: Clear example with the candidate's role and a positive outcome, but little on how others were brought along.
      weak: Describes a change someone else led, or stays general without a real outcome.
    followups:
      - Who was the first person you talked to about it, and why them?
      - What would have happened if you hadn't pushed for it?
    common_errors:
      - Describing a change that was handed down to them as one they initiated.

  - external_key: leadership.driving_change.why_now_case
    competency_key: leadership
    topic: Explaining why a change should happen now
    difficulty: medium
    text: >-
      Most changes compete with a dozen other good ideas. Tell me about a time you had to convince people that
      a particular change needed to happen now rather than next year. How did you make that case?
    expected_concepts:
      - cost of staying with the current approach
      - evidence such as incidents, delivery data or customer impact
      - timing argument tied to upcoming business events
      - framing in terms the audience cares about
      - what was deprioritised to make room
    rubric:
      excellent: Builds the case on concrete evidence of the cost of waiting, ties timing to real business events, adapts the argument to the audience and is clear about what gave way.
      good: Uses some evidence and explains the urgency, but the trade-off against other work is thin.
      weak: Relies on personal preference or general best practice with no evidence or timing argument.
    followups:
      - What was the strongest counter-argument you heard?
      - What did you agree to stop doing to make room?
    common_errors:
      - Arguing that something is modern or best practice without showing what the current approach costs.

  - external_key: leadership.driving_change.diagnosing_before_proposing
    competency_key: leadership
    topic: Understanding the current state before proposing change
    difficulty: medium
    text: >-
      Before you proposed a significant change to a system or process, how did you make sure you understood why
      things were the way they were? Walk me through a specific case.
    expected_concepts:
      - talking to the people who built or run the current approach
      - looking at history such as past decisions, incidents or documents
      - separating real constraints from habit
      - gathering data on how the current approach performs
      - adjusting the proposal based on what was learned
    rubric:
      excellent: Describes deliberate discovery with the original owners and data, identifies constraints that were still valid, and shows how the proposal changed as a result.
      good: Did some investigation and talked to people, but the effect on the proposal is unclear.
      weak: Assumed the current approach was simply wrong and went straight to a solution.
    followups:
      - What did you learn that surprised you?
      - Was there a constraint you nearly missed?
    common_errors:
      - Treating the existing design as a mistake without asking why it was chosen.

  - external_key: leadership.driving_change.quantifying_cost_of_status_quo
    competency_key: product_sense
    topic: Putting numbers on the cost of doing nothing
    difficulty: medium
    text: >-
      How have you put a number, or at least a credible estimate, on what it costs an organisation to keep
      things as they are? Tell me about a change where that estimate shaped the decision.
    expected_concepts:
      - choice of measure such as engineering hours, lead time, incidents or lost revenue
      - where the data came from and its limits
      - comparing cost of change with cost of staying
      - presenting ranges instead of false precision
      - how the estimate influenced the decision makers
    rubric:
      excellent: Explains a sensible measure, the data behind it and its uncertainty, compares it with the cost of the change and shows how it changed the decision.
      good: Gives a reasonable estimate and explains it, but is loose on data sources or uncertainty.
      weak: Offers no numbers, or numbers with no basis or connection to the decision.
    followups:
      - How did you handle people who challenged your numbers?
      - Looking back, how accurate was the estimate?
    common_errors:
      - Presenting a precise figure that cannot be traced back to any data.

  - external_key: leadership.driving_change.one_page_proposal
    competency_key: communication
    topic: Writing a proposal for change
    difficulty: easy
    text: >-
      When you've written a proposal to change something important, like a tool, a process or an architecture,
      what did you put in it so that busy people could understand it and decide? Use a real proposal as your example.
    expected_concepts:
      - clear problem statement up front
      - options considered including doing nothing
      - recommendation with trade-offs
      - cost, timeline and risks
      - the specific decision being asked for
    rubric:
      excellent: Describes a real proposal with a crisp problem statement, alternatives including the status quo, explicit trade-offs and a clear ask, and explains how readers used it.
      good: Covers the problem and recommendation clearly, with lighter treatment of alternatives or the ask.
      weak: Describes the solution only, with no problem framing, alternatives or decision request.
    followups:
      - What feedback changed the proposal before it was approved?
      - Who did you share the draft with first?
    common_errors:
      - Leaving out the option of doing nothing, which makes the proposal look one-sided.

  # ------------------------------------------------------------ sponsorship and alignment
  - external_key: leadership.driving_change.finding_a_sponsor
    competency_key: stakeholder_management
    topic: Getting a senior sponsor for change
    difficulty: medium
    text: >-
      Think of a change you led that only worked once a more senior leader backed it. Why that person rather
      than someone else, and what concrete support did you request from them?
    expected_concepts:
      - choosing a sponsor with authority over the affected area
      - linking the change to the sponsor's goals
      - specific asks such as funding, air cover or decisions
      - keeping the sponsor informed and involved
      - using sponsorship sparingly
    rubric:
      excellent: Explains why that sponsor was the right one, ties the change to their priorities, makes specific asks and describes how sponsorship was used at key moments.
      good: Secured a sponsor and explains their role, but the asks were general.
      weak: Mentions approval from a manager with no thought about what sponsorship was needed for.
    followups:
      - Was there a moment you needed the sponsor to step in? What happened?
      - How did you keep them engaged over time?
    common_errors:
      - Treating a one-time approval as ongoing sponsorship.

  - external_key: leadership.driving_change.sponsor_lost_interest
    competency_key: stakeholder_management
    topic: Sponsor support fading partway through
    difficulty: hard
    text: >-
      Imagine you're six months into a change programme and the executive who championed it has moved on to
      other priorities and stopped turning up to reviews. Teams are starting to notice. What would you do?
    expected_concepts:
      - diagnosing why attention moved
      - re-establishing the link to current business priorities
      - deciding whether the programme should be resized or stopped
      - finding or building additional sponsors
      - keeping teams informed without overpromising
    rubric:
      excellent: Diagnoses the cause, reconnects the work to current priorities or proposes resizing it, broadens sponsorship and communicates plainly with teams; considers stopping as a legitimate outcome.
      good: Re-engages the sponsor and keeps work moving, but does not question whether the programme still makes sense.
      weak: Simply continues as before, or escalates around the sponsor without understanding why support faded.
    followups:
      - What would make you recommend stopping the programme?
      - How would you explain the situation to the teams doing the work?
    common_errors:
      - Assuming the original case still holds without checking whether priorities have genuinely changed.

  - external_key: leadership.driving_change.aligning_peer_leads
    competency_key: stakeholder_management
    topic: Getting peer leads to agree on a shared change
    difficulty: medium
    text: >-
      Tell me about a time you needed several peer leads or managers to commit to the same change across their
      teams. How did you get to an agreement that actually held?
    expected_concepts:
      - one-to-one conversations before group meetings
      - understanding each team's constraints
      - adjusting the proposal to address real objections
      - explicit written agreement on scope and timing
      - checking that commitments were kept
    rubric:
      excellent: Describes groundwork with each peer, concrete adjustments made for their constraints, a recorded agreement and follow-through that confirmed it held.
      good: Reached agreement through discussion, but is vague about how it was made durable.
      weak: Relied on a single meeting or on a manager mandate and cannot say whether teams followed through.
    followups:
      - Which peer was hardest to bring along, and what changed their position?
      - What happened when one team fell behind?
    common_errors:
      - Mistaking a quiet meeting for agreement.

  # ------------------------------------------------------------ pilots and early adopters
  - external_key: leadership.driving_change.choosing_pilot_team
    competency_key: leadership
    topic: Choosing where to pilot a change
    difficulty: medium
    text: >-
      When you've piloted a new tool, practice or platform before rolling it out widely, how did you choose
      the first team or project to try it on? Tell me about a pilot you ran and what you learned from it.
    expected_concepts:
      - representative but not highest-risk pilot
      - willing team with real need
      - clear success criteria agreed before starting
      - feedback loop and changes made from it
      - decision on whether to expand
    rubric:
      excellent: Explains a deliberate choice balancing representativeness and risk, sets success criteria in advance, and describes specific changes made from pilot feedback before expanding.
      good: Ran a sensible pilot and learned from it, but chose the team mostly by convenience or lacked clear criteria.
      weak: Picked the easiest team so the pilot would succeed, or cannot say what the pilot taught them.
    followups:
      - What did the pilot reveal that you wouldn't have predicted?
      - Would a different pilot team have given you a different answer?
    common_errors:
      - Choosing a pilot that is so favourable its results say nothing about the wider rollout.

  - external_key: leadership.driving_change.pilot_mixed_results
    competency_key: leadership
    topic: Deciding what to do after a mixed pilot
    difficulty: hard
    text: >-
      Your pilot of a new deployment process went well for one team and badly for another, and leadership wants
      a go or no-go decision next week. How would you work out what the results actually mean and what to recommend?
    expected_concepts:
      - comparing context differences between the two teams
      - separating problems with the change from problems with the rollout
      - checking data against the success criteria
      - options beyond go or no-go such as staged or conditional rollout
      - clear recommendation with stated uncertainty
    rubric:
      excellent: Investigates why the outcomes differed, separates design flaws from adoption issues, considers conditional or staged options and gives a clear recommendation with its uncertainty stated.
      good: Analyses the difference sensibly and recommends a path, but considers only go or no-go.
      weak: Averages the results or picks the outcome that suits their preference without investigating.
    followups:
      - What would you tell the team for whom it went badly?
      - What extra evidence would change your recommendation?
    common_errors:
      - Blaming the struggling team instead of examining whether the change fits their context.

  - external_key: leadership.driving_change.early_adopters_as_advocates
    competency_key: mentoring
    topic: Turning early adopters into advocates
    difficulty: easy
    text: >-
      How have you used the people who adopted a change early to help spread it to others? Give me a concrete
      example of what they did and how you supported them.
    expected_concepts:
      - identifying early adopters
      - giving them support, time or recognition
      - peer-led demos, office hours or pairing
      - collecting their feedback to improve the change
      - avoiding overloading them
    rubric:
      excellent: Gives a concrete example of early adopters spreading the change through specific activities, explains the support they received and how their feedback improved it.
      good: Mentions champions or advocates and what they did, but the support given is unclear.
      weak: Mentions early adopters in general terms with no concrete activities or outcome.
    followups:
      - How did you make sure this didn't become unpaid extra work for them?
      - What did they hear from peers that you never would have?
    common_errors:
      - Relying on volunteers without giving them time or recognition for the work.

  # ------------------------------------------------------------ working with sceptics and resistance
  - external_key: leadership.driving_change.strongest_sceptic
    competency_key: leadership
    topic: Working with the strongest sceptic
    difficulty: medium
    text: >-
      Think of a change you led where one experienced person pushed back harder than anyone else. How did you
      work with them, and what did their objections end up contributing?
    expected_concepts:
      - listening to understand the substance of the objection
      - separating valid concerns from preference
      - involving them in shaping the solution
      - changes made because of their input
      - outcome of the working relationship
    rubric:
      excellent: Takes the objections seriously, identifies which were valid, involves the person in the design and names specific improvements that came from them.
      good: Engaged constructively and reached a working agreement, but the objections' contribution is unclear.
      weak: Describes the person as an obstacle to work around or overrule, with no attempt to learn from them.
    followups:
      - Which of their concerns turned out to be right?
      - If they had never come around, what would you have done?
    common_errors:
      - Framing all resistance as stubbornness rather than as information.

  - external_key: leadership.driving_change.reading_resistance
    competency_key: leadership
    topic: Understanding the causes of resistance
    difficulty: medium
    text: >-
      When people resist a change, the stated reason isn't always the real one. Tell me about a time you worked
      out what was really behind the pushback and how that changed your approach.
    expected_concepts:
      - asking open questions in private conversations
      - looking for concerns about workload, ownership or skills
      - checking incentives and how people are measured
      - adapting the plan to the underlying concern
      - outcome after addressing the real issue
    rubric:
      excellent: Describes how they uncovered the underlying concern through specific conversations or observation and shows a concrete change in approach that addressed it.
      good: Recognised that the stated reason was not the whole story and adjusted somewhat.
      weak: Took objections at face value or dismissed them, with no change in approach.
    followups:
      - What did people say in private that they wouldn't say in a meeting?
      - Was there anything about how people were measured that worked against the change?
    common_errors:
      - Speculating about people's motives instead of describing what they found out by asking.

  - external_key: leadership.driving_change.quiet_non_adoption
    competency_key: leadership
    topic: Teams agreeing but not adopting
    difficulty: hard
    text: >-
      You rolled out a new incident review practice and every team said they supported it, yet three months
      later most teams quietly aren't doing it. How would you find out why, and what would you change?
    expected_concepts:
      - checking actual usage data rather than opinions
      - asking teams what got in the way
      - examining whether the practice costs too much or delivers too little
      - simplifying or adjusting the practice
      - reinforcing through leadership routines rather than reminders
    rubric:
      excellent: Starts from evidence of actual behaviour, investigates friction and value with the teams, is willing to change the practice itself and builds it into existing routines.
      good: Investigates and adjusts the rollout, but assumes the practice itself is right.
      weak: Responds with reminders, mandates or blame without understanding why teams stopped.
    followups:
      - What would convince you the practice itself needs redesigning?
      - How would you tell a team that is doing it well from one that is going through the motions?
    common_errors:
      - Treating verbal agreement in meetings as evidence of adoption.

  - external_key: leadership.driving_change.respecting_the_old_way
    competency_key: communication
    topic: Talking about the old approach respectfully
    difficulty: easy
    text: >-
      When you replaced a system or process that other people had built and were proud of, how did you talk about
      the old approach while making the case for the new one? Give me an example.
    expected_concepts:
      - acknowledging why the old approach made sense at the time
      - framing change as a response to new needs
      - involving original builders in the transition
      - avoiding language that blames past decisions
    rubric:
      excellent: Gives a real example where they acknowledged the context behind the old approach, involved its builders and framed the change around changed needs, with a good working outcome.
      good: Was respectful in general terms and avoided blame, with less evidence of involving the builders.
      weak: Describes the old approach dismissively or did not consider how its builders would receive the change.
    followups:
      - Did anyone who built the old system help with the new one?
      - What did you learn from them about the original decisions?
    common_errors:
      - Calling the old system legacy or bad in front of the people who built it.

  - external_key: leadership.driving_change.compromise_or_hold
    competency_key: leadership
    topic: Deciding which parts of a change are negotiable
    difficulty: hard
    text: >-
      In any significant change, people will ask for exceptions and adjustments. Tell me about a change you led
      where you had to decide what you'd compromise on and what you'd hold firm on. How did you draw that line?
    expected_concepts:
      - identifying the core outcomes the change must deliver
      - flexibility on method, timing or sequence
      - criteria for granting exceptions
      - explaining non-negotiables with reasons
      - consequences of the compromises made
    rubric:
      excellent: Clearly separates the essential outcomes from negotiable details, gives a principled basis for exceptions, explains how non-negotiables were communicated and reflects on the effect of compromises.
      good: Made sensible compromises and held some lines, but the reasoning is partly intuitive.
      weak: Either compromised on everything until the change lost its point, or refused all adjustments.
    followups:
      - Was there a compromise you regretted?
      - How did you stop exceptions from becoming the norm?
    common_errors:
      - Granting exceptions one by one without any rule, so the change slowly erodes.

  # ------------------------------------------------------------ influence and authority
  - external_key: leadership.driving_change.change_from_individual_contributor
    competency_key: leadership
    topic: Driving change without a leadership title
    difficulty: easy
    text: >-
      Tell me about a time before you had a formal lead or manager role when you got a group to adopt something
      new. What did you rely on, given you couldn't tell anyone what to do?
    expected_concepts:
      - credibility built through own work
      - small demonstration or prototype
      - making adoption easy for others
      - getting a lead or manager to back it
      - outcome and spread
    rubric:
      excellent: Describes concrete tactics such as a working demo, removing friction for others and enlisting support, with a clear account of how adoption spread.
      good: Shows initiative and some influence tactics, with a modest outcome.
      weak: Idea stayed with the candidate, or was adopted only because a manager imposed it.
    followups:
      - Who was the first person outside your immediate circle to adopt it?
      - What would you do differently with the authority you have now?
    common_errors:
      - Describing a personal productivity habit that nobody else adopted.

  - external_key: leadership.driving_change.using_authority_carefully
    competency_key: leadership
    topic: When to use positional authority for change
    difficulty: hard
    text: >-
      As a lead or manager you can sometimes just decide that a change will happen. Tell me about a time you
      chose to use that authority to push a change through, and a time you deliberately didn't. What made the difference?
    expected_concepts:
      - reversibility and risk of the decision
      - urgency, for example security or compliance
      - value of buy-in for long-term adoption
      - explaining the decision even when mandated
      - reviewing the outcome of each approach
    rubric:
      excellent: Gives two contrasting real examples with clear criteria such as urgency, risk and the need for ownership, and reflects on how each approach played out.
      good: Explains a sensible rule of thumb with at least one solid example.
      weak: Always mandates or always seeks consensus, with no criteria for choosing.
    followups:
      - How did the team react to the change you mandated?
      - Would you make the same call today?
    common_errors:
      - Treating consensus as always required, which stalls urgent changes.

  - external_key: leadership.driving_change.influencing_upward_for_change
    competency_key: stakeholder_management
    topic: Persuading your own leadership to change course
    difficulty: medium
    text: >-
      Tell me about a time you convinced leadership above you to change something they had already decided or
      invested in, such as a tool choice, a process or a plan. How did you go about it?
    expected_concepts:
      - understanding the original reasons for the decision
      - evidence that circumstances or results had changed
      - choosing the right forum and timing
      - offering a path that lets leaders change course without losing face
      - respecting the final decision
    rubric:
      excellent: Understood the original reasoning, brought new evidence, chose a sensible forum and offered a practical alternative, and describes how the decision was reached.
      good: Made a reasoned case and got a change, with less attention to timing or how it was framed.
      weak: Argued from opinion, went around their manager, or cannot describe a real outcome.
    followups:
      - What would you have done if they had said no?
      - How did you present it so it didn't read as criticism of the original decision?
    common_errors:
      - Escalating past their own manager before trying to persuade them directly.

  # ------------------------------------------------------------ planning the change
  - external_key: leadership.driving_change.sequencing_a_change
    competency_key: project_management
    topic: Deciding the order of a multi-step change
    difficulty: medium
    text: >-
      When a change has many parts, such as new tooling, new ownership boundaries and new processes, how do you
      decide what to change first? Walk me through the sequencing of a change you led.
    expected_concepts:
      - dependencies between the parts
      - early wins that build momentum
      - reducing risk by changing one thing at a time
      - decision points to reassess
      - capacity of teams to absorb change
    rubric:
      excellent: Explains a real sequence driven by dependencies, risk and early value, with planned checkpoints and attention to how much teams could absorb.
      good: Sensible sequence with some reasoning, but checkpoints or capacity limits are missing.
      weak: Did everything at once or in an arbitrary order with no reasoning.
    followups:
      - What did you deliberately leave until later, and why?
      - Did the sequence change once you started?
    common_errors:
      - Changing several things at once so nobody can tell which part caused problems.

  - external_key: leadership.driving_change.success_criteria_up_front
    competency_key: ownership
    topic: Defining success for a change before starting
    difficulty: easy
    text: >-
      Before you started a change you led, how did you define what success would look like, and how did you
      check against it later? Use a specific change as your example.
    expected_concepts:
      - outcome measures rather than activity measures
      - baseline measured before starting
      - target and timeframe
      - review point against the criteria
    rubric:
      excellent: Defines outcome-based criteria with a baseline and target set in advance, and describes reviewing against them and what they found.
      good: Had some criteria and checked them, though they were partly activity-based or lacked a baseline.
      weak: Defined success only as finishing the rollout, or never checked results.
    followups:
      - Did the change meet the criteria? What did you do with the result?
      - Which measure turned out to be misleading?
    common_errors:
      - Measuring adoption of the tool rather than the problem it was meant to solve.

  - external_key: leadership.driving_change.change_vs_delivery_pressure
    competency_key: leadership
    topic: Making room for change under delivery pressure
    difficulty: medium
    text: >-
      Teams under constant delivery pressure often say they have no time to adopt anything new. Tell me how you
      created space for a change in that kind of environment, and what you had to trade off.
    expected_concepts:
      - negotiating capacity with stakeholders
      - showing near-term payoff
      - folding change into existing work
      - making the trade-off visible
      - protecting the time once agreed
    rubric:
      excellent: Describes a concrete negotiation for capacity, a way of tying the change to current work and how they protected that time, with the trade-off made explicit to stakeholders.
      good: Found some time and made progress, but the trade-offs were implicit.
      weak: Asked teams to do the change on top of everything else or postponed it indefinitely.
    followups:
      - How did you explain the slower delivery to stakeholders?
      - When did the change start paying back?
    common_errors:
      - Expecting people to absorb change in their spare time.

  - external_key: leadership.driving_change.change_too_early
    competency_key: leadership
    topic: Recognising a change that came too early
    difficulty: hard
    text: >-
      Tell me about a change you pushed for that, in hindsight, the organisation wasn't ready for. What signs
      did you miss, and how has that changed how you judge readiness now?
    expected_concepts:
      - specific readiness gaps such as skills, tooling or capacity
      - signals that were visible at the time
      - what happened as a result
      - how they recovered or adjusted
      - concrete readiness checks used now
    rubric:
      excellent: Gives a real example, names specific signals they overlooked, describes the consequences and recovery, and explains concrete readiness checks they now use.
      good: Acknowledges the misjudgement and draws reasonable lessons, though the signals are described generally.
      weak: Blames the organisation for not being ready, or picks an example with no real consequence.
    followups:
      - Would delaying have been better, or was going early still worth it?
      - What would you check first next time?
    common_errors:
      - Turning the question into a story about others resisting a good idea.

  - external_key: leadership.driving_change.product_change_internal_alignment
    competency_key: product_sense
    topic: Aligning internal teams on a product direction change
    difficulty: medium
    text: >-
      When you've changed a product's direction, for example moving from one customer segment to another, how did
      you get sales, support and engineering to change how they worked to match? Tell me about a specific case.
    expected_concepts:
      - explaining the reasoning and evidence behind the shift
      - what each function had to do differently
      - updated materials, training or targets
      - handling commitments made under the old direction
      - checking alignment through behaviour, not just agreement
    rubric:
      excellent: Explains the rationale clearly, translates the change into specific changes per function, deals with existing commitments and checks that behaviour actually changed.
      good: Communicated the shift well and supported most functions, with gaps in follow-through.
      weak: Announced the new direction and assumed other functions would adapt.
    followups:
      - Which function was slowest to change, and why?
      - What happened to customers sold on the old direction?
    common_errors:
      - Updating the roadmap without changing how other teams are measured or supported.

  - external_key: leadership.driving_change.org_wide_standard_from_one_team
    competency_key: leadership
    topic: Scaling a team practice into an organisation standard
    difficulty: hard
    text: >-
      Suppose your team has a practice, say a testing approach, that works really well, and you want the rest of
      the engineering organisation of around two hundred people to adopt it. How would you take it from one team to everyone?
    expected_concepts:
      - checking whether it generalises beyond the original context
      - evidence of results to share
      - adapting it with input from other teams
      - support such as templates, tooling and coaching
      - governance or ownership of the standard
      - measuring adoption and outcomes
    rubric:
      excellent: Tests whether the practice generalises, involves other teams in adapting it, provides real support and clear ownership, and measures outcomes rather than compliance.
      good: Sensible rollout plan with evidence and support, but assumes the practice applies everywhere unchanged.
      weak: Proposes mandating it organisation-wide based on one team's success.
    followups:
      - What would you do if some teams have good reasons not to adopt it?
      - Who should own the standard once it is adopted?
    common_errors:
      - Assuming what worked for one team will work unchanged for all.
