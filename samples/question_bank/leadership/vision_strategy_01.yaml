# Curated questions: leadership round, vision and strategy (part 1 of 4). Articulating a direction,
# diagnosing before deciding, choosing focus, assumptions, measures and keeping decisions aligned.
# Questions ask for real past examples or concrete approaches; evaluation is based only on the
# content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager, product_manager]
  round_types: [leadership]
  kind: leadership
questions:
  # ------------------------------------------------------------------ easy
  - external_key: leadership.vision_strategy.explain_direction_to_newcomer
    competency_key: communication
    topic: Explaining the team's direction to a newcomer
    difficulty: easy
    text: >-
      Imagine someone joins your current or most recent team tomorrow and asks where the team is heading over
      the next year and why. How would you explain it to them?
    expected_concepts:
      - the problem or customer the team exists to serve
      - where the team wants to be by a stated point in time
      - the reasons behind that direction
      - the main priorities that follow from it
      - what the team is deliberately not focusing on
    rubric:
      excellent: Gives a short, concrete explanation covering purpose, destination, the reasoning behind it and the priorities it creates, in language a new joiner could act on.
      good: Explains the main goals and some reasoning, but the priorities or the trade-offs stay vague.
      weak: Lists current projects or tasks with no sense of purpose or direction, or cannot describe one.
    followups:
      - Which part of that would a new joiner most likely misunderstand?
      - Where does that direction come from, and who agreed it?
    common_errors:
      - Describing the backlog instead of the direction.

  - external_key: leadership.vision_strategy.vision_strategy_plan_distinction
    competency_key: leadership
    topic: Vision, strategy and plan in practice
    difficulty: easy
    text: >-
      People use the words vision, strategy and plan almost interchangeably. Using something from your own
      work, how would you show the difference between the three?
    expected_concepts:
      - vision as the future state worth reaching
      - strategy as the chosen approach and key choices to get there
      - plan as the concrete sequence of work, owners and dates
      - a real example that ties the three together
    rubric:
      excellent: Uses one real example to show a clear vision, the specific choices that made up the strategy and the plan that put it into motion, and explains why keeping them distinct helped.
      good: Distinguishes the three correctly with an example, though the strategy part is thin.
      weak: Gives textbook definitions with no example, or treats strategy as simply a longer plan.
    followups:
      - Which of the three is usually missing in teams you've seen?
      - How often did each of them change in your example?
    common_errors:
      - Describing strategy as a list of goals with no choices in it.

  - external_key: leadership.vision_strategy.first_written_direction
    competency_key: leadership
    topic: First time writing down a direction
    difficulty: easy
    text: >-
      Tell me about the first time you had to write down a direction for a team or a product area. What did you
      put in it, and how did people actually use it afterwards?
    expected_concepts:
      - context that made a written direction necessary
      - what the document contained and why
      - who reviewed or shaped it
      - how it was used in later decisions
      - what they would write differently now
    rubric:
      excellent: Describes a specific written direction, its contents and reviewers, gives examples of it being used to make later decisions and reflects on what they would improve.
      good: Describes the document and its purpose clearly, with limited evidence of how it was used.
      weak: Cannot describe a concrete document or its effect, or the document was never referred to again.
    followups:
      - What feedback changed the document most before it was shared?
      - When was the last time someone referred back to it?
    common_errors:
      - Describing a project plan or status report rather than a direction.

  - external_key: leadership.vision_strategy.customer_insight_shapes_direction
    competency_key: product_sense
    topic: Customer insight shaping long-term direction
    difficulty: easy
    text: >-
      How do customer or user insights find their way into the longer-term direction you set for a team? Give me
      an example of one that actually changed it.
    expected_concepts:
      - sources of insight such as research, support data or usage data
      - how insights are reviewed and weighed
      - a specific insight and the change it caused
      - distinguishing one loud voice from a pattern
    rubric:
      excellent: Describes a regular route from customer evidence into direction-setting and a specific insight that changed priorities, including how they checked it was a pattern rather than a single request.
      good: Gives a real example of an insight changing direction, but the process for gathering insight is ad hoc.
      weak: Direction is set without customer input, or the example is a single feature request being built.
    followups:
      - How did you check that the insight represented more than one customer?
      - What did the change cost you elsewhere?
    common_errors:
      - Equating customer insight with the latest feature request.

  - external_key: leadership.vision_strategy.progress_versus_busyness
    competency_key: ownership
    topic: Telling progress from busyness
    difficulty: easy
    text: >-
      How do you tell whether your team is actually making progress toward its longer-term goals, rather than
      just staying busy? Tell me what you look at.
    expected_concepts:
      - outcome measures tied to the goals
      - regular review of progress against those measures
      - noticing work that does not connect to the goals
      - acting when progress stalls
    rubric:
      excellent: Names specific outcome measures they track against long-term goals, describes a regular review and gives an example of acting when the team was busy but not progressing.
      good: Tracks some meaningful measures, but the link to action when progress stalls is weak.
      weak: Relies on output such as tickets closed or hours worked, or does not track progress at all.
    followups:
      - Tell me about a time those signals showed the team was busy but not progressing.
      - How did the team react when you raised it?
    common_errors:
      - Treating velocity or ticket counts as progress toward goals.

  # ---------------------------------------------------------------- medium
  - external_key: leadership.vision_strategy.diagnose_before_direction
    competency_key: leadership
    topic: Diagnosing before setting direction in a new role
    difficulty: medium
    text: >-
      Suppose you've just taken over a team that has no clear direction. How would you spend your first couple
      of months working out what the strategy should be, before you announce anything?
    expected_concepts:
      - listening to the team, customers and stakeholders
      - reviewing data on the product, systems and delivery
      - identifying the few most important problems
      - testing early hypotheses with key people
      - delivering some quick improvements meanwhile
      - a clear point at which the direction is shared
    rubric:
      excellent: Lays out a deliberate diagnosis covering people, customers, data and systems, narrows it to a few critical problems, tests ideas with others before committing and explains how they keep the team moving meanwhile.
      good: Describes a sensible listening phase and a resulting direction, but with little on how problems are prioritised or ideas tested.
      weak: Announces a direction based on their previous job or first impressions, or waits indefinitely without a plan.
    followups:
      - What would you do if the team needed decisions from you in the first week?
      - Which source of information has misled you before in a situation like this?
    common_errors:
      - Importing the strategy from a previous team without checking it fits.

  - external_key: leadership.vision_strategy.choosing_what_not_to_do
    competency_key: leadership
    topic: Deciding what the strategy leaves out
    difficulty: medium
    text: >-
      Tell me about a strategy you set where the most important part was what the team decided not to do. How
      did you choose those things, and how did you hold to that choice?
    expected_concepts:
      - the options that were considered
      - criteria used to rule things out
      - explicitly communicating what is out of scope
      - handling requests that conflicted with the choice
      - the effect of the focus on results
    rubric:
      excellent: Names specific things that were deliberately excluded, explains the criteria, shows how the exclusions were communicated and defended against later requests, and links the focus to an outcome.
      good: Gives a real example of narrowing focus with reasons, but little on keeping to it under pressure.
      weak: The strategy included everything, or the exclusions were things nobody wanted anyway.
    followups:
      - Who was most unhappy about what you left out, and what did you say to them?
      - Did any of those excluded items come back later?
    common_errors:
      - Choosing exclusions that cost nothing, so the strategy makes no real choice.

  - external_key: leadership.vision_strategy.repeatable_direction
    competency_key: communication
    topic: Making a direction short enough to repeat
    difficulty: medium
    text: >-
      Tell me about a time you had to condense a long-term direction into something short enough that people
      could repeat it to each other. What did you cut, and how did you check it had landed?
    expected_concepts:
      - the full direction and why it needed simplifying
      - the core message they kept
      - detail moved elsewhere rather than lost
      - checking understanding by listening to how others described it
      - adjusting the message based on what they heard
    rubric:
      excellent: Shows how they distilled a complex direction into a short message, kept the supporting detail available, and verified understanding by hearing others explain it, adjusting where it drifted.
      good: Produces a clear short message with some check of understanding.
      weak: Relies on a slogan with no substance behind it, or assumes people understood without checking.
    followups:
      - What did people get wrong when they repeated it?
      - Where did the detail you cut end up?
    common_errors:
      - Confusing a catchy slogan with a direction people can act on.

  - external_key: leadership.vision_strategy.finding_team_place_in_company_goals
    competency_key: stakeholder_management
    topic: Finding the team's place in company goals
    difficulty: medium
    text: >-
      When the company's top-level goals don't obviously involve your team, how do you work out where your team
      fits? Tell me about a time this happened.
    expected_concepts:
      - understanding the company goals and their reasoning
      - mapping the team's work and capabilities to those goals
      - conversations with leadership and peer teams to confirm the fit
      - adjusting the team's priorities accordingly
      - making the contribution visible
    rubric:
      excellent: Describes analysing the company goals, finding a credible contribution, confirming it with leadership and peer teams and changing the team's priorities so the contribution became real and visible.
      good: Identifies a sensible link to company goals and adjusts some priorities, with limited validation.
      weak: Relabels existing work to sound aligned, or concludes the goals do not apply to their team.
    followups:
      - Who confirmed that your contribution mattered to the goal?
      - What existing work did you stop or slow down because of it?
    common_errors:
      - Retrofitting existing plans to company goals without changing anything.

  - external_key: leadership.vision_strategy.evidence_behind_direction
    competency_key: leadership
    topic: Evidence gathered when setting direction
    difficulty: medium
    text: >-
      Think about the last time you set direction for a team or product area. What evidence did you gather, and
      which piece of it changed your thinking the most?
    expected_concepts:
      - range of evidence such as usage data, incidents, customer research and costs
      - qualitative input from people closest to the work
      - an initial view that changed because of evidence
      - judging the quality and limits of the evidence
    rubric:
      excellent: Describes a deliberate mix of quantitative and qualitative evidence, names a specific finding that changed their view and explains how they judged its reliability.
      good: Gathered relevant evidence and used it, but no clear example of it changing their mind.
      weak: Direction came from intuition or a senior request with no evidence considered.
    followups:
      - What evidence did you wish you had and couldn't get?
      - How did you handle evidence that pointed in different directions?
    common_errors:
      - Only gathering evidence that supported a decision already made.

  - external_key: leadership.vision_strategy.cross_team_dependencies_in_strategy
    competency_key: stakeholder_management
    topic: Building other teams' changes into a strategy
    difficulty: medium
    text: >-
      Tell me about a strategy that only worked if other teams changed their plans too. How did you build that
      into the strategy from the start, rather than discovering it later?
    expected_concepts:
      - identifying which other teams the strategy depended on
      - early conversations to understand their priorities
      - agreeing explicit commitments or shared goals
      - designing the plan to reduce hard dependencies where possible
      - a fallback if a dependency failed
    rubric:
      excellent: Identified dependencies early, engaged the other teams before finalising the strategy, secured explicit agreements and shaped the plan to limit or hedge the dependencies.
      good: Recognised and negotiated the dependencies, but late or without a fallback.
      weak: Assumed other teams would follow along, or only found the dependencies when work was blocked.
    followups:
      - What did the other team get out of the arrangement?
      - What would you have done if one of them had said no?
    common_errors:
      - Treating another team's agreement in a meeting as a delivery commitment.

  - external_key: leadership.vision_strategy.tailoring_story_by_audience
    competency_key: communication
    topic: Presenting one direction to different audiences
    difficulty: medium
    text: >-
      Tell me about a time you had to present the same direction to engineers, to senior leadership and to
      partner teams. How did you change the story for each audience?
    expected_concepts:
      - understanding what each audience cares about
      - keeping the core message consistent across audiences
      - choosing the level of detail and evidence for each
      - anticipating each group's questions or concerns
      - checking the messages did not contradict each other
    rubric:
      excellent: Explains how they adapted framing, detail and evidence to each audience while keeping one consistent core message, with examples of questions they prepared for and how each group responded.
      good: Adapted the message for different groups, but the explanation of what changed is general.
      weak: Used the same presentation for everyone, or told different groups different things about the direction itself.
    followups:
      - Which audience pushed back hardest, and on what?
      - How did you make sure the versions stayed consistent?
    common_errors:
      - Changing the substance of the direction to please each audience.

  - external_key: leadership.vision_strategy.team_shapes_strategy
    competency_key: mentoring
    topic: Involving the team in shaping strategy
    difficulty: medium
    text: >-
      How have you involved the people on your team in shaping a strategy, rather than handing it to them
      finished? Tell me what they ended up changing.
    expected_concepts:
      - the stage at which the team was involved
      - specific format such as workshops, drafts for comment or working groups
      - a concrete change that came from the team
      - how final decisions were made and explained
      - growth in people's ability to think about direction
    rubric:
      excellent: Describes involving the team early through a specific format, gives a concrete change the team made, explains how the final call was made and notes how it developed people's strategic thinking.
      good: Team was consulted and had some influence, but the example of what changed is minor.
      weak: Team was only informed after the fact, or consultation was a formality.
    followups:
      - How did you handle suggestions you decided not to take?
      - Who on the team grew most through being involved?
    common_errors:
      - Calling an announcement followed by questions a collaborative process.

  - external_key: leadership.vision_strategy.goal_off_track_midyear
    competency_key: ownership
    topic: Owning a strategic goal that went off track
    difficulty: medium
    text: >-
      Tell me about a time you realised partway through the year that your team wasn't going to hit a strategic
      goal you owned. What did you do, and who did you tell?
    expected_concepts:
      - how and when they detected the gap
      - analysis of why the goal was off track
      - options considered such as rescoping, extra investment or changing approach
      - prompt communication to leadership and affected teams
      - what was ultimately achieved and learned
    rubric:
      excellent: Detected the gap early through regular tracking, analysed the cause, laid out options, told the right people promptly with a recommendation and describes the actual result and lesson.
      good: Took responsibility and communicated, but detection was late or the options were limited.
      weak: Hid or downplayed the gap, blamed others, or only reported it at the deadline.
    followups:
      - Looking back, what was the earliest signal you missed?
      - How did the people you told react, and what did they need from you?
    common_errors:
      - Waiting until the end of the period to report the miss.

  - external_key: leadership.vision_strategy.measuring_technical_direction
    competency_key: leadership
    topic: Measuring whether a technical direction pays off
    difficulty: medium
    text: >-
      When you set a technical direction, say standardising on a new architecture or platform, how do you decide
      what to measure to know whether it's paying off?
    expected_concepts:
      - tying the direction to the problem it was meant to solve
      - measures of outcome such as lead time, incidents or cost
      - adoption measures as a leading signal
      - a baseline taken before the change
      - reviewing measures and acting on them
    rubric:
      excellent: Links the measures to the original problem, combines leading adoption signals with outcome measures, takes a baseline and describes reviewing them and adjusting course.
      good: Picks sensible measures, but without a baseline or a plan for acting on them.
      weak: Measures only completion of the migration, or nothing at all.
    followups:
      - Which measure would tell you earliest that the direction was a mistake?
      - How would you separate the effect of the change from other things happening at the same time?
    common_errors:
      - Treating finishing the rollout as proof the direction worked.

  - external_key: leadership.vision_strategy.surfacing_assumptions
    competency_key: leadership
    topic: Making strategic assumptions explicit
    difficulty: medium
    text: >-
      Every strategy rests on a few assumptions about customers, technology or the market. How do you make those
      assumptions explicit, and tell me about one that turned out to be wrong.
    expected_concepts:
      - listing the assumptions the strategy depends on
      - ranking them by risk and uncertainty
      - ways of testing or monitoring the riskiest ones
      - a specific assumption that failed and how it was detected
      - how the strategy was adjusted
    rubric:
      excellent: Describes writing down and ranking assumptions, testing or monitoring the riskiest, and gives a real example of a wrong assumption, how they spotted it and what they changed.
      good: Recognises key assumptions and gives an example of one failing, but without a deliberate method.
      weak: Cannot name assumptions behind their strategies, or only discovered a wrong one after it caused failure.
    followups:
      - How quickly did you notice, and what would have made it faster?
      - Which assumptions do you now check first in any new strategy?
    common_errors:
      - Treating assumptions as facts once the strategy is approved.

  - external_key: leadership.vision_strategy.product_engineering_shared_picture
    competency_key: stakeholder_management
    topic: Reconciling product and engineering visions
    difficulty: medium
    text: >-
      Tell me about a time product and engineering had genuinely different pictures of where a product should go
      over the next year. How did you bring them to a shared direction?
    expected_concepts:
      - understanding each side's reasoning and constraints
      - finding the shared goals underneath the disagreement
      - making the trade-offs explicit with evidence
      - a decision process both sides accepted
      - the resulting direction and how it held up
    rubric:
      excellent: Explains both positions fairly, surfaces common goals, makes trade-offs concrete with evidence, uses an agreed decision process and describes how the shared direction worked out.
      good: Reaches a workable agreement, but the method relies mostly on compromise or escalation.
      weak: Picks a side without engaging the other, or leaves the difference unresolved.
    followups:
      - What did each side give up?
      - How did you stop the disagreement from returning a month later?
    common_errors:
      - Splitting the difference without resolving the underlying trade-off.

  - external_key: leadership.vision_strategy.written_decision_principles
    competency_key: leadership
    topic: Principles that guide team decisions
    difficulty: medium
    text: >-
      Tell me about a set of principles or tenets you wrote to guide a team's decisions. How did you come up
      with them, and what's a decision they helped settle?
    expected_concepts:
      - the recurring decisions the principles were meant to help with
      - how the principles were drafted and agreed
      - principles that express real trade-offs
      - a specific decision resolved by applying them
      - revising principles that did not work
    rubric:
      excellent: Describes principles that encode real trade-offs, a collaborative process for writing them and a concrete decision they settled, plus how they were revised over time.
      good: Has written useful principles and can give an example of their use, but they are fairly generic.
      weak: Principles are platitudes nobody could disagree with, or were never used in a real decision.
    followups:
      - Which principle caused the most debate when you wrote it?
      - When did a principle point the wrong way, and what did you do?
    common_errors:
      - Writing principles so general that they never rule anything out.

  # ------------------------------------------------------------------ hard
  - external_key: leadership.vision_strategy.architecture_strategy_with_feature_pressure
    competency_key: leadership
    topic: Multi-year technical strategy under feature pressure
    difficulty: hard
    text: >-
      You're asked to set a three-year technical strategy for a product whose architecture is struggling, while
      the business still expects new features every quarter. How would you shape the strategy so both can
      happen?
    expected_concepts:
      - diagnosing which architectural problems most limit the business
      - an incremental path that delivers improvements along the way
      - tying architectural work to the features that need it
      - an agreed allocation of capacity with leadership
      - milestones and measures that show progress to the business
      - revisiting the plan as the business changes
    rubric:
      excellent: Prioritises architectural problems by business impact, designs an incremental path coupled to feature work, secures an explicit capacity agreement and defines milestones that show value to the business throughout.
      good: Proposes a reasonable incremental plan with some business framing, but weak on how capacity is agreed or progress shown.
      weak: Proposes pausing features for a big rewrite, or treats architecture as something to fit in when there's spare time.
    followups:
      - What would you deliver in the first six months that the business would notice?
      - How would you respond if a major customer deal demanded a feature that cuts against the strategy?
    common_errors:
      - Planning a big-bang rewrite with value only at the end.
      - Framing the strategy purely in technical terms that leadership cannot weigh.

  - external_key: leadership.vision_strategy.direction_amid_company_uncertainty
    competency_key: leadership
    topic: Setting direction while company strategy is unsettled
    difficulty: hard
    text: >-
      Tell me about a time you had to set direction for your team while the company's own strategy was unclear
      or still being decided. How did you choose a direction that wouldn't be wasted whatever leadership
      decided?
    expected_concepts:
      - identifying the likely options for company direction
      - finding work valuable under most of those options
      - keeping commitments small and reversible
      - staying close to the decision makers to learn early
      - communicating the uncertainty to the team
      - adjusting when the company direction became clear
    rubric:
      excellent: Describes mapping the plausible company outcomes, choosing work that pays off under most of them, keeping bets reversible, staying close to leadership and adjusting quickly once the direction settled.
      good: Chose sensible no-regret work and kept the team productive, but with less deliberate hedging.
      weak: Waited for clarity with the team idle, or committed heavily to a guess without acknowledging the risk.
    followups:
      - How did you explain the uncertainty to the team without unsettling their work?
      - What did you have to change once the company strategy was announced?
    common_errors:
      - Treating uncertainty as a reason to make no decisions at all.

  - external_key: leadership.vision_strategy.proposal_rejected_by_leadership
    competency_key: stakeholder_management
    topic: A strategy proposal rejected by senior leadership
    difficulty: hard
    text: >-
      Tell me about a time you proposed a strategy that senior leadership initially turned down. What did you
      learn from the rejection, and what happened to the proposal after that?
    expected_concepts:
      - the proposal and the reasons it was rejected
      - seeking to understand leadership's objections and priorities
      - deciding whether the objections were valid
      - revising, reframing or dropping the proposal
      - the eventual outcome and what they learned about influencing leaders
    rubric:
      excellent: Explains the real reasons for rejection, shows how they sought and accepted valid feedback, describes a deliberate choice to revise, wait or drop it, and reflects on what it taught them about proposing strategy.
      good: Took feedback and revised the proposal, with some reflection.
      weak: Treats the rejection as leadership not understanding, or simply gave up without learning anything.
    followups:
      - Which objection was most fair in hindsight?
      - What do you now do before proposing a strategy to the same audience?
    common_errors:
      - Re-presenting the same proposal more forcefully without addressing the objections.

  - external_key: leadership.vision_strategy.change_course_or_persist
    competency_key: leadership
    topic: Deciding whether a strategy needs changing or more time
    difficulty: hard
    text: >-
      How do you decide whether a strategy needs to change, rather than simply needing more time to work? Tell
      me about a time you had to make that call.
    expected_concepts:
      - signals or criteria defined in advance
      - distinguishing slow execution from a flawed premise
      - seeking outside views to counter sunk-cost thinking
      - the decision made and how it was communicated
      - what happened afterwards
    rubric:
      excellent: Describes criteria set in advance, analysis separating execution problems from a wrong premise, deliberate steps against sunk-cost bias and a clear decision with its outcome.
      good: Made a reasonable call based on evidence, but without pre-set criteria or much protection against bias.
      weak: Persisted or switched on instinct, or cannot describe making such a call.
    followups:
      - What would have convinced you to make the opposite decision?
      - How did the people who'd championed the original strategy respond?
    common_errors:
      - Changing direction at the first disappointing result.
      - Persisting because of the effort already invested.

  - external_key: leadership.vision_strategy.horizons_effort_split
    competency_key: leadership
    topic: Splitting effort across time horizons
    difficulty: hard
    text: >-
      How do you split a team's or organisation's effort between improving what exists today, building what's
      needed next year and exploring longer-term bets? Tell me how you set that split and defended it.
    expected_concepts:
      - categorising work by time horizon
      - reasoning for the chosen proportions in their context
      - protecting longer-term work from being absorbed by urgent work
      - criteria for promoting or stopping exploratory bets
      - reviewing and adjusting the split over time
    rubric:
      excellent: Gives a concrete split grounded in the business context, explains how it was protected from short-term pressure, how bets were evaluated and stopped, and how the split changed over time.
      good: Has a deliberate split with reasons, but protection or review of it is weak.
      weak: All effort goes to the current product by default, or longer-term work happens only when someone has spare time.
    followups:
      - Tell me about an exploratory bet you stopped. How did you decide?
      - Who challenged the split, and how did you respond?
    common_errors:
      - Exploratory work with no criteria for success or stopping.

  - external_key: leadership.vision_strategy.decisions_drift_from_strategy
    competency_key: leadership
    topic: Noticing decisions that contradict the strategy
    difficulty: hard
    text: >-
      Months after a strategy is announced, teams often make decisions that quietly contradict it. How have you
      noticed that happening, and what did you do to bring decisions back in line?
    expected_concepts:
      - mechanisms to see decisions such as design reviews or planning reviews
      - understanding why teams drifted
      - telling whether the strategy or the decision was wrong
      - correcting course without undermining team ownership
      - changing how the strategy is communicated or embedded
    rubric:
      excellent: Describes specific mechanisms for spotting drift, investigates the reasons, distinguishes a flawed strategy from a local mistake, corrects course respectfully and changes how the strategy is embedded.
      good: Noticed drift and corrected it, but reactively and without examining why it happened.
      weak: Did not notice until late, or corrected decisions by overruling teams without understanding the cause.
    followups:
      - Was the drift ever a sign that the strategy itself was wrong?
      - What changed in how you communicated the strategy afterwards?
    common_errors:
      - Assuming the team was at fault without asking whether the strategy was unclear.

  - external_key: leadership.vision_strategy.developing_strategic_thinking
    competency_key: mentoring
    topic: Helping others learn to think strategically
    difficulty: hard
    text: >-
      How have you helped a senior engineer or a new manager learn to think strategically, beyond executing what
      they're given? Tell me what you did and how you saw them change.
    expected_concepts:
      - identifying the gap in how the person approached direction
      - giving them real strategic problems to work on
      - coaching through questions and feedback rather than answers
      - sharing context about the business and leadership decisions
      - observable change in their work
    rubric:
      excellent: Describes a specific person, a deliberate plan with real strategic responsibility, coaching that built their reasoning, and concrete evidence that they now set direction on their own.
      good: Gave the person exposure and feedback with some visible improvement.
      weak: Development consisted of advice or reading lists, or there is no evidence the person changed.
    followups:
      - What did you have to stop doing yourself to give them room?
      - Where did they struggle most, and how did you respond?
    common_errors:
      - Delegating strategy tasks without the context needed to do them well.
