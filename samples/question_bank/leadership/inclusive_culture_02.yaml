# Curated questions: leadership round, inclusive culture (part 2 of 4).
# Focus: building an inclusive, respectful team culture through fair, job-related processes and working practices. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.inclusive_culture.criteria_before_interviews
  competency_key: people_management
  topic: Agreeing hiring criteria before interviews
  difficulty: easy
  text: >-
    Why and how do you agree on what you are looking for before interviewing candidates for a role?
  expected_concepts:
  - job-related skills listed in advance
  - a scorecard shared by interviewers
  - the same core questions for each candidate
  - avoiding vague impressions
  - debrief based on evidence
  rubric:
    excellent: >-
      Explains structured criteria, a shared scorecard and consistent questions, and how it improved decision quality and
      consistency.
    good: Uses criteria and some consistency.
    weak: Relies on gut feeling after meeting candidates.
  followups:
  - How do you stop criteria from drifting?
  - What if interviewers disagree?
  common_errors:
  - 'Answering in the weak pattern: relies on gut feeling after meeting candidates'

- external_key: leadership.inclusive_culture.sharing_visible_work
  competency_key: leadership
  topic: Spreading visible opportunities
  difficulty: easy
  text: >-
    How do you make sure the opportunities for visible work, like demos or presentations, are spread across the team?
  expected_concepts:
  - rotating presenters
  - supporting those new to presenting
  - recognising contributions in the open
  - tracking who presents
  - offering alternatives to live presenting
  rubric:
    excellent: >-
      Rotates opportunities, supports preparation, tracks the pattern, and shows a broadened set of people gaining visibility.
    good: Shares presenting among several people.
    weak: Always lets the same people present.
  followups:
  - How do you support someone who is new to presenting?
  - How do you track it?
  common_errors:
  - 'Answering in the weak pattern: always lets the same people present'

- external_key: leadership.inclusive_culture.async_inclusion
  competency_key: collaboration
  topic: Including people working at different hours
  difficulty: easy
  text: >-
    Your team works across several time zones and working patterns. How do you make sure people are not left out of discussions
    and decisions?
  expected_concepts:
  - rotating meeting times
  - written summaries
  - async decision windows
  - recording important sessions
  - avoiding decisions made in off-hours chats
  rubric:
    excellent: >-
      Gives concrete practices such as rotating times, written decisions and async windows, and describes feedback that the
      practice worked.
    good: Uses some written and async practices.
    weak: Schedules meetings at times that suit the majority only.
  followups:
  - How do you handle urgent decisions?
  - Whose time zone paid the price before?
  common_errors:
  - >-
    Answering in the weak pattern: schedules meetings at times that suit the majority only

- external_key: leadership.inclusive_culture.acknowledging_contributions
  competency_key: leadership
  topic: Recognising contributions fairly
  difficulty: easy
  text: >-
    How do you make sure everyone's contributions get recognised, including less visible work like documentation, reviews
    and onboarding help?
  expected_concepts:
  - tracking varied types of work
  - naming contributions in team forums
  - including them in reviews
  - encouraging peer recognition
  - valuing the work in promotion decisions
  rubric:
    excellent: >-
      Describes a method for tracking and recognising less visible work, links it to evaluations, and has an example.
    good: Recognises various contributions in public.
    weak: Praises only shipped features.
  followups:
  - How do you find out about invisible work?
  - How is it reflected in reviews?
  common_errors:
  - 'Answering in the weak pattern: praises only shipped features'

- external_key: leadership.inclusive_culture.inviting_dissent
  competency_key: communication
  topic: Inviting disagreement
  difficulty: easy
  text: >-
    How do you make it safe for people on your team to disagree with you or with the group?
  expected_concepts:
  - asking for objections directly
  - responding with curiosity
  - separating idea from person
  - thanking people for challenge
  - acting on good challenges
  rubric:
    excellent: >-
      Shows concrete behaviours such as asking for objections and acting on them, with an example where dissent improved a
      decision.
    good: Invites disagreement and responds politely.
    weak: Says the door is open but reacts defensively.
  followups:
  - How did people respond at first?
  - What did you do when someone challenged you in public?
  common_errors:
  - 'Answering in the weak pattern: says the door is open but reacts defensively'

- external_key: leadership.inclusive_culture.bringing_in_quiet_voices_remote
  competency_key: collaboration
  topic: Hearing from everyone in hybrid meetings
  difficulty: medium
  text: >-
    In hybrid meetings some people are in the room and others are on video. What do you do to give the remote participants
    an equal voice?
  expected_concepts:
  - everyone joining individually
  - chat monitoring by a facilitator
  - handing the floor deliberately
  - shared documents
  - summarising decisions in writing
  rubric:
    excellent: >-
      Gives specific practices such as individual joins, a chat monitor and written follow-up, and shows remote participants
      contributing more.
    good: Uses a few remote-friendly practices.
    weak: Treats remote participants as observers.
  followups:
  - What did remote colleagues say?
  - What was the most useful change?
  common_errors:
  - 'Answering in the weak pattern: treats remote participants as observers'

- external_key: leadership.inclusive_culture.mixed_experience_norms
  competency_key: collaboration
  topic: Balancing seniority in discussions
  difficulty: medium
  text: >-
    How do you stop seniority alone from deciding technical discussions on your team?
  expected_concepts:
  - reasoning before titles
  - senior people speaking last
  - written proposals
  - evidence and experiments as arbiters
  - encouraging challenge to seniors
  rubric:
    excellent: >-
      Describes practices such as speaking order and evidence-based decisions, and an example where a junior view prevailed.
    good: Encourages open debate.
    weak: Accepts that senior opinions win.
  followups:
  - What did seniors think?
  - Give an example where an experiment settled a debate.
  common_errors:
  - 'Answering in the weak pattern: accepts that senior opinions win'

- external_key: leadership.inclusive_culture.inclusive_meeting_times
  competency_key: leadership
  topic: Scheduling fairly
  difficulty: medium
  text: >-
    A recurring meeting time works for most but forces two people to join at a difficult hour. How do you handle that?
  expected_concepts:
  - acknowledging the cost
  - rotating times
  - making attendance optional with notes
  - checking whether the meeting is needed
  - asking those affected
  rubric:
    excellent: >-
      Acknowledges the cost, rotates or replaces with async, asks the affected people and reviews outcomes.
    good: Rotates times where possible.
    weak: Keeps the time because it suits most.
  followups:
  - How did you make the notes useful?
  - What did you stop doing?
  common_errors:
  - 'Answering in the weak pattern: keeps the time because it suits most'

- external_key: leadership.inclusive_culture.new_idea_handling
  competency_key: collaboration
  topic: Treating new ideas fairly
  difficulty: medium
  text: How do you ensure ideas are judged on their merits and not on who proposes them?
  expected_concepts:
  - written proposals
  - criteria stated beforehand
  - separating proposal from proposer in discussion
  - tracking which ideas were adopted
  - follow-up with those whose ideas were not
  rubric:
    excellent: >-
      Uses written proposals and criteria, checks adoption patterns, and gives feedback on rejected ideas.
    good: Evaluates ideas on merits generally.
    weak: Favours proposals from trusted colleagues.
  followups:
  - Have you found a bias in adoption?
  - How do you give feedback on a rejected idea?
  common_errors:
  - 'Answering in the weak pattern: favours proposals from trusted colleagues'

- external_key: leadership.inclusive_culture.fairness_in_incident_blame
  competency_key: leadership
  topic: Fairness after incidents
  difficulty: medium
  text: >-
    After an incident, how do you make sure review discussions look at systems and processes and do not single out individuals
    unfairly?
  expected_concepts:
  - blameless format
  - timeline from evidence
  - asking what made actions reasonable at the time
  - focusing on safeguards
  - protecting individuals
  rubric:
    excellent: >-
      Uses a blameless format with evidence, focuses on system improvements, protects individuals, and shows reduced fear
      of reporting.
    good: Tries to avoid blame.
    weak: Identifies the person at fault.
  followups:
  - What if a person's action was reckless?
  - How do you handle management pressure for names?
  common_errors:
  - 'Answering in the weak pattern: identifies the person at fault'

- external_key: leadership.inclusive_culture.balanced_workload_visibility
  competency_key: people_management
  topic: Seeing who is overloaded
  difficulty: medium
  text: >-
    How do you detect when particular people carry more load than the rest, and what do you do about it?
  expected_concepts:
  - tracking tasks, reviews and incidents
  - asking people directly
  - noticing quiet overload
  - rebalancing
  - revisiting regularly
  rubric:
    excellent: Uses data and conversation to notice overload, rebalances and checks again.
    good: Notices overloaded people when they speak up.
    weak: Assumes everyone is fine.
  followups:
  - What did the data show?
  - Who was surprised?
  common_errors:
  - 'Answering in the weak pattern: assumes everyone is fine'

- external_key: leadership.inclusive_culture.constructive_conflict_between_two
  competency_key: people_management
  topic: Mediating a conflict between teammates
  difficulty: medium
  text: >-
    Two teammates have stopped collaborating after a dispute over a design. How do you help them work together again?
  expected_concepts:
  - speaking to each separately
  - focusing on work behaviours and impact
  - bringing them together with ground rules
  - agreeing specific working changes
  - follow-up
  rubric:
    excellent: >-
      Meets each separately, structures a joint conversation around the work, agrees concrete changes and follows up.
    good: Brings them together to talk.
    weak: Avoids it or takes sides.
  followups:
  - What if one refuses to meet?
  - How long before it improved?
  common_errors:
  - 'Answering in the weak pattern: avoids it or takes sides'

- external_key: leadership.inclusive_culture.equal_access_to_learning
  competency_key: people_management
  topic: Fair access to training and development
  difficulty: medium
  text: >-
    How do you ensure that learning budget, conferences and training are shared fairly across your team?
  expected_concepts:
  - transparent budget rules
  - asking everyone about their needs
  - linking to role goals
  - tracking allocation
  - sharing what was learned
  rubric:
    excellent: >-
      Publishes rules, collects needs from everyone, tracks allocation and shares learning, with evidence of fair spread.
    good: Offers the budget to all.
    weak: Gives it to whoever asks first.
  followups:
  - Who used it least?
  - How did you reach those people?
  common_errors:
  - 'Answering in the weak pattern: gives it to whoever asks first'

- external_key: leadership.inclusive_culture.inclusive_architecture_discussions
  competency_key: collaboration
  topic: Making design reviews open
  difficulty: medium
  text: >-
    How do you run design reviews so that people from different teams and levels feel able to challenge a design?
  expected_concepts:
  - pre-reads
  - clear review questions
  - written comments before the meeting
  - facilitator keeping order
  - thanking challengers
  rubric:
    excellent: >-
      Runs pre-reads and written comments, facilitates, thanks challengers, and shows examples of valuable challenges from
      unexpected people.
    good: Opens reviews to wide participation.
    weak: Reviews with a few senior people.
  followups:
  - Who surprised you with a challenge?
  - How do you handle a harsh challenge?
  common_errors:
  - 'Answering in the weak pattern: reviews with a few senior people'

- external_key: leadership.inclusive_culture.fair_exit_and_offboarding
  competency_key: people_management
  topic: Fair handling when someone leaves
  difficulty: medium
  text: >-
    When someone leaves the team, how do you handle their exit so they are treated fairly and the team learns from it?
  expected_concepts:
  - respectful handover
  - exit conversation about work factors
  - recognising their contribution
  - sharing themes with the team
  - acting on lessons
  rubric:
    excellent: >-
      Handles handover respectfully, asks about work factors, acts on themes and informs the team appropriately.
    good: Handles the exit professionally.
    weak: Treats leavers as a nuisance.
  followups:
  - What did you learn?
  - What changed?
  common_errors:
  - 'Answering in the weak pattern: treats leavers as a nuisance'

- external_key: leadership.inclusive_culture.raising_concerns_channels
  competency_key: culture_values
  topic: Channels to raise concerns
  difficulty: medium
  text: >-
    What channels exist on your team for someone to raise a concern about conduct or fairness, and how do you make sure they
    work?
  expected_concepts:
  - multiple routes including outside the line manager
  - clarity on confidentiality limits
  - prompt response
  - follow-up with the person
  - protecting them from retaliation
  rubric:
    excellent: >-
      Describes multiple routes, clear expectations, prompt response and protection, and an example of a concern handled well.
    good: Has a route and responds reasonably.
    weak: Says nobody has ever raised anything.
  followups:
  - What would stop someone from using it?
  - How do you handle anonymity?
  common_errors:
  - 'Answering in the weak pattern: says nobody has ever raised anything'

- external_key: leadership.inclusive_culture.feedback_loops_on_inclusion
  competency_key: culture_values
  topic: Checking how your team experiences working practices
  difficulty: medium
  text: >-
    How do you find out how people experience your team's working practices, and what have you changed as a result?
  expected_concepts:
  - regular surveys or retros
  - one-to-one questions
  - asking about specific practices
  - acting visibly
  - sharing results
  rubric:
    excellent: >-
      Uses several channels, asks specific questions, shares results and acts visibly, with a clear example.
    good: Collects feedback and makes some changes.
    weak: Assumes things are fine without asking.
  followups:
  - What did you hear that you did not expect?
  - How do you act on anonymous feedback?
  common_errors:
  - 'Answering in the weak pattern: assumes things are fine without asking'

- external_key: leadership.inclusive_culture.reorg_selection_fairness
  competency_key: people_management
  topic: Selecting people for new roles during a reorganisation
  difficulty: hard
  text: >-
    A reorganisation means you must choose who takes on a few new roles. How do you keep the selection fair and credible?
  expected_concepts:
  - published criteria
  - open application
  - evidence-based comparison
  - multiple decision makers
  - clear communication to everyone
  - feedback for those not selected
  rubric:
    excellent: >-
      Publishes criteria, opens access, uses evidence and several assessors, and gives feedback to everyone, with trust maintained.
    good: Uses criteria and communicates decisions.
    weak: Picks the people already known and informs others later.
  followups:
  - How do you handle someone who feels overlooked?
  - What would you do about assessors' conflicts of interest?
  common_errors:
  - >-
    Answering in the weak pattern: picks the people already known and informs others later

- external_key: leadership.inclusive_culture.acting_on_a_survey_result
  competency_key: culture_values
  topic: Acting on a poor engagement signal
  difficulty: hard
  text: >-
    Your team survey shows that some groups of people feel their input matters less than others. What do you do?
  expected_concepts:
  - examining the data for patterns
  - talking to the people
  - choosing a few changes
  - assigning owners
  - reporting progress
  - resurveying
  rubric:
    excellent: >-
      Examines patterns, listens to those affected, commits to specific changes with owners, reports progress and resurveys.
    good: Discusses results and makes some changes.
    weak: Disputes the data.
  followups:
  - Which change had most effect?
  - How did you stay open to hearing more?
  common_errors:
  - 'Answering in the weak pattern: disputes the data'

- external_key: leadership.inclusive_culture.fixing_unequal_pay_or_levels
  competency_key: people_management
  topic: Inconsistent levels within a team
  difficulty: hard
  text: >-
    You find that two people doing similar work are at different levels with different pay. What do you do?
  expected_concepts:
  - confirming facts using documented criteria
  - checking history and reasons
  - raising with your manager and HR
  - proposing a correction
  - communicating carefully
  - avoiding side promises
  rubric:
    excellent: >-
      Confirms against criteria, escalates through the right channels, proposes a correction and communicates carefully.
    good: Raises it and seeks a review.
    weak: Ignores it or fixes it privately without process.
  followups:
  - What if budget does not allow the correction?
  - How do you tell the affected people?
  common_errors:
  - 'Answering in the weak pattern: ignores it or fixes it privately without process'

- external_key: leadership.inclusive_culture.protecting_dissenter
  competency_key: leadership
  topic: A team member who challenged a leader
  difficulty: hard
  text: >-
    A team member publicly challenged a director's decision and now seems to be sidelined. What do you do?
  expected_concepts:
  - confirming the facts
  - talking to the person
  - discussing with the director
  - protecting access to opportunities
  - documenting
  - escalating if retaliation is real
  rubric:
    excellent: >-
      Verifies, supports the person, raises the issue with the director, protects opportunities and escalates properly.
    good: Talks to the person and the director.
    weak: Stays out to protect themselves.
  followups:
  - What did the director say?
  - How would you tell if the sidelining continued?
  common_errors:
  - 'Answering in the weak pattern: stays out to protect themselves'

- external_key: leadership.inclusive_culture.measuring_inclusion_without_harm
  competency_key: culture_values
  topic: Measuring team health without overreach
  difficulty: hard
  text: >-
    How would you measure whether your team practices are working for everyone without collecting intrusive personal information?
  expected_concepts:
  - work-related measures such as participation and workload
  - anonymous short surveys
  - aggregated results
  - avoiding personal data
  - acting on patterns
  - sharing results
  rubric:
    excellent: >-
      Chooses work-related measures and anonymous aggregated surveys, avoids personal data, and acts on patterns visibly.
    good: Uses surveys and observation.
    weak: Collects personal details or measures nothing.
  followups:
  - What would you never ask?
  - What do you do with a small sample?
  common_errors:
  - 'Answering in the weak pattern: collects personal details or measures nothing'

- external_key: leadership.inclusive_culture.inclusive_product_decisions
  competency_key: product_sense
  topic: Considering varied users in team decisions
  difficulty: hard
  text: >-
    How do you make sure that team decisions about a product take into account the different ways and situations in which
    people use it?
  expected_concepts:
  - user research across contexts
  - accessibility checks
  - testing with varied participants
  - looking at who is missing in feedback
  - making trade-offs explicit
  rubric:
    excellent: >-
      Plans research across contexts, includes accessibility, notes who is missing in the data, and shows a decision that
      changed.
    good: Includes some varied research.
    weak: Designs for the team's own use.
  followups:
  - Whose needs did you discover late?
  - How did you change the plan?
  common_errors:
  - 'Answering in the weak pattern: designs for the team''s own use'

- external_key: leadership.inclusive_culture.change_management_fairness
  competency_key: adaptability
  topic: Rolling out change fairly
  difficulty: hard
  text: >-
    You are changing a team process, such as moving to a new review policy. How do you make sure the transition does not disadvantage
    some people?
  expected_concepts:
  - impact assessment on varied working patterns
  - early involvement of affected people
  - support for learning
  - pilots
  - feedback and adjustment
  rubric:
    excellent: >-
      Assesses impact on different ways of working, involves people early, supports learning, pilots and adjusts.
    good: Consults and supports.
    weak: Announces the change and expects adaptation.
  followups:
  - Who was most affected?
  - What did you adjust after the pilot?
  common_errors:
  - 'Answering in the weak pattern: announces the change and expects adaptation'

- external_key: leadership.inclusive_culture.mentoring_equity_in_sponsorship
  competency_key: mentoring
  topic: Equal access to senior attention
  difficulty: hard
  text: >-
    You notice senior people on your team tend to mentor those who resemble themselves in work style. How do you widen access?
  expected_concepts:
  - open mentoring programme
  - matching on goals
  - asking seniors to widen
  - tracking who gets attention
  - rewarding mentoring of varied people
  rubric:
    excellent: >-
      Creates open access and goal-based matching, tracks the pattern, and rewards wider mentoring, with improvements.
    good: Encourages seniors to mentor widely.
    weak: Considers it natural.
  followups:
  - What did seniors say?
  - How did you measure?
  common_errors:
  - 'Answering in the weak pattern: considers it natural'
