# Curated questions: leadership round, crisis leadership (part 3 of 4).
# Focus: leading through incidents and crises, calm communication and follow-up. Questions ask for real past examples or concrete approaches;
# evaluation is based only on the content of the answer (actions, reasoning, outcomes, reflection).
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.crisis_leadership.handoff_between_shifts
  competency_key: incident_response
  topic: Handing an incident over
  difficulty: easy
  text: A long incident needs a handover to another person. How do you do it well?
  expected_concepts:
  - written summary
  - current state and hypotheses
  - open actions
  - who to contact
  - overlap period
  - confirming understanding
  rubric:
    excellent: >-
      Gives a written and verbal handover with state, hypotheses and open actions, and confirms understanding.
    good: Handover with summary.
    weak: A short verbal note.
  followups:
  - What went wrong in a handover?
  - How long was the overlap?
  common_errors:
  - 'Answering in the weak pattern: a short verbal note'

- external_key: leadership.crisis_leadership.preparing_for_incidents
  competency_key: incident_response
  topic: Being ready before something goes wrong
  difficulty: easy
  text: What do you do in advance so your team can respond well when something fails?
  expected_concepts:
  - runbooks
  - on-call training
  - practice drills
  - clear escalation
  - monitoring
  - contact lists
  rubric:
    excellent: >-
      Lists specific preparations such as runbooks and drills, with evidence they helped.
    good: Has runbooks and alerts.
    weak: Waits for incidents to learn.
  followups:
  - When did a runbook help?
  - How often do you practise?
  common_errors:
  - 'Answering in the weak pattern: waits for incidents to learn'

- external_key: leadership.crisis_leadership.severity_levels
  competency_key: incident_response
  topic: Classifying severity
  difficulty: easy
  text: >-
    How does your team decide the severity of an incident, and what changes with the level?
  expected_concepts:
  - criteria based on customer impact
  - response expectations
  - communication level
  - escalation
  - reclassifying as facts change
  rubric:
    excellent: Describes criteria and consequences, and how they reclassify.
    good: Uses levels with some criteria.
    weak: Chooses severity by gut feeling.
  followups:
  - Have you changed a severity?
  - Who decides?
  common_errors:
  - 'Answering in the weak pattern: chooses severity by gut feeling'

- external_key: leadership.crisis_leadership.saying_i_dont_know
  competency_key: communication
  topic: Admitting uncertainty during an incident
  difficulty: easy
  text: When executives ask for a cause or an estimate you don't have, what do you say?
  expected_concepts:
  - stating what is known
  - stating what is unknown
  - saying when you will know more
  - not guessing
  - offering options
  rubric:
    excellent: States known and unknown, gives a time for the next update and avoids guessing.
    good: Says you do not yet know and promises an update.
    weak: Guesses to satisfy them.
  followups:
  - What did they say?
  - How did you handle pressure for an estimate?
  common_errors:
  - 'Answering in the weak pattern: guesses to satisfy them'

- external_key: leadership.crisis_leadership.protecting_responders
  competency_key: leadership
  topic: Shielding the people fixing the problem
  difficulty: easy
  text: >-
    How do you protect the people doing the technical work from interruptions during an incident?
  expected_concepts:
  - single point of contact
  - communications owner
  - stakeholder channel
  - explaining why
  - leader absorbing questions
  rubric:
    excellent: >-
      Uses a communication owner and channel to absorb questions and explains the reason to stakeholders.
    good: Takes questions themselves.
    weak: Allows everyone to message responders.
  followups:
  - Who spoke to executives?
  - How did you manage a senior person who joined?
  common_errors:
  - 'Answering in the weak pattern: allows everyone to message responders'

- external_key: leadership.crisis_leadership.transparent_status_pages
  competency_key: communication
  topic: Publicly reporting status
  difficulty: medium
  text: How do you decide what to put on a public status page during an incident?
  expected_concepts:
  - customer-relevant impact
  - clear language
  - update rhythm
  - avoiding internal detail
  - timing
  - ownership of the page
  rubric:
    excellent: Describes what to include and not, language, rhythm and owner, with examples.
    good: Posts impact and updates.
    weak: Posts late or not at all.
  followups:
  - Who owns the page?
  - What did you avoid saying?
  common_errors:
  - 'Answering in the weak pattern: posts late or not at all'

- external_key: leadership.crisis_leadership.external_audit_after_incident
  competency_key: stakeholder_management
  topic: Explaining an incident to regulators or auditors
  difficulty: medium
  text: >-
    An incident must be explained to auditors or an external party. How do you prepare?
  expected_concepts:
  - facts and timeline
  - evidence
  - accountability
  - actions taken
  - consistent story
  - involving legal
  rubric:
    excellent: >-
      Prepares timeline and evidence, aligns with legal, explains actions and accountability consistently.
    good: Prepares a report.
    weak: Offers a vague account.
  followups:
  - What evidence did you provide?
  - What did they ask?
  common_errors:
  - 'Answering in the weak pattern: offers a vague account'

- external_key: leadership.crisis_leadership.deciding_who_leads
  competency_key: leadership
  topic: Choosing an incident lead
  difficulty: medium
  text: >-
    How do you decide who should lead an incident, and what do you do if the most senior person isn't the best choice?
  expected_concepts:
  - skills of coordination
  - rota
  - training
  - authority
  - deferring to the right lead
  - respecting seniority
  rubric:
    excellent: >-
      Chooses by coordination skill and training, builds clear authority and handles seniority diplomatically.
    good: Uses a rota of trained leads.
    weak: Defaults to the most senior.
  followups:
  - Has a senior person deferred to you?
  - How did you handle it?
  common_errors:
  - 'Answering in the weak pattern: defaults to the most senior'

- external_key: leadership.crisis_leadership.decision_log_in_crisis
  competency_key: incident_response
  topic: Recording decisions
  difficulty: medium
  text: >-
    Why record decisions and reasons during a crisis and how do you do it without slowing down?
  expected_concepts:
  - scribe
  - short entries
  - reasons and alternatives
  - later review
  - accountability
  - learning
  rubric:
    excellent: Uses a scribe with short entries, records reasons and uses them in review.
    good: Keeps notes.
    weak: Reconstructs from memory.
  followups:
  - Who was the scribe?
  - What was most useful afterwards?
  common_errors:
  - 'Answering in the weak pattern: reconstructs from memory'

- external_key: leadership.crisis_leadership.mitigation_that_makes_it_worse
  competency_key: incident_response
  topic: A fix that backfired
  difficulty: medium
  text: Tell me about a fix during an incident that made things worse. What did you do?
  expected_concepts:
  - spotting the effect quickly
  - reverting
  - communicating
  - controlling changes
  - learning
  - review
  rubric:
    excellent: >-
      Spots the effect quickly, reverts, communicates, tightens change control and learns.
    good: Reverts and informs.
    weak: Persists with the failed fix.
  followups:
  - How quickly did you notice?
  - What change control did you add?
  common_errors:
  - 'Answering in the weak pattern: persists with the failed fix'

- external_key: leadership.crisis_leadership.capacity_crisis
  competency_key: observability
  topic: Overload at peak
  difficulty: medium
  text: Demand spikes beyond capacity. How do you lead the response?
  expected_concepts:
  - shedding or limiting load
  - priority customers
  - scaling
  - communication
  - monitoring
  - follow-up planning
  rubric:
    excellent: >-
      Prioritises critical load, scales and limits, communicates and plans for capacity.
    good: Scales the service up and monitors.
    weak: Waits for traffic to fall.
  followups:
  - What did you shed?
  - How did you prioritise?
  common_errors:
  - 'Answering in the weak pattern: waits for traffic to fall'

- external_key: leadership.crisis_leadership.cross_team_crisis_coordination
  competency_key: collaboration
  topic: Many teams working one problem
  difficulty: medium
  text: >-
    Several teams are working on the same incident and duplicating effort. How do you coordinate?
  expected_concepts:
  - single lead
  - a shared channel
  - assignments by team
  - regular syncs
  - one source of truth
  - avoiding noise
  rubric:
    excellent: >-
      Establishes a single lead, shared channel, assignments and regular syncs, and avoids duplication.
    good: Calls a sync and assigns work.
    weak: Lets teams work separately.
  followups:
  - How did you assign?
  - How often did you sync?
  common_errors:
  - 'Answering in the weak pattern: lets teams work separately'

- external_key: leadership.crisis_leadership.leader_visibility
  competency_key: leadership
  topic: Being seen during a crisis
  difficulty: medium
  text: >-
    How visible should a leader be during a crisis, and what do you do to support without getting in the way?
  expected_concepts:
  - presence without interference
  - clearing obstacles
  - communication to others
  - decision support
  - showing steadiness through clear actions
  rubric:
    excellent: >-
      Describes concrete support such as clearing obstacles and handling stakeholders, with an example.
    good: Is present and supportive.
    weak: Takes over or disappears.
  followups:
  - What obstacles did you clear?
  - When did you step back?
  common_errors:
  - 'Answering in the weak pattern: takes over or disappears'

- external_key: leadership.crisis_leadership.early_warning_culture
  competency_key: culture_values
  topic: Encouraging people to raise issues early
  difficulty: medium
  text: >-
    How do you build a culture in which people raise concerns early, before small problems become incidents?
  expected_concepts:
  - reacting well to bad news
  - blameless reviews
  - easy reporting
  - recognising early flags
  - sharing near misses
  rubric:
    excellent: >-
      Shows reactions that reward early flags, easy reporting and sharing near misses, with evidence of more early reports.
    good: Encourages reporting.
    weak: Asks people to be careful.
  followups:
  - What near miss did you share?
  - What changed in the number of reports?
  common_errors:
  - 'Answering in the weak pattern: asks people to be careful'

- external_key: leadership.crisis_leadership.stakeholder_trust_after_incident
  competency_key: stakeholder_management
  topic: Rebuilding trust
  difficulty: medium
  text: >-
    After a major incident, stakeholders have lost some trust in your team. How do you rebuild it?
  expected_concepts:
  - transparent review
  - clear actions
  - delivering them
  - regular progress updates
  - consistent reliability
  - direct conversations
  rubric:
    excellent: >-
      Shares the review, delivers on actions, updates regularly and shows sustained reliability.
    good: Shares the review and actions.
    weak: Hopes it will be forgotten.
  followups:
  - What did you commit to?
  - How long did it take?
  common_errors:
  - 'Answering in the weak pattern: hopes it will be forgotten'

- external_key: leadership.crisis_leadership.crisis_prioritisation_of_work
  competency_key: project_management
  topic: Dropping planned work for a crisis
  difficulty: medium
  text: >-
    A crisis forces you to drop planned work. How do you decide what stops and how do you tell people?
  expected_concepts:
  - criteria
  - stakeholder negotiation
  - explicit list
  - communication
  - a plan to resume
  - tracking the cost
  rubric:
    excellent: >-
      Decides by criteria, negotiates with stakeholders, communicates explicitly and plans to resume.
    good: Pauses work and informs.
    weak: Tries to do everything.
  followups:
  - What stopped?
  - What did the pause cost?
  common_errors:
  - 'Answering in the weak pattern: tries to do everything'

- external_key: leadership.crisis_leadership.fixing_the_root_not_symptom
  competency_key: incident_response
  topic: Resisting a quick patch
  difficulty: medium
  text: >-
    There is pressure to close an incident with a quick patch. When do you accept that and when do you push for a deeper fix?
  expected_concepts:
  - risk of recurrence
  - impact
  - cost
  - time-bound patch with a tracked follow-up
  - stakeholder explanation
  - decision
  rubric:
    excellent: >-
      Weighs recurrence risk and cost, accepts patches with tracked follow-up and explains the choice.
    good: Pushes for a root fix when risk is high.
    weak: Always accepts the patch.
  followups:
  - How did you track the follow-up?
  - What was the outcome?
  common_errors:
  - 'Answering in the weak pattern: always accepts the patch'

- external_key: leadership.crisis_leadership.leading_remote_responders
  competency_key: collaboration
  topic: Managing an incident across locations
  difficulty: medium
  text: Responders are in different places and time zones. How do you run the incident?
  expected_concepts:
  - video bridge or channel
  - clear roles
  - handover between zones
  - shared documents
  - avoiding talk-over
  - rest
  rubric:
    excellent: >-
      Sets up a bridge and shared documents, defines roles and handovers between zones, and manages communication.
    good: Uses a shared channel.
    weak: Lets people work in private threads.
  followups:
  - What was the handover like?
  - What went wrong?
  common_errors:
  - 'Answering in the weak pattern: lets people work in private threads'

- external_key: leadership.crisis_leadership.repeated_crises_culture
  competency_key: culture_values
  topic: A team stuck in firefighting
  difficulty: hard
  text: Your team lives in permanent firefighting. How do you move toward prevention?
  expected_concepts:
  - analysing time spent
  - top causes
  - protected time
  - stakeholder agreement
  - recognising prevention
  - metrics
  - leadership support
  rubric:
    excellent: >-
      Analyses time spent, targets top causes with protected time, gets stakeholder agreement, recognises prevention and shows
      less firefighting.
    good: Plans improvement work.
    weak: Treats firefighting as normal.
  followups:
  - How did you protect time?
  - What changed measurably?
  common_errors:
  - 'Answering in the weak pattern: treats firefighting as normal'

- external_key: leadership.crisis_leadership.sev_review_with_executives
  competency_key: stakeholder_management
  topic: Presenting a major incident to the board or executives
  difficulty: hard
  text: >-
    You must present a major incident review to senior executives. How do you structure it?
  expected_concepts:
  - summary first
  - impact in business terms
  - cause and contributing factors
  - response quality
  - actions with dates
  - asking for decisions
  rubric:
    excellent: >-
      Leads with business impact, covers cause and response clearly, lists actions with dates and asks for decisions.
    good: Gives a clear review.
    weak: Presents technical detail without impact.
  followups:
  - What did they ask?
  - What decision did you need?
  common_errors:
  - 'Answering in the weak pattern: presents technical detail without impact'

- external_key: leadership.crisis_leadership.crisis_of_confidence
  competency_key: leadership
  topic: A team that has lost belief
  difficulty: hard
  text: >-
    After repeated failures your team no longer believes it can deliver. How do you lead them back?
  expected_concepts:
  - listening
  - small wins
  - clear plan
  - factual assessment of problems in terms of facts
  - recognising progress
  - stakeholder support
  rubric:
    excellent: >-
      Listens, sets a clear plan with small wins, shares facts, recognises progress and shows recovering delivery.
    good: Sets a plan and encourages.
    weak: Tells the team to try harder.
  followups:
  - What was the first win?
  - How long did it take?
  common_errors:
  - 'Answering in the weak pattern: tells the team to try harder'

- external_key: leadership.crisis_leadership.outage_from_long_known_risk
  competency_key: ownership
  topic: An incident from a risk you knew about
  difficulty: hard
  text: >-
    An incident was caused by a risk you had flagged earlier but was not prioritised. How do you handle the review and conversations?
  expected_concepts:
  - facts about the earlier flag
  - avoiding I-told-you-so
  - understanding prioritisation reasoning
  - shared accountability
  - changing the risk process
  rubric:
    excellent: >-
      Presents facts neutrally, avoids blame, examines the prioritisation process and improves how risks are decided.
    good: Highlights the earlier flag and proposes changes.
    weak: Assigns blame to those who deferred it.
  followups:
  - How did you raise it originally?
  - What changed in risk decisions?
  common_errors:
  - 'Answering in the weak pattern: assigns blame to those who deferred it'

- external_key: leadership.crisis_leadership.customer_data_request_crisis
  competency_key: security
  topic: An urgent legal or customer data demand
  difficulty: hard
  text: >-
    You receive an urgent demand for customer information during a crisis. How do you respond?
  expected_concepts:
  - verifying the request
  - involving legal
  - limiting disclosure
  - documenting
  - informing the right people
  - avoiding rushed decisions
  rubric:
    excellent: >-
      Verifies the request, involves legal, limits disclosure, documents and informs the right people.
    good: Escalates to legal.
    weak: Provides the data quickly.
  followups:
  - Who verified it?
  - What was disclosed?
  common_errors:
  - 'Answering in the weak pattern: provides the data quickly'

- external_key: leadership.crisis_leadership.leading_through_team_departures
  competency_key: people_management
  topic: Several key people leave mid-crisis
  difficulty: hard
  text: >-
    In the middle of a crisis, two key engineers announce they're leaving. What do you do?
  expected_concepts:
  - continuing the response
  - understanding reasons later
  - knowledge capture
  - reallocating
  - supporting the team
  - planning replacements
  rubric:
    excellent: >-
      Maintains the response, captures knowledge, reallocates, supports the team and addresses reasons afterwards.
    good: Keeps working and plans replacement.
    weak: Loses focus on the response.
  followups:
  - How did you capture knowledge?
  - What did you learn from their reasons?
  common_errors:
  - 'Answering in the weak pattern: loses focus on the response'

- external_key: leadership.crisis_leadership.contested_post_incident_findings
  competency_key: incident_response
  topic: Disagreement on the cause
  difficulty: hard
  text: >-
    After the incident two teams disagree about the root cause, and each says the other is responsible. How do you resolve
    it?
  expected_concepts:
  - reconstructing the timeline
  - contributing factors from both
  - neutral facilitator
  - shared actions
  - avoiding single root cause
  - leaders' alignment
  rubric:
    excellent: >-
      Reconstructs facts, identifies contributing factors on both sides, facilitates neutrally and agrees shared actions.
    good: Brings teams together and shares findings.
    weak: Picks a side.
  followups:
  - Who facilitated?
  - What shared actions came out?
  common_errors:
  - 'Answering in the weak pattern: picks a side'
