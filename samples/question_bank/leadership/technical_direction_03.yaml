# Curated questions: leadership round, technical direction (part 3 of 4). Scale, platforms versus managed services, security and privacy by design, governance and modernisation. Evaluation is based only on the content of the answer.
version: 1
defaults:
  role_tags:
  - tech_lead
  - engineering_manager
  - product_manager
  round_types:
  - leadership
  kind: leadership
questions:

- external_key: leadership.technical_direction.learning_new_domain_fast
  competency_key: adaptability
  topic: Getting up to speed in an unfamiliar technical area
  difficulty: easy
  text: >-
    You're asked to guide technical direction in an area you haven't worked in. How do you get to a useful
    level of understanding quickly?
  expected_concepts:
  - finding the key concepts and vocabulary
  - talking to practitioners
  - reading real incidents and designs
  - building a small example
  - being open about limits
  rubric:
    excellent: >-
      Identifies key concepts, talks to practitioners, reads incidents and designs, builds a small example
      and is open about limits, with an example.
    good: Reads and asks experts.
    weak: Pretends familiarity or avoids the area.
  followups:
  - What did you build?
  - Whom did you ask?
  common_errors:
  - Pretends familiarity or avoids the area.

- external_key: leadership.technical_direction.trade_off_vocabulary
  competency_key: communication
  topic: Describing trade-offs clearly
  difficulty: easy
  text: >-
    How do you describe technical trade-offs so that decision-makers can compare options fairly?
  expected_concepts:
  - same criteria for each option
  - what you gain and give up
  - evidence rather than preference
  - a recommendation
  - uncertainty
  rubric:
    excellent: >-
      Uses the same criteria for each option, states gains and losses, backs with evidence, gives a recommendation
      and states uncertainty.
    good: Lists pros and cons with a recommendation.
    weak: Describes only the preferred option.
  followups:
  - How do you choose the criteria?
  - How do you show uncertainty?
  common_errors:
  - Describes only the preferred option.

- external_key: leadership.technical_direction.code_ownership_clarity
  competency_key: ownership
  topic: Making ownership of components clear
  difficulty: easy
  text: >-
    Why does clear ownership of components matter for technical direction, and how do you establish it?
  expected_concepts:
  - a named team per component
  - contact and escalation paths
  - ownership in the repository or catalogue
  - handling orphaned code
  - review of ownership as teams change
  rubric:
    excellent: >-
      Explains the effect on quality and decisions, uses named owners in a catalogue, handles orphaned
      components and reviews ownership when teams change.
    good: Assigns owners and documents them.
    weak: Treats ownership as informal.
  followups:
  - What do you do with orphaned code?
  - How do you keep it current?
  common_errors:
  - Treats ownership as informal.

- external_key: leadership.technical_direction.small_technical_experiments
  competency_key: problem_solving
  topic: Testing a technical idea cheaply
  difficulty: easy
  text: How do you test a technical idea cheaply before committing a team to it?
  expected_concepts:
  - define the question
  - smallest experiment that answers it
  - time limit
  - measure
  - share what was learned
  rubric:
    excellent: >-
      Defines the question, designs the smallest experiment, limits time, measures and shares learning,
      with an example.
    good: Builds a prototype and shares findings.
    weak: Builds the full solution to test it.
  followups:
  - What was the question?
  - What did you do with the result?
  common_errors:
  - Builds the full solution to test it.

- external_key: leadership.technical_direction.staying_hands_on
  competency_key: leadership
  topic: Staying technically connected as a leader
  difficulty: easy
  text: >-
    As your responsibilities grow, how do you stay close enough to the technical details to make good
    decisions?
  expected_concepts:
  - reading designs and code reviews
  - occasionally pairing or building small tools
  - talking to engineers
  - learning from incidents
  - knowing what to delegate
  rubric:
    excellent: >-
      Describes specific habits such as reviewing designs, pairing and learning from incidents, and clear
      judgement about delegating.
    good: Reads some code and talks to engineers.
    weak: Relies entirely on reports from others.
  followups:
  - What do you review?
  - How do you avoid becoming a bottleneck?
  common_errors:
  - Relies entirely on reports from others.

- external_key: leadership.technical_direction.scaling_ahead
  competency_key: leadership
  topic: Planning for scale without overbuilding
  difficulty: medium
  text: How do you decide how much scale to build for in advance of actual demand?
  expected_concepts:
  - current and projected load
  - cost of change later
  - cheap options to scale
  - load testing
  - triggers for investment
  rubric:
    excellent: >-
      Uses current and projected load, compares cost of change later, prefers cheap scaling options, load
      tests and defines triggers.
    good: Plans for expected growth with some testing.
    weak: Builds for hypothetical large scale or ignores growth.
  followups:
  - What trigger did you define?
  - Where did you overbuild?
  common_errors:
  - Builds for hypothetical large scale or ignores growth.

- external_key: leadership.technical_direction.framework_upgrade_decision
  competency_key: project_management
  topic: Deciding on a major framework upgrade
  difficulty: medium
  text: >-
    A major upgrade of a core framework is available, and it will cost significant effort. How do you
    decide whether and when to do it?
  expected_concepts:
  - support lifecycle and security
  - benefits
  - effort and risk
  - incremental paths
  - coordinating across teams
  rubric:
    excellent: >-
      Considers support lifecycle and security, benefits, effort, incremental routes and coordination,
      and sets a plan.
    good: Plans an upgrade based on support dates.
    weak: Upgrades whenever released or never.
  followups:
  - What forced the date?
  - How did you reduce the effort?
  common_errors:
  - Upgrades whenever released or never.

- external_key: leadership.technical_direction.managed_vs_self_run
  competency_key: leadership
  topic: Using a managed service versus running your own
  difficulty: medium
  text: >-
    Your team can run a component itself or use a managed version. How do you decide?
  expected_concepts:
  - operating burden and skills
  - cost at expected scale
  - control and customisation needs
  - reliability track record
  - exit options
  rubric:
    excellent: >-
      Compares operating burden, cost at scale, control needs, reliability and exit options, and states
      the decision with a revisit trigger.
    good: Weighs cost and effort.
    weak: Chooses based on preference.
  followups:
  - What would make you switch?
  - How do you account for on-call load?
  common_errors:
  - Chooses based on preference.

- external_key: leadership.technical_direction.repo_structure
  competency_key: leadership
  topic: One repository or many
  difficulty: medium
  text: >-
    How would you decide between keeping code in one large repository or many smaller ones?
  expected_concepts:
  - team autonomy
  - shared code and atomic changes
  - tooling and build cost
  - access control
  - migration cost
  rubric:
    excellent: >-
      Weighs autonomy, shared code, tooling and build cost, access control and migration cost, and describes
      a decision and its effect.
    good: Compares benefits with some tooling consideration.
    weak: Follows what other companies do.
  followups:
  - What tooling did it need?
  - What would reverse your decision?
  common_errors:
  - Follows what other companies do.

- external_key: leadership.technical_direction.security_by_design
  competency_key: leadership
  topic: Building security into the direction from the start
  difficulty: medium
  text: >-
    How do you make sure security is part of technical direction rather than something added at the end?
  expected_concepts:
  - threat modelling in design
  - secure defaults
  - automated checks
  - shared responsibility
  - learning from incidents
  rubric:
    excellent: >-
      Includes threat modelling in design, sets secure defaults, automates checks, shares responsibility
      and learns from incidents.
    good: Involves security in design reviews.
    weak: Leaves security to a separate team at the end.
  followups:
  - What default did you change?
  - How do you balance speed?
  common_errors:
  - Leaves security to a separate team at the end.

- external_key: leadership.technical_direction.privacy_architecture
  competency_key: leadership
  topic: Designing for data privacy requirements
  difficulty: medium
  text: >-
    Your product handles personal data across many services. How do you shape the architecture to respect
    privacy requirements?
  expected_concepts:
  - knowing what data is held and where
  - minimising collection
  - access control and audit
  - retention and deletion
  - working with legal
  rubric:
    excellent: >-
      Maps data, minimises collection, controls access with audit, handles retention and deletion and
      works with legal.
    good: Applies access controls and works with compliance.
    weak: Treats privacy as a policy document only.
  followups:
  - How do you handle deletion requests?
  - How do you find all the places data is stored?
  common_errors:
  - Treats privacy as a policy document only.

- external_key: leadership.technical_direction.observability_direction
  competency_key: leadership
  topic: Setting an observability strategy
  difficulty: medium
  text: >-
    How would you set direction for monitoring and diagnosing production across many teams?
  expected_concepts:
  - common standards and tooling
  - what each service must expose
  - user-focused measures
  - alert quality
  - cost control
  rubric:
    excellent: >-
      Sets common standards, minimum signals per service, user-focused measures, alert quality targets
      and cost control.
    good: Chooses tooling and standards.
    weak: Lets each team do its own thing.
  followups:
  - What is the minimum?
  - How do you reduce noise?
  common_errors:
  - Lets each team do its own thing.

- external_key: leadership.technical_direction.event_driven_adoption
  competency_key: leadership
  topic: Adopting an event-driven approach
  difficulty: medium
  text: >-
    Teams want to move toward event-driven communication. How do you decide how far to go?
  expected_concepts:
  - problems it solves
  - ordering, duplicate and failure handling
  - debugging difficulty
  - schema management
  - starting with a bounded area
  rubric:
    excellent: >-
      Identifies the problem solved, plans for ordering, duplicates and failures, anticipates debugging
      difficulty, manages schemas and starts with a bounded area.
    good: Pilots in one area and learns.
    weak: Moves everything at once.
  followups:
  - What caused trouble first?
  - How did you manage schema changes?
  common_errors:
  - Moves everything at once.

- external_key: leadership.technical_direction.testing_strategy_direction
  competency_key: project_management
  topic: Setting direction for testing
  difficulty: medium
  text: >-
    Teams have very different testing practices. What direction do you set and how do you support it?
  expected_concepts:
  - a shared principle rather than a number
  - fast feedback
  - critical paths first
  - tooling and examples
  - measuring escaped defects
  rubric:
    excellent: >-
      Sets shared principles, emphasises fast feedback and critical paths, supplies tooling and examples
      and measures escaped defects.
    good: Sets expectations and provides tools.
    weak: Mandates a coverage figure.
  followups:
  - What metric did you avoid?
  - How did you help teams with legacy code?
  common_errors:
  - Mandates a coverage figure.

- external_key: leadership.technical_direction.mandated_technology
  competency_key: adaptability
  topic: A technology choice handed down to you
  difficulty: medium
  text: >-
    Leadership mandates a technology choice for your area that you think is not ideal. How do you respond?
  expected_concepts:
  - understanding the reasoning
  - presenting concerns with evidence
  - finding how to make it work well
  - setting review points
  - not undermining
  rubric:
    excellent: >-
      Understands the reasoning, presents concerns with evidence, finds ways to make it work, sets review
      points and doesn't undermine.
    good: Raises concerns and implements.
    weak: Resists passively.
  followups:
  - What was the outcome?
  - What review point did you set?
  common_errors:
  - Resists passively.

- external_key: leadership.technical_direction.technical_bets_on_roadmap
  competency_key: stakeholder_management
  topic: Getting technical bets onto the product roadmap
  difficulty: medium
  text: >-
    How do you get a technical investment with a long payback onto a roadmap that is full of customer-visible
    items?
  expected_concepts:
  - framing in terms of customer outcomes
  - staged value
  - quantified delivery or risk benefit
  - agreed share of capacity
  - regular reporting
  rubric:
    excellent: >-
      Frames in customer outcomes, stages the value, quantifies benefit, agrees a capacity share and reports
      progress.
    good: Presents benefit and negotiates time.
    weak: Asks for time without framing.
  followups:
  - What share did you negotiate?
  - How did you report?
  common_errors:
  - Asks for time without framing.

- external_key: leadership.technical_direction.replatform_decision
  competency_key: leadership
  topic: Deciding to move to a new platform
  difficulty: hard
  text: >-
    Your current platform is increasingly limiting, and a replatform would be expensive. How do you decide
    whether to do it?
  expected_concepts:
  - quantifying the limits
  - alternatives short of replatforming
  - total cost and risk
  - staged path
  - clear success measures
  rubric:
    excellent: >-
      Quantifies limits, evaluates cheaper alternatives, estimates cost and risk, plans a staged path
      and defines success measures.
    good: Evaluates options and decides with evidence.
    weak: Decides from frustration or reputation.
  followups:
  - What alternatives did you try?
  - How did you stage it?
  common_errors:
  - Decides from frustration or reputation.

- external_key: leadership.technical_direction.governance_without_bureaucracy
  competency_key: leadership
  topic: Keeping architecture coherent without slowing teams
  difficulty: hard
  text: >-
    How do you keep architecture coherent across many teams without creating a slow approval process?
  expected_concepts:
  - principles and guardrails
  - review only for irreversible or cross-team decisions
  - advice processes
  - paved paths
  - metrics on decision speed
  rubric:
    excellent: >-
      Uses principles and guardrails, restricts review to irreversible or cross-team decisions, uses advice
      processes and paved paths and tracks decision speed.
    good: Sets principles and a lightweight review.
    weak: Requires approval for everything or provides no coordination.
  followups:
  - What decisions need review?
  - How do you measure speed?
  common_errors:
  - Requires approval for everything or provides no coordination.

- external_key: leadership.technical_direction.autonomy_and_coherence
  competency_key: leadership
  topic: Balancing team autonomy and shared direction
  difficulty: hard
  text: >-
    Teams want autonomy but the system suffers when each makes different choices. How do you balance this?
  expected_concepts:
  - choosing what must be common
  - letting teams choose the rest
  - making common choices easy
  - explaining reasons
  - revisiting when they hurt
  rubric:
    excellent: >-
      Chooses what must be common with reasons, lets teams decide the rest, makes common choices easy
      and revisits them.
    good: Sets some standards with flexibility.
    weak: Chooses full control or full freedom.
  followups:
  - Which things did you set as common?
  - What did you let go?
  common_errors:
  - Chooses full control or full freedom.

- external_key: leadership.technical_direction.legacy_modernisation
  competency_key: project_management
  topic: A modernisation strategy for legacy systems
  difficulty: hard
  text: >-
    Describe how you would set a strategy for modernising a set of legacy systems that the business depends
    on.
  expected_concepts:
  - inventory and risk ranking
  - business value
  - incremental replacement
  - preserving behaviour with tests
  - funding and measures
  rubric:
    excellent: >-
      Builds an inventory and risk ranking, ties to business value, replaces incrementally, preserves
      behaviour with tests, and sets funding and measures.
    good: Plans prioritised incremental replacements.
    weak: Plans a big-bang replacement.
  followups:
  - What was first?
  - How did you protect behaviour?
  common_errors:
  - Plans a big-bang replacement.

- external_key: leadership.technical_direction.technical_due_diligence
  competency_key: problem_solving
  topic: Assessing another company's technology
  difficulty: hard
  text: >-
    You've been asked to assess the technology of a company that your organisation may acquire. How do
    you go about it in a short time?
  expected_concepts:
  - key questions about scalability, security, team and debt
  - reviewing architecture, code samples and incidents
  - talking to engineers
  - risk-ranking
  - clear report with uncertainty
  rubric:
    excellent: >-
      Defines key questions, reviews architecture, code and incidents, talks to engineers, ranks risks
      and reports with uncertainty.
    good: Reviews architecture and team with a summary.
    weak: Relies on slides from the target.
  followups:
  - What would be a red flag?
  - What did you not have time to check?
  common_errors:
  - Relies on slides from the target.

- external_key: leadership.technical_direction.extensibility_vs_focus
  competency_key: leadership
  topic: Designing for extension without overengineering
  difficulty: hard
  text: >-
    Product leaders want the platform to be extensible by other teams or partners. How do you decide how
    much to invest in extensibility?
  expected_concepts:
  - real demand
  - cost of the extension points
  - versioning and support
  - starting with one or two consumers
  - deprecation
  rubric:
    excellent: >-
      Looks for real demand, estimates cost, plans versioning and support, starts with one or two consumers
      and plans deprecation.
    good: Builds some extension points for known needs.
    weak: Builds a general framework without users.
  followups:
  - Who was the first consumer?
  - What did the support cost?
  common_errors:
  - Builds a general framework without users.

- external_key: leadership.technical_direction.reliability_feature_balance
  competency_key: ownership
  topic: Balancing reliability work and features
  difficulty: hard
  text: >-
    How do you set direction on how much to invest in reliability versus new features, and how do you
    adjust it?
  expected_concepts:
  - reliability targets tied to users
  - budgets for errors
  - clear triggers for shifting effort
  - transparency to product
  - review after incidents
  rubric:
    excellent: >-
      Defines targets tied to users, uses error budgets, sets triggers to shift effort, is transparent
      with product and reviews after incidents.
    good: Allocates a share of time to reliability with reasons.
    weak: Does reliability only after outages.
  followups:
  - What triggered a shift?
  - How did product react?
  common_errors:
  - Does reliability only after outages.

- external_key: leadership.technical_direction.multi_region_direction
  competency_key: leadership
  topic: Deciding whether to serve from several regions
  difficulty: medium
  text: >-
    Customers in other parts of the world want lower latency and local availability. How do you decide
    whether to run your system in multiple regions?
  expected_concepts:
  - what customers actually need
  - data residency and consistency implications
  - added operational complexity
  - cost
  - phased approach
  rubric:
    excellent: >-
      Clarifies customer need, covers data residency and consistency effects, weighs operational complexity
      and cost and phases the approach.
    good: Weighs latency and cost benefits.
    weak: Replicates everything without examining data or operations.
  followups:
  - What was hardest to replicate?
  - What did you phase?
  common_errors:
  - Replicates everything without examining data or operations.

- external_key: leadership.technical_direction.cost_aware_architecture
  competency_key: leadership
  topic: Making cost a design input
  difficulty: medium
  text: >-
    Infrastructure costs are rising faster than revenue. How do you bring cost into technical decisions
    without hurting delivery?
  expected_concepts:
  - visibility of cost per service or feature
  - owners accountable
  - quick wins versus structural changes
  - cost in design reviews
  - protecting reliability
  rubric:
    excellent: >-
      Makes cost visible per service, gives owners accountability, separates quick wins from structural
      changes, includes cost in design reviews and protects reliability.
    good: Reviews bills and addresses the biggest items.
    weak: Cuts spending across the board.
  followups:
  - What was the biggest item?
  - How did teams respond?
  common_errors:
  - Cuts spending across the board.
