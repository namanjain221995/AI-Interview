# Curated questions: backend engineering (languages, APIs, databases, distributed systems, testing).
version: 1
defaults:
  role_tags: [backend, fullstack]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ----------------------------------------------------------------- python
  - external_key: backend.python.core_collections
    competency_key: python
    topic: Choosing Python data structures
    difficulty: easy
    kind: technical
    role_tags: [backend, data, ml]
    text: >-
      In Python, when would you use a list, a tuple, a set or a dict? Tell me about the performance
      characteristics that drive the choice.
    expected_concepts:
      - list for ordered mutable sequences
      - tuple for immutable records and hashable keys
      - set for membership and de-duplication
      - dict for key-value lookup
      - average O(1) membership in sets and dicts versus O(n) in lists
    rubric:
      excellent: Chooses by semantics and complexity, mentions hashability and immutability, and gives an example where switching from a list to a set fixed a performance problem.
      good: Correct uses and complexity for membership checks.
      weak: Cannot explain when a set beats a list or treats tuples as just "read-only lists".
    followups:
      - Why can a tuple be a dict key but a list can't?
      - What is the cost of `x in my_list` for a million items?
    common_errors:
      - Membership checks against large lists inside loops.
      - Using mutable default arguments such as `def f(items=[])`.

  - external_key: backend.python.generators
    competency_key: python
    topic: Generators and lazy iteration
    difficulty: easy
    kind: technical
    role_tags: [backend, data, ml]
    text: >-
      What are generators in Python, and when have they made a real difference in code you've written?
    expected_concepts:
      - yield and lazy evaluation
      - constant memory streaming over large data
      - generator expressions
      - single-pass iteration
      - pipelines of generators
    rubric:
      excellent: Explains lazy evaluation and memory benefits precisely, gives a real streaming example, and notes the single-use nature of generators.
      good: Correct explanation with a sensible example.
      weak: Confuses generators with lists or cannot give a use case.
    followups:
      - What happens if you iterate over the same generator twice?
      - How would you process a 20 GB log file line by line?
    common_errors:
      - Materialising a generator with list() and losing the memory benefit.
      - Expecting a generator to be reusable.

  - external_key: backend.python.concurrency_models
    competency_key: python
    topic: Threads, processes and asyncio
    difficulty: medium
    kind: technical
    role_tags: [backend, data, ml]
    text: >-
      How does the GIL affect concurrency in Python, and how do you decide between threads, processes and
      asyncio for a given workload?
    expected_concepts:
      - GIL serialises Python bytecode execution
      - threads suit I/O-bound work
      - processes for CPU-bound work
      - asyncio for many concurrent I/O tasks
      - C extensions that release the GIL
      - free-threaded builds as a newer option
    rubric:
      excellent: Explains what the GIL does and does not block, chooses the model by workload with examples, and mentions overheads such as process start-up and serialisation.
      good: Threads or asyncio for I/O, processes for CPU, with the GIL explained.
      weak: Believes threads speed up CPU-bound Python code.
    followups:
      - Why can NumPy code run in parallel threads despite the GIL?
      - When does asyncio make code slower or harder to reason about?
    common_errors:
      - Using threads for CPU-heavy pure Python loops.
      - Mixing blocking libraries into asyncio code.

  - external_key: backend.python.blocking_in_async
    competency_key: python
    topic: Blocking calls in async services
    difficulty: medium
    kind: scenario
    text: >-
      An async FastAPI service handles traffic fine at low load, but latency explodes under moderate load.
      You discover a synchronous HTTP call inside an async endpoint. Explain what's happening and how you'd
      fix it.
    expected_concepts:
      - a blocking call stalls the event loop
      - all requests on that worker wait
      - async HTTP client (httpx or aiohttp)
      - run_in_executor or threadpool for unavoidable blocking code
      - connection pooling and timeouts
      - detecting blocking calls (debug mode, profiling)
    rubric:
      excellent: Explains event loop starvation clearly, fixes it with an async client or offloading to a thread pool, adds timeouts and pooling, and describes how to detect similar problems.
      good: Identifies the blocked event loop and uses an async client.
      weak: Suggests adding more servers without understanding the cause.
    followups:
      - What would you do if the blocking library had no async alternative?
      - How could you detect this class of problem automatically?
    common_errors:
      - Calling time.sleep or requests inside async def.
      - No timeouts on outbound calls.

  - external_key: backend.python.memory_leak
    competency_key: python
    topic: Memory growth in a long-running service
    difficulty: hard
    kind: scenario
    text: >-
      A long-running Python worker's memory grows steadily until it's killed every few hours. How would you
      find the cause?
    expected_concepts:
      - confirming growth pattern with metrics
      - tracemalloc snapshots and diffs
      - unbounded caches and global collections
      - reference cycles and objects held by closures
      - memory fragmentation and native extensions
      - mitigations such as worker recycling
    rubric:
      excellent: Confirms the pattern, compares tracemalloc snapshots to find allocation sites, checks unbounded caches and native memory, and fixes the cause while adding a safety net.
      good: Uses a profiling tool and names likely causes such as caches.
      weak: Only increases memory limits or restarts on a schedule.
    followups:
      - How would you tell Python heap growth from native library memory?
      - Is periodic worker recycling a fix or a workaround?
    common_errors:
      - Unbounded lru_cache or module-level dictionaries.
      - Assuming garbage collection frees everything not explicitly referenced in your code.

  # ------------------------------------------------------------------- java
  - external_key: backend.java.jvm_memory
    competency_key: java
    topic: JVM memory and OutOfMemoryError
    difficulty: medium
    kind: technical
    role_tags: [backend]
    text: >-
      A Java service throws OutOfMemoryError in production once a day. Walk me through how JVM memory is
      organised and how you'd investigate.
    expected_concepts:
      - heap versus metaspace versus thread stacks and direct memory
      - garbage collector behaviour
      - heap dumps on OOM
      - analysing dominators and retained size
      - container memory limits versus -Xmx
      - GC logs
    rubric:
      excellent: Explains memory areas, identifies which one is exhausted from the error message, captures and analyses heap dumps, and aligns JVM settings with container limits.
      good: Knows to take a heap dump and analyse it.
      weak: Only increases -Xmx.
    followups:
      - The error says "Metaspace" — what does that suggest?
      - How should -Xmx relate to the container memory limit?
    common_errors:
      - Setting the heap equal to the container limit, leaving no room for native memory.
      - Ignoring GC logs before tuning.

  - external_key: backend.java.concurrency
    competency_key: java
    topic: Java concurrency utilities
    difficulty: medium
    kind: technical
    role_tags: [backend]
    text: >-
      How do you write concurrent code in Java today? Compare synchronized blocks, explicit locks,
      concurrent collections, executors and CompletableFuture or virtual threads.
    expected_concepts:
      - intrinsic locks versus ReentrantLock
      - ConcurrentHashMap and atomic types
      - thread pools via ExecutorService
      - CompletableFuture composition
      - virtual threads for blocking I/O
      - visibility and happens-before
    rubric:
      excellent: Chooses tools by problem with clear correctness reasoning, explains memory visibility, and discusses when virtual threads simplify blocking I/O code.
      good: Correct use of executors and concurrent collections.
      weak: Synchronises everything or uses raw threads everywhere.
    followups:
      - What problem does volatile solve, and what doesn't it solve?
      - When would virtual threads not help?
    common_errors:
      - Check-then-act races on concurrent maps.
      - Unbounded thread creation per request.

  # --------------------------------------------------------------------- go
  - external_key: backend.go.goroutine_leaks
    competency_key: go
    topic: Goroutines, channels and leaks
    difficulty: medium
    kind: technical
    role_tags: [backend, devops, platform]
    text: >-
      How do you structure concurrent work in Go so goroutines don't leak? Give me an example of a leak you've
      seen or could imagine.
    expected_concepts:
      - context cancellation and deadlines
      - closing channels from the sender
      - blocked sends or receives causing leaks
      - errgroup and WaitGroup
      - buffered versus unbuffered channels
      - goroutine profiling
    rubric:
      excellent: Uses context propagation and errgroup patterns, explains a concrete leak such as a blocked send after the receiver returned, and knows how to detect leaks with pprof.
      good: Mentions context cancellation and WaitGroups correctly.
      weak: Starts goroutines without any lifecycle management.
    followups:
      - What happens to a goroutine blocked sending on a channel nobody reads?
      - How would you spot leaked goroutines in production?
    common_errors:
      - Ignoring ctx.Done() in long-running loops.
      - Closing a channel from the receiver side.

  - external_key: backend.go.latency_under_load
    competency_key: go
    topic: Profiling a slow Go service
    difficulty: hard
    kind: scenario
    role_tags: [backend, platform]
    text: >-
      A Go HTTP service's latency rises sharply above 2,000 requests per second, although CPU is only at 50
      percent. How would you investigate?
    expected_concepts:
      - pprof CPU, heap, block and mutex profiles
      - lock contention
      - garbage collection pressure and allocations
      - connection pool limits (database or HTTP client)
      - goroutine counts
      - load testing to reproduce
    rubric:
      excellent: Reproduces under load, uses block and mutex profiles to find contention, checks GC and allocation rates and pool limits, and validates fixes with benchmarks.
      good: Uses pprof and considers contention or pool limits.
      weak: Only adds more instances.
    followups:
      - Why might CPU stay at 50 percent while latency rises?
      - How do you reduce allocations in a hot path?
    common_errors:
      - Default HTTP client settings with too few idle connections per host.
      - A global mutex around a shared map on the hot path.

  # ------------------------------------------------------------- api_design
  - external_key: backend.api_design.rest_semantics
    competency_key: api_design
    topic: REST resources and status codes
    difficulty: easy
    kind: technical
    round_types: [technical_screening, deep_technical, system_design, combined]
    text: >-
      How would you design the REST endpoints for managing orders in an online shop — resources, methods and
      the status codes you'd return?
    expected_concepts:
      - resource-oriented URLs (/orders, /orders/{id})
      - correct use of GET, POST, PUT, PATCH, DELETE
      - idempotent versus non-idempotent methods
      - 201, 400, 404, 409, 422 status codes
      - consistent error format
    rubric:
      excellent: Designs clear resources and methods, explains idempotency per method, uses precise status codes and a consistent error body, and considers state transitions such as cancellation.
      good: Sensible resource design and common status codes.
      weak: Verb-based URLs everywhere or returns 200 for every outcome.
    followups:
      - How would you model cancelling an order — PATCH, DELETE or a sub-resource?
      - Which status code fits a conflicting update, and why?
    common_errors:
      - Returning 200 with an error message in the body.
      - Using GET for operations with side effects.

  - external_key: backend.api_design.pagination
    competency_key: api_design
    topic: Pagination strategies
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, system_design, combined]
    text: >-
      What are the trade-offs between offset-based and cursor-based pagination, and which would you choose for
      an activity feed with millions of rows?
    expected_concepts:
      - offset cost grows with page depth
      - unstable results when rows are inserted
      - cursors based on a stable, indexed sort key
      - opaque cursor tokens
      - total counts are expensive
    rubric:
      excellent: Explains performance and consistency problems of offsets, designs a cursor on an indexed unique sort key with opaque tokens, and handles ties and filters.
      good: Chooses cursors for large feeds with a sound reason.
      weak: Unaware of deep-offset costs or duplicate and missing rows.
    followups:
      - How do you build a cursor when many rows share the same timestamp?
      - Do you return a total count? What does it cost?
    common_errors:
      - Cursor on a non-unique column, causing skipped rows.
      - Computing COUNT(*) on every page request.

  - external_key: backend.api_design.idempotency_payments
    competency_key: api_design
    topic: Idempotent payment requests
    difficulty: medium
    kind: scenario
    round_types: [technical_screening, deep_technical, system_design, combined]
    text: >-
      Clients of your payments API retry when a request times out, and occasionally customers get charged
      twice. How would you redesign the API to prevent duplicate charges?
    expected_concepts:
      - client-supplied idempotency keys
      - storing request fingerprint and response per key
      - atomic insert or unique constraint on the key
      - handling concurrent duplicates (in-progress state)
      - key expiry
      - downstream provider idempotency
    rubric:
      excellent: Designs idempotency keys with atomic storage, replays stored responses, handles concurrent in-flight duplicates and mismatched payloads, and propagates idempotency to the payment provider.
      good: Introduces idempotency keys stored with responses.
      weak: Relies on clients not retrying or checks for duplicates by amount and time.
    followups:
      - What if two requests with the same key arrive at the same moment?
      - What if the same key arrives with a different amount?
    common_errors:
      - Check-then-insert races instead of an atomic unique constraint.
      - Not storing the original response to replay it.

  - external_key: backend.api_design.versioning
    competency_key: api_design
    topic: API evolution and versioning
    difficulty: hard
    kind: technical
    round_types: [technical_screening, deep_technical, system_design]
    text: >-
      Your public API has hundreds of client integrations. How do you evolve it — adding fields, changing
      behaviour, deprecating endpoints — without breaking them?
    expected_concepts:
      - additive, backward-compatible changes
      - tolerant readers
      - explicit versioning (URL, header or date-based)
      - deprecation policy and sunset headers
      - usage telemetry per client
      - contract testing
    rubric:
      excellent: Distinguishes breaking from non-breaking changes, picks a versioning scheme with reasons, uses telemetry to manage deprecation and protects compatibility with contract tests.
      good: Prefers additive changes and has a versioning approach.
      weak: Changes behaviour in place and notifies clients afterwards.
    followups:
      - Is adding a new enum value a breaking change?
      - How would you know who still calls a deprecated endpoint?
    common_errors:
      - Renaming fields in place.
      - Versioning so often that clients cannot keep up.

  # -------------------------------------------------------------- databases
  - external_key: backend.databases.indexes
    competency_key: databases
    topic: How indexes work
    difficulty: easy
    kind: technical
    role_tags: [backend, data, fullstack]
    text: >-
      How does a database index speed up queries, and when can adding an index make things worse?
    expected_concepts:
      - B-tree structure and ordered lookups
      - selectivity
      - composite index column order
      - write amplification and storage cost
      - covering indexes
    rubric:
      excellent: Explains B-tree lookups, selectivity and composite ordering, and weighs read gains against write and storage costs with an example.
      good: Understands indexes speed reads and slow writes.
      weak: Thinks indexing every column is always good.
    followups:
      - Why does the column order in a composite index matter?
      - When would the planner ignore an index you created?
    common_errors:
      - Indexing low-selectivity columns alone.
      - Ignoring the cost of indexes on write-heavy tables.

  - external_key: backend.databases.slow_query
    competency_key: databases
    topic: Investigating a suddenly slow query
    difficulty: medium
    kind: scenario
    role_tags: [backend, data, fullstack]
    text: >-
      A query that used to take 20 milliseconds now takes 4 seconds, and nothing in the code changed. How would
      you investigate?
    expected_concepts:
      - EXPLAIN ANALYZE and plan comparison
      - stale statistics
      - data growth and distribution changes
      - lock contention or blocking
      - table and index bloat
      - parameter-sensitive plans
    rubric:
      excellent: Compares current and previous plans, checks statistics, data growth, locks and bloat, and explains how a plan flip can happen without code changes.
      good: Uses EXPLAIN and checks indexes and statistics.
      weak: Adds random indexes or restarts the database.
    followups:
      - How can the same query get a different plan tomorrow?
      - How would you check whether the query is waiting on a lock?
    common_errors:
      - Using EXPLAIN without ANALYZE and trusting estimates.
      - Ignoring locking and blocking sessions.

  - external_key: backend.databases.isolation_levels
    competency_key: databases
    topic: Transaction isolation levels
    difficulty: medium
    kind: technical
    role_tags: [backend, data]
    text: >-
      Explain transaction isolation levels and the anomalies each prevents. Have you ever hit a bug caused by
      the wrong isolation level?
    expected_concepts:
      - read committed, repeatable read, serializable
      - dirty reads, non-repeatable reads, phantoms
      - write skew
      - MVCC and snapshot isolation
      - SELECT FOR UPDATE and retries on serialization failures
    rubric:
      excellent: Explains levels and anomalies precisely, including write skew under snapshot isolation, and describes practical fixes such as row locks or serializable with retries.
      good: Correct levels and main anomalies.
      weak: Cannot name anomalies or assumes transactions are always serializable.
    followups:
      - Give me an example of write skew.
      - What must the application do when a serializable transaction fails?
    common_errors:
      - Assuming default isolation prevents all race conditions.
      - Not retrying serialization failures.

  - external_key: backend.databases.zero_downtime_migration
    competency_key: databases
    topic: Zero-downtime schema migration on a huge table
    difficulty: hard
    kind: scenario
    role_tags: [backend, data, devops]
    round_types: [technical_screening, deep_technical, system_design]
    text: >-
      You need to change a column type on a 500-million-row table that serves live traffic. How would you do
      it without downtime?
    expected_concepts:
      - expand and contract pattern
      - add new column, dual-write, backfill in batches
      - avoiding long locks and rewrites
      - throttling backfill and replication lag
      - verifying data before switching reads
      - removing the old column later
    rubric:
      excellent: Uses expand/contract with dual writes, batched throttled backfills, verification and a staged read switch, avoids table-rewriting DDL, and plans rollback at each step.
      good: Describes new column plus backfill without blocking writes.
      weak: Runs ALTER TABLE directly during the day.
    followups:
      - How do you keep replicas from falling behind during the backfill?
      - At which point is rollback no longer simple?
    common_errors:
      - A single ALTER that rewrites the table under an exclusive lock.
      - Backfilling in one huge transaction.

  - external_key: backend.databases.sharding
    competency_key: databases
    topic: Partitioning, sharding and replicas
    difficulty: hard
    kind: technical
    role_tags: [backend, data]
    round_types: [technical_screening, deep_technical, system_design]
    text: >-
      When would you reach for read replicas, table partitioning or sharding? If you had to shard, how would
      you choose the shard key?
    expected_concepts:
      - replicas for read scaling
      - partitioning for data management and pruning
      - sharding for write and storage scale
      - shard key cardinality and even distribution
      - hotspots and cross-shard queries
      - resharding cost
    rubric:
      excellent: Matches each technique to the bottleneck, chooses a shard key from access patterns with attention to hotspots and cross-shard queries, and acknowledges resharding pain.
      good: Distinguishes the techniques and gives reasonable shard key criteria.
      weak: Proposes sharding as the first step for any growth.
    followups:
      - What happens if one tenant is 100 times larger than the rest?
      - How would you run a report that needs data from every shard?
    common_errors:
      - Sharding by a monotonically increasing key, creating a hotspot.
      - Ignoring cross-shard transactions.

  # -------------------------------------------------------------------- sql
  - external_key: backend.sql.joins_and_having
    competency_key: sql
    topic: Joins, WHERE and HAVING
    difficulty: easy
    kind: technical
    role_tags: [backend, data, fullstack]
    text: >-
      Explain the difference between an inner join and a left join, and between WHERE and HAVING. Can you give
      me an example where mixing them up produces wrong results?
    expected_concepts:
      - inner join keeps only matches
      - left join keeps all left rows with NULLs
      - WHERE filters rows before grouping
      - HAVING filters groups after aggregation
      - filtering a left join in WHERE turns it into an inner join
    rubric:
      excellent: Gives precise definitions and the classic pitfall of filtering the right table of a left join in WHERE, with the fix of moving the condition into the ON clause.
      good: Correct definitions with a basic example.
      weak: Cannot explain NULL rows from left joins or when HAVING applies.
    followups:
      - Why does adding `WHERE orders.status = 'paid'` change a left join's results?
      - Can you use an aggregate in a WHERE clause?
    common_errors:
      - Filtering the outer table in WHERE and silently dropping unmatched rows.
      - Using HAVING for non-aggregate filters.

  - external_key: backend.sql.window_functions
    competency_key: sql
    topic: Window functions
    difficulty: medium
    kind: technical
    role_tags: [backend, data]
    text: >-
      What problems do window functions solve that GROUP BY can't? Give me an example such as ranking within
      groups or running totals.
    expected_concepts:
      - OVER with PARTITION BY and ORDER BY
      - ROW_NUMBER, RANK and DENSE_RANK differences
      - running totals with frame clauses
      - LAG and LEAD
      - keeping row-level detail alongside aggregates
    rubric:
      excellent: Explains partitions and frames, distinguishes the ranking functions with tie behaviour and writes a correct example query verbally.
      good: Correct concept with one valid example.
      weak: Confuses window functions with GROUP BY.
    followups:
      - How would you get the latest order per customer?
      - What does the default window frame do with ORDER BY?
    common_errors:
      - Using ROW_NUMBER when ties should share a rank.
      - Filtering on a window function in WHERE without a subquery.

  # ---------------------------------------------------- distributed_systems
  - external_key: backend.distributed.queues_delivery
    competency_key: distributed_systems
    topic: Message queue delivery semantics
    difficulty: medium
    kind: technical
    round_types: [technical_screening, deep_technical, system_design, combined]
    text: >-
      When you consume from a message queue, what delivery guarantees do you actually get, and how do you build
      consumers that behave correctly anyway?
    expected_concepts:
      - at-most-once versus at-least-once
      - exactly-once is mostly effectively-once via idempotency
      - idempotent consumers and de-duplication keys
      - acknowledgement after processing
      - ordering per partition or key
      - dead-letter queues and poison messages
    rubric:
      excellent: Explains why exactly-once delivery is unrealistic end to end, designs idempotent consumers with deduplication, discusses ordering guarantees and poison-message handling.
      good: At-least-once with idempotent processing and acknowledgements.
      weak: Assumes every message is delivered exactly once in order.
    followups:
      - How would you process messages for the same customer in order while scaling consumers?
      - What do you do with a message that fails every time?
    common_errors:
      - Acknowledging before processing completes.
      - Non-idempotent side effects such as sending emails twice.

  - external_key: backend.distributed.consistency_models
    competency_key: distributed_systems
    topic: Consistency, partitions and split brain
    difficulty: hard
    kind: technical
    round_types: [technical_screening, deep_technical, system_design]
    text: >-
      What does the CAP theorem actually say in practice, and how have consistency trade-offs shown up in
      systems you've built? Have you ever dealt with a split-brain situation?
    expected_concepts:
      - trade-off only matters during partitions
      - linearizability versus eventual consistency
      - quorum reads and writes
      - leader election and fencing tokens
      - split brain and its prevention
      - PACELC latency trade-off
    rubric:
      excellent: States CAP precisely, relates it to real systems, explains quorums and leader election with fencing, and describes how split brain is prevented or detected.
      good: Understands the consistency versus availability trade-off with a reasonable example.
      weak: Recites "pick two of three" without practical meaning.
    followups:
      - What is a fencing token and why is it needed?
      - Why do clusters prefer an odd number of nodes?
    common_errors:
      - Treating CAP as a permanent choice rather than partition behaviour.
      - Leader election without fencing.

  - external_key: backend.distributed.saga_outbox
    competency_key: distributed_systems
    topic: Transactions across services
    difficulty: hard
    kind: scenario
    round_types: [technical_screening, deep_technical, system_design]
    text: >-
      An order flow touches three services — orders, payments and inventory — each with its own database.
      How do you keep them consistent when one step fails halfway?
    expected_concepts:
      - saga pattern (orchestration or choreography)
      - compensating actions
      - transactional outbox for reliable events
      - idempotent handlers
      - avoiding two-phase commit across services
      - observability of in-flight sagas
    rubric:
      excellent: Designs a saga with compensations, uses the outbox to publish events atomically with state changes, makes every step idempotent and explains orchestration versus choreography trade-offs.
      good: Proposes sagas with compensations.
      weak: Assumes a distributed transaction or ignores partial failure.
    followups:
      - How do you publish an event and update your database atomically?
      - What if a compensating action also fails?
    common_errors:
      - Writing to the database and publishing the event separately without an outbox.
      - Compensations that are not idempotent.

  # ---------------------------------------------------------------- testing
  - external_key: backend.testing.levels
    competency_key: testing
    topic: Unit, integration and end-to-end tests
    difficulty: easy
    kind: technical
    role_tags: [backend, frontend, fullstack]
    text: >-
      How do you decide what to cover with unit tests, integration tests and end-to-end tests on a typical
      service?
    expected_concepts:
      - unit tests for logic in isolation
      - integration tests for real dependencies
      - end-to-end tests for critical user flows
      - test pyramid or trophy trade-offs
      - feedback speed versus realism of the test environment
    rubric:
      excellent: Allocates tests by risk and feedback speed, gives concrete examples from a real service, and explains how they keep end-to-end tests few but valuable.
      good: Clear definitions and a sensible balance.
      weak: Writes only one kind of test or cannot explain the difference.
    followups:
      - What would you never mock in an integration test?
      - How do you keep the end-to-end suite from becoming flaky?
    common_errors:
      - Mocking so much that tests only verify the mocks.
      - Relying on slow end-to-end tests for logic that unit tests could cover.

  - external_key: backend.testing.flaky_tests
    competency_key: testing
    topic: Diagnosing flaky tests
    difficulty: medium
    kind: scenario
    role_tags: [backend, frontend, fullstack, devops]
    text: >-
      About one in ten CI runs fails on a test that passes when re-run. How would you track down and fix the
      flakiness rather than just retrying?
    expected_concepts:
      - reproducing with repeated or randomised runs
      - time and timezone dependence
      - test order dependence and shared state
      - concurrency and async timing
      - external network calls
      - quarantining while fixing
    rubric:
      excellent: Reproduces systematically, investigates common causes (time, ordering, shared state, async waits, network), fixes the root cause and tracks flakiness metrics.
      good: Identifies likely causes and a way to reproduce.
      weak: Adds retries or sleeps and moves on.
    followups:
      - How would you find out whether test order matters?
      - Why are fixed sleeps a bad fix for async timing issues?
    common_errors:
      - Adding retries that hide real race conditions.
      - Tests sharing a database without isolation.

  - external_key: backend.testing.external_dependencies
    competency_key: testing
    topic: Testing code with external dependencies
    difficulty: medium
    kind: technical
    role_tags: [backend, fullstack]
    text: >-
      How do you test code that depends on a third-party payment provider or another team's API?
    expected_concepts:
      - mocks versus fakes versus stubs
      - contract tests (consumer-driven)
      - recorded responses
      - sandbox environments
      - testcontainers for owned dependencies
      - testing failure modes such as timeouts
    rubric:
      excellent: Chooses techniques per dependency, uses contract tests to catch drift, and deliberately tests timeouts, retries and error responses.
      good: Uses mocks or fakes sensibly and mentions sandbox environments.
      weak: Calls the real external service in every test run.
    followups:
      - How would you notice that the provider changed their API?
      - How do you test your retry and timeout behaviour?
    common_errors:
      - Mocks that diverge from the real API over time.
      - Testing only the happy path.
