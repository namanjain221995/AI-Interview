# Curated questions: system design (design prompts with expected discussion points).
version: 1
defaults:
  role_tags: [backend, fullstack, platform]
  round_types: [system_design, deep_technical, combined]
  kind: system_design
questions:
  - external_key: design.system_design.scaling_monolith
    competency_key: system_design
    topic: Scaling a web app from 1k to 100k users
    difficulty: easy
    role_tags: [backend, fullstack, platform, devops, general]
    round_types: [system_design, technical_screening, deep_technical, combined]
    text: >-
      Imagine a simple web application with one server and one database that's growing from a thousand to a
      hundred thousand daily users. What would you change first, and in what order?
    expected_concepts:
      - measure bottlenecks before changing things
      - stateless app servers behind a load balancer
      - database indexing and connection pooling
      - caching hot reads
      - CDN for static assets
      - read replicas and background jobs
    rubric:
      excellent: Prioritises by measured bottlenecks, scales the stateless tier horizontally, protects the database with indexes, pooling, caching and replicas, and moves slow work to background jobs.
      good: Reasonable sequence including load balancing, caching and database improvements.
      weak: Jumps to microservices or sharding immediately.
    followups:
      - Where does user session data live once you have several app servers?
      - What would you monitor to know when the next bottleneck appears?
    common_errors:
      - Splitting into microservices before addressing simple bottlenecks.
      - Keeping sessions in local memory on each server.

  - external_key: design.system_design.url_shortener
    competency_key: system_design
    topic: URL shortener
    difficulty: easy
    text: >-
      Let's design a URL shortener like a link-sharing service. Start with the requirements you'd clarify, then
      sketch the main components and data model.
    expected_concepts:
      - read-heavy traffic profile
      - short code generation (counter with base62, random with collision checks)
      - key-value storage for code to URL
      - caching popular links
      - redirect status codes (301 versus 302)
      - analytics as an asynchronous pipeline
    rubric:
      excellent: Clarifies scale and features, estimates read/write ratio, compares code-generation strategies, designs storage and caching for fast redirects and keeps analytics off the hot path.
      good: Working design with code generation, storage and caching.
      weak: No clarification of requirements and no thought about collisions or read volume.
    followups:
      - How would you prevent two users from getting the same short code?
      - Why might you choose a 302 redirect instead of a 301?
    common_errors:
      - Generating codes with a hash and ignoring collisions.
      - Writing click analytics synchronously on every redirect.

  - external_key: design.system_design.caching_strategy
    competency_key: system_design
    topic: Caching strategies and invalidation
    difficulty: easy
    round_types: [system_design, technical_screening, deep_technical, combined]
    text: >-
      When you add a cache in front of a database, how do you decide on the caching pattern, and how do you keep
      cached data from going stale?
    expected_concepts:
      - cache-aside, write-through and write-behind
      - TTLs and explicit invalidation
      - cache stampede protection
      - consistency trade-offs
      - eviction policies
    rubric:
      excellent: Compares patterns with consistency trade-offs, designs invalidation and TTLs, handles stampedes (request coalescing, jittered TTLs) and states what staleness is acceptable.
      good: Explains cache-aside with TTLs and invalidation.
      weak: Adds a cache without considering staleness.
    followups:
      - What happens when a hot key expires under heavy load?
      - How would you invalidate a cached user profile after an update?
    common_errors:
      - Caching without any invalidation strategy.
      - Identical TTLs that expire many keys at once.

  - external_key: design.system_design.rate_limiter
    competency_key: system_design
    topic: Distributed rate limiter
    difficulty: medium
    text: >-
      Design a rate limiter for a public API that allows each customer a certain number of requests per minute,
      across a fleet of API servers.
    expected_concepts:
      - token bucket, sliding window or fixed window algorithms
      - shared counter store (for example Redis) with atomic operations
      - per-key limits and tiers
      - response headers and 429 status
      - failure mode if the store is unavailable
      - local caching to reduce latency
    rubric:
      excellent: Compares algorithms, implements atomic distributed counting, discusses latency and accuracy trade-offs, defines fail-open versus fail-closed behaviour and communicates limits to clients.
      good: Token bucket or sliding window with a shared store.
      weak: Per-server in-memory counters without acknowledging inaccuracy.
    followups:
      - Should the API fail open or closed if the rate-limit store is down?
      - How do you handle bursts while keeping the average limit?
    common_errors:
      - Non-atomic read-then-write counter updates.
      - Fixed windows that allow double bursts at the boundary without noting it.

  - external_key: design.system_design.notifications
    competency_key: system_design
    topic: Notification service
    difficulty: medium
    text: >-
      Design a notification service that sends email, SMS and push notifications for many internal teams, with
      user preferences and retries.
    expected_concepts:
      - API to accept notification requests
      - queue between intake and delivery
      - per-channel workers and providers
      - user preferences and quiet hours
      - retries with backoff and idempotency
      - rate limiting per provider and per user
      - delivery tracking
    rubric:
      excellent: Decouples intake from delivery with queues, handles preferences, idempotent retries, provider failover and rate limits, and tracks delivery status.
      good: Queue-based design with retries and preferences.
      weak: Synchronous sending from the caller's request path.
    followups:
      - How do you avoid sending the same notification twice after a retry?
      - What happens when the SMS provider is down for an hour?
    common_errors:
      - No idempotency, causing duplicate messages.
      - Ignoring user preferences and unsubscribe handling.

  - external_key: design.system_design.job_scheduler
    competency_key: system_design
    topic: Background job system
    difficulty: medium
    role_tags: [backend, platform, devops]
    text: >-
      Design a background job system that teams can use to run tasks asynchronously, with retries, scheduling
      and visibility into failures.
    expected_concepts:
      - durable queue or stream
      - workers with leases or visibility timeouts
      - at-least-once execution and idempotent handlers
      - retries with exponential backoff
      - dead-letter handling
      - scheduled and recurring jobs
      - metrics and dashboards
    rubric:
      excellent: Designs durable queuing with leases, idempotent at-least-once execution, backoff, dead letters, scheduling and observability, and covers worker crashes mid-job.
      good: Queue, workers and retries with some failure handling.
      weak: In-process threads with no durability.
    followups:
      - What happens if a worker crashes halfway through a job?
      - How do you prevent a poison job from blocking the queue?
    common_errors:
      - Jobs lost when a worker restarts.
      - Infinite retries with no dead-letter path.

  - external_key: design.system_design.large_file_upload
    competency_key: system_design
    topic: Large file upload service
    difficulty: medium
    text: >-
      Design a service where users upload files of up to several gigabytes, which must be scanned and then made
      available for download to authorised users.
    expected_concepts:
      - chunked, resumable uploads
      - storage abstraction behind an internal API
      - integrity checks (checksums)
      - asynchronous malware scanning before availability
      - authorisation and short-lived download links
      - metadata database and lifecycle or retention rules
    rubric:
      excellent: Designs resumable chunked uploads with checksums, asynchronous scanning with quarantine, authorised short-lived download links, and retention policies, with clear storage abstraction.
      good: Chunked uploads, scanning and access control.
      weak: Single huge POST through the application server with no scanning.
    followups:
      - How does a client resume an upload after a network failure?
      - How do you stop users from downloading a file before it has been scanned?
    common_errors:
      - Streaming huge files through application memory.
      - Making files downloadable before scanning completes.

  - external_key: design.system_design.chat
    competency_key: system_design
    topic: Real-time chat
    difficulty: hard
    text: >-
      Design a real-time chat system supporting one-to-one and group conversations for millions of users,
      including message history and online presence.
    expected_concepts:
      - persistent connections (WebSockets) and connection gateways
      - message routing between gateway nodes
      - message ordering per conversation
      - storage partitioned by conversation
      - delivery and read receipts
      - presence with heartbeats and TTLs
      - offline delivery via push notifications
    rubric:
      excellent: Designs gateways and routing, per-conversation ordering and storage, receipts, presence at scale and offline delivery, with capacity estimates and failure handling for gateway restarts.
      good: Coherent WebSocket-based design with storage and routing.
      weak: Polling a database every second.
    followups:
      - How do you route a message to a user connected to a different gateway node?
      - How would you handle a group with 50,000 members?
    common_errors:
      - Global ordering requirements that do not scale.
      - Presence updates broadcast to everyone on every change.

  - external_key: design.system_design.metrics_platform
    competency_key: system_design
    topic: Metrics and monitoring platform
    difficulty: hard
    role_tags: [backend, platform, sre, devops]
    text: >-
      Design a metrics platform that ingests time-series data from 50,000 servers and lets engineers query
      dashboards and alerts in near real time.
    expected_concepts:
      - push versus pull collection
      - ingestion pipeline with buffering
      - time-series storage and compression
      - downsampling and retention tiers
      - cardinality limits
      - query layer and alert evaluation
    rubric:
      excellent: Estimates ingest volume, designs buffered ingestion, compressed time-series storage with downsampling and retention, enforces cardinality limits, and separates alert evaluation from ad-hoc queries.
      good: Sensible pipeline with storage and retention.
      weak: Stores every data point in a relational table forever.
    followups:
      - What happens when someone adds a label containing user ids?
      - How do you keep alerts working when the query layer is overloaded?
    common_errors:
      - Ignoring cardinality explosion.
      - No retention or downsampling plan.

  - external_key: design.system_design.cicd_platform
    competency_key: system_design
    topic: CI/CD platform for a large engineering org
    difficulty: hard
    role_tags: [platform, devops, sre]
    text: >-
      Design the CI/CD platform for an organisation of 500 engineers and 300 repositories. Builds must be fast,
      isolated and secure.
    expected_concepts:
      - autoscaled ephemeral runners
      - isolation between jobs and tenants
      - remote build and dependency caches
      - artifact storage and promotion
      - secrets via short-lived credentials
      - queueing, fairness and cost controls
      - observability of pipeline performance
    rubric:
      excellent: Designs autoscaling ephemeral runners with strong isolation, shared caches, secure credentials, artifact promotion, fair scheduling and metrics on queue time and build duration.
      good: Autoscaled runners, caching and artifact handling.
      weak: A few shared long-lived build servers.
    followups:
      - How do you stop one team's pipeline from starving others?
      - How do you keep caches from leaking data between projects?
    common_errors:
      - Long-lived shared runners that accumulate state and secrets.
      - No visibility into queue times.

  - external_key: design.system_design.multi_region_active_active
    competency_key: distributed_systems
    topic: Multi-region active-active service
    difficulty: hard
    text: >-
      Your service must stay available even if an entire region fails, and users worldwide want low latency.
      How would you design an active-active, multi-region deployment, especially the data layer?
    expected_concepts:
      - global traffic routing (latency or geo DNS, anycast)
      - data replication strategies
      - conflict resolution (last writer wins, CRDTs, home region per entity)
      - consistency expectations per data type
      - failover and capacity in surviving regions
      - testing regional failure
    rubric:
      excellent: Chooses data strategies per entity (home-region ownership, CRDTs or strong consistency where required), explains conflict handling, routing and failover capacity, and plans regular failure drills.
      good: Understands replication and conflict challenges with a plausible approach.
      weak: Assumes the database will simply replicate everywhere with strong consistency and low latency.
    followups:
      - Two users edit the same record in different regions at once — what happens?
      - Which data must be strongly consistent, and how does that affect latency?
    common_errors:
      - Ignoring write conflicts.
      - Surviving regions without capacity to absorb failed-over traffic.

  - external_key: design.system_design.feature_flags
    competency_key: system_design
    topic: Feature flag service
    difficulty: hard
    text: >-
      Design a feature flag service that hundreds of services query on every request. Evaluation must be fast,
      changes should propagate within seconds, and a flag-service outage must not take production down.
    expected_concepts:
      - local evaluation in SDKs with cached rules
      - streaming or polling updates
      - safe defaults when the service is unreachable
      - targeting rules and percentage rollouts with consistent hashing
      - audit log and permissions
      - kill switches
    rubric:
      excellent: Evaluates locally from cached rule sets, propagates changes via streaming with polling fallback, defines safe defaults, uses consistent hashing for rollouts and adds auditing and access control.
      good: SDK caching with update propagation and defaults.
      weak: A remote call to the flag service on every request.
    followups:
      - How do you make sure a user stays in the same rollout bucket?
      - What happens to running services if the flag service is down for an hour?
    common_errors:
      - Synchronous remote evaluation on the request path.
      - No defaults when flag data is unavailable.

  - external_key: design.system_design.autocomplete
    competency_key: system_design
    topic: Search autocomplete
    difficulty: hard
    text: >-
      Design the autocomplete feature for a search box that serves suggestions as users type, for tens of
      thousands of queries per second.
    expected_concepts:
      - latency budget per keystroke
      - prefix index (trie or sorted prefix tables)
      - ranking by popularity and freshness
      - offline aggregation pipeline for suggestions
      - caching popular prefixes at the edge
      - client-side debouncing
      - filtering inappropriate suggestions
    rubric:
      excellent: Sets a latency budget, designs a prefix index fed by an offline ranking pipeline, caches popular prefixes, debounces on the client and handles freshness and content filtering.
      good: Trie or prefix index with ranking and caching.
      weak: Runs a LIKE query on the main database per keystroke.
    followups:
      - How do you surface a trending query within minutes?
      - How do you personalise suggestions without hurting latency?
    common_errors:
      - Database prefix scans on every keystroke.
      - No plan for filtering offensive suggestions.

  - external_key: design.distributed_systems.event_pipeline
    competency_key: distributed_systems
    topic: Event processing pipeline with exactly-once effects
    difficulty: medium
    text: >-
      You're building a pipeline that consumes order events and updates account balances. Events can be
      duplicated or arrive out of order. How do you make the balances correct?
    expected_concepts:
      - idempotency keys per event
      - deduplication store or unique constraints
      - ordering per account (partitioning by key)
      - transactional updates of state and processed-event records
      - handling late or out-of-order events
      - reconciliation jobs
    rubric:
      excellent: Partitions by account for ordering, records processed event ids atomically with balance updates, handles late events explicitly and adds reconciliation as a safety net.
      good: Idempotent processing with deduplication and keyed partitioning.
      weak: Assumes the broker guarantees exactly-once delivery in order.
    followups:
      - How do you record that an event was processed in the same transaction as the update?
      - What would a reconciliation job check?
    common_errors:
      - Deduplicating in memory only, losing state on restart.
      - Parallel consumers updating the same account out of order.
