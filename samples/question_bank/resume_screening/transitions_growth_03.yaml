# Curated questions: resume screening, transitions_growth. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.transitions_growth.what_you_want_to_build_next
  competency_key: motivation
  topic: Professional direction
  difficulty: easy
  text: Looking at where your work has taken you so far, what kind of work do you want to do more of next?
  expected_concepts:
  - clear professional direction
  - link to past work
  - specifics
  - realism
  rubric:
    excellent: "Describes a specific direction grounded in their experience and explains what kind of\
      \ problems they want to work on."
    good: Describes a direction in general terms.
    weak: Has no direction or only generic statements.
  followups:
  - What in your past work points that way?
  - What would you do less of?
  common_errors:
  - Describing a direction unrelated to anything in their experience.

- external_key: resume_screening.transitions_growth.drawn_to_this_role
  competency_key: motivation
  topic: Attraction to the role
  difficulty: easy
  text: What about this role connects to the direction your work has been heading?
  expected_concepts:
  - reading the role
  - connecting to experience
  - specifics
  - growth they expect
  rubric:
    excellent: Connects specific parts of the role to their experience and goals with examples.
    good: Connects the role to their experience generally.
    weak: Gives a generic reply that would apply to any job.
  followups:
  - Which responsibility interests you most?
  - What do you expect to learn?
  common_errors:
  - 'Falling into the weak pattern: gives a generic reply that would apply to any job.'

- external_key: resume_screening.transitions_growth.strengths_developed_over_roles
  competency_key: communication
  topic: Strengths from experience
  difficulty: easy
  text: Which strengths have you built across your roles, and what are examples that show them?
  expected_concepts:
  - specific strengths
  - examples
  - relation to the role
  - evidence
  rubric:
    excellent: Names strengths with concrete examples and links them to the role.
    good: Names strengths with limited examples.
    weak: Lists adjectives without evidence.
  followups:
  - Which one would colleagues name first?
  - Which one grew most?
  common_errors:
  - 'Falling into the weak pattern: lists adjectives without evidence.'

- external_key: resume_screening.transitions_growth.areas_to_grow
  competency_key: adaptability
  topic: Development areas
  difficulty: easy
  text: What is one area you are working to develop professionally, and what have you done about it so
    far?
  expected_concepts:
  - specific area
  - actions
  - progress
  - support
  rubric:
    excellent: Names a specific area, actions taken and visible progress, with where support comes from.
    good: Names an area with general steps.
    weak: Cannot name an area.
  followups:
  - What progress have you seen?
  - What help would you want?
  common_errors:
  - 'Falling into the weak pattern: cannot name an area.'

- external_key: resume_screening.transitions_growth.long_term_goal_alignment
  competency_key: motivation
  topic: Longer-term professional goals
  difficulty: medium
  text: Where would you like to be professionally in a few years, and how would this role help?
  expected_concepts:
  - specific goals
  - realistic steps
  - link to the role
  - flexibility
  rubric:
    excellent: "Describes concrete professional goals, the skills or experiences needed and how this role\
      \ contributes."
    good: Describes general goals.
    weak: Has no goals or goals unrelated to the role.
  followups:
  - What skill matters most for that?
  - What would you need to achieve here?
  common_errors:
  - 'Falling into the weak pattern: has no goals or goals unrelated to the role.'

- external_key: resume_screening.transitions_growth.specialist_or_generalist
  competency_key: motivation
  topic: Depth or breadth ahead
  difficulty: medium
  text: "Do you see your next steps going deeper into a specialty or broader across areas, and what in\
    \ your experience suggests that?"
  expected_concepts:
  - preference with reasons
  - evidence from experience
  - trade-offs
  - plan
  rubric:
    excellent: States a preference with reasons grounded in experience and acknowledges trade-offs.
    good: States a preference with general reasons.
    weak: Has no view.
  followups:
  - What would you give up?
  - Which choice fits this role?
  common_errors:
  - 'Falling into the weak pattern: has no view.'

- external_key: resume_screening.transitions_growth.types_of_problems_you_enjoy
  competency_key: motivation
  topic: Work that engages you
  difficulty: easy
  text: What types of problems at work do you find most engaging, and what experience shows that?
  expected_concepts:
  - types of problems
  - examples
  - relation to the role
  - learning
  rubric:
    excellent: Describes types of problems with examples of how they sought them out and ties them to
      the role.
    good: Describes types of problems in general.
    weak: Cannot describe any.
  followups:
  - When did you last find yourself absorbed in such a problem?
  - What do you prefer to avoid?
  common_errors:
  - 'Falling into the weak pattern: cannot describe any.'

- external_key: resume_screening.transitions_growth.environment_where_you_do_best
  competency_key: collaboration
  topic: Working conditions that help you deliver
  difficulty: medium
  text: "Describe the working setup, such as team structure, level of guidance and pace, in which you\
    \ deliver your best work."
  expected_concepts:
  - concrete conditions
  - examples
  - flexibility
  - fit to the role
  rubric:
    excellent: Describes concrete working conditions with examples and shows flexibility for others.
    good: Describes general preferences.
    weak: Describes conditions that only suit one kind of setup without flexibility.
  followups:
  - How do you adapt when it is different?
  - What did you ask your manager for?
  common_errors:
  - "Falling into the weak pattern: describes conditions that only suit one kind of setup without flexibility."

- external_key: resume_screening.transitions_growth.learning_goals_for_year
  competency_key: adaptability
  topic: Learning plans
  difficulty: easy
  text: What do you plan to learn in the coming months, and how does it connect to your career so far?
  expected_concepts:
  - concrete learning goals
  - method
  - connection
  - measurable outcomes
  rubric:
    excellent: Names specific learning goals, how they will pursue them and what they should produce.
    good: Names general goals.
    weak: Has no plan.
  followups:
  - How will you know you have learned it?
  - What have you started?
  common_errors:
  - 'Falling into the weak pattern: has no plan.'

- external_key: resume_screening.transitions_growth.role_models_and_examples
  competency_key: mentoring
  topic: Role models
  difficulty: medium
  text: Whose professional path or way of working do you admire, and what would you take from it?
  expected_concepts:
  - specific person or example
  - qualities
  - application
  - self-awareness
  rubric:
    excellent: Names an example, the specific practices admired and how they apply them.
    good: Names an example with general qualities.
    weak: Cannot name one.
  followups:
  - What have you already adopted?
  - What would you not copy?
  common_errors:
  - 'Falling into the weak pattern: cannot name one.'

- external_key: resume_screening.transitions_growth.management_or_specialist_track
  competency_key: leadership
  topic: Career path choice
  difficulty: medium
  text: "How do you think about choosing between a path of leading people and a path of deepening technical\
    \ or specialist skill?"
  expected_concepts:
  - understanding both paths
  - evidence from experience
  - criteria
  - openness
  rubric:
    excellent: Describes both paths, uses experience to explain a leaning and states what would change
      their mind.
    good: Explains a leaning with general reasons.
    weak: Has not considered it.
  followups:
  - What have you tried of each?
  - What would tell you it is time to change?
  common_errors:
  - 'Falling into the weak pattern: has not considered it.'

- external_key: resume_screening.transitions_growth.impact_you_want_to_have
  competency_key: motivation
  topic: Desired contribution
  difficulty: medium
  text: "What kind of impact do you want your work to have, and what from your past work shows you can\
    \ deliver it?"
  expected_concepts:
  - type of impact
  - evidence
  - realism
  - link to the role
  rubric:
    excellent: Describes a desired impact, evidence from past work and how this role provides the chance.
    good: Describes the impact in general terms.
    weak: Cannot describe the impact they seek.
  followups:
  - What example shows that?
  - How would you measure it?
  common_errors:
  - 'Falling into the weak pattern: cannot describe the impact they seek.'

- external_key: resume_screening.transitions_growth.mentoring_others_as_next_step
  competency_key: mentoring
  topic: Growing others
  difficulty: medium
  text: "How much do you want to help others grow in your next role, and what experience do you have doing\
    \ so?"
  expected_concepts:
  - appetite
  - past examples
  - approach
  - limits
  rubric:
    excellent: States their appetite clearly, gives examples of helping others and describes their approach.
    good: Has helped others occasionally.
    weak: Has no interest or experience.
  followups:
  - What worked when you mentored?
  - What did you struggle with?
  common_errors:
  - 'Falling into the weak pattern: has no interest or experience.'

- external_key: resume_screening.transitions_growth.evaluating_opportunities
  competency_key: problem_solving
  topic: How you assess opportunities
  difficulty: medium
  text: What do you look at when deciding whether a role will help you grow professionally?
  expected_concepts:
  - criteria such as scope, learning and team
  - research
  - questions asked
  - weighing
  rubric:
    excellent: Lists clear criteria with an example of how they applied them and what they asked to find
      out.
    good: Lists some criteria.
    weak: Relies on title or pay alone.
  followups:
  - What question do you always ask?
  - What would be a red flag?
  common_errors:
  - 'Falling into the weak pattern: relies on title or pay alone.'

- external_key: resume_screening.transitions_growth.feedback_you_seek
  competency_key: adaptability
  topic: Seeking input
  difficulty: easy
  text: What kind of feedback do you actively seek in a new role and from whom?
  expected_concepts:
  - sources of feedback
  - questions asked
  - frequency
  - acting on it
  rubric:
    excellent: Describes seeking feedback from specific people with specific questions and acting on the
      answers.
    good: Welcomes feedback when given.
    weak: Does not seek feedback.
  followups:
  - What did you change last time?
  - Who gives the most useful feedback?
  common_errors:
  - 'Falling into the weak pattern: does not seek feedback.'

- external_key: resume_screening.transitions_growth.skills_you_want_to_use_more
  competency_key: motivation
  topic: Skills to use more
  difficulty: easy
  text: Which of your skills do you feel are underused at the moment, and how would you like to use them?
  expected_concepts:
  - skills identified
  - examples
  - how to use them
  - link to the role
  rubric:
    excellent: Names specific skills, shows prior use and describes how this role would use them.
    good: Names skills with general ideas.
    weak: Cannot name any.
  followups:
  - Where did you use them best?
  - What would you do first?
  common_errors:
  - 'Falling into the weak pattern: cannot name any.'

- external_key: resume_screening.transitions_growth.balancing_learning_and_delivering
  competency_key: project_management
  topic: Learning while delivering
  difficulty: medium
  text: When a role requires both learning new things and delivering results, how do you balance the two?
  expected_concepts:
  - prioritising
  - time boundaries
  - asking for help
  - communicating
  rubric:
    excellent: "Describes a deliberate balance with time boundaries, early deliverables and communication\
      \ of progress."
    good: Balances in practice with some planning.
    weak: Focuses on only one.
  followups:
  - How do you protect learning time?
  - How do you tell your manager?
  common_errors:
  - 'Falling into the weak pattern: focuses on only one.'

- external_key: resume_screening.transitions_growth.proudest_professional_growth
  competency_key: motivation
  topic: Greatest development
  difficulty: easy
  text: What is the professional change you are proudest of in your own development?
  expected_concepts:
  - specific change
  - actions
  - evidence
  - ongoing effect
  rubric:
    excellent: Names a concrete change, the actions that produced it and visible effects since.
    good: Names a change with general actions.
    weak: Cannot name one.
  followups:
  - Who noticed?
  - What is next?
  common_errors:
  - 'Falling into the weak pattern: cannot name one.'

- external_key: resume_screening.transitions_growth.how_you_pick_projects
  competency_key: problem_solving
  topic: Choosing work
  difficulty: medium
  text: When you can choose among projects, how do you decide which to take on?
  expected_concepts:
  - criteria such as impact and learning
  - consulting others
  - trade-offs
  - follow-through
  rubric:
    excellent: Describes clear criteria, uses consultation and weighs trade-offs with an example.
    good: Chooses on interest and importance.
    weak: Chooses on convenience.
  followups:
  - What did you decline?
  - How did you explain it?
  common_errors:
  - 'Falling into the weak pattern: chooses on convenience.'

- external_key: resume_screening.transitions_growth.sharing_your_growth_with_team
  competency_key: collaboration
  topic: Helping the team learn
  difficulty: medium
  text: How do you pass what you learn in your roles to the people around you?
  expected_concepts:
  - documentation
  - talks
  - pairing
  - feedback
  rubric:
    excellent: Describes concrete practices and examples of the team benefiting.
    good: Shares when asked.
    weak: Keeps knowledge to themselves.
  followups:
  - What was the most useful thing you shared?
  - How did people respond?
  common_errors:
  - 'Falling into the weak pattern: keeps knowledge to themselves.'

- external_key: resume_screening.transitions_growth.expectations_for_manager
  competency_key: stakeholder_management
  topic: Working with a manager
  difficulty: medium
  text: "What do you look for from a manager to support your professional growth, and what do you offer\
    \ in return?"
  expected_concepts:
  - clear expectations
  - two-way relationship
  - examples
  - flexibility
  rubric:
    excellent: Describes specific needs, such as goals and feedback, and what they contribute to the relationship.
    good: Describes some expectations.
    weak: Expects the manager to do all the work.
  followups:
  - What has worked best?
  - What did you do when it did not work?
  common_errors:
  - 'Falling into the weak pattern: expects the manager to do all the work.'

- external_key: resume_screening.transitions_growth.fit_between_experience_and_stage
  competency_key: motivation
  topic: Scale and stage
  difficulty: medium
  text: What size or stage of team and product have you found you contribute to most effectively, and
    why?
  expected_concepts:
  - evidence
  - reasons
  - flexibility
  - examples
  rubric:
    excellent: Describes the setting with evidence from experience and shows adaptability beyond it.
    good: States a preference with some reasons.
    weak: Cannot describe.
  followups:
  - What did you contribute there?
  - How would you adapt to a different one?
  common_errors:
  - 'Falling into the weak pattern: cannot describe.'

- external_key: resume_screening.transitions_growth.asked_to_do_something_new_here
  competency_key: adaptability
  topic: Openness to new responsibilities
  difficulty: medium
  text: If this role asked you to take on something outside your usual areas, how would you approach it?
  expected_concepts:
  - willingness
  - learning plan
  - seeking support
  - delivering early
  rubric:
    excellent: Describes a clear plan, drawing on a past example of a similar situation.
    good: Would try and ask for help.
    weak: Would decline or avoid it.
  followups:
  - Give an example of doing this before.
  - What support would you want?
  common_errors:
  - 'Falling into the weak pattern: would decline or avoid it.'

- external_key: resume_screening.transitions_growth.turning_point_in_work
  competency_key: motivation
  topic: Professional turning point
  difficulty: medium
  text: "Was there a project or assignment that changed how you think about your work? What happened and\
    \ what changed?"
  expected_concepts:
  - the event
  - the insight
  - changes made
  - lasting effect
  rubric:
    excellent: Describes a specific project, the insight they drew and visible changes in how they work
      afterwards.
    good: Describes a project and a general lesson.
    weak: Cannot name any such moment.
  followups:
  - What did you start doing differently?
  - Who else was affected?
  common_errors:
  - 'Falling into the weak pattern: cannot name any such moment.'

- external_key: resume_screening.transitions_growth.how_you_measure_own_progress
  competency_key: ownership
  topic: Tracking own development
  difficulty: medium
  text: "Pick two entries on your resume and compare them. What concrete evidence shows you were operating\
    \ at a higher level in the later one?"
  expected_concepts:
  - indicators such as scope, feedback and skills
  - periodic review
  - evidence
  - adjusting goals
  rubric:
    excellent: Names concrete indicators, describes a regular review and shows adjustments made.
    good: Looks at feedback and tasks.
    weak: Does not track progress.
  followups:
  - What indicator do you trust most?
  - What did you adjust after a review?
  common_errors:
  - 'Falling into the weak pattern: does not track progress.'
