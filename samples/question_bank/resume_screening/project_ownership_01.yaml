# Curated questions: resume screening, project_ownership. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.project_ownership.project_in_one_minute
  competency_key: communication
  topic: Project summary
  difficulty: easy
  text: "Pick the project on your resume you are proudest of and give me the problem, your role and the\
    \ outcome in about a minute."
  expected_concepts:
  - clear problem statement
  - specific role
  - outcome with evidence
  - sensible scope for the time given
  rubric:
    excellent: "Summarises the problem, their exact role and a verifiable outcome concisely and invites\
      \ follow-up on details."
    good: Covers the problem, role and outcome but with some missing detail or rambling.
    weak: Describes technologies or activities without a clear problem, role or result.
  followups:
  - Who was the project for?
  - What would you add if you had another minute?
  common_errors:
  - Listing technologies instead of explaining the problem solved.

- external_key: resume_screening.project_ownership.your_title_versus_your_work
  competency_key: ownership
  topic: Title versus daily work
  difficulty: easy
  text: Your job title says one thing. What did you actually spend most of your time doing on that project?
  expected_concepts:
  - description of real tasks
  - proportion of time
  - differences from the title
  - evidence from outputs
  rubric:
    excellent: "Describes the real activities and proportions, points out where the title understates\
      \ or differs from the work and gives outputs as evidence."
    good: Describes main tasks generally and aligns them with the title.
    weak: Repeats the title or job description without concrete tasks.
  followups:
  - What took more time than you expected?
  - Which task did only you do?
  common_errors:
  - 'Falling into the weak pattern: repeats the title or job description without concrete tasks.'

- external_key: resume_screening.project_ownership.team_size_and_roles
  competency_key: collaboration
  topic: Team shape
  difficulty: easy
  text: Who was on the team for that project, what did each person do, and where did you fit in?
  expected_concepts:
  - team size and roles
  - interfaces between roles
  - own position
  - reporting lines
  rubric:
    excellent: "Describes team composition and each role's contribution clearly, with their own position\
      \ and how they worked with each role."
    good: Gives team size and a rough breakdown.
    weak: Cannot describe the team structure.
  followups:
  - Who did you work with most?
  - Who was missing from the team?
  common_errors:
  - 'Falling into the weak pattern: cannot describe the team structure.'

- external_key: resume_screening.project_ownership.how_project_started
  competency_key: ownership
  topic: Origins of the project
  difficulty: easy
  text: How did the project start? Who identified the need and how did it reach you?
  expected_concepts:
  - origin of the request
  - problem validation
  - initial scoping
  - who sponsored it
  rubric:
    excellent: "Describes the origin, how the need was validated, how the scope was agreed and their involvement\
      \ from the start."
    good: Describes the origin and own entry point.
    weak: Joined later and has no knowledge of why it began.
  followups:
  - What was the first thing you did?
  - Who was the sponsor?
  common_errors:
  - 'Falling into the weak pattern: joined later and has no knowledge of why it began.'

- external_key: resume_screening.project_ownership.who_decided_what
  competency_key: ownership
  topic: Decision rights
  difficulty: medium
  text: On that project, which decisions were yours alone, which were shared, and which were someone else's?
  expected_concepts:
  - clarity on decision rights
  - examples in each category
  - escalation
  - agreeing boundaries
  rubric:
    excellent: "Gives specific examples in each category and explains how those boundaries were set and\
      \ where they were tested."
    good: Describes some decisions and a general sense of authority.
    weak: Cannot distinguish their decisions from the team's.
  followups:
  - What decision did you have to escalate?
  - When did you overrule someone?
  common_errors:
  - 'Falling into the weak pattern: cannot distinguish their decisions from the team''s.'

- external_key: resume_screening.project_ownership.reporting_line_stakeholders
  competency_key: stakeholder_management
  topic: Stakeholders on the project
  difficulty: easy
  text: Who were the main stakeholders for the project and how did you stay in touch with them?
  expected_concepts:
  - identifying stakeholders
  - their interests
  - communication channels
  - handling conflicting needs
  rubric:
    excellent: "Names stakeholder groups with their interests, how updates were shared and an example\
      \ of balancing competing needs."
    good: Names the main stakeholders and a general routine.
    weak: Cannot identify who the project served.
  followups:
  - Whose needs were hardest to meet?
  - How often did you update them?
  common_errors:
  - 'Falling into the weak pattern: cannot identify who the project served.'

- external_key: resume_screening.project_ownership.scope_you_were_responsible_for
  competency_key: ownership
  topic: Defined area of responsibility
  difficulty: medium
  text: "What was the boundary of your responsibility, such as a component, a workstream or a deliverable,\
    \ and who owned the rest?"
  expected_concepts:
  - defined scope
  - neighbouring owners
  - interfaces
  - outcomes for the owned part
  rubric:
    excellent: "Defines their area clearly, names neighbouring owners and interfaces and describes outcomes\
      \ they were accountable for."
    good: Describes their area with fuzzy edges.
    weak: Describes the whole project as theirs or cannot say.
  followups:
  - What happened at the boundaries?
  - What would have been missed if you had not owned it?
  common_errors:
  - 'Falling into the weak pattern: describes the whole project as theirs or cannot say.'

- external_key: resume_screening.project_ownership.hands_on_vs_directing
  competency_key: leadership
  topic: Hands on or directing
  difficulty: medium
  text: "How much of the work did you do with your own hands and how much did you direct or coordinate\
    \ for others?"
  expected_concepts:
  - split between doing and directing
  - examples of each
  - effect on the project
  - consistent with title
  rubric:
    excellent: "Gives a specific ratio with examples, explains why the split suited the project and how\
      \ it changed over time."
    good: Describes a mix with limited detail.
    weak: Claims both fully hands-on and fully leading without explanation.
  followups:
  - Which work did you hand off?
  - What did you stop doing as the project grew?
  common_errors:
  - Claiming both full technical authorship and full team leadership without reconciling them.

- external_key: resume_screening.project_ownership.size_of_the_project
  competency_key: project_management
  topic: Project scale
  difficulty: easy
  text: How big was the project in terms of people, time and budget or users, and how did you know?
  expected_concepts:
  - team size
  - duration
  - budget or user numbers
  - reliable source
  rubric:
    excellent: Gives concrete scale figures from a reliable source and relates them to the complexity
      of the work.
    good: Gives approximate scale.
    weak: Cannot give any scale indication.
  followups:
  - How did the scale change over time?
  - What was the hardest part of that size?
  common_errors:
  - 'Falling into the weak pattern: cannot give any scale indication.'

- external_key: resume_screening.project_ownership.what_success_meant
  competency_key: project_management
  topic: Definition of success
  difficulty: medium
  text: How was success defined for that project at the start and did it stay the same?
  expected_concepts:
  - initial success criteria
  - changes in criteria
  - stakeholder agreement
  - measuring
  rubric:
    excellent: "States the success criteria, how they were agreed, how they changed and how success was\
      \ measured at the end."
    good: States the criteria and whether they were met.
    weak: Had no clear success definition.
  followups:
  - Who agreed the criteria?
  - Which criterion was dropped?
  common_errors:
  - 'Falling into the weak pattern: had no clear success definition.'

- external_key: resume_screening.project_ownership.your_first_week_on_it
  competency_key: adaptability
  topic: Starting the work
  difficulty: easy
  text: "When you started on that project, what were the first steps you took to understand it and begin\
    \ contributing?"
  expected_concepts:
  - orientation
  - reading existing material
  - talking to people
  - quick first deliverable
  rubric:
    excellent: "Describes a deliberate onboarding approach, who they talked to and an early deliverable\
      \ that built trust."
    good: Describes reasonable steps with limited planning.
    weak: Waited for instructions or cannot recall.
  followups:
  - What was confusing at first?
  - Who helped you most?
  common_errors:
  - 'Falling into the weak pattern: waited for instructions or cannot recall.'

- external_key: resume_screening.project_ownership.technologies_chosen_by_whom
  competency_key: system_design
  topic: Who chose the approach
  difficulty: medium
  text: "Think about the main direction the project took. Who settled it, and how much of that decision\
    \ was yours?"
  expected_concepts:
  - ownership of the choice
  - criteria
  - alternatives
  - involvement of the team
  rubric:
    excellent: "Says who decided, shows their input with reasoning and alternatives considered, and states\
      \ how they would defend it."
    good: Participated in the choice and knows the reasons.
    weak: Cannot explain the reasons for the choice.
  followups:
  - What alternative was considered?
  - Would you choose it again?
  common_errors:
  - 'Falling into the weak pattern: cannot explain the reasons for the choice.'

- external_key: resume_screening.project_ownership.requirements_source
  competency_key: requirements_analysis
  topic: Where requirements came from
  difficulty: medium
  text: "Where did the requirements for that project come from, and how did you check they were what users\
    \ really needed?"
  expected_concepts:
  - sources of requirements
  - validation with users
  - handling changes
  - documenting
  rubric:
    excellent: "Names the sources, how they validated needs with users and handled changing requirements\
      \ with documentation."
    good: Knows the sources and had some validation.
    weak: Took requirements as given and did not verify.
  followups:
  - Which requirement changed most?
  - How did you say no to one?
  common_errors:
  - 'Falling into the weak pattern: took requirements as given and did not verify.'

- external_key: resume_screening.project_ownership.documentation_you_wrote
  competency_key: communication
  topic: Documents authored
  difficulty: easy
  text: What documents, designs or plans did you write for that project, and who used them?
  expected_concepts:
  - type of documents
  - audience
  - use after writing
  - maintenance
  rubric:
    excellent: Names specific documents they wrote, who used them and how they were kept up to date.
    good: Wrote some documents with limited use afterwards.
    weak: Wrote none or cannot name any.
  followups:
  - Which one was most useful?
  - Is it still used?
  common_errors:
  - 'Falling into the weak pattern: wrote none or cannot name any.'

- external_key: resume_screening.project_ownership.project_timeline_phases
  competency_key: project_management
  topic: Project phases
  difficulty: medium
  text: "Walk me through the phases of the project from start to finish and where your involvement was\
    \ heaviest."
  expected_concepts:
  - phases and milestones
  - own involvement by phase
  - transitions
  - deliverables
  rubric:
    excellent: "Gives a clear sequence of phases with milestones and describes their involvement and deliverables\
      \ in each."
    good: Describes the main phases with approximate timing.
    weak: Cannot give an ordered description.
  followups:
  - Which phase was shortest?
  - Which one was underestimated?
  common_errors:
  - 'Falling into the weak pattern: cannot give an ordered description.'

- external_key: resume_screening.project_ownership.decision_log_example
  competency_key: ownership
  topic: A specific decision
  difficulty: medium
  text: "Describe one decision you made on the project that others were relying on. What did you know\
    \ at the time?"
  expected_concepts:
  - information available
  - reasoning
  - consulting others
  - consequences
  rubric:
    excellent: "Describes the decision, the information and reasoning at the time, who they consulted\
      \ and what followed."
    good: Describes a decision and its reason.
    weak: Describes a decision made by someone else.
  followups:
  - What information was missing?
  - What happened as a result?
  common_errors:
  - 'Falling into the weak pattern: describes a decision made by someone else.'

- external_key: resume_screening.project_ownership.users_of_your_work
  competency_key: product_sense
  topic: Who used the result
  difficulty: easy
  text: Who used what you built or delivered, and how do you know they used it?
  expected_concepts:
  - identified users
  - usage evidence
  - feedback
  - support needs
  rubric:
    excellent: Identifies users, gives evidence of use and feedback, and describes what they did with
      it.
    good: Knows who used it in general.
    weak: Does not know whether anyone used it.
  followups:
  - Did any user surprise you?
  - How did they give feedback?
  common_errors:
  - 'Falling into the weak pattern: does not know whether anyone used it.'

- external_key: resume_screening.project_ownership.role_changes_mid_project
  competency_key: adaptability
  topic: Role shifts during the project
  difficulty: medium
  text: Did your role change during the project? What did you pick up or hand over and why?
  expected_concepts:
  - role evolution
  - reasons
  - handover quality
  - effect on the project
  rubric:
    excellent: Describes how their role evolved, the reasons, the handover and its effect on delivery.
    good: Notes a change and the reason.
    weak: Role stayed fixed but cannot say what was owned.
  followups:
  - What was hardest to let go of?
  - What did you pick up unexpectedly?
  common_errors:
  - 'Falling into the weak pattern: role stayed fixed but cannot say what was owned.'

- external_key: resume_screening.project_ownership.tools_and_process_used
  competency_key: agile_delivery
  topic: How the work was run
  difficulty: easy
  text: How did the team plan and track work on the project, and what was your part in that?
  expected_concepts:
  - planning method
  - tracking tools
  - ceremonies
  - improvement of process
  rubric:
    excellent: Describes the planning approach, tracking tools and their role in keeping the process useful.
    good: Describes the process and own participation.
    weak: Cannot describe how work was organised.
  followups:
  - What did you change about the process?
  - What slowed the team down?
  common_errors:
  - 'Falling into the weak pattern: cannot describe how work was organised.'

- external_key: resume_screening.project_ownership.budget_or_resource_owner
  competency_key: project_management
  topic: Resource responsibility
  difficulty: hard
  text: "Did you have any responsibility for the budget, time or people on the project? How did you manage\
    \ trade-offs among them?"
  expected_concepts:
  - resource ownership
  - prioritising
  - trade-off reasoning
  - reporting
  rubric:
    excellent: Describes real responsibility with an example of trade-offs, how they were decided and
      reported.
    good: Had partial responsibility and described a simple trade-off.
    weak: Claims responsibility without examples.
  followups:
  - What did you trade away?
  - Who approved changes?
  common_errors:
  - 'Falling into the weak pattern: claims responsibility without examples.'

- external_key: resume_screening.project_ownership.risks_you_flagged
  competency_key: project_management
  topic: Early risks
  difficulty: medium
  text: What risks did you identify early in the project and what did you do about them?
  expected_concepts:
  - identifying risks
  - mitigation
  - communication
  - follow-through
  rubric:
    excellent: Names specific risks, shows the mitigation plan and how it was tracked and communicated.
    good: Names risks and general actions.
    weak: No risks were recognised.
  followups:
  - Which risk actually occurred?
  - Who did you warn?
  common_errors:
  - 'Falling into the weak pattern: no risks were recognised.'

- external_key: resume_screening.project_ownership.vendor_or_partner_work
  competency_key: stakeholder_management
  topic: External parties
  difficulty: medium
  text: "Did the project involve external vendors or partner teams? How did you manage that relationship\
    \ and expectations?"
  expected_concepts:
  - defining expectations
  - communication
  - accountability
  - resolving problems
  rubric:
    excellent: Describes clear expectations, regular communication and how issues were resolved with specifics.
    good: Worked with the party and managed day-to-day contact.
    weak: Left the relationship to others.
  followups:
  - What went wrong with them?
  - How did you hold them to a plan?
  common_errors:
  - 'Falling into the weak pattern: left the relationship to others.'

- external_key: resume_screening.project_ownership.evidence_of_ownership
  competency_key: ownership
  topic: Proof of ownership
  difficulty: hard
  text: What is the strongest piece of evidence that you owned this project rather than participated in
    it?
  expected_concepts:
  - concrete artefacts
  - decisions
  - accountability for outcomes
  - corroboration from others
  rubric:
    excellent: "Gives specific verifiable evidence such as decisions, artefacts and accountability, corroborated\
      \ by others."
    good: Gives evidence of strong participation with some ownership.
    weak: Offers general statements without evidence.
  followups:
  - Who could confirm it?
  - What did you answer for when it went wrong?
  common_errors:
  - 'Falling into the weak pattern: offers general statements without evidence.'

- external_key: resume_screening.project_ownership.one_sentence_for_resume
  competency_key: communication
  topic: Resume wording
  difficulty: easy
  text: Which sentence on your resume best describes this project and does it reflect your role accurately?
  expected_concepts:
  - accuracy of wording
  - role verbs used
  - scope
  - willingness to revise
  rubric:
    excellent: Reads the sentence, explains how it reflects their role precisely and suggests any revision.
    good: Confirms it is mostly accurate.
    weak: Cannot explain the wording or contradicts it.
  followups:
  - Which verb is strongest in it?
  - What would you change?
  common_errors:
  - 'Falling into the weak pattern: cannot explain the wording or contradicts it.'

- external_key: resume_screening.project_ownership.onboarding_others_to_it
  competency_key: collaboration
  topic: Bringing others in
  difficulty: medium
  text: "Did you ever bring new people onto that project? How did you get them productive and what did\
    \ you give them?"
  expected_concepts:
  - onboarding material
  - pairing
  - clear first tasks
  - checking progress
  rubric:
    excellent: "Describes concrete onboarding steps, materials and first tasks and the speed at which\
      \ people became productive."
    good: Helped new people with some structure.
    weak: Left newcomers to find their own way.
  followups:
  - What did you wish you had documented?
  - How did you check they were stuck?
  common_errors:
  - 'Falling into the weak pattern: left newcomers to find their own way.'
