# Curated questions: resume screening, transitions_growth. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.transitions_growth.changing_domain
  competency_key: adaptability
  topic: Moving to a new domain
  difficulty: medium
  text: "Your resume shows a move into a different domain or industry. What did you have to learn first\
    \ and how did you get up to speed?"
  expected_concepts:
  - identifying knowledge needed
  - learning methods
  - applying earlier skills
  - early contributions
  rubric:
    excellent: "Describes what needed to be learned, a structured way of learning it and how earlier skills\
      \ helped deliver early value."
    good: Describes learning on the job with some planning.
    weak: Describes the move without any learning or vague adaptation.
  followups:
  - What was most different about the domain?
  - Who helped you learn?
  common_errors:
  - Presenting the move as a change of title only.

- external_key: resume_screening.transitions_growth.changing_stack
  competency_key: adaptability
  topic: Changing technologies
  difficulty: easy
  text: When your work moved to a different technology stack, how did you handle the shift?
  expected_concepts:
  - learning approach
  - practice
  - mapping concepts
  - delivering while learning
  rubric:
    excellent: "Describes a deliberate approach, early small tasks and how existing knowledge mapped to\
      \ the new stack."
    good: Learned as needed with some resources.
    weak: Struggled and relied heavily on others.
  followups:
  - What carried over?
  - What was the first thing you built?
  common_errors:
  - 'Falling into the weak pattern: struggled and relied heavily on others.'

- external_key: resume_screening.transitions_growth.moving_between_functions
  competency_key: adaptability
  topic: Moving between functions
  difficulty: medium
  text: "If you moved from one type of work to another, such as support to engineering or testing to development,\
    \ what made the move work professionally?"
  expected_concepts:
  - transferable skills
  - learning plan
  - sponsorship or support
  - early results
  rubric:
    excellent: "Describes the transferable skills, a clear learning plan, support from others and results\
      \ from the new function."
    good: Describes the move and general preparation.
    weak: Cannot explain how it worked.
  followups:
  - What helped most from the old role?
  - Which skill did you build first?
  common_errors:
  - 'Falling into the weak pattern: cannot explain how it worked.'

- external_key: resume_screening.transitions_growth.individual_to_lead
  competency_key: leadership
  topic: Becoming a lead
  difficulty: medium
  text: "If you moved from individual contributor work to leading, what changed about how you spent your\
    \ time and measured success?"
  expected_concepts:
  - change in activities
  - success measures
  - delegation
  - learning to lead
  rubric:
    excellent: "Describes concrete changes in time use and measurement, delegation and what they learned\
      \ about leading."
    good: Describes the transition in general terms.
    weak: Continued working only as an individual.
  followups:
  - What did you stop doing?
  - What did you find hard?
  common_errors:
  - 'Falling into the weak pattern: continued working only as an individual.'

- external_key: resume_screening.transitions_growth.lead_back_to_individual
  competency_key: adaptability
  topic: Deepening a specialty
  difficulty: hard
  text: "If you have moved toward more hands-on specialist work after a period of coordinating others,\
    \ what did you want to get from that shift professionally?"
  expected_concepts:
  - professional rationale
  - skills used
  - value to the team
  - clarity of direction
  rubric:
    excellent: "Explains the professional reasoning, how earlier leadership strengthens the specialist\
      \ work and what they aim to achieve."
    good: Gives a general reason for the shift.
    weak: Cannot give a professional reason.
  followups:
  - What do you bring from leading?
  - What do you want to master?
  common_errors:
  - 'Falling into the weak pattern: cannot give a professional reason.'

- external_key: resume_screening.transitions_growth.small_to_large_company
  competency_key: adaptability
  topic: Different organisation sizes
  difficulty: medium
  text: If you worked in organisations of different sizes, what changed in how you got things done?
  expected_concepts:
  - process differences
  - scope differences
  - communication
  - adaptation
  rubric:
    excellent: Describes specific differences in process, scope and communication and how they adapted.
    good: Describes a few differences.
    weak: Describes no differences.
  followups:
  - What did you miss from the other?
  - What did you take from each?
  common_errors:
  - 'Falling into the weak pattern: describes no differences.'

- external_key: resume_screening.transitions_growth.product_to_service_context
  competency_key: adaptability
  topic: Different kinds of work
  difficulty: medium
  text: "Have you worked on different kinds of products or services, such as internal tools and customer-facing\
    \ products? How did the work differ?"
  expected_concepts:
  - audience differences
  - quality bars
  - feedback loops
  - priorities
  rubric:
    excellent: Contrasts the audience, quality expectations and feedback loops with examples.
    good: Notes a few differences.
    weak: Cannot contrast them.
  followups:
  - Which suited your strengths better?
  - What changed in how you tested?
  common_errors:
  - 'Falling into the weak pattern: cannot contrast them.'

- external_key: resume_screening.transitions_growth.new_tool_adoption_in_role
  competency_key: adaptability
  topic: Adopting a new tool in a role
  difficulty: easy
  text: "Tell me about a time you had to adopt a major new tool or method within a role. How did you get\
    \ comfortable with it?"
  expected_concepts:
  - learning plan
  - practice
  - support
  - sharing
  rubric:
    excellent: Describes a structured learning approach, early practice and sharing what they learned
      with others.
    good: Learned with some guidance.
    weak: Avoided it or learned slowly without help.
  followups:
  - What was the biggest hurdle?
  - What shortcut did you find?
  common_errors:
  - 'Falling into the weak pattern: avoided it or learned slowly without help.'

- external_key: resume_screening.transitions_growth.broadening_skill_set
  competency_key: adaptability
  topic: Broadening skills
  difficulty: easy
  text: What did you deliberately add to your skills across your roles to widen what you can do?
  expected_concepts:
  - deliberate learning
  - selection reasons
  - application
  - evidence
  rubric:
    excellent: Names skills added deliberately, why they chose them and how they used them.
    good: Names some skills with general reasons.
    weak: Skills were added only by chance.
  followups:
  - What is next on the list?
  - How did you practise?
  common_errors:
  - 'Falling into the weak pattern: skills were added only by chance.'

- external_key: resume_screening.transitions_growth.career_pivot_proof
  competency_key: problem_solving
  topic: Showing readiness after a pivot
  difficulty: hard
  text: "How would you show someone that your experience in your recent area is solid, even if your earlier\
    \ roles were in a different area?"
  expected_concepts:
  - concrete work in the new area
  - evidence
  - mapping to requirements
  - learning continuing
  rubric:
    excellent: "Provides concrete evidence from recent work, maps it to the role's needs and shows continuing\
      \ learning."
    good: Provides some evidence with general mapping.
    weak: Relies on potential rather than evidence.
  followups:
  - What is your strongest example?
  - What are you still learning?
  common_errors:
  - 'Falling into the weak pattern: relies on potential rather than evidence.'

- external_key: resume_screening.transitions_growth.bridging_two_worlds
  competency_key: communication
  topic: Using both backgrounds
  difficulty: medium
  text: Where has having experience in two different areas helped you solve a problem others struggled
    with?
  expected_concepts:
  - combining perspectives
  - specific problem
  - outcome
  - recognition
  rubric:
    excellent: Describes a problem where combined knowledge made the difference, with outcomes.
    good: Describes benefits in general.
    weak: Cannot give a specific example.
  followups:
  - Who benefited?
  - What did each background contribute?
  common_errors:
  - 'Falling into the weak pattern: cannot give a specific example.'

- external_key: resume_screening.transitions_growth.learning_curve_estimate
  competency_key: project_management
  topic: Time to productivity
  difficulty: medium
  text: In your most recent move, how did you judge when you were fully productive, and what signs told
    you?
  expected_concepts:
  - observable signs
  - feedback
  - independent delivery
  - goals set
  rubric:
    excellent: "Names observable signs such as independent delivery and feedback, and how they checked\
      \ progress with their manager."
    good: Describes feeling productive and some feedback.
    weak: Cannot say when or how they became productive.
  followups:
  - What did you deliver first?
  - What took longest?
  common_errors:
  - 'Falling into the weak pattern: cannot say when or how they became productive.'

- external_key: resume_screening.transitions_growth.mistakes_while_adjusting
  competency_key: adaptability
  topic: Early mistakes
  difficulty: medium
  text: What mistakes did you make while adjusting to a new kind of work and what did you do about them?
  expected_concepts:
  - recognising mistakes
  - correcting
  - asking for feedback
  - adjusting approach
  rubric:
    excellent: Describes real mistakes, how they were noticed and corrected and what changed afterward.
    good: Describes small mistakes and fixes.
    weak: Cannot recall any.
  followups:
  - Who pointed it out?
  - What did you change?
  common_errors:
  - 'Falling into the weak pattern: cannot recall any.'

- external_key: resume_screening.transitions_growth.seeking_responsibility_early
  competency_key: ownership
  topic: Taking initiative in new setting
  difficulty: medium
  text: In a new role, how did you find areas where you could contribute before being asked?
  expected_concepts:
  - observing
  - asking questions
  - proposing
  - delivering
  rubric:
    excellent: Describes observing needs, proposing contributions and delivering visible results.
    good: Contributed when asked and sometimes proactively.
    weak: Waited for direction.
  followups:
  - What did you notice first?
  - How did your manager react?
  common_errors:
  - 'Falling into the weak pattern: waited for direction.'

- external_key: resume_screening.transitions_growth.self_directed_learning_path
  competency_key: adaptability
  topic: Learning independently
  difficulty: easy
  text: How have you learned new skills on your own alongside your work, and what did that learning lead
    to?
  expected_concepts:
  - self-directed methods
  - practice projects
  - application at work
  - results
  rubric:
    excellent: Describes a self-directed approach, practice projects and the work that came from it.
    good: Learned from resources occasionally.
    weak: Learns only when required.
  followups:
  - What was the best resource?
  - What did you apply at work?
  common_errors:
  - 'Falling into the weak pattern: learns only when required.'

- external_key: resume_screening.transitions_growth.making_use_of_formal_training
  competency_key: adaptability
  topic: Using training at work
  difficulty: easy
  text: "Tell me about a course, workshop or internal programme that changed how you work. What did you\
    \ apply from it?"
  expected_concepts:
  - specific training
  - applied lessons
  - evidence of change
  - sharing
  rubric:
    excellent: Names the training, what they applied and the effect on their work.
    good: Names training with general application.
    weak: Cannot name anything applied.
  followups:
  - What did you share with colleagues?
  - What did you not find useful?
  common_errors:
  - 'Falling into the weak pattern: cannot name anything applied.'

- external_key: resume_screening.transitions_growth.role_boundaries_different_orgs
  competency_key: communication
  topic: Understanding different expectations
  difficulty: medium
  text: How did you work out what the same job title meant in a different organisation?
  expected_concepts:
  - asking questions
  - observing
  - clarifying with manager
  - adjusting
  rubric:
    excellent: Describes asking questions about expectations, observing others and aligning on goals.
    good: Learned through experience.
    weak: Assumed the title meant the same everywhere.
  followups:
  - What was different?
  - Who explained it?
  common_errors:
  - 'Falling into the weak pattern: assumed the title meant the same everywhere.'

- external_key: resume_screening.transitions_growth.customer_exposure_change
  competency_key: customer_communication
  topic: Closer to customers
  difficulty: medium
  text: If a role put you closer to customers or users than before, how did that change your work?
  expected_concepts:
  - new feedback
  - changed priorities
  - communication
  - examples
  rubric:
    excellent: Describes how direct feedback changed priorities and gives a specific example of a changed
      decision.
    good: Notes more customer contact and some effects.
    weak: Sees no difference.
  followups:
  - What did a customer teach you?
  - How did you share it?
  common_errors:
  - 'Falling into the weak pattern: sees no difference.'

- external_key: resume_screening.transitions_growth.broader_system_view
  competency_key: system_design
  topic: Seeing the larger picture
  difficulty: medium
  text: How did your understanding of the whole system or business grow as you moved through your roles?
  expected_concepts:
  - widening context
  - connecting work to outcomes
  - examples
  - impact on decisions
  rubric:
    excellent: Shows widening context with examples of decisions that changed because of it.
    good: Describes broader awareness in general.
    weak: Focused only on own tasks.
  followups:
  - When did the bigger picture change a decision?
  - Whom did you learn it from?
  common_errors:
  - 'Falling into the weak pattern: focused only on own tasks.'

- external_key: resume_screening.transitions_growth.transition_where_you_struggled
  competency_key: adaptability
  topic: A difficult adjustment
  difficulty: hard
  text: Which professional adjustment was hardest for you, and how did you work through it?
  expected_concepts:
  - identifying the challenge
  - actions
  - support
  - outcome
  rubric:
    excellent: Describes a real challenge, specific steps taken, support used and the improvement achieved.
    good: Describes a modest challenge and a response.
    weak: Says nothing was hard.
  followups:
  - What helped most?
  - What would you tell someone else facing it?
  common_errors:
  - 'Falling into the weak pattern: says nothing was hard.'

- external_key: resume_screening.transitions_growth.combining_experience_for_this_role
  competency_key: motivation
  topic: Fit between past roles and this one
  difficulty: medium
  text: How do your last couple of roles prepare you for the work in this role, in specific terms?
  expected_concepts:
  - mapping experience to requirements
  - examples
  - areas to develop
  - clarity
  rubric:
    excellent: Maps specific experience to specific requirements with examples and names areas to develop.
    good: Gives a general mapping.
    weak: Cannot connect their experience to the role.
  followups:
  - Which requirement is least covered?
  - Which experience is most relevant?
  common_errors:
  - 'Falling into the weak pattern: cannot connect their experience to the role.'

- external_key: resume_screening.transitions_growth.pace_of_change
  competency_key: adaptability
  topic: Handling change at work
  difficulty: medium
  text: "Think of a point when priorities for your product were redrawn and your own remit shifted with\
    \ them. What did you take on, and what did you set aside?"
  expected_concepts:
  - understanding the change
  - adapting
  - supporting others
  - results
  rubric:
    excellent: Describes the change, how they adapted their work and helped others and the results.
    good: Adapted to the change with some effort.
    weak: Resisted or was disengaged.
  followups:
  - What did you do first?
  - What did you gain?
  common_errors:
  - 'Falling into the weak pattern: resisted or was disengaged.'

- external_key: resume_screening.transitions_growth.expanding_into_adjacent_area
  competency_key: adaptability
  topic: Adjacent skills
  difficulty: medium
  text: "Which adjacent area, beyond your core role, have you expanded into, and how did it help your\
    \ main work?"
  expected_concepts:
  - choice of area
  - learning
  - application
  - benefit
  rubric:
    excellent: Names the area, how they learned it and specific benefits to their main work.
    good: Names an area with general benefits.
    weak: Stays only in the core role.
  followups:
  - What was the first thing you did there?
  - Whom did you work with?
  common_errors:
  - 'Falling into the weak pattern: stays only in the core role.'

- external_key: resume_screening.transitions_growth.translating_between_teams
  competency_key: communication
  topic: Interpreter between groups
  difficulty: medium
  text: "Have you acted as a link between groups with different specialities because of your varied background?\
    \ Describe how."
  expected_concepts:
  - understanding both sides
  - translating
  - resolving misunderstandings
  - outcome
  rubric:
    excellent: "Describes a specific situation where their background helped two groups understand each\
      \ other and what resulted."
    good: Helped communication in general ways.
    weak: Has not played such a role.
  followups:
  - What misunderstanding did you clear up?
  - What did each side need?
  common_errors:
  - 'Falling into the weak pattern: has not played such a role.'

- external_key: resume_screening.transitions_growth.transferable_habit
  competency_key: adaptability
  topic: A habit that travelled
  difficulty: easy
  text: What working habit have you carried through every role you have had, and why has it held up?
  expected_concepts:
  - specific habit
  - examples across roles
  - adaptation
  - value
  rubric:
    excellent: Names a habit, gives examples from multiple roles and how it adapted to different settings.
    good: Names a habit with one example.
    weak: Cannot name one.
  followups:
  - Where did it fail?
  - Who noticed it?
  common_errors:
  - 'Falling into the weak pattern: cannot name one.'
