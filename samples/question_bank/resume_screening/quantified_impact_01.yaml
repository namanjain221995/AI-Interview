# Curated questions: resume screening, quantified_impact. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.quantified_impact.starting_number
  competency_key: problem_solving
  topic: Starting point behind a percentage
  difficulty: easy
  text: "Your resume quotes an improvement as a percentage. What was the starting number that percentage\
    \ was measured against, and how did you know it?"
  expected_concepts:
  - naming the concrete baseline value
  - where the baseline came from
  - same conditions before and after
  - awareness that a percentage hides the absolute size
  rubric:
    excellent: "Gives the actual baseline and the result in absolute terms, explains the source of the\
      \ baseline and confirms the before and after were measured the same way."
    good: States a baseline and roughly where it came from but is vague on whether conditions matched.
    weak: "Cannot recall the starting figure or says it was a general feeling that things were slower\
      \ or costlier."
  followups:
  - What was that figure in plain units?
  - Who else could have confirmed that starting number?
  common_errors:
  - Quoting only the percentage with no absolute values.

- external_key: resume_screening.quantified_impact.where_number_came_from
  competency_key: data_analysis
  topic: Source of the figure
  difficulty: easy
  text: "Pick one number on your resume and tell me where it came from. Was it a dashboard, a report,\
    \ a log query, or something else?"
  expected_concepts:
  - naming the actual data source or tool
  - who owned the data
  - how often it was refreshed
  - how they accessed it themselves
  rubric:
    excellent: "Names the exact source, explains how the number was calculated and shows they looked at\
      \ it directly rather than relying on a summary from someone else."
    good: Names a tool or report and a general method but is unsure of the calculation details.
    weak: Says the number was told to them or cannot say where it was recorded.
  followups:
  - Did you pull the data yourself?
  - Was there another source that confirmed it?
  common_errors:
  - Treating a slide in a status deck as the data source.

- external_key: resume_screening.quantified_impact.tool_used_to_measure
  competency_key: data_analysis
  topic: Measurement tooling
  difficulty: easy
  text: "Which tool or method did you use to measure the result you describe, and why was it the right\
    \ one for that job?"
  expected_concepts:
  - choosing a measurement tool suited to the metric
  - how the data was collected
  - known limits of the tool
  - why alternatives were not used
  rubric:
    excellent: "Names the tool, explains why it fit the metric, and describes a limitation they accounted\
      \ for such as sampling or delay."
    good: Names the tool and explains basic usage but has not considered its limits.
    weak: Names a tool only in passing and cannot explain how the measurement was taken.
  followups:
  - What would the tool have missed?
  - Did you ever cross-check it with another method?
  common_errors:
  - Naming a tool without being able to explain what it actually measured.

- external_key: resume_screening.quantified_impact.before_and_after_window
  competency_key: data_analysis
  topic: Comparison window
  difficulty: easy
  text: Over what period did you compare the before and after, and why did you choose that window?
  expected_concepts:
  - choosing comparable periods
  - length long enough to smooth noise
  - avoiding unusual periods
  - stating the window openly
  rubric:
    excellent: "Explains the length and timing of both windows, why they are comparable and how unusual\
      \ days or events were handled."
    good: Gives the windows and a reasonable reason but did not check for unusual events.
    weak: Compares a single good day with an average or cannot say what periods were compared.
  followups:
  - Did anything unusual happen during either window?
  - Would a longer window have changed the result?
  common_errors:
  - Comparing a busy period before with a quiet period after.

- external_key: resume_screening.quantified_impact.absolute_versus_relative
  competency_key: communication
  topic: Percentages and absolute values
  difficulty: easy
  text: "When you say something improved by a certain percentage, what did that mean in real terms such\
    \ as seconds, dollars, hours or users?"
  expected_concepts:
  - converting a percentage to absolute units
  - scale of the improvement in business terms
  - recognising small bases inflate percentages
  rubric:
    excellent: "Converts the figure to concrete units without prompting, relates it to business scale\
      \ and says when the percentage alone might mislead."
    good: Can give the absolute value when asked and explains its size roughly.
    weak: Only repeats the percentage and has no sense of the real size.
  followups:
  - Is that a lot for a system of that size?
  - How did the people who benefited notice the change?
  common_errors:
  - Reporting percentages without any sense of real-world size.

- external_key: resume_screening.quantified_impact.reading_a_baseline_problem
  competency_key: problem_solving
  topic: Baseline that moved
  difficulty: medium
  text: "Think about a result on your resume where the baseline was changing while you worked. How did\
    \ you decide which baseline to compare your result with?"
  expected_concepts:
  - recognising a moving baseline
  - picking a fixed reference point
  - documenting the choice
  - considering a control group or parallel comparison
  rubric:
    excellent: "Describes a clear approach for fixing the reference, shows awareness of how the choice\
      \ affects the claim and says what they recorded to keep it reproducible."
    good: Chose a sensible reference point but did not consider alternatives.
    weak: Ignored that the baseline was moving or picked the most flattering one.
  followups:
  - What would the result look like against a different baseline?
  - Who agreed the reference with you?
  common_errors:
  - Choosing the most flattering reference point without saying so.

- external_key: resume_screening.quantified_impact.sample_size_confidence
  competency_key: statistics_experimentation
  topic: Sample behind the number
  difficulty: medium
  text: "How much data sat behind the key number on your resume, and how confident were you that it was\
    \ not just noise?"
  expected_concepts:
  - size of the sample or number of runs
  - variance or spread
  - repeating the measurement
  - stating a range rather than a point
  rubric:
    excellent: "States the amount of data, describes the spread, explains repeated runs or a significance\
      \ check and reports the result as a range when appropriate."
    good: Knows the rough data volume and ran the measurement more than once.
    weak: Based the claim on a single measurement or cannot say how much data there was.
  followups:
  - How much did the number vary between runs?
  - What would have made you doubt it?
  common_errors:
  - Reporting an average without any idea of spread.

- external_key: resume_screening.quantified_impact.estimate_or_measured
  competency_key: data_analysis
  topic: Estimated versus measured
  difficulty: medium
  text: "Which of the numbers on your resume were measured directly and which were estimates? Walk me\
    \ through one estimate."
  expected_concepts:
  - separating measured from estimated figures
  - the assumptions behind the estimate
  - how the estimate was checked
  - labelling it clearly in communication
  rubric:
    excellent: "Clearly distinguishes the two, lays out the assumptions in an estimate, says how they\
      \ validated it and how they labelled it for others."
    good: Knows which numbers were estimates and can describe the main assumption.
    weak: Treats estimates as measurements or cannot recall how they were produced.
  followups:
  - Which assumption mattered most?
  - Did the estimate later turn out close to reality?
  common_errors:
  - Presenting an extrapolated figure as if it were directly measured.

- external_key: resume_screening.quantified_impact.cost_saving_calculation
  competency_key: data_analysis
  topic: How a cost saving was computed
  difficulty: medium
  text: "If your resume claims a cost saving, take me through the calculation line by line. What was included\
    \ and what was left out?"
  expected_concepts:
  - itemised costs before and after
  - recurring versus one-off costs
  - including the effort or tooling cost of the change
  - period used for the figure
  rubric:
    excellent: "Walks through the calculation with specific cost lines, includes one-off and ongoing costs,\
      \ and names what was deliberately excluded and why."
    good: Explains the main saving and the period but misses one-off costs or indirect effects.
    weak: Gives a headline figure with no breakdown or cannot reproduce the calculation.
  followups:
  - Did you subtract the cost of the work itself?
  - Who in finance or operations reviewed the figure?
  common_errors:
  - Counting a gross reduction without netting new costs introduced by the change.

- external_key: resume_screening.quantified_impact.annualised_figures
  competency_key: data_analysis
  topic: Annualised or extrapolated numbers
  difficulty: medium
  text: "Some resume figures are annualised from a short observation. If yours is, how did you extrapolate,\
    \ and what could have made the extrapolation wrong?"
  expected_concepts:
  - stating the observed period
  - the extrapolation method
  - seasonality and growth assumptions
  - checking against actuals later
  rubric:
    excellent: "Describes the observed period, shows the arithmetic and names specific risks to the projection\
      \ such as seasonality or changing volume, and follows up with actuals."
    good: Explains the extrapolation but gives limited thought to what could invalidate it.
    weak: Multiplies a short-term figure without any caveats.
  followups:
  - Did you ever compare the projection with what really happened?
  - How did you label it when you reported it?
  common_errors:
  - Multiplying a short observation by a constant and calling it annual.

- external_key: resume_screening.quantified_impact.who_validated_figure
  competency_key: collaboration
  topic: Independent validation
  difficulty: medium
  text: "Who else looked at your numbers before they were reported or put on your resume, and what did\
    \ they say?"
  expected_concepts:
  - independent review by a peer analyst or owner of the data
  - challenges raised
  - changes made after review
  - documenting the method
  rubric:
    excellent: "Names who reviewed the figures, describes a challenge that changed something and shows\
      \ how the method was documented for others."
    good: Had a colleague or manager review and sign off but without much challenge.
    weak: Nobody checked the numbers or the candidate cannot recall.
  followups:
  - What was the toughest question you got about it?
  - Did the number change after review?
  common_errors:
  - Relying on one's own check as the only validation.

- external_key: resume_screening.quantified_impact.reproducing_the_result
  competency_key: problem_solving
  topic: Reproducibility
  difficulty: medium
  text: "If I handed you the same system and asked you to reproduce the result on your resume, what exactly\
    \ would you do and what would you need?"
  expected_concepts:
  - listing the steps and setup used
  - needed data and environment
  - version control of the method
  - expected tolerance in the outcome
  rubric:
    excellent: "Lays out a repeatable procedure with the environment, data and tool settings and states\
      \ how close a rerun should be to the original."
    good: Gives a general outline of the steps but not the conditions.
    weak: Cannot describe how it was done or says it cannot be repeated.
  followups:
  - What would be hardest to recreate?
  - Was the method written down anywhere?
  common_errors:
  - Describing the outcome but not the steps or environment that produced it.

- external_key: resume_screening.quantified_impact.numbers_challenged_by_stakeholder
  competency_key: communication
  topic: Defending a figure
  difficulty: medium
  text: "Tell me about a time someone senior challenged one of your numbers. How did you respond and what\
    \ happened to the figure?"
  expected_concepts:
  - staying with evidence
  - showing the method
  - accepting corrections
  - revising the claim when warranted
  rubric:
    excellent: "Gives a concrete example, responds with evidence and method, and either defends the figure\
      \ with data or corrects it openly with a better one."
    good: Defended the number reasonably but treated the challenge as a one-off.
    weak: Becomes defensive in the story or cannot recall any real challenge.
  followups:
  - What changed afterwards in how you report numbers?
  - Was the figure revised?
  common_errors:
  - Defending a number by seniority or effort instead of evidence.

- external_key: resume_screening.quantified_impact.rounding_and_headline_claims
  competency_key: communication
  topic: Headline claims on a resume
  difficulty: medium
  text: "Looking at the headline claim on your resume, is there any wording that could be read as bigger\
    \ than what really happened? How would you phrase it precisely?"
  expected_concepts:
  - precision about scope
  - naming the real limits of the claim
  - separating team result from personal part
  - willingness to restate
  rubric:
    excellent: "Identifies where the wording stretches the facts, restates it precisely with scope and\
      \ conditions and shows ease doing so."
    good: Clarifies the claim when asked and admits some ambiguity.
    weak: Insists the wording is exact without reflecting on it or cannot restate it.
  followups:
  - What scope would you add to that sentence?
  - Would you change anything on the resume now?
  common_errors:
  - Rounding up or generalising a result beyond what the data covered.

- external_key: resume_screening.quantified_impact.throughput_before_after
  competency_key: problem_solving
  topic: Throughput figure
  difficulty: medium
  text: "For a throughput or volume number on your resume, describe the test conditions before and after.\
    \ What stayed fixed?"
  expected_concepts:
  - same workload and hardware
  - same data size
  - warm versus cold runs
  - recording the configuration
  rubric:
    excellent: "Lists the controlled conditions precisely, explains how they ensured equal workload and\
      \ shows the configuration was recorded."
    good: Knows the workload and environment were similar but cannot list the details.
    weak: Compared runs under different conditions or cannot say what was held constant.
  followups:
  - Did the production load behave like the test?
  - What did you change besides the thing being measured?
  common_errors:
  - Changing the workload or hardware between the two measurements.

- external_key: resume_screening.quantified_impact.small_base_big_percent
  competency_key: statistics_experimentation
  topic: Small base inflation
  difficulty: medium
  text: "Suppose a percentage on a resume came from a very small starting number. How would you describe\
    \ the impact fairly, and have you faced that on your own results?"
  expected_concepts:
  - noticing small base effects
  - presenting absolute values next to percentages
  - context for importance
  - avoiding exaggeration
  rubric:
    excellent: "Explains how small bases inflate percentages, shows how they presented both measures on\
      \ their own work and judges importance with context."
    good: Understands the issue in general and can describe a basic fix.
    weak: Sees no problem with quoting large percentages from tiny bases.
  followups:
  - What absolute number would you put next to it?
  - How would a sceptical reader see it?
  common_errors:
  - Leading with a large percentage that rests on a trivial starting value.

- external_key: resume_screening.quantified_impact.no_baseline_exists
  competency_key: problem_solving
  topic: Claim without prior measurement
  difficulty: hard
  text: "Think of an improvement you made where nobody had measured the starting state. How did you establish\
    \ what to compare against, and how much do you trust the result?"
  expected_concepts:
  - reconstructing a baseline from logs or sampling
  - temporary instrumentation
  - bounding uncertainty
  - being open about reduced confidence
  rubric:
    excellent: "Describes a practical way to reconstruct or estimate the baseline, quantifies the uncertainty\
      \ and presents the result with suitable caution."
    good: Used a sensible proxy for a baseline but did not examine its weaknesses.
    weak: Invented or assumed a baseline with no evidence.
  followups:
  - What was the biggest weakness in that reconstructed baseline?
  - What would you instrument from the beginning next time?
  common_errors:
  - Assuming a baseline after the fact and treating it as a measurement.

- external_key: resume_screening.quantified_impact.partial_period_data
  competency_key: data_analysis
  topic: Incomplete data
  difficulty: hard
  text: "Tell me about a result you reported where some of the data was missing or incomplete. How did\
    \ you handle it and what did you tell people?"
  expected_concepts:
  - identifying the missing portion
  - imputing or excluding with reasons
  - testing the sensitivity of the result
  - communicating the limitation
  rubric:
    excellent: "Names what was missing, explains the treatment and tests how much the result depended\
      \ on it, then shows they told stakeholders plainly."
    good: Handled the missing data sensibly and mentioned it but did not test sensitivity.
    weak: Ignored the missing data or hid it in the reporting.
  followups:
  - How different would the answer be under the worst case?
  - Who needed to know about the limit?
  common_errors:
  - Quietly dropping incomplete periods without testing whether the result depends on them.

- external_key: resume_screening.quantified_impact.multiple_metrics_cherry_pick
  competency_key: data_analysis
  topic: Choosing which metric to show
  difficulty: hard
  text: "You probably tracked several metrics on a project. How did you decide which ones went on your\
    \ resume, and what happened to the ones that did not improve?"
  expected_concepts:
  - reporting the metric linked to the goal
  - being open about flat or worse metrics
  - not selecting only favourable ones
  - explaining trade-offs
  rubric:
    excellent: "Explains the criteria for choosing the metric tied to the goal, volunteers a metric that\
      \ did not improve and discusses the trade-off it represented."
    good: Chose the metric tied to the goal but is vague about the others.
    weak: Selected the best-looking numbers and has no account for the rest.
  followups:
  - Which metric got worse, if any?
  - How would a reviewer judge the omission?
  common_errors:
  - Presenting favourable metrics only.

- external_key: resume_screening.quantified_impact.double_counting_savings
  competency_key: data_analysis
  topic: Overlapping claims
  difficulty: medium
  text: "Several projects at once can claim the same saving. How did you make sure your number was not\
    \ double counted with a colleague's or a team's?"
  expected_concepts:
  - agreeing on attribution with other owners
  - unique identification of the benefit
  - dividing shared benefit
  - checking with finance or analytics
  rubric:
    excellent: "Describes how they coordinated with others, split shared benefit transparently and verified\
      \ that totals were not exceeding reality."
    good: Aware of overlap and checked informally with colleagues.
    weak: Never considered overlap with other efforts.
  followups:
  - How did you split the credit?
  - What would the total look like if everyone claimed the same way?
  common_errors:
  - Claiming a shared benefit in full without checking who else counted it.

- external_key: resume_screening.quantified_impact.user_facing_vs_internal_metric
  competency_key: product_sense
  topic: Internal metric to user value
  difficulty: medium
  text: "When you quote an internal metric such as build time or query time, how did you connect it to\
    \ something users or the business actually felt?"
  expected_concepts:
  - linking the internal metric to a user outcome
  - evidence of the connection
  - avoiding assumptions of value
  - asking users or stakeholders
  rubric:
    excellent: "Draws the line from internal metric to user or business outcome with evidence such as\
      \ feedback, usage changes or reduced complaints."
    good: Explains the link logically but with little direct evidence.
    weak: Treats the internal metric as inherently valuable.
  followups:
  - How would you know if users did not care?
  - Did you see any change in behaviour?
  common_errors:
  - Assuming an internal improvement automatically means a user benefit.

- external_key: resume_screening.quantified_impact.what_numbers_cannot_show
  competency_key: communication
  topic: Limits of the numbers
  difficulty: hard
  text: "Looking at your strongest quantified claim, what does that number fail to capture about the work\
    \ or its effect?"
  expected_concepts:
  - recognising limits of quantification
  - qualitative effects such as quality or risk
  - unmeasured side effects
  - restraint about the claim
  rubric:
    excellent: "Names meaningful aspects the number misses, such as maintainability or risk, and shows\
      \ how they would convey them alongside the figure."
    good: Admits a couple of limits when prompted.
    weak: Believes the number captures the entire value or cannot think of any limits.
  followups:
  - What did you leave out of the story?
  - How would you capture that in future?
  common_errors:
  - Treating one metric as a complete picture of value.

- external_key: resume_screening.quantified_impact.smallest_defensible_claim
  competency_key: problem_solving
  topic: Defensible version of a claim
  difficulty: hard
  text: "If you had to cut your most impressive number down to only the part you could fully defend with\
    \ evidence, what would be left?"
  expected_concepts:
  - separating evidence from inference
  - stating the defensible core
  - acknowledging what is plausible but unproven
  - clarity on what data supports each part
  rubric:
    excellent: "Produces a precise reduced claim, explains the evidence for it and separates plausible\
      \ but unproven parts with clear reasoning."
    good: Offers a more modest version but with limited discussion of evidence.
    weak: Refuses to reduce the claim or cannot identify what is certain.
  followups:
  - What evidence would turn the rest into a firm claim?
  - Is the reduced claim still impressive?
  common_errors:
  - Defending every part of the claim equally strongly regardless of evidence.

- external_key: resume_screening.quantified_impact.team_number_my_share
  competency_key: ownership
  topic: Personal share of a team figure
  difficulty: easy
  text: "When your resume quotes a team result, what part of that was your own work, and how would a teammate\
    \ describe your share?"
  expected_concepts:
  - separating personal work from team work
  - specific tasks owned
  - credit to others
  - consistency with teammates' view
  rubric:
    excellent: "Specifies the personal share with concrete tasks, credits others freely and expects teammates\
      \ to agree with the description."
    good: Describes their tasks reasonably but is vague about the proportion.
    weak: Claims the whole team result as personal or cannot name any specific contribution.
  followups:
  - What would your teammate say you did?
  - What did others do that you relied on?
  common_errors:
  - Using we for the team result and leaving the personal part unspecified.

- external_key: resume_screening.quantified_impact.measure_again_today
  competency_key: problem_solving
  topic: Measuring it again
  difficulty: easy
  text: "If you had to prove the same result again today with less time, which single measurement would\
    \ you rely on?"
  expected_concepts:
  - choosing the most decisive measure
  - linking it to the goal
  - simplicity
  - accepting a coarse answer when time is short
  rubric:
    excellent: "Picks one measure clearly tied to the goal, explains why it is decisive and describes\
      \ what it can and cannot prove."
    good: Picks a reasonable measurement but without much justification.
    weak: Cannot choose or lists many unrelated measurements.
  followups:
  - Why that one over the others?
  - What would it miss?
  common_errors:
  - Listing many measurements without choosing the one that settles the question.
