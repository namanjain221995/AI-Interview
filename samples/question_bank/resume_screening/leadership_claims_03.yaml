# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.leadership_claims.taking_over_struggling_team
    competency_key: leadership
    topic: "Inheriting a struggling team"
    difficulty: hard
    text: "You took over a team that was struggling. How did you diagnose what was wrong, and what did you change first?"
    expected_concepts:
      - "listening and data"
      - "separating symptoms from causes"
      - "quick stabilisation"
      - "longer changes"
      - "measured improvement"
    rubric:
      excellent: "Diagnoses with data and conversations, stabilises first, then makes structural changes with evidence of improvement."
      good: "Describes diagnosis and some changes."
      weak: "Replaced people or process without diagnosis."
    followups:
      - "What was the root cause?"
      - "What did you leave alone?"
    common_errors:
      - "Replaced people or process without diagnosis."

  - external_key: resume_screening.leadership_claims.tech_lead_vs_manager_split
    competency_key: leadership
    topic: "Technical lead versus manager duties"
    difficulty: medium
    text: "Your title blends technical lead and manager tasks. How did you divide your attention, and what did you let slide?"
    expected_concepts:
      - "priorities"
      - "time boxing"
      - "delegation"
      - "consequences"
      - "adjustments"
    rubric:
      excellent: "Gives concrete split and consequences, with adjustments made."
      good: "Describes the split."
      weak: "Says nothing suffered."
    followups:
      - "What did you miss?"
      - "Who covered?"
    common_errors:
      - "Says nothing suffered."

  - external_key: resume_screening.leadership_claims.design_review_leading
    competency_key: collaboration
    topic: "Leading design reviews"
    difficulty: easy
    text: "You ran design reviews. What makes a review useful rather than a formality, in your experience?"
    expected_concepts:
      - "preparation"
      - "clear questions"
      - "diverse reviewers"
      - "recorded decisions"
      - "follow-up"
    rubric:
      excellent: "Describes pre-reads, focused questions, recorded outcomes and follow-up."
      good: "Describes reviews."
      weak: "Treats them as approvals."
    followups:
      - "What was a review that changed a design?"
      - "How do you handle dominating voices?"
    common_errors:
      - "Treats them as approvals."

  - external_key: resume_screening.leadership_claims.release_ownership_team
    competency_key: ownership
    topic: "Accountable for releases"
    difficulty: easy
    text: "You were accountable for your team's releases. Describe one that went badly and your part in it."
    expected_concepts:
      - "what happened"
      - "decision points"
      - "response"
      - "accountability"
      - "changes"
    rubric:
      excellent: "Owns decisions, describes response and the process changes."
      good: "Describes the event."
      weak: "Blames others."
    followups:
      - "What decision would you reverse?"
      - "What check was added?"
    common_errors:
      - "Blames others."

  - external_key: resume_screening.leadership_claims.cross_org_initiative
    competency_key: leadership
    topic: "Leading beyond your team"
    difficulty: hard
    text: "You led an initiative across several teams without formal authority over them. How did you get commitment?"
    expected_concepts:
      - "shared problem"
      - "sponsorship"
      - "incentives"
      - "communication"
      - "results"
    rubric:
      excellent: "Builds a shared case, secures a sponsor, aligns incentives and tracks progress."
      good: "Describes the initiative."
      weak: "Relied on position."
    followups:
      - "Who was the sponsor?"
      - "Who dropped out?"
    common_errors:
      - "Relied on position."

  - external_key: resume_screening.leadership_claims.budget_headcount_justification
    competency_key: stakeholder_management
    topic: "Justifying headcount"
    difficulty: medium
    text: "You made a case for more people or resources. What evidence did you use and what was the result?"
    expected_concepts:
      - "workload data"
      - "risk"
      - "options"
      - "business impact"
      - "outcome"
    rubric:
      excellent: "Uses workload and impact evidence with options, and describes the outcome."
      good: "Describes the case."
      weak: "Requested without evidence."
    followups:
      - "What if the answer was no?"
      - "What did you do?"
    common_errors:
      - "Requested without evidence."

  - external_key: resume_screening.leadership_claims.performance_review_writing
    competency_key: communication
    topic: "Written evaluations"
    difficulty: medium
    text: "You wrote evaluations for team members. How did you gather evidence and give feedback people could act on?"
    expected_concepts:
      - "ongoing notes"
      - "specific examples"
      - "balance of strengths and gaps"
      - "development actions"
      - "no surprises"
    rubric:
      excellent: "Keeps notes through the year, uses examples and clear actions, with no surprises in review."
      good: "Describes writing."
      weak: "Writes from memory at the end."
    followups:
      - "How do you avoid recency bias?"
      - "What do you do with disagreement?"
    common_errors:
      - "Writes from memory at the end."

  - external_key: resume_screening.leadership_claims.team_morale_change
    competency_key: collaboration
    topic: "Team through change"
    difficulty: medium
    text: "Your team went through a significant change such as a reorganisation or direction change. What did you communicate and how?"
    expected_concepts:
      - "accurate information"
      - "timing"
      - "listening"
      - "clear next steps"
      - "follow-up"
    rubric:
      excellent: "Communicates what is known early, listens to concerns and sets next steps."
      good: "Describes communication."
      weak: "Passed along messages without context."
    followups:
      - "What could you not tell them?"
      - "What did they ask?"
    common_errors:
      - "Passed along messages without context."

  - external_key: resume_screening.leadership_claims.growth_plan_individual
    competency_key: mentoring
    topic: "Career development plans"
    difficulty: medium
    text: "You helped someone create a growth plan. How did the plan connect to work they actually did?"
    expected_concepts:
      - "goals"
      - "assignments"
      - "skills"
      - "checkpoints"
      - "outcome"
    rubric:
      excellent: "Connects goals to real assignments with checkpoints and outcomes."
      good: "Describes plan."
      weak: "Generic training list."
    followups:
      - "What assignment stretched them?"
      - "How did it end?"
    common_errors:
      - "Generic training list."

  - external_key: resume_screening.leadership_claims.process_overhead_removed
    competency_key: agile_delivery
    topic: "Removing process"
    difficulty: easy
    text: "You removed a process or approval step. How did you make sure it did not create risk?"
    expected_concepts:
      - "purpose of the step"
      - "alternative controls"
      - "trial"
      - "monitoring"
      - "result"
    rubric:
      excellent: "Understands the step's purpose, replaces with lighter control and monitors."
      good: "Describes removal."
      weak: "Removed without checking purpose."
    followups:
      - "What was its purpose?"
      - "What went wrong?"
    common_errors:
      - "Removed without checking purpose."

  - external_key: resume_screening.leadership_claims.customer_escalation_lead
    competency_key: stakeholder_management
    topic: "Customer escalation"
    difficulty: medium
    text: "You led your team's response to an escalated customer problem. How did you balance fixing and communication?"
    expected_concepts:
      - "ownership"
      - "clear updates"
      - "fix plan"
      - "roles"
      - "follow-up"
    rubric:
      excellent: "Takes ownership, communicates on a cadence, assigns roles and follows up."
      good: "Describes handling."
      weak: "Left communication to others."
    followups:
      - "How often did you update?"
      - "What did they want most?"
    common_errors:
      - "Left communication to others."

  - external_key: resume_screening.leadership_claims.standardising_practices_across_teams
    competency_key: collaboration
    topic: "Standardisation"
    difficulty: medium
    text: "You standardised practices across teams. What did you standardise and what did you leave to teams?"
    expected_concepts:
      - "criteria"
      - "consultation"
      - "adoption"
      - "flexibility"
      - "effects"
    rubric:
      excellent: "Standardises where consistency helps, consults and measures effects."
      good: "Describes standards."
      weak: "Standardised everything."
    followups:
      - "What did teams push back on?"
      - "Where did you give way?"
    common_errors:
      - "Standardised everything."

  - external_key: resume_screening.leadership_claims.difficult_stakeholder
    competency_key: stakeholder_management
    topic: "Difficult stakeholder"
    difficulty: hard
    text: "Describe working with a stakeholder who kept changing requirements. What worked?"
    expected_concepts:
      - "understanding the cause"
      - "agreed process"
      - "communication"
      - "limits"
      - "outcome"
    rubric:
      excellent: "Finds the reason for changes, sets change process and communicates impacts."
      good: "Describes managing."
      weak: "Complained."
    followups:
      - "What process did you agree?"
      - "What was the cost of changes?"
    common_errors:
      - "Complained."

  - external_key: resume_screening.leadership_claims.managing_via_metrics_risk
    competency_key: project_management
    topic: "Metrics and unintended effects"
    difficulty: hard
    text: "You used metrics to manage a team. Which one caused unintended behaviour, and what did you do about it?"
    expected_concepts:
      - "metric"
      - "behaviour"
      - "detection"
      - "change"
      - "learning"
    rubric:
      excellent: "Identifies a distortion, explains detection, and changes metrics or context."
      good: "Describes metrics."
      weak: "Claims no problems."
    followups:
      - "How did you notice?"
      - "What replaced it?"
    common_errors:
      - "Claims no problems."

  - external_key: resume_screening.leadership_claims.succession_delegation_cover
    competency_key: ownership
    topic: "Making yourself replaceable"
    difficulty: medium
    text: "How did you prepare your team to run without you for a few weeks?"
    expected_concepts:
      - "documentation"
      - "delegated decisions"
      - "cover"
      - "testing absence"
      - "results"
    rubric:
      excellent: "Prepares documents, delegates decisions and tests with real absence."
      good: "Describes preparation."
      weak: "Everything depended on them."
    followups:
      - "What happened while away?"
      - "What did you document?"
    common_errors:
      - "Everything depended on them."

  - external_key: resume_screening.leadership_claims.hiring_bar_decisions
    competency_key: people_management
    topic: "Hard hiring decisions"
    difficulty: hard
    text: "Describe a hiring decision you found difficult, perhaps because evidence was mixed. How did you decide?"
    expected_concepts:
      - "evidence review"
      - "criteria"
      - "panel input"
      - "risk"
      - "outcome"
    rubric:
      excellent: "Reviews evidence against criteria, seeks input and records the reasoning."
      good: "Describes decision."
      weak: "Decided by instinct."
    followups:
      - "What additional evidence did you seek?"
      - "How did it turn out?"
    common_errors:
      - "Decided by instinct."

  - external_key: resume_screening.leadership_claims.team_wide_learning
    competency_key: mentoring
    topic: "Sharing knowledge"
    difficulty: easy
    text: "You organised knowledge sharing in your team. What format worked and which didn't?"
    expected_concepts:
      - "formats"
      - "frequency"
      - "attendance"
      - "value"
      - "changes"
    rubric:
      excellent: "Tries formats, gathers feedback and keeps the useful ones."
      good: "Describes formats."
      weak: "Ran one-way talks."
    followups:
      - "What did you stop?"
      - "What topic was most requested?"
    common_errors:
      - "Ran one-way talks."

  - external_key: resume_screening.leadership_claims.scope_creep_control
    competency_key: project_management
    topic: "Controlling scope growth"
    difficulty: easy
    text: "Scope grew on a project you led. How did you notice and what did you do?"
    expected_concepts:
      - "tracking"
      - "change control"
      - "communication"
      - "trade-offs"
      - "outcome"
    rubric:
      excellent: "Tracks scope, makes trade-offs visible and agrees changes."
      good: "Describes handling."
      weak: "Absorbed scope growth silently."
    followups:
      - "When did you notice?"
      - "What did you trade?"
    common_errors:
      - "Absorbed scope growth silently."

  - external_key: resume_screening.leadership_claims.cost_of_delay_decisions
    competency_key: project_management
    topic: "Deciding with incomplete information"
    difficulty: medium
    text: "You had to make a decision for your team without all the information you wanted. How did you go about it?"
    expected_concepts:
      - "what was known"
      - "reversibility"
      - "time limit"
      - "consult"
      - "review"
    rubric:
      excellent: "Weighs reversibility, sets a deadline, consults and reviews afterward."
      good: "Describes the decision."
      weak: "Delayed until certain."
    followups:
      - "What information was missing?"
      - "Was it reversible?"
    common_errors:
      - "Delayed until certain."

  - external_key: resume_screening.leadership_claims.peer_leaders_collaboration
    competency_key: collaboration
    topic: "Working with peer leads"
    difficulty: easy
    text: "How did you work with other leads or managers at your level to resolve shared problems?"
    expected_concepts:
      - "regular contact"
      - "shared goals"
      - "trade-offs"
      - "trust"
      - "example"
    rubric:
      excellent: "Gives specific example and shows working through trade-offs."
      good: "Describes relationships."
      weak: "Competes."
    followups:
      - "Which peer taught you most?"
      - "What conflict arose?"
    common_errors:
      - "Competes."

  - external_key: resume_screening.leadership_claims.remote_onboarding_leadership
    competency_key: people_management
    topic: "Remote team practices"
    difficulty: easy
    text: "You led or hired remote or hybrid staff. What did you adapt?"
    expected_concepts:
      - "communication"
      - "onboarding"
      - "visibility"
      - "inclusion"
      - "outcomes"
    rubric:
      excellent: "Lists adaptations and what the results showed."
      good: "Describes adaptations."
      weak: "No changes."
    followups:
      - "What didn't work?"
      - "How did you check?"
    common_errors:
      - "No changes."

  - external_key: resume_screening.leadership_claims.vision_communication
    competency_key: communication
    topic: "Communicating direction"
    difficulty: medium
    text: "How did you make sure everyone on your team understood the goals and why they mattered?"
    expected_concepts:
      - "repeated clear message"
      - "context"
      - "two-way channels"
      - "checks"
      - "alignment"
    rubric:
      excellent: "Communicates context repeatedly, checks understanding and adjusts."
      good: "Describes communication."
      weak: "One announcement."
    followups:
      - "How did you check understanding?"
      - "What did people misunderstand?"
    common_errors:
      - "One announcement."

  - external_key: resume_screening.leadership_claims.leader_mistake_learning
    competency_key: adaptability
    topic: "Your own mistake as leader"
    difficulty: hard
    text: "What is the biggest mistake you made as a lead, and what do you do differently now?"
    expected_concepts:
      - "the mistake"
      - "consequences"
      - "recognition"
      - "change"
      - "evidence"
    rubric:
      excellent: "Names a significant mistake, its effect and a durable change."
      good: "Describes a mistake."
      weak: "Gives a trivial or no mistake."
    followups:
      - "Who was affected?"
      - "What would you tell a new lead?"
    common_errors:
      - "Gives a trivial or no mistake."

  - external_key: resume_screening.leadership_claims.upskilling_team_skills
    competency_key: mentoring
    topic: "Building team capability"
    difficulty: medium
    text: "Your team needed a skill it did not have. How did you build it?"
    expected_concepts:
      - "assess gap"
      - "training"
      - "pairing"
      - "hiring"
      - "progress measure"
    rubric:
      excellent: "Assesses gap, selects approaches and measures progress."
      good: "Describes plan."
      weak: "Hired externally only."
    followups:
      - "What worked?"
      - "How long did it take?"
    common_errors:
      - "Hired externally only."

  - external_key: resume_screening.leadership_claims.handling_disagreement_with_manager
    competency_key: communication
    topic: "Disagreeing with your own manager"
    difficulty: medium
    text: "Tell me about a time you disagreed with a decision from above that affected your team. What did you do?"
    expected_concepts:
      - "understanding the reasoning"
      - "raising concerns with evidence"
      - "commitment"
      - "communicating to team"
      - "outcome"
    rubric:
      excellent: "Raises concerns privately with evidence, accepts the final decision and presents it to the team fairly."
      good: "Describes disagreement."
      weak: "Complained to the team or silently complied."
    followups:
      - "How did you present it to the team?"
      - "Did you change anything?"
    common_errors:
      - "Complained to the team or silently complied."
