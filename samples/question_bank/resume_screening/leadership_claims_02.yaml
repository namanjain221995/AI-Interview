# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.leadership_claims.grew_team_size
    competency_key: people_management
    topic: "Growing a team"
    difficulty: medium
    text: "Your resume mentions growing a team. What was the team's work when it was small, what broke as it grew, and how did you reorganise?"
    expected_concepts:
      - "starting state"
      - "breaking points such as communication and ownership"
      - "structural changes"
      - "hiring pace"
      - "result"
    rubric:
      excellent: "Describes what changed at specific sizes, the structure adopted and the effect on delivery."
      good: "Describes growth and some changes."
      weak: "Reports headcount only."
    followups:
      - "At what size did things first break?"
      - "What ownership did you split?"
    common_errors:
      - "Reports headcount only."

  - external_key: resume_screening.leadership_claims.reorg_team_boundaries
    competency_key: leadership
    topic: "Reshaping team ownership"
    difficulty: hard
    text: "You reorganised how teams owned systems or areas. How did you decide the boundaries and how did you carry people through it?"
    expected_concepts:
      - "reasons"
      - "boundary criteria"
      - "consultation"
      - "communication"
      - "outcomes"
    rubric:
      excellent: "Uses clear criteria for boundaries, consults and communicates, and measures outcomes."
      good: "Describes the reorganisation."
      weak: "Redrew boxes without consulting."
    followups:
      - "Who objected?"
      - "What boundary was wrong?"
    common_errors:
      - "Redrew boxes without consulting."

  - external_key: resume_screening.leadership_claims.quality_culture_changes
    competency_key: code_quality
    topic: "Raising engineering standards"
    difficulty: medium
    text: "You raised quality standards in your team. What changed in daily behaviour, and what resistance did you meet?"
    expected_concepts:
      - "standards"
      - "enforcement via tooling"
      - "modelling"
      - "resistance"
      - "results"
    rubric:
      excellent: "Introduces standards with tooling and example, handles resistance and measures defects or review time."
      good: "Describes standards."
      weak: "Mandated rules and reviewed less."
    followups:
      - "Who resisted most?"
      - "What evidence did you use?"
    common_errors:
      - "Mandated rules and reviewed less."

  - external_key: resume_screening.leadership_claims.okr_goal_setting
    competency_key: project_management
    topic: "Setting goals"
    difficulty: easy
    text: "You set goals or objectives for a team. Tell me about one that turned out to be badly chosen."
    expected_concepts:
      - "how it was chosen"
      - "why it misled"
      - "detection"
      - "change"
      - "learning"
    rubric:
      excellent: "Describes a poor goal, the distortion it caused and how it was changed."
      good: "Describes a goal and its adjustment."
      weak: "Cannot name a flawed goal."
    followups:
      - "What behaviour did it encourage?"
      - "What replaced it?"
    common_errors:
      - "Cannot name a flawed goal."

  - external_key: resume_screening.leadership_claims.sprint_predictability
    competency_key: agile_delivery
    topic: "Predictable delivery"
    difficulty: easy
    text: "You improved predictability. What caused unpredictability before and which change helped most?"
    expected_concepts:
      - "causes such as scope change and hidden work"
      - "planning changes"
      - "measurement"
      - "communication"
      - "results"
    rubric:
      excellent: "Identifies causes with data, makes targeted changes and shows improved predictability."
      good: "Describes changes."
      weak: "Says estimates were more careful."
    followups:
      - "What did you measure?"
      - "What remained unpredictable?"
    common_errors:
      - "Says estimates were more careful."

  - external_key: resume_screening.leadership_claims.architecture_governance
    competency_key: system_design
    topic: "Guiding architecture"
    difficulty: medium
    text: "You were responsible for architectural direction. How did you make sure decisions were made well without becoming a bottleneck?"
    expected_concepts:
      - "decision records"
      - "review forums"
      - "delegated authority"
      - "principles"
      - "revisiting"
    rubric:
      excellent: "Uses lightweight decision records and delegated authority with principles and revisiting."
      good: "Describes review."
      weak: "Approves every decision."
    followups:
      - "Which decisions do you want to see?"
      - "How are they recorded?"
    common_errors:
      - "Approves every decision."

  - external_key: resume_screening.leadership_claims.managing_up_expectations
    competency_key: stakeholder_management
    topic: "Managing expectations upward"
    difficulty: medium
    text: "You told senior stakeholders something they did not want to hear about a delivery. How did you deliver the message?"
    expected_concepts:
      - "preparing facts"
      - "options"
      - "timing"
      - "follow-up"
      - "trust"
    rubric:
      excellent: "Brings facts and options early and follows up."
      good: "Describes the conversation."
      weak: "Delayed the message."
    followups:
      - "How early did you tell them?"
      - "What did they decide?"
    common_errors:
      - "Delayed the message."

  - external_key: resume_screening.leadership_claims.failed_project_leadership
    competency_key: ownership
    topic: "Leading something that failed"
    difficulty: hard
    text: "Describe an initiative you led that did not achieve its goals. What was your share of the responsibility?"
    expected_concepts:
      - "cause analysis"
      - "own decisions"
      - "team handling"
      - "communication"
      - "changes"
    rubric:
      excellent: "States their own decisions that contributed, shares learning with the team and changes practice."
      good: "Describes failure and lessons."
      weak: "Blames external factors."
    followups:
      - "What was your biggest mistake?"
      - "What did the team learn?"
    common_errors:
      - "Blames external factors."

  - external_key: resume_screening.leadership_claims.pairing_review_mentoring
    competency_key: mentoring
    topic: "Teaching through reviews"
    difficulty: easy
    text: "You mentor through code or design reviews. How do you give review feedback so that people learn rather than just fix?"
    expected_concepts:
      - "explaining why"
      - "asking questions"
      - "prioritising comments"
      - "praise"
      - "follow-up"
    rubric:
      excellent: "Gives reasoned, prioritised feedback and checks understanding over time."
      good: "Describes feedback style."
      weak: "Only lists defects."
    followups:
      - "Can you give an example comment?"
      - "How do you handle repeated issues?"
    common_errors:
      - "Only lists defects."

  - external_key: resume_screening.leadership_claims.managing_senior_engineers
    competency_key: people_management
    topic: "Leading experienced people"
    difficulty: hard
    text: "You led people more experienced than you in some area. How did you work with them effectively?"
    expected_concepts:
      - "respecting expertise"
      - "clarity of goals"
      - "asking for input"
      - "boundaries"
      - "outcome"
    rubric:
      excellent: "Defers on expertise, aligns on goals, asks for input and addresses concerns directly."
      good: "Describes the working approach."
      weak: "Avoids leading them."
    followups:
      - "What did you learn from them?"
      - "How did you handle disagreement?"
    common_errors:
      - "Avoids leading them."

  - external_key: resume_screening.leadership_claims.workload_balance
    competency_key: people_management
    topic: "Managing workload"
    difficulty: medium
    text: "How did you spot and handle someone being overloaded, and what changed in the plan?"
    expected_concepts:
      - "signals"
      - "one-to-one conversation"
      - "reprioritising"
      - "sharing work"
      - "preventing recurrence"
    rubric:
      excellent: "Notices signals from work patterns, talks, reduces scope and fixes planning."
      good: "Describes handling."
      weak: "Waited for the person to raise it."
    followups:
      - "What were the signals?"
      - "What did you cut?"
    common_errors:
      - "Waited for the person to raise it."

  - external_key: resume_screening.leadership_claims.on_call_burden_team
    competency_key: incident_response
    topic: "On-call fairness"
    difficulty: medium
    text: "You organised on-call or support rotas. How did you keep them fair and sustainable?"
    expected_concepts:
      - "rotation design"
      - "load measurement"
      - "compensation or time off"
      - "reducing noise"
      - "feedback"
    rubric:
      excellent: "Designs rotas with measured load and reduces pages at source."
      good: "Describes rota."
      weak: "Relied on volunteers."
    followups:
      - "What was the page volume?"
      - "What did you change?"
    common_errors:
      - "Relied on volunteers."

  - external_key: resume_screening.leadership_claims.stakeholder_trust_rebuild
    competency_key: stakeholder_management
    topic: "Recovering trust"
    difficulty: hard
    text: "Your team's reliability or delivery had damaged trust with a partner. What did you do to rebuild it?"
    expected_concepts:
      - "acknowledging"
      - "understanding concerns"
      - "commitments kept"
      - "transparency"
      - "results"
    rubric:
      excellent: "Acknowledges the problem, agrees measurable commitments and reports against them."
      good: "Describes steps."
      weak: "Defends the team."
    followups:
      - "What commitment did you make?"
      - "How did you report progress?"
    common_errors:
      - "Defends the team."

  - external_key: resume_screening.leadership_claims.technical_strategy_document
    competency_key: communication
    topic: "Writing strategy"
    difficulty: medium
    text: "You wrote a technical strategy or proposal for leadership. How did you shape it for the audience, and what was the outcome?"
    expected_concepts:
      - "audience"
      - "structure"
      - "options"
      - "ask"
      - "outcome"
    rubric:
      excellent: "Frames for the decision makers with options and a clear request, and shows what happened."
      good: "Describes the document."
      weak: "Wrote a long technical document."
    followups:
      - "What did you cut?"
      - "What was approved?"
    common_errors:
      - "Wrote a long technical document."

  - external_key: resume_screening.leadership_claims.introducing_tooling_change
    competency_key: leadership
    topic: "Leading a tooling change"
    difficulty: medium
    text: "You led a change in tools used by your team. How did you handle those who preferred the old way?"
    expected_concepts:
      - "reasons"
      - "pilot"
      - "training"
      - "support"
      - "adoption measure"
    rubric:
      excellent: "Pilots, listens to objections, supports transition and measures adoption."
      good: "Describes change."
      weak: "Mandated the tool."
    followups:
      - "Who was the holdout?"
      - "What did you adjust?"
    common_errors:
      - "Mandated the tool."

  - external_key: resume_screening.leadership_claims.cross_functional_leadership
    competency_key: collaboration
    topic: "Leading across functions"
    difficulty: medium
    text: "You led work involving product, design and other groups. How did you keep everyone aligned on what done meant?"
    expected_concepts:
      - "shared goals"
      - "acceptance criteria"
      - "communication"
      - "decisions"
      - "trade-offs"
    rubric:
      excellent: "Defines shared outcomes, maintains communication and resolves trade-offs explicitly."
      good: "Describes alignment."
      weak: "Worked in silos."
    followups:
      - "What caused misalignment?"
      - "How did you decide trade-offs?"
    common_errors:
      - "Worked in silos."

  - external_key: resume_screening.leadership_claims.inclusive_team_practices
    competency_key: collaboration
    topic: "Inclusive working practices"
    difficulty: easy
    text: "What have you done to make sure everyone on your team had a fair chance to contribute and be heard in meetings and decisions?"
    expected_concepts:
      - "meeting practices"
      - "written input"
      - "rotating roles"
      - "fairness of assignments"
      - "checking"
    rubric:
      excellent: "Names practical habits, fair distribution of work and checks on results."
      good: "Describes some practices."
      weak: "Treats it as unnecessary."
    followups:
      - "What have you changed?"
      - "How do you check?"
    common_errors:
      - "Treats it as unnecessary."

  - external_key: resume_screening.leadership_claims.project_scope_negotiation
    competency_key: project_management
    topic: "Negotiating scope"
    difficulty: medium
    text: "You negotiated scope or timeline with stakeholders. What did you trade and what evidence did you bring?"
    expected_concepts:
      - "options"
      - "evidence"
      - "trade-offs"
      - "agreement"
      - "follow-through"
    rubric:
      excellent: "Presents options with evidence and gets an agreed plan."
      good: "Describes negotiation."
      weak: "Said yes then missed."
    followups:
      - "What did you drop?"
      - "How was it agreed?"
    common_errors:
      - "Said yes then missed."

  - external_key: resume_screening.leadership_claims.risk_management_projects
    competency_key: project_management
    topic: "Managing risks"
    difficulty: medium
    text: "Give an example of a risk you spotted early on a project you led and what you did."
    expected_concepts:
      - "identification"
      - "likelihood and impact"
      - "mitigation"
      - "communication"
      - "result"
    rubric:
      excellent: "Names risk, assesses, mitigates and communicates, with outcome."
      good: "Describes the risk."
      weak: "Cannot name one."
    followups:
      - "How did you spot it?"
      - "What if mitigation had failed?"
    common_errors:
      - "Cannot name one."

  - external_key: resume_screening.leadership_claims.coaching_someone_through_failure
    competency_key: mentoring
    topic: "Supporting a person after a setback"
    difficulty: medium
    text: "Someone on your team made a mistake that affected production. How did you handle the conversation and the aftermath?"
    expected_concepts:
      - "facts first"
      - "blameless framing"
      - "learning"
      - "support"
      - "process fix"
    rubric:
      excellent: "Establishes facts, frames around process, supports the person and fixes systems."
      good: "Describes handling."
      weak: "Assigned blame."
    followups:
      - "What did you say first?"
      - "What changed in process?"
    common_errors:
      - "Assigned blame."

  - external_key: resume_screening.leadership_claims.measuring_team_health
    competency_key: people_management
    topic: "Understanding team health"
    difficulty: easy
    text: "How did you find out how your team was really doing, beyond delivery numbers?"
    expected_concepts:
      - "surveys"
      - "one-to-ones"
      - "retrospectives"
      - "observation"
      - "action"
    rubric:
      excellent: "Uses several sources and acts on findings visibly."
      good: "Describes sources."
      weak: "Relies on delivery numbers."
    followups:
      - "What did you act on?"
      - "What was surprising?"
    common_errors:
      - "Relies on delivery numbers."

  - external_key: resume_screening.leadership_claims.leadership_style_adapting
    competency_key: leadership
    topic: "Adapting your approach"
    difficulty: hard
    text: "Describe two team members who needed quite different leadership from you. What did you do differently for each?"
    expected_concepts:
      - "individual needs"
      - "autonomy"
      - "support"
      - "goals"
      - "results"
    rubric:
      excellent: "Describes adjusting autonomy and support based on work context, with outcomes."
      good: "Describes differences."
      weak: "Treats everyone the same way."
    followups:
      - "How did you know what each needed?"
      - "What would you change?"
    common_errors:
      - "Treats everyone the same way."

  - external_key: resume_screening.leadership_claims.impact_through_others
    competency_key: ownership
    topic: "Results achieved through the team"
    difficulty: hard
    text: "Which result on your resume came mainly from your team rather than your own hands, and what exactly did you contribute to it?"
    expected_concepts:
      - "team's work"
      - "leader's contribution such as clarity and unblocking"
      - "evidence"
      - "recognition"
      - "limits"
    rubric:
      excellent: "Separates team execution from the lead's specific contribution with evidence."
      good: "Describes contribution."
      weak: "Takes credit for the team's work."
    followups:
      - "What would not have happened without you?"
      - "What did others do?"
    common_errors:
      - "Takes credit for the team's work."

  - external_key: resume_screening.leadership_claims.meeting_load_reduction
    competency_key: communication
    topic: "Reducing meeting overhead"
    difficulty: easy
    text: "You changed how your team communicated or met. What did you stop, and what did the team gain?"
    expected_concepts:
      - "audit of meetings"
      - "written alternatives"
      - "decision points"
      - "feedback"
      - "result"
    rubric:
      excellent: "Audits meetings, replaces some with written updates and gathers feedback and results."
      good: "Describes changes."
      weak: "Added more meetings."
    followups:
      - "Which meeting did you remove?"
      - "How did you measure it?"
    common_errors:
      - "Added more meetings."

  - external_key: resume_screening.leadership_claims.interview_panel_training
    competency_key: people_management
    topic: "Training interviewers"
    difficulty: easy
    text: "You helped others become better interviewers or reviewers. What did you teach them?"
    expected_concepts:
      - "structured questions"
      - "evidence"
      - "bias awareness"
      - "calibration"
      - "feedback"
    rubric:
      excellent: "Teaches evidence-based, job-related evaluation and calibrates with them."
      good: "Describes training."
      weak: "Told them to trust their gut."
    followups:
      - "What common mistake did you correct?"
      - "How did you calibrate?"
    common_errors:
      - "Told them to trust their gut."
