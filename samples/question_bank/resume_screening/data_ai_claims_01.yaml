# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [data, data_analyst, data_scientist, ml, llm]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.data_ai_claims.pipeline_built_scope
    competency_key: data_engineering
    topic: "Data pipeline you built"
    difficulty: easy
    text: "Your resume says you built a data pipeline. Walk me through where the data came from, what happened to it on the way, and who relied on the output."
    expected_concepts:
      - "sources and volumes"
      - "transformation steps"
      - "storage target"
      - "consumers and their needs"
      - "the candidate's own part"
    rubric:
      excellent: "Describes sources, transformations, destination and named consumers, and states exactly which parts they built."
      good: "Describes the flow with limited detail on consumers."
      weak: "Says \"ETL pipeline\" without being able to describe stages or users."
    followups:
      - "What was the biggest source of trouble?"
      - "How did you know consumers were happy?"
    common_errors:
      - "Says \"ETL pipeline\" without being able to describe stages or users."

  - external_key: resume_screening.data_ai_claims.dashboard_adoption
    competency_key: data_visualization
    topic: "Dashboards people used"
    difficulty: easy
    text: "You built dashboards. Which one did people actually use to make a decision, and how do you know?"
    expected_concepts:
      - "audience and question"
      - "design choices"
      - "usage evidence"
      - "decision it influenced"
      - "retired dashboards"
    rubric:
      excellent: "Names a dashboard tied to a decision, gives usage evidence and describes retiring unused ones."
      good: "Describes dashboards with some usage."
      weak: "Counts dashboards built rather than decisions supported."
    followups:
      - "What did you remove from it?"
      - "Who asked for changes?"
    common_errors:
      - "Counts dashboards built rather than decisions supported."

  - external_key: resume_screening.data_ai_claims.model_shipped_to_production
    competency_key: machine_learning
    topic: "Model that reached production"
    difficulty: easy
    text: "Your resume mentions a model you shipped. What business decision or product behaviour did it change, and what did you compare it against?"
    expected_concepts:
      - "use of the model's output"
      - "baseline comparison"
      - "evaluation metric chosen"
      - "deployment path"
      - "impact"
    rubric:
      excellent: "Ties the model to a decision, compares against a simple baseline with an appropriate metric and shows impact after launch."
      good: "Describes the model and its metric."
      weak: "Reports offline accuracy only."
    followups:
      - "What was the baseline?"
      - "How did you know it helped after launch?"
    common_errors:
      - "Reports offline accuracy only."

  - external_key: resume_screening.data_ai_claims.sql_analysis_insight
    competency_key: data_analysis
    topic: "Analysis that changed a decision"
    difficulty: easy
    text: "Pick an analysis from your resume that changed what a team did. What was the question, and what in the data convinced people?"
    expected_concepts:
      - "framing the question"
      - "data used"
      - "method"
      - "presentation to decision makers"
      - "resulting action"
    rubric:
      excellent: "States the question clearly, explains the method and data checks, and the action taken as a result."
      good: "Describes the analysis and an outcome."
      weak: "Describes producing numbers with no decision attached."
    followups:
      - "Who pushed back?"
      - "What was the first number you checked for errors?"
    common_errors:
      - "Describes producing numbers with no decision attached."

  - external_key: resume_screening.data_ai_claims.metric_definition_work
    competency_key: data_analysis
    topic: "Defining a metric"
    difficulty: easy
    text: "You defined or standardised a business metric. What disagreements arose about the definition, and how were they settled?"
    expected_concepts:
      - "competing definitions"
      - "edge cases"
      - "stakeholder alignment"
      - "documentation"
      - "monitoring changes"
    rubric:
      excellent: "Describes real disagreements, how edge cases were decided, and documentation that keeps the definition stable."
      good: "Describes the metric and a resolution."
      weak: "Picked a definition alone."
    followups:
      - "What edge case mattered most?"
      - "How do you tell people when it changes?"
    common_errors:
      - "Picked a definition alone."

  - external_key: resume_screening.data_ai_claims.ab_test_you_ran
    competency_key: statistics_experimentation
    topic: "Experiment design"
    difficulty: medium
    text: "You ran an A/B test. How did you decide the sample size and duration, and what would have made you ignore a positive result?"
    expected_concepts:
      - "effect size and power"
      - "randomisation"
      - "guardrail metrics"
      - "peeking and multiple comparisons"
      - "novelty effects"
    rubric:
      excellent: "Sizes the test using expected effect and variance, defines metrics beforehand and names reasons to distrust a result."
      good: "Describes the test and basic checks."
      weak: "Stopped when the result looked significant."
    followups:
      - "What guardrail metric did you use?"
      - "How did you check randomisation?"
    common_errors:
      - "Stopping a test as soon as significance appears."

  - external_key: resume_screening.data_ai_claims.data_quality_checks
    competency_key: data_engineering
    topic: "Data quality"
    difficulty: easy
    text: "You added data quality checks. Describe an issue they caught, and one they missed."
    expected_concepts:
      - "check types"
      - "severity handling"
      - "alert routes"
      - "missed case"
      - "improvement"
    rubric:
      excellent: "Gives real examples of caught and missed issues and how checks changed afterwards."
      good: "Describes checks and a caught example."
      weak: "Lists tools but no examples."
    followups:
      - "What happened to bad data when a check failed?"
      - "Who got alerted?"
    common_errors:
      - "Lists tools but no examples."

  - external_key: resume_screening.data_ai_claims.warehouse_migration
    competency_key: data_engineering
    topic: "Warehouse or platform migration"
    difficulty: medium
    text: "You migrated analytics to a new warehouse or platform. How did you check that numbers matched the old system?"
    expected_concepts:
      - "reconciliation of totals"
      - "tolerance rules"
      - "differences found"
      - "stakeholder sign-off"
      - "parallel run"
    rubric:
      excellent: "Reconciles systematically, investigates differences, runs in parallel and gets sign-off from users."
      good: "Describes some validation."
      weak: "Spot-checked a few dashboards."
    followups:
      - "What difference was the hardest to explain?"
      - "How long did you run both?"
    common_errors:
      - "Spot-checked a few dashboards."

  - external_key: resume_screening.data_ai_claims.pipeline_cost_runtime
    competency_key: data_engineering
    topic: "Pipeline performance and cost"
    difficulty: medium
    text: "You made a data job faster or cheaper. What did the job spend its time on, and what did you change?"
    expected_concepts:
      - "profiling the job"
      - "partitioning and file layout"
      - "joins and skew"
      - "resource settings"
      - "measured gain"
    rubric:
      excellent: "Profiles the job, finds skew or layout issues, makes targeted changes and compares runtime and cost."
      good: "Describes the change and gain."
      weak: "Added more compute."
    followups:
      - "Which stage dominated?"
      - "What did you check about correctness?"
    common_errors:
      - "Added more compute."

  - external_key: resume_screening.data_ai_claims.feature_engineering_story
    competency_key: machine_learning
    topic: "Features that mattered"
    difficulty: medium
    text: "Your resume mentions feature work. Tell me about a feature that improved the model and how you made sure it was available in the same form at prediction time."
    expected_concepts:
      - "feature idea and evidence"
      - "leakage risk"
      - "training-serving consistency"
      - "maintenance"
      - "measured gain"
    rubric:
      excellent: "Explains the feature rationale, avoids leakage, ensures consistency at serving and shows the gain."
      good: "Describes the feature and the gain."
      weak: "Added features until the metric rose."
    followups:
      - "How did you check for leakage?"
      - "Who maintained the pipeline?"
    common_errors:
      - "Added features until the metric rose."

  - external_key: resume_screening.data_ai_claims.model_monitoring_drift
    competency_key: mlops
    topic: "Monitoring models in production"
    difficulty: medium
    text: "You monitored a model after launch. What did you watch, and what happened when it started to degrade?"
    expected_concepts:
      - "input and output monitoring"
      - "delayed labels"
      - "thresholds"
      - "response plan"
      - "retraining criteria"
    rubric:
      excellent: "Monitors inputs, outputs and delayed outcomes, defines thresholds and a response plan, and gives a real degradation."
      good: "Describes monitoring and retraining."
      weak: "Retrains on a fixed schedule with no monitoring."
    followups:
      - "How long until labels arrived?"
      - "What triggered retraining?"
    common_errors:
      - "Retrains on a fixed schedule with no monitoring."

  - external_key: resume_screening.data_ai_claims.rag_feature_built
    competency_key: llm_engineering
    topic: "Retrieval-based assistant"
    difficulty: medium
    text: "You built an assistant that answers from documents. How did you check answers were grounded, and what failures did you find in the retrieval step?"
    expected_concepts:
      - "chunking and retrieval choices"
      - "evaluation set"
      - "grounding checks and citations"
      - "failure analysis"
      - "iteration"
    rubric:
      excellent: "Builds an evaluation set, separates retrieval and generation errors, and iterates on specific failures."
      good: "Describes the pipeline and a few checks."
      weak: "Judges quality by trying a few questions."
    followups:
      - "What was the commonest retrieval failure?"
      - "How big was the evaluation set?"
    common_errors:
      - "Judges quality by trying a few questions."

  - external_key: resume_screening.data_ai_claims.prompt_evaluation_process
    competency_key: llm_engineering
    topic: "Prompt and model evaluation"
    difficulty: medium
    text: "You worked on prompts for a production feature. How did you tell that a new prompt was better and not just different?"
    expected_concepts:
      - "test set"
      - "metrics or rubric"
      - "human or model grading"
      - "regression checks"
      - "versioning"
    rubric:
      excellent: "Maintains a test set, uses defined criteria, checks regressions and versions prompts."
      good: "Describes comparisons."
      weak: "Compared a few outputs by eye."
    followups:
      - "Who graded outputs?"
      - "How did you handle model updates?"
    common_errors:
      - "Compared a few outputs by eye."

  - external_key: resume_screening.data_ai_claims.llm_cost_latency
    competency_key: llm_engineering
    topic: "Cost and latency of language models"
    difficulty: medium
    text: "You reduced the cost or latency of a language model feature. What did you try and what quality did you give up?"
    expected_concepts:
      - "measuring cost per request"
      - "caching and routing"
      - "smaller models"
      - "prompt length"
      - "quality measurement"
    rubric:
      excellent: "Measures first, tries targeted changes, and quantifies any quality loss."
      good: "Describes changes and savings."
      weak: "Switched to a smaller model without evaluation."
    followups:
      - "How was quality checked after?"
      - "What was the cost per request before and after?"
    common_errors:
      - "Switched to a smaller model without evaluation."

  - external_key: resume_screening.data_ai_claims.hallucination_guardrails
    competency_key: llm_engineering
    topic: "Hallucination and safety controls"
    difficulty: hard
    text: "Your resume mentions guardrails for a language model feature. Describe a bad output that reached or nearly reached users and what you changed."
    expected_concepts:
      - "failure example"
      - "detection methods"
      - "mitigation layers"
      - "limits of guardrails"
      - "monitoring"
    rubric:
      excellent: "Describes a concrete bad output, layered mitigation and acknowledges what remains uncovered."
      good: "Describes guardrails and an example."
      weak: "Claims the model does not hallucinate."
    followups:
      - "How did you find it?"
      - "What is still possible?"
    common_errors:
      - "Claims the model does not hallucinate."

  - external_key: resume_screening.data_ai_claims.forecast_accuracy
    competency_key: statistics_experimentation
    topic: "Forecasting claims"
    difficulty: medium
    text: "You built forecasts. How did you measure accuracy over time, and how did you decide when the model was good enough to use?"
    expected_concepts:
      - "backtesting"
      - "error metrics"
      - "baselines"
      - "business use"
      - "monitoring"
    rubric:
      excellent: "Backtests against naive baselines, chooses metrics tied to use and tracks accuracy in production."
      good: "Describes metrics and accuracy."
      weak: "Quotes in-sample fit."
    followups:
      - "What baseline did you beat?"
      - "When did it fail?"
    common_errors:
      - "Quotes in-sample fit."

  - external_key: resume_screening.data_ai_claims.churn_or_scoring_model
    competency_key: machine_learning
    topic: "Prediction model for decisions"
    difficulty: medium
    text: "You built a model that scores customers or items. How did the business use the scores, and what error was more costly for them?"
    expected_concepts:
      - "action tied to score"
      - "threshold choice"
      - "cost of false positives and negatives"
      - "evaluation"
      - "fairness checks"
    rubric:
      excellent: "Links threshold to costs, evaluates with relevant metrics and checks performance across groups."
      good: "Describes use and metrics."
      weak: "Reports AUC only."
    followups:
      - "Who acted on the scores?"
      - "How did you pick the threshold?"
    common_errors:
      - "Reports AUC only."

  - external_key: resume_screening.data_ai_claims.notebook_to_production
    competency_key: mlops
    topic: "Productionising notebooks"
    difficulty: medium
    text: "You turned research code or notebooks into a production job. What had to change?"
    expected_concepts:
      - "reproducibility"
      - "testing"
      - "configuration"
      - "data access"
      - "scheduling and monitoring"
    rubric:
      excellent: "Describes refactoring, tests, pinned environments, monitoring and scheduling."
      good: "Describes packaging."
      weak: "Ran the notebook on a schedule."
    followups:
      - "What broke first in production?"
      - "How did you version data?"
    common_errors:
      - "Ran the notebook on a schedule."

  - external_key: resume_screening.data_ai_claims.experiment_platform_metrics
    competency_key: statistics_experimentation
    topic: "Experimentation systems"
    difficulty: hard
    text: "You worked on experimentation tooling or analysis at scale. What mistakes in other teams' experiments did you most often have to correct?"
    expected_concepts:
      - "common errors such as peeking and sample ratio mismatch"
      - "guardrails"
      - "education"
      - "automated checks"
      - "governance"
    rubric:
      excellent: "Names common errors with examples, builds automated checks and trains teams."
      good: "Describes errors and tooling."
      weak: "Cannot give examples."
    followups:
      - "How did you detect sample ratio mismatch?"
      - "What check did you automate?"
    common_errors:
      - "Cannot give examples."

  - external_key: resume_screening.data_ai_claims.causal_claim_scrutiny
    competency_key: statistics_experimentation
    topic: "Claims of cause and effect"
    difficulty: hard
    text: "Your resume claims some outcome was caused by a change you made. What else could explain it, and how did you rule those out?"
    expected_concepts:
      - "confounders"
      - "comparison group"
      - "timing effects"
      - "sensitivity checks"
      - "communication of uncertainty"
    rubric:
      excellent: "Lists alternative explanations, uses comparisons or experiments and communicates uncertainty."
      good: "Considers some alternatives."
      weak: "Attributes the change to their work from the timing."
    followups:
      - "What would convince you it was not your change?"
      - "What control did you have?"
    common_errors:
      - "Attributes the change to their work from the timing."

  - external_key: resume_screening.data_ai_claims.training_data_labeling
    competency_key: machine_learning
    topic: "Labels and training data"
    difficulty: medium
    text: "You prepared training data or labels. How did you check label quality, and what did poor labels cost you?"
    expected_concepts:
      - "guidelines"
      - "agreement measurement"
      - "sample audits"
      - "effect on model"
      - "correction process"
    rubric:
      excellent: "Writes guidelines, measures agreement, audits samples and quantifies the effect."
      good: "Describes labelling and checks."
      weak: "Assumed labels were right."
    followups:
      - "How did labellers disagree?"
      - "What did you re-label?"
    common_errors:
      - "Assumed labels were right."

  - external_key: resume_screening.data_ai_claims.self_service_analytics
    competency_key: data_visualization
    topic: "Enabling others with data"
    difficulty: hard
    text: "You made data accessible for non-analysts. What wrong conclusions did people draw from it, and what did you change?"
    expected_concepts:
      - "semantic layer"
      - "documentation"
      - "training"
      - "misuse"
      - "governance"
    rubric:
      excellent: "Gives real misinterpretations and describes definitions, documentation and training changes."
      good: "Describes self-service."
      weak: "Counts users onboarded."
    followups:
      - "Which metric was misread?"
      - "How did you find out?"
    common_errors:
      - "Counts users onboarded."

  - external_key: resume_screening.data_ai_claims.sql_performance_warehouse
    competency_key: sql
    topic: "Query optimisation in analytics"
    difficulty: easy
    text: "You tuned analytical SQL. Tell me about the slowest query you improved and what made it slow."
    expected_concepts:
      - "reading the plan"
      - "joins and scans"
      - "partitioning or indexing"
      - "rewriting"
      - "result"
    rubric:
      excellent: "Explains the plan, the cause and the change with before and after time."
      good: "Describes the change."
      weak: "Cannot describe the cause."
    followups:
      - "What was the data size?"
      - "What changed in the plan?"
    common_errors:
      - "Cannot describe the cause."

  - external_key: resume_screening.data_ai_claims.stakeholder_report_automation
    competency_key: communication
    topic: "Reports and communication"
    difficulty: easy
    text: "You automated or improved reporting for stakeholders. What did they ask for that you decided not to include, and why?"
    expected_concepts:
      - "understanding needs"
      - "simplification"
      - "handling requests"
      - "trust"
      - "feedback"
    rubric:
      excellent: "Explains decisions about scope with stakeholder reasoning and feedback."
      good: "Describes reports."
      weak: "Included everything requested."
    followups:
      - "Who read it most?"
      - "What did you add later?"
    common_errors:
      - "Included everything requested."

  - external_key: resume_screening.data_ai_claims.owning_end_to_end_ml
    competency_key: ownership
    topic: "End-to-end model ownership"
    difficulty: hard
    text: "Choose a model or data product you carried from idea to production. Which stage took longest, and which decision of yours mattered most?"
    expected_concepts:
      - "stages"
      - "time allocation"
      - "key decision"
      - "collaboration"
      - "outcome"
    rubric:
      excellent: "Gives time per stage, a pivotal decision with reasoning and the collaboration involved."
      good: "Describes the path."
      weak: "Describes only modelling."
    followups:
      - "What did you underestimate?"
      - "Who else was involved?"
    common_errors:
      - "Describes only modelling."
