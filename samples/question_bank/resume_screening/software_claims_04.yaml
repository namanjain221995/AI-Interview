# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [backend, frontend, fullstack, mobile, qa]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.software_claims.owned_oncall_rotation
    competency_key: incident_response
    topic: "On-call experience"
    difficulty: easy
    text: "Your resume mentions being on call for what you built. Walk me through the most disruptive page you received and how you handled it."
    expected_concepts:
      - "how the alert reached them"
      - "triage steps"
      - "mitigation versus root fix"
      - "communication"
      - "follow-up changes"
    rubric:
      excellent: "Narrates triage, a quick mitigation, communication to affected parties and a lasting fix."
      good: "Describes the page and resolution with limited follow-up."
      weak: "Cannot describe a concrete page or relied on someone else."
    followups:
      - "What would have made that page unnecessary?"
      - "Who did you wake up and why?"
    common_errors:
      - "Cannot describe a concrete page or relied on someone else."

  - external_key: resume_screening.software_claims.release_frequency_improvement
    competency_key: ci_cd
    topic: "Faster delivery claims"
    difficulty: easy
    text: "You mention increasing release frequency. What was blocking more frequent releases, and what did you do about the biggest blocker?"
    expected_concepts:
      - "identifying blockers such as manual steps or tests"
      - "the main change"
      - "effect on release size and risk"
      - "safeguards added"
      - "team reaction"
    rubric:
      excellent: "Finds the real blockers, fixes the biggest and shows frequency and failure rate both measured."
      good: "Describes the change and a better cadence."
      weak: "Releases more often but cannot show change failure rate."
    followups:
      - "Did failures increase?"
      - "How big was a typical release before and after?"
    common_errors:
      - "Releases more often but cannot show change failure rate."

  - external_key: resume_screening.software_claims.debugging_across_services
    competency_key: debugging
    topic: "Tracing across services"
    difficulty: medium
    text: "Describe a bug on your resume that spanned several services or layers. How did you work out which part was actually at fault?"
    expected_concepts:
      - "reproducing end to end"
      - "correlation ids and traces"
      - "binary search of the path"
      - "evidence for cause"
      - "fix location"
    rubric:
      excellent: "Uses traces or logs to isolate the faulty component methodically, proves the cause and fixes it at the right place."
      good: "Finds the cause with some systematic steps."
      weak: "Guessed and changed several components."
    followups:
      - "What did the logs lack?"
      - "What did you add so the next search is shorter?"
    common_errors:
      - "Guessed and changed several components."

  - external_key: resume_screening.software_claims.schema_change_no_downtime
    competency_key: databases
    topic: "Changing live data structures"
    difficulty: medium
    text: "You changed a database structure while the system was live. How did you order the steps so old and new code could both run?"
    expected_concepts:
      - "expand and contract pattern"
      - "backward-compatible changes"
      - "backfilling in batches"
      - "deployment ordering"
      - "verification"
    rubric:
      excellent: "Explains additive changes first, dual compatibility during rollout, batched backfill and cleanup afterward."
      good: "Describes a safe sequence with minor gaps."
      weak: "Applied a change and deployed together, accepting downtime."
    followups:
      - "What if the deployment was rolled back midway?"
      - "How big was the backfill?"
    common_errors:
      - "Applied a change and deployed together, accepting downtime."

  - external_key: resume_screening.software_claims.api_versioning_breaking
    competency_key: api_design
    topic: "Breaking changes"
    difficulty: medium
    text: "Your resume mentions evolving a public or shared interface. Tell me about a change that threatened to break consumers and how you avoided it."
    expected_concepts:
      - "spotting breaking changes"
      - "additive evolution"
      - "versioning or feature negotiation"
      - "communication"
      - "deprecation schedule"
    rubric:
      excellent: "Identifies the break in advance, offers a compatible path, informs consumers and tracks old usage down."
      good: "Describes versioning and communication generally."
      weak: "Changed it and told consumers afterward."
    followups:
      - "How did you know who used the old field?"
      - "When did the old path finally go away?"
    common_errors:
      - "Changed it and told consumers afterward."

  - external_key: resume_screening.software_claims.error_handling_resilience
    competency_key: distributed_systems
    topic: "Resilience patterns"
    difficulty: medium
    text: "You list making a system more resilient. Which failure did you design for, and how did you test that the design worked?"
    expected_concepts:
      - "realistic failure modes"
      - "timeouts, retries and circuit breaking"
      - "graceful degradation"
      - "fault injection or drills"
      - "observed result"
    rubric:
      excellent: "Names the failure, applies appropriate patterns, tests with injected faults and reports behaviour observed."
      good: "Describes patterns used and a basic test."
      weak: "Added retries everywhere without considering overload."
    followups:
      - "Could the retries have made it worse?"
      - "What did users see during degradation?"
    common_errors:
      - "Adding retries without limits."

  - external_key: resume_screening.software_claims.team_standards_introduced
    competency_key: code_quality
    topic: "Introducing team standards"
    difficulty: easy
    text: "You introduced a coding standard, template or tool for the team. How did you decide on the rules, and which one did people complain about most?"
    expected_concepts:
      - "involving the team"
      - "automated enforcement"
      - "exceptions"
      - "handling complaints"
      - "checking value"
    rubric:
      excellent: "Builds rules with the team, automates enforcement and adjusts based on complaints and evidence."
      good: "Describes the standard and some buy-in."
      weak: "Imposed rules without discussion."
    followups:
      - "What rule did you drop?"
      - "Did it change defects?"
    common_errors:
      - "Imposed rules without discussion."

  - external_key: resume_screening.software_claims.customer_issue_resolution
    competency_key: communication
    topic: "Customer-facing technical issue"
    difficulty: easy
    text: "Tell me about a customer-reported problem you worked on that is mentioned on your resume. How did you balance fixing it fast with understanding the cause?"
    expected_concepts:
      - "gathering facts from the customer"
      - "interim workaround"
      - "root cause search"
      - "communication of status"
      - "preventive follow-up"
    rubric:
      excellent: "Offers a workaround quickly, investigates the cause in parallel, keeps the customer informed and prevents recurrence."
      good: "Describes resolution and communication with limited prevention."
      weak: "Closed the ticket after the workaround."
    followups:
      - "What did you tell the customer and when?"
      - "How did the issue first reach engineering?"
    common_errors:
      - "Closed the ticket after the workaround."

  - external_key: resume_screening.software_claims.sdk_library_built
    competency_key: api_design
    topic: "Reusable library or SDK"
    difficulty: medium
    text: "You wrote a library or SDK used by other developers. What did you do to make it hard to misuse, and how did you learn how people actually used it?"
    expected_concepts:
      - "simple defaults and clear errors"
      - "documentation and examples"
      - "backward compatibility"
      - "feedback channels"
      - "usage telemetry or support questions"
    rubric:
      excellent: "Designs for safe use, writes examples, preserves compatibility and uses feedback to simplify the interface."
      good: "Describes the interface and documentation."
      weak: "Wrote a library to meet internal needs without considering other users."
    followups:
      - "What did people misuse?"
      - "What did you remove?"
    common_errors:
      - "Wrote a library to meet internal needs without considering other users."

  - external_key: resume_screening.software_claims.infinite_scroll_ui_issue
    competency_key: frontend_react
    topic: "UI state and rendering bug"
    difficulty: medium
    text: "Your resume mentions complex front-end behaviour, such as large lists or forms. Describe a rendering or state bug that was hard to find and what finally explained it."
    expected_concepts:
      - "reproduction in the browser"
      - "tools such as profiler and devtools"
      - "state flow understanding"
      - "root cause"
      - "guard against recurrence"
    rubric:
      excellent: "Narrows down with browser tooling, explains the state or render cause and adds a test or lint to guard."
      good: "Explains the cause and fix."
      weak: "Wrapped the problem with workarounds without understanding."
    followups:
      - "How did you reproduce it reliably?"
      - "Did a test cover it afterwards?"
    common_errors:
      - "Wrapped the problem with workarounds without understanding."

  - external_key: resume_screening.software_claims.file_upload_processing
    competency_key: system_design
    topic: "Uploads and file processing"
    difficulty: medium
    text: "You built file upload or document processing. What did you do about large files, malicious files and processing failures?"
    expected_concepts:
      - "size limits and streaming"
      - "content validation and scanning"
      - "storage location"
      - "asynchronous processing with status"
      - "retries and cleanup"
    rubric:
      excellent: "Handles size, validates content, isolates storage, processes asynchronously with status feedback and cleans up on failure."
      good: "Covers limits and basic validation."
      weak: "Trusts file names and types from clients."
    followups:
      - "What happened to a half-uploaded file?"
      - "How did you scan files?"
    common_errors:
      - "Trusts file names and types from clients."

  - external_key: resume_screening.software_claims.analytics_event_tracking
    competency_key: data_analysis
    topic: "Tracking and metrics instrumentation"
    difficulty: easy
    text: "You added analytics or event tracking to a product. How did you decide which events to track, and how did you verify the data was correct?"
    expected_concepts:
      - "questions driving the event list"
      - "naming and schema"
      - "testing instrumentation"
      - "data validation against other sources"
      - "privacy considerations"
    rubric:
      excellent: "Starts from decisions that need data, defines a schema, validates against other sources and considers privacy."
      good: "Lists events and some validation."
      weak: "Tracked everything without a purpose."
    followups:
      - "What number turned out wrong?"
      - "Which events were never used?"
    common_errors:
      - "Tracked everything without a purpose."

  - external_key: resume_screening.software_claims.accessibility_device_coverage
    competency_key: mobile_development
    topic: "Supporting many devices"
    difficulty: easy
    text: "Your resume mentions supporting many devices or browsers. How did you decide which ones to support and how did you test them?"
    expected_concepts:
      - "choosing by usage data"
      - "support policy"
      - "test matrix and cloud devices"
      - "handling differences"
      - "cost of support"
    rubric:
      excellent: "Uses analytics to define support, builds a pragmatic matrix and manages cost with a clear policy."
      good: "Lists supported platforms and testing."
      weak: "Tried to test everything or tested on one device."
    followups:
      - "What was the strangest device bug?"
      - "When did you drop support for something?"
    common_errors:
      - "Tried to test everything or tested on one device."

  - external_key: resume_screening.software_claims.senior_engineer_scope
    competency_key: ownership
    topic: "Scope growth in a role"
    difficulty: medium
    text: "Your resume shows your scope growing over time in the same area. What responsibility did you take on that was not in your original description, and how did it come about?"
    expected_concepts:
      - "spotting needs"
      - "volunteering or being asked"
      - "handling added load"
      - "results"
      - "relationships formed"
    rubric:
      excellent: "Describes a specific expansion, the process of taking it on safely and its result."
      good: "Describes extra responsibility in general."
      weak: "Lists a title change without concrete responsibilities."
    followups:
      - "What did you stop doing to make room?"
      - "Who sponsored the change?"
    common_errors:
      - "Lists a title change without concrete responsibilities."

  - external_key: resume_screening.software_claims.wasted_work_cancelled_project
    competency_key: adaptability
    topic: "Project that was cancelled"
    difficulty: medium
    text: "Has any project on your resume been cancelled or changed direction? What did you do with the work, and what did you take from it?"
    expected_concepts:
      - "reaction and communication"
      - "salvaging reusable parts"
      - "learning"
      - "adjusting plans"
      - "relationships"
    rubric:
      excellent: "Handles change constructively, salvages value, records lessons and moves on to the next priority."
      good: "Describes the event and a lesson."
      weak: "Cannot recall one or blames others."
    followups:
      - "What part of it survived?"
      - "What signals did you miss?"
    common_errors:
      - "Cannot recall one or blames others."

  - external_key: resume_screening.software_claims.estimate_time_saved_roi
    competency_key: ownership
    topic: "Business value of engineering work"
    difficulty: hard
    text: "Pick a technical project on your resume and tell me what business value it created, how that was measured, and who confirmed it."
    expected_concepts:
      - "link from work to a business goal"
      - "metric chosen"
      - "source of measurement"
      - "independent confirmation"
      - "attribution limits"
    rubric:
      excellent: "Connects the project to a goal with a metric from a reliable source, with confirmation from stakeholders and caution about attribution."
      good: "Describes the value and some data."
      weak: "Describes technical work without any business link."
    followups:
      - "What else could have caused that change?"
      - "Who owned the metric?"
    common_errors:
      - "Describes technical work without any business link."

  - external_key: resume_screening.software_claims.tough_trade_off_quality_speed
    competency_key: problem_solving
    topic: "Quality versus speed"
    difficulty: hard
    text: "Describe a time you shipped something you knew had weaknesses. How did you decide it was acceptable, and how did you limit the damage?"
    expected_concepts:
      - "weighing risk against value"
      - "communicating known limits"
      - "monitoring and mitigation"
      - "plan to repay"
      - "outcome"
    rubric:
      excellent: "States the weaknesses explicitly, shares them with stakeholders, adds monitoring and follows through on repayment."
      good: "Describes the decision and mitigation."
      weak: "Hid the weaknesses or cannot describe any."
    followups:
      - "What was the trigger to go back and fix it?"
      - "Who agreed to the risk?"
    common_errors:
      - "Hid the weaknesses or cannot describe any."

  - external_key: resume_screening.software_claims.security_review_findings
    competency_key: security
    topic: "Handling review findings"
    difficulty: hard
    text: "Your resume mentions passing a security review or audit. What was the most serious finding, and how did you decide what to fix first?"
    expected_concepts:
      - "understanding the finding"
      - "risk ranking"
      - "remediation and verification"
      - "handling disagreement"
      - "process changes"
    rubric:
      excellent: "Ranks findings by risk, fixes with verification and changes practices that produced them."
      good: "Describes findings and fixes."
      weak: "Fixed in order listed or argued against findings."
    followups:
      - "Which finding did you disagree with?"
      - "How did you confirm the fix?"
    common_errors:
      - "Fixed in order listed or argued against findings."

  - external_key: resume_screening.software_claims.team_conflict_technical_choice
    competency_key: collaboration
    topic: "Resolving technical conflict"
    difficulty: hard
    text: "Tell me about a technical disagreement within your team that was not easily resolved. How did you contribute to getting to a decision everyone could work with?"
    expected_concepts:
      - "understanding positions"
      - "using data or experiments"
      - "decision-making mechanism"
      - "commitment after decision"
      - "relationship repair"
    rubric:
      excellent: "Frames the disagreement around criteria, uses data or a spike, agrees on who decides and supports the outcome."
      good: "Describes the disagreement and a resolution."
      weak: "Describes winning an argument."
    followups:
      - "Was the decision later proven right?"
      - "What if you had lost?"
    common_errors:
      - "Describes winning an argument."

  - external_key: resume_screening.software_claims.system_you_would_rebuild
    competency_key: system_design
    topic: "Redesign with hindsight"
    difficulty: hard
    text: "If you could rebuild your largest system today with no constraints on time, what would you keep, what would you change, and what would you still avoid doing?"
    expected_concepts:
      - "identifying valuable parts"
      - "known weaknesses"
      - "new design ideas"
      - "costs of changes"
      - "restraint against over-engineering"
    rubric:
      excellent: "Separates what worked from what did not, proposes specific changes with costs and shows restraint."
      good: "Gives a list of changes with some reasoning."
      weak: "Proposes buzzword-heavy rewrite."
    followups:
      - "What would you not touch?"
      - "Which change gives most value first?"
    common_errors:
      - "Proposes buzzword-heavy rewrite."

  - external_key: resume_screening.software_claims.reading_unfamiliar_code
    competency_key: debugging
    topic: "Navigating unfamiliar code"
    difficulty: easy
    text: "Think of a bug you fixed in code you did not write and knew nothing about. How did you find the right place?"
    expected_concepts:
      - "reproducing"
      - "reading from the symptom"
      - "tools such as search and debugger"
      - "asking others"
      - "confirming the fix"
    rubric:
      excellent: "Starts from a reproduction, follows the code path with tooling, asks targeted questions and confirms with a test."
      good: "Finds the place by searching and reading."
      weak: "Randomly changed things until it worked."
    followups:
      - "Who did you ask?"
      - "What test did you write?"
    common_errors:
      - "Randomly changed things until it worked."

  - external_key: resume_screening.software_claims.cleaning_data_quality_app
    competency_key: data_analysis
    topic: "Data quality in applications"
    difficulty: medium
    text: "You mention fixing data quality problems in an application. What kinds of bad data did you find, and what stops them arriving again?"
    expected_concepts:
      - "sources of bad data"
      - "validation at input"
      - "constraints in storage"
      - "cleanup job design"
      - "monitoring"
    rubric:
      excellent: "Classifies the sources, adds validation and constraints at the right layer, cleans safely and monitors."
      good: "Describes cleanup and validation."
      weak: "Cleaned data once without prevention."
    followups:
      - "What was the commonest form of bad data?"
      - "How did you avoid deleting good data?"
    common_errors:
      - "Cleaned data once without prevention."

  - external_key: resume_screening.software_claims.improved_onboarding_docs_runbook
    competency_key: communication
    topic: "Runbooks and setup guides"
    difficulty: easy
    text: "You mention writing runbooks or setup guides. How did you test that someone else could follow them without your help?"
    expected_concepts:
      - "writing for a newcomer"
      - "testing with a fresh person"
      - "keeping content current"
      - "location and discoverability"
      - "effect on support questions"
    rubric:
      excellent: "Has a new person follow the guide, fixes gaps found, assigns upkeep and shows fewer questions."
      good: "Describes the guide and its use."
      weak: "Wrote documents without anyone trying them."
    followups:
      - "What step was missing?"
      - "How do you know it is still right?"
    common_errors:
      - "Wrote documents without anyone trying them."

  - external_key: resume_screening.software_claims.latency_budget_user_flow
    competency_key: debugging
    topic: "Latency of a user journey"
    difficulty: medium
    text: "You say you reduced response time for an important user action. How did you split the time between client, network and server before deciding what to change?"
    expected_concepts:
      - "end-to-end timing"
      - "tracing"
      - "ranking the contributors"
      - "targeted changes"
      - "confirming with real-user data"
    rubric:
      excellent: "Breaks the journey into parts using traces, targets the biggest, and confirms with real-user data."
      good: "Describes the breakdown and a fix."
      weak: "Optimised the part they already knew."
    followups:
      - "Which part was surprisingly large?"
      - "What percentile did you track?"
    common_errors:
      - "Optimised the part they already knew."

  - external_key: resume_screening.software_claims.guarded_rollout_gone_wrong
    competency_key: incident_response
    topic: "Rollout that nearly failed"
    difficulty: hard
    text: "Tell me about a change on your resume that you rolled out gradually. What signal told you to stop or continue, and when did you almost not stop?"
    expected_concepts:
      - "rollout stages"
      - "metrics watched"
      - "thresholds"
      - "decision to halt or continue"
      - "lessons"
    rubric:
      excellent: "Defines signals and thresholds in advance, halts when they trip and reflects on pressure to continue."
      good: "Describes staged rollout and some metrics."
      weak: "Rolled out without defined signals."
    followups:
      - "Who could halt it?"
      - "What threshold would you change now?"
    common_errors:
      - "Rolled out without defined signals."
