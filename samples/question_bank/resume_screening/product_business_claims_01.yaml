# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [product_manager, project_manager, business_analyst, ux_designer, support_engineer]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.product_business_claims.launched_product_role
    competency_key: product_sense
    topic: "Product or feature launch"
    difficulty: easy
    text: "Your resume says you launched a product or feature. What problem was it for, what was your part in getting it out, and what happened in the first weeks?"
    expected_concepts:
      - "the user problem"
      - "personal role among product, design and engineering"
      - "launch plan"
      - "early results"
      - "follow-up changes"
    rubric:
      excellent: "States the user problem, separates their own contribution from the team's and reports early results with the changes they led."
      good: "Describes the launch and their role in general terms."
      weak: "Describes the launch date and activities with no user problem or result."
    followups:
      - "Who else was responsible for decisions?"
      - "What did you change after launch?"
    common_errors:
      - "Describes the launch date and activities with no user problem or result."

  - external_key: resume_screening.product_business_claims.roadmap_prioritisation
    competency_key: product_sense
    topic: "Prioritisation behind a roadmap"
    difficulty: medium
    text: "You owned or shaped a roadmap. How did you decide what to do first, and which request did you decline?"
    expected_concepts:
      - "criteria used"
      - "evidence from users and data"
      - "effort and risk"
      - "stakeholder handling"
      - "the declined item and its reasoning"
    rubric:
      excellent: "Uses explicit criteria with evidence, declines something with a clear explanation and describes how stakeholders took it."
      good: "Describes a prioritisation approach with limited detail on trade-offs."
      weak: "Ranks by who asked loudest or by gut feeling."
    followups:
      - "How did you tell the requester?"
      - "What changed your mind once?"
    common_errors:
      - "Prioritising by seniority of the requester."

  - external_key: resume_screening.product_business_claims.kpi_improvement_claim
    competency_key: data_analysis
    topic: "Metric improvement"
    difficulty: medium
    text: "You improved a product or process metric. What was the baseline, what did you change, and how do you know the change caused the difference?"
    expected_concepts:
      - "baseline and period"
      - "the change made"
      - "confounding factors"
      - "measurement"
      - "remaining uncertainty"
    rubric:
      excellent: "Provides baseline and timeframe, links the change to the effect while considering other causes."
      good: "Gives before and after figures with a plausible link."
      weak: "Quotes a percentage without baseline or other explanations."
    followups:
      - "What else changed at the same time?"
      - "Who verified the number?"
    common_errors:
      - "Quotes a percentage without baseline or other explanations."

  - external_key: resume_screening.product_business_claims.discovery_research_used
    competency_key: ux_research
    topic: "Research that shaped a decision"
    difficulty: easy
    text: "Your resume mentions user research or discovery. Tell me about one finding that changed what the team built."
    expected_concepts:
      - "method and participants"
      - "the finding"
      - "how it was shared"
      - "the decision changed"
      - "outcome"
    rubric:
      excellent: "Names the method, a surprising finding, how it was communicated and the specific change in direction."
      good: "Describes research and a finding."
      weak: "Lists research activities without any decision linked."
    followups:
      - "Who did not believe the finding?"
      - "How many users did you talk to?"
    common_errors:
      - "Lists research activities without any decision linked."

  - external_key: resume_screening.product_business_claims.usability_testing_results
    competency_key: ux_research
    topic: "Usability testing"
    difficulty: medium
    text: "You ran usability tests. How did you choose tasks and participants, and what did you do when results contradicted the design?"
    expected_concepts:
      - "task design"
      - "participant selection"
      - "observation not leading"
      - "severity rating"
      - "design changes"
    rubric:
      excellent: "Chooses realistic tasks and participants, observes without leading, prioritises issues and changes designs."
      good: "Describes tests and some changes."
      weak: "Asks users whether they like the design."
    followups:
      - "What did you change after the second round?"
      - "How did you avoid leading?"
    common_errors:
      - "Asks users whether they like the design."

  - external_key: resume_screening.product_business_claims.design_system_contribution
    competency_key: ux_design
    topic: "Design system work"
    difficulty: medium
    text: "You worked on a design system or component library. How did you decide what became a shared component, and how did engineers adopt it?"
    expected_concepts:
      - "criteria for shared components"
      - "documentation"
      - "collaboration with engineers"
      - "versioning"
      - "adoption"
    rubric:
      excellent: "Applies clear criteria, documents usage, works with engineering and measures adoption."
      good: "Describes the system."
      weak: "Created components for personal taste."
    followups:
      - "What did you reject?"
      - "How did you handle exceptions?"
    common_errors:
      - "Created components for personal taste."

  - external_key: resume_screening.product_business_claims.accessibility_design_claim
    competency_key: accessibility
    topic: "Accessible design"
    difficulty: medium
    text: "You designed for accessibility. What barriers did you find, and how did you verify the fixes with real assistive technology or users?"
    expected_concepts:
      - "standards"
      - "barrier types"
      - "testing methods"
      - "involving users"
      - "sustaining"
    rubric:
      excellent: "Names barriers, tests with assistive technology or users and builds checks into the process."
      good: "Describes standards used."
      weak: "Relies on colour contrast tools alone."
    followups:
      - "What did a real user find?"
      - "How did you keep it up?"
    common_errors:
      - "Relies on colour contrast tools alone."

  - external_key: resume_screening.product_business_claims.redesign_outcome
    competency_key: ux_design
    topic: "Redesign claim"
    difficulty: medium
    text: "You led a redesign. What evidence told you the old design was failing and what evidence told you the new one was better?"
    expected_concepts:
      - "baseline problems"
      - "research"
      - "success measures"
      - "test"
      - "results"
    rubric:
      excellent: "Defines the problem with data, measures the new design against the same measures and reports trade-offs plainly."
      good: "Describes the redesign and result."
      weak: "Judged success by stakeholder approval."
    followups:
      - "What got worse?"
      - "How long before you measured?"
    common_errors:
      - "Judged success by stakeholder approval."

  - external_key: resume_screening.product_business_claims.requirements_gathering_example
    competency_key: requirements_analysis
    topic: "Requirements work"
    difficulty: easy
    text: "You gathered requirements for a system. How did you find out what people actually needed, as opposed to what they asked for?"
    expected_concepts:
      - "stakeholder interviews"
      - "observation"
      - "clarifying questions"
      - "prioritisation"
      - "validation"
    rubric:
      excellent: "Observes real work, asks why behind requests, prioritises and validates with users."
      good: "Describes interviews and documents."
      weak: "Wrote down what was requested."
    followups:
      - "What request turned out to be different from the need?"
      - "How did you validate?"
    common_errors:
      - "Wrote down what was requested."

  - external_key: resume_screening.product_business_claims.process_improvement_savings
    competency_key: process_modeling
    topic: "Process improvement"
    difficulty: medium
    text: "You improved a business process. How did you map the current process, find the problem, and measure the improvement?"
    expected_concepts:
      - "current state mapping"
      - "bottleneck identification"
      - "redesign"
      - "measures"
      - "adoption"
    rubric:
      excellent: "Maps the current process, finds the bottleneck with data, redesigns and measures time or errors before and after."
      good: "Describes mapping and improvement."
      weak: "Documents the new process without measurement."
    followups:
      - "Where was the longest wait?"
      - "How did you handle resistance?"
    common_errors:
      - "Documents the new process without measurement."

  - external_key: resume_screening.product_business_claims.uat_coordination
    competency_key: requirements_analysis
    topic: "User acceptance testing"
    difficulty: medium
    text: "You coordinated user acceptance testing. What did users find that earlier testing did not, and how did you handle disagreements about whether it was a defect?"
    expected_concepts:
      - "test planning with users"
      - "scenarios"
      - "defect triage"
      - "disagreement resolution"
      - "sign-off"
    rubric:
      excellent: "Plans realistic scenarios, triages with clear criteria and resolves disputes against acceptance criteria."
      good: "Describes UAT steps."
      weak: "Treated UAT as a formality."
    followups:
      - "Which finding was the biggest?"
      - "How was the sign-off decided?"
    common_errors:
      - "Treated UAT as a formality."

  - external_key: resume_screening.product_business_claims.project_delivered_on_time
    competency_key: project_management
    topic: "Delivery claim"
    difficulty: hard
    text: "You delivered a project on time and budget. What did on time mean at the start, and what was cut or changed to make it?"
    expected_concepts:
      - "baseline plan"
      - "scope changes"
      - "risks"
      - "trade-offs"
      - "final result against baseline"
    rubric:
      excellent: "Compares the final result with an agreed baseline and openly describes scope changes and trade-offs."
      good: "Describes delivery and some changes."
      weak: "Claims on-time delivery with the plan having moved repeatedly."
    followups:
      - "When was the plan rebaselined?"
      - "What scope was dropped?"
    common_errors:
      - "Claims on-time delivery with the plan having moved repeatedly."

  - external_key: resume_screening.product_business_claims.project_risk_example
    competency_key: project_management
    topic: "Managing risk"
    difficulty: medium
    text: "Give an example of a risk register item that actually materialised on one of your projects. What did you do?"
    expected_concepts:
      - "identification"
      - "likelihood"
      - "mitigation"
      - "trigger"
      - "response"
    rubric:
      excellent: "Shows a risk that was identified early with a trigger and response plan, and how it played out."
      good: "Describes a risk and response."
      weak: "Maintains a register but never acts on it."
    followups:
      - "Who owned the risk?"
      - "What would you do differently?"
    common_errors:
      - "Maintains a register but never acts on it."

  - external_key: resume_screening.product_business_claims.schedule_recovery
    competency_key: project_management
    topic: "Recovering a late project"
    difficulty: hard
    text: "You took a project that was running late. How did you work out where it stood and what did you change to recover?"
    expected_concepts:
      - "accurate status"
      - "critical path"
      - "scope options"
      - "resource options"
      - "communication"
    rubric:
      excellent: "Establishes real status, uses critical path and scope or resource options and communicates revised commitments."
      good: "Describes recovery steps."
      weak: "Added overtime and kept the date."
    followups:
      - "How was the real status found?"
      - "What did the sponsor decide?"
    common_errors:
      - "Added overtime and kept the date."

  - external_key: resume_screening.product_business_claims.support_ticket_reduction
    competency_key: technical_support
    topic: "Reducing support volume"
    difficulty: easy
    text: "You reduced support ticket volume or resolution time. Which categories of tickets did you tackle, and what actually reduced them?"
    expected_concepts:
      - "ticket analysis"
      - "root causes"
      - "documentation or product fixes"
      - "measurement"
      - "sustained effect"
    rubric:
      excellent: "Categorises tickets, tackles top causes with fixes at source and measures sustained reduction."
      good: "Describes some fixes and numbers."
      weak: "Closed tickets faster without reducing causes."
    followups:
      - "Which category was biggest?"
      - "Did anything get worse?"
    common_errors:
      - "Closed tickets faster without reducing causes."

  - external_key: resume_screening.product_business_claims.csat_improvement
    competency_key: customer_communication
    topic: "Customer satisfaction claims"
    difficulty: medium
    text: "You improved customer satisfaction scores. What did customers say that drove your changes, and how did you check the score reflected real improvement?"
    expected_concepts:
      - "feedback analysis"
      - "changes"
      - "measurement validity"
      - "response rates"
      - "sustained"
    rubric:
      excellent: "Analyses comments, makes targeted changes and considers response bias and sustained effect."
      good: "Describes changes and score change."
      weak: "Quotes the score only."
    followups:
      - "What did low scores say?"
      - "How many responses?"
    common_errors:
      - "Quotes the score only."

  - external_key: resume_screening.product_business_claims.knowledge_base_built
    competency_key: technical_support
    topic: "Knowledge base"
    difficulty: easy
    text: "You built or improved a knowledge base. How did you decide what to write, and how did you know it helped?"
    expected_concepts:
      - "ticket data"
      - "writing quality"
      - "maintenance"
      - "usage metrics"
      - "deflection"
    rubric:
      excellent: "Writes based on ticket data, maintains content and measures usage and deflection."
      good: "Describes articles and some use."
      weak: "Wrote articles without checking usage."
    followups:
      - "Which article was most used?"
      - "How do you keep it current?"
    common_errors:
      - "Wrote articles without checking usage."

  - external_key: resume_screening.product_business_claims.escalation_process_support
    competency_key: technical_support
    topic: "Escalation handling"
    difficulty: medium
    text: "You handled escalations from customers to engineering. What made an escalation good, and what did you do when engineering pushed back?"
    expected_concepts:
      - "complete information"
      - "reproduction steps"
      - "impact"
      - "communication"
      - "follow-up"
    rubric:
      excellent: "Provides reproduction, impact and context, keeps customers updated, and negotiates priority using impact."
      good: "Describes the escalation process."
      weak: "Forwarded tickets unchanged."
    followups:
      - "What information did engineers want?"
      - "How did you keep the customer informed?"
    common_errors:
      - "Forwarded tickets unchanged."

  - external_key: resume_screening.product_business_claims.hard_customer_situation
    competency_key: customer_communication
    topic: "Difficult customer case"
    difficulty: hard
    text: "Describe a difficult customer situation from your resume where the customer was right about something your company got wrong. How did you handle it?"
    expected_concepts:
      - "listening"
      - "acknowledging"
      - "fix"
      - "communication"
      - "prevention"
    rubric:
      excellent: "Acknowledges the failure, communicates a fix with dates, and feeds the lesson back into the product or process."
      good: "Describes handling and outcome."
      weak: "Defended the company."
    followups:
      - "What did you offer?"
      - "What changed internally?"
    common_errors:
      - "Defended the company."

  - external_key: resume_screening.product_business_claims.stakeholder_alignment_ba
    competency_key: stakeholder_management
    topic: "Aligning stakeholders"
    difficulty: medium
    text: "Stakeholders disagreed about requirements. How did you get to an agreed scope?"
    expected_concepts:
      - "understanding positions"
      - "common goals"
      - "trade-offs"
      - "decision maker"
      - "documentation"
    rubric:
      excellent: "Finds underlying goals, frames trade-offs, gets a decision and records it."
      good: "Describes the negotiation."
      weak: "Picked the loudest stakeholder."
    followups:
      - "Who decided?"
      - "How did you record it?"
    common_errors:
      - "Picked the loudest stakeholder."

  - external_key: resume_screening.product_business_claims.user_story_quality
    competency_key: requirements_analysis
    topic: "Writing user stories"
    difficulty: easy
    text: "You wrote user stories and acceptance criteria. What made a story good enough for engineers to build without constant questions?"
    expected_concepts:
      - "clear user goal"
      - "testable acceptance criteria"
      - "examples"
      - "scope boundaries"
      - "review with engineers"
    rubric:
      excellent: "Describes testable criteria, examples and review with engineers."
      good: "Describes the format."
      weak: "Copies a template with vague criteria."
    followups:
      - "What question came up most?"
      - "How did you review?"
    common_errors:
      - "Copies a template with vague criteria."

  - external_key: resume_screening.product_business_claims.data_driven_product_decision
    competency_key: statistics_experimentation
    topic: "Experiments in product"
    difficulty: hard
    text: "You used an experiment to decide something. What was the hypothesis and what would you have done if the result had been flat?"
    expected_concepts:
      - "hypothesis"
      - "metrics"
      - "duration"
      - "interpretation"
      - "decision rules"
    rubric:
      excellent: "States hypothesis and decision rules in advance, including what to do with a flat result."
      good: "Describes experiment."
      weak: "Ran it and picked the outcome favourable to the plan."
    followups:
      - "What was the guardrail?"
      - "What did you decide?"
    common_errors:
      - "Ran it and picked the outcome favourable to the plan."

  - external_key: resume_screening.product_business_claims.stakeholder_demo_adoption
    competency_key: communication
    topic: "Driving adoption"
    difficulty: easy
    text: "You rolled out a new tool or process to users. What did you do to get them using it?"
    expected_concepts:
      - "understanding users"
      - "training"
      - "champions"
      - "feedback"
      - "adoption data"
    rubric:
      excellent: "Engages users early, trains, uses champions and tracks adoption."
      good: "Describes rollout."
      weak: "Announced it by email."
    followups:
      - "Who adopted first?"
      - "What did you change from feedback?"
    common_errors:
      - "Announced it by email."

  - external_key: resume_screening.product_business_claims.cross_functional_delivery
    competency_key: collaboration
    topic: "Cross-functional collaboration"
    difficulty: medium
    text: "Describe a time you worked with engineering and design to resolve a disagreement about what to build."
    expected_concepts:
      - "shared goal"
      - "evidence"
      - "options"
      - "decision"
      - "follow-up"
    rubric:
      excellent: "Frames around user and business goals, brings evidence and reaches a decision all can support."
      good: "Describes the disagreement."
      weak: "Escalated immediately."
    followups:
      - "What evidence settled it?"
      - "Who gave way?"
    common_errors:
      - "Escalated immediately."

  - external_key: resume_screening.product_business_claims.negotiating_deadlines
    competency_key: project_management
    topic: "Negotiating timelines"
    difficulty: hard
    text: "You were asked to deliver by a date you believed was unrealistic. What did you do?"
    expected_concepts:
      - "analysis"
      - "options"
      - "stakeholder conversation"
      - "compromise"
      - "result"
    rubric:
      excellent: "Provides analysis, offers scope or resource options and obtains an agreed plan."
      good: "Describes the conversation."
      weak: "Accepted the date and missed it."
    followups:
      - "What options did you present?"
      - "What happened to the date?"
    common_errors:
      - "Accepted the date and missed it."
