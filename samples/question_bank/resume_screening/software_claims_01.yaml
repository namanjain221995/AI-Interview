# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [backend, frontend, fullstack, mobile, qa]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.software_claims.built_from_scratch
    competency_key: ownership
    topic: "Building a service from scratch"
    difficulty: easy
    text: "Your resume says you built a system from scratch. Walk me through what existed before you started, what you personally built, and what the first working version looked like."
    expected_concepts:
      - "starting state and the problem being solved"
      - "the candidate's own share of the build"
      - "first minimal version and what was left out"
      - "main technology choices"
      - "how it reached production"
    rubric:
      excellent: "Describes the starting problem, separates their own work from the team's, names a small first version with deliberate cuts, and explains the key choices and how it shipped."
      good: "Gives a clear outline of what was built and their part, with limited detail on early trade-offs."
      weak: "Stays at the level of \"we built an app\" and cannot say which parts were theirs or why those choices were made."
    followups:
      - "What did you leave out of the first version on purpose?"
      - "Who else worked on it and what did they own?"
    common_errors:
      - "Using \"we\" throughout without ever stating a personal contribution."

  - external_key: resume_screening.software_claims.owned_service_scope
    competency_key: ownership
    topic: "What owning a service meant"
    difficulty: easy
    text: "You list yourself as the owner of a service. What did owning it actually involve day to day, beyond writing the code?"
    expected_concepts:
      - "on-call or support duties"
      - "roadmap and backlog decisions"
      - "monitoring and alert upkeep"
      - "dependency and upgrade management"
      - "communication with consumers of the service"
    rubric:
      excellent: "Lists concrete ownership duties such as operations, reliability, consumer communication and upkeep, and gives an example of a decision only the owner could make."
      good: "Mentions several duties beyond coding but with few specific examples."
      weak: "Treats ownership as meaning they wrote most of the code."
    followups:
      - "What was the last thing that paged you for it?"
      - "How did other teams ask for changes?"
    common_errors:
      - "Equating ownership with authorship of the code."

  - external_key: resume_screening.software_claims.performance_improvement_baseline
    competency_key: problem_solving
    topic: "Performance improvement claim"
    difficulty: easy
    text: "Your resume mentions making something faster. What was slow, how did you know, and how did you measure the result?"
    expected_concepts:
      - "how the slowness was noticed"
      - "baseline measurement before changes"
      - "profiling or tracing used to find the cause"
      - "the change made and its measured effect"
      - "how the result was verified in production"
    rubric:
      excellent: "Names the symptom, a measured baseline, the profiling method, the specific fix and a before-and-after comparison, noting any side effects."
      good: "Explains the fix and a rough improvement but with weak baseline or measurement detail."
      weak: "States a percentage with no baseline, method or explanation of the cause."
    followups:
      - "What did the profile show first?"
      - "Did the gain hold under real traffic?"
    common_errors:
      - "Optimising by guesswork without measuring first."

  - external_key: resume_screening.software_claims.tech_stack_choice_reasoning
    competency_key: system_design
    topic: "Choosing the stack"
    difficulty: easy
    text: "For the main project on your resume, how was the technology stack chosen, and what was your part in that choice?"
    expected_concepts:
      - "options considered"
      - "constraints such as team skills and timeline"
      - "the candidate's own role in the decision"
      - "a downside accepted knowingly"
      - "how the choice held up later"
    rubric:
      excellent: "Explains alternatives, the constraints that drove the pick, their own input and a trade-off that later proved right or wrong."
      good: "Names the stack and some reasons but little on alternatives."
      weak: "Says the stack was already decided and shows no understanding of why."
    followups:
      - "What would you pick differently now?"
      - "What did the choice cost you later?"
    common_errors:
      - "Says the stack was already decided and shows no understanding of why."

  - external_key: resume_screening.software_claims.team_size_and_role
    competency_key: collaboration
    topic: "Your role within the team"
    difficulty: easy
    text: "Think of the largest project on your resume. How big was the team, who did what, and where did your responsibilities start and stop?"
    expected_concepts:
      - "team composition and size"
      - "the candidate's specific area"
      - "handoffs with other roles"
      - "decisions the candidate could make alone"
      - "where they needed approval"
    rubric:
      excellent: "Gives a clear picture of team structure, a precise boundary for their own area and an example of working across it."
      good: "Describes the team and their area in general terms."
      weak: "Cannot distinguish their work from the team's."
    followups:
      - "Who reviewed your work?"
      - "Where did your area overlap with a teammate's?"
    common_errors:
      - "Cannot distinguish their work from the team's."

  - external_key: resume_screening.software_claims.feature_end_to_end
    competency_key: ownership
    topic: "Shipping a feature end to end"
    difficulty: easy
    text: "Pick one feature from your resume that you shipped yourself. Take me from the first request to it being live and what happened after."
    expected_concepts:
      - "how requirements were clarified"
      - "design and implementation steps"
      - "testing and review"
      - "release method"
      - "follow-up after launch such as bugs or usage"
    rubric:
      excellent: "Covers the whole path including requirements, design, testing, release and post-launch follow-up with concrete details."
      good: "Covers build and release but skips requirements or follow-up."
      weak: "Describes only the coding step."
    followups:
      - "What changed between the first request and the final version?"
      - "How did you know people used it?"
    common_errors:
      - "Describes only the coding step."

  - external_key: resume_screening.software_claims.bug_reduction_claim
    competency_key: debugging
    topic: "Reducing bugs or defects"
    difficulty: easy
    text: "You mention reducing bugs or production defects. How did you decide what to fix first, and how did you show the number really went down?"
    expected_concepts:
      - "sources of defect data"
      - "categorising the main causes"
      - "chosen fix and prevention measures"
      - "the metric used and its baseline"
      - "avoiding counting changes"
    rubric:
      excellent: "Describes a defect categorisation, targeted prevention work and a trustworthy metric with a baseline and period."
      good: "Names fixes and a reduction without a clear way of counting."
      weak: "Claims fewer bugs with no data on how they were counted."
    followups:
      - "What kind of bug was most common?"
      - "What would have made the number go up instead?"
    common_errors:
      - "Claims fewer bugs with no data on how they were counted."

  - external_key: resume_screening.software_claims.code_review_practice
    competency_key: code_quality
    topic: "Code review on your resume"
    difficulty: easy
    text: "Your resume lists code review or quality practices you introduced. What exactly changed in how the team worked, and did it stick?"
    expected_concepts:
      - "the specific practice introduced"
      - "the problem it addressed"
      - "how the team was brought along"
      - "evidence it improved things"
      - "whether it survived after the initial push"
    rubric:
      excellent: "Names the practice, the problem behind it, how adoption happened and an observable improvement, noting what faded."
      good: "Describes the practice and rough benefit with little on adoption."
      weak: "Lists tools or checklists without any effect on outcomes."
    followups:
      - "Who pushed back on it?"
      - "What did you drop because it did not help?"
    common_errors:
      - "Lists tools or checklists without any effect on outcomes."

  - external_key: resume_screening.software_claims.ci_pipeline_speedup
    competency_key: ci_cd
    topic: "Build or pipeline speedups"
    difficulty: easy
    text: "You say you shortened build or release times. Where did the time go originally, and which change gave the biggest saving?"
    expected_concepts:
      - "measuring stages of the pipeline"
      - "the biggest bottleneck found"
      - "caching or parallelism used"
      - "before and after durations"
      - "effect on developer behaviour"
    rubric:
      excellent: "Breaks down where time went, ranks changes by saving, quotes before and after numbers and explains the effect on the team."
      good: "Names the speedup techniques and rough numbers."
      weak: "Gives a headline figure without explaining its source."
    followups:
      - "Did anything get less reliable after the speedup?"
      - "How did you keep it fast over time?"
    common_errors:
      - "Gives a headline figure without explaining its source."

  - external_key: resume_screening.software_claims.monolith_to_services
    competency_key: system_design
    topic: "Monolith decomposition"
    difficulty: medium
    text: "Your resume mentions breaking a larger application into smaller services. Which piece did you pull out first, why that one, and what hurt most afterwards?"
    expected_concepts:
      - "criteria for choosing the first boundary"
      - "handling shared data"
      - "migration without downtime"
      - "new failure modes such as network calls"
      - "whether the result was worth it"
    rubric:
      excellent: "Chooses a boundary with clear reasoning, deals with shared data and cutover, names real costs and states whether the move paid off."
      good: "Describes the split and some challenges but with limited reasoning about boundaries."
      weak: "Treats services as obviously better and mentions no costs."
    followups:
      - "How did you handle data that both sides needed?"
      - "Would you split it again today?"
    common_errors:
      - "Describing the split as purely positive with no operational cost."

  - external_key: resume_screening.software_claims.rewrite_versus_refactor
    competency_key: system_design
    topic: "Rewrite or incremental change"
    difficulty: medium
    text: "You list a rewrite or a major modernisation of an existing system. Why was rewriting chosen over improving it step by step, and how did you protect users during the change?"
    expected_concepts:
      - "reasons that ruled out incremental change"
      - "scoping and parity testing"
      - "migration or cutover plan"
      - "risk management and rollback"
      - "how long the old system remained"
    rubric:
      excellent: "Argues for the rewrite with specific constraints, shows how parity was verified, describes a staged cutover with rollback and reflects on schedule realities."
      good: "Gives reasons and a plan but with weak risk control."
      weak: "Says the old code was bad with no concrete reason or user protection."
    followups:
      - "What did the old system do that nobody had documented?"
      - "How late was the project against the first plan?"
    common_errors:
      - "Says the old code was bad with no concrete reason or user protection."

  - external_key: resume_screening.software_claims.scale_numbers_claim
    competency_key: system_design
    topic: "Scale figures"
    difficulty: medium
    text: "You quote a scale figure such as users, requests or records. How was that number measured, and what part of the system felt it first?"
    expected_concepts:
      - "where the figure came from"
      - "peak versus average"
      - "first bottleneck encountered"
      - "changes made to cope"
      - "headroom left"
    rubric:
      excellent: "Explains how the figure was gathered, distinguishes peak from average, identifies the first bottleneck and the changes with remaining headroom."
      good: "Gives the figure and some bottlenecks, unsure of the peak profile."
      weak: "Repeats the figure without knowing how it was obtained or what limits existed."
    followups:
      - "What broke at ten times that load?"
      - "How did you test beyond current traffic?"
    common_errors:
      - "Repeats the figure without knowing how it was obtained or what limits existed."

  - external_key: resume_screening.software_claims.database_migration_lead
    competency_key: databases
    topic: "Data migration claims"
    difficulty: medium
    text: "Your resume mentions migrating data or a database. How did you verify nothing was lost or changed along the way?"
    expected_concepts:
      - "inventory and mapping of data"
      - "dry runs and reconciliation checks"
      - "dual running or cutover approach"
      - "rollback options"
      - "handling data that did not fit the new shape"
    rubric:
      excellent: "Describes mapping, repeated rehearsals, automatic reconciliation, a safe cutover and a rollback path, with an example of bad data found."
      good: "Explains the migration steps and some validation."
      weak: "Relies on spot checks after the switch."
    followups:
      - "What was the strangest data you found?"
      - "How long was the rollback window?"
    common_errors:
      - "Treating a successful load as proof of correctness."

  - external_key: resume_screening.software_claims.concurrency_bug_story
    competency_key: debugging
    topic: "Concurrency or race condition fix"
    difficulty: medium
    text: "Your resume claims you fixed a hard production issue. Tell me about the hardest one: how did you reproduce it, and how did you know the fix was right?"
    expected_concepts:
      - "symptoms and how they were first reported"
      - "reproduction strategy"
      - "hypothesis testing"
      - "root cause explained precisely"
      - "confirmation that the fix worked and a regression guard"
    rubric:
      excellent: "Describes a disciplined search with hypotheses, a precise root cause, a way to prove the fix and a test or alert to catch recurrence."
      good: "Gives the cause and fix but a thin account of the search."
      weak: "Describes it as luck or a restart that made it go away."
    followups:
      - "What did you rule out first?"
      - "What did you add so it cannot return silently?"
    common_errors:
      - "Describes it as luck or a restart that made it go away."

  - external_key: resume_screening.software_claims.tests_added_coverage
    competency_key: testing
    topic: "Test coverage claims"
    difficulty: medium
    text: "You mention raising test coverage or adding automated tests. What kinds of problems did those tests actually catch afterward?"
    expected_concepts:
      - "coverage numbers versus meaningful assertions"
      - "the types of tests added"
      - "bugs caught by them"
      - "cost of maintaining tests"
      - "how coverage targets were chosen"
    rubric:
      excellent: "Separates coverage numbers from value, cites defects tests prevented, and discusses upkeep cost and targeting of risky areas."
      good: "Names test types and some caught bugs."
      weak: "Quotes a coverage percent as the achievement."
    followups:
      - "Which tests turned out to be worthless?"
      - "How did you handle flaky ones?"
    common_errors:
      - "Quotes a coverage percent as the achievement."

  - external_key: resume_screening.software_claims.api_design_decisions
    competency_key: api_design
    topic: "API you designed"
    difficulty: medium
    text: "You say you designed an API that other teams or customers used. What did you get wrong the first time, and how did you handle changing it with consumers depending on it?"
    expected_concepts:
      - "understanding consumer needs"
      - "first-version mistakes"
      - "versioning or compatibility approach"
      - "communication of changes"
      - "deprecation timeline"
    rubric:
      excellent: "Names a real design flaw, explains how consumers were affected and describes compatible changes, versioning and communication."
      good: "Describes the API and some versioning but few examples of mistakes."
      weak: "Says the design was fine and never changed."
    followups:
      - "How did you find out consumers were struggling?"
      - "How long did the old version live?"
    common_errors:
      - "Says the design was fine and never changed."

  - external_key: resume_screening.software_claims.zero_downtime_release
    competency_key: ci_cd
    topic: "Safe releases and rollback"
    difficulty: medium
    text: "Your resume talks about improving how releases are done. Describe a release that went wrong, and what that taught you about the process you built."
    expected_concepts:
      - "failure detection"
      - "rollback or roll-forward actions"
      - "blast radius controls such as flags or staged rollout"
      - "follow-up improvements"
      - "communication during the event"
    rubric:
      excellent: "Gives a real failed release, explains detection and recovery, and shows how the process was changed using what was learned."
      good: "Describes a problem and recovery with limited process change."
      weak: "Claims no release ever failed."
    followups:
      - "How fast could you roll back?"
      - "What check would have caught it earlier?"
    common_errors:
      - "Claims no release ever failed."

  - external_key: resume_screening.software_claims.third_party_integration
    competency_key: api_design
    topic: "Third-party integration"
    difficulty: medium
    text: "You list an integration with an external provider. How did you deal with their API being slow, down, or changing without notice?"
    expected_concepts:
      - "timeouts and retries with backoff"
      - "idempotency for repeated calls"
      - "fallbacks or queues"
      - "monitoring of the dependency"
      - "contract tests or sandboxes"
    rubric:
      excellent: "Covers defensive design such as timeouts, retries, idempotency, fallbacks and monitoring, and gives a real incident or near miss."
      good: "Mentions retries and error handling with limited depth."
      weak: "Assumes the provider is always available."
    followups:
      - "How did you test failures?"
      - "What did you show users when it was down?"
    common_errors:
      - "Assumes the provider is always available."

  - external_key: resume_screening.software_claims.mobile_release_crash
    competency_key: mobile_development
    topic: "Crash rate and app quality"
    difficulty: medium
    text: "Your resume claims improvements to an app's stability or release quality. How did you find the biggest crash sources and prove the improvement after the next release?"
    expected_concepts:
      - "crash reporting and grouping by cause"
      - "prioritising by affected users"
      - "fix and staged rollout"
      - "measuring crash-free rate before and after"
      - "device or version factors"
    rubric:
      excellent: "Prioritises crash groups by impact, ships fixes with a staged rollout and shows a before and after rate with attention to device and version spread."
      good: "Explains tooling and a few fixes with partial measurement."
      weak: "Counts fixed tickets rather than user impact."
    followups:
      - "Which crash was the hardest to reproduce?"
      - "How did staged rollout help?"
    common_errors:
      - "Counts fixed tickets rather than user impact."

  - external_key: resume_screening.software_claims.frontend_performance_claim
    competency_key: frontend_react
    topic: "Frontend performance claims"
    difficulty: medium
    text: "You mention improving page speed or front-end performance. Which metric did you track, what moved it most, and how did you make sure it did not drift back?"
    expected_concepts:
      - "user-centred metrics such as load and interaction timing"
      - "lab versus field data"
      - "biggest wins like bundle size, images or rendering"
      - "budgets and automated checks in CI"
      - "monitoring after release"
    rubric:
      excellent: "Uses field and lab metrics, identifies the largest wins with evidence, and describes budgets or checks that prevent regression."
      good: "Names techniques and a metric improvement with little on prevention."
      weak: "Lists generic optimisation tricks with no measurements."
    followups:
      - "How did lab numbers compare with real users?"
      - "What regressed later and why?"
    common_errors:
      - "Lists generic optimisation tricks with no measurements."

  - external_key: resume_screening.software_claims.production_incident_you_caused
    competency_key: incident_response
    topic: "Incident you caused"
    difficulty: hard
    text: "Everyone who owns production code has caused an outage at some point. Describe one from your own work, what you did in the first hour, and what you changed afterwards."
    expected_concepts:
      - "clear account of the cause and their part"
      - "immediate mitigation actions"
      - "communication to stakeholders"
      - "blameless review outputs"
      - "lasting preventive change"
    rubric:
      excellent: "Takes ownership of a specific incident, explains mitigation and communication, and shows lasting systemic changes beyond a personal resolution."
      good: "Gives the incident and fix but little on communication or prevention."
      weak: "Blames others or says nothing serious ever happened."
    followups:
      - "What would a review have said about the process rather than you?"
      - "What guardrail exists now?"
    common_errors:
      - "Describing the cause as someone else's mistake."

  - external_key: resume_screening.software_claims.design_decision_regret
    competency_key: system_design
    topic: "Decision you would reverse"
    difficulty: hard
    text: "Looking at the biggest technical decision on your resume, what do you know now that would make you decide differently, and what signals told you it was wrong?"
    expected_concepts:
      - "the original reasoning and context"
      - "the signals that appeared later"
      - "cost of living with or reversing the decision"
      - "what was learned about similar choices"
      - "how they would decide today"
    rubric:
      excellent: "Reconstructs the decision's context fairly, identifies early warning signs, quantifies the cost and gives a concrete changed approach."
      good: "Admits a decision was suboptimal and describes consequences with limited insight."
      weak: "Defends the decision without reflection or invents a trivial regret."
    followups:
      - "Who disagreed at the time?"
      - "How would you test that decision earlier now?"
    common_errors:
      - "Defends the decision without reflection or invents a trivial regret."

  - external_key: resume_screening.software_claims.lead_without_authority_technical
    competency_key: collaboration
    topic: "Driving change across teams"
    difficulty: hard
    text: "Your resume suggests you drove a technical change that touched other teams. How did you get people who did not report to you to adopt it?"
    expected_concepts:
      - "building the case with evidence"
      - "early involvement of affected teams"
      - "handling objections and trade-offs"
      - "incentives and tooling that eased adoption"
      - "measuring adoption"
    rubric:
      excellent: "Shows evidence-based persuasion, early involvement, resolution of objections and a measurable adoption path, including a compromise they accepted."
      good: "Describes sharing the plan and getting buy-in with limited detail on resistance."
      weak: "Describes mandating the change or giving up when others hesitated."
    followups:
      - "Who was the hardest to convince and why?"
      - "What did you concede?"
    common_errors:
      - "Describes mandating the change or giving up when others hesitated."

  - external_key: resume_screening.software_claims.wrong_claim_scrutiny
    competency_key: ownership
    topic: "Defending the weakest line"
    difficulty: hard
    text: "Choose the line on your resume that you think is easiest to overstate. How much of it was your work, and where would a former teammate say your contribution ended?"
    expected_concepts:
      - "precise statement of their own share"
      - "recognition of others' contributions"
      - "evidence they could point to such as code, designs or documents"
      - "comfort with scrutiny"
      - "accurate framing of scope"
    rubric:
      excellent: "Quickly gives a precise personal-versus-team split, references checkable evidence and describes scope without inflating it."
      good: "Gives a reasonable split after prompting."
      weak: "Becomes vague or defensive and cannot say what was theirs."
    followups:
      - "What could I look at to verify that?"
      - "What did a teammate contribute that you could not have?"
    common_errors:
      - "Becomes vague or defensive and cannot say what was theirs."

  - external_key: resume_screening.software_claims.hardest_technical_problem
    competency_key: problem_solving
    topic: "Hardest problem on the resume"
    difficulty: hard
    text: "Of everything on your resume, which single problem was technically hardest, and what made it hard rather than just long?"
    expected_concepts:
      - "the nature of the difficulty such as ambiguity or constraints"
      - "approaches tried and abandoned"
      - "how the candidate narrowed down the cause or design"
      - "collaboration or research used"
      - "the final solution and its limits"
    rubric:
      excellent: "Explains why the problem was intrinsically hard, shows abandoned approaches and reasoning, and states the final solution's remaining limits."
      good: "Describes a difficult task and solution with limited reasoning about alternatives."
      weak: "Picks a task that was merely time-consuming and cannot explain the technical difficulty."
    followups:
      - "What did you try that did not work?"
      - "What would you tell a colleague facing it next?"
    common_errors:
      - "Picks a task that was merely time-consuming and cannot explain the technical difficulty."
