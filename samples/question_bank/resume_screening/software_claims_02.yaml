# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [backend, frontend, fullstack, mobile, qa]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.software_claims.inherited_codebase
    competency_key: code_quality
    topic: "Inheriting an existing codebase"
    difficulty: easy
    text: "Your resume mentions taking over a codebase someone else wrote. What did you do in your first weeks to understand it, and what did you change first?"
    expected_concepts:
      - "reading code and tracing key flows"
      - "talking to previous authors or users"
      - "adding tests before changes"
      - "choosing small safe first changes"
      - "documenting what was learned"
    rubric:
      excellent: "Describes a deliberate onboarding to the code, safety nets before changes, a sensible first fix and notes left for others."
      good: "Explains reading code and making early fixes with limited safety practice."
      weak: "Describes rewriting parts immediately without understanding them."
    followups:
      - "How did you find out what was risky to touch?"
      - "What did you document?"
    common_errors:
      - "Describes rewriting parts immediately without understanding them."

  - external_key: resume_screening.software_claims.sole_developer_project
    competency_key: ownership
    topic: "Working as the only developer"
    difficulty: easy
    text: "You list a project where you were the only developer. What did you have to do that a team would normally split up, and what suffered because of it?"
    expected_concepts:
      - "range of tasks covered such as design, testing and operations"
      - "how work was prioritised"
      - "quality practices without reviewers"
      - "areas of weakness"
      - "how outside feedback was found"
    rubric:
      excellent: "Lists the full range of responsibilities, describes self-imposed quality checks, names what was neglected and what outside review they sought."
      good: "Describes the range of tasks and mentions some trade-offs."
      weak: "Claims everything was handled well with no examples of trade-offs."
    followups:
      - "Who looked at your work before it shipped?"
      - "What would a second developer have caught?"
    common_errors:
      - "Claims everything was handled well with no examples of trade-offs."

  - external_key: resume_screening.software_claims.automation_of_manual_work
    competency_key: problem_solving
    topic: "Automating manual work"
    difficulty: easy
    text: "Your resume says you automated a manual process. Who did the work before, how much time did it take, and how did you check that the automation was correct?"
    expected_concepts:
      - "the original manual process and its cost"
      - "deciding what to automate"
      - "validating output against manual results"
      - "handling exceptions"
      - "adoption by the people doing it"
    rubric:
      excellent: "Quantifies the manual effort, explains parallel verification, covers exceptions and shows that the users actually adopted it."
      good: "Describes the process and the automation with a rough time saving."
      weak: "Describes a script with no information about users, checks or savings."
    followups:
      - "What did the script not handle?"
      - "Who maintained it afterward?"
    common_errors:
      - "Describes a script with no information about users, checks or savings."

  - external_key: resume_screening.software_claims.internal_tool_adoption
    competency_key: ownership
    topic: "Internal tool you built"
    difficulty: easy
    text: "You built an internal tool. How did you find out what people needed, and how did you know they were actually using it?"
    expected_concepts:
      - "gathering requirements from users"
      - "early prototypes or feedback"
      - "usage measurement"
      - "changes after feedback"
      - "support and maintenance"
    rubric:
      excellent: "Talks to real users, iterates on a prototype, tracks usage and acts on what the data shows, and covers upkeep."
      good: "Describes the tool and some user input."
      weak: "Built what they assumed was needed and has no usage evidence."
    followups:
      - "What feature did nobody use?"
      - "How did you hear about problems?"
    common_errors:
      - "Built what they assumed was needed and has no usage evidence."

  - external_key: resume_screening.software_claims.feature_flag_experiments
    competency_key: testing
    topic: "Feature flags and experiments"
    difficulty: medium
    text: "Your resume mentions feature flags or experiments. Give me an example where a flag changed how you shipped something, including how you cleaned up afterward."
    expected_concepts:
      - "use of flags for staged rollout"
      - "targeting and kill switch design"
      - "metrics watched during rollout"
      - "flag lifecycle and cleanup"
      - "risk of long-lived flags"
    rubric:
      excellent: "Shows how a flag limited risk with a defined audience and monitoring, and describes removal of the flag and its dead code."
      good: "Explains rollout use with little on cleanup."
      weak: "Treats flags as a toggle only and leaves them in indefinitely."
    followups:
      - "How many flags were stale?"
      - "What did you watch to decide to go to everyone?"
    common_errors:
      - "Treats flags as a toggle only and leaves them in indefinitely."

  - external_key: resume_screening.software_claims.queue_async_processing
    competency_key: distributed_systems
    topic: "Asynchronous processing"
    difficulty: medium
    text: "You mention background jobs or message queues. What happened when a job failed or ran twice, and how did your design cope?"
    expected_concepts:
      - "retries and backoff"
      - "idempotent handlers"
      - "dead letter handling"
      - "ordering assumptions"
      - "monitoring of queue depth and age"
    rubric:
      excellent: "Explains idempotent processing, bounded retries, dead-letter review and monitoring, and gives a case where duplicates or poison messages occurred."
      good: "Mentions retries and some monitoring."
      weak: "Assumes each job runs exactly once and never fails."
    followups:
      - "How did you find stuck jobs?"
      - "Did ordering matter anywhere?"
    common_errors:
      - "Assuming exactly-once delivery."

  - external_key: resume_screening.software_claims.caching_introduced
    competency_key: databases
    topic: "Caching claims"
    difficulty: medium
    text: "You introduced caching to speed something up. How did you decide what to cache, how did entries get refreshed, and what went wrong because of it?"
    expected_concepts:
      - "choosing hot data with measurements"
      - "expiry and invalidation strategy"
      - "stale data risks"
      - "cache stampede or cold start"
      - "hit-rate monitoring"
    rubric:
      excellent: "Picks cacheable data using evidence, defines invalidation, names a real staleness or stampede problem and tracks hit rate."
      good: "Describes what was cached and a basic expiry approach."
      weak: "Added a cache without considering staleness or measuring hit rate."
    followups:
      - "How did you know an entry was wrong?"
      - "What happened when it was cold?"
    common_errors:
      - "Added a cache without considering staleness or measuring hit rate."

  - external_key: resume_screening.software_claims.auth_sso_implementation
    competency_key: security
    topic: "Authentication work"
    difficulty: medium
    text: "Your resume says you implemented login or single sign-on. What threats did you think about, and which decision there would you want a security reviewer to double-check?"
    expected_concepts:
      - "session or token handling"
      - "password and recovery flows"
      - "protection against common attacks"
      - "third-party identity provider integration"
      - "logging and revocation"
    rubric:
      excellent: "Names concrete threats, secure session and token handling, recovery-flow risks and identifies a subtle decision for review."
      good: "Covers the standard flow and a few protections."
      weak: "Describes only the happy path of logging in."
    followups:
      - "How do you revoke a session?"
      - "What do you log, and what do you never log?"
    common_errors:
      - "Describes only the happy path of logging in."

  - external_key: resume_screening.software_claims.search_feature_relevance
    competency_key: problem_solving
    topic: "Search or recommendation feature"
    difficulty: medium
    text: "You built or improved search on a product. How did you judge whether results got better, given that \"better\" is partly subjective?"
    expected_concepts:
      - "defining relevance with users"
      - "test queries and offline checks"
      - "online metrics such as clicks or reformulations"
      - "trade-offs between recall and speed"
      - "iteration process"
    rubric:
      excellent: "Defines relevance with evidence, builds a query set, uses online signals and explains trade-offs and iterations."
      good: "Describes the search stack and some measures."
      weak: "Judges results by personal opinion on a few queries."
    followups:
      - "Which queries stayed bad?"
      - "How did you avoid regressions?"
    common_errors:
      - "Judges results by personal opinion on a few queries."

  - external_key: resume_screening.software_claims.realtime_updates_feature
    competency_key: system_design
    topic: "Real-time features"
    difficulty: medium
    text: "Your resume mentions real-time updates, such as live data or notifications. How did the connection behave when clients dropped, reconnected or fell behind?"
    expected_concepts:
      - "transport choice and reasons"
      - "reconnection and missed-event recovery"
      - "ordering and duplicates"
      - "scaling connections"
      - "fallback behaviour"
    rubric:
      excellent: "Describes transport trade-offs, replay of missed events after reconnect, duplicate handling and how connections scaled."
      good: "Names the technology and basic reconnect logic."
      weak: "Assumes connections never drop."
    followups:
      - "How many connections could one node hold?"
      - "What did the client show while disconnected?"
    common_errors:
      - "Assumes connections never drop."

  - external_key: resume_screening.software_claims.offline_sync_mobile
    competency_key: mobile_development
    topic: "Offline and sync"
    difficulty: medium
    text: "You list offline support or data sync in an app. Describe a conflict between local and server data and how your design resolved it."
    expected_concepts:
      - "local storage approach"
      - "sync triggers"
      - "conflict detection and resolution rule"
      - "user-visible handling"
      - "testing with poor networks"
    rubric:
      excellent: "Describes a concrete conflict case, a clear resolution rule with reasoning, and how it was tested with bad connectivity."
      good: "Explains local storage and sync in general."
      weak: "Overwrites with the latest write without considering lost updates."
    followups:
      - "What did the user see when the conflict happened?"
      - "How did you test it?"
    common_errors:
      - "Overwrites with the latest write without considering lost updates."

  - external_key: resume_screening.software_claims.accessibility_work
    competency_key: frontend_react
    topic: "Accessibility improvements"
    difficulty: medium
    text: "Your resume mentions accessibility work. What were the most common barriers you found, and how did you check fixes with something more than an automated scanner?"
    expected_concepts:
      - "keyboard and screen reader checks"
      - "semantic markup"
      - "contrast and focus handling"
      - "automated plus manual testing"
      - "keeping it from regressing"
    rubric:
      excellent: "Names real barriers, uses manual keyboard and assistive tools testing, and adds checks to the build to hold the gains."
      good: "Describes fixes and automated tools."
      weak: "Says a scanner passed so the app is accessible."
    followups:
      - "What did a screen reader reveal that tools missed?"
      - "Who owned accessibility afterward?"
    common_errors:
      - "Says a scanner passed so the app is accessible."

  - external_key: resume_screening.software_claims.regression_suite_qa
    competency_key: test_automation
    topic: "Automation suite claims"
    difficulty: medium
    text: "You claim to have built an automated regression suite. Which tests did you automate first, which did you leave manual, and how did you keep the suite trustworthy?"
    expected_concepts:
      - "choosing by risk and stability"
      - "layers such as unit, API and UI"
      - "flaky test policy"
      - "run time and CI placement"
      - "maintenance ownership"
    rubric:
      excellent: "Uses risk to choose scope, balances layers, manages flakiness and run time, and assigns maintenance responsibility."
      good: "Describes the framework and coverage in general."
      weak: "Automated UI paths broadly and tolerates failures being ignored."
    followups:
      - "How often did it fail for no reason?"
      - "What did it catch that manual testing missed?"
    common_errors:
      - "Automated UI paths broadly and tolerates failures being ignored."

  - external_key: resume_screening.software_claims.test_strategy_ownership
    competency_key: testing
    topic: "Quality ownership"
    difficulty: medium
    text: "Your resume suggests you shaped how a team tests. What did the strategy say about which problems to catch at which level, and what did the team stop doing?"
    expected_concepts:
      - "risk-based allocation of effort"
      - "test pyramid layers"
      - "exit criteria"
      - "stopped wasteful checks"
      - "metrics about escaped defects"
    rubric:
      excellent: "Shows a coherent strategy tied to risk, explains what was dropped and tracks escaped defects."
      good: "Describes a layered plan with limited trade-offs."
      weak: "Lists tools and test types without a rationale."
    followups:
      - "What did you decide not to test?"
      - "How did you know it worked?"
    common_errors:
      - "Lists tools and test types without a rationale."

  - external_key: resume_screening.software_claims.load_testing_results
    competency_key: testing
    topic: "Load testing claim"
    difficulty: medium
    text: "You mention load or performance testing. How did you make the test resemble real traffic, and what did it tell you that you did not already suspect?"
    expected_concepts:
      - "realistic workload modelling"
      - "data volumes and environment parity"
      - "metrics watched"
      - "findings and fixes"
      - "limits of the test"
    rubric:
      excellent: "Builds a workload from production data, accounts for environment differences and reports a surprising finding with a fix."
      good: "Explains tools and some results."
      weak: "Hits one endpoint with synthetic requests and treats the number as capacity."
    followups:
      - "How different was the test environment?"
      - "What would still be unknown?"
    common_errors:
      - "Hits one endpoint with synthetic requests and treats the number as capacity."

  - external_key: resume_screening.software_claims.dependency_upgrade
    competency_key: code_quality
    topic: "Framework or library upgrade"
    difficulty: medium
    text: "You upgraded a framework, language version or major dependency. How did you plan it so the team could keep shipping meanwhile?"
    expected_concepts:
      - "assessing breaking changes"
      - "incremental steps"
      - "automated tests as a safety net"
      - "compatibility shims"
      - "rollout and rollback"
    rubric:
      excellent: "Plans incremental steps with tests, uses compatibility layers so feature work continues and has a rollback plan."
      good: "Describes the upgrade steps and a few issues."
      weak: "Froze other work or upgraded everything at once without a safety net."
    followups:
      - "What broke that you did not expect?"
      - "How long did two versions coexist?"
    common_errors:
      - "Froze other work or upgraded everything at once without a safety net."

  - external_key: resume_screening.software_claims.multi_tenant_data_isolation
    competency_key: security
    topic: "Multi-tenant isolation"
    difficulty: hard
    text: "Your resume mentions serving multiple customers from one system. How did you make sure one customer could never see another's data, and how did you test it?"
    expected_concepts:
      - "tenant identifier enforcement at each layer"
      - "database or query level protections"
      - "testing for cross-tenant access"
      - "noisy neighbour limits"
      - "audit of access"
    rubric:
      excellent: "Enforces tenancy in layers, tests negative cases deliberately, and handles resource isolation and auditing."
      good: "Describes a tenant filter and some testing."
      weak: "Relies on developers remembering a filter in each query."
    followups:
      - "What happens if someone forgets the filter?"
      - "How did you test negative cases?"
    common_errors:
      - "Relying on a convention instead of an enforced control."

  - external_key: resume_screening.software_claims.data_privacy_deletion
    competency_key: security
    topic: "Privacy requirement work"
    difficulty: hard
    text: "You list work on privacy or data deletion requirements. How did you find every place a person's data lived, and how did you prove it was removed?"
    expected_concepts:
      - "data inventory across stores and logs"
      - "backups and derived data"
      - "deletion workflow and verification"
      - "legal retention conflicts"
      - "testing and audit trail"
    rubric:
      excellent: "Maps all storage including copies, defines deletion and retention rules, verifies removal and documents it."
      good: "Handles main database deletion and some derived data."
      weak: "Deletes the main record only."
    followups:
      - "What about backups and logs?"
      - "How would you know you missed one?"
    common_errors:
      - "Deletes the main record only."

  - external_key: resume_screening.software_claims.availability_target_claim
    competency_key: incident_response
    topic: "Availability claim"
    difficulty: hard
    text: "You quote an uptime or availability figure. How was it calculated, what counted as downtime, and what was the largest contributor to the misses?"
    expected_concepts:
      - "definition of availability from the user's view"
      - "measurement source"
      - "excluded windows"
      - "largest causes of downtime"
      - "improvements ranked by effect"
    rubric:
      excellent: "Defines availability clearly, shows how it was measured, challenges its own exclusions and ranks causes with fixes."
      good: "Gives the figure and main causes without questioning the definition."
      weak: "Quotes the figure with no definition."
    followups:
      - "Would a user agree with that number?"
      - "What was excluded and why?"
    common_errors:
      - "Quotes the figure with no definition."

  - external_key: resume_screening.software_claims.technical_debt_payoff
    competency_key: code_quality
    topic: "Paying down technical debt"
    difficulty: hard
    text: "Your resume says you reduced technical debt. How did you persuade others that the time was worth spending, and what business result could you show afterward?"
    expected_concepts:
      - "identifying costly debt"
      - "quantifying effect on delivery or incidents"
      - "negotiating time with planning owners"
      - "scope control"
      - "measured result"
    rubric:
      excellent: "Quantifies the cost of the debt, negotiates a bounded investment and shows a measured improvement in delivery or reliability."
      good: "Describes the cleanup and a general benefit."
      weak: "Cleaned up code they disliked with no link to outcomes."
    followups:
      - "What did you refuse to clean up?"
      - "How did you size it?"
    common_errors:
      - "Cleaned up code they disliked with no link to outcomes."

  - external_key: resume_screening.software_claims.build_vs_buy_decision
    competency_key: system_design
    topic: "Build or buy decision"
    difficulty: hard
    text: "You list building something that a vendor or open-source tool could have provided. What made building the right choice, and would you make it again?"
    expected_concepts:
      - "requirement fit against off-the-shelf options"
      - "total cost including upkeep"
      - "risk and lock-in"
      - "reassessment"
      - "outcome"
    rubric:
      excellent: "Compares options on fit and long-term cost, shows how the decision was reviewed and reflects on its outcome."
      good: "Gives reasons and compares a couple of options."
      weak: "Built it because it was more interesting."
    followups:
      - "What was the ongoing cost?"
      - "Who maintains it now?"
    common_errors:
      - "Built it because it was more interesting."

  - external_key: resume_screening.software_claims.scope_cut_under_deadline
    competency_key: problem_solving
    topic: "Delivering under a deadline"
    difficulty: hard
    text: "Your resume describes meeting a tight deadline. What did you cut, who agreed to the cut, and what was the cost later?"
    expected_concepts:
      - "separating essential from optional scope"
      - "negotiating with stakeholders"
      - "quality safeguards that stayed"
      - "recording deferred work"
      - "later consequences"
    rubric:
      excellent: "Describes explicit cuts agreed with stakeholders, protections kept for quality and how deferred items were tracked and repaid."
      good: "Describes working hard and cutting some scope."
      weak: "Delivered by overtime or by dropping tests silently."
    followups:
      - "What shortcut did you refuse?"
      - "When was the deferred work done?"
    common_errors:
      - "Delivered by overtime or by dropping tests silently."

  - external_key: resume_screening.software_claims.cross_team_dependency
    competency_key: collaboration
    topic: "Working with other teams"
    difficulty: easy
    text: "Your resume mentions delivering with another team involved. How did you and they agree on who built what, and what happened when their schedule slipped?"
    expected_concepts:
      - "clear interfaces and ownership"
      - "regular syncing"
      - "mock or stub use to keep moving"
      - "escalation path"
      - "adjusted plan"
    rubric:
      excellent: "Agrees an interface early, keeps work moving with stubs, communicates risk early and replans."
      good: "Describes coordination and some mitigation."
      weak: "Waited for the other team and blamed delays on them."
    followups:
      - "How did you find out the schedule had slipped?"
      - "What did you stub out?"
    common_errors:
      - "Waited for the other team and blamed delays on them."

  - external_key: resume_screening.software_claims.documentation_contribution
    competency_key: communication
    topic: "Documentation and knowledge sharing"
    difficulty: easy
    text: "You mention writing documentation or design docs. Tell me about one that actually changed a decision or helped someone else work faster."
    expected_concepts:
      - "audience of the document"
      - "what it contained such as options and trade-offs"
      - "review feedback"
      - "evidence of use"
      - "upkeep"
    rubric:
      excellent: "Names the audience, a real decision or time saving it influenced and how it was kept current."
      good: "Describes the document and its general value."
      weak: "Writes documents that nobody reads or cannot name a use."
    followups:
      - "Who reviewed it?"
      - "What did you remove to make it shorter?"
    common_errors:
      - "Writes documents that nobody reads or cannot name a use."

  - external_key: resume_screening.software_claims.api_latency_reduction_db
    competency_key: databases
    topic: "Query and database tuning"
    difficulty: easy
    text: "You mention tuning queries or databases. Take one query you fixed and tell me how you found it and what the change was."
    expected_concepts:
      - "finding the slow query with monitoring"
      - "reading the execution plan"
      - "index or query change"
      - "effect measured"
      - "side effects such as write cost"
    rubric:
      excellent: "Locates the query through data, explains the plan, states the change and measured effect, and notes write overhead."
      good: "Explains the change and rough effect."
      weak: "Says \"added an index\" with no detail on evidence."
    followups:
      - "What did the plan show?"
      - "Did anything else get slower?"
    common_errors:
      - "Says \"added an index\" with no detail on evidence."
