# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [product_manager, project_manager, business_analyst, ux_designer, support_engineer]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.product_business_claims.product_discovery_assumption
    competency_key: product_sense
    topic: "Testing a risky assumption"
    difficulty: medium
    text: "You had an assumption that the whole idea depended on. How did you test it cheaply before building?"
    expected_concepts:
      - "identifying the riskiest assumption"
      - "cheap experiment"
      - "success criteria"
      - "result"
      - "decision"
    rubric:
      excellent: "Names the riskiest assumption, designs a cheap test with success criteria and acts on the result."
      good: "Describes a test."
      weak: "Built the product to find out."
    followups:
      - "What would have stopped you?"
      - "What did it cost?"
    common_errors:
      - "Built the product to find out."

  - external_key: resume_screening.product_business_claims.field_visit_observation
    competency_key: ux_research
    topic: "Observing users in context"
    difficulty: medium
    text: "You observed users in their own setting. What did you see that they had not mentioned in interviews?"
    expected_concepts:
      - "observation method"
      - "differences between said and done"
      - "insight"
      - "design impact"
      - "limits"
    rubric:
      excellent: "Contrasts reported and observed behaviour and shows the design change that followed."
      good: "Describes observation."
      weak: "Asked users questions only."
    followups:
      - "What workaround did you see?"
      - "What changed?"
    common_errors:
      - "Asked users questions only."

  - external_key: resume_screening.product_business_claims.interaction_design_tradeoff
    competency_key: ux_design
    topic: "Design trade-off under constraint"
    difficulty: hard
    text: "A design you believed in could not be built in time. How did you decide what to keep?"
    expected_concepts:
      - "core user value"
      - "constraints"
      - "options"
      - "engineering collaboration"
      - "test"
    rubric:
      excellent: "Identifies core value, explores options with engineers and validates the reduced version."
      good: "Describes compromise."
      weak: "Dropped the design silently."
    followups:
      - "What did you keep?"
      - "How did users respond?"
    common_errors:
      - "Dropped the design silently."

  - external_key: resume_screening.product_business_claims.content_design_writing
    competency_key: communication
    topic: "Product content and microcopy"
    difficulty: easy
    text: "You wrote interface text or content. How did you test that people understood it?"
    expected_concepts:
      - "audience"
      - "plain language"
      - "testing"
      - "revisions"
      - "consistency"
    rubric:
      excellent: "Writes for the audience, tests comprehension and revises."
      good: "Describes writing."
      weak: "Wrote copy without testing."
    followups:
      - "Which text did you rewrite?"
      - "How did you test?"
    common_errors:
      - "Wrote copy without testing."

  - external_key: resume_screening.product_business_claims.team_adoption_of_research
    competency_key: ux_research
    topic: "Making research matter"
    difficulty: hard
    text: "Research findings were ignored by the team. What did you do?"
    expected_concepts:
      - "understanding why"
      - "framing"
      - "involving the team"
      - "evidence"
      - "result"
    rubric:
      excellent: "Diagnoses why the findings were ignored, involves the team in research and shows impact."
      good: "Describes a response."
      weak: "Blamed the team."
    followups:
      - "What did you try first?"
      - "What worked?"
    common_errors:
      - "Blamed the team."

  - external_key: resume_screening.product_business_claims.kpi_tree_metrics_design
    competency_key: data_analysis
    topic: "Designing metrics"
    difficulty: medium
    text: "You designed a set of metrics for a product. How did you choose them, and which proved misleading?"
    expected_concepts:
      - "link to goals"
      - "leading and lagging"
      - "gaming risk"
      - "revision"
      - "use"
    rubric:
      excellent: "Links metrics to goals, balances leading and lagging measures and revises misleading ones."
      good: "Describes metrics."
      weak: "Picked metrics easy to collect."
    followups:
      - "Which did you drop?"
      - "What behaviour did a metric cause?"
    common_errors:
      - "Picked metrics easy to collect."

  - external_key: resume_screening.product_business_claims.agile_transformation_role
    competency_key: agile_delivery
    topic: "Process change at scale"
    difficulty: hard
    text: "You helped change the way several teams delivered. What did you change, and what did you learn about change across teams?"
    expected_concepts:
      - "diagnosis"
      - "pilot"
      - "adoption"
      - "resistance"
      - "results"
    rubric:
      excellent: "Diagnoses, pilots and adapts to resistance with measured results."
      good: "Describes change."
      weak: "Rolled out a framework everywhere."
    followups:
      - "Which team resisted?"
      - "What measure moved?"
    common_errors:
      - "Rolled out a framework everywhere."

  - external_key: resume_screening.product_business_claims.contract_scope_clarity
    competency_key: project_management
    topic: "Scope and contracts"
    difficulty: medium
    text: "You managed a project with a fixed scope or contract. How did you keep the scope clear, and what happened when the customer wanted more?"
    expected_concepts:
      - "scope statement"
      - "change process"
      - "communication"
      - "commercial effect"
      - "result"
    rubric:
      excellent: "Documents scope, handles changes through a process and communicates commercial effect."
      good: "Describes handling."
      weak: "Delivered extras free."
    followups:
      - "What was added?"
      - "How was it priced?"
    common_errors:
      - "Delivered extras free."

  - external_key: resume_screening.product_business_claims.risk_of_overpromising
    competency_key: ownership
    topic: "Commitments to customers"
    difficulty: hard
    text: "Have you ever committed to a customer or stakeholder something you later found hard to deliver? What did you do?"
    expected_concepts:
      - "commitment"
      - "discovery"
      - "communication"
      - "recovery"
      - "learning"
    rubric:
      excellent: "Tells the stakeholder early, offers options and changes how commitments are made."
      good: "Describes the situation."
      weak: "Hid the problem."
    followups:
      - "When did you tell them?"
      - "What do you do now?"
    common_errors:
      - "Hid the problem."

  - external_key: resume_screening.product_business_claims.requirements_traceability
    competency_key: requirements_analysis
    topic: "Traceability and change"
    difficulty: medium
    text: "You maintained requirements across a project. How did you handle requirements that changed after development began?"
    expected_concepts:
      - "change control"
      - "impact analysis"
      - "communication"
      - "documentation"
      - "testing"
    rubric:
      excellent: "Uses impact analysis and updates documents, tests and communicates."
      good: "Describes handling."
      weak: "Documents were out of date."
    followups:
      - "What was the biggest change?"
      - "How did tests change?"
    common_errors:
      - "Documents were out of date."

  - external_key: resume_screening.product_business_claims.training_support_new_agents
    competency_key: mentoring
    topic: "Training support staff"
    difficulty: easy
    text: "You trained new support or operations staff. How did you know they were ready to work alone?"
    expected_concepts:
      - "plan"
      - "shadowing"
      - "checks"
      - "feedback"
      - "independence"
    rubric:
      excellent: "Uses a structured plan, reviews work and releases independence stepwise."
      good: "Describes training."
      weak: "Put them on the queue immediately."
    followups:
      - "What did they struggle with?"
      - "How did you check?"
    common_errors:
      - "Put them on the queue immediately."

  - external_key: resume_screening.product_business_claims.queue_management_priority
    competency_key: technical_support
    topic: "Prioritising support work"
    difficulty: easy
    text: "Many tickets arrived at once. How did you decide what to handle first?"
    expected_concepts:
      - "impact"
      - "severity"
      - "customer type"
      - "SLAs"
      - "communication"
    rubric:
      excellent: "Triage by impact and severity with communication to affected customers."
      good: "Describes triage."
      weak: "First in, first out only."
    followups:
      - "What was critical?"
      - "How did you tell others?"
    common_errors:
      - "First in, first out only."

  - external_key: resume_screening.product_business_claims.product_ops_documentation
    competency_key: communication
    topic: "Release notes and communication"
    difficulty: easy
    text: "You communicated product changes to customers or colleagues. How did you decide what mattered to them?"
    expected_concepts:
      - "audience"
      - "impact"
      - "clarity"
      - "channels"
      - "feedback"
    rubric:
      excellent: "Focuses on impact to each audience, uses clear language and collects feedback."
      good: "Describes notes."
      weak: "Listed technical changes."
    followups:
      - "What did readers ask?"
      - "What did you leave out?"
    common_errors:
      - "Listed technical changes."

  - external_key: resume_screening.product_business_claims.customer_success_retention
    competency_key: customer_communication
    topic: "Retention work"
    difficulty: medium
    text: "You worked on customer retention. What signals told you customers were at risk, and what did you do?"
    expected_concepts:
      - "signals"
      - "outreach"
      - "root causes"
      - "product feedback"
      - "results"
    rubric:
      excellent: "Identifies signals with data, acts and feeds root causes to the product."
      good: "Describes outreach."
      weak: "Reacted when customers cancelled."
    followups:
      - "What signal was best?"
      - "Did it work?"
    common_errors:
      - "Reacted when customers cancelled."

  - external_key: resume_screening.product_business_claims.usability_metrics_sus
    competency_key: ux_research
    topic: "Measuring usability over time"
    difficulty: easy
    text: "You measured usability across versions. What did you use, and what did the numbers not tell you?"
    expected_concepts:
      - "measures"
      - "consistent method"
      - "context"
      - "qualitative"
      - "use"
    rubric:
      excellent: "Uses consistent measures and understands their limits with qualitative context."
      good: "Describes measures."
      weak: "Reported a score only."
    followups:
      - "What did a score hide?"
      - "How often did you measure?"
    common_errors:
      - "Reported a score only."

  - external_key: resume_screening.product_business_claims.workshop_facilitation
    competency_key: collaboration
    topic: "Facilitating workshops"
    difficulty: medium
    text: "You ran workshops with stakeholders. How did you make sure quieter voices were heard and you ended with decisions?"
    expected_concepts:
      - "preparation"
      - "structure"
      - "inclusion"
      - "decisions"
      - "follow-up"
    rubric:
      excellent: "Prepares structure, includes everyone and records decisions with owners."
      good: "Describes workshops."
      weak: "Ran open discussion without outcomes."
    followups:
      - "What technique helped?"
      - "What decisions resulted?"
    common_errors:
      - "Ran open discussion without outcomes."

  - external_key: resume_screening.product_business_claims.regression_in_release
    competency_key: incident_response
    topic: "Release problem affecting users"
    difficulty: medium
    text: "A release you were responsible for caused issues for users. How did you handle it from the product or project side?"
    expected_concepts:
      - "assessment"
      - "communication"
      - "decision to roll back or fix"
      - "follow-up"
      - "prevention"
    rubric:
      excellent: "Assesses impact, communicates, decides quickly and improves release practices."
      good: "Describes handling."
      weak: "Left it to engineers."
    followups:
      - "Who decided?"
      - "What changed in release process?"
    common_errors:
      - "Left it to engineers."

  - external_key: resume_screening.product_business_claims.portfolio_prioritisation
    competency_key: project_management
    topic: "Choosing among projects"
    difficulty: hard
    text: "You had more projects than people. How did you decide what to stop?"
    expected_concepts:
      - "value"
      - "cost"
      - "strategic fit"
      - "dependencies"
      - "communication"
    rubric:
      excellent: "Uses explicit criteria and communicates stops respectfully."
      good: "Describes choices."
      weak: "Continued everything."
    followups:
      - "What did you stop?"
      - "How did they respond?"
    common_errors:
      - "Continued everything."

  - external_key: resume_screening.product_business_claims.data_quality_business_reports
    competency_key: data_analysis
    topic: "Trusting business reports"
    difficulty: medium
    text: "Two reports gave different numbers for the same thing. How did you find out which was right?"
    expected_concepts:
      - "definitions"
      - "sources"
      - "reconciliation"
      - "fix"
      - "communication"
    rubric:
      excellent: "Compares definitions and sources, reconciles and aligns the reports."
      good: "Describes reconciliation."
      weak: "Picked the one that looked right."
    followups:
      - "What differed?"
      - "Who owned it?"
    common_errors:
      - "Picked the one that looked right."

  - external_key: resume_screening.product_business_claims.usage_of_ai_tools_in_work
    competency_key: adaptability
    topic: "New tools in your role"
    difficulty: easy
    text: "You adopted a new tool, possibly using AI, in your day-to-day product or support work. What did you check before relying on its output?"
    expected_concepts:
      - "use case"
      - "validation"
      - "limits"
      - "privacy"
      - "result"
    rubric:
      excellent: "Validates outputs on known cases, respects data privacy and notes limits."
      good: "Describes use."
      weak: "Trusted output without checks."
    followups:
      - "What did it get wrong?"
      - "What data did you avoid sharing?"
    common_errors:
      - "Trusted output without checks."

  - external_key: resume_screening.product_business_claims.mentoring_junior_ba_pm
    competency_key: mentoring
    topic: "Developing colleagues"
    difficulty: medium
    text: "You mentored a junior colleague in analysis, design or project work. What did you teach them that you had learned the hard way?"
    expected_concepts:
      - "lesson"
      - "method"
      - "practice"
      - "feedback"
      - "progress"
    rubric:
      excellent: "Gives a specific lesson and how the mentee improved."
      good: "Describes mentoring."
      weak: "Gave general advice."
    followups:
      - "What did they do afterwards?"
      - "What was hard to teach?"
    common_errors:
      - "Gave general advice."

  - external_key: resume_screening.product_business_claims.customer_empathy_example
    competency_key: customer_communication
    topic: "Understanding customers"
    difficulty: easy
    text: "Tell me about a time you changed your mind about what a customer needed after talking with them."
    expected_concepts:
      - "first view"
      - "evidence"
      - "change"
      - "action"
      - "result"
    rubric:
      excellent: "Describes the original view, the evidence and the action taken."
      good: "Describes the change."
      weak: "Had no change of mind."
    followups:
      - "What did they say?"
      - "What did you do?"
    common_errors:
      - "Had no change of mind."

  - external_key: resume_screening.product_business_claims.cross_team_process_ownership
    competency_key: ownership
    topic: "Owning a process end to end"
    difficulty: medium
    text: "You owned a process spanning several teams. What did you do when one team did not follow it?"
    expected_concepts:
      - "understanding reasons"
      - "adjusting"
      - "communication"
      - "escalation"
      - "results"
    rubric:
      excellent: "Understands why, adjusts the process where needed and escalates only after trying."
      good: "Describes handling."
      weak: "Escalated immediately."
    followups:
      - "Why did they not follow?"
      - "What changed?"
    common_errors:
      - "Escalated immediately."

  - external_key: resume_screening.product_business_claims.proudest_delivery_evidence
    competency_key: ownership
    topic: "Evidence behind the best claim"
    difficulty: hard
    text: "Pick the strongest claim on your resume. What documents, data or colleagues could confirm it?"
    expected_concepts:
      - "claim"
      - "evidence"
      - "contributions"
      - "limits"
      - "confirmation"
    rubric:
      excellent: "Names verifiable evidence and colleagues and states scope accurately."
      good: "Names some evidence."
      weak: "Cannot point to any evidence."
    followups:
      - "Who would confirm it?"
      - "What would they say you did?"
    common_errors:
      - "Cannot point to any evidence."

  - external_key: resume_screening.product_business_claims.onboarding_flow_activation
    competency_key: product_sense
    topic: "Activation and onboarding flows"
    difficulty: easy
    text: "You worked on how new users get started with a product. What was the point where most people gave up, and how did you find it?"
    expected_concepts:
      - "funnel data"
      - "qualitative follow-up"
      - "hypotheses"
      - "change"
      - "measurement"
    rubric:
      excellent: "Finds the drop-off with data, learns why from users and measures the change."
      good: "Describes the flow and changes."
      weak: "Redesigned the whole flow without locating the problem."
    followups:
      - "What did users say at that step?"
      - "How did the numbers change?"
    common_errors:
      - "Redesigned the whole flow without locating the problem."
