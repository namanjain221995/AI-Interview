# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [data, data_analyst, data_scientist, ml, llm]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.data_ai_claims.streaming_pipeline_latency
    competency_key: data_engineering
    topic: "Streaming data work"
    difficulty: medium
    text: "You built or ran a streaming pipeline. How did you handle late, duplicate and out-of-order events?"
    expected_concepts:
      - "event time versus processing time"
      - "watermarks"
      - "deduplication keys"
      - "reprocessing"
      - "state size"
    rubric:
      excellent: "Distinguishes event time from processing time, applies watermarks and dedup keys, and describes reprocessing."
      good: "Describes the pipeline and some handling."
      weak: "Assumes events arrive once and in order."
    followups:
      - "How late could data be?"
      - "How did you reprocess?"
    common_errors:
      - "Assuming events arrive once and in order."

  - external_key: resume_screening.data_ai_claims.orchestration_scheduling
    competency_key: data_engineering
    topic: "Workflow orchestration"
    difficulty: easy
    text: "You used an orchestration tool for data jobs. What did a typical failure look like and how was it recovered without duplicating data?"
    expected_concepts:
      - "dependency graph"
      - "retries"
      - "idempotent tasks"
      - "backfills"
      - "alerting"
    rubric:
      excellent: "Describes idempotent tasks, safe backfills and alerts, with a real failure."
      good: "Describes the tool and retries."
      weak: "Reruns manually and cleans up by hand."
    followups:
      - "How do you backfill safely?"
      - "What got duplicated once?"
    common_errors:
      - "Reruns manually and cleans up by hand."

  - external_key: resume_screening.data_ai_claims.data_model_warehouse
    competency_key: data_engineering
    topic: "Data modelling"
    difficulty: medium
    text: "You designed a data model for analytics. What trade-offs did you make between flexibility and ease of querying, and what would you revisit?"
    expected_concepts:
      - "dimensional or wide table choices"
      - "grain"
      - "history tracking"
      - "query patterns"
      - "evolution"
    rubric:
      excellent: "States the grain, explains choices for history and queries and names what to revisit."
      good: "Describes the model."
      weak: "Copied source tables."
    followups:
      - "What grain did you choose?"
      - "How did you handle changing attributes?"
    common_errors:
      - "Copied source tables."

  - external_key: resume_screening.data_ai_claims.data_contract_ownership
    competency_key: data_engineering
    topic: "Data contracts and upstream changes"
    difficulty: medium
    text: "An upstream team changed their data and your pipeline broke. How did you handle it then, and what arrangement did you set up so it would not repeat?"
    expected_concepts:
      - "detection"
      - "communication"
      - "schema checks or contracts"
      - "ownership"
      - "monitoring"
    rubric:
      excellent: "Describes detection, collaboration with the producer and contracts or checks that prevent repeats."
      good: "Describes fix and communication."
      weak: "Fixes the pipeline each time."
    followups:
      - "How did you find out?"
      - "Who owns the schema now?"
    common_errors:
      - "Fixes the pipeline each time."

  - external_key: resume_screening.data_ai_claims.lakehouse_cost_governance
    competency_key: cloud_cost_optimization
    topic: "Data platform cost"
    difficulty: medium
    text: "You managed cost of a data platform. What were the top cost drivers and what controls did you add?"
    expected_concepts:
      - "cost breakdown"
      - "query governance"
      - "storage tiers"
      - "user education"
      - "chargeback"
    rubric:
      excellent: "Identifies drivers using usage data and adds controls such as quotas and education."
      good: "Describes savings."
      weak: "Cannot say where the cost came from."
    followups:
      - "Which user or query was costly?"
      - "How did you communicate?"
    common_errors:
      - "Cannot say where the cost came from."

  - external_key: resume_screening.data_ai_claims.pii_handling_data
    competency_key: security
    topic: "Sensitive data in analytics"
    difficulty: medium
    text: "You worked with personal or sensitive data in a data platform. What protections did you apply and how did analysts still do their work?"
    expected_concepts:
      - "classification"
      - "masking"
      - "access control"
      - "audit"
      - "analyst workflow"
    rubric:
      excellent: "Classifies data, masks and controls access, audits and keeps analysts productive."
      good: "Describes protections."
      weak: "Gave full access to everyone."
    followups:
      - "How did you handle requests for raw data?"
      - "What was logged?"
    common_errors:
      - "Gave full access to everyone."

  - external_key: resume_screening.data_ai_claims.analyst_to_decision_story
    competency_key: stakeholder_management
    topic: "Influencing with data"
    difficulty: easy
    text: "Tell me about a time your analysis was contradicted by a senior person's opinion. How did you handle it?"
    expected_concepts:
      - "checking the work"
      - "presenting evidence"
      - "listening"
      - "decision"
      - "follow-up"
    rubric:
      excellent: "Rechecks the analysis, presents clearly, engages with the objection and records the outcome."
      good: "Describes the discussion."
      weak: "Backed down or argued without evidence."
    followups:
      - "What did they challenge?"
      - "Who was right?"
    common_errors:
      - "Backed down or argued without evidence."

  - external_key: resume_screening.data_ai_claims.data_cleaning_decisions
    competency_key: data_analysis
    topic: "Cleaning messy data"
    difficulty: easy
    text: "You cleaned messy data for an analysis. Which cleaning decision changed the results most, and how did you record it?"
    expected_concepts:
      - "missing values"
      - "outliers"
      - "deduplication"
      - "assumptions recorded"
      - "sensitivity"
    rubric:
      excellent: "Identifies a decision with material effect, tests sensitivity and documents it."
      good: "Describes cleaning."
      weak: "Dropped rows without checking."
    followups:
      - "How many rows did you drop?"
      - "Would the conclusion have changed?"
    common_errors:
      - "Dropped rows without checking."

  - external_key: resume_screening.data_ai_claims.cohort_funnel_analysis
    competency_key: data_analysis
    topic: "Funnel or cohort analysis"
    difficulty: medium
    text: "You analysed funnels or cohorts. What pitfalls in interpreting them did you run into?"
    expected_concepts:
      - "cohort definition"
      - "survivorship"
      - "seasonality"
      - "segment differences"
      - "action"
    rubric:
      excellent: "Names concrete pitfalls and how they affected conclusions."
      good: "Describes the analysis."
      weak: "Reports overall conversion only."
    followups:
      - "What segment behaved differently?"
      - "What did you recommend?"
    common_errors:
      - "Reports overall conversion only."

  - external_key: resume_screening.data_ai_claims.bi_tool_governance
    competency_key: data_visualization
    topic: "Dashboard sprawl"
    difficulty: medium
    text: "You managed a business intelligence environment. How did you stop numbers differing between dashboards?"
    expected_concepts:
      - "certified datasets"
      - "definitions"
      - "ownership"
      - "deprecation"
      - "training"
    rubric:
      excellent: "Establishes shared definitions, certified sources and deprecation."
      good: "Describes governance."
      weak: "Let each team build its own numbers."
    followups:
      - "Which dashboards did you retire?"
      - "How were conflicts resolved?"
    common_errors:
      - "Let each team build its own numbers."

  - external_key: resume_screening.data_ai_claims.visualisation_choice
    competency_key: data_visualization
    topic: "Choosing charts"
    difficulty: easy
    text: "You designed charts for decision makers. Tell me about a chart you changed after seeing it misunderstood."
    expected_concepts:
      - "audience"
      - "original design"
      - "misunderstanding"
      - "redesign"
      - "feedback"
    rubric:
      excellent: "Describes a specific misreading and the design change with feedback."
      good: "Describes a redesign."
      weak: "Cannot recall one."
    followups:
      - "What did people misread?"
      - "What did you remove?"
    common_errors:
      - "Cannot recall one."

  - external_key: resume_screening.data_ai_claims.model_evaluation_metrics
    competency_key: machine_learning
    topic: "Choosing evaluation metrics"
    difficulty: medium
    text: "You chose how a model was evaluated. Why that metric, and what would the model have looked like under a different one?"
    expected_concepts:
      - "business cost"
      - "class balance"
      - "metric trade-offs"
      - "validation split"
      - "error analysis"
    rubric:
      excellent: "Chooses by cost, checks balance and splits correctly, and performs error analysis."
      good: "Describes metrics."
      weak: "Default accuracy."
    followups:
      - "Where did the model fail?"
      - "How did you split data?"
    common_errors:
      - "Default accuracy."

  - external_key: resume_screening.data_ai_claims.overfitting_leakage_catch
    competency_key: machine_learning
    topic: "Leakage or overfitting"
    difficulty: hard
    text: "Have you found a result in your own work that turned out too good to be true? How did you find the problem?"
    expected_concepts:
      - "suspicion"
      - "investigation"
      - "cause such as leakage"
      - "correction"
      - "process change"
    rubric:
      excellent: "Describes suspicion, a systematic check, the cause and process safeguards."
      good: "Describes finding a problem."
      weak: "Cannot recall one."
    followups:
      - "What alerted you?"
      - "What check do you run now?"
    common_errors:
      - "Cannot recall one."

  - external_key: resume_screening.data_ai_claims.model_serving_latency
    competency_key: mlops
    topic: "Serving and latency"
    difficulty: medium
    text: "You served a model in production. What were the latency requirements, and what did you do to meet them?"
    expected_concepts:
      - "latency budget"
      - "batching"
      - "model optimisation"
      - "caching"
      - "monitoring"
    rubric:
      excellent: "States budget, measures, applies optimisations and monitors tail latency."
      good: "Describes serving."
      weak: "Reports average latency only."
    followups:
      - "What percentile mattered?"
      - "What did you trade away?"
    common_errors:
      - "Reports average latency only."

  - external_key: resume_screening.data_ai_claims.retraining_pipeline
    competency_key: mlops
    topic: "Retraining and release"
    difficulty: medium
    text: "You built retraining or model release processes. How was a new model checked before replacing the old one?"
    expected_concepts:
      - "validation gates"
      - "shadow or canary"
      - "rollback"
      - "versioning"
      - "approvals"
    rubric:
      excellent: "Uses automated gates, shadow or canary releases, rollback and versioning."
      good: "Describes the process."
      weak: "Replaced models manually."
    followups:
      - "What stopped a bad model?"
      - "How was rollback done?"
    common_errors:
      - "Replaced models manually."

  - external_key: resume_screening.data_ai_claims.llm_agent_tool_use
    competency_key: llm_engineering
    topic: "Agentic or multi-step LLM features"
    difficulty: hard
    text: "You built an LLM feature that calls tools or runs several steps. What went wrong in multi-step runs and how did you make them reliable?"
    expected_concepts:
      - "failure modes"
      - "step validation"
      - "retries and limits"
      - "observability"
      - "evaluation"
    rubric:
      excellent: "Describes concrete failure modes and controls like validation, limits and traces."
      good: "Describes the design."
      weak: "Trusts the model's output unchecked."
    followups:
      - "How did you trace a failed run?"
      - "What limits did you set?"
    common_errors:
      - "Trusts the model's output unchecked."

  - external_key: resume_screening.data_ai_claims.embeddings_search_quality
    competency_key: llm_engineering
    topic: "Semantic search"
    difficulty: medium
    text: "You used embeddings for search or recommendations. How did you evaluate relevance, and what queries did it handle badly?"
    expected_concepts:
      - "evaluation set"
      - "hybrid search"
      - "chunking"
      - "failure queries"
      - "iteration"
    rubric:
      excellent: "Uses an evaluation set, examines failing queries and iterates with hybrid or reranking approaches."
      good: "Describes the system."
      weak: "Relied on a few demo queries."
    followups:
      - "Which queries failed?"
      - "Did you try keyword search?"
    common_errors:
      - "Relied on a few demo queries."

  - external_key: resume_screening.data_ai_claims.fine_tune_vs_prompt
    competency_key: llm_engineering
    topic: "Fine-tuning decision"
    difficulty: hard
    text: "You considered fine-tuning a language model. How did you decide between that, better prompts and retrieval?"
    expected_concepts:
      - "problem diagnosis"
      - "data availability"
      - "cost"
      - "evaluation"
      - "maintenance"
    rubric:
      excellent: "Diagnoses the failure type, compares options by evidence and cost and plans maintenance."
      good: "Describes the decision."
      weak: "Fine-tuned because it sounded advanced."
    followups:
      - "What data did you need?"
      - "How did you measure gain?"
    common_errors:
      - "Fine-tuned because it sounded advanced."

  - external_key: resume_screening.data_ai_claims.ai_data_privacy
    competency_key: security
    topic: "Privacy in AI features"
    difficulty: medium
    text: "Your AI feature handled user content. What did you do about sending sensitive data to a model and about what the model might reveal?"
    expected_concepts:
      - "data minimisation"
      - "redaction"
      - "provider terms"
      - "access control"
      - "logging"
    rubric:
      excellent: "Minimises and redacts data, controls access and logging, and considers leakage."
      good: "Describes some controls."
      weak: "Sent raw content to the model."
    followups:
      - "What did you redact?"
      - "How is logging handled?"
    common_errors:
      - "Sent raw content to the model."

  - external_key: resume_screening.data_ai_claims.product_analytics_instrumentation
    competency_key: data_analysis
    topic: "Tracking plans"
    difficulty: easy
    text: "You defined tracking for a product so it could be analysed. How did you make sure events meant the same thing across platforms?"
    expected_concepts:
      - "tracking plan"
      - "naming"
      - "validation"
      - "ownership"
      - "changes"
    rubric:
      excellent: "Maintains a plan, validates events and manages changes."
      good: "Describes the plan."
      weak: "Tracked events ad hoc."
    followups:
      - "What broke the data?"
      - "Who approves new events?"
    common_errors:
      - "Tracked events ad hoc."

  - external_key: resume_screening.data_ai_claims.dashboard_accuracy_incident
    competency_key: data_analysis
    topic: "Wrong numbers reached decision makers"
    difficulty: hard
    text: "Has a number you produced ever turned out wrong after it was used? What did you do?"
    expected_concepts:
      - "discovery"
      - "communication"
      - "correction"
      - "cause"
      - "prevention"
    rubric:
      excellent: "Quickly reports and corrects, explains cause and adds checks."
      good: "Describes correction."
      weak: "Cannot recall one."
    followups:
      - "Who relied on it?"
      - "What check exists now?"
    common_errors:
      - "Cannot recall one."

  - external_key: resume_screening.data_ai_claims.python_data_tooling
    competency_key: python
    topic: "Python for data work"
    difficulty: easy
    text: "You wrote Python for data processing. Tell me about code that you had to rewrite because it did not scale, and what you changed."
    expected_concepts:
      - "bottleneck"
      - "memory"
      - "vectorisation or distributed processing"
      - "profiling"
      - "result"
    rubric:
      excellent: "Profiles, identifies the bottleneck and makes a targeted change with figures."
      good: "Describes the rewrite."
      weak: "Cannot identify the bottleneck."
    followups:
      - "What was the memory use?"
      - "What library helped?"
    common_errors:
      - "Cannot identify the bottleneck."

  - external_key: resume_screening.data_ai_claims.reproducibility_experiments
    competency_key: machine_learning
    topic: "Reproducible research"
    difficulty: easy
    text: "You ran many experiments. How did you track them so you could reproduce your best result months later?"
    expected_concepts:
      - "versioning of code, data and parameters"
      - "experiment tracking"
      - "seeds"
      - "environment"
      - "documentation"
    rubric:
      excellent: "Tracks code, data and configuration and reproduces a past result."
      good: "Describes tracking."
      weak: "Keeps results in notebooks."
    followups:
      - "Have you reproduced an old result?"
      - "What did you version?"
    common_errors:
      - "Keeps results in notebooks."

  - external_key: resume_screening.data_ai_claims.mentoring_data_juniors
    competency_key: mentoring
    topic: "Helping others with data skills"
    difficulty: medium
    text: "You mentored or trained others in analytics or modelling. What did you do when a junior colleague's conclusion was wrong?"
    expected_concepts:
      - "reviewing work"
      - "asking questions"
      - "teaching checks"
      - "feedback"
      - "growth"
    rubric:
      excellent: "Guides through questions and checks, gives feedback and sees improvement."
      good: "Describes mentoring."
      weak: "Corrected silently."
    followups:
      - "What check did you teach?"
      - "What changed afterwards?"
    common_errors:
      - "Corrected silently."

  - external_key: resume_screening.data_ai_claims.business_impact_data_project
    competency_key: ownership
    topic: "Impact of data work"
    difficulty: hard
    text: "Take the data project you consider most valuable. How would the business have been different without it, and who can confirm that?"
    expected_concepts:
      - "counterfactual"
      - "metrics"
      - "stakeholders"
      - "attribution"
      - "limits"
    rubric:
      excellent: "Provides evidence, names stakeholders and limits claims."
      good: "Describes impact."
      weak: "Lists activities."
    followups:
      - "What else changed at the time?"
      - "Who owns the metric?"
    common_errors:
      - "Lists activities."
