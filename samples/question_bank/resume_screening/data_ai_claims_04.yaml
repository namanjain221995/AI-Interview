# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [data, data_analyst, data_scientist, ml, llm]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.data_ai_claims.kpi_dashboard_ownership
    competency_key: data_visualization
    topic: "Owning a KPI view"
    difficulty: easy
    text: "You own a key performance dashboard. Tell me about a time the numbers moved sharply and how you decided whether it was real or a data problem."
    expected_concepts:
      - "checking pipeline health"
      - "comparing sources"
      - "segment drill-down"
      - "communicating certainty"
      - "follow-up"
    rubric:
      excellent: "Checks data health first, compares sources, drills into segments and communicates what is known."
      good: "Describes investigation."
      weak: "Reported the movement without checking."
    followups:
      - "What did you check first?"
      - "Who did you tell?"
    common_errors:
      - "Reported the movement without checking."

  - external_key: resume_screening.data_ai_claims.ab_test_disagreement
    competency_key: statistics_experimentation
    topic: "Disagreeing about test results"
    difficulty: hard
    text: "A stakeholder wanted to launch based on an experiment you thought was inconclusive. How did you handle it?"
    expected_concepts:
      - "showing uncertainty"
      - "options such as more data"
      - "risk framing"
      - "decision ownership"
      - "follow-up"
    rubric:
      excellent: "Explains uncertainty plainly, offers options with risk framing and respects who decides."
      good: "Describes the discussion."
      weak: "Refused or gave in."
    followups:
      - "What did you propose?"
      - "What happened after launch?"
    common_errors:
      - "Refused or gave in."

  - external_key: resume_screening.data_ai_claims.etl_failure_backfill
    competency_key: data_engineering
    topic: "Reprocessing history"
    difficulty: medium
    text: "You had to reprocess a large amount of historical data. How did you plan it so it did not disrupt current jobs or users?"
    expected_concepts:
      - "scoping"
      - "resource isolation"
      - "idempotence"
      - "validation"
      - "communication"
    rubric:
      excellent: "Scopes, isolates resources, validates results and communicates."
      good: "Describes the backfill."
      weak: "Ran it on production at peak."
    followups:
      - "How long did it take?"
      - "How did you validate?"
    common_errors:
      - "Ran it on production at peak."

  - external_key: resume_screening.data_ai_claims.lineage_documentation
    competency_key: data_engineering
    topic: "Data documentation and lineage"
    difficulty: easy
    text: "You documented data sets or lineage. How did you keep documentation correct as things changed?"
    expected_concepts:
      - "automation"
      - "ownership"
      - "review"
      - "use"
      - "gaps"
    rubric:
      excellent: "Generates documentation from code where possible, assigns owners and reviews."
      good: "Describes documentation."
      weak: "Wrote once."
    followups:
      - "What was out of date?"
      - "Who uses it?"
    common_errors:
      - "Wrote once."

  - external_key: resume_screening.data_ai_claims.schema_evolution_pipeline
    competency_key: data_engineering
    topic: "Changing data structures in pipelines"
    difficulty: medium
    text: "Source data structure changed while your pipeline was running. How did your design cope?"
    expected_concepts:
      - "detection"
      - "tolerant parsing"
      - "versioning"
      - "downstream communication"
      - "tests"
    rubric:
      excellent: "Detects changes, uses tolerant handling and versioning, and informs consumers."
      good: "Describes handling."
      weak: "Pipeline failed with no alert."
    followups:
      - "How did you detect it?"
      - "What did consumers see?"
    common_errors:
      - "Pipeline failed with no alert."

  - external_key: resume_screening.data_ai_claims.query_costs_users
    competency_key: cloud_cost_optimization
    topic: "Controlling analyst queries"
    difficulty: medium
    text: "Analysts ran expensive queries. How did you help them without blocking exploration?"
    expected_concepts:
      - "visibility"
      - "guidance"
      - "quotas"
      - "optimisation tips"
      - "culture"
    rubric:
      excellent: "Shares cost visibility, sets sensible quotas and teaches optimisation."
      good: "Describes controls."
      weak: "Blocked access."
    followups:
      - "What was the costliest query?"
      - "How did analysts react?"
    common_errors:
      - "Blocked access."

  - external_key: resume_screening.data_ai_claims.ml_model_rollback
    competency_key: mlops
    topic: "Model release problem"
    difficulty: hard
    text: "A new model release performed worse than expected in production. What was your response?"
    expected_concepts:
      - "detection"
      - "rollback"
      - "analysis"
      - "cause"
      - "process fix"
    rubric:
      excellent: "Detects quickly, rolls back, finds the cause and improves release gates."
      good: "Describes the event."
      weak: "Left it deployed while investigating."
    followups:
      - "How did you detect it?"
      - "What gate was added?"
    common_errors:
      - "Left it deployed while investigating."

  - external_key: resume_screening.data_ai_claims.data_labeling_ops_scale
    competency_key: ownership
    topic: "Scaling data operations"
    difficulty: medium
    text: "You scaled a data operation, such as labelling or content review. What processes made quality hold as volume grew?"
    expected_concepts:
      - "guidelines"
      - "sampling audits"
      - "training"
      - "tooling"
      - "metrics"
    rubric:
      excellent: "Uses guidelines, audits, tooling and metrics to hold quality."
      good: "Describes scaling."
      weak: "Hired more people only."
    followups:
      - "How was quality measured?"
      - "What slipped?"
    common_errors:
      - "Hired more people only."

  - external_key: resume_screening.data_ai_claims.search_analytics_tuning
    competency_key: llm_engineering
    topic: "Tuning retrieval and ranking"
    difficulty: medium
    text: "You tuned retrieval or ranking. What single change gave the biggest improvement in your evaluation, and why?"
    expected_concepts:
      - "evaluation set"
      - "change"
      - "analysis of results"
      - "cause"
      - "regression check"
    rubric:
      excellent: "Names a change, shows measured gain, and explains the cause."
      good: "Describes tuning."
      weak: "Cannot attribute improvement."
    followups:
      - "What did not help?"
      - "How did you avoid overfitting to the test set?"
    common_errors:
      - "Cannot attribute improvement."

  - external_key: resume_screening.data_ai_claims.llm_vendor_switch
    competency_key: llm_engineering
    topic: "Changing model providers"
    difficulty: medium
    text: "You switched or upgraded the language model behind a feature. How did you check nothing important regressed?"
    expected_concepts:
      - "evaluation suite"
      - "prompt differences"
      - "shadow testing"
      - "rollout"
      - "monitoring"
    rubric:
      excellent: "Runs evaluation on both, shadows, rolls out gradually and monitors."
      good: "Describes the switch."
      weak: "Switched and watched complaints."
    followups:
      - "What regressed?"
      - "How did you roll out?"
    common_errors:
      - "Switched and watched complaints."

  - external_key: resume_screening.data_ai_claims.customer_support_ai
    competency_key: llm_engineering
    topic: "AI for support or operations"
    difficulty: easy
    text: "You built AI assistance for a support or operations workflow. What did staff think of it after the first weeks?"
    expected_concepts:
      - "user research"
      - "usage"
      - "feedback"
      - "changes"
      - "value"
    rubric:
      excellent: "Gathers feedback, adapts the feature and shows value."
      good: "Describes the tool."
      weak: "No user feedback."
    followups:
      - "What did they ask to change?"
      - "What did they stop using?"
    common_errors:
      - "No user feedback."

  - external_key: resume_screening.data_ai_claims.report_automation_savings
    competency_key: data_analysis
    topic: "Automated reporting"
    difficulty: easy
    text: "You automated recurring reports. How many hours did it save, and who validated that the automated version matched the manual one?"
    expected_concepts:
      - "baseline effort"
      - "validation"
      - "users"
      - "maintenance"
      - "limits"
    rubric:
      excellent: "Quantifies hours, validates with owners and maintains it."
      good: "Describes savings."
      weak: "Gives a figure with no basis."
    followups:
      - "How did you measure time?"
      - "Who owns it now?"
    common_errors:
      - "Gives a figure with no basis."

  - external_key: resume_screening.data_ai_claims.regression_discontinuity_choice
    competency_key: statistics_experimentation
    topic: "Method choice without an experiment"
    difficulty: hard
    text: "You estimated the effect of something without a randomised test. What method did you use and what assumptions had to hold?"
    expected_concepts:
      - "method choice"
      - "assumptions"
      - "checks"
      - "limits"
      - "communication"
    rubric:
      excellent: "Names method and assumptions, tests them and communicates limits."
      good: "Describes method."
      weak: "Compared before and after only."
    followups:
      - "What assumption was weakest?"
      - "How did you test it?"
    common_errors:
      - "Compared before and after only."

  - external_key: resume_screening.data_ai_claims.data_science_prioritisation
    competency_key: stakeholder_management
    topic: "Choosing which projects to do"
    difficulty: medium
    text: "You had more data requests than time. How did you decide what to work on?"
    expected_concepts:
      - "value estimate"
      - "effort"
      - "stakeholders"
      - "communication"
      - "review"
    rubric:
      excellent: "Uses explicit criteria, communicates decisions and revisits."
      good: "Describes prioritising."
      weak: "First come first served."
    followups:
      - "What did you decline?"
      - "How did they react?"
    common_errors:
      - "First come first served."

  - external_key: resume_screening.data_ai_claims.ml_documentation_model_card
    competency_key: communication
    topic: "Documenting models"
    difficulty: medium
    text: "You documented a model for others. What did you include about its limits and where it should not be used?"
    expected_concepts:
      - "intended use"
      - "data"
      - "metrics"
      - "limits"
      - "ownership"
    rubric:
      excellent: "Lists intended use, data, evaluation and clear limits."
      good: "Describes documentation."
      weak: "Wrote only how to run it."
    followups:
      - "Who read it?"
      - "What limit did you state?"
    common_errors:
      - "Wrote only how to run it."

  - external_key: resume_screening.data_ai_claims.kafka_event_schema_ml
    competency_key: distributed_systems
    topic: "Events for machine learning"
    difficulty: medium
    text: "You set up event data used for both operations and modelling. How did you handle events whose meaning changed?"
    expected_concepts:
      - "schemas"
      - "versioning"
      - "compatibility"
      - "communication"
      - "backfills"
    rubric:
      excellent: "Versions schemas, preserves compatibility and manages history."
      good: "Describes handling."
      weak: "Overwrote history."
    followups:
      - "How did you version?"
      - "What happened to old data?"
    common_errors:
      - "Overwrote history."

  - external_key: resume_screening.data_ai_claims.data_team_standards
    competency_key: code_quality
    topic: "Standards for data code"
    difficulty: medium
    text: "You raised the quality of data code in a team. What practices did you introduce for review and testing?"
    expected_concepts:
      - "version control"
      - "review"
      - "tests"
      - "style"
      - "adoption"
    rubric:
      excellent: "Introduces specific practices, gains adoption and measures effects."
      good: "Describes practices."
      weak: "Left notebooks unversioned."
    followups:
      - "What was resisted?"
      - "What improved?"
    common_errors:
      - "Left notebooks unversioned."

  - external_key: resume_screening.data_ai_claims.hardest_data_bug
    competency_key: debugging
    topic: "Hardest data problem"
    difficulty: hard
    text: "What was the hardest data discrepancy you ever tracked down, and what was the cause?"
    expected_concepts:
      - "symptom"
      - "investigation"
      - "cause"
      - "fix"
      - "prevention"
    rubric:
      excellent: "Describes disciplined investigation, a precise cause and prevention."
      good: "Describes cause and fix."
      weak: "Cannot give specifics."
    followups:
      - "What did you rule out?"
      - "What check exists now?"
    common_errors:
      - "Cannot give specifics."

  - external_key: resume_screening.data_ai_claims.analytics_ethics_boundaries
    competency_key: stakeholder_management
    topic: "Limits on data use"
    difficulty: hard
    text: "Have you been asked to use data in a way that raised concerns about privacy or fairness? What did you do?"
    expected_concepts:
      - "identifying concern"
      - "raising it"
      - "alternatives"
      - "policy"
      - "outcome"
    rubric:
      excellent: "Raises concerns with specific reasoning, offers alternatives and follows policy."
      good: "Describes the situation."
      weak: "Complied without raising it."
    followups:
      - "Who did you talk to?"
      - "What was decided?"
    common_errors:
      - "Complied without raising it."

  - external_key: resume_screening.data_ai_claims.open_source_data_tools
    competency_key: collaboration
    topic: "Contributions and community"
    difficulty: easy
    text: "You list contributions to open data or machine learning projects, or publications. Which piece of that work do you consider the most useful and why?"
    expected_concepts:
      - "contribution"
      - "audience"
      - "reception"
      - "learning"
      - "follow-up"
    rubric:
      excellent: "Describes a concrete contribution, its audience and a lesson."
      good: "Describes contribution."
      weak: "Lists items only."
    followups:
      - "Who used it?"
      - "What feedback did you get?"
    common_errors:
      - "Lists items only."

  - external_key: resume_screening.data_ai_claims.sampling_big_data
    competency_key: data_engineering
    topic: "Working with big data"
    difficulty: easy
    text: "You worked with very large data. When did you sample, and when did you refuse to?"
    expected_concepts:
      - "sampling risks"
      - "representativeness"
      - "accuracy needs"
      - "cost"
      - "validation"
    rubric:
      excellent: "Explains when sampling is valid and invalid with examples."
      good: "Describes sampling."
      weak: "Always used full data."
    followups:
      - "What bias could sampling add?"
      - "How did you validate it?"
    common_errors:
      - "Always used full data."

  - external_key: resume_screening.data_ai_claims.kaggle_or_course_project
    competency_key: adaptability
    topic: "Learning projects"
    difficulty: easy
    text: "You list a competition or course project in data. What did you do there that you later reused at work?"
    expected_concepts:
      - "technique"
      - "application"
      - "result"
      - "limits"
      - "reflection"
    rubric:
      excellent: "Describes a reused technique and where it differed in real data."
      good: "Describes use."
      weak: "Lists the project only."
    followups:
      - "What was different in real work?"
      - "What did you drop?"
    common_errors:
      - "Lists the project only."

  - external_key: resume_screening.data_ai_claims.cross_team_data_request_handling
    competency_key: collaboration
    topic: "Handling data requests"
    difficulty: medium
    text: "Several teams asked you for the same data in different shapes. How did you resolve it?"
    expected_concepts:
      - "gathering needs"
      - "common model"
      - "communication"
      - "trade-offs"
      - "delivery"
    rubric:
      excellent: "Gathers needs, designs a common model and communicates trade-offs."
      good: "Describes resolution."
      weak: "Built separate extracts each time."
    followups:
      - "What did you give up?"
      - "How did they respond?"
    common_errors:
      - "Built separate extracts each time."

  - external_key: resume_screening.data_ai_claims.long_running_project_delivery
    competency_key: project_management
    topic: "Delivering a long data project"
    difficulty: medium
    text: "Your resume lists a data project that ran for months. How did you show progress and manage changes in scope?"
    expected_concepts:
      - "milestones"
      - "demos"
      - "scope control"
      - "risks"
      - "stakeholder updates"
    rubric:
      excellent: "Uses milestones, demos and change control, communicates risk."
      good: "Describes progress."
      weak: "Delivered at the end only."
    followups:
      - "What scope changed?"
      - "How did you report?"
    common_errors:
      - "Delivered at the end only."

  - external_key: resume_screening.data_ai_claims.model_choice_simple_vs_complex
    competency_key: machine_learning
    topic: "Simple versus complex models"
    difficulty: medium
    text: "You chose between a simple and a complex modelling approach. What made you pick the one you did, and what evidence would have changed your mind?"
    expected_concepts:
      - "baseline performance"
      - "complexity cost"
      - "interpretability"
      - "maintenance"
      - "evidence thresholds"
    rubric:
      excellent: "Compares with a simple baseline, weighs maintenance and interpretability, and states what evidence would change the choice."
      good: "Describes the choice."
      weak: "Picked the most advanced method."
    followups:
      - "How much better was it?"
      - "Who maintains it?"
    common_errors:
      - "Picked the most advanced method."
