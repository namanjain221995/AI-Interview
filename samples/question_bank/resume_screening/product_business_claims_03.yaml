# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [product_manager, project_manager, business_analyst, ux_designer, support_engineer]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.product_business_claims.okr_product_outcomes
    competency_key: product_sense
    topic: "Outcome-based goals"
    difficulty: medium
    text: "You set product goals around outcomes rather than output. Give an example of a goal, how it was measured, and what you did when you were off track."
    expected_concepts:
      - "outcome versus output"
      - "measure"
      - "review cadence"
      - "corrective action"
      - "learning"
    rubric:
      excellent: "Defines an outcome with a measure, reviews it regularly and changes course based on data."
      good: "Describes a goal and a measure."
      weak: "Listed features shipped as goals."
    followups:
      - "What did you change midway?"
      - "How did you pick the measure?"
    common_errors:
      - "Listed features shipped as goals."

  - external_key: resume_screening.product_business_claims.customer_interview_synthesis
    competency_key: ux_research
    topic: "Interview synthesis"
    difficulty: medium
    text: "You interviewed customers. How did you turn many conversations into a decision the team could act on?"
    expected_concepts:
      - "interview guide"
      - "coding of notes"
      - "patterns"
      - "evidence strength"
      - "recommendations"
    rubric:
      excellent: "Uses structured notes, finds patterns across participants and states how strong the evidence is."
      good: "Describes interviews and themes."
      weak: "Reports memorable quotes only."
    followups:
      - "How many interviews were enough?"
      - "What did you discard?"
    common_errors:
      - "Reports memorable quotes only."

  - external_key: resume_screening.product_business_claims.heuristic_evaluation_audit
    competency_key: ux_design
    topic: "Design audit"
    difficulty: easy
    text: "You audited a product's design or usability. What were the findings that mattered most, and how did you prioritise?"
    expected_concepts:
      - "method"
      - "severity"
      - "user impact"
      - "recommendations"
      - "follow-up"
    rubric:
      excellent: "Rates issues by severity and user impact, recommends specific fixes and follows up."
      good: "Describes the audit."
      weak: "Lists every issue equally."
    followups:
      - "Which issue got fixed?"
      - "How did you rate severity?"
    common_errors:
      - "Lists every issue equally."

  - external_key: resume_screening.product_business_claims.mobile_vs_web_design
    competency_key: ux_design
    topic: "Designing for different devices"
    difficulty: medium
    text: "You designed for multiple platforms. Which decision differed most between them, and why?"
    expected_concepts:
      - "platform conventions"
      - "constraints"
      - "research"
      - "consistency"
      - "testing"
    rubric:
      excellent: "Explains platform-specific choices with evidence and keeps consistency where it matters."
      good: "Describes differences."
      weak: "Shrunk the desktop design."
    followups:
      - "What did users struggle with?"
      - "What stayed the same?"
    common_errors:
      - "Shrunk the desktop design."

  - external_key: resume_screening.product_business_claims.accessibility_audit_fixes
    competency_key: accessibility
    topic: "Accessibility programme"
    difficulty: hard
    text: "You led accessibility improvements across a product. How did you prioritise, and how did you stop new problems from appearing?"
    expected_concepts:
      - "audit"
      - "prioritisation by user impact"
      - "training"
      - "checks in process"
      - "measurement"
    rubric:
      excellent: "Prioritises by impact, trains teams, adds checks to the process and tracks progress."
      good: "Describes the programme."
      weak: "Fixed a list once."
    followups:
      - "What barrier was most serious?"
      - "Who is accountable now?"
    common_errors:
      - "Fixed a list once."

  - external_key: resume_screening.product_business_claims.product_analytics_dashboards
    competency_key: data_analysis
    topic: "Product analytics"
    difficulty: easy
    text: "You set up product analytics. Which questions did you want answered, and which of them could the data actually answer?"
    expected_concepts:
      - "question list"
      - "instrumentation"
      - "limits"
      - "segmentation"
      - "decisions"
    rubric:
      excellent: "Starts from questions, notes what data cannot answer and uses it for decisions."
      good: "Describes metrics set."
      weak: "Tracked all events."
    followups:
      - "Which question could you not answer?"
      - "What did you add?"
    common_errors:
      - "Tracked all events."

  - external_key: resume_screening.product_business_claims.go_to_market_launch
    competency_key: stakeholder_management
    topic: "Launch coordination"
    difficulty: medium
    text: "You coordinated a launch with marketing, support and sales. What did each group need from you and what was missed?"
    expected_concepts:
      - "needs of each group"
      - "timeline"
      - "readiness"
      - "communication"
      - "post-launch"
    rubric:
      excellent: "Identifies needs, plans readiness and learns from misses."
      good: "Describes coordination."
      weak: "Told others the date."
    followups:
      - "What did support need?"
      - "What did you miss?"
    common_errors:
      - "Told others the date."

  - external_key: resume_screening.product_business_claims.backlog_grooming_quality
    competency_key: agile_delivery
    topic: "Backlog management"
    difficulty: easy
    text: "Your resume says you owned a team's work queue. What did you do to stop old, unclear items from piling up, and how did you know people still trusted it?"
    expected_concepts:
      - "refinement"
      - "ordering"
      - "pruning"
      - "clarity"
      - "collaboration"
    rubric:
      excellent: "Refines regularly, prunes old items and keeps the top clear."
      good: "Describes the backlog."
      weak: "Let it grow."
    followups:
      - "How many items did you delete?"
      - "How did you order?"
    common_errors:
      - "Let it grow."

  - external_key: resume_screening.product_business_claims.release_planning_dependencies
    competency_key: project_management
    topic: "Release planning"
    difficulty: medium
    text: "You planned a release with many dependencies. How did you find and manage them?"
    expected_concepts:
      - "dependency mapping"
      - "sequencing"
      - "risks"
      - "communication"
      - "contingency"
    rubric:
      excellent: "Maps dependencies early, sequences, monitors risk and has contingencies."
      good: "Describes plan."
      weak: "Discovered dependencies late."
    followups:
      - "Which dependency slipped?"
      - "What was the fallback?"
    common_errors:
      - "Discovered dependencies late."

  - external_key: resume_screening.product_business_claims.regulatory_requirements
    competency_key: requirements_analysis
    topic: "Compliance requirements"
    difficulty: hard
    text: "Your work involved regulatory or policy requirements. How did you translate them into requirements the team could build and test?"
    expected_concepts:
      - "reading regulation with experts"
      - "translation"
      - "traceability"
      - "testing"
      - "audit"
    rubric:
      excellent: "Works with compliance experts, creates traceable requirements and testable criteria."
      good: "Describes translation."
      weak: "Copied policy text into stories."
    followups:
      - "Who interpreted the rules?"
      - "How was it audited?"
    common_errors:
      - "Copied policy text into stories."

  - external_key: resume_screening.product_business_claims.stakeholder_analysis_comm_plan
    competency_key: stakeholder_management
    topic: "Stakeholder communication plan"
    difficulty: easy
    text: "You made a stakeholder or communication plan. How did you decide who needed what information and when?"
    expected_concepts:
      - "identification"
      - "influence and interest"
      - "cadence"
      - "channels"
      - "feedback"
    rubric:
      excellent: "Maps stakeholders, tailors content and cadence and checks that it works."
      good: "Describes plan."
      weak: "Sent the same update to everyone."
    followups:
      - "Who wanted less?"
      - "Who wanted more?"
    common_errors:
      - "Sent the same update to everyone."

  - external_key: resume_screening.product_business_claims.business_case_development
    competency_key: ownership
    topic: "Building a business case"
    difficulty: medium
    text: "You built a business case. What assumptions mattered most, and how did you test them?"
    expected_concepts:
      - "costs"
      - "benefits"
      - "assumptions"
      - "sensitivity"
      - "approval result"
    rubric:
      excellent: "Identifies key assumptions, tests sensitivity and reports the outcome."
      good: "Describes the case."
      weak: "Used optimistic numbers without testing."
    followups:
      - "Which number was weakest?"
      - "Was it approved?"
    common_errors:
      - "Used optimistic numbers without testing."

  - external_key: resume_screening.product_business_claims.workflow_automation_business
    competency_key: process_modeling
    topic: "Process automation"
    difficulty: medium
    text: "You automated a business workflow. How did you decide which steps to automate and which to leave to people?"
    expected_concepts:
      - "analysis"
      - "criteria"
      - "exceptions"
      - "users"
      - "measurement"
    rubric:
      excellent: "Analyses steps, keeps humans for exceptions, measures outcome."
      good: "Describes automation."
      weak: "Automated the existing process unchanged."
    followups:
      - "What exceptions did you find?"
      - "What did users say?"
    common_errors:
      - "Automated the existing process unchanged."

  - external_key: resume_screening.product_business_claims.support_to_product_feedback
    competency_key: collaboration
    topic: "Feeding customer insight back"
    difficulty: medium
    text: "You passed customer insight from support or sales to product. How did you make it persuasive and what changed?"
    expected_concepts:
      - "aggregation"
      - "evidence"
      - "framing"
      - "relationships"
      - "result"
    rubric:
      excellent: "Aggregates cases with data, frames by impact and shows a change made."
      good: "Describes feedback."
      weak: "Forwarded individual complaints."
    followups:
      - "How many customers were affected?"
      - "What was built?"
    common_errors:
      - "Forwarded individual complaints."

  - external_key: resume_screening.product_business_claims.incident_communication_customers
    competency_key: customer_communication
    topic: "Communicating during incidents"
    difficulty: hard
    text: "A service problem affected many customers. How did you handle communications while engineers fixed it?"
    expected_concepts:
      - "timely updates"
      - "clarity"
      - "ownership"
      - "channels"
      - "follow-up"
    rubric:
      excellent: "Gives frequent plain updates, owns the communication and follows with a clear explanation."
      good: "Describes updates."
      weak: "Stayed silent until it was fixed."
    followups:
      - "How often did you update?"
      - "What did you not say, and why?"
    common_errors:
      - "Stayed silent until it was fixed."

  - external_key: resume_screening.product_business_claims.training_materials_users
    competency_key: communication
    topic: "Training and onboarding material"
    difficulty: easy
    text: "You created training or guides for users. How did you find out what they struggled with?"
    expected_concepts:
      - "observation"
      - "ticket data"
      - "content"
      - "testing"
      - "update"
    rubric:
      excellent: "Uses data and observation to target training and revises it."
      good: "Describes materials."
      weak: "Wrote what the product does."
    followups:
      - "What did people struggle with?"
      - "How did you test the guide?"
    common_errors:
      - "Wrote what the product does."

  - external_key: resume_screening.product_business_claims.lean_six_sigma_style
    competency_key: process_modeling
    topic: "Measured process improvement"
    difficulty: hard
    text: "Your resume mentions a quality or efficiency programme. What was the measurable problem, and what proved it was solved?"
    expected_concepts:
      - "baseline"
      - "root cause analysis"
      - "changes"
      - "control measures"
      - "sustained gains"
    rubric:
      excellent: "Provides baseline, root cause analysis and measured sustained improvement."
      good: "Describes the programme."
      weak: "Quoted tool names."
    followups:
      - "What was the root cause?"
      - "Did it last?"
    common_errors:
      - "Quoted tool names."

  - external_key: resume_screening.product_business_claims.program_dependencies_multi_team
    competency_key: project_management
    topic: "Programme coordination"
    difficulty: hard
    text: "You coordinated multiple teams on one programme. How did you spot trouble early across all of them?"
    expected_concepts:
      - "shared plan"
      - "indicators"
      - "check-ins"
      - "escalation"
      - "decisions"
    rubric:
      excellent: "Uses a shared view with leading indicators and early escalation."
      good: "Describes coordination."
      weak: "Relied on status reports."
    followups:
      - "What was your early warning?"
      - "What did you escalate?"
    common_errors:
      - "Relied on status reports."

  - external_key: resume_screening.product_business_claims.user_feedback_loops
    competency_key: ux_research
    topic: "Continuous feedback"
    difficulty: easy
    text: "You set up ongoing feedback from users. What did you learn from it in the first months?"
    expected_concepts:
      - "channels"
      - "analysis"
      - "actions"
      - "closing loop"
      - "limits"
    rubric:
      excellent: "Collects feedback through several channels, analyses and acts on it."
      good: "Describes feedback channels."
      weak: "Collected feedback without using it."
    followups:
      - "What changed?"
      - "Who read it?"
    common_errors:
      - "Collected feedback without using it."

  - external_key: resume_screening.product_business_claims.prioritising_bugs_vs_features
    competency_key: product_sense
    topic: "Balancing fixes and features"
    difficulty: medium
    text: "How did you decide between fixing issues and building new things in your product?"
    expected_concepts:
      - "impact"
      - "cost"
      - "user data"
      - "capacity allocation"
      - "communication"
    rubric:
      excellent: "Uses impact data and a capacity policy and communicates trade-offs."
      good: "Describes balance."
      weak: "Always chose new features."
    followups:
      - "What share of capacity?"
      - "What was an example?"
    common_errors:
      - "Always chose new features."

  - external_key: resume_screening.product_business_claims.sponsor_reporting
    competency_key: project_management
    topic: "Reporting to sponsors"
    difficulty: easy
    text: "You reported project status to a sponsor. What was in the report, and what did you do when the news was bad?"
    expected_concepts:
      - "content"
      - "format"
      - "accuracy of status"
      - "early warning"
      - "options"
    rubric:
      excellent: "Reports status accurately with options and gives bad news early."
      good: "Describes reports."
      weak: "Reported everything as green."
    followups:
      - "When did you report the first slip?"
      - "What did the sponsor do?"
    common_errors:
      - "Reported everything as green."

  - external_key: resume_screening.product_business_claims.lessons_learned_practice
    competency_key: adaptability
    topic: "Lessons from projects"
    difficulty: easy
    text: "You ran retrospectives or lessons-learned sessions. Which lesson actually changed the way you worked afterward?"
    expected_concepts:
      - "format"
      - "findings"
      - "action"
      - "follow-through"
      - "result"
    rubric:
      excellent: "Names a lesson, the action taken and the change in later work."
      good: "Describes sessions."
      weak: "Holds sessions with no follow-up."
    followups:
      - "Who owned the action?"
      - "Did it help?"
    common_errors:
      - "Holds sessions with no follow-up."

  - external_key: resume_screening.product_business_claims.internal_tool_selection_business
    competency_key: stakeholder_management
    topic: "Selecting business tools"
    difficulty: medium
    text: "You selected or rolled out a business tool. How did you gather needs and compare options?"
    expected_concepts:
      - "needs"
      - "criteria"
      - "trial"
      - "stakeholder input"
      - "cost"
    rubric:
      excellent: "Gathers needs, uses criteria and trials, includes users and weighs cost."
      good: "Describes selection."
      weak: "Chose the tool the vendor pitched."
    followups:
      - "Who was involved?"
      - "What changed your choice?"
    common_errors:
      - "Chose the tool the vendor pitched."

  - external_key: resume_screening.product_business_claims.improving_handover_support
    competency_key: collaboration
    topic: "Shift or team handover"
    difficulty: easy
    text: "You improved handover between teams or shifts. What information was being lost before?"
    expected_concepts:
      - "problem"
      - "format"
      - "checks"
      - "adoption"
      - "result"
    rubric:
      excellent: "Identifies what was lost and introduces a structured handover that people use."
      good: "Describes the format."
      weak: "Informal chat only."
    followups:
      - "What was lost?"
      - "How did you check?"
    common_errors:
      - "Informal chat only."

  - external_key: resume_screening.product_business_claims.sunset_feature_decision
    competency_key: product_sense
    topic: "Retiring a feature or process"
    difficulty: medium
    text: "You retired a feature, report or process. How did you decide it should go, and how did you handle the people who still used it?"
    expected_concepts:
      - "usage data"
      - "cost of keeping"
      - "communication"
      - "migration help"
      - "outcome"
    rubric:
      excellent: "Uses usage and cost data, informs affected users early and offers an alternative."
      good: "Describes retirement."
      weak: "Removed it without notice to users."
    followups:
      - "Who complained?"
      - "What alternative did you offer?"
    common_errors:
      - "Removed it without notice to users."
