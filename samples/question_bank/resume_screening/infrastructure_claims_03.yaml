# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [devops, sre, platform, cloud, network, dba, security]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.infrastructure_claims.datacenter_exit_plan
    competency_key: aws
    topic: "Leaving a data centre"
    difficulty: medium
    text: "You list moving out of a data centre or off physical hardware. How did you decide the order of moves, and what dependency did you discover late?"
    expected_concepts:
      - "inventory and dependency mapping"
      - "grouping and sequencing"
      - "cutover rehearsals"
      - "late discoveries"
      - "decommissioning"
    rubric:
      excellent: "Builds an inventory, sequences by dependency and risk, rehearses and describes a late discovery and how it was handled."
      good: "Describes order and cutover."
      weak: "Moved systems by team preference with no dependency map."
    followups:
      - "What was in the old racks that nobody knew about?"
      - "How was old hardware retired?"
    common_errors:
      - "Moved systems by team preference with no dependency map."

  - external_key: resume_screening.infrastructure_claims.iac_module_standards
    competency_key: terraform
    topic: "Reusable infrastructure modules"
    difficulty: medium
    text: "You created shared infrastructure modules. How did you version them and handle teams that needed something different?"
    expected_concepts:
      - "module interface design"
      - "versioning and upgrades"
      - "testing"
      - "extension mechanisms"
      - "deprecations"
    rubric:
      excellent: "Designs small interfaces, versions modules with upgrade paths, tests them and handles exceptions without forks."
      good: "Describes modules and versions."
      weak: "Copy-pasted modules per team."
    followups:
      - "How did you test a module?"
      - "What did teams fork?"
    common_errors:
      - "Copy-pasted modules per team."

  - external_key: resume_screening.infrastructure_claims.terraform_state_incident
    competency_key: terraform
    topic: "State problems"
    difficulty: hard
    text: "Describe a time infrastructure code or its state caused a problem in your environment. How did you recover, and what changed in your process?"
    expected_concepts:
      - "nature of state problem"
      - "recovery steps"
      - "safeguards such as locking and backups"
      - "plan review"
      - "training"
    rubric:
      excellent: "Describes a real state problem, careful recovery and new safeguards such as locks, backups and reviewed plans."
      good: "Describes the problem and fix."
      weak: "Edited state by hand without a backup."
    followups:
      - "How did you back up state?"
      - "Did the plan show it before apply?"
    common_errors:
      - "Edited state by hand without a backup."

  - external_key: resume_screening.infrastructure_claims.docker_image_size_build
    competency_key: docker
    topic: "Container build improvements"
    difficulty: easy
    text: "You improved container builds. What made images large or slow to build and which change helped most?"
    expected_concepts:
      - "layers and caching"
      - "base image"
      - "multi-stage builds"
      - "dependency handling"
      - "results"
    rubric:
      excellent: "Identifies layer and dependency causes, applies multi-stage builds and shows size and time before and after."
      good: "Describes techniques and results."
      weak: "Lists tricks without figures."
    followups:
      - "How did you check layer sizes?"
      - "What did you leave in the final image?"
    common_errors:
      - "Lists tricks without figures."

  - external_key: resume_screening.infrastructure_claims.kubernetes_networking_issue
    competency_key: networking
    topic: "Cluster networking problem"
    difficulty: medium
    text: "Tell me about a networking problem inside a cluster or between environments. How did you work out where packets were being lost?"
    expected_concepts:
      - "symptoms"
      - "layered troubleshooting"
      - "tools such as capture and DNS checks"
      - "root cause"
      - "fix and monitoring"
    rubric:
      excellent: "Uses layered troubleshooting with captures and DNS checks, identifies the cause and adds monitoring."
      good: "Finds the cause with some method."
      weak: "Restarted components until it cleared."
    followups:
      - "Which tool gave the answer?"
      - "Was DNS involved?"
    common_errors:
      - "Restarted components until it cleared."

  - external_key: resume_screening.infrastructure_claims.persistent_storage_stateful
    competency_key: kubernetes
    topic: "Stateful workloads"
    difficulty: hard
    text: "You ran stateful systems such as databases or queues on container platforms. What went wrong and what did you conclude about whether it was a good idea?"
    expected_concepts:
      - "storage and scheduling constraints"
      - "failure scenarios"
      - "backup"
      - "operators"
      - "conclusion on suitability"
    rubric:
      excellent: "Describes concrete failures, backup and recovery, and a reasoned conclusion on when to run stateful systems there."
      good: "Describes setup and issues."
      weak: "Treats stateful workloads like stateless ones."
    followups:
      - "What happened on node failure?"
      - "Would you do it again?"
    common_errors:
      - "Treats stateful workloads like stateless ones."

  - external_key: resume_screening.infrastructure_claims.change_management_process
    competency_key: project_management
    topic: "Change control"
    difficulty: medium
    text: "You set up or improved change management. How did you protect production without making every change slow?"
    expected_concepts:
      - "risk-based categories"
      - "automated checks"
      - "approvals"
      - "emergency path"
      - "metrics on failures"
    rubric:
      excellent: "Differentiates by risk, automates checks, keeps an emergency path and tracks change failure rates."
      good: "Describes a process and approvals."
      weak: "Required the same approval for every change."
    followups:
      - "How many changes needed human approval?"
      - "What metric improved?"
    common_errors:
      - "Required the same approval for every change."

  - external_key: resume_screening.infrastructure_claims.patch_critical_vulnerability
    competency_key: security
    topic: "Responding to a critical vulnerability"
    difficulty: medium
    text: "A widely publicised vulnerability affected your estate. What did you do in the first day on a case like the one in your resume?"
    expected_concepts:
      - "inventory of affected systems"
      - "mitigation before patching"
      - "communication"
      - "patch rollout"
      - "verification"
    rubric:
      excellent: "Finds exposure quickly, applies mitigations, communicates, patches in order of risk and verifies."
      good: "Describes the response."
      weak: "Waited for the usual patch cycle."
    followups:
      - "How long to know where it was running?"
      - "What did you tell leadership?"
    common_errors:
      - "Waited for the usual patch cycle."

  - external_key: resume_screening.infrastructure_claims.dba_capacity_growth
    competency_key: database_administration
    topic: "Database growth"
    difficulty: medium
    text: "You managed a database that grew quickly. How did you spot trouble coming, and what did you do about storage, connections and maintenance?"
    expected_concepts:
      - "trend monitoring"
      - "storage planning"
      - "connection handling"
      - "maintenance windows"
      - "archiving"
    rubric:
      excellent: "Tracks trends, plans storage, manages connections and archives data with maintenance windows."
      good: "Describes monitoring and growth work."
      weak: "Responds when disk is full."
    followups:
      - "What did you archive?"
      - "How far ahead did you plan?"
    common_errors:
      - "Responds when disk is full."

  - external_key: resume_screening.infrastructure_claims.server_hardening_baseline
    competency_key: security
    topic: "Hardening systems"
    difficulty: easy
    text: "You hardened servers or applications. What baseline did you follow and how did you check that machines stayed in that state?"
    expected_concepts:
      - "baseline source"
      - "automation"
      - "compliance scanning"
      - "exceptions"
      - "drift handling"
    rubric:
      excellent: "Follows an established baseline, automates, scans regularly and records exceptions."
      good: "Describes steps and some checking."
      weak: "Applied once and never rechecked."
    followups:
      - "What baseline did you use?"
      - "Who approved exceptions?"
    common_errors:
      - "Applied once and never rechecked."

  - external_key: resume_screening.infrastructure_claims.bastion_access_audit
    competency_key: security
    topic: "Privileged access"
    difficulty: easy
    text: "You managed privileged or administrator access. How were access grants reviewed and how did you know who did what on a system?"
    expected_concepts:
      - "just-in-time or approval"
      - "logging and session recording"
      - "periodic review"
      - "revocation"
      - "break-glass"
    rubric:
      excellent: "Uses approval, logs actions, reviews access regularly and has a break-glass process."
      good: "Describes approvals and logs."
      weak: "Shared admin accounts."
    followups:
      - "How fast could you remove access?"
      - "Who reviewed the logs?"
    common_errors:
      - "Shared admin accounts."

  - external_key: resume_screening.infrastructure_claims.cost_visibility_tagging
    competency_key: cloud_cost_optimization
    topic: "Cost allocation"
    difficulty: easy
    text: "You created cost visibility by team or product. How did you deal with resources that nobody claimed?"
    expected_concepts:
      - "tagging policy"
      - "allocation"
      - "enforcement"
      - "reports"
      - "ownership of unclaimed resources"
    rubric:
      excellent: "Defines a tagging policy, enforces it, reports to teams and resolves unclaimed resources."
      good: "Describes tags and reports."
      weak: "Reports at account level only."
    followups:
      - "What share was untagged?"
      - "How did you enforce tags?"
    common_errors:
      - "Reports at account level only."

  - external_key: resume_screening.infrastructure_claims.sre_embedded_with_teams
    competency_key: collaboration
    topic: "Working with developers"
    difficulty: medium
    text: "You worked with development teams on reliability. Describe a change in how a team built or released things because of your work, and how you earned that trust."
    expected_concepts:
      - "building credibility"
      - "shared goals"
      - "practical recommendations"
      - "measurable change"
      - "relationship"
    rubric:
      excellent: "Shows trust built through help and data, a concrete team change and a measured effect."
      good: "Describes collaboration and a change."
      weak: "Issued requirements without engagement."
    followups:
      - "What did they resist?"
      - "How did you show benefit?"
    common_errors:
      - "Issued requirements without engagement."

  - external_key: resume_screening.infrastructure_claims.migration_dual_run
    competency_key: problem_solving
    topic: "Running old and new in parallel"
    difficulty: medium
    text: "You ran an old and new system side by side during a change. How did you compare results and decide when to switch?"
    expected_concepts:
      - "shadow traffic or parallel runs"
      - "comparison metrics"
      - "discrepancies"
      - "switch criteria"
      - "decommission"
    rubric:
      excellent: "Compares outputs systematically, investigates differences, defines switch criteria and decommissions the old system."
      good: "Describes parallel running."
      weak: "Switched on a date regardless of data."
    followups:
      - "What differences did you find?"
      - "Who signed off?"
    common_errors:
      - "Switched on a date regardless of data."

  - external_key: resume_screening.infrastructure_claims.ha_design_single_point
    competency_key: system_design
    topic: "Removing single points of failure"
    difficulty: medium
    text: "You removed a single point of failure. How did you find it, and what did you discover about the new failure modes you introduced?"
    expected_concepts:
      - "failure analysis"
      - "redundancy design"
      - "new complexity"
      - "testing failure"
      - "monitoring"
    rubric:
      excellent: "Finds the single point through analysis, introduces redundancy, recognises added complexity and tests failure."
      good: "Describes the fix."
      weak: "Assumed redundancy always improves availability."
    followups:
      - "How did you test it?"
      - "What new risk did redundancy add?"
    common_errors:
      - "Assumed redundancy always improves availability."

  - external_key: resume_screening.infrastructure_claims.bgp_dns_outage
    competency_key: network_engineering
    topic: "Major network incident"
    difficulty: hard
    text: "Tell me about the worst network-related outage you handled. How did you find the cause, and what do you do differently now?"
    expected_concepts:
      - "symptoms"
      - "investigation path"
      - "root cause"
      - "recovery"
      - "prevention"
    rubric:
      excellent: "Narrates structured investigation, root cause and durable prevention."
      good: "Describes cause and fix."
      weak: "Cannot give specifics."
    followups:
      - "What did monitoring say?"
      - "What change did you make?"
    common_errors:
      - "Cannot give specifics."

  - external_key: resume_screening.infrastructure_claims.performance_baseline_network
    competency_key: network_engineering
    topic: "Network performance"
    difficulty: easy
    text: "You improved network performance or reliability. What did you measure before changing anything?"
    expected_concepts:
      - "baseline latency, loss, throughput"
      - "tools"
      - "changes"
      - "comparison"
      - "ongoing monitoring"
    rubric:
      excellent: "Measures baseline first, makes targeted changes and compares afterward."
      good: "Describes changes and results."
      weak: "Changed config without a baseline."
    followups:
      - "Which tool did you use?"
      - "What was the largest gain?"
    common_errors:
      - "Changed config without a baseline."

  - external_key: resume_screening.infrastructure_claims.data_pipeline_infra_reliability
    competency_key: data_engineering
    topic: "Reliability of data platforms"
    difficulty: medium
    text: "You operated data or analytics infrastructure. How did you make scheduled jobs reliable and know when data was late or wrong?"
    expected_concepts:
      - "orchestration"
      - "retries"
      - "data freshness checks"
      - "alerts"
      - "ownership"
    rubric:
      excellent: "Uses orchestration with retries, freshness and quality checks and clear ownership of alerts."
      good: "Describes scheduling and alerts."
      weak: "Checked outputs when users complained."
    followups:
      - "What was the commonest failure?"
      - "Who got alerts?"
    common_errors:
      - "Checked outputs when users complained."

  - external_key: resume_screening.infrastructure_claims.autoscaling_cost_spike
    competency_key: cloud_cost_optimization
    topic: "Unexpected cost event"
    difficulty: medium
    text: "Describe an unexpected cost spike you investigated. How did you find the source and prevent it from happening again?"
    expected_concepts:
      - "detection"
      - "breakdown by service"
      - "root cause"
      - "remediation"
      - "guardrails and budgets"
    rubric:
      excellent: "Detects quickly, traces the source in billing data and adds budgets, alerts and guardrails."
      good: "Finds the cause and fixes."
      weak: "Found out from the monthly bill."
    followups:
      - "How fast did you detect it?"
      - "What guardrail exists now?"
    common_errors:
      - "Found out from the monthly bill."

  - external_key: resume_screening.infrastructure_claims.multi_cloud_choice
    competency_key: aws
    topic: "Multi-cloud or vendor choice"
    difficulty: medium
    text: "Your resume mentions working across more than one cloud or provider. What problem did it solve, and what did it cost in complexity?"
    expected_concepts:
      - "reason for multiple providers"
      - "common abstractions"
      - "operational overhead"
      - "skills"
      - "review of decision"
    rubric:
      excellent: "States a real reason, explains costs in abstraction and operations and reviews if it paid off."
      good: "Describes setup and some costs."
      weak: "Adopted multi-cloud for theoretical flexibility."
    followups:
      - "What was provider specific?"
      - "What would you consolidate?"
    common_errors:
      - "Adopted multi-cloud for theoretical flexibility."

  - external_key: resume_screening.infrastructure_claims.platform_team_roadmap
    competency_key: stakeholder_management
    topic: "Setting platform priorities"
    difficulty: hard
    text: "You influenced what a platform or infrastructure team worked on. How did you choose between reliability work, requests from teams and cost projects?"
    expected_concepts:
      - "gathering demand"
      - "prioritisation criteria"
      - "saying no"
      - "communicating"
      - "review"
    rubric:
      excellent: "Uses explicit criteria and data, says no with reasons and communicates the roadmap."
      good: "Describes priorities."
      weak: "Worked on whatever was requested first."
    followups:
      - "What did you decline?"
      - "How did you measure impact?"
    common_errors:
      - "Worked on whatever was requested first."

  - external_key: resume_screening.infrastructure_claims.routine_ops_automation
    competency_key: linux
    topic: "Automating routine operations"
    difficulty: easy
    text: "You scripted or automated a routine administration task. How did you make sure the automation could not cause a larger problem than the task itself?"
    expected_concepts:
      - "dry-run modes"
      - "limits"
      - "testing"
      - "logging"
      - "rollback"
    rubric:
      excellent: "Adds dry-run, limits blast radius, tests and logs actions."
      good: "Describes the automation and tests."
      weak: "Ran scripts across all hosts at once."
    followups:
      - "What happened on the first run?"
      - "How do you limit the scope?"
    common_errors:
      - "Ran scripts across all hosts at once."

  - external_key: resume_screening.infrastructure_claims.security_incident_response
    competency_key: security
    topic: "Security incident"
    difficulty: hard
    text: "Tell me about a security event you responded to. How did you decide what to contain first and how did you establish what was accessed?"
    expected_concepts:
      - "triage"
      - "containment"
      - "evidence preservation"
      - "scope analysis"
      - "lessons"
    rubric:
      excellent: "Triages, contains while preserving evidence, determines scope from logs and improves controls."
      good: "Describes the response."
      weak: "Rebuilt affected systems without preserving evidence."
    followups:
      - "What logs did you rely on?"
      - "Who did you notify?"
    common_errors:
      - "Rebuilt affected systems without preserving evidence."

  - external_key: resume_screening.infrastructure_claims.capacity_event_launch
    competency_key: distributed_systems
    topic: "Preparing for a big event"
    difficulty: medium
    text: "You prepared infrastructure for a launch or traffic peak. What testing and checks did you do, and what still surprised you?"
    expected_concepts:
      - "forecast"
      - "load testing"
      - "scaling limits"
      - "runbooks"
      - "surprises"
    rubric:
      excellent: "Uses forecasts and load tests, checks limits, prepares runbooks and describes a surprise."
      good: "Describes preparation."
      weak: "Added servers just in case."
    followups:
      - "What limit did you hit?"
      - "What did you change on the day?"
    common_errors:
      - "Added servers just in case."

  - external_key: resume_screening.infrastructure_claims.ownership_of_legacy_ops
    competency_key: ownership
    topic: "Operating inherited systems"
    difficulty: easy
    text: "You took over operation of systems you did not build. What did you do to understand and stabilise them in the first month?"
    expected_concepts:
      - "inventory"
      - "monitoring gaps"
      - "risk list"
      - "quick wins"
      - "documentation"
    rubric:
      excellent: "Inventories, adds monitoring, lists risks, delivers quick wins and documents."
      good: "Describes steps."
      weak: "Left everything as it was."
    followups:
      - "What was the biggest risk found?"
      - "What did you fix first?"
    common_errors:
      - "Left everything as it was."
