# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [devops, sre, platform, cloud, network, dba, security]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.infrastructure_claims.kubernetes_migration_scope
    competency_key: kubernetes
    topic: "Migration to Kubernetes"
    difficulty: easy
    text: "Your resume says you moved workloads onto Kubernetes. What was running before, what moved first, and what did you deliberately leave where it was?"
    expected_concepts:
      - "starting platform and motivation"
      - "selecting first workloads"
      - "what stayed behind and why"
      - "migration sequence"
      - "measured outcome"
    rubric:
      excellent: "Explains motivation, picks low-risk first workloads, leaves some systems out with reasons and shows an outcome measured against the old setup."
      good: "Describes the move and some choices."
      weak: "Moved everything because Kubernetes was the standard."
    followups:
      - "What was the first workload and why?"
      - "What would not have fit?"
    common_errors:
      - "Treating the migration itself as the achievement without a benefit."

  - external_key: resume_screening.infrastructure_claims.cloud_migration_role
    competency_key: aws
    topic: "Cloud migration involvement"
    difficulty: easy
    text: "You list a migration to the cloud. Which part of it was yours, and what was the hardest dependency to move?"
    expected_concepts:
      - "migration approach such as rehost or refactor"
      - "personal scope"
      - "dependency mapping"
      - "cutover"
      - "results"
    rubric:
      excellent: "States the personal scope precisely, explains dependency mapping and the hardest piece and describes cutover and results."
      good: "Describes the migration and general role."
      weak: "Cannot separate their work from the programme."
    followups:
      - "How did you find hidden dependencies?"
      - "How long was the cutover window?"
    common_errors:
      - "Cannot separate their work from the programme."

  - external_key: resume_screening.infrastructure_claims.uptime_improvement_claim
    competency_key: incident_response
    topic: "Uptime improvement"
    difficulty: easy
    text: "You say availability improved while you were responsible for a platform. What were the top causes of downtime before, and which fix removed the most?"
    expected_concepts:
      - "baseline downtime data"
      - "categorised causes"
      - "chosen fixes"
      - "measured improvement"
      - "ongoing tracking"
    rubric:
      excellent: "Ranks downtime causes from data, ties fixes to measured improvement and keeps tracking."
      good: "Names fixes and an improvement."
      weak: "Quotes a higher number with no causes."
    followups:
      - "What was left as the main cause?"
      - "How was uptime calculated?"
    common_errors:
      - "Quotes a higher number with no causes."

  - external_key: resume_screening.infrastructure_claims.cost_savings_infrastructure
    competency_key: cloud_cost_optimization
    topic: "Cost savings claim"
    difficulty: easy
    text: "Your resume mentions cutting infrastructure cost. Where was the money going originally, and which action saved the most?"
    expected_concepts:
      - "cost allocation by service"
      - "biggest waste found"
      - "actions such as right-sizing and commitments"
      - "verification in billing"
      - "guardrails to prevent regrowth"
    rubric:
      excellent: "Allocates costs, finds the biggest waste with data, applies targeted changes, validates in billing and adds guardrails."
      good: "Describes actions and a saved amount."
      weak: "Says costs fell without explaining the source."
    followups:
      - "What did it cost in effort?"
      - "Did the saving last?"
    common_errors:
      - "Says costs fell without explaining the source."

  - external_key: resume_screening.infrastructure_claims.terraform_adoption
    competency_key: terraform
    topic: "Infrastructure as code adoption"
    difficulty: easy
    text: "You introduced infrastructure as code. How did you handle resources that already existed, and how did you stop manual changes from drifting?"
    expected_concepts:
      - "importing existing resources"
      - "state storage and locking"
      - "review process"
      - "drift detection"
      - "module structure"
    rubric:
      excellent: "Imports existing resources safely, protects state, requires code review for changes and detects drift."
      good: "Describes the tool and main practices."
      weak: "Writes new code only and ignores existing resources."
    followups:
      - "What happened when someone changed something by hand?"
      - "How did you split state?"
    common_errors:
      - "Writes new code only and ignores existing resources."

  - external_key: resume_screening.infrastructure_claims.ci_cd_platform_built
    competency_key: ci_cd
    topic: "Building a delivery pipeline"
    difficulty: easy
    text: "You built a CI/CD pipeline for several teams. What did teams need from it, and what did they complain about?"
    expected_concepts:
      - "gathering needs"
      - "standard pipeline stages"
      - "speed and reliability"
      - "extensibility"
      - "support model"
    rubric:
      excellent: "Collects requirements, provides defaults with escape hatches, measures speed and reliability and responds to complaints."
      good: "Describes the pipeline and users."
      weak: "Built a pipeline for one team's needs and called it a platform."
    followups:
      - "Which team had the odd requirement?"
      - "How did you roll out changes?"
    common_errors:
      - "Built a pipeline for one team's needs and called it a platform."

  - external_key: resume_screening.infrastructure_claims.backup_restore_proof
    competency_key: database_administration
    topic: "Backup and recovery"
    difficulty: easy
    text: "Your resume mentions backup or disaster recovery work. When did you last prove a restore worked, and what did you find?"
    expected_concepts:
      - "restore tests"
      - "recovery time and point objectives"
      - "automation"
      - "issues found"
      - "documentation"
    rubric:
      excellent: "Describes regular restore tests, compares results with targets, fixes gaps and documents steps."
      good: "Describes backups and an occasional test."
      weak: "Has backups but has never restored."
    followups:
      - "How long did the restore take?"
      - "What was missing in the first attempt?"
    common_errors:
      - "Trusting backups that were never restored."

  - external_key: resume_screening.infrastructure_claims.vulnerability_management_program
    competency_key: security
    topic: "Vulnerability management"
    difficulty: easy
    text: "You ran or improved vulnerability management. How did you decide what to patch first, and how did you get busy teams to act?"
    expected_concepts:
      - "risk-based prioritisation"
      - "asset inventory"
      - "service-level targets"
      - "automation"
      - "metrics"
    rubric:
      excellent: "Prioritises on exploitability and exposure, works with owners using agreed targets, automates and measures."
      good: "Describes scanning and patching processes."
      weak: "Sent long lists of findings to teams."
    followups:
      - "What did you do with unfixable items?"
      - "How did you measure progress?"
    common_errors:
      - "Sent long lists of findings to teams."

  - external_key: resume_screening.infrastructure_claims.network_redesign_role
    competency_key: networking
    topic: "Network redesign"
    difficulty: medium
    text: "You redesigned or migrated a network. How did you plan the addressing and cutover so that existing services kept working?"
    expected_concepts:
      - "inventory of current state"
      - "addressing and segmentation plan"
      - "staged cutover"
      - "rollback"
      - "validation"
    rubric:
      excellent: "Inventories the network, plans addressing, cuts over in stages with tested rollback and validates connectivity."
      good: "Describes design and cutover."
      weak: "Cut over in one window without a rollback."
    followups:
      - "What broke that you did not expect?"
      - "How did you test before the window?"
    common_errors:
      - "Cut over in one window without a rollback."

  - external_key: resume_screening.infrastructure_claims.zero_downtime_database_upgrade
    competency_key: database_administration
    topic: "Database upgrade"
    difficulty: hard
    text: "You upgraded a production database version. How did you rehearse it, and what was your plan if it went wrong halfway?"
    expected_concepts:
      - "compatibility testing"
      - "rehearsal on a copy"
      - "upgrade method"
      - "rollback or fallback"
      - "verification after"
    rubric:
      excellent: "Rehearses on realistic data, picks a method with a reversible path and verifies performance and correctness afterwards."
      good: "Describes steps and testing."
      weak: "Upgraded straight in production after reading release notes."
    followups:
      - "What changed in query plans?"
      - "How long was the longest outage?"
    common_errors:
      - "Upgraded straight in production after reading release notes."

  - external_key: resume_screening.infrastructure_claims.multi_region_dr
    competency_key: aws
    topic: "Multi-region and disaster recovery"
    difficulty: hard
    text: "Your resume mentions multi-region or disaster recovery design. What recovery time did the business actually need, and how did you test that you could meet it?"
    expected_concepts:
      - "business requirements"
      - "chosen pattern and cost"
      - "data replication limits"
      - "failover drills"
      - "findings"
    rubric:
      excellent: "Derives targets from business need, chooses a pattern with cost reasoning and proves it with drills that found gaps."
      good: "Describes the design and a drill."
      weak: "Built a design without ever failing over."
    followups:
      - "What failed in the drill?"
      - "What would the cost have been for a tighter target?"
    common_errors:
      - "Built a design without ever failing over."

  - external_key: resume_screening.infrastructure_claims.slo_adoption
    competency_key: observability
    topic: "Service level objectives"
    difficulty: medium
    text: "You introduced service level objectives. How did you pick the indicators, and what did a team do differently once they had an error budget?"
    expected_concepts:
      - "user-centred indicators"
      - "setting targets"
      - "error budget policy"
      - "changes in decisions"
      - "review"
    rubric:
      excellent: "Chooses indicators from user experience, sets targets with stakeholders and shows decisions changing because of the budget."
      good: "Describes indicators and targets."
      weak: "Defined targets that nobody used to decide anything."
    followups:
      - "Which target did you change?"
      - "What happened when the budget ran out?"
    common_errors:
      - "Defined targets that nobody used to decide anything."

  - external_key: resume_screening.infrastructure_claims.alert_noise_reduction
    competency_key: observability
    topic: "Alert quality"
    difficulty: medium
    text: "You cut alert noise or paging volume. How did you decide which alerts to remove, and how did you know you had not blinded the team?"
    expected_concepts:
      - "analysing alerts by action taken"
      - "symptom-based alerting"
      - "thresholds"
      - "verifying incidents still detected"
      - "review cadence"
    rubric:
      excellent: "Analyses actions per alert, moves to symptom-based alerts, checks past incidents would still fire and reviews regularly."
      good: "Describes cutting alerts and some checks."
      weak: "Muted alerts to reduce volume."
    followups:
      - "What incident would the old alerts have caught?"
      - "How often do you review?"
    common_errors:
      - "Silencing alerts without checking detection."

  - external_key: resume_screening.infrastructure_claims.secrets_management_rollout
    competency_key: security
    topic: "Secrets handling"
    difficulty: medium
    text: "You moved secrets out of code or config into a managed solution. How did you handle rotating credentials that were already exposed in history?"
    expected_concepts:
      - "finding secrets"
      - "vault or manager adoption"
      - "rotation without outage"
      - "history cleaning or assuming exposure"
      - "prevention scanning"
    rubric:
      excellent: "Finds secrets with scanning, assumes exposed ones are compromised and rotates them safely, then adds prevention."
      good: "Moves secrets and describes rotation."
      weak: "Moved new secrets only and ignored old exposure."
    followups:
      - "How did you rotate without downtime?"
      - "How do you detect new leaks?"
    common_errors:
      - "Moved new secrets only and ignored old exposure."

  - external_key: resume_screening.infrastructure_claims.iam_least_privilege
    competency_key: security
    topic: "Access control work"
    difficulty: medium
    text: "Your resume mentions tightening permissions. How did you work out what access was really needed without breaking anything?"
    expected_concepts:
      - "analysing usage logs"
      - "staged removal"
      - "testing"
      - "exceptions with expiry"
      - "review process"
    rubric:
      excellent: "Uses access logs to define needed permissions, removes access in stages with monitoring, and sets reviews."
      good: "Describes reducing permissions in steps."
      weak: "Removed permissions and waited for complaints."
    followups:
      - "What broke when you removed access?"
      - "How are exceptions tracked?"
    common_errors:
      - "Removed permissions and waited for complaints."

  - external_key: resume_screening.infrastructure_claims.autoscaling_tuning
    competency_key: kubernetes
    topic: "Autoscaling and capacity"
    difficulty: medium
    text: "You configured autoscaling. Tell me about a traffic pattern where the first settings did not work and what you changed."
    expected_concepts:
      - "scaling metrics"
      - "reaction time"
      - "limits and minimums"
      - "cost effects"
      - "testing under load"
    rubric:
      excellent: "Gives a concrete pattern, explains why settings lagged or flapped and what metrics or limits changed, validated by load tests."
      good: "Describes scaling settings and tuning."
      weak: "Relies on defaults and over-provisions."
    followups:
      - "How long did new capacity take to become ready?"
      - "What metric did you scale on?"
    common_errors:
      - "Relies on defaults and over-provisions."

  - external_key: resume_screening.infrastructure_claims.service_mesh_ingress
    competency_key: networking
    topic: "Traffic management layer"
    difficulty: medium
    text: "You introduced a service mesh, gateway or ingress layer. What problem were you solving, and what operational complexity did you accept in return?"
    expected_concepts:
      - "problem statement"
      - "options considered"
      - "rollout"
      - "operational cost"
      - "measured benefits"
    rubric:
      excellent: "States a concrete problem, compares options and describes the operational cost and a measured benefit."
      good: "Describes the tool and some benefits."
      weak: "Adopted it because it was popular."
    followups:
      - "How did you debug it when it failed?"
      - "Which team had to learn it?"
    common_errors:
      - "Adopted it because it was popular."

  - external_key: resume_screening.infrastructure_claims.gitops_pipeline
    competency_key: ci_cd
    topic: "GitOps and deployments"
    difficulty: medium
    text: "You moved deployments to a GitOps or pull-based model. What got better, and what got harder for the developers?"
    expected_concepts:
      - "declarative desired state"
      - "reconciliation"
      - "approvals and audit"
      - "rollback"
      - "developer experience"
    rubric:
      excellent: "Explains improved audit and consistency, notes developer friction and describes mitigation."
      good: "Describes the model and benefits."
      weak: "Describes tooling only."
    followups:
      - "How do you handle emergency fixes?"
      - "What drifted in practice?"
    common_errors:
      - "Describes tooling only."

  - external_key: resume_screening.infrastructure_claims.platform_golden_path
    competency_key: system_design
    topic: "Internal platform adoption"
    difficulty: medium
    text: "You built part of an internal platform. How did you know that engineering teams actually found it better than their own scripts?"
    expected_concepts:
      - "user research"
      - "adoption metrics"
      - "support load"
      - "feedback loop"
      - "deprecating alternatives"
    rubric:
      excellent: "Treats teams as customers, tracks adoption and satisfaction and responds to feedback."
      good: "Describes features and adoption."
      weak: "Built features without asking users."
    followups:
      - "Which team refused to adopt?"
      - "What did you stop supporting?"
    common_errors:
      - "Built features without asking users."

  - external_key: resume_screening.infrastructure_claims.container_hardening_images
    competency_key: security
    topic: "Container image hardening"
    difficulty: medium
    text: "You hardened container images or runtime settings. Which changes mattered most, and what did you have to relax because applications broke?"
    expected_concepts:
      - "minimal base images"
      - "non-root users"
      - "scanning"
      - "read-only filesystems"
      - "exceptions"
    rubric:
      excellent: "Names high-value changes, shows compatibility fixes and keeps exceptions documented."
      good: "Lists hardening steps."
      weak: "Applied scanner output blindly."
    followups:
      - "What broke when you made it read-only?"
      - "How do you keep images patched?"
    common_errors:
      - "Applied scanner output blindly."

  - external_key: resume_screening.infrastructure_claims.linux_fleet_patching
    competency_key: linux
    topic: "Fleet patching and configuration"
    difficulty: easy
    text: "You managed patching or configuration across many servers. How did you roll updates out safely, and how did you know every host was compliant?"
    expected_concepts:
      - "staging rings"
      - "automation tool"
      - "verification"
      - "handling failures"
      - "reporting"
    rubric:
      excellent: "Uses ring-based rollout, automates and verifies compliance across all hosts with reporting."
      good: "Describes patch process and tool."
      weak: "Patched manually, host by host."
    followups:
      - "What happened to hosts that failed?"
      - "How often did you patch?"
    common_errors:
      - "Patched manually, host by host."

  - external_key: resume_screening.infrastructure_claims.dns_certificate_automation
    competency_key: networking
    topic: "Certificates and DNS operations"
    difficulty: easy
    text: "You automated certificates or DNS changes. What outage or near miss pushed you to do it, and how did you test the automation?"
    expected_concepts:
      - "motivating incident"
      - "automation design"
      - "renewal monitoring"
      - "testing"
      - "fallback"
    rubric:
      excellent: "Describes a real trigger, automates issue and renewal with monitoring and tests the failure path."
      good: "Describes the automation."
      weak: "Has no failure detection for the automation."
    followups:
      - "What alerts you before expiry?"
      - "What if the automation fails?"
    common_errors:
      - "Has no failure detection for the automation."

  - external_key: resume_screening.infrastructure_claims.incident_commander_role
    competency_key: incident_response
    topic: "Leading incident response"
    difficulty: hard
    text: "Your resume says you led incident response. Describe the biggest incident you ran: how you organised people, what you decided under uncertainty, and what changed after."
    expected_concepts:
      - "roles and communication"
      - "hypothesis tracking"
      - "mitigation first decisions"
      - "stakeholder updates"
      - "postmortem actions"
    rubric:
      excellent: "Shows structured command, parallel investigation with a decision log, clear updates and postmortem actions that were completed."
      good: "Describes the response and a review."
      weak: "Describes heroics without structure or follow-through."
    followups:
      - "What decision would you reverse?"
      - "Which action items are still open?"
    common_errors:
      - "Describing individual heroics rather than coordinated response."

  - external_key: resume_screening.infrastructure_claims.capacity_planning_forecast
    competency_key: distributed_systems
    topic: "Capacity forecasting"
    difficulty: hard
    text: "You owned capacity planning. How did you forecast demand, and when was your forecast most wrong?"
    expected_concepts:
      - "data sources"
      - "growth model"
      - "headroom policy"
      - "validation against actuals"
      - "lessons"
    rubric:
      excellent: "Builds a forecast from usage trends and business events, compares with actuals and adjusts headroom."
      good: "Describes forecasting and reviews."
      weak: "Adds capacity when alerts fire."
    followups:
      - "What event did you miss?"
      - "How much headroom do you keep and why?"
    common_errors:
      - "Adds capacity when alerts fire."

  - external_key: resume_screening.infrastructure_claims.compliance_audit_infra
    competency_key: security
    topic: "Compliance evidence"
    difficulty: hard
    text: "Your resume mentions supporting a compliance audit. Which controls were hardest to evidence, and what did you automate to keep that evidence current?"
    expected_concepts:
      - "mapping controls to systems"
      - "evidence collection"
      - "automation"
      - "gaps found"
      - "ownership"
    rubric:
      excellent: "Maps controls to technical evidence, automates collection and handles gaps with owners."
      good: "Describes the audit support and some automation."
      weak: "Collected screenshots before the audit each time."
    followups:
      - "What was the hardest control?"
      - "How do you prevent drift between audits?"
    common_errors:
      - "Collected screenshots before the audit each time."
