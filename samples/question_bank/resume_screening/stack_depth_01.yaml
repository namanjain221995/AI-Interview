# Curated questions: resume screening, stack_depth. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.stack_depth.listed_tool_daily_use
  competency_key: problem_solving
  topic: Daily use of a listed tool
  difficulty: easy
  text: "Pick a tool or technology from your skills list that you use most. What do you use it for on\
    \ a typical working day?"
  expected_concepts:
  - concrete tasks
  - frequency
  - the part of the tool used most
  - own configuration choices
  rubric:
    excellent: Describes specific daily tasks, the features they rely on and settings they chose themselves.
    good: Describes general use of the tool without much specific detail.
    weak: Names the tool but cannot describe what they do with it.
  followups:
  - Which feature do you use most?
  - What do you do manually that the tool does not handle?
  common_errors:
  - Listing the tool name without describing any concrete use.

- external_key: resume_screening.stack_depth.first_use_of_tool
  competency_key: adaptability
  topic: How the tool was first used
  difficulty: easy
  text: "Tell me about the first real problem you solved with one of your key technologies. What made\
    \ you choose it?"
  expected_concepts:
  - reason for choosing
  - problem context
  - first results
  - what was learned
  rubric:
    excellent: Describes the problem, why the tool fit it, what happened and how their use matured afterwards.
    good: Describes the project and a general reason for the choice.
    weak: Used it because it was assigned and cannot explain the fit.
  followups:
  - What did you get wrong at the start?
  - What would you use now instead?
  common_errors:
  - 'Falling into the weak pattern: used it because it was assigned and cannot explain the fit.'

- external_key: resume_screening.stack_depth.production_vs_tutorial_use
  competency_key: problem_solving
  topic: Production versus practice
  difficulty: easy
  text: "For the technologies on your resume, which have you used in production work and which only in\
    \ practice or study?"
  expected_concepts:
  - clear separation
  - examples of production use
  - scale
  - limits of experience
  rubric:
    excellent: "Separates the two categories clearly, gives production examples with scale and states\
      \ the limits of their experience with the rest."
    good: Separates them roughly with a few examples.
    weak: Treats all skills as equivalent or avoids the distinction.
  followups:
  - What scale did you run it at?
  - Which skill would you not claim to be strong in?
  common_errors:
  - 'Falling into the weak pattern: treats all skills as equivalent or avoids the distinction.'

- external_key: resume_screening.stack_depth.level_self_rating
  competency_key: communication
  topic: Rating own skill level
  difficulty: easy
  text: "How would you rate your level in your top three technologies, and what evidence supports each\
    \ rating?"
  expected_concepts:
  - calibrated rating
  - evidence from work
  - awareness of gaps in knowledge
  - examples
  rubric:
    excellent: Gives distinct ratings with specific evidence for each and notes areas they have not mastered.
    good: Gives ratings with general reasons.
    weak: Rates everything as expert or cannot give ratings.
  followups:
  - What separates a 7 from a 9 for you?
  - What would an expert do that you cannot?
  common_errors:
  - 'Falling into the weak pattern: rates everything as expert or cannot give ratings.'

- external_key: resume_screening.stack_depth.version_and_environment
  competency_key: problem_solving
  topic: Versions and environments
  difficulty: easy
  text: Which version of your main technology did you work with and what environment did it run in?
  expected_concepts:
  - version knowledge
  - environment details
  - differences between versions
  - upgrade experience
  rubric:
    excellent: States versions and environment specifics and describes differences or upgrades they handled.
    good: Knows the version and general environment.
    weak: Does not know the version or environment.
  followups:
  - What changed in newer versions?
  - Did you upgrade it?
  common_errors:
  - 'Falling into the weak pattern: does not know the version or environment.'

- external_key: resume_screening.stack_depth.setup_from_scratch
  competency_key: system_design
  topic: Setting it up yourself
  difficulty: medium
  text: "Have you set up your main technology from scratch for a project? Walk me through the key decisions\
    \ you made."
  expected_concepts:
  - installation or provisioning
  - configuration choices
  - security basics
  - verifying
  rubric:
    excellent: Walks through setup steps and decisions with reasons, including configuration and verification.
    good: Describes setup at a general level.
    weak: Has only used pre-configured environments.
  followups:
  - Which defaults did you change?
  - How did you verify it worked?
  common_errors:
  - 'Falling into the weak pattern: has only used pre-configured environments.'

- external_key: resume_screening.stack_depth.compare_with_alternative
  competency_key: system_design
  topic: Comparing with alternatives
  difficulty: medium
  text: Pick one of your key tools. What alternative have you used, and how do they differ in practice?
  expected_concepts:
  - actual experience with both
  - differences in practice
  - selection criteria
  - limits of each
  rubric:
    excellent: Compares two tools from experience with specific practical differences and criteria for
      choosing.
    good: Compares them using general knowledge.
    weak: Can only repeat marketing-level differences.
  followups:
  - When would you pick the other one?
  - What did you miss when you switched?
  common_errors:
  - 'Falling into the weak pattern: can only repeat marketing-level differences.'

- external_key: resume_screening.stack_depth.pairs_in_the_stack
  competency_key: system_design
  topic: How tools fit together
  difficulty: medium
  text: "Look at the stack you listed. How do the main pieces connect to each other in a real system you\
    \ worked on?"
  expected_concepts:
  - data and request flow
  - integration points
  - responsibilities of each component
  - failure points
  rubric:
    excellent: "Describes the flow across components, integration points and where failures happen, from\
      \ real experience."
    good: Lists the components and general connections.
    weak: Lists tools with no relationship.
  followups:
  - Which connection was most fragile?
  - Where did you spend most debugging time?
  common_errors:
  - 'Falling into the weak pattern: lists tools with no relationship.'

- external_key: resume_screening.stack_depth.command_line_fluency
  competency_key: linux
  topic: Hands-on fluency
  difficulty: easy
  text: "What commands or interfaces do you use most often with your main technology, and what do they\
    \ let you do?"
  expected_concepts:
  - common commands
  - combination in workflow
  - debugging use
  - automation
  rubric:
    excellent: Names commands or interfaces with their purposes and shows how they combine them in a workflow.
    good: Names a few common commands.
    weak: Relies entirely on graphical tools or cannot name any.
  followups:
  - What do you use when something looks wrong?
  - Have you scripted any of it?
  common_errors:
  - 'Falling into the weak pattern: relies entirely on graphical tools or cannot name any.'

- external_key: resume_screening.stack_depth.config_you_own
  competency_key: code_quality
  topic: Configuration ownership
  difficulty: medium
  text: Which configuration or settings for a key technology did you personally write or tune, and why?
  expected_concepts:
  - specific settings
  - rationale
  - testing
  - documenting
  rubric:
    excellent: Names specific settings they tuned with reasons, tests and documentation.
    good: Edited configuration according to guidance.
    weak: Has not touched configuration.
  followups:
  - What would happen if it were wrong?
  - How do you test a setting change?
  common_errors:
  - 'Falling into the weak pattern: has not touched configuration.'

- external_key: resume_screening.stack_depth.debugging_with_the_tool
  competency_key: debugging
  topic: Debugging in the stack
  difficulty: medium
  text: "When something goes wrong in your main technology, what is your first step and how do you narrow\
    \ it down?"
  expected_concepts:
  - reading logs or errors
  - reproducing
  - isolating
  - using tool diagnostics
  rubric:
    excellent: Describes a structured approach starting from evidence, using diagnostic tools and isolating
      cause.
    good: Describes general debugging steps.
    weak: Searches online for an answer without a method.
  followups:
  - Give an example of a recent problem.
  - Which diagnostic do you trust most?
  common_errors:
  - 'Falling into the weak pattern: searches online for an answer without a method.'

- external_key: resume_screening.stack_depth.testing_with_the_tool
  competency_key: testing
  topic: Testing practices
  difficulty: medium
  text: How do you test code or configuration that uses your main technology?
  expected_concepts:
  - unit and integration tests
  - test environments
  - mocking choices
  - automation
  rubric:
    excellent: Describes layers of tests, environment setup and how they handle dependencies in CI.
    good: Describes the tests written with some gaps.
    weak: Does not test or relies on manual checks.
  followups:
  - What is hard to test?
  - What failed that tests did not catch?
  common_errors:
  - 'Falling into the weak pattern: does not test or relies on manual checks.'

- external_key: resume_screening.stack_depth.stack_security_basics
  competency_key: security
  topic: Security practice
  difficulty: medium
  text: "What are the main security considerations when using your key technology, and which have you\
    \ handled yourself?"
  expected_concepts:
  - authentication
  - secrets
  - least privilege
  - updates
  rubric:
    excellent: Names relevant considerations specific to the technology and gives examples they implemented.
    good: Names general security concerns.
    weak: Treats security as handled by others.
  followups:
  - What was the riskiest default?
  - How do you rotate secrets?
  common_errors:
  - 'Falling into the weak pattern: treats security as handled by others.'

- external_key: resume_screening.stack_depth.monitoring_the_tool
  competency_key: observability
  topic: Observing the technology
  difficulty: medium
  text: "How did you monitor your main technology in production, and what signals told you something was\
    \ wrong?"
  expected_concepts:
  - key metrics
  - alerts
  - logs
  - dashboards
  rubric:
    excellent: Names specific metrics and alerts for the technology, with an example where they caught
      a problem.
    good: Used generic monitoring.
    weak: Did not monitor it.
  followups:
  - Which metric predicted trouble?
  - What alerts were noisy?
  common_errors:
  - 'Falling into the weak pattern: did not monitor it.'

- external_key: resume_screening.stack_depth.performance_basics
  competency_key: system_design
  topic: Performance behaviour
  difficulty: medium
  text: What affects the performance of your main technology most, and what have you done to tune it?
  expected_concepts:
  - key performance factors
  - measurement
  - tuning actions
  - results
  rubric:
    excellent: Names specific factors, how they measured, what they tuned and what changed.
    good: Names general factors.
    weak: Never considered performance.
  followups:
  - What did you measure first?
  - What gave the biggest gain?
  common_errors:
  - 'Falling into the weak pattern: never considered performance.'

- external_key: resume_screening.stack_depth.docs_you_rely_on
  competency_key: communication
  topic: Learning resources
  difficulty: easy
  text: "When you hit something unfamiliar in your main technology, where do you look and how do you decide\
    \ what to trust?"
  expected_concepts:
  - official documentation
  - source or issues
  - community
  - verifying in a test
  rubric:
    excellent: Describes using official docs and source, validating advice with a small experiment.
    good: Uses docs and search.
    weak: Copies answers without checking.
  followups:
  - What was the last thing you looked up?
  - How did you verify it?
  common_errors:
  - 'Falling into the weak pattern: copies answers without checking.'

- external_key: resume_screening.stack_depth.team_standards_for_stack
  competency_key: code_quality
  topic: Conventions
  difficulty: medium
  text: What conventions did your team follow for your main technology, and which did you help set?
  expected_concepts:
  - coding or configuration standards
  - reviews
  - automation of rules
  - evolving rules
  rubric:
    excellent: Describes conventions, how they are enforced and ones they proposed.
    good: Followed existing conventions.
    weak: No conventions existed.
  followups:
  - Which convention helped most?
  - Which one did you disagree with?
  common_errors:
  - 'Falling into the weak pattern: no conventions existed.'

- external_key: resume_screening.stack_depth.integration_task
  competency_key: api_design
  topic: Connecting systems
  difficulty: medium
  text: Tell me about an integration you built using your main technology. What was hard about it?
  expected_concepts:
  - interfaces
  - error handling
  - data formats
  - testing
  rubric:
    excellent: Describes the integration, interface issues and how failures were handled and tested.
    good: Describes the integration at a high level.
    weak: Cannot describe a real integration.
  followups:
  - How did you handle failures?
  - What contract did you rely on?
  common_errors:
  - 'Falling into the weak pattern: cannot describe a real integration.'

- external_key: resume_screening.stack_depth.automation_of_work
  competency_key: ci_cd
  topic: Automation with the stack
  difficulty: medium
  text: What have you automated using your main technologies, and how much time did it save?
  expected_concepts:
  - identifying repetitive work
  - implementation
  - maintenance
  - measuring savings
  rubric:
    excellent: Describes automation, how it is maintained and quantifies the benefit.
    good: Automated simple tasks.
    weak: Has not automated anything.
  followups:
  - What do you still do manually?
  - Who else uses it?
  common_errors:
  - 'Falling into the weak pattern: has not automated anything.'

- external_key: resume_screening.stack_depth.reading_other_peoples_code
  competency_key: code_quality
  topic: Working in unfamiliar code
  difficulty: medium
  text: "How comfortable are you reading other people's code or configuration in your main technology,\
    \ and how do you go about it?"
  expected_concepts:
  - reading approach
  - tracing flow
  - asking questions
  - tools used
  rubric:
    excellent: Describes a method for orientation, tracing flow with tools and verifying understanding.
    good: Reads and asks colleagues.
    weak: Avoids unfamiliar code.
  followups:
  - What do you look for first?
  - How do you verify what you understood?
  common_errors:
  - 'Falling into the weak pattern: avoids unfamiliar code.'

- external_key: resume_screening.stack_depth.data_handling_with_tool
  competency_key: databases
  topic: Data in your stack
  difficulty: medium
  text: "How does data move through the technologies you listed, and where have you had to handle bad\
    \ or large data?"
  expected_concepts:
  - data formats
  - validation
  - scale handling
  - failure cases
  rubric:
    excellent: Describes data flow, validation and an example of large or bad data and the handling.
    good: Describes the data flow generally.
    weak: Has not dealt with data issues.
  followups:
  - What was the biggest dataset?
  - What validation did you add?
  common_errors:
  - 'Falling into the weak pattern: has not dealt with data issues.'

- external_key: resume_screening.stack_depth.what_tool_is_great_at
  competency_key: system_design
  topic: Strengths
  difficulty: easy
  text: "What is your main technology genuinely good at, from your own experience rather than from the\
    \ documentation?"
  expected_concepts:
  - personal experience
  - concrete strengths
  - fit to tasks
  - comparisons
  rubric:
    excellent: Gives strengths illustrated with real examples and conditions where they hold.
    good: Names strengths in general.
    weak: Repeats documentation claims.
  followups:
  - Where did it save you?
  - What would you tell a colleague new to it?
  common_errors:
  - 'Falling into the weak pattern: repeats documentation claims.'

- external_key: resume_screening.stack_depth.teaching_the_tool
  competency_key: mentoring
  topic: Explaining the technology
  difficulty: medium
  text: How would you teach a new teammate the essentials of your main technology in their first week?
  expected_concepts:
  - key concepts
  - hands-on tasks
  - common pitfalls
  - progression
  rubric:
    excellent: Gives a short sequenced plan with essential concepts, practical tasks and common pitfalls.
    good: Describes some concepts and tasks.
    weak: Would point to documentation.
  followups:
  - What mistake do newcomers make?
  - What would you leave until later?
  common_errors:
  - 'Falling into the weak pattern: would point to documentation.'

- external_key: resume_screening.stack_depth.stack_choice_history
  competency_key: system_design
  topic: Why this stack
  difficulty: medium
  text: "How did your team arrive at the stack you list, and what was your role in the choice or in living\
    \ with it?"
  expected_concepts:
  - reasons
  - evaluation
  - influence
  - consequences
  rubric:
    excellent: Explains the reasoning, their role and consequences with concrete examples.
    good: Knows the reasons without involvement.
    weak: Does not know why the stack was chosen.
  followups:
  - What would you change in it?
  - What was the biggest cost of the choice?
  common_errors:
  - 'Falling into the weak pattern: does not know why the stack was chosen.'

- external_key: resume_screening.stack_depth.recent_task_walkthrough
  competency_key: problem_solving
  topic: Walkthrough of recent work
  difficulty: medium
  text: "Walk me through a recent task where your main technology was central, from the starting point\
    \ to the finished work."
  expected_concepts:
  - starting situation
  - steps taken
  - tools used at each step
  - verification of the result
  rubric:
    excellent: "Gives a coherent step-by-step account with tool-specific detail at each step and how the\
      \ result was verified."
    good: Gives a reasonable account with limited technical detail.
    weak: Gives a vague overview without steps.
  followups:
  - Which step took the longest?
  - What would you do differently?
  common_errors:
  - 'Falling into the weak pattern: gives a vague overview without steps.'
