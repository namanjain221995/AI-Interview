# Curated questions: resume screening, certifications_learning. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.certifications_learning.design_from_scratch_in_domain
  competency_key: system_design
  topic: Design in the certified domain
  difficulty: medium
  text: "Using the knowledge from a certification you hold, how would you design a small solution in that\
    \ domain for a new team, and what would you decide first?"
  expected_concepts:
  - requirements first
  - main components
  - key trade-offs
  - standards from the material
  rubric:
    excellent: "Starts from requirements, selects components with trade-offs and names which standards\
      \ from their learning they apply and why."
    good: Gives a plausible design with partial reasoning.
    weak: Lists the names of services or topics without a design.
  followups:
  - What would you change if cost mattered most?
  - What is the main risk?
  common_errors:
  - Reciting the syllabus instead of making design decisions.

- external_key: resume_screening.certifications_learning.wrong_answer_that_looks_right
  competency_key: problem_solving
  topic: Common misconceptions
  difficulty: hard
  text: "In the area your certification covers, what is a commonly believed idea that turns out to be\
    \ wrong or incomplete in practice?"
  expected_concepts:
  - a specific misconception
  - why it is wrong
  - consequences
  - correct approach
  rubric:
    excellent: Names a specific misconception, explains the mechanism and consequences and the correct
      practice.
    good: Names a misconception with a general explanation.
    weak: Cannot name one.
  followups:
  - Have you seen it cause trouble?
  - How do you explain it to others?
  common_errors:
  - 'Falling into the weak pattern: cannot name one.'

- external_key: resume_screening.certifications_learning.apply_concept_to_new_case
  competency_key: problem_solving
  topic: Transfer to a new case
  difficulty: medium
  text: "Take a concept from your certification and apply it to a situation your course did not cover.\
    \ How would you reason?"
  expected_concepts:
  - understanding the principle
  - mapping to the new case
  - assumptions
  - checking
  rubric:
    excellent: States the principle, maps it carefully to the new case with explicit assumptions and checks.
    good: Applies the concept loosely.
    weak: Can only restate the course example.
  followups:
  - What assumption could fail?
  - How would you test it?
  common_errors:
  - 'Falling into the weak pattern: can only restate the course example.'

- external_key: resume_screening.certifications_learning.cost_and_efficiency_lesson
  competency_key: cloud_cost_optimization
  topic: Efficiency in the domain
  difficulty: medium
  text: What did your learning teach you about cost or efficiency, and where have you applied it?
  expected_concepts:
  - principles
  - measurement
  - actions
  - results
  rubric:
    excellent: Describes principles, how they measured and actions taken with results.
    good: Describes principles with partial application.
    weak: Has not considered cost.
  followups:
  - What saved the most?
  - What did it cost you in effort?
  common_errors:
  - 'Falling into the weak pattern: has not considered cost.'

- external_key: resume_screening.certifications_learning.reliability_lesson
  competency_key: incident_response
  topic: Reliability principles
  difficulty: medium
  text: "Which reliability or resilience principles did you learn formally, and how have they shown up\
    \ in your work?"
  expected_concepts:
  - named principles
  - examples
  - failure handling
  - trade-offs
  rubric:
    excellent: Names principles and gives examples where they changed a design or response.
    good: Names principles with general examples.
    weak: Cannot give an example.
  followups:
  - Which failure did it prevent?
  - Where did you decide not to apply it?
  common_errors:
  - 'Falling into the weak pattern: cannot give an example.'

- external_key: resume_screening.certifications_learning.security_principle_practice
  competency_key: security
  topic: Security principles in practice
  difficulty: medium
  text: "Which security principle from your training do you apply most, and what does it look like in\
    \ a concrete change you made?"
  expected_concepts:
  - principle
  - concrete change
  - verification
  - trade-off
  rubric:
    excellent: Names a principle and a specific change, how it was verified and the trade-off accepted.
    good: Names a principle with a general example.
    weak: Cannot give a concrete change.
  followups:
  - How did you verify it?
  - Who pushed back?
  common_errors:
  - 'Falling into the weak pattern: cannot give a concrete change.'

- external_key: resume_screening.certifications_learning.exam_questions_you_got_wrong
  competency_key: adaptability
  topic: Learning from mistakes in preparation
  difficulty: medium
  text: "What topic did you get wrong repeatedly during preparation, and what did you do to fix your understanding?"
  expected_concepts:
  - identifying the topic
  - analysis of the cause
  - targeted study
  - verification
  rubric:
    excellent: Names a topic, analyses why they misunderstood and describes targeted practice and confirmation.
    good: Names a topic and re-studied it.
    weak: Cannot recall any.
  followups:
  - What clicked in the end?
  - Where does it matter at work?
  common_errors:
  - 'Falling into the weak pattern: cannot recall any.'

- external_key: resume_screening.certifications_learning.vendor_neutral_thinking
  competency_key: system_design
  topic: Beyond one vendor
  difficulty: hard
  text: "How would you apply what you learned in a vendor-specific certification if your team used a different\
    \ product?"
  expected_concepts:
  - separating concepts from product features
  - mapping
  - limits
  - learning plan
  rubric:
    excellent: "Separates general concepts from product details, maps them across products and names what\
      \ would need learning."
    good: Says concepts transfer and gives an example.
    weak: Believes knowledge is useless outside the vendor.
  followups:
  - Which concept transfers best?
  - Which part would not?
  common_errors:
  - 'Falling into the weak pattern: believes knowledge is useless outside the vendor.'

- external_key: resume_screening.certifications_learning.interpreting_ambiguous_requirements
  competency_key: requirements_analysis
  topic: Applying standards
  difficulty: medium
  text: "How have you used a standard or framework you studied, such as a best-practice guide, to resolve\
    \ an unclear requirement?"
  expected_concepts:
  - knowing the standard
  - interpreting it
  - adapting
  - documenting
  rubric:
    excellent: Describes the standard, how they interpreted it for the situation and documented the decision.
    good: Used the standard as a checklist.
    weak: Has not used a standard in practice.
  followups:
  - Where did the standard not fit?
  - How did you record the decision?
  common_errors:
  - 'Falling into the weak pattern: has not used a standard in practice.'

- external_key: resume_screening.certifications_learning.troubleshooting_checklist_from_study
  competency_key: debugging
  topic: Systematic diagnosis
  difficulty: medium
  text: "What diagnostic method did your learning give you, and how does it compare with how you troubleshoot\
    \ in real life?"
  expected_concepts:
  - method
  - real-world adaptation
  - examples
  - limitations
  rubric:
    excellent: Describes a method, how they adapted it in practice and an example where it solved a problem.
    good: Describes a method without examples.
    weak: Troubleshoots by trial and error.
  followups:
  - What step is most often skipped?
  - What did you change?
  common_errors:
  - 'Falling into the weak pattern: troubleshoots by trial and error.'

- external_key: resume_screening.certifications_learning.architecture_review_questions
  competency_key: system_design
  topic: Reviewing a design
  difficulty: hard
  text: "If you reviewed someone else's design in the area of your certification, what questions would\
    \ you ask first?"
  expected_concepts:
  - key questions
  - reliability, security and cost
  - evidence
  - constructive tone
  rubric:
    excellent: Lists specific, prioritised questions across the main qualities with reasons.
    good: Lists general questions.
    weak: Cannot list questions.
  followups:
  - Which question catches most problems?
  - How do you give the feedback?
  common_errors:
  - 'Falling into the weak pattern: cannot list questions.'

- external_key: resume_screening.certifications_learning.automation_learned
  competency_key: ci_cd
  topic: Automation skills
  difficulty: medium
  text: "What automation skills did your learning give you, and which tasks at work did you automate with\
    \ them?"
  expected_concepts:
  - skills
  - tasks
  - maintenance
  - benefit
  rubric:
    excellent: Names skills and tasks automated with measured benefits and upkeep.
    good: Automated simple tasks.
    weak: Has not automated.
  followups:
  - What do you still do by hand?
  - What broke?
  common_errors:
  - 'Falling into the weak pattern: has not automated.'

- external_key: resume_screening.certifications_learning.data_and_storage_choices
  competency_key: databases
  topic: Data decisions from training
  difficulty: medium
  text: Which data or storage decisions have you made guided by your learning, and what were the trade-offs?
  expected_concepts:
  - options
  - criteria
  - trade-offs
  - outcome
  rubric:
    excellent: Describes the options, criteria and trade-offs with outcomes.
    good: Describes a decision with limited trade-offs.
    weak: Cannot describe a decision.
  followups:
  - What would have changed your choice?
  - How did it perform?
  common_errors:
  - 'Falling into the weak pattern: cannot describe a decision.'

- external_key: resume_screening.certifications_learning.networking_or_access_decision
  competency_key: networking
  topic: Access and connectivity
  difficulty: medium
  text: How has your training in access control or connectivity influenced a setup you built?
  expected_concepts:
  - principle
  - setup
  - verification
  - problems
  rubric:
    excellent: Describes principles used, the setup and how they verified and fixed problems.
    good: Describes the setup generally.
    weak: Not applicable or cannot describe.
  followups:
  - What went wrong at first?
  - How did you test it?
  common_errors:
  - 'Falling into the weak pattern: not applicable or cannot describe.'

- external_key: resume_screening.certifications_learning.what_you_could_teach_now
  competency_key: mentoring
  topic: Teaching a module
  difficulty: medium
  text: Which topic from your learning could you teach well to a colleague, and how would you structure
    it?
  expected_concepts:
  - topic mastery
  - structure
  - examples
  - exercises
  rubric:
    excellent: Names a topic and gives a clear structure with examples and exercises.
    good: Names a topic and outline.
    weak: Cannot teach any.
  followups:
  - What exercise would you give?
  - What do people misunderstand?
  common_errors:
  - 'Falling into the weak pattern: cannot teach any.'

- external_key: resume_screening.certifications_learning.trade_off_between_best_practice_and_deadline
  competency_key: project_management
  topic: Practice versus pressure
  difficulty: hard
  text: Describe a time a best practice you learned conflicted with a deadline. What did you do?
  expected_concepts:
  - assessing risk
  - options
  - communicating
  - decision
  rubric:
    excellent: Describes the conflict, the risk assessment, options offered and a clear decision with
      follow-up.
    good: Compromised and informed others.
    weak: Ignored the practice or refused to compromise.
  followups:
  - What risk did you accept?
  - How did you follow up?
  common_errors:
  - 'Falling into the weak pattern: ignored the practice or refused to compromise.'

- external_key: resume_screening.certifications_learning.monitoring_design_principles
  competency_key: observability
  topic: What to measure
  difficulty: medium
  text: What did your learning teach you about deciding what to monitor, and how did you apply it?
  expected_concepts:
  - key signals
  - alerts
  - avoiding noise
  - review
  rubric:
    excellent: Describes principles for choosing signals with a concrete application and results.
    good: Describes principles generally.
    weak: Monitors everything or nothing.
  followups:
  - What alert did you remove?
  - What did it catch?
  common_errors:
  - 'Falling into the weak pattern: monitors everything or nothing.'

- external_key: resume_screening.certifications_learning.change_management
  competency_key: ci_cd
  topic: Safe change
  difficulty: medium
  text: What practices for making changes safely did you learn, and which do you follow most strictly?
  expected_concepts:
  - review
  - staging
  - rollback
  - communication
  rubric:
    excellent: "Names practices and describes how they apply them consistently, with an example of a change\
      \ that benefited."
    good: Names practices with general use.
    weak: Makes changes directly without safeguards.
  followups:
  - What do you skip when rushed?
  - What caught a problem?
  common_errors:
  - 'Falling into the weak pattern: makes changes directly without safeguards.'

- external_key: resume_screening.certifications_learning.estimation_with_training
  competency_key: project_management
  topic: Estimating from learned methods
  difficulty: medium
  text: "Has any method you learned formally, such as a sizing or estimation approach, changed how you\
    \ estimate work?"
  expected_concepts:
  - method
  - application
  - accuracy
  - improvement
  rubric:
    excellent: Names the method, applies it to a real estimate and compares with actual results.
    good: Uses the method loosely.
    weak: Estimates from intuition only.
  followups:
  - How accurate was it?
  - What did you adjust?
  common_errors:
  - 'Falling into the weak pattern: estimates from intuition only.'

- external_key: resume_screening.certifications_learning.compliance_in_practice
  competency_key: security
  topic: Rules into daily work
  difficulty: hard
  text: "If your learning covered compliance or governance, how did you turn the rules into daily team\
    \ practice?"
  expected_concepts:
  - translating rules
  - controls
  - evidence
  - adoption
  rubric:
    excellent: Describes translating rules into specific controls, collecting evidence and getting adoption.
    good: Followed compliance checklists.
    weak: Treated compliance as paperwork.
  followups:
  - Which control was hardest to adopt?
  - What evidence did you collect?
  common_errors:
  - 'Falling into the weak pattern: treated compliance as paperwork.'

- external_key: resume_screening.certifications_learning.research_before_acting
  competency_key: problem_solving
  topic: Checking facts first
  difficulty: easy
  text: "When you meet an unfamiliar problem in your field, how do you use what you have learned and what\
    \ you look up?"
  expected_concepts:
  - using fundamentals
  - targeted research
  - verifying
  - learning
  rubric:
    excellent: Describes using fundamentals to frame the problem, targeted research and verification by
      experiment.
    good: Searches and tries solutions.
    weak: Copies solutions without verifying.
  followups:
  - How do you verify?
  - What do you record?
  common_errors:
  - 'Falling into the weak pattern: copies solutions without verifying.'

- external_key: resume_screening.certifications_learning.explaining_to_non_technical
  competency_key: communication
  topic: Explaining credentials' value
  difficulty: medium
  text: "How would you explain to a non-technical manager what your certification lets you do for the\
    \ business?"
  expected_concepts:
  - plain language
  - business outcomes
  - examples
  - clarity about limits
  rubric:
    excellent: Explains in plain language the business outcomes with an example and clear limits.
    good: Explains in general terms.
    weak: Uses jargon.
  followups:
  - What example would you give?
  - What can't it do?
  common_errors:
  - 'Falling into the weak pattern: uses jargon.'

- external_key: resume_screening.certifications_learning.advice_for_choosing_learning
  competency_key: mentoring
  topic: Guiding others
  difficulty: easy
  text: A colleague asks which certification or course to take next. How do you advise them?
  expected_concepts:
  - asking about goals
  - relevance
  - evidence of value
  - practical advice
  rubric:
    excellent: Asks about their goals, discusses relevance and practice and gives specific advice.
    good: Gives general advice.
    weak: Recommends what they took without questions.
  followups:
  - What do you ask them first?
  - What do you warn them about?
  common_errors:
  - 'Falling into the weak pattern: recommends what they took without questions.'

- external_key: resume_screening.certifications_learning.scale_up_the_example
  competency_key: system_design
  topic: Scaling a training example
  difficulty: hard
  text: "Courses often use small examples. Pick one from your learning and explain what would change if\
    \ it had to run for a hundred times more users."
  expected_concepts:
  - bottlenecks
  - design changes
  - cost
  - testing at scale
  rubric:
    excellent: Identifies realistic bottlenecks, the design changes needed, cost impact and how to test.
    good: Names a few changes.
    weak: Says it would work the same.
  followups:
  - What would fail first?
  - How would you test it?
  common_errors:
  - 'Falling into the weak pattern: says it would work the same.'

- external_key: resume_screening.certifications_learning.preventing_a_known_failure
  competency_key: incident_response
  topic: Preventive learning
  difficulty: medium
  text: Tell me about a failure you avoided because of something you had learned formally.
  expected_concepts:
  - the knowledge
  - the risk spotted
  - the action
  - the avoided consequence
  rubric:
    excellent: Describes the knowledge, what risk it revealed, the action and the consequence avoided.
    good: Describes avoidance with loose detail.
    weak: Cannot describe one.
  followups:
  - How did you spot the risk?
  - Who else needed convincing?
  common_errors:
  - 'Falling into the weak pattern: cannot describe one.'
