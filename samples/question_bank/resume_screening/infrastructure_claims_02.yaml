# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [devops, sre, platform, cloud, network, dba, security]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.infrastructure_claims.monitoring_stack_built
    competency_key: observability
    topic: "Building observability"
    difficulty: easy
    text: "You set up monitoring, logging or tracing for a platform. What did engineers use it for in the first month, and what did you find nobody used?"
    expected_concepts:
      - "initial goals"
      - "collection and retention choices"
      - "first real use cases"
      - "unused data"
      - "cost control"
    rubric:
      excellent: "Names the first real uses, identifies unused data and cost, and adjusts retention and dashboards."
      good: "Describes the stack and its use."
      weak: "Installed tools with no knowledge of how they were used."
    followups:
      - "What was the most expensive data?"
      - "Who were the main users?"
    common_errors:
      - "Installed tools with no knowledge of how they were used."

  - external_key: resume_screening.infrastructure_claims.log_pipeline_cost
    competency_key: observability
    topic: "Log volume and cost"
    difficulty: medium
    text: "Your resume mentions handling logging at scale. How did you keep cost under control without losing the logs you needed during incidents?"
    expected_concepts:
      - "volume analysis"
      - "sampling and filtering"
      - "tiered retention"
      - "key fields"
      - "incident needs"
    rubric:
      excellent: "Analyses volume by source, filters low-value logs, tiers retention and verifies incident needs remain met."
      good: "Describes filtering and retention."
      weak: "Cut logs by setting short retention for everything."
    followups:
      - "What log did you wish you had kept?"
      - "Who decided what to drop?"
    common_errors:
      - "Cut logs by setting short retention for everything."

  - external_key: resume_screening.infrastructure_claims.disk_network_outage_postmortem
    competency_key: incident_response
    topic: "Postmortem authorship"
    difficulty: easy
    text: "You wrote or led postmortems. What makes a postmortem you have written actually change something, and how do you follow up on its actions?"
    expected_concepts:
      - "facts and timeline"
      - "contributing factors rather than blame"
      - "concrete action items with owners"
      - "follow-up tracking"
      - "sharing lessons"
    rubric:
      excellent: "Focuses on systemic factors, produces specific actions with owners and dates and tracks completion."
      good: "Describes a postmortem format and actions."
      weak: "Writes postmortems that name a person and list vague actions."
    followups:
      - "What share of action items were done?"
      - "Which postmortem changed the most?"
    common_errors:
      - "Writes postmortems that name a person and list vague actions."

  - external_key: resume_screening.infrastructure_claims.blue_green_canary_release
    competency_key: ci_cd
    topic: "Safe deployment strategy"
    difficulty: medium
    text: "You implemented blue-green or canary deployments. What checks decided that a canary was healthy, and what did it miss?"
    expected_concepts:
      - "choosing metrics"
      - "analysis window"
      - "automated rollback"
      - "limits such as low traffic or stateful changes"
      - "database compatibility"
    rubric:
      excellent: "Defines metrics and windows, automates rollback and recognises limits such as data changes."
      good: "Describes the process and checks."
      weak: "Has a canary without defined success criteria."
    followups:
      - "What bad release did it catch?"
      - "How does it work with schema changes?"
    common_errors:
      - "Has a canary without defined success criteria."

  - external_key: resume_screening.infrastructure_claims.kubernetes_upgrade_process
    competency_key: kubernetes
    topic: "Cluster upgrades"
    difficulty: medium
    text: "You upgraded Kubernetes clusters. How did you find incompatible APIs before the upgrade and how did you reduce risk to workloads?"
    expected_concepts:
      - "deprecation scanning"
      - "test clusters"
      - "node rotation with disruption budgets"
      - "add-on compatibility"
      - "rollback options"
    rubric:
      excellent: "Scans for deprecated APIs, rehearses on a test cluster, rolls nodes carefully and plans rollback."
      good: "Describes steps and tests."
      weak: "Upgraded production directly after the vendor guide."
    followups:
      - "What did the rehearsal catch?"
      - "How often do you upgrade?"
    common_errors:
      - "Upgraded production directly after the vendor guide."

  - external_key: resume_screening.infrastructure_claims.pod_troubleshooting_story
    competency_key: kubernetes
    topic: "Workload troubleshooting"
    difficulty: easy
    text: "Describe a hard-to-diagnose problem with an application running on a cluster. What commands or signals led you to the cause?"
    expected_concepts:
      - "initial symptom"
      - "events, logs and metrics checked"
      - "hypotheses"
      - "root cause"
      - "fix"
    rubric:
      excellent: "Walks through evidence in order and arrives at a precise cause."
      good: "Finds the cause through logs and events."
      weak: "Deleted pods until it worked."
    followups:
      - "What did you rule out?"
      - "What did you add afterwards?"
    common_errors:
      - "Deleted pods until it worked."

  - external_key: resume_screening.infrastructure_claims.resource_requests_rightsizing
    competency_key: cloud_cost_optimization
    topic: "Right-sizing workloads"
    difficulty: medium
    text: "You right-sized resources. How did you pick safe values without causing out-of-memory kills or throttling?"
    expected_concepts:
      - "utilisation data over time"
      - "headroom"
      - "load patterns"
      - "staged changes"
      - "monitoring after"
    rubric:
      excellent: "Uses long-window data and peak patterns, sets headroom, changes in stages and watches for kills and throttling."
      good: "Uses average utilisation and adjusts."
      weak: "Cut resources by a fixed percentage."
    followups:
      - "Which workload surprised you?"
      - "How did you track the savings?"
    common_errors:
      - "Cut resources by a fixed percentage."

  - external_key: resume_screening.infrastructure_claims.reserved_commitments_spot
    competency_key: cloud_cost_optimization
    topic: "Commitment and spot use"
    difficulty: medium
    text: "You used commitments or spot capacity to cut cost. How did you decide the share of each and what happened when spot capacity disappeared?"
    expected_concepts:
      - "baseline versus variable usage"
      - "commitment risk"
      - "interruption handling"
      - "fallbacks"
      - "ongoing review"
    rubric:
      excellent: "Commits to the stable baseline, uses spot for tolerant workloads with interruption handling, and reviews regularly."
      good: "Describes the mix."
      weak: "Made commitments without usage data."
    followups:
      - "What was the interruption rate?"
      - "What would you do if usage dropped?"
    common_errors:
      - "Made commitments without usage data."

  - external_key: resume_screening.infrastructure_claims.landing_zone_accounts
    competency_key: aws
    topic: "Account structure and governance"
    difficulty: medium
    text: "You designed an account, subscription or project structure for an organisation. What boundaries did you create and why?"
    expected_concepts:
      - "separation by environment or team"
      - "guardrails and policies"
      - "networking"
      - "billing visibility"
      - "identity"
    rubric:
      excellent: "Defines boundaries with reasons such as blast radius and billing, adds policies and identity controls."
      good: "Describes the structure."
      weak: "One account for everything."
    followups:
      - "What boundary did you regret?"
      - "How do teams request access?"
    common_errors:
      - "One account for everything."

  - external_key: resume_screening.infrastructure_claims.hybrid_connectivity_vpn
    competency_key: network_engineering
    topic: "Hybrid connectivity"
    difficulty: medium
    text: "You connected on-premises networks to a cloud environment. How did you plan for failure of the link, and how did you troubleshoot routing problems?"
    expected_concepts:
      - "redundant links"
      - "routing design"
      - "address overlap"
      - "monitoring"
      - "troubleshooting methodology"
    rubric:
      excellent: "Plans redundancy, avoids overlap, monitors and uses a structured approach to routing faults."
      good: "Describes the setup and failover."
      weak: "Single link with no monitoring."
    followups:
      - "What happened in the last link failure?"
      - "How did you test failover?"
    common_errors:
      - "Single link with no monitoring."

  - external_key: resume_screening.infrastructure_claims.firewall_rule_cleanup
    competency_key: security
    topic: "Firewall and rule cleanup"
    difficulty: easy
    text: "You cleaned up firewall or security group rules. How did you find rules safe to remove?"
    expected_concepts:
      - "usage analysis"
      - "owner identification"
      - "staged disable"
      - "testing"
      - "documentation"
    rubric:
      excellent: "Uses traffic logs, finds owners, disables before deleting and documents."
      good: "Describes cleanup with some staging."
      weak: "Removed rules that looked old."
    followups:
      - "What broke?"
      - "How did you handle rules without owners?"
    common_errors:
      - "Removed rules that looked old."

  - external_key: resume_screening.infrastructure_claims.load_balancer_tls_design
    competency_key: networking
    topic: "Load balancing and TLS"
    difficulty: easy
    text: "You managed load balancers and TLS for production traffic. Describe an incident involving them and how you diagnosed it."
    expected_concepts:
      - "symptoms"
      - "health checks"
      - "certificate or config causes"
      - "tools"
      - "prevention"
    rubric:
      excellent: "Describes a real incident with structured diagnosis and a preventive change."
      good: "Describes an incident and fix."
      weak: "Cannot describe a specific one."
    followups:
      - "How did health checks behave?"
      - "What alert exists now?"
    common_errors:
      - "Cannot describe a specific one."

  - external_key: resume_screening.infrastructure_claims.replication_failover_db
    competency_key: database_administration
    topic: "Replication and failover"
    difficulty: hard
    text: "You set up replication or failover for a database. How did you test failover, and what data could be lost?"
    expected_concepts:
      - "replication mode"
      - "recovery point"
      - "failover automation or manual"
      - "split-brain protection"
      - "test results"
    rubric:
      excellent: "Explains replication mode, accepted data loss, protection against split brain and tested results."
      good: "Describes setup and a test."
      weak: "Never tested failover."
    followups:
      - "What happens to writes during failover?"
      - "How long did it take?"
    common_errors:
      - "Never tested failover."

  - external_key: resume_screening.infrastructure_claims.query_tuning_dba
    competency_key: database_administration
    topic: "Database performance work"
    difficulty: easy
    text: "You tuned a slow database workload. How did you find the biggest offenders and verify the improvement?"
    expected_concepts:
      - "monitoring and slow query data"
      - "execution plans"
      - "indexing or rewriting"
      - "test before production"
      - "verification"
    rubric:
      excellent: "Finds queries by impact, reads plans, tests changes and measures improvement."
      good: "Describes tuning and results."
      weak: "Added indexes by guess."
    followups:
      - "Which index did you remove?"
      - "What did the plan show?"
    common_errors:
      - "Added indexes by guess."

  - external_key: resume_screening.infrastructure_claims.schema_migration_tooling
    competency_key: databases
    topic: "Managing schema changes"
    difficulty: easy
    text: "You introduced a process for database changes. What did it prevent, and how did developers feel about it?"
    expected_concepts:
      - "versioned migrations"
      - "review"
      - "automated testing"
      - "rollout order"
      - "developer experience"
    rubric:
      excellent: "Describes controls, the incidents prevented and adjustments for developer needs."
      good: "Describes process."
      weak: "Manual scripts run by one person."
    followups:
      - "What did a bad migration look like?"
      - "How do you roll back?"
    common_errors:
      - "Manual scripts run by one person."

  - external_key: resume_screening.infrastructure_claims.zero_trust_access
    competency_key: security
    topic: "Access model change"
    difficulty: hard
    text: "You moved toward stronger network or identity-based access controls. What did you do about legacy systems that could not support it?"
    expected_concepts:
      - "current-state mapping"
      - "identity-centred controls"
      - "staged adoption"
      - "compensating controls"
      - "user impact"
    rubric:
      excellent: "Maps current access, moves in stages, covers exceptions with compensating controls and measures user impact."
      good: "Describes the programme and some exceptions."
      weak: "Ignores legacy systems."
    followups:
      - "What was the hardest system?"
      - "How did you handle complaints?"
    common_errors:
      - "Ignores legacy systems."

  - external_key: resume_screening.infrastructure_claims.threat_detection_rules
    competency_key: security
    topic: "Detection engineering"
    difficulty: medium
    text: "You wrote detection rules or alerts for security events. How did you test them, and how did you deal with false positives?"
    expected_concepts:
      - "threat scenarios"
      - "test data or simulation"
      - "tuning"
      - "triage playbooks"
      - "metrics"
    rubric:
      excellent: "Bases rules on scenarios, tests with simulation, tunes and measures precision."
      good: "Describes rules and tuning."
      weak: "Enabled vendor rules without testing."
    followups:
      - "What attack did you simulate?"
      - "How many alerts were actionable?"
    common_errors:
      - "Enabled vendor rules without testing."

  - external_key: resume_screening.infrastructure_claims.container_registry_supply_chain
    competency_key: security
    topic: "Software supply chain controls"
    difficulty: medium
    text: "You added supply chain controls such as signing, scanning or dependency policies. Which threat were you most concerned about, and how did you test the control?"
    expected_concepts:
      - "threat model"
      - "controls chosen"
      - "enforcement point"
      - "test of blocking"
      - "developer impact"
    rubric:
      excellent: "Names the threat, selects controls, enforces them in the pipeline and tests blocking."
      good: "Describes controls."
      weak: "Scanning only, no enforcement."
    followups:
      - "What got blocked?"
      - "How did you handle emergencies?"
    common_errors:
      - "Scanning only, no enforcement."

  - external_key: resume_screening.infrastructure_claims.toil_reduction_automation
    competency_key: problem_solving
    topic: "Reducing toil"
    difficulty: medium
    text: "You reduced operational toil. How did you measure the toil first, and what did you automate that turned out not to be worth it?"
    expected_concepts:
      - "measuring repetitive work"
      - "choosing by frequency and pain"
      - "automation cost"
      - "failures"
      - "time returned"
    rubric:
      excellent: "Measures toil, ranks by payoff, and candidly reviews an automation that did not pay."
      good: "Describes automation and time saved."
      weak: "Automated what was easy."
    followups:
      - "How did you measure time saved?"
      - "What was the best payoff?"
    common_errors:
      - "Automated what was easy."

  - external_key: resume_screening.infrastructure_claims.chaos_game_day
    competency_key: incident_response
    topic: "Resilience exercises"
    difficulty: medium
    text: "You ran game days or failure injection. What assumption did the exercise prove wrong?"
    expected_concepts:
      - "hypothesis"
      - "scope and safety"
      - "observed behaviour"
      - "fixes"
      - "repeating"
    rubric:
      excellent: "Describes a hypothesis, safe execution, a surprising result and follow-up."
      good: "Describes an exercise and findings."
      weak: "No findings or no follow-up."
    followups:
      - "How did you limit the blast radius?"
      - "What did you fix?"
    common_errors:
      - "No findings or no follow-up."

  - external_key: resume_screening.infrastructure_claims.on_call_health
    competency_key: incident_response
    topic: "On-call quality"
    difficulty: easy
    text: "You improved on-call for a team. What did the rotation look like before, and what measure told you it got better?"
    expected_concepts:
      - "pages per shift"
      - "actionable ratio"
      - "handoffs"
      - "runbooks"
      - "engineer feedback"
    rubric:
      excellent: "Uses pages and actionability data, improves runbooks and handoffs and gathers feedback."
      good: "Describes changes and general improvement."
      weak: "Changed the schedule only."
    followups:
      - "What was the noisiest source?"
      - "How did you get engineers' input?"
    common_errors:
      - "Changed the schedule only."

  - external_key: resume_screening.infrastructure_claims.disaster_recovery_test_failure
    competency_key: incident_response
    topic: "Failed recovery drill"
    difficulty: hard
    text: "Tell me about a recovery test or drill on your resume that did not go as planned. What did you find and how was it fixed?"
    expected_concepts:
      - "test setup"
      - "failure observed"
      - "root causes"
      - "fixes"
      - "retest"
    rubric:
      excellent: "Describes a real failure, root causes and retest with improved result."
      good: "Describes issues and fixes."
      weak: "Says all drills went fine."
    followups:
      - "Who was surprised?"
      - "How long until retest?"
    common_errors:
      - "Says all drills went fine."

  - external_key: resume_screening.infrastructure_claims.infrastructure_cost_tradeoff
    competency_key: cloud_cost_optimization
    topic: "Savings with a risk"
    difficulty: hard
    text: "Describe a cost saving on your resume that carried a reliability or performance risk. How did you decide it was worth taking?"
    expected_concepts:
      - "quantifying savings"
      - "identifying risk"
      - "mitigation"
      - "approval"
      - "outcome"
    rubric:
      excellent: "Quantifies both sides, mitigates risk, gets agreement and checks the outcome."
      good: "Describes the trade-off."
      weak: "Ignored risk in favour of savings."
    followups:
      - "What signal would have reversed it?"
      - "Who approved it?"
    common_errors:
      - "Ignored risk in favour of savings."

  - external_key: resume_screening.infrastructure_claims.migration_rollback_decision
    competency_key: problem_solving
    topic: "Migration that was reversed"
    difficulty: hard
    text: "Has any migration or change on your resume been rolled back or paused? What triggered that, and how did you recover?"
    expected_concepts:
      - "trigger signals"
      - "decision to stop"
      - "recovery"
      - "analysis"
      - "second attempt"
    rubric:
      excellent: "Describes a clear trigger, a timely decision to stop, recovery and a revised plan."
      good: "Describes a rollback and lesson."
      weak: "Cannot recall one or says rollback was unnecessary."
    followups:
      - "Who made the call?"
      - "What changed in the second attempt?"
    common_errors:
      - "Cannot recall one or says rollback was unnecessary."

  - external_key: resume_screening.infrastructure_claims.vendor_tool_selection
    competency_key: stakeholder_management
    topic: "Evaluating tools or vendors"
    difficulty: medium
    text: "You evaluated and picked a tool or vendor. How did you compare options, and who did you involve?"
    expected_concepts:
      - "requirements"
      - "scoring"
      - "proof of concept"
      - "cost"
      - "stakeholder input"
    rubric:
      excellent: "Defines requirements, runs a proof of concept, includes users and weighs total cost."
      good: "Describes comparison."
      weak: "Picked what they already knew."
    followups:
      - "What did the proof of concept reveal?"
      - "Who disagreed?"
    common_errors:
      - "Picked what they already knew."
