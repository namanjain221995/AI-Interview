# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [product_manager, project_manager, business_analyst, ux_designer, support_engineer]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.product_business_claims.persona_journey_mapping
    competency_key: ux_research
    topic: "Personas and journey maps"
    difficulty: easy
    text: "You created personas or journey maps. How were they based on real data, and how did the team use them afterward?"
    expected_concepts:
      - "data sources"
      - "synthesis"
      - "sharing"
      - "use in decisions"
      - "keeping current"
    rubric:
      excellent: "Bases artefacts on research data, shows decisions influenced and updates them."
      good: "Describes artefacts and some use."
      weak: "Produced documents that sat unused."
    followups:
      - "Which decision used it?"
      - "What data fed it?"
    common_errors:
      - "Produced documents that sat unused."

  - external_key: resume_screening.product_business_claims.survey_design_research
    competency_key: ux_research
    topic: "Surveys and quantitative research"
    difficulty: medium
    text: "You ran surveys. How did you word questions to avoid bias, and how did you decide the results were reliable enough to act on?"
    expected_concepts:
      - "question design"
      - "sampling"
      - "response rate"
      - "analysis"
      - "limits"
    rubric:
      excellent: "Writes neutral questions, considers sample and response, and states limits."
      good: "Describes survey and findings."
      weak: "Treated any response as representative."
    followups:
      - "Who responded?"
      - "What question did you rewrite?"
    common_errors:
      - "Treated any response as representative."

  - external_key: resume_screening.product_business_claims.information_architecture_change
    competency_key: ux_design
    topic: "Navigation or structure changes"
    difficulty: medium
    text: "You restructured navigation or content. How did you test the new structure before building it?"
    expected_concepts:
      - "card sorting or tree tests"
      - "baseline"
      - "iteration"
      - "outcome"
      - "engineering constraints"
    rubric:
      excellent: "Tests structure with users before building, iterates and compares findability."
      good: "Describes the structure and some testing."
      weak: "Reorganised from opinion."
    followups:
      - "What did tree tests show?"
      - "What did you change after?"
    common_errors:
      - "Reorganised from opinion."

  - external_key: resume_screening.product_business_claims.prototype_validation
    competency_key: ux_design
    topic: "Prototypes"
    difficulty: easy
    text: "You built prototypes. At what fidelity and for what purpose, and what did you learn from putting one in front of people?"
    expected_concepts:
      - "fidelity choice"
      - "goal"
      - "testing"
      - "findings"
      - "changes"
    rubric:
      excellent: "Chooses fidelity for the question, tests and shows design changes from findings."
      good: "Describes prototypes."
      weak: "Produced polished mockups for approval only."
    followups:
      - "Why that fidelity?"
      - "What surprised you?"
    common_errors:
      - "Produced polished mockups for approval only."

  - external_key: resume_screening.product_business_claims.design_engineering_handoff
    competency_key: collaboration
    topic: "Handoff to engineers"
    difficulty: easy
    text: "How did you hand designs to engineers, and what went wrong in the handoff that you fixed?"
    expected_concepts:
      - "specifications"
      - "collaboration earlier"
      - "components"
      - "reviews of build"
      - "quality"
    rubric:
      excellent: "Works with engineers earlier, provides clear specs and reviews the build."
      good: "Describes handoff."
      weak: "Threw files over the wall."
    followups:
      - "What was missed in a build?"
      - "How did you review?"
    common_errors:
      - "Threw files over the wall."

  - external_key: resume_screening.product_business_claims.conversion_funnel_redesign
    competency_key: data_analysis
    topic: "Conversion improvement"
    difficulty: medium
    text: "You improved conversion in a flow. How did you find the biggest drop-off and decide what to change?"
    expected_concepts:
      - "funnel data"
      - "qualitative insight"
      - "hypotheses"
      - "test"
      - "result"
    rubric:
      excellent: "Uses funnel data plus qualitative reasons, tests hypotheses and reports effect."
      good: "Describes changes and result."
      weak: "Made changes without finding the drop-off."
    followups:
      - "What did session recordings show?"
      - "Did it hold?"
    common_errors:
      - "Made changes without finding the drop-off."

  - external_key: resume_screening.product_business_claims.pricing_packaging_work
    competency_key: product_sense
    topic: "Commercial decisions in product"
    difficulty: hard
    text: "You worked on pricing, packaging or business model decisions. What evidence did you use, and how did you handle uncertainty?"
    expected_concepts:
      - "customer research"
      - "competitor and cost analysis"
      - "experiments"
      - "risk"
      - "decision"
    rubric:
      excellent: "Combines customer evidence and cost analysis, tests where possible and states uncertainty."
      good: "Describes the approach."
      weak: "Copied competitors' prices."
    followups:
      - "What would have changed the price?"
      - "How did you test?"
    common_errors:
      - "Copied competitors' prices."

  - external_key: resume_screening.product_business_claims.competitive_analysis
    competency_key: product_sense
    topic: "Market and competitor analysis"
    difficulty: easy
    text: "You did competitor or market analysis. What did you conclude, and what did the company do differently because of it?"
    expected_concepts:
      - "sources"
      - "framework"
      - "conclusions"
      - "decisions"
      - "follow-up"
    rubric:
      excellent: "Draws specific conclusions from analysis and ties them to decisions."
      good: "Describes the analysis."
      weak: "Produced a feature comparison table only."
    followups:
      - "What did you recommend?"
      - "Was it adopted?"
    common_errors:
      - "Produced a feature comparison table only."

  - external_key: resume_screening.product_business_claims.product_vision_strategy
    competency_key: product_sense
    topic: "Product strategy"
    difficulty: hard
    text: "You set product strategy or vision. What did you decide not to do, and how did you test your strategy against reality?"
    expected_concepts:
      - "focus and choices"
      - "assumptions"
      - "metrics"
      - "reviews"
      - "changes"
    rubric:
      excellent: "Makes explicit choices about what not to do, identifies assumptions and revises with evidence."
      good: "Describes the strategy."
      weak: "States a vision with no trade-offs."
    followups:
      - "What was dropped?"
      - "What assumption failed?"
    common_errors:
      - "States a vision with no trade-offs."

  - external_key: resume_screening.product_business_claims.stakeholder_conflict_product
    competency_key: stakeholder_management
    topic: "Competing demands"
    difficulty: medium
    text: "Sales and engineering wanted different things from you. How did you handle it?"
    expected_concepts:
      - "understanding needs"
      - "data"
      - "options"
      - "communication"
      - "decision"
    rubric:
      excellent: "Finds underlying needs, uses data to compare options and communicates the decision."
      good: "Describes handling."
      weak: "Pleased whoever pushed hardest."
    followups:
      - "How did each side respond?"
      - "What was decided?"
    common_errors:
      - "Pleased whoever pushed hardest."

  - external_key: resume_screening.product_business_claims.feature_failure_review
    competency_key: product_sense
    topic: "A feature that failed"
    difficulty: medium
    text: "Tell me about a feature or project you drove that did not get the usage or results you expected. What did you do next?"
    expected_concepts:
      - "expectation"
      - "data"
      - "causes"
      - "decision"
      - "learning"
    rubric:
      excellent: "Reviews the data, finds likely causes and decides to iterate or retire with a stated lesson."
      good: "Describes what happened."
      weak: "Cannot recall any failure."
    followups:
      - "When did you know?"
      - "What did you learn?"
    common_errors:
      - "Cannot recall any failure."

  - external_key: resume_screening.product_business_claims.agile_role_scrum_master
    competency_key: agile_delivery
    topic: "Facilitating agile ceremonies"
    difficulty: easy
    text: "You facilitated agile ceremonies for a team. Which ceremony did you change because it was not working?"
    expected_concepts:
      - "purpose"
      - "problem"
      - "change"
      - "team feedback"
      - "result"
    rubric:
      excellent: "Identifies the ceremony's purpose, the problem and a change that improved the team's outcomes."
      good: "Describes the change."
      weak: "Ran ceremonies by the book without adaptation."
    followups:
      - "What was the symptom?"
      - "How did the team react?"
    common_errors:
      - "Ran ceremonies by the book without adaptation."

  - external_key: resume_screening.product_business_claims.velocity_metric_misuse
    competency_key: agile_delivery
    topic: "Using delivery metrics"
    difficulty: medium
    text: "You tracked velocity or delivery metrics. How did you stop them from being misused, and what did you use them for?"
    expected_concepts:
      - "purpose of metrics"
      - "misuse risks"
      - "alternative measures"
      - "communication"
      - "result"
    rubric:
      excellent: "Uses metrics for planning and learning, guards against comparison and gaming."
      good: "Describes metrics."
      weak: "Compared teams by velocity."
    followups:
      - "Who asked for comparisons?"
      - "What did you say?"
    common_errors:
      - "Compared teams by velocity."

  - external_key: resume_screening.product_business_claims.vendor_management_project
    competency_key: project_management
    topic: "Managing vendors"
    difficulty: medium
    text: "You managed an external vendor in a project. What did you do when their delivery was behind?"
    expected_concepts:
      - "contract"
      - "visibility"
      - "early warning"
      - "escalation"
      - "recovery"
    rubric:
      excellent: "Uses contract and regular visibility, escalates early and agrees recovery."
      good: "Describes management."
      weak: "Waited for delivery."
    followups:
      - "What did the contract allow?"
      - "How did you know?"
    common_errors:
      - "Waited for delivery."

  - external_key: resume_screening.product_business_claims.budget_tracking_project
    competency_key: project_management
    topic: "Project budget control"
    difficulty: easy
    text: "Your resume lists a project cost figure you were accountable for. Which variance did you notice first, and how did you forecast the final spend?"
    expected_concepts:
      - "tracking"
      - "forecast"
      - "variance"
      - "communication"
      - "decisions"
    rubric:
      excellent: "Tracks actuals against plan, forecasts and tells sponsors early."
      good: "Describes budget tracking."
      weak: "Only reviewed spend at the end."
    followups:
      - "What variance was largest?"
      - "How did you report?"
    common_errors:
      - "Only reviewed spend at the end."

  - external_key: resume_screening.product_business_claims.change_request_control
    competency_key: project_management
    topic: "Managing change requests"
    difficulty: medium
    text: "Think of a stakeholder who asked for something outside the agreed scope of a delivery on your resume. Walk me through what you did with that ask, step by step."
    expected_concepts:
      - "assess impact"
      - "options"
      - "approval"
      - "communication"
      - "record"
    rubric:
      excellent: "Assesses impact on time and cost, gets decisions and records."
      good: "Describes process."
      weak: "Accepted all changes."
    followups:
      - "What did you reject?"
      - "Who approved?"
    common_errors:
      - "Accepted all changes."

  - external_key: resume_screening.product_business_claims.bpmn_process_documentation
    competency_key: process_modeling
    topic: "Process documentation"
    difficulty: easy
    text: "You documented business processes. How did you check that the diagrams matched what people really did?"
    expected_concepts:
      - "walk-throughs"
      - "observation"
      - "exceptions"
      - "review"
      - "maintenance"
    rubric:
      excellent: "Walks through with real performers, captures exceptions and keeps up to date."
      good: "Describes documentation."
      weak: "Drew diagrams from policy documents."
    followups:
      - "What exception did you find?"
      - "Who reviewed?"
    common_errors:
      - "Drew diagrams from policy documents."

  - external_key: resume_screening.product_business_claims.gap_analysis_systems
    competency_key: requirements_analysis
    topic: "Gap analysis"
    difficulty: medium
    text: "You did a gap analysis for a new system. How did you decide which gaps mattered?"
    expected_concepts:
      - "current versus target"
      - "impact"
      - "effort"
      - "risk"
      - "recommendation"
    rubric:
      excellent: "Compares states, ranks gaps by impact and recommends actions."
      good: "Describes the analysis."
      weak: "Listed all gaps equally."
    followups:
      - "Which gap was ignored?"
      - "How did you rank?"
    common_errors:
      - "Listed all gaps equally."

  - external_key: resume_screening.product_business_claims.data_migration_business
    competency_key: requirements_analysis
    topic: "Data migration from a business view"
    difficulty: medium
    text: "Your project included migrating data between systems. What business rules or data issues did you discover and resolve?"
    expected_concepts:
      - "data profiling"
      - "mapping rules"
      - "cleansing"
      - "business decisions"
      - "sign-off"
    rubric:
      excellent: "Profiles data, agrees mapping rules with owners and signs off."
      good: "Describes migration."
      weak: "Left it to IT."
    followups:
      - "What was dirtiest?"
      - "Who decided?"
    common_errors:
      - "Left it to IT."

  - external_key: resume_screening.product_business_claims.sql_for_analysis_ba
    competency_key: data_analysis
    topic: "Analysis using SQL or spreadsheets"
    difficulty: easy
    text: "You analysed business data with SQL or spreadsheets. Tell me about an answer you gave that you later found to be wrong, and how you handled it."
    expected_concepts:
      - "error found"
      - "communication"
      - "correction"
      - "cause"
      - "check added"
    rubric:
      excellent: "Reports the error quickly, corrects and adds a check."
      good: "Describes correction."
      weak: "Cannot recall errors."
    followups:
      - "How did you find it?"
      - "What check now?"
    common_errors:
      - "Cannot recall errors."

  - external_key: resume_screening.product_business_claims.customer_journey_support
    competency_key: customer_communication
    topic: "Support communication quality"
    difficulty: medium
    text: "You wrote customer-facing communication for support, such as macros or incident updates. How did you check that customers understood?"
    expected_concepts:
      - "plain language"
      - "testing"
      - "feedback"
      - "consistency"
      - "improvement"
    rubric:
      excellent: "Writes plain language, collects feedback and revises."
      good: "Describes writing."
      weak: "Used internal jargon."
    followups:
      - "Which message did you rewrite?"
      - "What feedback did you get?"
    common_errors:
      - "Used internal jargon."

  - external_key: resume_screening.product_business_claims.sla_management_support
    competency_key: technical_support
    topic: "Service levels in support"
    difficulty: medium
    text: "You managed support service levels. What happened when volume spiked and the targets were at risk?"
    expected_concepts:
      - "monitoring"
      - "prioritisation"
      - "staffing"
      - "communication"
      - "recovery"
    rubric:
      excellent: "Monitors early, prioritises by impact, adjusts staffing and communicates."
      good: "Describes handling."
      weak: "Missed targets without action."
    followups:
      - "What did you deprioritise?"
      - "How did you tell customers?"
    common_errors:
      - "Missed targets without action."

  - external_key: resume_screening.product_business_claims.tooling_support_automation
    competency_key: technical_support
    topic: "Support tools and automation"
    difficulty: medium
    text: "You introduced support tooling or automation. What problem did it solve, and what did agents think of it?"
    expected_concepts:
      - "problem"
      - "tool choice"
      - "rollout"
      - "agent feedback"
      - "measurement"
    rubric:
      excellent: "Defines the problem, involves agents, and measures outcome."
      good: "Describes the tool."
      weak: "Introduced tool without agent input."
    followups:
      - "What did agents change?"
      - "What was the measure?"
    common_errors:
      - "Introduced tool without agent input."

  - external_key: resume_screening.product_business_claims.reproduce_customer_bug
    competency_key: technical_support
    topic: "Reproducing and diagnosing"
    difficulty: hard
    text: "Tell me about the hardest customer issue you reproduced and diagnosed. How did you narrow it down?"
    expected_concepts:
      - "information gathering"
      - "reproduction"
      - "isolation"
      - "findings communicated"
      - "outcome"
    rubric:
      excellent: "Gathers details, isolates variables, reproduces and hands engineering a clear case."
      good: "Describes the diagnosis."
      weak: "Passed it on without investigation."
    followups:
      - "What did you ask the customer?"
      - "What was the cause?"
    common_errors:
      - "Passed it on without investigation."

  - external_key: resume_screening.product_business_claims.ownership_end_to_end_product
    competency_key: ownership
    topic: "End-to-end product ownership"
    difficulty: hard
    text: "Take the product or initiative you consider your best work. Which decisions were yours, which were shared, and which outcome can you personally verify?"
    expected_concepts:
      - "decision rights"
      - "shared work"
      - "verifiable outcome"
      - "evidence"
      - "reflection"
    rubric:
      excellent: "Separates decisions precisely and offers verifiable evidence of outcome."
      good: "Describes decisions and outcome."
      weak: "Cannot separate their decisions from the team's."
    followups:
      - "Who could verify?"
      - "What would you change?"
    common_errors:
      - "Cannot separate their decisions from the team's."
