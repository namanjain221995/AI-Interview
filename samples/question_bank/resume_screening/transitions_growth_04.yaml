# Curated questions: resume screening, transitions_growth. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.transitions_growth.biggest_leap_in_capability
  competency_key: adaptability
  topic: Largest step forward
  difficulty: medium
  text: At which point in your career did your capability take its biggest leap, and what drove it?
  expected_concepts:
  - identifying the point
  - drivers
  - concrete evidence
  - sustained effect
  rubric:
    excellent: Identifies a point, the specific drivers, evidence of the leap and how it was sustained.
    good: Identifies a point with general drivers.
    weak: Cannot identify one.
  followups:
  - What would you attribute it to?
  - Could you repeat it?
  common_errors:
  - Attributing growth to time passing rather than to specific experience.

- external_key: resume_screening.transitions_growth.new_role_first_win
  competency_key: ownership
  topic: Early win in a role
  difficulty: easy
  text: "What was your first meaningful contribution after starting in a recent role, and how did it come\
    \ about?"
  expected_concepts:
  - identifying the opportunity
  - actions
  - result
  - effect on trust
  rubric:
    excellent: Describes a specific early contribution, how they found it, the result and how it built
      trust.
    good: Describes an early contribution generally.
    weak: Cannot name an early contribution.
  followups:
  - Who helped you find it?
  - What did it unlock?
  common_errors:
  - 'Falling into the weak pattern: cannot name an early contribution.'

- external_key: resume_screening.transitions_growth.leading_change_in_new_role
  competency_key: leadership
  topic: Introducing change
  difficulty: hard
  text: "In a role you were new to, how did you introduce a change to how work was done without upsetting\
    \ existing ways of working?"
  expected_concepts:
  - listening first
  - building support
  - pilot
  - measuring
  rubric:
    excellent: Describes learning the context, building allies, piloting the change and measuring its
      effect.
    good: Introduced a change with some preparation.
    weak: Imposed change or avoided change.
  followups:
  - Who resisted and why?
  - What evidence did you use?
  common_errors:
  - 'Falling into the weak pattern: imposed change or avoided change.'

- external_key: resume_screening.transitions_growth.different_manager_styles
  competency_key: collaboration
  topic: Working under different managers
  difficulty: medium
  text: "How did you adapt your way of working to different managers and what did you learn from the contrast?"
  expected_concepts:
  - noticing preferences
  - adapting
  - communicating needs
  - lessons
  rubric:
    excellent: Gives concrete examples of adapting communication and reporting, and lessons from the contrast.
    good: Describes adaptation in general terms.
    weak: Worked the same way regardless of the manager.
  followups:
  - What did one manager value that another did not?
  - What stayed constant?
  common_errors:
  - Criticising former managers instead of describing adaptation.

- external_key: resume_screening.transitions_growth.scope_larger_than_title
  competency_key: ownership
  topic: Working above the level
  difficulty: medium
  text: "Describe a time you worked at a higher level than your role formally required and what you learned\
    \ from it."
  expected_concepts:
  - stepping up
  - support
  - results
  - recognition
  rubric:
    excellent: Describes the situation, the actions taken, results and what they learned about the level.
    good: Describes taking on more with a general outcome.
    weak: Cannot describe an example.
  followups:
  - How did others respond?
  - What was the hardest part?
  common_errors:
  - 'Falling into the weak pattern: cannot describe an example.'

- external_key: resume_screening.transitions_growth.onboarding_others_after_growth
  competency_key: mentoring
  topic: Welcoming newcomers
  difficulty: medium
  text: Having been new in several roles, what do you do now to help new people settle in?
  expected_concepts:
  - using own experience
  - clear information
  - introductions
  - follow-ups
  rubric:
    excellent: "Describes concrete practices drawn from their own experience, such as clear guides, introductions\
      \ and regular check-ins."
    good: Helps newcomers when asked.
    weak: Leaves newcomers to find their own way.
  followups:
  - What did you wish someone had done for you?
  - What did you build for them?
  common_errors:
  - 'Falling into the weak pattern: leaves newcomers to find their own way.'

- external_key: resume_screening.transitions_growth.expanding_influence
  competency_key: leadership
  topic: Growing influence
  difficulty: medium
  text: How has your ability to influence decisions grown across your roles, and what did you do to earn
    it?
  expected_concepts:
  - building credibility
  - evidence
  - relationships
  - results
  rubric:
    excellent: Describes specific actions that built credibility, examples of decisions they shaped and
      results.
    good: Describes influence in general terms.
    weak: Cannot describe growing influence.
  followups:
  - Which decision did you shape?
  - Who supported you?
  common_errors:
  - 'Falling into the weak pattern: cannot describe growing influence.'

- external_key: resume_screening.transitions_growth.ownership_of_larger_systems
  competency_key: system_design
  topic: From component to system
  difficulty: hard
  text: "Describe how you moved from owning a component to owning a larger system or outcome. What changed\
    \ in how you worked?"
  expected_concepts:
  - broader view
  - dependencies
  - trade-offs
  - accountability
  rubric:
    excellent: "Describes the progression, new considerations such as dependencies and trade-offs, and\
      \ changes in their habits."
    good: Describes the progression in general terms.
    weak: Continued to focus on the component.
  followups:
  - What did you start paying attention to?
  - What fell through at first?
  common_errors:
  - 'Falling into the weak pattern: continued to focus on the component.'

- external_key: resume_screening.transitions_growth.communication_style_evolution
  competency_key: communication
  topic: Communication growth
  difficulty: medium
  text: "How has the way you communicate at work, such as written updates and presentations, changed through\
    \ your roles?"
  expected_concepts:
  - concrete changes
  - audience awareness
  - feedback
  - examples
  rubric:
    excellent: Describes specific changes with examples and the feedback or results that prompted them.
    good: Describes general improvement.
    weak: Communicates the same as at the start.
  followups:
  - What feedback prompted the change?
  - What do you do first when writing an update?
  common_errors:
  - 'Falling into the weak pattern: communicates the same as at the start.'

- external_key: resume_screening.transitions_growth.decision_quality_over_time
  competency_key: problem_solving
  topic: Better judgement
  difficulty: hard
  text: "How has your judgement on difficult decisions improved, and what is an example of a decision\
    \ you would now make differently from before?"
  expected_concepts:
  - specific example
  - what changed in reasoning
  - evidence
  - reflection
  rubric:
    excellent: Gives an example of a decision, the reasoning then and now and what experience altered
      it.
    good: Gives an example with a general change.
    weak: Would make the same decisions.
  followups:
  - What did you not consider before?
  - How do you check your judgement now?
  common_errors:
  - 'Falling into the weak pattern: would make the same decisions.'

- external_key: resume_screening.transitions_growth.dealing_with_ambiguity_growth
  competency_key: problem_solving
  topic: Handling ambiguity
  difficulty: medium
  text: How has your way of handling unclear or changing requirements developed as your roles changed?
  expected_concepts:
  - early approach
  - improvements
  - techniques
  - examples
  rubric:
    excellent: Describes how their approach matured, with specific techniques and an example.
    good: Describes a general improvement.
    weak: Prefers to wait for clarity.
  followups:
  - What technique helps most?
  - When did it go wrong?
  common_errors:
  - 'Falling into the weak pattern: prefers to wait for clarity.'

- external_key: resume_screening.transitions_growth.technical_judgement_growth
  competency_key: code_quality
  topic: Better technical choices
  difficulty: medium
  text: What do you now do differently when making technical choices compared with earlier in your career?
  expected_concepts:
  - concrete differences
  - reasons
  - examples
  - results
  rubric:
    excellent: Names specific differences, such as weighing maintenance or operability earlier, with an
      example.
    good: Names a general difference.
    weak: Makes choices the same way as before.
  followups:
  - What caused the change?
  - What would you check first?
  common_errors:
  - 'Falling into the weak pattern: makes choices the same way as before.'

- external_key: resume_screening.transitions_growth.project_to_product_mindset
  competency_key: product_sense
  topic: Seeing the full lifecycle
  difficulty: medium
  text: How has your view of work shifted from finishing tasks to owning outcomes over time?
  expected_concepts:
  - change in mindset
  - examples
  - metrics
  - follow-through
  rubric:
    excellent: Describes the shift with a specific example of following work through to an outcome.
    good: Describes the shift generally.
    weak: Still focuses only on finishing tasks.
  followups:
  - What outcome did you follow?
  - What changed in your planning?
  common_errors:
  - 'Falling into the weak pattern: still focuses only on finishing tasks.'

- external_key: resume_screening.transitions_growth.stepping_back_to_help_others
  competency_key: leadership
  topic: Enabling others
  difficulty: medium
  text: "Tell me about a time you stepped back so someone else could take the lead on something. What\
    \ did you gain from it?"
  expected_concepts:
  - choosing to step back
  - support offered
  - outcome
  - lessons
  rubric:
    excellent: Describes why they stepped back, how they supported the other person and the outcome for
      the team.
    good: Describes stepping back with limited detail.
    weak: Prefers to keep leading everything.
  followups:
  - What did you watch for?
  - What did the other person learn?
  common_errors:
  - 'Falling into the weak pattern: prefers to keep leading everything.'

- external_key: resume_screening.transitions_growth.raised_bar_for_yourself
  competency_key: ownership
  topic: Higher standards
  difficulty: medium
  text: Which professional standard do you hold yourself to now that you did not early in your career?
  expected_concepts:
  - specific standard
  - trigger
  - evidence of practice
  - benefit
  rubric:
    excellent: Names a standard, what led to it and how it shows in their work.
    good: Names a general standard.
    weak: Cannot name one.
  followups:
  - What led to it?
  - How do you keep to it?
  common_errors:
  - 'Falling into the weak pattern: cannot name one.'

- external_key: resume_screening.transitions_growth.role_overlap_with_manager
  competency_key: stakeholder_management
  topic: Working with those above
  difficulty: hard
  text: "As your responsibilities grew, how did you share work with your manager or leads without overlap\
    \ or friction?"
  expected_concepts:
  - clarifying roles
  - communication
  - trust
  - handing back
  rubric:
    excellent: "Describes clarifying roles explicitly, agreeing boundaries and checking in as responsibilities\
      \ shifted."
    good: Worked it out informally.
    weak: Experienced repeated overlap and friction without resolving it.
  followups:
  - How did you agree it?
  - What changed afterwards?
  common_errors:
  - 'Falling into the weak pattern: experienced repeated overlap and friction without resolving it.'

- external_key: resume_screening.transitions_growth.what_stayed_the_same
  competency_key: motivation
  topic: Constants in your work
  difficulty: easy
  text: What has stayed constant in how you approach your work even as your roles changed?
  expected_concepts:
  - stable principles
  - examples
  - reasons
  - relation to the role
  rubric:
    excellent: Names stable principles with examples across roles and explains why they matter.
    good: Names a principle with a single example.
    weak: Cannot name any.
  followups:
  - Where did it help you most?
  - What would you change?
  common_errors:
  - 'Falling into the weak pattern: cannot name any.'

- external_key: resume_screening.transitions_growth.contribution_beyond_own_team
  competency_key: collaboration
  topic: Wider contribution
  difficulty: medium
  text: As you progressed, how did you contribute beyond your immediate team?
  expected_concepts:
  - cross-team work
  - shared practices
  - mentoring
  - recognition
  rubric:
    excellent: Describes specific contributions beyond their team, such as shared tools or guidance, with
      results.
    good: Helped other teams occasionally.
    weak: Focused only on own team.
  followups:
  - Who benefited?
  - How did you find the time?
  common_errors:
  - 'Falling into the weak pattern: focused only on own team.'

- external_key: resume_screening.transitions_growth.recognising_skill_in_others
  competency_key: collaboration
  topic: Learning from peers
  difficulty: medium
  text: "Think of a colleague at one of your earlier roles whose craft you admired. Which of their habits\
    \ made it into your own work, and where do you see it now?"
  expected_concepts:
  - identifying strengths in others
  - asking
  - applying
  - credit
  rubric:
    excellent: Names a specific learning from a peer, how they asked for it and the way they applied it.
    good: Names a lesson in general.
    weak: Cannot name any.
  followups:
  - How did you approach them?
  - What did you give back?
  common_errors:
  - 'Falling into the weak pattern: cannot name any.'

- external_key: resume_screening.transitions_growth.preparing_for_larger_challenge
  competency_key: adaptability
  topic: Preparation for the next step
  difficulty: hard
  text: What are you doing now to prepare for a bigger challenge than your current one?
  expected_concepts:
  - identifying the challenge
  - actions
  - evidence of progress
  - support
  rubric:
    excellent: Describes a concrete challenge, actions underway and evidence of progress.
    good: Describes general preparation.
    weak: Is not preparing for anything.
  followups:
  - What has changed already?
  - Who is helping you?
  common_errors:
  - 'Falling into the weak pattern: is not preparing for anything.'

- external_key: resume_screening.transitions_growth.repeated_pattern_in_your_roles
  competency_key: problem_solving
  topic: Pattern in your career
  difficulty: hard
  text: "Looking at your roles together, what pattern do you notice in the kind of problems you end up\
    \ solving?"
  expected_concepts:
  - noticing a pattern
  - examples
  - strengths
  - implications for the next role
  rubric:
    excellent: Identifies a clear pattern with examples across roles and what it suggests for future work.
    good: Notices a pattern generally.
    weak: Sees no pattern.
  followups:
  - What does that say about your strengths?
  - Would you like to break it?
  common_errors:
  - 'Falling into the weak pattern: sees no pattern.'

- external_key: resume_screening.transitions_growth.evidence_for_new_level
  competency_key: ownership
  topic: Proof of readiness
  difficulty: hard
  text: "If you were being considered for a bigger role than any you have held, what evidence from your\
    \ work would you point to?"
  expected_concepts:
  - specific evidence
  - scope
  - outcomes
  - others' views
  rubric:
    excellent: Points to specific evidence of working at the larger scale, outcomes and what others would
      say.
    good: Points to some evidence.
    weak: Points to years of effort rather than results.
  followups:
  - What is missing from that evidence?
  - Who would vouch for it?
  common_errors:
  - 'Falling into the weak pattern: points to years of effort rather than results.'

- external_key: resume_screening.transitions_growth.learning_style_adjustment
  competency_key: adaptability
  topic: Adjusting how you learn
  difficulty: medium
  text: How has your way of learning new things at work changed since your early roles?
  expected_concepts:
  - earlier method
  - current method
  - reasons
  - effectiveness
  rubric:
    excellent: Contrasts earlier and current methods with reasons and evidence they work better.
    good: Describes a change in general.
    weak: Learns the same way as at the start.
  followups:
  - What method works best?
  - What do you avoid now?
  common_errors:
  - 'Falling into the weak pattern: learns the same way as at the start.'

- external_key: resume_screening.transitions_growth.summing_up_the_story
  competency_key: communication
  topic: Career summary
  difficulty: easy
  text: In a few sentences, how would you sum up your professional story so far and where it is heading?
  expected_concepts:
  - coherence
  - specifics
  - direction
  - brevity
  rubric:
    excellent: Gives a concise, coherent account with specific milestones and a clear direction.
    good: Gives a reasonable summary with some vagueness.
    weak: Gives a rambling or fragmented account.
  followups:
  - What is the key turning point?
  - What is the next chapter?
  common_errors:
  - 'Falling into the weak pattern: gives a rambling or fragmented account.'

- external_key: resume_screening.transitions_growth.handling_credit_after_promotion
  competency_key: collaboration
  topic: Credit and teamwork at a higher level
  difficulty: medium
  text: "As you took on bigger roles, how did you make sure your team's work, and not only yours, was\
    \ recognised?"
  expected_concepts:
  - crediting others
  - visibility for the team
  - sponsoring
  - fairness
  rubric:
    excellent: Describes concrete practices for crediting others and creating visibility, with examples.
    good: Credits the team in general terms.
    weak: Presents team results as personal.
  followups:
  - Whom did you put forward?
  - What did you stop taking credit for?
  common_errors:
  - 'Falling into the weak pattern: presents team results as personal.'
