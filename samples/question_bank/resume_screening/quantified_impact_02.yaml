# Curated questions: resume screening, quantified_impact. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.quantified_impact.your_part_of_the_gain
  competency_key: ownership
  topic: Personal contribution to a gain
  difficulty: easy
  text: "For a result on your resume that involved other people, what exactly did you do that moved the\
    \ number?"
  expected_concepts:
  - concrete personal actions
  - link between the action and the metric
  - credit to others
  - evidence the action mattered
  rubric:
    excellent: "Names specific actions of their own, ties each to the part of the metric it affected and\
      \ credits the contributions of others clearly."
    good: Describes their tasks and a general link to the result.
    weak: Uses we throughout and cannot separate personal actions from the team's.
  followups:
  - What would have been different if you had not been there?
  - Which part did a colleague own?
  common_errors:
  - Describing the team's outcome as if it were personal work.

- external_key: resume_screening.quantified_impact.other_factors_in_play
  competency_key: problem_solving
  topic: Other factors behind the change
  difficulty: easy
  text: What else was changing at the same time as your work that could also have moved the number?
  expected_concepts:
  - listing concurrent changes such as releases or campaigns
  - considering seasonality
  - separating effects where possible
  - stating residual doubt
  rubric:
    excellent: "Lists several concurrent factors, explains how they tried to separate them and states\
      \ what uncertainty remains."
    good: Names one or two other factors and acknowledges they matter.
    weak: Attributes the entire change to their own work.
  followups:
  - How did you rule those out?
  - Which factor worried you most?
  common_errors:
  - Assuming that because the change followed their work it was caused by it.

- external_key: resume_screening.quantified_impact.seasonality_check
  competency_key: data_analysis
  topic: Seasonal effects
  difficulty: easy
  text: "Could the improvement on your resume have come from normal seasonal swings in the metric? How\
    \ did you check?"
  expected_concepts:
  - knowing the usual seasonal pattern
  - comparing the same period across cycles
  - adjusting for it
  - reporting the adjusted figure
  rubric:
    excellent: "Explains the known seasonal pattern, shows a like-for-like comparison and reports a figure\
      \ that accounts for it."
    good: Acknowledges seasonality and made a rough comparison.
    weak: Had not considered seasonality or dismisses it without evidence.
  followups:
  - Which months behave differently for this metric?
  - How would the number look without that adjustment?
  common_errors:
  - Comparing a peak period with an off-peak period and calling the difference an improvement.

- external_key: resume_screening.quantified_impact.control_group_available
  competency_key: statistics_experimentation
  topic: Comparison group
  difficulty: medium
  text: "Did you have a control group or an untouched comparison for the result you claim? If not, how\
    \ else did you argue the change was yours?"
  expected_concepts:
  - control or holdout group
  - staged rollout comparison
  - before and after limitations
  - alternative evidence such as a trend break
  rubric:
    excellent: "Explains the comparison design used or the best available alternative and states what\
      \ can and cannot be concluded from it."
    good: Had a partial comparison, such as a staged rollout, and used it reasonably.
    weak: Had no comparison and did not consider it necessary.
  followups:
  - What does a control give you that a before and after cannot?
  - How was the rollout order chosen?
  common_errors:
  - Equating correlation in time with proof of cause.

- external_key: resume_screening.quantified_impact.rollout_stages_attribution
  competency_key: statistics_experimentation
  topic: Staged rollout evidence
  difficulty: medium
  text: "If your change reached users in stages, how did the staged rollout help you attribute the improvement\
    \ to your work?"
  expected_concepts:
  - comparing exposed and unexposed groups at the same time
  - randomised or comparable cohorts
  - monitoring during stages
  - stopping rules
  rubric:
    excellent: "Explains how exposed and unexposed groups were compared at the same time, how comparable\
      \ they were and how that supported attribution."
    good: Used the stages to watch for problems and saw differences between groups.
    weak: Rolled out in stages but only looked at the overall number afterwards.
  followups:
  - Were the early groups representative?
  - What would have made you roll back?
  common_errors:
  - Looking only at the overall figure after a staged rollout and ignoring the comparison it allowed.

- external_key: resume_screening.quantified_impact.shared_credit_split
  competency_key: collaboration
  topic: Splitting credit fairly
  difficulty: medium
  text: "Describe a result where several people or teams shared the credit. How would you divide it and\
    \ how did the group do it at the time?"
  expected_concepts:
  - naming each contributor's part
  - criteria for splitting
  - open conversation
  - avoiding over-claiming
  rubric:
    excellent: "Describes a clear split with reasons, how it was agreed openly and the way others have\
      \ described their parts consistently."
    good: Gives the split in rough terms and acknowledges others.
    weak: Takes most of the credit without reasoning or avoids the question.
  followups:
  - Would a colleague split it the same way?
  - Who was least visible but important?
  common_errors:
  - Avoiding the question of how credit was divided or claiming the larger share by default.

- external_key: resume_screening.quantified_impact.dependency_on_others_work
  competency_key: collaboration
  topic: Reliance on others' work
  difficulty: medium
  text: "Which parts of the outcome on your resume depended on work you did not do, and how did that affect\
    \ what you can claim?"
  expected_concepts:
  - identifying dependencies
  - recognising upstream and downstream effort
  - scoping the claim
  - acknowledging enablers
  rubric:
    excellent: "Identifies specific dependencies, explains how they limit the claim and phrases their\
      \ contribution accurately."
    good: Names a dependency or two and adjusts the claim slightly.
    weak: Does not see any dependency or minimises it.
  followups:
  - What would have happened without that dependency?
  - How did you work with those owners?
  common_errors:
  - Describing the result as self-contained when it relied on upstream work.

- external_key: resume_screening.quantified_impact.leading_vs_contributing
  competency_key: ownership
  topic: Leader or contributor
  difficulty: medium
  text: "Were you leading the effort behind a number on your resume or contributing to someone else's\
    \ plan? How did that shape your claim?"
  expected_concepts:
  - clear statement of role
  - decisions owned
  - who set direction
  - matching resume wording to role
  rubric:
    excellent: "States the role precisely, gives examples of decisions that were theirs or a leader's\
      \ and shows the resume wording matches."
    good: States the role and a few supporting examples.
    weak: Role changes through the conversation or is described only in vague terms.
  followups:
  - Which decisions were yours to make?
  - Who did you report progress to?
  common_errors:
  - Using leadership wording on the resume for a contributing role.

- external_key: resume_screening.quantified_impact.tool_did_the_work
  competency_key: problem_solving
  topic: Tool versus effort
  difficulty: medium
  text: "Sometimes a purchased or inherited tool delivers most of an improvement. How much of your result\
    \ came from the tool and how much from your own work?"
  expected_concepts:
  - separating tool effect from configuration and adoption work
  - effort to implement
  - fair description
  - measuring beyond the tool
  rubric:
    excellent: "Separates what the tool provided from the effort of selection, configuration, rollout\
      \ and tuning, and describes their part truthfully."
    good: Acknowledges the tool's role and their implementation work.
    weak: Claims the tool's benefit as personal achievement.
  followups:
  - What would an average team have gotten from the same tool?
  - What did you tune beyond defaults?
  common_errors:
  - Attributing the benefit of a product purchase to the person who deployed it.

- external_key: resume_screening.quantified_impact.inherited_improvement_trend
  competency_key: data_analysis
  topic: Pre-existing trend
  difficulty: medium
  text: "What was the trend of the metric before your work began, and how does your result compare with\
    \ where it was already heading?"
  expected_concepts:
  - examining the earlier trend
  - extrapolating without the change
  - incremental effect over trend
  - presenting it visually
  rubric:
    excellent: "Describes the earlier trend, estimates what would have happened without the change and\
      \ states the incremental effect over it."
    good: Knows the earlier direction and mentions the difference roughly.
    weak: Never looked at what the metric was already doing.
  followups:
  - Would it have improved anyway, and by how much?
  - How would you show that on a chart?
  common_errors:
  - Counting improvement that was already under way.

- external_key: resume_screening.quantified_impact.regression_to_the_mean
  competency_key: statistics_experimentation
  topic: Starting at an extreme
  difficulty: hard
  text: "Suppose you started work when a metric was at an unusually bad level. How would you know your\
    \ result was more than the metric recovering naturally?"
  expected_concepts:
  - noticing regression to the mean
  - looking at long-run level
  - repeating measurement
  - comparing with similar untouched cases
  rubric:
    excellent: "Recognises that extreme starting points tend to revert, uses longer history or comparisons\
      \ to separate their effect and states the remaining doubt."
    good: Understands that some recovery was likely and made a rough allowance.
    weak: Takes the full recovery as their effect.
  followups:
  - What would a longer history show?
  - Did you pick the start date before or after the dip?
  common_errors:
  - Starting measurement at the worst point and counting natural recovery as improvement.

- external_key: resume_screening.quantified_impact.change_log_for_period
  competency_key: data_analysis
  topic: Reviewing what else shipped
  difficulty: medium
  text: How did you find out what other changes shipped to the same system during the period you measured?
  expected_concepts:
  - consulting release notes and change logs
  - asking other teams
  - timeline of events
  - checking configuration changes
  rubric:
    excellent: "Describes building a timeline from change logs and team conversations, and how it narrowed\
      \ the explanation for the result."
    good: Asked around informally and checked a release list.
    weak: Did not look for other changes.
  followups:
  - Which other change surprised you?
  - Could a reviewer rebuild that timeline?
  common_errors:
  - Never checking what else shipped during the measured period.

- external_key: resume_screening.quantified_impact.customer_effect_not_just_system
  competency_key: product_sense
  topic: Result from the customer's side
  difficulty: medium
  text: How did the customers or users who were meant to benefit experience the change, and how do you
    know?
  expected_concepts:
  - user evidence such as feedback or behaviour
  - support ticket trends
  - adoption
  - avoiding assumptions from system metrics alone
  rubric:
    excellent: "Provides evidence from the user side, such as tickets or usage, and links it to the system-side\
      \ improvement."
    good: Has some anecdotal feedback and a plausible link.
    weak: Has no evidence from the user side.
  followups:
  - Did anybody complain after the change?
  - How did the support team see it?
  common_errors:
  - Assuming users benefited because a system metric moved.

- external_key: resume_screening.quantified_impact.effect_on_your_own_team
  competency_key: ownership
  topic: Impact on the team
  difficulty: easy
  text: Apart from the headline number, what changed for your own team because of what you did?
  expected_concepts:
  - practical changes to team workload
  - time saved
  - fewer incidents or reworks
  - documentation or tooling left behind
  rubric:
    excellent: Describes concrete changes for the team such as fewer pages or faster releases and how
      they know.
    good: Describes a general benefit to the team.
    weak: Cannot describe any effect beyond the headline figure.
  followups:
  - How did colleagues react?
  - What did you leave behind that others use?
  common_errors:
  - Describing only the headline number and nothing about the team's day-to-day change.

- external_key: resume_screening.quantified_impact.one_thing_you_did_alone
  competency_key: ownership
  topic: Solo contribution
  difficulty: easy
  text: "Which piece of the result did you complete entirely on your own, and how did it affect the final\
    \ figure?"
  expected_concepts:
  - identifying a self-contained piece
  - its size relative to the whole
  - evidence of effect
  - ownership of decisions
  rubric:
    excellent: Names a self-contained piece with a measurable effect and describes the decisions taken
      alone.
    good: Names a piece of work but its effect is vague.
    weak: Cannot name anything done independently.
  followups:
  - How would you size that piece?
  - Who reviewed it?
  common_errors:
  - Presenting jointly built pieces as personal work.

- external_key: resume_screening.quantified_impact.manager_versus_you_claim
  competency_key: communication
  topic: Resume claim and manager's account
  difficulty: medium
  text: If I asked your manager at the time how much of the result was yours, what would they say and
    why?
  expected_concepts:
  - consistent narrative with others
  - specific contributions a manager saw
  - acknowledgement of support
  - no over-claiming
  rubric:
    excellent: "Predicts the manager's account accurately with specifics, and the description lines up\
      \ with their own."
    good: Gives a general expectation of positive feedback.
    weak: Is unsure what the manager would say or the accounts conflict.
  followups:
  - Where might the two accounts differ?
  - What feedback did you get at the time?
  common_errors:
  - Describing a version of events that others would not recognise.

- external_key: resume_screening.quantified_impact.credit_given_to_others
  competency_key: collaboration
  topic: Crediting others
  difficulty: easy
  text: Whom would you thank when you talk about this result, and what did they contribute?
  expected_concepts:
  - naming contributors
  - specifics of their contributions
  - recognising dependencies
  - specific credit
  rubric:
    excellent: Names several people or roles with specific contributions and shows the result was a joint
      effort.
    good: Names one or two people with general thanks.
    weak: Names no one or minimises others.
  followups:
  - Who helped most in the hardest moment?
  - Did you tell them that at the time?
  common_errors:
  - Offering generic thanks with no specifics about contributions.

- external_key: resume_screening.quantified_impact.remove_you_scenario
  competency_key: problem_solving
  topic: Counterfactual contribution
  difficulty: hard
  text: Imagine you had not joined that project. What would the result have looked like, and why?
  expected_concepts:
  - reasoning about a counterfactual
  - realistic estimate of the difference
  - avoiding both inflation and false modesty
  - evidence for the estimate
  rubric:
    excellent: "Builds a reasoned counterfactual with specific differences, acknowledges what others would\
      \ have done and avoids both exaggeration and understatement."
    good: Gives a plausible but untested view of the difference.
    weak: Claims the project would have failed or says it made no difference without reasoning.
  followups:
  - What would someone else have done differently?
  - How did that shape your view of your contribution?
  common_errors:
  - Claiming nothing would have worked without them, or denying any difference at all.

- external_key: resume_screening.quantified_impact.role_overlap_confusion
  competency_key: ownership
  topic: Overlapping responsibilities
  difficulty: medium
  text: "Where did your responsibilities overlap with other people's on that effort, and how did you decide\
    \ who did what?"
  expected_concepts:
  - clear boundaries
  - agreement of ownership
  - handling overlap
  - recording decisions
  rubric:
    excellent: Describes the overlap, how ownership was agreed and what happened to the overlapped parts.
    good: Mentions overlap and a rough division.
    weak: Ignores overlap or blames others for confusion.
  followups:
  - Did overlap ever cause duplicated work?
  - Who made the final call?
  common_errors:
  - Blaming others for unclear ownership instead of describing how it was settled.

- external_key: resume_screening.quantified_impact.measuring_individual_impact
  competency_key: data_analysis
  topic: Individual measures
  difficulty: hard
  text: "Is there any way to measure your individual contribution separately from the team's? What would\
    \ you look at, and would you trust it?"
  expected_concepts:
  - individual indicators like changes made or tickets closed
  - their limits
  - quality versus quantity
  - combining with qualitative evidence
  rubric:
    excellent: "Proposes several indicators, explains their weaknesses and combines them with qualitative\
      \ evidence from peers."
    good: Suggests one or two indicators with some caveats.
    weak: Offers a single count such as lines of code as proof.
  followups:
  - How could that indicator mislead?
  - What do colleagues' views add?
  common_errors:
  - Equating volume of output with contribution.

- external_key: resume_screening.quantified_impact.scope_of_resume_claim
  competency_key: communication
  topic: Scope of the claim
  difficulty: medium
  text: "What was the real scope of the system or user base your number applies to, and does your resume\
    \ make that clear?"
  expected_concepts:
  - stating the actual scope
  - separating pilot from full rollout
  - avoiding generalisation
  - clarifying in the interview
  rubric:
    excellent: States the scope precisely, distinguishes pilot from production and rewords the claim to
      match.
    good: Gives the scope when asked and admits some ambiguity.
    weak: Applies a result from a small portion to a whole product.
  followups:
  - How many users or requests did it cover?
  - Did it ever run everywhere?
  common_errors:
  - Applying a result from a pilot to the whole product or user base.

- external_key: resume_screening.quantified_impact.promotion_or_review_evidence
  competency_key: ownership
  topic: Evidence from reviews
  difficulty: medium
  text: "What written evidence exists for your contribution, such as reviews, design documents or commit\
    \ history, and what do they show?"
  expected_concepts:
  - documents authored
  - code reviews and commits
  - recognition received
  - clear alignment between evidence and the claim
  rubric:
    excellent: Points to specific artefacts they authored and how those corroborate their claimed contribution.
    good: Refers to general feedback or reviews with limited specifics.
    weak: Has nothing to point to or cannot describe it.
  followups:
  - Which document best shows your thinking?
  - Could I verify it with a reference?
  common_errors:
  - Pointing to general praise instead of specific artefacts.

- external_key: resume_screening.quantified_impact.parallel_work_coordination
  competency_key: collaboration
  topic: Parallel streams
  difficulty: medium
  text: "Several people were working on parts of the same goal. How did you make sure your part fit with\
    \ theirs and how did you measure the combined effect?"
  expected_concepts:
  - shared goals and interfaces
  - syncing regularly
  - combined measurement
  - resolving conflicts between parts
  rubric:
    excellent: "Describes how interfaces and goals were aligned, how progress was synced and how the combined\
      \ effect was measured."
    good: Coordinated through meetings and shared a general goal.
    weak: Worked in isolation and only learned of the outcome later.
  followups:
  - What went wrong in the integration?
  - How did you share results with the others?
  common_errors:
  - Working on a part in isolation and assuming it would combine neatly.

- external_key: resume_screening.quantified_impact.wrong_credit_correction
  competency_key: culture_values
  topic: Correcting an over-claim
  difficulty: hard
  text: "Have you ever realised that credit for a result was assigned to you more than you deserved? What\
    \ did you do?"
  expected_concepts:
  - noticing over-attribution
  - correcting it openly
  - effect on relationships
  - adjusting later claims
  rubric:
    excellent: "Gives a real example, shows they corrected the record in a direct, constructive way and\
      \ changed how they describe work afterwards."
    good: Describes a smaller case and a mild correction.
    weak: Says it never happens or let the credit stand.
  followups:
  - How did the other person respond?
  - What do you do differently now?
  common_errors:
  - Saying credit is always assigned correctly.

- external_key: resume_screening.quantified_impact.proving_it_was_you_not_luck
  competency_key: problem_solving
  topic: Skill versus luck
  difficulty: hard
  text: "How would you distinguish your skill from good timing in the improvement you describe, and what\
    \ evidence supports your view?"
  expected_concepts:
  - considering chance and timing
  - repeatability of the approach
  - later results on similar work
  - evidence beyond one case
  rubric:
    excellent: "Weighs luck and timing explicitly, cites later or parallel work where the same approach\
      \ produced results, and reaches a measured conclusion."
    good: Admits timing played a role and points to a reasonable part of the outcome that was theirs.
    weak: Rejects the possibility of luck or credits circumstances entirely.
  followups:
  - Did you apply the approach again?
  - What would have made it fail?
  common_errors:
  - Treating a single success as proof of a repeatable method.
