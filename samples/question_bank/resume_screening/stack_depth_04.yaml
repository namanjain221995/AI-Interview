# Curated questions: resume screening, stack_depth. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.stack_depth.skills_list_ordering
  competency_key: communication
  topic: How the skills list was built
  difficulty: easy
  text: How did you decide which technologies to list on your resume and in what order?
  expected_concepts:
  - criteria for inclusion
  - ordering by depth or relevance
  - leaving out weak skills
  - relation to the role
  rubric:
    excellent: "Explains clear criteria, shows ordering by depth and relevance and mentions leaving out\
      \ technologies they know only slightly."
    good: Lists main technologies with a general logic.
    weak: Added every technology they have touched.
  followups:
  - What did you leave out?
  - Which one is closest to the line?
  common_errors:
  - Listing every tool ever touched as a strength.

- external_key: resume_screening.stack_depth.strongest_vs_familiar
  competency_key: communication
  topic: Strong versus familiar
  difficulty: easy
  text: Which technologies on your list are you strongest in and which are you only familiar with?
  expected_concepts:
  - clear tiers
  - examples of work for each tier
  - accuracy
  - relevance
  rubric:
    excellent: Divides the list into tiers with work examples for each and calibrated descriptions.
    good: Identifies strong ones and weaker ones roughly.
    weak: Claims equal depth in all.
  followups:
  - What would you do differently using the familiar ones?
  - What would you need to learn?
  common_errors:
  - 'Falling into the weak pattern: claims equal depth in all.'

- external_key: resume_screening.stack_depth.show_me_by_doing
  competency_key: problem_solving
  topic: Practical walk-through
  difficulty: medium
  text: "Take one of your top technologies and talk me through how you would set up a simple solution\
    \ for a new small problem from scratch."
  expected_concepts:
  - requirements
  - setup steps
  - verifying
  - common pitfalls
  rubric:
    excellent: Gives an ordered plan with specific commands or components, checks and pitfalls to avoid.
    good: Gives a plausible but general plan.
    weak: Cannot move beyond generalities.
  followups:
  - What would you test first?
  - What might go wrong?
  common_errors:
  - 'Falling into the weak pattern: cannot move beyond generalities.'

- external_key: resume_screening.stack_depth.keeping_up_to_date
  competency_key: adaptability
  topic: Staying current
  difficulty: easy
  text: "How do you keep up with changes in the technologies you use, and what have you recently learned\
    \ that changed your work?"
  expected_concepts:
  - sources
  - time spent
  - applying
  - filtering hype
  rubric:
    excellent: Describes specific sources and a recent learning that changed their practice.
    good: Reads news and tries things occasionally.
    weak: Does not follow changes.
  followups:
  - How do you decide what to ignore?
  - What did you apply?
  common_errors:
  - 'Falling into the weak pattern: does not follow changes.'

- external_key: resume_screening.stack_depth.learning_a_new_tool_fast
  competency_key: adaptability
  topic: Learning quickly
  difficulty: medium
  text: Tell me about a technology you needed to learn quickly for work. How did you get productive?
  expected_concepts:
  - learning plan
  - hands-on practice
  - asking experts
  - applying quickly
  rubric:
    excellent: Describes a deliberate plan, hands-on practice, asking for help and a measurable result.
    good: Learned by doing with some guidance.
    weak: Struggled and relied on others.
  followups:
  - What took longest?
  - How did you check your understanding?
  common_errors:
  - 'Falling into the weak pattern: struggled and relied on others.'

- external_key: resume_screening.stack_depth.skill_transfer
  competency_key: adaptability
  topic: Transferring knowledge across tools
  difficulty: medium
  text: How have the skills from one technology on your list helped you learn another?
  expected_concepts:
  - shared concepts
  - mapping
  - differences noticed
  - speed of learning
  rubric:
    excellent: Gives an example of transferring concepts, noting where they differ and where assumptions
      broke.
    good: Notes similarities generally.
    weak: Treats each tool as unrelated.
  followups:
  - Where did the analogy fail?
  - What concept transferred best?
  common_errors:
  - 'Falling into the weak pattern: treats each tool as unrelated.'

- external_key: resume_screening.stack_depth.contribution_to_open_source
  competency_key: collaboration
  topic: Community involvement
  difficulty: medium
  text: "Have you contributed to the community or open projects around a technology you use, such as fixes,\
    \ docs or answers?"
  expected_concepts:
  - nature of contribution
  - process followed
  - outcome
  - motivation
  rubric:
    excellent: Describes a specific contribution, how it was reviewed and its result.
    good: Reported issues or shared small snippets.
    weak: No contribution.
  followups:
  - What feedback did you get?
  - What would you contribute next?
  common_errors:
  - 'Falling into the weak pattern: no contribution.'

- external_key: resume_screening.stack_depth.internal_tool_ownership
  competency_key: ownership
  topic: Being the go-to person
  difficulty: medium
  text: For which technology do colleagues come to you for help, and what do they typically ask?
  expected_concepts:
  - recognised expertise
  - typical questions
  - how they help
  - scaling their help
  rubric:
    excellent: Names the technology, the typical questions, how they help and how they made the help repeatable.
    good: Helps colleagues informally.
    weak: Nobody asks them.
  followups:
  - What question was hardest?
  - What did you document from it?
  common_errors:
  - 'Falling into the weak pattern: nobody asks them.'

- external_key: resume_screening.stack_depth.interview_style_practical_problem
  competency_key: problem_solving
  topic: Applying skills to a scenario
  difficulty: medium
  text: "Suppose a service built on your main technology suddenly becomes slow. What would you check,\
    \ in what order, and why?"
  expected_concepts:
  - gathering evidence
  - hypotheses
  - narrowing
  - fix and prevention
  rubric:
    excellent: "Gives an ordered investigation using technology-specific checks, reasoning about hypotheses\
      \ and prevention."
    good: Gives sensible but generic checks.
    weak: Offers restarts or guesses.
  followups:
  - What would you look at first?
  - How would you confirm the cause?
  common_errors:
  - 'Falling into the weak pattern: offers restarts or guesses.'

- external_key: resume_screening.stack_depth.combining_tools_for_solution
  competency_key: system_design
  topic: Solving with several tools
  difficulty: medium
  text: Describe a problem you solved by combining several tools from your list. Why that combination?
  expected_concepts:
  - role of each tool
  - interfaces
  - alternatives
  - result
  rubric:
    excellent: Explains the role of each tool, how they interact and why the combination beat alternatives.
    good: Lists the tools and the result.
    weak: Describes tools separately with no interplay.
  followups:
  - Which part was replaceable?
  - What was the weakest link?
  common_errors:
  - 'Falling into the weak pattern: describes tools separately with no interplay.'

- external_key: resume_screening.stack_depth.earliest_vs_latest_skill
  competency_key: adaptability
  topic: Skill evolution
  difficulty: easy
  text: How has your use of your main technology changed from your first projects to your current practice?
  expected_concepts:
  - early mistakes
  - growth
  - practices adopted
  - current approach
  rubric:
    excellent: Describes concrete changes in approach and practices and reasons for each.
    good: Describes growth in general.
    weak: Use has not changed.
  followups:
  - What do you now avoid?
  - What practice made the biggest difference?
  common_errors:
  - 'Falling into the weak pattern: use has not changed.'

- external_key: resume_screening.stack_depth.skills_not_used_recently
  competency_key: communication
  topic: Skills gone rusty
  difficulty: medium
  text: "Is there a technology on your list you have not used much lately? How would you get back up to\
    \ speed?"
  expected_concepts:
  - acknowledging
  - refresh plan
  - quick checks
  - fundamentals retained
  rubric:
    excellent: Names such a technology openly and gives a realistic and specific plan for refreshing it.
    good: Names one and a general plan.
    weak: Denies any skills have faded.
  followups:
  - What would you recall first?
  - How long would that take?
  common_errors:
  - 'Falling into the weak pattern: denies any skills have faded.'

- external_key: resume_screening.stack_depth.everyday_shortcuts
  competency_key: problem_solving
  topic: Productivity habits
  difficulty: easy
  text: What habits or shortcuts make you faster with your main technologies?
  expected_concepts:
  - tools and shortcuts
  - scripts
  - templates
  - learning from others
  rubric:
    excellent: Names specific habits, scripts or templates and the time they save.
    good: Names a few shortcuts.
    weak: Has no particular habits.
  followups:
  - Which one would you teach first?
  - Where did you learn it?
  common_errors:
  - 'Falling into the weak pattern: has no particular habits.'

- external_key: resume_screening.stack_depth.teammates_skill_gaps
  competency_key: collaboration
  topic: Complementing the team
  difficulty: medium
  text: Where did your technology skills complement or overlap with your teammates' on your last team?
  expected_concepts:
  - complementary skills
  - sharing knowledge
  - avoiding single points
  - team coverage
  rubric:
    excellent: Describes the team's skill mix, where they filled needs and how knowledge was shared.
    good: Describes some complementarity.
    weak: Has not considered the team's skill mix.
  followups:
  - Who covered for you?
  - Who did you learn from?
  common_errors:
  - 'Falling into the weak pattern: has not considered the team''s skill mix.'

- external_key: resume_screening.stack_depth.tool_certified_or_not
  competency_key: communication
  topic: Evidence of skill
  difficulty: easy
  text: "Beyond your resume, what evidence could show your skill with a key technology, such as public\
    \ work or documents?"
  expected_concepts:
  - portfolio items
  - documents
  - code samples
  - references
  rubric:
    excellent: Names concrete artefacts they could show or point to and what each demonstrates.
    good: Mentions possible evidence generally.
    weak: Has nothing they can share.
  followups:
  - What could you share today?
  - What is confidential?
  common_errors:
  - 'Falling into the weak pattern: has nothing they can share.'

- external_key: resume_screening.stack_depth.structured_troubleshooting_story
  competency_key: debugging
  topic: Troubleshooting narrative
  difficulty: medium
  text: "Tell me about a time a problem in your stack seemed to have no cause. How did you eventually\
    \ find it?"
  expected_concepts:
  - systematic elimination
  - evidence
  - persistence
  - root cause
  rubric:
    excellent: Describes systematic elimination with evidence, the surprising cause and what they changed.
    good: Describes finding the cause with some method.
    weak: Found it by chance.
  followups:
  - Which hypothesis did you drop?
  - How did you prove the cause?
  common_errors:
  - 'Falling into the weak pattern: found it by chance.'

- external_key: resume_screening.stack_depth.thoughts_on_best_practice
  competency_key: code_quality
  topic: Opinions on practice
  difficulty: medium
  text: What best practice in your main technology do you believe is overrated, and why?
  expected_concepts:
  - informed view
  - evidence from experience
  - context
  - open to other views
  rubric:
    excellent: Gives a reasoned view from experience, with conditions where the practice still applies.
    good: Gives an opinion with general reasons.
    weak: Repeats common advice without a view.
  followups:
  - When would you follow it?
  - What did you see happen?
  common_errors:
  - 'Falling into the weak pattern: repeats common advice without a view.'

- external_key: resume_screening.stack_depth.pair_programming_tool
  competency_key: collaboration
  topic: Working alongside others
  difficulty: easy
  text: Have you worked directly beside someone on a task in your main technology? What did you each learn?
  expected_concepts:
  - pairing or mobbing
  - learning exchange
  - communication
  - outcome
  rubric:
    excellent: Describes a pairing session, what each learned and how it changed their practice.
    good: Has paired a little.
    weak: Prefers to work separately with no examples.
  followups:
  - What did they teach you?
  - What did you teach them?
  common_errors:
  - 'Falling into the weak pattern: prefers to work separately with no examples.'

- external_key: resume_screening.stack_depth.best_resource_recommended
  competency_key: communication
  topic: Learning recommendations
  difficulty: easy
  text: "If a new colleague had to learn your main technology, which resources and exercises would you\
    \ recommend?"
  expected_concepts:
  - resources
  - exercises
  - order
  - pitfalls
  rubric:
    excellent: Recommends a sequence of specific resources and exercises with reasons.
    good: Recommends a few resources.
    weak: Cannot recommend anything specific.
  followups:
  - What helped you the most?
  - What should they skip?
  common_errors:
  - 'Falling into the weak pattern: cannot recommend anything specific.'

- external_key: resume_screening.stack_depth.senior_vs_mid_in_tool
  competency_key: leadership
  topic: What expertise looks like
  difficulty: hard
  text: What would a real expert in your main technology do differently from you today?
  expected_concepts:
  - realistic view of expertise
  - specific practices
  - gaps
  - learning goals
  rubric:
    excellent: Describes specific differences in practice and depth and how they are working toward them.
    good: Describes general differences.
    weak: Believes there is little difference.
  followups:
  - Whom have you seen do it?
  - What is your next step?
  common_errors:
  - 'Falling into the weak pattern: believes there is little difference.'

- external_key: resume_screening.stack_depth.architecture_decision_with_tool
  competency_key: system_design
  topic: Design decision using the tool
  difficulty: hard
  text: Describe a design decision where your technical depth in a tool changed what the team did.
  expected_concepts:
  - situation
  - the insight
  - effect
  - verification
  rubric:
    excellent: Describes how detailed tool knowledge changed the decision, with evidence of the effect.
    good: Describes input given in a decision.
    weak: Describes a decision made without tool knowledge.
  followups:
  - What would the team have done otherwise?
  - How did you convince them?
  common_errors:
  - 'Falling into the weak pattern: describes a decision made without tool knowledge.'

- external_key: resume_screening.stack_depth.ranked_tools_for_this_role
  competency_key: motivation
  topic: Relevance to this job
  difficulty: easy
  text: Which of your listed technologies matter most for the kind of job you are applying for, and why?
  expected_concepts:
  - relevance
  - evidence of use
  - learning plans
  - self-awareness
  rubric:
    excellent: Chooses relevant technologies with evidence of use and notes what they would need to learn.
    good: Chooses relevant technologies with general reasons.
    weak: Lists everything as relevant.
  followups:
  - Which one do you need to deepen?
  - How would you use it here?
  common_errors:
  - 'Falling into the weak pattern: lists everything as relevant.'

- external_key: resume_screening.stack_depth.personal_projects_stack
  competency_key: motivation
  topic: Personal projects
  difficulty: easy
  text: Have you used any of your listed technologies on personal projects or experiments? What did you
    try?
  expected_concepts:
  - self-directed learning
  - project description
  - outcomes
  - link to work
  rubric:
    excellent: Describes a project, what they learned and how it fed into work.
    good: Has small experiments.
    weak: Has no such experiments or cannot describe any.
  followups:
  - What went wrong?
  - What did you carry into work?
  common_errors:
  - 'Falling into the weak pattern: has no such experiments or cannot describe any.'

- external_key: resume_screening.stack_depth.speaking_or_writing_about_tool
  competency_key: communication
  topic: Sharing knowledge
  difficulty: medium
  text: "Have you ever written or presented about a technology you use, even internally? What was the\
    \ topic and reaction?"
  expected_concepts:
  - topic
  - audience
  - preparation
  - feedback
  rubric:
    excellent: Describes a specific talk, post or document, its audience and feedback received.
    good: Shared informally.
    weak: Has never shared knowledge.
  followups:
  - What questions came up?
  - What would you add now?
  common_errors:
  - 'Falling into the weak pattern: has never shared knowledge.'

- external_key: resume_screening.stack_depth.depth_vs_breadth_choice
  competency_key: motivation
  topic: Depth or breadth
  difficulty: medium
  text: Looking at your skills list, where have you chosen depth and where breadth, and why?
  expected_concepts:
  - deliberate choices
  - reasons tied to work
  - benefits and risks
  - plans
  rubric:
    excellent: "Explains deliberate choices with reasons tied to their work, weighs benefits and risks\
      \ and has plans."
    good: Describes a general pattern.
    weak: Has no view of depth versus breadth.
  followups:
  - What would you deepen next?
  - What would you stop learning?
  common_errors:
  - 'Falling into the weak pattern: has no view of depth versus breadth.'
