# Curated questions: resume screening, transitions_growth. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.transitions_growth.role_growth_story
  competency_key: motivation
  topic: Growth across roles
  difficulty: easy
  text: "Looking at the sequence of roles on your resume, how would you describe the growth from one to\
    \ the next?"
  expected_concepts:
  - clear thread across roles
  - increasing scope or depth
  - specific examples
  - learning
  rubric:
    excellent: Tells a coherent story with concrete increases in scope or depth and examples at each step.
    good: Describes the roles in order with some sense of progression.
    weak: Lists the roles without linking them or any sense of growth.
  followups:
  - Which step stretched you most?
  - What thread connects them?
  common_errors:
  - Reciting job titles in order with no development of skills.

- external_key: resume_screening.transitions_growth.what_changed_in_scope
  competency_key: ownership
  topic: Change in scope
  difficulty: easy
  text: When your responsibilities grew in a role, what was different about the work compared with before?
  expected_concepts:
  - new responsibilities
  - change in decisions
  - people or systems affected
  - adjustment needed
  rubric:
    excellent: Describes specific new responsibilities, the kind of decisions that changed and how they
      adjusted.
    good: Describes more responsibility in general terms.
    weak: Cannot describe what changed.
  followups:
  - What did you let go of?
  - What was hardest to adjust to?
  common_errors:
  - 'Falling into the weak pattern: cannot describe what changed.'

- external_key: resume_screening.transitions_growth.promotion_readiness
  competency_key: ownership
  topic: Earning a larger role
  difficulty: medium
  text: "Tell me about a time you moved into a role with more responsibility. What had you shown that\
    \ made it possible?"
  expected_concepts:
  - demonstrated results
  - informal responsibility before the title
  - support from others
  - preparation
  rubric:
    excellent: "Describes evidence of operating at the larger level before the move, supported by results\
      \ and feedback."
    good: Describes the move and a general reason.
    weak: Describes the move as automatic or cannot explain the basis.
  followups:
  - Who supported you?
  - What did you do before the title changed?
  common_errors:
  - 'Falling into the weak pattern: describes the move as automatic or cannot explain the basis.'

- external_key: resume_screening.transitions_growth.first_ninety_days
  competency_key: adaptability
  topic: Settling into a new role
  difficulty: easy
  text: How did you approach the first few months in a new role to become effective?
  expected_concepts:
  - learning the context
  - building relationships
  - early wins
  - seeking feedback
  rubric:
    excellent: "Describes a deliberate approach including learning the system, meeting people, early deliverables\
      \ and asking for feedback."
    good: Describes a reasonable approach with limited planning.
    weak: Waited to be told what to do.
  followups:
  - What was your first deliverable?
  - Who did you talk to first?
  common_errors:
  - 'Falling into the weak pattern: waited to be told what to do.'

- external_key: resume_screening.transitions_growth.skills_carried_forward
  competency_key: adaptability
  topic: Carry-over skills
  difficulty: easy
  text: Which skills from your earlier roles proved most useful in your later ones?
  expected_concepts:
  - transferable skills
  - examples
  - adaptation
  - recognition
  rubric:
    excellent: Names specific skills with examples of use in the later role and how they adapted them.
    good: Names skills with general examples.
    weak: Cannot name any skills that carried over.
  followups:
  - Which skill surprised you by being useful?
  - What did you need to unlearn?
  common_errors:
  - 'Falling into the weak pattern: cannot name any skills that carried over.'

- external_key: resume_screening.transitions_growth.new_responsibility_example
  competency_key: ownership
  topic: Taking on something new
  difficulty: medium
  text: Describe a new responsibility you took on that was not part of your original role. How did it
    go?
  expected_concepts:
  - identifying need
  - taking initiative
  - learning
  - results
  rubric:
    excellent: Describes spotting the need, volunteering, learning what was needed and the result.
    good: Took on tasks when asked and did them well.
    weak: Only did assigned work.
  followups:
  - How did you find the time?
  - What did you learn?
  common_errors:
  - 'Falling into the weak pattern: only did assigned work.'

- external_key: resume_screening.transitions_growth.internal_move
  competency_key: adaptability
  topic: Moving within a company
  difficulty: medium
  text: "If you moved to a different team or function within one organisation, what did you take from\
    \ the old team and what did you have to learn?"
  expected_concepts:
  - transferring knowledge
  - new context
  - building relationships
  - bridging teams
  rubric:
    excellent: Describes what transferred, what had to be learned, and how the move benefited both teams.
    good: Describes the move and some learning.
    weak: Describes the move without any learning.
  followups:
  - What did the old team say?
  - What did you teach the new team?
  common_errors:
  - 'Falling into the weak pattern: describes the move without any learning.'

- external_key: resume_screening.transitions_growth.mentor_influence
  competency_key: mentoring
  topic: People who shaped growth
  difficulty: easy
  text: Who influenced how you developed in your roles and what did you take from them?
  expected_concepts:
  - specific people
  - lessons
  - applying them
  - paying it forward
  rubric:
    excellent: Names specific people, concrete lessons and examples of applying and passing them on.
    good: Names someone with general lessons.
    weak: Cannot name anyone.
  followups:
  - What advice stuck with you?
  - Whom have you helped in the same way?
  common_errors:
  - 'Falling into the weak pattern: cannot name anyone.'

- external_key: resume_screening.transitions_growth.stretch_assignment
  competency_key: adaptability
  topic: Stretch work
  difficulty: medium
  text: "Tell me about an assignment that felt beyond your experience at the time. What did you do to\
    \ succeed?"
  expected_concepts:
  - recognising the stretch
  - seeking support
  - learning plan
  - outcome
  rubric:
    excellent: Describes the stretch, steps to prepare and get support and what they achieved.
    good: Describes the assignment and an adequate outcome.
    weak: Avoids stretch work or cannot describe one.
  followups:
  - Where did you ask for help?
  - What would you do differently?
  common_errors:
  - 'Falling into the weak pattern: avoids stretch work or cannot describe one.'

- external_key: resume_screening.transitions_growth.titles_vs_work
  competency_key: communication
  topic: Titles and substance
  difficulty: easy
  text: "How would you describe the actual difference in your day-to-day work between two roles on your\
    \ resume that have similar titles?"
  expected_concepts:
  - concrete differences in tasks
  - responsibilities
  - scope
  - learning
  rubric:
    excellent: Gives specific differences in tasks and responsibilities and what each role added.
    good: Gives general differences.
    weak: Cannot distinguish them.
  followups:
  - Which one taught you more?
  - What did you do in one that you did not in the other?
  common_errors:
  - 'Falling into the weak pattern: cannot distinguish them.'

- external_key: resume_screening.transitions_growth.growth_in_technical_depth
  competency_key: code_quality
  topic: Technical depth over roles
  difficulty: medium
  text: "How has your technical depth changed across your roles, and what is an example of something you\
    \ can do now that you could not before?"
  expected_concepts:
  - concrete capabilities
  - examples
  - learning methods
  - continuing goals
  rubric:
    excellent: Gives specific new capabilities with examples and describes how they were learned.
    good: Gives general growth with one example.
    weak: Cannot name new capabilities.
  followups:
  - What are you working on now?
  - What changed the most?
  common_errors:
  - 'Falling into the weak pattern: cannot name new capabilities.'

- external_key: resume_screening.transitions_growth.growth_in_people_skills
  competency_key: collaboration
  topic: Working with others over time
  difficulty: medium
  text: How has the way you work with other people changed through your career so far?
  expected_concepts:
  - concrete changes
  - examples
  - lessons
  - effect on outcomes
  rubric:
    excellent: "Describes specific changes in how they communicate or collaborate, supported by examples\
      \ and results."
    good: Describes general improvement.
    weak: Says nothing has changed.
  followups:
  - What prompted the change?
  - What feedback did you get?
  common_errors:
  - 'Falling into the weak pattern: says nothing has changed.'

- external_key: resume_screening.transitions_growth.leading_work_first_time
  competency_key: leadership
  topic: Taking first lead
  difficulty: medium
  text: Tell me about the first time you led a piece of work or a group of people. What did you learn?
  expected_concepts:
  - setting direction
  - delegation
  - support
  - reflection
  rubric:
    excellent: Describes the situation, how they set direction and supported others and specific lessons.
    good: Describes leading with a basic lesson.
    weak: Cannot describe an example of leading.
  followups:
  - What would you do differently?
  - What did the team need from you?
  common_errors:
  - 'Falling into the weak pattern: cannot describe an example of leading.'

- external_key: resume_screening.transitions_growth.learning_from_a_role_that_was_hard
  competency_key: adaptability
  topic: A demanding role
  difficulty: medium
  text: Which role on your resume demanded the most learning, and what did you take from it?
  expected_concepts:
  - learning demands
  - actions taken
  - results
  - lasting benefits
  rubric:
    excellent: Names the role, describes specific learning demands, what they did and how they apply it
      now.
    good: Names the role with general lessons.
    weak: Describes it as easy or has no lessons.
  followups:
  - What was the steepest part?
  - What helped most?
  common_errors:
  - 'Falling into the weak pattern: describes it as easy or has no lessons.'

- external_key: resume_screening.transitions_growth.choosing_between_paths
  competency_key: problem_solving
  topic: Weighing options
  difficulty: medium
  text: When you had a choice between two professional paths, how did you decide?
  expected_concepts:
  - criteria
  - research
  - advice
  - reflection
  rubric:
    excellent: Describes clear criteria, how they gathered information and the reasoning that led to the
      decision.
    good: Describes the options and a general reason.
    weak: Chose by chance or cannot explain.
  followups:
  - What was the deciding factor?
  - How did the choice turn out?
  common_errors:
  - 'Falling into the weak pattern: chose by chance or cannot explain.'

- external_key: resume_screening.transitions_growth.scope_beyond_job_description
  competency_key: ownership
  topic: Going beyond the role
  difficulty: medium
  text: Give an example of work you did that went beyond your job description and why you took it on.
  expected_concepts:
  - spotting an opportunity
  - communicating with manager
  - delivering
  - value
  rubric:
    excellent: Describes spotting an opportunity, aligning with others, delivering and the value created.
    good: Did extra work when asked.
    weak: Never went beyond the job description.
  followups:
  - How did you decide it was worth it?
  - Who benefited?
  common_errors:
  - 'Falling into the weak pattern: never went beyond the job description.'

- external_key: resume_screening.transitions_growth.role_clarity_new_job
  competency_key: communication
  topic: Understanding expectations
  difficulty: easy
  text: When you started in a new role, how did you find out what was expected of you?
  expected_concepts:
  - asking about goals
  - success criteria
  - feedback loops
  - adjusting
  rubric:
    excellent: Describes asking for expectations explicitly, agreeing on success criteria and checking
      progress.
    good: Learned expectations over time.
    weak: Guessed and found out through mistakes.
  followups:
  - What question did you ask first?
  - How did you check you were on track?
  common_errors:
  - 'Falling into the weak pattern: guessed and found out through mistakes.'

- external_key: resume_screening.transitions_growth.what_you_would_tell_your_earlier_self
  competency_key: adaptability
  topic: Advice looking back
  difficulty: easy
  text: "Looking at the sequence of your roles, what is one lesson you would pass to someone starting\
    \ where you began?"
  expected_concepts:
  - specific lesson
  - evidence from experience
  - relevance
  - reflection
  rubric:
    excellent: Gives a specific lesson with the experience behind it and how it applies to others.
    good: Gives a general lesson.
    weak: Cannot offer a lesson.
  followups:
  - What example shows it?
  - What would you add?
  common_errors:
  - 'Falling into the weak pattern: cannot offer a lesson.'

- external_key: resume_screening.transitions_growth.visible_results_in_each_role
  competency_key: ownership
  topic: Results per role
  difficulty: medium
  text: What is one concrete result you are proud of from each of your last two roles?
  expected_concepts:
  - specific results
  - relevance to the role
  - comparison
  - evidence
  rubric:
    excellent: Gives a specific, verifiable result for each role and notes how the second built on the
      first.
    good: Gives results of differing specificity.
    weak: Gives results for only one role or only vague ones.
  followups:
  - How did the first result help the second?
  - How was it measured?
  common_errors:
  - 'Falling into the weak pattern: gives results for only one role or only vague ones.'

- external_key: resume_screening.transitions_growth.team_size_growth
  competency_key: leadership
  topic: Working with bigger groups
  difficulty: medium
  text: "Have you worked with larger teams or more stakeholders over time? How did your way of working\
    \ change?"
  expected_concepts:
  - scaling communication
  - coordination methods
  - delegation
  - relationships
  rubric:
    excellent: Describes how communication and coordination changed with size and specific techniques
      adopted.
    good: Describes working in larger settings generally.
    weak: Worked the same way regardless of size.
  followups:
  - What stopped working as it grew?
  - What did you introduce?
  common_errors:
  - 'Falling into the weak pattern: worked the same way regardless of size.'

- external_key: resume_screening.transitions_growth.cross_functional_exposure
  competency_key: collaboration
  topic: Working across functions
  difficulty: easy
  text: How has working with other functions, such as product, design or operations, shaped your roles?
  expected_concepts:
  - understanding other functions
  - communication
  - shared goals
  - learning
  rubric:
    excellent: Describes working with other functions, what they learned and how it improved results.
    good: Worked with other functions occasionally.
    weak: Worked in isolation.
  followups:
  - What did you learn from them?
  - What misunderstandings arose?
  common_errors:
  - 'Falling into the weak pattern: worked in isolation.'

- external_key: resume_screening.transitions_growth.feedback_that_shaped_direction
  competency_key: adaptability
  topic: Feedback and direction
  difficulty: medium
  text: What feedback from a manager or peer changed the direction of your development?
  expected_concepts:
  - specific feedback
  - reaction
  - actions
  - results
  rubric:
    excellent: Describes specific feedback, how they acted on it and a visible improvement.
    good: Describes feedback and a general response.
    weak: Cannot recall feedback or dismissed it.
  followups:
  - How did you act on it?
  - How did you check progress?
  common_errors:
  - 'Falling into the weak pattern: cannot recall feedback or dismissed it.'

- external_key: resume_screening.transitions_growth.handing_over_when_moving_on
  competency_key: collaboration
  topic: Leaving work in good shape
  difficulty: medium
  text: "When you moved from one role to another, how did you leave your previous responsibilities so\
    \ that others could continue?"
  expected_concepts:
  - handover documents
  - knowledge transfer
  - availability for questions
  - outcome
  rubric:
    excellent: "Describes concrete handover steps, how others were prepared and evidence that work continued\
      \ smoothly."
    good: Handed over with documents and a conversation.
    weak: Left tasks undocumented.
  followups:
  - What did you document?
  - What did people ask afterwards?
  common_errors:
  - 'Falling into the weak pattern: left tasks undocumented.'

- external_key: resume_screening.transitions_growth.role_you_learned_most_from
  competency_key: adaptability
  topic: Most formative role
  difficulty: easy
  text: Which role on your resume shaped how you work the most, and in what way?
  expected_concepts:
  - choosing a role
  - specific influence
  - examples
  - continuing effect
  rubric:
    excellent: "Names a role, the specific ways it shaped their practice and examples of it still showing\
      \ in their work."
    good: Names a role with a general influence.
    weak: Cannot choose or describe an influence.
  followups:
  - What is an example of that influence?
  - What would you pass on from it?
  common_errors:
  - 'Falling into the weak pattern: cannot choose or describe an influence.'

- external_key: resume_screening.transitions_growth.responsibility_growth_evidence
  competency_key: ownership
  topic: Evidence of growth
  difficulty: hard
  text: "What would your former colleagues say changed most about you as a professional between your first\
    \ role and your latest, and what evidence backs that?"
  expected_concepts:
  - perspective of others
  - concrete changes
  - evidence
  - calibration
  rubric:
    excellent: Gives a specific, evidence-backed account of change that others would recognise.
    good: Gives a general account of change.
    weak: Says nothing changed or offers no evidence.
  followups:
  - Which colleague would say that?
  - Where have you not changed yet?
  common_errors:
  - 'Falling into the weak pattern: says nothing changed or offers no evidence.'
