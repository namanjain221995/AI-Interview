# Curated questions: resume screening, quantified_impact. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.quantified_impact.latency_percentiles
  competency_key: data_analysis
  topic: Latency figures
  difficulty: medium
  text: "If your resume reports a latency improvement, which statistic did you use, such as average, median\
    \ or a high percentile, and why?"
  expected_concepts:
  - choosing a percentile suited to the question
  - tail latency versus average
  - measuring at the right point in the request
  - load conditions
  rubric:
    excellent: "Names the statistic, explains why it reflects user experience, says where the time was\
      \ measured and under what load."
    good: Uses a statistic with a basic reason but does not discuss tail behaviour.
    weak: Quotes an average without knowing how the data was distributed.
  followups:
  - What happened to the slowest requests?
  - Where in the path did you take the timing?
  common_errors:
  - Reporting average latency when the problem was in the tail.

- external_key: resume_screening.quantified_impact.revenue_attribution
  competency_key: product_sense
  topic: Revenue figures
  difficulty: medium
  text: "When you quote a revenue or sales figure tied to your work, how did you decide how much of it\
    \ was linked to what you built?"
  expected_concepts:
  - tracing revenue to a feature or campaign
  - attribution method
  - excluding baseline sales
  - agreement with finance or analytics
  rubric:
    excellent: "Explains the method for tying revenue to the work, what was excluded as baseline and who\
      \ validated the figure."
    good: Gives a plausible link and rough method but with limited rigour.
    weak: Reports total revenue of the product as their impact.
  followups:
  - What would revenue have been without it?
  - Who owned that figure?
  common_errors:
  - Claiming total product revenue as personal impact.

- external_key: resume_screening.quantified_impact.cost_per_unit
  competency_key: data_analysis
  topic: Unit costs
  difficulty: easy
  text: "For a cost figure on your resume, what unit was it measured in, such as per request, per user\
    \ or per month, and why that unit?"
  expected_concepts:
  - choosing a unit that matches the goal
  - normalising for volume
  - showing total and unit costs
  - avoiding misleading comparison
  rubric:
    excellent: "States the unit, why it suits the goal, and shows how total cost and volume changed so\
      \ the unit figure is credible."
    good: States a unit and a general reason.
    weak: Cannot say what unit the figure used.
  followups:
  - Did volume change over the same period?
  - Which unit would the finance team prefer?
  common_errors:
  - 'Falling into the weak pattern: cannot say what unit the figure used.'

- external_key: resume_screening.quantified_impact.conversion_rate_claims
  competency_key: statistics_experimentation
  topic: Conversion figures
  difficulty: medium
  text: "If you improved a conversion rate, how did you establish the improvement was real and not a different\
    \ mix of visitors?"
  expected_concepts:
  - comparable audience
  - test design
  - sample size
  - segment checks
  rubric:
    excellent: "Describes a controlled comparison, checks the audience mix and notes the sample size and\
      \ segments examined."
    good: Compared before and after and noticed some audience changes.
    weak: Only compared totals with no thought about who the visitors were.
  followups:
  - What traffic changes happened?
  - Did every segment improve?
  common_errors:
  - 'Falling into the weak pattern: only compared totals with no thought about who the visitors were.'

- external_key: resume_screening.quantified_impact.uptime_availability_numbers
  competency_key: observability
  topic: Availability figures
  difficulty: medium
  text: When you state an uptime or availability figure, how was it defined and who or what measured it?
  expected_concepts:
  - definition of available
  - measurement point such as synthetic or real traffic
  - excluded maintenance
  - error budget view
  rubric:
    excellent: "Gives the definition, the measurement source and any exclusions, and relates the figure\
      \ to user impact."
    good: Gives the figure and the monitoring tool but not the definition details.
    weak: Quotes nines of availability without knowing how it was calculated.
  followups:
  - Does planned maintenance count?
  - What would a user have noticed at that availability?
  common_errors:
  - Quoting availability without a definition of what counts as down.

- external_key: resume_screening.quantified_impact.error_rate_reduction
  competency_key: observability
  topic: Error-rate figures
  difficulty: medium
  text: "For an error-rate reduction, how did you count errors before and after, and did the definition\
    \ of an error stay the same?"
  expected_concepts:
  - consistent error definition
  - counting method
  - traffic changes
  - hidden errors moved elsewhere
  rubric:
    excellent: "Shows the definition and counting stayed the same, accounts for traffic changes and checks\
      \ the errors did not simply move to another place."
    good: Compared counts from the same dashboard with a rough check on traffic.
    weak: Did not notice the definition or logging had changed.
  followups:
  - Could errors have been hidden by retries?
  - How did you check user-facing failures?
  common_errors:
  - 'Falling into the weak pattern: did not notice the definition or logging had changed.'

- external_key: resume_screening.quantified_impact.time_saved_hours
  competency_key: process_modeling
  topic: Time-saved claims
  difficulty: medium
  text: "When you claim to have saved a number of hours, who saved them, how often, and how did you calculate\
    \ it?"
  expected_concepts:
  - users of the saved time
  - frequency of the task
  - measuring before and after times
  - realised versus theoretical savings
  rubric:
    excellent: "Identifies who benefits, multiplies by observed frequency and duration and distinguishes\
      \ theoretical from realised savings."
    good: Gives a reasonable estimate based on typical use.
    weak: Quotes a large number from an unclear calculation.
  followups:
  - Where did that time go instead?
  - Did you time the task before the change?
  common_errors:
  - 'Falling into the weak pattern: quotes a large number from an unclear calculation.'

- external_key: resume_screening.quantified_impact.adoption_numbers
  competency_key: product_sense
  topic: Adoption figures
  difficulty: easy
  text: "If your resume mentions adoption by a number of users or teams, how did you define adoption and\
    \ track it?"
  expected_concepts:
  - definition of adoption such as active use
  - tracking method
  - sustained versus one-off
  - targets set
  rubric:
    excellent: Gives a clear definition of active use, the method of tracking and whether use was sustained.
    good: Gives a number and general tracking method.
    weak: Counts sign-ups or installs as adoption without checking use.
  followups:
  - How many were still using it later?
  - What did non-adopters say?
  common_errors:
  - Counting registrations as active use.

- external_key: resume_screening.quantified_impact.defect_reduction
  competency_key: test_automation
  topic: Defect and quality figures
  difficulty: medium
  text: "When quality improved on your project, how did you count defects and how did you know fewer defects\
    \ were not just fewer reports?"
  expected_concepts:
  - consistent defect definition
  - severity weighting
  - reporting culture changes
  - escaped defects
  rubric:
    excellent: "Describes a consistent definition and severity view, checks reporting behaviour and uses\
      \ escaped defects as a check."
    good: Compared defect counts over time and thought about severity.
    weak: Compared raw bug counts without checking reporting behaviour.
  followups:
  - Did the way people logged bugs change?
  - How many reached customers?
  common_errors:
  - 'Falling into the weak pattern: compared raw bug counts without checking reporting behaviour.'

- external_key: resume_screening.quantified_impact.build_and_pipeline_time
  competency_key: ci_cd
  topic: Build time figures
  difficulty: easy
  text: "For a build or pipeline time improvement, what exactly did you measure, and did it include queueing\
    \ and waiting time?"
  expected_concepts:
  - wall-clock versus compute time
  - queue time
  - caching effects
  - variation between runs
  rubric:
    excellent: "Specifies which duration was measured, whether queue time was included, and how cache\
      \ state and variance were handled."
    good: Reports a pipeline duration and some variation.
    weak: Quotes the fastest run only.
  followups:
  - Was that on a warm cache?
  - What did developers feel day to day?
  common_errors:
  - 'Falling into the weak pattern: quotes the fastest run only.'

- external_key: resume_screening.quantified_impact.infrastructure_cost_reduction
  competency_key: cloud_cost_optimization
  topic: Cloud bill reduction
  difficulty: medium
  text: "When you say you reduced cloud spend, how did you separate your changes from price changes, usage\
    \ growth or discounts?"
  expected_concepts:
  - normalising for usage
  - separating discounts or pricing changes
  - tagging resources
  - verifying with billing data
  rubric:
    excellent: "Describes normalising for usage growth, excluding commitment discounts and price changes,\
      \ and verifying in billing data."
    good: Used billing data to compare before and after with a rough usage adjustment.
    weak: Compared monthly bills without adjustment.
  followups:
  - How did usage change in the same period?
  - Which discounts applied?
  common_errors:
  - Taking credit for savings that came from pricing or discounts.

- external_key: resume_screening.quantified_impact.customer_satisfaction_scores
  competency_key: product_sense
  topic: Satisfaction scores
  difficulty: medium
  text: If a satisfaction score improved, how many responses were behind it and who responded?
  expected_concepts:
  - response count and rate
  - who responds
  - consistent question and method
  - combining with other signals
  rubric:
    excellent: States response volume and rate, discusses who tends to respond and corroborates with other
      signals.
    good: Knows the score and the general number of responses.
    weak: Knows only the headline score.
  followups:
  - How representative were the responders?
  - What did free-text comments say?
  common_errors:
  - 'Falling into the weak pattern: knows only the headline score.'

- external_key: resume_screening.quantified_impact.support_ticket_reduction
  competency_key: technical_support
  topic: Ticket volume
  difficulty: medium
  text: "A drop in support tickets can mean different things. How did you confirm the problem was solved\
    \ rather than reported less?"
  expected_concepts:
  - ticket categories
  - customer growth normalisation
  - alternative channels
  - root cause evidence
  rubric:
    excellent: "Normalises for customer volume, checks categories and channels and ties the drop to the\
      \ fixed root cause."
    good: Looked at overall ticket counts and categories.
    weak: Treats fewer tickets as success without checking.
  followups:
  - Could customers be going elsewhere for help?
  - What did the remaining tickets look like?
  common_errors:
  - 'Falling into the weak pattern: treats fewer tickets as success without checking.'

- external_key: resume_screening.quantified_impact.deployment_frequency_lead_time
  competency_key: agile_delivery
  topic: Delivery metrics
  difficulty: medium
  text: "If you improved deployment frequency or lead time, how did you measure it and what happened to\
    \ quality alongside?"
  expected_concepts:
  - definition of lead time
  - data source
  - change failure rate alongside
  - avoiding gaming
  rubric:
    excellent: "Defines lead time clearly, uses pipeline data, tracks failure rates alongside and discusses\
      \ gaming risks."
    good: Reports the frequency and lead time and mentions quality.
    weak: Reports speed alone with no view of quality.
  followups:
  - Did incidents increase?
  - How could the number be gamed?
  common_errors:
  - 'Falling into the weak pattern: reports speed alone with no view of quality.'

- external_key: resume_screening.quantified_impact.team_productivity_claims
  competency_key: agile_delivery
  topic: Productivity claims
  difficulty: hard
  text: "Claims about higher productivity are hard to prove. If you made one, what did you measure and\
    \ what are its weaknesses?"
  expected_concepts:
  - outcome versus output measures
  - avoiding story points as productivity
  - quality alongside
  - qualitative signals
  rubric:
    excellent: "Chooses outcome measures, explains the weakness of output counts and adds quality and\
      \ team feedback signals."
    good: Used delivery measures with a few caveats.
    weak: Used lines of code or ticket counts as evidence.
  followups:
  - What was the best signal you had?
  - What did the team say?
  common_errors:
  - Using output counts such as tickets closed as proof of productivity.

- external_key: resume_screening.quantified_impact.accuracy_model_metric
  competency_key: statistics_experimentation
  topic: Model accuracy figures
  difficulty: hard
  text: "If your resume quotes accuracy or a similar model metric, what data was it measured on and how\
    \ does it relate to real use?"
  expected_concepts:
  - separate evaluation data
  - class balance
  - metric choice
  - online versus offline results
  rubric:
    excellent: "Explains the evaluation set, its separation from training, the choice of metric given\
      \ class balance and the link to real use."
    good: Knows the metric and data split with limited discussion of real use.
    weak: Quotes a training-set figure or only accuracy on imbalanced data.
  followups:
  - How did it do in production?
  - What would the metric miss?
  common_errors:
  - 'Falling into the weak pattern: quotes a training-set figure or only accuracy on imbalanced data.'

- external_key: resume_screening.quantified_impact.page_speed_vitals
  competency_key: frontend_react
  topic: Web performance figures
  difficulty: medium
  text: "For a page speed number, was it lab data or real-user data, and how did that choice affect the\
    \ claim?"
  expected_concepts:
  - lab versus field data
  - device and network variety
  - percentile reporting
  - synthetic test conditions
  rubric:
    excellent: "Distinguishes the two sources, explains device and network variety and reports a suitable\
      \ percentile of real data."
    good: Used a lab tool and knows it differs from real use.
    weak: Reports one local run as the result.
  followups:
  - Which devices were slowest?
  - Did real users see the same change?
  common_errors:
  - 'Falling into the weak pattern: reports one local run as the result.'

- external_key: resume_screening.quantified_impact.security_risk_reduction
  competency_key: security
  topic: Risk reduction figures
  difficulty: hard
  text: "If you claim to have reduced risk or vulnerabilities, how did you quantify that and what does\
    \ the number mean for actual exposure?"
  expected_concepts:
  - severity weighting
  - reachable versus theoretical vulnerabilities
  - coverage of assets
  - residual risk
  rubric:
    excellent: Weights by severity and exposure, explains asset coverage and states what risk remains.
    good: Reports a drop in findings with some severity context.
    weak: Counts findings closed without regard to impact.
  followups:
  - Which finding mattered most?
  - Did you re-scan to confirm?
  common_errors:
  - Treating a lower finding count as lower exposure.

- external_key: resume_screening.quantified_impact.scale_numbers_users_requests
  competency_key: system_design
  topic: Scale figures
  difficulty: easy
  text: "When you mention scale such as users or requests per second, was that average or peak, and where\
    \ did the figure come from?"
  expected_concepts:
  - peak versus average
  - source of the figure
  - headroom
  - growth
  rubric:
    excellent: Distinguishes peak and average, names the monitoring source and describes headroom.
    good: Gives the number and its source.
    weak: Mentions a large number with no explanation.
  followups:
  - What was the peak?
  - How close to limits did you run?
  common_errors:
  - 'Falling into the weak pattern: mentions a large number with no explanation.'

- external_key: resume_screening.quantified_impact.money_saved_vs_money_earned
  competency_key: product_sense
  topic: Savings versus revenue
  difficulty: medium
  text: "Is the figure on your resume money saved, money earned or money avoided, and how does that change\
    \ how a reader should weigh it?"
  expected_concepts:
  - classifying the type of benefit
  - avoided cost uncertainty
  - hard versus soft savings
  - clear wording
  rubric:
    excellent: "Classifies the figure precisely, explains the certainty of each type and words the claim\
      \ accordingly."
    good: States which type applies and a general caveat.
    weak: Mixes types or presents avoided cost as realised savings.
  followups:
  - Was any of it actually in the budget?
  - How was avoided cost estimated?
  common_errors:
  - 'Falling into the weak pattern: mixes types or presents avoided cost as realised savings.'

- external_key: resume_screening.quantified_impact.qualitative_improvement_proof
  competency_key: problem_solving
  topic: Evidence for non-numeric gains
  difficulty: medium
  text: "Some improvements, such as maintainability or clarity, are hard to put a number on. How did you\
    \ show yours?"
  expected_concepts:
  - proxy indicators
  - before and after comparison examples
  - peer feedback
  - time to onboard or change
  rubric:
    excellent: "Chooses reasonable proxies, offers concrete before and after examples and uses feedback\
      \ from those who work with the result."
    good: Offers feedback and a couple of examples.
    weak: Asserts the improvement without any evidence.
  followups:
  - What would a sceptic need to see?
  - Did you track any proxy?
  common_errors:
  - 'Falling into the weak pattern: asserts the improvement without any evidence.'

- external_key: resume_screening.quantified_impact.sla_compliance_figures
  competency_key: technical_support
  topic: Service-level figures
  difficulty: easy
  text: "If you improved a service-level compliance figure, how was it defined and did the definition\
    \ include everything customers cared about?"
  expected_concepts:
  - definition of the target
  - clock start and stop
  - exclusions
  - customer-felt outcome
  rubric:
    excellent: Defines the target and timing rules, notes exclusions and links it to customer experience.
    good: Knows the target and compliance figure with some rules.
    weak: Cannot explain how compliance was computed.
  followups:
  - What was excluded?
  - How did customers feel about it?
  common_errors:
  - 'Falling into the weak pattern: cannot explain how compliance was computed.'

- external_key: resume_screening.quantified_impact.metric_that_moved_wrong_way
  competency_key: problem_solving
  topic: Metric that got worse
  difficulty: hard
  text: "Tell me about a metric on one of your projects that moved the wrong way. What did you do with\
    \ that information?"
  expected_concepts:
  - noticing and reporting the adverse metric
  - investigating cause
  - adjusting plans
  - communicating it
  rubric:
    excellent: Gives a concrete example, shows how they investigated, reported it promptly and changed
      the plan.
    good: Describes a smaller adverse metric and a basic response.
    weak: Cannot recall any, or ignored the result.
  followups:
  - Who did you tell?
  - What did you change?
  common_errors:
  - Burying an adverse metric so the project looked successful.

- external_key: resume_screening.quantified_impact.retention_churn_numbers
  competency_key: product_sense
  topic: Retention and churn figures
  difficulty: medium
  text: "If you moved a retention or churn number, how did you define the cohort and what time window\
    \ did you use to call a user retained?"
  expected_concepts:
  - cohort definition
  - retention window
  - comparing similar cohorts
  - early signal versus long-term result
  rubric:
    excellent: "Defines the cohort and retention window, compares like with like and separates early signals\
      \ from lasting retention."
    good: Defines the metric and compares two cohorts.
    weak: Reports a change in total users as retention.
  followups:
  - How did older and newer cohorts differ?
  - How long did you wait before calling it a success?
  common_errors:
  - Comparing cohorts of different ages as if they were equivalent.

- external_key: resume_screening.quantified_impact.memory_cpu_resource_usage
  competency_key: observability
  topic: Resource usage figures
  difficulty: easy
  text: "For a reduction in memory or CPU use, under what load was it measured and was the saving sustained\
    \ in production?"
  expected_concepts:
  - comparable load
  - peak versus idle
  - measurement tool
  - long-running stability
  rubric:
    excellent: "Specifies the load and tool, compares peak and idle usage and confirms the saving persisted\
      \ in production."
    good: Compared usage under similar test load.
    weak: Compared one idle moment before and after.
  followups:
  - Did it hold during peak?
  - What was the headroom afterwards?
  common_errors:
  - Measuring at idle and generalising to production load.
