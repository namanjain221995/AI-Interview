# Curated questions: resume screening, project_ownership. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.project_ownership.timeline_slipped
  competency_key: project_management
  topic: Schedule slip
  difficulty: medium
  text: Did the project ever slip against its plan? What did you do about it and how did you communicate
    it?
  expected_concepts:
  - early detection
  - recovery options
  - stakeholder communication
  - lessons for planning
  rubric:
    excellent: "Describes how the slip was detected, the options weighed, the message sent to stakeholders\
      \ and the planning change after."
    good: Describes the slip and a standard recovery.
    weak: Claims no slip or hides the cause.
  followups:
  - When did you first see it?
  - Who did you tell first?
  common_errors:
  - Reporting the slip only at the deadline.

- external_key: resume_screening.project_ownership.launch_day_story
  competency_key: ownership
  topic: Launch experience
  difficulty: easy
  text: "Walk me through the launch or delivery of that project. What was your part on the day and in\
    \ the days after?"
  expected_concepts:
  - launch preparation
  - own responsibilities
  - monitoring
  - handling issues
  rubric:
    excellent: Describes preparation, their specific tasks on the day, monitoring and issue handling afterwards.
    good: Describes the launch and their general role.
    weak: Was not involved in the launch.
  followups:
  - What went wrong, if anything?
  - What did you prepare beforehand?
  common_errors:
  - 'Falling into the weak pattern: was not involved in the launch.'

- external_key: resume_screening.project_ownership.incident_on_your_project
  competency_key: incident_response
  topic: Production problem
  difficulty: medium
  text: "Did your project cause or experience a serious problem after delivery? What was your role in\
    \ dealing with it?"
  expected_concepts:
  - detection
  - response actions
  - communication
  - follow-up fixes
  rubric:
    excellent: Describes the problem, their actions, the communication and the permanent fix with evidence.
    good: Helped with the response and follow-up.
    weak: Was uninvolved or cannot recall details.
  followups:
  - How was it detected?
  - What was prevented afterwards?
  common_errors:
  - 'Falling into the weak pattern: was uninvolved or cannot recall details.'

- external_key: resume_screening.project_ownership.handover_to_run_team
  competency_key: collaboration
  topic: Handover
  difficulty: medium
  text: How did you hand the project over to the people who would run or maintain it?
  expected_concepts:
  - documentation
  - walkthroughs
  - ownership transfer
  - support period
  rubric:
    excellent: "Describes documents, walkthroughs, an agreed transfer of ownership and a support period\
      \ with evidence it worked."
    good: Handed over with documents and a meeting.
    weak: Left without a proper handover.
  followups:
  - What questions came up afterwards?
  - What was missing from the handover?
  common_errors:
  - 'Falling into the weak pattern: left without a proper handover.'

- external_key: resume_screening.project_ownership.maintaining_after_launch
  competency_key: ownership
  topic: Life after delivery
  difficulty: medium
  text: "What happened to the project after you delivered it? Did you stay involved and what did you learn\
    \ from the follow-on work?"
  expected_concepts:
  - ongoing maintenance
  - feedback loops
  - fixes
  - evolution
  rubric:
    excellent: Describes continued involvement, feedback incorporated and how the work evolved.
    good: Remained loosely involved.
    weak: Does not know what happened afterwards.
  followups:
  - What was the most common request?
  - What did users complain about?
  common_errors:
  - 'Falling into the weak pattern: does not know what happened afterwards.'

- external_key: resume_screening.project_ownership.blocked_by_others
  competency_key: collaboration
  topic: External blockers
  difficulty: medium
  text: "Tell me about a time the project was blocked by something outside your control. How did you move\
    \ it forward?"
  expected_concepts:
  - identifying blockers
  - communication
  - alternatives
  - escalation
  rubric:
    excellent: Gives a real blocker, describes alternatives pursued, the people engaged and the resolution.
    good: Waited and followed up reasonably.
    weak: Waited without action or blamed others.
  followups:
  - Who could unblock it?
  - What did you do in the meantime?
  common_errors:
  - 'Falling into the weak pattern: waited without action or blamed others.'

- external_key: resume_screening.project_ownership.quality_problem_found_late
  competency_key: code_quality
  topic: Late defects
  difficulty: medium
  text: "Did you discover a quality problem late in the project? How did you handle it and what changed\
    \ after?"
  expected_concepts:
  - detection
  - impact assessment
  - fix or mitigation
  - earlier checks in the future
  rubric:
    excellent: Describes the problem, assessment of impact, fix and added checks to find such problems
      earlier.
    good: Fixed the problem and noted the lesson.
    weak: Played it down or cannot recall.
  followups:
  - Why was it not found earlier?
  - What check did you add?
  common_errors:
  - 'Falling into the weak pattern: played it down or cannot recall.'

- external_key: resume_screening.project_ownership.stakeholder_surprise
  competency_key: stakeholder_management
  topic: Unwelcome news
  difficulty: medium
  text: Describe a time you had to give stakeholders unwelcome news about the project. How did you prepare?
  expected_concepts:
  - facts first
  - options
  - timing
  - follow-up
  rubric:
    excellent: Describes preparing facts and options, delivering the news early and following through.
    good: Delivered the news with a plan.
    weak: Delayed or softened the message until it was unclear.
  followups:
  - How did they react?
  - What would you do differently?
  common_errors:
  - 'Falling into the weak pattern: delayed or softened the message until it was unclear.'

- external_key: resume_screening.project_ownership.dependencies_across_teams
  competency_key: project_management
  topic: Cross-team dependencies
  difficulty: medium
  text: Which other teams did the project depend on and how did you coordinate with them?
  expected_concepts:
  - mapping dependencies
  - agreements
  - communication cadence
  - handling conflicts
  rubric:
    excellent: Maps dependencies and describes agreements, cadence and a resolved conflict.
    good: Knew dependencies and kept in touch.
    weak: Discovered dependencies late.
  followups:
  - Which team was hardest to work with?
  - What did you agree in writing?
  common_errors:
  - 'Falling into the weak pattern: discovered dependencies late.'

- external_key: resume_screening.project_ownership.estimates_vs_actuals
  competency_key: project_management
  topic: Estimating
  difficulty: medium
  text: How did you estimate the work in the project and how did the estimates compare with what happened?
  expected_concepts:
  - estimation method
  - actual comparison
  - reasons for differences
  - improvement
  rubric:
    excellent: "Describes the method, compares actual with estimate with reasons and shows how later estimates\
      \ improved."
    good: Gave estimates and compared roughly.
    weak: Never compared the estimate with the outcome.
  followups:
  - What was most underestimated?
  - How did you add buffer?
  common_errors:
  - 'Falling into the weak pattern: never compared the estimate with the outcome.'

- external_key: resume_screening.project_ownership.weekend_or_crunch
  competency_key: project_management
  topic: Crunch periods
  difficulty: hard
  text: "Was there a period of intense effort to meet a date on the project? How did you manage the plan\
    \ and the team's capacity?"
  expected_concepts:
  - realistic planning
  - prioritisation
  - sustainable pace
  - recovery afterwards
  rubric:
    excellent: "Describes prioritisation, scope control and sharing load, then changes to avoid repeating\
      \ the crunch."
    good: Worked hard and managed some trade-offs.
    weak: Relied on long hours alone.
  followups:
  - What did you cut?
  - What would you plan differently?
  common_errors:
  - 'Falling into the weak pattern: relied on long hours alone.'

- external_key: resume_screening.project_ownership.bug_you_fixed_yourself
  competency_key: debugging
  topic: Own fix
  difficulty: easy
  text: Tell me about a difficult problem on the project that you personally diagnosed and fixed.
  expected_concepts:
  - symptoms
  - investigation steps
  - root cause
  - verification
  rubric:
    excellent: "Describes symptoms, a clear investigation, the root cause and how the fix was verified\
      \ and prevented."
    good: Describes the problem and fix with limited detail on the diagnosis.
    weak: Describes a trivial fix.
  followups:
  - What did you rule out?
  - How did you know it was fixed?
  common_errors:
  - 'Falling into the weak pattern: describes a trivial fix.'

- external_key: resume_screening.project_ownership.monitoring_what_you_built
  competency_key: observability
  topic: Monitoring and operations
  difficulty: medium
  text: "How did you know your part of the system was healthy after delivery? What did you monitor and\
    \ how were you alerted?"
  expected_concepts:
  - key indicators
  - alerts
  - dashboards
  - on-call handling
  rubric:
    excellent: Names specific indicators and alerts, how they responded and how monitoring improved.
    good: Used existing monitoring with some additions.
    weak: Had no monitoring of their part.
  followups:
  - What alert did you add after a problem?
  - Who was on call?
  common_errors:
  - 'Falling into the weak pattern: had no monitoring of their part.'

- external_key: resume_screening.project_ownership.feedback_after_release
  competency_key: product_sense
  topic: Post-release feedback
  difficulty: medium
  text: How did you gather feedback after release and what did you change in response?
  expected_concepts:
  - feedback channels
  - analysis
  - prioritising
  - closing the loop
  rubric:
    excellent: Describes channels, how feedback was prioritised and examples of changes made and communicated.
    good: Collected feedback and acted on some.
    weak: Did not collect any.
  followups:
  - What feedback surprised you?
  - What did you decide not to change?
  common_errors:
  - 'Falling into the weak pattern: did not collect any.'

- external_key: resume_screening.project_ownership.post_project_review
  competency_key: ownership
  topic: Retrospective
  difficulty: easy
  text: "Did the project have a review at the end? What was your main contribution to it and what came\
    \ out of it?"
  expected_concepts:
  - structured review
  - findings
  - actions
  - follow-through
  rubric:
    excellent: Describes the review format, their contributions and actions that were completed.
    good: Took part in a review with some actions.
    weak: No review was held.
  followups:
  - Which action mattered most?
  - Which one was ignored?
  common_errors:
  - 'Falling into the weak pattern: no review was held.'

- external_key: resume_screening.project_ownership.change_requests_late
  competency_key: project_management
  topic: Late requirements
  difficulty: medium
  text: How did you handle large change requests late in the project?
  expected_concepts:
  - impact analysis
  - tradeoffs
  - agreeing on changes
  - protecting the plan
  rubric:
    excellent: Describes assessing the impact, presenting options with costs, agreeing and adjusting the
      plan.
    good: Accommodated changes with some discussion.
    weak: Accepted everything or rejected everything.
  followups:
  - What was the biggest request?
  - How did you say yes or no?
  common_errors:
  - 'Falling into the weak pattern: accepted everything or rejected everything.'

- external_key: resume_screening.project_ownership.environment_and_release_issues
  competency_key: ci_cd
  topic: Release mechanics
  difficulty: medium
  text: What did the release process for the project look like and what did you improve about it?
  expected_concepts:
  - steps
  - automation
  - rollback
  - improvements
  rubric:
    excellent: Describes the release steps, automation, rollback and specific improvements they made.
    good: Followed the process and made minor improvements.
    weak: Cannot describe how releases worked.
  followups:
  - What was the riskiest step?
  - How often did you release?
  common_errors:
  - 'Falling into the weak pattern: cannot describe how releases worked.'

- external_key: resume_screening.project_ownership.rollback_experience
  competency_key: incident_response
  topic: Rolling back
  difficulty: hard
  text: Have you had to roll back a change on a project you owned? What triggered it and how did you decide?
  expected_concepts:
  - trigger criteria
  - decision process
  - execution
  - learning
  rubric:
    excellent: Describes the trigger, the decision and execution and the changes in practice afterwards.
    good: Rolled back with some reasoning.
    weak: Never considered rollback.
  followups:
  - Who made the call?
  - How long did it take?
  common_errors:
  - 'Falling into the weak pattern: never considered rollback.'

- external_key: resume_screening.project_ownership.work_you_inherited
  competency_key: adaptability
  topic: Inherited work
  difficulty: medium
  text: Was any part of the project inherited from someone else? How did you take ownership of it?
  expected_concepts:
  - understanding existing work
  - asking the previous owner
  - documenting
  - improving
  rubric:
    excellent: Describes steps to understand the work, talks with the previous owner and improvements
      made.
    good: Took over and learned along the way.
    weak: Left the inherited parts untouched.
  followups:
  - What surprised you in it?
  - What did you rewrite?
  common_errors:
  - 'Falling into the weak pattern: left the inherited parts untouched.'

- external_key: resume_screening.project_ownership.hardest_week
  competency_key: ownership
  topic: Peak difficulty
  difficulty: medium
  text: What was the most difficult week on the project and what did you do to get through it?
  expected_concepts:
  - priorities
  - communication
  - asking for help
  - outcome
  rubric:
    excellent: Describes the situation, how they prioritised, communicated and asked for help and what
      resulted.
    good: Describes the week and what they did.
    weak: Cannot describe the pressure or response.
  followups:
  - What would have helped?
  - What did you stop doing?
  common_errors:
  - 'Falling into the weak pattern: cannot describe the pressure or response.'

- external_key: resume_screening.project_ownership.cost_overrun
  competency_key: project_management
  topic: Budget problems
  difficulty: hard
  text: If the project ever exceeded its budget or effort estimate, what caused it and how did you respond?
  expected_concepts:
  - cause analysis
  - communication
  - corrective action
  - prevention
  rubric:
    excellent: Explains the cause, openly communicates, takes corrective action and changes how estimates
      are made.
    good: Describes the overrun and a response.
    weak: Claims no overrun or blames others.
  followups:
  - When did you raise it?
  - What did you learn?
  common_errors:
  - 'Falling into the weak pattern: claims no overrun or blames others.'

- external_key: resume_screening.project_ownership.lessons_for_next_project
  competency_key: adaptability
  topic: Carrying lessons forward
  difficulty: easy
  text: What did you do differently on the next project because of this one?
  expected_concepts:
  - specific changes
  - evidence in later work
  - sharing lessons
  - ongoing habits
  rubric:
    excellent: Names specific practices changed and how the next project benefited, plus lessons shared.
    good: Names a general lesson and one change.
    weak: Cannot name anything changed.
  followups:
  - Did you share it with others?
  - What still goes wrong?
  common_errors:
  - 'Falling into the weak pattern: cannot name anything changed.'

- external_key: resume_screening.project_ownership.user_adoption_effort
  competency_key: product_sense
  topic: Getting it adopted
  difficulty: medium
  text: How did you help people start using what the project delivered?
  expected_concepts:
  - communication
  - training
  - documentation
  - support
  rubric:
    excellent: Describes concrete adoption steps, support and how they measured uptake.
    good: Told users and provided some documentation.
    weak: Assumed users would find it.
  followups:
  - Who was slowest to adopt?
  - What blocked adoption?
  common_errors:
  - 'Falling into the weak pattern: assumed users would find it.'

- external_key: resume_screening.project_ownership.team_morale_during_delays
  competency_key: leadership
  topic: Team during difficulty
  difficulty: hard
  text: When the project hit difficulties, how did you help the people working on it stay productive?
  expected_concepts:
  - clear priorities
  - removing blockers
  - recognising progress
  - transparent communication
  rubric:
    excellent: Describes concrete steps such as clarifying priorities, removing blockers and sharing context.
    good: Supported the team informally.
    weak: Left the team to cope without support.
  followups:
  - What did people need most?
  - What would you do earlier?
  common_errors:
  - 'Falling into the weak pattern: left the team to cope without support.'

- external_key: resume_screening.project_ownership.scope_creep_control
  competency_key: project_management
  topic: Scope growth
  difficulty: medium
  text: "How did you keep the project's scope from growing without limit, and what was an example where\
    \ you had to hold the line?"
  expected_concepts:
  - baseline scope
  - change control
  - communicating trade-offs
  - examples
  rubric:
    excellent: "Describes a baseline scope, a lightweight change process and a concrete example where\
      \ they held the line with reasons."
    good: Managed scope informally with some discussions.
    weak: Scope grew without control.
  followups:
  - Who pushed hardest?
  - What was the compromise?
  common_errors:
  - 'Falling into the weak pattern: scope grew without control.'
