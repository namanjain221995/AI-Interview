# Curated questions: resume screening, certifications_learning. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.certifications_learning.learning_plan_structure
  competency_key: adaptability
  topic: Structuring a learning plan
  difficulty: easy
  text: When you set out to learn something substantial for work, how do you structure your learning plan?
  expected_concepts:
  - clear goal
  - resources
  - practice milestones
  - review
  rubric:
    excellent: "Describes a plan with a concrete goal, chosen resources, hands-on milestones and review,\
      \ with a real example."
    good: Describes a loose plan with some milestones.
    weak: Learns ad hoc with no structure.
  followups:
  - How do you know the goal is met?
  - What do you adjust midway?
  common_errors:
  - Collecting courses without applying any of them.

- external_key: resume_screening.certifications_learning.worth_the_effort_judgement
  competency_key: problem_solving
  topic: Weighing the value of training
  difficulty: medium
  text: How do you judge whether a certification or course is worth the effort for your role?
  expected_concepts:
  - relevance
  - content quality
  - evidence of use
  - opportunity cost
  rubric:
    excellent: "Describes criteria such as relevance and practical content, and gives an example of a\
      \ choice including what they declined."
    good: Judges by topic and reputation.
    weak: Takes whatever is available.
  followups:
  - Which one did you decline?
  - How did you check its quality?
  common_errors:
  - 'Falling into the weak pattern: takes whatever is available.'

- external_key: resume_screening.certifications_learning.credential_vs_experience
  competency_key: communication
  topic: Balancing credentials and experience
  difficulty: medium
  text: How do you view the relationship between credentials and hands-on experience in your field?
  expected_concepts:
  - complementary roles
  - evidence of each
  - limits
  - examples
  rubric:
    excellent: Gives a balanced view with examples where each mattered and what evidence they would trust.
    good: Gives a general view.
    weak: Dismisses one entirely.
  followups:
  - Where did experience beat the credential?
  - Where did the credential help?
  common_errors:
  - 'Falling into the weak pattern: dismisses one entirely.'

- external_key: resume_screening.certifications_learning.proof_of_hands_on_skill
  competency_key: testing
  topic: Demonstrating applied skill
  difficulty: medium
  text: "If I asked you to demonstrate the skill behind a credential right now, what small task would\
    \ you choose and how would you do it?"
  expected_concepts:
  - choosing a suitable task
  - steps
  - verification
  - explanation of choices
  rubric:
    excellent: Chooses a suitable task, works through it logically, verifies it and explains choices.
    good: Chooses a task with an outline.
    weak: Cannot suggest a task.
  followups:
  - What would you check at the end?
  - What might go wrong?
  common_errors:
  - 'Falling into the weak pattern: cannot suggest a task.'

- external_key: resume_screening.certifications_learning.learning_from_failed_attempt
  competency_key: adaptability
  topic: Setbacks in learning
  difficulty: medium
  text: Tell me about a learning effort that did not go as planned. What did you change?
  expected_concepts:
  - what went wrong
  - analysis
  - adjustment
  - outcome
  rubric:
    excellent: Describes a real setback, the analysis, the adjustment and the eventual result.
    good: Describes a minor setback and a fix.
    weak: Says everything went as planned.
  followups:
  - What did you try next?
  - What would you do differently?
  common_errors:
  - 'Falling into the weak pattern: says everything went as planned.'

- external_key: resume_screening.certifications_learning.making_learning_part_of_workweek
  competency_key: ownership
  topic: Routine for learning
  difficulty: easy
  text: How do you fit learning into your regular work routine?
  expected_concepts:
  - protected time
  - integrating with tasks
  - consistency
  - sharing
  rubric:
    excellent: Describes a repeatable routine, ways of learning through tasks and a way to sustain it.
    good: Learns when time allows.
    weak: Does not make time.
  followups:
  - What gets in the way?
  - What works best for you?
  common_errors:
  - 'Falling into the weak pattern: does not make time.'

- external_key: resume_screening.certifications_learning.sharing_learning_regularly
  competency_key: collaboration
  topic: Team learning habits
  difficulty: medium
  text: What habits does your team have for sharing what people learn, and which did you start or improve?
  expected_concepts:
  - sharing formats
  - frequency
  - participation
  - value
  rubric:
    excellent: Describes team practices and their own contributions with evidence of value.
    good: Takes part in sharing.
    weak: Team has no sharing.
  followups:
  - What format worked best?
  - What fell flat?
  common_errors:
  - 'Falling into the weak pattern: team has no sharing.'

- external_key: resume_screening.certifications_learning.mentor_or_coach_use
  competency_key: mentoring
  topic: Learning from guidance
  difficulty: easy
  text: "Have you used a mentor, coach or senior colleague to speed your learning? How did you make the\
    \ most of it?"
  expected_concepts:
  - choosing guidance
  - preparing
  - acting on advice
  - thanks and follow-up
  rubric:
    excellent: Describes how they prepared for sessions, acted on advice and reported back on results.
    good: Received guidance when offered.
    weak: Has not sought guidance.
  followups:
  - What advice changed your work?
  - What did you ask them?
  common_errors:
  - 'Falling into the weak pattern: has not sought guidance.'

- external_key: resume_screening.certifications_learning.evaluating_training_claims
  competency_key: problem_solving
  topic: Judging learning resources
  difficulty: hard
  text: How do you tell a high-quality technical course or article from a weak one?
  expected_concepts:
  - author evidence
  - accuracy checks
  - practical exercises
  - currency
  rubric:
    excellent: Describes specific checks such as verifying claims in practice, exercises and cross-referencing.
    good: Uses ratings and popularity.
    weak: Trusts any material.
  followups:
  - How do you verify a claim?
  - What red flags do you look for?
  common_errors:
  - 'Falling into the weak pattern: trusts any material.'

- external_key: resume_screening.certifications_learning.applying_learning_to_new_context
  competency_key: adaptability
  topic: Adapting what you learned
  difficulty: medium
  text: Describe a time knowledge from one area helped you in a quite different area of your work.
  expected_concepts:
  - abstracting principle
  - mapping
  - adapting
  - result
  rubric:
    excellent: Describes the principle, how it was mapped to the new area and the result.
    good: Describes a loose connection.
    weak: Cannot give an example.
  followups:
  - What differed?
  - What did you have to unlearn?
  common_errors:
  - 'Falling into the weak pattern: cannot give an example.'

- external_key: resume_screening.certifications_learning.keeping_credentials_meaningful
  competency_key: ownership
  topic: Keeping skills real
  difficulty: medium
  text: How do you make sure that a credential you hold still reflects what you can actually do?
  expected_concepts:
  - practice
  - applying
  - updating knowledge
  - self-testing
  rubric:
    excellent: Describes regular practice, application on projects and self-testing as the field changes.
    good: Reviews material occasionally.
    weak: Assumes the credential is enough.
  followups:
  - What do you practise?
  - What has changed in your field?
  common_errors:
  - 'Falling into the weak pattern: assumes the credential is enough.'

- external_key: resume_screening.certifications_learning.teaching_a_team_a_new_skill
  competency_key: leadership
  topic: Raising team skills
  difficulty: hard
  text: "Imagine your team needs a new skill quickly. How would you organise the learning, using your\
    \ own experience as a guide?"
  expected_concepts:
  - assess starting point
  - resources
  - practice on real tasks
  - checkpoints
  rubric:
    excellent: "Describes assessing the team's starting point, choosing resources, practising on real\
      \ tasks and checking progress."
    good: Suggests training and practice.
    weak: Expects people to learn individually.
  followups:
  - How would you handle uneven progress?
  - What would you measure?
  common_errors:
  - 'Falling into the weak pattern: expects people to learn individually.'

- external_key: resume_screening.certifications_learning.balancing_theory_and_practice
  competency_key: problem_solving
  topic: Theory versus practice
  difficulty: easy
  text: How do you balance reading and studying with hands-on practice when learning?
  expected_concepts:
  - ratio
  - feedback
  - deliberate practice
  - reflection
  rubric:
    excellent: Describes a deliberate mix with practice feedback and reflection, with an example.
    good: Does both without a plan.
    weak: Does only one.
  followups:
  - Which gives you more?
  - What do you do after practice?
  common_errors:
  - 'Falling into the weak pattern: does only one.'

- external_key: resume_screening.certifications_learning.community_and_events
  competency_key: collaboration
  topic: Wider community
  difficulty: easy
  text: How have you used professional communities, meetups or conferences to learn?
  expected_concepts:
  - participation
  - takeaways
  - applying
  - contributing
  rubric:
    excellent: Describes specific events or communities, what they took away and applied and what they
      contributed.
    good: Attended occasionally.
    weak: Does not engage.
  followups:
  - What did you bring back?
  - What did you share?
  common_errors:
  - 'Falling into the weak pattern: does not engage.'

- external_key: resume_screening.certifications_learning.reading_code_to_learn
  competency_key: code_quality
  topic: Learning from source
  difficulty: medium
  text: How do you learn from reading other people's code, configurations or designs?
  expected_concepts:
  - choosing material
  - tracing
  - note-taking
  - applying
  rubric:
    excellent: Describes choosing good examples, tracing behaviour and applying patterns in their own
      work.
    good: Reads code when needed.
    weak: Rarely reads others' work.
  followups:
  - Whose work taught you the most?
  - What did you copy and adapt?
  common_errors:
  - 'Falling into the weak pattern: rarely reads others'' work.'

- external_key: resume_screening.certifications_learning.learning_from_incidents
  competency_key: incident_response
  topic: Learning from outages
  difficulty: medium
  text: What have you learned from incidents or outages that you could not have learned in a course?
  expected_concepts:
  - real-world complexity
  - specific lessons
  - changes
  - sharing
  rubric:
    excellent: Gives specific lessons, the changes they led to and how they were shared.
    good: Gives general lessons.
    weak: Cannot name any.
  followups:
  - What did you change afterwards?
  - What did you share?
  common_errors:
  - 'Falling into the weak pattern: cannot name any.'

- external_key: resume_screening.certifications_learning.measuring_learning_impact
  competency_key: data_analysis
  topic: Evidence that learning worked
  difficulty: hard
  text: How would you measure whether a training investment improved your team's work?
  expected_concepts:
  - baseline
  - indicators
  - before and after
  - caveats
  rubric:
    excellent: Defines a baseline, chooses indicators tied to the work and notes caveats such as other
      changes.
    good: Suggests feedback and observation.
    weak: Measures attendance only.
  followups:
  - What indicator would you pick?
  - What else could explain a change?
  common_errors:
  - 'Falling into the weak pattern: measures attendance only.'

- external_key: resume_screening.certifications_learning.unlearning_old_habits
  competency_key: adaptability
  topic: Letting go of old practice
  difficulty: medium
  text: What practice did you have to unlearn when your field changed, and how did you do it?
  expected_concepts:
  - recognising outdated practice
  - evidence
  - replacement
  - consistency
  rubric:
    excellent: Describes a specific outdated practice, evidence that prompted change and how they replaced
      it.
    good: Describes a change in general.
    weak: Cannot name one.
  followups:
  - What made you realise?
  - How did you help others change?
  common_errors:
  - 'Falling into the weak pattern: cannot name one.'

- external_key: resume_screening.certifications_learning.asking_questions_of_experts
  competency_key: communication
  topic: Using experts well
  difficulty: easy
  text: How do you ask experts for help so that you learn and respect their time?
  expected_concepts:
  - preparation
  - clear question
  - what was tried
  - following up
  rubric:
    excellent: Describes preparing a clear question with what they tried, and following up with results.
    good: Asks when stuck.
    weak: Asks without preparation.
  followups:
  - Show me a good question you asked.
  - How did you thank them?
  common_errors:
  - 'Falling into the weak pattern: asks without preparation.'

- external_key: resume_screening.certifications_learning.learning_by_documenting
  competency_key: communication
  topic: Writing to learn
  difficulty: medium
  text: How does writing documentation or guides help you learn, and what have you written?
  expected_concepts:
  - writing as learning
  - specific documents
  - reuse
  - feedback
  rubric:
    excellent: Describes specific documents, what writing taught them and how others used them.
    good: Wrote some notes.
    weak: Does not write.
  followups:
  - Which document is used most?
  - What did readers correct?
  common_errors:
  - 'Falling into the weak pattern: does not write.'

- external_key: resume_screening.certifications_learning.limits_of_self_study
  competency_key: adaptability
  topic: When to get formal help
  difficulty: medium
  text: When do you find self-study is not enough, and what do you do then?
  expected_concepts:
  - recognising limits
  - seeking structured help
  - experts
  - feedback
  rubric:
    excellent: Describes signals that self-study is insufficient and the actions they take with an example.
    good: Seeks help when stuck.
    weak: Never seeks help.
  followups:
  - What signals do you watch for?
  - What did you do in that case?
  common_errors:
  - 'Falling into the weak pattern: never seeks help.'

- external_key: resume_screening.certifications_learning.applying_a_framework_you_learned
  competency_key: problem_solving
  topic: Using a framework
  difficulty: medium
  text: "Describe a framework or method you learned and how you adapted it to your team rather than applying\
    \ it by the book."
  expected_concepts:
  - understanding the intent
  - adaptation
  - results
  - review
  rubric:
    excellent: Describes the framework's intent, what they adapted and why, and the results.
    good: Applied it with minor changes.
    weak: Applied it rigidly or dropped it.
  followups:
  - What did you drop?
  - How did you decide?
  common_errors:
  - 'Falling into the weak pattern: applied it rigidly or dropped it.'

- external_key: resume_screening.certifications_learning.role_of_curiosity_in_work
  competency_key: motivation
  topic: Curiosity at work
  difficulty: easy
  text: "Tell me about something you looked into at work purely because you wanted to understand it better.\
    \ What did it lead to?"
  expected_concepts:
  - following a question
  - method
  - discovery
  - value
  rubric:
    excellent: Describes the question, how they investigated, what they found and its value to the team.
    good: Describes a small investigation.
    weak: Cannot give an example.
  followups:
  - What surprised you?
  - Who did you tell?
  common_errors:
  - 'Falling into the weak pattern: cannot give an example.'

- external_key: resume_screening.certifications_learning.next_learning_goal_for_role
  competency_key: motivation
  topic: What you will learn here
  difficulty: easy
  text: Based on the work in this role, what would you want to learn first and how would you go about
    it?
  expected_concepts:
  - reading the role
  - priority
  - method
  - early application
  rubric:
    excellent: Names a specific priority tied to the role, a concrete method and how they would apply
      it early.
    good: Names a general area.
    weak: Has no plan.
  followups:
  - How would you show progress?
  - Who would you ask?
  common_errors:
  - 'Falling into the weak pattern: has no plan.'

- external_key: resume_screening.certifications_learning.certification_prep_ethics
  competency_key: culture_values
  topic: Fair preparation
  difficulty: hard
  text: "Some people use leaked exam questions or shortcuts to pass certifications. How do you think about\
    \ preparing in a way that makes the credential meaningful?"
  expected_concepts:
  - purpose of credentials
  - learning versus memorising
  - integrity of the process
  - value to employers
  rubric:
    excellent: "Explains why genuine learning matters, describes their own approach and the effect on\
      \ trust in credentials."
    good: Says shortcuts are wrong and gives a general reason.
    weak: Sees shortcuts as acceptable.
  followups:
  - How would you respond if a colleague did that?
  - What does a credential promise an employer?
  common_errors:
  - 'Falling into the weak pattern: sees shortcuts as acceptable.'
