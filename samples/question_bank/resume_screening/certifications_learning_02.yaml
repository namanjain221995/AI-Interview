# Curated questions: resume screening, certifications_learning. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.certifications_learning.course_that_changed_work
  competency_key: adaptability
  topic: A course that mattered
  difficulty: easy
  text: Which course or programme listed on your resume changed how you work, and in what way?
  expected_concepts:
  - specific course
  - content
  - change in practice
  - evidence
  rubric:
    excellent: Names the course, describes specific content and gives evidence of a change in their work.
    good: Names a course with a general effect.
    weak: Cannot say how it affected their work.
  followups:
  - What did you do differently afterwards?
  - Who noticed the change?
  common_errors:
  - Naming a course without any account of what changed.

- external_key: resume_screening.certifications_learning.degree_subject_used_at_work
  competency_key: problem_solving
  topic: Education applied
  difficulty: easy
  text: Which subjects from your formal education do you use most in your work, and how?
  expected_concepts:
  - specific subjects
  - examples of application
  - depth
  - limits
  rubric:
    excellent: Names subjects and gives concrete examples of using them in work, with their limits.
    good: Names subjects with general use.
    weak: Sees no link between education and work.
  followups:
  - Which subject surprised you by being useful?
  - Which one do you wish you had studied more?
  common_errors:
  - 'Falling into the weak pattern: sees no link between education and work.'

- external_key: resume_screening.certifications_learning.final_project_or_thesis
  competency_key: ownership
  topic: Capstone or thesis work
  difficulty: medium
  text: "Tell me about a final project, thesis or capstone listed on your resume. What problem did you\
    \ tackle and what did you build or find?"
  expected_concepts:
  - problem statement
  - method
  - own contribution
  - result and learning
  rubric:
    excellent: "States the problem, method, their own contribution and result clearly and links the learning\
      \ to later work."
    good: Describes the project with limited detail on method.
    weak: Cannot explain the project or their part.
  followups:
  - What was the hardest decision?
  - What would you do differently?
  common_errors:
  - 'Falling into the weak pattern: cannot explain the project or their part.'

- external_key: resume_screening.certifications_learning.coursework_to_practice
  competency_key: problem_solving
  topic: Theory into practice
  difficulty: medium
  text: "Give an example of something you first learned in coursework and later had to apply in a real\
    \ project."
  expected_concepts:
  - the concept
  - the project
  - adaptation needed
  - result
  rubric:
    excellent: Describes the concept, the real context, the adaptations needed and the result.
    good: Describes an application with general detail.
    weak: Cannot give an example.
  followups:
  - What did not translate?
  - What did you have to add?
  common_errors:
  - 'Falling into the weak pattern: cannot give an example.'

- external_key: resume_screening.certifications_learning.online_courses_selection
  competency_key: motivation
  topic: Choosing learning resources
  difficulty: easy
  text: How do you choose which online courses or programmes are worth your effort?
  expected_concepts:
  - relevance
  - quality signals
  - practical content
  - follow-through
  rubric:
    excellent: Describes clear criteria such as relevance, hands-on content and reviews, and gives an
      example.
    good: Chooses by topic and popularity.
    weak: Chooses at random.
  followups:
  - What makes a course poor?
  - What did you drop?
  common_errors:
  - 'Falling into the weak pattern: chooses at random.'

- external_key: resume_screening.certifications_learning.completion_and_application
  competency_key: ownership
  topic: Following through on learning
  difficulty: medium
  text: How do you make sure that something you learn in a course ends up used at work?
  expected_concepts:
  - planning application
  - small projects
  - sharing
  - review
  rubric:
    excellent: Describes a deliberate way of applying lessons, such as a small project, and gives an example.
    good: Applies when an opportunity arises.
    weak: Learning stays theoretical.
  followups:
  - Which lesson did you apply first?
  - What did you not manage to use?
  common_errors:
  - 'Falling into the weak pattern: learning stays theoretical.'

- external_key: resume_screening.certifications_learning.learning_by_building
  competency_key: problem_solving
  topic: Projects as learning
  difficulty: medium
  text: What have you built to teach yourself something listed on your resume?
  expected_concepts:
  - project
  - goals
  - challenges
  - learning
  rubric:
    excellent: Describes a project, the goal, the challenges and the specific things learned.
    good: Describes a small project.
    weak: Has not built anything.
  followups:
  - What broke?
  - What would you extend?
  common_errors:
  - 'Falling into the weak pattern: has not built anything.'

- external_key: resume_screening.certifications_learning.bootcamp_or_intensive
  competency_key: adaptability
  topic: Intensive programmes
  difficulty: medium
  text: "If you took an intensive programme, what did it give you that you could use immediately in a\
    \ job, and what did you have to learn afterwards?"
  expected_concepts:
  - immediate skills
  - gaps in preparation
  - self-study
  - application
  rubric:
    excellent: Distinguishes what the programme taught from what they learned on the job, with examples.
    good: Describes the benefits in general.
    weak: Treats the programme as complete preparation.
  followups:
  - What was hardest to pick up on the job?
  - What would you add to the programme?
  common_errors:
  - 'Falling into the weak pattern: treats the programme as complete preparation.'

- external_key: resume_screening.certifications_learning.internal_training
  competency_key: collaboration
  topic: Training at work
  difficulty: easy
  text: What training programmes at work have you completed, and which of them changed how you do your
    job?
  expected_concepts:
  - programmes
  - relevance
  - practice
  - sharing
  rubric:
    excellent: Names programmes, describes the change in practice and examples of use.
    good: Names programmes with general benefits.
    weak: Treats training as a formality.
  followups:
  - Which was most useful?
  - What would you add?
  common_errors:
  - 'Falling into the weak pattern: treats training as a formality.'

- external_key: resume_screening.certifications_learning.research_or_reading
  competency_key: problem_solving
  topic: Reading and research
  difficulty: medium
  text: "What have you read or researched, such as papers, books or specifications, that influenced a\
    \ decision you made at work?"
  expected_concepts:
  - source
  - relevance
  - decision
  - outcome
  rubric:
    excellent: Names a source, explains the key idea and how it shaped a specific decision.
    good: Names a source with a general effect.
    weak: Cannot name any.
  followups:
  - What was the key idea?
  - What did you disagree with?
  common_errors:
  - 'Falling into the weak pattern: cannot name any.'

- external_key: resume_screening.certifications_learning.math_or_science_foundation
  competency_key: data_analysis
  topic: Underlying foundations
  difficulty: medium
  text: "Which foundational subjects, such as mathematics, statistics or networks, support your work,\
    \ and where do they show up?"
  expected_concepts:
  - foundations
  - examples
  - depth
  - limits
  rubric:
    excellent: Names foundations with concrete work examples and clear limits of depth.
    good: Names foundations with general links.
    weak: Does not connect foundations to work.
  followups:
  - Where did you get stuck without it?
  - What would you refresh?
  common_errors:
  - 'Falling into the weak pattern: does not connect foundations to work.'

- external_key: resume_screening.certifications_learning.language_or_tool_course_use
  competency_key: code_quality
  topic: Language or tool course
  difficulty: easy
  text: "If you took a course in a programming language or tool, what are you now able to do that you\
    \ could not do before?"
  expected_concepts:
  - specific capabilities
  - projects
  - confidence in use
  - limits
  rubric:
    excellent: Lists specific capabilities with examples of work built on them.
    good: Lists general capabilities.
    weak: Cannot name capabilities.
  followups:
  - What did you build?
  - Where do you still need help?
  common_errors:
  - 'Falling into the weak pattern: cannot name capabilities.'

- external_key: resume_screening.certifications_learning.capstone_team_role
  competency_key: collaboration
  topic: Team project in education
  difficulty: medium
  text: "In a team project during your education or training, what was your role and how did the team\
    \ decide who did what?"
  expected_concepts:
  - role
  - planning
  - coordination
  - result
  rubric:
    excellent: Describes their role, how responsibilities were agreed and how the team coordinated and
      delivered.
    good: Describes the role generally.
    weak: Describes the project without any role.
  followups:
  - What was the biggest disagreement?
  - What did you learn about teamwork?
  common_errors:
  - 'Falling into the weak pattern: describes the project without any role.'

- external_key: resume_screening.certifications_learning.teaching_others_what_you_learned
  competency_key: mentoring
  topic: Teaching
  difficulty: medium
  text: "Have you taught or tutored others in something you learned formally? How did it affect your own\
    \ understanding?"
  expected_concepts:
  - teaching experience
  - method
  - effect on understanding
  - lessons
  rubric:
    excellent: Describes teaching, the methods used and how it deepened their own understanding.
    good: Helped others informally.
    weak: Has not taught.
  followups:
  - What question stumped you?
  - What did you change in your explanation?
  common_errors:
  - 'Falling into the weak pattern: has not taught.'

- external_key: resume_screening.certifications_learning.evidence_of_skill_beyond_credential
  competency_key: communication
  topic: Backing up a credential
  difficulty: medium
  text: "Beyond the name of a course or certification, what work could you show that proves you can do\
    \ what it covers?"
  expected_concepts:
  - work samples
  - projects
  - results
  - relevance
  rubric:
    excellent: Names concrete work that demonstrates the skills and explains what it shows.
    good: Names work with limited relevance.
    weak: Has no work to show.
  followups:
  - Which piece is strongest?
  - What can you share with us?
  common_errors:
  - 'Falling into the weak pattern: has no work to show.'

- external_key: resume_screening.certifications_learning.concept_from_learning_you_misapplied
  competency_key: adaptability
  topic: A concept used wrongly
  difficulty: hard
  text: "Tell me about a time you applied something you learned in a course or certification in the wrong\
    \ context. What happened?"
  expected_concepts:
  - the concept
  - misapplication
  - detection
  - correction
  rubric:
    excellent: Describes the concept, how and why it did not fit, how they noticed and what they changed.
    good: Describes a minor misapplication.
    weak: Cannot recall any.
  followups:
  - How did you notice?
  - What do you check now?
  common_errors:
  - 'Falling into the weak pattern: cannot recall any.'

- external_key: resume_screening.certifications_learning.keeping_skills_current
  competency_key: adaptability
  topic: Staying up to date
  difficulty: easy
  text: How do you keep your knowledge of your main area current after finishing a course or certification?
  expected_concepts:
  - ongoing learning
  - sources
  - practice
  - applying
  rubric:
    excellent: Describes a repeated routine of sources and practice with examples of applying what they
      learned.
    good: Reads and tries things occasionally.
    weak: Stops learning after completing courses.
  followups:
  - What source is most reliable?
  - How do you apply it?
  common_errors:
  - 'Falling into the weak pattern: stops learning after completing courses.'

- external_key: resume_screening.certifications_learning.picking_what_to_learn_next
  competency_key: motivation
  topic: Next learning target
  difficulty: medium
  text: How do you decide what to learn next to be more effective in your work?
  expected_concepts:
  - identifying needs
  - feedback
  - goals
  - plan
  rubric:
    excellent: Describes using work needs and feedback to select learning, with a concrete plan.
    good: Picks topics by interest.
    weak: Has no process.
  followups:
  - What is on your list now?
  - What have you decided to skip?
  common_errors:
  - 'Falling into the weak pattern: has no process.'

- external_key: resume_screening.certifications_learning.practice_exercises_you_set
  competency_key: testing
  topic: Self-set exercises
  difficulty: easy
  text: What practice exercises do you set yourself to make learning stick?
  expected_concepts:
  - exercises
  - frequency
  - difficulty
  - review
  rubric:
    excellent: Describes specific exercises, how they progress them and review results.
    good: Does some practice.
    weak: Does not practise.
  followups:
  - Which exercise worked best?
  - How do you pick the difficulty?
  common_errors:
  - 'Falling into the weak pattern: does not practise.'

- external_key: resume_screening.certifications_learning.learning_with_others
  competency_key: collaboration
  topic: Learning together
  difficulty: easy
  text: Have you learned in a group, such as a study group or community, and what did you gain from it?
  expected_concepts:
  - group setting
  - contribution
  - benefits
  - follow-up
  rubric:
    excellent: Describes a group, what they contributed and what they learned that they used afterwards.
    good: Took part in a group occasionally.
    weak: Prefers to learn alone with no experience of groups.
  followups:
  - What did you teach the group?
  - Who challenged you?
  common_errors:
  - 'Falling into the weak pattern: prefers to learn alone with no experience of groups.'

- external_key: resume_screening.certifications_learning.using_vendor_documentation_labs
  competency_key: cloud_cost_optimization
  topic: Official labs and docs
  difficulty: medium
  text: "How have you used official vendor labs or documentation to learn something and then use it in\
    \ production?"
  expected_concepts:
  - using labs
  - verifying in safe environments
  - moving to production
  - caution
  rubric:
    excellent: Describes learning in a safe environment, verifying behaviour and a careful move to production.
    good: Followed documentation directly.
    weak: Copied examples into production.
  followups:
  - What did you check first?
  - What differed in production?
  common_errors:
  - 'Falling into the weak pattern: copied examples into production.'

- external_key: resume_screening.certifications_learning.feedback_on_your_learning
  competency_key: adaptability
  topic: Testing what you know
  difficulty: medium
  text: How do you find out whether you have really understood something you have learned?
  expected_concepts:
  - self-testing
  - teaching
  - applying
  - feedback
  rubric:
    excellent: Describes concrete checks such as teaching or building and responding to feedback.
    good: Takes quizzes or reviews notes.
    weak: Assumes understanding after completing material.
  followups:
  - When did a check show you were wrong?
  - Who gives you feedback?
  common_errors:
  - 'Falling into the weak pattern: assumes understanding after completing material.'

- external_key: resume_screening.certifications_learning.cert_requirements_vs_job_needs
  competency_key: stakeholder_management
  topic: Credential requirements
  difficulty: medium
  text: "When a role or customer asks for a credential, how do you decide whether it is needed or whether\
    \ other evidence is enough?"
  expected_concepts:
  - understanding the requirement
  - evidence alternatives
  - communication
  - pragmatism
  rubric:
    excellent: Explains the underlying need, considers alternatives and communicates a reasoned approach.
    good: Follows the requirement.
    weak: Treats credentials as the only evidence.
  followups:
  - What would you accept as evidence?
  - How would you raise it?
  common_errors:
  - 'Falling into the weak pattern: treats credentials as the only evidence.'

- external_key: resume_screening.certifications_learning.learning_leading_to_promotion_or_change
  competency_key: ownership
  topic: Learning leading to opportunity
  difficulty: medium
  text: Describe a case where something you learned formally opened a new responsibility for you at work.
  expected_concepts:
  - learning
  - opportunity
  - actions
  - result
  rubric:
    excellent: Describes the learning, how it led to the responsibility and the result.
    good: Describes a loose connection.
    weak: Cannot give a case.
  followups:
  - Who noticed?
  - What did you deliver?
  common_errors:
  - 'Falling into the weak pattern: cannot give a case.'

- external_key: resume_screening.certifications_learning.gaps_found_by_work_then_filled
  competency_key: adaptability
  topic: Learning prompted by work
  difficulty: medium
  text: "Tell me about a time your work showed you needed to learn something specific, and how you went\
    \ about learning it."
  expected_concepts:
  - recognising the need
  - choosing resources
  - practice
  - application
  rubric:
    excellent: "Describes how the need was recognised, how they chose and used resources and how they\
      \ applied the learning."
    good: Learned what was needed with some planning.
    weak: Avoided the topic or relied on others.
  followups:
  - What resource helped most?
  - How did you check you had learned it?
  common_errors:
  - 'Falling into the weak pattern: avoided the topic or relied on others.'
