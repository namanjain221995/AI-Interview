# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [data, data_analyst, data_scientist, ml, llm]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.data_ai_claims.customer_segmentation_use
    competency_key: data_analysis
    topic: "Segmentation work"
    difficulty: easy
    text: "You segmented customers or users. How did the segments get used, and how did you check they were stable and meaningful?"
    expected_concepts:
      - "method and features"
      - "stability over time"
      - "naming and communication"
      - "actions taken"
      - "value"
    rubric:
      excellent: "Explains method, tests stability, and shows teams acting on the segments."
      good: "Describes segments and some use."
      weak: "Produced clusters that nobody used."
    followups:
      - "How many segments and why?"
      - "What did marketing or product do with them?"
    common_errors:
      - "Produced clusters that nobody used."

  - external_key: resume_screening.data_ai_claims.recommendation_system_impact
    competency_key: machine_learning
    topic: "Recommendations or ranking"
    difficulty: medium
    text: "You built recommendations or ranking. How did you measure whether users were better served, beyond clicks?"
    expected_concepts:
      - "offline metrics"
      - "online experiments"
      - "longer-term outcomes"
      - "feedback loops"
      - "diversity"
    rubric:
      excellent: "Combines offline and online measures, looks at long-term effects and feedback loops."
      good: "Describes metrics."
      weak: "Optimised clicks only."
    followups:
      - "What did the click metric hide?"
      - "How did you handle new items?"
    common_errors:
      - "Optimised clicks only."

  - external_key: resume_screening.data_ai_claims.anomaly_detection_alerts
    competency_key: machine_learning
    topic: "Anomaly detection"
    difficulty: medium
    text: "You built anomaly detection. How did you handle false alarms, and who acted on the alerts?"
    expected_concepts:
      - "baseline and seasonality"
      - "thresholds"
      - "precision tracking"
      - "owners and runbooks"
      - "feedback loop"
    rubric:
      excellent: "Handles seasonality, tracks precision, has owners for alerts and improves from feedback."
      good: "Describes detection and some tuning."
      weak: "Alerts nobody investigated."
    followups:
      - "What share of alerts were useful?"
      - "How was feedback captured?"
    common_errors:
      - "Alerts nobody investigated."

  - external_key: resume_screening.data_ai_claims.nlp_text_classification
    competency_key: machine_learning
    topic: "Text or document models"
    difficulty: medium
    text: "You built a text classification or extraction system. What categories of documents did it get wrong and what did you do about them?"
    expected_concepts:
      - "error analysis by category"
      - "data additions"
      - "confidence thresholds"
      - "human review path"
      - "monitoring"
    rubric:
      excellent: "Performs error analysis, adds data or rules, uses confidence thresholds with human review."
      good: "Describes accuracy and errors."
      weak: "Reports one accuracy number."
    followups:
      - "What was the most confusing class?"
      - "How did human review work?"
    common_errors:
      - "Reports one accuracy number."

  - external_key: resume_screening.data_ai_claims.computer_vision_deployment
    competency_key: machine_learning
    topic: "Vision or sensor models"
    difficulty: medium
    text: "You deployed a vision or sensor-based model. How did real-world conditions differ from your training data?"
    expected_concepts:
      - "data gaps"
      - "augmentation"
      - "field testing"
      - "failure cases"
      - "monitoring"
    rubric:
      excellent: "Identifies real-world differences, tests in the field and adds data for failure cases."
      good: "Describes deployment."
      weak: "Assumed test set reflected reality."
    followups:
      - "What condition broke it?"
      - "How did you collect more data?"
    common_errors:
      - "Assumed test set reflected reality."

  - external_key: resume_screening.data_ai_claims.bias_fairness_check
    competency_key: machine_learning
    topic: "Fairness checks in models"
    difficulty: hard
    text: "You checked a model for unfair behaviour across groups. How did you choose which comparisons to run, and what did you do with what you found?"
    expected_concepts:
      - "relevant groups and legal context"
      - "metrics"
      - "findings"
      - "mitigation"
      - "documentation"
    rubric:
      excellent: "Chooses comparisons with justification, quantifies differences, takes action and documents trade-offs."
      good: "Describes checks."
      weak: "Did not check or said the model is objective."
    followups:
      - "What gap did you find?"
      - "What did you change?"
    common_errors:
      - "Did not check or said the model is objective."

  - external_key: resume_screening.data_ai_claims.interpretability_for_stakeholders
    competency_key: communication
    topic: "Explaining models"
    difficulty: medium
    text: "You explained a model's behaviour to non-technical decision makers. What did they misunderstand at first?"
    expected_concepts:
      - "audience"
      - "method of explanation"
      - "misunderstandings"
      - "limits"
      - "decision"
    rubric:
      excellent: "Gives a concrete misunderstanding and a clearer framing including limits."
      good: "Describes explaining."
      weak: "Used technical terms only."
    followups:
      - "What analogy worked?"
      - "What did they decide?"
    common_errors:
      - "Used technical terms only."

  - external_key: resume_screening.data_ai_claims.gpu_training_efficiency
    competency_key: mlops
    topic: "Training efficiency"
    difficulty: medium
    text: "You trained models on shared compute. How did you find out why training was slow or costly, and what helped most?"
    expected_concepts:
      - "profiling"
      - "data loading"
      - "batch and precision"
      - "scheduling"
      - "cost metrics"
    rubric:
      excellent: "Profiles, identifies the dominant cause and shows speedups and cost impact."
      good: "Describes changes."
      weak: "Added more GPUs."
    followups:
      - "What was the GPU utilisation?"
      - "Where was time spent?"
    common_errors:
      - "Added more GPUs."

  - external_key: resume_screening.data_ai_claims.feature_store_consistency
    competency_key: mlops
    topic: "Feature management"
    difficulty: medium
    text: "You managed features shared across models. How did you stop training and serving values from drifting apart?"
    expected_concepts:
      - "single definition"
      - "point-in-time correctness"
      - "monitoring"
      - "ownership"
      - "versioning"
    rubric:
      excellent: "Uses one definition for both paths, correct point-in-time joins and monitors skew."
      good: "Describes the store."
      weak: "Reimplemented features for serving."
    followups:
      - "How did you detect skew?"
      - "Who owned each feature?"
    common_errors:
      - "Reimplemented features for serving."

  - external_key: resume_screening.data_ai_claims.data_science_to_business_translation
    competency_key: stakeholder_management
    topic: "Translating business problems"
    difficulty: medium
    text: "A business team asked you for a model. How did you decide whether a model was the right answer?"
    expected_concepts:
      - "clarifying the decision"
      - "simple alternatives"
      - "data availability"
      - "cost and benefit"
      - "agreement on success"
    rubric:
      excellent: "Clarifies the decision, considers simpler options and agrees success criteria."
      good: "Describes scoping."
      weak: "Built the model as asked."
    followups:
      - "What simpler option did you suggest?"
      - "How did you agree success?"
    common_errors:
      - "Built the model as asked."

  - external_key: resume_screening.data_ai_claims.rag_data_freshness
    competency_key: llm_engineering
    topic: "Keeping knowledge current"
    difficulty: medium
    text: "Your assistant answers from a knowledge base that changes. How did you keep indexed content fresh and remove outdated or restricted content?"
    expected_concepts:
      - "ingestion pipeline"
      - "updates and deletions"
      - "permissions"
      - "verification"
      - "monitoring"
    rubric:
      excellent: "Describes incremental updates, deletion handling, respect for permissions and verification."
      good: "Describes ingestion."
      weak: "Rebuilt the index occasionally."
    followups:
      - "How were permissions enforced?"
      - "What happened to deleted documents?"
    common_errors:
      - "Rebuilt the index occasionally."

  - external_key: resume_screening.data_ai_claims.llm_evaluation_harness
    competency_key: llm_engineering
    topic: "Evaluation systems for language models"
    difficulty: hard
    text: "You built an evaluation harness for a language model feature. How did you trust the grader, and what did the harness miss that users found?"
    expected_concepts:
      - "test case design"
      - "grader validation against humans"
      - "coverage gaps"
      - "regression tracking"
      - "production sampling"
    rubric:
      excellent: "Validates the grader against human judgement, acknowledges gaps and samples production cases."
      good: "Describes harness."
      weak: "Used a model grader without validation."
    followups:
      - "How did graders agree?"
      - "What user case was absent?"
    common_errors:
      - "Used a model grader without validation."

  - external_key: resume_screening.data_ai_claims.prompt_injection_defence
    competency_key: security
    topic: "Untrusted content in prompts"
    difficulty: medium
    text: "Your feature put outside content into model prompts. What attacks did you consider, and how did you limit what a malicious document could make the system do?"
    expected_concepts:
      - "injection risks"
      - "separation of instructions and data"
      - "tool permissions"
      - "output checks"
      - "testing"
    rubric:
      excellent: "Names attacks, limits tool permissions, checks outputs and tests with adversarial cases."
      good: "Describes some defences."
      weak: "Did not consider it."
    followups:
      - "What can the model do on its own?"
      - "How did you test?"
    common_errors:
      - "Did not consider it."

  - external_key: resume_screening.data_ai_claims.human_in_loop_review
    competency_key: llm_engineering
    topic: "Human review workflows"
    difficulty: medium
    text: "You included human review for automated outputs. How did you decide what needed review, and how did reviewers' decisions improve the system?"
    expected_concepts:
      - "confidence routing"
      - "reviewer interface"
      - "sampling"
      - "feedback use"
      - "throughput"
    rubric:
      excellent: "Routes by confidence and risk, samples for quality and uses decisions as feedback."
      good: "Describes review."
      weak: "Reviewed everything or nothing."
    followups:
      - "What share went to review?"
      - "How did you use corrections?"
    common_errors:
      - "Reviewed everything or nothing."

  - external_key: resume_screening.data_ai_claims.ai_adoption_users
    competency_key: ownership
    topic: "Adoption of AI features"
    difficulty: easy
    text: "You launched an AI-powered feature. What did early users do that you had not expected?"
    expected_concepts:
      - "usage"
      - "unexpected behaviour"
      - "metrics"
      - "changes"
      - "lessons"
    rubric:
      excellent: "Describes real unexpected usage and product changes."
      good: "Describes adoption."
      weak: "Reports sign-ups only."
    followups:
      - "What did they ask it?"
      - "What did you change in week one?"
    common_errors:
      - "Reports sign-ups only."

  - external_key: resume_screening.data_ai_claims.sql_metrics_layer
    competency_key: sql
    topic: "Metric layers and models in SQL"
    difficulty: medium
    text: "You wrote transformation code in SQL for reporting. How did you test it, and how did you review changes by other people?"
    expected_concepts:
      - "tests for keys and totals"
      - "version control"
      - "review"
      - "documentation"
      - "lineage"
    rubric:
      excellent: "Tests uniqueness and reconciliation, uses reviews and documents lineage."
      good: "Describes tests."
      weak: "No testing."
    followups:
      - "What test caught a bug?"
      - "How do you review changes?"
    common_errors:
      - "No testing."

  - external_key: resume_screening.data_ai_claims.time_series_pitfalls
    competency_key: statistics_experimentation
    topic: "Time series analysis"
    difficulty: medium
    text: "You analysed time-dependent data. What pitfalls did you watch for in evaluation and interpretation?"
    expected_concepts:
      - "leakage across time"
      - "seasonality"
      - "trend changes"
      - "holiday effects"
      - "communication"
    rubric:
      excellent: "Uses time-aware validation, handles seasonality and communicates ranges."
      good: "Describes analysis."
      weak: "Random splits."
    followups:
      - "How did you split data?"
      - "What event disrupted it?"
    common_errors:
      - "Random splits."

  - external_key: resume_screening.data_ai_claims.survey_research_analysis
    competency_key: statistics_experimentation
    topic: "Survey or sampling work"
    difficulty: easy
    text: "You analysed surveys or sampled data. How did you handle non-response or a sample that did not represent your users?"
    expected_concepts:
      - "sampling bias"
      - "weighting"
      - "caveats"
      - "communication"
      - "decisions"
    rubric:
      excellent: "Recognises bias, applies adjustments and communicates caveats."
      good: "Describes analysis."
      weak: "Treated the sample as the population."
    followups:
      - "Who didn't respond?"
      - "What caveat did you state?"
    common_errors:
      - "Treated the sample as the population."

  - external_key: resume_screening.data_ai_claims.etl_legacy_replacement
    competency_key: data_engineering
    topic: "Replacing legacy ETL"
    difficulty: easy
    text: "You replaced old scripts or reports with a new data process. How did you find what the old process quietly did?"
    expected_concepts:
      - "reading code"
      - "talking to users"
      - "output comparison"
      - "documentation"
      - "cutover"
    rubric:
      excellent: "Reads and traces old code, interviews users and compares outputs before switching."
      good: "Describes replacement."
      weak: "Rebuilt from requirements only."
    followups:
      - "What hidden behaviour did you find?"
      - "Who signed off?"
    common_errors:
      - "Rebuilt from requirements only."

  - external_key: resume_screening.data_ai_claims.data_incident_response
    competency_key: incident_response
    topic: "Data incident handling"
    difficulty: hard
    text: "Tell me about a data incident such as bad data in production or a failed load. How did you work out which downstream reports and models were affected?"
    expected_concepts:
      - "detection"
      - "lineage"
      - "communication"
      - "backfill"
      - "prevention"
    rubric:
      excellent: "Uses lineage to find impact, communicates, repairs and adds checks."
      good: "Describes handling."
      weak: "Fixed the source only."
    followups:
      - "How did you find affected reports?"
      - "Who did you notify?"
    common_errors:
      - "Fixed the source only."

  - external_key: resume_screening.data_ai_claims.cross_functional_ml_team
    competency_key: collaboration
    topic: "Working with engineers on ML"
    difficulty: medium
    text: "You collaborated with software engineers to ship a model. Where did expectations differ and how were they aligned?"
    expected_concepts:
      - "interface agreement"
      - "performance requirements"
      - "testing"
      - "ownership"
      - "communication"
    rubric:
      excellent: "Describes specific differences and agreements on interface, testing and ownership."
      good: "Describes collaboration."
      weak: "Handed over notebooks."
    followups:
      - "What did engineers need from you?"
      - "Who owns it in production?"
    common_errors:
      - "Handed over notebooks."

  - external_key: resume_screening.data_ai_claims.cost_benefit_ai
    competency_key: ownership
    topic: "Cost versus benefit of AI"
    difficulty: hard
    text: "Choose an AI or data project on your resume. What did it cost to build and run, and what value did it return?"
    expected_concepts:
      - "build and run cost"
      - "value measure"
      - "uncertainty"
      - "reviewing"
      - "decisions"
    rubric:
      excellent: "Quantifies cost and value with uncertainty and reviews the decision."
      good: "Describes both."
      weak: "Lists value only."
    followups:
      - "What was the run cost?"
      - "Would you do it again?"
    common_errors:
      - "Lists value only."

  - external_key: resume_screening.data_ai_claims.learning_new_methods
    competency_key: adaptability
    topic: "Adopting a new technique"
    difficulty: easy
    text: "You adopted a new technique or tool in your data work. How did you check it was better than what you used before?"
    expected_concepts:
      - "baseline"
      - "trial"
      - "comparison"
      - "adoption"
      - "team knowledge"
    rubric:
      excellent: "Compares on a baseline, trials before adopting and shares knowledge."
      good: "Describes adoption."
      weak: "Adopted because it was new."
    followups:
      - "What baseline did you use?"
      - "How did you teach others?"
    common_errors:
      - "Adopted because it was new."

  - external_key: resume_screening.data_ai_claims.inherited_model_review
    competency_key: code_quality
    topic: "Inheriting a model or pipeline"
    difficulty: hard
    text: "You inherited a model or pipeline no one fully understood. How did you establish what it did and whether it could be trusted?"
    expected_concepts:
      - "reading and tracing"
      - "reproducing outputs"
      - "tests"
      - "documentation"
      - "decision to keep or rebuild"
    rubric:
      excellent: "Reproduces outputs, adds tests and documents, then decides keep or rebuild with reasons."
      good: "Describes review."
      weak: "Kept running it unchanged."
    followups:
      - "What was undocumented?"
      - "What was your decision and why?"
    common_errors:
      - "Kept running it unchanged."

  - external_key: resume_screening.data_ai_claims.spreadsheet_to_system
    competency_key: ownership
    topic: "Replacing manual spreadsheets"
    difficulty: easy
    text: "You replaced a spreadsheet-based process with a proper data tool. What did the spreadsheet do that people liked and you had to preserve?"
    expected_concepts:
      - "observing real use"
      - "hidden logic"
      - "migration"
      - "training"
      - "feedback"
    rubric:
      excellent: "Observes users, preserves valued behaviours and trains them through the change."
      good: "Describes the replacement."
      weak: "Forced the new tool without understanding."
    followups:
      - "What formula was hidden?"
      - "Who resisted?"
    common_errors:
      - "Forced the new tool without understanding."
