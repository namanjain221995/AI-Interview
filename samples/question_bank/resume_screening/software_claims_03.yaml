# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [backend, frontend, fullstack, mobile, qa]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.software_claims.open_source_contribution
    competency_key: collaboration
    topic: "Open source contributions"
    difficulty: easy
    text: "Your resume lists open source work. Pick one contribution and tell me what you changed, how maintainers reacted, and what you learned from the review."
    expected_concepts:
      - "the specific change and why it was needed"
      - "interaction with maintainers"
      - "revisions after review"
      - "what was merged"
      - "lessons about quality or communication"
    rubric:
      excellent: "Explains a concrete change, how feedback shaped it and what the candidate would do differently in the next contribution."
      good: "Describes the contribution and its acceptance with limited detail on review."
      weak: "Lists projects with no concrete contribution."
    followups:
      - "What was the pull request pushback?"
      - "How did you choose that project?"
    common_errors:
      - "Lists projects with no concrete contribution."

  - external_key: resume_screening.software_claims.language_migration
    competency_key: code_quality
    topic: "Moving to another language or framework"
    difficulty: medium
    text: "You moved part of a codebase to a different language, such as adding static types or changing frameworks. How did you do it without stopping the product, and what was the payoff?"
    expected_concepts:
      - "incremental approach"
      - "interoperability during transition"
      - "tooling and lint support"
      - "measured benefit like fewer defects"
      - "team training"
    rubric:
      excellent: "Migrates in stages with both versions working, measures a concrete benefit and addresses team learning."
      good: "Describes the steps and a plausible benefit."
      weak: "Converted everything at once and cannot show benefit."
    followups:
      - "What did you migrate last and why?"
      - "How did you know it was better?"
    common_errors:
      - "Converted everything at once and cannot show benefit."

  - external_key: resume_screening.software_claims.monitoring_added
    competency_key: observability
    topic: "Adding monitoring and alerting"
    difficulty: easy
    text: "You added monitoring or logging to a system. What question were you unable to answer before, and which alert turned out to be the most useful?"
    expected_concepts:
      - "gaps in visibility before"
      - "chosen signals"
      - "alert thresholds and noise control"
      - "a real issue the monitoring caught"
      - "dashboards that were actually used"
    rubric:
      excellent: "States the missing visibility, selects meaningful signals, tunes alerts to avoid noise and cites an issue found by it."
      good: "Describes tools and alerts with one example."
      weak: "Added many dashboards with no use case or noise management."
    followups:
      - "Which alert did you delete?"
      - "Who looked at the dashboards?"
    common_errors:
      - "Added many dashboards with no use case or noise management."

  - external_key: resume_screening.software_claims.memory_leak_investigation
    competency_key: debugging
    topic: "Resource leak investigation"
    difficulty: medium
    text: "Your resume mentions solving a memory, CPU or connection problem in production. How did you narrow it down when it only showed up under real traffic?"
    expected_concepts:
      - "symptom and trend evidence"
      - "profiling or heap analysis tools"
      - "hypothesis and experiment"
      - "root cause"
      - "fix verification and alerts"
    rubric:
      excellent: "Uses production telemetry and profilers to narrow down, explains the cause precisely and confirms the fix with monitoring."
      good: "Explains the cause and fix with a short search description."
      weak: "Restarts services on a schedule as the fix."
    followups:
      - "What did the graph look like?"
      - "How did you test the fix without production load?"
    common_errors:
      - "Restarts services on a schedule as the fix."

  - external_key: resume_screening.software_claims.sharding_scaling_database
    competency_key: databases
    topic: "Scaling a database"
    difficulty: hard
    text: "You list scaling a database through replicas, partitioning or sharding. What was the signal that told you it was time, and which option did you reject and why?"
    expected_concepts:
      - "evidence of limit such as saturation metrics"
      - "options like replicas, caching, partitioning"
      - "costs of each"
      - "migration path"
      - "effect on queries and transactions"
    rubric:
      excellent: "Uses concrete signals, compares options by cost and complexity, explains consequences for queries and describes the migration."
      good: "Describes the chosen approach with brief comparisons."
      weak: "Chose sharding because it sounds scalable."
    followups:
      - "What query stopped working afterward?"
      - "How did you rebalance data?"
    common_errors:
      - "Chose sharding because it sounds scalable."

  - external_key: resume_screening.software_claims.idempotent_payments
    competency_key: api_design
    topic: "Payments or money flows"
    difficulty: hard
    text: "You worked on payments, billing or another flow where money moves. How did you prevent double charges and detect when records disagreed with an outside provider?"
    expected_concepts:
      - "idempotency keys"
      - "transaction boundaries"
      - "reconciliation jobs"
      - "handling partial failures"
      - "audit trail"
    rubric:
      excellent: "Explains idempotency, safe retries, reconciliation with the provider and treatment of partial failure with an audit trail."
      good: "Covers retries and some checks."
      weak: "Relies on the provider to prevent duplicates."
    followups:
      - "How often did reconciliation find a mismatch?"
      - "What did you do with them?"
    common_errors:
      - "Relies on the provider to prevent duplicates."

  - external_key: resume_screening.software_claims.design_system_adoption
    competency_key: frontend_react
    topic: "Component library or design system"
    difficulty: medium
    text: "You built or contributed to a shared component library. How did you get product teams to use it rather than building their own, and how did you handle requests that did not fit?"
    expected_concepts:
      - "understanding consumer needs"
      - "API and documentation of components"
      - "versioning and releases"
      - "contribution model"
      - "measuring adoption"
    rubric:
      excellent: "Works with consumers, documents and versions components, defines how to extend them and tracks adoption."
      good: "Describes components and some adoption steps."
      weak: "Built a library nobody asked for and mandated it."
    followups:
      - "Which request did you refuse?"
      - "How did you ship breaking changes?"
    common_errors:
      - "Built a library nobody asked for and mandated it."

  - external_key: resume_screening.software_claims.bundle_size_web_vitals
    competency_key: frontend_react
    topic: "Reducing page weight"
    difficulty: easy
    text: "You say you reduced bundle size or load time. What was the biggest single contributor to the weight, and how did you find it?"
    expected_concepts:
      - "analysing the bundle"
      - "lazy loading or splitting"
      - "dependency replacement"
      - "image and asset handling"
      - "verification on slow devices"
    rubric:
      excellent: "Uses analysis tooling to find heavy dependencies, applies targeted changes and verifies on constrained devices."
      good: "Names techniques with some numbers."
      weak: "Applied techniques blindly without measuring."
    followups:
      - "What dependency surprised you?"
      - "Did you test on slow networks?"
    common_errors:
      - "Applied techniques blindly without measuring."

  - external_key: resume_screening.software_claims.mobile_startup_battery
    competency_key: mobile_development
    topic: "Mobile performance"
    difficulty: medium
    text: "You mention improving app startup time, responsiveness or battery use. How did you measure on real devices, and which change moved the number most?"
    expected_concepts:
      - "profiling tools on devices"
      - "representative device range"
      - "main contributors"
      - "trade-offs with features"
      - "ongoing monitoring"
    rubric:
      excellent: "Measures on a range of real devices, identifies the dominant cost and tracks ongoing metrics in production."
      good: "Explains techniques and results from a few devices."
      weak: "Tested only on a fast simulator."
    followups:
      - "Which device was worst?"
      - "What did you give up?"
    common_errors:
      - "Tested only on a fast simulator."

  - external_key: resume_screening.software_claims.app_store_release_process
    competency_key: ci_cd
    topic: "Mobile release process"
    difficulty: easy
    text: "Your resume mentions owning releases for an app. What did a release involve from code freeze to users having it, and what usually went wrong?"
    expected_concepts:
      - "build and signing"
      - "testing and review gates"
      - "staged rollout"
      - "store review delays"
      - "hotfix path"
    rubric:
      excellent: "Describes the end-to-end release path, common failure points and how hotfixes and staged rollout reduce risk."
      good: "Lists the main steps and a few issues."
      weak: "Describes only pressing a button to publish."
    followups:
      - "How did you handle a rejected submission?"
      - "How fast could you ship a fix?"
    common_errors:
      - "Describes only pressing a button to publish."

  - external_key: resume_screening.software_claims.contract_testing_apis
    competency_key: testing
    topic: "Contract and integration testing"
    difficulty: medium
    text: "You wrote integration or contract tests between services. What failures did they prevent, and what could they not catch?"
    expected_concepts:
      - "consumer expectations encoded as tests"
      - "environments and data"
      - "breaking change detection"
      - "flakiness"
      - "limits such as behaviour under load"
    rubric:
      excellent: "Explains how tests encode expectations, cites a prevented breaking change and acknowledges blind spots."
      good: "Describes the tests and some benefits."
      weak: "Claims the tests cover everything."
    followups:
      - "Who updated the tests when the API changed?"
      - "What got through anyway?"
    common_errors:
      - "Claims the tests cover everything."

  - external_key: resume_screening.software_claims.exploratory_testing_findings
    competency_key: testing
    topic: "Finding defects by exploration"
    difficulty: easy
    text: "Your resume lists exploratory or manual testing. Tell me about the most important defect you found that no scripted test would have caught, and how you reported it."
    expected_concepts:
      - "how the area was chosen"
      - "technique used"
      - "the defect and its impact"
      - "reproduction steps"
      - "communication with developers"
    rubric:
      excellent: "Describes a risk-driven exploration, a significant defect and a clear report that led to action."
      good: "Describes a real defect with partial reporting detail."
      weak: "Reports minor defects with unclear steps."
    followups:
      - "How did you decide where to look?"
      - "How did the developer respond?"
    common_errors:
      - "Reports minor defects with unclear steps."

  - external_key: resume_screening.software_claims.flaky_tests_fix
    competency_key: test_automation
    topic: "Flaky tests"
    difficulty: medium
    text: "You mention stabilising flaky tests. What were the main causes you found, and what rule did the team adopt so they stayed fixed?"
    expected_concepts:
      - "categorising causes such as timing or shared state"
      - "isolation and deterministic data"
      - "quarantine policy"
      - "tracking flake rate"
      - "team agreement"
    rubric:
      excellent: "Classifies causes, fixes root issues, sets a quarantine and ownership policy and tracks the rate."
      good: "Fixes several flaky tests and describes common causes."
      weak: "Added retries until failures stopped appearing."
    followups:
      - "What percent of runs failed randomly before?"
      - "How long could a test stay quarantined?"
    common_errors:
      - "Hiding flakiness with automatic retries."

  - external_key: resume_screening.software_claims.requirements_misunderstanding
    competency_key: communication
    topic: "Misunderstood requirement"
    difficulty: medium
    text: "Tell me about something on your resume that you built correctly but that did not meet the real need. How did you find out and what did you do?"
    expected_concepts:
      - "gap between request and need"
      - "how it was discovered"
      - "handling the rework"
      - "changes in the requirement process"
      - "learning"
    rubric:
      excellent: "Identifies a specific gap, explains how it surfaced, the recovery and the lasting change in how requirements are confirmed."
      good: "Acknowledges a mismatch and its fix."
      weak: "Cannot recall one or blames the requester."
    followups:
      - "What question would have caught it?"
      - "What do you do at the start now?"
    common_errors:
      - "Cannot recall one or blames the requester."

  - external_key: resume_screening.software_claims.refactoring_payoff
    competency_key: code_quality
    topic: "Refactoring claim"
    difficulty: easy
    text: "You mention a large refactor. What was wrong with the structure before, and how could someone tell afterwards that it was better?"
    expected_concepts:
      - "specific structural problems"
      - "scope control"
      - "tests as safety net"
      - "measured outcomes such as delivery speed or defects"
      - "reviewing in small steps"
    rubric:
      excellent: "Describes the structural issue, protects behaviour with tests, works in small steps and shows an observable improvement."
      good: "Explains the problem and a general benefit."
      weak: "Says the code was cleaner with no evidence."
    followups:
      - "How did you keep behaviour the same?"
      - "What did you leave alone?"
    common_errors:
      - "Says the code was cleaner with no evidence."

  - external_key: resume_screening.software_claims.security_vulnerability_fix
    competency_key: security
    topic: "Fixing a security issue"
    difficulty: medium
    text: "You mention fixing a security vulnerability. How was the issue found, how did you decide it was serious, and how did you make sure similar ones were not elsewhere?"
    expected_concepts:
      - "discovery source"
      - "severity reasoning"
      - "fix and verification"
      - "searching for the same pattern"
      - "preventive controls"
    rubric:
      excellent: "Explains discovery and severity reasoning, fixes properly, searches for similar cases and adds prevention."
      good: "Describes the issue and fix with limited follow-through."
      weak: "Patches the single instance only."
    followups:
      - "Could it have been exploited before you found it?"
      - "What check did you add to catch it earlier?"
    common_errors:
      - "Patches the single instance only."

  - external_key: resume_screening.software_claims.estimation_accuracy
    competency_key: project_management
    topic: "Estimating and planning"
    difficulty: medium
    text: "Your resume says you led planning or estimation for a project. How close were your estimates to reality, and what did you change after seeing the difference?"
    expected_concepts:
      - "estimation method"
      - "breaking down work"
      - "tracking actuals"
      - "reasons for variance"
      - "improved approach"
    rubric:
      excellent: "Compares estimates with actuals, explains variance causes and adjusts method such as buffers or smaller slices."
      good: "Describes the process and some variance."
      weak: "Claims estimates were accurate with no tracking."
    followups:
      - "What did you consistently underestimate?"
      - "How did you communicate changes?"
    common_errors:
      - "Claims estimates were accurate with no tracking."

  - external_key: resume_screening.software_claims.legacy_system_integration
    competency_key: system_design
    topic: "Integrating with legacy systems"
    difficulty: medium
    text: "You connected new software to an older system. What constraints did the old system impose, and how did you keep its quirks from spreading into the new code?"
    expected_concepts:
      - "understanding limits of the old system"
      - "anti-corruption layers or adapters"
      - "testing with recorded data"
      - "isolation of fragile parts"
      - "plan to retire it"
    rubric:
      excellent: "Documents the old system's limits, isolates it behind an adapter, tests with realistic data and plans retirement."
      good: "Describes an adapter and some limits."
      weak: "Let legacy structure shape the new design."
    followups:
      - "What did you discover only by testing?"
      - "How was it eventually removed?"
    common_errors:
      - "Let legacy structure shape the new design."

  - external_key: resume_screening.software_claims.cost_reduction_cloud_app
    competency_key: system_design
    topic: "Cost saving in software"
    difficulty: hard
    text: "You mention reducing infrastructure or licence costs from the application side. Where did the cost come from, and what behaviour or quality did you trade off?"
    expected_concepts:
      - "cost breakdown"
      - "code or design changes that lowered cost"
      - "measurement of saving"
      - "impact on latency or reliability"
      - "ongoing tracking"
    rubric:
      excellent: "Breaks down the cost, links changes to measured saving and shows what trade-offs were checked."
      good: "Gives the saving and main change."
      weak: "Quotes a saving without explaining the cause."
    followups:
      - "What would have made the bill rise again?"
      - "Did customers notice anything?"
    common_errors:
      - "Quotes a saving without explaining the cause."

  - external_key: resume_screening.software_claims.architecture_review_challenge
    competency_key: system_design
    topic: "Pushing back in design review"
    difficulty: hard
    text: "Describe a design review where you disagreed with the proposed approach. What was your argument, and what was the outcome?"
    expected_concepts:
      - "clear technical argument with evidence"
      - "listening to the other side"
      - "proposing alternatives"
      - "compromise or decision process"
      - "follow-up"
    rubric:
      excellent: "Presents evidence-based concerns, engages with the counter view and reaches a decision that is revisited with data."
      good: "Gives a disagreement and a reasoned argument."
      weak: "Describes winning or yielding without technical substance."
    followups:
      - "What would have changed your mind?"
      - "Who was proven right?"
    common_errors:
      - "Describes winning or yielding without technical substance."

  - external_key: resume_screening.software_claims.mentoring_through_code
    competency_key: mentoring
    topic: "Helping others grow"
    difficulty: medium
    text: "You list mentoring junior developers or testers. Give me an example of how you helped someone get unstuck without doing the work for them."
    expected_concepts:
      - "diagnosing what the person needed"
      - "guiding questions"
      - "pair work"
      - "feedback on the result"
      - "the person's growth"
    rubric:
      excellent: "Gives a specific case, shows guiding rather than doing and describes a visible gain for the other person."
      good: "Describes mentoring in general with one example."
      weak: "Took over the task or lists mentoring with no example."
    followups:
      - "What did they do differently afterwards?"
      - "When do you step in?"
    common_errors:
      - "Took over the task or lists mentoring with no example."

  - external_key: resume_screening.software_claims.prototype_to_production
    competency_key: ownership
    topic: "From prototype to production"
    difficulty: hard
    text: "You built a prototype that became a production system. What did you have to redo, and which shortcuts from the prototype stayed in too long?"
    expected_concepts:
      - "prototype assumptions"
      - "hardening needs such as security and tests"
      - "data model fixes"
      - "operational readiness"
      - "managing expectations"
    rubric:
      excellent: "Names shortcuts and the hardening work, explains handling expectations and describes the cost of those that survived."
      good: "Describes hardening work in general."
      weak: "Shipped the prototype as it was."
    followups:
      - "What bit you first?"
      - "Who decided it was ready?"
    common_errors:
      - "Shipped the prototype as it was."

  - external_key: resume_screening.software_claims.hackathon_project_outcome
    competency_key: motivation
    topic: "Side or hackathon projects"
    difficulty: easy
    text: "Your resume lists a side project or a hackathon build. What did you learn that you later used in your regular work?"
    expected_concepts:
      - "goal and scope"
      - "technology tried"
      - "what worked or did not"
      - "transferred lessons"
      - "finishing and sharing"
    rubric:
      excellent: "Describes the project goal, a concrete skill gained and the way it was applied in later professional work."
      good: "Describes the project and a general lesson."
      weak: "Lists a project with no details."
    followups:
      - "What would you do differently if you restarted?"
      - "Is it still used?"
    common_errors:
      - "Lists a project with no details."

  - external_key: resume_screening.software_claims.stakeholder_demo_feedback
    competency_key: communication
    topic: "Demos and stakeholder input"
    difficulty: easy
    text: "Tell me about a demo or review you gave to people outside engineering. What did they push back on, and what did you change?"
    expected_concepts:
      - "preparing for the audience"
      - "framing in their terms"
      - "handling feedback"
      - "changes made"
      - "follow-up"
    rubric:
      excellent: "Frames the demo for the audience, gets specific feedback and shows an adjustment resulting from it."
      good: "Describes the demo and general feedback."
      weak: "Demonstrates technical detail the audience could not use."
    followups:
      - "What question surprised you?"
      - "How did you record the feedback?"
    common_errors:
      - "Demonstrates technical detail the audience could not use."

  - external_key: resume_screening.software_claims.learning_new_tool_fast
    competency_key: adaptability
    topic: "Picking up a new technology on the job"
    difficulty: easy
    text: "Your resume lists a technology you had to learn on the job. How did you get productive quickly, and what was the first real thing you shipped with it?"
    expected_concepts:
      - "learning approach such as docs, examples and experts"
      - "a small first deliverable"
      - "mistakes made early"
      - "how work was reviewed"
      - "depth reached afterward"
    rubric:
      excellent: "Describes a structured learning path, a concrete first deliverable, early mistakes and how review helped them reach reliable depth."
      good: "Describes learning steps and a first use."
      weak: "Lists the technology with no account of how it was used."
    followups:
      - "What mistake did the review catch?"
      - "How deep do you know it now?"
    common_errors:
      - "Lists the technology with no account of how it was used."
