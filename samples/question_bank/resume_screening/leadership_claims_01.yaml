# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.leadership_claims.led_team_of_n_structure
    competency_key: leadership
    topic: "Size and shape of the team led"
    difficulty: easy
    text: "Your resume says you led a team. How many people, with what mix of roles and seniority, and which decisions were yours rather than your manager's?"
    expected_concepts:
      - "team size and composition"
      - "reporting line versus project lead"
      - "decision rights"
      - "accountability for outcomes"
      - "how the team grew or changed"
    rubric:
      excellent: "Gives a clear picture of the team, states whether they managed people or led technically, and separates decisions they owned from escalations."
      good: "Describes the team and responsibilities in general terms."
      weak: "Quotes a team size but cannot explain what leading it involved."
    followups:
      - "Did these people report to you directly?"
      - "What decision could you not make alone?"
    common_errors:
      - "Quotes a team size but cannot explain what leading it involved."

  - external_key: resume_screening.leadership_claims.first_ninety_days_lead
    competency_key: leadership
    topic: "Starting as a new lead"
    difficulty: easy
    text: "When you first took on a lead role, what did you do in the first few months to understand the team and set your priorities?"
    expected_concepts:
      - "listening to each person"
      - "understanding current delivery and pain points"
      - "early small wins"
      - "setting expectations"
      - "learning from mistakes"
    rubric:
      excellent: "Describes a deliberate plan with one-to-ones, observation of delivery, a few early changes and calibration after feedback."
      good: "Describes meeting the team and some initial priorities."
      weak: "Describes making large changes immediately without listening."
    followups:
      - "What did you change first?"
      - "What would you do differently now?"
    common_errors:
      - "Describes making large changes immediately without listening."

  - external_key: resume_screening.leadership_claims.delegation_practice
    competency_key: people_management
    topic: "Delegating work"
    difficulty: easy
    text: "You led a team, so you must have delegated. Give me an example of something you handed off that you were tempted to do yourself."
    expected_concepts:
      - "choosing what to delegate"
      - "matching to the person's growth"
      - "clarity of expectations"
      - "check-in cadence"
      - "handling the result"
    rubric:
      excellent: "Chooses the task for good reasons, sets outcome and boundaries, checks in at agreed points and handles imperfect results constructively."
      good: "Describes a delegation with some structure."
      weak: "Delegates only unwanted work or takes it back at the first problem."
    followups:
      - "What did you do when the result was not what you expected?"
      - "How did you stay informed?"
    common_errors:
      - "Delegates only unwanted work or takes it back at the first problem."

  - external_key: resume_screening.leadership_claims.one_to_ones_practice
    competency_key: people_management
    topic: "One-to-one meetings"
    difficulty: easy
    text: "You list people management. How do you run one-to-ones, and what has come out of them that changed something for the team?"
    expected_concepts:
      - "regular cadence"
      - "agenda owned by the report"
      - "career and feedback topics"
      - "follow-up on actions"
      - "examples of changes"
    rubric:
      excellent: "Describes a consistent routine, topics beyond status and a specific change that came from a conversation."
      good: "Describes meeting regularly with some topics."
      weak: "Uses one-to-ones for status updates only."
    followups:
      - "What do you do when someone has nothing to say?"
      - "How do you keep notes?"
    common_errors:
      - "Uses one-to-ones for status updates only."

  - external_key: resume_screening.leadership_claims.hiring_for_team
    competency_key: people_management
    topic: "Hiring claim"
    difficulty: medium
    text: "You hired people for your team. How did you define what you were looking for, and how did you judge whether a hire was a good one after a year?"
    expected_concepts:
      - "role definition"
      - "structured interviews"
      - "fair evaluation"
      - "onboarding"
      - "outcome review"
    rubric:
      excellent: "Defines the role from team needs, uses structured evaluation, reviews hires against expectations and learns from misses."
      good: "Describes hiring steps and some reflection."
      weak: "Relies on gut feeling and cannot say how success was judged."
    followups:
      - "Which hire taught you the most?"
      - "How did you reduce bias in decisions?"
    common_errors:
      - "Judging candidates on similarity to the existing team."

  - external_key: resume_screening.leadership_claims.mentoring_growth_example
    competency_key: mentoring
    topic: "Developing someone"
    difficulty: easy
    text: "Tell me about a person you helped grow into more responsibility. What did you do and what did they do?"
    expected_concepts:
      - "understanding their goals"
      - "stretch assignments"
      - "feedback"
      - "support level adjusted"
      - "observable growth"
    rubric:
      excellent: "Describes a specific person's progress, the assignments and feedback used, and the person's own effort."
      good: "Describes mentoring with some outcomes."
      weak: "Claims credit for someone's promotion without describing actions."
    followups:
      - "What was the hardest feedback to give?"
      - "How did you know they were ready?"
    common_errors:
      - "Claims credit for someone's promotion without describing actions."

  - external_key: resume_screening.leadership_claims.setting_team_direction
    competency_key: leadership
    topic: "Setting direction"
    difficulty: medium
    text: "Your resume says you set technical or team direction. What was the direction, how did you arrive at it, and how did the team respond?"
    expected_concepts:
      - "evidence gathered"
      - "options"
      - "input from team and partners"
      - "communication"
      - "adoption and adjustment"
    rubric:
      excellent: "Explains how direction was formed with input and evidence, communicated it clearly and adjusted with feedback."
      good: "Describes the direction and how it was shared."
      weak: "Announces a direction with no process behind it."
    followups:
      - "Who disagreed and what did you do?"
      - "How did you know it was working?"
    common_errors:
      - "Announces a direction with no process behind it."

  - external_key: resume_screening.leadership_claims.roadmap_ownership
    competency_key: project_management
    topic: "Owning a roadmap"
    difficulty: medium
    text: "You owned a team roadmap. How did you decide what went on it, and what happened when priorities changed mid-quarter?"
    expected_concepts:
      - "inputs from stakeholders"
      - "prioritisation criteria"
      - "capacity planning"
      - "handling changes"
      - "communication"
    rubric:
      excellent: "Uses explicit criteria and capacity, communicates trade-offs and shows a real change handled transparently."
      good: "Describes roadmap creation."
      weak: "Accepts every request and lets the roadmap drift."
    followups:
      - "What did you say no to?"
      - "How did you communicate a change?"
    common_errors:
      - "Accepts every request and lets the roadmap drift."

  - external_key: resume_screening.leadership_claims.underperformance_handling
    competency_key: people_management
    topic: "Performance concerns"
    difficulty: hard
    text: "Tell me about a time someone on your team was not meeting expectations. How did you handle it from first signs to resolution?"
    expected_concepts:
      - "early observation"
      - "clear expectations"
      - "support and feedback"
      - "documentation"
      - "outcome"
    rubric:
      excellent: "Raises the concern early with specifics, clarifies expectations, offers support and follows a fair, documented process to an outcome."
      good: "Describes feedback and some support."
      weak: "Avoids the conversation or jumps straight to removal."
    followups:
      - "When did you first notice?"
      - "What support did you offer?"
    common_errors:
      - "Waiting until a formal review to give first feedback."

  - external_key: resume_screening.leadership_claims.conflict_in_team
    competency_key: collaboration
    topic: "Resolving conflict"
    difficulty: medium
    text: "Two people on your team disagreed seriously about work. How did you step in?"
    expected_concepts:
      - "understanding both views separately"
      - "focusing on work outcomes"
      - "facilitating a decision"
      - "follow-up"
      - "preventing repeats"
    rubric:
      excellent: "Hears each side, frames around work goals, helps them reach a decision and checks the working relationship later."
      good: "Describes mediating."
      weak: "Ignored it or took a side immediately."
    followups:
      - "What did each of them want?"
      - "How did you check it was resolved?"
    common_errors:
      - "Ignored it or took a side immediately."

  - external_key: resume_screening.leadership_claims.delivery_improvement_metrics
    competency_key: agile_delivery
    topic: "Improving delivery"
    difficulty: medium
    text: "You claim to have improved delivery. What were the problems before, what did you change, and which measures show the difference?"
    expected_concepts:
      - "diagnosing delivery issues"
      - "changes to process or tooling"
      - "chosen measures"
      - "time frame"
      - "side effects"
    rubric:
      excellent: "Diagnoses with data, makes targeted changes, shows before and after measures and notes side effects."
      good: "Describes changes and general improvement."
      weak: "Introduced a framework and calls that improvement."
    followups:
      - "What measure did you avoid and why?"
      - "What got worse?"
    common_errors:
      - "Introduced a framework and calls that improvement."

  - external_key: resume_screening.leadership_claims.agile_process_introduced
    competency_key: agile_delivery
    topic: "Process you introduced"
    difficulty: easy
    text: "You introduced or changed a team process. What problem was it solving, and what did you drop when it did not help?"
    expected_concepts:
      - "problem definition"
      - "trial"
      - "feedback"
      - "adapting"
      - "dropping ceremonies"
    rubric:
      excellent: "Names a concrete problem, trials the change, collects feedback and removes parts that did not help."
      good: "Describes the process and some effects."
      weak: "Adopted a method wholesale."
    followups:
      - "Which meeting did you cancel?"
      - "How did you get the team to try it?"
    common_errors:
      - "Adopted a method wholesale."

  - external_key: resume_screening.leadership_claims.cross_team_alignment
    competency_key: stakeholder_management
    topic: "Aligning other teams"
    difficulty: medium
    text: "You led work that depended on other teams. How did you align priorities when their plans differed from yours?"
    expected_concepts:
      - "shared goals"
      - "clear asks"
      - "regular communication"
      - "escalation"
      - "compromise"
    rubric:
      excellent: "Clarifies shared goals, makes specific asks, keeps a regular rhythm and escalates only with options."
      good: "Describes coordination."
      weak: "Escalated early or waited for others."
    followups:
      - "Who had the most conflicting priority?"
      - "What did you give up?"
    common_errors:
      - "Escalated early or waited for others."

  - external_key: resume_screening.leadership_claims.budget_vendor_decisions
    competency_key: stakeholder_management
    topic: "Budget and vendors"
    difficulty: medium
    text: "Your resume mentions managing budget or vendors. What did you decide, and how did you justify it?"
    expected_concepts:
      - "needs analysis"
      - "options compared"
      - "cost and risk"
      - "approval"
      - "follow-up on value"
    rubric:
      excellent: "Compares options, quantifies cost and risk, gets approval and later reviews value."
      good: "Describes the decision."
      weak: "Describes budget as a number without decisions."
    followups:
      - "What did you cancel?"
      - "How did you check value later?"
    common_errors:
      - "Describes budget as a number without decisions."

  - external_key: resume_screening.leadership_claims.technical_decision_authority
    competency_key: leadership
    topic: "Making technical decisions"
    difficulty: medium
    text: "As a lead you made technical decisions for the team. Describe one where you chose against the team's preference."
    expected_concepts:
      - "reasons"
      - "listening"
      - "explaining"
      - "commitment"
      - "later review"
    rubric:
      excellent: "Explains reasoning, listened first, committed the team and revisited the decision with evidence."
      good: "Describes the decision."
      weak: "Cannot recall any disagreement."
    followups:
      - "Was it the right call?"
      - "How did the team feel afterward?"
    common_errors:
      - "Cannot recall any disagreement."

  - external_key: resume_screening.leadership_claims.onboarding_new_members
    competency_key: people_management
    topic: "Onboarding"
    difficulty: easy
    text: "You brought new people into a team. What did you put in place so that they were productive early?"
    expected_concepts:
      - "onboarding plan"
      - "buddy"
      - "first task"
      - "documentation"
      - "feedback"
    rubric:
      excellent: "Uses a plan with a buddy, a meaningful first task and feedback on the process."
      good: "Describes onboarding."
      weak: "Leaves new people to figure it out."
    followups:
      - "What did you change after the last hire?"
      - "How soon was their first release?"
    common_errors:
      - "Leaves new people to figure it out."

  - external_key: resume_screening.leadership_claims.retention_of_team
    competency_key: people_management
    topic: "Keeping good people"
    difficulty: medium
    text: "Your resume claims low attrition or strong team stability. What did you do that contributed, and what couldn't you control?"
    expected_concepts:
      - "understanding motivations"
      - "growth paths"
      - "workload"
      - "recognition"
      - "limits of influence"
    rubric:
      excellent: "Describes concrete actions, acknowledges external factors and shows learning from departures."
      good: "Describes practices."
      weak: "Takes full credit for stability."
    followups:
      - "Why did someone leave?"
      - "What would you change?"
    common_errors:
      - "Takes full credit for stability."

  - external_key: resume_screening.leadership_claims.incident_leadership_team
    competency_key: incident_response
    topic: "Leading through an outage"
    difficulty: hard
    text: "You led a team during a serious production incident. How did you organise people, and what did you do afterwards for the team?"
    expected_concepts:
      - "clear roles"
      - "communication"
      - "decision making"
      - "follow-up improvements"
      - "supporting responders"
    rubric:
      excellent: "Assigns roles, limits distraction, communicates with stakeholders, runs a blameless review and shares load afterwards."
      good: "Describes the response."
      weak: "Took over the debugging personally."
    followups:
      - "What did you delegate?"
      - "How did you handle the review?"
    common_errors:
      - "Took over the debugging personally."

  - external_key: resume_screening.leadership_claims.technical_debt_negotiation
    competency_key: stakeholder_management
    topic: "Negotiating for quality work"
    difficulty: hard
    text: "You argued for engineering quality work against feature pressure. How did you make the case, and what happened?"
    expected_concepts:
      - "quantifying cost"
      - "business language"
      - "options"
      - "negotiation"
      - "result"
    rubric:
      excellent: "Quantifies cost of inaction, frames in business terms, offers options and tracks the outcome."
      good: "Describes the argument."
      weak: "Argues on principle only."
    followups:
      - "What number did you use?"
      - "What did you accept?"
    common_errors:
      - "Argues on principle only."

  - external_key: resume_screening.leadership_claims.promotion_and_calibration
    competency_key: people_management
    topic: "Fair evaluation of people"
    difficulty: hard
    text: "You assessed team members for promotion or ratings. How did you make sure your evaluation was fair and based on evidence?"
    expected_concepts:
      - "criteria"
      - "evidence gathering"
      - "calibration with peers"
      - "bias checks"
      - "feedback to the person"
    rubric:
      excellent: "Uses stated criteria and documented evidence, calibrates with others, checks for bias and gives clear feedback."
      good: "Describes the process."
      weak: "Relies on recent impressions."
    followups:
      - "What evidence did you collect?"
      - "How did you handle a disagreement in calibration?"
    common_errors:
      - "Relies on recent impressions."

  - external_key: resume_screening.leadership_claims.remote_distributed_team
    competency_key: collaboration
    topic: "Leading across locations"
    difficulty: medium
    text: "You led a team spread across places or time zones. What working agreements made it function?"
    expected_concepts:
      - "communication norms"
      - "overlap hours"
      - "documentation"
      - "decision records"
      - "inclusion"
    rubric:
      excellent: "Describes concrete agreements, written decisions and inclusion of remote members."
      good: "Describes practices."
      weak: "Relied on constant meetings."
    followups:
      - "What agreement failed?"
      - "How did you handle handoffs?"
    common_errors:
      - "Relied on constant meetings."

  - external_key: resume_screening.leadership_claims.strategy_to_execution
    competency_key: project_management
    topic: "From plan to delivery"
    difficulty: hard
    text: "Choose the largest initiative you led. What was the plan, what changed along the way, and what was delivered compared to the plan?"
    expected_concepts:
      - "original plan"
      - "risks"
      - "changes"
      - "delivered result"
      - "lessons"
    rubric:
      excellent: "Compares plan and result candidly, explains changes and risk handling and states lessons."
      good: "Describes the plan and outcome."
      weak: "Claims it went exactly to plan."
    followups:
      - "What risk materialised?"
      - "What would you cut?"
    common_errors:
      - "Claims it went exactly to plan."

  - external_key: resume_screening.leadership_claims.saying_no_to_requests
    competency_key: stakeholder_management
    topic: "Declining work"
    difficulty: easy
    text: "Tell me about a time you said no, or not yet, to a request for your team's time. How did you do it?"
    expected_concepts:
      - "understanding the request"
      - "trade-offs"
      - "alternatives"
      - "communication"
      - "relationship"
    rubric:
      excellent: "Explains the trade-off, offers alternatives and keeps the relationship intact."
      good: "Describes declining."
      weak: "Never says no."
    followups:
      - "How did they react?"
      - "What did you offer instead?"
    common_errors:
      - "Never says no."

  - external_key: resume_screening.leadership_claims.stepping_back_to_ic
    competency_key: ownership
    topic: "Balancing leading and doing"
    difficulty: medium
    text: "How much of your time as a lead went to hands-on work, and how did you decide what you should still do yourself?"
    expected_concepts:
      - "time split"
      - "criteria for doing"
      - "risks of bottleneck"
      - "growth for others"
      - "adjustments"
    rubric:
      excellent: "Gives an actual split, criteria, awareness of bottleneck risk and examples of letting go."
      good: "Describes balance."
      weak: "Does everything critical personally."
    followups:
      - "What did you stop doing?"
      - "Where did you become a bottleneck?"
    common_errors:
      - "Does everything critical personally."

  - external_key: resume_screening.leadership_claims.feedback_culture_built
    competency_key: communication
    topic: "Feedback practices"
    difficulty: medium
    text: "You say you built a culture of feedback or learning on your team. What specific practices existed, and how did you know people actually used them?"
    expected_concepts:
      - "concrete practices such as reviews and retrospectives"
      - "psychological safety through behaviour"
      - "evidence of use"
      - "leader's own behaviour"
      - "results"
    rubric:
      excellent: "Names practices, shows how the lead modelled them and gives evidence of use and outcome."
      good: "Describes practices."
      weak: "Uses the word culture without any practice behind it."
    followups:
      - "What did you do when feedback was ignored?"
      - "What did people say about it?"
    common_errors:
      - "Uses the word culture without any practice behind it."
