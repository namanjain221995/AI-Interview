# Curated questions: resume screening, stack_depth. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.stack_depth.how_it_works_underneath
  competency_key: system_design
  topic: Under the hood
  difficulty: medium
  text: "Pick a technology you list as a strength. Explain what happens under the surface when you perform\
    \ its most common operation."
  expected_concepts:
  - main internal components
  - sequence of events
  - why it behaves as it does
  - where it can fail
  rubric:
    excellent: "Explains the internal flow accurately with the main components, ties it to observable\
      \ behaviour and notes where problems arise."
    good: Explains the flow at a high level with a few gaps.
    weak: Can only describe the surface interface.
  followups:
  - What would you see if that step failed?
  - Where did you learn this?
  common_errors:
  - Describing the commands used instead of what the technology does.

- external_key: resume_screening.stack_depth.hardest_problem_with_tool
  competency_key: debugging
  topic: Hardest problem solved
  difficulty: medium
  text: What is the hardest problem you solved with one of your listed technologies, and what made it
    hard?
  expected_concepts:
  - problem description
  - investigation
  - root cause
  - fix and prevention
  rubric:
    excellent: Describes a real hard problem, a systematic investigation, the root cause and the preventive
      change.
    good: Describes a problem and a fix without a deep cause.
    weak: Describes a routine task as the hardest problem.
  followups:
  - What did you try that did not work?
  - How did you confirm the root cause?
  common_errors:
  - 'Falling into the weak pattern: describes a routine task as the hardest problem.'

- external_key: resume_screening.stack_depth.performance_deep_dive
  competency_key: system_design
  topic: Tuning in depth
  difficulty: hard
  text: "Tell me about a time you tuned the performance of something built on your main technology. What\
    \ did you measure and what did you change?"
  expected_concepts:
  - measurement before changing
  - bottleneck identification
  - targeted change
  - verifying the improvement
  rubric:
    excellent: Describes profiling to find the bottleneck, a targeted change and a before and after comparison.
    good: Describes tuning with partial measurement.
    weak: Changed settings by trial without measuring.
  followups:
  - What was the bottleneck?
  - Which change did nothing?
  common_errors:
  - 'Falling into the weak pattern: changed settings by trial without measuring.'

- external_key: resume_screening.stack_depth.failure_modes
  competency_key: incident_response
  topic: How it fails
  difficulty: hard
  text: In what ways does your main technology fail in production, and how would you recognise each one?
  expected_concepts:
  - common failure modes
  - symptoms
  - diagnosis
  - mitigation
  rubric:
    excellent: "Describes several distinct failure modes with symptoms, diagnosis steps and mitigation\
      \ from experience."
    good: Names one or two failure modes.
    weak: Cannot describe how it fails.
  followups:
  - Which one did you experience?
  - What would you monitor?
  common_errors:
  - 'Falling into the weak pattern: cannot describe how it fails.'

- external_key: resume_screening.stack_depth.concurrency_or_scaling_behaviour
  competency_key: distributed_systems
  topic: Behaviour under load
  difficulty: hard
  text: "How does your main technology behave when load or concurrency grows, and where did you see it\
    \ struggle?"
  expected_concepts:
  - scaling limits
  - contention
  - resource exhaustion
  - mitigation
  rubric:
    excellent: Describes how behaviour changes under load, the limits seen and mitigations.
    good: Describes general scaling ideas.
    weak: Has not seen it under load.
  followups:
  - What was the first thing to saturate?
  - How did you find out?
  common_errors:
  - 'Falling into the weak pattern: has not seen it under load.'

- external_key: resume_screening.stack_depth.internals_you_have_read
  competency_key: code_quality
  topic: Reading source or docs deeply
  difficulty: hard
  text: "Have you ever read the source or deep documentation of a tool you use to resolve a problem? What\
    \ did you find?"
  expected_concepts:
  - motivation
  - what was read
  - discovery
  - applying the finding
  rubric:
    excellent: "Gives a real example of reading source or deep documentation, what it revealed and how\
      \ it changed the solution."
    good: Read deeper documentation occasionally.
    weak: Never goes beyond tutorials.
  followups:
  - What surprised you in it?
  - Did you share the finding?
  common_errors:
  - 'Falling into the weak pattern: never goes beyond tutorials.'

- external_key: resume_screening.stack_depth.extending_or_customising
  competency_key: api_design
  topic: Extensions and plug-ins
  difficulty: hard
  text: "Have you extended or customised your main technology with plug-ins, custom code or scripts? Describe\
    \ one."
  expected_concepts:
  - need for extension
  - implementation
  - maintenance
  - upgrade impact
  rubric:
    excellent: Describes a real extension, why it was needed, how it was maintained and how upgrades affected
      it.
    good: Used existing extensions with some configuration.
    weak: Never extended it.
  followups:
  - What broke on upgrade?
  - Why not use an existing one?
  common_errors:
  - 'Falling into the weak pattern: never extended it.'

- external_key: resume_screening.stack_depth.data_model_in_depth
  competency_key: databases
  topic: Data modelling choices
  difficulty: medium
  text: "For the data stores you list, how did you model data for your main use case, and what did you\
    \ change after seeing real usage?"
  expected_concepts:
  - model design
  - access patterns
  - indexes or keys
  - revisions
  rubric:
    excellent: Explains the model choice from access patterns, the indexes or keys and changes after real
      usage.
    good: Describes the model without a change history.
    weak: Used default structures without thought.
  followups:
  - Which query was slowest?
  - What would you model differently?
  common_errors:
  - 'Falling into the weak pattern: used default structures without thought.'

- external_key: resume_screening.stack_depth.query_or_code_plan
  competency_key: databases
  topic: Reading execution details
  difficulty: medium
  text: "How do you work out why something is slow in your main data or processing technology, and what\
    \ tools show you that?"
  expected_concepts:
  - execution plans or profiles
  - measuring
  - hypothesis
  - fix
  rubric:
    excellent: Describes using the technology's diagnostic tools to find where time goes and verifying
      a fix.
    good: Uses tools generally and tries changes.
    weak: Guesses at causes.
  followups:
  - What did the plan show?
  - How did you confirm the fix?
  common_errors:
  - 'Falling into the weak pattern: guesses at causes.'

- external_key: resume_screening.stack_depth.memory_and_resources
  competency_key: linux
  topic: Resource behaviour
  difficulty: medium
  text: "How does your main technology use memory, CPU and storage, and have you had to manage those in\
    \ practice?"
  expected_concepts:
  - resource profile
  - limits
  - leaks or growth
  - tuning
  rubric:
    excellent: Describes the resource profile, a case of managing limits or leaks and the measurement
      used.
    good: Knows general resource needs.
    weak: Has not considered resources.
  followups:
  - What was the limiting resource?
  - What did you set as a limit?
  common_errors:
  - 'Falling into the weak pattern: has not considered resources.'

- external_key: resume_screening.stack_depth.deployment_pipeline_depth
  competency_key: ci_cd
  topic: Shipping the stack
  difficulty: medium
  text: "Describe how changes to your main technology were built, tested and deployed, and which parts\
    \ of that pipeline you built."
  expected_concepts:
  - pipeline stages
  - automated checks
  - environments
  - rollback
  rubric:
    excellent: Describes the stages, checks and rollback and specifies the parts they built.
    good: Used a pipeline with minor changes.
    weak: Cannot describe the pipeline.
  followups:
  - What gate caught the most issues?
  - How would you roll back?
  common_errors:
  - 'Falling into the weak pattern: cannot describe the pipeline.'

- external_key: resume_screening.stack_depth.networking_and_connectivity
  competency_key: networking
  topic: Connections and networking
  difficulty: medium
  text: How does your main technology communicate with others, and what network problems have you diagnosed?
  expected_concepts:
  - protocols
  - ports and DNS
  - timeouts and retries
  - diagnosing connectivity
  rubric:
    excellent: Describes communication paths and a diagnosed network problem including tools used.
    good: Knows connections in general terms.
    weak: Treats network issues as someone else's area.
  followups:
  - What tool showed you the problem?
  - How did you set timeouts?
  common_errors:
  - 'Falling into the weak pattern: treats network issues as someone else''s area.'

- external_key: resume_screening.stack_depth.upgrade_experience
  competency_key: ci_cd
  topic: Upgrading
  difficulty: medium
  text: "Tell me about a time you upgraded a significant version of one of your technologies. How did\
    \ you plan and verify it?"
  expected_concepts:
  - reading release notes
  - testing
  - staged rollout
  - rollback plan
  rubric:
    excellent: Describes planning from release notes, testing, staging and a rollback plan, with problems
      found.
    good: Upgraded with a basic test.
    weak: Never did a major upgrade.
  followups:
  - What broke?
  - How did you decide the timing?
  common_errors:
  - 'Falling into the weak pattern: never did a major upgrade.'

- external_key: resume_screening.stack_depth.error_messages_you_know
  competency_key: debugging
  topic: Familiar errors
  difficulty: easy
  text: "What error messages or symptoms do you see most often with your main technology and what is usually\
    \ behind them?"
  expected_concepts:
  - common errors
  - typical causes
  - quick checks
  - prevention
  rubric:
    excellent: Names real errors with causes and quick checks and how they prevent them.
    good: Names a couple of errors with causes.
    weak: Cannot name specific errors.
  followups:
  - Which one is misleading?
  - How do you prevent it?
  common_errors:
  - 'Falling into the weak pattern: cannot name specific errors.'

- external_key: resume_screening.stack_depth.security_hardening_depth
  competency_key: security
  topic: Hardening
  difficulty: hard
  text: Have you hardened a deployment of your main technology? What specifically did you change and why?
  expected_concepts:
  - attack surface reduction
  - authentication and authorisation
  - updates
  - auditing
  rubric:
    excellent: Names specific hardening steps with reasoning and verification.
    good: Applied a checklist.
    weak: Has not done so.
  followups:
  - Which change mattered most?
  - How did you verify?
  common_errors:
  - 'Falling into the weak pattern: has not done so.'

- external_key: resume_screening.stack_depth.testing_depth
  competency_key: testing
  topic: Testing difficult behaviour
  difficulty: medium
  text: What behaviour of your main technology is hard to test, and how have you tested it?
  expected_concepts:
  - identifying hard areas
  - test design
  - environments
  - trade-offs
  rubric:
    excellent: Identifies hard-to-test behaviour and describes the approach and its trade-offs.
    good: Tests the common paths.
    weak: Does not test difficult areas.
  followups:
  - What do you mock?
  - What slipped through?
  common_errors:
  - 'Falling into the weak pattern: does not test difficult areas.'

- external_key: resume_screening.stack_depth.trade_off_in_configuration
  competency_key: system_design
  topic: Trade-offs inside the tool
  difficulty: medium
  text: "What is a setting or option in your main technology that trades one quality for another, and\
    \ how did you choose?"
  expected_concepts:
  - identifying trade-off
  - measurement
  - context-based choice
  - revisiting
  rubric:
    excellent: Names a real setting and trade-off, shows how they measured and decided and revisited later.
    good: Names a setting and a rationale.
    weak: Cannot name any trade-off.
  followups:
  - What would change your choice?
  - Who else was affected?
  common_errors:
  - 'Falling into the weak pattern: cannot name any trade-off.'

- external_key: resume_screening.stack_depth.migration_between_tools
  competency_key: system_design
  topic: Migration experience
  difficulty: hard
  text: "Have you migrated from one technology to another or between major versions? How did you keep\
    \ things running during it?"
  expected_concepts:
  - planning
  - parallel running
  - data or behaviour comparison
  - cutover
  rubric:
    excellent: Describes planning, parallel running, validation and cutover with lessons.
    good: Took part in a migration with a defined role.
    weak: Has not migrated anything.
  followups:
  - How did you validate equivalence?
  - What was the riskiest step?
  common_errors:
  - 'Falling into the weak pattern: has not migrated anything.'

- external_key: resume_screening.stack_depth.observability_instrumentation
  competency_key: observability
  topic: Instrumenting
  difficulty: medium
  text: How have you added logging, metrics or tracing to something built with your main technology?
  expected_concepts:
  - what to log
  - metric choice
  - cardinality or volume
  - usefulness in incidents
  rubric:
    excellent: Describes instrumentation choices, volume concerns and an incident where it helped.
    good: Added logging in places.
    weak: Did not instrument.
  followups:
  - What was useless noise?
  - What did you wish you logged?
  common_errors:
  - 'Falling into the weak pattern: did not instrument.'

- external_key: resume_screening.stack_depth.code_review_in_stack
  competency_key: code_quality
  topic: Reviewing others' work
  difficulty: medium
  text: When you review code or configuration in your main technology, what do you look for first?
  expected_concepts:
  - correctness
  - safety
  - readability
  - performance
  rubric:
    excellent: Lists specific things to check in that technology and gives examples of issues found.
    good: Looks at general quality.
    weak: Approves without a method.
  followups:
  - What is the commonest issue you flag?
  - What did you miss once?
  common_errors:
  - 'Falling into the weak pattern: approves without a method.'

- external_key: resume_screening.stack_depth.own_tooling_built
  competency_key: code_quality
  topic: Tools you built
  difficulty: medium
  text: Have you built small tools, scripts or libraries around your main technology? What did they do?
  expected_concepts:
  - need
  - design
  - users
  - maintenance
  rubric:
    excellent: Describes a tool they built, who used it and how it was maintained.
    good: Wrote scripts for personal use.
    weak: Never built any.
  followups:
  - Who used it?
  - What would you rewrite?
  common_errors:
  - 'Falling into the weak pattern: never built any.'

- external_key: resume_screening.stack_depth.edge_case_you_know
  competency_key: debugging
  topic: Obscure behaviour
  difficulty: hard
  text: What is a surprising or obscure behaviour of your main technology that you learned the hard way?
  expected_concepts:
  - the behaviour
  - how it surfaced
  - the lesson
  - guarding against it
  rubric:
    excellent: Describes a specific surprising behaviour, how it appeared and how they now protect against
      it.
    good: Describes a smaller surprise.
    weak: Cannot recall any.
  followups:
  - How did you discover it?
  - Did you document it for others?
  common_errors:
  - 'Falling into the weak pattern: cannot recall any.'

- external_key: resume_screening.stack_depth.fundamentals_behind_the_tool
  competency_key: data_structures
  topic: Fundamentals
  difficulty: hard
  text: "Which underlying computer science or systems concept does your main technology depend on most,\
    \ and how does it show up in your work?"
  expected_concepts:
  - identifying the concept
  - connection to behaviour
  - practical consequence
  - examples
  rubric:
    excellent: Names the concept, connects it to observed behaviour and gives a practical consequence.
    good: Names a concept with a loose link.
    weak: Cannot connect tools to fundamentals.
  followups:
  - Where did that matter in practice?
  - What would you check if it went wrong?
  common_errors:
  - 'Falling into the weak pattern: cannot connect tools to fundamentals.'

- external_key: resume_screening.stack_depth.explain_to_junior_depth
  competency_key: mentoring
  topic: Explaining a hard concept
  difficulty: medium
  text: What concept in your main technology do people find hardest, and how would you explain it?
  expected_concepts:
  - identifying the concept
  - analogy or example
  - common misunderstandings
  - checking understanding
  rubric:
    excellent: Identifies a hard concept, explains it clearly with an example and anticipates misunderstandings.
    good: Explains it adequately.
    weak: Cannot explain without jargon.
  followups:
  - What example works best?
  - How do you know they understood?
  common_errors:
  - 'Falling into the weak pattern: cannot explain without jargon.'

- external_key: resume_screening.stack_depth.backup_and_recovery_stack
  competency_key: incident_response
  topic: Recovery
  difficulty: hard
  text: "For a system built on your listed technologies, what would recovery look like after a serious\
    \ failure, and what have you done to prepare?"
  expected_concepts:
  - backups or redundancy
  - recovery steps
  - rehearsal
  - recovery targets
  rubric:
    excellent: "Describes concrete recovery steps, what was rehearsed and how recovery targets were defined\
      \ and checked."
    good: Knows the backup approach in general.
    weak: Assumes recovery is handled elsewhere.
  followups:
  - When did you last test it?
  - What would be lost?
  common_errors:
  - 'Falling into the weak pattern: assumes recovery is handled elsewhere.'
