# Curated questions: resume screening, project_ownership. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.project_ownership.change_if_redoing
  competency_key: ownership
  topic: Would do differently
  difficulty: easy
  text: If you ran that project again, what is the one thing you would do differently and why?
  expected_concepts:
  - specific change
  - reasoning
  - evidence it would help
  - learning
  rubric:
    excellent: "Names a specific change with reasoning tied to what happened and shows it has since influenced\
      \ their work."
    good: Names a sensible change with general reasoning.
    weak: Says they would change nothing or gives a vague answer.
  followups:
  - When did you realise it?
  - Have you applied that since?
  common_errors:
  - Saying everything went well and offering no change.

- external_key: resume_screening.project_ownership.explain_how_it_works
  competency_key: system_design
  topic: Explaining the internals
  difficulty: medium
  text: "Pick the part of the project you built and explain how it works inside, as if to a new colleague\
    \ taking it over."
  expected_concepts:
  - structure of the component
  - main flows
  - important edge cases
  - reasoning behind design choices
  rubric:
    excellent: "Explains the structure and flows fluently, covers edge cases and design choices and adapts\
      \ to questions."
    good: Explains the main flow with limited detail on edge cases.
    weak: Explains at a surface level and cannot go deeper.
  followups:
  - What breaks first under load?
  - Where is the trickiest logic?
  common_errors:
  - Repeating the summary on the resume instead of explaining the mechanics.

- external_key: resume_screening.project_ownership.riskiest_part
  competency_key: problem_solving
  topic: Riskiest component
  difficulty: medium
  text: Which part of what you delivered was the riskiest, and what did you do to reduce that risk?
  expected_concepts:
  - risk identification
  - mitigation
  - testing
  - monitoring
  rubric:
    excellent: Identifies a specific risky part, explains why and describes mitigation, tests and monitoring.
    good: Identifies a risk and general mitigation.
    weak: Cannot name a risk.
  followups:
  - Did the risk materialise?
  - What remains risky?
  common_errors:
  - 'Falling into the weak pattern: cannot name a risk.'

- external_key: resume_screening.project_ownership.leading_without_title
  competency_key: leadership
  topic: Leading informally
  difficulty: medium
  text: Did you lead others on the project without being their manager? How did you get things done?
  expected_concepts:
  - influence
  - clarity of direction
  - supporting others
  - accountability
  rubric:
    excellent: Gives a concrete case of directing work through clarity and support, with examples of outcomes.
    good: Coordinated others in a general way.
    weak: Cannot describe how they influenced others.
  followups:
  - Who followed you most readily?
  - Who was resistant?
  common_errors:
  - 'Falling into the weak pattern: cannot describe how they influenced others.'

- external_key: resume_screening.project_ownership.mentoring_on_project
  competency_key: mentoring
  topic: Helping others grow
  difficulty: medium
  text: Whom did you help to grow during the project and how did you do it?
  expected_concepts:
  - identifying needs
  - guidance
  - delegating
  - observing progress
  rubric:
    excellent: Describes specific people and support given, delegated tasks and visible growth.
    good: Helped colleagues informally.
    weak: Did not help others.
  followups:
  - What did they struggle with?
  - What did you learn from it?
  common_errors:
  - 'Falling into the weak pattern: did not help others.'

- external_key: resume_screening.project_ownership.delegation_example
  competency_key: leadership
  topic: Delegating work
  difficulty: medium
  text: Which part of the project did you delegate and how did you make sure it was done well?
  expected_concepts:
  - choosing tasks
  - setting expectations
  - checking in
  - accepting different approaches
  rubric:
    excellent: "Describes selecting suitable tasks, clear expectations, light-touch check-ins and how\
      \ outcomes were reviewed."
    good: Delegated tasks with some follow-up.
    weak: Kept everything to themselves or delegated without follow-up.
  followups:
  - What did you keep and why?
  - What went wrong when delegating?
  common_errors:
  - 'Falling into the weak pattern: kept everything to themselves or delegated without follow-up.'

- external_key: resume_screening.project_ownership.ambiguous_problem_start
  competency_key: problem_solving
  topic: Ambiguity at the start
  difficulty: medium
  text: How clear was the problem when you began, and what did you do to make it clearer?
  expected_concepts:
  - asking questions
  - framing
  - prototypes
  - agreeing scope
  rubric:
    excellent: "Describes concrete steps to clarify the problem such as interviews or prototypes and how\
      \ they agreed the scope."
    good: Asked questions and refined the scope gradually.
    weak: Waited for others to clarify.
  followups:
  - What was the biggest unknown?
  - What did you try first?
  common_errors:
  - 'Falling into the weak pattern: waited for others to clarify.'

- external_key: resume_screening.project_ownership.proof_it_was_hard
  competency_key: problem_solving
  topic: Difficulty of the work
  difficulty: hard
  text: "What made that project technically or organisationally difficult, and how did you handle that\
    \ difficulty?"
  expected_concepts:
  - identifying difficulty
  - approach
  - support used
  - results
  rubric:
    excellent: Specifies real difficulties, the techniques or arrangements used and the results.
    good: Describes difficulty and a general response.
    weak: Describes the project as straightforward or exaggerates difficulty without specifics.
  followups:
  - What nearly stopped the project?
  - What was the hardest technical piece?
  common_errors:
  - "Falling into the weak pattern: describes the project as straightforward or exaggerates difficulty\
    \ without specifics."

- external_key: resume_screening.project_ownership.accountability_when_failed
  competency_key: ownership
  topic: Taking responsibility
  difficulty: hard
  text: When something on your project went wrong, how did you take responsibility and what did you do
    next?
  expected_concepts:
  - acknowledging
  - acting on the problem
  - informing others
  - preventing recurrence
  rubric:
    excellent: "Describes owning the issue promptly, acting to fix it, informing stakeholders and preventing\
      \ recurrence."
    good: Accepted partial responsibility and fixed the problem.
    weak: Blamed others or circumstances.
  followups:
  - What did you say to the team?
  - What did you change?
  common_errors:
  - 'Falling into the weak pattern: blamed others or circumstances.'

- external_key: resume_screening.project_ownership.credit_to_team
  competency_key: collaboration
  topic: Sharing success
  difficulty: easy
  text: Who contributed to the project in ways that may not show on a resume, and what did they do?
  expected_concepts:
  - naming contributions
  - specific actions
  - recognising support roles
  - recognising impact
  rubric:
    excellent: Names several contributors in various roles with specific contributions.
    good: Names a few collaborators.
    weak: Cannot name others.
  followups:
  - Did you tell their managers?
  - Who would you want on the next project?
  common_errors:
  - 'Falling into the weak pattern: cannot name others.'

- external_key: resume_screening.project_ownership.future_of_the_project
  competency_key: product_sense
  topic: Where it went next
  difficulty: easy
  text: Where did the project go after you finished, and what would you recommend to its next owner?
  expected_concepts:
  - current state
  - recommendations
  - known issues
  - value delivered
  rubric:
    excellent: Describes the current state, known issues and clear recommendations for the next owner.
    good: Knows the state in general.
    weak: Has no knowledge of its future.
  followups:
  - What should they fix first?
  - What should they leave alone?
  common_errors:
  - 'Falling into the weak pattern: has no knowledge of its future.'

- external_key: resume_screening.project_ownership.skills_gained
  competency_key: adaptability
  topic: What the project taught you
  difficulty: easy
  text: What skill did you gain from the project that you did not have when you started?
  expected_concepts:
  - specific skill
  - how it was learned
  - application later
  - evidence
  rubric:
    excellent: Names a specific skill, how they learned it and where they later applied it.
    good: Names a general skill.
    weak: Cannot name anything gained.
  followups:
  - Who taught you?
  - Where did you use it next?
  common_errors:
  - 'Falling into the weak pattern: cannot name anything gained.'

- external_key: resume_screening.project_ownership.wrong_about_something
  competency_key: adaptability
  topic: Being wrong
  difficulty: medium
  text: What did you believe at the start of the project that turned out to be wrong?
  expected_concepts:
  - stating the belief
  - evidence that contradicted it
  - adapting
  - effect on the project
  rubric:
    excellent: Names a specific belief, describes the evidence that changed it and how they adapted the
      plan.
    good: Names a belief with a general adjustment.
    weak: Claims nothing was wrong.
  followups:
  - How did you find out?
  - What did it cost?
  common_errors:
  - 'Falling into the weak pattern: claims nothing was wrong.'

- external_key: resume_screening.project_ownership.similar_project_today
  competency_key: problem_solving
  topic: Transferability
  difficulty: medium
  text: If you were handed a similar project today with half the time, how would you approach it?
  expected_concepts:
  - priorities
  - reuse
  - scope control
  - risk focus
  rubric:
    excellent: "Describes sharper prioritisation, reuse of earlier work and scope control, explaining\
      \ what would be dropped."
    good: Would work faster and cut some scope.
    weak: Would simply work harder.
  followups:
  - What would you cut first?
  - Which risk would you accept?
  common_errors:
  - 'Falling into the weak pattern: would simply work harder.'

- external_key: resume_screening.project_ownership.team_conflict_on_project
  competency_key: collaboration
  topic: Team friction
  difficulty: medium
  text: Was there friction within the team on that project? What was your part in resolving it?
  expected_concepts:
  - identifying the issue
  - conversations
  - resolution
  - maintaining working relationships
  rubric:
    excellent: Describes the friction, their role in talking with those involved and the resolution that
      held.
    good: Described a minor friction and a reasonable response.
    weak: Claims no friction or avoided involvement.
  followups:
  - What changed afterwards?
  - What did the other person need?
  common_errors:
  - 'Falling into the weak pattern: claims no friction or avoided involvement.'

- external_key: resume_screening.project_ownership.customer_facing_part
  competency_key: customer_communication
  topic: Customer contact
  difficulty: medium
  text: "Did you deal directly with customers or users on the project? Describe a conversation that changed\
    \ what you built."
  expected_concepts:
  - listening
  - clarifying needs
  - feeding back to the team
  - closing the loop
  rubric:
    excellent: Describes a specific conversation, what was learned and how it changed the work.
    good: Had customer contact with some effect.
    weak: Had no direct contact.
  followups:
  - What did the customer say that you did not expect?
  - How did you tell the team?
  common_errors:
  - 'Falling into the weak pattern: had no direct contact.'

- external_key: resume_screening.project_ownership.priorities_among_projects
  competency_key: project_management
  topic: Multiple commitments
  difficulty: medium
  text: "Were you working on several things at once during that project? How did you prioritise and communicate\
    \ your availability?"
  expected_concepts:
  - criteria
  - communication
  - limits
  - outcomes
  rubric:
    excellent: Describes criteria for prioritising, explicit communication and protected time for the
      project.
    good: Balanced tasks reasonably.
    weak: Overcommitted without telling anyone.
  followups:
  - What did you drop?
  - How did people know?
  common_errors:
  - 'Falling into the weak pattern: overcommitted without telling anyone.'

- external_key: resume_screening.project_ownership.innovation_or_improvement
  competency_key: problem_solving
  topic: Original contribution
  difficulty: medium
  text: "What was one original idea or improvement you brought to the project that was not in the original\
    \ plan?"
  expected_concepts:
  - the idea
  - why it mattered
  - how it was adopted
  - results
  rubric:
    excellent: Describes the idea, how they argued for it, how it was adopted and the result.
    good: Describes a small improvement.
    weak: Followed the plan with no additions.
  followups:
  - Who supported it?
  - Did it work as expected?
  common_errors:
  - 'Falling into the weak pattern: followed the plan with no additions.'

- external_key: resume_screening.project_ownership.sustained_ownership_signs
  competency_key: ownership
  topic: Ownership behaviours
  difficulty: hard
  text: What shows, in how you worked, that you owned the outcome of the project and not only your tasks?
  expected_concepts:
  - acting beyond the assigned task
  - following up on outcomes
  - fixing gaps in others' work
  - accountability
  rubric:
    excellent: "Gives concrete behaviours such as following outcomes through, covering missing work and\
      \ answering for results."
    good: Gives general examples of initiative.
    weak: Describes only completing assigned tasks.
  followups:
  - Which task was not yours but you did it?
  - Who noticed?
  common_errors:
  - 'Falling into the weak pattern: describes only completing assigned tasks.'

- external_key: resume_screening.project_ownership.what_you_would_hand_off
  competency_key: leadership
  topic: Letting go
  difficulty: hard
  text: Which part of the project would you hand to someone else next time to grow them, and why?
  expected_concepts:
  - identifying growth opportunities
  - support
  - risk
  - overall outcome
  rubric:
    excellent: Identifies a specific part, a person's growth need and the support to keep risk low.
    good: Would delegate something with a general reason.
    weak: Would keep everything.
  followups:
  - How would you support them?
  - What would you watch for?
  common_errors:
  - 'Falling into the weak pattern: would keep everything.'

- external_key: resume_screening.project_ownership.verify_claim_with_artefacts
  competency_key: communication
  topic: Showing the work
  difficulty: medium
  text: "If you could show me one artefact from that project, such as a design, a dashboard or a report,\
    \ which one would it be and what does it show?"
  expected_concepts:
  - choosing an artefact
  - what it shows
  - their role in creating it
  - limits
  rubric:
    excellent: Chooses an artefact clearly linked to their role and explains what it shows and what it
      does not.
    good: Chooses an artefact and describes it generally.
    weak: Cannot name one.
  followups:
  - Who else contributed to it?
  - What is missing from it?
  common_errors:
  - 'Falling into the weak pattern: cannot name one.'

- external_key: resume_screening.project_ownership.balance_speed_and_care
  competency_key: code_quality
  topic: Speed versus care
  difficulty: medium
  text: How did you balance moving fast with doing things carefully on that project?
  expected_concepts:
  - risk-based approach
  - reversible decisions
  - reviews
  - communication
  rubric:
    excellent: "Explains distinguishing reversible from risky work, applying more care to the latter and\
      \ giving examples."
    good: Balanced based on deadlines.
    weak: Always went fast or always slow.
  followups:
  - Where did you slow down?
  - Where did you cut corners knowingly?
  common_errors:
  - 'Falling into the weak pattern: always went fast or always slow.'

- external_key: resume_screening.project_ownership.external_recognition
  competency_key: ownership
  topic: Feedback on the project
  difficulty: easy
  text: What feedback did you receive about your work on the project from users, peers or managers?
  expected_concepts:
  - specific feedback
  - sources
  - action taken
  - reflection
  rubric:
    excellent: Cites specific feedback from different sources and what they did with it.
    good: Received general positive feedback.
    weak: Received none or cannot recall.
  followups:
  - What was the critical feedback?
  - What changed because of it?
  common_errors:
  - 'Falling into the weak pattern: received none or cannot recall.'

- external_key: resume_screening.project_ownership.one_more_example
  competency_key: ownership
  topic: Second example
  difficulty: medium
  text: "Think of a second project of a different kind from the first one. What was your role there and\
    \ how did it differ?"
  expected_concepts:
  - contrast in roles
  - consistency in approach
  - adaptation
  - results
  rubric:
    excellent: Describes a second project, contrasts roles and shows consistent ownership habits.
    good: Describes a second project with a similar role.
    weak: Has only one example.
  followups:
  - Which taught you more?
  - Where did you lead more?
  common_errors:
  - 'Falling into the weak pattern: has only one example.'

- external_key: resume_screening.project_ownership.knowledge_transfer_before_leaving
  competency_key: communication
  topic: Sharing knowledge
  difficulty: medium
  text: How did you make sure knowledge about the project did not live only in your head?
  expected_concepts:
  - documentation
  - pairing
  - demos
  - checking understanding
  rubric:
    excellent: Describes documents, pairing and demos and how they confirmed others could continue without
      them.
    good: Wrote some documents and answered questions.
    weak: Held knowledge personally.
  followups:
  - Who could take over today?
  - What was hardest to write down?
  common_errors:
  - 'Falling into the weak pattern: held knowledge personally.'
