# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [devops, sre, platform, cloud, network, dba, security]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.infrastructure_claims.kafka_redis_ops
    competency_key: distributed_systems
    topic: "Operating messaging or cache clusters"
    difficulty: medium
    text: "You operated a message broker, cache or search cluster. What was the failure mode that taught you the most about running it?"
    expected_concepts:
      - "normal operating limits"
      - "failure observed"
      - "diagnosis"
      - "tuning or redesign"
      - "monitoring added"
    rubric:
      excellent: "Describes a specific failure, how it was diagnosed from metrics, and the configuration or design change that followed."
      good: "Describes an incident and fix."
      weak: "Used defaults and treats it as a black box."
    followups:
      - "What metric warned you?"
      - "What setting would you change first?"
    common_errors:
      - "Used defaults and treats it as a black box."

  - external_key: resume_screening.infrastructure_claims.serverless_adoption
    competency_key: aws
    topic: "Serverless or managed services"
    difficulty: medium
    text: "You moved something to serverless or a managed service. Which limits or costs surprised you after the move?"
    expected_concepts:
      - "reason for the move"
      - "limits such as cold starts and timeouts"
      - "cost at scale"
      - "observability"
      - "reversal options"
    rubric:
      excellent: "Explains motivation, finds real limits and cost changes, and describes how observability was handled."
      good: "Describes the move and benefits."
      weak: "Assumed managed means no operational work."
    followups:
      - "What did it cost at peak?"
      - "Would you move it back?"
    common_errors:
      - "Assumed managed means no operational work."

  - external_key: resume_screening.infrastructure_claims.cdn_edge_caching
    competency_key: networking
    topic: "Content delivery and edge"
    difficulty: easy
    text: "You configured a CDN or edge layer. How did you decide what to cache and how did you handle invalidating content?"
    expected_concepts:
      - "cache keys and rules"
      - "headers"
      - "invalidation approach"
      - "hit-rate monitoring"
      - "problems found"
    rubric:
      excellent: "Sets rules by content type, manages invalidation and tracks hit rate with an example of a caching mistake."
      good: "Describes rules and hit rate."
      weak: "Cached everything with the vendor defaults."
    followups:
      - "What did you accidentally cache?"
      - "What was the hit rate?"
    common_errors:
      - "Cached everything with the vendor defaults."

  - external_key: resume_screening.infrastructure_claims.waf_ddos_protection
    competency_key: security
    topic: "Edge protection"
    difficulty: medium
    text: "You set up web protection against abusive traffic. How did you tune rules so real users were not blocked?"
    expected_concepts:
      - "detection mode first"
      - "rule tuning"
      - "false positive handling"
      - "attack handling during events"
      - "metrics"
    rubric:
      excellent: "Starts in monitoring mode, tunes against real traffic, handles false positives and reviews during real attacks."
      good: "Describes rules and tuning."
      weak: "Turned on all managed rules in block mode."
    followups:
      - "What legitimate traffic was blocked?"
      - "How did you respond to a real attack?"
    common_errors:
      - "Turned on all managed rules in block mode."

  - external_key: resume_screening.infrastructure_claims.policy_as_code
    competency_key: security
    topic: "Automated policy enforcement"
    difficulty: medium
    text: "You introduced policy checks on infrastructure or deployments. What was the first policy that blocked someone, and how was it received?"
    expected_concepts:
      - "choosing policies"
      - "warn versus block"
      - "developer feedback"
      - "exceptions"
      - "maintenance"
    rubric:
      excellent: "Starts with warnings, explains blocks, supports exceptions and updates policies from feedback."
      good: "Describes policies."
      weak: "Blocked everything on day one."
    followups:
      - "Which policy did you remove?"
      - "How are exceptions reviewed?"
    common_errors:
      - "Blocked everything on day one."

  - external_key: resume_screening.infrastructure_claims.encryption_key_management
    competency_key: security
    topic: "Encryption and key handling"
    difficulty: medium
    text: "You managed encryption keys or certificates for data at rest or in transit. How did you plan for rotation and for a key being lost?"
    expected_concepts:
      - "key hierarchy"
      - "rotation"
      - "access control"
      - "recovery"
      - "audit"
    rubric:
      excellent: "Uses managed keys with rotation, limited access, recovery plans and audit logs."
      good: "Describes key use and rotation."
      weak: "Stored keys next to the data."
    followups:
      - "What happens if a key is destroyed?"
      - "Who can use the key?"
    common_errors:
      - "Stored keys next to the data."

  - external_key: resume_screening.infrastructure_claims.audit_logging_siem
    competency_key: security
    topic: "Security logging"
    difficulty: medium
    text: "You built centralised security logging. How did you decide which sources mattered, and what investigation did it make possible?"
    expected_concepts:
      - "source selection"
      - "normalisation"
      - "retention"
      - "use cases"
      - "access controls"
    rubric:
      excellent: "Picks sources by use case, retains appropriately, protects the logs and shows an investigation they enabled."
      good: "Describes sources and storage."
      weak: "Collected everything without use cases."
    followups:
      - "What source was missing?"
      - "Who reviews the data?"
    common_errors:
      - "Collected everything without use cases."

  - external_key: resume_screening.infrastructure_claims.api_gateway_rate_limits
    competency_key: api_design
    topic: "API gateway and rate limiting"
    difficulty: medium
    text: "You ran an API gateway or rate limiting layer. How did you choose limits, and what happened to a legitimate client that hit them?"
    expected_concepts:
      - "limit design"
      - "fairness across clients"
      - "response behaviour"
      - "communication"
      - "monitoring"
    rubric:
      excellent: "Sets limits from usage data, communicates clearly and monitors for legitimate clients hit by limits."
      good: "Describes limits."
      weak: "Used one global limit."
    followups:
      - "Which client was affected?"
      - "How did you adjust?"
    common_errors:
      - "Used one global limit."

  - external_key: resume_screening.infrastructure_claims.object_storage_lifecycle
    competency_key: cloud_cost_optimization
    topic: "Storage lifecycle"
    difficulty: easy
    text: "You managed storage growth. What rules did you use for moving or removing old data, and who agreed to them?"
    expected_concepts:
      - "retention requirements"
      - "tiering"
      - "deletion approval"
      - "verifying"
      - "cost effect"
    rubric:
      excellent: "Sets rules from retention needs, has owner agreement, verifies and quantifies savings."
      good: "Describes rules."
      weak: "Deleted data without owner agreement."
    followups:
      - "What was the policy for backups?"
      - "How did you check what was safe?"
    common_errors:
      - "Deleted data without owner agreement."

  - external_key: resume_screening.infrastructure_claims.fleet_config_management
    competency_key: linux
    topic: "Configuration management"
    difficulty: medium
    text: "You used a configuration management tool across many machines. How did you test changes before they reached everything?"
    expected_concepts:
      - "staging"
      - "canary hosts"
      - "idempotency"
      - "drift"
      - "review"
    rubric:
      excellent: "Tests in staging, rolls out to canaries, ensures idempotency and reviews changes."
      good: "Describes tool and testing."
      weak: "Applied changes directly to production."
    followups:
      - "What was the worst change?"
      - "How did you roll back?"
    common_errors:
      - "Applied changes directly to production."

  - external_key: resume_screening.infrastructure_claims.vm_to_container_move
    competency_key: docker
    topic: "Containerising applications"
    difficulty: easy
    text: "You containerised existing applications. What was the hardest application to move and what made it hard?"
    expected_concepts:
      - "configuration and state"
      - "dependencies"
      - "networking"
      - "build"
      - "runtime differences"
    rubric:
      excellent: "Names a specific application with state or dependency difficulties and the solution."
      good: "Describes the process."
      weak: "Lifted the VM into a container unchanged."
    followups:
      - "What data did it hold?"
      - "How did you handle configuration?"
    common_errors:
      - "Lifted the VM into a container unchanged."

  - external_key: resume_screening.infrastructure_claims.release_engineering_artifacts
    competency_key: ci_cd
    topic: "Artifact management"
    difficulty: medium
    text: "You handled build artifacts or package registries. How did you make sure what was deployed could be traced back to the source?"
    expected_concepts:
      - "versioning"
      - "immutability"
      - "provenance"
      - "retention"
      - "promotion between environments"
    rubric:
      excellent: "Uses immutable versioned artifacts with traceability from source and promotion rather than rebuilds."
      good: "Describes registry and versioning."
      weak: "Rebuilt per environment."
    followups:
      - "How do you find the commit of a running version?"
      - "What do you retain?"
    common_errors:
      - "Rebuilt per environment."

  - external_key: resume_screening.infrastructure_claims.build_farm_scaling
    competency_key: ci_cd
    topic: "Build capacity"
    difficulty: medium
    text: "You scaled build or test infrastructure. How did you balance cost and waiting time for developers?"
    expected_concepts:
      - "queue time measurement"
      - "autoscaling"
      - "caching"
      - "cost"
      - "developer feedback"
    rubric:
      excellent: "Measures queue time, scales runners, caches and balances against cost using data."
      good: "Describes scaling."
      weak: "Overprovisioned permanently."
    followups:
      - "What was the queue time?"
      - "What did it cost?"
    common_errors:
      - "Overprovisioned permanently."

  - external_key: resume_screening.infrastructure_claims.sla_reporting
    competency_key: stakeholder_management
    topic: "Reporting to stakeholders"
    difficulty: easy
    text: "You reported availability or incident information to non-technical stakeholders. How did you decide what to tell them and how often?"
    expected_concepts:
      - "audience needs"
      - "clear metrics"
      - "plain language"
      - "cadence"
      - "trust"
    rubric:
      excellent: "Tailors metrics to audience, uses plain language, sets cadence and builds trust."
      good: "Describes reporting."
      weak: "Sends raw technical data."
    followups:
      - "What did they ask that surprised you?"
      - "What did you stop reporting?"
    common_errors:
      - "Sends raw technical data."

  - external_key: resume_screening.infrastructure_claims.vendor_outage_handling
    competency_key: incident_response
    topic: "Third-party outage"
    difficulty: hard
    text: "A provider your platform depended on had an outage. What could you do during it, and what did you change to be less exposed?"
    expected_concepts:
      - "detection"
      - "communication"
      - "workarounds"
      - "contract and provider follow-up"
      - "architecture changes"
    rubric:
      excellent: "Describes detection, mitigation, communication and structural changes to reduce dependence."
      good: "Describes the event and a change."
      weak: "Waited for the provider."
    followups:
      - "What fallback did you have?"
      - "What did the contract say?"
    common_errors:
      - "Waited for the provider."

  - external_key: resume_screening.infrastructure_claims.service_catalog_ownership
    competency_key: system_design
    topic: "Service ownership records"
    difficulty: easy
    text: "You created a service catalogue or ownership records. How did you keep them accurate?"
    expected_concepts:
      - "data source"
      - "automation"
      - "ownership"
      - "use cases"
      - "verification"
    rubric:
      excellent: "Sources from systems automatically, assigns owners, ties to use and verifies regularly."
      good: "Describes the catalogue."
      weak: "Manual spreadsheet."
    followups:
      - "What was out of date?"
      - "Who uses it?"
    common_errors:
      - "Manual spreadsheet."

  - external_key: resume_screening.infrastructure_claims.developer_self_service
    competency_key: system_design
    topic: "Self-service infrastructure"
    difficulty: medium
    text: "You enabled developers to provision infrastructure themselves. What guardrails did you put in place, and what did teams still need to ask you for?"
    expected_concepts:
      - "templates"
      - "limits"
      - "approvals"
      - "cost and security controls"
      - "support"
    rubric:
      excellent: "Provides templates with guardrails, limits and visible costs, and describes remaining requests."
      good: "Describes self-service."
      weak: "Gave unrestricted access."
    followups:
      - "Which guardrail was most contested?"
      - "What did people misuse?"
    common_errors:
      - "Gave unrestricted access."

  - external_key: resume_screening.infrastructure_claims.kernel_os_tuning
    competency_key: linux
    topic: "Low-level performance tuning"
    difficulty: hard
    text: "You tuned operating system or network settings for performance. How did you know a setting was responsible, and how did you confirm it had no side effects?"
    expected_concepts:
      - "measurement"
      - "hypotheses"
      - "isolating variables"
      - "side effects"
      - "documentation"
    rubric:
      excellent: "Measures, changes one variable at a time, checks side effects and documents."
      good: "Describes tuning."
      weak: "Copied settings from a blog."
    followups:
      - "What did the numbers show?"
      - "How did you roll it back?"
    common_errors:
      - "Copied settings from a blog."

  - external_key: resume_screening.infrastructure_claims.database_cost_licence
    competency_key: database_administration
    topic: "Database cost and licensing"
    difficulty: hard
    text: "You reduced database cost, perhaps by changing engine, licence or instance types. What risks did you manage in that change?"
    expected_concepts:
      - "workload analysis"
      - "compatibility"
      - "performance validation"
      - "migration"
      - "savings"
    rubric:
      excellent: "Analyses workload, tests compatibility and performance, migrates safely and confirms savings."
      good: "Describes savings and migration."
      weak: "Switched on price alone."
    followups:
      - "What query behaved differently?"
      - "How was licensing verified?"
    common_errors:
      - "Switched on price alone."

  - external_key: resume_screening.infrastructure_claims.data_retention_compliance
    competency_key: security
    topic: "Retention and deletion policies"
    difficulty: medium
    text: "You implemented retention rules for logs, backups or user data. How did you resolve conflicts between keeping data for investigations and deleting it for privacy?"
    expected_concepts:
      - "policy sources"
      - "legal input"
      - "technical enforcement"
      - "exceptions"
      - "evidence"
    rubric:
      excellent: "Works with legal and security to define policy, enforces it technically and records exceptions."
      good: "Describes retention rules."
      weak: "Kept everything forever."
    followups:
      - "Who decided?"
      - "How is deletion verified?"
    common_errors:
      - "Kept everything forever."

  - external_key: resume_screening.infrastructure_claims.reliability_vs_feature_pressure
    competency_key: stakeholder_management
    topic: "Reliability trade-offs"
    difficulty: hard
    text: "Describe a time you had to push back on a launch or request because of reliability risk. How did you make the case?"
    expected_concepts:
      - "risk evidence"
      - "alternatives"
      - "stakeholders"
      - "decision"
      - "outcome"
    rubric:
      excellent: "Brings evidence, offers alternatives, gets a decision at the right level and tracks the outcome."
      good: "Describes the push back."
      weak: "Says no without data."
    followups:
      - "Who overruled you, if anyone?"
      - "What happened later?"
    common_errors:
      - "Says no without data."

  - external_key: resume_screening.infrastructure_claims.large_scale_automation_impact
    competency_key: ownership
    topic: "Impact of infrastructure work"
    difficulty: hard
    text: "Take the infrastructure project you are proudest of. What would have happened if you had not done it, and how can I verify that?"
    expected_concepts:
      - "counterfactual"
      - "evidence"
      - "stakeholder confirmation"
      - "limits"
      - "personal contribution"
    rubric:
      excellent: "Explains the counterfactual with evidence from people or data and states their own contribution exactly."
      good: "Describes impact."
      weak: "Cannot say what would have been different."
    followups:
      - "Who could confirm?"
      - "What numbers exist?"
    common_errors:
      - "Cannot say what would have been different."

  - external_key: resume_screening.infrastructure_claims.mentoring_ops_juniors
    competency_key: mentoring
    topic: "Training operations staff"
    difficulty: easy
    text: "You trained or mentored colleagues on operations. How did you prepare them to handle incidents without you?"
    expected_concepts:
      - "documentation"
      - "shadowing"
      - "practice"
      - "feedback"
      - "independence"
    rubric:
      excellent: "Uses runbooks, shadowing and simulated incidents, then reduces support."
      good: "Describes training."
      weak: "Remained the escalation point for everything."
    followups:
      - "How did you know they were ready?"
      - "What did they handle first?"
    common_errors:
      - "Remained the escalation point for everything."

  - external_key: resume_screening.infrastructure_claims.tool_consolidation
    competency_key: ownership
    topic: "Consolidating tools"
    difficulty: medium
    text: "You consolidated tools or platforms. How did you handle the teams that depended on the ones you removed?"
    expected_concepts:
      - "inventory"
      - "migration support"
      - "timeline"
      - "resistance"
      - "outcome"
    rubric:
      excellent: "Inventories users, supports migration, sets timeline and addresses resistance."
      good: "Describes the consolidation."
      weak: "Announced removal date only."
    followups:
      - "Who objected?"
      - "What was left?"
    common_errors:
      - "Announced removal date only."

  - external_key: resume_screening.infrastructure_claims.learning_from_cert_lab
    competency_key: adaptability
    topic: "Applying new cloud knowledge"
    difficulty: easy
    text: "You list cloud or infrastructure training. Which thing you learned there did you apply at work, and what did it change?"
    expected_concepts:
      - "specific concept"
      - "application"
      - "result"
      - "limits of the course"
      - "further learning"
    rubric:
      excellent: "Names a concrete concept applied to real work with a result."
      good: "Describes use."
      weak: "Lists the certificate only."
    followups:
      - "What did the course not cover?"
      - "What would you learn next?"
    common_errors:
      - "Lists the certificate only."
