# Curated questions: resume screening, quantified_impact. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.quantified_impact.did_it_last
  competency_key: ownership
  topic: Durability of a result
  difficulty: easy
  text: "Did the result on your resume last? What does the same number look like now compared with when\
    \ you finished?"
  expected_concepts:
  - sustained versus temporary gain
  - monitoring afterwards
  - regression causes
  - handover
  rubric:
    excellent: "Describes how the figure held up after delivery, how it was monitored and what was done\
      \ when it slipped."
    good: Believes it held but has limited follow-up data.
    weak: Never checked after the project ended.
  followups:
  - Who watches it now?
  - Did anything undo the gain?
  common_errors:
  - Reporting a peak value and never checking later.

- external_key: resume_screening.quantified_impact.cost_of_the_improvement
  competency_key: problem_solving
  topic: What the gain cost
  difficulty: medium
  text: What did it cost, in effort, complexity or other trade-offs, to get the result you describe?
  expected_concepts:
  - effort invested
  - added complexity or maintenance
  - trade-offs accepted
  - net benefit
  rubric:
    excellent: "Names the investment and the trade-offs, weighs them against the benefit and says whether\
      \ they would pay it again."
    good: Mentions effort and one trade-off.
    weak: Presents the gain as free of any cost.
  followups:
  - Was the net benefit still clearly positive?
  - What would you do differently to lower the cost?
  common_errors:
  - Quoting the benefit without the effort or complexity it brought.

- external_key: resume_screening.quantified_impact.side_effects_checked
  competency_key: problem_solving
  topic: Unintended consequences
  difficulty: medium
  text: What side effects did you look for after making the change and did you find any?
  expected_concepts:
  - guardrail metrics
  - adjacent systems
  - user complaints
  - rollback readiness
  rubric:
    excellent: Lists guardrail metrics watched, describes a real side effect found and the response.
    good: Watched a couple of other metrics and found nothing serious.
    weak: Only watched the target metric.
  followups:
  - Which guardrail mattered most?
  - What would have triggered a rollback?
  common_errors:
  - 'Falling into the weak pattern: only watched the target metric.'

- external_key: resume_screening.quantified_impact.vanity_metric_awareness
  competency_key: data_analysis
  topic: Vanity metrics
  difficulty: medium
  text: "Which numbers on a typical resume are impressive but do not really show impact, and how do you\
    \ avoid using them?"
  expected_concepts:
  - spotting vanity figures
  - outcome-focused measures
  - context for volumes
  - linking to goals
  rubric:
    excellent: "Gives clear examples of vanity metrics, explains outcome-based alternatives and shows\
      \ how they choose measures tied to goals."
    good: Understands the idea with a basic example.
    weak: Cannot distinguish impressive numbers from meaningful ones.
  followups:
  - Which of your own numbers is closest to vanity?
  - What would you use instead?
  common_errors:
  - 'Falling into the weak pattern: cannot distinguish impressive numbers from meaningful ones.'

- external_key: resume_screening.quantified_impact.number_target_vs_actual
  competency_key: ownership
  topic: Target versus achieved
  difficulty: easy
  text: What was the target for the result you describe, and where did you land against it?
  expected_concepts:
  - stated target
  - actual result
  - reasons for difference
  - communicating progress
  rubric:
    excellent: "States the original target, the actual outcome with clear reasoning for any difference\
      \ and how progress was reported."
    good: Knows the target and the outcome roughly.
    weak: Did not have a target or cannot remember the outcome.
  followups:
  - Who set the target?
  - What would you do if you missed it?
  common_errors:
  - 'Falling into the weak pattern: did not have a target or cannot remember the outcome.'

- external_key: resume_screening.quantified_impact.result_below_expectations
  competency_key: ownership
  topic: Falling short
  difficulty: medium
  text: "Tell me about a time a measured result came out below what you claimed or hoped for. How did\
    \ you report it?"
  expected_concepts:
  - reporting a shortfall promptly
  - analysing the cause
  - adjusting the claim
  - next steps
  rubric:
    excellent: "Gives a real example, shows they reported the lower figure directly, analysed the cause\
      \ and planned next steps."
    good: Describes a modest shortfall and a standard response.
    weak: Cannot recall one or explains it away.
  followups:
  - How did stakeholders react?
  - What did you change in your approach?
  common_errors:
  - 'Falling into the weak pattern: cannot recall one or explains it away.'

- external_key: resume_screening.quantified_impact.present_to_non_experts
  competency_key: communication
  topic: Explaining a number simply
  difficulty: easy
  text: "How would you explain the main figure on your resume to someone outside your field so they understand\
    \ why it matters?"
  expected_concepts:
  - plain language
  - comparison to everyday terms
  - stating the why
  - avoiding jargon
  rubric:
    excellent: Gives a clear plain-language explanation with a relatable comparison and the reason it
      mattered.
    good: Explains it clearly but still uses some jargon.
    weak: Relies on technical terms or restates the number without meaning.
  followups:
  - What question would a non-expert ask?
  - How would you draw it?
  common_errors:
  - 'Falling into the weak pattern: relies on technical terms or restates the number without meaning.'

- external_key: resume_screening.quantified_impact.reporting_cadence
  competency_key: communication
  topic: Reporting results over time
  difficulty: easy
  text: How did you keep stakeholders informed about the numbers while the work was in progress?
  expected_concepts:
  - regular updates
  - consistent metrics
  - early warnings
  - simple visuals
  rubric:
    excellent: "Describes a regular rhythm with consistent metrics, including early warnings when numbers\
      \ moved the wrong way."
    good: Gave periodic updates with reasonable detail.
    weak: Reported only at the end of the project.
  followups:
  - What did the first update look like?
  - What triggered an extra update?
  common_errors:
  - 'Falling into the weak pattern: reported only at the end of the project.'

- external_key: resume_screening.quantified_impact.estimate_before_work
  competency_key: problem_solving
  topic: Predicting the gain
  difficulty: medium
  text: "Before starting the work behind your best number, did you predict the size of the benefit? How\
    \ close was your prediction?"
  expected_concepts:
  - forecasting impact upfront
  - assumptions
  - comparing with actual
  - learning for future estimates
  rubric:
    excellent: "Describes the prediction and assumptions, compares with the actual result and explains\
      \ what they learned for future estimates."
    good: Had a rough expectation and compared it afterwards.
    weak: Did not estimate in advance.
  followups:
  - Which assumption was most wrong?
  - How did that change your next estimate?
  common_errors:
  - 'Falling into the weak pattern: did not estimate in advance.'

- external_key: resume_screening.quantified_impact.reasons_for_success_factors
  competency_key: problem_solving
  topic: Why it worked
  difficulty: medium
  text: Looking back, which decisions had the greatest effect on the number you achieved?
  expected_concepts:
  - identifying key decisions
  - evidence for their effect
  - things that were not helpful
  - generalising lessons
  rubric:
    excellent: "Identifies two or three decisions with evidence of effect and distinguishes them from\
      \ activities that did not help."
    good: Names key decisions with a plausible rationale.
    weak: Describes the work chronologically without isolating what mattered.
  followups:
  - What was wasted effort?
  - Which decision would you repeat?
  common_errors:
  - 'Falling into the weak pattern: describes the work chronologically without isolating what mattered.'

- external_key: resume_screening.quantified_impact.approach_reuse
  competency_key: problem_solving
  topic: Repeating the approach
  difficulty: medium
  text: "Have you used the same approach to get a similar result somewhere else? What was different the\
    \ second time?"
  expected_concepts:
  - transferability of the approach
  - adapting to context
  - results of repetition
  - lessons about limits
  rubric:
    excellent: Gives a second case, explains how context changed the approach and compares results with
      the first.
    good: Applied it again with similar results and few changes.
    weak: Has not repeated it or thinks it would work anywhere unchanged.
  followups:
  - What did not transfer?
  - What made the second case harder?
  common_errors:
  - 'Falling into the weak pattern: has not repeated it or thinks it would work anywhere unchanged.'

- external_key: resume_screening.quantified_impact.sceptical_reader_view
  competency_key: communication
  topic: Preparing for a sceptic
  difficulty: medium
  text: If a sceptical reader doubted your best number, what would you show them first to convince them?
  expected_concepts:
  - pointing to raw data
  - explaining method
  - third-party confirmation
  - openness to doubt
  rubric:
    excellent: "Chooses the most direct evidence, such as raw data or an independent source, and explains\
      \ the method openly."
    good: Offers a summary of evidence and a general explanation.
    weak: Relies on asserting that the number is correct.
  followups:
  - What is the weakest part of it?
  - Who could vouch for it?
  common_errors:
  - 'Falling into the weak pattern: relies on asserting that the number is correct.'

- external_key: resume_screening.quantified_impact.data_quality_issues
  competency_key: data_analysis
  topic: Dirty data
  difficulty: medium
  text: What data quality problems did you meet while measuring the result and how did you deal with them?
  expected_concepts:
  - duplicates or missing values
  - validating data sources
  - documenting cleaning
  - sensitivity of the result
  rubric:
    excellent: "Names real problems, explains the cleaning steps with reasons and tests how the result\
      \ depended on them."
    good: Mentions cleaning steps and a few issues.
    weak: Assumed the data was clean.
  followups:
  - How did you find the problem?
  - What did cleaning change in the result?
  common_errors:
  - 'Falling into the weak pattern: assumed the data was clean.'

- external_key: resume_screening.quantified_impact.dashboard_for_results
  competency_key: data_visualization
  topic: Tracking dashboard
  difficulty: easy
  text: "Did you build or use a dashboard to follow the number you claim? What did it show and who looked\
    \ at it?"
  expected_concepts:
  - purpose of the dashboard
  - metrics displayed
  - audience
  - decisions made from it
  rubric:
    excellent: Describes the dashboard's purpose and audience, key metrics shown and decisions that came
      from it.
    good: Used an existing dashboard with general understanding.
    weak: Did not track the figure in any consistent way.
  followups:
  - What was missing from it?
  - Which view did you check most?
  common_errors:
  - 'Falling into the weak pattern: did not track the figure in any consistent way.'

- external_key: resume_screening.quantified_impact.number_changed_over_time
  competency_key: data_analysis
  topic: Revising a figure
  difficulty: medium
  text: Has any figure you reported ever been revised afterwards, and how did you handle the correction?
  expected_concepts:
  - noticing errors
  - communicating corrections
  - updating records
  - preventing recurrence
  rubric:
    excellent: "Gives a real case, describes how the correction was communicated quickly and how the process\
      \ was changed."
    good: Describes a minor revision and an update to the record.
    weak: Says figures never change or conceals the revision.
  followups:
  - Who needed to hear about it?
  - What check did you add?
  common_errors:
  - Silently replacing a figure without telling those who relied on it.

- external_key: resume_screening.quantified_impact.ethical_pressure_on_numbers
  competency_key: culture_values
  topic: Pressure to inflate
  difficulty: hard
  text: "Have you ever been asked, directly or indirectly, to present a number in a more favourable way\
    \ than the data supported? What did you do?"
  expected_concepts:
  - recognising the pressure
  - sticking with evidence
  - proposing accurate framing
  - escalating if needed
  rubric:
    excellent: "Gives a concrete situation, describes holding to the evidence while offering a constructive\
      \ way to present the result and explains the outcome."
    good: Describes a mild case and a reasonable response.
    weak: Says it never happens or gave in.
  followups:
  - How did the other person react?
  - What line would you not cross?
  common_errors:
  - 'Falling into the weak pattern: says it never happens or gave in.'

- external_key: resume_screening.quantified_impact.selecting_resume_numbers
  competency_key: communication
  topic: Choosing what goes on a resume
  difficulty: easy
  text: How did you decide which of your achievements to put numbers on in your resume?
  expected_concepts:
  - choosing meaningful achievements
  - accuracy of numbers
  - relevance to the role
  - verifying before writing
  rubric:
    excellent: Explains criteria for choosing, checks accuracy before writing and relates the choice to
      the role.
    good: Chose major projects with reasonable numbers.
    weak: Added numbers wherever possible without checking.
  followups:
  - Which number did you leave out?
  - Did you re-verify any?
  common_errors:
  - 'Falling into the weak pattern: added numbers wherever possible without checking.'

- external_key: resume_screening.quantified_impact.interviewer_follow_up_ready
  competency_key: communication
  topic: Ready to back a number
  difficulty: easy
  text: "Which claim on your resume are you most ready to discuss in detail, and what supporting detail\
    \ can you share?"
  expected_concepts:
  - choosing a well-supported claim
  - supporting details
  - clarity
  - relevance
  rubric:
    excellent: Picks a claim and provides method, data source, role and results fluently with relevant
      examples.
    good: Picks a claim and gives a reasonable outline.
    weak: Picks a claim and has little detail.
  followups:
  - What detail would you add if I asked more?
  - What documents exist about it?
  common_errors:
  - 'Falling into the weak pattern: picks a claim and has little detail.'

- external_key: resume_screening.quantified_impact.missing_metric_regret
  competency_key: problem_solving
  topic: What you wish you had measured
  difficulty: medium
  text: "Thinking about your most important project, what do you wish you had measured at the time but\
    \ did not?"
  expected_concepts:
  - reflecting on missing measures
  - instrumentation planning
  - cost of measuring
  - applying lessons
  rubric:
    excellent: "Names specific missing measurements, explains what they would have shown and how they\
      \ now plan instrumentation earlier."
    good: Names a missing measure and a general lesson.
    weak: Cannot think of anything or blames lack of tools.
  followups:
  - What would that have cost?
  - Do you build measurement in now?
  common_errors:
  - 'Falling into the weak pattern: cannot think of anything or blames lack of tools.'

- external_key: resume_screening.quantified_impact.quantifying_work_without_hard_data
  competency_key: problem_solving
  topic: Quantifying with soft data
  difficulty: hard
  text: When no hard data exists, how do you responsibly put a figure on your impact without overstating
    it?
  expected_concepts:
  - ranges rather than points
  - stated assumptions
  - using proxies
  - labelled estimates
  rubric:
    excellent: "Describes using ranges and labelled assumptions, proxies with known flaws and wording\
      \ that signals uncertainty."
    good: Offers an estimate with some caveats.
    weak: States a single firm figure without support.
  followups:
  - How would you word it on a resume?
  - What range would you accept?
  common_errors:
  - 'Falling into the weak pattern: states a single firm figure without support.'

- external_key: resume_screening.quantified_impact.tradeoff_speed_vs_accuracy_of_measure
  competency_key: problem_solving
  topic: Quick versus rigorous measurement
  difficulty: hard
  text: How do you decide between a quick rough measurement and a rigorous one when you need to show impact?
  expected_concepts:
  - stakes of the decision
  - cost of rigour
  - reversibility
  - stating confidence level
  rubric:
    excellent: "Weighs decision stakes, cost and reversibility and chooses accordingly, stating the confidence\
      \ level of each."
    good: Prefers rigour in important cases and speed otherwise without much reasoning.
    weak: Always chooses the fastest or always the most elaborate regardless of need.
  followups:
  - Give an example where a rough number was enough.
  - When did you insist on more rigour?
  common_errors:
  - "Falling into the weak pattern: always chooses the fastest or always the most elaborate regardless\
    \ of need."

- external_key: resume_screening.quantified_impact.collaboration_with_analysts
  competency_key: collaboration
  topic: Working with data specialists
  difficulty: medium
  text: "How did you work with analysts or data owners when measuring your results, and what did they\
    \ teach you?"
  expected_concepts:
  - involving data specialists
  - sharing definitions
  - accepting critique
  - improving future measurement
  rubric:
    excellent: "Describes concrete collaboration, how definitions were agreed and specific improvements\
      \ gained from their critique."
    good: Consulted analysts for the data and a review.
    weak: Worked alone and did not value their input.
  followups:
  - What did they challenge?
  - What do you now ask them first?
  common_errors:
  - 'Falling into the weak pattern: worked alone and did not value their input.'

- external_key: resume_screening.quantified_impact.worst_misread_metric
  competency_key: problem_solving
  topic: Misreading a number
  difficulty: hard
  text: "Tell me about a time you or your team misread a metric and acted on it. What was the cost and\
    \ what changed afterwards?"
  expected_concepts:
  - how the misreading occurred
  - consequences
  - detection
  - new safeguards
  rubric:
    excellent: "Gives a real example with consequences, explains how it was detected and what safeguards\
      \ were put in place."
    good: Describes a smaller misreading and a brief fix.
    weak: Cannot recall one or shifts blame elsewhere.
  followups:
  - What check would have caught it earlier?
  - Who else was affected?
  common_errors:
  - 'Falling into the weak pattern: cannot recall one or shifts blame elsewhere.'

- external_key: resume_screening.quantified_impact.what_you_would_claim_now
  competency_key: communication
  topic: Restating the claim today
  difficulty: hard
  text: "If you rewrote your most impressive quantified line today with everything you now know, how would\
    \ it read and why?"
  expected_concepts:
  - precise rewriting
  - including scope and method
  - removing unsupported parts
  - reasoning
  rubric:
    excellent: Rewrites the line with scope, method and the right level of certainty, explaining each
      change.
    good: Makes small adjustments with some reasoning.
    weak: Leaves the line unchanged or cannot explain choices.
  followups:
  - What would you add that is not on there now?
  - What would you remove?
  common_errors:
  - 'Falling into the weak pattern: leaves the line unchanged or cannot explain choices.'

- external_key: resume_screening.quantified_impact.benchmark_against_peers
  competency_key: data_analysis
  topic: External benchmark
  difficulty: medium
  text: "Did you compare your result with an industry benchmark or similar team's results? What did that\
    \ show about how good it really was?"
  expected_concepts:
  - finding a fair benchmark
  - comparability of conditions
  - reading the result in context
  - limits of comparison
  rubric:
    excellent: "Describes a comparable benchmark, its limits and what the comparison showed about the\
      \ real level of achievement."
    good: Compared roughly to a typical figure.
    weak: Never compared the result with anything outside the project.
  followups:
  - How comparable were the conditions?
  - What would a better comparison be?
  common_errors:
  - 'Falling into the weak pattern: never compared the result with anything outside the project.'
