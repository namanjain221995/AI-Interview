# Curated questions: resume screening, project_ownership. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.project_ownership.hardest_decision
  competency_key: ownership
  topic: Hardest decision
  difficulty: medium
  text: What was the hardest decision you had to make on that project, and how did you reach it?
  expected_concepts:
  - framing the decision
  - options and criteria
  - information gathering
  - consulting others
  rubric:
    excellent: "Frames the decision with options and criteria, shows how they gathered information and\
      \ consulted others and explains the final choice."
    good: Describes the decision and a reasonable basis.
    weak: Describes a trivial decision or one made by someone else.
  followups:
  - What would have changed your mind?
  - Who disagreed?
  common_errors:
  - Describing the outcome without the reasoning behind the choice.

- external_key: resume_screening.project_ownership.alternatives_rejected
  competency_key: system_design
  topic: Options not taken
  difficulty: medium
  text: What alternatives did you consider and reject for the key choice on the project, and why?
  expected_concepts:
  - naming real alternatives
  - criteria
  - trade-offs
  - documenting reasons
  rubric:
    excellent: "Names at least two real alternatives with specific reasons for rejecting them, tied to\
      \ project constraints."
    good: Names one alternative with a general reason.
    weak: Cannot name alternatives.
  followups:
  - When would the other option have won?
  - Did you write this down?
  common_errors:
  - Presenting the chosen approach as the only option.

- external_key: resume_screening.project_ownership.decision_reversed
  competency_key: adaptability
  topic: Changing course
  difficulty: medium
  text: Was there a decision on that project that you later reversed or changed? What prompted it?
  expected_concepts:
  - new information
  - willingness to reverse
  - cost of change
  - communication
  rubric:
    excellent: Describes a real reversal, the trigger, the cost of changing and how they communicated
      it.
    good: Describes a small adjustment with reasons.
    weak: Says they never changed any decisions.
  followups:
  - How long did you wait before changing?
  - How did the team react?
  common_errors:
  - 'Falling into the weak pattern: says they never changed any decisions.'

- external_key: resume_screening.project_ownership.disagreement_over_approach
  competency_key: collaboration
  topic: Disagreement on approach
  difficulty: medium
  text: "Your resume describes a project you drove. Where did a teammate argue for a different technical\
    \ or delivery route, and how did you settle which one to take?"
  expected_concepts:
  - listening
  - evidence
  - compromise or decision
  - keeping relationships
  rubric:
    excellent: "Gives a concrete case, shows they weighed the other view with evidence and reached a clear\
      \ resolution that held."
    good: Describes a disagreement and a reasonable resolution.
    weak: Avoided disagreements or won by authority.
  followups:
  - Were they right in any respect?
  - What was the outcome?
  common_errors:
  - 'Falling into the weak pattern: avoided disagreements or won by authority.'

- external_key: resume_screening.project_ownership.scope_cut
  competency_key: project_management
  topic: Cutting scope
  difficulty: medium
  text: Describe a time you had to cut scope on a project. How did you choose what to cut and who agreed?
  expected_concepts:
  - priority criteria
  - impact assessment
  - stakeholder agreement
  - communication
  rubric:
    excellent: Explains criteria for choosing cuts, assesses impact, gets agreement and communicates clearly.
    good: Cut items by general priority and informed people.
    weak: Cut without consultation or avoided cutting.
  followups:
  - Which cut was hardest?
  - Did anything come back?
  common_errors:
  - 'Falling into the weak pattern: cut without consultation or avoided cutting.'

- external_key: resume_screening.project_ownership.risk_taken
  competency_key: ownership
  topic: Calculated risk
  difficulty: hard
  text: Describe a risk you chose to take on a project and how you decided it was worth taking.
  expected_concepts:
  - assessing likelihood and impact
  - mitigation
  - fallback
  - informing stakeholders
  rubric:
    excellent: "Describes the risk, the reasoning, the safety net and how stakeholders were involved,\
      \ plus the result."
    good: Describes a risk and a reasonable fallback.
    weak: Took risks without a fallback or avoided risk entirely.
  followups:
  - What was the fallback?
  - What would you have done if it failed?
  common_errors:
  - 'Falling into the weak pattern: took risks without a fallback or avoided risk entirely.'

- external_key: resume_screening.project_ownership.technical_debt_decision
  competency_key: code_quality
  topic: Debt trade-off
  difficulty: medium
  text: "Did you knowingly take on shortcuts or technical debt in that project? How did you decide and\
    \ what happened later?"
  expected_concepts:
  - conscious trade-off
  - recording the debt
  - plan to repay
  - consequences
  rubric:
    excellent: Describes a deliberate trade-off, how it was recorded and scheduled for repayment and what
      happened.
    good: Accepted shortcuts under pressure and noted them.
    weak: Denies any shortcuts or took them without recording.
  followups:
  - Was the debt ever repaid?
  - Who knew about it?
  common_errors:
  - 'Falling into the weak pattern: denies any shortcuts or took them without recording.'

- external_key: resume_screening.project_ownership.build_versus_buy
  competency_key: system_design
  topic: Build or adopt
  difficulty: medium
  text: "Did you face a choice between building something and adopting an existing solution? How did you\
    \ decide?"
  expected_concepts:
  - criteria such as cost, time and fit
  - evaluation steps
  - long-term maintenance
  - exit options
  rubric:
    excellent: Describes criteria, how options were evaluated hands-on and maintenance and exit considerations.
    good: Compared options on cost and time.
    weak: Chose by familiarity.
  followups:
  - What made the existing option fall short?
  - What did maintenance cost?
  common_errors:
  - 'Falling into the weak pattern: chose by familiarity.'

- external_key: resume_screening.project_ownership.prioritising_competing_requests
  competency_key: stakeholder_management
  topic: Competing requests
  difficulty: medium
  text: Several people wanted different things from the project at the same time. How did you prioritise?
  expected_concepts:
  - criteria
  - transparency
  - stakeholder communication
  - handling pushback
  rubric:
    excellent: "Describes explicit criteria shared with stakeholders, handles pushback with data and records\
      \ agreed priorities."
    good: Prioritised by importance and informed those affected.
    weak: Tried to satisfy everyone or followed the loudest request.
  followups:
  - Who was unhappy?
  - How did you explain it?
  common_errors:
  - 'Falling into the weak pattern: tried to satisfy everyone or followed the loudest request.'

- external_key: resume_screening.project_ownership.data_behind_decisions
  competency_key: data_analysis
  topic: Evidence for decisions
  difficulty: medium
  text: "What data or evidence did you gather to support the main decisions you made, and what did you\
    \ do when it was unclear?"
  expected_concepts:
  - collecting evidence
  - interpreting it
  - handling ambiguity
  - revisiting
  rubric:
    excellent: "Describes evidence gathered, its limits and how they decided when it was inconclusive,\
      \ then reviewed the decision later."
    good: Used some data and judgement.
    weak: Decided mostly on intuition without evidence.
  followups:
  - What data did you wish you had?
  - How did you check your read of it?
  common_errors:
  - 'Falling into the weak pattern: decided mostly on intuition without evidence.'

- external_key: resume_screening.project_ownership.pushing_back_on_requests
  competency_key: communication
  topic: Saying no
  difficulty: medium
  text: "Tell me about a time you pushed back on a request on the project. How did you do it and what\
    \ resulted?"
  expected_concepts:
  - reasons
  - alternatives offered
  - tone and clarity
  - outcome
  rubric:
    excellent: "Gives a real case, explains reasons backed by evidence, offers alternatives and describes\
      \ the outcome."
    good: Pushed back politely with a rationale.
    weak: Never pushed back or refused without reasons.
  followups:
  - What alternative did you offer?
  - How did the requester respond?
  common_errors:
  - 'Falling into the weak pattern: never pushed back or refused without reasons.'

- external_key: resume_screening.project_ownership.escalation_example
  competency_key: stakeholder_management
  topic: Escalating
  difficulty: medium
  text: When did you escalate an issue on the project, and how did you decide it was the time?
  expected_concepts:
  - threshold for escalation
  - preparation
  - options presented
  - outcome
  rubric:
    excellent: Describes the trigger, how they prepared options and facts and what the escalation achieved.
    good: Escalated with a reasonable summary.
    weak: Escalated too late or without options.
  followups:
  - What did you try before escalating?
  - What did you ask for?
  common_errors:
  - 'Falling into the weak pattern: escalated too late or without options.'

- external_key: resume_screening.project_ownership.decision_under_time_pressure
  competency_key: problem_solving
  topic: Fast decision
  difficulty: medium
  text: "Describe a decision you had to make quickly on the project with incomplete information. What\
    \ did you do?"
  expected_concepts:
  - bounded time
  - key facts
  - reversibility
  - follow-up
  rubric:
    excellent: "Describes how they identified the key facts quickly, chose a reversible option where possible\
      \ and reviewed it afterwards."
    good: Made a reasonable quick decision.
    weak: Delayed too long or decided without any checking.
  followups:
  - What would you have wanted to know?
  - How did you check it afterwards?
  common_errors:
  - 'Falling into the weak pattern: delayed too long or decided without any checking.'

- external_key: resume_screening.project_ownership.architecture_choice_ownership
  competency_key: system_design
  topic: Architecture ownership
  difficulty: hard
  text: For the design of the system, which parts did you design yourself, and how did you validate them?
  expected_concepts:
  - designed components
  - reasoning
  - validation such as reviews or prototypes
  - limits
  rubric:
    excellent: "Describes the parts they designed, their reasoning and how designs were validated through\
      \ reviews or prototypes."
    good: Designed parts with some review.
    weak: Cannot describe design choices.
  followups:
  - What was reviewed by others?
  - What failed validation?
  common_errors:
  - 'Falling into the weak pattern: cannot describe design choices.'

- external_key: resume_screening.project_ownership.process_you_introduced
  competency_key: agile_delivery
  topic: Process change
  difficulty: medium
  text: "Did you introduce any new process or practice on the project? What problem did it solve and did\
    \ it stick?"
  expected_concepts:
  - problem identified
  - change introduced
  - adoption
  - evidence of benefit
  rubric:
    excellent: Describes a problem, the practice, how adoption was achieved and evidence of benefit.
    good: Suggested a practice that was adopted partly.
    weak: Introduced nothing or imposed a practice without effect.
  followups:
  - Who resisted?
  - What would you drop now?
  common_errors:
  - 'Falling into the weak pattern: introduced nothing or imposed a practice without effect.'

- external_key: resume_screening.project_ownership.quality_bar_set
  competency_key: code_quality
  topic: Quality standards
  difficulty: medium
  text: How did you decide what quality standard the project's work should meet, and how did you enforce
    it?
  expected_concepts:
  - defining standards
  - testing and review
  - trade-offs with speed
  - consistency
  rubric:
    excellent: "Describes explicit standards, how they were enforced through review and testing and balanced\
      \ with speed."
    good: Relied on reviews and tests.
    weak: No explicit standards.
  followups:
  - When did you relax it?
  - How did you measure quality?
  common_errors:
  - 'Falling into the weak pattern: no explicit standards.'

- external_key: resume_screening.project_ownership.technical_vs_business_tradeoff
  competency_key: stakeholder_management
  topic: Technical versus business
  difficulty: hard
  text: "Describe a time a technical concern conflicted with a business deadline on the project. What\
    \ did you do?"
  expected_concepts:
  - explaining technical risk in business terms
  - options
  - decision
  - consequences
  rubric:
    excellent: "Explains the technical risk in business terms, presents options with costs and reaches\
      \ an agreed decision."
    good: Raised the concern and accepted the decision.
    weak: Ignored the concern or refused to compromise.
  followups:
  - How did you quantify the risk?
  - Who decided?
  common_errors:
  - 'Falling into the weak pattern: ignored the concern or refused to compromise.'

- external_key: resume_screening.project_ownership.security_or_compliance_choice
  competency_key: security
  topic: Security or compliance
  difficulty: hard
  text: "Were there security, privacy or compliance requirements on the project? How did you incorporate\
    \ them and what choices did that force?"
  expected_concepts:
  - identifying requirements
  - design implications
  - trade-offs
  - verification
  rubric:
    excellent: Identifies requirements, describes design choices they forced and how compliance was verified.
    good: Aware of requirements and followed guidance.
    weak: Treated them as someone else's job.
  followups:
  - What would have happened if it were ignored?
  - Who reviewed it?
  common_errors:
  - 'Falling into the weak pattern: treated them as someone else''s job.'

- external_key: resume_screening.project_ownership.planning_assumptions
  competency_key: project_management
  topic: Assumptions made
  difficulty: medium
  text: What assumptions did you make when planning the project and which turned out to be wrong?
  expected_concepts:
  - stating assumptions
  - validating early
  - adapting
  - lessons
  rubric:
    excellent: Lists key assumptions, how they were checked, which failed and how they adapted.
    good: Names a wrong assumption and its effect.
    weak: Claims all assumptions held.
  followups:
  - How early did you find out?
  - What would you validate first now?
  common_errors:
  - 'Falling into the weak pattern: claims all assumptions held.'

- external_key: resume_screening.project_ownership.choosing_what_not_to_do
  competency_key: problem_solving
  topic: Deliberate omissions
  difficulty: hard
  text: What did you deliberately decide not to do on that project, and why?
  expected_concepts:
  - focus
  - criteria
  - communicating the omission
  - consequences
  rubric:
    excellent: Names concrete omissions, the reasoning, how it was communicated and what happened.
    good: Names an omission with a reason.
    weak: Cannot identify anything left out.
  followups:
  - Did anyone challenge it?
  - Was it the right call?
  common_errors:
  - 'Falling into the weak pattern: cannot identify anything left out.'

- external_key: resume_screening.project_ownership.rework_caused_by_decision
  competency_key: ownership
  topic: Wrong call
  difficulty: medium
  text: Did one of your decisions cause rework? What was it and what did you learn?
  expected_concepts:
  - recognising the error
  - cost
  - correction
  - prevention
  rubric:
    excellent: "Describes a real decision that caused rework, quantifies the cost, how they corrected\
      \ and prevented recurrence."
    good: Describes a minor rework and a lesson.
    weak: Cannot recall any or blames others.
  followups:
  - How did you tell the team?
  - What check did you add?
  common_errors:
  - 'Falling into the weak pattern: cannot recall any or blames others.'

- external_key: resume_screening.project_ownership.documenting_decisions
  competency_key: communication
  topic: Recording decisions
  difficulty: easy
  text: How did you record important decisions on the project so others could understand them later?
  expected_concepts:
  - decision records
  - rationale
  - accessibility
  - keeping them current
  rubric:
    excellent: Describes a consistent habit of recording decisions with rationale in a place the team
      used.
    good: Recorded some decisions in documents or tickets.
    weak: Decisions were only verbal.
  followups:
  - Where would a newcomer find them?
  - Which record helped later?
  common_errors:
  - 'Falling into the weak pattern: decisions were only verbal.'

- external_key: resume_screening.project_ownership.consulting_experts
  competency_key: collaboration
  topic: Asking for help
  difficulty: easy
  text: "On what questions did you seek input from others with more experience, and how did you use their\
    \ advice?"
  expected_concepts:
  - knowing limits
  - choosing the right people
  - preparing questions
  - applying advice
  rubric:
    excellent: "Gives examples of seeking specific advice, preparing questions and applying it while keeping\
      \ responsibility for the decision."
    good: Asked for help when stuck.
    weak: Avoided asking or handed off the decision.
  followups:
  - Whose advice was most valuable?
  - Did you ignore any advice?
  common_errors:
  - 'Falling into the weak pattern: avoided asking or handed off the decision.'

- external_key: resume_screening.project_ownership.long_term_effect_of_choice
  competency_key: system_design
  topic: Long-term consequences
  difficulty: hard
  text: Which choice from that project still affects the system or team today, for better or worse?
  expected_concepts:
  - lasting consequences
  - follow-up
  - monitoring
  - willingness to revisit
  rubric:
    excellent: Identifies a lasting consequence, explains why it persisted and what they would do about
      it now.
    good: Names a lasting effect with limited analysis.
    weak: Believes nothing lasted.
  followups:
  - Would you revisit it today?
  - Who maintains it now?
  common_errors:
  - 'Falling into the weak pattern: believes nothing lasted.'

- external_key: resume_screening.project_ownership.testing_strategy_choice
  competency_key: test_automation
  topic: Test approach
  difficulty: medium
  text: "What was the approach to testing and verification on the project, and which parts of it did you\
    \ decide?"
  expected_concepts:
  - levels of testing
  - coverage priorities
  - automation
  - risk-based focus
  rubric:
    excellent: Describes the strategy, which parts they decided and how it reflected the highest risks.
    good: Describes the testing done and their part.
    weak: Testing was left to others and they cannot describe it.
  followups:
  - Which risk worried you most?
  - What did you leave untested?
  common_errors:
  - 'Falling into the weak pattern: testing was left to others and they cannot describe it.'
