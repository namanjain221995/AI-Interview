# Curated questions: resume screening, certifications_learning. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.certifications_learning.what_certification_covers
  competency_key: communication
  topic: Scope of a certification
  difficulty: easy
  text: "Pick a certification from your resume. What does it cover, and which parts were most relevant\
    \ to your work?"
  expected_concepts:
  - main topics
  - relevance to work
  - strongest and weakest areas
  - concrete examples
  rubric:
    excellent: "Summarises the topics accurately, identifies the parts they use at work and gives an example\
      \ of each."
    good: Lists the topics with a general link to work.
    weak: Names the certification but cannot say what it covers.
  followups:
  - Which domain was new to you?
  - Which part do you use weekly?
  common_errors:
  - Naming the certification without explaining its content.

- external_key: resume_screening.certifications_learning.applied_on_the_job
  competency_key: problem_solving
  topic: Applying certification knowledge
  difficulty: easy
  text: "Tell me about a time you used something you learned in a certification to solve a real problem\
    \ at work."
  expected_concepts:
  - specific knowledge
  - the problem
  - how it was applied
  - result
  rubric:
    excellent: Describes a real problem, the specific knowledge used, how it changed the approach and
      the result.
    good: Describes an application at a general level.
    weak: Cannot connect the certification to any work.
  followups:
  - What would you have done without it?
  - Who else benefited?
  common_errors:
  - 'Falling into the weak pattern: cannot connect the certification to any work.'

- external_key: resume_screening.certifications_learning.hands_on_part
  competency_key: testing
  topic: Practical element
  difficulty: easy
  text: "Which hands-on labs or practical exercises were part of your preparation, and what did you build\
    \ or practise?"
  expected_concepts:
  - labs or exercises
  - what was built
  - what was learned
  - reuse at work
  rubric:
    excellent: Describes specific labs, what they built or broke and how it helped in later work.
    good: Describes practice at a general level.
    weak: Relied on reading or memorising only.
  followups:
  - Which lab was hardest?
  - What did you reuse at work?
  common_errors:
  - 'Falling into the weak pattern: relied on reading or memorising only.'

- external_key: resume_screening.certifications_learning.toughest_topic
  competency_key: adaptability
  topic: Hardest topic to learn
  difficulty: medium
  text: "What was the hardest topic to understand while working toward a certification, and how did you\
    \ get past it?"
  expected_concepts:
  - identifying the topic
  - learning methods
  - checking understanding
  - application
  rubric:
    excellent: "Names a specific topic, describes methods such as practice and discussion and how they\
      \ confirmed understanding."
    good: Names a topic with general methods.
    weak: Says nothing was hard or memorised without understanding.
  followups:
  - How did you test your understanding?
  - Where did you apply it?
  common_errors:
  - 'Falling into the weak pattern: says nothing was hard or memorised without understanding.'

- external_key: resume_screening.certifications_learning.preparation_method
  competency_key: adaptability
  topic: Preparation approach
  difficulty: easy
  text: "How did you go about preparing for a certification, and what part of your approach would you\
    \ keep next time?"
  expected_concepts:
  - study plan
  - resources
  - practice exercises
  - self-assessment
  rubric:
    excellent: "Describes a structured approach with varied resources, practice and self-checks, and what\
      \ they would keep or improve."
    good: Describes a reasonable approach.
    weak: Used one resource without planning.
  followups:
  - What resource was best?
  - How did you check your readiness?
  common_errors:
  - 'Falling into the weak pattern: used one resource without planning.'

- external_key: resume_screening.certifications_learning.exam_versus_real_work
  competency_key: problem_solving
  topic: Certification versus reality
  difficulty: medium
  text: "What does your certification teach that works well in the real world and what does it simplify\
    \ or leave out?"
  expected_concepts:
  - strengths
  - simplifications
  - real-world differences
  - judgement
  rubric:
    excellent: Gives specific examples of what transfers and what real work adds, showing judgement.
    good: Notes general differences.
    weak: Treats the certification as equal to experience.
  followups:
  - Where did real work contradict the material?
  - What did you learn only on the job?
  common_errors:
  - Equating passing an exam with practical experience.

- external_key: resume_screening.certifications_learning.core_concept_explained
  competency_key: communication
  topic: Explaining a key concept
  difficulty: medium
  text: Choose one core concept from a certification you hold and explain it as you would to a new teammate.
  expected_concepts:
  - accurate explanation
  - example
  - common misunderstandings
  - check for understanding
  rubric:
    excellent: Gives a clear, accurate explanation with an example and anticipates misunderstandings.
    good: Gives a mostly accurate explanation.
    weak: Repeats definitions without understanding.
  followups:
  - What is a common confusion?
  - How would you test their understanding?
  common_errors:
  - 'Falling into the weak pattern: repeats definitions without understanding.'

- external_key: resume_screening.certifications_learning.best_practice_adopted
  competency_key: code_quality
  topic: Practice adopted at work
  difficulty: medium
  text: Which best practice from a certification or course did you introduce at work, and what changed?
  expected_concepts:
  - the practice
  - how it was introduced
  - adoption
  - results
  rubric:
    excellent: Describes the practice, how they introduced it, how it was adopted and the measured effect.
    good: Introduced a practice with limited adoption.
    weak: Learned practices without applying any.
  followups:
  - Who resisted?
  - How did you measure the result?
  common_errors:
  - 'Falling into the weak pattern: learned practices without applying any.'

- external_key: resume_screening.certifications_learning.security_or_compliance_cert_use
  competency_key: security
  topic: Applying security training
  difficulty: medium
  text: "If any of your learning covered security or compliance, how did it affect how you design or review\
    \ work?"
  expected_concepts:
  - concrete controls
  - reviews
  - examples
  - changes to practice
  rubric:
    excellent: Gives specific examples of changing designs or reviews because of the training.
    good: Describes awareness in general.
    weak: Cannot give an example.
  followups:
  - What did you catch because of it?
  - What do you now ask in reviews?
  common_errors:
  - 'Falling into the weak pattern: cannot give an example.'

- external_key: resume_screening.certifications_learning.scenario_from_certification_domain
  competency_key: problem_solving
  topic: Scenario in the domain
  difficulty: hard
  text: "Take the domain of a certification you hold. If a service in that domain suddenly misbehaved\
    \ in production, how would you work through it?"
  expected_concepts:
  - gathering evidence
  - applying domain knowledge
  - hypotheses
  - fix and prevention
  rubric:
    excellent: "Gives a structured approach using domain-specific tools and concepts, with hypotheses\
      \ and prevention."
    good: Gives a general approach with some domain content.
    weak: Gives a generic answer unrelated to the domain.
  followups:
  - Which tool would you reach for first?
  - What would you check next?
  common_errors:
  - 'Falling into the weak pattern: gives a generic answer unrelated to the domain.'

- external_key: resume_screening.certifications_learning.trade_offs_from_the_material
  competency_key: system_design
  topic: Trade-offs taught
  difficulty: hard
  text: Which trade-offs did your certification material teach, and how have you seen them play out at
    work?
  expected_concepts:
  - named trade-offs
  - real example
  - reasoning
  - outcome
  rubric:
    excellent: Names trade-offs from the material and gives a work example with the reasoning applied.
    good: Names a trade-off with a loose example.
    weak: Cannot name any trade-offs.
  followups:
  - Which side did you choose?
  - What did you give up?
  common_errors:
  - 'Falling into the weak pattern: cannot name any trade-offs.'

- external_key: resume_screening.certifications_learning.lab_environment_built
  competency_key: system_design
  topic: Personal lab
  difficulty: medium
  text: "Did you build your own environment to practise what you were learning? Describe it and what you\
    \ tried in it."
  expected_concepts:
  - environment design
  - experiments
  - failures
  - learning
  rubric:
    excellent: Describes the setup, experiments including failures and what they took from them.
    good: Used an existing sandbox.
    weak: Did not practise in an environment.
  followups:
  - What did you break on purpose?
  - What did you automate?
  common_errors:
  - 'Falling into the weak pattern: did not practise in an environment.'

- external_key: resume_screening.certifications_learning.mistake_corrected_by_learning
  competency_key: adaptability
  topic: A misconception fixed
  difficulty: medium
  text: "Tell me about something you believed or did incorrectly at work until a course or certification\
    \ corrected it."
  expected_concepts:
  - the misconception
  - how it was discovered
  - correction
  - effect
  rubric:
    excellent: Describes a real misconception, how learning exposed it and the change in practice.
    good: Describes a minor correction.
    weak: Cannot recall any.
  followups:
  - What was the impact before the fix?
  - How did you tell others?
  common_errors:
  - 'Falling into the weak pattern: cannot recall any.'

- external_key: resume_screening.certifications_learning.choosing_which_certification
  competency_key: motivation
  topic: Why this certification
  difficulty: easy
  text: How did you decide which certification was worth pursuing for your work?
  expected_concepts:
  - relevance to work
  - content review
  - career goals
  - weighing alternatives
  rubric:
    excellent: "Describes criteria such as relevance and content, compares alternatives and explains the\
      \ link to their work."
    good: Gives a general reason.
    weak: Followed a trend or a requirement without reflection.
  followups:
  - What did you consider instead?
  - Would you choose it again?
  common_errors:
  - 'Falling into the weak pattern: followed a trend or a requirement without reflection.'

- external_key: resume_screening.certifications_learning.sharing_knowledge_from_cert
  competency_key: mentoring
  topic: Sharing what you learned
  difficulty: medium
  text: How did you share what you learned from a certification or course with your colleagues?
  expected_concepts:
  - sharing methods
  - usefulness
  - feedback
  - follow-up
  rubric:
    excellent: Describes concrete sharing such as sessions or guides, feedback and what colleagues did
      with it.
    good: Shared informally.
    weak: Kept it to themselves.
  followups:
  - What was most useful to others?
  - What would you present differently?
  common_errors:
  - 'Falling into the weak pattern: kept it to themselves.'

- external_key: resume_screening.certifications_learning.combination_of_certifications
  competency_key: system_design
  topic: Connecting several credentials
  difficulty: medium
  text: If you hold more than one certification, how do they fit together in the work you do?
  expected_concepts:
  - complementary content
  - examples
  - overlaps
  - practical use
  rubric:
    excellent: Explains how each adds to the others with a work example that uses them together.
    good: Describes a general relationship.
    weak: Treats them as unrelated.
  followups:
  - Which overlaps?
  - Which one do you use most?
  common_errors:
  - 'Falling into the weak pattern: treats them as unrelated.'

- external_key: resume_screening.certifications_learning.service_or_tool_from_cert
  competency_key: cloud_cost_optimization
  topic: Specific service learned
  difficulty: medium
  text: "Which specific tool or service did you learn in depth because of a certification, and what have\
    \ you built with it?"
  expected_concepts:
  - tool
  - depth of use
  - project
  - limits
  rubric:
    excellent: Names a tool, describes a real project and notes limits discovered.
    good: Names a tool with a small project.
    weak: Knows the tool by name only.
  followups:
  - What limit did you hit?
  - What would you build next?
  common_errors:
  - 'Falling into the weak pattern: knows the tool by name only.'

- external_key: resume_screening.certifications_learning.limits_of_material
  competency_key: problem_solving
  topic: Where the material ends
  difficulty: medium
  text: What are the limits of what a certification can teach, from your experience?
  expected_concepts:
  - practice versus theory
  - context specificity
  - judgement
  - ongoing learning
  rubric:
    excellent: Gives specific limits with examples and describes how they fill them.
    good: Gives general limits.
    weak: Believes certification is enough.
  followups:
  - What did you add yourself?
  - Who taught you the rest?
  common_errors:
  - 'Falling into the weak pattern: believes certification is enough.'

- external_key: resume_screening.certifications_learning.applied_to_a_decision
  competency_key: problem_solving
  topic: Influencing a decision
  difficulty: hard
  text: "Describe a decision at work that your certification knowledge influenced and what the alternative\
    \ would have been."
  expected_concepts:
  - decision
  - knowledge used
  - alternative
  - outcome
  rubric:
    excellent: Describes the decision, how specific knowledge shaped it, the rejected alternative and
      the outcome.
    good: Describes the decision with loose reasoning.
    weak: Cannot link knowledge to a decision.
  followups:
  - Who else weighed in?
  - What was the cost of the alternative?
  common_errors:
  - 'Falling into the weak pattern: cannot link knowledge to a decision.'

- external_key: resume_screening.certifications_learning.troubleshooting_with_cert_knowledge
  competency_key: debugging
  topic: Debugging with domain knowledge
  difficulty: medium
  text: "Give an example of diagnosing a problem where your certification knowledge helped you find the\
    \ cause faster."
  expected_concepts:
  - the problem
  - the knowledge
  - steps
  - time saved
  rubric:
    excellent: Describes the problem, the specific concept that helped and the steps taken.
    good: Describes a problem with a loose link.
    weak: Cannot give an example.
  followups:
  - What did you check first?
  - What would a novice have missed?
  common_errors:
  - 'Falling into the weak pattern: cannot give an example.'

- external_key: resume_screening.certifications_learning.documentation_of_learning
  competency_key: communication
  topic: Recording what you learn
  difficulty: easy
  text: How do you record what you learn from courses or certifications so you can use it later?
  expected_concepts:
  - notes
  - examples
  - organisation
  - reuse
  rubric:
    excellent: Describes a practical system such as notes or runbooks and gives an example of reusing
      them.
    good: Takes notes occasionally.
    weak: Does not record.
  followups:
  - How often do you go back to your notes?
  - Who else uses them?
  common_errors:
  - 'Falling into the weak pattern: does not record.'

- external_key: resume_screening.certifications_learning.value_to_employer
  competency_key: motivation
  topic: Value for the team
  difficulty: medium
  text: How did your certifications benefit your team or employer, beyond your own development?
  expected_concepts:
  - team benefits
  - standards
  - reduced risk
  - mentoring
  rubric:
    excellent: Describes specific benefits such as better practices or reduced risk with examples.
    good: Describes general benefits.
    weak: Sees it only as personal benefit.
  followups:
  - What changed because of it?
  - Who did you help?
  common_errors:
  - 'Falling into the weak pattern: sees it only as personal benefit.'

- external_key: resume_screening.certifications_learning.skills_tested_by_exam
  competency_key: testing
  topic: What the exam checks
  difficulty: easy
  text: "What skills did the exam for your certification actually test, and how well do you think it reflected\
    \ the job?"
  expected_concepts:
  - skills tested
  - format
  - relation to job
  - limits
  rubric:
    excellent: Describes the skills assessed, the exam format and an informed view of its match to the
      job.
    good: Describes the exam in general terms.
    weak: Cannot describe the exam.
  followups:
  - Which question type was hardest?
  - What would you add to the exam?
  common_errors:
  - 'Falling into the weak pattern: cannot describe the exam.'

- external_key: resume_screening.certifications_learning.terminology_and_foundations
  competency_key: communication
  topic: Foundational vocabulary
  difficulty: easy
  text: "Which terms or foundations from your learning do you find yourself using most when you talk to\
    \ colleagues?"
  expected_concepts:
  - key terms
  - clarity
  - examples
  - common vocabulary
  rubric:
    excellent: Names specific terms, uses them accurately and shows how they help communication.
    good: Names a few terms.
    weak: Cannot name any.
  followups:
  - Which term do people misuse?
  - How do you explain it simply?
  common_errors:
  - 'Falling into the weak pattern: cannot name any.'

- external_key: resume_screening.certifications_learning.monitoring_and_operations_learning
  competency_key: observability
  topic: Operational knowledge from learning
  difficulty: medium
  text: "Which operational practices, such as monitoring, backups or cost control, did you learn through\
    \ formal study and put into use?"
  expected_concepts:
  - specific practices
  - implementation
  - results
  - follow-up
  rubric:
    excellent: Names specific practices, describes how they implemented them and the result.
    good: Names practices with partial implementation.
    weak: Has not put any into use.
  followups:
  - What did you automate?
  - What was the result?
  common_errors:
  - 'Falling into the weak pattern: has not put any into use.'
