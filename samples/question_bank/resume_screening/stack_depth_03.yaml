# Curated questions: resume screening, stack_depth. Reusable probe patterns; judged on the substance of the answer only.
version: 1
defaults:
  role_tags:
  - general
  round_types:
  - resume_screening
  kind: resume_claim
questions:

- external_key: resume_screening.stack_depth.limits_you_hit
  competency_key: problem_solving
  topic: Limits met in practice
  difficulty: medium
  text: "What is the most significant limit you hit with one of your key technologies, and what did you\
    \ do about it?"
  expected_concepts:
  - nature of the limit
  - how it was recognised
  - workaround or replacement
  - lesson
  rubric:
    excellent: Describes a real limit, how they identified it, the options considered and what they chose.
    good: Describes a limit and a workaround.
    weak: Cannot name a limit or names a trivial one.
  followups:
  - Was it a limit of the tool or of the way you used it?
  - What did the workaround cost?
  common_errors:
  - Claiming the tool had no weaknesses.

- external_key: resume_screening.stack_depth.when_not_to_use
  competency_key: system_design
  topic: Poor fit
  difficulty: medium
  text: For which kinds of problems would you advise against your main technology, and why?
  expected_concepts:
  - poor-fit scenarios
  - reasons
  - alternatives
  - experience-based examples
  rubric:
    excellent: Names specific poor-fit situations with reasons from experience and what to use instead.
    good: Names a poor-fit case with general reasons.
    weak: Recommends it for everything.
  followups:
  - Have you seen it misused?
  - What would you choose instead?
  common_errors:
  - 'Falling into the weak pattern: recommends it for everything.'

- external_key: resume_screening.stack_depth.worst_incident_with_tool
  competency_key: incident_response
  topic: Worst experience
  difficulty: hard
  text: "What is the worst experience you have had with one of your technologies, and what did you take\
    \ from it?"
  expected_concepts:
  - description
  - impact
  - response
  - changes afterwards
  rubric:
    excellent: Describes the incident, their response and the lasting changes in practice.
    good: Describes a smaller problem and a lesson.
    weak: Cannot recall a problem.
  followups:
  - What was your role?
  - What guardrail did you add?
  common_errors:
  - 'Falling into the weak pattern: cannot recall a problem.'

- external_key: resume_screening.stack_depth.cost_of_running_it
  competency_key: cloud_cost_optimization
  topic: Cost
  difficulty: medium
  text: What does it cost to run your main technology and what drove that cost in your experience?
  expected_concepts:
  - cost drivers
  - measuring
  - trimming
  - trade-offs with capacity
  rubric:
    excellent: Names the main cost drivers, how they tracked cost and specific savings made.
    good: Knows general cost factors.
    weak: Has no visibility of cost.
  followups:
  - What was the biggest surprise?
  - What did you cut?
  common_errors:
  - 'Falling into the weak pattern: has no visibility of cost.'

- external_key: resume_screening.stack_depth.complexity_burden
  competency_key: system_design
  topic: Operational complexity
  difficulty: medium
  text: What operational burden comes with your main technology, and how did your team manage it?
  expected_concepts:
  - operational tasks
  - automation
  - ownership
  - training
  rubric:
    excellent: "Describes concrete operational tasks, how they were automated or shared and what training\
      \ was needed."
    good: Knows the burden in general.
    weak: Leaves operations to others.
  followups:
  - What took most effort?
  - What would reduce it?
  common_errors:
  - 'Falling into the weak pattern: leaves operations to others.'

- external_key: resume_screening.stack_depth.vendor_lock_in
  competency_key: system_design
  topic: Dependence on one vendor
  difficulty: medium
  text: "Where does your stack tie you to a specific vendor or product and how would you reduce that dependence?"
  expected_concepts:
  - points of dependence
  - portability
  - costs of switching
  - pragmatic choices
  rubric:
    excellent: "Identifies real lock-in points, estimates switching cost and explains when accepting lock-in\
      \ is reasonable."
    good: Understands lock-in in general.
    weak: Has not considered it.
  followups:
  - What would be hardest to move?
  - Is lock-in ever worth it?
  common_errors:
  - 'Falling into the weak pattern: has not considered it.'

- external_key: resume_screening.stack_depth.evaluating_a_new_tool
  competency_key: problem_solving
  topic: Evaluating new technology
  difficulty: medium
  text: Describe how you would decide whether to adopt a new technology for your team.
  expected_concepts:
  - defining needs
  - proof of concept
  - criteria
  - risks and exit plan
  rubric:
    excellent: Describes needs first, a bounded trial with criteria, risk review and an exit option.
    good: Compares features and tries a demo.
    weak: Chooses what is popular.
  followups:
  - What would stop you adopting it?
  - Who else would you involve?
  common_errors:
  - 'Falling into the weak pattern: chooses what is popular.'

- external_key: resume_screening.stack_depth.abandoned_technology
  competency_key: adaptability
  topic: Moving away from a tool
  difficulty: medium
  text: Have you stopped using a technology that you once relied on? Why did you move away?
  expected_concepts:
  - reasons
  - evidence
  - transition effort
  - lessons
  rubric:
    excellent: Gives a real example with evidence for the move and how they handled the transition.
    good: Moved on for general reasons.
    weak: Has never changed tools.
  followups:
  - What do you still miss?
  - How did you migrate?
  common_errors:
  - 'Falling into the weak pattern: has never changed tools.'

- external_key: resume_screening.stack_depth.wrong_tool_chosen
  competency_key: ownership
  topic: A poor tool choice
  difficulty: medium
  text: Tell me about a time a technology choice you were part of turned out to be wrong. What happened?
  expected_concepts:
  - how it was recognised
  - cost
  - correction
  - learning
  rubric:
    excellent: "Describes the poor choice, how and when it was recognised, the correction and what changed\
      \ in their selection method."
    good: Describes a mild mismatch and the correction.
    weak: Cannot recall or blames others.
  followups:
  - What signs did you miss?
  - How did you decide to switch?
  common_errors:
  - 'Falling into the weak pattern: cannot recall or blames others.'

- external_key: resume_screening.stack_depth.scaling_limits_known
  competency_key: distributed_systems
  topic: Scale thresholds
  difficulty: hard
  text: At what scale does your main technology start to hurt, and how do you know?
  expected_concepts:
  - scale thresholds
  - evidence
  - mitigation
  - planning
  rubric:
    excellent: Gives thresholds with evidence from testing or experience and describes mitigation and
      planning.
    good: Gives rough thresholds.
    weak: Does not know where limits are.
  followups:
  - What did you test?
  - What would you do at ten times the load?
  common_errors:
  - 'Falling into the weak pattern: does not know where limits are.'

- external_key: resume_screening.stack_depth.security_weaknesses
  competency_key: security
  topic: Known weaknesses
  difficulty: hard
  text: "What are known security weaknesses or common misconfigurations of your main technology, and how\
    \ do you guard against them?"
  expected_concepts:
  - known weaknesses
  - typical misconfigurations
  - mitigation
  - verification
  rubric:
    excellent: Names specific weaknesses and misconfigurations and the controls and checks they used.
    good: Names general weaknesses.
    weak: Believes the technology is secure by default.
  followups:
  - Which default is risky?
  - How do you scan for it?
  common_errors:
  - 'Falling into the weak pattern: believes the technology is secure by default.'

- external_key: resume_screening.stack_depth.licence_and_support
  competency_key: stakeholder_management
  topic: Licensing and support
  difficulty: medium
  text: "What did you need to consider about licensing, support or the maintainers' direction for your\
    \ key technologies?"
  expected_concepts:
  - licence terms
  - support options
  - project health
  - risk
  rubric:
    excellent: Describes specific considerations such as licence terms, support plans and project health
      signals.
    good: Aware of licences and support in general.
    weak: Has not thought about it.
  followups:
  - What would you check before adopting?
  - Who was responsible?
  common_errors:
  - 'Falling into the weak pattern: has not thought about it.'

- external_key: resume_screening.stack_depth.documentation_quality
  competency_key: communication
  topic: Quality of documentation
  difficulty: easy
  text: How good is the documentation for your main technology and what do you do when it is not enough?
  expected_concepts:
  - strengths and gaps
  - community
  - experimentation
  - sharing findings
  rubric:
    excellent: "Gives specific strengths and weaknesses in documentation and tactics when it falls short,\
      \ including contributing back."
    good: Uses docs and search engines.
    weak: Does not use documentation.
  followups:
  - What was missing?
  - Did you write your own notes?
  common_errors:
  - 'Falling into the weak pattern: does not use documentation.'

- external_key: resume_screening.stack_depth.dependency_management
  competency_key: code_quality
  topic: Dependencies and updates
  difficulty: medium
  text: How did you manage dependencies and updates for projects using your key technologies?
  expected_concepts:
  - pinning
  - automated updates
  - testing upgrades
  - security fixes
  rubric:
    excellent: Describes pinning, automated update checks, tests and a process for urgent fixes.
    good: Updates periodically.
    weak: Does not manage updates.
  followups:
  - What broke after an update?
  - How do you handle a critical fix?
  common_errors:
  - 'Falling into the weak pattern: does not manage updates.'

- external_key: resume_screening.stack_depth.legacy_versions
  competency_key: adaptability
  topic: Working with old systems
  difficulty: medium
  text: Have you worked with an older or end-of-life version of a technology? How did you deal with it?
  expected_concepts:
  - constraints
  - risk
  - mitigation
  - migration plan
  rubric:
    excellent: Describes the constraints, risk controls and a plan to modernise.
    good: Worked with it carefully.
    weak: Avoided or ignored the problem.
  followups:
  - What was the biggest risk?
  - What stopped the upgrade?
  common_errors:
  - 'Falling into the weak pattern: avoided or ignored the problem.'

- external_key: resume_screening.stack_depth.tool_sprawl
  competency_key: system_design
  topic: Too many tools
  difficulty: medium
  text: Have you seen a stack grow too many tools? How did it affect the team and what did you do?
  expected_concepts:
  - sprawl effects
  - consolidation criteria
  - ownership
  - decision making
  rubric:
    excellent: Gives a real example, its effects and criteria for consolidating.
    good: Recognises sprawl in general.
    weak: Sees more tools as always better.
  followups:
  - What did you retire?
  - How did people react?
  common_errors:
  - 'Falling into the weak pattern: sees more tools as always better.'

- external_key: resume_screening.stack_depth.what_you_dont_know
  competency_key: communication
  topic: Knowledge boundaries
  difficulty: easy
  text: What part of your main technology do you not know well yet, and how would you close that?
  expected_concepts:
  - accurate self-assessment of limits
  - plan to learn
  - prioritisation
  - resources
  rubric:
    excellent: Names specific areas of weak knowledge and a concrete plan with resources and practice.
    good: Names a general area.
    weak: Claims no weaknesses.
  followups:
  - What would you learn first?
  - Who could you ask?
  common_errors:
  - 'Falling into the weak pattern: claims no weaknesses.'

- external_key: resume_screening.stack_depth.alternative_you_wish_you_knew
  competency_key: adaptability
  topic: Skills wish list
  difficulty: medium
  text: Which technology do you wish you had used more in depth and why?
  expected_concepts:
  - motivation
  - relation to work
  - learning plan
  - evidence of effort
  rubric:
    excellent: Names a technology with reasons tied to work and shows what they have done to learn it.
    good: Names a technology with a general reason.
    weak: Cannot name any.
  followups:
  - What have you tried so far?
  - How would it help in this role?
  common_errors:
  - 'Falling into the weak pattern: cannot name any.'

- external_key: resume_screening.stack_depth.trade_off_cost_speed_reliability
  competency_key: system_design
  topic: Balancing qualities
  difficulty: hard
  text: "In a system on your stack, how did you balance cost, speed and reliability, and which did you\
    \ give up most?"
  expected_concepts:
  - explicit trade-offs
  - measurement
  - stakeholders
  - revisiting
  rubric:
    excellent: Describes explicit trade-offs, how they decided with data and how they communicated them.
    good: Balanced them informally.
    weak: Cannot describe trade-offs.
  followups:
  - Who accepted the trade-off?
  - How would you change it?
  common_errors:
  - 'Falling into the weak pattern: cannot describe trade-offs.'

- external_key: resume_screening.stack_depth.capacity_planning
  competency_key: observability
  topic: Capacity planning
  difficulty: hard
  text: How have you planned capacity for systems built on your main technology?
  expected_concepts:
  - usage data
  - growth forecasts
  - headroom
  - testing
  rubric:
    excellent: Describes using usage data, load tests, headroom targets and reviews.
    good: Estimated based on current usage.
    weak: Added capacity reactively.
  followups:
  - What did the forecast miss?
  - How much headroom did you keep?
  common_errors:
  - 'Falling into the weak pattern: added capacity reactively.'

- external_key: resume_screening.stack_depth.fixing_a_poor_design
  competency_key: code_quality
  topic: Repairing a design
  difficulty: hard
  text: "Tell me about a time you fixed a weak design that was built on one of your technologies. How\
    \ did you approach it?"
  expected_concepts:
  - diagnosing design flaws
  - incremental fixes
  - risk control
  - communication
  rubric:
    excellent: Describes the diagnosis, incremental approach with safety checks and communication.
    good: Fixed it with partial planning.
    weak: Proposed a full rewrite without analysis.
  followups:
  - Why not a rewrite?
  - How did you limit the risk?
  common_errors:
  - 'Falling into the weak pattern: proposed a full rewrite without analysis.'

- external_key: resume_screening.stack_depth.choosing_not_to_use_tool_you_know
  competency_key: system_design
  topic: Choosing against familiarity
  difficulty: medium
  text: "Describe a time you chose a technology you knew less well because it fit the problem better than\
    \ the one you knew best."
  expected_concepts:
  - fit over familiarity
  - learning plan
  - risk
  - result
  rubric:
    excellent: "Describes the problem, reasons for choosing the better fit, how they managed the learning\
      \ curve and the outcome."
    good: Chose a better fit with limited planning.
    weak: Always uses what they know.
  followups:
  - How did you reduce the risk?
  - Would you do it again?
  common_errors:
  - 'Falling into the weak pattern: always uses what they know.'

- external_key: resume_screening.stack_depth.observed_misuse
  competency_key: code_quality
  topic: Misuse by others
  difficulty: medium
  text: What are the common ways people misuse your main technology and how do you prevent it on a team?
  expected_concepts:
  - typical misuse
  - guardrails
  - code review
  - education
  rubric:
    excellent: Names specific misuse patterns and the guardrails, reviews or education used.
    good: Names a pattern or two.
    weak: Cannot name any.
  followups:
  - Which misuse was costly?
  - What guardrail do you rely on?
  common_errors:
  - 'Falling into the weak pattern: cannot name any.'

- external_key: resume_screening.stack_depth.maintenance_burden_of_custom_code
  competency_key: code_quality
  topic: Long-term upkeep
  difficulty: medium
  text: "For something you built on your key technologies, what did keeping it running over time require\
    \ from you and your team?"
  expected_concepts:
  - ongoing maintenance tasks
  - ownership
  - documentation
  - retirement criteria
  rubric:
    excellent: Describes the ongoing work, who owned it, documentation and when they would retire it.
    good: Describes some maintenance tasks.
    weak: Treats it as finished after delivery.
  followups:
  - What took the most upkeep?
  - When would you retire it?
  common_errors:
  - 'Falling into the weak pattern: treats it as finished after delivery.'

- external_key: resume_screening.stack_depth.feature_you_avoid
  competency_key: code_quality
  topic: Features avoided
  difficulty: medium
  text: Is there a feature of your main technology that you deliberately avoid, and why?
  expected_concepts:
  - identifying the feature
  - reasons from experience
  - alternative
  - context
  rubric:
    excellent: Names the feature, gives experience-based reasons and describes the alternative they use.
    good: Names a feature with general reasons.
    weak: Cannot name one.
  followups:
  - When would you use it?
  - What happened when you did?
  common_errors:
  - 'Falling into the weak pattern: cannot name one.'
