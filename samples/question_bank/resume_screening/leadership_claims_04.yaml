# Resume-claim probes for the resume screening round: reusable patterns that fit any resume of this kind.
# Questions ask for the candidate's own role, decisions, evidence and learning; evaluation rests only on answer substance.
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager]
  round_types: [resume_screening]
  kind: resume_claim
questions:
  - external_key: resume_screening.leadership_claims.team_achievement_attribution
    competency_key: ownership
    topic: "What the team achieved"
    difficulty: easy
    text: "Pick the achievement on your resume that your team is proudest of. What did you personally do to make it happen?"
    expected_concepts:
      - "the achievement"
      - "team's roles"
      - "leader's actions"
      - "evidence"
      - "credit shared"
    rubric:
      excellent: "Describes the achievement, names others' contributions and specifies the lead's own actions."
      good: "Describes both."
      weak: "Describes only the team or only themselves."
    followups:
      - "Who would say you made a difference?"
      - "What did others do?"
    common_errors:
      - "Describes only the team or only themselves."

  - external_key: resume_screening.leadership_claims.hiring_plan_capacity
    competency_key: project_management
    topic: "Capacity planning for people"
    difficulty: medium
    text: "You planned team capacity. How did you account for leave, support work, and unplanned issues?"
    expected_concepts:
      - "realistic capacity"
      - "buffers"
      - "tracking"
      - "communication"
      - "adjustments"
    rubric:
      excellent: "Plans using real availability, includes support load and adjusts from data."
      good: "Describes planning."
      weak: "Planned at full capacity."
    followups:
      - "What proportion was unplanned?"
      - "How did you track it?"
    common_errors:
      - "Planned at full capacity."

  - external_key: resume_screening.leadership_claims.tech_lead_code_ownership
    competency_key: code_quality
    topic: "Technical standards as lead"
    difficulty: medium
    text: "As technical lead you were responsible for quality. How did you keep standards without reviewing every change?"
    expected_concepts:
      - "automation"
      - "delegated review"
      - "principles"
      - "sampling"
      - "culture"
    rubric:
      excellent: "Automates checks, trains reviewers, samples changes and models good behaviour."
      good: "Describes review."
      weak: "Reviews everything personally."
    followups:
      - "What do you review yourself?"
      - "How do you train reviewers?"
    common_errors:
      - "Reviews everything personally."

  - external_key: resume_screening.leadership_claims.reliability_ownership_lead
    competency_key: incident_response
    topic: "Reliability as a team goal"
    difficulty: medium
    text: "You made reliability part of your team's goals. How did you balance it with feature work?"
    expected_concepts:
      - "measures"
      - "error budgets"
      - "planning"
      - "communication"
      - "results"
    rubric:
      excellent: "Sets measures, reserves time, and shows result."
      good: "Describes goals."
      weak: "Handled reliability as ad hoc."
    followups:
      - "What share of time?"
      - "How did you decide?"
    common_errors:
      - "Handled reliability as ad hoc."

  - external_key: resume_screening.leadership_claims.sponsor_stakeholder_buyin
    competency_key: stakeholder_management
    topic: "Getting executive buy-in"
    difficulty: medium
    text: "You needed senior sponsorship for an initiative. How did you get it?"
    expected_concepts:
      - "understanding concerns"
      - "business case"
      - "proof"
      - "ask"
      - "result"
    rubric:
      excellent: "Frames in sponsor's priorities with evidence and clear ask."
      good: "Describes the pitch."
      weak: "Presented technical details."
    followups:
      - "What objection did you hear?"
      - "What did they ask for?"
    common_errors:
      - "Presented technical details."

  - external_key: resume_screening.leadership_claims.team_restructure_roles
    competency_key: people_management
    topic: "Changing roles on a team"
    difficulty: hard
    text: "You changed someone's role or responsibilities. How did you handle the conversation and the transition?"
    expected_concepts:
      - "reasons"
      - "conversation"
      - "support"
      - "transition"
      - "outcome"
    rubric:
      excellent: "Explains reasons clearly, supports the person and manages the handover."
      good: "Describes the change."
      weak: "Announced it without a conversation."
    followups:
      - "How did they respond?"
      - "What support did you give?"
    common_errors:
      - "Announced it without a conversation."

  - external_key: resume_screening.leadership_claims.mentoring_peers_leads
    competency_key: mentoring
    topic: "Coaching other leaders"
    difficulty: medium
    text: "You coached other leads or aspiring leads. What did you help them see?"
    expected_concepts:
      - "observation"
      - "questions"
      - "examples"
      - "their growth"
      - "limits"
    rubric:
      excellent: "Gives specific example with the learner's own change."
      good: "Describes coaching."
      weak: "Gave advice only."
    followups:
      - "What was their main obstacle?"
      - "What did they do after?"
    common_errors:
      - "Gave advice only."

  - external_key: resume_screening.leadership_claims.decision_logging_transparency
    competency_key: communication
    topic: "Recording decisions"
    difficulty: easy
    text: "How did you keep a record of decisions and their reasons for your team?"
    expected_concepts:
      - "decision records"
      - "accessibility"
      - "review"
      - "use"
      - "effect"
    rubric:
      excellent: "Keeps accessible records and uses them to avoid repeating debates."
      good: "Describes records."
      weak: "Relies on memory."
    followups:
      - "Which record helped later?"
      - "Where are they kept?"
    common_errors:
      - "Relies on memory."

  - external_key: resume_screening.leadership_claims.product_engineering_partnership
    competency_key: collaboration
    topic: "Partnering with product"
    difficulty: medium
    text: "You worked closely with a product counterpart. How did you divide responsibilities, and what did you do when you disagreed?"
    expected_concepts:
      - "roles"
      - "shared goals"
      - "trade-off framing"
      - "escalation"
      - "trust"
    rubric:
      excellent: "Defines roles, uses shared goals and data in disagreements."
      good: "Describes partnership."
      weak: "Treated product as a customer or adversary."
    followups:
      - "What was the most difficult tradeoff?"
      - "How was it settled?"
    common_errors:
      - "Treated product as a customer or adversary."

  - external_key: resume_screening.leadership_claims.planning_after_reorg
    competency_key: project_management
    topic: "Replanning"
    difficulty: medium
    text: "Your team's goals changed suddenly. How did you replan and bring the team along?"
    expected_concepts:
      - "assessment"
      - "options"
      - "communication"
      - "commitments"
      - "results"
    rubric:
      excellent: "Assesses current work, decides what to stop, communicates and re-baselines."
      good: "Describes replan."
      weak: "Kept old commitments plus new."
    followups:
      - "What did you stop?"
      - "How did they react?"
    common_errors:
      - "Kept old commitments plus new."

  - external_key: resume_screening.leadership_claims.career_conversation_leader
    competency_key: people_management
    topic: "Career conversations"
    difficulty: easy
    text: "Someone on your team wanted a promotion you did not think they were ready for. How did you handle it?"
    expected_concepts:
      - "criteria"
      - "evidence"
      - "gap discussion"
      - "plan"
      - "follow-up"
    rubric:
      excellent: "Uses clear criteria and examples, builds plan with checkpoints."
      good: "Describes the conversation."
      weak: "Avoided the topic."
    followups:
      - "What evidence did you show?"
      - "What happened later?"
    common_errors:
      - "Avoided the topic."

  - external_key: resume_screening.leadership_claims.technical_excellence_example
    competency_key: code_quality
    topic: "Technical depth as a leader"
    difficulty: hard
    text: "Give an example where your hands-on technical judgement changed the outcome for your team."
    expected_concepts:
      - "situation"
      - "judgement"
      - "communication"
      - "effect"
      - "openness to being challenged"
    rubric:
      excellent: "Describes a specific technical call and its effect, with openness to being checked."
      good: "Describes a call."
      weak: "Relies on title."
    followups:
      - "Who checked it?"
      - "What did it save?"
    common_errors:
      - "Relies on title."

  - external_key: resume_screening.leadership_claims.dependency_management_teams
    competency_key: project_management
    topic: "Managing dependencies"
    difficulty: medium
    text: "Your team depended on a team that was behind schedule. What did you do?"
    expected_concepts:
      - "visibility"
      - "options"
      - "escalation"
      - "mitigation"
      - "result"
    rubric:
      excellent: "Spots early, offers options, mitigates and escalates properly."
      good: "Describes handling."
      weak: "Waited for the other team without taking any action."
    followups:
      - "What mitigation worked?"
      - "How early did you know?"
    common_errors:
      - "Waited for the other team without taking any action."

  - external_key: resume_screening.leadership_claims.innovation_time_prototype
    competency_key: leadership
    topic: "Encouraging new ideas"
    difficulty: medium
    text: "You encouraged new ideas from your team. Which idea became real, and how did you help it get there?"
    expected_concepts:
      - "space for ideas"
      - "evaluation"
      - "support"
      - "outcome"
      - "selecting"
    rubric:
      excellent: "Describes idea, evaluation and support and result."
      good: "Describes encouragement."
      weak: "Ignored ideas."
    followups:
      - "What idea did you stop?"
      - "How did you decide?"
    common_errors:
      - "Ignored ideas."

  - external_key: resume_screening.leadership_claims.delivery_commitment_missed
    competency_key: ownership
    topic: "Missed commitment"
    difficulty: hard
    text: "Your team missed a commitment you made. What did you do?"
    expected_concepts:
      - "early warning"
      - "communication"
      - "options"
      - "recovery"
      - "prevention"
    rubric:
      excellent: "Warns early, shows options and changes how commitments are made."
      good: "Describes the miss."
      weak: "Blamed others."
    followups:
      - "When did you know?"
      - "What changed?"
    common_errors:
      - "Blamed others."

  - external_key: resume_screening.leadership_claims.diverse_hiring_pipeline
    competency_key: people_management
    topic: "Fair hiring pipeline"
    difficulty: medium
    text: "How did you make your hiring pipeline reach a broader range of qualified candidates while keeping the evaluation job-related?"
    expected_concepts:
      - "sourcing"
      - "job requirement review"
      - "structured interviews"
      - "calibration"
      - "outcomes"
    rubric:
      excellent: "Reviews requirements, widens sourcing, uses structured evaluation and measures."
      good: "Describes some steps."
      weak: "Relied on referrals only."
    followups:
      - "Which requirement did you remove?"
      - "How did you measure?"
    common_errors:
      - "Relied on referrals only."

  - external_key: resume_screening.leadership_claims.escalation_judgement
    competency_key: leadership
    topic: "When to escalate"
    difficulty: medium
    text: "How did you decide what to resolve yourself and what to escalate?"
    expected_concepts:
      - "criteria"
      - "risk"
      - "impact"
      - "timing"
      - "example"
    rubric:
      excellent: "Gives clear criteria and an example of each."
      good: "Describes judgement."
      weak: "Escalates everything or nothing."
    followups:
      - "What was a late escalation?"
      - "What changed?"
    common_errors:
      - "Escalates everything or nothing."

  - external_key: resume_screening.leadership_claims.org_change_communication
    competency_key: communication
    topic: "Communicating bad news"
    difficulty: medium
    text: "You had to tell your team something difficult about the company or project. How did you do it?"
    expected_concepts:
      - "preparation"
      - "facts"
      - "empathy for impact"
      - "questions"
      - "follow-up"
    rubric:
      excellent: "Prepares facts, speaks plainly, answers questions and follows up."
      good: "Describes the message."
      weak: "Avoided details."
    followups:
      - "What did they ask?"
      - "What did you do after?"
    common_errors:
      - "Avoided details."

  - external_key: resume_screening.leadership_claims.staff_engineer_influence
    competency_key: leadership
    topic: "Influence without line management"
    difficulty: hard
    text: "Your resume lists technical leadership without direct reports. How did you create impact beyond your own code?"
    expected_concepts:
      - "identifying leverage"
      - "influencing"
      - "documents"
      - "mentoring"
      - "outcomes"
    rubric:
      excellent: "Identifies leverage areas, influences by evidence and mentoring, and shows outcome."
      good: "Describes influence."
      weak: "Impact limited to own code."
    followups:
      - "What did you change for others?"
      - "How did you measure?"
    common_errors:
      - "Impact limited to own code."

  - external_key: resume_screening.leadership_claims.quarterly_planning_participation
    competency_key: project_management
    topic: "Planning cycle contribution"
    difficulty: easy
    text: "What was your role in your organisation's planning cycle, and what did you bring to it?"
    expected_concepts:
      - "inputs"
      - "estimates"
      - "priorities"
      - "communication"
      - "outcome"
    rubric:
      excellent: "Describes inputs and contribution with outcome."
      good: "Describes role."
      weak: "Attended planning only."
    followups:
      - "What input changed a plan?"
      - "What estimate was off?"
    common_errors:
      - "Attended planning only."

  - external_key: resume_screening.leadership_claims.team_recognition_practice
    competency_key: people_management
    topic: "Recognising contribution"
    difficulty: easy
    text: "How did you recognise good work in your team, including work that was easy to overlook?"
    expected_concepts:
      - "visibility"
      - "specifics"
      - "fairness"
      - "frequency"
      - "effect"
    rubric:
      excellent: "Recognises specific contributions fairly, including invisible work."
      good: "Describes recognition."
      weak: "Praises only visible launches."
    followups:
      - "What invisible work did you notice?"
      - "How did you track it?"
    common_errors:
      - "Praises only visible launches."

  - external_key: resume_screening.leadership_claims.lead_by_example_standards
    competency_key: leadership
    topic: "Setting an example"
    difficulty: easy
    text: "What behaviours did you consciously model for your team, and how did you know they noticed?"
    expected_concepts:
      - "chosen behaviours"
      - "consistency"
      - "feedback"
      - "examples"
      - "effect"
    rubric:
      excellent: "Names behaviours with examples and evidence they were adopted."
      good: "Describes modelling."
      weak: "Says leads by example without detail."
    followups:
      - "What did you change about yourself?"
      - "What did people copy?"
    common_errors:
      - "Says leads by example without detail."

  - external_key: resume_screening.leadership_claims.long_term_vision_roadmap
    competency_key: leadership
    topic: "Long-term technical vision"
    difficulty: hard
    text: "You described a multi-year technical vision. What was it, and which parts have proven wrong or right since?"
    expected_concepts:
      - "vision"
      - "assumptions"
      - "reviews"
      - "adjustments"
      - "outcomes"
    rubric:
      excellent: "Describes the vision, tests assumptions and adjusts."
      good: "Describes vision."
      weak: "Vision is slogans."
    followups:
      - "Which assumption failed?"
      - "What did you change?"
    common_errors:
      - "Vision is slogans."

  - external_key: resume_screening.leadership_claims.learning_leadership_skills
    competency_key: adaptability
    topic: "Learning to lead"
    difficulty: easy
    text: "What have you done deliberately to improve as a leader, and what did it change?"
    expected_concepts:
      - "sources of learning"
      - "feedback seeking"
      - "practice"
      - "change"
      - "evidence"
    rubric:
      excellent: "Names specific learning and a change in behaviour."
      good: "Describes learning."
      weak: "Lists books."
    followups:
      - "Whose feedback did you seek?"
      - "What changed?"
    common_errors:
      - "Lists books."

  - external_key: resume_screening.leadership_claims.stakeholder_feedback_loop
    competency_key: stakeholder_management
    topic: "Learning from stakeholders"
    difficulty: easy
    text: "How did you get regular feedback from the people who depended on your team, and what did you change because of it?"
    expected_concepts:
      - "channels"
      - "frequency"
      - "acting on feedback"
      - "closing the loop"
      - "example"
    rubric:
      excellent: "Uses regular channels, acts visibly and closes the loop with a concrete example."
      good: "Describes feedback gathering."
      weak: "Waited for complaints."
    followups:
      - "What was the most useful feedback?"
      - "What did you not change?"
    common_errors:
      - "Waited for complaints."
