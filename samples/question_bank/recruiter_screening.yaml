# Curated questions: recruiter screening. Only job-related topics — motivation, role alignment,
# practical requirements stated in the job posting and working values. Never ask about age, family,
# health, disability, religion, national origin, citizenship or current/past salary.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter.communication.background_walkthrough
    competency_key: communication
    topic: Background walk-through
    difficulty: easy
    kind: intro
    round_types: [recruiter_screening, resume_screening, combined]
    text: >-
      To start, could you walk me through your background and what you're working on at the moment?
    expected_concepts:
      - concise career summary
      - current role and responsibilities
      - most relevant experience for this job
      - clear structure
    rubric:
      excellent: Gives a concise, well-structured summary that highlights the experience most relevant to this role and what they currently own.
      good: Clear summary with relevant points.
      weak: Unstructured, very long or unrelated to the role.
    followups:
      - Which part of that experience is most relevant to this role?
      - What are you proudest of in your current role?
    common_errors:
      - Reciting the resume line by line.
      - Not connecting experience to the role.

  - external_key: recruiter.motivation.why_this_role
    competency_key: motivation
    topic: Why this role
    difficulty: easy
    text: >-
      What made you interested in applying for this particular role?
    expected_concepts:
      - specific aspects of the role or team
      - connection to their experience and goals
      - understanding of the work involved
    rubric:
      excellent: Names specific aspects of the role and its work and connects them convincingly to their experience and goals.
      good: Clear reasons related to the role.
      weak: Generic answer that could apply to any job.
    followups:
      - Which part of the job description stood out most?
      - What would make this role a great next step for you?
    common_errors:
      - Generic reasons unrelated to the role.
      - Focusing only on what they want without the role's needs.

  - external_key: recruiter.motivation.next_role
    competency_key: motivation
    topic: What they want from their next role
    difficulty: easy
    text: >-
      What are you looking for in your next role that you don't have today?
    expected_concepts:
      - specific goals (scope, technology, impact, learning)
      - realistic expectations
      - alignment with the role
    rubric:
      excellent: Describes specific, realistic goals and how this role could provide them.
      good: Clear goals with some link to the role.
      weak: Vague or purely negative about the current employer.
    followups:
      - How would you know, a year from now, that the move was the right one?
      - Which of these matters most to you?
    common_errors:
      - Speaking negatively about the current employer instead of describing goals.
      - Goals that do not match the role at all.

  - external_key: recruiter.motivation.rewarding_work
    competency_key: motivation
    topic: Most rewarding work
    difficulty: easy
    text: >-
      Thinking about your recent work, which kinds of tasks or projects have you found most rewarding, and why?
    expected_concepts:
      - concrete examples of work
      - reasons tied to outcomes or learning
      - overlap with the role's responsibilities
    rubric:
      excellent: Gives concrete examples with clear reasons and shows how similar work appears in this role.
      good: Concrete examples and reasons.
      weak: Abstract answer without examples.
    followups:
      - How much of that kind of work do you expect in this role?
      - Which tasks do you find least rewarding?
    common_errors:
      - No concrete examples.
      - Describing work unrelated to the role.

  - external_key: recruiter.motivation.role_research
    competency_key: motivation
    topic: Understanding of the team's work
    difficulty: medium
    text: >-
      From what you've read about this team and role, what problems do you think we're trying to solve, and which
      of them would you most like to work on?
    expected_concepts:
      - understanding of the job description
      - reasonable inferences about challenges
      - link to their strengths
      - curiosity and questions
    rubric:
      excellent: Shows a thoughtful reading of the role, infers realistic challenges, links them to their strengths and asks sharp clarifying questions.
      good: Reasonable understanding and interest in specific areas.
      weak: No understanding of the role beyond its title.
    followups:
      - What would you want to learn in your first month?
      - What questions do you have about the team?
    common_errors:
      - Not having read the job description.
      - Stating assumptions about the team as facts without asking any questions.

  - external_key: recruiter.recruiter_fit.working_arrangement
    competency_key: recruiter_fit
    topic: Working arrangement in the posting
    difficulty: easy
    text: >-
      The working arrangement for this role — location, remote or hybrid pattern and core hours — is described in
      the job posting. Does that arrangement work for you, and is there anything you'd like to clarify?
    expected_concepts:
      - clear confirmation or stated constraints
      - questions about specifics
    rubric:
      excellent: Confirms clearly or states constraints precisely and raises useful clarifying questions.
      good: Clear answer about the arrangement.
      weak: Unclear answer that leaves the recruiter guessing.
    followups:
      - Is there anything about the arrangement you'd want to discuss with the hiring manager?
    common_errors:
      - Ambiguous answers that defer important constraints.

  - external_key: recruiter.recruiter_fit.start_availability
    competency_key: recruiter_fit
    topic: Availability to start
    difficulty: easy
    text: >-
      If things go well, when would you be able to start? Is there a notice period or any commitment we should
      plan around?
    expected_concepts:
      - notice period or availability date
      - known work commitments to plan around
    rubric:
      excellent: Gives a clear availability timeline and any work-related commitments to plan around.
      good: Clear availability.
      weak: No clear answer.
    followups:
      - Is the notice period negotiable with your current employer?
    common_errors:
      - Not knowing their notice period.

  - external_key: recruiter.recruiter_fit.scope_expectations
    competency_key: recruiter_fit
    topic: Scope and level expectations
    difficulty: easy
    text: >-
      What scope of responsibility are you looking for in this role — for example, the size of systems you'd own
      or whether you'd lead projects or people?
    expected_concepts:
      - desired scope of ownership
      - individual contributor versus leadership expectations
      - alignment with the posted level
    rubric:
      excellent: Describes desired scope clearly and relates it to the role's level and responsibilities, noting any differences to discuss.
      good: Clear expectations about scope.
      weak: Expectations unclear or very different from the role without acknowledging it.
    followups:
      - How does that compare with your current scope?
    common_errors:
      - Expectations far from the posted level without discussion.

  - external_key: recruiter.recruiter_fit.on_call
    competency_key: recruiter_fit
    topic: On-call participation
    difficulty: easy
    role_tags: [devops, sre, platform, backend]
    text: >-
      This role includes taking part in an on-call rotation, as described in the posting. Have you done on-call
      before, and what support would you expect from the team?
    expected_concepts:
      - previous on-call experience or willingness to learn
      - expectations about rotation, tooling and escalation
      - questions about the rotation
    rubric:
      excellent: Describes relevant on-call experience or a clear plan to ramp up, and asks informed questions about rotation size, tooling and escalation.
      good: Clear answer with reasonable expectations.
      weak: Unclear about whether they can meet the requirement.
    followups:
      - What made an on-call rotation work well or badly in your experience?
    common_errors:
      - Not engaging with the stated requirement.

  - external_key: recruiter.recruiter_fit.requirement_gaps
    competency_key: recruiter_fit
    topic: Requirements they are still building
    difficulty: medium
    text: >-
      Looking at the requirements in the job posting, are there any areas you're still building experience in,
      and how would you get up to speed?
    expected_concepts:
      - specific self-assessment against the requirements
      - specific plan to close gaps
      - transferable experience
    rubric:
      excellent: Identifies specific gaps clearly, points to transferable experience and gives a concrete plan to close them.
      good: Names gaps with some plan.
      weak: Claims no gaps at all or cannot relate to the requirements.
    followups:
      - What support would help you most in the first three months?
    common_errors:
      - Overstating experience in every area.

  - external_key: recruiter.culture_values.healthy_team
    competency_key: culture_values
    topic: What makes a team effective
    difficulty: easy
    round_types: [recruiter_screening, behavioral]
    text: >-
      Based on teams you've worked in, what does a healthy, effective team look like to you? What do you
      personally do to contribute to that?
    expected_concepts:
      - concrete team practices
      - examples from experience
      - personal contribution
    rubric:
      excellent: Describes concrete practices from real teams and specific things they do to contribute.
      good: Reasonable description with some personal contribution.
      weak: Abstract values with no examples.
    followups:
      - Can you give an example of something you changed in a team's way of working?
    common_errors:
      - Describing only what others should do.

  - external_key: recruiter.culture_values.feedback_preferences
    competency_key: culture_values
    topic: Giving and receiving feedback
    difficulty: easy
    round_types: [recruiter_screening, behavioral]
    text: >-
      How do you like to give and receive feedback at work? Could you share an example of feedback that really
      helped you?
    expected_concepts:
      - preferred feedback practices
      - example of acting on feedback
      - example of giving feedback constructively
    rubric:
      excellent: Describes clear feedback practices and a specific example of acting on feedback with a visible result.
      good: Sensible practices with an example.
      weak: No example or dismissive of feedback.
    followups:
      - How do you give feedback to someone more senior than you?
    common_errors:
      - Choosing an example without any change in behaviour.
