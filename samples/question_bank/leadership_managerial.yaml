# Curated questions: technical leadership, mentoring, stakeholder management, delivery and
# product sense. People-related questions focus on observable work and support given — never on
# personal details about the candidate or third parties.
version: 1
defaults:
  role_tags: [tech_lead, engineering_manager]
  round_types: [leadership, managerial, behavioral]
  kind: leadership
questions:
  # ------------------------------------------------------------- leadership
  - external_key: leadership.leadership.major_migration
    competency_key: leadership
    topic: Leading a large migration
    difficulty: medium
    role_tags: [tech_lead, engineering_manager, devops, platform, backend]
    round_types: [leadership, managerial, behavioral, technical_screening, combined, resume_screening]
    text: >-
      Tell me about a large migration you led — for example moving dozens of services to a new platform. How did
      you plan it, bring the team along, and know it was done?
    expected_concepts:
      - scope, sequencing and pilot services
      - migration playbook or tooling for repeatability
      - delegation and ownership across the team
      - risk management and rollback paths
      - progress tracking and success criteria
      - decommissioning the old platform
    rubric:
      excellent: Explains scope and sequencing with a pilot, repeatable tooling, clear delegation, rollback plans and measurable completion criteria, and is precise about their personal role versus the team's.
      good: Credible plan and execution with some measurement.
      weak: Vague about the plan, the numbers or their own contribution.
    followups:
      - How many services were there, and how many did you migrate personally?
      - Which service was hardest to move, and why?
      - How did you decide the old platform could be switched off?
    common_errors:
      - Claiming the whole team's work as individual work.
      - No definition of done, leaving the old platform running indefinitely.

  - external_key: leadership.leadership.technical_strategy
    competency_key: leadership
    topic: Setting technical direction
    difficulty: hard
    round_types: [leadership, managerial]
    text: >-
      Tell me about a time you set the technical direction for a team or platform over a year or more. How did
      you decide on it, and how did you get people to commit?
    expected_concepts:
      - understanding business goals and constraints
      - assessing current state and options
      - written strategy with trade-offs
      - building alignment with stakeholders and engineers
      - milestones and measurable outcomes
      - adjusting when reality changed
    rubric:
      excellent: Connects strategy to business goals, evaluates options transparently, builds buy-in through writing and discussion, defines milestones and adapts based on results.
      good: Clear direction with reasoning and some alignment work.
      weak: Direction imposed without reasoning, or no example.
    followups:
      - Which part of the strategy turned out to be wrong?
      - How did you handle engineers who disagreed?
    common_errors:
      - Technology choices disconnected from business goals.
      - No milestones to show progress.

  - external_key: leadership.leadership.influence_without_authority
    competency_key: leadership
    topic: Leading without formal authority
    difficulty: medium
    role_tags: [tech_lead, engineering_manager, general]
    text: >-
      Describe a time you needed people who didn't report to you to change how they worked. How did you
      convince them?
    expected_concepts:
      - understanding their incentives
      - evidence and demonstrations
      - finding early adopters
      - making the change easy
      - measuring and sharing results
    rubric:
      excellent: Understands others' incentives, uses evidence and early adopters, lowers the cost of change and shows measurable results that drive wider adoption.
      good: Persuasion based on evidence with a positive outcome.
      weak: Relies on escalation or mandates.
    followups:
      - Who resisted the most, and what changed their mind?
      - What did you do to make adoption easier?
    common_errors:
      - Pushing a change without understanding others' constraints.
      - Declaring success without adoption data.

  - external_key: leadership.leadership.wrong_decision
    competency_key: leadership
    topic: A leadership decision that turned out wrong
    difficulty: hard
    text: >-
      Tell me about a significant decision you made as a lead that turned out to be wrong. How did you realise
      it, and what did you do next?
    expected_concepts:
      - the decision and its reasoning at the time
      - signals that it was wrong
      - acknowledging it openly
      - correcting course and limiting damage
      - changes to decision-making afterwards
    rubric:
      excellent: Explains the original reasoning and what was known at the time, recognised the signals, owned the mistake openly, corrected course decisively and improved how decisions are made.
      good: Clear example with a reasonable correction.
      weak: Example where the mistake was really someone else's, or no lesson.
    followups:
      - How did you tell the team?
      - What would have helped you notice sooner?
    common_errors:
      - Choosing a trivial example.
      - Blaming circumstances rather than reflecting on the decision.

  # --------------------------------------------------------------- mentoring
  - external_key: leadership.mentoring.junior_engineers
    competency_key: mentoring
    topic: Mentoring junior engineers
    difficulty: easy
    role_tags: [tech_lead, engineering_manager, general]
    text: >-
      How do you mentor junior engineers? Give me a specific example of someone you helped and what changed for
      them.
    expected_concepts:
      - understanding the person's goals
      - regular one-to-ones or pairing
      - stretch tasks with support
      - specific, actionable feedback
      - observable growth
    rubric:
      excellent: Describes a tailored approach with a specific person, concrete techniques and observable growth in that person's work.
      good: Clear mentoring practices and an example.
      weak: Generic statements such as "I answer questions when asked".
    followups:
      - How did you adapt your approach to that person?
      - How did you know they were improving?
    common_errors:
      - Solving problems for mentees instead of coaching them.
      - No concrete outcome.

  - external_key: leadership.mentoring.growing_someone
    competency_key: mentoring
    topic: Growing someone into a bigger role
    difficulty: medium
    text: >-
      Tell me about someone you helped grow into a larger role, such as becoming a senior engineer or a tech
      lead. What did you do specifically?
    expected_concepts:
      - identifying the growth opportunity
      - a development plan with milestones
      - delegating meaningful ownership
      - sponsorship and visibility
      - feedback loops and outcome
    rubric:
      excellent: Describes a deliberate plan, meaningful delegated ownership, sponsorship and regular feedback, ending with a concrete promotion or role change.
      good: Specific support actions and a positive outcome.
      weak: Takes credit for growth without describing their actions.
    followups:
      - What did you delegate that felt risky?
      - How did you advocate for them?
    common_errors:
      - Delegating tasks without authority.
      - Vague outcomes.

  - external_key: leadership.mentoring.onboarding
    competency_key: mentoring
    topic: Improving onboarding
    difficulty: easy
    role_tags: [tech_lead, engineering_manager, general]
    text: >-
      What have you done to help new team members become productive quickly? What did you measure?
    expected_concepts:
      - onboarding plan or checklist
      - starter tasks
      - buddy or mentor
      - documentation improvements
      - time to first meaningful contribution
    rubric:
      excellent: Describes a structured onboarding approach they built or improved, with documentation and starter tasks, and a measured improvement such as time to first production change.
      good: Concrete onboarding practices.
      weak: Leaves onboarding to chance or documentation alone.
    followups:
      - How long did it take a new engineer to ship their first change?
      - What feedback did new joiners give you?
    common_errors:
      - No measurement of whether onboarding works.
      - Outdated documentation as the only resource.

  # ------------------------------------------------- stakeholder_management
  - external_key: leadership.stakeholders.unrealistic_deadline
    competency_key: stakeholder_management
    topic: Pushing back on an unrealistic deadline
    difficulty: medium
    role_tags: [tech_lead, engineering_manager, general]
    text: >-
      Tell me about a time you were given a deadline you believed was unrealistic. What did you do?
    expected_concepts:
      - understanding why the date matters
      - estimating with data
      - presenting options (scope, resources, phasing)
      - agreeing a plan
      - keeping the stakeholder informed
    rubric:
      excellent: Understood the business driver, quantified the gap, offered concrete options such as phased delivery or reduced scope and reached an agreed, realistic plan.
      good: Pushed back constructively with alternatives.
      weak: Accepted silently and missed, or refused without alternatives.
    followups:
      - What did you give up in the end?
      - How did you rebuild trust if the date still slipped?
    common_errors:
      - Saying yes and hoping.
      - Pushing back without understanding the stakeholder's goal.

  - external_key: leadership.stakeholders.executive_incident_update
    competency_key: stakeholder_management
    topic: Communicating with executives during a crisis
    difficulty: hard
    role_tags: [tech_lead, engineering_manager, sre, devops]
    text: >-
      During a major outage, executives want updates every 15 minutes while your team is trying to fix the
      problem. How do you manage that communication? Tell me about a time you did this.
    expected_concepts:
      - dedicated communications role
      - concise updates on impact, actions and next update time
      - protecting the responders' focus
      - avoiding speculation
      - follow-up summary and postmortem
    rubric:
      excellent: Separates communication from response, gives concise impact-focused updates with next-update times, avoids speculation, protects responders and follows up with a clear summary.
      good: Regular, clear updates with some structure.
      weak: Either goes silent or lets executives pull engineers into calls.
    followups:
      - What does a good 15-minute update contain?
      - How do you handle an executive who asks for an ETA you can't give?
    common_errors:
      - Speculating about causes too early.
      - Engineers fielding executive questions while debugging.

  - external_key: leadership.stakeholders.keeping_informed
    competency_key: stakeholder_management
    topic: Keeping stakeholders informed on long projects
    difficulty: easy
    role_tags: [tech_lead, engineering_manager, general]
    text: >-
      On a long project, how do you keep stakeholders informed so nothing surprises them? Give me an example.
    expected_concepts:
      - regular cadence and format
      - status focused on outcomes and risks
      - early warning of changes
      - tailoring detail to the audience
    rubric:
      excellent: Describes a consistent cadence with outcome-focused updates, explicit risks and early warnings tailored to each audience, with a concrete example.
      good: Regular updates with risks included.
      weak: Updates only when asked.
    followups:
      - What did a typical update look like?
      - How did you flag a risk that was becoming likely?
    common_errors:
      - Activity-focused updates without status against goals.
      - Hiding risks until they become problems.

  # ------------------------------------------------------ project_management
  - external_key: leadership.project_management.planning_estimation
    competency_key: project_management
    topic: Planning and estimating a multi-month project
    difficulty: easy
    role_tags: [tech_lead, engineering_manager, general]
    text: >-
      How do you break down and estimate a project that will take several months? Walk me through one you
      planned.
    expected_concepts:
      - milestones with clear deliverables
      - breaking work into small pieces
      - estimating with ranges and uncertainty
      - identifying dependencies and risks early
      - re-estimating as you learn
    rubric:
      excellent: Breaks work into milestones and small tasks, estimates with ranges, surfaces dependencies and risks early and re-plans as information arrives, with a real example.
      good: Sensible breakdown and estimates.
      weak: Single-point estimate for the whole project.
    followups:
      - How accurate was your estimate in the end, and why?
      - Which risk did you spot early that paid off?
    common_errors:
      - Ignoring integration and testing time.
      - Never revisiting the plan.

  - external_key: leadership.project_management.scope_creep
    competency_key: project_management
    topic: Handling scope creep
    difficulty: medium
    role_tags: [tech_lead, engineering_manager, general]
    text: >-
      Tell me about a project where the scope kept growing. How did you handle it?
    expected_concepts:
      - recognising scope growth early
      - making trade-offs visible
      - change control with stakeholders
      - protecting the core goal
      - outcome
    rubric:
      excellent: Spotted scope creep early, made the cost visible, negotiated trade-offs with stakeholders and protected the core goal, with a concrete outcome.
      good: Managed scope with stakeholder agreement.
      weak: Absorbed all requests and missed the deadline.
    followups:
      - What did you say no to?
      - How did you make the trade-offs visible?
    common_errors:
      - Saying yes to every request.
      - Cutting quality silently instead of scope.

  - external_key: leadership.project_management.rescue_project
    competency_key: project_management
    topic: Rescuing an at-risk project
    difficulty: hard
    text: >-
      Tell me about a time you took over or turned around a project that was late and at risk. What did you do
      in the first two weeks?
    expected_concepts:
      - fact-finding on real status
      - resetting scope and plan
      - addressing root causes (dependencies, unclear requirements, capacity)
      - communicating a credible new plan
      - tracking progress visibly
    rubric:
      excellent: Establishes the real status quickly, addresses root causes, resets scope and plan credibly with stakeholders, and tracks recovery visibly with results.
      good: Sensible recovery steps and outcome.
      weak: Adds pressure or overtime without diagnosing causes.
    followups:
      - What was the real reason the project was late?
      - How did you regain the team's trust in the plan?
    common_errors:
      - Adding people late in the project without considering ramp-up cost.
      - Keeping the original scope and hoping to catch up.

  # ------------------------------------------------------------ product_sense
  - external_key: leadership.product_sense.tech_debt_vs_features
    competency_key: product_sense
    topic: Prioritising technical debt against features
    difficulty: medium
    role_tags: [tech_lead, engineering_manager, general]
    round_types: [leadership, managerial, behavioral, technical_screening]
    text: >-
      How do you decide when to pay down technical debt instead of building new features? Tell me about a time
      you made that case to product or business stakeholders.
    expected_concepts:
      - quantifying the cost of debt (incidents, velocity, onboarding)
      - linking debt to business outcomes
      - incremental pay-down alongside features
      - agreeing a capacity allocation
      - measuring results afterwards
    rubric:
      excellent: Quantifies the impact of debt in business terms, proposes an incremental plan with agreed capacity and measures the results afterwards.
      good: Makes a reasonable case with some evidence.
      weak: Argues for rewrites without evidence.
    followups:
      - Which metric convinced your stakeholders?
      - How do you stop debt from accumulating again?
    common_errors:
      - Framing debt work purely as engineering preference.
      - Big-bang rewrites instead of incremental improvement.

  - external_key: leadership.product_sense.platform_success
    competency_key: product_sense
    topic: Measuring an internal platform's success
    difficulty: hard
    role_tags: [tech_lead, engineering_manager, platform, devops]
    round_types: [leadership, managerial, technical_screening]
    text: >-
      If you led an internal developer platform, how would you know whether it was actually succeeding? Which
      metrics would you use, and how would you gather feedback from users?
    expected_concepts:
      - adoption and voluntary usage
      - delivery metrics (lead time, deployment frequency, change failure rate, recovery time)
      - developer satisfaction surveys
      - time saved on common tasks
      - treating the platform as a product with a roadmap
    rubric:
      excellent: Combines adoption, delivery and satisfaction metrics with qualitative feedback, treats the platform as a product with users and a roadmap, and avoids vanity metrics.
      good: Reasonable metrics and feedback mechanisms.
      weak: Measures only uptime or number of features shipped.
    followups:
      - How would you tell whether teams use the platform because they want to or because they must?
      - Which metric could be gamed, and how would you avoid that?
    common_errors:
      - Vanity metrics such as number of services onboarded without outcomes.
      - Mandating adoption instead of earning it.

  # ----------------------------------------------------- managerial: people
  - external_key: leadership.leadership.performance_concern
    competency_key: leadership
    topic: Addressing a performance concern
    difficulty: hard
    role_tags: [engineering_manager, tech_lead]
    round_types: [managerial, leadership]
    text: >-
      Tell me about a time someone on your team wasn't meeting expectations in their work. How did you handle
      it? Please keep the focus on the work and the support you gave rather than personal details.
    expected_concepts:
      - clarifying expectations with specific examples of the work
      - understanding obstacles
      - support plan with clear goals and timeline
      - regular, documented feedback
      - fair and consistent process
      - outcome for the person and the team
    rubric:
      excellent: Describes clear, work-based expectations, genuine effort to understand obstacles, a supportive plan with measurable goals and regular feedback, a fair process and the outcome.
      good: Clear feedback and support with a defined outcome.
      weak: Avoided the issue for months or shares personal details about the person.
    followups:
      - How did you make sure the process was fair and consistent?
      - What did you learn about setting expectations earlier?
    common_errors:
      - Vague feedback without specific examples of work.
      - Delaying the conversation until the problem is severe.
