# Curated questions: debugging reasoning (part 3 of 4).
# Frontend and mobile symptoms, client and API contracts, builds and bundles, UI tests, client versions.
# Spoken scenario questions; the candidate reasons aloud without running code.
version: 1
defaults:
  competency_key: debugging
  kind: scenario
  role_tags: [backend, frontend, qa, mobile]
  round_types: [problem_solving, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.debugging_reasoning.button_not_clickable
    topic: Element visible but not clickable
    difficulty: easy
    text: >-
      A button is clearly visible on one page, but users can't click it. How would you work out what's
      blocking it?
    expected_concepts:
      - inspect the element under the pointer with dev tools
      - invisible overlay or element on top (z-index, transparent layer)
      - pointer-events or disabled state set by styles or code
      - handler not attached or attached to a different element
      - compare with a page where the same button works
    rubric:
      excellent: Uses dev tools to check what element actually receives the click, distinguishes an overlay from a disabled state from a missing handler and confirms by comparing with a working page.
      good: Inspects the element and checks for overlays or missing handlers.
      weak: Changes the button's styling at random until it works.
    followups:
      - The click reaches the button but nothing happens. Where next?
      - It only fails on small screens. What does that suggest?
    common_errors:
      - Assuming the handler is broken without checking which element received the click.

  - external_key: problem_solving.debugging_reasoning.server_rejects_valid_form
    topic: Client and server validation disagreeing
    difficulty: easy
    text: >-
      A form passes validation in the browser, but the server rejects it with an error the user never gets
      to see. How would you figure out where the frontend and backend disagree?
    expected_concepts:
      - capture the actual request payload and response in the network tab
      - compare client rules with server rules field by field
      - formatting differences (trimming, encoding, date formats, number types)
      - error response not being handled or displayed
      - shared schema or contract tests
    rubric:
      excellent: Captures the real request and response, compares the two sets of rules for the failing field, fixes the silent error handling and suggests sharing validation rules or contract tests.
      good: Looks at the request and response and identifies the mismatched field.
      weak: Loosens server validation until the error goes away.
    followups:
      - How would you make sure the user sees server-side errors in future?
      - Should validation rules be shared between client and server?
    common_errors:
      - Fixing the mismatch but leaving the error handling silent.

  - external_key: problem_solving.debugging_reasoning.empty_fields_no_release
    topic: App breaks without an app release
    difficulty: easy
    text: >-
      The mobile app suddenly shows empty values on a screen that used to work, and no new app version has
      been released. How would you find out what changed?
    expected_concepts:
      - backend or API responses changing shape
      - remote config, feature flags or content changes
      - capture current API responses and compare with expected
      - check recent backend deploys
      - client parsing that silently drops unknown or renamed fields
    rubric:
      excellent: Reasons that the change must be server-side or remote, captures real responses to compare with what the client expects and checks deploys and config changes in that window.
      good: Inspects the API response and finds the renamed or missing field.
      weak: Starts debugging the app's UI code first.
    followups:
      - How would you protect old app versions from backend changes like this?
      - Why might the client show empty values rather than crashing?
    common_errors:
      - Assuming the app must be at fault because that's where the symptom is.

  - external_key: problem_solving.debugging_reasoning.minified_trace_line_one
    topic: Minified production stack traces
    difficulty: easy
    text: >-
      A JavaScript error in production only gives you a minified stack trace pointing at line one, column
      forty thousand. How would you get to the real source of the error?
    expected_concepts:
      - source maps matched to the exact build
      - upload source maps to error tracking privately
      - match the build or release version of the error
      - reproduce with the production bundle locally
      - use the error message and context as additional clues
    rubric:
      excellent: Explains using source maps tied to the exact released build, keeping them private through error tracking, and falling back to reproducing with the production bundle when maps aren't available.
      good: Knows to use source maps to translate the trace.
      weak: Searches the source for the error text with no way to locate the line.
    followups:
      - The source maps don't match the deployed bundle. How would you know?
      - Should source maps be public, and why?
    common_errors:
      - Using source maps from a different build than the one that produced the error.

  - external_key: problem_solving.debugging_reasoning.images_fail_some_users
    topic: Assets failing for some users
    difficulty: easy
    text: >-
      Images on a product page fail to load for some users but always work for you. How would you narrow
      down why?
    expected_concepts:
      - find what affected users share (browser, region, network, account)
      - check the failing image URLs and status codes
      - CDN edge differences or regional blocking
      - unsupported image formats or ad blockers
      - error monitoring for resource load failures
    rubric:
      excellent: Gathers what affected users share, captures the exact failing requests, and considers CDN edges, formats and client-side blockers with a way to test each.
      good: Asks for the failing URLs and checks CDN or browser differences.
      weak: Re-uploads the images.
    followups:
      - How could you detect image load failures without users reporting them?
      - Only users of one browser are affected. What would you check?
    common_errors:
      - Not asking for the actual failing request from an affected user.

  - external_key: problem_solving.debugging_reasoning.page_jumps_after_load
    topic: Layout shifts
    difficulty: easy
    text: >-
      A page looks right at first, then jumps around a second later, so users click the wrong thing. How
      would you find what's causing the shift?
    expected_concepts:
      - layout shift tooling in browser dev tools
      - images or embeds without reserved dimensions
      - web fonts swapping in
      - content injected above existing content (banners, ads)
      - throttle the network to slow the sequence down
    rubric:
      excellent: Uses layout shift tooling with a throttled network to see which elements move and why, then names fixes matched to the cause such as reserved space or font loading strategy.
      good: Identifies late-loading images or banners as the likely cause.
      weak: Adds delays or hides content until everything loads.
    followups:
      - How would you measure this for real users, not just in your browser?
      - The shift only happens on the first visit. What does that suggest?
    common_errors:
      - Testing only on a fast connection where the shift is too quick to see.

  - external_key: problem_solving.debugging_reasoning.wifi_works_cellular_fails
    topic: Network-dependent mobile failures
    difficulty: easy
    text: >-
      A feature in your mobile app works on Wi-Fi but fails on cellular data. How would you go about finding
      the cause?
    expected_concepts:
      - slower or less reliable network exposing short timeouts
      - IPv6-only or carrier network differences
      - app or OS settings restricting cellular data
      - large payloads or uploads
      - simulate poor network conditions and capture traffic
    rubric:
      excellent: Lists concrete differences between the networks (latency, IPv6, data restrictions, carrier proxies), simulates them with network conditioning and captures traffic to confirm which matters.
      good: Suspects timeouts or settings and tests with throttled networks.
      weak: Tells users to use Wi-Fi.
    followups:
      - How would you simulate a poor or IPv6-only network during testing?
      - What would the logs need to include to diagnose this from the field?
    common_errors:
      - Overlooking the per-app cellular data setting on the device.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.debugging_reasoning.server_client_render_differ
    topic: Server and client rendering mismatches
    difficulty: medium
    text: >-
      A server-rendered page shows one set of content, then switches to different content once the
      JavaScript loads, and the console shows a mismatch warning. How would you find what's rendering
      differently on the server and in the browser?
    expected_concepts:
      - compare the server HTML with the client's first render
      - time, time zone, locale or random values differing
      - browser-only data such as window size or stored values
      - data fetched differently on each side
      - render browser-only values after mount
    rubric:
      excellent: Diffs server HTML against the client's first render to find the node, names common sources of divergence (time, locale, randomness, browser-only state) and fixes the source rather than suppressing the warning.
      good: Finds the differing element and suspects dates or browser-only values.
      weak: Suppresses the warning or disables server rendering.
    followups:
      - Why does a date formatted on both sides often cause this?
      - When is suppressing the warning acceptable?
    common_errors:
      - Treating the warning as cosmetic.

  - external_key: problem_solving.debugging_reasoning.handler_runs_twice
    topic: Duplicate event handlers
    difficulty: medium
    text: >-
      A click handler in your web app runs twice for every click, but only after the user navigates away
      from the page and comes back. How would you track down why?
    expected_concepts:
      - listeners added on mount and never removed
      - global or document-level listeners in components
      - inspect registered listeners in dev tools
      - count registrations with logging per navigation
      - cleanup functions on unmount
    rubric:
      excellent: Connects the navigation pattern to listeners accumulating on each mount, confirms by inspecting listeners or counting registrations and fixes cleanup on unmount.
      good: Suspects listeners being registered twice and looks for missing cleanup.
      weak: Adds a flag to ignore the second call.
    followups:
      - The count goes up by one each time you return. What does that confirm?
      - How would you find leaked listeners across a large app?
    common_errors:
      - Debouncing the handler instead of fixing the registration.

  - external_key: problem_solving.debugging_reasoning.breaks_only_in_prod_bundle
    topic: Production build differences
    difficulty: medium
    text: >-
      A web feature works in development mode but breaks in the production bundle. How would you narrow down
      what the build process is changing?
    expected_concepts:
      - minification renaming or removing code (tree shaking, side effects)
      - environment variables and dev-only code paths
      - differences in polyfills or target browsers
      - build locally in production mode and reproduce
      - disable optimisations one at a time
    rubric:
      excellent: Reproduces with a local production build, lists what the build changes (minification, tree shaking, env values, targets) and disables them one at a time to isolate the one that matters.
      good: Builds in production mode locally and suspects minification or env variables.
      weak: Deploys a development build to production.
    followups:
      - Code relying on function names works in development only. Why?
      - How would you catch this class of bug in CI?
    common_errors:
      - Not reproducing with an actual production build.

  - external_key: problem_solving.debugging_reasoning.parse_fails_some_records
    topic: Contract and data disagreeing
    difficulty: medium
    text: >-
      Your client crashes while parsing an API response, but only for some records, and the API team says
      nothing has changed. How would you show where the contract and the data disagree?
    expected_concepts:
      - capture the exact failing response
      - compare against the documented schema field by field
      - nulls, empty values, unexpected types or new enum values
      - old data never matching the contract
      - make parsing tolerant and report schema violations
    rubric:
      excellent: Captures a failing payload, pinpoints the field that violates the schema, recognises the data could be old rather than changed and proposes tolerant parsing plus validation on both sides.
      good: Finds the field causing the crash and shares the example with the API team.
      weak: Wraps the parsing in a catch-all and moves on.
    followups:
      - How would you detect these mismatches before they crash users?
      - Who should own the fix when both sides are partly at fault?
    common_errors:
      - Arguing about whether anything changed instead of sharing the failing payload.

  - external_key: problem_solving.debugging_reasoning.offline_sync_loses_changes
    topic: Offline sync data loss
    difficulty: medium
    text: >-
      A mobile app that works offline sometimes loses changes after it reconnects and syncs. How would you
      reproduce that reliably and find where the data goes missing?
    expected_concepts:
      - control network state and timing to reproduce
      - edits on multiple devices or the server while offline
      - conflict resolution overwriting local changes
      - local queue being cleared before the server confirms
      - log each step of the sync with identifiers
    rubric:
      excellent: Designs a controlled reproduction (toggle network, edit on two sides, reconnect), traces each change through the local queue and server and identifies whether it was dropped locally or overwritten by conflict resolution.
      good: Reproduces with airplane mode and inspects the sync logic for conflicts.
      weak: Asks users to stay online while editing.
    followups:
      - The app is killed in the middle of a sync. What can happen?
      - How should conflicts be shown to the user?
    common_errors:
      - Testing only one device, which never produces conflicts.

  - external_key: problem_solving.debugging_reasoning.cut_off_on_some_screens
    topic: Device-specific layout problems
    difficulty: medium
    text: >-
      A screen in your mobile app looks fine on most phones, but on a few screen sizes the submit button is
      cut off and unreachable. How would you investigate without owning those devices?
    expected_concepts:
      - get exact device, screen size, font scale and OS version from reports
      - emulators or cloud device farms
      - large accessibility font sizes and display zoom
      - notches, system bars and safe areas
      - layout that doesn't scroll when content overflows
    rubric:
      excellent: Collects the exact device and display settings, reproduces with emulators or device farms including font scaling and safe areas and fixes the layout so content can always scroll.
      good: Uses an emulator with the reported screen size and finds the overflow.
      weak: Hardcodes a smaller layout for those models.
    followups:
      - The phone is common, but only a few users complain. What setting might differ?
      - How would you test layouts across sizes automatically?
    common_errors:
      - Ignoring font size and display zoom settings.

  - external_key: problem_solving.debugging_reasoning.suspect_marketing_script
    topic: Ruling third-party code in or out
    difficulty: medium
    text: >-
      Your checkout page started failing intermittently, and you notice another team recently added a
      marketing script to it. How would you prove or rule out that script as the cause?
    expected_concepts:
      - check whether timing matches the script's addition
      - block the script in the browser and compare
      - look for global variable or prototype conflicts and console errors from it
      - errors grouped by whether the script loaded
      - bring evidence to the other team rather than assumptions
    rubric:
      excellent: Tests the hypothesis directly by blocking the script, checks timing and error data split by script presence and inspects for global conflicts, then shares concrete evidence with the owning team.
      good: Disables the script in testing and checks whether failures stop.
      weak: Removes the script without evidence or blames it in a meeting.
    followups:
      - The failures continue with the script blocked. What next?
      - How would you limit what third-party scripts can do on a sensitive page?
    common_errors:
      - Correlating with timing alone without testing the hypothesis.

  - external_key: problem_solving.debugging_reasoning.chat_messages_missing
    topic: Missing realtime messages
    difficulty: medium
    text: >-
      In a chat feature, users sometimes miss messages that others definitely sent, and a refresh makes them
      appear. How would you track down where they're being dropped?
    expected_concepts:
      - trace a missing message through server, socket and client
      - reconnects losing messages sent in the gap
      - client-side filtering or ordering dropping messages
      - sequence numbers or last-seen IDs to detect gaps
      - simulate disconnects to reproduce
    rubric:
      excellent: Follows a specific missing message through each hop, identifies reconnect gaps or client-side filtering as likely and proposes sequence tracking to detect and backfill gaps.
      good: Suspects reconnects and checks the socket logs for the missing message.
      weak: Adds periodic full refreshes.
    followups:
      - How would the client know it has missed something?
      - How would you reproduce a dropped connection in testing?
    common_errors:
      - Assuming the server never sent it without checking.

  - external_key: problem_solving.debugging_reasoning.deep_link_cold_start
    topic: App launch state differences
    difficulty: medium
    text: >-
      A deep link from an email opens the right screen when the app is already running, but opens the home
      screen when the app was closed. How would you work out why?
    expected_concepts:
      - different code paths for cold start and warm start
      - link data arriving before navigation or login is ready
      - startup flow overwriting the intended destination
      - reproduce by force-closing the app before opening the link
      - log when the link is received versus when navigation is ready
    rubric:
      excellent: Identifies that cold and warm starts deliver the link through different paths, reasons about ordering with startup and authentication and confirms it with logging around when the link arrives.
      good: Reproduces from a closed app and finds the link being lost during startup.
      weak: Adds a delay before navigating.
    followups:
      - The user also needs to log in first. How should the link survive that?
      - How would you test these launch states automatically?
    common_errors:
      - Only testing links while the app is open.

  - external_key: problem_solving.debugging_reasoning.old_avatar_persists
    topic: Updated content not appearing
    difficulty: medium
    text: >-
      A user updates their profile picture, but the old picture keeps showing up for hours in some parts of
      the app. How would you figure out which cache is holding on to it?
    expected_concepts:
      - same URL reused for a changed file
      - HTTP cache headers on the image
      - CDN cache lifetime
      - in-app image caches on mobile or in memory
      - versioned or content-hashed URLs
    rubric:
      excellent: Notes that only some places are stale, so different caches are involved, inspects headers and app-level image caches for each and proposes changing the URL when the content changes.
      good: Checks cache headers and suggests cache busting.
      weak: Lowers caching everywhere.
    followups:
      - Why does reusing the same URL make this hard?
      - What are the costs of turning caching down?
    common_errors:
      - Overlooking image caches built into the client.

  - external_key: problem_solving.debugging_reasoning.e2e_element_not_found
    topic: Flaky end-to-end UI tests
    difficulty: medium
    text: >-
      An end-to-end UI test fails about once in ten runs with an element-not-found error. How would you
      determine whether it's a problem in the test or a real bug in the app?
    expected_concepts:
      - screenshots, videos and traces from failed runs
      - fixed sleeps versus waiting for a real condition
      - loading states, animations or slow API responses
      - check whether a real user could hit the same state
      - rerun in a loop to reproduce
    rubric:
      excellent: Uses failure artifacts to see the actual UI state, separates test timing assumptions from genuine app behaviour and asks whether a real user would encounter that state before fixing the right side.
      good: Looks at screenshots and replaces sleeps with proper waits.
      weak: Adds retries or longer sleeps to the test.
    followups:
      - The screenshot shows a spinner that never finishes. Now what?
      - How do you keep flaky tests from eroding trust in the suite?
    common_errors:
      - Assuming flakiness is always the test's fault.

  - external_key: problem_solving.debugging_reasoning.upgrade_changes_date_format
    topic: Behaviour changes from framework upgrades
    difficulty: medium
    text: >-
      After upgrading your UI framework, a date picker shows dates in the wrong format for some users. How
      would you track down what the upgrade changed?
    expected_concepts:
      - find which users are affected (locale, browser, settings)
      - read changelog and migration notes for locale or formatting changes
      - compare formatting before and after with the same locale
      - defaults that changed in the new version
      - tests that cover several locales
    rubric:
      excellent: Characterises affected users by locale or settings, reproduces before and after with the same inputs and finds the changed default or behaviour in the release notes.
      good: Identifies a locale difference and checks the changelog.
      weak: Hardcodes one date format for everyone.
    followups:
      - How would you cover locale-specific behaviour in tests?
      - What would you check before the next framework upgrade?
    common_errors:
      - Testing only in the team's own locale.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.debugging_reasoning.error_nobody_reproduces
    topic: Production-only frontend errors
    difficulty: hard
    text: >-
      Your error tracker shows a spike in a JavaScript error that nobody on the team can reproduce in any
      browser you have. How would you narrow down which users and conditions trigger it?
    expected_concepts:
      - slice the errors by browser, version, device, extension, page and release
      - breadcrumbs and user actions before the error
      - browser extensions, translators or injected scripts modifying the page
      - add context to error reports for the next occurrence
      - emulate the conditions found
    rubric:
      excellent: Uses error tracking metadata to find the common conditions, considers outside factors like extensions or page translation, adds context to future reports and reproduces by emulating the identified conditions.
      good: Breaks errors down by browser and page and looks at breadcrumbs.
      weak: Ignores it because nobody can reproduce it.
    followups:
      - The stack trace includes code that isn't yours. What does that suggest?
      - How do you decide whether an error like this is worth fixing?
    common_errors:
      - Not checking whether the error comes from code you don't own.

  - external_key: problem_solving.debugging_reasoning.crash_only_after_upgrade
    topic: Upgrade-path crashes
    difficulty: hard
    text: >-
      A mobile app crashes only for users who updated from a previous version, never on a fresh install. How
      would you reason about what's different and reproduce it?
    expected_concepts:
      - persisted state from the old version (database, preferences, cache)
      - migrations that skip or fail on certain old states
      - install the old version, create data, then upgrade
      - test multiple upgrade paths, not just the previous release
      - make migrations defensive and tested
    rubric:
      excellent: Recognises leftover persisted state as the difference, reproduces by installing old builds with realistic data and upgrading, and covers several upgrade paths in testing.
      good: Suspects a data migration and reproduces by upgrading from the old version.
      weak: Asks users to reinstall.
    followups:
      - Users skip several versions at once. How does that change your testing?
      - How would you get the old app build to test the upgrade?
    common_errors:
      - Testing upgrades only from the immediately previous version.

  - external_key: problem_solving.debugging_reasoning.typing_lag_no_hot_function
    topic: Diffuse performance problems
    difficulty: hard
    text: >-
      Typing in a search box lags noticeably on slower laptops, but the profile shows no single function that
      is expensive. How would you find what's making it slow?
    expected_concepts:
      - death by a thousand cuts across many renders
      - too many components re-rendering per keystroke
      - layout thrashing or forced reflows
      - work triggered per keystroke (filtering, network, state updates)
      - CPU throttling to reproduce and render tracking tools
    rubric:
      excellent: Recognises cost spread across many small pieces, measures how much work happens per keystroke (renders, layout, handlers) with throttled CPU and reduces the amount of work rather than optimising one function.
      good: Looks at re-renders and suggests debouncing or memoisation.
      weak: Concludes the laptops are too slow.
    followups:
      - How would you count how many components render on each keystroke?
      - When is debouncing the right fix and when does it hide the problem?
    common_errors:
      - Looking only at the top functions in the profile instead of total work per interaction.

  - external_key: problem_solving.debugging_reasoning.older_clients_break
    topic: Backward compatibility with old clients
    difficulty: hard
    text: >-
      A backend change works with the latest app release, but users on app versions from a few months ago
      start seeing errors. How would you find which client versions are affected and why?
    expected_concepts:
      - group errors by client version from request headers or logs
      - find the oldest and newest affected versions
      - what the old client assumes about responses (fields, enums, status codes)
      - test the change against old builds
      - roll back or add compatibility while the fix lands
    rubric:
      excellent: Segments errors by client version to find the affected range, identifies the assumption old clients make that the change broke, mitigates quickly and proposes compatibility tests against old builds.
      good: Checks which versions fail and compares requests and responses.
      weak: Forces all users to update.
    followups:
      - How would you learn about this before users report it?
      - How long should old app versions be supported?
    common_errors:
      - Lacking version information in logs, which makes segmentation impossible.

  - external_key: problem_solving.debugging_reasoning.stale_search_results
    topic: Out-of-order responses in the UI
    difficulty: hard
    text: >-
      In a search-as-you-type field, users sometimes see results for an earlier query rather than what they
      finally typed. How would you confirm the cause and test the fix?
    expected_concepts:
      - responses arriving in a different order than requests
      - reproduce with artificial latency per request
      - ignore or cancel outdated requests
      - tag responses with the query they belong to
      - deterministic tests that control response order
    rubric:
      excellent: Explains how out-of-order responses overwrite newer results, reproduces with controlled latency and fixes by cancelling or ignoring stale responses, with a test that forces the bad ordering.
      good: Identifies the race and suggests cancelling earlier requests.
      weak: Adds a longer debounce.
    followups:
      - Why doesn't debouncing alone fix it?
      - How would you write a test that reliably produces the bad ordering?
    common_errors:
      - Testing only on fast local networks where responses arrive in order.

  - external_key: problem_solving.debugging_reasoning.many_suites_flaky_at_once
    topic: Shared causes behind flaky tests
    difficulty: hard
    text: >-
      Several unrelated test suites in CI started failing randomly at the same time last week. How would you
      work out what they have in common?
    expected_concepts:
      - correlate the start time with changes to CI images, runners or shared services
      - group failures by runner, host or time of day
      - shared resources (test databases, ports, rate limits, disk space)
      - changes in parallelism or resource limits
      - reproduce on the suspected runner
    rubric:
      excellent: Treats simultaneous onset as a sign of a shared cause, aligns the start time with infrastructure and shared-dependency changes and groups failures by runner or resource to pinpoint it.
      good: Checks recent CI changes and looks for a common error across suites.
      weak: Investigates each suite separately or reruns failures.
    followups:
      - Failures happen only on one runner pool. What next?
      - How would you track flakiness across suites over time?
    common_errors:
      - Treating each suite's failures as unrelated.
