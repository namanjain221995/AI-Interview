# Curated questions: product and business cases (problem-solving rounds), part 2. Spoken case
# prompts: should we build X, sizing an opportunity, designing a metric, a launch going wrong.
# Evaluation is on the reasoning in the answer only: structure, assumptions, trade-offs, decisions.
version: 1
defaults:
  role_tags: [product_manager, business_analyst, ux_designer]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  - external_key: problem_solving.product_business_cases.class_waitlist_feature
    competency_key: product_sense
    topic: Evaluating a small feature for a booking app
    difficulty: easy
    text: >-
      A fitness studio booking app gets frequent requests for a waitlist on fully booked classes. How would you
      work out whether a waitlist is worth building, and how you'd know it was working?
    expected_concepts:
      - how often classes fill up and how many bookings are lost
      - value for both members and studios (filled spots, revenue)
      - effort and edge cases such as late cancellations and notifications
      - success metric such as waitlist conversions into attended classes
      - guardrails such as no-show rate
    rubric:
      excellent: Quantifies how many bookings are lost to full classes, considers value for members and studios, notes key edge cases, and defines a success metric based on spots filled from the waitlist with a guardrail.
      good: Looks at demand data and proposes a reasonable success measure.
      weak: Builds it because users ask, with no measure of value or success.
    followups:
      - How long should someone have to accept an opened spot, and why does it matter?
      - What would make you decide not to build it?
    common_errors:
      - Measuring waitlist sign-ups instead of spots actually filled.

  - external_key: problem_solving.product_business_cases.size_car_repair_booking
    competency_key: problem_solving
    topic: Sizing software for small local businesses
    difficulty: easy
    text: >-
      How would you estimate the yearly revenue potential of booking software sold to independent car repair shops
      in one country? Walk me through your assumptions out loud.
    expected_concepts:
      - estimate the number of independent shops
      - realistic share that would adopt software
      - monthly price and annual revenue per shop
      - churn or adoption ramp over time
      - sanity check with a second angle
    rubric:
      excellent: Builds a clear bottom-up estimate from number of shops through adoption and price, states assumptions explicitly, adjusts for realistic adoption and sanity-checks the total.
      good: Reasonable structured estimate with stated assumptions.
      weak: Guesses a final figure without a chain of reasoning.
    followups:
      - How would you check your estimate of the number of shops?
      - What would change if you charged per booking instead of a monthly fee?
    common_errors:
      - Assuming every shop in the market will buy.

  - external_key: problem_solving.product_business_cases.metric_help_center_redesign
    competency_key: product_sense
    topic: Measuring a redesigned help centre
    difficulty: easy
    text: >-
      Your team just redesigned the help centre for a software product. How would you measure whether the redesign
      actually helped?
    expected_concepts:
      - define success as users solving problems without contacting support
      - contact rate after visiting help articles
      - search success and article helpfulness signals
      - compare before and after with seasonality in mind
      - guardrail such as customer satisfaction for contacts that still happen
    rubric:
      excellent: Defines success as self-service resolution, picks a primary metric such as contacts per help centre visitor, adds supporting search and helpfulness signals, and accounts for seasonality in the comparison.
      good: Chooses sensible self-service metrics and compares before and after.
      weak: Measures page views or time on page, which can rise when help is worse.
    followups:
      - Why could more time on help pages be a bad sign?
      - How would you separate the redesign's effect from a product release in the same month?
    common_errors:
      - Treating higher traffic to the help centre as success.

  - external_key: problem_solving.product_business_cases.app_rating_falls_after_release
    competency_key: product_sense
    topic: App store rating falling after a release
    difficulty: easy
    text: >-
      A week after a mobile release, your app's store rating has fallen from four point six to three point nine.
      How would you find out what went wrong and decide what to do?
    expected_concepts:
      - read recent reviews and group them by theme
      - check crash rates and performance by device and version
      - compare the release changes with the complaints
      - decide on a hotfix, rollback of a feature or messaging
      - respond to reviews and track recovery
    rubric:
      excellent: Groups review themes, correlates them with crash data and specific release changes, decides on a targeted fix or rollback, and plans to respond to reviewers and monitor recovery.
      good: Investigates reviews and technical data and proposes a fix.
      weak: Assumes it is a bug without reading reviews, or only plans to ask happy users for ratings.
    followups:
      - What if the complaints are about a deliberate design change rather than a bug?
      - How would you prioritise if there were three different complaint themes?
    common_errors:
      - Prompting satisfied users for ratings to hide the problem instead of fixing it.

  - external_key: problem_solving.product_business_cases.guest_checkout_vs_accounts
    competency_key: ux_design
    topic: Guest checkout versus required accounts
    difficulty: easy
    text: >-
      Marketing wants every shopper to create an account before buying, but you suspect that will hurt
      conversion. How would you work through this disagreement?
    expected_concepts:
      - understand why marketing wants accounts (repeat purchase, data)
      - estimate conversion loss from forced sign-up
      - options such as guest checkout with account creation after purchase
      - test the options and measure both goals
      - agree on the decision metric with marketing upfront
    rubric:
      excellent: Understands the goal behind marketing's request, proposes options that serve both goals such as post-purchase account creation, and suggests a test with metrics both sides agree on.
      good: Weighs both views and proposes a reasonable compromise or test.
      weak: Argues from personal opinion or simply overrules marketing.
    followups:
      - Which metric would settle the debate for both sides?
      - How would you design the account prompt after purchase?
    common_errors:
      - Ignoring the legitimate value of repeat-customer data.

  - external_key: problem_solving.product_business_cases.meal_kit_referral_program
    competency_key: product_sense
    topic: Deciding on a referral programme
    difficulty: easy
    text: >-
      A meal kit subscription service is thinking about a referral programme that gives credit to both the
      referrer and the new customer. How would you decide if it's a good idea and set it up to succeed?
    expected_concepts:
      - compare referral cost with other acquisition channels
      - retention of referred customers versus others
      - incentive size and structure
      - fraud and abuse risks
      - measure incremental customers, not just referrals
    rubric:
      excellent: Compares the cost per acquired customer with other channels, considers whether referred customers retain, designs incentives with abuse controls, and measures incremental growth.
      good: Considers cost, incentives and how to measure success.
      weak: Assumes referrals are free growth without considering cost or abuse.
    followups:
      - How would you prevent people from referring themselves?
      - How would you estimate how many referrals would have happened anyway?
    common_errors:
      - Counting every referred sign-up as new growth.

  - external_key: problem_solving.product_business_cases.ops_spreadsheet_to_tool
    competency_key: requirements_analysis
    topic: Replacing a spreadsheet with an internal tool
    difficulty: easy
    text: >-
      The operations team schedules hundreds of deliveries a week in a shared spreadsheet, and they've asked for a
      proper internal tool. How would you decide whether to build one and what it should do first?
    expected_concepts:
      - observe the current workflow and its pain points
      - quantify errors, delays and time spent
      - identify the most valuable capabilities to replace first
      - consider off-the-shelf tools or improving the spreadsheet
      - define success and adoption measures
    rubric:
      excellent: Observes the real workflow, quantifies the cost of current problems, compares building with buying or improving the spreadsheet, and scopes a first version around the highest-value pains with success measures.
      good: Understands the pain points and proposes a scoped solution.
      weak: Jumps to building a full tool without understanding the workflow or alternatives.
    followups:
      - What would you not include in the first version?
      - How would you make sure the team actually switches over?
    common_errors:
      - Copying every spreadsheet column into the new tool without questioning it.

  - external_key: problem_solving.product_business_cases.more_push_notifications
    competency_key: product_sense
    topic: Growth pressure to send more notifications
    difficulty: medium
    text: >-
      The growth team wants to double the number of push notifications to lift daily active users. How would you
      evaluate the proposal?
    expected_concepts:
      - short-term lift versus long-term opt-outs and uninstalls
      - relevance and personalisation of notifications
      - test design with holdouts and long enough duration
      - guardrail metrics such as opt-out and uninstall rate
      - whether the extra activity is meaningful engagement
    rubric:
      excellent: Weighs the short-term lift against long-term costs like opt-outs, insists on a test with guardrails and enough duration, and suggests improving relevance rather than volume.
      good: Recognises the risk and proposes a test with guardrails.
      weak: Approves based on expected DAU gain without considering fatigue.
    followups:
      - How long would the test need to run to see the real cost?
      - What would a good notification look like in this product?
    common_errors:
      - Measuring only opens and sessions in the first week.

  - external_key: problem_solving.product_business_cases.homepage_test_fading_lift
    competency_key: statistics_experimentation
    topic: A test whose lift fades over time
    difficulty: medium
    text: >-
      A homepage redesign showed a strong lift in its first week of testing, but the lift has shrunk each week
      since. How would you interpret that and decide whether to ship?
    expected_concepts:
      - novelty effects on returning users
      - compare new versus returning users separately
      - check sample ratio and whether the test setup changed
      - estimate the long-run effect from later weeks
      - decide based on the stable effect and costs
    rubric:
      excellent: Identifies novelty as a likely cause, separates new and returning users, checks the experiment for setup issues, and bases the decision on the stabilised effect.
      good: Recognises novelty effects and looks at the trend before deciding.
      weak: Ships based on the overall average or the first week's result.
    followups:
      - What would you expect to see for brand new visitors if it's a novelty effect?
      - How long would you keep the test running?
    common_errors:
      - Reporting the cumulative average as the expected long-term impact.

  - external_key: problem_solving.product_business_cases.freemium_limit_setting
    competency_key: product_sense
    topic: Setting the limits of a free plan
    difficulty: medium
    text: >-
      You're launching a free plan for an online whiteboard tool. How would you decide where to draw the line
      between what's free and what's paid?
    expected_concepts:
      - free plan must deliver real value to drive adoption
      - limits tied to the moment users get value from collaboration
      - paid features aligned with team or business needs
      - model conversion and cost of free users
      - iterate limits based on upgrade data
    rubric:
      excellent: Designs the free plan to deliver real value while placing limits where users hit them as they grow into teams, models the conversion and cost of free users, and plans to adjust using upgrade data.
      good: Chooses sensible limits with a rationale linked to upgrade triggers.
      weak: Picks limits arbitrarily or makes the free plan too weak to be useful.
    followups:
      - Would you limit boards, collaborators or features, and why?
      - What would you do if almost nobody upgraded?
    common_errors:
      - Forgetting the hosting and support cost of free users.

  - external_key: problem_solving.product_business_cases.annual_plan_discount
    competency_key: product_sense
    topic: Pushing annual plans with a discount
    difficulty: medium
    text: >-
      Finance wants more customers on annual plans and proposes a twenty percent discount for paying yearly. How
      would you assess the idea?
    expected_concepts:
      - revenue given up versus improved retention and cash flow
      - which customers would switch, especially those already loyal
      - effect on churn and lifetime value
      - placement and design of the offer in the purchase flow
      - testing and measuring the net effect
    rubric:
      excellent: Weighs the discount cost against retention and cash flow benefits, recognises that loyal customers may switch anyway, and proposes a test measuring net revenue and churn.
      good: Considers trade-offs between discount and retention and suggests a test.
      weak: Agrees because annual plans reduce churn without counting the discount cost.
    followups:
      - How would you estimate how many switchers would have stayed anyway?
      - What size of discount would you test, and why?
    common_errors:
      - Assuming annual plans cause retention rather than attract already-loyal customers.

  - external_key: problem_solving.product_business_cases.conversion_up_revenue_flat
    competency_key: data_analysis
    topic: Conversion rising while revenue stays flat
    difficulty: medium
    text: >-
      Over the last quarter, trial-to-paid conversion went up noticeably, but total revenue barely moved. How would
      you explain what's going on?
    expected_concepts:
      - fewer trials overall offsetting higher conversion
      - mix shift toward cheaper plans or discounts
      - higher churn among newly converted customers
      - changes in expansion or existing customer churn
      - reconcile the numbers in a revenue bridge
    rubric:
      excellent: Builds a revenue bridge separating volume, conversion, plan mix, discounts and churn, and identifies which components offset the conversion gain.
      good: Proposes several plausible explanations and how to check them.
      weak: Offers a single guess without decomposing revenue.
    followups:
      - How would you lay out the revenue bridge?
      - What would you do if the cause was more discounted plans?
    common_errors:
      - Ignoring changes in the number of trials starting.

  - external_key: problem_solving.product_business_cases.which_integration_first
    competency_key: product_sense
    topic: Choosing which integration to build first
    difficulty: medium
    text: >-
      Customers want your product to integrate with a CRM, an accounting package and a team messaging tool, and you
      can build only one this half. How would you choose?
    expected_concepts:
      - evidence of demand by segment and revenue
      - which integration unblocks deals or reduces churn
      - effort, partner APIs and maintenance cost
      - strategic fit with where the product is heading
      - a way to validate demand before committing
    rubric:
      excellent: Uses evidence on deals, churn and usage by segment, weighs value against effort and ongoing maintenance, considers strategic direction and validates demand before committing.
      good: Compares the options on value and effort and makes a reasoned pick.
      weak: Picks the most requested or the easiest option without considering value.
    followups:
      - How would you test demand before building anything?
      - Would a third-party integration platform change your answer?
    common_errors:
      - Counting requests without weighting them by revenue or deal impact.

  - external_key: problem_solving.product_business_cases.partner_launch_critical_bug
    competency_key: stakeholder_management
    topic: A critical bug before a joint launch
    difficulty: medium
    text: >-
      A week before a joint launch with a major partner, your team finds a bug that corrupts some records under
      rare conditions. The partner has already announced the date. What would you do?
    expected_concepts:
      - assess severity, likelihood and fix time
      - options such as delay, partial launch or launch with a workaround
      - inform the partner early with a clear recommendation
      - agree on customer communication and contingency
      - protect customer data above the launch date
    rubric:
      excellent: Assesses impact and fix time, lays out options with risks, prioritises data integrity, and communicates early and openly with the partner along with a joint plan.
      good: Evaluates options and communicates with the partner.
      weak: Launches and hopes the rare condition doesn't happen, or delays without consulting the partner.
    followups:
      - How would you present the options to the partner?
      - What would make a partial launch acceptable?
    common_errors:
      - Hiding the bug from the partner to protect the relationship.

  - external_key: problem_solving.product_business_cases.redesign_angers_power_users
    competency_key: ux_design
    topic: A simplification that frustrates expert users
    difficulty: medium
    text: >-
      Your redesign simplifies the main screen and tests well with new users, but power users in the beta say it
      slows them down badly. How would you resolve this?
    expected_concepts:
      - quantify each group's size and value
      - measure task time and errors for power users
      - design options such as shortcuts or progressive disclosure
      - avoid optimising only for first impressions
      - staged rollout with feedback loops
    rubric:
      excellent: Quantifies the value of each group, measures the real performance cost for experts, proposes design solutions that serve both such as progressive disclosure or shortcuts, and plans a staged rollout.
      good: Takes both groups seriously and proposes a design compromise.
      weak: Dismisses power users as resistant to change or abandons the redesign.
    followups:
      - How would you measure whether experts are actually slower?
      - What would you do if the two groups' needs truly conflicted?
    common_errors:
      - Treating beta complaints as simple resistance to change.

  - external_key: problem_solving.product_business_cases.small_accounts_early_churn
    competency_key: product_sense
    topic: Early churn in small accounts
    difficulty: medium
    text: >-
      Most of your churn comes from small accounts that cancel within their first ninety days. How would you
      decide whether to fix that and what you'd try?
    expected_concepts:
      - economics of small accounts and whether retaining them pays
      - understand why they leave (exit surveys, usage before churn)
      - check fit between acquisition targeting and product
      - interventions such as onboarding, templates or a lighter plan
      - measure early retention and payback
    rubric:
      excellent: Checks whether retaining small accounts is economically worth it, diagnoses churn reasons from data and research, considers acquisition fit as well as product fixes, and proposes measurable interventions.
      good: Investigates churn reasons and proposes targeted fixes.
      weak: Proposes discounts or generic onboarding without diagnosing the cause.
    followups:
      - What if the accounts that churn were never a good fit for the product?
      - Which early behaviour would you look for to predict churn?
    common_errors:
      - Assuming all churn is worth preventing.

  - external_key: problem_solving.product_business_cases.ecommerce_returns_cost
    competency_key: process_modeling
    topic: Business case for reducing returns cost
    difficulty: medium
    text: >-
      An online clothing retailer's returns are costing more every quarter. How would you analyse where the cost
      comes from and build a case for what to change?
    expected_concepts:
      - map the returns process end to end
      - break down cost by reason, product and step
      - separate preventable returns from processing cost
      - options such as better size guidance or cheaper handling
      - estimate savings and impact on sales
    rubric:
      excellent: Maps the returns process, breaks down cost by reason and step, distinguishes preventing returns from processing them more cheaply, and estimates savings against effects on sales.
      good: Analyses return reasons and cost and proposes improvements with estimated impact.
      weak: Proposes stricter return policies without analysing causes or sales impact.
    followups:
      - How would a stricter return policy affect sales?
      - Which data would you need from the warehouse team?
    common_errors:
      - Cutting returns in a way that also cuts purchases.

  - external_key: problem_solving.product_business_cases.marketplace_take_rate_increase
    competency_key: product_sense
    topic: Raising a marketplace commission
    difficulty: hard
    text: >-
      Your marketplace takes a ten percent commission and leadership wants to raise it to fifteen. How would you
      analyse the impact and decide?
    expected_concepts:
      - seller economics and alternatives available to sellers
      - risk of sellers leaving or raising prices
      - effects on buyers through prices and selection
      - disintermediation risk of off-platform deals
      - phased or segmented rollout and value added in return
    rubric:
      excellent: Models seller margins and alternatives, predicts second-order effects on prices, supply and off-platform leakage, considers adding value alongside the increase, and proposes a segmented test with clear decision criteria.
      good: Considers seller and buyer reactions and proposes a measured approach.
      weak: Calculates fifty percent more revenue without considering how participants respond.
    followups:
      - How would you detect sellers moving transactions off the platform?
      - What value would you add to justify the change?
    common_errors:
      - Assuming transaction volume stays constant after the increase.

  - external_key: problem_solving.product_business_cases.open_public_api
    competency_key: product_sense
    topic: Opening a public API to third parties
    difficulty: hard
    text: >-
      Several partners want to build on top of your product, and leadership is asking whether to open a public API.
      How would you evaluate the strategic case?
    expected_concepts:
      - strategic value such as ecosystem lock-in and new use cases
      - risks such as partners competing or data exposure
      - cost of support, documentation and stability commitments
      - monetisation and access tiers
      - start with a limited partner programme
    rubric:
      excellent: Articulates the ecosystem value and the competitive risks, accounts for long-term support and compatibility costs, considers monetisation, and proposes a staged partner programme with success criteria.
      good: Weighs benefits, risks and costs and proposes a starting approach.
      weak: Treats the API as a technical project or says yes because partners asked.
    followups:
      - How would you stop a partner from rebuilding your core product on your API?
      - What would you need to commit to on stability?
    common_errors:
      - Underestimating the cost of supporting a public API long term.

  - external_key: problem_solving.product_business_cases.choose_next_launch_city
    competency_key: problem_solving
    topic: Choosing which city to expand into
    difficulty: hard
    text: >-
      A food delivery company has succeeded in two cities and must choose one of three candidate cities to launch
      next. How would you structure that decision?
    expected_concepts:
      - criteria such as demand density, restaurant supply and competition
      - unit economics such as order value and delivery cost
      - operational complexity and regulations
      - learnings from existing cities that transfer
      - weighting the criteria and a sensitivity check
    rubric:
      excellent: Defines decision criteria tied to unit economics and market structure, gathers proxies for each city, weights them transparently, checks sensitivity and makes a recommendation with key risks.
      good: Compares cities on sensible criteria and makes a reasoned choice.
      weak: Picks the biggest city without considering competition or economics.
    followups:
      - What proxy would you use for restaurant supply before launching?
      - How would you decide if the launch was working after three months?
    common_errors:
      - Ranking by population alone.

  - external_key: problem_solving.product_business_cases.marketplace_pricing_no_ab
    competency_key: statistics_experimentation
    topic: Evaluating a change when user-level tests fail
    difficulty: hard
    text: >-
      You want to test a new delivery fee structure in a two-sided marketplace, but a user-level A/B test would let
      the two groups affect each other through shared couriers. How would you evaluate the change?
    expected_concepts:
      - interference between test groups in shared supply
      - region or time-based switchback designs
      - fewer units means less statistical power
      - pre-period comparisons and synthetic controls
      - metrics on both sides of the marketplace
    rubric:
      excellent: Explains why interference biases a user-level test, proposes geography or switchback designs, discusses the loss of power and how to compensate, and measures outcomes for both sides.
      good: Recognises interference and proposes a region or time-based test.
      weak: Runs a normal A/B test or launches without measurement.
    followups:
      - How would you choose comparable regions?
      - What are the risks of a switchback design?
    common_errors:
      - Ignoring that treatment users take couriers from control users.

  - external_key: problem_solving.product_business_cases.launch_shared_workspace_exposure
    competency_key: product_sense
    topic: A launch that exposed data to the wrong users
    difficulty: hard
    text: >-
      A new sharing feature you launched let some users see documents from other workspaces for a few hours before
      it was caught. Beyond the engineering fix, how would you handle it as the product owner?
    expected_concepts:
      - disable the feature and confirm scope of exposure
      - work with security and legal on notification obligations
      - clear communication to affected customers
      - root cause including gaps in review and testing
      - criteria and safeguards before relaunching
    rubric:
      excellent: Contains the issue, establishes exact scope, involves security and legal on obligations, communicates clearly with affected customers, and sets process changes and relaunch criteria.
      good: Contains, communicates and plans a fix with relaunch criteria.
      weak: Treats it purely as a bug to fix and moves on without customer communication.
    followups:
      - What would you tell affected customers?
      - What would need to be true before you relaunch?
    common_errors:
      - Delaying communication until every detail is known.

  - external_key: problem_solving.product_business_cases.retention_bet_vs_new_segment
    competency_key: product_sense
    topic: Choosing between two strategic bets
    difficulty: hard
    text: >-
      You have one team for the next six months. One option is to improve retention for current customers; the
      other is to build features to win a new segment. How would you decide?
    expected_concepts:
      - estimate the size and confidence of each opportunity
      - time to impact and compounding effect of retention
      - strategic importance and competitive timing
      - risks and what would be learned from each
      - a way to de-risk the chosen bet early
    rubric:
      excellent: Quantifies both bets with explicit confidence, considers compounding retention gains versus strategic timing, compares risk and learning value, and recommends with milestones that would trigger a change.
      good: Compares both options on value and risk and makes a reasoned choice.
      weak: Chooses based on preference or tries to do both with one team.
    followups:
      - What early signal would tell you the bet isn't working?
      - How would you explain the decision to the team that loses out?
    common_errors:
      - Ignoring how retention improvements compound over time.

  - external_key: problem_solving.product_business_cases.profitable_upsell_hurts_retention
    competency_key: product_sense
    topic: A revenue feature that harms retention
    difficulty: hard
    text: >-
      An aggressive upgrade pop-up brings in meaningful revenue, but your analysis suggests users who see it often
      are more likely to churn later. How would you decide what to do?
    expected_concepts:
      - establish whether the pop-up causes churn or just correlates
      - holdout test to measure long-term net revenue
      - compare upgrade revenue with lost lifetime value
      - redesign options such as better timing and targeting
      - align leadership on long-term metrics
    rubric:
      excellent: Tests causality with a holdout, compares short-term upgrade revenue with lifetime value lost, explores better-targeted alternatives, and gets agreement on a long-term metric for the decision.
      good: Recognises the trade-off and proposes a test before deciding.
      weak: Keeps it for revenue or removes it on the correlation alone.
    followups:
      - How long would the holdout need to run?
      - What would a better-timed upgrade prompt look like?
    common_errors:
      - Treating correlation with churn as proof of harm.

  - external_key: problem_solving.product_business_cases.invite_only_vs_open_launch
    competency_key: product_sense
    topic: Invite-only versus open launch
    difficulty: medium
    text: >-
      You're about to launch a new collaboration product. Marketing wants an invite-only waitlist to build buzz,
      while sales wants it open to everyone on day one. How would you decide between the two?
    expected_concepts:
      - goals of the launch such as learning, quality control or fast growth
      - readiness of the product and infrastructure for open traffic
      - how invites can seed teams and network effects
      - risk of losing momentum or frustrating waiting users
      - metrics and criteria for widening access
    rubric:
      excellent: Ties the choice to explicit launch goals and product readiness, explains how invites could seed teams or protect quality, weighs the cost of making people wait, and sets criteria for opening up.
      good: Compares both options against launch goals and picks one with a reason.
      weak: Picks the approach that sounds more exciting without linking it to goals or readiness.
    followups:
      - What would make you open the doors earlier than planned?
      - How would you choose who gets invited first?
    common_errors:
      - Treating exclusivity as valuable in itself without a goal behind it.
