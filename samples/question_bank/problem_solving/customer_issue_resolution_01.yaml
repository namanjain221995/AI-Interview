# Curated questions: problem solving — resolving complex customer-reported technical issues with
# incomplete information (part 1 of 4): eliciting missing facts, scoping impact, reproduction with
# partial evidence, reconciling contradictory reports and correcting course.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [support_engineer, qa, fullstack]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.customer_issue_resolution.screenshot_only_report
    competency_key: technical_support
    topic: Working from a single screenshot
    difficulty: easy
    text: >-
      A customer sends you one screenshot of an error dialog with the message "please fix this" and nothing
      else. What can you learn from the screenshot itself, and what would you ask them for next?
    expected_concepts:
      - read the exact error text, codes and request or correlation ids in the image
      - infer context from the screenshot such as page, browser, product version and timestamp
      - search known issues and logs using what the image reveals
      - ask a small set of targeted questions instead of a long generic form
      - confirm impact and urgency for the customer
    rubric:
      excellent: Extracts every useful clue from the image, uses it to check logs or known issues before replying, and asks a few precise questions that close the biggest gaps in one round trip.
      good: Notes the error text and asks sensible follow-up questions about steps and environment.
      weak: Replies with a generic request for more information without using anything visible in the screenshot.
    followups:
      - Which detail in a screenshot has most often saved you time in the past?
      - How would you phrase the reply so the customer answers everything in one message?
    common_errors:
      - Ignoring visible ids or timestamps that would let them find the request in logs.

  - external_key: problem_solving.customer_issue_resolution.plain_language_questions
    competency_key: customer_communication
    topic: Asking non-technical customers the right questions
    difficulty: easy
    text: >-
      A customer who isn't technical writes in saying "nothing saves anymore". How would you phrase your
      questions so they can give you accurate answers without needing to know any technical terms?
    expected_concepts:
      - ask about what they see and do rather than about technical causes
      - one question at a time with concrete choices or examples
      - ask them to describe the last time it worked
      - offer an easy way to show the problem such as a screenshot or short recording
      - confirm understanding by restating the problem back
    rubric:
      excellent: Gives example questions grounded in observable behaviour, avoids jargon, structures them so answers narrow the cause, and closes by restating the problem for confirmation.
      good: Uses plain language and asks about steps and what they see.
      weak: Asks for technical details like logs or browser versions without explaining how to find them.
    followups:
      - Give me the exact first message you'd send them.
      - How would you tell whether their answers are reliable enough to act on?
    common_errors:
      - Asking leading questions that put a cause in the customer's mind.

  - external_key: problem_solving.customer_issue_resolution.compare_two_accounts
    competency_key: problem_solving
    topic: Using a working case to explain a failing case
    difficulty: easy
    text: >-
      A customer tells you a report shows the right numbers for their colleague but wrong numbers for them,
      even though they both use the same filters. How would you use the difference between the two of them
      to find the cause?
    expected_concepts:
      - list every difference between the two cases such as role, permissions, locale, time zone and saved settings
      - verify the filters really are identical rather than trusting the description
      - change one difference at a time to see which one flips the result
      - check data visibility rules that depend on the user
      - confirm the finding with a third user
    rubric:
      excellent: Treats the working colleague as a control, systematically enumerates and tests the differences between the two users, and verifies the cause before reporting it.
      good: Compares the two users' settings and permissions and narrows to a likely cause.
      weak: Investigates the failing user alone without using the working case.
    followups:
      - Which difference would you test first, and why?
      - What if you find no difference at all between their settings?
    common_errors:
      - Assuming "same filters" means identical without checking saved state or defaults.

  - external_key: problem_solving.customer_issue_resolution.error_reference_id
    competency_key: debugging
    topic: Starting from an error reference id
    difficulty: easy
    text: >-
      The only detail a customer gives you is an error reference number they copied from the screen. Walk me
      through how you'd use that one number to start the investigation.
    expected_concepts:
      - look up the id in logs or error tracking to find the matching request
      - recover the user, tenant, endpoint, time and stack trace from that record
      - check surrounding requests from the same session for context
      - see whether the same error has occurred for other users
      - go back to the customer with specific findings and questions
    rubric:
      excellent: Uses the id to locate the exact request, pulls context from surrounding events, checks how widespread the error is and returns to the customer with targeted findings.
      good: Searches logs for the id and reads the error details.
      weak: Does not know how the id connects to logs and asks the customer to describe the problem again.
    followups:
      - What would you do if the id isn't found anywhere in the logs?
      - How would you check whether other customers hit the same error?
    common_errors:
      - Searching only one service's logs when the request crossed several.

  - external_key: problem_solving.customer_issue_resolution.scope_of_impact
    competency_key: technical_support
    topic: Working out how many users are affected
    difficulty: easy
    text: >-
      A customer reports a problem but only knows about their own experience. How do you work out how many
      users or customers are actually affected, and why does that matter for what you do next?
    expected_concepts:
      - search for matching errors across users, tenants and regions in logs or monitoring
      - check for similar recent tickets
      - ask the customer whether colleagues see the same thing
      - impact changes priority, escalation path and communication
      - distinguish a single-user problem from an incident
    rubric:
      excellent: Uses several independent sources to size the impact, explains how one user versus many changes priority and escalation, and knows when to declare an incident.
      good: Checks other tickets and logs to see whether others are affected.
      weak: Treats every report as a single-user problem without checking scope.
    followups:
      - At what point would you raise this as a wider incident?
      - What if logs show errors for many users but only one has complained?
    common_errors:
      - Waiting for more tickets to arrive instead of actively checking for impact.

  - external_key: problem_solving.customer_issue_resolution.nothing_changed_claim
    competency_key: problem_solving
    topic: Finding what changed when nobody changed anything
    difficulty: easy
    text: >-
      A customer insists they changed nothing, yet something that worked last week is now failing. How would
      you go about finding out what actually changed, on their side and on ours?
    expected_concepts:
      - pin down when it last worked and when it first failed
      - review our releases, configuration changes and feature flags in that window
      - check their audit logs, admin settings, integrations and data volume
      - consider indirect changes such as browser updates, certificates, third-party services or expiring credentials
      - narrow the window and correlate changes with the first failure
    rubric:
      excellent: Establishes a precise time window, checks changes on both sides including indirect ones like expiring credentials or third-party updates, and correlates them with the first failure.
      good: Checks our releases and asks the customer about recent changes.
      weak: Accepts that nothing changed and investigates without a timeline.
    followups:
      - Which kinds of change do customers most often not realise they made?
      - How would you find changes that happen automatically, like a token expiring?
    common_errors:
      - Arguing with the customer about whether they changed something instead of looking for evidence.

  - external_key: problem_solving.customer_issue_resolution.steps_dont_match_product
    competency_key: technical_support
    topic: When the reported steps don't match the product
    difficulty: easy
    text: >-
      A customer describes the steps that cause their problem, but the steps mention a button and a screen
      that don't exist in our product as you know it. How do you proceed?
    expected_concepts:
      - consider a different version, edition, plan or feature flag
      - consider a customisation, plugin or third-party integration
      - consider confusion with another product they use
      - ask for a screenshot or short recording of the screens
      - avoid telling the customer they are wrong before checking
    rubric:
      excellent: Lists the likely explanations such as different version, edition, flag or third-party add-on, checks the account to test them, and asks for visual evidence without dismissing the report.
      good: Asks for screenshots and checks the account's version or plan.
      weak: Tells the customer the feature doesn't exist and closes the ticket.
    followups:
      - How would you check which features and flags are enabled for their account?
      - What if it turns out to be a different product altogether?
    common_errors:
      - Assuming the customer is mistaken before ruling out versions and add-ons.

  - external_key: problem_solving.customer_issue_resolution.report_to_regression_test
    competency_key: testing
    topic: Turning a customer report into a regression test
    difficulty: easy
    text: >-
      Support has confirmed a bug a customer reported. How would you turn that customer's report into a
      reproducible test case that stays in the regression suite?
    expected_concepts:
      - reduce the report to minimal preconditions, data and steps
      - replace customer data with representative synthetic data
      - choose the right test level such as unit, API or end to end
      - assert on the specific behaviour that was wrong
      - confirm the test fails before the fix and passes after it
      - link the test to the ticket for traceability
    rubric:
      excellent: Minimises the scenario, uses safe synthetic data, picks the cheapest test level that catches it, and proves the test fails without the fix.
      good: Writes a test that reproduces the customer's steps and checks the corrected behaviour.
      weak: Copies the customer's steps into a long end-to-end script without checking that it fails on the buggy build.
    followups:
      - When would you write it as an API test rather than a UI test?
      - How would you keep customer data out of the test fixtures?
    common_errors:
      - Never confirming that the new test actually fails on the buggy version.

  # ------------------------------------------------------------------ medium
  - external_key: problem_solving.customer_issue_resolution.contradictory_admins
    competency_key: problem_solving
    topic: Reconciling contradictory reports from one customer
    difficulty: medium
    text: >-
      Two administrators from the same customer give you contradictory accounts of the same problem. One says
      it started Monday and affects everyone, the other says it started weeks ago and only affects their team.
      How would you work out what's really going on?
    expected_concepts:
      - treat both accounts as data and look for evidence that can confirm either
      - check logs and error rates over time and by team or group
      - consider that there may be two separate problems
      - ask each for specific affected users and examples
      - share a single agreed problem statement with the customer
    rubric:
      excellent: Uses objective evidence to test each account, considers that both may be partly right or describe two issues, and aligns the customer on one written problem statement.
      good: Gathers concrete examples from both and checks logs to decide which is accurate.
      weak: Picks the more senior person's version without checking evidence.
    followups:
      - How would you tell whether you're dealing with one problem or two?
      - How would you handle it if the evidence contradicts both of them?
    common_errors:
      - Merging two different problems into one investigation.

  - external_key: problem_solving.customer_issue_resolution.report_date_boundary
    competency_key: debugging
    topic: Records falling on the wrong day in reports
    difficulty: medium
    text: >-
      A customer in Australia says their daily activity report sometimes leaves out records created late in
      the evening and counts them on the next day instead. Users elsewhere haven't reported it. How would you
      investigate?
    expected_concepts:
      - suspect time zone handling between storage, query and display
      - check how timestamps are stored and which time zone the report uses for day boundaries
      - compare user, account and server time zone settings
      - reproduce with records created near midnight in their zone
      - check whether the offset changes with daylight saving
    rubric:
      excellent: Quickly suspects time zone boundaries, explains where conversion can go wrong between storage, query and display, and confirms with a targeted reproduction near midnight.
      good: Identifies time zones as the likely cause and checks the settings involved.
      weak: Treats it as missing data and looks for failed writes.
    followups:
      - Where should the conversion to the user's time zone happen, and why?
      - How would you fix reports that were already sent with the wrong totals?
    common_errors:
      - Fixing the display without checking the query that defines the day boundary.

  - external_key: problem_solving.customer_issue_resolution.few_records_wont_save
    competency_key: debugging
    topic: Data-dependent failures on a few records
    difficulty: medium
    text: >-
      A customer says a handful of their contacts can't be edited and the app only shows a generic error,
      while thousands of other contacts work fine. They can't see any pattern. How would you find what those
      records have in common?
    expected_concepts:
      - collect the ids of failing and working records
      - find the server-side error and stack trace for a failing save
      - compare field values such as length, special characters, encoding, nulls or links to deleted records
      - test by copying a failing record and changing one field at a time
      - check validation rules or migrations that might reject legacy data
    rubric:
      excellent: Starts from the server-side error, compares failing and working records field by field, and isolates the triggering value with controlled edits on a copy.
      good: Looks at logs and compares the failing records for unusual data.
      weak: Asks the customer to recreate the records without understanding the cause.
    followups:
      - Which kinds of data have you seen cause this sort of failure?
      - How would you find every other record across all customers with the same problem?
    common_errors:
      - Experimenting on the customer's real records instead of a copy.

  - external_key: problem_solving.customer_issue_resolution.logs_rotated_away
    competency_key: technical_support
    topic: Reconstructing events when logs are gone
    difficulty: medium
    text: >-
      A customer's self-hosted installation failed overnight, but by the time they contact you the logs from
      before the failure have rotated away and only the hours afterwards remain. How would you reconstruct what
      happened?
    expected_concepts:
      - use other sources such as database timestamps, audit trails, metrics, system journals and backups
      - look for traces of the failure in the remaining logs such as recovery messages
      - check their monitoring, load balancer or infrastructure logs
      - build a timeline from whatever evidence survives
      - set up retention or extra logging so the next occurrence is captured
    rubric:
      excellent: Draws on several independent evidence sources to rebuild a timeline, states clearly what is confirmed versus inferred, and arranges capture for a recurrence.
      good: Uses the remaining logs and some other sources and sets up better logging.
      weak: Says nothing can be done without the logs and waits for it to happen again.
    followups:
      - What would you ask them to change so you capture it next time without filling their disk?
      - How would you explain to the customer how confident you are in the reconstruction?
    common_errors:
      - Presenting an inferred cause as confirmed.

  - external_key: problem_solving.customer_issue_resolution.customer_workaround_side_effects
    competency_key: problem_solving
    topic: Untangling a customer's own workaround
    difficulty: medium
    text: >-
      Before contacting support, a customer wrote their own script that edits records directly to work around a
      bug, and now a different problem has appeared. How would you separate the original issue from the side
      effects of their workaround?
    expected_concepts:
      - get the script, when it ran and which records it touched
      - establish a timeline of the original issue versus the new symptoms
      - compare affected records with untouched ones
      - stop further runs of the script while investigating
      - plan data repair for records the script changed
      - still address the original bug
    rubric:
      excellent: Pauses the workaround, maps exactly what it changed, uses timelines and untouched records to separate the two problems, and plans both data repair and the original fix.
      good: Reviews the script and checks which records it changed.
      weak: Blames the customer's script and stops investigating the original bug.
    followups:
      - How would you discuss the script with the customer without discouraging them from contacting you early next time?
      - Who would you involve to repair the data?
    common_errors:
      - Fixing only the side effects and forgetting the bug that prompted the workaround.

  - external_key: problem_solving.customer_issue_resolution.success_message_no_data
    competency_key: debugging
    topic: Isolating front end, API or downstream processing
    difficulty: medium
    text: >-
      A customer submits a form, sees a success message, but the data never shows up anywhere afterwards. How
      would you work out whether the fault is in the browser, the API or something that processes the data
      later?
    expected_concepts:
      - inspect the network request and response for that submission
      - check whether the API logged the request and what it returned
      - check whether the record was written to storage
      - check queues, background jobs or event consumers that process it later
      - check whether the success message is shown before the server confirms
      - follow one submission end to end with a correlation id
    rubric:
      excellent: Follows a single submission through each layer with concrete checks at each hop, and notes that the UI may report success optimistically.
      good: Checks the browser request and API logs and then storage.
      weak: Guesses at one layer without a way to confirm where the data stopped.
    followups:
      - What would you look for in the browser to know whether the request was even sent?
      - How would you check a background queue for that one item?
    common_errors:
      - Trusting the success message as proof that the server accepted the data.

  - external_key: problem_solving.customer_issue_resolution.unknown_installed_version
    competency_key: technical_support
    topic: Establishing a self-hosted customer's real environment
    difficulty: medium
    text: >-
      A self-hosted customer reports a problem but isn't sure which version they're running, and you suspect
      different components may be on different versions. How would you establish exactly what they have?
    expected_concepts:
      - ask for output of version commands, an about screen or a diagnostics bundle
      - check versions of every component, including agents, plugins, database schema and clients
      - compare against the supported compatibility matrix
      - look for signs in logs such as startup banners or migration records
      - record the confirmed environment on the ticket
    rubric:
      excellent: Gets authoritative version information for every component, checks it against compatibility, and records it on the ticket before further diagnosis.
      good: Asks for version output and checks the main component.
      weak: Relies on the customer's memory of what they installed.
    followups:
      - What would you do if two components turn out to be on incompatible versions?
      - How would you make this easier for the next customer?
    common_errors:
      - Checking only the server and ignoring clients, agents or the database schema.

  - external_key: problem_solving.customer_issue_resolution.limited_round_trips
    competency_key: problem_solving
    topic: Planning diagnostics with few customer round trips
    difficulty: medium
    text: >-
      You can only get one round of answers from a customer per day because of time zones. How would you plan
      what to ask for, so that each round trip rules out as many possible causes as it can?
    expected_concepts:
      - list the plausible hypotheses and what evidence would separate them
      - batch requests so one reply tests several hypotheses
      - include conditional instructions for the customer depending on what they see
      - prefer cheap, low-risk checks for the customer
      - do internal work in parallel while waiting
    rubric:
      excellent: Frames the request around distinguishing hypotheses, batches checks with clear conditional instructions, and uses the waiting time for internal investigation.
      good: Sends a well-organised batch of questions and checks.
      weak: Asks one question at a time or a long generic checklist.
    followups:
      - Show me how you'd write an instruction that branches depending on what they see.
      - How do you keep the request short enough that they actually do all of it?
    common_errors:
      - Sending a long checklist that isn't tied to any hypothesis.

  - external_key: problem_solving.customer_issue_resolution.update_without_cause
    competency_key: customer_communication
    topic: Updating a customer when the cause is still unknown
    difficulty: medium
    text: >-
      You're two days into an investigation and still don't know the cause. What do you tell the customer in
      your update, and how do you avoid promising more than you can deliver?
    expected_concepts:
      - summarise what has been ruled out and what is being checked now
      - give a workaround or mitigation if there is one
      - give a time for the next update rather than a fix date
      - state what you need from the customer
      - avoid speculating on causes that aren't confirmed
    rubric:
      excellent: Gives a concrete example update that shows progress, current hypotheses without speculation, any mitigation, needed actions and a firm next-update time.
      good: Gives an accurate status with next steps and a next-update time.
      weak: Sends a vague "still looking into it" message or commits to a fix date with no basis.
    followups:
      - How would the update change if the customer is losing revenue while this continues?
      - When would you involve a manager or account owner?
    common_errors:
      - Promising a resolution date before the cause is known.

  - external_key: problem_solving.customer_issue_resolution.weekly_export_skipped
    competency_key: debugging
    topic: A scheduled job that skipped one run
    difficulty: medium
    text: >-
      A customer's weekly scheduled export ran every week for months but didn't run last Monday, and it ran
      fine again the following week. How would you investigate a single missed run like that?
    expected_concepts:
      - check scheduler logs and job history for that run
      - check for deployments, restarts or outages around the scheduled time
      - consider time zone or daylight saving changes around that date
      - check for overlapping runs, locks or capacity limits
      - check whether other customers' jobs were skipped too
      - add alerting for missed runs
    rubric:
      excellent: Examines scheduler history and platform events at that exact time, considers clock changes and overlapping runs, checks for wider impact and proposes detection for missed runs.
      good: Checks job logs and deployments around the time.
      weak: Re-runs the export and closes the ticket without explaining the skip.
    followups:
      - How would you know whether other customers were affected?
      - What would you change so a missed run is detected before the customer notices?
    common_errors:
      - Treating a one-off as unimportant without checking for a pattern.

  - external_key: problem_solving.customer_issue_resolution.client_side_interference
    competency_key: technical_support
    topic: Something on the user's machine interfering
    difficulty: medium
    text: >-
      One user at a customer can't use a feature in their browser while everyone else can, and the customer's
      IT team says the user's setup is standard. How would you investigate whether something on that user's
      machine is interfering?
    expected_concepts:
      - try a private window or clean browser profile to rule out extensions and cached data
      - try another browser or machine with the same account
      - check the browser console and network tab for blocked or modified requests
      - consider security software, proxies or managed browser policies
      - confirm whether the account or the machine follows the problem
    rubric:
      excellent: Uses quick experiments to split account versus machine, then narrows to extensions, cached data, policies or security software with evidence from the browser tools.
      good: Suggests a private window and another browser and checks the console.
      weak: Asks the user to clear cache and gives up if that fails.
    followups:
      - What would you do if the problem follows the account to another machine?
      - How would you approach the IT team if you find a managed policy is the cause?
    common_errors:
      - Not checking whether the problem follows the user or the device.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.customer_issue_resolution.sent_but_never_received
    competency_key: problem_solving
    topic: Customer logs and our logs disagree
    difficulty: hard
    text: >-
      A customer's logs show their system sending requests to our API, but our logs show none of those
      requests ever arriving. How would you resolve that contradiction?
    expected_concepts:
      - confirm both sides are looking at the same time window, endpoint and host name
      - check the path between them including DNS, proxies, firewalls, load balancers and CDNs
      - check whether requests are rejected before reaching our application logs
      - compare a single request using exact timestamps and ids
      - capture traffic at intermediate points
      - question whether their log line means the request was actually sent
    rubric:
      excellent: Treats both logs as partial evidence, systematically checks every hop between them, considers layers that reject traffic before our application logs, and designs a test that pins down where requests disappear.
      good: Checks DNS, network path and edge logs to find where requests are lost.
      weak: Concludes the customer's logs must be wrong without investigating the path.
    followups:
      - Which of our layers can drop a request without our application ever logging it?
      - How would you prove the requests left their network?
    common_errors:
      - Assuming "logged as sent" means the request actually left the customer's system.

  - external_key: problem_solving.customer_issue_resolution.no_data_can_be_shared
    competency_key: technical_support
    topic: Reproducing a data-dependent bug without customer data
    difficulty: hard
    text: >-
      A customer in a regulated industry hits a bug that clearly depends on their data, but their policies
      forbid sharing any records, exports or logs with you. How would you reproduce and resolve it?
    expected_concepts:
      - ask for data shapes rather than values such as sizes, field types, counts and character sets
      - provide scripts or queries they can run themselves that output only anonymised statistics
      - build synthetic data matching those characteristics
      - guide a live session where they run diagnostics while you observe
      - offer a diagnostic build with extra non-sensitive logging
      - respect the policy rather than pushing for exceptions
    rubric:
      excellent: Designs a privacy-respecting investigation using shape-only diagnostics, synthetic data and customer-run checks, and validates the reproduction against characteristics they can share.
      good: Builds synthetic data from their description and uses guided sessions.
      weak: Insists on getting the data or says it can't be fixed without it.
    followups:
      - What would a diagnostic script you send them need to guarantee?
      - How would you know your synthetic reproduction matches their real problem?
    common_errors:
      - Pressuring the customer to bypass their data policies.

  - external_key: problem_solving.customer_issue_resolution.recommended_fix_failed
    competency_key: problem_solving
    topic: Recovering after a wrong diagnosis
    difficulty: hard
    text: >-
      You told a customer the cause of their problem and recommended a configuration change. They made it, and
      the problem is still happening. How do you reset your investigation, and how do you handle it with the
      customer?
    expected_concepts:
      - confirm the change was applied as intended and took effect
      - revisit the evidence and identify which assumption was wrong
      - consider reverting the change if it brought no benefit or added risk
      - widen the hypotheses rather than double down
      - acknowledge the miss to the customer with a clear new plan
      - record what misled the diagnosis
    rubric:
      excellent: Verifies the change, re-examines evidence to find the faulty assumption, decides whether to roll back, widens the hypotheses, and gives the customer a straightforward acknowledgement and a new plan.
      good: Checks the change was applied and starts a fresh investigation, keeping the customer informed.
      weak: Insists the diagnosis was right, or tries further changes without re-examining the evidence.
    followups:
      - Would you leave the change in place or roll it back?
      - What would you do differently in the original diagnosis?
    common_errors:
      - Stacking more configuration changes on top without reverting the ineffective one.

  - external_key: problem_solving.customer_issue_resolution.only_early_tenants
    competency_key: debugging
    topic: A bug affecting only accounts created before a certain date
    difficulty: hard
    text: >-
      You notice that a bug several customers reported only affects accounts created before a certain date,
      and newer accounts are fine. How would you work out what's actually different about those accounts?
    expected_concepts:
      - compare configuration, schema, defaults and data between affected and unaffected accounts
      - look at releases and migrations around that date
      - check for accounts that were migrated or backfilled incompletely
      - check feature flags or settings with different defaults for new accounts
      - confirm the cause by reproducing it on a test account with the same state
      - find every affected account and plan remediation
    rubric:
      excellent: Uses the date as a clue to find the release or migration involved, compares affected and unaffected account state, reproduces with that state, and sizes the full set of affected accounts.
      good: Looks at changes around the date and compares account settings.
      weak: Fixes each reported account manually without understanding why they differ.
    followups:
      - How would you find every affected account, including ones that haven't reported it?
      - Would you fix the data, the code, or both?
    common_errors:
      - Patching individual accounts and leaving the rest broken.

  - external_key: problem_solving.customer_issue_resolution.unrelated_symptoms_common_cause
    competency_key: problem_solving
    topic: Spotting a common cause across different tickets
    difficulty: hard
    text: >-
      Over one week, five customers report problems that look unrelated: slow searches, a failed export, a
      missing notification and two timeouts. You suspect a single underlying cause. How would you test that
      theory?
    expected_concepts:
      - put all reports on one timeline with exact times and affected components
      - look for shared infrastructure, dependencies, regions or releases
      - check platform metrics for the same periods
      - make a prediction from the theory and check it, such as other unreported failures in the same windows
      - keep separate investigations going until the link is confirmed
    rubric:
      excellent: Builds a shared timeline, identifies shared dependencies, makes testable predictions from the common-cause theory and confirms or rejects it with data while keeping each ticket moving.
      good: Correlates the tickets by time and component to look for a shared cause.
      weak: Either treats them as unrelated or assumes a link without testing it.
    followups:
      - What evidence would make you drop the theory?
      - Who would you bring in once you think the cause is in shared infrastructure?
    common_errors:
      - Forcing a link between tickets because it makes a neater story.

  - external_key: problem_solving.customer_issue_resolution.demand_for_immediate_root_cause
    competency_key: problem_solving
    topic: Balancing speed and accuracy under pressure
    difficulty: hard
    text: >-
      A major customer's leadership is demanding a root cause within the hour after a disruption, but you only
      have partial evidence. How do you decide what to tell them, and how do you balance speed against
      accuracy?
    expected_concepts:
      - separate confirmed facts from working hypotheses explicitly
      - lead with impact, current status and mitigation
      - give a time when a confirmed root cause will follow
      - keep the investigation going with the right people in parallel
      - avoid naming a cause that may need to be retracted
    rubric:
      excellent: Gives a clear structure that separates facts from hypotheses, prioritises impact and mitigation, commits to a time for the confirmed cause, and explains why premature conclusions carry more risk than a short delay.
      good: Shares what is known with appropriate caveats and promises a follow-up.
      weak: Names a probable cause as fact to satisfy the request, or refuses to share anything.
    followups:
      - What would you say if your hypothesis turns out wrong after you've shared it?
      - Who else needs to approve what goes to the customer?
    common_errors:
      - Presenting a likely cause as confirmed to relieve pressure.
