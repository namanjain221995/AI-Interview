# Curated questions: structured thinking for open-ended problems (any role), part 4.
version: 1
defaults:
  role_tags: [general]
  round_types: [problem_solving, combined]
  kind: scenario
  competency_key: problem_solving
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.structured_thinking.clean_up_customer_list
    topic: Pinning down an ambiguous task
    difficulty: easy
    text: >-
      You're handed a task that just says "clean up the customer list." What would you need to pin down before
      you start, and how would you go about it?
    expected_concepts:
      - what the list is used for and by whom
      - what counts as dirty such as duplicates, outdated or incomplete records
      - what must not be changed or deleted
      - how the result will be checked
      - a sample review before changing everything
    rubric:
      excellent: Clarifies the purpose of the list, defines what clean means in concrete terms, identifies what must be preserved and agrees how the result will be checked, starting with a sample.
      good: Asks what clean means and who uses the list before starting.
      weak: Starts deleting or editing records based on their own idea of clean.
    followups:
      - How would you handle two records that might be the same customer?
      - What would you do before deleting anything?
    common_errors:
      - Making irreversible changes without a backup or sign-off.

  - external_key: problem_solving.structured_thinking.operations_manual_outline
    topic: Breaking a large deliverable into parts
    difficulty: easy
    text: >-
      You need to write a forty-page operations manual from scratch for a team that has never had one. How would
      you break that down into manageable work?
    expected_concepts:
      - identify the readers and what they need to do with it
      - outline sections around real tasks
      - prioritise the most used or riskiest procedures
      - gather input from the people who do the work
      - draft, review and release in stages
    rubric:
      excellent: Starts from the readers' tasks, builds an outline around them, prioritises the most important procedures, involves the people who do the work and delivers in reviewed stages.
      good: Creates an outline and works through it section by section with input.
      weak: Starts writing from page one with no outline or priorities.
    followups:
      - Which section would you write first, and why?
      - How would you keep it from going out of date?
    common_errors:
      - Writing everything before anyone reviews it.

  - external_key: problem_solving.structured_thinking.late_fridays_symptom
    topic: Telling a symptom from the problem
    difficulty: easy
    text: >-
      Your team ends up working late every Friday. How would you work out whether that's the real problem or a
      symptom of something else?
    expected_concepts:
      - look at what work piles up on Fridays
      - trace where that work comes from in the week
      - check for deadlines, late inputs or planning patterns
      - identify the underlying cause
      - test a change and see whether Fridays improve
    rubric:
      excellent: Examines what work lands on Fridays, traces it back to its source earlier in the week, identifies the underlying cause and tests a targeted change.
      good: Looks for the cause of the Friday workload rather than just the hours.
      weak: Proposes stopping work at a fixed time without understanding why it happens.
    followups:
      - What data would you collect over a couple of weeks?
      - What if the cause is a deadline set by another team?
    common_errors:
      - Treating the symptom directly and moving the problem to Monday.

  - external_key: problem_solving.structured_thinking.sketch_returns_process
    topic: Using a diagram to understand a process
    difficulty: easy
    text: >-
      A customer returns process passes through several teams, and nobody fully understands it. How would you use
      a simple diagram to make sense of it?
    expected_concepts:
      - sketch each step, team and handoff
      - build it with people from each team
      - mark decision points and waiting points
      - highlight loops, duplicates and gaps
      - use the diagram to agree where problems are
    rubric:
      excellent: Builds a diagram of steps, handoffs and decisions with each team, uses it to expose loops, gaps and waits, and turns it into a shared view of where to improve.
      good: Maps the process visually and identifies some problem areas.
      weak: Describes the process in words only or maps it alone from documentation.
    followups:
      - What would you look for first once the diagram exists?
      - How detailed should the first version be?
    common_errors:
      - Drawing the process as it should work instead of as it does.

  - external_key: problem_solving.structured_thinking.confusing_system_examples
    topic: Making a vague complaint concrete
    difficulty: easy
    text: >-
      Users keep saying a booking system is "confusing." How would you turn that complaint into specific problems
      you can work on?
    expected_concepts:
      - ask for or observe specific tasks where users struggle
      - watch users complete common tasks
      - record where they hesitate or make mistakes
      - group the issues by task and severity
      - pick the most common or costly to address first
    rubric:
      excellent: Observes real users on real tasks, records exactly where they struggle, groups and ranks the issues and starts with the most costly ones.
      good: Collects specific examples of confusion and prioritises them.
      weak: Redesigns the whole system based on the general complaint.
    followups:
      - How many users would you watch before drawing conclusions?
      - What would you do if different users struggle with different things?
    common_errors:
      - Asking users what they want instead of watching what they do.

  - external_key: problem_solving.structured_thinking.office_move_dependencies
    topic: Ordering work by dependencies
    difficulty: easy
    text: >-
      You're coordinating an office move with dozens of tasks, from network setup to furniture to telling
      customers the new address. How would you work out what has to happen in what order?
    expected_concepts:
      - list the tasks
      - identify which tasks depend on others
      - find the longest chain of dependent tasks
      - start long lead-time items first
      - track progress against key dates
    rubric:
      excellent: Lists tasks, identifies dependencies to find the critical chain, starts long lead-time items early and tracks progress against key dates.
      good: Orders tasks sensibly by what must come first.
      weak: Works through tasks in an arbitrary order.
    followups:
      - Which tasks would you expect to have the longest lead time?
      - What would you do if a task on the critical chain slipped?
    common_errors:
      - Missing hidden dependencies such as access or approvals.

  - external_key: problem_solving.structured_thinking.solved_elsewhere_check
    topic: Checking for existing solutions
    difficulty: easy
    text: >-
      Your team wants to build a process for tracking equipment loans. Before starting from scratch, how would you
      check whether someone has already solved this problem?
    expected_concepts:
      - ask other teams and departments
      - search internal documentation and tools
      - look at standard external approaches
      - assess whether existing solutions fit the needs
      - decide to reuse, adapt or build
    rubric:
      excellent: Searches internally and externally, assesses existing options against the team's actual needs and makes a reasoned choice to reuse, adapt or build.
      good: Asks around and looks for existing tools before building.
      weak: Builds a new process without checking.
    followups:
      - How would you decide whether an existing solution is close enough?
      - Who would you ask first?
    common_errors:
      - Rejecting an existing solution for small differences.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.structured_thinking.applications_backlog
    topic: Analysing demand and capacity
    difficulty: medium
    text: >-
      A team can process about a hundred applications a week but receives a hundred and fifty, and the backlog
      keeps growing. How would you analyse the problem before proposing a solution?
    expected_concepts:
      - confirm the numbers and the trend
      - break demand down by type and source
      - check how much incoming work is incomplete, duplicate or unnecessary
      - break down where processing time goes
      - consider options on both demand and capacity
    rubric:
      excellent: Validates the numbers, breaks down both demand and processing time, identifies avoidable work and evaluates options on both sides with their expected effect on the backlog.
      good: Looks at both demand and capacity before recommending.
      weak: Recommends adding staff or overtime without analysis.
    followups:
      - How long would it take to clear the backlog under each option?
      - What would you look for in the applications that take longest?
    common_errors:
      - Focusing only on processing speed.

  - external_key: problem_solving.structured_thinking.fix_data_quality_scope
    topic: Drawing boundaries around a big problem
    difficulty: medium
    text: >-
      You're asked to "fix data quality" across the company. How would you decide what's in scope and what isn't
      so the work is actually achievable?
    expected_concepts:
      - find which data problems cause the most harm
      - pick specific data sets and uses to start with
      - define measurable quality criteria for them
      - state explicitly what is out of scope for now
      - agree scope with the sponsor
    rubric:
      excellent: Anchors scope on where poor data causes the most harm, selects specific data sets with measurable quality criteria, documents exclusions and agrees scope with the sponsor.
      good: Narrows to a manageable set of priority data problems.
      weak: Tries to address all data at once.
    followups:
      - How would you find out where bad data costs the most?
      - What would you say to a team whose issue is out of scope?
    common_errors:
      - Defining quality in general terms that can't be measured.

  - external_key: problem_solving.structured_thinking.payment_reminder_test
    topic: Designing a fair test of an idea
    difficulty: medium
    text: >-
      Someone believes a friendlier payment reminder email would get invoices paid sooner. How would you set up a
      test to find out whether that's true?
    expected_concepts:
      - define the outcome to measure such as days to payment
      - split customers randomly into groups
      - change only the email between groups
      - run long enough to see a reliable difference
      - decide in advance what result would justify switching
    rubric:
      excellent: Defines a clear outcome, randomly assigns comparable groups, changes only the email, runs for a sufficient period and sets the decision rule before looking at results.
      good: Proposes a comparison between the old and new email with a clear measure.
      weak: Switches everyone to the new email and compares with last month.
    followups:
      - Why compare with a group at the same time rather than with last month?
      - What would you do if the difference is small?
    common_errors:
      - Comparing different time periods with other changes in play.

  - external_key: problem_solving.structured_thinking.consultants_disagree
    topic: Weighing conflicting expert advice
    difficulty: medium
    text: >-
      Two outside experts give you opposite recommendations on how to reorganise a warehouse layout. How would you
      work out which advice to follow?
    expected_concepts:
      - understand each recommendation's reasoning and assumptions
      - find where their assumptions differ
      - check those assumptions against your own data
      - consider each expert's experience with similar operations
      - test on a small area if possible
    rubric:
      excellent: Unpacks each recommendation into its assumptions, finds the specific points of disagreement, tests them against local data and pilots where possible.
      good: Compares the reasoning behind each recommendation.
      weak: Follows the more prestigious expert or splits the difference.
    followups:
      - What question would you ask both experts?
      - How would you pilot a layout change without disrupting operations?
    common_errors:
      - Judging advice by its source rather than its reasoning.

  - external_key: problem_solving.structured_thinking.time_lost_searching_proxy
    topic: Finding proxies for something hard to measure
    difficulty: medium
    text: >-
      Leadership wants to know how much time staff lose searching for information, but nobody tracks that. How
      would you come up with a reasonable measure?
    expected_concepts:
      - define what counts as searching time
      - consider proxies such as search logs or repeated questions
      - run a short sample study such as time diaries
      - combine sources to cross-check
      - state the uncertainty in the result
    rubric:
      excellent: Defines the quantity clearly, combines several proxies and a small direct sample, cross-checks them against each other and reports the result with its uncertainty.
      good: Proposes a sensible proxy or sample study.
      weak: Runs a single opinion survey and reports it as fact.
    followups:
      - How would you know whether your proxy actually tracks the real thing?
      - How precise does the answer need to be for the decision?
    common_errors:
      - Choosing a proxy because it's easy rather than because it's representative.

  - external_key: problem_solving.structured_thinking.half_time_same_team
    topic: Working with seemingly impossible constraints
    difficulty: medium
    text: >-
      You're asked to deliver a project in half the planned time with the same team. How would you work out what
      is actually possible and what you'd need to change?
    expected_concepts:
      - list the fixed and flexible constraints such as scope, quality and time
      - find out what is driving the new deadline
      - identify the minimum scope that meets the real need
      - look for work that can be removed, simplified or run in parallel
      - present options and their consequences
    rubric:
      excellent: Uncovers the reason for the deadline, separates fixed from flexible constraints, identifies the minimum scope that meets the need and presents concrete options with consequences.
      good: Proposes reducing scope or changing approach to meet the date.
      weak: Agrees to the date without changes or flatly says it's impossible.
    followups:
      - What would you be unwilling to cut, and why?
      - How would you explain the options to the person who set the deadline?
    common_errors:
      - Cutting quality silently to make the date.

  - external_key: problem_solving.structured_thinking.flat_satisfaction_segments
    topic: Breaking a flat number into segments
    difficulty: medium
    text: >-
      Customer satisfaction has been flat for a year despite several improvement projects. How would you break
      the number down to see whether anything is really changing underneath?
    expected_concepts:
      - segment by customer type, channel and product
      - check whether gains in one segment offset losses in another
      - look at the mix of customers over time
      - compare segments touched by the projects with those that weren't
      - check whether the measure itself is sensitive enough
    rubric:
      excellent: Segments the measure along meaningful lines, checks for offsetting movements and mix shifts, compares affected and unaffected segments and questions whether the measure can detect change.
      good: Breaks the number down by segment to look for hidden changes.
      weak: Concludes the projects failed because the total didn't move.
    followups:
      - How could a change in customer mix keep the number flat?
      - What if the measure only captures a small group of customers?
    common_errors:
      - Judging the projects only on the overall figure.

  - external_key: problem_solving.structured_thinking.one_complaint_policy_change
    topic: Judging whether one case is representative
    difficulty: medium
    text: >-
      After one very public customer complaint, a senior leader wants to change a company-wide refund policy. How
      would you check whether that case is representative before the policy changes?
    expected_concepts:
      - understand exactly what happened in the case
      - look at how often similar cases occur
      - check outcomes for customers under the current policy
      - assess the cost and risk of changing the policy
      - consider a targeted fix if the case is rare
    rubric:
      excellent: Establishes the facts of the case, measures how common it is, weighs the cost and risk of a policy change and proposes a proportionate response such as a targeted fix.
      good: Checks how common the issue is before agreeing to the change.
      weak: Changes the policy immediately or dismisses the case without looking.
    followups:
      - How would you present the data to the senior leader?
      - What if the case is rare but very damaging?
    common_errors:
      - Ignoring a rare case that reveals a real gap.

  - external_key: problem_solving.structured_thinking.free_delivery_economics
    topic: Reasoning from per-unit economics
    difficulty: medium
    text: >-
      Your company is considering free delivery on all orders. How would you reason from the economics of a single
      order to decide whether that could work?
    expected_concepts:
      - break down revenue and costs per order
      - estimate delivery cost per order
      - consider how order size and frequency might change
      - find the break-even conditions
      - consider alternatives such as a minimum order threshold
    rubric:
      excellent: Builds per-order economics, estimates how customer behaviour might shift, identifies the break-even conditions and compares with alternatives like a minimum spend.
      good: Compares delivery cost with order margin and considers behaviour change.
      weak: Argues from what competitors do without numbers.
    followups:
      - What change in customer behaviour would make it pay off?
      - How would you test it before rolling it out everywhere?
    common_errors:
      - Ignoring how the offer changes order size and frequency.

  - external_key: problem_solving.structured_thinking.split_work_reintegrate
    topic: Making sure the pieces fit back together
    difficulty: medium
    text: >-
      You've split a large analysis into three parts for three people to work on in parallel. How would you make
      sure the pieces fit back together into one coherent answer?
    expected_concepts:
      - agree the overall question and how parts contribute
      - define shared definitions and assumptions up front
      - agree the format and interfaces between parts
      - hold regular checkpoints to compare progress
      - integrate early with a rough draft
    rubric:
      excellent: Aligns everyone on the overall question, fixes shared definitions and interfaces up front, checks in regularly and integrates rough versions early to catch mismatches.
      good: Sets shared definitions and checkpoints between the parts.
      weak: Lets each person work independently and combines results at the end.
    followups:
      - What kind of mismatch would you most expect?
      - How would you handle a finding in one part that changes another?
    common_errors:
      - Discovering conflicting assumptions only at the end.

  - external_key: problem_solving.structured_thinking.what_counts_as_urgent
    topic: Resolving ambiguity in wording
    difficulty: medium
    text: >-
      A policy says urgent requests must be handled the same day, but every team interprets "urgent" differently,
      and it's causing friction. How would you resolve the ambiguity?
    expected_concepts:
      - gather examples of how each team uses the term
      - identify the purpose behind the same-day rule
      - draft a definition with clear criteria and examples
      - test the definition against real past requests
      - agree it with the teams and publish it
    rubric:
      excellent: Collects real usage, anchors the definition on the rule's purpose, writes clear criteria with examples, tests it against past requests and gets agreement from the teams.
      good: Proposes a clearer definition with input from teams.
      weak: Picks one team's interpretation or leaves teams to work it out.
    followups:
      - How would you handle requests that sit on the boundary?
      - How would you check the definition is working after a month?
    common_errors:
      - Writing a definition that still relies on judgment words.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.structured_thinking.supplier_exits_market
    topic: Structuring a response to a sudden shock
    difficulty: hard
    text: >-
      A key supplier announces it will stop operating in sixty days, and it provides a part used in most of your
      products. How would you structure the company's response?
    expected_concepts:
      - establish the facts such as remaining supply and contract terms
      - quantify exposure by product and revenue
      - split into immediate, short-term and long-term workstreams
      - generate options such as stockpiling, alternative suppliers and redesign
      - assign owners, decision points and regular updates
    rubric:
      excellent: Establishes the facts fast, quantifies exposure, separates immediate protection from medium-term alternatives and long-term resilience, and sets owners and decision points.
      good: Identifies main options and organises a response plan.
      weak: Jumps to a single option such as finding a new supplier without sizing the problem.
    followups:
      - What would you do in the first forty-eight hours?
      - How would you decide which products to protect first?
    common_errors:
      - Working on long-term fixes before securing short-term supply.

  - external_key: problem_solving.structured_thinking.reversible_vs_irreversible_parts
    topic: Splitting a big decision into reversible parts
    difficulty: hard
    text: >-
      Leadership is weighing whether to consolidate three warehouses into one. How would you break that decision
      into parts that are easy to reverse and parts that aren't, and why would that matter?
    expected_concepts:
      - list the component decisions such as leases, staffing, systems and locations
      - classify each by cost and difficulty of reversing
      - move faster on reversible parts to learn
      - gather more evidence before irreversible commitments
      - sequence the plan so learning comes before lock-in
    rubric:
      excellent: Decomposes the decision into components, classifies each by reversibility, sequences reversible steps first to generate learning and reserves the most rigorous analysis for irreversible commitments.
      good: Distinguishes reversible and irreversible elements and adjusts caution accordingly.
      weak: Treats it as one all-or-nothing decision.
    followups:
      - Which part of this decision is hardest to undo?
      - What could you learn from a reversible step before the big commitment?
    common_errors:
      - Applying the same level of scrutiny to every part.

  - external_key: problem_solving.structured_thinking.vague_strategy_to_problems
    topic: Translating a vague strategy into concrete problems
    difficulty: hard
    text: >-
      The company's new strategy is to "become the easiest company to do business with." How would you turn that
      into a handful of concrete problems your team could actually work on?
    expected_concepts:
      - define what easy means from the customer's point of view
      - map the customer journey and where effort is highest
      - use evidence such as complaints, drop-offs and contact reasons
      - select problems your team can influence
      - set measures that connect back to the strategy
    rubric:
      excellent: Defines easy in customer terms, maps the journey with evidence to find the highest-effort points, picks problems within the team's influence and links each to a measure of the strategy.
      good: Breaks the strategy down into specific improvement areas with some evidence.
      weak: Lists generic initiatives that sound aligned but aren't grounded.
    followups:
      - How would you choose between problems with high impact and ones your team can fully own?
      - How would you show progress against the strategy?
    common_errors:
      - Working on problems that are easy for the company rather than for customers.

  - external_key: problem_solving.structured_thinking.forty_exceptions_process
    topic: Simplifying an overgrown process
    difficulty: hard
    text: >-
      A billing process has collected forty special-case exceptions over the years, and errors keep creeping in.
      How would you approach simplifying it without breaking the cases that still matter?
    expected_concepts:
      - catalogue each exception, its origin and how often it is used
      - group exceptions by underlying need
      - retire unused or obsolete ones with owners' agreement
      - redesign the core rules to absorb common needs
      - migrate carefully with checks on real cases
    rubric:
      excellent: Catalogues exceptions with usage and origin, groups them by underlying need, retires obsolete ones, redesigns the core rules to cover the rest and migrates with verification on real cases.
      good: Reviews exceptions and removes or consolidates many of them.
      weak: Rebuilds from scratch ignoring existing exceptions, or leaves them all in place.
    followups:
      - How would you handle an exception that only one important customer uses?
      - How would you stop new exceptions piling up again?
    common_errors:
      - Removing an exception without knowing who depends on it.

  - external_key: problem_solving.structured_thinking.cost_cut_raised_cost
    topic: Investigating a counterintuitive result
    difficulty: hard
    text: >-
      Your analysis shows that switching to a cheaper packaging supplier has actually increased total costs. How
      would you investigate that result and explain it to people who expected savings?
    expected_concepts:
      - verify the analysis and data first
      - trace total cost through all affected areas such as damage, returns and handling
      - identify the mechanism behind the increase
      - check timing and other changes in the same period
      - present the full cost picture clearly
    rubric:
      excellent: Verifies the result, traces costs across every affected area to find the mechanism, rules out coincidental changes and explains the total cost picture with evidence.
      good: Identifies hidden costs and checks the analysis.
      weak: Assumes the analysis is wrong because the result is unexpected.
    followups:
      - Which hidden costs would you check first?
      - How would you prevent this kind of surprise in future decisions?
    common_errors:
      - Looking only at the direct purchase price.

  - external_key: problem_solving.structured_thinking.pause_promotion_one_hour
    topic: Deciding fast with partial evidence
    difficulty: hard
    text: >-
      A promotion that just went live may be causing order errors, the data is incomplete, and you have an hour to
      decide whether to pause it. How would you structure that decision?
    expected_concepts:
      - compare the cost of pausing with the cost of continuing
      - gather the quickest decisive evidence available
      - consider partial options such as limiting the promotion
      - decide who must be involved and inform them
      - set a time to review with more data
    rubric:
      excellent: Frames the decision as relative costs of action and inaction, gathers the fastest decisive evidence, considers partial measures, involves the right people and sets a review point.
      good: Weighs the risks and makes a reasoned call within the time.
      weak: Waits for complete data or decides without considering consequences.
    followups:
      - What evidence could you realistically get in an hour?
      - How would you communicate the decision if it later turns out wrong?
    common_errors:
      - Ignoring options between full pause and full continue.

  - external_key: problem_solving.structured_thinking.is_productivity_problem_real
    topic: Establishing whether a problem exists
    difficulty: hard
    text: >-
      Leadership believes there's a serious productivity problem in one division, but nobody has evidence either
      way. How would you establish whether the problem is real and how big it is?
    expected_concepts:
      - clarify what leadership has observed and what productivity means here
      - define measures that fit the division's work
      - find comparison points such as past performance or similar teams
      - gather evidence from both data and the people doing the work
      - report findings including if the problem is not what was assumed
    rubric:
      excellent: Turns the belief into a definable claim, chooses measures suited to the work, uses comparisons and mixed evidence, and reports findings plainly even if they contradict the starting belief.
      good: Defines productivity measures and collects evidence before concluding.
      weak: Accepts the problem as given and starts proposing fixes.
    followups:
      - What would you do if the data shows no problem but leadership still believes there is one?
      - How would you avoid measures that penalise valuable but slow work?
    common_errors:
      - Choosing measures that confirm the starting belief.
