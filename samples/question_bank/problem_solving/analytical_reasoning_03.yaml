# Curated questions: problem solving / analytical reasoning (part 3 of 4).
# Scenario questions about interpreting metric changes, ambiguous data and root-causing KPI moves.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_analyst, data_scientist, product_manager, business_analyst]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.analytical_reasoning.bestseller_sales_halved
    competency_key: problem_solving
    topic: Product-level sales drop with steady traffic
    difficulty: easy
    text: >-
      Sales of your best-selling product fell by half last week, but traffic to its product page didn't change.
      What would you check, and in what order?
    expected_concepts:
      - stock availability and out-of-stock periods
      - price or promotion changes, including competitor prices
      - errors or changes on the product page or add-to-cart
      - delivery estimates or shipping costs shown to buyers
      - variant or size availability
    rubric:
      excellent: Uses the steady traffic to focus on what happens after the visit, checks availability, price, page errors and delivery promises in a sensible order and confirms with data at each step.
      good: Checks stock and price and looks at the page conversion steps.
      weak: Suggests marketing more or redesigning the page without diagnosing the cause.
    followups:
      - Stock was fine but only one size was available. How would you show the impact?
      - How would you set up a check that catches this sooner?
    common_errors:
      - Ignoring stock and availability data, which often sits outside the analytics tool.

  - external_key: problem_solving.analytical_reasoning.percent_vs_points_slide
    competency_key: communication
    topic: Reporting relative and absolute changes
    difficulty: easy
    text: >-
      A colleague's slide says conversion grew fifty percent, when it actually went from two percent to three.
      How would you rework that statement so an executive audience reads it correctly?
    expected_concepts:
      - distinguish percentage points from relative change
      - show the before and after values
      - add absolute impact such as extra orders or revenue
      - note the time period and sample size
    rubric:
      excellent: Rewrites the claim with both absolute and relative change, adds the business impact in concrete units and explains why the original wording could mislead decisions.
      good: Clarifies the difference between percentage points and percent change.
      weak: Sees no problem with the slide or only fixes the number without explaining.
    followups:
      - When is relative change the more useful way to report a result?
      - How would you raise this with the colleague?
    common_errors:
      - Reporting only relative changes on small baselines.

  - external_key: problem_solving.analytical_reasoning.loan_approval_time_up
    competency_key: problem_solving
    topic: Finding a bottleneck in a business process
    difficulty: easy
    text: >-
      The average time to approve a loan application rose from two days to five over the last month. How would
      you find out where in the process the delay is coming from?
    expected_concepts:
      - break the process into stages using timestamps
      - compare time spent in each stage before and after
      - look for queues building up at one stage
      - check volume changes, staffing or new rules
      - look at the distribution, not just the average
    rubric:
      excellent: Measures time per stage from event timestamps, finds where waiting grew, checks volume, capacity and rule changes, and looks at the distribution to see if a subset of cases drives the delay.
      good: Breaks the process into stages and compares durations.
      weak: Proposes adding staff or automation without finding where the delay is.
    followups:
      - What if the timestamps for some stages are missing?
      - How would you tell a capacity problem from a new rule creating rework?
    common_errors:
      - Looking only at the end-to-end average without stage-level timing.

  - external_key: problem_solving.analytical_reasoning.call_abandon_rate_doubled
    competency_key: problem_solving
    topic: Operational metric spike
    difficulty: easy
    text: >-
      In a contact centre, the share of callers who hang up before reaching an agent doubled this week. How would
      you work out why?
    expected_concepts:
      - compare call volume against agent availability by hour
      - check wait times and queue routing changes
      - look for an event driving extra calls, such as an outage or a mailing
      - check phone menu or system changes
      - split by queue, time of day and call reason
    rubric:
      excellent: Compares demand and capacity by hour and queue, looks for the event driving extra calls or a routing change, and pinpoints when and where abandonment rose.
      good: Checks call volume and staffing and finds a plausible cause.
      weak: Blames agents or suggests hiring without analysis.
    followups:
      - What would you recommend in the short term while the cause is fixed?
      - How would you tell whether callers who hung up called back later?
    common_errors:
      - Analysing daily totals when the problem is concentrated in a few peak hours.

  - external_key: problem_solving.analytical_reasoning.interviews_vs_usage_conflict
    competency_key: product_sense
    topic: Conflicting qualitative and quantitative signals
    difficulty: easy
    text: >-
      In interviews, users say they love a new feature, but usage data shows very few people come back to it
      after the first try. How would you make sense of the two signals?
    expected_concepts:
      - who was interviewed versus the whole user base
      - stated preference versus actual behaviour
      - the feature may be valuable but rarely needed
      - discoverability or friction on return visits
      - targeted follow-up research and usage segmentation
    rubric:
      excellent: Considers sample differences, stated versus revealed preference and the natural frequency of need, and proposes specific analysis and follow-up research to tell them apart.
      good: Notes that interviewees may not represent all users and suggests digging into usage.
      weak: Picks one signal and ignores the other.
    followups:
      - How would you decide whether low repeat usage is actually a problem for this feature?
      - What would you ask in a follow-up interview?
    common_errors:
      - Treating the interview sample as representative of all users.

  - external_key: problem_solving.analytical_reasoning.paid_social_share_collapse
    competency_key: data_analysis
    topic: Attribution changes
    difficulty: easy
    text: >-
      Paid social's share of conversions in the marketing report dropped from thirty percent to ten percent
      overnight. What would you check before telling the marketing team their campaigns stopped working?
    expected_concepts:
      - attribution model or window changes
      - tracking pixel or tagging breaks
      - privacy or consent changes affecting tracking
      - campaign spend, delivery and clicks on the platform side
      - total conversions to see if they moved at all
    rubric:
      excellent: Checks total conversions first, then attribution settings, tagging and consent changes, and cross-references the ad platform's delivery data before concluding anything about the campaigns.
      good: Suspects an attribution or tracking change and checks it.
      weak: Reports the campaigns as failing based on the share alone.
    followups:
      - Total conversions didn't change at all. What does that tell you?
      - How would you measure paid social's contribution without relying on attribution?
    common_errors:
      - Not checking whether total conversions changed before analysing shares.

  - external_key: problem_solving.analytical_reasoning.app_rating_fell
    competency_key: product_sense
    topic: Diagnosing a ratings drop
    difficulty: easy
    text: >-
      Your app's store rating fell from 4.5 to 3.9 over two weeks. How would you find out what's driving it and
      how much it matters?
    expected_concepts:
      - read and categorise the recent reviews
      - split ratings by app version, device and region
      - match timing with releases, pricing or policy changes
      - check crash rates and support contacts
      - estimate impact on store conversion and installs
    rubric:
      excellent: Analyses recent reviews by theme and version, ties the drop to a release or change, corroborates with crash and support data and estimates the effect on installs.
      good: Reads recent reviews and checks the latest release.
      weak: Proposes asking happy users for reviews without diagnosing the drop.
    followups:
      - The complaints are about a price change, not a bug. What would you do?
      - How would you track whether the fix restored the rating?
    common_errors:
      - Reading only the lowest reviews without checking how many there are relative to the total.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.analytical_reasoning.fraud_flags_mostly_legit
    competency_key: statistics_experimentation
    topic: Base rates and precision
    difficulty: medium
    text: >-
      A fraud model flags transactions for review, and the operations team found that ninety percent of flagged
      transactions in a sample were legitimate. They say the model is useless. How would you work out whether
      that's true?
    expected_concepts:
      - fraud is rare, so low precision can still be valuable
      - compare against the base rate of fraud
      - look at recall, meaning how much fraud is caught
      - weigh the cost of reviews against losses prevented
      - tune the threshold to the review capacity
    rubric:
      excellent: Explains base rates, compares the flagged fraud rate with the overall rate, considers recall and the costs of reviews versus losses, and proposes adjusting the threshold to business costs.
      good: Notes that fraud is rare and that precision alone doesn't judge the model.
      weak: Agrees the model is useless or defends it without numbers.
    followups:
      - How would you choose the threshold if review capacity is fixed?
      - How would you measure the fraud the model misses?
    common_errors:
      - Judging a rare-event model on precision without considering the base rate.

  - external_key: problem_solving.analytical_reasoning.staffing_vs_store_sales
    competency_key: problem_solving
    topic: Reverse causality
    difficulty: medium
    text: >-
      Stores with more staff have higher sales per square metre, and operations wants to add staff everywhere.
      How would you test whether more staff actually drives more sales?
    expected_concepts:
      - busy stores are given more staff, so causality may run the other way
      - control for location, footfall and store format
      - use changes in staffing within the same store over time
      - propose a controlled trial across matched stores
      - consider diminishing returns and cost per extra sale
    rubric:
      excellent: Identifies reverse causality and confounders, proposes within-store analysis or a controlled trial across matched stores, and frames the result in terms of incremental profit.
      good: Points out that busy stores get more staff and suggests controlling for footfall.
      weak: Accepts the correlation or rejects it without a way to test.
    followups:
      - How would you choose stores for the trial?
      - What result would justify adding staff everywhere?
    common_errors:
      - Ignoring that staffing decisions are themselves based on expected sales.

  - external_key: problem_solving.analytical_reasoning.checkout_outage_cost
    competency_key: problem_solving
    topic: Estimating the cost of an incident
    difficulty: medium
    text: >-
      A checkout outage lasted three hours on a weekday afternoon, and finance wants to know how much revenue it
      cost. How would you estimate it?
    expected_concepts:
      - expected baseline from comparable days and hours
      - recovered demand after the outage as customers returned
      - net loss as the gap over a wider window
      - partial degradation before and after the full outage
      - a range rather than a single number
    rubric:
      excellent: Builds a baseline from comparable periods, accounts for demand recovered after the outage and partial degradation, and reports a net loss range with its assumptions.
      good: Compares with a similar day and hour and estimates lost orders.
      weak: Multiplies hourly revenue by three hours with no adjustment.
    followups:
      - How would you estimate longer-term effects such as customers who never return?
      - What would change for an outage during a sale event?
    common_errors:
      - Ignoring that many customers simply bought later.

  - external_key: problem_solving.analytical_reasoning.define_active_user
    competency_key: product_sense
    topic: Choosing a metric definition
    difficulty: medium
    text: >-
      You're asked to define active user for a new collaboration product, and different teams want different
      definitions. How would you choose one, and how would you check that it's a good definition?
    expected_concepts:
      - tie the definition to meaningful value, not just logging in
      - compare candidate definitions on how well they predict retention or revenue
      - check sensitivity to thresholds and time windows
      - make it simple to explain and hard to game
      - document it and review it periodically
    rubric:
      excellent: Anchors the definition in the product's core value, compares candidates empirically against retention or revenue, tests thresholds and windows, and plans to document and revisit it.
      good: Picks a value-based action and justifies it against alternatives.
      weak: Chooses login or app open without considering what activity means.
    followups:
      - How would you get the teams who disagree to accept the decision?
      - What would make you change the definition later?
    common_errors:
      - Choosing a definition that rises when users struggle, such as page views.

  - external_key: problem_solving.analytical_reasoning.verification_step_signup_loss
    competency_key: problem_solving
    topic: Analysing a mandatory funnel step
    difficulty: medium
    text: >-
      A new identity verification step was added to sign-up, and completed sign-ups fell eighteen percent. The
      compliance team says the step is mandatory. How would you analyse where the loss happens and what could
      be recovered?
    expected_concepts:
      - break the step into sub-steps and find where users leave
      - separate verification failures from abandonment
      - segment by device, document type and country
      - check whether lost users would have become valuable customers
      - propose changes within compliance limits, such as deferring the step or better guidance
    rubric:
      excellent: Breaks the step into sub-steps, separates failures from drop-off, segments to find fixable problems, estimates the value of lost users and proposes improvements that keep compliance satisfied.
      good: Finds where users drop off in the new step and suggests some fixes.
      weak: Accepts the loss because the step is mandatory, or proposes removing it.
    followups:
      - Some lost users may have been fraudulent. How would you account for that?
      - How would you test a change to the step safely?
    common_errors:
      - Treating every lost sign-up as a lost good customer.

  - external_key: problem_solving.analytical_reasoning.sampled_segment_swings
    competency_key: data_analysis
    topic: Sampled data in analytics tools
    difficulty: medium
    text: >-
      In your analytics tool, a segment's conversion swings wildly from day to day while the overall number is
      stable, and someone mentions that the tool samples data for large queries. How would you decide whether
      to trust the segment numbers?
    expected_concepts:
      - check the sampling rate and the segment's sample size
      - compare with unsampled raw data for a few days
      - estimate the margin of error for the segment
      - reduce the date range or query raw data to avoid sampling
    rubric:
      excellent: Checks how much data underlies the segment, compares sampled figures with unsampled raw data, estimates the error and chooses a method that gives reliable segment numbers.
      good: Recognises sampling as the cause and suggests querying unsampled data.
      weak: Reports the swings as real changes in the segment.
    followups:
      - How would you warn dashboard users about sampled numbers?
      - What if raw data isn't available?
    common_errors:
      - Not knowing how large a sample sits behind a small segment's numbers.

  - external_key: problem_solving.analytical_reasoning.email_open_rate_jump
    competency_key: data_analysis
    topic: Measurement changes outside your control
    difficulty: medium
    text: >-
      Email open rates jumped from twenty to forty-five percent across every campaign in the same month. What
      would you suspect, and how would you measure email performance going forward?
    expected_concepts:
      - email client privacy features that pre-load images and register opens
      - uniform change across campaigns points to measurement
      - check opens by email client
      - shift to clicks, conversions or downstream actions
      - mark the break in historical comparisons
    rubric:
      excellent: Attributes the uniform jump to a measurement change such as client privacy pre-loading, confirms by email client, and moves reporting to clicks and conversions with the history annotated.
      good: Suspects a tracking change and suggests clicks as a better measure.
      weak: Credits the email team with a big improvement.
    followups:
      - How would you compare this year with last year now?
      - Which metric would you use for subject line tests?
    common_errors:
      - Continuing to optimise subject lines on a metric that no longer measures reading.

  - external_key: problem_solving.analytical_reasoning.picking_accuracy_vs_complaints
    competency_key: problem_solving
    topic: KPI that disagrees with customer outcomes
    difficulty: medium
    text: >-
      A warehouse dashboard shows order picking accuracy at ninety-nine percent, but customer complaints about
      wrong items have doubled. How would you investigate the gap?
    expected_concepts:
      - how picking accuracy is measured and what it covers
      - errors at other stages such as packing, labelling or catalogue data
      - sample audits versus all orders
      - match complaint orders to warehouse and process records
      - check volume growth and new product types
    rubric:
      excellent: Questions how the KPI is measured, traces complaint orders through each stage to find where errors occur, and considers sampling, catalogue data and volume changes.
      good: Traces complaints back to orders and checks other stages beyond picking.
      weak: Trusts the KPI and assumes customers are mistaken.
    followups:
      - What if the complaints come from one product category?
      - How would you redesign the accuracy KPI?
    common_errors:
      - Assuming a high internal KPI rules out a problem customers are reporting.

  - external_key: problem_solving.analytical_reasoning.promotion_pull_forward
    competency_key: statistics_experimentation
    topic: Promotion pull-forward
    difficulty: medium
    text: >-
      A two-week promotion lifted sales by thirty percent while it ran. How would you measure whether it created
      extra demand or mostly pulled purchases forward?
    expected_concepts:
      - look at sales in the weeks after the promotion for a dip
      - compare with a baseline or non-promoted stores or regions
      - check stockpiling and repeat buyers
      - check cannibalisation of non-promoted products
      - measure net incremental profit, not just sales
    rubric:
      excellent: Compares total sales over a window that includes the post-promotion period against a baseline or control, checks stockpiling and cannibalisation, and reports net incremental profit.
      good: Checks for a post-promotion dip against a baseline.
      weak: Reports the thirty percent lift as the promotion's value.
    followups:
      - How long a window after the promotion would you include?
      - How would you set up the next promotion to measure it better?
    common_errors:
      - Ending the analysis on the last day of the promotion.

  - external_key: problem_solving.analytical_reasoning.resolution_time_better_backlog_worse
    competency_key: problem_solving
    topic: Averages that ignore unresolved work
    difficulty: medium
    text: >-
      Average ticket resolution time improved by half after a process change, but the open backlog keeps
      growing. How would you explain what's going on?
    expected_concepts:
      - resolution time only counts closed tickets
      - quick tickets are being closed first while hard ones age
      - look at the age of open tickets
      - compare incoming and closed volumes
      - track time-to-resolution including open tickets
    rubric:
      excellent: Explains that the metric ignores unresolved tickets, shows it with backlog age and in-versus-out volumes, and proposes a measure that includes open work.
      good: Notes that easy tickets may be prioritised and checks the backlog age.
      weak: Treats the two metrics as unrelated or assumes one is wrong.
    followups:
      - Which metric would you add to the team's dashboard?
      - How would you check whether customers notice the change?
    common_errors:
      - Measuring resolution time only for closed tickets.

  - external_key: problem_solving.analytical_reasoning.export_button_moved
    competency_key: product_sense
    topic: Discoverability versus lack of need
    difficulty: medium
    text: >-
      Usage of the export feature dropped sixty percent after a redesign moved its button. The designer says
      people just didn't need it much. How would you find out which explanation is right?
    expected_concepts:
      - compare heavy prior users of export before and after
      - check whether users search for export or contact support about it
      - look for workarounds such as copying data manually
      - test a more visible placement with a subset of users
      - check the impact on retention of users who relied on it
    rubric:
      excellent: Focuses on prior heavy users, looks for signs of unmet need such as searches, support contacts and workarounds, and proposes a controlled test of placement.
      good: Checks whether previous users stopped exporting and suggests a test.
      weak: Accepts one explanation without evidence.
    followups:
      - What would convince the designer?
      - Which users would you prioritise if only some depend on export?
    common_errors:
      - Comparing total usage without looking at who stopped using the feature.

  - external_key: problem_solving.analytical_reasoning.growth_league_table
    competency_key: data_analysis
    topic: Fair comparisons across units
    difficulty: medium
    text: >-
      Leadership ranks sales regions by year-over-year growth and rewards the top three. What could that ranking
      hide, and how would you build a fairer comparison?
    expected_concepts:
      - small regions swing more in percentage terms
      - last year's base, including one-off events
      - differences in market potential and conditions
      - compare against targets or expected growth
      - combine relative and absolute measures with uncertainty
    rubric:
      excellent: Explains base effects, size-driven volatility and market differences, and proposes a comparison against expected performance with both absolute and relative views.
      good: Points out base effects and size differences.
      weak: Accepts the ranking or only suggests a different single metric.
    followups:
      - How would you present this to leadership without seeming to protect weak regions?
      - How would you set expected growth for each region?
    common_errors:
      - Ranking units with very different sizes by percentage change alone.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.analytical_reasoning.loyalty_invite_selection
    competency_key: statistics_experimentation
    topic: Selection on prior behaviour
    difficulty: hard
    text: >-
      You're asked whether a loyalty program increased spending. Members were invited based on how much they had
      spent in the past. How would you design an analysis that gives a credible answer?
    expected_concepts:
      - invitation by past spend creates selection bias
      - compare customers just above and just below the invitation threshold
      - matching on pre-period behaviour
      - difference-in-differences on spending before and after
      - regression to the mean among high spenders
    rubric:
      excellent: Identifies the selection problem and regression to the mean, and proposes a threshold-based comparison or matched difference-in-differences with clear assumptions and limitations.
      good: Recognises selection bias and proposes matching or before-and-after comparisons with a control group.
      weak: Compares members with non-members directly.
    followups:
      - What would make the threshold comparison invalid?
      - How would you set up the program differently to measure it properly?
    common_errors:
      - Ignoring that top spenders naturally drift down toward average over time.

  - external_key: problem_solving.analytical_reasoning.local_wins_no_global_lift
    competency_key: problem_solving
    topic: Experiment wins that don't add up
    difficulty: hard
    text: >-
      Over the past year, product teams reported dozens of winning experiments on their own metrics, yet the
      company's main metric hasn't moved. How would you investigate the gap?
    expected_concepts:
      - winner's curse inflating reported effects
      - novelty effects fading after the test
      - local metrics that don't translate to the global one
      - cannibalisation between teams' changes
      - long-term holdout to measure cumulative effect
      - external headwinds offsetting the gains
    rubric:
      excellent: Considers inflated estimates, fading effects, poor local-to-global metric alignment, cannibalisation and external headwinds, and proposes concrete checks such as re-tests and a long-term holdout.
      good: Names two or three reasons and suggests a holdout or re-testing past winners.
      weak: Assumes the experiments were run incorrectly without a way to check.
    followups:
      - How would you convince teams to accept a long-term holdout?
      - How would you adjust reported effects for the winner's curse?
    common_errors:
      - Summing individual experiment effects and expecting them to add up.

  - external_key: problem_solving.analytical_reasoning.true_decline_with_double_count
    competency_key: data_analysis
    topic: Real decline mixed with a data bug
    difficulty: hard
    text: >-
      You're investigating a drop in subscription revenue, and you find both a genuine rise in cancellations and
      a bug that double-counted renewals in the earlier period. How would you work out the true size of the
      decline and present it?
    expected_concepts:
      - correct the historical data to remove the double counting
      - recompute the trend on a consistent basis
      - size the real cancellation effect separately
      - bridge from the reported decline to the true decline
      - communicate the restatement and any decisions it affects
    rubric:
      excellent: Restates history on a consistent basis, separates the artefact from the real decline with a clear bridge, and plans how to communicate the correction and its effect on past decisions.
      good: Fixes the double counting and recalculates the decline.
      weak: Reports one cause and ignores the other, or presents the raw drop.
    followups:
      - Some targets were set using the inflated numbers. What would you recommend?
      - How would you rebuild trust in the revenue reports?
    common_errors:
      - Correcting the current period but not the comparison period.

  - external_key: problem_solving.analytical_reasoning.messages_per_user_falling
    competency_key: data_analysis
    topic: Composition change versus product decline
    difficulty: hard
    text: >-
      In a messaging product, daily messages per user are falling, but the number of users is growing quickly.
      How would you work out whether the product is getting worse or the new users are just different?
    expected_concepts:
      - compare cohorts at the same age
      - new users have fewer contacts at first, a network effect
      - track existing users' messaging over time
      - control for market and acquisition channel of new users
      - decompose the change into mix and within-group effects
    rubric:
      excellent: Decomposes the change into mix and within-cohort effects, compares cohorts at equal age and network size, and checks whether established users are declining before concluding.
      good: Separates new and existing users and compares their behaviour over time.
      weak: Reads the falling average as product decline.
    followups:
      - Established users are stable. What would you report to leadership?
      - How would you tell whether new users will reach the same level?
    common_errors:
      - Comparing new users with established users without accounting for network size.

  - external_key: problem_solving.analytical_reasoning.short_test_long_effect
    competency_key: statistics_experimentation
    topic: Long-term effects from short tests
    difficulty: hard
    text: >-
      A two-week experiment showed a big lift in engagement from sending recommendation emails more often. How
      would you estimate whether that effect will last, fade or even turn negative over the coming months?
    expected_concepts:
      - novelty effects and fatigue
      - track the effect by week within the test
      - unsubscribe and complaint rates as early warning
      - long-running holdout group
      - surrogate metrics validated against long-term outcomes
    rubric:
      excellent: Examines the trend of the effect within the test, watches unsubscribes and fatigue signals, proposes a long-running holdout and explains how surrogate metrics would be validated.
      good: Mentions novelty effects and suggests a longer test or holdout.
      weak: Projects the two-week lift forward unchanged.
    followups:
      - How large and how long would the holdout need to be?
      - Which early metric would you trust as a predictor of long-term harm?
    common_errors:
      - Ignoring the permanent loss from users who unsubscribe.

  - external_key: problem_solving.analytical_reasoning.net_revenue_retention_decline
    competency_key: problem_solving
    topic: Decomposing net revenue retention
    difficulty: hard
    text: >-
      In your B2B business, net revenue retention fell from one hundred fifteen to one hundred four percent over
      two quarters. How would you break down what's driving it, and what would you investigate first?
    expected_concepts:
      - split into expansion, contraction and churn
      - segment by customer size, plan and cohort
      - check seat counts, usage and pricing changes
      - leading indicators such as declining usage before renewal
      - look for concentration in a few large accounts
    rubric:
      excellent: Decomposes retention into expansion, contraction and churn, segments by account type and cohort, checks concentration and links the drivers to usage signals that predict renewals.
      good: Splits into expansion and churn and identifies the main driver.
      weak: Treats it as a single churn problem without decomposing.
    followups:
      - Expansion fell mostly in mid-sized accounts. What would you look at next?
      - How would you give the sales team an early warning list?
    common_errors:
      - Missing contraction, where customers stay but pay less.
