# Curated questions: debugging reasoning (part 4 of 4).
# Debugging process and habits: instrumentation, tests, bug reports, getting unstuck, mitigation versus
# diagnosis, root cause depth, cross-team investigations and real past examples.
# Spoken scenario questions; the candidate reasons aloud without running code.
version: 1
defaults:
  competency_key: debugging
  kind: scenario
  role_tags: [backend, frontend, qa, mobile]
  round_types: [problem_solving, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.debugging_reasoning.getting_unstuck
    topic: Getting unstuck
    difficulty: easy
    text: >-
      When you're stuck on a bug and every idea you've tried has failed, what do you do to get unstuck?
      Give me an example from your own work.
    expected_concepts:
      - write down what is known, assumed and ruled out
      - re-check assumptions and re-read the evidence
      - explain the problem aloud to someone or something
      - change the approach (smaller reproduction, different tool, bisecting)
      - take a break or ask for help with a clear summary
    rubric:
      excellent: Describes a deliberate method for resetting (listing facts versus assumptions, explaining the problem, changing technique) and backs it with a specific example where it worked.
      good: Gives a couple of sensible tactics and a brief example.
      weak: Keeps trying random changes or gives no concrete example.
    followups:
      - Which assumption turned out to be wrong in that example?
      - What do you include when you ask a colleague for help?
    common_errors:
      - Asking for help without summarising what has already been ruled out.

  - external_key: problem_solving.debugging_reasoning.choosing_what_to_log
    topic: Adding targeted logging
    difficulty: easy
    text: >-
      You're adding logging to track down a bug that only happens in production. How do you decide what to
      log and where?
    expected_concepts:
      - start from a specific hypothesis or question
      - log at decision points and boundaries with key values
      - include identifiers to correlate (request, user, job)
      - avoid sensitive data
      - control volume and remove or downgrade afterwards
    rubric:
      excellent: Ties each log line to a question it should answer, places logs at decision points with correlation IDs, avoids sensitive data and keeps volume manageable.
      good: Logs inputs and outputs around the suspected area with identifiers.
      weak: Adds logging everywhere without a plan.
    followups:
      - How do you avoid flooding the logs in a busy service?
      - What data should never appear in those logs?
    common_errors:
      - Logging values without enough context to match them to a specific request.

  - external_key: problem_solving.debugging_reasoning.failing_test_before_fix
    topic: Capturing a bug in a test first
    difficulty: easy
    text: >-
      You've found a bug in a function. How do you capture it in a test before you fix it, and why does the
      order matter?
    expected_concepts:
      - write a test that reproduces the bug and fails
      - confirms understanding of the cause
      - proves the fix works when the test passes
      - guards against regressions
      - test the smallest unit that shows the bug
    rubric:
      excellent: Explains writing a minimal failing test first, why seeing it fail proves the test captures the bug and how it then verifies the fix and prevents regressions.
      good: Writes a regression test and explains it prevents recurrence.
      weak: Writes tests after the fix, if at all, without checking they would have failed.
    followups:
      - What if the bug is hard to reproduce in a unit test?
      - How do you know the test would have caught the original bug?
    common_errors:
      - Writing a test after the fix that would have passed anyway.

  - external_key: problem_solving.debugging_reasoning.writing_reproducible_report
    topic: Writing a useful bug report
    difficulty: easy
    text: >-
      When you write up a bug for someone else to fix, what do you put in it so they can reproduce it
      quickly?
    expected_concepts:
      - exact steps, inputs and starting state
      - expected versus actual behaviour
      - environment, version and build details
      - evidence such as logs, screenshots or recordings
      - frequency and any narrowing already done
    rubric:
      excellent: Covers steps, expected versus actual, environment, evidence and frequency, and mentions sharing what has already been ruled out to save the fixer time.
      good: Includes steps, expected and actual results and environment.
      weak: Describes the symptom vaguely without steps or evidence.
    followups:
      - How would you report a bug that only happens sometimes?
      - What makes a bug report frustrating to receive?
    common_errors:
      - Leaving out the version or environment where it happened.

  - external_key: problem_solving.debugging_reasoning.recent_bug_story
    topic: Walking through a recent bug
    difficulty: easy
    text: >-
      Tell me about a recent bug you tracked down. How did you get from first noticing it to knowing the root
      cause?
    expected_concepts:
      - how the bug was noticed and its impact
      - reproduction steps
      - hypotheses considered and how they were tested
      - the evidence that confirmed the cause
      - the fix and how it was verified
    rubric:
      excellent: Gives a concrete, ordered account with the hypotheses tried, the evidence that confirmed the cause and how the fix was verified, clearly describing their own part.
      good: Describes the bug and fix with some detail about the investigation.
      weak: Stays vague or describes only the fix without how the cause was found.
    followups:
      - What would you do differently if you hit the same bug again?
      - Which step took the longest, and why?
    common_errors:
      - Describing the fix without explaining how the cause was confirmed.

  - external_key: problem_solving.debugging_reasoning.page_repeats_last_item
    topic: Boundary errors
    difficulty: easy
    text: >-
      A paginated list shows the last item of each page again at the top of the next page. How would you
      reason about where the bug is?
    expected_concepts:
      - off-by-one in offset or page calculation
      - inclusive versus exclusive cursor comparisons
      - check client page math and server query separately
      - trace the first two pages by hand with concrete numbers
      - unstable sort order as an alternative cause
    rubric:
      excellent: Hand-traces page boundaries with concrete numbers, checks both client and server calculations and distinguishes an off-by-one from an inclusive cursor or unstable ordering.
      good: Suspects an off-by-one in the offset and checks the calculation.
      weak: Removes duplicates on the client side.
    followups:
      - How would a cursor-based approach avoid this?
      - Items sometimes go missing too. What else could be wrong?
    common_errors:
      - Fixing the symptom in the UI while the API stays wrong.

  - external_key: problem_solving.debugging_reasoning.apostrophe_breaks_save
    topic: Input-specific failures
    difficulty: easy
    text: >-
      The app fails to save whenever a user types a name with an apostrophe in it. How would you find where
      in the stack the input is being mishandled?
    expected_concepts:
      - follow the value through each layer (UI, request, server, database)
      - check the payload at each boundary
      - string-built queries or missing escaping
      - security implications such as injection
      - test with a set of special characters
    rubric:
      excellent: Traces the value layer by layer to find where it breaks, recognises the security risk of unescaped input such as injection and fixes it properly with parameterised handling and tests.
      good: Suspects escaping or query building and finds the layer.
      weak: Strips apostrophes from user input.
    followups:
      - Why is this a security concern as well as a bug?
      - What other inputs would you test once this is fixed?
    common_errors:
      - Rejecting valid input instead of handling it correctly.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.debugging_reasoning.restore_service_keep_evidence
    topic: Mitigating while preserving evidence
    difficulty: medium
    text: >-
      A bug in production is affecting users right now, and you don't know the cause yet. How do you balance
      restoring service with keeping the evidence you need to diagnose it later?
    expected_concepts:
      - mitigate first when impact is high (rollback, flag off, failover)
      - capture evidence quickly before mitigating (logs, dumps, metrics, examples)
      - keep one affected instance aside if possible
      - record a timeline as you go
      - continue diagnosis after recovery
    rubric:
      excellent: Prioritises user impact, captures key evidence in the minutes before mitigation, isolates an affected instance when possible and keeps a timeline for the later investigation.
      good: Rolls back first and saves logs for later.
      weak: Investigates at length while users are affected, or restarts everything and loses all evidence.
    followups:
      - What evidence disappears when you restart a process?
      - When would you choose not to roll back?
    common_errors:
      - Restarting everything and losing in-memory state before capturing it.

  - external_key: problem_solving.debugging_reasoning.when_to_change_approach
    topic: Timeboxing an investigation
    difficulty: medium
    text: >-
      You've spent a full day chasing a bug with no real progress. How do you decide whether to keep going,
      change approach, or bring someone else in?
    expected_concepts:
      - assess impact and urgency of the bug
      - review what has been learned and ruled out
      - switch technique (bisect, smaller reproduction, more instrumentation)
      - bring in someone with relevant context
      - communicate status and expectations
    rubric:
      excellent: Weighs impact against time spent, reviews progress in terms of hypotheses eliminated, switches to a different technique and brings in the right expertise with a clear summary.
      good: Recognises when to ask for help and suggests trying a different approach.
      weak: Keeps going the same way indefinitely or gives up without escalating.
    followups:
      - How do you explain the delay to your manager or stakeholders?
      - Tell me about a time a fresh pair of eyes solved something for you.
    common_errors:
      - Continuing with an approach that has stopped producing new information.

  - external_key: problem_solving.debugging_reasoning.diff_good_and_bad_env
    topic: Comparing working and failing setups
    difficulty: medium
    text: >-
      You have one environment where a feature works and another where it fails. How do you systematically
      compare them to find the difference that matters?
    expected_concepts:
      - enumerate dimensions (code version, config, data, dependencies, infrastructure, time)
      - capture and diff each dimension
      - make one environment more like the other step by step
      - binary search over the differences
      - stop when flipping one difference flips the behaviour
    rubric:
      excellent: Enumerates every dimension of difference, diffs them concretely and converges by flipping differences one at a time or in halves until the behaviour flips.
      good: Compares config and versions and tries aligning them.
      weak: Rebuilds the failing environment from scratch without learning the cause.
    followups:
      - There are hundreds of differences. How do you prioritise?
      - How would you prevent the environments drifting apart again?
    common_errors:
      - Changing several differences at once and losing track of which mattered.

  - external_key: problem_solving.debugging_reasoning.wrong_assumption_story
    topic: Hidden assumptions
    difficulty: medium
    text: >-
      Tell me about a time an assumption you were sure of turned out to be the cause of a bug. How did you
      finally discover it?
    expected_concepts:
      - the specific assumption and why it seemed safe
      - the evidence that contradicted it
      - how they verified rather than trusted it
      - what changed in their practice afterwards
    rubric:
      excellent: Gives a specific example, explains why the assumption looked safe, the evidence that exposed it and a lasting change in how they verify assumptions.
      good: Describes a real example and how the assumption was found.
      weak: Can't give an example or describes someone else's mistake.
    followups:
      - How do you now spot assumptions worth checking?
      - What did that bug cost before it was found?
    common_errors:
      - Describing the bug but not how the assumption was uncovered.

  - external_key: problem_solving.debugging_reasoning.library_bug_or_ours
    topic: Proving a bug is in a library
    difficulty: medium
    text: >-
      You suspect a bug is in an open-source library rather than your own code. How do you prove that
      before raising it with the maintainers?
    expected_concepts:
      - build a minimal reproduction outside your codebase
      - check your usage against documentation
      - search existing issues and changelogs
      - test other library versions
      - write a clear issue with the reproduction
    rubric:
      excellent: Rules out misuse first, reproduces the problem in a minimal standalone project, checks existing issues and versions and reports with a clear reproduction while working around it locally.
      good: Creates a small reproduction and searches the issue tracker.
      weak: Files an issue with only their app's stack trace, or patches the library silently.
    followups:
      - The maintainers don't respond. What do you do?
      - When would you fork or patch the library?
    common_errors:
      - Assuming the library is wrong before checking how you call it.

  - external_key: problem_solving.debugging_reasoning.emails_stop_silently
    topic: Silent failures
    difficulty: medium
    text: >-
      A background task is meant to send confirmation emails, but they stopped going out and nothing appears
      in the error logs. How would you find out where it's failing?
    expected_concepts:
      - check each stage (task triggered, queued, picked up, sent, delivered)
      - swallowed exceptions or errors logged at the wrong level
      - queue backlog or stopped workers
      - email provider status, quotas or rejections
      - add metrics or alerts for each stage
    rubric:
      excellent: Walks the pipeline stage by stage to find where things stop, considers swallowed errors, stuck workers and provider-side rejections and adds monitoring so silence can't hide a failure again.
      good: Checks the queue, the worker and the email provider.
      weak: Restarts the worker and hopes it resumes.
    followups:
      - How would you alert on something that stops happening rather than on an error?
      - The provider says it accepted the emails. What next?
    common_errors:
      - Treating no errors in logs as evidence that nothing failed.

  - external_key: problem_solving.debugging_reasoning.suspicious_retry_change
    topic: Reasoning about code in review
    difficulty: medium
    text: >-
      During code review, a change to some retry logic looks suspicious to you, but all the tests pass. How
      would you reason about whether there's a real bug, and how would you show it?
    expected_concepts:
      - identify the inputs or conditions the tests don't cover
      - trace the code by hand for failure cases (timeouts, partial success, max attempts)
      - non-idempotent operations being retried
      - write a test for the suspected case
      - discuss with the author using a concrete example
    rubric:
      excellent: Pinpoints conditions the tests skip, traces the logic for failure paths such as partial success and attempt limits and proves the concern with a concrete test or example shared constructively.
      good: Traces a failure case by hand and suggests an extra test.
      weak: Approves because tests pass, or blocks without a concrete reason.
    followups:
      - What makes retries risky for some operations?
      - How do you raise a concern you can't fully prove yet?
    common_errors:
      - Treating passing tests as proof the logic is correct.

  - external_key: problem_solving.debugging_reasoning.refactor_changed_behaviour
    topic: Regressions from refactoring
    difficulty: medium
    text: >-
      A refactor that was supposed to change no behaviour has caused a few customers to see wrong results.
      How would you find exactly which behaviour changed?
    expected_concepts:
      - run old and new code side by side on the same inputs
      - focus on affected customers' inputs for differences
      - edge cases such as nulls, ordering, defaults and error handling
      - characterisation tests to lock behaviour
      - split the refactor to isolate the change
    rubric:
      excellent: Compares old and new implementations on identical inputs, uses affected customers' data to find the diverging case and adds characterisation tests to protect behaviour in future refactors.
      good: Diffs the refactor and checks edge cases like nulls and ordering.
      weak: Reverts the refactor without finding the change.
    followups:
      - How would you get confidence before a refactor ships next time?
      - Which subtle behaviours do refactors most often change?
    common_errors:
      - Reviewing the diff only for obvious logic changes and missing implicit ones like ordering.

  - external_key: problem_solving.debugging_reasoning.amounts_times_thousand
    topic: User-setting-dependent bugs
    difficulty: medium
    text: >-
      Some users report that amounts they type are saved a thousand times too large, while it works fine for
      everyone on the team. How would you work out what's different for those users?
    expected_concepts:
      - collect settings from affected users (locale, keyboard, device)
      - decimal and thousands separators differing by locale
      - parsing on the client versus the server
      - reproduce by switching locale
      - parse locale-aware or send normalised numbers
    rubric:
      excellent: Gathers what affected users share, identifies locale-specific number formatting as a strong candidate, reproduces by switching settings and fixes parsing at the right layer.
      good: Suspects locale or number formatting and reproduces it.
      weak: Adds validation that rejects large amounts.
    followups:
      - Where should number parsing happen, client or server?
      - How would you test across many locales?
    common_errors:
      - Testing only with the team's own regional settings.

  - external_key: problem_solving.debugging_reasoning.success_only_on_retry
    topic: Retries hiding a bug
    difficulty: medium
    text: >-
      Your error rate looks fine, but you discover that a call to a dependency usually only succeeds on the
      second or third retry. How would you dig into why the first attempt fails?
    expected_concepts:
      - log or measure first-attempt failures and their errors
      - stale pooled connections, expired tokens or cold caches
      - timeouts set too short
      - correlate with time since last use or with specific hosts
      - fix the cause and keep retries as a safety net
    rubric:
      excellent: Makes first-attempt failures visible, generates causes that explain why a retry succeeds (stale connections, expired credentials, short timeouts) and tests them through correlation.
      good: Records the first-attempt errors and suspects connection or timeout problems.
      weak: Increases the retry count.
    followups:
      - Why does this matter if users never see an error?
      - What does a failure only after idle periods suggest?
    common_errors:
      - Treating retries as a fix rather than a mask.

  - external_key: problem_solving.debugging_reasoning.trigger_versus_root_cause
    topic: Going beyond the immediate trigger
    difficulty: medium
    text: >-
      After fixing a production bug, how do you decide you've reached the real root cause rather than just
      the nearest trigger? Use a real example if you can.
    expected_concepts:
      - keep asking why the trigger was possible
      - look at why tests, reviews or monitoring didn't catch it
      - distinguish contributing factors from the trigger
      - know where to stop (actionable, within control)
      - follow-up actions that prevent the class of bug
    rubric:
      excellent: Repeatedly asks why the trigger was possible, includes the gaps in tests and monitoring, knows when the chain is actionable enough to stop and gives an example with preventive follow-ups.
      good: Goes one or two levels beyond the trigger and mentions preventing recurrence.
      weak: Stops at the line of code that was changed.
    followups:
      - How do you avoid turning root cause analysis into blame?
      - Which follow-up from that example actually got done?
    common_errors:
      - Ending the analysis at human error without asking why it was possible.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.debugging_reasoning.reconstruct_from_logs
    topic: Reconstructing events from logs
    difficulty: hard
    text: >-
      All you have is a set of production logs from the moment a bug happened. How do you reconstruct what
      the system was doing well enough to reproduce it?
    expected_concepts:
      - build a timeline across services with correlation IDs
      - account for clock differences and log ordering
      - infer state and inputs at each step
      - identify what the logs don't show and fill gaps with code reading
      - replay the inferred sequence in a test environment
    rubric:
      excellent: Builds a cross-service timeline, handles clock and ordering caveats, infers inputs and state from the logs and code, and turns that into a replayable sequence while noting the gaps.
      good: Builds a timeline from the logs and tries to recreate the steps.
      weak: Reads the error line and guesses.
    followups:
      - Two services' timestamps disagree by a second. How do you handle that?
      - What would you add to the logs so this is easier next time?
    common_errors:
      - Trusting timestamps from different machines to give the true order.

  - external_key: problem_solving.debugging_reasoning.cross_team_finger_pointing
    topic: Driving a cross-team investigation
    difficulty: hard
    text: >-
      An intermittent failure spans your service and two other teams' services, and each team believes the
      problem is somewhere else. How would you drive the investigation to a clear answer?
    expected_concepts:
      - shared timeline and evidence everyone can see
      - agree on facts and on what would confirm each theory
      - boundary measurements between services
      - design joint experiments
      - keep the focus on the system, not on blame
    rubric:
      excellent: Moves the discussion from opinions to shared evidence, agrees on decisive tests for each theory, instruments the boundaries and runs joint experiments while keeping the tone blameless.
      good: Gathers data from all teams and proposes tests at the boundaries.
      weak: Argues their own service is fine or waits for others to act.
    followups:
      - One team won't prioritise the investigation. What do you do?
      - How do you present evidence that another team's service is at fault?
    common_errors:
      - Defending their own service instead of testing it.

  - external_key: problem_solving.debugging_reasoning.only_at_production_load
    topic: Load-dependent bugs
    difficulty: hard
    text: >-
      A bug only appears at production traffic levels, and your staging environment can't generate that
      much load. How would you reproduce or isolate it?
    expected_concepts:
      - identify which resource or limit is under pressure (pools, locks, queues, rate limits)
      - shrink the system so a small load hits the same limit
      - replay or shadow production traffic
      - observe in production with targeted instrumentation or a canary
      - reason about which interleavings only happen under concurrency
    rubric:
      excellent: Reasons about what limit or interleaving load triggers, recreates it by shrinking resources rather than growing traffic and uses replay, shadowing or canaries for evidence.
      good: Suggests load testing or replaying traffic and adding instrumentation in production.
      weak: Says it can only be fixed by guessing in production.
    followups:
      - How would you shrink a connection pool or queue to recreate the pressure?
      - What are the risks of shadowing production traffic?
    common_errors:
      - Trying to match production volume instead of recreating the specific pressure.

  - external_key: problem_solving.debugging_reasoning.mixed_user_fields
    topic: Rare, serious data mix-ups
    difficulty: hard
    text: >-
      Once every few weeks, a single record gets saved with fields from two different users mixed together.
      How would you approach finding a bug that rare and that serious?
    expected_concepts:
      - treat it as a potential data exposure and contain it
      - shared mutable state across requests (singletons, thread-local reuse, caches)
      - concurrency on objects reused between requests
      - add detection that flags mixed records immediately with context
      - targeted concurrent tests on suspected code paths
    rubric:
      excellent: Treats it as a security and privacy incident first, hypothesises shared state between requests, adds immediate detection with rich context and builds concurrent tests to confirm the mechanism.
      good: Suspects shared state or concurrency and adds detection.
      weak: Fixes affected records by hand and waits for it to happen again.
    followups:
      - Who needs to know about this while you investigate?
      - How would object pooling or thread reuse lead to this?
    common_errors:
      - Treating it only as a data-quality issue rather than a potential exposure.

  - external_key: problem_solving.debugging_reasoning.blaming_compiler_or_runtime
    topic: Suspecting the platform itself
    difficulty: hard
    text: >-
      You're becoming convinced that a bug is caused by the language runtime or compiler rather than your
      own code. How would you build a case strong enough to be sure?
    expected_concepts:
      - be sceptical, since platform bugs are rare
      - reduce to a minimal standalone reproduction
      - vary versions, flags and optimisation levels
      - inspect generated output or runtime behaviour directly
      - check known issues and report with evidence
    rubric:
      excellent: Starts from scepticism, reduces the case to a minimal reproduction, shows the behaviour changes only with platform version or optimisation and checks known issues before reporting.
      good: Builds a small reproduction and tests other versions.
      weak: Blames the platform based on a hunch.
    followups:
      - What result would convince you it is your code after all?
      - How would you work around it while waiting for a fix?
    common_errors:
      - Jumping to platform blame before ruling out undefined or unspecified behaviour in their own code.

  - external_key: problem_solving.debugging_reasoning.hardest_bug_lessons
    topic: Reflection on a hard bug
    difficulty: hard
    text: >-
      Tell me about the hardest bug you've ever tracked down. What made it hard, and what did you change
      about how you debug afterwards?
    expected_concepts:
      - specific technical detail of the bug
      - why it was hard (rare, misleading symptoms, many layers)
      - techniques that cracked it
      - their personal contribution
      - lasting change in practice or tooling
    rubric:
      excellent: Gives a technically detailed account, explains precisely why it was hard, the technique that broke it open and a concrete, lasting change in their debugging practice or the team's tooling.
      good: Describes a difficult bug and how it was solved with reasonable detail.
      weak: Picks a simple bug or gives a vague account without lessons.
    followups:
      - Looking back, what evidence did you have early that you missed?
      - How did you share what you learned with the team?
    common_errors:
      - Telling the story without explaining what made it hard.

  - external_key: problem_solving.debugging_reasoning.long_running_silent_bug
    topic: Scoping a long-undetected bug
    difficulty: hard
    text: >-
      You discover a bug that has been quietly producing wrong results for months. How would you work out
      when it started and which data it affected?
    expected_concepts:
      - find the introducing change through history or bisecting
      - define a test that detects affected records
      - query historical data to scope the impact
      - consider downstream systems and reports that consumed the data
      - plan correction and communication
    rubric:
      excellent: Dates the bug from history and data, defines a precise detection rule to scope affected records, traces downstream consumers and plans correction and communication.
      good: Finds the introducing release and queries for affected data.
      weak: Fixes the code going forward and ignores historical data.
    followups:
      - The affected data was exported to customers. What then?
      - How would you detect this kind of silent error sooner?
    common_errors:
      - Forgetting systems downstream that already used the wrong values.
