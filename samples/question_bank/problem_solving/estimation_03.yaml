# Curated questions: structured estimation and back-of-the-envelope reasoning (part 3 of 4).
# Evaluation looks at the structure of the reasoning (assumptions, decomposition, arithmetic,
# sanity checks), not at landing on one "correct" number.
version: 1
defaults:
  role_tags: [general, backend, cloud, product_manager]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.estimation.export_feature_adoption
    competency_key: product_sense
    topic: Estimating adoption of a new feature
    difficulty: easy
    text: >-
      Your team is adding a spreadsheet export to a reporting product with about fifty thousand active users.
      How would you estimate how many people will actually use it in the first month?
    expected_concepts:
      - who has the underlying need, such as people who share reports
      - signals from existing behaviour like copy and paste or support requests
      - discovery rate depending on where the feature appears
      - adoption from comparable past features
      - a range rather than one number
    rubric:
      excellent: Starts from the segment with the need, uses existing behavioural signals and past feature adoption as anchors, adjusts for discoverability, and gives a range.
      good: Produces a reasoned estimate using a segment and an adoption rate.
      weak: Assumes most users will use it or guesses with no anchor.
    followups:
      - What would you instrument to check your estimate after launch?
    common_errors:
      - Equating feature requests with actual future usage.

  - external_key: problem_solving.estimation.support_agent_staffing
    competency_key: problem_solving
    topic: Staffing from volume and handle time
    difficulty: easy
    text: >-
      A support team receives about six thousand tickets a week, and each takes around twelve minutes to
      handle. How many agents would you need, and what would you add on top of the raw arithmetic?
    expected_concepts:
      - total handling hours per week
      - productive hours per agent after meetings and breaks
      - peaks within the week and coverage hours
      - reopened tickets and escalations
      - response time targets
    rubric:
      excellent: Computes about twelve hundred handling hours, divides by realistic productive hours per agent, and adjusts for peaks, coverage windows and reopened tickets.
      good: Gets the base agent count and adds some allowance for non-ticket time.
      weak: Assumes agents handle tickets forty hours a week with no adjustments.
    followups:
      - How would a self-service help centre change the number?
    common_errors:
      - Using full working hours as productive ticket time.

  - external_key: problem_solving.estimation.food_delivery_peak_factor
    competency_key: problem_solving
    topic: Deriving peak load from a daily total
    difficulty: easy
    text: >-
      A food delivery app processes about four hundred thousand orders a day in one city. How would you estimate
      the order rate at the busiest minute, given how people actually eat?
    expected_concepts:
      - lunch and dinner peaks concentrating orders
      - share of daily orders in the peak hours
      - average rate within the peak hour
      - minute-level spikes above the hourly average
      - weekends and weather as extra spikes
    rubric:
      excellent: Allocates daily orders to meal peaks, computes the peak-hour rate, adds a spike factor for the busiest minutes, and mentions other drivers such as weather or promotions.
      good: Uses meal peaks to get a rate higher than the simple average.
      weak: Divides the daily total evenly across twenty-four hours.
    followups:
      - How would a rainy Friday change your numbers?
    common_errors:
      - Ignoring that traffic clusters around mealtimes.

  - external_key: problem_solving.estimation.invoice_pdf_storage
    competency_key: problem_solving
    topic: Document storage for a business application
    difficulty: easy
    text: >-
      An accounting product generates a PDF for every invoice its customers send, roughly a million invoices a
      month, and they must be kept for seven years. Estimate the storage and suggest how to keep it cheap.
    expected_concepts:
      - average PDF size
      - monthly and seven-year totals
      - regenerating on demand versus storing
      - colder storage tiers for older invoices
      - legal retention requirements constraining choices
    rubric:
      excellent: Sizes PDFs, computes monthly and total storage, and compares storing with regenerating while noting that legal retention may require the original document and favour cold tiers.
      good: Produces a seven-year estimate and suggests a cheaper storage tier.
      weak: Gives a total without stated file size or retention reasoning.
    followups:
      - Why might regenerating the PDF later be a problem for an accounting record?
    common_errors:
      - Assuming documents can always be regenerated identically.

  - external_key: problem_solving.estimation.live_scores_websocket_servers
    competency_key: problem_solving
    topic: Concurrent connections and server count
    difficulty: easy
    text: >-
      A sports app pushes live scores over persistent connections, and during a big final about a million fans
      have the app open. How would you estimate the number of connection servers needed?
    expected_concepts:
      - concurrent connections at peak
      - connections per server limited by memory and file descriptors
      - message fan-out rate per score update
      - headroom for reconnect storms
      - spreading across zones
    rubric:
      excellent: Uses a realistic connections-per-server figure, checks the fan-out rate when a goal is scored, and adds headroom for reconnects and zone failure.
      good: Divides connections by a per-server capacity with some headroom.
      weak: Treats connections like normal requests per second.
    followups:
      - What happens when a server dies and its connections all reconnect at once?
    common_errors:
      - Ignoring the burst of messages when a score changes.

  - external_key: problem_solving.estimation.review_backlog_clearance
    competency_key: project_management
    topic: Throughput and backlog clearance time
    difficulty: easy
    text: >-
      Your team has a hundred and fifty open pull requests waiting for review, and the team merges about twenty
      a week while opening about fifteen new ones. How long until the backlog is under control, and what
      would you change?
    expected_concepts:
      - net reduction per week
      - weeks to clear at the current rate
      - stale pull requests that can be closed
      - review capacity as the bottleneck
      - limits on work in progress
    rubric:
      excellent: Computes a net reduction of about five per week and roughly thirty weeks, recognises that as unacceptable, and proposes closing stale work, adding review time and limiting new work.
      good: Computes the clearance time correctly and suggests a reasonable change.
      weak: Ignores newly opened pull requests in the calculation.
    followups:
      - How would you decide which of the hundred and fifty to close without review?
    common_errors:
      - Forgetting that new pull requests keep arriving.

  - external_key: problem_solving.estimation.office_video_call_bandwidth
    competency_key: problem_solving
    topic: Office internet bandwidth sizing
    difficulty: easy
    text: >-
      An office of three hundred people complains that video calls break up in the afternoon. How would you
      estimate the internet bandwidth the office actually needs?
    expected_concepts:
      - share of people on calls at the same time
      - bandwidth per call upstream and downstream
      - other traffic such as uploads and updates
      - headroom above peak demand
      - upload capacity often being the limit
    rubric:
      excellent: Estimates concurrent callers and per-call bitrate in both directions, adds other traffic and headroom, and points out that upload capacity is often the bottleneck.
      good: Produces a bandwidth figure from concurrent calls and per-call rates.
      weak: Multiplies all three hundred people by a guessed number.
    followups:
      - How would you confirm the link is the problem and not the Wi-Fi?
    common_errors:
      - Sizing only download bandwidth.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.estimation.autocomplete_keystroke_traffic
    competency_key: problem_solving
    topic: Traffic from per-keystroke features
    difficulty: medium
    text: >-
      A shopping site with ten million searches a day wants search suggestions as people type. Estimate the
      extra request load and how you'd keep it manageable.
    expected_concepts:
      - characters typed per search
      - request multiplier per search
      - debouncing and minimum prefix length
      - caching popular prefixes at the edge
      - latency needed for suggestions to feel useful
    rubric:
      excellent: Multiplies searches by keystrokes to show the load increase, then quantifies how debouncing, minimum prefix length and prefix caching bring it back down.
      good: Estimates the multiplied load and suggests debouncing or caching.
      weak: Treats suggestion requests as equal to searches.
    followups:
      - What share of requests would you expect a prefix cache to absorb?
    common_errors:
      - Forgetting that one search produces many suggestion requests.

  - external_key: problem_solving.estimation.fine_tuning_compute_cost
    competency_key: problem_solving
    topic: Model training compute and cost
    difficulty: medium
    text: >-
      Your team wants to fine-tune a mid-sized language model on about two hundred thousand support
      conversations. How would you estimate the GPU hours and cost before asking for budget?
    expected_concepts:
      - tokens in the training data and number of epochs
      - throughput in tokens per second per GPU
      - full fine-tuning versus parameter-efficient methods
      - experiments and failed runs adding to the total
      - hourly GPU price
    rubric:
      excellent: Counts training tokens and epochs, uses a measured or benchmarked throughput, compares full and parameter-efficient approaches, and multiplies in several experimental runs.
      good: Produces GPU hours from tokens and throughput with a price.
      weak: Guesses a cost without relating it to data size or throughput.
    followups:
      - How many runs would you budget for, and why more than one?
    common_errors:
      - Budgeting only for a single successful run.

  - external_key: problem_solving.estimation.backup_dedup_savings
    competency_key: problem_solving
    topic: Storage savings from deduplication
    difficulty: medium
    text: >-
      You back up a thousand virtual machines nightly and keep thirty days of backups. How would you estimate the
      storage needed with and without deduplication and incremental backups?
    expected_concepts:
      - full size per machine and total
      - daily change rate for incrementals
      - duplicate data across similar machines
      - retention multiplying copies
      - compression on top of deduplication
    rubric:
      excellent: Compares thirty full copies with one full plus daily changes, adds cross-machine deduplication for shared images, applies compression, and shows the large difference between approaches.
      good: Estimates full versus incremental storage with a change rate.
      weak: Multiplies machines by thirty full copies and stops.
    followups:
      - How long would a restore take if it has to reassemble many increments?
    common_errors:
      - Assuming daily change rates are as high as the full disk size.

  - external_key: problem_solving.estimation.cdn_hit_ratio_origin_load
    competency_key: problem_solving
    topic: Origin load as a function of cache hit ratio
    difficulty: medium
    text: >-
      A CDN serves a hundred thousand requests per second for your site with a ninety-five percent hit ratio.
      Someone proposes improving it to ninety-nine percent. Estimate what that does to your origin servers.
    expected_concepts:
      - misses reaching the origin at each hit ratio
      - five thousand versus one thousand requests per second
      - fivefold reduction in origin load
      - cost of the misses in bandwidth and compute
      - how to raise the hit ratio such as longer TTLs or shielding
    rubric:
      excellent: Shows the origin load falls from five thousand to one thousand per second, explains why small hit-ratio gains matter so much, and suggests concrete ways to get there.
      good: Computes the miss rates correctly and draws the right conclusion.
      weak: Thinks a four-point gain only reduces origin load by four percent.
    followups:
      - Which content would you expect to cause most of the misses?
    common_errors:
      - Reasoning about hits rather than misses.

  - external_key: problem_solving.estimation.disk_failure_rate_fleet
    competency_key: problem_solving
    topic: Expected hardware failures in a fleet
    difficulty: medium
    text: >-
      Your storage fleet has about ten thousand disks, and vendors quote an annual failure rate of around two
      percent. How many failures should you expect each week, and how does that shape the operations plan?
    expected_concepts:
      - expected failures per year and per week
      - variance and clustering of failures
      - replacement process and spare stock
      - rebuild time and exposure to a second failure
      - real-world rates differing from vendor figures
    rubric:
      excellent: Computes about two hundred failures a year or four a week, plans spares and replacement workflow, and discusses rebuild windows and correlated failures from batches or age of drives.
      good: Gets the weekly figure right and connects it to spare parts.
      weak: Cannot convert an annual rate into a weekly expectation.
    followups:
      - Why might failures cluster rather than spread evenly?
    common_errors:
      - Treating a failure rate as rare enough to ignore at this scale.

  - external_key: problem_solving.estimation.fanout_tail_latency_odds
    competency_key: distributed_systems
    topic: Tail latency under fan-out
    difficulty: medium
    text: >-
      A search request fans out to a hundred backend shards and waits for all of them. Each shard is slow one
      time in a hundred. Roughly how often will the whole request be slow, and what would you do about it?
    expected_concepts:
      - probability that at least one shard is slow
      - roughly 63 percent with 100 shards at 1 percent
      - shard tail latency becoming the common case
      - hedged or backup requests
      - returning partial results within a deadline
    rubric:
      excellent: Works out that about two thirds of requests hit a slow shard, explains why fan-out turns rare tails into normal latency, and proposes hedging, partial results or reducing fan-out.
      good: Recognises most requests will be slow and suggests one mitigation.
      weak: Assumes the overall request is slow only one time in a hundred.
    followups:
      - How would hedged requests affect the load on the shards?
    common_errors:
      - Ignoring that probabilities compound across shards.

  - external_key: problem_solving.estimation.serverless_break_even
    competency_key: cloud_cost_optimization
    topic: Break-even between serverless and always-on
    difficulty: medium
    text: >-
      A small internal API gets about two million requests a month today, but a new integration could raise that
      a hundredfold. How would you estimate when a containerised service becomes cheaper than serverless functions?
    expected_concepts:
      - per-request and per-duration pricing for functions
      - fixed monthly cost of always-on containers
      - memory size and execution time per request
      - break-even request volume
      - operational effort as a hidden cost
    rubric:
      excellent: Builds cost curves for both from request volume, duration and memory, finds the break-even point, places today and the hundredfold scenario on it, and weighs operational effort.
      good: Compares the two options at both volumes with stated prices.
      weak: Declares one option cheaper without any calculation.
    followups:
      - How would very bursty traffic change the comparison?
    common_errors:
      - Ignoring idle time costs of always-on services.

  - external_key: problem_solving.estimation.warehouse_dashboard_scan_cost
    competency_key: problem_solving
    topic: Query cost in a pay-per-scan warehouse
    difficulty: medium
    text: >-
      Your data warehouse charges by the amount of data each query scans, and a popular dashboard refreshes every
      five minutes for two hundred viewers. How would you estimate what that dashboard costs per month?
    expected_concepts:
      - data scanned per query including all panels
      - refreshes per month and whether viewers share results
      - price per terabyte scanned
      - partitioning or clustering to reduce scans
      - pre-aggregated tables or caching
    rubric:
      excellent: Multiplies panels, data scanned and refresh frequency, checks whether results are cached across viewers, prices it, and shows how partition pruning or aggregates cut the cost.
      good: Produces a monthly cost from scan size, refreshes and price.
      weak: Does not connect cost to the amount of data scanned.
    followups:
      - Which single change would you expect to cut the cost the most?
    common_errors:
      - Assuming each viewer triggers separate queries when results are cached, or the reverse.

  - external_key: problem_solving.estimation.push_notification_burst
    competency_key: problem_solving
    topic: Notification fan-out rate
    difficulty: medium
    text: >-
      Product wants a breaking news alert to reach ten million phones within five minutes. Estimate the send rate
      and the follow-on load when people open the app.
    expected_concepts:
      - required sends per second
      - rate limits of the push providers
      - share of recipients who tap and open the app
      - spike of app opens hitting the backend
      - staggering delivery to smooth the spike
    rubric:
      excellent: Computes about thirty-three thousand sends per second, checks provider limits, estimates the open rate and the resulting backend spike, and suggests staggering or pre-warming caches.
      good: Gets the send rate and recognises the follow-on spike.
      weak: Only considers the sending side.
    followups:
      - How would you prepare the backend for the wave of opens?
    common_errors:
      - Ignoring the traffic caused by people opening the notification.

  - external_key: problem_solving.estimation.usage_pricing_revenue_shift
    competency_key: product_sense
    topic: Revenue impact of a pricing model change
    difficulty: medium
    text: >-
      Your product charges a flat fee per seat, and leadership is considering usage-based pricing instead. How
      would you estimate what happens to revenue before making the switch?
    expected_concepts:
      - current usage distribution across customers
      - modelling each customer's bill under the new scheme
      - customers who pay more versus less
      - churn risk for those facing increases
      - effects on new customer acquisition
    rubric:
      excellent: Re-prices existing customers using actual usage data, shows winners and losers, estimates churn among those facing increases, and treats acquisition effects as a separate, uncertain input.
      good: Re-prices customers on current usage to estimate the revenue change.
      weak: Assumes revenue rises without looking at usage data.
    followups:
      - Which customers would you talk to first, and why?
    common_errors:
      - Ignoring how customers change behaviour when pricing changes.

  - external_key: problem_solving.estimation.roadmap_sprint_forecast
    competency_key: project_management
    topic: Forecasting a roadmap from team throughput
    difficulty: medium
    text: >-
      You have a roadmap of twelve epics and a team that has finished between eight and fourteen stories per
      sprint over the last six sprints. How would you forecast when the roadmap will be done?
    expected_concepts:
      - breaking epics into stories or using historical epic sizes
      - throughput range rather than one average
      - forecast ranges or probabilistic forecasting
      - scope growth during delivery
      - unplanned work taking capacity
    rubric:
      excellent: Uses the historical throughput range to forecast a date range, accounts for scope growth and unplanned work, and explains how confidence levels could be communicated.
      good: Divides estimated stories by average throughput and adds a buffer.
      weak: Gives a single date from the best sprint.
    followups:
      - Epics usually grow by a third once started. How do you account for that?
    common_errors:
      - Forecasting from the best sprint instead of the range.

  - external_key: problem_solving.estimation.replicated_db_disk_footprint
    competency_key: databases
    topic: Real disk footprint of a database
    difficulty: medium
    text: >-
      A team says their data is two terabytes, so they've ordered two terabytes of disk per database node. What
      else would you include in the estimate of the space they really need?
    expected_concepts:
      - indexes on top of table data
      - write-ahead or transaction logs
      - free space for compaction, vacuum or rebuilds
      - replicas and backups on separate storage
      - growth until the next expansion
    rubric:
      excellent: Adds indexes, logs, maintenance headroom and growth to reach a realistic multiple of the raw size, and separates per-node needs from replicas and backups.
      good: Names indexes, logs and growth as additions.
      weak: Accepts the two terabytes as sufficient.
    followups:
      - Which maintenance operation needs the most free space temporarily?
    common_errors:
      - Forgetting temporary space for rebuilds or compaction.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.estimation.group_chat_delivery_fanout
    competency_key: distributed_systems
    topic: Delivery fan-out in large groups
    difficulty: hard
    text: >-
      A messaging app supports groups of up to a thousand members, and a few very active groups post constantly.
      Estimate the delivery load these groups create and how it changes the architecture.
    expected_concepts:
      - messages per second in large groups
      - deliveries equal messages times members
      - online versus offline members
      - fan-out on write versus fan-out on read
      - hot groups concentrating load on shards
    rubric:
      excellent: Shows how a modest message rate in big groups becomes a very large delivery rate, splits online and offline delivery, and argues for read-time fan-out or special handling for hot groups.
      good: Computes the delivery multiplication and suggests a different approach for large groups.
      weak: Counts messages but not deliveries.
    followups:
      - How would you handle a group that suddenly becomes a hundred times more active?
    common_errors:
      - Treating delivery cost as constant regardless of group size.

  - external_key: problem_solving.estimation.agent_task_unit_cost
    competency_key: problem_solving
    topic: Cost of multi-step AI agent tasks
    difficulty: hard
    text: >-
      Your team is building an AI agent that completes customer requests using several tool calls and model
      steps. Estimate its cost per completed task and what happens at a hundred thousand tasks a day.
    expected_concepts:
      - model calls per task and context growth each step
      - input tokens dominated by accumulated history
      - failed or retried tasks adding cost
      - cost per successful task rather than per attempt
      - caching, summarising context or routing to smaller models
    rubric:
      excellent: Models context growing each step, computes cost per attempt and per successful task, scales to daily volume, and names the largest levers with rough savings.
      good: Multiplies steps by tokens and price to get a cost per task and daily total.
      weak: Treats the agent as one model call.
    followups:
      - How would you decide when the agent should hand over to a human?
    common_errors:
      - Ignoring that context length grows with every step.

  - external_key: problem_solving.estimation.on_prem_vs_cloud_tco
    competency_key: cloud_cost_optimization
    topic: Three-year total cost comparison
    difficulty: hard
    text: >-
      A steady analytics workload costs about a hundred and twenty thousand dollars a month in the cloud, and
      someone proposes buying hardware instead. How would you estimate the three-year cost of both options?
    expected_concepts:
      - hardware purchase and depreciation
      - data centre space, power and network
      - people to operate the hardware
      - committed-use discounts as a cloud alternative
      - flexibility and migration costs
    rubric:
      excellent: Builds a three-year comparison including hardware, facilities, staff and migration, compares against discounted cloud pricing rather than list price, and weighs flexibility.
      good: Compares hardware and cloud costs including operations staff.
      weak: Compares hardware price against the cloud bill and stops.
    followups:
      - What would make the cloud win even if the arithmetic favours hardware?
    common_errors:
      - Forgetting operational staffing in the on-premises case.

  - external_key: problem_solving.estimation.ad_click_realtime_aggregation
    competency_key: problem_solving
    topic: Memory for real-time aggregation
    difficulty: hard
    text: >-
      An ad platform receives about three billion click and impression events a day and must show advertisers
      per-campaign counts updated every minute. Estimate the event rate and the memory for the live aggregation.
    expected_concepts:
      - average and peak events per second
      - number of active campaigns and dimensions
      - state per key per time window
      - window length and late-arriving events
      - exact versus approximate counting
    rubric:
      excellent: Converts daily volume into peak rate, sizes aggregation state from active keys, dimensions and windows, accounts for late events, and identifies where approximate counting saves memory.
      good: Computes event rate and estimates state from campaigns and windows.
      weak: Proposes keeping all raw events in memory.
    followups:
      - Which dimensions would explode the key count?
    common_errors:
      - Multiplying memory by every dimension combination without checking which ones occur.

  - external_key: problem_solving.estimation.monolith_decomposition_program
    competency_key: project_management
    topic: Estimating a multi-quarter program
    difficulty: hard
    text: >-
      Leadership asks how long it would take to split a large monolith into services, with four teams available.
      How would you produce an estimate for something this big and uncertain?
    expected_concepts:
      - inventory of modules and their coupling
      - extracting one module first to calibrate
      - sequencing and dependencies between extractions
      - capacity reserved for feature work and support
      - milestones that deliver value and allow re-estimation
    rubric:
      excellent: Inventories the system, calibrates with a first extraction, sequences by dependencies and value, accounts for teams' other commitments, and offers milestone-based estimates that are revisited.
      good: Breaks the work into modules and estimates with contingency.
      weak: Gives a duration with no breakdown or calibration.
    followups:
      - Halfway through, leadership wants half the teams back on features. How does the estimate change?
    common_errors:
      - Assuming teams can spend all their time on the migration.

  - external_key: problem_solving.estimation.region_loss_headroom
    competency_key: system_design
    topic: Capacity to survive losing a region
    difficulty: hard
    text: >-
      Your service runs active-active in three regions and peaks at sixty thousand requests per second overall.
      How much capacity does each region need so that losing any one region doesn't cause an outage?
    expected_concepts:
      - per-region share under normal operation
      - redistributing load across two remaining regions
      - each region sized for half the peak
      - utilisation targets after failover
      - uneven geographic traffic and data dependencies
    rubric:
      excellent: Shows each region must handle about thirty thousand per second rather than twenty thousand, applies a utilisation ceiling for the failover state, and accounts for uneven regional traffic and shared dependencies.
      good: Computes the post-failover load per region correctly.
      weak: Sizes each region for a third of the peak.
    followups:
      - How would you verify the failover capacity without a real outage?
    common_errors:
      - Forgetting that databases and caches in the surviving regions also absorb extra load.
