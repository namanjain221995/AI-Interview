# Curated questions: problem solving — trade-offs and prioritisation under constraints (time, risk,
# quality, cost). Scenario questions spoken by the AI interviewer; evaluation is based only on the
# reasoning and the content of the answer.
version: 1
defaults:
  role_tags: [general, tech_lead, product_manager, project_manager]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.tradeoffs_prioritisation.question_during_focus_work
    competency_key: problem_solving
    topic: Helping a colleague versus finishing your work
    difficulty: easy
    text: >-
      You're close to finishing an important piece of work when a teammate asks a question that would take about
      thirty minutes to answer properly. How do you decide whether to stop and help now?
    expected_concepts:
      - whether the teammate is blocked
      - cost of breaking your own focus
      - the deadline on your own work
      - a quick pointer now and a fuller answer later
      - agreeing a specific time to help
    rubric:
      excellent: Checks whether the teammate is blocked and how urgent it is, weighs that against their own deadline and focus, and offers a quick unblock or a specific later time rather than a vague deferral.
      good: Considers both needs and responds with a reasonable choice.
      weak: Always drops everything, or ignores the request without checking its impact.
    followups:
      - What if this happens several times a day?
      - How would you make it less likely the same question comes up again?
    common_errors:
      - Not asking whether the teammate is actually blocked.
      - Promising to help later without saying when.

  - external_key: problem_solving.tradeoffs_prioritisation.time_box_an_investigation
    competency_key: problem_solving
    topic: Knowing when to stop investigating
    difficulty: easy
    text: >-
      You've spent most of a day trying to find the cause of a fairly small problem and still don't have an
      answer. How do you decide whether to keep going, ask for help, or set it aside?
    expected_concepts:
      - the impact of the problem compared with time spent
      - whether progress is being made
      - asking someone with more context
      - a workaround that removes the urgency
      - recording what has been learned so far
    rubric:
      excellent: Compares the problem's impact with the time invested, checks whether they are still making progress, asks for help early when stuck, considers a workaround and writes down what they found.
      good: Recognises when to stop or ask for help with reasons.
      weak: Keeps going indefinitely out of stubbornness or gives up without recording anything.
    followups:
      - How do you know you're still making progress?
      - What would you write down before setting it aside?
    common_errors:
      - Waiting too long before asking for help.
      - Losing the findings when setting the problem aside.

  - external_key: problem_solving.tradeoffs_prioritisation.away_for_a_week
    competency_key: project_management
    topic: Preparing work before being away
    difficulty: easy
    text: >-
      You'll be away for a week starting Monday, and you have three pieces of work in progress. How would you
      decide what to finish, what to hand over, and what to pause?
    expected_concepts:
      - deadlines falling during the absence
      - who is waiting on each piece of work
      - what can be handed over cleanly
      - clear handover notes and contacts
      - telling stakeholders about paused work
    rubric:
      excellent: Ranks the work by deadlines and who depends on it, finishes or hands over the time-critical items with clear notes, and tells stakeholders what is paused and when it resumes.
      good: Makes a sensible plan for each piece of work.
      weak: Leaves everything as it is or tries to finish everything in a rush.
    followups:
      - What makes a piece of work easy or hard to hand over?
      - Who would you tell, and what would you say?
    common_errors:
      - Handing over without notes.
      - Not warning stakeholders that work is paused.

  - external_key: problem_solving.tradeoffs_prioritisation.casual_request_from_leader
    competency_key: stakeholder_management
    topic: An unplanned suggestion from a senior leader
    difficulty: easy
    text: >-
      In a meeting, a senior leader casually suggests a small addition to your project that isn't in the plan.
      How would you decide what to do with it?
    expected_concepts:
      - clarifying whether it's a request or an idea
      - understanding the goal behind the suggestion
      - estimating effort and impact on the plan
      - making the trade-off visible
      - following up in writing
    rubric:
      excellent: Clarifies how serious the suggestion is and why it matters, sizes it, makes any trade-off with the plan explicit to the leader, and confirms the outcome in writing.
      good: Assesses the suggestion and discusses it with the leader.
      weak: Adds it silently because a senior person said it, or ignores it.
    followups:
      - How would you raise the trade-off without seeming to resist the leader?
      - What if the addition turns out to be bigger than it sounded?
    common_errors:
      - Treating every senior comment as a commitment.
      - Not telling anyone what was dropped to make room.

  - external_key: problem_solving.tradeoffs_prioritisation.paid_tool_saves_hours
    competency_key: problem_solving
    topic: Paying for a tool that saves time
    difficulty: easy
    text: >-
      Your team could pay for a tool that would save each person a couple of hours a week. How would you decide
      whether it's worth the cost?
    expected_concepts:
      - checking the time-saving claim
      - comparing cost with the value of time saved
      - adoption and learning effort
      - security, data and contract considerations
      - a trial period with a clear measure
    rubric:
      excellent: Validates the time saving, compares cost against the value of that time, accounts for adoption effort and data or contract concerns, and proposes a measured trial.
      good: Compares cost with expected savings.
      weak: Buys it based on a demo or rejects it on price alone.
    followups:
      - How would you measure whether it actually saved time?
      - What would make you cancel it after the trial?
    common_errors:
      - Taking the vendor's numbers at face value.
      - Forgetting the time it takes for people to adopt it.

  - external_key: problem_solving.tradeoffs_prioritisation.when_is_it_good_enough
    competency_key: problem_solving
    topic: Deciding when work is good enough
    difficulty: easy
    text: >-
      You're preparing material for a decision meeting and could spend another day refining it. How do you decide
      when it's good enough to send?
    expected_concepts:
      - what the audience needs to decide
      - whether further work would change the decision
      - getting early feedback from a reviewer
      - other work the extra day would displace
      - accuracy of key facts as the non-negotiable part
    rubric:
      excellent: Judges readiness by whether the material supports the decision and its key facts are right, gets quick feedback, and weighs the extra day against other work.
      good: Has reasonable criteria for when to stop refining.
      weak: Polishes indefinitely or sends something unchecked.
    followups:
      - What would you always double-check before sending?
      - Tell me about a time extra polish turned out not to matter.
    common_errors:
      - Polishing presentation while key facts remain unchecked.
      - Not asking anyone for feedback.

  - external_key: problem_solving.tradeoffs_prioritisation.overgrown_backlog
    competency_key: product_sense
    topic: Pruning an overgrown backlog
    difficulty: easy
    text: >-
      Your team's backlog has grown to several hundred items, many of them more than a year old. How would you
      decide what to keep?
    expected_concepts:
      - relevance to current goals
      - whether the problem still exists
      - closing stale items with a clear note
      - grouping duplicates into themes
      - a rule to keep the backlog small in future
    rubric:
      excellent: Reviews items against current goals, checks whether the problems still exist, merges duplicates, closes stale items with a note, and sets a rule to stop the backlog growing again.
      good: Removes outdated items and keeps the relevant ones.
      weak: Keeps everything just in case or deletes everything without review.
    followups:
      - What would you tell the people whose items you closed?
      - How would you stop the backlog from growing back?
    common_errors:
      - Keeping items because deleting them feels risky.
      - Closing items without informing requesters.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.tradeoffs_prioritisation.month_for_performance
    competency_key: problem_solving
    topic: Choosing where to focus performance work
    difficulty: medium
    text: >-
      Your application has a dozen areas that users describe as slow, and your team has one month to improve
      performance. How would you decide where to focus?
    expected_concepts:
      - measuring real user impact of each slow area
      - how often each area is used
      - effort and expected gain per fix
      - fixes that help many areas at once
      - setting targets and measuring before and after
    rubric:
      excellent: Measures each slow area's real impact and usage, looks for shared causes that fix several at once, ranks by gain per effort, and sets measurable targets with before-and-after checks.
      good: Prioritises by user impact and effort using some data.
      weak: Starts with whatever seems most technically interesting or relies on anecdotes.
    followups:
      - What would you measure first?
      - How would you know at the end of the month whether it worked?
    common_errors:
      - Optimising rarely used areas.
      - Not measuring before making changes.

  - external_key: problem_solving.tradeoffs_prioritisation.everything_fixed_but_estimate
    competency_key: project_management
    topic: Scope, date and team all fixed
    difficulty: medium
    text: >-
      A sponsor tells you the scope, the date and the team size are all fixed, but your estimate says the work
      doesn't fit. How would you handle that?
    expected_concepts:
      - quality as the hidden variable that gives way
      - testing the estimate's assumptions
      - prioritising scope within the fixed list
      - presenting options with their consequences
      - documenting the accepted risk
    rubric:
      excellent: Points out that quality or risk will absorb the gap if nothing else moves, validates the estimate, presents concrete options with consequences, and records whatever risk the sponsor accepts.
      good: Raises the gap and proposes options to the sponsor.
      weak: Accepts the plan silently or simply refuses.
    followups:
      - What if the sponsor still says nothing can move?
      - How would you make sure the risk is visible later?
    common_errors:
      - Quietly cutting testing to make it fit.
      - Presenting the problem without options.

  - external_key: problem_solving.tradeoffs_prioritisation.three_pilot_slots
    competency_key: product_sense
    topic: Choosing pilot customers
    difficulty: medium
    text: >-
      You have capacity to onboard only three pilot customers for a new product, and ten want to take part. How
      would you choose?
    expected_concepts:
      - what the pilot needs to learn
      - customers representing the target segment
      - willingness to give feedback and tolerate rough edges
      - commercial value and strategic importance
      - managing expectations for those not chosen
    rubric:
      excellent: Chooses based on what the pilot must learn and who represents the target market, weighs feedback commitment and commercial value, and handles the customers not chosen with care.
      good: Uses sensible criteria beyond who asked first.
      weak: Picks the biggest names or first to ask without considering learning goals.
    followups:
      - Would you include a customer you expect to be very difficult?
      - What would you offer the seven who weren't chosen?
    common_errors:
      - Choosing pilots that don't represent the real market.
      - Ignoring how much support each pilot will need.

  - external_key: problem_solving.tradeoffs_prioritisation.build_for_scale_or_simple
    competency_key: problem_solving
    topic: Building for scale versus keeping it simple
    difficulty: medium
    text: >-
      For a new product that may or may not find users, would you build it to handle large scale from day one, or
      keep it simple and change it later? How would you decide?
    expected_concepts:
      - uncertainty about demand
      - speed of learning versus cost of rework
      - decisions that are hard to change later
      - clear signals that would trigger investing in scale
      - avoiding choices that block later growth
    rubric:
      excellent: Favours simplicity while demand is uncertain, identifies the few decisions that are expensive to change and gets those right, and defines signals that would trigger scaling work.
      good: Weighs speed against rework with reasonable criteria.
      weak: Always over-engineers or ignores scale entirely.
    followups:
      - Which early choices would you still be careful about?
      - What signal would tell you it's time to invest in scale?
    common_errors:
      - Spending months on scale before anyone uses the product.
      - Making early choices that are very costly to undo.

  - external_key: problem_solving.tradeoffs_prioritisation.one_off_data_fix
    competency_key: problem_solving
    topic: One-off fix versus a proper fix
    difficulty: medium
    text: >-
      A customer escalation could be resolved today with a manual data correction, or properly with a code change
      that will take a week. How would you decide what to do?
    expected_concepts:
      - customer impact of waiting a week
      - risk of a manual change to production data
      - whether other customers are affected
      - doing both, the quick fix now and the proper fix later
      - review and audit of the manual change
    rubric:
      excellent: Weighs customer impact against the risk of a manual change, checks if others are affected, often combines a reviewed quick fix with a scheduled proper fix, and keeps an audit trail.
      good: Considers both options and their risks.
      weak: Makes an unreviewed manual change and moves on, or makes the customer wait without considering impact.
    followups:
      - What safeguards would you put around the manual change?
      - How do you make sure the proper fix doesn't get forgotten?
    common_errors:
      - Repeating the manual fix every time the issue recurs.
      - Changing production data without review.

  - external_key: problem_solving.tradeoffs_prioritisation.skip_the_review_process
    competency_key: problem_solving
    topic: Asking for a process exception
    difficulty: medium
    text: >-
      Your company's release review normally takes three days, and a fix that customers urgently need is ready now.
      How would you decide whether to ask for an exception?
    expected_concepts:
      - what the review protects against
      - risk profile of this specific change
      - customer cost of a three-day wait
      - faster alternative controls
      - following any defined emergency path
    rubric:
      excellent: Understands what the review protects against, assesses this change's risk, compares it with the customer cost of waiting, and uses or proposes a faster path with compensating controls.
      good: Weighs risk against urgency and seeks approval appropriately.
      weak: Bypasses the process without approval or follows it rigidly regardless of impact.
    followups:
      - What compensating controls could you offer?
      - What would you do if this kind of exception kept coming up?
    common_errors:
      - Skipping review without telling anyone.
      - Not considering what the process is there to catch.

  - external_key: problem_solving.tradeoffs_prioritisation.one_new_hire
    competency_key: project_management
    topic: Choosing which role to hire
    difficulty: medium
    text: >-
      You have budget for one new hire. Your team feels short on testing, design and engineering capacity. How
      would you decide which role to hire for?
    expected_concepts:
      - where the main bottleneck is
      - evidence from recent delivery
      - skills that could be borrowed or shared instead
      - impact on upcoming priorities
      - time for the new person to become productive
    rubric:
      excellent: Uses delivery evidence to find the real bottleneck, considers which gaps could be covered by sharing or contracting, and aligns the hire with upcoming priorities and ramp-up time.
      good: Identifies the main bottleneck and justifies the choice.
      weak: Hires whoever complains most or chooses by habit.
    followups:
      - How would you find the actual bottleneck?
      - How would you cover the other two gaps in the meantime?
    common_errors:
      - Choosing based on the loudest request.
      - Ignoring how long the new person needs to ramp up.

  - external_key: problem_solving.tradeoffs_prioritisation.do_it_or_delegate
    competency_key: leadership
    topic: Doing it yourself versus delegating
    difficulty: medium
    text: >-
      As a lead, you could do a critical task yourself and finish it quickly, or hand it to a less experienced
      teammate who would take longer but learn a lot. How do you decide?
    expected_concepts:
      - deadline and slack available
      - risk if the task goes wrong
      - development value for the teammate
      - support and checkpoints if delegated
      - the lead's own capacity and other priorities
    rubric:
      excellent: Weighs the deadline and risk against the teammate's growth, delegates with clear support and checkpoints when possible, and explains when they would keep it themselves.
      good: Considers both delivery and development needs.
      weak: Always does it themselves or delegates without any support.
    followups:
      - What checkpoints would you set if you delegated it?
      - Tell me about a time you delegated something and it went wrong.
    common_errors:
      - Delegating and then taking it back at the first problem.
      - Never letting others take on critical work.

  - external_key: problem_solving.tradeoffs_prioritisation.sales_promised_a_date
    competency_key: stakeholder_management
    topic: A commitment made without your team
    difficulty: medium
    text: >-
      Sales has promised a customer a feature by a specific date without checking with your team. How would you
      decide what to do?
    expected_concepts:
      - understanding exactly what was promised
      - feasibility and cost to other work
      - options such as partial delivery or a new date
      - involving sales in resetting expectations
      - a process to avoid this happening again
    rubric:
      excellent: Clarifies the promise, assesses feasibility and what would be displaced, offers realistic options, works with sales to reset expectations with the customer, and fixes the process.
      good: Assesses the commitment and agrees a path with sales.
      weak: Drops everything to meet the promise or refuses to engage.
    followups:
      - What would you say to the salesperson?
      - How would you prevent this next time?
    common_errors:
      - Silently absorbing the commitment.
      - Blaming sales instead of solving the problem.

  - external_key: problem_solving.tradeoffs_prioritisation.loosen_approval_steps
    competency_key: problem_solving
    topic: Loosening a slow approval process
    difficulty: medium
    text: >-
      Your team's approval process catches some mistakes but adds days to every change. How would you decide
      whether and how to loosen it?
    expected_concepts:
      - data on what the process actually catches
      - delay cost across all changes
      - different paths for low and high risk changes
      - automated checks replacing manual steps
      - monitoring after the change
    rubric:
      excellent: Looks at what the process actually catches, compares that with the delay cost, introduces risk-based paths or automation, and monitors for problems after loosening.
      good: Weighs the benefit of the process against its cost.
      weak: Removes the process because it is slow or keeps it unchanged without analysis.
    followups:
      - How would you decide which changes count as low risk?
      - What would make you tighten it again?
    common_errors:
      - Removing controls without understanding what they catch.
      - Applying the same heavy process to every change.

  - external_key: problem_solving.tradeoffs_prioritisation.free_versus_paying_bug_queue
    competency_key: product_sense
    topic: Ordering bugs from different customer tiers
    difficulty: medium
    text: >-
      Your bug queue has reports from both free users and paying customers. How would you set priorities between
      them?
    expected_concepts:
      - severity and number of users affected
      - contractual commitments to paying customers
      - the role free users play in growth
      - bugs that affect both groups
      - transparent rules for the queue
    rubric:
      excellent: Combines severity and reach with contractual obligations and the strategic role of free users, avoids blindly ranking by tier, and sets transparent rules for the queue.
      good: Considers both business value and severity.
      weak: Always puts paying customers first regardless of severity, or ignores the business context.
    followups:
      - When would a free-user bug go ahead of a paying customer's?
      - How would you explain the rules to support staff?
    common_errors:
      - Ignoring severity in favour of tier alone.
      - Forgetting that free users may become paying customers.

  - external_key: problem_solving.tradeoffs_prioritisation.how_much_to_estimate
    competency_key: project_management
    topic: How much effort estimation deserves
    difficulty: medium
    text: >-
      Your team spends a lot of time estimating work in detail, and the estimates still miss by a wide margin. How
      would you decide how much effort estimation deserves?
    expected_concepts:
      - what decisions the estimates feed
      - comparing past estimates with actuals
      - lighter methods such as ranges or sizing
      - using historical throughput
      - reducing uncertainty by splitting work
    rubric:
      excellent: Starts from what decisions need estimates and how precise they must be, reviews past accuracy, moves to lighter methods or historical throughput where possible, and splits work to reduce uncertainty.
      good: Reduces estimation effort while keeping enough for planning.
      weak: Adds more detailed estimation or drops estimates entirely without considering needs.
    followups:
      - What would you tell stakeholders who want precise dates?
      - How would you check whether the new approach is good enough?
    common_errors:
      - Assuming more detail makes estimates more accurate.
      - Removing estimates that other teams rely on.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.tradeoffs_prioritisation.platform_payoff_in_two_years
    competency_key: problem_solving
    topic: Committing to an investment with delayed payoff
    difficulty: hard
    text: >-
      You're asked to justify a large internal platform investment whose benefits mostly arrive in about two
      years. How would you make the case and decide how much to commit up front?
    expected_concepts:
      - estimating benefits with ranges and assumptions
      - staging the investment to deliver some value early
      - checkpoints with criteria to continue or stop
      - opportunity cost against current priorities
      - who benefits and how adoption will be driven
    rubric:
      excellent: Builds a case with explicit assumptions and ranges, stages the investment so early phases deliver value, sets continue-or-stop checkpoints, accounts for opportunity cost and plans for adoption.
      good: Makes a reasoned case and limits up-front commitment.
      weak: Asks for full funding based on optimistic benefits, or rejects it for being long-term.
    followups:
      - What could the first three months deliver on their own?
      - What would make you stop the investment halfway?
    common_errors:
      - Ignoring adoption, so the platform is built but unused.
      - Committing everything before validating assumptions.

  - external_key: problem_solving.tradeoffs_prioritisation.two_crises_small_team
    competency_key: problem_solving
    topic: Two serious problems at once
    difficulty: hard
    text: >-
      Two serious problems hit at the same time: a security weakness is being actively exploited on a minor
      internal system, and your main product is down. You have a small team available. How would you split your
      attention?
    expected_concepts:
      - fast containment of the exploit such as isolating the system
      - impact and spread risk of each problem
      - assigning clear owners to each
      - bringing in additional help or escalating
      - communication to the right people for each
    rubric:
      excellent: Contains the exploit quickly with a low-effort action such as isolating the system, assesses the risk of it spreading, assigns separate owners, escalates for more help and communicates on both fronts.
      good: Prioritises sensibly and assigns people to both problems.
      weak: Focuses on the outage only and ignores the active exploit, or the reverse, without assessing either.
    followups:
      - What if isolating the internal system breaks something else?
      - Who would you call first?
    common_errors:
      - Assuming a minor system means a minor risk.
      - Having one person juggle both without clear ownership.

  - external_key: problem_solving.tradeoffs_prioritisation.merged_teams_double_commitments
    competency_key: project_management
    topic: Merged teams with overcommitted roadmaps
    difficulty: hard
    text: >-
      Two teams with separate roadmaps have just been merged under you, and together they've committed to about
      twice what the combined team can deliver. How would you decide what to keep?
    expected_concepts:
      - inventory of all commitments and who they were made to
      - business value and deadlines of each
      - commitments that are hard to break
      - renegotiating with stakeholders transparently
      - a single prioritised roadmap
    rubric:
      excellent: Builds a full inventory of commitments, separates hard external ones from internal ones, ranks by value and deadline, renegotiates openly with stakeholders and publishes one prioritised roadmap.
      good: Prioritises across both roadmaps and communicates changes.
      weak: Keeps both roadmaps and asks the team to work harder, or cuts one team's work wholesale.
    followups:
      - Which commitments would you treat as untouchable?
      - How would you handle stakeholders who lose out?
    common_errors:
      - Favouring the team the leader knows best.
      - Avoiding difficult renegotiation conversations.

  - external_key: problem_solving.tradeoffs_prioritisation.new_segment_or_go_deeper
    competency_key: product_sense
    topic: New customer segment versus depth
    difficulty: hard
    text: >-
      Your product could grow by serving a new type of customer or by going deeper with the customers you already
      have, and you can't do both well this year. How would you decide?
    expected_concepts:
      - size and accessibility of each opportunity
      - fit with current strengths and product
      - retention and expansion potential with existing customers
      - cost and risk of entering a new segment
      - cheap tests to validate the new segment
    rubric:
      excellent: Sizes both opportunities, weighs fit, risk and the cost of entering a new segment against expansion and retention with current customers, and proposes cheap tests before committing.
      good: Compares both options with reasonable evidence.
      weak: Chases the new segment because it sounds bigger, or stays put without analysis.
    followups:
      - How would you test the new segment cheaply?
      - What would existing customers lose if you chose the new segment?
    common_errors:
      - Overestimating how easily the product fits the new segment.
      - Ignoring risk to existing customers.

  - external_key: problem_solving.tradeoffs_prioritisation.vendor_discontinued_busy_season
    competency_key: project_management
    topic: Forced migration during a busy period
    difficulty: hard
    text: >-
      A vendor announces that a product you rely on will be discontinued in nine months, just as your team begins
      its busiest roadmap period. How would you plan around this?
    expected_concepts:
      - sizing the migration and choosing a replacement
      - working back from the deadline with buffer
      - deciding what roadmap work moves
      - negotiating extended support with the vendor
      - early communication with stakeholders
    rubric:
      excellent: Sizes the migration early, works back from the deadline with buffer, explicitly moves roadmap work and explains why, explores extended support, and starts communicating early.
      good: Plans the migration and adjusts the roadmap.
      weak: Delays the migration until it becomes urgent.
    followups:
      - When would you start, given the busy period?
      - What would you do if the replacement turned out harder than expected?
    common_errors:
      - Starting too late and rushing at the end.
      - Not adjusting the roadmap to make room.

  - external_key: problem_solving.tradeoffs_prioritisation.two_leaders_conflicting_asks
    competency_key: stakeholder_management
    topic: Conflicting priorities from two senior leaders
    difficulty: hard
    text: >-
      Two senior leaders give your team conflicting priorities, and each expects their request to come first. How
      would you resolve it?
    expected_concepts:
      - understanding each leader's goals and constraints
      - making the conflict explicit to both
      - presenting options and their consequences
      - bringing it to a shared decision-maker if needed
      - communicating the decision to the team
    rubric:
      excellent: Understands each leader's goals, makes the conflict visible to both with clear options and consequences, escalates to a common decision-maker when needed, and shields the team from churn.
      good: Raises the conflict and seeks a decision.
      weak: Tries to satisfy both by splitting effort, or chooses quietly and hopes the other doesn't notice.
    followups:
      - What if neither leader wants to escalate?
      - How would you keep the team focused while this is resolved?
    common_errors:
      - Splitting the team in half and delivering neither.
      - Avoiding the conversation with one of the leaders.
