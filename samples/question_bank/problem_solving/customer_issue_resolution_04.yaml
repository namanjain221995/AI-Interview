# Curated questions: problem solving — resolving complex customer-reported technical issues with
# incomplete information (part 4 of 4): mitigation versus diagnosis, verifying fixes, narrowing regression
# windows, automation and SDK issues, red herrings, safe data correction and second-hand reports.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [support_engineer, qa, fullstack]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.customer_issue_resolution.unblock_or_diagnose_first
    competency_key: problem_solving
    topic: Unblocking the customer versus finding the cause
    difficulty: easy
    text: >-
      A customer is blocked and you have a quick workaround that might get them going, but applying it could
      make the original problem harder to diagnose. How do you decide which to do first?
    expected_concepts:
      - weigh business impact against the value of the evidence
      - capture logs, data and screenshots before applying the workaround
      - check whether the workaround is reversible
      - explain the trade-off to the customer
      - continue root-cause work after unblocking
    rubric:
      excellent: Captures the evidence first where possible, weighs impact against diagnostic value, prefers reversible workarounds, and keeps the root-cause work going afterwards.
      good: Unblocks the customer while saving some evidence first.
      weak: Always applies the workaround immediately and never returns to the cause.
    followups:
      - What evidence would you grab in the five minutes before applying it?
      - When would you hold back the workaround?
    common_errors:
      - Losing all diagnostic state by restarting or resetting first.

  - external_key: problem_solving.customer_issue_resolution.every_alert_twice
    competency_key: debugging
    topic: Every alert email arriving twice
    difficulty: easy
    text: >-
      A customer says every alert email from our product now arrives twice. How would you narrow down where the
      duplication happens?
    expected_concepts:
      - check whether we sent two messages or one was duplicated later
      - compare message ids and headers of the two copies
      - check alert rules for duplicates or overlapping subscriptions
      - check for forwarding rules or distribution lists on their side
      - check recent changes to our sending pipeline
    rubric:
      excellent: Uses message ids and headers to tell whether we sent two messages, then checks rule configuration on our side or forwarding on theirs accordingly.
      good: Checks our sending logs and their alert configuration.
      weak: Assumes our email service has a bug without checking headers.
    followups:
      - What in the email headers would tell you where the copy came from?
      - What if our logs show only one message sent?
    common_errors:
      - Not checking for duplicate subscriptions or overlapping alert rules.

  - external_key: problem_solving.customer_issue_resolution.screen_vs_export_totals
    competency_key: problem_solving
    topic: Screen totals differ from exported totals
    difficulty: easy
    text: >-
      A customer says the total shown on a report screen doesn't match the total they get when they export the
      same report to a spreadsheet. How would you track down the difference?
    expected_concepts:
      - confirm both use the same filters, date range and time zone
      - find which rows differ between the two
      - check rounding, pagination or row limits in either path
      - check whether the export and screen use different queries or caches
      - establish the correct total from source data
    rubric:
      excellent: Confirms identical inputs, finds the specific rows that differ, checks rounding, limits and separate code paths, and establishes the correct value independently.
      good: Compares filters and looks for rows missing in one version.
      weak: Tells the customer to trust the screen without checking.
    followups:
      - How would you find the differing rows quickly?
      - What if the export is right and the screen is wrong?
    common_errors:
      - Not checking for row limits on export or pagination on screen.

  - external_key: problem_solving.customer_issue_resolution.no_reply_to_info_request
    competency_key: customer_communication
    topic: Following up when the customer goes quiet
    difficulty: easy
    text: >-
      You asked a customer for diagnostic information a week ago and haven't heard back. How would you follow
      up, and what would you do in the meantime?
    expected_concepts:
      - send a short, specific reminder of what is needed and why
      - make the request easier, such as fewer steps or a call
      - continue investigating with the information you have
      - try another contact if appropriate
      - explain what will happen to the ticket if there's no response
    rubric:
      excellent: Sends a short, specific follow-up, lowers the effort required, keeps investigating independently and sets a clear expectation for the ticket's status.
      good: Follows up with a reminder and explains why the information is needed.
      weak: Closes the ticket automatically without follow-up or does nothing.
    followups:
      - How would you make the request simpler?
      - When would you close it, and how would you word that?
    common_errors:
      - Sending a generic reminder that repeats the whole original request.

  - external_key: problem_solving.customer_issue_resolution.underlying_customer_goal
    competency_key: problem_solving
    topic: Finding out what the customer is trying to achieve
    difficulty: easy
    text: >-
      How do you find out what a customer is actually trying to accomplish when they report a technical
      problem, and how has knowing that changed how you resolved an issue?
    expected_concepts:
      - ask what they were trying to do and why it matters to them
      - separate the goal from the method they chose
      - consider other paths to the same goal
      - use the goal to judge urgency and acceptable workarounds
      - give an example where this changed the resolution
    rubric:
      excellent: Explicitly separates goal from method, uses the goal to shape priority and alternatives, and gives a concrete example where it led to a better resolution.
      good: Asks about the goal and considers alternatives.
      weak: Focuses only on the literal error without asking about the goal.
    followups:
      - How do you ask about the goal without sounding like you're avoiding the problem?
      - What if the goal reveals they're using the product in an unsupported way?
    common_errors:
      - Solving the reported error when a simpler route to the goal existed.

  - external_key: problem_solving.customer_issue_resolution.three_tickets_same_day
    competency_key: technical_support
    topic: Several tickets that may be related
    difficulty: easy
    text: >-
      A customer opens three tickets on the same day describing different symptoms. How would you decide whether
      to treat them as one problem or three?
    expected_concepts:
      - compare timing, users, components and errors across the tickets
      - check for a shared recent change or incident
      - keep them linked while investigating
      - merge only when evidence supports a common cause
      - tell the customer how they're being handled
    rubric:
      excellent: Compares the tickets on concrete dimensions, looks for a shared change, links them while investigating and merges only on evidence, keeping the customer informed.
      good: Looks for common causes and links related tickets.
      weak: Merges them immediately or handles them in complete isolation.
    followups:
      - What if two are related and one isn't?
      - Who would own each ticket?
    common_errors:
      - Merging tickets and losing track of a separate issue.

  - external_key: problem_solving.customer_issue_resolution.verify_exact_customer_scenario
    competency_key: testing
    topic: Verifying a fix against the customer's scenario
    difficulty: easy
    text: >-
      Engineering says a customer's bug is fixed. Before anyone tells the customer, how would you verify that
      the fix really covers their exact scenario?
    expected_concepts:
      - reproduce the original failure first on the unfixed build
      - test with conditions matching the customer such as data, configuration and environment
      - check related variations and nearby functionality
      - verify on the version the customer will actually receive
      - confirm with the customer after release
    rubric:
      excellent: Confirms the failure on the old build, verifies the fix under the customer's conditions and variations on the version they will get, and plans confirmation with the customer.
      good: Tests the fix with the customer's steps.
      weak: Relies on the developer's word or a generic test.
    followups:
      - Which variations would you test beyond the exact steps?
      - What if you can't match their environment exactly?
    common_errors:
      - Testing only the happy path in a default configuration.

  # ------------------------------------------------------------------ medium
  - external_key: problem_solving.customer_issue_resolution.reminders_hour_off
    competency_key: debugging
    topic: Reminders an hour off after a clock change
    difficulty: medium
    text: >-
      Right after the clocks changed for daylight saving, a customer says some reminders now go out an hour
      early or late, but not all of them. How would you investigate?
    expected_concepts:
      - check how reminder times are stored, such as UTC or fixed offsets
      - compare affected and unaffected reminders by creation date and time zone
      - check recurring schedules created before the change
      - check server and user time zone configuration
      - plan correction for already-scheduled reminders
    rubric:
      excellent: Pins the problem to how times and offsets are stored, explains why only some reminders are affected, reproduces across the clock change, and plans correction.
      good: Identifies daylight saving handling and checks time storage.
      weak: Asks users to recreate their reminders without finding the cause.
    followups:
      - Why would reminders created before the change behave differently?
      - How should recurring times be stored?
    common_errors:
      - Storing a fixed offset instead of a time zone.

  - external_key: problem_solving.customer_issue_resolution.search_results_worse
    competency_key: problem_solving
    topic: Making a subjective complaint measurable
    difficulty: medium
    text: >-
      A customer says search results have "got worse" since our last update, without giving any specifics.
      How would you turn that into something you can investigate and verify?
    expected_concepts:
      - ask for concrete queries and the results they expected
      - compare results before and after the update for those queries
      - review what changed in search in the release
      - check whether their data or usage changed
      - define a measurable check to verify any fix
    rubric:
      excellent: Turns the complaint into specific example queries with expected results, compares before and after behaviour, connects differences to release changes and defines a measurable verification.
      good: Asks for examples and reviews the release changes.
      weak: Tells the customer results are working as designed without comparing.
    followups:
      - How would you compare results with the previous version?
      - What if the change was intentional and better for most customers?
    common_errors:
      - Investigating without concrete example queries.

  - external_key: problem_solving.customer_issue_resolution.seat_limit_lockout
    competency_key: technical_support
    topic: Seat limit reached with fewer active users
    difficulty: medium
    text: >-
      A customer says new users can't be added because they've hit their seat limit, but they're sure they
      have fewer active users than seats. How would you investigate?
    expected_concepts:
      - list how seats are counted, such as invited, deactivated or service accounts
      - compare their count with the system's calculation
      - check for pending invitations or duplicate accounts
      - check for sync with an identity provider creating accounts
      - offer an immediate way to unblock them
    rubric:
      excellent: Reconciles the customer's count with the system's definition of a seat, finds the specific accounts making up the difference and unblocks them promptly.
      good: Compares user lists and finds accounts the customer missed.
      weak: Tells them to buy more seats.
    followups:
      - What if the counting logic is actually wrong?
      - How would you explain the count clearly to the customer?
    common_errors:
      - Not reconciling account by account.

  - external_key: problem_solving.customer_issue_resolution.sdk_dependency_conflict
    competency_key: debugging
    topic: SDK errors only on the customer's machine
    difficulty: medium
    text: >-
      A customer's code using our SDK throws an error that you can't reproduce with the same code on your
      machine. You suspect their dependency versions. How would you confirm it?
    expected_concepts:
      - get the exact versions of the SDK, runtime and dependencies they use
      - reproduce in an isolated environment with the same lockfile
      - check for conflicting transitive dependencies
      - read the full stack trace for the conflicting package
      - recommend a supported version range or fix in the SDK
    rubric:
      excellent: Reproduces with their exact dependency set in a clean environment, identifies the conflicting package from the trace and dependency tree, and recommends both a workaround and an SDK fix if needed.
      good: Compares versions and reproduces with their lockfile.
      weak: Tells them to reinstall everything.
    followups:
      - How would you get their exact dependency tree?
      - Should the SDK be changed to tolerate this?
    common_errors:
      - Testing with only the SDK version and ignoring transitive dependencies.

  - external_key: problem_solving.customer_issue_resolution.demand_for_a_date
    competency_key: customer_communication
    topic: When the customer needs a date and engineering won't give one
    difficulty: medium
    text: >-
      Engineering won't commit to a date for a fix, but the customer needs one to plan their own work. How
      would you handle that?
    expected_concepts:
      - find out what the customer is actually planning around
      - get engineering's best estimate with uncertainty
      - offer milestones such as next update or investigation complete
      - offer workarounds that reduce dependency on the date
      - escalate through account or product management if impact justifies
    rubric:
      excellent: Understands what decisions depend on the date, provides realistic milestones and ranges from engineering, reduces dependency through workarounds and escalates when warranted.
      good: Gives a range or milestone instead of a fixed date and explains why.
      weak: Invents a date to satisfy the customer or refuses to give anything.
    followups:
      - How would you get a useful estimate from engineering?
      - What if the date you share slips?
    common_errors:
      - Passing on a guessed date as a commitment.

  - external_key: problem_solving.customer_issue_resolution.broke_sometime_last_month
    competency_key: problem_solving
    topic: Narrowing a vague regression window
    difficulty: medium
    text: >-
      A customer says something broke "sometime in the last month". In that time we shipped six releases and
      they changed their own setup twice. How would you narrow down when and why it broke?
    expected_concepts:
      - find evidence of the last success and first failure in logs or data
      - line up both sides' changes on one timeline
      - test releases in order or by bisection on a test environment
      - test their setup changes separately
      - confirm by reproducing before and after the suspected change
    rubric:
      excellent: Pins down the window from evidence, builds a joint change timeline and bisects across both our releases and their changes, confirming the culprit by reproduction.
      good: Uses logs to narrow the window and checks the releases in it.
      weak: Investigates only the latest release.
    followups:
      - How would you bisect if you can't install old releases?
      - What if two changes interact?
    common_errors:
      - Ignoring the customer's own changes.

  - external_key: problem_solving.customer_issue_resolution.screen_reader_form
    competency_key: technical_support
    topic: A form that can't be completed with a screen reader
    difficulty: medium
    text: >-
      A customer reports that one of their staff who uses a screen reader can't complete a form in our app.
      How would you investigate and get it resolved?
    expected_concepts:
      - get the screen reader, browser and operating system versions and the exact step
      - reproduce with the same assistive technology
      - check labels, focus order, keyboard access and announced errors
      - provide an alternative way to complete the task meanwhile
      - escalate as a defect with clear reproduction steps
    rubric:
      excellent: Reproduces with the same assistive technology, identifies the specific barrier such as labels or focus, offers an interim path and escalates with precise steps.
      good: Reproduces with a screen reader and reports the problem.
      weak: Treats it as a low-priority edge case without reproducing it.
    followups:
      - How would you test it if you've never used a screen reader?
      - What interim option would you offer?
    common_errors:
      - Testing only with a mouse and concluding the form works.

  - external_key: problem_solving.customer_issue_resolution.automation_rule_misfires
    competency_key: debugging
    topic: An automation firing on the wrong records
    difficulty: medium
    text: >-
      A customer's workflow automation sometimes runs on records it shouldn't touch. How would you work out why
      it matches those records?
    expected_concepts:
      - get examples of wrongly matched records and the rule definition
      - check the record values at the moment the rule ran
      - consider fields changing between trigger and evaluation
      - check other automations or integrations that update the same records
      - reproduce with a test record
    rubric:
      excellent: Examines the rule against the record state at execution time, considers ordering and other automations, and reproduces it with a controlled record.
      good: Compares the rule conditions with the records involved.
      weak: Rewrites the rule without understanding why it matched.
    followups:
      - How would you find the record's values at the time the rule ran?
      - What if two automations trigger each other?
    common_errors:
      - Checking the record's current values rather than its values at trigger time.

  - external_key: problem_solving.customer_issue_resolution.five_problems_one_ticket
    competency_key: problem_solving
    topic: One ticket listing many problems
    difficulty: medium
    text: >-
      A customer's ticket lists five different problems in one long message. How would you decide which are
      related, what to work on first and how to keep track of them?
    expected_concepts:
      - separate each problem with its own symptoms and impact
      - look for shared causes before splitting work
      - prioritise by impact and urgency to the customer
      - track each separately with links between them
      - confirm the breakdown and priorities with the customer
    rubric:
      excellent: Breaks the message into distinct problems, checks for shared causes, prioritises with the customer by impact and tracks each one explicitly.
      good: Separates the problems and prioritises them.
      weak: Works through them in the order written or loses some of them.
    followups:
      - What if the customer disagrees with your priority?
      - How would you report progress on all five?
    common_errors:
      - Losing smaller issues while focusing on the largest.

  - external_key: problem_solving.customer_issue_resolution.duplicate_contacts_origin
    competency_key: sql
    topic: Finding where duplicate records come from
    difficulty: medium
    text: >-
      A customer keeps finding duplicate contacts in their account. How would you use queries to find where
      the duplicates are being created?
    expected_concepts:
      - query for duplicates by normalised key such as email
      - compare creation timestamps and sources such as import, API or user
      - look for near-simultaneous creation indicating retries or races
      - check matching rules for case or whitespace differences
      - run read-only queries and limit their scope
    rubric:
      excellent: Writes a grouping query on a normalised key, uses creation source and timing to identify the path creating duplicates, and considers both matching rules and concurrency.
      good: Finds duplicates and checks how they were created.
      weak: Merges the duplicates without finding the source.
    followups:
      - What would the query look like?
      - What if duplicates differ slightly, such as in letter case?
    common_errors:
      - Cleaning up duplicates before identifying the source.

  - external_key: problem_solving.customer_issue_resolution.address_lookup_wrong_place
    competency_key: debugging
    topic: Address lookup returning the wrong location
    difficulty: medium
    text: >-
      A customer says our address lookup places some of their delivery addresses in the wrong town. How would
      you work out whether the problem is in their data, our code or the mapping provider?
    expected_concepts:
      - collect examples of wrong and correct results
      - call the provider directly with the same input
      - check how our code formats and sends the address
      - look for patterns such as abbreviations, missing postcodes or ambiguous names
      - decide on a fix or fallback such as asking users to confirm
    rubric:
      excellent: Isolates provider, formatting and data causes by calling the provider directly with our exact input, finds a pattern in the failing addresses, and proposes a fix or safeguard.
      good: Compares our request with the provider's response for failing addresses.
      weak: Blames the provider without testing.
    followups:
      - What if the provider returns several possible matches?
      - How would you prevent wrong locations from being saved?
    common_errors:
      - Not testing the provider directly with the exact input we send.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.customer_issue_resolution.product_meets_customisation
    competency_key: problem_solving
    topic: A bug at the boundary of our product and their customisation
    difficulty: hard
    text: >-
      A bug only appears when our product interacts with a customer's own custom extension, and each piece
      works correctly on its own. How would you diagnose it and decide who should fix what?
    expected_concepts:
      - reproduce with a minimal version of their extension
      - identify the exact interface or behaviour each side relies on
      - compare with our documented contract
      - decide ownership based on whether either side broke the contract
      - agree on a fix or workaround with the customer
    rubric:
      excellent: Builds a minimal reproduction, identifies the contract at the boundary, assigns ownership based on documented behaviour and agrees on a practical resolution with the customer.
      good: Reproduces the interaction and identifies where it fails.
      weak: Declares it the customer's responsibility because custom code is involved.
    followups:
      - What if our documentation never covered that behaviour?
      - How would you prevent similar breakages for other extensions?
    common_errors:
      - Assigning blame before establishing the contract.

  - external_key: problem_solving.customer_issue_resolution.red_herring_anomalies
    competency_key: problem_solving
    topic: Avoiding red herrings
    difficulty: hard
    text: >-
      While investigating a customer's slow pages, you find three anomalies: a spike in database load, a burst
      of failed background jobs and a misconfigured cache. Only one may matter. How would you avoid chasing red
      herrings?
    expected_concepts:
      - check whether each anomaly lines up in time with the customer's symptoms
      - check whether each also exists when things are working
      - predict what each would cause and compare with observations
      - test the strongest candidate by changing or removing it
      - record the others for separate follow-up
    rubric:
      excellent: Checks each anomaly against the symptom timeline and a normal baseline, uses predicted effects to rank them, confirms the cause experimentally and logs the others separately.
      good: Correlates anomalies with the symptoms and tests the most likely one.
      weak: Fixes all three at once and claims success.
    followups:
      - How would you show which anomaly actually caused the slowness?
      - What would you do with the anomalies that turned out irrelevant?
    common_errors:
      - Changing several things at once and not knowing which mattered.

  - external_key: problem_solving.customer_issue_resolution.production_data_correction
    competency_key: technical_support
    topic: Correcting customer data in production
    difficulty: hard
    text: >-
      Repairing a customer's damaged records requires running a correction script against their production
      data. How would you plan that safely and get the customer's agreement?
    expected_concepts:
      - define exactly which records change and how
      - test the script on a copy and review it with another engineer
      - take a backup or record before-values to allow rollback
      - run in batches with verification
      - get written approval with scope and timing
      - confirm results with the customer afterwards
    rubric:
      excellent: Defines exact scope, tests and reviews the script, ensures rollback, runs in verified batches and gets explicit customer approval before confirming results.
      good: Tests the script and takes a backup before running it.
      weak: Runs the script directly in production without review.
    followups:
      - What would you do if verification fails halfway through?
      - What should the approval message say?
    common_errors:
      - Not recording previous values for rollback.

  - external_key: problem_solving.customer_issue_resolution.totals_vary_between_runs
    competency_key: debugging
    topic: The same report gives different totals
    difficulty: hard
    text: >-
      A customer runs the same report twice a few minutes apart, with no data changes, and gets slightly
      different totals. How would you investigate?
    expected_concepts:
      - confirm no data changed by checking update timestamps
      - consider non-deterministic ordering with limits or pagination
      - consider floating point summation order in parallel queries
      - consider reads from replicas at different lag
      - reproduce by running the query repeatedly and comparing
    rubric:
      excellent: Verifies data was unchanged, then considers ordering, replica lag, caching and floating point aggregation, and reproduces with repeated runs to isolate the source.
      good: Considers replica lag and ordering and reproduces the variation.
      weak: Assumes data must have changed.
    followups:
      - How would you tell replica lag from ordering problems?
      - Why might sums depend on order?
    common_errors:
      - Not confirming that the data truly stayed the same.

  - external_key: problem_solving.customer_issue_resolution.rollback_loses_evidence
    competency_key: problem_solving
    topic: Restoring service versus preserving evidence
    difficulty: hard
    text: >-
      A customer is down, and rolling back the last change would probably restore service but wipe the state
      you need to understand the cause. How would you decide, and what would you do in the next ten minutes?
    expected_concepts:
      - customer impact usually takes priority
      - capture logs, memory dumps, data snapshots or configuration quickly before rolling back
      - keep a reproduction path in a test environment
      - communicate the decision and its trade-off
      - continue the root-cause investigation afterwards
    rubric:
      excellent: Prioritises restoring service while capturing the most valuable evidence in a fixed short time, explains the trade-off and plans root-cause work afterwards.
      good: Captures some evidence and then rolls back.
      weak: Delays recovery to keep investigating, or rolls back without capturing anything.
    followups:
      - Which evidence is most valuable to grab first?
      - When might you keep the system broken a little longer?
    common_errors:
      - Spending too long collecting evidence while the customer stays down.

  - external_key: problem_solving.customer_issue_resolution.coverage_gaps_from_tickets
    competency_key: testing
    topic: Using customer-reported issues to find test gaps
    difficulty: hard
    text: >-
      You've been asked to use the last year of customer-reported bugs to decide where test coverage is
      missing. How would you analyse them and turn the results into changes to testing?
    expected_concepts:
      - categorise bugs by area, type and root cause
      - identify which test level should have caught each
      - find clusters such as configuration, data or integrations
      - prioritise gaps by impact and frequency
      - add targeted tests and track escaped defects going forward
    rubric:
      excellent: Classifies bugs by root cause and missed test level, finds clusters, prioritises gaps by impact and sets up tracking to measure improvement.
      good: Groups bugs by area and adds tests for the biggest groups.
      weak: Adds a test for each bug without looking for patterns.
    followups:
      - How would you tell whether the new tests are working?
      - What if many bugs come from customer configurations you can't test exhaustively?
    common_errors:
      - Counting bugs without analysing why tests missed them.

  - external_key: problem_solving.customer_issue_resolution.relayed_through_partner
    competency_key: technical_support
    topic: Investigating through an intermediary
    difficulty: hard
    text: >-
      An issue is reported through a reseller partner, who relays messages from the end customer, and you
      can't speak to the end customer directly. How would you run the investigation?
    expected_concepts:
      - give the partner precise, self-contained instructions and questions
      - ask for raw evidence rather than summaries
      - verify information through logs and account data you control
      - propose a joint call or direct channel when needed
      - keep a written record of what was asked and received
    rubric:
      excellent: Designs requests that survive being relayed, relies on raw evidence and our own data, pushes for a direct channel when the relay slows resolution, and keeps a clear record.
      good: Sends clear questions through the partner and checks our own logs.
      weak: Relies on the partner's summaries and waits for replies.
    followups:
      - How would you handle information that gets distorted in the relay?
      - When would you push for direct contact?
    common_errors:
      - Accepting a second-hand summary as accurate evidence.
