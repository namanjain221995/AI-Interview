# Curated questions: problem solving / security incident reasoning (part 3 of 4).
# Scenario questions about network-level suspicious activity, ransomware, infrastructure compromise,
# recovery decisions and communicating inside the company.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [security, cloud, network]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.security_incident_reasoning.night_outbound_spike
    competency_key: networking
    topic: Large overnight upload from a file server
    difficulty: easy
    text: >-
      Monitoring shows an internal file server sent about forty gigabytes to an external address between two
      and four in the morning, which it has never done before. How would you figure out whether it's data
      theft or something routine?
    expected_concepts:
      - identify the destination, such as an approved backup or sync provider
      - identify the process and account behind the transfer
      - check change tickets and scheduled jobs
      - what files were read around that time
      - contain if it can't be explained, and preserve evidence
    rubric:
      excellent: Checks the destination and the process behind it, rules routine jobs in or out with evidence, looks at which files were read and contains if the transfer remains unexplained.
      good: Checks whether the destination is a known service and asks the server owners.
      weak: Assumes it was a backup without verifying.
    followups:
      - The destination is a popular cloud storage service your company also uses. How do you tell the difference?
      - What would you do if it starts again tonight?
    common_errors:
      - Trusting a familiar destination without checking whose account received the data.

  - external_key: problem_solving.security_incident_reasoning.unknown_device_meeting_room
    competency_key: network_engineering
    topic: Unrecognised device on an office switch port
    difficulty: easy
    text: >-
      Your switch logs show an unknown device appeared on a port in a meeting room yesterday and has been
      talking to internal servers since. How would you investigate it?
    expected_concepts:
      - MAC address vendor, DHCP hostname and fingerprint
      - what it has connected to and over which protocols
      - physically check the room
      - shut or quarantine the port if it's unexplained
      - port-based access control to stop unknown devices
    rubric:
      excellent: Uses MAC, DHCP and traffic data to identify the device, checks its connections, physically inspects the room, quarantines the port if needed and suggests network access control.
      good: Looks up the device and checks the room.
      weak: Shuts the port without trying to identify the device or what it did.
    followups:
      - It turns out to be a small single-board computer hidden behind the screen. What next?
      - How would you prevent this in future without annoying visitors?
    common_errors:
      - Not checking what the device connected to while it was on the network.

  - external_key: problem_solving.security_incident_reasoning.vpn_gateway_denied_flood
    competency_key: networking
    topic: Deciding whether noise is an incident
    difficulty: easy
    text: >-
      Your firewall logs show thousands of denied login attempts against your VPN gateway from all over the
      internet every hour. How do you decide whether this needs incident handling or is just background noise?
    expected_concepts:
      - internet-facing services always see scanning and password spraying
      - look for successful logins, especially after many failures
      - targeted usernames that match real staff
      - check whether the gateway has known vulnerabilities being probed
      - capacity impact and rate limiting
    rubric:
      excellent: Accepts scanning as normal, focuses on successes, targeted real usernames and exploitation of known flaws, and sets criteria for when it becomes an incident.
      good: Checks for successful logins and real usernames.
      weak: Declares an incident for every scan, or ignores the logs entirely.
    followups:
      - The attempts use valid usernames from your company directory. What changes?
      - Which alert would you actually want from this data?
    common_errors:
      - Ignoring denied traffic without checking for the successes hidden among it.

  - external_key: problem_solving.security_incident_reasoning.new_domain_many_lookups
    competency_key: networking
    topic: Many workstations resolving a newly registered domain
    difficulty: easy
    text: >-
      DNS logs show that dozens of workstations started resolving a domain that was registered three days ago.
      How would you work out why, and whether it's a problem?
    expected_concepts:
      - identify the common factor, such as an email link, ad or software update
      - check the domain's hosting, registration and content safely
      - which processes on the hosts make the lookups
      - whether connections followed the lookups
      - block at DNS if malicious, and look for wider exposure
    rubric:
      excellent: Finds the common trigger across hosts, investigates the domain safely, ties lookups to processes and connections and blocks with follow-up investigation if malicious.
      good: Checks the domain's reputation and blocks it if suspicious.
      weak: Blocks it immediately without finding why so many machines contacted it.
    followups:
      - The lookups all come from a browser right after users open one particular email. What next?
      - The domain belongs to a new SaaS tool marketing just bought. What would you do then?
    common_errors:
      - Blocking without understanding what caused the lookups.

  - external_key: problem_solving.security_incident_reasoning.unexpected_cert_issuance
    competency_key: security
    topic: Certificate for your domain from an unknown CA
    difficulty: easy
    text: >-
      Certificate transparency monitoring alerts that a certificate for one of your login hostnames was issued
      by a certificate authority you don't use. How would you handle it?
    expected_concepts:
      - check whether another team or a vendor requested it
      - how the CA validated control, such as DNS or HTTP challenge
      - possible DNS or hosting compromise
      - request revocation if unauthorised
      - restrict issuance with CAA records
    rubric:
      excellent: Checks internal owners and vendors, considers how domain validation could have been passed and what that implies, requests revocation if unauthorised and adds CAA records.
      good: Checks with internal teams and contacts the CA.
      weak: Ignores it because it's a valid certificate.
    followups:
      - Nobody requested it and the CA used DNS validation. Where would you look next?
      - What does a CAA record prevent and not prevent?
    common_errors:
      - Not considering that domain validation passing implies control over DNS or hosting.

  - external_key: problem_solving.security_incident_reasoning.phish_campaign_who_clicked
    competency_key: incident_response
    topic: Scoping a phishing campaign across many users
    difficulty: easy
    text: >-
      Forty employees received the same phishing email this morning, and two have reported it. How would you
      find out who clicked or entered credentials, and what would you do about it?
    expected_concepts:
      - search and remove the message from all mailboxes
      - proxy and DNS logs for visits to the phishing link
      - sign-in logs for affected users after the email arrived
      - reset credentials and sessions for anyone who submitted
      - block the domain and sender
    rubric:
      excellent: Pulls the email from all mailboxes, uses web and DNS logs to find who visited the link, checks sign-ins for those users, resets where needed and blocks the indicators.
      good: Removes the email and resets passwords for people who say they clicked.
      weak: Relies only on users to self-report.
    followups:
      - How do you tell a user who visited from one who entered a password?
      - What would you say in the all-staff message?
    common_errors:
      - Relying on self-reporting to identify affected users.

  - external_key: problem_solving.security_incident_reasoning.traffic_spike_attack_or_launch
    competency_key: networking
    topic: Telling an attack from a traffic surge
    difficulty: easy
    text: >-
      Traffic to your public website triples in twenty minutes and response times are climbing. How would you
      tell whether it's an attack or genuine interest from a campaign or news story?
    expected_concepts:
      - check marketing campaigns, launches and social mentions
      - look at source distribution, user agents and request paths
      - conversion or session behaviour compared with normal users
      - request rates per client and repeated identical requests
      - apply mitigations such as rate limits and caching either way
    rubric:
      excellent: Checks business context, compares traffic patterns with real user behaviour, looks at per-client rates and paths and applies mitigations that help in both cases.
      good: Checks with marketing and looks at source addresses.
      weak: Blocks large ranges of addresses without analysis.
    followups:
      - The requests all hit the search endpoint with random terms. What does that suggest?
      - Which mitigation would you apply first without hurting real users?
    common_errors:
      - Blocking real users while trying to stop a suspected attack.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.security_incident_reasoning.unlogged_router_tunnel
    competency_key: network_engineering
    topic: Unexplained change on an edge router
    difficulty: medium
    text: >-
      Comparing your edge router's running configuration with its last backup, you find a new GRE tunnel and
      an access list change that don't match any change request. How would you investigate?
    expected_concepts:
      - who logged in and when, using AAA and syslog
      - where the tunnel terminates and what traffic it carries
      - possible device compromise or a firmware vulnerability
      - preserve the configuration and logs
      - check other devices for similar changes
      - rotate device credentials and review management access
    rubric:
      excellent: Uses AAA logs to tie the change to an account and source, analyses the tunnel's purpose and traffic, considers firmware compromise, preserves evidence and checks other devices.
      good: Checks AAA logs and removes the tunnel after capturing the config.
      weak: Removes the change without finding who made it or what it carried.
    followups:
      - The AAA logs show a login from a monitoring server's address. What next?
      - How would you check whether the router firmware has been tampered with?
    common_errors:
      - Not checking whether the device itself has been compromised.

  - external_key: problem_solving.security_incident_reasoning.cert_warnings_one_vlan
    competency_key: network_engineering
    topic: Suspected interception on a local network segment
    difficulty: medium
    text: >-
      Users on one office VLAN suddenly start getting certificate warnings on internal websites, while users on
      other VLANs don't. How would you work out whether someone is intercepting traffic?
    expected_concepts:
      - ARP spoofing, rogue DHCP or DNS changes
      - check ARP tables and MAC address changes for the gateway
      - inspect the certificate presented to users
      - identify the device responsible and its switch port
      - dynamic ARP inspection and DHCP snooping
    rubric:
      excellent: Considers interception methods, checks the presented certificate and the gateway's ARP and DHCP data, traces the responsible device to a port and proposes switch-level protections.
      good: Suspects an interception attack and checks the certificate.
      weak: Tells users to click through the warning.
    followups:
      - The gateway's MAC address in users' ARP caches belongs to a laptop. What next?
      - Which switch features would stop this in future?
    common_errors:
      - Assuming a certificate expiry problem without checking the presented certificate.

  - external_key: problem_solving.security_incident_reasoning.unpatched_vpn_exploited_elsewhere
    competency_key: security
    topic: Exposure to an actively exploited appliance flaw
    difficulty: medium
    text: >-
      An advisory says a vulnerability in your VPN appliance has been exploited in the wild for two weeks, and
      yours is unpatched. Patching is one step, but how would you decide whether you've already been
      compromised?
    expected_concepts:
      - vendor indicators and integrity-check tools
      - appliance logs and configuration changes
      - unusual sessions and accounts on the appliance
      - internal traffic from the appliance to other systems
      - patching doesn't remove an existing foothold
      - consider a rebuild and credential reset if compromise is found
    rubric:
      excellent: Uses vendor indicators and integrity checks, reviews appliance and internal traffic for signs of exploitation, explains that patching won't remove an existing foothold and plans the response if found.
      good: Patches and checks the vendor's indicators.
      weak: Patches and assumes everything is fine.
    followups:
      - The appliance's logs were overwritten after a few days. What other evidence could help?
      - Which credentials would you reset if the appliance was compromised?
    common_errors:
      - Assuming patching removes any compromise that already happened.

  - external_key: problem_solving.security_incident_reasoning.smb_spread_network_containment
    competency_key: network_engineering
    topic: Network containment of spreading malware
    difficulty: medium
    text: >-
      Malware is spreading between Windows machines over file sharing, and endpoint tools aren't keeping up.
      What network-level containment options do you have, and how would you choose between them?
    expected_concepts:
      - block SMB between workstation segments while keeping access to file servers
      - isolate infected segments or VLANs
      - firewall rules on core switches or host firewalls through policy
      - business impact of each option
      - monitor for spread past the containment line
    rubric:
      excellent: Proposes several containment levels, from blocking workstation-to-workstation SMB to isolating segments, weighs business impact and verifies containment by watching for spread.
      good: Proposes blocking SMB between segments.
      weak: Shuts down the whole network or relies only on endpoint tools.
    followups:
      - The file servers also need SMB. How do you keep them reachable?
      - How would you know the containment is working?
    common_errors:
      - Choosing all-or-nothing options instead of targeted segmentation.

  - external_key: problem_solving.security_incident_reasoning.prefix_hijack_suspected
    competency_key: network_engineering
    topic: Your address space announced by someone else
    difficulty: medium
    text: >-
      Route monitoring alerts that one of your public prefixes is being announced by an autonomous system you
      don't recognise, and some customers can't reach you. How would you respond?
    expected_concepts:
      - confirm with looking glasses and route collectors
      - announce more specific prefixes if feasible
      - contact your upstreams and the other network's operator
      - RPKI route origin authorisations
      - assess whether traffic was intercepted, such as certificate risk
    rubric:
      excellent: Confirms the hijack from multiple vantage points, uses more-specific announcements and upstream contact to recover, considers interception risk and plans RPKI.
      good: Contacts upstreams and the offending network.
      weak: Waits for the problem to resolve itself.
    followups:
      - Your prefix is already a /24. What can you do then?
      - What would RPKI have changed here?
    common_errors:
      - Not knowing that most networks won't accept prefixes more specific than a /24.

  - external_key: problem_solving.security_incident_reasoning.malware_tls_fingerprint
    competency_key: networking
    topic: Validating an alert on encrypted traffic
    difficulty: medium
    text: >-
      Your network sensor alerts that a server's outbound TLS traffic matches a fingerprint associated with a
      known malware family. You can't decrypt the traffic. How would you validate the alert?
    expected_concepts:
      - TLS fingerprints can collide with legitimate libraries
      - destination name, certificate and hosting
      - endpoint data on the process making the connection
      - timing, volume and beaconing patterns
      - other hosts with the same fingerprint
    rubric:
      excellent: Explains fingerprint collisions, combines destination, process and behavioural evidence, checks other hosts and reaches a decision with stated confidence.
      good: Checks the process on the server and the destination.
      weak: Accepts or dismisses the alert on the fingerprint alone.
    followups:
      - The process is a common scripting runtime. What does that tell you?
      - What would make you confident enough to isolate the server?
    common_errors:
      - Treating TLS fingerprint matches as definitive.

  - external_key: problem_solving.security_incident_reasoning.ransomware_encrypting_shares
    competency_key: incident_response
    topic: First hour of active ransomware encryption
    difficulty: medium
    text: >-
      Users report that files on shared drives are being renamed with a strange extension and can't be opened,
      and it's still happening. What would you do in the first hour?
    expected_concepts:
      - identify the source host or account writing the encrypted files
      - isolate that host and disable the account
      - restrict access to shares if the source is unclear
      - protect backups by isolating them
      - preserve ransom notes and samples
      - escalate to leadership and start incident management
    rubric:
      excellent: Finds the writer from file server logs, isolates it, protects backups, considers restricting shares, preserves evidence and escalates quickly.
      good: Isolates infected machines and checks backups.
      weak: Starts restoring files while the encryption is still running.
    followups:
      - The writes come from an admin account on multiple machines. What does that tell you?
      - When would you shut down the file servers entirely?
    common_errors:
      - Restoring before stopping the encryption source.

  - external_key: problem_solving.security_incident_reasoning.choosing_clean_restore_point
    competency_key: incident_response
    topic: Choosing a trustworthy restore point
    difficulty: medium
    text: >-
      After a ransomware attack, you need to restore servers from backup, but you know the attacker was in the
      network for weeks before encrypting. How would you choose which backups are safe to restore from?
    expected_concepts:
      - backups may contain the attacker's persistence or malware
      - establish when the intrusion started from the investigation
      - scan restored systems in an isolated network first
      - restore data separately from rebuilding systems from clean images
      - trade-off between data loss and reinfection risk
    rubric:
      excellent: Ties the restore point to the intrusion timeline, prefers rebuilding systems and restoring data, scans restored systems in isolation and explains the data-loss trade-off clearly.
      good: Picks a backup from before the intrusion and scans it.
      weak: Restores the most recent backup to get running quickly.
    followups:
      - The cleanest backup is six weeks old. How do you recover the data since then?
      - How would you verify a restored server is clean?
    common_errors:
      - Restoring the most recent backup without considering persistence.

  - external_key: problem_solving.security_incident_reasoning.bastion_trust_fallout
    competency_key: security
    topic: Following trust from a compromised jump host
    difficulty: medium
    text: >-
      You confirm that the jump host administrators use to reach production was compromised for several days.
      How would you work out what else you now need to treat as compromised?
    expected_concepts:
      - keys, credentials and agent forwarding used through the host
      - sessions to downstream servers in that period
      - logs on downstream hosts for logins from the jump host
      - which administrators used it and their credentials
      - rebuild the jump host and rotate everything that passed through
    rubric:
      excellent: Systematically maps what passed through the jump host, such as credentials, keys and forwarded agents, checks downstream logins, rotates everything exposed and rebuilds the host.
      good: Rotates admin credentials and rebuilds the jump host.
      weak: Rebuilds the jump host only.
    followups:
      - Administrators used SSH agent forwarding. Why does that matter?
      - How would you prioritise checking the downstream hosts?
    common_errors:
      - Ignoring credentials that passed through the host during sessions.

  - external_key: problem_solving.security_incident_reasoning.camera_contacting_internet
    competency_key: network_engineering
    topic: Building device making suspicious connections
    difficulty: medium
    text: >-
      Flow data shows that several of your office security cameras are connecting to unfamiliar external
      addresses and generating far more traffic than usual. How would you investigate and contain this?
    expected_concepts:
      - likely botnet compromise via default credentials or old firmware
      - check destinations and protocols against vendor cloud services
      - isolate cameras on their own segment with restricted egress
      - involve facilities and the vendor
      - reset, update firmware and change credentials
    rubric:
      excellent: Considers botnet compromise, compares traffic with legitimate vendor cloud use, isolates the devices with restricted egress and coordinates firmware and credential fixes with facilities.
      good: Isolates the cameras and updates their firmware.
      weak: Unplugs the cameras without telling facilities or finding the cause.
    followups:
      - The cameras are on the same network as staff laptops. What risk does that add?
      - How would you manage devices like these that your team doesn't own?
    common_errors:
      - Leaving such devices on the general network after cleanup.

  - external_key: problem_solving.security_incident_reasoning.late_sandbox_verdict
    competency_key: security
    topic: Malicious attachment already delivered
    difficulty: medium
    text: >-
      Your email security sandbox returns a malicious verdict on an attachment two hours after it was delivered
      to two hundred inboxes. How would you handle the follow-up?
    expected_concepts:
      - pull the message from all mailboxes
      - identify who opened the attachment using endpoint data
      - investigate hosts where it executed
      - block indicators such as hashes, domains and senders
      - tune delivery so suspicious attachments are held until scanned
    rubric:
      excellent: Removes the email everywhere, uses endpoint data to find who opened it, investigates those hosts, blocks indicators and adjusts delivery policy.
      good: Removes the email and checks who opened it.
      weak: Sends an all-staff warning and nothing else.
    followups:
      - Endpoint data shows the attachment opened on three machines but nothing ran. How sure are you?
      - What's the trade-off of holding all attachments until scanning finishes?
    common_errors:
      - Not checking endpoints where the attachment was opened.

  - external_key: problem_solving.security_incident_reasoning.telling_staff_without_tipping_off
    competency_key: incident_response
    topic: Internal communication during an investigation
    difficulty: medium
    text: >-
      You're investigating a suspected compromise that may involve an employee's account, and rumours are
      spreading in the office. How would you decide what to tell staff, and when?
    expected_concepts:
      - need-to-know principle to protect the investigation
      - avoid naming or implying blame on individuals
      - give staff actionable guidance if needed, such as resetting passwords
      - coordinate with HR, legal and communications
      - correct rumours with facts when it's safe to do so
    rubric:
      excellent: Balances the investigation's need for discretion with staff's need for guidance, avoids implying blame, coordinates with HR and legal and plans the timing of a factual update.
      good: Limits information to those who need it and coordinates with HR.
      weak: Shares details widely, or says nothing at all while rumours spread.
    followups:
      - A manager asks you directly whether one of their staff is under suspicion. How do you respond?
      - When would you send an all-staff message?
    common_errors:
      - Implying wrongdoing by an individual before the facts are established.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.security_incident_reasoning.untrusted_perimeter_firewall
    competency_key: network_engineering
    topic: Investigating a firewall you can't trust
    difficulty: hard
    text: >-
      You have evidence that your perimeter firewall itself was compromised through a firmware vulnerability.
      How would you investigate a device whose own logs and outputs you can't trust, and how would you
      restore trust in it?
    expected_concepts:
      - collect evidence from outside the device, such as upstream flows and taps
      - vendor support for integrity checks and forensic images
      - review what the firewall had access to, such as VPN credentials and admin accounts
      - rebuild or replace on clean firmware with fresh configuration
      - rotate secrets stored on the device
      - temporary compensating controls while it's rebuilt
    rubric:
      excellent: Relies on external evidence sources, involves the vendor for integrity analysis, rotates everything the device stored, rebuilds from known-good firmware and puts compensating controls in place.
      good: Rebuilds the firewall on new firmware and rotates credentials.
      weak: Trusts the device's logs and simply updates its firmware.
    followups:
      - The firewall terminated your remote-access VPN. Which secrets are now exposed?
      - What evidence would show the attacker moved beyond the firewall?
    common_errors:
      - Relying on the compromised device's own logs as evidence.

  - external_key: problem_solving.security_incident_reasoning.low_slow_exfil_saas_domain
    competency_key: networking
    topic: Slow data theft through a trusted cloud service
    difficulty: hard
    text: >-
      You suspect data is being sent out slowly to a popular cloud storage service that your company also uses
      legitimately. How would you detect and confirm that when the destination itself looks normal?
    expected_concepts:
      - distinguish tenants or accounts, for example with proxy logs or TLS inspection
      - baseline upload volumes per user and host
      - which processes are uploading and whether they are sanctioned clients
      - tenant restrictions to allow only corporate accounts
      - correlate with other indicators of compromise
    rubric:
      excellent: Explains why destination-based detection fails, uses tenant identification, per-host baselines and process data to separate legitimate from malicious use and proposes tenant restrictions.
      good: Looks at upload volumes per host and the processes involved.
      weak: Blocks the whole service, breaking legitimate use.
    followups:
      - Your proxy can't see inside TLS. What can you still learn?
      - How would tenant restrictions work in practice?
    common_errors:
      - Not distinguishing corporate from personal accounts on the same service.

  - external_key: problem_solving.security_incident_reasoning.reconstruct_from_flows_only
    competency_key: networking
    topic: Reconstructing events without packet captures
    difficulty: hard
    text: >-
      You need to reconstruct what an attacker did on your network, but all you have are flow records and DNS
      logs, with no packet captures. What can you realistically conclude, and how would you go about it?
    expected_concepts:
      - who talked to whom, when and how much
      - map flows to services by port and to names by DNS
      - identify lateral movement, staging and exfiltration patterns by volume and timing
      - limits, such as no content and NAT hiding sources
      - corroborate with host and application logs
    rubric:
      excellent: Builds a who-talked-to-whom timeline from flows and DNS, identifies movement and staging patterns, is explicit about the limits and corroborates with other sources.
      good: Uses flows to trace connections and DNS to identify destinations.
      weak: Claims it can't conclude anything without packets, or overstates what flows can show.
    followups:
      - How would NAT make your conclusions less certain?
      - Which conclusions would you present as confirmed versus likely?
    common_errors:
      - Inferring content or intent from flow data alone.

  - external_key: problem_solving.security_incident_reasoning.partner_tunnel_overreach
    competency_key: network_engineering
    topic: Partner connection used beyond its purpose
    difficulty: hard
    text: >-
      Traffic from a partner's site-to-site tunnel is reaching systems well beyond what the partnership needs,
      and the pattern looks like scanning. You suspect the partner has been compromised. How would you handle
      it, technically and with the partner?
    expected_concepts:
      - restrict the tunnel to the minimum required access immediately
      - check what was reached and whether anything succeeded
      - contact the partner's security team through a verified channel
      - share indicators and agree on joint investigation
      - contractual and notification obligations
      - consider the business impact of cutting the tunnel completely
    rubric:
      excellent: Restricts access to what's needed, investigates what was reached, engages the partner through a verified channel with shared indicators and weighs business impact before cutting the link.
      good: Restricts the tunnel and contacts the partner.
      weak: Cuts the tunnel without contacting the partner or checks nothing on your side.
    followups:
      - The partner insists nothing is wrong on their side. What evidence would you share?
      - What would you change in how partner connections are set up?
    common_errors:
      - Not checking what was reached inside your network.

  - external_key: problem_solving.security_incident_reasoning.clean_rebuild_after_domain_compromise
    competency_key: incident_response
    topic: Rebuilding after a full directory compromise
    difficulty: hard
    text: >-
      Your Active Directory has been fully compromised and leadership has decided to rebuild rather than clean
      it up. How would you plan the rebuild so the attacker doesn't come straight back?
    expected_concepts:
      - build a clean, isolated environment first
      - tiered admin model and privileged access workstations
      - move systems in gradually after scanning and rebuilding
      - all credentials reset, with no reused trust
      - heightened monitoring of the new environment
      - plan for business continuity during the transition
    rubric:
      excellent: Builds a clean, isolated core with a tiered admin model, migrates systems only after verification, resets all credentials, monitors the new environment closely and plans for continuity.
      good: Builds a new domain and resets credentials.
      weak: Rebuilds but migrates systems and accounts without verification.
    followups:
      - Which systems would you move first, and why?
      - How would you stop administrators from reintroducing old credentials?
    common_errors:
      - Migrating compromised systems or trust into the new environment.

  - external_key: problem_solving.security_incident_reasoning.ransom_payment_technical_input
    competency_key: incident_response
    topic: Technical input to a ransom decision
    difficulty: hard
    text: >-
      After a ransomware attack, leadership asks for your technical input before deciding whether to pay. What
      would you put in front of them?
    expected_concepts:
      - realistic recovery time and data loss from backups
      - reliability of decryptors and the time decryption takes
      - payment doesn't remove the attacker or guarantee stolen data is deleted
      - legal and sanctions considerations to be handled by legal
      - eviction and hardening are needed either way
    rubric:
      excellent: Presents realistic recovery options and timelines, explains limits of payment, including decryptor reliability and stolen data, and notes that eviction and legal review are needed regardless.
      good: Compares recovery from backup with payment and mentions the risks.
      weak: Gives a personal opinion on paying without laying out the technical facts.
    followups:
      - How would you estimate recovery time from backups?
      - What would you need to do even if the company pays?
    common_errors:
      - Assuming payment ends the incident.
