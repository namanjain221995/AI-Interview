# Curated questions: problem solving / security incident reasoning (part 4 of 4).
# Scenario questions about application and supply-chain incidents, insider access, severity and
# closure decisions, key compromise and avoiding reasoning traps during investigations.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [security, cloud, network]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.security_incident_reasoning.brand_impersonation_phishing
    competency_key: incident_response
    topic: Phishing that impersonates your company
    difficulty: easy
    text: >-
      Several customers forward you emails that pretend to come from your company and ask them to "verify
      their account" on a lookalike website. What would you do?
    expected_concepts:
      - collect samples with full headers and the lookalike domain
      - request takedown from the registrar and hosting provider
      - warn customers through official channels
      - check whether customer contact data leaked from your systems
      - email authentication such as SPF, DKIM and DMARC enforcement
    rubric:
      excellent: Gathers evidence, pursues takedowns, warns customers, considers whether the targeting suggests a data leak and checks email authentication on your domains.
      good: Requests takedown and warns customers.
      weak: Tells customers to ignore the emails and does nothing else.
    followups:
      - The emails are going only to customers of one product line. What might that suggest?
      - How would DMARC help, and when wouldn't it?
    common_errors:
      - Not asking how the attackers got the list of customer addresses.

  - external_key: problem_solving.security_incident_reasoning.double_extension_on_share
    competency_key: security
    topic: Suspicious executable on a shared drive
    difficulty: easy
    text: >-
      An employee reports finding a file named "invoice.pdf.exe" in a shared team folder. How would you handle
      the report and work out whether anyone ran it?
    expected_concepts:
      - preserve the file and get its hash and analysis safely
      - who placed it there and when, from file server logs
      - endpoint data for executions of that hash
      - remove it and block the hash
      - thank the reporter and encourage reporting
    rubric:
      excellent: Preserves and analyses the file safely, finds who put it there and when, uses endpoint data to check for executions across the company and blocks it.
      good: Removes the file and checks whether it ran anywhere.
      weak: Deletes the file and moves on.
    followups:
      - The file was written by an account belonging to a contractor. What next?
      - How would you search for other copies with different names?
    common_errors:
      - Deleting the file before identifying where it came from.

  - external_key: problem_solving.security_incident_reasoning.main_branch_history_rewritten
    competency_key: security
    topic: Unexpected rewrite of a protected branch
    difficulty: easy
    text: >-
      Developers notice that the history of your main branch was rewritten overnight and some commits look
      different. How would you work out whether this was an accident or an attack?
    expected_concepts:
      - source control audit log for the force push and who did it
      - compare with local clones and mirrors to see what changed
      - diff the altered commits for injected code
      - check whether CI built and deployed from the altered history
      - restore protections and the original history
    rubric:
      excellent: Uses audit logs to identify who pushed, diffs against intact clones to find what changed, checks whether altered code was built or deployed and restores branch protection.
      good: Finds who force-pushed and restores the history.
      weak: Restores the history from a clone without checking what changed or whether it was deployed.
    followups:
      - The push came from a developer's token. What would you check about that token?
      - How would you know if the altered code reached production?
    common_errors:
      - Not checking whether the altered history was deployed.

  - external_key: problem_solving.security_incident_reasoning.pasted_install_script
    competency_key: incident_response
    topic: Developer ran an untrusted script
    difficulty: easy
    text: >-
      A developer tells you they ran an install script piped straight from a website they found on a forum,
      on the laptop where they keep production cloud credentials. What would you do?
    expected_concepts:
      - get a copy of the script and see what it actually did
      - check the laptop with endpoint tooling
      - rotate the cloud credentials and tokens on the laptop
      - check cloud audit logs for use of those credentials
      - thank the developer for reporting it
    rubric:
      excellent: Retrieves and reviews the script, checks the laptop, rotates credentials as a precaution, checks for any credential use and treats the report positively.
      good: Rotates credentials and has the laptop checked.
      weak: Lectures the developer without investigating.
    followups:
      - The script is no longer available on the site. How do you proceed?
      - How would you reduce the impact of this happening again?
    common_errors:
      - Treating the report as a disciplinary matter rather than an incident.

  - external_key: problem_solving.security_incident_reasoning.shift_handover_investigation
    competency_key: incident_response
    topic: Handing over an ongoing investigation
    difficulty: easy
    text: >-
      You've been working on a security investigation for ten hours, and someone from another time zone is
      taking over. What would your handover cover so they can continue without losing ground?
    expected_concepts:
      - current status and hypotheses with confidence levels
      - actions already taken and their effects
      - open questions and next steps
      - where evidence and notes live
      - who to contact and pending decisions
    rubric:
      excellent: Covers status, hypotheses, actions taken, open questions, evidence locations, contacts and pending decisions, ideally both written and in a live call.
      good: Gives a written summary of status and next steps.
      weak: Gives a brief verbal summary or leaves notes scattered in chat.
    followups:
      - What's the risk of a handover done only by chat?
      - How do you make sure the next person doesn't repeat containment actions you've already taken?
    common_errors:
      - Leaving out actions already taken, leading to repeated or conflicting steps.

  - external_key: problem_solving.security_incident_reasoning.ops_wants_to_redeploy_suspect_vm
    competency_key: incident_response
    topic: Preserving evidence before a rebuild
    difficulty: easy
    text: >-
      The operations team wants to terminate a suspicious virtual machine and redeploy it from the image right
      away, because that's their standard fix. What would you ask them to do first, and why?
    expected_concepts:
      - snapshot disks and capture memory if possible
      - export logs not already centralised
      - record instance metadata, network details and attached roles
      - isolate rather than terminate while capturing
      - agree on a quick procedure so ops isn't blocked
    rubric:
      excellent: Asks for disk snapshots, memory if feasible, logs and metadata before termination, suggests isolation in the meantime and agrees on a quick standard procedure with ops.
      good: Asks them to snapshot the disk before terminating.
      weak: Lets them terminate the VM without capturing anything.
    followups:
      - Why does memory matter if you already have the disk?
      - How would you make evidence capture part of their runbook?
    common_errors:
      - Losing memory and ephemeral data by terminating first.

  - external_key: problem_solving.security_incident_reasoning.customer_api_key_surge
    competency_key: security
    topic: Customer API key suddenly abused
    difficulty: easy
    text: >-
      One customer's API key suddenly makes fifty times its usual number of requests, from hundreds of
      different addresses. How would you handle it, both technically and with the customer?
    expected_concepts:
      - check what endpoints and data the requests hit
      - apply rate limits or temporarily suspend the key
      - contact the customer through a verified channel
      - help them rotate the key and find the leak
      - consider whether the key was leaked publicly
    rubric:
      excellent: Reviews what the requests did, limits or suspends the key with minimal disruption, contacts the customer via a verified channel and helps rotate and find the leak.
      good: Suspends the key and tells the customer.
      weak: Blocks the key without telling the customer, or does nothing because it's their key.
    followups:
      - The customer says they're running a big data migration. How do you verify?
      - How would you search for their key on public code sites?
    common_errors:
      - Not involving the customer in rotating the key.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.security_incident_reasoning.internet_exposed_admin_panel
    competency_key: security
    topic: Internal admin panel exposed with default credentials
    difficulty: medium
    text: >-
      You discover an internal administration panel has been reachable from the internet, and it still accepts
      the vendor's default password. How would you work out whether anyone used it?
    expected_concepts:
      - restrict access and change the password immediately
      - application and web server logs for logins and actions
      - when exposure started, from DNS, load balancer or firewall changes
      - what the panel can do and what data it reaches
      - scan for other exposed services
    rubric:
      excellent: Closes the exposure, establishes the exposure window, uses logs to check for external logins and actions, maps what the panel could affect and checks for similar exposures.
      good: Restricts access and checks the logs.
      weak: Changes the password and assumes nobody found it.
    followups:
      - The panel has no login audit log. How else could you find out?
      - How would you catch this kind of exposure in future?
    common_errors:
      - Not establishing how long it was exposed.

  - external_key: problem_solving.security_incident_reasoning.publish_token_leaked
    competency_key: security
    topic: Package publishing token leaked
    difficulty: medium
    text: >-
      You learn that your organisation's token for publishing packages to a public registry was exposed in a
      public build log. How would you check whether malicious versions were published and protect your users?
    expected_concepts:
      - revoke the token immediately
      - list all versions published since exposure and verify each against source
      - unpublish or deprecate malicious versions
      - notify downstream users with clear guidance
      - move to scoped tokens or trusted publishing
    rubric:
      excellent: Revokes the token, verifies every recent version against source, removes or deprecates bad versions, notifies users and moves to safer publishing.
      good: Revokes the token and checks recent versions.
      weak: Revokes the token and assumes nothing was published.
    followups:
      - How would you verify a published version matches your source?
      - What would you tell users who already installed a bad version?
    common_errors:
      - Not checking every version published during the exposure window.

  - external_key: problem_solving.security_incident_reasoning.unusual_bulk_user_queries
    competency_key: security
    topic: Unexpected bulk queries from an application account
    difficulty: medium
    text: >-
      Database audit logs show your web application's service account running full-table reads on the users
      table at unusual hours, which the application never normally does. How would you investigate?
    expected_concepts:
      - correlate with application logs and requests at those times
      - injection or compromise of an application server
      - someone using the service account credentials directly
      - source host and client of the database connections
      - rotate credentials and restrict the account's permissions
    rubric:
      excellent: Correlates database activity with application requests and connection sources, distinguishes injection from credential misuse, contains with rotation and least privilege and sizes the data accessed.
      good: Checks where the connections came from and rotates the password.
      weak: Assumes a batch job and moves on.
    followups:
      - The connections came from an application server, but no request matches the time. What next?
      - How would you limit what the service account can read?
    common_errors:
      - Not distinguishing between application-level injection and stolen credentials.

  - external_key: problem_solving.security_incident_reasoning.api_scraping_or_incident
    competency_key: security
    topic: Large-scale scraping through a mobile API
    difficulty: medium
    text: >-
      Someone is pulling your entire product catalogue and pricing through the private API your mobile app uses,
      using tokens taken from the app. Is this a security incident, and how would you respond?
    expected_concepts:
      - define impact, such as business harm and data sensitivity
      - identify the clients by behaviour, tokens and devices
      - rate limits, device attestation and anomaly detection
      - whether more sensitive endpoints are also reachable
      - involve product and legal on business response
    rubric:
      excellent: Defines the impact, checks whether the access reached anything sensitive, applies layered technical controls and involves product and legal.
      good: Proposes rate limiting and blocking the abusive clients.
      weak: Dismisses it because the data is public in the app anyway.
    followups:
      - How would you tell scrapers from real app users?
      - Which other endpoints would you check?
    common_errors:
      - Not checking whether the same access reached more sensitive data.

  - external_key: problem_solving.security_incident_reasoning.support_agent_record_lookups
    competency_key: incident_response
    topic: Employee accessing records without a business reason
    difficulty: medium
    text: >-
      Monitoring shows a support agent viewed several hundred customer records over two weeks that don't match
      any of their tickets. How would you investigate fairly and properly?
    expected_concepts:
      - confirm the data is accurate and that the account was used by the agent
      - check for legitimate reasons such as a project or a tooling issue
      - involve HR and legal early and follow policy
      - restrict access while investigating if risk is high
      - assess what data was viewed and whether it left the system
    rubric:
      excellent: Verifies the data and the account, checks legitimate explanations, involves HR and legal, takes proportionate interim measures and sizes the exposure, without presuming guilt.
      good: Involves HR and reviews the access logs.
      weak: Confronts the agent directly or presumes misconduct.
    followups:
      - The agent's manager says they were helping on a migration project. How do you verify?
      - What would you do if the account was compromised instead?
    common_errors:
      - Assuming malicious intent before ruling out account compromise or a legitimate reason.

  - external_key: problem_solving.security_incident_reasoning.severity_unclear_exposure
    competency_key: incident_response
    topic: Assigning severity when impact is unclear
    difficulty: medium
    text: >-
      An incident has been opened where an internal service may have exposed customer data, but nobody knows
      yet how much. How would you decide what severity to assign, and when would you change it?
    expected_concepts:
      - severity criteria based on data sensitivity, scale and exploitation
      - err towards higher severity when uncertain, then adjust
      - severity drives staffing and communication
      - triggers that would raise or lower it
      - document the reason for each change
    rubric:
      excellent: Uses defined criteria, starts higher under uncertainty, explains how severity drives response and lists triggers for changing it, with documented reasons.
      good: Starts at a higher severity and adjusts as facts come in.
      weak: Waits until the scope is known before setting severity.
    followups:
      - What would make you lower it?
      - How do you avoid every incident being marked critical?
    common_errors:
      - Delaying severity decisions until full scope is known.

  - external_key: problem_solving.security_incident_reasoning.helpdesk_vendor_breached
    competency_key: security
    topic: Vendor with access to your systems is breached
    difficulty: medium
    text: >-
      The company that runs your outsourced IT helpdesk announces it was breached, and its staff have accounts
      that can reset your employees' passwords. What would you do?
    expected_concepts:
      - inventory every access the vendor has
      - review password resets and MFA changes the vendor made recently
      - suspend or restrict vendor access temporarily
      - rotate shared credentials and integration tokens
      - get details from the vendor and agree on communication
    rubric:
      excellent: Maps all vendor access, reviews recent resets and MFA changes for abuse, restricts access, rotates credentials and works with the vendor on facts and timelines.
      good: Suspends vendor accounts and reviews recent resets.
      weak: Waits for the vendor to say whether you're affected.
    followups:
      - Several resets were done for executives last week. What would you check?
      - How would you restore helpdesk service while their access is suspended?
    common_errors:
      - Not reviewing what the vendor's accounts did before the breach was announced.

  - external_key: problem_solving.security_incident_reasoning.closing_as_false_positive
    competency_key: incident_response
    topic: Closing out an investigation with residual doubt
    difficulty: medium
    text: >-
      After two days of investigation you believe a reported intrusion was a false positive, but a vice
      president wants you to say with certainty that nothing happened. How would you close it out?
    expected_concepts:
      - explain what was checked and the evidence for the conclusion
      - state residual uncertainty and why certainty isn't possible
      - criteria that would reopen the investigation
      - monitoring to keep in place for a period
      - lessons, such as improving the detection that fired
    rubric:
      excellent: Summarises evidence and reasoning, states residual risk plainly, defines reopening criteria and follow-up monitoring and improves the noisy detection.
      good: Explains what was checked and why it was a false positive.
      weak: Gives the requested guarantee, or keeps the incident open indefinitely.
    followups:
      - What would you write in the closure summary?
      - How do you stop the same false positive from consuming two days next time?
    common_errors:
      - Promising certainty the evidence can't support.

  - external_key: problem_solving.security_incident_reasoning.ci_runner_outbound_cache
    competency_key: security
    topic: Suspected compromise of a build runner
    difficulty: medium
    text: >-
      A self-hosted CI runner starts making unexpected outbound connections, and you notice its build cache was
      modified outside any job. How would you investigate, and what would you assume about recent builds?
    expected_concepts:
      - isolate the runner and preserve its state
      - which builds ran on it and which artifacts they produced
      - secrets available to jobs on that runner
      - rebuild affected artifacts on clean runners and compare
      - ephemeral runners and cache integrity going forward
    rubric:
      excellent: Isolates and preserves the runner, treats artifacts and secrets from it as suspect, rebuilds and compares artifacts on clean runners and moves to ephemeral runners.
      good: Rebuilds the runner and rotates secrets.
      weak: Clears the cache and keeps using the runner.
    followups:
      - How would you decide which deployed artifacts to roll back?
      - What makes a poisoned cache dangerous?
    common_errors:
      - Not treating artifacts built on the runner as suspect.

  - external_key: problem_solving.security_incident_reasoning.public_status_update_security_outage
    competency_key: incident_response
    topic: Public status update for a security-related outage
    difficulty: medium
    text: >-
      You've taken a customer-facing service offline to contain a security incident, and customers are asking
      what's going on. How would you approach the public status update?
    expected_concepts:
      - acknowledge the outage promptly
      - say what customers need to know without details that help the attacker
      - align wording with legal and communications
      - commit to a next-update time
      - avoid claims that later prove false
    rubric:
      excellent: Publishes a prompt, accurate update that avoids helping the attacker, aligns with legal and communications, commits to regular updates and avoids premature claims.
      good: Acknowledges the outage and promises updates.
      weak: Calls it routine maintenance, or shares technical details of the attack.
    followups:
      - Would you say it's a security incident? Why or why not?
      - How would you handle a journalist asking questions?
    common_errors:
      - Describing the outage misleadingly, which damages trust later.

  - external_key: problem_solving.security_incident_reasoning.internal_assistant_prompt_injection
    competency_key: security
    topic: Internal AI assistant leaking restricted documents
    difficulty: medium
    text: >-
      An employee shows you that your internal AI assistant, which searches company documents, returned
      content from a restricted HR folder after they asked it to "ignore previous instructions". How would you
      investigate and contain this?
    expected_concepts:
      - the assistant's retrieval permissions bypass user-level access controls
      - check logs for who else retrieved restricted content
      - restrict the assistant's index or permissions
      - enforce access control at retrieval time per user
      - assess and notify for exposed data
    rubric:
      excellent: Identifies the real flaw as missing per-user access control on retrieval rather than the prompt, reviews logs for other exposures, restricts the index and plans proper access enforcement.
      good: Restricts the assistant's access to the folder and reviews logs.
      weak: Adds a prompt instruction telling the assistant not to share HR content.
    followups:
      - Why isn't a better system prompt a fix?
      - How would you find what other users retrieved?
    common_errors:
      - Treating prompt hardening as the fix for an access control problem.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.security_incident_reasoning.code_signing_key_stolen
    competency_key: security
    topic: Possible theft of a code-signing key
    difficulty: hard
    text: >-
      You find evidence that the private key you use to sign your desktop application may have been copied from
      a build server. How would you assess the impact and respond?
    expected_concepts:
      - anything signed with the key could be malware that users' systems trust
      - revoke the certificate and decide on a revocation date carefully
      - re-sign legitimate releases with a new key
      - hunt for unknown binaries signed with the key
      - move keys to hardware security modules
      - communicate with customers and platform vendors
    rubric:
      excellent: Explains the trust impact, handles revocation timing so legitimate releases aren't broken, re-signs, hunts for unauthorised signed binaries, moves keys into hardware and communicates clearly.
      good: Revokes the certificate and re-signs releases.
      weak: Rotates the key without revoking or communicating.
    followups:
      - How does the revocation date affect existing legitimate installations?
      - How would you find binaries signed with your key that you didn't create?
    common_errors:
      - Choosing a revocation date that breaks every legitimate release.

  - external_key: problem_solving.security_incident_reasoning.enough_scope_to_evict
    competency_key: incident_response
    topic: Deciding when scoping is good enough
    difficulty: hard
    text: >-
      Your team has been scoping an intrusion for a week and keeps finding new compromised systems. Leadership
      is pushing to start eviction now. How would you decide whether you know enough to act?
    expected_concepts:
      - rate of new findings and whether they reveal new techniques
      - confidence in the attacker's access paths and persistence types
      - the cost of waiting, such as ongoing data loss and destructive risk
      - plan for re-entry and monitoring after eviction
      - document the decision and its accepted risks
    rubric:
      excellent: Uses evidence such as whether new findings reveal new techniques or just more of the same, weighs the cost of waiting, plans for re-entry and documents the accepted risk.
      good: Balances the risk of acting early with the risk of waiting.
      weak: Insists on finding every system first, or starts eviction just because leadership asks.
    followups:
      - What signs would show the attacker had access paths you haven't found?
      - How do you explain this decision to leadership?
    common_errors:
      - Treating complete scoping as a precondition for any action.

  - external_key: problem_solving.security_incident_reasoning.two_incidents_one_team
    competency_key: incident_response
    topic: Prioritising between simultaneous incidents
    difficulty: hard
    text: >-
      You lead a small security team and two incidents arrive at once: a confirmed compromise of a developer's
      laptop and a possible exposure of a customer database. How would you prioritise and staff them?
    expected_concepts:
      - assess impact and urgency of each quickly
      - check whether they could be linked
      - assign leads and split the team, or bring in outside help
      - make sure containment steps happen on both
      - communicate prioritisation to stakeholders
    rubric:
      excellent: Assesses both quickly, checks for a link between them, makes sure both get basic containment, staffs according to risk and brings in help when needed, with clear communication.
      good: Prioritises the higher-impact incident while keeping basic actions on the other.
      weak: Handles them strictly in order of arrival.
    followups:
      - What would make you suspect the two incidents are connected?
      - When would you bring in an external response firm?
    common_errors:
      - Not checking whether the incidents are related.

  - external_key: problem_solving.security_incident_reasoning.backup_console_accessed
    competency_key: security
    topic: Attacker reaching the backup system
    difficulty: hard
    text: >-
      You discover that an attacker logged in to your backup management console yesterday and changed several
      retention settings. What does that tell you about their intentions, and what would you do?
    expected_concepts:
      - likely preparation for a destructive or ransomware attack
      - restore retention settings and protect immutable copies
      - check whether backups were deleted or corrupted
      - lock down backup admin access with separate credentials and MFA
      - accelerate containment of the wider intrusion
    rubric:
      excellent: Reads the change as preparation for destruction, protects and verifies backups, isolates backup administration and treats the wider containment as urgent.
      good: Restores settings and changes backup admin credentials.
      weak: Fixes the retention settings and treats it as a configuration issue.
    followups:
      - How would you verify that your backups are still restorable?
      - What does "immutable backup" really protect against?
    common_errors:
      - Not recognising this as a precursor to a destructive attack.

  - external_key: problem_solving.security_incident_reasoning.disclosure_detail_disagreement
    competency_key: incident_response
    topic: Disagreement over how much to disclose
    difficulty: hard
    text: >-
      After an incident, your engineering leaders want to publish a detailed technical write-up, while legal
      wants a short statement with minimal detail. You're asked for a recommendation. How would you approach
      it?
    expected_concepts:
      - understand each side's concerns, such as trust versus liability
      - what customers need in order to protect themselves
      - avoid details that help attackers or are still uncertain
      - possible middle ground, such as a phased or reviewed write-up
      - final decision authority and documenting it
    rubric:
      excellent: Understands both concerns, centres the recommendation on what customers need, proposes a reviewed or phased approach and respects decision authority.
      good: Proposes a compromise between the two positions.
      weak: Picks a side without engaging with the other's concerns.
    followups:
      - What details would you always leave out?
      - How would you handle it if a researcher publishes details first?
    common_errors:
      - Ignoring what customers need to know to protect themselves.

  - external_key: problem_solving.security_incident_reasoning.virtualisation_plane_compromise
    competency_key: security
    topic: Compromise of the virtualisation management layer
    difficulty: hard
    text: >-
      You find signs that an attacker gained access to your virtualisation management server, which controls
      hundreds of virtual machines. How would you scope the impact, given that guest-level tools may not see
      what they did?
    expected_concepts:
      - attacker could snapshot, clone or read VM disks and memory
      - management server logs for VM operations and exports
      - host-level evidence outside the guests
      - rotate credentials used by or stored on VMs that may have been copied
      - rebuild the management layer and restrict access
    rubric:
      excellent: Explains that guest tools can't see hypervisor-level actions, uses management and host logs to find clones, snapshots and exports, treats copied VMs as exposed and rebuilds the management layer.
      good: Reviews management logs and resets credentials.
      weak: Scans guest VMs with antivirus and considers the scope covered.
    followups:
      - The attacker cloned a domain controller VM. What does that mean?
      - How would you protect the management layer afterwards?
    common_errors:
      - Relying on guest-level tools to detect hypervisor-level actions.

  - external_key: problem_solving.security_incident_reasoning.premature_attribution
    competency_key: incident_response
    topic: Avoiding anchoring on early attribution
    difficulty: hard
    text: >-
      Early in an investigation, a teammate matches one indicator to a well-known threat group, and the whole
      team starts looking only for that group's usual techniques. How would you keep the investigation from
      going wrong?
    expected_concepts:
      - indicators are often shared, reused or deliberately planted
      - attribution rarely changes the immediate response
      - keep several hypotheses and test them against evidence
      - look for evidence that contradicts the favoured explanation
      - scope from evidence, not from an expected playbook
    rubric:
      excellent: Explains why a single indicator is weak for attribution, keeps the team on evidence-driven scoping with competing hypotheses and actively looks for disconfirming evidence.
      good: Warns against attributing too early and keeps investigating broadly.
      weak: Accepts the attribution and scopes based only on the group's known techniques.
    followups:
      - When does attribution actually matter during a response?
      - How would you challenge the team without slowing them down?
    common_errors:
      - Letting an early attribution narrow the scoping.
