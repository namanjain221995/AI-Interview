# Curated questions: product and business cases (problem-solving rounds), part 4. Spoken case
# prompts: should we build X, sizing an opportunity, designing a metric, a launch going wrong.
# Evaluation is on the reasoning in the answer only: structure, assumptions, trade-offs, decisions.
version: 1
defaults:
  role_tags: [product_manager, business_analyst, ux_designer]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  - external_key: problem_solving.product_business_cases.templates_gallery_proposal
    competency_key: product_sense
    topic: Questions to ask before approving a feature
    difficulty: easy
    text: >-
      A designer proposes adding a gallery of ready-made templates to your presentation tool. What would you want
      to know before agreeing to build it, and why?
    expected_concepts:
      - which users struggle with starting from a blank page
      - evidence such as time to first presentation or drop-off
      - expected impact on activation or retention
      - cost of creating and maintaining template content
      - a cheap way to test demand first
    rubric:
      excellent: Asks about the specific user problem and evidence for it, the expected impact on a key metric, the ongoing content cost, and proposes a lightweight test before a full build.
      good: Asks sensible questions about value, evidence and effort.
      weak: Approves or rejects based on whether they like templates.
    followups:
      - How could you test demand with a handful of templates?
      - Which metric would you expect templates to move?
    common_errors:
      - Overlooking the ongoing cost of keeping template content fresh.

  - external_key: problem_solving.product_business_cases.size_car_wash_subscription
    competency_key: problem_solving
    topic: Estimating revenue for a subscription service
    difficulty: easy
    text: >-
      A car wash chain wants to offer an unlimited monthly wash subscription in a mid-sized city. How would you
      estimate the revenue it could bring in?
    expected_concepts:
      - number of car owners near the locations
      - share who wash regularly and might subscribe
      - monthly price and expected washes per subscriber
      - cannibalisation of single-wash revenue
      - capacity limits of the sites
    rubric:
      excellent: Builds the estimate from car owners near the sites to likely subscribers and price, nets out lost single-wash revenue, and checks against site capacity.
      good: Reasonable structured estimate with clear assumptions.
      weak: Multiplies the city's population by a price without narrowing.
    followups:
      - How would heavy users affect the economics of an unlimited plan?
      - What price would you test first?
    common_errors:
      - Forgetting that some subscribers were already paying per wash.

  - external_key: problem_solving.product_business_cases.metric_welcome_email_series
    competency_key: product_sense
    topic: Measuring a welcome email series
    difficulty: easy
    text: >-
      Your team built a five-email welcome series for new sign-ups. How would you measure whether it's helping the
      business, rather than just getting opened?
    expected_concepts:
      - tie emails to a key early action or activation
      - holdout group that receives no series
      - downstream metrics such as retention or conversion
      - per-email contribution and drop-off
      - guardrails such as unsubscribes and spam complaints
    rubric:
      excellent: Defines success as a change in activation or conversion, measures it against a holdout, looks at which emails contribute, and watches unsubscribe guardrails.
      good: Uses downstream metrics and some comparison group.
      weak: Reports open and click rates as success.
    followups:
      - How large should the holdout group be?
      - What would you do with an email that has a high unsubscribe rate?
    common_errors:
      - Treating open rate as the outcome.

  - external_key: problem_solving.product_business_cases.bug_hits_some_customers
    competency_key: stakeholder_management
    topic: Communicating about a partial launch issue
    difficulty: easy
    text: >-
      A feature you launched yesterday is broken for about one in ten customers, and the fix will take two days.
      What would you communicate, to whom, and when?
    expected_concepts:
      - identify affected customers and impact
      - inform support and account teams with a clear script
      - proactive message to affected customers with a workaround
      - update internal stakeholders on status and timeline
      - consider disabling the feature for those customers
    rubric:
      excellent: Identifies who is affected, equips support and account teams, proactively informs affected customers with a workaround and timeline, keeps leadership updated, and considers limiting exposure.
      good: Communicates to the right internal and external groups with a timeline.
      weak: Waits for the fix before saying anything.
    followups:
      - Would you turn the feature off for affected customers?
      - How would you word the customer message?
    common_errors:
      - Telling only engineering and leaving support unprepared.

  - external_key: problem_solving.product_business_cases.trial_conversion_fell_after_page
    competency_key: data_analysis
    topic: Conversion falling after a page change
    difficulty: easy
    text: >-
      Two weeks after a pricing page redesign, trial-to-paid conversion has fallen. How would you work out whether
      the redesign is the cause?
    expected_concepts:
      - align timing of the drop with the release
      - check other changes in traffic mix or campaigns
      - compare segments exposed to old and new page if possible
      - review page analytics and user feedback
      - run a test or revert to confirm
    rubric:
      excellent: Checks timing and other concurrent changes, controls for traffic mix, looks at page behaviour and feedback, and confirms causality with a test or temporary revert.
      good: Investigates alternative causes before blaming the redesign.
      weak: Assumes the redesign caused it and reverts without checking.
    followups:
      - What other changes could explain the drop?
      - How would you confirm the cause quickly?
    common_errors:
      - Ignoring changes in who is arriving at the page.

  - external_key: problem_solving.product_business_cases.translate_second_language
    competency_key: product_sense
    topic: Deciding to translate a product
    difficulty: easy
    text: >-
      A team wants to translate your product into a second language to grow in a new market. How would you decide
      whether that investment makes sense?
    expected_concepts:
      - current demand from that market such as traffic and sign-ups
      - cost of translation and ongoing localisation
      - other blockers such as payments, support and regulation
      - competitive landscape there
      - a smaller test such as a translated landing page
    rubric:
      excellent: Uses existing demand signals, accounts for ongoing localisation and support costs, checks other market blockers, and proposes a low-cost test before committing.
      good: Weighs demand against cost and considers a test.
      weak: Assumes translation alone will unlock the market.
    followups:
      - What besides language could block growth there?
      - How would you test demand cheaply?
    common_errors:
      - Treating translation as a one-time cost.

  - external_key: problem_solving.product_business_cases.three_departments_export_requests
    competency_key: requirements_analysis
    topic: Overlapping requests from several departments
    difficulty: easy
    text: >-
      Sales, finance and support have each asked for their own customer data export with slightly different
      fields. How would you decide whether to build one solution or three?
    expected_concepts:
      - understand each department's underlying purpose
      - map the overlap and differences in fields and frequency
      - consider a shared configurable solution
      - data access and privacy differences between teams
      - effort and maintenance comparison
    rubric:
      excellent: Uncovers each team's purpose, maps the overlap, considers a configurable shared solution while respecting access differences, and compares effort and maintenance.
      good: Looks for overlap and proposes a sensible consolidated approach.
      weak: Builds three exports as requested without analysis.
    followups:
      - How would you handle a field only one team should see?
      - What if one team needed the data in real time?
    common_errors:
      - Ignoring that different teams need different data access.

  - external_key: problem_solving.product_business_cases.budgeting_app_social_sharing
    competency_key: product_sense
    topic: Adding a social feature to a private product
    difficulty: medium
    text: >-
      Someone proposes adding social sharing to a personal budgeting app so users can share savings goals with
      friends. How would you evaluate it?
    expected_concepts:
      - fit with the private nature of financial data
      - hypothesis about how sharing helps users reach goals
      - growth effects versus privacy risk
      - research and a small test with opt-in sharing
      - metrics for both goal success and trust
    rubric:
      excellent: Tests the core hypothesis that sharing helps users, weighs growth benefits against the sensitivity of financial data, and proposes opt-in research and a test measuring goal success and trust signals.
      good: Considers fit and privacy and suggests testing.
      weak: Builds it for virality without considering the sensitivity of the data.
    followups:
      - What would sharing need to exclude to feel safe?
      - How would you measure trust?
    common_errors:
      - Assuming social features suit every product category.

  - external_key: problem_solving.product_business_cases.size_product_description_tool
    competency_key: problem_solving
    topic: Sizing an AI tool for small online sellers
    difficulty: medium
    text: >-
      How would you size the market for a tool that writes product descriptions automatically for small online
      shops?
    expected_concepts:
      - number of small online shops and active sellers
      - how often they add products and the pain involved
      - willingness to pay compared with alternatives
      - distribution through e-commerce platforms or app stores
      - cost per description against price
    rubric:
      excellent: Builds the estimate from the number of shops and product listing volume, grounds willingness to pay against free alternatives, considers distribution channels and margins, and gives a realistic range.
      good: Structured estimate with sensible assumptions on shops and price.
      weak: Uses a headline market figure with no link to this specific tool.
    followups:
      - How would free general-purpose AI tools affect willingness to pay?
      - Which distribution channel would you bet on?
    common_errors:
      - Ignoring free alternatives when estimating willingness to pay.

  - external_key: problem_solving.product_business_cases.freelance_marketplace_both_sides
    competency_key: product_sense
    topic: Metrics for both sides of a marketplace
    difficulty: medium
    text: >-
      You've taken over a freelance services marketplace. Which metrics would you use to understand how well it's
      working for both clients and freelancers?
    expected_concepts:
      - liquidity such as share of posted jobs that get hired
      - client outcomes such as repeat hiring and satisfaction
      - freelancer outcomes such as earnings and utilisation
      - balance and concentration of supply and demand
      - overall business metrics such as gross value and take rate
    rubric:
      excellent: Proposes a coherent set covering liquidity, client outcomes, freelancer outcomes and business results, and explains how imbalances would show up.
      good: Covers both sides with relevant metrics.
      weak: Lists only revenue or one side's metrics.
    followups:
      - Which single metric would you look at first each week?
      - How would you spot that supply is too concentrated in a few freelancers?
    common_errors:
      - Ignoring the freelancer side.

  - external_key: problem_solving.product_business_cases.price_test_design_risks
    competency_key: statistics_experimentation
    topic: Designing a price experiment
    difficulty: medium
    text: >-
      You want to test a higher price for your subscription. How would you design the test, and what risks would
      you plan for?
    expected_concepts:
      - randomise new visitors only and keep existing prices stable
      - measure conversion, revenue per visitor and retention
      - duration to capture renewals or churn
      - risk of customers noticing different prices
      - alternatives such as geography or time-based tests
    rubric:
      excellent: Designs a test limited to new visitors with revenue per visitor and retention as key metrics, plans for enough duration, addresses the trust risk of different prices, and considers alternative designs.
      good: Sensible test design with relevant metrics and some risk awareness.
      weak: Measures conversion only or ignores customer trust concerns.
    followups:
      - How would you handle a customer who notices a different price?
      - How long would you run the test?
    common_errors:
      - Deciding on conversion rate without looking at revenue per visitor.

  - external_key: problem_solving.product_business_cases.seat_to_usage_pricing
    competency_key: product_sense
    topic: Moving from per-seat to usage-based pricing
    difficulty: medium
    text: >-
      Your company charges per seat, but customers say they only pay for heavy users and share logins otherwise.
      Leadership wants to explore usage-based pricing. How would you assess the change?
    expected_concepts:
      - choose a usage metric that tracks customer value
      - model revenue impact on existing customers
      - predictability concerns for buyers and budgeting
      - migration plan and grandfathering
      - billing and reporting changes required
    rubric:
      excellent: Picks a value-aligned usage metric, models winners and losers among current customers, addresses predictability with caps or commitments, and plans migration and billing changes.
      good: Considers the metric choice and revenue impact.
      weak: Proposes switching without modelling the effect on existing customers.
    followups:
      - Which customers would pay more under the new model?
      - How would you make costs predictable for buyers?
    common_errors:
      - Choosing a usage metric customers don't see as value.

  - external_key: problem_solving.product_business_cases.session_length_doubled
    competency_key: data_analysis
    topic: Interpreting an ambiguous metric change
    difficulty: medium
    text: >-
      After a release, average session length in your productivity app doubled. Is that good news, and how would
      you find out?
    expected_concepts:
      - longer sessions may mean friction rather than engagement
      - check task completion rates and time per task
      - segment by user type and feature
      - check tracking changes such as session timeout
      - qualitative feedback from users
    rubric:
      excellent: Recognises the ambiguity for a productivity tool, checks task completion and time per task, rules out measurement changes, and segments to find where time increased.
      good: Questions whether longer sessions are good and investigates.
      weak: Celebrates the increase as more engagement.
    followups:
      - What metric would tell you users got more done?
      - How could a tracking change produce this result?
    common_errors:
      - Assuming more time spent always means more value.

  - external_key: problem_solving.product_business_cases.mobile_feature_parity
    competency_key: product_sense
    topic: Deciding on mobile feature parity
    difficulty: medium
    text: >-
      Your mobile app has about half the features of the web product, and some customers are asking for full
      parity. How would you decide what the mobile app should do?
    expected_concepts:
      - understand mobile use cases and contexts
      - usage data on which features matter on the go
      - cost of maintaining parity across platforms
      - designing for mobile rather than copying the web
      - success metrics for the mobile experience
    rubric:
      excellent: Starts from mobile contexts and needs, uses data on which features matter there, rejects blind parity in favour of mobile-appropriate design, and defines success metrics.
      good: Prioritises features for mobile with a clear rationale.
      weak: Commits to full parity or ignores customer requests.
    followups:
      - Which feature would you never put on mobile, and why?
      - How would you research mobile contexts?
    common_errors:
      - Treating feature parity as the goal.

  - external_key: problem_solving.product_business_cases.redesign_complaints_engagement_dip
    competency_key: ux_design
    topic: Complaints after a visual redesign
    difficulty: medium
    text: >-
      After a visual redesign, task completion in testing was fine, but complaints spiked and engagement dropped
      five percent in the first week. What would you do next?
    expected_concepts:
      - separate change aversion from real usability problems
      - analyse complaint themes and affected flows
      - compare new and returning user behaviour over time
      - targeted fixes rather than a full revert
      - decision timeline and criteria
    rubric:
      excellent: Distinguishes temporary change aversion from genuine problems using complaint themes and new versus returning user data, targets fixes at real issues, and sets a time-bound decision with criteria.
      good: Investigates complaints and engagement data before deciding.
      weak: Reverts immediately or dismisses complaints as resistance to change.
    followups:
      - How would new users' behaviour help you decide?
      - How long would you wait before reverting?
    common_errors:
      - Treating all complaints as change aversion.

  - external_key: problem_solving.product_business_cases.custom_enterprise_tier
    competency_key: product_sense
    topic: Designing an enterprise tier
    difficulty: medium
    text: >-
      Sales keeps closing large deals with heavy discounts and one-off promises. They're asking for an enterprise
      tier. How would you design one?
    expected_concepts:
      - understand what large customers value such as security and admin controls
      - standardise common one-off promises into the tier
      - pricing that reduces ad hoc discounting
      - support and service levels included
      - process for handling true custom requests
    rubric:
      excellent: Identifies what large customers repeatedly need, packages those into a standard tier, sets pricing and discount rules to reduce ad hoc deals, and defines a process for exceptional requests.
      good: Proposes a tier based on large customer needs with pricing guidance.
      weak: Creates a tier with arbitrary features or just a higher price.
    followups:
      - Which past promises would you turn into standard features?
      - How would you limit discounting?
    common_errors:
      - Ignoring the sales process that created the problem.

  - external_key: problem_solving.product_business_cases.launch_burdens_ops_team
    competency_key: stakeholder_management
    topic: A successful launch that overloads another team
    difficulty: medium
    text: >-
      A launch you own is hitting its metrics, but the operations team says it has doubled their workload and
      they're falling behind. How would you handle this?
    expected_concepts:
      - understand the new operational tasks and their volume
      - quantify the cost and risk of the backlog
      - short-term relief such as throttling or temporary help
      - product changes to automate or remove the work
      - include operational cost in future launch planning
    rubric:
      excellent: Quantifies the operational burden, provides short-term relief, prioritises product changes that remove the work, and changes launch planning to include operational impact.
      good: Takes the concern seriously and proposes fixes.
      weak: Argues the metrics justify the burden or ignores the ops team.
    followups:
      - Would you slow down the rollout to relieve the team?
      - How would you count operational cost in the launch's success?
    common_errors:
      - Treating the launch as successful while ignoring hidden costs.

  - external_key: problem_solving.product_business_cases.b2b_onboarding_six_weeks
    competency_key: process_modeling
    topic: Shortening a slow customer onboarding
    difficulty: medium
    text: >-
      New B2B customers take about six weeks from signing to going live, mostly through manual steps. How would
      you analyse the process and build a case for shortening it?
    expected_concepts:
      - map the end-to-end onboarding process and owners
      - measure time in each step and waiting time
      - identify bottlenecks and handoffs
      - value of faster time to live such as earlier revenue and less churn
      - prioritise automation or process changes by impact
    rubric:
      excellent: Maps the process with owners, measures where time is lost including waits, quantifies the value of shorter onboarding, and prioritises changes by impact and effort.
      good: Identifies bottlenecks and proposes improvements with expected benefits.
      weak: Proposes automating everything without understanding where time goes.
    followups:
      - How would you measure waiting time between steps?
      - Which customers would benefit most from a faster path?
    common_errors:
      - Focusing on work time and ignoring waiting time.

  - external_key: problem_solving.product_business_cases.ad_tracking_restriction_impact
    competency_key: problem_solving
    topic: Estimating the impact of a platform change
    difficulty: hard
    text: >-
      A major mobile platform announces it will restrict ad tracking. You run an ad-supported app. How would you
      estimate the revenue impact and plan your response?
    expected_concepts:
      - share of revenue dependent on targeted ads on that platform
      - expected drop in ad prices for untargeted inventory
      - effect on user acquisition and its measurement
      - responses such as first-party data and contextual ads
      - scenarios with ranges rather than one number
    rubric:
      excellent: Builds scenarios from revenue exposure and expected price drops, includes acquisition effects, and proposes responses such as first-party data, contextual targeting and revenue diversification.
      good: Estimates exposure and suggests reasonable responses.
      weak: Gives a single guess or ignores the effect on user acquisition.
    followups:
      - Which assumption is most uncertain?
      - How would you build first-party data responsibly?
    common_errors:
      - Ignoring the impact on paid acquisition measurement.

  - external_key: problem_solving.product_business_cases.acquire_startup_or_build
    competency_key: product_sense
    topic: Acquiring a startup versus building
    difficulty: hard
    text: >-
      Your CEO is considering acquiring a small startup instead of building a similar capability in-house. How
      would you help evaluate the decision from a product perspective?
    expected_concepts:
      - fit of the startup's product with your strategy
      - time to market versus integration effort
      - quality of technology and customers acquired
      - cost comparison including integration and retention of the team
      - risks of overlap and customer migration
    rubric:
      excellent: Compares speed and cost of acquisition against building, assesses product fit and technology quality, and accounts for integration, team retention and customer overlap risks.
      good: Weighs speed, fit and integration risks.
      weak: Focuses only on the purchase price or the feature list.
    followups:
      - What would you check in their product before the deal?
      - How would you integrate their customers?
    common_errors:
      - Underestimating integration effort.

  - external_key: problem_solving.product_business_cases.impact_without_randomisation
    competency_key: statistics_experimentation
    topic: Measuring impact of a launch to everyone
    difficulty: hard
    text: >-
      For legal reasons, a new consent flow had to launch to every user on the same day, so there was no A/B test.
      Leadership wants to know its impact on sign-ups. How would you estimate it?
    expected_concepts:
      - before and after with seasonality adjustment
      - comparison groups such as platforms or regions unaffected
      - difference-in-differences or synthetic control
      - interrupted time series modelling
      - be explicit about uncertainty
    rubric:
      excellent: Proposes quasi-experimental methods with suitable comparison groups, adjusts for seasonality and trends, and communicates uncertainty clearly.
      good: Uses a before-and-after comparison with adjustments.
      weak: Compares the week before with the week after.
    followups:
      - What could make a regional comparison misleading?
      - How would you present the uncertainty to leadership?
    common_errors:
      - Ignoring seasonality or concurrent changes.

  - external_key: problem_solving.product_business_cases.ai_feature_wrong_answers_viral
    competency_key: product_sense
    topic: An AI feature failing publicly
    difficulty: hard
    text: >-
      A generative AI assistant you launched gives some confidently wrong answers, and screenshots are spreading on
      social media. How would you handle the next few days and decide the feature's future?
    expected_concepts:
      - assess scale and severity of failures
      - short-term mitigations such as restricting topics or disclaimers
      - consider pausing the feature
      - public communication and customer support
      - quality evaluation and criteria for continuing
    rubric:
      excellent: Assesses scale and harm quickly, applies mitigations or pauses based on severity, coordinates communication, and sets measurable quality criteria for continuing.
      good: Takes containment steps and plans quality improvements.
      weak: Ignores the reputational risk or kills the feature without analysis.
    followups:
      - What quality bar would you set before expanding again?
      - How would you communicate publicly?
    common_errors:
      - Treating it only as a PR problem rather than a quality one.

  - external_key: problem_solving.product_business_cases.declining_core_product_bets
    competency_key: product_sense
    topic: Strategy when the core business declines
    difficulty: hard
    text: >-
      Your core product's revenue is declining about ten percent a year as the market shifts. How would you decide
      where the company should place its next bets?
    expected_concepts:
      - understand why the decline is happening
      - options such as defend, adjacent, or new markets
      - leverage existing assets and customers
      - portfolio approach with staged investment
      - measures and timelines to evaluate bets
    rubric:
      excellent: Diagnoses the decline, evaluates options from defending the core to adjacent opportunities using existing strengths, and proposes a staged portfolio with clear milestones.
      good: Proposes reasonable options with analysis.
      weak: Proposes a single big bet without diagnosis.
    followups:
      - How much would you invest in defending the core?
      - What signal would tell you a bet is working?
    common_errors:
      - Abandoning the core too early.

  - external_key: problem_solving.product_business_cases.internal_tool_as_product
    competency_key: product_sense
    topic: Selling an internal tool externally
    difficulty: hard
    text: >-
      Your company built an internal scheduling tool that works really well, and some partners have asked to buy
      it. How would you decide whether to turn it into an external product?
    expected_concepts:
      - size external demand beyond the asking partners
      - gaps between internal and commercial requirements
      - go-to-market, support and sales capability needed
      - distraction from the core business
      - options such as licensing or spinning off
    rubric:
      excellent: Validates demand beyond a few partners, identifies the work needed to make it commercial, accounts for go-to-market and support needs, weighs distraction, and considers alternative structures.
      good: Weighs demand against the effort to commercialise.
      weak: Assumes the tool can be sold as-is.
    followups:
      - What would the tool need before external customers could use it?
      - Who would own it?
    common_errors:
      - Underestimating support and security requirements for external customers.

  - external_key: problem_solving.product_business_cases.on_premise_deployment_request
    competency_key: product_sense
    topic: Offering an on-premise version
    difficulty: hard
    text: >-
      Several large regulated customers say they'll only buy your cloud product if you offer an on-premise version.
      How would you decide whether to do it?
    expected_concepts:
      - size of the deals and how many customers require it
      - engineering and support cost of a second deployment model
      - slower release cycles and version fragmentation
      - alternatives such as dedicated cloud or regional hosting
      - long-term strategic fit
    rubric:
      excellent: Sizes the revenue opportunity, accounts for the ongoing cost of supporting another deployment model, explores alternatives that meet regulatory needs, and makes a recommendation with conditions.
      good: Weighs revenue against cost and considers alternatives.
      weak: Agrees for revenue without considering long-term cost.
    followups:
      - What alternatives would meet their regulatory needs?
      - How would on-premise affect your release process?
    common_errors:
      - Ignoring the long-term maintenance burden.
