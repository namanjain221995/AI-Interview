# Curated questions: problem solving, process improvement (part 3 of 4).
# Flow and WIP, rollbacks, customer onboarding, distributed handoffs, audits and cross-team problems.
version: 1
defaults:
  role_tags: [project_manager, engineering_manager, qa, devops]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ---------------------------------------------------------------- easy
  - external_key: problem_solving.process_improvement.manual_release_notes
    competency_key: ci_cd
    topic: Release notes written by hand
    difficulty: easy
    text: >-
      Writing release notes takes your team half a day every release, because someone digs through every
      merged change by hand. How would you improve that?
    expected_concepts:
      - consistent commit or pull request conventions
      - generate a draft changelog automatically from merged work
      - label changes as customer-facing or internal
      - a short human edit for the customer-facing summary
      - capture the note when the change is made, not at release time
    rubric:
      excellent: Moves the work to when changes are made through conventions and labels, generates a draft automatically and keeps a brief human edit for the audience-facing summary.
      good: Suggests generating notes from commits or tickets.
      weak: Suggests rotating the chore among team members.
    followups:
      - How would you get developers to follow the labelling convention consistently?
      - Who should review notes that go to customers?
    common_errors:
      - Publishing raw commit messages directly to customers.

  - external_key: problem_solving.process_improvement.standup_forty_minutes
    competency_key: agile_delivery
    topic: Daily stand-up that has grown too long
    difficulty: easy
    text: >-
      Your team's daily stand-up has grown to forty minutes and people have stopped paying attention. How would
      you fix it?
    expected_concepts:
      - refocus on the goal of coordinating today's work
      - walk the board instead of going person by person
      - move detailed discussions to follow-ups with only the people needed
      - a firm time-box
      - check with the team whether the new format helps
    rubric:
      excellent: Refocuses the stand-up on coordination and blockers, walks the board, parks deep discussions for smaller follow-ups, enforces a time-box and adjusts with the team's feedback.
      good: Time-boxes the meeting and moves discussions afterwards.
      weak: Cancels the stand-up or makes it shorter without changing what happens in it.
    followups:
      - Why does walking the board change the conversation compared with individual updates?
      - What would you do if one person regularly turns it into a technical deep dive?
    common_errors:
      - Turning the stand-up into a status report for a manager.

  - external_key: problem_solving.process_improvement.manual_test_data_setup
    competency_key: test_automation
    topic: Testers building test data by hand
    difficulty: easy
    text: >-
      Testers spend the first hour of every test cycle manually creating test accounts and data. How would you
      streamline that?
    expected_concepts:
      - scripts or APIs to create test data on demand
      - reusable data sets or fixtures for common scenarios
      - reset or seed environments automatically
      - avoid copying real customer data
      - share the tooling across the team
    rubric:
      excellent: Builds scripted, on-demand data creation and reusable fixtures, resets environments automatically and uses synthetic rather than real customer data.
      good: Proposes scripts or a shared data set.
      weak: Proposes a shared spreadsheet of existing test accounts.
    followups:
      - What problems come from many testers sharing the same test accounts?
      - Why not just copy production data into the test environment?
    common_errors:
      - Using copies of production data with real personal information.

  - external_key: problem_solving.process_improvement.noisy_overnight_alerts
    competency_key: incident_response
    topic: Overnight alerts that need no action
    difficulty: easy
    text: >-
      On-call engineers get dozens of alerts a night, and most of them need no action at all. How would you
      approach cleaning that up?
    expected_concepts:
      - review alerts over a period and classify actionable versus not
      - delete or downgrade alerts that need no action
      - alert on user-facing symptoms rather than every cause
      - tune thresholds and durations
      - a regular alert review as part of on-call handover
    rubric:
      excellent: Reviews alert history to classify what is actionable, removes or downgrades the rest, moves toward symptom-based alerts with tuned thresholds and builds in a recurring review so noise doesn't return.
      good: Tunes thresholds and removes some noisy alerts.
      weak: Raises all thresholds or silences alerts without checking what they cover.
    followups:
      - How would you make sure you don't remove an alert that matters?
      - Who should own deciding that an alert gets deleted?
    common_errors:
      - Silencing alerts at night without fixing the underlying noise.

  - external_key: problem_solving.process_improvement.repeat_escalations_answered
    competency_key: technical_support
    topic: Escalating questions already answered before
    difficulty: easy
    text: >-
      Support agents keep escalating questions to engineering that have been answered many times before. How
      would you change the process so those answers get reused?
    expected_concepts:
      - capture engineering answers as knowledge-base articles
      - search the knowledge base before escalating
      - an escalation form that asks what was already checked
      - track repeat escalations by topic
      - training for agents on recurring topics
    rubric:
      excellent: Makes capturing answers part of closing an escalation, puts a search step and short checklist before escalation, tracks repeated topics and trains agents on them.
      good: Builds a knowledge base and asks agents to check it first.
      weak: Tells engineers to reject repeat questions.
    followups:
      - Who should write the article, the engineer or the support agent?
      - How would you keep articles accurate after the product changes?
    common_errors:
      - Building a knowledge base without making it part of the escalation workflow.

  - external_key: problem_solving.process_improvement.three_required_reviewers
    competency_key: collaboration
    topic: Mandatory senior reviewers as a bottleneck
    difficulty: easy
    text: >-
      Every pull request in your repository needs approval from one of three specific senior engineers, and
      they've become a bottleneck. How would you change that?
    expected_concepts:
      - understand what risk the rule was protecting against
      - widen the reviewer pool by area of code
      - grow other engineers into reviewers through paired reviews
      - automated checks to catch what reviewers used to catch
      - keep senior review for genuinely risky areas
    rubric:
      excellent: Finds what the rule protects against, widens ownership by area, trains more reviewers through paired reviews, automates mechanical checks and keeps senior review only where risk justifies it.
      good: Adds more approved reviewers.
      weak: Removes the review requirement altogether.
    followups:
      - How would you decide when someone is ready to approve changes in a sensitive area?
      - What could automation take off the reviewers' plate?
    common_errors:
      - Removing the requirement without understanding why it was introduced.

  - external_key: problem_solving.process_improvement.half_sprint_carries_over
    competency_key: agile_delivery
    topic: Half the sprint carrying over
    difficulty: easy
    text: >-
      Half of the stories in every sprint carry over to the next one. How would you work out why, and what
      would you change?
    expected_concepts:
      - look at which stories carry over and their common traits
      - overcommitment versus unplanned work versus oversized stories
      - compare planned capacity with real availability
      - split stories smaller
      - plan to recent actual throughput
    rubric:
      excellent: Examines the carried-over stories for patterns, separates overcommitment, unplanned work and story size as causes, and changes planning to use real throughput and smaller stories.
      good: Suggests committing to less and splitting stories.
      weak: Pushes the team to work harder to finish what was planned.
    followups:
      - How would you account for unplanned work in planning?
      - What would you tell stakeholders while the team adjusts?
    common_errors:
      - Lowering commitments without understanding which cause is behind the carry-over.

  # -------------------------------------------------------------- medium
  - external_key: problem_solving.process_improvement.hour_long_rollbacks
    competency_key: ci_cd
    topic: Slow manual rollbacks
    difficulty: medium
    text: >-
      When a deployment goes wrong, rolling back takes your team about an hour of manual work. How would you go
      about making rollbacks quick and routine?
    expected_concepts:
      - immutable versioned artefacts that can be redeployed
      - one-step automated rollback in the pipeline
      - backward-compatible database migrations (expand and contract)
      - feature flags to switch off changes without redeploying
      - practise rollbacks regularly
    rubric:
      excellent: Makes rollback a one-step pipeline action using versioned artefacts, deals with database changes through backward-compatible migrations, adds feature flags and practises rollbacks so they're routine.
      good: Automates rollback in the pipeline.
      weak: Writes a more detailed manual rollback procedure.
    followups:
      - What makes database changes the hardest part of rolling back?
      - How would you decide between rolling back and rolling forward?
    common_errors:
      - Forgetting that schema migrations can make a rollback impossible.

  - external_key: problem_solving.process_improvement.everyone_juggling_items
    competency_key: agile_delivery
    topic: Too much work in progress
    difficulty: medium
    text: >-
      Your board shows every engineer working on three or four items at once, and very little gets finished
      each week. How would you approach this?
    expected_concepts:
      - make work in progress visible and measure cycle time
      - explain why multitasking slows finishing
      - work-in-progress limits per stage or per person
      - swarm on blocked or nearly done items
      - find what causes items to get stuck in the first place
    rubric:
      excellent: Makes WIP and cycle time visible, explains the cost of switching, introduces limits with the team, encourages finishing before starting and digs into why items block in the first place.
      good: Introduces WIP limits and focuses on finishing work.
      weak: Asks engineers to prioritise better on their own.
    followups:
      - What would you do when an item is blocked by another team and the WIP limit is reached?
      - How would you pick the right limit?
    common_errors:
      - Setting WIP limits without addressing the blockers that cause items to pile up.

  - external_key: problem_solving.process_improvement.customer_go_live_six_weeks
    competency_key: problem_solving
    topic: Slow customer onboarding across departments
    difficulty: medium
    text: >-
      Getting a new business customer live on your product takes six weeks and involves sales, implementation,
      engineering and support, with a lot of waiting in between. How would you go about shortening it?
    expected_concepts:
      - map the steps and handoffs across departments
      - measure waiting versus working time per step
      - identify information gathered late that could be collected at sale
      - automate or standardise repeated configuration work
      - a single owner for the customer's onboarding
    rubric:
      excellent: Maps the journey across departments, quantifies where waiting happens, moves information gathering earlier, standardises or automates repeated work and gives each onboarding one accountable owner.
      good: Maps the process and identifies some delays.
      weak: Suggests adding staff to the implementation team without analysing the flow.
    followups:
      - How would you involve the customer in finding where time is lost?
      - What would you do if engineering work is needed for every new customer?
    common_errors:
      - Looking only at one department instead of the handoffs between them.

  - external_key: problem_solving.process_improvement.requirements_misread_late
    competency_key: testing
    topic: Requirement misunderstandings found in testing
    difficulty: medium
    text: >-
      QA often discovers during testing that they understood a feature's requirements differently from the
      developers. How would you change the process so those misunderstandings surface earlier?
    expected_concepts:
      - developers, QA and product refining stories together
      - concrete examples and acceptance criteria agreed up front
      - test cases or scenarios reviewed before coding
      - a quick kickoff when a story starts
      - capture clarifications in the ticket
    rubric:
      excellent: Brings developers, QA and product together before coding, agrees concrete examples as acceptance criteria, reviews test scenarios early and records clarifications so everyone works from the same understanding.
      good: Involves QA in refinement and writes clearer acceptance criteria.
      weak: Asks product to write longer specifications.
    followups:
      - Can you give an example of an acceptance criterion written as a concrete example?
      - What would you do if product isn't available for refinement?
    common_errors:
      - Relying on longer documents instead of shared conversations and examples.

  - external_key: problem_solving.process_improvement.postmortems_feel_like_blame
    competency_key: incident_response
    topic: Postmortems that feel like a hunt for culprits
    difficulty: medium
    text: >-
      Engineers on your team have started avoiding postmortems because they feel like a hunt for who caused
      the problem. How would you change the way incidents are reviewed?
    expected_concepts:
      - explicitly blameless format focused on systems and decisions
      - ask what made the action seem reasonable at the time
      - trained facilitator, not the most senior person
      - action items about systems and process, not individuals
      - leadership modelling the approach
    rubric:
      excellent: Moves to a blameless format with a trained facilitator, focuses on why actions made sense at the time and on system fixes, and gets leaders to model the behaviour so the change is credible.
      good: Introduces a blameless postmortem template.
      weak: Stops holding postmortems for minor incidents to avoid the conflict.
    followups:
      - How do you handle a case where someone really did ignore a clear procedure?
      - What questions would you ask in the review to keep it constructive?
    common_errors:
      - Declaring postmortems blameless while still naming culprits in the summary.

  - external_key: problem_solving.process_improvement.dependency_upgrades_neglected
    competency_key: ci_cd
    topic: Dependency upgrades nobody owns
    difficulty: medium
    text: >-
      Your services are years behind on dependency upgrades because nobody owns that work, and each upgrade is
      now a big, risky project. How would you set up a process that keeps them current?
    expected_concepts:
      - automated update pull requests
      - good test coverage that catches upgrade breakage before merge
      - small, frequent upgrades instead of big jumps
      - clear ownership per service
      - reserved capacity and tracking of how far behind each service is
    rubric:
      excellent: Combines automated update tooling, test coverage that makes merging safe, clear ownership and reserved capacity, and tracks how far behind each service is to catch drift early.
      good: Introduces automated update tools and assigns owners.
      weak: Plans a one-off upgrade project with no ongoing process.
    followups:
      - How would you handle a major version upgrade that needs real code changes?
      - How would you prioritise security updates versus routine ones?
    common_errors:
      - Turning on automated update pull requests that nobody reviews or merges.

  - external_key: problem_solving.process_improvement.single_qa_signoff
    competency_key: test_automation
    topic: One QA lead approving every release
    difficulty: medium
    text: >-
      A single QA lead has to sign off every release, and releases wait days for their approval. How would you
      remove that bottleneck while keeping quality checks meaningful?
    expected_concepts:
      - understand what the lead actually checks
      - turn repeatable checks into automated gates
      - define explicit release criteria others can apply
      - distribute sign-off to team members with training
      - keep the lead's review for high-risk releases
    rubric:
      excellent: Makes the lead's implicit checks explicit, automates the repeatable ones, spreads sign-off using agreed criteria and keeps the lead focused on high-risk releases and improving the criteria.
      good: Adds more people who can sign off.
      weak: Removes the sign-off requirement or asks the lead to work faster.
    followups:
      - How would you know the new criteria are as good as the lead's judgement?
      - What would the lead's role look like after the change?
    common_errors:
      - Spreading sign-off without agreeing what it actually means.

  - external_key: problem_solving.process_improvement.time_zone_overnight_stalls
    competency_key: collaboration
    topic: Handoffs across time zones
    difficulty: medium
    text: >-
      Your team is split across two time zones with only an hour of overlap, and work often stalls overnight
      waiting for an answer. How would you improve the handoffs between the two halves of the team?
    expected_concepts:
      - written end-of-day handoff with questions and decisions needed
      - use the overlap hour for decisions and unblocking only
      - give each location ownership of whole pieces of work
      - clear decision rights so people can proceed without waiting
      - documented context in tickets
    rubric:
      excellent: Reduces dependencies by giving each location whole pieces of work, adds structured written handoffs, reserves the overlap for decisions and sets decision rights so people can continue without waiting.
      good: Introduces written handoffs and better use of the overlap.
      weak: Asks people to stay late to cover the gap.
    followups:
      - How would you split work to reduce dependencies between locations?
      - What would you put in an end-of-day handoff?
    common_errors:
      - Expecting people to extend their working hours instead of redesigning handoffs.

  - external_key: problem_solving.process_improvement.inconsistent_ticket_priority
    competency_key: technical_support
    topic: Inconsistent support priorities
    difficulty: medium
    text: >-
      Support agents set ticket priority based on how loudly the customer complains, so engineering now treats
      every escalation as urgent. How would you bring consistency to prioritisation?
    expected_concepts:
      - objective severity definitions based on impact and scope
      - examples for each level
      - separate customer importance from technical severity
      - review a sample of tickets to calibrate
      - engineering and support agreeing the definitions together
    rubric:
      excellent: Defines severity by objective impact and scope with examples, separates business importance from severity, agrees the definitions jointly with engineering and calibrates by reviewing real tickets.
      good: Writes priority definitions and trains agents on them.
      weak: Has engineering re-prioritise every ticket itself.
    followups:
      - How would you handle a high-value customer with a low-severity issue?
      - How often would you review whether the levels are being applied consistently?
    common_errors:
      - Defining severity levels without concrete examples, so each agent interprets them differently.

  - external_key: problem_solving.process_improvement.did_the_change_help
    competency_key: problem_solving
    topic: Judging whether a process change worked
    difficulty: medium
    text: >-
      You rolled out a change to your team's code review process, and three months later opinions are split on
      whether it helped. How would you work out whether it actually made things better?
    expected_concepts:
      - go back to the original problem and goal
      - compare measures before and after, such as review time and defects
      - account for other changes in the same period
      - combine data with structured feedback from the team
      - decide in advance what result would mean keep, adjust or revert
    rubric:
      excellent: Anchors the evaluation in the original goal, compares before and after data while considering other changes, adds structured feedback and makes a clear keep, adjust or revert decision.
      good: Compares before and after numbers and asks the team.
      weak: Goes with the majority opinion or the most vocal voices.
    followups:
      - What would you do if the data and the team's feelings disagree?
      - What would you set up differently next time before making a change?
    common_errors:
      - Not having a baseline, which makes the change impossible to judge.

  - external_key: problem_solving.process_improvement.plans_twice_capacity
    competency_key: project_management
    topic: Quarterly plans twice what ships
    difficulty: medium
    text: >-
      Your quarterly plans are always about twice as ambitious as what actually ships. How would you improve
      the planning process so commitments become realistic?
    expected_concepts:
      - compare past plans against actual delivery
      - account for unplanned work, support and leave in capacity
      - separate firm commitments from stretch goals
      - plan in smaller increments and re-plan mid-quarter
      - make trade-offs explicit with stakeholders
    rubric:
      excellent: Uses past plan-versus-actual data to set realistic capacity, accounts for unplanned work, separates commitments from stretch goals and makes trade-offs visible to stakeholders with checkpoints to re-plan.
      good: Plans with less scope and builds in buffer.
      weak: Keeps the same planning approach and asks for more effort.
    followups:
      - How would you handle a stakeholder who insists everything is a commitment?
      - What would you show leadership to explain the change?
    common_errors:
      - Adding a flat buffer without understanding where the gap comes from.

  - external_key: problem_solving.process_improvement.manual_regression_three_days
    competency_key: test_automation
    topic: Deciding what to automate in manual regression
    difficulty: medium
    text: >-
      Every release requires two testers to spend three days on a manual regression checklist. How would you
      decide what to automate and what to keep manual?
    expected_concepts:
      - rank checks by frequency, risk and how stable the feature is
      - automate stable, repetitive, high-value checks first
      - choose the right level (unit, API, UI) for each check
      - keep exploratory and usability testing manual
      - remove checks that no longer find bugs
    rubric:
      excellent: Ranks the checklist by risk, frequency and stability, automates the best candidates at the lowest sensible level, keeps exploratory testing manual and prunes checks that no longer add value.
      good: Automates the most repetitive checks first.
      weak: Tries to automate the whole checklist through the UI in one go.
    followups:
      - Which checks would you deliberately keep manual?
      - How would you measure whether the automation is paying off?
    common_errors:
      - Automating everything at the UI level, producing a slow and brittle suite.

  # ---------------------------------------------------------------- hard
  - external_key: problem_solving.process_improvement.audit_evidence_releases
    competency_key: ci_cd
    topic: Release process that satisfies auditors
    difficulty: hard
    text: >-
      Your company is preparing for an audit that requires evidence of review and approval for every production
      change, and today that evidence lives in scattered chats and people's memory. How would you redesign the
      release process to satisfy auditors without slowing teams down?
    expected_concepts:
      - understand the actual control requirements with compliance
      - enforce review through branch protection and pipeline rules
      - automatic, tamper-evident audit trail from the pipeline
      - separation of duties where required
      - a defined path for emergency changes with after-the-fact review
      - pilot and show evidence to compliance before rolling out
    rubric:
      excellent: Works with compliance to pin down the real control requirements, builds them into the pipeline so evidence is produced automatically, handles separation of duties and emergencies explicitly, and validates the approach with auditors early.
      good: Enforces reviews and approvals in tooling and keeps logs.
      weak: Adds a manual approval form or spreadsheet for every change.
    followups:
      - How would you handle separation of duties in a small team?
      - What would you do with changes made outside the pipeline?
    common_errors:
      - Assuming compliance requires manual sign-off rather than reliable automated controls.

  - external_key: problem_solving.process_improvement.cross_team_incident_command
    competency_key: incident_response
    topic: Unclear command in multi-team incidents
    difficulty: hard
    text: >-
      During a major incident last month that spanned three teams, ownership changed hands several times and
      nobody knew who was making decisions. How would you redesign your incident process so that doesn't
      happen again?
    expected_concepts:
      - clear incident roles such as incident commander, communications and operations
      - explicit, announced handover of command
      - one coordination channel and a running log
      - severity levels that trigger the right roles
      - training and practice drills across teams
      - review the last incident to find where it broke down
    rubric:
      excellent: Establishes defined incident roles with explicit command handover, a single channel and log, severity-based activation, cross-team training and drills, grounded in a review of what broke down last time.
      good: Introduces an incident commander role and a shared channel.
      weak: Proposes that the most senior engineer present always takes over.
    followups:
      - How would you train people to act as incident commander?
      - When should command move from one person to another?
    common_errors:
      - Having the incident commander also do the hands-on debugging.

  - external_key: problem_solving.process_improvement.self_service_not_adopted
    competency_key: problem_solving
    topic: Self-service platform teams don't use
    difficulty: hard
    text: >-
      Your team built a self-service deployment platform, but most product teams still file tickets asking your
      team to deploy for them. How would you work out why, and how would you drive adoption?
    expected_concepts:
      - talk to product teams and watch them try the platform
      - find friction such as missing features, documentation or permissions
      - adoption measures per team
      - migrate teams with hands-on help and early champions
      - eventually retire the ticket path
    rubric:
      excellent: Treats the platform as a product, researches why teams don't use it, removes the main friction, measures adoption, helps teams migrate with champions and phases out the ticket path once the platform is good enough.
      good: Improves documentation and offers training.
      weak: Stops accepting tickets immediately to force adoption.
    followups:
      - What would you do if the platform is missing a feature one big team needs?
      - When is it reasonable to stop accepting deployment tickets?
    common_errors:
      - Assuming teams are resistant when the platform is actually hard to use.

  - external_key: problem_solving.process_improvement.fix_ticket_drivers_at_source
    competency_key: technical_support
    topic: Case for fixing product issues behind tickets
    difficulty: hard
    text: >-
      Ticket volume keeps rising, support leadership wants more headcount, and you suspect most tickets come
      from a handful of product problems. How would you build the case and change the process so those problems
      get fixed at the source?
    expected_concepts:
      - categorise tickets by root cause and quantify each
      - estimate the cost of each driver in support time
      - present a ranked list to product and engineering
      - a recurring forum where top drivers get prioritised
      - track ticket volume after fixes to show impact
    rubric:
      excellent: Quantifies ticket drivers and their cost, presents a ranked business case, sets up a recurring mechanism for product to act on the top drivers and shows the impact of fixes on volume.
      good: Analyses tickets by cause and shares the top issues with product.
      weak: Argues for or against headcount without data on causes.
    followups:
      - How would you categorise tickets reliably when agents tag them inconsistently?
      - What would convince a product team to prioritise a fix over new features?
    common_errors:
      - Sharing a one-off report without a recurring way for product to act on it.

  - external_key: problem_solving.process_improvement.fix_process_under_deadline
    competency_key: project_management
    topic: Process improvement under deadline pressure
    difficulty: hard
    text: >-
      Your team is under pressure to hit a major deadline, yet the process problems slowing it down are
      obvious. How would you decide which improvements to make now and which to defer?
    expected_concepts:
      - estimate how much each problem costs before the deadline
      - prefer quick, low-risk changes that pay back before the deadline
      - defer disruptive changes until after
      - record deferred problems so they are not forgotten
      - communicate the trade-off to stakeholders
    rubric:
      excellent: Weighs each improvement's payback before the deadline against its disruption, makes the quick low-risk wins now, schedules the rest explicitly for afterwards and explains the trade-off to stakeholders.
      good: Picks a few quick wins and defers the rest.
      weak: Either changes nothing until after the deadline or attempts a large process overhaul mid-crunch.
    followups:
      - Give me an example of a change worth making even two weeks before a deadline.
      - How would you make sure the deferred work actually happens?
    common_errors:
      - Assuming all process change must wait until after the deadline.

  - external_key: problem_solving.process_improvement.problems_between_teams
    competency_key: agile_delivery
    topic: Cross-team problems no retro catches
    difficulty: hard
    text: >-
      Each of your six teams runs its own retrospective, but the biggest problems sit between teams and never
      get raised anywhere. How would you set up a way to find and fix cross-team process problems?
    expected_concepts:
      - a regular cross-team retrospective with representatives
      - collect themes that appear in several team retros
      - shared measures of flow across teams
      - owners with authority for cross-team actions
      - follow-up and visibility of progress
    rubric:
      excellent: Creates a cross-team forum fed by recurring themes from team retros and shared flow data, gives cross-team actions owners with the authority to act and tracks them visibly.
      good: Introduces a periodic cross-team retrospective.
      weak: Asks each team to raise cross-team issues in their own retro.
    followups:
      - Who should attend a cross-team retrospective, and how often?
      - What would you do when a problem's fix needs a decision above all the teams?
    common_errors:
      - Creating a forum without anyone empowered to act on what it finds.
