# Curated questions: problem solving, process improvement (part 2 of 4).
# Onboarding, handoffs between teams, support flow and knowledge silos.
version: 1
defaults:
  role_tags: [project_manager, engineering_manager, qa, devops]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ---------------------------------------------------------------- easy
  - external_key: problem_solving.process_improvement.stale_onboarding_guide
    competency_key: mentoring
    topic: Onboarding guide nobody maintains
    difficulty: easy
    text: >-
      The onboarding guide for your team is two years out of date, and every new hire ends up asking the same
      people the same questions. How would you get onboarding documentation into a state that stays current?
    expected_concepts:
      - collect the questions new hires actually ask
      - have each new hire fix what they find wrong as part of onboarding
      - a named owner and a regular review
      - keep it short and link to living sources instead of copying them
      - note which questions still need a person to answer
    rubric:
      excellent: Rebuilds the guide around the questions people really ask, makes new hires update it as they go, gives it an owner and review rhythm, and keeps it short by linking to sources of truth.
      good: Updates the guide and assigns someone to maintain it.
      weak: Rewrites the guide once with no plan to keep it current.
    followups:
      - Why do you think onboarding docs go stale so quickly?
      - What would you leave out of the guide on purpose?
    common_errors:
      - Copying details that change often into the guide instead of linking to them.

  - external_key: problem_solving.process_improvement.qa_local_setup_weeks
    competency_key: test_automation
    topic: Slow setup for new QA engineers
    difficulty: easy
    text: >-
      A new QA engineer joins and needs three weeks before they can run the automated test suite on their own
      machine. How would you shorten that?
    expected_concepts:
      - find out which setup steps take the time
      - scripted or containerised setup of the test environment
      - documented, tested setup instructions
      - shared test data and credentials handled safely
      - have the next new hire follow the setup to confirm it works
    rubric:
      excellent: Finds the slow steps, scripts or containerises the environment, documents the remaining steps and proves it by having the next new joiner set up from scratch.
      good: Proposes a setup script or container and better documentation.
      weak: Assigns someone to sit with each new hire and do the setup for them every time.
    followups:
      - How would you keep the setup script working as the project changes?
      - What would you do about tests that depend on paid third-party sandboxes?
    common_errors:
      - Writing setup docs once and never testing them on a fresh machine.

  - external_key: problem_solving.process_improvement.support_shift_handoff
    competency_key: technical_support
    topic: Customers repeating themselves across shifts
    difficulty: easy
    text: >-
      Your support team works across two shifts, and customers often have to repeat their problem when a
      ticket moves from one shift to the next. How would you improve that handoff?
    expected_concepts:
      - a standard internal summary on each open ticket
      - clear ownership of each ticket across shifts
      - a short handover between shift leads for high-priority cases
      - capture what has already been tried
      - spot-check tickets to see whether customers still repeat themselves
    rubric:
      excellent: Introduces a short standard ticket summary of the problem, what was tried and next steps, clear ownership across shifts and a live handover for urgent cases, then checks a sample of tickets to see if it worked.
      good: Proposes internal notes or a handover meeting.
      weak: Asks agents to read the full ticket history more carefully.
    followups:
      - What would a good internal summary contain?
      - How would you handle a customer who is mid-conversation when a shift ends?
    common_errors:
      - Relying on long free-text histories that the next agent won't read.

  - external_key: problem_solving.process_improvement.status_meeting_overload
    competency_key: project_management
    topic: Status meetings repeating the tracker
    difficulty: easy
    text: >-
      Your team spends several hours a week in status meetings that mostly repeat what's already in the
      tracker. How would you change the way status gets shared?
    expected_concepts:
      - find out who needs status and what decisions they use it for
      - a written or dashboard update for routine status
      - keep meetings for blockers, risks and decisions
      - make the tracker reliable enough to trust
      - check after a few weeks whether people get what they need
    rubric:
      excellent: Works out who uses status and for what, moves routine updates to written or dashboard form, keeps short meetings for blockers and decisions, and makes sure the tracker is trustworthy enough to replace the meetings.
      good: Replaces some meetings with written updates.
      weak: Cancels the meetings without giving stakeholders another way to stay informed.
    followups:
      - What would you do if a senior stakeholder insists on a weekly meeting?
      - How would you keep the tracker accurate enough to rely on?
    common_errors:
      - Removing meetings while the tracker is still unreliable.

  - external_key: problem_solving.process_improvement.slow_prod_access_requests
    competency_key: problem_solving
    topic: Slow access requests for troubleshooting
    difficulty: easy
    text: >-
      Getting read access to a production database for troubleshooting takes a ticket, two approvals and
      usually three days. How would you look for ways to speed that up while keeping it controlled?
    expected_concepts:
      - understand why each approval exists
      - time-limited, just-in-time access with automatic expiry
      - pre-approved roles for on-call engineers
      - audit logging instead of upfront approval for low-risk access
      - safer alternatives such as read replicas or masked data
    rubric:
      excellent: Understands the purpose of each approval, then proposes time-limited access with audit logging, pre-approved roles for on-call and safer alternatives like masked replicas, keeping strict approval for high-risk access.
      good: Suggests automating approvals or creating standing roles for some people.
      weak: Suggests giving everyone permanent access or accepts the delay.
    followups:
      - Who would you talk to before changing the approval steps?
      - How would you handle access to data that includes personal information?
    common_errors:
      - Removing controls without understanding the risk they address.

  - external_key: problem_solving.process_improvement.stories_reopened_done
    competency_key: agile_delivery
    topic: Done stories that get reopened
    difficulty: easy
    text: >-
      Stories on your team are regularly marked done and then reopened because documentation, tests or
      monitoring were missing. How would you deal with that?
    expected_concepts:
      - agree an explicit definition of done with the team
      - keep it short and checkable
      - build the checks into the workflow or pull request template
      - review reopened stories to see which items are most often missed
      - revisit the definition as the team learns
    rubric:
      excellent: Works with the team to agree a short, checkable definition of done, builds it into the workflow and reviews reopened stories to target the most common misses.
      good: Introduces a definition of done.
      weak: Tells people to be more careful before closing stories.
    followups:
      - How would you stop the definition of done from growing into a long checklist?
      - Who decides when a story meets it?
    common_errors:
      - Writing a definition of done that nobody looks at when closing work.

  - external_key: problem_solving.process_improvement.runbooks_out_of_date
    competency_key: incident_response
    topic: Missing or outdated runbooks
    difficulty: easy
    text: >-
      During incidents, on-call engineers often can't find a runbook, or the one they find no longer matches
      the system. How would you improve that?
    expected_concepts:
      - link runbooks directly from alerts
      - a consistent location and format
      - update runbooks as part of incident follow-up
      - owners per service and periodic review or game days
      - automate runbook steps where it makes sense
    rubric:
      excellent: Links runbooks from the alerts themselves, keeps them in one place with owners, updates them after every incident that exposes a gap and exercises them in drills, automating repetitive steps over time.
      good: Centralises runbooks and assigns owners.
      weak: Asks someone to write runbooks for everything in one go.
    followups:
      - How would you test that a runbook still works?
      - Which alerts would you write runbooks for first?
    common_errors:
      - Writing runbooks once without a trigger to update them when systems change.

  - external_key: problem_solving.process_improvement.duplicate_known_issue_tickets
    competency_key: technical_support
    topic: Duplicate tickets for known issues
    difficulty: easy
    text: >-
      Your support queue is full of duplicate tickets about the same few known issues. How would you reduce
      that load?
    expected_concepts:
      - tag and count tickets by root issue
      - a status page or in-product notice for known problems
      - link duplicates to one master ticket
      - prepared responses for known issues
      - push engineering to fix the top recurring issues
    rubric:
      excellent: Quantifies tickets per known issue, tells customers proactively through a status page or in-product notice, links duplicates to one master ticket, uses prepared responses and takes the numbers to engineering to get the top issues fixed.
      good: Uses known-issue articles and links duplicates together.
      weak: Closes duplicates quickly without addressing why they keep arriving.
    followups:
      - How would you use the ticket counts to influence engineering priorities?
      - What would you put in a known-issue notice?
    common_errors:
      - Treating it as a queue-handling problem instead of a product problem.

  # -------------------------------------------------------------- medium
  - external_key: problem_solving.process_improvement.dev_ops_handoff_wall
    competency_key: ci_cd
    topic: Development throwing builds over the wall to operations
    difficulty: medium
    text: >-
      In your organisation, developers finish a feature and hand a package to an operations team to deploy,
      and production problems often bounce back and forth between them. How would you start changing that
      arrangement?
    expected_concepts:
      - map the current handoff and where problems bounce
      - shared ownership of deployment and production behaviour
      - a common automated pipeline both teams contribute to
      - developers taking part in on-call or production reviews
      - start with one service as a pilot
    rubric:
      excellent: Maps where the handoff fails, then moves toward shared ownership through a common pipeline, joint incident reviews and developer involvement in production, starting with a pilot service.
      good: Proposes automation and more collaboration between the teams.
      weak: Adds a more detailed handoff document between the two teams.
    followups:
      - How would you handle operations engineers who worry about losing their role?
      - What would you measure to show the pilot is working?
    common_errors:
      - Renaming the operations team as DevOps without changing who owns what.

  - external_key: problem_solving.process_improvement.slow_ramp_up_new_engineers
    competency_key: people_management
    topic: Two months before new hires contribute
    difficulty: medium
    text: >-
      New engineers on your team typically take about two months before they ship anything meaningful. How
      would you work out why, and what would you change?
    expected_concepts:
      - talk to recent hires about what slowed them down
      - measure milestones such as first commit, first deploy, first owned feature
      - local setup and access as common blockers
      - codebase complexity and missing architecture overviews
      - planned ramp-up path with mentoring and scoped tasks
    rubric:
      excellent: Gathers evidence from recent hires and onboarding milestones, finds the specific blockers such as setup, missing context or poorly scoped tasks, and designs a ramp-up path with mentoring and measured progress.
      good: Suggests a buddy system, better docs and starter tasks.
      weak: Assumes the new hires are the problem or that two months is normal without investigating.
    followups:
      - What would you expect a new engineer to have done by the end of their first month?
      - How would you balance mentoring time against the team's delivery commitments?
    common_errors:
      - Treating slow ramp-up as an individual issue instead of a team process issue.

  - external_key: problem_solving.process_improvement.support_bug_feedback_loop
    competency_key: technical_support
    topic: Customer bugs lost between support and engineering
    difficulty: medium
    text: >-
      Bugs reported by customers through support take weeks to get fixed, and support agents have no idea
      what's happening with them in the meantime. How would you redesign the flow from support ticket to
      engineering fix and back?
    expected_concepts:
      - link support tickets to engineering issues
      - a triage step with clear severity and ownership
      - status changes flowing back to support automatically
      - a target time for each severity
      - closing the loop with the customer when fixed
    rubric:
      excellent: Links tickets to engineering issues, adds triage with severity and owners, makes status flow back automatically and closes the loop with customers, with time targets per severity.
      good: Links tickets to bugs and adds a triage meeting.
      weak: Asks support to chase engineering for updates.
    followups:
      - How would you decide which customer bugs jump ahead of planned work?
      - What would you do with bugs engineering decides not to fix?
    common_errors:
      - Relying on manual updates that stop happening once things get busy.

  - external_key: problem_solving.process_improvement.contractor_system_handover
    competency_key: project_management
    topic: Taking over a system from a contractor team
    difficulty: medium
    text: >-
      A contractor team is handing over a system to your team in six weeks, at the end of their engagement. How
      would you plan that handover so you're not left with a system nobody understands?
    expected_concepts:
      - inventory of code, infrastructure, credentials and documentation
      - your team doing real work on the system with contractors alongside
      - shadowing and then reverse shadowing of operations and deployments
      - acceptance criteria for handover completeness
      - list of known issues and risks
    rubric:
      excellent: Plans a staged handover in which the receiving team progressively takes over real work, with an inventory, explicit acceptance criteria, a known-issues list and practice at deploying and operating before the contractors leave.
      good: Plans knowledge-transfer sessions and documentation review.
      weak: Relies on a final handover document and a single walkthrough meeting.
    followups:
      - What would you do if, in week five, it's clear your team isn't ready?
      - How would you verify you have all the credentials and access you need?
    common_errors:
      - Leaving hands-on work until the contractors are already gone.

  - external_key: problem_solving.process_improvement.long_estimation_debates
    competency_key: agile_delivery
    topic: Planning sessions stuck in estimation debates
    difficulty: medium
    text: >-
      Sprint planning on your team regularly runs over two hours because people argue about estimates. How
      would you make planning faster and more useful?
    expected_concepts:
      - refine and split stories before planning
      - treat large disagreements as a signal of unclear scope
      - time-box discussion per item
      - consider lighter approaches such as counting items or sizing roughly
      - focus planning on the sprint goal rather than exact numbers
    rubric:
      excellent: Moves understanding work into refinement, treats estimate disagreements as a sign of unclear scope, time-boxes discussion and considers lighter sizing approaches, keeping planning focused on a goal.
      good: Adds refinement before planning and time-boxes the session.
      weak: Lets the most senior person set the estimates to save time.
    followups:
      - What does a big disagreement in estimates usually tell you?
      - Have you seen a team work well without estimating at all?
    common_errors:
      - Spending effort on precise estimates the team doesn't use for any decision.

  - external_key: problem_solving.process_improvement.release_awareness_gap
    competency_key: project_management
    topic: Support and sales surprised by releases
    difficulty: medium
    text: >-
      Support and sales keep finding out about product changes from customers rather than from your team. How
      would you set up a process so the right people know what's shipping and when?
    expected_concepts:
      - identify who needs to know and how much notice they need
      - release notes or a changelog generated from the work
      - advance notice for customer-facing changes
      - a short internal briefing or enablement for big changes
      - feedback from support and sales on whether it works
    rubric:
      excellent: Identifies each audience's needs and lead time, builds release communication into the delivery process with notes and advance notice, adds briefings for significant changes and checks with the audiences that it works.
      good: Introduces release notes and a distribution list.
      weak: Asks support and sales to check the tracker themselves.
    followups:
      - How would this work if your team deploys several times a day?
      - Who should own writing the customer-facing explanation?
    common_errors:
      - Sending the same technical change list to every audience.

  - external_key: problem_solving.process_improvement.untrusted_bug_backlog
    competency_key: testing
    topic: Eight hundred open bugs nobody trusts
    difficulty: medium
    text: >-
      Your bug backlog has grown to eight hundred open items, and nobody trusts it to show what matters. How
      would you set up a triage process that keeps it useful?
    expected_concepts:
      - a one-off cleanup closing stale, duplicate and unreproducible bugs
      - clear severity and priority definitions
      - a regular triage session with product, engineering and QA
      - rules for how long low-priority bugs stay open
      - tracking incoming versus closed bugs
    rubric:
      excellent: Combines a one-off cleanup with clear severity definitions, a regular cross-functional triage and explicit rules for closing old low-priority bugs, and tracks the inflow and outflow to keep it under control.
      good: Proposes a cleanup and regular triage meeting.
      weak: Proposes a big bug-fixing sprint without changing how bugs are triaged.
    followups:
      - How would you handle people who object to closing bugs that aren't fixed?
      - Who should be in the triage session, and how often should it run?
    common_errors:
      - Cleaning up once and letting the backlog grow back.

  - external_key: problem_solving.process_improvement.escaped_defect_blame
    competency_key: collaboration
    topic: Escaped defects causing blame between dev and QA
    difficulty: medium
    text: >-
      Every time a bug escapes to production, developers and QA argue over whose fault it was. How would you
      change the process so escaped defects lead to improvement instead?
    expected_concepts:
      - shared ownership of quality across development and QA
      - a short blameless review of significant escaped defects
      - ask which check could have caught it earliest
      - feed findings into tests, reviews or requirements
      - track escaped defects by cause rather than by person
    rubric:
      excellent: Reframes quality as shared, runs short blameless reviews that ask where the defect could have been caught earliest, turns findings into concrete changes and tracks causes rather than individuals.
      good: Proposes blameless reviews of escaped bugs.
      weak: Proposes assigning responsibility more clearly so the right person can be held accountable.
    followups:
      - How would you decide which escaped bugs are worth a review?
      - What would you do if one cause keeps showing up?
    common_errors:
      - Measuring QA or developers individually on escaped bugs, which deepens the blame.

  - external_key: problem_solving.process_improvement.slow_ci_batching
    competency_key: ci_cd
    topic: Slow CI pushing developers to batch changes
    difficulty: medium
    text: >-
      Your continuous integration pipeline takes forty-five minutes, and developers batch up changes to avoid
      waiting for it. How would you go about bringing that time down?
    expected_concepts:
      - profile the pipeline to find the slowest stages
      - caching dependencies and build outputs
      - parallelise test jobs
      - run only the checks affected by the change
      - set a target time and monitor it
    rubric:
      excellent: Profiles the pipeline before changing it, tackles the biggest stages with caching, parallelism and change-based selection, and sets a time budget that is monitored so it doesn't creep back.
      good: Suggests caching and parallelisation.
      weak: Suggests buying bigger build machines as the only fix.
    followups:
      - How would you keep the pipeline fast once you've fixed it?
      - What would you do about a single slow test stage that can't be split?
    common_errors:
      - Optimising stages that aren't on the critical path.

  - external_key: problem_solving.process_improvement.platform_request_intake
    competency_key: project_management
    topic: Untracked requests to a platform team
    difficulty: medium
    text: >-
      Your platform team receives requests from a dozen product teams through chat, email and hallway
      conversations, and nobody can say what's in flight or why something was dropped. How would you set up a
      better intake and prioritisation process?
    expected_concepts:
      - one visible intake channel
      - a lightweight request format
      - transparent prioritisation criteria shared with requesters
      - regular review with requesting teams
      - recognise repeated requests that self-service could remove
    rubric:
      excellent: Creates a single visible intake, publishes how requests are prioritised, reviews the queue with requesters regularly and looks for repeated requests to turn into self-service.
      good: Introduces a ticket queue and a priority order.
      weak: Asks the team to say no more often, without making the queue visible.
    followups:
      - How would you handle a request that a senior leader brings to an engineer directly?
      - How would you communicate that something won't be done?
    common_errors:
      - Creating a queue but never explaining the prioritisation to requesters.

  - external_key: problem_solving.process_improvement.single_expert_dependency
    competency_key: people_management
    topic: Only one person understands a critical area
    difficulty: medium
    text: >-
      Only one engineer understands how your billing integration works, and every issue in that area waits for
      them. How would you reduce that dependency?
    expected_concepts:
      - pair others with the expert on real issues
      - have others lead while the expert reviews
      - document key flows and decisions
      - add tests and observability to make the area less mysterious
      - protect the expert's time to share knowledge
    rubric:
      excellent: Spreads knowledge through real work, pairing first and then having others lead with the expert as reviewer, backs it up with documentation, tests and observability, and makes time for it in planning.
      good: Plans pairing and documentation.
      weak: Asks the expert to write a document and considers it solved.
    followups:
      - How would you know when the dependency has really been reduced?
      - What if the expert is reluctant to share the work?
    common_errors:
      - Relying only on documentation without hands-on practice.

  # ---------------------------------------------------------------- hard
  - external_key: problem_solving.process_improvement.merged_teams_way_of_working
    competency_key: project_management
    topic: Merging two teams with different ways of working
    difficulty: hard
    text: >-
      Two teams with completely different ways of working, one using two-week sprints and the other a
      continuous flow board, are being merged under you. How would you decide on a shared way of working?
    expected_concepts:
      - understand why each team works the way it does
      - identify what the combined team needs (predictability, interrupt handling, stakeholders)
      - agree a small set of shared practices and leave room for differences
      - trial the new approach and review it together
      - keep delivery going during the transition
    rubric:
      excellent: Starts from what each approach does well and why, defines the combined team's actual needs, agrees a minimal shared set of practices with the team, trials it with a planned review and protects delivery during the change.
      good: Compares the approaches and picks one with the team's input.
      weak: Imposes whichever approach they personally prefer.
    followups:
      - What would you not compromise on, and why?
      - How would you know after two months whether the choice was right?
    common_errors:
      - Choosing a framework first and fitting the team's work to it afterwards.

  - external_key: problem_solving.process_improvement.post_outage_deploy_freeze
    competency_key: ci_cd
    topic: Deploy freeze that stalled delivery
    difficulty: hard
    text: >-
      After a bad outage, leadership required director sign-off for every deploy. Three months later delivery
      has nearly stopped while incidents haven't really dropped. How would you make the case for a different
      approach, and what would you propose?
    expected_concepts:
      - data on deploy volume, batch size, lead time and incidents before and after
      - explain why bigger, rarer deploys raise risk
      - address the actual causes of the original outage
      - propose targeted controls such as progressive rollout, automated checks and fast rollback
      - offer a trial with clear success criteria
    rubric:
      excellent: Uses data to show the freeze increased batch size without reducing incidents, ties the proposal to the real causes of the outage, offers targeted safety controls and a trial with agreed criteria, and respects leadership's need for reassurance.
      good: Argues against the freeze with some data and suggests safer deployment practices.
      weak: Complains that the freeze is slowing the team without offering an alternative leadership can accept.
    followups:
      - What would you say if leadership asks you to guarantee no repeat outage?
      - Which safeguard would you put in place first?
    common_errors:
      - Arguing only from speed and ignoring leadership's concern about risk.

  - external_key: problem_solving.process_improvement.support_volume_outgrows_team
    competency_key: technical_support
    topic: Support demand growing faster than the team
    difficulty: hard
    text: >-
      Your customer base is doubling this year, but the support team can only grow by twenty percent. How would
      you rethink the support process so the queue doesn't collapse?
    expected_concepts:
      - analyse ticket drivers and contact rate per customer
      - eliminate top causes through product fixes
      - self-service through help content and in-product guidance
      - tiered support and routing by complexity
      - automation of routine requests
      - track contact rate and resolution time as volume grows
    rubric:
      excellent: Focuses on reducing contacts per customer by fixing top drivers and expanding self-service, then tiers and automates the remaining work, with clear measures to watch as volume grows.
      good: Proposes self-service, automation and better routing.
      weak: Proposes working longer hours or simply lowering response targets.
    followups:
      - How would you get product teams to own the issues driving tickets?
      - What risks come with pushing customers toward self-service?
    common_errors:
      - Only making ticket handling faster instead of reducing the number of tickets.

  - external_key: problem_solving.process_improvement.onboarding_at_hiring_scale
    competency_key: people_management
    topic: Onboarding for rapid hiring
    difficulty: hard
    text: >-
      Your engineering organisation will hire forty people in the next six months, and today onboarding depends
      on each manager improvising. How would you design an onboarding programme that works at that scale?
    expected_concepts:
      - a shared core programme plus team-specific onboarding
      - clear milestones for the first weeks and months
      - trained buddies or mentors with time set aside
      - automated access and environment setup
      - feedback from new hires and measures of ramp-up time
      - protect existing teams from being overwhelmed
    rubric:
      excellent: Designs a shared core plus team-specific layer, with milestones, trained buddies, automated setup and feedback loops, and plans for the load on existing teams so delivery doesn't collapse while absorbing new hires.
      good: Proposes a standard programme with buddies and milestones.
      weak: Writes a longer onboarding document for managers to follow.
    followups:
      - How would you know whether the programme is working by month three?
      - What would you do if one team is absorbing far more new hires than others?
    common_errors:
      - Ignoring the time cost onboarding places on existing engineers.

  - external_key: problem_solving.process_improvement.qa_department_to_team_ownership
    competency_key: test_automation
    topic: Moving quality ownership into delivery teams
    difficulty: hard
    text: >-
      Your company has a separate QA department that tests every release at the end, and leadership wants
      delivery teams to own quality themselves. How would you plan that transition without quality dropping in
      the meantime?
    expected_concepts:
      - start with teams that have the most automation
      - embed QA engineers in teams as coaches
      - grow automated test coverage before removing manual gates
      - measures such as escaped defects and change failure rate to watch quality
      - keep the end-of-cycle check until data shows it can go
      - clear career path for QA engineers
    rubric:
      excellent: Plans a staged transition that embeds QA engineers as quality coaches, builds automation before removing gates, watches defect and failure measures, and handles the role changes for QA staff thoughtfully.
      good: Embeds testers in teams and increases automation.
      weak: Removes the QA stage at once and expects developers to test.
    followups:
      - How would you decide when it's safe to remove the final QA gate for a team?
      - What would you say to QA engineers worried about their roles?
    common_errors:
      - Removing manual testing before automated coverage is in place.

  - external_key: problem_solving.process_improvement.idea_to_customer_five_months
    competency_key: problem_solving
    topic: Finding hidden waiting time across teams
    difficulty: hard
    text: >-
      An approved idea takes on average five months to reach customers, and every team involved says its own
      part only takes a couple of weeks. How would you figure out where the rest of the time goes and decide
      what to fix first?
    expected_concepts:
      - trace a sample of recent items end to end
      - separate active work from waiting between steps
      - queues, approvals and handoffs as hidden delays
      - quantify where waiting accumulates
      - fix the biggest constraint first and re-measure
    rubric:
      excellent: Follows real items end to end, separates working from waiting time, finds where queues and handoffs accumulate delay and targets the largest constraint first, re-measuring afterwards.
      good: Maps the process across teams and looks for delays between steps.
      weak: Asks each team to speed up its own part.
    followups:
      - How would you get teams to agree on the findings when they each think they're fast?
      - What would you do if the biggest delay sits in a team you have no authority over?
    common_errors:
      - Optimising work inside each team while waiting between teams stays the same.
