# Curated questions: problem solving / analytical reasoning (part 4 of 4).
# Scenario questions about interpreting metric changes, ambiguous data and root-causing KPI moves.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_analyst, data_scientist, product_manager, business_analyst]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.analytical_reasoning.metric_flat_for_days
    competency_key: data_analysis
    topic: Suspiciously stable data
    difficulty: easy
    text: >-
      A metric that normally moves a little every day has been exactly the same on the dashboard for five days.
      What does that suggest to you, and what would you do?
    expected_concepts:
      - stale data from a failed or stuck pipeline
      - dashboard caching or a filter fixing the date
      - check the last update time of the source tables
      - tell dashboard users the data may be stale
      - add a freshness check or alert
    rubric:
      excellent: Treats perfect stability as a warning sign, checks source freshness, pipeline runs and dashboard caching, informs users and proposes a freshness alert.
      good: Suspects stale data and checks when the source was last updated.
      weak: Reads the flat line as a stable business.
    followups:
      - Who would you tell, and what would you say about decisions made in those five days?
      - What kind of check would catch this automatically?
    common_errors:
      - Not checking data freshness because no error was reported.

  - external_key: problem_solving.analytical_reasoning.clothing_return_rate_up
    competency_key: problem_solving
    topic: Rising return rate
    difficulty: easy
    text: >-
      The return rate for an online clothing store rose from eighteen to twenty-four percent over two months.
      How would you work out what's behind it?
    expected_concepts:
      - break down by category, brand, product and size
      - read return reasons such as fit, quality or not as described
      - check changes in product mix, suppliers or size charts
      - check policy changes such as free returns
      - align returns with the purchase date, not the return date
    rubric:
      excellent: Segments returns by product and reason, links them to the purchase date, checks mix, supplier and policy changes and narrows to a specific cause.
      good: Breaks returns down by category and reason.
      weak: Suggests tightening the return policy without diagnosing the cause.
    followups:
      - Most of the increase is in one new brand's items with the reason too small. What would you do?
      - How would you estimate the cost of the extra returns?
    common_errors:
      - Counting returns by return date, which mixes in orders from earlier periods.

  - external_key: problem_solving.analytical_reasoning.ten_survey_responses
    competency_key: statistics_experimentation
    topic: Small self-selected samples
    difficulty: easy
    text: >-
      A product manager wants to drop a feature because eight of the ten customers who answered a feedback survey
      disliked it. How would you advise them?
    expected_concepts:
      - ten responses is too few to generalise
      - respondents self-select and may not represent users
      - compare with usage data for the feature
      - collect more targeted feedback
      - consider who would be affected by removing it
    rubric:
      excellent: Explains the small sample and self-selection problems, brings in usage data and the users who rely on the feature, and suggests a better way to gather evidence quickly.
      good: Points out the sample is small and suggests looking at usage data.
      weak: Agrees with dropping the feature or dismisses the feedback entirely.
    followups:
      - What would be enough evidence to support removing it?
      - How would you use the ten responses productively?
    common_errors:
      - Ignoring the feedback completely instead of treating it as a lead to investigate.

  - external_key: problem_solving.analytical_reasoning.blog_benchmark_comparison
    competency_key: data_analysis
    topic: Comparing against external benchmarks
    difficulty: easy
    text: >-
      Your manager found a blog post saying the industry average sign-up conversion is double yours, and asks
      whether you have a problem. How would you respond?
    expected_concepts:
      - check how the benchmark defines conversion
      - check the source, sample and industry segment
      - compare traffic mix and business model
      - use your own trend and internal comparisons
      - look for genuine opportunities regardless of the benchmark
    rubric:
      excellent: Questions the benchmark's definition and comparability, compares with your own history and segments, and still looks for real improvement opportunities.
      good: Checks the benchmark's definition and source.
      weak: Accepts the benchmark at face value or dismisses it without checking.
    followups:
      - What would a fair benchmark look like for your product?
      - What if the benchmark turns out to be comparable?
    common_errors:
      - Comparing metrics with different denominators, such as visits versus unique visitors.

  - external_key: problem_solving.analytical_reasoning.reported_kpi_error_found
    competency_key: communication
    topic: Correcting a published number
    difficulty: easy
    text: >-
      You discover that a KPI you've been reporting to leadership for three months had a calculation error. How
      would you handle it?
    expected_concepts:
      - confirm the error and size its impact
      - tell your manager and the stakeholders promptly
      - restate the affected numbers with a clear explanation
      - check whether decisions relied on the wrong figures
      - add checks to prevent recurrence
    rubric:
      excellent: Confirms and sizes the error, raises it promptly with the corrected figures, identifies decisions that relied on it and adds a safeguard.
      good: Corrects the numbers and informs stakeholders.
      weak: Fixes it quietly going forward or delays raising it.
    followups:
      - What if the corrected number changes a decision that was already made?
      - How would you word the correction message?
    common_errors:
      - Correcting the figure without telling the people who used it.

  - external_key: problem_solving.analytical_reasoning.flat_revenue_offsetting_moves
    competency_key: problem_solving
    topic: Offsetting movements under a flat total
    difficulty: easy
    text: >-
      Revenue is flat month over month, and your manager asks whether anything interesting is happening
      underneath. How would you look for movements that cancel each other out?
    expected_concepts:
      - break down by segment, product, channel and region
      - separate new and existing customer revenue
      - look at gains and losses separately rather than net
      - rank the largest positive and negative contributors
    rubric:
      excellent: Decomposes revenue into gross gains and losses by segment and customer type, identifies offsetting movements and highlights the ones worth acting on.
      good: Breaks revenue down by a few dimensions and spots offsetting changes.
      weak: Concludes nothing happened because the total is flat.
    followups:
      - How would you visualise offsetting changes for leadership?
      - Which kind of hidden movement would worry you most?
    common_errors:
      - Only looking at net changes, which hide gains and losses of similar size.

  - external_key: problem_solving.analytical_reasoning.signups_spike_one_country
    competency_key: data_analysis
    topic: Suspicious sign-up spike
    difficulty: easy
    text: >-
      Sign-ups doubled overnight, and almost all of the new accounts come from a country you don't market in.
      What would you investigate?
    expected_concepts:
      - fake or automated sign-ups
      - patterns in email domains, IP ranges or timing
      - whether the accounts do anything after signing up
      - a genuine viral mention or press coverage
      - exclude suspicious accounts from KPIs until resolved
    rubric:
      excellent: Tests both bot and genuine-interest explanations using account behaviour, timing and source data, and protects reported KPIs while involving security or fraud colleagues.
      good: Suspects automated sign-ups and checks whether the accounts are active.
      weak: Reports the spike as growth without investigation.
    followups:
      - How would you clean these accounts out of historical metrics?
      - If they're genuine, what would you recommend?
    common_errors:
      - Not checking what the new accounts did after signing up.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.analytical_reasoning.seat_utilisation_sliding
    competency_key: product_sense
    topic: Usage as a leading indicator of revenue
    difficulty: medium
    text: >-
      Your B2B customers buy seats, and the share of purchased seats that are actively used has been sliding for
      a year. How would you analyse what that means for future revenue?
    expected_concepts:
      - relate seat utilisation to renewal and contraction history
      - segment by account size, age and plan
      - find whether a few large accounts drive the slide
      - check for definition changes in active seat
      - flag at-risk accounts for customer success
    rubric:
      excellent: Uses historical renewal outcomes to quantify how utilisation predicts contraction, segments to find where the slide is concentrated, and turns it into an at-risk forecast and an action list.
      good: Links utilisation to renewal risk and segments accounts.
      weak: Notes the decline but cannot connect it to revenue.
    followups:
      - How far ahead does utilisation predict renewal in your view?
      - What would you recommend customer success do with the list?
    common_errors:
      - Assuming revenue is safe because contracts haven't come up for renewal yet.

  - external_key: problem_solving.analytical_reasoning.campaign_conversion_window
    competency_key: data_analysis
    topic: Comparing campaigns with delayed conversions
    difficulty: medium
    text: >-
      Marketing is comparing this week's campaign, which looks weak, with last month's, which looks strong.
      Conversions can happen up to thirty days after a click. How would you make the comparison fair?
    expected_concepts:
      - newer campaigns have had less time to convert
      - compare at the same number of days since click
      - use historical conversion lag curves to project
      - check differences in audience and spend
    rubric:
      excellent: Explains the immature window problem, compares both campaigns at equal elapsed time, projects final conversions from historical lag curves and checks other differences.
      good: Recognises that the newer campaign hasn't finished converting and suggests waiting or comparing at the same age.
      weak: Compares raw totals and declares the new campaign weaker.
    followups:
      - Marketing needs a decision within a week. What would you give them?
      - How would you build this into the standard report?
    common_errors:
      - Comparing periods of different maturity in the same table.

  - external_key: problem_solving.analytical_reasoning.paid_search_cpa_rising
    competency_key: problem_solving
    topic: Rising acquisition cost
    difficulty: medium
    text: >-
      Cost per acquisition on paid search rose forty percent over a quarter while spend stayed about the same.
      How would you diagnose why?
    expected_concepts:
      - split into cost per click and click-to-conversion rate
      - check auction competition and keyword mix
      - check landing page or funnel changes affecting conversion
      - look at tracking or attribution changes
      - segment by campaign, device and region
    rubric:
      excellent: Decomposes acquisition cost into click cost and conversion rate, investigates each with campaign and device cuts, and considers both market and measurement causes.
      good: Separates click cost from conversion rate and finds the main driver.
      weak: Recommends cutting spend without diagnosis.
    followups:
      - Click costs are up because a competitor entered. What would you recommend?
      - How would you know if the remaining spend is still profitable?
    common_errors:
      - Not splitting the metric into price and conversion components.

  - external_key: problem_solving.analytical_reasoning.crm_vs_billing_customer_count
    competency_key: data_analysis
    topic: Counting customers across systems
    difficulty: medium
    text: >-
      The CRM says you have a hundred and twenty thousand customers, but finance reports ninety-five thousand
      active billing accounts. How would you work out the real number and explain the gap?
    expected_concepts:
      - different definitions of customer and active
      - duplicates in the CRM
      - one company with several billing accounts or the reverse
      - match records across systems and categorise the unmatched ones
      - agree a definition per use case
    rubric:
      excellent: Clarifies definitions, matches records across systems, categorises unmatched records into duplicates, inactive accounts and structure differences, and agrees which count to use for which purpose.
      good: Identifies definitional differences and duplicates and attempts a match.
      weak: Picks one system as correct without reconciliation.
    followups:
      - How would you match records with no shared ID?
      - Which number should go in the board deck?
    common_errors:
      - Assuming both systems mean the same thing by customer.

  - external_key: problem_solving.analytical_reasoning.forecast_underpredicting
    competency_key: problem_solving
    topic: Persistent forecast bias
    difficulty: medium
    text: >-
      The demand forecast for a product line has under-predicted actual sales six weeks in a row. How would you
      figure out why and decide what to change?
    expected_concepts:
      - consistent bias suggests a level shift or missing driver
      - check promotions, new channels or competitor exits
      - past stock-outs may have hidden true demand in training data
      - compare forecast error by product and region
      - decide between model change and manual adjustment
    rubric:
      excellent: Treats the run of errors as bias, looks for a structural change or missing driver, considers censored demand from stock-outs and chooses a fix proportionate to the cause.
      good: Recognises a systematic bias and looks for a recent change.
      weak: Proposes a different model without understanding the bias.
    followups:
      - How would stock-outs in history affect the model?
      - When would a manual override be the right call?
    common_errors:
      - Treating a sustained bias as random error.

  - external_key: problem_solving.analytical_reasoning.cart_email_recovery_claim
    competency_key: statistics_experimentation
    topic: Incrementality of a recovery program
    difficulty: medium
    text: >-
      The team says their abandoned cart emails recover twenty percent of abandoned carts. How would you check how
      much of that recovery the emails actually caused?
    expected_concepts:
      - many customers return on their own without an email
      - a holdout group that receives no email
      - compare recovery rates between groups
      - consider timing and frequency effects
      - measure incremental revenue rather than recovered carts
    rubric:
      excellent: Explains the natural return rate, proposes a randomised holdout to measure incremental recovery and reports incremental revenue rather than attributed carts.
      good: Suggests a holdout group to measure the true effect.
      weak: Accepts the twenty percent as the email's effect.
    followups:
      - The team is reluctant to hold out emails. How would you persuade them?
      - How would you test the timing of the email?
    common_errors:
      - Counting every recovered cart after an email as caused by the email.

  - external_key: problem_solving.analytical_reasoning.new_market_dilutes_conversion
    competency_key: problem_solving
    topic: New market changes the overall mix
    difficulty: medium
    text: >-
      After you launched in a new country, company-wide conversion fell by a point. Leadership asks whether the
      core business is weakening. How would you answer?
    expected_concepts:
      - compare existing markets on their own
      - the new market's lower conversion pulls the total down
      - quantify the mix effect versus within-market change
      - set separate baselines for the new market
    rubric:
      excellent: Separates the new market from existing ones, quantifies how much of the drop is mix, states clearly whether core markets changed and proposes reporting that avoids the confusion.
      good: Checks existing markets separately and explains the mix effect.
      weak: Treats the company-wide drop as a decline in the core business.
    followups:
      - How would you report company-wide metrics during an expansion?
      - What if existing markets also dipped slightly?
    common_errors:
      - Not separating mix changes from performance changes.

  - external_key: problem_solving.analytical_reasoning.crash_fix_no_retention_change
    competency_key: product_sense
    topic: Evaluating work with no visible top-line impact
    difficulty: medium
    text: >-
      Engineering halved the app's crash rate, but overall retention didn't move. Leadership asks whether the work
      was worth it. How would you assess that?
    expected_concepts:
      - look at the users who used to experience crashes
      - compare retention of affected users before and after
      - effect may be too small to see in overall retention
      - other effects such as reviews, support contacts and session completion
      - counterfactual of what would have happened without the fix
    rubric:
      excellent: Focuses on the affected users, compares their outcomes before and after against a baseline, explains dilution in the overall metric and includes secondary benefits.
      good: Looks at users who experienced crashes rather than overall retention.
      weak: Concludes the work had no value because overall retention was flat.
    followups:
      - How would you have set up measurement before the work started?
      - What if crash-affected users were a tiny share of the base?
    common_errors:
      - Expecting a fix that affects a small group to show up in a company-wide metric.

  - external_key: problem_solving.analytical_reasoning.repeat_buyer_count_disagreement
    competency_key: data_analysis
    topic: Ambiguous metric definitions
    difficulty: medium
    text: >-
      Two analysts gave different answers to how many customers bought more than once last year. How would you
      work out why, and which answer to give?
    expected_concepts:
      - calendar year versus rolling twelve months
      - customer identity, such as guest checkouts and merged accounts
      - treatment of returns, cancellations and zero-value orders
      - orders split into several shipments
      - agree and document the definition with the requester
    rubric:
      excellent: Lists the specific definitional choices that differ, tests which ones explain the gap, and picks a definition tied to the requester's purpose with documentation.
      good: Identifies a couple of definitional differences and reconciles them.
      weak: Picks one answer without understanding the difference.
    followups:
      - How would you stop this kind of disagreement from recurring?
      - Which definition would you choose for a loyalty program analysis?
    common_errors:
      - Ignoring guest checkouts, which split one customer into several.

  - external_key: problem_solving.analytical_reasoning.change_requests_late
    competency_key: problem_solving
    topic: On-time delivery drop
    difficulty: medium
    text: >-
      The share of IT change requests delivered on time fell from eighty to sixty percent over a quarter. How would
      you analyse why?
    expected_concepts:
      - change in the mix of request types and sizes
      - estimation accuracy and how due dates are set
      - capacity changes and competing priorities
      - stage-level delays such as approvals or testing
      - scope changes during delivery
    rubric:
      excellent: Examines mix, estimation, capacity and stage-level delays with data, identifies the main driver and proposes a measurable fix.
      good: Considers several causes and checks a couple of them with data.
      weak: Blames the delivery team without analysis.
    followups:
      - How would you tell bad estimates from slow delivery?
      - What metric would you add alongside on-time rate?
    common_errors:
      - Ignoring that due dates may be set inconsistently.

  - external_key: problem_solving.analytical_reasoning.diluted_feature_test
    competency_key: statistics_experimentation
    topic: Diluted experiment analysis
    difficulty: medium
    text: >-
      A test of a feature that only five percent of users ever see was analysed across all users and showed no
      effect. How would you re-analyse it, and what traps would you watch for?
    expected_concepts:
      - analyse users who were exposed or would have been exposed
      - trigger the same condition in control to avoid bias
      - dilution hides real effects in the overall metric
      - translate the exposed-user effect back to overall impact
    rubric:
      excellent: Proposes a triggered analysis with the same trigger logic in both groups, explains why exposure defined only in treatment is biased, and converts the result back to overall impact.
      good: Suggests analysing only exposed users and notes the dilution.
      weak: Accepts the null result or analyses only treatment users who used the feature.
    followups:
      - Why is comparing feature users in treatment with all of control biased?
      - How would you log the trigger in the control group?
    common_errors:
      - Defining the exposed group differently in treatment and control.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.analytical_reasoning.budget_reallocation_history
    competency_key: statistics_experimentation
    topic: Marketing budget allocation from historical data
    difficulty: hard
    text: >-
      Marketing wants you to recommend how to reallocate next year's budget across five channels, using two years
      of spend and sales data. What pitfalls do you see in relying on that history, and how would you approach it?
    expected_concepts:
      - spend is set based on expected demand, confounding the history
      - little variation in spend limits what can be learned
      - diminishing returns and carry-over effects
      - marketing mix modelling with appropriate caveats
      - geo or holdout experiments to calibrate the model
    rubric:
      excellent: Explains confounding, limited variation and saturation, proposes a modelling approach calibrated with experiments, and presents recommendations as ranges with a plan to test the biggest shifts.
      good: Proposes a model and notes some of its limitations.
      weak: Allocates budget to channels with the best historical return without considering bias or saturation.
    followups:
      - Which experiment would you run first?
      - How would you explain uncertainty in the recommendation to the marketing director?
    common_errors:
      - Assuming the average historical return applies to the next extra unit of spend.

  - external_key: problem_solving.analytical_reasoning.churn_model_importances
    competency_key: statistics_experimentation
    topic: Predictive importance versus causal drivers
    difficulty: hard
    text: >-
      Leadership wants a ranked list of the top reasons customers churn, based on a churn model's feature
      importances. How would you respond, and what would you deliver instead?
    expected_concepts:
      - predictive importance is not causal effect
      - correlated features split or swap importance
      - some features are symptoms of churn rather than causes
      - combine with exit surveys and qualitative research
      - test interventions on the top hypotheses
    rubric:
      excellent: Explains why importances do not identify causes, distinguishes symptoms from drivers, and delivers a set of hypotheses with evidence plus proposed experiments or interventions to test them.
      good: Explains the difference between prediction and cause and suggests further validation.
      weak: Delivers the importance ranking as the reasons for churn.
    followups:
      - What is the model still useful for?
      - How would you prioritise which hypothesis to test first?
    common_errors:
      - Presenting the strongest predictor, such as reduced logins, as the root cause.

  - external_key: problem_solving.analytical_reasoning.slowing_growth_target
    competency_key: problem_solving
    topic: Setting a target from a slowing trend
    difficulty: hard
    text: >-
      You're asked to set next year's growth target for a product whose growth has slowed every quarter. How
      would you build a target that's ambitious but grounded in data?
    expected_concepts:
      - baseline projection of the current trend
      - decompose growth into drivers such as acquisition, retention and pricing
      - size the planned initiatives with realistic success rates
      - market size and saturation limits
      - present scenarios and agree the target with owners
    rubric:
      excellent: Builds a baseline from the slowing trend, adds initiative-level contributions with realistic assumptions, checks against market limits and presents scenarios that make the stretch explicit.
      good: Projects the trend and adds expected impact from planned work.
      weak: Picks a percentage from past years or applies a uniform uplift.
    followups:
      - How would you treat initiatives that haven't been proven yet?
      - How would you track whether the target is still realistic mid-year?
    common_errors:
      - Extrapolating past growth rates without accounting for the slowdown.

  - external_key: problem_solving.analytical_reasoning.offline_gain_online_loss
    competency_key: statistics_experimentation
    topic: Offline and online metric disagreement
    difficulty: hard
    text: >-
      A new search ranking model scored better on offline accuracy metrics, but online conversion dropped slightly
      in the A/B test. How would you investigate the disconnect?
    expected_concepts:
      - offline labels may not reflect what drives purchases
      - training data bias from the old ranking's exposure
      - check latency or serving differences between offline and online
      - segment results by query type
      - improve the offline metric to align with online outcomes
    rubric:
      excellent: Examines label quality, exposure bias and serving differences, segments the online results to locate the loss and proposes aligning the offline evaluation with the business outcome.
      good: Suggests that offline metrics don't capture what users value and checks segments.
      weak: Trusts the offline metric or reruns the test without investigating.
    followups:
      - How would you check whether latency changed in production?
      - How would you build an offline metric that predicts online results better?
    common_errors:
      - Assuming offline and online metrics measure the same thing.

  - external_key: problem_solving.analytical_reasoning.all_hypotheses_ruled_out
    competency_key: problem_solving
    topic: When every hypothesis is ruled out
    difficulty: hard
    text: >-
      You've spent a week investigating a fall in repeat purchases and ruled out every hypothesis on your list.
      What would you do next?
    expected_concepts:
      - recheck whether the drop is real and how it is measured
      - revisit the evidence used to rule out hypotheses
      - exploratory slicing to find where the drop concentrates
      - talk to customers, support and front-line teams
      - share progress and agree whether to continue
    rubric:
      excellent: Revisits the measurement and the reasoning behind each elimination, broadens the search with exploratory cuts and qualitative sources, and sets a clear checkpoint with stakeholders.
      good: Rechecks the data and broadens the search with new sources.
      weak: Keeps repeating the same analyses or gives up.
    followups:
      - How do you know when to stop and report an unexplained drop?
      - What would you say to leadership at this point?
    common_errors:
      - Not questioning whether a hypothesis was ruled out on weak evidence.

  - external_key: problem_solving.analytical_reasoning.annual_billing_churn_drop
    competency_key: data_analysis
    topic: Retention reporting across a billing change
    difficulty: hard
    text: >-
      Your company made annual billing the default instead of monthly, and the monthly churn rate dropped sharply.
      How would you report retention honestly across that change?
    expected_concepts:
      - annual customers cannot churn until renewal, so monthly churn is not comparable
      - separate retention by billing plan
      - use cohort retention measured at comparable points
      - leading indicators such as usage and cancellation intent
      - annotate the change in reporting
    rubric:
      excellent: Explains why the change mechanically lowers monthly churn, separates plans, proposes comparable cohort-based retention and usage indicators, and annotates the reporting break.
      good: Separates monthly and annual customers when reporting churn.
      weak: Reports the drop as improved retention.
    followups:
      - How would you forecast the first annual renewal wave?
      - What would you track monthly for annual customers?
    common_errors:
      - Treating the absence of churn opportunities as retention.

  - external_key: problem_solving.analytical_reasoning.price_vs_volume_growth
    competency_key: problem_solving
    topic: Price, volume and mix bridge
    difficulty: hard
    text: >-
      Revenue grew eleven percent last year, but prices rose about nine percent across the board. The board wants
      to know how much of the growth was real. How would you analyse it?
    expected_concepts:
      - price, volume and mix decomposition
      - unit volume and customer counts in absolute terms
      - check whether price rises varied by product
      - compare with market growth and competitors
      - consider customer losses caused by the price rise
    rubric:
      excellent: Builds a price, volume and mix bridge, looks at units and customers directly, benchmarks against the market and assesses whether price rises cost customers.
      good: Separates price effects from volume growth.
      weak: Subtracts nine from eleven without examining mix or volume.
    followups:
      - How would you present the bridge to the board?
      - What would you look at to see whether the price rise hurt customer loyalty?
    common_errors:
      - Ignoring mix shifts toward higher or lower priced products.
