# Curated questions: debugging reasoning (part 1 of 4).
# Reproducing, narrowing down, bisecting, forming hypotheses, reading errors, comparing environments.
# Spoken scenario questions; the candidate reasons aloud without running code.
version: 1
defaults:
  competency_key: debugging
  kind: scenario
  role_tags: [backend, frontend, qa, mobile]
  round_types: [problem_solving, combined]
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.debugging_reasoning.screenshot_to_repro
    topic: Reproducing from a screenshot
    difficulty: easy
    text: >-
      A tester sends you a screenshot of an error dialog, with no steps to reproduce it. How would you get
      from that screenshot to a reliable way of triggering the bug yourself?
    expected_concepts:
      - extract clues from the screenshot (exact message, URL or screen, build version, timestamp)
      - search logs or error tracking for that message around that time
      - ask the tester targeted questions about what they did just before
      - try variations of the likely path until it fails reliably
      - write the confirmed steps down so others can reproduce it
    rubric:
      excellent: Mines every detail in the screenshot, correlates it with logs or error tracking, asks focused questions and iterates until there is a written, repeatable recipe.
      good: Searches for the error text and asks the tester for more context, then tries to recreate the path.
      weak: Bounces the ticket back as not reproducible or starts changing code based on a guess.
    followups:
      - What would you do if the error message is generic, like "something went wrong"?
      - How do you know when your reproduction matches the original bug and isn't a different one?
    common_errors:
      - Ignoring the version or environment shown in the screenshot.

  - external_key: problem_solving.debugging_reasoning.narrow_large_merge
    topic: Narrowing down a large change
    difficulty: easy
    text: >-
      You merged a branch with about forty changed files, and now one page renders completely blank. How
      would you narrow down which part of the change caused it?
    expected_concepts:
      - check the console or logs for an error first
      - identify which changed files the page actually depends on
      - revert or disable halves of the change to split the search space
      - compare against the last known-good build
      - confirm the culprit by re-applying only that change
    rubric:
      excellent: Starts with cheap evidence (errors, dependency of the page on changed files) and then splits the change systematically, confirming the culprit by toggling it on and off.
      good: Looks for errors and reviews the files most related to the page, eventually isolating the change.
      weak: Reads all forty files top to bottom hoping to spot something, with no strategy for narrowing.
    followups:
      - The console shows no errors at all. Where do you look next?
      - How would you do this if the branch can't easily be split into smaller commits?
    common_errors:
      - Skipping the console and logs and going straight to code reading.

  - external_key: problem_solving.debugging_reasoning.find_breaking_commit
    topic: Finding the commit that broke a feature
    difficulty: easy
    text: >-
      A feature that worked two weeks ago is broken today, and about sixty commits have landed since then.
      Talk me through how you'd find the commit that broke it.
    expected_concepts:
      - confirm a known-good and known-bad point
      - binary search through history (for example git bisect)
      - a quick, reliable check for good versus bad at each step
      - about six steps for sixty commits
      - read the culprit commit to understand why it broke
    rubric:
      excellent: Establishes good and bad points, binary searches with a fast repeatable check, notes it takes around log2 of the commit count, and then reasons about why the identified commit broke the feature.
      good: Describes bisecting or checking out older versions in a structured way.
      weak: Reads commit messages one by one or guesses based on who changed what.
    followups:
      - What can make bisecting give you the wrong answer?
      - What if some commits in the middle don't build?
    common_errors:
      - Not confirming that the old version really works before starting the search.

  - external_key: problem_solving.debugging_reasoning.error_points_wrong_line
    topic: Error location that looks correct
    difficulty: easy
    text: >-
      An error message points at a line of code that looks completely correct to you. How do you approach a
      situation where the reported location doesn't seem to be where the problem is?
    expected_concepts:
      - the line is where the failure surfaced, not necessarily where the bad state was created
      - inspect the values flowing into that line
      - trace back to where those values came from
      - check that the code running matches the source being read (stale build, source maps)
      - read the full stack trace, not just the top frame
    rubric:
      excellent: Distinguishes where a failure surfaces from where bad state originates, traces inputs backwards and also checks that the running code matches the source being read.
      good: Inspects the inputs to the line and reads further down the stack trace.
      weak: Concludes the error message is wrong or rewrites the line without understanding why it failed.
    followups:
      - How would you check that the code you're reading is really what's running?
      - Give me an example of a bug where the crash was far from the cause.
    common_errors:
      - Looking only at the top frame of the stack trace.

  - external_key: problem_solving.debugging_reasoning.passes_laptop_fails_ci
    topic: Test passes locally, fails in CI
    difficulty: easy
    text: >-
      A test passes every time on your laptop but fails consistently in the CI pipeline. How would you work
      out what's different between the two?
    expected_concepts:
      - read the CI failure output and artifacts carefully
      - compare versions of runtime, dependencies and lockfile
      - environment variables, time zone, locale and file system differences
      - test ordering, parallelism and leftover state
      - reproduce the CI environment locally (same container image or settings)
    rubric:
      excellent: Lists concrete categories of difference (versions, environment, ordering, resources), reproduces the CI environment locally and narrows by changing one factor at a time.
      good: Compares dependency versions and environment variables and reads the CI logs closely.
      weak: Re-runs the pipeline until it passes or marks the test as skipped.
    followups:
      - How would you get a shell inside the same environment the CI job uses?
      - What if the failure only happens when the full suite runs?
    common_errors:
      - Assuming the CI machine is broken rather than looking for a real difference.

  - external_key: problem_solving.debugging_reasoning.unfamiliar_code_start
    topic: Starting on a bug in unfamiliar code
    difficulty: easy
    text: >-
      You've just been handed a bug in a part of the codebase you've never seen before. How do you decide
      where to start looking?
    expected_concepts:
      - reproduce the bug first
      - find the entry point for the failing behaviour (route, screen, handler)
      - follow the data or request path from there
      - use logs, error text or search to jump to relevant code
      - check recent changes in that area
      - ask the owners targeted questions
    rubric:
      excellent: Reproduces first, then finds the entry point and follows the path of the failing behaviour, using search, recent history and owners to shortcut the exploration.
      good: Searches for the error or feature name and reads outward from there.
      weak: Tries to understand the whole codebase before looking at the bug, or makes changes without knowing the flow.
    followups:
      - How do you avoid getting lost reading code that turns out to be irrelevant?
      - When would you ask the original author rather than dig in yourself?
    common_errors:
      - Skipping reproduction and reading code without a specific question in mind.

  - external_key: problem_solving.debugging_reasoning.shrink_failing_import
    topic: Shrinking a failing input
    difficulty: easy
    text: >-
      A data import fails on a customer's ten-thousand-row file but works with all your sample files. How
      would you find out which part of their file triggers the failure?
    expected_concepts:
      - check the error for a row number or field name
      - split the file in halves and test each part
      - keep shrinking until a minimal failing sample remains
      - compare the failing rows with good rows (encoding, empty fields, delimiters, size)
      - turn the minimal sample into a regression test
    rubric:
      excellent: Uses any clues in the error, then halves the input repeatedly to a minimal failing case, compares it with passing data to name the property that matters and keeps it as a test.
      good: Splits the file to find the failing region and inspects those rows.
      weak: Scrolls through the file looking for something odd, or asks the customer to fix their data.
    followups:
      - What if the failure only happens when the file is large, not because of any particular row?
      - How do you handle the customer's data responsibly while you investigate?
    common_errors:
      - Stopping at a big failing chunk instead of shrinking to the smallest case.

  - external_key: problem_solving.debugging_reasoning.invoice_total_mismatch
    topic: Reasoning about a wrong total
    difficulty: easy
    text: >-
      An invoice screen shows a total that's slightly higher than the sum of its line items. Before running
      anything, how would you reason about where the extra amount might be coming from?
    expected_concepts:
      - list where the total is computed (client, server, database)
      - candidates such as tax, fees, discounts, hidden or deleted line items
      - rounding per line versus on the total
      - stale or duplicated data
      - pick the cheapest check to separate the candidates
    rubric:
      excellent: Builds a list of candidate explanations tied to where the total is computed and proposes the quickest observations that would rule each one in or out.
      good: Names several plausible causes such as tax, rounding or a hidden item.
      weak: Fixates on one guess or jumps straight to editing the calculation.
    followups:
      - The difference is always exactly one cent. What does that suggest?
      - How would you check whether the frontend and backend agree on the total?
    common_errors:
      - Assuming the display is wrong without checking what the server actually stored.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.debugging_reasoning.rank_three_hypotheses
    topic: Ranking competing hypotheses
    difficulty: medium
    text: >-
      You have three plausible explanations for a bug: a bad config value, a recent library upgrade and a
      problem in the data. How do you decide which to test first, and what would each test look like?
    expected_concepts:
      - weigh likelihood against cost of testing each hypothesis
      - timing correlation with the upgrade or config change
      - a discriminating test that separates hypotheses
      - revert the library in isolation, compare config across environments, query the affected data
      - change one variable at a time
    rubric:
      excellent: Ranks by both likelihood and cost of checking, uses timing evidence, and designs a concrete test for each that would clearly confirm or rule it out, changing one thing at a time.
      good: Picks a sensible order and describes a reasonable check for each hypothesis.
      weak: Tests in arbitrary order, or changes all three things at once.
    followups:
      - What if two hypotheses could both be true at the same time?
      - How do you record what you've ruled out so you don't repeat work?
    common_errors:
      - Choosing a test that can't actually distinguish between the hypotheses.

  - external_key: problem_solving.debugging_reasoning.async_trace_no_app_frames
    topic: Async stack traces without your code
    difficulty: medium
    text: >-
      A stack trace from an asynchronous code path ends inside a framework callback and shows none of your
      own code. How would you figure out which part of your code started the failing work?
    expected_concepts:
      - async boundaries lose the original call stack
      - use the error type, message and data in it as clues
      - correlation or request IDs in surrounding logs
      - enable async stack traces or long stack traces if available
      - add context when scheduling the work (wrap errors, attach identifiers)
    rubric:
      excellent: Explains why async boundaries break the stack, uses logs and correlation IDs to find the originating operation and proposes adding context or async stack support so it is easier next time.
      good: Uses the error details and surrounding logs to guess the origin and suggests better error wrapping.
      weak: Treats it as a framework bug or cannot suggest how to connect the failure to the caller.
    followups:
      - What would you change in the code so future errors carry the context you need?
      - How would timestamps alone help or mislead you here?
    common_errors:
      - Ignoring nearby log lines that share a request or job identifier.

  - external_key: problem_solving.debugging_reasoning.one_account_cant_copy_data
    topic: Reproducing without production data
    difficulty: medium
    text: >-
      A bug happens only for one customer account in production, and you're not allowed to copy their data
      into a development environment. How would you reproduce it safely?
    expected_concepts:
      - identify what is distinctive about the account (settings, size, data shape, plan, flags)
      - read-only inspection in production within access rules
      - build synthetic data that matches the shape
      - targeted logging scoped to that account
      - respect privacy and data-handling rules throughout
    rubric:
      excellent: Characterises what makes the account different through permitted read-only inspection, recreates that shape with synthetic data and adds scoped instrumentation, staying within data-handling rules.
      good: Looks at the account's settings and data and tries to recreate something similar in a test environment.
      weak: Proposes copying the data anyway or debugging by trial and error on the live account.
    followups:
      - What would you do if you can't find anything obviously different about the account?
      - How would you ask the customer for help without putting the burden on them?
    common_errors:
      - Making exploratory changes to the real customer's data.

  - external_key: problem_solving.debugging_reasoning.job_fails_no_code_change
    topic: Failure with no code change
    difficulty: medium
    text: >-
      Nothing in the code has changed, but a scheduled job that ran fine yesterday fails today. How would
      you narrow down what actually changed?
    expected_concepts:
      - things change besides code (data, config, secrets, certificates, dependencies, infrastructure)
      - dates and time-based logic
      - input volume or new kinds of records
      - external services and credentials expiring
      - compare yesterday's and today's runs side by side
    rubric:
      excellent: Systematically enumerates non-code changes (data, config, credentials, time, dependencies, upstream services) and compares the two runs to find the difference.
      good: Checks the error, recent config or data changes and any external dependency.
      weak: Insists nothing changed and re-runs the job hoping it passes.
    followups:
      - How could a dependency change even though you didn't touch your lockfile?
      - What would you add to the job so this is quicker to diagnose next time?
    common_errors:
      - Equating no code changes with no changes at all.

  - external_key: problem_solving.debugging_reasoning.trace_bad_data_writer
    topic: Tracing corrupt data back to its writer
    difficulty: medium
    text: >-
      Corrupted values show up in a report, but the report code just reads from the database. How would you
      trace backwards to find which part of the system wrote the bad data?
    expected_concepts:
      - find all writers of the affected fields
      - use timestamps, audit columns or change history to see when rows went bad
      - correlate with deploys, jobs or imports at those times
      - look for a pattern across affected rows
      - add auditing or constraints to catch it in the act
    rubric:
      excellent: Lists every writer, uses timing and audit information to correlate bad rows with specific processes, finds the common pattern and proposes constraints or auditing to catch future writes.
      good: Searches for code that writes the field and checks when the bad rows were updated.
      weak: Patches the report or fixes the data by hand without finding the source.
    followups:
      - There's no audit trail on that table. How do you proceed?
      - How would you stop more bad data being written while you investigate?
    common_errors:
      - Fixing the visible rows and losing the evidence of how they went bad.

  - external_key: problem_solving.debugging_reasoning.proving_intermittent_fix
    topic: Verifying a fix for an intermittent bug
    difficulty: medium
    text: >-
      You think you've found the cause of an intermittent bug and you have a fix. How do you convince
      yourself and your team that the fix actually works, rather than just making the bug rarer?
    expected_concepts:
      - explain the mechanism, not just the correlation
      - reproduce reliably first (stress, loops, injected delays)
      - show failure before and no failure after under the same conditions
      - enough runs to be statistically meaningful
      - monitor in production after release
    rubric:
      excellent: Insists on a mechanism that explains every observation, builds a reproduction that fails often before the fix, compares many runs before and after and watches production metrics afterwards.
      good: Writes a test or stress loop that used to fail and now passes, and monitors after release.
      weak: Ships the fix because the bug didn't happen in a few tries.
    followups:
      - How many runs would you need before you're comfortable?
      - What would make you doubt your explanation even if the bug stops?
    common_errors:
      - Treating a handful of passing runs as proof for something that failed once in hundreds.

  - external_key: problem_solving.debugging_reasoning.dependency_bump_failures
    topic: Breakage after dependency updates
    difficulty: medium
    text: >-
      After a routine dependency update that bumped a dozen packages, a handful of unrelated-looking tests
      start failing. How would you work out which upgraded package is responsible and why?
    expected_concepts:
      - read the failures for shared symptoms
      - upgrade packages one at a time or in halves
      - check changelogs and release notes for behaviour changes
      - transitive dependencies changing too
      - pin or work around while fixing properly
    rubric:
      excellent: Looks for a shared symptom, bisects the set of upgrades, includes transitive dependencies, reads release notes for the guilty package and explains the behaviour change behind the failures.
      good: Upgrades packages separately to find the culprit and checks its changelog.
      weak: Reverts the whole update and moves on without understanding the cause.
    followups:
      - How would you see which transitive dependencies changed?
      - When is it acceptable to pin the old version, and for how long?
    common_errors:
      - Forgetting that indirect dependencies may have changed as well.

  - external_key: problem_solving.debugging_reasoning.suite_order_interference
    topic: Tests that interfere with each other
    difficulty: medium
    text: >-
      A group of tests passes when each one runs on its own but fails when the whole suite runs together.
      What would you suspect, and how would you find the test that's interfering?
    expected_concepts:
      - shared state (globals, singletons, database rows, files, environment)
      - missing setup or teardown
      - run in a fixed order and bisect the preceding tests
      - randomised ordering to expose dependencies
      - make each test isolate its own state
    rubric:
      excellent: Names concrete kinds of shared state, bisects the set of earlier tests to find the polluter and fixes isolation rather than ordering.
      good: Suspects shared state and runs subsets of the suite to find the interfering test.
      weak: Forces a particular order or reruns failures until they pass.
    followups:
      - What tooling would help you run tests in random order or in halves?
      - How do you stop this class of problem coming back?
    common_errors:
      - Fixing the order instead of the leaked state.

  - external_key: problem_solving.debugging_reasoning.two_flags_together
    topic: Bugs from feature flag combinations
    difficulty: medium
    text: >-
      A bug appears only for users who have two particular feature flags turned on together. How would you
      isolate it, and what would that tell you about where to look in the code?
    expected_concepts:
      - confirm with all four flag combinations
      - find code paths where both flags are checked or interact
      - shared state or assumptions each feature makes about the other
      - reproduce locally by forcing the flags
      - test coverage for flag combinations
    rubric:
      excellent: Confirms the combination with a small matrix, then looks for the code where the two features overlap or share assumptions, and suggests how flag combinations should be tested.
      good: Reproduces with both flags on and searches for where the flags are used.
      weak: Turns one flag off and declares the issue resolved.
    followups:
      - How would you handle this if there were dozens of active flags?
      - Who would you involve, given each flag belongs to a different team?
    common_errors:
      - Testing each flag on its own and missing the interaction.

  - external_key: problem_solving.debugging_reasoning.log_says_saved_row_missing
    topic: Logs contradicting the data
    difficulty: medium
    text: >-
      The logs show a request reaching the step that saves a record, yet the record never appears in the
      database. How would you reason about what could explain that?
    expected_concepts:
      - transaction rolled back after the log line
      - writing to a different database, schema or tenant than expected
      - error swallowed after the save call
      - record later deleted or filtered out by the query used to check
      - log line written before the save actually ran
    rubric:
      excellent: Generates several distinct explanations (rollback, wrong target, swallowed error, later deletion, misleading log placement) and proposes a check that distinguishes each.
      good: Suspects a rollback or swallowed error and checks the code around the save.
      weak: Assumes the database is losing data, or adds more logging without a hypothesis.
    followups:
      - How would you confirm whether the transaction committed?
      - What would you change about that log line so it can't mislead you again?
    common_errors:
      - Trusting that a log line means the operation succeeded.

  - external_key: problem_solving.debugging_reasoning.reason_without_running
    topic: Finding a bug by reading code
    difficulty: medium
    text: >-
      Imagine you're given a function that sometimes returns the wrong result, and you can't run it. How
      would you reason through the code to find the bug?
    expected_concepts:
      - pin down what the function should return (contract, examples)
      - trace it by hand with concrete inputs, including edge cases
      - track variable state step by step
      - focus on boundaries, branches and loops
      - look for hidden inputs (globals, time, external state)
    rubric:
      excellent: Starts from the intended behaviour, hand-traces concrete normal and edge inputs, watches boundaries and branch conditions and considers hidden inputs that make results vary.
      good: Walks through the code with an example input and checks the edge cases.
      weak: Skims the code for anything that looks odd with no method.
    followups:
      - Which inputs would you choose to trace first, and why?
      - If the result is only sometimes wrong, something must vary. What could that be in a pure-looking function?
    common_errors:
      - Tracing only the happy path.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.debugging_reasoning.bug_vanishes_when_observed
    topic: Bugs that vanish under observation
    difficulty: hard
    text: >-
      A bug disappears whenever you attach a debugger or add print statements. What does that suggest to
      you, and how would you keep investigating without disturbing it?
    expected_concepts:
      - timing-sensitive behaviour such as races or ordering
      - uninitialised memory or optimisation-dependent behaviour
      - low-overhead tracing, ring buffers or sampling
      - recording state and inspecting it after the fact (core dumps, record and replay)
      - reasoning from the code about which interleavings are possible
    rubric:
      excellent: Explains why observation changes timing or memory layout, names the likely bug classes and proposes low-overhead or after-the-fact techniques plus code reasoning to find the interleaving.
      good: Identifies timing as the likely factor and suggests lighter logging or stress testing.
      weak: Keeps adding prints, or concludes the bug fixed itself.
    followups:
      - How would you make the bug happen more often instead of less?
      - What does a release-build-only version of this symptom suggest?
    common_errors:
      - Using synchronised logging that changes thread timing and hides the race.

  - external_key: problem_solving.debugging_reasoning.one_in_ten_thousand
    topic: Very rare failures with identical logs
    difficulty: hard
    text: >-
      A transaction fails roughly once in every ten thousand runs, and the logs from failed runs look the
      same as successful ones up to the failure. How would you design an approach to catch it?
    expected_concepts:
      - collect every failure and look for patterns (time, host, input, load)
      - add richer context captured only on failure
      - stress or replay to raise the frequency
      - fault injection and delays to test hypotheses
      - statistical thinking about how many runs prove a fix
    rubric:
      excellent: Combines pattern analysis across many failures, failure-triggered context capture and ways to increase the rate, then tests specific hypotheses with injected faults and knows how to judge success statistically.
      good: Adds instrumentation and looks for common factors across failures.
      weak: Treats it as too rare to matter or makes speculative changes.
    followups:
      - How would you decide whether it's worth investigating at all?
      - What would you capture at the moment of failure, and what would that cost?
    common_errors:
      - Logging everything all the time and drowning the signal.

  - external_key: problem_solving.debugging_reasoning.fix_only_partly_works
    topic: Problems with more than one cause
    difficulty: hard
    text: >-
      You fixed what looked like the cause of a bug, but the symptom only partly went away. How do you
      approach a problem that might have more than one cause?
    expected_concepts:
      - measure the symptom rate before and after
      - check whether remaining cases differ from fixed ones
      - avoid assuming the first fix was wrong or complete
      - treat remaining failures as a fresh investigation
      - one change at a time to attribute effects
    rubric:
      excellent: Quantifies the change, compares remaining failures with fixed ones to see if they form a separate population and investigates the remainder as a new problem while keeping the original fix verified.
      good: Recognises there could be a second cause and keeps looking at remaining failures.
      weak: Reverts the fix or keeps stacking changes without measuring.
    followups:
      - How would you tell two causes apart if they produce the same error message?
      - How do you report progress to stakeholders in this situation?
    common_errors:
      - Assuming the remaining failures share the cause just fixed.

  - external_key: problem_solving.debugging_reasoning.squashed_release_regression
    topic: Regression without bisectable history
    difficulty: hard
    text: >-
      A regression came in with a release that was squashed into one huge commit, so you can't bisect the
      history. How would you narrow down which part of it is responsible?
    expected_concepts:
      - recover finer history if it exists (original branch, pull requests)
      - partially apply the diff by file, module or feature
      - use feature flags or config to disable parts of the release
      - reason from the symptom to the code areas involved
      - instrument to compare old and new behaviour at boundaries
    rubric:
      excellent: Tries to recover granular history first, then bisects the diff itself by area or flag and uses the symptom to prioritise, comparing behaviour at component boundaries.
      good: Splits the change into parts manually and tests combinations.
      weak: Reverts the whole release with no plan to find the specific cause.
    followups:
      - How would you split a diff where many changes depend on each other?
      - What would you change about the release process after this?
    common_errors:
      - Overlooking that the original pull requests or branches may still exist.

  - external_key: problem_solving.debugging_reasoning.dark_service_in_chain
    topic: Isolating a fault in a poorly observed chain
    difficulty: hard
    text: >-
      A request passes through four services, and one of them emits no traces and very little logging. A
      customer's request is failing somewhere in that chain. How would you isolate which service is at
      fault?
    expected_concepts:
      - use what the neighbouring services see (request out, response in, timings)
      - compare inputs and outputs at each boundary
      - call the opaque service directly with the same input
      - network-level evidence (proxies, load balancer logs, packet captures)
      - add minimal instrumentation at the boundary
    rubric:
      excellent: Treats each boundary as a checkpoint, uses neighbours and network evidence to infer what the opaque service received and returned, and replays the request directly against it to confirm.
      good: Checks logs on the services that do have them and tests the dark service directly.
      weak: Assumes the poorly instrumented service is at fault without evidence.
    followups:
      - How would you get timing information for the opaque service from outside?
      - What minimum instrumentation would you ask its owners to add?
    common_errors:
      - Blaming the service with the least visibility simply because it's the least visible.

  - external_key: problem_solving.debugging_reasoning.fails_on_one_customer_network
    topic: Debugging inside an environment you can't access
    difficulty: hard
    text: >-
      One feature of your web app fails only for users inside one enterprise customer's corporate network,
      and you can't access that network yourself. How would you work with them to narrow it down?
    expected_concepts:
      - proxies, firewalls, TLS inspection and blocked domains or ports
      - ask for browser network exports or console output
      - a diagnostic page or endpoint that checks connectivity
      - compare against your server logs for their requests
      - give the customer's IT staff specific, minimal checks to run
    rubric:
      excellent: Forms hypotheses specific to corporate networks, gathers evidence through network exports, server-side logs and a purpose-built diagnostic, and gives the customer's team precise checks.
      good: Asks for browser network logs and suspects a proxy or firewall rule.
      weak: Tells the customer it's a problem on their side without gathering evidence.
    followups:
      - The network export shows the request never leaves the browser. What does that suggest?
      - How would you make this easier to diagnose for the next customer?
    common_errors:
      - Asking the customer for vague information instead of specific, low-effort checks.
