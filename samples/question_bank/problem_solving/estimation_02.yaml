# Curated questions: structured estimation and back-of-the-envelope reasoning (part 2 of 4).
# Evaluation looks at the structure of the reasoning (assumptions, decomposition, arithmetic,
# sanity checks), not at landing on one "correct" number.
version: 1
defaults:
  role_tags: [general, backend, cloud, product_manager]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.estimation.news_site_bandwidth
    competency_key: problem_solving
    topic: Page views to bandwidth
    difficulty: easy
    text: >-
      A regional news website gets about three million page views a day. How would you estimate the bandwidth
      it serves, and how much of that a CDN could take off the origin servers?
    expected_concepts:
      - average page weight including images and scripts
      - daily transfer from views times page weight
      - peak bandwidth during breaking news
      - cacheable static assets versus dynamic HTML
      - repeat visitors with warm browser caches
    rubric:
      excellent: Estimates page weight by component, converts to daily and peak bandwidth, and separates cacheable from uncacheable bytes to estimate the origin load left after a CDN.
      good: Produces daily transfer and a rough peak with clear assumptions.
      weak: Gives a bandwidth figure without page weight or traffic shape.
    followups:
      - A big story triples traffic for an hour. Which part of the system feels it first?
    common_errors:
      - Ignoring browser and CDN caching of static assets.

  - external_key: problem_solving.estimation.short_link_storage
    competency_key: problem_solving
    topic: Small-record storage over years
    difficulty: easy
    text: >-
      A link-shortening service expects to create about a hundred million short links a year. Estimate how much
      storage five years of links would need, including click statistics if you think they matter.
    expected_concepts:
      - bytes per link record (code, target URL, metadata)
      - total records over five years
      - click events as a much larger data stream
      - aggregating clicks instead of storing every event
      - indexes and replication
    rubric:
      excellent: Sizes the link records, shows they are modest, then identifies click events as the real storage driver and proposes aggregation or retention limits.
      good: Produces a sensible storage estimate for links with indexes.
      weak: Ignores record structure or gives an unsupported number.
    followups:
      - Which click data would a customer actually need after a year?
    common_errors:
      - Overlooking that event data dwarfs the core records.

  - external_key: problem_solving.estimation.flaky_test_hours_lost
    competency_key: problem_solving
    topic: Engineering time lost to a recurring problem
    difficulty: easy
    text: >-
      Your test suite fails randomly on about one build in ten, and engineers just rerun it. How would you
      estimate how many engineering hours that costs per month, so you can argue for fixing it?
    expected_concepts:
      - builds per day across the team
      - wait time per rerun and context-switch cost
      - number of affected builds per month
      - converting hours to cost or lost capacity
      - comparing with the effort to fix
    rubric:
      excellent: Multiplies builds, failure rate and time lost including context switching, converts the result into hours or money, and compares it with the cost of fixing the flaky tests.
      good: Gets a reasonable hours figure from builds and failure rate.
      weak: Asserts the cost is high without any calculation.
    followups:
      - Which number in that calculation would leadership challenge first?
    common_errors:
      - Counting only the rerun time and ignoring interruptions.

  - external_key: problem_solving.estimation.ci_minutes_monthly_cost
    competency_key: cloud_cost_optimization
    topic: CI compute usage and cost
    difficulty: easy
    text: >-
      An engineering organisation of about eighty developers is moving to a hosted CI service that bills by the
      minute. How would you estimate the monthly build minutes and the bill?
    expected_concepts:
      - commits or pull request updates per developer per day
      - pipeline duration and parallel jobs
      - scheduled and main-branch builds
      - price per minute by machine size
      - caching or skipping unchanged work to reduce minutes
    rubric:
      excellent: Builds minutes from pushes, pipeline length and parallel jobs, adds scheduled builds, prices by runner size, and names the biggest reduction levers.
      good: Produces a monthly minutes figure and a cost with stated assumptions.
      weak: Guesses the bill without relating it to developer activity.
    followups:
      - Where would you expect the biggest waste in the minutes?
    common_errors:
      - Forgetting that parallel jobs multiply billed minutes.

  - external_key: problem_solving.estimation.otp_sms_cost
    competency_key: problem_solving
    topic: Per-message cost at scale
    difficulty: easy
    text: >-
      A banking app sends a one-time code by text message at every login. With about a million logins a day,
      how would you estimate the monthly messaging bill?
    expected_concepts:
      - logins per month
      - retries and resend requests per login
      - price per message by destination
      - share of logins that could use cheaper factors
      - fraud such as artificially inflated traffic
    rubric:
      excellent: Computes monthly messages including resends, applies a per-message price that varies by destination, and suggests cheaper second factors or risk-based prompting with an estimate of savings.
      good: Gets a monthly figure from logins and a per-message price.
      weak: Cannot convert daily logins into a monthly cost.
    followups:
      - How much would you save if half of users switched to an authenticator app?
    common_errors:
      - Ignoring resend requests.

  - external_key: problem_solving.estimation.disk_full_countdown
    competency_key: problem_solving
    topic: Time until a disk fills
    difficulty: easy
    text: >-
      A server has a two terabyte disk that's seventy percent full, and its logs are growing by about twenty
      gigabytes a day. How long do you have, and what would you do with that answer?
    expected_concepts:
      - free space of about 600 gigabytes
      - days remaining at the current rate
      - alerting threshold well before full
      - growth rate that may not be constant
      - fixing the cause such as rotation or retention
    rubric:
      excellent: Computes roughly thirty days, sets an action point well before the disk fills, questions whether the growth rate is stable, and proposes a durable fix rather than just a bigger disk.
      good: Computes the remaining days correctly and suggests a fix.
      weak: Makes an arithmetic error or proposes no action.
    followups:
      - The growth rate doubles next week. How does your plan change?
    common_errors:
      - Planning to act when the disk is already nearly full.

  - external_key: problem_solving.estimation.partner_api_sync_duration
    competency_key: problem_solving
    topic: Sync time under a rate limit
    difficulty: easy
    text: >-
      A partner's API allows one thousand requests a minute, and you need to sync three million customer
      records from it. How long will the first full sync take, and how could you shorten it?
    expected_concepts:
      - records per request and batch endpoints
      - total requests divided by the rate limit
      - retries and errors consuming quota
      - incremental sync after the first run
      - negotiating a higher limit or bulk export
    rubric:
      excellent: Computes about fifty hours at one record per request, shows how batching changes it, leaves room for retries, and proposes incremental sync or a bulk export.
      good: Computes the duration correctly and suggests batching.
      weak: Cannot set up the calculation or ignores the rate limit.
    followups:
      - How would you make the sync resumable if it stops halfway?
    common_errors:
      - Forgetting that retries also count against the limit.

  - external_key: problem_solving.estimation.launch_support_ticket_load
    competency_key: problem_solving
    topic: Support load after a launch
    difficulty: easy
    text: >-
      Your product is about to open to two hundred thousand new users in one week. How would you estimate how
      many support tickets to expect so the support team can plan staffing?
    expected_concepts:
      - historical contact rate per new user
      - higher contact rate in the first days after launch
      - tickets per agent per day
      - deflection through help content or in-app guidance
      - tracking actuals daily to adjust
    rubric:
      excellent: Uses a contact rate from past launches, shapes it over the first week, converts tickets into agent capacity, and plans daily checks to adjust.
      good: Produces a ticket estimate from a contact rate and turns it into staffing.
      weak: Picks a number of tickets without a rate or basis.
    followups:
      - Which product changes would you push for to reduce that number?
    common_errors:
      - Assuming ticket volume spreads evenly across the week.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.estimation.driver_location_updates
    competency_key: problem_solving
    topic: Location update write rate and storage
    difficulty: medium
    text: >-
      A ride-hailing app has about three hundred thousand drivers online at peak, and each phone reports its
      location every four seconds. Estimate the write rate and how much location history you'd store per day.
    expected_concepts:
      - writes per second from drivers and interval
      - bytes per location update
      - latest position in memory versus full history
      - daily history volume with driver hours
      - sampling or compressing history
    rubric:
      excellent: Computes about seventy-five thousand writes per second, separates the current-position store from history, sizes daily history from online hours, and suggests downsampling.
      good: Gets the write rate right and a reasonable daily volume.
      weak: Cannot derive the write rate or stores everything in one place without thought.
    followups:
      - Which reads hit the latest-position store, and how often?
    common_errors:
      - Assuming every driver is online for twenty-four hours.

  - external_key: problem_solving.estimation.podcast_hosting_capacity
    competency_key: problem_solving
    topic: Audio storage and download volume
    difficulty: medium
    text: >-
      You run a podcast hosting platform with forty thousand active shows, most releasing one episode a week.
      How would you estimate yearly storage growth and monthly download traffic?
    expected_concepts:
      - episode length and audio bitrate
      - new storage per year
      - downloads per episode with a long tail
      - back-catalogue downloads continuing over time
      - CDN offload and cost
    rubric:
      excellent: Sizes episodes from duration and bitrate, computes yearly storage, models downloads with a skewed distribution including back catalogue, and converts traffic into delivery cost.
      good: Produces storage and traffic estimates with clear assumptions.
      weak: Uses one averaged number for downloads without considering popularity skew.
    followups:
      - How would a few hugely popular shows change your infrastructure plan?
    common_errors:
      - Ignoring downloads of older episodes.

  - external_key: problem_solving.estimation.event_stream_partition_count
    competency_key: distributed_systems
    topic: Partitions and brokers for an event stream
    difficulty: medium
    text: >-
      A clickstream topic needs to absorb about five hundred megabytes per second at peak and keep seven days
      of data. How would you estimate the number of partitions and brokers?
    expected_concepts:
      - per-partition throughput for producers and consumers
      - consumer parallelism tied to partition count
      - retained data times replication factor
      - per-broker disk and network limits
      - headroom for broker loss and rebalancing
    rubric:
      excellent: Derives partitions from both throughput and consumer parallelism, sizes retained data with replication, checks broker disk and network, and plans headroom for losing a broker.
      good: Gets partitions from throughput and brokers from storage with replication.
      weak: Picks numbers without connecting them to throughput or retention.
    followups:
      - Why not create ten thousand partitions just to be safe?
    common_errors:
      - Forgetting that replication multiplies both storage and network traffic.

  - external_key: problem_solving.estimation.connection_pool_limits
    competency_key: databases
    topic: Connection counts against database limits
    difficulty: medium
    text: >-
      A service runs a hundred and twenty pods, each with a database connection pool of twenty, and the
      database starts refusing connections during deploys. Walk me through the numbers and what you'd change.
    expected_concepts:
      - total possible connections across pods
      - surge pods during rolling deploys
      - database connection limit and per-connection memory
      - actual concurrency needed from request rate and query time
      - pooling proxies or smaller pools
    rubric:
      excellent: Shows 2,400 steady connections plus surge during deploys exceeds the limit, derives the concurrency actually needed from throughput and query latency, and proposes right-sized pools or a pooling proxy.
      good: Computes total connections including deploy surge and suggests reducing pool size.
      weak: Suggests raising the database limit without doing the arithmetic.
    followups:
      - How would autoscaling the pods make this worse?
    common_errors:
      - Sizing pools by guesswork instead of from query concurrency.

  - external_key: problem_solving.estimation.embedding_vector_memory
    competency_key: problem_solving
    topic: Vector index memory sizing
    difficulty: medium
    text: >-
      You want semantic search over two hundred million documents using embeddings of seven hundred and
      sixty-eight dimensions. Estimate the memory the vector index needs and how you might reduce it.
    expected_concepts:
      - bytes per dimension (float32 versus lower precision)
      - raw vector size per document and in total
      - index structure overhead such as graph links
      - quantisation or smaller dimensions
      - sharding across nodes
    rubric:
      excellent: Computes about three kilobytes per vector and roughly six hundred gigabytes raw, adds index overhead, and quantifies how quantisation or reduced dimensions cut it with an accuracy trade-off.
      good: Gets the raw size right and names one reduction technique.
      weak: Cannot compute the per-vector size or ignores index overhead.
    followups:
      - How would you check whether quantisation hurts search quality?
    common_errors:
      - Forgetting that float32 uses four bytes per dimension.

  - external_key: problem_solving.estimation.commitment_discount_savings
    competency_key: cloud_cost_optimization
    topic: Savings from committed-use pricing
    difficulty: medium
    text: >-
      Your monthly compute bill is around eighty thousand dollars, all on demand. How would you estimate how
      much a one-year commitment could save, and how much you should commit?
    expected_concepts:
      - stable baseline usage versus variable peaks
      - discount rates for different commitment terms
      - covering the baseline and leaving peaks on demand
      - risk of over-committing if usage drops
      - right-sizing before committing
    rubric:
      excellent: Finds the steady baseline from usage history, commits to most of it, estimates savings from the discount rate, and explains the risk of committing before right-sizing or planned migrations.
      good: Applies a discount to a reasonable share of usage and notes the commitment risk.
      weak: Commits to the full bill or ignores variable usage.
    followups:
      - A migration next quarter may halve one workload. How does that change your commitment?
    common_errors:
      - Committing to peak usage instead of the baseline.

  - external_key: problem_solving.estimation.metrics_series_cardinality
    competency_key: observability
    topic: Time-series count from metric labels
    difficulty: medium
    text: >-
      A team wants to add customer ID and endpoint as labels on their request latency metric. How would you
      estimate how many time series that creates and whether the monitoring system can handle it?
    expected_concepts:
      - multiplying distinct values across labels
      - histogram buckets multiplying series further
      - existing series per pod or instance
      - memory and ingestion limits of the metrics backend
      - alternatives such as logs, traces or exemplars for per-customer detail
    rubric:
      excellent: Multiplies label cardinalities, bucket count and instances to show the explosion, compares it with the backend's limits, and proposes per-customer detail through logs or traces instead.
      good: Shows the multiplication and identifies customer ID as the risky label.
      weak: Does not see that labels multiply series counts.
    followups:
      - How would you give support per-customer latency without the explosion?
    common_errors:
      - Forgetting histogram buckets in the series count.

  - external_key: problem_solving.estimation.feature_delivery_forecast
    competency_key: project_management
    topic: Forecasting delivery with unknowns
    difficulty: medium
    text: >-
      A stakeholder asks when a new billing feature will ship, but two of its parts depend on a vendor API
      nobody on the team has used. How would you build an estimate you can stand behind?
    expected_concepts:
      - breaking work into known and unknown parts
      - a time-boxed spike to reduce uncertainty
      - ranges or confidence levels rather than one date
      - dependencies and external waiting time
      - re-forecasting as uncertainty falls
    rubric:
      excellent: Splits the work, estimates known parts directly, runs a time-boxed spike for the vendor integration, gives a range with a confidence level, and commits to a date once the spike is done.
      good: Breaks work down and adds contingency for the unknown parts.
      weak: Gives a single date with no treatment of the unknowns.
    followups:
      - The stakeholder wants a date today. What do you say?
    common_errors:
      - Padding the whole estimate evenly instead of targeting the uncertain parts.

  - external_key: problem_solving.estimation.premium_tier_revenue
    competency_key: product_sense
    topic: Revenue estimate for a new paid tier
    difficulty: medium
    text: >-
      Your free note-taking app has about four million monthly users, and the team wants to launch a paid tier.
      How would you estimate the revenue it could bring in during the first year?
    expected_concepts:
      - share of users likely to convert from comparable products
      - ramp of conversions over the year
      - price and billing mix such as monthly versus annual
      - churn of paying users
      - cannibalisation or effects on free usage
    rubric:
      excellent: Uses a benchmark conversion rate, models the ramp and churn, applies a realistic price mix, and gives a range with the most sensitive assumption called out.
      good: Multiplies users, conversion and price into a reasonable yearly figure.
      weak: Assumes a large conversion rate without any reference point.
    followups:
      - How would you test the conversion assumption before building the whole tier?
    common_errors:
      - Treating every month of the year as if all conversions happened on day one.

  - external_key: problem_solving.estimation.peak_sale_load_target
    competency_key: problem_solving
    topic: Setting a load-test target from history
    difficulty: medium
    text: >-
      Last year's biggest sale day peaked at twelve thousand requests per second, and marketing expects this
      year's event to be bigger. How would you decide what load to test the system at?
    expected_concepts:
      - year-over-year growth in users and traffic
      - expected uplift from the marketing campaign
      - a safety multiplier above the forecast
      - the request mix during a sale versus normal days
      - testing dependencies and third parties too
    rubric:
      excellent: Combines organic growth and campaign uplift into a forecast, adds a deliberate safety margin, shapes the test to the sale's request mix, and includes downstream and third-party limits.
      good: Forecasts peak from last year with growth and adds a margin.
      weak: Tests at last year's number or picks an arbitrary multiple.
    followups:
      - What would you do if the payment provider refuses a load test?
    common_errors:
      - Load testing with the normal-day request mix.

  - external_key: problem_solving.estimation.online_data_migration_time
    competency_key: problem_solving
    topic: Duration of a live data migration
    difficulty: medium
    text: >-
      You need to move three billion rows from an old database to a new one while the application keeps
      running. How would you estimate how long the backfill takes and how long the whole migration lasts?
    expected_concepts:
      - copy throughput limited to protect production
      - backfill time from rows and safe rows per second
      - dual writes or change capture during the copy
      - verification and reconciliation time
      - cutover and rollback window
    rubric:
      excellent: Derives backfill time from a throttled rate that protects production, adds change capture, verification and cutover phases, and gives an end-to-end range.
      good: Estimates the backfill duration and mentions keeping data in sync.
      weak: Assumes the copy can run at full speed and ignores verification.
    followups:
      - How would you choose the throttling rate?
    common_errors:
      - Estimating only the copy and forgetting reconciliation.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.estimation.ticket_onsale_spike
    competency_key: system_design
    topic: Capacity for a flash on-sale moment
    difficulty: hard
    text: >-
      A concert ticket site expects two million people waiting when a popular tour goes on sale, but only
      fifty thousand tickets exist. Estimate the load in the first minute and how you'd size the system for it.
    expected_concepts:
      - requests per user in the first minute including refreshes
      - read load versus purchase attempts
      - virtual waiting room to meter admission
      - contention on a small inventory
      - sizing for admitted users rather than everyone waiting
    rubric:
      excellent: Estimates a very large burst from users and refresh behaviour, shows that sizing for everyone is wasteful, and sizes the purchase path for a controlled admission rate behind a waiting room.
      good: Estimates the burst and proposes a queue or waiting room.
      weak: Tries to scale everything for the full burst with no metering.
    followups:
      - How fast would you admit people from the waiting room, and why?
    common_errors:
      - Sizing the checkout path for the whole crowd.

  - external_key: problem_solving.estimation.multi_region_replication_cost
    competency_key: cloud_cost_optimization
    topic: Cost of running in a second region
    difficulty: hard
    text: >-
      Leadership asks what it would cost to make your platform survive the loss of a whole cloud region. How
      would you estimate the extra spend, and which design choice affects it most?
    expected_concepts:
      - active-active versus warm standby versus backup restore
      - duplicated compute and storage
      - cross-region data transfer charges
      - replication of databases and object storage
      - recovery targets driving the choice
    rubric:
      excellent: Prices several resilience options against their recovery targets, includes cross-region transfer and replication costs, and shows the standby model is the biggest cost lever.
      good: Estimates duplicated infrastructure plus data transfer for one option.
      weak: Assumes it simply doubles the bill with no options considered.
    followups:
      - Which recovery time would justify full active-active?
    common_errors:
      - Ignoring cross-region transfer charges.

  - external_key: problem_solving.estimation.transcoding_fleet_size
    competency_key: problem_solving
    topic: Compute for media processing
    difficulty: hard
    text: >-
      A video app receives about five hundred hours of uploads every minute at peak, and each needs transcoding
      into several formats within a few minutes. Estimate the compute you'd need.
    expected_concepts:
      - transcode speed relative to real time per core or GPU
      - number of output renditions
      - parallelising by splitting videos into chunks
      - peak versus average upload rate
      - spot or preemptible capacity for cost
    rubric:
      excellent: Converts upload rate and renditions into required compute using a realistic speed factor, uses chunked parallelism to meet the latency target, and separates peak from baseline capacity with a cost strategy.
      good: Produces a core or machine count from upload rate and transcode speed.
      weak: Cannot relate video hours to compute time.
    followups:
      - Which renditions could you produce lazily, only when watched?
    common_errors:
      - Ignoring that every upload produces several outputs.

  - external_key: problem_solving.estimation.outage_revenue_impact
    competency_key: problem_solving
    topic: Cost of an outage
    difficulty: hard
    text: >-
      Checkout was down for forty-five minutes on a weekday evening. The CFO asks what it cost the company.
      How would you estimate it in a way you'd be comfortable defending?
    expected_concepts:
      - normal revenue for that time window from history
      - share of purchases recovered later
      - support costs and credits issued
      - longer-term effects such as churn or trust
      - stating confidence and ranges
    rubric:
      excellent: Uses the same time window on comparable days as the baseline, subtracts purchases that came back later, adds direct costs, separates measurable from speculative effects, and gives a range.
      good: Estimates lost revenue from typical revenue in that window.
      weak: Uses daily revenue divided by hours with no adjustment.
    followups:
      - How would you measure how many customers came back later?
    common_errors:
      - Assuming all missed orders are lost forever.

  - external_key: problem_solving.estimation.nightly_recommendation_precompute
    competency_key: problem_solving
    topic: Compute and storage for batch precomputation
    difficulty: hard
    text: >-
      A streaming service wants to precompute personalised recommendations for fifty million users every night.
      Estimate the compute and storage involved, and tell me whether you'd precompute for everyone.
    expected_concepts:
      - candidates scored per user and cost per score
      - total scoring operations per night
      - storage per user for the top results
      - share of users active on a given day
      - computing on demand for inactive users
    rubric:
      excellent: Computes scoring operations and machine hours, sizes stored results, notices many users won't visit tomorrow, and proposes precomputing only for likely-active users with on-demand fallback.
      good: Estimates compute and storage for the full user base with clear steps.
      weak: Cannot estimate compute or ignores user activity patterns.
    followups:
      - How fresh do the recommendations really need to be?
    common_errors:
      - Precomputing for users who rarely log in.

  - external_key: problem_solving.estimation.estimate_postmortem_gap
    competency_key: problem_solving
    topic: Learning from an estimate that was badly wrong
    difficulty: hard
    text: >-
      Think of a time an estimate you made, for capacity, cost or effort, turned out to be far off. How did you
      find which assumption was wrong, and what did you change about how you estimate?
    expected_concepts:
      - the original estimate and its assumptions
      - comparing each assumption with what actually happened
      - finding the dominant source of error
      - changing the method such as ranges or calibration
      - how the miss was communicated
    rubric:
      excellent: Gives a real example, traces the miss to specific assumptions with evidence, and describes a lasting change to their estimation practice.
      good: Gives a real example and identifies the main wrong assumption.
      weak: Stays hypothetical or blames external factors without analysis.
    followups:
      - How do you now decide how much confidence to attach to an estimate?
    common_errors:
      - Describing the outcome without analysing the assumptions.
