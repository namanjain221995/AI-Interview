# Curated questions: structured estimation and back-of-the-envelope reasoning (part 4 of 4).
# Evaluation looks at the structure of the reasoning (assumptions, decomposition, arithmetic,
# sanity checks), not at landing on one "correct" number.
version: 1
defaults:
  role_tags: [general, backend, cloud, product_manager]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.estimation.mobile_polling_overhead
    competency_key: problem_solving
    topic: Load from client polling
    difficulty: easy
    text: >-
      A mobile app checks the server for updates every thirty seconds while it's open, and about half a million
      people use it at the same time in the evening. Estimate the request load and whether polling is a sensible choice.
    expected_concepts:
      - requests per second from concurrent users and interval
      - share of polls that return no new data
      - bytes per poll including headers
      - battery and data cost on the device
      - push or long-lived connections as alternatives
    rubric:
      excellent: Computes about seventeen thousand requests per second, notes most return nothing, adds the bandwidth and device cost, and compares with push-based delivery.
      good: Gets the request rate right and questions whether most polls are wasted.
      weak: Cannot derive the request rate from users and interval.
    followups:
      - How would you change the interval without making the app feel stale?
    common_errors:
      - Counting total installs instead of concurrent users.

  - external_key: problem_solving.estimation.campaign_signup_funnel
    competency_key: product_sense
    topic: Funnel-based outcome estimate
    difficulty: easy
    text: >-
      Marketing is buying an ad campaign expected to bring a hundred thousand visitors to your sign-up page. How
      would you estimate how many paying customers it will produce?
    expected_concepts:
      - conversion rate at each funnel step
      - visitor to sign-up to activation to paid
      - using historical rates from similar traffic
      - paid traffic often converting differently from organic
      - time lag before conversion to paid
    rubric:
      excellent: Chains step-by-step conversion rates from historical data, adjusts for the quality of paid traffic, and notes the delay before payment shows up.
      good: Multiplies visitors through a few funnel stages with stated rates.
      weak: Applies one guessed conversion rate with no funnel.
    followups:
      - How would you know within a week whether the campaign is on track?
    common_errors:
      - Using organic conversion rates for paid traffic without adjustment.

  - external_key: problem_solving.estimation.user_row_size
    competency_key: databases
    topic: Estimating record size from a schema
    difficulty: easy
    text: >-
      Picture a typical users table with a name, email, password hash, a few timestamps and some settings.
      Estimate how many bytes one row takes, and how big the table is with ten million users.
    expected_concepts:
      - size of each field type
      - variable-length text averages
      - per-row storage overhead
      - indexes such as the unique email index
      - total size for ten million rows
    rubric:
      excellent: Sizes each field realistically, adds per-row overhead and the main indexes, and reaches a total of a few gigabytes while noting that such a table fits comfortably in memory.
      good: Produces a sensible per-row size and total.
      weak: Cannot estimate field sizes or gives an implausible total.
    followups:
      - What would make this table suddenly much bigger?
    common_errors:
      - Forgetting index storage.

  - external_key: problem_solving.estimation.idle_dev_environment_spend
    competency_key: cloud_cost_optimization
    topic: Savings from scheduling idle resources
    difficulty: easy
    text: >-
      Every engineer has a cloud development environment that runs around the clock. How would you estimate how
      much could be saved by shutting them down outside working hours?
    expected_concepts:
      - working hours as a share of the week
      - cost per environment per hour
      - number of environments
      - parts that keep costing when stopped such as disks
      - exceptions for long-running jobs
    rubric:
      excellent: Computes the idle share of the week at roughly two thirds or more, applies it to compute cost only, subtracts storage that persists, and allows for exceptions.
      good: Estimates savings from idle hours and environment cost.
      weak: Assumes the whole bill disappears outside working hours.
    followups:
      - How would you avoid frustrating engineers who work late?
    common_errors:
      - Ignoring storage costs that continue while machines are stopped.

  - external_key: problem_solving.estimation.large_upload_duration
    competency_key: problem_solving
    topic: Upload time on user connections
    difficulty: easy
    text: >-
      Users of your design tool need to upload project files of around two gigabytes. Estimate how long that
      takes on typical home connections and what it means for how you build the upload.
    expected_concepts:
      - typical upload speeds being lower than download
      - converting megabits per second to minutes for two gigabytes
      - chance of interruption during long uploads
      - resumable or chunked uploads
      - compressing or uploading only changes
    rubric:
      excellent: Computes upload times across a range of realistic speeds, concludes that interruptions are likely, and proposes resumable chunked uploads or sending only changes.
      good: Computes a realistic duration and suggests resumable uploads.
      weak: Uses download speeds or makes a bits-to-bytes error.
    followups:
      - How would you show progress so users trust the upload?
    common_errors:
      - Assuming upload speeds match advertised download speeds.

  - external_key: problem_solving.estimation.payslip_batch_generation
    competency_key: problem_solving
    topic: Batch document generation throughput
    difficulty: easy
    text: >-
      A payroll system must generate half a million payslip PDFs on the last day of the month, ready within two
      hours. How would you estimate the processing capacity needed?
    expected_concepts:
      - required documents per second
      - measured time to render one document
      - number of parallel workers
      - downstream limits such as storage writes or email
      - running early or spreading the work where rules allow
    rubric:
      excellent: Computes about seventy documents per second, derives workers from measured render time, checks downstream limits, and plans buffer for reruns.
      good: Gets the throughput target and a worker count.
      weak: Cannot convert the deadline into a rate.
    followups:
      - What if a bug forces a full rerun at the last minute?
    common_errors:
      - Leaving no time for a rerun.

  - external_key: problem_solving.estimation.error_rate_users_affected
    competency_key: problem_solving
    topic: Translating error rates into user impact
    difficulty: easy
    text: >-
      Your dashboard shows a point one percent error rate on fifty million requests a day, and someone says
      that's negligible. How would you work out how many users are actually affected?
    expected_concepts:
      - fifty thousand failed requests per day
      - requests per user session
      - chance that a session hits at least one error
      - whether errors concentrate on certain users or flows
      - impact on critical flows such as payment
    rubric:
      excellent: Converts the rate into absolute failures, estimates the share of sessions affected given many requests per session, and checks whether errors cluster on specific users or critical flows.
      good: Converts the rate into absolute numbers and relates it to users.
      weak: Accepts that a small percentage means small impact.
    followups:
      - What if all the errors are on the payment endpoint?
    common_errors:
      - Assuming each error hits a different user.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.estimation.feature_flag_evaluation_rate
    competency_key: problem_solving
    topic: Evaluation volume for a shared service
    difficulty: medium
    text: >-
      Your company wants to build an internal feature flag service. If every backend request checks around ten
      flags, estimate the evaluation load and what that implies for the design.
    expected_concepts:
      - total backend requests per second across services
      - evaluations per second as ten times that
      - local evaluation in the SDK versus remote calls
      - cache refresh and update propagation
      - impact on latency and availability if remote
    rubric:
      excellent: Shows the evaluation rate is too high and latency-sensitive for remote calls, proposes local evaluation with streamed updates, and estimates the much smaller update traffic.
      good: Estimates evaluation volume and suggests caching flags locally.
      weak: Designs a remote call per evaluation without checking the load.
    followups:
      - How quickly must a flag change reach every service?
    common_errors:
      - Making every request depend on the flag service being up.

  - external_key: problem_solving.estimation.log_retention_tiering
    competency_key: observability
    topic: Cost of log retention choices
    difficulty: medium
    text: >-
      Your logs cost about forty thousand dollars a month with thirty days of searchable retention. How would you
      estimate the savings from keeping seven days searchable and the rest in cheap archive storage?
    expected_concepts:
      - splitting cost between ingestion and retention
      - share of the bill that depends on retention days
      - archive storage price per gigabyte
      - how often older logs are actually searched
      - cost and time to rehydrate archived logs
    rubric:
      excellent: Separates ingestion from retention cost, estimates savings only on the retention part, adds archive and rehydration costs, and checks how often older logs are queried.
      good: Estimates savings from fewer hot days with archive cost included.
      weak: Assumes cost scales linearly with retention days.
    followups:
      - Which logs would you exempt and keep hot for thirty days?
    common_errors:
      - Ignoring that ingestion is often the larger part of the bill.

  - external_key: problem_solving.estimation.retry_amplification_load
    competency_key: problem_solving
    topic: Retry amplification load
    difficulty: medium
    text: >-
      A dependency starts failing, and every caller retries three times with no backoff, while those callers are
      themselves retried by their own clients. Estimate how much the load on the struggling dependency grows.
    expected_concepts:
      - multiplying attempts across each retry layer
      - four attempts per layer giving sixteen times at two layers
      - retries arriving while the service is already overloaded
      - backoff with jitter and retry budgets
      - retrying at only one layer
    rubric:
      excellent: Shows attempts multiply across layers to an order-of-magnitude increase, explains why that prevents recovery, and proposes retry budgets, backoff with jitter and retrying at one layer only.
      good: Computes the multiplication and recommends backoff.
      weak: Thinks retries add only a little load.
    followups:
      - How would you set a retry budget for a service?
    common_errors:
      - Adding retries instead of multiplying them across layers.

  - external_key: problem_solving.estimation.transcription_service_capacity
    competency_key: problem_solving
    topic: Capacity for speech processing
    difficulty: medium
    text: >-
      A call-centre product wants every call transcribed, about forty thousand hours of audio a day. How would you
      estimate the compute you need if you run the speech model yourselves?
    expected_concepts:
      - real-time factor of the model on given hardware
      - audio hours to compute hours
      - batch versus live transcription requirements
      - daily peaks when calls cluster
      - comparing with a hosted per-minute price
    rubric:
      excellent: Uses a measured real-time factor to convert audio into GPU or CPU hours, separates live from batch needs, plans for peaks and compares the result with a per-minute hosted service.
      good: Converts audio hours into compute using a speed factor.
      weak: Cannot relate audio duration to compute time.
    followups:
      - If transcripts are only needed the next morning, how does that change the plan?
    common_errors:
      - Sizing for the daily average when live transcription follows call peaks.

  - external_key: problem_solving.estimation.churn_reduction_value
    competency_key: product_sense
    topic: Value of reducing churn
    difficulty: medium
    text: >-
      A subscription product with fifty thousand paying customers loses about three percent of them every month.
      How would you estimate the value of cutting that to two percent, to decide how much to invest?
    expected_concepts:
      - customer lifetime from churn rate
      - lifetime value change from 33 to 50 months
      - cumulative effect on the customer base over a year
      - revenue per customer and margin
      - comparing value with the cost of the initiative
    rubric:
      excellent: Translates churn into expected lifetime, shows the jump in lifetime value, projects the larger customer base over a year, and compares the gain with the investment.
      good: Estimates the additional retained customers and revenue over a year.
      weak: Treats a one-point change as one percent more revenue.
    followups:
      - How would you know whether your changes caused the drop in churn?
    common_errors:
      - Missing how small churn changes compound over time.

  - external_key: problem_solving.estimation.small_object_request_charges
    competency_key: cloud_cost_optimization
    topic: Request charges versus storage charges
    difficulty: medium
    text: >-
      A service stores sensor readings as millions of tiny files in object storage, and the bill is much higher
      than storage size alone would suggest. Walk me through estimating where the money goes.
    expected_concepts:
      - per-request pricing for writes and reads
      - number of objects written per day
      - storage cost compared with request cost
      - listing operations and lifecycle transitions charged per object
      - batching small records into larger files
    rubric:
      excellent: Computes request charges from object counts and shows they exceed storage cost, includes listing and lifecycle charges, and quantifies the saving from batching records into larger objects.
      good: Identifies request charges as the driver and estimates them.
      weak: Looks only at stored gigabytes.
    followups:
      - How would batching change how quickly data is available to readers?
    common_errors:
      - Ignoring per-object charges for lifecycle transitions.

  - external_key: problem_solving.estimation.market_tick_storage
    competency_key: problem_solving
    topic: Storage for high-frequency time series
    difficulty: medium
    text: >-
      A trading analytics team wants to store every price update for about ten thousand instruments, with busy
      instruments updating many times a second. Estimate daily and yearly storage.
    expected_concepts:
      - updates per instrument with a skewed distribution
      - bytes per update with timestamp and fields
      - trading hours rather than a full day
      - compression for columnar or time-series storage
      - yearly total across trading days
    rubric:
      excellent: Models a skewed update rate, limits it to trading hours, sizes records, applies realistic compression, and totals across trading days in a year.
      good: Produces daily and yearly totals with stated rates and sizes.
      weak: Applies the busiest instrument's rate to all instruments.
    followups:
      - How would query patterns change how you store it?
    common_errors:
      - Assuming trading happens twenty-four hours a day every day.

  - external_key: problem_solving.estimation.shard_count_from_limits
    competency_key: databases
    topic: Shard count from storage and write limits
    difficulty: medium
    text: >-
      A dataset is forty terabytes and takes two hundred thousand writes per second at peak. How would you
      estimate how many database shards you need?
    expected_concepts:
      - storage per shard with headroom
      - writes per second a single node sustains
      - taking the larger of the two shard counts
      - growth before re-sharding
      - hot keys breaking even distribution
    rubric:
      excellent: Computes shard counts from both storage and write throughput, takes the binding constraint, adds growth headroom, and considers uneven key distribution.
      good: Computes shards from one constraint and checks the other.
      weak: Picks a shard count without relating it to limits.
    followups:
      - What would you do about one customer who generates a fifth of all writes?
    common_errors:
      - Sizing only on storage and ignoring write throughput.

  - external_key: problem_solving.estimation.map_tile_storage
    competency_key: problem_solving
    topic: Storage for multi-resolution data
    difficulty: medium
    text: >-
      Your team is building a mapping feature that serves pre-rendered tiles at many zoom levels. How would you
      estimate the storage needed, and would you pre-render everything?
    expected_concepts:
      - tiles quadrupling with each zoom level
      - most of the world being empty or rarely viewed
      - average tile size
      - pre-rendering popular areas and rendering the rest on demand
      - caching rendered tiles
    rubric:
      excellent: Shows the geometric growth across zoom levels, recognises that deep zooms dominate the count, and proposes rendering popular areas ahead of time with on-demand rendering and caching elsewhere.
      good: Recognises the fourfold growth and estimates total tiles and size.
      weak: Treats every zoom level as the same size.
    followups:
      - How would you decide which areas count as popular?
    common_errors:
      - Ignoring that the deepest zoom levels hold most tiles.

  - external_key: problem_solving.estimation.mailbox_storage_growth
    competency_key: problem_solving
    topic: Per-user storage growth
    difficulty: medium
    text: >-
      You're planning storage for a business email service with a hundred thousand mailboxes. How would you
      estimate total storage growth over the next two years?
    expected_concepts:
      - emails received per user per day
      - average message size with and without attachments
      - deduplicating attachments sent to many recipients
      - deletion and retention policies
      - per-user quotas capping growth
    rubric:
      excellent: Builds growth from messages and sizes, separates attachments, accounts for deduplication, retention and quotas, and gives a two-year range.
      good: Produces a reasonable growth estimate with attachments considered.
      weak: Uses a single average mailbox size without growth.
    followups:
      - How would a legal hold policy change the estimate?
    common_errors:
      - Ignoring that attachments dominate mailbox size.

  - external_key: problem_solving.estimation.game_match_servers
    competency_key: problem_solving
    topic: Concurrent users from daily actives
    difficulty: medium
    text: >-
      An online multiplayer game has about two million daily players, and each match hosts ten players on a
      dedicated server process. Estimate how many match servers you need at the evening peak.
    expected_concepts:
      - average session length and sessions per day
      - concurrent players from daily players and time online
      - peak concurrency above the daily average
      - matches per host limited by CPU and memory
      - players waiting in lobbies rather than in matches
    rubric:
      excellent: Derives average concurrency from daily players and play time, applies a justified evening peak factor, converts players into matches and hosts, and adds headroom for regional spread and launches of new content.
      good: Gets a plausible peak concurrency and converts it into a host count.
      weak: Treats daily players as if they were all online at once.
    followups:
      - How would players being spread across several regions change the total?
    common_errors:
      - Confusing daily players with concurrent players.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.estimation.social_graph_edges
    competency_key: problem_solving
    topic: Storage for a large graph
    difficulty: hard
    text: >-
      A social network has three hundred million users who follow, on average, a couple of hundred accounts.
      Estimate the storage for the follow graph and how you'd serve lookups in both directions.
    expected_concepts:
      - total edges from users and average follows
      - bytes per edge with identifiers and timestamps
      - storing both directions doubling storage
      - celebrity accounts with huge follower lists
      - partitioning by user and pagination
    rubric:
      excellent: Computes tens of billions of edges, sizes them in both directions, flags accounts with millions of followers as a special case, and proposes a partitioning and pagination approach.
      good: Computes edges and storage including both directions.
      weak: Underestimates edge count or ignores reverse lookups.
    followups:
      - How would you count followers quickly for a celebrity account?
    common_errors:
      - Storing only one direction and needing to scan for the other.

  - external_key: problem_solving.estimation.ad_bidding_throughput
    competency_key: system_design
    topic: Throughput under a strict deadline
    difficulty: hard
    text: >-
      Your bidding service receives about one million auction requests per second and must answer each within
      a hundred milliseconds including network time. Estimate the compute needed and where the time goes.
    expected_concepts:
      - network round trip consuming part of the deadline
      - compute time left for model scoring
      - CPU cost per request and total cores
      - in-memory data for targeting to avoid remote calls
      - dropping requests rather than answering late
    rubric:
      excellent: Allocates the deadline between network and processing, converts per-request CPU into a core count with headroom, keeps lookups in memory, and plans to skip auctions under overload.
      good: Estimates cores from per-request cost and allocates the latency budget.
      weak: Ignores network time or the per-request cost.
    followups:
      - Which requests would you choose to skip when overloaded?
    common_errors:
      - Planning remote database calls inside the deadline.

  - external_key: problem_solving.estimation.rag_corpus_indexing
    competency_key: problem_solving
    topic: Time and cost to index a document corpus
    difficulty: hard
    text: >-
      A company wants an internal assistant that answers questions from twenty million documents. Estimate the
      time and cost to build the search index, and how you'd keep it up to date.
    expected_concepts:
      - pages and chunks per document
      - embedding throughput and cost per chunk
      - text extraction or OCR as a separate bottleneck
      - storage for chunks and vectors
      - incremental updates for changed documents
    rubric:
      excellent: Converts documents into chunks, estimates embedding time and cost from throughput, identifies extraction as a likely bottleneck, sizes storage, and plans incremental reindexing.
      good: Estimates chunk count, embedding time and cost.
      weak: Cannot break documents into units to estimate.
    followups:
      - How would you prioritise which documents to index first?
    common_errors:
      - Ignoring the cost of extracting text from scanned files.

  - external_key: problem_solving.estimation.evening_streaming_servers
    competency_key: problem_solving
    topic: Fermi estimate of a large service
    difficulty: hard
    text: >-
      Estimate how many video servers a large streaming service would need to handle evening peak viewing in a
      country of about fifty million people. Talk me through your chain of reasoning.
    expected_concepts:
      - households and share streaming at peak
      - average bitrate per stream
      - total peak bandwidth
      - throughput per server
      - caching popular titles close to viewers
    rubric:
      excellent: Builds a clear chain from population to concurrent streams to bandwidth to servers, sanity-checks each step, and explains how edge caching distributes that load.
      good: Reaches a plausible server count with a clear chain.
      weak: Skips steps or produces a number with no visible reasoning.
    followups:
      - Which step in your chain are you least confident about?
    common_errors:
      - Assuming every person streams separately rather than per household or device.

  - external_key: problem_solving.estimation.fraud_scoring_capacity
    competency_key: problem_solving
    topic: Capacity for real-time model scoring
    difficulty: hard
    text: >-
      Every card payment must be scored by a fraud model within fifty milliseconds, and volume peaks at about
      twenty thousand payments per second on holidays. Estimate the scoring capacity and what fails first.
    expected_concepts:
      - model inference time per request
      - feature lookups and their latency
      - cores or accelerators needed at peak
      - feature store read load
      - fallback rules if scoring times out
    rubric:
      excellent: Splits the deadline between feature lookups and inference, sizes compute and feature store load at peak, and identifies the feature store as a likely bottleneck with a rule-based fallback.
      good: Sizes model compute for peak load with a latency budget.
      weak: Ignores feature lookups or holiday peaks.
    followups:
      - What should happen to a payment if the model can't answer in time?
    common_errors:
      - Ignoring the read load on the feature store.

  - external_key: problem_solving.estimation.datacenter_exit_plan
    competency_key: project_management
    topic: Timeline for a data centre exit
    difficulty: hard
    text: >-
      Your company must leave its data centre when the lease ends in eighteen months, moving about four hundred
      applications to the cloud. How would you estimate whether the deadline is achievable?
    expected_concepts:
      - grouping applications by migration approach
      - effort per group calibrated by pilots
      - data transfer time for large datasets
      - dependencies forcing applications to move together
      - throughput of migrations per month versus deadline
    rubric:
      excellent: Groups applications by approach, calibrates effort with pilots, maps dependencies into move groups, computes the required migration rate per month and compares it with team capacity, and identifies a contingency for the hardest systems.
      good: Breaks applications into groups and estimates the monthly rate needed.
      weak: Divides four hundred by eighteen without considering complexity.
    followups:
      - What would you do with the ten applications nobody understands?
    common_errors:
      - Ignoring application dependencies.

  - external_key: problem_solving.estimation.id_column_exhaustion
    competency_key: databases
    topic: Running out of identifier space
    difficulty: hard
    text: >-
      A busy events table uses a thirty-two bit signed integer as its primary key, and it's inserting about
      three hundred rows a second. Estimate how long until the IDs run out, and how you'd plan the fix.
    expected_concepts:
      - about 2.1 billion maximum value
      - current ID value versus remaining space
      - inserts per day and days remaining
      - foreign keys and clients also using 32-bit types
      - online migration to 64-bit identifiers
    rubric:
      excellent: Computes the remaining time from the current value and insert rate, notes that gaps from rollbacks consume IDs faster, and plans an online migration covering foreign keys and client code.
      good: Computes the time to exhaustion and proposes widening the column.
      weak: Cannot estimate the limit or treats the change as a simple column alter.
    followups:
      - Why might the IDs run out sooner than the insert rate suggests?
    common_errors:
      - Forgetting that application code or other tables may also store the ID as 32-bit.
