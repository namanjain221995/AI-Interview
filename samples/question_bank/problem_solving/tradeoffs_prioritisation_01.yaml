# Curated questions: problem solving — trade-offs and prioritisation under constraints (time, risk,
# quality, cost). Scenario questions spoken by the AI interviewer; evaluation is based only on the
# reasoning and the content of the answer.
version: 1
defaults:
  role_tags: [general, tech_lead, product_manager, project_manager]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.tradeoffs_prioritisation.ship_now_or_polish
    competency_key: product_sense
    topic: Shipping now versus polishing
    difficulty: easy
    text: >-
      You're about to release a feature that works, but a few parts of the interface still feel rough. Your
      manager would like it out this week. How would you decide whether to ship now or take another week to
      polish it?
    expected_concepts:
      - who the users are and how visible the rough edges are
      - cost of waiting versus value of releasing early
      - whether the issues are cosmetic or block a task
      - option to release to a smaller group first
      - plan and owner for the follow-up polish
    rubric:
      excellent: Separates cosmetic issues from ones that block users, weighs the value of early release against the risk to trust, considers a limited release, and commits to a concrete follow-up plan.
      good: Weighs user impact against the deadline and reaches a reasoned decision.
      weak: Always ships or always polishes without looking at what the rough parts actually affect.
    followups:
      - What would make you hold the release even though your manager wants it out?
      - How would you make sure the polish work actually happens afterwards?
    common_errors:
      - Treating every imperfection as equally important.
      - Shipping with a vague promise to fix things later and no owner.

  - external_key: problem_solving.tradeoffs_prioritisation.monday_task_list
    competency_key: problem_solving
    topic: Ordering your own urgent tasks
    difficulty: easy
    text: >-
      It's Monday morning. You have five requests that people have each called urgent, a code review someone is
      waiting on, and a planning document due Friday. Walk me through how you'd decide what to do first.
    expected_concepts:
      - checking the real deadline and impact behind each "urgent" label
      - unblocking others early, such as a pending review
      - separating urgent from important work
      - protecting time for the larger deliverable
      - telling people when their request will be handled
    rubric:
      excellent: Verifies the actual urgency of each request, prioritises work that unblocks others, reserves focused time for the Friday deliverable, and proactively tells requesters what to expect.
      good: Uses a sensible ordering based on deadlines and impact.
      weak: Works in arrival order or tries to do everything at once with no reasoning.
    followups:
      - Two of the requests turn out to have the same deadline. How do you choose?
      - What do you tell the people whose requests you've put later in the week?
    common_errors:
      - Accepting every "urgent" label at face value.
      - Leaving the larger deliverable until the last day.

  - external_key: problem_solving.tradeoffs_prioritisation.recurring_manual_fix
    competency_key: problem_solving
    topic: Recurring workaround versus a proper fix
    difficulty: easy
    text: >-
      A report your team owns breaks at every month-end, and someone fixes it by hand each time, which takes
      about half a day. A proper fix would take roughly a week. How would you decide whether that week is worth
      spending now?
    expected_concepts:
      - total cost of the manual fix over time
      - risk of errors in the manual process
      - what else the week would be spent on
      - partial fixes that reduce most of the pain
      - timing relative to other commitments
    rubric:
      excellent: Estimates the cumulative cost and the error risk of the manual fix, compares it with the opportunity cost of the week, and considers a smaller fix that removes most of the pain.
      good: Compares time spent on manual fixes with the cost of the proper fix.
      weak: Decides on instinct without comparing costs or considering alternatives.
    followups:
      - How would your answer change if the manual fix occasionally produced wrong numbers?
      - Is there a cheaper middle option you'd look for?
    common_errors:
      - Counting only engineering hours and ignoring the risk of errors.
      - Ignoring what else the week could deliver.

  - external_key: problem_solving.tradeoffs_prioritisation.mid_sprint_bug
    competency_key: project_management
    topic: Pulling a bug into the current sprint
    difficulty: easy
    text: >-
      Halfway through a sprint, a customer-reported bug arrives. It isn't critical, but it annoys a lot of
      users. How do you decide whether to pull it into the current sprint or schedule it for later?
    expected_concepts:
      - severity and number of users affected
      - workarounds available to users
      - what would be displaced from the sprint
      - involving the product owner in the trade
      - communicating the decision back to support or the customer
    rubric:
      excellent: Assesses reach and severity, checks for a workaround, makes an explicit swap with the product owner rather than silently adding work, and closes the loop with support.
      good: Considers impact and sprint capacity before deciding.
      weak: Drops everything for the bug or ignores it without assessing impact.
    followups:
      - What would you take out of the sprint to make room?
      - How would you explain a "later" decision to the support team?
    common_errors:
      - Adding work to the sprint without removing anything.
      - Not telling the reporter what will happen.

  - external_key: problem_solving.tradeoffs_prioritisation.request_while_fully_booked
    competency_key: stakeholder_management
    topic: Responding to a request when fully booked
    difficulty: easy
    text: >-
      A colleague from another team asks for your help with something that would take about two days, and your
      week is already fully committed. How would you decide how to respond?
    expected_concepts:
      - understanding the importance and deadline of the request
      - comparing it with current commitments
      - involving your manager when priorities conflict
      - offering alternatives such as a smaller piece of help or a later date
      - being clear rather than half-committing
    rubric:
      excellent: Clarifies the stakes of the request, compares them with existing commitments, offers concrete alternatives or escalates the trade-off, and gives a clear answer rather than a vague yes.
      good: Weighs the request against current work and responds clearly.
      weak: Says yes to everything and lets other work slip, or refuses without understanding the request.
    followups:
      - What if the request is more important to the company than your current work?
      - How would you offer partial help without taking on the whole task?
    common_errors:
      - Agreeing and then quietly missing other commitments.
      - Declining without understanding the impact on the other team.

  - external_key: problem_solving.tradeoffs_prioritisation.fast_or_slow_decision
    competency_key: problem_solving
    topic: Deciding how much time a decision deserves
    difficulty: easy
    text: >-
      When you face a decision under time pressure, how do you tell whether it's one you can make quickly and
      adjust later, or one that deserves more time and analysis? Give me an example from your own work.
    expected_concepts:
      - reversibility and cost of changing course
      - size of the impact if the decision is wrong
      - cost of delaying the decision
      - gathering just enough information
      - a concrete example with the outcome
    rubric:
      excellent: Uses reversibility, impact and cost of delay to decide how much analysis to do, and illustrates it with a specific example including what happened.
      good: Distinguishes easily reversed decisions from costly ones with a reasonable example.
      weak: Treats all decisions the same way or gives no example.
    followups:
      - Tell me about a decision you made quickly that you later had to reverse. What did it cost?
      - How do you stop a team from over-analysing small decisions?
    common_errors:
      - Describing a general philosophy without a real example.
      - Ignoring the cost of making no decision.

  - external_key: problem_solving.tradeoffs_prioritisation.recommendation_by_tomorrow
    competency_key: problem_solving
    topic: Recommending before the ideal data exists
    difficulty: easy
    text: >-
      Your director needs a recommendation by tomorrow morning, but the data you'd ideally use won't be ready for
      a week. How would you give a useful answer in time?
    expected_concepts:
      - using available proxies or partial data
      - stating assumptions and confidence level
      - identifying what new data could change the answer
      - offering a provisional recommendation with a revisit date
      - checking whether the deadline is truly fixed
    rubric:
      excellent: Builds a provisional recommendation from available evidence, states assumptions and confidence plainly, names the data that could change it and proposes when to revisit.
      good: Gives a reasoned answer from partial data and notes its limits.
      weak: Refuses to answer without full data, or presents a guess as certain.
    followups:
      - How would you phrase your level of certainty to the director?
      - What would you do if the full data later contradicted your recommendation?
    common_errors:
      - Hiding uncertainty to sound decisive.
      - Missing the deadline while waiting for perfect data.

  - external_key: problem_solving.tradeoffs_prioritisation.release_with_minor_bug
    competency_key: project_management
    topic: Releasing with a known minor defect
    difficulty: easy
    text: >-
      A release is ready except for one known bug on a settings page that very few people use. How would you
      decide whether to ship with that bug or hold the release?
    expected_concepts:
      - severity and reach of the defect
      - value delivered by the rest of the release
      - whether the bug risks data or security
      - release notes, support briefing or a workaround
      - a scheduled fix
    rubric:
      excellent: Checks that the bug has no data or security risk, weighs its small reach against the value of the release, prepares support and users, and schedules the fix.
      good: Weighs the bug's impact against the release's value and decides sensibly.
      weak: Holds the release for any bug or ships without checking what the bug could break.
    followups:
      - What would change your mind and make you hold the release?
      - Who would you tell before shipping?
    common_errors:
      - Not checking whether the "minor" bug could corrupt data.
      - Forgetting to brief support.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.tradeoffs_prioritisation.which_risks_to_mitigate
    competency_key: project_management
    topic: Choosing which risks to mitigate
    difficulty: medium
    text: >-
      You're planning the next quarter of a project and have listed eight risks. Some are likely but minor,
      others unlikely but severe. How would you decide which ones to actively mitigate and which to simply
      monitor?
    expected_concepts:
      - assessing likelihood and impact
      - cost of mitigation compared with expected loss
      - early warning signs and triggers for action
      - owners for each risk
      - revisiting the assessment as the project moves
    rubric:
      excellent: Scores risks on likelihood and impact, compares mitigation cost with expected loss, gives severe low-probability risks special attention, and sets owners, triggers and review points.
      good: Ranks risks by likelihood and impact and mitigates the top ones.
      weak: Tries to mitigate everything equally or picks risks by gut feel.
    followups:
      - How do you treat a risk that is very unlikely but would end the project?
      - What does monitoring actually look like for the risks you don't mitigate?
    common_errors:
      - Ignoring rare but catastrophic risks.
      - Listing risks without owners or triggers.

  - external_key: problem_solving.tradeoffs_prioritisation.cheaper_but_slower_infra
    competency_key: problem_solving
    topic: Cutting cost at the expense of speed
    difficulty: medium
    text: >-
      Your team could cut its monthly infrastructure bill by about thirty percent by moving to cheaper servers,
      but response times would get noticeably slower. How would you work out whether that's a good trade?
    expected_concepts:
      - measuring how latency affects users or revenue
      - quantifying the savings over a year
      - user-facing versus background workloads
      - testing the change on a subset first
      - alternative savings with less impact
    rubric:
      excellent: Links latency to user behaviour or revenue with data, compares that with the annual savings, separates workloads where speed matters from those where it doesn't, and proposes a measured trial.
      good: Compares savings with the expected impact on users.
      weak: Decides on cost alone or on speed alone without measuring the other side.
    followups:
      - How would you measure what slower responses actually cost you?
      - Could you get most of the savings without slowing down the user-facing parts?
    common_errors:
      - Assuming users won't notice without checking.
      - Treating all workloads the same.

  - external_key: problem_solving.tradeoffs_prioritisation.one_expert_two_projects
    competency_key: project_management
    topic: Two projects need the same expert
    difficulty: medium
    text: >-
      Two important projects both need the one engineer who really understands the payments system, and both
      need them over the same month. How would you handle that?
    expected_concepts:
      - comparing the business value and deadlines of each project
      - which tasks truly need the expert versus others
      - sequencing or splitting the expert's time
      - pairing to spread knowledge
      - escalating the trade-off to the right decision-maker
    rubric:
      excellent: Breaks down exactly which work needs the expert, sequences or splits their time based on value and deadlines, uses pairing to reduce the dependency, and escalates the final trade-off transparently.
      good: Prioritises between projects and finds some way to share the expert.
      weak: Lets the projects compete for the person, or overloads them with both.
    followups:
      - How would you reduce this dependency for next time?
      - What if the expert's own preference differs from the business priority?
    common_errors:
      - Assigning the expert to both at full load.
      - Not addressing the underlying single point of knowledge.

  - external_key: problem_solving.tradeoffs_prioritisation.find_the_critical_path
    competency_key: project_management
    topic: Finding where a plan has slack
    difficulty: medium
    text: >-
      You're looking at a project plan with a dozen workstreams and a fixed launch date. How do you work out
      which pieces of work deserve the most attention and which ones have room to slip?
    expected_concepts:
      - mapping dependencies between workstreams
      - identifying the critical path
      - slack on non-critical work
      - risk and uncertainty in estimates
      - focusing reviews and help on critical items
    rubric:
      excellent: Maps dependencies to find the critical path, recognises that uncertain estimates can shift it, and directs attention and help to critical and high-uncertainty work while tracking slack elsewhere.
      good: Identifies dependencies and the work that drives the date.
      weak: Treats every workstream as equally important or focuses on the loudest one.
    followups:
      - What happens to your plan when a non-critical task slips past its slack?
      - How do you handle estimates you don't trust?
    common_errors:
      - Ignoring dependencies between teams.
      - Assuming the critical path never changes.

  - external_key: problem_solving.tradeoffs_prioritisation.biggest_customer_custom_feature
    competency_key: product_sense
    topic: A feature only one big customer wants
    difficulty: medium
    text: >-
      Your largest customer is asking for a feature that only they would use, and they've hinted that their
      renewal depends on it. How would you think through whether to build it?
    expected_concepts:
      - understanding the underlying need behind the request
      - revenue at risk versus build and maintenance cost
      - whether a general version would help other customers
      - alternatives such as configuration or services work
      - long-term product complexity
    rubric:
      excellent: Digs into the real need, weighs revenue at risk against ongoing maintenance and product complexity, looks for a version that serves more customers, and considers alternatives to custom code.
      good: Compares revenue risk with cost and looks at the underlying need.
      weak: Builds whatever the big customer asks for, or refuses without analysis.
    followups:
      - How would you test whether the renewal threat is real?
      - What does this feature cost after it's built?
    common_errors:
      - Ignoring the maintenance cost of one-off features.
      - Taking the request literally without exploring the need.

  - external_key: problem_solving.tradeoffs_prioritisation.mandatory_two_factor
    competency_key: problem_solving
    topic: Security control versus user friction
    difficulty: medium
    text: >-
      Your security team wants to make two-factor login mandatory for every user, and your support team is
      worried it will cause a flood of locked-out customers. How would you work toward a decision?
    expected_concepts:
      - the specific threat and how much it reduces risk
      - estimating support load and user drop-off
      - phased rollout or risk-based enforcement
      - recovery flows to reduce lockouts
      - shared success measures for both teams
    rubric:
      excellent: Quantifies both the security benefit and the support impact, designs options such as phased or risk-based rollout with good recovery flows, and gets both teams to agree on measures.
      good: Considers both sides and proposes a middle path.
      weak: Sides with one team without evidence or ignores recovery and rollout options.
    followups:
      - How would you roll it out to learn before enforcing it for everyone?
      - What would you measure in the first month?
    common_errors:
      - Treating it as security against usability with no middle option.
      - Ignoring account recovery.

  - external_key: problem_solving.tradeoffs_prioritisation.weak_early_results
    competency_key: problem_solving
    topic: Continue, pivot or stop a project
    difficulty: medium
    text: >-
      A project your team has spent four months on is showing much weaker results in early testing than anyone
      expected. How would you decide whether to keep going, change direction, or stop?
    expected_concepts:
      - separating past investment from future value
      - understanding why results are weak
      - remaining cost to reach a meaningful result
      - criteria agreed in advance for continuing
      - salvaging reusable parts and learning
    rubric:
      excellent: Explicitly sets aside the sunk four months, diagnoses why results are weak, compares remaining cost with likely value, sets clear criteria for the decision and salvages what is reusable.
      good: Evaluates future value and makes a reasoned call.
      weak: Continues because of the effort already spent, or stops without understanding why results are weak.
    followups:
      - How would you tell the team if you decided to stop?
      - What evidence would convince you to give it one more month?
    common_errors:
      - Letting the time already spent drive the decision.
      - Stopping before checking whether the test itself was flawed.

  - external_key: problem_solving.tradeoffs_prioritisation.maintenance_eating_roadmap
    competency_key: project_management
    topic: Splitting capacity between maintenance and roadmap
    difficulty: medium
    text: >-
      Your team keeps getting pulled into support and maintenance work, and roadmap commitments are slipping.
      How would you decide how much capacity to protect for each kind of work?
    expected_concepts:
      - measuring how time is actually spent
      - identifying the sources of maintenance load
      - an explicit capacity allocation
      - reducing recurring maintenance at its root
      - resetting roadmap expectations with stakeholders
    rubric:
      excellent: Measures where time goes, sets an explicit capacity split, invests in removing the biggest sources of maintenance, and resets roadmap commitments with stakeholders based on real capacity.
      good: Sets aside capacity for maintenance and adjusts the roadmap.
      weak: Asks the team to work harder or ignores the maintenance load.
    followups:
      - What data would you gather before setting the split?
      - How would you explain the reduced roadmap to stakeholders?
    common_errors:
      - Planning the roadmap as if maintenance didn't exist.
      - Never tackling why maintenance is so high.

  - external_key: problem_solving.tradeoffs_prioritisation.test_or_just_ship
    competency_key: product_sense
    topic: Running an experiment versus shipping directly
    difficulty: medium
    text: >-
      The team thinks a product change is obviously good, but running a proper A/B test would delay the full
      rollout by three weeks. How would you decide whether to test it or just ship it?
    expected_concepts:
      - risk and reversibility of the change
      - whether the result would change any decision
      - cost of the delay
      - traffic needed for a meaningful test
      - lighter alternatives such as staged rollout with monitoring
    rubric:
      excellent: Asks whether the test result could change the decision, weighs risk and reversibility against the cost of delay, checks if a meaningful test is even feasible, and considers a monitored staged rollout.
      good: Weighs risk against delay and picks an approach with reasons.
      weak: Always tests or never tests regardless of context.
    followups:
      - When is an "obviously good" change most likely to backfire?
      - What would you monitor if you shipped without a test?
    common_errors:
      - Running tests that lack enough traffic to show anything.
      - Trusting team intuition with no way to detect harm.

  - external_key: problem_solving.tradeoffs_prioritisation.competitor_launch_mid_project
    competency_key: product_sense
    topic: Changing course after new market information
    difficulty: medium
    text: >-
      Two weeks into a six-week project, a competitor launches something that changes what your customers are
      asking for. How would you decide whether to change course?
    expected_concepts:
      - validating the impact with real customer evidence
      - whether the current project still solves a real problem
      - cost of switching versus cost of continuing
      - adjusting scope rather than full restart
      - communicating the decision and its reasons
    rubric:
      excellent: Validates the shift with customer evidence before reacting, compares the cost of switching with the cost of continuing, looks for scope adjustments, and explains the decision clearly.
      good: Checks the impact on customers and adjusts plans reasonably.
      weak: Drops everything to copy the competitor, or ignores the change entirely.
    followups:
      - How would you quickly find out whether your customers really care?
      - What would you keep from the work already done?
    common_errors:
      - Reacting to the competitor without customer evidence.
      - Treating the choice as all-or-nothing.

  - external_key: problem_solving.tradeoffs_prioritisation.explaining_a_delay
    competency_key: stakeholder_management
    topic: Explaining a deprioritisation decision
    difficulty: medium
    text: >-
      You've decided to delay a feature a key stakeholder cares about so the team can do reliability work. How
      would you explain that decision so they understand the reasoning, even if they don't like it?
    expected_concepts:
      - framing the decision in terms of their goals
      - evidence for the reliability risk
      - what they will get and when
      - acknowledging what they lose
      - a path to revisit if circumstances change
    rubric:
      excellent: Connects the decision to the stakeholder's own goals, shows the evidence, is clear about the new timeline and what they lose, and offers a defined point to revisit.
      good: Explains the reasoning and gives a new timeline.
      weak: Announces the decision without reasons or hides the delay.
    followups:
      - What if the stakeholder escalates to your manager?
      - How would you show the reliability work paid off?
    common_errors:
      - Using technical jargon the stakeholder can't relate to.
      - Giving no new date or commitment.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.tradeoffs_prioritisation.budget_cut_same_goals
    competency_key: project_management
    topic: Budget cut with unchanged goals
    difficulty: hard
    text: >-
      Your department's budget for next year has just been cut by a quarter, but leadership still expects the
      main roadmap goals to be met. How would you approach deciding what changes?
    expected_concepts:
      - understanding which goals matter most to leadership
      - mapping spend to the goals it supports
      - identifying low-value spend and work to stop
      - efficiency options and their risks
      - making the remaining trade-offs explicit to leadership
    rubric:
      excellent: Ties every area of spend to the goals it serves, stops or reduces low-value work, assesses efficiency options realistically, and goes back to leadership with explicit options and their consequences.
      good: Prioritises goals and finds cuts with some analysis.
      weak: Cuts evenly across everything or promises the same results without a plan.
    followups:
      - What would you say if you concluded the goals can't all be met?
      - Which kinds of cuts tend to cost more later?
    common_errors:
      - Across-the-board cuts that weaken every project.
      - Accepting the goals without stating the risk.

  - external_key: problem_solving.tradeoffs_prioritisation.restore_or_preserve_evidence
    competency_key: problem_solving
    topic: Restoring service versus preserving evidence
    difficulty: hard
    text: >-
      During a major outage, the fastest way to restore service is to restart everything, but doing so will wipe
      the state you'd need to find the root cause. How would you make that call in the moment?
    expected_concepts:
      - customer impact per minute of downtime
      - capturing key evidence quickly before restarting
      - restarting part of the system and keeping one instance for analysis
      - likelihood of recurrence if the cause stays unknown
      - who has authority to decide during the incident
    rubric:
      excellent: Prioritises restoring service while looking for a fast way to keep evidence, such as snapshots or isolating one instance, weighs recurrence risk, and is clear about who decides.
      good: Restores service and makes some effort to capture evidence.
      weak: Delays recovery indefinitely to investigate, or restarts without any thought of preserving evidence.
    followups:
      - What would you capture if you only had two minutes?
      - How would the decision change if this was the third time this week?
    common_errors:
      - Treating evidence and recovery as all-or-nothing.
      - Leaving it unclear who makes the call.

  - external_key: problem_solving.tradeoffs_prioritisation.hard_to_reverse_choice
    competency_key: problem_solving
    topic: Hard-to-reverse choice with fuzzy requirements
    difficulty: hard
    text: >-
      Your team must choose a core technology for a new product, which will be very hard to change later, and you
      have two weeks to decide while the product requirements are still unclear. How would you approach the
      decision?
    expected_concepts:
      - identifying the requirements that most affect the choice
      - quick experiments or prototypes on the riskiest assumptions
      - designing to keep options open where possible
      - criteria and weights agreed with stakeholders
      - documenting the decision and its assumptions
    rubric:
      excellent: Isolates the few requirements that drive the choice, tests the riskiest assumptions quickly, designs boundaries that reduce lock-in, and records the decision and its assumptions.
      good: Uses criteria and some experimentation to decide.
      weak: Picks a familiar option by default or stalls waiting for full requirements.
    followups:
      - What would you prototype in those two weeks?
      - How would you limit the damage if the choice turns out wrong?
    common_errors:
      - Choosing based on popularity or familiarity alone.
      - Not recording the assumptions behind the decision.

  - external_key: problem_solving.tradeoffs_prioritisation.viral_launch_go_no_go
    competency_key: problem_solving
    topic: Go or no-go with uncertain capacity
    difficulty: hard
    text: >-
      It's the night before a major launch that has been announced publicly. Testing shows the system handles the
      expected traffic, but you aren't sure it would survive a spike if the launch goes viral. How would you
      decide whether to go ahead?
    expected_concepts:
      - likelihood and size of a traffic spike
      - consequences of failing publicly versus delaying publicly
      - protective measures such as waitlists, rate limits or degraded modes
      - rollback and incident readiness
      - who makes the final call and how it is recorded
    rubric:
      excellent: Compares the consequences of a public failure with a public delay, adds protections like rate limits or a waitlist, confirms incident readiness, and makes a clear documented call with the right people.
      good: Weighs risk and proposes some safeguards before deciding.
      weak: Goes ahead hoping for the best or cancels without considering safeguards.
    followups:
      - Which safeguards could you realistically add overnight?
      - What would you need to see to call it off?
    common_errors:
      - Framing it as launch or delay with no safeguards in between.
      - Not preparing an incident plan for launch day.

  - external_key: problem_solving.tradeoffs_prioritisation.safe_wins_versus_big_bets
    competency_key: product_sense
    topic: Balancing small wins and big bets
    difficulty: hard
    text: >-
      You're setting the roadmap for the year, and the team keeps filling it with small, safe improvements. How
      would you decide how much to invest in larger, riskier bets alongside them?
    expected_concepts:
      - strategic goals the small items can't reach
      - deliberate allocation across low and high risk work
      - staging big bets with early checkpoints
      - criteria for stopping a bet
      - showing progress from both kinds of work
    rubric:
      excellent: Ties the need for bigger bets to strategic goals, sets a deliberate allocation, breaks bets into stages with checkpoints and stop criteria, and keeps steady wins flowing.
      good: Argues for a mix and has some way to manage the risk of big bets.
      weak: Picks only safe work or only big bets without a way to manage risk.
    followups:
      - How would you structure the first three months of a big bet?
      - What would you say to people who see bets as wasted effort?
    common_errors:
      - Committing to a big bet with no checkpoints.
      - Assuming many small wins add up to a strategy.

  - external_key: problem_solving.tradeoffs_prioritisation.standardise_or_let_teams_choose
    competency_key: problem_solving
    topic: Standardising tools across teams
    difficulty: hard
    text: >-
      Several teams in your organisation use different tools for the same job, which makes it slow for people to
      move between teams, but each team says its choice fits its needs best. How would you decide whether and
      how to standardise?
    expected_concepts:
      - quantifying the cost of fragmentation
      - genuine differences in needs versus preference
      - cost and disruption of migrating
      - partial standardisation or shared interfaces
      - involving teams in the decision and a phased plan
    rubric:
      excellent: Measures the real cost of fragmentation, separates genuine needs from preference, weighs migration cost, considers partial standards, and involves teams in a phased plan.
      good: Compares costs and benefits of standardising and involves the teams.
      weak: Mandates one tool without analysis or leaves things as they are without weighing the cost.
    followups:
      - How would you handle a team with a genuinely different need?
      - What would make migration worth the disruption?
    common_errors:
      - Ignoring migration cost.
      - Deciding without input from the teams affected.
