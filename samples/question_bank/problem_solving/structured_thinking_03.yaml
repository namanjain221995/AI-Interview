# Curated questions: structured thinking for open-ended problems (any role), part 3.
version: 1
defaults:
  role_tags: [general]
  round_types: [problem_solving, combined]
  kind: scenario
  competency_key: problem_solving
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.structured_thinking.process_is_broken
    topic: Unpacking a sweeping statement
    difficulty: easy
    text: >-
      In your first week on a new team, several people tell you "the request process is broken." How would you
      figure out what they actually mean before trying to fix anything?
    expected_concepts:
      - ask each person for a specific recent example
      - walk through the process as it really happens
      - group the complaints into distinct issues
      - check how often each issue occurs
      - confirm your summary with the people involved
    rubric:
      excellent: Collects concrete examples, observes the real process, groups complaints into distinct issues sized by frequency and plays the summary back to the team before acting.
      good: Gathers examples and identifies the main issues.
      weak: Accepts the statement and redesigns the whole process.
    followups:
      - What if each person describes a completely different problem?
      - How would you tell a frequent issue from a memorable one?
    common_errors:
      - Assuming everyone means the same thing by "broken".

  - external_key: problem_solving.structured_thinking.tool_switch_unknowns
    topic: Listing what you don't know
    difficulty: easy
    text: >-
      You're asked how long it would take to move your team from one project-tracking tool to another. Before
      giving any answer, how would you work out what you don't yet know?
    expected_concepts:
      - list the pieces of work involved such as data, setup and training
      - for each piece, note what is known and unknown
      - identify unknowns with the biggest effect on time
      - find quick ways to answer the biggest unknowns
      - give a range that reflects remaining unknowns
    rubric:
      excellent: Breaks the move into its parts, lists known and unknown factors for each, resolves the most influential unknowns quickly and answers with a range that reflects what is still uncertain.
      good: Identifies the main unknowns and investigates some before answering.
      weak: Gives a number based on a guess without examining unknowns.
    followups:
      - Which unknown would you expect to have the biggest effect?
      - How would you explain a wide range to someone who wants a date?
    common_errors:
      - Forgetting the people side such as training and habits.

  - external_key: problem_solving.structured_thinking.missing_confirmation_emails
    topic: Checking simple explanations first
    difficulty: easy
    text: >-
      Some customers say they never received their order confirmation email. In what order would you check the
      possible causes, and why that order?
    expected_concepts:
      - list possible causes from simple to complex
      - check the most likely and cheapest first such as spam folders or typos in addresses
      - check whether the email was actually sent
      - look for a pattern among affected customers
      - escalate to deeper causes only if simple ones are ruled out
    rubric:
      excellent: Orders checks by likelihood and cost, verifies whether emails were sent at all, looks for patterns among affected customers and moves to complex causes only once simple ones are ruled out.
      good: Checks several plausible causes in a sensible order.
      weak: Starts with the most complex explanation or checks things at random.
    followups:
      - What pattern among affected customers would point to a deeper problem?
      - How would you confirm a fix with customers who already missed emails?
    common_errors:
      - Assuming the email was sent without checking.

  - external_key: problem_solving.structured_thinking.three_changes_at_once
    topic: Knowing which change made the difference
    difficulty: easy
    text: >-
      To improve a low survey response rate, your team changed the subject line, the timing and the length all
      at once, and responses went up. How would you find out what actually worked, and what would you do
      differently next time?
    expected_concepts:
      - recognise that the effects can't be separated
      - consider other things that changed at the same time
      - test changes separately or in a structured way next time
      - use small samples to compare variants
      - decide whether knowing the cause matters enough to test
    rubric:
      excellent: Explains why the cause is unknown, considers outside factors, proposes testing changes separately or in a structured comparison, and judges whether it is worth the effort to know.
      good: Recognises the problem and suggests testing changes one at a time.
      weak: Credits whichever change they believe in most.
    followups:
      - When would it not matter which change worked?
      - How could you test all three without waiting months?
    common_errors:
      - Ignoring outside factors that changed at the same time.

  - external_key: problem_solving.structured_thinking.small_budget_event
    topic: Clarifying the real constraints
    difficulty: easy
    text: >-
      You're asked to plan a team offsite "on a small budget." What would you want to pin down before planning,
      and why does each point matter?
    expected_concepts:
      - the actual budget figure and what it must cover
      - the purpose and desired outcome of the offsite
      - the number of people and any fixed date
      - what is non-negotiable versus nice to have
      - who approves the plan
    rubric:
      excellent: Turns the vague constraint into specific numbers, ties planning to the offsite's purpose, separates must-haves from nice-to-haves and knows who approves.
      good: Clarifies the budget and a few key details.
      weak: Starts booking things based on their own idea of small.
    followups:
      - How would the purpose of the offsite change what you spend money on?
      - What would you cut first if costs came in higher than expected?
    common_errors:
      - Planning without knowing what the offsite is for.

  - external_key: problem_solving.structured_thinking.compare_two_filing_approaches
    topic: Comparing two approaches simply
    difficulty: easy
    text: >-
      Your team is debating whether to organise shared documents by project or by document type. How would you
      structure a comparison to help them choose?
    expected_concepts:
      - understand how people search for documents today
      - list a few criteria such as findability and maintenance effort
      - test both with real examples or tasks
      - consider how each handles edge cases
      - agree and document the choice
    rubric:
      excellent: Grounds the comparison in how people actually look for documents, uses a few clear criteria, tests both options on real tasks and records the decision.
      good: Compares both options on sensible criteria.
      weak: Picks one based on personal preference.
    followups:
      - How would you handle a document that belongs to several projects?
      - Could a combination of both work?
    common_errors:
      - Not checking how people actually search.

  - external_key: problem_solving.structured_thinking.problem_came_back
    topic: Revisiting a fix that didn't hold
    difficulty: easy
    text: >-
      A month ago you fixed a recurring problem with stock counts in a store, but now it's come back. How would
      you approach it this time?
    expected_concepts:
      - review what the original fix assumed
      - check whether the fix is still in place
      - consider whether the earlier fix addressed a symptom
      - look for what changed since the fix
      - verify the new fix more thoroughly
    rubric:
      excellent: Revisits the original diagnosis and its assumptions, checks whether the fix still holds and what changed, considers that it treated a symptom, and verifies the new fix more rigorously.
      good: Re-examines the original fix and investigates again.
      weak: Reapplies the same fix.
    followups:
      - How would you tell whether it's the same problem or a new one?
      - How long would you monitor this time before calling it fixed?
    common_errors:
      - Assuming the first diagnosis was correct.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.structured_thinking.write_problem_statement
    topic: Writing a clear problem statement
    difficulty: medium
    text: >-
      Customer onboarding at your company takes several weeks, and everyone has a theory why. If you had to write
      a one-paragraph problem statement to align people, what would you put in it?
    expected_concepts:
      - the current situation with numbers
      - the desired state and why it matters
      - who is affected and how
      - the scope including what is excluded
      - no proposed solution baked in
    rubric:
      excellent: Includes measured current state, the target and why it matters, who is affected, and explicit scope, while deliberately keeping solutions out of the statement.
      good: Captures the current situation, impact and goal.
      weak: Writes a statement that is really a proposed solution.
    followups:
      - Why keep solutions out of a problem statement?
      - How would you get agreement on it from teams with different theories?
    common_errors:
      - Embedding a favoured cause in the statement.

  - external_key: problem_solving.structured_thinking.underlying_need_mobile_app
    topic: Uncovering the need behind a solution request
    difficulty: medium
    text: >-
      A stakeholder insists, "We need a mobile app." How would you find out what problem they're actually trying
      to solve?
    expected_concepts:
      - ask what would be different if the app existed
      - explore who would use it and in what situations
      - identify the underlying need or pain
      - consider other ways to meet that need
      - agree on the problem before choosing a solution
    rubric:
      excellent: Uses questions about outcomes and situations to uncover the real need, explores alternatives that might meet it better, and agrees the problem before the solution.
      good: Asks why and identifies the underlying need.
      weak: Starts scoping the app immediately or dismisses the request.
    followups:
      - What would you do if the app really is the best answer?
      - How would you avoid sounding dismissive while questioning the request?
    common_errors:
      - Arguing against the solution instead of exploring the need.

  - external_key: problem_solving.structured_thinking.map_order_to_cash
    topic: Mapping a process to find where time goes
    difficulty: medium
    text: >-
      It takes far too long from when a customer places an order to when the company gets paid. How would you
      map that process to find where the time goes?
    expected_concepts:
      - list the steps and handoffs from order to payment
      - measure elapsed time at each step using real records
      - separate active work from waiting time
      - look at variation and outliers
      - focus on the steps with the most delay
    rubric:
      excellent: Maps every step and handoff from real records, separates waiting from working time, looks at variation as well as typical times and targets the largest delays.
      good: Maps the process and measures time at each step.
      weak: Relies on people's estimates of where time goes.
    followups:
      - Where would you expect most of the waiting to happen?
      - How would you get timing data if the process isn't recorded?
    common_errors:
      - Mapping the official process instead of the real one.

  - external_key: problem_solving.structured_thinking.premortem_rollout
    topic: Running a pre-mortem
    difficulty: medium
    text: >-
      Your team is about to roll out a new expense process across five offices. If you imagined it's six months
      from now and the rollout has failed, how would you use that to strengthen the plan?
    expected_concepts:
      - generate specific reasons it could have failed
      - include input from people in each office
      - rank the failure reasons by likelihood and impact
      - add preventions or early warnings for the top ones
      - decide on a staged rollout if risks are high
    rubric:
      excellent: Uses the pre-mortem to generate concrete failure stories with input from each office, ranks them and builds specific preventions, warning signs and staging into the plan.
      good: Identifies likely failure points and adds some mitigations.
      weak: Lists generic risks without changing the plan.
    followups:
      - How would you get people to name uncomfortable risks?
      - Which warning sign would you watch in the first week?
    common_errors:
      - Generating risks but not changing anything as a result.

  - external_key: problem_solving.structured_thinking.one_fix_many_problems
    topic: Finding a leverage point
    difficulty: medium
    text: >-
      A team keeps hitting lots of small problems: rework, missed handoffs, duplicate effort. How would you look
      for a single underlying change that would fix several of them at once?
    expected_concepts:
      - list the problems and when they happen
      - look for shared causes across them
      - trace each problem back through its causes
      - identify a cause linked to many problems
      - test the change and check which problems reduce
    rubric:
      excellent: Traces each symptom back through its causes, finds a shared root such as unclear ownership or inputs, tests a change there and measures which problems reduce.
      good: Looks for a common cause across the problems.
      weak: Fixes each problem separately.
    followups:
      - How would you show the shared cause is real and not a coincidence?
      - What if the leverage point is outside your control?
    common_errors:
      - Seeing a pattern that doesn't hold up when checked.

  - external_key: problem_solving.structured_thinking.one_region_of_five
    topic: Judging how far evidence generalises
    difficulty: medium
    text: >-
      You only have reliable data from one of five regions, and you're asked for a conclusion about the whole
      company. How would you reason about how far that data can be trusted to represent the rest?
    expected_concepts:
      - compare the region with others on key characteristics
      - identify factors that could make it unusual
      - look for any partial data from other regions
      - state the conclusion with explicit limits
      - suggest how to close the gap
    rubric:
      excellent: Compares the sampled region with the others on factors that matter, looks for partial cross-checks, states the conclusion with clear limits and proposes how to extend the evidence.
      good: Recognises the risk of generalising and qualifies the conclusion.
      weak: Applies the one region's result to the whole company without caveat.
    followups:
      - What would make this region a particularly bad sample?
      - How would you word the conclusion for leadership?
    common_errors:
      - Ignoring differences between regions.

  - external_key: problem_solving.structured_thinking.late_new_requirement
    topic: Restructuring when the problem changes late
    difficulty: medium
    text: >-
      Two weeks before delivery, a stakeholder adds a requirement that doesn't fit your current design. How would
      you work out how to respond?
    expected_concepts:
      - understand the requirement and why it appeared now
      - assess the impact on scope, time and quality
      - generate options such as phasing, trade-offs or delay
      - present the options and their costs to the stakeholder
      - record the decision and update the plan
    rubric:
      excellent: Clarifies the new requirement and its urgency, sizes the impact, lays out concrete options with costs and agrees a recorded decision with the stakeholder.
      good: Assesses impact and discusses options with the stakeholder.
      weak: Accepts it silently and overloads the team, or refuses outright.
    followups:
      - What if the stakeholder says everything is a must-have?
      - How would you stop this from happening on the next project?
    common_errors:
      - Not making the trade-off visible to the stakeholder.

  - external_key: problem_solving.structured_thinking.vendor_criteria_upfront
    topic: Setting decision criteria before seeing options
    difficulty: medium
    text: >-
      You need to choose one of four vendors for an important service. Why might you set your decision criteria
      and weights before seeing their proposals, and how would you do it?
    expected_concepts:
      - avoid being swayed by the best presentation
      - derive criteria from the actual needs and risks
      - weight criteria with stakeholder input
      - include deal-breakers separately from weighted criteria
      - score consistently and check the result for sense
    rubric:
      excellent: Explains how fixing criteria early reduces bias, derives weighted criteria and deal-breakers from real needs with stakeholders, scores consistently and sanity-checks the outcome.
      good: Sets sensible criteria in advance and scores against them.
      weak: Compares proposals informally after reading them.
    followups:
      - What would you do if the scores contradict everyone's gut feeling?
      - How would you handle a criterion that's hard to score?
    common_errors:
      - Treating a deal-breaker as just another weighted score.

  - external_key: problem_solving.structured_thinking.three_approvals_rule
    topic: Questioning a rule from first principles
    difficulty: medium
    text: >-
      Every purchase above a modest amount needs three separate approvals, and nobody remembers why. How would you
      evaluate whether the rule still makes sense?
    expected_concepts:
      - find the original purpose or risk behind the rule
      - check whether that risk still exists and at what level
      - measure the rule's cost in time and effort
      - consider whether other controls now cover the risk
      - propose a change with the rule's owner
    rubric:
      excellent: Reconstructs the risk the rule addresses, checks whether it still applies, weighs that against the rule's measured cost and proposes a proportionate change with the owner.
      good: Questions the rule's purpose and compares it to its cost.
      weak: Recommends removing it because it is slow, without understanding it.
    followups:
      - What if you can't find out why the rule was introduced?
      - How would you pilot a change safely?
    common_errors:
      - Assuming an old rule has no current purpose.

  - external_key: problem_solving.structured_thinking.themes_in_open_feedback
    topic: Structuring large amounts of open feedback
    difficulty: medium
    text: >-
      You've received several hundred free-text comments from customers. How would you structure them to find the
      themes that actually matter?
    expected_concepts:
      - read a sample to draft categories
      - refine categories so they are distinct
      - code the comments consistently
      - count frequency and assess severity per theme
      - link themes back to examples and other data
    rubric:
      excellent: Drafts categories from a sample, refines them to be distinct, codes consistently, weighs themes by both frequency and severity, and links them to examples and other data.
      good: Groups comments into themes and counts them.
      weak: Picks a few memorable comments as the themes.
    followups:
      - How would you make sure your own expectations don't shape the categories?
      - What would you do with a rare but serious complaint?
    common_errors:
      - Treating frequency as the only measure of importance.

  - external_key: problem_solving.structured_thinking.too_broad_too_narrow
    topic: Framing a problem at the right level
    difficulty: medium
    text: >-
      One person frames a problem as "improve communication across the company," and another as "start a weekly
      newsletter." How would you find the right level to frame it at?
    expected_concepts:
      - recognise one is too broad to act on and the other is a solution
      - ask why to move up and how to move down
      - find a framing that is specific and still open to several solutions
      - tie it to an observable problem
      - check the framing with stakeholders
    rubric:
      excellent: Explains why each framing fails, moves up and down by asking why and how, and lands on a specific, observable problem that still allows several solutions.
      good: Narrows the broad framing to something more specific and actionable.
      weak: Accepts one of the two framings as given.
    followups:
      - What evidence would tell you which communication problem matters most?
      - How do you know when a framing is specific enough?
    common_errors:
      - Narrowing so far that only one solution fits.

  - external_key: problem_solving.structured_thinking.staffing_model_check
    topic: Testing the logic of your own model
    difficulty: medium
    text: >-
      You've built a spreadsheet model that forecasts how many staff a call centre needs each week. Before people
      rely on it, how would you test whether its logic actually holds?
    expected_concepts:
      - run it against past weeks and compare with what happened
      - test extreme inputs to see if results stay sensible
      - check each assumption and its source
      - see how sensitive the output is to key inputs
      - have someone else review the logic
    rubric:
      excellent: Back-tests against past weeks, probes extreme inputs, traces each assumption to a source, checks sensitivity to key inputs and gets an independent review.
      good: Compares the model with past data and checks key assumptions.
      weak: Checks that formulas calculate without errors and stops there.
    followups:
      - What would you do if it matches past weeks well but you still doubt it?
      - Which input would you expect the output to be most sensitive to?
    common_errors:
      - Confusing a model that calculates correctly with one that reasons correctly.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.structured_thinking.make_us_more_efficient
    topic: Structuring a broad mandate
    difficulty: hard
    text: >-
      You start a new role with the mandate "make us more efficient," and nothing more specific. How would you
      structure your first month so you end up working on the right things?
    expected_concepts:
      - clarify what leadership means by efficiency and why now
      - map where time and money go at a high level
      - interview people across functions
      - build a list of opportunities sized by impact and effort
      - agree priorities with the sponsor and pick early wins
    rubric:
      excellent: Clarifies the intent behind the mandate, builds a fact-based map of where effort goes, sizes opportunities, agrees priorities with the sponsor and balances early wins with larger changes.
      good: Gathers information broadly and agrees priorities with leadership.
      weak: Starts on the first inefficiency they notice.
    followups:
      - How would you choose an early win?
      - What would you do if leadership's view of the problem differs from what you find?
    common_errors:
      - Equating efficiency with headcount reduction without being asked.

  - external_key: problem_solving.structured_thinking.cost_speed_quality_all
    topic: Untangling goals that pull against each other
    difficulty: hard
    text: >-
      Leadership wants a fulfilment operation to become cheaper, faster and more accurate, all at once. How would
      you structure the problem to find out where all three can improve and where you'll have to trade them?
    expected_concepts:
      - break each goal into its drivers
      - identify waste that hurts all three such as rework
      - find where goals genuinely conflict
      - quantify the trade-offs where they exist
      - present options with explicit choices for leadership
    rubric:
      excellent: Breaks each goal into drivers, finds shared causes like rework that improve all three, isolates genuine conflicts, quantifies them and puts explicit choices to leadership.
      good: Identifies some win-win improvements and some trade-offs.
      weak: Declares the goals incompatible or promises all three without analysis.
    followups:
      - Where would you look first for improvements that help all three?
      - How would you present a trade-off leadership doesn't want to hear?
    common_errors:
      - Assuming every improvement involves a trade-off.

  - external_key: problem_solving.structured_thinking.first_ever_switchover
    topic: Surfacing unknown unknowns
    difficulty: hard
    text: >-
      Your organisation is planning something it has never done before: switching every office to a new
      core system over a single weekend. How would you surface the risks nobody has thought of yet?
    expected_concepts:
      - talk to people who have done similar switchovers elsewhere
      - walk through the weekend hour by hour
      - rehearse with a dry run
      - involve people from every affected area
      - plan rollback and decision points
    rubric:
      excellent: Combines outside experience, detailed walk-throughs, rehearsals and broad involvement to surface hidden risks, and builds in explicit decision points and a rollback plan.
      good: Uses rehearsal and wide consultation to uncover risks.
      weak: Relies on the project team's own risk list.
    followups:
      - What would a rehearsal reveal that a planning meeting wouldn't?
      - At what point on the weekend would you decide to roll back?
    common_errors:
      - Planning only the happy path.

  - external_key: problem_solving.structured_thinking.chain_of_small_failures
    topic: Analysing a chain of failures
    difficulty: hard
    text: >-
      An important customer order was lost because of a chain of small failures across three teams, none of which
      would have mattered on its own. How would you analyse what happened so the fix improves the system rather
      than blaming individuals?
    expected_concepts:
      - reconstruct the sequence of events from records
      - identify each contributing failure and the conditions that allowed it
      - look at why safeguards didn't catch it
      - focus on process and design causes over individual error
      - choose fixes that break the chain at the most effective points
    rubric:
      excellent: Reconstructs the full chain from evidence, identifies each contributing factor and failed safeguard, frames causes in terms of systems and selects fixes at the most effective links.
      good: Builds a timeline and identifies several contributing factors.
      weak: Looks for the single person or team at fault.
    followups:
      - How would you choose which link in the chain to fix first?
      - How would you keep people open during the review?
    common_errors:
      - Stopping at the last failure before the loss.

  - external_key: problem_solving.structured_thinking.uncertain_business_case
    topic: Representing uncertainty in a case
    difficulty: hard
    text: >-
      You're building a case for a new initiative where almost every input, from adoption to cost, is highly
      uncertain. How would you represent that uncertainty and still reach a recommendation?
    expected_concepts:
      - use ranges instead of single numbers
      - identify which inputs drive the result most
      - build low, expected and high scenarios
      - find the break-even conditions
      - recommend staged commitment tied to learning
    rubric:
      excellent: Uses ranges and scenarios, identifies the inputs that drive the outcome, works out break-even conditions and recommends a staged commitment that reduces the key uncertainties.
      good: Presents scenarios and a recommendation with caveats.
      weak: Uses single-point estimates as if certain.
    followups:
      - How would you find which input matters most?
      - What would you do if the low scenario is a serious loss?
    common_errors:
      - Hiding uncertainty to make the case look stronger.

  - external_key: problem_solving.structured_thinking.seeking_disconfirming_evidence
    topic: Actively testing your own belief
    difficulty: hard
    text: >-
      You're quite sure a recent price increase is why customers are leaving. How would you deliberately look
      for evidence that you're wrong before you recommend reversing it?
    expected_concepts:
      - state what you would expect to see if the belief were false
      - check timing and which customers left
      - consider other changes in the same period
      - look at customers who stayed despite the increase
      - ask someone to argue the opposite case
    rubric:
      excellent: Defines what disconfirming evidence would look like, checks timing, segments and competing explanations, and invites challenge before recommending.
      good: Considers alternative explanations and checks some data.
      weak: Looks only for evidence that supports the belief.
    followups:
      - What finding would change your mind?
      - How would you test the price explanation directly?
    common_errors:
      - Treating exit survey reasons as the full story.
