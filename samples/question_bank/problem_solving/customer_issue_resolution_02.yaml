# Curated questions: problem solving — resolving complex customer-reported technical issues with
# incomplete information (part 2 of 4): integrations and APIs, data and locale problems, expectation
# gaps, mobile and offline clients, upgrades and scale-dependent failures.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [support_engineer, qa, fullstack]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.customer_issue_resolution.api_returns_wrong_data
    competency_key: technical_support
    topic: Request problem or response problem
    difficulty: easy
    text: >-
      A developer at a customer says our API "returns the wrong data". What would you ask them for so you can
      tell whether the problem is in their request or in our response?
    expected_concepts:
      - the exact request including endpoint, parameters, headers and body without secrets
      - the exact response and what they expected instead
      - a request id or timestamp to find the call in our logs
      - which credentials or account context they used
      - reproduce the same call independently
    rubric:
      excellent: Asks for the exact request and response with a request id, defines expected versus actual, excludes secrets, and reproduces the call independently to see which side is wrong.
      good: Asks for the request, response and expected result.
      weak: Starts checking our data without seeing what they actually sent.
    followups:
      - How would you get those details without them sending you their API key?
      - What would you do if your reproduction returns the right data?
    common_errors:
      - Not defining what "wrong" means before investigating.

  - external_key: problem_solving.customer_issue_resolution.expected_versus_designed
    competency_key: problem_solving
    topic: Separating expectation gaps from defects
    difficulty: easy
    text: >-
      Sometimes what a customer calls a bug is really a gap between what they expected and how the product is
      designed to work. How do you establish which one you're dealing with before you start investigating?
    expected_concepts:
      - ask what they expected to happen and why
      - check documentation, specifications or the product team for intended behaviour
      - check whether behaviour changed recently
      - reproduce to confirm the actual behaviour
      - if it is by design, still address their goal or record a product request
    rubric:
      excellent: Establishes expected versus actual explicitly, verifies intended behaviour from an authoritative source, checks for recent changes, and still helps with the underlying goal when it is by design.
      good: Asks what the customer expected and checks the documentation.
      weak: Decides it is a bug or not based on their own opinion of how it should work.
    followups:
      - What if the documentation and the actual behaviour disagree?
      - How do you record a design gap so product actually sees it?
    common_errors:
      - Treating "by design" as the end of the conversation.

  - external_key: problem_solving.customer_issue_resolution.notifications_some_members
    competency_key: debugging
    topic: In-app notifications reaching only some people
    difficulty: easy
    text: >-
      A customer says in-app notifications about new assignments reach some members of their team but not
      others. How would you investigate?
    expected_concepts:
      - list who does and doesn't receive them
      - compare notification preferences, roles and subscriptions
      - check whether the notifications were generated and delivered for a missing user
      - consider devices, sessions or browsers the users rely on
      - reproduce with a test user matching a non-receiving user
    rubric:
      excellent: Compares receiving and non-receiving users, checks whether notifications were generated, delivered or just not displayed, and reproduces with matching settings.
      good: Checks user preferences and notification logs.
      weak: Assumes the notification service is down for everyone.
    followups:
      - How would you tell "never created" apart from "created but not shown"?
      - What setting have you seen most often explain this kind of thing?
    common_errors:
      - Not distinguishing generation, delivery and display.

  - external_key: problem_solving.customer_issue_resolution.mobile_web_numbers_differ
    competency_key: problem_solving
    topic: Mobile and web showing different values
    difficulty: easy
    text: >-
      A customer says the totals shown in our mobile app are different from the totals on the website for the
      same account. How would you approach working out which one is wrong and why?
    expected_concepts:
      - confirm the same account, filters and time range on both
      - check the app version and whether it uses the same API
      - consider cached or offline data on the device
      - compute the expected value from the source data
      - check rounding, time zone or currency differences
    rubric:
      excellent: Rules out differences in filters and time range, establishes the correct value from source data, then explains which client diverges because of caching, versions or calculation differences.
      good: Compares the two views and checks for caching or version differences.
      weak: Assumes the website is right without checking the source data.
    followups:
      - What if both are wrong compared with the database?
      - How would you check whether the app is showing cached data?
    common_errors:
      - Not establishing the correct value independently.

  - external_key: problem_solving.customer_issue_resolution.request_screen_recording
    competency_key: customer_communication
    topic: When to ask for a screen recording
    difficulty: easy
    text: >-
      When would you ask a customer for a short screen recording instead of written steps, and how would you
      make that request easy for them to act on?
    expected_concepts:
      - useful when steps are hard to describe or timing and transitions matter
      - explain what to capture and how long
      - give simple instructions for built-in recording tools
      - remind them to avoid capturing sensitive information
      - say how it will help resolve the issue faster
    rubric:
      excellent: Gives clear criteria for when recordings beat written steps and a concrete, easy request covering tools, scope and privacy.
      good: Explains when a recording helps and how to ask for it.
      weak: Asks for a recording by default without guidance on what to capture.
    followups:
      - What would you look for first when you watch it?
      - What do you do if the recording shows something sensitive?
    common_errors:
      - Not warning customers to keep sensitive data out of the recording.

  - external_key: problem_solving.customer_issue_resolution.greyed_out_export
    competency_key: technical_support
    topic: Checking your own systems before replying
    difficulty: easy
    text: >-
      All you have is the customer's company name and the sentence "the export button is greyed out". What
      would you check on your side before you even reply to them?
    expected_concepts:
      - look up their account, plan and enabled features
      - check the user's role and permissions if the user can be identified
      - check known issues and recent releases affecting export
      - check account limits or usage caps
      - reply with a likely cause or precise questions
    rubric:
      excellent: Uses account data to test the likely explanations such as plan, permissions, limits and known issues, and replies with either a probable answer or precise questions.
      good: Checks the account's plan and permissions before asking questions.
      weak: Replies asking for more information without checking anything.
    followups:
      - How would you identify which user reported it?
      - What would your reply say if you found the plan doesn't include exports?
    common_errors:
      - Replying with generic questions that their account data could have answered.

  - external_key: problem_solving.customer_issue_resolution.qa_triage_support_escalation
    competency_key: testing
    topic: QA triage of a customer escalation
    difficulty: easy
    text: >-
      As a QA engineer, you receive a support escalation describing a customer bug. How would you confirm it,
      judge how widespread it is and decide whether it should block the release that's going out this week?
    expected_concepts:
      - reproduce on the released version and on the release candidate
      - identify the conditions needed such as browser, data or configuration
      - check whether existing tests cover the area
      - assess severity and affected users
      - give a clear recommendation with evidence to the release owner
    rubric:
      excellent: Reproduces on both versions, defines the conditions and reach of the bug, and gives the release owner an evidence-based recommendation.
      good: Reproduces it and assesses severity before the release decision.
      weak: Either blocks the release by default or ignores it because it's already in production.
    followups:
      - What would make you recommend blocking the release?
      - What if you can't reproduce it on either version?
    common_errors:
      - Not checking whether the release candidate already behaves differently.

  # ------------------------------------------------------------------ medium
  - external_key: problem_solving.customer_issue_resolution.garbled_import_characters
    competency_key: debugging
    topic: Garbled characters after an import
    difficulty: medium
    text: >-
      After a customer imports a spreadsheet export from another system, names in some rows show strange
      symbols in place of accented letters, while other rows look fine. How would you find the cause?
    expected_concepts:
      - suspect character encoding mismatch
      - get the original file and inspect its bytes or detected encoding
      - check which encoding the importer assumes
      - check whether the source system mixed encodings
      - reproduce with a small sample file
      - plan to repair the already-imported records
    rubric:
      excellent: Identifies encoding as the likely cause, confirms it by inspecting the original file and the importer's assumption, reproduces with a small sample, and plans repair of affected rows.
      good: Suspects encoding and checks the file and import settings.
      weak: Asks the customer to fix the names by hand.
    followups:
      - Why might only some rows be affected?
      - How would you repair the rows that were already imported?
    common_errors:
      - Fixing the display without checking whether the stored data is corrupted.

  - external_key: problem_solving.customer_issue_resolution.webhook_double_processing
    competency_key: debugging
    topic: Duplicate webhook deliveries
    difficulty: medium
    text: >-
      A customer says they're receiving the same webhook event several times, and their system processes it
      twice. How would you work out what's happening and what should change on each side?
    expected_concepts:
      - check our delivery logs for retries and their reasons
      - check how long their endpoint takes to respond and what status it returns
      - explain retry behaviour and at-least-once delivery
      - recommend idempotent handling on their side using event ids
      - check for a bug on our side sending genuinely duplicate events
    rubric:
      excellent: Uses delivery logs to see whether duplicates are retries or distinct sends, explains at-least-once delivery, and recommends both idempotent handling and any fix needed on our side.
      good: Identifies retries as the likely cause and suggests deduplicating by event id.
      weak: Blames the customer's system without checking our delivery logs.
    followups:
      - What would you look at to tell a retry from a genuinely duplicated event?
      - How would you explain idempotency to their developer?
    common_errors:
      - Ignoring that their slow responses may trigger our retries.

  - external_key: problem_solving.customer_issue_resolution.slow_in_the_mornings
    competency_key: problem_solving
    topic: A slowness complaint tied to time of day
    difficulty: medium
    text: >-
      A customer says search is "really slow in the mornings" but fine later in the day. How would you verify
      that and narrow down why?
    expected_concepts:
      - get specific examples with times, queries and users
      - check latency metrics by hour for their account and overall
      - look for morning load peaks, batch jobs, cache warm-up or index rebuilds
      - consider their side such as start-of-day logins, syncs or network load
      - test a theory by measuring the same query at different times
    rubric:
      excellent: Turns the complaint into measured data by hour, checks both platform and customer-side morning activity, and tests a specific theory with the same query at different times.
      good: Checks metrics for morning peaks and scheduled jobs.
      weak: Looks only at current performance and reports that it's fine.
    followups:
      - What morning activity on their side could cause this?
      - How would you confirm it without waiting days for it to happen again?
    common_errors:
      - Testing in the afternoon and concluding there's no problem.

  - external_key: problem_solving.customer_issue_resolution.records_disappeared
    competency_key: sql
    topic: Are the records gone or just hidden?
    difficulty: medium
    text: >-
      A customer says a batch of records has disappeared from their list view. How would you use the database
      to work out whether the data is actually gone, or just hidden by something like filters, archiving or
      permissions?
    expected_concepts:
      - query by known ids including soft-deleted or archived rows
      - check deletion or archive flags and timestamps
      - compare with the filters and visibility rules the list view applies
      - check audit tables for who changed or deleted them
      - use read-only queries and limit results
    rubric:
      excellent: Queries the records directly including soft-deleted state, compares with the view's filters and permissions, uses audit history to find what changed them, and works read-only.
      good: Checks whether the rows exist and whether they're flagged as deleted.
      weak: Assumes the data was deleted and starts talking about restoring backups.
    followups:
      - What would you do if audit history shows a user deleted them?
      - How would you find out exactly which filter the view is applying?
    common_errors:
      - Jumping to a backup restore before checking for soft deletes or filters.

  - external_key: problem_solving.customer_issue_resolution.decimal_separator_input
    competency_key: debugging
    topic: Number formats across locales
    difficulty: medium
    text: >-
      Users at a customer in Germany report that a quantity they enter as one thousand five hundred sometimes
      gets saved as one and a half. How would you investigate?
    expected_concepts:
      - suspect decimal and thousands separators differing by locale
      - check where parsing happens, browser, client library or server
      - check the user's browser and account locale settings
      - reproduce with the same locale settings
      - check how much existing data may be wrong
    rubric:
      excellent: Recognises the locale separator issue, finds which layer parses the number with the wrong locale, reproduces it, and plans to find and correct affected data.
      good: Identifies locale formatting as the cause and reproduces it.
      weak: Tells users to type numbers differently without investigating.
    followups:
      - Why might it happen only sometimes?
      - How would you find the records already saved incorrectly?
    common_errors:
      - Fixing the input format without checking data already stored.

  - external_key: problem_solving.customer_issue_resolution.random_logouts
    competency_key: technical_support
    topic: Users being signed out unexpectedly
    difficulty: medium
    text: >-
      Users at one customer say they get signed out several times a day at random. How would you work out
      what's ending their sessions?
    expected_concepts:
      - get exact times and users and check session or authentication logs
      - check session timeout and identity provider policies
      - consider load balancing across servers without shared sessions
      - consider browser settings, cookie clearing or security software
      - check for IP changes from proxies or VPNs that invalidate sessions
    rubric:
      excellent: Correlates sign-out times with authentication logs, checks policies, infrastructure and client causes, and identifies what sets these users apart from unaffected ones.
      good: Checks session settings and logs for the affected users.
      weak: Suggests users clear their cookies without investigating.
    followups:
      - What would the logs look like if their network changes IP addresses mid-session?
      - How would you compare these users with unaffected customers?
    common_errors:
      - Not collecting exact times, which makes correlation impossible.

  - external_key: problem_solving.customer_issue_resolution.skipped_versions_upgrade
    competency_key: problem_solving
    topic: Upgrades that skip several versions
    difficulty: medium
    text: >-
      A self-hosted customer jumped three major versions in one upgrade, and now two features behave
      differently. How would you work out which of the many changes in between is responsible?
    expected_concepts:
      - review release notes and migration steps for each skipped version
      - check whether required intermediate migrations ran
      - map changes to the two affected features
      - reproduce on a test install following the same upgrade path
      - separate intended behaviour changes from defects
    rubric:
      excellent: Methodically reviews changes across all skipped versions, checks intermediate migrations, reproduces using the same upgrade path and separates intended changes from bugs.
      good: Reads release notes and checks the upgrade ran correctly.
      weak: Only looks at the latest version's notes.
    followups:
      - How would you reproduce their exact upgrade path?
      - What if one change is intentional but breaks their workflow?
    common_errors:
      - Not checking whether intermediate data migrations actually ran.

  - external_key: problem_solving.customer_issue_resolution.offline_edits_vanish
    competency_key: debugging
    topic: Offline edits lost after syncing
    difficulty: medium
    text: >-
      Field workers using our mobile app offline say some edits vanish after they reconnect. How would you
      investigate?
    expected_concepts:
      - get specific records, devices, app versions and times
      - check the sync logs and conflict resolution rules
      - consider another user editing the same record while they were offline
      - check device clock differences affecting last-write-wins
      - check whether the app was closed before sync completed
      - reproduce with two devices and controlled timing
    rubric:
      excellent: Investigates sync and conflict rules with concrete records, considers clock skew and concurrent edits, and reproduces with controlled multi-device timing.
      good: Looks at sync logs and conflict handling.
      weak: Tells users to stay online.
    followups:
      - How would device clocks affect a last-write-wins rule?
      - What would you want the app to do in a conflict?
    common_errors:
      - Overlooking concurrent edits by other users.

  - external_key: problem_solving.customer_issue_resolution.explain_partial_fix
    competency_key: customer_communication
    topic: Explaining a fix that doesn't cover old data
    difficulty: medium
    text: >-
      Engineering has fixed a calculation bug, but the fix only applies to new records, and the customer's
      historical records are still wrong. How would you explain that to the customer and agree on next steps?
    expected_concepts:
      - state clearly what is fixed and what is not
      - quantify which historical records are affected
      - offer options such as a correction script, recalculation or manual review
      - explain any risks or downstream effects of correcting history
      - agree on a plan and timeline
    rubric:
      excellent: Gives a clear, specific explanation of the fix's limits, quantifies the affected history, presents correction options with their risks and agrees a plan.
      good: Explains the gap and proposes correcting the historical data.
      weak: Announces the bug is fixed without mentioning historical records.
    followups:
      - What if correcting historical records changes reports they've already filed?
      - How would you prove to them which records were affected?
    common_errors:
      - Letting the customer discover the old records are still wrong on their own.

  - external_key: problem_solving.customer_issue_resolution.third_party_addon_suspected
    competency_key: technical_support
    topic: When an add-on from another vendor may be the cause
    difficulty: medium
    text: >-
      A customer uses an add-on built by another vendor on top of our product, and something broke. How would
      you determine whether the add-on or our product is responsible?
    expected_concepts:
      - reproduce with the add-on disabled in a safe environment
      - check logs and requests to see which component raises the error
      - check whether either side released recently
      - check the add-on's use of our public interfaces against documentation
      - coordinate with the vendor with shared evidence
    rubric:
      excellent: Isolates with the add-on disabled, uses logs and change history to assign the fault with evidence, and engages the vendor with concrete findings.
      good: Tests with the add-on disabled and checks logs.
      weak: Tells the customer to contact the vendor without investigating.
    followups:
      - What if the add-on relies on behaviour we never documented?
      - How would you test without disrupting their production users?
    common_errors:
      - Disabling the add-on in production without warning.

  - external_key: problem_solving.customer_issue_resolution.crm_field_mapping
    competency_key: problem_solving
    topic: Integration writing values into the wrong fields
    difficulty: medium
    text: >-
      After a customer added a custom field in their CRM, our sync started putting values in the wrong fields
      for some records but not others. How would you investigate?
    expected_concepts:
      - compare the field mapping configuration before and after
      - check whether mapping depends on field order or position rather than ids
      - compare affected and unaffected records such as type or layout
      - check sync logs for the records involved
      - reproduce on a test CRM instance
      - plan correction of mis-synced data
    rubric:
      excellent: Connects the timing to the custom field, checks how mapping identifies fields, explains why only some records are affected, reproduces it, and plans data correction.
      good: Reviews the mapping and sync logs after the change.
      weak: Re-runs the sync hoping it corrects itself.
    followups:
      - Why would only some records be affected?
      - How would you stop further bad writes while you investigate?
    common_errors:
      - Not pausing the sync while bad data keeps being written.

  - external_key: problem_solving.customer_issue_resolution.pdf_layout_one_customer
    competency_key: debugging
    topic: Generated documents broken for one customer
    difficulty: medium
    text: >-
      Invoices generated as PDFs look correct for every customer except one, whose documents have overlapping
      text and missing sections. How would you find out what's special about them?
    expected_concepts:
      - compare their template, branding and settings with others
      - check data characteristics such as long names, many line items or special characters
      - check fonts and languages used
      - reproduce with their template and synthetic data
      - check rendering service logs for warnings
    rubric:
      excellent: Separates template from data causes, checks fonts, lengths and characters, and reproduces with their template and representative data.
      good: Compares their template and data with others.
      weak: Regenerates the documents and hopes for a different result.
    followups:
      - How would you test whether it's the template or the data?
      - What could make the problem appear only on some of their invoices?
    common_errors:
      - Only testing with short, simple data.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.customer_issue_resolution.corruption_unknown_start
    competency_key: problem_solving
    topic: Data wrong for an unknown period
    difficulty: hard
    text: >-
      A customer discovers that some of their records have been wrong for an unknown length of time. How would
      you work out when it started, which records are affected and what caused it?
    expected_concepts:
      - define precisely what "wrong" looks like so it can be detected
      - query or scan for affected records and find the earliest one
      - correlate the first occurrence with releases, configuration changes or integrations
      - use audit history and backups to compare values over time
      - contain further damage while investigating
      - plan correction and communicate scope
    rubric:
      excellent: Defines a detectable signature, finds the full affected set and the first occurrence, correlates it with changes, contains further damage and plans correction with clear scope.
      good: Finds affected records and correlates them with recent changes.
      weak: Fixes the records the customer mentioned without finding the rest or the cause.
    followups:
      - How would you use backups to narrow down when it started?
      - What would you do first if it's still happening?
    common_errors:
      - Not stopping ongoing corruption before analysing it.

  - external_key: problem_solving.customer_issue_resolution.month_end_peak_only
    competency_key: debugging
    topic: Failures only at the customer's peak
    difficulty: hard
    text: >-
      A customer's job fails only during their month-end peak, and you can't reproduce it at normal volumes.
      How would you investigate before the next month-end arrives?
    expected_concepts:
      - collect all evidence from previous peaks such as logs, metrics and data volumes
      - identify limits that scale with volume such as timeouts, memory, locks or rate limits
      - recreate peak volume and concurrency in a test environment
      - add targeted instrumentation ahead of the next peak
      - prepare mitigations and an on-call plan for that day
    rubric:
      excellent: Mines past peaks for evidence, reasons about volume-sensitive limits, reproduces at realistic scale and prepares both instrumentation and mitigations for the next peak.
      good: Load tests at higher volume and adds monitoring.
      weak: Waits for the next month-end to look at it again.
    followups:
      - What would you ask the customer about their month-end process?
      - What mitigation could you offer if you haven't found the cause in time?
    common_errors:
      - Testing with higher volume but not the same concurrency pattern.

  - external_key: problem_solving.customer_issue_resolution.silent_record_loss_sync
    competency_key: problem_solving
    topic: Small silent loss in a data sync
    difficulty: hard
    text: >-
      A customer's integration reports every run as successful, but their downstream system is missing roughly
      half a percent of the records. How would you find which records go missing and why?
    expected_concepts:
      - reconcile source and destination by id to list missing records
      - look for patterns among missing records such as timing, size, type or status changes during sync
      - check pagination, cursors, filters and boundary conditions
      - check error handling that skips records without failing the run
      - add reconciliation checks so loss is detected automatically
    rubric:
      excellent: Builds an id-level reconciliation, finds a pattern among missing records, checks boundary and error-swallowing logic, and proposes ongoing reconciliation.
      good: Compares source and destination and inspects the missing records for patterns.
      weak: Re-runs the full sync without explaining the loss.
    followups:
      - Which boundary conditions most often cause records to be skipped?
      - How would you make the run fail loudly instead of silently?
    common_errors:
      - Relying on totals instead of reconciling individual records.

  - external_key: problem_solving.customer_issue_resolution.risky_hotfix_decision
    competency_key: problem_solving
    topic: Deciding whether to ship a risky hotfix
    difficulty: hard
    text: >-
      You've found the likely cause of a customer's blocking problem. The fastest fix touches code that every
      other customer depends on, and testing it properly would take a week. How would you decide what to do?
    expected_concepts:
      - weigh the customer's impact against risk to everyone else
      - look for options such as a workaround, a customer-specific flag or a narrower fix
      - define the minimum testing that addresses the main risks
      - plan staged rollout and rollback
      - involve engineering and product in the decision and document it
    rubric:
      excellent: Lays out options beyond fix-now or wait, weighs impact against blast radius, proposes targeted testing with staged rollout and rollback, and makes it a shared, documented decision.
      good: Considers a narrower or flagged fix and adds testing before release.
      weak: Ships immediately or waits a week without considering alternatives.
    followups:
      - How would you limit the change to that one customer?
      - What evidence would make you decide to wait?
    common_errors:
      - Treating it as a binary choice between shipping now and waiting.

  - external_key: problem_solving.customer_issue_resolution.only_at_customer_scale
    competency_key: technical_support
    topic: Bugs that only appear at one customer's scale
    difficulty: hard
    text: >-
      A customer has fifty times more data than any test environment you have, and the bug only appears at
      their scale. How would you get it reproduced and fixed?
    expected_concepts:
      - gather size characteristics such as row counts, nesting and distribution
      - generate synthetic data at comparable scale and shape
      - check for operations that grow non-linearly with size
      - use profiling or query plans from their environment with permission
      - consider a diagnostic build or extra logging in their environment
    rubric:
      excellent: Characterises their data shape, builds a scale-representative reproduction, reasons about non-linear operations, and uses safe diagnostics in their environment when needed.
      good: Generates large synthetic data and profiles slow operations.
      weak: Says it can't be reproduced and asks them to reduce their data.
    followups:
      - What matters more for reproduction, total volume or how the data is distributed?
      - What diagnostics could you safely run in their environment?
    common_errors:
      - Generating uniform synthetic data that misses the skew in their real data.

  - external_key: problem_solving.customer_issue_resolution.stopped_without_known_fix
    competency_key: customer_communication
    topic: Closing out an issue that stopped on its own
    difficulty: hard
    text: >-
      After weeks of investigation, a customer's problem simply stopped happening, and nobody knows why. How
      would you handle closing it with the customer and internally?
    expected_concepts:
      - explain plainly that the cause is unconfirmed
      - list what changed around when it stopped
      - agree on monitoring and what will happen if it returns
      - record findings, ruled-out causes and remaining hypotheses
      - keep a way to reopen quickly with prior context
    rubric:
      excellent: Communicates plainly that the cause is unconfirmed, documents everything learned, sets up detection for recurrence and agrees with the customer on what happens if it returns.
      good: Explains the situation and documents the investigation before closing.
      weak: Closes the ticket as resolved and implies a fix.
    followups:
      - How long would you keep monitoring before closing?
      - What would you write in the internal notes?
    common_errors:
      - Implying the problem was fixed when the cause is unknown.
