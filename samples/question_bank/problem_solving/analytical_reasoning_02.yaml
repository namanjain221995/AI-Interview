# Curated questions: problem solving / analytical reasoning (part 2 of 4).
# Scenario questions about interpreting metric changes, ambiguous data and root-causing KPI moves.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_analyst, data_scientist, product_manager, business_analyst]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.analytical_reasoning.small_region_conversion_jump
    competency_key: statistics_experimentation
    topic: Noise in small samples
    difficulty: easy
    text: >-
      One of your smallest regions shows conversion jumping from three percent to five percent this week, and
      the regional manager wants to know what they did right. How would you decide whether there's anything
      to explain?
    expected_concepts:
      - check the absolute counts behind the rates
      - compare with the region's normal week-to-week variation
      - small samples produce large random swings
      - look at a longer window before drawing conclusions
    rubric:
      excellent: Looks at the raw counts, compares the jump with the region's historical variability and explains why a small base makes big swings likely before deciding whether to dig further.
      good: Notes the small sample and suggests waiting for more data or looking at counts.
      weak: Starts searching for what the region did differently without checking whether the change is meaningful.
    followups:
      - How would you explain random variation to the regional manager?
      - What would convince you the improvement is real?
    common_errors:
      - Ranking regions by rate without considering how many visitors each one has.

  - external_key: problem_solving.analytical_reasoning.analytics_vs_orders_db
    competency_key: data_analysis
    topic: Reconciling two data sources
    difficulty: easy
    text: >-
      Your web analytics tool reports about ten percent fewer purchases than the orders database. How would you
      explain the gap, and which source would you use for which questions?
    expected_concepts:
      - client-side tracking loses events to ad blockers, consent choices and closed tabs
      - the orders database as the source of truth for counts and revenue
      - analytics tool for behavioural and funnel analysis
      - check whether the gap is stable over time and across platforms
      - document the known gap for stakeholders
    rubric:
      excellent: Explains concrete reasons client-side tracking undercounts, checks that the gap is stable by platform and over time, and assigns each source to the questions it answers best.
      good: Names a couple of reasons for the gap and treats the database as the source of truth for totals.
      weak: Assumes one system is broken or averages the two numbers.
    followups:
      - What would it mean if the gap suddenly grew to twenty-five percent?
      - How would you join the two sources for a funnel analysis?
    common_errors:
      - Using the analytics tool's purchase count for financial reporting.

  - external_key: problem_solving.analytical_reasoning.missing_region_rows
    competency_key: data_analysis
    topic: Incomplete data in a daily report
    difficulty: easy
    text: >-
      A daily report shows total sales down twenty percent, and you notice one region has no rows at all for
      yesterday. How would you handle the report and the conversation that follows?
    expected_concepts:
      - treat it as a likely data gap, not a sales drop
      - confirm with the data owner or source system
      - show totals with and without the affected region
      - flag the report as incomplete before people act on it
      - add a completeness check to the report
    rubric:
      excellent: Treats the missing rows as a data issue to confirm, flags the report quickly with a like-for-like view excluding the region, follows up on the root cause and proposes an automatic completeness check.
      good: Spots the data gap and warns the readers that the total is incomplete.
      weak: Reports the drop as real or quietly fills in an estimate without telling anyone.
    followups:
      - Who would you notify, and what would you say?
      - How would you build a check that catches this automatically?
    common_errors:
      - Silently patching the data without telling the people who rely on the report.

  - external_key: problem_solving.analytical_reasoning.city_sales_drop_external
    competency_key: problem_solving
    topic: External factors behind a local drop
    difficulty: easy
    text: >-
      A chain of cafes sees a sharp sales drop across one city for a single week, while other cities are
      normal. What external factors would you consider, and how would you check them?
    expected_concepts:
      - weather events or transport disruption
      - local events, roadworks or closures
      - a new competitor opening or local promotion
      - check whether every store in the city dropped or only some
      - compare against public data or the stores' own notes
    rubric:
      excellent: Lists a range of external causes and ties each to evidence, such as whether all stores dropped together, timing against weather or event records and store manager reports.
      good: Names several plausible external causes and suggests checking which stores were affected.
      weak: Names only one cause or focuses only on internal operations.
    followups:
      - How would you separate an external cause from an internal one such as a supply problem?
      - Would you adjust the targets for that city? How?
    common_errors:
      - Not checking whether the drop is uniform across the stores in the city.

  - external_key: problem_solving.analytical_reasoning.app_feature_downloads_spike
    competency_key: product_sense
    topic: Acquisition spikes that don't move engagement
    difficulty: easy
    text: >-
      Your app was featured in an app store and downloads tripled for a week, but daily active users barely
      moved. How would you explain what happened to someone who expected a big lasting boost?
    expected_concepts:
      - featured-placement installs tend to be low-intent
      - track the install cohort through activation and retention
      - compare the cohort with organic installs
      - onboarding may lose curious visitors quickly
    rubric:
      excellent: Follows the new install cohort through activation and retention, compares it with normal installs and explains the low-intent effect with numbers rather than assertions.
      good: Explains that many new installs never became active and suggests looking at the cohort's retention.
      weak: Assumes the active user metric is wrong or offers no explanation.
    followups:
      - What would you change so the next featuring brings more lasting users?
      - Which number would you report as the real impact of the featuring?
    common_errors:
      - Judging an acquisition spike by installs instead of by retained users.

  - external_key: problem_solving.analytical_reasoning.add_to_cart_exceeds_views
    competency_key: data_analysis
    topic: Impossible numbers in event data
    difficulty: easy
    text: >-
      A product manager notices that add-to-cart events now outnumber product page views, which shouldn't be
      possible. How would you investigate?
    expected_concepts:
      - duplicate firing of the add-to-cart event
      - add-to-cart possible from places other than product pages
      - page views lost to single-page navigation or a tracking change
      - inspect raw events for a few sessions
      - check the timing against recent releases
    rubric:
      excellent: Considers both double-counting and legitimate paths such as adding from listings, inspects raw session events to confirm, and ties the timing to a release or tracking change.
      good: Suspects a tracking error and checks raw events.
      weak: Dismisses the observation or cannot think of how it could happen.
    followups:
      - How would you fix historical reports once you find the cause?
      - Which automated check would have caught this?
    common_errors:
      - Assuming the funnel order on the dashboard matches how users actually move.

  - external_key: problem_solving.analytical_reasoning.refund_alert_first_steps
    competency_key: problem_solving
    topic: Responding to a metric alert
    difficulty: easy
    text: >-
      You get an automated alert that yesterday's refunds were three times their normal level. What would you
      do in the first few steps, and who would you contact?
    expected_concepts:
      - confirm the alert against the source data
      - find whether a few products, merchants or orders drive it
      - check for a known incident, bulk refund or policy change
      - consider fraud or a system bug issuing refunds
      - notify finance, support or operations owners with early findings
    rubric:
      excellent: Validates the alert, quickly localises the spike to products, channels or a batch, considers incidents, fraud and bugs, and contacts the right owners early with what is known so far.
      good: Checks the data, breaks it down and tells someone relevant.
      weak: Waits for more data or investigates alone without involving owners.
    followups:
      - How would your response change if the refunds were still being issued right now?
      - What would you put in your first message to the team?
    common_errors:
      - Investigating in depth before telling anyone, while the cause may still be ongoing.

  - external_key: problem_solving.analytical_reasoning.session_length_doubled
    competency_key: data_analysis
    topic: Extreme values distorting an average
    difficulty: easy
    text: >-
      Average session length in your learning app doubled yesterday. How would you check whether a handful of
      extreme sessions is behind it, and what would you report instead?
    expected_concepts:
      - compare median and percentiles with the mean
      - look for sessions left open or never closed
      - check whether a small set of users or devices dominates
      - trim or cap extreme values with a clear rule
    rubric:
      excellent: Checks the median and distribution, finds whether a few sessions or devices dominate, explains likely causes such as sessions never closing and proposes a robust measure with a clear rule.
      good: Compares the median with the mean and looks for outliers.
      weak: Reports the doubling as a real engagement gain.
    followups:
      - How would you decide whether an extreme session is legitimate?
      - Would you change the headline metric permanently?
    common_errors:
      - Removing outliers by eye without a consistent, documented rule.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.analytical_reasoning.ab_split_mismatch
    competency_key: statistics_experimentation
    topic: Sample ratio mismatch
    difficulty: medium
    text: >-
      An A/B test dashboard shows the treatment group has noticeably more users than control, even though the
      split was set to fifty-fifty. What does that tell you, and what would you do before reading any results?
    expected_concepts:
      - sample ratio mismatch signals a broken assignment or logging
      - test the imbalance against chance
      - check redirects, crashes or bots differing by group
      - check where in the flow users are counted
      - do not trust results until the cause is found
    rubric:
      excellent: Recognises a sample ratio mismatch, tests whether it exceeds chance, investigates assignment, logging and differential drop-off, and refuses to interpret metrics until it is explained.
      good: Knows the imbalance makes results unreliable and checks the assignment logic.
      weak: Reads the results anyway or normalises the groups and moves on.
    followups:
      - The extra users turn out to be from one browser. What would you do?
      - How would you catch this automatically in future tests?
    common_errors:
      - Assuming the effect estimate is fine as long as rates rather than counts are compared.

  - external_key: problem_solving.analytical_reasoning.carousel_launch_attribution
    competency_key: statistics_experimentation
    topic: Attributing a launch without an experiment
    difficulty: medium
    text: >-
      A new recommendations carousel launched to all users on the same day, and a week later engagement is up
      four percent. With no experiment, how would you build a case for or against the carousel causing it?
    expected_concepts:
      - check the pre-launch trend and seasonality
      - compare users who saw or used the carousel with similar users who didn't
      - look for a dose-response relationship
      - look for other changes in the same week
      - propose a holdout group to measure properly going forward
    rubric:
      excellent: Combines trend analysis, exposure comparisons with selection caveats and checks for concurrent changes, and proposes a holdout to settle the question.
      good: Checks the trend before launch and other changes in the same period.
      weak: Credits the carousel with the whole increase or says nothing can be concluded.
    followups:
      - Why is comparing carousel users with non-users risky?
      - How big a holdout would you ask for, and how would you justify it?
    common_errors:
      - Comparing engaged users who clicked the carousel against everyone else.

  - external_key: problem_solving.analytical_reasoning.time_on_site_up_redesign
    competency_key: product_sense
    topic: When a metric going up is bad news
    difficulty: medium
    text: >-
      After a navigation redesign, average time on site rose by a third, and the design team is calling it a
      win. How would you decide whether that's good or bad news?
    expected_concepts:
      - longer time can mean users struggle to find things
      - check task completion and conversion
      - look at search usage, back-navigation and repeated page views
      - align on what the redesign was meant to achieve
      - pair the metric with an outcome measure
    rubric:
      excellent: Explains that time on site is ambiguous, ties the evaluation to the redesign's goal, and checks task success, conversion and struggle signals to decide which interpretation fits.
      good: Notes that longer time could mean confusion and suggests checking conversion.
      weak: Accepts the increase as a success or rejects it without evidence.
    followups:
      - Which metric would you agree with the design team to use next time?
      - How would you collect evidence of struggle beyond the numbers?
    common_errors:
      - Treating engagement time as good for a product whose job is to get users done quickly.

  - external_key: problem_solving.analytical_reasoning.one_month_churn_spike
    competency_key: problem_solving
    topic: Temporary churn spike
    difficulty: medium
    text: >-
      Monthly churn for a subscription product spiked in one month and then returned to normal. How would you
      work out what happened and whether it still matters?
    expected_concepts:
      - separate voluntary cancellations from failed payments
      - check renewal timing, such as an annual cohort renewing that month
      - check price changes, billing errors or expiring promotions
      - look at which plans and cohorts churned
      - estimate lasting revenue impact and win-back options
    rubric:
      excellent: Distinguishes voluntary from involuntary churn, checks renewal cohort timing and billing or price events, localises the spike and sizes the lasting impact with options to recover customers.
      good: Splits churn by type or cohort and finds a likely cause.
      weak: Dismisses the spike because churn returned to normal.
    followups:
      - If it was failed payments, what would you recommend?
      - How would you prevent a renewal wave from surprising you again?
    common_errors:
      - Treating all churn as customers choosing to leave.

  - external_key: problem_solving.analytical_reasoning.demo_target_gaming
    competency_key: problem_solving
    topic: Target gaming
    difficulty: medium
    text: >-
      A sales team was given a target on demos booked. Demos rose sharply, but closed deals stayed flat. How
      would you analyse what's going on, and what would you recommend?
    expected_concepts:
      - check demo quality, such as fit and stage progression
      - compare demo-to-deal conversion before and after the target
      - look for lower-quality leads or splitting one demo into several
      - check whether deals take longer and are still in the pipeline
      - pair the volume target with a quality or outcome measure
    rubric:
      excellent: Measures stage conversion and lead quality before and after, considers pipeline lag, identifies gaming patterns with evidence, and recommends a balanced target tied to outcomes.
      good: Checks conversion from demo to deal and suspects quality has dropped.
      weak: Blames the sales team or concludes demos don't matter without analysis.
    followups:
      - How long would you wait before concluding deals really are flat?
      - How would you design the target differently?
    common_errors:
      - Forgetting that deals take time and a pipeline lag can look like flat results.

  - external_key: problem_solving.analytical_reasoning.currency_reporting_gap
    competency_key: data_analysis
    topic: Currency effects in reporting
    difficulty: medium
    text: >-
      Revenue for your European business shows a nine percent decline in the global report, but the regional
      team says they grew. How would you reconcile those two statements?
    expected_concepts:
      - exchange rate movements between local and reporting currency
      - constant-currency comparison
      - check that both use the same periods, revenue definition and recognition rules
      - present both views with the bridge between them
    rubric:
      excellent: Identifies currency translation as a prime suspect, builds a constant-currency view, checks definitions and periods, and presents a clear bridge between the two numbers.
      good: Suggests exchange rates as the cause and recalculates at constant currency.
      weak: Assumes one team's numbers are wrong without a reconciliation.
    followups:
      - Which view should drive the regional team's targets?
      - What else could cause the gap if currency only explains half of it?
    common_errors:
      - Reconciling totals without checking that both reports use the same revenue definition.

  - external_key: problem_solving.analytical_reasoning.price_increase_verdict
    competency_key: product_sense
    topic: Judging a price increase
    difficulty: medium
    text: >-
      Three weeks ago you raised prices by ten percent. Revenue is up four percent, while order volume is down.
      How would you tell leadership whether the price increase was a good decision?
    expected_concepts:
      - estimate price elasticity from the volume response
      - three weeks may not show effects on retention or repeat purchase
      - segment which customers reduced purchases
      - consider margin, not just revenue
      - compare with pre-increase trends and seasonality
    rubric:
      excellent: Separates the price and volume effects, checks segments and margin, explains that longer-term retention effects are still unknown and proposes what to monitor before a final verdict.
      good: Weighs revenue against lost volume and notes that it is early.
      weak: Declares success because revenue went up.
    followups:
      - What early signals would warn you about long-term damage?
      - How would you design a future price change to measure it better?
    common_errors:
      - Calling the result final before repeat purchase behaviour has had time to show.

  - external_key: problem_solving.analytical_reasoning.normal_variation_baseline
    competency_key: statistics_experimentation
    topic: Establishing normal variation
    difficulty: medium
    text: >-
      Leadership asks whether this week's dip in app engagement is normal variation or a real problem. How would
      you establish what normal variation looks like for this metric?
    expected_concepts:
      - use history to measure typical week-to-week changes
      - remove known seasonality and trend first
      - control limits or prediction intervals
      - account for known events and outliers in the history
      - express the dip relative to the normal range
    rubric:
      excellent: Builds a baseline from history after removing trend and seasonality, defines a normal range such as control limits or prediction intervals, and states where this week falls with appropriate caveats.
      good: Compares this week's change with typical historical changes.
      weak: Gives an opinion based on the size of the dip alone.
    followups:
      - How would you handle a metric that has a strong upward trend?
      - What would you say if the dip is just inside the normal range for three weeks running?
    common_errors:
      - Using a historical range distorted by holiday weeks or past incidents.

  - external_key: problem_solving.analytical_reasoning.zero_result_searches_doubled
    competency_key: problem_solving
    topic: Separating product, content and measurement causes
    difficulty: medium
    text: >-
      The share of searches returning no results doubled last month. How would you work out whether that's a
      product problem, a content problem or a measurement problem?
    expected_concepts:
      - check whether the logging or definition of no results changed
      - inspect the top failing queries
      - check catalogue changes such as removed items or out-of-stock filtering
      - check search engine or ranking releases
      - look for new kinds of queries such as a new market or language
    rubric:
      excellent: Designs checks that separate the three explanations, starting with measurement, then inspects the failing queries and ties them to catalogue, release or demand changes.
      good: Looks at the failing queries and checks for a release or catalogue change.
      weak: Proposes improving search in general without diagnosing the cause.
    followups:
      - The top failing queries are mostly misspellings. What does that suggest?
      - How would you measure the business impact of these failed searches?
    common_errors:
      - Not reading a sample of the actual failing queries.

  - external_key: problem_solving.analytical_reasoning.support_contacts_after_update
    competency_key: problem_solving
    topic: Sizing a launch's effect on support load
    difficulty: medium
    text: >-
      After a big app update, support contacts went up thirty percent. How would you figure out how much of that
      the update caused, and what to fix first?
    expected_concepts:
      - categorise contacts by reason and compare with before
      - compare users on the new version with those on the old one
      - account for user growth or seasonal patterns
      - rank issues by volume and severity
      - feed findings back to the product team with examples
    rubric:
      excellent: Uses contact reasons and version comparisons to attribute the increase, adjusts for growth and seasonality, and ranks fixes by volume and impact with clear examples for the product team.
      good: Categorises the contacts and identifies the biggest new issue.
      weak: Assumes every extra contact is caused by the update.
    followups:
      - Contact reasons are free text. How would you categorise them quickly?
      - How would you know the fix actually reduced contacts?
    common_errors:
      - Not normalising the contact count by the number of active users.

  - external_key: problem_solving.analytical_reasoning.retention_curves_cross
    competency_key: data_analysis
    topic: Crossing cohort retention curves
    difficulty: medium
    text: >-
      When you compare retention curves, this year's cohorts start lower in week one than last year's, but end up
      higher by week twelve. How would you interpret that, and what would you dig into?
    expected_concepts:
      - a change in who signs up or how activity is counted early on
      - weaker early activation but stronger long-term engagement
      - check acquisition mix, onboarding changes and product changes
      - compare absolute retained users, not just rates
      - decide which part of the curve matters for the business
    rubric:
      excellent: Proposes concrete explanations such as acquisition mix or onboarding changes, tests them by segmenting cohorts, looks at absolute retained users and connects the interpretation to business value.
      good: Offers a plausible explanation and suggests segmenting the cohorts.
      weak: Picks one end of the curve to judge the change and ignores the other.
    followups:
      - How would you tell if the early drop is a measurement artefact?
      - Which number would you report to leadership?
    common_errors:
      - Comparing rates while ignoring that cohort sizes changed a lot.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.analytical_reasoning.executive_disagrees_root_cause
    competency_key: communication
    topic: Presenting findings that contradict a senior view
    difficulty: hard
    text: >-
      Your analysis of a revenue decline points to one cause, but a senior executive is convinced it's something
      else and has already shared that view with the board. How would you approach presenting your findings?
    expected_concepts:
      - test the executive's hypothesis seriously and show the evidence for it
      - present findings privately before any wider forum
      - quantify both explanations side by side
      - be clear about uncertainty and what would change the conclusion
      - propose a next step that resolves the disagreement with data
    rubric:
      excellent: Tests the executive's view rigorously, presents both explanations with quantified evidence in a private conversation first, is clear about uncertainty, and offers a concrete way to settle the question.
      good: Prepares solid evidence and raises it with the executive before a wider audience.
      weak: Either drops the findings to avoid conflict or presents them in a way that ignores the executive's hypothesis.
    followups:
      - What if the executive asks you to leave your analysis out of the report?
      - How would you handle it if both causes turned out to contribute?
    common_errors:
      - Presenting the analysis as a rebuttal rather than a comparison of evidence.

  - external_key: problem_solving.analytical_reasoning.marketplace_test_interference
    competency_key: statistics_experimentation
    topic: Interference in marketplace experiments
    difficulty: hard
    text: >-
      Your marketplace ran an A/B test where treatment users got a discount, and their bookings rose twelve
      percent. How much of that would you expect to hold if you rolled it out to everyone, and how would you
      get a better estimate?
    expected_concepts:
      - treatment users take limited supply from control users
      - the control group is harmed, inflating the measured difference
      - market-level or geographic randomisation
      - switchback designs over time periods
      - check supply utilisation and control group trends during the test
    rubric:
      excellent: Explains how shared supply makes treatment and control interfere, checks for evidence such as control decline, and proposes cluster, geographic or switchback designs with their trade-offs.
      good: Recognises that the groups compete for the same supply and suggests a market-level test.
      weak: Takes the twelve percent at face value.
    followups:
      - What are the downsides of a geographic test?
      - How would you know whether supply was actually constrained?
    common_errors:
      - Assuming users in an experiment are independent when they share inventory.

  - external_key: problem_solving.analytical_reasoning.pipeline_migration_kpi_drop
    competency_key: data_analysis
    topic: Real change versus migration artefact
    difficulty: hard
    text: >-
      Weekly active teams on your B2B tool dropped seven percent, but usage per team is up and revenue is
      unchanged. The data platform also migrated its event pipeline that week. How would you separate a real
      change from a migration artefact?
    expected_concepts:
      - run old and new pipelines in parallel or compare overlapping days
      - reconcile team counts against an independent source such as billing or login records
      - check identity mapping and deduplication rules in the new pipeline
      - look at which teams disappeared and whether they still show activity elsewhere
      - restate history or mark a break in series once understood
    rubric:
      excellent: Reconciles the metric against independent sources, compares pipelines on overlapping data, investigates which teams vanished and why, and decides how to restate history or annotate the break.
      good: Suspects the migration and compares old and new outputs.
      weak: Treats the drop as real or blames the migration without verifying.
    followups:
      - The missing teams all use single sign-on. What does that suggest?
      - How would you communicate a restatement of a published KPI?
    common_errors:
      - Not using an independent system of record to check the new pipeline.

  - external_key: problem_solving.analytical_reasoning.young_product_decline
    competency_key: problem_solving
    topic: Reading trends without a prior year
    difficulty: hard
    text: >-
      A product launched eight months ago, and usage has fallen for three straight months. You have no prior
      year to compare against. How would you decide whether it's genuinely in decline?
    expected_concepts:
      - separate launch novelty from steady state using cohort curves
      - use seasonality from related products or the wider business
      - distinguish fewer new users from lower retention of existing users
      - look at engagement depth among retained users
      - use external benchmarks where available
    rubric:
      excellent: Decomposes usage into acquisition and retention by cohort, uses related products or external data to estimate seasonality, and judges whether cohort curves have stabilised before calling it a decline.
      good: Uses cohorts to separate new users from returning users and considers seasonality.
      weak: Concludes decline from the top-line trend alone.
    followups:
      - What would a healthy flattening look like in the data compared with real decline?
      - What would you recommend if the newest cohorts retain worse than the first ones?
    common_errors:
      - Reading the end of launch excitement as a product failure.

  - external_key: problem_solving.analytical_reasoning.flat_test_hidden_segments
    competency_key: statistics_experimentation
    topic: Segment effects in a flat experiment
    difficulty: hard
    text: >-
      An experiment shows no overall change in conversion, but the product manager believes it helped new users
      and hurt returning ones. How would you investigate that without fishing for a result?
    expected_concepts:
      - pre-register or agree the segment hypothesis before looking
      - check that the segment split was defined before treatment
      - test the interaction rather than each segment separately
      - account for multiple comparisons and reduced power
      - confirm with a follow-up test targeted at the segment
    rubric:
      excellent: Agrees the hypothesis up front, tests the interaction with appropriate corrections and power awareness, and proposes a confirmatory follow-up rather than shipping on an exploratory finding.
      good: Looks at the segments while acknowledging the risk of false positives.
      weak: Slices the data many ways until something looks significant, or refuses to look at all.
    followups:
      - The effect holds for new users. Would you ship only to them?
      - How would you explain the multiple comparisons risk to the product manager?
    common_errors:
      - Defining segments using behaviour that the treatment itself could have changed.

  - external_key: problem_solving.analytical_reasoning.slow_organic_decline
    competency_key: problem_solving
    topic: Investigating a slow gradual decline
    difficulty: hard
    text: >-
      Organic search traffic has slipped about two percent a month for half a year, with no single obvious event.
      How would you investigate a slow decline like that differently from a sudden drop?
    expected_concepts:
      - break down by page type, query group and landing page
      - compare against market demand and seasonality
      - check ranking positions and click-through changes on results pages
      - look for gradual causes such as content ageing, competitors or site speed
      - set up tracking to measure the trend going forward
    rubric:
      excellent: Explains why slow declines need decomposition rather than event hunting, separates demand, ranking and click-through effects, segments by page and query type and identifies where the decline concentrates.
      good: Segments the traffic and considers market demand and competitors.
      weak: Searches for a single event or treats the decline as noise.
    followups:
      - How would you tell a change in market demand from a loss of ranking?
      - What would you recommend while the investigation continues?
    common_errors:
      - Looking for a single breaking change when the cause is many small ones.
