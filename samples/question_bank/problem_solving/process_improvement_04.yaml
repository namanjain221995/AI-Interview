# Curated questions: problem solving, process improvement (part 4 of 4).
# Learning a process before changing it, review and priority flow, environments, ownership at scale.
version: 1
defaults:
  role_tags: [project_manager, engineering_manager, qa, devops]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ---------------------------------------------------------------- easy
  - external_key: problem_solving.process_improvement.learn_flow_before_changing
    competency_key: project_management
    topic: Understanding a process before changing it
    difficulty: easy
    text: >-
      You've just joined a team partway through a project. How would you learn how work actually flows before
      suggesting any changes?
    expected_concepts:
      - one-to-one conversations with people in each role
      - observe the real ceremonies, board and tools
      - follow a few recent items from request to release
      - compare the documented process with what really happens
      - ask what people would change and what they'd keep
    rubric:
      excellent: Combines conversations across roles with direct observation and tracing a few real items end to end, notices gaps between the documented and actual process, and holds back changes until the picture is clear.
      good: Talks to the team and observes meetings before suggesting changes.
      weak: Starts applying the process from a previous job in the first week.
    followups:
      - How long would you wait before proposing your first change?
      - What would make you act sooner than that?
    common_errors:
      - Mistaking the documented process for the real one.

  - external_key: problem_solving.process_improvement.too_many_ticket_statuses
    competency_key: agile_delivery
    topic: Overcomplicated ticket workflow
    difficulty: easy
    text: >-
      Your team's ticket workflow has fourteen statuses, and people keep putting items in the wrong one. How
      would you simplify it?
    expected_concepts:
      - find which statuses are used and which drive any decision or report
      - map statuses to real stages of work, including waiting states
      - merge or remove the rest
      - agree clear entry and exit rules for each status
      - check reports and automations that depend on the old statuses
    rubric:
      excellent: Uses actual usage data to see which statuses matter, rebuilds the workflow around real stages with clear entry and exit rules, and checks dependent reports and automations before switching.
      good: Reduces the statuses with the team's input.
      weak: Adds documentation explaining the fourteen statuses.
    followups:
      - Why might it be useful to keep a separate waiting status?
      - Who would you involve before removing a status someone's report depends on?
    common_errors:
      - Breaking dashboards and automations that rely on the old statuses.

  - external_key: problem_solving.process_improvement.morning_failure_triage
    competency_key: test_automation
    topic: Slow triage of overnight test failures
    difficulty: easy
    text: >-
      Every morning someone spends an hour going through overnight test failures to decide which are real bugs.
      How would you make that triage faster?
    expected_concepts:
      - group failures by cause or error signature
      - automatically flag known flaky or environment failures
      - clear failure messages, logs and screenshots attached to results
      - link failures to the changes that introduced them
      - fix the recurring causes so fewer failures need triage
    rubric:
      excellent: Clusters failures by signature, separates known flaky and environment issues automatically, improves failure diagnostics and links failures to changes, while reducing the recurring causes.
      good: Improves reporting so failures are easier to read.
      weak: Rotates the triage duty among team members.
    followups:
      - How would you tell an environment failure from a product bug automatically?
      - What information should every failure report include?
    common_errors:
      - Speeding up triage without reducing the number of failures that need it.

  - external_key: problem_solving.process_improvement.weekly_deploy_window
    competency_key: ci_cd
    topic: Single weekly deployment window
    difficulty: easy
    text: >-
      Your team only deploys on Thursday evenings, so changes wait up to a week and each deploy carries a lot
      of them. How would you approach changing that?
    expected_concepts:
      - understand why the window exists
      - automate the steps that make deploys risky or labour-intensive
      - deploy smaller batches more often, in working hours
      - monitoring and quick rollback to reduce risk
      - start with one low-risk service
    rubric:
      excellent: Finds the reasons behind the window, removes them with automation, monitoring and rollback, and moves to smaller daytime deploys starting with a low-risk service.
      good: Proposes more frequent deploys with automation.
      weak: Moves the window to a different day.
    followups:
      - Why are daytime deploys often safer than evening ones?
      - What would you need in place before deploying daily?
    common_errors:
      - Increasing frequency without automated checks or rollback.

  - external_key: problem_solving.process_improvement.departing_engineer_transfer
    competency_key: people_management
    topic: Knowledge transfer before someone leaves
    difficulty: easy
    text: >-
      An experienced engineer is leaving the team in two weeks, and they hold a lot of undocumented knowledge.
      How would you run that knowledge transfer?
    expected_concepts:
      - list the systems, tasks and relationships they own
      - prioritise by risk and frequency
      - successors do the work with the leaving engineer reviewing
      - record key decisions, gotchas and contacts
      - a short check-in after they leave if possible
    rubric:
      excellent: Inventories what the engineer owns, prioritises by risk, has named successors do real tasks with guidance, captures decisions and pitfalls and plans how open questions will be answered afterwards.
      good: Schedules handover sessions and documentation.
      weak: Asks the engineer to write everything down in their last week.
    followups:
      - How would you decide who takes over each area?
      - What would you change so the team is less exposed next time?
    common_errors:
      - Relying on recorded walkthroughs that nobody watches.

  - external_key: problem_solving.process_improvement.inconsistent_support_answers
    competency_key: technical_support
    topic: Inconsistent answers from support
    difficulty: easy
    text: >-
      Customers notice that support gives different answers to the same question depending on who replies. How
      would you bring consistency to those answers?
    expected_concepts:
      - find the questions with inconsistent answers
      - an agreed source of truth for each, in the knowledge base
      - prepared response templates that agents adapt
      - review a sample of replies regularly
      - a way for agents to flag outdated answers
    rubric:
      excellent: Identifies where answers diverge, agrees a single source of truth with templates agents adapt, reviews samples of replies and gives agents a way to flag outdated content.
      good: Creates shared answer templates.
      weak: Asks agents to check with each other before replying.
    followups:
      - How would you handle questions where the right answer depends on the customer's plan or setup?
      - Who would own keeping the answers correct?
    common_errors:
      - Writing rigid scripts that agents can't adapt to the customer's situation.

  - external_key: problem_solving.process_improvement.qa_to_release_config_gap
    competency_key: ci_cd
    topic: Informal handoff from QA to release
    difficulty: easy
    text: >-
      Builds that QA has approved sometimes reach production with the wrong configuration, because the handoff
      to whoever runs the release is informal. How would you tighten that handoff?
    expected_concepts:
      - promote the exact tested artefact instead of rebuilding
      - keep configuration in version control per environment
      - the pipeline carries the approval with the artefact
      - automated checks that compare configuration before release
      - remove manual edits during release
    rubric:
      excellent: Ensures the exact tested artefact is promoted, manages environment configuration in version control, ties approval to the artefact in the pipeline and adds automated configuration checks, removing manual steps.
      good: Introduces a handoff checklist or version-controlled configuration.
      weak: Asks QA and release staff to double-check with each other by message.
    followups:
      - Why does rebuilding after testing create risk?
      - How would you handle secrets that differ between environments?
    common_errors:
      - Rebuilding the artefact for production after it was tested.

  # -------------------------------------------------------------- medium
  - external_key: problem_solving.process_improvement.oversized_pull_requests
    competency_key: code_quality
    topic: Huge pull requests and shallow reviews
    difficulty: medium
    text: >-
      Pull requests on your team are often a thousand lines or more, so reviews are slow and shallow. How would
      you change the way work gets broken down and reviewed?
    expected_concepts:
      - split work into small, independently reviewable changes
      - feature flags so incomplete work can merge safely
      - stacked or sequential pull requests
      - agreed size guideline with the team
      - early design discussion so reviews focus on details
    rubric:
      excellent: Changes how work is sliced using flags and stacked changes so each pull request is small and reviewable, agrees size guidelines and moves design discussion earlier so review focuses on correctness.
      good: Sets a size guideline and encourages smaller pull requests.
      weak: Adds more reviewers to large pull requests.
    followups:
      - How would you merge part of a feature without exposing it to users?
      - When is a large pull request unavoidable, and how would you review it?
    common_errors:
      - Setting a size limit without showing the team how to slice work smaller.

  - external_key: problem_solving.process_improvement.stakeholders_bypass_priorities
    competency_key: stakeholder_management
    topic: Stakeholders escalating straight to engineers
    difficulty: medium
    text: >-
      Priorities on your team change every few days because different stakeholders go straight to engineers
      with urgent requests. How would you create a more stable process for deciding what the team works on?
    expected_concepts:
      - one owner of priorities and one entry point
      - visible backlog and prioritisation criteria
      - a regular forum where stakeholders negotiate trade-offs
      - an agreed path for genuine emergencies
      - coach engineers to redirect requests politely
    rubric:
      excellent: Establishes one entry point and priority owner, makes the backlog and criteria visible, gives stakeholders a regular forum to negotiate, defines a real emergency path and supports engineers in redirecting requests.
      good: Routes requests through one person and publishes priorities.
      weak: Tells stakeholders to stop contacting engineers without offering an alternative.
    followups:
      - What would you do when a senior executive bypasses the process?
      - How would you define a genuine emergency?
    common_errors:
      - Blocking stakeholders without giving them visibility into when their work will happen.

  - external_key: problem_solving.process_improvement.environment_caused_failures
    competency_key: test_automation
    topic: Test failures caused by the environment
    difficulty: medium
    text: >-
      About a third of failed test runs turn out to be caused by the test environment rather than the product.
      How would you go about reducing that?
    expected_concepts:
      - categorise environment failures by cause
      - environments created from code and reset between runs
      - stubs or fakes for unstable third-party dependencies
      - health checks before tests start
      - ownership of environment reliability
    rubric:
      excellent: Categorises the environment failures, makes environments reproducible from code, isolates unstable dependencies with stubs, checks readiness before running tests and gives environment reliability a clear owner.
      good: Improves environment stability and adds pre-test checks.
      weak: Adds retries to all tests.
    followups:
      - When would you stub a dependency and when would you test against the real one?
      - How would you prove the environment is now reliable?
    common_errors:
      - Hiding environment problems with retries instead of fixing them.

  - external_key: problem_solving.process_improvement.incident_update_interruptions
    competency_key: incident_response
    topic: Responders interrupted for incident updates
    difficulty: medium
    text: >-
      During outages, support and account managers keep interrupting the engineers fixing the problem to ask
      for updates. How would you set up incident communication so that stops?
    expected_concepts:
      - a dedicated communications role during incidents
      - regular updates on a fixed schedule
      - one channel or status page stakeholders can follow
      - templates for internal and customer-facing updates
      - separate the responders' working channel from stakeholder updates
    rubric:
      excellent: Assigns a communications role, publishes updates on a predictable schedule through one channel, uses templates and separates responders' working space from stakeholder communication.
      good: Introduces a status channel and regular updates.
      weak: Asks stakeholders not to contact engineers during incidents.
    followups:
      - What should a good internal incident update contain?
      - Who would take the communications role on a small team?
    common_errors:
      - Leaving updates to the engineers doing the fixing.

  - external_key: problem_solving.process_improvement.introduce_refinement
    competency_key: agile_delivery
    topic: Introducing backlog refinement
    difficulty: medium
    text: >-
      Your team has no regular refinement, so sprint planning is the first time anyone looks closely at the
      work. How would you introduce refinement in a way the team finds worthwhile?
    expected_concepts:
      - explain the problem it solves using recent examples
      - short, regular sessions focused on upcoming work
      - product owner prepares items in advance
      - clear outcome such as ready stories with acceptance criteria
      - review after a few sprints whether planning got easier
    rubric:
      excellent: Ties refinement to problems the team has felt, keeps sessions short and focused on near-term work with prepared items and a clear definition of ready, and checks a few sprints later whether planning improved.
      good: Schedules regular refinement sessions with clear goals.
      weak: Adds a long weekly meeting to review the whole backlog.
    followups:
      - How far ahead should a team refine?
      - What would you do if engineers see refinement as yet another meeting?
    common_errors:
      - Refining the entire backlog instead of the next few weeks of work.

  - external_key: problem_solving.process_improvement.ops_team_forced_sprints
    competency_key: agile_delivery
    topic: Sprints for an operations-heavy team
    difficulty: medium
    text: >-
      A team that handles lots of unpredictable operational work is required to run two-week sprints, and it
      misses every commitment. How would you rethink the way that team plans and tracks its work?
    expected_concepts:
      - measure how much work is planned versus unplanned
      - consider flow-based planning for the operational stream
      - reserve explicit capacity for interrupts
      - a rotating interrupt handler to protect others
      - service-level expectations instead of sprint commitments for operational requests
    rubric:
      excellent: Quantifies the unplanned share, then fits the method to the work with flow-based tracking or reserved capacity, a rotating interrupt role and service-level expectations, explaining the change to stakeholders.
      good: Suggests reserving capacity for unplanned work.
      weak: Keeps the sprints and pushes the team to commit to less.
    followups:
      - How would you report progress to stakeholders without sprint commitments?
      - What would you do if the interrupt rate keeps growing?
    common_errors:
      - Forcing a planning method that doesn't match the nature of the work.

  - external_key: problem_solving.process_improvement.environment_tickets_week
    competency_key: ci_cd
    topic: Week-long waits for provisioned infrastructure
    difficulty: medium
    text: >-
      Product teams wait about a week for your DevOps team to provision new environments or databases through
      tickets. How would you reduce that wait?
    expected_concepts:
      - analyse the most common requests
      - templates or modules for standard infrastructure
      - self-service through a pipeline or portal with guardrails
      - policy checks and cost limits built in
      - keep the ticket path for unusual requests
    rubric:
      excellent: Finds the common request types, packages them as reviewed templates exposed through self-service with built-in guardrails for security and cost, and keeps a human path for unusual needs.
      good: Proposes infrastructure as code templates and some self-service.
      weak: Proposes adding people to the DevOps team to process tickets faster.
    followups:
      - What guardrails would you put on self-service infrastructure?
      - How would you handle cleanup of environments people forget about?
    common_errors:
      - Offering self-service without guardrails on cost and security.

  - external_key: problem_solving.process_improvement.tests_written_months_later
    competency_key: test_automation
    topic: Automated tests lagging behind features
    difficulty: medium
    text: >-
      Your automated tests are written by a separate team months after features ship, so coverage always lags
      behind. How would you change who writes tests and when?
    expected_concepts:
      - tests written as part of the same story
      - include tests in the definition of done
      - developers own unit and API tests
      - automation specialists build frameworks and coach
      - track coverage of new features at release
    rubric:
      excellent: Moves test writing into the story itself, makes it part of done, has developers own lower-level tests and repositions automation specialists as framework builders and coaches, measuring coverage at release.
      good: Has developers write tests alongside features.
      weak: Grows the separate automation team to catch up faster.
    followups:
      - How would you handle the existing backlog of untested features?
      - What changes for the automation engineers in this model?
    common_errors:
      - Treating the backlog as the main problem rather than when tests are written.

  - external_key: problem_solving.process_improvement.after_hours_urgent_issues
    competency_key: technical_support
    topic: Urgent issues waiting overnight
    difficulty: medium
    text: >-
      Urgent customer issues that arrive outside business hours currently wait until the next morning unless
      someone happens to notice. How would you set up an after-hours escalation process that's sustainable for
      the team?
    expected_concepts:
      - define what counts as urgent enough to page
      - automatic paging based on severity
      - a fair, compensated on-call rota
      - runbooks so the on-call person can act alone
      - review after-hours pages to reduce them
    rubric:
      excellent: Defines strict criteria for after-hours paging, automates the alerting, sets up a fair rota with runbooks and reviews pages regularly to keep the load sustainable.
      good: Sets up an on-call rota for urgent tickets.
      weak: Asks a few people to check their email in the evening.
    followups:
      - How would you stop the definition of urgent from slowly expanding?
      - What would you do if one customer pages far more than others?
    common_errors:
      - Paging for everything, which quickly wears down the rota.

  - external_key: problem_solving.process_improvement.release_process_in_heads
    competency_key: process_modeling
    topic: Undocumented release process
    difficulty: medium
    text: >-
      Your release process exists only in the heads of a few people, and each of them does it slightly
      differently. How would you go about capturing and standardising it?
    expected_concepts:
      - observe or walk through several real releases
      - map the steps and note where people differ
      - understand why each variation exists
      - agree one standard version with the people involved
      - automate the agreed steps where possible
    rubric:
      excellent: Captures the process by observing real releases, maps the variations and the reasons behind them, agrees a standard with the practitioners and then automates it so it stays consistent.
      good: Documents the steps and agrees a standard version.
      weak: Picks one person's version and documents it without discussion.
    followups:
      - What would you do if two variations are each right in different situations?
      - How would you keep the documented process from drifting again?
    common_errors:
      - Documenting the process without understanding why people deviate.

  - external_key: problem_solving.process_improvement.empty_sprint_reviews
    competency_key: stakeholder_management
    topic: Stakeholders skipping sprint reviews
    difficulty: medium
    text: >-
      Stakeholders have stopped attending your sprint reviews, and they're often surprised by what ships. How
      would you fix that feedback loop?
    expected_concepts:
      - ask stakeholders why they stopped coming
      - show working software focused on outcomes, not task lists
      - invite the right people for the topics being shown
      - make reviews shorter and decision-oriented
      - use asynchronous demos for those who can't attend
    rubric:
      excellent: Asks stakeholders what's not working, redesigns reviews to show outcomes and ask for decisions, targets the right audience and offers async options, so feedback arrives before things ship.
      good: Makes the review more relevant and invites key stakeholders directly.
      weak: Sends more reminders or makes attendance mandatory.
    followups:
      - What would you show in a review when the work isn't visible to users?
      - How would you collect feedback from people who watch a recording?
    common_errors:
      - Presenting a list of completed tickets instead of working results.

  # ---------------------------------------------------------------- hard
  - external_key: problem_solving.process_improvement.ci_cost_and_speed
    competency_key: ci_cd
    topic: Rising CI cost in a shared repository
    difficulty: hard
    text: >-
      Your CI spend has tripled in a year and builds are still slow, because every change runs every test
      across a large shared repository. How would you rethink the pipeline?
    expected_concepts:
      - dependency graph to run only affected builds and tests
      - remote caching of build outputs
      - tiered pipelines with full runs on merge or schedule
      - right-sized and autoscaled build machines
      - cost and duration measured per team or project
      - safeguards so selective testing doesn't miss breakage
    rubric:
      excellent: Uses the dependency graph to build and test only what changed, adds caching, tiers the pipeline, right-sizes compute and makes cost visible per team, while keeping safety nets for things selective testing can miss.
      good: Introduces caching and affected-only testing.
      weak: Cuts the number of tests or moves to cheaper machines without addressing the design.
    followups:
      - How would you know if selective testing is letting bugs through?
      - How would you get teams to care about the CI cost they generate?
    common_errors:
      - Trusting change-based test selection without periodic full runs.

  - external_key: problem_solving.process_improvement.single_quality_number
    competency_key: test_automation
    topic: Designing quality measures that help
    difficulty: hard
    text: >-
      Leadership wants a single quality number for every team, and teams are already arguing about what it
      should measure. How would you design a way of tracking quality that actually drives improvement?
    expected_concepts:
      - clarify what decisions leadership wants to make with the number
      - a small balanced set such as escaped defects, change failure rate and time to restore
      - customer-facing measures alongside internal ones
      - use trends within a team rather than rankings across teams
      - review regularly and watch for gaming
    rubric:
      excellent: Starts from the decisions leadership needs to make, proposes a small balanced set of internal and customer-facing measures, uses them for trends and learning rather than ranking, and guards against gaming.
      good: Proposes several quality measures instead of one.
      weak: Picks one measure such as test coverage and applies it to everyone.
    followups:
      - Why can comparing teams on these numbers backfire?
      - How would you present this to leadership if they still want one number?
    common_errors:
      - Using test coverage alone as the measure of quality.

  - external_key: problem_solving.process_improvement.misplaced_oncall_load
    competency_key: incident_response
    topic: On-call load landing on the wrong teams
    difficulty: hard
    text: >-
      On-call load in your organisation falls mostly on two teams, because when other teams' services fail it's
      their alerts that fire. How would you change ownership and escalation so the load lands where the problems
      are?
    expected_concepts:
      - analyse pages by root-cause owner
      - service ownership clearly mapped
      - alerts routed to the owning team
      - dependency health signals so downstream teams can see upstream failures
      - service-level objectives between teams
      - review of the data with leadership to rebalance
    rubric:
      excellent: Uses page data to show where root causes lie, maps ownership, routes alerts to owners, adds dependency signals and inter-team service-level objectives, and gets leadership agreement to rebalance.
      good: Routes alerts to the owning teams and clarifies ownership.
      weak: Adds people to the overloaded teams' rotas.
    followups:
      - How would you handle a shared component that nobody wants to own?
      - What should a downstream team's alert say when an upstream service fails?
    common_errors:
      - Solving it with more on-call staff instead of fixing ownership.

  - external_key: problem_solving.process_improvement.rotation_vs_dedicated_escalation
    competency_key: technical_support
    topic: Support rotation versus a dedicated escalation team
    difficulty: hard
    text: >-
      You're asked to decide whether engineering should run a rotating support duty or keep a dedicated
      escalation team. How would you evaluate the options and roll out your choice?
    expected_concepts:
      - current escalation volume, complexity and resolution time
      - trade-off between product knowledge and focus
      - effect on feedback loops from customers to engineers
      - impact on delivery capacity and on the people involved
      - pilot and measure before committing
      - hybrid options
    rubric:
      excellent: Evaluates both options against data on escalation volume and complexity, weighs knowledge, focus, feedback to product and the people involved, considers a hybrid and rolls out through a measured pilot.
      good: Compares the pros and cons of each and picks one with reasons.
      weak: Picks one based on preference without evaluation.
    followups:
      - What would you measure during the pilot?
      - How would you keep a dedicated team from becoming isolated from the product teams?
    common_errors:
      - Ignoring how each model affects whether product teams learn from customer problems.

  - external_key: problem_solving.process_improvement.acquired_team_release_process
    competency_key: project_management
    topic: Aligning an acquired team's release process
    difficulty: hard
    text: >-
      Your company has acquired a startup whose team ships daily with almost no formal process, and you're asked
      to bring them onto the parent company's much heavier release process. How would you approach it?
    expected_concepts:
      - understand which parent controls are mandatory and why
      - learn what makes the startup's approach work
      - meet the required controls through automation rather than manual steps
      - consider improving the parent process using what the startup does well
      - phased integration with clear milestones
    rubric:
      excellent: Separates mandatory controls from habit, meets the mandatory ones with automation that keeps the startup fast, uses the startup's practices to improve the parent process and phases the integration.
      good: Plans a phased transition that keeps some of the startup's speed.
      weak: Moves the team onto the heavier process unchanged on day one.
    followups:
      - How would you avoid losing the startup's best people during the change?
      - Which controls would you treat as non-negotiable?
    common_errors:
      - Assuming the heavier process is the better one by default.

  - external_key: problem_solving.process_improvement.twenty_complaints_one_quarter
    competency_key: problem_solving
    topic: Choosing which process problems to tackle
    difficulty: hard
    text: >-
      After a round of interviews, you have twenty process complaints from engineering, QA and support, one
      quarter to act and no extra people. How would you decide which few to tackle first?
    expected_concepts:
      - group complaints that share a root cause
      - estimate impact using data where possible
      - estimate effort and risk of each fix
      - favour fixes that unblock several problems
      - share the chosen list and reasons with everyone who raised issues
    rubric:
      excellent: Groups complaints into root causes, estimates impact and effort with data where possible, picks a small set that addresses the biggest shared causes and explains the choices back to everyone involved.
      good: Ranks issues by impact and effort.
      weak: Tackles the loudest complaints or tries to address all twenty.
    followups:
      - How would you handle a complaint that's important to one group but low-impact overall?
      - What would you tell people whose issues weren't chosen?
    common_errors:
      - Treating each complaint separately and missing shared root causes.

  - external_key: problem_solving.process_improvement.fixed_problem_returns
    competency_key: problem_solving
    topic: Process fix that didn't stick
    difficulty: hard
    text: >-
      A process change you led went smoothly, but a few months later the problem it was meant to solve is
      back. How would you investigate why, and what would you do differently?
    expected_concepts:
      - check whether the change is still being followed
      - check whether the original root cause was correctly identified
      - look for changes in context such as team growth or new tools
      - involve the people doing the work in the diagnosis
      - build in measurement and ownership to sustain the change
    rubric:
      excellent: Distinguishes between the change decaying, the diagnosis being wrong and the context changing, investigates with the people involved and builds ongoing measurement and ownership into the next attempt.
      good: Checks whether the process is still followed and reinforces it.
      weak: Reintroduces the same change more forcefully.
    followups:
      - What signals would have warned you earlier that the problem was coming back?
      - How do you make a process change stick after the person who led it moves on?
    common_errors:
      - Assuming people simply stopped following the process without checking the diagnosis.
