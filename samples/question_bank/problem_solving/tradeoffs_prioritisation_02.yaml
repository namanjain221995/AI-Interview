# Curated questions: problem solving — trade-offs and prioritisation under constraints (time, risk,
# quality, cost). Scenario questions spoken by the AI interviewer; evaluation is based only on the
# reasoning and the content of the answer.
version: 1
defaults:
  role_tags: [general, tech_lead, product_manager, project_manager]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.tradeoffs_prioritisation.date_for_unfamiliar_task
    competency_key: project_management
    topic: Committing to a date for unfamiliar work
    difficulty: easy
    text: >-
      A stakeholder asks you for a delivery date on a piece of work your team has never done before. How would you
      decide what date to give them?
    expected_concepts:
      - breaking the work into known and unknown parts
      - a short investigation to reduce uncertainty
      - giving a range or a date with a stated confidence
      - buffer for the unknowns
      - checkpoints where the estimate will be updated
    rubric:
      excellent: Breaks the work down, proposes a quick spike on the biggest unknowns, gives a range or confidence-qualified date with a buffer, and agrees when the estimate will be refined.
      good: Gives a reasoned estimate with some allowance for uncertainty.
      weak: Gives an optimistic single date with no reasoning, or refuses to estimate at all.
    followups:
      - The stakeholder insists on a single date. What do you say?
      - How would you decide how much buffer to add?
    common_errors:
      - Committing to the best-case date.
      - Never revisiting the estimate as more is learned.

  - external_key: problem_solving.tradeoffs_prioritisation.too_many_meetings
    competency_key: problem_solving
    topic: Deciding which meetings to keep
    difficulty: easy
    text: >-
      Your calendar is so full of recurring meetings that you have very little time left for focused work. How
      would you decide which meetings to keep, change, or drop?
    expected_concepts:
      - purpose and outcome of each meeting
      - whether your presence is needed or an update would do
      - cost of the meeting in time across attendees
      - alternatives such as written updates or delegation
      - protecting blocks of focus time
    rubric:
      excellent: Reviews each meeting by its purpose and their own contribution, replaces some with written updates or delegation, tells organisers why, and protects focus blocks.
      good: Drops or shortens some meetings based on value.
      weak: Declines meetings at random or accepts the situation without changing anything.
    followups:
      - How would you tell an organiser you'll stop attending their meeting?
      - Which meeting would you never drop, and why?
    common_errors:
      - Dropping meetings without telling anyone.
      - Judging meetings by how enjoyable they are rather than their value.

  - external_key: problem_solving.tradeoffs_prioritisation.handover_docs_three_days
    competency_key: problem_solving
    topic: Choosing what to document with limited time
    difficulty: easy
    text: >-
      You've been asked to document a system before you move to another project, and you have three days. How
      would you decide what to cover and what to leave out?
    expected_concepts:
      - asking the new owners what they need most
      - prioritising risky and frequently needed knowledge
      - how to operate and recover the system
      - knowledge that exists only in your head
      - pointers to sources instead of duplicating them
    rubric:
      excellent: Starts from what the new owners will need first, prioritises operating and recovery steps and undocumented knowledge, links to existing sources, and leaves stable or obvious parts for later.
      good: Prioritises the most important operational knowledge.
      weak: Tries to document everything evenly or writes a general overview with no practical steps.
    followups:
      - How would you check that what you wrote is actually usable?
      - What would you do in the last hour if you ran out of time?
    common_errors:
      - Writing a long description of how the code is organised and nothing on how to run it.
      - Not involving the people who will inherit it.

  - external_key: problem_solving.tradeoffs_prioritisation.first_version_internal_tool
    competency_key: product_sense
    topic: Scoping a first version
    difficulty: easy
    text: >-
      You have an idea for an internal tool that could save your team a lot of time, and about a week to build
      something. How would you decide what goes into the first version?
    expected_concepts:
      - the single most painful task to solve first
      - talking to the intended users
      - leaving out nice-to-have features
      - a way to tell whether it is working
      - a plan for what comes next
    rubric:
      excellent: Identifies the most valuable task to solve, confirms it with users, cuts everything else, defines how success will be measured and keeps a short list for later.
      good: Focuses the first version on a core need.
      weak: Tries to build everything in a week or builds without asking users.
    followups:
      - How would you decide whether it's worth a second week?
      - What would you deliberately leave rough?
    common_errors:
      - Spreading the week across too many features.
      - Building for an imagined user rather than the real team.

  - external_key: problem_solving.tradeoffs_prioritisation.fifty_pieces_of_feedback
    competency_key: product_sense
    topic: Acting on a pile of user feedback
    difficulty: easy
    text: >-
      In the week after a launch, you receive about fifty pieces of user feedback. How would you decide which ones
      to act on first?
    expected_concepts:
      - grouping similar feedback into themes
      - frequency and severity of each theme
      - alignment with the goals of the launch
      - effort required for each fix
      - closing the loop with users
    rubric:
      excellent: Groups feedback into themes, weighs how often and how badly each affects users against effort and launch goals, picks a few to act on and tells users what happened.
      good: Groups feedback and prioritises by impact.
      weak: Acts on the loudest or most recent comments.
    followups:
      - How would you treat one very detailed complaint from an important user?
      - What would you do with feedback that contradicts other feedback?
    common_errors:
      - Treating every comment as a separate task.
      - Prioritising whoever complains loudest.

  - external_key: problem_solving.tradeoffs_prioritisation.familiar_or_new_approach
    competency_key: problem_solving
    topic: Proven approach versus a new tool
    difficulty: easy
    text: >-
      You could solve a problem quickly using an approach you know well, or try a newer tool that might be better
      but would take time to learn. How do you decide which to use?
    expected_concepts:
      - deadline and cost of delay
      - how much better the new tool actually is for this case
      - long-term value of learning it
      - risk of unknowns with the new tool
      - trying it on a lower-stakes task first
    rubric:
      excellent: Weighs the deadline and risk against the concrete benefit and long-term value, and suggests trialling the new tool where a failure would be cheap.
      good: Considers the deadline and the benefit of the new tool.
      weak: Always picks the new tool or always sticks with the familiar one.
    followups:
      - Tell me about a time you chose the new tool. How did it go?
      - Who else is affected if you pick something unfamiliar?
    common_errors:
      - Ignoring that teammates will have to maintain the choice.
      - Underestimating the learning time.

  - external_key: problem_solving.tradeoffs_prioritisation.cheap_or_reliable_supplier
    competency_key: problem_solving
    topic: Cheaper supplier versus a more reliable one
    difficulty: easy
    text: >-
      You're choosing between two suppliers for a service your team depends on. One is clearly cheaper, the other
      has a better track record for reliability. How would you make the choice?
    expected_concepts:
      - cost of an outage or failure from the supplier
      - total cost including switching and management effort
      - checking references and contract terms
      - how critical the service is
      - an exit plan if the supplier fails
    rubric:
      excellent: Estimates what a supplier failure would cost compared with the price difference, considers total cost, contract protections and how critical the service is, and keeps an exit plan.
      good: Weighs price against reliability with some reasoning about impact.
      weak: Picks on price alone or reputation alone.
    followups:
      - How would you check the cheaper supplier's reliability claims?
      - What would make the cheaper option the right choice?
    common_errors:
      - Comparing only the headline price.
      - Ignoring contract terms for service failures.

  - external_key: problem_solving.tradeoffs_prioritisation.last_feature_or_tests
    competency_key: problem_solving
    topic: Finishing scope versus securing quality
    difficulty: easy
    text: >-
      You're close to a deadline, and with the time left you could either finish the last planned feature or
      strengthen testing on what's already built. How do you decide?
    expected_concepts:
      - risk of defects in existing work
      - value of the last feature to users
      - who needs to agree on the trade
      - consequences of a bug after release
      - possibility of shipping the feature later
    rubric:
      excellent: Compares the risk and cost of defects in shipped work with the value of the last feature, involves the product owner, and plans for whichever part is deferred.
      good: Weighs quality risk against feature value and decides with a reason.
      weak: Decides alone without considering consequences, or tries to do both and does neither well.
    followups:
      - What kind of feature would justify skipping the extra testing?
      - How would you explain the choice to the product owner?
    common_errors:
      - Doing half of each.
      - Making the call without telling the person who owns the scope.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.tradeoffs_prioritisation.one_slot_three_improvements
    competency_key: problem_solving
    topic: Picking one improvement from three
    difficulty: medium
    text: >-
      Your team has room for one improvement this month. The candidates are speeding up a slow page, fixing a
      confusing onboarding step, and cleaning up an error-prone release process. How would you choose?
    expected_concepts:
      - evidence of each problem's impact
      - which users or outcomes each affects
      - effort and confidence in each fix
      - risk reduction versus growth value
      - what can be partially addressed alongside
    rubric:
      excellent: Gathers evidence of impact for each option, compares value, effort and confidence in a consistent way, considers risk reduction as well as growth, and explains the choice and what happens to the others.
      good: Compares the options on impact and effort and picks one.
      weak: Chooses based on preference or the most interesting work.
    followups:
      - What data would you want before choosing?
      - How would you defend the choice to the people who wanted the others?
    common_errors:
      - Comparing options using different yardsticks.
      - Ignoring the risk side of the release-process problem.

  - external_key: problem_solving.tradeoffs_prioritisation.overriding_the_scoring_model
    competency_key: product_sense
    topic: When a prioritisation score is wrong
    difficulty: medium
    text: >-
      Many teams rank their backlog with a scoring framework. Tell me about a time a score pointed one way but you
      decided differently. What made you override it?
    expected_concepts:
      - what the framework measured and missed
      - the factor that changed the decision
      - evidence used to justify the override
      - how the decision was communicated
      - the outcome and whether the framework was adjusted
    rubric:
      excellent: Gives a concrete example, explains what the score missed such as strategy, dependencies or risk, shows the evidence behind the override, and describes the outcome and any change to the framework.
      good: Real example with a sensible reason to override the score.
      weak: No real example, or overrides based on personal preference.
    followups:
      - How do you stop overrides from making the framework meaningless?
      - Looking back, was the override the right call?
    common_errors:
      - Treating the score as the decision rather than an input.
      - Overriding without explaining why to anyone.

  - external_key: problem_solving.tradeoffs_prioritisation.retire_costly_feature
    competency_key: product_sense
    topic: Retiring a costly, lightly used feature
    difficulty: medium
    text: >-
      A feature used by about five percent of customers takes up a large share of your team's maintenance effort.
      How would you decide whether to retire it?
    expected_concepts:
      - who those customers are and how much they rely on it
      - maintenance cost and what it blocks
      - cheaper alternatives such as simplifying it
      - migration paths for affected customers
      - phased, communicated retirement
    rubric:
      excellent: Looks at who uses the feature and how deeply, quantifies its cost and what it blocks, considers simplifying instead, and plans a communicated retirement with migration help.
      good: Weighs usage against cost and plans communication.
      weak: Removes it based on the usage number alone, or keeps it out of habit.
    followups:
      - What if that five percent includes some of your largest accounts?
      - How long a notice period would you give, and why?
    common_errors:
      - Looking at the number of users and not how much they depend on it.
      - Removing it without a migration path.

  - external_key: problem_solving.tradeoffs_prioritisation.contractors_borrow_or_delay
    competency_key: project_management
    topic: Adding people versus moving the date
    difficulty: medium
    text: >-
      A project is behind schedule. You could bring in contractors, borrow people from another team, or push the
      date back. How would you weigh those options?
    expected_concepts:
      - ramp-up time and onboarding cost of new people
      - which tasks can be handed off cleanly
      - impact on the team lending people
      - cost of the delay to the business
      - combining options such as a smaller scope plus a small delay
    rubric:
      excellent: Recognises that adding people late often slows things down, identifies tasks that can be handed off cleanly, weighs the cost to other teams and the business cost of delay, and considers combined options including scope.
      good: Compares the options with their main costs and picks one.
      weak: Assumes more people means faster delivery.
    followups:
      - Which kinds of tasks are best for someone joining late?
      - What would you need to know about the cost of the delay?
    common_errors:
      - Ignoring onboarding time.
      - Forgetting that scope is also an option.

  - external_key: problem_solving.tradeoffs_prioritisation.two_markets_first
    competency_key: product_sense
    topic: Narrow launch sooner or broad launch later
    difficulty: medium
    text: >-
      You can launch a new feature in every market in three months, or in your two biggest markets in one month.
      How would you decide which path to take?
    expected_concepts:
      - value captured earlier from the biggest markets
      - learning from an early launch
      - extra cost and effort of a staged rollout
      - risk of fragmenting the product or messaging
      - commitments already made in other markets
    rubric:
      excellent: Weighs the earlier value and learning against the cost of a staged rollout, checks commitments in other markets, and explains how learning from the first launch would shape the rest.
      good: Compares time to value and risk across both paths.
      weak: Picks one without considering learning, cost or commitments.
    followups:
      - What would you want to learn from the first two markets?
      - What could make the staged path more expensive overall?
    common_errors:
      - Ignoring the extra overhead of two launches.
      - Assuming all markets behave the same way.

  - external_key: problem_solving.tradeoffs_prioritisation.fresh_or_accurate_numbers
    competency_key: problem_solving
    topic: Freshness versus accuracy of data
    difficulty: medium
    text: >-
      Users of an internal dashboard want the numbers refreshed every few minutes, but doing that would make them
      less accurate than the current daily refresh. How would you decide what to offer?
    expected_concepts:
      - what decisions the dashboard actually supports
      - how much accuracy matters for those decisions
      - showing both fast estimates and confirmed figures
      - labelling data freshness clearly
      - cost of building and running both
    rubric:
      excellent: Starts from the decisions users make with the numbers, decides which need speed and which need accuracy, considers showing provisional figures clearly labelled, and weighs the running cost.
      good: Links the choice to how users use the dashboard.
      weak: Gives users whatever they ask for, or refuses, without understanding the need.
    followups:
      - How would you prevent people from treating provisional numbers as final?
      - What would you do if two user groups wanted opposite things?
    common_errors:
      - Not asking what decisions depend on the data.
      - Mixing estimated and final numbers without labels.

  - external_key: problem_solving.tradeoffs_prioritisation.quality_bar_internal_tool
    competency_key: problem_solving
    topic: Setting the quality bar by audience
    difficulty: medium
    text: >-
      How do you decide how much testing and polish an internal tool deserves compared with something customers
      use directly? Tell me about a time you had to make that call.
    expected_concepts:
      - consequences of failure for each audience
      - how many people depend on the tool
      - whether the tool touches important data or money
      - minimum safeguards that always apply
      - the specific example and its result
    rubric:
      excellent: Sets the quality bar by consequences of failure rather than by audience label, keeps baseline safeguards everywhere, and backs it with a concrete example and outcome.
      good: Gives sensible criteria and a real example.
      weak: Treats internal tools as not needing any care, or gives no example.
    followups:
      - When has an internal tool caused a real problem because it was under-tested?
      - What safeguards would you never skip?
    common_errors:
      - Assuming internal means low stakes.
      - Speaking only in generalities.

  - external_key: problem_solving.tradeoffs_prioritisation.parallel_or_sequential
    competency_key: project_management
    topic: Running projects in parallel or in sequence
    difficulty: medium
    text: >-
      Your team has three projects to deliver this half. You could run them all in parallel or finish them one at
      a time. How would you decide?
    expected_concepts:
      - cost of context switching
      - value of delivering something earlier
      - dependencies between the projects
      - skills each project needs
      - risk of everything being half-done at a deadline
    rubric:
      excellent: Explains how sequencing delivers value sooner and reduces switching, checks dependencies and skills, and considers limited parallelism where it fits, with the risk of everything finishing late.
      good: Considers switching costs and dependencies.
      weak: Defaults to parallel to keep everyone busy without considering the cost.
    followups:
      - How would you explain to stakeholders that their project starts later?
      - When does running work in parallel make more sense?
    common_errors:
      - Ignoring context-switching cost.
      - Starting everything and finishing nothing.

  - external_key: problem_solving.tradeoffs_prioritisation.restructure_before_feature
    competency_key: problem_solving
    topic: Restructuring before building a feature
    difficulty: medium
    text: >-
      Before adding a new feature, an engineer proposes restructuring the existing code first. It would add a week
      but make future changes easier. How would you decide whether to do it?
    expected_concepts:
      - how often that area changes
      - concrete future work that would benefit
      - risk of introducing defects
      - smaller restructuring limited to what the feature touches
      - impact of the extra week on the commitment
    rubric:
      excellent: Asks how often that code changes and what upcoming work benefits, considers a narrower restructure scoped to the feature, weighs the defect risk and deadline, and decides with the engineer.
      good: Weighs the future benefit against the delay.
      weak: Always says yes or always says no to restructuring.
    followups:
      - How would you check the engineer's claim that future changes get easier?
      - What if the deadline can't move at all?
    common_errors:
      - Accepting vague promises of future speed.
      - Rejecting improvement work by reflex.

  - external_key: problem_solving.tradeoffs_prioritisation.sales_versus_operations_risk
    competency_key: stakeholder_management
    topic: Aligning groups with different risk appetites
    difficulty: medium
    text: >-
      Sales wants a release out now to close deals, while operations wants another two weeks of testing. How would
      you help them reach a decision?
    expected_concepts:
      - making each side's concerns concrete
      - quantifying the deals at stake and the operational risk
      - middle options such as a limited release
      - identifying who owns the decision
      - recording the decision and the risk accepted
    rubric:
      excellent: Turns both positions into concrete costs and risks, generates middle options, makes clear who decides, and records the accepted risk so it is visible later.
      good: Brings both sides together and finds a reasonable compromise.
      weak: Sides with whoever is more senior or louder.
    followups:
      - What if neither side will move?
      - How would you record the risk that was accepted?
    common_errors:
      - Splitting the difference without analysing either position.
      - Leaving the decision owner unclear.

  - external_key: problem_solving.tradeoffs_prioritisation.how_far_to_plan_ahead
    competency_key: project_management
    topic: How much detail to plan up front
    difficulty: medium
    text: >-
      For a six-month initiative, how do you decide how far ahead to plan in detail, and where to leave room for
      change?
    expected_concepts:
      - detailed near-term plans and coarser later ones
      - fixed external commitments that need early planning
      - known uncertainties and when they resolve
      - regular replanning points
      - milestones that still give stakeholders visibility
    rubric:
      excellent: Plans the near term in detail and the rest at milestone level, locks in early anything with external commitments, schedules replanning as uncertainty resolves, and keeps stakeholders informed through milestones.
      good: Balances detailed near-term planning with flexibility later.
      weak: Plans all six months in full detail or plans nothing ahead.
    followups:
      - How do you handle a stakeholder who wants a detailed six-month plan?
      - What signals tell you it's time to replan?
    common_errors:
      - Treating a detailed long-range plan as fixed.
      - Leaving dependencies on other teams unplanned.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.tradeoffs_prioritisation.extra_nine_of_availability
    competency_key: problem_solving
    topic: Paying for higher availability
    difficulty: hard
    text: >-
      Leadership asks for a service to be available 99.99 percent of the time instead of 99.9. How would you work
      out whether that improvement is worth what it costs?
    expected_concepts:
      - translating each target into allowed downtime
      - business impact of downtime for this service
      - engineering and running cost of the higher target
      - limits imposed by dependencies
      - slower delivery as a hidden cost
    rubric:
      excellent: Converts targets into real downtime, estimates the business cost of that downtime, compares it with the engineering, infrastructure and delivery-speed cost of the higher target, and checks whether dependencies even allow it.
      good: Compares the cost of downtime with the cost of improving availability.
      weak: Accepts or rejects the target without quantifying either side.
    followups:
      - How much downtime per month does each target allow?
      - What if a key dependency only offers 99.9 percent?
    common_errors:
      - Forgetting that dependencies cap achievable availability.
      - Ignoring the slowdown in shipping that stricter targets bring.

  - external_key: problem_solving.tradeoffs_prioritisation.rewrite_or_replace_gradually
    competency_key: problem_solving
    topic: Full rewrite versus gradual replacement
    difficulty: hard
    text: >-
      Your product runs on an old system that slows down every change. Some people want a full rewrite, others
      want to replace it piece by piece. How would you decide which way to go?
    expected_concepts:
      - delivery freeze and risk during a full rewrite
      - capturing hidden behaviour of the old system
      - incremental replacement with value delivered along the way
      - cost of running two systems side by side
      - checkpoints and criteria for changing approach
    rubric:
      excellent: Weighs the long freeze and hidden-behaviour risk of a rewrite against the dual-running cost of gradual replacement, prefers approaches that deliver value along the way, and sets checkpoints to change course.
      good: Compares both options on risk, time and cost.
      weak: Picks a rewrite because the old system is unpleasant, without assessing risk.
    followups:
      - How would you decide which piece to replace first?
      - What would make a full rewrite the better option?
    common_errors:
      - Underestimating the undocumented behaviour of the old system.
      - Planning a long effort with no value until the end.

  - external_key: problem_solving.tradeoffs_prioritisation.conversion_versus_retention
    competency_key: product_sense
    topic: Two metrics pulling in opposite directions
    difficulty: hard
    text: >-
      A change your team shipped has improved sign-up conversion, but early data suggests it may be hurting
      longer-term retention. How would you decide what to do?
    expected_concepts:
      - confirming the effect is real and not noise
      - understanding the mechanism linking the two
      - long-term value versus short-term gain
      - options to keep the gain while reducing the harm
      - agreeing on which metric matters more for the business
    rubric:
      excellent: Validates the retention signal, investigates why the change affects it, compares the long-term value of retained users with the short-term gain, and looks for variants that keep the benefit without the harm.
      good: Takes the retention concern seriously and weighs both metrics.
      weak: Keeps the change because conversion went up, or reverts without checking the data.
    followups:
      - How would you know if the retention drop is real?
      - Who should decide which metric takes priority?
    common_errors:
      - Optimising the metric that is easiest to see.
      - Acting on early, noisy data without validation.

  - external_key: problem_solving.tradeoffs_prioritisation.more_data_for_better_features
    competency_key: problem_solving
    topic: Product value versus data protection risk
    difficulty: hard
    text: >-
      Your product team wants to collect more user data to improve recommendations, and your legal team is wary of
      the risk. How would you approach the trade-off?
    expected_concepts:
      - the measurable benefit the extra data would bring
      - legal and regulatory obligations
      - collecting the minimum data needed
      - user consent and transparency
      - testing the benefit before collecting widely
    rubric:
      excellent: Quantifies the expected benefit, works within legal obligations, looks for the minimum data that delivers most of the value, builds in consent and transparency, and validates the benefit on a small scale first.
      good: Considers both benefit and risk and proposes safeguards.
      weak: Collects the data because it helps the product, or dismisses the idea without exploring options.
    followups:
      - How would you test the value before collecting data from everyone?
      - What would make you drop the idea entirely?
    common_errors:
      - Collecting data first and deciding on uses later.
      - Treating legal review as a box to tick.

  - external_key: problem_solving.tradeoffs_prioritisation.ten_projects_capacity_for_six
    competency_key: project_management
    topic: Choosing projects for limited capacity
    difficulty: hard
    text: >-
      You're responsible for a portfolio of ten proposed projects, and the organisation has capacity for about six.
      How would you decide which ones go ahead?
    expected_concepts:
      - alignment with strategic goals
      - value, cost and confidence for each project
      - dependencies and shared resources between projects
      - mandatory work such as compliance
      - transparent criteria and communication of what was not chosen
    rubric:
      excellent: Applies transparent criteria tied to strategy, accounts for mandatory work, dependencies and shared constraints, and communicates clearly why some projects were not chosen.
      good: Ranks projects using value and cost and explains the result.
      weak: Picks the projects with the strongest sponsors or squeezes in all ten.
    followups:
      - What do you do with the four that didn't make it?
      - How would you handle a sponsor who disputes the ranking?
    common_errors:
      - Overcommitting by starting all ten at reduced pace.
      - Ignoring dependencies between projects.

  - external_key: problem_solving.tradeoffs_prioritisation.twenty_incident_actions
    competency_key: problem_solving
    topic: Choosing incident follow-ups to fund
    difficulty: hard
    text: >-
      After a serious incident, the review produces twenty follow-up actions, but the team can realistically
      finish only five this quarter alongside its other commitments. How would you choose which five?
    expected_concepts:
      - which actions prevent recurrence versus reduce impact
      - likelihood of the incident happening again
      - cost and effort of each action
      - actions that address several risks at once
      - tracking and revisiting the deferred ones
    rubric:
      excellent: Ranks actions by how much they reduce the chance or impact of recurrence per unit of effort, favours actions that cover several risks, and keeps the deferred items visible with owners and dates.
      good: Prioritises actions by impact and effort.
      weak: Picks the easiest five or the first five on the list.
    followups:
      - How would you justify deferring an action someone feels strongly about?
      - What would make you push back on the team's other commitments instead?
    common_errors:
      - Choosing only quick fixes that don't address the root cause.
      - Letting deferred actions disappear.
