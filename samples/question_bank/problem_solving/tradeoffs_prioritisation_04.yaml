# Curated questions: problem solving — trade-offs and prioritisation under constraints (time, risk,
# quality, cost). Scenario questions spoken by the AI interviewer; evaluation is based only on the
# reasoning and the content of the answer.
version: 1
defaults:
  role_tags: [general, tech_lead, product_manager, project_manager]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.tradeoffs_prioritisation.unplanned_small_improvement
    competency_key: problem_solving
    topic: Spending time on an unplanned improvement
    difficulty: easy
    text: >-
      You notice a small change that would make your team's daily work noticeably easier, but it isn't on anyone's
      plan. How do you decide whether to spend time on it?
    expected_concepts:
      - size of the benefit and how many people it helps
      - effort and risk of the change
      - impact on planned commitments
      - checking with the team or lead
      - fitting it into slack time
    rubric:
      excellent: Estimates the benefit and effort, checks it won't put commitments at risk, agrees it with the team or lead, and fits it into slack or plans it properly.
      good: Weighs benefit against effort and current work.
      weak: Does it secretly at the cost of planned work, or never raises it.
    followups:
      - How would you make the case to your lead?
      - What if it turns out bigger than expected halfway through?
    common_errors:
      - Letting a side project delay committed work.
      - Not sharing the idea at all.

  - external_key: problem_solving.tradeoffs_prioritisation.demo_with_unfinished_features
    competency_key: product_sense
    topic: Choosing what to show in a demo
    difficulty: easy
    text: >-
      You're preparing a customer demo in two days, and not every feature will be ready. How would you decide
      what to show?
    expected_concepts:
      - what the customer most cares about
      - showing only stable, working parts
      - being clear about what is still in progress
      - a short, reliable path through the demo
      - a fallback if something fails live
    rubric:
      excellent: Builds the demo around what the customer cares about using only stable features, is open about unfinished parts, rehearses a reliable path and prepares a fallback.
      good: Picks stable, relevant features for the demo.
      weak: Shows unfinished features as if complete, or tries to show everything.
    followups:
      - How would you talk about a feature that isn't ready yet?
      - What would you do if something broke during the demo?
    common_errors:
      - Overpromising on unfinished features.
      - Not rehearsing the demo path.

  - external_key: problem_solving.tradeoffs_prioritisation.covering_the_queue_alone
    competency_key: problem_solving
    topic: Ordering a queue of requests
    difficulty: easy
    text: >-
      You're covering a queue of support requests on your own for the afternoon, and there are more than you can
      finish. How would you decide the order to handle them in?
    expected_concepts:
      - severity and business impact
      - number of users affected
      - quick items that unblock people
      - commitments or response deadlines
      - updating requesters about delays
    rubric:
      excellent: Quickly scans the whole queue, ranks by severity, reach and deadlines, clears fast unblocking items, and updates people who will have to wait.
      good: Uses severity and impact to order the queue.
      weak: Works strictly first in, first out without checking severity.
    followups:
      - How long would you spend on the first scan?
      - What would you hand over at the end of the afternoon?
    common_errors:
      - Getting stuck on one complex request while urgent ones wait.
      - Not telling anyone about the backlog.

  - external_key: problem_solving.tradeoffs_prioritisation.release_now_or_bundle
    competency_key: project_management
    topic: Releasing now or bundling later
    difficulty: easy
    text: >-
      You could release a small improvement now, or bundle it with a larger release next month. How do you decide
      which makes more sense?
    expected_concepts:
      - value of getting it to users sooner
      - overhead and risk of each release
      - dependencies on the larger release
      - communication and training needs
      - ease of rolling back
    rubric:
      excellent: Weighs early value against release overhead and risk, checks dependencies, and considers how users will be informed and how easily it can be reversed.
      good: Compares value of early release with its cost.
      weak: Always bundles or always releases immediately with no reasoning.
    followups:
      - When would bundling be clearly better?
      - How would you keep small releases cheap?
    common_errors:
      - Ignoring the cost of a separate release.
      - Holding back finished work with no benefit from waiting.

  - external_key: problem_solving.tradeoffs_prioritisation.many_mild_or_few_severe
    competency_key: problem_solving
    topic: Broad mild impact versus narrow severe impact
    difficulty: easy
    text: >-
      You have time to fix only one of two bugs today. One affects many users in a minor way, the other affects a
      few users very badly. How do you choose?
    expected_concepts:
      - severity for the affected users, such as data loss or being blocked
      - number of users and frequency
      - workarounds for each
      - business importance of the affected users or flows
      - communicating with whoever waits
    rubric:
      excellent: Compares severity, reach and available workarounds rather than counting users alone, considers which flows are business-critical, and communicates with the group that waits.
      good: Weighs severity against reach and decides with a reason.
      weak: Picks by number of users alone or by which is easier.
    followups:
      - Would your answer change if the severe bug caused data loss?
      - What would you tell the users who have to wait?
    common_errors:
      - Ignoring workarounds.
      - Treating user count as the only measure.

  - external_key: problem_solving.tradeoffs_prioritisation.rough_or_thorough_analysis
    competency_key: problem_solving
    topic: Quick estimate versus thorough analysis
    difficulty: easy
    text: >-
      A colleague asks you for an analysis. You could give a rough answer in an hour or a thorough one in three
      days. How do you decide which they need?
    expected_concepts:
      - asking what decision the analysis supports
      - how precise the answer needs to be
      - when they need it by
      - offering the rough answer first
      - stating the limits of a quick answer
    rubric:
      excellent: Asks what decision the analysis supports and what precision it needs, often offers a quick answer first with its limits stated, and does the deeper work only if it would change the decision.
      good: Clarifies the need before choosing.
      weak: Assumes thorough is always better or gives a rough answer without caveats.
    followups:
      - What would make you insist on the thorough version?
      - How would you describe the limits of the quick answer?
    common_errors:
      - Not asking what the analysis is for.
      - Presenting a quick estimate as precise.

  - external_key: problem_solving.tradeoffs_prioritisation.first_two_weeks_new_role
    competency_key: problem_solving
    topic: What to learn first in a new role
    difficulty: easy
    text: >-
      In your first two weeks in a new role, there's far more to learn than you have time for. How would you decide
      what to focus on first?
    expected_concepts:
      - what you are expected to deliver soonest
      - key people and how decisions are made
      - the most critical systems or processes
      - quick ways to learn such as shadowing
      - noting topics to return to later
    rubric:
      excellent: Prioritises learning around near-term expectations and the most critical areas, meets key people early, uses efficient methods such as shadowing and keeps a list of topics for later.
      good: Has a sensible focus based on what matters most.
      weak: Tries to learn everything evenly or waits to be told.
    followups:
      - Who would you talk to in the first week?
      - What would you deliberately leave for later?
    common_errors:
      - Reading documentation for days without talking to anyone.
      - Ignoring what they are expected to deliver.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.tradeoffs_prioritisation.slow_code_reviews
    competency_key: problem_solving
    topic: Thorough reviews versus delivery speed
    difficulty: medium
    text: >-
      Code reviews on your team are thorough but often take several days, and delivery is slowing down. How would
      you decide what to change?
    expected_concepts:
      - data on review wait time and what reviews catch
      - smaller changes that are faster to review
      - risk-based depth of review
      - team agreements on review turnaround
      - automating checks that reviewers do by hand
    rubric:
      excellent: Measures where time goes and what reviews catch, reduces change size, matches review depth to risk, automates mechanical checks and agrees turnaround expectations.
      good: Proposes changes that keep quality while reducing delay.
      weak: Drops reviews or tells people to review faster without analysis.
    followups:
      - How would you tell whether quality dropped after the change?
      - What kinds of changes still need a deep review?
    common_errors:
      - Removing reviews entirely to save time.
      - Ignoring the size of changes as a cause.

  - external_key: problem_solving.tradeoffs_prioritisation.announced_event_unstable_feature
    competency_key: stakeholder_management
    topic: A marketing date the product can't meet
    difficulty: medium
    text: >-
      Marketing has booked a big event to announce your feature, but engineering now says it won't be stable in
      time. How would you decide what to do?
    expected_concepts:
      - what exactly is unstable and the risk to users
      - options such as announcing with a later availability date
      - limited preview or waitlist
      - cost of moving the event versus a poor launch
      - aligning marketing and engineering early
    rubric:
      excellent: Pins down the stability risk, offers options like announcing with a later date or a limited preview, compares their costs, and aligns marketing and engineering quickly.
      good: Explores options between cancelling and launching unstable.
      weak: Launches anyway to protect the event or cancels without exploring options.
    followups:
      - What would a limited preview look like?
      - Who should make the final call?
    common_errors:
      - Treating the announcement and the availability date as the same thing.
      - Bringing in marketing too late.

  - external_key: problem_solving.tradeoffs_prioritisation.free_up_twenty_percent
    competency_key: problem_solving
    topic: Deciding what to stop doing
    difficulty: medium
    text: >-
      If you had to free up a fifth of your team's time next quarter without hiring anyone, how would you decide
      what to stop doing?
    expected_concepts:
      - inventory of where time currently goes
      - value of each activity
      - work that can be automated, reduced or handed off
      - consequences of stopping and who is affected
      - agreeing the changes with stakeholders
    rubric:
      excellent: Builds an inventory of where time goes, ranks activities by value, identifies what to stop, automate or hand off, checks consequences and agrees the changes with those affected.
      good: Identifies low-value work and proposes cuts.
      weak: Asks everyone to be more efficient without stopping anything.
    followups:
      - How would you find out where time actually goes?
      - What would you never stop, even under pressure?
    common_errors:
      - Cutting important but invisible work such as maintenance.
      - Stopping work without telling the people who rely on it.

  - external_key: problem_solving.tradeoffs_prioritisation.five_churn_reasons
    competency_key: product_sense
    topic: Which churn reason to tackle first
    difficulty: medium
    text: >-
      Feedback from customers who cancelled points to five different reasons for leaving. How would you decide
      which one to tackle first?
    expected_concepts:
      - revenue lost to each reason
      - whether the reason can actually be addressed
      - checking feedback against usage data
      - effort and confidence for each fix
      - measuring the effect of the change
    rubric:
      excellent: Weighs each reason by revenue lost and how addressable it is, cross-checks stated reasons with behaviour data, compares effort and confidence, and plans how to measure impact.
      good: Prioritises reasons by impact and feasibility.
      weak: Tackles the most frequently mentioned reason without further analysis.
    followups:
      - Why might stated reasons differ from real ones?
      - How would you know your fix reduced cancellations?
    common_errors:
      - Taking survey answers at face value.
      - Counting customers rather than value lost.

  - external_key: problem_solving.tradeoffs_prioritisation.downtime_window_or_zero_downtime
    competency_key: problem_solving
    topic: Planned downtime versus extra engineering time
    difficulty: medium
    text: >-
      A data migration could be done in a four-hour maintenance window, or with no downtime using an approach that
      needs three more weeks of work. How would you decide?
    expected_concepts:
      - customer impact of four hours of downtime
      - contractual or service commitments
      - risk and complexity of each approach
      - choosing a low-impact window
      - rollback plan for either option
    rubric:
      excellent: Quantifies the customer and contractual impact of downtime, compares the risk and complexity of both approaches, considers a low-traffic window and has a rollback plan either way.
      good: Weighs downtime impact against extra effort.
      weak: Picks zero downtime by default or downtime by default without analysis.
    followups:
      - What could make the four-hour window run longer?
      - Who would you need to inform before choosing downtime?
    common_errors:
      - Ignoring the extra risk in the more complex approach.
      - Not planning for the window overrunning.

  - external_key: problem_solving.tradeoffs_prioritisation.second_provider_for_resilience
    competency_key: problem_solving
    topic: Adding a second provider for resilience
    difficulty: medium
    text: >-
      Your team relies on a single provider for a critical service, and someone proposes adding a second one for
      resilience. How would you decide if it's worth it?
    expected_concepts:
      - likelihood and impact of the provider failing
      - cost of building and running two integrations
      - complexity and new failure modes added
      - cheaper alternatives such as better fallbacks
      - testing that the failover really works
    rubric:
      excellent: Estimates the cost of a provider failure against the cost and complexity of a second integration, considers simpler fallbacks, and insists that failover be tested regularly.
      good: Compares the risk reduced with the cost added.
      weak: Adds the second provider because redundancy sounds good, or dismisses the idea without analysis.
    followups:
      - What new problems could the second provider introduce?
      - How would you prove failover works before you need it?
    common_errors:
      - Assuming redundancy always improves reliability.
      - Never testing the failover path.

  - external_key: problem_solving.tradeoffs_prioritisation.platform_team_request_intake
    competency_key: project_management
    topic: A fair intake process for a shared team
    difficulty: medium
    text: >-
      You run a shared internal team, and other teams send far more requests than you can handle. How would you set
      up a fair, repeatable way to decide what gets done?
    expected_concepts:
      - a single visible intake channel
      - clear criteria such as impact, urgency and strategic fit
      - capacity reserved for urgent and maintenance work
      - regular review with requesting teams
      - self-service to reduce repeated requests
    rubric:
      excellent: Creates one visible intake, publishes criteria, reserves capacity for urgent work, reviews priorities regularly with requesters and reduces demand through self-service.
      good: Sets up clear criteria and a regular review.
      weak: Handles requests by whoever asks loudest or most senior.
    followups:
      - How would you handle a request that skips the process?
      - How would you show requesting teams the process is fair?
    common_errors:
      - Keeping priorities hidden from requesters.
      - Leaving no capacity for urgent work.

  - external_key: problem_solving.tradeoffs_prioritisation.enterprise_go_live_gaps
    competency_key: product_sense
    topic: Deciding what a first enterprise customer needs
    difficulty: medium
    text: >-
      Your first large enterprise customer wants to go live in a month, but some administration features they'll
      expect aren't built yet. How would you decide what to deliver for go-live?
    expected_concepts:
      - which features are truly required to go live
      - manual or service-based workarounds
      - effort and risk for each missing feature
      - agreeing a phased plan with the customer
      - avoiding one-off work that doesn't generalise
    rubric:
      excellent: Works with the customer to separate must-haves from expectations, covers some gaps with temporary workarounds, builds features that generalise to other customers and agrees a phased plan.
      good: Prioritises the essentials and agrees a plan with the customer.
      weak: Promises everything in a month or delays go-live without exploring options.
    followups:
      - Which gaps could be covered by a manual process at first?
      - How would you avoid building features only this customer needs?
    common_errors:
      - Assuming every expectation is a hard requirement.
      - Building custom features that don't serve other customers.

  - external_key: problem_solving.tradeoffs_prioritisation.spending_the_schedule_buffer
    competency_key: project_management
    topic: Using schedule buffer for an improvement
    difficulty: medium
    text: >-
      Midway through a project, a team member asks to use the schedule buffer to add an improvement they believe is
      valuable. How would you decide?
    expected_concepts:
      - what the buffer is protecting against
      - remaining risks in the project
      - value of the improvement
      - doing it later as a follow-up
      - agreeing with the project owner
    rubric:
      excellent: Reviews what risks the buffer still covers, compares them with the value of the improvement, considers deferring it as a follow-up and agrees the decision with the owner.
      good: Weighs remaining risk against the improvement's value.
      weak: Spends the buffer freely or refuses without considering value.
    followups:
      - How would you tell the team member if the answer is no?
      - What if the improvement reduces a project risk?
    common_errors:
      - Treating buffer as spare time.
      - Not involving the project owner.

  - external_key: problem_solving.tradeoffs_prioritisation.deliberately_delay_a_decision
    competency_key: problem_solving
    topic: Choosing to wait before deciding
    difficulty: medium
    text: >-
      When is it better to deliberately hold off on a decision rather than make it now? Tell me about a time you
      chose to wait.
    expected_concepts:
      - information that would arrive soon
      - cost of waiting compared with cost of a wrong decision
      - setting a date or trigger to decide
      - keeping options open in the meantime
      - the concrete example and its result
    rubric:
      excellent: Explains that waiting makes sense when important information is coming and delay is cheap, sets a clear trigger for deciding, and gives a real example with its outcome.
      good: Reasonable criteria for waiting and a credible example.
      weak: Confuses waiting with avoidance, or gives no example.
    followups:
      - How did you make sure the decision didn't drift indefinitely?
      - Tell me about a time waiting turned out to be a mistake.
    common_errors:
      - Waiting without a defined decision point.
      - Ignoring the cost of delay.

  - external_key: problem_solving.tradeoffs_prioritisation.three_months_not_two_weeks
    competency_key: stakeholder_management
    topic: When the estimate is far above expectations
    difficulty: medium
    text: >-
      A stakeholder asks for a feature they expect to take two weeks, and your team estimates three months. How
      would you work out what to do next?
    expected_concepts:
      - understanding the problem the stakeholder wants solved
      - explaining what drives the estimate
      - smaller versions that solve most of the problem
      - comparing the value with the full cost
      - agreeing a decision together
    rubric:
      excellent: Goes back to the underlying problem, explains the estimate's drivers in plain terms, proposes smaller options that deliver most of the value, and decides jointly with the stakeholder.
      good: Explains the gap and offers alternatives.
      weak: Accepts a two-week deadline or just states the estimate and stops.
    followups:
      - What would a two-week version look like?
      - How would you check your own estimate isn't inflated?
    common_errors:
      - Not exploring a smaller scope.
      - Explaining the estimate in jargon.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.tradeoffs_prioritisation.tenfold_growth_same_team
    competency_key: problem_solving
    topic: Scaling work versus new features
    difficulty: hard
    text: >-
      Sales expects customer numbers to grow tenfold next year, and your system is already close to its limits.
      With the same team, how would you balance scaling work against new features?
    expected_concepts:
      - validating the growth forecast and its timing
      - finding which limits will break first
      - sequencing scaling work ahead of the growth curve
      - feature work that can be paused or reduced
      - agreeing the trade-off with leadership
    rubric:
      excellent: Tests the forecast, identifies which limits will break first and when, sequences scaling work ahead of demand, cuts lower-value features and agrees the trade-off openly with leadership.
      good: Plans scaling work and reduces feature work accordingly.
      weak: Keeps building features and hopes the system copes, or stops all features without a plan.
    followups:
      - How would you find what breaks first?
      - What would you say if leadership wants all the features too?
    common_errors:
      - Scaling everything instead of the real bottlenecks.
      - Trusting the forecast without checking it.

  - external_key: problem_solving.tradeoffs_prioritisation.quarter_target_versus_product
    competency_key: product_sense
    topic: Short-term revenue versus long-term product
    difficulty: hard
    text: >-
      Your company is under pressure to hit this quarter's revenue target, and the quickest way is a set of one-off
      deals that would complicate the product. How would you weigh that up?
    expected_concepts:
      - size of the revenue at stake
      - long-term cost in complexity and maintenance
      - deals that can be structured to avoid custom work
      - impact on product strategy and other customers
      - making the long-term cost visible to leadership
    rubric:
      excellent: Quantifies both the near-term revenue and the long-term cost, looks for deal structures that avoid custom work, and makes the trade-off visible to leadership so it is decided knowingly.
      good: Considers both sides and proposes ways to limit the damage.
      weak: Accepts every deal or rejects all of them without analysis.
    followups:
      - How would you estimate the long-term cost?
      - What would you accept, and what would you refuse?
    common_errors:
      - Ignoring the cumulative cost of one-off work.
      - Treating revenue pressure as illegitimate.

  - external_key: problem_solving.tradeoffs_prioritisation.audit_finds_a_dozen_gaps
    competency_key: project_management
    topic: Prioritising audit findings against the roadmap
    difficulty: hard
    text: >-
      An audit finds a dozen compliance gaps, and fixing all of them would take your whole team for a quarter. How
      would you prioritise?
    expected_concepts:
      - severity and deadlines of each finding
      - interim controls that reduce risk quickly
      - findings that share a root cause
      - agreeing a remediation plan with the auditors or compliance team
      - balancing remediation with critical roadmap work
    rubric:
      excellent: Ranks findings by severity and deadline, applies quick interim controls, groups findings with a shared cause, agrees a credible plan with compliance and balances it openly against critical roadmap work.
      good: Prioritises by severity and makes a plan.
      weak: Fixes the easiest findings first or ignores the roadmap impact.
    followups:
      - What interim controls might buy time?
      - How would you explain the roadmap impact to leadership?
    common_errors:
      - Treating every finding as equally urgent.
      - Not agreeing the plan with compliance.

  - external_key: problem_solving.tradeoffs_prioritisation.fraud_check_down
    competency_key: problem_solving
    topic: Failing open or failing closed
    difficulty: hard
    text: >-
      A fraud-checking service your payments flow depends on is down. You can let payments through without checks,
      or block all payments until it recovers. How would you decide?
    expected_concepts:
      - expected fraud losses versus lost sales
      - partial options such as limits on amount or new accounts
      - expected duration of the outage
      - who has authority to accept the risk
      - reviewing transactions afterwards
    rubric:
      excellent: Compares expected fraud loss with lost revenue and customer impact, proposes partial options such as amount limits or allowing known customers, considers outage duration, involves the risk owner and reviews transactions afterwards.
      good: Weighs both risks and considers a middle option.
      weak: Picks one extreme without considering the numbers or partial options.
    followups:
      - What would you decide in advance so this isn't improvised next time?
      - How would duration change your choice?
    common_errors:
      - Treating it as all-or-nothing.
      - Making the call without the risk owner.

  - external_key: problem_solving.tradeoffs_prioritisation.oversubscribed_shared_resource
    competency_key: project_management
    topic: Allocating a scarce shared resource
    difficulty: hard
    text: >-
      A shared resource, such as a test environment or a pooled budget, is badly oversubscribed across six teams,
      and disagreements are escalating. How would you design a way to allocate it?
    expected_concepts:
      - understanding true demand and usage
      - transparent allocation rules tied to priorities
      - scheduling, quotas or reservations
      - reducing demand or expanding supply
      - regular review and an escalation path
    rubric:
      excellent: Measures real demand and usage, sets transparent rules linked to organisational priorities, uses mechanisms like quotas or reservations, looks at reducing demand or adding supply and sets a review and escalation path.
      good: Creates clear rules for allocation.
      weak: Allocates by seniority or first come, first served without looking at priorities.
    followups:
      - How would you handle a team that hoards the resource?
      - When would you argue for more supply instead?
    common_errors:
      - Ignoring idle reservations.
      - Rules that nobody can see.

  - external_key: problem_solving.tradeoffs_prioritisation.public_commitment_at_risk
    competency_key: stakeholder_management
    topic: A public commitment that risks quality
    difficulty: hard
    text: >-
      You realise that something your organisation publicly committed to customers can't be delivered on time
      without serious quality risk. How would you decide what to do and who to involve?
    expected_concepts:
      - confirming the gap and its causes
      - options such as reduced scope, later date or staged delivery
      - escalating early to leaders who own the commitment
      - customer impact of each option
      - clear, timely communication to customers
    rubric:
      excellent: Confirms the gap, prepares options with their customer impact, escalates early to the owners of the commitment, and supports transparent communication to customers rather than shipping something risky.
      good: Escalates and proposes options.
      weak: Ships anyway to keep the date, or hides the problem until it is too late.
    followups:
      - How early would you raise this, and with whom?
      - What would you want customers to hear?
    common_errors:
      - Waiting until the last moment to escalate.
      - Presenting the problem without options.

  - external_key: problem_solving.tradeoffs_prioritisation.consensus_or_decide_this_week
    competency_key: problem_solving
    topic: How much agreement is enough
    difficulty: hard
    text: >-
      A decision affecting several teams has to be made this week, but reaching full agreement would take a month.
      How would you decide how much consensus is enough?
    expected_concepts:
      - who is most affected and must be consulted
      - cost of delaying the decision
      - reversibility of the decision
      - a clear decision owner
      - recording dissent and a review point
    rubric:
      excellent: Consults the most affected people, weighs the cost of delay and reversibility, names a decision owner, decides on time and records dissent with a point to review the decision.
      good: Gets key input and decides on time.
      weak: Waits for full agreement or decides alone without consulting anyone.
    followups:
      - How would you handle a team that strongly disagrees?
      - What would make you extend the deadline?
    common_errors:
      - Treating consensus as unanimity.
      - Leaving it unclear who made the decision.
