# Curated questions: problem solving / analytical reasoning (part 1 of 4).
# Scenario questions about interpreting metric changes, ambiguous data and root-causing KPI moves.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [data_analyst, data_scientist, product_manager, business_analyst]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.analytical_reasoning.dau_drop_first_hour
    competency_key: problem_solving
    topic: First-hour triage of a sudden metric drop
    difficulty: easy
    text: >-
      It's Tuesday morning, and the daily active users chart shows yesterday about fifteen percent below
      its usual level. In the first hour, before any deep analysis, what would you check and in what order?
    expected_concepts:
      - confirm the data is complete and the pipeline ran on time
      - compare against the same weekday in previous weeks
      - check for releases, outages or tracking changes yesterday
      - split by platform, region or app version to localise the drop
      - give stakeholders an early status with what is known and unknown
    rubric:
      excellent: Starts by ruling out data freshness and tracking issues, compares against the right baseline, localises the drop with a few fast cuts and plans an early update to stakeholders.
      good: Checks for data problems and recent releases and slices the data at least one way.
      weak: Jumps straight to a business explanation or a deep model without first checking whether the drop is real.
    followups:
      - What would you tell your manager after that first hour if you still had no answer?
      - Which single breakdown would you look at first, and why that one?
    common_errors:
      - Assuming the drop is real without checking for a late or partial data load.

  - external_key: problem_solving.analytical_reasoning.ctr_falls_to_zero
    competency_key: data_analysis
    topic: Tracking break versus real behaviour change
    difficulty: easy
    text: >-
      The product team tells you that click-through on the home page banner fell to almost zero overnight.
      What would make you suspect a tracking problem rather than a real change in behaviour, and how would
      you confirm it?
    expected_concepts:
      - abrupt step changes to near zero usually point to instrumentation
      - check whether the click event still fires and its name or schema changed
      - compare with downstream metrics that should move with clicks
      - check recent front-end releases or tag manager changes
      - reproduce the click yourself and inspect the raw events
    rubric:
      excellent: Explains why a cliff-shaped drop suggests instrumentation, cross-checks with downstream outcomes such as visits to the banner's landing page, and confirms by inspecting raw events and recent releases.
      good: Suspects tracking and suggests checking the event logs or recent deployments.
      weak: Treats the number as real and starts redesigning the banner.
    followups:
      - If downstream traffic also fell, what would that change in your thinking?
      - How would you stop this kind of silent break from going unnoticed next time?
    common_errors:
      - Not checking a related downstream metric that would expose a logging gap.

  - external_key: problem_solving.analytical_reasoning.weekend_orders_dip
    competency_key: data_analysis
    topic: Weekly seasonality
    difficulty: easy
    text: >-
      A new stakeholder is worried because Saturday's orders came in thirty percent below Friday's. How would
      you work out whether that's a real problem or just the normal weekly rhythm, and how would you show them?
    expected_concepts:
      - compare with the same weekday over several prior weeks
      - day-of-week seasonality as the default explanation to test
      - week-over-week or rolling seven-day views instead of day-to-day
      - a chart with a normal range band to make the pattern visible
    rubric:
      excellent: Compares Saturday against previous Saturdays, explains weekly seasonality clearly, and proposes a lasting view such as same-day-last-week or a rolling average with a normal range.
      good: Recognises a weekly pattern and suggests comparing to previous Saturdays.
      weak: Accepts the day-to-day comparison at face value or dismisses the concern without checking.
    followups:
      - How would you decide what counts as an unusual Saturday?
      - What if this Saturday was lower than every Saturday in the last two months?
    common_errors:
      - Comparing consecutive days for a business with a strong weekly cycle.

  - external_key: problem_solving.analytical_reasoning.tickets_per_customer_improves
    competency_key: problem_solving
    topic: Ratio metric moved by its denominator
    difficulty: easy
    text: >-
      Your support team's tickets per thousand customers improved sharply this month. Before anyone celebrates,
      how would you check whether it's genuinely good news?
    expected_concepts:
      - look at numerator and denominator separately
      - check whether the customer count grew from a bulk import, migration or definition change
      - check whether ticket logging or channels changed
      - compare against active rather than total customers
    rubric:
      excellent: Separates the numerator and denominator, names concrete ways each could move for the wrong reason, and proposes a more robust denominator such as active customers.
      good: Checks whether ticket volume actually fell or the customer base grew.
      weak: Takes the improvement at face value or only looks at the ratio itself.
    followups:
      - What would you conclude if ticket volume was flat but the ratio still improved?
      - How would you choose the right denominator for this metric?
    common_errors:
      - Analysing the ratio without ever looking at the raw counts behind it.

  - external_key: problem_solving.analytical_reasoning.aov_up_revenue_flat
    competency_key: data_analysis
    topic: Average order value versus revenue
    difficulty: easy
    text: >-
      Average order value went up ten percent last week, but total revenue barely moved. What could explain
      that, and how would you find out which explanation is right?
    expected_concepts:
      - revenue equals orders times average order value
      - fewer orders offsetting larger baskets
      - small orders disappearing, for example after a minimum order or shipping threshold change
      - mix shift toward expensive products or customer segments
      - check the order count and the distribution of order sizes
    rubric:
      excellent: Decomposes revenue into order count and order value, lists specific mechanisms such as lost small orders or a threshold change, and checks the order size distribution to tell them apart.
      good: Notes that order count must have fallen and suggests checking it.
      weak: Cannot connect the two numbers or assumes one of them is wrong.
    followups:
      - If the drop was entirely in small orders, what would you look at next?
      - Is a higher average order value with flat revenue good or bad for the business?
    common_errors:
      - Looking only at the averages and not at the distribution of order sizes.

  - external_key: problem_solving.analytical_reasoning.vague_why_are_we_down
    competency_key: problem_solving
    topic: Scoping an ambiguous analytics request
    difficulty: easy
    text: >-
      Your manager forwards a one-line email from the head of sales that just says, why are we down this
      month? How would you turn that into a question you can actually answer?
    expected_concepts:
      - clarify which metric is down and against what baseline
      - clarify the decision or action the answer should support
      - agree the time window and any segments of interest
      - confirm the deadline and the level of depth needed
      - restate the question back before starting
    rubric:
      excellent: Pins down the metric, baseline, time window and the decision behind the request, and confirms a restated question and deadline with the requester before analysing.
      good: Asks which metric and compared to what before starting.
      weak: Starts pulling data immediately without clarifying what down means.
    followups:
      - What if the head of sales is too busy to answer your questions?
      - How would you handle it if the metric turned out not to be down at all?
    common_errors:
      - Answering a different question from the one the requester actually had.

  - external_key: problem_solving.analytical_reasoning.b2b_revenue_jump
    competency_key: data_analysis
    topic: Concentration and one-off effects
    difficulty: easy
    text: >-
      Monthly revenue for a B2B product jumped twenty-five percent and the team is excited. What would you look
      at to understand whether this is a lasting trend or a one-off?
    expected_concepts:
      - check concentration in a few large accounts
      - one-off items such as annual prepayments, back-billing or catch-up invoices
      - recurring versus non-recurring revenue split
      - breadth of growth across accounts and segments
      - compare with leading indicators such as pipeline or usage
    rubric:
      excellent: Checks whether a handful of accounts or one-off billing events drive the jump, separates recurring from non-recurring revenue and looks at how broadly the growth is spread.
      good: Checks the largest contributors and asks whether the revenue will recur.
      weak: Extrapolates the jump into a trend without looking underneath it.
    followups:
      - How would you present this to the team without killing the good news unfairly?
      - Which leading indicator would you watch to know if the growth will continue?
    common_errors:
      - Ignoring billing timing effects such as annual contracts landing in one month.

  - external_key: problem_solving.analytical_reasoning.query_change_doubles_count
    competency_key: data_analysis
    topic: Deciding which of two query results is right
    difficulty: easy
    text: >-
      After a colleague rewrote the query behind a dashboard, the number of new accounts per week suddenly
      doubled. How would you work out whether the new number or the old one is correct?
    expected_concepts:
      - diff the two queries and their definitions
      - check join fan-out creating duplicate rows
      - count distinct keys and spot-check individual records
      - reconcile against an independent source of truth
      - agree the intended definition with the metric owner
    rubric:
      excellent: Compares definitions and logic, tests for duplicate rows from joins, spot-checks records and reconciles both numbers against an independent source before agreeing the definition with the owner.
      good: Looks for duplicates or a filter difference and checks a sample of records.
      weak: Picks whichever number looks more plausible without investigating.
    followups:
      - What would you do if neither number matched the billing system?
      - How would you prevent silent definition changes like this in future?
    common_errors:
      - Not checking for duplicates introduced by a one-to-many join.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.analytical_reasoning.revenue_per_user_decomposition
    competency_key: problem_solving
    topic: Decomposing a top-line metric
    difficulty: medium
    text: >-
      Revenue per user dropped eight percent this quarter. How would you break that number down to find which
      part of the business is driving the decline?
    expected_concepts:
      - split into a driver tree such as paying share times revenue per payer
      - separate price, quantity and mix effects
      - check whether the user denominator changed, for example a surge of new free users
      - segment by plan, channel, region and cohort
      - quantify each driver's contribution to the total change
    rubric:
      excellent: Builds an explicit driver tree, separates denominator effects from real spending changes, quantifies each component's contribution and narrows to the segments that explain most of the drop.
      good: Splits the metric into a couple of components and segments the data sensibly.
      weak: Lists possible causes without a structured breakdown or any way to size them.
    followups:
      - How would you show the contribution of each driver in a single chart?
      - What if the decline is spread evenly across every segment?
    common_errors:
      - Forgetting that growth in low-value new users alone can pull an average down.

  - external_key: problem_solving.analytical_reasoning.mobile_only_conversion_drop
    competency_key: problem_solving
    topic: Platform-specific drop
    difficulty: medium
    text: >-
      Conversion on mobile has been falling for four days, while desktop is flat. Walk me through how you'd
      narrow down the cause.
    expected_concepts:
      - split by iOS and Android and by app version
      - check recent app releases and operating system updates
      - separate app from mobile web
      - find the funnel step where the drop happens
      - check error logs, crash rates and payment method availability
    rubric:
      excellent: Narrows systematically by operating system, app version and funnel step, ties the timing to releases or external updates, and confirms with error or crash data before proposing a fix.
      good: Splits by platform or version and checks recent releases.
      weak: Offers generic causes without a plan for isolating the one that applies.
    followups:
      - The drop is only on one app version that's rolling out gradually. What do you recommend?
      - How would you estimate the revenue impact while the investigation continues?
    common_errors:
      - Not checking whether the decline is concentrated in a single release.

  - external_key: problem_solving.analytical_reasoning.year_over_year_calendar_shift
    competency_key: data_analysis
    topic: Calendar effects in year-over-year comparisons
    difficulty: medium
    text: >-
      Sales for the second week of April are well below the same week last year, and finance is alarmed. What
      calendar effects would you rule out, and how would you make a fair comparison?
    expected_concepts:
      - public holidays that move between years
      - different weekday composition of the compared periods
      - promotions or events that fell in different weeks
      - compare aligned weeks or a wider window such as month-to-date
      - adjust for calendar effects before concluding
    rubric:
      excellent: Names moving holidays, weekday alignment and shifted promotions, proposes comparing aligned or wider periods, and only then judges whether a real decline remains.
      good: Recognises that holidays or promotions may have shifted and suggests a wider comparison.
      weak: Treats the raw week-on-week-last-year gap as the true change.
    followups:
      - How would you build a comparison that finance could use every week without this problem?
      - What if the gap persists after you align the calendars?
    common_errors:
      - Comparing calendar dates instead of equivalent trading days.

  - external_key: problem_solving.analytical_reasoning.monday_revenue_undercount
    competency_key: data_analysis
    topic: Late-arriving data
    difficulty: medium
    text: >-
      Every Monday, the dashboard shows last week's revenue lower than it ends up being by Thursday, and
      leadership keeps reacting to the Monday figure. How would you diagnose this and fix it?
    expected_concepts:
      - late-arriving transactions, refunds or partner feeds
      - measure how much each day's figure changes over the following days
      - label figures as provisional or show completeness
      - adjust the reporting cut-off or nowcast the expected final value
      - agree with leadership which figure is used for decisions
    rubric:
      excellent: Quantifies the restatement pattern by data source, explains the cause, and proposes both a technical fix and a communication fix such as provisional labels or a completeness-adjusted estimate.
      good: Identifies late data as the cause and suggests marking recent days as incomplete.
      weak: Blames the dashboard tool or suggests manual corrections each week.
    followups:
      - How would you estimate the final number on Monday with reasonable accuracy?
      - Which teams would you need to involve to shorten the delay?
    common_errors:
      - Fixing the numbers once without addressing why they keep changing.

  - external_key: problem_solving.analytical_reasoning.tv_campaign_contribution
    competency_key: statistics_experimentation
    topic: Estimating campaign lift without an experiment
    difficulty: medium
    text: >-
      Marketing ran a two-week TV campaign, and site traffic went up while it was on air. They want to claim
      every extra sign-up in that period. How would you estimate how much the campaign actually contributed?
    expected_concepts:
      - build a baseline from pre-campaign trend and seasonality
      - compare regions that did and did not see the campaign
      - account for other concurrent changes such as promotions
      - look at time-of-airing spikes in direct and search traffic
      - report a range rather than a single number
    rubric:
      excellent: Builds a counterfactual baseline, uses geographic or timing variation to isolate the effect, accounts for concurrent changes and reports a range with its assumptions.
      good: Compares against a pre-campaign baseline and mentions other factors that could inflate the number.
      weak: Accepts all extra sign-ups as campaign-driven or dismisses the campaign without analysis.
    followups:
      - How would you design the next campaign so its effect is easier to measure?
      - Some sign-ups come weeks later. How would you account for that?
    common_errors:
      - Ignoring seasonality or other activity that coincided with the campaign.

  - external_key: problem_solving.analytical_reasoning.nps_after_channel_change
    competency_key: data_analysis
    topic: Survey method changes and response bias
    difficulty: medium
    text: >-
      Your NPS jumped twelve points right after the survey moved from an email to an in-app prompt. How would
      you interpret that change?
    expected_concepts:
      - the respondent population changed, favouring active users
      - response rate and sample composition before and after
      - timing of the prompt relative to a good or bad experience
      - compare like-for-like segments across both methods
      - treat it as a break in the series rather than a trend
    rubric:
      excellent: Explains how the new channel changes who responds and when, compares response rates and segment composition, and recommends treating the jump as a method break with like-for-like comparisons.
      good: Recognises that a change in survey method can shift the score and suggests checking who responded.
      weak: Reports the jump as a real improvement in customer sentiment.
    followups:
      - How would you keep the time series usable after this change?
      - What would you need to see to believe sentiment really improved?
    common_errors:
      - Ignoring that in-app prompts mostly reach engaged users.

  - external_key: problem_solving.analytical_reasoning.delivery_time_average_vs_complaints
    competency_key: data_analysis
    topic: Averages hiding the distribution
    difficulty: medium
    text: >-
      Average delivery time improved from four days to three and a half, yet complaints about late deliveries
      went up. How can both be true, and what would you look at?
    expected_concepts:
      - the average can improve while the tail gets worse
      - look at percentiles and the share beyond the promised date
      - lateness is relative to the promise, which may have changed
      - mix shift across regions or carriers
      - check whether complaint volume tracks order volume
    rubric:
      excellent: Explains how a better mean can hide a worse tail, examines percentiles and lateness against the promise, and checks for mix or promise changes and complaint volume relative to orders.
      good: Suggests looking at the distribution or percentiles instead of the mean.
      weak: Assumes one of the two numbers must be wrong.
    followups:
      - Which delivery metric would you put on the dashboard instead?
      - How would you find which carriers or regions drive the late tail?
    common_errors:
      - Reporting only averages for a metric where customers experience the extremes.

  - external_key: problem_solving.analytical_reasoning.sessions_up_conversions_flat
    competency_key: problem_solving
    topic: Unexplained traffic growth
    difficulty: medium
    text: >-
      Website sessions are up forty percent this month, but sign-ups and purchases are flat. How would you
      figure out what's behind the extra traffic?
    expected_concepts:
      - break traffic down by source, landing page and geography
      - check for bots, crawlers or monitoring traffic
      - look at engagement signals such as bounce rate and session length
      - check tracking changes such as duplicate tags or session timeout changes
      - check for low-intent campaigns or viral referrals
    rubric:
      excellent: Segments the new traffic by source and behaviour, tests specific explanations including bots, tracking changes and low-intent campaigns, and confirms which one fits before recommending action.
      good: Checks traffic sources and considers bots or low-quality traffic.
      weak: Celebrates the traffic or blames the conversion funnel without examining the new visitors.
    followups:
      - How would you clean bot traffic out of historical reports?
      - If it's genuine but low-intent traffic, does that matter to the business?
    common_errors:
      - Not considering that a tracking change can inflate session counts.

  - external_key: problem_solving.analytical_reasoning.prioritise_ten_hypotheses
    competency_key: problem_solving
    topic: Prioritising hypotheses under time pressure
    difficulty: medium
    text: >-
      You've been asked to explain a drop in repeat purchases, and you've come up with ten possible causes.
      You have two days. How do you decide which ones to investigate first?
    expected_concepts:
      - rank by likelihood, size of possible impact and cost to test
      - use timing to eliminate causes that don't line up with the drop
      - run cheap tests that rule out several causes at once
      - check data and tracking issues early
      - share interim findings and adjust the plan
    rubric:
      excellent: Prioritises on likelihood, impact and test cost, uses timing and quick cuts to eliminate several hypotheses at once, and plans checkpoints to share findings and refocus.
      good: Prioritises by likelihood or impact and starts with quick checks.
      weak: Works through the list in arbitrary order or tries to analyse everything in depth.
    followups:
      - What would you deliver at the end of day one?
      - How do you know when to stop investigating and report?
    common_errors:
      - Spending the time on the most interesting hypothesis rather than the most likely one.

  - external_key: problem_solving.analytical_reasoning.tenure_spend_survivorship
    competency_key: data_analysis
    topic: Survivorship bias
    difficulty: medium
    text: >-
      An analysis shows that customers who've been with you for three years spend twice as much as new
      customers, and someone concludes that customers spend more the longer they stay. How would you evaluate
      that conclusion?
    expected_concepts:
      - survivorship bias, since low spenders churn out
      - follow the same cohorts over time instead of comparing different groups
      - early cohorts may differ in acquisition channel or product
      - compare within-customer spend trajectories
    rubric:
      excellent: Identifies survivorship bias and cohort differences, and proposes tracking the same customers over time to separate genuine spend growth from low spenders leaving.
      good: Notices that the long-tenure group is not comparable with new customers.
      weak: Accepts the conclusion or offers only general caution about correlation.
    followups:
      - What would the cohort chart look like if survivorship explained everything?
      - How would this change a lifetime value estimate?
    common_errors:
      - Comparing tenure groups at one point in time and reading it as change over time.

  - external_key: problem_solving.analytical_reasoning.coaching_worst_stores
    competency_key: statistics_experimentation
    topic: Regression to the mean
    difficulty: medium
    text: >-
      Last quarter you picked the ten worst-performing stores and gave them extra coaching. This quarter, eight
      of them improved, and the program owner wants to roll it out everywhere. How would you assess whether
      the coaching actually worked?
    expected_concepts:
      - regression to the mean after selecting extreme performers
      - compare with similar low performers who were not coached
      - look at the stores' longer history and normal variability
      - propose a randomised or staggered rollout
      - account for other changes in the coached stores
    rubric:
      excellent: Explains regression to the mean clearly, proposes a comparison group of similar uncoached stores and a randomised or staggered rollout to get a credible estimate.
      good: Points out that the improvement could happen anyway and asks for a comparison group.
      weak: Accepts the improvement as evidence the coaching worked.
    followups:
      - How would you explain regression to the mean to the program owner without jargon?
      - If you can only coach twenty more stores, how would you pick them?
    common_errors:
      - Not recognising that selecting the worst performers guarantees some apparent improvement.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.analytical_reasoning.three_causes_one_month
    competency_key: problem_solving
    topic: Attributing a drop to overlapping causes
    difficulty: hard
    text: >-
      Revenue fell twelve percent last month. When you dig in, you find a price increase, a two-day payment
      provider outage and a competitor promotion all happened in the same window. How would you estimate how
      much each one contributed?
    expected_concepts:
      - estimate the outage effect from the affected days and recovery
      - use segments exposed and not exposed to each factor
      - price change effect via elasticity or customers not yet repriced
      - competitor effect via overlapping markets or switching signals
      - check that the pieces roughly add up and state the residual
      - give ranges and confidence in each estimate
    rubric:
      excellent: Uses timing and exposure differences to isolate each cause, sizes them with explicit assumptions, reconciles the parts to the total including an unexplained residual and communicates ranges.
      good: Separates the outage cleanly and has a reasonable approach for at least one other factor.
      weak: Assigns contributions by intuition or says it cannot be separated.
    followups:
      - Leadership wants a single number per cause. How would you present the uncertainty?
      - What data would you wish you had collected before these events?
    common_errors:
      - Ignoring interactions, such as lost customers during the outage being picked up by the competitor.

  - external_key: problem_solving.analytical_reasoning.policy_change_no_control
    competency_key: statistics_experimentation
    topic: Causal estimate with no control group
    difficulty: hard
    text: >-
      A new city regulation in one of your markets came into effect at the same time bookings there fell. There
      was no experiment and no control group. How would you build a credible estimate of the regulation's
      effect?
    expected_concepts:
      - difference-in-differences against comparable cities
      - synthetic control built from a weighted mix of other markets
      - check that pre-period trends were parallel
      - placebo tests on other dates or markets
      - account for concurrent local events
      - report the estimate with uncertainty and assumptions
    rubric:
      excellent: Proposes difference-in-differences or a synthetic control, validates parallel pre-trends and runs placebo checks, and states assumptions and uncertainty plainly.
      good: Compares against similar cities over the same period and checks the trends beforehand.
      weak: Reads the before-and-after drop in that city as the full effect.
    followups:
      - How would you choose the comparison cities?
      - What would make you distrust your own estimate?
    common_errors:
      - Skipping the check that comparison markets moved in parallel before the change.

  - external_key: problem_solving.analytical_reasoning.forecast_miss_explanation
    competency_key: problem_solving
    topic: Explaining a forecast miss
    difficulty: hard
    text: >-
      Your team's revenue forecast for the quarter missed by fifteen percent, and the CFO wants to know why
      and whether to trust next quarter's forecast. How would you structure that analysis?
    expected_concepts:
      - variance analysis split by driver such as volume, price and mix
      - separate wrong assumptions from unforeseeable events
      - check whether the model would have been right with correct inputs
      - backtest past forecast accuracy and bias
      - recommend changes and express next forecast as a range
    rubric:
      excellent: Breaks the miss into drivers, separates input errors from model errors and one-off events, backtests historical accuracy and returns a clear recommendation with a ranged forecast.
      good: Breaks the variance into a few drivers and identifies the biggest assumption that was wrong.
      weak: Gives a narrative explanation without quantifying contributions.
    followups:
      - If the forecast has been consistently optimistic, what would you change?
      - How would you communicate uncertainty to the CFO without sounding evasive?
    common_errors:
      - Blaming external events without checking whether the forecast was biased beforehand.

  - external_key: problem_solving.analytical_reasoning.marketplace_orders_down_supply_up
    competency_key: problem_solving
    topic: Two-sided marketplace dynamics
    difficulty: hard
    text: >-
      On a food delivery marketplace, orders are down five percent while both the number of active restaurants
      and the number of app visits are up. How would you reason about what's happening?
    expected_concepts:
      - visit-to-order conversion fell, so look for friction in the funnel
      - delivery times, fees or availability at peak hours
      - courier supply as a separate constraint from restaurant supply
      - new restaurants may be low-demand or in new areas
      - segment by geography, time of day and customer cohort
    rubric:
      excellent: Recognises that conversion fell, considers all sides of the marketplace including couriers, tests price, delivery time and availability explanations by segment and time of day, and narrows to the binding constraint.
      good: Identifies the conversion drop and suggests a couple of plausible marketplace causes.
      weak: Treats it as a single-sided problem or relies on vague demand explanations.
    followups:
      - How would you tell whether courier shortages are to blame?
      - What metric would you add to catch this earlier?
    common_errors:
      - Forgetting the third side of the marketplace, delivery capacity.

  - external_key: problem_solving.analytical_reasoning.cheaper_tier_cannibalisation
    competency_key: product_sense
    topic: Cannibalisation by a new tier
    difficulty: hard
    text: >-
      Your company launched a cheaper subscription tier, and three months later total subscribers are up but
      revenue is flat. How would you work out whether the new tier is growing the business or eating into the
      premium tier?
    expected_concepts:
      - track downgrades from premium to the new tier
      - estimate how many new-tier customers would otherwise have bought premium
      - compare acquisition and conversion trends before and after launch
      - look at retention and upgrade paths of the new tier
      - long-term revenue and margin, not just three months
    rubric:
      excellent: Separates downgrades and diverted purchases from net-new customers, uses pre-launch trends or exposure differences to estimate the counterfactual, and considers retention and upgrades over a longer horizon.
      good: Looks at downgrades and new versus existing customers on the cheaper tier.
      weak: Judges success by subscriber count alone or concludes cannibalisation from flat revenue alone.
    followups:
      - What would you recommend if you found heavy cannibalisation but much better retention?
      - How would you design the next pricing launch so it's easier to evaluate?
    common_errors:
      - Ignoring the customers who would have chosen premium had the cheaper tier not existed.

  - external_key: problem_solving.analytical_reasoning.referral_ltv_censoring
    competency_key: data_analysis
    topic: Immature cohorts and lifetime value claims
    difficulty: hard
    text: >-
      A team claims that customers from a new referral program have much higher lifetime value than everyone
      else, but the program only started four months ago. How would you evaluate that claim?
    expected_concepts:
      - lifetime value cannot be observed yet for a four-month-old cohort
      - compare like-for-like on the first four months only
      - referred customers may differ in profile from other channels
      - incentives might inflate early activity
      - project with retention curves and state the uncertainty
    rubric:
      excellent: Points out that the cohort is immature, compares channels on equal time windows, considers selection and incentive effects, and projects lifetime value with explicit uncertainty.
      good: Notes the short history and suggests comparing the same early period for other channels.
      weak: Accepts or rejects the claim without addressing the time window problem.
    followups:
      - What early signals would you trust as predictors of long-term value?
      - How would you make the comparison fair if referred customers are a different kind of customer?
    common_errors:
      - Comparing a young cohort's projected value with older cohorts' actual value.
