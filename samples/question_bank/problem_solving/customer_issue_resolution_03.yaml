# Curated questions: problem solving — resolving complex customer-reported technical issues with
# incomplete information (part 3 of 4): first steps on thin tickets, baselines and elimination,
# reconstructing user actions, rollouts and configuration, security-sensitive and regional reports.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [support_engineer, qa, fullstack]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.customer_issue_resolution.first_thirty_minutes
    competency_key: problem_solving
    topic: Planning the first half hour on a thin ticket
    difficulty: easy
    text: >-
      You pick up an urgent ticket with a two-line description and no attachments. Walk me through how you'd
      spend the first thirty minutes on it.
    expected_concepts:
      - read the ticket and account history for context
      - acknowledge the customer and set expectations
      - check for known issues, incidents and recent releases
      - form initial hypotheses and decide what evidence would test them
      - ask targeted questions and start checks that don't need the customer
    rubric:
      excellent: Gives a time-boxed plan that combines quick acknowledgement, internal checks for incidents and history, early hypotheses and a focused request to the customer.
      good: Checks history and known issues and asks the customer relevant questions.
      weak: Waits for the customer to provide more detail before doing anything.
    followups:
      - What would make you escalate within those thirty minutes?
      - What would your first message to the customer say?
    common_errors:
      - Doing nothing until the customer replies.

  - external_key: problem_solving.customer_issue_resolution.button_does_nothing
    competency_key: debugging
    topic: A button that silently does nothing
    difficulty: easy
    text: >-
      A customer says that when they click Save on one particular page, nothing happens at all: no error, no
      message. How would you work out why?
    expected_concepts:
      - check the browser console for script errors
      - check the network tab for whether a request is sent and its response
      - consider client-side validation blocking silently
      - consider permissions or disabled states in the UI
      - reproduce with the same record and browser
    rubric:
      excellent: Uses the console and network tab to decide whether the click fails before, during or after the request, and reproduces with the same record and browser.
      good: Checks the console and network requests.
      weak: Asks the customer to try again later or restart their computer.
    followups:
      - What would it mean if no network request appears at all?
      - How would you guide a non-technical customer to open the console?
    common_errors:
      - Not checking whether any request was sent.

  - external_key: problem_solving.customer_issue_resolution.user_error_or_bug
    competency_key: technical_support
    topic: User error, configuration or product defect
    difficulty: easy
    text: >-
      How do you tell whether a customer's problem comes from how they're using the product, from their
      configuration or from a genuine defect, without making them feel blamed?
    expected_concepts:
      - reproduce with the same steps and with default configuration
      - compare their configuration with a known working setup
      - check documentation for the intended usage
      - frame findings around the product and next steps rather than the person
      - consider whether confusing design contributed and report it
    rubric:
      excellent: Describes a clear method to separate usage, configuration and defects with evidence, words findings neutrally, and feeds confusing design back to product.
      good: Reproduces and compares configuration, and explains findings politely.
      weak: Assumes user error by default or treats every report as a bug.
    followups:
      - How would you word it when the cause is a misconfiguration they made?
      - When does a common user mistake become a product problem?
    common_errors:
      - Never reporting recurring user confusion to the product team.

  - external_key: problem_solving.customer_issue_resolution.missing_browser_os_combo
    competency_key: testing
    topic: Reproducing on an environment you don't have
    difficulty: easy
    text: >-
      A customer reports a bug that only happens on a browser and operating system combination your team
      doesn't have. How would you go about reproducing and verifying it?
    expected_concepts:
      - use device or browser cloud services or virtual machines
      - check usage data for how many users run that combination
      - collect console output and details from the customer
      - reproduce the closest available setup and compare
      - verify the fix on the exact combination before closing
    rubric:
      excellent: Gets access to the exact environment through cloud services or virtual machines, uses customer diagnostics meanwhile, sizes the impact, and verifies the fix on that environment.
      good: Uses an emulator or cloud service to reproduce.
      weak: Declares the combination unsupported without checking how many users rely on it.
    followups:
      - How would you decide whether that combination belongs in regular testing?
      - What could you learn from the customer while waiting for access?
    common_errors:
      - Verifying the fix only on a similar but different environment.

  - external_key: problem_solving.customer_issue_resolution.confirm_understanding_first
    competency_key: customer_communication
    topic: Confirming the problem before investigating
    difficulty: easy
    text: >-
      How do you make sure you've understood a customer's problem correctly before you start investigating?
      Give me an example where getting this right, or wrong, made a difference.
    expected_concepts:
      - restate the problem in your own words including expected and actual behaviour
      - confirm scope, impact and urgency
      - confirm what success looks like for the customer
      - capture the confirmed statement in the ticket
    rubric:
      excellent: Describes a deliberate restating step covering expected versus actual, impact and success criteria, with a concrete example of its effect.
      good: Restates the problem and asks the customer to confirm.
      weak: Starts investigating from their first reading of the ticket.
    followups:
      - What did the misunderstanding cost in your example?
      - How do you do this without slowing down urgent tickets?
    common_errors:
      - Not defining what a successful resolution looks like.

  - external_key: problem_solving.customer_issue_resolution.fresh_account_baseline
    competency_key: problem_solving
    topic: Using a clean setup as a baseline
    difficulty: easy
    text: >-
      How would you use a known working setup, such as a fresh test account, to work out whether a customer's
      problem comes from their particular configuration?
    expected_concepts:
      - try the same steps on a clean account with default settings
      - if it works, add the customer's settings gradually until it breaks
      - if it fails, it's likely a product defect independent of configuration
      - match product version and plan between the two
      - document the minimal configuration that triggers it
    rubric:
      excellent: Uses the clean account as a control, explains how each outcome changes the next step, and narrows to the minimal triggering configuration.
      good: Compares behaviour on a clean account and the customer's.
      weak: Only investigates within the customer's account.
    followups:
      - What if the clean account behaves differently for reasons unrelated to configuration?
      - How would you copy their settings without copying their data?
    common_errors:
      - Comparing accounts on different plans or versions without noticing.

  - external_key: problem_solving.customer_issue_resolution.search_misses_record
    competency_key: debugging
    topic: Search can't find a record that exists
    difficulty: easy
    text: >-
      A customer says search can't find a record they can open directly from a link. How would you investigate
      why it's missing from the results?
    expected_concepts:
      - check whether the record is in the search index
      - check indexing lag or failed indexing jobs
      - check search permissions and filters
      - check how the search terms are tokenised or matched
      - try exact and partial matches to narrow the cause
    rubric:
      excellent: Separates indexing, permission and matching causes and tests each with specific checks and queries.
      good: Checks whether the record is indexed and whether filters exclude it.
      weak: Re-indexes everything without understanding why this record was missing.
    followups:
      - How would you find other records missing from the index?
      - What if it's indexed but still doesn't show up?
    common_errors:
      - Assuming search and the database always agree.

  - external_key: problem_solving.customer_issue_resolution.reopened_its_back
    competency_key: technical_support
    topic: Same issue or a new one
    difficulty: easy
    text: >-
      A customer reopens a ticket you resolved last month, saying "it's back". How do you determine whether
      it's the same issue returning or a different one with similar symptoms?
    expected_concepts:
      - compare current evidence with the original root cause and diagnostics
      - check whether the original fix is still in place
      - check what changed since, such as releases or configuration
      - don't assume the original diagnosis applies
      - link or split tickets accordingly
    rubric:
      excellent: Compares fresh evidence against the documented root cause, verifies the original fix is still in effect, and splits into a new ticket when the cause differs.
      good: Reviews the original ticket and checks if the fix still holds.
      weak: Reapplies the old fix without checking whether the cause is the same.
    followups:
      - What if the original ticket's notes are too thin to compare?
      - How would you check whether a release undid the fix?
    common_errors:
      - Applying the previous fix without new diagnosis.

  # ------------------------------------------------------------------ medium
  - external_key: problem_solving.customer_issue_resolution.customer_specific_500s
    competency_key: debugging
    topic: One customer's errors hidden in a low overall rate
    difficulty: medium
    text: >-
      A customer's integration gets occasional server errors from our API, but our dashboards show a very low
      error rate overall. How would you investigate their specific errors?
    expected_concepts:
      - filter logs and metrics by their account, credentials or client
      - find the specific endpoints, payloads and times of their errors
      - look for patterns such as request size, specific records or concurrency
      - reproduce with similar requests
      - explain that aggregate metrics can hide a single customer's problems
    rubric:
      excellent: Breaks down errors by customer and request characteristics, finds the pattern, reproduces it, and recognises aggregate metrics can hide concentrated failures.
      good: Filters logs for the customer's errors and looks for a pattern.
      weak: Tells the customer the error rate is low so the problem must be on their side.
    followups:
      - What request characteristics would you compare first?
      - How would you change monitoring so this is visible next time?
    common_errors:
      - Dismissing the report because overall metrics look fine.

  - external_key: problem_solving.customer_issue_resolution.forty_custom_settings
    competency_key: problem_solving
    topic: Isolating one setting among many
    difficulty: medium
    text: >-
      A customer has about forty custom settings enabled, and a bug only shows up in their account. How would
      you find which setting, or combination of settings, is responsible?
    expected_concepts:
      - copy the settings to a test account and confirm the bug reproduces there
      - bisect by toggling halves of the settings
      - consider interactions between settings
      - prioritise recently changed or rarely used settings
      - confirm by toggling the suspected setting alone
    rubric:
      excellent: Reproduces in a test account, bisects settings efficiently, accounts for interactions between settings, and confirms the culprit in isolation.
      good: Toggles settings in a test account to find the culprit.
      weak: Toggles settings one at a time in the customer's live account.
    followups:
      - What if the bug only appears when two settings are both on?
      - Why not do this in their account directly?
    common_errors:
      - Experimenting in the customer's production account.

  - external_key: problem_solving.customer_issue_resolution.representative_test_data
    competency_key: testing
    topic: Test data that resembles the customer's
    difficulty: medium
    text: >-
      A customer bug depends on the shape of their data, and you're not allowed to use their real data in
      testing. How would you build test data that's representative enough to reproduce it and verify the fix?
    expected_concepts:
      - capture characteristics such as sizes, distributions, relationships and unusual values
      - generate synthetic data with those characteristics
      - include edge cases suggested by the bug
      - confirm the synthetic data reproduces the failure
      - keep the data set reusable for regression tests
    rubric:
      excellent: Describes how to capture data characteristics without values, generate matching synthetic data, confirm it reproduces the failure, and reuse it in regression testing.
      good: Builds synthetic data covering the relevant edge cases.
      weak: Uses generic sample data and assumes the bug is fixed if it passes.
    followups:
      - How would you know which characteristics matter?
      - Where would you keep this data so it's maintained?
    common_errors:
      - Verifying the fix with data that never reproduced the bug.

  - external_key: problem_solving.customer_issue_resolution.read_only_role_deleted
    competency_key: debugging
    topic: The UI and the API disagree on permissions
    difficulty: medium
    text: >-
      A customer says a user with a read-only role managed to delete a record, even though the delete button
      doesn't appear for that role. How would you investigate?
    expected_concepts:
      - check audit logs for who deleted it and through which channel
      - check whether the API enforces the same permission as the UI
      - consider integrations, API keys or shared accounts acting on the user's behalf
      - check whether the role changed around that time
      - treat it as a potential security issue and escalate
    rubric:
      excellent: Uses audit logs to establish what happened, checks server-side enforcement separately from the UI, considers other channels and role changes, and escalates as a possible security issue.
      good: Checks audit logs and the API's permission checks.
      weak: Assumes the user had higher permissions and closes it.
    followups:
      - How would you test whether the API enforces the role?
      - Who would you involve if it is a permission gap?
    common_errors:
      - Trusting the UI as proof of what a role is allowed to do.

  - external_key: problem_solving.customer_issue_resolution.audit_trail_reconstruction
    competency_key: technical_support
    topic: Reconstructing what the user actually did
    difficulty: medium
    text: >-
      A customer can't remember exactly what they did before things went wrong. How would you use audit
      trails, event history and logs to reconstruct the sequence of actions?
    expected_concepts:
      - pull events for that user and record around the time
      - merge sources into one ordered timeline
      - account for time zones and clock differences between sources
      - identify the action immediately before the failure
      - confirm the reconstruction with the customer and reproduce it
    rubric:
      excellent: Builds a single ordered timeline from several sources, handles time alignment, pinpoints the triggering action and confirms it by reproduction.
      good: Uses audit history to find the actions before the failure.
      weak: Relies only on the customer's memory.
    followups:
      - What if some actions aren't captured in any log?
      - How would you present the timeline back to the customer?
    common_errors:
      - Mixing time zones and getting the order of events wrong.

  - external_key: problem_solving.customer_issue_resolution.gradual_rollout_inconsistency
    competency_key: problem_solving
    topic: Inconsistent behaviour during a gradual rollout
    difficulty: medium
    text: >-
      During a gradual rollout of a new feature, a customer reports that some of their users see one behaviour
      and others see a different one, and they think it's a bug. How would you work out what's happening and
      respond?
    expected_concepts:
      - check feature flag assignment for their users
      - confirm whether the inconsistency matches the rollout
      - check for genuine bugs within either variant
      - decide with product whether to align their whole account
      - explain the situation to the customer
    rubric:
      excellent: Confirms flag assignment per user, distinguishes rollout-driven differences from defects, and works with product on a consistent experience for the account while explaining it clearly.
      good: Checks flag status and explains the rollout to the customer.
      weak: Investigates it as a bug without checking rollout state.
    followups:
      - When would you ask to move the whole account onto one variant?
      - How could rollouts be designed to avoid this complaint?
    common_errors:
      - Not checking feature flags before debugging code.

  - external_key: problem_solving.customer_issue_resolution.workaround_with_manual_risk
    competency_key: customer_communication
    topic: Offering a workaround that carries risk
    difficulty: medium
    text: >-
      The only workaround you can offer while a fix is built involves several manual steps that could cause
      data errors if done wrong. How would you present it to the customer?
    expected_concepts:
      - explain why the workaround is needed and how long it will be needed
      - give precise step-by-step instructions with checks after each step
      - be clear about the risks and how to spot mistakes
      - offer to walk through it with them the first time
      - let them choose whether to use it or wait
    rubric:
      excellent: Presents the workaround with clear purpose, precise steps, built-in checks, explicit risks and support, and leaves the decision with the customer.
      good: Gives clear steps and explains the risks.
      weak: Sends the steps without mentioning risks or how to verify them.
    followups:
      - How would you know whether they made mistakes?
      - When would you advise them not to use the workaround?
    common_errors:
      - Not explaining how to detect an error in the manual steps.

  - external_key: problem_solving.customer_issue_resolution.sluggish_after_hours_open
    competency_key: debugging
    topic: A web app slowing down in long sessions
    difficulty: medium
    text: >-
      A customer's operations team keeps our web app open all day, and they say it gets sluggish after a few
      hours until they reload the page. How would you investigate?
    expected_concepts:
      - reproduce a long session with their typical usage
      - use browser memory and performance tools to look for growth
      - check for accumulating listeners, timers, polling or cached data
      - compare with a fresh tab at the same point
      - identify which features they use heavily
    rubric:
      excellent: Reproduces a long-running session, uses memory profiling to show growth, and narrows to specific leaking structures or polling tied to their usage.
      good: Profiles browser memory over time and looks for leaks.
      weak: Tells them to reload the page more often.
    followups:
      - How would you speed up reproducing several hours of use?
      - What would you look for in a memory snapshot comparison?
    common_errors:
      - Testing short sessions only.

  - external_key: problem_solving.customer_issue_resolution.corrupt_attachments
    competency_key: technical_support
    topic: Downloaded attachments open as corrupted
    difficulty: medium
    text: >-
      Some users at a customer say attachments they download from our app open as corrupted files, while
      other users can open the same attachments. How would you investigate?
    expected_concepts:
      - compare file size and checksum of a bad download with the original
      - compare how affected and unaffected users download, such as browser, network, device
      - consider proxies or security software modifying downloads
      - check for content type or encoding issues
      - test from the affected network with a known file
    rubric:
      excellent: Compares downloaded files with the originals by checksum, isolates the difference between affected and unaffected users, and tests network or security software interference.
      good: Compares the files and the users' environments.
      weak: Asks the uploader to upload the file again.
    followups:
      - What would a truncated versus altered file tell you?
      - How would you prove a proxy is changing the files?
    common_errors:
      - Assuming the stored file is corrupted without checking.

  - external_key: problem_solving.customer_issue_resolution.recording_wont_reproduce
    competency_key: problem_solving
    topic: Recording shows the bug but steps don't reproduce it
    difficulty: medium
    text: >-
      A customer sends a screen recording that clearly shows the bug, but when you follow the same steps it
      doesn't happen for you. What would you look for in the recording, and what would you try next?
    expected_concepts:
      - look for details such as timing, browser, data shown, account state and messages
      - note speed of actions or double clicks
      - compare their data and settings with your test
      - match timestamps in the recording with server logs
      - vary timing, data and environment in reproduction attempts
    rubric:
      excellent: Mines the recording for environmental, data and timing details, aligns it with server logs, and changes one factor at a time to reproduce.
      good: Looks for differences in the recording and compares them with their own setup.
      weak: Replays the steps repeatedly without looking for differences.
    followups:
      - How would you use the recording's timestamp with server logs?
      - What timing-related causes would you consider?
    common_errors:
      - Overlooking timing, such as quick repeated clicks.

  - external_key: problem_solving.customer_issue_resolution.impossible_order_state
    competency_key: sql
    topic: How a record reached an impossible state
    difficulty: medium
    text: >-
      A customer has an order marked as shipped that was never paid, which should be impossible. How would you
      use the database to reconstruct how it got into that state?
    expected_concepts:
      - query the order's history or state transition table
      - check related records such as payments and shipments with timestamps
      - look for other orders in the same state
      - consider concurrent updates or manual changes
      - use read-only queries and avoid changing data during investigation
    rubric:
      excellent: Reconstructs the transition history with timestamps, checks related tables and other affected orders, and considers concurrency or out-of-band edits, all read-only.
      good: Queries the order's history and related payment records.
      weak: Fixes the order status without understanding how it happened.
    followups:
      - What query would you write to find other orders in the same state?
      - What if there's no history table?
    common_errors:
      - Correcting the data before capturing the evidence.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.customer_issue_resolution.single_maintenance_window
    competency_key: problem_solving
    topic: One diagnostic window on production
    difficulty: hard
    text: >-
      A customer gives you a single thirty-minute maintenance window on their production system to run
      diagnostics for a problem you can't reproduce elsewhere. How would you plan to get the most out of it?
    expected_concepts:
      - list hypotheses and the evidence that would confirm or rule out each
      - prepare scripts and commands in advance and test them elsewhere
      - order steps by value and risk
      - agree roles, rollback and stop conditions with the customer
      - capture everything for offline analysis
    rubric:
      excellent: Prepares a rehearsed, prioritised plan tied to hypotheses, with agreed roles, safety and rollback, and captures full evidence for later analysis.
      good: Prepares a list of checks in advance and prioritises them.
      weak: Plans to explore freely during the window.
    followups:
      - What would you do if the first check reveals something unexpected?
      - How would you rehearse the plan?
    common_errors:
      - Running untested commands on the customer's production system.

  - external_key: problem_solving.customer_issue_resolution.timeline_out_of_order
    competency_key: debugging
    topic: Events shown out of order
    difficulty: hard
    text: >-
      A customer says the activity timeline in our product sometimes shows events in an impossible order, such
      as a reply appearing before the message it replies to. How would you investigate?
    expected_concepts:
      - check which timestamp is used and where it is generated
      - consider clock differences between servers or devices
      - consider asynchronous processing and delayed writes
      - check sorting and ties at the same timestamp
      - reproduce with controlled delays
    rubric:
      excellent: Identifies where timestamps originate, reasons about clock skew, asynchronous processing and sorting ties, and reproduces with controlled timing.
      good: Considers clock differences and asynchronous processing.
      weak: Assumes users are mistaken about the order.
    followups:
      - How would you fix ordering if clocks can't be trusted?
      - How could you confirm clock skew is the cause?
    common_errors:
      - Assuming all servers share an accurate clock.

  - external_key: problem_solving.customer_issue_resolution.saw_another_companys_data
    competency_key: technical_support
    topic: A report of seeing another customer's data
    difficulty: hard
    text: >-
      A customer says one of their users briefly saw what looked like another company's data on screen, then it
      disappeared after a refresh. They have no screenshot. How would you handle and investigate this?
    expected_concepts:
      - treat it as a potential security incident and escalate immediately
      - preserve evidence such as logs, sessions and cache entries for that time
      - get exact time, user, page and what was seen
      - investigate caching layers, session handling and shared state
      - follow the incident and disclosure process rather than speculating to the customer
    rubric:
      excellent: Escalates immediately as a security incident, preserves evidence, collects precise details, investigates caching and session paths, and follows the formal process for customer communication.
      good: Escalates to security and gathers details about the occurrence.
      weak: Dismisses it because there's no screenshot.
    followups:
      - Which components could serve one customer's data to another?
      - What would you tell the customer while it's being investigated?
    common_errors:
      - Waiting for proof before escalating.

  - external_key: problem_solving.customer_issue_resolution.failures_one_country_isp
    competency_key: problem_solving
    topic: Failures concentrated in one network or region
    difficulty: hard
    text: >-
      Several customers report failures, and you notice they all seem to be connecting through the same
      internet provider in one country. How would you confirm that pattern and find the cause?
    expected_concepts:
      - confirm the pattern with logs and network data rather than tickets alone
      - compare failures by network, region and edge location
      - test from that network using probes or the customers' help
      - consider routing, DNS, certificates, blocking or CDN edge issues
      - work with networking or CDN providers and keep customers informed
    rubric:
      excellent: Verifies the pattern with data, tests from the affected network, systematically considers routing, DNS, CDN and filtering causes, and coordinates with providers.
      good: Confirms the pattern and tests from the affected region.
      weak: Treats each ticket separately.
    followups:
      - How would you test from a network you don't control?
      - What mitigation might you offer before the provider fixes it?
    common_errors:
      - Relying on ticket counts instead of traffic data.

  - external_key: problem_solving.customer_issue_resolution.deterministic_repro_one_in_fifty
    competency_key: testing
    topic: Making a rare reproduction reliable
    difficulty: hard
    text: >-
      You can reproduce a customer's bug, but only about once in fifty attempts. How would you make it
      reproducible enough to be confident a fix actually works?
    expected_concepts:
      - identify the source of randomness such as timing, ordering or data
      - control it with fixed seeds, delays or forced ordering
      - automate many repetitions to get a statistical baseline
      - compare failure rates before and after the fix
      - add a deterministic regression test once the cause is known
    rubric:
      excellent: Finds and controls the nondeterministic factor, uses repeated runs to measure failure rates before and after, and ends with a deterministic regression test.
      good: Automates many runs and compares results before and after the fix.
      weak: Declares it fixed after a handful of passing attempts.
    followups:
      - How many passing runs would you need to be convinced?
      - How would you force a specific timing in a test?
    common_errors:
      - Trusting a few passing runs as proof of a fix.

  - external_key: problem_solving.customer_issue_resolution.multi_party_call
    competency_key: customer_communication
    topic: Leading a call with several parties and incomplete facts
    difficulty: hard
    text: >-
      You're leading a call with the customer's engineers, a vendor of theirs and our engineering team about a
      problem nobody fully understands yet. How would you structure the call so everyone leaves with clear
      actions?
    expected_concepts:
      - send an agenda and shared facts beforehand
      - start with an agreed problem statement and timeline
      - separate known facts from open questions
      - assign owners and deadlines for each action
      - send a written summary afterwards
    rubric:
      excellent: Prepares shared facts, steers the call through problem statement, evidence and hypotheses, assigns owners and deadlines, and follows up in writing.
      good: Uses an agenda and ends with actions and owners.
      weak: Lets the call run without structure or written follow-up.
    followups:
      - How would you handle the parties blaming each other during the call?
      - What goes in the follow-up summary?
    common_errors:
      - Ending without named owners and dates.
