# Curated questions: problem solving / security incident reasoning (part 2 of 4).
# Scenario questions about cloud and identity incidents, data exposure, scoping what was accessed
# and communicating with customers, legal and regulators.
# `defaults` are merged into every question (question keys win).
version: 1
defaults:
  role_tags: [security, cloud, network]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.security_incident_reasoning.public_share_link_customer_list
    competency_key: security
    topic: Customer data shared by a public link
    difficulty: easy
    text: >-
      You discover a spreadsheet of customer names and email addresses that has been shared through an
      "anyone with the link" setting for the past four months. What would you do, and how would you work out
      whether anyone outside the company actually opened it?
    expected_concepts:
      - restrict the sharing setting immediately
      - check the file's access and download history in the storage platform's audit logs
      - find where the link was posted, such as tickets, emails or public pages
      - identify the owner and why it was shared that way
      - escalate to privacy or legal if external access is likely
    rubric:
      excellent: Removes public access first, uses the platform's audit trail to see who opened or downloaded it, searches for where the link was published and escalates to privacy with evidence.
      good: Restricts the link and checks the access history.
      weak: Turns off sharing and assumes nobody saw it because the link was hard to guess.
    followups:
      - The audit log only shows "anonymous viewer" for some accesses. How do you interpret that?
      - How would you find other files shared the same way?
    common_errors:
      - Assuming an unguessable link was never seen without checking where it was posted.

  - external_key: problem_solving.security_incident_reasoning.misdirected_customer_file
    competency_key: incident_response
    topic: Sensitive file emailed to the wrong recipient
    difficulty: easy
    text: >-
      An account manager tells you they emailed a file with several hundred customer records to the wrong
      external address an hour ago. What would you do?
    expected_concepts:
      - attempt message recall where the mail system supports it, without relying on it
      - contact the recipient to request deletion and confirmation
      - record exactly what data was in the file and how many people are affected
      - escalate to privacy or legal for a notification assessment
      - consider controls such as external recipient warnings or data loss prevention
    rubric:
      excellent: Acts quickly on containment by recall and contacting the recipient, records exactly what was exposed, brings in privacy for a notification decision and suggests a preventive control.
      good: Asks the recipient to delete the email and reports it to privacy.
      weak: Treats it as a minor mistake and takes no formal action.
    followups:
      - The recipient is a competitor's employee. Does that change anything?
      - What would you write down about the event for the privacy team?
    common_errors:
      - Relying on message recall as if it reliably removes the email.

  - external_key: problem_solving.security_incident_reasoning.tokens_in_shipped_logs
    competency_key: security
    topic: Credentials found in logs sent to a third party
    difficulty: easy
    text: >-
      You notice that your application has been writing users' bearer tokens into its logs, and those logs are
      shipped to a third-party logging service. How would you respond?
    expected_concepts:
      - token lifetime decides how urgent revocation is
      - stop the logging with a fix or redaction at the shipper
      - revoke or expire affected tokens and refresh tokens
      - purge the data at the logging provider and confirm retention
      - check who has access to those logs internally and at the vendor
    rubric:
      excellent: Uses token lifetime to set urgency, stops the leak, revokes affected tokens, purges stored copies and reviews who could read the logs.
      good: Fixes the logging and rotates or expires the tokens.
      weak: Only fixes the logging going forward and leaves existing tokens and stored logs alone.
    followups:
      - The tokens last thirty days. How does that change your plan?
      - How would you catch this kind of leak before it reaches production?
    common_errors:
      - Forgetting the copies already stored in the logging service and its backups.

  - external_key: problem_solving.security_incident_reasoning.audit_trail_disabled
    competency_key: security
    topic: Cloud audit logging switched off
    difficulty: easy
    text: >-
      An alert tells you the cloud audit logging trail in one of your production accounts was turned off
      yesterday afternoon by a deployment pipeline role. How would you find out whether this was a mistake or
      something worse?
    expected_concepts:
      - turn logging back on first
      - check pipeline runs and code changes around that time
      - whether the pipeline role was used outside the pipeline
      - what other actions happened while logging was off, using other sources
      - prevent it with organisation-level policies that block disabling logging
    rubric:
      excellent: Restores logging, correlates the action with pipeline runs and commits, checks whether the role's credentials were used elsewhere, reconstructs the gap from other sources and proposes a guardrail.
      good: Re-enables logging and checks the recent pipeline changes.
      weak: Turns logging back on and assumes a configuration mistake.
    followups:
      - No pipeline run matches that time. What does that suggest?
      - Where else could you see activity from the period when logging was off?
    common_errors:
      - Not investigating what happened during the gap.

  - external_key: problem_solving.security_incident_reasoning.ssh_opened_to_internet
    competency_key: networking
    topic: Firewall rule opened to the whole internet
    difficulty: easy
    text: >-
      On Monday morning you find that a security group protecting your database subnet was changed over the
      weekend to allow SSH from anywhere on the internet. How would you handle it?
    expected_concepts:
      - who made the change and why, using audit logs
      - revert or narrow the rule
      - check connection and authentication logs for logins during the open window
      - check exposed hosts for signs of compromise
      - add detection or policy that blocks wide-open rules
    rubric:
      excellent: Reverts the rule, identifies who changed it and why, checks flow and auth logs for access during the window and adds a preventive guardrail.
      good: Reverts the change and asks who made it.
      weak: Reverts the rule without checking whether anyone connected while it was open.
    followups:
      - Flow logs show many connection attempts but you're not sure any succeeded. How do you tell?
      - The engineer says they needed emergency access. How do you handle that conversation?
    common_errors:
      - Not checking for successful logins during the exposure window.

  - external_key: problem_solving.security_incident_reasoning.service_key_from_unusual_network
    competency_key: security
    topic: Service credential used from an unexpected location
    difficulty: easy
    text: >-
      A service account key that normally only gets used from your own data centre has just made API calls
      from a consumer internet connection. How would you investigate, and when would you revoke it?
    expected_concepts:
      - which API calls were made and whether they succeeded
      - check whether an engineer used it while debugging from home
      - weigh the impact of revoking on the service that depends on it
      - rotate with a new key and update the service
      - find where the key is stored and how it could have leaked
    rubric:
      excellent: Reviews the calls that were made, checks for a benign explanation quickly, rotates in a way that keeps the service running and hunts for how the key leaked.
      good: Revokes the key and issues a new one.
      weak: Waits to see if it happens again.
    followups:
      - An engineer admits they copied the key to their laptop. What now?
      - How would you reduce the need for long-lived keys like this?
    common_errors:
      - Revoking without a replacement and causing an outage, or never finding the leak path.

  - external_key: problem_solving.security_incident_reasoning.mass_oauth_consent
    competency_key: security
    topic: Many users granting access to an unknown app
    difficulty: easy
    text: >-
      Over the last hour, about thirty employees have granted a third-party app you've never heard of
      permission to read their email. What would you do?
    expected_concepts:
      - likely consent phishing
      - revoke the app's consent and block it tenant-wide
      - check what the app accessed using its tokens
      - identify how users were lured and warn them
      - restrict user consent to verified apps or require admin approval
    rubric:
      excellent: Recognises consent phishing, revokes and blocks the app, reviews what data its tokens touched, warns users and restricts user consent going forward.
      good: Revokes the app's access and warns users.
      weak: Resets users' passwords, which doesn't remove the app's access.
    followups:
      - Why doesn't a password reset fix this?
      - How would you find out what mail the app read?
    common_errors:
      - Believing a password reset revokes OAuth grants.

  - external_key: problem_solving.security_incident_reasoning.researcher_found_open_index
    competency_key: incident_response
    topic: Outside report of an exposed data store
    difficulty: easy
    text: >-
      A security researcher emails you saying they found one of your search clusters open to the internet with
      customer data in it, and they include a screenshot. How would you handle the report?
    expected_concepts:
      - verify the claim quickly and close the exposure
      - preserve access logs before changing anything that could erase them
      - check access logs for other parties who downloaded data
      - acknowledge the researcher and keep them informed
      - bring in privacy and legal for notification decisions
    rubric:
      excellent: Verifies and closes the exposure quickly while preserving logs, checks whether others accessed it, responds to the researcher professionally and involves privacy.
      good: Closes the exposure and thanks the researcher.
      weak: Ignores the email or responds defensively without checking.
    followups:
      - The cluster had no access logging enabled. How do you reason about exposure?
      - The researcher asks when they can publish. How do you respond?
    common_errors:
      - Assuming the researcher was the only one who found it.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.security_incident_reasoning.bucket_mass_download
    competency_key: security
    topic: Bulk download from object storage
    difficulty: medium
    text: >-
      Storage access logs show one user identity downloaded the entire contents of a bucket of customer
      documents at two in the morning. Walk me through how you'd investigate.
    expected_concepts:
      - whose identity, human or machine, and its normal behaviour
      - source address, user agent and session details
      - whether a legitimate job such as a migration or backup explains it
      - other actions by the same identity before and after
      - revoke and contain if unexplained, and estimate what data left
    rubric:
      excellent: Compares the activity with the identity's baseline, checks source and client details, rules legitimate jobs in or out, follows the identity's other actions and contains while quantifying exposure.
      good: Checks who the identity is and whether the download was expected.
      weak: Assumes it was a backup job without checking.
    followups:
      - The identity belongs to a data engineer who is on leave this week. What next?
      - How would you tell whether the data went to another internal system or outside?
    common_errors:
      - Not checking the identity's other actions around the same time.

  - external_key: problem_solving.security_incident_reasoning.snapshot_shared_external_account
    competency_key: aws
    topic: Disk snapshot shared with an unknown account
    difficulty: medium
    text: >-
      You find that a disk snapshot of a production database server was shared with a cloud account ID that
      nobody in your company recognises. How would you work out what happened and what was exposed?
    expected_concepts:
      - audit log entry for the share, including principal and source
      - remove the share and check whether the snapshot was copied
      - what data was on the snapshot, including credentials and keys
      - other snapshots, images or backups shared the same way
      - rotate secrets that were on the disk
      - add a policy that blocks public or external sharing
    rubric:
      excellent: Traces the share action to an identity, revokes it, assumes the data and any secrets on the disk are exposed, checks for other shared resources and adds a preventive policy.
      good: Removes the share and finds who made it.
      weak: Removes the share and assumes nothing was copied.
    followups:
      - Can you tell whether the other account actually copied the snapshot?
      - Which secrets would you assume were on that disk?
    common_errors:
      - Forgetting about credentials stored on the disk.

  - external_key: problem_solving.security_incident_reasoning.key_policy_unknown_principal
    competency_key: security
    topic: Encryption key policy changed to trust an outsider
    difficulty: medium
    text: >-
      An encryption key that protects your payment data had its key policy changed to allow decrypt
      operations from an outside principal. How would you scope the impact and respond?
    expected_concepts:
      - revert the key policy
      - audit log entries for decrypt calls by that principal
      - what data that key protects and where it is stored
      - who changed the policy and how they had permission to
      - consider re-encrypting with a new key if decrypts happened
    rubric:
      excellent: Reverts the policy, checks decrypt calls to see whether the key was actually used, maps what the key protects, investigates the identity that changed it and plans re-encryption if needed.
      good: Reverts the policy and checks the audit logs.
      weak: Reverts the policy without checking whether any decryption happened.
    followups:
      - The logs show decrypt calls but you can't tell which objects. How do you scope it?
      - How would you restrict who can change key policies?
    common_errors:
      - Not identifying the identity that had permission to change the policy.

  - external_key: problem_solving.security_incident_reasoning.fork_pr_ci_secrets
    competency_key: security
    topic: Pipeline secrets exposed through a pull request
    difficulty: medium
    text: >-
      A pull request from an outside contributor's fork modified the CI workflow, and the build that ran
      printed environment variables to the job log. How would you determine what was exposed and contain it?
    expected_concepts:
      - which secrets were available to that job
      - whether the logs masked them and who can read the logs
      - rotate every exposed secret, starting with the most powerful
      - check for use of those secrets since the run
      - change pipeline configuration so forked PRs don't get secrets
    rubric:
      excellent: Lists the secrets the job could access, rotates them in priority order, checks for their use since the run and fixes the pipeline so forked code never runs with secrets.
      good: Rotates the secrets and blocks the contributor.
      weak: Deletes the job log and considers the matter closed.
    followups:
      - The logs show masked values. Are you safe?
      - How would you redesign the workflow for external contributions?
    common_errors:
      - Trusting log masking when the attacker controls the code that runs.

  - external_key: problem_solving.security_incident_reasoning.shipping_address_takeovers
    competency_key: incident_response
    topic: Working out how customer accounts were taken over
    difficulty: medium
    text: >-
      Customer support says several customers complained that their shipping addresses were changed and orders
      placed without their knowledge. How would you work out what's going on and how widespread it is?
    expected_concepts:
      - common pattern across affected accounts, such as login source and device
      - credential reuse, session theft, a support-channel abuse or an application bug
      - search for the same pattern in accounts that haven't complained
      - contain by forcing resets, invalidating sessions or adding verification for address changes
      - coordinate with support and fraud teams on refunds and messaging
    rubric:
      excellent: Builds competing hypotheses, tests them against the affected accounts' logs, expands to accounts that haven't complained, applies targeted containment and coordinates with support and fraud.
      good: Suspects credential stuffing and checks login logs for affected accounts.
      weak: Resets the complaining customers' passwords and stops there.
    followups:
      - The logins look normal and come from the customers' usual devices. What hypotheses remain?
      - How would you find affected customers who haven't noticed yet?
    common_errors:
      - Assuming credential stuffing without testing other explanations.

  - external_key: problem_solving.security_incident_reasoning.pod_listing_secrets
    competency_key: security
    topic: Workload identity reading secrets across a cluster
    difficulty: medium
    text: >-
      Kubernetes audit logs show a pod's service account listing secrets in every namespace, which that
      service has never done before. How would you investigate and contain it?
    expected_concepts:
      - check the service account's role bindings and why they allow this
      - inspect the pod for compromise or a changed image
      - assume the listed secrets are exposed and rotate them
      - isolate the pod and preserve its state
      - check for new workloads or bindings created afterwards
      - reduce privileges and restrict secret access
    rubric:
      excellent: Treats the secrets as exposed, preserves and isolates the pod, investigates how it was compromised, checks for follow-on changes in the cluster and fixes the over-broad binding.
      good: Removes the permissions and rotates the secrets.
      weak: Removes the permission and assumes nothing was used.
    followups:
      - The service account had cluster-wide read access from the start. What does that suggest?
      - Which secrets would you rotate first?
    common_errors:
      - Not checking for persistence such as new deployments or role bindings.

  - external_key: problem_solving.security_incident_reasoning.subdomain_takeover_phishing
    competency_key: network_engineering
    topic: Company subdomain serving a phishing page
    difficulty: medium
    text: >-
      A user reports that an old marketing subdomain of yours is now showing a login page that imitates your
      product. You find its DNS record points to a cloud service you stopped using. How would you respond?
    expected_concepts:
      - dangling DNS record leading to subdomain takeover
      - remove or repoint the record
      - check whether cookies scoped to the parent domain could be stolen
      - find other dangling records across zones
      - warn users or customers who may have entered credentials
    rubric:
      excellent: Identifies the dangling-record takeover, removes the record, assesses cookie and trust exposure on the parent domain, audits other zones and plans user notification.
      good: Removes the DNS record and looks for similar records.
      weak: Reports the page to the hosting provider and waits.
    followups:
      - Your session cookie is scoped to the whole domain. Why does that matter?
      - How would you prevent dangling records in future?
    common_errors:
      - Ignoring the risk to cookies and credentials scoped to the parent domain.

  - external_key: problem_solving.security_incident_reasoning.function_code_changed_out_of_band
    competency_key: aws
    topic: Serverless function modified outside the pipeline
    difficulty: medium
    text: >-
      You discover that the code of a production serverless function was updated directly in the console last
      night, outside your deployment pipeline, and the new version sends data to an unfamiliar domain. How
      would you handle it?
    expected_concepts:
      - capture the modified version before reverting
      - identify who made the update and with which credentials
      - what data the function handled and what was sent out
      - redeploy the known-good version from the pipeline
      - restrict console and direct-update permissions
      - check other functions for the same change
    rubric:
      excellent: Captures the malicious version, traces the update to an identity, works out what data left, restores from the pipeline and removes direct-update permissions.
      good: Reverts the function and finds who changed it.
      weak: Reverts the function without capturing the modified code or checking what left.
    followups:
      - The update came from a developer's account. What do you check next?
      - How would you know if this happened to other functions?
    common_errors:
      - Overwriting the malicious version before saving it.

  - external_key: problem_solving.security_incident_reasoning.notify_customers_uncertain_facts
    competency_key: incident_response
    topic: Customer notification under uncertainty
    difficulty: medium
    text: >-
      You need to help draft a notification to customers about a security incident, but you still don't know
      exactly which records were accessed. What would the notification need to say, and how would you avoid
      overpromising?
    expected_concepts:
      - state what happened, when and what data may be involved
      - be clear about what is still being investigated
      - concrete actions customers should take
      - what the company has done and will do
      - avoid absolute claims such as no data was taken
      - align with legal and support so answers are consistent
    rubric:
      excellent: Structures the notice around facts, uncertainties and customer actions, avoids absolute claims and makes sure support and legal are aligned before it goes out.
      good: Covers what happened and what customers should do.
      weak: Writes a vague or overly reassuring statement.
    followups:
      - How would you prepare support for the questions customers will ask?
      - When would you send a follow-up?
    common_errors:
      - Making reassuring claims that later investigation contradicts.

  - external_key: problem_solving.security_incident_reasoning.incident_notes_facts_vs_theories
    competency_key: incident_response
    topic: Keeping investigation notes useful and defensible
    difficulty: medium
    text: >-
      Your legal team has joined a security investigation and asked how findings are being recorded. How do
      you keep incident notes that are useful to responders but also accurate enough to stand up to scrutiny
      later?
    expected_concepts:
      - separate facts, hypotheses and decisions
      - timestamps, sources and who recorded each entry
      - avoid speculation presented as conclusion
      - follow counsel's guidance on where and how to record
      - preserve evidence with chain of custody
    rubric:
      excellent: Keeps a timestamped log that separates observations from hypotheses and decisions, cites sources for each fact, follows counsel's direction on documentation and maintains chain of custody.
      good: Keeps a timeline and separates confirmed facts from guesses.
      weak: Records findings informally in chat or not at all.
    followups:
      - An engineer writes "we got owned through the VPN" in the ticket before it's confirmed. How do you handle that?
      - What does chain of custody mean in practice for a cloud disk image?
    common_errors:
      - Writing conclusions before they are supported by evidence.

  - external_key: problem_solving.security_incident_reasoning.vpn_login_disabled_account
    competency_key: network_engineering
    topic: Remote access by an account that should be disabled
    difficulty: medium
    text: >-
      VPN logs show a successful login yesterday for an account that was disabled in your directory two weeks
      ago. How would you work out how that's possible and what was done?
    expected_concepts:
      - VPN may authenticate against a separate source, local accounts or cached credentials
      - check what the session accessed, using internal flow logs
      - terminate the session and block the account on the VPN directly
      - review the VPN's authentication integration for other gaps
      - check for other accounts in the same situation
    rubric:
      excellent: Investigates why the disable didn't apply to the VPN, terminates access, reviews what the session reached and checks for other accounts and gaps in the integration.
      good: Disables the account on the VPN and reviews the session.
      weak: Assumes it was a logging error.
    followups:
      - The VPN uses a local account database that was never synced. What else would you check?
      - How would you make account removal reliable across every system?
    common_errors:
      - Not checking what internal systems the session reached.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.security_incident_reasoning.cross_account_role_chain
    competency_key: aws
    topic: Attacker chaining roles across cloud accounts
    difficulty: hard
    text: >-
      You find an attacker has used a compromised role in a development account to assume roles in several
      production accounts. How would you trace the full chain and contain it without breaking production?
    expected_concepts:
      - follow assume-role events across accounts with session names and source identity
      - map the trust relationships that made the chain possible
      - revoke active sessions, for example with deny policies on older sessions
      - tighten trust policies without breaking legitimate automation
      - look for persistence created in each account
      - organise the work per account with clear owners
    rubric:
      excellent: Follows the session chain across accounts, understands how trust policies allowed it, revokes active sessions surgically, hunts for persistence in each account and coordinates with owners to avoid production impact.
      good: Traces the chain and removes the trust relationships.
      weak: Deletes roles in production without understanding dependencies.
    followups:
      - How do you revoke sessions that are already issued for a role?
      - What would you change in the trust model between development and production?
    common_errors:
      - Not realising temporary credentials stay valid after the role changes.

  - external_key: problem_solving.security_incident_reasoning.notification_deadline_unknown_access
    competency_key: incident_response
    topic: Notification deadline before the facts are clear
    difficulty: hard
    text: >-
      You're forty-eight hours into a breach investigation. A regulator notification deadline expires in a day,
      and you still can't say whether personal data was accessed. How would you help the company decide what
      to do?
    expected_concepts:
      - the deadline is usually triggered by awareness of a likely breach, not certainty
      - give legal the evidence and confidence levels to make the call
      - prioritise investigative work that answers the notification question
      - initial notifications can usually be supplemented later
      - document the reasoning and timeline of the decision
    rubric:
      excellent: Focuses the investigation on the facts that decide notification, gives legal clear confidence levels and evidence, explains that phased notification is often possible and documents the decision.
      good: Escalates to legal with what is known and suggests notifying early.
      weak: Argues for waiting until certainty, or decides on notification themselves without legal.
    followups:
      - The evidence points both ways. What would you tell legal?
      - How would you prioritise the team's next twenty-four hours?
    common_errors:
      - Treating the deadline as starting only once access is proven.

  - external_key: problem_solving.security_incident_reasoning.identity_provider_signing_cert
    competency_key: security
    topic: Rogue signing certificate in the identity provider
    difficulty: hard
    text: >-
      You discover that a new token-signing certificate was added to your single sign-on configuration three
      weeks ago, and nobody on the identity team added it. What does that mean for every system that trusts
      single sign-on, and how would you respond?
    expected_concepts:
      - an attacker can forge tokens for any user and application
      - logs at relying applications are the main evidence, not the identity provider
      - remove the certificate and rotate legitimate signing keys
      - invalidate sessions across all federated applications
      - find how the attacker had admin access to the identity provider
      - review admin and application actions across the three weeks
    rubric:
      excellent: Recognises that forged tokens bypass MFA and that the identity provider's own logs won't show them, checks relying applications, rotates keys and sessions everywhere and investigates the admin compromise.
      good: Removes the certificate, rotates keys and investigates the admin account.
      weak: Removes the certificate without considering forged sessions already issued.
    followups:
      - Why won't the identity provider's sign-in logs show forged tokens?
      - Which applications would you check first?
    common_errors:
      - Looking only at identity provider logs for misuse.

  - external_key: problem_solving.security_incident_reasoning.cross_tenant_exposure_bug
    competency_key: incident_response
    topic: Bug that showed customers other tenants' data
    difficulty: hard
    text: >-
      A caching bug caused some users of your SaaS product to see other customers' data for about three hours
      before it was rolled back. How would you work out exactly who saw what, and how would you handle it with
      customers?
    expected_concepts:
      - treat it as a security incident even though it was not an attack
      - use request logs, cache keys and response data to map viewer to owner
      - which data fields could have been shown
      - notify both the customers whose data was exposed and those who saw it
      - contractual and regulatory notification
      - root-cause fix and tests for tenant isolation
    rubric:
      excellent: Treats it as an incident, reconstructs viewer-to-owner exposure from logs and cache behaviour, sizes what fields were shown, handles notification for both sides and fixes the isolation weakness.
      good: Uses logs to identify affected customers and notifies them.
      weak: Treats it as an ordinary bug and only rolls back.
    followups:
      - Your logs don't record response bodies. How do you estimate what was shown?
      - Would you contact the customers who saw the data, and what would you ask them?
    common_errors:
      - Treating it as only a reliability bug.

  - external_key: problem_solving.security_incident_reasoning.extortion_email_sample
    competency_key: incident_response
    topic: Extortion claim with a data sample
    difficulty: hard
    text: >-
      Someone emails your support address claiming they've stolen your customer database, attaching a sample of
      fifty records and demanding payment. How would you assess whether the claim is real and decide what to
      do next?
    expected_concepts:
      - validate the sample against your data, including freshness and fields
      - identify which system and point in time the data matches
      - consider older breaches, third parties or scraped data as sources
      - escalate to legal, leadership and possibly law enforcement
      - don't engage with the extortionist without a plan
      - start incident response to find the source
    rubric:
      excellent: Validates the sample to pinpoint its source system and time, considers alternatives such as vendor breaches or scraped data, escalates appropriately and launches an investigation without engaging the sender prematurely.
      good: Checks whether the records are real and escalates to leadership.
      weak: Ignores it as spam or replies directly to the sender.
    followups:
      - The records include a field that only exists in a vendor's copy of your data. What does that tell you?
      - Who should decide whether to respond to the sender?
    common_errors:
      - Assuming the data came from your own systems without checking third-party copies.

  - external_key: problem_solving.security_incident_reasoning.attacker_disabling_logging_live
    competency_key: security
    topic: Attacker actively disabling detection
    difficulty: hard
    text: >-
      While you're watching, an attacker using a compromised admin role starts deleting log groups and
      disabling your threat detection service in one cloud account. What would you do in the next fifteen
      minutes?
    expected_concepts:
      - cut off the attacker's session and role immediately, since this is active destruction
      - use organisation-level controls that the account admin can't override
      - make sure logs are also copied to a separate account they can't reach
      - capture what remains and record actions with timestamps
      - escalate and bring in more responders
      - expect the attacker to try other accounts or credentials next
    rubric:
      excellent: Prioritises cutting the attacker off using controls above the account, relies on logs stored elsewhere, records actions, escalates and anticipates the attacker's next move.
      good: Revokes the role and re-enables logging.
      weak: Tries to re-enable logging repeatedly without removing the attacker's access.
    followups:
      - The role is also used by your deployment pipeline. Does that change your decision?
      - Why does a separate log archive account matter here?
    common_errors:
      - Not using organisation-level controls that an account admin cannot override.
