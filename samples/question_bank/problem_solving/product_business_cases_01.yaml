# Curated questions: product and business cases (problem-solving rounds). Spoken case prompts:
# should we build X, sizing an opportunity, designing a metric, a launch going wrong. Evaluation is
# on the reasoning in the answer only: structure, assumptions, trade-offs and decisions.
version: 1
defaults:
  role_tags: [product_manager, business_analyst, ux_designer]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  - external_key: problem_solving.product_business_cases.dark_mode_request
    competency_key: product_sense
    topic: Deciding on a popular cosmetic feature request
    difficulty: easy
    text: >-
      Users of a project management app keep asking for a dark mode, and it's now the most upvoted request on the
      feedback board. How would you decide whether it's worth building this quarter?
    expected_concepts:
      - understand who is asking and why (usage context, segment size)
      - estimate the cost, including ongoing design and testing overhead
      - compare against the current goals and the alternatives on the roadmap
      - consider the impact on retention or satisfaction rather than votes alone
      - look for a cheap way to test or phase the work
    rubric:
      excellent: Treats votes as a signal to investigate, sizes both the value for the requesting segment and the full cost including maintenance, compares it against current goals and proposes a clear decision with a reason.
      good: Weighs user value against effort and goals and reaches a sensible decision.
      weak: Builds it because it is the top request, or dismisses it as cosmetic without looking at who wants it.
    followups:
      - What would change your answer if most requesters were your highest-paying customers?
      - How would you tell users if you decided not to build it yet?
    common_errors:
      - Treating vote counts as a direct measure of value.
      - Forgetting the ongoing cost of maintaining two visual themes.

  - external_key: problem_solving.product_business_cases.size_dog_walking_city
    competency_key: problem_solving
    topic: Sizing a local services marketplace
    difficulty: easy
    text: >-
      A startup wants to launch an app for booking dog walkers in one large city. Talk me through how you'd
      estimate the yearly revenue opportunity there.
    expected_concepts:
      - start from households and the share that own dogs
      - estimate the share who pay for walking and how often
      - price per walk and the platform's take rate
      - distinguish total spend from what the platform can capture
      - sanity-check the result against another angle such as supply of walkers
    rubric:
      excellent: Builds a clear bottom-up chain from households to paying users, frequency and price, separates market spend from platform revenue via the take rate, and sanity-checks with a second method.
      good: Logical chain of assumptions with reasonable numbers and a final estimate.
      weak: Picks a number with no structure or confuses market size with revenue.
    followups:
      - Which assumption would you most want to validate first, and how?
      - How would the estimate change if you also offered pet sitting?
    common_errors:
      - Reporting total spend on dog walking as the platform's revenue.

  - external_key: problem_solving.product_business_cases.metric_saved_searches
    competency_key: product_sense
    topic: Designing a success metric for a new feature
    difficulty: easy
    text: >-
      A property listings site is adding a saved searches feature that alerts people when new homes match their
      criteria. How would you define success for it, and which metric would you watch most closely?
    expected_concepts:
      - tie the metric to the user goal of finding a home faster
      - adoption metric such as share of active searchers saving a search
      - engagement metric such as alerts opened leading to listing views or enquiries
      - business outcome such as enquiries to agents or return visits
      - a guardrail such as unsubscribe rate or alert fatigue
    rubric:
      excellent: Links the feature to a user outcome, picks one primary metric with a clear rationale, supports it with adoption and downstream metrics, and adds a guardrail against over-alerting.
      good: Proposes sensible adoption and engagement metrics tied to the feature's purpose.
      weak: Lists vanity metrics such as number of saved searches without linking them to an outcome.
    followups:
      - What target would you set for the first three months, and how would you choose it?
      - How would you know if alerts were becoming spammy?
    common_errors:
      - Choosing a metric that rises even when users get no value.

  - external_key: problem_solving.product_business_cases.launch_checkout_tickets
    competency_key: product_sense
    topic: First response when a launch generates complaints
    difficulty: easy
    text: >-
      You launched a redesigned checkout this morning, and by lunchtime support tickets have doubled. Walk me
      through what you'd do in the first few hours.
    expected_concepts:
      - read the tickets to understand what users are hitting
      - check conversion and error metrics against the old checkout
      - decide quickly whether to pause, roll back or limit the rollout
      - coordinate with engineering and support on a fix and a holding response
      - keep stakeholders informed with a clear status
    rubric:
      excellent: Gathers evidence fast from tickets and metrics, sets a clear threshold for rolling back, coordinates engineering and support, and communicates status and next steps.
      good: Investigates the cause and considers rollback with reasonable communication.
      weak: Waits for more data without a plan, or rolls back blindly without understanding the problem.
    followups:
      - What evidence would make you roll back immediately?
      - What would you ask the support team to tell customers?
    common_errors:
      - Assuming more tickets means the design is wrong rather than checking for a specific defect.

  - external_key: problem_solving.product_business_cases.small_order_fee
    competency_key: product_sense
    topic: Introducing a fee on small orders
    difficulty: easy
    text: >-
      A grocery delivery app is losing money on small orders and the finance team proposes a small-order fee. How
      would you think through whether to introduce it?
    expected_concepts:
      - understand the unit economics of small orders
      - share of orders and customers affected
      - likely behaviour change such as larger baskets versus churn
      - alternatives such as a minimum order or a free-delivery threshold
      - how to test it and which metrics to watch
    rubric:
      excellent: Quantifies the loss on small orders, predicts how different customers will react, compares the fee with alternatives, and proposes a measured test with clear success and guardrail metrics.
      good: Considers economics and customer reaction and suggests testing.
      weak: Approves or rejects the fee on instinct without considering customer behaviour.
    followups:
      - Which customers would you worry about losing, and why?
      - How would you explain the fee in the product?
    common_errors:
      - Assuming customers will keep ordering exactly as before after the fee.

  - external_key: problem_solving.product_business_cases.onboarding_tour_skipped
    competency_key: ux_design
    topic: An onboarding tour most users skip
    difficulty: easy
    text: >-
      About half of new users skip the onboarding tour in a personal budgeting app. Would you redesign it, remove
      it or leave it alone, and how would you decide?
    expected_concepts:
      - compare outcomes of users who skip with those who finish
      - be careful about self-selection in that comparison
      - identify the key action new users need to reach
      - consider contextual help instead of an upfront tour
      - test changes against activation and early retention
    rubric:
      excellent: Frames the decision around activation rather than tour completion, notes the self-selection bias in comparing skippers with finishers, considers alternatives such as contextual guidance, and proposes a test.
      good: Uses data on skippers versus finishers and suggests an improvement to test.
      weak: Decides based on personal preference or treats tour completion as the goal.
    followups:
      - What would you consider the key moment of value in a budgeting app?
      - How would you measure whether contextual tips work better than the tour?
    common_errors:
      - Concluding the tour causes retention because finishers retain better.

  - external_key: problem_solving.product_business_cases.signups_drop_overnight
    competency_key: data_analysis
    topic: Diagnosing an overnight drop in sign-ups
    difficulty: easy
    text: >-
      You come in on Monday and see that sign-ups dropped by twenty percent over the weekend. How would you work
      out what happened?
    expected_concepts:
      - confirm the drop is real and not a tracking or reporting issue
      - compare with seasonality and previous weekends
      - segment by platform, channel, region and browser
      - check recent releases, marketing changes and outages
      - narrow to a cause and decide on a fix or follow-up
    rubric:
      excellent: Checks data quality first, compares against normal weekend patterns, segments systematically to isolate where the drop sits, and correlates with releases or channel changes before proposing action.
      good: Segments the data and checks recent changes to find a likely cause.
      weak: Jumps to a single explanation without checking tracking or segmenting.
    followups:
      - If the drop is only on one mobile platform, what would you check next?
      - Who would you involve, and when?
    common_errors:
      - Skipping the check that the tracking itself still works.

  - external_key: problem_solving.product_business_cases.invoice_matching_automation
    competency_key: requirements_analysis
    topic: Business case for automating a manual process
    difficulty: easy
    text: >-
      The finance team spends three days every month manually matching supplier invoices to purchase orders. How
      would you put together a case for whether automating it is worth the investment?
    expected_concepts:
      - measure the current cost in time, errors and delays
      - identify the matching rules and exceptions
      - estimate build or buy cost and ongoing maintenance
      - benefits beyond time saved such as fewer late payments
      - payback period and the risks of automating
    rubric:
      excellent: Baselines current effort and error costs, understands the matching rules and exception volume, compares build and buy options with total cost, and presents a payback estimate with key risks.
      good: Compares current cost with automation cost and estimates the benefit.
      weak: Assumes automation is obviously worth it without quantifying anything.
    followups:
      - What share of invoices would still need a person, and why does that matter?
      - Who would you need to agree before going ahead?
    common_errors:
      - Ignoring exception handling, which often dominates the manual effort.

  - external_key: problem_solving.product_business_cases.offline_mode_field_app
    competency_key: product_sense
    topic: An expensive capability requested by one segment
    difficulty: medium
    text: >-
      Field technicians using your inspection app ask for full offline mode, and engineering estimates it would
      take a whole quarter. How would you decide whether to do it, do a smaller version, or not do it at all?
    expected_concepts:
      - understand where and how often connectivity fails
      - quantify the cost of the problem today such as lost work or delays
      - explore a smaller scope that covers the most common cases
      - weigh the opportunity cost of the quarter
      - consider effects on sales and renewals in that segment
    rubric:
      excellent: Quantifies how often and how badly technicians are affected, identifies a minimal offline scope that covers most of the pain, weighs it against the quarter's alternatives and makes a clear recommendation.
      good: Considers user impact, scope options and cost before deciding.
      weak: Accepts or rejects the full estimate without exploring a smaller version.
    followups:
      - What would the smallest useful version of offline mode be?
      - How would you validate that technicians would actually use it?
    common_errors:
      - Treating the engineering estimate as fixed instead of shaping scope.

  - external_key: problem_solving.product_business_cases.size_ev_charging_software
    competency_key: problem_solving
    topic: Sizing a B2B software opportunity
    difficulty: medium
    text: >-
      Your company is considering selling scheduling software for electric vehicle charging to office car park
      operators. How would you size that opportunity well enough to decide whether to pursue it?
    expected_concepts:
      - define the customer and buying unit (operator, site, charger)
      - count sites or chargers and estimate adoption over time
      - pricing model and revenue per customer
      - growth rate of chargers and timing of the market
      - competition and realistic share that can be won
    rubric:
      excellent: Defines the buyer and pricing unit precisely, builds a bottom-up estimate with explicit assumptions, accounts for market growth and competition, and turns it into an obtainable revenue figure tied to the decision.
      good: Builds a reasonable bottom-up estimate with a clear unit and price.
      weak: Quotes a top-down market size with no link to what the company could realistically win.
    followups:
      - Which assumption carries the most uncertainty, and how would you test it?
      - What size of opportunity would make this worth pursuing for you?
    common_errors:
      - Ignoring how quickly the installed base of chargers is growing.

  - external_key: problem_solving.product_business_cases.north_star_language_app
    competency_key: product_sense
    topic: Choosing a north star for a learning app
    difficulty: medium
    text: >-
      You're the new product lead for a language learning app. How would you choose a single north star metric,
      and what would you pick?
    expected_concepts:
      - reflect real learner value, not just time spent
      - balance a measure of progress with a measure of habit
      - connect to revenue through retention
      - explain why alternatives such as daily active users fall short
      - supporting input metrics teams can move
    rubric:
      excellent: Proposes a north star that captures learning progress or consistent practice, explains why simpler options like time in app are misleading, links it to retention and revenue, and breaks it into input metrics.
      good: Picks a sensible metric tied to learner value and explains the choice.
      weak: Picks daily active users or revenue without considering whether it reflects learning.
    followups:
      - How could teams game the metric you chose?
      - Which input metrics would you give the onboarding team?
    common_errors:
      - Choosing a time-spent metric that rewards friction.

  - external_key: problem_solving.product_business_cases.free_shipping_threshold_test
    competency_key: statistics_experimentation
    topic: An experiment with a trade-off between metrics
    difficulty: medium
    text: >-
      An online store tested raising its free-shipping threshold. Average order value went up, but conversion went
      down. How would you decide whether to roll the change out?
    expected_concepts:
      - combine the metrics into revenue or margin per visitor
      - include shipping cost savings in the calculation
      - check statistical confidence for each effect
      - look at effects on new versus returning customers and repeat purchases
      - consider the longer-term effect on retention
    rubric:
      excellent: Converts both effects into revenue or margin per visitor including shipping costs, checks whether results are statistically reliable, examines segment and repeat-purchase effects, and makes a clear call.
      good: Combines the metrics into an overall business effect and decides.
      weak: Picks the more appealing metric and ignores the other.
    followups:
      - What would you do if margin per visitor was flat?
      - How long would you want to watch repeat purchase behaviour?
    common_errors:
      - Deciding on average order value alone.

  - external_key: problem_solving.product_business_cases.competitor_free_tier
    competency_key: product_sense
    topic: Responding to a competitor's free tier
    difficulty: medium
    text: >-
      A direct competitor has just launched a generous free tier, and your sales team is asking you to match it
      immediately. How would you respond?
    expected_concepts:
      - understand which customers are at risk and why
      - look for early evidence such as churn, lost deals or traffic
      - consider your own positioning and differentiators
      - model the cost and cannibalisation of a free tier
      - options short of matching such as trials or targeted offers
    rubric:
      excellent: Avoids a reflex response, assesses which segments are actually exposed using early data, models the cost of a free tier, and lays out a range of options with a recommendation and a plan to monitor.
      good: Considers impact and options before deciding.
      weak: Matches immediately or dismisses the threat without looking at data.
    followups:
      - What data would you look at in the next two weeks?
      - When would you change your mind and launch a free tier?
    common_errors:
      - Copying the competitor without understanding their strategy or economics.

  - external_key: problem_solving.product_business_cases.cheaper_plan_cannibalisation
    competency_key: product_sense
    topic: Cannibalisation risk of a cheaper plan
    difficulty: medium
    text: >-
      Your team wants to introduce a cheaper plan to win price-sensitive customers, but finance worries existing
      customers will downgrade. How would you evaluate the risk and design the plan?
    expected_concepts:
      - estimate how many current customers fit the cheaper plan's limits
      - design fences such as feature or usage limits
      - estimate new customers won versus revenue lost to downgrades
      - plan an upgrade path back to higher plans
      - test with new customers before exposing it to existing ones
    rubric:
      excellent: Models downgrade risk against new revenue, designs clear fences so the cheaper plan suits the target customers but not existing heavy users, and proposes a staged test with metrics.
      good: Recognises cannibalisation and proposes sensible plan limits.
      weak: Ignores downgrade risk or sets limits arbitrarily.
    followups:
      - Which feature would you hold back from the cheaper plan, and why?
      - What downgrade rate would make this a bad idea?
    common_errors:
      - Designing the cheaper plan so it meets most existing customers' needs.

  - external_key: problem_solving.product_business_cases.tutoring_supply_shortage
    competency_key: product_sense
    topic: Balancing supply and demand in a marketplace
    difficulty: medium
    text: >-
      On a tutoring marketplace, students struggle to find tutors on weekday evenings, while tutors complain they
      have empty slots during the day. How would you approach this?
    expected_concepts:
      - quantify the mismatch by time slot and subject
      - levers to shift supply such as incentives for evening slots
      - levers to shift demand such as daytime pricing or availability nudges
      - recruit new supply targeted at the gap
      - measure match rate and wait time
    rubric:
      excellent: Diagnoses the mismatch with data by slot and subject, proposes levers on both the supply and demand side, and defines success through match rate and fill rate.
      good: Proposes reasonable ways to rebalance with some measurement.
      weak: Only suggests recruiting more tutors without considering timing or demand.
    followups:
      - What could go wrong with paying tutors more for evening slots?
      - How would you prioritise which subjects to fix first?
    common_errors:
      - Treating it as a total supply problem rather than a timing mismatch.

  - external_key: problem_solving.product_business_cases.launch_wrong_promo_email
    competency_key: stakeholder_management
    topic: A launch that sent customers the wrong offer
    difficulty: medium
    text: >-
      A new automated campaign you launched sent a discount meant for lapsed customers to your entire customer
      base, including people who paid full price yesterday. How would you handle the next twenty-four hours?
    expected_concepts:
      - stop the campaign and assess the scope
      - decide whether to honour the discount and what it costs
      - agree customer messaging with support and marketing
      - brief leadership and affected teams quickly
      - find the root cause and add a safeguard
    rubric:
      excellent: Stops the damage first, sizes the cost of honouring versus withdrawing the offer, aligns support, marketing and leadership on one message, and follows up with a root cause and safeguard.
      good: Contains the issue and communicates a plan with a sensible decision on the offer.
      weak: Focuses only on the technical fix or ignores how customers will react.
    followups:
      - Would you honour the discount, and what drives that decision?
      - What safeguard would stop this happening again?
    common_errors:
      - Silently withdrawing the offer without telling customers.

  - external_key: problem_solving.product_business_cases.support_chat_build_buy
    competency_key: product_sense
    topic: Build, buy or partner for a capability
    difficulty: medium
    text: >-
      Your product needs in-app customer support chat. One option is to build it, another is to buy a vendor tool,
      and a third is to partner with an existing provider. How would you make the call?
    expected_concepts:
      - is chat a differentiator or a commodity for this product
      - total cost of ownership over several years
      - time to market and integration effort
      - data ownership, privacy and lock-in risks
      - how much customisation is really needed
    rubric:
      excellent: Starts from whether chat is strategic, compares options on total cost, speed, control and risk over a multi-year horizon, and recommends with clear conditions that would change the decision.
      good: Compares the options on cost and speed and picks one with reasons.
      weak: Defaults to building because it gives control, or to buying because it is faster, without analysis.
    followups:
      - What would make building the right choice?
      - How would you reduce lock-in if you bought a tool?
    common_errors:
      - Comparing only upfront cost and ignoring maintenance.

  - external_key: problem_solving.product_business_cases.newer_cohorts_retain_worse
    competency_key: data_analysis
    topic: Newer cohorts retaining worse
    difficulty: medium
    text: >-
      Your retention charts show that each of the last four monthly cohorts keeps fewer users after thirty days
      than the one before. How would you figure out why?
    expected_concepts:
      - check changes in acquisition mix and channels
      - check product and onboarding changes over the period
      - segment cohorts by channel, platform and plan
      - rule out measurement changes
      - form hypotheses and test the most likely ones
    rubric:
      excellent: Separates mix effects from product effects, segments cohorts by channel and platform, checks for measurement changes, and proposes targeted tests for the leading hypotheses.
      good: Considers acquisition and product changes and segments the data.
      weak: Assumes the product got worse without checking who is arriving.
    followups:
      - How would you tell whether a new paid channel is the cause?
      - What would you do if every segment declined equally?
    common_errors:
      - Overlooking a shift in acquisition mix.

  - external_key: problem_solving.product_business_cases.reviews_feature_low_usage
    competency_key: ux_research
    topic: A launched feature with very low usage
    difficulty: medium
    text: >-
      Six weeks after launching customer reviews on product pages, only two percent of buyers have left one. How
      would you decide whether to improve it, leave it or remove it?
    expected_concepts:
      - compare against what good looks like for review rates
      - separate writing reviews from reading them
      - check whether reviews influence conversion for readers
      - research barriers to writing reviews
      - decide based on value delivered, not usage alone
    rubric:
      excellent: Distinguishes writers from readers, checks the effect of reviews on purchase decisions, benchmarks the rate, researches barriers and recommends a path tied to business value.
      good: Investigates why usage is low and the value it provides before deciding.
      weak: Removes it because usage is low without considering the readers' value.
    followups:
      - How would you encourage more reviews without biasing them?
      - What would make you remove the feature?
    common_errors:
      - Judging the feature only by how many people write reviews.

  - external_key: problem_solving.product_business_cases.largest_customer_custom_feature
    competency_key: product_sense
    topic: A major customer demands a custom feature
    difficulty: medium
    text: >-
      Your largest customer, worth about fifteen percent of revenue, says they'll leave unless you build a feature
      only they have asked for. How would you handle it?
    expected_concepts:
      - understand the underlying need and real deadline
      - assess whether other customers share the problem
      - estimate cost and roadmap disruption
      - options such as a configurable or more general solution
      - assess the realistic risk of churn and negotiate
    rubric:
      excellent: Digs into the underlying need, checks if it generalises, weighs the revenue risk against cost and roadmap impact, and proposes options such as a generalised solution or phased delivery with a negotiated plan.
      good: Balances the customer's importance against cost and looks for a broader solution.
      weak: Agrees immediately or refuses without exploring the need.
    followups:
      - How would you decide whether the churn threat is real?
      - What would you tell the rest of the roadmap stakeholders?
    common_errors:
      - Building a one-off that becomes a permanent maintenance burden.

  - external_key: problem_solving.product_business_cases.move_downmarket_small_business
    competency_key: product_sense
    topic: Moving an enterprise product down-market
    difficulty: hard
    text: >-
      Your company sells HR software to large enterprises and growth is slowing. Leadership asks whether you should
      move down-market to small businesses. How would you work through that decision?
    expected_concepts:
      - size the small business opportunity and its economics
      - differences in buying, onboarding and support needs
      - changes needed to product, pricing and go-to-market
      - risk of distracting from or diluting the enterprise product
      - ways to test such as a self-serve pilot
    rubric:
      excellent: Sizes the opportunity with realistic unit economics, explains how small businesses buy and use the product differently, identifies the product and go-to-market changes required, weighs the distraction risk and proposes a staged test with decision criteria.
      good: Covers opportunity size, required changes and risks and makes a recommendation.
      weak: Treats it as a pricing change or ignores the different acquisition and support costs.
    followups:
      - What would acquisition cost need to look like for this to work?
      - Would you build a separate product or adapt the current one?
    common_errors:
      - Assuming small businesses want a cheaper version of the enterprise product.

  - external_key: problem_solving.product_business_cases.ai_meeting_notes_case
    competency_key: product_sense
    topic: Sizing and deciding on an AI feature
    difficulty: hard
    text: >-
      You run a video meeting product and leadership wants automatic AI meeting summaries. Talk me through how you'd
      size the opportunity and decide whether, and how, to launch it.
    expected_concepts:
      - user problem and which meetings benefit most
      - adoption and monetisation assumptions such as add-on pricing
      - inference cost per meeting against revenue
      - quality, accuracy and privacy risks including consent
      - launch approach such as opt-in beta with quality metrics
    rubric:
      excellent: Grounds the feature in a user problem, sizes revenue against per-meeting cost, addresses accuracy and consent risks explicitly, and proposes a staged launch with quality and adoption metrics and a clear go or stop decision.
      good: Covers value, cost and main risks and suggests a sensible launch plan.
      weak: Assumes the feature is valuable because competitors have it and ignores cost or privacy.
    followups:
      - How would you measure whether summaries are accurate enough?
      - Would you charge for it or include it, and why?
    common_errors:
      - Ignoring the variable compute cost of every meeting.

  - external_key: problem_solving.product_business_cases.sellers_gaming_response_metric
    competency_key: product_sense
    topic: A metric that participants are gaming
    difficulty: hard
    text: >-
      Your marketplace ranks sellers partly on how quickly they respond to buyers, and you've found sellers sending
      instant template replies that don't answer anything. How would you redesign the metric?
    expected_concepts:
      - return to what buyers actually value
      - measure resolution or quality rather than speed alone
      - combine several signals to make gaming harder
      - consider effects on sellers who play fair and plan the transition
      - monitor for new gaming after the change
    rubric:
      excellent: Reframes the metric around buyer outcomes, proposes a composite of speed and quality signals that is hard to game, considers the impact on sellers during transition, and plans ongoing monitoring.
      good: Proposes a better metric that captures quality as well as speed.
      weak: Bans template replies or adds a rule without fixing the underlying incentive.
    followups:
      - How would you detect low-quality replies at scale?
      - How would you communicate the change to sellers?
    common_errors:
      - Patching one loophole while keeping the same incentive.

  - external_key: problem_solving.product_business_cases.pricing_page_rollback_dilemma
    competency_key: product_sense
    topic: A launch with good revenue and bad signals
    difficulty: hard
    text: >-
      After launching a new pricing page, revenue is up eight percent, but refund requests and complaints about
      unclear billing have also risen. Leadership is happy. What would you do?
    expected_concepts:
      - quantify refunds, chargebacks and churn against the revenue gain
      - investigate which page elements cause confusion
      - consider long-term trust and regulatory risk
      - propose fixes that keep the gain without misleading users
      - make the case to leadership with data
    rubric:
      excellent: Nets refunds and expected churn against the gain, identifies the confusing elements, flags trust and compliance risks, and proposes fixes and a test while making a data-backed case to leadership.
      good: Recognises the hidden costs and proposes changes to the page.
      weak: Accepts the revenue win or reverts entirely without analysis.
    followups:
      - How would you estimate the long-term cost of the complaints?
      - What would you say if leadership wanted to keep the page as it is?
    common_errors:
      - Counting gross revenue without subtracting refunds and churn.

  - external_key: problem_solving.product_business_cases.sunset_legacy_desktop
    competency_key: product_sense
    topic: Sunsetting a legacy product with valuable users
    difficulty: hard
    text: >-
      A legacy desktop product is used by only five percent of customers but brings in twenty percent of revenue,
      and it's slowing down the whole engineering team. How would you decide what to do with it?
    expected_concepts:
      - understand who the legacy customers are and why they stay
      - quantify the engineering and opportunity cost
      - options such as migrate, freeze, reprice or sunset
      - migration path and timeline that protects revenue
      - communication and risk management plan
    rubric:
      excellent: Understands why high-value customers depend on it, quantifies its true cost, compares options including a migration with feature parity for critical workflows, and lays out a phased plan that protects revenue.
      good: Weighs revenue against cost and proposes a migration or reduced-maintenance plan.
      weak: Recommends shutting it down for efficiency or keeping it for revenue without a plan.
    followups:
      - What would you need in the new product before asking these customers to move?
      - How would you handle a customer who refuses to migrate?
    common_errors:
      - Underestimating how much revenue is at risk during a forced migration.
