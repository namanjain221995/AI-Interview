# Curated questions: structured thinking for open-ended problems (any role). Scenarios test how the
# candidate frames an ambiguous problem, decomposes it, surfaces assumptions and reasons from first
# principles. Evaluation is based only on the reasoning the candidate describes.
version: 1
defaults:
  role_tags: [general]
  round_types: [problem_solving, combined]
  kind: scenario
  competency_key: problem_solving
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.structured_thinking.vague_unhappy_customers
    topic: Clarifying a vague request
    difficulty: easy
    text: >-
      Your manager stops by and says, "Customers are unhappy, can you sort it out?" and then leaves for a week.
      What would you do in the first couple of days to turn that into a problem you can actually work on?
    expected_concepts:
      - find out which customers and what "unhappy" is based on
      - gather existing evidence such as complaints, reviews or churn
      - turn the request into a specific, bounded problem statement
      - agree what improvement would count as success
      - confirm the framing with the manager or a stakeholder before investing heavily
    rubric:
      excellent: Collects concrete evidence about who is unhappy and why, narrows the request to a specific problem with a success measure, and checks that framing with someone before committing effort.
      good: Asks sensible clarifying questions and looks at some evidence before acting.
      weak: Starts fixing whatever they assume the problem is without clarifying or checking evidence.
    followups:
      - Who would you talk to first, and what would you ask them?
      - What would you do if the evidence pointed to three different problems at once?
    common_errors:
      - Jumping straight to a favourite solution.
      - Treating one loud complaint as the whole picture.

  - external_key: problem_solving.structured_thinking.report_is_wrong
    topic: Getting from a complaint to a problem statement
    difficulty: easy
    text: >-
      A colleague tells you "the monthly report is wrong" but can't say much more. How would you get from that
      statement to a clear description of what's actually wrong?
    expected_concepts:
      - ask for a concrete example of a wrong figure
      - establish what the expected value was and why
      - check whether it is wrong always, recently or for one section
      - separate wrong data from wrong presentation or misunderstanding
      - write down a precise problem statement before fixing
    rubric:
      excellent: Uses concrete examples to pin down which values differ from what expectation, how long it has been happening and where, and produces a precise problem statement before changing anything.
      good: Asks for examples and narrows down the scope of the issue.
      weak: Starts re-checking the whole report or rebuilding it without knowing what is wrong.
    followups:
      - What if it turns out the numbers are correct but people read them differently?
      - How would you know when the problem is fully solved?
    common_errors:
      - Assuming the data is wrong without checking the expectation.

  - external_key: problem_solving.structured_thinking.workshop_breakdown
    topic: Breaking a task into workstreams
    difficulty: easy
    text: >-
      You have three weeks to organise a two-day training workshop for about forty people in another city.
      How would you break that work into pieces so nothing important gets missed?
    expected_concepts:
      - identify the main workstreams such as venue, travel, content, attendees and budget
      - spot dependencies and items with long lead times
      - order work by deadline and dependency
      - assign owners and checkpoints
      - keep a simple tracker or checklist
    rubric:
      excellent: Splits the work into distinct workstreams, identifies dependencies and long lead-time items to start first, and sets checkpoints so gaps surface early.
      good: Produces a sensible list of tasks with some ordering.
      weak: Lists tasks in random order with no sense of dependencies or priority.
    followups:
      - Which item would you lock in on day one, and why?
      - How would you check that your breakdown hasn't left something out?
    common_errors:
      - Ignoring lead times such as booking travel or venues.

  - external_key: problem_solving.structured_thinking.defining_success_onboarding
    topic: Defining success before starting
    difficulty: easy
    text: >-
      You've been asked to improve onboarding for new hires in your department. Before changing anything, how
      would you decide what a successful outcome looks like?
    expected_concepts:
      - understand what is going wrong today and for whom
      - pick observable outcomes such as time to first independent task
      - use feedback from recent joiners and their managers
      - set a baseline to compare against
      - agree the goal with whoever asked for the work
    rubric:
      excellent: Defines success in observable terms tied to the real pain point, establishes a baseline, and agrees the goal with the requester before making changes.
      good: Names some measurable outcomes and gathers input from people involved.
      weak: Defines success as finishing a list of activities, such as writing a new handbook.
    followups:
      - How would you measure something like "feeling productive sooner"?
      - What if the people who asked for this disagree on the goal?
    common_errors:
      - Measuring outputs produced rather than outcomes achieved.

  - external_key: problem_solving.structured_thinking.retro_ten_problems
    topic: Choosing which problem to tackle first
    difficulty: easy
    text: >-
      Your team's retrospective produced a list of ten problems, and everyone has a different favourite. How
      would you help the team decide which ones to work on first?
    expected_concepts:
      - group duplicates and related problems
      - estimate impact and effort for each
      - look for problems that cause other problems
      - agree a small number to tackle and an owner for each
      - revisit the list later
    rubric:
      excellent: Groups overlapping items, compares them on impact and effort, looks for root problems that drive others, and leads the team to a small committed set with owners.
      good: Uses some criteria such as impact and effort to pick a few items.
      weak: Picks by vote or by whatever is easiest without any criteria.
    followups:
      - What would you do with the problems that didn't make the cut?
      - How would you handle a problem that is high impact but nobody wants to own?
    common_errors:
      - Trying to address all ten at once.

  - external_key: problem_solving.structured_thinking.hidden_plan_assumptions
    topic: Surfacing the assumptions behind a plan
    difficulty: easy
    text: >-
      Imagine your team has a plan to move all customer files to a new storage system over a weekend. How would
      you go about finding the assumptions that plan quietly depends on?
    expected_concepts:
      - walk through the plan step by step asking what must be true
      - list assumptions about time, people, access and data volume
      - rank assumptions by how likely they are wrong and how costly
      - check the riskiest assumptions before the weekend
      - prepare a fallback for ones that can't be checked
    rubric:
      excellent: Systematically walks the plan to list what must hold true, ranks those assumptions by risk, verifies the riskiest in advance and prepares fallbacks.
      good: Identifies several realistic assumptions and suggests checking some of them.
      weak: Lists generic risks without linking them to the plan or testing anything.
    followups:
      - Which assumption would you test first, and how?
      - What would you do with an assumption that can only be tested on the day?
    common_errors:
      - Confusing assumptions with tasks.

  - external_key: problem_solving.structured_thinking.shared_drive_cleanup
    topic: Starting with a smaller version of the problem
    difficulty: easy
    text: >-
      You're asked to reorganise a shared drive holding ten years of files from several teams, and it feels too
      big to know where to start. How would you find a manageable first piece?
    expected_concepts:
      - pick a small, representative slice such as one team or folder
      - learn the patterns and problems from that slice
      - define a target structure and rules from what was learned
      - refine before scaling to the rest
      - involve the people who use the files
    rubric:
      excellent: Chooses a deliberately representative slice, uses it to learn and test a target structure, refines the approach and then scales it with input from file owners.
      good: Starts with a sensible subset and expands from there.
      weak: Tries to design the whole structure up front or starts moving files at random.
    followups:
      - How would you choose which slice is representative?
      - What would tell you the approach is ready to roll out more widely?
    common_errors:
      - Designing the perfect structure without testing it on real files.

  - external_key: problem_solving.structured_thinking.inherited_investigation
    topic: Picking up a half-finished investigation
    difficulty: easy
    text: >-
      You inherit a half-finished investigation from a colleague who has moved to another team, and all you have
      are their scattered notes. How do you get your bearings before continuing?
    expected_concepts:
      - reconstruct the original question and why it mattered
      - separate confirmed findings from open guesses in the notes
      - list what was ruled out and how
      - check whether the problem has changed since
      - ask the colleague a few targeted questions
    rubric:
      excellent: Reconstructs the goal, sorts the notes into verified facts, open hypotheses and ruled-out options, checks what has changed, and asks the previous owner focused questions.
      good: Reviews the notes and talks to the colleague before continuing.
      weak: Starts again from scratch or continues blindly from the last note.
    followups:
      - How would you decide whether to trust a conclusion you can't verify?
      - What would you write down so the next person doesn't face the same problem?
    common_errors:
      - Treating every note as a confirmed fact.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.structured_thinking.late_projects_issue_tree
    topic: Building a non-overlapping breakdown of causes
    difficulty: medium
    text: >-
      Most projects in a department are finishing later than planned. How would you break down the possible
      reasons so that you cover everything without the categories overlapping?
    expected_concepts:
      - split into clear branches such as planning, execution and external factors
      - check that branches don't overlap and together cover the whole problem
      - go one or two levels deeper on each branch
      - use data from past projects to test each branch
      - focus effort on the branches with the most evidence
    rubric:
      excellent: Builds a clean, mutually exclusive breakdown, explains how they check it is complete, and uses evidence from past projects to prune branches and focus on the biggest drivers.
      good: Produces reasonable categories of causes and some way to test them.
      weak: Gives a loose list of possible reasons that overlap and is not tied to evidence.
    followups:
      - How would you know your breakdown has a gap?
      - Which branch would you investigate first, and why?
    common_errors:
      - Categories like "people problems" and "communication problems" that overlap heavily.

  - external_key: problem_solving.structured_thinking.ticket_volume_hypotheses
    topic: Leading with hypotheses instead of all the data
    difficulty: medium
    text: >-
      Support ticket volume doubled over the last month. Rather than pulling every piece of data you can find,
      how would you form a few hypotheses and decide what to look at first?
    expected_concepts:
      - brainstorm plausible explanations quickly
      - state what evidence would confirm or rule out each one
      - check cheap, decisive evidence first such as ticket categories and timing
      - drop or refine hypotheses as evidence comes in
      - keep track of what has been ruled out
    rubric:
      excellent: Generates distinct hypotheses, names the specific evidence that would separate them, starts with the cheapest decisive checks and updates the list as results arrive.
      good: Forms hypotheses and links them to some data to check.
      weak: Collects large amounts of data hoping the answer emerges.
    followups:
      - What single piece of data would split your hypotheses the most?
      - What would you do if none of your hypotheses held up?
    common_errors:
      - Only generating hypotheses that support an existing belief.

  - external_key: problem_solving.structured_thinking.tool_cost_first_principles
    topic: Checking a figure from first principles
    difficulty: medium
    text: >-
      You're told an internal tool costs the company two hundred thousand a year to run, and nobody can explain
      why. How would you rebuild that number from its basic components to see whether it makes sense?
    expected_concepts:
      - list the cost components such as licences, infrastructure, support time and vendors
      - estimate each component from known quantities and rates
      - compare the rebuilt total with the quoted figure
      - investigate the largest gaps
      - separate fixed from usage-driven costs
    rubric:
      excellent: Breaks the cost into its fundamental drivers, estimates each from quantities and rates, compares the result to the quoted figure and digs into the largest discrepancies.
      good: Lists the main cost components and estimates a rough total.
      weak: Accepts or rejects the figure based on gut feel.
    followups:
      - Which component would you expect to be most uncertain?
      - How would your approach change if the number were ten times higher?
    common_errors:
      - Forgetting people time as a cost.

  - external_key: problem_solving.structured_thinking.real_vs_assumed_constraints
    topic: Testing whether a constraint is real
    difficulty: medium
    text: >-
      A team tells you they can only release changes once a month "because of the approval process." How would
      you work out which parts of that constraint are real and which are just habit?
    expected_concepts:
      - trace the constraint to its source such as a policy, regulation or tool
      - find out what risk the approval is meant to control
      - separate the underlying requirement from how it is currently met
      - look for other ways to meet the same requirement
      - confirm with the owner of the rule
    rubric:
      excellent: Traces the constraint back to the actual rule and the risk it protects against, separates that need from the current practice, and proposes alternatives validated with the rule's owner.
      good: Questions the constraint and asks who set it and why.
      weak: Either accepts the constraint as fixed or dismisses it without understanding it.
    followups:
      - What would you do if the rule turned out to be a legal requirement?
      - How would you propose a change without undermining the people who set the rule?
    common_errors:
      - Assuming a constraint is arbitrary because nobody remembers its reason.

  - external_key: problem_solving.structured_thinking.two_active_customer_numbers
    topic: Reconciling conflicting definitions
    difficulty: medium
    text: >-
      Sales and Finance both report the number of "active customers," and their figures differ by thirty percent.
      How would you work out what's going on?
    expected_concepts:
      - get each team's exact definition and data source
      - compare the definitions side by side
      - reconcile using a sample of specific customers
      - explain the gap in parts that add up
      - agree a shared definition or clear labels for each
    rubric:
      excellent: Obtains precise definitions and sources, reconciles them on concrete customer records, explains the full gap piece by piece and drives agreement on definitions.
      good: Identifies that the definitions likely differ and compares them.
      weak: Picks one number as correct without investigating.
    followups:
      - Which customers would you sample to explain the difference fastest?
      - What if both definitions are valid for different purposes?
    common_errors:
      - Assuming one team made a mistake.

  - external_key: problem_solving.structured_thinking.vendor_by_friday
    topic: Deciding which missing information matters
    difficulty: medium
    text: >-
      You have to choose between two suppliers by Friday, and about half the information you'd ideally want
      won't arrive in time. How do you decide which missing pieces are worth chasing and which you can live
      without?
    expected_concepts:
      - list the open questions explicitly
      - ask whether each answer could change the decision
      - estimate the cost of being wrong on each point
      - chase only decision-changing information
      - make reasonable assumptions for the rest and note them
    rubric:
      excellent: Tests each missing item by asking whether it could flip the decision, focuses effort on those few, documents assumptions for the rest and notes how the decision could be revisited.
      good: Prioritises the most important missing information sensibly.
      weak: Delays the decision or treats all missing information as equally important.
    followups:
      - How would you build some protection into the contract given what you don't know?
      - What would make you ask for the deadline to move?
    common_errors:
      - Gathering information that wouldn't change the choice.

  - external_key: problem_solving.structured_thinking.late_deliveries_root_cause
    topic: Getting past the obvious explanation
    difficulty: medium
    text: >-
      About one in five orders arrives late, and the operations managers are sure it's the courier's fault. How
      would you find out whether that's really the root cause?
    expected_concepts:
      - map the order journey and measure time at each step
      - check whether lateness is created before or after handover
      - compare across couriers, regions and order types
      - ask why repeatedly until reaching a fixable cause
      - test the explanation against counter-examples
    rubric:
      excellent: Measures where time is lost across the full journey, compares segments to isolate the cause, keeps asking why until reaching something fixable and checks the conclusion against cases that don't fit.
      good: Looks at data across the process rather than accepting the courier explanation.
      weak: Accepts the popular explanation or blames a different party without evidence.
    followups:
      - What would you expect to see in the data if it really were the courier?
      - How would you present findings that contradict what the managers believe?
    common_errors:
      - Stopping at the first plausible cause.

  - external_key: problem_solving.structured_thinking.work_backwards_launch
    topic: Working backwards from the goal
    difficulty: medium
    text: >-
      Your company wants to open a new service in another city in six months. How would working backwards from
      launch day help you structure the plan?
    expected_concepts:
      - define what must be true on launch day
      - derive the prerequisites for each of those conditions
      - identify the critical path and long lead-time items
      - set intermediate milestones and deadlines
      - spot what is already late or infeasible
    rubric:
      excellent: Starts from a concrete definition of launch readiness, derives prerequisites backwards to find the critical path and earliest start dates, and uses that to flag infeasible items now.
      good: Works back from the goal to set milestones.
      weak: Lists tasks forward from today without checking they reach the goal in time.
    followups:
      - What would you do if working backwards shows you should have started a month ago?
      - How would you handle a prerequisite with an unknown lead time?
    common_errors:
      - Defining launch readiness too vaguely to derive prerequisites.

  - external_key: problem_solving.structured_thinking.unreliable_source_midway
    topic: Adapting when a key input fails
    difficulty: medium
    text: >-
      Halfway through an analysis your team is relying on, you discover that one of the main data sources is
      unreliable. How would you decide what to do next?
    expected_concepts:
      - establish how unreliable and in what way
      - identify which conclusions depend on that source
      - look for alternative sources or ways to cross-check
      - tell stakeholders early about the impact
      - re-plan scope or timeline as needed
    rubric:
      excellent: Characterises the problem with the source, traces which conclusions are affected, finds cross-checks or alternatives, and informs stakeholders early with a revised plan.
      good: Assesses the impact and looks for an alternative source.
      weak: Continues with the bad data or abandons the analysis entirely.
    followups:
      - How would you salvage the parts of the work that are still valid?
      - What would you tell stakeholders who already saw early results?
    common_errors:
      - Not telling anyone until the deadline.

  - external_key: problem_solving.structured_thinking.cut_meeting_time
    topic: Generating options beyond the obvious
    difficulty: medium
    text: >-
      You're asked to cut the time a fifty-person department spends in meetings by a third. How would you come up
      with options beyond the obvious ones, and then choose between them?
    expected_concepts:
      - measure where meeting time goes today
      - break down by meeting type, size and purpose
      - generate options at different levels such as removing, shortening or replacing meetings
      - compare options on impact and side effects
      - pilot and measure before rolling out widely
    rubric:
      excellent: Measures the current state, breaks it down by meeting type, generates a broad set of options at different levels, compares them on impact and side effects and pilots the best ones.
      good: Proposes several reasonable options with some basis for choosing.
      weak: Suggests a single blanket rule such as no-meeting days without analysis.
    followups:
      - How would you make sure the work the meetings did doesn't just disappear?
      - Which option would you expect people to resist, and how would you handle that?
    common_errors:
      - Cutting meetings without understanding what decisions they enable.

  - external_key: problem_solving.structured_thinking.dashboard_no_detail
    topic: Scoping an underspecified deliverable
    difficulty: medium
    text: >-
      Senior leadership asks for "a dashboard" for their weekly meeting and gives no further detail. How would
      you scope what to build?
    expected_concepts:
      - find out which decisions the dashboard should support
      - identify the audience and how they will use it
      - list the questions it must answer
      - agree a small first version and get feedback
      - define what is out of scope
    rubric:
      excellent: Anchors the scope on the decisions and questions leadership needs answered, agrees a minimal first version with explicit exclusions, and plans to iterate based on actual use.
      good: Clarifies the audience and the main metrics before building.
      weak: Builds a dashboard with every available metric.
    followups:
      - How would you handle requests to add more and more charts?
      - What would tell you the dashboard is actually being used?
    common_errors:
      - Starting from available data rather than needed decisions.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.structured_thinking.ownerless_cross_team_problem
    topic: Structuring a problem nobody owns
    difficulty: hard
    text: >-
      Customer records keep getting corrupted as they pass from sales to onboarding to billing to support, and
      each team says the errors start somewhere else. How would you structure this problem and get it moving?
    expected_concepts:
      - map the end-to-end flow and the handoffs
      - sample bad records and trace where each error first appears
      - classify error types by where they originate
      - define clear ownership for each handoff
      - get a sponsor who spans all teams
      - add checks at handoffs and track error rates
    rubric:
      excellent: Maps the full flow, traces real bad records to where errors originate, classifies them by origin, and secures cross-team ownership with handoff checks and a measure of progress.
      good: Maps the process and gathers evidence on where errors start.
      weak: Picks one team to fix it or proposes a meeting with no structure.
    followups:
      - How would you get teams to accept evidence that errors start with them?
      - What would you do if a single source accounts for most errors?
    common_errors:
      - Arguing about ownership before establishing facts.
      - Fixing data downstream without stopping the source.

  - external_key: problem_solving.structured_thinking.approval_three_weeks_to_days
    topic: Redesigning a process from first principles
    difficulty: hard
    text: >-
      A purchasing approval process takes three weeks and you're asked to bring it down to three days. How
      would you redesign it from first principles instead of trimming steps from the current one?
    expected_concepts:
      - state the fundamental purpose such as controlling spend and risk
      - identify the minimum information and decisions needed
      - segment requests by risk and value
      - design the simplest path for each segment
      - measure where time is waiting versus working today
      - check the new design still meets controls
    rubric:
      excellent: Starts from what the process must achieve, designs risk-tiered paths with only the necessary decisions, uses data on waiting time to validate the design and confirms controls are still met.
      good: Questions the purpose of steps and proposes a simpler design for most requests.
      weak: Shaves a day here and there from existing steps.
    followups:
      - How would you convince the finance team that controls are still adequate?
      - What would you do with the rare requests that don't fit any tier?
    common_errors:
      - Removing controls without understanding the risk they address.

  - external_key: problem_solving.structured_thinking.survey_vs_usage
    topic: Reconciling contradictory evidence
    difficulty: hard
    text: >-
      A customer survey says people love a particular feature, but usage data shows almost nobody uses it. How
      would you work out which picture is closer to the truth and what to do about it?
    expected_concepts:
      - question how each source was collected and who it represents
      - check definitions such as what counts as usage
      - consider explanations where both are true
      - design a check that separates the explanations
      - decide what action fits each explanation
    rubric:
      excellent: Examines the method and sample behind each source, develops explanations under which both could be true, designs a test that separates them, and ties the next action to the result.
      good: Questions both sources and suggests gathering more evidence.
      weak: Trusts one source by default and ignores the other.
    followups:
      - What if the survey respondents are your largest customers?
      - How could a feature be valuable but rarely used?
    common_errors:
      - Dismissing survey data as useless or usage data as incomplete without checking.

  - external_key: problem_solving.structured_thinking.retire_product_decision
    topic: Structuring a high-stakes, ambiguous decision
    difficulty: hard
    text: >-
      Leadership is considering retiring an old product that costs a lot to maintain and is used by a small but
      important set of customers. How would you structure that decision so it isn't just a debate of opinions?
    expected_concepts:
      - define the options including partial ones such as freezing features or migration paths
      - identify the criteria such as cost, revenue at risk and customer impact
      - gather evidence for each criterion
      - separate reversible from irreversible parts
      - identify who decides and who must be consulted
    rubric:
      excellent: Lays out a full option set including middle paths, agrees criteria up front, gathers evidence for each, separates reversible from irreversible steps and clarifies decision rights.
      good: Compares options on several criteria with some evidence.
      weak: Frames it as a yes or no choice and argues for one side.
    followups:
      - Which piece of evidence would carry the most weight for you?
      - How would you stage the decision so you can learn before committing fully?
    common_errors:
      - Ignoring options between keep and kill.

  - external_key: problem_solving.structured_thinking.solving_wrong_problem
    topic: Suspecting you are solving the wrong problem
    difficulty: hard
    text: >-
      A few weeks into a project, you start to suspect the team is solving the wrong problem. How would you test
      that suspicion, and what would you do if it turned out to be right?
    expected_concepts:
      - articulate what makes you suspect it
      - revisit the original goal and evidence for the problem
      - find a quick, concrete test such as talking to users or checking data
      - present evidence rather than opinion to the team and sponsor
      - propose a reframed problem and what to keep from the work so far
    rubric:
      excellent: Turns the suspicion into a testable claim, checks it quickly against the original goal and fresh evidence, and if confirmed brings a clear reframed problem and salvage plan to the sponsor.
      good: Tests the concern and raises it with the team.
      weak: Keeps quiet to avoid disruption, or stops the project on instinct alone.
    followups:
      - How would you handle a sponsor who is attached to the original problem?
      - What would you do to catch this earlier next time?
    common_errors:
      - Treating sunk effort as a reason to continue.

  - external_key: problem_solving.structured_thinking.ticket_speed_incentive
    topic: Thinking through second-order effects
    difficulty: hard
    text: >-
      Someone proposes rewarding support staff for closing tickets faster. Before it rolls out, how would you
      think through the knock-on effects it might have?
    expected_concepts:
      - identify the behaviour the incentive encourages
      - list ways it could be gamed such as closing without resolving
      - trace effects on customers, reopen rates and other teams
      - pair the measure with balancing measures such as quality or reopen rate
      - pilot and monitor for unintended effects
    rubric:
      excellent: Traces how the incentive changes behaviour, identifies specific gaming and downstream effects, proposes balancing measures and a monitored pilot.
      good: Identifies some likely unintended effects and suggests a counterweight.
      weak: Evaluates only the intended benefit.
    followups:
      - Which balancing measure would you add, and why that one?
      - How long would you run a pilot before judging it?
    common_errors:
      - Assuming people will optimise for the intent rather than the measure.
