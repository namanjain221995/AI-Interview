# Curated questions: structured estimation and back-of-the-envelope reasoning (part 1 of 4).
# Capacity, storage, cost, traffic and timeline estimates spoken aloud. Evaluation looks at the
# structure of the reasoning (assumptions, decomposition, arithmetic, sanity checks), not at
# landing on one "correct" number.
version: 1
defaults:
  role_tags: [general, backend, cloud, product_manager]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.estimation.chat_messages_per_second
    competency_key: problem_solving
    topic: Request rate from daily active users
    difficulty: easy
    text: >-
      Picture a team chat app with about five million daily active users. Roughly how many messages per
      second would the backend need to handle, both on average and at the busiest moment of the day?
    expected_concepts:
      - assumption for messages sent per user per day
      - dividing by roughly 100,000 seconds in a day
      - peak-to-average multiplier from working-hours concentration
      - distinguishing messages sent from deliveries to recipients
      - rounding to keep the arithmetic simple
    rubric:
      excellent: States messages per user, converts to an average rate with clean rounding, applies a justified peak factor for business hours, and points out that delivery fan-out multiplies the work beyond messages sent.
      good: Reaches a plausible average and peak rate with stated assumptions, though the peak factor is loosely justified.
      weak: Gives a number without assumptions or forgets to convert from per day to per second.
    followups:
      - How would the answer change if most users sit in channels with hundreds of members?
      - What would you look at to check your peak factor against reality?
    common_errors:
      - Using 24 hours of even traffic for a product used mainly during the working day.
      - Confusing messages written with messages delivered.

  - external_key: problem_solving.estimation.ticket_archive_storage
    competency_key: problem_solving
    topic: Text record storage over several years
    difficulty: easy
    text: >-
      A customer support tool keeps every ticket and every reply forever. If a mid-sized company
      using it opens around two thousand tickets a day, how much storage would five years of text
      take, and does that number worry you?
    expected_concepts:
      - replies per ticket and characters per reply
      - bytes per character and metadata overhead
      - multiplying by days and years with round numbers
      - attachments as a separate and much larger driver
      - concluding whether the size is small or large in practice
    rubric:
      excellent: Builds the estimate from tickets, replies and message size, separates attachments from text, adds indexes and replicas, and concludes sensibly that text alone is small while attachments dominate.
      good: Produces a reasonable text estimate with clear steps and notes attachments matter.
      weak: Guesses a size with no breakdown or makes an order-of-magnitude unit error.
    followups:
      - If customers can attach screenshots, how does the picture change?
      - Which part of this would you actually put in a relational database?
    common_errors:
      - Ignoring attachments entirely.
      - Mixing up kilobytes and megabytes when multiplying.

  - external_key: problem_solving.estimation.fleet_log_volume
    competency_key: problem_solving
    topic: Daily log volume across a fleet
    difficulty: easy
    text: >-
      Your company runs about two hundred application servers, and everyone complains that the logging
      bill keeps growing. How would you estimate how many gigabytes of logs the fleet produces in a day?
    expected_concepts:
      - log lines per request or per second per server
      - average bytes per log line including structured fields
      - multiplying across servers and seconds in a day
      - checking against the logging tool's own ingestion numbers
      - identifying the noisiest services or log levels
    rubric:
      excellent: Decomposes into lines per second, bytes per line and server count, gets a daily figure, and proposes validating it against the vendor's ingestion data and finding the top contributors.
      good: Builds a sensible estimate with clear assumptions but does not suggest how to verify it.
      weak: Cannot break the problem into per-server pieces or never reaches a number.
    followups:
      - Which single assumption would you measure first?
      - How would you use the estimate to decide what to stop logging?
    common_errors:
      - Assuming every server logs at the same rate.

  - external_key: problem_solving.estimation.cross_region_copy_time
    competency_key: problem_solving
    topic: Data transfer time over a network link
    difficulty: easy
    text: >-
      You need to copy fifty terabytes of data to a new cloud region, and you have a ten gigabit per
      second link available. How long would you plan for, and what would you tell the project manager?
    expected_concepts:
      - converting bits to bytes (roughly 1.25 gigabytes per second)
      - realistic link utilisation well below the theoretical maximum
      - total time in hours or days with a buffer
      - verification, retries and checksum time
      - alternatives such as physical transfer appliances or incremental sync
    rubric:
      excellent: Converts units correctly, derates the link to a realistic utilisation, arrives at a time range of roughly half a day to a couple of days, and adds time for verification while mentioning incremental or offline options.
      good: Gets the bits-to-bytes conversion right and reaches a plausible duration.
      weak: Treats gigabits as gigabytes or assumes the link runs at full speed with no overhead.
    followups:
      - What if the data keeps changing while you copy it?
      - At what size would you consider shipping disks instead?
    common_errors:
      - Forgetting the factor of eight between bits and bytes.
      - Promising the theoretical best case as the plan.

  - external_key: problem_solving.estimation.notification_email_volume
    competency_key: problem_solving
    topic: Notification email volume and send rate
    difficulty: easy
    text: >-
      An online store with two million registered customers wants to add order updates and a weekly
      newsletter by email. How many emails would that be per day, and what sending rate would the
      system need?
    expected_concepts:
      - orders per day and emails per order
      - newsletter volume spread across the week or sent in one burst
      - active versus registered customers and opt-in rates
      - required send rate for the burst window
      - provider rate limits and cost per thousand emails
    rubric:
      excellent: Separates transactional and marketing volume, uses active and opted-in customers rather than all registered ones, and works out the send rate needed for the newsletter window along with provider limits.
      good: Produces daily volume for both kinds with sensible assumptions.
      weak: Multiplies all registered customers by an arbitrary number with no separation of email types.
    followups:
      - If the newsletter must go out within one hour, what rate is that?
      - How would you keep the newsletter from delaying order emails?
    common_errors:
      - Assuming every registered customer is active and opted in.

  - external_key: problem_solving.estimation.availability_downtime_minutes
    competency_key: problem_solving
    topic: Availability targets as downtime budgets
    difficulty: easy
    text: >-
      Your team has been asked to commit to ninety-nine point nine percent monthly availability. Work out
      roughly how much downtime that actually allows, and tell me what that number means for how you deploy.
    expected_concepts:
      - minutes in a month (about 43,000)
      - 0.1 percent equals roughly 43 minutes
      - comparing with 99.99 percent (about 4 minutes)
      - deploy-related incidents consuming the budget
      - implications for rollback speed and progressive rollouts
    rubric:
      excellent: Computes about 43 minutes per month, contrasts it with the next nine, and connects the budget to concrete practices such as fast rollback, canaries and limiting risky changes when the budget is spent.
      good: Computes the downtime budget correctly and makes one practical connection to deployment.
      weak: Cannot convert the percentage into time or treats the target as easy without reasoning.
    followups:
      - How many incidents of fifteen minutes each could you afford in a quarter?
      - Would you count partial outages, and how?
    common_errors:
      - Calculating against a year when the commitment is monthly.

  - external_key: problem_solving.estimation.ci_pipeline_migration_duration
    competency_key: project_management
    topic: Timeline estimate for a repetitive migration
    difficulty: easy
    text: >-
      Your team owns forty microservices, and each one needs its build pipeline moved to a new CI system.
      How would you estimate how long the whole migration takes?
    expected_concepts:
      - migrating one or two services first to measure real effort
      - grouping services by similarity or complexity
      - parallelism limited by people and review capacity
      - buffer for outliers and unknowns
      - giving a range rather than a single date
    rubric:
      excellent: Proposes pilot migrations to calibrate, groups services by complexity, multiplies with realistic parallelism and a buffer for the hard cases, and communicates a range that narrows as work progresses.
      good: Breaks the work down per service and adds some contingency.
      weak: Multiplies forty by a guessed figure with no calibration or contingency.
    followups:
      - After the first five services, you're running twice as slow as planned. What do you do with the estimate?
      - How would you explain the uncertainty to your manager?
    common_errors:
      - Assuming every service takes the same effort as the easiest one.

  - external_key: problem_solving.estimation.sanity_check_claim
    competency_key: problem_solving
    topic: Sanity-checking someone else's number
    difficulty: easy
    text: >-
      In a planning meeting, a colleague says a new activity-tracking feature will generate ten terabytes
      of data per day. You have about thirty seconds to decide whether that sounds right. How would you check it?
    expected_concepts:
      - working backwards to events per user per day
      - comparing with the known number of active users
      - bytes per event as a reasonableness check
      - comparing with existing data volumes in the company
      - asking which assumption the colleague used
    rubric:
      excellent: Inverts the claim into bytes per user per day, compares that with realistic event counts and sizes, and asks the colleague for their assumptions instead of just accepting or dismissing the number.
      good: Does a quick reverse calculation and reaches a reasoned view on plausibility.
      weak: Accepts or rejects the number on gut feeling alone.
    followups:
      - Suppose your quick check says it's a hundred times too high. How do you raise that?
    common_errors:
      - Dismissing the number without doing any arithmetic.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.estimation.lecture_video_storage
    competency_key: problem_solving
    topic: Video storage with multiple renditions
    difficulty: medium
    text: >-
      An online learning platform lets instructors upload lecture videos, and about three thousand hours
      of new video arrive each month. Estimate how much storage they'll need after three years.
    expected_concepts:
      - bitrate to gigabytes per hour conversion
      - multiple resolutions or adaptive streaming renditions
      - keeping or discarding the original upload
      - cumulative growth over 36 months
      - redundancy or replication overhead in object storage
    rubric:
      excellent: Converts bitrate to size per hour, adds renditions and originals, accumulates over three years, accounts for redundancy, and identifies whether keeping originals is the biggest lever.
      good: Reaches a reasonable total with renditions included and clear steps.
      weak: Uses one file size with no renditions or makes a bitrate unit error.
    followups:
      - Which renditions could you generate on demand instead of storing?
      - How would you move older lectures to cheaper storage?
    common_errors:
      - Confusing megabits per second with megabytes per second.

  - external_key: problem_solving.estimation.streaming_egress_bill
    competency_key: cloud_cost_optimization
    topic: Bandwidth and egress cost
    difficulty: medium
    text: >-
      Students on that same learning platform watch around two million hours of video a month. Walk me
      through estimating the monthly bandwidth and what it might cost to deliver.
    expected_concepts:
      - average delivered bitrate across devices
      - hours watched times gigabytes per hour
      - CDN pricing per gigabyte versus direct cloud egress
      - volume discounts and tiered pricing
      - levers such as lower default resolution or better encoding
    rubric:
      excellent: Converts watch hours to terabytes using a realistic blended bitrate, prices it under both CDN and raw egress, and names concrete levers such as codec choice or default quality with their rough savings.
      good: Gets a plausible transfer volume and applies a per-gigabyte price.
      weak: Cannot connect watch time to data volume or ignores price entirely.
    followups:
      - Which lever would you pull first, and why?
      - How would a jump to mostly mobile viewers change the bill?
    common_errors:
      - Assuming everyone streams at the highest resolution.

  - external_key: problem_solving.estimation.session_cache_memory
    competency_key: problem_solving
    topic: In-memory cache sizing
    difficulty: medium
    text: >-
      You want to keep login sessions in an in-memory store for a product with twenty million monthly users.
      How much memory would you provision, and how did you get there?
    expected_concepts:
      - concurrent or recently active sessions rather than all users
      - bytes per session including key and store overhead
      - expiry policy and its effect on resident sessions
      - replication and headroom for failover
      - per-node memory limits and node count
    rubric:
      excellent: Estimates live sessions from activity and expiry rather than total users, sizes each entry with store overhead, adds replicas and headroom, and turns that into a node count.
      good: Produces a sensible memory figure with per-session size and some headroom.
      weak: Multiplies all users by a guessed size and stops, ignoring expiry and overhead.
    followups:
      - What happens to your estimate if sessions last thirty days instead of one?
      - How would you notice you'd under-provisioned before users do?
    common_errors:
      - Forgetting the per-key overhead of the store itself.

  - external_key: problem_solving.estimation.api_fleet_instance_count
    competency_key: problem_solving
    topic: Server count from CPU cost per request
    difficulty: medium
    text: >-
      An API serves thirty thousand requests per second at peak, and profiling shows each request uses about
      fifteen milliseconds of CPU. How many eight-core instances would you run, and what margin would you add?
    expected_concepts:
      - total CPU-seconds per second at peak
      - cores per instance and target utilisation
      - headroom for a lost zone or instance failures
      - deploy capacity during rolling updates
      - validating with a load test
    rubric:
      excellent: Computes about 450 cores of work, divides by usable cores at a realistic target utilisation, adds headroom for zone loss and rollouts, and says how a load test would confirm the number.
      good: Does the core arithmetic correctly and adds some safety margin.
      weak: Runs instances at full utilisation or cannot convert milliseconds per request into cores.
    followups:
      - Why not run at ninety percent CPU?
      - How would garbage collection or noisy neighbours change your margin?
    common_errors:
      - Planning for one hundred percent utilisation.

  - external_key: problem_solving.estimation.orders_table_growth
    competency_key: databases
    topic: Database table and index growth
    difficulty: medium
    text: >-
      An orders table currently gets about four hundred thousand new rows a day. Estimate how big the table
      and its indexes will be in three years, and whether a single database instance will still cope.
    expected_concepts:
      - average row size including overhead
      - number and size of secondary indexes
      - total rows over three years with growth
      - working set versus total size in memory
      - archiving, partitioning or read replicas as options
    rubric:
      excellent: Estimates row and index size, projects with growth, compares the hot working set with instance memory, and lays out when partitioning or archiving becomes necessary.
      good: Produces a reasonable table size with indexes and comments on whether it fits.
      weak: Ignores indexes or growth and gives no view on single-instance limits.
    followups:
      - Which queries would suffer first as the table grows?
      - How would you decide what can be archived?
    common_errors:
      - Assuming indexes are negligible compared with the table.

  - external_key: problem_solving.estimation.queue_backlog_drain
    competency_key: problem_solving
    topic: Queue backlog drain time
    difficulty: medium
    text: >-
      After an outage, a work queue has four million messages waiting. Fifty consumers each process about
      two hundred messages a second, and new messages keep arriving at six thousand a second. How long until
      the backlog clears, and what would you do to speed it up?
    expected_concepts:
      - total consumer throughput of 10,000 per second
      - net drain rate after incoming traffic
      - drain time of roughly 1,000 seconds
      - downstream limits when adding consumers
      - prioritising or shedding stale messages
    rubric:
      excellent: Computes net drain rate and time correctly, then discusses whether scaling consumers is safe for downstream systems and whether old messages still matter.
      good: Gets the net drain arithmetic right and suggests adding consumers.
      weak: Ignores the incoming traffic or cannot set up the calculation.
    followups:
      - What if the database behind the consumers can only take eight thousand writes a second?
      - How would you set an alert that fires before a backlog like this grows?
    common_errors:
      - Dividing the backlog by consumer throughput and forgetting new arrivals.

  - external_key: problem_solving.estimation.support_assistant_llm_cost
    competency_key: problem_solving
    topic: LLM token cost for a product feature
    difficulty: medium
    text: >-
      Your company wants an AI assistant that drafts replies for support agents. Roughly what would it cost
      per month in model usage, and which assumptions would you want to pin down first?
    expected_concepts:
      - conversations per month and calls per conversation
      - input tokens including context and retrieved documents
      - output tokens per draft
      - price per million tokens for input and output
      - caching, smaller models or shorter context to reduce cost
    rubric:
      excellent: Builds cost from volume, input and output tokens and price, notices that retrieved context usually dominates input tokens, and proposes concrete reductions and a cost-per-ticket figure.
      good: Builds a token-based estimate with stated volumes and prices.
      weak: Guesses a monthly figure without thinking in tokens or volume.
    followups:
      - How does the cost per ticket compare with an agent's time on that ticket?
      - What would change if each draft needed three model calls?
    common_errors:
      - Counting only output tokens.

  - external_key: problem_solving.estimation.database_restore_time
    competency_key: problem_solving
    topic: Backup restore time versus recovery target
    difficulty: medium
    text: >-
      Your main database is about eight terabytes, and the business wants it back within two hours after a
      total loss. How would you estimate whether your current backup approach can actually meet that?
    expected_concepts:
      - download throughput from backup storage
      - restore and index rebuild time, not just copy time
      - replaying logs to reach the recovery point
      - application validation and cutover steps
      - testing a real restore to measure it
    rubric:
      excellent: Breaks restore into fetch, apply, replay and validation phases with throughput figures, shows whether the total fits two hours, and insists on a timed restore drill.
      good: Estimates transfer time and acknowledges other restore steps.
      weak: Assumes restore takes as long as the copy or never reaches an estimate.
    followups:
      - If it doesn't fit, which changes would bring it under two hours?
      - How often would you rehearse the restore?
    common_errors:
      - Ignoring log replay and index rebuild time.

  - external_key: problem_solving.estimation.clinic_scheduling_market
    competency_key: product_sense
    topic: Bottom-up market sizing
    difficulty: medium
    text: >-
      Suppose your team is considering a scheduling product for dental clinics in one country. How would you
      estimate the yearly revenue opportunity before spending any money on research?
    expected_concepts:
      - number of clinics from population and clinics per capita
      - share of clinics without a good existing tool
      - plausible price per clinic per month
      - realistic reachable share versus total market
      - cross-checking top-down and bottom-up
    rubric:
      excellent: Builds a bottom-up chain from clinics to price, separates total market from what is realistically reachable, cross-checks with another method and names the assumption to validate first.
      good: Produces a structured estimate with clinics, price and a market share.
      weak: Picks a big number or a percentage of a huge market with no chain of reasoning.
    followups:
      - Which number in your chain would you try to verify with five phone calls?
      - How would multi-location clinic groups change the estimate?
    common_errors:
      - Assuming the product captures the whole market.

  - external_key: problem_solving.estimation.nightly_batch_window
    competency_key: problem_solving
    topic: Batch job runtime against a time window
    difficulty: medium
    text: >-
      A nightly job reads about two billion rows, transforms them and writes results back, and it must finish
      inside a four-hour window. How would you estimate whether it fits before you run it at full size?
    expected_concepts:
      - throughput measured on a sample run
      - extrapolating with attention to non-linear steps
      - bottleneck identification (read, compute, write)
      - parallelism and its limits
      - margin for growth and reruns after failure
    rubric:
      excellent: Measures rows per second on a representative sample, extrapolates while flagging steps that scale worse than linearly, identifies the bottleneck, and leaves room for a rerun inside the window.
      good: Uses a sample measurement to extrapolate and adds some margin.
      weak: Assumes it will fit or extrapolates from a tiny sample without caveats.
    followups:
      - The sample says it'll take five hours. What are your options?
      - What happens if it fails at hour three?
    common_errors:
      - Extrapolating from a sample that fits in cache when the full run will not.

  - external_key: problem_solving.estimation.checkout_latency_budget
    competency_key: system_design
    topic: Splitting a latency budget across calls
    difficulty: medium
    text: >-
      The checkout page has a three hundred millisecond target at the ninety-ninth percentile, and the request
      calls pricing, inventory, a fraud check and payments. How would you divide that budget, and what does it
      tell you about the design?
    expected_concepts:
      - sequential versus parallel calls
      - network overhead and serialisation per hop
      - percentiles do not add simply
      - timeouts derived from the budget
      - moving work off the critical path
    rubric:
      excellent: Allocates budget per dependency with overhead, parallelises independent calls, notes that tail latencies compound, sets timeouts from the budget, and moves non-essential work asynchronous.
      good: Splits the budget sensibly and suggests calling some services in parallel.
      weak: Divides evenly without considering ordering, overhead or tails.
    followups:
      - The fraud check alone has a p99 of two hundred milliseconds. What now?
      - How would you set retries without blowing the budget?
    common_errors:
      - Adding p99 values together as if they were exact.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.estimation.llm_gpu_serving_fleet
    competency_key: problem_solving
    topic: GPU capacity for model inference
    difficulty: hard
    text: >-
      You're asked to self-host an open-weight language model for an internal tool expected to handle about
      fifty requests per second at peak, each producing around four hundred output tokens. How would you
      estimate how many GPUs you need?
    expected_concepts:
      - output tokens per second required at peak
      - measured tokens per second per GPU with batching
      - memory for weights and key-value cache per GPU
      - latency targets limiting batch size
      - redundancy and headroom for spikes
    rubric:
      excellent: Converts traffic into required tokens per second, uses realistic batched throughput per GPU limited by memory and latency, separates prefill from decoding, adds redundancy, and proposes a benchmark to replace the assumptions.
      good: Computes required token throughput and divides by a stated per-GPU figure with some headroom.
      weak: Picks a GPU count with no throughput reasoning.
    followups:
      - How would a longer prompt with retrieved documents change your answer?
      - When would you prefer paying a hosted API instead?
    common_errors:
      - Ignoring that memory, not compute, often limits batch size.
      - Using single-request throughput as if batching did not exist.

  - external_key: problem_solving.estimation.storage_capacity_runway
    competency_key: problem_solving
    topic: Capacity runway under compound growth
    difficulty: hard
    text: >-
      A storage cluster is sixty percent full and data has been growing about eight percent a month. New
      hardware takes three months to arrive and install. When would you place the order, and how would you
      explain your reasoning?
    expected_concepts:
      - compound growth rather than linear
      - defining a safe ceiling below 100 percent
      - months until the ceiling using doubling-time intuition
      - subtracting procurement lead time
      - uncertainty in the growth rate and a range
    rubric:
      excellent: Uses compound growth to find when the cluster hits a safe ceiling, subtracts lead time and buffer to get an order date, and shows how a faster growth rate shifts the date.
      good: Reaches a plausible order date with compound growth and lead time included.
      weak: Uses linear growth or forgets the lead time.
    followups:
      - What would make you order earlier than the arithmetic suggests?
      - How would you watch whether the growth rate is changing?
    common_errors:
      - Treating eight percent a month as linear growth of the original size.

  - external_key: problem_solving.estimation.saas_cost_per_user
    competency_key: cloud_cost_optimization
    topic: Infrastructure unit economics
    difficulty: hard
    text: >-
      Leadership wants to know the infrastructure cost per active customer for your SaaS product, and whether
      it will rise or fall as you grow. How would you build that estimate?
    expected_concepts:
      - splitting fixed costs from costs that scale with usage
      - allocating shared infrastructure fairly
      - usage drivers per customer such as storage and requests
      - economies of scale and step costs
      - outlier heavy customers skewing averages
    rubric:
      excellent: Separates fixed and variable cost, allocates shared costs with a clear method, models how each component scales, and highlights heavy customers who distort the average.
      good: Divides cost by customers and recognises fixed versus variable parts.
      weak: Divides the total bill by customer count and stops.
    followups:
      - A handful of large customers drive most of the storage. How does that affect pricing?
      - Which cost would you expect to grow faster than customers?
    common_errors:
      - Reporting a single average that hides very different customer profiles.

  - external_key: problem_solving.estimation.iot_telemetry_ingest
    competency_key: problem_solving
    topic: Telemetry ingest and retention
    difficulty: hard
    text: >-
      Two million connected devices each send a small reading every ten seconds. Estimate the ingest rate and
      the storage you'd need to keep raw data for thirty days and summaries for five years.
    expected_concepts:
      - writes per second from device count and interval
      - bytes per reading including timestamps and identifiers
      - raw storage for 30 days with compression
      - downsampled rollups for long-term retention
      - bursts when devices reconnect after an outage
    rubric:
      excellent: Computes about two hundred thousand writes per second, sizes raw and compressed storage for thirty days, sizes rollups separately for five years, and plans for reconnect bursts.
      good: Gets the ingest rate and a raw storage figure right with clear steps.
      weak: Cannot derive the write rate or ignores retention tiers.
    followups:
      - What happens if every device reconnects at once after a network outage?
      - Which rollup intervals would you keep, and why?
    common_errors:
      - Forgetting per-record overhead such as device identifiers and timestamps.

  - external_key: problem_solving.estimation.marketplace_search_index
    competency_key: problem_solving
    topic: Search index sizing and sharding
    difficulty: hard
    text: >-
      A marketplace has five hundred million listings and wants full-text search with filters. How would you
      estimate the index size and how many search nodes you need?
    expected_concepts:
      - indexed fields and average text per listing
      - inverted index overhead relative to raw text
      - shard size targets and replica count
      - query rate and per-node query throughput
      - memory needed for filters and caching
    rubric:
      excellent: Estimates raw indexed text, applies index overhead, chooses shard sizes and replicas, and sizes the cluster on both storage and query throughput, noting which constraint binds.
      good: Estimates index size and derives a node count from storage with replicas.
      weak: Sizes only on raw data and ignores replicas or query load.
    followups:
      - Which grows faster for you, index size or query rate?
      - How would you re-shard later if you guessed wrong?
    common_errors:
      - Sizing only for storage and ignoring query throughput.

  - external_key: problem_solving.estimation.budget_range_under_uncertainty
    competency_key: problem_solving
    topic: Range estimates under uncertain growth
    difficulty: hard
    text: >-
      Finance asks for a single number for next year's infrastructure budget, but user growth could be
      anywhere from twenty to two hundred percent. How would you build and present an estimate they can
      actually use?
    expected_concepts:
      - scenarios such as low, expected and high growth
      - identifying the cost drivers that scale with growth
      - sensitivity to the most uncertain assumptions
      - triggers and checkpoints to revise the budget
      - committing to the base case while flagging upside risk
    rubric:
      excellent: Builds scenarios from explicit cost drivers, shows which assumptions swing the result most, recommends a number with a contingency, and agrees review triggers with finance.
      good: Provides low and high scenarios and a recommended figure.
      weak: Gives one number with no basis, or refuses to estimate because of uncertainty.
    followups:
      - Finance insists on one number. Which do you give and why?
      - What leading indicator would tell you early that you're in the high scenario?
    common_errors:
      - Presenting a range so wide it cannot support any decision.
