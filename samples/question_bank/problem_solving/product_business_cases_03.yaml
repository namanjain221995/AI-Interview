# Curated questions: product and business cases (problem-solving rounds), part 3. Spoken case
# prompts: should we build X, sizing an opportunity, designing a metric, a launch going wrong.
# Evaluation is on the reasoning in the answer only: structure, assumptions, trade-offs, decisions.
version: 1
defaults:
  role_tags: [product_manager, business_analyst, ux_designer]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  - external_key: problem_solving.product_business_cases.restaurant_no_show_reminders
    competency_key: product_sense
    topic: Reducing no-shows with reminders
    difficulty: easy
    text: >-
      A restaurant reservation platform wants to add text reminders to cut no-shows. How would you decide whether
      it's worth doing and how you'd prove it worked?
    expected_concepts:
      - current no-show rate and its cost to restaurants
      - cost of sending reminders
      - test design comparing reminded and non-reminded bookings
      - metric such as no-show rate and cancellations made in time
      - effect on restaurant retention or willingness to pay
    rubric:
      excellent: Quantifies the cost of no-shows to restaurants, weighs it against reminder costs, proposes a controlled test, and measures no-shows and timely cancellations along with restaurant-side value.
      good: Estimates value and proposes a sensible measurement of no-shows.
      weak: Assumes reminders work and measures only messages sent.
    followups:
      - Why might earlier cancellations be as valuable as fewer no-shows?
      - What timing would you test for the reminder?
    common_errors:
      - Measuring delivery of reminders instead of change in behaviour.

  - external_key: problem_solving.product_business_cases.size_parking_reservation_app
    competency_key: problem_solving
    topic: Estimating demand for a consumer app
    difficulty: easy
    text: >-
      How many people in a large city might pay for an app that lets them reserve a parking spot ahead of time?
      Talk me through how you'd estimate it.
    expected_concepts:
      - start from drivers who regularly drive into busy areas
      - frequency of trips where parking is a real problem
      - share willing to pay and price per reservation
      - supply side limits from available spots
      - sanity check with a second approach
    rubric:
      excellent: Segments drivers by how often they face parking problems, estimates willingness to pay with stated assumptions, considers supply constraints and sanity-checks the result.
      good: Clear chain of assumptions leading to a reasonable estimate.
      weak: Starts from the whole population without narrowing to the relevant drivers.
    followups:
      - Which input would you try to measure first?
      - How would supply of reservable spots limit the business?
    common_errors:
      - Counting every resident as a potential customer.

  - external_key: problem_solving.product_business_cases.metric_store_search_quality
    competency_key: product_sense
    topic: Measuring whether search got better
    difficulty: easy
    text: >-
      Your team improved the search on an online store. How would you measure whether search actually got better
      for shoppers?
    expected_concepts:
      - search-to-purchase or search-to-add-to-cart conversion
      - zero-result rate and refinement rate
      - position of the clicked result
      - controlled test rather than before and after only
      - revenue per search as a business outcome
    rubric:
      excellent: Combines outcome metrics such as search conversion with quality signals like zero results, reformulations and click position, and validates the change with a controlled test.
      good: Picks relevant search success metrics and a fair comparison.
      weak: Measures search volume, which can rise when search is worse.
    followups:
      - Why could more searches per session be a bad sign?
      - How would you look at searches with no results?
    common_errors:
      - Treating more searches as more engagement.

  - external_key: problem_solving.product_business_cases.launch_adoption_far_below_target
    competency_key: product_sense
    topic: Launch adoption far below the target
    difficulty: easy
    text: >-
      You expected twenty percent of active users to try a new feature in its first week, but only three percent
      did. How would you work out what's happening?
    expected_concepts:
      - check tracking and rollout coverage
      - check discoverability and entry points
      - look at the funnel from seeing to trying to repeating
      - talk to users who saw it but didn't try it
      - revisit whether the target was realistic
    rubric:
      excellent: Verifies tracking and rollout first, examines the funnel from exposure to repeat use, gathers qualitative input, and questions the original target before deciding on changes.
      good: Investigates discoverability and the funnel and proposes improvements.
      weak: Concludes users don't want it without checking whether they saw it.
    followups:
      - How would you tell a discoverability problem from a value problem?
      - How did you set the twenty percent target in the first place?
    common_errors:
      - Not checking whether the feature was actually visible to users.

  - external_key: problem_solving.product_business_cases.feature_voting_board_top_item
    competency_key: ux_research
    topic: Acting on a public feature voting board
    difficulty: easy
    text: >-
      The top item on your public feature voting board has three times more votes than anything else. How would you
      decide what to do with it?
    expected_concepts:
      - who votes and whether they represent the customer base
      - understand the underlying problem behind the request
      - talk to voters to learn context and urgency
      - weigh against strategy and other evidence
      - close the loop with voters on the decision
    rubric:
      excellent: Questions how representative the voters are, investigates the underlying need with voter interviews, weighs it against strategy and other data, and communicates the decision back to voters.
      good: Investigates the need and considers it alongside other priorities.
      weak: Builds it because it's top voted or ignores it because voting boards are noisy.
    followups:
      - How would you find out whether non-voters share the need?
      - What would you tell voters if you said no?
    common_errors:
      - Treating the board as a ranked roadmap.

  - external_key: problem_solving.product_business_cases.add_premium_tier
    competency_key: product_sense
    topic: Adding a higher pricing tier
    difficulty: easy
    text: >-
      Your software product has a single plan at twenty dollars a month. How would you decide whether to add a
      higher-priced tier, and what would go into it?
    expected_concepts:
      - evidence that some customers get much more value than others
      - identify features or limits valued by heavier users
      - avoid taking value away from the existing plan
      - price based on value and willingness to pay
      - test and measure upgrades and churn
    rubric:
      excellent: Looks for evidence of a high-value segment, builds the tier around what that segment values without degrading the current plan, sets price by value research, and measures upgrades and churn.
      good: Identifies who would pay more and what they would get.
      weak: Bundles random features into a more expensive plan.
    followups:
      - How would you research willingness to pay?
      - What would you do if existing customers felt features were being withheld?
    common_errors:
      - Moving existing features into the new tier and angering current customers.

  - external_key: problem_solving.product_business_cases.active_users_spike_overnight
    competency_key: data_analysis
    topic: Questioning a suspiciously good metric
    difficulty: easy
    text: >-
      The dashboard shows active users jumped forty percent overnight, and nothing major shipped. What would you do
      before telling anyone?
    expected_concepts:
      - check for tracking or definition changes
      - look for bots, spam or duplicate accounts
      - segment by source, platform and region
      - look for external causes such as press or a partner
      - confirm with an independent data source
    rubric:
      excellent: Treats the spike with suspicion, checks instrumentation, definitions and bot traffic, segments to find where it comes from, and confirms with an independent source before reporting.
      good: Checks data quality and segments the increase.
      weak: Celebrates or reports the number without validating it.
    followups:
      - How would you tell bot traffic from real new users?
      - Who would you contact first?
    common_errors:
      - Reporting the number before validating it.

  - external_key: problem_solving.product_business_cases.accessibility_checkout_case
    competency_key: accessibility
    topic: Business case for accessibility fixes
    difficulty: easy
    text: >-
      An audit found that your checkout can't be completed with a keyboard or a screen reader. How would you make
      the case to leadership for prioritising the fixes?
    expected_concepts:
      - customers currently unable to buy at all
      - legal and contractual risk
      - benefits for all users such as keyboard efficiency
      - estimate effort and scope of the fixes
      - prevention through design system and testing
    rubric:
      excellent: Explains that some customers cannot complete purchases, frames revenue, legal and contractual risk, estimates effort, and proposes preventive process changes alongside the fix.
      good: Combines user impact and business risk into a clear case.
      weak: Argues only on principle without impact or effort, or treats it as optional polish.
    followups:
      - How would you stop new accessibility issues being introduced?
      - Which fix would you ship first?
    common_errors:
      - Planning a one-time fix without preventing regressions.

  - external_key: problem_solving.product_business_cases.coffee_chain_loyalty_app
    competency_key: product_sense
    topic: Designing a loyalty programme
    difficulty: medium
    text: >-
      A coffee chain wants to launch a loyalty programme in its app. How would you design it and decide whether it's
      actually paying off?
    expected_concepts:
      - goal such as visit frequency or average spend
      - reward structure and cost
      - incremental behaviour versus rewarding existing habits
      - holdout or staggered rollout to measure incrementality
      - data and personalisation benefits
    rubric:
      excellent: Defines a clear behavioural goal, designs rewards that change behaviour rather than subsidise existing visits, plans to measure incremental impact with a holdout, and accounts for the full cost.
      good: Designs a sensible programme and measures frequency and spend.
      weak: Measures sign-ups or points earned instead of incremental visits.
    followups:
      - How would you avoid simply rewarding customers who'd visit anyway?
      - What would you do if loyal members visited more but spent less per visit?
    common_errors:
      - Comparing members with non-members and calling the difference impact.

  - external_key: problem_solving.product_business_cases.size_corporate_travel_tool
    competency_key: problem_solving
    topic: Sizing a mid-market B2B opportunity
    difficulty: medium
    text: >-
      How would you size the opportunity for a corporate travel booking tool aimed at companies with one hundred to
      one thousand employees?
    expected_concepts:
      - number of companies in the segment
      - travelling employees and trips per year
      - revenue model such as per trip fee or subscription
      - share realistically winnable against incumbents
      - sensitivity to the key assumptions
    rubric:
      excellent: Builds a bottom-up model from companies to travellers to trips, picks a revenue model explicitly, estimates a realistic share against competition and identifies the most sensitive assumptions.
      good: Structured estimate with a clear revenue model.
      weak: Takes a total travel spend figure and calls it the opportunity.
    followups:
      - How would remote work change your trips assumption?
      - Would you charge per trip or per seat, and why?
    common_errors:
      - Confusing total travel spend with software revenue.

  - external_key: problem_solving.product_business_cases.metric_content_reporting
    competency_key: product_sense
    topic: Designing a metric where less can mean better
    difficulty: medium
    text: >-
      You own the feature that lets users report harmful content on a community platform. How would you design the
      metrics for it, given that fewer reports could mean either less harm or a broken feature?
    expected_concepts:
      - separate prevalence of harmful content from reporting volume
      - measure prevalence through sampling and review
      - time to action and accuracy of decisions
      - reporter experience and feedback
      - guardrail against over-removal
    rubric:
      excellent: Recognises the ambiguity of report counts, introduces an independent prevalence measure, adds speed and accuracy of review, and includes guardrails on reporter experience and wrongful removals.
      good: Proposes metrics beyond report counts that reflect outcomes.
      weak: Picks number of reports as the success metric.
    followups:
      - How would you estimate how much harmful content goes unreported?
      - What would you do if reports suddenly doubled?
    common_errors:
      - Treating report volume alone as the measure of safety.

  - external_key: problem_solving.product_business_cases.checklist_activation_no_retention
    competency_key: statistics_experimentation
    topic: Activation up but retention unchanged
    difficulty: medium
    text: >-
      An onboarding checklist increased activation in an experiment, but thirty-day retention didn't change. Would
      you ship it, and what would you conclude about your activation metric?
    expected_concepts:
      - activation definition may not predict retention
      - check power for detecting retention changes
      - review which checklist steps drive real value
      - decide on shipping based on costs and side effects
      - revisit the activation definition with data
    rubric:
      excellent: Questions whether the activation metric is a valid proxy, checks whether the test had enough power to detect a retention change, and decides on shipping while planning to redefine activation using retention correlations.
      good: Recognises the proxy may be weak and proposes next steps.
      weak: Ships because activation went up without questioning the metric.
    followups:
      - How would you redefine activation using historical data?
      - What sample would you need to detect a one-point retention change?
    common_errors:
      - Assuming a lift in a proxy metric guarantees a lift in the outcome.

  - external_key: problem_solving.product_business_cases.bundle_two_products
    competency_key: product_sense
    topic: Bundling two products
    difficulty: medium
    text: >-
      Your company sells two separate products, and leadership suggests bundling them at a discount. How would you
      evaluate whether a bundle makes sense?
    expected_concepts:
      - overlap of customers and complementary value
      - revenue lost from discounting existing dual customers
      - expected uplift from single-product customers adopting both
      - effect on retention and switching costs
      - pricing test and sales packaging
    rubric:
      excellent: Analyses customer overlap and complementarity, models discount cost against uplift from cross-adoption, considers retention benefits, and proposes a pricing test.
      good: Weighs discount cost against expected new adoption.
      weak: Assumes bundles always increase revenue.
    followups:
      - Which customers would you target with the bundle first?
      - How would you price it?
    common_errors:
      - Ignoring the discount given to customers who already buy both.

  - external_key: problem_solving.product_business_cases.promotion_signups_churned
    competency_key: product_sense
    topic: A promotion that brought low-quality growth
    difficulty: medium
    text: >-
      A big first-month-free promotion doubled sign-ups, but most of those customers cancelled when the free month
      ended. How would you evaluate whether the promotion was a success?
    expected_concepts:
      - net paying customers and lifetime value of the cohort
      - full cost of the promotion including service costs
      - compare with normal acquisition cost and retention
      - segments within the cohort that retained well
      - lessons for targeting future promotions
    rubric:
      excellent: Evaluates the cohort on net paying customers and lifetime value against total cost, compares with normal acquisition, finds segments that retained, and derives targeting changes.
      good: Looks beyond sign-ups to retention and cost.
      weak: Judges success by sign-up volume.
    followups:
      - Which retained segments would you target next time?
      - How would you change the offer itself?
    common_errors:
      - Reporting sign-ups as the outcome.

  - external_key: problem_solving.product_business_cases.sales_led_to_self_serve
    competency_key: product_sense
    topic: Moving from sales-led to self-serve
    difficulty: medium
    text: >-
      Your B2B product is sold only through sales calls, and leadership wants customers to be able to sign up and
      pay on their own. How would you approach the change?
    expected_concepts:
      - which segments suit self-serve
      - product changes such as onboarding, billing and in-product guidance
      - effect on the sales team and channel conflict
      - pricing transparency decisions
      - pilot with metrics such as conversion and cost per acquisition
    rubric:
      excellent: Identifies which segments fit self-serve, lists the product and billing changes needed, addresses channel conflict with sales, and proposes a pilot with acquisition cost and conversion metrics.
      good: Covers product changes and sales impact with a plan.
      weak: Treats it as adding a payment page.
    followups:
      - How would you handle a deal that starts self-serve and grows large?
      - What would you need to change in onboarding?
    common_errors:
      - Ignoring how sales compensation interacts with self-serve.

  - external_key: problem_solving.product_business_cases.marketing_overpromised_launch
    competency_key: stakeholder_management
    topic: Marketing promised more than the launch delivers
    difficulty: medium
    text: >-
      On launch day you discover marketing has announced a capability your release doesn't fully support. How
      would you handle it?
    expected_concepts:
      - assess the gap and customer impact
      - correct public messaging quickly with marketing
      - prepare support and sales with accurate answers
      - decide whether to accelerate the missing piece
      - fix the review process between product and marketing
    rubric:
      excellent: Quantifies the gap, works with marketing to correct messaging promptly, equips support and sales, decides whether to close the gap, and fixes the launch review process.
      good: Corrects messaging and prepares customer-facing teams.
      weak: Leaves the claim in place and hopes nobody notices, or only blames marketing.
    followups:
      - How would you word the correction?
      - What change would prevent this next time?
    common_errors:
      - Letting the inaccurate claim stand to avoid embarrassment.

  - external_key: problem_solving.product_business_cases.audit_trail_regulation
    competency_key: requirements_analysis
    topic: Scoping work driven by a regulation
    difficulty: medium
    text: >-
      A new regulation requires your financial product to keep a full audit trail of user actions within nine
      months. How would you scope the work and decide what goes beyond the minimum?
    expected_concepts:
      - interpret the regulation with legal and compliance
      - separate mandatory requirements from nice-to-haves
      - map affected systems and data
      - plan milestones with buffer before the deadline
      - spot opportunities where extra scope adds customer value
    rubric:
      excellent: Works with compliance to pin down exact obligations, separates the mandatory scope from optional value, maps affected systems, and plans milestones with buffer while considering where extra value is worth adding.
      good: Defines the minimum compliant scope and a plan to deliver it.
      weak: Over-scopes or under-scopes without confirming the obligations.
    followups:
      - How would you confirm the interpretation is right?
      - What would you do if the deadline looked at risk?
    common_errors:
      - Interpreting regulatory text without compliance input.

  - external_key: problem_solving.product_business_cases.subscription_pause_option
    competency_key: product_sense
    topic: Offering a pause instead of cancellation
    difficulty: medium
    text: >-
      A streaming subscription service is considering letting people pause their subscription for up to three
      months instead of cancelling. How would you evaluate whether it helps or hurts?
    expected_concepts:
      - share of pausers who would have cancelled versus kept paying
      - resumption rate after pause
      - net revenue effect over a year
      - test design with a control group
      - user experience and reactivation reminders
    rubric:
      excellent: Recognises that pauses can save cancellers but also cost revenue from people who'd have kept paying, measures resumption and net annual revenue in a controlled test, and designs the pause experience accordingly.
      good: Considers both saved and lost revenue and proposes a test.
      weak: Assumes pausing is always better than cancelling.
    followups:
      - How would you identify who would have cancelled anyway?
      - What should happen at the end of a pause?
    common_errors:
      - Counting every pause as a saved cancellation.

  - external_key: problem_solving.product_business_cases.support_cost_outpacing_growth
    competency_key: data_analysis
    topic: Support costs growing faster than customers
    difficulty: medium
    text: >-
      Support costs are growing much faster than your customer base. How would you find out why and decide where
      the product should help?
    expected_concepts:
      - contacts per customer trend and by segment
      - categorise contact reasons and their growth
      - link drivers to product areas or releases
      - estimate savings from fixing top drivers
      - track contact rate after changes
    rubric:
      excellent: Normalises contacts per customer, breaks them down by reason and segment, ties top drivers to product areas, and prioritises fixes by expected savings with tracking.
      good: Analyses contact reasons and proposes product fixes.
      weak: Proposes hiring or chatbots without analysing drivers.
    followups:
      - How would you categorise contacts if tags are unreliable?
      - Which driver would you tackle first, and why?
    common_errors:
      - Looking at total volume without normalising for growth.

  - external_key: problem_solving.product_business_cases.cold_start_new_marketplace
    competency_key: product_sense
    topic: Cold start for a new marketplace
    difficulty: hard
    text: >-
      You're launching a marketplace that connects small businesses with freelance bookkeepers. How would you solve
      the problem that neither side wants to join until the other side is there?
    expected_concepts:
      - pick which side to seed first and why
      - narrow initial focus by geography or niche
      - single-player value or tools that work without the other side
      - manual or subsidised matching early on
      - liquidity metrics such as time to match
    rubric:
      excellent: Chooses which side to seed with reasoning, narrows the launch to a dense niche, adds standalone value or manual matching to bootstrap, and defines liquidity metrics that signal when to expand.
      good: Proposes credible tactics to seed one side and narrow the market.
      weak: Proposes a broad marketing launch to both sides at once.
    followups:
      - Which side would you seed first, and why?
      - What liquidity level would tell you to expand?
    common_errors:
      - Launching too broadly to achieve density anywhere.

  - external_key: problem_solving.product_business_cases.analytics_addon_size_price
    competency_key: product_sense
    topic: Sizing and pricing an add-on
    difficulty: hard
    text: >-
      Leadership asks you to size the opportunity for an advanced analytics add-on for existing customers and to
      propose how to price it. How would you approach both?
    expected_concepts:
      - identify which customers have the need
      - estimate adoption rate from research or comparable add-ons
      - value-based pricing from willingness-to-pay research
      - cannibalisation of existing tiers
      - total revenue range and confidence
    rubric:
      excellent: Segments existing customers by need, grounds adoption in evidence, sets price through value and willingness-to-pay research, checks cannibalisation, and presents a revenue range with stated confidence.
      good: Produces a structured estimate and a reasoned pricing approach.
      weak: Multiplies the whole customer base by a guessed price.
    followups:
      - How would you test willingness to pay before building?
      - Would you price per user or per account?
    common_errors:
      - Assuming every existing customer is a buyer.

  - external_key: problem_solving.product_business_cases.more_ad_slots_trade_off
    competency_key: product_sense
    topic: Ad revenue versus user experience
    difficulty: hard
    text: >-
      Your free, ad-supported app needs more revenue, and the proposal is to add more ad slots to the main feed. How
      would you decide whether and how to do it?
    expected_concepts:
      - long-term engagement cost of ad load
      - test different ad loads with long holdouts
      - revenue per user over time, not just immediate
      - ad quality and relevance as an alternative lever
      - alternatives such as a paid ad-free tier
    rubric:
      excellent: Models the trade-off between immediate revenue and long-term engagement, runs long-duration ad-load tests, considers improving ad quality or adding a paid tier, and decides based on lifetime revenue.
      good: Tests ad load with attention to engagement effects.
      weak: Adds slots based on projected revenue alone.
    followups:
      - How long would you run the test, and why?
      - How would a paid ad-free tier change the picture?
    common_errors:
      - Measuring only short-term revenue lift.

  - external_key: problem_solving.product_business_cases.peak_season_launch_outage
    competency_key: product_sense
    topic: A launch outage during peak season
    difficulty: hard
    text: >-
      A major feature you launched just before the holiday peak caused an outage that lost a few hours of orders.
      Leadership is asking whether to relaunch it before the season ends. What would you recommend?
    expected_concepts:
      - understand root cause and confidence in the fix
      - value of the feature during the remaining peak
      - risk of a repeat outage at peak traffic
      - options such as a limited rollout or waiting until after peak
      - post-incident review and customer remediation
    rubric:
      excellent: Weighs the feature's peak value against the risk of another outage, bases the decision on confidence in the fix and testing, considers staged options, and includes customer remediation and a review.
      good: Compares risk and value and proposes a cautious approach.
      weak: Relaunches to recover lost revenue without assessing risk, or defers without considering value.
    followups:
      - What evidence would give you enough assurance to relaunch?
      - How would you make it up to affected customers?
    common_errors:
      - Underweighting the cost of a second outage at peak.

  - external_key: problem_solving.product_business_cases.consumer_app_team_version
    competency_key: product_sense
    topic: Building a team version of a consumer app
    difficulty: hard
    text: >-
      A note-taking app popular with individuals sees many users sharing notes with colleagues. Should it build a
      paid version for teams, and how would you work that out?
    expected_concepts:
      - evidence of team usage and willingness to pay
      - team requirements such as admin controls, permissions and billing
      - selling to businesses versus individuals
      - risk of diluting the individual experience
      - staged entry such as a team plan pilot
    rubric:
      excellent: Uses evidence of organic team usage, identifies what businesses need beyond the consumer product, considers the change in go-to-market and the risk to core users, and proposes a staged pilot with success criteria.
      good: Weighs demand evidence against required changes and makes a reasoned call.
      weak: Assumes sharing behaviour means businesses will pay.
    followups:
      - Which team features would be essential in a first version?
      - How would you find the first paying teams?
    common_errors:
      - Overlooking administrative and security requirements of business buyers.

  - external_key: problem_solving.product_business_cases.preinstall_exclusivity_deal
    competency_key: product_sense
    topic: Evaluating a distribution partnership
    difficulty: hard
    text: >-
      A large device maker offers to pre-install your app on its phones in exchange for a revenue share and an
      exclusivity clause. How would you evaluate the deal?
    expected_concepts:
      - incremental users and their expected quality
      - revenue share cost versus acquisition cost of other channels
      - strategic cost of exclusivity
      - contract terms, duration and exit options
      - pilot or ways to limit downside
    rubric:
      excellent: Estimates incremental users and their value against the revenue share, compares with other acquisition costs, weighs the strategic cost of exclusivity, and negotiates terms or a pilot to limit downside.
      good: Weighs user gains against cost and exclusivity risk.
      weak: Accepts for distribution or rejects on exclusivity without analysis.
    followups:
      - How would you estimate the quality of pre-installed users?
      - Which contract terms would you push hardest on?
    common_errors:
      - Assuming pre-installed users behave like users who chose the app.
