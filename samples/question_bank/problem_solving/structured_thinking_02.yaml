# Curated questions: structured thinking for open-ended problems (any role), part 2.
version: 1
defaults:
  role_tags: [general]
  round_types: [problem_solving, combined]
  kind: scenario
  competency_key: problem_solving
questions:
  # ------------------------------------------------------------------ easy
  - external_key: problem_solving.structured_thinking.weekly_report_late
    topic: Asking why until reaching a cause
    difficulty: easy
    text: >-
      A weekly report that several teams rely on keeps going out a day late. How would you dig down to the
      underlying cause rather than just chasing it each week?
    expected_concepts:
      - map the steps and who does each one
      - find where the delay actually happens
      - keep asking why the delay occurs at that step
      - stop at a cause that can be changed
      - verify the fix over several weeks
    rubric:
      excellent: Locates the step where time is lost, repeatedly asks why until reaching a changeable cause, fixes that and checks over several cycles that the report stays on time.
      good: Identifies the step causing the delay and proposes a reasonable fix.
      weak: Proposes reminders or pressure without understanding the cause.
    followups:
      - What would you do if the cause turned out to be in another team?
      - How would you know the fix worked and wasn't just a lucky week?
    common_errors:
      - Stopping at "someone was slow" instead of why.

  - external_key: problem_solving.structured_thinking.unfamiliar_domain_waste
    topic: Approaching a problem in an unfamiliar area
    difficulty: easy
    text: >-
      You're asked to help reduce food waste in the company cafeteria, an area you know nothing about. How would
      you get started?
    expected_concepts:
      - talk to the people who run it day to day
      - observe or measure where waste happens
      - break waste down by type and cause
      - look for how others have solved similar problems
      - start with a small change and measure it
    rubric:
      excellent: Learns quickly from the people doing the work and from direct observation, breaks the waste into types and causes, borrows proven ideas and tests a small change with measurement.
      good: Gathers information from staff and data before suggesting changes.
      weak: Suggests generic solutions without learning how the cafeteria works.
    followups:
      - What would you measure first, and how?
      - How would you know which of your ideas came from real understanding versus guesswork?
    common_errors:
      - Assuming the answer is obvious without observing the process.

  - external_key: problem_solving.structured_thinking.website_slow_questions
    topic: Choosing clarifying questions
    difficulty: easy
    text: >-
      A stakeholder tells you "the website is slow." Which questions would you ask first, and how would each
      answer change what you do next?
    expected_concepts:
      - which pages or actions are slow
      - since when, and whether something changed
      - for which users or locations
      - how slow compared with what expectation
      - how it is affecting their work or customers
    rubric:
      excellent: Asks focused questions about what, when, who and how much, and explains how each answer narrows the problem or changes the next step.
      good: Asks several relevant questions to narrow the problem.
      weak: Asks no questions or only generic ones, then jumps to a fix.
    followups:
      - Which single answer would narrow things down the most?
      - What would you do if the stakeholder can't answer most of them?
    common_errors:
      - Asking questions without knowing what each answer would tell you.

  - external_key: problem_solving.structured_thinking.sanity_check_big_saving
    topic: Sanity-checking a surprising result
    difficulty: easy
    text: >-
      Your analysis shows that a small process change saved the company two million a year, which is far more
      than anyone expected. What would you do before presenting that result?
    expected_concepts:
      - check the order of magnitude against total relevant spend
      - recompute key steps independently
      - look for double counting or wrong units
      - check whether other changes happened at the same time
      - ask a colleague to review the logic
    rubric:
      excellent: Tests the result against what is plausible, rechecks the calculation independently, hunts for common errors such as double counting and confounding changes, and gets a second pair of eyes.
      good: Rechecks the numbers and looks for obvious mistakes.
      weak: Presents the number as is because the calculation looked right.
    followups:
      - What comparison would quickly tell you if the number is implausible?
      - How would you present it if you are still unsure after checking?
    common_errors:
      - Only checking arithmetic and not the logic.

  - external_key: problem_solving.structured_thinking.meeting_going_in_circles
    topic: Bringing structure to a stuck discussion
    difficulty: easy
    text: >-
      Your team has spent forty minutes in a meeting going round in circles about a problem. How would you bring
      some structure to the discussion?
    expected_concepts:
      - restate the question being decided
      - separate the problem from proposed solutions
      - list the options and criteria visibly
      - identify what facts are missing
      - agree next steps and an owner
    rubric:
      excellent: Pulls the group back to a clear question, separates problem, options and criteria, makes disagreements and missing facts visible, and ends with concrete next steps.
      good: Summarises positions and proposes a way to decide.
      weak: Suggests taking it offline without any structure.
    followups:
      - What if the disagreement is really about the goal, not the solution?
      - How would you capture the outcome so the circle doesn't restart next week?
    common_errors:
      - Pushing for a decision before the question is clear.

  - external_key: problem_solving.structured_thinking.missed_appointments_analogy
    topic: Borrowing from a similar solved problem
    difficulty: easy
    text: >-
      Customers keep missing their booked appointment slots at a service centre. How would you use problems you
      or others have solved before to help with this one?
    expected_concepts:
      - recognise similar problems such as no-shows in clinics or restaurants
      - identify what made those solutions work
      - check how this situation differs
      - adapt a solution such as reminders or easy rescheduling
      - test whether it works here
    rubric:
      excellent: Draws on a relevant analogous problem, explains why its solution worked, checks the differences carefully and adapts and tests a solution for this context.
      good: Identifies a sensible analogy and suggests adapting its solution.
      weak: Copies a solution from elsewhere without checking it fits.
    followups:
      - What difference between the two situations could make the analogy break down?
      - How would you find out why customers are missing slots in the first place?
    common_errors:
      - Skipping the step of understanding why customers miss slots.

  - external_key: problem_solving.structured_thinking.two_hours_tool_trial
    topic: Structuring a short timebox
    difficulty: easy
    text: >-
      You have two hours before a meeting where you need to recommend which of three software tools the team
      should trial. How would you use that time?
    expected_concepts:
      - clarify the team's must-have needs first
      - set a few criteria and spend limited time per tool
      - eliminate options that fail a must-have quickly
      - note unknowns rather than resolving them all
      - leave time to write a clear recommendation
    rubric:
      excellent: Plans the time deliberately, fixes criteria from real needs, eliminates quickly on must-haves, records open questions and reserves time to prepare a clear recommendation.
      good: Uses criteria to compare the tools within the time.
      weak: Spends the time reading feature lists with no criteria and no plan.
    followups:
      - What would you say if you couldn't separate the top two?
      - Which criterion would you treat as a deal-breaker?
    common_errors:
      - Running out of time without a recommendation.

  - external_key: problem_solving.structured_thinking.facts_vs_opinions_slip
    topic: Separating facts from opinions
    difficulty: easy
    text: >-
      A project slipped by a month, and in the review everyone offers a different explanation. How would you
      separate what's actually known from what's opinion?
    expected_concepts:
      - build a timeline of what happened
      - mark each claim as evidenced or not
      - look for records such as tickets, messages or plans
      - test the main explanations against the timeline
      - focus on causes supported by evidence
    rubric:
      excellent: Builds a factual timeline from records, classifies each explanation by the evidence behind it, and tests the main claims against that timeline before drawing conclusions.
      good: Looks for evidence to support or reject the explanations.
      weak: Picks the most common or senior explanation.
    followups:
      - How would you handle an explanation that's plausible but can't be checked?
      - How would you keep the review from becoming about blame?
    common_errors:
      - Treating firmly stated claims as facts.

  # ---------------------------------------------------------------- medium
  - external_key: problem_solving.structured_thinking.cut_team_costs
    topic: Decomposing where money goes
    difficulty: medium
    text: >-
      You're asked to reduce your department's operating costs by ten percent. How would you break down where
      the money goes before deciding what to cut?
    expected_concepts:
      - categorise spend into non-overlapping buckets
      - size each bucket to find where most money goes
      - split each large bucket into volume and rate
      - separate fixed and variable costs
      - consider the value delivered by each area before cutting
    rubric:
      excellent: Breaks spend into clean buckets, sizes them, splits large ones into volume and price drivers, and weighs savings against the value each delivers before choosing cuts.
      good: Categorises costs and focuses on the largest areas.
      weak: Proposes an across-the-board ten percent cut without analysis.
    followups:
      - Which levers are usually faster to pull, volume or price?
      - How would you avoid cuts that cost more later?
    common_errors:
      - Spending effort on small cost lines because they are easy to cut.

  - external_key: problem_solving.structured_thinking.eight_subproblems_where_first
    topic: Choosing which branch to explore first
    difficulty: medium
    text: >-
      You've broken a messy problem down into eight sub-problems. How do you decide which ones to dig into first
      and which to set aside for now?
    expected_concepts:
      - estimate each sub-problem's contribution to the overall issue
      - consider how cheap it is to investigate
      - look for sub-problems that unblock or explain others
      - park the rest explicitly rather than forgetting them
      - revisit the order as evidence comes in
    rubric:
      excellent: Ranks sub-problems by likely contribution and cost to investigate, prioritises those that unblock others, explicitly parks the rest and re-ranks as evidence comes in.
      good: Uses impact and effort to choose a sensible starting point.
      weak: Works through them in the order they were listed or picks the most interesting.
    followups:
      - How would you estimate a sub-problem's contribution before investigating it?
      - When would you go back to a parked sub-problem?
    common_errors:
      - Investigating all eight in parallel and finishing none.

  - external_key: problem_solving.structured_thinking.test_willingness_to_pay
    topic: Testing a key assumption cheaply
    difficulty: medium
    text: >-
      A new service plan assumes customers will pay extra for faster delivery. How would you test that
      assumption cheaply before the company commits to building anything?
    expected_concepts:
      - state the assumption precisely including how many and how much
      - look for existing evidence such as current behaviour
      - design a small, low-cost test such as an offer to a sample
      - set the result that would confirm or kill the idea in advance
      - consider what the test can't tell you
    rubric:
      excellent: Turns the assumption into a precise, testable claim, looks first at existing behaviour, designs a cheap test with a pre-agreed success threshold and notes the test's limits.
      good: Proposes a reasonable small test or data check.
      weak: Relies on asking customers whether they'd like it.
    followups:
      - Why might what customers say differ from what they do?
      - What result would make you stop the idea?
    common_errors:
      - Deciding the success threshold after seeing the results.

  - external_key: problem_solving.structured_thinking.twelve_step_process_split
    topic: Narrowing down by splitting the process
    difficulty: medium
    text: >-
      A twelve-step month-end reconciliation, part manual and part automated, sometimes produces totals that are
      slightly off. How would you narrow down where it goes wrong?
    expected_concepts:
      - check intermediate totals between steps
      - split the process in halves to locate the faulty part quickly
      - compare a good month with a bad month
      - look at the step where data first diverges
      - confirm the cause with a specific example
    rubric:
      excellent: Checks intermediate results to bisect the process, compares good and bad runs to find where they first diverge, and confirms the cause with a concrete traced example.
      good: Checks steps systematically to locate the problem.
      weak: Re-runs the whole process and hopes to spot something.
    followups:
      - What if the error only appears in some months?
      - How would you prevent it reappearing once fixed?
    common_errors:
      - Checking every step in order instead of narrowing down.

  - external_key: problem_solving.structured_thinking.invert_knowledge_base
    topic: Inverting the problem
    difficulty: medium
    text: >-
      You've been asked to make the company's internal knowledge base more useful. How could asking the opposite
      question, what would make it useless, help you here?
    expected_concepts:
      - list the ways it could fail such as stale, unfindable or untrusted content
      - check which of those are happening today
      - turn each failure mode into a design principle or fix
      - prioritise failures that hurt users most
      - measure whether the failures reduce
    rubric:
      excellent: Uses inversion to generate specific failure modes, checks which are present today with evidence, and converts the worst ones into concrete fixes with a way to measure them.
      good: Lists failure modes and derives some improvements from them.
      weak: Lists generic improvements without using the inversion.
    followups:
      - Which failure mode would you expect to matter most?
      - How would you check whether people trust the content?
    common_errors:
      - Treating inversion as a brainstorm without checking reality.

  - external_key: problem_solving.structured_thinking.sales_vs_compliance_framing
    topic: Reframing conflicting requirements
    difficulty: medium
    text: >-
      Sales wants a new customer sign-up flow that takes two minutes, while Compliance wants more checks added.
      How would you frame the problem so you're not just picking a side?
    expected_concepts:
      - understand each group's underlying goal
      - identify the specific risk the checks are meant to control
      - look for designs that meet both such as risk-based or deferred checks
      - make the trade-off explicit where it remains
      - involve both in agreeing the final design
    rubric:
      excellent: Reframes around each side's underlying goal, pinpoints the actual risks, proposes designs that satisfy both where possible and makes any remaining trade-off explicit for a joint decision.
      good: Seeks a compromise informed by both sides' needs.
      weak: Treats it as a contest and recommends one side.
    followups:
      - What would you do if no design satisfies both?
      - Who should make the final call?
    common_errors:
      - Splitting the difference without understanding either requirement.

  - external_key: problem_solving.structured_thinking.engagement_target_definition
    topic: Turning a vague goal into a measure
    difficulty: medium
    text: >-
      You're given the goal "increase engagement" for an internal tool. How would you turn that into something
      you can measure without encouraging the wrong behaviour?
    expected_concepts:
      - clarify why engagement matters and what value it stands for
      - choose measures tied to that value
      - consider how each measure could be gamed
      - pair primary measures with balancing ones
      - set a baseline and target
    rubric:
      excellent: Derives measures from the value engagement is meant to represent, anticipates how each could be gamed, adds balancing measures and sets a baseline and target.
      good: Chooses sensible measures connected to the goal.
      weak: Picks a raw activity count such as logins without question.
    followups:
      - How could your chosen measure go up while things get worse?
      - What would you do if the right measure is hard to collect?
    common_errors:
      - Measuring activity instead of value.

  - external_key: problem_solving.structured_thinking.unknown_first_phase
    topic: Planning when early work is unpredictable
    difficulty: medium
    text: >-
      You're planning a project where nobody can say how long the first discovery phase will take. How would you
      structure the plan so it's still useful?
    expected_concepts:
      - timebox the discovery phase
      - define what discovery must answer
      - plan later phases with ranges or scenarios
      - set a decision point after discovery to re-plan
      - communicate uncertainty openly
    rubric:
      excellent: Timeboxes discovery against specific questions, plans later work as ranges with a defined re-planning point, and communicates the uncertainty plainly to stakeholders.
      good: Uses a timebox or ranges to handle the uncertainty.
      weak: Gives a single fixed date or refuses to plan.
    followups:
      - What would you do if the timebox ends with the key question unanswered?
      - How would you present ranges to someone who wants one date?
    common_errors:
      - Hiding uncertainty in padding instead of making it explicit.

  - external_key: problem_solving.structured_thinking.endless_research_phase
    topic: Recognising when to stop analysing
    difficulty: medium
    text: >-
      A team you work with has been researching a problem for six weeks and keeps asking for more data before
      deciding anything. How would you help them move forward?
    expected_concepts:
      - clarify the decision they need to make
      - identify what further data could actually change it
      - estimate the cost of waiting versus the cost of being wrong
      - look for a reversible first step
      - set a decision deadline
    rubric:
      excellent: Refocuses on the decision, tests whether more data could realistically change it, compares the cost of delay with the cost of error and proposes a reversible step with a deadline.
      good: Pushes for a decision with some reasoning about remaining uncertainty.
      weak: Either supports more research indefinitely or demands an immediate decision without reasoning.
    followups:
      - How would you handle someone whose concern is genuinely unresolved?
      - What makes a first step easy to reverse?
    common_errors:
      - Treating all uncertainty as a reason to wait.

  - external_key: problem_solving.structured_thinking.bulk_pricing_extremes
    topic: Using extreme cases to test a design
    difficulty: medium
    text: >-
      You're drafting a discount rule for bulk orders. How would you use extreme or unusual cases to check that
      the rule actually works?
    expected_concepts:
      - test the smallest and largest possible orders
      - test values right at each threshold
      - consider unusual combinations such as returns or split orders
      - check for ways customers could exploit the rule
      - adjust the rule based on what breaks
    rubric:
      excellent: Systematically tests boundaries, thresholds and odd combinations, identifies exploits or nonsense results and refines the rule accordingly.
      good: Checks several edge cases and adjusts the rule.
      weak: Checks only typical orders.
    followups:
      - What happens to a customer who splits one large order into several?
      - Which edge case worries you most?
    common_errors:
      - Ignoring the exact boundary values.

  - external_key: problem_solving.structured_thinking.paper_inspections_slicing
    topic: Slicing a big change into valuable steps
    difficulty: medium
    text: >-
      You're replacing a paper-based inspection process with digital forms across thirty sites. How would you
      slice the work so that each stage delivers something useful on its own?
    expected_concepts:
      - identify the core value such as faster reporting or fewer lost forms
      - start with a thin end-to-end version at one or two sites
      - choose pilot sites that teach the most
      - add features and sites in stages based on feedback
      - define what each stage must prove before the next
    rubric:
      excellent: Defines the core value, delivers a thin end-to-end slice at carefully chosen pilot sites, sets what each stage must prove and expands features and sites based on evidence.
      good: Proposes a phased rollout starting small with feedback.
      weak: Plans a full design and a single launch across all sites.
    followups:
      - How would you choose the first sites?
      - What would make you pause the rollout?
    common_errors:
      - Slicing by component so nothing works end to end until the last stage.

  # ------------------------------------------------------------------ hard
  - external_key: problem_solving.structured_thinking.bigger_queue_reframe
    topic: Reframing the request behind the request
    difficulty: hard
    text: >-
      A manager asks you to justify hiring three more support agents because the queue is always long. How might
      you reframe the problem before answering, and what would you investigate?
    expected_concepts:
      - separate the goal such as response time from the proposed solution
      - analyse what drives demand into the queue
      - check how much demand is avoidable or repeat contact
      - look at agent capacity and how time is spent
      - compare hiring with other options on cost and impact
    rubric:
      excellent: Reframes the request as a response-time or demand problem, investigates demand drivers, avoidable contacts and capacity use, and compares hiring against alternatives with numbers.
      good: Looks at both demand and capacity before deciding.
      weak: Simply calculates how many agents are needed for the current volume.
    followups:
      - What if the analysis shows hiring really is the best answer?
      - How would you present a reframe without seeming to dismiss the request?
    common_errors:
      - Taking the current demand as fixed.

  - external_key: problem_solving.structured_thinking.new_segment_fundamentals
    topic: Reasoning from fundamentals with no history
    difficulty: hard
    text: >-
      Leadership wants a view on whether to offer your product to a completely new type of customer, and there's
      no historical data. How would you reason about it from fundamentals?
    expected_concepts:
      - identify the problem the product solves and whether the new customers have it
      - break down what must be true for success such as need, ability to pay and ability to reach them
      - estimate each factor from available proxies
      - identify the riskiest assumption
      - propose a small test to reduce that risk
    rubric:
      excellent: Breaks success into the fundamental conditions that must hold, estimates each with sensible proxies, singles out the riskiest assumption and proposes a cheap way to test it.
      good: Reasons through need and economics with stated assumptions.
      weak: Relies on a loose analogy or gut feel without structure.
    followups:
      - Which proxy would you trust least, and why?
      - What would you need to see to recommend going ahead?
    common_errors:
      - Assuming existing customers' behaviour transfers directly.

  - external_key: problem_solving.structured_thinking.what_would_have_to_be_true
    topic: Structuring a split debate around conditions
    difficulty: hard
    text: >-
      Leadership is split on whether to open a weekend customer support shift. How would you use the question
      "what would have to be true for this to be the right call" to structure the debate?
    expected_concepts:
      - list the conditions for each option to be right
      - get both sides to agree on those conditions
      - identify which conditions are uncertain
      - gather evidence on the uncertain ones
      - let the evidence decide rather than advocacy
    rubric:
      excellent: Moves the debate from positions to explicit conditions agreed by both sides, identifies which are uncertain, gathers targeted evidence and lets that settle the decision.
      good: Uses conditions to clarify the disagreement and suggests evidence to collect.
      weak: Summarises both sides' arguments without changing the structure of the debate.
    followups:
      - What if one side won't agree that a condition matters?
      - How would you test a condition cheaply?
    common_errors:
      - Listing conditions that are vague or impossible to check.

  - external_key: problem_solving.structured_thinking.client_renewal_scenarios
    topic: Planning across uncertain scenarios
    difficulty: hard
    text: >-
      Your largest client's contract may or may not be renewed next year, and the decision won't come for months.
      How would you structure your team's plans so you're ready either way?
    expected_concepts:
      - define a small number of distinct scenarios
      - identify actions that make sense in every scenario
      - identify decisions that depend on the outcome and when they must be made
      - set early warning signs to watch
      - prepare contingency plans for the costly scenario
    rubric:
      excellent: Defines clear scenarios, separates no-regret actions from scenario-dependent ones with their decision dates, sets leading indicators and prepares concrete contingencies.
      good: Plans for both outcomes with some shared actions.
      weak: Plans for the expected outcome only or freezes all decisions.
    followups:
      - Which actions would you take now regardless of the outcome?
      - What early signal would tell you which way it is going?
    common_errors:
      - Waiting for certainty before planning anything.

  - external_key: problem_solving.structured_thinking.two_senior_views
    topic: Comparing approaches without the loudest voice winning
    difficulty: hard
    text: >-
      Two senior colleagues propose very different approaches to the same problem, and each has strong
      arguments. How would you structure the comparison so the decision isn't settled by whoever argues best?
    expected_concepts:
      - agree the goal and decision criteria before comparing
      - make each proposal's assumptions explicit
      - identify where they actually disagree on facts or on values
      - gather evidence or run a small test on the key factual disagreement
      - document the decision and its reasoning
    rubric:
      excellent: Agrees criteria first, surfaces each proposal's assumptions, separates factual from value disagreements, resolves the factual ones with evidence and documents the reasoning.
      good: Uses agreed criteria to compare the proposals.
      weak: Picks the more senior or persuasive view, or averages the two.
    followups:
      - How would you handle a disagreement that is really about priorities?
      - Could combining the two approaches ever be the right answer?
    common_errors:
      - Comparing proposals on different criteria.

  - external_key: problem_solving.structured_thinking.bottleneck_moves_elsewhere
    topic: Seeing the problem as a system
    difficulty: hard
    text: >-
      Your team sped up how quickly requests are taken in, and now there's a large backlog at the review stage
      instead. How would you think about the problem as a whole system rather than one step at a time?
    expected_concepts:
      - map the full flow from intake to completion
      - identify the constraint that limits overall throughput
      - recognise that improving non-constraints just moves queues
      - focus on the constraint and limit work entering
      - measure end-to-end time rather than step speed
    rubric:
      excellent: Maps the whole flow, identifies the true constraint, explains why speeding up other steps just moves the queue, and proposes managing intake and improving the constraint with end-to-end measures.
      good: Recognises the bottleneck shifted and focuses on review capacity.
      weak: Proposes speeding up review in isolation without looking at the whole flow.
    followups:
      - How would you decide how much work to let in?
      - What would you measure to know the whole system improved?
    common_errors:
      - Measuring success by the speed of one step.
