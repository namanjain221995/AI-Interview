# Curated questions: problem solving, process improvement (part 1 of 4).
# Releases, CI and test feedback, retrospectives, intake and change approval.
version: 1
defaults:
  role_tags: [project_manager, engineering_manager, qa, devops]
  round_types: [problem_solving, combined]
  kind: scenario
questions:
  # ---------------------------------------------------------------- easy
  - external_key: problem_solving.process_improvement.release_checklist_misses
    competency_key: ci_cd
    topic: Release checklist that keeps getting skipped
    difficulty: easy
    text: >-
      Your team's releases follow a written checklist, but steps still get skipped and something small breaks
      almost every time. How would you figure out why the checklist isn't working and what to change?
    expected_concepts:
      - look at which steps get skipped and why (too long, unclear, unowned)
      - talk to the people who actually run releases
      - automate or enforce the steps that matter most in the pipeline
      - remove or merge steps that add no value
      - track release problems to confirm the change worked
    rubric:
      excellent: Investigates the specific steps that fail and the reasons behind them, then automates or enforces the critical ones, trims the rest and checks results over the next few releases.
      good: Suggests reviewing the checklist with the team and automating some steps.
      weak: Proposes adding more steps or reminding people to be careful without looking at causes.
    followups:
      - Which kinds of steps would you automate first, and which would you leave manual?
      - How would you know a few releases later whether the change actually helped?
    common_errors:
      - Making the checklist longer every time something breaks.

  - external_key: problem_solving.process_improvement.slow_code_reviews
    competency_key: agile_delivery
    topic: Pull requests waiting days for review
    difficulty: easy
    text: >-
      Pull requests on your team routinely sit for two or three days before anyone reviews them. How would you
      approach shortening that wait?
    expected_concepts:
      - measure time to first review and where it varies
      - smaller pull requests that are faster to review
      - an explicit team agreement on review response time
      - treating review as part of finishing work, not an interruption
      - spreading review load beyond one or two people
    rubric:
      excellent: Measures the wait first, then combines smaller changes, a clear review expectation and a fairer spread of reviewers, and treats review as finishing work in progress.
      good: Suggests a review rota or a response-time agreement and smaller pull requests.
      weak: Suggests skipping reviews or simply asking people to review faster.
    followups:
      - What would you do if one senior engineer ends up doing most of the reviews?
      - How small is small enough for a pull request, in your experience?
    common_errors:
      - Removing the review step to save time instead of fixing the flow.

  - external_key: problem_solving.process_improvement.flaky_tests_rerun_culture
    competency_key: test_automation
    topic: Rerunning flaky tests until green
    difficulty: easy
    text: >-
      People on your team have started rerunning the test pipeline until it goes green, because a handful of
      tests fail at random. How would you get the suite back to something people trust?
    expected_concepts:
      - identify flaky tests from historical run data
      - quarantine flaky tests so they stop blocking while being fixed
      - assign owners and a deadline to each quarantined test
      - fix common causes such as timing, shared state and test order
      - track the flake rate over time
    rubric:
      excellent: Uses run history to find the flaky tests, quarantines them with owners and deadlines, fixes the underlying causes and tracks the flake rate so the problem doesn't creep back.
      good: Identifies and fixes or disables the flaky tests.
      weak: Accepts reruns as normal or deletes failing tests without understanding them.
    followups:
      - How do you stop the quarantine list from growing forever?
      - What are the most common root causes of flaky tests you've seen?
    common_errors:
      - Adding automatic retries everywhere, which hides real intermittent bugs.

  - external_key: problem_solving.process_improvement.first_week_waiting
    competency_key: people_management
    topic: New hires stuck waiting in their first week
    difficulty: easy
    text: >-
      New engineers on your team say their first week is mostly spent waiting for access and hunting for the
      right documents. How would you redesign that first week?
    expected_concepts:
      - request accounts and access before the start date
      - a single starting checklist or onboarding page
      - an onboarding buddy for questions
      - a small, real first task with a clear outcome
      - asking each new hire for feedback to improve the next one
    rubric:
      excellent: Moves access requests before day one, gives one clear starting point, pairs the person with a buddy and a meaningful first task, and collects feedback from every new hire to keep improving.
      good: Prepares access in advance and assigns a buddy or checklist.
      weak: Accepts the waiting as unavoidable or relies on the new hire to ask around.
    followups:
      - What makes a good first task for someone in their first week?
      - How would you keep the onboarding page from going stale?
    common_errors:
      - Handing over a large pile of documents instead of a clear first goal.

  - external_key: problem_solving.process_improvement.support_tickets_bounce
    competency_key: technical_support
    topic: Tickets bouncing between engineering teams
    difficulty: easy
    text: >-
      Support tickets that need engineering help often bounce between teams several times before anyone takes
      ownership. How would you go about fixing that routing?
    expected_concepts:
      - map which kinds of tickets bounce and between which teams
      - a clear ownership map from product area to team
      - a default owner who routes ambiguous tickets
      - better ticket categories or intake questions
      - measuring reassignments per ticket
    rubric:
      excellent: Finds which ticket types bounce, publishes an ownership map, sets a default triage owner for unclear cases and measures reassignments to confirm the fix.
      good: Proposes a clearer ownership list or a triage role.
      weak: Asks support to try harder to pick the right team.
    followups:
      - What would you do with tickets that genuinely involve two teams?
      - How would you keep the ownership map accurate as teams reorganise?
    common_errors:
      - Blaming support agents for misrouting when ownership itself is unclear.

  - external_key: problem_solving.process_improvement.retro_actions_never_done
    competency_key: agile_delivery
    topic: Retrospective actions that never happen
    difficulty: easy
    text: >-
      Your team's retrospectives produce a good list of action items, but by the next retro almost none of them
      have been done. What would you change?
    expected_concepts:
      - fewer actions, ideally one or two per retro
      - a named owner for each action
      - putting improvement work on the board or into the sprint
      - reviewing last retro's actions at the start of the next
      - making actions small and specific enough to finish
    rubric:
      excellent: Cuts the list to one or two specific actions with owners, puts them into planned work and starts each retro by checking what happened to the last ones.
      good: Assigns owners and follows up on actions.
      weak: Suggests writing better actions or holding retros less often without addressing follow-through.
    followups:
      - What would you do if an action keeps being postponed because delivery work comes first?
      - How do you handle actions that depend on another team?
    common_errors:
      - Producing long action lists that nobody has time for.

  - external_key: problem_solving.process_improvement.manual_deploy_wiki
    competency_key: ci_cd
    topic: Twenty-step manual deployment
    difficulty: easy
    text: >-
      Deploying one of your services means following a wiki page of twenty manual steps that only two people
      are comfortable running. How would you approach improving that?
    expected_concepts:
      - walk through a deploy with the experts and record what really happens
      - script the steps incrementally, starting with the riskiest or most repetitive
      - move the script into the CI/CD pipeline
      - have other team members run deploys to spread knowledge
      - add checks and a rollback path
    rubric:
      excellent: Captures the real steps with the experts, automates them incrementally into the pipeline with checks and rollback, and gets more people running deploys along the way.
      good: Plans to script or automate the deployment.
      weak: Suggests rewriting the wiki page more clearly and leaving it manual.
    followups:
      - How would you avoid breaking production while you automate it step by step?
      - What would you automate first, and why?
    common_errors:
      - Trying to automate everything in one big rewrite instead of step by step.

  - external_key: problem_solving.process_improvement.unreproducible_bug_reports
    competency_key: testing
    topic: Bug reports developers can't reproduce
    difficulty: easy
    text: >-
      Developers keep sending bug reports back to QA because they can't reproduce the problem from what's
      written. How would you improve the way bugs are reported and handed over?
    expected_concepts:
      - agree on the minimum information a report needs (steps, expected, actual, environment, build)
      - a bug template with required fields
      - attaching logs, screenshots or recordings
      - a quick conversation for unclear bugs instead of ping-pong comments
      - reviewing returned reports to find common gaps
    rubric:
      excellent: Defines what a reproducible report needs together with developers, builds it into a template, encourages attaching evidence and looks at returned reports to see which gaps keep recurring.
      good: Introduces a bug template with steps, environment and expected behaviour.
      weak: Puts the blame on developers or QA without changing the handoff.
    followups:
      - What would you do about bugs that are genuinely intermittent?
      - How do you keep a template from becoming a box-ticking exercise?
    common_errors:
      - Making the template so long that people skip it.

  # -------------------------------------------------------------- medium
  - external_key: problem_solving.process_improvement.monthly_release_to_frequent
    competency_key: ci_cd
    topic: Moving from monthly to frequent releases
    difficulty: medium
    text: >-
      Your company ships one big release a month, and release week is always a scramble with late nights and
      rollbacks. If you were asked to change that, how would you plan the move toward smaller, more frequent
      releases?
    expected_concepts:
      - understand what currently forces batching (manual testing, approvals, environments)
      - automate the slowest gates first
      - feature flags to separate deploy from release
      - increase frequency in steps, such as monthly to biweekly to weekly
      - track change failure rate and lead time as frequency rises
    rubric:
      excellent: Identifies the specific constraints that force batching, removes them in order of impact, uses feature flags to decouple deploy from release, and increases frequency in stages while watching failure rate and lead time.
      good: Proposes more automation and smaller releases with some sequencing.
      weak: Simply announces a faster cadence without changing what makes releases painful.
    followups:
      - Which teams or stakeholders would push back, and how would you handle that?
      - What would make you slow the transition down?
    common_errors:
      - Increasing release frequency before automating testing, which multiplies the pain.

  - external_key: problem_solving.process_improvement.testing_crunch_end_of_sprint
    competency_key: agile_delivery
    topic: Testing piling up at sprint end
    difficulty: medium
    text: >-
      Testing always piles up in the last two days of every sprint, so stories either get rushed through or
      carried over. How would you rework the way development and QA hand work to each other?
    expected_concepts:
      - smaller stories that reach testing earlier
      - limit work in progress so items finish before new ones start
      - QA involved in refinement and acceptance criteria
      - developers and testers working on the same story together
      - more automated tests written during development
    rubric:
      excellent: Explains that the crunch comes from batching and large stories, and fixes it with smaller stories, WIP limits, QA involvement from refinement onwards and shared ownership of testing.
      good: Suggests involving QA earlier and splitting stories.
      weak: Suggests adding a testing-only sprint or hiring more testers without changing the flow.
    followups:
      - How would you measure whether work is now flowing more evenly?
      - What would you say to developers who feel testing isn't their job?
    common_errors:
      - Treating the problem as a QA capacity issue instead of a batching issue.

  - external_key: problem_solving.process_improvement.postmortem_actions_stall
    competency_key: incident_response
    topic: Postmortem follow-ups never prioritised
    difficulty: medium
    text: >-
      After each incident your team writes a solid postmortem, yet the same kinds of outages keep recurring
      because the follow-up actions never get prioritised. How would you fix that loop?
    expected_concepts:
      - track postmortem actions in the same backlog as other work
      - owners and due dates for each action
      - distinguish urgent fixes from longer-term improvements
      - regular review of open actions with leadership visibility
      - link recurring incidents to unfinished actions to show the cost
    rubric:
      excellent: Puts actions into the normal backlog with owners and dates, separates must-do fixes from nice-to-haves, reviews them regularly and uses recurring incidents to show the cost of inaction when negotiating priority.
      good: Assigns owners and tracks actions to completion.
      weak: Writes more detailed postmortems without changing how actions get done.
    followups:
      - How would you convince a product manager to give up feature work for these fixes?
      - How many actions per postmortem is reasonable?
    common_errors:
      - Keeping postmortem actions in a separate document that nobody plans from.

  - external_key: problem_solving.process_improvement.shared_staging_contention
    competency_key: ci_cd
    topic: Teams fighting over one staging environment
    difficulty: medium
    text: >-
      Five teams share a single staging environment, and they constantly block each other or overwrite each
      other's deployments. How would you approach solving that?
    expected_concepts:
      - understand what each team actually uses staging for
      - short-lived per-branch or per-team environments
      - shift more testing to earlier stages such as contract tests
      - a reservation or deploy-lock mechanism as a short-term fix
      - manage the cost of extra environments
    rubric:
      excellent: Separates the short-term coordination fix from the longer-term answer of ephemeral environments and earlier testing, and considers cost and test data along the way.
      good: Proposes either more environments or a booking system with reasonable detail.
      weak: Suggests a shared calendar and leaves the underlying contention in place.
    followups:
      - What would make ephemeral environments hard to adopt in practice?
      - How would you handle shared dependencies like databases or third-party sandboxes?
    common_errors:
      - Cloning full production-size environments for every team without considering cost.

  - external_key: problem_solving.process_improvement.oncall_weekly_handover
    competency_key: incident_response
    topic: Weak on-call handovers
    difficulty: medium
    text: >-
      On-call shifts change over every week, and the incoming engineer often learns about an ongoing problem
      only when it pages them again. How would you design a better handover?
    expected_concepts:
      - a short written handover covering open issues, recent changes and noisy alerts
      - a brief live handover for anything active
      - links to tickets, dashboards and runbooks
      - a consistent template or channel
      - reviewing handovers to keep them useful
    rubric:
      excellent: Designs a lightweight written and live handover with a fixed structure that covers ongoing issues, risky changes and context links, and keeps it short enough that people actually do it.
      good: Proposes a handover note or meeting with the key items.
      weak: Expects the incoming engineer to read the alert history.
    followups:
      - What belongs in a handover and what is just noise?
      - How would this change if the team spans several time zones?
    common_errors:
      - Designing a handover so long that it gets skipped under pressure.

  - external_key: problem_solving.process_improvement.merge_to_customer_lead_time
    competency_key: problem_solving
    topic: Measuring where delivery time goes
    difficulty: medium
    text: >-
      Leadership says getting a feature from merged code into customers' hands takes too long, but nobody can
      say how long it actually takes. How would you measure it and find where the delays are?
    expected_concepts:
      - define start and end points clearly
      - pull timestamps from version control, CI, deployment and release tools
      - break the total into stages and look at waiting versus working time
      - use distributions and outliers, not just averages
      - validate findings with the people involved
    rubric:
      excellent: Defines the measurement precisely, reconstructs stage-by-stage timings from tool data, separates waiting from active work, looks at the distribution and confirms the story with the teams before proposing fixes.
      good: Plans to collect timestamps and find the slowest stage.
      weak: Relies on opinions or a survey about what feels slow.
    followups:
      - What would you do if some stages have no timestamps at all?
      - How would you present this so teams don't feel blamed?
    common_errors:
      - Reporting only an average that hides long-tail delays.

  - external_key: problem_solving.process_improvement.design_states_missing
    competency_key: collaboration
    topic: Design to engineering handoff gaps
    difficulty: medium
    text: >-
      Engineers on your team often start building a feature and then discover the designs are missing states
      such as errors, empty screens or loading. How would you improve the handoff between design and
      engineering?
    expected_concepts:
      - involve engineers in design reviews before handoff
      - a shared checklist of states every design should cover
      - a short kickoff conversation when work starts
      - agreed way to resolve gaps quickly during build
      - look back at gaps found late to improve the checklist
    rubric:
      excellent: Moves the conversation earlier with engineers in design review, agrees a shared checklist of states, adds a quick kickoff and a fast path for questions, and refines the checklist from what slips through.
      good: Proposes a checklist or earlier engineer involvement.
      weak: Asks designers to be more thorough without changing how the teams work together.
    followups:
      - How would you handle a gap discovered the day before release?
      - Who should own deciding what an error state looks like?
    common_errors:
      - Treating the handoff as a one-way delivery of finished designs.

  - external_key: problem_solving.process_improvement.unsafe_hotfix_path
    competency_key: ci_cd
    topic: Hotfixes that skip every safeguard
    difficulty: medium
    text: >-
      When a critical bug hits production, your team's hotfixes skip testing and review entirely, and one of
      them recently caused a second outage. How would you design a hotfix process that's fast but still safe?
    expected_concepts:
      - a defined expedited path rather than no path
      - minimal but mandatory checks such as a fast test subset and one reviewer
      - prefer rollback or a feature flag over a code fix when possible
      - deploy progressively with monitoring
      - merge the fix back into the main branch afterwards
    rubric:
      excellent: Designs an explicit expedited lane with a small set of non-negotiable checks, prefers rollback or flags when they fix the issue, rolls out progressively and makes sure the fix is merged back and reviewed after the fact.
      good: Keeps some testing and review in the hotfix path and adds monitoring.
      weak: Either keeps the unsafe status quo or applies the full normal process, making hotfixes slow.
    followups:
      - Who should be allowed to decide that something qualifies as a hotfix?
      - How would you make sure the fix doesn't get lost when the next release branch is cut?
    common_errors:
      - Forgetting to port the hotfix back, so the bug returns in the next release.

  - external_key: problem_solving.process_improvement.vague_ticket_intake
    competency_key: agile_delivery
    topic: One-line tickets from requesters
    difficulty: medium
    text: >-
      Tickets reach your team with one-line descriptions, and engineers spend a lot of time chasing the
      requester for details. How would you improve the intake process without adding heavy bureaucracy?
    expected_concepts:
      - a short request form with a few required questions
      - a triage step before work enters the backlog
      - ask about the problem and the expected outcome, not just the solution
      - send incomplete tickets back with specific questions
      - check whether chasing time actually drops
    rubric:
      excellent: Adds a light structured intake with a few questions about problem and outcome, a triage step that returns incomplete requests quickly, and checks that the overhead stays small.
      good: Proposes a ticket template and a triage owner.
      weak: Builds a long mandatory form or simply rejects poor tickets.
    followups:
      - Which three questions would you put on the form?
      - What would you do when an important stakeholder ignores the form?
    common_errors:
      - Designing a form so long that people bypass it through chat.

  - external_key: problem_solving.process_improvement.overnight_regression_suite
    competency_key: test_automation
    topic: Regression suite too slow for fast feedback
    difficulty: medium
    text: >-
      Your full regression suite takes eleven hours to run, so it only runs overnight and failures are found a
      day late. How would you restructure testing so feedback arrives sooner?
    expected_concepts:
      - split into fast, targeted tiers run on every change
      - parallelise tests across machines
      - push coverage down to unit and API level instead of end-to-end
      - select tests based on what changed
      - remove duplicate or low-value tests
    rubric:
      excellent: Tiers the suite so a fast, targeted set runs on every change, parallelises the rest, moves coverage down the test pyramid and prunes low-value tests, while keeping the full run as a safety net.
      good: Suggests parallelising and running a smoke subset more often.
      weak: Suggests running the full suite less often or only before releases.
    followups:
      - How would you decide which tests go into the fast tier?
      - What risks come with test selection based on changed code?
    common_errors:
      - Only adding machines without reducing the number of slow end-to-end tests.

  - external_key: problem_solving.process_improvement.go_no_go_meeting
    competency_key: project_management
    topic: Release go/no-go meeting that adds little
    difficulty: medium
    text: >-
      Your weekly release go or no-go meeting has fifteen attendees, lasts an hour and almost never changes the
      decision. How would you rethink it?
    expected_concepts:
      - find out what information the decision really depends on
      - publish release readiness criteria and status in advance
      - automate checks that people currently report verbally
      - keep a short meeting only for exceptions or open risks
      - a named decision owner and a small set of required attendees
    rubric:
      excellent: Identifies what the decision really needs, turns routine readiness checks into published or automated criteria, gives one owner the decision and keeps a short meeting only when there is a genuine risk to discuss.
      good: Reduces attendees and shares a readiness checklist beforehand.
      weak: Cancels the meeting without replacing the checks it performs, or keeps it unchanged.
    followups:
      - What would make you call a meeting even when the criteria are all green?
      - How would you handle people who feel they need to be in the room?
    common_errors:
      - Removing the meeting while the readiness information still only exists in people's heads.

  # ---------------------------------------------------------------- hard
  - external_key: problem_solving.process_improvement.weekly_change_board
    competency_key: ci_cd
    topic: Weekly change board slowing every change
    difficulty: hard
    text: >-
      Every production change at your company needs approval from a weekly change board, so even a one-line
      config fix can wait six days. How would you make the case for a faster approval path, and what would it
      look like, without losing control?
    expected_concepts:
      - data on lead time, change volume and whether the board actually catches problems
      - classify changes by risk (standard, normal, emergency)
      - pre-approved standard changes with automated evidence
      - automated controls in the pipeline (tests, peer review, audit trail)
      - keep human review for high-risk changes only
      - pilot with one team and report results
    rubric:
      excellent: Builds a case from data on delays and on what the board has caught, proposes risk-based change classes with automated pipeline controls and audit evidence, keeps human review for genuinely risky changes and pilots before scaling.
      good: Proposes risk categories and some automation of approvals.
      weak: Argues to remove the board entirely, or accepts the delay as the price of control.
    followups:
      - What evidence would satisfy the people who set up the board in the first place?
      - How would you handle a failure in the pilot that the old board might have caught?
    common_errors:
      - Ignoring the compliance or audit reasons the board exists.

  - external_key: problem_solving.process_improvement.multi_team_release_coordination
    competency_key: project_management
    topic: Coordinating releases across interdependent teams
    difficulty: hard
    text: >-
      You've been asked to coordinate releases for eight teams whose services depend on each other, and today
      every release involves a long call where someone discovers an incompatible change at the last minute.
      How would you redesign the release process across those teams?
    expected_concepts:
      - make dependencies visible early in planning
      - backward-compatible changes and API versioning so teams can release independently
      - contract tests between services
      - feature flags to decouple deployment from launch
      - a shared release calendar for the truly coupled changes
      - reduce the need for coordination rather than only coordinate better
    rubric:
      excellent: Aims to reduce coupling through compatibility rules, contract tests and flags so most teams can release independently, while adding early dependency visibility and a lightweight plan for the few changes that must ship together.
      good: Improves coordination with earlier dependency tracking and integration testing.
      weak: Adds more coordination meetings or a longer release freeze.
    followups:
      - How would you get eight teams to agree on compatibility rules?
      - What would you do about a change that truly has to ship in lockstep?
    common_errors:
      - Optimising the release call instead of removing the need for it.

  - external_key: problem_solving.process_improvement.senior_workaround_new_process
    competency_key: stakeholder_management
    topic: Senior engineers bypassing a new process
    difficulty: hard
    text: >-
      You've introduced a new process that the data says is working, but a group of senior engineers keeps
      working around it and others are starting to follow them. How would you handle that?
    expected_concepts:
      - talk to them one to one to understand their objections
      - separate valid concerns about the process from preference
      - adjust the process where the criticism is fair
      - share the data and the reason for the process openly
      - involve the senior engineers in owning improvements
      - be clear about which parts are non-negotiable and why
    rubric:
      excellent: Seeks to understand the objections first, adapts the process where they have a point, explains the purpose with evidence, gives the senior engineers ownership of refinements and is clear about which parts must stay.
      good: Talks with the engineers and explains the reasons for the process.
      weak: Either escalates for enforcement immediately or drops the process because of the pushback.
    followups:
      - What if, after talking to them, you realise they're right about part of it?
      - At what point would you escalate, and to whom?
    common_errors:
      - Assuming the pushback is just stubbornness rather than a sign of real friction in the process.

  - external_key: problem_solving.process_improvement.escalation_sla_breaches
    competency_key: technical_support
    topic: Support escalations breaching contractual SLAs
    difficulty: hard
    text: >-
      Your enterprise customers have contractual response times, and escalations to engineering breach them
      about a quarter of the time because nobody is clearly on point. How would you redesign the escalation
      path from support to engineering?
    expected_concepts:
      - analyse breached escalations to find where time is lost
      - clear severity definitions tied to SLA clocks
      - a named engineering on-call or escalation owner per area
      - alerting as an SLA deadline approaches
      - regular status updates back to support and the customer
      - review breaches and feed fixes back into the product
    rubric:
      excellent: Works out where breached escalations lost time, then defines severities tied to the SLA, a named escalation owner per area, automatic warnings before breach, and a loop of updates and reviews.
      good: Proposes an engineering escalation rota and severity levels.
      weak: Asks engineers to watch the support queue more closely.
    followups:
      - How would you protect engineering focus time while guaranteeing response?
      - What would you report to account managers each month?
    common_errors:
      - Treating every escalation as top priority, which makes the real urgent ones slower.

  - external_key: problem_solving.process_improvement.process_overgrowth
    competency_key: agile_delivery
    topic: Deciding which process to cut
    difficulty: hard
    text: >-
      A team you've just taken over has built up so many meetings, sign-offs and templates that engineers spend
      less than half their week building. How would you decide which parts of the process to cut and which to
      keep?
    expected_concepts:
      - inventory every meeting, approval and artefact with its time cost
      - find out what problem each one was originally meant to solve
      - check whether that problem still exists or is solved elsewhere
      - remove or shrink in small experiments and watch for regressions
      - involve the team and stakeholders who rely on the outputs
    rubric:
      excellent: Inventories the process with its cost, traces each part to the problem it was meant to solve, removes or shrinks items as reversible experiments and watches for problems coming back, with the team and dependent stakeholders involved.
      good: Reviews the meetings and approvals with the team and removes low-value ones.
      weak: Cancels most of it on day one, or keeps everything to avoid upsetting anyone.
    followups:
      - How would you tell the difference between process that is useless and process whose value is just invisible?
      - What would you do if a stakeholder insists on keeping a report nobody reads?
    common_errors:
      - Removing safeguards whose purpose nobody remembers and rediscovering it the hard way.

  - external_key: problem_solving.process_improvement.deploy_frequency_gamed
    competency_key: problem_solving
    topic: Process metric improving while outcomes don't
    difficulty: hard
    text: >-
      Six months after your team made deployment frequency a target, the number has tripled, but customers
      aren't seeing changes any faster. What do you think might be happening, and how would you approach it?
    expected_concepts:
      - a measure turned into a target gets optimised for its own sake
      - deployments may be split artificially or be non-customer-facing
      - look at lead time from idea to customer and change failure rate together
      - investigate where customer-visible work is actually waiting
      - use a balanced set of measures and discuss them rather than set targets
    rubric:
      excellent: Recognises that the target is being met without improving the outcome, checks what the extra deploys contain and where customer work waits, and replaces the single target with a balanced set of delivery measures used for learning.
      good: Suggests looking at lead time or what is being deployed.
      weak: Concludes the metric is working or blames the team for gaming it.
    followups:
      - Which other measures would you put alongside deployment frequency?
      - How would you talk to the team about this without implying bad faith?
    common_errors:
      - Replacing one target with another single target and repeating the problem.
