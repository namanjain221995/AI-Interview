# Curated questions: machine learning, LLM engineering and MLOps.
version: 1
defaults:
  role_tags: [ml, llm, data]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------- machine_learning
  - external_key: ml.machine_learning.bias_variance
    competency_key: machine_learning
    topic: Overfitting and the bias-variance trade-off
    difficulty: easy
    kind: technical
    text: >-
      How do you tell whether a model is overfitting or underfitting, and what do you do about each?
    expected_concepts:
      - training versus validation performance gap
      - learning curves
      - regularisation and simpler models
      - more or better data
      - cross-validation
      - increasing capacity for underfitting
    rubric:
      excellent: Diagnoses with train/validation curves, explains the bias-variance trade-off and picks remedies matched to each failure mode with examples.
      good: Correct diagnosis and a few remedies.
      weak: Only says "add more data" without diagnosing.
    followups:
      - Your validation score is great but the test score is poor — what happened?
      - How does early stopping act as regularisation?
    common_errors:
      - Tuning hyperparameters on the test set.
      - Confusing high bias with high variance.

  - external_key: ml.machine_learning.precision_recall
    competency_key: machine_learning
    topic: Choosing evaluation metrics
    difficulty: easy
    kind: technical
    text: >-
      You're building a fraud-detection model where fewer than 1 percent of transactions are fraudulent. Which
      metrics would you use, and why isn't accuracy enough?
    expected_concepts:
      - accuracy is misleading with class imbalance
      - precision and recall trade-off
      - PR-AUC over ROC-AUC for rare positives
      - threshold selection based on business cost
      - confusion matrix
    rubric:
      excellent: Explains why accuracy fails, chooses precision/recall and PR-AUC, ties threshold choice to the cost of false positives and negatives, and mentions monitoring after launch.
      good: Uses precision and recall with a sound explanation.
      weak: Reports accuracy as the main metric.
    followups:
      - How would you choose the decision threshold?
      - Why can ROC-AUC look good while the model is useless in practice?
    common_errors:
      - Reporting 99 percent accuracy on a 99-to-1 imbalanced dataset.
      - Choosing a threshold without considering business costs.

  - external_key: ml.machine_learning.offline_online_gap
    competency_key: machine_learning
    topic: Great offline, poor in production
    difficulty: medium
    kind: scenario
    text: >-
      Your model performed very well offline, but after launch its real-world performance is much worse. What
      are the likely causes, and how would you investigate?
    expected_concepts:
      - data leakage in training
      - training-serving skew in features
      - distribution shift
      - label definition differences
      - feedback loops
      - logging production features for comparison
    rubric:
      excellent: Systematically checks leakage, feature skew (by logging and comparing features), distribution shift and label mismatches, and proposes safeguards such as shadow deployments.
      good: Names leakage and distribution shift and a way to check them.
      weak: Retrains with more epochs.
    followups:
      - How would you detect training-serving skew?
      - Give me an example of target leakage.
    common_errors:
      - Features computed with future information during training.
      - Different preprocessing code paths for training and serving.

  - external_key: ml.machine_learning.imbalanced_data
    competency_key: machine_learning
    topic: Handling imbalanced datasets
    difficulty: medium
    kind: technical
    text: >-
      What techniques do you use when training on a heavily imbalanced dataset, and what are their pitfalls?
    expected_concepts:
      - resampling (over- and under-sampling)
      - class weights
      - synthetic samples (SMOTE) and their risks
      - appropriate metrics
      - stratified splits
      - calibration after resampling
    rubric:
      excellent: Compares techniques with their pitfalls (leakage when oversampling before splitting, calibration distortion) and ties choices to evaluation metrics.
      good: Knows class weights and resampling and stratified splits.
      weak: Unaware that imbalance affects training or evaluation.
    followups:
      - Why must oversampling happen after the train/test split?
      - How does resampling affect predicted probabilities?
    common_errors:
      - Oversampling before splitting, leaking duplicates into validation.
      - Ignoring probability calibration when scores are used as risk estimates.

  - external_key: ml.machine_learning.ranking_evaluation
    competency_key: machine_learning
    topic: Evaluating a ranking or recommendation model
    difficulty: hard
    kind: technical
    round_types: [technical_screening, deep_technical, system_design]
    text: >-
      How would you evaluate a new recommendation model end to end, from offline metrics to deciding whether to
      ship it?
    expected_concepts:
      - offline ranking metrics (NDCG, MAP, recall at k)
      - temporal splits
      - online A/B testing
      - guardrail metrics
      - novelty, diversity and position bias
      - statistical significance and test duration
    rubric:
      excellent: Uses appropriate offline metrics on temporal splits, designs an A/B test with primary and guardrail metrics and power analysis, and accounts for position bias and feedback loops.
      good: Offline metrics plus an A/B test with sensible success metrics.
      weak: Only offline accuracy.
    followups:
      - Why might offline metrics disagree with A/B test results?
      - How long should the experiment run?
    common_errors:
      - Random splits that leak future interactions.
      - Stopping A/B tests early when results look good.

  - external_key: ml.machine_learning.feature_stores
    competency_key: machine_learning
    topic: Feature engineering and feature stores
    difficulty: medium
    kind: technical
    role_tags: [ml, data]
    text: >-
      Tell me about a feature you engineered that made a big difference. When is a feature store worth
      introducing?
    expected_concepts:
      - domain-driven feature design
      - point-in-time correctness
      - offline and online consistency
      - feature reuse across teams
      - freshness requirements
      - operational cost of a feature store
    rubric:
      excellent: Describes a concrete feature with measured impact, explains point-in-time correctness and online/offline consistency, and weighs feature-store benefits against operational cost.
      good: Good feature example and understands consistency issues.
      weak: Cannot describe a real feature or its impact.
    followups:
      - What is a point-in-time join, and why does it matter?
      - What would you do without a feature store?
    common_errors:
      - Joining features as of today onto historical labels.
      - Recomputing features differently in batch and real time.

  # -------------------------------------------------------- llm_engineering
  - external_key: ml.llm.rag_vs_finetuning
    competency_key: llm_engineering
    topic: RAG versus fine-tuning
    difficulty: easy
    kind: technical
    text: >-
      When would you use retrieval-augmented generation, and when would you fine-tune a model instead?
    expected_concepts:
      - RAG for fresh or proprietary knowledge
      - citations and grounding
      - fine-tuning for style, format or task behaviour
      - cost and update frequency
      - combining both
    rubric:
      excellent: Distinguishes knowledge injection from behaviour shaping, weighs freshness, cost, evaluation and data needs, and gives a scenario where both are combined.
      good: Correct basic distinction with an example.
      weak: Believes fine-tuning is the main way to add frequently changing facts.
    followups:
      - How would you keep a RAG system's knowledge current?
      - What data would you need to fine-tune for a strict output format?
    common_errors:
      - Fine-tuning to teach facts that change weekly.
      - Assuming RAG removes hallucinations entirely.

  - external_key: ml.llm.retrieval_quality
    competency_key: llm_engineering
    topic: Chunking and retrieval quality
    difficulty: medium
    kind: technical
    text: >-
      Your RAG system often retrieves the wrong passages. How would you improve retrieval quality?
    expected_concepts:
      - chunk size and overlap
      - structure-aware chunking
      - embedding model choice
      - hybrid search (keyword plus vector)
      - reranking with a cross-encoder
      - metadata filters
      - retrieval evaluation (recall at k)
    rubric:
      excellent: Builds a retrieval evaluation set first, then iterates on chunking, hybrid search, reranking and filters, measuring recall at each step.
      good: Mentions chunking, hybrid search and reranking.
      weak: Only changes the prompt.
    followups:
      - How would you measure retrieval quality separately from answer quality?
      - When does keyword search beat embeddings?
    common_errors:
      - Fixed-size chunks that split tables or code mid-way.
      - Evaluating only final answers, hiding retrieval failures.

  - external_key: ml.llm.hallucinations
    competency_key: llm_engineering
    topic: Reducing hallucinations in a support assistant
    difficulty: medium
    kind: scenario
    text: >-
      Your customer-support assistant sometimes invents refund policies that don't exist. How would you reduce
      this, and how would you know it's working?
    expected_concepts:
      - grounding in retrieved policy documents
      - instructions to answer only from context and to refuse otherwise
      - citations
      - structured outputs and validation
      - evaluation sets with known answers
      - human escalation paths
    rubric:
      excellent: Combines grounding, refusal behaviour, citations and validation, and measures with an evaluation set and production sampling, including escalation to humans.
      good: Uses retrieval grounding and stricter prompts with some evaluation.
      weak: Only asks the model to "not hallucinate".
    followups:
      - How would you measure the hallucination rate?
      - What should the assistant do when the documents don't answer the question?
    common_errors:
      - No evaluation, so improvements are anecdotal.
      - Letting the model answer from general knowledge for policy questions.

  - external_key: ml.llm.evaluation
    competency_key: llm_engineering
    topic: Evaluating LLM applications
    difficulty: hard
    kind: technical
    text: >-
      How do you evaluate an LLM-powered feature before and after each change to prompts, models or retrieval?
    expected_concepts:
      - curated golden datasets
      - task-specific automatic metrics
      - LLM-as-judge with calibration against human labels
      - regression testing in CI
      - online metrics and user feedback
      - cost and latency tracking
    rubric:
      excellent: Designs a layered evaluation (golden sets, automatic checks, calibrated LLM judges, human review, online metrics) wired into CI with cost and latency tracking, and knows judge biases.
      good: Uses a test set and some automatic scoring.
      weak: Evaluates by trying a few prompts by hand.
    followups:
      - What biases do LLM judges have, and how do you control for them?
      - How large should the golden set be?
    common_errors:
      - Trusting an uncalibrated LLM judge.
      - Changing prompts without regression tests.

  - external_key: ml.llm.serving_latency_cost
    competency_key: llm_engineering
    topic: Serving LLMs with low latency and cost
    difficulty: hard
    kind: scenario
    role_tags: [ml, llm, platform]
    round_types: [technical_screening, deep_technical, system_design]
    text: >-
      You need to serve an open-weight LLM for a real-time voice product where the first token must arrive
      within a few hundred milliseconds. How would you approach serving it?
    expected_concepts:
      - time to first token versus throughput
      - continuous batching
      - KV cache and prefix caching
      - quantisation trade-offs
      - speculative decoding
      - streaming responses
      - autoscaling GPUs and load shedding
    rubric:
      excellent: Separates TTFT from throughput, combines batching, prefix caching, quantisation and streaming, plans capacity and autoscaling, and validates with load tests.
      good: Mentions streaming, batching and quantisation correctly.
      weak: Proposes only bigger GPUs.
    followups:
      - How does prompt length affect time to first token?
      - When does quantisation hurt quality too much?
    common_errors:
      - Measuring only total latency, not time to first token.
      - Large batches that improve throughput but hurt TTFT.

  - external_key: ml.llm.prompt_injection
    competency_key: llm_engineering
    topic: Prompt injection and tool safety
    difficulty: medium
    kind: technical
    role_tags: [ml, llm, security]
    text: >-
      Your LLM agent can read emails and call internal tools. What is prompt injection in this setting, and how
      would you defend against it?
    expected_concepts:
      - direct and indirect injection through content
      - treating retrieved content as untrusted data
      - least-privilege tool permissions
      - human confirmation for sensitive actions
      - output validation and allow-lists
      - monitoring and red-teaming
    rubric:
      excellent: Explains indirect injection through documents, designs defence in depth (privilege separation, confirmations, validation, monitoring), and admits no prompt-only fix is complete.
      good: Understands injection and proposes restricting tool permissions.
      weak: Relies on telling the model to ignore malicious instructions.
    followups:
      - Why can't a system prompt alone stop indirect injection?
      - Which actions would always require human confirmation?
    common_errors:
      - Giving the agent broad credentials.
      - Trusting retrieved content as instructions.

  - external_key: ml.llm.structured_output
    competency_key: llm_engineering
    topic: Reliable structured output
    difficulty: medium
    kind: technical
    text: >-
      How do you get reliable structured output — for example valid JSON matching a schema — from an LLM in
      production?
    expected_concepts:
      - schema-constrained or guided decoding
      - function or tool calling
      - validation with a schema library
      - repair and retry strategies
      - field ordering and streaming considerations
      - fallbacks when validation fails
    rubric:
      excellent: Uses constrained decoding where available, validates every response, retries with error feedback, defines fallbacks and monitors failure rates.
      good: Uses JSON mode or tools plus validation.
      weak: Parses free text with regular expressions and hopes.
    followups:
      - What would you do when validation fails three times?
      - How can field order in the schema affect latency?
    common_errors:
      - No validation of model output before use.
      - Retrying without telling the model what was wrong.

  - external_key: ml.llm.fine_tuning_decisions
    competency_key: llm_engineering
    topic: Fine-tuning approach and pitfalls
    difficulty: hard
    kind: technical
    text: >-
      If you decided to fine-tune an open model for your domain, how would you go about it, and what could go
      wrong?
    expected_concepts:
      - parameter-efficient methods (LoRA, QLoRA)
      - data curation and quality
      - train/validation splits and evaluation before and after
      - catastrophic forgetting
      - overfitting on small datasets
      - serving adapters
    rubric:
      excellent: Plans data curation, chooses parameter-efficient methods with hyperparameter reasoning, evaluates against a baseline on task and general benchmarks, and watches for forgetting.
      good: Knows LoRA, evaluation and data quality matter.
      weak: Plans to fine-tune on whatever data is available without evaluation.
    followups:
      - How much data do you need for a formatting task versus a knowledge task?
      - How would you detect catastrophic forgetting?
    common_errors:
      - No baseline comparison against prompting alone.
      - Training data that leaks evaluation examples.

  # ------------------------------------------------------------------ mlops
  - external_key: ml.mlops.reproducibility
    competency_key: mlops
    topic: Reproducible training
    difficulty: easy
    kind: technical
    role_tags: [ml, data, platform]
    text: >-
      If someone asks you to reproduce a model you trained six months ago, what would you need to have kept, and
      how do you set that up from the start?
    expected_concepts:
      - versioned code
      - versioned or snapshotted data
      - experiment tracking (parameters, metrics, artefacts)
      - environment and dependency pinning
      - random seeds
      - model registry
    rubric:
      excellent: Covers code, data, environment, configuration and seeds with tooling, and explains how they would actually rerun the training.
      good: Mentions code and data versioning and experiment tracking.
      weak: Relies on notebooks and memory.
    followups:
      - How do you version a 2 TB training dataset?
      - Why might the same code and data still give different results?
    common_errors:
      - Unpinned dependencies.
      - Training data overwritten in place.

  - external_key: ml.mlops.ml_deployment
    competency_key: mlops
    topic: Deploying models safely
    difficulty: medium
    kind: technical
    role_tags: [ml, data, platform]
    text: >-
      How do you take a new model version from training to production safely, including rolling back if it
      misbehaves?
    expected_concepts:
      - model registry and versioned artefacts
      - automated validation gates
      - shadow or canary deployment
      - online metrics and guardrails
      - rollback to a previous version
      - compatibility of features and schemas
    rubric:
      excellent: Describes registry-based promotion with automated gates, shadow or canary rollout with guardrail metrics and quick rollback, and feature compatibility checks.
      good: Registry plus canary or shadow deployment.
      weak: Copies model files onto servers manually.
    followups:
      - What does a shadow deployment tell you that offline evaluation doesn't?
      - How do you roll back if the new model needs a new feature?
    common_errors:
      - No rollback path.
      - Deploying models without monitoring prediction quality.

  - external_key: ml.mlops.monitoring_drift
    competency_key: mlops
    topic: Monitoring models in production
    difficulty: medium
    kind: scenario
    role_tags: [ml, data, platform]
    text: >-
      Labels for your model only arrive weeks later. How would you monitor whether the model is still working in
      the meantime?
    expected_concepts:
      - input feature drift
      - prediction distribution drift
      - proxy metrics and business KPIs
      - data quality checks (nulls, ranges, schema)
      - delayed-label evaluation when labels arrive
      - alert thresholds and retraining triggers
    rubric:
      excellent: Monitors data quality, feature and prediction drift with statistical tests, uses proxies and business metrics, evaluates properly when labels arrive and defines retraining triggers.
      good: Monitors input and prediction drift plus data quality.
      weak: Waits for labels or for complaints.
    followups:
      - Which statistic would you use to detect feature drift?
      - Does drift always mean the model got worse?
    common_errors:
      - Alerting on every small drift, causing noise.
      - Ignoring upstream data pipeline failures.

  - external_key: ml.mlops.gpu_scheduling
    competency_key: mlops
    topic: GPU scheduling and utilisation
    difficulty: hard
    kind: scenario
    role_tags: [ml, platform, devops]
    round_types: [technical_screening, deep_technical, system_design]
    text: >-
      Several teams share a GPU cluster for training and inference, utilisation is low and people still wait for
      GPUs. How would you fix that?
    expected_concepts:
      - job queues and fair-share scheduling
      - quotas and priorities
      - preemption for low-priority work
      - GPU sharing (MIG, time-slicing)
      - bin packing and gang scheduling
      - utilisation metrics and chargeback
    rubric:
      excellent: Diagnoses with utilisation data, introduces queueing with fair share and priorities, uses preemption and GPU sharing where appropriate, and adds visibility and accountability.
      good: Proposes a scheduler with quotas and priorities.
      weak: Buys more GPUs.
    followups:
      - When would you split a GPU between workloads?
      - How do you stop one team from hoarding GPUs?
    common_errors:
      - Static allocation per team leaving GPUs idle.
      - No checkpointing, making preemption expensive.
