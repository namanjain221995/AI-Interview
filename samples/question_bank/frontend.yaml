# Curated questions: frontend engineering (JavaScript, TypeScript, React, testing, accessibility).
version: 1
defaults:
  role_tags: [frontend, fullstack]
  round_types: [technical_screening, deep_technical, combined]
questions:
  # ------------------------------------------------------------- javascript
  - external_key: frontend.javascript.equality_scope
    competency_key: javascript
    topic: Equality, scope and hoisting
    difficulty: easy
    kind: technical
    text: >-
      What's the difference between double and triple equals in JavaScript, and between var, let and const?
      Have any of these ever caused a bug for you?
    expected_concepts:
      - type coercion with ==
      - strict equality with ===
      - function scope (var) versus block scope (let, const)
      - hoisting and the temporal dead zone
      - const prevents rebinding, not mutation
    rubric:
      excellent: Explains coercion rules, scoping and hoisting precisely, notes that const does not freeze objects and gives a real bug example such as var in a loop with callbacks.
      good: Correct core distinctions.
      weak: Believes const makes objects immutable or cannot explain coercion.
    followups:
      - What does `[] == false` evaluate to, and why?
      - Why do closures inside a `for (var i ...)` loop all see the same value?
    common_errors:
      - Assuming const objects cannot be mutated.
      - Relying on loose equality with null and undefined unintentionally.

  - external_key: frontend.javascript.event_loop
    competency_key: javascript
    topic: Event loop, microtasks and macrotasks
    difficulty: medium
    kind: technical
    text: >-
      Explain how the JavaScript event loop schedules work. If code logs from a setTimeout of zero, a resolved
      promise's then-callback and plain synchronous code, in what order do they appear and why?
    expected_concepts:
      - call stack and synchronous code first
      - microtask queue (promises, queueMicrotask)
      - macrotask queue (timers, I/O)
      - microtasks drain before the next macrotask
      - rendering opportunities between tasks
    rubric:
      excellent: Gives the correct order (sync, promise callback, timeout) with a precise explanation of queue draining and the impact on rendering and long tasks.
      good: Correct order with a reasonable explanation.
      weak: Thinks setTimeout with zero runs immediately or before promises.
    followups:
      - How can a long chain of microtasks freeze the UI?
      - Where does requestAnimationFrame fit?
    common_errors:
      - Believing setTimeout(fn, 0) runs before promise callbacks.
      - Ignoring that long synchronous work blocks rendering.

  - external_key: frontend.javascript.closures
    competency_key: javascript
    topic: Closures and stale values
    difficulty: medium
    kind: technical
    text: >-
      What is a closure, and can you describe a bug caused by a closure capturing a stale value — for example in
      a timer, an event handler or a React hook?
    expected_concepts:
      - functions capture their lexical environment
      - stale closures over old state
      - loop variable capture
      - fixes such as functional updates or refs
      - memory retention through closures
    rubric:
      excellent: Defines closures precisely, explains a realistic stale-closure bug and its fix, and notes memory implications.
      good: Correct definition and a plausible bug.
      weak: Vague definition and no concrete example.
    followups:
      - In React, why might setInterval inside useEffect always see the initial state?
      - How can closures cause memory leaks?
    common_errors:
      - Reading state captured at subscription time inside long-lived callbacks.
      - Forgetting to clean up listeners that capture large objects.

  - external_key: frontend.javascript.memory_leaks
    competency_key: javascript
    topic: Memory leaks in single-page apps
    difficulty: hard
    kind: scenario
    text: >-
      Users report that your single-page app becomes sluggish after being open for a few hours. How would you
      find out whether it's a memory leak and track it down?
    expected_concepts:
      - heap snapshots and comparison in DevTools
      - detached DOM nodes
      - event listeners and intervals not cleaned up
      - caches and global stores growing without bound
      - subscriptions and WebSockets
      - performance monitoring in production
    rubric:
      excellent: Reproduces with a scripted user flow, compares heap snapshots to find retained objects, identifies common culprits and verifies the fix with memory measurements.
      good: Uses DevTools memory tools and names likely causes.
      weak: Suggests asking users to refresh the page.
    followups:
      - What is a detached DOM node, and how does it stay in memory?
      - How would you detect this regression before release?
    common_errors:
      - Not removing listeners or intervals on unmount.
      - Unbounded client-side caches.

  # ------------------------------------------------------------- typescript
  - external_key: frontend.typescript.type_basics
    competency_key: typescript
    topic: type versus interface, unknown versus any
    difficulty: easy
    kind: technical
    role_tags: [frontend, fullstack, backend]
    text: >-
      When do you use a type alias versus an interface in TypeScript, and why might you prefer unknown over any?
    expected_concepts:
      - interfaces are extendable and mergeable
      - type aliases for unions and mapped types
      - any disables type checking
      - unknown forces narrowing before use
      - narrowing with type guards
    rubric:
      excellent: Explains practical differences, prefers unknown for untrusted input with narrowing, and has a consistent team convention.
      good: Correct differences and understands unknown requires narrowing.
      weak: Uses any routinely to silence errors.
    followups:
      - How would you safely handle the result of JSON.parse?
      - What is declaration merging?
    common_errors:
      - Casting with `as` instead of validating untrusted data.
      - Using any in shared types.

  - external_key: frontend.typescript.discriminated_unions
    competency_key: typescript
    topic: Generics and discriminated unions
    difficulty: medium
    kind: technical
    role_tags: [frontend, fullstack, backend]
    text: >-
      How would you type the state of an API request — loading, success with data, or error — so that the
      compiler stops you from reading data that isn't there?
    expected_concepts:
      - discriminated union with a status field
      - narrowing via switch or if on the discriminant
      - generic type parameter for the data
      - exhaustiveness checking with never
      - avoiding optional fields for everything
    rubric:
      excellent: Writes a discriminated union with a generic data type, explains narrowing and exhaustiveness checks, and contrasts it with a bag of optional fields.
      good: Uses a union with a status discriminant correctly.
      weak: Uses one object with every field optional.
    followups:
      - How do you make the compiler fail when someone adds a new status?
      - How would you generate these types from an OpenAPI schema?
    common_errors:
      - Optional fields that allow impossible combinations.
      - Missing exhaustiveness checks in switch statements.

  - external_key: frontend.typescript.strict_migration
    competency_key: typescript
    topic: Migrating a large codebase to strict TypeScript
    difficulty: hard
    kind: scenario
    role_tags: [frontend, fullstack, tech_lead]
    round_types: [technical_screening, deep_technical, combined, leadership]
    text: >-
      You inherit a 300,000-line JavaScript and loosely typed TypeScript codebase. How would you move it to
      strict TypeScript without stopping feature work?
    expected_concepts:
      - incremental adoption per directory or file
      - enabling strict flags one at a time
      - typing boundaries first (API layer, shared models)
      - tracking progress with metrics
      - lint rules to prevent regressions
      - team enablement
    rubric:
      excellent: Plans an incremental, measurable migration that starts at high-value boundaries, prevents backsliding with tooling, and keeps feature delivery going.
      good: Incremental plan with sensible ordering.
      weak: Proposes a big-bang rewrite or enabling strict everywhere at once.
    followups:
      - Which strict flag would you enable first, and why?
      - How would you measure progress?
    common_errors:
      - Mass-adding ignore comments to make the build pass.
      - Typing leaf components before shared data models.

  # --------------------------------------------------------- frontend_react
  - external_key: frontend.react.state_and_props
    competency_key: frontend_react
    topic: State, props and lifting state
    difficulty: easy
    kind: technical
    text: >-
      How do you decide where a piece of state should live in a React application? Walk me through an example
      where you had to lift state up or move it down.
    expected_concepts:
      - props flow down, events flow up
      - local state for local concerns
      - lifting state to the closest common parent
      - derived state should be computed, not stored
      - prop drilling versus context
    rubric:
      excellent: Places state by ownership, avoids duplicating derived state, explains lifting with a concrete example and knows when context is appropriate.
      good: Understands lifting state and prop flow.
      weak: Stores everything in global state or duplicates props into state.
    followups:
      - Why is copying props into state often a bug?
      - When does prop drilling become a real problem?
    common_errors:
      - Storing derived values in state and letting them drift out of sync.
      - Putting all state in a global store by default.

  - external_key: frontend.react.list_keys
    competency_key: frontend_react
    topic: Keys in lists
    difficulty: easy
    kind: technical
    text: >-
      Why does React need keys when rendering lists, and what goes wrong if you use the array index as the key?
    expected_concepts:
      - reconciliation identifies elements by key
      - stable unique identifiers
      - index keys break on reorder, insert or delete
      - lost or mismatched component state
      - performance implications
    rubric:
      excellent: Explains reconciliation, demonstrates the state-mismatch bug with index keys in a reorderable list, and states when index keys are acceptable.
      good: Knows keys must be stable and unique.
      weak: Thinks keys only silence a console warning.
    followups:
      - When is using the index as a key acceptable?
      - What happens to an input's value if items are reordered with index keys?
    common_errors:
      - Using random values as keys, which remounts every item on render.
      - Index keys on lists that can be reordered or filtered.

  - external_key: frontend.react.effects_pitfalls
    competency_key: frontend_react
    topic: useEffect and data fetching pitfalls
    difficulty: medium
    kind: technical
    text: >-
      What are the most common mistakes you've seen with useEffect, especially around data fetching, and how do
      you avoid them?
    expected_concepts:
      - incorrect dependency arrays
      - missing cleanup
      - race conditions when responses arrive out of order
      - AbortController
      - effects for derived state that should be computed
      - server-state libraries such as TanStack Query
    rubric:
      excellent: Explains dependency, cleanup and race-condition bugs with fixes, recognises effects that should not exist, and justifies using a server-state library.
      good: Knows dependencies and cleanup, mentions race conditions.
      weak: Disables the exhaustive-deps lint rule to make warnings go away.
    followups:
      - How do you stop an old response from overwriting a newer one?
      - Why might an effect run twice in development?
    common_errors:
      - Fetching in effects without handling out-of-order responses.
      - Using effects to sync state that could be derived during render.

  - external_key: frontend.react.slow_typing
    competency_key: frontend_react
    topic: Slow rendering while typing
    difficulty: medium
    kind: scenario
    text: >-
      Typing in a search box on one of your pages feels laggy because the results list below re-renders on
      every keystroke. How would you diagnose and fix it?
    expected_concepts:
      - React Profiler to find expensive renders
      - memoisation (memo, useMemo, useCallback) where it helps
      - debouncing or deferring updates (useDeferredValue, transitions)
      - list virtualisation
      - moving state closer to where it is used
    rubric:
      excellent: Measures first with the profiler, separates urgent input updates from expensive list updates, applies memoisation and virtualisation where they pay off, and verifies the improvement.
      good: Suggests debouncing and memoisation sensibly.
      weak: Wraps everything in memo without measuring.
    followups:
      - When does useCallback not help at all?
      - How does useDeferredValue differ from debouncing?
    common_errors:
      - Memoising components whose props change every render anyway.
      - Rendering thousands of rows without virtualisation.

  - external_key: frontend.react.state_management
    competency_key: frontend_react
    topic: Choosing a state-management approach
    difficulty: medium
    kind: technical
    text: >-
      How do you choose between local state, context, a global store and a server-state library such as TanStack
      Query in a React app?
    expected_concepts:
      - server state versus client state
      - caching, deduplication and invalidation in server-state libraries
      - context for low-frequency global values
      - global stores for complex client state
      - re-render costs of context
    rubric:
      excellent: Separates server and client state, matches each tool to the problem, explains context re-render behaviour and invalidation strategies.
      good: Sensible guidance with the server-state distinction.
      weak: One global store for everything including server data.
    followups:
      - Why can a frequently changing value in context hurt performance?
      - How do you invalidate cached data after a mutation?
    common_errors:
      - Hand-rolling caching of server data in a global store.
      - Putting rapidly changing values into a single large context.

  - external_key: frontend.react.design_system
    competency_key: frontend_react
    topic: Building a shared component library
    difficulty: hard
    kind: system_design
    role_tags: [frontend, fullstack, tech_lead]
    round_types: [technical_screening, deep_technical, system_design]
    text: >-
      Five product teams want a shared React component library and design system. How would you design,
      build and roll it out so teams actually adopt it?
    expected_concepts:
      - design tokens and theming
      - accessible primitives
      - composable component APIs
      - versioning and changelogs
      - documentation and visual testing
      - contribution model and governance
    rubric:
      excellent: Covers tokens, accessible composable APIs, versioning and migration, documentation and testing, and an adoption and contribution model with feedback loops.
      good: Sensible technical design with versioning and documentation.
      weak: Focuses only on visual styling.
    followups:
      - How do you ship a breaking change to a button used in 2,000 places?
      - How do you keep components accessible by default?
    common_errors:
      - Component APIs with dozens of boolean props instead of composition.
      - No versioning strategy, so teams fear upgrading.

  - external_key: frontend.react.web_vitals
    competency_key: frontend_react
    topic: Improving Core Web Vitals
    difficulty: hard
    kind: scenario
    text: >-
      Your React app's Largest Contentful Paint and Interaction to Next Paint scores are poor, and marketing says
      it's hurting conversions. How would you approach improving them?
    expected_concepts:
      - field data versus lab data
      - code splitting and bundle analysis
      - image optimisation and priority hints
      - server rendering or streaming for LCP
      - long tasks and hydration cost for INP
      - layout stability for CLS
    rubric:
      excellent: Starts from field data per page, identifies the LCP element and long tasks, applies targeted fixes (preloading, splitting, SSR, breaking up work) and sets performance budgets.
      good: Knows several relevant techniques and to measure first.
      weak: Generic "minify the code" advice.
    followups:
      - How do you find which element is the LCP element?
      - What usually causes a poor INP score?
    common_errors:
      - Optimising lab scores while real-user data stays bad.
      - Lazy-loading the hero image that determines LCP.

  # ---------------------------------------------------------------- testing
  - external_key: frontend.testing.component_tests
    competency_key: testing
    topic: Testing React components
    difficulty: medium
    kind: technical
    text: >-
      How do you test React components so the tests catch real regressions without breaking every time you
      refactor?
    expected_concepts:
      - testing behaviour rather than implementation details
      - accessible queries (role, label)
      - user-event interactions
      - mocking the network (for example with MSW)
      - avoiding snapshot overuse
    rubric:
      excellent: Tests from the user's perspective with accessible queries, mocks the network layer instead of hooks, and explains why snapshot-heavy tests are brittle.
      good: Uses Testing Library sensibly with user interactions.
      weak: Tests internal state or relies on snapshots for everything.
    followups:
      - Why query by role instead of by test id or class name?
      - How do you test a component that fetches data?
    common_errors:
      - Asserting on component internals that change with refactors.
      - Large snapshots nobody reviews.

  - external_key: frontend.react.accessibility
    competency_key: frontend_react
    topic: Accessibility in practice
    difficulty: medium
    kind: technical
    text: >-
      How do you make sure the interfaces you build are accessible to keyboard and screen-reader users? Tell me
      about an accessibility issue you found and fixed.
    expected_concepts:
      - semantic HTML first
      - keyboard navigation and focus management
      - labels and accessible names
      - ARIA only when needed
      - colour contrast
      - automated and manual testing with screen readers
    rubric:
      excellent: Prioritises semantic HTML, handles focus in dialogs and dynamic content, uses automated checks plus manual screen-reader testing, and describes a real fix.
      good: Knows the main practices and some testing tools.
      weak: Equates accessibility with adding alt text only.
    followups:
      - How should focus behave when a modal dialog opens and closes?
      - Why is a clickable div worse than a button?
    common_errors:
      - Clickable divs without keyboard support.
      - Overusing ARIA roles instead of native elements.
