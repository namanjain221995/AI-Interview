# Curated questions: cloud platforms, cost optimisation and security.
version: 1
defaults:
  role_tags: [cloud, devops, platform]
  round_types: [technical_screening, deep_technical, system_design, combined]
questions:
  # -------------------------------------------------------------------- aws
  - external_key: cloud.aws.iam_basics
    competency_key: aws
    topic: IAM users, roles and policies
    difficulty: easy
    kind: technical
    text: >-
      How do IAM users, roles and policies relate to each other, and how do you apply least privilege in
      practice for an application running on AWS?
    expected_concepts:
      - identities versus permissions
      - roles with temporary credentials for workloads
      - identity-based and resource-based policies
      - least privilege and scoping by resource and condition
      - avoiding long-lived access keys
    rubric:
      excellent: Explains how roles issue temporary credentials to workloads, writes narrowly scoped policies and describes how they discover required permissions (access analyzer, logs).
      good: Knows applications should use roles rather than user keys and understands policies.
      weak: Embeds access keys in applications or grants administrator access for convenience.
    followups:
      - How would you find out which permissions a service actually uses?
      - What is the difference between an identity-based and a resource-based policy?
    common_errors:
      - Hard-coding access keys in configuration files.
      - Using wildcard actions and resources in production policies.

  - external_key: cloud.aws.vpc_basics
    competency_key: aws
    topic: VPC design fundamentals
    difficulty: easy
    kind: technical
    text: >-
      Describe how you'd lay out a VPC for a typical web application — subnets, routing and the security
      controls you'd use.
    expected_concepts:
      - public and private subnets across availability zones
      - internet gateway and NAT gateway
      - route tables
      - security groups (stateful) versus network ACLs (stateless)
      - CIDR planning for growth
    rubric:
      excellent: Designs public and private subnets per AZ, explains routing through IGW and NAT, contrasts security groups and NACLs, and plans CIDRs for future peering.
      good: Correct public/private split and security group usage.
      weak: Puts databases in public subnets or cannot explain NAT.
    followups:
      - Why does a private subnet need a NAT gateway to reach the internet?
      - What problems do overlapping CIDR ranges cause later?
    common_errors:
      - Placing databases in public subnets.
      - Confusing stateful security groups with stateless NACLs.

  - external_key: cloud.aws.ha_web_app
    competency_key: aws
    topic: Highly available web application
    difficulty: medium
    kind: system_design
    text: >-
      Suppose you need to run a customer-facing web application on AWS that must survive the loss of an
      availability zone. Which services would you use and how would you lay them out?
    expected_concepts:
      - load balancer across multiple AZs
      - auto scaling group or Kubernetes nodes in several AZs
      - managed database with Multi-AZ failover
      - cache replication
      - stateless application tier
      - health checks and capacity headroom
    rubric:
      excellent: Designs every tier across at least two (ideally three) AZs, explains database failover behaviour and its impact on connections, and sizes capacity to survive one AZ loss.
      good: Uses a load balancer, multiple AZs and a Multi-AZ database.
      weak: Single-AZ components or no thought about the data tier.
    followups:
      - What happens to open database connections during a Multi-AZ failover?
      - Where does session state live in your design?
    common_errors:
      - Keeping session state on individual instances.
      - Running all instances in one AZ behind a multi-AZ load balancer.

  - external_key: cloud.aws.private_subnet_egress
    competency_key: aws
    topic: Private subnet connectivity troubleshooting
    difficulty: medium
    kind: scenario
    text: >-
      An instance in a private subnet can't reach an external payment API, but other instances can. How
      would you troubleshoot it, step by step?
    expected_concepts:
      - route table association and NAT gateway route
      - security group egress rules
      - network ACL rules for return traffic (ephemeral ports)
      - DNS resolution
      - VPC flow logs
      - reachability analysis tools
    rubric:
      excellent: Works layer by layer through routing, security groups, NACLs (including ephemeral ports) and DNS, and uses flow logs or reachability analysis to confirm.
      good: Checks routes, security groups and NAT systematically.
      weak: Guesses randomly or restarts the instance.
    followups:
      - Why do stateless NACLs need rules for ephemeral ports?
      - What would VPC flow logs show you here?
    common_errors:
      - Forgetting return-traffic rules on NACLs.
      - Checking only inbound security group rules.

  - external_key: cloud.aws.eks_specifics
    competency_key: aws
    topic: Running Kubernetes on EKS
    difficulty: medium
    kind: technical
    role_tags: [cloud, devops, platform, sre]
    text: >-
      What's different about running Kubernetes on EKS compared with a self-managed cluster? Tell me about
      the AWS-specific pieces you had to get right.
    expected_concepts:
      - managed control plane and upgrade cadence
      - VPC CNI and pod IP address exhaustion
      - IAM roles for service accounts or Pod Identity
      - managed node groups, Fargate or Karpenter
      - load balancer controller and ingress
      - EBS CSI driver and zonal volumes
    rubric:
      excellent: Covers networking (VPC CNI, IP exhaustion and prefix delegation), workload identity, node provisioning options, storage and upgrade practices from first-hand experience.
      good: Knows the managed control plane, IRSA and node group options.
      weak: Cannot name anything specific to EKS.
    followups:
      - Your cluster ran out of IP addresses — what are your options?
      - How do pods get AWS permissions without node-wide credentials?
    common_errors:
      - Granting broad permissions to the node role instead of per-workload roles.
      - Undersized subnets for the VPC CNI.

  - external_key: cloud.aws.multi_account
    competency_key: aws
    topic: Multi-account strategy
    difficulty: hard
    kind: system_design
    text: >-
      Your company has grown from one AWS account to dozens of teams. How would you organise accounts,
      guardrails and access so teams move fast without creating security or cost chaos?
    expected_concepts:
      - organisations and organisational units
      - service control policies as guardrails
      - account per environment or workload
      - centralised logging and security tooling
      - single sign-on with role-based access
      - account vending automation
      - consolidated billing and tagging
    rubric:
      excellent: Designs an OU structure with guardrail SCPs, automated account vending, central logging and security, SSO-based access and cost allocation, and explains the trade-offs.
      good: Separates environments into accounts and mentions SCPs and central logging.
      weak: Keeps everyone in one account with IAM users.
    followups:
      - What would you block with an SCP across all accounts?
      - How do engineers access accounts without IAM users?
    common_errors:
      - Sharing a single production account among all teams.
      - Creating accounts manually without baseline guardrails.

  - external_key: cloud.aws.region_dr
    competency_key: aws
    topic: Regional disaster recovery
    difficulty: hard
    kind: system_design
    text: >-
      Leadership asks what happens if an entire AWS region goes down. How would you design disaster recovery,
      and how would you decide how much to invest?
    expected_concepts:
      - RTO and RPO definitions
      - backup and restore, pilot light, warm standby, active-active
      - cross-region data replication and its lag
      - DNS or global traffic failover
      - regular DR testing
      - cost versus business impact
    rubric:
      excellent: Starts from business RTO/RPO, compares DR tiers with costs, addresses data replication consistency and failover mechanics, and insists on regular drills.
      good: Knows the DR strategies and replication basics.
      weak: Assumes backups alone are enough without considering restore time.
    followups:
      - How would you test failover without risking production?
      - What data could be lost with asynchronous replication?
    common_errors:
      - Never testing the DR plan.
      - Ignoring dependencies such as identity, secrets or DNS in the recovery region.

  - external_key: cloud.aws.rds_performance
    competency_key: databases
    topic: Managed database performance and failover
    difficulty: medium
    kind: scenario
    role_tags: [cloud, devops, backend]
    text: >-
      Your managed PostgreSQL instance is hitting high CPU and connection limits during peak hours. What
      options would you consider before simply buying a bigger instance?
    expected_concepts:
      - query analysis and slow query logs
      - missing indexes
      - connection pooling (PgBouncer or a managed proxy)
      - read replicas for read-heavy traffic
      - caching hot queries
      - vertical scaling as a last resort
    rubric:
      excellent: Diagnoses with query statistics first, fixes inefficient queries and indexes, adds pooling, offloads reads and caches, and only then sizes up with a cost comparison.
      good: Mentions query optimisation, pooling and read replicas.
      weak: Jumps straight to a bigger instance.
    followups:
      - Why do many short-lived connections hurt PostgreSQL?
      - What consistency issues do read replicas introduce?
    common_errors:
      - Ignoring connection churn from serverless or autoscaled clients.
      - Sending writes-then-reads to replicas and reading stale data.

  # -------------------------------------------------- cloud_cost_optimization
  - external_key: cloud.cost.main_levers
    competency_key: cloud_cost_optimization
    topic: Main cloud cost levers
    difficulty: easy
    kind: technical
    text: >-
      What are the biggest levers for reducing a cloud bill, and which would you try first?
    expected_concepts:
      - rightsizing over-provisioned resources
      - commitment discounts (savings plans or reserved capacity)
      - spot or preemptible capacity
      - storage lifecycle and tiering
      - data transfer and NAT costs
      - turning off idle resources
    rubric:
      excellent: Prioritises by impact and risk, starting with visibility and idle or oversized resources, then commitments and spot for suitable workloads, and calls out hidden costs such as data transfer.
      good: Lists several valid levers with some prioritisation.
      weak: Only mentions deleting unused resources.
    followups:
      - When are commitment discounts a bad idea?
      - Which costs usually surprise teams the most?
    common_errors:
      - Buying commitments before rightsizing.
      - Overlooking data transfer and NAT gateway charges.

  - external_key: cloud.cost.bill_spike
    competency_key: cloud_cost_optimization
    topic: Investigating a cost spike
    difficulty: medium
    kind: scenario
    text: >-
      The monthly cloud bill jumped 30 percent with no planned launches. How would you find out why?
    expected_concepts:
      - cost explorer by service, account and tag
      - daily granularity to find the start date
      - correlating with deploys or configuration changes
      - data transfer and NAT traffic
      - untagged resources
      - anomaly detection and budgets
    rubric:
      excellent: Narrows down by service, account, tag and day, correlates with change history, checks usual suspects (data transfer, logs, orphaned volumes) and sets up anomaly alerts afterwards.
      good: Uses cost tooling to break down spend and looks for recent changes.
      weak: Has no structured approach.
    followups:
      - How would you catch this within a day next time?
      - What if most of the spend is untagged?
    common_errors:
      - Looking only at compute when storage or transfer drove the increase.
      - No tagging strategy, making attribution impossible.

  - external_key: cloud.cost.spot_for_kubernetes
    competency_key: cloud_cost_optimization
    topic: Spot capacity for Kubernetes
    difficulty: medium
    kind: technical
    text: >-
      Would you run production Kubernetes workloads on spot instances? Explain how you'd do it safely, or why
      you wouldn't.
    expected_concepts:
      - interruption notices and graceful draining
      - diversifying instance types and zones
      - suitable workloads (stateless, batch, fault tolerant)
      - on-demand baseline plus spot burst
      - PodDisruptionBudgets and replica spread
      - Karpenter or node termination handlers
    rubric:
      excellent: Gives a nuanced answer — spot for tolerant workloads with diversified pools, an on-demand baseline, draining on interruption and disruption budgets — and quantifies the savings.
      good: Knows spot can be interrupted and suggests it for stateless or batch workloads.
      weak: Puts everything on spot, or rejects it without reasoning.
    followups:
      - How do you handle a mass interruption of one instance type?
      - Which workloads would you never run on spot?
    common_errors:
      - Using a single instance type for all spot capacity.
      - Running stateful singletons on spot nodes.

  - external_key: cloud.cost.savings_claim_verification
    competency_key: cloud_cost_optimization
    topic: Measuring a cost-reduction claim
    difficulty: hard
    kind: resume_claim
    round_types: [technical_screening, deep_technical, combined, resume_screening]
    text: >-
      Many resumes say something like "reduced cloud costs by 40 percent". If that were your project, how did
      you measure the 40 percent, and what exactly changed to achieve it?
    expected_concepts:
      - clear baseline period and scope
      - normalising for traffic or business growth
      - unit cost metrics (cost per request or customer)
      - attribution to specific changes
      - separating one-off credits or discounts
      - personal contribution versus team effort
    rubric:
      excellent: Defines the baseline and scope, normalises for growth with unit costs, attributes savings to specific changes with numbers, and is clear about their personal role.
      good: Gives a credible baseline and the main changes with approximate numbers.
      weak: Cannot explain how savings were measured or what they personally did.
    followups:
      - Did traffic change during that period, and how did you account for it?
      - Which single change contributed the most, and roughly how much?
      - How did you make sure the savings didn't hurt reliability?
    common_errors:
      - Comparing raw monthly bills across periods with different usage.
      - Counting commitment discounts as engineering savings without saying so.

  - external_key: cloud.cost.finops_program
    competency_key: cloud_cost_optimization
    topic: Building a FinOps practice
    difficulty: hard
    kind: technical
    round_types: [technical_screening, deep_technical, leadership, managerial]
    text: >-
      How would you set up an ongoing practice so engineering teams own their cloud costs, rather than
      running a clean-up project every year?
    expected_concepts:
      - tagging and allocation enforcement
      - showback or chargeback
      - unit economics per product
      - budgets and anomaly alerts per team
      - cost visibility in engineering dashboards
      - regular reviews and incentives
    rubric:
      excellent: Designs allocation, visibility, accountability and feedback loops with unit-cost metrics and explains how to balance cost against reliability and speed.
      good: Mentions tagging, showback and per-team budgets.
      weak: Treats cost as a finance-only concern.
    followups:
      - How do you allocate shared platform costs fairly?
      - Which cost metric would you show on a team's dashboard?
    common_errors:
      - Allocation that ignores shared infrastructure costs.
      - Cost targets without unit metrics, which penalise growth.

  # --------------------------------------------------------------- security
  - external_key: cloud.security.secrets_management
    competency_key: security
    topic: Managing application secrets
    difficulty: easy
    kind: technical
    role_tags: [cloud, devops, platform, backend, security]
    text: >-
      How do you manage secrets such as database passwords and API keys for applications — from storage to
      rotation?
    expected_concepts:
      - dedicated secret manager or vault
      - encryption with a key management service
      - injection at runtime, never in images or git
      - least-privilege access to secrets
      - rotation and short-lived credentials
      - auditing access
    rubric:
      excellent: Describes a complete lifecycle — central store, runtime injection, scoped access, automated rotation, auditing — and how applications handle rotation without downtime.
      good: Uses a secret manager and keeps secrets out of code.
      weak: Stores secrets in environment files committed to git or in images.
    followups:
      - How would an application pick up a rotated database password without a restart?
      - Are Kubernetes Secrets encrypted by default?
    common_errors:
      - Committing .env files to repositories.
      - Assuming base64 encoding is encryption.

  - external_key: cloud.security.leaked_credentials
    competency_key: security
    topic: Leaked cloud credentials
    difficulty: medium
    kind: scenario
    role_tags: [cloud, devops, platform, security]
    round_types: [technical_screening, deep_technical, combined]
    text: >-
      A developer accidentally pushed cloud access keys to a public repository an hour ago. What do you do,
      in order?
    expected_concepts:
      - revoke or deactivate the keys immediately
      - check audit logs for usage since exposure
      - look for created resources or data access
      - rotate dependent secrets
      - remove from git history (but assume compromised)
      - post-incident prevention (secret scanning, no long-lived keys)
    rubric:
      excellent: Revokes first, investigates with audit logs for any activity, contains damage, rotates related credentials, and prevents recurrence with scanning and short-lived credentials.
      good: Revokes the keys and checks for misuse.
      weak: Only deletes the commit or force-pushes the history.
    followups:
      - Why isn't rewriting git history enough?
      - What signs of misuse would you look for in the logs?
    common_errors:
      - Removing the commit before revoking the keys.
      - Not checking for resources created by an attacker, such as crypto-mining instances.

  - external_key: cloud.security.tls_mtls
    competency_key: security
    topic: TLS and mutual TLS
    difficulty: medium
    kind: technical
    role_tags: [cloud, devops, platform, backend, security]
    text: >-
      How do you handle TLS certificates across your services, and when is mutual TLS between services worth
      the extra complexity?
    expected_concepts:
      - automated issuance and renewal (ACME, cert-manager, managed certificates)
      - where TLS terminates
      - internal certificate authority
      - mTLS for service identity
      - service mesh trade-offs
      - monitoring expiry
    rubric:
      excellent: Automates the certificate lifecycle, explains termination points and the identity benefits of mTLS, and weighs mesh complexity against zero-trust requirements.
      good: Uses automated renewal and understands what mTLS adds.
      weak: Renews certificates manually or cannot explain mTLS.
    followups:
      - How would you avoid an outage caused by an expired certificate?
      - What does mTLS give you that network policies don't?
    common_errors:
      - Manual renewal processes that eventually lapse.
      - Terminating TLS at the edge and sending sensitive data unencrypted internally without considering the risk.

  - external_key: cloud.security.threat_model_cluster
    competency_key: security
    topic: Threat-modelling a production cluster
    difficulty: hard
    kind: scenario
    role_tags: [cloud, devops, platform, security, sre]
    text: >-
      Suppose an attacker gets remote code execution inside one pod of your production Kubernetes cluster.
      What could they reach from there, and which controls would limit the blast radius?
    expected_concepts:
      - service account token permissions
      - instance metadata endpoint access
      - network policies and lateral movement
      - container escape risks (privileged pods, host mounts)
      - secrets mounted in the pod
      - runtime detection and audit logging
    rubric:
      excellent: Enumerates realistic attack paths (token, metadata, network, host escape, secrets) and maps each to a concrete control such as workload identity, metadata hop limits, default-deny policies and restricted pod security.
      good: Identifies several attack paths and relevant mitigations.
      weak: Assumes containers are fully isolated and nothing else is reachable.
    followups:
      - Why is access to the instance metadata endpoint from pods dangerous?
      - How would you detect this compromise?
    common_errors:
      - Auto-mounting service account tokens with broad permissions.
      - Allowing all pod-to-pod traffic by default.

  - external_key: cloud.security.workload_identity
    competency_key: security
    topic: Workload identity and zero trust
    difficulty: hard
    kind: technical
    role_tags: [cloud, platform, security, backend]
    text: >-
      What does "zero trust" mean to you in practice for service-to-service communication, and how would you
      implement workload identity across a mixed estate of Kubernetes and virtual machines?
    expected_concepts:
      - authenticating every request regardless of network location
      - workload identities (SPIFFE, cloud IAM roles)
      - short-lived credentials
      - mutual TLS or signed tokens
      - authorization policies per service
      - gradual rollout and observability
    rubric:
      excellent: Defines zero trust concretely, designs identity issuance for both platforms with short-lived credentials and per-service authorization, and plans a gradual rollout.
      good: Explains identity-based authentication over network trust with a plausible mechanism.
      weak: Treats zero trust as a product to buy or only as a firewall setting.
    followups:
      - How would a legacy VM workload obtain an identity?
      - How do you roll this out without breaking existing traffic?
    common_errors:
      - Trusting anything inside the VPC.
      - Long-lived shared service credentials.

  # ------------------------------------------------------------- networking
  - external_key: cloud.networking.l4_vs_l7
    competency_key: networking
    topic: Layer 4 versus layer 7 load balancing
    difficulty: medium
    kind: technical
    text: >-
      When would you use a layer 4 load balancer instead of a layer 7 one? Give me examples of workloads that
      suit each.
    expected_concepts:
      - L4 forwards connections without reading HTTP
      - L7 routes on host, path and headers
      - TLS termination options
      - gRPC, WebSockets and long-lived connections
      - performance and static IPs
    rubric:
      excellent: Explains the protocol-level difference, TLS and observability trade-offs, and picks correctly for TCP services, gRPC, WebSockets and HTTP routing.
      good: Correct core distinction with sensible examples.
      weak: Cannot explain what each layer can see.
    followups:
      - How does connection-level balancing behave with long-lived gRPC connections?
      - Where would you terminate TLS for a service that needs client certificates?
    common_errors:
      - Expecting path-based routing from a layer 4 balancer.
      - Ignoring connection imbalance with HTTP/2 or gRPC.

  - external_key: cloud.networking.hybrid_connectivity
    competency_key: networking
    topic: Hybrid and multi-region connectivity
    difficulty: hard
    kind: system_design
    text: >-
      You need to connect an on-premises data centre to VPCs in three cloud regions, with some overlapping IP
      ranges from an acquisition. How would you design it?
    expected_concepts:
      - VPN versus dedicated interconnect
      - transit gateway or hub-and-spoke topology
      - handling overlapping CIDRs (NAT, re-addressing, private endpoints)
      - redundant links and routing (BGP)
      - hybrid DNS resolution
      - bandwidth, latency and cost
    rubric:
      excellent: Proposes a hub-and-spoke design with redundant connectivity, deals explicitly with overlapping ranges, covers BGP routing and hybrid DNS, and weighs cost and latency.
      good: Chooses sensible connectivity and a transit hub, aware of the overlap problem.
      weak: Proposes a full mesh of VPC peering and ignores overlapping ranges.
    followups:
      - What are your options when two networks use the same CIDR range?
      - How does DNS resolution work between on-premises and cloud?
    common_errors:
      - Ignoring overlapping CIDRs until routing breaks.
      - A single connectivity link with no redundancy.
