# Behavioural: adaptability (2 of 4) — working through ambiguity, unclear goals and incomplete information.
# Questions ask for real past examples; evaluation is based only on the content of the answer
# (actions, reasoning, outcome, reflection), never on delivery style or personality.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: adaptability
questions:
  # ------------------------------------------------------------------ easy
  - external_key: behavioral.adaptability.vague_task_first_steps
    topic: First steps on a vaguely defined task
    difficulty: easy
    text: >-
      Tell me about a task you were given that was described in just a sentence or two. What were the first
      things you did to turn it into something you could actually work on?
    expected_concepts:
      - identifying who asked and what they really needed
      - listing open questions and assumptions
      - confirming a first version of the scope
      - starting with a small, checkable piece of work
    rubric:
      excellent: Describes identifying the real need, listing open questions, confirming a short scope with the requester and starting with a small piece that could be checked quickly.
      good: Asked clarifying questions and got started with a reasonable plan.
      weak: Started building on guesses, or waited for a full specification that never came.
    followups:
      - Which question you asked turned out to matter most?
      - What did you get wrong at first?
    common_errors:
      - Waiting passively for someone else to remove the ambiguity.

  - external_key: behavioral.adaptability.unclear_ownership_area
    topic: Working in an area where nobody was clearly in charge
    difficulty: easy
    text: >-
      Describe a time you needed a decision or an answer, but it wasn't clear who owned that area. How did you
      find the right person or move things forward?
    expected_concepts:
      - tracing ownership through people, documents or history
      - asking for a decision from someone with authority
      - proceeding with a reversible step where possible
      - recording who owns it for next time
    rubric:
      excellent: Traces ownership methodically, gets a decision from someone with authority or takes a reversible step, and records the owner so others are not stuck the same way.
      good: Finds someone to decide and keeps the work moving.
      weak: Gives up or makes a significant decision alone without telling anyone.
    followups:
      - How long did it take to find the right person?
      - Did the ownership get clarified permanently?
    common_errors:
      - Making a hard-to-reverse decision alone because nobody answered.

  - external_key: behavioral.adaptability.no_documentation_start
    topic: Getting started with almost no documentation
    difficulty: easy
    text: >-
      Have you had to work on a system or process that had little or no documentation? Tell me how you worked out
      how it behaved.
    expected_concepts:
      - reading the existing artefacts such as code, configs or records
      - small safe experiments to confirm behaviour
      - asking people who had used it
      - writing down what they learned
    rubric:
      excellent: Combines reading existing artefacts, safe experiments and conversations with past users, then writes down what they learned so the next person benefits.
      good: Uses a sensible mix of investigation methods and gets the work done.
      weak: Relies on trial and error in a risky way, or does not describe how they learned.
    followups:
      - What did you write down for the next person?
      - What surprised you about how it actually worked?
    common_errors:
      - Experimenting on a live system without considering the risk.

  - external_key: behavioral.adaptability.clarifying_questions_choice
    topic: Choosing the questions that remove ambiguity
    difficulty: easy
    text: >-
      When someone hands you an unclear request and you only get a few minutes of their time, how do you decide
      which questions to ask? Give me an example where this mattered.
    expected_concepts:
      - asking about the goal and who it is for
      - asking what done looks like
      - asking about constraints such as deadline or limits
      - leaving lower-impact details to decide themselves
    rubric:
      excellent: Gives a concrete example and explains choosing questions about goal, definition of done and constraints first, while deciding minor details themselves.
      good: Asks sensible clarifying questions in a real example.
      weak: Lists generic questions with no example, or asks about details while missing the goal.
    followups:
      - What question do you wish you had asked?
      - What did you decide on your own without asking?
    common_errors:
      - Spending the limited time on implementation details.

  - external_key: behavioral.adaptability.writing_down_assumptions
    topic: Making assumptions explicit
    difficulty: easy
    text: >-
      Tell me about a time you had to move ahead before everything was known. How did you keep track of the
      assumptions you were making, and did any of them turn out wrong?
    expected_concepts:
      - writing assumptions down explicitly
      - sharing them with stakeholders
      - revisiting them as facts arrived
      - adjusting the work when one proved wrong
    rubric:
      excellent: Writes assumptions down, shares them so others can challenge them, checks them as facts arrive and adjusts quickly when one proves wrong.
      good: Tracks key assumptions and adjusts when needed.
      weak: Made assumptions silently and only found out when something broke.
    followups:
      - Who did you share the assumptions with?
      - How costly was the one that turned out wrong?
    common_errors:
      - Keeping assumptions in their head where nobody can challenge them.

  - external_key: behavioral.adaptability.undefined_success_criteria
    topic: Working out what success looks like
    difficulty: easy
    text: >-
      Tell me about a piece of work where nobody had said what success would look like. How did you define it,
      and who did you agree it with?
    expected_concepts:
      - proposing measurable or observable success criteria
      - agreeing them with the requester
      - using them to make trade-offs during the work
      - checking the result against them
    rubric:
      excellent: Proposes concrete criteria, agrees them with the requester, uses them to make trade-offs and checks the final result against them.
      good: Defines and agrees reasonable success criteria with a result.
      weak: Never defines success, or defines it alone and is surprised by the reaction.
    followups:
      - Did the criteria change during the work?
      - How did you measure the result at the end?
    common_errors:
      - Defining success only after the work is finished.

  - external_key: behavioral.adaptability.joining_team_midflight
    topic: Joining a team partway through a project
    difficulty: easy
    text: >-
      Talk me through a time you joined a team or project that was already well under way. How did you work out
      where you could be useful quickly?
    expected_concepts:
      - learning the goal and the current state
      - asking the team what they most needed
      - taking a small, well-defined task first
      - building context while delivering
    rubric:
      excellent: Describes learning the goal and state, asking what the team needed, taking a small well-defined task early and expanding their contribution as context grew.
      good: Got up to speed and contributed within a reasonable time.
      weak: Spent a long time only reading, or jumped in with changes before understanding the context.
    followups:
      - What was your first contribution?
      - What did you wish someone had told you on day one?
    common_errors:
      - Proposing big changes before understanding why things are the way they are.

  - external_key: behavioral.adaptability.ambiguous_problem_report
    topic: An unclear problem report
    difficulty: easy
    text: >-
      Tell me about a time you got a problem report that was really unclear, something like "it's not working".
      How did you get from that to a clear picture of the actual issue?
    expected_concepts:
      - asking for specifics such as steps, timing and impact
      - reproducing or observing the problem directly
      - narrowing down the scope
      - confirming the understanding with the reporter
    rubric:
      excellent: Gathers specifics, observes or reproduces the problem, narrows the scope systematically and confirms the understanding with the reporter before fixing.
      good: Clarifies the report and identifies the issue with a reasonable approach.
      weak: Guesses at the problem or sends the report back without trying to understand it.
    followups:
      - What question finally made the issue clear?
      - Did you change anything so future reports were clearer?
    common_errors:
      - Fixing what they assumed the problem was rather than what it was.

  - external_key: behavioral.adaptability.unfamiliar_jargon_meetings
    topic: Keeping up when the vocabulary is unfamiliar
    difficulty: easy
    text: >-
      Describe a time you were in meetings where much of the vocabulary was new to you. What did you do to
      follow the discussion and catch up?
    expected_concepts:
      - asking for clarification at the right moments
      - keeping a running glossary
      - reviewing material or asking a colleague afterwards
      - contributing once they understood
    rubric:
      excellent: Describes asking at the right moments, keeping a glossary, catching up afterwards and contributing usefully within a short time.
      good: Took practical steps to catch up and could follow the discussion.
      weak: Stayed silent and lost, or describes no specific steps.
    followups:
      - How long before you could contribute properly?
      - Did your notes help anyone else?
    common_errors:
      - Nodding along instead of asking.

  # ---------------------------------------------------------------- medium
  - external_key: behavioral.adaptability.decision_with_partial_data
    topic: Deciding with incomplete information
    difficulty: medium
    text: >-
      Tell me about a decision you had to make before you had all the information you wanted. How did you decide
      how much information was enough?
    expected_concepts:
      - cost of waiting versus cost of being wrong
      - how reversible the decision was
      - gathering the most valuable information quickly
      - building in a checkpoint to revisit
      - outcome and reflection
    rubric:
      excellent: Weighs the cost of delay against the cost of error and reversibility, gathers the most valuable information fast, sets a checkpoint to revisit and reflects on the outcome.
      good: Makes a reasonable decision with partial information and explains the trade-off.
      weak: Waited far too long, or decided on a hunch without any reasoning.
    followups:
      - What information would have changed your decision?
      - Did you revisit it later?
    common_errors:
      - Treating every decision as needing full certainty.

  - external_key: behavioral.adaptability.request_two_readings
    topic: A request that could be read two ways
    difficulty: medium
    text: >-
      Describe a request you received that could reasonably have meant two quite different things. How did you
      notice that, and how did you settle which one was meant?
    expected_concepts:
      - spotting the ambiguity early
      - laying out the interpretations and their consequences
      - getting the requester to choose
      - preventing the same confusion later
    rubric:
      excellent: Spots the ambiguity early, lays out the interpretations with their consequences, gets an explicit choice and changes something to prevent the same confusion.
      good: Notices the ambiguity and clarifies it before doing much work.
      weak: Discovered the ambiguity only after delivering the wrong thing.
    followups:
      - How did you present the two options?
      - Has the same kind of misunderstanding happened since?
    common_errors:
      - Asking an open "what do you mean?" instead of offering concrete interpretations.

  - external_key: behavioral.adaptability.fuzzy_stakeholder_goal
    topic: A stakeholder who could not articulate the goal
    difficulty: medium
    text: >-
      Tell me about working with someone who knew something was wrong but couldn't say clearly what they wanted
      instead. How did you get to a goal you could both agree on?
    expected_concepts:
      - exploring the underlying problem rather than the stated request
      - using examples, sketches or prototypes to draw out preferences
      - writing down and confirming the agreed goal
      - delivering against it
    rubric:
      excellent: Explores the underlying problem, uses examples or prototypes to make choices concrete, confirms the goal in writing and delivers against it.
      good: Works with the stakeholder to clarify the goal and delivers a result they accept.
      weak: Delivers what was literally asked for without exploring the need, or blames the stakeholder.
    followups:
      - What technique helped most to draw out what they wanted?
      - Did the goal shift once they saw a first version?
    common_errors:
      - Expecting the stakeholder to arrive with a finished specification.

  - external_key: behavioral.adaptability.unowned_problem
    topic: A problem that fell between teams
    difficulty: medium
    text: >-
      Give me an example of a problem that fell between teams, so that everyone assumed someone else would handle
      it. What did you do?
    expected_concepts:
      - recognising the gap
      - getting the affected teams together
      - proposing an owner or interim fix
      - preventing similar gaps
    rubric:
      excellent: Recognises the gap, brings the teams together, proposes clear ownership or an interim fix and helps close the gap for the future.
      good: Gets the problem addressed by taking or assigning ownership.
      weak: Notices the problem but leaves it, or fixes it quietly without addressing the gap.
    followups:
      - How did you get the other teams to engage?
      - Who owns that kind of problem now?
    common_errors:
      - Fixing it once without making ownership clear for next time.
    competency_key: ownership

  - external_key: behavioral.adaptability.experiment_to_reduce_uncertainty
    topic: Running a small experiment to resolve uncertainty
    difficulty: medium
    text: >-
      Describe a time you ran a quick experiment or test to settle a question rather than debating it. How did
      you design it, and what did you learn?
    expected_concepts:
      - stating the question the experiment answers
      - keeping the experiment small and cheap
      - deciding in advance what result would change the plan
      - acting on the result
    rubric:
      excellent: States the question clearly, keeps the experiment small, decides beforehand what result would change the plan and acts on what they learned.
      good: Runs a sensible experiment and uses the result.
      weak: The experiment had no clear question, or the result was ignored.
    followups:
      - What result would have made you change course?
      - How long did it take compared with the debate it replaced?
    common_errors:
      - Running an experiment without agreeing what it was meant to decide.
    competency_key: problem_solving

  - external_key: behavioral.adaptability.prototype_to_clarify
    topic: Using a rough first version to clarify needs
    difficulty: medium
    text: >-
      Tell me about a time you built a rough first version mainly to find out what people really needed. What
      did you learn from their reaction, and how did it change the plan?
    expected_concepts:
      - choosing what the rough version should test
      - keeping effort low
      - gathering reactions in a structured way
      - changing the plan based on what was learned
    rubric:
      excellent: Builds a deliberately cheap version aimed at specific open questions, gathers reactions in a structured way and makes clear changes to the plan as a result.
      good: Uses a rough version to get feedback and adjusts the plan.
      weak: The rough version turned into the product without learning anything from it.
    followups:
      - What was the biggest surprise in how people reacted?
      - How did you stop the rough version from becoming the final one?
    common_errors:
      - Investing so much in the first version that changing it becomes hard.

  - external_key: behavioral.adaptability.estimating_under_uncertainty
    topic: Giving an estimate when much was unknown
    difficulty: medium
    text: >-
      Tell me about a time you were asked for an estimate when a lot was still unknown. How did you give a useful
      answer without pretending to be precise?
    expected_concepts:
      - giving a range rather than a single number
      - naming the main unknowns that drive the range
      - committing to refine it at a set point
      - updating the estimate as facts arrived
    rubric:
      excellent: Gives a range, names the unknowns that drive it, commits to refining it at a set point and updates stakeholders as facts arrive.
      good: Explains the uncertainty and gives a reasonable estimate with caveats.
      weak: Gives a single precise number and misses it, or refuses to estimate.
    followups:
      - How did the person react to getting a range?
      - How close was the final result to your first range?
    common_errors:
      - Presenting a guess as a firm commitment.

  - external_key: behavioral.adaptability.shifting_success_metric
    topic: When the measure of success changed
    difficulty: medium
    text: >-
      Describe a project where the way your work was being measured changed partway through. How did you adjust
      the work to the new measure?
    expected_concepts:
      - understanding why the measure changed
      - checking how current work scored on the new measure
      - reprioritising toward the new measure
      - flagging conflicts between old and new measures
    rubric:
      excellent: Understands the reason for the new measure, checks current work against it, reprioritises accordingly and flags any conflict between old commitments and the new measure.
      good: Adjusts the work to the new measure with a clear result.
      weak: Keeps working to the old measure, or changes the work without understanding why.
    followups:
      - Was there anything that looked good on the old measure but bad on the new one?
      - How did you communicate the shift to your team?
    common_errors:
      - Optimising for the measure without understanding the goal behind it.

  - external_key: behavioral.adaptability.role_unclear_after_reorg
    topic: Defining your role after a reorganisation
    difficulty: medium
    text: >-
      Tell me about a time a reorganisation left your responsibilities unclear. What did you do to work out, or
      shape, what your role should be?
    expected_concepts:
      - clarifying expectations with the new manager or lead
      - proposing a scope based on team needs
      - handing over or picking up responsibilities explicitly
      - delivering within the agreed role
    rubric:
      excellent: Proactively clarifies expectations, proposes a scope grounded in what the team needs, makes handovers explicit and delivers within the agreed role.
      good: Clarifies their role and keeps contributing.
      weak: Waits for someone to define the role, or keeps doing the old job regardless.
    followups:
      - What did you propose, and how much of it was accepted?
      - What responsibility did you give up?
    common_errors:
      - Waiting for the organisation to settle before acting.

  - external_key: behavioral.adaptability.no_precedent_task
    topic: Doing something your organisation had never done
    difficulty: medium
    text: >-
      Tell me about a time you were asked to do something your organisation had never done before, with no
      playbook to follow. How did you work out the approach?
    expected_concepts:
      - looking for analogous experience inside or outside the organisation
      - breaking the problem into known and unknown parts
      - taking small steps and adjusting
      - documenting the approach for next time
    rubric:
      excellent: Finds analogous experience, separates known from unknown parts, proceeds in small adjustable steps and leaves a documented approach for the next time.
      good: Works out a reasonable approach and delivers.
      weak: Improvises without structure, or waits for someone to create the playbook.
    followups:
      - Where did you look for ideas?
      - What would you change in the playbook now?
    common_errors:
      - Assuming nobody anywhere has solved a similar problem.

  - external_key: behavioral.adaptability.ambiguity_while_waiting
    topic: Staying productive while a decision is pending
    difficulty: medium
    text: >-
      Tell me about a time your work was blocked waiting on a decision someone else had to make. How did you keep
      making progress in the meantime?
    expected_concepts:
      - identifying work that holds under every likely outcome
      - preparing options to speed up the decision
      - following up to unblock the decision
      - avoiding work likely to be wasted
    rubric:
      excellent: Picks work that holds regardless of the decision, prepares options that make the decision easier, follows up to unblock it and avoids likely waste.
      good: Finds useful work while waiting and follows up on the decision.
      weak: Stops working or builds on a guess that later had to be undone.
    followups:
      - What did you prepare to help the decision get made?
      - How long did you wait before following up?
    common_errors:
      - Building on an assumed decision without telling anyone.

  # ------------------------------------------------------------------ hard
  - external_key: behavioral.adaptability.fuzzy_goal_to_team_plan
    topic: Turning a fuzzy goal into a plan for others
    difficulty: hard
    text: >-
      Tell me about a time you were given a broad, fuzzy goal and had to turn it into a concrete plan that other
      people could execute. How did you get from the goal to the plan?
    expected_concepts:
      - clarifying intent with the people who set the goal
      - breaking the goal into outcomes and milestones
      - identifying the riskiest unknowns to tackle first
      - giving others clear, self-contained pieces of work
      - revising the plan as learning came in
    rubric:
      excellent: Clarifies intent with the goal setters, breaks it into outcomes and milestones, tackles the riskiest unknowns first, gives others clear self-contained work and revises the plan as they learn.
      good: Produces a workable plan from a vague goal and delivers with others.
      weak: The plan stays as vague as the goal, or others could not act on it.
    followups:
      - Which unknown did you tackle first, and why?
      - How did the plan change once work started?
    common_errors:
      - Producing a detailed plan that hides the big unknowns.

  - external_key: behavioral.adaptability.ambiguity_across_teams
    topic: Coordinating several teams through an unclear initiative
    difficulty: hard
    text: >-
      Describe an initiative involving several teams where the overall direction was still unclear. How did you
      keep everyone aligned while the details were being worked out?
    expected_concepts:
      - a shared statement of what was known and unknown
      - a regular forum for decisions
      - interfaces or agreements to let teams work in parallel
      - updating everyone as decisions landed
      - outcome across the teams
    rubric:
      excellent: Creates a shared view of known and unknown, sets up a decision forum, defines agreements that let teams work in parallel and keeps everyone updated as decisions land, with a clear cross-team outcome.
      good: Keeps the teams reasonably aligned with regular communication and a result.
      weak: Teams drifted apart or duplicated work, and the answer has no mechanism for alignment.
    followups:
      - What decision took longest, and how did teams work around it?
      - Where did alignment break down?
    common_errors:
      - Relying on informal updates that some teams never saw.
    competency_key: collaboration

  - external_key: behavioral.adaptability.irreversible_call_uncertainty
    topic: A hard-to-reverse decision under uncertainty
    difficulty: hard
    text: >-
      Tell me about a significant decision you made that would be hard to undo, at a time when the facts were
      still unclear. How did you reduce the risk before committing?
    expected_concepts:
      - recognising the decision as hard to reverse
      - seeking the information that mattered most
      - finding ways to stage or partially reverse it
      - involving the right people in the decision
      - outcome and reflection
    rubric:
      excellent: Recognises the irreversibility, seeks the most decision-relevant information, stages the commitment to keep options open where possible, involves the right people and reflects on the result.
      good: Takes reasonable care to reduce risk and makes a defensible decision.
      weak: Treats it like a routine decision, or cannot explain how risk was reduced.
    followups:
      - What would you have done if it had gone wrong?
      - Was there a way to make it more reversible?
    common_errors:
      - Not distinguishing reversible decisions from irreversible ones.

  - external_key: behavioral.adaptability.communicating_uncertainty_upward
    topic: Communicating uncertainty to senior leaders
    difficulty: hard
    text: >-
      Describe a time you had to report to senior leaders on something where the outcome was still uncertain.
      How did you give them something they could act on without overstating what you knew?
    expected_concepts:
      - separating what is known from what is not
      - giving scenarios or ranges with likelihoods
      - stating what decisions they needed to make and when
      - committing to when the uncertainty would reduce
    rubric:
      excellent: Separates known from unknown, presents scenarios or ranges, tells leaders what they need to decide and when, and commits to when they will know more.
      good: Communicates uncertainty clearly and gives a reasonable recommendation.
      weak: Overstates certainty, or overwhelms leaders with detail and no recommendation.
    followups:
      - What did they decide based on your update?
      - How did you follow up as things became clearer?
    common_errors:
      - Hiding uncertainty to appear in control.
    competency_key: communication

  - external_key: behavioral.adaptability.stopping_exploration
    topic: Deciding when to stop exploring and commit
    difficulty: hard
    text: >-
      Tell me about a time you were exploring options for a long time on an open-ended problem. How did you
      decide it was time to stop exploring and commit to one direction?
    expected_concepts:
      - having explicit criteria or a time box for exploration
      - recognising diminishing returns
      - choosing a direction that kept some options open
      - communicating the decision and its rationale
    rubric:
      excellent: Uses explicit criteria or a time box, recognises diminishing returns, commits to a direction that keeps useful options open and explains the rationale to others.
      good: Stops exploring at a sensible point and commits with a reason.
      weak: Explored until forced by a deadline, or committed arbitrarily.
    followups:
      - What would have made you keep exploring?
      - Did you ever revisit the options you rejected?
    common_errors:
      - Exploring without any agreed limit.
