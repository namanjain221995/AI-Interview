# Behavioural: communication (3 of 4) — difficult messages: bad news, saying no, feedback, pushing back,
# persuading and communicating when things go wrong. Questions ask for real past examples; evaluation is
# based only on the content of the answer, never on delivery style or personality.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: communication
questions:
  # ------------------------------------------------------------------ easy
  - external_key: behavioral.communication.flagging_you_will_be_late
    topic: Telling people you will miss a date
    difficulty: easy
    text: >-
      Tell me about a time you realised you wouldn't finish something on time. When and how did you tell the
      people depending on you?
    expected_concepts:
      - raising it as soon as the slip was likely
      - the reason and a new realistic date
      - impact on the people depending on the work
      - options to reduce the impact
    rubric:
      excellent: Raised the slip early, gave the reason and a realistic new date, explained the impact and offered options such as reduced scope, and kept to the revised commitment.
      good: Communicated the delay before the deadline with a new date.
      weak: Told people at or after the deadline, or gave no revised plan.
    followups:
      - How much warning did they get?
      - What options did you offer?
    common_errors:
      - Hoping to catch up and staying quiet until the deadline.

  - external_key: behavioral.communication.declining_a_request
    topic: Turning down a request
    difficulty: easy
    text: >-
      Tell me about a time you had to turn down a request from a colleague or another team. How did you explain
      your answer?
    expected_concepts:
      - understanding the request and its urgency
      - a clear answer with the actual reason
      - offering an alternative or a later time
      - pointing to someone who could help
    rubric:
      excellent: Understood the need before answering, gave a clear no with the real reason, and offered a useful alternative that kept the requester moving.
      good: Declined clearly with a reason.
      weak: Gave a vague maybe, or ignored the request until it went away.
    followups:
      - How did they respond?
      - Would you answer the same way today?
    common_errors:
      - A soft maybe that the requester heard as a yes.

  - external_key: behavioral.communication.saying_i_dont_know
    topic: Admitting you don't know something you were expected to know
    difficulty: easy
    text: >-
      Tell me about a time you had to tell someone you didn't know the answer to something they expected you to
      know. How did you handle it?
    expected_concepts:
      - stating the gap plainly
      - explaining what they did know
      - a plan to find the answer
      - following up
    rubric:
      excellent: Admitted the gap directly, shared what was known, set out how and when they would find the answer and followed through.
      good: Was open about the gap and followed up.
      weak: Bluffed, deflected, or never came back with the answer.
    followups:
      - How did you find the answer?
      - Did you change anything so you would know next time?
    common_errors:
      - Giving a guess presented as fact.

  - external_key: behavioral.communication.correcting_something_you_shared
    topic: Correcting an error you had shared
    difficulty: easy
    text: >-
      Tell me about a time you found an error in something you had already shared with others, such as a report,
      a number or a set of instructions. How did you correct it?
    expected_concepts:
      - correcting it quickly
      - reaching everyone who received the original
      - stating clearly what was wrong and what is right
      - explaining whether any decisions are affected
    rubric:
      excellent: Corrected it promptly with everyone who received it, stated precisely what changed and whether any decisions were affected, and fixed the cause.
      good: Issued a clear correction to the right people.
      weak: Corrected it quietly, or only for some recipients.
    followups:
      - Had anyone already acted on the wrong version?
      - What did you change so it wouldn't happen again?
    common_errors:
      - Updating the source silently without telling readers.

  - external_key: behavioral.communication.raising_a_concern_against_consensus
    topic: Raising a concern when the room agrees
    difficulty: easy
    text: >-
      Tell me about a time you raised a concern in a meeting when most people seemed to agree with a plan. How
      did you put your point across?
    expected_concepts:
      - stating the concern specifically
      - backing it with evidence or an example
      - acknowledging the merits of the plan
      - suggesting a way to test or reduce the risk
      - outcome
    rubric:
      excellent: Raised a specific concern with evidence, acknowledged the plan's strengths, proposed a practical way to address the risk and describes what the group did with it.
      good: Raised the concern clearly with some reasoning.
      weak: Stayed quiet and raised it afterwards, or the concern was vague.
    followups:
      - What happened to the plan?
      - If you were wrong, how did you find out?
    common_errors:
      - Raising the concern only privately after the decision.

  - external_key: behavioral.communication.specific_positive_feedback
    topic: Giving specific positive feedback
    difficulty: easy
    text: >-
      Tell me about a time you gave a colleague feedback on something they did well. How did you make it
      specific enough to be useful?
    expected_concepts:
      - the specific action, not a general compliment
      - the effect it had
      - timing close to the event
      - encouraging them to repeat it
    rubric:
      excellent: Names the specific behaviour and its concrete effect, delivered soon after, in a way that helped the colleague repeat it.
      good: Gave specific, timely recognition.
      weak: Feedback was a general compliment such as great job.
    followups:
      - Did they do it again?
      - Did you share it with anyone else, such as their manager?
    common_errors:
      - Praise so general it gives no information.

  - external_key: behavioral.communication.hard_to_reach_decision_maker
    topic: Getting an answer from someone hard to reach
    difficulty: easy
    text: >-
      Tell me about a time you needed an answer from someone senior who was very hard to reach. How did you get
      what you needed?
    expected_concepts:
      - making the question quick to answer
      - offering a recommended default
      - stating the deadline and the impact of no answer
      - using the right channel or an intermediary
    rubric:
      excellent: Reduced the ask to a short decision with a recommended default and a clear deadline, used an appropriate route and got the answer in time.
      good: Found a reasonable way to get the answer.
      weak: Waited indefinitely, or went ahead without telling anyone.
    followups:
      - What would you have done if they never replied?
      - How did you phrase the message?
    common_errors:
      - Sending a long message that needs a long reply.

  - external_key: behavioral.communication.telling_a_customer_no
    topic: Telling a customer you can't give them what they asked for
    difficulty: easy
    text: >-
      Tell me about a time you had to tell a customer or user that you couldn't give them what they asked for.
      How did you explain it, and what did you offer instead?
    expected_concepts:
      - understanding the need behind the request
      - a clear answer with a reason they could understand
      - an alternative that addressed the need
      - follow-up
    rubric:
      excellent: Understood the underlying need, gave a clear answer with an understandable reason and offered an alternative that met the need, with a described result.
      good: Declined clearly with a reason and some alternative.
      weak: Gave a vague answer, or blamed policy without explanation.
    followups:
      - How did the customer respond?
      - Did the request change anything internally?
    common_errors:
      - Hiding behind policy instead of explaining the reason.

  - external_key: behavioral.communication.pointing_out_a_problem_in_others_work
    topic: Raising a problem in someone else's work
    difficulty: easy
    text: >-
      Tell me about a time you spotted a problem in someone else's work. How did you bring it up with them?
    expected_concepts:
      - checking the facts first
      - raising it privately and directly with the person
      - describing the problem and its impact, not the person
      - offering help to fix it
    rubric:
      excellent: Checked the facts, raised it directly with the person, described the issue and its impact objectively, and helped get it fixed.
      good: Raised it directly and the problem was fixed.
      weak: Fixed it without telling them, or went to their manager first.
    followups:
      - How did they respond?
      - Would you raise it differently with someone more senior?
    common_errors:
      - Raising it publicly before talking to the person.

  # ---------------------------------------------------------------- medium
  - external_key: behavioral.communication.critical_feedback_to_peer
    topic: Giving critical feedback to a peer
    difficulty: medium
    text: >-
      Tell me about a time you gave critical feedback to a peer who didn't report to you. How did you prepare,
      and how did the conversation go?
    expected_concepts:
      - specific observed behaviour and its impact
      - choosing the right time and place
      - inviting their view
      - agreeing what would change
      - following up
    rubric:
      excellent: Prepared specific observations and impacts, delivered them privately, listened to the peer's perspective, agreed a change and followed up to see it happen.
      good: Gave specific feedback with a reasonable outcome.
      weak: Feedback was vague or second-hand, or was never actually given.
    followups:
      - What did you learn from their side of it?
      - Did anything change afterwards?
    common_errors:
      - Feedback about the person rather than the behaviour.

  - external_key: behavioral.communication.unrealistic_deadline_pushback
    topic: Pushing back on an unrealistic deadline
    difficulty: medium
    text: >-
      Tell me about a time you were asked to commit to a deadline you didn't think was realistic. How did you
      explain your concerns, and what was agreed?
    expected_concepts:
      - understanding why the date mattered
      - an evidence-based estimate
      - options trading scope, time and resources
      - a clear agreement recorded
    rubric:
      excellent: Understood the reason for the date, explained their estimate with evidence, offered concrete trade-off options and reached a recorded agreement that held.
      good: Explained the concern and negotiated a better plan.
      weak: Accepted silently and missed, or refused without offering options.
    followups:
      - What did you give up to make it work?
      - How did the final delivery compare with the agreement?
    common_errors:
      - Arguing about the estimate without addressing why the date mattered.

  - external_key: behavioral.communication.changing_a_mind_with_evidence
    topic: Changing someone's mind
    difficulty: medium
    text: >-
      Tell me about a time you changed someone's mind about an approach. What evidence did you bring, and how did
      you present it?
    expected_concepts:
      - understanding their reasons first
      - evidence chosen to address their concerns
      - presenting it in their terms
      - leaving room for them to reach the conclusion
    rubric:
      excellent: Started from the other person's reasons, chose evidence aimed at their specific concerns, presented it in terms that mattered to them and describes the changed decision.
      good: Used evidence to persuade and achieved a change.
      weak: Persuaded through persistence or seniority, or cannot describe the evidence.
    followups:
      - What was their original reasoning?
      - Have you ever tried the same approach and failed?
    common_errors:
      - Presenting evidence that answers their own concerns, not the other person's.

  - external_key: behavioral.communication.work_cut_or_postponed
    topic: Telling people their work is being cut
    difficulty: medium
    text: >-
      Tell me about a time you had to tell people that work they cared about was being cut or postponed. How did
      you deliver that message?
    expected_concepts:
      - delivering it directly and early
      - the reason behind the decision
      - recognising the value of the work done
      - what happens to the work and to them next
      - answering questions openly
    rubric:
      excellent: Delivered the news directly with the real reasons, acknowledged the work's value, explained what happens next and handled questions openly.
      good: Delivered the news clearly with reasons.
      weak: People heard indirectly, or the reasons were withheld or vague.
    followups:
      - What was the hardest question you were asked?
      - How was the work preserved, if at all?
    common_errors:
      - Delivering the decision without the reasoning.

  - external_key: behavioral.communication.disagreeing_with_your_manager
    topic: Disagreeing with your manager's decision
    difficulty: medium
    text: >-
      Tell me about a time you disagreed with a decision your manager made. How did you raise it, and what
      happened after?
    expected_concepts:
      - raising it privately and promptly
      - specific reasons and evidence
      - understanding their reasoning
      - committing once the decision was final
    rubric:
      excellent: Raised a specific, evidence-based disagreement at the right time, understood the manager's reasoning, and either changed the decision or committed fully to it.
      good: Raised the disagreement with reasons and handled the outcome sensibly.
      weak: Complained to others, or complied without ever raising the concern.
    followups:
      - What did you learn about their reasoning?
      - How did you act once the decision was final?
    common_errors:
      - Continuing to argue after the decision was made.

  - external_key: behavioral.communication.keeping_users_informed_during_problem
    topic: Keeping affected users informed during a problem
    difficulty: medium
    text: >-
      Tell me about a time something went wrong that affected customers or users and you had to keep them
      informed. What did your updates say, and how often did you send them?
    expected_concepts:
      - acknowledging the issue quickly
      - what is affected and what users should do
      - a regular update cadence with the next update time
      - plain language without speculation
      - a closing summary
    rubric:
      excellent: Describes prompt acknowledgement, plain updates on impact and workarounds at a predictable rhythm, no speculation and a clear closing message.
      good: Kept users informed with regular, clear updates.
      weak: Updates were late, irregular or full of internal jargon.
    followups:
      - What did you decide not to say, and why?
      - How did you coordinate the updates with the people fixing the problem?
    common_errors:
      - Promising a fix time that wasn't known.

  - external_key: behavioral.communication.tense_conversation_focus
    topic: Keeping a tense conversation on the problem
    difficulty: medium
    text: >-
      Tell me about a conversation with a colleague or stakeholder that became tense. What did you say or do to
      keep it focused on solving the problem?
    expected_concepts:
      - acknowledging the other person's concern
      - restating the shared goal
      - separating facts from interpretations
      - agreeing concrete next steps
    rubric:
      excellent: Describes specific things they said to acknowledge the concern and refocus on the shared goal and facts, and a concrete agreed outcome.
      good: Steered the conversation back to the problem with a reasonable result.
      weak: The example has no clear actions of their own, or the conversation ended without resolution.
    followups:
      - What was the underlying disagreement about?
      - How did your working relationship go afterwards?
    common_errors:
      - Describing only the other person's behaviour.

  - external_key: behavioral.communication.early_risk_taken_seriously
    topic: Raising an early risk others weren't worried about
    difficulty: medium
    text: >-
      Tell me about a time you saw a risk early that others weren't worried about yet. How did you communicate it
      so people took it seriously without overreacting?
    expected_concepts:
      - stating likelihood and impact concretely
      - evidence or early signals
      - a proportionate proposal
      - a trigger for when to act
    rubric:
      excellent: Described the risk with concrete likelihood and impact, evidence, a proportionate response and a clear trigger, and shows the group acted appropriately.
      good: Raised the risk clearly with some evidence and a proposal.
      weak: Raised it vaguely or alarmingly with no proposal.
    followups:
      - Did the risk actually happen?
      - How did you avoid being seen as crying wolf?
    common_errors:
      - Raising a risk with no suggested action.

  - external_key: behavioral.communication.scope_creep_conversation
    topic: Talking to a stakeholder about growing scope
    difficulty: medium
    text: >-
      Tell me about a time a stakeholder kept adding requests to work that was already underway. How did you talk
      to them about scope?
    expected_concepts:
      - making the cost of each addition visible
      - referring back to the agreed goal
      - offering trade-offs rather than refusals
      - recording changes to scope
    rubric:
      excellent: Made the cost of additions explicit, tied the conversation to the original goal, offered clear trade-offs and recorded the agreed scope, which then held.
      good: Discussed scope with the stakeholder and reached an agreement.
      weak: Absorbed every request, or refused without discussion.
    followups:
      - Which request did you agree to, and why?
      - How did you record what was agreed?
    common_errors:
      - Saying yes to everything and missing the original goal.

  - external_key: behavioral.communication.feedback_you_disagreed_with
    topic: Receiving feedback you initially disagreed with
    difficulty: medium
    text: >-
      Tell me about a time you received feedback you disagreed with at first. How did you respond in the
      conversation, and what did you do afterwards?
    expected_concepts:
      - asking questions to understand the feedback
      - looking for evidence for and against it
      - deciding what to act on
      - telling the giver what they did with it
    rubric:
      excellent: Asked questions to understand the feedback, looked for evidence, made a reasoned decision about what to change and closed the loop with the person.
      good: Listened and took some reasonable action.
      weak: Dismissed the feedback, or accepted it with no reflection.
    followups:
      - What part of it turned out to be right?
      - Did you tell the person what you changed?
    common_errors:
      - Arguing the point in the moment instead of understanding it.

  - external_key: behavioral.communication.misunderstanding_wasted_work
    topic: A misunderstanding that wasted work
    difficulty: medium
    text: >-
      Tell me about a time a misunderstanding between you and someone else led to wasted work. How did you sort
      it out, and what did you both change?
    expected_concepts:
      - what each side understood
      - the point where it diverged
      - recovering the work or the plan
      - a shared change to prevent a repeat
    rubric:
      excellent: Explains both sides' understanding and where it diverged, owns their part, recovers quickly and agrees a concrete change with the other person.
      good: Resolves it and identifies a sensible change.
      weak: Puts it all on the other person, or no change followed.
    followups:
      - What was your part in the misunderstanding?
      - How did you know the change worked?
    common_errors:
      - Not acknowledging their own share of the misunderstanding.

  # ------------------------------------------------------------------ hard
  - external_key: behavioral.communication.hardest_message_to_senior_group
    topic: The hardest message you've delivered to a senior group
    difficulty: hard
    text: >-
      Tell me about the most difficult message you've had to deliver to a senior group, for example a major
      failure, a large overrun or a recommendation to stop a project. How did you prepare, and what happened?
    expected_concepts:
      - stating the message plainly at the start
      - facts, causes and impact
      - options and a recommendation
      - anticipating the hard questions
      - what was decided and what followed
    rubric:
      excellent: Led with the message, supported it with facts and impact, brought options and a recommendation, prepared for the hard questions and describes the decision and its follow-through.
      good: Delivered the message clearly with a plan.
      weak: Softened the message until it was unclear, or arrived with no options.
    followups:
      - What was the hardest question, and how did you answer it?
      - Would you change the timing of the message?
    common_errors:
      - Burying the bad news in the middle of a long update.

  - external_key: behavioral.communication.difficult_feedback_upwards
    topic: Giving difficult feedback to someone more senior
    difficulty: hard
    text: >-
      Tell me about a time you had to give difficult feedback to someone more senior than you. How did you
      approach the conversation, and what came of it?
    expected_concepts:
      - asking permission or choosing the right moment
      - specific examples and impact on the work
      - framing around shared goals
      - inviting their response
      - outcome and relationship afterwards
    rubric:
      excellent: Chose an appropriate setting, gave specific examples and impact tied to shared goals, invited the senior person's response and describes a concrete outcome.
      good: Gave specific feedback upward with a reasonable result.
      weak: Feedback was hinted at rather than stated, or went around the person.
    followups:
      - What made you decide it was worth raising?
      - What would you do if they had reacted badly?
    common_errors:
      - Delivering feedback through someone else.

  - external_key: behavioral.communication.updates_while_facts_change
    topic: Communicating while the facts keep changing
    difficulty: hard
    text: >-
      Tell me about a time you had to keep people informed during a fast-moving situation where the facts kept
      changing. How did you decide what to say and when?
    expected_concepts:
      - separating confirmed facts from working assumptions
      - a regular update rhythm
      - a single source of truth
      - correcting earlier statements openly
      - adapting detail for different audiences
    rubric:
      excellent: Describes clear labelling of confirmed versus unconfirmed information, a regular rhythm, a single source of truth and open corrections, with evidence people could act on the updates.
      good: Kept people informed regularly and corrected information as it changed.
      weak: Updates were irregular, speculative or contradictory.
    followups:
      - Did you ever have to retract something you said?
      - Who else was communicating, and how did you stay consistent?
    common_errors:
      - Sharing speculation as fact to fill silence.

  - external_key: behavioral.communication.case_to_another_team
    topic: Asking another team to change its plans
    difficulty: hard
    competency_key: collaboration
    text: >-
      Tell me about a time you needed another team to change its plans for your work to succeed, and you had no
      authority over them. How did you make your case?
    expected_concepts:
      - understanding the other team's goals and constraints
      - framing the request around shared or their goals
      - quantifying the benefit and the cost to them
      - offering something in return or reducing their effort
      - escalating openly only if needed
    rubric:
      excellent: Understood the other team's priorities, framed the request in their terms with concrete costs and benefits, reduced their effort where possible and reached an agreement that held.
      good: Made a reasoned case and reached an agreement.
      weak: Escalated straight away, or made the request with no regard for the other team's priorities.
    followups:
      - What did they ask for in return?
      - What would you have done if they had said no?
    common_errors:
      - Framing the request only in terms of their own team's needs.

  - external_key: behavioral.communication.presenting_a_decision_you_opposed
    topic: Communicating a decision you argued against
    difficulty: hard
    text: >-
      Tell me about a time you had to communicate a decision to others that you had argued against. How did you
      present it, and how did you handle their questions?
    expected_concepts:
      - presenting the decision and its reasons fairly
      - not undermining the decision makers
      - acknowledging concerns openly
      - committing to make it work
      - raising issues through the right route later
    rubric:
      excellent: Presented the decision and its real reasons fairly, handled questions without undermining it, acknowledged concerns and committed to making it work while knowing how to raise new evidence.
      good: Communicated the decision accurately and supported it.
      weak: Distanced themselves from it or signalled disagreement to the team.
    followups:
      - Did your team know you had argued against it?
      - How did the decision turn out?
    common_errors:
      - Presenting it as someone else's decision they don't agree with.
