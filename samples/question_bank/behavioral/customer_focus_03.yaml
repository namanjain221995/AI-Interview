# Behavioural: customer focus (part 3 of 4) - advocating for users and handling customer impact.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ speaking up for users (easy)
  - external_key: behavioral.customer_focus.voice_of_user_in_meeting
    competency_key: culture_values
    topic: Raising the user's view in a team discussion
    difficulty: easy
    text: >-
      Tell me about a discussion where you felt the user's point of view was missing, and you brought it in.
      What did you say, and did it change the outcome?
    expected_concepts:
      - the decision under discussion
      - the user perspective that was missing
      - evidence or examples they brought
      - effect on the decision
    rubric:
      excellent: Brings a specific, evidence-backed user perspective into the discussion at the right moment and shows how it changed or sharpened the decision.
      good: Raises a relevant user concern and it is considered.
      weak: Mentions users only in general terms with no effect on the decision.
    followups:
      - What evidence did you have for that view?
      - What happened when people disagreed with you?
    common_errors:
      - Presenting a personal preference as the user's view.

  - external_key: behavioral.customer_focus.upset_customer_conversation
    competency_key: culture_values
    topic: A conversation with an unhappy customer
    difficulty: easy
    text: >-
      Tell me about a time you dealt directly with a customer who was unhappy about something your team had
      done. How did you approach the conversation, and what happened afterwards?
    expected_concepts:
      - what the customer was unhappy about
      - listening to understand the impact on them
      - acknowledging what went wrong without deflecting
      - concrete next steps agreed
      - follow-through
    rubric:
      excellent: Focuses on understanding the impact on the customer, acknowledges the team's part clearly, agrees concrete next steps and shows they were delivered.
      good: Handles the conversation constructively and agrees a way forward.
      weak: Defends the team, argues with the customer, or ends without any next step.
    followups:
      - What did you commit to, and did you deliver it?
      - What did you learn about how your work affected them?
    common_errors:
      - Spending the conversation explaining why it wasn't the team's fault.

  - external_key: behavioral.customer_focus.closing_the_loop
    competency_key: culture_values
    topic: Telling a user their issue was resolved
    difficulty: easy
    text: >-
      Tell me about a time you made a point of going back to a user who had reported a problem to let them
      know what happened. Why did you do it, and how did they respond?
    expected_concepts:
      - the original report
      - what was done about it
      - how and when they followed up
      - effect on the user's trust or future reporting
    rubric:
      excellent: Describes deliberately closing the loop with a clear explanation of what changed, and connects it to an observable effect such as continued reporting or renewed trust.
      good: Follows up with the user about the outcome.
      weak: Assumes the user will notice the fix without being told.
    followups:
      - Is closing the loop something you do routinely?
      - What if the answer was that you wouldn't fix it?
    common_errors:
      - Only following up when the news is good.

  - external_key: behavioral.customer_focus.user_docs_improved
    competency_key: culture_values
    topic: Making help content work for real users
    difficulty: easy
    text: >-
      Tell me about a time you improved documentation, a guide or help content that users relied on. How did
      you know it wasn't working for them, and what did you change?
    expected_concepts:
      - signal that the content was failing users
      - who the readers were and what they were trying to do
      - restructuring around user tasks
      - measure of improvement
    rubric:
      excellent: Identifies the failure from concrete signals, rewrites around what readers were trying to accomplish, and shows evidence of improvement such as fewer questions.
      good: Improves content based on a real gap users experienced.
      weak: Adds more content without understanding why the existing content failed.
    followups:
      - How did you test the new version with readers?
      - Who keeps it up to date now?
    common_errors:
      - Writing for the team's own understanding rather than the reader's task.

  - external_key: behavioral.customer_focus.everyday_language_for_users
    competency_key: communication
    topic: Replacing internal jargon users didn't understand
    difficulty: easy
    text: >-
      Give me an example of noticing that users were confused by terms or concepts that made sense only inside
      your team. How did you find out, and what did you do?
    expected_concepts:
      - the confusing terminology
      - evidence of confusion
      - choosing words users actually use
      - change made in the product or communication
      - effect on confusion
    rubric:
      excellent: Recognises the internal-language problem from evidence, finds the users' own vocabulary, and makes a change that measurably reduces confusion.
      good: Spots jargon confusing users and replaces it sensibly.
      weak: Expects users to learn the internal terms.
    followups:
      - How did you find out what words users would use?
      - Did the team keep using the old terms internally?
    common_errors:
      - Choosing new terms by internal debate without checking with users.

  - external_key: behavioral.customer_focus.accessible_design_push
    competency_key: accessibility
    topic: Making something usable for people using assistive technology
    difficulty: easy
    text: >-
      Tell me about a time you made something you worked on more usable for people relying on a screen reader,
      keyboard navigation or other assistive technology. What prompted it, and what did you change?
    expected_concepts:
      - what prompted the work (audit, user report, standard)
      - specific barriers found
      - changes made
      - how they tested with assistive technology
      - keeping it from regressing
    rubric:
      excellent: Identifies specific barriers, fixes them, tests with real assistive technology or users, and puts something in place to prevent regressions.
      good: Fixes real accessibility barriers with reasonable testing.
      weak: Only mentions automated checks with no understanding of the user's experience.
    followups:
      - How did you test the changes?
      - How did you persuade the team to keep it up?
    common_errors:
      - Treating an automated checker passing as proof of usability.

  - external_key: behavioral.customer_focus.slow_experience_noticed
    competency_key: culture_values
    topic: Acting on a slow experience users had accepted
    difficulty: easy
    text: >-
      Tell me about a time you noticed that something was slow or clunky for users, even though nobody was
      complaining loudly. What made you take it on, and what came of it?
    expected_concepts:
      - how they noticed the problem
      - evidence of impact on users
      - case for prioritising it
      - improvement made and measured
    rubric:
      excellent: Notices a quiet user problem, gathers evidence of its impact, makes a case for fixing it, and shows a measured improvement.
      good: Identifies and improves a real friction point.
      weak: Assumes no complaints means no problem.
    followups:
      - Why do you think users weren't complaining?
      - How did you measure the improvement?
    common_errors:
      - Equating silence from users with satisfaction.

  - external_key: behavioral.customer_focus.apology_after_mistake
    competency_key: ownership
    topic: Owning a mistake that affected a customer
    difficulty: easy
    text: >-
      Tell me about a time something you did directly caused a problem for a customer or user. How did you
      handle it with them?
    expected_concepts:
      - the mistake and its impact on the customer
      - prompt acknowledgement
      - fixing the immediate problem
      - making it right where possible
      - preventing recurrence
    rubric:
      excellent: Acknowledges the mistake to the customer promptly and plainly, fixes their immediate problem, makes amends where appropriate and prevents recurrence.
      good: Owns the mistake and fixes it for the customer.
      weak: Hides the mistake or fixes it quietly without telling the customer.
    followups:
      - How quickly did the customer find out, and from whom?
      - What changed so it couldn't happen again?
    common_errors:
      - Fixing quietly in the hope the customer never notices.

  - external_key: behavioral.customer_focus.non_expert_users
    competency_key: culture_values
    topic: Designing for users less technical than you
    difficulty: easy
    text: >-
      Tell me about a time you had to build or explain something for users with much less technical knowledge
      than you. What did you do differently because of who they were?
    expected_concepts:
      - who the users were and what they knew
      - specific adjustments to design or explanation
      - how they checked it worked for those users
      - outcome
    rubric:
      excellent: Describes concrete adjustments grounded in what those users knew and needed, checks the result with them, and shows it worked.
      good: Adapts the work sensibly for a less technical audience.
      weak: Makes no real adjustment or talks down to the users.
    followups:
      - What assumption about them turned out to be wrong?
      - How did you check they could use it without help?
    common_errors:
      - Assuming less technical users are less capable of understanding their own work.

  # ------------------------------------------------------------ advocacy and customer impact (medium)
  - external_key: behavioral.customer_focus.incident_customer_comms
    competency_key: communication
    topic: Communicating with customers during an outage
    difficulty: medium
    text: >-
      Tell me about an outage or serious problem that affected customers while you were involved. What did you
      do to keep customers informed while it was happening and after it was fixed?
    expected_concepts:
      - scope of customer impact
      - timing and channel of first communication
      - update cadence and accuracy
      - post-incident explanation to customers
      - improvements to customer communication
    rubric:
      excellent: Ensures early, accurate customer communication with a regular cadence, follows up with a clear explanation after resolution, and improves the communication process afterwards.
      good: Contributes to timely, accurate customer updates during the incident.
      weak: Focuses only on the technical fix with customers left uninformed.
    followups:
      - How did you decide what to say before you knew the cause?
      - What did customers ask that you weren't prepared for?
    common_errors:
      - Waiting until the root cause is known before saying anything.

  - external_key: behavioral.customer_focus.rebuilding_customer_trust
    competency_key: culture_values
    topic: Rebuilding a customer's trust
    difficulty: medium
    text: >-
      Tell me about a time a customer had lost confidence in your team or product. What did you do to rebuild
      that relationship, and how did you know it was working?
    expected_concepts:
      - what caused the loss of trust
      - understanding the customer's specific concerns
      - concrete commitments and visible delivery
      - regular communication
      - signs of restored trust
    rubric:
      excellent: Pinpoints what broke trust, makes specific commitments, delivers them visibly over time and points to concrete signs the relationship recovered.
      good: Takes clear steps to repair the relationship with some evidence of progress.
      weak: Relies on reassurances without changed behaviour or delivery.
    followups:
      - What was the first commitment you made, and why that one?
      - How long did it take to recover?
    common_errors:
      - Promising more instead of delivering smaller commitments reliably.

  - external_key: behavioral.customer_focus.prioritisation_argument_for_users
    competency_key: product_sense
    topic: Arguing for user-facing work in planning
    difficulty: medium
    text: >-
      Tell me about a time you argued for a piece of user-facing work during planning when it was competing
      with other priorities. How did you build the case, and what happened?
    expected_concepts:
      - the user problem and evidence of impact
      - how it compared with competing work
      - framing in terms decision-makers cared about
      - outcome of the prioritisation
      - result after delivery or deferral
    rubric:
      excellent: Builds an evidence-based case framed in terms of user and business impact, compares it fairly with competing work, and accepts or wins the decision with a clear outcome.
      good: Makes a reasoned, evidence-backed case for the work.
      weak: Argues from personal preference without evidence or comparison.
    followups:
      - What evidence was most persuasive?
      - If it lost, what did you do next?
    common_errors:
      - Ignoring the merits of the competing work.

  - external_key: behavioral.customer_focus.design_disagreement_user_grounds
    competency_key: collaboration
    topic: Disagreeing with a design because of user impact
    difficulty: medium
    text: >-
      Describe a time you disagreed with a design or product decision because you thought it would hurt users.
      How did you raise it, and how was it resolved?
    expected_concepts:
      - the decision and the specific user concern
      - evidence or user input gathered
      - how they raised it constructively
      - resolution and their response to it
      - outcome after launch
    rubric:
      excellent: Raises a specific, evidence-backed concern with the decision-maker, proposes alternatives, commits to the outcome even if overruled, and reflects on what happened.
      good: Raises the concern constructively with some evidence.
      weak: Complains without evidence, or silently goes along and later says they knew.
    followups:
      - What did you do once the decision was made?
      - Were you right in the end?
    common_errors:
      - Continuing to relitigate a decision after it was made.

  - external_key: behavioral.customer_focus.difficult_customer_boundary
    competency_key: culture_values
    topic: A customer whose demands kept escalating
    difficulty: medium
    text: >-
      Tell me about a customer whose demands kept growing or became unreasonable. How did you keep serving
      them well while setting boundaries?
    expected_concepts:
      - pattern of escalating requests
      - understanding their underlying pressures
      - clear boundaries and agreed process
      - involving colleagues or management
      - outcome of the relationship
    rubric:
      excellent: Understands what drives the customer's demands, sets clear and fair boundaries with an agreed process, involves others where needed and keeps delivering what was committed.
      good: Sets reasonable boundaries while continuing to help.
      weak: Either gives in to every demand or disengages from the customer.
    followups:
      - Who else did you bring in, and when?
      - What did the agreed process look like?
    common_errors:
      - Setting boundaries without explaining them to the customer.

  - external_key: behavioral.customer_focus.quality_bar_under_pressure
    competency_key: culture_values
    topic: Holding the quality bar for users under deadline
    difficulty: medium
    text: >-
      Tell me about a time a deadline was pushing the team to release something you thought would give users
      a poor experience. What did you do, and what was the result?
    expected_concepts:
      - the specific quality issue and user impact
      - options explored (reduced scope, flag, staged rollout)
      - who was involved in the decision
      - outcome and how users fared
    rubric:
      excellent: Identifies the concrete user impact, proposes options that protect users without blindly delaying, involves the decision-makers, and describes how users actually fared.
      good: Raises the concern and contributes to a reasonable compromise.
      weak: Either ships silently or blocks without offering options.
    followups:
      - Which option did you propose, and why that one?
      - What did users experience in the end?
    common_errors:
      - Offering only "delay" or "ship" with nothing in between.

  - external_key: behavioral.customer_focus.proactive_customer_warning
    competency_key: culture_values
    topic: Warning customers before they were affected
    difficulty: medium
    text: >-
      Tell me about a time you found a problem that was going to affect customers before they noticed it. How
      did you decide whether and how to tell them?
    expected_concepts:
      - the problem and its expected impact
      - assessment of who would be affected
      - decision on disclosure and timing
      - content of the message and actions customers could take
      - fix and follow-up
    rubric:
      excellent: Assesses the impact accurately, discloses proactively to the affected customers with actionable guidance, and follows through with the fix and a final update.
      good: Tells affected customers proactively and fixes the problem.
      weak: Fixes quietly and hopes customers never notice, without considering their need to know.
    followups:
      - Who did you involve in the decision to tell customers?
      - How did customers react to hearing about it first from you?
    common_errors:
      - Disclosing to everyone with alarming vague language instead of to the affected users with specifics.

  - external_key: behavioral.customer_focus.localised_or_regional_users
    competency_key: culture_values
    topic: Users working in different regions or languages
    difficulty: medium
    text: >-
      Tell me about a time you worked on something used in several regions or languages and discovered it
      didn't work as well for some of them. What did you find, and how did you address it?
    expected_concepts:
      - the product and the regions or languages involved
      - specific problem discovered (formats, translations, connectivity, time zones)
      - how it was found
      - fix and how it was verified with those users
    rubric:
      excellent: Identifies a specific regional or language problem from evidence, fixes it, verifies with users in that context and prevents similar gaps.
      good: Finds and fixes a real problem for users in another region or language.
      weak: Treats the issue as minor because the main market was fine.
    followups:
      - How did you test it for users in that context?
      - What process change came out of it?
    common_errors:
      - Testing only in the team's own locale and network conditions.

  - external_key: behavioral.customer_focus.sales_escalation_triage
    competency_key: stakeholder_management
    topic: Handling urgent requests from customer-facing colleagues
    difficulty: medium
    text: >-
      Tell me about a time account managers or sales colleagues brought you an urgent request on behalf of a
      customer. How did you decide how to respond, and how did you handle the relationship with them?
    expected_concepts:
      - the request and its urgency
      - verifying the customer impact
      - weighing it against existing commitments
      - clear response to the colleague
      - improving the intake process
    rubric:
      excellent: Verifies the real customer impact, weighs it transparently against current work, responds clearly to the colleague, and improves how such requests reach the team.
      good: Handles the request reasonably and communicates clearly.
      weak: Drops everything for every request, or dismisses the colleague.
    followups:
      - How did you verify how urgent it really was?
      - What did you change in how those requests arrive?
    common_errors:
      - Treating every escalation as equally urgent.

  - external_key: behavioral.customer_focus.feature_flag_user_rollout
    competency_key: culture_values
    topic: Rolling out a change gradually to protect users
    difficulty: medium
    text: >-
      Tell me about a time you chose to roll out a change to users gradually instead of all at once. How did
      you decide who got it first, and what were you watching for?
    expected_concepts:
      - why a gradual rollout was chosen
      - selection of early users
      - signals monitored (errors, support contacts, behaviour)
      - criteria for expanding or rolling back
      - what was learned
    rubric:
      excellent: Chooses early users deliberately, defines user-impact signals and expansion or rollback criteria in advance, and describes acting on what was observed.
      good: Uses a staged rollout with sensible monitoring.
      weak: Rolls out gradually without defining what would stop the rollout.
    followups:
      - Did you ever roll back, and what triggered it?
      - How did early users know they were getting something new?
    common_errors:
      - Monitoring only technical errors and missing user experience signals.

  - external_key: behavioral.customer_focus.consistent_service_across_users
    competency_key: culture_values
    topic: Making sure all users got the same standard of help
    difficulty: medium
    text: >-
      Tell me about a time you noticed that some users were getting a much better experience or level of help
      than others for reasons that weren't justified. What did you do?
    expected_concepts:
      - the inconsistency and how it was noticed
      - cause of the difference
      - why it was unjustified
      - change made to give consistent treatment
      - outcome
    rubric:
      excellent: Spots the inconsistency from evidence, identifies its cause, and changes the process or product so users receive a consistent standard.
      good: Raises and helps fix an unjustified difference in user treatment.
      weak: Notices it but treats it as someone else's problem.
    followups:
      - How was the difference caused in the first place?
      - How do you check it stays consistent?
    common_errors:
      - Fixing individual cases without addressing the cause.

  # ------------------------------------------------------------ advocacy and customer impact (hard)
  - external_key: behavioral.customer_focus.pushing_back_on_leadership_for_users
    competency_key: culture_values
    topic: Challenging senior leaders on behalf of users
    difficulty: hard
    text: >-
      Tell me about a time you challenged a decision made by someone more senior because you believed it would
      harm users. How did you go about it, and what was the outcome?
    expected_concepts:
      - the decision and its expected harm to users
      - evidence assembled
      - choice of channel and timing
      - alternatives proposed
      - outcome and their conduct afterwards
    rubric:
      excellent: Builds a clear evidence-based case, raises it through an appropriate channel with alternatives, respects the final decision and shows how it played out for users.
      good: Raises a reasoned challenge with evidence.
      weak: Challenges without evidence, or never raises the concern.
    followups:
      - What would you have done if you had been overruled?
      - How did it affect your working relationship with that leader?
    common_errors:
      - Escalating around the decision-maker instead of to them.

  - external_key: behavioral.customer_focus.major_incident_customer_remedy
    competency_key: culture_values
    topic: Making things right for customers after a serious failure
    difficulty: hard
    text: >-
      Tell me about a serious failure that hurt customers, such as data loss, a long outage or a billing error.
      Beyond fixing the technical problem, what did you or your team do to make things right for them?
    expected_concepts:
      - nature and scale of the customer harm
      - identifying every affected customer
      - remedy offered (restoration, credits, manual help)
      - transparent explanation of what happened
      - systemic changes and how customers were told about them
    rubric:
      excellent: Identifies all affected customers, provides a concrete remedy proportionate to the harm, explains openly what happened and what changed, and delivers the systemic fixes.
      good: Provides a reasonable remedy and explanation to affected customers.
      weak: Treats the technical fix as the end of the matter.
    followups:
      - How did you find every affected customer?
      - How did you decide what remedy was fair?
    common_errors:
      - Offering a generic apology without a concrete remedy.

  - external_key: behavioral.customer_focus.ethical_data_use_user_trust
    competency_key: culture_values
    topic: Using customer data in a way users would expect
    difficulty: hard
    text: >-
      Tell me about a time your team wanted to use customer data for a new purpose, and you had to think about
      whether users would consider it acceptable. How did you work through it?
    expected_concepts:
      - the proposed new use and its value
      - user expectations and what they had agreed to
      - involvement of legal, privacy or security colleagues
      - safeguards or opt-in options
      - decision and its effect on user trust
    rubric:
      excellent: Assesses the use against what users reasonably expected, involves the right specialists, proposes safeguards such as minimisation or opt-in, and explains the final decision and its effect.
      good: Considers user expectations and involves the right people before proceeding.
      weak: Treats anything legally permitted as automatically acceptable to users.
    followups:
      - How would you have explained the use to a user directly?
      - What did you decide not to do?
    common_errors:
      - Equating legal permission with user trust.

  - external_key: behavioral.customer_focus.systemic_customer_pain_case
    competency_key: stakeholder_management
    topic: Getting investment for a long-standing customer pain point
    difficulty: hard
    text: >-
      Tell me about a long-standing customer pain point that had been ignored because it was hard or
      expensive to fix. How did you get it taken seriously, and what happened?
    expected_concepts:
      - the pain point and why it had been ignored
      - quantifying its cost to customers and the business
      - building support across teams and leaders
      - plan to fix it incrementally
      - result
    rubric:
      excellent: Quantifies the hidden cost of the problem, builds a coalition and a credible incremental plan, secures investment, and shows measurable improvement for customers.
      good: Raises the issue with evidence and gets some progress on it.
      weak: Raises the issue repeatedly without evidence or a plan.
    followups:
      - What finally convinced the decision-makers?
      - What did you have to give up to get it funded?
    common_errors:
      - Asking for a big rewrite instead of an incremental plan.

  - external_key: behavioral.customer_focus.advocating_without_authority
    competency_key: leadership
    topic: Changing another team's decision for users' sake
    difficulty: hard
    text: >-
      Tell me about a time another team was about to make a change that would hurt your users, and you had no
      authority over that team. How did you influence the outcome?
    expected_concepts:
      - the change and its impact on users
      - understanding the other team's goals
      - evidence and options presented
      - building agreement or escalating appropriately
      - outcome for users
    rubric:
      excellent: Understands the other team's goals, presents user-impact evidence with options that serve both teams, reaches agreement or escalates appropriately, and shows the outcome for users.
      good: Influences the other team constructively with evidence.
      weak: Escalates immediately or complains without engaging the other team.
    followups:
      - What did the other team need that you helped them get?
      - When did you consider escalating?
    common_errors:
      - Treating the other team as an adversary rather than understanding their constraints.
