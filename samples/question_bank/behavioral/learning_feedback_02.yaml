# Behavioural: learning and feedback (part 2 of 4) - self-directed improvement and calibrating your own work.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, reasoning, outcome, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ easy
  - external_key: behavioral.learning_feedback.self_spotted_gap
    competency_key: adaptability
    topic: Spotting your own skill gap
    difficulty: easy
    text: >-
      Tell me about a skill gap you noticed in yourself without anyone pointing it out. How did you spot it, and
      what did you do about it?
    expected_concepts:
      - the moment the gap became clear
      - assessing how much it mattered for the work
      - steps taken to close it
      - evidence of progress
    rubric:
      excellent: Describes how they noticed the gap, judged its importance for their work and took concrete steps with visible progress.
      good: Noticed a real gap and took reasonable action.
      weak: Names a gap but took no action, or the gap is irrelevant to the work.
    followups:
      - What resources did you use?
    common_errors:
      - Naming a gap without any action taken.

  - external_key: behavioral.learning_feedback.reflecting_after_work
    competency_key: adaptability
    topic: Reflecting when a piece of work wraps up
    difficulty: easy
    text: >-
      When a piece of work you were involved in wraps up, how do you look back on what went well and what
      didn't? Give me a recent example of something that reflection changed.
    expected_concepts:
      - a deliberate reflection habit
      - specific things that went well or badly
      - a change carried into the next piece of work
    rubric:
      excellent: Describes a deliberate reflection habit and a specific insight that changed how they handled the next piece of work.
      good: Reflects in some structured way and can name a resulting change.
      weak: Moves straight on to the next task with no reflection, or reflection without change.
    followups:
      - Do you write these reflections down?
    common_errors:
      - Describing team retrospectives only, with nothing personal.

  - external_key: behavioral.learning_feedback.retro_point_about_you
    competency_key: culture_values
    topic: A retrospective point about your part
    difficulty: easy
    text: >-
      Tell me about a team retrospective or review where a point was raised about your part of the work. What
      did you do with it?
    expected_concepts:
      - the point raised and its context
      - engaging with it openly in the session
      - action taken afterwards
      - follow-up in later retrospectives
    rubric:
      excellent: Engages with the point openly, takes a concrete action and shows it was revisited and resolved in later sessions.
      good: Accepted the point and acted on it.
      weak: Explains away the point or treats retrospectives as a formality.
    followups:
      - How did the team know you had acted on it?
    common_errors:
      - Agreeing in the meeting but taking no action afterwards.

  - external_key: behavioral.learning_feedback.workflow_fix
    competency_key: adaptability
    topic: Changing your workflow after a recurring problem
    difficulty: easy
    text: >-
      Tell me about a change you made to your own daily workflow, such as a tool, a checklist or a routine,
      because something kept going wrong. What prompted it and what difference did it make?
    expected_concepts:
      - the recurring problem
      - the change introduced
      - why that change addressed the cause
      - observable difference afterwards
    rubric:
      excellent: Links a recurring problem to a specific workflow change that addresses its cause and describes a clear, observable improvement.
      good: Reasonable change with some improvement.
      weak: Change unrelated to the cause or no evidence it helped.
    followups:
      - Did you share the change with anyone else?
    common_errors:
      - Describing a tool adoption with no link to a problem.

  - external_key: behavioral.learning_feedback.learning_from_success
    competency_key: adaptability
    topic: Learning from something that went well
    difficulty: easy
    text: >-
      Think of something that went better than expected for you at work. How did you work out why it went well,
      so that you could repeat it?
    expected_concepts:
      - the success and why it was unexpected
      - separating their actions from luck or circumstance
      - identifying the repeatable elements
      - applying them again
    rubric:
      excellent: Separates their own actions from luck, identifies specific repeatable elements and shows they applied them again successfully.
      good: Reasonable analysis of why it went well with some reuse.
      weak: Takes the success at face value with no analysis.
    followups:
      - What part of it was luck?
    common_errors:
      - Crediting the outcome entirely to their own effort.

  - external_key: behavioral.learning_feedback.specific_feedback_question
    competency_key: culture_values
    topic: Asking a sharper question to get useful feedback
    difficulty: easy
    text: >-
      When you ask someone for feedback, what do you actually ask them? Tell me about a time a more specific
      question got you far more useful input than a general one would have.
    expected_concepts:
      - the general question that produced little
      - the specific question they asked instead
      - why it worked better
      - what they did with the input
    rubric:
      excellent: Contrasts a vague request with a specific question tied to a concrete part of the work, explains why it drew better input and describes what they changed as a result.
      good: Gives an example of a targeted question that produced useful input.
      weak: Only ever asks whether there is any feedback, or cannot give an example.
    followups:
      - What question do you find works best now?
    common_errors:
      - Describing the feedback received without the question that prompted it.

  - external_key: behavioral.learning_feedback.revisiting_old_work
    competency_key: adaptability
    topic: Looking back at work you did long ago
    difficulty: easy
    text: >-
      Tell me about a time you went back to something you produced a year or more earlier. What did you notice
      about it, and what did that tell you about how your work had changed?
    expected_concepts:
      - the earlier piece of work
      - specific things they would now do differently
      - what had driven the change
      - areas still to improve
    rubric:
      excellent: Names specific differences between then and now, links them to what drove the improvement and identifies something they still want to get better at.
      good: Notices concrete differences and explains some of the reasons.
      weak: Says the old work was fine or bad with no specific observations.
    followups:
      - Did you change anything in it when you saw it?
    common_errors:
      - Only listing new tools rather than changes in judgement or approach.

  - external_key: behavioral.learning_feedback.example_of_good_first
    competency_key: adaptability
    topic: Asking what good looks like before starting
    difficulty: easy
    text: >-
      Tell me about a time you asked someone to show you an example of what good looked like before you started a
      piece of work. How did it shape what you produced?
    expected_concepts:
      - why they were unsure of the standard
      - who they asked and what they were shown
      - how the example shaped their work
      - avoiding simply copying the example
    rubric:
      excellent: Explains why they needed a reference, how the example clarified the expected standard and how they adapted it rather than copying it, with the outcome.
      good: Used an example sensibly to calibrate their work.
      weak: Never checks the expected standard, or copied the example without thought.
    followups:
      - What would have happened if you hadn't asked?
    common_errors:
      - Treating the example as a template to copy.

  - external_key: behavioral.learning_feedback.recurring_check_findings
    competency_key: adaptability
    topic: A pattern in what quality checks kept flagging
    difficulty: easy
    text: >-
      Tell me about a time a review, checklist, automated check or report kept flagging the same kind of issue in
      your work. What did you learn from the pattern, and what did you change?
    expected_concepts:
      - the recurring issue
      - recognising it as a pattern rather than one-offs
      - the underlying cause in how they worked
      - the change made and its effect
    rubric:
      excellent: Treats the repeated findings as a signal about their own way of working, identifies the underlying cause and shows the findings dropped after a specific change.
      good: Noticed the pattern and changed something reasonable.
      weak: Fixed each finding individually without noticing the pattern.
    followups:
      - How did you notice it was a pattern?
    common_errors:
      - Fixing symptoms one by one.

  # ------------------------------------------------------------ medium
  - external_key: behavioral.learning_feedback.missed_warning_signs
    competency_key: adaptability
    topic: Early warning signs you missed
    difficulty: medium
    text: >-
      Tell me about a time you looked back and realised there were early warning signs you had missed. What
      were they, and how do you watch for them now?
    expected_concepts:
      - the outcome and the missed signs
      - why they were missed at the time
      - a specific practice to catch them now
      - an example of catching a sign since
    rubric:
      excellent: Names specific missed signs, explains why they were overlooked and describes a concrete practice that has since caught a similar sign.
      good: Identifies the signs and a reasonable change.
      weak: Hindsight with no change in practice.
    followups:
      - Has that practice caught anything since?
    common_errors:
      - Listing the signs without explaining why they were missed.

  - external_key: behavioral.learning_feedback.deliberate_practice
    competency_key: adaptability
    topic: Deliberately improving one part of your job
    difficulty: medium
    text: >-
      Tell me about a time you deliberately worked on getting better at one specific part of your job over
      several months. How did you structure the practice?
    expected_concepts:
      - the skill and why it mattered
      - structured practice with feedback
      - fitting practice into real work
      - measurable progress
    rubric:
      excellent: Describes structured practice with regular feedback, built into real work, and concrete evidence of progress over the period.
      good: Sustained effort with some structure and visible progress.
      weak: Occasional reading or courses with no application or evidence.
    followups:
      - Where did you get feedback during the practice?
    common_errors:
      - Equating consuming material with practising.

  - external_key: behavioral.learning_feedback.early_course_correction
    competency_key: adaptability
    topic: Building early checkpoints into your work
    difficulty: medium
    text: >-
      How do you build checkpoints into your work so you find out early whether you're on the right track? Walk
      me through an example where one of those checkpoints caught something.
    expected_concepts:
      - the kind of checkpoints used, such as drafts, prototypes or demos
      - who is involved in them
      - what was caught
      - cost avoided by catching it early
    rubric:
      excellent: Describes deliberate checkpoints suited to the work, the people involved, what was caught and the rework it avoided.
      good: Has some early checks and an example of them helping.
      weak: Only finds out at the end whether the work was right.
    followups:
      - How do you decide how often to check?
    common_errors:
      - Describing status updates rather than real checks on direction.

  - external_key: behavioral.learning_feedback.someone_did_it_better
    competency_key: adaptability
    topic: Seeing someone solve a problem better than you had
    difficulty: medium
    text: >-
      Tell me about a time you saw someone else handle a problem far better than you had handled a similar one.
      What did you take from it?
    expected_concepts:
      - the two situations compared
      - specific differences in approach
      - what they adopted
      - result of applying it
    rubric:
      excellent: Pinpoints the specific differences in approach, adopts something concrete and shows it working in their own later work.
      good: Recognises the better approach and adopts part of it.
      weak: Explains why their own approach was fine, or admires without adopting.
    followups:
      - Did you talk to them about how they approached it?
    common_errors:
      - Admiring the other approach without applying it.

  - external_key: behavioral.learning_feedback.outdated_assumption
    competency_key: adaptability
    topic: Realising your knowledge was out of date
    difficulty: medium
    text: >-
      Tell me about a time you realised something you had been relying on was out of date, whether a practice, a
      tool or an assumption. How did you catch up?
    expected_concepts:
      - what was outdated and how it was discovered
      - impact of relying on it
      - how they updated their knowledge
      - how they keep it current now
    rubric:
      excellent: Explains how they discovered it, the impact, a focused way of catching up and a habit that now keeps that area current.
      good: Caught up effectively once they noticed.
      weak: Updated only when forced, with no habit to prevent recurrence.
    followups:
      - How did you check what else might be out of date?
    common_errors:
      - No change to how they keep knowledge current.

  - external_key: behavioral.learning_feedback.self_view_differed
    competency_key: adaptability
    topic: When your view of your work differed from others'
    difficulty: medium
    text: >-
      Tell me about a time your own view of how a piece of work went was quite different from how others saw it.
      How did you reconcile the two?
    expected_concepts:
      - their view and the others' view
      - gathering specifics on both sides
      - identifying what each view missed
      - adjusting their self-assessment going forward
    rubric:
      excellent: Gathers specifics behind the differing views, identifies what each side missed and explains how they now calibrate their own assessment of their work.
      good: Understood the gap and adjusted their view where warranted.
      weak: Assumes others were mistaken, or simply adopts their view without understanding why.
    followups:
      - How do you check your self-assessment now?
    common_errors:
      - Treating the other view as a misunderstanding to correct.

  - external_key: behavioral.learning_feedback.colleague_flags_slips
    competency_key: adaptability
    topic: Asking a colleague to point out when you slip back
    difficulty: medium
    text: >-
      Tell me about a time you asked a colleague to point it out whenever they saw you slipping back into a habit
      you were trying to change. How did that work in practice?
    expected_concepts:
      - the habit being changed
      - choosing the colleague and agreeing how they would flag it
      - examples of being flagged
      - how long it took for the change to hold
    rubric:
      excellent: Sets up a clear agreement on how and when to be flagged, responds well to being flagged and shows the habit changed over time.
      good: Used a colleague's help with some success.
      weak: Asked for help but did not act when flagged, or the arrangement fizzled with no change.
    followups:
      - How did you make it easy for them to say something?
    common_errors:
      - Setting it up but not responding when flagged.

  - external_key: behavioral.learning_feedback.good_review_more_to_learn
    competency_key: adaptability
    topic: Looking for improvement after a positive review
    difficulty: medium
    text: >-
      Tell me about a time a formal review said you were doing well, but you suspected there was more you could
      improve. How did you find out what it was?
    expected_concepts:
      - why they suspected more to improve
      - sources sought beyond the formal review
      - the specific area identified
      - action taken
    rubric:
      excellent: Seeks specific input beyond the formal review from people who see their work closely, identifies a concrete area and acts on it with results.
      good: Looked for further input and found something to work on.
      weak: Took the positive review as a reason to stop looking.
    followups:
      - Who gave you the most useful answer?
    common_errors:
      - Choosing an area unrelated to the work.

  - external_key: behavioral.learning_feedback.own_work_data
    competency_key: adaptability
    topic: Using data about your own work to improve
    difficulty: medium
    text: >-
      Tell me about a time you used data about your own work, such as turnaround time, error rates or outcomes for
      the people you served, to find something to improve. What did you find and change?
    expected_concepts:
      - the data used and why
      - the pattern found
      - the change made
      - measured effect afterwards
      - limits of the data
    rubric:
      excellent: Chooses meaningful data, finds a specific pattern, makes a targeted change and measures the effect while recognising what the data could not show.
      good: Used data to find and fix something real.
      weak: Mentions metrics without any change resulting from them.
    followups:
      - What did the numbers not tell you?
    common_errors:
      - Optimising a number that did not reflect real outcomes.

  - external_key: behavioral.learning_feedback.piloted_own_change
    competency_key: adaptability
    topic: Asking for feedback while trialling a change in how you work
    difficulty: medium
    text: >-
      Tell me about a time you trialled a change in your own way of working and asked the people affected for
      feedback during the trial. What did you adjust based on what they said?
    expected_concepts:
      - the change and why they tried it
      - who was affected and how feedback was gathered
      - what the feedback revealed
      - adjustments made and final outcome
    rubric:
      excellent: Defines the trial, gathers feedback from those affected at set points, makes specific adjustments and explains the final decision with evidence.
      good: Trialled a change and adjusted it based on input.
      weak: Made the change without checking its effect on others.
    followups:
      - What would have made you abandon it?
    common_errors:
      - Asking for feedback only at the end.

  - external_key: behavioral.learning_feedback.expert_found_fundamental_gap
    competency_key: adaptability
    topic: An expert review that found something fundamental
    difficulty: medium
    text: >-
      Tell me about a time an expert reviewed your plan or proposal and pointed out something fundamental you had
      missed. What did you learn about how you prepare?
    expected_concepts:
      - the plan and the missed issue
      - why it was missed
      - how the plan was reworked
      - change in how they prepare future work
    rubric:
      excellent: Explains why the issue was missed, reworks the plan properly and describes a lasting change in how they prepare, such as earlier expert input or explicit assumption checks.
      good: Accepted the finding and reworked the plan.
      weak: Minimises the finding or draws no lesson about preparation.
    followups:
      - When do you involve experts now?
    common_errors:
      - Only describing the fix to the plan.

  # ------------------------------------------------------------ hard
  - external_key: behavioral.learning_feedback.lesson_to_team_standard
    competency_key: ownership
    topic: Turning a hard lesson into a shared practice
    difficulty: hard
    text: >-
      Tell me about a lesson you learned the hard way that you turned into a practice, checklist or standard
      others now follow. How did you get people to adopt it?
    expected_concepts:
      - the original lesson and its cost
      - designing a practice others could use
      - gaining buy-in
      - adoption and evidence of impact
      - keeping it maintained
    rubric:
      excellent: Turns a personal lesson into a lightweight practice, wins adoption with evidence and shows measurable impact and ongoing upkeep.
      good: Created a practice that others use with some impact.
      weak: Wrote something nobody adopted, or mandated it without buy-in.
    followups:
      - What resistance did you meet?
      - Is it still in use?
    common_errors:
      - Measuring success by publishing the document rather than adoption.

  - external_key: behavioral.learning_feedback.long_hidden_blind_spot
    competency_key: adaptability
    topic: A blind spot that took a long time to see
    difficulty: hard
    text: >-
      Tell me about a blind spot in how you work that took you a long time to see. How did it finally become
      visible, and how do you guard against it now?
    expected_concepts:
      - the blind spot and its effect on work
      - why it stayed hidden
      - what revealed it
      - safeguards or habits now in place
    rubric:
      excellent: Describes a real blind spot with its effect on outcomes, explains why it stayed hidden and names concrete safeguards such as trusted reviewers or checkpoints.
      good: Credible blind spot with some safeguard.
      weak: Superficial or disguised strength, with no safeguard.
    followups:
      - Who helps you catch it now?
    common_errors:
      - Choosing a trait that is really a strength.

  - external_key: behavioral.learning_feedback.improving_under_load
    competency_key: adaptability
    topic: Improving a weakness while carrying a full workload
    difficulty: hard
    text: >-
      Tell me about a time you had to improve a weakness while still carrying a full workload where that
      weakness mattered. How did you balance getting better with getting the work done?
    expected_concepts:
      - the weakness and why it mattered for the work
      - protecting delivery while learning
      - using real work as practice
      - getting support or adjusting scope
      - outcome on both fronts
    rubric:
      excellent: Uses real work as deliberate practice, protects delivery with support or adjusted scope and shows progress on both the weakness and the work.
      good: Managed both reasonably with some progress.
      weak: Deferred the improvement indefinitely or let delivery suffer without managing it.
    followups:
      - Who did you tell about what you were working on?
    common_errors:
      - Treating learning as something only done outside work.

  - external_key: behavioral.learning_feedback.independent_review_sought
    competency_key: ownership
    topic: Seeking an independent review before something critical
    difficulty: hard
    text: >-
      Tell me about a time you asked someone with no stake in your work to review it before something important
      went live. What did they catch, and how has that changed when you seek reviews?
    expected_concepts:
      - why an independent view was needed
      - choosing the reviewer and setting the scope
      - what was found
      - handling the findings
      - criteria for seeking reviews now
    rubric:
      excellent: Explains why independence mattered, scoped the review well, acted on the findings and describes clear criteria for when they now seek such reviews.
      good: Sought a review and acted on what it found.
      weak: Review was a formality or findings were dismissed.
    followups:
      - How did you choose the reviewer?
    common_errors:
      - Choosing a reviewer who was unlikely to challenge the work.

  - external_key: behavioral.learning_feedback.reviewing_past_decisions
    competency_key: adaptability
    topic: Reviewing your own past decisions to improve judgement
    difficulty: hard
    text: >-
      How do you look back at your own past decisions to improve your judgement over time? Give me an example of a
      pattern you found and what you changed because of it.
    expected_concepts:
      - a method for recording or revisiting decisions
      - separating decision quality from outcome
      - a specific recurring pattern
      - a change in how they decide
      - evidence the change helped
    rubric:
      excellent: Describes a deliberate method for revisiting decisions, separates the quality of the reasoning from luck, identifies a specific pattern and shows a change that improved later decisions.
      good: Some regular reflection with a credible pattern and change.
      weak: Reflects only after failures, or judges decisions purely by their outcome.
    followups:
      - How do you tell a bad decision from bad luck?
    common_errors:
      - Judging each decision only by how it turned out.
