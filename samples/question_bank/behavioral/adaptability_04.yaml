# Behavioural: adaptability (4 of 4) — organisational change, new ways of working, setbacks and leading change.
# Questions ask for real past examples; evaluation is based only on the content of the answer
# (actions, reasoning, outcome, reflection), never on delivery style or personality.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: adaptability
questions:
  # ------------------------------------------------------------------ easy
  - external_key: behavioral.adaptability.new_manager_expectations
    topic: Adjusting to a new manager's expectations
    difficulty: easy
    text: >-
      Tell me about a time you started working with a new manager whose expectations were different from your
      previous one's. How did you find out what they expected, and what did you change?
    expected_concepts:
      - asking directly about priorities and preferred ways of working
      - noticing differences from the previous arrangement
      - specific changes to their reporting or work habits
      - checking in on whether the changes worked
    rubric:
      excellent: Asks directly about priorities and working preferences, identifies concrete differences, makes specific changes and checks whether they worked.
      good: Adjusts to the new manager with some concrete changes.
      weak: Waited to be told, or describes the manager rather than their own adjustments.
    followups:
      - What was the biggest difference you had to adjust to?
      - How did you know the adjustment was working?
    common_errors:
      - Assuming the new manager wants what the old one wanted.

  - external_key: behavioral.adaptability.different_working_styles
    topic: Adapting to teammates who work differently
    difficulty: easy
    text: >-
      Describe a time you joined or worked with a team whose way of working was quite different from what you
      were used to, for example how they planned, reviewed or communicated. How did you adjust?
    expected_concepts:
      - observing how the team worked before changing anything
      - understanding why they worked that way
      - adjusting their own habits
      - suggesting improvements once trusted
    rubric:
      excellent: Observes first, understands the reasons behind the team's practices, adjusts their own habits and later suggests improvements with evidence.
      good: Adapts to the team's way of working with a clear example.
      weak: Expected the team to adapt to them, or the answer stays general.
    followups:
      - What did you come to prefer about their way of working?
      - What did you suggest changing, and how was it received?
    common_errors:
      - Pushing old practices on the new team immediately.
    competency_key: collaboration

  - external_key: behavioral.adaptability.changed_work_arrangement
    topic: Adjusting to a change in how the team works together
    difficulty: easy
    text: >-
      Tell me about a time the way your team worked together changed, for example moving between in-office,
      hybrid or fully distributed work. What did you change in how you collaborated?
    expected_concepts:
      - what stopped working after the change
      - specific changes to communication or coordination
      - keeping information visible to everyone
      - effect on the team's work
    rubric:
      excellent: Identifies what stopped working, makes specific changes to communication or coordination, keeps information visible to everyone and describes the effect on the work.
      good: Gives concrete adjustments that helped the team collaborate.
      weak: Describes the change in arrangement but not their own adjustments.
    followups:
      - What practice did you start that the team kept?
      - What still did not work well?
    common_errors:
      - Assuming informal conversations would reach everyone.
    competency_key: collaboration

  - external_key: behavioral.adaptability.acting_on_feedback_quickly
    topic: Changing your approach after feedback
    difficulty: easy
    text: >-
      Tell me about a piece of feedback about your work that made you change how you did something. What exactly
      did you change, and how did you check it helped?
    expected_concepts:
      - the specific feedback
      - understanding the reason behind it
      - a concrete change in practice
      - checking the effect afterwards
    rubric:
      excellent: Describes specific feedback, understands the reason behind it, makes a concrete change and checks whether it improved things.
      good: Acted on feedback with a clear change.
      weak: Feedback is vague, or nothing actually changed.
    followups:
      - Did you ask for follow-up feedback?
      - Was there any part of the feedback you disagreed with?
    common_errors:
      - Agreeing with feedback without changing anything.
    competency_key: culture_values

  - external_key: behavioral.adaptability.moved_to_new_team
    topic: Being moved to a different team
    difficulty: easy
    text: >-
      Have you been moved to a different team because of a reorganisation or business need? Tell me how you
      handed over your old work and got going in the new team.
    expected_concepts:
      - clean handover of previous responsibilities
      - learning the new team's goals and work
      - early contribution in the new team
      - staying available for questions on the old work
    rubric:
      excellent: Hands over old work cleanly, learns the new team's goals quickly, makes an early contribution and stays reachable for questions on the old work.
      good: Transitions with a reasonable handover and gets productive.
      weak: Leaves the old work without a handover, or describes only the move.
    followups:
      - What did you write for the person taking over your old work?
      - What was your first contribution in the new team?
    common_errors:
      - Leaving without passing on undocumented knowledge.

  - external_key: behavioral.adaptability.distributed_time_zones
    topic: Working across distant time zones
    difficulty: easy
    text: >-
      Tell me about working with colleagues in time zones far from yours. What did you change about how you
      shared information and made decisions?
    expected_concepts:
      - written updates that stand on their own
      - using overlap hours for decisions that need discussion
      - clear handoffs at the end of the day
      - avoiding blocking others overnight
    rubric:
      excellent: Describes self-contained written updates, deliberate use of overlap time, clear end-of-day handoffs and steps that stopped work waiting overnight.
      good: Adapts communication for time differences with concrete practices.
      weak: Describes the difficulty with no adjustments.
    followups:
      - What did a good handoff note look like?
      - How did you handle urgent issues outside overlap hours?
    common_errors:
      - Leaving questions that block others until the next day.
    competency_key: collaboration

  - external_key: behavioral.adaptability.audience_specific_updates
    topic: Changing how you communicate for a new stakeholder
    difficulty: easy
    text: >-
      Tell me about a time you started reporting to or working with a stakeholder who needed information in a
      very different form from what you were used to giving. How did you adapt?
    expected_concepts:
      - finding out what the stakeholder needed and why
      - changing level of detail, format or frequency
      - checking that the new format worked for them
    rubric:
      excellent: Finds out what the stakeholder needs and why, changes the detail, format or frequency accordingly and confirms the new approach worked.
      good: Adapts communication with a clear example.
      weak: Kept the same format, or describes the stakeholder without their own changes.
    followups:
      - How did you find out what they wanted?
      - What did you stop including?
    common_errors:
      - Sending the same update to everyone regardless of need.
    competency_key: communication

  - external_key: behavioral.adaptability.release_blocked_externally
    topic: A plan blocked by something outside your control
    difficulty: easy
    text: >-
      Describe a time something outside your control, like another team's delay or an external approval, blocked
      a plan you were about to carry out. What did you do next?
    expected_concepts:
      - understanding the blocker and its likely duration
      - informing those affected
      - finding alternative work or a workaround
      - following up to get it unblocked
    rubric:
      excellent: Understands the blocker and likely delay, informs those affected, finds a sensible workaround or alternative work and actively follows up to unblock.
      good: Handles the block with communication and alternative work.
      weak: Waits passively, or describes only the blocker.
    followups:
      - How did you decide whether to wait or work around it?
      - What would you do differently to avoid that dependency?
    common_errors:
      - Waiting quietly without telling anyone the plan had slipped.

  # ---------------------------------------------------------------- medium
  - external_key: behavioral.adaptability.process_you_doubted
    topic: Adopting a process you had doubts about
    difficulty: medium
    text: >-
      Tell me about a process or practice your team adopted that you had doubts about. How did you approach it,
      and did your view change?
    expected_concepts:
      - stating doubts constructively
      - giving it a fair trial
      - collecting evidence on how it worked
      - updating their view or proposing changes
    rubric:
      excellent: States doubts constructively, gives the practice a genuine trial, collects evidence and either updates their view or proposes specific changes based on it.
      good: Tries the practice in good faith and reflects on how it worked.
      weak: Complies minimally or keeps objecting without evidence.
    followups:
      - What evidence did you look at?
      - What would have convinced you sooner?
    common_errors:
      - Judging the practice before it had a fair chance.

  - external_key: behavioral.adaptability.tool_consolidation
    topic: Adjusting when systems or teams were merged
    difficulty: medium
    text: >-
      Describe a time two teams, systems or ways of working were merged into one, perhaps after an acquisition or
      consolidation. What did you do to make the merged setup work?
    expected_concepts:
      - understanding both sides' practices
      - choosing what to keep based on merit
      - handling the transition for users or customers
      - resolving friction between the groups
    rubric:
      excellent: Understands both sides, helps decide what to keep on merit, handles the transition carefully and resolves friction with concrete steps.
      good: Contributes constructively to the merge with a clear outcome.
      weak: Defends their own side's approach by default, or describes the merge without their role.
    followups:
      - What did your side have to give up?
      - What friction came up, and how was it resolved?
    common_errors:
      - Assuming their own side's way was the correct default.

  - external_key: behavioral.adaptability.team_grew_quickly
    topic: Working as the team grew quickly
    difficulty: medium
    text: >-
      Tell me about a time your team grew quickly, maybe doubling in a few months. What stopped working, and what
      did you change?
    expected_concepts:
      - noticing practices that did not scale
      - making knowledge explicit through documentation or onboarding
      - adjusting communication and ownership
      - effect on delivery
    rubric:
      excellent: Names specific practices that broke as the team grew, makes knowledge and ownership explicit, adjusts communication and shows the effect on delivery.
      good: Identifies scaling problems and contributes to fixes.
      weak: Describes the growth without what they changed.
    followups:
      - What did you have to write down that used to be informal?
      - How did you help new people get productive?
    common_errors:
      - Relying on informal knowledge long after it stopped scaling.

  - external_key: behavioral.adaptability.smaller_team_wider_scope
    topic: Covering a wider scope in a smaller team
    difficulty: medium
    text: >-
      Describe a time you worked in a much smaller team or organisation than you were used to, where you had to
      cover things outside your usual role. How did you decide what to take on and what to let go?
    expected_concepts:
      - identifying the most important gaps
      - learning new areas quickly enough to cover them
      - deliberately deprioritising lower-value work
      - result for the team
    rubric:
      excellent: Identifies the most important gaps, learns new areas fast enough to cover them, deliberately lets go of lower-value work and shows the benefit to the team.
      good: Takes on wider responsibilities and handles them reasonably.
      weak: Tried to do everything at once, or stayed narrowly within their old role.
    followups:
      - What did you let go, and what happened as a result?
      - Which new area was hardest to cover?
    common_errors:
      - Trying to keep the standards of a large team for every area.

  - external_key: behavioral.adaptability.individual_to_lead_shift
    topic: Moving from doing the work to coordinating it
    difficulty: medium
    text: >-
      Tell me about a time your role shifted from mainly doing the work yourself to coordinating or guiding others.
      What did you have to stop doing, and what did you have to learn?
    expected_concepts:
      - recognising the change in expectations
      - letting go of doing everything personally
      - new skills such as delegation or planning
      - measuring their success differently
    rubric:
      excellent: Recognises the new expectations, stops doing work others should own, builds new skills such as delegation and planning and measures success through the team's results.
      good: Describes adjusting to the new role with some concrete changes.
      weak: Kept doing the hands-on work and coordination became an afterthought.
    followups:
      - What was hardest to hand over?
      - How did you measure your own success in the new role?
    common_errors:
      - Continuing to take the most interesting work themselves.
    competency_key: leadership

  - external_key: behavioral.adaptability.recovering_from_setback
    topic: Recovering the plan after a setback
    difficulty: medium
    text: >-
      Tell me about a significant setback on a project, such as a failed launch or a major defect late in the
      schedule. What did you do in the days after to get things back on track?
    expected_concepts:
      - assessing the real impact quickly
      - deciding on a recovery plan
      - communicating the setback and new plan
      - learning from the cause
      - eventual outcome
    rubric:
      excellent: Assesses impact quickly, sets a realistic recovery plan, communicates it openly, addresses the cause and gives the eventual outcome.
      good: Recovers from the setback with a reasonable plan and communication.
      weak: Describes the setback without recovery actions, or blames others.
    followups:
      - What was the first decision you made after the setback?
      - What changed to stop it happening again?
    common_errors:
      - Rushing a fix without understanding the cause.

  - external_key: behavioral.adaptability.external_rule_change
    topic: An external rule or market change affecting your work
    difficulty: medium
    text: >-
      Describe a time an external change, such as a new regulation, a partner's policy change or a market shift,
      forced you to change work already in progress. How did you respond?
    expected_concepts:
      - understanding precisely what the change required
      - assessing impact on existing and planned work
      - planning the change against the deadline
      - communicating with affected stakeholders
    rubric:
      excellent: Establishes exactly what the change required, assesses impact on current and planned work, plans against the deadline and keeps stakeholders informed, with a clear outcome.
      good: Responds to the change effectively with a reasonable plan.
      weak: Responds late or with only a partial understanding of the requirement.
    followups:
      - How did you confirm what the change really required?
      - What did it cost in terms of other plans?
    common_errors:
      - Over-reacting to the change without reading what it actually requires.

  - external_key: behavioral.adaptability.constant_interruptions_role
    topic: Working in a role full of interruptions
    difficulty: medium
    text: >-
      Tell me about a stretch of work where you were constantly interrupted, for example by support requests
      or a rotation duty. How did you organise yourself so the important work still moved?
    expected_concepts:
      - triaging requests by urgency and impact
      - protecting focused time where possible
      - batching or deflecting routine requests
      - reducing the source of interruptions
    rubric:
      excellent: Triages requests by impact, protects focused time, batches or deflects routine requests and reduces the source of interruptions, with evidence that important work progressed.
      good: Uses practical techniques to manage interruptions and keep work moving.
      weak: Responds to everything in arrival order, or describes only the difficulty.
    followups:
      - What did you do to reduce the number of interruptions?
      - How did you decide which requests could wait?
    common_errors:
      - Treating every interruption as equally urgent.

  - external_key: behavioral.adaptability.reestimating_midway
    topic: Updating a plan when the work turned out bigger
    difficulty: medium
    text: >-
      Tell me about a time you realised partway through that the work was much bigger than everyone had thought.
      What did you do with that realisation?
    expected_concepts:
      - recognising the signal early
      - re-estimating with the new understanding
      - raising it promptly with options
      - adjusting scope, timeline or resources
    rubric:
      excellent: Recognises the signal early, re-estimates on the new understanding, raises it promptly with options and agrees a revised plan that was then met.
      good: Raises the issue and adjusts the plan reasonably.
      weak: Kept quiet and missed the deadline, or gives no revised plan.
    followups:
      - What was the first sign the work was bigger?
      - Which option did the stakeholders choose?
    common_errors:
      - Hoping to catch up instead of raising the problem.

  - external_key: behavioral.adaptability.cross_function_collaboration
    topic: Working closely with an unfamiliar function
    difficulty: medium
    text: >-
      Describe a time you had to work closely with a function you rarely dealt with, such as sales, legal or
      operations. What did you need to learn about how they work to make the collaboration succeed?
    expected_concepts:
      - understanding their goals and constraints
      - learning their language and timelines
      - adjusting their own approach to fit
      - outcome of the collaboration
    rubric:
      excellent: Learns the other function's goals, constraints, language and timelines, adjusts their own approach accordingly and gives a clear joint outcome.
      good: Collaborates effectively with some adjustment to the other function.
      weak: Expected the other function to work like their own, or the collaboration produced no result.
    followups:
      - What did you misunderstand about how they work at first?
      - What would you do earlier next time?
    common_errors:
      - Assuming other functions share the same priorities and pace.
    competency_key: collaboration

  - external_key: behavioral.adaptability.platform_migration_participation
    topic: Working through a major technology migration
    difficulty: medium
    text: >-
      Tell me about a time your organisation moved to a new platform or technology stack while you still had to
      deliver. How did you handle working in both the old and new world?
    expected_concepts:
      - learning the new stack while maintaining the old
      - prioritising what to migrate and when
      - avoiding new investment in the old stack
      - contributing lessons back to the migration effort
    rubric:
      excellent: Learns the new stack while maintaining the old, prioritises migration sensibly, avoids unnecessary investment in the old stack and feeds lessons back into the wider migration.
      good: Delivers through the migration with reasonable prioritisation.
      weak: Stayed on the old stack as long as possible, or describes the migration without their role.
    followups:
      - What did you decide to leave on the old platform?
      - What lesson did you share with other teams?
    common_errors:
      - Rebuilding old problems faithfully on the new platform.

  - external_key: behavioral.adaptability.temporary_assignment
    topic: Contributing during a temporary assignment
    difficulty: medium
    text: >-
      Describe a time you were lent to another team or project for a short period. How did you make a real
      contribution in the time you had?
    expected_concepts:
      - agreeing clear goals for the assignment
      - learning just enough context quickly
      - delivering something concrete
      - leaving work in a state the team could continue
    rubric:
      excellent: Agrees clear goals up front, learns the essential context fast, delivers something concrete and leaves the work ready for the team to continue.
      good: Contributes usefully during the assignment.
      weak: Spent most of the time getting oriented, or left work the team could not continue.
    followups:
      - How did you agree what to focus on?
      - What did you bring back to your own team?
    common_errors:
      - Starting work that only they could finish.

  # ------------------------------------------------------------------ hard
  - external_key: behavioral.adaptability.leading_change_adoption
    topic: Getting others to adopt a change you introduced
    difficulty: hard
    text: >-
      Tell me about a change you introduced, such as a new tool, process or standard, that others had to adopt.
      How did you get people to actually change how they worked?
    expected_concepts:
      - making the case with evidence of the problem
      - involving people early and using their input
      - making the new way easy and the old way harder
      - tracking adoption and fixing obstacles
      - outcome measured after adoption
    rubric:
      excellent: Builds the case on evidence, involves people early, makes the new way the easy path, tracks adoption, removes obstacles and shows a measurable outcome.
      good: Gets the change adopted with a reasonable approach and result.
      weak: Announced the change and expected compliance, or adoption failed without reflection.
    followups:
      - Who was slowest to adopt, and why?
      - What did you change in your rollout based on early feedback?
    common_errors:
      - Treating an announcement as adoption.
    competency_key: leadership

  - external_key: behavioral.adaptability.reorganisation_resistance
    topic: Helping others through a change they resisted
    difficulty: hard
    text: >-
      Describe a time a change you were helping deliver met real resistance from the people affected. What did
      you learn from the resistance, and how did you respond?
    expected_concepts:
      - listening to the specific objections
      - separating valid concerns from general reluctance
      - adjusting the change where concerns were valid
      - explaining the reasons and supporting people through it
      - outcome
    rubric:
      excellent: Listens to specific objections, separates valid concerns from general reluctance, adjusts the change where concerns were valid, explains the reasons and gives a clear outcome.
      good: Addresses resistance with concrete steps and a reasonable result.
      weak: Treats resistance as a problem to override, or gives no outcome.
    followups:
      - Which objection led you to change the plan?
      - How did you handle people who still disagreed at the end?
    common_errors:
      - Assuming all resistance is unreasonable.

  - external_key: behavioral.adaptability.rebuilding_after_failure
    topic: Rebuilding the approach after a major failure
    difficulty: hard
    text: >-
      Tell me about a time an approach you championed failed badly enough that it had to be replaced. How did you
      lead or contribute to rebuilding it?
    expected_concepts:
      - acknowledging the failure openly
      - analysing the real causes
      - designing a new approach that addressed them
      - rebuilding stakeholder trust with early results
      - personal lessons applied since
    rubric:
      excellent: Acknowledges the failure openly, analyses its causes in depth, designs a new approach that addresses them, rebuilds trust through early results and names lessons applied since.
      good: Owns the failure and contributes to a better replacement.
      weak: Minimises the failure or attributes it entirely to others.
    followups:
      - What did you keep from the original approach?
      - How did you regain the support of stakeholders?
    common_errors:
      - Replacing the approach without understanding why it failed.
    competency_key: ownership

  - external_key: behavioral.adaptability.stability_versus_change
    topic: Balancing stability with the need to change
    difficulty: hard
    text: >-
      Describe a situation where your team needed to change direction but also couldn't afford to disrupt
      something that was working. How did you balance the two?
    expected_concepts:
      - identifying what had to stay stable
      - staging the change to limit risk
      - safeguards and ways to roll back
      - communicating the trade-off to stakeholders
      - outcome on both stability and change
    rubric:
      excellent: Identifies what must stay stable, stages the change with safeguards and rollback, explains the trade-off to stakeholders and shows good results on both the change and stability.
      good: Makes the change while protecting what was working, with a clear result.
      weak: Either avoided the change or disrupted what was working without mitigation.
    followups:
      - What safeguard turned out to matter most?
      - What did you decide not to change, and why?
    common_errors:
      - Treating stability and change as all-or-nothing.

  - external_key: behavioral.adaptability.when_adapting_fell_short
    topic: A time you did not adapt well enough
    difficulty: hard
    text: >-
      Tell me about a time you didn't adapt well to a change, where looking back you held on to the old way too
      long or adjusted too slowly. What was the cost, and what do you do differently now?
    expected_concepts:
      - clear description of the change and their slow response
      - the reasons they held on
      - the concrete cost
      - specific changes in how they respond to change now
      - evidence of applying the lesson since
    rubric:
      excellent: Describes the change and their slow response plainly, explains why they held on, states the concrete cost and gives a later example where they applied the lesson.
      good: Gives a real example with a clear lesson.
      weak: Chooses an example where they actually adapted well, or gives no lesson.
    followups:
      - What signal did you ignore at the time?
      - Can you give an example where you applied that lesson later?
    common_errors:
      - Turning the question into a story of success.
