# Behavioural: collaboration (part 4 of 4) - disagreement, group decisions, shared ownership,
# external partners and improving how people work together. Evaluation is based only on the
# content of the example, never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------------------------- easy
  - external_key: behavioral.collaboration.supporting_decision_you_opposed
    competency_key: collaboration
    topic: Supporting a decision you argued against
    difficulty: easy
    text: >-
      Tell me about a time your team went with a decision you had argued against. What did you do once the
      decision was made?
    expected_concepts:
      - their original position and reasoning
      - how the decision was made
      - committing fully to execution
      - watching outcomes without undermining
      - reflection on who was right
    rubric:
      excellent: Explains their position, accepts the decision process, commits fully to making it work, and reflects candidly on the result, including whether their view changed.
      good: Supports the decision constructively on a real example.
      weak: Describes passive resistance or saying "I told you so".
    followups:
      - What would have made you raise it again?
      - How did it turn out?
    common_errors:
      - Complying in public while working against the decision.

  - external_key: behavioral.collaboration.everyday_disagreement_on_priorities
    competency_key: collaboration
    topic: Everyday disagreement about how to split work
    difficulty: easy
    text: >-
      Tell me about a recent everyday disagreement with a colleague about priorities or how to split some work. How
      did the two of you settle it?
    expected_concepts:
      - what each person wanted and why
      - discussing directly rather than escalating
      - finding criteria or a compromise
      - outcome and working relationship
    rubric:
      excellent: Describes both views fairly, resolves it directly using shared criteria or a fair compromise, and shows the work and relationship both went well.
      good: Settles the disagreement constructively.
      weak: Avoids the conversation or settles it by going to a manager straight away.
    followups:
      - What would you do if you couldn't agree?
      - Do disagreements like that happen often on your teams, and why?
    common_errors:
      - Choosing an example with no real disagreement.

  - external_key: behavioral.collaboration.external_vendor_on_track
    competency_key: collaboration
    topic: Working with an external vendor or contractor
    difficulty: easy
    text: >-
      Describe a time you worked with an external vendor, partner or contractor to get something done. How did you
      keep the collaboration on track?
    expected_concepts:
      - clear scope and expectations
      - regular check-ins and shared tracking
      - giving the partner the context they needed
      - handling an issue that came up
    rubric:
      excellent: Describes clear expectations, regular checkpoints, sharing context so the partner could do good work, and how they handled an issue that arose, with a concrete outcome.
      good: Keeps an external collaboration on track with practical steps.
      weak: Treats the partner as fully responsible and checks in only at the end.
    followups:
      - What context did the partner lack at first?
      - What would you put in the agreement next time?
    common_errors:
      - Expecting an outside partner to know internal context.

  - external_key: behavioral.collaboration.unblocking_split_meeting
    competency_key: collaboration
    topic: Helping a split group reach a decision
    difficulty: easy
    text: >-
      Tell me about a time you helped a group reach a decision in a meeting where opinions were split. What did you
      do?
    expected_concepts:
      - summarising the options and positions
      - agreeing decision criteria
      - identifying who decides
      - recording the decision and next steps
    rubric:
      excellent: Summarises the positions fairly, steers the group to agree criteria or a decision owner, gets a clear decision and records next steps.
      good: Helps the group move forward on a real example.
      weak: Pushes their own option or lets the meeting end without a decision.
    followups:
      - What did you do for the people whose option wasn't chosen?
      - What if the group still couldn't decide?
    common_errors:
      - Confusing their own preference with the group's decision.

  - external_key: behavioral.collaboration.retrospective_change
    competency_key: collaboration
    topic: Raising something in a retrospective that changed the team
    difficulty: easy
    text: >-
      Tell me about something you raised in a team retrospective or review that changed how the team worked
      together. What was it, and what changed?
    expected_concepts:
      - the issue and evidence for it
      - raising it constructively
      - a concrete action and owner
      - follow-up on whether it worked
    rubric:
      excellent: Raises a specific collaboration issue with evidence, turns it into a concrete action with an owner and follows up to confirm the change worked.
      good: Gives a real example of a retrospective point leading to a change.
      weak: Describes complaints without actions or follow-up.
    followups:
      - How did you check later that it had worked?
      - What do you do when retrospective actions get forgotten?
    common_errors:
      - Raising problems without proposing an action.

  - external_key: behavioral.collaboration.clearing_up_who_does_what
    competency_key: collaboration
    topic: Clearing up confusion about who does what
    difficulty: easy
    text: >-
      Describe a time confusion about who was doing what caused problems on a piece of shared work. How did you help
      clear it up?
    expected_concepts:
      - the problem the confusion caused
      - listing tasks and assigning owners
      - making responsibilities visible
      - preventing the same confusion later
    rubric:
      excellent: Describes the impact, leads a quick clarification of tasks and owners, makes it visible in a shared place and shows the confusion did not recur.
      good: Helps clarify responsibilities with a reasonable outcome.
      weak: Picks up the dropped work silently without clarifying roles.
    followups:
      - How did the confusion start?
      - Where do you record who owns what now?
    common_errors:
      - Fixing the symptom without clarifying ownership.

  - external_key: behavioral.collaboration.lesson_from_poor_collaboration
    competency_key: collaboration
    topic: A lesson from a collaboration that went badly
    difficulty: easy
    text: >-
      Tell me about a collaboration that didn't go well and what you changed in how you work with others because
      of it.
    expected_concepts:
      - what went wrong
      - their own part in it
      - the specific change they made
      - evidence the change helped later
    rubric:
      excellent: Describes what went wrong including their own part, names a specific change in how they work with others and gives a later example where it helped.
      good: Draws a clear lesson from a real example.
      weak: Lesson is generic or the problem is attributed entirely to others.
    followups:
      - When did you last apply that lesson?
      - What would the other people involved say went wrong?
    common_errors:
      - A lesson so general it could apply to anything.

  - external_key: behavioral.collaboration.unprompted_help_to_other_team
    competency_key: collaboration
    topic: Helping another team without being asked
    difficulty: easy
    text: >-
      Tell me about a time you offered help to another team on something that wasn't part of your own goals. Why
      did you do it, and what came of it?
    expected_concepts:
      - noticing the other team's need
      - balancing with own commitments
      - the help provided
      - result for the other team and the relationship
    rubric:
      excellent: Explains why they offered, how they balanced it with their own work, what the help was and the effect on the other team and later collaboration.
      good: Gives a real example of useful help across teams.
      weak: The help was trivial or required by their role.
    followups:
      - How did you clear it with your own team?
      - Did it change how that team worked with you later?
    common_errors:
      - Neglecting their own commitments to help.

  # ------------------------------------------------------------------------------- medium
  - external_key: behavioral.collaboration.agreement_among_peers_without_authority
    competency_key: collaboration
    topic: Getting peers to agree on a direction
    difficulty: medium
    text: >-
      Tell me about a time you needed several peers to agree on a direction and nobody had authority over the
      others. How did you get to a decision?
    expected_concepts:
      - understanding each peer's concerns
      - one-to-one conversations before the group
      - a written proposal with options
      - agreeing how to decide
      - follow-through
    rubric:
      excellent: Understands each peer's concerns individually, shapes a proposal that addresses them, agrees a decision process and gets a decision that held.
      good: Builds agreement among peers with concrete actions.
      weak: Relies on a manager to decide or on forcing the issue in a meeting.
    followups:
      - Who was hardest to bring along, and what convinced them?
      - What did you change in your proposal because of their input?
    common_errors:
      - Seeking agreement only in large meetings.

  - external_key: behavioral.collaboration.escalating_without_damage
    competency_key: collaboration
    topic: Escalating a disagreement without harming the relationship
    difficulty: medium
    text: >-
      Describe a time a disagreement with another team couldn't be settled between you. How did you decide to
      escalate, and how did you do it without damaging the relationship?
    expected_concepts:
      - attempts to resolve directly first
      - agreeing jointly to escalate
      - a shared, fair summary of both positions
      - accepting the outcome
    rubric:
      excellent: Shows genuine attempts to resolve it first, escalates jointly with a fair summary of both positions, accepts the outcome and maintains the relationship.
      good: Escalates appropriately with a fair framing.
      weak: Escalates unilaterally, misrepresents the other side, or never escalates when needed.
    followups:
      - How did the other team know you were escalating?
      - What happened between the two teams afterwards?
    common_errors:
      - Escalating as a surprise to the other team.

  - external_key: behavioral.collaboration.persuaded_by_colleague
    competency_key: collaboration
    topic: When a colleague changed your mind
    difficulty: medium
    text: >-
      Tell me about a time a colleague persuaded you to change your position on something you felt strongly about.
      What convinced you?
    expected_concepts:
      - their original position and reasons
      - the evidence or argument that changed it
      - how they listened
      - what they did after changing their mind
    rubric:
      excellent: Describes a strongly held position, the specific evidence that changed it, how they engaged with the argument and how they publicly supported the new direction.
      good: Gives a real example of changing their mind for good reasons.
      weak: Cannot give an example or the change was trivial.
    followups:
      - How did you let others know you'd changed your view?
      - What makes you more open to changing your mind?
    common_errors:
      - Choosing an example where they had no real stake.

  - external_key: behavioral.collaboration.coordinating_shared_resource_changes
    competency_key: collaboration
    topic: Several teams changing the same shared thing
    difficulty: medium
    text: >-
      Describe a time several teams were changing the same shared system, document or resource. How did you
      coordinate so that changes didn't collide?
    expected_concepts:
      - recognising the collision risk
      - shared calendar, ownership or review rules
      - early notice of changes
      - resolving an actual conflict
    rubric:
      excellent: Describes concrete coordination mechanisms such as owners, review rules or change notice, how they handled a real collision and what they improved afterwards.
      good: Puts practical coordination in place with a reasonable outcome.
      weak: Relies on luck or fixes collisions only after they happen.
    followups:
      - Who had the final say when two changes conflicted?
      - What did it cost each team to coordinate?
    common_errors:
      - Coordination that depends on one person remembering everything.

  - external_key: behavioral.collaboration.fixing_underdelivering_partner
    competency_key: collaboration
    topic: An outside partner not delivering
    difficulty: medium
    text: >-
      Tell me about a time an external partner or vendor wasn't delivering what you needed. How did you work with
      them to fix it before resorting to escalation?
    expected_concepts:
      - specific gap between expectation and delivery
      - understanding causes on their side and yours
      - clarifying expectations or support
      - a recovery plan with checkpoints
      - escalation path if needed
    rubric:
      excellent: Pinpoints the gap, examines causes on both sides including unclear requirements, agrees a recovery plan with checkpoints and escalates only if that fails, with a clear outcome.
      good: Works constructively with the partner to improve delivery.
      weak: Goes straight to contract or management escalation.
    followups:
      - What part of the problem was on your side?
      - What would you write into the next agreement?
    common_errors:
      - Ignoring their own team's role in unclear requirements.

  - external_key: behavioral.collaboration.joint_planning_with_other_team
    competency_key: collaboration
    topic: Planning jointly with another team
    difficulty: medium
    text: >-
      Describe a time you planned work jointly with another team so that your schedules fit together. How did you
      handle the dependencies and the changes along the way?
    expected_concepts:
      - mapping dependencies and sequencing
      - agreed interfaces or milestones
      - shared tracking and regular syncs
      - re-planning together when things changed
    rubric:
      excellent: Describes mapping dependencies, agreeing milestones and interfaces, shared tracking and a specific change they re-planned jointly without derailing either team.
      good: Plans with another team and handles changes reasonably.
      weak: Plans separately and only discovers conflicts late.
    followups:
      - What change hurt the plan most?
      - How did you decide whose work moved when there was a clash?
    common_errors:
      - Treating the joint plan as fixed once agreed.

  - external_key: behavioral.collaboration.balancing_who_gets_heard
    competency_key: collaboration
    topic: Making room for voices that weren't heard
    difficulty: medium
    text: >-
      Tell me about a time one person was dominating group discussions and others weren't getting heard. What did
      you do?
    expected_concepts:
      - noticing whose views were missing
      - in-the-moment techniques (direct invitations, round-robin)
      - written input before discussion
      - a private, respectful word with the dominant person if needed
    rubric:
      excellent: Uses specific techniques in the moment and structurally, has a respectful conversation if needed, and shows that more views shaped the outcome.
      good: Takes concrete steps to bring in quieter voices.
      weak: Notices the problem but does nothing, or calls the person out publicly.
    followups:
      - What did the dominant person bring that was valuable?
      - What did you learn from the voices you brought in?
    common_errors:
      - Assuming silence means agreement.

  - external_key: behavioral.collaboration.team_working_agreements
    competency_key: collaboration
    topic: Agreeing explicit working agreements
    difficulty: medium
    text: >-
      Describe a time you helped your team agree explicit working agreements, for example on response times, review
      expectations or meetings. How did you get buy-in, and did the agreements stick?
    expected_concepts:
      - the friction that prompted it
      - involving the whole team in drafting
      - small, specific agreements
      - revisiting them over time
    rubric:
      excellent: Ties the agreements to real friction, involves the team in drafting specific commitments, revisits them and shows they changed behaviour.
      good: Helps the team adopt practical agreements with some effect.
      weak: Writes rules alone or describes agreements that were forgotten.
    followups:
      - Which agreement was broken first, and what happened?
      - How often did you revisit them?
    common_errors:
      - Too many agreements for anyone to remember.

  - external_key: behavioral.collaboration.own_part_in_collaboration_problem
    competency_key: collaboration
    topic: Your own part in a collaboration problem
    difficulty: medium
    text: >-
      Tell me about a time you realised you were part of the reason a collaboration wasn't working. What was your
      part, and what did you do about it?
    expected_concepts:
      - how they realised
      - specific behaviour of their own
      - acknowledging it to others
      - change made and result
    rubric:
      excellent: Identifies a specific behaviour of their own, explains how they realised it, acknowledges it to the people affected and shows a change that improved the collaboration.
      good: Takes some ownership and makes a change.
      weak: Names a fault that is really a strength or blames others.
    followups:
      - Who helped you see it?
      - How did the others respond when you raised it?
    common_errors:
      - Presenting a disguised strength as their flaw.

  - external_key: behavioral.collaboration.bringing_in_outside_expertise
    competency_key: collaboration
    topic: Bringing in expertise from outside your team
    difficulty: medium
    text: >-
      Tell me about a time you realised you needed expertise from outside your team to solve a problem. How did you
      find the right person and get their time?
    expected_concepts:
      - recognising the gap early
      - finding the expert through the network
      - a well-prepared, specific request
      - making it worthwhile for the expert
      - crediting their help
    rubric:
      excellent: Recognises the gap early, finds the right expert, makes a specific and well-prepared request, respects their time and credits their help visibly.
      good: Gets outside help effectively on a real example.
      weak: Struggles on alone or makes vague, unprepared requests.
    followups:
      - What did the expert get out of helping?
      - How did you keep that relationship going?
    common_errors:
      - Expecting experts to drop their own work without context.

  - external_key: behavioral.collaboration.joining_amid_group_friction
    competency_key: collaboration
    topic: Joining a project with existing friction
    difficulty: medium
    text: >-
      Describe a time you joined a project where there was already friction between two groups. How did you work
      with both sides?
    expected_concepts:
      - learning both perspectives independently
      - avoiding taking sides early
      - focusing on shared goals
      - small actions that rebuilt cooperation
    rubric:
      excellent: Learns both perspectives, stays even-handed, focuses people on shared goals and takes concrete steps that improved cooperation, with evidence.
      good: Works effectively with both groups.
      weak: Aligns with one side immediately or avoids engaging.
    followups:
      - What was the friction really about?
      - How did each group see your role?
    common_errors:
      - Adopting the first account they heard.

  - external_key: behavioral.collaboration.hearing_your_team_is_hard_to_work_with
    competency_key: collaboration
    topic: Hearing your team is hard to work with
    difficulty: medium
    text: >-
      Tell me about a time another team told you that working with your team was difficult. How did you respond,
      and what did you change?
    expected_concepts:
      - listening and asking for specifics
      - avoiding defensiveness
      - investigating with own team
      - concrete changes and follow-up with the other team
    rubric:
      excellent: Seeks specific examples, investigates with their own team, makes concrete changes and goes back to the other team to check the improvement.
      good: Takes the feedback seriously and makes some change.
      weak: Defends their team or dismisses the feedback.
    followups:
      - What was the most surprising thing they said?
      - How did your own team react to the feedback?
    common_errors:
      - Explaining why the other team was wrong.

  # ------------------------------------------------------------------------------- hard
  - external_key: behavioral.collaboration.disagreeing_with_senior_colleague
    competency_key: collaboration
    topic: Disagreeing with a senior colleague on something important
    difficulty: hard
    text: >-
      Tell me about a time you strongly disagreed with a senior colleague, or another team's lead, about something
      with significant consequences. How did you make your case, and what happened?
    expected_concepts:
      - the stakes of the decision
      - preparing evidence and alternatives
      - choosing the right setting
      - understanding the senior colleague's constraints
      - outcome and acceptance
    rubric:
      excellent: Prepares evidence and alternatives, chooses an appropriate setting, engages with the senior colleague's constraints, and handles the outcome constructively whichever way it went.
      good: Makes a well-reasoned case respectfully on a real example.
      weak: Stays silent on something important or argues without evidence.
    followups:
      - What did you learn about their constraints?
      - How did the decision turn out over time?
    common_errors:
      - Framing seniority as the reason they lost the argument.

  - external_key: behavioral.collaboration.merging_two_groups_ways_of_working
    competency_key: collaboration
    topic: Combining two groups' ways of working
    difficulty: hard
    text: >-
      Describe a time two teams or groups had to merge their work or ways of working. What did you do to make the
      combined group effective?
    expected_concepts:
      - understanding each group's practices and reasons
      - choosing practices on merit
      - clarifying ownership and roles
      - early shared wins
      - measuring the combined group's effectiveness
    rubric:
      excellent: Compares both groups' practices fairly, chooses based on merit with input from both, clarifies ownership, creates early shared wins and shows the combined group performing well.
      good: Contributes meaningfully to integrating the groups.
      weak: Imposes one group's way of working or describes no specific actions.
    followups:
      - Which practice from the other group did you adopt?
      - What did you get wrong in the merge?
    common_errors:
      - Defaulting to their original group's practices.

  - external_key: behavioral.collaboration.practice_spread_beyond_team
    competency_key: collaboration
    topic: A collaboration practice that spread beyond your team
    difficulty: hard
    text: >-
      Tell me about a practice you introduced that improved how people collaborated beyond your own team. How did
      it spread, and how did you know it helped?
    expected_concepts:
      - the problem it addressed
      - proving it in their own team first
      - making it easy for others to adopt
      - evidence of impact across teams
    rubric:
      excellent: Explains the problem, proves the practice locally, packages it for others, describes how adoption spread and gives evidence of impact across teams.
      good: A practice adopted by at least one other team with some benefit.
      weak: A practice that stayed within their team or lacks evidence of impact.
    followups:
      - Which team didn't adopt it, and why?
      - What did other teams change about it?
    common_errors:
      - Counting adoption as success without evidence of impact.

  - external_key: behavioral.collaboration.competing_for_limited_resource
    competency_key: collaboration
    topic: Two teams competing for a scarce resource
    difficulty: hard
    text: >-
      Tell me about a time your team and another team were competing for the same limited resource, such as people,
      budget or a release slot. How did you reach an outcome both sides could accept?
    expected_concepts:
      - stating each side's need and impact
      - shared criteria tied to wider goals
      - creative options (sequencing, sharing, reducing scope)
      - involving decision makers transparently
      - relationship afterwards
    rubric:
      excellent: Frames both needs against wider goals, proposes shared criteria and creative options, involves decision makers transparently and preserves the relationship.
      good: Reaches a fair outcome through negotiation.
      weak: Wins by lobbying decision makers privately or concedes without making the case.
    followups:
      - What did your team give up?
      - How did you explain the outcome to your own team?
    common_errors:
      - Treating the other team as an opponent rather than a partner with a shared goal.

  - external_key: behavioral.collaboration.failed_partnership_reflection
    competency_key: collaboration
    topic: A cross-team partnership that failed
    difficulty: hard
    text: >-
      Tell me about a cross-team partnership that ultimately failed despite your efforts. What went wrong, what was
      within your control, and what would you do differently?
    expected_concepts:
      - the goal of the partnership
      - causes on both sides
      - what was and wasn't in their control
      - early warning signs missed
      - specific changes applied later
    rubric:
      excellent: Analyses causes on both sides, separates what they controlled from what they didn't, names missed warning signs and shows specific changes they applied in later partnerships.
      good: Reflects thoughtfully with a clear lesson.
      weak: Attributes failure entirely to the other side or to circumstances.
    followups:
      - When should you have changed course?
      - Have you since worked with that team again, and how did it go?
    common_errors:
      - Describing a failure where they bore no responsibility.
