# Behavioural questions: ownership (accountability, follow-through, owning mistakes, responsible
# initiative beyond the assigned scope). Questions ask for real past examples; evaluation is based
# only on the content of the example (actions, results, reflection), never on delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  - external_key: behavioral.ownership.status_for_dependents
    competency_key: communication
    topic: Keeping people who depend on your work informed
    difficulty: easy
    text: >-
      When other people are waiting on a piece of work you own, how do you keep them aware of where it
      stands? Give me a recent example.
    expected_concepts:
      - who depended on the work
      - how and how often they shared progress
      - flagging problems before being asked
      - adjusting updates to what each audience needed
    rubric:
      excellent: Gives a specific example with a regular, proactive update habit, raises problems before anyone asks and tailors the detail to the people depending on them.
      good: Shares progress regularly through a sensible channel.
      weak: Updates only when someone chases them.
    followups:
      - What did you do when there was nothing new to report?
    common_errors:
      - Describing a team status meeting run by someone else.

  - external_key: behavioral.ownership.overlooked_detail
    competency_key: ownership
    topic: Owning a small oversight
    difficulty: easy
    text: >-
      Tell me about a small detail you overlooked that caused a problem later on. How did you deal with it,
      and what do you do differently now?
    expected_concepts:
      - the detail and the problem it caused
      - how they found out
      - fixing the consequence
      - concrete change in their way of working
    rubric:
      excellent: Describes the oversight and its effect plainly, fixes the consequence and names a specific habit or check they adopted that has since caught similar issues.
      good: Fixes the problem and names a reasonable change.
      weak: Picks an example with no consequence, or the lesson is only to be more careful.
    followups:
      - Has the new habit caught anything since?
    common_errors:
      - Lessons that amount to "try harder".

  - external_key: behavioral.ownership.finished_last_stretch
    competency_key: ownership
    topic: Finishing the last stretch of work
    difficulty: easy
    text: >-
      A lot of work stalls in the last stretch, things like final testing, tidying up or writing things down.
      Tell me about a time you made sure that last part actually got finished.
    expected_concepts:
      - what remained and why it tended to be skipped
      - why they considered it part of done
      - how they made time for it
      - benefit that followed
    rubric:
      excellent: Explains why the final work mattered, describes how they protected time to finish it and shows a concrete benefit, such as fewer questions or problems later.
      good: Finishes the remaining work and can say why it mattered.
      weak: Cannot give a specific example, or the remaining work was skipped.
    followups:
      - Who would have noticed if you had skipped it?
    common_errors:
      - Describing finishing on time without any of the closing work.

  - external_key: behavioral.ownership.volunteered_for_new_problem
    competency_key: ownership
    topic: Volunteering to take something on
    difficulty: easy
    text: >-
      Tell me about a time a new problem or task came up in your team and you volunteered to take it. Why did
      you put your hand up, and how did it go?
    expected_concepts:
      - the problem and why it needed an owner
      - reason for volunteering
      - fitting it alongside existing work
      - outcome
    rubric:
      excellent: Explains why it needed an owner and why they were suited, shows how they balanced it with existing commitments and describes a concrete result.
      good: Volunteers and delivers a reasonable outcome.
      weak: Volunteers but the answer says little about what they did or achieved.
    followups:
      - What did you have to move to make room for it?
    common_errors:
      - Describing being assigned the task rather than choosing it.

  - external_key: behavioral.ownership.tracking_own_commitments
    competency_key: ownership
    topic: Keeping track of your commitments
    difficulty: easy
    text: >-
      How do you keep track of everything you've committed to across different people and pieces of work? Tell
      me about a time that system saved you, or let you down.
    expected_concepts:
      - a concrete tracking method
      - how commitments get captured
      - regular review of open items
      - a real example of it working or failing
    rubric:
      excellent: Describes a specific, consistently used method, explains how new commitments get into it and gives a real example, including how they improved it after a failure.
      good: Describes a workable method with an example.
      weak: Relies on memory with no example.
    followups:
      - What kinds of commitments are most likely to slip through?
    common_errors:
      - Listing tools without saying how they use them.

  - external_key: behavioral.ownership.clarified_unclear_task
    competency_key: ownership
    topic: Owning the outcome of an unclear request
    difficulty: easy
    text: >-
      Tell me about a time you were given a task with unclear instructions. What did you do to make sure you
      delivered what was actually needed?
    expected_concepts:
      - what was unclear
      - questions asked and of whom
      - confirming understanding before investing effort
      - checking in during the work
      - result
    rubric:
      excellent: Identifies the specific ambiguities, clarifies the underlying goal with the requester, confirms understanding early and checks in before delivering.
      good: Asks clarifying questions and delivers what was needed.
      weak: Guesses and delivers, then blames the instructions when it misses.
    followups:
      - How did you know you had understood the real goal?
    common_errors:
      - Waiting until delivery to find out it was wrong.

  - external_key: behavioral.ownership.planned_to_hit_deadline
    competency_key: ownership
    topic: Planning your own work to meet a deadline
    difficulty: easy
    text: >-
      Tell me about a deadline you were personally responsible for meeting. How did you plan your work to make
      sure you hit it?
    expected_concepts:
      - the deadline and what depended on it
      - breaking the work into steps
      - buffer for surprises
      - checking progress along the way
      - outcome
    rubric:
      excellent: Breaks the work into steps with checkpoints and buffer, notices drift early and adjusts, and meets the deadline or flags early why not.
      good: Plans sensibly and meets the deadline.
      weak: Describes working hard near the end with no plan.
    followups:
      - At what point would you have known you were going to miss it?
    common_errors:
      - Describing a team deadline where their own part is unclear.

  - external_key: behavioral.ownership.habit_changed_after_mistake
    competency_key: ownership
    topic: Changing how you work after a mistake
    difficulty: easy
    text: >-
      Tell me about a way of working you changed because of a mistake you made. What was the mistake, and how
      has the change worked out?
    expected_concepts:
      - the mistake and its impact
      - why it happened
      - the specific change made
      - evidence the change helped
    rubric:
      excellent: Connects a real mistake to its cause and to a specific, lasting change, with evidence that the change has prevented repeats.
      good: Describes a mistake and a reasonable change.
      weak: The change is vague or unrelated to the mistake.
    followups:
      - Have you shared that change with anyone else?
    common_errors:
      - Choosing a disguised strength instead of a real mistake.

  - external_key: behavioral.ownership.covered_colleague_area
    competency_key: collaboration
    topic: Covering a colleague's area while they were out
    difficulty: easy
    text: >-
      Tell me about a time you were covering a colleague's work while they were out, and something came up in
      their area. How did you handle it?
    expected_concepts:
      - what came up and how urgent it was
      - using available notes or context
      - deciding what to handle now and what to leave
      - handing back with a clear record
    rubric:
      excellent: Handles what was urgent, leaves non-urgent decisions to the owner, and hands back a clear record of what they did and why.
      good: Deals with the issue sensibly and briefs the colleague on their return.
      weak: Leaves it all waiting or makes large changes without recording them.
    followups:
      - What did you tell your colleague when they got back?
    common_errors:
      - Making decisions that should have waited for the owner.

  - external_key: behavioral.ownership.saw_improvement_action_through
    competency_key: ownership
    topic: Seeing improvement actions through to the end
    difficulty: medium
    text: >-
      After something went wrong, tell me about an improvement you committed to and actually saw all the way
      through. What got in the way, and how did you stop it from quietly being dropped?
    expected_concepts:
      - the incident or problem behind it
      - the committed improvement
      - competing priorities that threatened it
      - how they kept it visible
      - completion and effect
    rubric:
      excellent: Names a specific improvement, explains the competing pressures, describes how they kept it visible and prioritised, and shows it was completed and had an effect.
      good: Completes the improvement despite some obstacles.
      weak: The improvement was agreed but never finished.
    followups:
      - How many improvement actions from that review were finished?
    common_errors:
      - Counting the agreement as the result.

  - external_key: behavioral.ownership.delivered_but_disappointed
    competency_key: ownership
    topic: Owning a disappointing result
    difficulty: medium
    text: >-
      Tell me about a piece of work you delivered that didn't get the result you or others had hoped for. How
      did you explain that to the people involved, and what did you do next?
    expected_concepts:
      - expected versus actual result
      - analysis of why it fell short
      - clear communication of the result
      - next steps taken
    rubric:
      excellent: Reports the shortfall plainly with evidence, analyses why it fell short including their own part, and takes concrete next steps that improved the outcome or later work.
      good: Explains the shortfall and proposes reasonable next steps.
      weak: Reframes the result as a success or blames external factors only.
    followups:
      - What would you have needed to know earlier to change the outcome?
    common_errors:
      - Avoiding stating the shortfall directly.

  - external_key: behavioral.ownership.dependency_not_delivering
    competency_key: collaboration
    topic: Protecting your outcome when someone else isn't delivering
    difficulty: medium
    text: >-
      Tell me about a time something you were responsible for depended on someone else who wasn't delivering.
      What did you do to protect your outcome without simply blaming them?
    expected_concepts:
      - the dependency and its impact
      - understanding why they weren't delivering
      - direct conversation and joint plan
      - fallback options
      - escalation if needed
    rubric:
      excellent: Understands the other side's constraints, agrees a joint plan, prepares a fallback and escalates constructively only if needed, keeping their own outcome on track.
      good: Raises it directly and finds a workable path.
      weak: Waits, then reports the other party as the reason for failure.
    followups:
      - What was your fallback if they didn't come through?
    common_errors:
      - Escalating before talking to the person directly.

  - external_key: behavioral.ownership.pushed_back_to_protect_commitments
    competency_key: ownership
    topic: Declining new work to protect existing commitments
    difficulty: medium
    text: >-
      Describe a time you pushed back on a new request because taking it on would have put your existing
      commitments at risk. How did you handle that conversation?
    expected_concepts:
      - the new request and the existing commitments
      - assessing the real trade-off
      - offering alternatives such as later timing or another person
      - outcome for both pieces of work
    rubric:
      excellent: Makes the trade-off explicit, offers concrete alternatives, involves whoever sets priorities when needed and keeps the existing commitments intact.
      good: Explains the conflict and reaches a reasonable agreement.
      weak: Simply refuses, or accepts and lets something slip.
    followups:
      - Who decided in the end, and how?
    common_errors:
      - Treating saying no as the goal rather than the commitments.

  - external_key: behavioral.ownership.fixed_slow_process
    competency_key: ownership
    topic: Owning a process improvement end to end
    difficulty: medium
    text: >-
      Tell me about a process at work that was slowing people down and that you took it on yourself to
      improve. How did you get people to adopt the change, and how did you know it worked?
    expected_concepts:
      - the process and its cost
      - designing the change with the people affected
      - rollout and adoption
      - measuring the effect
    rubric:
      excellent: Quantifies the original cost, involves the people affected, drives adoption and measures a clear improvement afterwards.
      good: Implements an improvement that people used, with some evidence.
      weak: Proposes an improvement but there is no adoption or measured result.
    followups:
      - Who resisted the change, and why?
    common_errors:
      - Describing the idea without the adoption.

  - external_key: behavioral.ownership.without_manager_direction
    competency_key: adaptability
    topic: Keeping important work moving without direction
    difficulty: medium
    text: >-
      Tell me about a time you had to keep important work moving without clear direction from your manager,
      for example during a reorganisation or while they were unavailable. How did you decide what to do?
    expected_concepts:
      - what was at stake
      - how they worked out priorities
      - decisions they made and those they deferred
      - keeping relevant people informed
      - result
    rubric:
      excellent: Uses the known goals to set priorities, makes reversible decisions themselves, defers the ones that needed authority and documents choices for later review.
      good: Keeps the work going with sensible priorities.
      weak: Waits for direction or makes significant decisions without informing anyone.
    followups:
      - Which decision did you deliberately not make yourself?
    common_errors:
      - Describing a period where nothing important was at stake.

  - external_key: behavioral.ownership.escalated_at_right_time
    competency_key: ownership
    topic: Escalating a problem effectively
    difficulty: medium
    text: >-
      Tell me about a time you had to escalate a problem above your own level. How did you decide it was time,
      and how did you present it so that it led to action?
    expected_concepts:
      - the problem and what they had already tried
      - threshold for escalating
      - clear framing with impact and options
      - what they asked for
      - result
    rubric:
      excellent: Escalates after a reasonable attempt at their level, presents impact, options and a specific ask, and stays involved until it is resolved.
      good: Escalates clearly and gets a useful response.
      weak: Escalates by passing the problem up without context or a request.
    followups:
      - What did you do while waiting for a response?
    common_errors:
      - Treating escalation as handing off responsibility.

  - external_key: behavioral.ownership.mistake_cost_teammate_time
    competency_key: collaboration
    topic: Owning a mistake that created work for a teammate
    difficulty: medium
    text: >-
      Tell me about a time a mistake of yours created extra work for a teammate. How did you handle it with
      them?
    expected_concepts:
      - the mistake and the work it caused
      - acknowledging it to the teammate directly
      - taking on the clean-up where possible
      - preventing a repeat
    rubric:
      excellent: Acknowledges the mistake to the teammate directly, takes on as much of the clean-up as they can and makes a change so it does not happen again.
      good: Acknowledges it and helps fix the consequences.
      weak: Lets the teammate absorb the extra work without addressing it.
    followups:
      - How did it affect how you worked together afterwards?
    common_errors:
      - Focusing on how the teammate reacted rather than on their own actions.

  - external_key: behavioral.ownership.removed_single_point_knowledge
    competency_key: ownership
    topic: Removing dependence on one person's knowledge
    difficulty: medium
    text: >-
      Tell me about a time important knowledge existed only in one person's head, maybe your own. What did you
      do so the team no longer depended on that one person?
    expected_concepts:
      - the knowledge and the risk
      - documentation or recorded walkthroughs
      - pairing or rotating the work
      - checking someone else could do it
    rubric:
      excellent: Spreads the knowledge through written material and hands-on practice, then confirms someone else can actually do the work unaided.
      good: Documents the knowledge and walks others through it.
      weak: Writes something down once without checking it was usable.
    followups:
      - How did you check someone else could really do it?
    common_errors:
      - Treating a document nobody has tested as enough.

  - external_key: behavioral.ownership.kept_follow_up_promise
    competency_key: ownership
    topic: Keeping a follow-up promise that got harder
    difficulty: medium
    text: >-
      Tell me about a time you promised a customer or internal user that you would follow up, and keeping that
      promise turned out to be harder than expected. What did you do?
    expected_concepts:
      - the promise and why it became hard
      - interim updates to the person
      - effort to deliver what was promised
      - adjusting the promise openly if needed
    rubric:
      excellent: Keeps the person informed as it gets harder, works through the obstacles and, where the original promise cannot be met, agrees an alternative openly rather than going quiet.
      good: Delivers the follow-up despite the difficulty.
      weak: Lets the follow-up lapse.
    followups:
      - What would you promise differently now?
    common_errors:
      - Choosing an example where the follow-up was easy.

  - external_key: behavioral.ownership.found_own_work_degraded
    competency_key: ownership
    topic: Noticing your earlier work stopped working
    difficulty: medium
    text: >-
      Tell me about a time you noticed that something you had delivered earlier was no longer working as
      intended, before anyone complained. How did you find out, and what did you do?
    expected_concepts:
      - how they noticed
      - investigation of the cause
      - fix and communication to users
      - ongoing checks added
    rubric:
      excellent: Notices through deliberate checking, fixes it, informs the people affected and adds a way to detect the same problem automatically or routinely.
      good: Notices and fixes the problem.
      weak: Only found out through a complaint, or did not fix it.
    followups:
      - Why do you think nobody else had noticed?
    common_errors:
      - Describing a bug reported by someone else.

  - external_key: behavioral.ownership.committed_to_decision_disagreed_with
    competency_key: ownership
    topic: Owning delivery of a decision you disagreed with
    difficulty: hard
    text: >-
      Tell me about a time you had to deliver an outcome based on a decision you disagreed with. How did you
      commit to making it work, and what did you do when problems appeared?
    expected_concepts:
      - their disagreement and how they raised it
      - committing fully after the decision
      - delivering in good faith
      - raising problems with evidence rather than blame
      - outcome and reflection
    rubric:
      excellent: Raises the disagreement through the right channel, then commits fully, and when problems appear reports them with evidence and options rather than as proof they were right.
      good: Delivers on the decision and raises problems constructively.
      weak: Delivers half-heartedly or uses the problems to reopen the argument.
    followups:
      - Did it turn out the way you expected?
    common_errors:
      - Turning the answer into a case for why the decision was wrong.

  - external_key: behavioral.ownership.recommended_stopping_own_work
    competency_key: ownership
    topic: Recommending stopping your own work
    difficulty: hard
    text: >-
      Tell me about a time you recommended stopping or significantly scaling back work you were responsible
      for, because it no longer made sense. How did you reach that view, and how did you make the case?
    expected_concepts:
      - what changed to make the work no longer worthwhile
      - evidence gathered
      - separating sunk cost from future value
      - presenting the recommendation
      - wrapping up responsibly
    rubric:
      excellent: Uses evidence to show the future value no longer justified the cost, makes the case clearly despite their investment and winds the work down responsibly, keeping what was useful.
      good: Recommends stopping with reasonable evidence.
      weak: Continued until told to stop, or the example lacks a real decision.
    followups:
      - What did you salvage from the work?
    common_errors:
      - Describing work that was cancelled by others.

  - external_key: behavioral.ownership.fixed_problem_across_teams
    competency_key: ownership
    topic: Fixing a recurring cross-team problem at the system level
    difficulty: hard
    text: >-
      Describe a problem that kept coming back across several teams that you took on and fixed at the system
      level. How did you get others involved, and how did you make the fix last?
    expected_concepts:
      - pattern seen across teams
      - evidence that it was systemic
      - getting buy-in from the teams
      - the systemic fix
      - mechanism that keeps it fixed
    rubric:
      excellent: Shows evidence of a systemic pattern, brings the teams into the solution, delivers a fix that changes the system and leaves a named owner or check that keeps it fixed.
      good: Fixes a cross-team problem with the other teams' involvement.
      weak: Fixes it only in their own area, or the fix depended on everyone remembering.
    followups:
      - How do you know it has not come back?
    common_errors:
      - Describing a one-team fix as cross-team.

  - external_key: behavioral.ownership.accountable_for_others_work
    competency_key: ownership
    topic: Being accountable for a result built by others
    difficulty: hard
    text: >-
      Tell me about a time you were accountable for a result that depended on other people's work, and part of
      it went wrong. How did you handle that accountability, both with the people above you and with the people
      who did the work?
    expected_concepts:
      - their accountability and the failure
      - owning the result to those above without passing blame down
      - working with contributors to fix it
      - changes to how they oversee shared work
    rubric:
      excellent: Owns the outcome upward without naming others as the cause, works with the contributors on a fix and changes how they set expectations and check shared work.
      good: Takes responsibility and fixes the problem with the people involved.
      weak: Passes the blame to the people who did the work.
    followups:
      - What did you change in how you check work you are accountable for?
    common_errors:
      - Saying they were not really responsible because others did the work.

  - external_key: behavioral.ownership.shortcut_consequences
    competency_key: ownership
    topic: Owning the consequences of a shortcut
    difficulty: hard
    text: >-
      Tell me about a shortcut you took, or agreed to, that later caused real problems. How did you take
      responsibility for the consequences, and what did you change afterwards?
    expected_concepts:
      - the shortcut and why it seemed reasonable
      - consequences and who they affected
      - owning and fixing the consequences
      - how they now judge shortcuts
    rubric:
      excellent: Explains the original reasoning without excuses, takes the lead on fixing the consequences and describes a concrete way they now decide on and record shortcuts.
      good: Owns the consequences and draws a sensible lesson.
      weak: Defends the shortcut or blames the pressure that led to it.
    followups:
      - How do you now decide whether a shortcut is acceptable?
    common_errors:
      - Concluding that shortcuts should never be taken.
