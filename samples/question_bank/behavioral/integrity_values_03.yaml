# Behavioural: integrity and working values (part 3 of 4) - accurate handovers and self-reporting,
# respecting colleagues and resources, outside interests, incident candour and leading by example.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ accurate self-reporting
  - external_key: behavioral.integrity_values.marking_work_done
    competency_key: culture_values
    topic: Calling work done when it isn't quite
    difficulty: easy
    text: >-
      Tell me about a time you were close to a deadline and could have marked a task as complete even though
      some of it wasn't really finished. How did you report where it actually stood?
    expected_concepts:
      - what was finished and what was not
      - reporting the real state rather than a convenient one
      - making the remaining work visible, for example as a follow-up item
      - agreeing with stakeholders whether the gap was acceptable
    rubric:
      excellent: Describes reporting the exact state, making the remaining work visible and tracked, and agreeing with the stakeholder whether the partial delivery was acceptable.
      good: Reports the task as incomplete and explains what remains.
      weak: Marks it done and finishes it quietly later, or sees no problem with doing so.
    followups:
      - Who needed to know about the unfinished part?
      - What does "done" mean to you on a team?
    common_errors:
      - Treating "done except for testing" as done.

  - external_key: behavioral.integrity_values.skipped_process_admission
    competency_key: culture_values
    topic: Admitting you skipped an agreed process
    difficulty: easy
    text: >-
      Describe a time you didn't follow an agreed process, maybe because you forgot or thought it didn't matter
      that time, and you later had to own up to it. What did you do?
    expected_concepts:
      - which step was skipped and why
      - telling the relevant people without being asked
      - checking whether any harm resulted and fixing it
      - preventing a repeat, for example with a checklist or automation
    rubric:
      excellent: Volunteers the lapse to the right people, checks for and fixes any consequences, and adds a concrete safeguard so it does not recur.
      good: Owns the lapse and fixes any resulting problem.
      weak: Admits it only when caught, or explains it away.
    followups:
      - Did anyone else know before you told them?
      - What made it easy to skip that step?
    common_errors:
      - Arguing the process was pointless instead of owning the lapse.

  - external_key: behavioral.integrity_values.own_part_in_retrospective
    competency_key: culture_values
    topic: Naming your own part in a retrospective
    difficulty: easy
    text: >-
      In a retrospective or post-incident review, what's an example of a time you openly described your own
      contribution to something that went wrong? How did you frame it?
    expected_concepts:
      - the event and their specific contribution
      - describing it factually in front of the group
      - focusing on contributing conditions and system fixes
      - following through on resulting actions
    rubric:
      excellent: Describes stating their own contribution factually in front of the group, linking it to systemic causes, and following through on a concrete action.
      good: Acknowledges their part and contributes to the actions.
      weak: Describes only others' contributions, or treats the review as a blame exercise.
    followups:
      - How did naming your part change the discussion?
      - Which action from that review did you own?
    common_errors:
      - Over-apologising without moving to what should change.

  - external_key: behavioral.integrity_values.accurate_handover_notes
    competency_key: culture_values
    topic: Leaving an accurate handover
    difficulty: easy
    text: >-
      When you've handed over a project or responsibility to someone else, how have you made sure they knew
      about the problems and loose ends, not just the good parts? Tell me about a specific handover.
    expected_concepts:
      - listing known issues, risks and unfinished work explicitly
      - walking the new owner through them rather than just sending a document
      - being available for questions afterwards
      - not leaving surprises for the next person
    rubric:
      excellent: Describes a handover that explicitly listed known problems and risks, a walkthrough with the new owner, and availability afterwards, with evidence the new owner was not surprised.
      good: Provides a handover that includes known issues.
      weak: Hands over only the positives, or leaves without a proper handover.
    followups:
      - What was the most awkward thing you had to include?
      - Did anything come up later that you'd missed?
    common_errors:
      - Assuming the code or tickets speak for themselves.

  - external_key: behavioral.integrity_values.transparent_estimates
    competency_key: culture_values
    topic: Being open about buffers in estimates
    difficulty: easy
    text: >-
      How do you handle uncertainty when you give estimates for your work? Tell me about a time you had to
      decide whether to quietly pad an estimate or be open about the risk.
    expected_concepts:
      - sources of uncertainty in the estimate
      - making buffers or ranges explicit instead of hidden
      - explaining assumptions and risks
      - updating the estimate as facts changed
    rubric:
      excellent: Describes making uncertainty explicit through ranges or named risks, explaining assumptions to stakeholders, and updating the estimate when facts changed.
      good: Shares the risk behind the estimate rather than hiding a buffer.
      weak: Pads estimates silently as standard practice, or gives single-point estimates with no caveats.
    followups:
      - How did stakeholders react to a range instead of a date?
      - What did you do when the buffer turned out to be unnecessary?
    common_errors:
      - Treating hidden padding as harmless because it always gets used.

  # ------------------------------------------------------------ respecting colleagues and resources
  - external_key: behavioral.integrity_values.colleague_personal_information
    competency_key: culture_values
    topic: Coming across a colleague's personal information
    difficulty: easy
    text: >-
      Tell me about a time you came across personal or sensitive information about a colleague, such as a
      performance review, pay details or a private message left visible. What did you do with it?
    expected_concepts:
      - recognising the information was private
      - not reading further or sharing it
      - alerting the owner discreetly so it could be secured
      - keeping it confidential afterwards
    rubric:
      excellent: Stops reading, keeps it to themselves, discreetly alerts the person or owner so it is secured, and explains why discretion mattered.
      good: Does not share it and lets the owner know.
      weak: Mentions it to others, or uses the information.
    followups:
      - How did you let the owner know without drawing attention to it?
      - What would you do if a colleague started talking about it?
    common_errors:
      - Sharing it with one trusted colleague "just to check".

  - external_key: behavioral.integrity_values.company_resources_personal_use
    competency_key: culture_values
    topic: Using company time or resources appropriately
    difficulty: easy
    text: >-
      Tell me about a time you had to think about where the line was between personal use and work use of
      company time, equipment or accounts. What did you decide and why?
    expected_concepts:
      - the specific situation
      - checking the relevant policy
      - considering cost, security and fairness to the employer
      - acting within the policy or asking when unclear
    rubric:
      excellent: Describes a concrete situation, checks the policy, weighs cost and security implications, and acts within the guidance or asks for clarity.
      good: Follows the policy and explains the reasoning.
      weak: Assumes anything is fine if nobody objects, or gives no example.
    followups:
      - Where was the policy unclear?
      - How would you handle a colleague who used resources heavily for personal projects?
    common_errors:
      - Judging only by whether anyone would notice.

  - external_key: behavioral.integrity_values.rumour_about_colleague
    competency_key: culture_values
    topic: Handling gossip about a colleague
    difficulty: easy
    text: >-
      Describe a time colleagues were spreading a rumour or speculation about someone on the team. What did you
      do in that situation?
    expected_concepts:
      - the nature of the rumour and its potential harm
      - not repeating or adding to it
      - redirecting the conversation or saying it was unfair
      - raising it with a manager if it was damaging
    rubric:
      excellent: Describes not participating, redirecting or challenging the conversation in the moment, and raising it with a manager when it risked real harm to the person.
      good: Declines to take part and discourages it.
      weak: Joins in or stays silent while it spreads.
    followups:
      - What did you say in the moment?
      - When would something like that need a manager's attention?
    common_errors:
      - Considering silence a neutral choice.

  - external_key: behavioral.integrity_values.accurate_reference_for_colleague
    competency_key: culture_values
    topic: Giving an accurate recommendation
    difficulty: medium
    text: >-
      Have you been asked to recommend a former colleague or teammate for a role, a project or a promotion when
      you had real reservations about their work? Tell me how you handled it.
    expected_concepts:
      - the reservations and the evidence behind them
      - declining or limiting the recommendation where appropriate
      - giving accurate, job-related input instead of a blanket endorsement
      - telling the colleague directly what they could support
    rubric:
      excellent: Describes giving accurate, evidence-based input limited to what they could stand behind, and being open with the colleague about the scope of their support.
      good: Gives a balanced recommendation based on actual work.
      weak: Gives an unreserved endorsement to avoid awkwardness, or makes vague negative remarks.
    followups:
      - What did you tell the colleague?
      - How do you keep a reference job-related?
    common_errors:
      - Overstating praise because saying no felt awkward.

  # ------------------------------------------------------------ errors in your favour and customer trust
  - external_key: behavioral.integrity_values.error_in_your_favour
    competency_key: culture_values
    topic: An error that favoured you or your company
    difficulty: medium
    text: >-
      Tell me about a time you discovered an error that worked in your favour or your company's, such as a
      customer being overcharged or a partner underpaid, and nobody else had noticed. What did you do?
    expected_concepts:
      - how the error was found and its size
      - raising it internally even though it benefited the company
      - making sure the affected party was told and made whole
      - finding and fixing the cause
    rubric:
      excellent: Describes raising the error promptly, pushing for the affected party to be informed and corrected, fixing the root cause, and handling any internal reluctance.
      good: Raises it internally and gets it corrected.
      weak: Leaves it because it benefited the company, or waits to see if anyone notices.
    followups:
      - Did anyone suggest leaving it alone?
      - How was the affected customer or partner told?
    common_errors:
      - Correcting it going forward without addressing past impact.

  - external_key: behavioral.integrity_values.customer_asks_to_bypass_policy
    competency_key: culture_values
    topic: A customer asking you to skip a rule
    difficulty: medium
    text: >-
      Describe a time a customer, client or user asked you to do something that went against policy, like skip a
      verification step or share another person's information. How did you handle the request?
    expected_concepts:
      - the request and the policy involved
      - why the policy protected the customer or others
      - declining clearly while offering what they could do
      - escalating or documenting if pressure continued
    rubric:
      excellent: Declines clearly with a reason the customer could understand, offers a legitimate alternative, handles escalation or pressure appropriately, and keeps the relationship intact.
      good: Declines and explains the policy.
      weak: Grants the request to keep the customer happy, or declines without any help.
    followups:
      - What did the customer say when you declined?
      - What alternative did you offer?
    common_errors:
      - Believing customer satisfaction justifies the exception.

  - external_key: behavioral.integrity_values.incident_disclosure_candour
    competency_key: culture_values
    topic: Candour in incident communications
    difficulty: medium
    text: >-
      Tell me about a time you were involved in communicating an incident or failure to customers or leadership.
      How did you decide how much to say about what went wrong and why?
    expected_concepts:
      - the incident and its impact
      - stating impact and cause accurately without spin
      - balancing candour with what was confirmed at the time
      - committing to and reporting on follow-up actions
      - resisting pressure to downplay
    rubric:
      excellent: Describes a communication that stated impact and cause plainly, separated confirmed facts from investigation, committed to specific actions, and handled any pressure to downplay.
      good: Communicates impact and cause accurately with follow-up actions.
      weak: Describes downplaying impact or vague wording chosen to avoid accountability.
    followups:
      - Was there anything you wanted to include that others wanted left out?
      - How did you update people as you learned more?
    common_errors:
      - Using vague language like "some users may have experienced issues" when the impact was known.

  - external_key: behavioral.integrity_values.supplier_cutting_corners
    competency_key: culture_values
    topic: A partner or supplier not meeting its obligations
    difficulty: medium
    text: >-
      Tell me about a time you found out that a vendor, contractor or partner you worked with wasn't doing what
      they had committed to, in a way that could affect your customers or obligations. What did you do?
    expected_concepts:
      - evidence of the gap
      - raising it with the supplier directly
      - informing internal owners such as procurement, legal or security
      - assessing and mitigating impact on customers
      - follow-up to ensure correction
    rubric:
      excellent: Gathers evidence, raises it with the supplier and the internal owners, assesses and mitigates impact on customers, and follows through until the gap is fixed.
      good: Raises the gap with the supplier and internal owners.
      weak: Lets it go to protect the relationship, or complains without acting.
    followups:
      - Who inside your organisation needed to know?
      - What did you do about the impact that had already happened?
    common_errors:
      - Assuming the supplier's compliance was someone else's responsibility.

  - external_key: behavioral.integrity_values.regulatory_requirement_inconvenient
    competency_key: culture_values
    topic: Meeting a legal or regulatory requirement under pressure
    difficulty: medium
    text: >-
      Describe a time a legal, regulatory or contractual requirement made your work slower or more expensive.
      How did you handle the pressure to cut corners on it?
    expected_concepts:
      - the requirement and why it applied
      - understanding its purpose rather than just the wording
      - finding the most efficient compliant approach
      - involving legal or compliance when interpretation was unclear
      - result
    rubric:
      excellent: Explains the requirement's purpose, finds an efficient way to meet it, involves specialists where interpretation was unclear, and resists pressure to cut corners with clear reasoning.
      good: Meets the requirement and explains its importance to others.
      weak: Treats the requirement as an obstacle to minimise, or interprets it loosely without advice.
    followups:
      - Where did you get advice on interpreting it?
      - How did you explain the delay to stakeholders?
    common_errors:
      - Choosing the most convenient interpretation without checking.

  # ------------------------------------------------------------ outside interests and confidential knowledge
  - external_key: behavioral.integrity_values.outside_work_disclosure
    competency_key: culture_values
    topic: Side projects and outside work
    difficulty: medium
    text: >-
      If you've done side projects, freelancing or other outside work while employed, how did you make sure it
      didn't conflict with your main job? Tell me about the steps you took.
    expected_concepts:
      - checking the employment agreement and policies
      - disclosing where required
      - keeping time, equipment and confidential information separate
      - avoiding competing work or clients
    rubric:
      excellent: Describes checking the agreement, disclosing as required, keeping time, equipment and information clearly separate, and avoiding any competing interest.
      good: Checks the policy and keeps the work separate.
      weak: Did not consider conflicts, or used employer resources for outside work.
    followups:
      - What would you do if a client of the side project overlapped with your employer?
      - Who did you check with?
    common_errors:
      - Assuming that outside work done off-hours never needs disclosure.

  - external_key: behavioral.integrity_values.competitor_confidential_material
    competency_key: culture_values
    topic: Receiving a competitor's confidential material
    difficulty: medium
    text: >-
      Imagine a document clearly belonging to a competitor, like a pricing sheet or roadmap, lands in your inbox
      or is offered by a new hire. Have you faced anything like this, and how did you or would you handle it?
    expected_concepts:
      - not reading further or circulating it
      - informing legal or the appropriate manager
      - following guidance on deleting or returning it
      - explaining to the sender why it can't be used
    rubric:
      excellent: Stops at once, informs legal or the right manager, follows their guidance on handling the material, and explains to the sender why it cannot be used.
      good: Does not use the material and reports it.
      weak: Reads or shares it because it arrived unsolicited, or sees it as a competitive opportunity.
    followups:
      - What would you say to a new colleague who offered it?
      - Why does it matter if you didn't ask for it?
    common_errors:
      - Believing unsolicited information is fair to use.

  - external_key: behavioral.integrity_values.unfair_advantage_request
    competency_key: culture_values
    topic: A friend asking for an unfair advantage
    difficulty: medium
    text: >-
      Tell me about a time a friend or former colleague asked you for something that would give them an unfair
      edge, like inside information about a hiring process, a tender or an upcoming decision. How did you
      respond?
    expected_concepts:
      - what was requested and why it was unfair
      - declining clearly
      - offering legitimate help instead, such as public information or a proper referral
      - disclosing their connection if they were involved in the decision
    rubric:
      excellent: Declines clearly, offers only legitimate help, discloses the relationship where they had a role in the decision, and explains why fairness to others mattered.
      good: Declines and limits help to what was legitimate.
      weak: Shares some inside information as a favour, or sees no issue.
    followups:
      - How did the friendship hold up afterwards?
      - Did you tell anyone at work about the request?
    common_errors:
      - Sharing "just general hints" that still gave an advantage.

  # ------------------------------------------------------------ disagreement and transparency
  - external_key: behavioral.integrity_values.disagree_then_commit_openly
    competency_key: culture_values
    topic: Supporting a decision you argued against
    difficulty: medium
    text: >-
      Tell me about a time your team or manager made a decision you argued against. How did you carry it out,
      and how did you talk about it to others afterwards?
    expected_concepts:
      - their original position and reasoning
      - making the disagreement clear before the decision
      - committing fully to execution once decided
      - not undermining the decision with others
      - revisiting through proper channels if new evidence appeared
    rubric:
      excellent: Describes arguing their case openly beforehand, executing the decision fully, representing it fairly to others, and raising new evidence through proper channels if it emerged.
      good: Voices disagreement and then supports the decision.
      weak: Carries it out half-heartedly, or criticises it to others while appearing to comply.
    followups:
      - How did you explain the decision to people who asked about it?
      - Did you turn out to be right or wrong, and what did you do then?
    common_errors:
      - Quietly working around the decision.

  - external_key: behavioral.integrity_values.cant_share_but_wont_mislead
    competency_key: culture_values
    topic: When you can't share information but won't mislead
    difficulty: medium
    text: >-
      Describe a time you knew something confidential, like an upcoming reorganisation or a deal, and someone
      asked you about it directly. How did you respond without misleading them?
    expected_concepts:
      - the confidential information and why it was restricted
      - declining to share without denying or inventing a cover story
      - acknowledging that they couldn't discuss it
      - pointing to when or how information would be shared
    rubric:
      excellent: Describes declining without denying or deceiving, being clear that they could not discuss it, and pointing to when information would be available, while protecting the confidence.
      good: Keeps the confidence without lying.
      weak: Lies to protect the information, or leaks hints.
    followups:
      - What exact words did you use?
      - How did the person react?
    common_errors:
      - Believing a flat denial is acceptable to protect a secret.

  # ------------------------------------------------------------ leading by example
  - external_key: behavioral.integrity_values.high_performer_rule_break
    competency_key: leadership
    topic: Holding a strong performer to the same standard
    difficulty: hard
    text: >-
      If you've led people, tell me about a time a high-performing team member broke an important rule or
      norm. How did you handle it, given how much the team relied on them?
    expected_concepts:
      - the rule and the impact of the breach
      - gathering facts and hearing their side
      - applying the same standard as for anyone else
      - clear conversation with expectations and consequences
      - effect on the rest of the team's trust in fairness
    rubric:
      excellent: Describes establishing the facts, holding the person to the same standard as anyone else despite their value, a clear conversation with expectations and follow-up, and attention to the team's perception of fairness.
      good: Addresses the breach directly with the person and sets expectations.
      weak: Lets it slide because of their performance, or handles it inconsistently.
    followups:
      - How did the rest of the team know it had been dealt with?
      - What would you have done with a newer team member?
    common_errors:
      - Choosing a minor rule to avoid the real dilemma.

  - external_key: behavioral.integrity_values.team_hiding_problem
    competency_key: culture_values
    topic: When your own team wants to hide a problem
    difficulty: hard
    text: >-
      Tell me about a time your own team, people you liked and relied on, wanted to keep a problem from
      leadership or another team. What did you do, and how did you handle the tension with your team?
    expected_concepts:
      - the problem and who needed to know
      - understanding why the team wanted it hidden
      - persuading the team to disclose it together
      - disclosing anyway if the team refused and the stakes were high
      - impact on team trust and on the problem itself
    rubric:
      excellent: Describes understanding the team's reasons, persuading them to disclose jointly with a plan, being prepared to disclose anyway when stakes required it, and reflects on the effect on trust.
      good: Pushes the team to disclose and gets it surfaced.
      weak: Goes along with hiding it out of loyalty, or discloses without first talking to the team.
    followups:
      - What would you have done if they refused?
      - How did it affect your standing in the team?
    common_errors:
      - Treating loyalty to the team as more important than people affected by the problem.

  - external_key: behavioral.integrity_values.right_choice_personal_cost
    competency_key: culture_values
    topic: Doing the right thing at a personal cost
    difficulty: hard
    text: >-
      Tell me about a decision at work where doing what you believed was right cost you something, such as a
      missed bonus target, a strained relationship with a senior person or a lost opportunity. Why did you
      choose it?
    expected_concepts:
      - the choice and what was at stake for them
      - the principle or reasoning behind the decision
      - alternatives considered
      - outcome for the organisation and for them
      - whether they would choose the same again
    rubric:
      excellent: Describes a real cost, explains the reasoning and alternatives considered, shows the benefit to customers or the organisation, and reflects candidly on whether they would choose the same again.
      good: Gives a real example with a clear reason and outcome.
      weak: Gives an example with no real cost, or a hypothetical.
    followups:
      - What did it cost you in practice?
      - Would you do anything differently?
    common_errors:
      - Picking an example where the right thing was also the easy thing.

  - external_key: behavioral.integrity_values.safe_to_report_bad_news
    competency_key: leadership
    topic: Making it safe to bring bad news
    difficulty: hard
    text: >-
      What have you personally done to make it easier for people around you to report mistakes or bad news
      early? Tell me about a specific situation where that paid off.
    expected_concepts:
      - concrete practices such as blameless reviews or modelling their own mistakes
      - how they reacted when someone brought bad news
      - removing penalties for early disclosure
      - a specific case where early reporting prevented harm
    rubric:
      excellent: Describes specific practices they introduced or modelled, how they responded to bad news in practice, and a concrete case where early reporting changed the outcome.
      good: Describes practices that encourage reporting with an example.
      weak: Speaks in general terms about open culture with no actions or example.
    followups:
      - How did you respond the first time someone brought you a serious mistake?
      - How would you know if people were still hiding problems?
    common_errors:
      - Claiming an open-door policy without evidence it was used.

  - external_key: behavioral.integrity_values.inherited_misleading_practice
    competency_key: culture_values
    topic: Inheriting a practice that wasn't quite right
    difficulty: medium
    text: >-
      Tell me about a time you took over a role or process and found it relied on a practice that wasn't quite
      right, like a misleading report, an unapproved workaround or a promise nobody could keep. What did you do
      about it?
    expected_concepts:
      - what they found and its impact
      - understanding how and why it had developed
      - raising it with their manager or stakeholders rather than continuing it
      - transitioning to a correct practice with minimal disruption
    rubric:
      excellent: Describes understanding the history, raising it openly rather than continuing it, and leading a planned transition to a correct practice with stakeholders informed.
      good: Stops the practice and replaces it with a proper one.
      weak: Continues it because it was inherited, or criticises the predecessor without fixing it.
    followups:
      - How did you raise it without blaming the person before you?
      - Who was affected by the change?
    common_errors:
      - Assuming that inherited practices are someone else's responsibility.

  - external_key: behavioral.integrity_values.legal_but_questionable_direction
    competency_key: culture_values
    topic: A direction that was legal but felt wrong
    difficulty: hard
    text: >-
      Tell me about a time the organisation chose a direction that was within the rules but that you believed
      was wrong for customers or employees. How did you decide what part to play in carrying it out?
    expected_concepts:
      - the decision and why it troubled them
      - checking whether they had the full context
      - making their view known through appropriate channels
      - deciding how to act within their role, including limits they set
      - outcome and reflection
    rubric:
      excellent: Describes seeking the full context, stating their position through appropriate channels with reasoning, choosing a clear and defensible course for their own role, and reflects on the outcome.
      good: Raises their view and acts deliberately within their role.
      weak: Complies without question, or resists covertly rather than openly.
    followups:
      - What information changed or confirmed your view?
      - Where would your own line have been?
    common_errors:
      - Describing a disagreement about strategy rather than one about doing right by people.
