# Behavioural: collaboration (part 3 of 4) - remote, hybrid and distributed collaboration.
# Evaluation is based only on the content of the example, never on personality, emotion or
# delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------------------------- easy
  - external_key: behavioral.collaboration.remote_progress_updates
    competency_key: communication
    topic: Keeping a remote team informed of progress
    difficulty: easy
    text: >-
      When you've worked remotely or on different schedules from your teammates, how did you keep them informed
      about your progress? Walk me through a recent example.
    expected_concepts:
      - regular written updates in a shared place
      - surfacing blockers and risks, not just activity
      - matching the level of detail to the audience
      - making work visible (boards, drafts, demos)
    rubric:
      excellent: Describes a consistent habit with a concrete example, explains how updates highlighted blockers and decisions rather than activity, and shows teammates acted on them.
      good: Gives a real routine for keeping teammates informed.
      weak: Relies on others asking for status or describes no specific practice.
    followups:
      - How did you decide what was worth writing down?
      - What did you do when nobody seemed to read the updates?
    common_errors:
      - Reporting activity instead of progress and blockers.

  - external_key: behavioral.collaboration.time_zone_handovers
    competency_key: collaboration
    topic: Handing work across time zones
    difficulty: easy
    text: >-
      Tell me about a time you worked with colleagues several time zones away. How did you arrange handovers so
      work didn't stall while one side was offline?
    expected_concepts:
      - end-of-day handover notes
      - clear next actions and decision rights
      - overlap hours used for discussion
      - unblocking the other side before going offline
    rubric:
      excellent: Describes a concrete handover practice with clear next actions and decision rights, use of overlap time and an example where it prevented a lost day.
      good: Gives a workable approach with a real example.
      weak: Describes waiting for the other side to come online as the normal approach.
    followups:
      - What went wrong with a handover, and what did you change?
      - What decisions could the other side make without you?
    common_errors:
      - Leaving questions for the other side without the context needed to answer them.

  - external_key: behavioral.collaboration.relationships_without_meeting_in_person
    competency_key: collaboration
    topic: Building working relationships remotely
    difficulty: easy
    text: >-
      Describe a time you started working with people you rarely or never met in person. How did you build good
      working relationships with them?
    expected_concepts:
      - deliberate one-to-one conversations
      - learning colleagues' goals and preferences
      - reliability in small commitments
      - informal channels for quick questions
    rubric:
      excellent: Describes deliberate steps such as introductory calls and early reliable delivery, and links them to a later moment where the relationship made the work easier.
      good: Gives concrete actions that built working relationships remotely.
      weak: Says relationships formed naturally without describing anything they did.
    followups:
      - Which relationship took the longest to build, and why?
      - What would you do in your first two weeks next time?
    common_errors:
      - Equating relationship-building with social chat only.

  - external_key: behavioral.collaboration.remote_meeting_what_worked
    competency_key: collaboration
    topic: What makes a remote meeting work
    difficulty: easy
    text: >-
      Tell me about a remote meeting you ran or took part in that went especially well or especially badly. What
      made the difference?
    expected_concepts:
      - clear purpose and agenda
      - pre-reading or shared document
      - ensuring everyone could contribute
      - recorded decisions and actions
    rubric:
      excellent: Pinpoints specific factors such as purpose, preparation, facilitation and recorded outcomes, and describes what they changed in later meetings as a result.
      good: Identifies sensible factors on a real example.
      weak: Focuses only on technical issues like connection problems.
    followups:
      - What do you do now in every remote meeting you run?
      - How do you handle people who stay silent?
    common_errors:
      - Blaming the tools rather than the meeting design.

  - external_key: behavioral.collaboration.decision_by_written_document
    competency_key: collaboration
    topic: Reaching a decision in writing
    difficulty: easy
    text: >-
      Describe a time you used a written document instead of a meeting to reach a decision with a group. How did
      you set it up so people could weigh in?
    expected_concepts:
      - clear question and options in the document
      - a deadline for comments
      - named reviewers or decision maker
      - recording the final decision
    rubric:
      excellent: Describes a clear document with options, named reviewers, a deadline and a recorded decision, and explains why writing suited that decision better than a meeting.
      good: Gives a real example of reaching a decision in writing.
      weak: Describes sending a document with no structure or outcome.
    followups:
      - What did you do with comments that came in late?
      - When would you switch to a meeting instead?
    common_errors:
      - Leaving the decision maker unclear so the thread never ends.

  - external_key: behavioral.collaboration.misread_written_message
    competency_key: communication
    topic: A written message that was misread
    difficulty: easy
    text: >-
      Tell me about a time a message you sent over chat or email was read very differently from what you
      intended. How did you notice, and how did you sort it out?
    expected_concepts:
      - what was misunderstood and why
      - noticing the signal (reply, silence, action)
      - switching channels to clarify
      - change to how they write similar messages
    rubric:
      excellent: Explains the cause of the misreading, how they noticed, how they clarified quickly (often by switching to a call) and a concrete change in how they now write.
      good: Resolves the misunderstanding on a real example.
      weak: Blames the reader or cannot give an example.
    followups:
      - What would you write differently now?
      - When do you choose a call over a message?
    common_errors:
      - Blaming the reader for misunderstanding.

  - external_key: behavioral.collaboration.improving_shared_workspace
    competency_key: collaboration
    topic: Improving a shared remote workspace
    difficulty: easy
    text: >-
      Describe a shared tool or workspace you set up or improved so a remote group could collaborate better, such
      as a board, a shared document space or a channel structure. What problem did it solve, and how did people
      take it up?
    expected_concepts:
      - the collaboration problem it addressed
      - involving users in the design
      - simple conventions that made it usable
      - evidence of adoption
    rubric:
      excellent: Ties the tool change to a specific collaboration problem, involved the people using it, kept conventions simple and shows evidence of adoption and benefit.
      good: Describes a useful improvement with some adoption.
      weak: Describes introducing a tool for its own sake with no evidence it helped.
    followups:
      - What did people ignore, and why?
      - How did you avoid adding another place to look?
    common_errors:
      - Adding tools without retiring old ones.

  - external_key: behavioral.collaboration.agreeing_availability_with_remote_peer
    competency_key: collaboration
    topic: Agreeing when you can reach each other
    difficulty: easy
    text: >-
      Tell me how you and a remote teammate agreed on when and how you'd be reachable for each other. What did
      you agree, and how well did it hold up?
    expected_concepts:
      - explicit agreement on hours and channels
      - expectations for response times
      - how urgent issues are handled
      - adjusting the agreement over time
    rubric:
      excellent: Describes an explicit agreement covering hours, channels, response times and urgent cases, gives an example of it being tested and how they adjusted it.
      good: Gives a reasonable agreement on a real example.
      weak: Assumes constant availability or never discussed it.
    followups:
      - What happened the first time something urgent came up outside those hours?
      - How do you protect focus time while staying reachable?
    common_errors:
      - Expecting instant replies at all hours.

  - external_key: behavioral.collaboration.recognising_remote_colleague
    competency_key: collaboration
    topic: Recognising good work remotely
    difficulty: easy
    text: >-
      Tell me about a time you recognised a remote colleague's good work when you couldn't do it face to face.
      What did you actually do?
    expected_concepts:
      - specific contribution recognised
      - visible channel where it mattered
      - informing the colleague's lead or wider group
      - timeliness
    rubric:
      excellent: Names a specific contribution, describes recognition in a visible, relevant channel including the colleague's lead, and explains why that mattered more in a remote setting.
      good: Gives a concrete example of remote recognition.
      weak: Describes only a generic thank-you message.
    followups:
      - Why does recognition need more effort remotely?
      - How did the colleague's lead find out?
    common_errors:
      - Recognition so generic it says nothing about the work.

  # ------------------------------------------------------------------------------- medium
  - external_key: behavioral.collaboration.including_remote_in_hybrid_team
    competency_key: collaboration
    topic: Including remote colleagues in a hybrid team
    difficulty: medium
    text: >-
      Tell me about a time some of your team were together in an office and others were remote. What did you do
      to make sure the remote colleagues weren't left out of discussions or decisions?
    expected_concepts:
      - noticing decisions made in hallway conversations
      - remote-first meeting habits
      - writing decisions down in shared channels
      - checking with remote colleagues directly
    rubric:
      excellent: Identifies how remote colleagues were being excluded, introduces specific habits like remote-first meetings and written decisions, and shows evidence it improved their participation.
      good: Takes concrete steps to include remote colleagues on a real example.
      weak: Acknowledges the problem but did nothing specific about it.
    followups:
      - How did the people in the office react to the changes?
      - How did you find out remote colleagues felt left out, based on what they said or did?
    common_errors:
      - Assuming that adding a video link solves the problem.

  - external_key: behavioral.collaboration.disagreement_over_chat
    competency_key: collaboration
    topic: Resolving a disagreement that played out in writing
    difficulty: medium
    text: >-
      Describe a disagreement with a colleague that played out mostly over chat or email. How did you resolve it,
      and what did it teach you about handling disagreement remotely?
    expected_concepts:
      - recognising the thread was escalating
      - moving to a call
      - restating the other person's view
      - recording the agreed outcome
      - lesson applied later
    rubric:
      excellent: Recognises when written back-and-forth stopped working, switches to a conversation, restates the other view fairly, records the outcome and explains a lasting lesson.
      good: Resolves the disagreement constructively on a real example.
      weak: Continues arguing in writing or copies in managers to win.
    followups:
      - At what point do you stop replying in writing?
      - Who else saw that thread, and how did that affect things?
    common_errors:
      - Escalating by adding more people to the thread.

  - external_key: behavioral.collaboration.slow_responses_across_time_zones
    competency_key: collaboration
    topic: Blocked by slow replies from another time zone
    difficulty: medium
    text: >-
      Tell me about a time a collaborator in a different time zone was slow to respond and it was blocking your
      work. How did you keep things moving?
    expected_concepts:
      - making requests self-contained and specific
      - proposing a default decision with a deadline
      - working on parallel tasks meanwhile
      - agreeing a better process with the collaborator
    rubric:
      excellent: Describes making requests self-contained, proposing defaults with deadlines, re-sequencing work, and agreeing a better process with the collaborator so it didn't recur.
      good: Finds practical ways to keep work moving.
      weak: Simply waited or escalated without trying to improve the requests.
    followups:
      - What did a good request look like after that?
      - How did the collaborator see the situation?
    common_errors:
      - Sending short questions that need several round trips.

  - external_key: behavioral.collaboration.distributed_project_kickoff
    competency_key: collaboration
    topic: Starting a project with a distributed group
    difficulty: medium
    text: >-
      Describe how you started a new project with a group spread across locations or schedules. What did you put
      in place early so people could work independently?
    expected_concepts:
      - written goals, scope and owners
      - decision log or single source of truth
      - agreed communication cadence
      - interfaces between people's work defined early
    rubric:
      excellent: Describes specific early artefacts such as goals, owners, decision log and cadence, and connects them to people later working independently without constant syncs.
      good: Sets up reasonable structure for a distributed project.
      weak: Starts work without shared structure, relying on meetings for everything.
    followups:
      - Which of those things turned out to matter most?
      - What did you have to add later?
    common_errors:
      - Relying on a kickoff call that nobody can refer back to.

  - external_key: behavioral.collaboration.context_lost_between_remote_colleagues
    competency_key: collaboration
    topic: When context gets lost between remote colleagues
    difficulty: medium
    text: >-
      Tell me about a time important context got lost between remote colleagues, for example a decision made on a
      call that others never heard about. What happened, and what did you change?
    expected_concepts:
      - impact of the missing context
      - repairing the immediate situation
      - root cause in how decisions were shared
      - a lasting change such as written summaries
    rubric:
      excellent: Explains the impact, fixes the immediate problem, finds the root cause in how information flowed and introduces a change that prevented repeats.
      good: Resolves the situation and makes a sensible process change.
      weak: Treats it as one person's mistake with no process change.
    followups:
      - Who should have shared the decision?
      - How do you check that a change like that sticks?
    common_errors:
      - Blaming individuals instead of fixing how decisions are shared.

  - external_key: behavioral.collaboration.supporting_new_remote_colleague
    competency_key: collaboration
    topic: Supporting a newcomer who works remotely
    difficulty: medium
    text: >-
      Tell me about a time you helped a new remote colleague settle in when they couldn't simply turn to the person
      next to them. What did you do differently from what you'd do in person?
    expected_concepts:
      - proactive scheduled check-ins
      - an explicit invitation to ask questions
      - introductions to other colleagues
      - written guides and recorded walkthroughs
    rubric:
      excellent: Describes proactive, remote-specific support such as scheduled check-ins, introductions and written guides, and explains why each was needed without in-person contact.
      good: Provides deliberate support adapted to the remote setting.
      weak: Applies an in-person approach unchanged or waits for questions.
    followups:
      - How did you know whether they were stuck?
      - What would they say helped most?
    common_errors:
      - Assuming a newcomer will ask when they need help.

  - external_key: behavioral.collaboration.remote_group_idea_generation
    competency_key: collaboration
    topic: Generating ideas with a remote group
    difficulty: medium
    text: >-
      Describe a time you needed a remote group to come up with ideas or solve an open-ended problem together. How
      did you run it so that everyone contributed?
    expected_concepts:
      - preparation and a clear problem statement
      - silent or written idea collection first
      - structured turns or breakout groups
      - converging and recording outcomes
    rubric:
      excellent: Describes a structured approach that gathered ideas independently before discussion, gave everyone a way in, converged on decisions and recorded them, with a concrete result.
      good: Runs a reasonably inclusive remote session with an outcome.
      weak: An open call where a few people talked and nothing was recorded.
    followups:
      - Whose ideas would have been missed in an open discussion?
      - How did you narrow the ideas down?
    common_errors:
      - Letting the first or loudest idea frame the whole discussion.

  - external_key: behavioral.collaboration.remote_teammate_gone_quiet
    competency_key: collaboration
    topic: A remote teammate who has gone quiet
    difficulty: medium
    text: >-
      Tell me about a time a remote teammate had gone quiet and you weren't sure what they were working on or
      whether they were blocked. How did you approach it?
    expected_concepts:
      - reaching out directly and early
      - assuming good intent
      - focusing on the work and blockers
      - agreeing a way to stay visible
    rubric:
      excellent: Reaches out directly and early with a work-focused question, assumes good intent, uncovers the real situation and agrees a lightweight way to stay visible.
      good: Checks in constructively and resolves the uncertainty.
      weak: Reports the teammate without contacting them or ignores it.
    followups:
      - What turned out to be going on?
      - What did you agree to make progress more visible?
    common_errors:
      - Raising it with a manager before talking to the teammate.

  - external_key: behavioral.collaboration.conflicting_comments_on_proposal
    competency_key: collaboration
    topic: Conflicting comments on a written proposal
    difficulty: medium
    text: >-
      Tell me about a time you shared a written proposal with a distributed group and got comments that pulled in
      opposite directions. How did you work through them to a decision?
    expected_concepts:
      - grouping comments into themes
      - clarifying the underlying concerns
      - bringing conflicting reviewers together
      - recording the decision and reasoning
    rubric:
      excellent: Organises the feedback, identifies the real concerns behind conflicting comments, brings the right reviewers together, reaches a decision and records the reasoning.
      good: Gets to a decision while addressing the main concerns.
      weak: Tries to satisfy every comment or ignores the ones they disagree with.
    followups:
      - Which comment changed your proposal most?
      - How did you close the loop with people whose view didn't win?
    common_errors:
      - Endless revisions without a decision owner.

  - external_key: behavioral.collaboration.cutting_remote_meeting_load
    competency_key: collaboration
    topic: Reducing meeting load on a remote team
    difficulty: medium
    text: >-
      Tell me about a time your remote team had so many meetings that focused work suffered. What did you do about
      it, and what did the team change?
    expected_concepts:
      - evidence of the problem
      - reviewing each meeting's purpose
      - replacing some meetings with written updates
      - agreeing focus time
      - measuring the effect
    rubric:
      excellent: Gathers evidence of the problem, reviews meetings with the team, replaces or trims specific ones with written alternatives, and shows a measurable gain in focus time without losing alignment.
      good: Makes practical changes that reduce meeting load.
      weak: Simply declines meetings personally without addressing the team problem.
    followups:
      - Which meeting was hardest to cancel, and why?
      - How did you make sure people stayed aligned?
    common_errors:
      - Cutting meetings without replacing the information they carried.

  - external_key: behavioral.collaboration.trusting_unfamiliar_remote_partner
    competency_key: collaboration
    topic: Depending on a remote collaborator you don't know
    difficulty: medium
    text: >-
      Describe a time you had to depend on a remote colleague or contractor you'd never worked with for something
      important. How did you build enough trust to rely on them?
    expected_concepts:
      - clear expectations and definitions of done
      - small early deliverables
      - frequent check-ins at the start
      - adjusting the level of oversight as trust grew
    rubric:
      excellent: Sets clear expectations, uses small early deliverables and check-ins, adjusts oversight as evidence builds and describes the result.
      good: Takes sensible steps to build trust on a real example.
      weak: Either trusts blindly or micromanages throughout.
    followups:
      - What would have made you step in more closely?
      - How did they experience your check-ins, based on what they told you?
    common_errors:
      - Equating trust with a lack of any checkpoints.

  # ------------------------------------------------------------------------------- hard
  - external_key: behavioral.collaboration.distributed_team_splitting_by_location
    competency_key: collaboration
    topic: A distributed team splitting into sub-groups
    difficulty: hard
    text: >-
      Tell me about a time a distributed team you were on started splitting into separate groups by location or
      schedule. What did you do to bring it back together?
    expected_concepts:
      - signs of the split (duplicate work, us-and-them talk)
      - root causes in structure or process
      - changes to ownership or communication
      - shared goals across sub-groups
      - evidence of improvement
    rubric:
      excellent: Identifies concrete signs and structural causes, makes specific changes to ownership, communication or rituals, and shows evidence the team worked as one again.
      good: Takes practical steps that reduce the split.
      weak: Attributes the split to individuals or only adds social events.
    followups:
      - What structural change made the biggest difference?
      - How did you involve both groups in the fix?
    common_errors:
      - Treating it only as a social problem.

  - external_key: behavioral.collaboration.uneven_time_zone_burden
    competency_key: collaboration
    topic: Sharing the cost of awkward hours fairly
    difficulty: hard
    text: >-
      Describe a time the burden of awkward meeting times or late handovers fell mostly on one group in a
      distributed team. How did you address it?
    expected_concepts:
      - noticing the imbalance
      - discussing it openly with both groups
      - rotation or shifting work to asynchronous formats
      - measuring whether the burden evened out
    rubric:
      excellent: Notices and quantifies the imbalance, raises it openly, introduces concrete changes such as rotation or async formats and shows the burden became more balanced.
      good: Makes a reasonable change to spread the burden.
      weak: Accepts the imbalance as inevitable or does not notice it.
    followups:
      - Who had to give something up for the change?
      - How did you check the change was fair to both groups?
    common_errors:
      - Assuming the group with the inconvenient hours doesn't mind.

  - external_key: behavioral.collaboration.async_decision_making_change
    competency_key: collaboration
    topic: Moving decisions out of live meetings
    difficulty: hard
    text: >-
      Tell me about a time you changed how a distributed team made decisions so it relied less on live meetings.
      What did you introduce, how did people adopt it, and what was the result?
    expected_concepts:
      - the problem with meeting-based decisions
      - the written process introduced (templates, decision logs, deadlines)
      - getting adoption and handling resistance
      - when live discussion is still used
      - measured result
    rubric:
      excellent: Explains the problem, introduces a specific written decision process, drives adoption while handling resistance, defines when live discussion still applies, and shows measurable improvement.
      good: Introduces a working async decision practice with some adoption.
      weak: Describes the idea without adoption or results.
    followups:
      - Which decisions still needed a meeting?
      - What did you do when someone bypassed the process?
    common_errors:
      - Banning meetings rather than choosing the right format per decision.

  - external_key: behavioral.collaboration.remote_partner_organisation
    competency_key: collaboration
    topic: Collaborating remotely with another organisation
    difficulty: hard
    text: >-
      Describe the hardest collaboration you've had with a remote team in another organisation, such as a client,
      vendor or partner company. What made it hard, and how did you make it work?
    expected_concepts:
      - differences in goals, processes or incentives
      - explicit agreements on scope and communication
      - building direct relationships across organisations
      - handling a serious disagreement
      - outcome
    rubric:
      excellent: Explains the structural difficulties, describes explicit agreements and direct relationships they built, walks through a serious disagreement they resolved and shows the outcome.
      good: Makes a difficult cross-organisation collaboration work with concrete actions.
      weak: Describes the other organisation as the problem without their own actions.
    followups:
      - What did you have to agree in writing that you'd normally leave informal?
      - What would you set up differently from day one?
    common_errors:
      - Relying only on contracts instead of working relationships.

  - external_key: behavioral.collaboration.late_discovered_misalignment
    competency_key: collaboration
    topic: Discovering late that you were misaligned
    difficulty: hard
    text: >-
      Tell me about a time you discovered late that you and a remote team had been working toward different
      understandings of the same goal. How did you recover, and what did you change to catch it earlier next time?
    expected_concepts:
      - how the misalignment arose
      - assessing the damage and options
      - joint recovery plan
      - transparent communication to stakeholders
      - earlier checkpoints such as demos or written specs
    rubric:
      excellent: Diagnoses how the misalignment arose on both sides, leads a joint recovery with transparent communication and introduces specific earlier checkpoints that worked later.
      good: Recovers the situation and makes a sensible change.
      weak: Blames the remote team or describes no lasting change.
    followups:
      - What was the earliest signal you missed?
      - How did you explain the delay upward?
    common_errors:
      - Assuming a shared document means a shared understanding.
