# Behavioural: collaboration (part 1 of 4) - working across functions and sharing credit.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ cross-functional partners (easy)
  - external_key: behavioral.collaboration.product_partner_working_rhythm
    competency_key: collaboration
    topic: Working day to day with a product partner
    difficulty: easy
    text: >-
      Tell me about a time you worked closely with a product manager or business owner on something you were
      building. How did the two of you split the work and keep each other in the loop?
    expected_concepts:
      - who decided what (scope, priorities, implementation)
      - regular touchpoints or shared artefacts
      - raising trade-offs early instead of surprising the partner
      - how disagreements on scope were settled
      - outcome of the work
    rubric:
      excellent: Describes a clear division of responsibilities, a concrete working rhythm, at least one trade-off they raised early and how it was settled, and a result that both sides relied on.
      good: Gives a real example with regular communication and a reasonable split of work.
      weak: Describes simply receiving requirements and building them, with no two-way collaboration.
    followups:
      - What did you do when you thought a requested feature wasn't worth building?
      - What would that product partner say was most useful about working with you?
    common_errors:
      - Treating the partner as a ticket source rather than a collaborator.

  - external_key: behavioral.collaboration.designer_partnership
    competency_key: collaboration
    topic: Collaborating with a designer
    difficulty: easy
    text: >-
      Think of a time you worked with a designer or someone focused on the user experience. What did each of you
      bring to the work, and how did you settle the details you saw differently?
    expected_concepts:
      - understanding the designer's goals and constraints
      - sharing their own constraints early
      - a concrete detail they negotiated
      - checking the result together before release
    rubric:
      excellent: Names a specific detail they saw differently, explains how they understood the designer's intent and shared their own constraints, and describes a resolution that kept the user goal intact.
      good: Shows respectful back-and-forth and a workable outcome on a real piece of work.
      weak: Describes the designer as an obstacle or simply implemented or overruled without discussion.
    followups:
      - How early did you get involved in the design?
      - What did you learn from the designer that you still use?
    common_errors:
      - Framing the other discipline negatively.

  - external_key: behavioral.collaboration.support_team_problem_loop
    competency_key: collaboration
    topic: Working a user problem with support colleagues
    difficulty: easy
    text: >-
      Tell me about a time a colleague in customer support or operations brought you a problem that users were
      running into. How did you work with them to understand it and close the loop?
    expected_concepts:
      - gathering details and examples from the colleague
      - reproducing or verifying the problem
      - keeping the colleague updated on progress
      - giving them something they could tell users
      - preventing repeats or improving the reporting path
    rubric:
      excellent: Shows they treated the colleague as a partner, gathered evidence together, kept them updated, gave them a usable answer for users and improved how such issues reach them in future.
      good: Fixes or resolves the issue and keeps the colleague informed.
      weak: Fixes the problem in isolation and never goes back to the person who reported it.
    followups:
      - How did the support colleague know when it was fixed?
      - What did you change so the next report would be easier to act on?
    common_errors:
      - Dismissing the report until it was escalated.

  - external_key: behavioral.collaboration.learning_another_department
    competency_key: collaboration
    topic: Learning how another department works
    difficulty: easy
    text: >-
      Describe a time you made an effort to understand how another department actually works so you could
      collaborate with them better. What did you learn, and how did it change the way you worked together?
    expected_concepts:
      - why understanding them mattered
      - how they learned (shadowing, asking, reading their metrics)
      - a specific insight about the other department's pressures
      - a concrete change in how they worked with them
    rubric:
      excellent: Explains a deliberate effort to learn the other department's goals and constraints, names a specific insight, and shows a concrete change in collaboration that produced a better result.
      good: Gives a real example of learning about another group and adjusting their approach.
      weak: General statements about respecting other teams with no specific learning or change.
    followups:
      - What surprised you most about how they work?
      - Did you share anything about your own team's work with them in return?
    common_errors:
      - Describing only what the other department should change.

  - external_key: behavioral.collaboration.recognising_essential_contributions
    competency_key: collaboration
    topic: Recognising others in a shared success
    difficulty: easy
    text: >-
      Tell me about a success you were part of where other people's contributions were essential. How did you
      make sure their part was recognised?
    expected_concepts:
      - the shared success and who contributed what
      - specific recognition (named, in the right forum)
      - recognising less visible work
      - accurate description of their own role
    rubric:
      excellent: Clearly separates their own contribution from others', describes specific and timely recognition in a forum that mattered, and includes people whose work was easy to overlook.
      good: Names contributors and some concrete way they credited them.
      weak: Takes the story as a personal success with generic thanks to "the team".
    followups:
      - Who was easiest to overlook, and why?
      - How did you describe your own part when you talked about it?
    common_errors:
      - Generic "thanks to the team" without naming contributions.

  - external_key: behavioral.collaboration.praised_for_team_effort
    competency_key: collaboration
    topic: Being singled out for team work
    difficulty: easy
    text: >-
      Tell me about a time you were singled out for praise on work that was really a team effort. How did you
      respond, and what happened next?
    expected_concepts:
      - accurate account of the team's and their own contribution
      - redirecting credit to specific people
      - doing so in the same forum where praise was given
      - effect on the team
    rubric:
      excellent: Describes specifically how they redirected credit to named contributors in a visible way while being accurate about their own part, and notes the effect on the team.
      good: Acknowledges the team's role and shares credit in some concrete way.
      weak: Accepts the praise without mentioning others or cannot give a real instance.
    followups:
      - Was there anyone who still didn't get the recognition they deserved?
      - How did your teammates react?
    common_errors:
      - Understating their own real contribution to look generous.

  - external_key: behavioral.collaboration.making_quiet_work_visible
    competency_key: collaboration
    topic: Making a teammate's quiet work visible
    difficulty: easy
    text: >-
      Tell me about a colleague whose work often went unnoticed even though the team depended on it. What did you
      do to make their contribution more visible?
    expected_concepts:
      - what the overlooked work was and why it mattered
      - specific actions to surface it (demos, write-ups, mentions)
      - involving the colleague in how it was shared
      - outcome for the colleague or the team
    rubric:
      excellent: Identifies specific overlooked work and its impact, takes concrete steps to make it visible with the colleague's input, and describes a resulting change.
      good: Gives a real example and at least one concrete action to recognise the colleague.
      weak: Only says they thanked the person privately or cannot name the work.
    followups:
      - How did you know that work was being overlooked?
      - Did anything change in how the team tracked that kind of work?
    common_errors:
      - Choosing an example where the colleague was already well recognised.

  - external_key: behavioral.collaboration.new_cross_functional_group
    competency_key: collaboration
    topic: Getting a new mixed group working together
    difficulty: easy
    text: >-
      Describe a project where you worked with people from several functions you hadn't worked with before. What
      did you do early on to help the group work well together?
    expected_concepts:
      - learning each person's role and goals
      - agreeing a shared goal and responsibilities
      - setting communication channels and cadence
      - an early problem that the setup helped with
    rubric:
      excellent: Describes specific early steps (clarifying goals, roles and communication) and connects them to a later moment where the setup helped the group deliver.
      good: Shows some deliberate effort to get the group aligned with a reasonable result.
      weak: Describes the project's work but nothing about how the group came together.
    followups:
      - What would you set up differently if you did it again?
      - Who was hardest to bring in, and why?
    common_errors:
      - Assuming everyone shared the same definition of done.

  - external_key: behavioral.collaboration.handover_to_another_function
    competency_key: collaboration
    topic: Handing work to another function
    difficulty: easy
    text: >-
      Walk me through a time you handed your work over to another function, such as testing, operations or a
      customer-facing team. What did you do to make that handover go smoothly?
    expected_concepts:
      - understanding what the receiving team needed
      - documentation, walkthroughs or training
      - being available after the handover
      - checking the handover worked
    rubric:
      excellent: Shows they asked what the receiving team needed, prepared material and a walkthrough, stayed available, and checked afterwards that the receiving team could operate independently.
      good: Provides reasonable documentation and support for the handover.
      weak: Treats handover as "done once I sent it" or cannot describe what the other team received.
    followups:
      - What questions came back after the handover?
      - How would you know if the handover had failed?
    common_errors:
      - Handing over without asking what the other team needs.

  # ---------------------------------------------------------- cross-functional + credit (medium)
  - external_key: behavioral.collaboration.functions_wanting_different_outcomes
    competency_key: collaboration
    topic: Two functions wanting different things from the same work
    difficulty: medium
    text: >-
      Tell me about a time your team and another function, like marketing, sales or operations, wanted different
      things from the same piece of work. How did you find an outcome that worked for both?
    expected_concepts:
      - each side's goals and constraints
      - surfacing the conflict explicitly
      - options or compromises considered
      - agreeing criteria for the decision
      - outcome and relationship afterwards
    rubric:
      excellent: States both sides' goals fairly, explains how they made the conflict explicit, explored options against agreed criteria and reached an outcome both functions accepted, with the relationship intact.
      good: Shows a reasonable negotiation that reached a workable compromise.
      weak: Describes one side giving in, or an escalation with no attempt to understand the other function.
    followups:
      - What did you give up to get there?
      - If you had to make that call again, what would you do differently?
    common_errors:
      - Presenting the other function's goal as unreasonable.
      - Ending the story without a decision.

  - external_key: behavioral.collaboration.explaining_constraints_outside_field
    competency_key: communication
    topic: Explaining specialist constraints to non-specialists
    difficulty: medium
    text: >-
      Describe a time you had to explain a technical or specialist constraint to colleagues outside your field so
      they could make a decision. How did you make it understandable without oversimplifying?
    expected_concepts:
      - understanding what the audience needed to decide
      - translating into impact, cost or risk
      - concrete analogies, examples or visuals
      - checking understanding
      - the decision that followed
    rubric:
      excellent: Shows they framed the constraint in terms of the audience's decision (impact, cost, risk), used concrete examples, checked understanding and can point to a better decision as a result.
      good: Gives a clear explanation to a non-specialist audience that helped a decision.
      weak: Relies on jargon or describes the audience as unable to understand.
    followups:
      - How did you know they had understood?
      - What did you leave out, and why?
    common_errors:
      - Explaining the mechanism in detail instead of the consequences.

  - external_key: behavioral.collaboration.upstream_deliverable_slipping
    competency_key: collaboration
    topic: When a dependency from another group slips
    difficulty: medium
    text: >-
      Tell me about a time something you needed from another group started to slip and put your own plan at
      risk. What did you do, and how did you keep the working relationship in good shape?
    expected_concepts:
      - noticing the slip early
      - understanding the cause from their side
      - options (re-plan, help, reduce scope, workaround)
      - transparent updates to stakeholders
      - relationship after the event
    rubric:
      excellent: Detects the slip early, learns why from the other group, offers help or adjusts scope jointly, keeps stakeholders informed and finishes with the relationship intact or stronger.
      good: Takes practical action to protect their plan and communicates with the other group.
      weak: Waits until the deadline, blames the other group, or escalates without talking to them first.
    followups:
      - What did you offer them to help them deliver?
      - How did you explain the delay to your own stakeholders?
    common_errors:
      - Escalating before talking to the people doing the work.

  - external_key: behavioral.collaboration.customer_facing_overcommitment
    competency_key: collaboration
    topic: A promise made to a customer without your team
    difficulty: medium
    text: >-
      Tell me about a time a colleague in a customer-facing role committed to something your team hadn't agreed
      to deliver. How did you work it out with them?
    expected_concepts:
      - understanding why the commitment was made
      - assessing what was feasible
      - jointly deciding what to tell the customer
      - changing how such commitments get checked
    rubric:
      excellent: Starts by understanding the colleague's situation, assesses feasibility, works out with them a realistic message for the customer and puts in place a way to avoid repeats.
      good: Resolves the immediate situation cooperatively.
      weak: Refuses outright or blames the colleague without finding a way forward.
    followups:
      - What did the customer end up being told?
      - How did you make sure it didn't happen again?
    common_errors:
      - Treating the colleague as the problem rather than the missing process.

  - external_key: behavioral.collaboration.agreeing_shared_success_measure
    competency_key: collaboration
    topic: Agreeing what success means across functions
    difficulty: medium
    text: >-
      Describe a time you worked with another function to agree how a shared project would be judged a success.
      How did you get to a definition that everyone accepted?
    expected_concepts:
      - different initial views of success
      - converging on measurable outcomes
      - who owned each measure
      - revisiting the measure as the work progressed
    rubric:
      excellent: Describes the differing views, how they converged on concrete measures with owners, and how the agreed measure guided later decisions on the project.
      good: Reaches a shared, reasonably specific definition of success.
      weak: Success was assumed or defined by one side only.
    followups:
      - Which measure was the hardest to agree on?
      - Did the definition change before the end?
    common_errors:
      - Choosing measures nobody could actually track.

  - external_key: behavioral.collaboration.dispute_over_credit
    competency_key: collaboration
    topic: Tension over who deserved credit
    difficulty: medium
    text: >-
      Tell me about a time there was tension over who deserved credit for a piece of work. What role did you play
      in resolving it?
    expected_concepts:
      - the situation and the people involved
      - getting the facts about contributions
      - a fair, visible correction
      - preventing similar tension
    rubric:
      excellent: Gives a fair account of each person's contribution, describes a specific action that corrected the record visibly, and explains a change that reduced future tension.
      good: Plays a constructive role in resolving the tension on a real example.
      weak: Avoids the situation, takes sides without facts, or the story is mainly about their own grievance.
    followups:
      - How did you find out what each person had actually done?
      - What did you change about how work is attributed?
    common_errors:
      - Telling the story only from their own grievance.

  - external_key: behavioral.collaboration.describing_own_part_in_writeups
    competency_key: collaboration
    topic: Describing your part versus the team's
    difficulty: medium
    text: >-
      Think of a recent project summary, launch note or self-review you wrote. How did you describe your own
      contribution compared with the team's, and why did you describe it that way?
    expected_concepts:
      - specific personal contributions named accurately
      - specific contributions of others named
      - avoiding both overclaiming and underclaiming
      - audience and purpose of the document
    rubric:
      excellent: Gives a concrete example that names their own and others' contributions precisely, explains the reasoning for how they framed it, and shows awareness of both overclaiming and underclaiming.
      good: Describes a balanced account with some specifics.
      weak: Cannot separate their part from the team's, or describes everything as their own.
    followups:
      - Did anyone on the team read it before it went out?
      - How do you handle it when your part was small but important?
    common_errors:
      - Using "we" for everything so the interviewer cannot tell what they did.

  - external_key: behavioral.collaboration.building_on_colleague_idea
    competency_key: collaboration
    topic: Building on someone else's idea
    difficulty: medium
    text: >-
      Tell me about a time you took a colleague's idea and built on it to get a better result. How did you handle
      who owned the final idea?
    expected_concepts:
      - the original idea and its source
      - what they added or changed
      - involving the originator in the evolution
      - credit for the originator in the outcome
    rubric:
      excellent: Clearly credits the original idea, explains what they added and why, involved the originator in shaping it and ensured visible credit in the final result.
      good: Shows constructive building on an idea with credit given.
      weak: Presents the improved idea as their own or does not mention the originator.
    followups:
      - How did the original author feel about the changes, based on what they said or did?
      - What would you do if they disagreed with your changes?
    common_errors:
      - Presenting the evolved idea as entirely their own.

  - external_key: behavioral.collaboration.changing_testing_with_quality_partner
    competency_key: collaboration
    topic: Partnering with quality or testing colleagues
    difficulty: medium
    text: >-
      Describe a time you worked with a quality or testing colleague to change when or how testing happened on
      your project. What did you change together, and what was the result?
    expected_concepts:
      - the problem with the existing approach
      - involving the testing colleague as an equal partner
      - specific change (earlier involvement, shared test cases, automation)
      - measured outcome
    rubric:
      excellent: Describes a joint diagnosis of the problem, a specific change designed together, and an observable result such as fewer escaped defects or shorter cycles.
      good: Shows cooperation with testing colleagues leading to a reasonable improvement.
      weak: Treats testing as a separate phase that someone else handles.
    followups:
      - What did your testing colleague teach you about the product?
      - What did you have to give up to make the change work?
    common_errors:
      - Describing testers only as the people who find bugs.

  - external_key: behavioral.collaboration.loaned_to_another_team
    competency_key: collaboration
    topic: Contributing while embedded in another team
    difficulty: medium
    text: >-
      Tell me about a time you were temporarily embedded in, or loaned to, another team. How did you get up to
      speed and contribute without disrupting how they already worked?
    expected_concepts:
      - learning the host team's goals and norms
      - agreeing what they would and wouldn't do
      - early useful contribution
      - leaving things in a good state when they left
    rubric:
      excellent: Shows deliberate learning of the host team's goals and norms, a clear agreement on scope, a concrete contribution and a clean exit with knowledge left behind.
      good: Integrates reasonably and contributes something useful.
      weak: Imposes their own way of working or contributes little and leaves no trace.
    followups:
      - What did you bring back to your own team?
      - What would the host team say about having you?
    common_errors:
      - Rewriting the host team's processes on the first day.

  - external_key: behavioral.collaboration.work_falling_between_functions
    competency_key: collaboration
    topic: Work nobody clearly owned
    difficulty: medium
    text: >-
      Describe a situation where a piece of work fell between two functions and nobody clearly owned it. How did
      you get it picked up and keep it from falling through again?
    expected_concepts:
      - recognising the ownership gap
      - bringing the relevant parties together
      - agreeing an owner and next steps
      - making the ownership explicit for the future
    rubric:
      excellent: Spots the gap, convenes the right people, gets an explicit owner and plan, and makes the ownership durable (documented, added to a process or a team charter).
      good: Gets the work picked up through constructive coordination.
      weak: Either ignores the gap or quietly does the work themselves without fixing the ownership problem.
    followups:
      - Why do you think nobody had picked it up?
      - What would have happened if you hadn't stepped in?
    common_errors:
      - Silently absorbing the work, so the gap remains.

  # ------------------------------------------------------------------------------- hard
  - external_key: behavioral.collaboration.aligning_many_functions_to_delivery
    competency_key: collaboration
    topic: Keeping many functions aligned through delivery
    difficulty: hard
    text: >-
      Tell me about the most complex cross-functional effort you've been part of, with several departments that
      had different goals. How did you help keep everyone aligned all the way to delivery?
    expected_concepts:
      - map of the groups, goals and dependencies
      - shared plan and decision forum
      - handling a significant misalignment mid-way
      - transparent status and risk reporting
      - outcome and what they would repeat
    rubric:
      excellent: Gives a clear picture of the groups and their goals, describes specific mechanisms they used to stay aligned, walks through a real misalignment they resolved, and connects their role to a measurable delivery outcome.
      good: Shows active coordination on a genuinely multi-function effort with a successful result.
      weak: Describes the project at a high level without their own role in keeping groups aligned.
    followups:
      - Where did alignment break down, and how did you notice?
      - What did you stop doing as the effort grew?
    common_errors:
      - Attributing alignment entirely to a project manager without describing their own part.

  - external_key: behavioral.collaboration.rebuilding_relationship_between_teams
    competency_key: collaboration
    topic: Rebuilding a broken working relationship between teams
    difficulty: hard
    text: >-
      Describe a time the working relationship between your team and another team had broken down. What did you
      personally do to rebuild it, and how did you know it was improving?
    expected_concepts:
      - root causes of the breakdown on both sides
      - acknowledging their own team's part
      - concrete trust-building actions
      - evidence of improvement
      - sustaining it over time
    rubric:
      excellent: Diagnoses causes on both sides including their own team's part, takes specific trust-building steps, and points to concrete evidence that collaboration improved and stayed improved.
      good: Takes constructive personal action that measurably improves the relationship.
      weak: Places all blame on the other team or relies only on management to fix it.
    followups:
      - What did your own team have to change?
      - Which signal told you trust was coming back?
    common_errors:
      - Describing only the other team's faults.

  - external_key: behavioral.collaboration.stepping_back_for_bigger_goal
    competency_key: collaboration
    topic: Letting others lead what you started
    difficulty: hard
    text: >-
      Tell me about a time you deliberately let another person or team lead, or get the visibility for, something
      you had started, because it served the bigger goal. Why did you make that choice, and how did it play out?
    expected_concepts:
      - the initiative and their role in starting it
      - reasoning for stepping back (ownership, adoption, capacity)
      - how they supported the new lead
      - result for the goal
      - reflection on the trade-off for themselves
    rubric:
      excellent: Gives a clear rationale tied to the outcome, describes active support for the new lead, shows a better result for the goal, and reflects candidly on the personal trade-off.
      good: A credible example of putting the goal ahead of visibility with a positive outcome.
      weak: Example where they had no real choice, or no evidence it helped the goal.
    followups:
      - How did you make sure your earlier work wasn't lost?
      - Would you make the same choice again?
    common_errors:
      - Describing a situation where they were simply reassigned.

  - external_key: behavioral.collaboration.groups_with_opposing_targets
    competency_key: collaboration
    topic: Collaborating when targets pull in opposite directions
    difficulty: hard
    text: >-
      Tell me about a time two groups you worked with were measured on targets that pulled against each other,
      for example speed versus stability or growth versus cost. How did you get them to collaborate anyway, and
      what changed?
    expected_concepts:
      - the conflicting targets and their effect on behaviour
      - making the conflict visible to decision makers
      - shared objective or agreed trade-off rules
      - concrete change in how the groups worked
      - outcome
    rubric:
      excellent: Explains how the targets drove the conflict, makes it visible to the right people, establishes a shared objective or explicit trade-off rules, and shows a lasting change in how the groups worked.
      good: Brokers a practical agreement between the groups on a real example.
      weak: Treats the conflict as a matter of individuals being difficult.
    followups:
      - Who had the authority to change the targets, and did you involve them?
      - What happened the next time the trade-off came up?
    common_errors:
      - Ignoring the incentives and blaming the people.

  - external_key: behavioral.collaboration.changing_another_function_practice
    competency_key: collaboration
    topic: Getting another function to change how they work
    difficulty: hard
    text: >-
      Describe a time you needed another function to change how they worked, and you had no authority over them.
      How did you bring them along?
    expected_concepts:
      - why the change mattered to both sides
      - understanding their objections and costs
      - evidence, pilots or small experiments
      - allies and the right decision makers
      - adoption and measured result
    rubric:
      excellent: Frames the change in terms of the other function's interests, addresses their real costs, uses evidence or a pilot to win support, and shows the change was adopted with a measured result.
      good: Persuades the other function on a real example with a positive outcome.
      weak: Relies on mandates from above or gives up when met with resistance.
    followups:
      - What was the strongest objection, and how did you answer it?
      - What did you change in your own proposal along the way?
    common_errors:
      - Assuming a good idea should be adopted on its merits alone.
