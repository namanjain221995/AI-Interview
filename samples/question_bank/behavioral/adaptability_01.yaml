# Behavioural: adaptability (1 of 4) — shifting priorities, changing requirements and re-planning.
# Questions ask for real past examples; evaluation is based only on the content of the answer
# (actions, reasoning, outcome, reflection), never on delivery style or personality.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: adaptability
questions:
  # ------------------------------------------------------------------ easy
  - external_key: behavioral.adaptability.urgent_request_replan
    topic: An urgent request that broke the week's plan
    difficulty: easy
    text: >-
      Think of a week where you had your work planned out and an urgent request landed in the middle of it. How
      did you decide what to set aside, and who did you tell?
    expected_concepts:
      - checking how urgent the request really was and why
      - deciding what to pause based on impact
      - telling the people affected by the slipped work
      - delivering the urgent item and returning to the plan
    rubric:
      excellent: Describes checking the real urgency, choosing what to pause by impact, telling affected people early with new dates, and resuming the paused work afterwards with a clear outcome.
      good: Gives a real example of switching to the urgent work and finishing it, with some communication about the delay.
      weak: Says they just dropped everything, or the example has no decision about what to pause and no outcome.
    followups:
      - How did you confirm the request was as urgent as it sounded?
      - What happened to the work you set aside?
    common_errors:
      - Treating every urgent request as top priority without checking.

  - external_key: behavioral.adaptability.rework_after_requirement_change
    topic: Requirements changed after you had started building
    difficulty: easy
    text: >-
      Walk me through a time the requirements for something you were building changed after you'd already done a
      good chunk of the work. What did you reuse, what did you rework, and how did you decide?
    expected_concepts:
      - understanding what changed and why
      - separating reusable work from work that no longer fits
      - updating the estimate or timeline
      - outcome of the reworked deliverable
    rubric:
      excellent: Explains the change and its reason, makes a reasoned split between salvageable and discarded work, resets expectations on timing and delivers the revised result.
      good: Describes adapting the work to the new requirements with a delivered result, but little on how they decided what to keep.
      weak: Complains about the change or describes starting over with no thought about what could be kept.
    followups:
      - Was there anything you could have done earlier to spot the change coming?
      - How did you update the people waiting on it?
    common_errors:
      - Rebuilding everything from scratch without checking what still fits.

  - external_key: behavioral.adaptability.deadline_pulled_forward
    topic: A deadline moved earlier
    difficulty: easy
    text: >-
      Have you had a deadline suddenly brought forward? Tell me what you changed about your approach to still
      deliver something useful on the new date.
    expected_concepts:
      - understanding what was truly needed by the new date
      - cutting or deferring scope
      - asking for help or removing blockers
      - agreeing what would follow later
      - result delivered on the earlier date
    rubric:
      excellent: Clarifies what had to be ready by the new date, cuts scope deliberately, agrees the deferred parts with stakeholders and delivers a usable result on time.
      good: Delivers by the earlier date with some scope reduction or extra help, with limited explanation of the trade-offs.
      weak: Relies only on working longer hours, or gives no outcome.
    followups:
      - What did you leave out, and how did you agree that with others?
      - Did the deferred work ever get done?
    common_errors:
      - Assuming the full scope must still fit into less time.

  - external_key: behavioral.adaptability.team_tool_switch
    topic: The team switched to a new tool
    difficulty: easy
    text: >-
      Tell me about a time your team moved to a tool or system you hadn't used before. What did you do to get
      comfortable with it while keeping your own work on track?
    expected_concepts:
      - learning the basics needed for daily work first
      - using guides, colleagues or small trials
      - keeping deliverables moving during the switch
      - helping or sharing findings with others
    rubric:
      excellent: Describes a practical way of learning the essentials first, keeps their work moving during the transition and shares tips or fixes that helped the wider team.
      good: Learned the new tool and kept working, with a reasonable learning approach.
      weak: Describes waiting for formal training or resisting the switch without concrete actions.
    followups:
      - What was the trickiest part of the new tool for you?
      - Did you pick up any shortcuts others then adopted?
    common_errors:
      - Describing the tool rather than what they did to adapt to it.

  - external_key: behavioral.adaptability.goal_clarification_after_change
    topic: Understanding the reason behind a change
    difficulty: easy
    text: >-
      When your manager or lead changed the goal of something you were working on, how did you find out the
      reasoning behind it? Give me a specific case.
    expected_concepts:
      - asking directly about the reason for the change
      - restating the new goal to confirm it
      - adjusting the work to the new goal
      - result after understanding the reasoning
    rubric:
      excellent: Gives a specific case where they asked about the reasoning, confirmed the new goal in their own words and used that understanding to make better choices in the adjusted work.
      good: Asked why and adjusted their work, with a clear example.
      weak: Simply followed the new instruction without understanding it, or gives no specific case.
    followups:
      - Did understanding the reason change how you did the work?
      - What would you have done if the reason had not made sense to you?
    common_errors:
      - Accepting the change without checking what problem it solves.

  - external_key: behavioral.adaptability.first_approach_failed
    topic: When the first approach did not work
    difficulty: easy
    text: >-
      Tell me about a piece of work where your first approach clearly wasn't going to work. How did you realise
      it, and what did you switch to?
    expected_concepts:
      - the signal that the approach was failing
      - how quickly they recognised it
      - choosing an alternative approach
      - outcome of the new approach
      - lesson for future work
    rubric:
      excellent: Names the concrete signal that the approach was failing, explains how they chose an alternative without delay and gives the result plus a lesson they have applied since.
      good: Describes changing approach and getting a result, with some reasoning.
      weak: Persisted far too long without reflection, or cannot explain why they changed course.
    followups:
      - Looking back, was there an earlier sign you missed?
      - How much time did the first approach cost you?
    common_errors:
      - Blaming the tool or the task instead of describing their own decision.

  - external_key: behavioral.adaptability.covering_reassigned_teammate
    topic: Picking up a colleague's work at short notice
    difficulty: easy
    text: >-
      Describe a time a colleague was moved to another project and you had to pick up their work with little
      notice. What did you do in the first few days?
    expected_concepts:
      - getting a handover or reconstructing context
      - finding the most time-critical items
      - informing stakeholders of the change in owner
      - continuing delivery without major disruption
    rubric:
      excellent: Describes getting or rebuilding the context quickly, prioritising the time-critical items, telling stakeholders about the new owner and keeping delivery on track.
      good: Picked up the work and kept it moving, with some prioritisation.
      weak: Describes waiting for instructions or gives no concrete first steps.
    followups:
      - What information was missing, and how did you find it?
      - What did you change after taking over?
    common_errors:
      - Not telling stakeholders that the owner changed.

  - external_key: behavioral.adaptability.new_process_adoption
    topic: Working within a new team process
    difficulty: easy
    text: >-
      Tell me about a new process your team introduced, maybe a new review step or a different way of planning.
      How did you adjust the way you worked to fit it?
    expected_concepts:
      - understanding the purpose of the new process
      - specific changes to their own habits
      - giving feedback on what did not work
      - result for their work or the team
    rubric:
      excellent: Explains the purpose of the process, describes specific changes they made to their own routine, raises constructive feedback where it fell short and gives an observable result.
      good: Adopted the process with some concrete adjustments.
      weak: Describes the process only, or describes working around it.
    followups:
      - What part of the new process was hardest to get used to?
      - Did you suggest any changes to it?
    common_errors:
      - Explaining the process without describing their own adjustment.

  - external_key: behavioral.adaptability.user_feedback_changed_direction
    topic: User feedback that changed the direction of work
    difficulty: easy
    text: >-
      Can you share a time when feedback from users or customers made you change direction on something you
      were working on? What did the feedback say, and what did you change?
    expected_concepts:
      - what the feedback revealed
      - judging whether the feedback was representative
      - specific changes made in response
      - checking whether the change helped
    rubric:
      excellent: Describes the feedback and what it revealed, checks whether it was representative, makes specific changes and verifies the effect afterwards.
      good: Clear example of acting on feedback with a sensible change.
      weak: Feedback is described but nothing changed, or the change is vague.
    followups:
      - How did you know the feedback wasn't from a single unusual user?
      - How did you check that the change helped?
    common_errors:
      - Changing direction on a single comment without checking it.

  # ---------------------------------------------------------------- medium
  - external_key: behavioral.adaptability.competing_stakeholder_priorities
    topic: Two stakeholders with conflicting priorities
    difficulty: medium
    text: >-
      Tell me about a time two people you worked for each wanted their request done first and you couldn't do
      both. How did you handle it?
    expected_concepts:
      - understanding the impact behind each request
      - making the conflict visible rather than choosing silently
      - involving the right person to decide when needed
      - communicating the decision to both
      - result for both stakeholders
    rubric:
      excellent: Compares the impact of each request, surfaces the conflict openly, gets a decision from the right person where needed, communicates it to both and delivers in the agreed order.
      good: Resolves the conflict with a reasonable order and keeps both informed.
      weak: Picks one silently, tries to do both badly, or gives no outcome.
    followups:
      - How did the person whose request waited respond?
      - Would you handle it the same way again?
    common_errors:
      - Choosing based on who asked loudest rather than impact.

  - external_key: behavioral.adaptability.project_cancelled_midway
    topic: A project cancelled partway through
    difficulty: medium
    text: >-
      Have you worked on something that was cancelled partway through? Talk me through how you wrapped it up and
      what you carried forward into your next piece of work.
    expected_concepts:
      - understanding why it was cancelled
      - leaving the work in a documented, recoverable state
      - salvaging reusable parts or findings
      - moving on to the new priority quickly
    rubric:
      excellent: Understands the reason for the cancellation, documents and archives the work so it can be resumed, salvages useful parts or findings and moves to the new work without lingering.
      good: Wraps up the work reasonably and moves on, with some salvage.
      weak: Abandons the work with no wrap-up, or focuses only on disappointment.
    followups:
      - Did anything from that project get reused later?
      - What did you write down before you moved on?
    common_errors:
      - Leaving half-finished changes with no record of their state.

  - external_key: behavioral.adaptability.scope_cut_under_constraint
    topic: Delivering with fewer resources than planned
    difficulty: medium
    text: >-
      Describe a project where the people or budget you were counting on were reduced partway through. How did
      you reshape the plan, and what did you end up delivering?
    expected_concepts:
      - assessing what the reduced resources could support
      - prioritising the highest-value scope
      - renegotiating expectations with stakeholders
      - finding efficiencies or alternatives
      - result compared with the original goal
    rubric:
      excellent: Reassesses capacity, cuts to the highest-value scope, renegotiates expectations explicitly, finds practical efficiencies and compares the delivered result plainly with the original plan.
      good: Reshapes the plan and delivers a reduced but useful result with stakeholder agreement.
      weak: Keeps the original plan and misses it, or gives no concrete reshaping.
    followups:
      - What was the hardest thing to cut?
      - How did stakeholders react to the revised scope?
    common_errors:
      - Not resetting expectations after the resources changed.

  - external_key: behavioral.adaptability.conflicting_instructions
    topic: Conflicting instructions from different leads
    difficulty: medium
    text: >-
      Tell me about a time you got instructions from two different leads that pointed in opposite directions.
      What did you do before picking a path?
    expected_concepts:
      - noticing and naming the conflict
      - bringing the leads together or escalating
      - avoiding wasted work while waiting
      - documenting the agreed direction
    rubric:
      excellent: Names the conflict early, gets the leads aligned or escalates appropriately, uses the waiting time productively and records the agreed direction so it does not recur.
      good: Raises the conflict and gets a decision before doing too much work.
      weak: Picks one direction without raising it, or does both and wastes effort.
    followups:
      - How did you frame the conflict so it didn't feel like you were taking sides?
      - What did you work on while you waited for a decision?
    common_errors:
      - Silently following whichever lead is more senior.

  - external_key: behavioral.adaptability.incident_interrupted_plan
    topic: An incident that derailed planned work
    difficulty: medium
    text: >-
      Think of a time a production incident or customer escalation pulled you away from planned work for several
      days. How did you manage the planned work while it was going on and afterwards?
    expected_concepts:
      - handing off or pausing planned work explicitly
      - keeping stakeholders informed of the delay
      - focusing fully on the incident
      - re-planning after the incident
      - follow-up actions to reduce future disruption
    rubric:
      excellent: Pauses or hands off planned work explicitly, informs stakeholders, focuses on the incident, re-plans afterwards with new dates and takes action to reduce similar interruptions later.
      good: Handles the incident and recovers the planned work with some communication.
      weak: Tries to do both badly, or the planned work silently slips.
    followups:
      - Who did you tell that your planned work would be late?
      - Did anything change afterwards to make interruptions like that less disruptive?
    common_errors:
      - Letting planned commitments slip without telling anyone.

  - external_key: behavioral.adaptability.discarding_sunk_work
    topic: Choosing to throw away work
    difficulty: medium
    text: >-
      Tell me about a time you decided to throw away work you or your team had already invested in because a
      different approach made more sense. How did you make that call?
    expected_concepts:
      - evidence that the new approach was better
      - weighing future cost rather than effort already spent
      - getting agreement from those invested in the old work
      - outcome of switching
    rubric:
      excellent: Bases the decision on evidence about future cost and value rather than effort already spent, brings invested colleagues along and shows the switch paid off.
      good: Makes a reasonable decision to switch with a clear rationale and result.
      weak: Keeps going because of effort already spent, or the decision was imposed with no reasoning offered.
    followups:
      - Who found that decision hardest, and how did you handle it?
      - What signals would have told you sooner?
    common_errors:
      - Justifying continuation by how much work was already done.

  - external_key: behavioral.adaptability.renegotiating_commitments
    topic: Renegotiating a commitment you could no longer keep
    difficulty: medium
    text: >-
      Give me an example of a commitment you'd made that became unrealistic because circumstances changed. How did
      you go back to the person and renegotiate it?
    expected_concepts:
      - recognising early that the commitment was at risk
      - explaining what changed
      - offering options rather than just a delay
      - agreeing a new commitment and meeting it
    rubric:
      excellent: Spots the risk early, explains the change plainly, offers concrete options with trade-offs, agrees a new commitment and then meets it.
      good: Raises the issue before the deadline and agrees a revised plan.
      weak: Raises it only after missing the deadline, or offers no options.
    followups:
      - How early did you raise it compared with when you first suspected it?
      - What options did you put on the table?
    common_errors:
      - Waiting until the deadline has passed to say anything.

  - external_key: behavioral.adaptability.volatile_requirements_structure
    topic: Structuring work when requirements keep moving
    difficulty: medium
    text: >-
      On a project where the requirements kept moving week to week, how did you structure your work so changes
      didn't keep forcing big rewrites? Walk me through what you actually did.
    expected_concepts:
      - delivering in small increments
      - isolating the parts most likely to change
      - frequent check-ins with stakeholders
      - deferring decisions that were still uncertain
      - result in terms of rework avoided
    rubric:
      excellent: Describes concrete tactics such as small increments, isolating volatile parts and deferring uncertain decisions, with evidence these reduced rework.
      good: Uses frequent check-ins or smaller deliveries to cope with changes, with a reasonable result.
      weak: Describes the chaos without any change in how they worked.
    followups:
      - Which decision did you deliberately postpone, and why?
      - How did you push back when changes came too often?
    common_errors:
      - Treating constant change as unavoidable rather than adapting the way of working.

  - external_key: behavioral.adaptability.forced_dependency_change
    topic: A dependency or vendor change forced a rethink
    difficulty: medium
    text: >-
      Tell me about a time a tool, vendor or service you depended on was withdrawn or changed in a way that broke
      your plans. How did you respond?
    expected_concepts:
      - assessing the impact and the deadline
      - evaluating alternatives
      - planning the move with minimal disruption
      - communicating impact to stakeholders
      - reducing similar dependency risk afterwards
    rubric:
      excellent: Assesses impact and timeline, compares realistic alternatives, plans a low-disruption move, keeps stakeholders informed and reduces similar dependency risk afterwards.
      good: Finds an alternative and completes the move with a reasonable plan.
      weak: Scrambles at the last minute with no evaluation or describes only the vendor's failings.
    followups:
      - How did you choose between the alternatives?
      - What did you change to reduce that kind of risk later?
    common_errors:
      - Focusing on blaming the vendor instead of the response.

  - external_key: behavioral.adaptability.inherited_project_midway
    topic: Inheriting a project halfway through
    difficulty: medium
    text: >-
      Describe a time you took over a project that was already halfway done and heading in a direction you
      wouldn't have chosen. How did you decide what to keep and what to change?
    expected_concepts:
      - understanding why earlier decisions were made
      - assessing the current state before changing course
      - choosing changes with the best payoff
      - aligning stakeholders on any change of direction
      - outcome
    rubric:
      excellent: Investigates the reasons behind earlier decisions, assesses the real state, changes only what has a clear payoff, aligns stakeholders and delivers a result.
      good: Takes over and makes sensible adjustments with a clear outcome.
      weak: Rewrites everything to their own preference, or changes nothing and repeats known problems.
    followups:
      - Which earlier decision turned out to make more sense than you first thought?
      - How did you explain your changes to the people who started it?
    common_errors:
      - Dismissing earlier decisions without learning why they were made.

  - external_key: behavioral.adaptability.reversing_own_decision
    topic: Reversing your own earlier decision
    difficulty: medium
    text: >-
      Tell me about a decision you made and later reversed when new information came in. How did you recognise it
      was time to change your mind, and how did you handle the reversal with others?
    expected_concepts:
      - the original decision and why it was reasonable then
      - the new information and its significance
      - acting on it promptly
      - explaining the reversal openly to those affected
    rubric:
      excellent: Explains why the original decision was reasonable, what new information changed it, acts promptly and explains the reversal openly with its cost and benefit.
      good: Gives a clear example of changing a decision based on new information.
      weak: Cannot describe a reversal, or held on long after the evidence changed.
    followups:
      - What did the reversal cost, and was it worth it?
      - How did people react when you changed course?
    common_errors:
      - Treating changing their mind as a failure to hide.

  # ------------------------------------------------------------------ hard
  - external_key: behavioral.adaptability.team_through_repeated_pivots
    topic: Keeping a team effective through repeated pivots
    difficulty: hard
    text: >-
      Tell me about a period when your team's direction changed several times in a few months. What did you do
      to keep the team productive and stop the changes from wearing people down?
    expected_concepts:
      - explaining the reasons for each change to the team
      - protecting finished work and avoiding waste
      - adjusting planning horizons to the pace of change
      - pushing back upward on unnecessary churn
      - outcome for delivery and the team
    rubric:
      excellent: Explains the context of each change to the team, adapts planning horizons, protects work from waste, pushes back upward on avoidable churn and shows a measurable result for delivery.
      good: Keeps the team informed and productive through the changes with some concrete actions.
      weak: Simply relays each change, or describes the difficulty without actions.
    followups:
      - Did you push back on any of the changes, and how?
      - What did you change about planning as a result?
    common_errors:
      - Passing changes on to the team without context.

  - external_key: behavioral.adaptability.strategy_shift_roadmap
    topic: A strategy change that invalidated a roadmap
    difficulty: hard
    text: >-
      Describe a time a change in company or product strategy made a big part of your roadmap irrelevant. How did
      you rebuild the plan, and how did you decide what from the old plan still mattered?
    expected_concepts:
      - understanding the new strategy in depth
      - mapping existing work against it
      - keeping commitments that still mattered
      - re-sequencing and communicating the new plan
      - measuring progress against the new goals
    rubric:
      excellent: Grounds the new plan in a clear understanding of the strategy, keeps what still fits, re-sequences work with stakeholders and shows how progress was measured against the new goals.
      good: Rebuilds the plan around the new strategy with reasonable choices.
      weak: Bolts the old plan onto the new strategy or describes the change without a new plan.
    followups:
      - Which existing commitment was hardest to drop?
      - How did you explain the new roadmap to the people affected?
    common_errors:
      - Relabelling old work to look aligned with the new strategy.

  - external_key: behavioral.adaptability.pushing_back_on_change
    topic: Pushing back on a change that was a mistake
    difficulty: hard
    text: >-
      Adapting isn't always the right call. Tell me about a time you pushed back on a change because you thought
      it was a mistake. How did you make your case, and what happened?
    expected_concepts:
      - evidence-based reasons for the objection
      - proposing alternatives rather than only objecting
      - raising it with the right people at the right time
      - accepting and supporting the final decision
      - outcome and reflection
    rubric:
      excellent: Bases the objection on evidence, proposes alternatives, raises it through the right channel, commits to the final decision either way and reflects on whether they were right.
      good: Makes a reasoned case and handles the outcome constructively.
      weak: Objects on preference alone, or keeps resisting after the decision was made.
    followups:
      - If the decision had gone against you, what would you have done?
      - Looking back, were you right?
    common_errors:
      - Confusing resistance to change with principled disagreement.

  - external_key: behavioral.adaptability.designing_for_expected_change
    topic: Anticipating change before it arrived
    difficulty: hard
    text: >-
      Tell me about a time you saw a change coming before it was announced, and prepared your work or team for
      it. What did you notice, and what did you do in advance?
    expected_concepts:
      - the signals that suggested the change
      - deciding how much to invest in preparation
      - concrete preparation steps
      - impact when the change arrived
    rubric:
      excellent: Names concrete early signals, makes a proportionate investment in preparation and shows the preparation reduced disruption when the change arrived.
      good: Anticipated a change and took some sensible steps with a positive effect.
      weak: Describes reacting after the fact, or prepared for a change based on guesswork alone.
    followups:
      - What would it have cost if you had been wrong?
      - How did you persuade others to prepare too?
    common_errors:
      - Over-engineering for changes that never came.

  - external_key: behavioral.adaptability.committing_after_disagreeing
    topic: Delivering a direction you disagreed with
    difficulty: hard
    text: >-
      Describe a time a decision went against your recommendation and you still had to deliver it. How did you
      make it succeed, and what did you do with your concerns?
    expected_concepts:
      - recording the concerns clearly once
      - committing fully to delivery
      - building in ways to detect the risks they foresaw
      - adapting the plan as results came in
      - outcome and reflection
    rubric:
      excellent: States their concerns once and clearly, commits fully to making the decision work, builds in ways to detect the risks they foresaw and reflects on how things turned out.
      good: Delivers the decision well despite disagreeing, with a clear outcome.
      weak: Delivers half-heartedly, keeps reopening the decision, or gives no outcome.
    followups:
      - Did any of your concerns come true, and how did you handle it?
      - How did you talk about the decision with your own team?
    common_errors:
      - Undermining the decision while appearing to go along with it.
