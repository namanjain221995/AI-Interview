# Behavioural: failure and resilience (part 1 of 4) - personal mistakes, missed commitments and
# recovering from them. Questions ask for real past examples; evaluation is based only on the content
# of the example (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ everyday mistakes (easy)
  - external_key: behavioral.failure_resilience.mistake_caught_early
    competency_key: ownership
    topic: A mistake caught before it caused harm
    difficulty: easy
    text: >-
      Tell me about a mistake you made at work that you or someone else caught before it did any real damage.
      What happened, and did you change anything in how you work because of it?
    expected_concepts:
      - what the mistake was and how it was spotted
      - what could have happened if it had not been caught
      - how they corrected it
      - a concrete change in habit or process afterwards
    rubric:
      excellent: Names a specific mistake, explains how it was caught and the likely impact avoided, and describes a concrete change they made that they still use.
      good: Gives a real mistake and the correction, with a general lesson.
      weak: Picks something trivial or says nothing changed afterwards.
    followups:
      - Who caught it, and how did you respond to them?
      - Has that change caught anything since?
    common_errors:
      - Treating a near miss as not worth learning from because nothing broke.

  - external_key: behavioral.failure_resilience.missed_own_deadline
    competency_key: ownership
    topic: Missing a deadline you committed to
    difficulty: easy
    text: >-
      Think of a deadline you committed to and then missed. When did you first realise it was slipping, and what
      did you do from that point on?
    expected_concepts:
      - the commitment and why it slipped
      - when the risk became visible to them
      - how and when they told the people relying on it
      - what they delivered instead or how they recovered
      - what they do differently when committing now
    rubric:
      excellent: Explains the cause of the slip plainly, shows they warned the affected people as soon as they knew, offers a recovery plan, and names a concrete change to how they commit to dates.
      good: Describes the slip and a reasonable recovery with some lesson learned.
      weak: Blames circumstances entirely or reveals they said nothing until the date passed.
    followups:
      - Looking back, was there an earlier signal you missed?
      - How did the people waiting on you react to the news?
    common_errors:
      - Describing only external causes with no part of their own.

  - external_key: behavioral.failure_resilience.dropped_promise_to_colleague
    competency_key: ownership
    topic: Dropping a commitment to a colleague
    difficulty: easy
    text: >-
      Tell me about a time you said you'd do something for a colleague, like a review, a fix or some
      information, and it slipped through the cracks. How did you find out, and how did you put it right?
    expected_concepts:
      - the specific commitment that was dropped
      - effect on the colleague's work
      - acknowledging it directly and fixing it
      - a system for tracking small commitments afterwards
    rubric:
      excellent: Gives a concrete example, acknowledges the impact on the colleague, describes a prompt fix, and explains a tracking habit they adopted so small promises do not get lost.
      good: Owns the lapse and fixes it, with a general intention to be more organised.
      weak: Minimises the impact or cannot think of any example.
    followups:
      - How do you keep track of small promises like that today?
    common_errors:
      - Lessons that amount to "try harder" with no mechanism.

  - external_key: behavioral.failure_resilience.built_the_wrong_thing
    competency_key: ownership
    topic: Building the wrong thing after misunderstanding the ask
    difficulty: easy
    text: >-
      Describe a time you finished a piece of work only to find out it wasn't what the person actually needed.
      Where did the misunderstanding come from, and what did you do next?
    expected_concepts:
      - how the request was originally communicated
      - where the misunderstanding started
      - how much work was affected and how it was salvaged
      - how they clarify requirements now
    rubric:
      excellent: Traces the misunderstanding to a specific gap including their own part in it, explains how they salvaged or redid the work, and describes a concrete clarifying practice they now use.
      good: Explains the mismatch and the fix, with a sensible lesson about confirming requirements.
      weak: Places the whole fault on the requester and draws no lesson for themselves.
    followups:
      - What question, asked at the start, would have prevented it?
      - Was any of the original work reusable?
    common_errors:
      - Blaming unclear requirements without describing what they could have checked.

  - external_key: behavioral.failure_resilience.first_approach_failed
    competency_key: problem_solving
    topic: When the first approach does not work
    difficulty: easy
    text: >-
      Tell me about a task where your first approach just didn't work. How did you figure out it wasn't going to
      work, and how did you choose what to try next?
    expected_concepts:
      - the original approach and why it seemed right
      - evidence that it was failing
      - how they decided to change course
      - the second approach and its result
    rubric:
      excellent: Explains the reasoning behind the first approach, the specific evidence that it was failing, a deliberate way of choosing the next option, and the outcome.
      good: Shows a clear change of approach that led to a result.
      weak: Describes random trial and error or keeps pushing the failing approach far too long without reflection.
    followups:
      - How long did you stick with the first approach, and was that about right?
    common_errors:
      - Not explaining why the first approach was chosen in the first place.

  - external_key: behavioral.failure_resilience.hard_skill_plateau
    competency_key: adaptability
    topic: Struggling to learn a skill the job needed
    difficulty: easy
    text: >-
      Think of a skill your job needed that you found genuinely hard to pick up. What wasn't working in how you
      were learning it at first, and what did you change to get past that?
    expected_concepts:
      - the skill and why it mattered for the work
      - what the early learning approach was and why it stalled
      - a specific change in method (practice, mentor, project, resources)
      - evidence of the skill being applied afterwards
    rubric:
      excellent: Names a job-relevant skill, diagnoses why their first way of learning stalled, describes a deliberate change of method, and shows the skill being used successfully in real work.
      good: Describes a real learning struggle and how they got through it.
      weak: Claims nothing has ever been hard to learn, or gives no change in method.
    followups:
      - How did you know you'd actually got better at it?
    common_errors:
      - Describing a skill that was learned easily, which avoids the question.

  - external_key: behavioral.failure_resilience.work_sent_back
    competency_key: ownership
    topic: Work that came back needing major rework
    difficulty: easy
    text: >-
      Tell me about a piece of work you handed over that came back needing a lot of rework. What did the feedback
      say, and how did you approach the second version?
    expected_concepts:
      - what was handed over and what was wrong with it
      - understanding the feedback rather than defending the work
      - how the second version was approached differently
      - result of the rework
      - how they check work before handing over now
    rubric:
      excellent: Summarises the feedback accurately, shows they understood the underlying gap, describes a different approach to the second version and a lasting pre-handover check.
      good: Takes the feedback on board and delivers an improved version.
      weak: Argues that the feedback was wrong without engaging with it, or describes only minor edits.
    followups:
      - Was there any feedback you disagreed with, and what did you do about it?
    common_errors:
      - Treating rework as the reviewer's preference rather than a quality gap.

  - external_key: behavioral.failure_resilience.asked_for_help_too_late
    competency_key: ownership
    topic: Waiting too long to ask for help
    difficulty: easy
    text: >-
      Describe a time you stayed stuck on something for longer than you should have before asking for help. What
      held you back from asking, and how do you decide when to ask now?
    expected_concepts:
      - the problem and how long they were stuck
      - why they did not ask sooner
      - what happened once they did ask
      - a concrete rule or signal they now use to ask earlier
    rubric:
      excellent: Gives a specific example with the time lost, reflects on why they delayed, and describes a concrete rule such as a time box they now follow.
      good: Recognises the delay and states a reasonable intention to ask sooner.
      weak: Says they never need help or describes no change.
    followups:
      - What did the person you eventually asked do that unblocked you?
    common_errors:
      - Framing the delay purely as independence without counting its cost.

  - external_key: behavioral.failure_resilience.lesson_reused_later
    competency_key: ownership
    topic: Applying a lesson from a past failure
    difficulty: easy
    text: >-
      Tell me about a lesson you took from something that went wrong, and then a later situation where that lesson
      actually changed what you did. What was different the second time?
    expected_concepts:
      - the original failure and the lesson drawn
      - the later situation and why it was similar
      - the specific action that changed
      - the different outcome
    rubric:
      excellent: Connects two concrete situations, shows exactly which action changed because of the first failure, and describes the better result.
      good: Gives a real lesson and a later example where it helped.
      weak: States a lesson in the abstract with no later example of using it.
    followups:
      - Have you ever applied that lesson where it didn't fit?
    common_errors:
      - Giving a lesson so general that it could not change any specific action.

  # ------------------------------------------------------------ commitments and judgement (medium)
  - external_key: behavioral.failure_resilience.badly_underestimated
    competency_key: project_management
    topic: Badly underestimating the effort
    difficulty: medium
    text: >-
      Tell me about a time you badly underestimated how long or how hard something would be. What did you miss in
      the original estimate, and how did you reset expectations once you knew?
    expected_concepts:
      - the original estimate and the actual effort
      - what the estimate missed (unknowns, dependencies, integration, testing)
      - when and how they re-estimated
      - how they communicated the new plan
      - how they estimate differently now
    rubric:
      excellent: Quantifies the gap, identifies specifically what the estimate missed, shows an early and clear reset with options, and describes a concrete change in estimating practice.
      good: Explains the overrun and a sensible reset with some lessons.
      weak: Blames scope creep alone, or never reset expectations until the work was late.
    followups:
      - What options did you give people when you reset the plan?
      - How do you account for unknowns in estimates today?
    common_errors:
      - Not separating estimation error from changes in scope.

  - external_key: behavioral.failure_resilience.defect_slipped_through_testing
    competency_key: ownership
    topic: A defect that got past your own checks
    difficulty: medium
    text: >-
      Tell me about a defect in your own work that got past the checks you'd done and reached users or a later
      stage. What exactly did your checks miss, and what did you change about how you verify your work?
    expected_concepts:
      - the defect and who found it
      - why their own checks did not catch it
      - fix and communication to those affected
      - specific improvement to their verification
      - whether the improvement was shared with others
    rubric:
      excellent: Pinpoints the exact gap in their checks, handles the fix and communication responsibly, and describes a specific verification change that would catch that class of defect.
      good: Owns the defect, fixes it and adds some extra checking.
      weak: Treats it as bad luck or relies on someone else to catch such issues in future.
    followups:
      - Would that new check have caught other problems too?
      - How did you decide how much extra checking was worth the time?
    common_errors:
      - Adding a test for the single case rather than addressing the class of problem.

  - external_key: behavioral.failure_resilience.overcommitted_and_renegotiated
    competency_key: ownership
    topic: Taking on too much
    difficulty: medium
    text: >-
      Describe a period when you took on more than you could deliver well and something suffered because of it.
      How did you recognise it, and what did you renegotiate or hand off?
    expected_concepts:
      - what they had committed to and why they said yes
      - the signal that quality or timing was suffering
      - prioritisation of what mattered most
      - renegotiating or handing off with the people involved
      - how they decide what to take on now
    rubric:
      excellent: Gives a specific example of overload with a visible cost, describes a deliberate prioritisation and open renegotiation with stakeholders, and a clear rule they now use before accepting work.
      good: Recognises the overload and drops or delays something sensibly.
      weak: Claims they just worked longer hours and everything was fine, or never told anyone.
    followups:
      - How did the person whose work you deprioritised respond?
    common_errors:
      - Presenting working longer hours as the only solution.

  - external_key: behavioral.failure_resilience.rebuilt_trust_after_mistake
    competency_key: ownership
    topic: Rebuilding a colleague's trust after a mistake
    difficulty: medium
    text: >-
      Tell me about a time a mistake of yours cost you some trust with a colleague, a manager or a customer. What
      did you do over the following weeks to earn it back?
    expected_concepts:
      - the mistake and how it affected the relationship
      - direct acknowledgement without excuses
      - consistent follow-through over time
      - signs that trust was restored
    rubric:
      excellent: Describes a concrete loss of trust, a direct acknowledgement, a sustained pattern of specific actions afterwards, and observable evidence the relationship recovered.
      good: Acknowledges the mistake and describes reasonable follow-up actions.
      weak: Assumes an apology alone fixed it or cannot describe any change in behaviour.
    followups:
      - How did you know the trust had come back?
      - Was there anything you did that didn't help?
    common_errors:
      - Focusing on the apology and not on the follow-through.

  - external_key: behavioral.failure_resilience.found_own_unnoticed_error
    competency_key: culture_values
    topic: Disclosing a mistake nobody else had noticed
    difficulty: medium
    text: >-
      Tell me about a time you discovered an error in work you'd already delivered that nobody else had noticed
      yet. How did you decide what to do about it, and who did you tell?
    expected_concepts:
      - the error and its potential impact
      - deciding to disclose rather than quietly ignore it
      - who was informed and how quickly
      - correcting the work and any downstream effects
    rubric:
      excellent: Explains the potential impact, discloses promptly to the right people with a clear account and a fix, and checks for downstream effects of the error.
      good: Discloses and fixes the error with reasonable communication.
      weak: Fixes it silently when others relied on the earlier output, or leaves it unaddressed.
    followups:
      - Had anyone already made decisions based on the wrong version?
    common_errors:
      - Quietly patching work that others had already used.

  - external_key: behavioral.failure_resilience.assumption_proved_false
    competency_key: problem_solving
    topic: Acting on an assumption that turned out false
    difficulty: medium
    text: >-
      Describe a decision you made on an assumption that later proved false. Why did the assumption seem safe at
      the time, and how do you test assumptions like that now?
    expected_concepts:
      - the assumption and the decision built on it
      - why it seemed reasonable
      - how it was found to be false and the consequence
      - how the decision was corrected
      - a method for spotting and testing key assumptions
    rubric:
      excellent: Names the assumption explicitly, explains why it was plausible, describes the correction, and gives a concrete method they now use to surface and test critical assumptions early.
      good: Identifies the false assumption and corrects course sensibly.
      weak: Cannot separate the assumption from the outcome, or draws no lesson about checking assumptions.
    followups:
      - What would a cheap test of that assumption have looked like?
    common_errors:
      - Describing bad luck rather than an untested assumption.

  - external_key: behavioral.failure_resilience.many_failed_attempts
    competency_key: problem_solving
    topic: Persisting through many failed attempts
    difficulty: medium
    text: >-
      Tell me about a problem that took you many failed attempts to solve. How did you keep each attempt teaching
      you something rather than just trying things at random?
    expected_concepts:
      - the problem and why it was hard
      - recording what each attempt ruled out
      - narrowing hypotheses systematically
      - knowing when to bring in others or change strategy
      - the eventual solution
    rubric:
      excellent: Shows a disciplined loop of hypothesis, attempt and recorded result, explains how failures narrowed the search, and describes how they eventually solved it.
      good: Persists to a solution with some structured learning between attempts.
      weak: Describes repeated guessing or giving up without a reasoned decision.
    followups:
      - At what point did you consider stopping, and why didn't you?
    common_errors:
      - Equating persistence with repeating the same approach.

  - external_key: behavioral.failure_resilience.fell_short_of_target
    competency_key: ownership
    topic: Falling short of a goal you owned
    difficulty: medium
    text: >-
      Tell me about a goal or target you were responsible for that you didn't reach. How did you explain the
      shortfall, and what did you do with what you learned?
    expected_concepts:
      - the goal and how far short it fell
      - analysis of why it was missed
      - how the shortfall was reported
      - what was still achieved
      - changes made in the next cycle
    rubric:
      excellent: Quantifies the shortfall, separates causes within and outside their control, reports it plainly with what was learned, and shows the next cycle was planned differently.
      good: Explains the miss with reasonable analysis and some changes.
      weak: Reframes the miss as a success or attributes it wholly to others.
    followups:
      - Was the goal itself the right one, looking back?
    common_errors:
      - Redefining the goal after the fact so that it looks met.

  - external_key: behavioral.failure_resilience.raised_risk_too_late
    competency_key: communication
    topic: Raising a risk too late
    difficulty: medium
    text: >-
      Describe a time you saw a risk building on a piece of work but raised it later than you should have. What
      made you wait, and what did the delay cost?
    expected_concepts:
      - the risk and when they first noticed it
      - the reasons for waiting
      - impact of the late warning
      - how they raise risks earlier now
    rubric:
      excellent: Gives a clear timeline from first signal to escalation, reflects on why they waited, quantifies the cost of the delay, and describes a concrete practice for raising risks early.
      good: Admits the late escalation and states a reasonable lesson.
      weak: Sees nothing wrong with the delay or cannot describe its cost.
    followups:
      - How would you word that early warning if you could do it again?
    common_errors:
      - Waiting for certainty before raising a risk and not recognising that as the problem.

  - external_key: behavioral.failure_resilience.my_message_caused_problem
    competency_key: communication
    topic: When your own communication caused a problem
    difficulty: medium
    text: >-
      Tell me about a problem that happened mainly because of something you communicated badly, whether it was
      unclear, incomplete or sent to the wrong people. How did you untangle it?
    expected_concepts:
      - what was communicated and what went wrong
      - the resulting confusion or mistake
      - how they corrected the record
      - a change in how they communicate
    rubric:
      excellent: Pinpoints exactly what was unclear or missing in their own message, corrects the record quickly with the affected people, and describes a specific communication habit they changed.
      good: Recognises their role in the confusion and fixes it.
      weak: Blames the readers for misunderstanding.
    followups:
      - How did you make sure everyone saw the correction?
    common_errors:
      - Assuming a follow-up message alone repaired the damage.

  - external_key: behavioral.failure_resilience.own_part_in_team_failure
    competency_key: ownership
    topic: Your part in a team failure
    difficulty: medium
    text: >-
      Think of something a team you were on failed to deliver. Leaving the rest of the team aside, what was your
      own contribution to that failure, and what have you done differently since?
    expected_concepts:
      - what the team failed to deliver
      - their own specific contribution to the failure
      - actions they took during the recovery
      - concrete changes in their own behaviour since
    rubric:
      excellent: Clearly separates their own contribution from the team's, names a specific thing they did or failed to do, and shows a lasting change in their own practice.
      good: Identifies a real personal contribution and some change.
      weak: Talks only about the team or others and names no part of their own.
    followups:
      - What would others on that team say your part was?
    common_errors:
      - Using "we" throughout so that their own role is never clear.

  # ------------------------------------------------------------ high-stakes mistakes (hard)
  - external_key: behavioral.failure_resilience.irreversible_action
    competency_key: ownership
    topic: An action that could not be undone
    difficulty: hard
    text: >-
      Tell me about a time you did something at work that couldn't simply be undone, like deleting data, sending
      something to the wrong audience or making a commitment you couldn't keep. How did you handle the first hour,
      and what safeguards came out of it?
    expected_concepts:
      - the action and why it was irreversible
      - immediate containment and who was informed
      - limiting further damage and recovering what was possible
      - root cause beyond individual error
      - safeguards that make the action harder to do by accident
    rubric:
      excellent: Describes fast containment and early disclosure, recovers what could be recovered, analyses why the system allowed the action, and introduces safeguards such as confirmation steps, backups or permissions that protect others too.
      good: Handles the immediate situation well and adds a reasonable safeguard.
      weak: Focuses on how bad it felt rather than what was done, or relies only on being more careful.
    followups:
      - Who did you tell first, and why them?
      - Did the safeguard you introduced slow anything else down?
    common_errors:
      - Treating it as purely personal error when the process made it easy.

  - external_key: behavioral.failure_resilience.cost_another_team_work
    competency_key: collaboration
    topic: A mistake that cost another team significant work
    difficulty: hard
    text: >-
      Describe a mistake of yours that created a lot of extra work or disruption for another team. How did you
      approach that team, and what did you do to make it right beyond fixing the original issue?
    expected_concepts:
      - the mistake and its effect on the other team
      - approaching them directly and acknowledging the cost
      - offering concrete help with the cleanup
      - changing interfaces or processes so it would not recur
      - state of the working relationship afterwards
    rubric:
      excellent: Quantifies the impact on the other team, describes going to them directly, contributing real effort to their cleanup, and changing a shared process or interface to prevent recurrence.
      good: Acknowledges the impact and helps resolve it.
      weak: Leaves the other team to absorb the cost, or communicates only through a ticket.
    followups:
      - What did that team ask of you, and did you agree to all of it?
    common_errors:
      - Fixing their own side and treating the other team's cleanup as not their problem.

  - external_key: behavioral.failure_resilience.repeating_same_mistake
    competency_key: ownership
    topic: Breaking a pattern of repeated mistakes
    difficulty: hard
    text: >-
      Tell me about a time you realised you kept making the same kind of mistake. How did you work out what was
      really causing it, and what finally broke the pattern?
    expected_concepts:
      - recognising the recurrence rather than isolated incidents
      - analysing the underlying cause (habit, environment, knowledge gap)
      - a structural change rather than willpower
      - evidence that the pattern stopped
    rubric:
      excellent: Shows they noticed the pattern themselves, digs to an underlying cause, introduces a structural fix such as a tool, checklist or changed workflow, and gives evidence it worked.
      good: Recognises the pattern and makes a change that helps.
      weak: Relies on trying harder each time, or needed others to point out the pattern repeatedly.
    followups:
      - How long did it take you to notice it was a pattern?
    common_errors:
      - Describing a single mistake rather than a recurring one.

  - external_key: behavioral.failure_resilience.high_visibility_failure
    competency_key: ownership
    topic: Leading the recovery from a highly visible failure
    difficulty: hard
    text: >-
      Tell me about a failure you were responsible for that senior people or many users noticed. How did you run
      the recovery, and how did you report on it to the people who needed answers?
    expected_concepts:
      - scale and visibility of the failure
      - organising the recovery and priorities
      - regular, factual updates to leadership or users
      - root-cause analysis and corrective actions
      - follow-through on the commitments made
    rubric:
      excellent: Describes a structured recovery, regular factual updates that included their own part, a root-cause analysis, and commitments that were tracked to completion.
      good: Recovers effectively and communicates reasonably with leadership.
      weak: Minimises their responsibility, gives vague updates, or stops once the immediate problem was fixed.
    followups:
      - What did you leave out of the updates, if anything, and why?
      - Which corrective action was hardest to get done?
    common_errors:
      - Ending the story when service was restored, with no follow-through.

  - external_key: behavioral.failure_resilience.wrong_call_under_time_pressure
    competency_key: problem_solving
    topic: Judging a fast decision that turned out wrong
    difficulty: hard
    text: >-
      Describe a decision you had to make quickly that turned out badly. Looking back, how do you separate whether
      it was a poor decision or a reasonable one with a bad outcome?
    expected_concepts:
      - the decision, time pressure and information available
      - the outcome and its impact
      - judging the decision on the information available at the time
      - what would have been worth gathering even under pressure
      - how they make fast decisions now
    rubric:
      excellent: Reconstructs what was known at the time, distinguishes decision quality from outcome, identifies specifically what they would do differently, and describes a changed approach to fast decisions.
      good: Reflects sensibly on the decision and draws a reasonable lesson.
      weak: Judges the decision only by its outcome or defends it without reflection.
    followups:
      - What one piece of information would have changed your decision?
    common_errors:
      - Using hindsight as if it had been available at the time.
