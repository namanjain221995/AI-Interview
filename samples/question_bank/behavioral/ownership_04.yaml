# Behavioural questions: ownership (accountability, follow-through, owning mistakes, responsible
# initiative beyond the assigned scope). Questions ask for real past examples; evaluation is based
# only on the content of the example (actions, results, reflection), never on delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  - external_key: behavioral.ownership.followed_up_after_others_moved_on
    competency_key: ownership
    topic: Following up after everyone else moved on
    difficulty: easy
    text: >-
      Tell me about a time you went back to check on something after everyone else had moved on, and it turned
      out to matter. What made you go back to it?
    expected_concepts:
      - what had been considered finished
      - the reason they went back
      - what they found
      - action taken as a result
    rubric:
      excellent: Explains a specific reason for going back, finds a real problem or loose end and acts on it, showing the impact this prevented.
      good: Follows up and finds something worth acting on.
      weak: The follow-up found nothing of consequence or was prompted by someone else.
    followups:
      - How do you decide which finished things are worth revisiting?
    common_errors:
      - Describing routine follow-up that was part of the assigned task.

  - external_key: behavioral.ownership.task_owned_start_to_finish
    competency_key: ownership
    topic: Owning a task from start to finish
    difficulty: easy
    text: >-
      Pick a recent piece of work you owned from start to finish. Walk me through how you kept it on track and
      what finishing it properly looked like.
    expected_concepts:
      - the goal and who it was for
      - planning and tracking progress
      - handling a problem along the way
      - definition of finished
      - confirming the result
    rubric:
      excellent: Gives a clear goal, shows how they tracked progress and handled a problem along the way, and defines finished in terms of the outcome rather than the activity.
      good: Describes a well-run piece of work with a clear end.
      weak: Describes the work in general terms with no sense of how it was kept on track.
    followups:
      - What was the riskiest moment?
    common_errors:
      - Choosing work where they owned only one step.

  - external_key: behavioral.ownership.implemented_own_suggestion
    competency_key: ownership
    topic: Turning your own suggestion into reality
    difficulty: easy
    text: >-
      Tell me about a small improvement you suggested and then went on to put in place yourself, rather than
      leaving it as an idea. How did you get it done alongside your normal work?
    expected_concepts:
      - the improvement and why it mattered
      - getting agreement where needed
      - fitting it around existing work
      - result
    rubric:
      excellent: Gets agreement where needed, makes time without dropping existing commitments and delivers a working improvement with a visible benefit.
      good: Implements the suggestion with a reasonable result.
      weak: The suggestion stayed an idea or was implemented by someone else.
    followups:
      - What happens to most suggestions on your team?
    common_errors:
      - Describing an idea that someone else implemented.

  - external_key: behavioral.ownership.first_full_responsibility
    competency_key: ownership
    topic: The first time you were fully responsible
    difficulty: easy
    text: >-
      Tell me about the first time you were given full responsibility for something at work. What did you do to
      make sure it went well?
    expected_concepts:
      - what they were responsible for
      - preparation and planning
      - seeking advice where useful
      - outcome and what they learned
    rubric:
      excellent: Describes concrete preparation, uses advice appropriately, delivers the outcome and reflects specifically on what they learned about being responsible.
      good: Prepares sensibly and delivers.
      weak: Describes the role with little about their own actions.
    followups:
      - What would you tell someone in that position now?
    common_errors:
      - Describing a role title rather than an actual responsibility.

  - external_key: behavioral.ownership.promising_ready_dates
    competency_key: ownership
    topic: Making realistic promises about when work will be ready
    difficulty: easy
    text: >-
      When someone asks you when your work will be ready, how do you decide what to promise? Tell me about a
      time you got that right, or got it wrong.
    expected_concepts:
      - understanding the work before committing
      - allowing for uncertainty
      - communicating confidence or ranges
      - updating the promise as things change
    rubric:
      excellent: Describes a deliberate way of setting a date with allowance for uncertainty, updates it as they learn more and gives a real example with the outcome.
      good: Gives a reasonable approach and a real example.
      weak: Promises what the asker wants to hear.
    followups:
      - How do you handle someone pushing for an earlier date?
    common_errors:
      - Padding every estimate heavily and calling it reliability.

  - external_key: behavioral.ownership.finished_more_thoroughly
    competency_key: ownership
    topic: Finishing work more thoroughly than required
    difficulty: easy
    text: >-
      Tell me about a piece of work you're proud of because of how thoroughly you finished it. What did you do
      that someone else might have skipped?
    expected_concepts:
      - the work and its purpose
      - specific extra steps taken
      - why those steps mattered
      - benefit that resulted
    rubric:
      excellent: Names specific steps beyond the minimum, explains why each mattered for the people using the work and shows a resulting benefit.
      good: Describes thorough work with a reasonable explanation.
      weak: Describes the work without anything beyond the minimum.
    followups:
      - How did you decide where thoroughness stopped being worth it?
    common_errors:
      - Confusing polish nobody needed with thoroughness.

  - external_key: behavioral.ownership.acted_on_near_miss
    competency_key: ownership
    topic: Acting on a near miss
    difficulty: easy
    text: >-
      Tell me about a near miss in your work, something that almost went wrong but didn't. What did you do
      about it, even though no harm was done?
    expected_concepts:
      - the near miss and what could have happened
      - investigating why it nearly happened
      - sharing it with others
      - change to prevent it
    rubric:
      excellent: Treats the near miss seriously, finds out why it happened, shares it with the people who could be affected and makes a preventive change.
      good: Investigates and makes a reasonable change.
      weak: Moves on because nothing actually went wrong.
    followups:
      - Did you tell anyone about it, and why?
    common_errors:
      - Describing an actual incident as a near miss.

  - external_key: behavioral.ownership.trusted_with_sensitive_access
    competency_key: ownership
    topic: Handling sensitive access responsibly
    difficulty: easy
    text: >-
      Tell me about a time you were given access to something sensitive or important, like customer data,
      money or a live system. How did you make sure you handled that responsibility carefully?
    expected_concepts:
      - what the access covered
      - using only what was needed
      - safeguards they applied
      - giving up access when no longer needed
    rubric:
      excellent: Uses only the access the task required, applies specific safeguards such as double checks or logging, and gives up access when finished.
      good: Describes careful handling with some safeguards.
      weak: Describes the access but nothing about how they handled it.
    followups:
      - What would you do if you made a mistake with that access?
    common_errors:
      - Assuming access granted means any use is fine.

  - external_key: behavioral.ownership.repaired_partner_relationship
    competency_key: ownership
    topic: Taking over a troubled working relationship
    difficulty: medium
    text: >-
      Tell me about a time you took over a working relationship with a customer, supplier or partner team that
      wasn't going well. What did you do to take ownership of it?
    expected_concepts:
      - state of the relationship and its causes
      - listening to the other side
      - acknowledging past failures
      - concrete commitments and delivery
      - improvement in the relationship
    rubric:
      excellent: Understands the other side's view, acknowledges past failures without blaming predecessors, makes and keeps specific commitments and shows the relationship improved.
      good: Improves the relationship through reliable delivery.
      weak: Blames the previous owner or the other side.
    followups:
      - What did the other side need that they hadn't been getting?
    common_errors:
      - Focusing on the difficulty of the other party.

  - external_key: behavioral.ownership.found_report_people_relied_on_wrong
    competency_key: ownership
    topic: Acting on a widely used number that was wrong
    difficulty: medium
    text: >-
      Tell me about a time you found that a number or report other people relied on was wrong, and you weren't
      the one who produced it. What did you do?
    expected_concepts:
      - how they found the error
      - verifying before raising it
      - informing the owner and users
      - helping correct it
      - preventing recurrence
    rubric:
      excellent: Verifies the error, tells the owner promptly, helps make sure people who relied on it are informed and supports a fix that prevents recurrence.
      good: Verifies and reports the error to the owner.
      weak: Works around the error privately or mentions it without verifying.
    followups:
      - Had anyone made decisions based on it?
    common_errors:
      - Fixing it in their own copy only.

  - external_key: behavioral.ownership.followed_work_end_to_end
    competency_key: ownership
    topic: Following your work beyond your part of the process
    difficulty: medium
    text: >-
      Tell me about a time you followed your work beyond your own part of the process, for example into how it
      was used, sold or supported, to make sure it worked end to end. What did you learn?
    expected_concepts:
      - their part and the downstream steps
      - why they followed it further
      - problems discovered downstream
      - changes made as a result
    rubric:
      excellent: Follows the work into later stages deliberately, uncovers a real problem their part caused or missed and changes their work or the handoff as a result.
      good: Looks downstream and learns something useful.
      weak: Treats their part as finished at the handoff.
    followups:
      - Who downstream did you talk to?
    common_errors:
      - Taking over the downstream team's work rather than learning from it.

  - external_key: behavioral.ownership.supplier_failed_at_key_moment
    competency_key: ownership
    topic: Owning the outcome when a supplier or tool fails
    difficulty: medium
    text: >-
      Tell me about a time a tool, supplier or system you relied on let you down at an important moment. How
      did you take responsibility for the outcome rather than just the explanation?
    expected_concepts:
      - the failure and its impact
      - immediate workaround to protect the outcome
      - communicating with those affected
      - reducing future reliance or adding a fallback
    rubric:
      excellent: Protects the outcome with a workaround, keeps those affected informed and reduces the future risk with a fallback or a change in dependency.
      good: Finds a workaround and limits the damage.
      weak: Reports the failure as the reason the outcome was missed.
    followups:
      - What fallback do you have now?
    common_errors:
      - Treating an external failure as fully outside their responsibility.

  - external_key: behavioral.ownership.raised_own_error_in_retro
    competency_key: ownership
    topic: Raising your own mistake in a review
    difficulty: medium
    text: >-
      Tell me about a review or retrospective where you raised something you had done wrong yourself. How did
      you bring it up, and what came of it?
    expected_concepts:
      - what they had done wrong
      - choosing to raise it themselves
      - framing it so the team could learn
      - resulting change
    rubric:
      excellent: Raises their own mistake plainly, frames it around what the team can change and shows a concrete improvement that followed.
      good: Raises the mistake and contributes to a lesson.
      weak: Mentions it only after someone else brought it up.
    followups:
      - How did raising it affect what others shared?
    common_errors:
      - Picking a minor issue to appear open.

  - external_key: behavioral.ownership.organised_leaderless_effort
    competency_key: ownership
    topic: Organising shared work that had no lead
    difficulty: medium
    text: >-
      Tell me about a time a piece of shared work had no clear lead and you stepped in to organise it. How did
      you take on that role without stepping on anyone's toes?
    expected_concepts:
      - why the work lacked a lead
      - checking with others before stepping in
      - organising the work and the people
      - result and handing the role on if needed
    rubric:
      excellent: Checks that nobody else was leading, gets agreement from the people involved, organises the work effectively and delivers a result.
      good: Steps in and organises the work with a reasonable result.
      weak: Takes control without checking with others, or organises little.
    followups:
      - How did you know nobody else was already leading it?
    common_errors:
      - Assuming leadership by acting first.

  - external_key: behavioral.ownership.reversed_own_decision
    competency_key: ownership
    topic: Reversing a decision you made
    difficulty: medium
    text: >-
      Tell me about a decision you made that you later went back and reversed because new information showed it
      was wrong. How did you handle undoing it?
    expected_concepts:
      - the original decision and its reasoning
      - new information that changed it
      - explaining the reversal to others
      - managing the cost of undoing it
    rubric:
      excellent: Explains the original reasoning, acts promptly on the new information, explains the reversal openly and manages the cost of undoing it.
      good: Reverses the decision and explains it to the people affected.
      weak: Delays the reversal to avoid admitting the mistake.
    followups:
      - What did undoing it cost?
    common_errors:
      - Framing the reversal as someone else's call.

  - external_key: behavioral.ownership.caught_problems_mid_work
    competency_key: ownership
    topic: Checking work in progress to surface problems early
    difficulty: medium
    text: >-
      Tell me how you check on work you're responsible for while it's still in progress, so problems show up
      early rather than at the end. Give me an example where that helped.
    expected_concepts:
      - checkpoints during the work
      - early feedback from users or reviewers
      - the problem caught early
      - cost avoided
    rubric:
      excellent: Builds in deliberate checkpoints or early feedback, gives a real example of a problem caught early and explains what it would have cost if found at the end.
      good: Describes reasonable in-progress checks with an example.
      weak: Only checks the work when it is finished.
    followups:
      - How do you decide how often to check?
    common_errors:
      - Describing status meetings rather than checks of the work itself.

  - external_key: behavioral.ownership.warning_ignored_then_happened
    competency_key: ownership
    topic: Responding when an ignored warning comes true
    difficulty: medium
    text: >-
      Tell me about a time you raised a warning that wasn't acted on, and then the problem happened. What did
      you do at that point?
    expected_concepts:
      - the original warning and why it was not acted on
      - focusing on fixing the problem
      - avoiding blame
      - improving how warnings are raised and handled
    rubric:
      excellent: Focuses on resolving the problem rather than being proven right, reflects on how they could have raised the warning more effectively and helps improve how such warnings are handled.
      good: Helps fix the problem and draws a lesson.
      weak: Mainly points out that they had warned people.
    followups:
      - How could you have made the warning harder to ignore?
    common_errors:
      - Telling the story to show they were right.

  - external_key: behavioral.ownership.ensured_standard_actually_met
    competency_key: ownership
    topic: Making sure a standard is actually met
    difficulty: medium
    text: >-
      Tell me about a time you were responsible for making sure something met a rule, standard or policy. How
      did you make sure it was actually met and not just signed off?
    expected_concepts:
      - the standard and why it mattered
      - understanding its intent
      - checking evidence rather than declarations
      - dealing with gaps found
    rubric:
      excellent: Understands the intent behind the standard, checks real evidence that it is met, finds and closes gaps and records how it was verified.
      good: Checks compliance with reasonable evidence.
      weak: Relies on sign-offs or declarations without checking.
    followups:
      - What gap did you find that a sign-off would have missed?
    common_errors:
      - Treating a completed form as proof.

  - external_key: behavioral.ownership.solved_the_wrong_problem
    competency_key: ownership
    topic: Realising you solved the wrong problem
    difficulty: medium
    text: >-
      Tell me about a time you finished a piece of work and realised you'd solved the wrong problem, or only
      part of it. What did you do next?
    expected_concepts:
      - how they realised
      - telling the people involved
      - going back to the real problem
      - change in how they confirm problems upfront
    rubric:
      excellent: Raises it as soon as they realise, goes back to understand the real problem, delivers a fix for it and changes how they confirm the problem before starting.
      good: Acknowledges the miss and corrects course.
      weak: Presents the original work as good enough.
    followups:
      - What question would have caught it at the start?
    common_errors:
      - Blaming the requester for describing the problem badly.

  - external_key: behavioral.ownership.rebuilt_plan_that_fell_apart
    competency_key: adaptability
    topic: Rebuilding a plan that fell apart
    difficulty: medium
    text: >-
      Tell me about a plan you were responsible for that fell apart partway through. How did you rebuild it, and
      how did you bring people along with the new plan?
    expected_concepts:
      - what broke the plan
      - assessing what was still achievable
      - building the new plan with the people involved
      - communicating the change
      - delivering on the new plan
    rubric:
      excellent: Diagnoses why the plan broke, builds a realistic new plan with the people involved, communicates the change clearly and delivers on it.
      good: Rebuilds the plan and delivers a reasonable outcome.
      weak: Patches the old plan without addressing why it failed.
    followups:
      - What was the first thing you did once you knew the plan had failed?
    common_errors:
      - Rebuilding the plan alone and announcing it.

  - external_key: behavioral.ownership.most_serious_failure_part
    competency_key: ownership
    topic: Your part in a serious failure
    difficulty: hard
    text: >-
      Tell me about the most serious failure you've been closely involved in at work. What was your part in it,
      what did you do in the days after, and what is different now because of you?
    expected_concepts:
      - the failure and its impact
      - their own specific contribution
      - actions in the immediate aftermath
      - lasting changes they drove
    rubric:
      excellent: Chooses a genuinely serious failure, states their own part precisely, describes strong action afterwards and points to lasting changes they personally drove.
      good: Describes a real failure and their contribution with useful changes.
      weak: Chooses a minor failure or describes their part as minimal.
    followups:
      - What did you find hardest to admit about your part?
    common_errors:
      - Describing a failure in which they were only a bystander.

  - external_key: behavioral.ownership.inherited_blame_for_failing_area
    competency_key: ownership
    topic: Being held accountable for problems you inherited
    difficulty: hard
    text: >-
      Tell me about a time you inherited responsibility for something that was already failing, and people held
      you accountable for problems you hadn't caused. How did you handle that?
    expected_concepts:
      - the state of what they inherited
      - accepting accountability going forward
      - setting expectations with stakeholders
      - a recovery plan and visible progress
    rubric:
      excellent: Accepts accountability for the outcome from that point without dwelling on the past, resets expectations with a credible recovery plan and shows visible progress.
      good: Takes ownership and makes progress with reasonable communication.
      weak: Spends the effort establishing that the problems were not theirs.
    followups:
      - How did you describe the history without blaming anyone?
    common_errors:
      - Using the predecessor as an explanation for slow progress.

  - external_key: behavioral.ownership.wider_good_over_own_goals
    competency_key: ownership
    topic: Putting the wider organisation ahead of your own goals
    difficulty: hard
    text: >-
      Tell me about a time doing the right thing for the wider organisation meant your own goals or project would
      look worse. What did you decide, and how did you explain it?
    expected_concepts:
      - the conflict between local and wider goals
      - how they weighed the trade-off
      - discussing it with whoever set their goals
      - decision and consequences
    rubric:
      excellent: Makes the trade-off explicit, discusses it with whoever set their goals, chooses the wider outcome where justified and accepts the effect on their own results.
      good: Makes a reasonable decision and explains it.
      weak: Protects their own metrics, or the example contains no real trade-off.
    followups:
      - How was it reflected in how your work was judged?
    common_errors:
      - Describing a choice that cost them nothing.

  - external_key: behavioral.ownership.missed_target_i_owned
    competency_key: ownership
    topic: Reporting a target you owned and missed
    difficulty: hard
    text: >-
      Tell me about a target or measure of success you personally owned and didn't hit. How did you report it,
      and what did you change as a result?
    expected_concepts:
      - the target and how far off it was
      - when the shortfall became clear
      - reporting it plainly with causes
      - corrective actions
      - change in how targets are set or tracked
    rubric:
      excellent: Reports the miss plainly and early, analyses the causes including their own decisions and makes specific changes that improved later results or target setting.
      good: Reports the miss and takes reasonable corrective action.
      weak: Reframes the target or blames external conditions.
    followups:
      - When did you first know you would miss it?
    common_errors:
      - Choosing a target they nearly hit.

  - external_key: behavioral.ownership.stepped_in_made_it_worse
    competency_key: ownership
    topic: When stepping outside your role made things worse
    difficulty: hard
    text: >-
      Tell me about a time you stepped outside your role to help with something, and your involvement made
      things worse. How did you handle it, and how has it shaped the way you step in now?
    expected_concepts:
      - why they stepped in
      - what went wrong
      - owning it with the actual owners
      - helping repair the damage
      - clearer judgement about when to step in
    rubric:
      excellent: Acknowledges the harm to the actual owners directly, helps repair it under their direction and describes a clear, specific test they now apply before stepping in.
      good: Owns the mistake and draws a reasonable lesson.
      weak: Excuses it as well intentioned or blames the owners for the confusion.
    followups:
      - What would you check now before stepping in?
    common_errors:
      - Concluding they should never help outside their role.
