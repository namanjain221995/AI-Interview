# Behavioural: working under pressure and tight deadlines (part 4 of 4) - same-day requests, late
# feedback, pre-mortems, review discipline, fixed change windows, status reporting and long pushes.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------------------------- easy
  - external_key: behavioral.pressure_deadlines.own_task_or_unblock_colleague
    competency_key: ownership
    topic: Your own deadline versus unblocking a colleague
    difficulty: easy
    text: >-
      Tell me about a time you had to choose between finishing your own task on time and helping unblock a
      colleague who was waiting on you. How did you decide?
    expected_concepts:
      - what each piece of work was and its deadline
      - which delay would cost more overall
      - a quick unblock versus a full answer
      - telling both sides about the choice
      - outcome for both pieces of work
    rubric:
      excellent: Compares the overall cost of each delay, finds a way to unblock quickly where possible, keeps both sides informed, and reports the result for both.
      good: Gives a real example with a reasonable choice.
      weak: Always puts their own task first, or drops it without considering the effect.
    followups:
      - Was there a way to do a bit of both?
      - Did the colleague know you had your own deadline?
    common_errors:
      - Only considering their own deadline rather than the team's overall progress.

  - external_key: behavioral.pressure_deadlines.planned_time_away_before_deadline
    competency_key: ownership
    topic: Planned time away close to a deadline
    difficulty: easy
    text: >-
      Tell me about a time you had planned time away from work close to an important deadline. What did you do
      beforehand so the deadline wasn't put at risk?
    expected_concepts:
      - noticing the overlap early
      - finishing or front-loading the critical parts
      - a clear hand-over of what remained
      - agreeing who would make decisions while away
      - outcome
    rubric:
      excellent: Describes spotting the overlap early, front-loading critical work, a clear hand-over with decision owners agreed, and a deadline outcome that did not depend on them.
      good: Gives a real example with reasonable preparation.
      weak: Left without preparation, or describes only finishing at the last minute.
    followups:
      - What did you hand over, and to whom?
      - Did anything come up that the hand-over didn't cover?
    common_errors:
      - Leaving decisions undelegated so the work stalled while they were away.

  - external_key: behavioral.pressure_deadlines.same_day_turnaround
    competency_key: ownership
    topic: A same-day request
    difficulty: easy
    text: >-
      Tell me about a time someone needed something from you by the end of the same day. How did you fit it in,
      and what happened to the work you'd planned?
    expected_concepts:
      - confirming the request was truly needed that day
      - clarifying the minimum that would meet the need
      - re-planning the rest of the day
      - telling anyone affected by the change
      - outcome for the request and the planned work
    rubric:
      excellent: Confirms the real urgency and minimum need, re-plans the day, tells anyone affected, and reports outcomes for both the request and the displaced work.
      good: Gives a real example of fitting in an urgent request with a result.
      weak: Dropped everything without checking the need, or said yes and missed it.
    followups:
      - Did you check whether it really had to be that day?
      - What did you move to make room?
    common_errors:
      - Not telling anyone that planned work had been pushed back.

  - external_key: behavioral.pressure_deadlines.major_feedback_late
    competency_key: adaptability
    topic: Major feedback arriving just before a deadline
    difficulty: easy
    text: >-
      Tell me about a time you got significant feedback on your work very close to its deadline. How did you
      decide which of it to act on before the date?
    expected_concepts:
      - the feedback and when it arrived
      - sorting essential changes from later improvements
      - checking with the giver of the feedback
      - acting on the essentials
      - follow-up on the rest and getting feedback earlier next time
    rubric:
      excellent: Sorts the feedback into essential and later changes, agrees the split with the giver, acts on the essentials, and describes how they got feedback earlier on later work.
      good: Gives a real example of handling late feedback sensibly.
      weak: Ignored the feedback, or tried to apply all of it and missed the date.
    followups:
      - What did you postpone, and did you come back to it?
      - Why did the feedback arrive so late?
    common_errors:
      - Not asking for feedback earlier on later work.

  - external_key: behavioral.pressure_deadlines.realised_wrong_priority
    competency_key: ownership
    topic: Realising you were working on the wrong thing
    difficulty: easy
    text: >-
      Tell me about a time you realised, with a deadline approaching, that you'd been spending your time on the
      wrong thing. How did you notice, and what did you do?
    expected_concepts:
      - what they were working on and what mattered more
      - how they noticed
      - switching quickly
      - telling anyone affected
      - what they changed to catch it earlier
    rubric:
      excellent: Explains how they noticed, switched promptly, told those affected, and describes a concrete habit that helps them catch misdirected effort earlier.
      good: Gives a real example with a quick correction.
      weak: Did not notice until someone told them, and changed nothing afterwards.
    followups:
      - How much time had gone on the wrong thing?
      - What do you check now to avoid it?
    common_errors:
      - Finishing the wrong work first because it was nearly done.

  - external_key: behavioral.pressure_deadlines.making_review_easy_for_others
    competency_key: collaboration
    topic: Making it easy for others to review or approve quickly
    difficulty: easy
    text: >-
      Tell me about a time your deadline depended on someone else reviewing or signing off your work. What did
      you do to make it quick and easy for them?
    expected_concepts:
      - who the reviewer was and their constraints
      - giving advance notice of when it would arrive
      - small, well-explained submissions
      - pointing out where they should focus
      - outcome and turnaround time
    rubric:
      excellent: Gives the reviewer advance notice, presents the work in a small, well-explained form with clear focus areas, and reports a fast, useful review.
      good: Gives a real example of preparing work for a quick review.
      weak: Sent a large, unexplained piece of work at the last minute.
    followups:
      - What did you tell the reviewer to focus on?
      - How long did the review take compared with usual?
    common_errors:
      - Assuming the reviewer would be available the moment the work was ready.

  - external_key: behavioral.pressure_deadlines.first_real_deadline_pressure
    competency_key: ownership
    topic: Lessons from an early experience of deadline pressure
    difficulty: easy
    text: >-
      Think back to one of the first times you were under real deadline pressure, at work or on a significant
      project. What happened, and what did you take from it that you still use?
    expected_concepts:
      - the situation and the deadline
      - what they did at the time
      - what went well and badly
      - a specific lesson
      - how they apply that lesson now
    rubric:
      excellent: Describes the situation and their own actions, reflects on what went well and badly, and connects a specific lesson to how they work now with an example.
      good: Gives a real example with a clear lesson.
      weak: Lesson is generic, or not connected to how they work today.
    followups:
      - When did you last use that lesson?
      - What would you tell someone in that situation now?
    common_errors:
      - Describing the situation without any reflection.

  - external_key: behavioral.pressure_deadlines.smoothing_recurring_deadline
    competency_key: problem_solving
    topic: Making a recurring deadline easier
    difficulty: easy
    text: >-
      Tell me about a deadline that came round regularly for you, like a monthly report or a regular release.
      What did you change to make it less of a rush each time?
    expected_concepts:
      - the recurring deadline and where time went
      - finding the steps that caused the rush
      - templates, automation or earlier starts
      - measuring the improvement
      - sharing the improvement with others
    rubric:
      excellent: Identifies where time went, makes specific changes such as templates or automation, measures the improvement, and shares it with others.
      good: Gives a real example of making a recurring deadline smoother.
      weak: Accepted the rush each time without changing anything.
    followups:
      - How much time did the change save each cycle?
      - Who else benefited?
    common_errors:
      - Changing things without checking whether the rush actually reduced.

  # ------------------------------------------------------------------------------- medium
  - external_key: behavioral.pressure_deadlines.pre_mortem_time_boxed_work
    competency_key: ownership
    topic: Anticipating what could make you miss a date
    difficulty: medium
    text: >-
      Before starting a piece of work with a tight, fixed deadline, how did you work out what was most likely
      to make you miss it? Tell me about a time you did that and what you changed as a result.
    expected_concepts:
      - listing ways the deadline could be missed
      - ranking them by likelihood and impact
      - actions taken in advance for the top risks
      - checking those risks during the work
      - whether the anticipated risks happened
    rubric:
      excellent: Lists and ranks specific risks before starting, acts on the top ones in advance, monitors them during the work, and reports which risks occurred and how prepared they were.
      good: Gives a real example of thinking through risks up front with some action.
      weak: Did no risk thinking before starting, or listed risks but did nothing with them.
    followups:
      - Which risk did you miss entirely?
      - Who else did you involve in that exercise?
    common_errors:
      - Listing risks without changing the plan.

  - external_key: behavioral.pressure_deadlines.team_wanted_to_skip_review
    competency_key: culture_values
    topic: Teammates wanting to skip a review step
    difficulty: medium
    text: >-
      Tell me about a time teammates wanted to skip a review or sign-off step to hit a deadline. What did you
      do, and what happened?
    expected_concepts:
      - the step and why it existed
      - the risk of skipping it in that case
      - a faster alternative that kept the protection
      - how the decision was made and by whom
      - outcome
    rubric:
      excellent: Explains the purpose of the step and the specific risk, proposes a faster alternative that kept the protection, and reports how the decision was made and its outcome.
      good: Gives a real example of handling the pressure to skip a step constructively.
      weak: Went along without comment, or blocked the team without offering an alternative.
    followups:
      - Was there a faster version of the review?
      - Who made the final decision?
    common_errors:
      - Defending a process step without explaining what it protects.

  - external_key: behavioral.pressure_deadlines.prototype_became_production
    competency_key: culture_values
    topic: A quick prototype pressed into real use
    difficulty: medium
    text: >-
      Tell me about a time something built quickly as a prototype or demo was suddenly needed for real use on a
      short timeline. How did you decide what had to change before it went live?
    expected_concepts:
      - the gap between prototype and real use
      - identifying must-fix risks, such as data loss or security
      - fixing the essentials before go-live
      - making the remaining gaps visible
      - outcome and later hardening
    rubric:
      excellent: Identifies the specific risks of real use, fixes the essentials before go-live, records the remaining gaps visibly, and shows the later hardening happened.
      good: Gives a real example with sensible essential fixes.
      weak: Put the prototype live unchanged, or refused without considering what was essential.
    followups:
      - What did you insist on fixing first?
      - What was still missing a month later?
    common_errors:
      - Letting the prototype go live without anyone knowing its limits.

  - external_key: behavioral.pressure_deadlines.testing_claimed_urgency
    competency_key: problem_solving
    topic: Checking whether an urgent request is really urgent
    difficulty: medium
    text: >-
      Tell me about a time a request arrived marked urgent, but you suspected it wasn't as urgent as it looked.
      How did you find out, and what did you do with the answer?
    expected_concepts:
      - why they doubted the urgency
      - asking about the consequence of waiting
      - doing so without dismissing the requester
      - re-prioritising based on the answer
      - outcome for the request and other work
    rubric:
      excellent: Asks about the real consequence of waiting in a respectful way, re-prioritises based on the answer, and reports outcomes for both the request and other work.
      good: Gives a real example of checking urgency and acting on it.
      weak: Took every urgent label at face value, or ignored it without asking.
    followups:
      - What question got you the real answer?
      - How did the requester react?
    common_errors:
      - Ignoring a request because of a suspicion without checking.

  - external_key: behavioral.pressure_deadlines.leading_review_after_miss
    competency_key: ownership
    topic: Running a review after a missed date
    difficulty: medium
    text: >-
      Tell me about a time you ran or led the review after a deadline was missed. How did you get to the real
      causes, and what changed afterwards?
    expected_concepts:
      - gathering facts and a timeline
      - focusing on causes rather than individuals
      - distinguishing root causes from symptoms
      - specific actions with owners
      - follow-up on whether the actions worked
    rubric:
      excellent: Builds a factual timeline, keeps the focus on causes not individuals, identifies root causes, assigns specific actions with owners, and checks later that they worked.
      good: Gives a real example of a structured review with actions.
      weak: The review assigned blame or produced no follow-up.
    followups:
      - What was the cause nobody wanted to talk about?
      - Which action actually got done?
    common_errors:
      - Producing a long list of actions that nobody owned.

  - external_key: behavioral.pressure_deadlines.evidence_to_move_deadline
    competency_key: communication
    topic: Using evidence to argue for moving a deadline
    difficulty: medium
    text: >-
      Tell me about a time you used data or concrete evidence to convince someone that a deadline needed to
      move. What evidence did you use, and how did you present it?
    expected_concepts:
      - the evidence, such as progress so far or measured rates
      - connecting the evidence to the date
      - presenting options alongside the evidence
      - responding to challenge
      - outcome
    rubric:
      excellent: Uses specific evidence such as completed work versus remaining work, ties it clearly to the date, presents options, and reports the decision reached.
      good: Gives a real example of an evidence-based case with a result.
      weak: Argued from opinion or effort rather than evidence.
    followups:
      - What was the most persuasive piece of evidence?
      - What did they challenge?
    common_errors:
      - Presenting raw data without a clear conclusion.

  - external_key: behavioral.pressure_deadlines.understaffed_from_start
    competency_key: ownership
    topic: Starting a deadline with fewer people than needed
    difficulty: medium
    text: >-
      Tell me about a time you were given a goal and a date but clearly fewer people than the work needed from
      the start. How did you decide what to attempt?
    expected_concepts:
      - showing the gap between capacity and scope
      - discussing options with whoever set the goal
      - prioritising the highest-value scope
      - agreeing what would not be done
      - outcome
    rubric:
      excellent: Makes the capacity gap explicit, discusses options with the goal-setter, prioritises the highest-value scope, agrees what would not be done, and reports the outcome.
      good: Gives a real example of prioritising within limited capacity.
      weak: Accepted the full scope silently and fell short.
    followups:
      - How did you show the gap to the person who set the goal?
      - What did you agree to leave out?
    common_errors:
      - Accepting the full scope and hoping it would work out.

  - external_key: behavioral.pressure_deadlines.avoiding_single_hero
    competency_key: ownership
    topic: Not relying on one person to save the deadline
    difficulty: medium
    text: >-
      Tell me about a time a deadline depended heavily on one person, possibly you, being the only one who could
      do a crucial part. What did you do about that risk?
    expected_concepts:
      - recognising the single point of dependency
      - sharing knowledge or pairing
      - documenting the crucial part
      - spreading the load
      - outcome and lasting change
    rubric:
      excellent: Recognises the single-person risk, takes concrete steps such as pairing or documentation to spread it, and shows the deadline and later work no longer depended on one person.
      good: Gives a real example of reducing a key-person dependency.
      weak: Relied on one person working harder, or did not see it as a risk.
    followups:
      - What happened when that person was unavailable?
      - How did you make time for sharing knowledge during the push?
    common_errors:
      - Treating heroics as a success instead of a risk.

  - external_key: behavioral.pressure_deadlines.demo_with_unfinished_work
    competency_key: culture_values
    topic: Presenting unfinished work to a customer or leadership
    difficulty: medium
    text: >-
      Tell me about a time you had to demonstrate or present work to a customer or leadership before it was
      finished. How did you decide what to show and how to describe its state?
    expected_concepts:
      - what was ready and what was not
      - choosing what to show
      - describing the real state accurately
      - managing expectations about timelines
      - outcome and feedback
    rubric:
      excellent: Chooses what to show deliberately, describes the real state accurately without overstating, sets clear expectations about what was still to come, and reports the outcome.
      good: Gives a real example of presenting unfinished work transparently.
      weak: Presented unfinished parts as finished, or gave a misleading impression of progress.
    followups:
      - What questions did they ask about what wasn't ready?
      - How did you avoid overpromising?
    common_errors:
      - Faking functionality to make the demo look complete.

  - external_key: behavioral.pressure_deadlines.fixed_window_with_rollback
    competency_key: ownership
    topic: A change that had to happen in a fixed window
    difficulty: medium
    text: >-
      Tell me about a time an important change, like a migration, a system switchover or a big process change,
      had to happen within a fixed window. How did you prepare so you could still back out if it went wrong?
    expected_concepts:
      - the change and the window
      - rehearsal or dry run
      - a tested plan to back out
      - clear go or no-go checkpoints
      - outcome and what was learned
    rubric:
      excellent: Describes rehearsing the change, a tested way to back out, clear go or no-go checkpoints within the window, and the outcome with lessons.
      good: Gives a real example with a backout plan and result.
      weak: Had no backout plan, or relied on fixing problems on the fly.
    followups:
      - Did you ever test the backout?
      - What was your point of no return?
    common_errors:
      - Writing a backout plan that was never tested.

  - external_key: behavioral.pressure_deadlines.reusing_existing_work
    competency_key: problem_solving
    topic: Saving time by reusing existing work
    difficulty: medium
    text: >-
      Tell me about a time you saved significant time on a deadline by reusing or adapting something that
      already existed. How did you check it was really fit for the job?
    expected_concepts:
      - what was reused and from where
      - checking it matched the new requirements
      - adapting the gaps
      - risks of reuse, such as hidden assumptions
      - time saved and outcome
    rubric:
      excellent: Explains how they found the existing work, checked it against the new requirements, adapted the gaps, considered hidden assumptions, and reports the time saved.
      good: Gives a real example of useful reuse with checks.
      weak: Reused something without checking it fit, causing problems later.
    followups:
      - What hidden assumption did the existing work make?
      - Did you tell the original owner?
    common_errors:
      - Assuming that something worked elsewhere means it fits the new case.

  - external_key: behavioral.pressure_deadlines.decision_owner_unavailable
    competency_key: ownership
    topic: Deciding when the usual decision-maker was unavailable
    difficulty: medium
    text: >-
      Tell me about a time a decision was needed to keep a deadline, but the person who would normally make it
      wasn't available. How did you decide what to do?
    expected_concepts:
      - the decision and the time pressure
      - trying to reach the decision-maker or a delegate
      - understanding the limits of their own authority
      - choosing a reversible option where possible
      - informing the decision-maker afterwards
    rubric:
      excellent: Tries reasonable ways to reach the decision-maker, acts within clear limits of their authority, prefers a reversible option, and reports back promptly with reasoning.
      good: Gives a real example of a sensible decision taken in the owner's absence.
      weak: Waited and missed the deadline, or made an irreversible decision beyond their authority without telling anyone.
    followups:
      - How did the decision-maker react when you told them?
      - What would you not have decided on their behalf?
    common_errors:
      - Not reporting the decision back promptly.

  # ------------------------------------------------------------------------------- hard
  - external_key: behavioral.pressure_deadlines.public_miss_accountability
    competency_key: ownership
    topic: Owning a high-visibility miss
    difficulty: hard
    text: >-
      Tell me about a time a deadline you were accountable for was missed in a way many people noticed. How
      did you take responsibility for it, and what did you do to recover?
    expected_concepts:
      - their accountability and role in the miss
      - prompt, clear communication to those affected
      - a recovery plan with a credible new date
      - fixing the causes
      - how trust was rebuilt with evidence
    rubric:
      excellent: Takes clear accountability, communicates promptly to those affected, delivers a credible recovery plan, fixes the causes, and shows evidence that trust was rebuilt.
      good: Gives a real example with accountability and recovery.
      weak: Deflects responsibility, or describes the miss without any recovery.
    followups:
      - What did you say in the first message about the miss?
      - How did you know trust had come back?
    common_errors:
      - Spreading responsibility so widely that nobody owns it.

  - external_key: behavioral.pressure_deadlines.feature_dates_versus_reliability
    competency_key: ownership
    topic: Balancing feature dates against reliability work over time
    difficulty: hard
    text: >-
      Tell me about how you balanced pressure for new features by certain dates against reliability or
      maintenance work over several months. How did you decide the split, and how did you defend it?
    expected_concepts:
      - evidence of reliability or maintenance need
      - a deliberate split of capacity
      - agreement with stakeholders on the split
      - adjusting the split based on results
      - measured outcomes for both features and reliability
    rubric:
      excellent: Uses evidence to set a deliberate capacity split, gains stakeholder agreement, adjusts it based on results, and reports measured outcomes for both features and reliability.
      good: Gives a real example of a reasoned balance over time.
      weak: Let feature dates always win, or worked on maintenance without agreement.
    followups:
      - When did you have to break your own split?
      - What measure convinced stakeholders?
    common_errors:
      - Arguing for reliability work without evidence of its value.

  - external_key: behavioral.pressure_deadlines.improving_team_estimation
    competency_key: ownership
    topic: Helping a team estimate more reliably
    difficulty: hard
    text: >-
      Tell me about a time you helped a team that kept missing its dates start estimating more reliably. What
      did you change, and how did you know it was working?
    expected_concepts:
      - evidence of the estimation problem
      - root causes, such as hidden work or optimism
      - specific practices introduced
      - tracking estimates against actuals
      - measured improvement
    rubric:
      excellent: Uses evidence to diagnose why estimates were missing, introduces specific practices, tracks estimates against actuals, and shows a measured improvement.
      good: Gives a real example with sensible changes and some result.
      weak: Told the team to estimate more carefully without changing practices.
    followups:
      - What hidden work did you uncover?
      - How did you get the team to adopt the change?
    common_errors:
      - Adding padding instead of fixing the causes of poor estimates.

  - external_key: behavioral.pressure_deadlines.pressure_to_report_on_track
    competency_key: culture_values
    topic: Pressure to report work as on track
    difficulty: hard
    text: >-
      Tell me about a time you were under pressure to report a piece of work as on track when you believed it
      wasn't. What did you report, and what happened?
    expected_concepts:
      - evidence that it was not on track
      - where the pressure came from
      - reporting the accurate status with context
      - offering a plan to recover
      - outcome and effect on how status was reported later
    rubric:
      excellent: Reports the accurate status backed by evidence despite pressure, adds context and a recovery plan, and describes the outcome and any lasting change in how status was reported.
      good: Gives a real example of reporting accurately with a plan.
      weak: Reported the work as on track, or reported problems without evidence or a plan.
    followups:
      - How did the person applying the pressure respond?
      - What would have happened if you'd reported it as on track?
    common_errors:
      - Softening the status so much that the real risk was hidden.

  - external_key: behavioral.pressure_deadlines.sustained_high_pressure_period
    competency_key: ownership
    topic: Keeping delivery steady over a long high-pressure period
    difficulty: hard
    text: >-
      Tell me about a long stretch, several months rather than a few days, where you or your team were under
      constant deadline pressure. How did you keep quality and delivery steady over that whole period?
    expected_concepts:
      - the nature and length of the pressure
      - a sustainable working rhythm rather than repeated sprints
      - protecting quality practices throughout
      - regular re-prioritisation with stakeholders
      - measured outcomes over the period
    rubric:
      excellent: Describes a deliberate sustainable rhythm, how quality practices were protected throughout, regular re-prioritisation with stakeholders, and measured delivery and quality outcomes over the period.
      good: Gives a real example with steady delivery and some deliberate practices.
      weak: Describes surviving the period by working harder with no deliberate approach.
    followups:
      - What did you stop doing during that period?
      - What signs showed you quality was slipping?
    common_errors:
      - Treating a months-long push like a short crunch.
