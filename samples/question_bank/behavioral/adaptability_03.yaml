# Behavioural: adaptability (3 of 4) — learning new domains, tools and systems quickly.
# Questions ask for real past examples; evaluation is based only on the content of the answer
# (learning approach, application, validation, outcome), never on delivery style or personality.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: adaptability
questions:
  # ------------------------------------------------------------------ easy
  - external_key: behavioral.adaptability.finding_way_in_large_codebase
    topic: Finding your way around a large unfamiliar system
    difficulty: easy
    text: >-
      Think back to the last time you started working in a large system or codebase you'd never seen. What did
      you do in the first week to find your way around?
    expected_concepts:
      - starting from a concrete task or entry point
      - tracing one real flow end to end
      - using tests, logs or tools to explore
      - asking targeted questions of people who knew it
    rubric:
      excellent: Starts from a concrete task, traces a real flow end to end, uses tools to explore and asks targeted questions, and can say what they were able to do by the end of the week.
      good: Uses a reasonable exploration approach and becomes productive.
      weak: Tried to read everything from the top, or gives no concrete approach.
    followups:
      - What was the first change you made?
      - What would you tell the next newcomer to read first?
    common_errors:
      - Trying to understand the whole system before doing anything.

  - external_key: behavioral.adaptability.learning_from_a_colleague
    topic: Learning a skill from a colleague
    difficulty: easy
    text: >-
      Tell me about something you learned mainly by working alongside a colleague who already knew it. How did you
      make the most of their time?
    expected_concepts:
      - preparing questions in advance
      - watching them work and then trying it themselves
      - asking for feedback on their attempts
      - becoming independent and reducing reliance on them
    rubric:
      excellent: Prepares in advance, combines observation with hands-on attempts, seeks feedback and shows how quickly they became independent.
      good: Learned effectively from a colleague with a concrete outcome.
      weak: Relied on the colleague doing the work, or the example has no learning outcome.
    followups:
      - How did you avoid taking too much of their time?
      - What did you do once you could work alone?
    common_errors:
      - Asking the colleague to do it rather than teach it.

  - external_key: behavioral.adaptability.picking_up_new_language
    topic: Picking up a new programming language or tool for a task
    difficulty: easy
    text: >-
      Describe a time you needed to work in a programming language, framework or tool you hadn't used before.
      How did you get from zero to writing something useful?
    expected_concepts:
      - mapping concepts from what they already knew
      - learning by building something small and real
      - reading idiomatic examples or existing code
      - getting review from someone experienced
    rubric:
      excellent: Maps from known concepts, learns by building something small and real, studies idiomatic examples and gets experienced review, ending with a concrete delivered piece of work.
      good: Learned enough to deliver with a reasonable approach.
      weak: Describes only taking a course or reading, with no applied result.
    followups:
      - What habit from your previous language got you into trouble?
      - How did you know your code was idiomatic?
    common_errors:
      - Writing code in the old language's style without noticing.

  - external_key: behavioral.adaptability.business_vocabulary
    topic: Learning a new business domain's language
    difficulty: easy
    text: >-
      Tell me about a time you moved into work for a business area you knew nothing about, say finance,
      logistics or healthcare. How did you learn enough of the domain to do your job well?
    expected_concepts:
      - learning the key terms and processes
      - talking to people who do the work
      - connecting the domain to their own tasks
      - checking their understanding before relying on it
    rubric:
      excellent: Learns key terms and processes, talks to people who do the work, ties the domain directly to their tasks and checks understanding before relying on it, with an example of better work as a result.
      good: Learned the domain basics and applied them in their work.
      weak: Stayed at the level of tasks without understanding the domain, or gives no approach.
    followups:
      - What domain detail most changed how you did your work?
      - Who did you learn the most from?
    common_errors:
      - Learning only the technical side and ignoring how the business works.

  - external_key: behavioral.adaptability.choosing_where_to_start_learning
    topic: Deciding where to start learning
    difficulty: easy
    text: >-
      When you face a new topic with far too much material to read, how do you decide where to start? Tell me
      about the last time you did this.
    expected_concepts:
      - starting from what the task actually needs
      - picking a trusted, focused source
      - getting hands-on early
      - going deeper only where needed
    rubric:
      excellent: Uses a recent example, starts from what the task needs, picks focused trustworthy sources, gets hands-on early and goes deeper only where the work required it.
      good: Describes a sensible starting point in a real example.
      weak: Reads broadly without direction, or gives a generic answer with no example.
    followups:
      - What did you deliberately skip?
      - How did you judge which sources to trust?
    common_errors:
      - Collecting resources rather than learning from any of them.

  - external_key: behavioral.adaptability.mistake_while_learning
    topic: A mistake made while learning something new
    difficulty: easy
    text: >-
      Tell me about a mistake you made because you were still new to a tool or area. How did you find out, and
      what did you change in how you learn?
    expected_concepts:
      - what the mistake was and its impact
      - how it was discovered
      - fixing it and telling the right people
      - change to their learning or checking habits
    rubric:
      excellent: Describes the mistake and its impact plainly, fixes it and informs the right people, and names a specific change to how they learn or check their work.
      good: Gives a clear example with a fix and a lesson.
      weak: Picks a trivial example, blames the tool, or has no lesson.
    followups:
      - What safeguard do you use now when you're new to something?
      - Who helped you spot it?
    common_errors:
      - Lessons limited to "be more careful".

  - external_key: behavioral.adaptability.self_learning_applied
    topic: Applying something you learned on your own
    difficulty: easy
    text: >-
      Tell me about something you taught yourself because you saw it would be useful in your work. How did you
      bring it into your actual job?
    expected_concepts:
      - the gap or opportunity they noticed
      - how they learned it
      - a concrete application at work
      - the result or benefit
    rubric:
      excellent: Identifies a real gap, describes how they learned it and shows a concrete application at work with a clear benefit.
      good: Learned something useful and applied it with some benefit.
      weak: Describes learning with no application, or the link to their work is unclear.
    followups:
      - How did you convince others to try it?
      - What would you learn next in the same area?
    common_errors:
      - Learning for its own sake with no link to the work.

  - external_key: behavioral.adaptability.task_outside_skillset
    topic: Taking on a task outside your usual skills
    difficulty: easy
    text: >-
      Describe a time you took on a task that was clearly outside your usual skills because it needed doing. How
      did you approach it?
    expected_concepts:
      - why they took it on
      - figuring out what good looked like
      - getting help or review
      - result and what they learned
    rubric:
      excellent: Explains why they took it on, establishes what good looked like, seeks help or review where it mattered and delivers a result with a clear lesson.
      good: Takes on the task and completes it reasonably with some help.
      weak: Avoided the task, or describes doing it without any check on quality.
    followups:
      - Would you take on the same task again?
      - Who did you ask to check your work?
    common_errors:
      - Not getting the work reviewed by someone with the right skills.

  - external_key: behavioral.adaptability.learning_alongside_deadline
    topic: Balancing learning time against delivery
    difficulty: easy
    text: >-
      Think of a time you had to learn something new while still being expected to deliver on schedule. How did
      you split your time between learning and producing work?
    expected_concepts:
      - learning only what the next deliverable needed
      - delivering in small pieces while learning
      - telling the lead about the learning cost up front
      - catching up on deeper learning later
    rubric:
      excellent: Learns just what each next deliverable needed, delivers in small pieces, makes the learning cost visible to the lead early and follows up with deeper learning afterwards.
      good: Balances learning and delivery reasonably and meets the schedule.
      weak: Stops delivering to study, or skips learning and produces poor work.
    followups:
      - Did you tell anyone the learning would slow you down?
      - What did you go back and learn properly afterwards?
    common_errors:
      - Hiding the learning time so the estimate looks better.

  # ---------------------------------------------------------------- medium
  - external_key: behavioral.adaptability.partnering_with_domain_expert
    topic: Working closely with a domain expert
    difficulty: medium
    text: >-
      Describe a time you had to rely on a domain expert, perhaps from operations, legal or finance, to get your
      work right. How did you learn from them efficiently and make sure you'd understood correctly?
    expected_concepts:
      - preparing focused questions
      - using concrete cases rather than abstract rules
      - playing back understanding for confirmation
      - capturing the knowledge for the team
    rubric:
      excellent: Prepares focused questions, works through concrete cases, plays back their understanding for confirmation and captures the knowledge for others.
      good: Learns effectively from the expert and gets the work right.
      weak: Relies on the expert to review everything, or misunderstands and finds out late.
    followups:
      - What did you misunderstand at first?
      - How did you capture what you learned?
    common_errors:
      - Asking the expert abstract questions instead of walking through real cases.

  - external_key: behavioral.adaptability.rules_heavy_domain
    topic: Learning a domain with strict rules or regulations
    difficulty: medium
    text: >-
      Tell me about working in an area governed by strict rules, such as compliance or safety requirements, that
      were new to you. How did you learn them well enough to avoid mistakes?
    expected_concepts:
      - finding the authoritative source of the rules
      - translating rules into concrete checks for their work
      - getting expert review early
      - building safeguards into the process
    rubric:
      excellent: Goes to the authoritative source, turns the rules into concrete checks, gets expert review early and builds safeguards so mistakes are caught.
      good: Learns the key rules and applies them with appropriate review.
      weak: Relies on assumptions or second-hand summaries without checking.
    followups:
      - Which rule was most counter-intuitive?
      - What check did you add to your process?
    common_errors:
      - Treating a summary as the authoritative rule.

  - external_key: behavioral.adaptability.understanding_legacy_system
    topic: Understanding an old system nobody fully knew
    difficulty: medium
    text: >-
      Tell me about a time you had to change an old system that nobody on the team fully understood any more. How
      did you build enough understanding to change it safely?
    expected_concepts:
      - observing current behaviour before changing it
      - adding tests or checks to capture behaviour
      - finding former owners or historical records
      - making small, reversible changes
    rubric:
      excellent: Observes and captures current behaviour, uses history and former owners, makes small reversible changes and leaves better documentation.
      good: Builds reasonable understanding and changes the system without major issues.
      weak: Changes the system based on guesses, or avoids the work.
    followups:
      - What behaviour surprised you?
      - What did you leave behind for the next person?
    common_errors:
      - Assuming the code's intent from its names alone.

  - external_key: behavioral.adaptability.supporting_unfamiliar_system_live
    topic: Supporting a system you were still learning
    difficulty: medium
    text: >-
      Describe a time you were responsible for supporting a system, perhaps on call, before you knew it well.
      What did you do to prepare, and how did it go when something broke?
    expected_concepts:
      - preparing with runbooks, dashboards and past incidents
      - knowing when and whom to escalate to
      - learning from the first real issue
      - improving the material for the next person
    rubric:
      excellent: Prepares using runbooks and past incidents, knows the escalation path, handles a real issue sensibly and improves the support material afterwards.
      good: Prepares reasonably and handles issues with appropriate escalation.
      weak: Did no preparation, or tried to handle everything alone without escalating.
    followups:
      - When did you escalate, and how did you decide?
      - What did you add to the runbook afterwards?
    common_errors:
      - Not escalating early enough out of reluctance to ask.

  - external_key: behavioral.adaptability.enough_to_decide
    topic: Learning just enough to make a sound decision
    difficulty: medium
    text: >-
      Tell me about a time you had to make a decision in an area you were new to. How did you work out how deep
      you needed to go before you could decide responsibly?
    expected_concepts:
      - identifying the questions the decision hinged on
      - learning those specifically rather than everything
      - getting an expert sanity check
      - acknowledging remaining unknowns
    rubric:
      excellent: Identifies the questions the decision hinged on, learns those specifically, gets an expert sanity check and states the remaining unknowns openly.
      good: Learns enough to make a sound decision with some validation.
      weak: Decides with no real understanding, or tries to become an expert before deciding.
    followups:
      - What did you decide not to learn?
      - Who checked your reasoning?
    common_errors:
      - Confusing reading a lot with understanding the decision.

  - external_key: behavioral.adaptability.unlearning_old_habit
    topic: Unlearning a way of working that no longer fit
    difficulty: medium
    text: >-
      Tell me about a habit or practice that served you well in one job or team but didn't work in a new
      setting. How did you notice, and what did you replace it with?
    expected_concepts:
      - the original practice and why it had worked
      - the signal that it no longer fit
      - the replacement practice
      - effect of the change
    rubric:
      excellent: Explains why the old practice had worked, the signal that it no longer fit, the specific replacement and the observable effect.
      good: Gives a real example of changing a habit with a positive result.
      weak: Cannot name a habit they changed, or blames the new setting.
    followups:
      - Did you ever slip back into the old habit?
      - Is there anything from the old way you kept?
    common_errors:
      - Assuming what worked before will work everywhere.

  - external_key: behavioral.adaptability.transferring_experience
    topic: Carrying experience into a different domain
    difficulty: medium
    text: >-
      Describe a time experience from one area helped you solve a problem in a completely different one. How did
      you recognise the connection, and where did it not quite fit?
    expected_concepts:
      - the original experience
      - recognising the similarity
      - adapting it to the new context
      - noticing where the analogy broke down
    rubric:
      excellent: Explains the original experience, how they spotted the similarity, how they adapted it and where the analogy broke down, with a concrete result.
      good: Transfers experience usefully with a clear outcome.
      weak: The connection is superficial, or they applied it without adapting.
    followups:
      - What did you have to change to make it fit?
      - Did anyone push back on the idea?
    common_errors:
      - Applying an old solution without checking the differences.

  - external_key: behavioral.adaptability.structured_ramp_up_plan
    topic: Planning your own ramp-up
    difficulty: medium
    text: >-
      Tell me about a time you deliberately planned how you would ramp up in a new role or area. What did the
      plan look like, and how did you know you were on track?
    expected_concepts:
      - goals for the first weeks
      - concrete milestones or deliverables
      - regular check-ins with their manager or team
      - adjusting the plan as they learned
    rubric:
      excellent: Sets clear early goals with concrete milestones, checks in regularly, adjusts the plan and can show they hit meaningful milestones.
      good: Has a reasonable plan and tracks progress against it.
      weak: No real plan, or a plan with no way of knowing progress.
    followups:
      - Which milestone took longer than expected?
      - What would you put in the plan next time?
    common_errors:
      - Measuring ramp-up by time spent rather than things delivered.

  - external_key: behavioral.adaptability.new_kind_of_customer
    topic: Learning the needs of a new kind of user
    difficulty: medium
    text: >-
      Tell me about a time your work had to serve a type of user or customer you hadn't worked with before. How
      did you learn what they needed?
    expected_concepts:
      - talking to or observing real users
      - questioning assumptions carried over from previous users
      - using data or feedback to validate
      - changes made as a result
    rubric:
      excellent: Talks to or observes real users, questions assumptions carried over from past users, validates with data or feedback and makes specific changes as a result.
      good: Learns the new users' needs and adapts the work.
      weak: Assumed they were like previous users without checking.
    followups:
      - Which assumption turned out wrong?
      - How did you get access to those users?
    common_errors:
      - Designing for the old audience out of habit.

  - external_key: behavioral.adaptability.new_responsibility_added
    topic: Taking on a new kind of responsibility
    difficulty: medium
    text: >-
      Describe a time you were given a responsibility you hadn't held before, such as running a release, leading a
      meeting series or handling a vendor. How did you get good at it?
    expected_concepts:
      - learning from the previous owner or examples
      - starting with a simple, reliable approach
      - asking for feedback
      - improving with each cycle
    rubric:
      excellent: Learns from the previous owner, starts with a simple reliable approach, asks for feedback and shows specific improvements over several cycles.
      good: Takes on the responsibility and handles it competently.
      weak: Describes the responsibility without how they learned it, or with no improvement over time.
    followups:
      - What feedback changed how you did it?
      - What did you improve compared with the previous owner?
    common_errors:
      - Copying the previous owner's approach without understanding it.

  - external_key: behavioral.adaptability.choosing_in_unfamiliar_field
    topic: Evaluating options in a field you did not know
    difficulty: medium
    text: >-
      Tell me about a time you had to recommend between several options, tools or vendors in an area you didn't
      know well. How did you build a fair comparison?
    expected_concepts:
      - defining criteria from the actual need
      - learning enough to judge each option
      - hands-on trials or references
      - stating limitations of the comparison
    rubric:
      excellent: Defines criteria from the real need, learns enough to judge each option, uses trials or references and states the limits of the comparison in the recommendation.
      good: Produces a reasonable comparison and recommendation.
      weak: Relies on marketing claims or popularity without criteria.
    followups:
      - Which criterion ended up deciding it?
      - What did you get wrong in the comparison?
    common_errors:
      - Choosing what is popular rather than what fits the need.
    competency_key: problem_solving

  # ------------------------------------------------------------------ hard
  - external_key: behavioral.adaptability.becoming_go_to_person
    topic: Becoming the go-to person in a new area fast
    difficulty: hard
    text: >-
      Tell me about a time you went from knowing little about an area to being the person others came to for
      answers on it, in a fairly short time. What did you do differently from just learning on the job?
    expected_concepts:
      - deliberate focus on the most important concepts
      - learning through real, high-impact work
      - seeking out the hardest problems in the area
      - sharing knowledge to deepen and test it
      - evidence that others relied on them
    rubric:
      excellent: Describes a deliberate strategy, learning through high-impact work, tackling hard problems, sharing knowledge to test it and gives concrete evidence that others relied on their expertise.
      good: Became knowledgeable quickly with a clear approach and recognition from others.
      weak: Claims expertise without describing how it was gained or evidence that others relied on it.
    followups:
      - How long did it take, and what sped it up most?
      - What do you still not know well in that area?
    common_errors:
      - Overstating depth of expertise gained in a short time.

  - external_key: behavioral.adaptability.leading_in_new_domain
    topic: Leading work in a domain you were new to
    difficulty: hard
    text: >-
      Describe a time you had to lead or coordinate work in a domain where some of the people you worked with
      knew more than you. How did you lead effectively while you were still learning?
    expected_concepts:
      - being open about what they did not know
      - using the experts' knowledge in decisions
      - focusing on the parts they could own well such as coordination and priorities
      - learning fast enough to ask the right questions
      - outcome
    rubric:
      excellent: Is open about gaps, makes decisions with input from the experts, focuses on what they could own well, learns quickly enough to challenge sensibly and delivers a clear outcome.
      good: Leads the work successfully while drawing on others' expertise.
      weak: Pretends to know more than they did, or defers every decision so nothing is led.
    followups:
      - When did you overrule an expert, and why?
      - How did you learn enough to ask good questions?
    common_errors:
      - Hiding knowledge gaps from the team.
    competency_key: leadership
    round_types: [behavioral, combined]

  - external_key: behavioral.adaptability.onboarding_team_to_new_domain
    topic: Bringing a whole team up to speed in a new domain
    difficulty: hard
    text: >-
      Tell me about a time your team had to start working in a new domain or technology together. What did you do
      to help everyone learn quickly and keep delivering?
    expected_concepts:
      - assessing what the team needed to learn
      - shared learning such as pairing, sessions or spikes
      - sequencing work from simple to complex
      - building shared reference material
      - delivery result during the transition
    rubric:
      excellent: Assesses learning needs, organises shared learning, sequences work from simple to complex, builds reference material and shows delivery continued during the transition.
      good: Helps the team learn with concrete practices and keeps work moving.
      weak: Leaves each person to learn alone, or delivery stalled with no plan.
    followups:
      - How did you handle people learning at different speeds?
      - What reference material is still used today?
    common_errors:
      - Assuming one training session is enough.

  - external_key: behavioral.adaptability.wrong_mental_model
    topic: Discovering your understanding was wrong
    difficulty: hard
    text: >-
      Tell me about a time you realised, after already acting on it, that your understanding of a new domain or
      system was fundamentally wrong. How did you find out, and how did you repair the damage?
    expected_concepts:
      - the wrong model and why it seemed right
      - the evidence that exposed it
      - repairing affected work and informing others
      - changing how they validate understanding
    rubric:
      excellent: Explains why the wrong model seemed right, what exposed it, how they repaired affected work and informed others, and the specific change in how they now validate understanding.
      good: Gives a real example with repair and a lesson.
      weak: The example is minor, or the answer avoids describing what went wrong.
    followups:
      - What check would have caught it sooner?
      - How did the people affected respond?
    common_errors:
      - Describing the correction without owning the original misunderstanding.

  - external_key: behavioral.adaptability.accelerating_team_learning
    topic: Building habits that help a team learn faster
    difficulty: hard
    text: >-
      What have you done to make a team better at picking up new tools or domains over time, not just for one
      project? Walk me through something specific you put in place and what effect it had.
    expected_concepts:
      - a specific practice or mechanism introduced
      - why it was needed
      - how it was adopted by the team
      - evidence that learning became faster
    rubric:
      excellent: Describes a specific mechanism, why it was needed, how they got the team to adopt it and concrete evidence that later learning was faster.
      good: Introduced a useful learning practice with some adoption.
      weak: Lists general ideas such as "encourage learning" with nothing specific.
    followups:
      - How did you know it was making a difference?
      - What did not work?
    common_errors:
      - Describing a one-off event rather than a lasting practice.
