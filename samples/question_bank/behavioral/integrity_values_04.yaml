# Behavioural: integrity and working values (part 4 of 4) - accurate self-representation, staying
# within your authority, using data responsibly, timely disclosure and leading change on team norms.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ accurate self-representation
  - external_key: behavioral.integrity_values.overstated_credit_correction
    competency_key: culture_values
    topic: Correcting an impression that flattered you
    difficulty: easy
    text: >-
      Tell me about a time someone assumed you had done more, or knew more, than you actually did, and letting
      it stand would have helped you. What did you do?
    expected_concepts:
      - the misunderstanding and how it arose
      - correcting it promptly and plainly
      - naming who actually did the work or held the knowledge
      - the effect on how people relied on them afterwards
    rubric:
      excellent: Describes correcting the impression promptly and specifically, redirecting credit or questions to the right people, and explains why an accurate picture mattered for later work.
      good: Corrects the misunderstanding when it came up.
      weak: Lets it stand because it was flattering, or gives a vague example.
    followups:
      - What might have happened if you had let it stand?
      - How did the other person react to the correction?
    common_errors:
      - Correcting it only partly so they still looked good.

  - external_key: behavioral.integrity_values.accurate_self_assessment
    competency_key: culture_values
    topic: Writing an accurate self-assessment
    difficulty: easy
    text: >-
      When you've written a self-assessment for a performance review or a project summary, how did you make sure
      it gave an accurate picture, including what didn't go well? Walk me through one you wrote.
    expected_concepts:
      - using evidence such as outcomes and feedback
      - describing their own contribution precisely rather than the team's
      - including misses and what they learned
      - avoiding both inflation and understatement
    rubric:
      excellent: Describes grounding the assessment in evidence, separating their contribution from the team's, and including specific misses with what they changed.
      good: Gives a balanced self-assessment with evidence.
      weak: Describes only successes, or claims team results as their own.
    followups:
      - What did you leave out, and why?
      - How did your manager's view compare with yours?
    common_errors:
      - Treating a self-assessment as a sales document.

  - external_key: behavioral.integrity_values.admitting_overload
    competency_key: culture_values
    topic: Saying you're overloaded instead of quietly cutting quality
    difficulty: easy
    text: >-
      Tell me about a time you had more work than you could do properly. How did you make that visible, rather
      than quietly lowering the quality of what you delivered?
    expected_concepts:
      - recognising the overload early
      - telling their manager or stakeholders with specifics
      - proposing what to drop, delay or hand over
      - protecting the quality of what they kept
    rubric:
      excellent: Describes raising the overload early with specifics, proposing concrete trade-offs, agreeing them with the right people, and delivering the remaining work to the expected standard.
      good: Raises the overload and agrees on priorities.
      weak: Quietly cuts corners to keep up, or raises it only after things were missed.
    followups:
      - What did you propose to drop?
      - What stopped you raising it sooner?
    common_errors:
      - Presenting working excessive hours as the solution.

  # ------------------------------------------------------------ staying within authority
  - external_key: behavioral.integrity_values.access_beyond_remit
    competency_key: culture_values
    topic: Having the access to change something that isn't yours
    difficulty: easy
    text: >-
      Describe a time you had the technical access or authority to change something that belonged to another
      team or person, and changing it yourself would have been quicker. How did you handle it?
    expected_concepts:
      - recognising who owned the thing
      - asking or informing the owner instead of acting alone
      - acting only with agreement, or in a sanctioned emergency
      - suggesting the access be reduced if it was too broad
    rubric:
      excellent: Respects ownership by involving the owner, acts only with agreement, and suggests tightening access that was broader than it should be.
      good: Asks the owner before making the change.
      weak: Makes the change because they could, informing nobody.
    followups:
      - What would have justified changing it without asking?
      - Did you do anything about the access itself?
    common_errors:
      - Equating having permission in a system with having the right to decide.

  - external_key: behavioral.integrity_values.commitment_beyond_authority
    competency_key: culture_values
    topic: Being asked for something beyond your authority
    difficulty: easy
    text: >-
      Tell me about a time a customer or stakeholder pressed you to agree to something you weren't authorised to
      promise, such as a discount, a deadline or a feature. How did you respond?
    expected_concepts:
      - recognising the limit of their authority
      - not making the commitment on the spot
      - taking the request to the right decision maker promptly
      - keeping the requester informed of the outcome
    rubric:
      excellent: Declines to commit beyond their authority, explains the next step and timing clearly, takes it to the right decision maker, and closes the loop with the requester.
      good: Avoids the commitment and escalates the request.
      weak: Agrees to keep the person happy, or refuses without routing the request anywhere.
    followups:
      - What did you say in the moment?
      - How quickly did you get back to them?
    common_errors:
      - Making a soft promise like "it should be fine" that the requester treats as a commitment.

  - external_key: behavioral.integrity_values.promise_after_handoff
    competency_key: culture_values
    topic: Following through after responsibility moved on
    difficulty: easy
    text: >-
      Have you made a promise to a customer or colleague and then moved to different work before it was
      fulfilled? Tell me what you did to make sure that promise wasn't lost.
    expected_concepts:
      - the promise and who relied on it
      - handing it over explicitly to a named owner
      - informing the person the promise was made to
      - checking that it was fulfilled
    rubric:
      excellent: Describes explicitly handing the promise to a named owner, telling the person who relied on it, and checking later that it was fulfilled.
      good: Hands the promise over and informs the person.
      weak: Assumes the next owner will pick it up, or forgets it.
    followups:
      - How did you check it was kept?
      - What happens to promises when people move teams?
    common_errors:
      - Treating a promise as void once the role changed.

  # ------------------------------------------------------------ quality and near misses
  - external_key: behavioral.integrity_values.flaw_after_acceptance
    competency_key: culture_values
    topic: A flaw found after your work was accepted
    difficulty: easy
    text: >-
      Tell me about a time you found a flaw in something you'd delivered after it had already been signed off or
      accepted. What did you do, given that nobody was asking you to look at it again?
    expected_concepts:
      - the flaw and its potential impact
      - telling the recipient even though the work was closed
      - offering and delivering a fix
      - learning applied to later work
    rubric:
      excellent: Describes proactively informing the recipient about the flaw, delivering a fix, and changing their approach to catch similar issues before sign-off.
      good: Informs the recipient and fixes it.
      weak: Leaves it because the work was already accepted.
    followups:
      - How did the recipient respond?
      - What would you check before sign-off now?
    common_errors:
      - Waiting to see whether the flaw would ever surface.

  - external_key: behavioral.integrity_values.reporting_near_miss
    competency_key: culture_values
    topic: Reporting a near miss
    difficulty: easy
    text: >-
      Tell me about a near miss you were involved in, something that almost went wrong but didn't. Did you
      report it, and what happened as a result?
    expected_concepts:
      - what nearly happened and why
      - reporting it even though there was no harm
      - contributing to understanding the cause
      - a change that made a real failure less likely
    rubric:
      excellent: Describes reporting a near miss that could easily have gone unmentioned, helping identify the cause, and a concrete change that resulted.
      good: Reports the near miss and suggests a fix.
      weak: Did not report it because nothing actually broke, or has no example.
    followups:
      - Why do you think near misses often go unreported?
      - What would make reporting easier where you work?
    common_errors:
      - Seeing no value in reporting because there was no impact.

  - external_key: behavioral.integrity_values.standards_when_unobserved
    competency_key: culture_values
    topic: Keeping standards when nobody checks
    difficulty: easy
    text: >-
      Think of a team standard, such as documenting decisions, testing or reviewing carefully, that nobody
      really checked. Tell me about a time it would have been easy to skip it and what you did.
    expected_concepts:
      - the standard and why it existed
      - the temptation to skip it
      - keeping to it anyway and why
      - helping make the standard easier for others to follow
    rubric:
      excellent: Describes keeping to the standard when unobserved, explains the concrete reason it mattered, and describes making it easier for others to follow.
      good: Keeps to the standard and explains why.
      weak: Admits skipping it when unchecked and sees no problem.
    followups:
      - Did you ever see the standard pay off?
      - What would you do if the team stopped following it?
    common_errors:
      - Describing a standard enforced by tooling, so there was no real choice.

  # ------------------------------------------------------------ learning from a misstep
  - external_key: behavioral.integrity_values.ethical_misstep_reflection
    competency_key: culture_values
    topic: A judgement call you would now make differently
    difficulty: medium
    text: >-
      Tell me about a judgement call at work, involving fairness, transparency or a rule, that you now think you
      got wrong. What did you do once you realised, and what changed in how you decide?
    expected_concepts:
      - the situation and the call they made
      - what showed them it was wrong
      - repairing the effect where possible
      - a concrete change in how they decide now
    rubric:
      excellent: Gives a real misjudgement with consequences, describes the repair they made, and names a specific change in how they make such decisions.
      good: Describes a real misjudgement and what they learned.
      weak: Chooses an example that is really a success, or offers only general lessons.
    followups:
      - What made the wrong choice attractive at the time?
      - How did you repair the impact?
    common_errors:
      - Framing the misstep as entirely caused by others.

  - external_key: behavioral.integrity_values.unclear_blame_group_mistake
    competency_key: culture_values
    topic: Stepping forward when blame for a failure is unclear
    difficulty: medium
    text: >-
      Describe a time something went wrong that several people contributed to, and it wasn't clear who should
      own it. What role did you take?
    expected_concepts:
      - the failure and the contributors
      - acknowledging their own share without being asked
      - taking ownership of the fix or coordination
      - keeping the focus on resolution rather than blame
    rubric:
      excellent: Describes acknowledging their own share plainly, stepping forward to coordinate the fix, and steering the group away from blame towards prevention.
      good: Owns their part and helps fix the problem.
      weak: Waits for someone else to own it, or emphasises others' mistakes.
    followups:
      - How did others respond when you stepped forward?
      - How was ownership settled for next time?
    common_errors:
      - Taking over the fix while avoiding any mention of their own part.

  # ------------------------------------------------------------ speaking up to people above you
  - external_key: behavioral.integrity_values.manager_misleading_statement
    competency_key: culture_values
    topic: When your manager says something inaccurate
    difficulty: medium
    text: >-
      Tell me about a time your manager or a senior colleague told a customer, leadership or the team something
      you knew to be inaccurate. How did you handle it?
    expected_concepts:
      - the statement and why it was inaccurate
      - checking their own facts
      - raising it privately and promptly with the person
      - making sure the record was corrected if it mattered
    rubric:
      excellent: Verifies the facts, raises it privately and promptly with the person, ensures the audience received a correction where it mattered, and reflects on the relationship afterwards.
      good: Raises the inaccuracy with the person.
      weak: Stays silent because of seniority, or contradicts them publicly without checking first.
    followups:
      - What would you have done if they refused to correct it?
      - How did you choose the timing?
    common_errors:
      - Assuming a senior person must have reasons and letting it go.

  - external_key: behavioral.integrity_values.rule_applied_to_key_customer
    competency_key: culture_values
    topic: Applying a rule to an important customer or senior person
    difficulty: medium
    text: >-
      Tell me about a time a rule or check flagged someone important, like a major customer or a senior leader,
      and there was pressure to wave it through. What did you do?
    expected_concepts:
      - the rule and what it flagged
      - applying the same standard regardless of status
      - escalating to the right authority for any exception
      - documenting the decision
    rubric:
      excellent: Applies the rule consistently, routes any exception to the proper authority with documentation, and explains why consistency mattered for trust in the process.
      good: Applies the rule and escalates the pressure.
      weak: Waves it through because of who it was.
    followups:
      - Who was putting on the pressure?
      - What would a legitimate exception have looked like?
    common_errors:
      - Treating importance to revenue as a reason to skip the check.

  # ------------------------------------------------------------ responsible use of data
  - external_key: behavioral.integrity_values.data_deletion_request
    competency_key: culture_values
    topic: Deleting data you would rather keep
    difficulty: medium
    text: >-
      Tell me about a time you had to delete or stop using data, because of a retention rule, a customer request
      or a contract ending, when keeping it would have been useful. How did you handle it?
    expected_concepts:
      - the obligation and its source
      - identifying every copy, including backups, exports and spreadsheets
      - completing the deletion and confirming it
      - finding alternatives that did not rely on the data
    rubric:
      excellent: Describes tracing all copies of the data, completing and verifying deletion, documenting it, and finding a compliant alternative for the lost value.
      good: Deletes the data as required and confirms it.
      weak: Keeps a copy just in case, or deletes only the obvious copy.
    followups:
      - How did you find all the copies?
      - Who pushed to keep it, and what did you tell them?
    common_errors:
      - Forgetting exports and local copies.

  - external_key: behavioral.integrity_values.data_used_for_new_purpose
    competency_key: culture_values
    topic: Reusing data for a purpose it wasn't collected for
    difficulty: medium
    text: >-
      Describe a time someone wanted to use data that had been collected for one purpose in a new way, like
      support tickets for marketing or usage logs for evaluating staff. How did you approach it?
    expected_concepts:
      - the original purpose and what people had been told
      - whether the new use fitted their expectations and policy
      - involving privacy, legal or data owners
      - proposing safeguards such as anonymisation, consent or a narrower scope
    rubric:
      excellent: Compares the new use with what people were told, involves the right privacy or data owners, and proposes concrete safeguards or declines when the use was not appropriate.
      good: Questions the new use and gets the right people involved.
      weak: Treats any data the company holds as free to reuse.
    followups:
      - What had the people whose data it was been told?
      - What was the outcome?
    common_errors:
      - Assuming internal reuse never needs review.

  - external_key: behavioral.integrity_values.survey_anonymity_promise
    competency_key: culture_values
    topic: Protecting anonymity you promised
    difficulty: medium
    text: >-
      Tell me about a time you collected feedback or survey answers on the understanding they would stay
      anonymous, and someone later wanted to know who said what. How did you handle it?
    expected_concepts:
      - the promise made to participants
      - declining to identify individuals
      - protecting against indirect identification in small groups
      - offering aggregated insight instead
    rubric:
      excellent: Keeps the promise firmly, protects against indirect identification, offers useful aggregated insight instead, and explains why the promise mattered for future feedback.
      good: Refuses to identify people and shares themes instead.
      weak: Identifies or hints at the source under pressure.
    followups:
      - Who asked, and how did they react?
      - How do you design feedback collection to avoid this?
    common_errors:
      - Sharing details specific enough to identify the person.

  - external_key: behavioral.integrity_values.unfair_automated_rule
    competency_key: culture_values
    topic: An automated rule treating people unfairly
    difficulty: medium
    text: >-
      Tell me about a time you noticed that a scoring rule, filter or automated decision was treating some users
      or customers unfairly, even though it was meeting its targets. What did you do about it?
    expected_concepts:
      - evidence of the unfair outcomes
      - how the unfairness arose
      - raising it with owners with data
      - proposing changes and checks to monitor outcomes
      - outcome
    rubric:
      excellent: Brings evidence of unfair outcomes, explains the likely cause, pushes owners to change the rule, and introduces ongoing monitoring of outcomes.
      good: Raises the problem with evidence and suggests a fix.
      weak: Accepts it because the targets were met, or raises it without evidence.
    followups:
      - How did you show the problem in data?
      - How would you monitor for it going forward?
    common_errors:
      - Treating overall accuracy as proof of fairness.

  # ------------------------------------------------------------ timely disclosure and public claims
  - external_key: behavioral.integrity_values.delayed_notification_pressure
    competency_key: culture_values
    topic: Pressure to delay telling affected people
    difficulty: medium
    text: >-
      Describe a time something had gone wrong that affected customers or colleagues and there was pressure to
      wait before telling them. How did you think about the timing?
    expected_concepts:
      - the impact on the affected people
      - the reasons given for waiting
      - weighing what people needed to protect themselves against the case for waiting
      - any notification obligations
      - the decision and outcome
    rubric:
      excellent: Weighs the affected people's need to act against the reasons for waiting, considers any notification obligations, pushes for a prompt and accurate notice, and reports the outcome.
      good: Pushes for timely notification with a clear reason.
      weak: Accepts the delay to protect the company's image.
    followups:
      - What did the affected people need to know to protect themselves?
      - Who made the final decision on timing?
    common_errors:
      - Waiting for a complete picture before saying anything.

  - external_key: behavioral.integrity_values.public_claims_accuracy
    competency_key: culture_values
    topic: Accuracy in public write-ups and talks
    difficulty: medium
    text: >-
      If you've written or helped with something public about your work, like a case study, a blog post or a
      conference talk, how did you make sure the claims were accurate and you had permission to share them?
    expected_concepts:
      - checking numbers and claims against evidence
      - getting permission from customers or partners named
      - removing confidential details
      - crediting the people who did the work
    rubric:
      excellent: Describes verifying claims against evidence, obtaining permission from named parties, removing confidential details and crediting contributors, with an example of something they changed.
      good: Checks the claims and the permissions.
      weak: Publishes impressive claims without checking, or names customers without permission.
    followups:
      - What did you have to cut or soften?
      - Who reviewed it before it went out?
    common_errors:
      - Rounding results up to make the story better.

  - external_key: behavioral.integrity_values.colleague_published_error
    competency_key: culture_values
    topic: Finding an error in a colleague's published work
    difficulty: medium
    text: >-
      Tell me about a time you found a significant error in something a colleague had already shared widely,
      such as a dashboard, a report or documentation. How did you handle it?
    expected_concepts:
      - confirming the error
      - telling the colleague first and privately
      - helping them correct it and inform the audience
      - handling it if the colleague was reluctant
    rubric:
      excellent: Confirms the error, raises it privately with the colleague first, helps them correct it and notify everyone affected, and handles reluctance without embarrassing them.
      good: Tells the colleague and makes sure it gets fixed.
      weak: Corrects it publicly without involving the colleague, or ignores it.
    followups:
      - What would you have done if they didn't want to correct it?
      - How did you raise it without embarrassing them?
    common_errors:
      - Fixing it silently so nobody learns of the error.

  # ------------------------------------------------------------ leading on integrity
  - external_key: behavioral.integrity_values.normalised_corner_cutting
    competency_key: leadership
    topic: Changing a team where cutting corners had become normal
    difficulty: hard
    text: >-
      Tell me about a time you joined or led a team where cutting corners, like skipping reviews or fudging
      reports, had become normal. What did you do to change it, and how did it go?
    expected_concepts:
      - evidence of the practice and its risks
      - understanding the pressures that created it
      - modelling the standard themselves first
      - changing incentives, tooling or deadlines that drove it
      - measuring whether behaviour changed
    rubric:
      excellent: Explains why the shortcuts had become normal, models the standard, removes the pressures behind it through changes to incentives, process or tooling, and shows evidence that behaviour changed.
      good: Addresses the practice directly and introduces changes that help.
      weak: Simply tells people to stop, or accepts it as the team's way.
    followups:
      - What pressure was causing the shortcuts?
      - How did you know it had actually changed?
    common_errors:
      - Blaming individuals for a problem created by the system around them.

  - external_key: behavioral.integrity_values.fair_investigation_of_allegation
    competency_key: leadership
    topic: Handling an allegation about someone fairly
    difficulty: hard
    text: >-
      Have you had to respond to a complaint or allegation about someone you managed or worked closely with?
      Tell me how you made sure the process was fair to everyone involved.
    expected_concepts:
      - involving HR or the appropriate function early
      - keeping an open mind and avoiding prejudgement
      - hearing all sides and gathering evidence
      - protecting confidentiality and preventing retaliation
      - communicating the outcome appropriately
    rubric:
      excellent: Describes involving the right function early, avoiding prejudgement, gathering evidence from all sides, protecting confidentiality and the person who raised it, and closing the loop appropriately.
      good: Follows a fair process with the right people involved.
      weak: Handles it alone informally, or decides based on their opinion of the people.
    followups:
      - How did you protect the person who raised it?
      - What did you do to avoid prejudging?
    common_errors:
      - Trying to resolve a serious allegation informally to keep things quiet.

  - external_key: behavioral.integrity_values.manager_misconduct
    competency_key: culture_values
    topic: Concerns about your own manager's conduct
    difficulty: hard
    text: >-
      Tell me about a time you had a serious concern about the conduct of your own manager or someone with power
      over your work. How did you decide what to do, and what happened?
    expected_concepts:
      - the conduct and its impact
      - gathering facts and documenting
      - considering a direct conversation where appropriate
      - using skip-level, HR or ethics channels
      - outcome and reflection on the personal risk
    rubric:
      excellent: Describes documenting facts, choosing a sensible route such as a direct conversation, skip-level or formal channel based on the severity, following through despite the personal risk, and reflects on the outcome.
      good: Raises the concern through an appropriate channel.
      weak: Does nothing because of the power imbalance, or acts on unverified suspicion.
    followups:
      - What made you choose that channel?
      - How did it affect your work afterwards?
    common_errors:
      - Confusing a disagreement about management style with a conduct concern.

  - external_key: behavioral.integrity_values.competing_principles
    competency_key: culture_values
    topic: When two good principles conflict
    difficulty: hard
    text: >-
      Describe a situation where two things you cared about at work pulled in opposite directions, for example
      being transparent with a customer versus protecting a confidential decision, or meeting a commitment versus
      shipping with known risk. How did you resolve it?
    expected_concepts:
      - the two principles and why each mattered
      - the people affected by each option
      - seeking more information or advice
      - a reasoned decision and how it was communicated
      - reflection on what they would do again
    rubric:
      excellent: Articulates both principles and who each option affected, explains how they gathered information and advice, makes a reasoned decision that minimised harm, and reflects on it candidly.
      good: Explains the conflict and a reasoned decision.
      weak: Does not recognise the tension, or picks the convenient option without reasoning.
    followups:
      - Who did you consult?
      - Looking back, would you weigh it the same way?
    common_errors:
      - Describing a case where one option was obviously wrong, so there was no real conflict.

  - external_key: behavioral.integrity_values.incentive_driving_bad_behaviour
    competency_key: leadership
    topic: Fixing a goal that rewarded the wrong behaviour
    difficulty: hard
    text: >-
      Tell me about a time you realised a goal, incentive or recognition scheme you set or influenced was pushing
      people towards the wrong behaviour. What did you change, and how did you explain it?
    expected_concepts:
      - the goal and the behaviour it produced
      - how they noticed the problem
      - owning their part in the design
      - redesigning the goal around the real outcome
      - communicating the change and its reasons
    rubric:
      excellent: Describes noticing the unintended behaviour through evidence, owning their part in the design, redesigning the goal around the real outcome, and explaining the change openly to those affected.
      good: Recognises the problem and changes the goal.
      weak: Blames people for gaming it without changing the incentive.
    followups:
      - How did you spot the behaviour?
      - How did people react to the new goal?
    common_errors:
      - Adding more rules on top of a broken incentive instead of fixing it.
