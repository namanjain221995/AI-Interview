# Behavioural: communication (4 of 4) — listening and questioning, teaching, communicating impact and
# change, cross-functional and external communication, and repairing communication breakdowns.
# Questions ask for real past examples; evaluation is based only on the content of the answer,
# never on delivery style or personality.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: communication
questions:
  # ------------------------------------------------------------------ easy
  - external_key: behavioral.communication.listening_changed_the_plan
    topic: When listening changed what you did
    difficulty: easy
    text: >-
      Tell me about a time listening carefully to someone changed what you ended up doing. What did you hear
      that you might otherwise have missed?
    expected_concepts:
      - the situation and what they first planned
      - the specific detail they picked up
      - follow-up questions that drew it out
      - how the plan changed and the result
    rubric:
      excellent: Identifies the specific detail they heard, the questions that drew it out, and a clear change of plan with a better result than the original course.
      good: Gives a real example where listening led to a useful change.
      weak: Describes listening as a general habit with no concrete effect.
    followups:
      - What question helped you hear it?
      - What would have happened if you had missed it?
    common_errors:
      - An example where nothing actually changed.

  - external_key: behavioral.communication.explain_your_work_to_outsider
    topic: Explaining your own work to someone outside your field
    difficulty: easy
    text: >-
      Pick a recent piece of work you're proud of and explain it to me as if I worked in a completely different
      department. What was it, and why did it matter?
    expected_concepts:
      - the problem in plain terms
      - who benefited and how
      - what they personally did
      - a concrete result
    rubric:
      excellent: Explains the problem, their own contribution and the result in plain language with a concrete example, so that someone outside the field understands why it mattered.
      good: Gives a mostly clear explanation with a result, with some jargon.
      weak: Relies on jargon or internal names, or never gets to why it mattered.
    followups:
      - If you had only one sentence, what would you say?
      - Who else would you explain it to differently, and how?
    common_errors:
      - Describing the tools used instead of the problem solved.

  - external_key: behavioral.communication.teaching_a_skill
    topic: Teaching someone how to do something
    difficulty: easy
    text: >-
      Tell me about a time you taught someone how to do something, such as a tool, a technique or part of a
      process. How did you structure what you showed them?
    expected_concepts:
      - starting from what they already knew
      - showing, then letting them try
      - breaking it into manageable steps
      - checking they could do it alone
    rubric:
      excellent: Describes a structure that started from the learner's level, moved from demonstration to practice and ended with the learner doing it independently.
      good: Taught the skill with a sensible approach and a positive result.
      weak: Did the task for them, or cannot describe how they taught it.
    followups:
      - Where did they struggle?
      - What would you change if you taught it again?
    common_errors:
      - Doing it for the learner instead of letting them practise.

  - external_key: behavioral.communication.questions_in_unfamiliar_area
    topic: Asking questions to learn an unfamiliar area
    difficulty: easy
    text: >-
      Tell me about a time you started working in an area you didn't know well. What questions did you ask, and
      who did you ask, to get up to speed?
    expected_concepts:
      - finding the right people to ask
      - preparing questions by reading first
      - asking about purpose and history, not only mechanics
      - writing down and sharing what they learned
    rubric:
      excellent: Describes targeted questions prepared in advance, the right sources, and a clear account of how quickly they became effective, ideally leaving a record for the next person.
      good: Asked sensible questions of the right people and got up to speed.
      weak: Relied entirely on trial and error, or cannot recall what they asked.
    followups:
      - Which question taught you the most?
      - What did you write down for the next person?
    common_errors:
      - Asking questions that the existing material already answered.

  - external_key: behavioral.communication.summary_for_someone_absent
    topic: Summarising a discussion for someone who missed it
    difficulty: easy
    text: >-
      Tell me about a time you had to summarise a long discussion or a large amount of information for someone
      who wasn't there. How did you decide what mattered?
    expected_concepts:
      - what that person needed to know or do
      - decisions and open questions first
      - leaving out the back-and-forth
      - pointing to detail if they want it
    rubric:
      excellent: Shaped the summary around the reader's needs, led with decisions and open questions, left out the debate and shows the reader could act without asking more.
      good: Produced a clear, relevant summary.
      weak: Recounted the discussion in order, or the summary missed the decisions.
    followups:
      - What did you leave out?
      - Did they need to ask follow-up questions?
    common_errors:
      - Retelling the discussion chronologically.

  - external_key: behavioral.communication.updates_without_being_chased
    topic: Keeping people informed without being chased
    difficulty: easy
    text: >-
      How do you keep your manager or stakeholders aware of how your work is going without them having to chase
      you? Give me an example.
    expected_concepts:
      - agreeing what they want to hear and how often
      - short, regular updates
      - flagging problems early rather than waiting for the next update
      - adjusting when needs change
    rubric:
      excellent: Describes agreeing the format and frequency with the person, sticking to it, and raising problems early outside the rhythm, with evidence that they never had to chase.
      good: Gives regular updates with a real example.
      weak: Updates only when asked, or gives no example.
    followups:
      - What happens when there's nothing new to report?
      - How did you raise a problem between updates?
    common_errors:
      - Reporting only good news in routine updates.

  - external_key: behavioral.communication.writing_for_end_users
    topic: Writing for end users or customers
    difficulty: easy
    text: >-
      Tell me about a time you wrote something for end users or customers, such as help text, a notice or release
      notes. How did you make sure they would understand it?
    expected_concepts:
      - using the user's words rather than internal terms
      - focusing on what changes for them and what to do
      - keeping it short
      - testing it on someone outside the team
    rubric:
      excellent: Describes specific choices of wording and structure aimed at the user, testing it on real or representative readers, and evidence it worked such as fewer support questions.
      good: Wrote clear, user-focused text.
      weak: Wrote in internal language with no thought about the reader.
    followups:
      - What internal term did you have to replace?
      - How did you find out whether users understood it?
    common_errors:
      - Using internal project names users have never seen.

  - external_key: behavioral.communication.adjusting_live_explanation
    topic: Adjusting an explanation as you go
    difficulty: easy
    text: >-
      Tell me about a time you explained something to a colleague live, for example while working through a
      problem together, on a call or at a whiteboard. How did you adjust as you went based on their questions?
    expected_concepts:
      - listening to the questions for gaps
      - backing up to fill missing context
      - changing the example or level of detail
      - checking where they were before moving on
    rubric:
      excellent: Gives a specific moment where a question revealed a gap, describes how they changed course and shows the colleague then understood and could proceed.
      good: Adjusted the explanation in response to questions.
      weak: Delivered a fixed explanation regardless of questions.
    followups:
      - Which question told you something was missing?
      - What did you do differently afterwards?
    common_errors:
      - Answering the literal question without addressing the confusion behind it.

  # ---------------------------------------------------------------- medium
  - external_key: behavioral.communication.getting_real_answers_from_people
    topic: Asking questions that get real answers
    difficulty: medium
    text: >-
      Tell me about a time you gathered information by talking to people, such as users, customers or colleagues
      in another team. How did you ask questions so you got real answers rather than what they thought you wanted
      to hear?
    expected_concepts:
      - open, non-leading questions
      - asking about past behaviour and real examples
      - listening more than talking
      - following up on surprises
      - checking findings against other evidence
    rubric:
      excellent: Describes specific non-leading techniques such as asking about real past examples, follow-up on surprises and cross-checking, and a finding that changed a decision.
      good: Asked open questions and gathered useful information.
      weak: Asked leading or yes-or-no questions, or confirmed what they already believed.
    followups:
      - What did you hear that surprised you?
      - Give me an example of a question you rephrased.
    common_errors:
      - Pitching an idea and treating politeness as agreement.

  - external_key: behavioral.communication.numbers_for_non_data_people
    topic: Using numbers with people who don't work with data
    difficulty: medium
    text: >-
      Tell me about a time you used numbers or data to explain a situation to people who don't usually work with
      data. How did you choose which numbers to show?
    expected_concepts:
      - the question the audience needed answered
      - a few numbers that answer it
      - comparisons and context to make numbers meaningful
      - plain-language interpretation
      - limits of the data
    rubric:
      excellent: Chose a small set of numbers tied to the audience's question, gave context and comparison, stated the interpretation plainly with its limits and shows the audience acted on it.
      good: Presented relevant numbers clearly.
      weak: Showed many figures without interpretation or context.
    followups:
      - What number did you deliberately leave out?
      - How did you explain how reliable the numbers were?
    common_errors:
      - Showing raw numbers with no comparison point.

  - external_key: behavioral.communication.rolling_out_a_new_way_of_working
    topic: Getting people to adopt a new process or tool
    difficulty: medium
    text: >-
      Tell me about a time you introduced a new process, tool or way of working that other people had to adopt.
      How did you explain it and get people to actually use it?
    expected_concepts:
      - explaining the problem it solves for them
      - involving early users and their feedback
      - simple getting-started material
      - support during the switch
      - measuring adoption
    rubric:
      excellent: Explained the benefit in users' terms, involved early users, made starting easy, supported people through the change and gives evidence of real adoption.
      good: Explained the change clearly and saw reasonable adoption.
      weak: Announced it and assumed people would switch.
    followups:
      - Who was slowest to adopt it, and why?
      - What did you change based on early feedback?
    common_errors:
      - Explaining how it works without explaining why people should care.

  - external_key: behavioral.communication.running_a_workshop
    topic: Running a training session or workshop
    difficulty: medium
    text: >-
      Tell me about a training session, workshop or talk you ran. How did you design it, and how did you find out
      whether people learned what you intended?
    expected_concepts:
      - clear learning goals
      - mixing explanation with practice
      - pitching to the audience's level
      - checking learning during and after
      - improving the next session
    rubric:
      excellent: Describes explicit learning goals, a design mixing explanation and practice, real checks of learning and specific improvements made afterwards.
      good: Ran a well-structured session with some feedback.
      weak: Measured success by attendance or by how it felt.
    followups:
      - What did the feedback tell you?
      - What did you cut from the content?
    common_errors:
      - Covering too much material for the time.

  - external_key: behavioral.communication.showing_project_impact
    topic: Communicating the results of a project
    difficulty: medium
    text: >-
      Tell me about a time you had to summarise the results of a project for people outside your team. How did
      you show its impact?
    expected_concepts:
      - the original goal
      - measurable outcomes against the goal
      - what didn't work or is still open
      - credit to contributors
      - what it means for the audience
    rubric:
      excellent: Ties the results to the original goal with measurable outcomes, is open about what fell short, credits others and explains what it means for the audience.
      good: Clearly summarised results with some measures.
      weak: Listed activity and features without outcomes.
    followups:
      - What result were you least sure how to present?
      - How did you credit the people involved?
    common_errors:
      - Reporting output, such as features shipped, instead of outcomes.

  - external_key: behavioral.communication.making_invisible_work_visible
    topic: Explaining the value of invisible work
    difficulty: medium
    text: >-
      Tell me about a time you had to explain the value of work most people never see, such as maintenance,
      cleanup or risk reduction, to someone deciding priorities. How did you make its value clear?
    expected_concepts:
      - translating the work into cost, time or risk
      - concrete examples of past problems it would prevent
      - comparing with the cost of not doing it
      - a proposal sized to fit
    rubric:
      excellent: Translated the work into terms the decision-maker cared about using concrete examples and a comparison with the cost of inaction, and secured a decision.
      good: Made a reasonable case with some concrete evidence.
      weak: Argued that it was simply the right thing to do.
    followups:
      - What evidence was most persuasive?
      - How did you show the benefit afterwards?
    common_errors:
      - Using technical arguments the decision-maker can't weigh.

  - external_key: behavioral.communication.aligning_a_cross_functional_start
    topic: Aligning people from different functions at the start of a project
    difficulty: medium
    text: >-
      Tell me about the start of a project involving people from different functions. How did you make sure
      everyone had the same understanding of the goal and their part in it?
    expected_concepts:
      - a shared written statement of the goal
      - clear roles and responsibilities
      - agreeing terms and success measures
      - surfacing concerns from each function
      - checking alignment as work began
    rubric:
      excellent: Describes concrete steps such as a shared goal statement, agreed roles and success measures, surfacing each function's concerns, and evidence of alignment as work progressed.
      good: Took reasonable steps to align people at the start.
      weak: Assumed alignment from a single kickoff meeting.
    followups:
      - Where did misalignment show up anyway?
      - How did you write down who owned what?
    common_errors:
      - Agreeing the goal without agreeing how success is measured.

  - external_key: behavioral.communication.external_partner_expectations
    topic: Setting clear expectations with an external party
    difficulty: medium
    text: >-
      Tell me about working with an external partner, vendor or client where expectations needed to be very
      clear. How did you communicate requirements and confirm you were aligned?
    expected_concepts:
      - written requirements with examples
      - agreed acceptance criteria
      - regular check-ins on progress
      - early review of partial work
      - handling changes formally
    rubric:
      excellent: Describes written requirements with examples and acceptance criteria, early checks of partial work and a defined way to handle changes, with a delivery that matched expectations.
      good: Communicated requirements clearly and checked in.
      weak: Relied on an initial conversation and was surprised by the result.
    followups:
      - What did they misunderstand despite the requirements?
      - How did you handle a change request?
    common_errors:
      - Reviewing the work only at the end.

  - external_key: behavioral.communication.checking_your_updates_work
    topic: Checking whether your communication is working
    difficulty: medium
    text: >-
      How do you find out whether your updates and messages are actually working for the people who receive
      them? Tell me about something you changed as a result.
    expected_concepts:
      - asking readers directly
      - watching for repeated questions or missed actions
      - experimenting with format or frequency
      - a specific change and its effect
    rubric:
      excellent: Describes concrete signals they watch for, asking readers directly, and a specific change to format or frequency with an observable improvement.
      good: Has some way of getting feedback and made a change.
      weak: Assumes communication works unless someone complains.
    followups:
      - What signal told you something wasn't working?
      - What did you stop sending?
    common_errors:
      - Measuring communication by how much was sent.

  - external_key: behavioral.communication.simple_looking_request_explained
    topic: Explaining why a simple-looking request is hard
    difficulty: medium
    text: >-
      Tell me about a time someone asked for something that looked simple to them but was much harder than they
      realised. How did you explain why?
    expected_concepts:
      - understanding what they actually needed
      - explaining the hidden complexity with an example
      - offering a simpler option that met most of the need
      - avoiding making them feel the request was unreasonable
    rubric:
      excellent: Explained the hidden complexity with a relatable example, offered a cheaper option that met most of the need and reached an agreed way forward.
      good: Explained the difficulty clearly and agreed a plan.
      weak: Simply said it was hard, or quietly took on the work without discussion.
    followups:
      - What example did you use?
      - Which option did they choose?
    common_errors:
      - Explaining the complexity without offering an alternative.

  - external_key: behavioral.communication.when_you_cant_share_everything
    topic: Communicating when you can't share all the details
    difficulty: medium
    text: >-
      Tell me about a time you had to communicate something when you couldn't share all the details, for example
      confidential information or a plan that wasn't confirmed yet. How did you handle people's questions?
    expected_concepts:
      - being clear that there is information they can't share
      - sharing what can be shared accurately
      - not making misleading statements
      - saying when more would be known
    rubric:
      excellent: Was explicit about the limits, shared what they could accurately, avoided misleading statements and set expectations about when more would be known.
      good: Handled the limits sensibly without misleading anyone.
      weak: Shared confidential detail, or gave answers that turned out to be misleading.
    followups:
      - What was the hardest question to answer?
      - How did people react once the full picture was shared?
    common_errors:
      - Denying something that later turns out to be true.

  - external_key: behavioral.communication.mistake_affecting_others_explained
    topic: Explaining your own mistake to those affected
    difficulty: medium
    competency_key: ownership
    text: >-
      Tell me about a mistake of yours that caused extra work or problems for other people. How did you explain
      it to them?
    expected_concepts:
      - telling them directly and quickly
      - what happened and its effect on them
      - what was being done to fix it
      - what would prevent it happening again
    rubric:
      excellent: Told the affected people directly and quickly, explained the mistake and its impact on them without excuses, and set out both the fix and the prevention.
      good: Told the people affected and explained the fix.
      weak: Minimised the mistake, blamed circumstances, or let others discover it.
    followups:
      - Who did you tell first?
      - What did you offer to do for the people affected?
    common_errors:
      - Long explanations that read as excuses.

  # ------------------------------------------------------------------ hard
  - external_key: behavioral.communication.unclear_direction_from_leadership
    topic: Turning unclear direction into something a team can act on
    difficulty: hard
    text: >-
      Tell me about a time leadership gave a direction that was unclear, and the people around you were confused
      about what it meant for them. How did you get clarity and explain it to them?
    expected_concepts:
      - identifying the specific open questions
      - going back to leadership with concrete questions or a proposed interpretation
      - explaining what is known and unknown
      - translating it into concrete next steps
      - updating people as it became clearer
    rubric:
      excellent: Pinned down the specific ambiguities, went back with concrete questions or a proposed interpretation, explained the known and unknown to others and turned it into clear next steps.
      good: Sought clarification and passed it on clearly.
      weak: Passed the confusion on, or made up an interpretation without checking.
    followups:
      - What interpretation did you propose?
      - What did people do while it was still unclear?
    common_errors:
      - Presenting a guess about leadership's intent as fact.

  - external_key: behavioral.communication.one_story_after_mixed_messages
    topic: Restoring one consistent message
    difficulty: hard
    text: >-
      Tell me about a time different people had been giving a group conflicting messages about a project, and you
      had to bring everyone back to one consistent story. How did you do it?
    expected_concepts:
      - finding out what each person had said
      - agreeing the correct position with the other messengers
      - a single clear correction to the audience
      - a single source of truth going forward
    rubric:
      excellent: Mapped what had been said, agreed the correct position with the other people involved first, issued one clear correction and set up a single source of truth that stopped the confusion.
      good: Clarified the message and reduced the confusion.
      weak: Added another message to the mix without aligning with the others first.
    followups:
      - How did you get the other people to agree first?
      - How did you avoid making anyone look bad?
    common_errors:
      - Correcting the audience before aligning the people who sent the conflicting messages.

  - external_key: behavioral.communication.making_a_hidden_risk_concrete
    topic: Getting non-specialists to act on a risk
    difficulty: hard
    text: >-
      Tell me about a time you had to convince non-specialists to act on a risk they couldn't easily see, such as a
      security, reliability or compliance risk. How did you make it concrete for them?
    expected_concepts:
      - a realistic scenario of what could happen
      - impact in business terms
      - likelihood based on evidence
      - a proportionate, costed proposal
      - the decision made
    rubric:
      excellent: Made the risk concrete with a realistic scenario and business impact, grounded likelihood in evidence, proposed a proportionate costed action and secured a decision.
      good: Explained the risk in accessible terms and got some action.
      weak: Relied on technical detail or fear without a clear proposal.
    followups:
      - What scenario did you describe?
      - What would you have done if they had accepted the risk?
    common_errors:
      - Overstating the risk so the proposal looks out of proportion.

  - external_key: behavioral.communication.defending_a_recommendation_live
    topic: Defending a recommendation under hard questioning
    difficulty: hard
    text: >-
      Tell me about a time you had to present and defend a recommendation live to people who were challenging it
      hard. How did you prepare for their questions, and how did you handle the toughest one?
    expected_concepts:
      - anticipating objections in advance
      - testing the material with a critic beforehand
      - answering directly with evidence
      - conceding valid points
      - outcome of the discussion
    rubric:
      excellent: Prepared by anticipating and rehearsing objections, answered the hardest question directly with evidence, conceded where right and describes the resulting decision.
      good: Prepared well and handled challenges with reasonable answers.
      weak: Was unprepared for predictable objections, or deflected questions.
    followups:
      - Which objection did you not see coming?
      - Did the recommendation change as a result?
    common_errors:
      - Treating every challenge as something to defeat rather than consider.

  - external_key: behavioral.communication.diagnosing_a_communication_breakdown
    topic: Diagnosing and fixing a communication breakdown
    difficulty: hard
    text: >-
      Tell me about a project where communication broke down badly between teams or people. What did you identify
      as the cause, and what did you do to fix it?
    expected_concepts:
      - symptoms of the breakdown
      - underlying causes such as unclear ownership or incentives
      - their own part in it
      - structural fixes rather than reminders
      - evidence the fix worked
    rubric:
      excellent: Distinguishes symptoms from root causes, acknowledges their own part, describes structural fixes such as clearer ownership or shared forums and shows evidence of improvement.
      good: Identified a credible cause and took action that helped.
      weak: Blames the other side, or the fix was asking people to communicate more.
    followups:
      - What was your own contribution to the breakdown?
      - How long did it take to see improvement?
    common_errors:
      - Treating the breakdown as a clash between individuals rather than a structural problem.
