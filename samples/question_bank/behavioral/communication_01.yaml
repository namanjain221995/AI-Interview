# Behavioural: communication (1 of 4) — explaining complex ideas and adapting to the audience.
# Questions ask for real past examples; evaluation is based only on the content of the answer
# (structure, relevance, audience adaptation, outcome), never on delivery style or personality.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: communication
questions:
  # ------------------------------------------------------------------ easy
  - external_key: behavioral.communication.analogy_that_worked
    topic: Using an analogy or example to explain an idea
    difficulty: easy
    text: >-
      Tell me about a time you used an analogy or a concrete example to help someone understand an idea they
      were struggling with. What was the idea, and why did that example work?
    expected_concepts:
      - the idea and why it was hard for this person
      - choosing an example from the listener's own world
      - where the analogy stops being accurate
      - evidence that the person understood afterwards
    rubric:
      excellent: Names the specific idea and listener, explains why the chosen example mapped onto what the listener already knew, notes its limits and shows the listener could then act on the idea.
      good: Gives a real example with a sensible analogy and a positive result, but little on why it worked or where it breaks down.
      weak: Talks about analogies in general, or the example is unclear and there is no sign the listener understood.
    followups:
      - Where did the analogy break down, and how did you handle that?
      - Have you reused that explanation since?
    common_errors:
      - Describing a habit in general instead of one specific time.

  - external_key: behavioral.communication.onboarding_explanation
    topic: Bringing a newcomer up to speed
    difficulty: easy
    text: >-
      Think of a time you had to bring a new teammate up to speed on a system or process you knew well. How did
      you decide what to explain first and what to leave for later?
    expected_concepts:
      - starting from the purpose and the big picture
      - sequencing what they need first for their first tasks
      - pointing to existing material instead of repeating it
      - checking progress and filling gaps over time
    rubric:
      excellent: Describes a deliberate order driven by what the newcomer needed to do first, uses existing material, checks progress and gives an outcome such as how quickly the person became independent.
      good: Describes a reasonable walkthrough with some prioritisation and follow-up.
      weak: Explains everything at once or relies on "they can ask me", with no thought about order or understanding.
    followups:
      - What did you deliberately leave out of the first week?
      - What would you write down next time so you don't have to repeat it?
    common_errors:
      - Dumping every detail on the first day.

  - external_key: behavioral.communication.checking_understanding
    topic: Checking that an explanation landed
    difficulty: easy
    text: >-
      When you explain something important to a colleague, how do you find out whether they actually understood
      it? Give me a recent example.
    expected_concepts:
      - asking the listener to restate or apply the idea
      - open questions rather than asking if it makes sense
      - watching what they do next
      - following up and correcting misunderstandings
    rubric:
      excellent: Gives a specific recent case where they used a concrete check such as asking the person to apply or restate the idea, found a gap and corrected it.
      good: Describes a sensible checking habit with a real example, though the check is light.
      weak: Relies on asking whether it makes sense, or gives no example.
    followups:
      - What did you do when it turned out they hadn't understood?
      - How do you check understanding in writing rather than in person?
    common_errors:
      - Treating silence or a nod as understanding.

  - external_key: behavioral.communication.status_update
    topic: Writing a regular status update
    difficulty: easy
    text: >-
      Tell me about a regular status update you wrote for a project. What did you put in it, and how did you
      decide what to leave out?
    expected_concepts:
      - progress against goals rather than a list of activity
      - risks and blockers stated plainly
      - decisions or help needed from readers
      - consistent, skimmable structure
      - tailoring detail to the readers
    rubric:
      excellent: Describes a consistent structure built around progress, risks and asks, explains what they cut and why, and shows readers acted on it.
      good: Describes a sensible update with progress and risks but less clarity on the readers' needs.
      weak: Describes a list of tasks done with no risks, asks or sense of audience.
    followups:
      - Who read it, and how do you know they read it?
      - How did you report something going badly in that update?
    common_errors:
      - Listing activity instead of progress toward the goal.
      - Hiding risks at the bottom.

  - external_key: behavioral.communication.message_misread
    topic: A written message that was misunderstood
    difficulty: easy
    text: >-
      Tell me about a message or email you sent that was misunderstood. What went wrong, and what have you
      changed in how you write since then?
    expected_concepts:
      - the specific ambiguity or missing context
      - consequence of the misunderstanding
      - how it was noticed and corrected
      - concrete change in writing habits
    rubric:
      excellent: Pinpoints the exact wording or missing context that caused the misreading, describes the correction, and names a specific writing habit they changed that has held since.
      good: Identifies the cause and a reasonable lesson.
      weak: Blames the reader, or the lesson is only to be clearer.
    followups:
      - How did you find out it had been misunderstood?
      - What does that habit look like in a message you wrote recently?
    common_errors:
      - Putting the misunderstanding entirely on the reader.

  - external_key: behavioral.communication.clarifying_vague_request
    topic: Clarifying a vague request
    difficulty: easy
    text: >-
      Tell me about a time you got a request that was vague or unclear. How did you work out what the person
      actually needed before you started?
    expected_concepts:
      - asking about the goal behind the request
      - restating the request back in their own terms
      - agreeing what done looks like
      - confirming in writing when useful
    rubric:
      excellent: Describes specific questions aimed at the underlying goal, a playback of their understanding, an agreed definition of done and an outcome that met the real need.
      good: Asked clarifying questions and delivered something useful.
      weak: Started on an assumption, or only asked questions after the work was done.
    followups:
      - Which question gave you the most useful answer?
      - What would have happened if you had built what was first asked for?
    common_errors:
      - Asking only about details, not about the purpose.

  - external_key: behavioral.communication.meeting_outcome_alignment
    topic: Leaving a meeting with shared understanding
    difficulty: easy
    text: >-
      After an important meeting, how do you make sure everyone leaves with the same understanding of what was
      decided? Tell me about a time you did this.
    expected_concepts:
      - summarising decisions out loud before ending
      - naming owners and dates for actions
      - sending a short written recap
      - correcting differences in understanding quickly
    rubric:
      excellent: Describes a specific meeting where they summarised decisions and owners before closing, followed up in writing, and caught or prevented a misunderstanding.
      good: Describes a recap habit used in a real meeting.
      weak: Assumes everyone understood, or relies on someone else to take notes.
    followups:
      - Did anyone disagree with your recap? What happened?
      - How long was the written follow-up?
    common_errors:
      - Recapping discussion without stating decisions and owners.

  - external_key: behavioral.communication.two_minutes_with_senior
    topic: Explaining an issue in very little time
    difficulty: easy
    text: >-
      Tell me about a time you had only a couple of minutes to explain an issue to a busy senior person. How did
      you decide what to say?
    expected_concepts:
      - leading with the point or the decision needed
      - one or two supporting facts
      - stating the impact in their terms
      - offering detail on request
    rubric:
      excellent: Opened with the conclusion or ask, gave only the facts needed to support it, framed impact for that person and got a clear decision or next step.
      good: Kept it short and relevant, with a reasonable outcome.
      weak: Started with background and ran out of time before the point.
    followups:
      - What did you leave out that you wanted to say?
      - What did they ask you, and were you ready for it?
    common_errors:
      - Telling the story in chronological order.

  - external_key: behavioral.communication.instructions_used_without_you
    topic: Instructions others follow without you
    difficulty: easy
    text: >-
      Tell me about a set of written instructions you created that other people had to follow without you
      there, such as a guide, a checklist or a handover note. How did you make sure they could use it?
    expected_concepts:
      - writing for the reader's starting knowledge
      - numbered steps with expected results
      - covering likely problems
      - testing it with someone who hadn't done it before
      - updating it from feedback
    rubric:
      excellent: Describes clear structure aimed at the reader, tested it with a real user, fixed the gaps found and shows it was used successfully.
      good: Reasonable instructions with some evidence they worked.
      weak: Wrote them from memory with no testing and no knowledge of whether they were used.
    followups:
      - What did the first person to use it get stuck on?
      - Who keeps it up to date now?
    common_errors:
      - Skipping steps that feel obvious to the author.

  # ---------------------------------------------------------------- medium
  - external_key: behavioral.communication.same_change_many_audiences
    topic: Tailoring one message to several audiences
    difficulty: medium
    text: >-
      Tell me about a time you had to explain the same change or decision to several different groups, for
      example engineers, managers and customers. How did your message differ for each?
    expected_concepts:
      - identifying what each group cares about
      - changing depth and vocabulary per group
      - keeping the core facts consistent
      - choosing the right channel for each
      - checking each group knew what it meant for them
    rubric:
      excellent: Contrasts concretely what each group heard and why, keeps the underlying facts consistent across versions and shows each group could act on it.
      good: Describes adapting the message for at least two audiences with some reasoning.
      weak: Sent the same message to everyone, or the differences are only in length.
    followups:
      - Which group asked the questions you least expected?
      - How did you make sure the versions didn't contradict each other?
    common_errors:
      - Different groups ending up with inconsistent facts.

  - external_key: behavioral.communication.wrong_level_of_detail
    topic: Misjudging the level of an explanation
    difficulty: medium
    text: >-
      Tell me about a time you pitched an explanation at the wrong level for your audience, either too
      technical or too simplified. How did you notice, and how did you adjust?
    expected_concepts:
      - signals that the level was wrong
      - adjusting during the conversation
      - asking what the audience already knew
      - preparing differently afterwards
    rubric:
      excellent: Describes specific signals they picked up, how they changed course in the moment and a lasting change in how they gauge an audience before explaining.
      good: Recognises the mistake and describes a reasonable adjustment.
      weak: Did not notice until much later, or attributes the problem to the audience.
    followups:
      - What question do you now ask before explaining something?
      - Is it easier for you to err on the side of too much or too little detail?
    common_errors:
      - Choosing an example where nothing went wrong.

  - external_key: behavioral.communication.explaining_tradeoff_reasoning
    topic: Explaining the reasoning behind a trade-off
    difficulty: medium
    text: >-
      Tell me about a decision involving a real trade-off that you had to explain to people who would have
      chosen differently. How did you explain the reasoning?
    expected_concepts:
      - stating the options fairly, including the one not chosen
      - the criteria used to decide
      - what was given up and why it was acceptable
      - acknowledging the other view
      - what would make the decision worth revisiting
    rubric:
      excellent: Lays out the options and criteria fairly, is explicit about what was sacrificed, and explains how they addressed the objections, with a clear result.
      good: Explains the decision and its reasons with some acknowledgement of the alternative.
      weak: Only defends the chosen option, or says the decision was simply announced.
    followups:
      - What would have changed your mind?
      - Did the people who disagreed accept the reasoning?
    common_errors:
      - Presenting the alternative as a straw man.

  - external_key: behavioral.communication.presentation_that_worked
    topic: Preparing and structuring a presentation
    difficulty: medium
    text: >-
      Describe a presentation or demo you gave that you think went well. How did you prepare, and how did you
      structure it for the people in the room?
    expected_concepts:
      - clear purpose and desired outcome
      - structure built around the audience's questions
      - a strong opening and summary
      - rehearsal or dry run
      - preparing for likely questions
    rubric:
      excellent: Ties the structure to a specific purpose and audience, describes preparation including likely questions, and gives evidence of the outcome it achieved.
      good: Describes sensible preparation and structure for a real presentation.
      weak: Describes the slides or the topic but not the audience, purpose or result.
    followups:
      - What did you cut during preparation?
      - How did you know it went well?
    common_errors:
      - Judging success by how it felt rather than by what happened next.

  - external_key: behavioral.communication.diagram_beat_words
    topic: Using a visual to explain
    difficulty: medium
    text: >-
      Tell me about a time a diagram, chart or sketch did a better job than words at explaining something. What
      did you draw, and how did people use it?
    expected_concepts:
      - what was hard to explain in words
      - choosing the right kind of visual
      - keeping the visual simple and labelled
      - how the visual changed the discussion or decision
    rubric:
      excellent: Explains why the idea was visual by nature, describes the specific visual and its design choices, and shows how it changed understanding or a decision.
      good: Describes a useful visual and a positive effect.
      weak: Mentions using slides or diagrams in general without a specific case.
    followups:
      - What did the first version get wrong?
      - Was it reused later by others?
    common_errors:
      - Overloading the visual with every detail.

  - external_key: behavioral.communication.same_words_different_meanings
    topic: Groups using the same terms differently
    difficulty: medium
    text: >-
      Tell me about a time two groups you worked with were using the same words to mean different things. How
      did you notice, and what did you do about it?
    expected_concepts:
      - the specific term and the two meanings
      - how the mismatch surfaced
      - agreeing shared definitions
      - recording the definitions where people would find them
    rubric:
      excellent: Names the term, explains the two meanings and their consequence, describes how a shared definition was agreed and recorded, and shows the confusion stopped.
      good: Identifies the mismatch and resolved it for the immediate work.
      weak: Vague about the terms involved, or the fix depended on everyone remembering.
    followups:
      - What would have happened if nobody had noticed?
      - How did you get both groups to accept one definition?
    common_errors:
      - Fixing it in one conversation without recording it.

  - external_key: behavioral.communication.making_it_shorter
    topic: Shortening without losing what matters
    difficulty: medium
    text: >-
      Tell me about a time you had to make a long document, report or message much shorter without losing what
      mattered. How did you decide what to cut?
    expected_concepts:
      - identifying the reader and the one thing they need
      - moving detail to an appendix or link
      - removing repetition and background
      - checking the short version still supports the decision
    rubric:
      excellent: Explains the criteria used to cut, where detail went instead of disappearing, and confirms the shorter version still served the reader's decision.
      good: Describes a sensible cut with a reasonable rationale.
      weak: Shortened by trimming words evenly rather than by priority.
    followups:
      - What was the hardest thing to cut?
      - Did anyone go looking for the detail you removed?
    common_errors:
      - Cutting the caveats that the decision depends on.

  - external_key: behavioral.communication.sharing_an_uncertain_estimate
    topic: Communicating uncertainty in an estimate
    difficulty: medium
    text: >-
      Tell me about a time you had to share an estimate or a plan when you were genuinely unsure about it. How
      did you communicate the uncertainty so people could still make decisions?
    expected_concepts:
      - giving a range rather than a single number
      - naming the main unknowns
      - saying when the estimate would firm up
      - updating people as things became clearer
    rubric:
      excellent: Gave a range with the specific unknowns behind it, set a point at which it would be refined, updated people as promised and the decision-makers could plan around it.
      good: Communicated the uncertainty clearly with some follow-up.
      weak: Gave a single number with no sign of the risk behind it, or refused to estimate at all.
    followups:
      - How did people react to getting a range instead of a date?
      - How close was the final result to your range?
    common_errors:
      - Padding the number silently instead of explaining the risk.

  - external_key: behavioral.communication.question_you_couldnt_answer
    topic: A question you couldn't answer on the spot
    difficulty: medium
    text: >-
      Think of a time someone asked you a question in a meeting or presentation that you couldn't answer on the
      spot. How did you handle it, and what did you do afterwards?
    expected_concepts:
      - saying plainly that they didn't know
      - sharing what they did know
      - committing to a follow-up with a time
      - following up as promised
    rubric:
      excellent: Acknowledged the gap without guessing, offered what was known, committed to a specific follow-up and delivered it, and describes how they prepared differently later.
      good: Admitted not knowing and followed up.
      weak: Guessed or bluffed, or never followed up.
    followups:
      - How long did the follow-up take?
      - Did the answer change anything that had been decided in the room?
    common_errors:
      - Guessing to avoid admitting a gap.

  - external_key: behavioral.communication.customer_need_to_team
    topic: Translating user needs for a delivery team
    difficulty: medium
    text: >-
      Tell me about a time you took what a customer or user said and turned it into something a delivery team
      could act on. What got lost or changed in translation, and how did you handle that?
    expected_concepts:
      - separating the underlying need from the requested solution
      - writing it in the team's terms with examples
      - preserving the user's own words where useful
      - confirming the result with the user
    rubric:
      excellent: Distinguishes the need from the ask, describes how it was written up for the team, identifies something that was distorted and how they caught and corrected it with the user.
      good: Describes a reasonable translation with some validation.
      weak: Passed the request along as-is, or cannot say what changed.
    followups:
      - What did the team ask that the customer hadn't thought about?
      - How did you check the end result with the customer?
    common_errors:
      - Passing on the customer's proposed solution as the requirement.

  - external_key: behavioral.communication.explaining_why_a_rule_exists
    topic: Explaining the reason behind a process
    difficulty: medium
    text: >-
      Tell me about a time people were following a process or rule without understanding why it existed, or
      were ignoring it. How did you explain the reasoning, and did anything change?
    expected_concepts:
      - finding out the real reason behind the rule
      - explaining the risk it protects against with an example
      - listening to why people found it a burden
      - changing the rule or the explanation where justified
    rubric:
      excellent: Explains the purpose with a concrete example of what it prevents, takes on board objections, and shows a change in behaviour or an improvement to the rule itself.
      good: Explained the rule's purpose and saw some improvement.
      weak: Simply repeated the rule or escalated without explaining.
    followups:
      - Did you learn anything that made you question the rule?
      - Where did you write the explanation down?
    common_errors:
      - Citing authority instead of explaining the reason.

  # ------------------------------------------------------------------ hard
  - external_key: behavioral.communication.convincing_skeptical_expert
    topic: Making a case to a skeptical expert
    difficulty: hard
    text: >-
      Tell me about a time you had to explain an idea to someone who knew the subject at least as well as you
      did and was skeptical of your conclusion. How did you make your case?
    expected_concepts:
      - understanding the expert's specific objection
      - bringing evidence rather than assertion
      - conceding valid points
      - narrowing the disagreement to testable questions
      - the resulting decision
    rubric:
      excellent: States the expert's objection accurately, describes the evidence they brought, concedes valid points and narrows the disagreement to something that could be tested, with a clear outcome either way.
      good: Made a reasoned case with evidence and reached a resolution.
      weak: Relied on repetition or authority, or cannot describe the other person's argument.
    followups:
      - What part of their objection turned out to be right?
      - If they hadn't come round, what would you have done next?
    common_errors:
      - Describing the expert's view in a way they would not recognise.

  - external_key: behavioral.communication.framing_options_for_leaders
    topic: Framing a complex decision for senior leaders
    difficulty: hard
    text: >-
      Tell me about a complex problem you had to explain to senior leaders so they could make a decision they
      would be accountable for. How did you frame the options, and what did they decide?
    expected_concepts:
      - a short statement of the decision required
      - a small number of real options with costs and risks
      - a clear recommendation with reasons
      - anticipating the questions leaders would ask
      - follow-through after the decision
    rubric:
      excellent: Frames a crisp decision with genuinely distinct options, quantifies costs and risks, gives a reasoned recommendation and describes the decision made and what followed.
      good: Presents options and a recommendation clearly with a real outcome.
      weak: Presented a single option, or overwhelmed leaders with detail and no recommendation.
    followups:
      - What did you leave out of the main material, and why?
      - What question from them did you not expect?
    common_errors:
      - Offering options that are not real alternatives.
      - No recommendation, leaving leaders to work it out.

  - external_key: behavioral.communication.one_message_mixed_readers
    topic: One message read by audiences with different interests
    difficulty: hard
    text: >-
      Tell me about a time you had to write one message that would be read by several audiences with different
      interests, such as customers, your own team and leadership. How did you make it work for all of them?
    expected_concepts:
      - identifying each audience's main question
      - a structure that answers the broadest question first
      - wording that stays accurate for every reader
      - having it reviewed by representatives of each audience
      - handling follow-up questions consistently
    rubric:
      excellent: Explains how the structure and wording served each audience, the trade-offs they made between them, how it was reviewed and how follow-up questions were handled consistently.
      good: Describes a carefully written message with some thought for different readers.
      weak: Wrote it for one group and others had to interpret it.
    followups:
      - Which audience did you have to compromise on?
      - What feedback did you get after it went out?
    common_errors:
      - Statements that are accurate for one audience and misleading for another.

  - external_key: behavioral.communication.explanation_kept_failing
    topic: When repeated explanations don't land
    difficulty: hard
    text: >-
      Tell me about a time you explained something several times and it still didn't land. What did you try, and
      what finally worked, or why didn't it?
    expected_concepts:
      - diagnosing why the explanation wasn't working
      - changing approach rather than repeating
      - checking for missing prerequisite knowledge
      - considering whether the disagreement was about the idea, not the explanation
      - the eventual outcome and lesson
    rubric:
      excellent: Diagnoses the real barrier, tries genuinely different approaches, considers that the issue might be disagreement rather than understanding, and draws a specific lesson.
      good: Tried more than one approach and reached a result.
      weak: Repeated the same explanation louder or longer, or blames the listener.
    followups:
      - At what point did you change your approach?
      - Was the problem understanding, or agreement?
    common_errors:
      - Assuming the listener lacked ability rather than context.

  - external_key: behavioral.communication.simple_but_accurate
    topic: Simplifying without misleading
    difficulty: hard
    text: >-
      Tell me about a time simplifying an explanation risked leaving people with the wrong impression. How did
      you decide where to draw the line between simple and accurate?
    expected_concepts:
      - which simplification was risky and why
      - the decisions the audience would make from it
      - keeping the caveats that change decisions
      - offering a deeper layer for those who need it
      - checking what people took away
    rubric:
      excellent: Identifies the exact simplification at risk, explains the test they used to decide which caveats stayed, and shows what the audience took away and did with it.
      good: Recognises the tension and made a sensible choice with a real example.
      weak: Treats simplifying as always good, or never noticed the risk.
    followups:
      - Did anyone later act on the simplified version in a way you didn't intend?
      - How would you explain it differently now?
    common_errors:
      - Dropping caveats that affect the decision.
