# Behavioural: learning and feedback (part 1 of 4) - receiving feedback and acting on it.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, reasoning, outcome, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ receiving feedback (easy)
  - external_key: behavioral.learning_feedback.asked_how_doing
    competency_key: culture_values
    topic: Asking how you are doing outside formal reviews
    difficulty: easy
    text: >-
      Tell me about a time you went out of your way to ask someone how you were doing in your role, outside of
      any formal review. Who did you ask, and what did you do with what they told you?
    expected_concepts:
      - why they chose to ask and why that person
      - the question they asked and how specific it was
      - what they heard
      - a concrete change made as a result
    rubric:
      excellent: Explains why they sought input from that particular person, asked a specific question, and describes a concrete change they made and how it played out.
      good: Gives a real example of asking for input and a reasonable change that followed.
      weak: Only mentions formal reviews, or asked but cannot say what they did with the answer.
    followups:
      - What made that person a good source for this?
      - How often do you do this now?
    common_errors:
      - Describing a scheduled performance review instead of something they initiated.

  - external_key: behavioral.learning_feedback.feedback_improved_deliverable
    competency_key: culture_values
    topic: Feedback that made a deliverable better
    difficulty: easy
    text: >-
      Think of a recent piece of work where someone's feedback made the final result better. What was the
      feedback, and how did the work change because of it?
    expected_concepts:
      - the piece of work and its purpose
      - the specific feedback given
      - what they changed in response
      - how the result was better
    rubric:
      excellent: Names the specific feedback, explains what they changed and why, and shows a clear difference in the final result.
      good: Specific example with a change made and a general sense of the improvement.
      weak: Cannot recall specific feedback, or describes only minor cosmetic edits with no reflection.
    followups:
      - Was there any part of the feedback you chose not to take?
      - How did you let the person know what you changed?
    common_errors:
      - Describing the work in detail but not the feedback itself.

  - external_key: behavioral.learning_feedback.peer_feedback
    competency_key: culture_values
    topic: Feedback from a peer
    difficulty: easy
    text: >-
      Tell me about some feedback you got from a peer rather than from a manager. What did they point out, and
      how did you respond to it?
    expected_concepts:
      - context of the working relationship
      - the specific observation from the peer
      - how they engaged with it
      - what changed afterwards
    rubric:
      excellent: Describes a specific observation from a peer, how they engaged with it by asking questions or checking it, and a concrete change in how they worked.
      good: Clear peer feedback and a reasonable response.
      weak: Treats peer input as less important than a manager's, or gives no example of acting on it.
    followups:
      - How did the conversation start?
      - Did it change how you give feedback to that peer?
    common_errors:
      - Choosing an example where the peer was really giving instructions, not feedback.

  - external_key: behavioral.learning_feedback.vague_feedback
    competency_key: culture_values
    topic: Making vague feedback actionable
    difficulty: easy
    text: >-
      Describe a time you were given feedback that was too vague to act on, something like be more proactive or
      think bigger. How did you work out what the person actually meant?
    expected_concepts:
      - the vague feedback and its source
      - clarifying questions or asking for examples
      - turning it into specific behaviours
      - checking back on progress
    rubric:
      excellent: Describes asking for concrete examples, translating the feedback into specific behaviours, and checking back later to confirm they had understood it correctly.
      good: Asked for clarification and made a reasonable change.
      weak: Ignored the feedback because it was unclear, or guessed without checking.
    followups:
      - What question got you the most useful answer?
      - How did you know you had interpreted it correctly?
    common_errors:
      - Guessing the meaning and never confirming it.

  - external_key: behavioral.learning_feedback.user_changed_approach
    competency_key: culture_values
    topic: What a user taught you about your own work
    difficulty: easy
    text: >-
      Tell me about a time something a user or customer said made you change the way you personally approach
      your work, not just one deliverable. What did they say, and what do you do differently now?
    expected_concepts:
      - the user or customer interaction
      - what was learned about their needs
      - the change in personal working approach
      - how the change has held up since
    rubric:
      excellent: Connects a specific user comment to a lasting change in how they approach their work, with an example of applying it later.
      good: Specific user comment and a reasonable change in approach.
      weak: Describes fixing one request with no change to how they work.
    followups:
      - Where else have you applied that since?
      - How do you hear from users now?
    common_errors:
      - Describing a one-off fix rather than a change in approach.

  - external_key: behavioral.learning_feedback.review_comments
    competency_key: culture_values
    topic: Handling detailed review comments
    difficulty: easy
    text: >-
      Walk me through a recent example of how you handled a long list of review comments on your work, whether
      that was code, a document or a design.
    expected_concepts:
      - understanding each comment before responding
      - separating must-fix items from suggestions
      - discussing disagreements with reasons
      - closing the loop with the reviewer
    rubric:
      excellent: Explains how they worked through the comments, distinguished essential from optional, discussed disagreements with reasons and closed the loop with the reviewer.
      good: Addressed the comments sensibly with some explanation of choices.
      weak: Accepted everything without thought or rejected comments without discussion.
    followups:
      - How did you handle a comment you disagreed with?
      - Did anything from that review change how you prepare work for review?
    common_errors:
      - Describing only the mechanics of resolving comments, not their reasoning.

  - external_key: behavioral.learning_feedback.habit_changed
    competency_key: adaptability
    topic: Small feedback that changed a working habit
    difficulty: easy
    text: >-
      Tell me about a small piece of feedback that led you to change a working habit. What was the habit, and
      how did you make the change stick?
    expected_concepts:
      - the habit and why it was a problem
      - the feedback that prompted the change
      - the replacement habit
      - a mechanism to keep it going
    rubric:
      excellent: Names a specific habit, the feedback that prompted it and a concrete mechanism such as a checklist or reminder that kept the new habit in place.
      good: Clear habit change with a plausible way of sustaining it.
      weak: Vague change with nothing to show it lasted.
    followups:
      - How long did it take before it became automatic?
      - Did anyone notice the change?
    common_errors:
      - Describing an intention rather than a changed habit.

  - external_key: behavioral.learning_feedback.early_role_feedback
    competency_key: adaptability
    topic: Feedback in the first months of a role
    difficulty: easy
    text: >-
      Think back to the first few months in a previous role. What feedback did you get early on, and how did you
      adjust the way you worked?
    expected_concepts:
      - expectations of the new role or team
      - the early feedback received
      - specific adjustments made
      - result of the adjustment
    rubric:
      excellent: Describes specific early feedback about the team's expectations, the concrete adjustments they made and how their work was received afterwards.
      good: Real example with a reasonable adjustment.
      weak: Says they received no feedback or cannot name anything they adjusted.
    followups:
      - Did you ask for that feedback, or did it come to you?
      - What would you do in your first month here based on that?
    common_errors:
      - Describing onboarding tasks rather than feedback and adjustment.

  - external_key: behavioral.learning_feedback.closing_the_loop
    competency_key: culture_values
    topic: Going back to the person who gave feedback
    difficulty: easy
    text: >-
      Tell me about a time you went back to someone who had given you feedback to show them what you had changed.
      Why did you do that, and what came of it?
    expected_concepts:
      - the original feedback
      - what was changed in response
      - reason for following up
      - effect on the working relationship or further feedback
    rubric:
      excellent: Explains the original feedback, what changed, why following up mattered, and what further input or trust came from it.
      good: Clear follow-up with a sensible reason.
      weak: Cannot describe a follow-up, or treats it as a formality with no outcome.
    followups:
      - Did they have more to add once you followed up?
    common_errors:
      - Confusing following up with simply thanking the person.

  # ------------------------------------------------------------ harder feedback situations (medium)
  - external_key: behavioral.learning_feedback.disagreed_initially
    competency_key: culture_values
    topic: Testing feedback your first instinct rejected
    difficulty: medium
    text: >-
      Tell me about feedback where your first reaction was that it was simply wrong. How did you test whether
      there was something in it, and what did you end up doing?
    expected_concepts:
      - the feedback and their initial view
      - seeking evidence or other perspectives
      - weighing the feedback fairly
      - the decision and its outcome
      - what they learned from the process
    rubric:
      excellent: Shows they tested their own view against the feedback with evidence or other perspectives, made a reasoned decision either way and explains what happened as a result.
      good: Considered the feedback seriously and reached a sensible decision.
      weak: Dismissed it without examination, or accepted it only to avoid conflict.
    followups:
      - What would have changed your mind the other way?
      - How did you explain your decision to the person?
    common_errors:
      - Telling the story only to show the feedback-giver was wrong.

  - external_key: behavioral.learning_feedback.opposite_feedback
    competency_key: culture_values
    topic: Two people giving opposite feedback
    difficulty: medium
    text: >-
      Describe a time two people gave you opposite feedback on the same piece of work. How did you decide what to
      do?
    expected_concepts:
      - the two positions and the reasons behind them
      - understanding each person's goals
      - bringing the people together or escalating if needed
      - a decision with clear reasoning
      - communicating the outcome to both
    rubric:
      excellent: Uncovers the goals behind each piece of feedback, finds a resolution or makes a reasoned call, and communicates it to both people.
      good: Reasonable decision with some explanation of the trade-off.
      weak: Picks the more senior person's view without thought, or tries to satisfy both and satisfies neither.
    followups:
      - Did you ever bring the two of them together?
      - How did the person whose advice you didn't follow react?
    common_errors:
      - Defaulting to seniority without examining the substance.

  - external_key: behavioral.learning_feedback.criticised_in_meeting
    competency_key: culture_values
    topic: Criticism of your work in front of others
    difficulty: medium
    text: >-
      Tell me about a time your work was criticised in front of others, for example in a review meeting or a
      demo. How did you handle it in the moment and afterwards?
    expected_concepts:
      - the setting and the criticism
      - response in the moment, such as acknowledging and asking questions
      - follow-up conversation afterwards
      - changes made to the work
      - lessons for preparing future reviews
    rubric:
      excellent: Describes engaging with the substance in the meeting, following up privately to understand fully, changing the work and adjusting how they prepare for future reviews.
      good: Handled it constructively and made changes afterwards.
      weak: Focuses on how the criticism was delivered and not on the substance, or made no change.
    followups:
      - What did you say in the room?
      - Would you prepare differently for that kind of review now?
    common_errors:
      - Spending the answer on the other person's delivery rather than on the content.

  - external_key: behavioral.learning_feedback.heard_more_than_once
    competency_key: adaptability
    topic: Feedback you heard several times before acting
    difficulty: medium
    text: >-
      Tell me about a piece of feedback you heard more than once before you really acted on it. What finally made
      you change, and what did you do?
    expected_concepts:
      - the recurring feedback
      - why earlier attempts did not take hold
      - the trigger that led to real change
      - specific actions taken
      - evidence the change lasted
    rubric:
      excellent: Openly explains why earlier attempts failed, what finally shifted, the concrete actions they took and evidence that the change has held.
      good: Clear example with a credible eventual change.
      weak: Claims they always act on feedback immediately, or the change is still only an intention.
    followups:
      - What would have helped you act on it the first time?
      - How do you spot recurring feedback now?
    common_errors:
      - Choosing an example where the feedback was trivial.

  - external_key: behavioral.learning_feedback.communication_feedback
    competency_key: communication
    topic: Feedback on how you communicate
    difficulty: medium
    text: >-
      Tell me about feedback you received on how you communicate, in writing or in meetings. What specifically
      did you change, and how did you know it was working?
    expected_concepts:
      - the specific communication issue raised
      - concrete changes such as structure, length or audience focus
      - practice or tools used
      - signals that it was working
    rubric:
      excellent: Names the specific issue, describes concrete changes to structure or approach and cites observable signals such as fewer follow-up questions or faster decisions.
      good: Specific feedback with a sensible change in how they communicate.
      weak: Generic answer such as I try to be clearer, with no specific change.
    followups:
      - Can you give an example of a message before and after the change?
      - Who did you ask to check your progress?
    common_errors:
      - No observable evidence of improvement.

  - external_key: behavioral.learning_feedback.feedback_given_to_others
    competency_key: adaptability
    topic: Learning from feedback given to someone else
    difficulty: medium
    text: >-
      Tell me about something you learned from feedback that was given to someone else, for example in a team
      review or on a shared document. How did you apply it to your own work?
    expected_concepts:
      - the feedback and the setting where they saw it
      - recognising it applied to their own work too
      - a concrete change they made
      - evidence the change helped
    rubric:
      excellent: Recognises that feedback aimed at someone else applied to their own work, makes a concrete change without waiting to be told and shows the effect.
      good: Picked up a relevant lesson and applied it.
      weak: Cannot think of an example, or only noted that the other person had made a mistake.
    followups:
      - How often do you look at reviews of other people's work?
    common_errors:
      - Focusing on the other person's mistake rather than their own learning.

  - external_key: behavioral.learning_feedback.concerns_surfaced_late
    competency_key: culture_values
    topic: Learning late that someone had concerns
    difficulty: medium
    text: >-
      Tell me about a time you found out late in a piece of work that someone had concerns about it they hadn't
      shared. What did you do then, and what did you change so you would hear sooner next time?
    expected_concepts:
      - how the concerns came to light
      - handling the late concerns on their merits
      - understanding why they were not raised earlier
      - changes such as earlier check-ins or drafts
    rubric:
      excellent: Addresses the late concerns on their merits, investigates why they surfaced late and introduces concrete changes such as earlier drafts or regular check-ins.
      good: Dealt with the concerns and made a reasonable change to hear earlier.
      weak: Blames the other person for not speaking up and changes nothing on their side.
    followups:
      - Why do you think they waited?
      - What do you do now to surface concerns early?
    common_errors:
      - Placing all responsibility on the person who stayed quiet.

  - external_key: behavioral.learning_feedback.checking_progress
    competency_key: adaptability
    topic: Checking whether you are actually improving
    difficulty: medium
    text: >-
      Pick an area where you were told you needed to improve. How did you check whether you were actually getting
      better?
    expected_concepts:
      - the improvement area
      - a defined target or signal of success
      - regular check-ins or measurement
      - adjustments when progress stalled
    rubric:
      excellent: Defines what better looked like, uses concrete signals such as outcomes or repeated feedback to track progress and adjusts the approach when progress stalled.
      good: Has some way of checking progress beyond their own impression.
      weak: Relies only on their own feeling that they improved.
    followups:
      - Who else did you ask to judge your progress?
      - What did you do when you weren't improving fast enough?
    common_errors:
      - Equating effort spent with improvement made.

  - external_key: behavioral.learning_feedback.feedback_on_strength
    competency_key: adaptability
    topic: Feedback about something you saw as a strength
    difficulty: medium
    text: >-
      Tell me about feedback that targeted something you considered one of your strengths. How did you work
      through it?
    expected_concepts:
      - the perceived strength and the feedback
      - examining when the strength becomes a problem
      - adjusting how or when they use it
      - result of the adjustment
    rubric:
      excellent: Recognises how a strength overused or misapplied created problems, describes specific adjustments and the result.
      good: Engages with the feedback and makes a reasonable adjustment.
      weak: Defends the strength without reflection, or gives a disguised boast.
    followups:
      - In what situations do you now dial it back?
    common_errors:
      - Turning the answer into praise of the strength.

  - external_key: behavioral.learning_feedback.indirect_signals
    competency_key: adaptability
    topic: Feedback you picked up without being told
    difficulty: medium
    text: >-
      Describe a time you picked up that something about your work wasn't landing from indirect signals, such
      as a missed outcome, a metric or how people used what you produced, rather than being told. What did you
      notice and what did you do?
    expected_concepts:
      - the signal observed
      - interpreting it and confirming with others
      - change made to their work
      - checking whether the change helped
    rubric:
      excellent: Describes noticing a specific signal, confirming the interpretation with the people involved, changing their work and checking the effect.
      good: Noticed a signal and made a reasonable change.
      weak: Only acts on explicit feedback, or acted on a guess without checking.
    followups:
      - How did you confirm you had read the signal correctly?
    common_errors:
      - Acting on an assumption without checking it.

  - external_key: behavioral.learning_feedback.feedback_near_deadline
    competency_key: adaptability
    topic: Significant feedback close to a deadline
    difficulty: medium
    text: >-
      Tell me about a time you received significant feedback on your work close to a deadline. How did you decide
      what to address now and what to leave for later?
    expected_concepts:
      - the feedback and the deadline
      - triaging by impact and risk
      - agreeing the plan with stakeholders
      - following through on the deferred items
    rubric:
      excellent: Triages the feedback by impact and risk, agrees the split with stakeholders and shows the deferred items were actually handled later.
      good: Reasonable prioritisation with some communication.
      weak: Ignores the feedback to hit the date, or misses the date without discussing the trade-off.
    followups:
      - What happened to the items you deferred?
      - Who did you involve in that decision?
    common_errors:
      - Deferred items never revisited.

  # ------------------------------------------------------------ complex feedback situations (hard)
  - external_key: behavioral.learning_feedback.acted_on_wrong_feedback
    competency_key: adaptability
    topic: Acting on feedback that proved wrong
    difficulty: hard
    text: >-
      Tell me about a time you acted on feedback and it turned out to be the wrong call. How did you recognise
      that, and what did you do next?
    expected_concepts:
      - the feedback and why they acted on it
      - evidence that it was the wrong direction
      - correcting course and the cost involved
      - discussing it with the person who gave the feedback
      - how they now evaluate feedback before acting
    rubric:
      excellent: Explains why the feedback seemed right, the evidence that showed otherwise, how they corrected course and discussed it openly, and how they now weigh feedback before acting.
      good: Recognised the problem and corrected course with some reflection.
      weak: Blames the person who gave the feedback, or draws no lesson about their own judgement.
    followups:
      - What would have told you sooner that it was wrong?
      - How did the conversation with that person go?
    common_errors:
      - Using the example to conclude that feedback should be ignored.

  - external_key: behavioral.learning_feedback.feedback_on_own_leadership
    competency_key: leadership
    topic: Asking the people you lead for feedback
    difficulty: hard
    text: >-
      Tell me how you have asked the people you lead or coordinate for feedback on your own leadership. What did
      you learn that surprised you, and what did you change?
    expected_concepts:
      - method that makes candid input safe, such as anonymous or one-to-one channels
      - specific surprising finding
      - concrete change in leadership practice
      - reporting back to the team
      - checking the change worked
    rubric:
      excellent: Describes a method that made candid input safe, a specific surprising finding, a concrete change in their practice, and closing the loop with the team.
      good: Sought feedback and made a reasonable change.
      weak: Assumes the team would tell them if something were wrong, or cannot name anything they changed.
    followups:
      - How did you make it safe for people to be candid?
      - How did you tell the team what you changed?
    common_errors:
      - Relying only on formal surveys with no follow-up.

  - external_key: behavioral.learning_feedback.direction_changing_feedback
    competency_key: adaptability
    topic: Feedback that changed the direction of your work
    difficulty: hard
    text: >-
      Describe the most significant developmental feedback you've received, the kind that changed the direction
      of your work. How did you act on it over the following months?
    expected_concepts:
      - the feedback and why it was significant
      - a plan with concrete steps
      - support or resources sought
      - setbacks along the way
      - measurable or observable outcome
    rubric:
      excellent: Describes substantial feedback, a deliberate multi-month plan, how they handled setbacks and a clear outcome that others recognised.
      good: Significant feedback with sustained action and a credible result.
      weak: Feedback was minor, or action stopped after the first few weeks.
    followups:
      - Who helped you most, and how?
      - What would you tell someone who got the same feedback?
    common_errors:
      - Describing only the initial reaction, not the sustained effort.

  - external_key: behavioral.learning_feedback.others_must_change_too
    competency_key: collaboration
    topic: Acting on feedback that required others to change
    difficulty: hard
    text: >-
      Tell me about a time acting on feedback about your work meant other people also had to change how they
      worked with you. How did you bring them along?
    expected_concepts:
      - the feedback and why acting alone was not enough
      - explaining the change and its reasons to others
      - negotiating what each person would do differently
      - handling resistance or slow adoption
      - outcome for the work
    rubric:
      excellent: Explains why their own change depended on others, makes the case with the reasons behind the feedback, agrees specific changes with each person and shows the combined result.
      good: Recognised the dependency and got others to adjust with some success.
      weak: Changed only their own part and was surprised it did not help, or imposed the change on others.
    followups:
      - Who was hardest to bring along, and why?
      - What would you have done if they had refused?
    common_errors:
      - Expecting others to adapt without explaining the reason.

  - external_key: behavioral.learning_feedback.personal_feedback_team_problem
    competency_key: ownership
    topic: Personal feedback that revealed a team-wide problem
    difficulty: hard
    text: >-
      Tell me about a time feedback on your own work turned out to point at a problem in how the whole team
      worked. How did you take it beyond fixing your own part?
    expected_concepts:
      - the original feedback
      - recognising the wider pattern
      - building the case with evidence
      - a team-level change in process or tooling
      - result of the change
    rubric:
      excellent: Fixes their own part, shows evidence the issue was systemic, drives a team-level change with buy-in and describes its effect.
      good: Recognised the wider issue and raised it with a reasonable proposal.
      weak: Stops at their own fix or uses the team issue to deflect the feedback.
    followups:
      - Who did you need to convince?
      - How did you avoid it sounding like an excuse?
    common_errors:
      - Using the systemic problem to avoid owning their part.
