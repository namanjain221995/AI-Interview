# Behavioural: collaboration (part 2 of 4) - supporting teammates, sharing knowledge, peer feedback
# and reliability. Evaluation is based only on the content of the example, never on personality,
# emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------------------------- easy
  - external_key: behavioral.collaboration.onboarding_new_teammate
    competency_key: collaboration
    topic: Helping a new teammate get up to speed
    difficulty: easy
    text: >-
      Tell me about a time you helped a new teammate get up to speed. What did you do that made the biggest
      difference for them?
    expected_concepts:
      - understanding what the newcomer already knew
      - a structured starting point (first task, guide, walkthrough)
      - being available for questions
      - checking progress after the first weeks
    rubric:
      excellent: Describes specific actions tailored to the newcomer, such as a well-chosen first task and regular check-ins, and can point to how quickly they became productive.
      good: Gives a real example of practical onboarding help.
      weak: Only says they answered questions when asked.
    followups:
      - What would you add to your team's onboarding after that experience?
      - How did you know when they no longer needed your help?
    common_errors:
      - Overloading the newcomer with everything at once.

  - external_key: behavioral.collaboration.helping_while_under_own_pressure
    competency_key: collaboration
    topic: Helping others while your own work is pressing
    difficulty: easy
    text: >-
      Describe a time a teammate needed a lot of your help while you were under pressure on your own work. How
      did you balance helping them with your own commitments?
    expected_concepts:
      - assessing urgency on both sides
      - setting clear times or limits for help
      - pointing to other resources
      - communicating trade-offs to whoever set priorities
    rubric:
      excellent: Explains how they weighed both priorities, set a workable arrangement for help, pointed the teammate to other resources and flagged trade-offs openly, with both pieces of work landing.
      good: Finds a reasonable balance with a concrete arrangement.
      weak: Either refuses help entirely or drops their own commitments without telling anyone.
    followups:
      - Did your manager or lead know about the trade-off?
      - What did you do so they needed less help next time?
    common_errors:
      - Silently missing their own deadline to help.

  - external_key: behavioral.collaboration.asking_colleague_for_help
    competency_key: collaboration
    topic: Asking a colleague for help
    difficulty: easy
    text: >-
      Tell me about a time you were stuck and asked a colleague for help. How did you decide when to ask, and how
      did you make it easy for them to help you?
    expected_concepts:
      - what they tried first and for how long
      - choosing the right person
      - framing the question with context and attempts
      - what they learned and applied
    rubric:
      excellent: Shows a sensible threshold for asking, chose the right person, framed the request with context and what they had tried, and explains what they took away.
      good: Gives a real example of asking for help effectively.
      weak: Describes struggling alone for a long time or asking without any preparation.
    followups:
      - How long had you been stuck before you asked?
      - How did you thank or repay that colleague?
    common_errors:
      - Treating asking for help as a weakness to avoid.

  - external_key: behavioral.collaboration.covering_unavailable_colleague
    competency_key: collaboration
    topic: Covering a colleague's work
    difficulty: easy
    text: >-
      Tell me about a time you stepped in to cover a colleague's work when they were unexpectedly unavailable. How
      did you pick it up, and how did you hand it back?
    expected_concepts:
      - finding the state of the work
      - prioritising what had to happen now
      - keeping stakeholders informed
      - a clear handback with notes
    rubric:
      excellent: Describes how they reconstructed the state of the work, kept only the essentials moving, informed stakeholders and handed back with a clear summary of what changed.
      good: Covers the work responsibly with a reasonable handback.
      weak: Describes covering vaguely or making changes without leaving a record.
    followups:
      - What was missing that would have made it easier to pick up?
      - What did you change about how you leave your own work after that?
    common_errors:
      - Making major decisions on the colleague's behalf without recording them.

  - external_key: behavioral.collaboration.writing_down_to_unblock_others
    competency_key: collaboration
    topic: Writing things down so others aren't blocked
    difficulty: easy
    text: >-
      Describe something you wrote down mainly so that teammates wouldn't have to come to you for it. What
      prompted it, and how did people use it?
    expected_concepts:
      - the repeated question or bottleneck
      - what they wrote and where they put it
      - keeping it up to date
      - evidence it was used
    rubric:
      excellent: Identifies a real recurring bottleneck, describes a document placed where people look, explains how it stays current and gives evidence it reduced interruptions or errors.
      good: Gives a concrete example of useful documentation for the team.
      weak: Mentions documentation in general terms without a specific case or result.
    followups:
      - How do you know whether people actually read it?
      - Who keeps it current now?
    common_errors:
      - Writing documentation that goes stale with no owner.

  - external_key: behavioral.collaboration.working_side_by_side
    competency_key: collaboration
    topic: Working side by side on one problem
    difficulty: easy
    text: >-
      Tell me about a time you and a colleague worked side by side on the same problem, for example pairing or
      reviewing something together live. How did you share the work in the moment, and what came out of it?
    expected_concepts:
      - why working together suited the problem
      - how roles were shared or swapped
      - making space for the other person's ideas
      - result and what each person learned
    rubric:
      excellent: Explains why working together fitted the problem, how they shared control and ideas, and what the session produced that neither would have reached alone.
      good: Gives a real, productive example of working closely with a colleague.
      weak: Describes one person doing the work while the other watched.
    followups:
      - When does working this way not pay off?
      - What did your colleague notice that you missed?
    common_errors:
      - Dominating the session instead of collaborating.

  - external_key: behavioral.collaboration.cannot_deliver_what_teammate_needs
    competency_key: collaboration
    topic: Telling a teammate you can't deliver
    difficulty: easy
    text: >-
      Tell me about a time you realised you weren't going to deliver something a teammate was counting on. What
      did you do once you knew?
    expected_concepts:
      - how early they recognised the risk
      - telling the teammate promptly
      - options offered (partial delivery, new date, help)
      - learning applied to future commitments
    rubric:
      excellent: Raises the risk as soon as they see it, explains the impact plainly, offers concrete options and shows how they changed the way they make commitments afterwards.
      good: Communicates the problem in reasonable time and helps find a way forward.
      weak: Tells the teammate at the last moment or not at all.
    followups:
      - How did the teammate adjust their plans?
      - What signal would you watch for earlier next time?
    common_errors:
      - Hoping to catch up instead of telling anyone.

  - external_key: behavioral.collaboration.giving_actionable_review_feedback
    competency_key: collaboration
    topic: Giving useful feedback on a colleague's work
    difficulty: easy
    text: >-
      Describe a recent time you gave feedback on a colleague's work, such as a document, design or piece of code.
      How did you make the feedback easy for them to act on?
    expected_concepts:
      - separating must-fix from suggestions
      - specific, example-based comments
      - explaining the reasoning
      - following up or discussing live when needed
    rubric:
      excellent: Describes specific, prioritised feedback with reasons, chose the right channel for harder points and shows the colleague acted on it.
      good: Gives a real example of specific, constructive feedback.
      weak: Feedback described as vague or a list of personal preferences.
    followups:
      - Which comment did they push back on, and what happened?
      - When would you switch from written comments to a conversation?
    common_errors:
      - Mixing minor preferences with blocking issues.

  - external_key: behavioral.collaboration.acting_on_peer_feedback
    competency_key: collaboration
    topic: Acting on feedback from a peer
    difficulty: easy
    text: >-
      Tell me about a time a peer gave you feedback that was hard to hear. What did you do with it?
    expected_concepts:
      - the feedback and its context
      - asking questions to understand it
      - concrete change they made
      - following up with the peer
    rubric:
      excellent: Describes the feedback specifically, how they sought to understand it, a concrete change they made and evidence the change stuck.
      good: Shows they took the feedback seriously and made some change.
      weak: Dismisses the feedback or picks trivial feedback.
    followups:
      - Did you agree with all of it?
      - How did you let the peer know it had helped?
    common_errors:
      - Choosing feedback that was really praise.

  # ------------------------------------------------------------------------------- medium
  - external_key: behavioral.collaboration.peer_quality_affecting_team
    competency_key: collaboration
    topic: When a peer's work affects everyone
    difficulty: medium
    text: >-
      Tell me about a time a teammate's work quality started to affect the rest of the team. How did you approach
      it as a peer rather than as their manager?
    expected_concepts:
      - concrete impact on the team
      - private, direct conversation first
      - understanding their situation and constraints
      - offering specific help
      - involving a lead only if needed
    rubric:
      excellent: Describes specific impact, a direct and respectful conversation focused on the work, practical help offered, and a thoughtful decision about when to involve a lead, with a clear outcome.
      good: Addresses the issue directly and constructively.
      weak: Complains to others, works around the teammate silently, or escalates first.
    followups:
      - What did you learn about why it was happening?
      - At what point would you have involved your lead?
    common_errors:
      - Going to the manager before talking to the teammate.

  - external_key: behavioral.collaboration.spreading_single_person_knowledge
    competency_key: collaboration
    topic: Spreading knowledge held by one person
    difficulty: medium
    text: >-
      Describe a time you noticed that only one person on the team really understood an important area. What did
      you do to spread that knowledge?
    expected_concepts:
      - recognising the risk
      - working with the expert, not around them
      - methods (pairing, rotation, docs, walkthroughs)
      - checking others could act independently
    rubric:
      excellent: Names the risk and its cost, partners with the expert on a concrete plan, uses several methods, and shows others later handled that area without the expert.
      good: Takes concrete steps that spread the knowledge to at least one more person.
      weak: Mentions writing a document once with no evidence it helped.
    followups:
      - How did the expert feel about sharing it, based on how they responded?
      - How did you test that others could really handle it?
    common_errors:
      - Assuming documentation alone transfers knowledge.

  - external_key: behavioral.collaboration.teaching_unfamiliar_skill
    competency_key: collaboration
    topic: Teaching a colleague a new skill
    difficulty: medium
    text: >-
      Tell me about a time you taught a colleague a skill or tool they hadn't used before. How did you adapt the
      way you explained it to what worked for them?
    expected_concepts:
      - assessing their starting point
      - choosing a format (hands-on, examples, reading)
      - adjusting when the first approach didn't land
      - evidence they could use it independently
    rubric:
      excellent: Shows they assessed the colleague's starting point, adapted their approach when needed, and can show the colleague later used the skill without help.
      good: Gives a real example of effective teaching with a positive result.
      weak: Describes explaining once and assuming it worked.
    followups:
      - What didn't work at first?
      - How did teaching it change your own understanding?
    common_errors:
      - Doing the task for them instead of teaching it.

  - external_key: behavioral.collaboration.different_working_style
    competency_key: collaboration
    topic: Working with someone who works very differently
    difficulty: medium
    text: >-
      Describe a time you worked closely with someone whose way of working was very different from yours, for
      example in planning, pace or communication. How did you adjust so you could work well together?
    expected_concepts:
      - specific differences in working approach
      - talking openly about preferences
      - adjustments made by both people
      - result of the collaboration
    rubric:
      excellent: Describes concrete differences in working approach without judging the person, an explicit conversation about how to work together, adjustments on both sides and a good result.
      good: Shows practical adjustments that made the collaboration work.
      weak: Describes the other person as the problem or expects them to adapt entirely.
    followups:
      - What did you learn from their way of working?
      - What did you ask them to change, and how?
    common_errors:
      - Describing the other person's character rather than their working habits.

  - external_key: behavioral.collaboration.peer_delay_threatens_deadline
    competency_key: collaboration
    topic: A teammate's delay puts your deadline at risk
    difficulty: medium
    text: >-
      Tell me about a time a teammate's delay put your own deadline at risk. How did you handle the conversation
      and the work?
    expected_concepts:
      - understanding the cause of the delay
      - joint options (help, re-sequencing, scope cut)
      - transparent update to stakeholders
      - preserving the working relationship
    rubric:
      excellent: Talks to the teammate early to understand the cause, works out options together, informs stakeholders without blaming and delivers the best achievable outcome.
      good: Handles the delay constructively and keeps the work moving.
      weak: Blames the teammate publicly or waits until the deadline passes.
    followups:
      - What did you tell your stakeholders about why it was late?
      - What would you set up differently at the start next time?
    common_errors:
      - Framing the story around the teammate's failure.

  - external_key: behavioral.collaboration.helping_without_taking_over
    competency_key: collaboration
    topic: Helping without doing it for them
    difficulty: medium
    text: >-
      Describe a time you helped a colleague solve a problem without simply solving it for them. Why did you choose
      that approach, and how did it turn out?
    expected_concepts:
      - reason for not taking over
      - guiding questions or hints
      - judging when to step in more directly
      - colleague's growth or independence afterwards
    rubric:
      excellent: Gives a clear reason for guiding rather than doing, describes the specific techniques used, explains when they would step in more, and shows the colleague's later independence.
      good: Gives a real example of supportive coaching with a positive result.
      weak: Either took over the work or left the colleague to struggle without support.
    followups:
      - When is it better to just fix it yourself?
      - How did you keep the deadline safe while they learned?
    common_errors:
      - Withholding help to the point that the work suffered.

  - external_key: behavioral.collaboration.difficult_feedback_to_peer
    competency_key: collaboration
    topic: Giving a peer feedback they didn't want
    difficulty: medium
    text: >-
      Tell me about a time you gave a peer feedback that they probably didn't want to hear. How did you prepare,
      and how did the conversation go?
    expected_concepts:
      - why the feedback mattered
      - choosing the right time and setting
      - specific observations and impact
      - listening to their view
      - follow-up and outcome
    rubric:
      excellent: Prepares specific observations and their impact, chooses an appropriate setting, listens to the peer's side, agrees next steps and describes the outcome.
      good: Delivers clear feedback respectfully with some result.
      weak: Avoids the conversation, delivers it in public, or focuses on the person instead of the work.
    followups:
      - What did they say back that changed your view?
      - What would you do differently in that conversation?
    common_errors:
      - Delivering feedback as general judgement rather than specific observations.

  - external_key: behavioral.collaboration.supporting_team_under_deadline
    competency_key: collaboration
    topic: Helping the whole team under deadline pressure
    difficulty: medium
    text: >-
      Tell me about a time your team was under heavy deadline pressure. What did you do to help the team as a
      whole, beyond your own tasks?
    expected_concepts:
      - understanding the team-level bottleneck
      - picking up work that unblocked others
      - helping to cut or re-sequence scope
      - keeping communication clear
      - sustainable pace afterwards
    rubric:
      excellent: Identifies the team bottleneck, takes specific actions that unblocked others, helps re-plan scope and shows how the team delivered, with a reflection on avoiding a repeat crunch.
      good: Contributes beyond their own tasks in a way that helped the team deliver.
      weak: Describes only working longer hours on their own tasks.
    followups:
      - What did you decide not to do?
      - What did the team change so it didn't happen again?
    common_errors:
      - Equating collaboration with personal overtime.

  - external_key: behavioral.collaboration.coordinating_during_urgent_problem
    competency_key: collaboration
    topic: Coordinating with others during an urgent problem
    difficulty: medium
    text: >-
      Think of a time a serious problem hit and several people had to work on it at once. How did you coordinate
      with the others so you weren't duplicating effort or getting in each other's way?
    expected_concepts:
      - establishing who leads and who does what
      - a shared channel or log of actions
      - frequent short status updates
      - handing off cleanly when people rotated
      - review afterwards
    rubric:
      excellent: Describes clear roles, a shared record of actions, regular updates and clean handoffs, and explains what the group changed afterwards to coordinate better.
      good: Shows practical coordination that avoided duplication on a real example.
      weak: Describes everyone jumping in independently or only their own technical actions.
    followups:
      - How did you decide who was in charge?
      - What went wrong in the coordination, and what changed afterwards?
    common_errors:
      - Describing heroics instead of coordination.

  - external_key: behavioral.collaboration.learning_established_team_norms
    competency_key: adaptability
    topic: Joining a team with established ways of working
    difficulty: medium
    text: >-
      Describe a time you joined a team that already had its own established ways of working. How did you learn
      those norms and start contributing, and when did you suggest changes?
    expected_concepts:
      - observing before changing
      - asking why practices exist
      - early contribution within existing norms
      - proposing change with evidence once trusted
    rubric:
      excellent: Shows they learned the norms and their reasons first, contributed early within them, and later proposed a well-evidenced change that the team adopted.
      good: Integrates effectively and contributes within the team's norms.
      weak: Immediately pushes their previous team's practices or never contributes ideas.
    followups:
      - Which practice did you not understand at first, and why did it exist?
      - How long did you wait before suggesting a change?
    common_errors:
      - Pushing previous ways of working before understanding the current ones.

  - external_key: behavioral.collaboration.handing_off_ongoing_work
    competency_key: collaboration
    topic: Handing ongoing work to a teammate
    difficulty: medium
    text: >-
      Tell me about a time you handed ongoing work to a teammate, for example when you moved to a different
      project. What did you do to set them up to succeed?
    expected_concepts:
      - inventory of open work, risks and decisions
      - walkthrough and overlap period
      - introductions to stakeholders
      - remaining available after the move
    rubric:
      excellent: Describes a complete handover (state, risks, decisions, contacts), an overlap or walkthrough, and availability afterwards, with evidence the teammate carried on smoothly.
      good: Provides a reasonable handover with documentation and a walkthrough.
      weak: A quick message or document with no follow-up.
    followups:
      - What did the teammate still have to ask you afterwards?
      - How did stakeholders learn about the change?
    common_errors:
      - Leaving out undocumented decisions and their reasons.

  # ------------------------------------------------------------------------------- hard
  - external_key: behavioral.collaboration.re_engaging_withdrawn_teammate
    competency_key: collaboration
    topic: Re-engaging a teammate who had pulled back
    difficulty: hard
    text: >-
      Tell me about a time a teammate had pulled back from working with the rest of the team and collaboration was
      suffering. What did you do as a peer, and what changed?
    expected_concepts:
      - observable signs in the work
      - a respectful, private conversation focused on work
      - understanding blockers in how the team operated
      - concrete changes to include them
      - outcome and limits of a peer's role
    rubric:
      excellent: Focuses on observable work patterns, has a respectful conversation, identifies team-level causes they could influence, makes concrete changes and recognises when to involve a lead, with a clear outcome.
      good: Takes constructive peer action that improves the situation.
      weak: Speculates about the person's private life, ignores it, or only reports them.
    followups:
      - What was the team doing that contributed?
      - Where did you draw the line on what a peer should handle?
    common_errors:
      - Speculating about personal reasons instead of focusing on the work.

  - external_key: behavioral.collaboration.mediating_between_teammates
    competency_key: collaboration
    topic: Helping two teammates work through a dispute
    difficulty: hard
    text: >-
      Describe a time two of your teammates were stuck in a persistent disagreement that was slowing the team
      down. What did you do to help them work through it?
    expected_concepts:
      - understanding each side separately
      - finding the underlying interests or facts
      - a structured discussion or decision criteria
      - neutrality and fairness
      - outcome for the team
    rubric:
      excellent: Understands both positions, separates facts from preferences, sets up a fair process or criteria for deciding, stays neutral and shows the team moved forward.
      good: Plays a constructive role that helps resolve the disagreement.
      weak: Takes a side without hearing both or avoids the situation entirely.
    followups:
      - How did you stay neutral if you had an opinion yourself?
      - What would you have done if they still couldn't agree?
    common_errors:
      - Deciding for them without either person's buy-in.

  - external_key: behavioral.collaboration.reducing_dependence_on_few_people
    competency_key: collaboration
    topic: Changing how a team shares knowledge and review
    difficulty: hard
    text: >-
      Tell me about a time you changed how your team shared knowledge or reviewed each other's work so that it no
      longer depended on a few people. How did you get others to adopt it, and what was the effect?
    expected_concepts:
      - evidence of the concentration problem
      - the change introduced
      - getting buy-in, including from the key people
      - measuring the effect (turnaround, coverage, incidents)
      - adjusting after feedback
    rubric:
      excellent: Shows data on the problem, introduces a specific change with buy-in from the key people, adjusts based on feedback and demonstrates a measurable improvement.
      good: Introduces a practical change that spreads the load with some evidence of benefit.
      weak: Describes an idea or a rule that nobody followed.
    followups:
      - Who resisted, and why?
      - How did you keep it going once the novelty wore off?
    common_errors:
      - Mandating a process without addressing why the old pattern existed.

  - external_key: behavioral.collaboration.setting_aside_own_goal_for_team
    competency_key: collaboration
    topic: Putting the team goal ahead of your own
    difficulty: hard
    text: >-
      Tell me about a time you set aside work that mattered for your own goals to help the team reach a more
      important goal. How did you make that call, and what did it cost you?
    expected_concepts:
      - the competing goals and stakes
      - how they weighed the trade-off
      - who they consulted or informed
      - outcome for the team
      - candid account of the personal cost
    rubric:
      excellent: Lays out the trade-off clearly, involves the right people in the decision, shows the team outcome and gives a candid account of what it cost them and how they handled that.
      good: Gives a credible example of choosing the team goal with a positive result.
      weak: Example has no real personal cost or the decision was made for them.
    followups:
      - How did you make sure your own work wasn't forgotten?
      - Would you make the same call again?
    common_errors:
      - Presenting a trivial sacrifice as a major one.

  - external_key: behavioral.collaboration.rebuilding_team_trust_after_letdown
    competency_key: collaboration
    topic: Rebuilding trust after letting the team down
    difficulty: hard
    text: >-
      Describe a time you let your teammates down in a way that damaged their trust in you. What did you do to
      rebuild it?
    expected_concepts:
      - clear ownership of what happened
      - direct acknowledgement to those affected
      - concrete changes in behaviour or process
      - consistent follow-through over time
      - evidence trust recovered
    rubric:
      excellent: Takes clear ownership, acknowledges it directly to those affected, makes specific changes, follows through consistently and points to evidence that trust returned.
      good: Owns the mistake and takes concrete steps to repair the relationship.
      weak: Minimises the impact or chooses an example with no real consequence.
    followups:
      - How long did it take before things felt normal again?
      - What do you do now to avoid a repeat?
    common_errors:
      - Shifting part of the blame to circumstances.
