# Behavioural: integrity and working values (part 1 of 4) - owning mistakes, accurate reporting,
# pressure to cut corners and handling confidential information.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ owning mistakes
  - external_key: behavioral.integrity_values.unnoticed_mistake
    competency_key: culture_values
    topic: Owning a mistake nobody had noticed
    difficulty: easy
    text: >-
      Tell me about a time you found a mistake in your own work that nobody else had spotted yet. What did you
      do once you realised it was there?
    expected_concepts:
      - what the mistake was and who it could affect
      - choosing to disclose it rather than quietly hoping it went unseen
      - who they told and how quickly
      - how the mistake was corrected
      - what they changed to catch similar issues earlier
    rubric:
      excellent: Describes a specific mistake, explains why they disclosed it promptly to the people affected, fixed it, and names a concrete change that reduces the chance of a repeat.
      good: Gives a real example where they disclosed and fixed their own mistake.
      weak: Picks a trivial example, fixes it silently without telling anyone affected, or answers hypothetically.
    followups:
      - How did you decide who needed to know?
      - What would have happened if you had said nothing?
    common_errors:
      - Choosing an example so small that there was no real decision to make.

  - external_key: behavioral.integrity_values.mistake_affecting_colleague
    competency_key: culture_values
    topic: A mistake that created work for someone else
    difficulty: easy
    text: >-
      Describe a situation where something you did, or forgot to do, ended up causing extra work or trouble for
      a colleague. How did you handle it with them?
    expected_concepts:
      - clear description of their own part in the problem
      - acknowledging it directly to the colleague
      - helping to repair the impact rather than leaving it to them
      - adjusting their own habits afterwards
    rubric:
      excellent: States plainly what they did wrong, explains how they acknowledged it to the colleague, took on part of the cleanup, and describes a lasting change in how they work.
      good: Acknowledges their part and helps fix the impact.
      weak: Minimises their role, blames circumstances, or leaves the colleague to absorb the cost.
    followups:
      - What did you actually say to your colleague?
      - What changed in how you work with that person afterwards?
    common_errors:
      - Spending most of the answer on why the mistake was understandable.

  - external_key: behavioral.integrity_values.correcting_published_information
    competency_key: culture_values
    topic: Correcting information you had already shared
    difficulty: medium
    text: >-
      Have you ever shared a number, a report or an answer with others and later discovered it was wrong? Walk
      me through how you went about correcting it.
    expected_concepts:
      - how the error was discovered
      - assessing who had already relied on the wrong information
      - issuing a clear correction to everyone affected, not just a few
      - explaining the cause without excessive justification
      - preventing similar errors through checks or review
    rubric:
      excellent: Describes tracing who used the wrong information, sending a clear and timely correction to all of them, and adding a specific check that prevents recurrence.
      good: Corrects the information with the main audience and explains what went wrong.
      weak: Corrects it only if asked, quietly swaps the file, or cannot give a real example.
    followups:
      - Did anyone make a decision based on the wrong figure, and what did you do about that?
      - How did you word the correction?
    common_errors:
      - Silently replacing the material without telling the people who had already used it.

  # ------------------------------------------------------------ accurate status reporting
  - external_key: behavioral.integrity_values.status_report_pressure
    competency_key: culture_values
    topic: Reporting status accurately when it looks bad
    difficulty: medium
    text: >-
      Tell me about a time a project you were on was clearly off track, but there was pressure to keep reporting
      it as green. What did you do?
    expected_concepts:
      - evidence that the project was really at risk
      - where the pressure came from and why
      - raising the real status with data and a recovery plan
      - choosing the right forum and audience
      - outcome and how stakeholders responded
    rubric:
      excellent: Explains the evidence of risk, how they raised an accurate status with a proposed recovery plan through the right channel, and what that earlier visibility allowed the stakeholders to do.
      good: Raises the real status clearly with supporting facts.
      weak: Goes along with the optimistic status, or describes raising it only after the failure became obvious.
    followups:
      - How did you handle the person who wanted it reported as green?
      - What would you do if your accurate report was overruled?
    common_errors:
      - Presenting bad news with no options or plan attached.

  - external_key: behavioral.integrity_values.metric_gaming
    competency_key: culture_values
    topic: Targets that could be hit by gaming the measure
    difficulty: hard
    text: >-
      Describe a time you or your team had a target or metric that could have been hit on paper without
      actually delivering the real result behind it. How did you approach that?
    expected_concepts:
      - the metric and how it could be gamed
      - recognising the gap between the number and the real goal
      - choosing to pursue the real outcome and being open about the trade-off
      - proposing a better measure or adding context to reporting
      - consequences for the team's reported numbers
    rubric:
      excellent: Names the specific gaming risk, explains how they chose to pursue the real outcome even at a cost to the reported number, and describes getting the metric or its reporting improved.
      good: Recognises the gaming risk and avoids it, explaining the reasoning to their manager.
      weak: Treats hitting the number as the goal regardless of substance, or cannot see the gap.
    followups:
      - How did leadership react to a lower number?
      - What would a better metric have looked like?
    common_errors:
      - Describing a metric problem without any action they personally took.

  - external_key: behavioral.integrity_values.overstated_progress_colleague
    competency_key: culture_values
    topic: A colleague overstating progress
    difficulty: medium
    text: >-
      Suppose you knew a teammate was telling stakeholders their part was nearly done when you could see it was
      far from finished. Tell me about a time you faced something like that, and how you handled it.
    expected_concepts:
      - facts they had about the real state of the work
      - speaking to the colleague directly first
      - giving the colleague a chance to correct the record
      - escalating if the gap would harm the project or customers
      - keeping it about the work, not the person
    rubric:
      excellent: Describes talking to the colleague privately with specific facts, offering help, and escalating appropriately only when the misreporting put the delivery at risk, with a clear outcome.
      good: Raises it with the colleague and makes sure the real status became visible.
      weak: Ignores it, or goes straight to the manager without any attempt to talk to the colleague.
    followups:
      - What did you say in that first conversation?
      - At what point would you have gone to the manager?
    common_errors:
      - Treating it as gossip rather than a delivery risk.

  - external_key: behavioral.integrity_values.saying_i_dont_know
    competency_key: culture_values
    topic: Admitting you don't know instead of bluffing
    difficulty: easy
    text: >-
      Tell me about a time someone senior or a customer asked you something you didn't actually know the answer
      to. How did you respond in the moment, and what happened next?
    expected_concepts:
      - the context and why the question mattered
      - saying clearly what they did and did not know
      - committing to find the answer with a time frame
      - following up with an accurate answer
    rubric:
      excellent: Describes stating the limits of their knowledge clearly, committing to a follow-up with a time frame, and delivering an accurate answer that was used.
      good: Admits not knowing and follows up later.
      weak: Describes guessing and hoping it was right, or never closing the loop.
    followups:
      - How did the person react to you saying you'd come back to them?
      - Have you ever seen a guess cause a problem?
    common_errors:
      - Turning the answer into a story about knowing the answer after all.

  # ------------------------------------------------------------ cutting corners under pressure
  - external_key: behavioral.integrity_values.asked_to_skip_checks
    competency_key: culture_values
    topic: Being asked to skip required checks
    difficulty: medium
    text: >-
      Tell me about a time someone asked you to skip a review, a test or an approval step to hit a deadline.
      How did you decide what to do, and how did it play out?
    expected_concepts:
      - what the check protected against
      - understanding the real deadline pressure
      - offering alternatives such as reduced scope or a faster review
      - refusing or escalating when the risk was unacceptable
      - outcome for both the deadline and the quality
    rubric:
      excellent: Explains what the check protected, describes proposing a concrete alternative that kept the safeguard, and shows how they reached agreement with the requester and what resulted.
      good: Keeps the required step and explains why to the requester.
      weak: Skips the check without discussion, or refuses rigidly with no attempt to help meet the goal.
    followups:
      - What did you offer instead?
      - When, if ever, is it acceptable to skip that kind of step?
    common_errors:
      - Framing the answer as rule-following only, with no understanding of the risk the rule addresses.

  - external_key: behavioral.integrity_values.known_defect_shipping
    competency_key: culture_values
    topic: Shipping with a known problem
    difficulty: medium
    text: >-
      Think of a time something was about to be released or delivered while you knew about a problem in it.
      What did you do about that problem, and who did you tell?
    expected_concepts:
      - severity and who the problem would affect
      - making the issue visible to decision makers
      - documenting the known issue for users or support
      - an agreed plan to fix it after release, or delaying
      - follow-through on that plan
    rubric:
      excellent: Describes assessing the impact, making sure decision makers chose with full information, ensuring users or support were informed, and following through on the fix.
      good: Raises the problem before release and agrees a plan.
      weak: Lets it ship quietly, or raises it only after users complained.
    followups:
      - Who made the final call, and did you agree with it?
      - How did you make sure the fix actually happened?
    common_errors:
      - Assuming that telling one teammate counts as disclosure.

  - external_key: behavioral.integrity_values.unsafe_instruction_from_manager
    competency_key: culture_values
    topic: Pushing back on a manager's instruction
    difficulty: hard
    text: >-
      Tell me about a time your manager or a senior leader asked you to do something you believed was wrong or
      risky for customers or the business. How did you handle that conversation?
    expected_concepts:
      - what was asked and why it was a problem
      - checking their own understanding before objecting
      - raising the concern directly with reasons and alternatives
      - escalating through proper channels if the concern was dismissed
      - outcome and the working relationship afterwards
    rubric:
      excellent: Describes verifying their concern, raising it directly with evidence and an alternative, escalating through an appropriate channel when needed, and reflects on the outcome and relationship.
      good: Raises the concern directly with the leader and explains their reasoning.
      weak: Complies silently, complains to peers without acting, or refuses without explanation.
    followups:
      - What would you have done if they had insisted?
      - How did that conversation affect how you worked together afterwards?
    common_errors:
      - Choosing a disagreement about preference rather than a real ethical or risk concern.

  - external_key: behavioral.integrity_values.inconvenient_safety_concern
    competency_key: culture_values
    topic: Stopping work for a safety or security issue
    difficulty: hard
    text: >-
      Describe a time you raised a security, safety or data protection issue that meant stopping or slowing
      work everyone wanted finished. How did you make the case, and what was the result?
    expected_concepts:
      - the concrete risk and likelihood
      - quantifying impact for decision makers
      - proposing the smallest change that addressed the risk
      - handling resistance and timeline pressure
      - result and whether the concern was borne out
    rubric:
      excellent: Explains the concrete risk with evidence, frames it in business terms, proposes a proportionate fix, handles pushback through the right people, and reports the outcome.
      good: Raises the risk clearly and gets it addressed.
      weak: Only mentions the concern in passing, or blocks work without explaining the risk.
    followups:
      - How did you know the risk was serious enough to slow things down?
      - What did you do to reduce the delay?
    common_errors:
      - Exaggerating risk without evidence to win the argument.

  # ------------------------------------------------------------ confidential information
  - external_key: behavioral.integrity_values.accidental_access_to_data
    competency_key: culture_values
    topic: Gaining access to information you shouldn't have
    difficulty: easy
    text: >-
      Tell me about a time you came across information or access at work that you weren't meant to have, for
      example a shared folder, a document or a permission set up by mistake. What did you do?
    expected_concepts:
      - recognising the access was not intended
      - not using or spreading the information
      - reporting it to the owner or security team
      - checking the access was removed
    rubric:
      excellent: Describes stopping as soon as they realised, not using the information, reporting it promptly to the right owner and confirming the access was corrected.
      good: Reports the access and avoids using the information.
      weak: Looks around further, uses the information, or ignores it without reporting.
    followups:
      - Who did you report it to, and why them?
      - Did you check whether others had the same access?
    common_errors:
      - Assuming that if access was granted, using it must be fine.

  - external_key: behavioral.integrity_values.pressed_for_confidential_info
    competency_key: culture_values
    topic: Being pressed to share confidential details
    difficulty: easy
    text: >-
      Has a friend, a contact at another company or even a colleague ever pushed you for details you were
      expected to keep confidential? Tell me how you handled it.
    expected_concepts:
      - what was confidential and why
      - declining clearly without damaging the relationship
      - sharing only what was appropriate or public
      - reporting the request if it looked like a pattern or risk
    rubric:
      excellent: Gives a specific example, explains how they declined clearly while staying helpful with what could be shared, and recognises when to report the request.
      good: Declines to share and explains the boundary.
      weak: Shares a little because it seemed harmless, or gives a vague example.
    followups:
      - What exactly did you say?
      - How do you decide what is safe to share about your work?
    common_errors:
      - Treating partial disclosure as acceptable because the person was trustworthy.

  - external_key: behavioral.integrity_values.former_employer_information
    competency_key: culture_values
    topic: Information from a previous employer
    difficulty: medium
    text: >-
      When you've moved between jobs or teams, how have you handled knowledge, documents or code from the
      previous place that your new team would have found useful? Give me a concrete example.
    expected_concepts:
      - distinguishing general skills and experience from confidential material
      - not bringing or using proprietary documents or code
      - rebuilding from first principles or public sources instead
      - declining when a new colleague asked for specifics
    rubric:
      excellent: Draws a clear line between transferable expertise and confidential material, gives an example of rebuilding something without the old artefacts, and describes declining a request for specifics.
      good: Explains they avoid bringing confidential material and gives a reasonable example.
      weak: Describes reusing old documents or code, or sees no issue with it.
    followups:
      - Where do you draw the line between what you know and what belongs to them?
      - What would you do if a manager asked how your old company did it?
    common_errors:
      - Assuming internal material is fine to reuse if it was not explicitly marked confidential.

  - external_key: behavioral.integrity_values.customer_data_shortcut
    competency_key: culture_values
    topic: Using real customer data for convenience
    difficulty: medium
    text: >-
      Tell me about a time it would have been faster to use real customer or personal data somewhere it
      shouldn't go, such as a test environment, a spreadsheet or a personal device. What did you decide to do?
    expected_concepts:
      - the shortcut and the data involved
      - understanding the privacy and policy risk
      - finding a compliant alternative such as anonymised or synthetic data
      - helping others avoid the same shortcut
    rubric:
      excellent: Explains the specific data risk, chooses a compliant alternative such as masked or synthetic data despite the extra effort, and helps the team make that alternative easy to use.
      good: Avoids the shortcut and uses an approved approach.
      weak: Takes the shortcut, or does not see the privacy problem.
    followups:
      - How much extra effort did the alternative cost?
      - How did you persuade others to stop using the shortcut?
    common_errors:
      - Assuming internal use of personal data is always acceptable.

  # ------------------------------------------------------------ conflicts of interest
  - external_key: behavioral.integrity_values.conflict_of_interest_disclosure
    competency_key: culture_values
    topic: Declaring a conflict of interest
    difficulty: medium
    text: >-
      Have you ever been involved in a decision where you had a personal connection or interest, like choosing a
      vendor or reviewing someone you knew well outside work? How did you handle your involvement?
    expected_concepts:
      - recognising the conflict early
      - disclosing it to the right person
      - stepping back from the decision or adding an independent reviewer
      - keeping a record of the disclosure
    rubric:
      excellent: Describes recognising the conflict, disclosing it proactively, removing themselves or adding independent oversight, and explains why that protected the decision.
      good: Discloses the conflict and limits their role in the decision.
      weak: Stays involved without disclosure, or argues the connection did not affect them.
    followups:
      - Who did you tell, and how did they respond?
      - Where would you draw the line on what needs to be declared?
    common_errors:
      - Believing that being fair in practice removes the need to disclose.

  - external_key: behavioral.integrity_values.vendor_gift
    competency_key: culture_values
    topic: Gifts and hospitality from vendors
    difficulty: easy
    text: >-
      Tell me about a time a vendor, partner or customer offered you a gift, a meal or some other favour. How
      did you decide whether to accept it?
    expected_concepts:
      - the offer and the business relationship involved
      - checking the company's gifts or hospitality policy
      - considering how accepting would look to others
      - declining or declaring as appropriate
    rubric:
      excellent: Describes checking the relevant policy, weighing whether the offer could influence or appear to influence a decision, and declining or declaring it with a clear explanation.
      good: Checks the policy and acts accordingly.
      weak: Accepts without thought, or has no awareness that such offers matter.
    followups:
      - What would have made it unacceptable?
      - How did you decline without damaging the relationship?
    common_errors:
      - Judging only by the value of the gift rather than the timing and the decision it might affect.

  # ------------------------------------------------------------ credit and attribution
  - external_key: behavioral.integrity_values.credit_for_others_work
    competency_key: culture_values
    topic: Making sure credit goes to the right people
    difficulty: easy
    text: >-
      Tell me about a time you were praised or recognised for something that others had contributed to as much
      as you, or more. What did you do?
    expected_concepts:
      - who actually did which parts of the work
      - correcting or sharing the credit publicly
      - making contributors visible to the people who matter
      - doing so even when it reduced their own visibility
    rubric:
      excellent: Describes publicly naming the real contributors with specifics, in the same forum where the credit was given, and explains why that mattered for the team.
      good: Shares credit with the contributors.
      weak: Accepts the credit silently, or mentions others only vaguely.
    followups:
      - How did you make sure the right people heard about it?
      - Have you ever seen credit go to the wrong person, and what did you do?
    common_errors:
      - Generic thanks to "the team" without naming what others contributed.

  - external_key: behavioral.integrity_values.idea_taken_without_credit
    competency_key: culture_values
    topic: When someone presents your work as theirs
    difficulty: medium
    text: >-
      Describe a time someone presented your work or idea as their own. How did you deal with it, and what did
      you take away from it?
    expected_concepts:
      - facts of what happened
      - addressing it directly and professionally with the person
      - focusing on the record being accurate rather than on blame
      - practical changes such as documenting contributions
    rubric:
      excellent: Describes a direct, fact-based conversation with the person, a constructive resolution, and practical steps that keep contributions visible in future.
      good: Raises it with the person or manager in a measured way.
      weak: Lets it go and resents it, or retaliates publicly.
    followups:
      - What did you say to that person?
      - What do you do now to keep contributions visible?
    common_errors:
      - Spending the answer criticising the other person rather than describing their own actions.

  # ------------------------------------------------------------ transparency with customers
  - external_key: behavioral.integrity_values.bad_news_to_customer
    competency_key: culture_values
    topic: Giving a customer unwelcome news
    difficulty: easy
    text: >-
      Tell me about a time you had to tell a customer or client something they did not want to hear, like a
      delay, a defect or a limitation. How did you approach that conversation?
    expected_concepts:
      - what the news was and why it couldn't be avoided
      - telling them early rather than waiting
      - being clear about impact without spin
      - offering options and a plan
      - outcome for the relationship
    rubric:
      excellent: Describes delivering the news early and clearly, explaining the impact without minimising it, offering concrete options, and the effect on trust afterwards.
      good: Delivers the news clearly with a plan.
      weak: Delays the news, softens it until it is misleading, or lets someone else deliver it.
    followups:
      - Why did you choose that timing?
      - What did the customer do with the information?
    common_errors:
      - Describing spin that technically avoided a lie but left the customer misinformed.

  - external_key: behavioral.integrity_values.overpromising_to_win
    competency_key: culture_values
    topic: Pressure to overpromise
    difficulty: medium
    text: >-
      Have you been in a situation where promising more than you could realistically deliver would have helped
      win a deal, a project or a stakeholder's approval? What did you commit to, and why?
    expected_concepts:
      - the pressure and what was at stake
      - assessing what was realistically achievable
      - committing only to what could be delivered, with clear caveats
      - offering a phased or alternative proposal
      - what happened afterwards
    rubric:
      excellent: Describes resisting an unrealistic commitment, presenting a credible alternative with explicit assumptions, and reflects on the outcome even if it cost something short term.
      good: Makes a realistic commitment and explains the limits.
      weak: Overpromised and hoped to catch up, or presents it as normal practice.
    followups:
      - Did you lose anything by being realistic?
      - How did you explain your caveats to the other side?
    common_errors:
      - Confusing a stretch goal with a commitment made to someone else.

  # ------------------------------------------------------------ policies
  - external_key: behavioral.integrity_values.policy_you_disagreed_with
    competency_key: culture_values
    topic: Following a policy you disagree with
    difficulty: easy
    text: >-
      Tell me about a workplace rule or policy you thought was unnecessary or badly designed. How did you act
      while it was in place, and did you try to change it?
    expected_concepts:
      - the policy and the reason they disagreed
      - understanding why it existed
      - complying while it was in force
      - raising feedback or a proposal through proper channels
    rubric:
      excellent: Explains the policy's purpose, describes complying while making a concrete, evidence-based proposal through the right channel, and reports what came of it.
      good: Complies and raises the disagreement with someone who could change it.
      weak: Ignored the policy, or complained without trying to change it.
    followups:
      - What did you learn about why the rule existed?
      - What would make you decide not to follow a policy?
    common_errors:
      - Describing quietly working around the policy as a pragmatic solution.

  - external_key: behavioral.integrity_values.no_policy_grey_area
    competency_key: culture_values
    topic: Deciding when no rule covers the situation
    difficulty: hard
    text: >-
      Tell me about a situation at work where there was no clear rule or precedent, but you sensed the easy
      option might not be the right one. How did you work out what to do?
    expected_concepts:
      - what made it a grey area
      - who might be affected and how
      - seeking advice from appropriate people or functions
      - a principle or test they used to decide
      - documenting or proposing guidance for next time
    rubric:
      excellent: Describes a real grey area, a structured way of weighing impact on others, getting appropriate advice, a reasoned decision, and turning it into guidance for others.
      good: Thinks through the impact and asks for advice before acting.
      weak: Chooses the convenient option because nothing forbade it, or cannot explain their reasoning.
    followups:
      - Who did you go to for advice, and why them?
      - Would you make the same choice today?
    common_errors:
      - Equating "allowed" with "right".

  - external_key: behavioral.integrity_values.accurate_time_and_expenses
    competency_key: culture_values
    topic: Accuracy in timesheets, billing or expenses
    difficulty: easy
    text: >-
      Many roles involve logging time, billing hours or claiming expenses. Tell me about a time it was tempting,
      or even suggested, to record these less accurately than reality. What did you do?
    expected_concepts:
      - the specific situation and the temptation or suggestion
      - recording accurately anyway
      - raising the issue if a team practice was inaccurate
      - understanding the impact on clients or the company
    rubric:
      excellent: Gives a concrete example, records accurately, explains the impact on the client or company, and describes raising an inaccurate team practice.
      good: Records accurately and explains why.
      weak: Describes rounding or adjusting as harmless, or avoids the specifics.
    followups:
      - What would you do if your team lead told you to bill it differently?
      - How do you handle hours spent fixing your own mistakes?
    common_errors:
      - Treating small, routine inaccuracies as acceptable because everyone does them.

  - external_key: behavioral.integrity_values.rules_bent_for_customer
    competency_key: culture_values
    topic: Bending rules to help a customer
    difficulty: hard
    text: >-
      Describe a time a customer or internal user had a genuine need that the rules didn't allow for, and
      bending them would have been easy. How did you balance helping them with respecting the rules?
    expected_concepts:
      - the customer's need and the rule in the way
      - understanding why the rule existed
      - seeking an approved exception or escalation path
      - being clear with the customer about what was possible
      - fixing the rule or process if it was wrong
    rubric:
      excellent: Shows understanding of the rule's purpose, finds a legitimate path such as an approved exception, keeps the customer informed, and pushes to fix the gap for future cases.
      good: Helps within the rules and escalates for an exception.
      weak: Bends the rule quietly, or refuses without trying to help.
    followups:
      - Who had the authority to make an exception?
      - Did the rule change afterwards?
    common_errors:
      - Presenting a quiet workaround as excellent customer service.
