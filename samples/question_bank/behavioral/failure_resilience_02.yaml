# Behavioural: failure and resilience (part 2 of 4) - rejected ideas, failed experiments, cancelled
# projects and setbacks partly outside your control. Questions ask for real past examples; evaluation
# is based only on the content of the example (actions, results, reflection), never on personality,
# emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ ideas and experiments (easy)
  - external_key: behavioral.failure_resilience.idea_turned_down
    competency_key: ownership
    topic: An idea that was turned down
    difficulty: easy
    text: >-
      Tell me about an idea or suggestion you put forward at work that was turned down. What reasons were you
      given, and what did you do afterwards?
    expected_concepts:
      - the idea and the problem it addressed
      - the reasons for the rejection
      - understanding the decision-makers' concerns
      - what they did next (dropped, reworked, revived later)
    rubric:
      excellent: Explains the idea and the stated reasons for rejection fairly, shows they sought to understand the concerns, and describes a deliberate next step such as reworking it, gathering evidence or letting it go for a good reason.
      good: Accepts the decision and draws a sensible lesson about how they pitched it.
      weak: Dismisses the decision-makers as wrong, or shows no reflection on the rejection.
    followups:
      - If you pitched it again tomorrow, what would you change?
    common_errors:
      - Describing the rejection only as other people not understanding the idea.

  - external_key: behavioral.failure_resilience.work_cancelled
    competency_key: adaptability
    topic: Work you invested in being cancelled
    difficulty: easy
    text: >-
      Describe a time something you'd put a lot of effort into was cancelled or shelved before it was finished.
      How did you wrap it up, and what did you carry forward from it?
    expected_concepts:
      - what was cancelled and why
      - wrapping up responsibly (handover, documentation, cleanup)
      - salvaging reusable parts or knowledge
      - moving quickly to the new priority
    rubric:
      excellent: Understands the reason for cancellation, closes the work out cleanly so it could be resumed or reused, salvages something of value, and redirects effort without delay.
      good: Accepts the cancellation and moves on with some wrap-up.
      weak: Abandons the work with no cleanup, or keeps working on it against the decision.
    followups:
      - Did any of that work get used later?
    common_errors:
      - Leaving half-finished work that confuses others later.

  - external_key: behavioral.failure_resilience.experiment_proved_you_wrong
    competency_key: problem_solving
    topic: An experiment that disproved your expectation
    difficulty: easy
    text: >-
      Tell me about a time you tried something you expected to work, a change, a test or a pilot, and the results
      showed you were wrong. What did you do with that result?
    expected_concepts:
      - the expectation and why they held it
      - how the result was measured
      - accepting the result rather than explaining it away
      - what the result taught them and what changed
    rubric:
      excellent: States the original expectation, shows the result was measured fairly, accepts it rather than rationalising it, and explains how it changed their next decision.
      good: Accepts the result and adjusts plans.
      weak: Explains away the result or repeats the experiment until it agrees with them.
    followups:
      - Did anyone push to ignore the result?
    common_errors:
      - Treating a negative result as a wasted effort instead of useful information.

  - external_key: behavioral.failure_resilience.unforeseen_blocker_midway
    competency_key: adaptability
    topic: An unforeseen obstacle derailing the plan
    difficulty: easy
    text: >-
      Describe a time an obstacle you hadn't anticipated knocked your plan off course halfway through some work.
      How did you get things moving again?
    expected_concepts:
      - the obstacle and its impact on the plan
      - quick assessment of options
      - telling the people affected
      - the adjusted plan and outcome
    rubric:
      excellent: Describes the obstacle concretely, assesses options quickly, informs those affected, and adapts the plan to deliver an acceptable outcome while noting what to anticipate next time.
      good: Adjusts the plan and gets the work moving again.
      weak: Waits for someone else to solve it or describes no adjustment.
    followups:
      - Could you have seen it coming, looking back?
    common_errors:
      - Describing only the obstacle and not their response.

  - external_key: behavioral.failure_resilience.rough_start_new_role
    competency_key: adaptability
    topic: A rough start on a new team or project
    difficulty: easy
    text: >-
      Tell me about a time you joined a new team or project and the first few weeks didn't go well. What went
      wrong, and what did you do to get on track?
    expected_concepts:
      - what was not going well
      - identifying the cause (context, expectations, relationships, skills)
      - specific steps to get up to speed
      - signs that things had improved
    rubric:
      excellent: Identifies concrete problems in their early weeks, diagnoses the causes, takes specific actions such as seeking context or clarifying expectations, and shows measurable improvement.
      good: Recognises the rough start and takes reasonable steps to improve.
      weak: Blames the team or onboarding without describing their own actions.
    followups:
      - What would you do in your first two weeks next time?
    common_errors:
      - Listing onboarding problems without any action they took.

  - external_key: behavioral.failure_resilience.tool_choice_backfired
    competency_key: ownership
    topic: A tool or method you chose that backfired
    difficulty: easy
    text: >-
      Tell me about a tool, library or way of working you chose that turned out to be a poor fit. How did you
      realise it, and what did you do about it?
    expected_concepts:
      - why they chose it
      - the problems that emerged
      - deciding whether to switch or adapt
      - how they evaluate tools or methods now
    rubric:
      excellent: Explains the original reasoning, the specific signs of a poor fit, a reasoned decision on switching versus adapting, and a changed way of evaluating options.
      good: Recognises the poor fit and corrects course.
      weak: Blames the tool entirely without examining their own selection.
    followups:
      - What would a short trial before committing have shown you?
    common_errors:
      - Not reflecting on how the choice was made.

  - external_key: behavioral.failure_resilience.demo_went_wrong
    competency_key: communication
    topic: A demo or presentation that went wrong
    difficulty: easy
    text: >-
      Tell me about a demo or presentation that went wrong while you were giving it. What did you do in the moment,
      and how do you prepare differently now?
    expected_concepts:
      - what went wrong
      - how they handled it in the moment
      - following up with the audience afterwards
      - changes to preparation
    rubric:
      excellent: Describes a sensible recovery in the moment, a clear follow-up with the audience, and specific preparation changes such as rehearsal or fallbacks.
      good: Handles the moment reasonably and makes some preparation change.
      weak: Describes only what went wrong with no recovery or lesson.
    followups:
      - Did you follow up with the audience afterwards?
    common_errors:
      - No change in preparation afterwards.

  - external_key: behavioral.failure_resilience.lost_work_recovered
    competency_key: ownership
    topic: Losing a significant amount of work
    difficulty: easy
    text: >-
      Describe a time you lost a significant amount of work, for example through a lost file, a bad overwrite or a
      broken environment. How did you recover, and what do you do now to protect your work?
    expected_concepts:
      - what was lost and how
      - recovery steps and what was salvaged
      - impact on deadlines and who was told
      - lasting protection (version control, backups, habits)
    rubric:
      excellent: Explains how the loss happened, a methodical recovery, communication about any delay, and a protective habit or tool they still use.
      good: Recovers the work and adopts some protection.
      weak: Treats it as bad luck with no change in practice.
    followups:
      - Have you helped anyone else avoid the same problem?
    common_errors:
      - Blaming the tool without changing how they use it.

  - external_key: behavioral.failure_resilience.change_that_did_not_stick
    competency_key: adaptability
    topic: A working practice you introduced that did not stick
    difficulty: easy
    text: >-
      Tell me about a change you tried to introduce to how you or your team works that didn't stick. Why do you
      think it faded, and what would you do differently?
    expected_concepts:
      - the change and the problem it aimed to solve
      - how it was introduced
      - why it was not adopted or faded
      - what they would do differently
    rubric:
      excellent: Diagnoses specifically why the change faded, such as no clear benefit, too much effort or no owner, and gives a concrete different approach.
      good: Gives a plausible reason it faded and some lesson.
      weak: Blames others for not following it.
    followups:
      - Did you ever try it again?
    common_errors:
      - Assuming announcing a change is enough to make it stick.

  # ------------------------------------------------------------ projects and setbacks (medium)
  - external_key: behavioral.failure_resilience.decided_to_stop
    competency_key: ownership
    topic: Deciding to stop something that was not working
    difficulty: medium
    text: >-
      Tell me about a time you decided to stop a project or approach that you'd already invested heavily in. How
      did you make the call, and how did you explain it to others?
    expected_concepts:
      - the investment so far and the signs it was failing
      - separating sunk cost from future value
      - criteria used to decide
      - communicating the decision and what was salvaged
      - outcome of stopping
    rubric:
      excellent: Shows clear criteria for stopping based on future value rather than past effort, communicates the decision openly with what was learned and salvaged, and shows the freed effort went somewhere better.
      good: Makes a reasonable decision to stop and communicates it.
      weak: Stops only when forced, or keeps going because of past investment.
    followups:
      - What would have made you continue?
      - Did anyone disagree with stopping?
    common_errors:
      - Justifying continuing because of effort already spent.

  - external_key: behavioral.failure_resilience.dependency_let_you_down
    competency_key: ownership
    topic: When a dependency you relied on failed you
    difficulty: medium
    text: >-
      Describe a time a vendor, partner or other team you depended on didn't deliver, and it put your own work at
      risk. How did you recover, and what part of the failure do you think was yours to own?
    expected_concepts:
      - the dependency and how it failed
      - immediate mitigation for their own work
      - working with the dependency to resolve it
      - their own part (monitoring, contingency, early warning)
      - how they manage dependencies now
    rubric:
      excellent: Recovers with practical mitigation, works constructively with the dependency, and identifies what they could have done such as earlier checks or a fallback plan.
      good: Recovers reasonably and works with the other party.
      weak: Blames the dependency entirely and sees nothing they could have done.
    followups:
      - What would an early warning sign have looked like?
    common_errors:
      - Treating dependency risk as entirely someone else's problem.

  - external_key: behavioral.failure_resilience.progress_erased_by_reprioritisation
    competency_key: adaptability
    topic: Losing progress to a change in direction
    difficulty: medium
    text: >-
      Tell me about a time a change in company direction or priorities undid a lot of progress you'd made. How
      did you decide what to keep, and how did you get going on the new direction?
    expected_concepts:
      - understanding the reason for the change
      - assessing what could be reused
      - closing out the old work responsibly
      - ramping up on the new priority
      - result in the new direction
    rubric:
      excellent: Seeks to understand the reasons, makes a deliberate assessment of what to keep, closes out old work cleanly, and shows effective early progress on the new priority.
      good: Adapts to the new direction with some reuse.
      weak: Resists the change or carries on with the old work.
    followups:
      - What questions did you ask about the change?
    common_errors:
      - Not checking what of the old work still had value.

  - external_key: behavioral.failure_resilience.launch_nobody_used
    competency_key: product_sense
    topic: Something you launched that people did not use
    difficulty: medium
    text: >-
      Tell me about something you built or launched that the intended users largely didn't use. How did you find
      out why, and what did you change?
    expected_concepts:
      - the launch and expected adoption
      - measuring actual usage
      - investigating why (talking to users, data)
      - changes made or decision to retire it
      - how they validate demand earlier now
    rubric:
      excellent: Measures adoption, investigates the real reasons with users or data, acts on the findings by changing or retiring it, and validates demand earlier on later work.
      good: Recognises low adoption and makes reasonable changes.
      weak: Assumes users will come eventually or blames marketing.
    followups:
      - What would you have tested before building it?
    common_errors:
      - Equating shipping with success.

  - external_key: behavioral.failure_resilience.not_selected_for_opportunity
    competency_key: ownership
    topic: Not being chosen for an opportunity
    difficulty: medium
    text: >-
      Tell me about a time you went for an opportunity at work, such as leading a project, a stretch assignment or
      a new role, and someone else was chosen. What did you do to understand why, and what did you work on next?
    expected_concepts:
      - the opportunity and what they offered
      - asking for and listening to feedback
      - identifying specific gaps
      - a plan to close them
      - later evidence of progress
    rubric:
      excellent: Seeks specific feedback, identifies concrete gaps without dismissing the decision, follows a deliberate plan to build those skills, and gives later evidence of progress.
      good: Gets feedback and works on some gaps.
      weak: Attributes the decision only to unfairness or does nothing with it.
    followups:
      - How did you support the person who was chosen?
    common_errors:
      - Not asking for feedback at all.

  - external_key: behavioral.failure_resilience.weeks_on_dead_end
    competency_key: problem_solving
    topic: Spending weeks on a dead end
    difficulty: medium
    text: >-
      Describe a time you spent weeks on an approach before realising it was a dead end. Looking back, what were
      the early signals, and how do you watch for them now?
    expected_concepts:
      - the approach and time spent
      - the point at which it was recognised as a dead end
      - early signals that were missed
      - checkpoints or time boxes used now
    rubric:
      excellent: Identifies concrete early signals they missed, explains why they were missed, and describes a specific checkpoint practice such as time boxes or prototype milestones.
      good: Recognises the dead end and draws a reasonable lesson.
      weak: Cannot identify any signal or claims it was unavoidable.
    followups:
      - Who else could have spotted it earlier?
    common_errors:
      - Describing the dead end without the missed signals.

  - external_key: behavioral.failure_resilience.rollout_rolled_back
    competency_key: ownership
    topic: A rollout that had to be reversed
    difficulty: medium
    text: >-
      Tell me about a rollout or change you led that had to be reversed. How did you decide to roll back, and what
      did you change before trying again?
    expected_concepts:
      - the change and how it failed
      - the decision to roll back and how fast
      - communication to affected people
      - analysis before the second attempt
      - outcome of the second attempt
    rubric:
      excellent: Shows a quick, deliberate rollback decision based on clear criteria, communicates well, analyses the failure, and makes specific changes that let the second attempt succeed.
      good: Rolls back sensibly and improves the next attempt.
      weak: Delays rolling back to avoid admitting failure, or retries without changes.
    followups:
      - Had you decided in advance what would trigger a rollback?
    common_errors:
      - Retrying the same rollout without understanding the failure.

  - external_key: behavioral.failure_resilience.learned_from_others_failure
    competency_key: culture_values
    topic: Learning from someone else's failure
    difficulty: medium
    text: >-
      Tell me about a failure someone else had, on your team or elsewhere, that changed how you do your own work.
      What did you take from it, and how did you apply it?
    expected_concepts:
      - the failure and how they learned of it
      - the lesson relevant to their own work
      - specific change applied
      - sharing the lesson without blame
    rubric:
      excellent: Describes another's failure without blame, draws a specific lesson for themselves, and shows a concrete change in their work as a result.
      good: Gives a relevant lesson and some application.
      weak: Focuses on criticising the other person.
    followups:
      - How did you learn the details of what happened?
    common_errors:
      - Using the example to criticise someone rather than learn.

  - external_key: behavioral.failure_resilience.string_of_setbacks
    competency_key: adaptability
    topic: Keeping work moving through several setbacks in a row
    difficulty: medium
    text: >-
      Describe a stretch of work where several things went wrong one after another. How did you keep the most
      important work moving, and what did you let go?
    expected_concepts:
      - the sequence of setbacks
      - re-prioritising around the most important outcome
      - deliberately deferring or dropping work
      - keeping stakeholders informed
      - outcome
    rubric:
      excellent: Describes the setbacks concretely, re-prioritises explicitly around what mattered most, consciously drops or defers lower-value work, and keeps others informed through to a result.
      good: Keeps the main work moving and communicates.
      weak: Tries to keep everything going and delivers little, or gives no clear priorities.
    followups:
      - How did you decide what to let go?
    common_errors:
      - Describing heroics rather than prioritisation.

  - external_key: behavioral.failure_resilience.stakeholder_disappointed_delivery
    competency_key: stakeholder_management
    topic: A stakeholder disappointed with what you delivered
    difficulty: medium
    text: >-
      Tell me about a time a stakeholder or customer was disappointed with something you delivered. How did you
      find out what they had expected, and how did you close the gap?
    expected_concepts:
      - what was delivered versus expected
      - understanding the expectation gap
      - a plan to close the gap
      - how expectations are set now
    rubric:
      excellent: Listens to understand the specific gap, takes their share of responsibility for it, agrees a concrete plan to close it, and changes how they set expectations earlier.
      good: Understands the disappointment and fixes the main gap.
      weak: Argues the delivery met the spec and leaves it there.
    followups:
      - At what point could the gap have been spotted earlier?
    common_errors:
      - Defending the delivery instead of understanding the need.

  - external_key: behavioral.failure_resilience.cut_scope_to_salvage
    competency_key: project_management
    topic: Cutting scope to salvage a delivery
    difficulty: medium
    text: >-
      Describe a project that was heading for failure where you had to cut scope to deliver something useful.
      How did you decide what to cut, and how did people take it?
    expected_concepts:
      - signs the project was failing
      - criteria for cutting (value, risk, effort)
      - agreeing the cut with stakeholders
      - what was delivered and its value
      - what happened to the cut scope
    rubric:
      excellent: Uses clear value-based criteria to choose cuts, agrees them openly with stakeholders, delivers something genuinely useful, and has a plan for what was deferred.
      good: Makes reasonable cuts and delivers.
      weak: Cuts quietly without agreement or cuts testing and quality instead of scope.
    followups:
      - Did any of the cut scope ever get delivered?
    common_errors:
      - Cutting quality instead of features.

  # ------------------------------------------------------------ bigger bets (hard)
  - external_key: behavioral.failure_resilience.strategic_bet_did_not_pay_off
    competency_key: ownership
    topic: A strategic bet that did not pay off
    difficulty: hard
    text: >-
      Tell me about a significant bet you championed, a technology, a strategy or a direction, that didn't pay
      off. How did you recognise it, and how did you manage the cost of unwinding it?
    expected_concepts:
      - the bet and the reasoning at the time
      - signals that it was not working
      - acknowledging it to stakeholders
      - plan and cost of unwinding
      - how they make such bets now
    rubric:
      excellent: Explains the original reasoning fairly, recognises failure from evidence, acknowledges it openly, manages a deliberate unwinding plan with costs, and changes how they structure future bets such as staged commitments.
      good: Recognises the failed bet and manages a reasonable exit.
      weak: Defends the bet despite evidence, or leaves others to clean up.
    followups:
      - What would a smaller first step have looked like?
      - How long did it take you to accept it wasn't working?
    common_errors:
      - Not distinguishing a bad bet from bad execution.

  - external_key: behavioral.failure_resilience.initiative_you_led_failed
    competency_key: leadership
    topic: An initiative you led that failed
    difficulty: hard
    text: >-
      Describe an initiative you led that failed to achieve what it set out to do. What do you think you did as
      the leader that contributed to that, and how has it changed the way you lead?
    expected_concepts:
      - the initiative and its goals
      - the shape of the failure
      - their leadership decisions that contributed
      - support for the people involved afterwards
      - lasting change in their leadership approach
    rubric:
      excellent: Names specific leadership decisions that contributed, such as unclear goals, wrong staffing or ignored risks, shows care for the people involved, and describes concrete changes in how they lead now.
      good: Identifies some leadership contribution and a lesson.
      weak: Attributes failure to the team or circumstances only.
    followups:
      - What did the team say in the retrospective?
    common_errors:
      - Describing the team's failures rather than their own leadership.

  - external_key: behavioral.failure_resilience.publicly_corrected_own_work
    competency_key: communication
    topic: Publicly correcting something you had published
    difficulty: hard
    text: >-
      Tell me about a time you had to publicly correct something you'd already shared widely, such as figures, an
      analysis, a status report or a recommendation. How did you handle the correction?
    expected_concepts:
      - what was wrong and how it was found
      - decisions already made on the wrong information
      - a clear, prompt correction to the same audience
      - reviewing downstream decisions
      - process change to prevent recurrence
    rubric:
      excellent: Issues a prompt, clear correction to the same audience, identifies decisions already affected and helps revisit them, and adds a check to prevent recurrence.
      good: Corrects the record clearly.
      weak: Corrects quietly or only for some of the audience.
    followups:
      - Did any decision have to be reversed?
    common_errors:
      - Correcting only to the people who noticed.

  - external_key: behavioral.failure_resilience.inherited_failing_project
    competency_key: project_management
    topic: Turning around a failing project you inherited
    difficulty: hard
    text: >-
      Tell me about a time you took over a project that was already failing. What did you do in the first few
      weeks, and how did you decide what to change first?
    expected_concepts:
      - assessment of the project's real state
      - identifying the main causes of failure
      - resetting scope, plan and expectations
      - quick wins versus structural fixes
      - outcome
    rubric:
      excellent: Gives a structured assessment of the real state, identifies key causes, resets expectations openly, sequences changes sensibly, and shows a measurable turnaround or a well-reasoned decision to stop.
      good: Stabilises the project with reasonable changes.
      weak: Keeps the existing plan or blames the previous owner.
    followups:
      - What did you tell stakeholders in your first week?
    common_errors:
      - Spending the first weeks blaming the previous owner.

  - external_key: behavioral.failure_resilience.metric_success_real_failure
    competency_key: ownership
    topic: Work that looked successful but was not
    difficulty: hard
    text: >-
      Describe a time something you worked on looked successful by the numbers you were tracking, but you later
      realised it hadn't achieved the real goal. How did you find out, and what did you do?
    expected_concepts:
      - the metric and the real goal
      - how the gap was discovered
      - raising it even though the metric looked good
      - changing the measurement
      - corrective action
    rubric:
      excellent: Explains why the metric diverged from the real goal, raises it openly despite the good numbers, changes what is measured, and takes corrective action on the real outcome.
      good: Recognises the gap and adjusts.
      weak: Keeps reporting the favourable metric.
    followups:
      - What did you measure instead afterwards?
    common_errors:
      - Not questioning a metric that looks good.
