# Behavioural: communication (2 of 4) — written communication, documentation, async work and meetings.
# Questions ask for real past examples; evaluation is based only on the content of the answer
# (structure, relevance, audience adaptation, outcome), never on delivery style or personality.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: communication
questions:
  # ------------------------------------------------------------------ easy
  - external_key: behavioral.communication.documentation_people_used
    topic: Documentation that people actually used
    difficulty: easy
    text: >-
      Tell me about a piece of documentation you wrote that people actually used. What made it useful to them?
    expected_concepts:
      - who the readers were and what they needed to do
      - task-oriented structure
      - examples readers could copy or follow
      - evidence it was used, such as fewer repeated questions
    rubric:
      excellent: Names the readers and their task, explains specific structural choices that served that task, and gives concrete evidence of use such as fewer questions or faster onboarding.
      good: Describes a real, useful document with some reasoning about the reader.
      weak: Describes documentation in general, or cannot say whether anyone used it.
    followups:
      - What did readers ask about that the document didn't cover?
      - How did you find out people were using it?
    common_errors:
      - Describing what the document covered rather than why it worked for readers.

  - external_key: behavioral.communication.async_across_time_zones
    topic: Writing for people who aren't online at the same time
    difficulty: easy
    text: >-
      Tell me about working with people who weren't online at the same time as you. How did you write your
      messages so work didn't stall while waiting for replies?
    expected_concepts:
      - self-contained messages with full context
      - stating the decision or answer needed and by when
      - proposing a default if no reply comes
      - anticipating follow-up questions in the first message
    rubric:
      excellent: Gives concrete examples of messages written to stand alone, with clear asks, deadlines and defaults, and shows the delays they avoided.
      good: Describes useful habits with a real example.
      weak: Relies on meetings or waiting, or gives no concrete example of a message.
    followups:
      - What happened when a message wasn't clear enough?
      - What would you put in a handover at the end of your day?
    common_errors:
      - Sending a bare question with no context, costing a full day's round trip.

  - external_key: behavioral.communication.choosing_the_channel
    topic: Choosing the right channel for a message
    difficulty: easy
    text: >-
      How do you decide whether something should be a chat message, an email, a document or a conversation?
      Tell me about a time you chose the channel deliberately.
    expected_concepts:
      - urgency and need for a quick reply
      - sensitivity of the topic
      - need for a durable record
      - complexity and need for back-and-forth
      - switching channel when a thread isn't working
    rubric:
      excellent: Explains clear criteria for choosing a channel and illustrates them with a specific case where the choice made a visible difference.
      good: Has reasonable criteria and a real example.
      weak: Uses one channel for everything, or gives no example.
    followups:
      - When have you moved a conversation from chat to a call, or the other way?
      - How do you handle something sensitive that also needs a written record?
    common_errors:
      - Delivering sensitive news over chat.

  - external_key: behavioral.communication.prepared_meeting
    topic: Preparing others for a meeting
    difficulty: easy
    text: >-
      Tell me about a meeting you organised. What did you send out beforehand, and how did that shape what
      happened in the meeting?
    expected_concepts:
      - stated purpose and desired outcome
      - agenda with time for each item
      - pre-reading that is short and focused
      - inviting only the people needed
    rubric:
      excellent: Describes a specific purpose, agenda and pre-reading, explains why each was chosen, and connects them to a concrete outcome in the meeting.
      good: Sent an agenda and the meeting achieved its goal.
      weak: No preparation beyond the invite, or cannot describe the outcome.
    followups:
      - Did people do the pre-reading? How did you know?
      - Who did you decide not to invite?
    common_errors:
      - An agenda listing topics but not the decisions needed.

  - external_key: behavioral.communication.handover_note
    topic: Handing work over to someone else
    difficulty: easy
    text: >-
      Tell me about a time you handed a piece of work over to someone else, for example before time off or when
      moving to another project. What did you write down, and how did it go?
    expected_concepts:
      - current state and what is in progress
      - open decisions and known risks
      - where things live and who to contact
      - a live walkthrough to answer questions
    rubric:
      excellent: Describes a structured handover covering state, risks, open decisions and contacts, a walkthrough, and evidence the receiver carried on without needing to contact them.
      good: Wrote a reasonable handover and the work continued.
      weak: Handover was informal or verbal only, or the receiver struggled.
    followups:
      - What did the person ask you about afterwards?
      - What would you add next time?
    common_errors:
      - Leaving out the risks and half-made decisions.

  - external_key: behavioral.communication.asking_for_help_in_writing
    topic: Writing a request for help
    difficulty: easy
    text: >-
      Tell me about a time you asked for help in writing, for example in a team channel or a ticket. How did you
      write the request so people could help you quickly?
    expected_concepts:
      - what they were trying to achieve
      - what they had already tried
      - specific details or evidence
      - the exact question being asked
    rubric:
      excellent: Describes a request that stated the goal, what had been tried, relevant evidence and a precise question, and shows it got a fast, useful answer.
      good: Wrote a clear request with context and got help.
      weak: Asked a bare question with no context, or cannot recall how it was written.
    followups:
      - How long did it take to get an answer?
      - What do you include now that you didn't used to?
    common_errors:
      - Asking whether anyone can help without saying with what.

  - external_key: behavioral.communication.feedback_on_your_writing
    topic: Improving from feedback on your communication
    difficulty: easy
    text: >-
      Tell me about a piece of feedback you received on your writing or presentations. What did you change
      because of it?
    expected_concepts:
      - the specific feedback
      - understanding the reason behind it
      - a concrete change in practice
      - evidence the change helped
    rubric:
      excellent: Quotes specific feedback, explains what it revealed, describes a concrete lasting change and gives evidence it improved results.
      good: Describes real feedback and a sensible change.
      weak: Feedback is generic or the change is vague.
    followups:
      - Who gave you that feedback?
      - Is there feedback you received that you chose not to act on?
    common_errors:
      - Choosing feedback that was really praise.

  - external_key: behavioral.communication.outdated_documentation_found
    topic: Finding documentation that was wrong
    difficulty: easy
    text: >-
      Tell me about a time you found documentation that was out of date or wrong. What did you do about it?
    expected_concepts:
      - fixing it or flagging it to the owner
      - checking the correct information first
      - letting people who relied on it know
      - addressing why it went stale
    rubric:
      excellent: Verified the correct information, fixed or got it fixed, told people who might have acted on the wrong version, and helped address why it had drifted.
      good: Fixed or reported the problem promptly.
      weak: Worked around it without fixing or reporting it.
    followups:
      - Had anyone already been misled by it?
      - Who owned that documentation?
    common_errors:
      - Fixing it quietly when others may already have acted on it.

  - external_key: behavioral.communication.describing_work_for_review
    topic: Describing your work for reviewers
    difficulty: easy
    text: >-
      Tell me about a time you had to describe your own work for other people to review, such as a change, a
      report or a proposal. How did you write the description so reviewers could understand it quickly?
    expected_concepts:
      - why the change or work was needed
      - summary of what changed
      - where reviewers should focus
      - how it was tested or checked
      - known limitations
    rubric:
      excellent: Describes a description that explained the purpose, summarised the change, directed reviewer attention and stated testing and limitations, leading to a faster or better review.
      good: Wrote a clear description with purpose and summary.
      weak: Left the work to speak for itself, or the description restated the title.
    followups:
      - What did the reviewers still ask about?
      - How long does it take you to write a description like that?
    common_errors:
      - Describing what changed but not why.

  # ---------------------------------------------------------------- medium
  - external_key: behavioral.communication.conflicting_proposal_comments
    topic: Working through conflicting comments on a proposal
    difficulty: medium
    text: >-
      Tell me about a time you circulated a written proposal and got a lot of conflicting comments. How did you
      work through the feedback and communicate what you changed?
    expected_concepts:
      - grouping comments by theme
      - separating blocking issues from preferences
      - resolving conflicts directly with the people involved
      - recording what changed and what didn't, with reasons
      - closing the loop with reviewers
    rubric:
      excellent: Describes a systematic way of triaging comments, resolving genuine conflicts with the people involved, and a visible record of decisions that reviewers accepted.
      good: Worked through the feedback and explained most changes.
      weak: Accepted every comment or ignored the inconvenient ones without explanation.
    followups:
      - Which comment did you decide not to act on, and how did you tell that reviewer?
      - Did you have to meet anyone in person to resolve it?
    common_errors:
      - Silently resolving comments without explaining the decision.

  - external_key: behavioral.communication.writing_for_skimmers
    topic: Writing for readers who will only skim
    difficulty: medium
    text: >-
      Tell me about something you wrote for busy readers who you knew would only skim it. How did you structure
      it so the key point still came across?
    expected_concepts:
      - conclusion or ask in the first lines
      - headings and short paragraphs
      - bolded decisions or a summary box
      - details moved lower or into links
    rubric:
      excellent: Explains specific structural choices that put the point first and made it scannable, and gives evidence that readers acted on it.
      good: Describes a sensibly structured piece with the key point early.
      weak: Wrote it in the usual narrative order and hoped readers would get there.
    followups:
      - How did you test whether the first paragraph stood on its own?
      - What did readers miss anyway?
    common_errors:
      - Burying the ask at the end.

  - external_key: behavioral.communication.procedure_under_pressure
    topic: Writing a procedure for use under time pressure
    difficulty: medium
    text: >-
      Tell me about a guide or procedure you wrote that someone had to follow under time pressure, for example
      during an outage or right before a deadline. How did you design it for that situation?
    expected_concepts:
      - short, numbered, imperative steps
      - decision points and how to tell which branch applies
      - expected results after each step
      - who to escalate to
      - rehearsing or testing it
    rubric:
      excellent: Explains design choices specific to stressful use, such as clear decision points and checks after each step, and describes testing it or seeing it used successfully.
      good: Describes a clear procedure with some testing.
      weak: Wrote it as a narrative explanation, or never tested it.
    followups:
      - When was it first used for real, and what happened?
      - What did you remove to keep it short?
    common_errors:
      - Long explanations that slow the reader down when time matters.

  - external_key: behavioral.communication.thread_not_converging
    topic: Moving a stuck written discussion forward
    difficulty: medium
    text: >-
      Tell me about a time a long written thread wasn't resolving a disagreement. How did you recognise it, and
      what did you do to move it forward?
    expected_concepts:
      - noticing repetition and growing positions
      - summarising the positions fairly
      - switching to a live conversation
      - naming who decides
      - recording the outcome back in the thread
    rubric:
      excellent: Recognised the thread was stuck, summarised the positions fairly, moved to a conversation with the right people, got a decision and recorded it back where everyone could see it.
      good: Moved the discussion to a call and reached a resolution.
      weak: Kept replying in the thread, or the outcome was never shared.
    followups:
      - How did you summarise the other side's position?
      - What did people who weren't on the call see afterwards?
    common_errors:
      - Resolving it on a call and never updating the written record.

  - external_key: behavioral.communication.meeting_without_decision
    topic: A meeting that ended without a decision
    difficulty: medium
    text: >-
      Tell me about a meeting that went off track or ran out of time without reaching a decision. What did you do
      during it or afterwards to get things resolved?
    expected_concepts:
      - why the meeting went off track
      - steering back to the purpose
      - parking side topics explicitly
      - follow-up to reach the decision
      - changing how the next meeting was set up
    rubric:
      excellent: Diagnoses why the meeting failed, describes what they did in the moment and afterwards, gets the decision made and changes how later meetings were run.
      good: Took reasonable follow-up action and reached a decision.
      weak: Accepted the outcome and waited for someone else to act.
    followups:
      - What was your role in that meeting?
      - What did you change about the next one?
    common_errors:
      - Scheduling another identical meeting.

  - external_key: behavioral.communication.announcing_a_plan_change
    topic: Communicating a change of plan
    difficulty: medium
    text: >-
      Tell me about a time a plan changed after people had already started working to it. How did you
      communicate the change and the reasons for it?
    expected_concepts:
      - telling affected people quickly and directly
      - what changed and why
      - what it means for each person's current work
      - what stays the same
      - answering questions and confirming understanding
    rubric:
      excellent: Communicated promptly, explained the reasons, translated the change into specifics for each affected person and confirmed people had adjusted their work.
      good: Explained the change and reasons clearly to those affected.
      weak: Announced the change without reasons, or people found out indirectly.
    followups:
      - Who heard about it last, and why?
      - How did you handle work that had to be thrown away?
    common_errors:
      - Explaining the new plan without saying what happens to work already done.

  - external_key: behavioral.communication.broad_announcement
    topic: Announcing something to a large group
    difficulty: medium
    text: >-
      Tell me about an announcement or update you wrote for a large group of people you didn't work with day to
      day. How did you make sure they read it and understood what it meant for them?
    expected_concepts:
      - a subject line or opening that signals relevance
      - what changes for the reader and when
      - any action required, stated plainly
      - where to ask questions
      - checking whether it reached people
    rubric:
      excellent: Describes an opening and structure built around what readers had to do, a route for questions, and evidence about whether it reached and was understood by the group.
      good: Wrote a clear announcement with actions and a contact point.
      weak: Sent it out with no thought about whether it would be read or understood.
    followups:
      - What questions came back?
      - Did you have to send a reminder or a correction?
    common_errors:
      - Assuming that sending a message means people read it.

  - external_key: behavioral.communication.capturing_expert_knowledge
    topic: Capturing knowledge only one person had
    difficulty: medium
    text: >-
      Tell me about a time you had to capture knowledge that only lived in someone's head, perhaps an expert or a
      long-standing team member. How did you get it out of them and into a form others could use?
    expected_concepts:
      - structured interviews or shadowing
      - asking for real examples and edge cases
      - writing it up and having the expert review it
      - testing it with someone new
    rubric:
      excellent: Describes a deliberate approach to drawing out knowledge, validation by the expert and a test by a new user, with evidence that the dependency on one person was reduced.
      good: Captured useful knowledge and had it checked.
      weak: Asked the expert to write it themselves and nothing came of it.
    followups:
      - What did the expert take for granted that turned out to be essential?
      - How did you make time with them?
    common_errors:
      - Recording what the expert said without testing whether others could use it.

  - external_key: behavioral.communication.hybrid_discussion
    topic: Discussions with people both remote and in the room
    difficulty: medium
    text: >-
      Tell me about a discussion where some people were in the same room and others joined remotely. What did you
      do to make sure everyone could follow and contribute?
    expected_concepts:
      - shared visible notes or screen
      - explicitly inviting remote input
      - repeating questions from the room
      - written follow-up for everyone
    rubric:
      excellent: Describes specific practices that put remote participants on equal footing and shows a concrete effect, such as a contribution from a remote participant changing the outcome.
      good: Used sensible practices with a real example.
      weak: Did nothing specific, or only noticed the problem afterwards.
    followups:
      - What did the remote participants say about it afterwards?
      - What would you set up differently next time?
    common_errors:
      - Side conversations in the room that remote people can't follow.

  - external_key: behavioral.communication.blameless_write_up
    topic: Writing up what went wrong
    difficulty: medium
    text: >-
      Tell me about a time you wrote up what went wrong after a problem or a failed piece of work. How did you
      write it so it led to improvements rather than blame?
    expected_concepts:
      - clear timeline of facts
      - focus on conditions and decisions, not individuals
      - contributing factors beyond the immediate trigger
      - specific actions with owners
      - sharing it with the people affected
    rubric:
      excellent: Describes a factual, blame-free structure that surfaced contributing factors, led to owned actions and was shared widely, with evidence that the actions were completed.
      good: Wrote a fair, factual write-up with actions.
      weak: The write-up named people as the cause, or had no follow-up actions.
    followups:
      - How did you describe a mistake someone made without blaming them?
      - Which action actually got done?
    common_errors:
      - Ending with "be more careful" as the main action.

  - external_key: behavioral.communication.editing_a_colleagues_document
    topic: Reviewing someone else's writing
    difficulty: medium
    text: >-
      Tell me about a time you reviewed or edited a document someone else wrote. What kind of feedback did you
      give, and how did you make it useful to them?
    expected_concepts:
      - understanding the author's goal and readers first
      - prioritising major issues over wording
      - explaining why, not only what to change
      - suggesting alternatives
    rubric:
      excellent: Describes feedback anchored to the document's purpose, prioritised by importance, explained with reasons and alternatives, and shows the author's next version improved.
      good: Gave useful, specific feedback.
      weak: Gave only line edits, or rewrote it without explanation.
    followups:
      - What was the most important comment you made?
      - How did the author take it, and what did they change?
    common_errors:
      - Burying the one important point among many small edits.

  # ------------------------------------------------------------------ hard
  - external_key: behavioral.communication.written_plan_teams_could_act_on
    topic: Writing a long-term plan for several teams
    difficulty: hard
    text: >-
      Tell me about a long-term plan or strategy you had to put in writing for people across several teams. How
      did you make it concrete enough that teams could act on it?
    expected_concepts:
      - the problem and why it mattered now
      - clear goals and what is explicitly out of scope
      - what it means for each team
      - milestones and how progress would be measured
      - gathering input before finalising
    rubric:
      excellent: Describes a plan with clear goals, explicit non-goals and team-level implications, built with input from those teams, and shows teams made decisions based on it.
      good: Wrote a clear plan with goals and some team-level detail.
      weak: Plan was a list of aspirations with nothing teams could act on.
    followups:
      - What did you explicitly say you would not do?
      - Which team found it least useful, and why?
    common_errors:
      - Goals with no way to tell whether they were met.

  - external_key: behavioral.communication.changing_team_communication_habits
    topic: Improving how a group communicates
    difficulty: hard
    text: >-
      Tell me about a time you changed how a team or group communicates, for example its meetings, updates or
      documentation habits. What was wrong before, and how did you know the change worked?
    expected_concepts:
      - diagnosing the specific problem with evidence
      - involving the group in the change
      - starting small and adjusting
      - measuring the effect
      - keeping the change going
    rubric:
      excellent: Diagnoses a specific problem with evidence, involves the group, describes iteration and gives measurable evidence the change worked and lasted.
      good: Made a sensible change that improved things.
      weak: Imposed a new process with no evidence of the problem or the effect.
    followups:
      - Who resisted, and why?
      - What did you stop doing as part of the change?
    common_errors:
      - Adding more meetings or documents without removing any.

  - external_key: behavioral.communication.deciding_in_writing_across_teams
    topic: Reaching a decision in writing across teams
    difficulty: hard
    text: >-
      Tell me about a decision that needed input from people in several teams or locations who rarely met. How
      did you run the discussion in writing and get to a decision?
    expected_concepts:
      - a clear decision document with options
      - a named decision-maker and a deadline
      - structured requests for input
      - summarising and responding to input
      - announcing and recording the decision
    rubric:
      excellent: Describes a structured written process with options, named decision rights and deadlines, explains how input was synthesised and shows the decision was made on time and accepted.
      good: Ran a reasonable written process and reached a decision.
      weak: The discussion dragged on, or the decision was made elsewhere without the input.
    followups:
      - How did you handle someone who replied after the deadline?
      - How did you make sure quieter teams were heard?
    common_errors:
      - No clear owner of the final decision.

  - external_key: behavioral.communication.disputed_agreement
    topic: When people remember an agreement differently
    difficulty: hard
    text: >-
      Tell me about a time people later disagreed about what had been agreed. How did you resolve it, and what
      did you change in how agreements were recorded?
    expected_concepts:
      - establishing the facts from records available
      - focusing on what to do now rather than who was right
      - agreeing and writing down the current position
      - a lasting change to how decisions are captured
    rubric:
      excellent: Resolved the dispute by focusing on a forward decision rather than blame, recorded it clearly, and introduced a lasting practice that prevented a repeat.
      good: Resolved the dispute and recorded the outcome.
      weak: Argued about who was right, or nothing changed afterwards.
    followups:
      - What did the original record say, if anything?
      - Has the new practice held up?
    common_errors:
      - Spending the effort on proving who remembered correctly.

  - external_key: behavioral.communication.document_that_missed
    topic: A document or proposal that failed
    difficulty: hard
    text: >-
      Tell me about a document or proposal you wrote that didn't achieve what you wanted. Looking back, what was
      wrong with how it was written or shared?
    expected_concepts:
      - what outcome was intended
      - specific problems in structure, audience or timing
      - whether the problem was the content or the communication
      - what they changed in later documents
    rubric:
      excellent: Gives a specific self-critique covering audience, structure or timing, separates weaknesses in the idea from weaknesses in the writing, and shows a later document that did better.
      good: Identifies credible reasons and a lesson.
      weak: Blames readers or circumstances, or offers no real critique.
    followups:
      - Who could you have shown it to earlier?
      - Was the idea itself sound?
    common_errors:
      - Concluding that readers simply didn't read it.
