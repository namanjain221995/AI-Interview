# Behavioural: working under pressure and tight deadlines (part 3 of 4) - breaking down work, good
# enough, testing with little time, phased delivery, known defects and committing a team to a date.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------------------------- easy
  - external_key: behavioral.pressure_deadlines.breaking_down_large_task
    competency_key: ownership
    topic: Breaking down a large task due soon
    difficulty: easy
    text: >-
      Tell me about a large task you had to finish in a short time. How did you break it into pieces, and how
      did that help you get it done?
    expected_concepts:
      - the task and the time available
      - splitting it into small, finishable pieces
      - ordering pieces by dependency or risk
      - finishing pieces fully rather than starting many
      - outcome
    rubric:
      excellent: Describes concrete pieces, why they were ordered that way, how finishing pieces fully kept progress visible, and the outcome against the date.
      good: Gives a real example of breaking down work with a clear result.
      weak: Describes working through the task as one block with no structure.
    followups:
      - Which piece turned out bigger than you thought?
      - How small did you make the pieces, and why?
    common_errors:
      - Starting many pieces at once and finishing few.

  - external_key: behavioral.pressure_deadlines.waiting_on_approval
    competency_key: ownership
    topic: Waiting on an answer or approval near a deadline
    difficulty: easy
    text: >-
      Tell me about a time you were waiting on someone else's answer or approval and the deadline was getting
      close. What did you do to move things along?
    expected_concepts:
      - what was needed and from whom
      - making the request easy to answer
      - following up through the right channel
      - continuing other work in the meantime
      - outcome and what they would do earlier next time
    rubric:
      excellent: Describes making the request clear and easy to act on, timely follow-up, useful work done while waiting, and the outcome with a lesson about asking earlier.
      good: Gives a real example of actively following up and staying productive.
      weak: Waited without following up and accepted the delay.
    followups:
      - How did you make it easy for them to say yes?
      - When would you ask for that approval next time?
    common_errors:
      - Sending repeated reminders without making the request clearer.

  - external_key: behavioral.pressure_deadlines.estimating_own_work
    competency_key: ownership
    topic: Estimating your own work
    difficulty: easy
    text: >-
      When someone needs a date from you for your own piece of work, how do you work out what to tell them?
      Talk me through the last time you did it.
    expected_concepts:
      - understanding the work before estimating
      - breaking it into parts and estimating each
      - allowing for unknowns and interruptions
      - stating the confidence or range
      - how the estimate compared with reality
    rubric:
      excellent: Describes breaking the work down, allowing for unknowns, giving a range or confidence level, and compares the estimate with what actually happened.
      good: Describes a reasonable estimating approach with a real example.
      weak: Gives a number based on gut feeling with no reasoning or follow-up.
    followups:
      - How close was that estimate in the end?
      - What do you usually forget to include?
    common_errors:
      - Estimating only the core work and leaving out testing, review or hand-over.

  - external_key: behavioral.pressure_deadlines.deciding_good_enough
    competency_key: culture_values
    topic: Deciding when work is good enough to hand over
    difficulty: easy
    text: >-
      With a deadline coming, how do you decide that a piece of your work is good enough to hand over? Tell
      me about a time you had to make that call.
    expected_concepts:
      - what the work was for and who would use it
      - criteria tied to the purpose
      - must-have versus could-improve items
      - telling the recipient about known limitations
      - how it was received
    rubric:
      excellent: Ties good enough to the purpose and user, separates must-haves from improvements, states limitations openly, and reports how it was received.
      good: Gives a real example with sensible criteria.
      weak: Handed it over whenever time ran out, or kept polishing past the deadline.
    followups:
      - What did you know was still imperfect?
      - Did the recipient agree with your judgement?
    common_errors:
      - Not telling the recipient what was left unfinished.

  - external_key: behavioral.pressure_deadlines.explaining_what_fits_by_date
    competency_key: communication
    topic: Explaining what will fit by the date
    difficulty: easy
    text: >-
      Tell me about a time you had to explain to someone that only part of what they wanted would be ready by
      their date. How did you help them choose which part?
    expected_concepts:
      - what was requested and what fit in the time
      - presenting the options clearly
      - helping the requester rank by value
      - agreeing what came later and when
      - outcome
    rubric:
      excellent: Lays out what could fit, helps the requester choose based on value, agrees a plan for the rest, and reports the result.
      good: Gives a real example of agreeing a reduced delivery.
      weak: Decided alone what to leave out without involving the requester.
    followups:
      - What did they choose that surprised you?
      - How did you present the options?
    common_errors:
      - Presenting the cut as a fait accompli.

  - external_key: behavioral.pressure_deadlines.protecting_focus_time
    competency_key: ownership
    topic: Protecting time to finish deadline work
    difficulty: easy
    text: >-
      When you're up against a deadline but meetings and messages keep pulling you away, what do you do to
      protect the time you need? Give me a recent example.
    expected_concepts:
      - the interruptions and their effect
      - blocking time or changing availability
      - telling colleagues how to reach them for urgent matters
      - declining or delegating some meetings
      - result for the deadline
    rubric:
      excellent: Describes concrete steps to protect time, how they kept urgent matters reachable, which commitments they declined or delegated, and the effect on the deadline.
      good: Gives a real example with practical steps and a result.
      weak: Accepts interruptions as unavoidable, or disappeared without telling anyone.
    followups:
      - What did you decide was still worth being interrupted for?
      - How did colleagues respond?
    common_errors:
      - Becoming unreachable without telling the team how to get urgent help.

  - external_key: behavioral.pressure_deadlines.notes_during_fast_work
    competency_key: ownership
    topic: Leaving a trail while working fast
    difficulty: easy
    text: >-
      When you're moving fast to meet a deadline, how do you make sure someone else could understand or pick up
      what you've done? Tell me about a time that mattered.
    expected_concepts:
      - the minimum documentation they keep
      - recording decisions and the reasons for them
      - where the notes were kept
      - a moment someone else relied on them
      - how they balanced note-taking with speed
    rubric:
      excellent: Describes the minimum record they keep, including decisions and reasons, and gives a concrete case where someone else relied on it.
      good: Gives a reasonable practice with a real example.
      weak: Leaves documentation until afterwards, or describes none.
    followups:
      - What did you skip documenting, and did it matter?
      - How long did that take you each day?
    common_errors:
      - Planning to document everything after the deadline and never doing it.

  - external_key: behavioral.pressure_deadlines.last_day_blocker
    competency_key: adaptability
    topic: An unexpected blocker on the last day
    difficulty: easy
    text: >-
      Tell me about a time something unexpected blocked you right at the end, like missing access, a broken
      environment or a file that wouldn't work, with the deadline only hours away. What did you do?
    expected_concepts:
      - the blocker and the time left
      - quick diagnosis or workaround
      - asking the right person for help immediately
      - telling those waiting about the risk
      - outcome and prevention next time
    rubric:
      excellent: Describes fast diagnosis, a workaround or the right help, a timely heads-up to those waiting, the outcome, and a step that prevented the same blocker later.
      good: Gives a real example with a practical response and outcome.
      weak: Lost the time trying alone without telling anyone.
    followups:
      - Could you have spotted that blocker earlier?
      - Who did you go to, and why them?
    common_errors:
      - Not checking access and environments well before the final day.

  - external_key: behavioral.pressure_deadlines.why_the_date_matters
    competency_key: communication
    topic: Finding out why a deadline matters
    difficulty: easy
    text: >-
      Tell me about a time you were given a deadline without being told why it was that date. How did you find
      out what was really driving it, and did that change what you did?
    expected_concepts:
      - asking the requester about the reason
      - what the real driver turned out to be
      - whether part of the work could come later
      - adjusting the plan to the real driver
      - outcome
    rubric:
      excellent: Describes how they found the real driver, how it changed the plan or priorities, and the outcome.
      good: Gives a real example of asking about the deadline and acting on the answer.
      weak: Never asked about the reason, or treated every date the same.
    followups:
      - What did knowing the reason change?
      - How do you ask that question without sounding like you're pushing back?
    common_errors:
      - Treating all deadlines as equally fixed.

  # ------------------------------------------------------------------------------- medium
  - external_key: behavioral.pressure_deadlines.testing_with_limited_time
    competency_key: culture_values
    topic: Deciding what to test with little time
    difficulty: medium
    text: >-
      Tell me about a time you had much less time for testing or checking than you would normally want. How
      did you decide what to check, and what did you leave unchecked?
    expected_concepts:
      - the work and the time available for checking
      - ranking areas by impact of failure and likelihood
      - checking the riskiest parts first
      - stating what was not checked
      - outcome after delivery
    rubric:
      excellent: Ranks areas by impact and likelihood of failure, covers the riskiest first, states clearly what was left unchecked and to whom, and reports what happened after delivery.
      good: Gives a real example with a sensible risk-based focus.
      weak: Checked whatever was easiest, or did not mention what was left unchecked.
    followups:
      - Did anything you left unchecked turn out to be a problem?
      - Who did you tell about the gaps?
    common_errors:
      - Spreading limited checking thinly across everything.

  - external_key: behavioral.pressure_deadlines.rework_after_rushed_delivery
    competency_key: ownership
    topic: Rushed work that came back with problems
    difficulty: medium
    text: >-
      Tell me about a time something you delivered in a hurry came back with problems. How did you handle the
      rework alongside whatever you were doing next?
    expected_concepts:
      - the problems and their impact
      - owning the rework rather than deflecting
      - fitting the rework around new commitments
      - telling the people affected about the plan
      - what changed in their approach to rushed work
    rubric:
      excellent: Owns the problems, plans the rework against new commitments with those affected, delivers the fix, and describes a concrete change to how they handle rushed work.
      good: Gives a real example with ownership and a fix.
      weak: Blames the deadline or others, or left the rework to someone else.
    followups:
      - How did the rework affect your next piece of work?
      - What would have caught the problems before delivery?
    common_errors:
      - Treating the rework as unplanned extra rather than reprioritising openly.

  - external_key: behavioral.pressure_deadlines.newcomer_during_deadline
    competency_key: collaboration
    topic: Supporting a newcomer during a deadline
    difficulty: medium
    text: >-
      Tell me about a time a new colleague joined your team in the middle of a deadline push. How did you get
      them contributing without slowing the team down too much?
    expected_concepts:
      - choosing suitable, well-bounded first tasks
      - providing context efficiently
      - a clear point of contact for questions
      - checking their work without micromanaging
      - outcome for the newcomer and the deadline
    rubric:
      excellent: Describes picking well-bounded tasks, efficient ways of giving context, a support arrangement, and shows both the newcomer's contribution and the deadline outcome.
      good: Gives a real example of helping a newcomer contribute under time pressure.
      weak: Left the newcomer to fend for themselves, or gave them nothing useful to do.
    followups:
      - What did you give them first, and why?
      - What would you set up in advance next time?
    common_errors:
      - Giving the newcomer a task tightly coupled to the critical path.

  - external_key: behavioral.pressure_deadlines.restructured_for_parallel_work
    competency_key: problem_solving
    topic: Restructuring work so more could run in parallel
    difficulty: medium
    text: >-
      Tell me about a time you reorganised a piece of work so more of it could happen in parallel and the
      deadline became reachable. What did you change?
    expected_concepts:
      - the original sequence and the bottleneck
      - splitting along clear interfaces or agreements
      - assigning parts to people
      - managing the integration risk
      - effect on the timeline
    rubric:
      excellent: Identifies the bottleneck in the original sequence, explains how the work was split along clear boundaries, how integration risk was handled, and the measured effect on the timeline.
      good: Gives a real example of parallelising work with a result.
      weak: Added people without changing how the work was split.
    followups:
      - Where did the parallel pieces fail to fit together?
      - What did you agree up front between the pieces?
    common_errors:
      - Ignoring the cost of bringing the parallel pieces back together.

  - external_key: behavioral.pressure_deadlines.phased_delivery_to_meet_date
    competency_key: ownership
    topic: Delivering in phases to meet a date
    difficulty: medium
    text: >-
      Tell me about a time you split a delivery into phases, releasing something useful by the date and the rest
      afterwards. How did you decide what went into the first phase?
    expected_concepts:
      - the full scope and the date
      - choosing a first phase that delivered real value
      - making sure the first phase stood on its own
      - plan and commitment for later phases
      - whether later phases were delivered
    rubric:
      excellent: Chooses a first phase with real value that worked on its own, explains the plan for later phases, and shows the later phases were actually delivered.
      good: Gives a real phased delivery with a sensible first phase.
      weak: Released an unusable first phase, or later phases never happened.
    followups:
      - What did users think of the first phase?
      - What pushed back the later phases, if anything?
    common_errors:
      - A first phase that is just the easiest parts rather than the most valuable.

  - external_key: behavioral.pressure_deadlines.commitment_asked_on_the_spot
    competency_key: communication
    topic: Being pressed for a commitment on the spot
    difficulty: medium
    text: >-
      Tell me about a time you were pressed, for example in a meeting, to commit to a date before you'd had a
      chance to look at the work properly. What did you say, and what happened next?
    expected_concepts:
      - the situation and who was asking
      - avoiding a commitment they could not back up
      - offering a range or a time to come back with a firm date
      - following up when promised
      - outcome
    rubric:
      excellent: Avoids an unfounded commitment while still giving something useful, such as a range or a time to confirm, and follows through with a firm date as promised.
      good: Gives a real example where they handled the pressure with a reasonable response.
      weak: Committed on the spot and then missed, or gave no useful answer at all.
    followups:
      - How did the person asking react?
      - How long did you take to come back with a firm date?
    common_errors:
      - Giving a precise date with no basis to end the awkward moment.

  - external_key: behavioral.pressure_deadlines.near_miss_changed_habits
    competency_key: ownership
    topic: A near miss that changed your habits
    difficulty: medium
    text: >-
      Tell me about a deadline you very nearly missed. What did you take away from it, and what do you do
      differently now because of it?
    expected_concepts:
      - what nearly went wrong
      - the underlying cause rather than the symptom
      - a specific change in habits or planning
      - evidence the change has been used since
      - result of the change
    rubric:
      excellent: Identifies the underlying cause of the near miss, describes a specific change in habit or process, and gives evidence it has worked on later deadlines.
      good: Gives a real near miss with a reasonable lesson applied later.
      weak: Lesson is vague, or no evidence it changed anything.
    followups:
      - When did you last use that change?
      - Who else did you share the lesson with?
    common_errors:
      - Describing the near miss without any change afterwards.

  - external_key: behavioral.pressure_deadlines.late_technical_obstacle
    competency_key: problem_solving
    topic: A hard obstacle with little time left
    difficulty: medium
    text: >-
      Tell me about a time you hit an unexpectedly hard problem with only a short time left before something
      was due. How did you approach it?
    expected_concepts:
      - the problem and the time left
      - narrowing the problem quickly
      - looking for a workaround alongside a proper fix
      - involving others with relevant knowledge
      - outcome and follow-up on any workaround
    rubric:
      excellent: Describes narrowing the problem quickly, pursuing a workaround and a proper fix in sensible order, involving the right people, and the outcome including follow-up on the workaround.
      good: Gives a real example with a structured approach and result.
      weak: Tried things at random, or stayed stuck alone until time ran out.
    followups:
      - At what point did you bring someone else in?
      - What happened to the workaround afterwards?
    common_errors:
      - Spending the remaining time on a perfect fix when a safe workaround would do.

  - external_key: behavioral.pressure_deadlines.known_defect_at_deadline
    competency_key: culture_values
    topic: Shipping with a known defect
    difficulty: medium
    text: >-
      Tell me about a time you knew about a defect or gap in your work when the deadline arrived. How did you
      decide whether to deliver it anyway, and what did you tell people?
    expected_concepts:
      - the defect and its impact on users
      - options such as fixing, delaying or mitigating
      - who was involved in the decision
      - transparent communication about the known issue
      - follow-up fix
    rubric:
      excellent: Assesses the defect's impact, weighs options with the right people, communicates the known issue clearly to those affected, and follows through on the fix.
      good: Gives a real example with a reasoned decision and clear communication.
      weak: Shipped without telling anyone, or describes no decision process.
    followups:
      - Who did you tell, and how?
      - How long did the fix take after delivery?
    common_errors:
      - Relying on nobody noticing the known issue.

  - external_key: behavioral.pressure_deadlines.recovering_after_setback
    competency_key: adaptability
    topic: Recovering lost time after a setback
    difficulty: medium
    text: >-
      Tell me about a time a setback, like lost work, a failed approach or a broken tool, cost you days on
      something with a fixed deadline. How did you recover the time?
    expected_concepts:
      - the setback and the time lost
      - re-planning the remaining work
      - finding time through scope, help or a different approach
      - informing stakeholders of the new risk
      - outcome and prevention
    rubric:
      excellent: Quantifies the time lost, describes a concrete re-plan with specific ways of recovering time, informs stakeholders, and reports the outcome and how they prevented a repeat.
      good: Gives a real example of recovering from a setback with a result.
      weak: Describes only the setback, or recovered by simply working longer with no re-plan.
    followups:
      - What did you change so it couldn't happen again?
      - Who did you tell about the setback, and when?
    common_errors:
      - Not telling anyone about the setback until the deadline was missed.

  - external_key: behavioral.pressure_deadlines.borrowing_help_from_another_team
    competency_key: collaboration
    topic: Getting help from outside your team for a deadline
    difficulty: medium
    text: >-
      Tell me about a time meeting a deadline meant asking people outside your team to give you some of their
      time or change their plans. How did you make that request, and what did you offer in return?
    expected_concepts:
      - why outside help was needed
      - a specific, bounded request
      - explaining the value for the wider organisation
      - respecting the other team's commitments
      - outcome and how they followed up afterwards
    rubric:
      excellent: Makes a specific, bounded request, explains the wider value, respects the other team's commitments, and reports the outcome and how they recognised or repaid the help.
      good: Gives a real example of a reasonable request that helped.
      weak: Demanded help or went around the other team's lead.
    followups:
      - How did you thank or repay them?
      - What would you do if they had said no?
    common_errors:
      - Making an open-ended request with no clear end.

  # ------------------------------------------------------------------------------- hard
  - external_key: behavioral.pressure_deadlines.committing_team_to_date
    competency_key: ownership
    topic: Committing a team to a date
    difficulty: hard
    text: >-
      Tell me about a time you committed a team, not just yourself, to a delivery date. How did you make sure
      the date was sound, and how did it play out?
    expected_concepts:
      - involving the people doing the work in the estimate
      - identifying the main risks and unknowns
      - building in contingency
      - getting agreement from the team on the commitment
      - result and lessons
    rubric:
      excellent: Involves the team in estimating, identifies the main risks, builds in contingency, gains real agreement on the date, and reports the outcome with lessons.
      good: Gives a real example with a team-informed commitment and result.
      weak: Set the date alone and then pushed the team to meet it.
    followups:
      - Did the team believe the date when you committed to it?
      - What surprised you most during delivery?
    common_errors:
      - Committing to a date without input from the people doing the work.

  - external_key: behavioral.pressure_deadlines.declining_high_profile_request
    competency_key: ownership
    topic: Turning down a high-profile request to protect commitments
    difficulty: hard
    text: >-
      Tell me about a time you turned down or postponed a high-profile request or opportunity because it would
      have put your existing commitments at risk. How did you make and explain that choice?
    expected_concepts:
      - the request and its visibility or appeal
      - the existing commitments at risk
      - weighing the business value of each
      - involving the right people in the decision
      - outcome for both the commitments and the request
    rubric:
      excellent: Weighs the value of the request against existing commitments with clear reasoning, involves the right people, explains the choice well, and reports outcomes for both.
      good: Gives a real example of declining with good reasoning.
      weak: Took everything on, or declined without explaining or involving anyone.
    followups:
      - What did declining cost you?
      - Would you make the same choice now?
    common_errors:
      - Treating visibility as more important than existing commitments.

  - external_key: behavioral.pressure_deadlines.compliance_deadline_correctness
    competency_key: culture_values
    topic: An audit or compliance deadline where accuracy mattered
    difficulty: hard
    text: >-
      Tell me about a time you had to meet a deadline for something like an audit, a legal requirement or a
      formal report where getting it wrong would have serious consequences. How did you make sure it was both
      on time and correct?
    expected_concepts:
      - the requirement and the consequences of errors
      - planning time specifically for verification
      - independent checks or a second reviewer
      - handling a discovered error close to the deadline
      - outcome
    rubric:
      excellent: Plans dedicated verification time, uses independent checks, describes how a late-found error was handled, and reports a correct and timely outcome.
      good: Gives a real example with deliberate checks and a good outcome.
      weak: Treated accuracy as an afterthought or described no verification.
    followups:
      - What did the independent check find?
      - What would you have done if you couldn't be both on time and correct?
    common_errors:
      - Squeezing verification into whatever time was left at the end.

  - external_key: behavioral.pressure_deadlines.other_team_change_broke_yours
    competency_key: collaboration
    topic: Another team's change breaking your work during a crunch
    difficulty: hard
    text: >-
      Tell me about a time, during a deadline push, another team's change broke something you depended on.
      How did you get it resolved quickly without turning it into a blame exercise?
    expected_concepts:
      - the breakage and its effect on the deadline
      - reaching the right people quickly with clear evidence
      - focusing on the fix before the cause
      - a joint follow-up on preventing it
      - outcome for both teams
    rubric:
      excellent: Contacts the right people quickly with clear evidence, keeps the focus on restoring service, follows up jointly on prevention, and reports the outcome for both teams.
      good: Gives a real example of resolving the breakage constructively.
      weak: Focused on assigning blame, or waited for the other team to notice.
    followups:
      - What did you agree to change afterwards?
      - How did the relationship with that team look after it?
    common_errors:
      - Arguing about fault while the breakage was still open.

  - external_key: behavioral.pressure_deadlines.case_for_paying_down_shortcuts
    competency_key: ownership
    topic: Making the case to pay down accumulated shortcuts
    difficulty: hard
    text: >-
      Tell me about a time shortcuts taken under past deadlines had piled up enough to slow everything down.
      How did you make the case for time to fix them, and what did you achieve?
    expected_concepts:
      - evidence of the cost, such as slower delivery or incidents
      - prioritising which shortcuts to fix first
      - framing the case in business terms
      - securing time and protecting it
      - measured improvement afterwards
    rubric:
      excellent: Quantifies the cost of the accumulated shortcuts, prioritises fixes, frames the case in business terms, secures dedicated time, and shows a measured improvement.
      good: Gives a real example with a reasonable case and some result.
      weak: Complained about the shortcuts without making a case or achieving change.
    followups:
      - Which evidence convinced people most?
      - How did you stop new shortcuts piling up again?
    common_errors:
      - Arguing on code or process purity instead of business impact.
