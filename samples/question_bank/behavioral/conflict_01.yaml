# Behavioural: conflict (part 1 of 4) - disagreements with peers, code review and technical debates.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, reasoning, outcome, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: collaboration
questions:
  # ------------------------------------------------------------ everyday peer disagreements (easy)
  - external_key: behavioral.conflict.review_pushback_received
    topic: Pushback you received in a review
    difficulty: easy
    text: >-
      Tell me about a time someone reviewing your work pushed back hard on something you were sure was right.
      What did you do with their comments, and how did it end?
    expected_concepts:
      - the specific point under dispute
      - trying to understand the reviewer's reasoning before replying
      - explaining their own reasoning with evidence
      - how the disagreement was settled
      - what changed in the work as a result
    rubric:
      excellent: Describes a concrete review dispute, shows they genuinely engaged with the reviewer's reasoning, explains how it was settled on the merits and what they took from it.
      good: Gives a real example and a reasonable resolution, with some explanation of both viewpoints.
      weak: Simply accepted or ignored the feedback without discussion, or the example has no real disagreement in it.
    followups:
      - Looking back, who was closer to right?
      - Did it change how you prepare work for review?
    common_errors:
      - Framing the reviewer as obstructive without explaining their concern.

  - external_key: behavioral.conflict.review_comment_author_rejected
    topic: Feedback you gave that the author rejected
    difficulty: easy
    text: >-
      Think of a time you gave feedback on a colleague's work and they disagreed with it. How did the conversation
      go from there, and what was the final result?
    expected_concepts:
      - what the feedback was and why it mattered
      - distinguishing must-fix issues from preferences
      - listening to the author's counterpoints
      - reaching a decision without dragging it out
      - effect on the working relationship
    rubric:
      excellent: Explains why the feedback mattered, separates real risks from preferences, shows how they engaged with the author's view and reached a clear outcome that kept the relationship intact.
      good: Shows a reasonable back-and-forth that ended in a decision.
      weak: Insisted on their view without engaging, or dropped the point without explaining why.
    followups:
      - How did you decide whether the point was worth holding firm on?
      - What would you do if the same thing came up with that person again?
    common_errors:
      - Treating every review comment as equally important.

  - external_key: behavioral.conflict.tool_choice_clash
    topic: Choosing between two tools or approaches
    difficulty: easy
    text: >-
      Tell me about a time you and a teammate each wanted to use a different tool, library or method for the same
      piece of work. How did the two of you decide which one to go with?
    expected_concepts:
      - the options and what each person valued
      - agreeing on criteria before arguing about the answer
      - trying, comparing or researching the options
      - making the decision and moving on
      - how the choice worked out
    rubric:
      excellent: Describes both options fairly, explains how they agreed on criteria or tested the options, and how a decision was made and accepted, with a reflection on the outcome.
      good: Clear example where the decision was reasoned rather than forced.
      weak: Decision was made by whoever pushed hardest, or the candidate cannot describe the other person's reasoning.
    followups:
      - What would have made you change your preference?
      - How long did the decision take, and was that about right?
    common_errors:
      - Describing only why their own option was better.

  - external_key: behavioral.conflict.requirement_read_differently
    topic: Reading the same requirement differently
    difficulty: easy
    text: >-
      Tell me about a time you and a colleague read the same requirement, ticket or request in two different ways and
      each thought you were right. How did you sort out what was actually wanted?
    expected_concepts:
      - spotting that the disagreement came from the wording
      - going back to the person who wrote or requested it
      - checking against examples or the underlying goal
      - updating the written requirement for everyone
      - outcome for the work
    rubric:
      excellent: Recognised the root of the disagreement was ambiguity, went to the source or the underlying goal to resolve it, and fixed the written requirement so others would not hit the same problem.
      good: Resolved the difference by checking with the requester.
      weak: Built their own interpretation without checking, or kept arguing about the wording.
    followups:
      - Whose reading turned out to be closer?
      - What do you do now to catch ambiguous requirements earlier?
    common_errors:
      - Arguing about interpretation instead of asking the requester.

  - external_key: behavioral.conflict.objecting_in_team_meeting
    competency_key: communication
    topic: Raising an objection in a team meeting
    difficulty: easy
    text: >-
      Describe a time a plan was being agreed in a team meeting and you thought it had a real problem. How did you
      raise your concern, and what happened next?
    expected_concepts:
      - what the concern was and why it mattered
      - timing and framing of the objection
      - offering an alternative or a question rather than only criticism
      - how the group responded
      - outcome for the plan
    rubric:
      excellent: Explains a clear, work-related concern, how they framed it so the group could act on it, and what changed in the plan or why it went ahead anyway.
      good: Raised the concern constructively and can describe the outcome.
      weak: Stayed silent and complained later, or the objection was purely negative with no path forward.
    followups:
      - Did anyone else share your concern?
      - Would you raise it the same way again?
    common_errors:
      - Describing a concern raised only after the plan had failed.

  - external_key: behavioral.conflict.unwanted_task_split
    topic: Disagreeing over how to split shared work
    difficulty: easy
    text: >-
      Describe a time you and a teammate disagreed about how to divide up a piece of shared work, for example who
      would take the tedious or less visible parts. How did you reach a split you both accepted?
    expected_concepts:
      - what each person wanted and why
      - considering skills, learning and fairness
      - proposing a split or rotation openly
      - agreeing and writing down who does what
      - how the split worked in practice
    rubric:
      excellent: Discusses the split openly, weighs skills, learning and fair sharing of less visible work, agrees something explicit and reflects on how it worked.
      good: Reached a reasonable split through discussion.
      weak: Took the preferred parts without discussion, or quietly resented the split without raising it.
    followups:
      - Did you take any of the parts nobody wanted?
      - Would you split it the same way again?
    common_errors:
      - Ignoring fairness in who gets the less visible work.

  - external_key: behavioral.conflict.team_convention_debate
    topic: Settling a debate over team conventions
    difficulty: easy
    text: >-
      Describe a time your team argued about a convention, such as naming, formatting, document structure or how
      tickets should be written. What part did you play in getting it settled?
    expected_concepts:
      - what the debate was about and why it kept coming up
      - separating preference from things that really matter
      - proposing a way to decide, such as a vote, a trial or an owner
      - writing the outcome down or automating it
      - whether the debate stayed settled
    rubric:
      excellent: Shows they recognised a low-stakes preference debate, proposed a quick fair way to decide, and made the outcome stick through documentation or automation.
      good: Helped the team reach a decision on the convention.
      weak: Kept arguing for their preference, or describes the debate without any resolution.
    followups:
      - How much time was the debate costing before it was settled?
      - What did you do when someone ignored the agreed convention?
    common_errors:
      - Treating a preference debate as a matter of principle.

  - external_key: behavioral.conflict.issue_severity_dispute
    topic: Disagreeing about how serious an issue was
    difficulty: easy
    text: >-
      Tell me about a time you and a colleague disagreed about how serious a reported problem was, with one of you
      wanting to drop everything and the other thinking it could wait. How did you settle it?
    expected_concepts:
      - who was affected and how badly
      - checking facts such as how many users or how often
      - agreed severity criteria if they existed
      - deciding who owned the call
      - outcome and whether the call was right
    rubric:
      excellent: Moved the discussion to facts about impact and frequency, used or proposed shared severity criteria, and explains the decision and whether it proved right.
      good: Used some evidence to agree on priority.
      weak: The decision was made on opinion alone, or the candidate cannot explain the other side's reasoning.
    followups:
      - What facts changed the conversation?
      - Did your team have a shared way of judging severity?
    common_errors:
      - Arguing from gut feeling instead of checking impact.

  - external_key: behavioral.conflict.inviting_counterarguments
    topic: Seeking out disagreement on your own idea
    difficulty: easy
    text: >-
      Tell me about a time you deliberately asked people to poke holes in a proposal of yours before it was decided.
      Who did you ask, and what came out of it?
    expected_concepts:
      - why they sought challenge
      - choosing people likely to disagree or with different expertise
      - making it easy for others to object
      - specific changes made from the challenge
      - outcome of the proposal
    rubric:
      excellent: Explains why they sought challenge, who they chose and why, how they made objecting easy, and the specific changes that resulted.
      good: Sought feedback and made at least one real change from it.
      weak: Asked only people who would agree, or describes feedback that changed nothing.
    followups:
      - What was the hardest objection to hear?
      - How do you decide which objections to act on?
    common_errors:
      - Describing a routine approval step as seeking challenge.

  # ------------------------------------------------------------ technical and working debates (medium)
  - external_key: behavioral.conflict.competing_designs
    topic: Two competing proposals for the same problem
    difficulty: medium
    text: >-
      Tell me about a time two people on your team, possibly including you, put forward competing proposals for the
      same problem. How was one chosen, and what did you do to make that choice fair?
    expected_concepts:
      - the competing options and their trade-offs
      - shared criteria for deciding
      - giving both options a fair hearing
      - who made the final call and how it was communicated
      - how the person whose option lost was brought along
    rubric:
      excellent: Describes both proposals fairly, explains the criteria and decision process, and how they made sure the outcome was accepted, including by the side that lost.
      good: Explains a reasonable process and a clear decision.
      weak: Only argues why their own proposal won, or the process was unclear or political.
    followups:
      - How did the person whose proposal wasn't chosen respond?
      - Would the other option have worked too?
    common_errors:
      - Not acknowledging any strengths in the losing option.

  - external_key: behavioral.conflict.evidence_settled_debate
    competency_key: problem_solving
    topic: Using evidence to settle a disagreement
    difficulty: medium
    text: >-
      Describe a disagreement that was going in circles until someone gathered evidence, like a prototype, a
      measurement or a small trial. What evidence was gathered, and how did it change the conversation?
    expected_concepts:
      - recognising the debate was opinion against opinion
      - agreeing in advance what result would settle it
      - designing a cheap, quick test
      - accepting the result even if it went against them
      - time saved compared with continuing to argue
    rubric:
      excellent: Shows they moved the debate from opinion to evidence, agreed beforehand what would settle it, ran a proportionate test and accepted the result whichever way it went.
      good: Used data or a prototype to reach a decision.
      weak: Used data only to support a conclusion already made, or the evidence was never agreed by both sides.
    followups:
      - What would you have done if the result was inconclusive?
      - Did both sides agree on the test beforehand?
    common_errors:
      - Cherry-picking evidence that suits their side.

  - external_key: behavioral.conflict.unspoken_disagreement_surfaced
    competency_key: communication
    topic: Drawing out a disagreement nobody was voicing
    difficulty: medium
    text: >-
      Tell me about a time you sensed a colleague disagreed with a plan but wasn't saying so. What did you notice, and
      what did you do to get their view out in the open?
    expected_concepts:
      - signals that suggested unspoken disagreement in the work
      - creating an easy opportunity to raise it, such as a one-to-one
      - asking open questions rather than leading ones
      - acting on what they said
      - effect on the plan or the working relationship
    rubric:
      excellent: Points to concrete signals in the work, created a low-pressure opportunity, asked open questions and changed something based on what came out.
      good: Followed up with the colleague and heard their view.
      weak: Assumed agreement from silence, or pressured the colleague publicly.
    followups:
      - What was their concern in the end?
      - How do you make it easier for people to disagree with you?
    common_errors:
      - Treating silence in a meeting as agreement.

  - external_key: behavioral.conflict.ship_now_versus_test_more
    topic: Disagreeing about whether work was ready
    difficulty: medium
    text: >-
      Tell me about a time you and a colleague disagreed about whether something was ready to release, with one of you
      wanting to ship and the other wanting more checks. How did you reach a decision?
    expected_concepts:
      - the actual risk and the cost of waiting
      - quantifying or bounding the risk
      - options between ship and wait, such as a limited rollout
      - who owned the decision
      - result after release
    rubric:
      excellent: Weighs the specific risk against the cost of delay, explores middle options such as a staged rollout or added safeguards, and explains the decision and how it turned out.
      good: Discusses the trade-off and reaches a reasoned decision.
      weak: Frames it as quality versus carelessness, or cannot describe the other side's reasoning.
    followups:
      - What would have changed your position?
      - What happened after the release?
    common_errors:
      - Treating it as a binary choice with no middle option.

  - external_key: behavioral.conflict.changing_colleagues_creation
    topic: Proposing to change something a colleague built
    difficulty: medium
    text: >-
      Tell me about a time you wanted to significantly change or replace something a colleague had built and cared
      about, and they disagreed. How did you approach them, and how did it end?
    expected_concepts:
      - understanding why it was built that way
      - involving the original author early
      - making the case on current needs rather than criticism
      - giving them a role in the change
      - outcome and relationship afterwards
    rubric:
      excellent: Learned the original context first, involved the author early, framed the change around current needs without disparaging past work and gave them a meaningful part in the outcome.
      good: Approached the author respectfully and reached an agreement.
      weak: Changed it without involving them, or criticised the original work.
    followups:
      - What did you learn about why it was built the way it was?
      - What part did they play in the change?
    common_errors:
      - Treating past decisions as mistakes without understanding their context.

  - external_key: behavioral.conflict.challenged_by_newer_colleague
    topic: Being challenged by a less experienced colleague
    difficulty: medium
    text: >-
      Tell me about a time someone newer or less experienced than you disagreed with your approach. How did you
      handle it, and what did you take from their view?
    expected_concepts:
      - taking the challenge seriously
      - explaining reasoning rather than relying on experience
      - recognising valid points
      - encouraging them to keep raising concerns
      - the final decision
    rubric:
      excellent: Engaged with the challenge on its merits, explained their reasoning, adopted any valid points and made it clear such challenges were welcome.
      good: Listened and explained, reaching a reasonable decision.
      weak: Dismissed the challenge because of the other person's experience.
    followups:
      - Did you change anything because of what they said?
      - How did they behave in later discussions?
    common_errors:
      - Using experience as the argument instead of reasoning.

  - external_key: behavioral.conflict.recurring_friction_one_colleague
    topic: Repeated disagreements with the same colleague
    difficulty: medium
    text: >-
      Tell me about a colleague you kept ending up in disagreements with, on one thing after another. What did you do
      about the pattern rather than each individual argument?
    expected_concepts:
      - recognising a pattern rather than isolated events
      - looking for the underlying cause, such as different goals or assumptions
      - a direct conversation about how they work together
      - agreements that changed the pattern
      - evidence it improved
    rubric:
      excellent: Identifies the pattern and its root cause, addresses it in a direct conversation about working together, and shows concrete changes and evidence of improvement.
      good: Recognised the pattern and took a step to change it.
      weak: Treats each disagreement separately or blames the colleague's character.
    followups:
      - What did you find was really driving the disagreements?
      - What did you change on your side?
    common_errors:
      - Describing the colleague's character instead of the work issues.

  - external_key: behavioral.conflict.customer_request_split_views
    topic: Disagreeing on how to answer a customer request
    difficulty: medium
    text: >-
      Tell me about a time a colleague wanted to give a customer or internal user exactly what they asked for, and you
      thought it wasn't the right answer to their problem. How did the two of you work it out?
    expected_concepts:
      - understanding the user's underlying need
      - the colleague's reasons, such as relationship or speed
      - gathering more information from the user
      - proposing an option that served the real need
      - outcome for the user and the relationship
    rubric:
      excellent: Focused the disagreement on the user's underlying need, respected the colleague's reasons, gathered evidence from the user and reached an answer that served them well.
      good: Worked through the difference and reached a sensible outcome.
      weak: Overrode the colleague or the user without investigating the need.
    followups:
      - How did you find out what the user really needed?
      - What did the user end up getting?
    common_errors:
      - Assuming they knew the user's needs better without checking.

  - external_key: behavioral.conflict.review_deadlock_blocking
    topic: A review stalemate blocking progress
    difficulty: medium
    text: >-
      Describe a time when a change, document or design was stuck because the author and a reviewer couldn't agree,
      and it went on for days. How did it get unstuck?
    expected_concepts:
      - recognising the cost of the delay
      - narrowing the disagreement to the real point
      - talking live instead of trading comments
      - bringing in a tie-breaker or agreed decision owner
      - preventing similar stalemates
    rubric:
      excellent: Narrowed the dispute to its core, moved it to a live conversation, used a clear tie-break or decision owner when needed and changed something so it would not recur.
      good: Helped get the work moving with a reasonable resolution.
      weak: Waited for it to resolve itself, or forced it through without addressing the concern.
    followups:
      - Was there a clear rule for who decides in such cases?
      - What would you change in the review process?
    common_errors:
      - Merging or publishing over the objection without discussion.

  - external_key: behavioral.conflict.disputed_root_cause
    competency_key: problem_solving
    topic: Disagreeing about the cause of a problem
    difficulty: medium
    text: >-
      Tell me about a time you and a colleague had different theories about what was causing a problem. How did you
      work out who was right without it turning into a contest?
    expected_concepts:
      - stating each hypothesis clearly
      - agreeing on what evidence would distinguish them
      - testing the hypotheses together
      - crediting the right answer whoever held it
      - fixing the actual cause
    rubric:
      excellent: Treats both theories as hypotheses, agrees on tests to distinguish them, works through the evidence together and gives credit to whoever was right.
      good: Used evidence to settle the question collaboratively.
      weak: Pursued only their own theory, or frames the colleague as having been wrong without explaining how it was established.
    followups:
      - How did you decide which theory to test first?
      - What if both had been partly right?
    common_errors:
      - Working in parallel and secretly racing to be proven right.

  - external_key: behavioral.conflict.clash_while_pairing
    topic: Friction while working closely together
    difficulty: medium
    text: >-
      Describe a time you were working side by side with someone, such as pairing or co-writing, and you clashed over
      how to do the work. What did the two of you do about it in the moment?
    expected_concepts:
      - what the clash was about
      - pausing to talk about the approach
      - trying one approach with an agreed checkpoint
      - adjusting roles or how they collaborate
      - quality of the result
    rubric:
      excellent: Explains the clash, how they paused to agree an approach or a trial with a checkpoint, adjusted how they worked together and delivered a good result.
      good: Resolved the clash practically and finished the work.
      weak: One person simply took over, or the work was split to avoid the disagreement without discussion.
    followups:
      - Would you pair with that person again?
      - What ground rules help when you work that closely?
    common_errors:
      - Avoiding the issue by quietly taking over the work.

  # ------------------------------------------------------------ harder peer conflict (hard)
  - external_key: behavioral.conflict.long_running_split
    topic: A long-running dispute that split the team
    difficulty: hard
    text: >-
      Tell me about a disagreement that dragged on for weeks and split your team into camps. What did you do to help
      bring it to a conclusion, and how did the team come back together afterwards?
    expected_concepts:
      - why the disagreement persisted
      - reframing around goals and decision criteria
      - getting a decision made by the right owner
      - helping both camps commit to the outcome
      - repairing working relationships afterwards
    rubric:
      excellent: Diagnoses why the dispute persisted, describes concrete steps to reframe it and get a clear decision, and shows how they helped both sides commit and work together again.
      good: Contributed meaningfully to resolving a long dispute.
      weak: Stayed in one camp throughout, or the dispute ended only because someone gave up.
    followups:
      - Which camp were you in, and how did that affect what you could do?
      - What would have resolved it sooner?
    common_errors:
      - Describing the resolution as one side winning.

  - external_key: behavioral.conflict.opposed_and_proven_wrong
    competency_key: adaptability
    topic: When the decision you opposed turned out right
    difficulty: hard
    text: >-
      Tell me about a time you argued against a decision, it went ahead anyway, and it turned out to be the right
      call. What did you get wrong in your reasoning, and how did that change the way you judge similar decisions?
    expected_concepts:
      - their original argument in detail
      - what actually happened
      - the specific flaw or missing information in their reasoning
      - acknowledging it to the people involved
      - concrete change in how they evaluate decisions
    rubric:
      excellent: Gives a precise account of the flaw in their own reasoning, acknowledged it openly, and names a concrete change in how they now weigh similar decisions.
      good: Admits the decision was right and draws a reasonable lesson.
      weak: Explains why they were still partly right, or the lesson is generic.
    followups:
      - Did you tell the people who made the decision?
      - Has that lesson come up since?
    common_errors:
      - Explaining the outcome as luck rather than examining their own reasoning.

  - external_key: behavioral.conflict.peer_shortcut_risk
    topic: A peer's repeated shortcut you saw as a risk
    difficulty: hard
    text: >-
      Tell me about a time a peer kept taking a shortcut that you believed was building up real risk, they didn't
      think it mattered, and nobody else was stepping in. How did you handle it?
    expected_concepts:
      - evidence of the risk and its likely impact
      - a direct conversation focused on the work, not the person
      - understanding why they took the shortcut, such as time pressure
      - proposing a fix that made the right way easier
      - involving a lead only after direct attempts
    rubric:
      excellent: Builds a concrete, evidence-based case, talks to the peer directly, understands what drove the shortcut and fixes the underlying cause, escalating only when necessary and transparently.
      good: Raised it directly with evidence and reached some improvement.
      weak: Reported the peer without talking to them, or let the risk continue without acting.
    followups:
      - What was driving them to take the shortcut?
      - At what point would you have involved a lead?
    common_errors:
      - Framing the issue as the peer being careless rather than describing the risk.

  - external_key: behavioral.conflict.specialist_from_another_discipline
    topic: Disagreeing with a specialist outside your field
    difficulty: hard
    text: >-
      Tell me about a time you disagreed with a specialist from another discipline, such as legal, finance, security or
      research, about something in their area that affected your work. How did you handle the gap in expertise?
    expected_concepts:
      - understanding the specialist's constraint and reasoning
      - learning enough to discuss it credibly
      - separating hard constraints from their judgement calls
      - finding options that meet their concern
      - outcome and how the relationship continued
    rubric:
      excellent: Took time to understand the specialist's reasoning, separated true constraints from negotiable judgement, proposed options that satisfied the underlying concern and kept a strong working relationship.
      good: Engaged constructively and reached a workable outcome.
      weak: Tried to override or route around the specialist, or accepted everything without understanding it.
    followups:
      - What did you learn about their field?
      - What would you do if they still said no?
    common_errors:
      - Treating the specialist as an obstacle rather than a partner.

  - external_key: behavioral.conflict.reversing_public_stance
    competency_key: adaptability
    topic: Reversing a position you had argued publicly
    difficulty: hard
    text: >-
      Tell me about a time you had argued strongly and publicly for something, then later concluded you were wrong.
      How did you go about reversing your position with the people involved?
    expected_concepts:
      - what changed their mind
      - acting quickly once they realised
      - telling the same audience that heard the original argument
      - helping fix any consequences
      - what they learned about holding positions
    rubric:
      excellent: Describes promptly and openly reversing to the same audience, explaining what changed, helping address the consequences and reflecting on how they hold positions now.
      good: Acknowledged the change and adjusted course.
      weak: Let the position fade quietly without acknowledging it, or cannot give an example.
    followups:
      - How did people react to the reversal?
      - Did it affect how you argue for things now?
    common_errors:
      - Waiting until the evidence was overwhelming before admitting the change.
