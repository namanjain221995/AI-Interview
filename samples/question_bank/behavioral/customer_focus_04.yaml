# Behavioural: customer focus (part 4 of 4) - customer relationships, feedback at scale and building a
# user-focused team.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ working with customers (easy)
  - external_key: behavioral.customer_focus.learning_customer_business
    competency_key: culture_values
    topic: Learning how a customer's business works
    difficulty: easy
    text: >-
      Tell me about a time you made an effort to understand how a customer's own business or job worked so
      you could help them better. What did you learn, and how did you use it?
    expected_concepts:
      - the customer and why deeper understanding mattered
      - how they learned (questions, visits, reading their materials)
      - specific insight about the customer's goals or pressures
      - how the insight changed their recommendation or work
    rubric:
      excellent: Describes a deliberate effort to learn the customer's business, names a specific insight, and shows how it led to a better solution than a purely technical view would have.
      good: Learns something real about the customer's context and applies it.
      weak: Stays within the technical request with no curiosity about the customer's goals.
    followups:
      - What question gave you the most useful answer?
      - How did the customer respond to your interest in their work?
    common_errors:
      - Assuming the customer's business works the same way as their own organisation.

  - external_key: behavioral.customer_focus.explaining_problem_to_customer
    competency_key: communication
    topic: Explaining a technical problem to a customer
    difficulty: easy
    text: >-
      Tell me about a time you had to explain a technical problem or limitation to a customer who wasn't
      technical. How did you make it clear what it meant for them?
    expected_concepts:
      - the problem and the customer's level of knowledge
      - framing in terms of the customer's impact and options
      - avoiding jargon without misleading
      - checking understanding
      - decision or action the customer could then take
    rubric:
      excellent: Frames the problem in terms of what it means for the customer and what they can do, avoids jargon without oversimplifying, and checks the customer understood well enough to decide.
      good: Gives a clear, accurate explanation the customer could follow.
      weak: Explains in technical detail or so vaguely that the customer can't act on it.
    followups:
      - How did you know the explanation had landed?
      - What did you leave out, and why?
    common_errors:
      - Simplifying to the point of misrepresenting the risk.

  - external_key: behavioral.customer_focus.easier_to_report_problems
    competency_key: culture_values
    topic: Making it easier for users to report problems
    difficulty: easy
    text: >-
      Tell me about something you did to make it easier for users to let you know when something wasn't
      working for them. What was getting in the way before, and what did you learn once reports came in?
    expected_concepts:
      - the barrier to reporting before (hidden channel, effort, no response)
      - the change made (in-product reporting, simpler form, captured context)
      - handling the increased volume
      - an issue discovered that would otherwise have been missed
    rubric:
      excellent: Identifies why users weren't reporting, makes reporting easier while capturing useful context, sets up a way to handle the volume, and gives an example of a problem it surfaced.
      good: Makes a real improvement to how users report problems and acts on what comes in.
      weak: Adds a feedback channel nobody monitors or acts on.
    followups:
      - How did you make sure reports didn't just pile up?
      - What context did you capture automatically with each report?
    common_errors:
      - Opening a channel without anyone owning the responses.

  - external_key: behavioral.customer_focus.handover_customer_context
    competency_key: culture_values
    topic: Handing a customer over to a colleague
    difficulty: easy
    text: >-
      Tell me about a time you had to hand a customer or an ongoing customer issue over to a colleague. How did
      you make sure the customer didn't have to start again from scratch?
    expected_concepts:
      - the situation and why the handover happened
      - what context was captured (history, commitments, preferences)
      - introducing the new person to the customer
      - checking the handover worked
    rubric:
      excellent: Captures history, open commitments and context in writing, introduces the colleague directly to the customer, and checks back that nothing was lost.
      good: Provides a reasonable handover with the main context.
      weak: Hands over with a one-line note and leaves the customer to repeat themselves.
    followups:
      - What did you write down for your colleague?
      - Did anything get lost anyway?
    common_errors:
      - Forgetting to pass on promises already made to the customer.

  - external_key: behavioral.customer_focus.users_real_conditions
    competency_key: culture_values
    topic: Designing for the conditions users actually work in
    difficulty: easy
    text: >-
      Tell me about a time you realised users were working in very different conditions than you had assumed,
      for example on a phone, with a poor connection or under heavy time pressure. What did you change?
    expected_concepts:
      - the assumed versus actual conditions
      - how the difference was discovered
      - specific changes made for those conditions
      - how they verified the change in realistic conditions
    rubric:
      excellent: Describes a specific mismatch between assumed and real conditions, makes targeted changes, and verifies them under realistic conditions.
      good: Recognises the real conditions and adapts the work.
      weak: Tests only in ideal conditions and is surprised by user problems.
    followups:
      - How did you reproduce those conditions yourself?
      - What other assumptions did it make you question?
    common_errors:
      - Testing only on fast machines and fast networks.

  - external_key: behavioral.customer_focus.small_promise_kept
    competency_key: ownership
    topic: Following through on a small commitment to a user
    difficulty: easy
    text: >-
      Tell me about a small commitment you made to a user or customer that would have been easy to let slip.
      How did you make sure you followed through?
    expected_concepts:
      - the commitment and why it mattered to the user
      - how they tracked it
      - competing pressures that made it easy to forget
      - delivery and the user's response
    rubric:
      excellent: Describes a concrete way of tracking small commitments, delivers despite competing pressures, and connects it to the user's trust or outcome.
      good: Follows through on the commitment as promised.
      weak: Cannot name a specific example or relies on memory alone.
    followups:
      - How do you keep track of commitments like that in general?
      - What happens when you realise you can't keep one?
    common_errors:
      - Treating small commitments as less important than large ones.

  - external_key: behavioral.customer_focus.customer_acceptance_review
    competency_key: culture_values
    topic: A customer reviewing your work before sign-off
    difficulty: easy
    text: >-
      Tell me about a time a customer or user reviewed your work before it was accepted and found things they
      weren't happy with. How did you respond to their feedback?
    expected_concepts:
      - what was reviewed and what the customer raised
      - separating misunderstood requirements from defects
      - agreeing what to change and what not to
      - delivery of the changes
      - improving how requirements were agreed next time
    rubric:
      excellent: Treats the feedback seriously, separates requirement gaps from defects, agrees a clear set of changes with the customer and improves the process to catch gaps earlier.
      good: Responds constructively and makes agreed changes.
      weak: Argues that the work met the specification without considering the customer's need.
    followups:
      - Which of their points did you push back on?
      - What would have caught the gaps earlier?
    common_errors:
      - Hiding behind the written specification.

  - external_key: behavioral.customer_focus.same_question_repeatedly
    competency_key: culture_values
    topic: Users asking the same question again and again
    difficulty: easy
    text: >-
      Tell me about a time you noticed users kept asking the same question or making the same mistake. What
      did you do about the underlying cause?
    expected_concepts:
      - the repeated question or mistake
      - how the pattern was spotted
      - root cause in product, documentation or process
      - change made
      - drop in repeats
    rubric:
      excellent: Spots the pattern, traces it to a cause in the product or process, fixes the cause rather than answering faster, and shows the repeats dropped.
      good: Recognises the pattern and makes a useful change.
      weak: Keeps answering the question individually without addressing the cause.
    followups:
      - Why do you think the question kept coming up?
      - How did you measure that it stopped?
    common_errors:
      - Writing a canned answer instead of fixing the cause.

  # ------------------------------------------------------------ feedback and relationships at scale (medium)
  - external_key: behavioral.customer_focus.request_backlog_fairness
    competency_key: product_sense
    topic: Managing a large backlog of user requests
    difficulty: medium
    text: >-
      Tell me about a time you were responsible for a long list of requests from users, far more than you
      could ever deliver. How did you decide what to work on, and how did you handle the requests you
      wouldn't get to?
    expected_concepts:
      - the volume and sources of requests
      - grouping requests into underlying problems
      - prioritisation criteria
      - communicating decisions back to requesters
      - closing or pruning stale requests
    rubric:
      excellent: Groups requests into underlying problems, prioritises with explicit criteria, tells requesters clearly what will and won't happen, and keeps the backlog accurate by closing stale items.
      good: Uses a reasonable prioritisation approach and some communication back.
      weak: Works on whatever is newest or loudest and leaves requests open indefinitely.
    followups:
      - How did requesters react to hearing no?
      - What criteria did you use, and who agreed them?
    common_errors:
      - Keeping every request open to avoid saying no.

  - external_key: behavioral.customer_focus.survey_score_investigation
    competency_key: product_sense
    topic: Digging into a satisfaction score
    difficulty: medium
    text: >-
      Tell me about a time a customer satisfaction score, survey result or rating changed and you had to work
      out why. How did you get from the number to something you could act on?
    expected_concepts:
      - the score and the change observed
      - segmenting responses and reading comments
      - checking for sampling or measurement changes
      - identifying the driver
      - action taken and later movement in the score
    rubric:
      excellent: Breaks the score down by segment and comments, rules out measurement artefacts, identifies a specific driver and shows an action that moved the score.
      good: Investigates beyond the headline number and finds an actionable cause.
      weak: Reacts to the headline number without understanding what drove it.
    followups:
      - Could the change have been caused by who answered the survey?
      - What did the written comments tell you that the score didn't?
    common_errors:
      - Treating a single score as a complete picture of user experience.

  - external_key: behavioral.customer_focus.agreeing_service_levels
    competency_key: culture_values
    topic: Agreeing what customers could rely on
    difficulty: medium
    text: >-
      Tell me about a time you helped define what customers could rely on from a service, such as response
      times, availability or support hours. How did you balance what customers wanted with what the team could
      sustain?
    expected_concepts:
      - what customers needed and why
      - current capability measured
      - cost of higher commitments
      - agreed level and how it was published
      - tracking and reporting against it
    rubric:
      excellent: Bases the commitment on real customer needs and measured capability, makes the cost of higher levels explicit, and puts tracking and reporting in place.
      good: Helps set a realistic commitment informed by customer needs.
      weak: Picks a number without customer input or evidence of capability.
    followups:
      - What happened the first time you missed it?
      - Which customers wanted more than you offered?
    common_errors:
      - Committing to a level the team has never measured.

  - external_key: behavioral.customer_focus.large_customer_adoption
    competency_key: culture_values
    topic: Helping a new customer get real value
    difficulty: medium
    text: >-
      Tell me about a time you helped a new customer or user group start using something successfully, not
      just get it switched on. What got in their way, and what did you do?
    expected_concepts:
      - the customer's goal for adoption
      - obstacles found (training, data, integration, habits)
      - actions taken to remove them
      - measure of real adoption or value
      - lessons for future onboarding
    rubric:
      excellent: Defines what success means for the customer, removes specific obstacles to real use, measures adoption or value and turns the lessons into better onboarding for others.
      good: Helps the customer past real obstacles to successful use.
      weak: Treats setup as the end of the job.
    followups:
      - How did you know they were getting value, not just logging in?
      - What did you change for the next customer?
    common_errors:
      - Measuring success by activation rather than by the customer's outcome.

  - external_key: behavioral.customer_focus.short_term_win_long_term_value
    competency_key: product_sense
    topic: A quick customer win versus lasting value
    difficulty: medium
    text: >-
      Tell me about a time you could have given a customer a quick win that would have caused problems for
      them later. What did you do, and how did you explain it to them?
    expected_concepts:
      - the quick win and its future cost to the customer
      - how the long-term risk was assessed
      - option chosen
      - explanation to the customer in their terms
      - outcome over time
    rubric:
      excellent: Identifies the hidden future cost to the customer, chooses or proposes the option that serves them better over time, and explains the trade-off so the customer can decide.
      good: Weighs short and long term for the customer and explains the choice.
      weak: Takes the quick win without considering the consequences, or refuses it without explanation.
    followups:
      - Did the customer agree with your recommendation?
      - What would you have done if they insisted on the quick option?
    common_errors:
      - Making the long-term call for the customer without involving them.

  - external_key: behavioral.customer_focus.confusing_billing_or_account
    competency_key: culture_values
    topic: Confusion around billing or account settings
    difficulty: medium
    text: >-
      Tell me about a time users were confused or caught out by something about their account, plan or
      charges. How did you find out, and what did you change?
    expected_concepts:
      - the confusion and its effect on users
      - how it surfaced (tickets, refunds, cancellations)
      - root cause in wording, defaults or flow
      - fix and how affected users were treated
      - measured reduction
    rubric:
      excellent: Traces the confusion to a specific cause, fixes it, treats already affected users fairly and shows a measurable reduction in surprises.
      good: Fixes a real source of account or billing confusion.
      weak: Treats the confusion as users not reading carefully.
    followups:
      - What did you do for users who had already been caught out?
      - Who else needed to agree to the change?
    common_errors:
      - Blaming users for not reading the terms.

  - external_key: behavioral.customer_focus.communicating_plan_change
    competency_key: communication
    topic: Telling customers they'd get less than before
    difficulty: medium
    text: >-
      Tell me about a time you had to tell customers that something they had would be reduced, changed or
      start costing more. How did you plan that communication, and how did it land?
    expected_concepts:
      - the change and the reason for it
      - which customers were affected and how much
      - notice period and channel
      - clear explanation of what changes and what customers can do
      - handling responses and edge cases
    rubric:
      excellent: Segments affected customers, gives adequate notice with a clear reason and practical options, prepares for responses, and reviews how the message landed.
      good: Communicates the change clearly with reasonable notice.
      weak: Buries the change or announces it without reason or options.
    followups:
      - What questions came back that you hadn't anticipated?
      - What would you change about the message now?
    common_errors:
      - Hiding the actual change in vague language.

  - external_key: behavioral.customer_focus.customer_wants_risky_setup
    competency_key: culture_values
    topic: A customer asking for something risky for themselves
    difficulty: medium
    text: >-
      Tell me about a time a customer insisted on a setup or choice that you believed would hurt them, for
      example weaker security or skipping backups. How did you handle it?
    expected_concepts:
      - the request and the risk to the customer
      - understanding why they wanted it
      - explaining the risk in their terms
      - alternatives offered
      - final decision and how it was recorded
    rubric:
      excellent: Understands the customer's reason, explains the concrete risk in their terms, offers safer alternatives, and respects their informed decision while documenting it appropriately.
      good: Explains the risk and tries to find a safer option.
      weak: Either does it without comment or refuses without understanding their reasons.
    followups:
      - Where did you draw the line between advising and refusing?
      - How did you record the decision?
    common_errors:
      - Not documenting the customer's informed decision.

  - external_key: behavioral.customer_focus.staying_close_to_users
    competency_key: culture_values
    topic: Staying close to users in a role that isn't customer-facing
    difficulty: medium
    text: >-
      In a role where you weren't talking to customers every day, what have you done to stay in touch with how
      they experience your work? Give me a concrete example of something it led you to change.
    expected_concepts:
      - specific habits or channels used
      - how regularly they used them
      - an insight gained
      - a resulting change in their work
    rubric:
      excellent: Describes specific, regular habits for staying close to users and a clear example where an insight led to a concrete change.
      good: Has a real practice for hearing from users with at least one result.
      weak: Relies entirely on others to pass on user needs, with no example.
    followups:
      - How do you make time for it?
      - What signal do you find most useful?
    common_errors:
      - Listing channels without any example of acting on them.

  - external_key: behavioral.customer_focus.users_quietly_leaving
    competency_key: product_sense
    topic: Users leaving without complaining
    difficulty: medium
    text: >-
      Tell me about a time you discovered users were quietly giving up on something, stopping use or leaving,
      without telling you why. How did you find out what was going on?
    expected_concepts:
      - signal that revealed the drop-off
      - methods to learn why (exit surveys, interviews, funnel analysis)
      - cause identified
      - action taken and its effect on retention
    rubric:
      excellent: Detects the drop-off from data, actively reaches out or analyses behaviour to learn why, identifies a specific cause and shows that addressing it improved retention.
      good: Investigates the drop-off and finds a plausible cause to act on.
      weak: Notices the drop but speculates without investigating.
    followups:
      - How did you reach users who had already left?
      - What did you learn that you couldn't have seen in the data?
    common_errors:
      - Assuming the reason without asking any of the users who left.

  - external_key: behavioral.customer_focus.only_indirect_user_access
    competency_key: culture_values
    topic: Understanding users you couldn't talk to directly
    difficulty: medium
    text: >-
      Tell me about a time you needed to understand users you couldn't reach directly, so everything came
      through someone else such as a product manager, account manager or partner. How did you make sure you
      really understood their needs?
    expected_concepts:
      - why direct access wasn't possible
      - questions asked of the intermediary
      - other evidence used (logs, recordings, artefacts)
      - checking understanding back through the intermediary
      - result
    rubric:
      excellent: Works with the intermediary deliberately, supplements with direct evidence such as usage data or recordings, validates understanding before building, and shows it led to a better result.
      good: Takes steps beyond simply accepting second-hand requirements.
      weak: Accepts the intermediary's summary without question.
    followups:
      - What did you lose by not hearing from users directly?
      - Did you ever get direct access, and what changed?
    common_errors:
      - Assuming second-hand requirements are complete.

  - external_key: behavioral.customer_focus.feedback_flood_after_launch
    competency_key: culture_values
    topic: A flood of feedback after a launch
    difficulty: medium
    text: >-
      Tell me about a launch that brought in a large amount of user feedback very quickly. How did you sort
      through it and decide what to act on first?
    expected_concepts:
      - volume and channels of feedback
      - method to categorise and count themes
      - distinguishing severe issues from preferences
      - quick responses and communication to users
      - what was acted on first and why
    rubric:
      excellent: Uses a systematic way to group and size the feedback, separates severe problems from preferences, acts quickly on the most harmful issues and tells users what is being done.
      good: Organises the feedback sensibly and acts on the most important themes.
      weak: Reacts to individual comments as they arrive without any structure.
    followups:
      - How did you avoid overreacting to the loudest feedback?
      - What did you tell users who gave feedback you didn't act on?
    common_errors:
      - Weighting feedback by how strongly it was worded.

  # ------------------------------------------------------------ building a user-focused team (hard)
  - external_key: behavioral.customer_focus.building_team_customer_focus
    competency_key: leadership
    topic: Making a team more user-focused
    difficulty: hard
    text: >-
      Tell me about a time you helped a team that mostly thought about technical work start making decisions
      with users in mind. What did you change, and how could you tell it stuck?
    expected_concepts:
      - starting state and its consequences
      - specific practices or rituals introduced
      - how they brought sceptics along
      - user-focused criteria in planning or reviews
      - evidence of lasting change in decisions
    rubric:
      excellent: Introduces concrete practices tied to the team's existing workflow, brings sceptics along with evidence, and shows lasting change through decisions the team made on its own.
      good: Makes real changes that improved the team's attention to users.
      weak: Relies on exhortation or a single event with no lasting change.
    followups:
      - Who resisted, and how did you handle it?
      - What did the team do differently six months later?
    common_errors:
      - Equating more user talk with better user decisions.

  - external_key: behavioral.customer_focus.responsiveness_vs_team_sustainability
    competency_key: leadership
    topic: Customer responsiveness versus a sustainable workload
    difficulty: hard
    text: >-
      Tell me about a time keeping customers well served was putting an unsustainable load on your team, for
      example through constant escalations or out-of-hours work. How did you change things without letting
      customers down?
    expected_concepts:
      - the source and size of the load
      - analysis of which demands were truly urgent
      - structural fixes (triage rules, self-service, root-cause work, rotations)
      - expectation-setting with customers and stakeholders
      - effect on both customers and team workload
    rubric:
      excellent: Quantifies the load, separates genuine urgency from habit, makes structural changes that reduce demand at the source, resets expectations openly and shows both workload and customer outcomes held up.
      good: Makes meaningful changes that reduce the load while keeping customers served.
      weak: Either accepts the load indefinitely or cuts responsiveness without considering customers.
    followups:
      - Which customers noticed the change, and how did you handle them?
      - What reduced the load the most?
    common_errors:
      - Solving the load by adding people without addressing why demand was high.

  - external_key: behavioral.customer_focus.betting_on_customer_insight
    competency_key: product_sense
    topic: Committing to a direction based on customer insight
    difficulty: hard
    text: >-
      Tell me about a time you or your team made a significant commitment based on what you had learned from
      customers, when the evidence wasn't conclusive. How did you decide it was enough, and how did it turn
      out?
    expected_concepts:
      - the insight and its sources
      - remaining uncertainty and how it was weighed
      - ways to reduce risk (staged investment, early checkpoints)
      - getting support from decision-makers
      - outcome and what they learned about judging evidence
    rubric:
      excellent: Explains the evidence and its gaps candidly, structures the commitment to limit risk with checkpoints, and reflects clearly on the outcome and on how they judge customer evidence now.
      good: Makes a reasoned bet with some attention to risk and outcome.
      weak: Presents a gut decision as customer-led, or cannot describe the outcome.
    followups:
      - What would have made you stop?
      - What evidence would you want next time?
    common_errors:
      - Treating a few keen early customers as proof of broad demand.

  - external_key: behavioral.customer_focus.buyer_vs_end_user
    competency_key: culture_values
    topic: The person paying wanted something different from daily users
    difficulty: hard
    text: >-
      Tell me about a time the person who bought or approved your product wanted something different from the
      people who used it every day. How did you serve both, and what did you do when you couldn't?
    expected_concepts:
      - the buyer's goals and the end users' needs
      - where they conflicted
      - evidence gathered from both groups
      - solution design or negotiation
      - outcome for adoption and the commercial relationship
    rubric:
      excellent: Understands both groups' goals with evidence, designs or negotiates a solution that respects both, and when forced to choose explains the trade-off openly and shows the result on adoption and the relationship.
      good: Recognises the conflict and finds a workable balance.
      weak: Serves only the buyer without regard for daily users, or the reverse, without recognising the conflict.
    followups:
      - How did you get access to the daily users?
      - What did the buyer think of your approach?
    common_errors:
      - Assuming the buyer speaks for the people who use the product.

  - external_key: behavioral.customer_focus.listening_too_closely
    competency_key: product_sense
    topic: When following customer requests led you astray
    difficulty: hard
    text: >-
      Tell me about a time you followed what customers asked for so closely that it ended up hurting the
      product or the users overall. How did you realise it, and what did you change in how you weigh customer
      input?
    expected_concepts:
      - the requests followed and why
      - the negative effect (complexity, incoherence, neglected users)
      - how it was recognised
      - corrective action
      - changed approach to weighing customer input
    rubric:
      excellent: Describes concretely how following requests degraded the product, explains how they recognised it, the corrective action taken and a clear change in how they balance customer input with product direction.
      good: Recognises the problem and describes a sensible lesson.
      weak: Cannot identify any downside of following customer requests, or concludes customers should be ignored.
    followups:
      - Which users were neglected while you followed those requests?
      - How do you decide now when to say no?
    common_errors:
      - Swinging to ignoring customer input entirely.
