# Behavioural questions: ownership (accountability, follow-through, owning mistakes, responsible
# initiative beyond the assigned scope). Questions ask for real past examples; evaluation is based
# only on the content of the example (actions, results, reflection), never on delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  - external_key: behavioral.ownership.early_ownership_new_team
    competency_key: ownership
    topic: Taking responsibility early in a new team
    difficulty: easy
    text: >-
      Think about a time you joined a new team or project. What did you take responsibility for early on, and
      how did you decide what to pick up?
    expected_concepts:
      - understanding the team's priorities first
      - choosing something useful and achievable
      - delivering it fully
      - what it taught them about the team
    rubric:
      excellent: Explains how they learned what mattered to the team, picks something useful they could finish, delivers it completely and uses it to build context.
      good: Picks up a sensible piece of work and completes it.
      weak: Waited to be assigned work and describes no responsibility taken.
    followups:
      - What did you deliberately not take on at first?
    common_errors:
      - Taking on something large before understanding the context.

  - external_key: behavioral.ownership.checks_before_handing_over
    competency_key: ownership
    topic: Checking your own work before handing it over
    difficulty: easy
    text: >-
      Before you hand over an important piece of work, what do you do to check it yourself? Tell me about a
      time those checks caught something.
    expected_concepts:
      - specific checks they apply
      - how the checks fit the type of work
      - the problem caught
      - what would have happened otherwise
    rubric:
      excellent: Describes specific checks suited to the work and a real case where they caught a problem, explaining what it would have cost if missed.
      good: Describes sensible checks with an example.
      weak: Relies on others to find problems.
    followups:
      - Which of your checks do you skip when you're short on time?
    common_errors:
      - Assuming review by others replaces their own checks.

  - external_key: behavioral.ownership.chased_unanswered_request
    competency_key: ownership
    topic: Getting what you need from someone unresponsive
    difficulty: easy
    text: >-
      Tell me about a time you needed something from someone to finish your work and they weren't responding.
      What did you do?
    expected_concepts:
      - what was needed and by when
      - follow-up through different channels
      - making the request easy to act on
      - alternatives or escalation
      - result
    rubric:
      excellent: Follows up persistently and politely, makes the request specific and easy to answer, looks for alternatives and keeps their own deadline in view.
      good: Follows up and eventually gets what they needed.
      weak: Sends one message and waits, then cites the delay as the reason they were late.
    followups:
      - At what point would you have looked for another route?
    common_errors:
      - Treating the lack of response as the end of their responsibility.

  - external_key: behavioral.ownership.owned_unfamiliar_task
    competency_key: ownership
    topic: Taking on something you didn't yet know how to do
    difficulty: easy
    text: >-
      Tell me about a time you were asked to take responsibility for something you didn't yet know how to do.
      How did you handle that, and how did you get up to speed?
    expected_concepts:
      - being clear about what they did not know
      - plan for learning
      - using available help
      - delivering the result
    rubric:
      excellent: States openly what they did not know, makes a concrete plan to learn, uses the right help and delivers the result with appropriate checks.
      good: Learns what was needed and delivers.
      weak: Hides the gap and delivers poorly, or hands the task back.
    followups:
      - Who did you tell that this was new to you?
    common_errors:
      - Pretending to know and hoping it works out.

  - external_key: behavioral.ownership.fixed_daily_annoyance
    competency_key: ownership
    topic: Fixing a recurring annoyance instead of working around it
    difficulty: easy
    text: >-
      Tell me about a small, recurring annoyance in your day-to-day work that you decided to fix rather than
      keep working around. What did you do?
    expected_concepts:
      - the annoyance and its cost over time
      - decision to fix it
      - the fix
      - who else benefited
    rubric:
      excellent: Estimates the accumulated cost, fixes it in a way others can benefit from and shares it with the team.
      good: Fixes the annoyance for themselves with a clear reason.
      weak: Cannot name a concrete fix.
    followups:
      - Why had nobody fixed it before?
    common_errors:
      - Describing a complaint rather than a fix.

  - external_key: behavioral.ownership.self_set_goal
    competency_key: ownership
    topic: Holding yourself to a goal nobody set for you
    difficulty: easy
    text: >-
      Tell me about a goal you set for yourself at work that nobody had asked you to set. How did you hold
      yourself to it?
    expected_concepts:
      - the goal and why it mattered to the work
      - how they measured progress
      - keeping it going alongside other work
      - result
    rubric:
      excellent: Sets a specific, work-related goal, tracks progress in a concrete way and reaches it or reports clearly what they learned when they did not.
      good: Sets and pursues a sensible goal with a result.
      weak: The goal is vague or was dropped without reflection.
    followups:
      - What did you do when it started to slip?
    common_errors:
      - Describing a goal set by their manager.

  - external_key: behavioral.ownership.deadline_missed_in_my_control
    competency_key: ownership
    topic: Reflecting on a missed deadline
    difficulty: easy
    text: >-
      Tell me about a deadline you missed. Looking back, what was within your control, and what did you do
      afterwards?
    expected_concepts:
      - the deadline and its impact
      - separating what was and wasn't in their control
      - actions after the miss
      - change in planning or communication
    rubric:
      excellent: Separates their own part from external factors without excuses, limits the impact after the miss and names a specific change in how they plan or communicate.
      good: Acknowledges their part and describes a lesson.
      weak: Attributes the miss entirely to others.
    followups:
      - When did you first suspect you would miss it?
    common_errors:
      - Claiming never to have missed a deadline.

  - external_key: behavioral.ownership.closed_out_finished_project
    competency_key: ownership
    topic: Closing work out properly
    difficulty: easy
    text: >-
      When a project or task wraps up, what do you do to close it out properly? Tell me about one you closed
      out recently.
    expected_concepts:
      - confirming the outcome with stakeholders
      - tidying up loose ends and temporary arrangements
      - recording what was done and why
      - passing on remaining follow-ups
    rubric:
      excellent: Describes confirming the outcome, removing temporary arrangements, recording decisions and handing any remaining follow-ups to a named owner.
      good: Describes several sensible close-out steps.
      weak: Moves on as soon as the main work is delivered.
    followups:
      - What loose ends have you seen cause trouble later?
    common_errors:
      - Listing steps they did not actually take.

  - external_key: behavioral.ownership.went_past_literal_request
    competency_key: ownership
    topic: Delivering what was really needed
    difficulty: easy
    text: >-
      Tell me about a time you went a step further than the literal request because you could see what the
      person really needed. How did you make sure the extra step was actually wanted?
    expected_concepts:
      - the request and the underlying need
      - checking with the person before going further
      - the extra step taken
      - outcome for the person
    rubric:
      excellent: Spots the underlying need, confirms with the person before investing extra effort and delivers both the request and the agreed extra.
      good: Delivers something more useful than asked with a clear reason.
      weak: Delivers something different from what was asked without checking.
    followups:
      - Have you ever gone further and found it wasn't wanted?
    common_errors:
      - Replacing the request with their own idea.

  - external_key: behavioral.ownership.clarified_who_owns_what
    competency_key: ownership
    topic: Making ownership clear on a team
    difficulty: medium
    text: >-
      Tell me about a time you helped make ownership clearer on a team, for example who decides, who does the
      work or who gets called when something breaks. What prompted it, and what changed?
    expected_concepts:
      - the confusion and the problems it caused
      - how they proposed clearer ownership
      - getting agreement from the people involved
      - how it was recorded
      - effect afterwards
    rubric:
      excellent: Links the confusion to concrete problems, gets the people involved to agree explicit ownership, records it somewhere people use and shows the problems reduced.
      good: Clarifies ownership with agreement and some effect.
      weak: Assigns ownership informally without agreement or record.
    followups:
      - How do you keep it up to date when people move?
    common_errors:
      - Declaring ownership for others without their agreement.

  - external_key: behavioral.ownership.limited_budget_overrun
    competency_key: ownership
    topic: Owning a limited budget of money, time or resources
    difficulty: medium
    text: >-
      Tell me about a time you were responsible for spending a limited budget of money, time or resources. How
      did you keep track of it, and what did you do when it started to run over?
    expected_concepts:
      - the budget and what it covered
      - tracking spend against plan
      - early detection of overrun
      - options and decisions taken
      - communicating with whoever owned the budget
    rubric:
      excellent: Tracks spending against plan, spots the overrun early, presents options and makes trade-offs that keep the outcome within an agreed limit.
      good: Tracks spending and responds to the overrun sensibly.
      weak: Discovers the overrun at the end.
    followups:
      - What did you cut or change?
    common_errors:
      - Describing a budget someone else managed.

  - external_key: behavioral.ownership.go_to_owner_not_bottleneck
    competency_key: ownership
    topic: Being the go-to owner without becoming a bottleneck
    difficulty: medium
    text: >-
      Tell me about a tool, process or system that you became the go-to person for. How did you look after it,
      and how did you avoid becoming a bottleneck?
    expected_concepts:
      - what they owned and who relied on it
      - routine care and improvements
      - signs they were becoming a bottleneck
      - enabling others to self-serve or share the load
    rubric:
      excellent: Describes proactive care of the thing they owned, notices when they had become a bottleneck and takes concrete steps so others could handle routine needs.
      good: Looks after it well and shares some knowledge.
      weak: Every request still depends on them.
    followups:
      - What happened when you were unavailable?
    common_errors:
      - Treating being indispensable as a success.

  - external_key: behavioral.ownership.two_commitments_collided
    competency_key: ownership
    topic: Handling two commitments that collided
    difficulty: medium
    text: >-
      Tell me about a time two people you had made commitments to both needed you at the same time. How did you
      decide what to do, and how did you handle the one who had to wait?
    expected_concepts:
      - the two commitments and their urgency
      - criteria for prioritising
      - involving whoever sets priorities if needed
      - communicating with the person who waited
      - outcome for both
    rubric:
      excellent: Uses clear criteria such as impact and deadlines, involves the right person when it is not their call, gives the waiting person a reason and a time, and delivers both.
      good: Prioritises sensibly and communicates with both.
      weak: Picks one without telling the other.
    followups:
      - What could you have done earlier to avoid the clash?
    common_errors:
      - Prioritising whoever pushed hardest.

  - external_key: behavioral.ownership.handed_over_work_came_back
    competency_key: ownership
    topic: Responding when handed-over work comes back with problems
    difficulty: medium
    text: >-
      Tell me about a time something you had already handed over came back with problems. How did you respond,
      given it was technically no longer yours?
    expected_concepts:
      - the problem found after handover
      - their response to the new owner
      - help with the fix
      - lesson for future handovers
    rubric:
      excellent: Helps the new owner promptly, takes responsibility for what their work caused, supports the fix and improves how they hand over in future.
      good: Helps fix the problem when asked.
      weak: Points out it is no longer their responsibility.
    followups:
      - What was missing from the handover?
    common_errors:
      - Treating the problem as the new owner's fault.

  - external_key: behavioral.ownership.decided_what_to_cut
    competency_key: ownership
    topic: Owning a scope cut to meet a deadline
    difficulty: medium
    text: >-
      Tell me about a time you realised you couldn't deliver everything in scope by the deadline. How did you
      decide what to cut, and how did you get agreement on it?
    expected_concepts:
      - when and how they realised
      - criteria for what to keep
      - proposal to stakeholders
      - agreement and delivery
      - plan for what was cut
    rubric:
      excellent: Spots the problem early, proposes a cut based on value to users, gets explicit agreement and delivers the reduced scope with a plan for the rest.
      good: Cuts scope sensibly with stakeholder agreement.
      weak: Cuts scope silently, or delivers everything late without discussion.
    followups:
      - What happened to the parts you cut?
    common_errors:
      - Cutting the less interesting work rather than the less valuable work.

  - external_key: behavioral.ownership.repeated_user_complaints
    competency_key: ownership
    topic: Owning recurring complaints about your area
    difficulty: medium
    text: >-
      Tell me about a time users or customers kept complaining about something you were responsible for. What
      did you do to understand the complaints and resolve them?
    expected_concepts:
      - pattern in the complaints
      - talking to users to understand the real problem
      - prioritising and fixing
      - closing the loop with the people who complained
      - measuring the reduction
    rubric:
      excellent: Treats the complaints as data, finds the real underlying problem, fixes it, tells the people who complained and shows the complaints dropped.
      good: Investigates and fixes the main cause.
      weak: Dismisses the complaints or explains them away.
    followups:
      - How did you know the fix addressed what users actually meant?
    common_errors:
      - Fixing the loudest complaint instead of the most common.

  - external_key: behavioral.ownership.fixed_problem_others_caused
    competency_key: collaboration
    topic: Fixing a problem someone else caused
    difficulty: medium
    text: >-
      Tell me about a time you had to fix a problem that someone else had caused. How did you handle it with
      them and with the people affected?
    expected_concepts:
      - focusing on the fix first
      - involving the person who caused it
      - communicating with those affected without blame
      - shared lessons
    rubric:
      excellent: Fixes the impact first, involves the person constructively so they learn from it, communicates to those affected without assigning blame and shares a prevention step.
      good: Fixes the problem and talks to the person.
      weak: Fixes it but publicly blames the person, or ignores them entirely.
    followups:
      - What did the other person take away from it?
    common_errors:
      - Using the story to show the other person's failings.

  - external_key: behavioral.ownership.added_safeguard
    competency_key: ownership
    topic: Adding a safeguard so a mistake can't recur
    difficulty: medium
    text: >-
      Tell me about a time you put a safeguard in place, like a checklist, an automatic check or a review step,
      so that a mistake couldn't easily happen again. What led you to it, and did it work?
    expected_concepts:
      - the mistake that prompted it
      - why a safeguard was better than a reminder
      - design that fit the workflow
      - adoption by others
      - evidence it worked
    rubric:
      excellent: Chooses a safeguard that fits the workflow rather than relying on memory, gets others to adopt it and shows it has caught or prevented repeats.
      good: Adds a reasonable safeguard that is used.
      weak: Adds a reminder or rule that nobody follows.
    followups:
      - Did the safeguard slow anything down?
    common_errors:
      - Adding so much process that people bypass it.

  - external_key: behavioral.ownership.risky_assignment_taken
    competency_key: ownership
    topic: Taking on an assignment that might fail
    difficulty: medium
    text: >-
      Tell me about a time you took on an assignment that had a real chance of failing. Why did you take it, and
      how did you manage the risk of it going wrong?
    expected_concepts:
      - why it was risky
      - why it was worth attempting
      - setting expectations upfront
      - early checkpoints and fallback plans
      - outcome
    rubric:
      excellent: Sets expectations about the risk at the start, builds in early checkpoints and a fallback, and owns the result whether it succeeded or not.
      good: Takes on the risk and manages it reasonably.
      weak: Did not acknowledge the risk until it went wrong.
    followups:
      - What would failure have looked like, and how would you have handled it?
    common_errors:
      - Choosing an assignment that was never really at risk.

  - external_key: behavioral.ownership.own_estimate_badly_wrong
    competency_key: ownership
    topic: Owning a badly wrong estimate
    difficulty: medium
    text: >-
      Tell me about a time your own estimate for a piece of work turned out to be badly wrong. How did you
      handle it once you realised, and how has it changed the way you estimate?
    expected_concepts:
      - the estimate and how far off it was
      - when they realised and who they told
      - re-planning
      - change in their estimating method
    rubric:
      excellent: Raises the problem as soon as it is clear, re-plans with the people affected and explains a specific change in how they estimate, such as breaking work down or adding explicit ranges.
      good: Re-plans and draws a sensible lesson.
      weak: Hides the problem until the original date or blames the work for being unpredictable.
    followups:
      - What did you miss when you first estimated it?
    common_errors:
      - Concluding that estimates are pointless.

  - external_key: behavioral.ownership.turned_around_neglected_area
    competency_key: ownership
    topic: Turning around a neglected area
    difficulty: hard
    text: >-
      Tell me about an area, system or process that had been neglected for a long time and that you took on and
      turned around. How did you decide where to start, and what did it look like when you were done?
    expected_concepts:
      - state of the area and its risks
      - assessing and prioritising what to fix first
      - getting time and support
      - measurable before-and-after
      - keeping it from decaying again
    rubric:
      excellent: Assesses the area systematically, starts with the highest-risk items, secures support, shows a measurable improvement and leaves a mechanism so it does not decay again.
      good: Improves the area substantially with a sensible plan.
      weak: Makes scattered improvements with no clear start or end state.
    followups:
      - Why had it been neglected, and did that change?
    common_errors:
      - Describing the end state without the decisions that led there.

  - external_key: behavioral.ownership.answered_for_failure_publicly
    competency_key: ownership
    topic: Taking responsibility for a failure in front of others
    difficulty: hard
    text: >-
      Tell me about a time you had to stand in front of senior people or customers and take responsibility for
      a failure. How did you prepare, and what did you commit to?
    expected_concepts:
      - the failure and their responsibility
      - preparing facts, impact and remediation
      - stating responsibility clearly
      - specific commitments made
      - following through on them
    rubric:
      excellent: Prepares a clear account of what happened and its impact, states their responsibility without hedging, makes specific commitments and later shows they were met.
      good: Explains the failure and commits to reasonable actions.
      weak: Shifts responsibility, or the commitments were vague and not followed up.
    followups:
      - Which commitment was hardest to keep?
    common_errors:
      - Spending the answer on how uncomfortable the meeting was.

  - external_key: behavioral.ownership.grew_ownership_in_others
    competency_key: ownership
    topic: Helping others take more ownership
    difficulty: hard
    text: >-
      Tell me about something you did to help the people around you take more ownership of their work, rather
      than relying on you to follow things up. What did you try, and what changed?
    expected_concepts:
      - the pattern of reliance they noticed
      - changes in how they delegated or asked questions
      - making ownership explicit
      - stepping back deliberately
      - evidence others owned more
    rubric:
      excellent: Notices a pattern of reliance, changes their own behaviour to hand over real ownership, makes expectations explicit and shows others now drive work without them.
      good: Encourages others to own more with some visible change.
      weak: Continues to follow everything up themselves while describing it as support.
    followups:
      - What did you have to stop doing yourself?
    common_errors:
      - Describing telling people to take ownership without changing anything.

  - external_key: behavioral.ownership.lost_key_resource_midway
    competency_key: adaptability
    topic: Delivering after losing a key person or resource
    difficulty: hard
    text: >-
      Tell me about a time a key person or resource was taken away partway through work you were responsible
      for. How did you still deliver, and what did you have to give up?
    expected_concepts:
      - the loss and its effect on the plan
      - re-planning and re-scoping
      - negotiating with stakeholders
      - delivery and trade-offs accepted
    rubric:
      excellent: Quantifies the impact, re-plans with explicit trade-offs agreed with stakeholders and delivers the most important outcome, describing what was given up.
      good: Adjusts the plan and delivers with some trade-offs.
      weak: Continues with the original plan and misses it, citing the loss.
    followups:
      - Who did you have to tell, and what did you ask them for?
    common_errors:
      - Absorbing the extra work alone without changing the plan.

  - external_key: behavioral.ownership.solo_call_went_badly
    competency_key: ownership
    topic: Owning a judgement call made without sign-off
    difficulty: hard
    text: >-
      Tell me about a judgement call you made on your own, without waiting for sign-off, that turned out badly.
      How did you own the outcome, and how has it changed when you act on your own?
    expected_concepts:
      - the situation and why they acted alone
      - what went wrong
      - telling the right people and fixing it
      - a clearer rule for when to act alone
    rubric:
      excellent: Explains why acting alone seemed justified, owns the outcome openly, fixes the consequences and describes a clear rule they now use for which calls to make alone.
      good: Owns the outcome and draws a reasonable lesson.
      weak: Defends the call or blames the lack of available approvers.
    followups:
      - What kinds of calls do you still make on your own?
    common_errors:
      - Concluding they should never act without approval.
