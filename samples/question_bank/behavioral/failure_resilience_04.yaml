# Behavioural: failure and resilience (part 4 of 4) - risk-taking, near misses, reflecting on
# lessons, recovering over the long run and keeping commitments through setbacks. Questions ask for
# real past examples; evaluation is based only on the content of the example (actions, results,
# reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ reflection and everyday setbacks (easy)
  - external_key: behavioral.failure_resilience.most_useful_failure_lesson
    competency_key: ownership
    topic: The most useful lesson a failure taught you
    difficulty: easy
    text: >-
      Of all the things that have gone wrong in your work, which one taught you the most? Walk me through what
      happened and what you do differently because of it.
    expected_concepts:
      - a concrete failure and their role in it
      - what they learned
      - specific, observable change in their practice
      - why this lesson mattered more than others
    rubric:
      excellent: Chooses a substantive failure, explains their own role, and connects it to a specific, observable change in how they work today.
      good: Gives a real failure and a reasonable lesson.
      weak: Gives a disguised success or a lesson with no change in practice.
    followups:
      - Why that one rather than another?
    common_errors:
      - Picking a failure that is really a strength in disguise.

  - external_key: behavioral.failure_resilience.new_task_went_poorly
    competency_key: adaptability
    topic: Doing a new kind of task badly the first time
    difficulty: easy
    text: >-
      Tell me about the first time you did a new kind of task at work and it didn't go well. What did you do to
      make the second attempt better?
    expected_concepts:
      - the new task and what went poorly
      - reflecting on why
      - preparation for the second attempt
      - result of the second attempt
    rubric:
      excellent: Diagnoses the specific reasons the first attempt went poorly, prepares deliberately for the second, and shows a clearly better result.
      good: Improves on the second attempt with some preparation.
      weak: Avoided doing the task again or cannot explain what changed.
    followups:
      - Did you ask anyone for advice before the second attempt?
    common_errors:
      - Not explaining what was specifically improved.

  - external_key: behavioral.failure_resilience.users_complained_about_work
    competency_key: ownership
    topic: Users complaining about something you built
    difficulty: easy
    text: >-
      Tell me about a time users or customers complained about something you'd built or delivered. What did you
      do with those complaints?
    expected_concepts:
      - what the complaints were
      - understanding the underlying problem
      - prioritising and fixing
      - closing the loop with users
    rubric:
      excellent: Looks past the complaints to the underlying problem, prioritises a fix, and closes the loop with the users who complained.
      good: Fixes the main issue raised.
      weak: Dismisses the complaints or blames users.
    followups:
      - How did you let the users know it was fixed?
    common_errors:
      - Treating complaints as noise.

  - external_key: behavioral.failure_resilience.decision_went_against_you
    competency_key: adaptability
    topic: Executing a decision that went against you
    difficulty: easy
    text: >-
      Tell me about a time a decision went against what you'd recommended, and you were the one who had to carry
      it out. How did you approach the work?
    expected_concepts:
      - their recommendation and the decision made
      - understanding the reasoning
      - committing fully to execution
      - flagging risks constructively
    rubric:
      excellent: Seeks to understand the reasoning, commits fully to delivering the decision, and raises risks constructively during execution.
      good: Carries out the decision professionally.
      weak: Delivers half-heartedly or keeps reopening the decision.
    followups:
      - How did it turn out?
    common_errors:
      - Continuing to argue after the decision was made.

  - external_key: behavioral.failure_resilience.rushed_mistake
    competency_key: ownership
    topic: A mistake made while rushing
    difficulty: easy
    text: >-
      Describe a mistake you made because you were rushing to meet a deadline. What changed in how you work when
      time is short?
    expected_concepts:
      - the deadline pressure and the mistake
      - the consequence and fix
      - which checks were skipped
      - a minimum set of checks kept even under pressure
    rubric:
      excellent: Identifies which steps were skipped, fixes the result, and describes a minimum set of checks they now keep regardless of time pressure.
      good: Recognises the cause and adjusts their approach.
      weak: Blames the deadline with no change.
    followups:
      - Would you push back on a deadline like that now?
    common_errors:
      - Accepting that mistakes under pressure are unavoidable.

  - external_key: behavioral.failure_resilience.vague_task_went_badly
    competency_key: ownership
    topic: A loosely defined task that went badly
    difficulty: easy
    text: >-
      Tell me about a task you were given with very little guidance that went badly. Looking back, what could
      you have done to get clarity earlier?
    expected_concepts:
      - the task and the lack of guidance
      - what went wrong
      - clarifying questions they could have asked
      - how they handle unclear tasks now
    rubric:
      excellent: Identifies specific questions or checkpoints that would have helped, owns not seeking them, and describes how they handle vague tasks now.
      good: Recognises the need to clarify earlier.
      weak: Blames the person who assigned the task.
    followups:
      - What would you ask in the first conversation now?
    common_errors:
      - Waiting until the end to show work.

  - external_key: behavioral.failure_resilience.quick_fix_new_problem
    competency_key: ownership
    topic: A quick fix that caused a new problem
    difficulty: easy
    text: >-
      Tell me about a quick fix you made that ended up causing a different problem. How did you track it down,
      and what did you do about it?
    expected_concepts:
      - the original issue and the quick fix
      - the new problem it caused
      - tracing the cause back
      - a proper fix and better checking
    rubric:
      excellent: Traces the new problem to the quick fix, implements a proper fix, and describes checking side effects before quick fixes now.
      good: Finds and fixes the new problem.
      weak: Layers another quick fix on top without understanding.
    followups:
      - What would you check before a quick fix today?
    common_errors:
      - Not checking side effects.

  - external_key: behavioral.failure_resilience.tracking_own_mistakes
    competency_key: ownership
    topic: How you learn from your own mistakes over time
    difficulty: easy
    text: >-
      How do you make sure you actually learn from your own mistakes rather than just moving on? Give me an
      example of it working.
    expected_concepts:
      - a concrete practice (notes, reviews, checklists)
      - how often they revisit it
      - an example of the practice preventing a repeat
    rubric:
      excellent: Describes a concrete, regular practice and a specific example of it preventing a repeated mistake.
      good: Describes a reasonable practice with some example.
      weak: Relies on memory with no example.
    followups:
      - When did you last revisit it?
    common_errors:
      - No concrete practice, only intentions.

  # ------------------------------------------------------------ risk, recovery and judgement (medium)
  - external_key: behavioral.failure_resilience.calculated_risk_failed
    competency_key: ownership
    topic: A deliberate risk that did not pay off
    difficulty: medium
    text: >-
      Tell me about a risk you deliberately took at work that didn't pay off. Knowing what you know now, would you
      take it again?
    expected_concepts:
      - the risk and the expected upside
      - how they limited the downside
      - what happened
      - reasoned judgement on whether to repeat it
    rubric:
      excellent: Explains the expected upside and how they limited the downside, assesses the outcome, and gives a reasoned view on whether they would take the risk again.
      good: Describes the risk and draws a sensible lesson.
      weak: Never takes risks or took one without thinking about the downside.
    followups:
      - How did you limit the downside?
    common_errors:
      - Judging the risk only by its result.

  - external_key: behavioral.failure_resilience.made_failure_cheap
    competency_key: problem_solving
    topic: Designing work so failure is cheap
    difficulty: medium
    text: >-
      Describe a time you set up work, such as a pilot, prototype or trial, so that if it failed it would fail
      cheaply. How did you design it, and what did you learn?
    expected_concepts:
      - the uncertain idea
      - designing a small, cheap test
      - clear success and failure criteria
      - what was learned and the decision made
    rubric:
      excellent: Designs a small test with clear success and failure criteria set in advance, and uses the result to make a decision.
      good: Runs a small test and learns from it.
      weak: Commits fully without testing or has no criteria.
    followups:
      - What would you have done if the result was unclear?
    common_errors:
      - Setting criteria after seeing the results.

  - external_key: behavioral.failure_resilience.long_road_back
    competency_key: project_management
    topic: Recovering from a setback over months
    difficulty: medium
    text: >-
      Tell me about a setback that took months rather than days to recover from. How did you plan the recovery,
      and how did you keep progress visible along the way?
    expected_concepts:
      - the setback and its scale
      - a recovery plan with milestones
      - visible progress tracking
      - keeping stakeholders informed
      - outcome
    rubric:
      excellent: Builds a recovery plan with milestones, tracks and shares progress visibly, adjusts when needed, and reaches a clear outcome.
      good: Recovers over time with a reasonable plan.
      weak: No plan or progress tracking.
    followups:
      - What did you do when the recovery itself stalled?
    common_errors:
      - No intermediate milestones.

  - external_key: behavioral.failure_resilience.lesson_overcorrected
    competency_key: ownership
    topic: When a lesson from failure was overcorrected
    difficulty: medium
    text: >-
      Have you ever drawn a lesson from a failure that you later realised was the wrong lesson, or that you'd
      overcorrected? Tell me about it.
    expected_concepts:
      - the original failure and the lesson drawn
      - how the overcorrection showed up
      - recognising it
      - a more balanced approach
    rubric:
      excellent: Describes a specific overcorrection such as excessive process or caution, how they noticed its cost, and a more balanced approach.
      good: Recognises the overcorrection and adjusts.
      weak: Cannot see any downside to the lessons they have drawn.
    followups:
      - What made you notice it?
    common_errors:
      - Not seeing the cost of overcorrection.

  - external_key: behavioral.failure_resilience.same_problem_second_time
    competency_key: problem_solving
    topic: Facing a problem again after failing at it once
    difficulty: medium
    text: >-
      Tell me about a time you faced the same kind of problem a second time after failing at it the first time.
      What did you do differently, and how did it turn out?
    expected_concepts:
      - the first failure
      - what they learned
      - the different approach the second time
      - the result
    rubric:
      excellent: Clearly links the first failure's lessons to specific changes in the second attempt and shows a better result.
      good: Shows a different approach and better outcome.
      weak: Repeats the same approach.
    followups:
      - What would you do if you met it a third time?
    common_errors:
      - Not explaining the specific difference.

  - external_key: behavioral.failure_resilience.failure_with_limited_resources
    competency_key: ownership
    topic: Failing partly because of limited resources
    difficulty: medium
    text: >-
      Describe a time you didn't deliver partly because you didn't have the people, time or budget you needed. How
      do you separate what was outside your control from what you could have done differently?
    expected_concepts:
      - the shortfall and the resource constraints
      - whether they raised the constraint early
      - choices they made within the constraint
      - what they would do differently
    rubric:
      excellent: Separates external constraints from their own choices, admits whether they raised the constraint early enough, and identifies what they could have done such as reducing scope.
      good: Recognises some of their own choices.
      weak: Attributes the failure entirely to lack of resources.
    followups:
      - When did you first tell anyone the resources weren't enough?
    common_errors:
      - Blaming resources without examining their own choices.

  - external_key: behavioral.failure_resilience.contributed_to_losing_customer
    competency_key: stakeholder_management
    topic: Losing a customer, user or deal
    difficulty: medium
    text: >-
      Tell me about a time your work contributed to losing a customer, a user group or a deal. What did you learn
      about why it was lost, and what did you change?
    expected_concepts:
      - the loss and their contribution
      - finding out the real reasons
      - specific changes made
      - effect on later customers or deals
    rubric:
      excellent: Investigates the real reasons, acknowledges their contribution, makes specific changes, and shows the effect on later work.
      good: Learns the reasons and makes some change.
      weak: Blames price or sales without examining their own part.
    followups:
      - Did you speak to the customer directly?
    common_errors:
      - Not seeking the real reasons.

  - external_key: behavioral.failure_resilience.disputed_root_cause
    competency_key: problem_solving
    topic: When people disagreed about why something failed
    difficulty: medium
    text: >-
      Tell me about a failure where people disagreed about what had actually caused it. How did you help get to
      the real cause?
    expected_concepts:
      - the competing explanations
      - gathering evidence and timelines
      - keeping the discussion about facts not blame
      - reaching an agreed cause
      - resulting actions
    rubric:
      excellent: Uses evidence and a timeline to test the competing explanations, keeps the discussion blameless, and reaches an agreed cause that drives action.
      good: Helps move the group toward a cause.
      weak: Sides with one view without evidence.
    followups:
      - What evidence was most decisive?
    common_errors:
      - Settling the disagreement by seniority rather than evidence.

  - external_key: behavioral.failure_resilience.near_miss_taken_seriously
    competency_key: ownership
    topic: Treating a near miss seriously
    difficulty: medium
    text: >-
      Describe a near miss, something that almost went badly wrong, that you treated as seriously as a real
      failure. What did you do, and how did others react to the extra effort?
    expected_concepts:
      - the near miss and the potential impact
      - investigating as if it had failed
      - changes made
      - convincing others it was worth the effort
    rubric:
      excellent: Explains the potential impact, investigates thoroughly, makes changes proportionate to the risk, and persuades others with evidence.
      good: Takes the near miss seriously and makes a change.
      weak: Moves on because nothing actually broke.
    followups:
      - How did you justify the time spent?
    common_errors:
      - Ignoring near misses.

  - external_key: behavioral.failure_resilience.out_of_depth_went_wrong
    competency_key: adaptability
    topic: Work outside your expertise that went wrong
    difficulty: medium
    text: >-
      Tell me about a time you took on work outside your usual expertise and it went wrong. What would you do
      differently when stepping into unfamiliar territory?
    expected_concepts:
      - the work and why they took it on
      - what went wrong and why
      - recovery
      - a better approach to unfamiliar work (experts, checkpoints)
    rubric:
      excellent: Explains what went wrong due to unfamiliarity, recovers, and describes a better approach such as early expert review or smaller steps.
      good: Recovers and draws a lesson.
      weak: Concludes they should avoid unfamiliar work.
    followups:
      - Who would you involve earlier now?
    common_errors:
      - Avoiding stretch work instead of managing its risk.

  - external_key: behavioral.failure_resilience.design_flaw_found_late
    competency_key: ownership
    topic: A fundamental flaw found late
    difficulty: medium
    text: >-
      Describe a time a fundamental flaw in your approach or design was discovered late, after a lot of work had
      been built on it. How did you decide whether to fix it properly or work around it?
    expected_concepts:
      - the flaw and how it was found
      - options considered (rework, workaround, defer)
      - cost and risk of each option
      - the decision and its communication
      - earlier validation practices now
    rubric:
      excellent: Lays out the options with costs and risks, makes a reasoned decision, communicates it, and describes how they now validate core decisions earlier.
      good: Makes a sensible decision on fixing the flaw.
      weak: Patches around it without considering the long-term cost.
    followups:
      - What review would have caught it earlier?
    common_errors:
      - Not considering a proper fix because of sunk cost.

  - external_key: behavioral.failure_resilience.development_goal_missed
    competency_key: ownership
    topic: A professional development goal you missed
    difficulty: medium
    text: >-
      Tell me about a professional development goal you set for yourself at work and didn't reach. Why did it
      stall, and what did you change about how you set or pursue goals?
    expected_concepts:
      - the goal and why it mattered
      - why it stalled
      - what they changed (smaller goals, accountability, time)
      - progress since
    rubric:
      excellent: Diagnoses why the goal stalled, changes how they set or pursue goals in specific ways, and shows progress since.
      good: Identifies reasons and makes some change.
      weak: Blames lack of time with no change.
    followups:
      - How do you track development goals now?
    common_errors:
      - Setting goals with no plan or check-ins.

  # ------------------------------------------------------------ hard calls, ambiguity and commitment (hard)
  - external_key: behavioral.failure_resilience.flagged_flaw_before_launch
    competency_key: culture_values
    topic: Raising a serious flaw that would delay a launch
    difficulty: hard
    text: >-
      Tell me about a time you found a serious problem in your own team's work shortly before a launch or
      deadline, and raising it meant delaying something people were counting on. What did you do, and how did
      you make the case?
    expected_concepts:
      - the flaw and its likely impact if shipped
      - weighing the delay against the risk
      - raising it promptly with evidence
      - options offered (delay, reduced scope, mitigation)
      - outcome and what changed to catch such issues earlier
    rubric:
      excellent: Quantifies the risk of shipping against the cost of delay, raises it promptly with evidence and options, and follows through on the decision while changing how such flaws are caught earlier.
      good: Raises the flaw and helps reach a reasonable decision.
      weak: Stays silent to protect the date, or raises it without evidence or options.
    followups:
      - Who pushed back on the delay, and how did you respond?
      - What would you have done if the decision had been to ship anyway?
    common_errors:
      - Presenting only the problem without options for the decision-makers.

  - external_key: behavioral.failure_resilience.patch_or_proper_fix_under_pressure
    competency_key: problem_solving
    topic: Patch now or fix properly under stakeholder pressure
    difficulty: hard
    text: >-
      Describe a failure where stakeholders were pressing for a quick resolution, but you believed a proper fix
      would take much longer. How did you handle the trade-off?
    expected_concepts:
      - the failure and the pressure
      - options with costs and risks
      - a phased approach (mitigate now, fix properly later)
      - securing commitment for the proper fix
      - outcome
    rubric:
      excellent: Presents options with costs and risks, agrees a phased approach, secures commitment for the proper fix, and follows through to completion.
      good: Balances the quick fix with some plan for the proper fix.
      weak: Only patches, or refuses any quick mitigation.
    followups:
      - Did the proper fix actually happen?
    common_errors:
      - The proper fix never gets scheduled.

  - external_key: behavioral.failure_resilience.failure_changed_risk_approach
    competency_key: ownership
    topic: A failure that changed how you take risks
    difficulty: hard
    text: >-
      Tell me about a failure that changed the way you take risks at work. Give me an example of a decision from
      before and one from after, so I can see the difference.
    expected_concepts:
      - the failure
      - how they assessed risk before
      - how they assess risk after
      - concrete before and after decisions
      - balance between caution and progress
    rubric:
      excellent: Gives concrete before and after decisions that clearly show a changed approach to risk, and explains how they avoid becoming too cautious.
      good: Shows some change in risk approach with examples.
      weak: Describes the change only in general terms.
    followups:
      - Has the new approach ever held you back?
    common_errors:
      - Becoming risk-averse rather than better at judging risk.

  - external_key: behavioral.failure_resilience.unclear_ownership_failure
    competency_key: ownership
    topic: A failure where nobody clearly owned the problem
    difficulty: hard
    text: >-
      Tell me about a failure where ownership was unclear and different groups pointed at each other. What did you
      do to get it resolved, and to sort out ownership going forward?
    expected_concepts:
      - the failure and the ownership gap
      - stepping in to coordinate the fix
      - getting ownership agreed
      - documenting and enforcing ownership
      - outcome
    rubric:
      excellent: Steps in to coordinate the fix regardless of formal ownership, gets ownership explicitly agreed, and puts it on record so the gap does not recur.
      good: Gets the immediate problem resolved and raises the ownership gap.
      weak: Waits for ownership to be resolved before acting.
    followups:
      - Who ended up owning it?
    common_errors:
      - Fixing it themselves without resolving ownership long term.

  - external_key: behavioral.failure_resilience.kept_commitment_through_setback
    competency_key: ownership
    topic: Keeping a critical commitment despite a serious setback
    difficulty: hard
    text: >-
      Describe a time you still delivered on a critical commitment even though a serious setback hit partway
      through. What did you trade off to make it, and was it worth it?
    expected_concepts:
      - the commitment and the setback
      - options considered
      - trade-offs made and agreed with others
      - delivery and its quality
      - reflection on whether it was worth it
    rubric:
      excellent: Describes the setback and options clearly, makes explicit trade-offs agreed with stakeholders, delivers, and reflects critically on whether the cost was justified.
      good: Delivers through the setback with reasonable trade-offs.
      weak: Delivers through unsustainable effort without considering trade-offs, or does not reflect.
    followups:
      - What would have made you renegotiate the commitment instead?
    common_errors:
      - Treating heroics as the only option.
