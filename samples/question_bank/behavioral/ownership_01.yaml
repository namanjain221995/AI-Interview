# Behavioural questions: ownership (accountability, follow-through, owning mistakes, responsible
# initiative beyond the assigned scope). Questions ask for real past examples; evaluation is based
# only on the content of the example (actions, results, reflection), never on delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  - external_key: behavioral.ownership.missed_promise_to_colleague
    competency_key: ownership
    topic: Telling people early when a commitment will slip
    difficulty: easy
    text: >-
      Tell me about a time you realised you weren't going to deliver something you'd promised a colleague on
      time. When did you tell them, and how did you handle it from there?
    expected_concepts:
      - what was promised and why it was slipping
      - how early they flagged the slip
      - a revised plan or partial delivery offered
      - impact on the colleague considered
      - what they changed to avoid repeating it
    rubric:
      excellent: Flags the slip as soon as it was known, offers a concrete revised plan or workaround that limits the impact on the colleague, and explains a specific change in how they commit now.
      good: Tells the colleague before the deadline and delivers on a revised date, with some reflection.
      weak: Only says something once the deadline has passed, or the example has no real commitment at stake.
    followups:
      - What did the colleague have to change because of the delay?
      - How do you decide when a slip is worth flagging?
    common_errors:
      - Describing the delay as caused entirely by others without saying what they could have done.

  - external_key: behavioral.ownership.meeting_action_item
    competency_key: ownership
    topic: Following through on action items
    difficulty: easy
    text: >-
      Think of a meeting where you took on an action item that could easily have been forgotten once
      everyone left the room. How did you make sure it actually got done?
    expected_concepts:
      - the action item and why it mattered
      - how they recorded or tracked it
      - steps taken to complete it
      - closing the loop with the people in the meeting
    rubric:
      excellent: Names a specific action item, describes a concrete way they tracked it, completes it and tells the attendees it is done, explaining why closing the loop mattered.
      good: Completes the action with a sensible tracking habit but does not mention telling others.
      weak: Describes general good intentions without a specific item or outcome.
    followups:
      - How did the others find out it was finished?
      - What happens to action items on your team that nobody follows up?
    common_errors:
      - Talking about meeting habits in general instead of one real action item.

  - external_key: behavioral.ownership.unglamorous_task
    competency_key: ownership
    topic: Picking up unglamorous work
    difficulty: easy
    text: >-
      Tell me about a piece of unglamorous work that needed doing and that nobody on your team wanted to pick
      up. Why did you take it on, and how did it turn out?
    expected_concepts:
      - what the task was and why it mattered
      - reason for taking it on
      - how they completed it well
      - outcome for the team or users
    rubric:
      excellent: Explains the cost of leaving the task undone, describes doing it thoroughly rather than minimally, and shows a concrete benefit to the team or users.
      good: Takes on and completes the task with a reasonable explanation of why.
      weak: Example is trivial, or they did it only because it was assigned and add nothing about its value.
    followups:
      - Did anything change so the task wouldn't be left unowned again?
    common_errors:
      - Choosing a task that was simply part of their assigned job.

  - external_key: behavioral.ownership.checked_problem_solved
    competency_key: ownership
    topic: Checking that delivered work solved the problem
    difficulty: easy
    text: >-
      After you finish a piece of work and hand it over, how do you find out whether it actually solved the
      problem it was meant to solve? Walk me through a recent example.
    expected_concepts:
      - what the work was meant to achieve
      - how they checked the real outcome
      - what they found
      - follow-up action when the result fell short
    rubric:
      excellent: Describes a concrete check of the real-world result, such as usage, feedback or a metric, and a follow-up change they made based on what they found.
      good: Checks with the requester or user after delivery and reports a sensible result.
      weak: Treats handing over or getting approval as the end of their responsibility.
    followups:
      - What would have made you go back and change it?
      - How long after delivery did you check?
    common_errors:
      - Equating "the task was closed" with "the problem was solved".

  - external_key: behavioral.ownership.asked_for_help_in_time
    competency_key: ownership
    topic: Asking for help at the right moment
    difficulty: easy
    text: >-
      Tell me about a time you got stuck on a task you were responsible for. At what point did you ask for
      help, and how did you decide that was the right moment?
    expected_concepts:
      - what they tried on their own first
      - signal that told them to ask
      - who they asked and how they framed the request
      - outcome and what they learned about timing
    rubric:
      excellent: Shows a deliberate decision about when to ask based on deadline and progress, makes a well-prepared request, and keeps ownership of the task after getting help.
      good: Asks for help after a reasonable effort and finishes the task.
      weak: Either struggles alone until the deadline is missed or hands the problem over entirely.
    followups:
      - What did you have ready when you asked?
      - Looking back, should you have asked sooner or later?
    common_errors:
      - Presenting never needing help as the ideal.

  - external_key: behavioral.ownership.improved_area_while_passing
    competency_key: ownership
    topic: Leaving things better than you found them
    difficulty: easy
    text: >-
      Give me an example of something you improved while you were working in that area for a different
      reason, like a confusing document or an awkward step in a process. What did you change, and why?
    expected_concepts:
      - what they noticed and why it was a problem
      - the improvement made
      - keeping the change proportionate to the main task
      - who benefited
    rubric:
      excellent: Describes a specific improvement, explains how they kept it small and safe alongside the main task, and shows who benefited afterwards.
      good: Makes a useful improvement with a clear reason.
      weak: Cannot name a concrete improvement, or the change derailed their actual task.
    followups:
      - How did you decide it was worth doing then rather than later?
    common_errors:
      - Describing a large unrequested rewrite that delayed their real work.

  - external_key: behavioral.ownership.error_pointed_out_by_colleague
    competency_key: ownership
    topic: Responding when someone finds your error
    difficulty: easy
    text: >-
      Tell me about a time a colleague found an error in your work before it went any further. How did you
      respond, and what did you do about it?
    expected_concepts:
      - the error and how it was found
      - acknowledging it without excuses
      - correcting it promptly
      - checking for similar errors elsewhere
      - change in their own checks
    rubric:
      excellent: Acknowledges the error directly, fixes it quickly, checks whether the same mistake exists elsewhere and adds a check to their own process.
      good: Acknowledges and fixes the error and mentions a lesson.
      weak: Minimises the error or explains why it was not really their fault.
    followups:
      - Did you look for the same mistake anywhere else?
    common_errors:
      - Choosing an example where the "error" was a difference of opinion.

  - external_key: behavioral.ownership.customer_problem_seen_through
    competency_key: ownership
    topic: Following a user's problem through to resolution
    difficulty: easy
    text: >-
      Describe a time a customer or user brought you a problem you couldn't fix yourself. How did you make
      sure it was actually resolved rather than just passed along?
    expected_concepts:
      - understanding the problem and its impact
      - finding the right person or team
      - handing over with enough context
      - checking progress and confirming resolution
      - keeping the user informed
    rubric:
      excellent: Hands the problem to the right owner with clear context, keeps checking until it is fixed and confirms with the user that it is resolved.
      good: Routes the problem correctly and follows up at least once.
      weak: Forwards the problem and considers their part finished.
    followups:
      - How did the user know what was happening while they waited?
    common_errors:
      - Stopping at "I raised a ticket".

  - external_key: behavioral.ownership.picked_up_unfinished_work
    competency_key: ownership
    topic: Taking over someone else's unfinished work
    difficulty: easy
    text: >-
      Tell me about a time you picked up work that someone else had started and left unfinished. How did you
      get up to speed, and how did you make the result your own?
    expected_concepts:
      - state of the work when they took it over
      - how they learned the context
      - decisions they kept or changed and why
      - delivering the finished result
    rubric:
      excellent: Describes a structured way of learning the context, makes clear decisions about what to keep or change, and delivers the result as its accountable owner.
      good: Gets up to speed sensibly and finishes the work.
      weak: Treats problems in the inherited work as someone else's fault and does not describe finishing it.
    followups:
      - What did you find that the previous person hadn't mentioned?
    common_errors:
      - Spending the answer criticising the previous owner.

  - external_key: behavioral.ownership.recurring_problem_root_cause
    competency_key: ownership
    topic: Fixing the root cause instead of the symptom
    difficulty: medium
    text: >-
      Tell me about a recurring problem you stopped patching and decided to fix properly at the root. How did
      you find the underlying cause, and how did you justify the time it took?
    expected_concepts:
      - how often the problem recurred and its cost
      - investigation that found the underlying cause
      - case made for investing time
      - the lasting fix
      - evidence the problem stopped recurring
    rubric:
      excellent: Quantifies the cost of repeated patching, explains how they found the real cause, gets support for the time needed and shows the problem stopped recurring.
      good: Identifies and fixes a real root cause with some evidence it worked.
      weak: The "root cause fix" is another workaround, or there is no evidence of the result.
    followups:
      - What would have happened if you had kept patching it?
      - Who had to agree before you could spend the time?
    common_errors:
      - Describing a one-off fix rather than a recurring problem.

  - external_key: behavioral.ownership.renegotiated_commitment
    competency_key: ownership
    topic: Renegotiating a commitment when circumstances change
    difficulty: medium
    text: >-
      Describe a time a commitment you'd made could no longer be met as promised because circumstances
      changed. How did you renegotiate it, and with whom?
    expected_concepts:
      - the original commitment and what changed
      - identifying everyone affected
      - options offered such as reduced scope or a new date
      - agreement reached
      - delivering on the revised commitment
    rubric:
      excellent: Identifies all affected parties, presents clear options with their trade-offs, reaches an explicit new agreement and then delivers on it.
      good: Renegotiates with the main stakeholder and meets the revised commitment.
      weak: Lets the original commitment quietly lapse without a new agreement.
    followups:
      - What options did you put on the table?
      - How did you make sure the new commitment was realistic?
    common_errors:
      - Treating the change in circumstances as cancelling the commitment.

  - external_key: behavioral.ownership.risk_flagged_early
    competency_key: ownership
    topic: Raising a risk before it becomes a problem
    difficulty: medium
    text: >-
      Tell me about a time you spotted a risk to your work or your team's work before anyone else was worried
      about it. What did you do with that concern, and what happened?
    expected_concepts:
      - the risk and the early signal
      - assessment of likelihood and impact
      - who they raised it with and how
      - mitigation they proposed or took
      - outcome
    rubric:
      excellent: Explains the early signal and their assessment, raises it with the right people in a way that led to action, and takes part in the mitigation, describing the result.
      good: Raises a real risk clearly and some mitigation follows.
      weak: Mentions the risk only in hindsight or did not act on it.
    followups:
      - How did you make sure it wasn't dismissed?
      - What would you have done if nobody acted on it?
    common_errors:
      - Describing a risk that had already turned into a problem.

  - external_key: behavioral.ownership.task_everyone_assumed_covered
    competency_key: ownership
    topic: Finding work that everyone assumed someone else owned
    difficulty: medium
    text: >-
      Tell me about a time you found out that an important task or responsibility was not being done because
      everyone assumed someone else was handling it. How did you discover it, and what did you do?
    expected_concepts:
      - how the gap was discovered
      - immediate action to cover the risk
      - getting a clear owner agreed
      - preventing it from falling through again
    rubric:
      excellent: Covers the immediate risk, gets a named owner agreed rather than silently absorbing the work forever, and puts something in place so it does not fall through again.
      good: Notices the gap and makes sure the task gets done.
      weak: Notices the gap but only mentions it in passing or complains about it.
    followups:
      - Did you end up owning it yourself, and was that the right outcome?
    common_errors:
      - Quietly doing the work without making ownership clear.

  - external_key: behavioral.ownership.how_far_into_another_area
    competency_key: ownership
    topic: Respecting another owner's area
    difficulty: medium
    text: >-
      Tell me about a time you wanted to fix something in an area owned by another person or team. How did you
      decide how far to go yourself and how much to leave to them?
    expected_concepts:
      - the problem and who owned the area
      - contacting the owner first
      - agreeing the scope of their involvement
      - outcome and the relationship afterwards
    rubric:
      excellent: Involves the owner early, agrees explicitly what they will and will not do, delivers that part and leaves the owner in control of their area.
      good: Consults the owner and contributes a fix with their agreement.
      weak: Changes another team's area without asking, or does nothing because it was not theirs.
    followups:
      - What would you have done if the owner said no?
    common_errors:
      - Framing going around the owner as initiative.

  - external_key: behavioral.ownership.my_part_in_team_miss
    competency_key: ownership
    topic: Owning your part of a team failure
    difficulty: medium
    text: >-
      Tell me about a time your team missed a goal or a deadline. What part of that outcome do you consider
      yours, and what did you do about it?
    expected_concepts:
      - what was missed and its impact
      - their own specific contribution to the miss
      - actions taken afterwards
      - changes to how they or the team work
    rubric:
      excellent: Identifies their own specific contribution without deflecting to the team, describes concrete corrective action and a lasting change.
      good: Acknowledges some personal part and describes a useful change.
      weak: Describes the miss as entirely caused by others or by circumstances.
    followups:
      - If you could replay it, what is the first thing you would do differently?
    common_errors:
      - Saying "we" throughout so their own role never becomes clear.

  - external_key: behavioral.ownership.corrected_wrong_information
    competency_key: ownership
    topic: Correcting information you got wrong
    difficulty: medium
    text: >-
      Tell me about a time you shared a figure, a recommendation or a piece of information that later turned
      out to be wrong. How did you correct it, and who did you tell?
    expected_concepts:
      - what was wrong and how they found out
      - who had relied on it
      - speed and clarity of the correction
      - reducing the impact of decisions already made
      - change to how they verify information
    rubric:
      excellent: Corrects the information quickly with everyone who relied on it, helps limit the effect on decisions already made and changes how they check similar work.
      good: Issues a clear correction to the main audience.
      weak: Corrects it quietly or only when asked.
    followups:
      - Had anyone already acted on it?
    common_errors:
      - Blaming the source data without describing their own check.

  - external_key: behavioral.ownership.took_on_too_much
    competency_key: ownership
    topic: Recovering from overcommitment
    difficulty: medium
    text: >-
      Describe a time you took on more than you could realistically deliver. How did you recognise it, and
      what did you do about the commitments you had already made?
    expected_concepts:
      - signals that they were overcommitted
      - prioritising among commitments
      - communicating with the people affected
      - handing over or dropping work cleanly
      - change in how they accept work
    rubric:
      excellent: Spots the problem early, prioritises explicitly, tells affected people and hands over or descopes work cleanly, then changes how they accept new work.
      good: Recognises the overload and reprioritises with some communication.
      weak: Keeps everything and lets several commitments slip without warning.
    followups:
      - How do you now decide whether to say yes to something?
    common_errors:
      - Presenting working longer hours as the whole solution.

  - external_key: behavioral.ownership.pressure_to_hand_over_unfinished
    competency_key: ownership
    topic: Owning the quality of your work under pressure
    difficulty: medium
    text: >-
      Tell me about a time you were under pressure to hand over work you knew wasn't good enough yet. What did
      you do, and how did you explain your decision?
    expected_concepts:
      - what was not good enough and the risk it carried
      - options considered
      - decision and how it was communicated
      - outcome for quality and timing
    rubric:
      excellent: States the specific risk of handing over early, offers options such as a reduced scope with known limitations, and makes and explains a decision that balances quality and time.
      good: Makes a reasonable call and explains it to the people waiting.
      weak: Hands over silently despite known problems, or delays without explaining.
    followups:
      - What did you tell people about the known limitations?
    common_errors:
      - Treating every delay for quality as automatically correct.

  - external_key: behavioral.ownership.clean_handover
    competency_key: ownership
    topic: Handing over responsibility cleanly
    difficulty: medium
    text: >-
      Tell me about a time you handed over work or a responsibility to someone else, for example when you
      moved to a different project. How did you make sure nothing fell through the cracks?
    expected_concepts:
      - what was handed over
      - written context and open items
      - overlap or walkthrough with the new owner
      - availability for questions afterwards
      - checking the handover worked
    rubric:
      excellent: Prepares written context and a list of open items, walks the new owner through it, stays reachable and checks later that nothing was dropped.
      good: Provides reasonable handover notes and a walkthrough.
      weak: Leaves with little more than a short message.
    followups:
      - What question did the new owner ask later that you hadn't covered?
    common_errors:
      - Describing a handover they received instead of one they gave.

  - external_key: behavioral.ownership.unblocked_stalled_decision
    competency_key: ownership
    topic: Moving work stuck on a decision
    difficulty: medium
    text: >-
      Tell me about a time a piece of work was stuck because nobody would make a decision. What did you do to
      get it moving again?
    expected_concepts:
      - why the decision was stuck
      - identifying who should decide
      - framing options and a recommendation
      - setting a deadline or default
      - result
    rubric:
      excellent: Works out who should decide, frames the options with a recommendation and a deadline, and gets a decision that unblocks the work.
      good: Pushes for a decision and the work moves forward.
      weak: Waits for the decision or makes it unilaterally without the right people.
    followups:
      - What did you do if the decision-maker still didn't respond?
    common_errors:
      - Making a decision they had no authority to make and calling it ownership.

  - external_key: behavioral.ownership.mistake_nobody_noticed
    competency_key: ownership
    topic: Disclosing a mistake nobody else had noticed
    difficulty: hard
    text: >-
      Tell me about a time you discovered a significant mistake of your own that nobody else had noticed yet.
      How did you decide what to do, and how did you handle disclosing and fixing it?
    expected_concepts:
      - nature and scale of the mistake
      - assessing impact and who was affected
      - prompt disclosure to the right people
      - fix and remediation of consequences
      - safeguards so it would be caught next time
    rubric:
      excellent: Discloses promptly to the right people with a clear account of impact, leads the fix and remediation, and adds safeguards so the mistake would be caught by a process rather than by chance.
      good: Discloses and fixes the mistake with sensible remediation.
      weak: Fixes it quietly without telling anyone, or the mistake had no real consequence.
    followups:
      - What made you sure you had found the full extent of it?
      - How did the people you told respond, and what did they need from you?
    common_errors:
      - Choosing a trivial mistake that needed no disclosure.

  - external_key: behavioral.ownership.unclear_responsibility_failure
    competency_key: ownership
    topic: Stepping up when responsibility was unclear
    difficulty: hard
    text: >-
      Describe a situation where something went seriously wrong and it wasn't clear who was responsible. How
      did you approach it, and what role did you take in resolving it and preventing a repeat?
    expected_concepts:
      - the failure and its impact
      - focus on resolution before blame
      - role they took and why
      - clarifying ownership going forward
      - preventive changes
    rubric:
      excellent: Focuses first on resolving the impact, takes a clear role, then works to establish explicit ownership and preventive changes so the ambiguity cannot recur.
      good: Helps resolve the problem and suggests clearer ownership.
      weak: Spends the answer establishing who was at fault.
    followups:
      - How did you get people to agree on ownership afterwards?
    common_errors:
      - Treating finding the culprit as the main outcome.

  - external_key: behavioral.ownership.rebuilt_lost_trust
    competency_key: ownership
    topic: Rebuilding trust after letting someone down
    difficulty: hard
    text: >-
      Tell me about a time you let down a colleague, customer or stakeholder in a way that damaged their trust
      in you. What did you do to rebuild it, and how did you know it had worked?
    expected_concepts:
      - what happened and why it damaged trust
      - acknowledging it directly
      - concrete commitments made afterwards
      - consistent delivery over time
      - evidence trust was restored
    rubric:
      excellent: Acknowledges the failure directly, makes specific commitments and keeps them over a sustained period, and points to concrete evidence that trust was restored.
      good: Acknowledges the failure and describes reliable delivery afterwards.
      weak: Describes a single apology as the whole repair, or blames the other party.
    followups:
      - How long did it take, and what was the turning point?
    common_errors:
      - Picking a minor misunderstanding rather than a real breach of trust.

  - external_key: behavioral.ownership.problem_outside_role_authority
    competency_key: ownership
    topic: Taking on a significant problem outside your role
    difficulty: hard
    text: >-
      Tell me about the most significant problem you've taken on that was clearly outside your official role.
      How did you get the support or authority you needed, and what did you leave in place when you stepped
      back?
    expected_concepts:
      - scale of the problem and why nobody owned it
      - securing sponsorship or agreement
      - actions and result
      - durable ownership or mechanism left behind
      - balancing it with their own responsibilities
    rubric:
      excellent: Takes on a high-impact problem, secures the right sponsorship rather than acting alone, delivers a result and leaves a named owner or mechanism so it does not depend on them.
      good: Solves a meaningful problem outside their role with some support.
      weak: The problem was small, or they dropped their own responsibilities to pursue it.
    followups:
      - What did you stop doing to make room for it?
      - Who owns it now?
    common_errors:
      - Leaving the solution dependent on themselves indefinitely.

  - external_key: behavioral.ownership.kept_owning_after_launch
    competency_key: ownership
    topic: Owning something over the long term
    difficulty: hard
    text: >-
      Tell me about something you delivered and then stayed responsible for long after it launched. What did
      owning it over time involve, and what did that teach you about how to build things in the first place?
    expected_concepts:
      - what they delivered and its users
      - ongoing work such as fixes, support and changes
      - how they measured its health over time
      - lessons applied to later work
    rubric:
      excellent: Describes concrete long-term responsibilities and how they tracked its health, and draws specific lessons they applied to later work.
      good: Describes maintaining it for a meaningful period with some lessons.
      weak: Ownership ended at launch, or lessons are generic.
    followups:
      - What would you design differently knowing what maintenance cost?
    common_errors:
      - Describing only the launch.
