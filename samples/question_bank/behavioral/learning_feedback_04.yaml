# Behavioural: learning and feedback (part 4 of 4) - turning feedback into lasting change.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, reasoning, outcome, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ easy
  - external_key: behavioral.learning_feedback.stated_feedback_preference
    competency_key: culture_values
    topic: Telling someone how feedback works best for you
    difficulty: easy
    text: >-
      Tell me about a time you told a colleague or manager what kind of feedback was most useful to you, so they
      could give it more effectively. What did you tell them, and what changed?
    expected_concepts:
      - what was not working about the feedback before
      - the specific request made
      - how the other person adjusted
      - better feedback received afterwards
    rubric:
      excellent: Identifies what was missing from the feedback they were getting, makes a specific request such as timing or concrete examples, and shows the feedback became more useful.
      good: Made a reasonable request with some improvement.
      weak: Expects others to work out what they need without telling them.
    followups:
      - How did they respond to the request?
    common_errors:
      - Asking only for gentler feedback rather than more useful feedback.

  - external_key: behavioral.learning_feedback.pause_before_responding
    competency_key: culture_values
    topic: What you did between hearing feedback and responding
    difficulty: easy
    text: >-
      Think of a time feedback stung a little when you first heard it. What did you do between hearing it and
      responding to it?
    expected_concepts:
      - the feedback and context
      - taking time to consider it before replying
      - separating the content from the delivery
      - the eventual response and action
    rubric:
      excellent: Describes deliberately taking time to understand the substance, separating it from how it was delivered, and responding with questions and a concrete plan.
      good: Considered the feedback before responding and acted on it.
      weak: Responded straight away by arguing, or describes no action at all.
    followups:
      - What questions did you go back with?
    common_errors:
      - Focusing on how they felt rather than what they did.

  - external_key: behavioral.learning_feedback.watched_someone_use_it
    competency_key: adaptability
    topic: Watching someone use what you made
    difficulty: easy
    text: >-
      Tell me about a time you watched someone use something you had built, written or prepared, and learned
      something you didn't expect. What did you change afterwards?
    expected_concepts:
      - what was being used and by whom
      - the unexpected observation
      - why it had not been anticipated
      - the change made
    rubric:
      excellent: Describes a specific unexpected observation, explains why they had not anticipated it and makes a change that addressed the real use.
      good: Learned something useful from observation and made a change.
      weak: Watched but changed nothing, or only noted that the user made mistakes.
    followups:
      - How often do you watch people use your work now?
    common_errors:
      - Blaming the user for using it the wrong way.

  - external_key: behavioral.learning_feedback.focus_on_wrong_things
    competency_key: adaptability
    topic: Feedback that you were focusing on the wrong things
    difficulty: easy
    text: >-
      Tell me about a time a manager or lead told you that you were spending your effort on the wrong things.
      What did you change about how you prioritise?
    expected_concepts:
      - what they were focusing on and why
      - understanding what mattered more
      - a changed way of choosing priorities
      - outcome of the shift
    rubric:
      excellent: Understands why the other work mattered more, adopts a concrete way of checking priorities and shows a better outcome as a result.
      good: Refocused sensibly after the feedback.
      weak: Refocused that once without changing how they prioritise.
    followups:
      - How do you check your priorities now?
    common_errors:
      - Changing tasks without understanding why they mattered more.

  - external_key: behavioral.learning_feedback.development_goal_actions
    competency_key: adaptability
    topic: Turning a development goal into actions
    difficulty: easy
    text: >-
      Tell me about a development goal that came out of a review or a conversation with your manager. How did you
      turn it into concrete actions?
    expected_concepts:
      - the goal and why it was chosen
      - breaking it into concrete steps
      - opportunities sought in real work
      - progress review
    rubric:
      excellent: Breaks the goal into specific steps, finds real work to practise on and reviews progress with the manager along the way.
      good: Took concrete steps toward the goal.
      weak: Goal stayed an intention until the next review.
    followups:
      - What opportunity in your work helped most?
    common_errors:
      - Only listing courses taken.

  - external_key: behavioral.learning_feedback.teamwork_feedback
    competency_key: collaboration
    topic: Feedback on how you work within a team
    difficulty: easy
    text: >-
      Tell me about feedback you received on how you work with others in a team. What did you change in your
      day-to-day working?
    expected_concepts:
      - the specific team behaviour mentioned
      - its effect on teammates
      - the change made
      - how teammates noticed
    rubric:
      excellent: Names a specific behaviour and its effect on teammates, a concrete change in day-to-day work and evidence teammates noticed.
      good: Specific feedback with a reasonable change.
      weak: Vague feedback such as be more of a team player with no concrete change.
    followups:
      - Who told you, and how?
    common_errors:
      - Feedback and change both too vague to assess.

  - external_key: behavioral.learning_feedback.lessons_record
    competency_key: adaptability
    topic: Keeping track of lessons so you reuse them
    difficulty: easy
    text: >-
      Tell me how you keep track of lessons from past work so that you actually use them later. Give me an example
      where that record helped.
    expected_concepts:
      - the method used to capture lessons
      - how they revisit it
      - a specific instance where it helped
    rubric:
      excellent: Describes a simple, regularly used way of capturing and revisiting lessons, with a specific example of it changing what they did.
      good: Has some way of capturing lessons and a credible example.
      weak: Relies on memory alone, or captures lessons but never revisits them.
    followups:
      - When do you look back at it?
    common_errors:
      - Writing lessons down but never reading them again.

  - external_key: behavioral.learning_feedback.early_draft_feedback
    competency_key: culture_values
    topic: Sharing an early draft for feedback
    difficulty: easy
    text: >-
      When you share an early draft of your work, what kind of feedback do you ask for at that stage? Give me an
      example where sharing it early changed the outcome.
    expected_concepts:
      - what makes a draft ready to share
      - feedback asked for at the draft stage, such as direction rather than detail
      - what came back
      - how the outcome changed
    rubric:
      excellent: Shares early with a clear request focused on direction, receives input that changed the course of the work and explains the rework it avoided.
      good: Shared early and benefited from the input.
      weak: Waits until work is finished, or shares early without saying what feedback is needed.
    followups:
      - How do you decide it's ready to show?
    common_errors:
      - Asking for detailed polish on a rough draft.

  # ------------------------------------------------------------ medium
  - external_key: behavioral.learning_feedback.multi_source_themes
    competency_key: adaptability
    topic: Finding themes in feedback from many people
    difficulty: medium
    text: >-
      Tell me about a time you received structured feedback from several people at once, such as a multi-rater
      review. How did you decide which themes to act on?
    expected_concepts:
      - the feedback gathered and from whom
      - spotting themes versus one-off comments
      - choosing a small number of priorities
      - actions and follow-up
    rubric:
      excellent: Separates recurring themes from one-off comments, chooses a focused set of priorities with reasons and shows the actions and results that followed.
      good: Identified sensible themes and acted on some.
      weak: Tried to act on everything, or acted only on the comments they agreed with.
    followups:
      - Which comment did you decide not to act on?
    common_errors:
      - Acting on every comment equally.

  - external_key: behavioral.learning_feedback.misread_feedback
    competency_key: culture_values
    topic: Acting on a misunderstanding of feedback
    difficulty: medium
    text: >-
      Tell me about a time you misunderstood feedback and ended up working on the wrong thing. How did you
      discover it, and how do you avoid that now?
    expected_concepts:
      - the original feedback and the misreading
      - how the mistake came to light
      - correcting course
      - confirming understanding in future
    rubric:
      excellent: Explains how the misreading happened, corrects course quickly and now confirms understanding by playing back the feedback or agreeing a concrete example.
      good: Recognised the misunderstanding and adjusted.
      weak: Blames the feedback-giver entirely and changes nothing.
    followups:
      - What do you say now to check you've understood feedback?
    common_errors:
      - No change to how they confirm understanding.

  - external_key: behavioral.learning_feedback.new_lead_expectations
    competency_key: adaptability
    topic: A new lead with different expectations
    difficulty: medium
    text: >-
      Describe a time a new manager or lead expected different things from you than your previous one did. How
      did you find out what they expected, and what did you adjust?
    expected_concepts:
      - signs the expectations had changed
      - asking directly and early
      - specific adjustments
      - checking in to confirm
    rubric:
      excellent: Asks directly and early what the new lead values, makes specific adjustments and checks back to confirm they have it right.
      good: Worked out the new expectations and adjusted.
      weak: Carried on as before until problems appeared.
    followups:
      - What did you keep doing the same?
    common_errors:
      - Waiting for problems before asking.

  - external_key: behavioral.learning_feedback.outside_comfort_zone
    competency_key: adaptability
    topic: Feedback asking you to do something less familiar
    difficulty: medium
    text: >-
      Tell me about feedback that asked you to do more of something less familiar to you, such as presenting,
      leading discussions or making calls without full information. How did you work on it?
    expected_concepts:
      - the feedback and the skill involved
      - small steps to practise
      - support or coaching sought
      - progress over time
    rubric:
      excellent: Builds the skill through deliberate, increasing steps, seeks support and feedback along the way and shows clear progress.
      good: Took on opportunities to practise with some progress.
      weak: Avoided the opportunities or made a single attempt.
    followups:
      - What was the first small step you took?
    common_errors:
      - One attempt treated as having addressed it.

  - external_key: behavioral.learning_feedback.speed_vs_polish
    competency_key: culture_values
    topic: Feedback that clashed with your own standards
    difficulty: medium
    text: >-
      Tell me about a time you were asked to change how you worked in a way that clashed with your own standards,
      for example to move faster at some cost to polish. How did you handle it?
    expected_concepts:
      - the request and the reasons behind it
      - understanding where quality really mattered
      - agreeing what could be relaxed and what could not
      - result and what they learned
    rubric:
      excellent: Understands the reasons for the request, distinguishes where quality mattered from where it did not, agrees the trade-off explicitly and reflects on the result.
      good: Adapted while protecting what mattered.
      weak: Refused to adapt, or dropped standards everywhere without discussion.
    followups:
      - Where did you hold the line, and why?
    common_errors:
      - Treating all quality as equally important.

  - external_key: behavioral.learning_feedback.understood_months_later
    competency_key: adaptability
    topic: Feedback you only understood months later
    difficulty: medium
    text: >-
      Tell me about feedback whose value you only understood months after you heard it. What made it click, and
      what did you do then?
    expected_concepts:
      - the original feedback and initial view
      - the later situation that made it clear
      - action taken once understood
      - how they treat feedback they don't yet understand
    rubric:
      excellent: Explains why it did not land at first, the situation that made it clear, the action taken, and how they now handle feedback they do not yet understand.
      good: Clear example with action once understood.
      weak: Cannot explain why it did not land, or still has not acted.
    followups:
      - Did you go back to the person who said it?
    common_errors:
      - No lesson about handling feedback they don't yet understand.

  - external_key: behavioral.learning_feedback.dependent_team_feedback
    competency_key: collaboration
    topic: Feedback from a team that depended on your work
    difficulty: medium
    text: >-
      Tell me about feedback from another team that depended on your work. What were they struggling with, and
      what did you change for them?
    expected_concepts:
      - the dependency and the problem they faced
      - understanding their needs directly
      - the change made
      - checking it helped
    rubric:
      excellent: Understands the other team's needs first-hand, makes a change that addresses the real problem and checks back that it helped.
      good: Made a reasonable change in response.
      weak: Treats the complaint as the other team's problem.
    followups:
      - How do you hear from them now?
    common_errors:
      - Fixing what they asked for without understanding the underlying need.

  - external_key: behavioral.learning_feedback.decision_pace_feedback
    competency_key: adaptability
    topic: Feedback on the pace of your decisions
    difficulty: medium
    text: >-
      Tell me about feedback that you were too slow or too hasty in making decisions. What did you change about
      how you decide?
    expected_concepts:
      - the feedback and examples behind it
      - understanding the cost of their pace
      - a changed decision method such as time-boxing or reversibility checks
      - a later decision made differently
    rubric:
      excellent: Understands the cost of their decision pace, adopts a concrete method such as matching effort to how reversible the decision is, and shows a later decision made differently.
      good: Adjusted their pace sensibly.
      weak: Overcorrected to the other extreme or made no change.
    followups:
      - How do you decide how much time a decision deserves?
    common_errors:
      - Swinging from too slow to too hasty.

  - external_key: behavioral.learning_feedback.share_view_earlier
    competency_key: communication
    topic: Feedback to share your view earlier in decisions
    difficulty: medium
    text: >-
      Tell me about feedback that your input was coming too late in discussions where it was needed. What did you
      do differently afterwards?
    expected_concepts:
      - the feedback and examples
      - what was holding back their input
      - specific changes such as preparing points or writing ahead
      - effect on decisions
    rubric:
      excellent: Identifies why their input came late, adopts specific techniques to contribute earlier and shows the effect on decisions.
      good: Made changes that got their input in earlier.
      weak: No concrete change or no evidence it helped.
    followups:
      - Which technique worked best for you?
    common_errors:
      - Describing the intention without a technique.

  - external_key: behavioral.learning_feedback.records_hard_to_use
    competency_key: communication
    topic: Feedback that your records were hard to use
    difficulty: medium
    text: >-
      Tell me about feedback that the way you documented or recorded your work made it hard for others to use.
      What did you change?
    expected_concepts:
      - what others struggled with
      - understanding how they actually used the records
      - specific changes to structure or content
      - checking that others could use it
    rubric:
      excellent: Learns how others actually used the records, restructures them around that use and checks with users that it now works.
      good: Improved the records in response.
      weak: Added more volume without addressing what was hard.
    followups:
      - How did you test that it was easier to use?
    common_errors:
      - Writing more instead of writing for the reader.

  - external_key: behavioral.learning_feedback.how_you_disagree
    competency_key: collaboration
    topic: Feedback on how you handle disagreement
    difficulty: medium
    text: >-
      Tell me about feedback on how you handle disagreements at work, for example that you pressed your view too
      hard or gave way too easily. What did you change?
    expected_concepts:
      - the feedback and a concrete example
      - its effect on decisions or colleagues
      - specific new behaviour
      - a later disagreement handled differently
    rubric:
      excellent: Understands how their behaviour affected decisions, adopts a specific new approach and describes a later disagreement handled differently with a better outcome.
      good: Adjusted their approach with some evidence.
      weak: Explains why their original approach was justified.
    followups:
      - What did you do in the next disagreement?
    common_errors:
      - Justifying the original behaviour.

  - external_key: behavioral.learning_feedback.users_of_your_process
    competency_key: adaptability
    topic: Feedback from people using a process or tool you created
    difficulty: medium
    text: >-
      Tell me about feedback from the people who used a process, template or tool you created for them. What did
      you change in response?
    expected_concepts:
      - what was created and why
      - how feedback was gathered
      - the main problems raised
      - changes made and adoption afterwards
    rubric:
      excellent: Actively gathers feedback from users, prioritises the main problems, changes the process or tool and shows improved adoption.
      good: Responded to feedback with useful changes.
      weak: Expects users to adapt to what was built.
    followups:
      - What feedback did you decide not to act on?
    common_errors:
      - Treating low adoption as a user problem.

  # ------------------------------------------------------------ hard
  - external_key: behavioral.learning_feedback.busy_not_impactful
    competency_key: ownership
    topic: Busy but not having enough impact
    difficulty: hard
    text: >-
      Tell me about feedback that you were busy but not having the impact you should. How did you work out where
      your effort was going wrong, and what did you change?
    expected_concepts:
      - the feedback and their initial view
      - analysing where time and effort went
      - identifying higher-impact work
      - stopping or delegating lower-value work
      - evidence of greater impact
    rubric:
      excellent: Analyses where their effort actually went, identifies higher-impact work, deliberately stops or hands off lower-value work and shows evidence of greater impact.
      good: Rebalanced their effort with some improvement.
      weak: Responded by working longer hours.
    followups:
      - What did you stop doing?
    common_errors:
      - Equating more hours with more impact.

  - external_key: behavioral.learning_feedback.built_feedback_culture
    competency_key: leadership
    topic: Making candid feedback normal on a team
    difficulty: hard
    text: >-
      Tell me about something you did to make it easier for people on your team to give each other candid
      feedback. What did you try, and what evidence showed it was working?
    expected_concepts:
      - the starting situation
      - specific practices introduced
      - modelling by asking for feedback themselves
      - evidence of change
      - adjustments when something didn't work
    rubric:
      excellent: Introduces specific practices, models them by inviting feedback on their own work, adjusts what did not work and cites concrete evidence of more candid feedback.
      good: Introduced practices with some evidence of change.
      weak: Announced that feedback was welcome with no specific practice or evidence.
    followups:
      - What did you try that didn't work?
    common_errors:
      - Measuring success by intentions rather than behaviour.

  - external_key: behavioral.learning_feedback.team_falling_short
    competency_key: leadership
    topic: Feedback that a team you led was falling short
    difficulty: hard
    text: >-
      Describe a time you were told that a team or project you were responsible for was falling short. How did you
      separate your own part from the team's, and what did you change?
    expected_concepts:
      - the feedback and its source
      - diagnosing causes across self, team and process
      - owning their own contribution
      - changes in leadership and in team practice
      - outcome
    rubric:
      excellent: Diagnoses causes across their own leadership, the team and process, owns their part openly, makes changes at each level and shows the result.
      good: Reasonable diagnosis and changes including their own part.
      weak: Attributes the shortfall to team members only.
    followups:
      - What did you tell the team about the feedback?
    common_errors:
      - Not examining their own contribution.

  - external_key: behavioral.learning_feedback.sustained_change_under_pressure
    competency_key: adaptability
    topic: Keeping a change going under pressure
    difficulty: hard
    text: >-
      Tell me about a change you made in response to feedback that took a long time to become natural. How did you
      keep it from slipping back when the pressure was on?
    expected_concepts:
      - the change and why it was hard
      - mechanisms to sustain it
      - a specific moment of pressure
      - recovering after slipping
      - evidence the change held
    rubric:
      excellent: Describes mechanisms that sustained the change, a specific high-pressure moment where it was tested, how they recovered from slips and evidence it eventually held.
      good: Sustained the change with some mechanism.
      weak: Claims the change was immediate and effortless, or it faded.
    followups:
      - When did you last slip, and what happened?
    common_errors:
      - Claiming no setbacks at all.

  - external_key: behavioral.learning_feedback.anonymous_or_secondhand
    competency_key: culture_values
    topic: Critical feedback without the details
    difficulty: hard
    text: >-
      Describe a concern about your performance that reached you anonymously or second-hand, so you couldn't ask
      the person behind it for specifics. How did you decide on a response?
    expected_concepts:
      - the feedback and why details were unavailable
      - not trying to identify the source
      - gathering other evidence
      - a proportionate response
      - checking whether the concern was addressed
    rubric:
      excellent: Respects the anonymity, gathers other evidence to test the concern, makes a proportionate change and finds a way to check whether it addressed the issue.
      good: Took it seriously and made a reasonable change.
      weak: Dismisses it because it was anonymous, or tries to find out who said it.
    followups:
      - How did you check whether the concern was resolved?
    common_errors:
      - Trying to identify the source.
