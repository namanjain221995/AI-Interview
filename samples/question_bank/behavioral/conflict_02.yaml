# Behavioural: conflict (part 2 of 4) - disagreeing with managers and decisions, disagree-and-commit.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, reasoning, outcome, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: collaboration
questions:
  # ------------------------------------------------------------ disagreeing upward (easy)
  - external_key: behavioral.conflict.lead_changed_your_work
    topic: Your lead changed your work without asking
    difficulty: easy
    text: >-
      Tell me about a time your manager or lead changed something in your work without discussing it with you first,
      and you didn't agree with the change. How did you raise it with them?
    expected_concepts:
      - understanding why the change was made
      - raising it privately and promptly
      - explaining the impact of the change on the work
      - agreeing how similar changes would be handled in future
      - outcome
    rubric:
      excellent: Asked why the change was made, explained the specific impact on the work, and agreed a better way of handling such changes going forward.
      good: Raised it directly and reached an understanding.
      weak: Reverted the change without discussion, or said nothing and let it fester.
    followups:
      - What was the reason for the change?
      - Did anything change in how you worked together afterwards?
    common_errors:
      - Focusing on being bypassed rather than on the work itself.

  - external_key: behavioral.conflict.priority_order_questioned
    topic: Questioning the order of priorities
    difficulty: easy
    text: >-
      Describe a time you thought the priorities you'd been given were in the wrong order. How did you raise it, and
      what happened to the plan?
    expected_concepts:
      - why they thought the order was wrong, in terms of impact
      - bringing information the decision maker may not have had
      - proposing a specific alternative
      - accepting the final call
      - outcome
    rubric:
      excellent: Makes an impact-based case with information the decision maker lacked, proposes a concrete alternative and explains how the final call was made and followed.
      good: Raised the concern with a reason and accepted the result.
      weak: Simply worked on what they preferred, or raised it with no reasoning.
    followups:
      - What information did you have that they didn't?
      - What would you do if the same thing happened next quarter?
    common_errors:
      - Arguing from personal preference rather than impact.

  - external_key: behavioral.conflict.new_lead_dropped_practice
    competency_key: adaptability
    topic: A new lead changing a practice you valued
    difficulty: easy
    text: >-
      Describe a time a new manager or lead changed or dropped a practice your team relied on, and you thought it was
      a mistake. What did you do?
    expected_concepts:
      - understanding the new lead's goals
      - explaining what the practice achieved, with examples
      - giving the new approach a fair trial
      - suggesting a way to keep the benefit
      - outcome
    rubric:
      excellent: Sought to understand the new lead's goals, explained the practice's value with concrete examples, gave the change a fair trial and proposed a way to keep the benefit.
      good: Shared the concern constructively and adapted.
      weak: Resisted the change outright, or kept doing the old practice regardless.
    followups:
      - What did the practice protect against?
      - How did the new approach work out?
    common_errors:
      - Assuming the old way was better because it was familiar.

  - external_key: behavioral.conflict.idea_turned_down_by_manager
    topic: An idea your manager turned down
    difficulty: easy
    text: >-
      Tell me about an idea you proposed that your manager or lead turned down, even though you still thought it was a
      good one. How did you respond, and what became of the idea?
    expected_concepts:
      - understanding the reasons for the no
      - asking what would change the answer
      - improving or reshaping the proposal
      - accepting the decision if it stood
      - what eventually happened to the idea
    rubric:
      excellent: Understood the specific reasons, asked what would change the answer, refined the idea or let it go deliberately, and explains what became of it.
      good: Accepted the decision and understood why it was made.
      weak: Pursued it anyway without approval, or dropped it without understanding why.
    followups:
      - Was the timing or the idea the problem?
      - Would you bring it back now?
    common_errors:
      - Taking the rejection as final without learning the reason.

  - external_key: behavioral.conflict.misunderstanding_not_disagreement
    competency_key: communication
    topic: A disagreement that was really a misunderstanding
    difficulty: easy
    text: >-
      Tell me about a time you thought you were disagreeing with someone, and it turned out you were talking about
      different things. How did you discover that, and what did you do afterwards?
    expected_concepts:
      - what each person actually meant
      - the question or summary that revealed it
      - restating positions to check understanding
      - agreeing shared definitions
      - habit they adopted afterwards
    rubric:
      excellent: Gives a specific example, explains what revealed the misunderstanding and describes a habit, such as restating positions, that they now use to catch it early.
      good: Clear example where clarifying resolved the disagreement.
      weak: Example is a real disagreement relabelled, or there is no reflection.
    followups:
      - How long did you argue before you noticed?
      - What do you do now to catch this early?
    common_errors:
      - Blaming the other person for being unclear.

  - external_key: behavioral.conflict.estimate_for_your_work_questioned
    topic: Disagreeing about how long your work would take
    difficulty: easy
    text: >-
      Describe a time someone, perhaps your manager or a lead, expected a piece of your work to take much less time
      than you thought it would. How did you work through the difference?
    expected_concepts:
      - breaking down the work to show where time goes
      - understanding why the shorter estimate was expected
      - finding what could be cut or simplified
      - agreeing a plan and keeping them updated
      - how accurate the final estimate was
    rubric:
      excellent: Breaks down the work transparently, understands the reason for the expectation, offers scope or approach options and tracks progress against what was agreed.
      good: Explained their estimate and reached an agreed plan.
      weak: Simply accepted the shorter time and missed it, or refused without offering options.
    followups:
      - Who turned out to be closer?
      - What did you cut, if anything?
    common_errors:
      - Defending the estimate without showing the breakdown.

  - external_key: behavioral.conflict.team_process_felt_wasteful
    topic: Disagreeing with a team process
    difficulty: easy
    text: >-
      Tell me about a team process or rule you disagreed with, for example a meeting, an approval step or a reporting
      requirement. What did you do about it?
    expected_concepts:
      - understanding why the process existed
      - following it while raising concerns
      - proposing a specific change
      - trying it out or measuring the effect
      - outcome
    rubric:
      excellent: Understood the purpose of the process, kept following it while proposing a concrete improvement, and describes how the change was tested and what resulted.
      good: Raised a reasonable concern and proposed an alternative.
      weak: Ignored the process or only complained about it.
    followups:
      - What was the process protecting against?
      - What would you have done if the answer was no?
    common_errors:
      - Skipping the process instead of trying to change it.

  - external_key: behavioral.conflict.finished_means_different_things
    topic: Disagreeing about when work is finished
    difficulty: easy
    text: >-
      Tell me about a time you and someone you worked with disagreed about whether a piece of work was actually
      finished. What did each of you expect, and how did you resolve it?
    expected_concepts:
      - the different expectations of done
      - where those expectations came from
      - agreeing what remained and who would do it
      - making the definition explicit for next time
      - outcome
    rubric:
      excellent: Explains both expectations and their sources, resolves what remained, and made the definition of finished explicit to prevent recurrence.
      good: Resolved the immediate disagreement sensibly.
      weak: Insisted their own definition was obviously right, or handed the work over unfinished.
    followups:
      - Who else was affected by the mismatch?
      - How do you agree what finished means now?
    common_errors:
      - Assuming a shared definition existed without checking.

  - external_key: behavioral.conflict.chose_to_let_it_go
    topic: Deciding a disagreement wasn't worth pursuing
    difficulty: easy
    text: >-
      Tell me about a time you disagreed with something at work but decided not to push it. How did you decide it
      wasn't worth pursuing, and do you still think that was right?
    expected_concepts:
      - how important the issue really was
      - cost of pursuing it compared with the benefit
      - whether the decision could be easily reversed later
      - stating the view once and moving on
      - reflection on the choice
    rubric:
      excellent: Explains a clear way of judging stakes and reversibility, mentions voicing the view once where appropriate and reflects on whether the choice held up.
      good: Gives a sensible reason for letting it go.
      weak: Let it go only to avoid discomfort, or never voiced a concern that later mattered.
    followups:
      - What kind of issue would you never let go?
      - Did it come back up later?
    common_errors:
      - Describing avoidance as a deliberate choice.

  # ------------------------------------------------------------ escalation and commitment (medium)
  - external_key: behavioral.conflict.manager_overrode_team_agreement
    topic: A manager overriding a team agreement
    difficulty: medium
    text: >-
      Tell me about a time the team had agreed on an approach and a manager or senior person overrode it. How did you
      respond, and how did the team move forward?
    expected_concepts:
      - understanding what the senior person knew or valued
      - asking for the reasoning rather than resisting
      - sharing context the team had that they might have lacked
      - helping the team accept the change
      - outcome
    rubric:
      excellent: Sought the reasoning, shared relevant context the team had, accepted the final call and helped the team move on productively.
      good: Responded constructively and adapted.
      weak: Encouraged the team to resist, or accepted without sharing important context.
    followups:
      - Was there information the team didn't have?
      - How did the team approach later decisions after that?
    common_errors:
      - Treating the override as a personal slight.

  - external_key: behavioral.conflict.resolved_without_escalating
    topic: Resolving a dispute without escalating
    difficulty: medium
    text: >-
      Describe a disagreement that could easily have ended up with a manager, but you and the other person resolved
      it yourselves. What made that possible?
    expected_concepts:
      - recognising escalation was an option but not the best one
      - finding the shared goal
      - creative options that met both needs
      - documenting the agreement
      - how the outcome held
    rubric:
      excellent: Explains why direct resolution was better, how they found common ground and a creative option, and how they made the agreement durable.
      good: Resolved the disagreement directly with a reasonable outcome.
      weak: Resolution came from one side simply giving in, or the example lacked real disagreement.
    followups:
      - What would have made you escalate after all?
      - What did each of you give up?
    common_errors:
      - Hiding a real risk from a manager to avoid escalation.

  - external_key: behavioral.conflict.commit_with_review_trigger
    topic: Agreeing when a decision would be revisited
    difficulty: medium
    text: >-
      Tell me about a time you committed to a decision you disagreed with but agreed in advance on what would make the
      team look at it again. How did you set that up, and did it ever get used?
    expected_concepts:
      - committing fully to the decision
      - agreeing specific signals or a review date
      - tracking those signals objectively in both directions
      - raising it again only when the trigger was met
      - outcome
    rubric:
      excellent: Describes concrete, agreed signals or a review point, shows they committed fully in the meantime and followed the agreement whichever way the signals went.
      good: Committed and had a reasonable way to revisit.
      weak: Used the review trigger as a way to keep arguing, or never set one up.
    followups:
      - Who tracked those signals?
      - What happened when the review came round?
    common_errors:
      - Setting vague triggers that let them reopen the debate at will.

  - external_key: behavioral.conflict.direction_reversed_midway
    competency_key: adaptability
    topic: A change in direction you disagreed with
    difficulty: medium
    text: >-
      Describe a time your manager or leadership changed direction partway through a piece of work, and you thought the
      original plan was better. How did you respond, and what did you do with the work already done?
    expected_concepts:
      - understanding the reason for the change
      - making the case once with the cost of switching
      - adapting the plan and salvaging useful work
      - helping the team move on
      - outcome and reflection
    rubric:
      excellent: Sought to understand the reason, stated the switching cost clearly once, then adapted quickly, salvaged what was useful and helped others move on.
      good: Raised concerns and adapted to the new direction.
      weak: Resisted for a long time, or switched without raising the real costs.
    followups:
      - What did the change cost the team?
      - In hindsight, was the change right?
    common_errors:
      - Continuing to work on the old plan.

  - external_key: behavioral.conflict.cut_you_thought_mattered
    topic: Disagreeing with a scope cut
    difficulty: medium
    text: >-
      Tell me about a time something you believed was important was cut from the plan. How did you argue for it, and
      what did you do once the decision was final?
    expected_concepts:
      - impact-based case for keeping it
      - suggesting cheaper alternatives or partial versions
      - accepting the final decision
      - recording the risk or follow-up
      - what happened later
    rubric:
      excellent: Argued on impact, offered cheaper options, accepted the decision and made sure the trade-off and any risk were recorded, then describes what happened.
      good: Made a reasonable case and accepted the outcome.
      weak: Built it anyway against the decision, or did not make any case.
    followups:
      - Did it come back onto the plan later?
      - What smaller version did you suggest?
    common_errors:
      - Quietly building the cut work in spare time against the decision.

  - external_key: behavioral.conflict.private_or_group_challenge
    competency_key: communication
    topic: Choosing where to raise a disagreement
    difficulty: medium
    text: >-
      Tell me about a time you had to choose between raising a disagreement in front of the group or privately with
      one person first. What did you choose, and why?
    expected_concepts:
      - stakes and timing of the decision
      - who needed to hear the concern
      - avoiding surprising or embarrassing someone in public
      - not hiding information the group needed
      - outcome and reflection
    rubric:
      excellent: Explains a clear rationale weighing the group's need to know against giving the person a chance to respond first, and reflects on whether the choice was right.
      good: Made a sensible choice and can explain it.
      weak: No reasoning about the choice, or chose in a way that hid important information from the group.
    followups:
      - When would you make the opposite choice?
      - How did the person respond?
    common_errors:
      - Raising concerns only in private when the group was about to act on a flawed decision.

  - external_key: behavioral.conflict.instructed_method_seemed_risky
    competency_key: ownership
    topic: Being asked to do something in a way you thought was risky
    difficulty: medium
    text: >-
      Tell me about a time you were asked to do a task in a specific way that you thought carried a real risk. How did
      you handle it with the person who asked?
    expected_concepts:
      - specific risk and its likely impact
      - raising it before doing the work
      - proposing a safer alternative or safeguards
      - how the decision was made and recorded
      - outcome
    rubric:
      excellent: Raised a specific risk early with likely impact, proposed safer options or safeguards, made sure the decision was explicit and describes the outcome.
      good: Raised the risk and reached a reasonable agreement.
      weak: Did it anyway without saying anything, or refused without offering alternatives.
    followups:
      - What would you have done if they insisted?
      - Was the risk written down anywhere?
    common_errors:
      - Raising the risk only after something went wrong.

  - external_key: behavioral.conflict.organisation_direction_disagreed
    topic: Disagreeing with a wider organisational decision
    difficulty: medium
    text: >-
      Describe a time a decision made well above your level, such as a reorganisation, a tool mandate or a change in
      strategy, affected your work and you disagreed with it. What did you do?
    expected_concepts:
      - understanding the reasoning behind the decision
      - giving feedback through the available channels
      - focusing on what they could influence
      - helping make it work in their area
      - reflection on the outcome
    rubric:
      excellent: Sought the reasoning, gave specific feedback through proper channels, focused on what they could influence and helped implement it well in their area.
      good: Gave feedback and adapted constructively.
      weak: Only complained, or resisted the change in their own area.
    followups:
      - Did your feedback reach anyone?
      - What did you do to make it work locally?
    common_errors:
      - Treating a decision they couldn't change as a reason to disengage.

  - external_key: behavioral.conflict.carrying_team_objection_upward
    competency_key: communication
    topic: Taking the team's disagreement to a manager
    difficulty: medium
    text: >-
      Tell me about a time your team broadly disagreed with something your manager wanted, and you were the one who
      raised it. How did you present the team's view?
    expected_concepts:
      - gathering the team's actual concerns, not just their own
      - presenting it as information, not a confrontation
      - offering alternatives
      - reporting back to the team accurately
      - outcome
    rubric:
      excellent: Gathered and fairly represented the team's concerns, framed them constructively with alternatives and accurately reported the outcome back to the team.
      good: Raised the team's view clearly and closed the loop.
      weak: Presented only their own view as the team's, or framed it as the team against the manager.
    followups:
      - Did everyone on the team share the concern?
      - How did you report the outcome back?
    common_errors:
      - Overstating how united the team was.

  - external_key: behavioral.conflict.decision_needed_within_hours
    topic: Disagreeing when a decision is urgent
    difficulty: medium
    text: >-
      Tell me about a time you disagreed with a decision that had to be made within hours, with no time for a long
      discussion. How did you get your view across, and what happened?
    expected_concepts:
      - stating the concern briefly and precisely
      - focusing on the most important risk
      - deferring to whoever owned the call
      - acting on the decision immediately
      - revisiting afterwards in a review
    rubric:
      excellent: Made a brief, precise case about the most important risk, deferred to the decision owner, acted on it immediately and raised it in a later review if relevant.
      good: Voiced the concern quickly and then acted on the decision.
      weak: Delayed the decision with long debate, or didn't raise an important concern.
    followups:
      - How did you keep your point short?
      - Was it discussed again afterwards?
    common_errors:
      - Trying to win the full argument under time pressure.

  - external_key: behavioral.conflict.settled_decision_kept_reopened
    topic: A settled decision that kept being reopened
    difficulty: medium
    text: >-
      Describe a time a decision your team had already made kept getting reopened in later discussions. What did you
      do to help the team move forward?
    expected_concepts:
      - recording the decision and its reasoning
      - distinguishing new information from repeated arguments
      - agreeing when it would be revisited
      - talking with the people reopening it
      - effect on team progress
    rubric:
      excellent: Helped record the decision and reasoning, separated genuinely new information from repeated arguments, set a revisit point and addressed it directly with those reopening it.
      good: Helped the team stick to the decision.
      weak: Joined in reopening it, or shut down discussion even when new information appeared.
    followups:
      - What would count as new information?
      - Was anyone reopening it for a good reason?
    common_errors:
      - Refusing to revisit even with new evidence.

  # ------------------------------------------------------------ harder commitment cases (hard)
  - external_key: behavioral.conflict.new_facts_after_commitment
    topic: Reopening a decision when new facts appear
    difficulty: hard
    text: >-
      Tell me about a time you had accepted a decision you disagreed with, and then new information came up that
      seemed to support your original view. How did you bring it back without it looking like you were just
      reopening the old argument?
    expected_concepts:
      - separating genuinely new information from old arguments
      - checking the information before raising it
      - bringing it to the decision owner promptly
      - framing it around the goal rather than being right
      - outcome of the revisit
    rubric:
      excellent: Clearly separates new facts from the earlier debate, verifies them, brings them promptly to the decision owner framed around the shared goal and accepts the result of the revisit.
      good: Raised the new information appropriately.
      weak: Used it to relitigate the whole decision, or sat on it.
    followups:
      - How did you check the new information was solid?
      - What did the decision owner do with it?
    common_errors:
      - Presenting old arguments as if they were new.

  - external_key: behavioral.conflict.could_not_commit_in_conscience
    competency_key: ownership
    topic: A decision you couldn't simply commit to
    difficulty: hard
    text: >-
      Tell me about a time you were asked to go ahead with something you believed carried an unacceptable risk, for
      example to users, data, security or compliance. How did you handle it?
    expected_concepts:
      - clear statement of the specific risk and who it affected
      - distinguishing a real red line from a preference
      - escalating appropriately with documentation
      - proposing ways to reduce the risk
      - outcome and what they would do again
    rubric:
      excellent: Distinguishes a genuine red line from a preference, states the risk clearly, escalates through proper channels with documentation, offers mitigations and reflects on the outcome.
      good: Raised the risk firmly and pursued it appropriately.
      weak: Went along silently, or treated a normal disagreement as a red line.
    followups:
      - How did you know this was different from an ordinary disagreement?
      - What would you have done if escalation hadn't worked?
    common_errors:
      - Treating every disagreement as a matter of principle.

  - external_key: behavioral.conflict.no_data_could_settle_it
    topic: A disagreement no data could resolve
    difficulty: hard
    text: >-
      Describe a disagreement that came down to judgement, where no amount of data or testing could prove either side
      right in time. How was it resolved, and what was your part?
    expected_concepts:
      - recognising the decision rested on judgement
      - making assumptions and values explicit
      - considering reversibility and cost of being wrong
      - agreeing who decides
      - committing and reviewing later
    rubric:
      excellent: Recognised it was a judgement call, made the underlying assumptions and stakes explicit, used reversibility and cost of being wrong to frame it, and helped get a clear owner to decide.
      good: Helped reach a reasonable decision despite uncertainty.
      weak: Kept looking for data that couldn't exist, or the decision was made by whoever pushed hardest.
    followups:
      - What assumptions were you and the others making differently?
      - How would you have known later who was right?
    common_errors:
      - Treating the decision as purely technical when it was about priorities.

  - external_key: behavioral.conflict.only_dissenting_voice
    topic: Being the only one who disagreed
    difficulty: hard
    text: >-
      Tell me about a time you were the only person in the room who disagreed with where the group was heading. How
      did you decide whether and how to speak up, and what happened?
    expected_concepts:
      - checking whether they were missing something
      - stating the concern clearly with reasoning
      - suggesting a way to test the concern
      - accepting the group decision or escalating if it was serious
      - outcome and reflection
    rubric:
      excellent: Checked their own reasoning, spoke up clearly with a specific concern and a way to test it, and responded sensibly to the group's decision, reflecting on the outcome.
      good: Voiced the dissent constructively.
      weak: Stayed quiet, or persisted long after a fair decision without new information.
    followups:
      - How did you check you weren't simply wrong?
      - What did the group do with your concern?
    common_errors:
      - Equating being alone with being right.

  - external_key: behavioral.conflict.leading_work_you_argued_against
    competency_key: leadership
    topic: Leading others on a decision you opposed
    difficulty: hard
    text: >-
      Tell me about a time you had to lead other people in carrying out a decision you had argued against. How did you
      get them committed when you'd had doubts yourself?
    expected_concepts:
      - fully accepting the decision first
      - explaining the reasoning in its strongest form
      - being open that there were trade-offs without undermining it
      - setting the team up to succeed
      - result and reflection
    rubric:
      excellent: Committed first themselves, explained the decision in its strongest form, was open about trade-offs without undermining it, and led the team to a strong result.
      good: Led the work well despite their earlier disagreement.
      weak: Passed on their own doubts to the team, or led half-heartedly.
    followups:
      - Did your team know you had argued against it?
      - What did you say when someone on the team objected?
    common_errors:
      - Signalling to the team that they didn't believe in the decision.
