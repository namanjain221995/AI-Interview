# Behavioural: customer focus (part 1 of 4) - understanding users and the need behind a request.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ learning about users (easy)
  - external_key: behavioral.customer_focus.learning_who_users_are
    competency_key: culture_values
    topic: Learning who the users of your work are
    difficulty: easy
    text: >-
      Think about something you worked on recently. Who actually used it, and how did you go about learning
      what their day looked like and what they needed from it?
    expected_concepts:
      - a specific user group named, not just "the customer"
      - concrete sources used (conversations, tickets, analytics, observation)
      - something learned that wasn't obvious at first
      - how that understanding shaped their work
    rubric:
      excellent: Names a specific group of users, describes deliberate steps to learn about their work, and gives a concrete example of a decision that changed because of what they learned.
      good: Identifies the users and at least one real source of insight that informed the work.
      weak: Describes users only in generic terms and cannot point to anything they did to understand them.
    followups:
      - What surprised you most about how they used it?
      - What would you do differently to learn about them faster next time?
    common_errors:
      - Treating the person who wrote the ticket as the only user.

  - external_key: behavioral.customer_focus.watching_someone_use_it
    competency_key: culture_values
    topic: Watching a real user work with your product
    difficulty: easy
    text: >-
      Tell me about a time you watched someone use something you had built or supported, whether in person,
      on a call or in a recording. What did you notice, and what did you do with it?
    expected_concepts:
      - context of the observation
      - specific behaviour or struggle noticed
      - gap between intended and actual use
      - follow-up action or change made
    rubric:
      excellent: Describes a specific observation, explains what it revealed about the gap between design and real use, and shows a change they drove as a result.
      good: Gives a real observation and a reasonable follow-up.
      weak: Has never looked at real usage or describes the session without any resulting action.
    followups:
      - How did you share what you saw with the rest of the team?
      - Did the change actually help, and how do you know?
    common_errors:
      - Blaming the user for "using it wrong" instead of examining the design.

  - external_key: behavioral.customer_focus.time_with_support
    competency_key: culture_values
    topic: Learning from the support queue
    difficulty: easy
    text: >-
      Have you ever spent time reading support tickets or sitting with a support or operations team? Walk me
      through what you learned and how it changed what you worked on.
    expected_concepts:
      - how they got exposure to support data
      - recurring themes or pain points found
      - a prioritised change that came out of it
      - follow-through on the impact
    rubric:
      excellent: Describes deliberate time with support, identifies a recurring pain point with rough volume, and shows a change they made or pushed for that reduced it.
      good: Real exposure to support work with at least one useful takeaway acted on.
      weak: Only heard about support issues second-hand and took no action.
    followups:
      - How did you decide which issue was worth fixing first?
      - Did ticket volume change afterwards?
    common_errors:
      - Fixing one loud ticket instead of looking for patterns.

  - external_key: behavioral.customer_focus.question_before_building
    competency_key: culture_values
    topic: Asking why before building
    difficulty: easy
    text: >-
      Tell me about a request you received where you stopped to ask what problem the person was really trying
      to solve before you started. What did you find out?
    expected_concepts:
      - the original request as stated
      - questions asked to uncover the underlying goal
      - difference between the request and the real need
      - what was built instead or in addition
      - outcome for the requester
    rubric:
      excellent: Contrasts the literal request with the underlying need, explains the questions that surfaced it, and shows a simpler or better solution delivered as a result.
      good: Gives a real example where clarifying the goal improved the result.
      weak: Built exactly what was asked without questions, or the example shows no difference between request and need.
    followups:
      - How did the requester react when you questioned the request?
      - When is it right to just build what was asked?
    common_errors:
      - Presenting a long interrogation as good practice without regard for the requester's time.

  - external_key: behavioral.customer_focus.small_annoyance_fixed
    competency_key: culture_values
    topic: Fixing a small annoyance for users
    difficulty: easy
    text: >-
      Describe a small, unglamorous fix you made because it was making life harder for users, even though
      nobody had made it a priority. Why did you think it was worth doing?
    expected_concepts:
      - the specific annoyance and who it affected
      - how they noticed it
      - effort versus benefit judgement
      - how they fitted it alongside planned work
      - evidence it helped
    rubric:
      excellent: Describes a concrete paper cut, explains how often it hurt users, weighs the effort against planned work transparently, and shows evidence the fix mattered.
      good: Real example of a small user-facing improvement with a sensible reason.
      weak: Cannot name a specific case or describes polishing something nobody used.
    followups:
      - Did you tell anyone before you did it?
      - How do you stop small fixes from crowding out planned work?
    common_errors:
      - Skipping agreed priorities without telling the team.

  - external_key: behavioral.customer_focus.user_feedback_changed_mind
    competency_key: culture_values
    topic: User feedback that changed your mind
    difficulty: easy
    text: >-
      Tell me about a time a user's feedback made you change your mind about something you had designed or
      decided. What had you believed, and what convinced you otherwise?
    expected_concepts:
      - their original position and reasoning
      - the feedback received and its source
      - how they checked it was representative
      - the change made
      - what they learned about their assumptions
    rubric:
      excellent: States the original assumption clearly, explains how the feedback was validated beyond a single voice, and describes the change and the lesson about their own blind spot.
      good: Clear example of changing course based on user input.
      weak: Example where they never actually changed anything, or the feedback was simply a bug report.
    followups:
      - How did you know the feedback wasn't just one person's preference?
      - How do you check your assumptions about users now?
    common_errors:
      - Choosing an example where the user was simply reporting a defect.

  - external_key: behavioral.customer_focus.internal_team_as_customer
    competency_key: culture_values
    topic: Treating another team as your customer
    difficulty: easy
    text: >-
      Tell me about a time the people relying on your work were colleagues in another team rather than
      external customers. How did you find out what they needed and how well you were serving them?
    expected_concepts:
      - who the internal users were and what they depended on
      - how needs were gathered (interviews, surveys, office hours)
      - a gap discovered in service or usability
      - improvement made and how it was measured
    rubric:
      excellent: Treats the internal team as real users, describes a deliberate way of gathering their needs, and shows a measurable improvement in their experience.
      good: Gives a clear example of improving something for an internal team based on their input.
      weak: Treats internal users as obliged to adapt and shows no effort to understand them.
    followups:
      - What did they complain about that you hadn't expected?
      - How did you know when you'd got it right?
    common_errors:
      - Assuming internal users have no alternative and so their experience doesn't matter.

  - external_key: behavioral.customer_focus.error_message_rewrite
    competency_key: culture_values
    topic: Improving what users see when something fails
    difficulty: easy
    text: >-
      Give me an example of improving what a user sees when something goes wrong, such as an error message,
      an empty screen or a failed request. What was wrong with it before, and how did you decide what to
      change?
    expected_concepts:
      - the original failure experience
      - how they learned it was confusing (tickets, observation)
      - what the user needed to know or do next
      - the change made
      - effect on support load or user success
    rubric:
      excellent: Explains why the original experience left users stuck, designs the new one around the user's next step, and shows evidence it reduced confusion or contacts.
      good: Real example of a clearer failure experience with sensible reasoning.
      weak: Only reworded text without considering what the user needed to do next.
    followups:
      - Who did you check the new wording with?
      - How did you balance helpful detail against exposing internal information?
    common_errors:
      - Exposing internal details or stack traces in the name of helpfulness.

  - external_key: behavioral.customer_focus.first_time_user_journey
    competency_key: culture_values
    topic: The first experience of a new user
    difficulty: easy
    text: >-
      Tell me about a time you looked closely at what a brand new user goes through the first time they try
      something you worked on. What did you find, and what did you change?
    expected_concepts:
      - how they walked through or measured the first experience
      - specific friction points or drop-off
      - prioritisation of which friction to remove
      - change made and result
    rubric:
      excellent: Describes a deliberate walkthrough or data review of the first-run experience, identifies specific friction with evidence, and shows a change that improved completion or reduced confusion.
      good: Identifies real friction for new users and a sensible improvement.
      weak: Assumes the experience is fine because experienced users have no complaints.
    followups:
      - How did you see it with fresh eyes when you already knew the product?
      - Which friction did you decide to leave, and why?
    common_errors:
      - Testing the first-run experience only with people who already know the product.

  # ------------------------------------------------------------ the need behind the request (medium)
  - external_key: behavioral.customer_focus.feature_request_real_problem
    competency_key: product_sense
    topic: A feature request hiding a different problem
    difficulty: medium
    text: >-
      Tell me about a time a customer asked for a specific feature, and it turned out the problem underneath
      was something different. How did you uncover that, and what did you end up delivering?
    expected_concepts:
      - the requested feature and who asked
      - how they explored the underlying workflow or goal
      - the real problem identified
      - how they brought the customer along to a different solution
      - outcome compared with what was asked
    rubric:
      excellent: Shows a structured exploration of the customer's workflow, a clearly different root problem, a solution the customer agreed solved it, and evidence it worked better than the original ask.
      good: Real example of finding the underlying need and delivering something useful.
      weak: Either built the request as stated or overrode the customer without exploring their needs.
    followups:
      - How did you explain to the customer that you weren't building exactly what they asked for?
      - What would have happened if you had built the original request?
    common_errors:
      - Dismissing the customer's request as wrong without understanding their context.

  - external_key: behavioral.customer_focus.conflicting_user_groups
    competency_key: product_sense
    topic: Two groups of users wanting opposite things
    difficulty: medium
    text: >-
      Describe a situation where two different groups of users wanted opposite things from the same piece of
      work. How did you understand each side, and how did you decide what to do?
    expected_concepts:
      - the two groups and what each needed
      - evidence gathered about size and impact of each need
      - options considered, including ones that served both
      - decision criteria and who was involved
      - how the outcome was communicated to the group that lost out
    rubric:
      excellent: Describes both groups' needs in their own terms, weighs them with evidence, looks for an option that serves both, and explains the decision clearly to the group that didn't get its way.
      good: Explains the conflict and a reasoned decision with some evidence.
      weak: Picks the loudest group or the one closest to them without weighing impact.
    followups:
      - How did the group that didn't get its preference respond?
      - Looking back, was the decision right?
    common_errors:
      - Splitting the difference so that neither group's need is properly met.

  - external_key: behavioral.customer_focus.data_contradicts_anecdote
    competency_key: product_sense
    topic: When usage data and user stories disagree
    difficulty: medium
    text: >-
      Tell me about a time what customers told you didn't match what the usage data showed. How did you work
      out what was really going on?
    expected_concepts:
      - the anecdote and the data point that conflicted
      - hypotheses for the discrepancy
      - additional investigation (instrumentation, interviews, segmenting)
      - the resolution and what each source was missing
      - decision made as a result
    rubric:
      excellent: Treats both sources as partial evidence, investigates with specific steps, explains what each was missing, and makes a decision grounded in the reconciled picture.
      good: Notices the conflict and investigates before deciding.
      weak: Simply trusts one source and ignores the other.
    followups:
      - Was the data measuring what you thought it was?
      - How did you explain the conclusion to whoever had raised the anecdote?
    common_errors:
      - Assuming data is always right and user reports are always noise.

  - external_key: behavioral.customer_focus.unspoken_needs
    competency_key: culture_values
    topic: A need users never mentioned
    difficulty: medium
    text: >-
      Tell me about a user need you uncovered that nobody had ever explicitly asked for. How did you spot it,
      and how did you convince others it was real?
    expected_concepts:
      - signal that hinted at the need (workarounds, spreadsheets, repeated steps)
      - how they validated it with users
      - the case made to the team or stakeholders
      - what was built and how it was received
    rubric:
      excellent: Spots the need from concrete evidence such as workarounds, validates it directly with users, builds a persuasive case and shows adoption once delivered.
      good: Identifies a real unstated need and gets it addressed.
      weak: Describes a personal idea with no evidence that users needed it.
    followups:
      - What workaround were users relying on before?
      - How did you size the opportunity?
    common_errors:
      - Confusing their own preference with an unmet user need.

  - external_key: behavioral.customer_focus.customer_workaround
    competency_key: culture_values
    topic: Discovering a customer's workaround
    difficulty: medium
    text: >-
      Have you ever discovered that customers were working around something you built in a way you never
      intended? Tell me what they were doing and how you responded.
    expected_concepts:
      - the workaround and how it was found
      - what it revealed about unmet needs
      - risks of the workaround (data quality, breakage)
      - decision to support, replace or discourage it
      - communication with affected customers
    rubric:
      excellent: Reads the workaround as evidence of an unmet need, considers the risks of breaking it, and chooses and communicates a path that serves those customers better.
      good: Responds sensibly to the workaround with some thought for the customers using it.
      weak: Simply blocks the workaround or ignores it.
    followups:
      - Did any later change of yours break their workaround?
      - How many customers relied on it?
    common_errors:
      - Removing an unintended usage without asking why customers depended on it.

  - external_key: behavioral.customer_focus.prototype_with_users
    competency_key: product_sense
    topic: Testing an early version with users
    difficulty: medium
    text: >-
      Walk me through a time you put an early or rough version of something in front of real users before
      it was finished. What did you want to learn, and what did you change because of it?
    expected_concepts:
      - what question the early version was meant to answer
      - how users were chosen
      - what was learned
      - changes made before full investment
      - cost saved or risk reduced
    rubric:
      excellent: States a clear learning goal, chooses representative users, and shows concrete changes made before full build that saved effort or avoided a wrong direction.
      good: Real example of early user testing that led to changes.
      weak: Showed users a nearly finished version with no room to change it.
    followups:
      - Were the users you tested with representative?
      - What feedback did you decide not to act on?
    common_errors:
      - Testing only with friendly internal colleagues and calling it user validation.

  - external_key: behavioral.customer_focus.measuring_user_benefit
    competency_key: product_sense
    topic: Proving a change helped users
    difficulty: medium
    text: >-
      Tell me about a change you shipped that was meant to make things better for users. How did you find
      out whether it actually did?
    expected_concepts:
      - the intended user benefit stated up front
      - metric or signal chosen and why
      - baseline and comparison
      - result, including if it didn't help
      - next step based on the result
    rubric:
      excellent: Defines the user outcome before shipping, chooses a fitting measure with a baseline, reports the result candidly including partial success, and acts on it.
      good: Measures the outcome in some reasonable way and reports the result.
      weak: Considers shipping itself the success, with no check of user impact.
    followups:
      - What would you have done if the number hadn't moved?
      - Was there anything the metric couldn't capture?
    common_errors:
      - Measuring activity (deploys, tickets closed) instead of user outcomes.

  - external_key: behavioral.customer_focus.edge_case_users
    competency_key: culture_values
    topic: Standing up for a small group of users
    difficulty: medium
    text: >-
      Tell me about a time a small group of users had a need that was easy to dismiss as an edge case. How
      did you decide whether it deserved attention, and what did you do?
    expected_concepts:
      - who the small group was and the impact on them
      - severity versus frequency reasoning
      - cost of addressing it
      - case made to the team
      - outcome for those users
    rubric:
      excellent: Weighs severity for the affected users alongside their number, makes a reasoned case to the team, and delivers a proportionate solution or a clear explanation of why not.
      good: Takes the minority need seriously and reaches a reasoned decision.
      weak: Dismisses the group because of its size without considering impact.
    followups:
      - What would have happened to those users if nothing was done?
      - How did you keep the cost proportionate?
    common_errors:
      - Judging importance by user count alone.

  - external_key: behavioral.customer_focus.spreading_user_insight
    competency_key: culture_values
    topic: Bringing user insight to the whole team
    difficulty: medium
    text: >-
      Describe something you did to help your team understand users better, beyond just your own learning.
      What did you try, and what difference did it make to how the team worked?
    expected_concepts:
      - the gap in team understanding
      - specific practice introduced (call rotations, ticket reviews, sharing recordings)
      - how they got colleagues to take part
      - observable change in team decisions
    rubric:
      excellent: Introduces a concrete, repeatable practice, gets real participation, and points to decisions that changed because the team understood users better.
      good: Takes a real step to share user insight with the team.
      weak: Shared a single slide or message with no lasting effect.
    followups:
      - Did the practice survive after you stopped pushing it?
      - Who was hardest to bring along, and why?
    common_errors:
      - A one-off presentation described as a lasting change.

  - external_key: behavioral.customer_focus.assumption_proved_wrong
    competency_key: culture_values
    topic: An assumption about users that proved wrong
    difficulty: medium
    text: >-
      Tell me about an assumption you or your team made about users that turned out to be wrong after
      launch. How did you discover it, and how did you recover?
    expected_concepts:
      - the assumption and where it came from
      - signal that revealed the mistake
      - speed and nature of the response
      - impact on users and how it was limited
      - change to how assumptions are tested
    rubric:
      excellent: Owns the wrong assumption, responds quickly to limit user impact, and describes a change in practice that tests similar assumptions earlier.
      good: Recognises the mistaken assumption and corrects course.
      weak: Blames users for not behaving as expected.
    followups:
      - What would have revealed it before launch?
      - How did you tell affected users?
    common_errors:
      - Describing users as "wrong" rather than the assumption.

  - external_key: behavioral.customer_focus.support_escalation_root_cause
    competency_key: technical_support
    topic: Turning a support escalation into a lasting fix
    difficulty: medium
    text: >-
      Tell me about a customer issue that came to you through support or an escalation. How did you resolve
      it for that customer, and what did you do so others wouldn't hit the same problem?
    expected_concepts:
      - immediate resolution for the affected customer
      - root-cause investigation
      - check for other affected customers
      - permanent fix or prevention
      - closing the loop with support and the customer
    rubric:
      excellent: Unblocks the customer quickly, finds the root cause, proactively checks for others affected, and delivers a lasting fix while keeping support informed.
      good: Resolves the customer's issue and addresses the cause.
      weak: Only fixes the single case with no thought for others or the cause.
    followups:
      - How did you find other customers affected?
      - What did you tell the support team when it was done?
    common_errors:
      - Treating the ticket as closed once the one customer is unblocked.

  # ------------------------------------------------------------ the need behind the request (hard)
  - external_key: behavioral.customer_focus.stated_vs_actual_success
    competency_key: product_sense
    topic: Redefining success around user outcomes
    difficulty: hard
    text: >-
      Tell me about a time you realised the way your team or organisation measured success wasn't the same as
      what actually mattered to users. What did you do about it, and how far did you get?
    expected_concepts:
      - the existing metric and why it diverged from user value
      - evidence of the divergence
      - proposed alternative measure
      - how they influenced leaders or peers
      - result, including partial adoption
    rubric:
      excellent: Demonstrates with evidence how the metric drifted from user value, proposes a practical alternative, influences decision-makers and describes the actual change in behaviour that followed.
      good: Identifies the misalignment and makes a credible attempt to change it.
      weak: Complains about the metric without evidence or action.
    followups:
      - Who benefited from the old metric, and how did you handle that?
      - What would you do if the new measure could also be gamed?
    common_errors:
      - Proposing a metric that is impossible to measure in practice.

  - external_key: behavioral.customer_focus.research_vs_conviction
    competency_key: product_sense
    topic: When users said they wanted something they wouldn't use
    difficulty: hard
    text: >-
      Have you ever built something because users said they wanted it, only to find they didn't use it?
      What went wrong in how you understood them, and what did you change in your approach?
    expected_concepts:
      - what users said and how it was gathered
      - gap between stated preference and behaviour
      - how the low usage was discovered
      - what was done with the feature
      - changes to research or validation methods
    rubric:
      excellent: Analyses why stated preference diverged from behaviour, describes what happened to the feature, and explains specific methodology changes that test behaviour rather than opinion.
      good: Acknowledges the miss and describes a sensible lesson.
      weak: Concludes that users can't be trusted, or cannot describe a lesson.
    followups:
      - How do you test demand before building now?
      - Was there anything salvageable from the work?
    common_errors:
      - Concluding that talking to users is pointless.

  - external_key: behavioral.customer_focus.customer_council_influence
    competency_key: stakeholder_management
    topic: Building a lasting channel for customer input
    difficulty: hard
    text: >-
      Tell me about a time you set up or reshaped a regular way for customer input to reach the people
      making decisions, such as an advisory group, a feedback review or a research program. How did you make
      sure it actually influenced decisions?
    expected_concepts:
      - the problem with how input reached decisions before
      - design of the new channel and who took part
      - how input was synthesised rather than dumped
      - examples of decisions it changed
      - how they kept it representative of the wider user base
    rubric:
      excellent: Designs a channel that synthesises input into decisions, shows specific roadmap or design changes it drove, and addresses bias towards the loudest or largest customers.
      good: Creates a working feedback channel with some influence on decisions.
      weak: Created a feedback inbox nobody acted on.
    followups:
      - How did you stop the largest customers dominating?
      - What did you stop doing because of it?
    common_errors:
      - Equating volume of feedback collected with influence on decisions.

  - external_key: behavioral.customer_focus.sunsetting_loved_workflow
    competency_key: culture_values
    topic: Replacing a workflow some users relied on
    difficulty: hard
    text: >-
      Describe a time you had to replace or retire something that a group of users depended on, because
      keeping it was no longer sustainable. How did you balance their needs against the reasons for the
      change?
    expected_concepts:
      - why the change was necessary
      - who depended on it and how
      - migration path or alternative provided
      - communication timeline and notice
      - handling users with blocking needs
      - outcome and adoption
    rubric:
      excellent: Justifies the change clearly, understands each dependent group's use, provides a realistic migration path with adequate notice, and handles hard cases individually while still delivering the change.
      good: Delivers the change with reasonable notice and an alternative for most users.
      weak: Removes it with minimal notice and leaves users to fend for themselves.
    followups:
      - Which users did you make exceptions for, and why?
      - What would you do differently in the communication?
    common_errors:
      - Announcing the change without understanding how users depended on it.

  - external_key: behavioral.customer_focus.whole_journey_ownership
    competency_key: ownership
    topic: Fixing a problem that spanned several teams' parts of the journey
    difficulty: hard
    text: >-
      Tell me about a time users were having a poor experience that no single team owned, because the problem
      sat across several teams' pieces of the journey. How did you get it fixed?
    expected_concepts:
      - the end-to-end journey and where it broke
      - evidence of the user impact
      - how they got the owning teams to engage
      - agreed plan and who did what
      - result and how ownership was clarified for the future
    rubric:
      excellent: Maps the journey end to end with evidence of where users struggle, gets several teams to commit to a joint fix, and leaves behind clear ownership so it doesn't recur.
      good: Coordinates a fix across teams for a real user problem.
      weak: Fixes only their own part or escalates without driving resolution.
    followups:
      - Who pushed back, and how did you handle it?
      - How do you know the journey stays fixed?
    common_errors:
      - Fixing only their own team's piece and calling the journey fixed.
