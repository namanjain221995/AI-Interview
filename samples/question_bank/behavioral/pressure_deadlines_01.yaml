# Behavioural: working under pressure and tight deadlines (part 1 of 4) - planning tight work,
# protecting quality, competing commitments and recovering when a date is at risk.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------------------------- easy
  - external_key: behavioral.pressure_deadlines.tightest_recent_deadline
    competency_key: ownership
    topic: Organising work for a tight deadline
    difficulty: easy
    text: >-
      Walk me through the tightest deadline you've worked to in the last year or so. What made it tight, and
      how did you organise your work to meet it?
    expected_concepts:
      - what the deadline was and why it could not move
      - breaking the work into smaller pieces
      - ordering the pieces by risk or importance
      - checking progress against the date along the way
      - the outcome and whether the date was met
    rubric:
      excellent: Explains a specific deadline and its constraint, describes how they split and ordered the work, how they checked progress, and gives a clear outcome with what they learned.
      good: Gives a real example with a sensible plan and a clear result.
      weak: Describes only working longer hours, or gives a general description of how they usually work.
    followups:
      - Which part of the work did you do first, and why that part?
      - Looking back, where did the time actually go?
    common_errors:
      - Equating meeting a deadline with simply working more hours.

  - external_key: behavioral.pressure_deadlines.two_deadlines_one_week
    competency_key: ownership
    topic: Two deadlines landing at once
    difficulty: easy
    text: >-
      Tell me about a week when two of your own deliverables were due at almost the same time. How did you
      decide how to split your time between them?
    expected_concepts:
      - what each deliverable was and who depended on it
      - comparing impact and consequences of each slipping
      - a concrete schedule or split of time
      - telling the affected people about the plan
      - what was delivered and when
    rubric:
      excellent: Compares the two deliverables on impact and who was waiting, lays out a concrete plan, explains who they told about it, and reports the actual result for both.
      good: Gives a clear example with a reasonable way of splitting time and a result.
      weak: Says they just worked on both until done, with no reasoning about priorities.
    followups:
      - Did either of the people waiting know about the other deadline?
      - What would you have dropped if something else had come up that week?
    common_errors:
      - Not mentioning any communication with the people depending on the work.

  - external_key: behavioral.pressure_deadlines.time_boxed_investigation
    competency_key: problem_solving
    topic: Time-boxing research under a deadline
    difficulty: easy
    text: >-
      Tell me about a time you had to look into something, like a problem or a set of options, but the
      deadline didn't leave room for open-ended digging. How did you decide when you knew enough to stop?
    expected_concepts:
      - what was being investigated and why it mattered
      - setting a time limit or stopping rule in advance
      - focusing on the questions that would change the decision
      - stating remaining unknowns openly
      - what was decided and how it turned out
    rubric:
      excellent: Describes a time limit or clear stopping point, explains which questions they prioritised because they affected the decision, states what remained unknown, and reports the outcome.
      good: Gives an example where they limited the investigation and made a reasonable decision.
      weak: Either kept digging past the deadline or stopped arbitrarily with no reasoning.
    followups:
      - What was the one thing you most wished you'd had time to check?
      - How did you record the open questions for later?
    common_errors:
      - Presenting a guess as a finding without saying what was still uncertain.

  - external_key: behavioral.pressure_deadlines.progress_updates_while_busy
    competency_key: communication
    topic: Keeping people updated during a crunch
    difficulty: easy
    text: >-
      During a busy stretch with a deadline coming up, how did you keep the people waiting on your work up to
      date without spending half your day writing updates? Give me a specific example.
    expected_concepts:
      - who needed updates and what they needed to know
      - a short, regular format or channel
      - flagging changes in risk rather than only activity
      - adjusting frequency as the date approached
      - feedback that the updates were useful
    rubric:
      excellent: Names the audience, describes a brief regular update that highlighted risks and decisions needed, and shows it kept people informed without slowing the work.
      good: Gives a real example of regular, useful updates during busy work.
      weak: Describes going quiet until the work was done, or only answering when chased.
    followups:
      - What did you leave out of those updates on purpose?
      - How did you share bad news in that format?
    common_errors:
      - Updates that list tasks done but say nothing about risk to the date.

  - external_key: behavioral.pressure_deadlines.simpler_approach_for_date
    competency_key: ownership
    topic: Choosing a simpler approach to meet a date
    difficulty: easy
    text: >-
      Tell me about a time you chose a simpler way of doing something than you'd ideally have liked, so that
      you could meet a date. What did you give up, and how did that choice hold up afterwards?
    expected_concepts:
      - the ideal approach versus the simpler one chosen
      - why the simpler approach was good enough for the need
      - what was knowingly given up
      - checking the result still met the real requirement
      - how the choice held up later
    rubric:
      excellent: Contrasts the two approaches, explains why the simpler one met the actual need, names what was sacrificed, and reports how it held up later with evidence.
      good: Gives a clear example with a reasoned trade-off and some reflection on how it turned out.
      weak: Cannot say what was given up, or treats the simpler approach as having no cost.
    followups:
      - Did anyone disagree with the simpler choice?
      - Would you make the same call again?
    common_errors:
      - Describing a shortcut without checking it still met the requirement.

  - external_key: behavioral.pressure_deadlines.checks_when_rushing
    competency_key: culture_values
    topic: Not skipping checks when rushing
    difficulty: easy
    text: >-
      When you're rushing to finish something, what do you do to make sure you don't skip the checks that
      matter? Tell me about a time that habit caught a problem.
    expected_concepts:
      - which checks they consider non-negotiable
      - a concrete habit, checklist or tool
      - the problem it caught and its potential impact
      - fixing it before it reached others
      - keeping the habit afterwards
    rubric:
      excellent: Names specific checks they keep even under time pressure, describes the habit or tool, and gives a concrete problem it caught with its likely impact.
      good: Describes a reasonable habit with an example where it helped.
      weak: Says they are always careful, with no specific habit or example.
    followups:
      - Which checks do you allow yourself to skip, and why those?
      - Has the habit ever slowed you down in a way that mattered?
    common_errors:
      - Claiming to never cut corners without describing any mechanism.

  - external_key: behavioral.pressure_deadlines.tracking_against_the_date
    competency_key: ownership
    topic: Knowing whether you are on schedule
    difficulty: easy
    text: >-
      On a piece of work with a firm deadline, how did you know day to day whether you were actually on track?
      Walk me through what you looked at.
    expected_concepts:
      - milestones or intermediate checkpoints
      - measuring finished work rather than effort spent
      - early warning signs they watched for
      - what they did when a checkpoint slipped
      - the final outcome
    rubric:
      excellent: Describes concrete checkpoints based on finished work, the warning signs they watched for, a moment a checkpoint slipped and what they did, and the outcome.
      good: Describes a reasonable way of tracking progress with a real example.
      weak: Relies on a feeling of being on track, or only noticed problems at the end.
    followups:
      - What was the earliest sign that things might slip?
      - Who else could see that progress?
    common_errors:
      - Measuring progress by hours spent instead of work completed.

  - external_key: behavioral.pressure_deadlines.late_change_request_decision
    competency_key: adaptability
    topic: A change request in the final days
    difficulty: easy
    text: >-
      Think of a delivery where a stakeholder came back with an extra change in the final few days before the
      due date. How did you weigh up accepting it against the risk to the date, and what was the answer you
      gave?
    expected_concepts:
      - what the change was and why it was requested
      - estimating the effort and risk of the change
      - options offered, such as now, later or partially
      - agreeing the decision with the requester
      - what happened to the change and the deadline
    rubric:
      excellent: Explains how they sized the change and its risk, describes the options they put to the requester, and reports an agreed decision and its effect on the deadline.
      good: Gives a real example where they considered the change before accepting or deferring it.
      weak: Accepted or refused the change automatically without weighing it.
    followups:
      - How did the requester react to your answer?
      - Would you have answered differently a week earlier?
    common_errors:
      - Silently absorbing the change and then missing the date.

  - external_key: behavioral.pressure_deadlines.partner_team_counting_on_you
    competency_key: collaboration
    topic: Another function scheduled around your delivery
    difficulty: easy
    text: >-
      Tell me about a time people outside your team, for example in sales, marketing or operations, had already
      scheduled their own plans around something you were delivering. How did you coordinate with them as the
      date got closer?
    expected_concepts:
      - what the other group was planning and when
      - agreeing what they actually needed and by when
      - regular check-ins or shared timelines
      - early warning if anything changed
      - outcome for both sides
    rubric:
      excellent: Describes what the other group depended on, how they agreed the essentials and timing, how they kept each other informed, and the result for both sides.
      good: Gives a real example with reasonable coordination and a result.
      weak: Only informed the other group at the end, or did not consider their plans at all.
    followups:
      - What did they need that you hadn't expected?
      - What would have happened if you'd slipped by a week?
    common_errors:
      - Treating the other group's plans as their own problem.

  # ------------------------------------------------------------------------------- medium
  - external_key: behavioral.pressure_deadlines.quality_versus_date
    competency_key: culture_values
    topic: Protecting quality against a date
    difficulty: medium
    text: >-
      Tell me about a time a deadline pushed you to consider cutting back on testing, review or some other
      quality step. What did you decide to protect, what did you let go, and why?
    expected_concepts:
      - the quality step under pressure and the risk of dropping it
      - separating essential checks from nice-to-have ones
      - reasoning based on the consequences of failure
      - telling the decision-makers about the remaining risk
      - what happened after delivery
    rubric:
      excellent: Distinguishes which quality steps were essential and why, explains the trade-off and who agreed to it, and reports what happened afterwards including any follow-up.
      good: Gives a clear example with a sensible decision about what to keep.
      weak: Either skipped quality steps without thought or refused all compromise without explaining the reasoning.
    followups:
      - Who else knew about the risk you accepted?
      - Did anything you let go come back to bite you?
    common_errors:
      - Treating all quality steps as equally important.

  - external_key: behavioral.pressure_deadlines.shortcut_payback
    competency_key: ownership
    topic: Paying back a deliberate shortcut
    difficulty: medium
    text: >-
      Tell me about a shortcut you knowingly took to hit a date. How did you make sure it actually got cleaned
      up afterwards instead of being forgotten?
    expected_concepts:
      - the shortcut and why it was acceptable at the time
      - recording it visibly, such as a ticket or note
      - agreeing when it would be addressed
      - following through on the clean-up
      - impact of leaving it or fixing it
    rubric:
      excellent: Explains why the shortcut was a reasonable trade-off, how they made it visible and scheduled, and shows they followed through with evidence of the clean-up.
      good: Gives a real shortcut with a plan to fix it and some follow-through.
      weak: Took the shortcut with no plan to revisit it, or it was never addressed.
    followups:
      - How did you get time for the clean-up approved?
      - What would have happened if it had stayed in place?
    common_errors:
      - Assuming someone else would pick up the clean-up.

  - external_key: behavioral.pressure_deadlines.met_date_at_a_cost
    competency_key: ownership
    topic: A deadline met in a way you wouldn't repeat
    difficulty: medium
    text: >-
      Tell me about a deadline you did meet, but in a way you wouldn't want to repeat. What did hitting it
      cost, and what would you do differently next time?
    expected_concepts:
      - what the deadline was and how it was met
      - the cost, such as quality, rework or strained working relationships
      - root cause of why the crunch happened
      - concrete changes to planning or process
      - evidence those changes were applied later
    rubric:
      excellent: Names the concrete cost of meeting the date, traces why the crunch happened, and describes specific changes they made afterwards and how they worked.
      good: Gives a real example with a clear cost and a sensible lesson.
      weak: Presents the crunch as purely a success, or the lesson is only to work harder.
    followups:
      - When could you first have seen the crunch coming?
      - Did anyone else pay part of that cost?
    common_errors:
      - Learning nothing beyond start earlier.

  - external_key: behavioral.pressure_deadlines.estimate_badly_wrong
    competency_key: ownership
    topic: Re-planning when an estimate proved wrong
    difficulty: medium
    text: >-
      Tell me about a time you were partway through some work and realised your original estimate was badly
      wrong. What did you do with that information?
    expected_concepts:
      - when and how they realised the estimate was off
      - a revised estimate based on what was now known
      - informing the people relying on the date
      - options such as reducing scope or adding help
      - what they changed about estimating afterwards
    rubric:
      excellent: Describes how they spotted the gap, produced a revised estimate with reasoning, raised it promptly with options, and changed their estimating approach afterwards.
      good: Gives a real example with a revised plan and timely communication.
      weak: Kept quiet and hoped to catch up, or blamed the original requester for the estimate.
    followups:
      - What made the original estimate so far off?
      - How did people react to the new estimate?
    common_errors:
      - Revising the date without explaining the reasoning.

  - external_key: behavioral.pressure_deadlines.late_dependency
    competency_key: ownership
    topic: A late dependency threatening your date
    difficulty: medium
    text: >-
      Describe a time something you depended on, like another team's work, a vendor or an approval, was late
      and put your deadline at risk. What did you do while you were waiting?
    expected_concepts:
      - the dependency and its effect on the timeline
      - working with the dependency owner on realistic dates
      - unblocking work in parallel, such as stubs or reordering
      - a fallback if the dependency did not arrive
      - outcome and what changed in planning
    rubric:
      excellent: Explains the dependency, how they engaged its owner, what they did in parallel to stay productive, the fallback plan, and the result.
      good: Gives a real example with sensible actions beyond simply waiting.
      weak: Waited passively and blamed the dependency for the miss.
    followups:
      - When did you first suspect it would be late?
      - What did you do to avoid the same dependency risk next time?
    common_errors:
      - Not having any fallback or alternative plan.

  - external_key: behavioral.pressure_deadlines.decision_without_full_info
    competency_key: problem_solving
    topic: Deciding quickly with incomplete information
    difficulty: medium
    text: >-
      Tell me about a decision you had to make quickly because of a deadline, even though you didn't have all
      the information you wanted. How did you make the call?
    expected_concepts:
      - what was known and unknown
      - how reversible the decision was
      - the reasoning or criteria used
      - reducing risk, such as a fallback or checkpoint
      - outcome and what they learned
    rubric:
      excellent: Separates what was known from unknown, considers how reversible the decision was, explains the criteria and safeguards they used, and reflects on the outcome.
      good: Gives a real decision with reasoning and an outcome.
      weak: Describes guessing, or delaying until the deadline forced a default.
    followups:
      - What information would have changed your decision?
      - How would you have undone it if it had been wrong?
    common_errors:
      - Not considering whether the decision could be reversed.

  - external_key: behavioral.pressure_deadlines.declined_request_to_protect_commitment
    competency_key: communication
    topic: Saying no to protect an existing commitment
    difficulty: medium
    text: >-
      Tell me about a time you turned down or deferred a request because taking it on would have put an
      existing deadline at risk. How did you explain it to the person asking?
    expected_concepts:
      - the request and the existing commitment it threatened
      - explaining the trade-off in terms the requester cared about
      - offering alternatives or a later date
      - involving a manager or prioritiser if needed
      - effect on the relationship and the work
    rubric:
      excellent: Explains the conflict clearly, shows how they framed the trade-off for the requester and offered alternatives, and describes how the relationship and both pieces of work turned out.
      good: Gives a real example of declining with a reason and an alternative.
      weak: Refused without explanation, or always says yes and absorbs the work.
    followups:
      - Did the request end up being done by someone else?
      - How did you decide this one was worth saying no to?
    common_errors:
      - Saying no without offering any alternative.

  - external_key: behavioral.pressure_deadlines.problem_found_before_release
    competency_key: ownership
    topic: A problem discovered just before a release
    difficulty: medium
    text: >-
      Tell me about a time you found a serious problem shortly before something was due to go out. How did
      you handle the next few hours or days?
    expected_concepts:
      - the problem and its potential impact
      - quickly assessing severity and options
      - involving the right people promptly
      - the decision taken, such as fix, delay or release with mitigation
      - follow-up to prevent late discoveries
    rubric:
      excellent: Describes the problem's impact, how they assessed options and involved decision-makers quickly, the decision made and why, and how they reduced late discoveries afterwards.
      good: Gives a real example with a reasoned response and outcome.
      weak: Hid the problem to keep the date, or escalated without any assessment.
    followups:
      - Why was it only found so late?
      - Who made the final call?
    common_errors:
      - Not explaining how the problem was prevented from recurring.

  - external_key: behavioral.pressure_deadlines.immovable_external_date
    competency_key: ownership
    topic: Working to an immovable external date
    difficulty: medium
    text: >-
      Tell me about a time you worked toward a date that genuinely couldn't move, for example a contract
      commitment, a regulatory deadline or a public event. How did that change the way you planned?
    expected_concepts:
      - why the date was fixed and the consequences of missing it
      - working backwards from the date
      - building in buffer for the riskiest parts
      - deciding early what could be cut
      - outcome against the date
    rubric:
      excellent: Explains why the date was fixed, shows they planned backwards with buffer on the riskiest parts, identified cuttable scope early, and reports the outcome.
      good: Gives a real example with planning adapted to the fixed date.
      weak: Planned the same way as for any other date, or describes only the final rush.
    followups:
      - What was in your back pocket in case things went wrong?
      - What did you decide to cut, and when?
    common_errors:
      - Leaving all buffer to the end instead of protecting the risky parts.

  - external_key: behavioral.pressure_deadlines.rotation_duty_and_project
    competency_key: adaptability
    topic: A support rotation during a project deadline
    difficulty: medium
    text: >-
      Tell me about a time a recurring duty, like a support or on-call rotation, landed in the same period as
      an important project deadline. How did you plan for both?
    expected_concepts:
      - the duty and the deadline and how they overlapped
      - planning ahead, such as swapping or front-loading work
      - agreeing expectations with the team and stakeholders
      - protecting focus time for the project
      - outcome for both responsibilities
    rubric:
      excellent: Describes planning done in advance, how expectations were agreed with others, how project time was protected, and that both responsibilities were met or trade-offs were agreed.
      good: Gives a real example with some advance planning and a reasonable outcome.
      weak: Did not plan for the overlap and let one of the responsibilities quietly slip.
    followups:
      - Did you consider swapping the rotation, and why or why not?
      - What happened when the two actually clashed?
    common_errors:
      - Neglecting the rotation duty to focus on the project without telling anyone.

  - external_key: behavioral.pressure_deadlines.teammate_disagreed_on_cuts
    competency_key: collaboration
    topic: Disagreeing with a teammate about what to cut
    difficulty: medium
    text: >-
      Tell me about a time you and a teammate disagreed about how much to cut or simplify to hit a deadline.
      How did the two of you reach a decision?
    expected_concepts:
      - each person's position and reasoning
      - understanding the risks the other person saw
      - using facts such as effort, impact or user need
      - agreeing a decision or who would decide
      - outcome and how the working relationship held up
    rubric:
      excellent: States both positions fairly, shows they understood the other person's concerns, used concrete facts to reach a decision or agreed who would decide, and reports the outcome for the work and the relationship.
      good: Gives a real disagreement resolved with reasonable discussion.
      weak: Describes winning the argument or giving in without discussing the trade-off.
    followups:
      - What part of their argument turned out to be right?
      - Who had the final say, and why?
    common_errors:
      - Presenting only their own side of the disagreement.

  # ------------------------------------------------------------------------------- hard
  - external_key: behavioral.pressure_deadlines.delay_release_quality_call
    competency_key: culture_values
    topic: Making the call to delay a release
    difficulty: hard
    text: >-
      Tell me about a time you made or strongly influenced the call to delay something because it wasn't ready,
      even though people were counting on the date. How did you build the case, and what happened?
    expected_concepts:
      - evidence that the work was not ready
      - consequences of shipping versus delaying
      - options considered, such as partial release or mitigations
      - how the case was presented to decision-makers
      - outcome and how the delay was used
    rubric:
      excellent: Builds the case on concrete evidence, compares consequences of both choices, presents options to decision-makers, and shows the delay was used well with a clear outcome.
      good: Gives a real example of arguing for a delay with reasonable evidence.
      weak: Bases the delay on a general feeling, or never actually influenced the decision.
    followups:
      - What would have convinced you to ship anyway?
      - How did the people relying on the date respond?
    common_errors:
      - Arguing for delay without any options to reduce the impact.

  - external_key: behavioral.pressure_deadlines.rescuing_behind_schedule_project
    competency_key: ownership
    topic: Turning around a project that was badly behind
    difficulty: hard
    text: >-
      Tell me about a time you took charge of a piece of work that was already badly behind schedule. What
      did you do in the first couple of weeks to get it back under control?
    expected_concepts:
      - assessing the true state of the work
      - resetting scope, plan or date with stakeholders
      - fixing the main causes of delay
      - visible milestones to rebuild trust
      - the final result
    rubric:
      excellent: Describes an evidence-based assessment of the real state, a reset agreed with stakeholders, targeted fixes to the main causes of delay, and a measurable recovery.
      good: Gives a real example with a structured recovery plan and outcome.
      weak: Describes pushing everyone harder without changing the plan or causes.
    followups:
      - What did you find that others had missed?
      - What did you have to give up to recover it?
    common_errors:
      - Accepting the existing plan without checking whether it was still realistic.

  - external_key: behavioral.pressure_deadlines.ending_recurring_crunch
    competency_key: ownership
    topic: Breaking a cycle of repeated crunches
    difficulty: hard
    text: >-
      Have you been part of a team that kept ending up in a last-minute rush before every deadline? Tell me
      what you did to change the pattern and whether it worked.
    expected_concepts:
      - recognising the pattern with evidence
      - identifying root causes, such as late scope or poor estimates
      - specific changes proposed and adopted
      - getting buy-in from the team and stakeholders
      - measured result across later deadlines
    rubric:
      excellent: Uses evidence to show the pattern, identifies root causes, describes specific changes they drove with buy-in, and shows a measurable improvement over later deadlines.
      good: Gives a real example with sensible changes and some improvement.
      weak: Describes complaining about the pattern without changing anything, or changes with no result.
    followups:
      - Who was most resistant to the change, and why?
      - Which change made the biggest difference?
    common_errors:
      - Treating each crunch as a one-off instead of looking for the pattern.

  - external_key: behavioral.pressure_deadlines.pushback_on_unsafe_shipping
    competency_key: culture_values
    topic: Resisting pressure to ship something unsafe
    difficulty: hard
    text: >-
      Tell me about a time someone more senior than you wanted something shipped on schedule that you believed
      could cause real harm to users, data or the business. What did you do?
    expected_concepts:
      - the specific risk and evidence for it
      - raising it clearly through the right channel
      - proposing safer options that still met key goals
      - escalating further if needed
      - outcome and effect on the working relationship
    rubric:
      excellent: Describes a concrete risk with evidence, how they raised it constructively with alternatives, any escalation, and the outcome including how the relationship was maintained.
      good: Gives a real example of raising the risk clearly and offering options.
      weak: Went along without raising the concern, or raised it with no evidence or alternatives.
    followups:
      - What would you have done if they had overruled you?
      - How did you make sure the concern was recorded?
    common_errors:
      - Framing the disagreement as personal rather than about the risk.

  - external_key: behavioral.pressure_deadlines.many_parties_one_date
    competency_key: ownership
    topic: Coordinating several groups to one date
    difficulty: hard
    text: >-
      Tell me about a time you were responsible for getting several people or teams to deliver their parts for
      the same date. How did you keep everything converging, and what did you do when one part started to
      slip?
    expected_concepts:
      - mapping the parts and their dependencies
      - agreed intermediate dates and integration points
      - a shared view of progress and risk
      - acting early when one part slipped
      - result and lessons for coordination
    rubric:
      excellent: Describes mapping dependencies, setting integration checkpoints, keeping a shared view of risk, acting early on the slipping part with concrete options, and the final result.
      good: Gives a real example with reasonable coordination and handling of a slip.
      weak: Relied on each group to deliver independently and only found problems at the end.
    followups:
      - How did you get people who didn't report to you to share bad news early?
      - Where did the integration go wrong, if anywhere?
    common_errors:
      - Tracking each part separately without checking how they fit together.
