# Behavioural: integrity and working values (part 2 of 4) - speaking up about others' conduct,
# security and compliance shortcuts, intellectual property, users' interests and keeping commitments.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ speaking up about others' conduct
  - external_key: behavioral.integrity_values.peer_policy_violation
    competency_key: culture_values
    topic: Seeing a peer break an important policy
    difficulty: medium
    text: >-
      Tell me about a time you saw a peer doing something that broke an important company policy, such as
      sharing access, mishandling data or misusing company resources. What did you do about it?
    expected_concepts:
      - what they observed and why it mattered
      - checking facts before acting
      - deciding between a direct conversation and formal reporting
      - using the appropriate reporting channel when needed
      - outcome and how they handled the relationship
    rubric:
      excellent: Describes verifying the facts, choosing a proportionate response based on the severity, using the correct channel when the issue was serious, and reflects on the outcome.
      good: Addresses the issue directly or reports it appropriately.
      weak: Ignores it to avoid friction, or acts on rumour without checking.
    followups:
      - How did you decide whether to talk to them first or report it?
      - How did that affect your working relationship?
    common_errors:
      - Assuming that because the peer was well liked or senior, it was not their place to act.

  - external_key: behavioral.integrity_values.disrespect_in_meeting
    competency_key: culture_values
    topic: Responding to disrespectful behaviour
    difficulty: medium
    text: >-
      Describe a time you saw a colleague being treated disrespectfully, for example talked over, mocked or
      excluded, and you were not the person being targeted. How did you respond?
    expected_concepts:
      - the behaviour they observed
      - intervening in the moment or soon after
      - checking in with the person affected
      - raising it with the person responsible or a manager
      - result and any change in team norms
    rubric:
      excellent: Describes a specific intervention in or right after the moment, supporting the affected colleague, addressing the behaviour with the right person, and a visible change afterwards.
      good: Supports the affected colleague and raises the behaviour with someone.
      weak: Stays a bystander, or describes only feeling bad about it.
    followups:
      - What did you say to the colleague who was affected?
      - What would you do if the behaviour came from a senior leader?
    common_errors:
      - Waiting for the targeted person to raise it themselves.

  - external_key: behavioral.integrity_values.concern_ignored_escalation
    competency_key: culture_values
    topic: Escalating when a concern is ignored
    difficulty: hard
    text: >-
      Tell me about a time you raised a serious concern and the first person you told didn't act on it. What did
      you do next, and how did you decide how far to take it?
    expected_concepts:
      - the concern and why it was serious
      - giving the first person a fair chance and following up
      - escalating to the next level or an independent channel such as compliance or ethics
      - documenting what was raised and when
      - weighing the cost of escalating against the cost of silence
    rubric:
      excellent: Explains the seriousness with evidence, describes giving the first contact a fair chance, escalating step by step through appropriate channels with documentation, and reflects on the trade-offs and outcome.
      good: Escalates beyond the first contact through a sensible channel.
      weak: Drops the concern after the first refusal, or goes outside the organisation without trying internal channels.
    followups:
      - What would have made you stop escalating?
      - Did you know which formal channels were available to you?
    common_errors:
      - Treating a difference of opinion as a serious concern to escalate.

  - external_key: behavioral.integrity_values.fair_peer_review
    competency_key: culture_values
    topic: Giving a fair assessment of a colleague
    difficulty: easy
    text: >-
      Think about a time you were asked to give feedback on a colleague, for a review, a promotion or a project
      retrospective. How did you make sure your input was fair and based on evidence?
    expected_concepts:
      - collecting specific examples of work
      - separating personal rapport from performance
      - balancing strengths and areas to improve
      - being willing to share the substance with the colleague directly
    rubric:
      excellent: Describes gathering concrete examples, deliberately separating how much they liked the person from the work itself, and giving balanced, specific input they would stand behind directly.
      good: Bases feedback on specific examples and covers both strengths and gaps.
      weak: Relies on general impressions, or adjusts feedback to help or hurt someone.
    followups:
      - Would you have said the same things to that colleague's face?
      - How do you avoid recent events dominating your view?
    common_errors:
      - Giving only positive feedback to avoid friction.

  - external_key: behavioral.integrity_values.fair_hiring_decision
    competency_key: culture_values
    topic: Keeping a selection decision fair
    difficulty: hard
    text: >-
      Tell me about a time you were part of choosing between people, for a hire, a project role or an award,
      and you noticed the discussion drifting away from job-related evidence. What did you do?
    expected_concepts:
      - what the agreed criteria were
      - noticing judgements based on familiarity, background or gut feel
      - steering the group back to evidence and criteria
      - proposing structural fixes such as written scoring before discussion
      - outcome of the decision
    rubric:
      excellent: Describes naming the drift in the moment, redirecting the group to agreed job-related criteria with evidence, and introducing a lasting structural change to the process.
      good: Brings the discussion back to the criteria.
      weak: Goes along with the group, or cannot describe what the criteria were.
    followups:
      - How did the group respond when you pointed it out?
      - What would you change in that selection process?
    common_errors:
      - Describing a decision as fair simply because the outcome felt right.

  # ------------------------------------------------------------ security and access
  - external_key: behavioral.integrity_values.shared_credentials
    competency_key: culture_values
    topic: Shared credentials and access shortcuts
    difficulty: easy
    text: >-
      Tell me about a time someone asked to borrow your login or access, or offered you theirs, to get something
      done faster. How did you handle it?
    expected_concepts:
      - the request and the reason behind it
      - declining to share credentials
      - helping them get proper access quickly
      - understanding accountability and audit implications
    rubric:
      excellent: Declines clearly, explains the accountability risk in practical terms, and actively helps the person get their own access through the proper route.
      good: Declines and points them to the proper access process.
      weak: Shares access for convenience, or treats it as a minor issue.
    followups:
      - What would you have done if it was an emergency?
      - How could the access process have been made faster?
    common_errors:
      - Believing sharing is acceptable among trusted teammates.

  - external_key: behavioral.integrity_values.bypassing_controls_emergency
    competency_key: culture_values
    topic: Controls during an urgent situation
    difficulty: medium
    text: >-
      Tell me about an urgent situation, like an outage or a customer escalation, where the quickest fix meant
      going around a normal control or approval. What did you do, and how did you handle it afterwards?
    expected_concepts:
      - the urgency and the control involved
      - using an approved emergency or break-glass path where one existed
      - getting explicit sign-off or informing the right people
      - recording what was done
      - reviewing afterwards and restoring the control
    rubric:
      excellent: Describes using a sanctioned emergency path or getting explicit approval, recording every action taken, and reviewing afterwards to restore controls and improve the process.
      good: Gets approval before bypassing and informs people afterwards.
      weak: Bypasses quietly and moves on, or presents the bypass as heroic.
    followups:
      - Who knew what you had done, and when?
      - What changed in the process afterwards?
    common_errors:
      - Assuming urgency removes the need for any record or approval.

  - external_key: behavioral.integrity_values.reporting_own_security_slip
    competency_key: culture_values
    topic: Reporting your own security slip
    difficulty: medium
    text: >-
      Describe a time you made a security or privacy slip yourself, such as clicking a suspicious link, sending
      something to the wrong person or exposing a secret. What did you do after you noticed?
    expected_concepts:
      - what happened and the potential exposure
      - reporting it immediately to the right team
      - helping with containment such as rotating or recalling
      - not hiding it out of embarrassment
      - what they changed afterwards
    rubric:
      excellent: Reports immediately to the right team, helps contain the exposure, describes the outcome, and names a concrete habit or tooling change that followed.
      good: Reports the slip promptly and helps fix it.
      weak: Tries to fix it quietly without reporting, or delays reporting.
    followups:
      - How long was it between noticing and reporting?
      - What would make people hesitate to report a slip like that?
    common_errors:
      - Fixing it alone so nobody would find out.

  # ------------------------------------------------------------ compliance and records
  - external_key: behavioral.integrity_values.audit_documentation_gap
    competency_key: culture_values
    topic: Gaps found before an audit or review
    difficulty: medium
    text: >-
      Tell me about a time you were preparing for an audit, a compliance check or a formal review and found
      that something hadn't been done the way the records said. How did you handle it?
    expected_concepts:
      - what the gap was
      - not backfilling or altering records to cover it
      - disclosing the gap to the right owner or the auditors
      - remediating the underlying issue
      - improving the process so records match reality
    rubric:
      excellent: Describes refusing to backfill or alter records, disclosing the gap with a remediation plan, fixing the underlying practice, and the outcome of the review.
      good: Discloses the gap and fixes it.
      weak: Patches the records to pass, or hides the gap.
    followups:
      - Did anyone suggest just updating the records?
      - How did the auditors respond to the disclosure?
    common_errors:
      - Treating documentation as a formality rather than a record of what actually happened.

  - external_key: behavioral.integrity_values.altering_test_results
    competency_key: culture_values
    topic: Pressure to make results look better
    difficulty: hard
    text: >-
      Describe a time someone wanted test results, survey data or a report adjusted, filtered or selectively
      presented so the outcome looked better than it was. What did you do?
    expected_concepts:
      - what was being asked and the effect on the conclusion
      - distinguishing legitimate cleaning from misleading selection
      - refusing to misrepresent while offering a fair presentation
      - escalating if pressure continued
      - outcome and lessons
    rubric:
      excellent: Distinguishes legitimate analysis choices from misrepresentation with specifics, presents the data fairly with context, escalates appropriately under continued pressure, and reports the result.
      good: Refuses to misrepresent and presents the full picture.
      weak: Goes along with the selective presentation, or cannot tell legitimate from misleading choices.
    followups:
      - How did you explain the difference between cleaning and cherry-picking?
      - What did you do with the results that were unflattering?
    common_errors:
      - Assuming that if no number was changed, selective presentation is fine.

  - external_key: behavioral.integrity_values.understanding_policy_purpose
    competency_key: culture_values
    topic: Learning why a policy exists
    difficulty: easy
    text: >-
      Tell me about a policy or procedure at work that you only came to value once you understood why it was
      there. What changed how you saw it?
    expected_concepts:
      - the policy and their initial view
      - the event or explanation that showed its purpose
      - how their behaviour changed
      - helping others understand it too
    rubric:
      excellent: Describes a specific policy, the concrete event or explanation that revealed its purpose, a change in their own practice, and how they passed that understanding on.
      good: Gives a real example of coming to understand a policy's purpose.
      weak: Gives a generic answer about following rules.
    followups:
      - How do you approach a new policy now?
      - How would you explain that policy to a new colleague?
    common_errors:
      - Answering with a policy they still regard as pointless.

  # ------------------------------------------------------------ intellectual property and tools
  - external_key: behavioral.integrity_values.licensing_and_reuse
    competency_key: culture_values
    topic: Reusing material you didn't create
    difficulty: medium
    text: >-
      Tell me about a time you wanted to reuse something you didn't create, like code, images, text or a
      template, for a work deliverable. How did you check whether you were allowed to, and what did you do?
    expected_concepts:
      - identifying the source and licence or terms
      - checking company guidance or asking the right team
      - attributing or replacing the material when needed
      - recognising when convenience conflicted with rights
    rubric:
      excellent: Describes checking the licence or terms and company guidance, consulting the right people when unsure, and attributing or replacing the material even when that cost time.
      good: Checks permissions before reusing and attributes appropriately.
      weak: Reuses freely assuming online material is free to use.
    followups:
      - What would you do if the licence was unclear?
      - Have you ever had to remove something already in use?
    common_errors:
      - Assuming publicly visible means free to reuse.

  - external_key: behavioral.integrity_values.ai_tool_policy
    competency_key: culture_values
    topic: Using AI tools within company rules
    difficulty: medium
    text: >-
      AI assistants make it easy to paste in documents or code. Tell me how you've decided what you can and
      can't put into such tools at work, using a specific situation you faced.
    expected_concepts:
      - awareness of company policy on approved tools
      - classifying the information involved
      - choosing an approved tool or removing sensitive details
      - reviewing and owning the output rather than trusting it blindly
      - being open with colleagues about AI assistance where relevant
    rubric:
      excellent: Describes a specific decision grounded in policy and data sensitivity, takes a safe approach such as an approved tool or redaction, and takes responsibility for checking the output.
      good: Follows company guidance and avoids sharing sensitive material.
      weak: Pastes anything in without considering confidentiality, or has no example.
    followups:
      - What would you do if there was no policy yet?
      - How do you make clear what part of a deliverable came from an AI tool?
    common_errors:
      - Treating anything not explicitly banned as safe to share.

  # ------------------------------------------------------------ users' and customers' interests
  - external_key: behavioral.integrity_values.feature_against_user_interest
    competency_key: culture_values
    topic: Work that could mislead or harm users
    difficulty: hard
    text: >-
      Tell me about a time you were asked to build or approve something that could mislead users or work against
      their interests, such as a confusing cancellation flow or hidden fees. How did you respond?
    expected_concepts:
      - the request and the user harm involved
      - understanding the business goal behind it
      - proposing an alternative that met the goal without misleading users
      - involving product, legal or leadership as appropriate
      - outcome
    rubric:
      excellent: Names the specific user harm, engages with the business goal, proposes a concrete alternative, involves the right decision makers, and reports the outcome and what they would do if overruled.
      good: Raises the concern and suggests a fairer approach.
      weak: Builds it without comment because it was requested, or objects without engaging with the goal.
    followups:
      - What would you have done if leadership insisted?
      - How did you frame the cost of misleading users in business terms?
    common_errors:
      - Assuming it is legal so it must be acceptable.

  - external_key: behavioral.integrity_values.recommending_less_revenue
    competency_key: culture_values
    topic: Advising a customer against a bigger purchase
    difficulty: medium
    text: >-
      Have you ever recommended an option to a customer or internal client that was better for them but meant
      less revenue, budget or recognition for you or your team? Tell me about it.
    expected_concepts:
      - the customer's real need
      - the options and why the cheaper one fitted better
      - discussing it openly with their own team or manager
      - long-term effect on trust and the relationship
    rubric:
      excellent: Describes recommending the option that fitted the customer's need, making the trade-off visible to their own team, and shows the longer-term result for the relationship.
      good: Recommends the right option for the customer and explains why.
      weak: Pushes the bigger option without regard to need, or has no real example.
    followups:
      - How did your team or manager react?
      - How do you balance targets with doing right by the customer?
    common_errors:
      - Presenting it as a sales tactic rather than a decision made in the customer's interest.

  - external_key: behavioral.integrity_values.accurate_product_claims
    competency_key: culture_values
    topic: Making accurate claims about what you offer
    difficulty: easy
    text: >-
      Tell me about a time you were describing a product, service or piece of your work to someone and were
      tempted to make it sound more finished or capable than it was. What did you actually say?
    expected_concepts:
      - the context and audience
      - describing actual capability and limitations
      - separating current state from roadmap or plans
      - outcome of setting accurate expectations
    rubric:
      excellent: Describes stating real capabilities and limits clearly, separating what existed from what was planned, and explains how accurate expectations helped later.
      good: Describes the work accurately including limitations.
      weak: Admits overstating it and sees no problem, or gives a vague answer.
    followups:
      - How did the listener react to hearing the limitations?
      - Where is the line between enthusiasm about plans and overstating?
    common_errors:
      - Describing plans as if they were already delivered.

  # ------------------------------------------------------------ keeping commitments
  - external_key: behavioral.integrity_values.inconvenient_commitment
    competency_key: culture_values
    topic: Keeping a commitment when it became inconvenient
    difficulty: easy
    text: >-
      Tell me about a time you had made a commitment to someone at work, and keeping it became much less
      convenient than you expected. What did you do?
    expected_concepts:
      - the commitment and who relied on it
      - what changed to make it inconvenient
      - keeping it, or renegotiating openly and early
      - effect on the other person's trust
    rubric:
      excellent: Describes either keeping the commitment at real cost or renegotiating it early and openly with the person affected, and explains how that affected trust.
      good: Keeps the commitment or renegotiates before the deadline.
      weak: Lets it slip quietly, or renegotiates only after missing it.
    followups:
      - How did you decide whether to keep it or renegotiate?
      - How do you decide what to commit to now?
    common_errors:
      - Describing a commitment that was never really at risk.

  - external_key: behavioral.integrity_values.missed_commitment_disclosure
    competency_key: culture_values
    topic: Telling people early you will miss a commitment
    difficulty: medium
    text: >-
      Describe a time you realised you were going to miss a deadline or commitment that others depended on.
      When and how did you tell them?
    expected_concepts:
      - the moment they knew it was at risk
      - telling the affected people early rather than at the deadline
      - giving a realistic new estimate and options
      - minimising the impact on others
      - learning applied to later estimates
    rubric:
      excellent: Explains recognising the risk early, telling the people affected promptly with a realistic revised plan and options, and describes how they estimate differently now.
      good: Communicates the delay before the deadline with a new plan.
      weak: Reveals it at or after the deadline, or blames others for the miss.
    followups:
      - What stopped you telling them even earlier?
      - What did the other team do with the earlier warning?
    common_errors:
      - Waiting until certain of the slip instead of flagging the risk.

  # ------------------------------------------------------------ transparency in decisions
  - external_key: behavioral.integrity_values.hidden_tradeoff_disclosure
    competency_key: culture_values
    topic: Making trade-offs visible to decision makers
    difficulty: medium
    text: >-
      Tell me about a time you made a technical or business trade-off that others would live with, like a
      shortcut, a known risk or deferred work. How did you make sure the people affected understood it?
    expected_concepts:
      - the trade-off and who it affected
      - documenting the decision and its risks
      - communicating to the people who would inherit it
      - a plan or trigger for revisiting it
    rubric:
      excellent: Describes documenting the trade-off with its risks, communicating it directly to those affected, setting a plan to revisit it, and following through.
      good: Documents the trade-off and tells the main stakeholders.
      weak: Makes the trade-off silently, leaving others to discover it later.
    followups:
      - Where did you record it?
      - Did anyone push back once they understood the trade-off?
    common_errors:
      - Assuming a comment in the code or a ticket counts as telling people.

  - external_key: behavioral.integrity_values.open_about_conflicting_priorities
    competency_key: culture_values
    topic: Being open with two stakeholders who want different things
    difficulty: medium
    text: >-
      Describe a time two stakeholders each expected your work to go their way and you couldn't satisfy both.
      How did you keep things transparent instead of telling each what they wanted to hear?
    expected_concepts:
      - the conflicting expectations
      - telling both parties the same story
      - bringing them together or escalating for a decision
      - documenting the agreed outcome
    rubric:
      excellent: Describes giving both stakeholders the same clear picture, bringing them together or escalating for a decision, and documenting the outcome so nobody was surprised.
      good: Makes the conflict visible to both and gets a decision.
      weak: Tells each side what they want to hear, or decides quietly and lets one side find out later.
    followups:
      - What happened when they realised they disagreed?
      - Who made the final decision?
    common_errors:
      - Avoiding the conflict until delivery made it obvious.

  - external_key: behavioral.integrity_values.transparency_about_limits_of_analysis
    competency_key: culture_values
    topic: Stating the limits of your own analysis
    difficulty: easy
    text: >-
      Tell me about a recommendation or analysis you presented where the evidence was weaker than people
      wanted. How did you communicate the uncertainty?
    expected_concepts:
      - what the evidence did and did not show
      - stating assumptions and confidence levels explicitly
      - resisting pressure for a firmer conclusion
      - suggesting how to reduce the uncertainty
    rubric:
      excellent: Describes stating assumptions and uncertainty plainly, resisting pressure to overstate, and proposing a concrete way to strengthen the evidence.
      good: Presents the recommendation with its limitations.
      weak: Presents the conclusion as more certain than the evidence allowed.
    followups:
      - How did the audience take the uncertainty?
      - What did you do to firm up the evidence afterwards?
    common_errors:
      - Hiding caveats in an appendix nobody reads.

  # ------------------------------------------------------------ fairness to people
  - external_key: behavioral.integrity_values.equal_treatment_of_requests
    competency_key: culture_values
    topic: Treating requests fairly regardless of who asks
    difficulty: easy
    text: >-
      Tell me about a time someone tried to get their request handled ahead of others because of their seniority
      or connections rather than its actual priority. How did you handle it?
    expected_concepts:
      - the request and the existing priority process
      - assessing the request on its merits
      - explaining the process clearly to the requester
      - escalating to whoever owned prioritisation if needed
    rubric:
      excellent: Assesses the request on its merits against the agreed process, explains the decision transparently to the requester, and involves the priority owner when needed.
      good: Applies the normal process and explains it.
      weak: Bumps the request quietly because of who asked, or refuses without explanation.
    followups:
      - What would have justified moving it up?
      - How did the requester respond?
    common_errors:
      - Assuming seniority automatically means higher priority.

  - external_key: behavioral.integrity_values.protecting_reporter_confidentiality
    competency_key: culture_values
    topic: Handling a concern someone shared in confidence
    difficulty: hard
    text: >-
      Tell me about a time a colleague confided a serious workplace concern to you and asked you to keep it
      quiet. How did you balance their request with what needed to happen?
    expected_concepts:
      - the nature and seriousness of the concern
      - being clear early about what they could and could not keep confidential
      - pointing the colleague to proper channels
      - acting when the concern involved risk to others
      - protecting the colleague's privacy as far as possible
    rubric:
      excellent: Describes being clear about the limits of confidentiality, helping the colleague use proper channels, acting when others were at risk while protecting the colleague's identity, and reflects on the outcome.
      good: Supports the colleague and points them to the right channel.
      weak: Promises unconditional secrecy for a serious issue, or spreads it without care.
    followups:
      - What did you tell them about what you could keep confidential?
      - What would have made you act without their agreement?
    common_errors:
      - Promising total confidentiality before knowing what the concern is.

  - external_key: behavioral.integrity_values.fixing_unfair_process
    competency_key: culture_values
    topic: Fixing a process that treated people unevenly
    difficulty: medium
    text: >-
      Have you noticed a team practice, such as how on-call shifts, interesting work or recognition were handed
      out, that wasn't fair to everyone? Tell me what you did about it.
    expected_concepts:
      - evidence that the practice was uneven
      - raising it with the people who owned the practice
      - proposing a transparent alternative
      - outcome and whether it stuck
    rubric:
      excellent: Brings evidence of the imbalance, proposes a transparent and practical alternative, gets it adopted, and checks whether it held.
      good: Raises the imbalance and suggests a change.
      weak: Notices but does nothing, or complains without a proposal.
    followups:
      - How did you gather evidence for it?
      - Who pushed back, and why?
    common_errors:
      - Raising it only when they personally were disadvantaged.

  - external_key: behavioral.integrity_values.asking_before_acting_when_unsure
    competency_key: culture_values
    topic: Checking before acting when unsure it is allowed
    difficulty: easy
    text: >-
      Tell me about a time you weren't sure whether something you were about to do at work was permitted, like
      sharing a file externally or using a new tool. How did you find out before going ahead?
    expected_concepts:
      - recognising the uncertainty rather than assuming
      - finding the relevant policy or owner
      - asking the right person and waiting for an answer when the risk justified it
      - sharing what they learned with teammates
    rubric:
      excellent: Describes pausing on a specific action, locating the relevant guidance or owner, acting on the answer, and passing it on so others did not face the same question.
      good: Checks with someone appropriate before acting.
      weak: Goes ahead and plans to ask forgiveness later, or cannot give an example.
    followups:
      - How long did it take to get an answer, and what did you do meanwhile?
      - How do you decide when something is worth checking?
    common_errors:
      - Assuming that if a tool lets you do something, it must be allowed.
