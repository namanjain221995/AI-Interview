# Behavioural: learning and feedback (part 3 of 4) - learning from peers and feedback from colleagues.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, reasoning, outcome, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ easy
  - external_key: behavioral.learning_feedback.staying_current
    competency_key: adaptability
    topic: Keeping job skills current alongside daily work
    difficulty: easy
    text: >-
      How do you keep the skills your job depends on up to date alongside day-to-day work? Give me a recent
      example of something you learned that way and then used.
    expected_concepts:
      - a sustainable learning routine
      - choosing what is relevant to the work
      - a specific recent example
      - applying it on real work
    rubric:
      excellent: Describes a sustainable routine focused on what the work needs and a specific recent example applied on real work with an outcome.
      good: Some routine and a credible example.
      weak: Lists sources without any example of applying what was learned.
    followups:
      - How do you decide what is worth learning?
    common_errors:
      - Listing newsletters or courses without application.

  - external_key: behavioral.learning_feedback.well_aimed_question
    competency_key: collaboration
    topic: A well-aimed question that saved time
    difficulty: easy
    text: >-
      Tell me about a time a well-aimed question to a colleague saved you a lot of time. How did you decide what
      to ask and whom to ask?
    expected_concepts:
      - the problem they faced
      - choosing who knew the answer
      - framing the question with context
      - time or effort saved
    rubric:
      excellent: Explains how they identified the right person, framed a precise question with context and quantifies the time or effort it saved.
      good: Asked a sensible question of the right person.
      weak: Example where asking was accidental or the question lacked context.
    followups:
      - How do you find the right person in a new organisation?
    common_errors:
      - No explanation of how they chose whom to ask.

  - external_key: behavioral.learning_feedback.learning_from_other_function
    competency_key: collaboration
    topic: Learning from a colleague in another function
    difficulty: easy
    text: >-
      Tell me about something you learned from a colleague in a different function, like support, sales or
      operations, that changed how you do your own job.
    expected_concepts:
      - the colleague's function and context
      - what they knew that you didn't
      - the change in your own work
      - benefit to users or the team
    rubric:
      excellent: Describes specific knowledge from the other function, a concrete change in their own work and the resulting benefit.
      good: Real learning with a reasonable change.
      weak: Generic statement about respecting other teams with no change.
    followups:
      - How did that conversation come about?
    common_errors:
      - Describing collaboration without anything learned.

  - external_key: behavioral.learning_feedback.tried_teammate_suggestion
    competency_key: adaptability
    topic: Trying a teammate's suggested technique
    difficulty: easy
    text: >-
      Tell me about a technique or practice a teammate suggested that you were unsure about at first but tried
      anyway. How did it go?
    expected_concepts:
      - the suggestion and their doubts
      - giving it a fair trial
      - judging the result
      - keeping, adapting or dropping it
    rubric:
      excellent: Gives the suggestion a fair, defined trial, judges it on results and explains whether they kept, adapted or dropped it and why.
      good: Tried it and reached a reasoned conclusion.
      weak: Tried it half-heartedly or dismissed it without trying.
    followups:
      - How long did you give it?
    common_errors:
      - Judging it before giving it a fair trial.

  - external_key: behavioral.learning_feedback.feedback_on_your_reviews
    competency_key: collaboration
    topic: Feedback on how you review others' work
    difficulty: easy
    text: >-
      Tell me about a time someone told you that your comments on their work weren't as helpful as they could
      have been. What did you change about how you review?
    expected_concepts:
      - what was unhelpful about the comments
      - understanding what the author needed
      - specific changes to how they review
      - response from authors afterwards
    rubric:
      excellent: Understands what the author needed, makes specific changes such as explaining reasons or separating essentials from preferences, and shows authors found later reviews more useful.
      good: Took the point and adjusted how they review.
      weak: Defends the original comments or makes no change.
    followups:
      - What does a useful review comment look like to you now?
    common_errors:
      - Assuming the author simply did not like being corrected.

  - external_key: behavioral.learning_feedback.handover_feedback
    competency_key: collaboration
    topic: What the next owner found hard about your work
    difficulty: easy
    text: >-
      Tell me about a time someone who took over a piece of your work told you what had been hard about picking it
      up. What did you change about how you hand work over?
    expected_concepts:
      - what the next owner struggled with
      - asking follow-up questions to understand fully
      - specific changes to handover practice
      - result in later handovers
    rubric:
      excellent: Draws out the specific difficulties, changes their handover practice in concrete ways such as recording decisions or walking through open risks, and shows later handovers went more smoothly.
      good: Made sensible changes to how they hand over work.
      weak: Puts the difficulty down to the new owner and changes nothing.
    followups:
      - Did you ask them for this, or did they tell you unprompted?
    common_errors:
      - Only adding more documents without addressing what was actually missing.

  - external_key: behavioral.learning_feedback.check_in_frequency
    competency_key: adaptability
    topic: Feedback on how often you checked in
    difficulty: easy
    text: >-
      Tell me about feedback that you were checking in with your lead or team too often, or not often enough. How
      did you work out the right balance?
    expected_concepts:
      - the feedback and the situation
      - understanding what the other person needed
      - criteria for when to check in
      - result of the adjustment
    rubric:
      excellent: Understands what the other person needed to know and when, sets clear criteria for checking in or escalating and shows the new balance worked.
      good: Adjusted sensibly after the feedback.
      weak: Swung to the opposite extreme without understanding the need.
    followups:
      - How do you agree this with a new lead now?
    common_errors:
      - Overcorrecting rather than agreeing clear criteria.

  - external_key: behavioral.learning_feedback.meeting_you_ran
    competency_key: communication
    topic: Feedback on a meeting or session you ran
    difficulty: easy
    text: >-
      Tell me about feedback you received on a meeting, workshop or session you ran. What did you change the next
      time you ran one?
    expected_concepts:
      - the session and its purpose
      - the feedback, whether asked for or offered
      - concrete changes such as agenda, preparation or follow-up
      - effect on the next session
    rubric:
      excellent: Describes specific feedback, concrete changes to preparation or structure and a noticeable improvement in how the next session went.
      good: Made reasonable changes after the feedback.
      weak: Cannot name specific changes, or dismissed the feedback.
    followups:
      - How do you gather feedback on sessions now?
    common_errors:
      - Describing the meeting without the feedback.

  - external_key: behavioral.learning_feedback.unexpected_channel
    competency_key: culture_values
    topic: Feedback that arrived through an unexpected channel
    difficulty: easy
    text: >-
      Tell me about a time you got feedback on your work through a channel you didn't expect, such as a survey
      comment, a support ticket or a public review. How did you follow up on it?
    expected_concepts:
      - the channel and the feedback
      - checking whether it was a one-off or a pattern
      - follow-up with the person or the data
      - change made as a result
    rubric:
      excellent: Takes the unexpected feedback seriously, checks whether it reflects a wider pattern, follows up where possible and makes a change.
      good: Followed up and acted on it.
      weak: Ignored it because it did not come through a normal route.
    followups:
      - Did you reply to the person who wrote it?
    common_errors:
      - Dismissing it as unrepresentative without checking.

  # ------------------------------------------------------------ medium
  - external_key: behavioral.learning_feedback.finding_outside_expert
    competency_key: collaboration
    topic: Finding expertise outside your team
    difficulty: medium
    text: >-
      Describe a time you needed knowledge nobody on your immediate team had. How did you find the right person,
      and how did you make the most of their time?
    expected_concepts:
      - recognising the knowledge gap
      - searching networks or other teams
      - preparing focused questions
      - capturing and sharing what was learned
    rubric:
      excellent: Finds the right expert efficiently, prepares focused questions, respects their time and captures the knowledge for the team.
      good: Found help and used it well.
      weak: Struggled alone for too long or used the expert's time poorly.
    followups:
      - How did you thank or credit them?
    common_errors:
      - Knowledge stayed in their head and was not shared.

  - external_key: behavioral.learning_feedback.learning_by_reviewing
    competency_key: adaptability
    topic: Learning from reviewing someone else's work
    difficulty: medium
    text: >-
      Tell me about something you learned while reviewing someone else's work. How did it change the way you do
      your own?
    expected_concepts:
      - the work reviewed
      - what was surprising or better than expected
      - asking the author about their reasoning
      - change in their own work
    rubric:
      excellent: Treats reviewing as a learning opportunity, asks the author about their reasoning and describes a concrete change in their own work.
      good: Learned something and applied it.
      weak: Sees reviewing only as catching others' mistakes.
    followups:
      - Did you tell the author what you learned?
    common_errors:
      - Only describing problems found in the review.

  - external_key: behavioral.learning_feedback.external_idea_adapted
    competency_key: adaptability
    topic: Adapting an outside idea to your context
    difficulty: medium
    text: >-
      Tell me about an idea you picked up from outside your team, such as a talk, an article or another
      organisation's practice, that you applied in your work. How did you adapt it to your context?
    expected_concepts:
      - the original idea and its source
      - differences between that context and theirs
      - adaptations made
      - results and any limits found
    rubric:
      excellent: Identifies the differences between the source context and their own, adapts the idea deliberately and reports results including limits.
      good: Applied the idea sensibly with some adaptation.
      weak: Copied the idea wholesale or never applied it.
    followups:
      - What part of the original didn't fit?
    common_errors:
      - Applying the idea without adapting it.

  - external_key: behavioral.learning_feedback.sought_mentor
    competency_key: adaptability
    topic: Seeking a mentor for a specific goal
    difficulty: medium
    text: >-
      Tell me about a time you sought out a mentor or adviser for a specific goal at work. How did you use that
      relationship, and what changed as a result?
    expected_concepts:
      - the goal and why a mentor would help
      - choosing and approaching the mentor
      - preparing for conversations
      - acting on the advice
      - outcome against the goal
    rubric:
      excellent: Chose a mentor for a clear goal, came prepared, acted on the advice between conversations and can show progress against the goal.
      good: Used a mentor productively with some outcome.
      weak: Relationship was unfocused or advice was not acted on.
    followups:
      - What advice did you choose not to follow?
    common_errors:
      - Describing a friendly relationship with no goal or outcome.

  - external_key: behavioral.learning_feedback.peer_feedback_exchange
    competency_key: collaboration
    topic: A regular feedback exchange with a peer
    difficulty: medium
    text: >-
      Tell me about a time you set up a regular way to swap feedback with a peer, such as reviewing each other's
      work or meeting to talk through what was going well. What did you get out of it?
    expected_concepts:
      - why they set it up and with whom
      - the format and frequency
      - keeping it candid and useful
      - specific improvements that came from it
    rubric:
      excellent: Sets up a clear, sustainable format, keeps it candid on both sides and names specific improvements in their work that came from it.
      good: Ran a useful exchange for a period with some benefit.
      weak: Arrangement was informal and faded with nothing specific gained.
    followups:
      - What made it last, or what made it stop?
    common_errors:
      - Describing a social catch-up rather than feedback.

  - external_key: behavioral.learning_feedback.learned_from_mentee
    competency_key: mentoring
    topic: Something you learned from someone you were helping
    difficulty: medium
    text: >-
      Describe a time someone you were coaching or onboarding changed how you approach a task. What did they
      do or ask that made you rethink it?
    expected_concepts:
      - the mentoring situation
      - the question or observation that revealed something
      - what they learned about their own practice
      - change they made
    rubric:
      excellent: Describes a specific question or observation from the newer person that exposed a gap or assumption in their own practice, and a concrete change that followed.
      good: Learned something real and acted on it.
      weak: Sees mentoring as one-way, or the lesson is generic.
    followups:
      - How did you encourage them to keep asking questions like that?
    common_errors:
      - Describing only what they taught.

  - external_key: behavioral.learning_feedback.colleague_observed_you
    competency_key: adaptability
    topic: Inviting a colleague to observe your work
    difficulty: medium
    text: >-
      Tell me about a time you asked a colleague to sit in on something you did, like a demo, a workshop or a
      customer call, specifically so they could give you feedback. What did they notice that you hadn't?
    expected_concepts:
      - why they invited an observer
      - briefing the observer on what to watch for
      - what the observer noticed
      - changes made afterwards
    rubric:
      excellent: Briefs the observer on what to look for, receives specific observations they had missed and shows a concrete change in later sessions.
      good: Used an observer and acted on what they saw.
      weak: Observer was informal with no specific findings or changes.
    followups:
      - What did you ask them to look for?
    common_errors:
      - Not telling the observer what to focus on.

  - external_key: behavioral.learning_feedback.feedback_on_helping_others
    competency_key: mentoring
    topic: Feedback on how you teach or help others
    difficulty: medium
    text: >-
      Tell me about feedback you got on the way you teach or help colleagues, for example that you gave answers
      too quickly or explained too much at once. What did you change?
    expected_concepts:
      - the feedback and who gave it
      - understanding how their approach affected the learner
      - a different approach tried
      - evidence the learner benefited
    rubric:
      excellent: Understands how their approach affected the learner, tries a specific alternative such as asking guiding questions and shows the learner became more independent.
      good: Adjusted their approach sensibly.
      weak: Believes their way of helping was fine and makes no change.
    followups:
      - How do you check now whether your help is working?
    common_errors:
      - Focusing on how much time they spent rather than whether it helped.

  - external_key: behavioral.learning_feedback.unsolicited_advice
    competency_key: adaptability
    topic: Advice you hadn't asked for
    difficulty: medium
    text: >-
      Tell me about a time a colleague offered you unrequested advice on your craft or methods. How did you weigh
      it, and where did you land?
    expected_concepts:
      - the advice and its source
      - evaluating it on its merits
      - the decision and reasoning
      - how they responded to the person
    rubric:
      excellent: Evaluates the advice on its merits regardless of how it arrived, makes a reasoned decision and responds to the person in a way that keeps future input coming.
      good: Considered the advice fairly and decided sensibly.
      weak: Rejects it because it was unsolicited, or follows it without thought.
    followups:
      - What would have made you reject it?
    common_errors:
      - Judging the advice by how it was delivered.

  - external_key: behavioral.learning_feedback.too_polite_feedback
    competency_key: culture_values
    topic: Feedback so gentle you nearly missed it
    difficulty: medium
    text: >-
      Tell me about a time feedback was put so gently that you nearly missed the point. How did you realise what
      was really being said, and what did you do?
    expected_concepts:
      - the original feedback and its softened form
      - what made them realise it was significant
      - checking the real message with the person
      - action taken
    rubric:
      excellent: Notices the underlying message, checks it directly with the person, acts on it and changes how they invite direct feedback.
      good: Realised the real message and acted on it.
      weak: Took it at face value with no reflection, or only realised much later and did nothing.
    followups:
      - How do you make it easier for people to be direct with you now?
    common_errors:
      - Blaming the other person for being unclear.

  - external_key: behavioral.learning_feedback.shared_feedback_with_team
    competency_key: collaboration
    topic: Sharing feedback you received so others could learn
    difficulty: medium
    text: >-
      Tell me about a time you shared feedback you had received with your team so they could learn from it too.
      Why did you share it, and what happened?
    expected_concepts:
      - the feedback and why it was relevant to others
      - how they shared it
      - what others did with it
      - effect on the team's openness to feedback
    rubric:
      excellent: Explains why the feedback was useful beyond themselves, shares it in a way that invites learning and shows changes in the team's work or openness as a result.
      good: Shared relevant feedback with some benefit to others.
      weak: Shared only positive feedback, or cannot say what happened afterwards.
    followups:
      - Was there anything you chose not to share?
    common_errors:
      - Sharing praise rather than something to learn from.

  # ------------------------------------------------------------ hard
  - external_key: behavioral.learning_feedback.expertise_losing_value
    competency_key: adaptability
    topic: When your expertise started losing value
    difficulty: hard
    text: >-
      Tell me about a time a change in your field meant some of your existing expertise was becoming less
      valuable. How did you respond, and where did you choose to invest your learning?
    expected_concepts:
      - the change and how they recognised it
      - assessing which skills still mattered
      - choosing where to invest
      - transition while delivering current work
      - result of the investment
    rubric:
      excellent: Recognises the shift early, assesses which skills transfer, makes a reasoned choice of where to invest and shows the result in their work.
      good: Responded to the change with a reasonable learning plan.
      weak: Resisted the change or responded only when forced.
    followups:
      - What did you decide not to learn?
    common_errors:
      - Describing a single course rather than a deliberate shift.

  - external_key: behavioral.learning_feedback.peers_vs_manager_view
    competency_key: adaptability
    topic: Peer feedback and your manager's view disagreed
    difficulty: hard
    text: >-
      Tell me about a time the feedback from people you worked with every day painted a different picture from
      your manager's assessment of you. How did you make sense of it, and what did you do?
    expected_concepts:
      - the two pictures and where they differed
      - understanding what each source could see
      - specifics gathered from both
      - action taken on each
      - raising the gap with the manager where useful
    rubric:
      excellent: Recognises what each source could and could not see, gathers specifics from both, acts on valid points from each and raises the gap with the manager constructively.
      good: Reconciled the two views reasonably and acted.
      weak: Accepts whichever view was more favourable.
    followups:
      - How did you raise the difference with your manager?
    common_errors:
      - Choosing the more flattering view.

  - external_key: behavioral.learning_feedback.expert_hard_to_challenge
    competency_key: leadership
    topic: Getting feedback as the most experienced person
    difficulty: hard
    text: >-
      Tell me about a time being the most experienced person in the room made it harder for others to give you
      feedback. What did you do to change that?
    expected_concepts:
      - signs that people were holding back
      - specific actions to invite challenge
      - acting visibly on input received
      - evidence feedback started flowing
    rubric:
      excellent: Spots that people were holding back, takes specific steps such as asking for critique first or acting visibly on input, and shows more challenge came as a result.
      good: Took some steps that made feedback easier to give.
      weak: Assumes people would speak up if they had something to say.
    followups:
      - What did you do when someone did challenge you?
    common_errors:
      - Saying their door was always open with no specific action.

  - external_key: behavioral.learning_feedback.changing_feedback_sources
    competency_key: leadership
    topic: Finding new sources of feedback as responsibility grows
    difficulty: hard
    text: >-
      As you've taken on more responsibility, how have the sources of useful feedback on your work changed? Tell
      me about a time you had to find new ones.
    expected_concepts:
      - why earlier sources stopped being enough
      - identifying new sources such as peers at the same level or stakeholders
      - setting up those relationships
      - something learned from a new source
    rubric:
      excellent: Explains why feedback gets scarcer or less direct with more responsibility, deliberately builds new sources and gives a specific lesson that came from one of them.
      good: Recognised the shift and found new sources.
      weak: Relies on the same sources as before, or on formal reviews only.
    followups:
      - Who gives you the most useful feedback today?
    common_errors:
      - Not recognising that feedback becomes less direct with seniority.

  - external_key: behavioral.learning_feedback.redo_signed_off_work
    competency_key: ownership
    topic: Reworking signed-off work after new feedback
    difficulty: hard
    text: >-
      Tell me about a time acting on feedback meant reworking something that had already been approved or praised.
      How did you decide it was worth it, and how did you handle it with the people involved?
    expected_concepts:
      - the feedback and the approved work
      - weighing cost of rework against the risk of leaving it
      - communicating with those who approved it
      - the rework and its outcome
    rubric:
      excellent: Weighs the cost of rework against the risk of leaving it, explains the decision openly to those who approved the work and delivers the improved result.
      good: Made a reasoned decision and communicated it.
      weak: Left a known problem in place to avoid the conversation, or reworked without telling anyone.
    followups:
      - How did the approvers react?
    common_errors:
      - Not involving the people who approved the original work.
