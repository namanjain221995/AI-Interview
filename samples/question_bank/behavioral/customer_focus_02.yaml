# Behavioural: customer focus (part 2 of 4) - balancing customer needs with constraints.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ everyday trade-offs (easy)
  - external_key: behavioral.customer_focus.declining_a_request
    competency_key: culture_values
    topic: Turning down a customer request
    difficulty: easy
    text: >-
      Tell me about a time you had to tell a customer or user that you couldn't do what they asked. How did
      you handle that conversation, and where did things end up?
    expected_concepts:
      - the request and why it couldn't be done
      - understanding the need behind it first
      - clear explanation of the reason
      - alternative or partial option offered
      - state of the relationship afterwards
    rubric:
      excellent: Understands the need first, explains the constraint plainly, offers a real alternative or next step, and shows the customer remained able to get their goal met some other way.
      good: Declines clearly with a reason and some attempt to help.
      weak: Avoids the conversation, gives a vague answer, or leaves the customer with no path forward.
    followups:
      - What alternative did you offer?
      - Did you follow up with them later?
    common_errors:
      - Saying "maybe later" to avoid a clear answer.

  - external_key: behavioral.customer_focus.realistic_timeline
    competency_key: culture_values
    topic: Giving a customer a realistic timeline
    difficulty: easy
    text: >-
      Tell me about a time a customer wanted something sooner than you could realistically deliver it. What
      did you tell them, and how did you work out what to promise?
    expected_concepts:
      - customer's deadline and why it mattered to them
      - how the estimate was built
      - what was promised and with what caveats
      - interim help offered
      - whether the promise was kept
    rubric:
      excellent: Understands why the date mattered, gives an evidence-based estimate with clear caveats, offers interim help, and delivers on what was promised.
      good: Sets a realistic expectation and keeps the customer informed.
      weak: Agrees to an unrealistic date to avoid friction, or gives no date at all.
    followups:
      - What did you do when it started to slip?
      - What interim help did you offer?
    common_errors:
      - Promising the customer's date first and checking feasibility afterwards.

  - external_key: behavioral.customer_focus.keeping_user_updated
    competency_key: communication
    topic: Keeping a waiting user informed
    difficulty: easy
    text: >-
      Describe a time a user was waiting on you for a fix or an answer that took longer than expected. How did
      you keep them informed while they waited?
    expected_concepts:
      - what the user was waiting for and its impact
      - update cadence and channel
      - content of updates (what's known, next step, next update time)
      - any workaround offered
      - closing the loop at the end
    rubric:
      excellent: Sets and keeps a clear update cadence, gives useful substance in each update including next steps, offers a workaround where possible and closes the loop.
      good: Proactively updates the user at reasonable intervals.
      weak: Only responds when the user chases them.
    followups:
      - What did you do when you had nothing new to say?
      - How did the user respond to the delay?
    common_errors:
      - Going quiet until there is good news.

  - external_key: behavioral.customer_focus.quick_fix_or_proper_fix
    competency_key: culture_values
    topic: Quick relief versus a proper fix
    difficulty: easy
    text: >-
      Tell me about a time you had to choose between getting a user unblocked quickly with a temporary fix and
      taking longer to fix the problem properly. What did you choose, and why?
    expected_concepts:
      - severity and urgency for the user
      - risks of the temporary fix
      - decision and reasoning
      - plan and follow-through for the proper fix
    rubric:
      excellent: Weighs user urgency against the risks of the shortcut, makes a reasoned choice, and shows that the proper fix was actually scheduled and delivered.
      good: Makes a sensible choice and explains the reasoning.
      weak: Takes the shortcut with no follow-up, or delays the user without justification.
    followups:
      - Did the temporary fix ever get replaced?
      - Who else did you consult before deciding?
    common_errors:
      - Leaving temporary fixes in place indefinitely.

  - external_key: behavioral.customer_focus.one_customer_many_users
    competency_key: product_sense
    topic: One customer's request versus the wider user base
    difficulty: easy
    text: >-
      Tell me about a time one customer asked for a change that would have helped them but might have made
      things worse or more complicated for other users. How did you approach it?
    expected_concepts:
      - the request and the customer's goal
      - impact on other users considered
      - options such as configuration or a general solution
      - decision made and communicated
    rubric:
      excellent: Understands the requesting customer's goal, assesses the effect on other users, finds a solution that serves both or clearly explains the trade-off, and communicates it.
      good: Considers wider impact before making the change.
      weak: Builds the one-off change without considering anyone else, or refuses without exploring options.
    followups:
      - How did you find out how other users would be affected?
      - What did the requesting customer think of the outcome?
    common_errors:
      - Adding a special case for every customer request.

  - external_key: behavioral.customer_focus.cutting_scope_for_users
    competency_key: product_sense
    topic: Cutting scope while protecting what users need most
    difficulty: easy
    text: >-
      Tell me about a time you had to cut scope to meet a deadline. How did you decide what to keep so that
      users still got something genuinely useful?
    expected_concepts:
      - the deadline and why it was fixed
      - how user value was assessed for each piece
      - what was cut and what was protected
      - communication to users or stakeholders
      - result after release
    rubric:
      excellent: Prioritises by what users most need to get their job done, protects a complete core journey, communicates what is missing and plans the follow-up.
      good: Makes reasonable cuts with user value in mind.
      weak: Cuts by ease of implementation without regard for what users need.
    followups:
      - Did users notice what was missing?
      - What did you learn from what users did with the reduced version?
    common_errors:
      - Shipping half of several features instead of one complete one.

  - external_key: behavioral.customer_focus.policy_vs_customer
    competency_key: culture_values
    topic: A rule that got in a customer's way
    difficulty: easy
    text: >-
      Tell me about a time a company rule or process stood between a customer and what they needed. What did
      you do?
    expected_concepts:
      - the rule and why it existed
      - the customer's need and impact
      - working within or changing the rule through proper channels
      - outcome for the customer
      - any lasting change to the rule
    rubric:
      excellent: Understands why the rule exists, finds a legitimate way to help the customer or escalates through the right channel, and pushes for the rule to be improved if it was flawed.
      good: Helps the customer within the rules or escalates appropriately.
      weak: Either breaks the rule without authority or hides behind it without trying to help.
    followups:
      - Did the rule change afterwards?
      - Who did you need to involve?
    common_errors:
      - Bypassing a control quietly to please a customer.

  - external_key: behavioral.customer_focus.asked_for_more_time
    competency_key: culture_values
    topic: Taking extra time to get it right for users
    difficulty: easy
    text: >-
      Tell me about a time you pushed for more time or effort on something because you believed users would
      be hurt by shipping it as it was. How did you make the case?
    expected_concepts:
      - the specific quality concern and its user impact
      - evidence presented
      - proposal for how much more time and why
      - decision reached
      - outcome after release
    rubric:
      excellent: Makes a specific, evidence-based case about user impact, proposes a bounded extension, accepts the decision gracefully and shows how it played out.
      good: Raises a concrete user-impact concern and argues for it reasonably.
      weak: Delays on the basis of personal standards without showing user impact.
    followups:
      - What would you have done if the answer was no?
      - Was the extra time justified in hindsight?
    common_errors:
      - Framing perfectionism as user advocacy.

  - external_key: behavioral.customer_focus.free_tier_users
    competency_key: culture_values
    topic: Serving users who bring little revenue
    difficulty: easy
    text: >-
      Tell me about a time you had to decide how much effort to put into helping users who weren't paying
      much, such as free or small accounts. How did you think about it?
    expected_concepts:
      - the user group and their needs
      - constraint on time or cost
      - scalable ways to help (docs, self-service, community)
      - decision and its effect on those users
    rubric:
      excellent: Acknowledges the cost constraint openly but finds scalable ways to serve those users well, and explains the reasoning behind the level of effort.
      good: Makes a reasoned decision and offers some way to help them.
      weak: Dismisses them entirely or gives unlimited effort without considering cost.
    followups:
      - What self-service options did you improve?
      - Did any of those users become larger customers?
    common_errors:
      - Treating low-revenue users as unimportant by default.

  # ------------------------------------------------------------ hard trade-offs (medium)
  - external_key: behavioral.customer_focus.security_vs_convenience
    competency_key: culture_values
    topic: Security requirements that inconvenienced users
    difficulty: medium
    text: >-
      Tell me about a time a security or compliance requirement made things harder for users. How did you
      meet the requirement while keeping the experience as reasonable as possible?
    expected_concepts:
      - the requirement and why it was non-negotiable
      - the user friction it introduced
      - design options to reduce friction
      - how users were prepared for the change
      - result on both security and usability
    rubric:
      excellent: Treats the requirement as fixed but explores options to minimise friction, prepares users, and shows the result met the requirement with measured impact on users.
      good: Meets the requirement with some effort to ease the user impact.
      weak: Either weakens the requirement or ignores the user friction.
    followups:
      - What did users complain about most?
      - Which friction did you decide was worth keeping?
    common_errors:
      - Treating usability and security as an either/or choice.

  - external_key: behavioral.customer_focus.big_customer_pressure
    competency_key: stakeholder_management
    topic: Pressure from a large customer
    difficulty: medium
    text: >-
      Tell me about a time a large or important customer pushed hard for something that didn't fit your plans
      or product direction. How did you handle the pressure?
    expected_concepts:
      - the customer's demand and its business weight
      - understanding of the underlying need
      - options explored
      - involving internal stakeholders such as sales or leadership
      - outcome for the customer and the product
    rubric:
      excellent: Separates the need from the demand, involves the right internal people, finds a solution that keeps the customer without distorting the product, and explains the trade-offs openly.
      good: Handles the pressure with a reasoned decision and clear communication.
      weak: Gives in automatically or refuses without engaging with the customer's need.
    followups:
      - Who in your organisation did you bring in, and when?
      - What did it cost you to make that decision?
    common_errors:
      - Assuming the largest customer is always right.

  - external_key: behavioral.customer_focus.overpromise_by_sales
    competency_key: stakeholder_management
    topic: A customer told something that wasn't true
    difficulty: medium
    text: >-
      Tell me about a time a customer had been told something by someone in your organisation that your team
      couldn't deliver. How did you handle it with the customer and internally?
    expected_concepts:
      - what was promised and by whom
      - assessment of what could actually be done
      - aligning internally before talking to the customer
      - clear and timely conversation with the customer
      - preventing it happening again
    rubric:
      excellent: Aligns internally first without blame, gives the customer an accurate picture and a workable plan quickly, and fixes the process that let the gap happen.
      good: Corrects the expectation with the customer and coordinates internally.
      weak: Blames the colleague in front of the customer, or lets the false expectation stand.
    followups:
      - How did you talk to the colleague who made the promise?
      - What changed in how commitments are made?
    common_errors:
      - Delivering an unsustainable heroic effort instead of resetting expectations.

  - external_key: behavioral.customer_focus.consistency_vs_customisation
    competency_key: product_sense
    topic: Custom work for one customer
    difficulty: medium
    text: >-
      Describe a time you were asked to build something custom for a single customer. How did you decide
      whether to do it, and how did you limit the long-term cost?
    expected_concepts:
      - customer request and business context
      - long-term maintenance cost considered
      - whether it could be generalised
      - safeguards (configuration, isolation, expiry)
      - outcome over time
    rubric:
      excellent: Weighs the business value against long-term cost, generalises where possible, isolates what can't be, and shows awareness of how it played out over time.
      good: Makes a reasoned decision that considers maintenance cost.
      weak: Builds it without considering long-term cost, or refuses without exploring.
    followups:
      - Did any other customer end up using it?
      - How much maintenance did it end up needing?
    common_errors:
      - Ignoring the cost of carrying custom code for years.

  - external_key: behavioral.customer_focus.cost_reduction_user_impact
    competency_key: culture_values
    topic: Cost cuts that could affect users
    difficulty: medium
    text: >-
      Tell me about a time you were asked to reduce cost or effort on something users relied on. How did you
      protect the user experience while still making the savings?
    expected_concepts:
      - the savings target and why
      - which parts of the experience users valued most
      - options analysed and their user impact
      - choice made and how impact was monitored
      - result for both cost and users
    rubric:
      excellent: Identifies what users valued most, delivers the savings mainly from areas users wouldn't miss, monitors user impact and adjusts if needed.
      good: Makes savings with deliberate attention to user impact.
      weak: Cuts across the board without considering what users depend on.
    followups:
      - How would you have known if users were being hurt?
      - What did you refuse to cut?
    common_errors:
      - Treating every cost reduction as invisible to users.

  - external_key: behavioral.customer_focus.privacy_tradeoff
    competency_key: culture_values
    topic: Protecting users' data when it would be easier not to
    difficulty: medium
    text: >-
      Tell me about a time you pushed to handle users' personal data more carefully than the easiest approach
      would have. What was the situation, and how did it turn out?
    expected_concepts:
      - the data involved and the risk to users
      - the easier approach and why it was a concern
      - alternative proposed (minimisation, retention limits, access control)
      - persuading others
      - result and trade-offs accepted
    rubric:
      excellent: Identifies the concrete risk to users, proposes a practical alternative, wins support through reasoning, and accepts sensible trade-offs.
      good: Raises a real privacy concern and gets a safer approach adopted.
      weak: Raises a vague concern without a proposal or follow-through.
    followups:
      - What did the safer approach cost the team?
      - How did you explain the risk to people who didn't see it?
    common_errors:
      - Raising privacy concerns only in abstract terms.

  - external_key: behavioral.customer_focus.legacy_customers_blocking_change
    competency_key: culture_values
    topic: Long-time customers resisting a needed change
    difficulty: medium
    text: >-
      Tell me about a time existing customers resisted a change you believed was necessary. How did you
      balance their concerns against the reasons for changing?
    expected_concepts:
      - the change and its rationale
      - specific concerns of existing customers
      - adjustments made in response
      - support and transition offered
      - outcome and adoption
    rubric:
      excellent: Listens to specific concerns, adjusts the change where concerns were valid, supports customers through the transition and achieves adoption without losing them.
      good: Engages with concerns and offers transition support.
      weak: Pushes the change through without engaging, or abandons it at the first objection.
    followups:
      - Which concern changed your plan?
      - Did you lose any customers, and what did you learn?
    common_errors:
      - Treating resistance as a communication problem only.

  - external_key: behavioral.customer_focus.shipping_known_issue
    competency_key: culture_values
    topic: Releasing with a known limitation
    difficulty: medium
    text: >-
      Tell me about a time you released something you knew had a limitation or a known issue. How did you
      decide it was acceptable for users, and what did you do to reduce the impact?
    expected_concepts:
      - the limitation and who it affected
      - reasoning for releasing anyway
      - mitigation (documentation, workaround, feature flag)
      - telling affected users
      - follow-up fix
    rubric:
      excellent: Assesses who is affected and how badly, releases only with mitigation and clear disclosure, and follows through on the fix.
      good: Releases with a reasonable rationale and some mitigation.
      weak: Releases silently and hopes users don't notice.
    followups:
      - How did you tell users about the limitation?
      - How long did the fix take?
    common_errors:
      - Not documenting the known issue for support or users.

  - external_key: behavioral.customer_focus.support_load_tradeoff
    competency_key: product_sense
    topic: Designing to reduce support contacts
    difficulty: medium
    text: >-
      Tell me about a time you changed something specifically so that users wouldn't need to contact support
      as often. How did you choose what to change, and what happened?
    expected_concepts:
      - analysis of contact reasons
      - choice of highest-impact cause
      - change to product, docs or self-service
      - measurement of contact rate before and after
    rubric:
      excellent: Analyses contact data to find the highest-impact cause, makes a targeted change, and shows a measurable drop in contacts while users still got their problem solved.
      good: Makes a sensible change that reduces support need.
      weak: Hides the contact option to reduce volume.
    followups:
      - How did you make sure users still got help when they needed it?
      - What did the support team think of the change?
    common_errors:
      - Reducing contacts by making help harder to find.

  - external_key: behavioral.customer_focus.migration_burden_on_users
    competency_key: culture_values
    topic: Minimising the work a change put on users
    difficulty: medium
    text: >-
      Tell me about a change your team made that required users to do some work, like updating settings,
      integrations or habits. What did you do to keep that burden as small as possible?
    expected_concepts:
      - what users had to do and why
      - automation or tooling to reduce effort
      - documentation and notice provided
      - tracking progress and helping laggards
      - result
    rubric:
      excellent: Minimises user effort through automation or tooling, gives clear guidance and notice, tracks adoption, and actively helps those who are stuck.
      good: Provides reasonable guidance and support for the change.
      weak: Announces the change and leaves users to work it out.
    followups:
      - What could you have automated that you didn't?
      - How did you handle users who missed the deadline?
    common_errors:
      - Measuring success only by the change shipping, not by users completing their part.

  - external_key: behavioral.customer_focus.usage_limits_heavy_users
    competency_key: culture_values
    topic: Introducing limits that affected heavy users
    difficulty: medium
    text: >-
      Tell me about a time you had to introduce or tighten a limit, such as a quota, rate limit or size cap,
      that affected some of your heaviest users. How did you set the limit and bring those users along?
    expected_concepts:
      - why the limit was needed (cost, fairness, stability)
      - data on who would be affected and how much
      - choice of limit level and any grace period or exceptions
      - advance notice and guidance for affected users
      - outcome for stability and for those users
    rubric:
      excellent: Uses usage data to set a limit that protects the system while affecting as few users as possible, contacts the most affected users in advance with options, and tracks the impact after rollout.
      good: Sets a reasoned limit and gives affected users notice.
      weak: Picks an arbitrary limit and lets users discover it through failures.
    followups:
      - How did you handle users who had a legitimate need above the limit?
      - What did the data show after the limit went live?
    common_errors:
      - Rolling out a limit without telling the users it would hit.

  # ------------------------------------------------------------ hard trade-offs (hard)
  - external_key: behavioral.customer_focus.revenue_vs_user_interest
    competency_key: culture_values
    topic: A business goal that worked against users
    difficulty: hard
    text: >-
      Tell me about a time you were asked to build or support something that would help a business number but
      that you felt worked against users' interests. What did you do?
    expected_concepts:
      - the business goal and the concern for users
      - evidence or reasoning about user harm
      - raising it through the right channels
      - alternative proposed that met both goals
      - outcome and what they would do differently
    rubric:
      excellent: Articulates a concrete user harm, raises it with evidence through appropriate channels, proposes an alternative that serves the business goal without the harm, and describes the actual outcome.
      good: Raises the concern clearly and tries to find a better option.
      weak: Either went along silently or objected without offering any alternative.
    followups:
      - What would you have done if leadership insisted?
      - How did you avoid simply being seen as blocking?
    common_errors:
      - Assuming any business metric is inherently opposed to users.

  - external_key: behavioral.customer_focus.reliability_vs_features
    competency_key: product_sense
    topic: Reliability work versus new features users asked for
    difficulty: hard
    text: >-
      Describe a time you had to choose between investing in reliability or performance and delivering
      features customers were actively requesting. How did you make the decision, and how did you explain it
      to customers?
    expected_concepts:
      - the reliability or performance problem and its user impact
      - the requested features and their demand
      - data used to compare impact
      - decision and sequencing
      - communication to customers and stakeholders
    rubric:
      excellent: Quantifies the user impact of both options, makes a defensible sequencing decision, and explains it to customers in terms of their own outcomes.
      good: Weighs both sides with some data and reaches a reasoned decision.
      weak: Defaults to whichever side is more visible without analysis.
    followups:
      - How did customers who wanted features react?
      - How did you know the reliability work paid off?
    common_errors:
      - Assuming users don't value invisible reliability work.

  - external_key: behavioral.customer_focus.contract_vs_right_thing
    competency_key: culture_values
    topic: Going beyond what a contract required
    difficulty: hard
    text: >-
      Tell me about a time what you were contractually or formally obliged to give a customer fell short of
      what they actually needed. How did you decide how far to go, and who did you involve?
    expected_concepts:
      - the gap between obligation and need
      - business and precedent considerations
      - who was involved in the decision
      - what was offered and on what terms
      - outcome for relationship and business
    rubric:
      excellent: Recognises the gap, weighs precedent and cost with the right decision-makers, offers a sustainable response, and explains how it affected the relationship.
      good: Makes a reasoned decision involving others to serve the customer beyond the minimum.
      weak: Either sticks rigidly to the contract without engaging, or gives away unlimited effort without authority.
    followups:
      - What precedent did it set?
      - Would you make the same call again?
    common_errors:
      - Committing the organisation to ongoing obligations without authority.

  - external_key: behavioral.customer_focus.saying_no_to_whole_segment
    competency_key: product_sense
    topic: Deciding not to serve a group of customers
    difficulty: hard
    text: >-
      Tell me about a time you or your team decided to stop serving, or not to pursue, a particular group of
      customers because their needs pulled the product in the wrong direction. How did you reach that decision
      and handle those customers?
    expected_concepts:
      - the customer group and their divergent needs
      - analysis of cost and strategic fit
      - stakeholders involved in the decision
      - how existing customers in the group were treated
      - outcome for the product and those customers
    rubric:
      excellent: Bases the decision on clear evidence about fit and cost, involves the right people, treats affected customers fairly with notice and alternatives, and reflects on the outcome.
      good: Reaches a reasoned decision and handles affected customers responsibly.
      weak: Drops customers abruptly or cannot explain the reasoning.
    followups:
      - What did you offer the customers you stopped serving?
      - Did the decision achieve what you hoped?
    common_errors:
      - Treating affected existing customers as an afterthought.

  - external_key: behavioral.customer_focus.regulated_deadline_user_impact
    competency_key: culture_values
    topic: An external deadline that forced a rough change on users
    difficulty: hard
    text: >-
      Tell me about a time an external deadline, such as a regulation or a partner shutting something down,
      forced a change on users that you couldn't fully polish in time. How did you limit the harm to users?
    expected_concepts:
      - the external constraint and its fixed date
      - which users and journeys were most at risk
      - prioritisation of mitigation work
      - communication and support preparation
      - follow-up improvements after the deadline
    rubric:
      excellent: Identifies the most affected users early, focuses limited time on the highest-harm journeys, prepares support and users clearly, and follows up with improvements after the deadline.
      good: Meets the deadline with reasonable mitigation for users.
      weak: Meets the deadline with no attention to user impact.
    followups:
      - What did you decide to leave rough, and why?
      - How did you prepare the support team?
    common_errors:
      - Never returning to polish once the deadline has passed.
