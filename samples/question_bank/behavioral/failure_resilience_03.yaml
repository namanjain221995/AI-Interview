# Behavioural: failure and resilience (part 3 of 4) - mistakes in teams, reviews and handovers,
# helping others recover, preventing recurrence and leading through failure. Questions ask for real
# past examples; evaluation is based only on the content of the example (actions, results,
# reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------ everyday team situations (easy)
  - external_key: behavioral.failure_resilience.review_meeting_action_owned
    competency_key: ownership
    topic: Carrying out an action from a post-mortem
    difficulty: easy
    text: >-
      Think of a review or retrospective after something went wrong where you picked up one of the follow-up
      actions. What was the action, and how did you make sure it actually got done?
    expected_concepts:
      - what went wrong and what the review concluded
      - the specific action they owned
      - steps to complete it despite other priorities
      - checking whether it had the intended effect
    rubric:
      excellent: Describes a specific action they owned, how they protected time to finish it, and evidence that it addressed the original problem.
      good: Completes the action and explains its purpose.
      weak: Took an action that was never finished, or cannot describe any action they owned.
    followups:
      - What happens to unfinished follow-up actions on your team?
    common_errors:
      - Describing the review discussion rather than the action they owned.

  - external_key: behavioral.failure_resilience.teammate_mistake_hit_you
    competency_key: collaboration
    topic: When a teammate's mistake affected your work
    difficulty: easy
    text: >-
      Tell me about a time a teammate's mistake caused problems for your work. How did you respond to them, and
      what did the two of you do afterwards?
    expected_concepts:
      - the mistake and its effect on their work
      - raising it directly and without blame
      - working together on the fix
      - preventing a repeat jointly
    rubric:
      excellent: Raises the issue directly and constructively, focuses on fixing the problem together, and agrees a change that helps prevent it again.
      good: Handles it professionally and gets it resolved.
      weak: Complains to others or escalates without talking to the teammate.
    followups:
      - How did your teammate react when you raised it?
    common_errors:
      - Going around the teammate before talking to them.

  - external_key: behavioral.failure_resilience.gave_wrong_advice
    competency_key: communication
    topic: Giving advice that turned out to be wrong
    difficulty: easy
    text: >-
      Tell me about a time you gave someone an answer or advice at work that turned out to be wrong. How did you
      find out, and what did you do about it?
    expected_concepts:
      - the advice and its consequences
      - how the error was discovered
      - going back to the person to correct it
      - checking before giving advice now
    rubric:
      excellent: Goes back to the person promptly with the correction, helps undo any effects, and describes how they now signal uncertainty or verify before answering.
      good: Corrects the advice once aware.
      weak: Lets it go uncorrected or blames the person for relying on it.
    followups:
      - How do you show how sure you are when you answer now?
    common_errors:
      - Not following up with the person who acted on the advice.

  - external_key: behavioral.failure_resilience.habit_born_from_mistake
    competency_key: ownership
    topic: A working habit that came from a mistake
    difficulty: easy
    text: >-
      What's one working habit or checklist you follow today because of a mistake you once made? Tell me the story
      behind it.
    expected_concepts:
      - the original mistake
      - why that habit addresses it
      - how consistently it is used
      - a time it has paid off since
    rubric:
      excellent: Links a specific habit to a specific mistake, explains why it works, and gives an example of it catching a problem since.
      good: Describes a real habit and its origin.
      weak: Names a generic habit with no connection to a real mistake.
    followups:
      - Have you shared that habit with anyone else?
    common_errors:
      - Describing a habit without the story that led to it.

  - external_key: behavioral.failure_resilience.missed_issue_in_review
    competency_key: ownership
    topic: Missing a problem in something you reviewed
    difficulty: easy
    text: >-
      Tell me about a time you reviewed or approved someone else's work and missed a problem that later caused
      trouble. What did you take away about how you review?
    expected_concepts:
      - what was reviewed and what was missed
      - why it was missed
      - sharing responsibility with the author
      - change in review approach
    rubric:
      excellent: Accepts their share of responsibility as reviewer, explains why the problem was missed, and describes a specific change to how they review.
      good: Acknowledges the miss and adjusts their reviews.
      weak: Places the responsibility entirely on the author.
    followups:
      - How much time do you give reviews now compared with then?
    common_errors:
      - Treating review as a formality with no shared responsibility.

  - external_key: behavioral.failure_resilience.rejected_by_approver
    competency_key: ownership
    topic: Work rejected by an approver
    difficulty: easy
    text: >-
      Describe a time something you submitted for approval, such as a proposal, a deliverable or a request, was
      rejected. How did you work out what was missing, and what happened when you resubmitted?
    expected_concepts:
      - what was submitted and why it was rejected
      - seeking clarity on the approver's criteria
      - specific improvements made
      - result of the resubmission
    rubric:
      excellent: Asks for the approver's criteria, makes targeted improvements, and gets a successful result while changing how they prepare future submissions.
      good: Fixes the gaps and resubmits successfully.
      weak: Resubmits unchanged or gives up.
    followups:
      - Could you have checked the criteria before submitting?
    common_errors:
      - Not asking why it was rejected.

  - external_key: behavioral.failure_resilience.handover_gap
    competency_key: collaboration
    topic: Something lost in a handover
    difficulty: easy
    text: >-
      Tell me about a handover, to you or from you, where something important fell through the cracks. What was
      missed, and how do you hand work over now?
    expected_concepts:
      - the handover and what was lost
      - the consequence
      - their own part in the gap
      - a better handover practice
    rubric:
      excellent: Identifies precisely what was lost and their part in it, describes the fix, and gives a concrete handover practice they use now.
      good: Explains the gap and a better approach.
      weak: Blames the other person entirely.
    followups:
      - What do you always include in a handover now?
    common_errors:
      - Treating handover as only sending documents.

  - external_key: behavioral.failure_resilience.shortcut_backfired
    competency_key: ownership
    topic: A shortcut that came back to bite you
    difficulty: easy
    text: >-
      Tell me about a shortcut you took to save time that came back to cause problems later. What did it end up
      costing, and how do you weigh shortcuts now?
    expected_concepts:
      - the shortcut and why it was taken
      - the later cost
      - fixing the consequences
      - how they decide on shortcuts now
    rubric:
      excellent: Compares the time saved with the later cost, fixes the consequences, and describes a reasoned approach to shortcuts such as recording them or agreeing them with others.
      good: Recognises the cost and changes their approach somewhat.
      weak: Thinks the shortcut was still fine, or never takes shortcuts at all.
    followups:
      - Is there a shortcut you'd still take today?
    common_errors:
      - Concluding that shortcuts are always wrong.

  - external_key: behavioral.failure_resilience.worked_on_wrong_priority
    competency_key: ownership
    topic: Working on the wrong priority
    difficulty: easy
    text: >-
      Describe a time you spent your effort on something that turned out not to be the priority, while something
      more important slipped. How did that happen, and how do you check your priorities now?
    expected_concepts:
      - what they worked on and what slipped
      - why priorities were misread
      - recovering the important work
      - checking priorities regularly
    rubric:
      excellent: Explains how the priority was misread, recovers the slipped work, and describes a concrete practice for confirming priorities with others.
      good: Recognises the mistake and adjusts.
      weak: Blames unclear direction with no change of their own.
    followups:
      - Who could you have asked to check?
    common_errors:
      - No mechanism for confirming priorities.

  # ------------------------------------------------------------ helping others and preventing repeats (medium)
  - external_key: behavioral.failure_resilience.helped_colleague_recover
    competency_key: mentoring
    topic: Helping a colleague recover from a mistake
    difficulty: medium
    text: >-
      Tell me about a time you helped a colleague recover after they made a significant mistake. What did you do
      to help them fix it and learn from it?
    expected_concepts:
      - the mistake and its impact
      - practical help with the fix
      - helping them understand the cause
      - keeping the focus on learning not blame
      - outcome for the colleague
    rubric:
      excellent: Gives practical help with the fix, guides the colleague to understand the cause themselves, keeps the focus on learning, and shows the colleague handled similar situations better later.
      good: Helps fix the problem and offers useful advice.
      weak: Takes over and fixes it without helping them learn, or criticises them.
    followups:
      - How did you decide how much to help versus let them do it?
    common_errors:
      - Fixing it for them so they learn nothing.

  - external_key: behavioral.failure_resilience.made_it_safe_to_report
    competency_key: culture_values
    topic: Making it safe to report mistakes
    difficulty: medium
    text: >-
      Tell me about something you did to make it easier for people around you to admit mistakes or report
      problems early. What changed as a result?
    expected_concepts:
      - the problem with how mistakes were handled
      - specific actions (modelling, blameless reviews, how reports are received)
      - responding well when someone reports a problem
      - evidence of earlier reporting
    rubric:
      excellent: Describes specific actions such as sharing their own mistakes or changing how reports are received, and shows evidence that problems were raised earlier afterwards.
      good: Takes some real actions toward openness.
      weak: Talks only in general terms about valuing openness.
    followups:
      - How did you respond the first time someone reported a mistake after that?
    common_errors:
      - Stating values without concrete actions.

  - external_key: behavioral.failure_resilience.one_off_fix_to_safeguard
    competency_key: ownership
    topic: Turning a one-off fix into a lasting safeguard
    difficulty: medium
    text: >-
      Describe a time you went beyond fixing a single failure and changed the process or system so that whole
      kind of failure couldn't easily happen again. How did you get people to adopt it?
    expected_concepts:
      - the original failure
      - identifying the class of failure
      - the systemic safeguard
      - getting buy-in and adoption
      - evidence it prevented repeats
    rubric:
      excellent: Generalises from one failure to a class of failures, designs a safeguard proportionate to the risk, wins adoption, and shows evidence it prevented repeats.
      good: Introduces a reasonable systemic fix.
      weak: Fixes only the single instance.
    followups:
      - Did the safeguard have any downsides?
    common_errors:
      - Adding heavy process that people work around.

  - external_key: behavioral.failure_resilience.ignored_warning_signs
    competency_key: ownership
    topic: Warning signs you did not act on
    difficulty: medium
    text: >-
      Tell me about a failure where, looking back, the warning signs were there and you didn't act on them. What
      were the signs, and why didn't they lead to action?
    expected_concepts:
      - the failure and the earlier signs
      - why the signs were dismissed or missed
      - the cost of not acting
      - how they treat similar signals now
    rubric:
      excellent: Names specific signs, examines why they dismissed them such as normalising problems or optimism, and describes a concrete change in how they treat signals.
      good: Recognises the missed signs and draws a lesson.
      weak: Claims there were no signs, or blames others for not acting.
    followups:
      - Did anyone else mention those signs at the time?
    common_errors:
      - Describing signs only others missed.

  - external_key: behavioral.failure_resilience.overruled_then_failure
    competency_key: collaboration
    topic: Helping recover from a decision you had argued against
    difficulty: medium
    text: >-
      Tell me about a time you argued against a decision, it went ahead anyway, and it didn't work out. How did
      you help with the recovery?
    expected_concepts:
      - their original objection
      - committing to the decision once made
      - contributing to the recovery
      - avoiding blame in the aftermath
      - improving how such decisions are made
    rubric:
      excellent: Commits to the decision once made, contributes fully to recovery without blame, and helps improve how such decisions get made.
      good: Helps with the recovery constructively.
      weak: Focuses on having been right, or withholds help.
    followups:
      - How did you bring up your original concerns afterwards, if at all?
    common_errors:
      - Making the story about having been right.

  - external_key: behavioral.failure_resilience.pushed_for_it_and_wrong
    competency_key: ownership
    topic: Admitting you were wrong after pushing hard for something
    difficulty: medium
    text: >-
      Describe a time you pushed hard for a decision that others had doubts about, and it turned out you were
      wrong. How did you acknowledge it, and what did it change about how you argue for ideas?
    expected_concepts:
      - their position and the doubts others raised
      - evidence that they were wrong
      - acknowledging it openly
      - helping correct course
      - change in how they weigh opposing views
    rubric:
      excellent: Acknowledges the error openly, credits the people who had doubts, helps fix the course, and describes a specific change in how they test their own positions.
      good: Admits the error and helps correct it.
      weak: Rationalises the outcome or never acknowledges it.
    followups:
      - What did the people who doubted you say?
    common_errors:
      - Quietly moving on without acknowledging the error.

  - external_key: behavioral.failure_resilience.mentoring_advice_failed
    competency_key: mentoring
    topic: When your guidance to someone did not work
    difficulty: medium
    text: >-
      Tell me about a time guidance you gave to someone you were mentoring or supporting didn't help, or made
      things worse. How did you notice, and what did you do differently?
    expected_concepts:
      - the guidance and the situation
      - signs it was not working
      - finding out what the person actually needed
      - adjusted approach and result
    rubric:
      excellent: Notices from specific signs, seeks the person's view of what they need, adjusts the approach, and shows a better result.
      good: Recognises the problem and adjusts.
      weak: Blames the mentee for not following the advice.
    followups:
      - What did you ask them when you realised it wasn't working?
    common_errors:
      - Assuming the same advice works for everyone.

  - external_key: behavioral.failure_resilience.delivering_repeat_slip_news
    competency_key: stakeholder_management
    topic: Missing a date a second time
    difficulty: medium
    text: >-
      Describe a piece of work where you'd already reset the date once and then missed the new date too. What
      was wrong with your second plan, and what did you change in how you planned and tracked it after that?
    expected_concepts:
      - why it slipped again
      - early, direct communication
      - a more credible plan (evidence, buffers, milestones)
      - options offered to stakeholders
      - whether the new date held
    rubric:
      excellent: Explains the repeated slip plainly including their own part, raises it early, offers options, and shows a more credible plan with visible milestones that then held.
      good: Communicates the slip clearly with a revised plan.
      weak: Delays the news or gives another date with no change in approach.
    followups:
      - What was different about how you built the second estimate?
    common_errors:
      - Giving a new date without explaining why it is more reliable.

  - external_key: behavioral.failure_resilience.chose_speed_paid_later
    competency_key: ownership
    topic: Choosing speed over quality and paying for it
    difficulty: medium
    text: >-
      Tell me about a time you chose to move fast over doing something thoroughly and it cost more later. Was it
      the wrong call, or the right call handled badly?
    expected_concepts:
      - the trade-off made and its context
      - the later cost
      - analysis of the decision itself versus follow-through
      - how they make such trade-offs now
    rubric:
      excellent: Analyses whether the trade-off itself was wrong or the follow-through such as paying back debt was missing, quantifies the cost, and describes a better approach to such trade-offs.
      good: Recognises the cost and draws a lesson.
      weak: Concludes simply that speed is bad.
    followups:
      - What would have made that trade-off a good one?
    common_errors:
      - Treating all speed trade-offs as mistakes.

  - external_key: behavioral.failure_resilience.closed_gap_failure_exposed
    competency_key: adaptability
    topic: Closing a knowledge gap a failure exposed
    difficulty: medium
    text: >-
      Describe a time something went wrong because of a gap in your knowledge or skills. How did you go about
      closing that gap, and how did you check you'd really closed it?
    expected_concepts:
      - the failure and the gap it revealed
      - a deliberate learning plan
      - applying the new knowledge in real work
      - evidence the gap was closed
    rubric:
      excellent: Identifies the specific gap, follows a deliberate learning plan, applies it in real work, and gives evidence of the improvement.
      good: Learns the missing skill and applies it.
      weak: Mentions the gap but did nothing structured about it.
    followups:
      - Who helped you learn it?
    common_errors:
      - Only reading about it without practice.

  - external_key: behavioral.failure_resilience.made_it_right_with_customer
    competency_key: stakeholder_management
    topic: Making it right with a customer after your mistake
    difficulty: medium
    text: >-
      Tell me about a time a mistake you made directly affected a customer or client. How did you communicate with
      them, and what did you do to make it right?
    expected_concepts:
      - the mistake and its effect on the customer
      - prompt, clear communication with the customer
      - concrete remedy
      - preventing recurrence
      - state of the relationship afterwards
    rubric:
      excellent: Communicates promptly and plainly with the customer, provides a concrete remedy, prevents recurrence, and shows the relationship recovered.
      good: Apologises and fixes the issue.
      weak: Lets others handle the customer, or hides the cause.
    followups:
      - What did the customer ask for, and what did you agree to?
    common_errors:
      - Over-promising to the customer to smooth things over.

  # ------------------------------------------------------------ leading through failure (hard)
  - external_key: behavioral.failure_resilience.team_after_major_failure
    competency_key: leadership
    topic: Leading a team after a major failure
    difficulty: hard
    text: >-
      Tell me about a time you were leading a team right after a major failure. What did you do to keep the team
      focused and productive, and to make sure the right lessons were learned?
    expected_concepts:
      - the failure and its effect on the team
      - clear priorities and next steps
      - running a blameless review
      - protecting individuals from blame
      - lasting changes and team recovery
    rubric:
      excellent: Sets clear priorities, runs a blameless review, shields individuals from blame while holding the team to improvements, and shows the team delivered well afterwards.
      good: Keeps the team focused and leads some learning.
      weak: Looks for someone to blame, or moves on with no review.
    followups:
      - How did you handle the person closest to the failure?
    common_errors:
      - Publicly attributing the failure to an individual.

  - external_key: behavioral.failure_resilience.staffing_decision_failed
    competency_key: leadership
    topic: A hiring or staffing decision that did not work out
    difficulty: hard
    text: >-
      Tell me about a hiring or staffing decision you made that didn't work out. What did you miss in how you made
      the decision, and what did you change in your process?
    expected_concepts:
      - the decision and how it was made
      - signs it was not working and response
      - supporting the person fairly
      - what the process missed
      - process changes
    rubric:
      excellent: Examines their own decision process rather than the person, handles the situation fairly and supportively, and changes their process based on job-related criteria.
      good: Recognises the poor decision and adjusts the process.
      weak: Blames the person entirely.
    followups:
      - How did you support the person through it?
    common_errors:
      - Focusing on the individual's faults rather than the decision.

  - external_key: behavioral.failure_resilience.recurring_failure_across_teams
    competency_key: leadership
    topic: Fixing a failure that kept recurring across teams
    difficulty: hard
    text: >-
      Describe a type of failure that kept recurring across several teams. How did you get people to see it as a
      shared problem, and what did you change?
    expected_concepts:
      - recognising the cross-team pattern
      - gathering evidence
      - building a coalition across teams
      - a structural change
      - measuring reduction
    rubric:
      excellent: Uses evidence to show the pattern, builds agreement across teams, drives a structural change, and measures a reduction in recurrence.
      good: Gets the problem recognised and some change made.
      weak: Fixes only their own team's instance.
    followups:
      - Who resisted, and why?
    common_errors:
      - Expecting other teams to change without evidence.

  - external_key: behavioral.failure_resilience.delegated_work_failed
    competency_key: leadership
    topic: Accountability when delegated work failed
    difficulty: hard
    text: >-
      Tell me about a time work you'd delegated to someone failed. How did you share accountability for it, both
      with the person and with the people above you?
    expected_concepts:
      - what was delegated and how
      - the failure and their delegation's part in it
      - taking accountability upward
      - feedback and support for the person
      - changes to how they delegate
    rubric:
      excellent: Takes accountability upward rather than naming the person, gives the person direct and supportive feedback, and changes how they delegate such as clearer checkpoints.
      good: Shares responsibility and improves delegation.
      weak: Passes the blame to the person.
    followups:
      - What checkpoints do you set when delegating now?
    common_errors:
      - Delegating responsibility but not support.

  - external_key: behavioral.failure_resilience.costly_mistake_quantified
    competency_key: ownership
    topic: A mistake with a significant financial cost
    difficulty: hard
    text: >-
      Tell me about a mistake you were involved in that had a significant financial cost to the organisation.
      How did you work out the cost, and how did you report it?
    expected_concepts:
      - the mistake and how cost was incurred
      - estimating the cost accurately
      - prompt, transparent reporting
      - recovering or limiting the cost
      - preventing recurrence
    rubric:
      excellent: Estimates the cost carefully, reports it promptly and transparently, takes steps to limit or recover it, and introduces controls to prevent it again.
      good: Reports the cost and helps fix it.
      weak: Understates the cost or delays reporting.
    followups:
      - Was any of the cost recovered?
    common_errors:
      - Understating the impact to protect themselves.
