# Behavioural: conflict (part 4 of 4) - how candidates approach disagreement, judgement on when to commit,
# and harder cases of holding, reversing or representing a position.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, reasoning, outcome, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: collaboration
questions:
  # ------------------------------------------------------------ approach and everyday cases (easy)
  - external_key: behavioral.conflict.how_you_open_a_disagreement
    competency_key: communication
    topic: How you open a disagreement
    difficulty: easy
    text: >-
      When you disagree with a colleague about their approach, how do you usually start that conversation? Walk me
      through a recent example.
    expected_concepts:
      - choosing an appropriate time and setting
      - starting from shared goals or questions
      - stating the concern specifically, with reasons
      - inviting the other person's view
      - how the example conversation went
    rubric:
      excellent: Describes a deliberate, repeatable approach and backs it with a specific recent example showing a clear concern, curiosity about the other view and a good outcome.
      good: Describes a reasonable approach with an example.
      weak: Only describes general principles with no example, or an approach that is purely about winning.
    followups:
      - When has that approach not worked?
      - How do you adjust it for someone more senior?
    common_errors:
      - Giving a generic answer with no real example.

  - external_key: behavioral.conflict.idea_challenged_in_front_of_group
    topic: Your idea challenged in front of others
    difficulty: easy
    text: >-
      Tell me about a time a teammate picked apart an idea of yours during a team discussion, with everyone listening.
      How did you engage with their objections, and what happened to the idea?
    expected_concepts:
      - listening to the challenge fully
      - answering the substance rather than defending themselves
      - acknowledging valid points
      - following up afterwards if needed
      - outcome for the idea
    rubric:
      excellent: Engaged with the substance of the challenge, acknowledged valid points, followed up where needed and explains how the idea changed or why it held.
      good: Responded constructively and the discussion moved forward.
      weak: Responded defensively or dropped the idea without engaging.
    followups:
      - Was the challenge fair?
      - Did you talk to that person afterwards?
    common_errors:
      - Treating the challenge as a personal attack.

  - external_key: behavioral.conflict.middle_ground_both_gave_up
    topic: A disagreement settled by compromise
    difficulty: easy
    text: >-
      Tell me about a disagreement that ended in a compromise. What did each side give up, and was the result better
      or worse than either original option?
    expected_concepts:
      - the original positions
      - what each side conceded
      - why compromise was chosen over picking one option
      - the quality of the resulting solution
      - reflection on whether compromise was right
    rubric:
      excellent: Describes both positions and concessions clearly, and critically evaluates whether the compromise produced a better result or just a weaker blend.
      good: Explains a fair compromise and its result.
      weak: Cannot say what either side gave up, or assumes compromise is always best.
    followups:
      - When is compromise the wrong answer?
      - Would you make the same trade again?
    common_errors:
      - Assuming splitting the difference is always the best outcome.

  - external_key: behavioral.conflict.colleague_went_own_way
    topic: A colleague ignoring an agreed approach
    difficulty: easy
    text: >-
      Tell me about a time a colleague went ahead with a different approach from the one the team had agreed. What
      did you do when you found out?
    expected_concepts:
      - finding out why they diverged
      - assessing the impact of the divergence
      - talking to them directly
      - deciding with the team whether to keep or change course
      - preventing confusion later
    rubric:
      excellent: Asked why they diverged, assessed the impact against the agreed approach, discussed it directly and helped the team make an explicit decision.
      good: Raised it directly and reached a resolution.
      weak: Reported it without talking to them, or ignored it.
    followups:
      - Was their approach better?
      - How did the team decide what to do?
    common_errors:
      - Insisting on the agreed approach without checking if theirs was better.

  - external_key: behavioral.conflict.opposite_advice_from_two_seniors
    topic: Opposite advice from two experienced colleagues
    difficulty: easy
    text: >-
      Describe a time two experienced colleagues gave you opposite advice on the same problem. How did you decide what
      to do, and how did you handle it with the person whose advice you didn't take?
    expected_concepts:
      - understanding the reasoning behind each piece of advice
      - weighing it against their own situation
      - possibly bringing the two together
      - making and owning a decision
      - closing the loop with both advisers
    rubric:
      excellent: Understood both lines of reasoning, made and owned a decision for their context, and closed the loop with both advisers including the one not followed.
      good: Made a reasoned choice between the two.
      weak: Picked based on seniority alone, or never told the other adviser.
    followups:
      - Did you bring the two of them together?
      - Who turned out to be right?
    common_errors:
      - Choosing by who is more senior instead of by reasoning.

  - external_key: behavioral.conflict.workaround_versus_proper_fix
    topic: Quick workaround or proper fix
    difficulty: easy
    text: >-
      Tell me about a time you and a colleague disagreed about whether to apply a quick workaround or take the time
      to fix a problem properly. How did you decide?
    expected_concepts:
      - urgency and impact of the problem
      - cost and risk of each option
      - possibly doing both in sequence
      - making sure any follow-up actually happened
      - outcome
    rubric:
      excellent: Weighs urgency, cost and risk of both options, often reaches a sequenced plan and makes sure any deferred proper fix actually happens.
      good: Reached a reasoned decision between the two.
      weak: Treated one option as always correct, or the deferred fix was forgotten.
    followups:
      - Did the proper fix ever happen?
      - Who decided in the end?
    common_errors:
      - Agreeing a later proper fix that never gets scheduled.

  - external_key: behavioral.conflict.settled_in_minutes
    topic: A disagreement resolved quickly
    difficulty: easy
    text: >-
      Tell me about a disagreement you managed to settle in a few minutes that could easily have taken days. What did
      you or the other person do that made it quick?
    expected_concepts:
      - identifying the real point of difference fast
      - checking how much it really mattered
      - a quick test or fact check
      - agreeing who decides
      - lesson they reuse
    rubric:
      excellent: Pinpoints the specific move that made it quick, such as narrowing the real difference or checking reversibility, and shows they reuse it.
      good: Describes a quick resolution and why it worked.
      weak: The example has no real disagreement, or they cannot explain what made it quick.
    followups:
      - Do you use that approach deliberately now?
      - When doesn't it work?
    common_errors:
      - Describing simply giving in as a quick resolution.

  - external_key: behavioral.conflict.estimates_far_apart
    topic: Estimates that were far apart
    difficulty: easy
    text: >-
      Tell me about a time you and a teammate estimated the same piece of work very differently. How did you work out
      why, and what estimate did you end up with?
    expected_concepts:
      - talking through assumptions behind each estimate
      - finding missed work or different scope
      - agreeing on a shared understanding of the work
      - recording the uncertainty
      - how accurate the final estimate was
    rubric:
      excellent: Uses the gap to uncover different assumptions or missed work, agrees a shared view of the scope and reflects on how accurate the final estimate was.
      good: Discussed the difference and agreed a reasonable estimate.
      weak: Averaged the numbers or took the more senior person's figure without discussion.
    followups:
      - What had one of you missed?
      - How close was the final estimate?
    common_errors:
      - Averaging estimates without understanding the gap.

  # ------------------------------------------------------------ judgement and interpersonal friction (medium)
  - external_key: behavioral.conflict.when_to_stop_arguing
    topic: Deciding when to stop arguing and commit
    difficulty: medium
    text: >-
      How do you decide when to stop arguing for your view and commit to a decision you disagree with? Tell me about
      a time you made that call.
    expected_concepts:
      - having made the case fully
      - stakes and reversibility of the decision
      - whether new information is still emerging
      - respecting who owns the decision
      - committing visibly and fully
    rubric:
      excellent: Gives clear criteria such as stakes, reversibility and decision ownership, and a specific example where applying them led to full, visible commitment.
      good: Explains a sensible approach with an example.
      weak: Either never commits or always gives in quickly, with no reasoning.
    followups:
      - Is there a kind of decision where you wouldn't commit?
      - How do people know you've committed?
    common_errors:
      - Confusing commitment with staying quiet.

  - external_key: behavioral.conflict.peer_behaviour_in_discussions
    competency_key: communication
    topic: Raising how a peer behaves in discussions
    difficulty: medium
    text: >-
      Tell me about a time a peer's behaviour in team discussions, such as interrupting others or dismissing ideas
      quickly, was hurting the team's decisions. How did you raise it with them?
    expected_concepts:
      - specific observed examples
      - impact on the team's decisions
      - private, direct conversation as a peer
      - suggesting a concrete change
      - follow-up and result
    rubric:
      excellent: Raised specific observed examples privately with their impact on decisions, suggested a concrete change and followed up on whether it helped.
      good: Had a direct conversation that improved things.
      weak: Complained to others or made judgements about the person rather than the behaviour.
    followups:
      - How did they respond?
      - What would you have done if nothing changed?
    common_errors:
      - Describing the person instead of specific behaviours.

  - external_key: behavioral.conflict.input_repeatedly_dismissed
    topic: When a colleague keeps dismissing your input
    difficulty: medium
    text: >-
      Describe a time a colleague repeatedly dismissed or overlooked your input on shared work. What did you do to
      change that?
    expected_concepts:
      - checking whether their input could be presented better
      - a direct conversation about the pattern
      - backing input with evidence
      - finding common ground
      - outcome
    rubric:
      excellent: Reflected on how their input was presented, addressed the pattern directly with the colleague, strengthened their input with evidence and shows the working relationship improved.
      good: Took steps that improved how their input was received.
      weak: Withdrew from contributing, or escalated without addressing it directly.
    followups:
      - Was there anything about how you presented your input that you changed?
      - Did the colleague realise they were doing it?
    common_errors:
      - Withdrawing instead of addressing the pattern.

  - external_key: behavioral.conflict.options_written_up_fairly
    competency_key: communication
    topic: Presenting both sides fairly when you favour one
    difficulty: medium
    text: >-
      Tell me about a time you had to lay out the options for a decision maker when you clearly favoured one of them.
      How did you make sure the other option got a fair presentation?
    expected_concepts:
      - stating each option in its strongest form
      - consistent criteria and evidence for each
      - asking the other side to review the write-up
      - stating their own recommendation separately
      - outcome of the decision
    rubric:
      excellent: Presented each option in its strongest form with consistent criteria, had the other side check the write-up and kept their recommendation clearly separate.
      good: Gave a reasonably balanced presentation.
      weak: Framed the options to favour their own preference.
    followups:
      - Did the person who favoured the other option agree with your write-up?
      - What did the decision maker choose?
    common_errors:
      - Presenting the other option in a weakened form.

  - external_key: behavioral.conflict.disagreement_turned_personal
    topic: Getting a disagreement back to the work
    difficulty: medium
    text: >-
      Tell me about a time you realised a disagreement had stopped being about the work and had become about the
      people involved. What did you notice, and what did you do?
    expected_concepts:
      - signs it had become personal, such as old grievances or point-scoring
      - naming it or stepping back
      - separating the relationship issue from the work issue
      - resolving the work question on its merits
      - repairing the relationship
    rubric:
      excellent: Identifies concrete signs, names or steps back from the dynamic, separates the relationship and work issues and resolves both.
      good: Recognised the shift and helped refocus on the work.
      weak: Continued the personal dynamic or withdrew without resolving anything.
    followups:
      - What did you say to reset it?
      - What was the original work question, and how was it settled?
    common_errors:
      - Ignoring the relationship issue and hoping the work issue fixes it.

  - external_key: behavioral.conflict.disputed_lesson_from_failure
    competency_key: problem_solving
    topic: Disagreeing with the team's conclusion about a failure
    difficulty: medium
    text: >-
      Tell me about a time your team agreed on why something had failed, and you believed the real cause was something
      else. What did you do?
    expected_concepts:
      - evidence for their alternative cause
      - raising it without dismissing the team's view
      - proposing a way to check
      - accepting or changing the conclusion based on evidence
      - effect on the actions taken
    rubric:
      excellent: Brings concrete evidence for the alternative cause, raises it respectfully with a way to test it, and shows how the conclusion and actions changed or why they didn't.
      good: Raised their view with evidence.
      weak: Kept quiet, or insisted without evidence.
    followups:
      - How did you test your theory?
      - What actions changed as a result?
    common_errors:
      - Raising an alternative cause with no evidence.

  - external_key: behavioral.conflict.arguing_against_own_team
    topic: Disagreeing with your own team for a wider goal
    difficulty: medium
    text: >-
      Tell me about a time you thought your own team should take on work, or give something up, for the benefit of
      another team or the wider organisation, and your teammates disagreed. How did that play out?
    expected_concepts:
      - the wider benefit and the cost to the team
      - acknowledging teammates' concerns
      - finding ways to reduce the cost
      - involving the team in the decision
      - outcome
    rubric:
      excellent: Makes a clear case for the wider benefit, takes teammates' concerns about cost seriously, finds ways to reduce it and involves the team in the decision.
      good: Argued the wider view while respecting the team's concerns.
      weak: Committed the team without their agreement, or dropped the point immediately.
    followups:
      - What did it cost the team?
      - How did your teammates respond to the outcome?
    common_errors:
      - Committing the team without involving them.

  - external_key: behavioral.conflict.pressed_to_take_a_side
    topic: Being pushed to take sides
    difficulty: medium
    text: >-
      Describe a time two colleagues in a disagreement each wanted you on their side. How did you handle that?
    expected_concepts:
      - forming their own view on the merits
      - being transparent with both about their view
      - encouraging the two to talk directly
      - avoiding being used as a messenger
      - outcome
    rubric:
      excellent: Formed their own view on the merits, was open with both about it, encouraged direct conversation and avoided carrying messages between them.
      good: Stayed constructive and helped the disagreement move on.
      weak: Told each what they wanted to hear, or took a side for relationship reasons.
    followups:
      - Did you end up agreeing with one of them?
      - How did each of them react?
    common_errors:
      - Acting as a go-between instead of encouraging direct conversation.

  - external_key: behavioral.conflict.disagreeing_with_trusted_mentor
    topic: Disagreeing with someone whose judgement you rely on
    difficulty: medium
    text: >-
      Tell me about a time you disagreed with a mentor or a colleague whose judgement you usually trust. How did you
      handle it, and what did you decide?
    expected_concepts:
      - taking their view seriously
      - testing their own reasoning
      - discussing the disagreement openly
      - making their own decision and owning it
      - reflection on the outcome
    rubric:
      excellent: Took the trusted view seriously, tested their own reasoning, discussed it openly and made and owned a decision, reflecting on how it turned out.
      good: Discussed the disagreement and made a reasoned decision.
      weak: Deferred without thinking, or dismissed the advice without discussing it.
    followups:
      - What made you willing to go against their view?
      - Did it change how you work with them?
    common_errors:
      - Deferring automatically because of the relationship.

  - external_key: behavioral.conflict.renegotiating_an_old_agreement
    topic: Renegotiating an agreement that stopped working
    difficulty: medium
    text: >-
      Tell me about a time an arrangement you had with a colleague or another team stopped working for you, and
      changing it caused friction. How did you renegotiate it?
    expected_concepts:
      - evidence that the arrangement wasn't working
      - raising it early rather than quietly breaking it
      - understanding what the other side valued in it
      - proposing a new arrangement
      - outcome
    rubric:
      excellent: Raised it early with evidence, understood what the other side valued, proposed a new arrangement that worked for both and kept the relationship intact.
      good: Renegotiated the arrangement constructively.
      weak: Stopped honouring the arrangement without discussion.
    followups:
      - What did the other side value in the old arrangement?
      - How did you document the new one?
    common_errors:
      - Quietly stopping the old arrangement.

  - external_key: behavioral.conflict.disagreement_during_urgent_problem
    topic: Disagreeing during an urgent problem
    difficulty: medium
    text: >-
      Tell me about a time you disagreed with what the person leading an urgent problem, like an outage or a critical
      deadline, wanted to do. How did you raise it without slowing things down?
    expected_concepts:
      - concise statement of the concern and risk
      - respecting the person in charge
      - offering an alternative or a safeguard
      - acting on the decision
      - discussing it in the review afterwards
    rubric:
      excellent: Raised a concise, specific concern with an alternative, respected the leader's call, acted on it and brought it to the review afterwards.
      good: Voiced the concern briefly and supported the response.
      weak: Took matters into their own hands, or stayed silent about a real risk.
    followups:
      - What did the person leading do with your input?
      - Did it come up in the review afterwards?
    common_errors:
      - Acting on their own view without telling the person in charge.

  - external_key: behavioral.conflict.inherited_decision_you_disagreed_with
    topic: Changing a decision you inherited
    difficulty: medium
    text: >-
      Tell me about a time you took over work and disagreed with a decision the previous owner had made. How did you
      handle changing it, especially with the people who had made it?
    expected_concepts:
      - understanding the original context and reasoning
      - talking to the previous owner if possible
      - making the case on current needs
      - involving those affected before changing it
      - outcome
    rubric:
      excellent: Learned the original context, consulted the previous owner and those affected, made the case on current needs and changed it without disparaging past work.
      good: Changed the decision in a considered way.
      weak: Reversed it without understanding why it was made.
    followups:
      - What did you learn about why it was made?
      - Did you keep any part of the original decision?
    common_errors:
      - Assuming the previous owner made a mistake.

  # ------------------------------------------------------------ harder cases (hard)
  - external_key: behavioral.conflict.debate_costing_more_than_options
    topic: When the debate costs more than the decision
    difficulty: hard
    text: >-
      Tell me about a time a disagreement went on so long that the delay cost more than either option would have. How
      did you recognise it, and what did you change about how decisions get made?
    expected_concepts:
      - recognising the cost of delay
      - distinguishing reversible from hard-to-reverse decisions
      - time-boxing or assigning a decision owner
      - getting the decision made
      - lasting change to the decision process
    rubric:
      excellent: Quantifies the cost of delay, distinguishes reversible decisions that should be made quickly, gets the decision made and changes the team's decision process to prevent recurrence.
      good: Recognised the cost and helped force a decision.
      weak: Was part of the prolonged debate without recognising the cost.
    followups:
      - Was the decision reversible?
      - What rule would you suggest for similar decisions?
    common_errors:
      - Treating every decision as if it were irreversible.

  - external_key: behavioral.conflict.held_position_under_pressure
    topic: Holding your position under pressure
    difficulty: hard
    text: >-
      Tell me about a time you kept to your position in a disagreement even though there was strong pressure to give
      way. Why did you hold firm, and looking back, was it the right call?
    expected_concepts:
      - the stakes and their reasoning
      - checking whether they could be wrong
      - how they held firm while keeping it constructive
      - the outcome
      - balanced reflection on whether it was right
    rubric:
      excellent: Explains high stakes and solid reasoning, shows they checked their own view, held firm constructively and reflects critically on whether it was the right call.
      good: Held a reasoned position and can explain the outcome.
      weak: Held firm out of stubbornness, or the reflection is one-sided.
    followups:
      - What would have made you give way?
      - What did it cost the working relationship?
    common_errors:
      - Equating persistence with being right.

  - external_key: behavioral.conflict.reversing_announced_decision
    topic: Persuading a group to reverse an announced decision
    difficulty: hard
    text: >-
      Tell me about a time you persuaded people to reverse a decision that had already been announced. How did you
      build the case, and how did you handle the cost of changing course?
    expected_concepts:
      - strong evidence that the decision was wrong
      - approaching the decision owners privately first
      - acknowledging the cost and awkwardness of reversing
      - helping communicate the change
      - outcome
    rubric:
      excellent: Built a strong evidence-based case, approached the decision owners privately first, acknowledged the cost of reversing and helped communicate the change well.
      good: Made a convincing case and the decision was revised.
      weak: Challenged it publicly without preparation, or the reversal caused avoidable disruption.
    followups:
      - Why didn't you raise this before it was announced?
      - How did the people who made the decision respond to reversing it?
    common_errors:
      - Ignoring the cost of reversing a decision people had already acted on.

  - external_key: behavioral.conflict.your_team_rejected_your_agreement
    topic: When your own team rejects an agreement you made
    difficulty: hard
    text: >-
      Tell me about a time you represented your team in a discussion with another group, agreed something, and your
      own team then disagreed with what you'd agreed. How did you handle both sides?
    expected_concepts:
      - understanding the team's objections
      - reflecting on what they could have checked first
      - deciding whether to go back to the other group
      - being straightforward with both sides
      - changing how they represent the team in future
    rubric:
      excellent: Took the team's objections seriously, owned any gap in how they had represented the team, was straightforward with the other group about any change and improved how they represent the team.
      good: Resolved the situation with both sides.
      weak: Blamed the team or quietly broke the agreement.
    followups:
      - What should you have checked with your team beforehand?
      - Did you go back to the other group?
    common_errors:
      - Breaking the agreement without telling the other group.

  - external_key: behavioral.conflict.colleague_escalated_about_you
    topic: A colleague escalating about you
    difficulty: hard
    text: >-
      Tell me about a time a colleague took a disagreement with you straight to your manager or theirs without talking
      to you first. How did you respond, and how did you work with them afterwards?
    expected_concepts:
      - responding to the substance of the concern
      - understanding why they escalated
      - talking directly with the colleague
      - agreeing how to handle future disagreements
      - the working relationship afterwards
    rubric:
      excellent: Addressed the substance of the concern first, sought to understand why they escalated, had a direct conversation and agreed how to handle future disagreements, with a working relationship that recovered.
      good: Handled the escalation constructively and resolved the issue.
      weak: Focused on the escalation as unfair and ignored the underlying concern.
    followups:
      - Was there anything valid in their concern?
      - Why do you think they didn't come to you first?
    common_errors:
      - Focusing on the escalation rather than the issue.
