# Behavioural: conflict (part 3 of 4) - friction between teams, shared work, blame and de-escalation.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, reasoning, outcome, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
  competency_key: collaboration
questions:
  # ------------------------------------------------------------ everyday friction (easy)
  - external_key: behavioral.conflict.tense_meeting_refocused
    competency_key: communication
    topic: Bringing a tense discussion back to the work
    difficulty: easy
    text: >-
      Tell me about a time a discussion you were part of turned tense, with people talking past each other. What did
      you do in the moment to bring it back to the actual problem?
    expected_concepts:
      - noticing the discussion had stopped being productive
      - restating the shared goal or the question being decided
      - summarising each position fairly
      - suggesting a next step such as a pause or a smaller follow-up
      - what happened afterwards
    rubric:
      excellent: Describes specific in-the-moment actions such as restating the goal and summarising positions fairly, and a concrete next step that got the discussion moving.
      good: Took a sensible step that helped the discussion recover.
      weak: Joined in the argument, or waited for someone else to step in.
    followups:
      - What did you say exactly?
      - Did you follow up with anyone afterwards?
    common_errors:
      - Taking a side in the moment instead of refocusing the group.

  - external_key: behavioral.conflict.shared_setup_kept_changing
    topic: Friction over a shared setup or tool
    difficulty: easy
    text: >-
      Describe a time a teammate kept changing something you both depended on, like a shared environment, template,
      configuration or document, in ways that broke your work. How did you deal with it?
    expected_concepts:
      - impact on their work with examples
      - talking to the teammate rather than reverting silently
      - understanding why they needed the changes
      - agreeing a way to coordinate changes
      - whether the problem stopped
    rubric:
      excellent: Raised specific impacts directly, understood the teammate's needs, and agreed a practical coordination mechanism that stopped the breakages.
      good: Talked it through and reduced the problem.
      weak: Kept silently reverting the changes or complained to others.
    followups:
      - What did they need that you hadn't realised?
      - What did you put in place to coordinate?
    common_errors:
      - Fixing the symptom each time without addressing the cause.

  - external_key: behavioral.conflict.handoff_finger_pointing
    topic: Mutual blame after a handoff went wrong
    difficulty: easy
    text: >-
      Tell me about a time something went wrong at a handoff between you and someone else, and each side felt the
      other had dropped the ball. How did you get past who was at fault?
    expected_concepts:
      - fixing the immediate problem first
      - looking at what each side assumed
      - acknowledging their own part
      - agreeing a clearer handoff
      - relationship afterwards
    rubric:
      excellent: Prioritised fixing the problem, examined both sides' assumptions including their own, and agreed a concrete change to the handoff without assigning blame.
      good: Moved past blame and improved the handoff.
      weak: Focused on proving the other side was at fault.
    followups:
      - What had each of you assumed?
      - What does the handoff look like now?
    common_errors:
      - Spending the conversation establishing fault.

  - external_key: behavioral.conflict.other_team_said_no
    topic: Another team declining your request
    difficulty: easy
    text: >-
      Tell me about a time you asked another team for something you needed and they said no. How did you respond, and
      what did you end up doing?
    expected_concepts:
      - understanding their reasons and constraints
      - explaining the impact and urgency in their terms
      - exploring alternatives or a smaller ask
      - accepting the answer or escalating appropriately
      - outcome
    rubric:
      excellent: Understood the other team's constraints, restated the need in terms of shared goals, explored alternatives or a smaller request, and reached an outcome without damaging the relationship.
      good: Responded constructively and found a way forward.
      weak: Escalated immediately, or gave up without understanding why.
    followups:
      - What was behind their no?
      - Would you ask differently next time?
    common_errors:
      - Treating the refusal as obstruction rather than a constraint.

  - external_key: behavioral.conflict.opposite_asks_from_two_colleagues
    topic: Two colleagues asking for opposite things
    difficulty: easy
    text: >-
      Describe a time two colleagues asked you for things that couldn't both be done, and each expected theirs to come
      first. How did you handle it?
    expected_concepts:
      - making the conflict visible to both
      - understanding the impact of each request
      - getting the right person to decide priority
      - communicating the outcome to both
      - result
    rubric:
      excellent: Made the clash visible to both colleagues, compared the impact of each request, got the right person to decide and communicated the outcome clearly to both.
      good: Resolved the clash with a sensible priority.
      weak: Tried to do both and delivered neither well, or quietly picked one.
    followups:
      - Who decided in the end?
      - How did the colleague whose request waited respond?
    common_errors:
      - Saying yes to both without flagging the clash.

  - external_key: behavioral.conflict.both_claimed_the_task
    topic: Two people claiming the same piece of work
    difficulty: easy
    text: >-
      Tell me about a time you and a colleague both believed a piece of work or an area was yours to own. How did you
      sort it out?
    expected_concepts:
      - how the overlap arose
      - talking directly about it early
      - deciding based on what serves the work best
      - involving whoever assigns work if needed
      - making ownership clear to others
    rubric:
      excellent: Raised the overlap early and directly, settled it based on what was best for the work, and made the ownership clear to everyone affected.
      good: Resolved the overlap without lasting friction.
      weak: Raced the colleague to finish it, or let duplicate work continue.
    followups:
      - How had the overlap happened?
      - Who ended up owning it, and why?
    common_errors:
      - Competing for the work instead of discussing it.

  - external_key: behavioral.conflict.colleague_habit_causing_problems
    topic: Raising a colleague's habit that affected your work
    difficulty: easy
    text: >-
      Tell me about a time a colleague's working habit, such as last-minute changes or late replies, kept causing
      problems for your work. How did you raise it with them?
    expected_concepts:
      - specific examples and impact
      - private, direct conversation
      - asking about their constraints
      - agreeing a concrete change on both sides
      - follow-up on whether it improved
    rubric:
      excellent: Raised specific examples privately with their impact, asked about the colleague's constraints, agreed a concrete change and checked whether it worked.
      good: Had a direct conversation that improved things.
      weak: Avoided the conversation, or made it about the person rather than the work.
    followups:
      - What was causing the habit?
      - Did you change anything on your side?
    common_errors:
      - Making general complaints without examples.

  - external_key: behavioral.conflict.tester_reports_disputed
    topic: Disagreeing with a reported defect
    difficulty: easy
    text: >-
      Tell me about a time someone checking your work, such as a tester, reviewer or user, reported problems you
      didn't think were real problems. How did you work through it with them?
    expected_concepts:
      - checking the report seriously before disputing it
      - going back to the requirement or expected behaviour
      - discussing with the reporter rather than closing it
      - clarifying the expectation for the future
      - outcome
    rubric:
      excellent: Investigated each report seriously, went back to the agreed expectation with the reporter, resolved each item on the merits and clarified expectations going forward.
      good: Discussed the reports and reached agreement.
      weak: Dismissed or closed the reports without discussion.
    followups:
      - Were any of them real problems after all?
      - What changed in how expectations were written?
    common_errors:
      - Closing reports as invalid without talking to the reporter.

  - external_key: behavioral.conflict.repair_after_sharp_exchange
    topic: Repairing things after a sharp exchange
    difficulty: easy
    text: >-
      Tell me about a time a disagreement with a colleague got sharper than it should have. What did you do afterwards
      to repair the working relationship?
    expected_concepts:
      - recognising their part in it
      - following up directly and soon
      - acknowledging what they said or did
      - returning to the underlying work issue
      - how they worked together afterwards
    rubric:
      excellent: Acknowledged their own part directly and promptly, separated the repair from the work issue and then resolved the work issue, with evidence the relationship recovered.
      good: Followed up and restored a working relationship.
      weak: Waited for the other person to make the first move, or never addressed it.
    followups:
      - How soon did you follow up?
      - What happened to the original disagreement?
    common_errors:
      - Expecting the other person to repair it.

  # ------------------------------------------------------------ cross-team and shared work (medium)
  - external_key: behavioral.conflict.blame_after_incident
    topic: Steering a blame discussion after a failure
    difficulty: medium
    text: >-
      Tell me about a time something went wrong and people started pointing fingers in the conversation that
      followed. What did you do to move the discussion toward fixing the cause?
    expected_concepts:
      - redirecting from who to what and why
      - focusing on facts and timeline
      - including their own or their team's part
      - identifying system or process causes
      - actions agreed and followed through
    rubric:
      excellent: Redirected the discussion from individuals to facts and causes, acknowledged their own team's part, and helped agree on system-level actions that were followed through.
      good: Helped reduce blame and agree some fixes.
      weak: Defended their own team or joined in assigning blame.
    followups:
      - How did people respond when you redirected?
      - Which of the actions actually happened?
    common_errors:
      - Defending their own part instead of looking at the system.

  - external_key: behavioral.conflict.interface_change_dispute
    topic: A dispute with another team over a shared interface
    difficulty: medium
    text: >-
      Describe a time your team and another team disagreed about a change to something you both depended on, like a
      shared interface, data format or schedule. How was it resolved?
    expected_concepts:
      - each team's needs and constraints
      - impact analysis on both sides
      - options such as versioning, phasing or a transition period
      - agreeing and documenting the outcome
      - how it worked in practice
    rubric:
      excellent: Explains both teams' needs, compares the impact of options, finds a solution such as phasing or a transition that works for both, and documents it.
      good: Reached a workable agreement with the other team.
      weak: Forced their team's preference or gave in without assessing the impact.
    followups:
      - What did the other team need most?
      - How did you avoid the same dispute next time?
    common_errors:
      - Ignoring the other team's migration cost.

  - external_key: behavioral.conflict.contradicting_senior_instructions
    topic: Contradictory instructions from two senior people
    difficulty: medium
    text: >-
      Tell me about a time two senior people gave you instructions that contradicted each other. What did you do,
      given that you couldn't satisfy both?
    expected_concepts:
      - noticing the contradiction early
      - not choosing silently between them
      - bringing them together or making each aware of the other
      - presenting the trade-off neutrally
      - acting on the agreed direction
    rubric:
      excellent: Flagged the contradiction early, made both people aware and helped them resolve it with a neutral framing of the trade-off, then acted on the agreed direction.
      good: Got the contradiction resolved by the right people.
      weak: Picked one silently, or tried to satisfy both and failed.
    followups:
      - Did they know they had contradicted each other?
      - How did you keep both informed afterwards?
    common_errors:
      - Choosing based on who is more senior without telling the other.

  - external_key: behavioral.conflict.unpopular_duties_uneven
    topic: Uneven sharing of unpopular work
    difficulty: medium
    text: >-
      Describe a time unpopular work on your team, such as support rotations, maintenance or urgent requests, was
      falling unevenly on a few people and it was causing resentment. What did you do?
    expected_concepts:
      - evidence of the imbalance
      - raising it with the team or lead
      - proposing a fair rotation or rule
      - reducing the unpopular work itself where possible
      - how the change was received
    rubric:
      excellent: Gathered evidence of the imbalance, raised it constructively, proposed a fair mechanism and looked at reducing the work itself, with a clear result.
      good: Raised the issue and helped improve fairness.
      weak: Complained, or avoided the work themselves.
    followups:
      - Were you one of the people carrying more of it?
      - Did anyone object to the change?
    common_errors:
      - Fixing fairness without looking at reducing the work.

  - external_key: behavioral.conflict.nobody_knew_who_decides
    topic: A disagreement with no clear decision owner
    difficulty: medium
    text: >-
      Tell me about a disagreement where the real problem was that nobody knew who had the final say. How did you get
      a decision made?
    expected_concepts:
      - recognising the missing decision owner
      - proposing who should decide and why
      - getting agreement on the decision process
      - documenting the decision and the owner
      - avoiding the same gap later
    rubric:
      excellent: Spotted that decision ownership was the real issue, proposed and agreed an owner and process, and made sure future decisions in that area had a clear owner.
      good: Got a decision made by clarifying ownership.
      weak: Kept arguing the substance without addressing who decides.
    followups:
      - Who did you propose should decide, and why?
      - Was the ownership written down anywhere?
    common_errors:
      - Assuming the most senior person present decides.

  - external_key: behavioral.conflict.work_redone_without_asking
    topic: A colleague redoing your work
    difficulty: medium
    text: >-
      Tell me about a time a colleague reworked or replaced something you had done without talking to you first. How
      did you handle it?
    expected_concepts:
      - understanding why they did it
      - focusing on the outcome rather than the slight
      - comparing the two versions on the merits
      - agreeing how to coordinate in future
      - result
    rubric:
      excellent: Sought the colleague's reasons, evaluated both versions on the merits, kept the better result and agreed a way to coordinate in future.
      good: Discussed it directly and reached a sensible outcome.
      weak: Reverted their changes or complained without talking to them.
    followups:
      - Was their version better in any way?
      - What did you agree for next time?
    common_errors:
      - Treating it as a matter of territory rather than quality.

  - external_key: behavioral.conflict.client_scope_disagreement
    competency_key: communication
    topic: Disagreeing with a client or business owner on scope
    difficulty: medium
    text: >-
      Describe a time a client or business owner insisted on something you believed would not serve them well. How
      did you handle the disagreement while keeping their trust?
    expected_concepts:
      - understanding their underlying goal
      - explaining the concern in their terms
      - offering alternatives with trade-offs
      - respecting their right to decide
      - outcome and relationship
    rubric:
      excellent: Understood the client's goal, explained the concern in their terms, offered concrete alternatives and respected their decision while recording the risk.
      good: Raised the concern clearly and reached an agreed outcome.
      weak: Built what was asked without raising concerns, or argued without offering options.
    followups:
      - What did they decide in the end?
      - How did you record the decision?
    common_errors:
      - Arguing technical detail instead of their goals.

  - external_key: behavioral.conflict.approval_blocked_by_other_team
    topic: Another team repeatedly blocking your change
    difficulty: medium
    text: >-
      Tell me about a time a change you needed required another team's sign-off, and they kept rejecting it. What did
      you do to get to an outcome?
    expected_concepts:
      - understanding the reasons for each rejection
      - meeting to find the underlying concern
      - adjusting the change to address it
      - agreeing clear acceptance criteria
      - outcome and the relationship
    rubric:
      excellent: Went beyond the individual rejections to find the underlying concern, adapted the change, agreed clear acceptance criteria and kept the relationship constructive.
      good: Worked with the team to get the change accepted.
      weak: Tried to bypass the sign-off, or escalated without understanding the objections.
    followups:
      - What was really behind the rejections?
      - How long did it take, and could it have been quicker?
    common_errors:
      - Seeing the reviewing team as a gate to get around.

  - external_key: behavioral.conflict.received_work_below_need
    topic: Raising quality issues in work you received
    difficulty: medium
    text: >-
      Describe a time work you received from another person or team wasn't good enough for what you needed. How did
      you raise it without damaging the relationship?
    expected_concepts:
      - specific gaps and their impact
      - checking whether expectations were clear in the first place
      - raising it directly with examples
      - agreeing what would be fixed and by whom
      - preventing it next time
    rubric:
      excellent: Gives specific gaps and impact, checks whether expectations were clear, raises it directly and agrees fixes and clearer expectations for the future.
      good: Raised the issues and got them addressed.
      weak: Silently fixed it themselves forever, or complained to others first.
    followups:
      - Had the expectations been written down?
      - How did they respond?
    common_errors:
      - Assuming the other side knew exactly what was needed.

  - external_key: behavioral.conflict.public_criticism_of_your_work
    competency_key: communication
    topic: Responding to sharp public criticism
    difficulty: medium
    text: >-
      Tell me about a time someone criticised your work sharply in a public setting, like a group meeting or a widely
      read channel. How did you respond, then and later?
    expected_concepts:
      - responding to the substance in the moment
      - not escalating publicly
      - following up privately
      - acting on valid points
      - outcome
    rubric:
      excellent: Responded briefly to the substance in public, followed up privately to understand and resolve the concern, and acted on any valid points.
      good: Handled it constructively and resolved the issue.
      weak: Responded defensively in public or ignored the criticism entirely.
    followups:
      - Was any of the criticism valid?
      - What did you say in the private follow-up?
    common_errors:
      - Arguing back publicly point by point.

  - external_key: behavioral.conflict.group_evaluation_split
    topic: Disagreeing in a group evaluation
    difficulty: medium
    text: >-
      Tell me about a time you disagreed with the rest of a group that was evaluating something together, such as a
      design review, a vendor choice or a candidate debrief. How did you make your case, and how was the outcome
      reached?
    expected_concepts:
      - grounding their view in specific evidence
      - listening to the group's evidence
      - focusing on agreed criteria
      - accepting the group decision or the decider's call
      - reflection on the outcome
    rubric:
      excellent: Grounds their view in specific evidence against agreed criteria, engages with the group's evidence and accepts the final decision, reflecting on how it turned out.
      good: Made a clear evidence-based case.
      weak: Argued from impressions, or simply went along with the group.
    followups:
      - What criteria were you using?
      - Did anyone change their view?
    common_errors:
      - Relying on impressions rather than evidence.

  # ------------------------------------------------------------ harder cross-team conflict (hard)
  - external_key: behavioral.conflict.cross_team_deadlock
    topic: Breaking a long deadlock between teams
    difficulty: hard
    text: >-
      Tell me about a time two teams, one of them yours, were deadlocked on something for weeks and it was holding up
      delivery. What did you do to break the deadlock?
    expected_concepts:
      - diagnosing why each side held its position
      - reframing around shared goals and costs of delay
      - creating options neither team had proposed
      - getting a decision from the right level if needed
      - restoring the working relationship
    rubric:
      excellent: Diagnoses each side's real interests, quantifies the cost of delay, creates new options and gets a timely decision at the right level while protecting the relationship.
      good: Helped break the deadlock constructively.
      weak: Held their team's position until someone else decided, or the deadlock simply faded.
    followups:
      - What did the other team care about most?
      - What would you do differently to avoid the deadlock?
    common_errors:
      - Treating the other team as the problem.

  - external_key: behavioral.conflict.neutral_helper_between_groups
    topic: Helping two other groups resolve a dispute
    difficulty: hard
    text: >-
      Describe a time you were asked to help two groups you didn't belong to work through a dispute between them. How
      did you approach it, and how did you keep both sides trusting you?
    expected_concepts:
      - meeting each side separately to understand interests
      - staying neutral and being seen as neutral
      - separating facts from positions
      - building options jointly
      - outcome and follow-through
    rubric:
      excellent: Understood each side's interests separately, stayed visibly neutral, separated facts from positions and facilitated joint options that both groups followed through on.
      good: Helped the groups reach a workable agreement.
      weak: Imposed a solution, or was seen as favouring one side.
    followups:
      - How did you show both sides you weren't taking a side?
      - What happened after the agreement?
    common_errors:
      - Deciding for them instead of facilitating.

  - external_key: behavioral.conflict.mediating_with_own_stake
    topic: Resolving a dispute when you had a stake
    difficulty: hard
    text: >-
      Tell me about a time you were trying to help resolve a disagreement but had a preference or stake in the outcome
      yourself. How did you handle that tension?
    expected_concepts:
      - being transparent about their stake
      - deliberately representing the other view fairly
      - involving a neutral person if needed
      - letting the decision rest on agreed criteria
      - reflection on the outcome
    rubric:
      excellent: Was open about their stake, took concrete steps to treat the other side fairly such as involving a neutral party or agreed criteria, and reflects on whether the outcome was fair.
      good: Acknowledged the stake and tried to stay fair.
      weak: Used the role to steer the outcome toward their own preference.
    followups:
      - Did the other side see you as fair?
      - Would you take that role again?
    common_errors:
      - Not disclosing their own preference.

  - external_key: behavioral.conflict.never_fully_resolved
    topic: Working well despite an unresolved conflict
    difficulty: hard
    text: >-
      Tell me about a disagreement with a colleague that never fully got resolved, but you still had to keep working
      closely together. How did you make that work?
    expected_concepts:
      - accepting that agreement wasn't possible
      - agreeing on the areas where they did agree
      - clear working rules for the rest
      - keeping the disagreement out of shared work
      - outcome for the work
    rubric:
      excellent: Accepted the lasting disagreement, agreed common ground and practical working rules, kept the work unaffected and shows good results despite the disagreement.
      good: Kept working effectively despite the disagreement.
      weak: Let the disagreement affect the shared work, or avoided working with the colleague.
    followups:
      - What did you agree on, despite the disagreement?
      - How did others on the team experience it?
    common_errors:
      - Avoiding collaboration instead of finding a way to work together.

  - external_key: behavioral.conflict.same_conflict_kept_returning
    competency_key: problem_solving
    topic: Fixing the cause of a recurring conflict
    difficulty: hard
    text: >-
      Tell me about a time the same kind of conflict kept coming back, even with different people involved. How did
      you work out what was causing it, and what did you change?
    expected_concepts:
      - recognising the recurring pattern
      - looking for structural causes such as unclear ownership, incentives or process
      - involving those affected in the diagnosis
      - a systemic change
      - evidence the conflict stopped recurring
    rubric:
      excellent: Recognised the pattern across people, traced it to a structural cause, involved others in diagnosing it and made a systemic change with evidence that it worked.
      good: Identified a cause and made a reasonable change.
      weak: Treated each conflict separately, or blamed the individuals.
    followups:
      - What was the underlying cause?
      - Who had to agree to the change?
    common_errors:
      - Blaming individuals for a structural problem.
