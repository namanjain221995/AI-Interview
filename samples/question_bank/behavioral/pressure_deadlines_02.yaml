# Behavioural: working under pressure and tight deadlines (part 2 of 4) - getting up to speed fast,
# daily prioritisation, rush jobs, escalation, competing customers and resetting expectations.
# Questions ask for real past examples; evaluation is based only on the content of the example
# (actions, results, reflection), never on personality, emotion or delivery style.
version: 1
defaults:
  role_tags: [general]
  round_types: [behavioral, combined]
  kind: behavioral
questions:
  # ------------------------------------------------------------------------------- easy
  - external_key: behavioral.pressure_deadlines.unfamiliar_area_short_notice
    competency_key: adaptability
    topic: Delivering quickly in an unfamiliar area
    difficulty: easy
    text: >-
      Tell me about a time you had to deliver something on a short timeline in an area you didn't know well.
      How did you get up to speed fast enough to finish it?
    expected_concepts:
      - what was unfamiliar and why time was short
      - learning only what the task required
      - using people, examples or documentation to shortcut learning
      - checking their work with someone more experienced
      - outcome and what they would reuse next time
    rubric:
      excellent: Explains how they focused learning on what the task needed, used specific sources or people to speed up, had the result checked, and delivered with a clear outcome.
      good: Gives a real example of learning quickly and delivering.
      weak: Describes general study habits without a specific deadline or result.
    followups:
      - Who did you lean on most, and how?
      - What did you deliberately not learn at the time?
    common_errors:
      - Trying to learn the whole area before starting the actual task.

  - external_key: behavioral.pressure_deadlines.more_work_than_week
    competency_key: ownership
    topic: Choosing what to do first when overloaded
    difficulty: easy
    text: >-
      Think of a recent week when you had clearly more on your plate than would fit. How did you decide what
      got done first and what waited?
    expected_concepts:
      - listing the work and its deadlines
      - criteria such as impact, urgency and who was blocked
      - checking priorities with a manager or requesters
      - telling people whose work would wait
      - what was done and what slipped
    rubric:
      excellent: Describes concrete criteria for ordering the work, confirms priorities with the right people, tells those affected, and reports what was done and what moved.
      good: Gives a real example with a reasonable way of prioritising.
      weak: Worked in the order requests arrived, or describes no real choice.
    followups:
      - Was there anything you chose to drop entirely?
      - Did anyone disagree with your order?
    common_errors:
      - Prioritising by whoever asked most recently or most loudly.

  - external_key: behavioral.pressure_deadlines.handing_part_of_work_off
    competency_key: ownership
    topic: Handing off part of the work to meet a date
    difficulty: easy
    text: >-
      Tell me about a time you handed part of your work to someone else so that the whole thing could be
      finished on time. How did you decide which part to hand over, and how did you set them up to succeed?
    expected_concepts:
      - recognising that they could not finish alone
      - choosing a well-defined piece to hand over
      - clear context, expectations and a done definition
      - staying available and checking in
      - result for the deadline
    rubric:
      excellent: Explains why they handed work off, why that piece was suitable, the context and expectations they gave, how they stayed involved, and the result.
      good: Gives a real example with a sensible hand-off and outcome.
      weak: Dumped work on someone with no context, or never let go of anything.
    followups:
      - What did you have to explain that you hadn't expected?
      - How did you check the handed-off work?
    common_errors:
      - Handing over a piece that depended heavily on their own unfinished work.

  - external_key: behavioral.pressure_deadlines.vague_request_short_timeline
    competency_key: communication
    topic: Clarifying a vague request on a short timeline
    difficulty: easy
    text: >-
      Tell me about a time you got a request that was both urgent and unclear. How did you work out what was
      really needed without losing too much of the little time you had?
    expected_concepts:
      - what was unclear in the request
      - a few targeted questions to the requester
      - confirming the essentials in writing or with an example
      - starting on the parts that were already clear
      - outcome and whether it met the real need
    rubric:
      excellent: Identifies what was unclear, describes the specific questions they asked and how they confirmed the essentials, shows they made progress in parallel, and reports whether it met the need.
      good: Gives a real example of clarifying quickly and delivering.
      weak: Guessed and delivered the wrong thing, or waited a long time for full requirements.
    followups:
      - What assumption did you make that turned out to be wrong?
      - How did you confirm you'd understood correctly?
    common_errors:
      - Asking for a full specification when a few questions would do.

  - external_key: behavioral.pressure_deadlines.mistake_from_rushing
    competency_key: ownership
    topic: A mistake caused by rushing
    difficulty: easy
    text: >-
      Tell me about a mistake you made because you were rushing to meet a deadline. How was it found, and what
      did you do about it?
    expected_concepts:
      - the mistake and its effect
      - how it was discovered
      - fixing it and telling those affected
      - why the rush led to the mistake
      - a concrete change to avoid repeating it
    rubric:
      excellent: Owns the mistake plainly, explains its impact and how it was fixed and communicated, links it to the rush, and describes a concrete safeguard they adopted.
      good: Gives a real mistake with a fix and a lesson.
      weak: Picks a trivial example, blames the deadline entirely, or describes no change afterwards.
    followups:
      - Who did you tell first?
      - Have you been in a similar rush since, and what did you do differently?
    common_errors:
      - Lessons that amount to being more careful.

  - external_key: behavioral.pressure_deadlines.self_imposed_commitment
    competency_key: ownership
    topic: Keeping a deadline you set yourself
    difficulty: easy
    text: >-
      Tell me about a date you committed to yourself, without anyone imposing it on you. How did you make sure
      you kept it when other work started competing for your time?
    expected_concepts:
      - what they committed to and to whom
      - how they set the date
      - protecting time for it among other work
      - adjusting or renegotiating if needed
      - outcome
    rubric:
      excellent: Explains how they chose the date, how they protected time for it against competing work, any renegotiation, and the outcome.
      good: Gives a real self-set commitment that was kept or sensibly adjusted.
      weak: Example where the commitment quietly lapsed with no follow-up.
    followups:
      - What made you pick that date?
      - What competed hardest for that time?
    common_errors:
      - Treating self-set dates as optional.

  - external_key: behavioral.pressure_deadlines.urgent_customer_need
    competency_key: ownership
    topic: An urgent request from a customer or user
    difficulty: easy
    text: >-
      Tell me about a time a customer or user needed something from you urgently. How did you work out what
      you could realistically give them, and by when?
    expected_concepts:
      - the request and why it was urgent for them
      - separating the immediate need from the full request
      - setting a realistic expectation
      - delivering a first piece quickly
      - follow-through on the rest
    rubric:
      excellent: Distinguishes the immediate need from the rest, sets a realistic expectation, delivers something useful quickly, and follows through on the remainder.
      good: Gives a real example of meeting an urgent need with clear expectations.
      weak: Promised everything immediately and then missed, or did not engage with the urgency.
    followups:
      - What did you tell them you couldn't do in time?
      - How did you follow up afterwards?
    common_errors:
      - Overpromising to relieve the immediate pressure.

  - external_key: behavioral.pressure_deadlines.quick_review_for_colleague
    competency_key: culture_values
    topic: Reviewing someone else's work under time pressure
    difficulty: easy
    text: >-
      Tell me about a time you had to review a colleague's work quickly because it was due soon. How did you
      decide what to focus your review on?
    expected_concepts:
      - the work being reviewed and the time available
      - focusing on the highest-risk parts
      - clear, actionable feedback
      - separating blockers from nice-to-have comments
      - outcome for the work and the deadline
    rubric:
      excellent: Explains how they focused on the riskiest parts, separated blocking issues from minor ones, gave actionable feedback quickly, and reports the outcome.
      good: Gives a real example of a focused, useful review.
      weak: Rubber-stamped the work, or held it up with minor comments.
    followups:
      - What did you decide not to comment on?
      - Did you find anything that changed the plan?
    common_errors:
      - Approving without reading because time was short.

  - external_key: behavioral.pressure_deadlines.finished_with_time_to_spare
    competency_key: ownership
    topic: A deadline met comfortably
    difficulty: easy
    text: >-
      Tell me about a time you finished something important comfortably ahead of its deadline. What did you do
      differently from the times when things got tight?
    expected_concepts:
      - the work and the deadline
      - early planning or risk reduction
      - steady progress rather than a late push
      - what they did with the spare time
      - lessons they carried to other work
    rubric:
      excellent: Identifies specific planning choices that made the difference, explains how they used the spare time well, and shows they reused the approach on later work.
      good: Gives a real example with a clear reason it went smoothly.
      weak: Attributes it only to luck or an easy task.
    followups:
      - Why don't all your deadlines go that way?
      - How did you use the extra time?
    common_errors:
      - Not reflecting on why it went well.

  # ------------------------------------------------------------------------------- medium
  - external_key: behavioral.pressure_deadlines.agreeing_definition_of_done
    competency_key: communication
    topic: Agreeing what done means under a deadline
    difficulty: medium
    text: >-
      Tell me about a time you and the person you were delivering for had different ideas about what done
      meant, and the deadline made that gap matter. How did you settle it?
    expected_concepts:
      - what each side expected
      - when and how the gap was noticed
      - making the expectations explicit
      - agreeing a version achievable by the date
      - outcome and how it was avoided later
    rubric:
      excellent: Describes both expectations, how the gap surfaced, how they made expectations explicit and agreed a deliverable for the date, and what they changed to agree done earlier next time.
      good: Gives a real example with a clear agreement reached.
      weak: Delivered their own version and was surprised at the reaction.
    followups:
      - What would you agree up front now?
      - Who gave ground, and on what?
    common_errors:
      - Assuming done means the same thing to everyone.

  - external_key: behavioral.pressure_deadlines.two_projects_several_weeks
    competency_key: adaptability
    topic: Keeping two projects moving over weeks
    difficulty: medium
    text: >-
      Describe a period of several weeks when you were working on two separate projects with their own
      deadlines. How did you structure your time, and what slipped?
    expected_concepts:
      - the two projects and their deadlines
      - a way of structuring time, such as fixed blocks
      - reducing context-switching cost
      - visibility for both sets of stakeholders
      - what slipped and how it was handled
    rubric:
      excellent: Describes a deliberate time structure, how they reduced switching cost, kept both sides informed, and candidly names what slipped and how they handled it.
      good: Gives a real example with a workable structure and outcome.
      weak: Switched constantly with no structure, or claims nothing slipped with no explanation.
    followups:
      - How did the two sets of stakeholders know where they stood?
      - What would you ask for if it happened again?
    common_errors:
      - Ignoring the cost of switching between projects.

  - external_key: behavioral.pressure_deadlines.risk_raised_close_to_date
    competency_key: communication
    topic: Raising a risk close to the deadline
    difficulty: medium
    text: >-
      Tell me about a time you spotted a significant risk when the deadline was already close and raising it
      would be unwelcome. How did you decide to bring it up, and how did you present it?
    expected_concepts:
      - the risk and its potential impact
      - weighing the cost of raising it against staying quiet
      - presenting it with evidence and options
      - choosing the right people to tell
      - what was decided and the outcome
    rubric:
      excellent: Explains the risk and its impact, shows they raised it promptly with evidence and options to the right people, and reports what was decided and how it turned out.
      good: Gives a real example of raising a late risk clearly.
      weak: Kept the risk to themselves, or raised it without evidence or options.
    followups:
      - How did people react when you raised it?
      - What would have happened if you'd stayed quiet?
    common_errors:
      - Waiting for more certainty until it was too late to act.

  - external_key: behavioral.pressure_deadlines.minimum_quality_bar_upfront
    competency_key: culture_values
    topic: Agreeing a minimum quality bar before the crunch
    difficulty: medium
    text: >-
      Tell me about a time you agreed with others, before a busy delivery began, on which quality standards
      would not be dropped however tight things got. How did that agreement hold up?
    expected_concepts:
      - why they set the bar in advance
      - the specific standards agreed
      - who agreed and how it was recorded
      - a moment the bar was tested under pressure
      - outcome and quality after delivery
    rubric:
      excellent: Names the specific standards and who agreed them, describes a moment the agreement was tested and what happened, and shows its effect on the delivered quality.
      good: Gives a real example of agreeing standards ahead of time with some result.
      weak: Describes standards only in general terms, or never tested.
    followups:
      - Who tried to relax the bar, and what happened?
      - What would you add to that agreement now?
    common_errors:
      - Agreeing standards that were too vague to apply.

  - external_key: behavioral.pressure_deadlines.minimal_planning_rush_job
    competency_key: ownership
    topic: Planning a rush job that had to start immediately
    difficulty: medium
    text: >-
      Tell me about a time you were asked to start on something right away with no time for proper planning.
      What was the minimum planning you still did, and why?
    expected_concepts:
      - the request and why it was urgent
      - the few questions or steps they would not skip
      - identifying the biggest risks quickly
      - planning further as the work progressed
      - outcome
    rubric:
      excellent: Describes the minimal planning they insisted on and why it mattered, how they identified the main risks quickly, how planning continued during the work, and the result.
      good: Gives a real example with some lightweight planning and an outcome.
      weak: Jumped straight in with no plan and describes avoidable problems, or delayed starting to plan fully.
    followups:
      - What did that minimal planning save you from?
      - What would you plan differently with an extra hour?
    common_errors:
      - Treating no planning and minimal planning as the same thing.

  - external_key: behavioral.pressure_deadlines.iteration_goal_at_risk
    competency_key: ownership
    topic: A short-cycle goal at risk midway
    difficulty: medium
    text: >-
      Tell me about a time a short-term goal, like a sprint or weekly commitment, looked at risk halfway
      through. What did you do in the second half?
    expected_concepts:
      - signals that the goal was at risk
      - re-planning the remaining time
      - deciding what to drop or simplify
      - informing the team and stakeholders
      - result and what changed in later planning
    rubric:
      excellent: Describes the early signals, a concrete re-plan for the remaining time, what was dropped and agreed with others, and how later planning changed.
      good: Gives a real example with sensible re-planning.
      weak: Carried on as planned and missed the goal without adjustment.
    followups:
      - When did you first notice it was at risk?
      - How did you decide what to drop?
    common_errors:
      - Waiting until the last day to admit the goal was at risk.

  - external_key: behavioral.pressure_deadlines.tooling_investment_under_deadline
    competency_key: problem_solving
    topic: Investing in tooling despite the deadline
    difficulty: medium
    text: >-
      Tell me about a time you spent some of your limited time building a tool, script or template because
      you believed it would get you to the deadline faster. How did you decide it was worth it?
    expected_concepts:
      - the repetitive or slow work being addressed
      - estimating time saved against time spent
      - keeping the tool simple
      - actual time saved
      - reuse after the deadline
    rubric:
      excellent: Compares the time the tool would cost with what it would save, kept it simple, and reports the actual effect on the deadline and later reuse.
      good: Gives a real example where the investment paid off.
      weak: Built tooling for its own sake, or cannot say whether it helped.
    followups:
      - At what point would you have abandoned the tool?
      - Did anyone else use it afterwards?
    common_errors:
      - Over-engineering the tool and losing the time saved.

  - external_key: behavioral.pressure_deadlines.escalation_timing
    competency_key: ownership
    topic: Deciding when to escalate a schedule problem
    difficulty: medium
    text: >-
      Tell me about a time you had to decide whether to escalate a problem that was threatening a deadline.
      How did you decide it was time, and what did you bring with you?
    expected_concepts:
      - the problem and its effect on the deadline
      - what they tried before escalating
      - criteria for when to escalate
      - bringing options and a recommendation
      - outcome of the escalation
    rubric:
      excellent: Explains what they tried first, clear criteria for escalating, and that they came with options and a recommendation, with a concrete outcome.
      good: Gives a real example of timely escalation with useful information.
      weak: Escalated immediately without trying anything, or far too late.
    followups:
      - Would escalating earlier have helped?
      - What did you ask the person you escalated to for?
    common_errors:
      - Escalating a problem without any proposed options.

  - external_key: behavioral.pressure_deadlines.follow_up_after_rushed_launch
    competency_key: ownership
    topic: Following up after a rushed delivery
    difficulty: medium
    text: >-
      After you've shipped something under heavy time pressure, what do you do in the following days or weeks?
      Tell me about a specific time.
    expected_concepts:
      - checking the delivered work in real use
      - listing known gaps and shortcuts
      - fixing urgent issues quickly
      - scheduling the remaining clean-up
      - a review of what to change next time
    rubric:
      excellent: Describes checking real usage, a list of known gaps that was acted on, timely fixes, and a review that led to specific changes.
      good: Gives a real example of follow-up after a rushed delivery.
      weak: Moved straight on to the next thing with no follow-up.
    followups:
      - What did you find when you looked at it in real use?
      - Who else did you involve in the follow-up?
    common_errors:
      - Assuming the work was finished once it shipped.

  - external_key: behavioral.pressure_deadlines.distributed_team_deadline
    competency_key: collaboration
    topic: Meeting a deadline across locations and time zones
    difficulty: medium
    text: >-
      Tell me about a time you had to meet a tight deadline with colleagues working in different locations or
      time zones. How did you keep the work moving across the hand-offs?
    expected_concepts:
      - who was involved and where the hand-offs happened
      - clear written hand-off notes
      - using overlapping hours for decisions
      - avoiding waiting overnight for answers
      - outcome against the deadline
    rubric:
      excellent: Describes concrete hand-off practices, how overlapping time was used for decisions, how blockers were avoided between time zones, and the result.
      good: Gives a real example with workable coordination.
      weak: Describes delays from poor hand-offs without any changes they made.
    followups:
      - What went wrong in a hand-off, and how did you fix it?
      - What did you write down that you'd normally say in person?
    common_errors:
      - Relying on real-time conversation that the time difference did not allow.

  - external_key: behavioral.pressure_deadlines.senior_stakeholder_constant_checks
    competency_key: communication
    topic: A senior stakeholder checking in constantly
    difficulty: medium
    text: >-
      Tell me about a time a senior stakeholder was checking in on a deadline so often that it was getting in
      the way of the work. How did you handle it?
    expected_concepts:
      - why the date mattered so much to the stakeholder
      - offering a regular, predictable update instead
      - giving them the information they actually needed
      - protecting time for the work
      - outcome for the relationship and the delivery
    rubric:
      excellent: Understands what the stakeholder needed, proposes a predictable update that met that need, protects time for the work, and shows the result for both.
      good: Gives a real example with a reasonable change in how updates were handled.
      weak: Ignored the stakeholder or let the interruptions continue without addressing them.
    followups:
      - What were they really worried about?
      - How did you suggest the change without causing friction?
    common_errors:
      - Treating the stakeholder's interest as interference rather than a need to meet.

  # ------------------------------------------------------------------------------- hard
  - external_key: behavioral.pressure_deadlines.two_customers_one_capacity
    competency_key: problem_solving
    topic: Two important customers competing for limited capacity
    difficulty: hard
    text: >-
      Tell me about a time two important customers or internal clients needed something by roughly the same
      date and you couldn't fully satisfy both. How did you decide, and how did you handle the one who got
      less?
    expected_concepts:
      - the two needs and their business impact
      - criteria for the decision
      - involving the right decision-makers
      - partial or alternative options for the other side
      - outcome and effect on both relationships
    rubric:
      excellent: Compares both needs on business impact with clear criteria, involves the right decision-makers, offers the other side a meaningful alternative, and reports the effect on both relationships.
      good: Gives a real example with a reasoned decision and some care for the other side.
      weak: Picked whoever pushed hardest, or tried to satisfy both and failed both.
    followups:
      - Who made the final call?
      - What did you offer the side that got less?
    common_errors:
      - Splitting effort evenly so that neither need was met.

  - external_key: behavioral.pressure_deadlines.inherited_commitment
    competency_key: ownership
    topic: Inheriting a commitment that could not be met
    difficulty: hard
    text: >-
      Tell me about a time you took over work that came with a deadline someone else had promised, and you
      soon realised it couldn't be met as promised. What did you do?
    expected_concepts:
      - how they verified the commitment was unrealistic
      - deciding between rescoping, adding help or moving the date
      - talking to the people who had been promised the date
      - avoiding blaming the previous owner
      - outcome and the new plan
    rubric:
      excellent: Verifies the gap with evidence, works out options, takes ownership of resetting expectations without blaming the previous owner, and reports a credible new plan and outcome.
      good: Gives a real example with a reset plan and clear communication.
      weak: Blamed the previous owner, or tried to meet the impossible date silently.
    followups:
      - How did you check that the original date really was out of reach?
      - What did the people expecting the original date say?
    common_errors:
      - Framing the problem as someone else's fault.

  - external_key: behavioral.pressure_deadlines.defending_contingency
    competency_key: ownership
    topic: Building and defending contingency
    difficulty: hard
    text: >-
      On a large piece of work with a firm date, how did you build in contingency for things going wrong, and
      how did you stop that buffer from being used up by extra requests? Walk me through a real case.
    expected_concepts:
      - identifying the riskiest parts of the plan
      - sizing the buffer from those risks
      - making the buffer visible and explaining it
      - rules for when the buffer could be used
      - how much was used and the outcome
    rubric:
      excellent: Sizes the contingency from specific risks, makes it visible with clear rules for using it, describes defending it against extra requests, and reports how much was actually used.
      good: Gives a real example of planning contingency with some result.
      weak: Padded estimates quietly, or had no contingency at all.
    followups:
      - What used up most of the buffer?
      - How did you explain the buffer to someone who wanted it gone?
    common_errors:
      - Hiding buffer inside estimates instead of managing it openly.

  - external_key: behavioral.pressure_deadlines.incident_versus_launch_decision
    competency_key: adaptability
    topic: A serious problem during a launch window
    difficulty: hard
    text: >-
      Tell me about a time a serious unrelated problem hit right in the middle of an important launch or
      delivery window. How did you decide whether the launch should still go ahead?
    expected_concepts:
      - the problem and the launch at stake
      - splitting people and attention between the two
      - criteria for go, partial or postpone
      - communicating the decision to everyone affected
      - outcome and lessons for future launch planning
    rubric:
      excellent: Describes how attention was split, clear criteria for the launch decision, communication to those affected, and the outcome including lessons for future launches.
      good: Gives a real example with a reasoned decision.
      weak: Let the launch proceed by default, or describes only the firefighting.
    followups:
      - Who was involved in the go or no-go decision?
      - What would have changed your decision?
    common_errors:
      - Not separating the two problems into clear owners.

  - external_key: behavioral.pressure_deadlines.resetting_leadership_expectations
    competency_key: communication
    topic: Resetting expectations on a high-visibility date
    difficulty: hard
    text: >-
      Tell me about a time you had to tell senior leadership that a high-visibility date was not going to be
      met as planned. How did you prepare, and how did the conversation go?
    expected_concepts:
      - evidence for the slip and its cause
      - options with consequences, such as reduced scope or a new date
      - a recommendation
      - preparing for difficult questions
      - outcome and how trust was maintained afterwards
    rubric:
      excellent: Prepares with clear evidence and causes, presents options with consequences and a recommendation, and shows how the decision and later delivery maintained trust.
      good: Gives a real example with a prepared message and a decision reached.
      weak: Delivered the news without options, or delayed the conversation until the date had passed.
    followups:
      - What was the hardest question you were asked?
      - How did you make sure the new plan held?
    common_errors:
      - Over-explaining the causes and under-explaining the options.
