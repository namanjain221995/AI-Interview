version: 1
defaults:
  role_tags: [data, data_analyst, data_scientist, ml, llm]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_data_ai.de_company"
    competency_key: recruiter_fit
    topic: "Interest in our data"
    difficulty: easy
    text: "What do you know about our product and the data challenges we might have, and what questions do you have?"
    expected_concepts:
      - "research"
      - "thoughtful questions"
      - "domain"
      - "interest"
    rubric:
      excellent: "Shows research and asks relevant questions about data volume, tools and ownership."
      good: "Gives relevant reasons and some concrete detail about interest in our data, but links to the role stay general."
      weak: "Vague or generic answer on interest in our data that could apply to any job."
    followups:
      - "What did you read about us?"
      - "What would you ask the team?"
    common_errors:
      - "No preparation."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_company"
    competency_key: recruiter_fit
    topic: "Interest in our business"
    difficulty: easy
    text: "What do you know about our business, and what questions would you want to answer as our analyst?"
    expected_concepts:
      - "research"
      - "business questions"
      - "metrics"
      - "interest"
    rubric:
      excellent: "Shows research and proposes sensible questions and metrics."
      good: "Gives relevant reasons and some concrete detail about interest in our business, but links to the role stay general."
      weak: "Vague or generic answer on interest in our business that could apply to any job."
    followups:
      - "Which metric would you look at first?"
      - "What would you ask the team?"
    common_errors:
      - "No business understanding."

  - external_key: "recruiter_screening.motivation_data_ai.ds_company"
    competency_key: recruiter_fit
    topic: "Interest in our problems"
    difficulty: easy
    text: "What problems at our company do you think data science could help with?"
    expected_concepts:
      - "research"
      - "hypotheses"
      - "use cases"
      - "awareness of what is unknown"
    rubric:
      excellent: "Proposes plausible problems and shows what they would verify."
      good: "Gives relevant reasons and some concrete detail about interest in our problems, but links to the role stay general."
      weak: "Vague or generic answer on interest in our problems that could apply to any job."
    followups:
      - "What data would you need?"
      - "What would you check first?"
    common_errors:
      - "Overclaiming without data."

  - external_key: "recruiter_screening.motivation_data_ai.ml_company"
    competency_key: recruiter_fit
    topic: "Interest in our ML work"
    difficulty: easy
    text: "What have you picked up about the machine learning work happening here, and what do you want to ask about it?"
    expected_concepts:
      - "research"
      - "systems"
      - "questions"
      - "interest"
    rubric:
      excellent: "Shows research and asks questions about systems, scale and ownership."
      good: "Gives relevant reasons and some concrete detail about interest in our ml work, but links to the role stay general."
      weak: "Vague or generic answer on interest in our ml work that could apply to any job."
    followups:
      - "What have you seen in our product?"
      - "What do you want to ask the team?"
    common_errors:
      - "Asking nothing."

  - external_key: "recruiter_screening.motivation_data_ai.llm_company"
    competency_key: recruiter_fit
    topic: "Interest in our LLM work"
    difficulty: easy
    text: "What have you learned about how we use language models, and what would you like to ask?"
    expected_concepts:
      - "research"
      - "use cases"
      - "stack"
      - "questions"
    rubric:
      excellent: "Shows research and informed questions about use cases and constraints."
      good: "Gives relevant reasons and some concrete detail about interest in our llm work, but links to the role stay general."
      weak: "Vague or generic answer on interest in our llm work that could apply to any job."
    followups:
      - "What would you want to know about our data?"
      - "What would you build first?"
    common_errors:
      - "No preparation."

  - external_key: "recruiter_screening.motivation_data_ai.de_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "If you started here, how would you spend your first few months as a data engineer?"
    expected_concepts:
      - "learning the platform"
      - "relationships"
      - "quick wins"
      - "priorities"
    rubric:
      excellent: "Describes learning, mapping data flows and delivering one useful improvement."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "How would you choose a first fix?"
      - "What would you ask data consumers?"
    common_errors:
      - "Rebuilding before learning."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "What would you aim to do in your first months as an analyst for our team?"
    expected_concepts:
      - "learning definitions"
      - "meeting stakeholders"
      - "early analysis"
      - "relationship building"
    rubric:
      excellent: "Describes learning definitions and stakeholders, then one useful analysis."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "How would you verify existing metrics?"
      - "What would be a good first deliverable?"
    common_errors:
      - "Producing dashboards without context."

  - external_key: "recruiter_screening.motivation_data_ai.ds_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "How would you approach your first months in this data science role?"
    expected_concepts:
      - "understanding data"
      - "stakeholders"
      - "baseline"
      - "first project"
    rubric:
      excellent: "Describes data discovery, stakeholder alignment and a small baseline project."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "How would you choose a project?"
      - "What would you ask the business?"
    common_errors:
      - "Starting with complex models."

  - external_key: "recruiter_screening.motivation_data_ai.ml_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "What would you want to learn and deliver in your first months as an ML engineer here?"
    expected_concepts:
      - "understanding the stack"
      - "monitoring"
      - "relationships"
      - "first improvement"
    rubric:
      excellent: "Describes learning the pipeline, observing production behaviour and one improvement."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "What would you review first?"
      - "What would you improve?"
    common_errors:
      - "Making sweeping changes."

  - external_key: "recruiter_screening.motivation_data_ai.llm_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "How would you spend your first months on an LLM team?"
    expected_concepts:
      - "understanding use cases"
      - "evaluation sets"
      - "baselines"
      - "relationships"
      - "first improvement"
    rubric:
      excellent: "Describes starting from evaluation data and baseline measurements."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "What would you measure first?"
      - "How would you handle skepticism?"
    common_errors:
      - "Building before measuring."

  - external_key: "recruiter_screening.motivation_data_ai.de_alignment"
    competency_key: recruiter_fit
    topic: "Fit with team scale"
    difficulty: medium
    text: "What size of data platform and team do you want to work with, and what have you learned about what suits you?"
    expected_concepts:
      - "preferences"
      - "experience"
      - "trade-offs"
      - "flexibility"
    rubric:
      excellent: "Gives a clear preference supported by experience and shows flexibility."
      good: "Gives relevant reasons and some concrete detail about fit with team scale, but links to the role stay general."
      weak: "Vague or generic answer on fit with team scale that could apply to any job."
    followups:
      - "What was hard about the biggest system?"
      - "What do you miss from smaller ones?"
    common_errors:
      - "Rigid preferences."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_embed"
    competency_key: recruiter_fit
    topic: "Embedded versus central"
    difficulty: medium
    text: "Some analysts sit within a business team, others in a central team. Which have you experienced and what suits you?"
    expected_concepts:
      - "experience"
      - "trade-offs"
      - "reasons"
      - "flexibility"
    rubric:
      excellent: "Compares both models from experience with reasons."
      good: "Gives relevant reasons and some concrete detail about embedded versus central, but links to the role stay general."
      weak: "Vague or generic answer on embedded versus central that could apply to any job."
    followups:
      - "What did you gain in each?"
      - "How do you keep consistency?"
    common_errors:
      - "Dismissing one model."

  - external_key: "recruiter_screening.motivation_data_ai.ds_product_link"
    competency_key: motivation
    topic: "Product impact"
    difficulty: medium
    text: "How closely do you like to work with the product that uses your models, and why?"
    expected_concepts:
      - "collaboration"
      - "user focus"
      - "feedback"
      - "examples"
    rubric:
      excellent: "Shows interest in product outcomes with an example of iterating on feedback."
      good: "Gives relevant reasons and some concrete detail about product impact, but links to the role stay general."
      weak: "Vague or generic answer on product impact that could apply to any job."
    followups:
      - "How do you learn if the model is used?"
      - "What would you change?"
    common_errors:
      - "Handing off models."

  - external_key: "recruiter_screening.motivation_data_ai.ml_oncall"
    competency_key: recruiter_fit
    topic: "Model operations"
    difficulty: medium
    text: "Production models may need attention outside working hours. How do you feel about being responsible for them, and what has helped you?"
    expected_concepts:
      - "operational experience"
      - "monitoring"
      - "runbooks"
      - "fairness of rotations"
    rubric:
      excellent: "Shows operational experience and sustainable practices."
      good: "Gives relevant reasons and some concrete detail about model operations, but links to the role stay general."
      weak: "Vague or generic answer on model operations that could apply to any job."
    followups:
      - "What alerts do you value?"
      - "How would you reduce pages?"
    common_errors:
      - "Refusing responsibility."

  - external_key: "recruiter_screening.motivation_data_ai.llm_values"
    competency_key: culture_values
    topic: "Working values"
    difficulty: medium
    text: "What values guide you when building with LLMs, such as privacy, transparency and testing?"
    expected_concepts:
      - "privacy"
      - "transparency"
      - "testing"
      - "examples"
      - "trade-offs"
    rubric:
      excellent: "Names values with a specific example of applying them."
      good: "Gives relevant reasons and some concrete detail about working values, but links to the role stay general."
      weak: "Vague or generic answer on working values that could apply to any job."
    followups:
      - "When did you decline a request on these grounds?"
      - "How do you document limits?"
    common_errors:
      - "Abstract values."

  - external_key: "recruiter_screening.motivation_data_ai.de_pace"
    competency_key: recruiter_fit
    topic: "Working pace"
    difficulty: medium
    text: "How do you handle the mix of long-running platform work and urgent data requests?"
    expected_concepts:
      - "planning"
      - "communication"
      - "boundaries"
      - "examples"
    rubric:
      excellent: "Describes practical ways of protecting planned work and handling urgent items."
      good: "Gives relevant reasons and some concrete detail about working pace, but links to the role stay general."
      weak: "Vague or generic answer on working pace that could apply to any job."
    followups:
      - "How do you protect project time?"
      - "What do you say yes to?"
    common_errors:
      - "Never saying no."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_methods"
    competency_key: motivation
    topic: "Methods they enjoy"
    difficulty: medium
    text: "Which analytical methods or tools do you most like using, such as cohort analysis or experiments, and why?"
    expected_concepts:
      - "methods"
      - "examples"
      - "reasoning"
      - "learning"
    rubric:
      excellent: "Names methods with examples of when they were useful and their limits."
      good: "Gives relevant reasons and some concrete detail about methods they enjoy, but links to the role stay general."
      weak: "Vague or generic answer on methods they enjoy that could apply to any job."
    followups:
      - "What method would you like to learn?"
      - "What are the limits of it?"
    common_errors:
      - "Naming methods only."

  - external_key: "recruiter_screening.motivation_data_ai.ds_pride_teach"
    competency_key: motivation
    topic: "Sharing knowledge"
    difficulty: medium
    text: "How do you share your knowledge with colleagues, and what do you enjoy about it?"
    expected_concepts:
      - "mentoring"
      - "documentation"
      - "talks"
      - "examples"
    rubric:
      excellent: "Gives specific examples of sharing knowledge and its effect."
      good: "Gives relevant reasons and some concrete detail about sharing knowledge, but links to the role stay general."
      weak: "Vague or generic answer on sharing knowledge that could apply to any job."
    followups:
      - "Tell me about a time someone grew from your help."
      - "How do you document models?"
    common_errors:
      - "No sharing."

  - external_key: "recruiter_screening.motivation_data_ai.ml_values"
    competency_key: culture_values
    topic: "Engineering values"
    difficulty: medium
    text: "What matters to you in the way an ML team works, such as reproducibility, monitoring and review?"
    expected_concepts:
      - "specific practices"
      - "reasons"
      - "examples"
      - "contribution"
    rubric:
      excellent: "Names practices with examples of introducing or enforcing them."
      good: "Gives relevant reasons and some concrete detail about engineering values, but links to the role stay general."
      weak: "Vague or generic answer on engineering values that could apply to any job."
    followups:
      - "Which have you introduced?"
      - "What do you do when they are missing?"
    common_errors:
      - "Listing values with no examples."

  - external_key: "recruiter_screening.motivation_data_ai.de_ambition"
    competency_key: motivation
    topic: "Ambition and scope"
    difficulty: hard
    text: "What is the largest scope you would want to own in a data engineering role, and what evidence shows you are ready?"
    expected_concepts:
      - "scope"
      - "readiness"
      - "evidence"
      - "support needs"
      - "reflection"
    rubric:
      excellent: "Describes a realistic scope with evidence and support needs."
      good: "Gives relevant reasons and some concrete detail about ambition and scope, but links to the role stay general."
      weak: "Vague or generic answer on ambition and scope that could apply to any job."
    followups:
      - "What would you not take on?"
      - "What help would you want?"
    common_errors:
      - "Overclaiming."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_ambiguity"
    competency_key: motivation
    topic: "Pushing back"
    difficulty: hard
    text: "Tell me about a time a stakeholder wanted a number or conclusion the data did not support. How did you handle it?"
    expected_concepts:
      - "evidence"
      - "communication"
      - "relationship"
      - "alternative"
      - "result"
    rubric:
      excellent: "Describes standing by evidence respectfully and offering alternatives."
      good: "Gives relevant reasons and some concrete detail about pushing back, but links to the role stay general."
      weak: "Vague or generic answer on pushing back that could apply to any job."
    followups:
      - "What did they do afterwards?"
      - "How do you keep the relationship?"
    common_errors:
      - "Giving in."

  - external_key: "recruiter_screening.motivation_data_ai.ds_failure_motivation"
    competency_key: motivation
    topic: "Experiment results"
    difficulty: hard
    text: "Tell me about an experiment or model that disappointed. How did that affect what you chose to work on next?"
    expected_concepts:
      - "specific case"
      - "learning"
      - "communication"
      - "adaptation"
      - "reflection"
    rubric:
      excellent: "Describes the result, what they learned and how they adjusted."
      good: "Gives relevant reasons and some concrete detail about experiment results, but links to the role stay general."
      weak: "Vague or generic answer on experiment results that could apply to any job."
    followups:
      - "What did you tell your stakeholders?"
      - "What would you test earlier?"
    common_errors:
      - "Spinning the result."

  - external_key: "recruiter_screening.motivation_data_ai.llm_where_next"
    competency_key: motivation
    topic: "Future of the field"
    difficulty: hard
    text: "How do you think LLM engineering roles will change in the next few years, and what does that mean for the skills you invest in?"
    expected_concepts:
      - "reasoned view"
      - "skills"
      - "adaptability"
      - "critical thinking"
      - "link to role"
    rubric:
      excellent: "Gives a reasoned view of change, specific skills and shows critical thinking."
      good: "Gives relevant reasons and some concrete detail about future of the field, but links to the role stay general."
      weak: "Vague or generic answer on future of the field that could apply to any job."
    followups:
      - "What would you not invest in?"
      - "How will you know if you were wrong?"
    common_errors:
      - "Predicting with certainty."

  - external_key: "recruiter_screening.motivation_data_ai.de_handover"
    competency_key: motivation
    topic: "Documentation and handover"
    difficulty: easy
    text: "How do you make sure the pipelines you build can be understood and run by someone else?"
    expected_concepts:
      - "documentation"
      - "runbooks"
      - "tests"
      - "handover habits"
      - "example"
    rubric:
      excellent: "Describes concrete habits such as runbooks and tests with an example of a successful handover."
      good: "Gives relevant reasons and some concrete detail about documentation and handover, but links to the role stay general."
      weak: "Vague or generic answer on documentation and handover that could apply to any job."
    followups:
      - "What do you document first?"
      - "Who has used your docs?"
    common_errors:
      - "Documenting afterwards only."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_curiosity"
    competency_key: motivation
    topic: "Curiosity about the business"
    difficulty: easy
    text: "What do you do to learn how the business you support actually works?"
    expected_concepts:
      - "talking to teams"
      - "shadowing"
      - "reading"
      - "questions"
      - "examples"
    rubric:
      excellent: "Describes specific ways of learning the business and an effect on their work."
      good: "Gives relevant reasons and some concrete detail about curiosity about the business, but links to the role stay general."
      weak: "Vague or generic answer on curiosity about the business that could apply to any job."
    followups:
      - "Which team taught you most?"
      - "How did it change your analysis?"
    common_errors:
      - "Sticking to the data only."
