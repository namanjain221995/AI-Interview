version: 1
defaults:
  role_tags: [data, data_analyst, data_scientist, ml, llm]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_data_ai.de_why"
    competency_key: motivation
    topic: "Why data engineering"
    difficulty: easy
    text: "How did you end up in data engineering, and what makes it the right fit for you?"
    expected_concepts:
      - "path into the field"
      - "what they enjoy about pipelines and platforms"
      - "example work"
      - "realistic view"
    rubric:
      excellent: "Gives a clear path and names specific problems such as data quality or scale that they enjoy, with a project example."
      good: "Gives relevant reasons and some concrete detail about why data engineering, but links to the role stay general."
      weak: "Vague or generic answer on why data engineering that could apply to any job."
    followups:
      - "What was the first pipeline you built?"
      - "What part of the work is least glamorous?"
    common_errors:
      - "Describing tools instead of problems."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_why"
    competency_key: motivation
    topic: "Why data analysis"
    difficulty: easy
    text: "What do you like about turning data into answers for a business, and how did you get started in analytics?"
    expected_concepts:
      - "interest in questions and decisions"
      - "examples of analyses"
      - "communication with stakeholders"
    rubric:
      excellent: "Shows a clear interest in decision support with an example of an analysis that mattered."
      good: "Gives relevant reasons and some concrete detail about why data analysis, but links to the role stay general."
      weak: "Vague or generic answer on why data analysis that could apply to any job."
    followups:
      - "Tell me about an analysis that changed a decision."
      - "What kind of question do you enjoy most?"
    common_errors:
      - "Focusing on charts rather than decisions."

  - external_key: "recruiter_screening.motivation_data_ai.ds_why"
    competency_key: motivation
    topic: "Why data science"
    difficulty: easy
    text: "Why data science for you, instead of analytics or engineering?"
    expected_concepts:
      - "reasons for the choice"
      - "interest in modelling and experiments"
      - "examples"
      - "understanding of the work"
    rubric:
      excellent: "Explains why modelling and experiments suit them, with a project showing impact."
      good: "Gives relevant reasons and some concrete detail about why data science, but links to the role stay general."
      weak: "Vague or generic answer on why data science that could apply to any job."
    followups:
      - "What was your first model that made a real difference?"
      - "What do you not enjoy?"
    common_errors:
      - "Saying it is a hot field."

  - external_key: "recruiter_screening.motivation_data_ai.ml_why"
    competency_key: motivation
    topic: "Why machine learning engineering"
    difficulty: easy
    text: "What attracted you to putting machine learning models into production rather than only researching them?"
    expected_concepts:
      - "interest in production ML"
      - "engineering skills"
      - "examples"
      - "realistic view"
    rubric:
      excellent: "Explains a clear preference for production ML with an example of a model they deployed."
      good: "Gives relevant reasons and some concrete detail about why machine learning engineering, but links to the role stay general."
      weak: "Vague or generic answer on why machine learning engineering that could apply to any job."
    followups:
      - "What was the first model you shipped?"
      - "What surprised you about production ML?"
    common_errors:
      - "Focusing on algorithms only."

  - external_key: "recruiter_screening.motivation_data_ai.llm_why"
    competency_key: motivation
    topic: "Why LLM work"
    difficulty: easy
    text: "What got you into building applications with large language models, and what keeps you interested?"
    expected_concepts:
      - "origin"
      - "practical projects"
      - "understanding of limits"
      - "learning habits"
    rubric:
      excellent: "Describes projects they built, understands strengths and limitations, and shows sustained curiosity."
      good: "Gives relevant reasons and some concrete detail about why llm work, but links to the role stay general."
      weak: "Vague or generic answer on why llm work that could apply to any job."
    followups:
      - "What did you build first?"
      - "What do you think is overhyped?"
    common_errors:
      - "Repeating hype."

  - external_key: "recruiter_screening.motivation_data_ai.de_proud"
    competency_key: motivation
    topic: "Proud pipeline"
    difficulty: easy
    text: "Think of a data pipeline or platform you built that you are really happy with. What was it for, and how did you know it worked?"
    expected_concepts:
      - "problem"
      - "design"
      - "their role"
      - "reliability and scale"
      - "users"
    rubric:
      excellent: "Describes the problem, design, their part and measured results such as freshness or cost."
      good: "Gives relevant reasons and some concrete detail about proud pipeline, but links to the role stay general."
      weak: "Vague or generic answer on proud pipeline that could apply to any job."
    followups:
      - "What broke first?"
      - "How did you know it was correct?"
    common_errors:
      - "Naming tools without outcomes."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_proud"
    competency_key: motivation
    topic: "Proud analysis"
    difficulty: easy
    text: "Which analysis or dashboard are you proudest of, and who used it?"
    expected_concepts:
      - "business question"
      - "method"
      - "their role"
      - "adoption"
      - "impact"
    rubric:
      excellent: "Describes a specific business question, the method and the decision it influenced."
      good: "Gives relevant reasons and some concrete detail about proud analysis, but links to the role stay general."
      weak: "Vague or generic answer on proud analysis that could apply to any job."
    followups:
      - "Did anyone act on it?"
      - "What would you change now?"
    common_errors:
      - "Describing a dashboard nobody used."

  - external_key: "recruiter_screening.motivation_data_ai.ds_proud"
    competency_key: motivation
    topic: "Proud model or experiment"
    difficulty: easy
    text: "Tell me about a model or experiment you worked on that you were proud of. What happened as a result?"
    expected_concepts:
      - "problem framing"
      - "method"
      - "validation"
      - "business effect"
      - "their role"
    rubric:
      excellent: "Explains the framing, validation and the effect on the business, with their own contribution."
      good: "Gives relevant reasons and some concrete detail about proud model or experiment, but links to the role stay general."
      weak: "Vague or generic answer on proud model or experiment that could apply to any job."
    followups:
      - "How did you validate it?"
      - "What would you do differently?"
    common_errors:
      - "Quoting accuracy without business context."

  - external_key: "recruiter_screening.motivation_data_ai.ml_proud"
    competency_key: motivation
    topic: "Proud ML system"
    difficulty: easy
    text: "What is the ML system you have put into production that you are proudest of?"
    expected_concepts:
      - "system and users"
      - "their role"
      - "monitoring"
      - "results"
      - "lessons"
    rubric:
      excellent: "Describes a deployed system, how it was monitored and measured results."
      good: "Gives relevant reasons and some concrete detail about proud ml system, but links to the role stay general."
      weak: "Vague or generic answer on proud ml system that could apply to any job."
    followups:
      - "How did you monitor it?"
      - "What went wrong in production?"
    common_errors:
      - "Describing only training."

  - external_key: "recruiter_screening.motivation_data_ai.llm_proud"
    competency_key: motivation
    topic: "Proud LLM project"
    difficulty: easy
    text: "Tell me about an LLM-based feature you built that you are proud of."
    expected_concepts:
      - "use case"
      - "design such as retrieval"
      - "evaluation"
      - "users"
      - "their role"
    rubric:
      excellent: "Describes the use case, design, evaluation method and user results."
      good: "Gives relevant reasons and some concrete detail about proud llm project, but links to the role stay general."
      weak: "Vague or generic answer on proud llm project that could apply to any job."
    followups:
      - "How did you test the quality?"
      - "What failure surprised you?"
    common_errors:
      - "No evaluation described."

  - external_key: "recruiter_screening.motivation_data_ai.de_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "Describe a good week for you in a data engineering team. What are you working on?"
    expected_concepts:
      - "activities"
      - "balance of build and support"
      - "collaboration"
      - "fit"
    rubric:
      excellent: "Describes concrete activities and a realistic balance, and matches them to the role."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "What does a frustrating week look like?"
      - "How much firefighting is normal?"
    common_errors:
      - "Expecting no support work."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "When you picture a week that went well for you as an analyst, what kinds of questions and people filled it?"
    expected_concepts:
      - "activities"
      - "stakeholders"
      - "questions"
      - "independence"
      - "fit"
    rubric:
      excellent: "Describes concrete activities and stakeholder interaction in a realistic way."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "How do you handle urgent requests?"
      - "What do you enjoy least?"
    common_errors:
      - "Wanting only deep work."

  - external_key: "recruiter_screening.motivation_data_ai.ds_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "When you think of a satisfying week as a data scientist, what are you doing?"
    expected_concepts:
      - "exploration"
      - "modelling"
      - "communication"
      - "collaboration"
      - "fit"
    rubric:
      excellent: "Gives a realistic mix of exploration, modelling and communication."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "How much time on data preparation is normal?"
      - "How do you share results?"
    common_errors:
      - "Expecting only modelling."

  - external_key: "recruiter_screening.motivation_data_ai.ml_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: medium
    text: "What kind of week makes you feel productive as an ML engineer?"
    expected_concepts:
      - "building"
      - "debugging"
      - "collaboration"
      - "monitoring"
      - "fit"
    rubric:
      excellent: "Describes a realistic mix of engineering, experiments and monitoring."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "Where does your time actually go?"
      - "What do you try to automate?"
    common_errors:
      - "Describing only research."

  - external_key: "recruiter_screening.motivation_data_ai.llm_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: medium
    text: "Walk me through a good week for you when building with LLMs."
    expected_concepts:
      - "prototyping"
      - "evaluation"
      - "collaboration"
      - "fit"
      - "realistic work"
    rubric:
      excellent: "Describes prototyping and systematic evaluation work, not only experiments."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "How much of the time is evaluation?"
      - "What do you do when a model changes?"
    common_errors:
      - "Only talking about prompts."

  - external_key: "recruiter_screening.motivation_data_ai.de_impact_view"
    competency_key: motivation
    topic: "Seeing impact"
    difficulty: medium
    text: "Data engineering work is often invisible when it goes well. How do you find satisfaction and show impact?"
    expected_concepts:
      - "ways to measure impact"
      - "communication"
      - "user relationships"
      - "examples"
    rubric:
      excellent: "Describes metrics and relationships that show impact, with a concrete example."
      good: "Gives relevant reasons and some concrete detail about seeing impact, but links to the role stay general."
      weak: "Vague or generic answer on seeing impact that could apply to any job."
    followups:
      - "How do you tell users what you improved?"
      - "Which metrics do you use?"
    common_errors:
      - "Needing public recognition."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_influence"
    competency_key: motivation
    topic: "Influencing decisions"
    difficulty: medium
    text: "Tell me about a time your analysis changed what a team decided to do."
    expected_concepts:
      - "situation"
      - "evidence"
      - "communication"
      - "stakeholder response"
      - "result"
    rubric:
      excellent: "Describes the decision, how they communicated findings and uncertainty, and the result."
      good: "Gives relevant reasons and some concrete detail about influencing decisions, but links to the role stay general."
      weak: "Vague or generic answer on influencing decisions that could apply to any job."
    followups:
      - "What if they had disagreed?"
      - "How did you present the uncertainty?"
    common_errors:
      - "Presenting findings without a recommendation."

  - external_key: "recruiter_screening.motivation_data_ai.ds_business_link"
    competency_key: motivation
    topic: "Connecting to business value"
    difficulty: medium
    text: "How do you decide a data science problem is worth working on, and how does that affect your motivation?"
    expected_concepts:
      - "business value"
      - "feasibility"
      - "stakeholders"
      - "examples"
    rubric:
      excellent: "Explains criteria for choosing problems with an example where they declined or reshaped a project."
      good: "Gives relevant reasons and some concrete detail about connecting to business value, but links to the role stay general."
      weak: "Vague or generic answer on connecting to business value that could apply to any job."
    followups:
      - "When did you decide not to build something?"
      - "How do you handle low-value requests?"
    common_errors:
      - "Taking every request."

  - external_key: "recruiter_screening.motivation_data_ai.ml_prod_motivation"
    competency_key: motivation
    topic: "Production reliability"
    difficulty: medium
    text: "How do you feel about owning model behaviour in production, including degraded performance and alerts?"
    expected_concepts:
      - "ownership"
      - "monitoring"
      - "incident handling"
      - "retraining"
      - "examples"
    rubric:
      excellent: "Shows ownership with a real example of detecting and fixing degraded behaviour."
      good: "Gives relevant reasons and some concrete detail about production reliability, but links to the role stay general."
      weak: "Vague or generic answer on production reliability that could apply to any job."
    followups:
      - "Tell me about a model that degraded."
      - "How do you decide when to retrain?"
    common_errors:
      - "Handing models off after deployment."

  - external_key: "recruiter_screening.motivation_data_ai.llm_learning"
    competency_key: motivation
    topic: "Pace of change"
    difficulty: medium
    text: "LLM tooling changes weekly. How do you decide what to learn and what to ignore?"
    expected_concepts:
      - "filtering approach"
      - "practical tests"
      - "fundamentals"
      - "example of adoption"
    rubric:
      excellent: "Describes a filter based on testing against real needs and a case of adopting or rejecting a tool."
      good: "Gives relevant reasons and some concrete detail about pace of change, but links to the role stay general."
      weak: "Vague or generic answer on pace of change that could apply to any job."
    followups:
      - "Which tool have you adopted and dropped?"
      - "How do you evaluate a new model?"
    common_errors:
      - "Chasing every release."

  - external_key: "recruiter_screening.motivation_data_ai.de_stack_pref"
    competency_key: recruiter_fit
    topic: "Tooling preferences"
    difficulty: medium
    text: "Which data tools and platforms have you enjoyed using, and how do you feel about learning our stack?"
    expected_concepts:
      - "tools experience"
      - "reasons"
      - "transferability"
      - "learning examples"
    rubric:
      excellent: "Shows depth with tools, reasons for preferences and a record of learning new ones."
      good: "Gives relevant reasons and some concrete detail about tooling preferences, but links to the role stay general."
      weak: "Vague or generic answer on tooling preferences that could apply to any job."
    followups:
      - "Which tool did you dislike and why?"
      - "What would you learn first?"
    common_errors:
      - "Tool loyalty."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_tool_pref"
    competency_key: recruiter_fit
    topic: "Tools and methods"
    difficulty: medium
    text: "What tools do you prefer for analysis and why, and how do you adapt if our stack differs?"
    expected_concepts:
      - "SQL"
      - "BI tools"
      - "scripting"
      - "reasons"
      - "adaptability"
    rubric:
      excellent: "Describes preferences with reasons and shows adaptability and verification habits."
      good: "Gives relevant reasons and some concrete detail about tools and methods, but links to the role stay general."
      weak: "Vague or generic answer on tools and methods that could apply to any job."
    followups:
      - "What would you do if the BI tool was unfamiliar?"
      - "How do you check your numbers?"
    common_errors:
      - "Refusing other tools."

  - external_key: "recruiter_screening.motivation_data_ai.ds_research_prod"
    competency_key: motivation
    topic: "Research versus delivery"
    difficulty: hard
    text: "Data scientists often feel pulled between exploring and delivering. Tell me about a time you had to balance them, and where you want to be on that spectrum."
    expected_concepts:
      - "balance"
      - "example"
      - "stakeholder communication"
      - "reflection"
      - "link to role"
    rubric:
      excellent: "Describes a concrete trade-off, a boundary they set and where they want to be, linked to the role."
      good: "Gives relevant reasons and some concrete detail about research versus delivery, but links to the role stay general."
      weak: "Vague or generic answer on research versus delivery that could apply to any job."
    followups:
      - "What did you stop exploring?"
      - "How do you set time limits?"
    common_errors:
      - "Wanting exploration without delivery."

  - external_key: "recruiter_screening.motivation_data_ai.ml_hard_lesson"
    competency_key: motivation
    topic: "Learning from a failed model"
    difficulty: hard
    text: "Tell me about a model or ML project that did not work. What did you learn and how did it shape what you do now?"
    expected_concepts:
      - "specific case"
      - "their part"
      - "root cause"
      - "learning"
      - "changes"
    rubric:
      excellent: "Describes the failure and their part, the root cause and lasting changes in practice."
      good: "Gives relevant reasons and some concrete detail about learning from a failed model, but links to the role stay general."
      weak: "Vague or generic answer on learning from a failed model that could apply to any job."
    followups:
      - "How did you tell stakeholders?"
      - "What would you have checked earlier?"
    common_errors:
      - "Blaming the data."

  - external_key: "recruiter_screening.motivation_data_ai.llm_responsible"
    competency_key: motivation
    topic: "Responsible use"
    difficulty: hard
    text: "LLM features can produce wrong or harmful output. How does that responsibility shape the way you like to work?"
    expected_concepts:
      - "evaluation"
      - "guardrails"
      - "human review"
      - "communication of limits"
      - "example"
    rubric:
      excellent: "Shows concrete practices such as evaluation sets and guardrails, with an example of limiting scope."
      good: "Gives relevant reasons and some concrete detail about responsible use, but links to the role stay general."
      weak: "Vague or generic answer on responsible use that could apply to any job."
    followups:
      - "Tell me about a time you limited a feature for safety."
      - "Who should decide the acceptable risk?"
    common_errors:
      - "Dismissing risk."
