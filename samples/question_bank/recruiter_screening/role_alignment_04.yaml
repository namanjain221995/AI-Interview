# Curated questions: recruiter screening, role alignment (04 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.role_alignment.job_fit_summary
    competency_key: communication
    topic: "Summarising your fit"
    difficulty: easy
    text: "Summarise how your background fits this role in three points."
    expected_concepts:
      - "structure"
      - "relevance"
      - "evidence"
      - "concision"
    rubric:
      excellent: "Gives three clear, evidence-backed points tailored to the role."
      good: "Gives three points with limited evidence."
      weak: "Gives unrelated or unstructured points."
    followups:
      - "Which point is strongest?"
      - "What is missing?"
    common_errors:
      - "Gives unrelated or unstructured points."

  - external_key: recruiter_screening.role_alignment.daily_collaboration_tools
    competency_key: collaboration
    topic: "Everyday collaboration"
    difficulty: easy
    text: "What tools and habits help you collaborate well day to day?"
    expected_concepts:
      - "specific tools"
      - "habits"
      - "communication norms"
      - "examples"
    rubric:
      excellent: "Describes tools and norms with an example of how they improved team work."
      good: "Names some tools."
      weak: "Names nothing specific."
    followups:
      - "What would you change?"
      - "How do you handle async messages?"
    common_errors:
      - "Names nothing specific."

  - external_key: recruiter_screening.role_alignment.project_to_deliver_first
    competency_key: ownership
    topic: "First project"
    difficulty: easy
    text: "If you could choose the first project to deliver in this role, what would it be and why?"
    expected_concepts:
      - "reasoned choice"
      - "value"
      - "feasibility"
      - "stakeholder buy-in"
    rubric:
      excellent: "Chooses a project with reasoning about value, feasibility and stakeholder support."
      good: "Chooses a project with a short reason."
      weak: "Chooses an irrelevant or overambitious project."
    followups:
      - "What could go wrong?"
      - "Who would you involve?"
    common_errors:
      - "Chooses an irrelevant or overambitious project."

  - external_key: recruiter_screening.role_alignment.expectations_gap_with_manager
    competency_key: communication
    topic: "When expectations differ"
    difficulty: hard
    text: "Tell me about a time you and your manager saw your responsibilities differently. How did you resolve it?"
    expected_concepts:
      - "specific example"
      - "conversation"
      - "compromise"
      - "outcome"
    rubric:
      excellent: "Describes raising it early, listening, agreeing explicit expectations and following up."
      good: "Describes a conversation and a resolution."
      weak: "Avoided the issue or blamed the manager."
    followups:
      - "What did you learn?"
      - "How did you keep it from recurring?"
    common_errors:
      - "Avoided the issue or blamed the manager."

  - external_key: recruiter_screening.role_alignment.requirement_unfamiliar
    competency_key: adaptability
    topic: "An unfamiliar requirement"
    difficulty: easy
    text: "Which requirement in the posting is least familiar to you, and what is your plan for it?"
    expected_concepts:
      - "candid self-assessment"
      - "plan"
      - "timeline"
      - "support"
    rubric:
      excellent: "Names a specific unfamiliar requirement and a plan with a timeline and support."
      good: "Names a requirement with a general plan."
      weak: "Claims none are unfamiliar."
    followups:
      - "How have you learned similar things?"
      - "What help would you want?"
    common_errors:
      - "Claims none are unfamiliar."

  - external_key: recruiter_screening.role_alignment.role_responsibility_boundary
    competency_key: ownership
    topic: "Edges of the role"
    difficulty: medium
    text: "How do you decide whether something is part of your job or someone else's?"
    expected_concepts:
      - "clarity"
      - "collaboration"
      - "helpfulness"
      - "escalation"
    rubric:
      excellent: "Describes checking scope, helping where it makes sense and agreeing on owners."
      good: "Describes sticking to defined duties."
      weak: "Refuses anything outside the list or takes everything."
    followups:
      - "Give an example."
      - "How do you avoid gaps?"
    common_errors:
      - "Refuses anything outside the list or takes everything."

  - external_key: recruiter_screening.role_alignment.role_quality_vs_deadline
    competency_key: problem_solving
    topic: "Tight deadline"
    difficulty: easy
    text: "Tell me about a time a deadline conflicted with the standard of work you wanted to deliver."
    expected_concepts:
      - "trade-off"
      - "communication"
      - "decision"
      - "outcome"
    rubric:
      excellent: "Describes the trade-off, communicates with stakeholders and records follow-up work."
      good: "Describes the decision and outcome."
      weak: "Cut corners silently or missed the deadline without warning."
    followups:
      - "What did you tell stakeholders?"
      - "What would you do now?"
    common_errors:
      - "Cut corners silently or missed the deadline without warning."

  - external_key: recruiter_screening.role_alignment.role_with_remote_collaboration
    competency_key: collaboration
    topic: "Working with distributed colleagues"
    difficulty: easy
    text: "If colleagues for this role were in different locations, how would you make collaboration work?"
    expected_concepts:
      - "communication norms"
      - "overlap hours"
      - "documentation"
      - "trust"
    rubric:
      excellent: "Describes concrete practices such as written decisions and agreed overlaps."
      good: "Describes some practices."
      weak: "Has no approach."
    followups:
      - "What worked before?"
      - "What fails in this setup?"
    common_errors:
      - "Has no approach."

  - external_key: recruiter_screening.role_alignment.what_you_bring_unique
    competency_key: recruiter_fit
    topic: "What you add"
    difficulty: easy
    text: "What would you add to this team that it may not already have?"
    expected_concepts:
      - "specific contributions"
      - "evidence"
      - "openness to learning"
      - "relevance"
    rubric:
      excellent: "Names specific, evidenced contributions without disparaging others."
      good: "Names general contributions."
      weak: "Names vague traits."
    followups:
      - "How do you know it is missing?"
      - "Show me an example."
    common_errors:
      - "Names vague traits."

  - external_key: recruiter_screening.role_alignment.tasks_that_define_role
    competency_key: recruiter_fit
    topic: "Core of the job"
    difficulty: medium
    text: "Which two or three tasks do you think truly define success in this role, and how ready are you for each?"
    expected_concepts:
      - "prioritisation"
      - "readiness"
      - "evidence"
      - "gaps"
    rubric:
      excellent: "Identifies core tasks with reasoning and assesses readiness with evidence."
      good: "Identifies tasks and general readiness."
      weak: "Lists all tasks as equal."
    followups:
      - "Which is hardest?"
      - "What would you practise?"
    common_errors:
      - "Lists all tasks as equal."

  - external_key: recruiter_screening.role_alignment.long_term_role_value
    competency_key: motivation
    topic: "Sustaining engagement"
    difficulty: medium
    text: "What would keep this role interesting for you over a few years?"
    expected_concepts:
      - "specific factors"
      - "evolving scope"
      - "learning"
      - "realism"
    rubric:
      excellent: "Names work-related factors such as growing scope and new problems, with evidence."
      good: "Names general factors."
      weak: "Names only external rewards."
    followups:
      - "What happened in earlier roles?"
      - "What would you do to keep it fresh?"
    common_errors:
      - "Names only external rewards."

  - external_key: recruiter_screening.role_alignment.onboarding_needs
    competency_key: communication
    topic: "What helps you start well"
    difficulty: easy
    text: "What would help you get started well in this role?"
    expected_concepts:
      - "specific needs"
      - "proactive plan"
      - "realistic"
      - "collaboration"
    rubric:
      excellent: "Names concrete needs such as access, context and a first mentor and shows what they will do themselves."
      good: "Names general needs."
      weak: "Expects everything to be provided."
    followups:
      - "What did the best onboarding include?"
      - "How can you speed it up?"
    common_errors:
      - "Expects everything to be provided."

  - external_key: recruiter_screening.role_alignment.role_risk_ownership
    competency_key: ownership
    topic: "Owning a mistake"
    difficulty: medium
    text: "Think of an error of yours that other people had to deal with. What did you do about it, step by step?"
    expected_concepts:
      - "ownership"
      - "communication"
      - "fix"
      - "prevention"
    rubric:
      excellent: "Owns the mistake, communicates early, fixes it and puts prevention in place."
      good: "Describes the mistake and a fix."
      weak: "Minimises or blames others."
    followups:
      - "What was the impact?"
      - "What changed afterward?"
    common_errors:
      - "Minimises or blames others."

  - external_key: recruiter_screening.role_alignment.stakeholder_pushback
    competency_key: communication
    topic: "Pushing back"
    difficulty: hard
    text: "Describe a time you disagreed with a request from a stakeholder. How did you handle it?"
    expected_concepts:
      - "respectful disagreement"
      - "evidence"
      - "alternatives"
      - "outcome"
    rubric:
      excellent: "Presents evidence and alternatives respectfully and reaches an agreed outcome."
      good: "Describes disagreeing and compromising."
      weak: "Complied silently or refused."
    followups:
      - "What did you propose?"
      - "How did the relationship fare?"
    common_errors:
      - "Complied silently or refused."

  - external_key: recruiter_screening.role_alignment.reading_between_roles
    competency_key: recruiter_fit
    topic: "Responsibilities you want to clarify"
    difficulty: medium
    text: "Which responsibility would you like to understand better before deciding if this role is right?"
    expected_concepts:
      - "focused curiosity"
      - "relevance"
      - "decision criteria"
      - "follow-up"
    rubric:
      excellent: "Names a significant responsibility, explains why it matters to them and how an answer would help."
      good: "Names a general area."
      weak: "Has no area to clarify."
    followups:
      - "Why that one?"
      - "What would an ideal answer be?"
    common_errors:
      - "Has no area to clarify."

  - external_key: recruiter_screening.role_alignment.how_you_add_value_fast
    competency_key: ownership
    topic: "Quick wins"
    difficulty: medium
    text: "How do you find quick wins in a new role without cutting corners?"
    expected_concepts:
      - "listening"
      - "prioritisation"
      - "scope"
      - "quality"
    rubric:
      excellent: "Describes discovering pain points, choosing safe small improvements and sharing results."
      good: "Describes looking for easy tasks."
      weak: "Rushes changes or does not try."
    followups:
      - "Give an example."
      - "How do you avoid disruption?"
    common_errors:
      - "Rushes changes or does not try."

  - external_key: recruiter_screening.role_alignment.reporting_lines_comfort
    competency_key: collaboration
    topic: "Working with different leaders"
    difficulty: easy
    text: "How do you adapt to different managers' styles in a role?"
    expected_concepts:
      - "observation"
      - "communication"
      - "adaptation"
      - "examples"
    rubric:
      excellent: "Describes observing preferences, asking directly and adjusting with an example."
      good: "Says they adapt."
      weak: "Insists others adapt."
    followups:
      - "What did you adjust?"
      - "What did you keep?"
    common_errors:
      - "Insists others adapt."

  - external_key: recruiter_screening.role_alignment.exercise_judgement
    competency_key: problem_solving
    topic: "Judgement call"
    difficulty: hard
    text: "Describe a decision in a role where policy did not give a clear answer. How did you decide?"
    expected_concepts:
      - "principles"
      - "consultation"
      - "documentation"
      - "result"
    rubric:
      excellent: "Describes weighing principles, consulting the right people and documenting the decision."
      good: "Describes the decision and outcome."
      weak: "Followed no process."
    followups:
      - "What would you do again?"
      - "What did you document?"
    common_errors:
      - "Followed no process."

  - external_key: recruiter_screening.role_alignment.process_improvement_view
    competency_key: ownership
    topic: "Improving how work is done"
    difficulty: medium
    text: "What kind of process improvements do you like to bring to a role, and how do you introduce them?"
    expected_concepts:
      - "examples"
      - "evidence"
      - "buy-in"
      - "follow-through"
    rubric:
      excellent: "Describes an improvement with evidence of value and how they got buy-in."
      good: "Describes an improvement idea."
      weak: "Describes no improvements or imposes changes."
    followups:
      - "How did you measure it?"
      - "Who resisted?"
    common_errors:
      - "Describes no improvements or imposes changes."

  - external_key: recruiter_screening.role_alignment.learning_style_in_role
    competency_key: adaptability
    topic: "Picking up the team's ways"
    difficulty: easy
    text: "When you join a team, how do you learn its unwritten ways of working?"
    expected_concepts:
      - "observation"
      - "questions"
      - "adopting norms"
      - "examples"
    rubric:
      excellent: "Describes observing, asking and checking norms and documenting what they learn."
      good: "Says they pay attention."
      weak: "Ignores norms."
    followups:
      - "What did you ask?"
      - "How did you check?"
    common_errors:
      - "Ignores norms."

  - external_key: recruiter_screening.role_alignment.role_wrap_up_confidence
    competency_key: recruiter_fit
    topic: "Confidence in the match"
    difficulty: easy
    text: "On a scale from not sure to very sure, how confident are you that this role fits, and what would raise your confidence?"
    expected_concepts:
      - "calibrated view"
      - "reasons"
      - "open questions"
      - "clarity"
    rubric:
      excellent: "Gives a calibrated view with reasons and specifies what information would raise confidence."
      good: "Gives a view with brief reasons."
      weak: "Gives a view without reasons."
    followups:
      - "What is your main uncertainty?"
      - "What would you ask the team?"
    common_errors:
      - "Gives a view without reasons."

  - external_key: recruiter_screening.role_alignment.role_end_state_vision
    competency_key: motivation
    topic: "A year from now"
    difficulty: medium
    text: "If this role goes well, what will be different a year from now because of your work?"
    expected_concepts:
      - "concrete outcomes"
      - "measurable"
      - "stakeholder benefit"
      - "realism"
    rubric:
      excellent: "Describes concrete, realistic changes with measures and who benefits."
      good: "Describes general improvements."
      weak: "Describes nothing specific."
    followups:
      - "How would you know?"
      - "What could prevent it?"
    common_errors:
      - "Describes nothing specific."

  - external_key: recruiter_screening.role_alignment.reporting_back_value
    competency_key: communication
    topic: "Showing value"
    difficulty: medium
    text: "How would you show the value of your work to people who do not see it day to day?"
    expected_concepts:
      - "audience awareness"
      - "evidence"
      - "clarity"
      - "examples"
    rubric:
      excellent: "Describes tailored summaries with evidence and an example that led to support or decisions."
      good: "Describes giving updates."
      weak: "Does not show value beyond tasks."
    followups:
      - "What do you include?"
      - "How often?"
    common_errors:
      - "Does not show value beyond tasks."

  - external_key: recruiter_screening.role_alignment.role_commitment_signals
    competency_key: recruiter_fit
    topic: "Setting up for the long run"
    difficulty: hard
    text: "What would you do in your first months to make sure this role is a good long-term match for both you and the team?"
    expected_concepts:
      - "early checkpoints"
      - "feedback requests"
      - "open conversation"
      - "adjustments"
    rubric:
      excellent: "Describes agreed checkpoints, asking for feedback and speaking up early about fit."
      good: "Describes general effort."
      weak: "Has no plan beyond doing the work."
    followups:
      - "Who would you check in with?"
      - "What would you do if it were not working?"
    common_errors:
      - "Has no plan beyond doing the work."

  - external_key: recruiter_screening.role_alignment.role_stakeholder_map
    competency_key: collaboration
    topic: "Mapping stakeholders"
    difficulty: easy
    text: "How would you work out who the key stakeholders are for this role in your first weeks?"
    expected_concepts:
      - "asking"
      - "mapping"
      - "relationship plan"
      - "follow-up"
    rubric:
      excellent: "Describes asking the manager and peers, drawing a map and scheduling introductory conversations."
      good: "Says they would meet people."
      weak: "Waits for introductions."
    followups:
      - "What would you ask them?"
      - "How would you stay in touch?"
    common_errors:
      - "Waits for introductions."
