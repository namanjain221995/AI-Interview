# Curated questions: recruiter screening, company interest (04 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.company_interest.reasons_to_join
    competency_key: motivation
    topic: "Top reasons"
    difficulty: easy
    text: "What are your top three reasons for wanting to join us?"
    expected_concepts:
      - "clear reasons"
      - "specific"
      - "job-related"
      - "prioritised"
    rubric:
      excellent: "Gives three specific, job-related reasons ranked by importance and linked to research."
      good: "Gives reasons with some detail."
      weak: "Gives vague or perk-only reasons."
    followups:
      - "Which is most important?"
      - "Which did you learn from research?"
    common_errors:
      - "Gives vague or perk-only reasons."

  - external_key: recruiter_screening.company_interest.awareness_of_values
    competency_key: culture_values
    topic: "Our stated values"
    difficulty: easy
    text: "Which of our stated values resonated with you, and why?"
    expected_concepts:
      - "knowledge of values"
      - "reasoning"
      - "examples"
      - "depth of reasoning"
    rubric:
      excellent: "Names a value, explains the reason and gives an example from their work."
      good: "Names a value."
      weak: "Cannot name one."
    followups:
      - "How do you see it in work?"
      - "Which is hardest for you?"
    common_errors:
      - "Cannot name one."

  - external_key: recruiter_screening.company_interest.elevator_pitch_of_company
    competency_key: communication
    topic: "Pitch for us"
    difficulty: easy
    text: "Imagine you had to pitch our company to a friend who is looking for a job. What would you say?"
    expected_concepts:
      - "clarity"
      - "accuracy"
      - "appeal"
      - "candid balance"
    rubric:
      excellent: "Gives a clear, accurate pitch covering mission, work and what is attractive plus what to ask."
      good: "Gives a basic pitch."
      weak: "Gives an inaccurate or vague pitch."
    followups:
      - "What would you leave out?"
      - "What would you check first?"
    common_errors:
      - "Gives an inaccurate or vague pitch."

  - external_key: recruiter_screening.company_interest.industry_trends_impact
    competency_key: problem_solving
    topic: "Trends and the role"
    difficulty: medium
    text: "Which industry trend could most change how this role is done in three years?"
    expected_concepts:
      - "specific trend"
      - "reasoning"
      - "implications"
      - "preparation"
    rubric:
      excellent: "Names a specific trend, explains its effect on the role and describes how they would prepare."
      good: "Names a trend generally."
      weak: "Names buzzwords."
    followups:
      - "How would you adapt?"
      - "Where would you learn more?"
    common_errors:
      - "Names buzzwords."

  - external_key: recruiter_screening.company_interest.job_vs_company_priority
    competency_key: motivation
    topic: "The work or the company"
    difficulty: easy
    text: "When you choose a job, how do you weigh the day-to-day work against the company's reputation and mission?"
    expected_concepts:
      - "weighting"
      - "reasoning"
      - "examples"
      - "self-awareness"
    rubric:
      excellent: "Explains how they weigh both, with a past example, and where this opportunity stands."
      good: "Gives a preference."
      weak: "Cannot weigh them."
    followups:
      - "Which won last time?"
      - "What would change your mind?"
    common_errors:
      - "Cannot weigh them."

  - external_key: recruiter_screening.company_interest.company_site_review
    competency_key: communication
    topic: "From the careers site"
    difficulty: easy
    text: "What did our careers page or job posting tell you about how we work?"
    expected_concepts:
      - "close reading"
      - "inference"
      - "questions"
      - "insight"
    rubric:
      excellent: "Shares specific inferences with questions to confirm."
      good: "Shares a general impression."
      weak: "Did not look."
    followups:
      - "What did it leave out?"
      - "What did you like?"
    common_errors:
      - "Did not look."

  - external_key: recruiter_screening.company_interest.connect_experience_to_customers
    competency_key: ownership
    topic: "Customers like ours"
    difficulty: easy
    text: "Tell me about experience you have with customers or users similar to ours."
    expected_concepts:
      - "relevant experience"
      - "specifics"
      - "learning"
      - "link"
    rubric:
      excellent: "Describes relevant customer experience with lessons applicable here."
      good: "Describes general experience."
      weak: "Has none and no plan."
    followups:
      - "What did you learn?"
      - "What would you do differently?"
    common_errors:
      - "Has none and no plan."

  - external_key: recruiter_screening.company_interest.how_you_stay_informed_on_company
    competency_key: motivation
    topic: "Following us"
    difficulty: easy
    text: "If you joined, how would you keep up with what is happening across the company?"
    expected_concepts:
      - "information sources"
      - "habits"
      - "curiosity"
      - "proactive"
    rubric:
      excellent: "Describes specific habits such as reading updates and talking to other teams."
      good: "Says they would read emails."
      weak: "Has no plan."
    followups:
      - "What would you read first?"
      - "Who would you talk to?"
    common_errors:
      - "Has no plan."

  - external_key: recruiter_screening.company_interest.company_stage_fit_example
    competency_key: adaptability
    topic: "Past settings"
    difficulty: medium
    text: "Describe a past workplace that resembled ours in size or pace. What worked for you there?"
    expected_concepts:
      - "comparison"
      - "self-awareness"
      - "examples"
      - "lessons"
    rubric:
      excellent: "Describes the workplace, what worked and what they learned for this one."
      good: "Describes a workplace in general."
      weak: "Has no comparable experience."
    followups:
      - "What would you do differently?"
      - "What was the hardest?"
    common_errors:
      - "Has no comparable experience."

  - external_key: recruiter_screening.company_interest.gaps_in_knowledge_about_company
    competency_key: communication
    topic: "What you could not find"
    difficulty: medium
    text: "What could you not find out about us, and how would you like to learn it?"
    expected_concepts:
      - "self-awareness"
      - "precise gaps"
      - "plan"
      - "courtesy"
    rubric:
      excellent: "Names specific gaps and proposes ways to learn them."
      good: "Names a general gap."
      weak: "Says they know everything."
    followups:
      - "Who can answer?"
      - "Why does it matter?"
    common_errors:
      - "Says they know everything."

  - external_key: recruiter_screening.company_interest.understanding_of_business_model
    competency_key: problem_solving
    topic: "How we make money"
    difficulty: hard
    text: "How do you think our business works, and what keeps it healthy?"
    expected_concepts:
      - "business model understanding"
      - "reasoning"
      - "openness to learning"
      - "link to role"
    rubric:
      excellent: "Offers a reasoned model of customers, value and costs and notes assumptions to check."
      good: "Offers a basic model."
      weak: "Has no idea."
    followups:
      - "Where could it be wrong?"
      - "Where does the role fit?"
    common_errors:
      - "Has no idea."

  - external_key: recruiter_screening.company_interest.commitment_to_company_goals
    competency_key: ownership
    topic: "Making company goals your own"
    difficulty: medium
    text: "How do you make sure your work supports company goals when the team has its own priorities?"
    expected_concepts:
      - "alignment"
      - "communication"
      - "trade-offs"
      - "example"
    rubric:
      excellent: "Describes checking alignment, raising conflicts and an example of balancing both."
      good: "Says they follow priorities."
      weak: "Ignores company goals."
    followups:
      - "How do you learn the goals?"
      - "What if they conflict?"
    common_errors:
      - "Ignores company goals."

  - external_key: recruiter_screening.company_interest.social_responsibility_view
    competency_key: culture_values
    topic: "Wider responsibility"
    difficulty: medium
    text: "How do you view a company's responsibilities to the community or environment, and how might that appear in your work?"
    expected_concepts:
      - "informed view"
      - "specifics"
      - "action"
      - "boundaries"
    rubric:
      excellent: "Gives a thoughtful view with an example of how it could affect decisions in their role."
      good: "Gives a general view."
      weak: "Has no view."
    followups:
      - "What would you do?"
      - "Where is the line?"
    common_errors:
      - "Has no view."

  - external_key: recruiter_screening.company_interest.referral_or_contact_story
    competency_key: communication
    topic: "Who you spoke to"
    difficulty: easy
    text: "Have you spoken with anyone who works here or used to? What did you learn?"
    expected_concepts:
      - "conversation"
      - "learning"
      - "critical weighing"
      - "courtesy"
    rubric:
      excellent: "Shares specific takeaways and how they weigh them."
      good: "Shares a general impression."
      weak: "Has not spoken to anyone and made no effort."
    followups:
      - "What would you still check?"
      - "What did you ask?"
    common_errors:
      - "Has not spoken to anyone and made no effort."

  - external_key: recruiter_screening.company_interest.long_term_vision_fit
    competency_key: motivation
    topic: "Your view of our future"
    difficulty: medium
    text: "Where do you think our company could be in five years, and how do you see yourself helping?"
    expected_concepts:
      - "vision"
      - "reasoning"
      - "role link"
      - "openness to learning"
    rubric:
      excellent: "Offers a grounded view of the company's possible future and a specific contribution."
      good: "Offers a general vision."
      weak: "Offers an unrealistic vision."
    followups:
      - "What would need to happen?"
      - "What could go wrong?"
    common_errors:
      - "Offers an unrealistic vision."

  - external_key: recruiter_screening.company_interest.culture_research
    competency_key: culture_values
    topic: "Culture signals"
    difficulty: easy
    text: "What signals have you looked for to understand how it feels to work here?"
    expected_concepts:
      - "signals"
      - "sources"
      - "critical thinking"
      - "questions"
    rubric:
      excellent: "Names job-related signals such as practices and feedback and plans to verify them."
      good: "Names a few signals."
      weak: "Relies on gut feeling."
    followups:
      - "What did you find?"
      - "What will you ask?"
    common_errors:
      - "Relies on gut feeling."

  - external_key: recruiter_screening.company_interest.your_unique_angle_on_us
    competency_key: communication
    topic: "Fresh perspective"
    difficulty: medium
    text: "What perspective on our product or market would someone with your background bring?"
    expected_concepts:
      - "specific perspective"
      - "evidence"
      - "relevance"
      - "openness"
    rubric:
      excellent: "Describes a specific perspective grounded in experience and acknowledges what they do not know."
      good: "Describes a general perspective."
      weak: "Has no perspective."
    followups:
      - "Example?"
      - "What would you test?"
    common_errors:
      - "Has no perspective."

  - external_key: recruiter_screening.company_interest.ask_about_success_stories
    competency_key: communication
    topic: "Success at the company"
    difficulty: easy
    text: "What would you ask us about people who have been successful here?"
    expected_concepts:
      - "relevant questions"
      - "growth"
      - "learning"
      - "interest"
    rubric:
      excellent: "Asks about behaviours and paths of successful people and how success is assessed."
      good: "Asks general questions."
      weak: "Asks nothing."
    followups:
      - "Why does that matter?"
      - "What would an ideal answer sound like?"
    common_errors:
      - "Asks nothing."

  - external_key: recruiter_screening.company_interest.team_challenges_ask
    competency_key: communication
    topic: "Understanding challenges"
    difficulty: medium
    text: "How would you ask a team about the biggest challenges they face without sounding critical?"
    expected_concepts:
      - "tact"
      - "open questions"
      - "listening"
      - "follow-up"
    rubric:
      excellent: "Describes open, curious questions, listening and following up with helpful ideas."
      good: "Asks directly."
      weak: "Avoids asking or sounds critical."
    followups:
      - "What would you say?"
      - "What would you do with the answer?"
    common_errors:
      - "Avoids asking or sounds critical."

  - external_key: recruiter_screening.company_interest.alignment_check_after_conversation
    competency_key: recruiter_fit
    topic: "After this conversation"
    difficulty: medium
    text: "After what you have heard today, what is most appealing and what remains unclear to you?"
    expected_concepts:
      - "reflection"
      - "specific points"
      - "clarity"
      - "courtesy"
    rubric:
      excellent: "Shares specific appealing points and open questions that show careful listening."
      good: "Shares general impressions."
      weak: "Has nothing to say."
    followups:
      - "What would you like next?"
      - "What would settle it?"
    common_errors:
      - "Has nothing to say."

  - external_key: recruiter_screening.company_interest.what_you_would_tell_a_friend
    competency_key: communication
    topic: "Describing us to a friend"
    difficulty: easy
    text: "What would you tell a friend you want to learn about our company after today?"
    expected_concepts:
      - "clear points"
      - "accuracy"
      - "balance"
      - "relevance"
    rubric:
      excellent: "Gives accurate, balanced points reflecting what they learned."
      good: "Gives general points."
      weak: "Gives inaccurate points."
    followups:
      - "What would you leave out?"
      - "What would you add?"
    common_errors:
      - "Gives inaccurate points."

  - external_key: recruiter_screening.company_interest.using_company_products_internal
    competency_key: ownership
    topic: "Using our own product"
    difficulty: medium
    text: "If we are building a product, how important is it that staff use it themselves, and how would you do that?"
    expected_concepts:
      - "dogfooding value"
      - "practices"
      - "feedback"
      - "example"
    rubric:
      excellent: "Explains the value, describes practices and an example of using insights."
      good: "Says it is useful."
      weak: "Sees no value."
    followups:
      - "What would you do?"
      - "What did you learn from it?"
    common_errors:
      - "Sees no value."

  - external_key: recruiter_screening.company_interest.curiosity_about_roadmap
    competency_key: problem_solving
    topic: "Roadmap curiosity"
    difficulty: hard
    text: "If you could see our product roadmap, what would you look for to judge whether the strategy is sound?"
    expected_concepts:
      - "criteria"
      - "customers"
      - "focus"
      - "risks"
    rubric:
      excellent: "Names criteria like customer problems, focus and risk and explains the reasoning."
      good: "Names a couple of criteria."
      weak: "Has no framework."
    followups:
      - "What would worry you?"
      - "What would excite you?"
    common_errors:
      - "Has no framework."

  - external_key: recruiter_screening.company_interest.commitment_to_learning_company
    competency_key: ownership
    topic: "Learning the business"
    difficulty: easy
    text: "What would you do in your first month to learn how our business works?"
    expected_concepts:
      - "conversations"
      - "reading"
      - "shadowing"
      - "questions"
    rubric:
      excellent: "Describes a plan of conversations, reading and shadowing with specific goals."
      good: "Describes general learning."
      weak: "Has no plan."
    followups:
      - "Who would you meet?"
      - "What would you read?"
    common_errors:
      - "Has no plan."

  - external_key: recruiter_screening.company_interest.public_commitments_view
    competency_key: culture_values
    topic: "What we say publicly"
    difficulty: easy
    text: "Is there something we have said publicly, such as a principle or a commitment, that you would like to see in practice in the work?"
    expected_concepts:
      - "specific commitment"
      - "connection to work"
      - "reasoning"
      - "questions"
    rubric:
      excellent: "Names a specific commitment, links it to daily work and asks how it is applied."
      good: "Names a general commitment."
      weak: "Names none."
    followups:
      - "How would you check it?"
      - "How would you contribute?"
    common_errors:
      - "Names none."
