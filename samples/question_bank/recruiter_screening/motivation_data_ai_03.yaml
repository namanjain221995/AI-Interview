version: 1
defaults:
  role_tags: [data, data_analyst, data_scientist, ml, llm]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_data_ai.de_learning"
    competency_key: motivation
    topic: "Keeping up"
    difficulty: easy
    text: "How do you keep your data engineering skills current?"
    expected_concepts:
      - "habits"
      - "sources"
      - "practice"
      - "recent example"
    rubric:
      excellent: "Has a routine and a recent applied example."
      good: "Gives relevant reasons and some concrete detail about keeping up, but links to the role stay general."
      weak: "Vague or generic answer on keeping up that could apply to any job."
    followups:
      - "What have you learned recently?"
      - "What do you ignore?"
    common_errors:
      - "No routine."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_learning"
    competency_key: motivation
    topic: "Keeping up"
    difficulty: easy
    text: "How do you keep growing your analytical skills while busy with requests?"
    expected_concepts:
      - "habits"
      - "practice projects"
      - "peers"
      - "recent example"
    rubric:
      excellent: "Describes a routine and a recent example of applying something new."
      good: "Gives relevant reasons and some concrete detail about keeping up, but links to the role stay general."
      weak: "Vague or generic answer on keeping up that could apply to any job."
    followups:
      - "What did you learn last quarter?"
      - "Who do you learn from?"
    common_errors:
      - "Relying only on the job."

  - external_key: "recruiter_screening.motivation_data_ai.ds_learning"
    competency_key: motivation
    topic: "Keeping up"
    difficulty: easy
    text: "Data science moves quickly. How do you decide what to learn?"
    expected_concepts:
      - "filtering"
      - "fundamentals"
      - "projects"
      - "example"
    rubric:
      excellent: "Describes a filter and gives an example of applying something new."
      good: "Gives relevant reasons and some concrete detail about keeping up, but links to the role stay general."
      weak: "Vague or generic answer on keeping up that could apply to any job."
    followups:
      - "Which paper or technique changed your work?"
      - "How do you test new methods?"
    common_errors:
      - "Chasing papers without application."

  - external_key: "recruiter_screening.motivation_data_ai.ml_learning"
    competency_key: motivation
    topic: "Keeping up"
    difficulty: easy
    text: "How do you stay on top of ML engineering practices and tools?"
    expected_concepts:
      - "habits"
      - "communities"
      - "practice"
      - "example"
    rubric:
      excellent: "Describes habits and a recent adoption with reasons."
      good: "Gives relevant reasons and some concrete detail about keeping up, but links to the role stay general."
      weak: "Vague or generic answer on keeping up that could apply to any job."
    followups:
      - "What tool did you adopt recently?"
      - "How do you evaluate tools?"
    common_errors:
      - "Following trends."

  - external_key: "recruiter_screening.motivation_data_ai.llm_learning2"
    competency_key: motivation
    topic: "Hands-on practice"
    difficulty: easy
    text: "Outside of work tasks, how do you experiment with new LLM ideas, and what was the last thing you tried?"
    expected_concepts:
      - "experiments"
      - "learning"
      - "sharing"
      - "recent example"
      - "judgement"
    rubric:
      excellent: "Gives a specific recent experiment and what it taught them."
      good: "Gives relevant reasons and some concrete detail about hands-on practice, but links to the role stay general."
      weak: "Vague or generic answer on hands-on practice that could apply to any job."
    followups:
      - "What did you learn from it?"
      - "Did it make it into your work?"
    common_errors:
      - "Only reading news."

  - external_key: "recruiter_screening.motivation_data_ai.de_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "What made the best data team you worked in effective?"
    expected_concepts:
      - "practices"
      - "communication"
      - "ownership"
      - "their contribution"
    rubric:
      excellent: "Names concrete practices and their own contribution."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "What would you bring to our team?"
      - "What was missing there?"
    common_errors:
      - "Generic praise."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "What did the best analytics team you worked with do well?"
    expected_concepts:
      - "practices such as reviews and shared definitions"
      - "communication"
      - "contribution"
    rubric:
      excellent: "Describes concrete practices and their part in them."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "What would you want to repeat here?"
      - "What did you add?"
    common_errors:
      - "Generic praise."

  - external_key: "recruiter_screening.motivation_data_ai.ds_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "What helped the best data science team you've been part of do good work?"
    expected_concepts:
      - "practices"
      - "review"
      - "shared standards"
      - "communication"
      - "contribution"
    rubric:
      excellent: "Names practices such as peer review and reproducibility with their contribution."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "What would you change?"
      - "How did you share knowledge?"
    common_errors:
      - "Generic praise."

  - external_key: "recruiter_screening.motivation_data_ai.ml_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "Think of the best ML team you have worked with. What made it work?"
    expected_concepts:
      - "practices"
      - "ownership"
      - "tooling"
      - "communication"
      - "contribution"
    rubric:
      excellent: "Describes practices and their contribution."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "Which of those can you replicate?"
      - "What would you improve?"
    common_errors:
      - "Generic praise."

  - external_key: "recruiter_screening.motivation_data_ai.llm_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "What does a good team building LLM products do differently from a team that struggles?"
    expected_concepts:
      - "evaluation culture"
      - "experimentation"
      - "shared learnings"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes concrete practices such as eval-driven development with an example."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "Which habit have you introduced?"
      - "What leads teams astray?"
    common_errors:
      - "Vague generalities."

  - external_key: "recruiter_screening.motivation_data_ai.de_stay_long"
    competency_key: motivation
    topic: "Long-term fit"
    difficulty: easy
    text: "What would make you want to stay in a data engineering role for several years?"
    expected_concepts:
      - "learning"
      - "scope"
      - "team"
      - "growth"
      - "clear criteria"
    rubric:
      excellent: "States job-related criteria such as growth and scope and shows self-awareness."
      good: "Gives relevant reasons and some concrete detail about long-term fit, but links to the role stay general."
      weak: "Vague or generic answer on long-term fit that could apply to any job."
    followups:
      - "What made you stay in past jobs?"
      - "What would make you leave?"
    common_errors:
      - "Only mentioning pay."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_change_reason"
    competency_key: motivation
    topic: "Why a change"
    difficulty: easy
    text: "What is making you consider a move from your current analytics role?"
    expected_concepts:
      - "forward-looking reasons"
      - "role-related"
      - "no blame"
      - "link to the new role"
    rubric:
      excellent: "Gives constructive, forward-looking reasons and links them to the role."
      good: "Gives relevant reasons and some concrete detail about why a change, but links to the role stay general."
      weak: "Vague or generic answer on why a change that could apply to any job."
    followups:
      - "What do you value about your current role?"
      - "What would you want to keep?"
    common_errors:
      - "Complaining about people."

  - external_key: "recruiter_screening.motivation_data_ai.ds_change_reason"
    competency_key: motivation
    topic: "Why a change"
    difficulty: easy
    text: "What has led you to look for a new data science role?"
    expected_concepts:
      - "forward-looking"
      - "role-related"
      - "positive framing"
      - "link"
    rubric:
      excellent: "Gives clear reasons, constructive framing and links to the new role."
      good: "Gives relevant reasons and some concrete detail about why a change, but links to the role stay general."
      weak: "Vague or generic answer on why a change that could apply to any job."
    followups:
      - "What are you hoping to find?"
      - "What would you want to avoid?"
    common_errors:
      - "Blaming the employer."

  - external_key: "recruiter_screening.motivation_data_ai.ml_domain_interest"
    competency_key: motivation
    topic: "Domain interest"
    difficulty: medium
    text: "Which kinds of ML problems do you most like working on, such as recommendations, vision, forecasting or language, and why?"
    expected_concepts:
      - "domain preference"
      - "reasons"
      - "experience"
      - "openness"
    rubric:
      excellent: "Names domains with reasons and examples, and describes how they learn a new one."
      good: "Gives relevant reasons and some concrete detail about domain interest, but links to the role stay general."
      weak: "Vague or generic answer on domain interest that could apply to any job."
    followups:
      - "How do you learn a new domain?"
      - "Which would you avoid?"
    common_errors:
      - "No preferences."

  - external_key: "recruiter_screening.motivation_data_ai.llm_use_cases"
    competency_key: motivation
    topic: "Use cases that excite them"
    difficulty: medium
    text: "Which LLM use cases do you think are truly valuable, and which seem like a stretch?"
    expected_concepts:
      - "critical view"
      - "examples"
      - "value and risk reasoning"
      - "link to role"
    rubric:
      excellent: "Offers a reasoned view with examples that separate value from hype."
      good: "Gives relevant reasons and some concrete detail about use cases that excite them, but links to the role stay general."
      weak: "Vague or generic answer on use cases that excite them that could apply to any job."
    followups:
      - "What project convinced you?"
      - "How do you test the value?"
    common_errors:
      - "Repeating vendor claims without testing."

  - external_key: "recruiter_screening.motivation_data_ai.de_complex_system"
    competency_key: motivation
    topic: "Complex systems"
    difficulty: medium
    text: "What do you enjoy about working with large, messy data systems, and what do you find hard?"
    expected_concepts:
      - "interest"
      - "strategies"
      - "examples"
      - "patience"
      - "realism"
    rubric:
      excellent: "Gives examples of untangling a messy system with a method."
      good: "Gives relevant reasons and some concrete detail about complex systems, but links to the role stay general."
      weak: "Vague or generic answer on complex systems that could apply to any job."
    followups:
      - "Tell me about the messiest system you worked with."
      - "How do you start understanding it?"
    common_errors:
      - "Wanting only clean problems."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_deep_dive"
    competency_key: motivation
    topic: "Deep dives versus routine reports"
    difficulty: medium
    text: "Do you prefer deep investigative analyses or routine reporting? How do you keep both useful?"
    expected_concepts:
      - "preference"
      - "value of both"
      - "automation"
      - "examples"
    rubric:
      excellent: "Shows a balanced view with examples of automating the routine to make time for depth."
      good: "Gives relevant reasons and some concrete detail about deep dives versus routine reports, but links to the role stay general."
      weak: "Vague or generic answer on deep dives versus routine reports that could apply to any job."
    followups:
      - "How do you free time for deeper work?"
      - "How do you decide which reports to retire?"
    common_errors:
      - "Rejecting routine work."

  - external_key: "recruiter_screening.motivation_data_ai.ds_communicate"
    competency_key: motivation
    topic: "Explaining models"
    difficulty: medium
    text: "How do you feel about explaining model results to non-technical people, and what makes it work?"
    expected_concepts:
      - "communication"
      - "examples"
      - "visuals"
      - "uncertainty"
      - "feedback"
    rubric:
      excellent: "Gives an example of explaining a result clearly, including uncertainty."
      good: "Gives relevant reasons and some concrete detail about explaining models, but links to the role stay general."
      weak: "Vague or generic answer on explaining models that could apply to any job."
    followups:
      - "Tell me about an explanation that failed."
      - "How do you talk about uncertainty?"
    common_errors:
      - "Using jargon."

  - external_key: "recruiter_screening.motivation_data_ai.ml_collab_dev"
    competency_key: motivation
    topic: "Engineering practices"
    difficulty: medium
    text: "What engineering practices do you insist on in ML work, such as tests, versioning and reviews, and why do you care?"
    expected_concepts:
      - "practices"
      - "reasons"
      - "examples"
      - "trade-offs"
    rubric:
      excellent: "Names practices with reasons and examples of their value."
      good: "Gives relevant reasons and some concrete detail about engineering practices, but links to the role stay general."
      weak: "Vague or generic answer on engineering practices that could apply to any job."
    followups:
      - "Which practice paid off?"
      - "When have you skipped one?"
    common_errors:
      - "Treating ML as notebooks only."

  - external_key: "recruiter_screening.motivation_data_ai.llm_trust"
    competency_key: motivation
    topic: "Building trust"
    difficulty: medium
    text: "How do you build trust in an LLM feature with users and stakeholders who are sceptical?"
    expected_concepts:
      - "evaluation evidence"
      - "transparency"
      - "limitations"
      - "pilot"
      - "example"
    rubric:
      excellent: "Describes evidence, transparency and staged rollout with an example."
      good: "Gives relevant reasons and some concrete detail about building trust, but links to the role stay general."
      weak: "Vague or generic answer on building trust that could apply to any job."
    followups:
      - "What would you show them first?"
      - "How do you handle a bad output?"
    common_errors:
      - "Overselling."

  - external_key: "recruiter_screening.motivation_data_ai.de_cost"
    competency_key: motivation
    topic: "Cost awareness"
    difficulty: medium
    text: "How do you think about the cost of data pipelines and storage, and what have you done about it?"
    expected_concepts:
      - "cost monitoring"
      - "optimisation"
      - "trade-offs"
      - "example with numbers"
    rubric:
      excellent: "Gives an example with numbers and trade-offs."
      good: "Gives relevant reasons and some concrete detail about cost awareness, but links to the role stay general."
      weak: "Vague or generic answer on cost awareness that could apply to any job."
    followups:
      - "What did you stop doing?"
      - "How do you balance cost and freshness?"
    common_errors:
      - "Ignoring cost."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_prioritise"
    competency_key: motivation
    topic: "Prioritising requests"
    difficulty: medium
    text: "Many teams ask analysts for help at once. How do you decide what to work on, and how do you say no?"
    expected_concepts:
      - "prioritisation criteria"
      - "communication"
      - "stakeholder management"
      - "example"
    rubric:
      excellent: "Describes criteria and respectful communication with an example."
      good: "Gives relevant reasons and some concrete detail about prioritising requests, but links to the role stay general."
      weak: "Vague or generic answer on prioritising requests that could apply to any job."
    followups:
      - "How do you communicate a no?"
      - "Who decides priority?"
    common_errors:
      - "Accepting everything."

  - external_key: "recruiter_screening.motivation_data_ai.ds_long_term"
    competency_key: motivation
    topic: "Long-term direction"
    difficulty: hard
    text: "Where do you see yourself in data science over the next five years: specialist, lead, or something else? How do you decide?"
    expected_concepts:
      - "self-awareness"
      - "reasoning"
      - "experiments"
      - "link to role"
      - "flexibility"
    rubric:
      excellent: "Names a direction with evidence from past work and ties it to the role."
      good: "Gives relevant reasons and some concrete detail about long-term direction, but links to the role stay general."
      weak: "Vague or generic answer on long-term direction that could apply to any job."
    followups:
      - "What evidence do you have for that preference?"
      - "What would change your mind?"
    common_errors:
      - "No direction."

  - external_key: "recruiter_screening.motivation_data_ai.llm_resilience"
    competency_key: motivation
    topic: "Dealing with uncertainty"
    difficulty: hard
    text: "LLM projects rarely have predictable results. Tell me about a time an approach did not work out and how you moved forward."
    expected_concepts:
      - "specific case"
      - "experiments"
      - "communication"
      - "pivot"
      - "learning"
    rubric:
      excellent: "Describes the experiments and pivot, how they communicated and what they learned."
      good: "Gives relevant reasons and some concrete detail about dealing with uncertainty, but links to the role stay general."
      weak: "Vague or generic answer on dealing with uncertainty that could apply to any job."
    followups:
      - "How did you report it?"
      - "What did you keep?"
    common_errors:
      - "Hiding failure."

  - external_key: "recruiter_screening.motivation_data_ai.de_critical_data"
    competency_key: motivation
    topic: "Critical systems"
    difficulty: hard
    text: "Tell me about the most business-critical data system you supported. What motivated you to keep it reliable?"
    expected_concepts:
      - "criticality"
      - "reliability practices"
      - "incident handling"
      - "stakeholders"
      - "results"
    rubric:
      excellent: "Describes reliability practices, incident handling and measured results."
      good: "Gives relevant reasons and some concrete detail about critical systems, but links to the role stay general."
      weak: "Vague or generic answer on critical systems that could apply to any job."
    followups:
      - "What was your riskiest change?"
      - "How did you measure reliability?"
    common_errors:
      - "Treating reliability as luck."
