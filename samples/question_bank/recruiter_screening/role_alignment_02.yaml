# Curated questions: recruiter screening, role alignment (02 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.role_alignment.role_excites_mission
    competency_key: motivation
    topic: "Appeal of the work"
    difficulty: easy
    text: "Which tasks in a normal week of this job do you expect to enjoy doing well?"
    expected_concepts:
      - "specific tasks"
      - "link to strengths"
      - "reasons"
      - "clarity"
    rubric:
      excellent: "Names specific tasks, links them to strengths and explains why they suit them."
      good: "Names appealing aspects generally."
      weak: "Mentions only title or benefits."
    followups:
      - "Which task would you pick first?"
      - "What have you done like that?"
    common_errors:
      - "Mentions only title or benefits."

  - external_key: recruiter_screening.role_alignment.requirements_you_exceed
    competency_key: recruiter_fit
    topic: "Where you go beyond"
    difficulty: easy
    text: "Is there something you can bring that goes beyond the listed requirements?"
    expected_concepts:
      - "extra strengths"
      - "evidence"
      - "relevance"
      - "team benefit"
    rubric:
      excellent: "Names relevant extra strengths with evidence and how the team would benefit."
      good: "Names extra strengths with brief evidence."
      weak: "Names unrelated strengths."
    followups:
      - "When did that help?"
      - "How would it help here?"
    common_errors:
      - "Names unrelated strengths."

  - external_key: recruiter_screening.role_alignment.role_scope_change
    competency_key: adaptability
    topic: "Role that evolves"
    difficulty: easy
    text: "Roles often grow beyond the original description. How have you handled that?"
    expected_concepts:
      - "adaptation"
      - "communication with manager"
      - "examples"
      - "boundaries"
    rubric:
      excellent: "Describes a role that grew, how they adapted and how they agreed on scope with their manager."
      good: "Describes the growth and a basic response."
      weak: "Has no example or resisted."
    followups:
      - "What did you negotiate?"
      - "What was most useful to learn?"
    common_errors:
      - "Has no example or resisted."

  - external_key: recruiter_screening.role_alignment.stakeholder_expectations
    competency_key: communication
    topic: "Setting expectations"
    difficulty: medium
    text: "When you start a role, how do you find out what people expect of you?"
    expected_concepts:
      - "proactive conversations"
      - "listening"
      - "written agreements"
      - "follow-up"
    rubric:
      excellent: "Describes early structured conversations with key people, written summaries and follow-up."
      good: "Says they ask the manager."
      weak: "Assumes expectations."
    followups:
      - "Who do you speak to?"
      - "What do you do if expectations clash?"
    common_errors:
      - "Assumes expectations."

  - external_key: recruiter_screening.role_alignment.role_specific_skill_depth
    competency_key: recruiter_fit
    topic: "Depth in a key skill"
    difficulty: easy
    text: "Pick the skill you consider most important for this role. How deep is your experience with it?"
    expected_concepts:
      - "skill choice rationale"
      - "depth with examples"
      - "limits"
      - "growth"
    rubric:
      excellent: "Chooses a skill with reasoning and substantiates depth with specific work examples and limits."
      good: "Chooses a skill with limited examples."
      weak: "Chooses a skill and gives no examples."
    followups:
      - "What is the hardest thing you have done with it?"
      - "Where does your depth end?"
    common_errors:
      - "Chooses a skill and gives no examples."

  - external_key: recruiter_screening.role_alignment.work_you_dont_enjoy
    competency_key: recruiter_fit
    topic: "Tasks that are less appealing"
    difficulty: medium
    text: "Every role has parts that are less exciting. Which parts of a role like this are less appealing to you, and how do you handle them?"
    expected_concepts:
      - "candid view"
      - "coping approach"
      - "accountability"
      - "example"
    rubric:
      excellent: "Names a task and shows how they ensure it gets done well and sometimes improve it."
      good: "Names a task and says they handle it."
      weak: "Says they avoid it or that nothing is unappealing."
    followups:
      - "How do you make it more bearable?"
      - "Have you improved such a task?"
    common_errors:
      - "Says they avoid it or that nothing is unappealing."

  - external_key: recruiter_screening.role_alignment.role_visibility
    competency_key: communication
    topic: "Reporting on your work"
    difficulty: medium
    text: "How do you keep others informed about your progress in a role like this?"
    expected_concepts:
      - "regular updates"
      - "audience-appropriate detail"
      - "tools"
      - "example"
    rubric:
      excellent: "Describes regular, tailored updates and how they make blockers visible early."
      good: "Describes updating when asked."
      weak: "Rarely communicates progress."
    followups:
      - "What does a good update contain?"
      - "How do you handle bad news?"
    common_errors:
      - "Rarely communicates progress."

  - external_key: recruiter_screening.role_alignment.role_impact_examples
    competency_key: ownership
    topic: "Impact in a similar role"
    difficulty: medium
    text: "What is the most meaningful result you delivered in a role similar to this one?"
    expected_concepts:
      - "specific result"
      - "role of candidate"
      - "metrics"
      - "relevance"
    rubric:
      excellent: "Describes a specific result, their direct role, measures of success and why it matters here."
      good: "Describes a result with limited detail."
      weak: "Describes team results without personal contribution."
    followups:
      - "How did you measure it?"
      - "What would you repeat here?"
    common_errors:
      - "Describes team results without personal contribution."

  - external_key: recruiter_screening.role_alignment.adapting_to_tools_in_role
    competency_key: adaptability
    topic: "Learning the stack"
    difficulty: easy
    text: "If the role uses tools you have not used before, how would you get productive with them?"
    expected_concepts:
      - "learning plan"
      - "seeking help"
      - "practice"
      - "timeline"
    rubric:
      excellent: "Describes a plan with hands-on practice, asking for help and a realistic timeline."
      good: "Says they would learn as they go."
      weak: "Expects training to do everything."
    followups:
      - "What did you do last time?"
      - "How long did it take?"
    common_errors:
      - "Expects training to do everything."

  - external_key: recruiter_screening.role_alignment.role_end_to_end
    competency_key: ownership
    topic: "Owning work end to end"
    difficulty: medium
    text: "How comfortable are you owning a piece of work from start to finish in a role like this?"
    expected_concepts:
      - "examples of ownership"
      - "handling dependencies"
      - "follow-through"
      - "limits"
    rubric:
      excellent: "Describes a past end-to-end piece of work including dependencies, follow-through and lessons."
      good: "Describes ownership in general."
      weak: "Describes only parts they were assigned."
    followups:
      - "What blocked you?"
      - "What did you hand over?"
    common_errors:
      - "Describes only parts they were assigned."

  - external_key: recruiter_screening.role_alignment.customer_facing_aspects
    competency_key: communication
    topic: "Interacting with others"
    difficulty: medium
    text: "How much of this role involves working with people outside your team, and how have you done that in the past?"
    expected_concepts:
      - "accurate expectations"
      - "communication practices"
      - "example"
      - "adaptability"
    rubric:
      excellent: "Describes concrete past work with outside parties and how they tailor communication."
      good: "Describes limited interaction."
      weak: "Avoids such interaction."
    followups:
      - "What went wrong once?"
      - "How do you prepare?"
    common_errors:
      - "Avoids such interaction."

  - external_key: recruiter_screening.role_alignment.cross_functional_priorities
    competency_key: collaboration
    topic: "Conflicting asks"
    difficulty: hard
    text: "If two teams asked for conflicting things from this role, how would you handle it?"
    expected_concepts:
      - "facts first"
      - "bring parties together"
      - "escalate appropriately"
      - "outcome"
    rubric:
      excellent: "Describes gathering facts, negotiating a shared priority and escalating when needed, with an example."
      good: "Describes talking to both sides."
      weak: "Picks a side or avoids the issue."
    followups:
      - "Who decides in your experience?"
      - "How do you keep both informed?"
    common_errors:
      - "Picks a side or avoids the issue."

  - external_key: recruiter_screening.role_alignment.how_you_use_ai_tools
    competency_key: adaptability
    topic: "Working with new tools"
    difficulty: easy
    text: "How do you decide whether to use a new tool or approach in your work, such as an assistant or automation?"
    expected_concepts:
      - "evaluation criteria"
      - "verification"
      - "responsible use"
      - "example"
    rubric:
      excellent: "Describes how they evaluate usefulness, verify outputs and respect data and policy, with an example."
      good: "Mentions trying new tools."
      weak: "Uses tools without checking or avoids all."
    followups:
      - "Where did it help?"
      - "Where did it let you down?"
    common_errors:
      - "Uses tools without checking or avoids all."

  - external_key: recruiter_screening.role_alignment.role_fit_for_environment
    competency_key: recruiter_fit
    topic: "Environment fit"
    difficulty: medium
    text: "Which working conditions help you deliver your best results in a role like this one?"
    expected_concepts:
      - "specific conditions"
      - "job-related"
      - "evidence"
      - "flexibility"
    rubric:
      excellent: "Names job-related conditions with evidence from past roles and shows flexibility."
      good: "Names generic conditions."
      weak: "Names conditions unrelated to work."
    followups:
      - "What happens when those are absent?"
      - "Give an example."
    common_errors:
      - "Names conditions unrelated to work."

  - external_key: recruiter_screening.role_alignment.responsibility_you_would_delegate
    competency_key: collaboration
    topic: "Sharing the load"
    difficulty: hard
    text: "Which parts of this role would you want to share with others or hand off, and how?"
    expected_concepts:
      - "self-awareness"
      - "delegation approach"
      - "accountability"
      - "team view"
    rubric:
      excellent: "Identifies tasks suited to others, describes clear handoffs and keeps accountability."
      good: "Mentions sharing some tasks."
      weak: "Wants to do everything or avoid tasks."
    followups:
      - "How do you hand off?"
      - "How do you check progress?"
    common_errors:
      - "Wants to do everything or avoid tasks."

  - external_key: recruiter_screening.role_alignment.two_priorities_first_week
    competency_key: ownership
    topic: "First week focus"
    difficulty: easy
    text: "What would you focus on in your first week in this role?"
    expected_concepts:
      - "reasonable priorities"
      - "listening"
      - "relationships"
      - "setup"
    rubric:
      excellent: "Lists concrete priorities such as meeting key people, learning context and a small first task."
      good: "Lists general onboarding steps."
      weak: "Plans to change things immediately or has no plan."
    followups:
      - "Who would you meet?"
      - "What would you read?"
    common_errors:
      - "Plans to change things immediately or has no plan."

  - external_key: recruiter_screening.role_alignment.what_you_will_not_know_yet
    competency_key: adaptability
    topic: "Known unknowns"
    difficulty: medium
    text: "What do you think you will not know when you start, and how will you find out?"
    expected_concepts:
      - "awareness of gaps"
      - "strategies"
      - "asking questions"
      - "timelines"
    rubric:
      excellent: "Names specific unknowns and sets out how and from whom they will learn."
      good: "Names gaps in general."
      weak: "Believes they will know everything."
    followups:
      - "Who are your first contacts?"
      - "How would you test your understanding?"
    common_errors:
      - "Believes they will know everything."

  - external_key: recruiter_screening.role_alignment.job_posting_questions
    competency_key: communication
    topic: "Reading the posting"
    difficulty: easy
    text: "Was there anything in the job posting you were unsure about, and what would you like to clarify?"
    expected_concepts:
      - "careful reading"
      - "specific points"
      - "curiosity"
      - "communication"
    rubric:
      excellent: "Identifies specific points with thoughtful questions about scope or expectations."
      good: "Asks one general question."
      weak: "Has no questions."
    followups:
      - "Why does it matter to you?"
      - "How would the answer change your view?"
    common_errors:
      - "Has no questions."

  - external_key: recruiter_screening.role_alignment.role_ownership_decisions
    competency_key: ownership
    topic: "Decision rights"
    difficulty: medium
    text: "In a role like this, what kinds of decisions would you expect to make on your own and which would you check with others?"
    expected_concepts:
      - "judgement"
      - "escalation criteria"
      - "communication"
      - "examples"
    rubric:
      excellent: "Distinguishes decisions by impact and reversibility and gives examples of both."
      good: "Gives a general rule."
      weak: "Always asks or never asks."
    followups:
      - "When did you overstep?"
      - "When did you under-ask?"
    common_errors:
      - "Always asks or never asks."

  - external_key: recruiter_screening.role_alignment.variety_vs_focus
    competency_key: recruiter_fit
    topic: "Variety or focus"
    difficulty: medium
    text: "Do you prefer a role with a lot of variety or deep focus on one thing, and how does this role compare?"
    expected_concepts:
      - "self-knowledge"
      - "examples"
      - "fit"
      - "adaptability"
    rubric:
      excellent: "Describes a preference with examples and makes a reasoned comparison with this role."
      good: "States a preference with brief reasons."
      weak: "Has no preference or avoids the comparison."
    followups:
      - "When did you do your best work?"
      - "How do you cope with the other?"
    common_errors:
      - "Has no preference or avoids the comparison."

  - external_key: recruiter_screening.role_alignment.role_risk_awareness
    competency_key: ownership
    topic: "Risks in the role"
    difficulty: hard
    text: "What risks or pitfalls do you see in a role like this, and how would you guard against them?"
    expected_concepts:
      - "risk identification"
      - "mitigations"
      - "experience"
      - "realism"
    rubric:
      excellent: "Names concrete risks and practical mitigations drawn from experience."
      good: "Names generic risks."
      weak: "Sees no risks."
    followups:
      - "Which have you faced?"
      - "What early signals would you watch?"
    common_errors:
      - "Sees no risks."

  - external_key: recruiter_screening.role_alignment.handover_continuity
    competency_key: collaboration
    topic: "Taking over work"
    difficulty: medium
    text: "How would you take over work that someone else started so that nothing is lost?"
    expected_concepts:
      - "handover steps"
      - "context gathering"
      - "questions"
      - "documentation"
    rubric:
      excellent: "Describes a structured handover with checklists, conversations and documented open items."
      good: "Describes asking for notes."
      weak: "Starts from scratch or ignores history."
    followups:
      - "What do you ask the previous owner?"
      - "How do you verify?"
    common_errors:
      - "Starts from scratch or ignores history."

  - external_key: recruiter_screening.role_alignment.role_expectations_vs_reality
    competency_key: recruiter_fit
    topic: "When reality differs"
    difficulty: medium
    text: "Has a role ever turned out different from what you expected? How did you respond?"
    expected_concepts:
      - "specific example"
      - "response"
      - "communication"
      - "outcome"
    rubric:
      excellent: "Describes the difference, raises it constructively and adapts or negotiates changes."
      good: "Describes the difference and a basic response."
      weak: "Only complains or left silently."
    followups:
      - "What did you check beforehand?"
      - "What would you ask now?"
    common_errors:
      - "Only complains or left silently."

  - external_key: recruiter_screening.role_alignment.team_size_fit
    competency_key: collaboration
    topic: "Team setting"
    difficulty: easy
    text: "What size and shape of team have you worked best in, and what did you bring to it?"
    expected_concepts:
      - "self-awareness"
      - "contributions"
      - "examples"
      - "adaptability"
    rubric:
      excellent: "Describes team settings with specific contributions and how they adapt to others."
      good: "Describes a preference."
      weak: "Cannot describe a team setting."
    followups:
      - "How did you adapt to a bigger team?"
      - "What did you do in a smaller one?"
    common_errors:
      - "Cannot describe a team setting."

  - external_key: recruiter_screening.role_alignment.role_collaboration_rhythm
    competency_key: collaboration
    topic: "Rhythm of collaboration"
    difficulty: medium
    text: "What meetings, reviews or check-ins do you find most useful in a role like this, and which do you find least useful?"
    expected_concepts:
      - "purposeful meetings"
      - "examples"
      - "communication"
      - "adaptability"
    rubric:
      excellent: "Explains which routines add value with examples and how they improve the ones that do not."
      good: "Names a few routines."
      weak: "Dislikes meetings without reasoning."
    followups:
      - "How would you improve a meeting?"
      - "What replaces a meeting for you?"
    common_errors:
      - "Dislikes meetings without reasoning."
