# Curated questions: recruiter screening, logistics lawful (03 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.logistics_lawful.notice_in_writing
    competency_key: communication
    topic: "Planning the resignation"
    difficulty: easy
    text: "When an offer is accepted, how do you plan the conversation and paperwork with your current employer?"
    expected_concepts:
      - "sequence"
      - "professionalism"
      - "clear communication"
      - "timeline"
    rubric:
      excellent: "Describes a sensible sequence, a respectful conversation and confirming the notice in writing."
      good: "Describes telling the employer."
      weak: "Has no plan."
    followups:
      - "What do you tell the team?"
      - "What if they counter?"
    common_errors:
      - "Has no plan."

  - external_key: recruiter_screening.logistics_lawful.role_hours_per_week
    competency_key: recruiter_fit
    topic: "Expected hours"
    difficulty: easy
    text: "The role is a standard full-time week with the hours described in the posting. How does that fit your plans?"
    expected_concepts:
      - "understanding"
      - "clarity"
      - "planning"
      - "questions"
    rubric:
      excellent: "Shows they understood the stated hours and asks pertinent questions."
      good: "Accepts the hours."
      weak: "Does not engage."
    followups:
      - "Anything you want to clarify?"
      - "How do you manage your week?"
    common_errors:
      - "Does not engage."

  - external_key: recruiter_screening.logistics_lawful.start_day_preferences
    competency_key: recruiter_fit
    topic: "Start day"
    difficulty: easy
    text: "Do you have preferences about which day of the week or month to start, and what is behind them?"
    expected_concepts:
      - "preference"
      - "practical reasons"
      - "flexibility"
      - "communication"
    rubric:
      excellent: "States a preference with practical reasons and willingness to adapt."
      good: "States a preference."
      weak: "Is rigid."
    followups:
      - "Could you start on another day?"
      - "What would suit the team?"
    common_errors:
      - "Is rigid."

  - external_key: recruiter_screening.logistics_lawful.home_office_expectations
    competency_key: recruiter_fit
    topic: "Home working practicalities"
    difficulty: medium
    text: "If you work from home some days, what do you expect the company to provide versus what you arrange yourself?"
    expected_concepts:
      - "clear expectations"
      - "practical"
      - "reasonableness"
      - "communication"
    rubric:
      excellent: "Describes reasonable expectations and what they will provide themselves."
      good: "Describes basic expectations."
      weak: "Has unrealistic or no expectations."
    followups:
      - "Where would you check the policy?"
      - "What helps you work effectively?"
    common_errors:
      - "Has unrealistic or no expectations."

  - external_key: recruiter_screening.logistics_lawful.company_events_attendance
    competency_key: collaboration
    topic: "Occasional in-person events"
    difficulty: easy
    text: "The team gathers in person a couple of times a year for planning, as the posting states. How would you plan for that?"
    expected_concepts:
      - "understanding"
      - "planning"
      - "flexibility"
      - "communication"
    rubric:
      excellent: "Describes planning ahead, discussing constraints early and contributing to the gathering."
      good: "Accepts attendance."
      weak: "Refuses or ignores."
    followups:
      - "How much notice would you like?"
      - "What makes these useful?"
    common_errors:
      - "Refuses or ignores."

  - external_key: recruiter_screening.logistics_lawful.availability_response_time
    competency_key: communication
    topic: "Response times"
    difficulty: easy
    text: "What response time do you aim for with colleagues and recruiters, and how do you keep that dependable?"
    expected_concepts:
      - "clear norm"
      - "tools"
      - "reliability"
      - "example"
    rubric:
      excellent: "Describes a norm, tools and behaviours that keep people informed when delayed."
      good: "Describes replying when possible."
      weak: "Has no norm."
    followups:
      - "What do you do when you cannot answer quickly?"
      - "How do you signal availability?"
    common_errors:
      - "Has no norm."

  - external_key: recruiter_screening.logistics_lawful.role_based_pager
    competency_key: recruiter_fit
    topic: "Incident cover"
    difficulty: easy
    text: "If the role includes occasional incident cover, what would you want to know about how it is organised?"
    expected_concepts:
      - "useful questions"
      - "understanding"
      - "fairness"
      - "sustainability"
    rubric:
      excellent: "Asks about rota, compensation arrangements per policy, tooling, and support and escalation."
      good: "Asks a general question."
      weak: "Has no questions."
    followups:
      - "Why those?"
      - "What makes cover sustainable?"
    common_errors:
      - "Has no questions."

  - external_key: recruiter_screening.logistics_lawful.meeting_load_expectations
    competency_key: recruiter_fit
    topic: "Meetings in this role"
    difficulty: medium
    text: "The role involves regular meetings with stakeholders. How do you manage your calendar to keep time for delivery?"
    expected_concepts:
      - "calendar management"
      - "prioritisation"
      - "communication"
      - "results"
    rubric:
      excellent: "Describes protecting delivery time and choosing meetings carefully."
      good: "Describes attending meetings."
      weak: "Is overloaded or avoids meetings."
    followups:
      - "How do you decline a meeting?"
      - "What makes a meeting worthwhile?"
    common_errors:
      - "Is overloaded or avoids meetings."

  - external_key: recruiter_screening.logistics_lawful.training_time
    competency_key: recruiter_fit
    topic: "Learning time at the start"
    difficulty: easy
    text: "In the first weeks, we plan for structured onboarding. How do you make the most of that time?"
    expected_concepts:
      - "engagement"
      - "planning"
      - "questions"
      - "goals"
    rubric:
      excellent: "Describes setting goals, preparing questions and applying learning quickly."
      good: "Says they will attend sessions."
      weak: "Expects to be taught everything."
    followups:
      - "What would you ask first?"
      - "How do you check progress?"
    common_errors:
      - "Expects to be taught everything."

  - external_key: recruiter_screening.logistics_lawful.probation_period_view
    competency_key: recruiter_fit
    topic: "Initial period"
    difficulty: medium
    text: "The role has an initial review period as set out in the offer terms. How do you approach that?"
    expected_concepts:
      - "understanding"
      - "goals"
      - "feedback"
      - "communication"
    rubric:
      excellent: "Describes agreeing goals, seeking feedback and treating the period as a chance to confirm fit both ways."
      good: "Accepts it."
      weak: "Dismisses or worries about it."
    followups:
      - "What would you want from us?"
      - "How will you check in?"
    common_errors:
      - "Dismisses or worries about it."

  - external_key: recruiter_screening.logistics_lawful.working_location_changes
    competency_key: adaptability
    topic: "Changes to the arrangement"
    difficulty: hard
    text: "If the company changed the office days or location arrangement within policy, how would you approach it?"
    expected_concepts:
      - "understanding"
      - "communication"
      - "practical plan"
      - "flexibility"
    rubric:
      excellent: "Describes seeking details early, planning and raising genuine constraints constructively."
      good: "Says they would adapt."
      weak: "Refuses or assumes it will not happen."
    followups:
      - "What would you need to know?"
      - "What is non-negotiable in your work?"
    common_errors:
      - "Refuses or assumes it will not happen."

  - external_key: recruiter_screening.logistics_lawful.role_coverage_during_holidays
    competency_key: collaboration
    topic: "Team cover"
    difficulty: medium
    text: "How do you make sure your work is covered when you are away, and how do you cover for others?"
    expected_concepts:
      - "handover"
      - "documentation"
      - "reciprocity"
      - "communication"
    rubric:
      excellent: "Describes briefing colleagues, documenting status and covering for others in turn."
      good: "Describes telling someone."
      weak: "Leaves work uncovered."
    followups:
      - "What do you document?"
      - "How far ahead do you plan?"
    common_errors:
      - "Leaves work uncovered."

  - external_key: recruiter_screening.logistics_lawful.travel_logistics_approach
    competency_key: ownership
    topic: "Organising trips"
    difficulty: easy
    text: "When you have to travel for work, how do you organise logistics so the trip is productive?"
    expected_concepts:
      - "planning"
      - "costs and policy"
      - "schedule"
      - "contingency"
    rubric:
      excellent: "Describes planning around policy, building a schedule with buffers and a contingency."
      good: "Describes booking tickets."
      weak: "Leaves planning until the last minute."
    followups:
      - "What did you forget once?"
      - "How do you prepare materials?"
    common_errors:
      - "Leaves planning until the last minute."

  - external_key: recruiter_screening.logistics_lawful.long_commute_view
    competency_key: recruiter_fit
    topic: "Getting to the workplace"
    difficulty: medium
    text: "For the days on site, what would you want to understand about getting to and working from the office?"
    expected_concepts:
      - "practical questions"
      - "planning"
      - "clarity"
      - "flexibility"
    rubric:
      excellent: "Asks practical questions such as site access and facilities, and shows how they would plan."
      good: "Asks one question."
      weak: "Has none."
    followups:
      - "What would help?"
      - "How do you plan your days there?"
    common_errors:
      - "Has none."

  - external_key: recruiter_screening.logistics_lawful.lead_time_for_interviews
    competency_key: communication
    topic: "Interview preparation"
    difficulty: easy
    text: "How much lead time do you need to prepare for a technical or panel interview?"
    expected_concepts:
      - "preparation"
      - "scheduling"
      - "courtesy"
      - "flexibility"
    rubric:
      excellent: "States a reasonable lead time and how they prepare."
      good: "States a lead time."
      weak: "Needs unrealistic lead time or none."
    followups:
      - "How do you prepare?"
      - "What would help?"
    common_errors:
      - "Needs unrealistic lead time or none."

  - external_key: recruiter_screening.logistics_lawful.parallel_obligations_at_start
    competency_key: communication
    topic: "Overlap with existing duties"
    difficulty: medium
    text: "If your current employer asked you to support them briefly after you start with us, how would you handle that?"
    expected_concepts:
      - "boundaries"
      - "communication"
      - "contract awareness"
      - "professionalism"
    rubric:
      excellent: "Describes honouring obligations, setting limits and keeping both employers informed."
      good: "Says they would help a little."
      weak: "Would ignore boundaries."
    followups:
      - "What would you tell us?"
      - "Where is the limit?"
    common_errors:
      - "Would ignore boundaries."

  - external_key: recruiter_screening.logistics_lawful.first_month_availability
    competency_key: recruiter_fit
    topic: "Early period availability"
    difficulty: easy
    text: "The first month includes onboarding sessions at set times. How would you make sure you can attend?"
    expected_concepts:
      - "planning"
      - "communication"
      - "readiness"
      - "flexibility"
    rubric:
      excellent: "Describes checking the schedule early, adjusting commitments and confirming attendance."
      good: "Says yes."
      weak: "Has not considered it."
    followups:
      - "What if there is a clash?"
      - "What would you like in advance?"
    common_errors:
      - "Has not considered it."

  - external_key: recruiter_screening.logistics_lawful.equipment_security_policies
    competency_key: recruiter_fit
    topic: "Working with company policies"
    difficulty: easy
    text: "Our role involves working with company devices and security policies. How do you approach following them in a remote setup?"
    expected_concepts:
      - "policy awareness"
      - "habits"
      - "communication"
      - "examples"
    rubric:
      excellent: "Describes habits like device updates and secure access and gives an example."
      good: "Says they follow policies."
      weak: "Dismisses policies."
    followups:
      - "What do you do if a policy gets in your way?"
      - "Where do you ask?"
    common_errors:
      - "Dismisses policies."

  - external_key: recruiter_screening.logistics_lawful.remote_worksite_notice
    competency_key: communication
    topic: "Telling us about changes"
    difficulty: easy
    text: "If your availability for the agreed arrangement changed during the process, how would you let us know?"
    expected_concepts:
      - "prompt communication"
      - "clarity"
      - "professionalism"
      - "options"
    rubric:
      excellent: "Describes telling us promptly with options and keeping the process on track."
      good: "Says they would let us know."
      weak: "Would stay silent."
    followups:
      - "How soon?"
      - "What would you propose?"
    common_errors:
      - "Would stay silent."

  - external_key: recruiter_screening.logistics_lawful.offer_acceptance_logistics
    competency_key: recruiter_fit
    topic: "After an offer"
    difficulty: easy
    text: "After an offer, what are the practical steps you would take on your side, and how long do they usually take?"
    expected_concepts:
      - "clear steps"
      - "timeline"
      - "communication"
      - "planning"
    rubric:
      excellent: "Lists steps such as resigning, handover and checks with estimated timing."
      good: "Lists a few steps."
      weak: "Cannot describe steps."
    followups:
      - "Which step is slowest?"
      - "How can we help?"
    common_errors:
      - "Cannot describe steps."

  - external_key: recruiter_screening.logistics_lawful.return_to_office_policy
    competency_key: adaptability
    topic: "Policy changes"
    difficulty: medium
    text: "If the company adjusted its office attendance policy, how would you want to be informed and consulted?"
    expected_concepts:
      - "communication"
      - "consultation"
      - "reasonableness"
      - "planning"
    rubric:
      excellent: "Describes constructive communication, asking for rationale and planning transition."
      good: "Says they would follow policy."
      weak: "Rejects policy changes."
    followups:
      - "What would you ask?"
      - "What would help?"
    common_errors:
      - "Rejects policy changes."

  - external_key: recruiter_screening.logistics_lawful.out_of_hours_communication
    competency_key: communication
    topic: "Outside working hours"
    difficulty: medium
    text: "What are your expectations about contact outside working hours, and how do you handle genuinely urgent matters?"
    expected_concepts:
      - "norms"
      - "urgency criteria"
      - "boundaries"
      - "communication"
    rubric:
      excellent: "Describes agreed norms, defines urgency and how they would respond to a real emergency."
      good: "Describes responding when needed."
      weak: "Always available or never."
    followups:
      - "What counts as urgent?"
      - "How do you set expectations?"
    common_errors:
      - "Always available or never."

  - external_key: recruiter_screening.logistics_lawful.timeline_to_full_productivity
    competency_key: ownership
    topic: "Joining quickly"
    difficulty: hard
    text: "If the team needed you to be useful quickly after starting, how would you get there while still learning properly?"
    expected_concepts:
      - "prioritisation"
      - "learning"
      - "support"
      - "communication"
    rubric:
      excellent: "Describes picking a focused first contribution, getting support and communicating progress."
      good: "Says they would work hard."
      weak: "Promises instant results."
    followups:
      - "What would you ask first?"
      - "What would you avoid?"
    common_errors:
      - "Promises instant results."

  - external_key: recruiter_screening.logistics_lawful.notice_work_planning
    competency_key: ownership
    topic: "Planning your final weeks"
    difficulty: medium
    text: "How would you use your notice period to leave your current work in a good state?"
    expected_concepts:
      - "prioritised tasks"
      - "documentation"
      - "people briefed"
      - "closure"
    rubric:
      excellent: "Describes a prioritised list of closures, documentation and briefings with dates."
      good: "Describes finishing tasks."
      weak: "Has no plan."
    followups:
      - "What gets finished first?"
      - "What do you document?"
    common_errors:
      - "Has no plan."

  - external_key: recruiter_screening.logistics_lawful.hybrid_day_selection
    competency_key: recruiter_fit
    topic: "Which days on site"
    difficulty: easy
    text: "If we asked you to choose your on-site days within team guidelines, how would you decide?"
    expected_concepts:
      - "team overlap"
      - "collaboration needs"
      - "flexibility"
      - "communication"
    rubric:
      excellent: "Describes aligning with team overlap and collaboration needs and agreeing with the manager."
      good: "Picks convenient days."
      weak: "Has no reasoning."
    followups:
      - "Who would you consult?"
      - "What if the team needed a different pattern?"
    common_errors:
      - "Has no reasoning."
