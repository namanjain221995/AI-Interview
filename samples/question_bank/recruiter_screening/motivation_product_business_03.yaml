version: 1
defaults:
  role_tags: [product_manager, project_manager, business_analyst, ux_designer, support_engineer]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_product_business.pm_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "Looking back at your time as a product manager, which team got the best results, and what was it about the way they worked?"
    expected_concepts:
      - "practices"
      - "trust"
      - "communication"
      - "contribution"
    rubric:
      excellent: "Describes concrete practices and their contribution."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "What would you bring here?"
      - "What was missing?"
    common_errors:
      - "Generic praise."

  - external_key: "recruiter_screening.motivation_product_business.proj_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "On which project team did you do your best work, and what was it about that group?"
    expected_concepts:
      - "clarity"
      - "communication"
      - "ownership"
      - "contribution"
    rubric:
      excellent: "Describes concrete practices and their part in them."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "What did you do to support that?"
      - "What would you repeat?"
    common_errors:
      - "Generic praise."

  - external_key: "recruiter_screening.motivation_product_business.ba_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "What helped the best team you worked with on requirements deliver well?"
    expected_concepts:
      - "collaboration"
      - "shared understanding"
      - "feedback"
      - "contribution"
    rubric:
      excellent: "Describes concrete practices and contribution."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "What would you change?"
      - "How did you share knowledge?"
    common_errors:
      - "Generic."

  - external_key: "recruiter_screening.motivation_product_business.ux_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "What does a design team need so that people do their best work, based on your experience?"
    expected_concepts:
      - "critique"
      - "research access"
      - "shared systems"
      - "contribution"
    rubric:
      excellent: "Describes practices such as regular critique and shared research with examples."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "How do you give feedback?"
      - "How do you receive it?"
    common_errors:
      - "Generic."

  - external_key: "recruiter_screening.motivation_product_business.support_best_team"
    competency_key: culture_values
    topic: "Best team experience"
    difficulty: easy
    text: "What habits made the strongest support team you joined so good at helping customers?"
    expected_concepts:
      - "knowledge sharing"
      - "escalation"
      - "respect"
      - "contribution"
    rubric:
      excellent: "Names practices and their contribution."
      good: "Gives relevant reasons and some concrete detail about best team experience, but links to the role stay general."
      weak: "Vague or generic answer on best team experience that could apply to any job."
    followups:
      - "How did you contribute?"
      - "What would you bring?"
    common_errors:
      - "Generic."

  - external_key: "recruiter_screening.motivation_product_business.pm_change_reason"
    competency_key: motivation
    topic: "Why a change"
    difficulty: easy
    text: "What is making you look for a new product role at this point?"
    expected_concepts:
      - "forward-looking"
      - "role-related"
      - "constructive"
      - "link"
    rubric:
      excellent: "Gives constructive, role-related reasons and links them to the new role."
      good: "Gives relevant reasons and some concrete detail about why a change, but links to the role stay general."
      weak: "Vague or generic answer on why a change that could apply to any job."
    followups:
      - "What do you want more of?"
      - "What would you keep?"
    common_errors:
      - "Complaining."

  - external_key: "recruiter_screening.motivation_product_business.proj_change_reason"
    competency_key: motivation
    topic: "Why a change"
    difficulty: easy
    text: "What do you want your next project role to give you that your current one does not?"
    expected_concepts:
      - "forward-looking"
      - "scope"
      - "constructive"
      - "link"
    rubric:
      excellent: "Names specific things such as larger scope and links them to this role."
      good: "Gives relevant reasons and some concrete detail about why a change, but links to the role stay general."
      weak: "Vague or generic answer on why a change that could apply to any job."
    followups:
      - "What did you like in your current role?"
      - "What is essential?"
    common_errors:
      - "Only criticism."

  - external_key: "recruiter_screening.motivation_product_business.ba_change_reason"
    competency_key: motivation
    topic: "Why a change"
    difficulty: easy
    text: "What would make a new analyst job a better step for you than where you are now?"
    expected_concepts:
      - "forward-looking"
      - "scope"
      - "growth"
      - "link to this role"
    rubric:
      excellent: "Names specific job-related desires and links them to this role."
      good: "Gives relevant reasons and some concrete detail about why a change, but links to the role stay general."
      weak: "Vague or generic answer on why a change that could apply to any job."
    followups:
      - "What do you want to leave behind?"
      - "What matters most?"
    common_errors:
      - "Only criticism."

  - external_key: "recruiter_screening.motivation_product_business.ux_change_reason"
    competency_key: motivation
    topic: "Why a change"
    difficulty: easy
    text: "What are you hoping to find in a new design role?"
    expected_concepts:
      - "scope"
      - "collaboration"
      - "craft"
      - "link"
    rubric:
      excellent: "Names specific job-related hopes and links them to this role."
      good: "Gives relevant reasons and some concrete detail about why a change, but links to the role stay general."
      weak: "Vague or generic answer on why a change that could apply to any job."
    followups:
      - "What would make it a great move?"
      - "What are your priorities?"
    common_errors:
      - "Giving a vague answer about wanting something new."

  - external_key: "recruiter_screening.motivation_product_business.support_change_reason"
    competency_key: motivation
    topic: "Why a change"
    difficulty: easy
    text: "What is prompting you to look for a new support role?"
    expected_concepts:
      - "forward-looking"
      - "growth"
      - "scope"
      - "link"
    rubric:
      excellent: "Gives clear, constructive reasons and links them to the role."
      good: "Gives relevant reasons and some concrete detail about why a change, but links to the role stay general."
      weak: "Vague or generic answer on why a change that could apply to any job."
    followups:
      - "What do you want to keep?"
      - "What do you want to learn?"
    common_errors:
      - "Complaining about customers."

  - external_key: "recruiter_screening.motivation_product_business.pm_domain"
    competency_key: motivation
    topic: "Domain interest"
    difficulty: medium
    text: "What kinds of products or problems do you most like working on, and what do you do when a domain is unfamiliar?"
    expected_concepts:
      - "domain preference"
      - "reasons"
      - "learning approach"
      - "examples"
    rubric:
      excellent: "Names domains with reasons and describes a learning method."
      good: "Gives relevant reasons and some concrete detail about domain interest, but links to the role stay general."
      weak: "Vague or generic answer on domain interest that could apply to any job."
    followups:
      - "Which domain would be hardest for you?"
      - "How do you learn quickly?"
    common_errors:
      - "Any domain is fine."

  - external_key: "recruiter_screening.motivation_product_business.proj_portfolio"
    competency_key: motivation
    topic: "Project types"
    difficulty: medium
    text: "What types of projects do you enjoy leading most, and which do you find difficult?"
    expected_concepts:
      - "project types"
      - "reasons"
      - "strengths"
      - "self-awareness"
    rubric:
      excellent: "Describes types with reasons and self-awareness about what is difficult."
      good: "Gives relevant reasons and some concrete detail about project types, but links to the role stay general."
      weak: "Vague or generic answer on project types that could apply to any job."
    followups:
      - "Which one taught you most?"
      - "How do you handle the hard ones?"
    common_errors:
      - "Liking everything."

  - external_key: "recruiter_screening.motivation_product_business.ba_tools"
    competency_key: motivation
    topic: "Tools and techniques"
    difficulty: medium
    text: "Which analysis techniques or tools do you rely on most, and what do you want to learn?"
    expected_concepts:
      - "techniques such as process models or SQL"
      - "reasons"
      - "learning"
    rubric:
      excellent: "Names techniques with reasons and a recent learning."
      good: "Gives relevant reasons and some concrete detail about tools and techniques, but links to the role stay general."
      weak: "Vague or generic answer on tools and techniques that could apply to any job."
    followups:
      - "What technique did you pick up recently?"
      - "Which one is overrated?"
    common_errors:
      - "Naming tools only."

  - external_key: "recruiter_screening.motivation_product_business.ux_accessibility"
    competency_key: motivation
    topic: "Inclusive design"
    difficulty: medium
    text: "How does designing for accessibility and a wide range of users show up in your work, and why does it matter to you?"
    expected_concepts:
      - "practices"
      - "examples"
      - "collaboration"
      - "trade-offs"
    rubric:
      excellent: "Describes concrete practices and an example where it changed a design."
      good: "Gives relevant reasons and some concrete detail about inclusive design, but links to the role stay general."
      weak: "Vague or generic answer on inclusive design that could apply to any job."
    followups:
      - "Tell me about a time you changed a design for accessibility."
      - "How do you test?"
    common_errors:
      - "Treating it as an afterthought."

  - external_key: "recruiter_screening.motivation_product_business.support_automation"
    competency_key: motivation
    topic: "Improving support operations"
    difficulty: medium
    text: "What ideas have you brought to make support work better for customers and the team, and what happened?"
    expected_concepts:
      - "improvement ideas"
      - "tools"
      - "adoption"
      - "measurement"
      - "example"
    rubric:
      excellent: "Gives a real improvement example with measurement."
      good: "Gives relevant reasons and some concrete detail about improving support operations, but links to the role stay general."
      weak: "Vague or generic answer on improving support operations that could apply to any job."
    followups:
      - "What metric improved?"
      - "How did you get buy-in?"
    common_errors:
      - "Just following process."

  - external_key: "recruiter_screening.motivation_product_business.pm_discovery"
    competency_key: motivation
    topic: "Discovery work"
    difficulty: medium
    text: "Tell me about a time discovery changed what you decided to build."
    expected_concepts:
      - "research"
      - "evidence"
      - "decision"
      - "stakeholders"
      - "result"
    rubric:
      excellent: "Describes discovery evidence changing the plan and how they influenced others."
      good: "Gives relevant reasons and some concrete detail about discovery work, but links to the role stay general."
      weak: "Vague or generic answer on discovery work that could apply to any job."
    followups:
      - "What did you almost build?"
      - "How did you share it?"
    common_errors:
      - "Building from assumptions."

  - external_key: "recruiter_screening.motivation_product_business.proj_stakeholder"
    competency_key: motivation
    topic: "Communicating status"
    difficulty: medium
    text: "How do you decide what to tell senior stakeholders about a project in trouble, and how?"
    expected_concepts:
      - "transparency"
      - "timing"
      - "options"
      - "evidence"
      - "example"
    rubric:
      excellent: "Describes early, evidence-based communication with options."
      good: "Gives relevant reasons and some concrete detail about communicating status, but links to the role stay general."
      weak: "Vague or generic answer on communicating status that could apply to any job."
    followups:
      - "When have you escalated?"
      - "How do you avoid surprises?"
    common_errors:
      - "Spinning status."

  - external_key: "recruiter_screening.motivation_product_business.ba_data"
    competency_key: motivation
    topic: "Data and evidence"
    difficulty: medium
    text: "How do you use data to back up your analysis and recommendations?"
    expected_concepts:
      - "data sources"
      - "SQL or spreadsheets"
      - "verification"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes using data to test assumptions with an example."
      good: "Gives relevant reasons and some concrete detail about data and evidence, but links to the role stay general."
      weak: "Vague or generic answer on data and evidence that could apply to any job."
    followups:
      - "Tell me about a time data surprised you."
      - "How do you check quality?"
    common_errors:
      - "Opinion-based analysis."

  - external_key: "recruiter_screening.motivation_product_business.ux_critique"
    competency_key: motivation
    topic: "Receiving critique"
    difficulty: medium
    text: "How do you approach design critique, and how has it changed your work?"
    expected_concepts:
      - "openness"
      - "process"
      - "example of change"
      - "giving feedback"
    rubric:
      excellent: "Gives an example of critique improving a design and describes constructive feedback habits."
      good: "Gives relevant reasons and some concrete detail about receiving critique, but links to the role stay general."
      weak: "Vague or generic answer on receiving critique that could apply to any job."
    followups:
      - "Tell me about feedback you disagreed with."
      - "How do you critique others?"
    common_errors:
      - "Defensive."

  - external_key: "recruiter_screening.motivation_product_business.support_knowledge"
    competency_key: motivation
    topic: "Knowledge sharing"
    difficulty: medium
    text: "How do you contribute to a team knowledge base, and why does it matter to you?"
    expected_concepts:
      - "documentation habits"
      - "quality"
      - "ownership"
      - "examples"
      - "impact"
    rubric:
      excellent: "Describes habits and impact with examples."
      good: "Gives relevant reasons and some concrete detail about knowledge sharing, but links to the role stay general."
      weak: "Vague or generic answer on knowledge sharing that could apply to any job."
    followups:
      - "What makes an article good?"
      - "How do you keep it current?"
    common_errors:
      - "Writing docs only when asked."

  - external_key: "recruiter_screening.motivation_product_business.pm_pressure"
    competency_key: motivation
    topic: "Missed expectations"
    difficulty: hard
    text: "Tell me about a product launch or decision that did not go as expected. What happened and how did it change your approach?"
    expected_concepts:
      - "situation"
      - "own part"
      - "analysis"
      - "communication"
      - "change"
    rubric:
      excellent: "Takes ownership, analyses causes and changes practices."
      good: "Gives relevant reasons and some concrete detail about missed expectations, but links to the role stay general."
      weak: "Vague or generic answer on missed expectations that could apply to any job."
    followups:
      - "What signals did you miss?"
      - "How did you tell the team?"
    common_errors:
      - "Blaming others."

  - external_key: "recruiter_screening.motivation_product_business.proj_blocker"
    competency_key: motivation
    topic: "Dealing with blockers"
    difficulty: hard
    text: "Tell me about a project that was stuck because of factors outside your control. What did you do?"
    expected_concepts:
      - "situation"
      - "options"
      - "influence"
      - "communication"
      - "result"
    rubric:
      excellent: "Describes pragmatic options, influence and clear communication."
      good: "Gives relevant reasons and some concrete detail about dealing with blockers, but links to the role stay general."
      weak: "Vague or generic answer on dealing with blockers that could apply to any job."
    followups:
      - "Who did you involve?"
      - "What did you learn?"
    common_errors:
      - "Waiting."

  - external_key: "recruiter_screening.motivation_product_business.ba_ambiguity"
    competency_key: motivation
    topic: "Incomplete information"
    difficulty: hard
    text: "Tell me about a time you had to deliver analysis with incomplete or contradictory information."
    expected_concepts:
      - "situation"
      - "assumptions"
      - "communication"
      - "validation"
      - "result"
    rubric:
      excellent: "Describes explicit assumptions, validation and communication."
      good: "Gives relevant reasons and some concrete detail about incomplete information, but links to the role stay general."
      weak: "Vague or generic answer on incomplete information that could apply to any job."
    followups:
      - "How did you record assumptions?"
      - "What changed later?"
    common_errors:
      - "Hiding gaps."

  - external_key: "recruiter_screening.motivation_product_business.support_values"
    competency_key: motivation
    topic: "Customer advocacy"
    difficulty: hard
    text: "Tell me about a time you advocated for a customer inside the company when it was inconvenient. What happened?"
    expected_concepts:
      - "situation"
      - "evidence"
      - "stakeholders"
      - "outcome"
      - "learning"
    rubric:
      excellent: "Describes evidence-based advocacy and a clear outcome."
      good: "Gives relevant reasons and some concrete detail about customer advocacy, but links to the role stay general."
      weak: "Vague or generic answer on customer advocacy that could apply to any job."
    followups:
      - "How did you get engineering to act?"
      - "What was the result?"
    common_errors:
      - "Escalating without evidence."

  - external_key: "recruiter_screening.motivation_product_business.pm_roadmap_joy"
    competency_key: motivation
    topic: "Roadmap thinking"
    difficulty: medium
    text: "How do you build a roadmap that the team believes in, and what do you enjoy about that work?"
    expected_concepts:
      - "inputs"
      - "prioritisation"
      - "transparency"
      - "flexibility"
      - "example"
    rubric:
      excellent: "Describes inputs, trade-offs and communication, with an example of a roadmap changing for good reason."
      good: "Gives relevant reasons and some concrete detail about roadmap thinking, but links to the role stay general."
      weak: "Vague or generic answer on roadmap thinking that could apply to any job."
    followups:
      - "How often do you change it?"
      - "How do you share it?"
    common_errors:
      - "Treating the roadmap as a promise list."
