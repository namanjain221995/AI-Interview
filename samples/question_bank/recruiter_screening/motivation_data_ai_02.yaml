version: 1
defaults:
  role_tags: [data, data_analyst, data_scientist, ml, llm]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_data_ai.de_next"
    competency_key: motivation
    topic: "Growth in data engineering"
    difficulty: easy
    text: "What do you want to get better at as a data engineer over the next year or two?"
    expected_concepts:
      - "specific skills"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific skills such as streaming or data modelling and links them to the role."
      good: "Gives relevant reasons and some concrete detail about growth in data engineering, but links to the role stay general."
      weak: "Vague or generic answer on growth in data engineering that could apply to any job."
    followups:
      - "What have you tried so far?"
      - "How could this role help?"
    common_errors:
      - "Vague aims."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_next"
    competency_key: motivation
    topic: "Growth in analytics"
    difficulty: easy
    text: "Where would you like to develop as an analyst in the next year, and what are you doing about it?"
    expected_concepts:
      - "skills such as experimentation, modelling or storytelling"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific skills with learning actions and a link to the role."
      good: "Gives relevant reasons and some concrete detail about growth in analytics, but links to the role stay general."
      weak: "Vague or generic answer on growth in analytics that could apply to any job."
    followups:
      - "What have you practised?"
      - "Who could mentor you?"
    common_errors:
      - "Listing courses only."

  - external_key: "recruiter_screening.motivation_data_ai.ds_next"
    competency_key: motivation
    topic: "Growth in data science"
    difficulty: easy
    text: "What are the next skills you want to build as a data scientist?"
    expected_concepts:
      - "specific areas"
      - "plan"
      - "link to role"
    rubric:
      excellent: "Picks specific areas with a plan tied to the job."
      good: "Gives relevant reasons and some concrete detail about growth in data science, but links to the role stay general."
      weak: "Vague or generic answer on growth in data science that could apply to any job."
    followups:
      - "What project would help you build them?"
      - "How do you pick what to learn?"
    common_errors:
      - "Following trends only."

  - external_key: "recruiter_screening.motivation_data_ai.ml_next"
    competency_key: motivation
    topic: "Growth in ML engineering"
    difficulty: easy
    text: "Which parts of ML engineering do you want to go deeper on next?"
    expected_concepts:
      - "areas such as serving, monitoring or distributed training"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific areas with a plan and ties them to this role."
      good: "Gives relevant reasons and some concrete detail about growth in ml engineering, but links to the role stay general."
      weak: "Vague or generic answer on growth in ml engineering that could apply to any job."
    followups:
      - "What have you done on your own time?"
      - "What would you want to own here?"
    common_errors:
      - "Vague interest."

  - external_key: "recruiter_screening.motivation_data_ai.llm_next"
    competency_key: motivation
    topic: "Growth in LLM engineering"
    difficulty: easy
    text: "If you could pick one thing to get much better at in LLM engineering over the coming year, what would it be?"
    expected_concepts:
      - "specific areas such as evaluation, agents or fine-tuning"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific areas with practice and a link to the role."
      good: "Gives relevant reasons and some concrete detail about growth in llm engineering, but links to the role stay general."
      weak: "Vague or generic answer on growth in llm engineering that could apply to any job."
    followups:
      - "How do you try ideas safely?"
      - "What would you build first here?"
    common_errors:
      - "Chasing latest releases."

  - external_key: "recruiter_screening.motivation_data_ai.de_scope"
    competency_key: recruiter_fit
    topic: "Interest in this data role"
    difficulty: easy
    text: "Which parts of this data engineering role matter most to you?"
    expected_concepts:
      - "read posting"
      - "specific responsibilities"
      - "related experience"
    rubric:
      excellent: "Cites specific responsibilities and matches them to experience."
      good: "Gives relevant reasons and some concrete detail about interest in this data role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this data role that could apply to any job."
    followups:
      - "What would you ask the team about the platform?"
      - "What do you hope to own?"
    common_errors:
      - "Not having read the posting."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_scope"
    competency_key: recruiter_fit
    topic: "Interest in this analytics role"
    difficulty: easy
    text: "What about this analytics role caught your attention, and which parts do you expect to enjoy most?"
    expected_concepts:
      - "read posting"
      - "specific responsibilities"
      - "domain"
      - "experience"
    rubric:
      excellent: "Cites specifics of the role and domain with matching experience."
      good: "Gives relevant reasons and some concrete detail about interest in this analytics role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this analytics role that could apply to any job."
    followups:
      - "What would you ask the business teams?"
      - "What would you start with?"
    common_errors:
      - "Not knowing what the team analyses."

  - external_key: "recruiter_screening.motivation_data_ai.ds_scope"
    competency_key: recruiter_fit
    topic: "Interest in this data science role"
    difficulty: easy
    text: "What attracted you to this data science role in particular?"
    expected_concepts:
      - "read posting"
      - "problems"
      - "methods"
      - "domain"
      - "experience"
    rubric:
      excellent: "References the problems and methods in the posting and links them to experience."
      good: "Gives relevant reasons and some concrete detail about interest in this data science role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this data science role that could apply to any job."
    followups:
      - "Which problem interests you most?"
      - "What data would you want to see?"
    common_errors:
      - "General statements about data science."

  - external_key: "recruiter_screening.motivation_data_ai.ml_scope"
    competency_key: recruiter_fit
    topic: "Interest in this ML role"
    difficulty: easy
    text: "Which parts of this ML engineering role fit best with what you want to do?"
    expected_concepts:
      - "read posting"
      - "systems"
      - "scale"
      - "experience"
    rubric:
      excellent: "Cites specific responsibilities and relevant systems experience."
      good: "Gives relevant reasons and some concrete detail about interest in this ml role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this ml role that could apply to any job."
    followups:
      - "What would you want to know about our infrastructure?"
      - "What would you improve?"
    common_errors:
      - "Describing ML in general."

  - external_key: "recruiter_screening.motivation_data_ai.llm_scope"
    competency_key: recruiter_fit
    topic: "Interest in this LLM role"
    difficulty: easy
    text: "What about this LLM engineering role appealed to you, and what do you expect the work to involve?"
    expected_concepts:
      - "read posting"
      - "use cases"
      - "stack"
      - "realistic expectations"
    rubric:
      excellent: "Describes the work accurately and relates it to relevant experience."
      good: "Gives relevant reasons and some concrete detail about interest in this llm role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this llm role that could apply to any job."
    followups:
      - "What would you want to know about our data?"
      - "What would you build first?"
    common_errors:
      - "Expecting research freedom without constraints."

  - external_key: "recruiter_screening.motivation_data_ai.de_team_work"
    competency_key: recruiter_fit
    topic: "Working with data consumers"
    difficulty: easy
    text: "How do you work with analysts and data scientists who depend on your pipelines?"
    expected_concepts:
      - "communication"
      - "data contracts"
      - "support"
      - "feedback"
      - "examples"
    rubric:
      excellent: "Describes practices such as data contracts and clear communication, with an example."
      good: "Gives relevant reasons and some concrete detail about working with data consumers, but links to the role stay general."
      weak: "Vague or generic answer on working with data consumers that could apply to any job."
    followups:
      - "How do you tell them about schema changes?"
      - "How do you handle urgent requests?"
    common_errors:
      - "Changing data without notice."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_stakeholders"
    competency_key: recruiter_fit
    topic: "Working with stakeholders"
    difficulty: easy
    text: "How do you work with business stakeholders when their question is vague?"
    expected_concepts:
      - "clarifying questions"
      - "framing"
      - "expectations"
      - "examples"
      - "communication"
    rubric:
      excellent: "Describes how they clarify the question and agree on what success looks like, with an example."
      good: "Gives relevant reasons and some concrete detail about working with stakeholders, but links to the role stay general."
      weak: "Vague or generic answer on working with stakeholders that could apply to any job."
    followups:
      - "Give an example of a vague request."
      - "How do you deal with pushback on your findings?"
    common_errors:
      - "Answering the wrong question."

  - external_key: "recruiter_screening.motivation_data_ai.ds_partners"
    competency_key: recruiter_fit
    topic: "Working with product and engineering"
    difficulty: easy
    text: "How do you like to work with engineers and product managers as a data scientist?"
    expected_concepts:
      - "collaboration"
      - "shared goals"
      - "handoffs"
      - "examples"
    rubric:
      excellent: "Describes concrete habits such as joint planning and early engineering involvement."
      good: "Gives relevant reasons and some concrete detail about working with product and engineering, but links to the role stay general."
      weak: "Vague or generic answer on working with product and engineering that could apply to any job."
    followups:
      - "How do you get your models used?"
      - "How do you explain results?"
    common_errors:
      - "Working in isolation."

  - external_key: "recruiter_screening.motivation_data_ai.ml_partners"
    competency_key: recruiter_fit
    topic: "Working with data scientists"
    difficulty: easy
    text: "How do you work with data scientists to get their models into production?"
    expected_concepts:
      - "collaboration"
      - "standards"
      - "handoffs"
      - "tooling"
      - "examples"
    rubric:
      excellent: "Describes handoff practices and shared tooling with an example."
      good: "Gives relevant reasons and some concrete detail about working with data scientists, but links to the role stay general."
      weak: "Vague or generic answer on working with data scientists that could apply to any job."
    followups:
      - "What do you wish data scientists did?"
      - "How do you share code standards?"
    common_errors:
      - "Blaming data scientists."

  - external_key: "recruiter_screening.motivation_data_ai.llm_partners"
    competency_key: recruiter_fit
    topic: "Working with product and domain experts"
    difficulty: easy
    text: "How do you work with product owners and domain experts when building an LLM feature?"
    expected_concepts:
      - "requirements"
      - "evaluation sets with experts"
      - "feedback"
      - "expectations"
      - "examples"
    rubric:
      excellent: "Describes involving experts in evaluation and managing expectations, with an example."
      good: "Gives relevant reasons and some concrete detail about working with product and domain experts, but links to the role stay general."
      weak: "Vague or generic answer on working with product and domain experts that could apply to any job."
    followups:
      - "How do you manage expectations?"
      - "How do you collect good examples?"
    common_errors:
      - "Treating the model as magic."

  - external_key: "recruiter_screening.motivation_data_ai.de_pressure"
    competency_key: motivation
    topic: "Handling pipeline failures"
    difficulty: medium
    text: "A critical pipeline fails the night before a big report. How do you feel about that kind of pressure, and what has experience taught you?"
    expected_concepts:
      - "response"
      - "communication"
      - "prevention"
      - "examples"
      - "sustainable habits"
    rubric:
      excellent: "Describes a real example, how they communicated and what they changed to prevent recurrence."
      good: "Gives relevant reasons and some concrete detail about handling pipeline failures, but links to the role stay general."
      weak: "Vague or generic answer on handling pipeline failures that could apply to any job."
    followups:
      - "What did you change afterwards?"
      - "How do you decide what to tell stakeholders?"
    common_errors:
      - "Treating it as routine heroics."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_accuracy"
    competency_key: motivation
    topic: "Accuracy and trust"
    difficulty: medium
    text: "Tell me about a time you found an error in your own analysis after sharing it. What did you do?"
    expected_concepts:
      - "discovery"
      - "communication"
      - "correction"
      - "prevention"
      - "reflection"
    rubric:
      excellent: "Shows prompt correction, clear communication and new checks."
      good: "Gives relevant reasons and some concrete detail about accuracy and trust, but links to the role stay general."
      weak: "Vague or generic answer on accuracy and trust that could apply to any job."
    followups:
      - "How did stakeholders react?"
      - "What checks do you use now?"
    common_errors:
      - "Hiding the mistake."

  - external_key: "recruiter_screening.motivation_data_ai.ds_ambiguity"
    competency_key: motivation
    topic: "Ambiguous problems"
    difficulty: medium
    text: "Data science problems often start vague. How do you feel about that, and how do you get moving?"
    expected_concepts:
      - "framing"
      - "hypotheses"
      - "stakeholder talks"
      - "baselines"
      - "examples"
    rubric:
      excellent: "Describes structured approach with baselines and checkpoints."
      good: "Gives relevant reasons and some concrete detail about ambiguous problems, but links to the role stay general."
      weak: "Vague or generic answer on ambiguous problems that could apply to any job."
    followups:
      - "What does your first week on a vague problem look like?"
      - "How do you decide when to stop?"
    common_errors:
      - "Waiting for clear requirements."

  - external_key: "recruiter_screening.motivation_data_ai.ml_infra_interest"
    competency_key: motivation
    topic: "Infrastructure interest"
    difficulty: medium
    text: "What do you enjoy about the infrastructure side of ML, such as pipelines, serving and monitoring?"
    expected_concepts:
      - "interests"
      - "examples"
      - "tools"
      - "trade-offs"
    rubric:
      excellent: "Shows interest in specific engineering problems with examples."
      good: "Gives relevant reasons and some concrete detail about infrastructure interest, but links to the role stay general."
      weak: "Vague or generic answer on infrastructure interest that could apply to any job."
    followups:
      - "What is the hardest part of serving?"
      - "How do you test a pipeline?"
    common_errors:
      - "Seeing infrastructure as a nuisance."

  - external_key: "recruiter_screening.motivation_data_ai.llm_eval_interest"
    competency_key: motivation
    topic: "Evaluation work"
    difficulty: medium
    text: "Measuring the quality of LLM systems is hard. What is your approach and why does it interest you?"
    expected_concepts:
      - "evaluation sets"
      - "metrics"
      - "human review"
      - "regression tests"
      - "example"
    rubric:
      excellent: "Describes concrete evaluation methods and an example of using them to improve a system."
      good: "Gives relevant reasons and some concrete detail about evaluation work, but links to the role stay general."
      weak: "Vague or generic answer on evaluation work that could apply to any job."
    followups:
      - "What would you do when metrics disagree with users?"
      - "How do you track regressions?"
    common_errors:
      - "Relying on demos."

  - external_key: "recruiter_screening.motivation_data_ai.de_ownership_data"
    competency_key: motivation
    topic: "Data quality responsibility"
    difficulty: medium
    text: "How do you think about owning data quality, and what have you done to improve it?"
    expected_concepts:
      - "quality checks"
      - "contracts"
      - "monitoring"
      - "ownership"
      - "example"
    rubric:
      excellent: "Describes checks, contracts and monitoring and a measured example."
      good: "Gives relevant reasons and some concrete detail about data quality responsibility, but links to the role stay general."
      weak: "Vague or generic answer on data quality responsibility that could apply to any job."
    followups:
      - "Who should own quality at source?"
      - "How do you measure it?"
    common_errors:
      - "Assuming source data is fine."

  - external_key: "recruiter_screening.motivation_data_ai.analyst_career_path"
    competency_key: motivation
    topic: "Analytics career direction"
    difficulty: hard
    text: "Analytics can lead toward data science, product, or leadership. Which direction do you lean toward and how have you tested it?"
    expected_concepts:
      - "self-awareness"
      - "evidence"
      - "plan"
      - "link to role"
      - "flexibility"
    rubric:
      excellent: "Names a direction backed by actions and ties it to the role."
      good: "Gives relevant reasons and some concrete detail about analytics career direction, but links to the role stay general."
      weak: "Vague or generic answer on analytics career direction that could apply to any job."
    followups:
      - "What experiment have you run?"
      - "What would make you change direction?"
    common_errors:
      - "No direction."

  - external_key: "recruiter_screening.motivation_data_ai.ds_ethics"
    competency_key: motivation
    topic: "Responsible modelling"
    difficulty: hard
    text: "Models can affect people's opportunities. Tell me about a time you thought carefully about fairness or misuse in your work and what you did."
    expected_concepts:
      - "identifying risk"
      - "analysis"
      - "stakeholder discussion"
      - "mitigation"
      - "example"
    rubric:
      excellent: "Gives a specific case with analysis and action taken."
      good: "Gives relevant reasons and some concrete detail about responsible modelling, but links to the role stay general."
      weak: "Vague or generic answer on responsible modelling that could apply to any job."
    followups:
      - "How did you measure it?"
      - "What was the outcome?"
    common_errors:
      - "Dismissing the topic."

  - external_key: "recruiter_screening.motivation_data_ai.ml_scale_pride"
    competency_key: motivation
    topic: "Systems under load"
    difficulty: hard
    text: "Tell me about a time an ML system you owned hit scale or latency limits. What drew you into solving it?"
    expected_concepts:
      - "problem"
      - "diagnosis"
      - "solution"
      - "results"
      - "learning"
    rubric:
      excellent: "Describes diagnosis, solution and measured improvements."
      good: "Gives relevant reasons and some concrete detail about systems under load, but links to the role stay general."
      weak: "Vague or generic answer on systems under load that could apply to any job."
    followups:
      - "What did you measure first?"
      - "What would you do differently?"
    common_errors:
      - "Guessing without measurement."

  - external_key: "recruiter_screening.motivation_data_ai.llm_scope_choice"
    competency_key: motivation
    topic: "Build or buy"
    difficulty: easy
    text: "When would you rather build something around a model yourself, and when would you use an existing product, and why does that interest you?"
    expected_concepts:
      - "judgement"
      - "cost and risk"
      - "examples"
      - "learning"
    rubric:
      excellent: "Gives a reasoned view of when to build or buy, with an example."
      good: "Gives relevant reasons and some concrete detail about build or buy, but links to the role stay general."
      weak: "Vague or generic answer on build or buy that could apply to any job."
    followups:
      - "Tell me about a time you chose to buy."
      - "How do you compare options?"
    common_errors:
      - "Always building."
