# Curated questions: recruiter screening, company interest (02 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.company_interest.what_excites_about_work_here
    competency_key: motivation
    topic: "What excites you"
    difficulty: easy
    text: "What excites you most about the work we do?"
    expected_concepts:
      - "specific"
      - "connection to skills"
      - "understanding"
      - "interest"
    rubric:
      excellent: "Names a specific aspect of the work, connects it to skills and shows understanding."
      good: "Names something exciting in general terms."
      weak: "Gives a generic answer."
    followups:
      - "What would you like to work on?"
      - "Where did that come from?"
    common_errors:
      - "Gives a generic answer."

  - external_key: recruiter_screening.company_interest.company_size_preference
    competency_key: culture_values
    topic: "Company size"
    difficulty: easy
    text: "What have you noticed about working in companies of different sizes, and where do you do your best work?"
    expected_concepts:
      - "experience"
      - "self-awareness"
      - "examples"
      - "fit"
    rubric:
      excellent: "Compares settings with concrete examples and explains how our size suits their way of working."
      good: "Gives a preference with brief reasons."
      weak: "Gives generic statements."
    followups:
      - "What would you miss?"
      - "What would you gain?"
    common_errors:
      - "Gives generic statements."

  - external_key: recruiter_screening.company_interest.product_strategy_curiosity
    competency_key: problem_solving
    topic: "Our direction"
    difficulty: easy
    text: "What would you like to understand about where our product is heading?"
    expected_concepts:
      - "relevant questions"
      - "strategic curiosity"
      - "link to role"
      - "preparation"
    rubric:
      excellent: "Asks insightful questions about priorities and trade-offs relevant to the role."
      good: "Asks about the roadmap generally."
      weak: "Asks nothing about direction."
    followups:
      - "Why is that important for you?"
      - "How would it shape your work?"
    common_errors:
      - "Asks nothing about direction."

  - external_key: recruiter_screening.company_interest.company_values_example
    competency_key: culture_values
    topic: "Values in practice"
    difficulty: medium
    text: "Pick one of our published values and tell me about a time you worked in line with it."
    expected_concepts:
      - "understanding of value"
      - "specific example"
      - "outcome"
      - "reflection"
    rubric:
      excellent: "Picks a value, tells a specific story showing it in practice and reflects on the outcome."
      good: "Tells a loosely related story."
      weak: "Tells no story."
    followups:
      - "What did it cost?"
      - "How would it look here?"
    common_errors:
      - "Tells no story."

  - external_key: recruiter_screening.company_interest.impact_you_could_have
    competency_key: ownership
    topic: "Impact here"
    difficulty: easy
    text: "What kind of impact do you think you could have here?"
    expected_concepts:
      - "realistic"
      - "specific"
      - "evidence"
      - "link to role"
    rubric:
      excellent: "Describes realistic impact with evidence from past work and ties it to company needs."
      good: "Describes impact generally."
      weak: "Makes inflated claims."
    followups:
      - "What would you need first?"
      - "How would you measure it?"
    common_errors:
      - "Makes inflated claims."

  - external_key: recruiter_screening.company_interest.customer_story
    competency_key: communication
    topic: "A user story"
    difficulty: easy
    text: "Tell me about a time a product or service you used well solved a real problem for you. What made it good?"
    expected_concepts:
      - "specific story"
      - "analysis of quality"
      - "user view"
      - "relevance"
    rubric:
      excellent: "Tells a specific story and draws lessons about what makes a good product that apply here."
      good: "Tells a simple story."
      weak: "Cannot give an example."
    followups:
      - "What would you copy?"
      - "What would you avoid?"
    common_errors:
      - "Cannot give an example."

  - external_key: recruiter_screening.company_interest.how_you_evaluate_employers
    competency_key: motivation
    topic: "Choosing an employer"
    difficulty: medium
    text: "How do you evaluate whether a company is a good place to work from the outside?"
    expected_concepts:
      - "criteria"
      - "evidence sources"
      - "balance"
      - "questions"
    rubric:
      excellent: "Describes job-related criteria, sources of evidence and questions to check the rest."
      good: "Describes a few criteria."
      weak: "Relies on reputation only."
    followups:
      - "What evidence did you find for us?"
      - "What would you still check?"
    common_errors:
      - "Relies on reputation only."

  - external_key: recruiter_screening.company_interest.interest_in_domain_problems
    competency_key: motivation
    topic: "Problems in our space"
    difficulty: medium
    text: "What problems in our field do you find most interesting, and why?"
    expected_concepts:
      - "specific problems"
      - "knowledge"
      - "curiosity"
      - "link to role"
    rubric:
      excellent: "Names specific problems, shows knowledge and links them to the work here."
      good: "Names problems generally."
      weak: "Cannot name any."
    followups:
      - "What have you read about them?"
      - "What would you try?"
    common_errors:
      - "Cannot name any."

  - external_key: recruiter_screening.company_interest.open_source_or_public_work
    competency_key: communication
    topic: "Our public work"
    difficulty: easy
    text: "Have you looked at anything we have published, such as documentation, blog posts or talks? What did you take away?"
    expected_concepts:
      - "specific item"
      - "insight"
      - "critical reading"
      - "relevance"
    rubric:
      excellent: "Names a specific item, summarises what it says and what they thought."
      good: "Mentions looking in general."
      weak: "Has not looked."
    followups:
      - "What was your question?"
      - "What would you add?"
    common_errors:
      - "Has not looked."

  - external_key: recruiter_screening.company_interest.leadership_visibility
    competency_key: culture_values
    topic: "How the company is led"
    difficulty: medium
    text: "What would you want to know about how leadership communicates direction and decisions?"
    expected_concepts:
      - "relevant questions"
      - "transparency interest"
      - "preparation"
      - "clarity"
    rubric:
      excellent: "Asks specific questions about communication and decision making that affect daily work."
      good: "Asks general questions."
      weak: "Has no interest."
    followups:
      - "Why does that matter to you?"
      - "What good communication looks like?"
    common_errors:
      - "Has no interest."

  - external_key: recruiter_screening.company_interest.partnerships_ecosystem
    competency_key: collaboration
    topic: "Our ecosystem"
    difficulty: medium
    text: "Who do you think are our key partners or the ecosystem around our product?"
    expected_concepts:
      - "ecosystem knowledge"
      - "reasoning"
      - "research"
      - "relevance"
    rubric:
      excellent: "Names relevant partners or ecosystem players and explains their importance."
      good: "Names one or two partners."
      weak: "Cannot name any."
    followups:
      - "How does that affect the role?"
      - "What would you check?"
    common_errors:
      - "Cannot name any."

  - external_key: recruiter_screening.company_interest.fit_with_company_stage_goals
    competency_key: recruiter_fit
    topic: "Our current goals"
    difficulty: medium
    text: "What do you think our priorities are over the next year, and how could this role support them?"
    expected_concepts:
      - "inference"
      - "reasoning"
      - "link to role"
      - "openness to learning"
    rubric:
      excellent: "Makes reasoned guesses about priorities and links the role's work to them while admitting limits."
      good: "Makes general guesses."
      weak: "Has no view."
    followups:
      - "How would you confirm?"
      - "What would you ask?"
    common_errors:
      - "Has no view."

  - external_key: recruiter_screening.company_interest.why_leaving_current
    competency_key: motivation
    topic: "What you are looking for"
    difficulty: medium
    text: "Without going into details about your current employer, what are you looking to find in a new company?"
    expected_concepts:
      - "forward-looking"
      - "job-related"
      - "respectful"
      - "link to this company"
    rubric:
      excellent: "Focuses on what they seek, in job-related terms, and links it to this company without criticising others."
      good: "States what they seek in general terms."
      weak: "Focuses on complaints."
    followups:
      - "What would be ideal?"
      - "What did you learn?"
    common_errors:
      - "Focuses on complaints."

  - external_key: recruiter_screening.company_interest.internal_culture_questions
    competency_key: culture_values
    topic: "Culture questions"
    difficulty: easy
    text: "What would you ask current team members to understand how it is to work here?"
    expected_concepts:
      - "relevant questions"
      - "balance"
      - "listening"
      - "preparation"
    rubric:
      excellent: "Asks balanced questions about work, feedback and collaboration and proposes whom to ask."
      good: "Asks general questions."
      weak: "Asks leading or irrelevant questions."
    followups:
      - "What answer would worry you?"
      - "What answer would excite you?"
    common_errors:
      - "Asks leading or irrelevant questions."

  - external_key: recruiter_screening.company_interest.value_of_diverse_perspectives
    competency_key: collaboration
    topic: "Different perspectives"
    difficulty: medium
    text: "How have you seen different perspectives improve a product or decision? How would you bring that here?"
    expected_concepts:
      - "example"
      - "mechanism"
      - "application"
      - "respect"
    rubric:
      excellent: "Gives a specific example of improved outcomes through varied input and says how to enable it here."
      good: "Gives a general view."
      weak: "Has no example."
    followups:
      - "What made it work?"
      - "What got in the way?"
    common_errors:
      - "Has no example."

  - external_key: recruiter_screening.company_interest.unique_selling_points
    competency_key: communication
    topic: "What sets us apart"
    difficulty: medium
    text: "If you had to explain to a friend why a customer would choose us, what would you say?"
    expected_concepts:
      - "clear differentiators"
      - "customer view"
      - "accuracy"
      - "concision"
    rubric:
      excellent: "Gives clear, accurate differentiators in customer terms."
      good: "Gives generic reasons."
      weak: "Cannot explain."
    followups:
      - "What would you check?"
      - "What worries you?"
    common_errors:
      - "Cannot explain."

  - external_key: recruiter_screening.company_interest.product_ethics_responsibility
    competency_key: culture_values
    topic: "Responsible practice"
    difficulty: hard
    text: "What responsibilities do you think a company like ours has towards its users and the public?"
    expected_concepts:
      - "informed view"
      - "specific responsibilities"
      - "trade-offs"
      - "reasoning"
    rubric:
      excellent: "Names specific responsibilities such as privacy and reliability and discusses trade-offs."
      good: "Names general responsibilities."
      weak: "Has no view."
    followups:
      - "Where would you push back?"
      - "Give an example from your work."
    common_errors:
      - "Has no view."

  - external_key: recruiter_screening.company_interest.company_growth_story
    competency_key: motivation
    topic: "Our journey"
    difficulty: easy
    text: "What do you know about how the company has grown, and what does that tell you?"
    expected_concepts:
      - "history knowledge"
      - "inference"
      - "interest"
      - "relevance"
    rubric:
      excellent: "Summarises the company's journey and draws sensible inferences for working here."
      good: "Gives a few facts."
      weak: "Knows nothing."
    followups:
      - "What question does it raise?"
      - "What attracts you?"
    common_errors:
      - "Knows nothing."

  - external_key: recruiter_screening.company_interest.user_research_interest
    competency_key: problem_solving
    topic: "Understanding users"
    difficulty: medium
    text: "How would you go about understanding our users' needs in your first months?"
    expected_concepts:
      - "methods"
      - "stakeholders"
      - "listening"
      - "applying"
    rubric:
      excellent: "Describes talking to users and colleagues, reviewing data and applying insights."
      good: "Describes reading documents."
      weak: "Has no approach."
    followups:
      - "Who would you ask first?"
      - "How would you validate?"
    common_errors:
      - "Has no approach."

  - external_key: recruiter_screening.company_interest.openness_to_feedback_company
    competency_key: communication
    topic: "Feedback to the company"
    difficulty: medium
    text: "If you saw something in our product or process that could be better, how would you raise it?"
    expected_concepts:
      - "constructive"
      - "evidence"
      - "timing"
      - "follow-up"
    rubric:
      excellent: "Describes raising it with evidence and constructive options to the right people."
      good: "Says they would mention it."
      weak: "Would stay silent or criticise publicly."
    followups:
      - "What if nobody acted?"
      - "What is a good example?"
    common_errors:
      - "Would stay silent or criticise publicly."

  - external_key: recruiter_screening.company_interest.sources_of_information
    competency_key: communication
    topic: "Where you looked"
    difficulty: easy
    text: "Where did you find the most useful information about us?"
    expected_concepts:
      - "specific sources"
      - "reliability"
      - "synthesis"
      - "curiosity"
    rubric:
      excellent: "Names useful sources, assesses their reliability and shares a key insight."
      good: "Names one source."
      weak: "Names none."
    followups:
      - "What was missing?"
      - "What would you like to read next?"
    common_errors:
      - "Names none."

  - external_key: recruiter_screening.company_interest.long_term_company_interest
    competency_key: motivation
    topic: "Staying engaged"
    difficulty: hard
    text: "What would keep you interested in our company over the long term?"
    expected_concepts:
      - "sustained interest"
      - "specific factors"
      - "realism"
      - "evidence"
    rubric:
      excellent: "Names specific features of the work and company that sustain interest, with evidence from past roles."
      good: "Names general factors."
      weak: "Names only compensation or title."
    followups:
      - "What happened in earlier roles?"
      - "What would you need?"
    common_errors:
      - "Names only compensation or title."

  - external_key: recruiter_screening.company_interest.customers_pain_points
    competency_key: problem_solving
    topic: "Customer pain points"
    difficulty: medium
    text: "What pain points do you think customers in our space have that we might be well placed to solve?"
    expected_concepts:
      - "insight"
      - "reasoning"
      - "link to product"
      - "openness to learning"
    rubric:
      excellent: "Identifies plausible pain points, links them to the product and acknowledges what needs validation."
      good: "Names obvious pain points."
      weak: "Cannot name any."
    followups:
      - "How would you validate this?"
      - "What would you ask customers?"
    common_errors:
      - "Cannot name any."

  - external_key: recruiter_screening.company_interest.company_tools_curiosity
    competency_key: motivation
    topic: "Curiosity about the stack and tools"
    difficulty: easy
    text: "What would you like to know about the tools and ways of working you would use here?"
    expected_concepts:
      - "relevant topics"
      - "experience"
      - "learning plan"
      - "interest"
    rubric:
      excellent: "Asks specific questions about tools linked to their experience and learning plans."
      good: "Asks general questions."
      weak: "Has no questions."
    followups:
      - "What have you used?"
      - "What would you like to learn?"
    common_errors:
      - "Has no questions."

  - external_key: recruiter_screening.company_interest.brand_to_role_link
    competency_key: motivation
    topic: "From brand to job"
    difficulty: easy
    text: "What does our brand or product promise to customers, and how would your work help deliver it?"
    expected_concepts:
      - "promise understanding"
      - "link to work"
      - "examples"
      - "clarity"
    rubric:
      excellent: "States the promise clearly and links specific parts of their work to delivering it."
      good: "States the promise."
      weak: "Cannot link to the job."
    followups:
      - "How do you measure the promise being met?"
      - "Who else affects it?"
    common_errors:
      - "Cannot link to the job."
