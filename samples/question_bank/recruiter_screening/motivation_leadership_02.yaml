version: 1
defaults:
  role_tags: [tech_lead, engineering_manager]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_leadership.tl_next"
    competency_key: motivation
    topic: "Growth as a lead"
    difficulty: easy
    text: "As a technical leader, what is the one capability you would like to be noticeably stronger at a year from now?"
    expected_concepts:
      - "specific skills"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific skills with actions and links them to the role."
      good: "Gives relevant reasons and some concrete detail about growth as a lead, but links to the role stay general."
      weak: "Vague or generic answer on growth as a lead that could apply to any job."
    followups:
      - "What feedback shaped that?"
      - "How could this role help?"
    common_errors:
      - "Giving a vague answer with no plan."

  - external_key: "recruiter_screening.motivation_leadership.em_next"
    competency_key: motivation
    topic: "Growth as a manager"
    difficulty: easy
    text: "Looking ahead at your management craft, which skill would you most like to sharpen, and how do you plan to do it?"
    expected_concepts:
      - "specific skills such as coaching or planning"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific skills and a plan to build them in this role."
      good: "Gives relevant reasons and some concrete detail about growth as a manager, but links to the role stay general."
      weak: "Vague or generic answer on growth as a manager that could apply to any job."
    followups:
      - "What has helped so far?"
      - "Who do you learn from?"
    common_errors:
      - "Giving a vague answer with no plan."

  - external_key: "recruiter_screening.motivation_leadership.tl_learn_lead"
    competency_key: motivation
    topic: "Learning to lead"
    difficulty: easy
    text: "What was the hardest thing you had to learn when you first led technical work?"
    expected_concepts:
      - "specific lesson"
      - "reflection"
      - "changes"
      - "example"
    rubric:
      excellent: "Shares a specific lesson, how they changed and current growth areas."
      good: "Gives relevant reasons and some concrete detail about learning to lead, but links to the role stay general."
      weak: "Vague or generic answer on learning to lead that could apply to any job."
    followups:
      - "What would you tell a new lead?"
      - "What do you still work on?"
    common_errors:
      - "Saying it was easy."

  - external_key: "recruiter_screening.motivation_leadership.em_learn_manage"
    competency_key: motivation
    topic: "Learning to manage"
    difficulty: easy
    text: "What did you find hardest in your first year managing people?"
    expected_concepts:
      - "specific lesson"
      - "reflection"
      - "changes"
      - "example"
    rubric:
      excellent: "Shares a specific lesson, how they adapted and who supported them."
      good: "Gives relevant reasons and some concrete detail about learning to manage, but links to the role stay general."
      weak: "Vague or generic answer on learning to manage that could apply to any job."
    followups:
      - "What did you stop doing?"
      - "Who helped you?"
    common_errors:
      - "Saying nothing was hard."

  - external_key: "recruiter_screening.motivation_leadership.tl_team_fit"
    competency_key: recruiter_fit
    topic: "Team composition"
    difficulty: easy
    text: "What mix of experience levels on a team helps you lead well?"
    expected_concepts:
      - "mix of juniors and seniors"
      - "mentoring"
      - "reasoning"
      - "examples"
    rubric:
      excellent: "Describes how they lead different levels and an example."
      good: "Gives relevant reasons and some concrete detail about team composition, but links to the role stay general."
      weak: "Vague or generic answer on team composition that could apply to any job."
    followups:
      - "How do you handle a team of all juniors?"
      - "What support do you give?"
    common_errors:
      - "No view."

  - external_key: "recruiter_screening.motivation_leadership.em_org_fit"
    competency_key: recruiter_fit
    topic: "Organisation size"
    difficulty: easy
    text: "What size of team and organisation suits you as a manager, and what have you learned from your past roles?"
    expected_concepts:
      - "preferences"
      - "experience"
      - "trade-offs"
      - "flexibility"
    rubric:
      excellent: "Gives a clear preference supported by experience and flexibility."
      good: "Gives relevant reasons and some concrete detail about organisation size, but links to the role stay general."
      weak: "Vague or generic answer on organisation size that could apply to any job."
    followups:
      - "What changes as teams grow?"
      - "What do you miss from smaller teams?"
    common_errors:
      - "Insisting on one fixed setup."

  - external_key: "recruiter_screening.motivation_leadership.tl_pace"
    competency_key: recruiter_fit
    topic: "Delivery pace"
    difficulty: easy
    text: "What pace of delivery works best for you as a lead, and how do you keep quality up?"
    expected_concepts:
      - "planning"
      - "quality"
      - "scope"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes practical habits such as slicing work and clear acceptance criteria."
      good: "Gives relevant reasons and some concrete detail about delivery pace, but links to the role stay general."
      weak: "Vague or generic answer on delivery pace that could apply to any job."
    followups:
      - "How do you push back on pace?"
      - "How do you share the load?"
    common_errors:
      - "Always saying yes."

  - external_key: "recruiter_screening.motivation_leadership.em_oncall"
    competency_key: recruiter_fit
    topic: "Team operations"
    difficulty: easy
    text: "How do you think about on-call and operational load for your team, and what do you do to keep it fair?"
    expected_concepts:
      - "fair rotation"
      - "load limits"
      - "reducing pages"
      - "leading by example"
      - "experience"
    rubric:
      excellent: "Describes fair rotations and actions to reduce load, with an example."
      good: "Gives relevant reasons and some concrete detail about team operations, but links to the role stay general."
      weak: "Vague or generic answer on team operations that could apply to any job."
    followups:
      - "What would you do if one person carried most of it?"
      - "How do you fix noisy alerts?"
    common_errors:
      - "Ignoring load."

  - external_key: "recruiter_screening.motivation_leadership.tl_review_culture"
    competency_key: leadership
    topic: "Code review culture"
    difficulty: easy
    text: "What does a healthy code review culture look like to you, and how do you build it?"
    expected_concepts:
      - "standards"
      - "tone"
      - "speed"
      - "learning"
      - "example"
    rubric:
      excellent: "Describes concrete practices such as review guidelines and response times."
      good: "Gives relevant reasons and some concrete detail about code review culture, but links to the role stay general."
      weak: "Vague or generic answer on code review culture that could apply to any job."
    followups:
      - "What do you do about slow reviews?"
      - "How do you review as lead?"
    common_errors:
      - "Using reviews to gatekeep."

  - external_key: "recruiter_screening.motivation_leadership.em_one_on_ones"
    competency_key: people_management
    topic: "One-to-ones"
    difficulty: easy
    text: "How do you approach one-to-ones with your team members?"
    expected_concepts:
      - "regularity"
      - "agenda owned by report"
      - "growth topics"
      - "feedback"
      - "example"
    rubric:
      excellent: "Describes regular one-to-ones focused on growth and feedback, with an example."
      good: "Gives relevant reasons and some concrete detail about one-to-ones, but links to the role stay general."
      weak: "Vague or generic answer on one-to-ones that could apply to any job."
    followups:
      - "What do you do when someone says everything is fine?"
      - "How do you record actions?"
    common_errors:
      - "Using them for status updates only."

  - external_key: "recruiter_screening.motivation_leadership.tl_design_docs"
    competency_key: leadership
    topic: "Design discussions"
    difficulty: easy
    text: "How do you run design discussions so that good ideas come from the whole team?"
    expected_concepts:
      - "facilitation"
      - "written proposals"
      - "quieter voices"
      - "decisions"
      - "example"
    rubric:
      excellent: "Describes practical facilitation and an example of including quieter voices."
      good: "Gives relevant reasons and some concrete detail about design discussions, but links to the role stay general."
      weak: "Vague or generic answer on design discussions that could apply to any job."
    followups:
      - "How do you avoid design by committee?"
      - "How do you capture decisions?"
    common_errors:
      - "Dominating discussions."

  - external_key: "recruiter_screening.motivation_leadership.em_meetings"
    competency_key: leadership
    topic: "Team rhythm"
    difficulty: easy
    text: "What team rituals do you rely on, and how do you decide which to keep?"
    expected_concepts:
      - "planning"
      - "retrospectives"
      - "communication"
      - "review of rituals"
      - "example"
    rubric:
      excellent: "Describes a handful of rituals, reviews them and drops those that do not help."
      good: "Gives relevant reasons and some concrete detail about team rhythm, but links to the role stay general."
      weak: "Vague or generic answer on team rhythm that could apply to any job."
    followups:
      - "Which did you drop?"
      - "How do you measure value?"
    common_errors:
      - "Too many meetings."

  - external_key: "recruiter_screening.motivation_leadership.tl_clarity"
    competency_key: communication
    topic: "Communicating direction"
    difficulty: medium
    text: "How do you make sure everyone on the team understands the technical direction?"
    expected_concepts:
      - "written communication"
      - "repetition"
      - "feedback"
      - "examples"
    rubric:
      excellent: "Describes written and verbal habits and checks that understanding is shared."
      good: "Gives relevant reasons and some concrete detail about communicating direction, but links to the role stay general."
      weak: "Vague or generic answer on communicating direction that could apply to any job."
    followups:
      - "How do you check understanding?"
      - "What do you do with a new joiner?"
    common_errors:
      - "Assuming people know."

  - external_key: "recruiter_screening.motivation_leadership.em_feedback"
    competency_key: people_management
    topic: "Giving feedback"
    difficulty: medium
    text: "How do you give feedback to people who report to you, particularly when it is hard to hear?"
    expected_concepts:
      - "timing"
      - "specifics"
      - "support"
      - "follow-up"
      - "example"
    rubric:
      excellent: "Describes timely, specific feedback with support and follow-up."
      good: "Gives relevant reasons and some concrete detail about giving feedback, but links to the role stay general."
      weak: "Vague or generic answer on giving feedback that could apply to any job."
    followups:
      - "Tell me about a hard conversation."
      - "How do you ask for feedback?"
    common_errors:
      - "Avoiding feedback."

  - external_key: "recruiter_screening.motivation_leadership.tl_ownership"
    competency_key: leadership
    topic: "Shared ownership"
    difficulty: medium
    text: "How do you spread ownership of systems across the team so that you are not the bottleneck?"
    expected_concepts:
      - "delegation"
      - "documentation"
      - "rotation"
      - "coaching"
      - "example"
    rubric:
      excellent: "Describes delegation, documentation and coaching with an example of removing a bottleneck."
      good: "Gives relevant reasons and some concrete detail about shared ownership, but links to the role stay general."
      weak: "Vague or generic answer on shared ownership that could apply to any job."
    followups:
      - "What do you keep for yourself?"
      - "How do you handle a failed delegation?"
    common_errors:
      - "Being the hero."

  - external_key: "recruiter_screening.motivation_leadership.em_retention"
    competency_key: people_management
    topic: "Keeping good people"
    difficulty: medium
    text: "How do you think about keeping strong engineers motivated and growing on your team?"
    expected_concepts:
      - "growth paths"
      - "recognition"
      - "autonomy"
      - "feedback"
      - "example"
    rubric:
      excellent: "Describes concrete approaches to growth and autonomy with an example."
      good: "Gives relevant reasons and some concrete detail about keeping good people, but links to the role stay general."
      weak: "Vague or generic answer on keeping good people that could apply to any job."
    followups:
      - "Tell me about someone you retained."
      - "What would you do if they left?"
    common_errors:
      - "Relying on pay."

  - external_key: "recruiter_screening.motivation_leadership.tl_quality"
    competency_key: leadership
    topic: "Quality bar"
    difficulty: medium
    text: "How do you set and maintain a quality bar when the team is under delivery pressure?"
    expected_concepts:
      - "standards"
      - "automation"
      - "trade-offs"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes practical standards and an example of protecting quality while managing pressure."
      good: "Gives relevant reasons and some concrete detail about quality bar, but links to the role stay general."
      weak: "Vague or generic answer on quality bar that could apply to any job."
    followups:
      - "Tell me about a time you held the bar."
      - "Which trade-offs did you accept?"
    common_errors:
      - "Lowering the bar silently."

  - external_key: "recruiter_screening.motivation_leadership.em_prioritise"
    competency_key: leadership
    topic: "Prioritising team work"
    difficulty: medium
    text: "How do you decide what your team works on when everything is urgent?"
    expected_concepts:
      - "criteria"
      - "stakeholders"
      - "capacity"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes explicit criteria and respectful communication, with an example."
      good: "Gives relevant reasons and some concrete detail about prioritising team work, but links to the role stay general."
      weak: "Vague or generic answer on prioritising team work that could apply to any job."
    followups:
      - "What did you stop?"
      - "How do you say no?"
    common_errors:
      - "Saying yes to everything."

  - external_key: "recruiter_screening.motivation_leadership.tl_onboarding"
    competency_key: mentoring
    topic: "Onboarding engineers"
    difficulty: medium
    text: "What do you do to help a new engineer become productive on your team?"
    expected_concepts:
      - "plan"
      - "buddy"
      - "early tasks"
      - "documentation"
      - "check-ins"
      - "example"
    rubric:
      excellent: "Describes a clear plan and an example of a successful onboarding."
      good: "Gives relevant reasons and some concrete detail about onboarding engineers, but links to the role stay general."
      weak: "Vague or generic answer on onboarding engineers that could apply to any job."
    followups:
      - "What would you improve in your onboarding?"
      - "How do you measure it?"
    common_errors:
      - "Leaving them to figure it out."

  - external_key: "recruiter_screening.motivation_leadership.em_inclusion"
    competency_key: culture_values
    topic: "Fair practices"
    difficulty: medium
    text: "How do you make sure everyone on your team has an equal chance to be heard and to get good opportunities?"
    expected_concepts:
      - "meeting practices"
      - "task allocation"
      - "growth"
      - "fairness"
      - "example"
    rubric:
      excellent: "Describes concrete, job-related fairness practices with an example."
      good: "Gives relevant reasons and some concrete detail about fair practices, but links to the role stay general."
      weak: "Vague or generic answer on fair practices that could apply to any job."
    followups:
      - "How do you share stretch work?"
      - "How do you spot patterns?"
    common_errors:
      - "Abstract statements."

  - external_key: "recruiter_screening.motivation_leadership.tl_ambition"
    competency_key: motivation
    topic: "Technical ambition"
    difficulty: hard
    text: "Tell me about a time you proposed a significant technical change. What drove you to push for it and how did it turn out?"
    expected_concepts:
      - "reasons"
      - "evidence"
      - "persuasion"
      - "risk"
      - "result"
    rubric:
      excellent: "Describes the reasoning, how they gained support and the actual result."
      good: "Gives relevant reasons and some concrete detail about technical ambition, but links to the role stay general."
      weak: "Vague or generic answer on technical ambition that could apply to any job."
    followups:
      - "What did others say?"
      - "What would you do differently?"
    common_errors:
      - "Pushing change for its own sake."

  - external_key: "recruiter_screening.motivation_leadership.em_tough_call"
    competency_key: leadership
    topic: "Hard people decisions"
    difficulty: hard
    text: "Tell me about a difficult decision you made as a manager that affected people on your team. How did you handle it?"
    expected_concepts:
      - "situation"
      - "reasoning"
      - "communication"
      - "support"
      - "outcome"
    rubric:
      excellent: "Describes the decision, fair process and respectful communication."
      good: "Gives relevant reasons and some concrete detail about hard people decisions, but links to the role stay general."
      weak: "Vague or generic answer on hard people decisions that could apply to any job."
    followups:
      - "What would you change?"
      - "How did the team react?"
    common_errors:
      - "Passing blame upward."

  - external_key: "recruiter_screening.motivation_leadership.tl_failure"
    competency_key: motivation
    topic: "Learning from a failed decision"
    difficulty: hard
    text: "Tell me about a technical decision you led that turned out to be wrong. What did you do about it?"
    expected_concepts:
      - "situation"
      - "ownership"
      - "response"
      - "communication"
      - "learning"
    rubric:
      excellent: "Takes ownership of the decision, acts quickly and shares lessons."
      good: "Gives relevant reasons and some concrete detail about learning from a failed decision, but links to the role stay general."
      weak: "Vague or generic answer on learning from a failed decision that could apply to any job."
    followups:
      - "How did you tell the team?"
      - "What did you change?"
    common_errors:
      - "Defending the decision."

  - external_key: "recruiter_screening.motivation_leadership.tl_juniors"
    competency_key: mentoring
    topic: "Working with junior engineers"
    difficulty: easy
    text: "What do you enjoy about working with less experienced engineers, and what do you find hard?"
    expected_concepts:
      - "patience"
      - "teaching"
      - "examples"
      - "limits"
      - "reflection"
    rubric:
      excellent: "Gives examples of helping juniors grow and a thoughtful view of the limits."
      good: "Gives relevant reasons and some concrete detail about working with junior engineers, but links to the role stay general."
      weak: "Vague or generic answer on working with junior engineers that could apply to any job."
    followups:
      - "How do you balance help and independence?"
      - "What have they taught you?"
    common_errors:
      - "Doing the work for them."

  - external_key: "recruiter_screening.motivation_leadership.em_team_situation"
    competency_key: recruiter_fit
    topic: "Team needs"
    difficulty: easy
    text: "What kind of team situation would you most want to step into as a manager, and which would you find hardest?"
    expected_concepts:
      - "preferences"
      - "self-awareness"
      - "examples"
      - "flexibility"
    rubric:
      excellent: "Names situations with reasons and shows flexibility and preparation."
      good: "Gives relevant reasons and some concrete detail about team needs, but links to the role stay general."
      weak: "Vague or generic answer on team needs that could apply to any job."
    followups:
      - "What makes the hard one hard?"
      - "How would you prepare?"
    common_errors:
      - "Wanting an easy team."
