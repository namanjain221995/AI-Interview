version: 1
defaults:
  role_tags: [product_manager, project_manager, business_analyst, ux_designer, support_engineer]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_product_business.pm_why"
    competency_key: motivation
    topic: "Why product management"
    difficulty: easy
    text: "What pulled you toward product management, and what do you find most rewarding about it?"
    expected_concepts:
      - "origin"
      - "interest in problems and users"
      - "examples of products"
      - "realistic view"
    rubric:
      excellent: "Gives a clear origin, names the parts they find rewarding such as discovery and trade-offs, and backs it with a product example."
      good: "Gives relevant reasons and some concrete detail about why product management, but links to the role stay general."
      weak: "Vague or generic answer on why product management that could apply to any job."
    followups:
      - "Which product decision are you proudest of?"
      - "What do people misunderstand about the job?"
    common_errors:
      - "Describing the title rather than the work."

  - external_key: "recruiter_screening.motivation_product_business.proj_why"
    competency_key: motivation
    topic: "Why project management"
    difficulty: easy
    text: "Tell me how you came to project or delivery management and what keeps you in it."
    expected_concepts:
      - "path into delivery"
      - "interest in coordination and outcomes"
      - "examples"
      - "realistic view"
    rubric:
      excellent: "Explains a real path into delivery work and gives examples of outcomes they enjoyed driving."
      good: "Gives relevant reasons and some concrete detail about why project management, but links to the role stay general."
      weak: "Vague or generic answer on why project management that could apply to any job."
    followups:
      - "What was the first project you ran?"
      - "What part of delivery do you enjoy least?"
    common_errors:
      - "Describing status reporting as the whole job."

  - external_key: "recruiter_screening.motivation_product_business.ba_why"
    competency_key: motivation
    topic: "Why business analysis"
    difficulty: easy
    text: "What do you enjoy about business analysis, and how did you get into it?"
    expected_concepts:
      - "interest in understanding problems"
      - "requirements"
      - "examples"
      - "stakeholders"
    rubric:
      excellent: "Describes an interest in clarifying problems and gives an example where their analysis shaped a solution."
      good: "Gives relevant reasons and some concrete detail about why business analysis, but links to the role stay general."
      weak: "Vague or generic answer on why business analysis that could apply to any job."
    followups:
      - "What requirement are you proudest of getting right?"
      - "What do you find hardest?"
    common_errors:
      - "Seeing the role as documentation only."

  - external_key: "recruiter_screening.motivation_product_business.ux_why"
    competency_key: motivation
    topic: "Why UX design"
    difficulty: easy
    text: "What drew you to UX design, and what keeps you excited about it?"
    expected_concepts:
      - "origin"
      - "interest in users"
      - "craft"
      - "examples"
      - "realistic view"
    rubric:
      excellent: "Gives a clear origin and names parts of the craft they love, with a design example."
      good: "Gives relevant reasons and some concrete detail about why ux design, but links to the role stay general."
      weak: "Vague or generic answer on why ux design that could apply to any job."
    followups:
      - "Which design are you proudest of?"
      - "What part of the process do you like least?"
    common_errors:
      - "Talking about visuals only."

  - external_key: "recruiter_screening.motivation_product_business.support_why"
    competency_key: motivation
    topic: "Why technical support"
    difficulty: easy
    text: "What attracted you to technical support engineering?"
    expected_concepts:
      - "interest in solving problems for customers"
      - "technical depth"
      - "examples"
      - "career view"
    rubric:
      excellent: "Describes enjoying problem solving with customers and a satisfying example."
      good: "Gives relevant reasons and some concrete detail about why technical support, but links to the role stay general."
      weak: "Vague or generic answer on why technical support that could apply to any job."
    followups:
      - "What was your most satisfying case?"
      - "What do people misunderstand about support?"
    common_errors:
      - "Seeing support as a stepping stone only."

  - external_key: "recruiter_screening.motivation_product_business.pm_proud"
    competency_key: motivation
    topic: "Proud product"
    difficulty: easy
    text: "Tell me about a product or feature you helped ship that you are proud of. What was your part?"
    expected_concepts:
      - "problem"
      - "role"
      - "decisions"
      - "outcome"
      - "learning"
    rubric:
      excellent: "Describes the problem, their decisions and measurable outcomes."
      good: "Gives relevant reasons and some concrete detail about proud product, but links to the role stay general."
      weak: "Vague or generic answer on proud product that could apply to any job."
    followups:
      - "What did you decide not to build?"
      - "How did you know it worked?"
    common_errors:
      - "Taking credit for team results."

  - external_key: "recruiter_screening.motivation_product_business.proj_proud"
    competency_key: motivation
    topic: "Proud delivery"
    difficulty: easy
    text: "What is the project you delivered that you are most proud of?"
    expected_concepts:
      - "scope"
      - "challenges"
      - "their role"
      - "result"
      - "learning"
    rubric:
      excellent: "Describes scope, challenges, their specific role and the result."
      good: "Gives relevant reasons and some concrete detail about proud delivery, but links to the role stay general."
      weak: "Vague or generic answer on proud delivery that could apply to any job."
    followups:
      - "What nearly went wrong?"
      - "How did you keep everyone aligned?"
    common_errors:
      - "Listing activities without outcomes."

  - external_key: "recruiter_screening.motivation_product_business.ba_proud"
    competency_key: motivation
    topic: "Proud analysis work"
    difficulty: easy
    text: "Tell me about a piece of analysis or requirements work that changed the outcome of a project."
    expected_concepts:
      - "problem"
      - "method"
      - "stakeholders"
      - "effect"
      - "reflection"
    rubric:
      excellent: "Describes the problem, method and a concrete effect on the project."
      good: "Gives relevant reasons and some concrete detail about proud analysis work, but links to the role stay general."
      weak: "Vague or generic answer on proud analysis work that could apply to any job."
    followups:
      - "What did stakeholders disagree on?"
      - "How did you validate it?"
    common_errors:
      - "Describing documents rather than results."

  - external_key: "recruiter_screening.motivation_product_business.ux_proud"
    competency_key: motivation
    topic: "Proud design"
    difficulty: easy
    text: "Tell me about a design you worked on that made a difference to users. How did you know?"
    expected_concepts:
      - "problem"
      - "research"
      - "design decisions"
      - "evidence"
      - "collaboration"
    rubric:
      excellent: "Describes research, decisions and evidence of improvement for users."
      good: "Gives relevant reasons and some concrete detail about proud design, but links to the role stay general."
      weak: "Vague or generic answer on proud design that could apply to any job."
    followups:
      - "What did you get wrong at first?"
      - "How did you test it?"
    common_errors:
      - "Showing screens without evidence."

  - external_key: "recruiter_screening.motivation_product_business.support_proud"
    competency_key: motivation
    topic: "Proud customer case"
    difficulty: easy
    text: "Tell me about a customer case you solved that you are proud of."
    expected_concepts:
      - "problem"
      - "steps"
      - "collaboration with engineering"
      - "outcome"
      - "communication"
    rubric:
      excellent: "Describes methodical troubleshooting, communication with the customer and a lasting improvement."
      good: "Gives relevant reasons and some concrete detail about proud customer case, but links to the role stay general."
      weak: "Vague or generic answer on proud customer case that could apply to any job."
    followups:
      - "What made it hard?"
      - "What did you do afterwards so it would not happen again?"
    common_errors:
      - "Only describing the fix."

  - external_key: "recruiter_screening.motivation_product_business.pm_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "What does a good week look like for you as a product manager?"
    expected_concepts:
      - "activities such as customer calls, prioritisation and writing"
      - "collaboration"
      - "realistic view"
    rubric:
      excellent: "Gives a realistic mix of discovery, delivery work and collaboration."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "What are you least interested in doing?"
      - "How much is meetings?"
    common_errors:
      - "Describing only strategy."

  - external_key: "recruiter_screening.motivation_product_business.proj_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "Think of a week that went well in your delivery work. What happened in it?"
    expected_concepts:
      - "planning"
      - "removing blockers"
      - "stakeholder communication"
      - "delivery"
      - "realistic view"
    rubric:
      excellent: "Describes concrete delivery activities such as unblocking and communication."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "What would a tough week look like?"
      - "How do you spend your Mondays?"
    common_errors:
      - "Describing only meetings."

  - external_key: "recruiter_screening.motivation_product_business.ba_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "What does a satisfying week look like for you as a business analyst?"
    expected_concepts:
      - "workshops"
      - "analysis"
      - "documentation"
      - "stakeholder time"
      - "realistic view"
    rubric:
      excellent: "Gives a concrete mix of elicitation, analysis and follow-up."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "Which activity energises you most?"
      - "What is the least interesting part?"
    common_errors:
      - "Only documenting."

  - external_key: "recruiter_screening.motivation_product_business.ux_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "When you think of a week that went well in your UX work, what were you doing?"
    expected_concepts:
      - "research"
      - "design"
      - "critique"
      - "collaboration"
      - "realistic view"
    rubric:
      excellent: "Describes a balance of research, design and collaboration."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "How much of your time is with engineers?"
      - "What do you do when feedback is harsh?"
    common_errors:
      - "Only drawing screens."

  - external_key: "recruiter_screening.motivation_product_business.support_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "Picture a customer-support week that left you feeling it was well spent. What cases and tasks were in it?"
    expected_concepts:
      - "case handling"
      - "learning"
      - "documentation"
      - "collaboration"
      - "balance"
    rubric:
      excellent: "Describes realistic case handling alongside knowledge sharing."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "How do you handle a heavy queue?"
      - "What do you do on quiet days?"
    common_errors:
      - "Expecting no pressure."

  - external_key: "recruiter_screening.motivation_product_business.pm_customer"
    competency_key: motivation
    topic: "Talking to customers"
    difficulty: medium
    text: "How do you stay in touch with customers or users as a product manager, and what do you gain from it?"
    expected_concepts:
      - "discovery habits"
      - "interviews"
      - "data"
      - "examples"
      - "influence on decisions"
    rubric:
      excellent: "Describes regular habits and an example where customer input changed a decision."
      good: "Gives relevant reasons and some concrete detail about talking to customers, but links to the role stay general."
      weak: "Vague or generic answer on talking to customers that could apply to any job."
    followups:
      - "Tell me about a conversation that changed your mind."
      - "How often do you speak to them?"
    common_errors:
      - "Relying on dashboards only."

  - external_key: "recruiter_screening.motivation_product_business.proj_risk"
    competency_key: motivation
    topic: "Handling risk"
    difficulty: medium
    text: "What do you enjoy about managing risk in a project, and how do you do it day to day?"
    expected_concepts:
      - "risk register in practice"
      - "early signals"
      - "communication"
      - "examples"
    rubric:
      excellent: "Describes practical risk management with an example of acting early."
      good: "Gives relevant reasons and some concrete detail about handling risk, but links to the role stay general."
      weak: "Vague or generic answer on handling risk that could apply to any job."
    followups:
      - "Tell me about a risk you caught early."
      - "How do you decide what to escalate?"
    common_errors:
      - "Maintaining a register without acting on it."

  - external_key: "recruiter_screening.motivation_product_business.ba_stakeholders"
    competency_key: motivation
    topic: "Many stakeholders"
    difficulty: medium
    text: "Stakeholders often want different things. How do you feel about navigating that, and how do you do it?"
    expected_concepts:
      - "stakeholder analysis"
      - "facilitation"
      - "documenting decisions"
      - "examples"
    rubric:
      excellent: "Describes facilitation and an example of reaching an agreed outcome."
      good: "Gives relevant reasons and some concrete detail about many stakeholders, but links to the role stay general."
      weak: "Vague or generic answer on many stakeholders that could apply to any job."
    followups:
      - "Tell me about a conflict you resolved."
      - "How do you keep everyone informed?"
    common_errors:
      - "Choosing sides."

  - external_key: "recruiter_screening.motivation_product_business.ux_dev_collab"
    competency_key: motivation
    topic: "Working with engineers"
    difficulty: medium
    text: "How do you like to work with engineers on getting a design built well?"
    expected_concepts:
      - "early involvement"
      - "feasibility"
      - "design reviews"
      - "examples"
    rubric:
      excellent: "Describes close collaboration with an example of adjusting design for feasibility."
      good: "Gives relevant reasons and some concrete detail about working with engineers, but links to the role stay general."
      weak: "Vague or generic answer on working with engineers that could apply to any job."
    followups:
      - "How do you handle a design that cannot be built?"
      - "How do you review the build?"
    common_errors:
      - "Handing over files only."

  - external_key: "recruiter_screening.motivation_product_business.support_learning"
    competency_key: motivation
    topic: "Learning from cases"
    difficulty: medium
    text: "What do you do to turn each difficult case into something that helps the next one?"
    expected_concepts:
      - "knowledge base"
      - "root cause"
      - "feedback to engineering"
      - "examples"
    rubric:
      excellent: "Describes documenting and feeding patterns to engineering with an example."
      good: "Gives relevant reasons and some concrete detail about learning from cases, but links to the role stay general."
      weak: "Vague or generic answer on learning from cases that could apply to any job."
    followups:
      - "Tell me about an article that helped many."
      - "How do you report patterns?"
    common_errors:
      - "Closing cases and moving on."

  - external_key: "recruiter_screening.motivation_product_business.pm_tradeoff"
    competency_key: motivation
    topic: "Hard trade-offs"
    difficulty: medium
    text: "Product managers say no a lot. How do you feel about that, and how do you do it well?"
    expected_concepts:
      - "prioritisation"
      - "communication"
      - "evidence"
      - "relationships"
      - "example"
    rubric:
      excellent: "Describes principled prioritisation and communication, with an example."
      good: "Gives relevant reasons and some concrete detail about hard trade-offs, but links to the role stay general."
      weak: "Vague or generic answer on hard trade-offs that could apply to any job."
    followups:
      - "Tell me about a no that was right."
      - "What did you offer instead?"
    common_errors:
      - "Avoiding saying no."

  - external_key: "recruiter_screening.motivation_product_business.proj_pressure"
    competency_key: motivation
    topic: "Delivery under pressure"
    difficulty: medium
    text: "When a deadline is at risk, how do you respond, and what keeps you going?"
    expected_concepts:
      - "assessment"
      - "options"
      - "communication"
      - "scope trade-offs"
      - "example"
    rubric:
      excellent: "Describes assessing the situation, presenting options and a result."
      good: "Gives relevant reasons and some concrete detail about delivery under pressure, but links to the role stay general."
      weak: "Vague or generic answer on delivery under pressure that could apply to any job."
    followups:
      - "What options do you bring to sponsors?"
      - "What did you learn?"
    common_errors:
      - "Hiding the risk."

  - external_key: "recruiter_screening.motivation_product_business.ba_domain"
    competency_key: motivation
    topic: "Learning a domain"
    difficulty: medium
    text: "How do you get up to speed in an unfamiliar business domain, and why does that suit you?"
    expected_concepts:
      - "learning approach"
      - "interviewing"
      - "documentation"
      - "examples"
    rubric:
      excellent: "Describes a systematic approach with an example of ramping up quickly."
      good: "Gives relevant reasons and some concrete detail about learning a domain, but links to the role stay general."
      weak: "Vague or generic answer on learning a domain that could apply to any job."
    followups:
      - "How long did it take last time?"
      - "Who did you learn from?"
    common_errors:
      - "Assuming knowledge."

  - external_key: "recruiter_screening.motivation_product_business.ux_research_motivation"
    competency_key: motivation
    topic: "Evidence versus opinion"
    difficulty: hard
    text: "Tell me about a time the research contradicted a stakeholder's strong opinion about a design. What did you do?"
    expected_concepts:
      - "evidence"
      - "communication"
      - "relationship"
      - "compromise"
      - "result"
    rubric:
      excellent: "Describes presenting evidence respectfully and reaching a good outcome."
      good: "Gives relevant reasons and some concrete detail about evidence versus opinion, but links to the role stay general."
      weak: "Vague or generic answer on evidence versus opinion that could apply to any job."
    followups:
      - "How did you present the findings?"
      - "What if they insisted?"
    common_errors:
      - "Giving in or forcing."

  - external_key: "recruiter_screening.motivation_product_business.support_difficult"
    competency_key: motivation
    topic: "Difficult customer situations"
    difficulty: hard
    text: "Tell me about a difficult customer situation you handled and what you took from it."
    expected_concepts:
      - "situation"
      - "actions"
      - "communication"
      - "outcome"
      - "learning"
    rubric:
      excellent: "Describes clear communication, practical steps and lessons."
      good: "Gives relevant reasons and some concrete detail about difficult customer situations, but links to the role stay general."
      weak: "Vague or generic answer on difficult customer situations that could apply to any job."
    followups:
      - "What did you do to keep the relationship?"
      - "What would you do differently?"
    common_errors:
      - "Blaming the customer."
