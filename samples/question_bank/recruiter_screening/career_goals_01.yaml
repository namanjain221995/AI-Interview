# Curated questions: recruiter screening, career goals (01 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.career_goals.five_year_direction
    competency_key: motivation
    topic: "Five-year direction"
    difficulty: easy
    text: "Where would you like your career to be in about five years, and what kind of work do you want to be doing then?"
    expected_concepts:
      - "clear direction"
      - "link to current experience"
      - "realistic steps"
      - "flexibility"
    rubric:
      excellent: "Describes a specific direction, explains how experience so far leads there and names concrete next steps."
      good: "Gives a reasonable direction with some reasoning."
      weak: "Vague or purely title-focused with no steps."
    followups:
      - "What would be the first step toward that?"
      - "How has this goal changed over the years?"
    common_errors:
      - "Vague or purely title-focused with no steps."

  - external_key: recruiter_screening.career_goals.skill_next
    competency_key: motivation
    topic: "Skill to learn next"
    difficulty: easy
    text: "What is the one skill you most want to build over the next year, and why that one?"
    expected_concepts:
      - "specific skill"
      - "reason tied to work"
      - "learning plan"
      - "evidence of past learning"
    rubric:
      excellent: "Names a specific skill, ties it to real work needs and describes how they will build it."
      good: "Names a skill with a plausible reason."
      weak: "Names a buzzword with no plan or reason."
    followups:
      - "How will you practise it?"
      - "Where have you started already?"
    common_errors:
      - "Names a buzzword with no plan or reason."

  - external_key: recruiter_screening.career_goals.ic_or_manager
    competency_key: motivation
    topic: "Specialist or people lead"
    difficulty: easy
    text: "Some people want to deepen their craft while others want to lead people. Which pull do you feel more, and what drives that?"
    expected_concepts:
      - "self-awareness"
      - "examples from experience"
      - "understanding of both paths"
      - "openness"
    rubric:
      excellent: "Reflects on concrete experiences that shaped the preference and shows respect for the other path."
      good: "Gives a clear preference with brief reasons."
      weak: "Picks one with no reasoning or dismisses the other."
    followups:
      - "What experience pushed you that way?"
      - "Would you want a taste of the other path?"
    common_errors:
      - "Picks one with no reasoning or dismisses the other."

  - external_key: recruiter_screening.career_goals.past_career_decision
    competency_key: motivation
    topic: "A deliberate career move"
    difficulty: medium
    text: "Tell me about a career decision you made on purpose, such as changing teams or technologies. How did you decide?"
    expected_concepts:
      - "decision criteria"
      - "options weighed"
      - "outcome"
      - "reflection"
    rubric:
      excellent: "Explains the options and criteria, owns the result and states what was learned."
      good: "Describes the decision and the outcome."
      weak: "Describes events without any decision process."
    followups:
      - "What would you do differently?"
      - "Who did you consult?"
    common_errors:
      - "Describes events without any decision process."

  - external_key: recruiter_screening.career_goals.what_makes_a_great_next_role
    competency_key: motivation
    topic: "Ingredients of a good next role"
    difficulty: easy
    text: "When you picture a great next role, what three ingredients would it have?"
    expected_concepts:
      - "clear priorities"
      - "job-related factors"
      - "match to this role"
      - "self-knowledge"
    rubric:
      excellent: "Names concrete job-related ingredients and shows how this role provides them."
      good: "Lists sensible priorities."
      weak: "Lists generic perks or nothing job-related."
    followups:
      - "Which of the three matters most?"
      - "Which does this role offer?"
    common_errors:
      - "Lists generic perks or nothing job-related."

  - external_key: recruiter_screening.career_goals.learning_habits
    competency_key: motivation
    topic: "How you keep learning"
    difficulty: easy
    text: "How do you usually keep your skills current while working full time?"
    expected_concepts:
      - "regular habits"
      - "varied sources"
      - "applying what is learned"
      - "specific recent example"
    rubric:
      excellent: "Describes sustainable habits and a recent example where learning changed their work."
      good: "Mentions a few sources and some habits."
      weak: "Says they learn on the job with no examples."
    followups:
      - "What did you learn most recently?"
      - "How do you decide what is worth learning?"
    common_errors:
      - "Says they learn on the job with no examples."

  - external_key: recruiter_screening.career_goals.proud_growth_moment
    competency_key: motivation
    topic: "Biggest growth moment"
    difficulty: easy
    text: "Think of a time when you grew a lot professionally. What happened and what changed in you?"
    expected_concepts:
      - "specific situation"
      - "challenge"
      - "change in skill or approach"
      - "evidence"
    rubric:
      excellent: "Tells a specific story with a clear before and after in how they work."
      good: "Gives a decent example with some reflection."
      weak: "Stays abstract or cannot name a change."
    followups:
      - "What triggered it?"
      - "How do you use it now?"
    common_errors:
      - "Stays abstract or cannot name a change."

  - external_key: recruiter_screening.career_goals.stretch_assignment
    competency_key: motivation
    topic: "Stretch assignment"
    difficulty: medium
    text: "Describe a task that was beyond your comfort level when you took it. Why did you take it and how did it go?"
    expected_concepts:
      - "motivation to stretch"
      - "support sought"
      - "handling uncertainty"
      - "outcome"
    rubric:
      excellent: "Explains why they took the risk, how they closed gaps and what the result taught them."
      good: "Describes the assignment and an acceptable outcome."
      weak: "Describes only routine work."
    followups:
      - "How did you ask for help?"
      - "Would you take it again?"
    common_errors:
      - "Describes only routine work."

  - external_key: recruiter_screening.career_goals.success_year_one
    competency_key: motivation
    topic: "A good first year"
    difficulty: easy
    text: "If you joined us, what would make your first year feel successful to you?"
    expected_concepts:
      - "concrete outcomes"
      - "learning goals"
      - "team contribution"
      - "realism"
    rubric:
      excellent: "Names concrete contributions and learning goals that fit the role and are realistic."
      good: "Gives sensible but general goals."
      weak: "Gives only personal perks or vague hopes."
    followups:
      - "How would you measure that?"
      - "What would you need from us?"
    common_errors:
      - "Gives only personal perks or vague hopes."

  - external_key: recruiter_screening.career_goals.specialise_or_broad
    competency_key: motivation
    topic: "Depth versus breadth"
    difficulty: medium
    text: "Do you see yourself going deeper in one area or growing broader across areas? What shaped that view?"
    expected_concepts:
      - "self-awareness"
      - "examples"
      - "trade-offs"
      - "fit to role"
    rubric:
      excellent: "Gives a reasoned view with examples and notes trade-offs for the team."
      good: "States a preference with some reasoning."
      weak: "Declines to choose or gives a slogan."
    followups:
      - "What would depth cost you?"
      - "Where have you been broad?"
    common_errors:
      - "Declines to choose or gives a slogan."

  - external_key: recruiter_screening.career_goals.feedback_for_growth
    competency_key: communication
    topic: "Using feedback to grow"
    difficulty: easy
    text: "What is a piece of feedback that changed how you work, and what did you do with it?"
    expected_concepts:
      - "specific feedback"
      - "response"
      - "behaviour change"
      - "follow-up"
    rubric:
      excellent: "Names concrete feedback, the actions taken and the visible change afterward."
      good: "Describes feedback and a general response."
      weak: "Cannot recall any, or only blames the giver."
    followups:
      - "Who gave it?"
      - "How did you check it worked?"
    common_errors:
      - "Cannot recall any, or only blames the giver."

  - external_key: recruiter_screening.career_goals.mentor_role_in_growth
    competency_key: collaboration
    topic: "Mentors and growth"
    difficulty: easy
    text: "Has anyone helped you grow in your career, and what did you learn from working with them?"
    expected_concepts:
      - "specific person or role"
      - "concrete lesson"
      - "how they sought it"
      - "paying it forward"
    rubric:
      excellent: "Describes a specific mentoring relationship, the lessons and how they pass it on."
      good: "Mentions a helpful person and a lesson."
      weak: "Gives no example or credits no one."
    followups:
      - "How did that relationship start?"
      - "What do you pass on now?"
    common_errors:
      - "Gives no example or credits no one."

  - external_key: recruiter_screening.career_goals.certifications_view
    competency_key: motivation
    topic: "Certifications and courses"
    difficulty: easy
    text: "How do you decide whether a course or certification is worth your time?"
    expected_concepts:
      - "criteria"
      - "link to goals"
      - "practical application"
      - "examples"
    rubric:
      excellent: "Uses clear criteria tied to goals and shows how learning gets applied."
      good: "Gives a reasonable view with an example."
      weak: "Treats credentials as an end in themselves."
    followups:
      - "Which one helped you most?"
      - "Which did you skip and why?"
    common_errors:
      - "Treats credentials as an end in themselves."

  - external_key: recruiter_screening.career_goals.long_term_projects
    competency_key: motivation
    topic: "Kind of problems you enjoy"
    difficulty: medium
    text: "What kind of problems do you want to spend the next few years solving?"
    expected_concepts:
      - "specific problem types"
      - "link to experience"
      - "fit to the company's work"
      - "curiosity"
    rubric:
      excellent: "Describes problem types concretely using past examples and links them to this job's work."
      good: "Names some problem areas of interest."
      weak: "Gives vague answers like challenging problems."
    followups:
      - "Which past project showed that?"
      - "Where does this role overlap?"
    common_errors:
      - "Gives vague answers like challenging problems."

  - external_key: recruiter_screening.career_goals.career_goal_missed
    competency_key: motivation
    topic: "A goal that did not work out"
    difficulty: hard
    text: "Tell me about a career goal you set that you did not achieve. What happened and what did you take from it?"
    expected_concepts:
      - "specific goal"
      - "reasons"
      - "adaptation"
      - "lasting lesson"
    rubric:
      excellent: "Owns the shortfall, explains the causes and shows how it changed their plans."
      good: "Describes the miss and some learning."
      weak: "Blames circumstances or claims never to miss."
    followups:
      - "Would you set it again?"
      - "What did you change afterward?"
    common_errors:
      - "Blames circumstances or claims never to miss."

  - external_key: recruiter_screening.career_goals.growth_vs_stability
    competency_key: motivation
    topic: "Growth and steady work"
    difficulty: medium
    text: "How do you balance taking on new challenges with delivering reliably in your current work?"
    expected_concepts:
      - "prioritisation"
      - "communication with manager"
      - "examples"
      - "limits"
    rubric:
      excellent: "Describes a clear approach with examples of balancing the two and communicating trade-offs."
      good: "Gives a sensible but general balance."
      weak: "Says they always take on everything."
    followups:
      - "When did you say no?"
      - "How do you spot overload?"
    common_errors:
      - "Says they always take on everything."

  - external_key: recruiter_screening.career_goals.ownership_scope_growth
    competency_key: ownership
    topic: "Growing your ownership"
    difficulty: medium
    text: "How have you expanded the scope of what you own over time, and how would you like it to grow next?"
    expected_concepts:
      - "examples of expanding scope"
      - "initiative"
      - "trust building"
      - "future scope"
    rubric:
      excellent: "Shows a history of taking on more with concrete examples and a realistic next step."
      good: "Gives some examples of broader scope."
      weak: "Describes tasks assigned by others only."
    followups:
      - "How did you earn that trust?"
      - "What would you take on next here?"
    common_errors:
      - "Describes tasks assigned by others only."

  - external_key: recruiter_screening.career_goals.domain_switch
    competency_key: adaptability
    topic: "Changing domain"
    difficulty: medium
    text: "Have you moved into a new technology or domain before? How did you get up to speed?"
    expected_concepts:
      - "learning method"
      - "time to productivity"
      - "support used"
      - "outcome"
    rubric:
      excellent: "Describes a structured ramp-up, tangible results and reflection on what helped."
      good: "Describes the switch and a general approach."
      weak: "Has no example or says it is easy."
    followups:
      - "What was hardest?"
      - "What would you tell someone doing it now?"
    common_errors:
      - "Has no example or says it is easy."

  - external_key: recruiter_screening.career_goals.senior_meaning
    competency_key: motivation
    topic: "What seniority means"
    difficulty: medium
    text: "In your view, what separates a senior person from a mid-level one in your field?"
    expected_concepts:
      - "clear criteria"
      - "examples from observation"
      - "self-assessment"
      - "impact beyond tasks"
    rubric:
      excellent: "Gives criteria beyond years of experience, with examples, and assesses their own position candidly."
      good: "Offers reasonable criteria."
      weak: "Equates seniority with tenure or title."
    followups:
      - "Where are you on that scale?"
      - "Who showed you that?"
    common_errors:
      - "Equates seniority with tenure or title."

  - external_key: recruiter_screening.career_goals.teaching_others
    competency_key: collaboration
    topic: "Sharing knowledge"
    difficulty: easy
    text: "How do you like to share what you know with colleagues, and what has worked?"
    expected_concepts:
      - "methods"
      - "audience awareness"
      - "example"
      - "impact"
    rubric:
      excellent: "Gives specific methods, an example and its effect on the team."
      good: "Mentions some sharing activities."
      weak: "Says they rarely share or give no example."
    followups:
      - "What would you like to try?"
      - "How do you handle questions?"
    common_errors:
      - "Says they rarely share or give no example."

  - external_key: recruiter_screening.career_goals.community_involvement
    competency_key: motivation
    topic: "Learning outside work"
    difficulty: easy
    text: "Do you take part in any communities, side projects or writing related to your field? What do you get from it?"
    expected_concepts:
      - "specific activities"
      - "benefits"
      - "relevance"
      - "no obligation implied"
    rubric:
      excellent: "Describes an activity with clear benefits and links it to work, without implying it is required."
      good: "Mentions something with some benefit."
      weak: "Mentions nothing and has no other learning route."
    followups:
      - "What did you build or learn?"
      - "How does it help your job?"
    common_errors:
      - "Mentions nothing and has no other learning route."

  - external_key: recruiter_screening.career_goals.goal_setting_method
    competency_key: ownership
    topic: "How you set goals"
    difficulty: medium
    text: "What routine do you use to turn a career aspiration into monthly steps you can check?"
    expected_concepts:
      - "method"
      - "measurable steps"
      - "review cadence"
      - "adjustment"
    rubric:
      excellent: "Describes a clear routine with measurable steps and examples of adjusting goals."
      good: "Describes a general approach."
      weak: "Has no method."
    followups:
      - "Give me an example goal"
      - "When did you drop a goal?"
    common_errors:
      - "Has no method."

  - external_key: recruiter_screening.career_goals.what_would_make_you_leave_role_early
    competency_key: recruiter_fit
    topic: "Signals a role is not working"
    difficulty: hard
    text: "What would tell you, within a few months, that a role was not the right growth path for you? What would you do about it?"
    expected_concepts:
      - "early signals"
      - "proactive conversation"
      - "constructive action"
      - "self-awareness"
    rubric:
      excellent: "Names job-related signals, describes talking to the manager early and trying fixes first."
      good: "Names some signals and a sensible response."
      weak: "Would simply leave or blames others."
    followups:
      - "How would you raise it?"
      - "What have you done in the past?"
    common_errors:
      - "Would simply leave or blames others."

  - external_key: recruiter_screening.career_goals.advice_to_younger_self
    competency_key: motivation
    topic: "Looking back"
    difficulty: easy
    text: "Looking back at your career so far, what is one thing you would do differently, and what did it teach you?"
    expected_concepts:
      - "reflection"
      - "specific example"
      - "constructive lesson"
      - "forward application"
    rubric:
      excellent: "Names a specific choice, the lesson and how it shapes decisions now."
      good: "Gives a modest example with some reflection."
      weak: "Claims no regrets or gives a trivial answer."
    followups:
      - "How does that affect your choices now?"
      - "What went well that you would repeat?"
    common_errors:
      - "Claims no regrets or gives a trivial answer."

  - external_key: recruiter_screening.career_goals.working_toward_expertise_example
    competency_key: motivation
    topic: "Deliberate practice"
    difficulty: easy
    text: "Tell me about a skill you deliberately practised over time. How did you structure that practice?"
    expected_concepts:
      - "specific skill"
      - "practice routine"
      - "feedback"
      - "measurable progress"
    rubric:
      excellent: "Describes a routine with feedback loops and measurable progress over time."
      good: "Describes practising with some structure."
      weak: "Describes casual exposure only."
    followups:
      - "How long did it take?"
      - "How did you track progress?"
    common_errors:
      - "Describes casual exposure only."
