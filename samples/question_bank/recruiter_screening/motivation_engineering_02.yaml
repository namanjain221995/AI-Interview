version: 1
defaults:
  role_tags: [backend, frontend, fullstack, mobile, qa]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_engineering.be_team_size"
    competency_key: recruiter_fit
    topic: "Team and company stage"
    difficulty: easy
    text: "What kind of engineering team and stage of company help you do your best backend work?"
    expected_concepts:
      - "self-knowledge about environment"
      - "examples from past teams"
      - "fit with this team"
    rubric:
      excellent: "Describes a working environment with examples from past teams and shows how this role's setting matches it."
      good: "Gives relevant reasons and some concrete detail about team and company stage, but links to the role stay general."
      weak: "Vague or generic answer on team and company stage that could apply to any job."
    followups:
      - "What did you like about the best team you worked on?"
      - "What would you want to learn about our team?"
    common_errors:
      - "Naming an ideal that is unrelated to the actual team."

  - external_key: "recruiter_screening.motivation_engineering.fe_design_collab"
    competency_key: motivation
    topic: "Working with designers"
    difficulty: easy
    text: "How do you enjoy working with designers and product managers as a frontend engineer?"
    expected_concepts:
      - "collaboration habits"
      - "handling handoff"
      - "examples of improving a design together"
    rubric:
      excellent: "Gives an example of collaborating on a design, including constructive feedback about feasibility, and shows they value the partnership."
      good: "Gives relevant reasons and some concrete detail about working with designers, but links to the role stay general."
      weak: "Vague or generic answer on working with designers that could apply to any job."
    followups:
      - "Tell me about a design you pushed back on and why."
      - "How do you handle a design that is hard to build?"
    common_errors:
      - "Treating design as a spec to implement without discussion."

  - external_key: "recruiter_screening.motivation_engineering.fs_greenfield_legacy"
    competency_key: motivation
    topic: "New builds versus existing systems"
    difficulty: easy
    text: "Do you prefer starting something new or improving an existing system, and what has shaped that preference?"
    expected_concepts:
      - "clear preference with reasons"
      - "value in both"
      - "experience of each"
    rubric:
      excellent: "Offers a clear preference with examples from both kinds of work and shows respect for the value of maintenance."
      good: "Gives relevant reasons and some concrete detail about new builds versus existing systems, but links to the role stay general."
      weak: "Vague or generic answer on new builds versus existing systems that could apply to any job."
    followups:
      - "What did you learn from maintaining a system you did not write?"
      - "Which would you rather do in this role?"
    common_errors:
      - "Dismissing maintenance work as less valuable."

  - external_key: "recruiter_screening.motivation_engineering.mob_release_cycle"
    competency_key: recruiter_fit
    topic: "Mobile release rhythm"
    difficulty: easy
    text: "Mobile releases go through store reviews and staged rollouts. How do you feel about that rhythm compared with continuous deployment on the web?"
    expected_concepts:
      - "comfort with review cycles"
      - "planning around releases"
      - "feature flags and rollouts"
      - "patience and quality focus"
    rubric:
      excellent: "Shows they plan ahead for the release process, mention flags or staged rollouts, and have no frustration with the constraint they cannot explain."
      good: "Gives relevant reasons and some concrete detail about mobile release rhythm, but links to the role stay general."
      weak: "Vague or generic answer on mobile release rhythm that could apply to any job."
    followups:
      - "How do you plan work around a release train?"
      - "What do you do when a bug reaches production?"
    common_errors:
      - "Complaining about release constraints without describing how they work with them."

  - external_key: "recruiter_screening.motivation_engineering.qa_defect_find"
    competency_key: motivation
    topic: "What drives them in testing"
    difficulty: easy
    text: "What do you enjoy most about finding problems before customers do?"
    expected_concepts:
      - "curiosity and attention to detail"
      - "risk thinking"
      - "examples of finding hard defects"
    rubric:
      excellent: "Shows genuine curiosity with a concrete hard-to-find example and links it to protecting users."
      good: "Gives relevant reasons and some concrete detail about what drives them in testing, but links to the role stay general."
      weak: "Vague or generic answer on what drives them in testing that could apply to any job."
    followups:
      - "Tell me about the trickiest bug you found."
      - "How do you decide where to look first?"
    common_errors:
      - "Describing bug counts instead of risk reduction."

  - external_key: "recruiter_screening.motivation_engineering.be_scale_interest"
    competency_key: motivation
    topic: "Appeal of scale"
    difficulty: easy
    text: "Is working on systems with heavy traffic or large data volumes something you want, or do you prefer other kinds of backend problems?"
    expected_concepts:
      - "clear preference"
      - "related experience"
      - "learning appetite"
      - "understanding of what scale demands"
    rubric:
      excellent: "Gives a clear and specific preference supported by experience and shows understanding of what scale demands."
      good: "Gives relevant reasons and some concrete detail about appeal of scale, but links to the role stay general."
      weak: "Vague or generic answer on appeal of scale that could apply to any job."
    followups:
      - "What is the largest load you have worked with?"
      - "How did you learn what you know about performance?"
    common_errors:
      - "Claiming a love of scale without any related experience."

  - external_key: "recruiter_screening.motivation_engineering.fe_perf_interest"
    competency_key: motivation
    topic: "Interest in performance"
    difficulty: easy
    text: "Does making a site fast and accessible interest you, or do you see it as a chore? Tell me where you stand."
    expected_concepts:
      - "view of performance and accessibility as part of the job"
      - "examples"
      - "tools used"
    rubric:
      excellent: "Treats performance and accessibility as core work with a real example and measurable results."
      good: "Gives relevant reasons and some concrete detail about interest in performance, but links to the role stay general."
      weak: "Vague or generic answer on interest in performance that could apply to any job."
    followups:
      - "What is one concrete improvement you made?"
      - "How do you convince a team to prioritise it?"
    common_errors:
      - "Saying it matters without any example."

  - external_key: "recruiter_screening.motivation_engineering.fs_startup_pace"
    competency_key: recruiter_fit
    topic: "Pace and ambiguity"
    difficulty: easy
    text: "This role sometimes moves quickly with changing requirements. What parts of that pace do you enjoy, and what do you do to keep quality up?"
    expected_concepts:
      - "comfort with ambiguity"
      - "ways of keeping quality"
      - "examples of changing requirements"
      - "communication"
    rubric:
      excellent: "Gives an example of changing requirements, explains the habits that protect quality, and shows they communicate risks early."
      good: "Gives relevant reasons and some concrete detail about pace and ambiguity, but links to the role stay general."
      weak: "Vague or generic answer on pace and ambiguity that could apply to any job."
    followups:
      - "When did you have to throw work away?"
      - "How do you flag risks early?"
    common_errors:
      - "Equating speed with skipping tests."

  - external_key: "recruiter_screening.motivation_engineering.mob_user_stories"
    competency_key: motivation
    topic: "Learning from users"
    difficulty: easy
    text: "How do you find out whether a mobile feature really helped users?"
    expected_concepts:
      - "analytics and crash data"
      - "reviews and feedback"
      - "experiments"
      - "follow-up decisions"
    rubric:
      excellent: "Names the signals they use, gives an example where the data changed a decision, and connects it to caring about users."
      good: "Gives relevant reasons and some concrete detail about learning from users, but links to the role stay general."
      weak: "Vague or generic answer on learning from users that could apply to any job."
    followups:
      - "What metric would you look at first for a new feature?"
      - "Tell me about a feature you removed."
    common_errors:
      - "Counting downloads only."

  - external_key: "recruiter_screening.motivation_engineering.qa_why_here"
    competency_key: recruiter_fit
    topic: "Why this QA role"
    difficulty: easy
    text: "What about this quality role stood out to you compared with other roles you could take?"
    expected_concepts:
      - "specific knowledge of the role and product"
      - "scope and tools of interest"
      - "fit with strengths"
    rubric:
      excellent: "Cites specific aspects of the posting and product and explains why they match their strengths."
      good: "Gives relevant reasons and some concrete detail about why this qa role, but links to the role stay general."
      weak: "Vague or generic answer on why this qa role that could apply to any job."
    followups:
      - "What would you want to change or build first?"
      - "What did you find out about our product?"
    common_errors:
      - "Giving a generic reason that fits any QA job."

  - external_key: "recruiter_screening.motivation_engineering.be_ownership_prod"
    competency_key: motivation
    topic: "Production responsibility"
    difficulty: easy
    text: "How do you feel about owning the services you build in production, including being the one who investigates when something breaks?"
    expected_concepts:
      - "ownership mindset"
      - "on-call experience"
      - "learning from incidents"
      - "support systems"
    rubric:
      excellent: "Shows clear ownership, gives an example of handling production issues, and describes what makes on-call sustainable."
      good: "Gives relevant reasons and some concrete detail about production responsibility, but links to the role stay general."
      weak: "Vague or generic answer on production responsibility that could apply to any job."
    followups:
      - "Tell me about the most memorable incident you handled."
      - "What makes on-call sustainable for you?"
    common_errors:
      - "Treating production support as someone else's job."

  - external_key: "recruiter_screening.motivation_engineering.fe_framework_view"
    competency_key: recruiter_fit
    topic: "Tooling flexibility"
    difficulty: easy
    text: "Our frontend stack may differ from what you use today. How do you approach working in a framework you have not used much?"
    expected_concepts:
      - "learning approach"
      - "transferable fundamentals"
      - "examples of switching tools"
      - "asking for help"
    rubric:
      excellent: "Describes a systematic approach grounded in fundamentals and cites a real switch of tools."
      good: "Gives relevant reasons and some concrete detail about tooling flexibility, but links to the role stay general."
      weak: "Vague or generic answer on tooling flexibility that could apply to any job."
    followups:
      - "Which framework did you pick up fastest?"
      - "What would you do in your first two weeks?"
    common_errors:
      - "Insisting on their preferred framework."

  - external_key: "recruiter_screening.motivation_engineering.fs_remote_collab"
    competency_key: recruiter_fit
    topic: "Collaboration setup"
    difficulty: easy
    text: "How do you like to collaborate with teammates on a feature that crosses frontend, backend and design?"
    expected_concepts:
      - "communication habits"
      - "handoffs"
      - "code review"
      - "tools"
      - "clarity of ownership"
    rubric:
      excellent: "Describes specific habits such as design reviews, API contracts and early demos, with an example."
      good: "Gives relevant reasons and some concrete detail about collaboration setup, but links to the role stay general."
      weak: "Vague or generic answer on collaboration setup that could apply to any job."
    followups:
      - "What works well in async collaboration?"
      - "How do you handle blocked dependencies?"
    common_errors:
      - "Giving only abstract statements about teamwork."

  - external_key: "recruiter_screening.motivation_engineering.mob_cross_platform"
    competency_key: motivation
    topic: "Cross-platform trade-offs"
    difficulty: medium
    text: "Some teams want one codebase and others want fully native apps. Which environment do you enjoy more, and what has your experience taught you?"
    expected_concepts:
      - "preference with reasons"
      - "trade-offs"
      - "hands-on experience"
      - "fit with this team"
    rubric:
      excellent: "Gives a balanced view based on real projects and is ready to work in the team's chosen approach."
      good: "Gives relevant reasons and some concrete detail about cross-platform trade-offs, but links to the role stay general."
      weak: "Vague or generic answer on cross-platform trade-offs that could apply to any job."
    followups:
      - "When did the approach you preferred cause problems?"
      - "How would you adapt here?"
    common_errors:
      - "Declaring one approach always right."

  - external_key: "recruiter_screening.motivation_engineering.qa_quality_ownership"
    competency_key: motivation
    topic: "Shared quality ownership"
    difficulty: medium
    text: "In some teams quality belongs to everyone, and in others to a QA group. Which have you worked in, and what did you like or dislike about it?"
    expected_concepts:
      - "experience in both models"
      - "view on shared ownership"
      - "coaching developers"
      - "accountability"
    rubric:
      excellent: "Compares two models from experience, explains where a specialist adds value, and shows a coaching mindset."
      good: "Gives relevant reasons and some concrete detail about shared quality ownership, but links to the role stay general."
      weak: "Vague or generic answer on shared quality ownership that could apply to any job."
    followups:
      - "How do you help developers write better tests?"
      - "Where does a QA specialist add the most value?"
    common_errors:
      - "Taking an adversarial view of developers."

  - external_key: "recruiter_screening.motivation_engineering.be_tech_depth"
    competency_key: motivation
    topic: "Depth in backend topics"
    difficulty: medium
    text: "Which backend topics do you most want to go deeper on, such as databases, distributed systems or performance, and how are you pursuing them?"
    expected_concepts:
      - "specific topic with reasons"
      - "steps already taken"
      - "link to role"
      - "realistic learning plan"
    rubric:
      excellent: "Picks specific topics, shows progress already made, and connects to opportunities in this role."
      good: "Gives relevant reasons and some concrete detail about depth in backend topics, but links to the role stay general."
      weak: "Vague or generic answer on depth in backend topics that could apply to any job."
    followups:
      - "What have you built to practise that?"
      - "How would this job give you a chance to grow there?"
    common_errors:
      - "Listing buzzwords without any learning actions."

  - external_key: "recruiter_screening.motivation_engineering.fe_ownership_ui"
    competency_key: motivation
    topic: "Owning a UI area"
    difficulty: medium
    text: "Would you rather own a small area of the product end to end or contribute across many areas? What has your experience shown you?"
    expected_concepts:
      - "preference with reasons"
      - "examples of each"
      - "impact on quality"
      - "teamwork"
    rubric:
      excellent: "Gives examples of owning a component or feature and reflects on trade-offs between depth and breadth."
      good: "Gives relevant reasons and some concrete detail about owning a ui area, but links to the role stay general."
      weak: "Vague or generic answer on owning a ui area that could apply to any job."
    followups:
      - "What did you learn from owning something?"
      - "How would you handle handing it over?"
    common_errors:
      - "Avoiding any example of responsibility."

  - external_key: "recruiter_screening.motivation_engineering.fs_product_mindset"
    competency_key: motivation
    topic: "Product thinking"
    difficulty: medium
    text: "How much do you want to be involved in deciding what to build, versus how to build it?"
    expected_concepts:
      - "appetite for product involvement"
      - "examples of influencing scope"
      - "respect for product roles"
      - "communication"
    rubric:
      excellent: "Shows involvement in decisions with an example of shaping scope and respect for product ownership."
      good: "Gives relevant reasons and some concrete detail about product thinking, but links to the role stay general."
      weak: "Vague or generic answer on product thinking that could apply to any job."
    followups:
      - "Tell me about a time you changed the scope of a feature."
      - "How do you disagree with a product decision?"
    common_errors:
      - "Wanting to override product decisions."

  - external_key: "recruiter_screening.motivation_engineering.mob_perf_pride"
    competency_key: motivation
    topic: "Performance craft"
    difficulty: medium
    text: "Tell me about a time you made an app noticeably faster, smaller or more reliable. What motivated you to dig in?"
    expected_concepts:
      - "trigger for work"
      - "method and tools"
      - "measurable result"
      - "sustained interest"
    rubric:
      excellent: "Describes how they found the problem, the measured outcome, and why it mattered to them."
      good: "Gives relevant reasons and some concrete detail about performance craft, but links to the role stay general."
      weak: "Vague or generic answer on performance craft that could apply to any job."
    followups:
      - "Who noticed the improvement?"
      - "What did you try that did not help?"
    common_errors:
      - "Claiming an improvement without measurements."

  - external_key: "recruiter_screening.motivation_engineering.qa_tool_choice"
    competency_key: motivation
    topic: "Tools and craft"
    difficulty: medium
    text: "What kinds of tools or frameworks do you like building quality work with, and what draws you to them?"
    expected_concepts:
      - "specific tools"
      - "reasons for preferences"
      - "ability to adapt"
      - "examples of building frameworks"
    rubric:
      excellent: "Names tools and explains why they use them, with an example of building or improving an automation suite."
      good: "Gives relevant reasons and some concrete detail about tools and craft, but links to the role stay general."
      weak: "Vague or generic answer on tools and craft that could apply to any job."
    followups:
      - "How did you decide what to automate?"
      - "What would you change in a test suite you inherited?"
    common_errors:
      - "Listing tools with no reasoning."

  - external_key: "recruiter_screening.motivation_engineering.be_mentoring_interest"
    competency_key: motivation
    topic: "Sharing knowledge"
    difficulty: medium
    text: "How interested are you in mentoring or reviewing others' work, and what has that looked like for you so far?"
    expected_concepts:
      - "examples of code review and mentoring"
      - "style"
      - "learning from others"
      - "interest in growth"
    rubric:
      excellent: "Gives real examples of reviews or mentoring with a constructive approach."
      good: "Gives relevant reasons and some concrete detail about sharing knowledge, but links to the role stay general."
      weak: "Vague or generic answer on sharing knowledge that could apply to any job."
    followups:
      - "What makes a review comment helpful?"
      - "What did a mentor do for you?"
    common_errors:
      - "Describing reviews as a way to find errors only."

  - external_key: "recruiter_screening.motivation_engineering.fe_career_stage"
    competency_key: motivation
    topic: "Direction in frontend"
    difficulty: hard
    text: "There are different ways a frontend engineer can grow, for example deeper technical specialism, design-system leadership or moving towards product work. Which direction pulls you and how have you tested that?"
    expected_concepts:
      - "self-awareness"
      - "actions to test options"
      - "link with role"
      - "realistic plan"
    rubric:
      excellent: "Names a direction, shows how they tested the interest with real work, and ties their plan to this role."
      good: "Gives relevant reasons and some concrete detail about direction in frontend, but links to the role stay general."
      weak: "Vague or generic answer on direction in frontend that could apply to any job."
    followups:
      - "What is one experiment you tried to find out?"
      - "What would make you change direction?"
    common_errors:
      - "Saying they want everything."

  - external_key: "recruiter_screening.motivation_engineering.fs_trade_motivation"
    competency_key: motivation
    topic: "Craft versus speed"
    difficulty: hard
    text: "Tell me about a project where you cared a lot about doing something properly but the business wanted speed. How did you handle it and what did it teach you about what you want from your work?"
    expected_concepts:
      - "competing priorities"
      - "communication"
      - "compromise"
      - "learning"
      - "values"
    rubric:
      excellent: "Describes the tension clearly, shows how they found a workable compromise, and reflects on their own values."
      good: "Gives relevant reasons and some concrete detail about craft versus speed, but links to the role stay general."
      weak: "Vague or generic answer on craft versus speed that could apply to any job."
    followups:
      - "Would you handle it differently now?"
      - "What would you want from a team in that situation?"
    common_errors:
      - "Presenting only one side as right."

  - external_key: "recruiter_screening.motivation_engineering.mob_ambiguity"
    competency_key: recruiter_fit
    topic: "Ambiguity in product direction"
    difficulty: hard
    text: "Mobile projects can change direction late because of store policy, platform updates or user feedback. Tell me about a time that happened and how you stayed motivated."
    expected_concepts:
      - "specific example"
      - "response to change"
      - "communication"
      - "persistence"
      - "learning"
    rubric:
      excellent: "Shares a specific example and shows resilience, clear communication and learning from the change."
      good: "Gives relevant reasons and some concrete detail about ambiguity in product direction, but links to the role stay general."
      weak: "Vague or generic answer on ambiguity in product direction that could apply to any job."
    followups:
      - "What would you have done to be better prepared?"
      - "How did the team react?"
    common_errors:
      - "Blaming outside parties without owning a response."

  - external_key: "recruiter_screening.motivation_engineering.qa_influence"
    competency_key: motivation
    topic: "Influencing without authority"
    difficulty: hard
    text: "Quality work often means asking others to change how they work. Tell me about a time you persuaded a team to take quality seriously and what kept you going."
    expected_concepts:
      - "specific example"
      - "evidence used"
      - "relationship building"
      - "persistence"
      - "result"
    rubric:
      excellent: "Uses a specific example showing evidence-based influence, respectful persistence and a clear result."
      good: "Gives relevant reasons and some concrete detail about influencing without authority, but links to the role stay general."
      weak: "Vague or generic answer on influencing without authority that could apply to any job."
    followups:
      - "What pushback did you meet?"
      - "What would you do differently?"
    common_errors:
      - "Relying on escalation instead of persuasion."
