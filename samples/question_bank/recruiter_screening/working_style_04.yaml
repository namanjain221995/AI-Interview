# Curated questions: recruiter screening, working style (04 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.working_style.how_you_start_projects
    competency_key: ownership
    topic: "Kicking off"
    difficulty: easy
    text: "How do you get a new project off the ground with a team?"
    expected_concepts:
      - "goals"
      - "roles"
      - "plan"
      - "communication"
    rubric:
      excellent: "Describes agreeing goals, roles and a plan, and setting communication rhythm."
      good: "Describes starting with a plan."
      weak: "Starts without alignment."
    followups:
      - "What do you write down?"
      - "Who do you involve first?"
    common_errors:
      - "Starts without alignment."

  - external_key: recruiter_screening.working_style.work_review_with_manager
    competency_key: communication
    topic: "Reviewing progress"
    difficulty: easy
    text: "How do you prepare to discuss your progress with a manager?"
    expected_concepts:
      - "prepared summary"
      - "blockers"
      - "asks"
      - "follow-up"
    rubric:
      excellent: "Describes preparing a concise summary, naming blockers and bringing clear asks."
      good: "Describes giving an update."
      weak: "Does not prepare."
    followups:
      - "What do you include?"
      - "What do you ask for?"
    common_errors:
      - "Does not prepare."

  - external_key: recruiter_screening.working_style.ask_for_resources
    competency_key: communication
    topic: "Asking for what you need"
    difficulty: easy
    text: "How do you ask for tools, time or support when you need them to do your work well?"
    expected_concepts:
      - "business case"
      - "timing"
      - "alternatives"
      - "follow-up"
    rubric:
      excellent: "Describes making a case with benefits, offering alternatives and following up."
      good: "Says they ask the manager."
      weak: "Does not ask or demands."
    followups:
      - "What was a success?"
      - "What if refused?"
    common_errors:
      - "Does not ask or demands."

  - external_key: recruiter_screening.working_style.sustained_effort_balance
    competency_key: ownership
    topic: "Sustainable pace"
    difficulty: medium
    text: "How do you keep a sustainable pace over long projects?"
    expected_concepts:
      - "pacing"
      - "boundaries"
      - "communication"
      - "examples"
    rubric:
      excellent: "Describes planning, setting limits that fit the job and communicating when scope exceeds capacity."
      good: "Describes managing time."
      weak: "Works in bursts until exhausted."
    followups:
      - "What do you do when the schedule is unrealistic?"
      - "What helps?"
    common_errors:
      - "Works in bursts until exhausted."

  - external_key: recruiter_screening.working_style.brainstorming_style
    competency_key: collaboration
    topic: "Generating ideas"
    difficulty: easy
    text: "How do you contribute when a team is generating ideas?"
    expected_concepts:
      - "individual thinking"
      - "building on others"
      - "structure"
      - "follow-up"
    rubric:
      excellent: "Describes preparing ideas, building on others' and helping the group converge."
      good: "Contributes ideas."
      weak: "Dominates or stays silent."
    followups:
      - "How do you converge?"
      - "How do you handle bad ideas?"
    common_errors:
      - "Dominates or stays silent."

  - external_key: recruiter_screening.working_style.uncertainty_comfort
    competency_key: adaptability
    topic: "Working without all the answers"
    difficulty: medium
    text: "How comfortable are you starting work before every detail is known?"
    expected_concepts:
      - "iteration"
      - "risk"
      - "checking assumptions"
      - "examples"
    rubric:
      excellent: "Describes starting with small steps, testing assumptions and adjusting, with an example."
      good: "Says they are comfortable."
      weak: "Needs everything defined or ignores risk."
    followups:
      - "What do you do first?"
      - "What risks do you watch?"
    common_errors:
      - "Needs everything defined or ignores risk."

  - external_key: recruiter_screening.working_style.conflict_with_manager
    competency_key: communication
    topic: "Disagreeing with your manager"
    difficulty: hard
    text: "How do you prefer to handle it when you think your manager is heading in the wrong direction on something that touches your work?"
    expected_concepts:
      - "private conversation"
      - "evidence"
      - "commitment"
      - "outcome"
    rubric:
      excellent: "Describes raising concerns privately with evidence, accepting the decision and supporting it."
      good: "Describes disagreeing and moving on."
      weak: "Complained to others or complied silently."
    followups:
      - "What was the outcome?"
      - "Would you do it again?"
    common_errors:
      - "Complained to others or complied silently."

  - external_key: recruiter_screening.working_style.shared_ownership
    competency_key: collaboration
    topic: "Joint work products"
    difficulty: medium
    text: "How do you handle work that is owned jointly with another person?"
    expected_concepts:
      - "clear roles"
      - "communication"
      - "handoffs"
      - "conflict"
    rubric:
      excellent: "Describes agreeing roles, regular syncs and handling overlap."
      good: "Describes splitting tasks."
      weak: "Leaves it to the other person or takes over."
    followups:
      - "How did you divide it?"
      - "What if they are slow?"
    common_errors:
      - "Leaves it to the other person or takes over."

  - external_key: recruiter_screening.working_style.handling_repeated_requests
    competency_key: communication
    topic: "Frequent questions"
    difficulty: easy
    text: "How do you handle the same question coming from many people?"
    expected_concepts:
      - "document"
      - "share"
      - "automate"
      - "boundaries"
    rubric:
      excellent: "Describes writing it down, linking it and making the answer easy to find."
      good: "Answers each time."
      weak: "Gets annoyed or ignores."
    followups:
      - "Where do you put it?"
      - "How do you keep it fresh?"
    common_errors:
      - "Gets annoyed or ignores."

  - external_key: recruiter_screening.working_style.decisions_in_writing
    competency_key: communication
    topic: "Recording decisions"
    difficulty: medium
    text: "If a decision is made in a conversation, what do you do afterwards so nobody remembers it differently?"
    expected_concepts:
      - "context"
      - "options"
      - "rationale"
      - "accessibility"
    rubric:
      excellent: "Describes recording context, options and reasons in a findable place."
      good: "Mentions notes."
      weak: "Relies on memory."
    followups:
      - "What is the format?"
      - "Who can find it?"
    common_errors:
      - "Relies on memory."

  - external_key: recruiter_screening.working_style.time_blocking
    competency_key: ownership
    topic: "Using your calendar"
    difficulty: easy
    text: "How do you use your calendar to protect the work you need to do?"
    expected_concepts:
      - "blocking"
      - "flexibility"
      - "communication"
      - "results"
    rubric:
      excellent: "Describes blocking time, setting expectations with teammates and adjusting."
      good: "Uses it for meetings."
      weak: "Does not manage it."
    followups:
      - "What do you do with last-minute meetings?"
      - "How do you decide blocks?"
    common_errors:
      - "Does not manage it."

  - external_key: recruiter_screening.working_style.dealing_with_unclear_ownership
    competency_key: ownership
    topic: "Unowned work"
    difficulty: medium
    text: "What do you do when you spot work that no one clearly owns?"
    expected_concepts:
      - "raise"
      - "clarify"
      - "volunteer or assign"
      - "follow-up"
    rubric:
      excellent: "Describes raising it, helping find an owner and making sure it does not fall through."
      good: "Does it themselves."
      weak: "Ignores it."
    followups:
      - "Example?"
      - "How do you avoid overreach?"
    common_errors:
      - "Ignores it."

  - external_key: recruiter_screening.working_style.influence_on_priorities
    competency_key: communication
    topic: "Shaping priorities"
    difficulty: easy
    text: "How do you make your case when you think the team is prioritising the wrong thing?"
    expected_concepts:
      - "evidence"
      - "listening"
      - "options"
      - "respect"
    rubric:
      excellent: "Describes presenting evidence, listening to context and proposing an alternative."
      good: "Raises the concern."
      weak: "Complains afterward."
    followups:
      - "What was the result?"
      - "What if you are overruled?"
    common_errors:
      - "Complains afterward."

  - external_key: recruiter_screening.working_style.slowing_down
    competency_key: problem_solving
    topic: "Resisting pressure"
    difficulty: hard
    text: "Tell me about a time you slowed things down because something did not seem right. How did you handle it?"
    expected_concepts:
      - "evidence"
      - "communication"
      - "trade-off"
      - "outcome"
    rubric:
      excellent: "Describes raising specific concerns with evidence, agreeing on a check and the outcome."
      good: "Describes raising a concern."
      weak: "Went ahead against their judgement or blocked without evidence."
    followups:
      - "What did it cost?"
      - "What did you learn?"
    common_errors:
      - "Went ahead against their judgement or blocked without evidence."

  - external_key: recruiter_screening.working_style.flexibility_in_hours
    competency_key: recruiter_fit
    topic: "Flexibility the job needs"
    difficulty: easy
    text: "If the job occasionally needs flexibility around deadlines or events, how do you plan for that?"
    expected_concepts:
      - "planning"
      - "communication"
      - "fairness"
      - "examples"
    rubric:
      excellent: "Describes planning ahead, communicating availability and balancing commitments within what the job states."
      good: "Says they can be flexible."
      weak: "Is unwilling to discuss."
    followups:
      - "How far ahead do you plan?"
      - "How do you communicate?"
    common_errors:
      - "Is unwilling to discuss."

  - external_key: recruiter_screening.working_style.learning_by_teaching
    competency_key: collaboration
    topic: "Explaining to others"
    difficulty: easy
    text: "How does explaining your work to others help you?"
    expected_concepts:
      - "clarity"
      - "feedback"
      - "learning"
      - "examples"
    rubric:
      excellent: "Describes how explaining finds gaps and gives an example."
      good: "Says it helps."
      weak: "Rarely explains."
    followups:
      - "What was last explained?"
      - "What did you find?"
    common_errors:
      - "Rarely explains."

  - external_key: recruiter_screening.working_style.recovery_after_setback
    competency_key: adaptability
    topic: "Bouncing back at work"
    difficulty: medium
    text: "When a piece of work comes back needing a redo, what is your routine for getting restarted?"
    expected_concepts:
      - "review"
      - "plan"
      - "communication"
      - "momentum"
    rubric:
      excellent: "Describes reviewing causes, resetting a plan and communicating."
      good: "Describes carrying on."
      weak: "Dwells on blame."
    followups:
      - "Example?"
      - "What changed?"
    common_errors:
      - "Dwells on blame."

  - external_key: recruiter_screening.working_style.review_your_own_work
    competency_key: ownership
    topic: "Checking your own work"
    difficulty: easy
    text: "What do you check before you share your work with others?"
    expected_concepts:
      - "checklist"
      - "testing"
      - "read-through"
      - "examples"
    rubric:
      excellent: "Describes a concrete self-review routine and an example of a caught issue."
      good: "Says they look it over."
      weak: "Shares without checking."
    followups:
      - "What do you check first?"
      - "What did you miss once?"
    common_errors:
      - "Shares without checking."

  - external_key: recruiter_screening.working_style.collaboration_tools_choices
    competency_key: collaboration
    topic: "Choosing channels"
    difficulty: easy
    text: "How do you choose which channel to use for different kinds of messages?"
    expected_concepts:
      - "purpose"
      - "urgency"
      - "audience"
      - "norms"
    rubric:
      excellent: "Describes matching channel to urgency and audience and following team norms."
      good: "Uses the default channel."
      weak: "Uses one channel for everything."
    followups:
      - "What is urgent?"
      - "What belongs in a document?"
    common_errors:
      - "Uses one channel for everything."

  - external_key: recruiter_screening.working_style.priority_signals
    competency_key: ownership
    topic: "Spotting what matters"
    difficulty: medium
    text: "How do you figure out which tasks matter most when everything is labelled urgent?"
    expected_concepts:
      - "impact"
      - "deadlines"
      - "stakeholders"
      - "conversation"
    rubric:
      excellent: "Describes using impact and deadlines and clarifying with stakeholders."
      good: "Takes tasks in order."
      weak: "Treats everything the same."
    followups:
      - "Who do you ask?"
      - "How do you push back?"
    common_errors:
      - "Treats everything the same."

  - external_key: recruiter_screening.working_style.thanks_and_recognition
    competency_key: culture_values
    topic: "Recognising others"
    difficulty: easy
    text: "How do you recognise good work by colleagues?"
    expected_concepts:
      - "specific"
      - "timely"
      - "public or private"
      - "examples"
    rubric:
      excellent: "Describes specific, timely recognition and an example of its effect."
      good: "Says thanks."
      weak: "Rarely recognises."
    followups:
      - "What did you say?"
      - "How did they respond?"
    common_errors:
      - "Rarely recognises."

  - external_key: recruiter_screening.working_style.approach_to_new_ideas
    competency_key: adaptability
    topic: "Trying new approaches"
    difficulty: medium
    text: "How do you evaluate a new approach suggested by a teammate?"
    expected_concepts:
      - "open mind"
      - "evidence"
      - "trial"
      - "feedback"
    rubric:
      excellent: "Describes listening, asking for evidence and running a small trial."
      good: "Says they are open."
      weak: "Rejects or adopts without checking."
    followups:
      - "Example?"
      - "How did it turn out?"
    common_errors:
      - "Rejects or adopts without checking."

  - external_key: recruiter_screening.working_style.supporting_decisions
    competency_key: collaboration
    topic: "Backing the team"
    difficulty: easy
    text: "What does it look like when you fully support a team decision?"
    expected_concepts:
      - "commitment"
      - "communication"
      - "help"
      - "follow-through"
    rubric:
      excellent: "Describes concrete actions that support a decision, including explaining it to others."
      good: "Says they go along."
      weak: "Gives lip service."
    followups:
      - "Give an example."
      - "What if you still disagree?"
    common_errors:
      - "Gives lip service."

  - external_key: recruiter_screening.working_style.adapt_to_manager_changes
    competency_key: adaptability
    topic: "New leader"
    difficulty: medium
    text: "How would you work with a new manager whose style differs from the previous one?"
    expected_concepts:
      - "discovery"
      - "communication"
      - "adaptation"
      - "results"
    rubric:
      excellent: "Describes setting up an early conversation, asking about preferences and adjusting."
      good: "Says they adapt."
      weak: "Struggles to adapt."
    followups:
      - "What do you ask first?"
      - "What would you keep?"
    common_errors:
      - "Struggles to adapt."

  - external_key: recruiter_screening.working_style.reflect_on_style_fit
    competency_key: culture_values
    topic: "Where your style may not fit"
    difficulty: hard
    text: "Is there a type of working environment where your approach would be less effective? How would you handle it?"
    expected_concepts:
      - "self-awareness"
      - "specific conditions"
      - "adaptation"
      - "evidence"
    rubric:
      excellent: "Names specific conditions, describes how they would adapt and cites a time they did."
      good: "Names a condition and says they adapt."
      weak: "Says their style fits everywhere."
    followups:
      - "What changes would you make?"
      - "Who could help?"
    common_errors:
      - "Says their style fits everywhere."
