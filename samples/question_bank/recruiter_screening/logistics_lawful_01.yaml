# Curated questions: recruiter screening, logistics lawful (01 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.logistics_lawful.notice_period_length
    competency_key: recruiter_fit
    topic: "Notice period"
    difficulty: easy
    text: "What notice period applies to you in your current role, and how flexible is the handover timing within it?"
    expected_concepts:
      - "clear notice length"
      - "handover flexibility"
      - "planning"
      - "professionalism"
    rubric:
      excellent: "States the notice period clearly, explains how handover timing works and what could vary."
      good: "States the notice period only."
      weak: "Is vague or unwilling to state it."
    followups:
      - "Does it include any leave to be taken?"
      - "What would help you plan?"
    common_errors:
      - "Is vague or unwilling to state it."

  - external_key: recruiter_screening.logistics_lawful.earliest_start_date
    competency_key: recruiter_fit
    topic: "Earliest start"
    difficulty: easy
    text: "If everything went smoothly, what is the earliest date you could realistically start with us?"
    expected_concepts:
      - "realistic date"
      - "dependencies"
      - "clarity"
      - "flexibility"
    rubric:
      excellent: "Gives a realistic date, names the dependencies and says what could move it."
      good: "Gives a date with few details."
      weak: "Gives no date or an unrealistic one."
    followups:
      - "What affects that date?"
      - "Is there any flexibility?"
    common_errors:
      - "Gives no date or an unrealistic one."

  - external_key: recruiter_screening.logistics_lawful.preferred_start_window
    competency_key: recruiter_fit
    topic: "Start date preferences"
    difficulty: easy
    text: "Do you have a preferred window for starting, and what would shape it?"
    expected_concepts:
      - "preferred window"
      - "job-related reasons"
      - "flexibility"
      - "communication"
    rubric:
      excellent: "States a window with practical reasons and shows willingness to coordinate."
      good: "States a window."
      weak: "Is rigid with no reasoning."
    followups:
      - "Could you start earlier or later?"
      - "What would you need to arrange?"
    common_errors:
      - "Is rigid with no reasoning."

  - external_key: recruiter_screening.logistics_lawful.handover_plan
    competency_key: ownership
    topic: "Leaving work in good shape"
    difficulty: medium
    text: "When you leave your current work, how would you hand it over so the team is not left in a difficult position?"
    expected_concepts:
      - "handover documentation"
      - "knowledge transfer"
      - "stakeholder communication"
      - "timeline"
    rubric:
      excellent: "Describes a concrete plan with documentation, walkthroughs and a clear timeline for the handover."
      good: "Describes some handover steps."
      weak: "Has no plan or says it is the employer's job."
    followups:
      - "What would you document?"
      - "Who would you brief?"
    common_errors:
      - "Has no plan or says it is the employer's job."

  - external_key: recruiter_screening.logistics_lawful.work_arrangement_as_offered
    competency_key: recruiter_fit
    topic: "Work arrangement"
    difficulty: easy
    text: "This role is hybrid with some days on site, as set out in the posting. How does that arrangement work for you?"
    expected_concepts:
      - "understanding of arrangement"
      - "practical plan"
      - "clarity"
      - "flexibility"
    rubric:
      excellent: "Shows they understood the stated arrangement and describes how they would meet it."
      good: "Accepts the arrangement with limited detail."
      weak: "Does not engage with the stated arrangement."
    followups:
      - "Any question about how it operates?"
      - "How do you work best on remote days?"
    common_errors:
      - "Does not engage with the stated arrangement."

  - external_key: recruiter_screening.logistics_lawful.onsite_days_planning
    competency_key: recruiter_fit
    topic: "On-site expectation"
    difficulty: easy
    text: "The role expects a few days a week at our office. What would you want to know about how the schedule works?"
    expected_concepts:
      - "relevant questions"
      - "planning"
      - "flexibility"
      - "clarity"
    rubric:
      excellent: "Asks relevant questions about days, team overlap and flexibility, showing they have thought it through."
      good: "Asks general questions."
      weak: "Has no questions or raises unrelated topics."
    followups:
      - "What helps your onsite days be productive?"
      - "What would make scheduling easier?"
    common_errors:
      - "Has no questions or raises unrelated topics."

  - external_key: recruiter_screening.logistics_lawful.remote_setup
    competency_key: recruiter_fit
    topic: "Remote working setup"
    difficulty: easy
    text: "For remote days, what do you need in place so that you can work effectively?"
    expected_concepts:
      - "work needs"
      - "equipment expectations"
      - "communication"
      - "practicality"
    rubric:
      excellent: "Describes the job-related setup they need and what they will arrange themselves."
      good: "Describes a basic setup."
      weak: "Cannot describe what they need."
    followups:
      - "What would you ask the company to provide?"
      - "How do you stay connected?"
    common_errors:
      - "Cannot describe what they need."

  - external_key: recruiter_screening.logistics_lawful.working_hours_overlap
    competency_key: recruiter_fit
    topic: "Overlap hours"
    difficulty: medium
    text: "The team collaborates mainly during a set overlap window each day. How would you work with that?"
    expected_concepts:
      - "understanding"
      - "planning"
      - "flexibility"
      - "communication"
    rubric:
      excellent: "Shows how they would meet the overlap window and communicate availability outside it."
      good: "Accepts the window."
      weak: "Is unwilling to discuss the window."
    followups:
      - "How would you manage tasks outside the window?"
      - "What helps in handovers across hours?"
    common_errors:
      - "Is unwilling to discuss the window."

  - external_key: recruiter_screening.logistics_lawful.on_call_awareness
    competency_key: recruiter_fit
    topic: "On-call duties"
    difficulty: easy
    text: "This role includes an on-call rota about one week in several. What experience do you have with on-call, and what would you want to know?"
    expected_concepts:
      - "experience"
      - "understanding of expectations"
      - "practical questions"
      - "preparedness"
    rubric:
      excellent: "Describes past on-call experience, asks about rota, tooling and support and shows readiness."
      good: "Describes limited experience and a few questions."
      weak: "Dismisses on-call or has no questions."
    followups:
      - "How do you prepare for a shift?"
      - "What makes on-call sustainable?"
    common_errors:
      - "Dismisses on-call or has no questions."

  - external_key: recruiter_screening.logistics_lawful.travel_requirement
    competency_key: recruiter_fit
    topic: "Travel needs"
    difficulty: easy
    text: "The posting mentions occasional travel to client sites. How do you feel about that part of the role?"
    expected_concepts:
      - "understanding"
      - "examples"
      - "planning"
      - "clarity"
    rubric:
      excellent: "Describes relevant past travel or planning and asks about frequency and notice."
      good: "Accepts travel in general."
      weak: "Dismisses travel or gives no detail."
    followups:
      - "How much notice helps you?"
      - "What makes travel go well?"
    common_errors:
      - "Dismisses travel or gives no detail."

  - external_key: recruiter_screening.logistics_lawful.availability_for_interviews
    competency_key: communication
    topic: "Next steps scheduling"
    difficulty: easy
    text: "We have a few more steps in the process. What times work best for you for further conversations?"
    expected_concepts:
      - "clear availability"
      - "flexibility"
      - "courtesy"
      - "planning"
    rubric:
      excellent: "Offers clear windows and offers alternatives."
      good: "Gives limited windows."
      weak: "Gives no information."
    followups:
      - "Is there anything we should plan around?"
      - "How much notice do you need?"
    common_errors:
      - "Gives no information."

  - external_key: recruiter_screening.logistics_lawful.notice_negotiation
    competency_key: recruiter_fit
    topic: "Shortening a notice period"
    difficulty: hard
    text: "If we needed someone sooner than your notice period, how would you approach that conversation with your current employer?"
    expected_concepts:
      - "respect for obligations"
      - "communication"
      - "options"
      - "professionalism"
    rubric:
      excellent: "Describes respecting contractual obligations, discussing options openly and keeping relationships intact."
      good: "Says they would ask."
      weak: "Would simply leave early or refuses to discuss."
    followups:
      - "What would you offer?"
      - "What would you not do?"
    common_errors:
      - "Would simply leave early or refuses to discuss."

  - external_key: recruiter_screening.logistics_lawful.open_to_timeline_changes
    competency_key: adaptability
    topic: "Timeline flexibility"
    difficulty: easy
    text: "Sometimes a start date shifts for either side. How would you handle it if our start date had to move?"
    expected_concepts:
      - "flexibility"
      - "communication"
      - "planning"
      - "professionalism"
    rubric:
      excellent: "Describes staying in touch, planning options and keeping commitments to both sides."
      good: "Says they would be flexible."
      weak: "Is rigid."
    followups:
      - "What would you need to know?"
      - "How would you adapt?"
    common_errors:
      - "Is rigid."

  - external_key: recruiter_screening.logistics_lawful.location_requirement
    competency_key: recruiter_fit
    topic: "Role location"
    difficulty: medium
    text: "The role is based at our office with the arrangement described. What would you like to understand about the location and commute expectations?"
    expected_concepts:
      - "reading the posting"
      - "practical questions"
      - "planning"
      - "interest"
    rubric:
      excellent: "Asks informed questions about the arrangement and shows how they would plan for it."
      good: "Asks one question."
      weak: "Has no questions."
    followups:
      - "What would help you plan?"
      - "What is your experience with it?"
    common_errors:
      - "Has no questions."

  - external_key: recruiter_screening.logistics_lawful.core_hours
    competency_key: recruiter_fit
    topic: "Core working hours"
    difficulty: easy
    text: "The team works core hours between set times. How do you plan your day around core hours?"
    expected_concepts:
      - "understanding"
      - "planning"
      - "flexibility"
      - "communication"
    rubric:
      excellent: "Describes planning work around core hours and how they communicate when they need flexibility."
      good: "Accepts the hours."
      weak: "Resists core hours."
    followups:
      - "What flexibility do you find useful?"
      - "How do you protect focus time?"
    common_errors:
      - "Resists core hours."

  - external_key: recruiter_screening.logistics_lawful.overtime_in_peak_periods
    competency_key: recruiter_fit
    topic: "Peak periods"
    difficulty: medium
    text: "The role has two or three busy periods a year when extra hours are expected, as described in the posting. How would you prepare for those?"
    expected_concepts:
      - "understanding"
      - "planning"
      - "communication"
      - "sustainability"
    rubric:
      excellent: "Describes planning ahead, communicating needs and managing workload in peak periods."
      good: "Accepts extra hours."
      weak: "Refuses or has no plan."
    followups:
      - "How do you recover after?"
      - "What would you ask us?"
    common_errors:
      - "Refuses or has no plan."

  - external_key: recruiter_screening.logistics_lawful.equipment_and_tools
    competency_key: recruiter_fit
    topic: "Working tools"
    difficulty: easy
    text: "Are there specific tools or equipment you would expect to use for this work, and how comfortable are you with the setup we use?"
    expected_concepts:
      - "relevant tools"
      - "comfort"
      - "learning plan"
      - "questions"
    rubric:
      excellent: "Names relevant tools, notes comfort levels and describes how they would get up to speed."
      good: "Names tools generally."
      weak: "Has no information."
    followups:
      - "What would you want to learn first?"
      - "What do you prefer?"
    common_errors:
      - "Has no information."

  - external_key: recruiter_screening.logistics_lawful.onboarding_logistics
    competency_key: communication
    topic: "Joining the company"
    difficulty: easy
    text: "What would help make your first day and first week smooth from a practical point of view?"
    expected_concepts:
      - "practical needs"
      - "communication"
      - "preparation"
      - "proactivity"
    rubric:
      excellent: "Lists practical needs such as access and introductions and shows what they will prepare."
      good: "Lists a few needs."
      weak: "Has no needs or expects everything provided."
    followups:
      - "What would you prepare beforehand?"
      - "Who would you meet?"
    common_errors:
      - "Has no needs or expects everything provided."

  - external_key: recruiter_screening.logistics_lawful.pre_start_availability
    competency_key: communication
    topic: "Before you start"
    difficulty: medium
    text: "Between accepting an offer and starting, how would you like to stay in touch with us?"
    expected_concepts:
      - "communication cadence"
      - "clarity"
      - "preparation"
      - "professionalism"
    rubric:
      excellent: "Proposes a sensible cadence, channels and ways to prepare before the start."
      good: "Says they are available."
      weak: "Has no preference."
    followups:
      - "What preparation would help?"
      - "Who should contact you?"
    common_errors:
      - "Has no preference."

  - external_key: recruiter_screening.logistics_lawful.background_check_timeline
    competency_key: recruiter_fit
    topic: "Pre-employment steps"
    difficulty: medium
    text: "The offer is subject to standard pre-employment checks relevant to the role. How would you make sure those do not delay your start?"
    expected_concepts:
      - "understanding"
      - "proactive preparation"
      - "timeline"
      - "communication"
    rubric:
      excellent: "Describes gathering the information needed early and keeping the recruiter informed about timing."
      good: "Says they would cooperate."
      weak: "Is unaware or reluctant."
    followups:
      - "What would you prepare?"
      - "What can slow it down?"
    common_errors:
      - "Is unaware or reluctant."

  - external_key: recruiter_screening.logistics_lawful.planned_commitments_before_start
    competency_key: communication
    topic: "Prior work commitments"
    difficulty: easy
    text: "Are there any work commitments you need to complete before starting a new role, and how would you manage them?"
    expected_concepts:
      - "commitments identified"
      - "planning"
      - "communication"
      - "professionalism"
    rubric:
      excellent: "Names relevant work commitments, explains a plan and shares timing early."
      good: "Mentions commitments in general."
      weak: "Does not plan for them."
    followups:
      - "How would you let us know?"
      - "What happens if they overrun?"
    common_errors:
      - "Does not plan for them."

  - external_key: recruiter_screening.logistics_lawful.interview_process_questions
    competency_key: communication
    topic: "Process questions"
    difficulty: easy
    text: "What questions do you have about the next steps, timeline or format of our process?"
    expected_concepts:
      - "relevant questions"
      - "preparation"
      - "clarity"
      - "interest"
    rubric:
      excellent: "Asks pertinent questions about format, timing and preparation."
      good: "Asks one general question."
      weak: "Has no questions."
    followups:
      - "What helps you prepare?"
      - "Anything we can adjust to help you perform?"
    common_errors:
      - "Has no questions."

  - external_key: recruiter_screening.logistics_lawful.schedule_flexibility_needs
    competency_key: recruiter_fit
    topic: "Working pattern flexibility"
    difficulty: medium
    text: "The role has set hours with some flexibility on start and finish times. How would you use that flexibility while meeting team needs?"
    expected_concepts:
      - "use of flexibility"
      - "team coverage"
      - "communication"
      - "reliability"
    rubric:
      excellent: "Describes using flexibility to suit the team and communicating availability clearly."
      good: "Says they would use it sensibly."
      weak: "Expects unlimited flexibility."
    followups:
      - "How do you communicate it?"
      - "What would limit it?"
    common_errors:
      - "Expects unlimited flexibility."

  - external_key: recruiter_screening.logistics_lawful.role_requires_weekend_cover
    competency_key: recruiter_fit
    topic: "Occasional extra cover"
    difficulty: hard
    text: "If the role needs occasional cover outside normal hours for planned events, as set out in the posting, how would you plan for that?"
    expected_concepts:
      - "understanding"
      - "advance planning"
      - "communication"
      - "fair arrangement"
    rubric:
      excellent: "Describes planning ahead, agreeing the arrangement in advance and ensuring cover is dependable."
      good: "Accepts occasional cover."
      weak: "Rejects or ignores the requirement."
    followups:
      - "What would you ask us?"
      - "How do you plan time off after?"
    common_errors:
      - "Rejects or ignores the requirement."

  - external_key: recruiter_screening.logistics_lawful.joining_date_confirmation
    competency_key: communication
    topic: "Confirming the date"
    difficulty: easy
    text: "How would you like us to confirm your start date and the details for your first day?"
    expected_concepts:
      - "clear process"
      - "contact preferences"
      - "documents"
      - "courtesy"
    rubric:
      excellent: "Describes a preferred confirmation route and what information they need."
      good: "Says by email."
      weak: "Has no preference."
    followups:
      - "What do you need to receive?"
      - "Who should we contact?"
    common_errors:
      - "Has no preference."
