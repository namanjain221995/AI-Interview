version: 1
defaults:
  role_tags: [devops, sre, platform, cloud, security, network, dba]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_infrastructure.devops_career"
    competency_key: motivation
    topic: "Next steps in DevOps"
    difficulty: easy
    text: "Where would you like to grow next in your DevOps career?"
    expected_concepts:
      - "specific direction such as platform, reliability or security"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names a clear direction, steps already taken, and how this role helps."
      good: "Gives relevant reasons and some concrete detail about next steps in devops, but links to the role stay general."
      weak: "Vague or generic answer on next steps in devops that could apply to any job."
    followups:
      - "What would you like to learn here?"
      - "What steps have you already taken?"
    common_errors:
      - "Not having a direction."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_career"
    competency_key: motivation
    topic: "Next steps in SRE"
    difficulty: easy
    text: "What would you like to be better at in your reliability career in the next year?"
    expected_concepts:
      - "specific skills"
      - "learning methods"
      - "link to role"
      - "realism"
    rubric:
      excellent: "Names specific skills and a plan to build them in this role."
      good: "Gives relevant reasons and some concrete detail about next steps in sre, but links to the role stay general."
      weak: "Vague or generic answer on next steps in sre that could apply to any job."
    followups:
      - "How will you measure progress?"
      - "Who could help you?"
    common_errors:
      - "Vague answers about \"doing more\"."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_career"
    competency_key: motivation
    topic: "Next steps in platform work"
    difficulty: easy
    text: "What do you hope to learn in your next platform engineering role?"
    expected_concepts:
      - "specific skills"
      - "link to role"
      - "examples"
      - "plan"
    rubric:
      excellent: "Gives concrete skills and links them to what this team offers."
      good: "Gives relevant reasons and some concrete detail about next steps in platform work, but links to the role stay general."
      weak: "Vague or generic answer on next steps in platform work that could apply to any job."
    followups:
      - "How have you already started?"
      - "What do you want to own?"
    common_errors:
      - "Giving a list of tools."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_career"
    competency_key: motivation
    topic: "Next steps in cloud"
    difficulty: easy
    text: "What would you like to deepen in your cloud skills over the next year or two?"
    expected_concepts:
      - "specific areas such as networking or data"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific areas with learning actions and relates them to the role."
      good: "Gives relevant reasons and some concrete detail about next steps in cloud, but links to the role stay general."
      weak: "Vague or generic answer on next steps in cloud that could apply to any job."
    followups:
      - "Which certification or project helped most?"
      - "How do you decide what to learn?"
    common_errors:
      - "Chasing certifications only."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_career_next"
    competency_key: motivation
    topic: "Next steps in security"
    difficulty: easy
    text: "Which security skills do you most want to build next?"
    expected_concepts:
      - "skill areas"
      - "actions"
      - "mentors"
      - "link to role"
    rubric:
      excellent: "Names specific skills and learning actions and links them to the role."
      good: "Gives relevant reasons and some concrete detail about next steps in security, but links to the role stay general."
      weak: "Vague or generic answer on next steps in security that could apply to any job."
    followups:
      - "What resources do you use?"
      - "Which of those would this role give you?"
    common_errors:
      - "Listing buzzwords."

  - external_key: "recruiter_screening.motivation_infrastructure.net_career"
    competency_key: motivation
    topic: "Next steps in networking"
    difficulty: easy
    text: "What new skills in networking or related areas do you want to develop next?"
    expected_concepts:
      - "specific skills such as cloud networking or automation"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Gives concrete skills with practice already underway and a connection to the role."
      good: "Gives relevant reasons and some concrete detail about next steps in networking, but links to the role stay general."
      weak: "Vague or generic answer on next steps in networking that could apply to any job."
    followups:
      - "What have you practised recently?"
      - "How would you apply it here?"
    common_errors:
      - "Not naming anything specific."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_career"
    competency_key: motivation
    topic: "Next steps in database work"
    difficulty: easy
    text: "What do you want to build on next in your database career?"
    expected_concepts:
      - "specific areas such as performance, cloud databases or data modelling"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Gives concrete areas and actions linked to the role."
      good: "Gives relevant reasons and some concrete detail about next steps in database work, but links to the role stay general."
      weak: "Vague or generic answer on next steps in database work that could apply to any job."
    followups:
      - "What have you tried on your own?"
      - "How would you use it in this job?"
    common_errors:
      - "Wanting to move away from the work."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_team_style"
    competency_key: recruiter_fit
    topic: "Team working style"
    difficulty: easy
    text: "How do you like to work with your team on infrastructure changes, for example in terms of reviews, pairing and documentation?"
    expected_concepts:
      - "review habits"
      - "documentation"
      - "communication"
      - "examples"
      - "adaptability"
    rubric:
      excellent: "Describes practices such as reviewed changes and runbooks with examples."
      good: "Gives relevant reasons and some concrete detail about team working style, but links to the role stay general."
      weak: "Vague or generic answer on team working style that could apply to any job."
    followups:
      - "What does a good change request look like?"
      - "What do you do when documentation falls behind?"
    common_errors:
      - "Working alone on risky changes."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_dev_partner"
    competency_key: recruiter_fit
    topic: "Partnering with developers"
    difficulty: easy
    text: "How do you work with development teams to make services more reliable?"
    expected_concepts:
      - "partnership"
      - "production readiness"
      - "shared ownership"
      - "examples"
    rubric:
      excellent: "Describes practical partnership such as readiness reviews and shared SLOs with an example."
      good: "Gives relevant reasons and some concrete detail about partnering with developers, but links to the role stay general."
      weak: "Vague or generic answer on partnering with developers that could apply to any job."
    followups:
      - "How do you handle a team with poor reliability?"
      - "What incentives work?"
    common_errors:
      - "Handing over problems without context."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_dev_relationship"
    competency_key: recruiter_fit
    topic: "Working with product teams"
    difficulty: easy
    text: "How do you keep a good relationship with product teams that use your platform?"
    expected_concepts:
      - "communication"
      - "support"
      - "feedback"
      - "transparency"
      - "examples"
    rubric:
      excellent: "Shares practical habits such as office hours and release notes with an example."
      good: "Gives relevant reasons and some concrete detail about working with product teams, but links to the role stay general."
      weak: "Vague or generic answer on working with product teams that could apply to any job."
    followups:
      - "How do you announce breaking changes?"
      - "How do you decide what support you provide?"
    common_errors:
      - "Ignoring team feedback."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_arch_team"
    competency_key: recruiter_fit
    topic: "Working with architects and developers"
    difficulty: easy
    text: "How do you like to collaborate with architects and developers on cloud design decisions?"
    expected_concepts:
      - "collaboration"
      - "design reviews"
      - "documentation"
      - "influence"
      - "examples"
    rubric:
      excellent: "Describes design discussions, documented decisions and an example of influencing a design."
      good: "Gives relevant reasons and some concrete detail about working with architects and developers, but links to the role stay general."
      weak: "Vague or generic answer on working with architects and developers that could apply to any job."
    followups:
      - "How do you handle disagreements on design?"
      - "What do you put in a design record?"
    common_errors:
      - "Dictating designs."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_comm"
    competency_key: communication
    topic: "Explaining risk"
    difficulty: easy
    text: "How do you explain a security risk to someone who is not technical?"
    expected_concepts:
      - "plain language"
      - "risk framing"
      - "examples"
      - "actions"
      - "empathy"
    rubric:
      excellent: "Gives an example using plain language, impact framing and clear next steps."
      good: "Gives relevant reasons and some concrete detail about explaining risk, but links to the role stay general."
      weak: "Vague or generic answer on explaining risk that could apply to any job."
    followups:
      - "Can you give an example of explaining a risk?"
      - "How do you avoid fear and exaggeration?"
    common_errors:
      - "Using jargon or scare tactics."

  - external_key: "recruiter_screening.motivation_infrastructure.net_incident_team"
    competency_key: recruiter_fit
    topic: "Working in outages"
    difficulty: easy
    text: "When a network outage occurs, how do you like to work with others while it is happening?"
    expected_concepts:
      - "communication"
      - "roles"
      - "documentation"
      - "follow-up"
      - "example"
    rubric:
      excellent: "Describes clear roles, communication and follow-up with a real example."
      good: "Gives relevant reasons and some concrete detail about working in outages, but links to the role stay general."
      weak: "Vague or generic answer on working in outages that could apply to any job."
    followups:
      - "What role do you take?"
      - "How do you keep stakeholders informed?"
    common_errors:
      - "Acting alone without telling anyone."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_change_mgmt"
    competency_key: recruiter_fit
    topic: "Change discipline"
    difficulty: easy
    text: "How do you feel about change control and review for production database changes?"
    expected_concepts:
      - "appreciates review"
      - "automation of checks"
      - "examples"
      - "risk reasoning"
    rubric:
      excellent: "Supports review with practical examples and describes how it protects data."
      good: "Gives relevant reasons and some concrete detail about change discipline, but links to the role stay general."
      weak: "Vague or generic answer on change discipline that could apply to any job."
    followups:
      - "What is your process for a risky migration?"
      - "When would you skip a step?"
    common_errors:
      - "Treating process as bureaucracy."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_learn_new"
    competency_key: motivation
    topic: "Learning a new area"
    difficulty: medium
    text: "Tell me about a time you had to learn an unfamiliar technology quickly for an infrastructure project. How did it go?"
    expected_concepts:
      - "learning approach"
      - "resources"
      - "asking for help"
      - "result"
      - "reflection"
    rubric:
      excellent: "Describes a systematic approach, support they used, and the result."
      good: "Gives relevant reasons and some concrete detail about learning a new area, but links to the role stay general."
      weak: "Vague or generic answer on learning a new area that could apply to any job."
    followups:
      - "What was the hardest part?"
      - "What would you do differently?"
    common_errors:
      - "Claiming no difficulty."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_failure_learning"
    competency_key: motivation
    topic: "What incidents taught them"
    difficulty: medium
    text: "What is the most important thing incidents have taught you about how to build reliable systems?"
    expected_concepts:
      - "specific lessons"
      - "examples"
      - "changes made"
      - "reflection"
    rubric:
      excellent: "Shares a concrete lesson with an example and shows how it changed their work."
      good: "Gives relevant reasons and some concrete detail about what incidents taught them, but links to the role stay general."
      weak: "Vague or generic answer on what incidents taught them that could apply to any job."
    followups:
      - "Where did you apply the lesson?"
      - "What lesson are you still working on?"
    common_errors:
      - "Generic statements."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_standards"
    competency_key: motivation
    topic: "Balancing standardisation"
    difficulty: medium
    text: "Platform work often means standardising things teams want to do differently. How do you feel about that tension and how do you handle it?"
    expected_concepts:
      - "balance of standards and flexibility"
      - "golden paths"
      - "communication"
      - "examples"
    rubric:
      excellent: "Describes golden paths with room for exceptions and an example of resolving the tension."
      good: "Gives relevant reasons and some concrete detail about balancing standardisation, but links to the role stay general."
      weak: "Vague or generic answer on balancing standardisation that could apply to any job."
    followups:
      - "When did you allow an exception?"
      - "How do you review exceptions?"
    common_errors:
      - "Enforcing rules rigidly."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_responsibility"
    competency_key: motivation
    topic: "Owning cloud security and cost"
    difficulty: medium
    text: "Cloud engineers often share responsibility for security and cost. How do you see your part, and how do you work with others on it?"
    expected_concepts:
      - "shared responsibility"
      - "practices"
      - "guardrails"
      - "communication"
      - "examples"
    rubric:
      excellent: "Describes guardrails, shared dashboards and communication with a concrete example."
      good: "Gives relevant reasons and some concrete detail about owning cloud security and cost, but links to the role stay general."
      weak: "Vague or generic answer on owning cloud security and cost that could apply to any job."
    followups:
      - "What guardrails have you put in place?"
      - "How do you check them?"
    common_errors:
      - "Passing responsibility on to others."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_incident_motivation"
    competency_key: motivation
    topic: "Incident work"
    difficulty: medium
    text: "How do you feel about being involved in security incidents, and what have you learned from them?"
    expected_concepts:
      - "incident experience"
      - "process"
      - "communication"
      - "learning"
      - "sustainability"
    rubric:
      excellent: "Describes real involvement or preparation, a clear process and lessons applied."
      good: "Gives relevant reasons and some concrete detail about incident work, but links to the role stay general."
      weak: "Vague or generic answer on incident work that could apply to any job."
    followups:
      - "How do you decide when to escalate?"
      - "What would you do after the incident?"
    common_errors:
      - "Focusing on heroics."

  - external_key: "recruiter_screening.motivation_infrastructure.net_vendor"
    competency_key: motivation
    topic: "Vendor and equipment experience"
    difficulty: medium
    text: "What network vendors, platforms or environments have you enjoyed working with most, and why?"
    expected_concepts:
      - "experience"
      - "reasons"
      - "adaptability"
      - "fit with environment"
    rubric:
      excellent: "Shares experience with reasons and shows adaptability to the environment."
      good: "Gives relevant reasons and some concrete detail about vendor and equipment experience, but links to the role stay general."
      weak: "Vague or generic answer on vendor and equipment experience that could apply to any job."
    followups:
      - "How do you handle a vendor product you dislike?"
      - "How would you adapt here?"
    common_errors:
      - "Brand loyalty without reasons."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_engine_pref"
    competency_key: motivation
    topic: "Database engine preferences"
    difficulty: medium
    text: "Which database technologies do you enjoy working with and why, and how comfortable are you with others?"
    expected_concepts:
      - "depth in one or two engines"
      - "reasons"
      - "breadth"
      - "learning approach"
    rubric:
      excellent: "Shows depth with reasons and a method for learning a new engine."
      good: "Gives relevant reasons and some concrete detail about database engine preferences, but links to the role stay general."
      weak: "Vague or generic answer on database engine preferences that could apply to any job."
    followups:
      - "Which engine did you learn most recently?"
      - "How do you compare engines for a use case?"
    common_errors:
      - "Dismissing other engines."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_ownership"
    competency_key: motivation
    topic: "End-to-end ownership"
    difficulty: hard
    text: "Tell me about a time you took ownership of a delivery or infrastructure problem that was not clearly yours. What happened?"
    expected_concepts:
      - "initiative"
      - "collaboration"
      - "result"
      - "boundaries"
      - "reflection"
    rubric:
      excellent: "Describes initiative with respect for others' ownership and a clear outcome."
      good: "Gives relevant reasons and some concrete detail about end-to-end ownership, but links to the role stay general."
      weak: "Vague or generic answer on end-to-end ownership that could apply to any job."
    followups:
      - "How did you avoid overstepping?"
      - "What did the owner think?"
    common_errors:
      - "Taking over without telling anyone."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_judgement"
    competency_key: motivation
    topic: "Reliability judgement"
    difficulty: hard
    text: "Tell me about a time you chose not to chase more reliability because the cost was not worth it. How did you decide?"
    expected_concepts:
      - "trade-off thinking"
      - "SLOs"
      - "cost"
      - "communication"
      - "result"
    rubric:
      excellent: "Shows a reasoned trade-off between cost and reliability with data and stakeholder communication."
      good: "Gives relevant reasons and some concrete detail about reliability judgement, but links to the role stay general."
      weak: "Vague or generic answer on reliability judgement that could apply to any job."
    followups:
      - "Who disagreed?"
      - "What data did you use?"
    common_errors:
      - "Pursuing nines at any cost."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_future"
    competency_key: motivation
    topic: "Data careers"
    difficulty: hard
    text: "Data platforms are changing quickly with cloud-native databases and new data stores. How do you plan to stay relevant, and what excites you about it?"
    expected_concepts:
      - "view of change"
      - "skills"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Shows a reasoned view of change, a learning plan and examples of trying new technology."
      good: "Gives relevant reasons and some concrete detail about data careers, but links to the role stay general."
      weak: "Vague or generic answer on data careers that could apply to any job."
    followups:
      - "Which new technology have you tried?"
      - "Where do traditional skills still matter?"
    common_errors:
      - "Ignoring change."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_learning"
    competency_key: motivation
    topic: "Staying current in cloud"
    difficulty: easy
    text: "Cloud services change constantly. How do you keep up without getting overwhelmed?"
    expected_concepts:
      - "learning routines"
      - "sources"
      - "filtering what matters"
      - "applying at work"
      - "example"
    rubric:
      excellent: "Describes a routine and a filter for what matters, with a recent example applied at work."
      good: "Gives relevant reasons and some concrete detail about staying current in cloud, but links to the role stay general."
      weak: "Vague or generic answer on staying current in cloud that could apply to any job."
    followups:
      - "What did you learn recently that you used?"
      - "How do you decide what to ignore?"
    common_errors:
      - "Trying to follow everything."
