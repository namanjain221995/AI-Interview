# Curated questions: recruiter screening, role alignment (01 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.role_alignment.jd_standout
    competency_key: motivation
    topic: "What stood out in the posting"
    difficulty: easy
    text: "Which part of the job description stood out to you most, and why?"
    expected_concepts:
      - "specific responsibility named"
      - "link to experience"
      - "understanding of the work"
      - "reasons"
    rubric:
      excellent: "Names a specific responsibility, explains why it fits their experience and shows they understood what the work involves."
      good: "Names a responsibility with a short reason."
      weak: "Repeats the title or gives a generic answer."
    followups:
      - "What else caught your eye?"
      - "Which part is new to you?"
    common_errors:
      - "Repeats the title or gives a generic answer."

  - external_key: recruiter_screening.role_alignment.own_words_role
    competency_key: communication
    topic: "The role in your words"
    difficulty: easy
    text: "In your own words, what do you think this role is responsible for day to day?"
    expected_concepts:
      - "accurate summary"
      - "own words"
      - "key duties"
      - "sensible assumptions"
    rubric:
      excellent: "Gives an accurate, specific summary in their own words and flags assumptions they would confirm."
      good: "Summarises the main duties with minor gaps."
      weak: "Recites the posting or misreads the role."
    followups:
      - "What would you want to confirm?"
      - "What do you expect to be hardest?"
    common_errors:
      - "Recites the posting or misreads the role."

  - external_key: recruiter_screening.role_alignment.closest_experience
    competency_key: recruiter_fit
    topic: "Closest past experience"
    difficulty: easy
    text: "Which of your past roles is closest to this one, and what carried over?"
    expected_concepts:
      - "relevant role"
      - "specific overlap"
      - "outcomes"
      - "awareness of differences"
    rubric:
      excellent: "Picks a relevant role, details the overlap with outcomes and notes the differences."
      good: "Names a role and some overlap."
      weak: "Names a role without explaining the link."
    followups:
      - "What differs?"
      - "What would you do differently now?"
    common_errors:
      - "Names a role without explaining the link."

  - external_key: recruiter_screening.role_alignment.typical_day_expectation
    competency_key: recruiter_fit
    topic: "Expected day to day"
    difficulty: easy
    text: "What would you expect a typical week in this role to look like?"
    expected_concepts:
      - "realistic expectations"
      - "mix of activities"
      - "collaboration"
      - "questions"
    rubric:
      excellent: "Describes a realistic week with a balance of tasks and collaboration and asks to validate assumptions."
      good: "Describes a plausible week."
      weak: "Describes an unrealistic or generic week."
    followups:
      - "How does that match your current week?"
      - "Where might the surprise be?"
    common_errors:
      - "Describes an unrealistic or generic week."

  - external_key: recruiter_screening.role_alignment.must_have_skills_match
    competency_key: recruiter_fit
    topic: "Matching must-have skills"
    difficulty: easy
    text: "Looking at the must-have requirements, where are you strongest and where would you need to ramp up?"
    expected_concepts:
      - "candid self-assessment"
      - "evidence"
      - "ramp-up plan"
      - "clarity"
    rubric:
      excellent: "Maps requirements to specific evidence, names real gaps and describes a credible ramp-up."
      good: "Covers strengths and gaps in general terms."
      weak: "Claims to meet everything or avoids gaps."
    followups:
      - "Give an example for your strongest area."
      - "How would you close the main gap?"
    common_errors:
      - "Claims to meet everything or avoids gaps."

  - external_key: recruiter_screening.role_alignment.responsibilities_excite
    competency_key: motivation
    topic: "Most exciting duty"
    difficulty: easy
    text: "Which responsibility in this role would you look forward to most?"
    expected_concepts:
      - "specific duty"
      - "reason"
      - "related experience"
      - "understanding"
    rubric:
      excellent: "Names a specific duty, links it to past work and describes what they would bring to it."
      good: "Names a duty with a reason."
      weak: "Names no specific duty."
    followups:
      - "Have you done something similar?"
      - "What would you do first?"
    common_errors:
      - "Names no specific duty."

  - external_key: recruiter_screening.role_alignment.responsibilities_challenge
    competency_key: recruiter_fit
    topic: "The hardest part"
    difficulty: easy
    text: "Which part of this role do you think would be most demanding for you?"
    expected_concepts:
      - "self-awareness"
      - "specific area"
      - "plan"
      - "support"
    rubric:
      excellent: "Names a specific demanding area, explains why and how they would approach it."
      good: "Names an area with a generic plan."
      weak: "Says nothing would be hard."
    followups:
      - "How have you handled similar challenges?"
      - "Who would you lean on?"
    common_errors:
      - "Says nothing would be hard."

  - external_key: recruiter_screening.role_alignment.success_measure
    competency_key: ownership
    topic: "Defining success"
    difficulty: medium
    text: "How do you think success would be measured for someone in this role?"
    expected_concepts:
      - "outcome focus"
      - "measurable indicators"
      - "stakeholder view"
      - "willingness to clarify"
    rubric:
      excellent: "Proposes outcome-based measures tied to the role and plans to confirm them early."
      good: "Names some measures."
      weak: "Names only activity or hours worked."
    followups:
      - "How would you check expectations?"
      - "What would you track yourself?"
    common_errors:
      - "Names only activity or hours worked."

  - external_key: recruiter_screening.role_alignment.customer_or_user_view
    competency_key: collaboration
    topic: "Who the work serves"
    difficulty: medium
    text: "Who do you think the main customers or users of this role's work are, and what do they need?"
    expected_concepts:
      - "identification of stakeholders"
      - "needs"
      - "prior exposure"
      - "curiosity"
    rubric:
      excellent: "Identifies the likely stakeholders, describes their needs and relates it to a past example."
      good: "Identifies stakeholders in general terms."
      weak: "Cannot identify who the work serves."
    followups:
      - "How would you find out more?"
      - "Whose needs conflict?"
    common_errors:
      - "Cannot identify who the work serves."

  - external_key: recruiter_screening.role_alignment.team_interaction_expect
    competency_key: collaboration
    topic: "Working with the team"
    difficulty: easy
    text: "Which teams or roles would you expect to work with most closely in this job?"
    expected_concepts:
      - "accurate expectations"
      - "reasons"
      - "past experience"
      - "communication approach"
    rubric:
      excellent: "Names likely partners, explains why and shares how they have worked with similar partners."
      good: "Names a few partners."
      weak: "Names none or only their own team."
    followups:
      - "How would you build those relationships?"
      - "Where do conflicts usually arise?"
    common_errors:
      - "Names none or only their own team."

  - external_key: recruiter_screening.role_alignment.seniority_fit
    competency_key: recruiter_fit
    topic: "Level of the role"
    difficulty: medium
    text: "How do you see your experience fitting the level of responsibility this role has?"
    expected_concepts:
      - "self-assessment"
      - "evidence of scope"
      - "reflecting on level"
      - "clarity"
    rubric:
      excellent: "Compares their scope in past roles with this role and gives evidence for the fit."
      good: "Gives a general view."
      weak: "Makes assertions without evidence."
    followups:
      - "What scope are you ready for?"
      - "What would be a step up?"
    common_errors:
      - "Makes assertions without evidence."

  - external_key: recruiter_screening.role_alignment.tools_used_before
    competency_key: recruiter_fit
    topic: "Tools and methods"
    difficulty: easy
    text: "Which of the tools or methods named in the posting have you used, and in what kind of work?"
    expected_concepts:
      - "specific tools"
      - "depth"
      - "context"
      - "learning approach"
    rubric:
      excellent: "Names tools with the kind of work, depth of use and how they would fill any gaps."
      good: "Lists tools with some context."
      weak: "Lists tools without any context."
    followups:
      - "Which do you know best?"
      - "Which would be new?"
    common_errors:
      - "Lists tools without any context."

  - external_key: recruiter_screening.role_alignment.ambiguity_in_role
    competency_key: adaptability
    topic: "Handling unclear scope"
    difficulty: medium
    text: "If parts of the role were not defined clearly, how would you work out what to prioritise?"
    expected_concepts:
      - "clarifying questions"
      - "stakeholder input"
      - "proposing priorities"
      - "example"
    rubric:
      excellent: "Describes clarifying with stakeholders, proposing priorities and checking back, with an example."
      good: "Says they would ask questions."
      weak: "Waits for instructions or guesses."
    followups:
      - "Who do you ask first?"
      - "How do you confirm you got it right?"
    common_errors:
      - "Waits for instructions or guesses."

  - external_key: recruiter_screening.role_alignment.role_vs_current
    competency_key: recruiter_fit
    topic: "Compared with your current role"
    difficulty: easy
    text: "How does this role differ from your current one, and what appeals to you about the difference?"
    expected_concepts:
      - "accurate comparison"
      - "job-related differences"
      - "reasons"
      - "realism"
    rubric:
      excellent: "Names concrete differences in the work and explains the appeal without disparaging the current role."
      good: "Names some differences."
      weak: "Only criticises their current job."
    followups:
      - "What will you miss?"
      - "What do you hope to gain?"
    common_errors:
      - "Only criticises their current job."

  - external_key: recruiter_screening.role_alignment.contribution_early
    competency_key: ownership
    topic: "Early contribution"
    difficulty: medium
    text: "What do you think you could contribute in your first three months?"
    expected_concepts:
      - "realistic contributions"
      - "learning plan"
      - "priorities"
      - "role fit"
    rubric:
      excellent: "Describes realistic early contributions based on strengths along with a learning plan."
      good: "Describes general contributions."
      weak: "Promises unrealistic results or no contribution."
    followups:
      - "What would you need to know first?"
      - "What would be a good first milestone?"
    common_errors:
      - "Promises unrealistic results or no contribution."

  - external_key: recruiter_screening.role_alignment.learning_curve
    competency_key: adaptability
    topic: "Ramp-up approach"
    difficulty: medium
    text: "When you join a new role, how do you go about getting up to speed on the work and the people?"
    expected_concepts:
      - "structured approach"
      - "learning sources"
      - "relationships"
      - "example"
    rubric:
      excellent: "Describes a structured ramp-up with listening, documents, early tasks and checks, with a past example."
      good: "Describes general steps."
      weak: "Has no approach."
    followups:
      - "What did you do in your last role?"
      - "How did you know you were up to speed?"
    common_errors:
      - "Has no approach."

  - external_key: recruiter_screening.role_alignment.quality_expectations
    competency_key: ownership
    topic: "Quality and standards"
    difficulty: medium
    text: "What does good quality work look like in a role like this, and how do you hold yourself to it?"
    expected_concepts:
      - "concrete standards"
      - "self-checks"
      - "feedback"
      - "example"
    rubric:
      excellent: "Defines quality for the role with specific habits and gives an example of raising it."
      good: "Gives general statements about quality."
      weak: "Defines quality as speed or has no standard."
    followups:
      - "How do you check your own work?"
      - "When did you miss the standard?"
    common_errors:
      - "Defines quality as speed or has no standard."

  - external_key: recruiter_screening.role_alignment.prioritising_demands
    competency_key: ownership
    topic: "Competing requests"
    difficulty: medium
    text: "This role will have many requests from different people. How do you decide what to do first?"
    expected_concepts:
      - "prioritisation method"
      - "stakeholder communication"
      - "trade-offs"
      - "example"
    rubric:
      excellent: "Describes a clear method, communicates trade-offs and shares an example."
      good: "Describes some prioritisation."
      weak: "Does everything in order received."
    followups:
      - "When did you say no?"
      - "How do you keep people informed?"
    common_errors:
      - "Does everything in order received."

  - external_key: recruiter_screening.role_alignment.what_you_would_ask_us
    competency_key: communication
    topic: "Clarifying questions"
    difficulty: easy
    text: "If you could ask us three questions to understand the role better, what would they be?"
    expected_concepts:
      - "relevant questions"
      - "insight into the work"
      - "priorities"
      - "curiosity"
    rubric:
      excellent: "Asks sharp questions about expectations, challenges and success measures that show real understanding."
      good: "Asks reasonable but general questions."
      weak: "Asks only about perks or has no questions."
    followups:
      - "Why those?"
      - "Which is most important?"
    common_errors:
      - "Asks only about perks or has no questions."

  - external_key: recruiter_screening.role_alignment.independent_vs_guided
    competency_key: ownership
    topic: "Level of direction"
    difficulty: medium
    text: "How much direction do you usually want from a manager in a role like this, and how do you ask for it?"
    expected_concepts:
      - "self-awareness"
      - "adapting to context"
      - "communication"
      - "example"
    rubric:
      excellent: "Explains how it varies by task and experience, and describes proactive check-ins."
      good: "Gives a general preference."
      weak: "Needs constant direction or none at all."
    followups:
      - "When did you need more guidance?"
      - "How do you flag blockers?"
    common_errors:
      - "Needs constant direction or none at all."

  - external_key: recruiter_screening.role_alignment.pace_of_role
    competency_key: adaptability
    topic: "Pace of work"
    difficulty: medium
    text: "How do you handle roles where priorities and pace change quickly?"
    expected_concepts:
      - "coping strategies"
      - "communication"
      - "examples"
      - "boundaries"
    rubric:
      excellent: "Describes concrete tactics for re-planning and communication and gives an example."
      good: "Describes a general coping approach."
      weak: "Resists change or has no example."
    followups:
      - "What was the busiest period?"
      - "What did you learn from it?"
    common_errors:
      - "Resists change or has no example."

  - external_key: recruiter_screening.role_alignment.cross_skill_stretch
    competency_key: adaptability
    topic: "Beyond the listed duties"
    difficulty: hard
    text: "Many roles end up needing skills not in the posting. Tell me about a time you had to cover something outside your usual remit."
    expected_concepts:
      - "initiative"
      - "learning"
      - "results"
      - "boundaries"
    rubric:
      excellent: "Describes taking on unfamiliar work, learning fast, delivering and handing off appropriately."
      good: "Describes covering extra work."
      weak: "Resisted or has no example."
    followups:
      - "What did you drop to make time?"
      - "Who helped?"
    common_errors:
      - "Resisted or has no example."

  - external_key: recruiter_screening.role_alignment.role_impact_company
    competency_key: motivation
    topic: "How the role fits the company"
    difficulty: medium
    text: "How do you think this role contributes to the company's goals?"
    expected_concepts:
      - "reasoned link"
      - "company knowledge"
      - "examples"
      - "curiosity"
    rubric:
      excellent: "Draws a reasoned link between the role and company goals using specific knowledge."
      good: "Gives a general link."
      weak: "Cannot link the role to the company."
    followups:
      - "What research did you do?"
      - "What would you want to learn?"
    common_errors:
      - "Cannot link the role to the company."

  - external_key: recruiter_screening.role_alignment.mismatch_concerns
    competency_key: recruiter_fit
    topic: "Possible mismatches"
    difficulty: hard
    text: "Is there anything in the posting that makes you wonder whether this is the right fit? How are you thinking about it?"
    expected_concepts:
      - "candid reflection"
      - "specific concern"
      - "reasoning"
      - "willingness to discuss"
    rubric:
      excellent: "Names a specific concern clearly, explains their thinking and invites more information."
      good: "Names a minor concern."
      weak: "Says they have none without reflection."
    followups:
      - "What would resolve it?"
      - "How would you decide?"
    common_errors:
      - "Says they have none without reflection."

  - external_key: recruiter_screening.role_alignment.elevator_pitch_fit
    competency_key: communication
    topic: "Why you for this role"
    difficulty: easy
    text: "In a minute or so, why do you think you are a good match for this role?"
    expected_concepts:
      - "concise"
      - "relevant strengths"
      - "evidence"
      - "clear structure"
    rubric:
      excellent: "Gives a concise, structured pitch with evidence that maps to the role's needs."
      good: "Gives a clear but general pitch."
      weak: "Rambles or lists traits with no evidence."
    followups:
      - "What would you add?"
      - "What is your strongest proof point?"
    common_errors:
      - "Rambles or lists traits with no evidence."
