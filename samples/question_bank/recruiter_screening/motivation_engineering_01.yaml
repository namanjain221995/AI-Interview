version: 1
defaults:
  role_tags: [backend, frontend, fullstack, mobile, qa]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_engineering.be_why_backend"
    competency_key: motivation
    topic: "Why backend work"
    difficulty: easy
    text: "What draws you to backend engineering rather than other kinds of software work?"
    expected_concepts:
      - "specific kinds of backend problems they enjoy"
      - "link to past projects"
      - "understanding of what backend work involves day to day"
    rubric:
      excellent: "Names concrete backend problems such as data modelling, reliability or throughput, ties them to projects they have shipped, and shows a realistic view of the day-to-day work."
      good: "Gives relevant reasons and some concrete detail about why backend work, but links to the role stay general."
      weak: "Vague or generic answer on why backend work that could apply to any job."
    followups:
      - "What was the first backend problem you really enjoyed solving?"
      - "What part of backend work do you enjoy least?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.fe_why_frontend"
    competency_key: motivation
    topic: "Why frontend work"
    difficulty: easy
    text: "What is it about building user interfaces that keeps you interested in frontend engineering?"
    expected_concepts:
      - "appeal of user-facing work"
      - "craft areas such as performance, accessibility or design systems"
      - "examples of interfaces they built"
    rubric:
      excellent: "Describes specific frontend craft they care about and backs it with an interface they built, including what users gained from it."
      good: "Gives relevant reasons and some concrete detail about why frontend work, but links to the role stay general."
      weak: "Vague or generic answer on why frontend work that could apply to any job."
    followups:
      - "Tell me about an interface you are proud of."
      - "How do you keep up with how fast the frontend ecosystem moves?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.fs_why_fullstack"
    competency_key: motivation
    topic: "Why fullstack"
    difficulty: easy
    text: "You've chosen a fullstack path rather than specialising on one side. What attracts you to working across the whole stack?"
    expected_concepts:
      - "value of end-to-end ownership"
      - "examples of crossing the stack"
      - "awareness of the trade-off against depth"
    rubric:
      excellent: "Explains the appeal of owning a feature end to end with a real example, and is clear about where they are deeper and where they are still growing."
      good: "Gives relevant reasons and some concrete detail about why fullstack, but links to the role stay general."
      weak: "Vague or generic answer on why fullstack that could apply to any job."
    followups:
      - "Which side of the stack do you lean towards, and why?"
      - "How do you stay sharp on both sides?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.mob_why_mobile"
    competency_key: motivation
    topic: "Why mobile development"
    difficulty: easy
    text: "What got you into mobile development, and what keeps you there?"
    expected_concepts:
      - "origin of interest in mobile"
      - "unique constraints they enjoy such as devices, offline and battery"
      - "apps they have shipped"
    rubric:
      excellent: "Gives a clear origin story, names mobile-specific challenges they like solving, and refers to shipped apps with real usage."
      good: "Gives relevant reasons and some concrete detail about why mobile development, but links to the role stay general."
      weak: "Vague or generic answer on why mobile development that could apply to any job."
    followups:
      - "Which app are you most proud of shipping?"
      - "What do you find hardest about mobile compared with web?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.qa_why_quality"
    competency_key: motivation
    topic: "Why a quality career"
    difficulty: easy
    text: "What attracted you to a career in quality engineering and testing?"
    expected_concepts:
      - "reason for choosing quality work"
      - "view of the role's value"
      - "examples of impact on product quality"
    rubric:
      excellent: "Shows a deliberate choice of quality engineering, describes its value to the team in concrete terms, and gives an example where their work prevented or caught a real problem."
      good: "Gives relevant reasons and some concrete detail about why a quality career, but links to the role stay general."
      weak: "Vague or generic answer on why a quality career that could apply to any job."
    followups:
      - "Was there a moment that showed you why quality matters?"
      - "How would you describe your job to a developer who thinks testing is a bottleneck?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.be_what_excites_work"
    competency_key: motivation
    topic: "Day-to-day work they enjoy"
    difficulty: easy
    text: "Think about a typical good week in your current backend role. What are you doing that makes it a good week?"
    expected_concepts:
      - "specific activities"
      - "where they get energy"
      - "match with the new role"
    rubric:
      excellent: "Describes concrete activities such as designing an API or tuning a slow query, and shows the energy source maps to the work in this role."
      good: "Gives relevant reasons and some concrete detail about day-to-day work they enjoy, but links to the role stay general."
      weak: "Vague or generic answer on day-to-day work they enjoy that could apply to any job."
    followups:
      - "And what makes a bad week?"
      - "How much of that would you expect to find in this role?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.fe_what_excites_work"
    competency_key: motivation
    topic: "Satisfying frontend tasks"
    difficulty: easy
    text: "Which frontend tasks do you look forward to, and which ones do you put off?"
    expected_concepts:
      - "clear self-awareness about preferences"
      - "craft interests"
      - "ability to still deliver less-liked work"
    rubric:
      excellent: "Names real preferences for both sides, shows they still deliver the tasks they like less, and relates favourites to this role."
      good: "Gives relevant reasons and some concrete detail about satisfying frontend tasks, but links to the role stay general."
      weak: "Vague or generic answer on satisfying frontend tasks that could apply to any job."
    followups:
      - "How do you handle the tasks you put off?"
      - "Which of those would you do more of here?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.mob_pride_release"
    competency_key: motivation
    topic: "Proud mobile release"
    difficulty: easy
    text: "Tell me about a mobile release or feature you were really proud of. What made it satisfying?"
    expected_concepts:
      - "specific feature and their role"
      - "user impact or metric"
      - "what made it satisfying beyond shipping"
    rubric:
      excellent: "Chooses a concrete release, explains their own contribution and the user outcome, and says what satisfied them beyond just going live."
      good: "Gives relevant reasons and some concrete detail about proud mobile release, but links to the role stay general."
      weak: "Vague or generic answer on proud mobile release that could apply to any job."
    followups:
      - "What was the hardest part of that release?"
      - "What would you do differently now?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.qa_pride_catch"
    competency_key: motivation
    topic: "Proud quality contribution"
    difficulty: easy
    text: "Describe a time your testing work made a real difference to a release. What did you do, and how did it feel?"
    expected_concepts:
      - "specific defect, risk or process improvement"
      - "their method"
      - "effect on release or users"
    rubric:
      excellent: "Presents a specific example with their method and the measurable outcome, such as a prevented incident or faster release, and shows pride in the team result."
      good: "Gives relevant reasons and some concrete detail about proud quality contribution, but links to the role stay general."
      weak: "Vague or generic answer on proud quality contribution that could apply to any job."
    followups:
      - "How did you convince the team to act on it?"
      - "What did you learn from it?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.fs_pride_feature"
    competency_key: motivation
    topic: "Proud end-to-end feature"
    difficulty: easy
    text: "Tell me about a feature you took from idea to production across the stack. What part are you proudest of?"
    expected_concepts:
      - "scope of ownership"
      - "stack layers touched"
      - "user outcome"
      - "collaboration"
    rubric:
      excellent: "Describes true end-to-end ownership with specifics at several layers, and a user or business result they can name."
      good: "Gives relevant reasons and some concrete detail about proud end-to-end feature, but links to the role stay general."
      weak: "Vague or generic answer on proud end-to-end feature that could apply to any job."
    followups:
      - "Where did you get stuck along the way?"
      - "Who did you work with on it?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.be_current_role_change"
    competency_key: recruiter_fit
    topic: "Reasons for looking"
    difficulty: easy
    text: "What is making you look at new opportunities at the moment?"
    expected_concepts:
      - "forward-looking reasons"
      - "role-related drivers"
      - "no blame on others"
      - "fit with the new role"
    rubric:
      excellent: "Gives clear, constructive reasons focused on growth or scope, speaks respectfully about their current employer, and links the reasons to this role."
      good: "Gives relevant reasons and some concrete detail about reasons for looking, but links to the role stay general."
      weak: "Vague or generic answer on reasons for looking that could apply to any job."
    followups:
      - "What would need to be true in the next role for you to stay a long time?"
      - "What do you value in your current team that you want to keep?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.fe_role_scope"
    competency_key: recruiter_fit
    topic: "Interest in this frontend role"
    difficulty: easy
    text: "Looking at this frontend role, which responsibilities do you think you would enjoy most?"
    expected_concepts:
      - "knowledge of the job description"
      - "specific responsibilities"
      - "link to skills"
    rubric:
      excellent: "References specific responsibilities from the posting and explains why they suit their strengths, and also names an area they would learn."
      good: "Gives relevant reasons and some concrete detail about interest in this frontend role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this frontend role that could apply to any job."
    followups:
      - "Is there anything in the role you would want to know more about?"
      - "Which responsibility would stretch you most?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.mob_platform_pref"
    competency_key: motivation
    topic: "Platform and stack preferences"
    difficulty: medium
    text: "Mobile has native and cross-platform options. Where do your preferences sit, and how does that fit what we are building?"
    expected_concepts:
      - "clear stack preference with reasons"
      - "awareness of trade-offs"
      - "flexibility"
      - "fit with team stack"
    rubric:
      excellent: "States a considered preference with trade-offs, shows flexibility toward the team stack, and gives an example of picking up a new toolkit."
      good: "Gives relevant reasons and some concrete detail about platform and stack preferences, but links to the role stay general."
      weak: "Vague or generic answer on platform and stack preferences that could apply to any job."
    followups:
      - "When have you changed your mind about a tooling choice?"
      - "How quickly can you become productive on a stack that is new to you?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.qa_automation_manual"
    competency_key: motivation
    topic: "Automation versus exploration"
    difficulty: medium
    text: "Some quality engineers love automation and others prefer exploratory testing. Where do you find your own energy, and how do you balance the two?"
    expected_concepts:
      - "self-awareness"
      - "value of both approaches"
      - "example of balance"
      - "how they decide what to automate"
    rubric:
      excellent: "Shows a clear view of when each approach adds value, gives an example of choosing between them, and is open about their own leaning."
      good: "Gives relevant reasons and some concrete detail about automation versus exploration, but links to the role stay general."
      weak: "Vague or generic answer on automation versus exploration that could apply to any job."
    followups:
      - "What do you think teams get wrong about this balance?"
      - "Which would you want more of in this role?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.be_growth_next"
    competency_key: motivation
    topic: "Growth in backend"
    difficulty: medium
    text: "If you joined us, what would you hope to be better at in twelve months than you are today?"
    expected_concepts:
      - "specific skills"
      - "realistic plan"
      - "link to role's opportunities"
    rubric:
      excellent: "Names two or three concrete skills, explains how they would build them in this role, and sets a realistic marker for progress."
      good: "Gives relevant reasons and some concrete detail about growth in backend, but links to the role stay general."
      weak: "Vague or generic answer on growth in backend that could apply to any job."
    followups:
      - "How would you go about building that skill?"
      - "What would success look like for you at six months?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.fe_craft_interest"
    competency_key: motivation
    topic: "Frontend craft focus"
    difficulty: medium
    text: "Which area of frontend do you want to go deepest in over the next couple of years, and why?"
    expected_concepts:
      - "specific area such as performance, accessibility or architecture"
