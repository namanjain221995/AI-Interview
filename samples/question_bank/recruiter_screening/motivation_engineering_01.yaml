  - external_key: "recruiter_screening.motivation_engineering.fs_breadth_depth"
    competency_key: motivation
    topic: "Balancing breadth and depth"
    difficulty: medium
    text: "Fullstack people are asked to be good at many things. How do you decide where to go deep and where to stay broad?"
    expected_concepts:
      - "conscious strategy"
      - "examples of choices"
      - "awareness of trade-offs"
      - "link to team needs"
    rubric:
      excellent: "Describes a deliberate strategy tied to team needs, gives an example of going deep when it mattered, and is realistic about gaps."
      good: "Gives relevant reasons and some concrete detail about balancing breadth and depth, but links to the role stay general."
      weak: "Vague or generic answer on balancing breadth and depth that could apply to any job."
    followups:
      - "Where have you had to learn something quickly?"
      - "Where do you feel you are weaker?"
    common_errors:
      - "Gives a generic answer that is not tied to this kind of role."
      - "Talks only about what they want, not what they bring."

  - external_key: "recruiter_screening.motivation_engineering.mob_users_devices"
    competency_key: motivation
