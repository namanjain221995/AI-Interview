    rubric:
      excellent: "Shows real self-knowledge by naming a specific situation, frames the lesson constructively without blaming people, and explains how they would spot it earlier next time."
      good: "Gives relevant reasons and some concrete detail about work they would turn down, but links to the role stay general."
      weak: "Vague or generic answer on work they would turn down that could apply to any job."
    followups:
