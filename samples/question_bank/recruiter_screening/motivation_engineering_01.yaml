  - external_key: "recruiter_screening.motivation_engineering.be_what_to_avoid"
    competency_key: recruiter_fit
    topic: "Work they would turn down"
    difficulty: hard
    text: "Looking back at your career so far, is there a type of backend work or team situation you would now choose to avoid, and what made you realise it?"
    expected_concepts:
