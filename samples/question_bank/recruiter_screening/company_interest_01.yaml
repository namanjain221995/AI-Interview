# Curated questions: recruiter screening, company interest (01 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.company_interest.why_our_company
    competency_key: motivation
    topic: "Why our company"
    difficulty: easy
    text: "What drew you to our company in particular?"
    expected_concepts:
      - "specific reasons"
      - "research"
      - "link to goals"
      - "depth of reasoning"
    rubric:
      excellent: "Gives specific reasons grounded in research about the company's work and connects them to their goals."
      good: "Gives reasons that are somewhat specific."
      weak: "Gives reasons that could apply to any company."
    followups:
      - "What did you read or see?"
      - "What surprised you?"
    common_errors:
      - "Gives reasons that could apply to any company."

  - external_key: recruiter_screening.company_interest.first_heard
    competency_key: motivation
    topic: "How you found us"
    difficulty: easy
    text: "How did you first come across our company or product, and what stayed with you?"
    expected_concepts:
      - "candid origin"
      - "specific memory"
      - "interest"
      - "follow-up research"
    rubric:
      excellent: "Describes where they first met the company or product and what made them look further."
      good: "Gives a short origin."
      weak: "Cannot recall or says only a job board."
    followups:
      - "What did you look at next?"
      - "What stood out?"
    common_errors:
      - "Cannot recall or says only a job board."

  - external_key: recruiter_screening.company_interest.product_understanding
    competency_key: communication
    topic: "Describing what we do"
    difficulty: easy
    text: "In your own words, what does our company do and who is it for?"
    expected_concepts:
      - "accurate summary"
      - "customer understanding"
      - "clarity"
      - "research"
    rubric:
      excellent: "Gives an accurate, clear description including who the customers are and the problem solved."
      good: "Gives a basic accurate description."
      weak: "Misdescribes or only recites the tagline."
    followups:
      - "What is the value for customers?"
      - "What would you check?"
    common_errors:
      - "Misdescribes or only recites the tagline."

  - external_key: recruiter_screening.company_interest.research_done
    competency_key: motivation
    topic: "Preparing for this conversation"
    difficulty: easy
    text: "What did you do to learn about us before this conversation?"
    expected_concepts:
      - "specific sources"
      - "depth"
      - "insight"
      - "initiative"
    rubric:
      excellent: "Names specific sources, shares insights and shows curiosity beyond the website."
      good: "Mentions the website and one more source."
      weak: "Did no research."
    followups:
      - "What did you find interesting?"
      - "What was unclear?"
    common_errors:
      - "Did no research."

  - external_key: recruiter_screening.company_interest.industry_view
    competency_key: motivation
    topic: "The industry"
    difficulty: easy
    text: "What do you see as the biggest changes happening in our industry right now?"
    expected_concepts:
      - "informed view"
      - "specific trends"
      - "implications"
      - "reasoning"
    rubric:
      excellent: "Names specific changes, explains the effects on companies like ours and shows informed reasoning."
      good: "Names general trends."
      weak: "Repeats headlines or has no view."
    followups:
      - "Which affects us most?"
      - "Where did you read it?"
    common_errors:
      - "Repeats headlines or has no view."

  - external_key: recruiter_screening.company_interest.competitor_awareness
    competency_key: problem_solving
    topic: "Alternatives"
    difficulty: medium
    text: "Who do you think are our main alternatives, and how do we differ?"
    expected_concepts:
      - "competitor knowledge"
      - "differentiators"
      - "fairness"
      - "analysis"
    rubric:
      excellent: "Names real alternatives and gives a thoughtful comparison of differences."
      good: "Names competitors with limited comparison."
      weak: "Cannot name any or only criticises."
    followups:
      - "What would you learn more about?"
      - "What could we learn from them?"
    common_errors:
      - "Cannot name any or only criticises."

  - external_key: recruiter_screening.company_interest.product_experience
    competency_key: communication
    topic: "Using the product"
    difficulty: easy
    text: "Have you used our product or a similar one? What was your experience as a user?"
    expected_concepts:
      - "first-hand experience"
      - "specific observations"
      - "constructive feedback"
      - "user view"
    rubric:
      excellent: "Gives specific observations from use with constructive suggestions."
      good: "Gives general impressions."
      weak: "Has not tried it and made no effort."
    followups:
      - "What would you change?"
      - "What worked well?"
    common_errors:
      - "Has not tried it and made no effort."

  - external_key: recruiter_screening.company_interest.mission_connection
    competency_key: motivation
    topic: "Connection to the mission"
    difficulty: easy
    text: "What about our mission or purpose connects with the work you want to do?"
    expected_concepts:
      - "specific connection"
      - "reasoning"
      - "link to experience"
      - "clarity"
    rubric:
      excellent: "Links the mission to specific work and experiences they care about."
      good: "States that the mission is interesting."
      weak: "Gives a generic answer."
    followups:
      - "Where have you seen it?"
      - "How does this role contribute?"
    common_errors:
      - "Gives a generic answer."

  - external_key: recruiter_screening.company_interest.questions_about_company
    competency_key: communication
    topic: "Your questions"
    difficulty: easy
    text: "What questions do you have about the company that would help you decide?"
    expected_concepts:
      - "relevant questions"
      - "priorities"
      - "research"
      - "curiosity"
    rubric:
      excellent: "Asks thoughtful questions about team, challenges and expectations that show preparation."
      good: "Asks general questions."
      weak: "Asks nothing or only about perks."
    followups:
      - "Why is that important?"
      - "What else would you ask?"
    common_errors:
      - "Asks nothing or only about perks."

  - external_key: recruiter_screening.company_interest.company_challenge_view
    competency_key: problem_solving
    topic: "Challenges we face"
    difficulty: hard
    text: "From the outside, what challenges do you think companies like ours face, and where might this role help?"
    expected_concepts:
      - "informed view"
      - "role link"
      - "reasoning"
      - "openness to learning"
    rubric:
      excellent: "Identifies plausible challenges, links them to the role and acknowledges what they cannot see from outside."
      good: "Names general challenges."
      weak: "Offers criticism with no reasoning."
    followups:
      - "What would you want to learn?"
      - "What would you do first?"
    common_errors:
      - "Offers criticism with no reasoning."

  - external_key: recruiter_screening.company_interest.company_values_fit
    competency_key: culture_values
    topic: "Working values"
    difficulty: medium
    text: "We value things like clear ownership and learning from mistakes. What does that mean to you in practice?"
    expected_concepts:
      - "interpretation"
      - "examples"
      - "behaviour"
      - "reflection"
    rubric:
      excellent: "Interprets the values through concrete work behaviours and gives a real example."
      good: "Agrees and gives general meaning."
      weak: "Repeats the words without meaning."
    followups:
      - "Show me an example."
      - "How do you handle it when values conflict?"
    common_errors:
      - "Repeats the words without meaning."

  - external_key: recruiter_screening.company_interest.interested_in_team
    competency_key: collaboration
    topic: "The team"
    difficulty: easy
    text: "What would you like to learn about the team you would join?"
    expected_concepts:
      - "specific topics"
      - "interest in collaboration"
      - "practicality"
      - "preparation"
    rubric:
      excellent: "Asks about roles, ways of working and growth that matter to doing the job."
      good: "Asks about the team generally."
      weak: "Has no interest in the team."
    followups:
      - "Why is that important?"
      - "How would you find out?"
    common_errors:
      - "Has no interest in the team."

  - external_key: recruiter_screening.company_interest.growth_in_company_stage
    competency_key: adaptability
    topic: "Stage of the company"
    difficulty: medium
    text: "What do you think working at a company at our stage is like, and how does that suit you?"
    expected_concepts:
      - "understanding of stage"
      - "reasoning"
      - "suitability"
      - "adaptability"
    rubric:
      excellent: "Describes the characteristics of the stage, gives examples of prior similar settings and explains the fit."
      good: "Describes the stage in general."
      weak: "Has no view of the stage."
    followups:
      - "What is exciting?"
      - "What is hard?"
    common_errors:
      - "Has no view of the stage."

  - external_key: recruiter_screening.company_interest.reputation_view
    competency_key: communication
    topic: "What you have heard"
    difficulty: medium
    text: "What have you heard about our company, and how did you check what is accurate?"
    expected_concepts:
      - "sources"
      - "critical thinking"
      - "balance"
      - "openness"
    rubric:
      excellent: "Names sources, weighs them critically and shows balanced judgement."
      good: "Mentions things they heard."
      weak: "Repeats rumours uncritically."
    followups:
      - "What would you like to confirm?"
      - "Who could tell you more?"
    common_errors:
      - "Repeats rumours uncritically."

  - external_key: recruiter_screening.company_interest.customers_perspective
    competency_key: problem_solving
    topic: "Our customers"
    difficulty: medium
    text: "If you were one of our customers, what would matter most to you?"
    expected_concepts:
      - "customer empathy"
      - "specific needs"
      - "reasoning"
      - "link to role"
    rubric:
      excellent: "Describes specific customer needs and explains how the role affects them."
      good: "Describes general needs."
      weak: "Cannot think from a customer view."
    followups:
      - "What would frustrate you?"
      - "How would you find out?"
    common_errors:
      - "Cannot think from a customer view."

  - external_key: recruiter_screening.company_interest.company_news
    competency_key: motivation
    topic: "Recent developments"
    difficulty: easy
    text: "Have you followed any recent news or announcements about us? What did you take from it?"
    expected_concepts:
      - "current knowledge"
      - "interpretation"
      - "relevance"
      - "curiosity"
    rubric:
      excellent: "Names recent developments and interprets them for the company and role."
      good: "Mentions news without interpretation."
      weak: "Has not seen any."
    followups:
      - "What question does it raise?"
      - "How does it affect this role?"
    common_errors:
      - "Has not seen any."

  - external_key: recruiter_screening.company_interest.role_in_company
    competency_key: recruiter_fit
    topic: "The role's place"
    difficulty: medium
    text: "Where do you think this role sits in the wider company, and who benefits from its work?"
    expected_concepts:
      - "organisational understanding"
      - "reasoning"
      - "stakeholders"
      - "curiosity"
    rubric:
      excellent: "Describes the role's links to other teams and customers and flags what to confirm."
      good: "Describes the role in isolation."
      weak: "Has no idea."
    followups:
      - "Who would you work with?"
      - "What would you ask?"
    common_errors:
      - "Has no idea."

  - external_key: recruiter_screening.company_interest.sector_experience
    competency_key: recruiter_fit
    topic: "Experience in our field"
    difficulty: medium
    text: "What from your experience in this or a related field would help you here?"
    expected_concepts:
      - "relevant experience"
      - "transferable lessons"
      - "evidence"
      - "openness to learning"
    rubric:
      excellent: "Names relevant experience with lessons and acknowledges what is different."
      good: "Names some experience."
      weak: "Claims experience without detail."
    followups:
      - "What would be new to you?"
      - "How would you learn it?"
    common_errors:
      - "Claims experience without detail."

  - external_key: recruiter_screening.company_interest.what_you_hope_to_find
    competency_key: motivation
    topic: "What you hope to find"
    difficulty: easy
    text: "What are you hoping to find in the company you join next?"
    expected_concepts:
      - "clear criteria"
      - "job-related"
      - "link to this company"
      - "realism"
    rubric:
      excellent: "Names job-related criteria and explains how this company appears to meet them."
      good: "Names criteria generally."
      weak: "Names only perks."
    followups:
      - "What is non-negotiable?"
      - "What would be a warning sign?"
    common_errors:
      - "Names only perks."

  - external_key: recruiter_screening.company_interest.company_strength_from_outside
    competency_key: communication
    topic: "Strengths you see"
    difficulty: medium
    text: "What do you see as our strongest points from the outside?"
    expected_concepts:
      - "specific strengths"
      - "evidence"
      - "balance"
      - "analysis"
    rubric:
      excellent: "Names specific strengths with evidence and sensible reasoning."
      good: "Names a couple of strengths."
      weak: "Offers flattery only."
    followups:
      - "What would you want to verify?"
      - "What opportunity do you see?"
    common_errors:
      - "Offers flattery only."

  - external_key: recruiter_screening.company_interest.constructive_product_idea
    competency_key: problem_solving
    topic: "An idea for the product"
    difficulty: hard
    text: "If you had one idea to improve what we offer, what would it be and how would you test it?"
    expected_concepts:
      - "specific idea"
      - "user benefit"
      - "reasoning"
      - "validation plan"
    rubric:
      excellent: "Offers a specific idea with user benefit and a plan to test it, acknowledging missing context."
      good: "Offers an idea with limited reasoning."
      weak: "Offers a vague or purely critical idea."
    followups:
      - "Who would you ask first?"
      - "How would you measure it?"
    common_errors:
      - "Offers a vague or purely critical idea."

  - external_key: recruiter_screening.company_interest.engineering_culture_curiosity
    competency_key: culture_values
    topic: "How the work is done"
    difficulty: medium
    text: "What would you like to understand about how the team does its work?"
    expected_concepts:
      - "relevant topics"
      - "practices"
      - "priorities"
      - "preparation"
    rubric:
      excellent: "Asks about practices that affect daily work, such as review, planning and quality."
      good: "Asks general questions."
      weak: "Asks nothing relevant."
    followups:
      - "Why does it matter?"
      - "What good looks like to you?"
    common_errors:
      - "Asks nothing relevant."

  - external_key: recruiter_screening.company_interest.brand_perception
    competency_key: communication
    topic: "How you see the brand"
    difficulty: easy
    text: "How would you describe our brand or reputation to a friend?"
    expected_concepts:
      - "clear description"
      - "accuracy"
      - "fairness"
      - "research"
    rubric:
      excellent: "Describes the brand accurately and fairly, using concrete examples."
      good: "Gives a brief description."
      weak: "Gives vague or inaccurate description."
    followups:
      - "What did you base this on?"
      - "What would you change?"
    common_errors:
      - "Gives vague or inaccurate description."

  - external_key: recruiter_screening.company_interest.learning_opportunities_here
    competency_key: motivation
    topic: "What you could learn here"
    difficulty: medium
    text: "What do you think you could learn here that you could not learn elsewhere?"
    expected_concepts:
      - "specific learning"
      - "link to company"
      - "reasoning"
      - "evidence"
    rubric:
      excellent: "Identifies specific learning opportunities linked to the company's work and context."
      good: "Names general learning."
      weak: "Cannot name any."
    followups:
      - "How do you know this?"
      - "What would you ask us?"
    common_errors:
      - "Cannot name any."

  - external_key: recruiter_screening.company_interest.team_questions_priority
    competency_key: communication
    topic: "Top question"
    difficulty: easy
    text: "If you could only ask one question about the company today, what would it be?"
    expected_concepts:
      - "prioritisation"
      - "relevance"
      - "insight"
      - "clarity"
    rubric:
      excellent: "Asks one sharp question that reveals their priorities and shows preparation."
      good: "Asks a reasonable question."
      weak: "Asks something answered on the website."
    followups:
      - "Why that one?"
      - "What would the answer change?"
    common_errors:
      - "Asks something answered on the website."
