version: 1
defaults:
  role_tags: [product_manager, project_manager, business_analyst, ux_designer, support_engineer]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_product_business.pm_next"
    competency_key: motivation
    topic: "Growth in product"
    difficulty: easy
    text: "Which product skills are you most keen to develop next?"
    expected_concepts:
      - "specific skills such as strategy, data or technical depth"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific skills and a plan tied to the role."
      good: "Gives relevant reasons and some concrete detail about growth in product, but links to the role stay general."
      weak: "Vague or generic answer on growth in product that could apply to any job."
    followups:
      - "What have you tried?"
      - "How could this role help?"
    common_errors:
      - "Vague answers."

  - external_key: "recruiter_screening.motivation_product_business.proj_next"
    competency_key: motivation
    topic: "Growth in delivery"
    difficulty: easy
    text: "What do you want to get better at in project or programme delivery?"
    expected_concepts:
      - "skills such as estimation or stakeholder management"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific skills and how they will build them."
      good: "Gives relevant reasons and some concrete detail about growth in delivery, but links to the role stay general."
      weak: "Vague or generic answer on growth in delivery that could apply to any job."
    followups:
      - "What will you practise?"
      - "Who could help?"
    common_errors:
      - "Listing certifications."

  - external_key: "recruiter_screening.motivation_product_business.ba_next"
    competency_key: motivation
    topic: "Growth in analysis"
    difficulty: easy
    text: "What skills do you want to build next as a business analyst?"
    expected_concepts:
      - "skills such as data analysis or process modelling"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names specific skills and links them to the role."
      good: "Gives relevant reasons and some concrete detail about growth in analysis, but links to the role stay general."
      weak: "Vague or generic answer on growth in analysis that could apply to any job."
    followups:
      - "What are you doing now?"
      - "How would you apply it here?"
    common_errors:
      - "No plan."

  - external_key: "recruiter_screening.motivation_product_business.support_next"
    competency_key: motivation
    topic: "Growth in support"
    difficulty: easy
    text: "In your support work, which area of technical depth or customer handling would you most like to strengthen next?"
    expected_concepts:
      - "technical depth, escalation, customer success"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names a direction with actions and links to the role."
      good: "Gives relevant reasons and some concrete detail about growth in support, but links to the role stay general."
      weak: "Vague or generic answer on growth in support that could apply to any job."
    followups:
      - "What technical area are you curious about?"
      - "Who would you learn from?"
    common_errors:
      - "No direction."

  - external_key: "recruiter_screening.motivation_product_business.pm_scope"
    competency_key: recruiter_fit
    topic: "Interest in this product role"
    difficulty: easy
    text: "What about this product role is most interesting to you?"
    expected_concepts:
      - "read posting"
      - "product and users"
      - "responsibilities"
      - "experience"
    rubric:
      excellent: "Cites specific parts of the role and product and links them to experience."
      good: "Gives relevant reasons and some concrete detail about interest in this product role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this product role that could apply to any job."
    followups:
      - "What questions about the product do you have?"
      - "What would you want to own?"
    common_errors:
      - "Not having looked at the product."

  - external_key: "recruiter_screening.motivation_product_business.proj_scope"
    competency_key: recruiter_fit
    topic: "Interest in this delivery role"
    difficulty: easy
    text: "Reading this delivery job description, which projects and responsibilities would you look forward to most?"
    expected_concepts:
      - "read posting"
      - "type of projects"
      - "methods"
      - "experience"
    rubric:
      excellent: "Refers to specific projects and methods in the posting."
      good: "Gives relevant reasons and some concrete detail about interest in this delivery role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this delivery role that could apply to any job."
    followups:
      - "What methods do you prefer?"
      - "What would you ask about the portfolio?"
    common_errors:
      - "Generic project management talk."

  - external_key: "recruiter_screening.motivation_product_business.ba_scope"
    competency_key: recruiter_fit
    topic: "Interest in this analyst role"
    difficulty: easy
    text: "What interests you about this business analyst role?"
    expected_concepts:
      - "read posting"
      - "domain"
      - "responsibilities"
      - "experience"
    rubric:
      excellent: "Cites responsibilities and domain and links them to experience."
      good: "Gives relevant reasons and some concrete detail about interest in this analyst role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this analyst role that could apply to any job."
    followups:
      - "What domain knowledge do you have?"
      - "What do you want to learn?"
    common_errors:
      - "Not knowing the domain."

  - external_key: "recruiter_screening.motivation_product_business.ux_scope"
    competency_key: recruiter_fit
    topic: "Interest in this design role"
    difficulty: easy
    text: "What about this design role made you want to apply?"
    expected_concepts:
      - "read posting"
      - "product"
      - "research and design mix"
      - "experience"
    rubric:
      excellent: "Refers to the product and the role's mix of research and design with matching experience."
      good: "Gives relevant reasons and some concrete detail about interest in this design role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this design role that could apply to any job."
    followups:
      - "What have you looked at in our product?"
      - "What would you improve first?"
    common_errors:
      - "No product knowledge."

  - external_key: "recruiter_screening.motivation_product_business.support_scope"
    competency_key: recruiter_fit
    topic: "Interest in this support role"
    difficulty: easy
    text: "What do you understand about the support work in this role and what interests you?"
    expected_concepts:
      - "read posting"
      - "products"
      - "customers"
      - "tools"
      - "experience"
    rubric:
      excellent: "Describes the support environment accurately and relates it to experience."
      good: "Gives relevant reasons and some concrete detail about interest in this support role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this support role that could apply to any job."
    followups:
      - "What products do you know?"
      - "How do you learn a new product?"
    common_errors:
      - "Unclear on the product."

  - external_key: "recruiter_screening.motivation_product_business.pm_team"
    competency_key: recruiter_fit
    topic: "Working with engineering"
    difficulty: easy
    text: "How do you like to work with engineers and designers day to day as a product manager?"
    expected_concepts:
      - "collaboration"
      - "shared context"
      - "trust"
      - "examples"
    rubric:
      excellent: "Gives concrete habits such as joint discovery and open priorities with an example."
      good: "Gives relevant reasons and some concrete detail about working with engineering, but links to the role stay general."
      weak: "Vague or generic answer on working with engineering that could apply to any job."
    followups:
      - "How do you handle a disagreement?"
      - "How do you involve engineers early?"
    common_errors:
      - "Treating engineers as implementers."

  - external_key: "recruiter_screening.motivation_product_business.proj_team"
    competency_key: recruiter_fit
    topic: "Working with teams"
    difficulty: easy
    text: "How do you build good working relationships with teams you coordinate but do not manage?"
    expected_concepts:
      - "trust"
      - "clarity"
      - "communication"
      - "influence"
      - "examples"
    rubric:
      excellent: "Describes influencing without authority through clarity and respect, with an example."
      good: "Gives relevant reasons and some concrete detail about working with teams, but links to the role stay general."
      weak: "Vague or generic answer on working with teams that could apply to any job."
    followups:
      - "How do you handle a team that misses commitments?"
      - "What do you ask of them?"
    common_errors:
      - "Relying on escalation."

  - external_key: "recruiter_screening.motivation_product_business.ba_team"
    competency_key: recruiter_fit
    topic: "Working with delivery teams"
    difficulty: easy
    text: "How do you work with developers and testers once requirements are agreed?"
    expected_concepts:
      - "ongoing clarification"
      - "acceptance criteria"
      - "changes"
      - "examples"
    rubric:
      excellent: "Describes staying involved after handoff, with an example of managing a change."
      good: "Gives relevant reasons and some concrete detail about working with delivery teams, but links to the role stay general."
      weak: "Vague or generic answer on working with delivery teams that could apply to any job."
    followups:
      - "How do you handle changes late in delivery?"
      - "What do you do in UAT?"
    common_errors:
      - "Throwing documents over the wall."

  - external_key: "recruiter_screening.motivation_product_business.ux_team"
    competency_key: recruiter_fit
    topic: "Working with product"
    difficulty: easy
    text: "How do you work with product managers to decide what to design?"
    expected_concepts:
      - "alignment"
      - "discovery"
      - "trade-offs"
      - "examples"
    rubric:
      excellent: "Describes shared discovery and an example of influencing priorities."
      good: "Gives relevant reasons and some concrete detail about working with product, but links to the role stay general."
      weak: "Vague or generic answer on working with product that could apply to any job."
    followups:
      - "How do you handle conflicting priorities?"
      - "How do you show the value of research?"
    common_errors:
      - "Waiting for a brief."

  - external_key: "recruiter_screening.motivation_product_business.support_team"
    competency_key: recruiter_fit
    topic: "Working with engineering"
    difficulty: easy
    text: "How do you work with engineers when you escalate a customer issue?"
    expected_concepts:
      - "clear reports"
      - "reproduction steps"
      - "follow-up"
      - "relationships"
      - "example"
    rubric:
      excellent: "Describes crisp escalations with evidence and follow-up, with an example."
      good: "Gives relevant reasons and some concrete detail about working with engineering, but links to the role stay general."
      weak: "Vague or generic answer on working with engineering that could apply to any job."
    followups:
      - "What goes in a good escalation?"
      - "How do you follow up?"
    common_errors:
      - "Forwarding tickets without detail."

  - external_key: "recruiter_screening.motivation_product_business.pm_metrics_motivation"
    competency_key: motivation
    topic: "Working with data"
    difficulty: medium
    text: "How do you use data in your product decisions, and why does that matter to you?"
    expected_concepts:
      - "metrics"
      - "experiments"
      - "qualitative evidence"
      - "examples"
      - "limits"
    rubric:
      excellent: "Gives an example of using data and acknowledges its limits."
      good: "Gives relevant reasons and some concrete detail about working with data, but links to the role stay general."
      weak: "Vague or generic answer on working with data that could apply to any job."
    followups:
      - "Tell me about a metric that misled you."
      - "What data do you check weekly?"
    common_errors:
      - "Relying on one number."

  - external_key: "recruiter_screening.motivation_product_business.proj_methods"
    competency_key: motivation
    topic: "Methods preference"
    difficulty: medium
    text: "Which delivery approaches have you worked with, and how do you choose between them?"
    expected_concepts:
      - "agile and other methods"
      - "reasons"
      - "adaptation"
      - "examples"
    rubric:
      excellent: "Compares approaches from experience and describes choosing by context."
      good: "Gives relevant reasons and some concrete detail about methods preference, but links to the role stay general."
      weak: "Vague or generic answer on methods preference that could apply to any job."
    followups:
      - "When did a method not fit?"
      - "How do you adjust a process?"
    common_errors:
      - "Dogmatic."

  - external_key: "recruiter_screening.motivation_product_business.ba_process_interest"
    competency_key: motivation
    topic: "Process improvement"
    difficulty: medium
    text: "What do you enjoy about improving a business process, and what is an example you led or supported?"
    expected_concepts:
      - "process mapping"
      - "pain points"
      - "metrics"
      - "change"
      - "example"
    rubric:
      excellent: "Gives an example with a measured improvement and user adoption."
      good: "Gives relevant reasons and some concrete detail about process improvement, but links to the role stay general."
      weak: "Vague or generic answer on process improvement that could apply to any job."
    followups:
      - "How did you measure the improvement?"
      - "How did users respond?"
    common_errors:
      - "Mapping without changing anything."

  - external_key: "recruiter_screening.motivation_product_business.ux_systems"
    competency_key: motivation
    topic: "Design systems"
    difficulty: medium
    text: "How do you feel about working within a design system, and what have you contributed to one?"
    expected_concepts:
      - "consistency"
      - "contributions"
      - "trade-offs"
      - "collaboration"
      - "example"
    rubric:
      excellent: "Describes using and contributing to a system with an example of a justified change."
      good: "Gives relevant reasons and some concrete detail about design systems, but links to the role stay general."
      weak: "Vague or generic answer on design systems that could apply to any job."
    followups:
      - "When did you break the system?"
      - "How do you propose changes?"
    common_errors:
      - "Resisting all constraints."

  - external_key: "recruiter_screening.motivation_product_business.support_product_knowledge"
    competency_key: motivation
    topic: "Product depth"
    difficulty: medium
    text: "How do you build a deep understanding of the products you support?"
    expected_concepts:
      - "hands-on testing"
      - "documentation"
      - "peers"
      - "engineers"
      - "examples"
    rubric:
      excellent: "Describes hands-on learning and sharing, with an example."
      good: "Gives relevant reasons and some concrete detail about product depth, but links to the role stay general."
      weak: "Vague or generic answer on product depth that could apply to any job."
    followups:
      - "How do you learn a new feature?"
      - "How do you share knowledge?"
    common_errors:
      - "Reading scripts only."

  - external_key: "recruiter_screening.motivation_product_business.pm_stakeholder"
    competency_key: motivation
    topic: "Managing expectations"
    difficulty: medium
    text: "Tell me about a time you had to manage senior stakeholders who wanted something you could not deliver."
    expected_concepts:
      - "situation"
      - "communication"
      - "alternatives"
      - "outcome"
    rubric:
      excellent: "Describes clear communication of constraints with alternatives and a good outcome."
      good: "Gives relevant reasons and some concrete detail about managing expectations, but links to the role stay general."
      weak: "Vague or generic answer on managing expectations that could apply to any job."
    followups:
      - "What did you offer them?"
      - "How did the relationship change?"
    common_errors:
      - "Overpromising."

  - external_key: "recruiter_screening.motivation_product_business.proj_change"
    competency_key: motivation
    topic: "Changing scope"
    difficulty: medium
    text: "Tell me about a time scope changed mid-project. How did you handle it and what did it teach you?"
    expected_concepts:
      - "situation"
      - "impact assessment"
      - "communication"
      - "decision"
      - "learning"
    rubric:
      excellent: "Describes assessing impact, transparent communication and a clear decision."
      good: "Gives relevant reasons and some concrete detail about changing scope, but links to the role stay general."
      weak: "Vague or generic answer on changing scope that could apply to any job."
    followups:
      - "How did you re-plan?"
      - "How did you keep the team aligned?"
    common_errors:
      - "Absorbing changes silently."

  - external_key: "recruiter_screening.motivation_product_business.ba_conflict"
    competency_key: motivation
    topic: "Resolving requirement conflicts"
    difficulty: medium
    text: "Tell me about a time two stakeholders had conflicting requirements. How did you help them decide?"
    expected_concepts:
      - "situation"
      - "facilitation"
      - "options"
      - "decision"
      - "result"
    rubric:
      excellent: "Describes facilitation, options and a documented decision."
      good: "Gives relevant reasons and some concrete detail about resolving requirement conflicts, but links to the role stay general."
      weak: "Vague or generic answer on resolving requirement conflicts that could apply to any job."
    followups:
      - "What did you document?"
      - "What would you do differently?"
    common_errors:
      - "Choosing arbitrarily."

  - external_key: "recruiter_screening.motivation_product_business.ux_ambiguity"
    competency_key: motivation
    topic: "Ambiguous briefs"
    difficulty: hard
    text: "Design briefs are sometimes vague. Tell me about a time you worked from an unclear brief and what you did."
    expected_concepts:
      - "clarifying"
      - "research"
      - "assumptions"
      - "alignment"
      - "result"
    rubric:
      excellent: "Describes framing the problem, testing assumptions and aligning with stakeholders."
      good: "Gives relevant reasons and some concrete detail about ambiguous briefs, but links to the role stay general."
      weak: "Vague or generic answer on ambiguous briefs that could apply to any job."
    followups:
      - "What assumptions did you test?"
      - "How did you share progress?"
    common_errors:
      - "Designing in isolation."

  - external_key: "recruiter_screening.motivation_product_business.support_pressure"
    competency_key: motivation
    topic: "High volume pressure"
    difficulty: hard
    text: "Tell me about a period of very high ticket volume or a major incident. How did you work through it and what did you learn?"
    expected_concepts:
      - "prioritisation"
      - "communication"
      - "teamwork"
      - "follow-up"
      - "learning"
    rubric:
      excellent: "Describes triage, communication and lasting process improvements."
      good: "Gives relevant reasons and some concrete detail about high volume pressure, but links to the role stay general."
      weak: "Vague or generic answer on high volume pressure that could apply to any job."
    followups:
      - "What did you do for customers who waited?"
      - "What process changed?"
    common_errors:
      - "Hero narratives."

  - external_key: "recruiter_screening.motivation_product_business.pm_long_term"
    competency_key: motivation
    topic: "Long-term path"
    difficulty: hard
    text: "Product careers can lead to leadership, specialist or founder-type paths. Where do you see yourself and why?"
    expected_concepts:
      - "self-awareness"
      - "reasoning"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Names a direction with evidence from experience and ties it to the role."
      good: "Gives relevant reasons and some concrete detail about long-term path, but links to the role stay general."
      weak: "Vague or generic answer on long-term path that could apply to any job."
    followups:
      - "What evidence supports it?"
      - "What would change your mind?"
    common_errors:
      - "No view."
