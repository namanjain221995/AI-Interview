version: 1
defaults:
  role_tags: [backend, frontend, fullstack, mobile, qa]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_engineering.be_best_project"
    competency_key: motivation
    topic: "Best backend project"
    difficulty: easy
    text: "What is the best backend project you have worked on, and what made it great?"
    expected_concepts:
      - "specific project"
      - "their contribution"
      - "technical challenge"
      - "what made it satisfying"
    rubric:
      excellent: "Describes a project with specifics and their own role and explains what made it satisfying."
      good: "Gives relevant reasons and some concrete detail about best backend project, but links to the role stay general."
      weak: "Vague or generic answer on best backend project that could apply to any job."
    followups:
      - "What would you improve in it today?"
      - "What did the team do well?"
    common_errors:
      - "Describing the team's work without their own part."

  - external_key: "recruiter_screening.motivation_engineering.fe_best_project"
    competency_key: motivation
    topic: "Best frontend project"
    difficulty: easy
    text: "Tell me about the frontend project you enjoyed most. What made it stand out?"
    expected_concepts:
      - "project context"
      - "their contribution"
      - "user value"
      - "enjoyment factors"
    rubric:
      excellent: "Describes their contribution and the user value and explains clearly what made the work enjoyable."
      good: "Gives relevant reasons and some concrete detail about best frontend project, but links to the role stay general."
      weak: "Vague or generic answer on best frontend project that could apply to any job."
    followups:
      - "What was the hardest design or technical decision?"
      - "What would you change?"
    common_errors:
      - "Listing technologies only."

  - external_key: "recruiter_screening.motivation_engineering.fs_best_project"
    competency_key: motivation
    topic: "Best fullstack project"
    difficulty: easy
    text: "Which fullstack project are you proudest of, and what part of the stack did you enjoy most while building it?"
    expected_concepts:
      - "project scope"
      - "layers touched"
      - "learning"
      - "enjoyment"
    rubric:
      excellent: "Shows they handled several layers, names an enjoyable part with reasons, and reflects on learning."
      good: "Gives relevant reasons and some concrete detail about best fullstack project, but links to the role stay general."
      weak: "Vague or generic answer on best fullstack project that could apply to any job."
    followups:
      - "Which layer was hardest?"
      - "What would you automate next time?"
    common_errors:
      - "Staying vague about the layers they worked on."

  - external_key: "recruiter_screening.motivation_engineering.mob_best_project"
    competency_key: motivation
    topic: "Best mobile project"
    difficulty: easy
    text: "Tell me about the mobile app or feature you've enjoyed building the most."
    expected_concepts:
      - "context and users"
      - "their contribution"
      - "mobile challenges"
      - "enjoyment"
    rubric:
      excellent: "Presents a specific app or feature, their contribution, a mobile-specific challenge and what made it enjoyable."
      good: "Gives relevant reasons and some concrete detail about best mobile project, but links to the role stay general."
      weak: "Vague or generic answer on best mobile project that could apply to any job."
    followups:
      - "How did you test it on real devices?"
      - "What feedback did you get from users?"
    common_errors:
      - "Describing visual features without technical or user detail."

  - external_key: "recruiter_screening.motivation_engineering.qa_best_project"
    competency_key: motivation
    topic: "Best quality project"
    difficulty: easy
    text: "What is the quality project or initiative you've found the most rewarding, and why?"
    expected_concepts:
      - "initiative and goals"
      - "their method"
      - "result"
      - "reasons for satisfaction"
    rubric:
      excellent: "Describes a concrete initiative with a measured result and clear reasons for satisfaction."
      good: "Gives relevant reasons and some concrete detail about best quality project, but links to the role stay general."
      weak: "Vague or generic answer on best quality project that could apply to any job."
    followups:
      - "How did you measure the result?"
      - "Who did you work with?"
    common_errors:
      - "Describing activity without outcome."

  - external_key: "recruiter_screening.motivation_engineering.be_dislike_work"
    competency_key: motivation
    topic: "Work that drains them"
    difficulty: easy
    text: "Is there any kind of backend task that drains you, and how do you deal with it when it has to be done?"
    expected_concepts:
      - "self-awareness"
      - "coping approach"
      - "reliability on less-liked tasks"
      - "automation mindset"
    rubric:
      excellent: "Names a real example without complaining and shows professional methods for getting it done."
      good: "Gives relevant reasons and some concrete detail about work that drains them, but links to the role stay general."
      weak: "Vague or generic answer on work that drains them that could apply to any job."
    followups:
      - "Do you try to automate it?"
      - "How do you make sure it still gets done well?"
    common_errors:
      - "Saying nothing drains them."

  - external_key: "recruiter_screening.motivation_engineering.fe_dislike_work"
    competency_key: motivation
    topic: "Less appealing frontend tasks"
    difficulty: easy
    text: "Every role has tasks that are less exciting. What are the ones in frontend work for you, and how do you handle them?"
    expected_concepts:
      - "self-awareness"
      - "professionalism"
      - "examples such as browser bugs or legacy code"
      - "ways to make them easier"
    rubric:
      excellent: "Names tasks openly, describes a practical way of dealing with them and shows how they improve tooling."
      good: "Gives relevant reasons and some concrete detail about less appealing frontend tasks, but links to the role stay general."
      weak: "Vague or generic answer on less appealing frontend tasks that could apply to any job."
    followups:
      - "Have you ever made one of those tasks better for everyone?"
      - "How do you keep standards up?"
    common_errors:
      - "Complaining without any strategy."

  - external_key: "recruiter_screening.motivation_engineering.mob_why_leave"
    competency_key: recruiter_fit
    topic: "What they would change"
    difficulty: easy
    text: "If you could change one thing about the way your current team builds mobile apps, what would it be?"
    expected_concepts:
      - "constructive critique"
      - "understanding of root causes"
      - "fit with the new environment"
    rubric:
      excellent: "Gives a specific, constructive point and shows they have tried to influence it."
      good: "Gives relevant reasons and some concrete detail about what they would change, but links to the role stay general."
      weak: "Vague or generic answer on what they would change that could apply to any job."
    followups:
      - "How have you tried to change it?"
      - "What would you want to find in the new place?"
    common_errors:
      - "Complaining about people."

  - external_key: "recruiter_screening.motivation_engineering.qa_start_date"
    competency_key: recruiter_fit
    topic: "Timeline for a move"
    difficulty: easy
    text: "What would an ideal next step look like for you in terms of timing and what you want to have in place before you move?"
    expected_concepts:
      - "clear and practical timeline"
      - "handover responsibility"
      - "flexibility"
    rubric:
      excellent: "Speaks about a practical timeline and responsible handover without needing to share personal circumstances."
      good: "Gives relevant reasons and some concrete detail about timeline for a move, but links to the role stay general."
      weak: "Vague or generic answer on timeline for a move that could apply to any job."
    followups:
      - "What would you want to finish at your current role?"
      - "How do you manage handovers?"
    common_errors:
      - "Sharing private details that are unnecessary."

  - external_key: "recruiter_screening.motivation_engineering.be_remote_pref"
    competency_key: recruiter_fit
    topic: "Work arrangement"
    difficulty: easy
    text: "How do you do your best backend work in terms of environment, for example remote, hybrid or on-site, and how does that fit what this role offers?"
    expected_concepts:
      - "preferences related to the job's arrangement"
      - "flexibility"
      - "practical habits"
    rubric:
      excellent: "States their preference briefly, shows flexibility toward what the role offers and explains habits that support it."
      good: "Gives relevant reasons and some concrete detail about work arrangement, but links to the role stay general."
      weak: "Vague or generic answer on work arrangement that could apply to any job."
    followups:
      - "What habits help you stay productive?"
      - "How do you stay connected with the team?"
    common_errors:
      - "Making demands unrelated to the role."

  - external_key: "recruiter_screening.motivation_engineering.fe_values_work"
    competency_key: culture_values
    topic: "What they value in a team"
    difficulty: easy
    text: "What matters most to you in a frontend team's way of working, for instance code review, design reviews or testing?"
    expected_concepts:
      - "specific practices valued"
      - "reasons"
      - "examples"
      - "adaptability"
    rubric:
      excellent: "Names practices with reasons and examples of introducing or improving them."
      good: "Gives relevant reasons and some concrete detail about what they value in a team, but links to the role stay general."
      weak: "Vague or generic answer on what they value in a team that could apply to any job."
    followups:
      - "Which of those have you introduced?"
      - "What would you do if the team didn't have them?"
    common_errors:
      - "Naming values with no examples."

  - external_key: "recruiter_screening.motivation_engineering.fs_team_values"
    competency_key: culture_values
    topic: "Valuing team habits"
    difficulty: easy
    text: "What habits do the best fullstack teams you've worked in share?"
    expected_concepts:
      - "specific habits"
      - "evidence"
      - "their role in them"
      - "link to the new team"
    rubric:
      excellent: "Describes specific habits such as small PRs and clear ownership with examples, and links them to this team."
      good: "Gives relevant reasons and some concrete detail about valuing team habits, but links to the role stay general."
      weak: "Vague or generic answer on valuing team habits that could apply to any job."
    followups:
      - "Which habit would you bring here?"
      - "Which one do you find hardest?"
    common_errors:
      - "Listing generic virtues."

  - external_key: "recruiter_screening.motivation_engineering.mob_new_learning"
    competency_key: motivation
    topic: "Latest learning"
    difficulty: medium
    text: "What is the most recent thing you taught yourself in mobile, and what made you want to learn it?"
    expected_concepts:
      - "recent topic"
      - "motivation"
      - "how they learned"
      - "application at work"
    rubric:
      excellent: "Gives a recent, specific example, explains why they were curious and shows applying it."
      good: "Gives relevant reasons and some concrete detail about latest learning, but links to the role stay general."
      weak: "Vague or generic answer on latest learning that could apply to any job."
    followups:
      - "Did it change how your team works?"
      - "What is next on your list?"
    common_errors:
      - "Naming a course without outcome."

  - external_key: "recruiter_screening.motivation_engineering.qa_curiosity"
    competency_key: motivation
    topic: "Curiosity in testing"
    difficulty: medium
    text: "How do you keep your testing skills sharp, and what are you exploring at the moment?"
    expected_concepts:
      - "learning habits"
      - "current topics such as performance, security or contract testing"
      - "communities"
      - "application"
    rubric:
      excellent: "Shows habitual learning with a current topic and an example of bringing something new to the team."
      good: "Gives relevant reasons and some concrete detail about curiosity in testing, but links to the role stay general."
      weak: "Vague or generic answer on curiosity in testing that could apply to any job."
    followups:
      - "What new technique did you bring to your team?"
      - "Which area would you like to explore here?"
    common_errors:
      - "Having no current area of curiosity."

  - external_key: "recruiter_screening.motivation_engineering.be_diff_company"
    competency_key: motivation
    topic: "Mission and domain interest"
    difficulty: medium
    text: "What kind of product or domain makes you want to do your best backend work?"
    expected_concepts:
      - "domain interest"
      - "reasons"
      - "examples of domain-driven motivation"
      - "connection to the company"
    rubric:
      excellent: "Names domains with reasons and describes how they learn a new domain quickly."
      good: "Gives relevant reasons and some concrete detail about mission and domain interest, but links to the role stay general."
      weak: "Vague or generic answer on mission and domain interest that could apply to any job."
    followups:
      - "Is there a domain you would avoid?"
      - "How do you learn a new domain?"
    common_errors:
      - "Saying any domain is fine without thought."

  - external_key: "recruiter_screening.motivation_engineering.fe_seniority_goal"
    competency_key: motivation
    topic: "Scope they want"
    difficulty: medium
    text: "What size of scope do you want to own in your next frontend role, and why?"
    expected_concepts:
      - "appropriate scope"
      - "self-assessment"
      - "evidence of readiness"
      - "link to role"
    rubric:
      excellent: "Describes scope they want with evidence of readiness and a clear view of the support they need."
      good: "Gives relevant reasons and some concrete detail about scope they want, but links to the role stay general."
      weak: "Vague or generic answer on scope they want that could apply to any job."
    followups:
      - "What evidence would show you are ready for it?"
      - "Where do you need support?"
    common_errors:
      - "Over-claiming scope without evidence."

  - external_key: "recruiter_screening.motivation_engineering.fs_hardest_lesson"
    competency_key: motivation
    topic: "Lessons that shaped them"
    difficulty: medium
    text: "What was a project that went differently than planned, and how did it change how you like to work?"
    expected_concepts:
      - "specific example"
      - "own role"
      - "learning"
      - "change in habits"
    rubric:
      excellent: "Gives a clear account of their own part, concrete changes in habits and evidence they stuck."
      good: "Gives relevant reasons and some concrete detail about lessons that shaped them, but links to the role stay general."
      weak: "Vague or generic answer on lessons that shaped them that could apply to any job."
    followups:
      - "What do you do differently now?"
      - "How did the team respond?"
    common_errors:
      - "Blaming others."

  - external_key: "recruiter_screening.motivation_engineering.mob_quality_standard"
    competency_key: motivation
    topic: "Quality bar"
    difficulty: medium
    text: "How do you decide when a mobile feature is good enough to ship, and why does that matter to you?"
    expected_concepts:
      - "quality criteria"
      - "testing"
      - "user impact"
      - "trade-offs"
      - "example"
    rubric:
      excellent: "Explains criteria with an example of delaying or shipping and shows care for users."
      good: "Gives relevant reasons and some concrete detail about quality bar, but links to the role stay general."
      weak: "Vague or generic answer on quality bar that could apply to any job."
    followups:
      - "Tell me about a time you delayed a release."
      - "Who decides in your team?"
    common_errors:
      - "Using only deadlines to decide."

  - external_key: "recruiter_screening.motivation_engineering.qa_enjoy_collab"
    competency_key: recruiter_fit
    topic: "Cross-functional work"
    difficulty: medium
    text: "What do you like about working with product managers and developers as a quality engineer, and what do you find hard?"
    expected_concepts:
      - "collaboration"
      - "examples"
      - "communication"
      - "handling friction"
    rubric:
      excellent: "Describes real collaboration, balanced views of strengths and difficulties and ways they build credibility."
      good: "Gives relevant reasons and some concrete detail about cross-functional work, but links to the role stay general."
      weak: "Vague or generic answer on cross-functional work that could apply to any job."
    followups:
      - "How do you give difficult findings?"
      - "How do you build credibility?"
    common_errors:
      - "Seeing others as obstacles."

  - external_key: "recruiter_screening.motivation_engineering.be_what_leave_behind"
    competency_key: motivation
    topic: "Impact they want to have"
    difficulty: medium
    text: "After two years in this role, what would you like people to say about the impact of your work?"
    expected_concepts:
      - "measurable impact"
      - "team contribution"
      - "realistic expectations"
      - "alignment with role"
    rubric:
      excellent: "Gives specific outcomes for the product and team and links them to what the role can offer."
      good: "Gives relevant reasons and some concrete detail about impact they want to have, but links to the role stay general."
      weak: "Vague or generic answer on impact they want to have that could apply to any job."
    followups:
      - "How would you track that?"
      - "What would be your first contribution?"
    common_errors:
      - "Focusing on personal recognition only."

  - external_key: "recruiter_screening.motivation_engineering.fe_ai_tools"
    competency_key: motivation
    topic: "Changing tools"
    difficulty: hard
    text: "AI-assisted tools and new frameworks are changing how frontend work is done. How do you feel about that, and how do you decide what to adopt?"
    expected_concepts:
      - "balanced view"
      - "practical adoption criteria"
      - "examples"
      - "focus on quality"
      - "learning"
    rubric:
      excellent: "Shows a balanced view with examples of adoption decisions, keeps quality standards and avoids hype."
      good: "Gives relevant reasons and some concrete detail about changing tools, but links to the role stay general."
      weak: "Vague or generic answer on changing tools that could apply to any job."
    followups:
      - "Which tool has actually changed your workflow?"
      - "How do you check the output?"
    common_errors:
      - "Rejecting or embracing tools without criteria."

  - external_key: "recruiter_screening.motivation_engineering.fs_leave_value"
    competency_key: motivation
    topic: "Weighing offers"
    difficulty: hard
    text: "If you had two offers with similar pay, what would decide it for you, and how are you evaluating this opportunity so far?"
    expected_concepts:
      - "decision criteria"
      - "job-related priorities"
      - "clarity"
      - "interest in this role"
    rubric:
      excellent: "States job-related criteria clearly, shows how they evaluate the opportunity and what questions remain."
      good: "Gives relevant reasons and some concrete detail about weighing offers, but links to the role stay general."
      weak: "Vague or generic answer on weighing offers that could apply to any job."
    followups:
      - "What would make you say no?"
      - "What have you not yet learned about us?"
    common_errors:
      - "Giving only pay or perks as criteria."

  - external_key: "recruiter_screening.motivation_engineering.be_career_hard"
    competency_key: motivation
    topic: "Setbacks and drive"
    difficulty: hard
    text: "Tell me about a time in your backend career when you lost motivation for a while. What helped you get it back?"
    expected_concepts:
      - "self-awareness"
      - "practical recovery steps"
      - "support"
      - "change of habits"
      - "lesson"
    rubric:
      excellent: "Describes the situation openly, practical steps they took and what they learned without blaming others."
      good: "Gives relevant reasons and some concrete detail about setbacks and drive, but links to the role stay general."
      weak: "Vague or generic answer on setbacks and drive that could apply to any job."
    followups:
      - "How would you spot it earlier?"
      - "What would you want from a manager?"
    common_errors:
      - "Denying that it ever happened."

  - external_key: "recruiter_screening.motivation_engineering.mob_motivation_team"
    competency_key: culture_values
    topic: "Team culture they thrive in"
    difficulty: easy
    text: "What kind of team culture brings out your best work as a mobile engineer?"
    expected_concepts:
      - "specific cultural practices"
      - "examples"
      - "contribution"
      - "adaptability"
    rubric:
      excellent: "Names concrete practices such as pairing and blameless reviews with an example of helping build them."
      good: "Gives relevant reasons and some concrete detail about team culture they thrive in, but links to the role stay general."
      weak: "Vague or generic answer on team culture they thrive in that could apply to any job."
    followups:
      - "What have you done to build that culture?"
      - "What would you do if it was missing?"
    common_errors:
      - "Describing perks rather than ways of working."

  - external_key: "recruiter_screening.motivation_engineering.qa_feedback_loop"
    competency_key: motivation
    topic: "Fast feedback"
    difficulty: medium
    text: "What does a good feedback loop between testing and development look like to you, and why does it matter to you?"
    expected_concepts:
      - "early feedback"
      - "fast pipelines"
      - "clear reports"
      - "shared ownership"
      - "example"
    rubric:
      excellent: "Describes concrete feedback practices such as fast CI results and clear defect reports, with an example of improving a loop."
      good: "Gives relevant reasons and some concrete detail about fast feedback, but links to the role stay general."
      weak: "Vague or generic answer on fast feedback that could apply to any job."
    followups:
      - "Where does it break down?"
      - "What would you change in a team you joined?"
    common_errors:
      - "Describing testing as a final stage only."
