version: 1
defaults:
  role_tags: [devops, sre, platform, cloud, security, network, dba]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_infrastructure.devops_why"
    competency_key: motivation
    topic: "Why DevOps"
    difficulty: easy
    text: "What drew you into DevOps and automation work rather than pure development or pure operations?"
    expected_concepts:
      - "origin of interest"
      - "value of bridging dev and ops"
      - "examples of automation they built"
      - "realistic view of the work"
    rubric:
      excellent: "Gives a clear origin, names specific automation or delivery improvements they made, and shows a realistic view of the job."
      good: "Gives relevant reasons and some concrete detail about why devops, but links to the role stay general."
      weak: "Vague or generic answer on why devops that could apply to any job."
    followups:
      - "What was the first thing you automated?"
      - "What do you like least about the work?"
    common_errors:
      - "Describing tools instead of the problems they solve."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_why"
    competency_key: motivation
    topic: "Why reliability engineering"
    difficulty: easy
    text: "What got you interested in site reliability engineering?"
    expected_concepts:
      - "interest in reliability"
      - "engineering approach to operations"
      - "examples of improvements"
      - "understanding of SRE practices"
    rubric:
      excellent: "Explains the pull of reliability as an engineering problem with concrete improvements they drove."
      good: "Gives relevant reasons and some concrete detail about why reliability engineering, but links to the role stay general."
      weak: "Vague or generic answer on why reliability engineering that could apply to any job."
    followups:
      - "Which reliability win are you proudest of?"
      - "How is SRE different from operations in your view?"
    common_errors:
      - "Describing SRE as being on call only."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_why"
    competency_key: motivation
    topic: "Why platform engineering"
    difficulty: easy
    text: "Why does building internal platforms for other engineers appeal to you?"
    expected_concepts:
      - "enjoys enabling others"
      - "product mindset for internal users"
      - "examples of tooling"
      - "understanding of platform work"
    rubric:
      excellent: "Shows enjoyment of enabling developers, a product mindset toward internal users and a concrete platform they helped build."
      good: "Gives relevant reasons and some concrete detail about why platform engineering, but links to the role stay general."
      weak: "Vague or generic answer on why platform engineering that could apply to any job."
    followups:
      - "Who were your users and how did you learn what they needed?"
      - "What frustrates you about platform work?"
    common_errors:
      - "Seeing internal users as an interruption."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_why"
    competency_key: motivation
    topic: "Why cloud engineering"
    difficulty: easy
    text: "What made you choose cloud engineering as your focus?"
    expected_concepts:
      - "reasons for the cloud path"
      - "experience with providers"
      - "architecture interest"
      - "learning"
    rubric:
      excellent: "Describes why cloud work interests them with examples across design, cost and operations."
      good: "Gives relevant reasons and some concrete detail about why cloud engineering, but links to the role stay general."
      weak: "Vague or generic answer on why cloud engineering that could apply to any job."
    followups:
      - "Which provider do you know best and why?"
      - "What do you find most interesting about cloud design?"
    common_errors:
      - "Listing certifications without explanation."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_why"
    competency_key: motivation
    topic: "Why security"
    difficulty: easy
    text: "What led you to work in security, and what keeps you interested in it?"
    expected_concepts:
      - "origin of interest"
      - "area of security"
      - "examples of protection or findings"
      - "ethical approach"
    rubric:
      excellent: "Gives a specific path into security, names an area such as application security or detection, and shares an example of real impact."
      good: "Gives relevant reasons and some concrete detail about why security, but links to the role stay general."
      weak: "Vague or generic answer on why security that could apply to any job."
    followups:
      - "What was the most interesting issue you found or fixed?"
      - "Which part of security do you enjoy most?"
    common_errors:
      - "Describing security as only finding vulnerabilities."

  - external_key: "recruiter_screening.motivation_infrastructure.net_why"
    competency_key: motivation
    topic: "Why networking"
    difficulty: easy
    text: "Networking is sometimes seen as the plumbing nobody notices. What made you choose it as your specialty?"
    expected_concepts:
      - "interest in how systems communicate"
      - "hands-on experience"
      - "troubleshooting appeal"
      - "learning path"
    rubric:
      excellent: "Explains a lasting interest in networks with a hands-on troubleshooting story."
      good: "Gives relevant reasons and some concrete detail about why networking, but links to the role stay general."
      weak: "Vague or generic answer on why networking that could apply to any job."
    followups:
      - "What is the toughest network problem you solved?"
      - "How has networking changed in your time in it?"
    common_errors:
      - "Talking about certifications only."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_why"
    competency_key: motivation
    topic: "Why database work"
    difficulty: easy
    text: "What do you enjoy about working with databases as your core focus?"
    expected_concepts:
      - "interest in data systems"
      - "performance and reliability"
      - "examples"
      - "learning"
    rubric:
      excellent: "Names what they like about database work, such as query tuning or recovery design, with a concrete example."
      good: "Gives relevant reasons and some concrete detail about why database work, but links to the role stay general."
      weak: "Vague or generic answer on why database work that could apply to any job."
    followups:
      - "What is your favourite database problem?"
      - "How do you keep up with changes in database technology?"
    common_errors:
      - "Treating the role as backups only."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "Describe a good week in your current DevOps role. What are you actually doing?"
    expected_concepts:
      - "specific activities"
      - "where they get energy"
      - "match with this job"
    rubric:
      excellent: "Describes concrete activities such as pipeline work or infrastructure changes and shows the match with this role."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "And what does a bad week look like?"
      - "How much of this would you do here?"
    common_errors:
      - "Describing only meetings."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "Think of a good week in your reliability work. What did you spend your time on?"
    expected_concepts:
      - "engineering work versus toil"
      - "incident work"
      - "learning"
      - "fit with the role"
    rubric:
      excellent: "Gives a realistic balance of engineering work and operations and ties it to the role."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "How do you balance project work and operations?"
      - "What would you change in your weeks?"
    common_errors:
      - "Spending all the time reacting."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "What does a satisfying week look like for you when you work on a platform team?"
    expected_concepts:
      - "building and supporting"
      - "user feedback"
      - "roadmap"
      - "collaboration"
    rubric:
      excellent: "Describes balanced activity including user conversations and building, with a recent example."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "How do you hear from your users?"
      - "What do you do when they ask for something outside the roadmap?"
    common_errors:
      - "Never mentioning users."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "What kind of work makes a good week for you as a cloud engineer?"
    expected_concepts:
      - "design, build and operate balance"
      - "collaboration"
      - "learning"
      - "examples"
    rubric:
      excellent: "Gives specific cloud tasks they enjoy, with an example, and relates it to this role."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "What do you enjoy more, designing or operating?"
      - "What would you want more of?"
    common_errors:
      - "Listing services without activities."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_good_week"
    competency_key: motivation
    topic: "A good week"
    difficulty: easy
    text: "What does a good week look like for you in security work?"
    expected_concepts:
      - "activities such as reviews, threat modelling or response"
      - "collaboration with engineers"
      - "learning"
    rubric:
      excellent: "Describes specific security work and shows collaborative habits with engineering teams."
      good: "Gives relevant reasons and some concrete detail about a good week, but links to the role stay general."
      weak: "Vague or generic answer on a good week that could apply to any job."
    followups:
      - "How do you work with developers?"
      - "How do you decide what to look at first?"
    common_errors:
      - "Treating developers as the enemy."

  - external_key: "recruiter_screening.motivation_infrastructure.net_proud"
    competency_key: motivation
    topic: "Proud network work"
    difficulty: easy
    text: "Tell me about a network project or fix you were particularly proud of."
    expected_concepts:
      - "situation"
      - "their role"
      - "technical approach"
      - "result"
    rubric:
      excellent: "Gives specific details of the problem, their part and the measurable result."
      good: "Gives relevant reasons and some concrete detail about proud network work, but links to the role stay general."
      weak: "Vague or generic answer on proud network work that could apply to any job."
    followups:
      - "What would you change if you did it again?"
      - "Who did you work with?"
    common_errors:
      - "Describing the team's work vaguely."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_proud"
    competency_key: motivation
    topic: "Proud database work"
    difficulty: easy
    text: "What is the database project or fix you are proudest of?"
    expected_concepts:
      - "problem"
      - "their role"
      - "approach"
      - "measurable result"
    rubric:
      excellent: "Describes a concrete database problem, their approach and measured outcome such as latency or recovery time."
      good: "Gives relevant reasons and some concrete detail about proud database work, but links to the role stay general."
      weak: "Vague or generic answer on proud database work that could apply to any job."
    followups:
      - "What risk did you manage during that work?"
      - "What did you learn?"
    common_errors:
      - "Claiming credit without detail."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_oncall"
    competency_key: recruiter_fit
    topic: "On-call experience"
    difficulty: medium
    text: "Infrastructure roles often include on-call. How have you handled it so far, and what makes it work for you?"
    expected_concepts:
      - "experience"
      - "practices that help"
      - "learning from incidents"
      - "fair rotation views"
    rubric:
      excellent: "Describes real experience, practical improvements such as better alerts and fair rotations, and a sustainable view."
      good: "Gives relevant reasons and some concrete detail about on-call experience, but links to the role stay general."
      weak: "Vague or generic answer on on-call experience that could apply to any job."
    followups:
      - "What would you change about on-call in your current team?"
      - "How do you prevent burnout on a rotation?"
    common_errors:
      - "Dismissing on-call or glorifying heroics."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_toil"
    competency_key: motivation
    topic: "Toil reduction"
    difficulty: medium
    text: "Tell me about a time you reduced repetitive operational work. What motivated you to fix it?"
    expected_concepts:
      - "identification of toil"
      - "method"
      - "automation"
      - "measurable time saved"
    rubric:
      excellent: "Describes how they spotted the toil, what they built and the time or errors saved."
      good: "Gives relevant reasons and some concrete detail about toil reduction, but links to the role stay general."
      weak: "Vague or generic answer on toil reduction that could apply to any job."
    followups:
      - "How did you convince others it was worth the time?"
      - "What did you automate next?"
    common_errors:
      - "Automating without measuring."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_adoption"
    competency_key: motivation
    topic: "Getting platforms adopted"
    difficulty: medium
    text: "A platform is only valuable if teams use it. What motivates you in getting adoption, and what has worked for you?"
    expected_concepts:
      - "product thinking"
      - "user research"
      - "documentation"
      - "support"
      - "adoption metrics"
    rubric:
      excellent: "Gives examples of understanding users, reducing friction and measuring adoption."
      good: "Gives relevant reasons and some concrete detail about getting platforms adopted, but links to the role stay general."
      weak: "Vague or generic answer on getting platforms adopted that could apply to any job."
    followups:
      - "Tell me about a tool that nobody used."
      - "How do you handle a team that prefers its own way?"
    common_errors:
      - "Mandating usage without listening."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_cost"
    competency_key: motivation
    topic: "Cost and efficiency"
    difficulty: medium
    text: "How do you feel about cost optimisation in cloud work, and what have you done about it?"
    expected_concepts:
      - "cost awareness"
      - "techniques"
      - "trade-offs with reliability"
      - "example with numbers"
    rubric:
      excellent: "Gives an example with numbers and trade-offs and shows cost as part of design."
      good: "Gives relevant reasons and some concrete detail about cost and efficiency, but links to the role stay general."
      weak: "Vague or generic answer on cost and efficiency that could apply to any job."
    followups:
      - "What trade-off did you decide against?"
      - "How do you involve engineering teams?"
    common_errors:
      - "Cutting cost without considering reliability."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_dev_relation"
    competency_key: motivation
    topic: "Security and developers"
    difficulty: medium
    text: "How do you like to work with development teams so that security becomes part of their normal work?"
    expected_concepts:
      - "partnership"
      - "training"
      - "tooling"
      - "guardrails"
      - "example of improving practices"
    rubric:
      excellent: "Describes concrete practices such as secure defaults and quick feedback and an example of changing behaviour."
      good: "Gives relevant reasons and some concrete detail about security and developers, but links to the role stay general."
      weak: "Vague or generic answer on security and developers that could apply to any job."
    followups:
      - "How did you handle resistance?"
      - "What makes a security control easy to follow?"
    common_errors:
      - "Relying on blocking and policy only."

  - external_key: "recruiter_screening.motivation_infrastructure.net_evolution"
    competency_key: motivation
    topic: "Keeping up in networking"
    difficulty: medium
    text: "Networking is shifting toward cloud, software-defined and automated approaches. How do you see that and where do you want to build skills?"
    expected_concepts:
      - "view of change"
      - "skills such as automation and cloud networking"
      - "learning actions"
      - "link to role"
    rubric:
      excellent: "Shows a reasoned view of change with learning actions and ties it to the role."
      good: "Gives relevant reasons and some concrete detail about keeping up in networking, but links to the role stay general."
      weak: "Vague or generic answer on keeping up in networking that could apply to any job."
    followups:
      - "What have you automated in your network work?"
      - "What is the next skill you want?"
    common_errors:
      - "Resisting change without reasons."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_modern"
    competency_key: motivation
    topic: "Evolving database role"
    difficulty: medium
    text: "Managed database services and automation change what DBAs do. How do you see your role evolving, and what do you want to focus on?"
    expected_concepts:
      - "view of change"
      - "value beyond administration"
      - "skills such as modelling and performance"
      - "plan"
    rubric:
      excellent: "Gives a clear view of valuable DBA work in a managed world, with learning actions."
      good: "Gives relevant reasons and some concrete detail about evolving database role, but links to the role stay general."
      weak: "Vague or generic answer on evolving database role that could apply to any job."
    followups:
      - "Which managed service have you moved to?"
      - "What can't be automated away?"
    common_errors:
      - "Defending routine tasks as irreplaceable."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_prod_ownership"
    competency_key: motivation
    topic: "Enabling developers"
    difficulty: medium
    text: "What do you enjoy about helping developers ship faster and safer, and how do you measure it?"
    expected_concepts:
      - "developer experience"
      - "delivery metrics"
      - "examples"
      - "empathy for users"
    rubric:
      excellent: "Connects their work to delivery speed and safety with an example and a metric."
      good: "Gives relevant reasons and some concrete detail about enabling developers, but links to the role stay general."
      weak: "Vague or generic answer on enabling developers that could apply to any job."
    followups:
      - "Which metric would you track?"
      - "What slowed developers most in your last team?"
    common_errors:
      - "Counting tools deployed."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_postmortem"
    competency_key: motivation
    topic: "Learning from failure"
    difficulty: hard
    text: "Tell me about an outage you were part of that changed how you work. What did you take from it?"
    expected_concepts:
      - "specific incident"
      - "their part"
      - "learning"
      - "changes made"
      - "blameless approach"
    rubric:
      excellent: "Gives a specific incident, shares their own part without blame, and describes lasting changes."
      good: "Gives relevant reasons and some concrete detail about learning from failure, but links to the role stay general."
      weak: "Vague or generic answer on learning from failure that could apply to any job."
    followups:
      - "How did you make sure the fix lasted?"
      - "What did you stop doing?"
    common_errors:
      - "Blaming people or a single cause."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_ethics"
    competency_key: motivation
    topic: "Security judgement"
    difficulty: hard
    text: "Security work sometimes puts you in tension with delivery deadlines. Tell me about a time you had to hold a line or accept a risk, and how you decided."
    expected_concepts:
      - "specific case"
      - "risk reasoning"
      - "communication"
      - "stakeholder handling"
      - "outcome"
    rubric:
      excellent: "Describes risk-based reasoning with clear communication to stakeholders and the result."
      good: "Gives relevant reasons and some concrete detail about security judgement, but links to the role stay general."
      weak: "Vague or generic answer on security judgement that could apply to any job."
    followups:
      - "Would you decide the same today?"
      - "Who else was involved in the decision?"
    common_errors:
      - "Treating every risk as unacceptable."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_long_term"
    competency_key: motivation
    topic: "Long-term direction in cloud"
    difficulty: hard
    text: "Where do you want your cloud career to go over the next few years, for example deeper architecture, FinOps, security or leadership, and what are you doing to get there?"
    expected_concepts:
      - "clear direction"
      - "actions taken"
      - "flexibility"
      - "link to role"
    rubric:
      excellent: "Gives a clear direction supported by actions already taken and ties the role to it."
      good: "Gives relevant reasons and some concrete detail about long-term direction in cloud, but links to the role stay general."
      weak: "Vague or generic answer on long-term direction in cloud that could apply to any job."
    followups:
      - "What have you done to test that interest?"
      - "How would this role help?"
    common_errors:
      - "Generic answers about \"learning more cloud\"."
