# Curated questions: recruiter screening, career goals (02 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.career_goals.role_you_are_aiming_for
    competency_key: motivation
    topic: "Target role"
    difficulty: easy
    text: "What role or level are you aiming for next, and what do you think stands between you and it?"
    expected_concepts:
      - "clear target"
      - "candid gap assessment"
      - "plan"
      - "link to this job"
    rubric:
      excellent: "Names a target, identifies real gaps and describes a plan that this role would help with."
      good: "Names a target and some gaps."
      weak: "Names a title only."
    followups:
      - "Who could help you close that gap?"
      - "How will this role help?"
    common_errors:
      - "Names a title only."

  - external_key: recruiter_screening.career_goals.learning_from_failure
    competency_key: motivation
    topic: "Learning from a setback"
    difficulty: medium
    text: "Describe a professional setback that shaped your goals. What did you change?"
    expected_concepts:
      - "specific setback"
      - "ownership"
      - "change in approach"
      - "result"
    rubric:
      excellent: "Describes a real setback, owns their part and shows lasting changes in how they work."
      good: "Describes a setback with a modest lesson."
      weak: "Cannot give a real setback or deflects blame."
    followups:
      - "What did you do first?"
      - "How did you apply it later?"
    common_errors:
      - "Cannot give a real setback or deflects blame."

  - external_key: recruiter_screening.career_goals.technology_bet
    competency_key: motivation
    topic: "Technology you would bet on"
    difficulty: easy
    text: "Is there a technology or practice in your field that you think will matter more in the next few years? Why?"
    expected_concepts:
      - "informed opinion"
      - "reasoning"
      - "evidence"
      - "link to own plans"
    rubric:
      excellent: "Makes a reasoned case with evidence and says how they are preparing for it."
      good: "Names a trend with some reasons."
      weak: "Repeats hype without reasoning."
    followups:
      - "What could prove you wrong?"
      - "How are you preparing?"
    common_errors:
      - "Repeats hype without reasoning."

  - external_key: recruiter_screening.career_goals.portfolio_of_work
    competency_key: motivation
    topic: "Work you are proud of"
    difficulty: easy
    text: "Which piece of work from the last couple of years best represents the direction you want to grow in?"
    expected_concepts:
      - "specific project"
      - "role played"
      - "connection to goals"
      - "impact"
    rubric:
      excellent: "Picks a specific project, explains their contribution and how it points to future goals."
      good: "Describes a good project with some link to goals."
      weak: "Picks something unrelated to their goals."
    followups:
      - "What would you build on from it?"
      - "What would you change?"
    common_errors:
      - "Picks something unrelated to their goals."

  - external_key: recruiter_screening.career_goals.unfamiliar_responsibilities
    competency_key: adaptability
    topic: "Taking on unfamiliar duties"
    difficulty: easy
    text: "How do you feel about being asked to take on responsibilities you have not done before?"
    expected_concepts:
      - "growth mindset"
      - "preparation"
      - "seeking support"
      - "example"
    rubric:
      excellent: "Welcomes it with an example, describes preparing and asking for support early."
      good: "Open to it with some process."
      weak: "Avoids it or says they would just figure it out."
    followups:
      - "When did that last happen?"
      - "What support helps you most?"
    common_errors:
      - "Avoids it or says they would just figure it out."

  - external_key: recruiter_screening.career_goals.planning_career_in_company
    competency_key: motivation
    topic: "Growing within a company"
    difficulty: medium
    text: "What kinds of growth opportunities help you stay engaged within one company over several years?"
    expected_concepts:
      - "specific opportunities"
      - "job-related focus"
      - "initiative"
      - "mutual benefit"
    rubric:
      excellent: "Names concrete opportunities, shows initiative in creating them and links them to team needs."
      good: "Names a few common opportunities."
      weak: "Only mentions pay or title."
    followups:
      - "How have you created such chances?"
      - "What did you do when none existed?"
    common_errors:
      - "Only mentions pay or title."

  - external_key: recruiter_screening.career_goals.sponsor_or_mentor
    competency_key: collaboration
    topic: "Finding guidance"
    difficulty: easy
    text: "If you joined a new team, how would you go about finding guidance and mentoring for your growth?"
    expected_concepts:
      - "proactive outreach"
      - "clear asks"
      - "reciprocity"
      - "examples"
    rubric:
      excellent: "Describes specific actions like targeted asks and regular check-ins and how they give back."
      good: "Says they would ask around."
      weak: "Expects guidance to be handed to them."
    followups:
      - "How would you ask?"
      - "What would you offer in return?"
    common_errors:
      - "Expects guidance to be handed to them."

  - external_key: recruiter_screening.career_goals.managing_expectations
    competency_key: communication
    topic: "Talking to your manager about growth"
    difficulty: medium
    text: "How would you raise your growth goals with a manager you had just started working with?"
    expected_concepts:
      - "timing"
      - "clarity"
      - "linking goals to team needs"
      - "follow-up"
    rubric:
      excellent: "Describes a concrete conversation plan that connects personal goals to team needs and agrees follow-up."
      good: "Says they would talk about goals at some point."
      weak: "Would wait to be asked."
    followups:
      - "What would you ask them?"
      - "How would you follow up?"
    common_errors:
      - "Would wait to be asked."

  - external_key: recruiter_screening.career_goals.twelve_month_learning_plan
    competency_key: ownership
    topic: "Learning plan"
    difficulty: medium
    text: "Suppose you had a learning budget and time for the next twelve months. How would you plan to use it?"
    expected_concepts:
      - "prioritisation"
      - "concrete activities"
      - "link to role"
      - "measuring outcomes"
    rubric:
      excellent: "Gives a structured plan tied to role needs with measurable checkpoints."
      good: "Gives a loose plan with a few items."
      weak: "Lists courses with no priorities."
    followups:
      - "How would you know it worked?"
      - "What would you drop?"
    common_errors:
      - "Lists courses with no priorities."

  - external_key: recruiter_screening.career_goals.learning_style
    competency_key: motivation
    topic: "How you learn best"
    difficulty: easy
    text: "How do you learn best, and how have you used that to pick up something difficult?"
    expected_concepts:
      - "self-knowledge"
      - "method"
      - "example"
      - "adaptation"
    rubric:
      excellent: "Describes methods that work for them with a concrete example and adapts when they fail."
      good: "Describes a style with a short example."
      weak: "Cannot describe how they learn."
    followups:
      - "What does not work for you?"
      - "How do you learn from teammates?"
    common_errors:
      - "Cannot describe how they learn."

  - external_key: recruiter_screening.career_goals.interest_in_leading_projects
    competency_key: motivation
    topic: "Leading small initiatives"
    difficulty: medium
    text: "Have you led a small initiative or project, and is that something you want more of?"
    expected_concepts:
      - "example"
      - "scope"
      - "lessons"
      - "interest level with reasons"
    rubric:
      excellent: "Describes a real initiative, what they learned and a reasoned view on doing more."
      good: "Describes something small with some reflection."
      weak: "No example and no clear view."
    followups:
      - "What was hardest about leading?"
      - "What support would you want?"
    common_errors:
      - "No example and no clear view."

  - external_key: recruiter_screening.career_goals.role_model_traits
    competency_key: motivation
    topic: "Admired colleague"
    difficulty: easy
    text: "Think of a colleague you admired professionally. Which of their working habits would you like to adopt?"
    expected_concepts:
      - "specific habits"
      - "reasons"
      - "self-reflection"
      - "plan to adopt"
    rubric:
      excellent: "Names observable habits, why they matter and how they are practising them."
      good: "Names a person and a few traits."
      weak: "Praises traits that are not work habits."
    followups:
      - "What did they do in a hard moment?"
      - "Which have you adopted?"
    common_errors:
      - "Praises traits that are not work habits."

  - external_key: recruiter_screening.career_goals.career_pivot_reason
    competency_key: motivation
    topic: "A change of direction"
    difficulty: medium
    text: "If you have changed technologies, teams or focus areas, what drove it? If not, what would make you consider it?"
    expected_concepts:
      - "reasons"
      - "evaluation"
      - "outcome"
      - "openness"
    rubric:
      excellent: "Gives job-related reasons, shows how they evaluated the change and what happened."
      good: "Gives a reason and a basic outcome."
      weak: "Gives no reasoning."
    followups:
      - "How did you check it was right?"
      - "What would make you change again?"
    common_errors:
      - "Gives no reasoning."

  - external_key: recruiter_screening.career_goals.goal_alignment_with_company
    competency_key: recruiter_fit
    topic: "Aligning goals with the team"
    difficulty: medium
    text: "How would you make sure your growth goals line up with what the team needs?"
    expected_concepts:
      - "conversation with manager"
      - "shared objectives"
      - "trade-offs"
      - "examples"
    rubric:
      excellent: "Describes concrete ways to align, including trade-offs and revisiting goals regularly."
      good: "Says goals should be discussed."
      weak: "Assumes alignment will just happen."
    followups:
      - "Tell me about a time they did not line up."
      - "What would you compromise on?"
    common_errors:
      - "Assumes alignment will just happen."

  - external_key: recruiter_screening.career_goals.becoming_expert
    competency_key: motivation
    topic: "Depth in one area"
    difficulty: hard
    text: "If you wanted to become a recognised expert in one area, which would you choose and what would the path look like?"
    expected_concepts:
      - "specific area"
      - "staged path"
      - "evidence of depth"
      - "patience"
    rubric:
      excellent: "Chooses an area with reasons and sets out a staged path with ways to prove depth."
      good: "Chooses an area and sketches a path."
      weak: "Names an area with no path."
    followups:
      - "What would be hardest?"
      - "How would you show the expertise?"
    common_errors:
      - "Names an area with no path."

  - external_key: recruiter_screening.career_goals.time_for_learning
    competency_key: ownership
    topic: "Making time to learn"
    difficulty: easy
    text: "How do you find time to learn when deadlines are pressing?"
    expected_concepts:
      - "prioritisation"
      - "boundaries"
      - "small habits"
      - "communicating with manager"
    rubric:
      excellent: "Describes realistic habits, trades off with delivery and keeps managers informed."
      good: "Gives some tactics."
      weak: "Says they have no time."
    followups:
      - "What gets cut first?"
      - "Have you negotiated learning time?"
    common_errors:
      - "Says they have no time."

  - external_key: recruiter_screening.career_goals.reading_and_research
    competency_key: motivation
    topic: "Staying informed"
    difficulty: easy
    text: "Where do you go to find out what is happening in your field, and what did you last act on?"
    expected_concepts:
      - "specific sources"
      - "filtering"
      - "action taken"
      - "critical thinking"
    rubric:
      excellent: "Names sources, explains how they filter them and gives a recent action taken."
      good: "Lists some sources."
      weak: "Lists nothing specific."
    followups:
      - "How do you spot hype?"
      - "What did you try because of it?"
    common_errors:
      - "Lists nothing specific."

  - external_key: recruiter_screening.career_goals.new_tools_adoption
    competency_key: adaptability
    topic: "Adopting new tools"
    difficulty: medium
    text: "Tell me about a time you introduced or adopted a new tool or practice. How did you decide it was worth it?"
    expected_concepts:
      - "evaluation criteria"
      - "trial"
      - "buy-in"
      - "result"
    rubric:
      excellent: "Describes evaluation criteria, a small trial and evidence of benefit."
      good: "Describes adoption with basic reasons."
      weak: "Adopted it because it was popular."
    followups:
      - "Who did you convince?"
      - "What if it had not worked?"
    common_errors:
      - "Adopted it because it was popular."

  - external_key: recruiter_screening.career_goals.future_leadership_path
    competency_key: leadership
    topic: "Leading in the future"
    difficulty: medium
    text: "Do you imagine leading others at some point? What would you need to learn first?"
    expected_concepts:
      - "candid self-view"
      - "skills identified"
      - "examples of informal leadership"
      - "plan"
    rubric:
      excellent: "Gives a reasoned view, names real skills to build and cites informal leadership so far."
      good: "Shows some interest and general needs."
      weak: "Wants the title only."
    followups:
      - "What have you done that is leader-like?"
      - "Who would you learn from?"
    common_errors:
      - "Wants the title only."

  - external_key: recruiter_screening.career_goals.side_interests_relevant
    competency_key: motivation
    topic: "Curiosity outside the job"
    difficulty: easy
    text: "What topic in your field are you curious about even though it is not part of your job?"
    expected_concepts:
      - "genuine curiosity"
      - "what they did about it"
      - "link to work"
      - "interest"
    rubric:
      excellent: "Describes a topic, concrete things they explored and how it informs their work."
      good: "Names a topic with some activity."
      weak: "Cannot name one."
    followups:
      - "What did you build?"
      - "Could it connect to this role?"
    common_errors:
      - "Cannot name one."

  - external_key: recruiter_screening.career_goals.being_stuck_in_career
    competency_key: motivation
    topic: "When growth stalls"
    difficulty: hard
    text: "Have you ever felt your growth had stalled in a role? What did you do about it?"
    expected_concepts:
      - "recognition of the stall"
      - "action taken"
      - "conversation with manager"
      - "outcome"
    rubric:
      excellent: "Names the signs, describes actions taken including manager conversations and what changed."
      good: "Describes the feeling and a basic response."
      weak: "Only says they left or waited."
    followups:
      - "When did you notice?"
      - "What would you do sooner next time?"
    common_errors:
      - "Only says they left or waited."

  - external_key: recruiter_screening.career_goals.skill_gap_now
    competency_key: motivation
    topic: "A current gap"
    difficulty: medium
    text: "What is the biggest skill gap you see in yourself relative to this role, and how would you close it?"
    expected_concepts:
      - "candid gap"
      - "plan"
      - "timeline"
      - "support"
    rubric:
      excellent: "Names a real gap, a concrete plan with a timeline and where they would seek help."
      good: "Names a gap and a general plan."
      weak: "Names a fake weakness or a strength in disguise."
    followups:
      - "How soon could you close it?"
      - "What have you done already?"
    common_errors:
      - "Names a fake weakness or a strength in disguise."

  - external_key: recruiter_screening.career_goals.measure_progress
    competency_key: ownership
    topic: "Measuring progress"
    difficulty: medium
    text: "How do you know whether you are progressing in your career?"
    expected_concepts:
      - "criteria"
      - "evidence"
      - "feedback sources"
      - "adjusting"
    rubric:
      excellent: "Uses a mix of measurable evidence and feedback and adjusts course using it."
      good: "Uses a general sense of progress."
      weak: "Relies on title or pay changes only."
    followups:
      - "What was the last sign?"
      - "Who tells you?"
    common_errors:
      - "Relies on title or pay changes only."

  - external_key: recruiter_screening.career_goals.dream_project
    competency_key: motivation
    topic: "A project you would love"
    difficulty: easy
    text: "Describe a project you would love to work on if you could choose, and what draws you to it."
    expected_concepts:
      - "specific project"
      - "reasons"
      - "skills used"
      - "fit with the job"
    rubric:
      excellent: "Describes a specific project, what draws them and how this role is related."
      good: "Describes a general kind of project."
      weak: "Cannot name one."
    followups:
      - "What would you need to learn?"
      - "What would success look like?"
    common_errors:
      - "Cannot name one."

  - external_key: recruiter_screening.career_goals.years_in_role_expectation
    competency_key: recruiter_fit
    topic: "Expected time in this role"
    difficulty: medium
    text: "How long do you expect to grow in a role like this before you want something different, and what might that be?"
    expected_concepts:
      - "realistic timeline"
      - "next steps"
      - "commitment signals"
      - "openness"
    rubric:
      excellent: "Gives a realistic view, describes next-step options and shows commitment to delivering in the meantime."
      good: "Gives a rough timeline."
      weak: "Gives an unrealistic timeline or no view."
    followups:
      - "What would you deliver before then?"
      - "What would make you stay longer?"
    common_errors:
      - "Gives an unrealistic timeline or no view."
