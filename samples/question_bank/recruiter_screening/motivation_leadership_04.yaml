version: 1
defaults:
  role_tags: [tech_lead, engineering_manager]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_leadership.tl_company"
    competency_key: recruiter_fit
    topic: "Interest in our engineering"
    difficulty: easy
    text: "What do you know about our engineering team and technology, and what would you ask a lead here?"
    expected_concepts:
      - "research"
      - "technology"
      - "questions"
      - "interest"
    rubric:
      excellent: "Shows research and asks informed questions."
      good: "Gives relevant reasons and some concrete detail about interest in our engineering, but links to the role stay general."
      weak: "Vague or generic answer on interest in our engineering that could apply to any job."
    followups:
      - "What caught your eye?"
      - "What would you ask the team?"
    common_errors:
      - "No preparation."

  - external_key: "recruiter_screening.motivation_leadership.em_company"
    competency_key: recruiter_fit
    topic: "Interest in our organisation"
    difficulty: easy
    text: "What have you learned about our organisation and the team you would manage, and what would you like to ask?"
    expected_concepts:
      - "research"
      - "org structure"
      - "questions"
      - "interest"
    rubric:
      excellent: "Shows preparation and asks good questions about structure, goals and support."
      good: "Gives relevant reasons and some concrete detail about interest in our organisation, but links to the role stay general."
      weak: "Vague or generic answer on interest in our organisation that could apply to any job."
    followups:
      - "What would you ask the director?"
      - "What do you want to find out?"
    common_errors:
      - "Asking only about benefits."

  - external_key: "recruiter_screening.motivation_leadership.tl_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "If you joined as tech lead, what would you do in your first three months?"
    expected_concepts:
      - "listening"
      - "reading code"
      - "relationships"
      - "first improvements"
    rubric:
      excellent: "Describes learning and building trust before making a considered improvement."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "What would you avoid changing?"
      - "How would you build credibility?"
    common_errors:
      - "Rewriting immediately."

  - external_key: "recruiter_screening.motivation_leadership.em_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "What would your first three months as an engineering manager here look like?"
    expected_concepts:
      - "listening"
      - "one-to-ones"
      - "understanding delivery"
      - "relationships"
      - "first changes"
    rubric:
      excellent: "Describes listening and one-to-ones first, then a carefully chosen change."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "Who would you meet first?"
      - "What would you ask your team?"
    common_errors:
      - "Reorganising on day one."

  - external_key: "recruiter_screening.motivation_leadership.tl_ask_team"
    competency_key: motivation
    topic: "Learning about the team"
    difficulty: medium
    text: "What would you want to ask the team you would lead before you made any decisions?"
    expected_concepts:
      - "questions about pain points"
      - "strengths"
      - "history"
      - "expectations"
    rubric:
      excellent: "Asks thoughtful, open questions about pain points and history."
      good: "Gives relevant reasons and some concrete detail about learning about the team, but links to the role stay general."
      weak: "Vague or generic answer on learning about the team that could apply to any job."
    followups:
      - "Who else would you ask?"
      - "How would you use the answers?"
    common_errors:
      - "Making assumptions."

  - external_key: "recruiter_screening.motivation_leadership.em_ask_leaders"
    competency_key: motivation
    topic: "Understanding expectations"
    difficulty: medium
    text: "What would you want to be clear about with your own manager in the first weeks?"
    expected_concepts:
      - "expectations"
      - "success measures"
      - "communication"
      - "support"
      - "escalation"
    rubric:
      excellent: "Describes clarifying goals, metrics and support early."
      good: "Gives relevant reasons and some concrete detail about understanding expectations, but links to the role stay general."
      weak: "Vague or generic answer on understanding expectations that could apply to any job."
    followups:
      - "How often would you meet?"
      - "What would good look like?"
    common_errors:
      - "Assuming expectations."

  - external_key: "recruiter_screening.motivation_leadership.tl_career_5"
    competency_key: motivation
    topic: "Five-year view"
    difficulty: medium
    text: "Where do you see your path as a technical leader over the next five years: staff-level technical work, management, or something else?"
    expected_concepts:
      - "self-awareness"
      - "reasoning"
      - "actions"
      - "flexibility"
      - "link to role"
    rubric:
      excellent: "Names a direction backed by experience and ties it to the role."
      good: "Gives relevant reasons and some concrete detail about five-year view, but links to the role stay general."
      weak: "Vague or generic answer on five-year view that could apply to any job."
    followups:
      - "What evidence do you have for that preference?"
      - "What would change your mind?"
    common_errors:
      - "No view."

  - external_key: "recruiter_screening.motivation_leadership.em_career_5"
    competency_key: motivation
    topic: "Five-year view"
    difficulty: medium
    text: "Where do you want your management career to go, and how does this role help?"
    expected_concepts:
      - "direction"
      - "reasoning"
      - "actions"
      - "link to role"
    rubric:
      excellent: "Gives a clear direction with actions and a link to the role."
      good: "Gives relevant reasons and some concrete detail about five-year view, but links to the role stay general."
      weak: "Vague or generic answer on five-year view that could apply to any job."
    followups:
      - "What would make you change course?"
      - "Which skills do you need?"
    common_errors:
      - "Giving a vague answer with no actions."

  - external_key: "recruiter_screening.motivation_leadership.tl_team_size"
    competency_key: recruiter_fit
    topic: "Scope of team"
    difficulty: medium
    text: "How many people and how many systems do you feel you can lead well, and what tells you that?"
    expected_concepts:
      - "self-awareness"
      - "evidence"
      - "limits"
      - "delegation"
      - "example"
    rubric:
      excellent: "Gives a reasoned number with evidence and tells how they scale themselves."
      good: "Gives relevant reasons and some concrete detail about scope of team, but links to the role stay general."
      weak: "Vague or generic answer on scope of team that could apply to any job."
    followups:
      - "What happens when you pass that point?"
      - "How do you scale yourself?"
    common_errors:
      - "Over-claiming."

  - external_key: "recruiter_screening.motivation_leadership.em_team_size"
    competency_key: recruiter_fit
    topic: "Span of control"
    difficulty: medium
    text: "How many direct reports do you think you manage well, and what signals tell you it is too many?"
    expected_concepts:
      - "span"
      - "signals"
      - "delegation"
      - "support"
      - "example"
    rubric:
      excellent: "Gives a reasoned span with signals and practices for scaling."
      good: "Gives relevant reasons and some concrete detail about span of control, but links to the role stay general."
      weak: "Vague or generic answer on span of control that could apply to any job."
    followups:
      - "What do you do at the limit?"
      - "How do you use team leads?"
    common_errors:
      - "Over-claiming."

  - external_key: "recruiter_screening.motivation_leadership.tl_values"
    competency_key: culture_values
    topic: "Working values"
    difficulty: medium
    text: "What principles guide you when your team has to choose between speed and quality?"
    expected_concepts:
      - "principles"
      - "communication"
      - "examples"
      - "trade-offs"
    rubric:
      excellent: "Names principles with an example of each choice."
      good: "Gives relevant reasons and some concrete detail about working values, but links to the role stay general."
      weak: "Vague or generic answer on working values that could apply to any job."
    followups:
      - "Tell me about a time you chose each."
      - "How do you explain it?"
    common_errors:
      - "Abstract."

  - external_key: "recruiter_screening.motivation_leadership.em_values"
    competency_key: culture_values
    topic: "Working values"
    difficulty: medium
    text: "What principles guide how you treat people on your team, particularly in difficult periods?"
    expected_concepts:
      - "fairness"
      - "transparency"
      - "support"
      - "examples"
    rubric:
      excellent: "Names principles with a concrete example."
      good: "Gives relevant reasons and some concrete detail about working values, but links to the role stay general."
      weak: "Vague or generic answer on working values that could apply to any job."
    followups:
      - "Tell me about a difficult period."
      - "How do you stay consistent?"
    common_errors:
      - "Abstract."

  - external_key: "recruiter_screening.motivation_leadership.tl_feedback_receive"
    competency_key: leadership
    topic: "Receiving feedback"
    difficulty: medium
    text: "How do you ask your team for feedback on your leadership, and what have you changed because of it?"
    expected_concepts:
      - "mechanisms"
      - "openness"
      - "example of change"
      - "follow-up"
    rubric:
      excellent: "Describes feedback mechanisms and a real change."
      good: "Gives relevant reasons and some concrete detail about receiving feedback, but links to the role stay general."
      weak: "Vague or generic answer on receiving feedback that could apply to any job."
    followups:
      - "What was hard to hear?"
      - "How do you make it safe?"
    common_errors:
      - "Never asking."

  - external_key: "recruiter_screening.motivation_leadership.em_feedback_receive"
    competency_key: leadership
    topic: "Upward feedback"
    difficulty: medium
    text: "How do you find out how your team experiences your management, and what did you do with the last piece of feedback you got?"
    expected_concepts:
      - "mechanisms"
      - "openness"
      - "change"
      - "follow-up"
    rubric:
      excellent: "Describes mechanisms and a real change in response."
      good: "Gives relevant reasons and some concrete detail about upward feedback, but links to the role stay general."
      weak: "Vague or generic answer on upward feedback that could apply to any job."
    followups:
      - "What surprised you?"
      - "How do you make it safe?"
    common_errors:
      - "Defensive."

  - external_key: "recruiter_screening.motivation_leadership.tl_decide_speed"
    competency_key: leadership
    topic: "Speed and care"
    difficulty: medium
    text: "How do you decide which decisions to make quickly and which deserve more time?"
    expected_concepts:
      - "reversibility"
      - "impact"
      - "consultation"
      - "examples"
    rubric:
      excellent: "Describes using reversibility and impact to decide how much care is needed."
      good: "Gives relevant reasons and some concrete detail about speed and care, but links to the role stay general."
      weak: "Vague or generic answer on speed and care that could apply to any job."
    followups:
      - "Tell me about a decision you rushed."
      - "How do you document?"
    common_errors:
      - "Treating all decisions the same."

  - external_key: "recruiter_screening.motivation_leadership.em_recognition"
    competency_key: people_management
    topic: "Recognition and growth"
    difficulty: medium
    text: "How do you make sure good work on your team gets noticed fairly and leads to growth?"
    expected_concepts:
      - "visibility"
      - "fair process"
      - "feedback"
      - "promotion evidence"
      - "example"
    rubric:
      excellent: "Describes consistent, evidence-based recognition with an example."
      good: "Gives relevant reasons and some concrete detail about recognition and growth, but links to the role stay general."
      weak: "Vague or generic answer on recognition and growth that could apply to any job."
    followups:
      - "How do you handle quiet performers?"
      - "How do you record achievements?"
    common_errors:
      - "Favouring visible people."

  - external_key: "recruiter_screening.motivation_leadership.tl_pairing"
    competency_key: mentoring
    topic: "Teaching techniques"
    difficulty: medium
    text: "What techniques do you use to teach, such as pairing, reviews or design walkthroughs?"
    expected_concepts:
      - "techniques"
      - "examples"
      - "tailoring"
      - "outcomes"
    rubric:
      excellent: "Describes several techniques and when each works with an example."
      good: "Gives relevant reasons and some concrete detail about teaching techniques, but links to the role stay general."
      weak: "Vague or generic answer on teaching techniques that could apply to any job."
    followups:
      - "Which works best for juniors?"
      - "What did you learn from teaching?"
    common_errors:
      - "One technique only."

  - external_key: "recruiter_screening.motivation_leadership.em_goal_setting"
    competency_key: motivation
    topic: "Matching growth to team needs"
    difficulty: medium
    text: "What do you enjoy about helping an engineer work out where they want to go next year, and what do you do when their goals do not match what the team needs?"
    expected_concepts:
      - "enjoys coaching"
      - "listening"
      - "balancing team needs"
      - "options"
      - "example"
    rubric:
      excellent: "Describes listening, finding stretch work that serves the team and being open about limits, with an example."
      good: "Gives relevant reasons and some concrete detail about matching growth to team needs, but links to the role stay general."
      weak: "Vague or generic answer on matching growth to team needs that could apply to any job."
    followups:
      - "Tell me about a time those two pulled apart."
      - "How do you follow up?"
    common_errors:
      - "Imposing goals."

  - external_key: "recruiter_screening.motivation_leadership.tl_wrong_hire"
    competency_key: leadership
    topic: "Standards for hiring"
    difficulty: medium
    text: "What do you look for when you help evaluate engineers for your team, and how do you make it fair?"
    expected_concepts:
      - "criteria"
      - "structured interviews"
      - "calibration"
      - "fairness"
      - "example"
    rubric:
      excellent: "Describes job-related criteria and structured, fair evaluation."
      good: "Gives relevant reasons and some concrete detail about standards for hiring, but links to the role stay general."
      weak: "Vague or generic answer on standards for hiring that could apply to any job."
    followups:
      - "How do you calibrate?"
      - "What is a red flag?"
    common_errors:
      - "Gut feel."

  - external_key: "recruiter_screening.motivation_leadership.em_succession"
    competency_key: leadership
    topic: "Developing successors"
    difficulty: hard
    text: "Tell me about a time you prepared someone to take over part of your responsibilities. How did you do it?"
    expected_concepts:
      - "delegation"
      - "coaching"
      - "gradual handover"
      - "trust"
      - "result"
    rubric:
      excellent: "Describes gradual delegation, coaching and a successful result."
      good: "Gives relevant reasons and some concrete detail about developing successors, but links to the role stay general."
      weak: "Vague or generic answer on developing successors that could apply to any job."
    followups:
      - "What did you keep?"
      - "How did you handle mistakes?"
    common_errors:
      - "Holding on."

  - external_key: "recruiter_screening.motivation_leadership.tl_pressure_up"
    competency_key: leadership
    topic: "Pressure from above"
    difficulty: hard
    text: "Tell me about a time you were asked for something that put your team at risk. How did you respond?"
    expected_concepts:
      - "situation"
      - "evidence"
      - "options"
      - "communication"
      - "result"
    rubric:
      excellent: "Describes presenting risks and options respectfully, with a result."
      good: "Gives relevant reasons and some concrete detail about pressure from above, but links to the role stay general."
      weak: "Vague or generic answer on pressure from above that could apply to any job."
    followups:
      - "What did you offer?"
      - "How did your team learn?"
    common_errors:
      - "Giving in or refusing."

  - external_key: "recruiter_screening.motivation_leadership.em_change_mind"
    competency_key: leadership
    topic: "Changing your mind"
    difficulty: hard
    text: "Tell me about a time a team member convinced you to change a decision. What did it teach you?"
    expected_concepts:
      - "situation"
      - "openness"
      - "reasoning"
      - "change"
      - "learning"
    rubric:
      excellent: "Shows openness, acknowledging the change and what it taught them."
      good: "Gives relevant reasons and some concrete detail about changing your mind, but links to the role stay general."
      weak: "Vague or generic answer on changing your mind that could apply to any job."
    followups:
      - "How did you acknowledge it?"
      - "How did the team react?"
    common_errors:
      - "Never changing."

  - external_key: "recruiter_screening.motivation_leadership.tl_legacy"
    competency_key: motivation
    topic: "Lasting impact"
    difficulty: hard
    text: "When you leave a team, what do you hope to have left behind?"
    expected_concepts:
      - "systems"
      - "people"
      - "practices"
      - "reasoning"
      - "realistic examples"
    rubric:
      excellent: "Describes lasting impacts on people and practices with real examples."
      good: "Gives relevant reasons and some concrete detail about lasting impact, but links to the role stay general."
      weak: "Vague or generic answer on lasting impact that could apply to any job."
    followups:
      - "How do you measure that?"
      - "What have you left behind before?"
    common_errors:
      - "Focusing on personal credit."

  - external_key: "recruiter_screening.motivation_leadership.em_balance"
    competency_key: motivation
    topic: "Sustaining themselves"
    difficulty: hard
    text: "Management can be draining because you are carrying many people's problems. What practices keep you effective over years?"
    expected_concepts:
      - "habits"
      - "support network"
      - "boundaries"
      - "delegation"
      - "reflection"
    rubric:
      excellent: "Describes concrete habits and support networks."
      good: "Gives relevant reasons and some concrete detail about sustaining themselves, but links to the role stay general."
      weak: "Vague or generic answer on sustaining themselves that could apply to any job."
    followups:
      - "What has changed in how you work?"
      - "Who do you rely on?"
    common_errors:
      - "Denying difficulty."

  - external_key: "recruiter_screening.motivation_leadership.em_what_matters"
    competency_key: motivation
    topic: "Priorities in a manager role"
    difficulty: easy
    text: "When you think about the next management role, what are the top two things it must offer you?"
    expected_concepts:
      - "clear priorities"
      - "job-related"
      - "reasoning"
      - "fit with this role"
    rubric:
      excellent: "States two job-related priorities with reasons and connects them to this role."
      good: "Gives relevant reasons and some concrete detail about priorities in a manager role, but links to the role stay general."
      weak: "Vague or generic answer on priorities in a manager role that could apply to any job."
    followups:
      - "Does this role offer them?"
      - "What could you compromise on?"
    common_errors:
      - "Listing many wants."
