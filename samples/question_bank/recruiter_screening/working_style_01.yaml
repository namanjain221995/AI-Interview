# Curated questions: recruiter screening, working style (01 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.working_style.best_work_conditions
    competency_key: collaboration
    topic: "Conditions for good work"
    difficulty: easy
    text: "Think of a time you did some of your best work. What about how the work was set up helped?"
    expected_concepts:
      - "specific example"
      - "working conditions"
      - "own contribution"
      - "reflection"
    rubric:
      excellent: "Describes a concrete example, names the setup factors that helped and how they recreate them."
      good: "Describes an example with some factors."
      weak: "Gives generic statements with no example."
    followups:
      - "How could you recreate that?"
      - "What was your part?"
    common_errors:
      - "Gives generic statements with no example."

  - external_key: recruiter_screening.working_style.solo_or_together
    competency_key: collaboration
    topic: "Alone or together"
    difficulty: easy
    text: "How do you split your time between working on your own and working with others?"
    expected_concepts:
      - "balance"
      - "reasons"
      - "examples"
      - "flexibility"
    rubric:
      excellent: "Explains how the split depends on the task, with examples, and adapts to team norms."
      good: "States a preference with reasons."
      weak: "Insists on one mode without flexibility."
    followups:
      - "When is solo work better?"
      - "When do you bring others in?"
    common_errors:
      - "Insists on one mode without flexibility."

  - external_key: recruiter_screening.working_style.daily_planning
    competency_key: ownership
    topic: "Planning your day"
    difficulty: easy
    text: "How do you plan your day or week so the important work gets done?"
    expected_concepts:
      - "planning method"
      - "prioritisation"
      - "handling interruptions"
      - "example"
    rubric:
      excellent: "Describes a concrete routine, how they protect important work and how they adapt to changes."
      good: "Describes a basic to-do approach."
      weak: "Has no planning approach."
    followups:
      - "What happens when plans break?"
      - "What tools help?"
    common_errors:
      - "Has no planning approach."

  - external_key: recruiter_screening.working_style.async_vs_meetings
    competency_key: communication
    topic: "Written or live"
    difficulty: medium
    text: "When do you prefer to communicate in writing versus live conversation?"
    expected_concepts:
      - "criteria"
      - "examples"
      - "audience"
      - "efficiency"
    rubric:
      excellent: "Gives clear criteria with examples of when each works better and adapts to others."
      good: "States a preference with reasons."
      weak: "Always prefers one without reasons."
    followups:
      - "Give an example of when writing failed."
      - "How do you decide?"
    common_errors:
      - "Always prefers one without reasons."

  - external_key: recruiter_screening.working_style.receive_feedback
    competency_key: communication
    topic: "Receiving feedback"
    difficulty: easy
    text: "How do you like to receive feedback on your work, and what do you do with it?"
    expected_concepts:
      - "preferred format"
      - "openness"
      - "acting on it"
      - "example"
    rubric:
      excellent: "Describes how they like feedback, welcomes it and gives an example of acting on it."
      good: "Describes accepting feedback."
      weak: "Defensive or has no example."
    followups:
      - "Tell me about hard feedback you received."
      - "How do you ask for more?"
    common_errors:
      - "Defensive or has no example."

  - external_key: recruiter_screening.working_style.give_feedback
    competency_key: communication
    topic: "Giving feedback"
    difficulty: medium
    text: "How do you give feedback to a colleague whose work needs improvement?"
    expected_concepts:
      - "specific"
      - "timely"
      - "respectful"
      - "follow-up"
    rubric:
      excellent: "Describes giving specific, timely feedback focused on work with a follow-up and an example."
      good: "Describes giving feedback generally."
      weak: "Avoids giving feedback or is harsh."
    followups:
      - "What was the response?"
      - "When did it go badly?"
    common_errors:
      - "Avoids giving feedback or is harsh."

  - external_key: recruiter_screening.working_style.working_through_disagreement
    competency_key: collaboration
    topic: "Disagreeing at work"
    difficulty: easy
    text: "When a colleague sees a problem differently from you, what is your usual first move, and why does it work for you?"
    expected_concepts:
      - "specific situation"
      - "listening"
      - "resolution"
      - "outcome"
    rubric:
      excellent: "Describes understanding the other view, finding common ground and the result."
      good: "Describes the disagreement and a resolution."
      weak: "Avoided the conflict or won by escalation."
    followups:
      - "What did you learn?"
      - "How is the relationship now?"
    common_errors:
      - "Avoided the conflict or won by escalation."

  - external_key: recruiter_screening.working_style.deadline_approach
    competency_key: ownership
    topic: "Approach to deadlines"
    difficulty: easy
    text: "How do you approach a deadline that feels tight?"
    expected_concepts:
      - "breakdown"
      - "communication"
      - "prioritisation"
      - "example"
    rubric:
      excellent: "Describes breaking down the work, flagging risks early and cutting scope with stakeholders."
      good: "Describes working harder and prioritising."
      weak: "Says they just work longer or ignore it."
    followups:
      - "When did you miss one?"
      - "How early did you flag it?"
    common_errors:
      - "Says they just work longer or ignore it."

  - external_key: recruiter_screening.working_style.focus_time
    competency_key: ownership
    topic: "Protecting focus"
    difficulty: easy
    text: "How do you get uninterrupted time for work that needs concentration?"
    expected_concepts:
      - "methods"
      - "communication"
      - "flexibility"
      - "results"
    rubric:
      excellent: "Describes concrete methods and how they communicate availability to the team."
      good: "Describes a few tactics."
      weak: "Has no approach or ignores teammates' needs."
    followups:
      - "How do you handle urgent requests?"
      - "What do teammates think?"
    common_errors:
      - "Has no approach or ignores teammates' needs."

  - external_key: recruiter_screening.working_style.team_norms
    competency_key: collaboration
    topic: "Team ways of working"
    difficulty: medium
    text: "What working agreements or team norms have helped teams you were in?"
    expected_concepts:
      - "specific norms"
      - "reasons"
      - "adoption"
      - "examples"
    rubric:
      excellent: "Names specific norms, explains the problems they solved and how they were adopted."
      good: "Names some norms."
      weak: "Names none."
    followups:
      - "Which norm was hardest to keep?"
      - "What would you add?"
    common_errors:
      - "Names none."

  - external_key: recruiter_screening.working_style.pairing_preferences
    competency_key: collaboration
    topic: "Working side by side"
    difficulty: easy
    text: "How do you feel about pairing or working closely with someone on the same task?"
    expected_concepts:
      - "pros and cons"
      - "examples"
      - "adapting"
      - "results"
    rubric:
      excellent: "Describes when it helped, when it did not and how they make it work."
      good: "Says they are open to it."
      weak: "Rejects it or has no experience."
    followups:
      - "What makes a good partner?"
      - "How do you handle different paces?"
    common_errors:
      - "Rejects it or has no experience."

  - external_key: recruiter_screening.working_style.handling_ambiguity_style
    competency_key: adaptability
    topic: "Unclear instructions"
    difficulty: medium
    text: "How do you work when instructions are incomplete?"
    expected_concepts:
      - "clarifying questions"
      - "assumptions stated"
      - "iteration"
      - "example"
    rubric:
      excellent: "Describes asking targeted questions, writing assumptions down and checking early."
      good: "Says they ask questions."
      weak: "Waits or guesses silently."
    followups:
      - "Who do you ask?"
      - "How do you show your assumptions?"
    common_errors:
      - "Waits or guesses silently."

  - external_key: recruiter_screening.working_style.decision_style
    competency_key: problem_solving
    topic: "How you decide"
    difficulty: easy
    text: "How do you usually make decisions at work, particularly when information is incomplete?"
    expected_concepts:
      - "data and input"
      - "speed"
      - "reversibility"
      - "example"
    rubric:
      excellent: "Describes considering input and reversibility, deciding in time and learning from outcomes."
      good: "Describes a general approach."
      weak: "Decides without input or never decides."
    followups:
      - "Tell me about a decision that worked out poorly."
      - "Who do you involve?"
    common_errors:
      - "Decides without input or never decides."

  - external_key: recruiter_screening.working_style.managing_workload
    competency_key: ownership
    topic: "Managing your load"
    difficulty: medium
    text: "What do you do when you realise you have more work than you can finish?"
    expected_concepts:
      - "early signal"
      - "prioritisation"
      - "communication"
      - "outcome"
    rubric:
      excellent: "Describes flagging the issue early with options and agreeing what to drop or delay."
      good: "Describes working harder and asking for help."
      weak: "Stays silent until deadlines are missed."
    followups:
      - "How early do you raise it?"
      - "What do you offer your manager?"
    common_errors:
      - "Stays silent until deadlines are missed."

  - external_key: recruiter_screening.working_style.supporting_teammates
    competency_key: collaboration
    topic: "Helping teammates"
    difficulty: easy
    text: "How do you support teammates who are struggling with their work?"
    expected_concepts:
      - "noticing"
      - "offering help"
      - "boundaries"
      - "example"
    rubric:
      excellent: "Describes noticing signs, offering concrete help and keeping their own commitments."
      good: "Says they help when asked."
      weak: "Does not help or takes over."
    followups:
      - "Give an example."
      - "How do you balance this with your tasks?"
    common_errors:
      - "Does not help or takes over."

  - external_key: recruiter_screening.working_style.meeting_contribution
    competency_key: communication
    topic: "Meetings"
    difficulty: easy
    text: "What makes a meeting useful for you, and how do you contribute to it?"
    expected_concepts:
      - "preparation"
      - "participation"
      - "outcomes"
      - "example"
    rubric:
      excellent: "Describes preparing, contributing clearly and ensuring decisions and actions are recorded."
      good: "Describes attending and speaking up."
      weak: "Attends passively."
    followups:
      - "What would you cancel?"
      - "How do you handle a derailed meeting?"
    common_errors:
      - "Attends passively."

  - external_key: recruiter_screening.working_style.quality_collaboration_review
    competency_key: collaboration
    topic: "Having work reviewed"
    difficulty: medium
    text: "How do you feel about having your work reviewed by others, and how do you make reviews useful?"
    expected_concepts:
      - "openness"
      - "preparation"
      - "handling comments"
      - "example"
    rubric:
      excellent: "Describes preparing work for review, responding constructively to comments and learning from them."
      good: "Says reviews are fine."
      weak: "Dislikes reviews or ignores comments."
    followups:
      - "Give an example of useful review."
      - "How do you handle disagreement in review?"
    common_errors:
      - "Dislikes reviews or ignores comments."

  - external_key: recruiter_screening.working_style.work_rhythm
    competency_key: ownership
    topic: "Your work rhythm"
    difficulty: easy
    text: "How would you describe your working rhythm across a typical week?"
    expected_concepts:
      - "self-awareness"
      - "planning"
      - "adaptability"
      - "examples"
    rubric:
      excellent: "Describes a rhythm of focused work and communication and shows how they adapt to team needs."
      good: "Describes a general routine."
      weak: "Cannot describe a rhythm."
    followups:
      - "What is the best time for you to do deep work?"
      - "What changes when deadlines hit?"
    common_errors:
      - "Cannot describe a rhythm."

  - external_key: recruiter_screening.working_style.initiative_style
    competency_key: ownership
    topic: "Taking initiative"
    difficulty: medium
    text: "Tell me about a time you saw something that needed doing and nobody had asked you to do it."
    expected_concepts:
      - "noticing"
      - "action"
      - "coordination"
      - "result"
    rubric:
      excellent: "Describes spotting an issue, taking action with appropriate coordination and a clear result."
      good: "Describes taking initiative on a small item."
      weak: "Has no example."
    followups:
      - "Did you check with anyone first?"
      - "What was the result?"
    common_errors:
      - "Has no example."

  - external_key: recruiter_screening.working_style.different_working_styles
    competency_key: collaboration
    topic: "Differences among colleagues"
    difficulty: medium
    text: "What do you do to get a productive routine going with a teammate who prefers a completely different rhythm than yours?"
    expected_concepts:
      - "curiosity"
      - "adapting"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes understanding the other's approach, agreeing on how to work together and an example."
      good: "Says they adapt."
      weak: "Expects others to adapt or avoids them."
    followups:
      - "What did you change?"
      - "What did you keep?"
    common_errors:
      - "Expects others to adapt or avoids them."

  - external_key: recruiter_screening.working_style.information_sharing
    competency_key: communication
    topic: "Sharing information"
    difficulty: easy
    text: "How do you make sure teammates have the information they need from you?"
    expected_concepts:
      - "proactive sharing"
      - "channels"
      - "clarity"
      - "example"
    rubric:
      excellent: "Describes proactive updates, suitable channels and checking that others understood."
      good: "Shares when asked."
      weak: "Rarely shares."
    followups:
      - "What do you do when you are away?"
      - "Where do you write things down?"
    common_errors:
      - "Rarely shares."

  - external_key: recruiter_screening.working_style.responding_to_interruptions
    competency_key: ownership
    topic: "Dealing with urgent requests"
    difficulty: medium
    text: "How do you handle an urgent request that arrives while you are in the middle of other work?"
    expected_concepts:
      - "triage"
      - "communication"
      - "context switching"
      - "follow-up"
    rubric:
      excellent: "Describes assessing urgency, communicating trade-offs and returning to the interrupted work cleanly."
      good: "Says they handle the urgent thing first."
      weak: "Ignores or always drops everything."
    followups:
      - "How do you decide what is truly urgent?"
      - "What do you tell the requester?"
    common_errors:
      - "Ignores or always drops everything."

  - external_key: recruiter_screening.working_style.learning_from_team
    competency_key: collaboration
    topic: "Learning together"
    difficulty: easy
    text: "How do you contribute to a team's learning, for example after a project or an issue?"
    expected_concepts:
      - "retrospectives"
      - "sharing lessons"
      - "documentation"
      - "examples"
    rubric:
      excellent: "Describes specific practices such as retrospectives and written lessons and an improvement that resulted."
      good: "Mentions sharing lessons."
      weak: "Does not take part."
    followups:
      - "What was a useful retro?"
      - "What changed?"
    common_errors:
      - "Does not take part."

  - external_key: recruiter_screening.working_style.accountability_style
    competency_key: ownership
    topic: "Being accountable"
    difficulty: medium
    text: "How do you make sure others can rely on your commitments?"
    expected_concepts:
      - "clear commitments"
      - "early warnings"
      - "follow-through"
      - "example"
    rubric:
      excellent: "Describes making realistic commitments, giving early warnings and following through."
      good: "Says they keep promises."
      weak: "Over-promises or goes silent."
    followups:
      - "When did you have to renegotiate?"
      - "How do you track commitments?"
    common_errors:
      - "Over-promises or goes silent."

  - external_key: recruiter_screening.working_style.remote_working_habits
    competency_key: collaboration
    topic: "Working remotely or hybrid"
    difficulty: medium
    text: "If this role uses remote or hybrid collaboration, what habits make that work for you?"
    expected_concepts:
      - "communication"
      - "structure"
      - "visibility"
      - "boundaries"
    rubric:
      excellent: "Describes concrete habits for communication and visibility that fit the arrangement offered."
      good: "Describes general habits."
      weak: "Has no habits or is unwilling to adapt to the stated arrangement."
    followups:
      - "What is hardest about it?"
      - "How do you stay connected to the team?"
    common_errors:
      - "Has no habits or is unwilling to adapt to the stated arrangement."
