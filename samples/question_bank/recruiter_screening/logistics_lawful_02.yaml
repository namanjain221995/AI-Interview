# Curated questions: recruiter screening, logistics lawful (02 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.logistics_lawful.notice_period_overview
    competency_key: recruiter_fit
    topic: "Timing summary"
    difficulty: easy
    text: "Can you give me a quick overview of your timing, such as notice period and when you could realistically start?"
    expected_concepts:
      - "clear summary"
      - "dependencies"
      - "candidy about timing"
      - "flexibility"
    rubric:
      excellent: "Summarises notice, earliest start and what could shift it, in a clear way."
      good: "Gives the notice and start date."
      weak: "Gives unclear or inconsistent timing."
    followups:
      - "What could make it earlier?"
      - "What could make it later?"
    common_errors:
      - "Gives unclear or inconsistent timing."

  - external_key: recruiter_screening.logistics_lawful.handover_without_overlap
    competency_key: ownership
    topic: "Quick handover"
    difficulty: medium
    text: "If you needed to hand over a project in two weeks instead of four, what would you prioritise?"
    expected_concepts:
      - "prioritisation"
      - "documentation"
      - "stakeholder communication"
      - "risk"
    rubric:
      excellent: "Describes prioritising critical knowledge and risks, documenting and naming who takes over."
      good: "Describes a general handover."
      weak: "Cannot describe a prioritised approach."
    followups:
      - "What do you leave out?"
      - "How do you check the handover worked?"
    common_errors:
      - "Cannot describe a prioritised approach."

  - external_key: recruiter_screening.logistics_lawful.remote_first_experience
    competency_key: recruiter_fit
    topic: "Remote experience"
    difficulty: easy
    text: "This role is remote-first as the posting says. What has helped you work effectively from home or another remote space?"
    expected_concepts:
      - "experience"
      - "habits"
      - "communication"
      - "self-direction"
    rubric:
      excellent: "Describes habits and tools that have worked with a concrete example."
      good: "Describes some remote experience."
      weak: "Has no experience and no plan."
    followups:
      - "What do you find hard?"
      - "How do you stay visible?"
    common_errors:
      - "Has no experience and no plan."

  - external_key: recruiter_screening.logistics_lawful.hybrid_commute_planning
    competency_key: recruiter_fit
    topic: "Hybrid planning"
    difficulty: easy
    text: "With a hybrid arrangement of set office days, how would you plan your week?"
    expected_concepts:
      - "planning"
      - "matching tasks to location"
      - "communication"
      - "flexibility"
    rubric:
      excellent: "Describes planning collaborative work for office days and focus work for remote days."
      good: "Describes a general plan."
      weak: "Has no plan."
    followups:
      - "What do you save for office days?"
      - "What do you need from the team?"
    common_errors:
      - "Has no plan."

  - external_key: recruiter_screening.logistics_lawful.office_based_expectations
    competency_key: recruiter_fit
    topic: "Fully on-site role"
    difficulty: easy
    text: "This role is fully on site. What would you want to know about the working environment?"
    expected_concepts:
      - "relevant questions"
      - "practicality"
      - "interest"
      - "clarity"
    rubric:
      excellent: "Asks about team layout, collaboration and daily rhythm and shows they have considered the arrangement."
      good: "Asks general questions."
      weak: "Has no questions."
    followups:
      - "What matters most to you?"
      - "What is your experience of on-site teams?"
    common_errors:
      - "Has no questions."

  - external_key: recruiter_screening.logistics_lawful.timezone_collaboration
    competency_key: recruiter_fit
    topic: "Time zone coverage"
    difficulty: medium
    text: "The team works across two time zones with some early or late calls. How would you handle that?"
    expected_concepts:
      - "understanding"
      - "planning"
      - "fairness"
      - "communication"
    rubric:
      excellent: "Describes planning calls ahead, rotating inconvenient times where possible and communicating clearly."
      good: "Accepts occasional calls."
      weak: "Rejects flexibility."
    followups:
      - "What notice helps?"
      - "How do you make calls efficient?"
    common_errors:
      - "Rejects flexibility."

  - external_key: recruiter_screening.logistics_lawful.on_call_handling_scenario
    competency_key: problem_solving
    topic: "An on-call page"
    difficulty: hard
    text: "Imagine you are on call and an alert fires late in the evening. Walk me through how you would respond."
    expected_concepts:
      - "acknowledge"
      - "assess"
      - "escalate"
      - "communicate"
    rubric:
      excellent: "Describes acknowledging, assessing impact, following runbooks, escalating when needed and communicating."
      good: "Describes fixing the issue."
      weak: "Ignores process or panics."
    followups:
      - "When do you escalate?"
      - "What do you do afterwards?"
    common_errors:
      - "Ignores process or panics."

  - external_key: recruiter_screening.logistics_lawful.on_call_experience_prior
    competency_key: recruiter_fit
    topic: "Past on-call"
    difficulty: medium
    text: "Have you been part of an on-call rota before? What made it work well or badly?"
    expected_concepts:
      - "experience"
      - "sustainability"
      - "improvements"
      - "reflection"
    rubric:
      excellent: "Describes a rota experience with specific practices that worked or did not and improvements they pushed."
      good: "Describes basic experience."
      weak: "Has none and no view."
    followups:
      - "What would you change?"
      - "What support was available?"
    common_errors:
      - "Has none and no view."

  - external_key: recruiter_screening.logistics_lawful.preparing_for_on_call
    competency_key: ownership
    topic: "On-call preparation"
    difficulty: easy
    text: "Before an on-call shift, how do you prepare so you can respond well?"
    expected_concepts:
      - "runbooks"
      - "access"
      - "handover"
      - "planning"
    rubric:
      excellent: "Describes checking access, reading recent changes, preparing runbooks and agreeing the handover."
      good: "Describes some preparation."
      weak: "Does not prepare."
    followups:
      - "What do you check first?"
      - "What do you hand over after?"
    common_errors:
      - "Does not prepare."

  - external_key: recruiter_screening.logistics_lawful.travel_planning_example
    competency_key: ownership
    topic: "Travel experience"
    difficulty: easy
    text: "When you have travelled for work, what do you do to keep your work on track while away?"
    expected_concepts:
      - "planning"
      - "communication"
      - "tools"
      - "examples"
    rubric:
      excellent: "Describes advance planning, delegating and staying reachable with an example."
      good: "Describes travelling and working."
      weak: "Has no approach."
    followups:
      - "What went wrong once?"
      - "How do you prepare?"
    common_errors:
      - "Has no approach."

  - external_key: recruiter_screening.logistics_lawful.travel_notice_needs
    competency_key: communication
    topic: "Travel notice"
    difficulty: easy
    text: "For a role with occasional travel, how much advance notice helps you plan well?"
    expected_concepts:
      - "clear needs"
      - "planning"
      - "flexibility"
      - "communication"
    rubric:
      excellent: "States typical needs and how they handle shorter notice."
      good: "States a notice length."
      weak: "Has no view or rigid demands."
    followups:
      - "What do you do on short notice?"
      - "What do you need arranged?"
    common_errors:
      - "Has no view or rigid demands."

  - external_key: recruiter_screening.logistics_lawful.start_date_dependencies
    competency_key: recruiter_fit
    topic: "What affects your start"
    difficulty: medium
    text: "What would need to be settled on your side before you could confirm a start date?"
    expected_concepts:
      - "clear dependencies"
      - "timeline"
      - "communication"
      - "transparency"
    rubric:
      excellent: "Names specific job-related dependencies, expected timing and how they will keep us updated."
      good: "Names a dependency."
      weak: "Cannot say."
    followups:
      - "How soon will you know?"
      - "What can we do to help?"
    common_errors:
      - "Cannot say."

  - external_key: recruiter_screening.logistics_lawful.flexible_start
    competency_key: adaptability
    topic: "Start flexibility"
    difficulty: easy
    text: "If we wanted to bring you in earlier for part-time onboarding sessions, how might that work?"
    expected_concepts:
      - "flexibility"
      - "planning"
      - "boundaries"
      - "professionalism"
    rubric:
      excellent: "Describes what is possible within current obligations and how they would raise it."
      good: "Says maybe."
      weak: "Refuses or ignores obligations."
    followups:
      - "What would you need to ask your current employer?"
      - "How would you manage?"
    common_errors:
      - "Refuses or ignores obligations."

  - external_key: recruiter_screening.logistics_lawful.documentation_of_work_before_leaving
    competency_key: ownership
    topic: "Leave work documented"
    difficulty: medium
    text: "What would you leave documented so someone else could continue your work smoothly?"
    expected_concepts:
      - "documentation"
      - "context"
      - "contacts"
      - "status"
    rubric:
      excellent: "Describes documenting status, decisions, contacts and open items."
      good: "Describes notes."
      weak: "Has no approach."
    followups:
      - "Where would you store it?"
      - "How would you present it?"
    common_errors:
      - "Has no approach."

  - external_key: recruiter_screening.logistics_lawful.role_pattern_understanding
    competency_key: communication
    topic: "Understanding the pattern"
    difficulty: easy
    text: "Is there anything about the working pattern for this role that you would like us to explain further?"
    expected_concepts:
      - "clear questions"
      - "reading the posting"
      - "interest"
      - "practicality"
    rubric:
      excellent: "Asks specific questions about hours, location or coverage."
      good: "Asks one general question."
      weak: "Has none."
    followups:
      - "Why does that matter to you?"
      - "What would you hope for?"
    common_errors:
      - "Has none."

  - external_key: recruiter_screening.logistics_lawful.remote_collaboration_tools
    competency_key: collaboration
    topic: "Tools for distance work"
    difficulty: easy
    text: "Which communication tools have worked best for you when colleagues are in different places?"
    expected_concepts:
      - "tools"
      - "reasons"
      - "norms"
      - "examples"
    rubric:
      excellent: "Names tools with reasons and norms that made them effective."
      good: "Names tools."
      weak: "Names none."
    followups:
      - "What norms did the team agree?"
      - "What failed?"
    common_errors:
      - "Names none."

  - external_key: recruiter_screening.logistics_lawful.workspace_requirements
    competency_key: recruiter_fit
    topic: "Workspace needs"
    difficulty: easy
    text: "What do you need from a workspace to do the work in this role well?"
    expected_concepts:
      - "job-related needs"
      - "practicality"
      - "communication"
      - "flexibility"
    rubric:
      excellent: "Describes job-related needs, what they will arrange and what they would ask the company for."
      good: "Describes basic needs."
      weak: "Lists unrelated preferences."
    followups:
      - "What would you ask us to provide?"
      - "How do you manage if it is missing?"
    common_errors:
      - "Lists unrelated preferences."

  - external_key: recruiter_screening.logistics_lawful.meeting_times_flexibility
    competency_key: communication
    topic: "Meetings outside typical hours"
    difficulty: medium
    text: "Occasionally a meeting may fall outside usual hours because of the people involved. How would you handle that?"
    expected_concepts:
      - "flexibility"
      - "fairness"
      - "planning"
      - "communication"
    rubric:
      excellent: "Describes accommodating occasional meetings, asking for notice and balancing with other time."
      good: "Accepts them."
      weak: "Refuses."
    followups:
      - "What notice do you need?"
      - "How do you recover time?"
    common_errors:
      - "Refuses."

  - external_key: recruiter_screening.logistics_lawful.shift_pattern
    competency_key: recruiter_fit
    topic: "Shift patterns"
    difficulty: easy
    text: "If the role included rotating shifts as the posting states, how would you prepare to work them?"
    expected_concepts:
      - "understanding"
      - "planning"
      - "communication"
      - "reliability"
    rubric:
      excellent: "Describes planning around rotation, communicating availability and handing over between shifts."
      good: "Accepts the shifts."
      weak: "Avoids the topic."
    followups:
      - "What handover do you use?"
      - "What would you ask about the rota?"
    common_errors:
      - "Avoids the topic."

  - external_key: recruiter_screening.logistics_lawful.role_availability_expectation
    competency_key: recruiter_fit
    topic: "Responsiveness"
    difficulty: medium
    text: "This role needs reasonable responsiveness during working hours. How do you manage that alongside focused work?"
    expected_concepts:
      - "responsiveness norms"
      - "planning"
      - "communication"
      - "tools"
    rubric:
      excellent: "Describes agreed response times, setting status and focused time."
      good: "Says they reply fast."
      weak: "Is unavailable or constantly interrupted."
    followups:
      - "What response times work?"
      - "How do you let people know?"
    common_errors:
      - "Is unavailable or constantly interrupted."

  - external_key: recruiter_screening.logistics_lawful.leave_policy_questions
    competency_key: communication
    topic: "Practical questions"
    difficulty: easy
    text: "What practical questions do you have about how time off and working hours are handled in the role?"
    expected_concepts:
      - "relevant questions"
      - "preparation"
      - "clarity"
      - "courtesy"
    rubric:
      excellent: "Asks relevant questions about process and coverage."
      good: "Asks one question."
      weak: "Has no questions."
    followups:
      - "What matters most?"
      - "Where would you find the details?"
    common_errors:
      - "Has no questions."

  - external_key: recruiter_screening.logistics_lawful.offer_decision_timeline
    competency_key: communication
    topic: "Decision timing"
    difficulty: easy
    text: "If we made an offer, how much time would you need to consider it, and what would you want to clarify?"
    expected_concepts:
      - "timeline"
      - "clarity"
      - "communication"
      - "preparation"
    rubric:
      excellent: "States a realistic timeframe and lists questions they would like clarified."
      good: "States a timeframe."
      weak: "Gives no timeframe."
    followups:
      - "What would make it quicker?"
      - "Who else do you consult?"
    common_errors:
      - "Gives no timeframe."

  - external_key: recruiter_screening.logistics_lawful.coordinating_next_steps
    competency_key: communication
    topic: "Coordinating interviews"
    difficulty: easy
    text: "How would you like us to coordinate scheduling and share information about the next interview steps?"
    expected_concepts:
      - "preferred channel"
      - "response times"
      - "clarity"
      - "courtesy"
    rubric:
      excellent: "States preferred channels and response times and offers practical alternatives."
      good: "States a channel."
      weak: "Has no preference or is unreachable."
    followups:
      - "What notice helps you?"
      - "What details do you need beforehand?"
    common_errors:
      - "Has no preference or is unreachable."

  - external_key: recruiter_screening.logistics_lawful.current_commitments_handover_risk
    competency_key: ownership
    topic: "Project mid-flight"
    difficulty: hard
    text: "Suppose your current project is mid-flight when you want to leave. How would you protect it and the people on it?"
    expected_concepts:
      - "risk assessment"
      - "plan"
      - "communication"
      - "professionalism"
    rubric:
      excellent: "Describes assessing risk, agreeing a plan with the manager, documenting and arranging a clean handover."
      good: "Describes finishing what they can."
      weak: "Would leave regardless or refuses to plan."
    followups:
      - "What would you finish first?"
      - "Who would you inform?"
    common_errors:
      - "Would leave regardless or refuses to plan."

  - external_key: recruiter_screening.logistics_lawful.start_date_vs_project_cycle
    competency_key: recruiter_fit
    topic: "Aligning timing"
    difficulty: medium
    text: "Is there a natural point in your current work cycle that affects your timing, such as a release or a quarter end?"
    expected_concepts:
      - "work cycle awareness"
      - "timing options"
      - "communication"
      - "professionalism"
    rubric:
      excellent: "Names relevant milestones, explains the timing options and how they would plan."
      good: "Names a milestone."
      weak: "Does not know their cycle."
    followups:
      - "How would that change your date?"
      - "What would you need to confirm?"
    common_errors:
      - "Does not know their cycle."
