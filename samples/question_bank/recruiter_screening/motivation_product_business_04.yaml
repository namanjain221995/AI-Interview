  - external_key: "recruiter_screening.motivation_product_business.pm_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "If you joined us as a product manager, how would you spend your first few months?"
    expected_concepts:
      - "listening"
      - "customers"
      - "data"
      - "relationships"
      - "first delivery"
    rubric:
      excellent: "Describes listening and learning first, then one carefully chosen contribution."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
