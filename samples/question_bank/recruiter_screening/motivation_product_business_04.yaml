      - "observations"
      - "questions"
      - "interest"
    rubric:
      excellent: "Shows product review with constructive observations and questions."
      good: "Gives relevant reasons and some concrete detail about interest in our users, but links to the role stay general."
      weak: "Vague or generic answer on interest in our users that could apply to any job."
    followups:
      - "What one thing would you change?"
      - "What do you want to know about research?"
    common_errors:
      - "Not using the product."

  - external_key: "recruiter_screening.motivation_product_business.support_company"
    competency_key: recruiter_fit
    topic: "Interest in our customers"
    difficulty: easy
    text: "What do you know about our customers and products, and what do you want to find out about the support team?"
    expected_concepts:
      - "research"
      - "customers"
      - "tooling"
      - "questions"
    rubric:
      excellent: "Shows research and focused questions."
      good: "Gives relevant reasons and some concrete detail about interest in our customers, but links to the role stay general."
      weak: "Vague or generic answer on interest in our customers that could apply to any job."
    followups:
      - "How do you imagine our customers?"
      - "What would you ask the support lead?"
    common_errors:
