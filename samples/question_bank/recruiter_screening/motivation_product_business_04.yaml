version: 1
defaults:
  role_tags: [product_manager, project_manager, business_analyst, ux_designer, support_engineer]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_product_business.pm_company"
    competency_key: recruiter_fit
    topic: "Interest in our product"
    difficulty: easy
    text: "Have you tried our product? Tell me what you noticed and what you would like to ask us about it."
    expected_concepts:
      - "research"
      - "product opinions"
      - "questions"
      - "interest"
    rubric:
      excellent: "Shows research of the product and asks thoughtful questions."
      good: "Gives relevant reasons and some concrete detail about interest in our product, but links to the role stay general."
      weak: "Vague or generic answer on interest in our product that could apply to any job."
    followups:
      - "What would you improve?"
      - "What did you notice about our users?"
    common_errors:
      - "Not having used the product."

  - external_key: "recruiter_screening.motivation_product_business.proj_company"
    competency_key: recruiter_fit
    topic: "Interest in our projects"
    difficulty: easy
    text: "What do you know about the kind of projects we deliver, and what would you like to know?"
    expected_concepts:
      - "research"
      - "portfolio"
      - "questions"
      - "interest"
    rubric:
      excellent: "Shows research and asks good questions about portfolio and ways of working."
      good: "Gives relevant reasons and some concrete detail about interest in our projects, but links to the role stay general."
      weak: "Vague or generic answer on interest in our projects that could apply to any job."
    followups:
      - "What types of risk do you expect?"
      - "How do you imagine the team?"
    common_errors:
      - "No preparation."

  - external_key: "recruiter_screening.motivation_product_business.ba_company"
    competency_key: recruiter_fit
    topic: "Interest in our domain"
    difficulty: easy
    text: "What have you learned about our business, and what questions would you start with as an analyst?"
    expected_concepts:
      - "research"
      - "questions"
      - "processes"
      - "interest"
    rubric:
      excellent: "Shows research and offers useful starting questions."
      good: "Gives relevant reasons and some concrete detail about interest in our domain, but links to the role stay general."
      weak: "Vague or generic answer on interest in our domain that could apply to any job."
    followups:
      - "What would you map first?"
      - "Who would you talk to?"
    common_errors:
      - "No research."

  - external_key: "recruiter_screening.motivation_product_business.ux_company"
    competency_key: recruiter_fit
    topic: "Interest in our users"
    difficulty: easy
    text: "Have you looked at our product, and what would you ask about the users and the design team?"
    expected_concepts:
