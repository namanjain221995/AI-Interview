# Curated questions: recruiter screening, working style (02 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.working_style.ideal_team_setup
    competency_key: collaboration
    topic: "A team that works well"
    difficulty: easy
    text: "Describe how a team you enjoyed working in operated day to day."
    expected_concepts:
      - "specific practices"
      - "communication"
      - "roles"
      - "own contribution"
    rubric:
      excellent: "Describes concrete team practices and their own contribution to making them work."
      good: "Describes a good team in general."
      weak: "Describes only that people were nice."
    followups:
      - "What would you keep?"
      - "What would you change?"
    common_errors:
      - "Describes only that people were nice."

  - external_key: recruiter_screening.working_style.getting_started_on_task
    competency_key: ownership
    topic: "Starting a new task"
    difficulty: easy
    text: "When you get a new task, what do you do in the first hour?"
    expected_concepts:
      - "clarifying"
      - "planning"
      - "breaking down"
      - "checking in"
    rubric:
      excellent: "Describes clarifying the goal, breaking it down and identifying risks before starting."
      good: "Describes starting with a quick plan."
      weak: "Starts immediately without clarifying."
    followups:
      - "What questions do you ask?"
      - "When do you check in?"
    common_errors:
      - "Starts immediately without clarifying."

  - external_key: recruiter_screening.working_style.managing_multiple_projects
    competency_key: ownership
    topic: "Several projects at once"
    difficulty: easy
    text: "How do you manage when you are working on more than one thing at a time?"
    expected_concepts:
      - "prioritisation"
      - "tracking"
      - "communication"
      - "limits"
    rubric:
      excellent: "Describes an explicit tracking system, regular reprioritising and communicating limits."
      good: "Describes juggling with some tools."
      weak: "Says they multitask without limits."
    followups:
      - "What do you drop first?"
      - "How do you avoid context switching costs?"
    common_errors:
      - "Says they multitask without limits."

  - external_key: recruiter_screening.working_style.conflicting_instructions
    competency_key: communication
    topic: "Conflicting direction"
    difficulty: hard
    text: "What do you do if two people you work for give you conflicting instructions?"
    expected_concepts:
      - "surface conflict"
      - "facilitate agreement"
      - "escalate"
      - "outcome"
    rubric:
      excellent: "Describes bringing both parties together, clarifying priorities and escalating if needed."
      good: "Describes talking to both people."
      weak: "Follows one and ignores the other."
    followups:
      - "Has that happened?"
      - "Who decides in the end?"
    common_errors:
      - "Follows one and ignores the other."

  - external_key: recruiter_screening.working_style.communicating_bad_news
    competency_key: communication
    topic: "Delivering bad news"
    difficulty: easy
    text: "How do you tell someone that something is going to be late or has gone wrong?"
    expected_concepts:
      - "promptness"
      - "facts"
      - "options"
      - "follow-up"
    rubric:
      excellent: "Describes telling people promptly with facts, impact and options for recovery."
      good: "Describes telling them when asked."
      weak: "Delays or hides bad news."
    followups:
      - "What is an example?"
      - "How do you prepare?"
    common_errors:
      - "Delays or hides bad news."

  - external_key: recruiter_screening.working_style.working_with_senior_people
    competency_key: communication
    topic: "Working with senior colleagues"
    difficulty: easy
    text: "How do you work with people who are more senior than you?"
    expected_concepts:
      - "respect"
      - "preparation"
      - "speaking up"
      - "learning"
    rubric:
      excellent: "Describes preparing, speaking up with evidence and learning from them."
      good: "Describes working with them respectfully."
      weak: "Defers on everything or avoids them."
    followups:
      - "How do you disagree with them?"
      - "What have you learned?"
    common_errors:
      - "Defers on everything or avoids them."

  - external_key: recruiter_screening.working_style.leading_a_discussion
    competency_key: communication
    topic: "Running a discussion"
    difficulty: medium
    text: "If you needed to lead a discussion where people disagreed, how would you run it?"
    expected_concepts:
      - "structure"
      - "hearing all voices"
      - "decision method"
      - "follow-up"
    rubric:
      excellent: "Describes a structured approach that ensures every voice is heard and ends with a decision and owners."
      good: "Describes facilitating a conversation."
      weak: "Lets it run without structure."
    followups:
      - "Give an example."
      - "What if it stays stuck?"
    common_errors:
      - "Lets it run without structure."

  - external_key: recruiter_screening.working_style.collaboration_across_roles
    competency_key: collaboration
    topic: "Working across roles"
    difficulty: medium
    text: "Tell me about a time you collaborated with someone in a very different role from yours. What made it work?"
    expected_concepts:
      - "shared goals"
      - "vocabulary"
      - "respect"
      - "result"
    rubric:
      excellent: "Describes aligning on goals, translating terms and delivering a result together."
      good: "Describes working with them in general."
      weak: "Describes friction with no resolution."
    followups:
      - "What was the main misunderstanding?"
      - "What would you repeat?"
    common_errors:
      - "Describes friction with no resolution."

  - external_key: recruiter_screening.working_style.steady_vs_sprint
    competency_key: adaptability
    topic: "Pace preferences"
    difficulty: medium
    text: "Do you prefer steady pace or periodic bursts of intense work? How have you handled the other?"
    expected_concepts:
      - "self-awareness"
      - "adaptation"
      - "examples"
      - "limits"
    rubric:
      excellent: "Describes a preference, adapts to what the work needs and shares an example of the other."
      good: "States a preference with brief reasoning."
      weak: "Refuses to adapt."
    followups:
      - "When did a burst work?"
      - "How do you recover?"
    common_errors:
      - "Refuses to adapt."

  - external_key: recruiter_screening.working_style.independent_problem_solving
    competency_key: problem_solving
    topic: "Getting unstuck"
    difficulty: easy
    text: "When you are stuck on a problem, what steps do you take before asking for help?"
    expected_concepts:
      - "methodical steps"
      - "timebox"
      - "asking effectively"
      - "example"
    rubric:
      excellent: "Describes a method, a timebox and how they prepare a clear question."
      good: "Describes trying a few things."
      weak: "Asks immediately or never asks."
    followups:
      - "How long do you try?"
      - "How do you frame the question?"
    common_errors:
      - "Asks immediately or never asks."

  - external_key: recruiter_screening.working_style.perfectionism_vs_speed
    competency_key: ownership
    topic: "Good enough"
    difficulty: medium
    text: "How do you decide when work is good enough to hand over?"
    expected_concepts:
      - "criteria"
      - "stakeholder needs"
      - "iteration"
      - "example"
    rubric:
      excellent: "Describes using clear criteria and stakeholder needs, delivering iteratively."
      good: "Describes using judgement."
      weak: "Polishes endlessly or ships carelessly."
    followups:
      - "Give an example."
      - "Who decides?"
    common_errors:
      - "Polishes endlessly or ships carelessly."

  - external_key: recruiter_screening.working_style.team_conflict_witnessed
    competency_key: collaboration
    topic: "Tension between colleagues"
    difficulty: hard
    text: "Tell me about a time two colleagues had tension that affected the work. What did you do?"
    expected_concepts:
      - "observation"
      - "approach"
      - "neutrality"
      - "outcome"
    rubric:
      excellent: "Describes addressing the work impact, encouraging direct conversation and involving a manager if needed."
      good: "Describes staying neutral and hoping it resolves."
      weak: "Took sides or ignored it."
    followups:
      - "What was the result?"
      - "What would you do differently?"
    common_errors:
      - "Took sides or ignored it."

  - external_key: recruiter_screening.working_style.reading_instructions_carefully
    competency_key: ownership
    topic: "Following direction"
    difficulty: easy
    text: "How do you make sure you understood a task correctly before you begin?"
    expected_concepts:
      - "restating"
      - "clarifying"
      - "written summary"
      - "confirmation"
    rubric:
      excellent: "Describes restating the task, confirming success criteria and recording agreements."
      good: "Says they ask questions."
      weak: "Starts without confirming."
    followups:
      - "Give an example of a misunderstanding."
      - "What do you write down?"
    common_errors:
      - "Starts without confirming."

  - external_key: recruiter_screening.working_style.handling_competing_deadlines
    competency_key: ownership
    topic: "Deadlines that collide"
    difficulty: medium
    text: "How do you handle two deadlines that land in the same week?"
    expected_concepts:
      - "early planning"
      - "negotiation"
      - "scoping"
      - "communication"
    rubric:
      excellent: "Describes mapping effort, negotiating dates or scope early and updating stakeholders."
      good: "Describes working longer hours."
      weak: "Misses one without warning."
    followups:
      - "Who did you speak to?"
      - "What did you cut?"
    common_errors:
      - "Misses one without warning."

  - external_key: recruiter_screening.working_style.visibility_of_work
    competency_key: communication
    topic: "Making work visible"
    difficulty: medium
    text: "How do you make your progress visible to teammates without over-reporting?"
    expected_concepts:
      - "appropriate channels"
      - "cadence"
      - "brevity"
      - "example"
    rubric:
      excellent: "Describes concise updates at the right cadence and channel, with an example."
      good: "Describes updates in general."
      weak: "Over-reports or stays invisible."
    followups:
      - "What do you share in updates?"
      - "How do you know it is enough?"
    common_errors:
      - "Over-reports or stays invisible."

  - external_key: recruiter_screening.working_style.being_wrong
    competency_key: collaboration
    topic: "Being wrong"
    difficulty: medium
    text: "Tell me about a time you were wrong in front of colleagues. How did you handle it?"
    expected_concepts:
      - "acknowledging"
      - "correction"
      - "learning"
      - "effect on team"
    rubric:
      excellent: "Acknowledges the error plainly, corrects course and shows what they learned."
      good: "Acknowledges the error eventually."
      weak: "Defends the mistake or cannot recall one."
    followups:
      - "What did you say?"
      - "What did the team do?"
    common_errors:
      - "Defends the mistake or cannot recall one."

  - external_key: recruiter_screening.working_style.cadence_of_checkins
    competency_key: communication
    topic: "Check-ins with your manager"
    difficulty: easy
    text: "What cadence of check-ins with your manager works best for you, and what do you bring to them?"
    expected_concepts:
      - "preference"
      - "preparation"
      - "topics"
      - "flexibility"
    rubric:
      excellent: "Describes a cadence, what they prepare and how they adjust to the manager's style."
      good: "States a preference."
      weak: "Has no view."
    followups:
      - "What topics do you cover?"
      - "What if your manager is busy?"
    common_errors:
      - "Has no view."

  - external_key: recruiter_screening.working_style.trust_building
    competency_key: collaboration
    topic: "Building trust"
    difficulty: medium
    text: "How do you build trust with new teammates?"
    expected_concepts:
      - "reliability"
      - "communication"
      - "transparency"
      - "examples"
    rubric:
      excellent: "Describes consistent follow-through, clear communication and examples of trust earned."
      good: "Describes being friendly and helpful."
      weak: "Has no approach."
    followups:
      - "What damages trust?"
      - "How long does it take?"
    common_errors:
      - "Has no approach."

  - external_key: recruiter_screening.working_style.adapting_to_process
    competency_key: adaptability
    topic: "Following team process"
    difficulty: easy
    text: "How do you approach joining a team that has processes different from what you are used to?"
    expected_concepts:
      - "learning"
      - "following"
      - "suggesting changes"
      - "timing"
    rubric:
      excellent: "Describes learning and following the process first, then proposing improvements with evidence."
      good: "Describes adapting."
      weak: "Resists or immediately changes things."
    followups:
      - "Example?"
      - "When would you suggest a change?"
    common_errors:
      - "Resists or immediately changes things."

  - external_key: recruiter_screening.working_style.managing_distractions
    competency_key: ownership
    topic: "Staying on task"
    difficulty: easy
    text: "What helps you stay on task when there are many channels competing for your attention?"
    expected_concepts:
      - "specific tactics"
      - "boundaries"
      - "responsiveness"
      - "results"
    rubric:
      excellent: "Describes specific tactics, such as batching messages, balancing with team responsiveness."
      good: "Describes a few habits."
      weak: "Gets distracted often or is unreachable."
    followups:
      - "What do you turn off?"
      - "How do you stay reachable?"
    common_errors:
      - "Gets distracted often or is unreachable."

  - external_key: recruiter_screening.working_style.work_values_in_action
    competency_key: culture_values
    topic: "Values at work"
    difficulty: medium
    text: "Which working principle do you hold to even when it is inconvenient? Give an example."
    expected_concepts:
      - "specific principle"
      - "example"
      - "cost"
      - "outcome"
    rubric:
      excellent: "Names a principle and gives an example where it cost them something but led to a good outcome."
      good: "Names a principle with a weak example."
      weak: "Names a principle without example."
    followups:
      - "What happened?"
      - "Would you do it again?"
    common_errors:
      - "Names a principle without example."

  - external_key: recruiter_screening.working_style.leading_without_title
    competency_key: leadership
    topic: "Taking the lead informally"
    difficulty: medium
    text: "When have you stepped up to coordinate people without being asked to?"
    expected_concepts:
      - "trigger"
      - "coordination"
      - "communication"
      - "result"
    rubric:
      excellent: "Describes noticing the need, organising others and delivering a result while including the owner."
      good: "Describes helping coordinate."
      weak: "Never does or takes over."
    followups:
      - "How did the group react?"
      - "What would you do differently?"
    common_errors:
      - "Never does or takes over."

  - external_key: recruiter_screening.working_style.reflect_after_project
    competency_key: ownership
    topic: "After a project"
    difficulty: easy
    text: "What do you do after finishing a big piece of work to improve next time?"
    expected_concepts:
      - "retrospective"
      - "lessons"
      - "documentation"
      - "changes"
    rubric:
      excellent: "Describes a retrospective habit, concrete lessons and changes they applied next."
      good: "Mentions a quick reflection."
      weak: "Moves on without reflection."
    followups:
      - "What changed afterward?"
      - "Who joins the reflection?"
    common_errors:
      - "Moves on without reflection."

  - external_key: recruiter_screening.working_style.dealing_with_changing_requirements
    competency_key: adaptability
    topic: "Changing requirements"
    difficulty: medium
    text: "Tell me about a project where requirements changed midway. How did you handle it?"
    expected_concepts:
      - "re-planning"
      - "communication"
      - "trade-offs"
      - "outcome"
    rubric:
      excellent: "Describes assessing impact, renegotiating scope and keeping stakeholders informed."
      good: "Describes adapting."
      weak: "Resisted change or absorbed it silently."
    followups:
      - "What did you push back on?"
      - "How did you reset the plan?"
    common_errors:
      - "Resisted change or absorbed it silently."

  - external_key: recruiter_screening.working_style.inclusive_collaboration
    competency_key: collaboration
    topic: "Making space for others"
    difficulty: medium
    text: "How do you make sure everyone on a team has a chance to contribute their ideas?"
    expected_concepts:
      - "facilitation"
      - "written input"
      - "fairness"
      - "example"
    rubric:
      excellent: "Describes specific facilitation techniques and an example of better decisions as a result."
      good: "Describes inviting opinions."
      weak: "Has no approach."
    followups:
      - "What works in meetings?"
      - "What works in writing?"
    common_errors:
      - "Has no approach."
