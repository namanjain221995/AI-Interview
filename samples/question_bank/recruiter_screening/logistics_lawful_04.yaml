# Curated questions: recruiter screening, logistics lawful (04 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.logistics_lawful.timing_summary_for_offer
    competency_key: communication
    topic: "Offer timing"
    difficulty: easy
    text: "If we made an offer next week, how would the next four to six weeks look for you from a practical point of view?"
    expected_concepts:
      - "clear plan"
      - "milestones"
      - "transparency"
      - "flexibility"
    rubric:
      excellent: "Describes a realistic sequence of notice, handover and start."
      good: "Describes some steps."
      weak: "Has no plan."
    followups:
      - "Which step is least certain?"
      - "How could we help?"
    common_errors:
      - "Has no plan."

  - external_key: recruiter_screening.logistics_lawful.shortened_handover_approach
    competency_key: ownership
    topic: "Compact handover"
    difficulty: medium
    text: "What would an efficient handover look like if the time were short?"
    expected_concepts:
      - "prioritisation"
      - "documentation"
      - "delegation"
      - "communication"
    rubric:
      excellent: "Describes focusing on critical items, writing concise documentation and naming an owner."
      good: "Describes a typical handover."
      weak: "Cannot adapt."
    followups:
      - "What would you drop?"
      - "How do you test the handover?"
    common_errors:
      - "Cannot adapt."

  - external_key: recruiter_screening.logistics_lawful.schedule_for_travel_heavy_week
    competency_key: ownership
    topic: "A travel-heavy week"
    difficulty: easy
    text: "Imagine you have a week of site visits plus normal deliverables. How would you plan it?"
    expected_concepts:
      - "planning"
      - "prioritisation"
      - "communication"
      - "contingency"
    rubric:
      excellent: "Describes front-loading work, agreeing expectations and building buffers."
      good: "Describes working during travel."
      weak: "Has no plan."
    followups:
      - "What do you tell your team?"
      - "What slips?"
    common_errors:
      - "Has no plan."

  - external_key: recruiter_screening.logistics_lawful.cover_requirements_question
    competency_key: recruiter_fit
    topic: "Cover expectations"
    difficulty: easy
    text: "What would you like to clarify about the expectations for cover or availability in this role?"
    expected_concepts:
      - "useful questions"
      - "understanding"
      - "practicality"
      - "clarity"
    rubric:
      excellent: "Asks specific questions about frequency, notice and support."
      good: "Asks general questions."
      weak: "Has no questions."
    followups:
      - "Why are those important?"
      - "What would help you plan?"
    common_errors:
      - "Has no questions."

  - external_key: recruiter_screening.logistics_lawful.sustainable_on_call
    competency_key: ownership
    topic: "Making on-call sustainable"
    difficulty: hard
    text: "From your experience, what makes an on-call rota fair and sustainable for a team?"
    expected_concepts:
      - "rota design"
      - "runbooks"
      - "alert quality"
      - "escalation"
    rubric:
      excellent: "Names concrete practices such as fair rotation, good alerts, runbooks and review of incidents."
      good: "Names a couple of practices."
      weak: "Has no view or no experience."
    followups:
      - "How do you reduce noisy alerts?"
      - "What would you change first?"
    common_errors:
      - "Has no view or no experience."

  - external_key: recruiter_screening.logistics_lawful.timing_flexibility_two_way
    competency_key: adaptability
    topic: "Meeting in the middle"
    difficulty: medium
    text: "If your ideal start date and ours differed, how would you approach finding a middle ground?"
    expected_concepts:
      - "negotiation"
      - "options"
      - "clarity"
      - "professionalism"
    rubric:
      excellent: "Describes openly discussing constraints and proposing options like phased onboarding."
      good: "Says they would discuss."
      weak: "Insists on their date."
    followups:
      - "What could you shift?"
      - "What could we shift?"
    common_errors:
      - "Insists on their date."

  - external_key: recruiter_screening.logistics_lawful.onsite_collaboration_value
    competency_key: collaboration
    topic: "When on-site helps"
    difficulty: easy
    text: "When is being in the same room most valuable for your work, and how would you use on-site days?"
    expected_concepts:
      - "value of co-location"
      - "examples"
      - "planning"
      - "adaptability"
    rubric:
      excellent: "Describes tasks that benefit from being together and plans on-site days around them."
      good: "Says it helps teamwork."
      weak: "Sees no value or no plan."
    followups:
      - "What do you save for remote days?"
      - "How do you prepare?"
    common_errors:
      - "Sees no value or no plan."

  - external_key: recruiter_screening.logistics_lawful.hybrid_communication_habits
    competency_key: communication
    topic: "Hybrid communication"
    difficulty: medium
    text: "In a hybrid team, how do you make sure remote and on-site colleagues have the same information?"
    expected_concepts:
      - "written decisions"
      - "inclusive meetings"
      - "tools"
      - "examples"
    rubric:
      excellent: "Describes writing decisions down, running inclusive meetings and examples that worked."
      good: "Describes updating people."
      weak: "Relies on hallway conversation."
    followups:
      - "What do you do in meetings?"
      - "How do you check?"
    common_errors:
      - "Relies on hallway conversation."

  - external_key: recruiter_screening.logistics_lawful.remote_onboarding
    competency_key: adaptability
    topic: "Starting remotely"
    difficulty: easy
    text: "If you started remotely, how would you build relationships and context in the first weeks?"
    expected_concepts:
      - "proactive meetings"
      - "questions"
      - "documentation"
      - "feedback"
    rubric:
      excellent: "Describes scheduled intros, targeted questions and written notes with checkpoints."
      good: "Describes attending onboarding."
      weak: "Waits to be contacted."
    followups:
      - "Who would you meet first?"
      - "What would you ask?"
    common_errors:
      - "Waits to be contacted."

  - external_key: recruiter_screening.logistics_lawful.shift_handover
    competency_key: collaboration
    topic: "Handing over between shifts"
    difficulty: medium
    text: "If the role involved shift changes, how would you hand over to the next person?"
    expected_concepts:
      - "structured handover"
      - "written notes"
      - "open issues"
      - "contact"
    rubric:
      excellent: "Describes a structured note with status, risks and open items and confirms receipt."
      good: "Describes verbal updates."
      weak: "Leaves without handover."
    followups:
      - "What do you include?"
      - "How do you make sure it is read?"
    common_errors:
      - "Leaves without handover."

  - external_key: recruiter_screening.logistics_lawful.role_working_week_example
    competency_key: recruiter_fit
    topic: "Planning a week"
    difficulty: easy
    text: "How would you plan a typical working week in a role with a mix of meetings and focused delivery?"
    expected_concepts:
      - "time allocation"
      - "priorities"
      - "flexibility"
      - "communication"
    rubric:
      excellent: "Describes allocating time, protecting focus blocks and leaving buffers."
      good: "Describes a general week."
      weak: "Has no plan."
    followups:
      - "What gets scheduled first?"
      - "How do you adjust mid-week?"
    common_errors:
      - "Has no plan."

  - external_key: recruiter_screening.logistics_lawful.flexible_hours_example
    competency_key: ownership
    topic: "Using flexible hours well"
    difficulty: easy
    text: "If you had flexible start and finish times, how would you use them while serving the team?"
    expected_concepts:
      - "team needs"
      - "communication"
      - "reliability"
      - "boundaries"
    rubric:
      excellent: "Describes aligning flexibility with team overlap and communicating changes."
      good: "Says they would use it sensibly."
      weak: "Expects total freedom."
    followups:
      - "What would you tell the team?"
      - "What is the limit?"
    common_errors:
      - "Expects total freedom."

  - external_key: recruiter_screening.logistics_lawful.documentation_travel_expenses
    competency_key: ownership
    topic: "Following company processes"
    difficulty: easy
    text: "When travelling for work, how do you handle booking and reporting so you follow company processes?"
    expected_concepts:
      - "policy awareness"
      - "timely reporting"
      - "record keeping"
      - "example"
    rubric:
      excellent: "Describes following the policy, keeping records and submitting reports on time."
      good: "Says they follow the rules."
      weak: "Ignores process."
    followups:
      - "What do you do if the policy is unclear?"
      - "How do you track costs?"
    common_errors:
      - "Ignores process."

  - external_key: recruiter_screening.logistics_lawful.preferred_communication_during_process
    competency_key: communication
    topic: "Staying in touch"
    difficulty: easy
    text: "What is the best way to reach you during our process, and when are you usually reachable?"
    expected_concepts:
      - "channel"
      - "hours"
      - "responsiveness"
      - "courtesy"
    rubric:
      excellent: "States channels and reachable times and offers a back-up."
      good: "States a channel."
      weak: "Gives none."
    followups:
      - "Do you have a back-up?"
      - "How quickly do you reply?"
    common_errors:
      - "Gives none."

  - external_key: recruiter_screening.logistics_lawful.planning_ahead_for_coverage
    competency_key: collaboration
    topic: "Planned absences"
    difficulty: easy
    text: "How do you coordinate with a team when you know you will be unavailable for a planned period?"
    expected_concepts:
      - "advance notice"
      - "handover"
      - "coverage"
      - "documentation"
    rubric:
      excellent: "Describes giving notice, arranging cover and leaving clear notes."
      good: "Describes telling the manager."
      weak: "Leaves it to others."
    followups:
      - "How far ahead?"
      - "What do you leave behind?"
    common_errors:
      - "Leaves it to others."

  - external_key: recruiter_screening.logistics_lawful.alignment_of_work_patterns
    competency_key: culture_values
    topic: "Fit of working pattern"
    difficulty: medium
    text: "Looking at the working pattern described for this role, which parts suit you best and which would take planning?"
    expected_concepts:
      - "reading the posting"
      - "self-assessment"
      - "plan"
      - "clarity"
    rubric:
      excellent: "Names specific parts that suit them and a plan for those needing preparation."
      good: "Says it suits them."
      weak: "Raises concerns without plans."
    followups:
      - "What would you do about the second?"
      - "What would you ask us?"
    common_errors:
      - "Raises concerns without plans."

  - external_key: recruiter_screening.logistics_lawful.requests_for_adjustment
    competency_key: communication
    topic: "Raising a work practicality"
    difficulty: hard
    text: "If you needed a practical adjustment to the arrangement, such as an office day change, how would you raise it?"
    expected_concepts:
      - "timing"
      - "clear request"
      - "alternatives"
      - "professionalism"
    rubric:
      excellent: "Describes raising it early, explaining team impact and offering alternatives."
      good: "Says they would ask."
      weak: "Would not raise it or demands."
    followups:
      - "What would you propose?"
      - "What if it is refused?"
    common_errors:
      - "Would not raise it or demands."

  - external_key: recruiter_screening.logistics_lawful.planning_for_peak_deadlines
    competency_key: ownership
    topic: "Peak delivery weeks"
    difficulty: medium
    text: "When a peak delivery week arrives, how do you plan so the team can rely on you?"
    expected_concepts:
      - "planning"
      - "communication"
      - "buffers"
      - "recovery"
    rubric:
      excellent: "Describes early planning, communicating capacity and recovery afterward."
      good: "Describes working harder."
      weak: "Has no plan."
    followups:
      - "What do you do beforehand?"
      - "How do you recover?"
    common_errors:
      - "Has no plan."

  - external_key: recruiter_screening.logistics_lawful.evening_calls_with_regions
    competency_key: recruiter_fit
    topic: "Calls with other regions"
    difficulty: medium
    text: "If a few calls a month had to be at the edge of the working day because of other regions, how would you manage that?"
    expected_concepts:
      - "understanding"
      - "planning"
      - "fairness"
      - "communication"
    rubric:
      excellent: "Describes agreeing the schedule, adjusting hours that week and using written updates."
      good: "Accepts calls."
      weak: "Refuses."
    followups:
      - "What helps?"
      - "How do you keep calls effective?"
    common_errors:
      - "Refuses."

  - external_key: recruiter_screening.logistics_lawful.first_day_questions
    competency_key: communication
    topic: "Before day one"
    difficulty: easy
    text: "What would you want to know before your first day?"
    expected_concepts:
      - "useful questions"
      - "preparation"
      - "practicality"
      - "interest"
    rubric:
      excellent: "Asks about schedule, people and first tasks and describes preparing."
      good: "Asks general questions."
      weak: "Has none."
    followups:
      - "What would you do beforehand?"
      - "Who would you like to meet?"
    common_errors:
      - "Has none."

  - external_key: recruiter_screening.logistics_lawful.availability_for_onboarding_events
    competency_key: recruiter_fit
    topic: "Onboarding sessions"
    difficulty: easy
    text: "Our onboarding includes a few scheduled sessions across the first two weeks. How would you plan around them?"
    expected_concepts:
      - "planning"
      - "commitment"
      - "communication"
      - "flexibility"
    rubric:
      excellent: "Describes confirming dates, clearing conflicts and preparing questions."
      good: "Says they will attend."
      weak: "Has not planned."
    followups:
      - "What if one clashes?"
      - "What would you prepare?"
    common_errors:
      - "Has not planned."

  - external_key: recruiter_screening.logistics_lawful.role_commitment_period
    competency_key: recruiter_fit
    topic: "Initial commitments"
    difficulty: medium
    text: "For the first few months, what commitments do you expect to be able to give to onboarding and delivery?"
    expected_concepts:
      - "realistic commitments"
      - "communication"
      - "priorities"
      - "clarity"
    rubric:
      excellent: "Describes realistic commitments, how they prioritise and when they will raise constraints."
      good: "Says they will give full effort."
      weak: "Gives no specifics."
    followups:
      - "What would help?"
      - "How will you tell us?"
    common_errors:
      - "Gives no specifics."

  - external_key: recruiter_screening.logistics_lawful.tools_access_prep
    competency_key: ownership
    topic: "Access and setup"
    difficulty: easy
    text: "What setup and access would you want arranged before you start so that you can contribute early?"
    expected_concepts:
      - "specific access"
      - "planning"
      - "proactivity"
      - "communication"
    rubric:
      excellent: "Lists specific access and accounts and offers to help arrange them."
      good: "Lists a few items."
      weak: "Lists none."
    followups:
      - "Who should we contact?"
      - "How can you help?"
    common_errors:
      - "Lists none."

  - external_key: recruiter_screening.logistics_lawful.pre_start_learning_plan
    competency_key: ownership
    topic: "Preparing before day one"
    difficulty: easy
    text: "If you had a few weeks before starting, what preparation for the role would you consider doing?"
    expected_concepts:
      - "relevant preparation"
      - "reasonable scope"
      - "priorities"
      - "communication"
    rubric:
      excellent: "Describes light, relevant preparation such as reading product material while respecting current duties."
      good: "Describes general reading."
      weak: "Has no ideas."
    followups:
      - "What would you ask us for?"
      - "What would you skip?"
    common_errors:
      - "Has no ideas."

  - external_key: recruiter_screening.logistics_lawful.change_in_availability_note
    competency_key: communication
    topic: "Changing timelines"
    difficulty: medium
    text: "How do you let a team know early if a timeline you committed to starts to look at risk?"
    expected_concepts:
      - "early notice"
      - "facts"
      - "options"
      - "follow-up"
    rubric:
      excellent: "Describes giving facts, options and a revised commitment early."
      good: "Says they would let people know."
      weak: "Waits until the date passes."
    followups:
      - "Give an example."
      - "What do you propose?"
    common_errors:
      - "Waits until the date passes."
