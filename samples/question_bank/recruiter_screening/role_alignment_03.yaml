# Curated questions: recruiter screening, role alignment (03 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.role_alignment.explain_role_to_friend
    competency_key: communication
    topic: "Explaining the role simply"
    difficulty: easy
    text: "How would you explain what this job does to someone outside your field?"
    expected_concepts:
      - "plain language"
      - "accurate"
      - "key purpose"
      - "structure"
    rubric:
      excellent: "Gives a clear, jargon-free explanation capturing the purpose and main duties."
      good: "Gives an accurate but wordy explanation."
      weak: "Uses jargon or misses the purpose."
    followups:
      - "What is the key outcome?"
      - "What would you leave out?"
    common_errors:
      - "Uses jargon or misses the purpose."

  - external_key: recruiter_screening.role_alignment.daily_tasks_preference
    competency_key: motivation
    topic: "Tasks you gravitate to"
    difficulty: easy
    text: "Of the activities in this role, which would you be happiest doing most of the time?"
    expected_concepts:
      - "specific activities"
      - "reasons"
      - "evidence"
      - "awareness of balance"
    rubric:
      excellent: "Names specific activities with evidence of doing them well and recognises the need for balance."
      good: "Names activities with reasons."
      weak: "Names none or gives a vague answer."
    followups:
      - "What would you do less of?"
      - "When did you do that last?"
    common_errors:
      - "Names none or gives a vague answer."

  - external_key: recruiter_screening.role_alignment.previous_role_responsibility_mapping
    competency_key: recruiter_fit
    topic: "Mapping responsibilities"
    difficulty: easy
    text: "Take two responsibilities from the posting and tell me where you have done similar work."
    expected_concepts:
      - "accurate mapping"
      - "specific examples"
      - "outcomes"
      - "relevance"
    rubric:
      excellent: "Maps two responsibilities to specific examples with outcomes and notes the differences."
      good: "Gives examples with limited detail."
      weak: "Cannot map responsibilities to experience."
    followups:
      - "What was your part?"
      - "What was different?"
    common_errors:
      - "Cannot map responsibilities to experience."

  - external_key: recruiter_screening.role_alignment.key_deliverables
    competency_key: ownership
    topic: "Main deliverables"
    difficulty: medium
    text: "What do you think the key deliverables of this role are over a quarter?"
    expected_concepts:
      - "concrete deliverables"
      - "reasoning"
      - "prioritisation"
      - "check with manager"
    rubric:
      excellent: "Proposes concrete deliverables with reasoning and a plan to align with the manager."
      good: "Names a few deliverables."
      weak: "Names activities rather than deliverables."
    followups:
      - "How would you track them?"
      - "What could derail them?"
    common_errors:
      - "Names activities rather than deliverables."

  - external_key: recruiter_screening.role_alignment.role_growth_potential
    competency_key: motivation
    topic: "Where this role leads"
    difficulty: easy
    text: "Where do you see this role leading, and how does that fit your goals?"
    expected_concepts:
      - "understanding of progression"
      - "goal fit"
      - "realism"
      - "curiosity"
    rubric:
      excellent: "Explains where the role may lead based on research and links it to their goals realistically."
      good: "Gives a general view."
      weak: "Has not considered it."
    followups:
      - "What would you ask us?"
      - "What would be a stretch?"
    common_errors:
      - "Has not considered it."

  - external_key: recruiter_screening.role_alignment.solving_role_problems
    competency_key: problem_solving
    topic: "Problems in the role"
    difficulty: medium
    text: "What kinds of problems do you expect to be solving in this role, and how have you tackled similar ones?"
    expected_concepts:
      - "problem types"
      - "approach"
      - "experience"
      - "learning"
    rubric:
      excellent: "Describes expected problem types and a specific past example with method and result."
      good: "Gives general problem types."
      weak: "Cannot name any."
    followups:
      - "How do you start?"
      - "What do you do when stuck?"
    common_errors:
      - "Cannot name any."

  - external_key: recruiter_screening.role_alignment.relevant_project_example
    competency_key: ownership
    topic: "A relevant project"
    difficulty: easy
    text: "Tell me about a project that is most similar to the work you would do here."
    expected_concepts:
      - "specific project"
      - "contribution"
      - "results"
      - "relevance"
    rubric:
      excellent: "Describes a project with their role, outcomes and clear links to this job."
      good: "Describes a project with some relevance."
      weak: "Describes an unrelated project."
    followups:
      - "What was your biggest contribution?"
      - "What did you learn?"
    common_errors:
      - "Describes an unrelated project."

  - external_key: recruiter_screening.role_alignment.priorities_in_posting
    competency_key: recruiter_fit
    topic: "Reading between the lines"
    difficulty: medium
    text: "If you had to guess the top three priorities for this role from the posting, what would they be?"
    expected_concepts:
      - "careful reading"
      - "inference"
      - "reasons"
      - "confirmation"
    rubric:
      excellent: "Infers priorities with reasons from the posting and proposes confirming them."
      good: "Lists plausible priorities."
      weak: "Lists the first items in the posting."
    followups:
      - "What gives you that sense?"
      - "How would you confirm?"
    common_errors:
      - "Lists the first items in the posting."

  - external_key: recruiter_screening.role_alignment.not_your_strength
    competency_key: recruiter_fit
    topic: "Responsibilities that are not strengths"
    difficulty: hard
    text: "If a responsibility in this role were not one of your strengths, how would you handle it?"
    expected_concepts:
      - "self-awareness"
      - "plan to improve"
      - "seeking help"
      - "delivery"
    rubric:
      excellent: "Describes a plan to reach acceptable quality quickly, seeks help and keeps delivering."
      good: "Says they would work hard to improve."
      weak: "Avoids the responsibility or denies weakness."
    followups:
      - "Give an example from the past."
      - "Who helps?"
    common_errors:
      - "Avoids the responsibility or denies weakness."

  - external_key: recruiter_screening.role_alignment.role_autonomy_example
    competency_key: ownership
    topic: "Working autonomously"
    difficulty: medium
    text: "Tell me about a time you worked with little supervision. How did you structure your work?"
    expected_concepts:
      - "planning"
      - "check-ins"
      - "decisions"
      - "outcome"
    rubric:
      excellent: "Describes planning, regular communication and sound decisions with a clear result."
      good: "Describes working alone with some structure."
      weak: "Describes drifting or constant escalation."
    followups:
      - "How did you keep others informed?"
      - "What would you change?"
    common_errors:
      - "Describes drifting or constant escalation."

  - external_key: recruiter_screening.role_alignment.learning_role_domain
    competency_key: adaptability
    topic: "Domain knowledge"
    difficulty: easy
    text: "If the domain of this role is new to you, how would you build domain knowledge quickly?"
    expected_concepts:
      - "resources"
      - "people"
      - "hands-on practice"
      - "checking understanding"
    rubric:
      excellent: "Describes a plan of reading, conversations and practice with checks on understanding."
      good: "Describes some reading."
      weak: "Believes domain knowledge is not needed."
    followups:
      - "How long would it take?"
      - "How would you test yourself?"
    common_errors:
      - "Believes domain knowledge is not needed."

  - external_key: recruiter_screening.role_alignment.role_trade_offs
    competency_key: problem_solving
    topic: "Quality, speed and scope"
    difficulty: medium
    text: "In a role like this, how do you balance speed, quality and scope when time is short?"
    expected_concepts:
      - "trade-off reasoning"
      - "communication"
      - "example"
      - "outcomes"
    rubric:
      excellent: "Explains how they decide, involve stakeholders and document trade-offs, with an example."
      good: "Describes a general balance."
      weak: "Always chooses speed or perfection."
    followups:
      - "Who decides?"
      - "How do you communicate the trade-off?"
    common_errors:
      - "Always chooses speed or perfection."

  - external_key: recruiter_screening.role_alignment.role_documentation
    competency_key: communication
    topic: "Writing things down"
    difficulty: easy
    text: "How important is documenting your work in a role like this, and what do you document?"
    expected_concepts:
      - "purposeful documentation"
      - "audience"
      - "habits"
      - "examples"
    rubric:
      excellent: "Describes what, why and for whom they document, with an example of its value."
      good: "Says documentation matters."
      weak: "Rarely documents."
    followups:
      - "Who reads it?"
      - "How do you keep it current?"
    common_errors:
      - "Rarely documents."

  - external_key: recruiter_screening.role_alignment.contribution_to_team_goals
    competency_key: collaboration
    topic: "Contributing to team goals"
    difficulty: medium
    text: "How would you make sure your work in this role supports the goals of the team?"
    expected_concepts:
      - "alignment"
      - "communication"
      - "prioritisation"
      - "feedback"
    rubric:
      excellent: "Describes linking tasks to team goals through regular alignment and feedback."
      good: "Says they follow instructions."
      weak: "Focuses only on personal tasks."
    followups:
      - "How do you learn the goals?"
      - "What if your task seems off-goal?"
    common_errors:
      - "Focuses only on personal tasks."

  - external_key: recruiter_screening.role_alignment.role_responsibilities_in_crisis
    competency_key: ownership
    topic: "When things go wrong"
    difficulty: hard
    text: "Imagine something in your area of responsibility fails at a bad time. How would you respond as someone in this role?"
    expected_concepts:
      - "quick triage"
      - "communication"
      - "ownership"
      - "follow-up"
    rubric:
      excellent: "Describes triage, clear updates, fixing and a follow-up to prevent recurrence."
      good: "Describes fixing the problem."
      weak: "Blames others or freezes."
    followups:
      - "Have you been in this position?"
      - "What would you tell stakeholders?"
    common_errors:
      - "Blames others or freezes."

  - external_key: recruiter_screening.role_alignment.feedback_loops_role
    competency_key: communication
    topic: "Feedback in the role"
    difficulty: medium
    text: "What kind of feedback would you want from stakeholders in this role, and how would you collect it?"
    expected_concepts:
      - "methods"
      - "frequency"
      - "acting on it"
      - "examples"
    rubric:
      excellent: "Describes specific feedback mechanisms and an example of changing course."
      good: "Mentions asking for feedback."
      weak: "Waits for feedback."
    followups:
      - "What did you change?"
      - "Who would you ask?"
    common_errors:
      - "Waits for feedback."

  - external_key: recruiter_screening.role_alignment.role_specific_metrics
    competency_key: ownership
    topic: "Metrics you would watch"
    difficulty: medium
    text: "Which indicators would you personally watch to know your work in this role is going well?"
    expected_concepts:
      - "relevant metrics"
      - "reasons"
      - "avoiding vanity metrics"
      - "action"
    rubric:
      excellent: "Names relevant measures, explains their meaning and how they would act on them."
      good: "Names a few measures."
      weak: "Names no measures or irrelevant ones."
    followups:
      - "What would worry you?"
      - "Which one is misleading?"
    common_errors:
      - "Names no measures or irrelevant ones."

  - external_key: recruiter_screening.role_alignment.interest_in_domain
    competency_key: motivation
    topic: "Interest in the domain"
    difficulty: easy
    text: "What interests you about the field this role works in?"
    expected_concepts:
      - "specific interests"
      - "knowledge"
      - "experience"
      - "curiosity"
    rubric:
      excellent: "Describes concrete interests with knowledge and past engagement."
      good: "Shows general interest."
      weak: "Shows no knowledge of the field."
    followups:
      - "What have you read lately?"
      - "What is changing in it?"
    common_errors:
      - "Shows no knowledge of the field."

  - external_key: recruiter_screening.role_alignment.role_travel_to_learn
    competency_key: adaptability
    topic: "Learning from the team"
    difficulty: easy
    text: "Who in the team could you learn the most from in this role, and what would you hope to learn?"
    expected_concepts:
      - "thoughtful research"
      - "learning goals"
      - "reciprocity"
      - "openness to learning"
    rubric:
      excellent: "Names kinds of colleagues, specific learning goals and what they would offer in return."
      good: "Names general learning goals."
      weak: "Has not thought about it."
    followups:
      - "How would you ask?"
      - "What could you teach?"
    common_errors:
      - "Has not thought about it."

  - external_key: recruiter_screening.role_alignment.role_ambition_vs_scope
    competency_key: recruiter_fit
    topic: "Role bigger or smaller than you expect"
    difficulty: hard
    text: "If this role turned out smaller than your experience, or bigger, how would you handle each case?"
    expected_concepts:
      - "candid reflection"
      - "communication"
      - "adaptation"
      - "outcome focus"
    rubric:
      excellent: "Describes raising it constructively in both cases and finding ways to create value."
      good: "Describes adjusting to either case."
      weak: "Would leave or overreach."
    followups:
      - "Has this happened?"
      - "What would you propose?"
    common_errors:
      - "Would leave or overreach."

  - external_key: recruiter_screening.role_alignment.what_good_looks_like_month_three
    competency_key: ownership
    topic: "Three-month picture"
    difficulty: easy
    text: "What would you want to have accomplished by month three?"
    expected_concepts:
      - "clear milestones"
      - "realism"
      - "learning and delivery"
      - "alignment"
    rubric:
      excellent: "States clear realistic milestones covering learning and delivery."
      good: "States general goals."
      weak: "States unrealistic or vague goals."
    followups:
      - "How would you check progress?"
      - "What would you need?"
    common_errors:
      - "States unrealistic or vague goals."

  - external_key: recruiter_screening.role_alignment.role_values_alignment
    competency_key: culture_values
    topic: "Working values in the role"
    difficulty: medium
    text: "Which working values matter most for doing this job well?"
    expected_concepts:
      - "job-related values"
      - "examples"
      - "reasoning"
      - "behaviour"
    rubric:
      excellent: "Names values tied to the work, with behavioural examples."
      good: "Names common values."
      weak: "Names values without examples."
    followups:
      - "When have you shown it?"
      - "Which would be hardest?"
    common_errors:
      - "Names values without examples."

  - external_key: recruiter_screening.role_alignment.asking_help_in_role
    competency_key: collaboration
    topic: "Asking for help"
    difficulty: easy
    text: "How do you decide when to ask for help in a new role?"
    expected_concepts:
      - "clear thresholds"
      - "timeboxing"
      - "preparation"
      - "examples"
    rubric:
      excellent: "Describes a threshold such as timeboxing, comes prepared and gives an example."
      good: "Says they ask when stuck."
      weak: "Waits too long or asks too soon."
    followups:
      - "How do you phrase the question?"
      - "Who do you ask?"
    common_errors:
      - "Waits too long or asks too soon."

  - external_key: recruiter_screening.role_alignment.what_surprised_in_last_role
    competency_key: adaptability
    topic: "Surprises in a new role"
    difficulty: medium
    text: "What surprised you most in your last new role, and how did you adjust?"
    expected_concepts:
      - "specific surprise"
      - "adaptation"
      - "learning"
      - "application"
    rubric:
      excellent: "Describes a real surprise, adjustments made and how they use it now."
      good: "Describes a surprise and a basic adjustment."
      weak: "Says nothing surprised them."
    followups:
      - "What would you check in advance now?"
      - "How fast did you adapt?"
    common_errors:
      - "Says nothing surprised them."

  - external_key: recruiter_screening.role_alignment.role_learning_resources
    competency_key: adaptability
    topic: "Learning resources for the role"
    difficulty: easy
    text: "What resources would you use in your first month to learn the specifics of this role?"
    expected_concepts:
      - "specific resources"
      - "people"
      - "hands-on tasks"
      - "planning"
    rubric:
      excellent: "Names a mix of documentation, people and hands-on tasks and plans time for them."
      good: "Names a few resources."
      weak: "Names none."
    followups:
      - "Which would you start with?"
      - "What do you do if documentation is thin?"
    common_errors:
      - "Names none."
