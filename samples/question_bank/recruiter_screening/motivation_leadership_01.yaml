version: 1
defaults:
  role_tags: [tech_lead, engineering_manager]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_leadership.tl_why"
    competency_key: motivation
    topic: "Why tech lead"
    difficulty: easy
    text: "What made you step into a tech lead role instead of staying a hands-on engineer?"
    expected_concepts:
      - "reasons"
      - "what they enjoy about leading technically"
      - "examples"
      - "realistic view of the trade-offs"
    rubric:
      excellent: "Gives clear reasons, shows what they value in leading technical work and describes the trade-offs they accepted."
      good: "Gives relevant reasons and some concrete detail about why tech lead, but links to the role stay general."
      weak: "Vague or generic answer on why tech lead that could apply to any job."
    followups:
      - "What do you miss about pure coding?"
      - "What surprised you in the transition?"
    common_errors:
      - "Describing it as a title step."

  - external_key: "recruiter_screening.motivation_leadership.em_why"
    competency_key: motivation
    topic: "Why engineering management"
    difficulty: easy
    text: "What drew you toward managing engineers, and what do you find rewarding about it?"
    expected_concepts:
      - "motivation to grow people"
      - "leverage through teams"
      - "examples"
      - "realistic view"
    rubric:
      excellent: "Explains an interest in building teams and outcomes with concrete examples and realistic costs."
      good: "Gives relevant reasons and some concrete detail about why engineering management, but links to the role stay general."
      weak: "Vague or generic answer on why engineering management that could apply to any job."
    followups:
      - "What was the hardest part of the move?"
      - "What do you like least?"
    common_errors:
      - "Seeing management as a promotion only."

  - external_key: "recruiter_screening.motivation_leadership.tl_proud"
    competency_key: motivation
    topic: "Proud technical leadership"
    difficulty: easy
    text: "Tell me about a technical effort you led that you are proud of. What was your part as lead?"
    expected_concepts:
      - "goal"
      - "their leadership actions"
      - "team contribution"
      - "result"
      - "learning"
    rubric:
      excellent: "Describes the goal, how they guided the team and the outcome, with credit shared fairly."
      good: "Gives relevant reasons and some concrete detail about proud technical leadership, but links to the role stay general."
      weak: "Vague or generic answer on proud technical leadership that could apply to any job."
    followups:
      - "What would you do differently?"
      - "How did you involve the team?"
    common_errors:
      - "Doing all the work themselves."

  - external_key: "recruiter_screening.motivation_leadership.em_proud"
    competency_key: motivation
    topic: "Proud team outcome"
    difficulty: easy
    text: "Tell me about a team result you are proud of as a manager. What did you do to make it happen?"
    expected_concepts:
      - "situation"
      - "actions"
      - "team contribution"
      - "result"
      - "learning"
    rubric:
      excellent: "Describes the situation, what they did as manager and credits the team."
      good: "Gives relevant reasons and some concrete detail about proud team outcome, but links to the role stay general."
      weak: "Vague or generic answer on proud team outcome that could apply to any job."
    followups:
      - "What did the team do that surprised you?"
      - "What was hard?"
    common_errors:
      - "Taking sole credit."

  - external_key: "recruiter_screening.motivation_leadership.tl_good_week"
    competency_key: motivation
    topic: "A good week as lead"
    difficulty: easy
    text: "What does a good week look like for you as a tech lead, between coding, reviews and meetings?"
    expected_concepts:
      - "balance"
      - "reviews"
      - "mentoring"
      - "design work"
      - "realistic view"
    rubric:
      excellent: "Describes a realistic balance including design, reviews and unblocking others."
      good: "Gives relevant reasons and some concrete detail about a good week as lead, but links to the role stay general."
      weak: "Vague or generic answer on a good week as lead that could apply to any job."
    followups:
      - "How much do you still code?"
      - "What takes more time than you expect?"
    common_errors:
      - "Wanting only coding time."

  - external_key: "recruiter_screening.motivation_leadership.em_good_week"
    competency_key: motivation
    topic: "A good week as manager"
    difficulty: easy
    text: "What does a week look like when you feel you've had a real effect as a manager?"
    expected_concepts:
      - "one-to-ones"
      - "unblocking"
      - "planning"
      - "coaching"
      - "realistic view"
    rubric:
      excellent: "Describes concrete management activities and impact, with realistic balance."
      good: "Gives relevant reasons and some concrete detail about a good week as manager, but links to the role stay general."
      weak: "Vague or generic answer on a good week as manager that could apply to any job."
    followups:
      - "How do you protect time for the team?"
      - "What do you let go of?"
    common_errors:
      - "Describing meetings only."

  - external_key: "recruiter_screening.motivation_leadership.tl_coding_balance"
    competency_key: motivation
    topic: "Hands-on time"
    difficulty: easy
    text: "How much hands-on coding do you want to keep doing as a tech lead, and how do you make that work?"
    expected_concepts:
      - "desired balance"
      - "reasons"
      - "trade-offs"
      - "practical habits"
    rubric:
      excellent: "Gives a reasoned balance with practices such as taking low-risk tasks and delegating critical path work."
      good: "Gives relevant reasons and some concrete detail about hands-on time, but links to the role stay general."
      weak: "Vague or generic answer on hands-on time that could apply to any job."
    followups:
      - "What kinds of coding tasks do you take?"
      - "What do you hand off?"
    common_errors:
      - "Wanting to code everything."

  - external_key: "recruiter_screening.motivation_leadership.em_tech_depth"
    competency_key: motivation
    topic: "Technical involvement"
    difficulty: easy
    text: "How technical do you want to stay as an engineering manager, and how do you keep up?"
    expected_concepts:
      - "desired depth"
      - "practices such as design reviews"
      - "learning"
      - "trust in team"
    rubric:
      excellent: "Describes staying informed through reviews and discussions while trusting the team."
      good: "Gives relevant reasons and some concrete detail about technical involvement, but links to the role stay general."
      weak: "Vague or generic answer on technical involvement that could apply to any job."
    followups:
      - "Where do you draw the line?"
      - "How do you avoid micromanaging?"
    common_errors:
      - "Dropping all technical involvement."

  - external_key: "recruiter_screening.motivation_leadership.tl_mentoring"
    competency_key: mentoring
    topic: "Mentoring appeal"
    difficulty: easy
    text: "What do you enjoy about helping other engineers grow?"
    expected_concepts:
      - "examples of mentoring"
      - "approach"
      - "outcomes"
      - "reflection"
    rubric:
      excellent: "Gives specific examples of mentoring with outcomes for the engineer."
      good: "Gives relevant reasons and some concrete detail about mentoring appeal, but links to the role stay general."
      weak: "Vague or generic answer on mentoring appeal that could apply to any job."
    followups:
      - "Tell me about someone you helped."
      - "What did you learn from it?"
    common_errors:
      - "Generic statements."

  - external_key: "recruiter_screening.motivation_leadership.em_people_growth"
    competency_key: people_management
    topic: "Growing people"
    difficulty: easy
    text: "What do you find rewarding about developing people on your team?"
    expected_concepts:
      - "examples"
      - "approach"
      - "outcomes"
      - "reflection"
    rubric:
      excellent: "Gives examples of helping individuals grow with concrete outcomes."
      good: "Gives relevant reasons and some concrete detail about growing people, but links to the role stay general."
      weak: "Vague or generic answer on growing people that could apply to any job."
    followups:
      - "Tell me about a person you helped grow."
      - "How do you handle someone not progressing?"
    common_errors:
      - "Describing process only."

  - external_key: "recruiter_screening.motivation_leadership.tl_scope"
    competency_key: recruiter_fit
    topic: "Interest in this lead role"
    difficulty: easy
    text: "What about this tech lead role interests you most?"
    expected_concepts:
      - "read posting"
      - "team and system"
      - "responsibilities"
      - "experience"
    rubric:
      excellent: "Cites specifics of the role and links them to experience."
      good: "Gives relevant reasons and some concrete detail about interest in this lead role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this lead role that could apply to any job."
    followups:
      - "What do you want to know about the team?"
      - "What would you do first?"
    common_errors:
      - "Not knowing the team."

  - external_key: "recruiter_screening.motivation_leadership.em_scope"
    competency_key: recruiter_fit
    topic: "Interest in this management role"
    difficulty: easy
    text: "What about this engineering manager role appeals to you?"
    expected_concepts:
      - "read posting"
      - "team size and mission"
      - "responsibilities"
      - "experience"
    rubric:
      excellent: "Cites specifics of the role and links them to experience."
      good: "Gives relevant reasons and some concrete detail about interest in this management role, but links to the role stay general."
      weak: "Vague or generic answer on interest in this management role that could apply to any job."
    followups:
      - "What questions do you have about the org?"
      - "What would you want to own?"
    common_errors:
      - "General management talk."

  - external_key: "recruiter_screening.motivation_leadership.tl_team_style"
    competency_key: recruiter_fit
    topic: "Leadership style"
    difficulty: medium
    text: "How would the engineers who worked with you describe how you lead technically?"
    expected_concepts:
      - "self-awareness"
      - "examples"
      - "feedback received"
      - "adjustments"
    rubric:
      excellent: "Describes their approach with specific feedback and adjustments."
      good: "Gives relevant reasons and some concrete detail about leadership style, but links to the role stay general."
      weak: "Vague or generic answer on leadership style that could apply to any job."
    followups:
      - "What feedback did you get?"
      - "What have you changed?"
    common_errors:
      - "Claiming perfect results."

  - external_key: "recruiter_screening.motivation_leadership.em_style"
    competency_key: recruiter_fit
    topic: "Management style"
    difficulty: medium
    text: "How do you tend to run a team, and how has that style changed over time?"
    expected_concepts:
      - "approach"
      - "examples"
      - "change"
      - "reflection"
    rubric:
      excellent: "Describes a clear approach with examples of how it evolved from feedback."
      good: "Gives relevant reasons and some concrete detail about management style, but links to the role stay general."
      weak: "Vague or generic answer on management style that could apply to any job."
    followups:
      - "What feedback shaped it?"
      - "How do you adapt to individuals?"
    common_errors:
      - "Rigid style."

  - external_key: "recruiter_screening.motivation_leadership.tl_decisions"
    competency_key: leadership
    topic: "Making technical decisions"
    difficulty: medium
    text: "How do you like to make technical decisions as a lead, and how do you involve the team?"
    expected_concepts:
      - "decision approach"
      - "documentation"
      - "consultation"
      - "disagreement"
      - "example"
    rubric:
      excellent: "Describes a decision process with consultation and an example of handling disagreement."
      good: "Gives relevant reasons and some concrete detail about making technical decisions, but links to the role stay general."
      weak: "Vague or generic answer on making technical decisions that could apply to any job."
    followups:
      - "Tell me about a decision the team disagreed with."
      - "What do you write down?"
    common_errors:
      - "Deciding alone or by consensus always."

  - external_key: "recruiter_screening.motivation_leadership.em_delivery"
    competency_key: leadership
    topic: "Delivery ownership"
    difficulty: medium
    text: "How do you feel about being accountable for what your team delivers, and what helps you?"
    expected_concepts:
      - "accountability"
      - "planning"
      - "communication"
      - "support"
      - "example"
    rubric:
      excellent: "Shows accountability with practices and an example."
      good: "Gives relevant reasons and some concrete detail about delivery ownership, but links to the role stay general."
      weak: "Vague or generic answer on delivery ownership that could apply to any job."
    followups:
      - "Tell me about a missed commitment."
      - "How do you protect the team?"
    common_errors:
      - "Blaming the team."

  - external_key: "recruiter_screening.motivation_leadership.tl_debt"
    competency_key: motivation
    topic: "Technical debt"
    difficulty: medium
    text: "How do you make the case for work on technical debt, and why does it matter to you?"
    expected_concepts:
      - "evidence"
      - "business framing"
      - "prioritisation"
      - "example"
    rubric:
      excellent: "Gives an example of making a business case with evidence and sensible limits."
      good: "Gives relevant reasons and some concrete detail about technical debt, but links to the role stay general."
      weak: "Vague or generic answer on technical debt that could apply to any job."
    followups:
      - "Tell me about debt you got prioritised."
      - "Which debt would you leave?"
    common_errors:
      - "Wanting to fix everything."

  - external_key: "recruiter_screening.motivation_leadership.em_hiring"
    competency_key: leadership
    topic: "Building a team"
    difficulty: medium
    text: "What do you enjoy and find difficult about hiring and building a team?"
    expected_concepts:
      - "process"
      - "fairness"
      - "calibration"
      - "examples"
      - "learning"
    rubric:
      excellent: "Describes a structured, fair process with an example and reflection."
      good: "Gives relevant reasons and some concrete detail about building a team, but links to the role stay general."
      weak: "Vague or generic answer on building a team that could apply to any job."
    followups:
      - "Tell me about a hire that went well."
      - "How do you reduce bias in hiring?"
    common_errors:
      - "Hiring on gut feel."

  - external_key: "recruiter_screening.motivation_leadership.tl_cross_team"
    competency_key: stakeholder_management
    topic: "Working across teams"
    difficulty: medium
    text: "How do you work with other teams when your work depends on theirs?"
    expected_concepts:
      - "relationships"
      - "communication"
      - "escalation"
      - "examples"
    rubric:
      excellent: "Describes proactive coordination and an example of resolving a dependency."
      good: "Gives relevant reasons and some concrete detail about working across teams, but links to the role stay general."
      weak: "Vague or generic answer on working across teams that could apply to any job."
    followups:
      - "Tell me about a dependency that slipped."
      - "How do you build trust?"
    common_errors:
      - "Escalating immediately."

  - external_key: "recruiter_screening.motivation_leadership.em_stakeholders"
    competency_key: stakeholder_management
    topic: "Working with product and leadership"
    difficulty: medium
    text: "How do you work with product managers and senior leaders to agree what your team takes on?"
    expected_concepts:
      - "negotiation"
      - "capacity"
      - "transparency"
      - "examples"
    rubric:
      excellent: "Describes transparent capacity discussions and an example of a negotiated outcome."
      good: "Gives relevant reasons and some concrete detail about working with product and leadership, but links to the role stay general."
      weak: "Vague or generic answer on working with product and leadership that could apply to any job."
    followups:
      - "Tell me about a time you pushed back."
      - "How do you communicate capacity?"
    common_errors:
      - "Taking everything on."

  - external_key: "recruiter_screening.motivation_leadership.tl_underperform"
    competency_key: leadership
    topic: "Supporting teammates"
    difficulty: medium
    text: "How do you support an engineer on your team who is struggling with the work?"
    expected_concepts:
      - "diagnosis"
      - "conversation"
      - "support"
      - "expectations"
      - "example"
    rubric:
      excellent: "Describes understanding the cause, offering support and agreeing expectations."
      good: "Gives relevant reasons and some concrete detail about supporting teammates, but links to the role stay general."
      weak: "Vague or generic answer on supporting teammates that could apply to any job."
    followups:
      - "What did you try first?"
      - "When do you involve the manager?"
    common_errors:
      - "Ignoring or taking over."

  - external_key: "recruiter_screening.motivation_leadership.em_perf"
    competency_key: people_management
    topic: "Performance conversations"
    difficulty: hard
    text: "Tell me about a time you had to address performance with someone on your team. How did you approach it and what happened?"
    expected_concepts:
      - "preparation"
      - "clear expectations"
      - "support"
      - "documentation"
      - "outcome"
    rubric:
      excellent: "Describes fair, clear expectations and support with documented follow-up."
      good: "Gives relevant reasons and some concrete detail about performance conversations, but links to the role stay general."
      weak: "Vague or generic answer on performance conversations that could apply to any job."
    followups:
      - "What would you do differently?"
      - "How did the team respond?"
    common_errors:
      - "Avoiding the conversation."

  - external_key: "recruiter_screening.motivation_leadership.tl_authority"
    competency_key: leadership
    topic: "Leading without authority"
    difficulty: hard
    text: "Tell me about a time you led a technical change where you had no formal authority over the people involved."
    expected_concepts:
      - "influence"
      - "evidence"
      - "relationships"
      - "persistence"
      - "result"
    rubric:
      excellent: "Describes influence through evidence and relationships with a clear result."
      good: "Gives relevant reasons and some concrete detail about leading without authority, but links to the role stay general."
      weak: "Vague or generic answer on leading without authority that could apply to any job."
    followups:
      - "What resistance did you meet?"
      - "What would you change?"
    common_errors:
      - "Using escalation."

  - external_key: "recruiter_screening.motivation_leadership.em_scale"
    competency_key: leadership
    topic: "Growing scope"
    difficulty: hard
    text: "If your team doubled, what would you want to be different about how you lead, and why?"
    expected_concepts:
      - "self-awareness"
      - "delegation"
      - "structure"
      - "communication"
      - "learning"
    rubric:
      excellent: "Describes realistic changes such as delegation and clearer structure, with reasoning."
      good: "Gives relevant reasons and some concrete detail about growing scope, but links to the role stay general."
      weak: "Vague or generic answer on growing scope that could apply to any job."
    followups:
      - "What would you let go of?"
      - "Who would you rely on?"
    common_errors:
      - "Thinking nothing would change."

  - external_key: "recruiter_screening.motivation_leadership.tl_credit"
    competency_key: leadership
    topic: "Sharing credit"
    difficulty: easy
    text: "How do you make sure the people on your team get credit for their work when you are the one presenting?"
    expected_concepts:
      - "visibility"
      - "naming contributors"
      - "delegation of presenting"
      - "example"
    rubric:
      excellent: "Gives practical ways of naming contributors and handing the floor to them."
      good: "Gives relevant reasons and some concrete detail about sharing credit, but links to the role stay general."
      weak: "Vague or generic answer on sharing credit that could apply to any job."
    followups:
      - "Tell me about someone you put forward."
      - "How do you handle shared wins?"
    common_errors:
      - "Presenting the work as their own."
