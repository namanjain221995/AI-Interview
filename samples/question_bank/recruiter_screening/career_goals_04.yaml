# Curated questions: recruiter screening, career goals (04 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.career_goals.career_story_so_far
    competency_key: communication
    topic: "Your career story"
    difficulty: easy
    text: "How would you describe the thread that connects the roles you have had so far?"
    expected_concepts:
      - "coherent narrative"
      - "key choices"
      - "growth"
      - "link to this role"
    rubric:
      excellent: "Tells a coherent story with clear reasons for each move that leads naturally to this role."
      good: "Describes the roles with some connection."
      weak: "Lists jobs without any thread."
    followups:
      - "Which move mattered most?"
      - "Where does this role fit?"
    common_errors:
      - "Lists jobs without any thread."

  - external_key: recruiter_screening.career_goals.priorities_in_job_search
    competency_key: motivation
    topic: "What matters in your search"
    difficulty: easy
    text: "What are you prioritising in your search right now?"
    expected_concepts:
      - "clear priorities"
      - "job-related reasons"
      - "fit with role"
      - "flexibility"
    rubric:
      excellent: "Names clear job-related priorities, explains why and shows how this role meets them."
      good: "Names a few priorities."
      weak: "Priorities are unclear or unrelated to work."
    followups:
      - "Which could you compromise on?"
      - "What have you ruled out and why?"
    common_errors:
      - "Priorities are unclear or unrelated to work."

  - external_key: recruiter_screening.career_goals.expertise_to_build_credibility
    competency_key: motivation
    topic: "Building credibility"
    difficulty: easy
    text: "When you start in a new team, how do you build credibility?"
    expected_concepts:
      - "early contributions"
      - "listening"
      - "delivering"
      - "communication"
    rubric:
      excellent: "Describes listening first, small early wins and consistent follow-through with examples."
      good: "Describes general steps."
      weak: "Expects credibility from experience alone."
    followups:
      - "What did you do in your last move?"
      - "How did you earn trust?"
    common_errors:
      - "Expects credibility from experience alone."

  - external_key: recruiter_screening.career_goals.growth_from_code_review
    competency_key: collaboration
    topic: "Growth through collaboration"
    difficulty: medium
    text: "How has working closely with others, for example through reviews or pairing, helped your development?"
    expected_concepts:
      - "specific practices"
      - "lessons"
      - "openness"
      - "application"
    rubric:
      excellent: "Gives specific examples of lessons drawn from collaboration and how they changed their work."
      good: "Mentions benefits generally."
      weak: "Prefers to work alone with no examples."
    followups:
      - "What was a key comment you got?"
      - "How do you give feedback?"
    common_errors:
      - "Prefers to work alone with no examples."

  - external_key: recruiter_screening.career_goals.what_makes_you_stay
    competency_key: culture_values
    topic: "What keeps you engaged"
    difficulty: easy
    text: "What has made you want to stay in a role for a long time, or leave one sooner?"
    expected_concepts:
      - "job-related factors"
      - "reasoning"
      - "patterns"
      - "self-awareness"
    rubric:
      excellent: "Names job-related factors with examples and shows how that guides their choice now."
      good: "Names a few factors."
      weak: "Cites only pay or blames others."
    followups:
      - "What would you look for here?"
      - "What warning signs do you watch for?"
    common_errors:
      - "Cites only pay or blames others."

  - external_key: recruiter_screening.career_goals.ambition_expressed
    competency_key: motivation
    topic: "Ambition"
    difficulty: easy
    text: "How would you describe your ambition at work?"
    expected_concepts:
      - "clear aspirations"
      - "concrete examples"
      - "balance with collaboration"
      - "realism"
    rubric:
      excellent: "Describes a clear ambition with examples of acting on it and respect for team success."
      good: "Describes ambition in general terms."
      weak: "Appears unambitious or only title-driven."
    followups:
      - "How does it show up day to day?"
      - "How do you balance it with the team?"
    common_errors:
      - "Appears unambitious or only title-driven."

  - external_key: recruiter_screening.career_goals.upskilling_on_the_job
    competency_key: motivation
    topic: "Using work for learning"
    difficulty: easy
    text: "How do you use your day-to-day work as a way to learn?"
    expected_concepts:
      - "intentional learning"
      - "examples"
      - "seeking varied tasks"
      - "reflection"
    rubric:
      excellent: "Describes intentional ways such as picking varied tasks and reflecting afterward, with examples."
      good: "Says they learn as they go."
      weak: "Sees work and learning as separate."
    followups:
      - "What task taught you most?"
      - "How do you reflect?"
    common_errors:
      - "Sees work and learning as separate."

  - external_key: recruiter_screening.career_goals.transferable_skills
    competency_key: adaptability
    topic: "Transferable skills"
    difficulty: medium
    text: "Which skills from your past experience do you think transfer best to this role?"
    expected_concepts:
      - "skill identification"
      - "evidence"
      - "relevance"
      - "candidy about gaps"
    rubric:
      excellent: "Names specific skills with evidence and shows how they apply while acknowledging gaps."
      good: "Names skills with some evidence."
      weak: "Lists generic skills."
    followups:
      - "Where might they not transfer?"
      - "Give an example of use."
    common_errors:
      - "Lists generic skills."

  - external_key: recruiter_screening.career_goals.passed_over_for_goal
    competency_key: motivation
    topic: "When a goal is declined"
    difficulty: hard
    text: "Tell me about a time you wanted an opportunity and did not get it. How did you respond?"
    expected_concepts:
      - "specific event"
      - "response"
      - "constructive follow-up"
      - "outcome"
    rubric:
      excellent: "Describes the event, seeks feedback, acts on it and shows a positive outcome."
      good: "Describes the event and a reasonable response."
      weak: "Shows resentment or no action."
    followups:
      - "What feedback did you get?"
      - "What would you do differently?"
    common_errors:
      - "Shows resentment or no action."

  - external_key: recruiter_screening.career_goals.motivation_for_growth
    competency_key: motivation
    topic: "Source of drive"
    difficulty: easy
    text: "What drives you to keep improving at what you do?"
    expected_concepts:
      - "authentic drivers"
      - "examples"
      - "consistency"
      - "link to work"
    rubric:
      excellent: "Describes specific drivers supported by habits and examples over time."
      good: "Gives general drivers."
      weak: "Gives slogans only."
    followups:
      - "Where do you see it in your week?"
      - "What happens when you lose it?"
    common_errors:
      - "Gives slogans only."

  - external_key: recruiter_screening.career_goals.building_a_network
    competency_key: collaboration
    topic: "Professional network"
    difficulty: easy
    text: "How do you build professional relationships that help your growth?"
    expected_concepts:
      - "methods"
      - "reciprocity"
      - "examples"
      - "outcomes"
    rubric:
      excellent: "Describes how they build relationships through helping others, with outcomes."
      good: "Mentions meetups or contacts."
      weak: "Does not network or sees it as transactional."
    followups:
      - "Who helped you most?"
      - "How do you stay in touch?"
    common_errors:
      - "Does not network or sees it as transactional."

  - external_key: recruiter_screening.career_goals.development_plans_usage
    competency_key: ownership
    topic: "Development plans"
    difficulty: medium
    text: "Have you used a formal development plan before? What worked and what did not?"
    expected_concepts:
      - "experience"
      - "evaluation"
      - "improvements"
      - "ownership"
    rubric:
      excellent: "Describes a plan used, what made it effective and how they would improve it."
      good: "Describes a plan with limited reflection."
      weak: "Has no experience or found it useless without reasoning."
    followups:
      - "How often did you review it?"
      - "What would you change?"
    common_errors:
      - "Has no experience or found it useless without reasoning."

  - external_key: recruiter_screening.career_goals.reflection_habit
    competency_key: ownership
    topic: "Reflecting on your work"
    difficulty: easy
    text: "Do you have a habit of looking back on your work to learn from it? What does it look like?"
    expected_concepts:
      - "specific practice"
      - "frequency"
      - "example insight"
      - "action"
    rubric:
      excellent: "Describes a regular practice and a recent insight that changed their behaviour."
      good: "Describes occasional reflection."
      weak: "Does not reflect."
    followups:
      - "What did you learn recently?"
      - "How do you capture it?"
    common_errors:
      - "Does not reflect."

  - external_key: recruiter_screening.career_goals.broaden_exposure
    competency_key: adaptability
    topic: "Broadening exposure"
    difficulty: medium
    text: "How have you sought exposure to parts of the business or technology you did not know?"
    expected_concepts:
      - "initiative"
      - "examples"
      - "benefit"
      - "limits"
    rubric:
      excellent: "Gives examples of actively seeking exposure and what the team gained from it."
      good: "Describes passive exposure."
      weak: "Stays within their assigned area."
    followups:
      - "What did you ask to join?"
      - "What was surprising?"
    common_errors:
      - "Stays within their assigned area."

  - external_key: recruiter_screening.career_goals.aspire_to_mentor_new_hires
    competency_key: collaboration
    topic: "Onboarding others"
    difficulty: easy
    text: "How would you help a new colleague get up to speed if you were already settled in the team?"
    expected_concepts:
      - "structured help"
      - "empathy"
      - "documentation"
      - "time boundaries"
    rubric:
      excellent: "Describes a structured approach of context, early tasks and check-ins and how they protect their own work."
      good: "Describes some helpful actions."
      weak: "Leaves new people to figure it out."
    followups:
      - "What helped you when you joined?"
      - "What would you document?"
    common_errors:
      - "Leaves new people to figure it out."

  - external_key: recruiter_screening.career_goals.interest_in_cross_functional
    competency_key: collaboration
    topic: "Working across functions"
    difficulty: medium
    text: "How interested are you in working closely with other functions such as product, design or customer teams?"
    expected_concepts:
      - "interest"
      - "examples"
      - "benefits"
      - "communication"
    rubric:
      excellent: "Gives examples of cross-functional work, what they learned and how they would do more."
      good: "Shows some interest."
      weak: "Prefers isolation without reasoning."
    followups:
      - "What did you learn from them?"
      - "What was hard?"
    common_errors:
      - "Prefers isolation without reasoning."

  - external_key: recruiter_screening.career_goals.career_values_job_related
    competency_key: culture_values
    topic: "Values at work"
    difficulty: medium
    text: "Which working values matter most to you in a role, and how have they shown up in your decisions?"
    expected_concepts:
      - "specific values"
      - "behavioural examples"
      - "consistency"
      - "fit"
    rubric:
      excellent: "Names values with concrete examples of acting on them in work decisions."
      good: "Names common values."
      weak: "Lists values with no behaviour behind them."
    followups:
      - "When were your values tested?"
      - "Which value drives your approach?"
    common_errors:
      - "Lists values with no behaviour behind them."

  - external_key: recruiter_screening.career_goals.leadership_by_example
    competency_key: leadership
    topic: "Informal leadership"
    difficulty: medium
    text: "Have you shown leadership without a formal title? Tell me about it."
    expected_concepts:
      - "example"
      - "initiative"
      - "influence"
      - "outcome"
    rubric:
      excellent: "Describes a clear example of influencing others without authority and the result."
      good: "Describes a small example."
      weak: "Cannot provide an example."
    followups:
      - "How did you get people on board?"
      - "What did you learn?"
    common_errors:
      - "Cannot provide an example."

  - external_key: recruiter_screening.career_goals.career_trade_offs
    competency_key: motivation
    topic: "Trade-offs in your career"
    difficulty: hard
    text: "Describe a trade-off you had to make between two things you wanted in your career. How did you decide?"
    expected_concepts:
      - "options"
      - "criteria"
      - "decision"
      - "outcome and reflection"
    rubric:
      excellent: "Lays out the options and criteria, owns the choice and reflects on whether they would repeat it."
      good: "Describes the trade-off and decision."
      weak: "Describes no real trade-off."
    followups:
      - "What did you give up?"
      - "Would you decide the same now?"
    common_errors:
      - "Describes no real trade-off."

  - external_key: recruiter_screening.career_goals.growth_curiosity_questions
    competency_key: communication
    topic: "Asking questions to learn"
    difficulty: easy
    text: "How do you use questions to learn quickly in a new environment?"
    expected_concepts:
      - "good questions"
      - "preparation"
      - "listening"
      - "applying answers"
    rubric:
      excellent: "Describes preparing focused questions, capturing answers and applying them."
      good: "Says they ask when stuck."
      weak: "Hesitates to ask."
    followups:
      - "What was a good question you asked?"
      - "Who do you ask first?"
    common_errors:
      - "Hesitates to ask."

  - external_key: recruiter_screening.career_goals.passion_for_craft
    competency_key: motivation
    topic: "Craft and quality"
    difficulty: easy
    text: "What do you take pride in about the quality of your work?"
    expected_concepts:
      - "specific quality standards"
      - "examples"
      - "habits"
      - "team effect"
    rubric:
      excellent: "Names specific standards and habits with an example where they raised quality."
      good: "Names general quality goals."
      weak: "Describes no particular standard."
    followups:
      - "Where did you learn that standard?"
      - "When did you compromise it?"
    common_errors:
      - "Describes no particular standard."

  - external_key: recruiter_screening.career_goals.transition_to_new_team
    competency_key: adaptability
    topic: "Moving to a new team"
    difficulty: medium
    text: "Tell me about moving to a new team or project. How did you make it work in the first few weeks?"
    expected_concepts:
      - "onboarding approach"
      - "relationship building"
      - "early contributions"
      - "learning"
    rubric:
      excellent: "Describes a deliberate plan for learning, relationships and early contributions."
      good: "Describes a basic ramp-up."
      weak: "Describes struggling with no adaptation."
    followups:
      - "What would you do differently?"
      - "How did you find who to ask?"
    common_errors:
      - "Describes struggling with no adaptation."

  - external_key: recruiter_screening.career_goals.future_self_in_role
    competency_key: motivation
    topic: "Your future in this role"
    difficulty: medium
    text: "Imagine you have been in this role for two years and you are thriving. What are you doing and what have you learned?"
    expected_concepts:
      - "vision"
      - "concrete outcomes"
      - "learning"
      - "realism"
    rubric:
      excellent: "Paints a concrete and realistic picture grounded in the role's real work and likely learning."
      good: "Paints a general picture."
      weak: "Gives a vague or unrelated picture."
    followups:
      - "What got you there?"
      - "What would you need from the team?"
    common_errors:
      - "Gives a vague or unrelated picture."

  - external_key: recruiter_screening.career_goals.meaningful_feedback_seek
    competency_key: communication
    topic: "Asking for feedback"
    difficulty: medium
    text: "How do you actively ask for feedback, and from whom?"
    expected_concepts:
      - "specific asks"
      - "variety of sources"
      - "acting on it"
      - "follow-up"
    rubric:
      excellent: "Describes asking specific questions of varied people, acting on the answers and reporting back."
      good: "Says they ask their manager."
      weak: "Waits for reviews."
    followups:
      - "What is a good question to ask?"
      - "What did you change?"
    common_errors:
      - "Waits for reviews."

  - external_key: recruiter_screening.career_goals.long_game_thinking
    competency_key: motivation
    topic: "Long-term thinking"
    difficulty: hard
    text: "How do you decide between work that helps you grow and work that simply gets results quickly?"
    expected_concepts:
      - "prioritisation"
      - "trade-off reasoning"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes a framework for the trade-off with an example and how they involved their manager."
      good: "Gives a general preference."
      weak: "Always chooses one without reasoning."
    followups:
      - "When did you choose growth?"
      - "When did delivery win?"
    common_errors:
      - "Always chooses one without reasoning."
