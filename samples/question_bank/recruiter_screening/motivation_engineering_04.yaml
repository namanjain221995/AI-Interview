version: 1
defaults:
  role_tags: [backend, frontend, fullstack, mobile, qa]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_engineering.be_what_know_us"
    competency_key: recruiter_fit
    topic: "Knowledge of the role"
    difficulty: easy
    text: "What do you understand about the backend work you would be doing here, and what questions do you have?"
    expected_concepts:
      - "has read posting"
      - "understanding of tasks"
      - "thoughtful questions"
    rubric:
      excellent: "Summarises the role accurately and asks relevant questions on the team and the work."
      good: "Gives relevant reasons and some concrete detail about knowledge of the role, but links to the role stay general."
      weak: "Vague or generic answer on knowledge of the role that could apply to any job."
    followups:
      - "What part would you like to hear more about?"
      - "How did you learn about it?"
    common_errors:
      - "Not having read the job description."

  - external_key: "recruiter_screening.motivation_engineering.fe_what_know_us"
    competency_key: recruiter_fit
    topic: "Understanding the frontend job"
    difficulty: easy
    text: "What have you understood about the frontend work on this team, and what would you like to learn more about?"
    expected_concepts:
      - "knowledge of product and tech"
      - "relevant questions"
      - "research done"
    rubric:
      excellent: "Shows prepared knowledge of the role and asks relevant questions."
      good: "Gives relevant reasons and some concrete detail about understanding the frontend job, but links to the role stay general."
      weak: "Vague or generic answer on understanding the frontend job that could apply to any job."
    followups:
      - "What did you look at before today?"
      - "What would help you decide?"
    common_errors:
      - "Asking questions that the posting already answers."

  - external_key: "recruiter_screening.motivation_engineering.fs_what_know_us"
    competency_key: recruiter_fit
    topic: "Understanding the fullstack job"
    difficulty: easy
    text: "From what you have seen, what would you spend most of your time on in this fullstack role?"
    expected_concepts:
      - "read the role"
      - "expectations"
      - "clarity"
      - "questions"
    rubric:
      excellent: "Gives an accurate picture of the work and compares it with their expectations."
      good: "Gives relevant reasons and some concrete detail about understanding the fullstack job, but links to the role stay general."
      weak: "Vague or generic answer on understanding the fullstack job that could apply to any job."
    followups:
      - "Does that match what you want to do?"
      - "What surprised you?"
    common_errors:
      - "Guessing without any preparation."

  - external_key: "recruiter_screening.motivation_engineering.mob_what_know_us"
    competency_key: recruiter_fit
    topic: "Understanding the mobile job"
    difficulty: easy
    text: "What do you know about the mobile work in this role, and does it match what you are looking for?"
    expected_concepts:
      - "read posting"
      - "platform and product knowledge"
      - "questions"
      - "fit"
    rubric:
      excellent: "Shows they looked at the product or app and ties it to their goals."
      good: "Gives relevant reasons and some concrete detail about understanding the mobile job, but links to the role stay general."
      weak: "Vague or generic answer on understanding the mobile job that could apply to any job."
    followups:
      - "Have you used our app?"
      - "What would you want to know about the roadmap?"
    common_errors:
      - "Not having tried the product."

  - external_key: "recruiter_screening.motivation_engineering.qa_what_know_us"
    competency_key: recruiter_fit
    topic: "Understanding the quality job"
    difficulty: easy
    text: "What have you learned about the quality work in this role, and what would you like to find out?"
    expected_concepts:
      - "understanding of scope"
      - "product knowledge"
      - "relevant questions on process and tooling"
    rubric:
      excellent: "Describes the role accurately and asks focused questions about process, tools and release practices."
      good: "Gives relevant reasons and some concrete detail about understanding the quality job, but links to the role stay general."
      weak: "Vague or generic answer on understanding the quality job that could apply to any job."
    followups:
      - "What testing approach do you expect here?"
      - "What would you ask the team?"
    common_errors:
      - "Asking only about benefits."

  - external_key: "recruiter_screening.motivation_engineering.be_one_thing_role"
    competency_key: motivation
    topic: "Most exciting responsibility"
    difficulty: easy
    text: "Which single responsibility in this backend role excites you the most?"
    expected_concepts:
      - "specific responsibility"
      - "reasons"
      - "evidence of relevant experience"
    rubric:
      excellent: "Picks one responsibility, explains why and shows relevant past work."
      good: "Gives relevant reasons and some concrete detail about most exciting responsibility, but links to the role stay general."
      weak: "Vague or generic answer on most exciting responsibility that could apply to any job."
    followups:
      - "Why that one rather than another?"
      - "What would you do first?"
    common_errors:
      - "Naming everything."

  - external_key: "recruiter_screening.motivation_engineering.fe_one_thing_role"
    competency_key: motivation
    topic: "Most exciting responsibility"
    difficulty: easy
    text: "Which part of this frontend role would you look forward to the most?"
    expected_concepts:
      - "specific part of the role"
      - "reasons"
      - "related experience"
    rubric:
      excellent: "Names a specific part and gives concrete reasons based on experience."
      good: "Gives relevant reasons and some concrete detail about most exciting responsibility, but links to the role stay general."
      weak: "Vague or generic answer on most exciting responsibility that could apply to any job."
    followups:
      - "What would success on it look like?"
      - "What worries you about it?"
    common_errors:
      - "Generic answers about \"working with a great team\"."

  - external_key: "recruiter_screening.motivation_engineering.mob_one_thing_role"
    competency_key: motivation
    topic: "Most exciting responsibility"
    difficulty: easy
    text: "What part of this mobile role would you be most excited to dig into?"
    expected_concepts:
      - "specific area"
      - "reasons"
      - "relevant background"
      - "expectations"
    rubric:
      excellent: "Names an area with reasons and related experience."
      good: "Gives relevant reasons and some concrete detail about most exciting responsibility, but links to the role stay general."
      weak: "Vague or generic answer on most exciting responsibility that could apply to any job."
    followups:
      - "What would you need to learn first?"
      - "Who would you want to work with?"
    common_errors:
      - "Saying everything sounds great."

  - external_key: "recruiter_screening.motivation_engineering.qa_one_thing_role"
    competency_key: motivation
    topic: "Most exciting responsibility"
    difficulty: easy
    text: "What part of this quality role are you most looking forward to?"
    expected_concepts:
      - "specific part"
      - "reasons"
      - "experience"
      - "expected contribution"
    rubric:
      excellent: "Picks a part with reasons and a first-month idea."
      good: "Gives relevant reasons and some concrete detail about most exciting responsibility, but links to the role stay general."
      weak: "Vague or generic answer on most exciting responsibility that could apply to any job."
    followups:
      - "What would you start with in the first month?"
      - "What would be a challenge?"
    common_errors:
      - "Not being specific."

  - external_key: "recruiter_screening.motivation_engineering.fs_support_prod"
    competency_key: recruiter_fit
    topic: "Handling support and on-call"
    difficulty: easy
    text: "This role may involve some support rotation. How have you handled support or on-call duties before, and how do you feel about it?"
    expected_concepts:
      - "experience"
      - "steady approach"
      - "learning"
      - "readiness"
      - "sustainable practices"
    rubric:
      excellent: "Shares real experience and describes practices that make the rotation sustainable, showing readiness."
      good: "Gives relevant reasons and some concrete detail about handling support and on-call, but links to the role stay general."
      weak: "Vague or generic answer on handling support and on-call that could apply to any job."
    followups:
      - "What helped you through a tough rotation?"
      - "How should a team share it fairly?"
    common_errors:
      - "Refusing without discussion."

  - external_key: "recruiter_screening.motivation_engineering.be_why_now"
    competency_key: motivation
    topic: "Timing of the move"
    difficulty: easy
    text: "Why is now the right time for you to move to a new backend role?"
    expected_concepts:
      - "clear career reason"
      - "readiness"
      - "link to role"
      - "positive framing"
    rubric:
      excellent: "Gives a clear, forward-looking reason tied to the role."
      good: "Gives relevant reasons and some concrete detail about timing of the move, but links to the role stay general."
      weak: "Vague or generic answer on timing of the move that could apply to any job."
    followups:
      - "What did you want to achieve before leaving?"
      - "What are you hoping for?"
    common_errors:
      - "Only listing negatives."

  - external_key: "recruiter_screening.motivation_engineering.fe_ideal_week"
    competency_key: motivation
    topic: "Ideal week"
    difficulty: easy
    text: "Describe an ideal week for you as a frontend engineer, from a mix of building, reviewing, pairing and meetings."
    expected_concepts:
      - "balanced view"
      - "collaboration time"
      - "focus time"
      - "realism"
      - "link to the role"
    rubric:
      excellent: "Describes a realistic mix, including collaboration and focus time, that fits the role."
      good: "Gives relevant reasons and some concrete detail about ideal week, but links to the role stay general."
      weak: "Vague or generic answer on ideal week that could apply to any job."
    followups:
      - "What do you do to protect focus time?"
      - "How much collaboration do you want?"
    common_errors:
      - "Imagining no meetings or reviews."

  - external_key: "recruiter_screening.motivation_engineering.mob_team_support"
    competency_key: motivation
    topic: "Support from a team"
    difficulty: medium
    text: "What kind of support do you need from a team and manager to grow in mobile, and what do you give back?"
    expected_concepts:
      - "support needs"
      - "giving back"
      - "examples"
      - "communication"
    rubric:
      excellent: "Gives specific needs and what they contribute, with examples."
      good: "Gives relevant reasons and some concrete detail about support from a team, but links to the role stay general."
      weak: "Vague or generic answer on support from a team that could apply to any job."
    followups:
      - "What worked best for you in the past?"
      - "How do you ask for help?"
    common_errors:
      - "Only describing what they need."

  - external_key: "recruiter_screening.motivation_engineering.qa_role_expectation"
    competency_key: motivation
    topic: "Expectation in the first months"
    difficulty: medium
    text: "What would you want to have achieved in your first three months as a quality engineer here?"
    expected_concepts:
      - "realistic goals"
      - "learning plan"
      - "early wins"
      - "stakeholder meetings"
    rubric:
      excellent: "Gives a realistic plan with learning, relationship building and one early contribution."
      good: "Gives relevant reasons and some concrete detail about expectation in the first months, but links to the role stay general."
      weak: "Vague or generic answer on expectation in the first months that could apply to any job."
    followups:
      - "How would you go about learning the product?"
      - "What would be a quick win?"
    common_errors:
      - "Promising big changes before understanding the system."

  - external_key: "recruiter_screening.motivation_engineering.be_growth_obstacle"
    competency_key: motivation
    topic: "What slows their growth"
    difficulty: medium
    text: "What has held back your growth as a backend engineer in your current job, and what are you hoping to change?"
    expected_concepts:
      - "reflective"
      - "specific constraint"
      - "constructive"
      - "plan"
    rubric:
      excellent: "Names a specific constraint without blame, shows actions already taken and links to this role."
      good: "Gives relevant reasons and some concrete detail about what slows their growth, but links to the role stay general."
      weak: "Vague or generic answer on what slows their growth that could apply to any job."
    followups:
      - "What have you done within your current role to address it?"
      - "How would you know the new role has it?"
    common_errors:
      - "Blaming the employer."

  - external_key: "recruiter_screening.motivation_engineering.fe_learning_path"
    competency_key: motivation
    topic: "Learning path"
    difficulty: medium
    text: "Which skills do you think a frontend engineer needs over the next three years, and what are you doing about them?"
    expected_concepts:
      - "view of field"
      - "skill priorities"
      - "learning actions"
      - "link to role"
    rubric:
      excellent: "Offers a reasoned view with learning actions."
      good: "Gives relevant reasons and some concrete detail about learning path, but links to the role stay general."
      weak: "Vague or generic answer on learning path that could apply to any job."
    followups:
      - "Which one is hardest for you?"
      - "Which have you started?"
    common_errors:
      - "Listing trends without actions."

  - external_key: "recruiter_screening.motivation_engineering.fs_value_diff"
    competency_key: motivation
    topic: "What they bring"
    difficulty: medium
    text: "If you joined this team, what would you bring beyond the technical skills in your resume?"
    expected_concepts:
      - "strengths"
      - "teamwork qualities"
      - "examples"
      - "link to role"
    rubric:
      excellent: "Gives specific strengths with examples that a teammate could confirm."
      good: "Gives relevant reasons and some concrete detail about what they bring, but links to the role stay general."
      weak: "Vague or generic answer on what they bring that could apply to any job."
    followups:
      - "Can you give an example of each?"
      - "What would a teammate say?"
    common_errors:
      - "Making claims with no evidence."

  - external_key: "recruiter_screening.motivation_engineering.mob_company_stage"
    competency_key: recruiter_fit
    topic: "Preferred company context"
    difficulty: medium
    text: "What size and stage of company do you think suits you best for mobile work, and what have you learned from the places you have worked?"
    expected_concepts:
      - "clear preference"
      - "experience"
      - "trade-offs"
      - "fit with role"
    rubric:
      excellent: "Shares a reasoned preference based on experience and shows they are adaptable."
      good: "Gives relevant reasons and some concrete detail about preferred company context, but links to the role stay general."
      weak: "Vague or generic answer on preferred company context that could apply to any job."
    followups:
      - "What did you miss about a previous environment?"
      - "How adaptable are you?"
    common_errors:
      - "Only criticising past environments."

  - external_key: "recruiter_screening.motivation_engineering.qa_final_motivation"
    competency_key: motivation
    topic: "Closing motivation check"
    difficulty: medium
    text: "If this role goes ahead, what will be the main reason you accept, and what would worry you?"
    expected_concepts:
      - "clear decision factors"
      - "transparency"
      - "role-related concerns"
      - "open communication"
    rubric:
      excellent: "States main reasons and concerns clearly and is open to discussing them."
      good: "Gives relevant reasons and some concrete detail about closing motivation check, but links to the role stay general."
      weak: "Vague or generic answer on closing motivation check that could apply to any job."
    followups:
      - "What would address that worry?"
      - "Have you any other conversations in progress?"
    common_errors:
      - "Hiding concerns."

  - external_key: "recruiter_screening.motivation_engineering.be_commitment"
    competency_key: motivation
    topic: "Staying power"
    difficulty: hard
    text: "Tell me about a time you stayed with a long, difficult backend project when it would have been easier to move on. What kept you going?"
    expected_concepts:
      - "commitment"
      - "reasons"
      - "support"
      - "outcome"
      - "reflection"
    rubric:
      excellent: "Describes a specific long project, the reasons they stayed and how it ended, and has a thoughtful view of when to move on."
      good: "Gives relevant reasons and some concrete detail about staying power, but links to the role stay general."
      weak: "Vague or generic answer on staying power that could apply to any job."
    followups:
      - "What would you have changed?"
      - "How do you decide when to stay and when to leave?"
    common_errors:
      - "Treating persistence as always right."

  - external_key: "recruiter_screening.motivation_engineering.fe_values_conflict"
    competency_key: culture_values
    topic: "Values under pressure"
    difficulty: hard
    text: "Tell me about a time a team's way of working conflicted with something you cared about in frontend quality, like accessibility or testing. What did you do?"
    expected_concepts:
      - "specific values"
      - "approach"
      - "diplomacy"
      - "result"
      - "learning"
    rubric:
      excellent: "Describes the conflict, a respectful approach that used evidence and the result."
      good: "Gives relevant reasons and some concrete detail about values under pressure, but links to the role stay general."
      weak: "Vague or generic answer on values under pressure that could apply to any job."
    followups:
      - "What did you give up?"
      - "What would you do next time?"
    common_errors:
      - "Insisting without compromise."

  - external_key: "recruiter_screening.motivation_engineering.fs_next_five"
    competency_key: motivation
    topic: "Long-term view"
    difficulty: hard
    text: "Where would you like your fullstack career to be in five years, and what does this role offer on that path?"
    expected_concepts:
      - "realistic view"
      - "options"
      - "link to role"
      - "actions"
      - "flexibility"
    rubric:
      excellent: "Gives a thoughtful direction with flexibility and connects specific parts of the role to it."
      good: "Gives relevant reasons and some concrete detail about long-term view, but links to the role stay general."
      weak: "Vague or generic answer on long-term view that could apply to any job."
    followups:
      - "What would make you change this plan?"
      - "What would you do in year one?"
    common_errors:
      - "Vague ambition with no connection."

  - external_key: "recruiter_screening.motivation_engineering.be_collab_qa"
    competency_key: motivation
    topic: "Working with QA and product"
    difficulty: easy
    text: "How do you like to work with product managers and quality engineers when you build a backend feature?"
    expected_concepts:
      - "collaboration habits"
      - "early involvement"
      - "testability"
      - "feedback"
      - "example"
    rubric:
      excellent: "Describes concrete habits such as early design discussion and testable APIs, with an example."
      good: "Gives relevant reasons and some concrete detail about working with qa and product, but links to the role stay general."
      weak: "Vague or generic answer on working with qa and product that could apply to any job."
    followups:
      - "What do you do to make your work easy to test?"
      - "How do you respond to a bug report?"
    common_errors:
      - "Treating testers as a final check only."

  - external_key: "recruiter_screening.motivation_engineering.fe_questions_us"
    competency_key: recruiter_fit
    topic: "Questions for the team"
    difficulty: medium
    text: "What are the first three things you would want to ask the frontend team to decide whether this is the right place for you?"
    expected_concepts:
      - "thoughtful job-related questions"
      - "priorities"
      - "research"
      - "insight into what they value"
    rubric:
      excellent: "Asks well-chosen questions about practices, ownership and roadmap that show what they value."
      good: "Gives relevant reasons and some concrete detail about questions for the team, but links to the role stay general."
      weak: "Vague or generic answer on questions for the team that could apply to any job."
    followups:
      - "Why those questions?"
      - "Which answer would worry you most?"
    common_errors:
      - "Only questions about perks."

  - external_key: "recruiter_screening.motivation_engineering.mob_future_vision"
    competency_key: motivation
    topic: "Contribution to the product"
    difficulty: medium
    text: "Imagine you have been on the mobile team for a year and it has gone well. What have you contributed?"
    expected_concepts:
      - "specific contributions"
      - "realistic scope"
      - "team and product impact"
      - "link to role"
    rubric:
      excellent: "Describes realistic, specific contributions to the product and team and ties them to the role."
      good: "Gives relevant reasons and some concrete detail about contribution to the product, but links to the role stay general."
      weak: "Vague or generic answer on contribution to the product that could apply to any job."
    followups:
      - "What would have made it harder?"
      - "What support would you need?"
    common_errors:
      - "Describing outcomes unrelated to the product."
