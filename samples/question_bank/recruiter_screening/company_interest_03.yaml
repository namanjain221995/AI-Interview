# Curated questions: recruiter screening, company interest (03 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.company_interest.compare_to_other_companies
    competency_key: motivation
    topic: "How we compare"
    difficulty: easy
    text: "How does our company compare with others you are considering or have worked at, in terms of the work itself?"
    expected_concepts:
      - "job-related comparison"
      - "fairness"
      - "reasoning"
      - "clarity"
    rubric:
      excellent: "Compares the work itself concretely and fairly and explains what tips the balance."
      good: "Compares in general terms."
      weak: "Disparages others or has no comparison."
    followups:
      - "What matters most?"
      - "What is still unknown?"
    common_errors:
      - "Disparages others or has no comparison."

  - external_key: recruiter_screening.company_interest.mission_in_daily_work
    competency_key: ownership
    topic: "Mission day to day"
    difficulty: medium
    text: "How do you connect your day-to-day work to the larger purpose of a company?"
    expected_concepts:
      - "line of sight"
      - "examples"
      - "motivation"
      - "communication"
    rubric:
      excellent: "Describes linking tasks to company goals with a concrete example."
      good: "Says purpose matters."
      weak: "Sees no link."
    followups:
      - "Show me an example."
      - "How do you stay connected?"
    common_errors:
      - "Sees no link."

  - external_key: recruiter_screening.company_interest.product_feature_critique
    competency_key: problem_solving
    topic: "A feature you noticed"
    difficulty: easy
    text: "Is there a feature of our product or service that you particularly liked or found confusing? Why?"
    expected_concepts:
      - "specific feature"
      - "reasoning"
      - "constructive"
      - "user view"
    rubric:
      excellent: "Gives a specific example, explains why from a user view and suggests improvements."
      good: "Gives a specific example with limited reasoning."
      weak: "Gives vague opinions."
    followups:
      - "What would you change?"
      - "How would you test it?"
    common_errors:
      - "Gives vague opinions."

  - external_key: recruiter_screening.company_interest.role_questions_for_manager
    competency_key: communication
    topic: "Questions for the hiring manager"
    difficulty: easy
    text: "What would you ask the hiring manager to understand the role and the team better?"
    expected_concepts:
      - "relevant questions"
      - "priorities"
      - "preparation"
      - "interest"
    rubric:
      excellent: "Asks pointed questions about goals, challenges and success measures."
      good: "Asks reasonable questions."
      weak: "Asks nothing."
    followups:
      - "Why those?"
      - "Which is most important?"
    common_errors:
      - "Asks nothing."

  - external_key: recruiter_screening.company_interest.growth_of_the_company
    competency_key: adaptability
    topic: "A growing organisation"
    difficulty: easy
    text: "How do you handle change when a company grows or reorganises?"
    expected_concepts:
      - "adaptability"
      - "communication"
      - "examples"
      - "focus"
    rubric:
      excellent: "Describes concrete experiences of change, how they stayed effective and supported others."
      good: "Says they adapt."
      weak: "Dislikes change."
    followups:
      - "What helped?"
      - "What was hard?"
    common_errors:
      - "Dislikes change."

  - external_key: recruiter_screening.company_interest.customers_ownership
    competency_key: ownership
    topic: "Customer impact"
    difficulty: medium
    text: "How do you think about the people who ultimately use what you build or support?"
    expected_concepts:
      - "customer focus"
      - "examples"
      - "feedback"
      - "decisions"
    rubric:
      excellent: "Gives examples of using customer insight in decisions."
      good: "Says customers matter."
      weak: "Has not considered customers."
    followups:
      - "How do you learn about them?"
      - "Can you give an example?"
    common_errors:
      - "Has not considered customers."

  - external_key: recruiter_screening.company_interest.sector_regulation_awareness
    competency_key: problem_solving
    topic: "Rules in our industry"
    difficulty: hard
    text: "What rules, standards or expectations do you think apply to companies in our industry, and how might they affect this role?"
    expected_concepts:
      - "awareness"
      - "reasoning"
      - "implication"
      - "openness to learning"
    rubric:
      excellent: "Names relevant standards, explains how they affect the work and acknowledges what they would learn."
      good: "Names some rules generally."
      weak: "Has no awareness."
    followups:
      - "How would you learn more?"
      - "How have you worked within rules before?"
    common_errors:
      - "Has no awareness."

  - external_key: recruiter_screening.company_interest.interest_in_company_culture_rituals
    competency_key: culture_values
    topic: "Team rituals"
    difficulty: easy
    text: "What team practices, such as planning sessions or demos, have you found valuable, and what do you hope to see here?"
    expected_concepts:
      - "specific practices"
      - "reasons"
      - "examples"
      - "openness"
    rubric:
      excellent: "Names specific practices with reasons and examples and stays open to local ways."
      good: "Names common practices."
      weak: "Names none."
    followups:
      - "What would you try?"
      - "What would you not need?"
    common_errors:
      - "Names none."

  - external_key: recruiter_screening.company_interest.reading_company_documents
    competency_key: communication
    topic: "Documents you read"
    difficulty: easy
    text: "Did you read any of our job description, careers page or product documents in depth? What did you learn?"
    expected_concepts:
      - "depth of reading"
      - "insight"
      - "specific details"
      - "questions"
    rubric:
      excellent: "Shares specific details and what they inferred about expectations."
      good: "Skimmed and shares one fact."
      weak: "Did not read them."
    followups:
      - "What was unclear?"
      - "What was most helpful?"
    common_errors:
      - "Did not read them."

  - external_key: recruiter_screening.company_interest.market_opportunity
    competency_key: problem_solving
    topic: "Opportunity in the market"
    difficulty: medium
    text: "Where do you see the biggest opportunity for companies like ours in the next couple of years?"
    expected_concepts:
      - "informed view"
      - "reasoning"
      - "trade-offs"
      - "link to role"
    rubric:
      excellent: "Offers a reasoned view on opportunities and links them to work in this role."
      good: "Offers a general view."
      weak: "Offers buzzwords."
    followups:
      - "What risks?"
      - "What would you test first?"
    common_errors:
      - "Offers buzzwords."

  - external_key: recruiter_screening.company_interest.company_communication_style
    competency_key: communication
    topic: "How we communicate"
    difficulty: medium
    text: "From what you have seen, how does our company communicate publicly, and what does that suggest about how it works?"
    expected_concepts:
      - "observation"
      - "inference"
      - "caution"
      - "relevance"
    rubric:
      excellent: "Describes specific observations and draws tentative inferences, noting they would check them."
      good: "Describes what they saw."
      weak: "Makes sweeping claims."
    followups:
      - "What would you check?"
      - "What did you like?"
    common_errors:
      - "Makes sweeping claims."

  - external_key: recruiter_screening.company_interest.onboarding_interest
    competency_key: collaboration
    topic: "Joining us"
    difficulty: easy
    text: "What would make you feel well supported when joining a new company?"
    expected_concepts:
      - "job-related support"
      - "proactive"
      - "reciprocity"
      - "specifics"
    rubric:
      excellent: "Describes concrete support such as a buddy and early goals, and what they will do themselves."
      good: "Describes general support."
      weak: "Expects everything to be provided."
    followups:
      - "What did the best onboarding contain?"
      - "How do you ask for it?"
    common_errors:
      - "Expects everything to be provided."

  - external_key: recruiter_screening.company_interest.challenge_you_want_here
    competency_key: motivation
    topic: "Challenge you want"
    difficulty: medium
    text: "What kind of challenge would you want to take on here that you could not take on in your last role?"
    expected_concepts:
      - "specific challenge"
      - "ambition"
      - "fit"
      - "realism"
    rubric:
      excellent: "Names a specific challenge tied to the company's work with a realistic route to it."
      good: "Names a general challenge."
      weak: "Names nothing specific."
    followups:
      - "What would you need?"
      - "What would you contribute?"
    common_errors:
      - "Names nothing specific."

  - external_key: recruiter_screening.company_interest.customer_service_values
    competency_key: culture_values
    topic: "Serving customers"
    difficulty: easy
    text: "What does great service to customers or users look like in your area?"
    expected_concepts:
      - "concrete standards"
      - "examples"
      - "empathy"
      - "responsibility"
    rubric:
      excellent: "Describes concrete standards and an example where they exceeded expectations."
      good: "Describes courteous service."
      weak: "Describes no standard."
    followups:
      - "What did the customer say?"
      - "How do you measure it?"
    common_errors:
      - "Describes no standard."

  - external_key: recruiter_screening.company_interest.trust_in_leadership_direction
    competency_key: culture_values
    topic: "When direction changes"
    difficulty: hard
    text: "If company direction changed in a way you did not expect, how would you respond?"
    expected_concepts:
      - "seeking understanding"
      - "constructive engagement"
      - "adaptation"
      - "limits"
    rubric:
      excellent: "Describes understanding the reasons, raising concerns constructively and adapting."
      good: "Says they would adapt."
      weak: "Would disengage."
    followups:
      - "Has that happened?"
      - "What do you need to hear?"
    common_errors:
      - "Would disengage."

  - external_key: recruiter_screening.company_interest.interview_process_view
    competency_key: communication
    topic: "Our process so far"
    difficulty: easy
    text: "How has your experience of our hiring process shaped your view of the company?"
    expected_concepts:
      - "observations"
      - "fairness"
      - "constructive feedback"
      - "clarity"
    rubric:
      excellent: "Shares specific, fair observations and what they would like to know more about."
      good: "Gives general comments."
      weak: "Gives only flattery or complaints."
    followups:
      - "What worked well?"
      - "What would you improve?"
    common_errors:
      - "Gives only flattery or complaints."

  - external_key: recruiter_screening.company_interest.tailored_pitch
    competency_key: communication
    topic: "Connecting your story"
    difficulty: medium
    text: "Tell me how your background connects to our company's work, not just to the role."
    expected_concepts:
      - "link to company"
      - "specific experience"
      - "research"
      - "clarity"
    rubric:
      excellent: "Connects specific experience to the company's products and customers."
      good: "Connects to the role only."
      weak: "Cannot connect."
    followups:
      - "What stands out?"
      - "What would you want to learn?"
    common_errors:
      - "Cannot connect."

  - external_key: recruiter_screening.company_interest.what_you_would_protect
    competency_key: culture_values
    topic: "Standards to protect"
    difficulty: hard
    text: "What from our company's way of working would you want to protect and what would you want to question?"
    expected_concepts:
      - "observation"
      - "balance"
      - "reasoning"
      - "respect"
    rubric:
      excellent: "Names specific practices to keep and others to question constructively with reasoning."
      good: "Names things to keep."
      weak: "Wants to change everything or nothing."
    followups:
      - "How would you raise questions?"
      - "What evidence would you need?"
    common_errors:
      - "Wants to change everything or nothing."

  - external_key: recruiter_screening.company_interest.customer_empathy_story
    competency_key: ownership
    topic: "Understanding a user"
    difficulty: medium
    text: "Tell me about a time you understood a user or customer need better by talking with them or observing them."
    expected_concepts:
      - "story"
      - "method"
      - "insight"
      - "action"
    rubric:
      excellent: "Describes a real interaction, the insight gained and the action taken."
      good: "Describes a short exchange."
      weak: "Has no example."
    followups:
      - "What surprised you?"
      - "What did you change?"
    common_errors:
      - "Has no example."

  - external_key: recruiter_screening.company_interest.company_role_model
    competency_key: motivation
    topic: "Companies you admire"
    difficulty: easy
    text: "Which companies do you admire for how they work, and what would you borrow for us?"
    expected_concepts:
      - "admiration reasons"
      - "practices"
      - "relevance"
      - "openness to learning"
    rubric:
      excellent: "Names admired companies with specific practices and how those might fit here."
      good: "Names companies with limited detail."
      weak: "Names none."
    followups:
      - "What would not transfer?"
      - "How would you propose it?"
    common_errors:
      - "Names none."

  - external_key: recruiter_screening.company_interest.product_quality_view
    competency_key: ownership
    topic: "Quality of the product"
    difficulty: medium
    text: "What does quality mean to you in a product like ours?"
    expected_concepts:
      - "definition"
      - "examples"
      - "trade-offs"
      - "ownership"
    rubric:
      excellent: "Defines quality in user terms with examples and trade-offs."
      good: "Gives a generic definition."
      weak: "Does not define it."
    followups:
      - "Whose job is quality?"
      - "How do you check it?"
    common_errors:
      - "Does not define it."

  - external_key: recruiter_screening.company_interest.career_story_with_company
    competency_key: motivation
    topic: "Your story and ours"
    difficulty: medium
    text: "If your career and our company grew together over the next few years, what would that story look like?"
    expected_concepts:
      - "vision"
      - "realism"
      - "mutual benefit"
      - "link to role"
    rubric:
      excellent: "Describes a realistic shared journey with specific contributions and learning."
      good: "Describes growth in general."
      weak: "Describes only personal gain."
    followups:
      - "What would you need?"
      - "What would you contribute first?"
    common_errors:
      - "Describes only personal gain."

  - external_key: recruiter_screening.company_interest.company_news_reaction
    competency_key: problem_solving
    topic: "A tough headline"
    difficulty: hard
    text: "If our company were in the news for a difficult reason, how would you approach talking with colleagues or customers about it?"
    expected_concepts:
      - "fact-finding"
      - "consistent message"
      - "empathy"
      - "escalation"
    rubric:
      excellent: "Describes checking facts, using agreed messages, listening to concerns and escalating questions."
      good: "Describes staying out of it."
      weak: "Speculates or argues publicly."
    followups:
      - "Who would you ask for guidance?"
      - "What would you avoid?"
    common_errors:
      - "Speculates or argues publicly."

  - external_key: recruiter_screening.company_interest.cross_team_curiosity
    competency_key: collaboration
    topic: "Other teams"
    difficulty: easy
    text: "Which other teams in the company would you be curious to work with, and why?"
    expected_concepts:
      - "specific teams"
      - "reasons"
      - "collaboration view"
      - "research"
    rubric:
      excellent: "Names specific teams with reasons tied to the role."
      good: "Names teams generally."
      weak: "Names none."
    followups:
      - "What would you ask them?"
      - "What could you offer them?"
    common_errors:
      - "Names none."

  - external_key: recruiter_screening.company_interest.decision_factor_remaining
    competency_key: recruiter_fit
    topic: "What would decide it"
    difficulty: medium
    text: "What is the one thing that would most help you decide whether to join us, if offered?"
    expected_concepts:
      - "clear priority"
      - "job-related"
      - "openness"
      - "candidy"
    rubric:
      excellent: "Names a job-related factor clearly and says how they would evaluate it."
      good: "Names a factor."
      weak: "Names none."
    followups:
      - "How could we help?"
      - "What would be a deal-breaker for the work itself?"
    common_errors:
      - "Names none."
