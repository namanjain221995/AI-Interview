version: 1
defaults:
  role_tags: [devops, sre, platform, cloud, security, network, dba]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_infrastructure.devops_pipeline_pride"
    competency_key: motivation
    topic: "Proud pipeline"
    difficulty: easy
    text: "Tell me about a CI/CD pipeline or delivery improvement you built that you were proud of."
    expected_concepts:
      - "problem"
      - "design choices"
      - "their role"
      - "results such as lead time"
    rubric:
      excellent: "Describes the problem, their design and a measured improvement."
      good: "Gives relevant reasons and some concrete detail about proud pipeline, but links to the role stay general."
      weak: "Vague or generic answer on proud pipeline that could apply to any job."
    followups:
      - "What did you do about flaky builds?"
      - "How did teams respond?"
    common_errors:
      - "Listing tools instead of impact."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_proud"
    competency_key: motivation
    topic: "Proud reliability work"
    difficulty: easy
    text: "What reliability improvement are you proudest of, and what made it matter?"
    expected_concepts:
      - "situation"
      - "actions"
      - "metrics such as availability or incidents"
      - "their role"
    rubric:
      excellent: "Names a specific improvement with measurements and their own role."
      good: "Gives relevant reasons and some concrete detail about proud reliability work, but links to the role stay general."
      weak: "Vague or generic answer on proud reliability work that could apply to any job."
    followups:
      - "How did you know it worked?"
      - "Who else benefitted?"
    common_errors:
      - "Stating improvements without numbers."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_proud"
    competency_key: motivation
    topic: "Proud platform work"
    difficulty: easy
    text: "Tell me about a platform capability you helped build that engineers loved."
    expected_concepts:
      - "user need"
      - "solution"
      - "their contribution"
      - "adoption"
      - "feedback"
    rubric:
      excellent: "Describes a capability with user evidence, adoption and their part in it."
      good: "Gives relevant reasons and some concrete detail about proud platform work, but links to the role stay general."
      weak: "Vague or generic answer on proud platform work that could apply to any job."
    followups:
      - "How did you gather feedback?"
      - "What would you do differently?"
    common_errors:
      - "Describing technology without users."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_proud"
    competency_key: motivation
    topic: "Proud cloud design"
    difficulty: easy
    text: "What cloud migration or design are you most proud of, and why?"
    expected_concepts:
      - "scope"
      - "decisions"
      - "their role"
      - "outcome"
      - "learning"
    rubric:
      excellent: "Provides specifics of scope and decisions, their role and the outcome."
      good: "Gives relevant reasons and some concrete detail about proud cloud design, but links to the role stay general."
      weak: "Vague or generic answer on proud cloud design that could apply to any job."
    followups:
      - "What went wrong during it?"
      - "What did you learn?"
    common_errors:
      - "Taking credit for a team effort."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_proud"
    competency_key: motivation
    topic: "Proud security work"
    difficulty: easy
    text: "Tell me about a security improvement you drove that made a real difference."
    expected_concepts:
      - "risk addressed"
      - "actions"
      - "collaboration"
      - "outcome"
    rubric:
      excellent: "Describes a risk-driven improvement with clear outcomes and collaboration."
      good: "Gives relevant reasons and some concrete detail about proud security work, but links to the role stay general."
      weak: "Vague or generic answer on proud security work that could apply to any job."
    followups:
      - "How did you get buy-in?"
      - "How did you measure risk reduction?"
    common_errors:
      - "Describing tool deployment without risk reduction."

  - external_key: "recruiter_screening.motivation_infrastructure.net_pride_outage"
    competency_key: motivation
    topic: "Network problem solving"
    difficulty: easy
    text: "Tell me about a network issue you tracked down that others could not. What kept you going?"
    expected_concepts:
      - "method"
      - "tools"
      - "persistence"
      - "result"
      - "communication during the incident"
    rubric:
      excellent: "Shows a structured approach, the persistence required, and a result they communicated well."
      good: "Gives relevant reasons and some concrete detail about network problem solving, but links to the role stay general."
      weak: "Vague or generic answer on network problem solving that could apply to any job."
    followups:
      - "What did you check first?"
      - "What did you document?"
    common_errors:
      - "Guessing rather than testing hypotheses."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_pride_recovery"
    competency_key: motivation
    topic: "Handling data risk"
    difficulty: easy
    text: "Tell me about a time you protected or recovered important data. What did you do and what did you learn?"
    expected_concepts:
      - "situation"
      - "actions"
      - "verification"
      - "communication"
      - "lessons"
    rubric:
      excellent: "Describes specific actions, verification of the outcome and lessons applied afterwards."
      good: "Gives relevant reasons and some concrete detail about handling data risk, but links to the role stay general."
      weak: "Vague or generic answer on handling data risk that could apply to any job."
    followups:
      - "How often did you test recoveries?"
      - "What would you improve?"
    common_errors:
      - "Assuming backups work without testing."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_job_scope"
    competency_key: recruiter_fit
    topic: "Role scope"
    difficulty: easy
    text: "Which parts of this DevOps role's scope are the most interesting to you?"
    expected_concepts:
      - "read posting"
      - "specific areas"
      - "experience"
      - "questions"
    rubric:
      excellent: "Cites specific responsibilities from the posting with matching experience."
      good: "Gives relevant reasons and some concrete detail about role scope, but links to the role stay general."
      weak: "Vague or generic answer on role scope that could apply to any job."
    followups:
      - "Which part would you need to learn?"
      - "What would you do first?"
    common_errors:
      - "Not having read the posting."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_job_scope"
    competency_key: recruiter_fit
    topic: "Role scope"
    difficulty: easy
    text: "What in the scope of this reliability role matches what you are looking for?"
    expected_concepts:
      - "read posting"
      - "specific areas"
      - "fit"
      - "questions"
    rubric:
      excellent: "Cites specific responsibilities and compares them to their goals and experience."
      good: "Gives relevant reasons and some concrete detail about role scope, but links to the role stay general."
      weak: "Vague or generic answer on role scope that could apply to any job."
    followups:
      - "What worries you about the scope?"
      - "What do you expect in the first month?"
    common_errors:
      - "General statements about \"reliability\"."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_job_scope"
    competency_key: recruiter_fit
    topic: "Role scope"
    difficulty: easy
    text: "Looking at this platform role, which parts of the scope excite you most?"
    expected_concepts:
      - "read posting"
      - "areas such as developer experience or tooling"
      - "experience"
    rubric:
      excellent: "Identifies specific parts, relevant experience and questions about users and roadmap."
      good: "Gives relevant reasons and some concrete detail about role scope, but links to the role stay general."
      weak: "Vague or generic answer on role scope that could apply to any job."
    followups:
      - "What would you want to know about the users?"
      - "What would you start with?"
    common_errors:
      - "Ignoring the users of the platform."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_job_scope"
    competency_key: recruiter_fit
    topic: "Role scope"
    difficulty: easy
    text: "Which parts of this cloud role's responsibilities do you feel best prepared for, and which will stretch you?"
    expected_concepts:
      - "self-assessment"
      - "read posting"
      - "learning plan"
      - "evidence"
    rubric:
      excellent: "Gives a balanced self-assessment with evidence and a learning plan."
      good: "Gives relevant reasons and some concrete detail about role scope, but links to the role stay general."
      weak: "Vague or generic answer on role scope that could apply to any job."
    followups:
      - "How would you close the gap?"
      - "Who would you learn from?"
    common_errors:
      - "Claiming to be ready for everything."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_job_scope"
    competency_key: recruiter_fit
    topic: "Role scope"
    difficulty: easy
    text: "What part of this security role do you expect to spend most of your time on, and does that match what you want?"
    expected_concepts:
      - "read posting"
      - "areas"
      - "fit"
      - "realistic expectations"
    rubric:
      excellent: "Describes the expected scope accurately and compares it with their goals."
      good: "Gives relevant reasons and some concrete detail about role scope, but links to the role stay general."
      weak: "Vague or generic answer on role scope that could apply to any job."
    followups:
      - "What would you ask the team about priorities?"
      - "What would you want to build?"
    common_errors:
      - "Expecting only offensive work."

  - external_key: "recruiter_screening.motivation_infrastructure.net_job_scope"
    competency_key: recruiter_fit
    topic: "Role scope"
    difficulty: easy
    text: "What do you understand about the network responsibilities in this role, and what would you like to know more about?"
    expected_concepts:
      - "read posting"
      - "environment guesses"
      - "questions about scale and tools"
    rubric:
      excellent: "Summarises the role accurately and asks informed questions about the environment."
      good: "Gives relevant reasons and some concrete detail about role scope, but links to the role stay general."
      weak: "Vague or generic answer on role scope that could apply to any job."
    followups:
      - "What environment do you prefer?"
      - "What would you change first?"
    common_errors:
      - "Asking nothing about the environment."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_job_scope"
    competency_key: recruiter_fit
    topic: "Role scope"
    difficulty: easy
    text: "From what you read, what will your database responsibilities be here, and which ones are you most excited about?"
    expected_concepts:
      - "read posting"
      - "specific engines"
      - "responsibilities"
      - "matching experience"
    rubric:
      excellent: "Names the engines and responsibilities in the posting and their relevant experience."
      good: "Gives relevant reasons and some concrete detail about role scope, but links to the role stay general."
      weak: "Vague or generic answer on role scope that could apply to any job."
    followups:
      - "Which engine do you know best?"
      - "What would you want to improve?"
    common_errors:
      - "Not knowing which databases the role uses."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_toolchain"
    competency_key: recruiter_fit
    topic: "Toolchain flexibility"
    difficulty: medium
    text: "Our tooling may differ from what you use today. How do you approach learning and adopting a new toolchain?"
    expected_concepts:
      - "systematic learning"
      - "fundamentals"
      - "examples"
      - "asking for help"
    rubric:
      excellent: "Shows a systematic approach to learning built on fundamentals and a real example."
      good: "Gives relevant reasons and some concrete detail about toolchain flexibility, but links to the role stay general."
      weak: "Vague or generic answer on toolchain flexibility that could apply to any job."
    followups:
      - "When did you replace a tool you liked?"
      - "What do you do first in a new codebase?"
    common_errors:
      - "Holding on to familiar tools."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_slos"
    competency_key: motivation
    topic: "Why SLOs matter to them"
    difficulty: medium
    text: "What is it about SLOs and error budgets that appeals to you as a way of working, if at all?"
    expected_concepts:
      - "view of SLOs"
      - "examples"
      - "balancing reliability and delivery"
      - "critique"
    rubric:
      excellent: "Gives an informed view with an example of an SLO used for a decision and acknowledges pitfalls."
      good: "Gives relevant reasons and some concrete detail about why slos matter to them, but links to the role stay general."
      weak: "Vague or generic answer on why slos matter to them that could apply to any job."
    followups:
      - "When did you use an error budget to make a decision?"
      - "What goes wrong with SLOs?"
    common_errors:
      - "Reciting definitions."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_dev_empathy"
    competency_key: motivation
    topic: "Empathy for developers"
    difficulty: medium
    text: "How do you keep in touch with what developers need from a platform, and why do you like doing that?"
    expected_concepts:
      - "user research"
      - "feedback loops"
      - "examples of changes"
      - "support"
    rubric:
      excellent: "Describes specific feedback methods and a case where a platform changed because of user input."
      good: "Gives relevant reasons and some concrete detail about empathy for developers, but links to the role stay general."
      weak: "Vague or generic answer on empathy for developers that could apply to any job."
    followups:
      - "Tell me about a time you changed direction after feedback."
      - "How do you prioritise requests?"
    common_errors:
      - "Building without asking."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_vendor"
    competency_key: motivation
    topic: "Cloud preferences"
    difficulty: medium
    text: "How do you think about working across cloud providers, and what is your experience?"
    expected_concepts:
      - "experience with providers"
      - "transferable principles"
      - "learning"
      - "fit with the role"
    rubric:
      excellent: "Shows depth on one provider, transferable principles and an example of learning another."
      good: "Gives relevant reasons and some concrete detail about cloud preferences, but links to the role stay general."
      weak: "Vague or generic answer on cloud preferences that could apply to any job."
    followups:
      - "How quickly could you become productive on a new provider?"
      - "What would you avoid?"
    common_errors:
      - "Brand loyalty without reasoning."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_domain_pref"
    competency_key: motivation
    topic: "Security focus area"
    difficulty: medium
    text: "Security is wide. Which area do you most want to go deeper on, such as application security, cloud security, detection or identity?"
    expected_concepts:
      - "specific area"
      - "reasons"
      - "experience"
      - "learning plan"
      - "fit"
    rubric:
      excellent: "Picks one area with reasons, progress and a link to this role."
      good: "Gives relevant reasons and some concrete detail about security focus area, but links to the role stay general."
      weak: "Vague or generic answer on security focus area that could apply to any job."
    followups:
      - "What have you done so far in that area?"
      - "How do you decide what to learn?"
    common_errors:
      - "Wanting to do everything."

  - external_key: "recruiter_screening.motivation_infrastructure.net_automation"
    competency_key: motivation
    topic: "Automation in networking"
    difficulty: medium
    text: "How do you feel about automating network changes, and what have you built or want to build?"
    expected_concepts:
      - "automation experience"
      - "tools"
      - "safety and review"
      - "example"
    rubric:
      excellent: "Describes real automation with safeguards such as peer review and rollback."
      good: "Gives relevant reasons and some concrete detail about automation in networking, but links to the role stay general."
      weak: "Vague or generic answer on automation in networking that could apply to any job."
    followups:
      - "How do you make automated changes safe?"
      - "Where would you not automate?"
    common_errors:
      - "Making changes by hand only."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_collab"
    competency_key: motivation
    topic: "Working with developers"
    difficulty: medium
    text: "How do you like to work with application developers on schema design and queries?"
    expected_concepts:
      - "early involvement"
      - "reviews"
      - "education"
      - "examples"
      - "trade-offs"
    rubric:
      excellent: "Describes specific collaboration practices such as schema reviews and shared dashboards, with an example."
      good: "Gives relevant reasons and some concrete detail about working with developers, but links to the role stay general."
      weak: "Vague or generic answer on working with developers that could apply to any job."
    followups:
      - "How do you handle a harmful query in production?"
      - "What do developers often get wrong?"
    common_errors:
      - "Acting as a gatekeeper."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_balance"
    competency_key: recruiter_fit
    topic: "Sustainable operations"
    difficulty: medium
    text: "How do you keep a reliability job sustainable over years, and what do you need from a team to make that work?"
    expected_concepts:
      - "sustainable practices"
      - "alert quality"
      - "rotations"
      - "automation"
      - "communication"
    rubric:
      excellent: "Describes concrete practices such as alert quality, rotation design and automation, and the support they need."
      good: "Gives relevant reasons and some concrete detail about sustainable operations, but links to the role stay general."
      weak: "Vague or generic answer on sustainable operations that could apply to any job."
    followups:
      - "What have you changed about your own habits?"
      - "How do you push back on noisy alerts?"
    common_errors:
      - "Treating constant firefighting as normal."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_roadmap"
    competency_key: motivation
    topic: "Platform product thinking"
    difficulty: hard
    text: "Platform teams must say no to many requests. Tell me about a time you decided what not to build and how you handled it."
    expected_concepts:
      - "prioritisation"
      - "stakeholder communication"
      - "evidence"
      - "trade-offs"
      - "result"
    rubric:
      excellent: "Describes a clear prioritisation approach with evidence and respectful communication."
      good: "Gives relevant reasons and some concrete detail about platform product thinking, but links to the role stay general."
      weak: "Vague or generic answer on platform product thinking that could apply to any job."
    followups:
      - "How did the requester react?"
      - "How do you revisit decisions?"
    common_errors:
      - "Saying yes to everything."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_pressure"
    competency_key: motivation
    topic: "Pressure in cloud work"
    difficulty: hard
    text: "Cloud migrations often run into deadlines. Tell me about a time you had to protect quality or security under time pressure."
    expected_concepts:
      - "specific case"
      - "risk reasoning"
      - "negotiation"
      - "decision"
      - "result"
    rubric:
      excellent: "Describes the trade-offs clearly, what they protected and how they communicated it."
      good: "Gives relevant reasons and some concrete detail about pressure in cloud work, but links to the role stay general."
      weak: "Vague or generic answer on pressure in cloud work that could apply to any job."
    followups:
      - "What did you cut and what did you refuse to cut?"
      - "How did you communicate?"
    common_errors:
      - "Giving in on everything or refusing everything."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_career"
    competency_key: motivation
    topic: "Path in security"
    difficulty: hard
    text: "Security careers can lead toward architecture, management or deep specialist work. Which path attracts you and why?"
    expected_concepts:
      - "self-awareness"
      - "reasoning"
      - "experiments"
      - "link to role"
      - "flexibility"
    rubric:
      excellent: "Names a path, shows evidence from past work, and ties the plan to the role."
      good: "Gives relevant reasons and some concrete detail about path in security, but links to the role stay general."
      weak: "Vague or generic answer on path in security that could apply to any job."
    followups:
      - "What have you done to test your interest?"
      - "What would change your mind?"
    common_errors:
      - "No view on direction."
