version: 1
defaults:
  role_tags: [tech_lead, engineering_manager]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_leadership.tl_best_boss"
    competency_key: culture_values
    topic: "Good leadership they have seen"
    difficulty: easy
    text: "Think of the best leader you have worked for. What did they do that you try to copy?"
    expected_concepts:
      - "specific behaviours"
      - "effect on them"
      - "adaptation"
      - "reflection"
    rubric:
      excellent: "Names specific behaviours with their effect and how they apply them."
      good: "Gives relevant reasons and some concrete detail about good leadership they have seen, but links to the role stay general."
      weak: "Vague or generic answer on good leadership they have seen that could apply to any job."
    followups:
      - "What did they do that you would not copy?"
      - "How have you adapted it?"
    common_errors:
      - "Generic praise."

  - external_key: "recruiter_screening.motivation_leadership.em_worst_lesson"
    competency_key: culture_values
    topic: "Lessons from poor leadership"
    difficulty: easy
    text: "What have you learned from working under leadership that did not work well, and how does it shape how you lead?"
    expected_concepts:
      - "specific lessons"
      - "constructive"
      - "reflection"
      - "actions"
    rubric:
      excellent: "Names lessons without blame and shows how they affect their practice."
      good: "Gives relevant reasons and some concrete detail about lessons from poor leadership, but links to the role stay general."
      weak: "Vague or generic answer on lessons from poor leadership that could apply to any job."
    followups:
      - "What would you do differently?"
      - "How do you check yourself?"
    common_errors:
      - "Bitter criticism."

  - external_key: "recruiter_screening.motivation_leadership.tl_motivation_team"
    competency_key: leadership
    topic: "Motivating a team"
    difficulty: easy
    text: "What helps the engineers on your team stay engaged in their work?"
    expected_concepts:
      - "autonomy"
      - "purpose"
      - "growth"
      - "recognition"
      - "examples"
    rubric:
      excellent: "Describes asking people what matters to them and giving purpose and growth, with an example."
      good: "Gives relevant reasons and some concrete detail about motivating a team, but links to the role stay general."
      weak: "Vague or generic answer on motivating a team that could apply to any job."
    followups:
      - "What do you do when work is dull?"
      - "How do you find out what motivates each person?"
    common_errors:
      - "Assuming everyone is the same."

  - external_key: "recruiter_screening.motivation_leadership.em_trust"
    competency_key: leadership
    topic: "Building trust"
    difficulty: easy
    text: "How do you build trust with a team you've just joined as manager?"
    expected_concepts:
      - "listening"
      - "consistency"
      - "transparency"
      - "small commitments"
      - "example"
    rubric:
      excellent: "Describes listening first and keeping small commitments, with an example."
      good: "Gives relevant reasons and some concrete detail about building trust, but links to the role stay general."
      weak: "Vague or generic answer on building trust that could apply to any job."
    followups:
      - "What would you do in the first week?"
      - "How do you handle sceptics?"
    common_errors:
      - "Announcing changes first."

  - external_key: "recruiter_screening.motivation_leadership.tl_stay_growth"
    competency_key: motivation
    topic: "Staying technical"
    difficulty: easy
    text: "How do you keep your technical skills sharp while spending time on leadership tasks?"
    expected_concepts:
      - "habits"
      - "reviews"
      - "side projects"
      - "reading"
      - "example"
    rubric:
      excellent: "Describes habits and a recent example."
      good: "Gives relevant reasons and some concrete detail about staying technical, but links to the role stay general."
      weak: "Vague or generic answer on staying technical that could apply to any job."
    followups:
      - "What was the last thing you learned?"
      - "How do you choose what to code?"
    common_errors:
      - "Letting skills fade."

  - external_key: "recruiter_screening.motivation_leadership.em_learn_org"
    competency_key: motivation
    topic: "Learning from peers"
    difficulty: easy
    text: "Who do you learn from as a manager, and how do you seek out their input?"
    expected_concepts:
      - "mentors"
      - "peer groups"
      - "reading"
      - "asking for feedback"
      - "example"
    rubric:
      excellent: "Names sources of learning and gives an example of applying advice."
      good: "Gives relevant reasons and some concrete detail about learning from peers, but links to the role stay general."
      weak: "Vague or generic answer on learning from peers that could apply to any job."
    followups:
      - "What was the best advice you got?"
      - "How do you pay it forward?"
    common_errors:
      - "Learning alone."

  - external_key: "recruiter_screening.motivation_leadership.tl_conflict"
    competency_key: leadership
    topic: "Disagreements in the team"
    difficulty: medium
    text: "Two senior engineers on your team disagree strongly about an approach. What do you do?"
    expected_concepts:
      - "listening"
      - "evidence"
      - "structure for decision"
      - "documentation"
      - "relationships"
    rubric:
      excellent: "Describes a fair structure for decision and a follow-up that keeps relationships healthy."
      good: "Gives relevant reasons and some concrete detail about disagreements in the team, but links to the role stay general."
      weak: "Vague or generic answer on disagreements in the team that could apply to any job."
    followups:
      - "What if they still disagree?"
      - "When do you decide yourself?"
    common_errors:
      - "Picking a side quickly."

  - external_key: "recruiter_screening.motivation_leadership.em_conflict_peers"
    competency_key: leadership
    topic: "Conflicts with peers"
    difficulty: medium
    text: "Tell me about a time you disagreed with another manager over resources or priorities. How did you handle it?"
    expected_concepts:
      - "situation"
      - "listening"
      - "options"
      - "escalation"
      - "result"
    rubric:
      excellent: "Describes a constructive discussion with options and a result."
      good: "Gives relevant reasons and some concrete detail about conflicts with peers, but links to the role stay general."
      weak: "Vague or generic answer on conflicts with peers that could apply to any job."
    followups:
      - "How did you keep the relationship?"
      - "What would you do now?"
    common_errors:
      - "Escalating immediately."

  - external_key: "recruiter_screening.motivation_leadership.tl_remote"
    competency_key: recruiter_fit
    topic: "Leading in distributed teams"
    difficulty: medium
    text: "How do you lead technically when the team is distributed or hybrid?"
    expected_concepts:
      - "written communication"
      - "async habits"
      - "meetings"
      - "inclusion"
      - "example"
    rubric:
      excellent: "Describes concrete async habits such as written design docs and open channels."
      good: "Gives relevant reasons and some concrete detail about leading in distributed teams, but links to the role stay general."
      weak: "Vague or generic answer on leading in distributed teams that could apply to any job."
    followups:
      - "What breaks first?"
      - "How do you onboard remotely?"
    common_errors:
      - "Relying on meetings."

  - external_key: "recruiter_screening.motivation_leadership.em_remote"
    competency_key: recruiter_fit
    topic: "Managing distributed teams"
    difficulty: medium
    text: "How do you manage a team across locations, and what do you do to keep people connected to their work?"
    expected_concepts:
      - "rituals"
      - "written updates"
      - "one-to-ones"
      - "fairness across time zones"
      - "example"
    rubric:
      excellent: "Describes practices that keep people included regardless of location."
      good: "Gives relevant reasons and some concrete detail about managing distributed teams, but links to the role stay general."
      weak: "Vague or generic answer on managing distributed teams that could apply to any job."
    followups:
      - "How do you avoid proximity bias?"
      - "How do you handle time zones?"
    common_errors:
      - "Treating all equally by ignoring differences."

  - external_key: "recruiter_screening.motivation_leadership.tl_incident"
    competency_key: leadership
    topic: "Leading in incidents"
    difficulty: medium
    text: "Tell me about how you've led a team through a production incident and what you want to do differently next time."
    expected_concepts:
      - "roles"
      - "communication"
      - "decisions"
      - "follow-up"
      - "learning"
    rubric:
      excellent: "Describes clear roles and communication and a learning-focused review."
      good: "Gives relevant reasons and some concrete detail about leading in incidents, but links to the role stay general."
      weak: "Vague or generic answer on leading in incidents that could apply to any job."
    followups:
      - "What did you delegate?"
      - "How did you run the review?"
    common_errors:
      - "Taking over everything."

  - external_key: "recruiter_screening.motivation_leadership.em_org_change"
    competency_key: motivation
    topic: "Staying focused through change"
    difficulty: medium
    text: "Priorities shift in most companies. What helps you stay committed and keep your team focused when your area is reshuffled?"
    expected_concepts:
      - "sources of stability"
      - "communication"
      - "focus"
      - "support for team"
      - "example"
    rubric:
      excellent: "Describes concrete ways of keeping themselves and the team focused, with an example from a real change."
      good: "Gives relevant reasons and some concrete detail about staying focused through change, but links to the role stay general."
      weak: "Vague or generic answer on staying focused through change that could apply to any job."
    followups:
      - "What did your team ask of you?"
      - "What would you do differently?"
    common_errors:
      - "Passing on rumours."

  - external_key: "recruiter_screening.motivation_leadership.tl_architecture"
    competency_key: leadership
    topic: "Architecture guidance"
    difficulty: medium
    text: "How do you provide architecture direction without taking away the team's ownership of design?"
    expected_concepts:
      - "guardrails"
      - "principles"
      - "reviews"
      - "delegation"
      - "example"
    rubric:
      excellent: "Describes setting guardrails and reviewing, with an example of delegating design."
      good: "Gives relevant reasons and some concrete detail about architecture guidance, but links to the role stay general."
      weak: "Vague or generic answer on architecture guidance that could apply to any job."
    followups:
      - "When do you step in?"
      - "How do you document principles?"
    common_errors:
      - "Dictating designs."

  - external_key: "recruiter_screening.motivation_leadership.em_budget"
    competency_key: stakeholder_management
    topic: "Planning and budgets"
    difficulty: medium
    text: "How do you feel about planning headcount and budget, and what has your experience been?"
    expected_concepts:
      - "planning"
      - "justification"
      - "trade-offs"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes using evidence to plan and an example of negotiating resources."
      good: "Gives relevant reasons and some concrete detail about planning and budgets, but links to the role stay general."
      weak: "Vague or generic answer on planning and budgets that could apply to any job."
    followups:
      - "How do you justify a hire?"
      - "What would you cut?"
    common_errors:
      - "Avoiding the topic."

  - external_key: "recruiter_screening.motivation_leadership.tl_estimation"
    competency_key: leadership
    topic: "Estimates and commitments"
    difficulty: medium
    text: "How do you handle pressure for dates when estimates are uncertain?"
    expected_concepts:
      - "ranges"
      - "assumptions"
      - "slicing"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes ranges, assumptions and regular updates, with an example."
      good: "Gives relevant reasons and some concrete detail about estimates and commitments, but links to the role stay general."
      weak: "Vague or generic answer on estimates and commitments that could apply to any job."
    followups:
      - "Tell me about a date you refused."
      - "How do you update stakeholders?"
    common_errors:
      - "Committing to everything."

  - external_key: "recruiter_screening.motivation_leadership.em_diverse_team"
    competency_key: culture_values
    topic: "Working styles"
    difficulty: medium
    text: "How do you adapt your management to engineers with different working styles and levels of experience?"
    expected_concepts:
      - "individual adaptation"
      - "clear expectations"
      - "examples"
      - "fairness"
    rubric:
      excellent: "Describes adapting support while keeping expectations consistent, with an example."
      good: "Gives relevant reasons and some concrete detail about working styles, but links to the role stay general."
      weak: "Vague or generic answer on working styles that could apply to any job."
    followups:
      - "How do you stay fair?"
      - "Give an example of adapting."
    common_errors:
      - "One size fits all."

  - external_key: "recruiter_screening.motivation_leadership.tl_influence_roadmap"
    competency_key: stakeholder_management
    topic: "Influencing the roadmap"
    difficulty: medium
    text: "How do you make sure technical priorities are heard in product planning?"
    expected_concepts:
      - "evidence"
      - "framing in business terms"
      - "partnership"
      - "compromise"
      - "example"
    rubric:
      excellent: "Describes translating technical risk to business terms with an example."
      good: "Gives relevant reasons and some concrete detail about influencing the roadmap, but links to the role stay general."
      weak: "Vague or generic answer on influencing the roadmap that could apply to any job."
    followups:
      - "Tell me about a time you won or lost this argument."
      - "How do you quantify risk?"
    common_errors:
      - "Complaining about product."

  - external_key: "recruiter_screening.motivation_leadership.em_remote_pref"
    competency_key: recruiter_fit
    topic: "Work arrangement"
    difficulty: medium
    text: "What work arrangement helps you lead well, and how does it fit what this role offers?"
    expected_concepts:
      - "preference"
      - "flexibility"
      - "practical habits"
      - "examples"
    rubric:
      excellent: "States a preference briefly and shows flexibility toward the role's arrangement."
      good: "Gives relevant reasons and some concrete detail about work arrangement, but links to the role stay general."
      weak: "Vague or generic answer on work arrangement that could apply to any job."
    followups:
      - "What habits help?"
      - "How do you adapt?"
    common_errors:
      - "Making demands unrelated to the role."

  - external_key: "recruiter_screening.motivation_leadership.tl_ambiguous"
    competency_key: leadership
    topic: "Leading through ambiguity"
    difficulty: hard
    text: "Tell me about a time you had to lead a team when the goal was unclear. What did you do?"
    expected_concepts:
      - "framing"
      - "stakeholders"
      - "small steps"
      - "communication"
      - "result"
    rubric:
      excellent: "Describes creating clarity through discussion, small experiments and communication."
      good: "Gives relevant reasons and some concrete detail about leading through ambiguity, but links to the role stay general."
      weak: "Vague or generic answer on leading through ambiguity that could apply to any job."
    followups:
      - "How did the team react?"
      - "What did you decide not to do?"
    common_errors:
      - "Waiting for direction."

  - external_key: "recruiter_screening.motivation_leadership.em_values_conflict"
    competency_key: culture_values
    topic: "Standing for principles"
    difficulty: hard
    text: "Tell me about a time a request from above conflicted with something you believed was right for your team. What did you do?"
    expected_concepts:
      - "situation"
      - "reasoning"
      - "communication"
      - "compromise"
      - "result"
    rubric:
      excellent: "Describes respectful challenge with evidence and a constructive result."
      good: "Gives relevant reasons and some concrete detail about standing for principles, but links to the role stay general."
      weak: "Vague or generic answer on standing for principles that could apply to any job."
    followups:
      - "What was at stake?"
      - "Would you do the same again?"
    common_errors:
      - "Silent compliance."

  - external_key: "recruiter_screening.motivation_leadership.tl_burnout"
    competency_key: leadership
    topic: "Sustainable pace"
    difficulty: hard
    text: "Tell me about a time your team was working at an unsustainable pace. What did you do?"
    expected_concepts:
      - "signals"
      - "conversation"
      - "options"
      - "stakeholder talks"
      - "result"
    rubric:
      excellent: "Describes spotting signals, negotiating scope and making durable changes."
      good: "Gives relevant reasons and some concrete detail about sustainable pace, but links to the role stay general."
      weak: "Vague or generic answer on sustainable pace that could apply to any job."
    followups:
      - "How did you spot it?"
      - "What changed afterwards?"
    common_errors:
      - "Pushing through."

  - external_key: "recruiter_screening.motivation_leadership.em_exit"
    competency_key: people_management
    topic: "When people leave"
    difficulty: hard
    text: "Tell me about a time a strong team member left. What did you learn from it?"
    expected_concepts:
      - "situation"
      - "reflection"
      - "conversation"
      - "changes"
      - "support for the team"
    rubric:
      excellent: "Shows reflection, constructive learning and good handover."
      good: "Gives relevant reasons and some concrete detail about when people leave, but links to the role stay general."
      weak: "Vague or generic answer on when people leave that could apply to any job."
    followups:
      - "What could you have done earlier?"
      - "How did you handle the handover?"
    common_errors:
      - "Blaming the person."

  - external_key: "recruiter_screening.motivation_leadership.tl_vision"
    competency_key: motivation
    topic: "Long-term technical vision"
    difficulty: hard
    text: "What kind of technical environment would you want to help build over the next few years, and what would you want to be known for?"
    expected_concepts:
      - "vision"
      - "reasons"
      - "realistic steps"
      - "collaboration"
      - "link to role"
    rubric:
      excellent: "Describes a coherent vision, realistic steps and a link to this role."
      good: "Gives relevant reasons and some concrete detail about long-term technical vision, but links to the role stay general."
      weak: "Vague or generic answer on long-term technical vision that could apply to any job."
    followups:
      - "What would you do first?"
      - "What would you not do?"
    common_errors:
      - "Vague ambitions."

  - external_key: "recruiter_screening.motivation_leadership.tl_ask_why"
    competency_key: motivation
    topic: "Why this team"
    difficulty: easy
    text: "What about leading technical work on this particular team appeals to you, based on what you have seen so far?"
    expected_concepts:
      - "research"
      - "technology"
      - "mission"
      - "fit with experience"
    rubric:
      excellent: "References specifics about the team and ties them to experience."
      good: "Gives relevant reasons and some concrete detail about why this team, but links to the role stay general."
      weak: "Vague or generic answer on why this team that could apply to any job."
    followups:
      - "What do you want to know more about?"
      - "What would you change first?"
    common_errors:
      - "Generic."

  - external_key: "recruiter_screening.motivation_leadership.em_ask_why"
    competency_key: motivation
    topic: "Why this team"
    difficulty: easy
    text: "What attracts you to managing this particular team?"
    expected_concepts:
      - "research"
      - "mission"
      - "people"
      - "fit with experience"
    rubric:
      excellent: "References specifics about the team and ties them to experience."
      good: "Gives relevant reasons and some concrete detail about why this team, but links to the role stay general."
      weak: "Vague or generic answer on why this team that could apply to any job."
    followups:
      - "What more would you like to know?"
      - "What do you hope to improve?"
    common_errors:
      - "Generic."
