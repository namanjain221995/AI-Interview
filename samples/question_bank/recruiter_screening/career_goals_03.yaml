# Curated questions: recruiter screening, career goals (03 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.career_goals.what_energises_you
    competency_key: motivation
    topic: "What energises you at work"
    difficulty: easy
    text: "Which parts of your work do you find most energising, and how do you try to do more of them?"
    expected_concepts:
      - "specific activities"
      - "self-awareness"
      - "actions taken"
      - "link to role"
    rubric:
      excellent: "Names specific activities, shows steps taken to do more of them and links them to this job."
      good: "Names a few activities with brief reasons."
      weak: "Gives generic answers like learning new things."
    followups:
      - "When did you last do that?"
      - "What drains you instead?"
    common_errors:
      - "Gives generic answers like learning new things."

  - external_key: recruiter_screening.career_goals.next_two_years
    competency_key: motivation
    topic: "The next two years"
    difficulty: easy
    text: "Looking at the next two years, what do you hope to have accomplished?"
    expected_concepts:
      - "concrete accomplishments"
      - "balance of skills and delivery"
      - "realism"
      - "link to role"
    rubric:
      excellent: "Lists concrete, realistic accomplishments covering delivery and growth that fit this role."
      good: "Lists reasonable goals."
      weak: "Gives vague hopes."
    followups:
      - "Which matters most?"
      - "What could get in the way?"
    common_errors:
      - "Gives vague hopes."

  - external_key: recruiter_screening.career_goals.learning_through_projects
    competency_key: motivation
    topic: "Learning by doing"
    difficulty: easy
    text: "What is something you taught yourself by working on a real project rather than a course?"
    expected_concepts:
      - "specific skill"
      - "project context"
      - "method"
      - "outcome"
    rubric:
      excellent: "Describes the project, how they learned and how the skill is used now."
      good: "Describes a project and a skill gained."
      weak: "Can only refer to courses."
    followups:
      - "What mistakes did you make?"
      - "How did you check your understanding?"
    common_errors:
      - "Can only refer to courses."

  - external_key: recruiter_screening.career_goals.seeking_challenge
    competency_key: motivation
    topic: "Seeking challenge"
    difficulty: medium
    text: "When things feel routine, how do you find new challenges within your current role?"
    expected_concepts:
      - "initiative"
      - "specific examples"
      - "negotiating scope"
      - "results"
    rubric:
      excellent: "Gives examples of creating challenges with managers' support that benefited the team."
      good: "Gives general ideas."
      weak: "Waits for work to be assigned or leaves."
    followups:
      - "What did you propose?"
      - "How did your manager react?"
    common_errors:
      - "Waits for work to be assigned or leaves."

  - external_key: recruiter_screening.career_goals.compare_roles_offered
    competency_key: motivation
    topic: "Comparing opportunities"
    difficulty: easy
    text: "When you compare job opportunities, what criteria do you weigh most and how do they apply to this one?"
    expected_concepts:
      - "clear criteria"
      - "job-related factors"
      - "reasoned weighting"
      - "application"
    rubric:
      excellent: "Names clear job-related criteria and applies them thoughtfully to this role."
      good: "Names some criteria."
      weak: "Lists only pay or perks."
    followups:
      - "Which criterion is non-negotiable?"
      - "Where does this role stand out?"
    common_errors:
      - "Lists only pay or perks."

  - external_key: recruiter_screening.career_goals.skills_to_use_more
    competency_key: motivation
    topic: "Skills you want to use more"
    difficulty: easy
    text: "Which of your existing skills would you like to use more in your next role?"
    expected_concepts:
      - "specific skills"
      - "evidence of strength"
      - "link to this job"
      - "interest"
    rubric:
      excellent: "Names skills with examples of past impact and links them to this role."
      good: "Names skills with limited evidence."
      weak: "Names skills with no link to the job."
    followups:
      - "When did that skill make a difference?"
      - "How could it help us?"
    common_errors:
      - "Names skills with no link to the job."

  - external_key: recruiter_screening.career_goals.learning_from_peers
    competency_key: collaboration
    topic: "Learning from peers"
    difficulty: easy
    text: "Think of a teammate who was stronger than you in some area. What did you pick up from them, and how did you go about it?"
    expected_concepts:
      - "openness to learning"
      - "specific learning"
      - "how they sought it"
      - "application"
    rubric:
      excellent: "Describes specific learning from peers and how they sought it and use it now."
      good: "Mentions learning from peers briefly."
      weak: "Dismisses peers or gives no example."
    followups:
      - "How did you ask?"
      - "What did you teach them?"
    common_errors:
      - "Dismisses peers or gives no example."

  - external_key: recruiter_screening.career_goals.career_conversation_manager
    competency_key: communication
    topic: "Career conversations"
    difficulty: medium
    text: "How often do you like to talk about your development with a manager, and what makes those conversations useful?"
    expected_concepts:
      - "expectation setting"
      - "preparation"
      - "actions"
      - "follow-up"
    rubric:
      excellent: "Describes a rhythm, what they prepare and how conversations turn into actions."
      good: "Describes a general preference."
      weak: "Has no view or avoids such conversations."
    followups:
      - "What did you bring last time?"
      - "What happened afterward?"
    common_errors:
      - "Has no view or avoids such conversations."

  - external_key: recruiter_screening.career_goals.tech_stack_curiosity
    competency_key: motivation
    topic: "Stack curiosity"
    difficulty: easy
    text: "If you could pick up any technology or tool for your work next year, what would it be and why?"
    expected_concepts:
      - "specific choice"
      - "reason"
      - "practical use"
      - "learning approach"
    rubric:
      excellent: "Chooses a specific technology, ties it to work value and explains how they would start."
      good: "Chooses something with a plausible reason."
      weak: "Chooses by popularity only."
    followups:
      - "How would you try it out?"
      - "Who could use it?"
    common_errors:
      - "Chooses by popularity only."

  - external_key: recruiter_screening.career_goals.adapting_to_change
    competency_key: adaptability
    topic: "Changes in direction"
    difficulty: medium
    text: "Tell me about a time your priorities or team direction changed. How did it affect your plans?"
    expected_concepts:
      - "adaptation"
      - "communication"
      - "re-planning"
      - "outcome"
    rubric:
      excellent: "Describes the change, how they re-planned and what they gained or learned."
      good: "Describes the change and a basic response."
      weak: "Resisted the change or gives no example."
    followups:
      - "What did you do first?"
      - "What did you keep from the old plan?"
    common_errors:
      - "Resisted the change or gives no example."

  - external_key: recruiter_screening.career_goals.big_picture_interest
    competency_key: motivation
    topic: "Seeing the bigger picture"
    difficulty: easy
    text: "How interested are you in understanding the business side of the work you do, and how have you acted on it?"
    expected_concepts:
      - "curiosity"
      - "examples"
      - "use in decisions"
      - "limits"
    rubric:
      excellent: "Gives examples of learning the business context and using it to make better decisions."
      good: "Shows general interest."
      weak: "Shows no interest or knowledge."
    followups:
      - "What did you learn about customers?"
      - "How did it change a decision?"
    common_errors:
      - "Shows no interest or knowledge."

  - external_key: recruiter_screening.career_goals.one_thing_to_change
    competency_key: motivation
    topic: "A change in your trajectory"
    difficulty: medium
    text: "If you could change one thing about the way your career has gone so far, what would it be?"
    expected_concepts:
      - "reflection"
      - "constructive tone"
      - "lesson"
      - "forward action"
    rubric:
      excellent: "Names a specific thing, reflects constructively and shows how it guides current choices."
      good: "Names something with some reflection."
      weak: "Blames others or says nothing."
    followups:
      - "What would that have changed?"
      - "What are you doing now about it?"
    common_errors:
      - "Blames others or says nothing."

  - external_key: recruiter_screening.career_goals.role_expansion_ask
    competency_key: ownership
    topic: "Asking for more"
    difficulty: easy
    text: "How have you asked for more responsibility in the past, and how did it go?"
    expected_concepts:
      - "initiative"
      - "case made"
      - "negotiation"
      - "outcome"
    rubric:
      excellent: "Describes making a case based on value delivered and what resulted, including when it was declined."
      good: "Describes asking and an outcome."
      weak: "Never asked or expects to be noticed."
    followups:
      - "What argument did you use?"
      - "What if the answer had been no?"
    common_errors:
      - "Never asked or expects to be noticed."

  - external_key: recruiter_screening.career_goals.mentoring_others_goal
    competency_key: collaboration
    topic: "Helping others grow"
    difficulty: medium
    text: "Is helping others develop part of your career plans? What have you done so far?"
    expected_concepts:
      - "examples"
      - "approach"
      - "results"
      - "interest"
    rubric:
      excellent: "Gives concrete mentoring examples with results and a thoughtful view of how to do more."
      good: "Mentions some helping activities."
      weak: "Says it is not for them without reasoning."
    followups:
      - "What did the person gain?"
      - "What did you learn?"
    common_errors:
      - "Says it is not for them without reasoning."

  - external_key: recruiter_screening.career_goals.reskilling_story
    competency_key: adaptability
    topic: "Learning something new from scratch"
    difficulty: medium
    text: "Describe a time you had to learn something completely new for work. How did you approach it?"
    expected_concepts:
      - "plan"
      - "resources"
      - "practice"
      - "timeline and result"
    rubric:
      excellent: "Describes a structured approach, how long it took and how they knew they were ready."
      good: "Describes learning with a general approach."
      weak: "Gives no example."
    followups:
      - "What helped most?"
      - "How did you test yourself?"
    common_errors:
      - "Gives no example."

  - external_key: recruiter_screening.career_goals.long_term_vs_short_term_goals
    competency_key: motivation
    topic: "Short and long term goals"
    difficulty: easy
    text: "What is your main goal for the next six months, and how does it fit your longer-term plans?"
    expected_concepts:
      - "short-term goal"
      - "link to long-term"
      - "clarity"
      - "realism"
    rubric:
      excellent: "States a clear near-term goal and links it convincingly to a longer-term plan."
      good: "States goals but with a weak link."
      weak: "Cannot state a near-term goal."
    followups:
      - "How would you measure it?"
      - "What would change the plan?"
    common_errors:
      - "Cannot state a near-term goal."

  - external_key: recruiter_screening.career_goals.unique_strength
    competency_key: motivation
    topic: "Strength to build on"
    difficulty: easy
    text: "What strength do you most want to build on in your next role?"
    expected_concepts:
      - "specific strength"
      - "evidence"
      - "how it helps others"
      - "development plan"
    rubric:
      excellent: "Names a strength with evidence and a plan to stretch it that benefits the team."
      good: "Names a strength with an example."
      weak: "Names a strength without evidence."
    followups:
      - "Where did that strength come from?"
      - "How do others benefit?"
    common_errors:
      - "Names a strength without evidence."

  - external_key: recruiter_screening.career_goals.career_ladder_awareness
    competency_key: motivation
    topic: "Understanding progression"
    difficulty: medium
    text: "How do you usually learn what is expected at the next level in a company, and how would you find out here?"
    expected_concepts:
      - "proactive research"
      - "asking managers"
      - "criteria"
      - "documentation"
    rubric:
      excellent: "Describes asking for criteria, observing role models and checking progress regularly."
      good: "Says they would ask the manager."
      weak: "Has not thought about it."
    followups:
      - "What would you ask first?"
      - "How would you check?"
    common_errors:
      - "Has not thought about it."

  - external_key: recruiter_screening.career_goals.passion_projects_to_career
    competency_key: motivation
    topic: "Interests turned into work"
    difficulty: medium
    text: "Has an interest of yours ever turned into part of your job? How did that happen?"
    expected_concepts:
      - "initiative"
      - "example"
      - "value to employer"
      - "outcome"
    rubric:
      excellent: "Describes an interest that they turned into work value, how they proposed it and the results."
      good: "Describes a small overlap."
      weak: "Gives no example."
    followups:
      - "Who supported it?"
      - "What did it cost you?"
    common_errors:
      - "Gives no example."

  - external_key: recruiter_screening.career_goals.growth_with_remote_team
    competency_key: collaboration
    topic: "Growing in a distributed team"
    difficulty: medium
    text: "How do you keep growing professionally when you work mostly asynchronously with colleagues?"
    expected_concepts:
      - "deliberate habits"
      - "visibility"
      - "seeking feedback"
      - "examples"
    rubric:
      excellent: "Describes deliberate steps like written updates, scheduled feedback and pairing that work remotely."
      good: "Describes some habits."
      weak: "Says remote work makes growth hard without remedies."
    followups:
      - "What helped most?"
      - "How do you ask for feedback?"
    common_errors:
      - "Says remote work makes growth hard without remedies."

  - external_key: recruiter_screening.career_goals.handling_competing_goals
    competency_key: ownership
    topic: "Personal goals versus team needs"
    difficulty: hard
    text: "What would you do if your development goals conflicted with what the team needed for a quarter?"
    expected_concepts:
      - "prioritisation"
      - "communication"
      - "compromise"
      - "long-term view"
    rubric:
      excellent: "Describes talking early, finding a compromise and revisiting the goal later with a concrete plan."
      good: "Says they would put the team first or talk to a manager."
      weak: "Insists on their own goals or drops them silently."
    followups:
      - "Has that happened?"
      - "How would you raise it?"
    common_errors:
      - "Insists on their own goals or drops them silently."

  - external_key: recruiter_screening.career_goals.what_you_look_for_in_manager
    competency_key: culture_values
    topic: "Support from a manager"
    difficulty: medium
    text: "What kind of support from a manager helps you grow the most?"
    expected_concepts:
      - "specific behaviours"
      - "examples"
      - "reciprocity"
      - "job-related"
    rubric:
      excellent: "Describes specific behaviours like clear feedback and stretch work with examples and what they contribute."
      good: "Names general qualities."
      weak: "Describes only perks or avoids specifics."
    followups:
      - "What did a manager do that helped?"
      - "What do you need to do yourself?"
    common_errors:
      - "Describes only perks or avoids specifics."

  - external_key: recruiter_screening.career_goals.impact_you_want
    competency_key: motivation
    topic: "Impact you want to have"
    difficulty: easy
    text: "When your work goes well, what difference should it make for customers or colleagues?"
    expected_concepts:
      - "clear impact"
      - "examples"
      - "link to customers or team"
      - "realism"
    rubric:
      excellent: "Describes concrete impact they want, with examples from past work, tied to this role."
      good: "Describes impact in general terms."
      weak: "Cannot say."
    followups:
      - "Where have you seen it?"
      - "How would you tell?"
    common_errors:
      - "Cannot say."

  - external_key: recruiter_screening.career_goals.recent_learning_win
    competency_key: motivation
    topic: "Recent learning win"
    difficulty: easy
    text: "What is something you learned in the last six months that you are glad you learned?"
    expected_concepts:
      - "specific learning"
      - "context"
      - "application"
      - "reflection"
    rubric:
      excellent: "Names a recent specific learning, how it was applied and its effect."
      good: "Names something recent with limited use."
      weak: "Cannot name anything recent."
    followups:
      - "How did you learn it?"
      - "Who did you share it with?"
    common_errors:
      - "Cannot name anything recent."

  - external_key: recruiter_screening.career_goals.goal_review_with_team
    competency_key: collaboration
    topic: "Sharing goals with a team"
    difficulty: medium
    text: "How comfortable are you sharing your development goals with teammates, and how has that helped or not helped?"
    expected_concepts:
      - "openness"
      - "examples"
      - "benefits"
      - "boundaries"
    rubric:
      excellent: "Describes sharing goals with a practical example of the support or opportunities it created."
      good: "Describes some sharing."
      weak: "Keeps goals private with no reasoning."
    followups:
      - "Who helped?"
      - "What did you share?"
    common_errors:
      - "Keeps goals private with no reasoning."
