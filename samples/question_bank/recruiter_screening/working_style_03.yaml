# Curated questions: recruiter screening, working style (03 of 4). Job-related only; answers are judged on content, never on personal traits or circumstances.
version: 1
defaults:
  role_tags: [general]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: recruiter_screening.working_style.ownership_of_outcomes
    competency_key: ownership
    topic: "Seeing work through"
    difficulty: easy
    text: "How do you make sure work is truly finished rather than just handed off?"
    expected_concepts:
      - "definition of done"
      - "follow-up"
      - "verification"
      - "example"
    rubric:
      excellent: "Describes a clear definition of done, verifying results after handover and an example."
      good: "Describes completing assigned tasks."
      weak: "Considers work done once handed over."
    followups:
      - "How do you verify?"
      - "What do you do after release?"
    common_errors:
      - "Considers work done once handed over."

  - external_key: recruiter_screening.working_style.learning_manager_style
    competency_key: collaboration
    topic: "Understanding your manager"
    difficulty: easy
    text: "How do you learn what a new manager expects and how they like to work?"
    expected_concepts:
      - "asking"
      - "observing"
      - "adjusting"
      - "examples"
    rubric:
      excellent: "Describes asking direct questions, observing and agreeing on communication norms."
      good: "Describes adjusting over time."
      weak: "Assumes expectations."
    followups:
      - "What did you ask last time?"
      - "What did you adjust?"
    common_errors:
      - "Assumes expectations."

  - external_key: recruiter_screening.working_style.sharing_credit
    competency_key: collaboration
    topic: "Credit and recognition"
    difficulty: easy
    text: "How do you handle credit when a result came from a team effort?"
    expected_concepts:
      - "fairness"
      - "naming contributors"
      - "accuracy"
      - "example"
    rubric:
      excellent: "Describes naming contributors accurately and a specific example of doing so."
      good: "Says the team deserves credit."
      weak: "Takes the credit or ignores others."
    followups:
      - "What did you say in the review?"
      - "How do you handle it when others take credit?"
    common_errors:
      - "Takes the credit or ignores others."

  - external_key: recruiter_screening.working_style.priority_conflict_self
    competency_key: ownership
    topic: "Your task versus team need"
    difficulty: medium
    text: "What do you do when your planned work conflicts with something the team urgently needs?"
    expected_concepts:
      - "assess impact"
      - "communicate"
      - "negotiate"
      - "follow-up"
    rubric:
      excellent: "Describes weighing impact, informing stakeholders and rescheduling their own commitment."
      good: "Says they help the team and move their work."
      weak: "Ignores either side."
    followups:
      - "Who is told?"
      - "How do you reset?"
    common_errors:
      - "Ignores either side."

  - external_key: recruiter_screening.working_style.attention_to_detail
    competency_key: ownership
    topic: "Care in your work"
    difficulty: easy
    text: "How do you make sure the details in your work are right?"
    expected_concepts:
      - "checklists"
      - "review"
      - "verification"
      - "examples"
    rubric:
      excellent: "Describes specific checks, such as checklists or peer review, and an example of catching an error."
      good: "Says they double-check."
      weak: "Says they are careful without methods."
    followups:
      - "What slipped through once?"
      - "How do you review your own work?"
    common_errors:
      - "Says they are careful without methods."

  - external_key: recruiter_screening.working_style.documentation_habits
    competency_key: communication
    topic: "Notes and records"
    difficulty: easy
    text: "What notes or records do you keep while you work, and who are they for?"
    expected_concepts:
      - "decisions"
      - "context"
      - "handover"
      - "examples"
    rubric:
      excellent: "Describes writing decisions and context for future readers and a time it saved effort."
      good: "Describes keeping personal notes."
      weak: "Rarely writes anything."
    followups:
      - "Where do you store it?"
      - "Who reads it?"
    common_errors:
      - "Rarely writes anything."

  - external_key: recruiter_screening.working_style.influence_style
    competency_key: collaboration
    topic: "Persuading colleagues"
    difficulty: easy
    text: "How do you persuade a team to try an approach they are sceptical about?"
    expected_concepts:
      - "evidence"
      - "listening"
      - "small trial"
      - "follow-up"
    rubric:
      excellent: "Describes listening to concerns, presenting evidence and proposing a small trial."
      good: "Describes presenting their idea."
      weak: "Pushes harder or gives up."
    followups:
      - "What was the result?"
      - "How did you adjust?"
    common_errors:
      - "Pushes harder or gives up."

  - external_key: recruiter_screening.working_style.reacting_to_criticism
    competency_key: communication
    topic: "Handling critical comments"
    difficulty: medium
    text: "Walk me through how you decide what to do when a review comment feels wrong to you."
    expected_concepts:
      - "listening"
      - "checking facts"
      - "response"
      - "outcome"
    rubric:
      excellent: "Describes listening, testing the feedback against evidence and responding constructively."
      good: "Describes accepting or politely disagreeing."
      weak: "Dismisses it or ignores it."
    followups:
      - "How did you check?"
      - "Did you change your mind?"
    common_errors:
      - "Dismisses it or ignores it."

  - external_key: recruiter_screening.working_style.motivating_self_routine
    competency_key: ownership
    topic: "Staying productive"
    difficulty: easy
    text: "What helps you stay productive on long tasks that have no quick wins?"
    expected_concepts:
      - "milestones"
      - "tracking"
      - "support"
      - "examples"
    rubric:
      excellent: "Describes breaking work into milestones, tracking progress and checking in."
      good: "Describes pushing through."
      weak: "Loses momentum with no strategy."
    followups:
      - "What was the longest such task?"
      - "How did you know you were on track?"
    common_errors:
      - "Loses momentum with no strategy."

  - external_key: recruiter_screening.working_style.role_of_automation
    competency_key: ownership
    topic: "Removing repetitive work"
    difficulty: medium
    text: "How do you handle repetitive parts of your work?"
    expected_concepts:
      - "identify"
      - "automate or simplify"
      - "evidence of time saved"
      - "sharing"
    rubric:
      excellent: "Describes spotting repetition, simplifying or automating, and sharing the result with a measured benefit."
      good: "Does the work but suggests automation."
      weak: "Accepts repetition with no improvement."
    followups:
      - "What did you automate?"
      - "How much time did it save?"
    common_errors:
      - "Accepts repetition with no improvement."

  - external_key: recruiter_screening.working_style.silence_in_meetings
    competency_key: communication
    topic: "Speaking up"
    difficulty: easy
    text: "How do you decide when to speak up in a group discussion, particularly when you disagree?"
    expected_concepts:
      - "preparation"
      - "evidence"
      - "timing"
      - "respect"
    rubric:
      excellent: "Describes preparing evidence, choosing timing and phrasing disagreement respectfully."
      good: "Speaks up when sure."
      weak: "Stays quiet or dominates."
    followups:
      - "Give an example."
      - "What if you are overruled?"
    common_errors:
      - "Stays quiet or dominates."

  - external_key: recruiter_screening.working_style.mentoring_as_colleague
    competency_key: collaboration
    topic: "Helping newer colleagues"
    difficulty: medium
    text: "How do you help a newer colleague grow without doing their work for them?"
    expected_concepts:
      - "guiding questions"
      - "stretching"
      - "feedback"
      - "example"
    rubric:
      excellent: "Describes guiding with questions, giving ownership and feedback, with an example."
      good: "Describes helping when asked."
      weak: "Does their work or avoids helping."
    followups:
      - "What did they learn?"
      - "How did you step back?"
    common_errors:
      - "Does their work or avoids helping."

  - external_key: recruiter_screening.working_style.cross_time_zone
    competency_key: collaboration
    topic: "Time zones"
    difficulty: medium
    text: "If a team spans several time zones, what habits make that work?"
    expected_concepts:
      - "written handoffs"
      - "overlap"
      - "clear ownership"
      - "patience"
    rubric:
      excellent: "Describes written handoffs, planned overlap and clear owners with an example."
      good: "Describes adjusting hours."
      weak: "Has no experience or approach."
    followups:
      - "What do you include in a handoff?"
      - "How do you handle urgent issues?"
    common_errors:
      - "Has no experience or approach."

  - external_key: recruiter_screening.working_style.working_with_data
    competency_key: problem_solving
    topic: "Using evidence"
    difficulty: easy
    text: "How do you use data or evidence in everyday decisions at work?"
    expected_concepts:
      - "relevant data"
      - "limits"
      - "examples"
      - "communication"
    rubric:
      excellent: "Describes choosing relevant evidence, acknowledging limits and an example where data changed a decision."
      good: "Says they use data when available."
      weak: "Relies on gut feeling only."
    followups:
      - "What data was missing?"
      - "How did you communicate it?"
    common_errors:
      - "Relies on gut feeling only."

  - external_key: recruiter_screening.working_style.handling_change_in_team
    competency_key: adaptability
    topic: "Team changes"
    difficulty: medium
    text: "How do you adapt when team membership or leadership changes?"
    expected_concepts:
      - "re-establishing norms"
      - "relationships"
      - "continuity"
      - "example"
    rubric:
      excellent: "Describes quickly rebuilding working agreements and keeping continuity of knowledge."
      good: "Says they adapt."
      weak: "Struggles or resists."
    followups:
      - "What did you do in the first week?"
      - "What did you hand over?"
    common_errors:
      - "Struggles or resists."

  - external_key: recruiter_screening.working_style.transparency_at_work
    competency_key: communication
    topic: "Openness about problems"
    difficulty: medium
    text: "How open are you about problems in your own work, and when do you raise them?"
    expected_concepts:
      - "early disclosure"
      - "context"
      - "solutions"
      - "example"
    rubric:
      excellent: "Describes raising problems early with context and options, and an example."
      good: "Raises problems when asked."
      weak: "Hides problems."
    followups:
      - "What if the news is bad?"
      - "How does your manager respond?"
    common_errors:
      - "Hides problems."

  - external_key: recruiter_screening.working_style.planning_vs_improvising
    competency_key: problem_solving
    topic: "Planning or improvising"
    difficulty: medium
    text: "How much do you plan before starting, and when do you prefer to experiment?"
    expected_concepts:
      - "situation-dependent"
      - "risk"
      - "learning"
      - "example"
    rubric:
      excellent: "Explains how risk and reversibility guide the choice, with examples of each."
      good: "States a preference."
      weak: "Always plans or always improvises."
    followups:
      - "When did planning fail?"
      - "When did improvising fail?"
    common_errors:
      - "Always plans or always improvises."

  - external_key: recruiter_screening.working_style.collaborating_with_clients
    competency_key: communication
    topic: "Working with external people"
    difficulty: medium
    text: "How do you work with people outside the company, such as customers or partners?"
    expected_concepts:
      - "listening"
      - "expectations"
      - "clarity"
      - "example"
    rubric:
      excellent: "Describes clarifying needs, setting expectations and keeping them informed, with an example."
      good: "Describes being polite and responsive."
      weak: "Avoids interaction or over-promises."
    followups:
      - "What was a hard conversation?"
      - "How do you say no?"
    common_errors:
      - "Avoids interaction or over-promises."

  - external_key: recruiter_screening.working_style.consistency_under_load
    competency_key: ownership
    topic: "Quality when busy"
    difficulty: hard
    text: "When the workload is heavy for a long time, what do you do to keep quality up?"
    expected_concepts:
      - "prioritisation"
      - "communication"
      - "process"
      - "limits"
    rubric:
      excellent: "Describes cutting scope with agreement, protecting key quality steps and flagging risks."
      good: "Describes working harder."
      weak: "Quality drops silently."
    followups:
      - "What was the cost?"
      - "What would you change?"
    common_errors:
      - "Quality drops silently."

  - external_key: recruiter_screening.working_style.negotiating_scope
    competency_key: communication
    topic: "Negotiating what is possible"
    difficulty: hard
    text: "Tell me about a time you negotiated the scope or timeline of work with a requester."
    expected_concepts:
      - "understanding needs"
      - "options"
      - "trade-offs"
      - "agreement"
    rubric:
      excellent: "Describes understanding needs, offering options with trade-offs and reaching a clear agreement."
      good: "Describes a negotiation with an outcome."
      weak: "Said yes to everything or refused."
    followups:
      - "What options did you offer?"
      - "How did you follow up?"
    common_errors:
      - "Said yes to everything or refused."

  - external_key: recruiter_screening.working_style.personal_systems
    competency_key: ownership
    topic: "Your tools"
    difficulty: easy
    text: "What personal systems or tools do you rely on to stay organised?"
    expected_concepts:
      - "specific tools"
      - "reasons"
      - "adaptation"
      - "results"
    rubric:
      excellent: "Describes specific tools and routines, why they work and how they adapt to team tools."
      good: "Names a few tools."
      weak: "Names none."
    followups:
      - "What would you change?"
      - "How do you share it?"
    common_errors:
      - "Names none."

  - external_key: recruiter_screening.working_style.taking_direction
    competency_key: collaboration
    topic: "Following a plan you disagree with"
    difficulty: easy
    text: "If your team chooses a direction you did not favour, how do you handle it?"
    expected_concepts:
      - "voice concerns"
      - "commit"
      - "support"
      - "follow-up"
    rubric:
      excellent: "Describes voicing concerns early, then committing fully and helping it succeed."
      good: "Describes going along."
      weak: "Undermines the decision or disengages."
    followups:
      - "Give an example."
      - "What if it fails?"
    common_errors:
      - "Undermines the decision or disengages."

  - external_key: recruiter_screening.working_style.time_estimation
    competency_key: problem_solving
    topic: "Estimating work"
    difficulty: medium
    text: "How do you estimate how long work will take, and how do you handle it when you are off?"
    expected_concepts:
      - "method"
      - "buffers"
      - "communication"
      - "learning"
    rubric:
      excellent: "Describes an estimation method, reviewing past accuracy and warning early when off."
      good: "Describes giving a gut estimate."
      weak: "Rarely estimates or hides slippage."
    followups:
      - "How accurate are you?"
      - "What do you tell stakeholders?"
    common_errors:
      - "Rarely estimates or hides slippage."

  - external_key: recruiter_screening.working_style.shared_workspaces
    competency_key: collaboration
    topic: "Shared workspaces"
    difficulty: easy
    text: "How do you keep shared documents or work areas tidy and usable for others?"
    expected_concepts:
      - "naming"
      - "structure"
      - "ownership"
      - "examples"
    rubric:
      excellent: "Describes conventions, clear ownership and tidy-up habits and an example of improvement."
      good: "Says they keep things organised."
      weak: "Leaves clutter for others."
    followups:
      - "What conventions help?"
      - "How do you handle old material?"
    common_errors:
      - "Leaves clutter for others."

  - external_key: recruiter_screening.working_style.learning_from_others_style
    competency_key: collaboration
    topic: "Observing others"
    difficulty: easy
    text: "What have you adopted from watching how other colleagues work?"
    expected_concepts:
      - "specific habits"
      - "reasons"
      - "adoption"
      - "results"
    rubric:
      excellent: "Names specific habits observed, why they adopted them and the result."
      good: "Names a habit."
      weak: "Cannot name any."
    followups:
      - "What did you not adopt?"
      - "Who else?"
    common_errors:
      - "Cannot name any."
