version: 1
defaults:
  role_tags: [devops, sre, platform, cloud, security, network, dba]
  round_types: [recruiter_screening]
  kind: recruiter
questions:
  - external_key: "recruiter_screening.motivation_infrastructure.devops_company"
    competency_key: recruiter_fit
    topic: "Interest in this team"
    difficulty: easy
    text: "What do you know about what our engineering team does, and what questions do you have about our infrastructure?"
    expected_concepts:
      - "research"
      - "relevant questions"
      - "scale and tools"
      - "interest"
    rubric:
      excellent: "Shows research and asks thoughtful questions about infrastructure and practices."
      good: "Gives relevant reasons and some concrete detail about interest in this team, but links to the role stay general."
      weak: "Vague or generic answer on interest in this team that could apply to any job."
    followups:
      - "What caught your attention?"
      - "What would you ask the team lead?"
    common_errors:
      - "Asking about perks only."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_company"
    competency_key: recruiter_fit
    topic: "Interest in this service"
    difficulty: easy
    text: "What have you learned about the systems this role would look after, and what would you like to know more about?"
    expected_concepts:
      - "research"
      - "questions about SLOs and on-call"
      - "interest"
    rubric:
      excellent: "Shows research and informed questions about reliability practices."
      good: "Gives relevant reasons and some concrete detail about interest in this service, but links to the role stay general."
      weak: "Vague or generic answer on interest in this service that could apply to any job."
    followups:
      - "Which service interests you?"
      - "What would you want to see in our alerting?"
    common_errors:
      - "No research."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_company"
    competency_key: recruiter_fit
    topic: "Interest in this platform"
    difficulty: easy
    text: "What do you know about our platform and its users, and what would you want to find out?"
    expected_concepts:
      - "research"
      - "questions about users and roadmap"
      - "interest"
    rubric:
      excellent: "Shows preparation and focuses on user needs."
      good: "Gives relevant reasons and some concrete detail about interest in this platform, but links to the role stay general."
      weak: "Vague or generic answer on interest in this platform that could apply to any job."
    followups:
      - "What would you improve first?"
      - "How would you learn what developers need?"
    common_errors:
      - "Focusing on technology only."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_company"
    competency_key: recruiter_fit
    topic: "Interest in this cloud environment"
    difficulty: easy
    text: "What do you understand about our cloud environment from the posting, and what would you want to ask us?"
    expected_concepts:
      - "research"
      - "provider"
      - "architecture questions"
      - "interest"
    rubric:
      excellent: "Reads the posting accurately and asks good questions about scale, accounts and governance."
      good: "Gives relevant reasons and some concrete detail about interest in this cloud environment, but links to the role stay general."
      weak: "Vague or generic answer on interest in this cloud environment that could apply to any job."
    followups:
      - "What would you look at first?"
      - "What do you hope to find?"
    common_errors:
      - "Not knowing the cloud provider in use."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_company"
    competency_key: recruiter_fit
    topic: "Interest in this security team"
    difficulty: easy
    text: "What do you know about our security function and what kind of threats matter in our industry?"
    expected_concepts:
      - "research"
      - "industry risks"
      - "questions"
      - "interest"
    rubric:
      excellent: "Shows research on the industry's risks and asks about team structure and priorities."
      good: "Gives relevant reasons and some concrete detail about interest in this security team, but links to the role stay general."
      weak: "Vague or generic answer on interest in this security team that could apply to any job."
    followups:
      - "How did you learn about it?"
      - "What would you ask the team?"
    common_errors:
      - "Generic security answers."

  - external_key: "recruiter_screening.motivation_infrastructure.net_company"
    competency_key: recruiter_fit
    topic: "Interest in this network"
    difficulty: easy
    text: "What do you understand about our network environment, and what would you like to learn more about?"
    expected_concepts:
      - "research"
      - "environment guesses"
      - "questions on scale and tools"
    rubric:
      excellent: "Summarises what they know and asks informed questions."
      good: "Gives relevant reasons and some concrete detail about interest in this network, but links to the role stay general."
      weak: "Vague or generic answer on interest in this network that could apply to any job."
    followups:
      - "What have you seen in similar environments?"
      - "What would you check first?"
    common_errors:
      - "Asking nothing about the environment."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_company"
    competency_key: recruiter_fit
    topic: "Interest in this data environment"
    difficulty: easy
    text: "What do you know about the data systems at our company, and what would you like to know?"
    expected_concepts:
      - "research"
      - "engines"
      - "scale"
      - "questions"
    rubric:
      excellent: "Shows preparation and relevant questions about engines, scale and ownership."
      good: "Gives relevant reasons and some concrete detail about interest in this data environment, but links to the role stay general."
      weak: "Vague or generic answer on interest in this data environment that could apply to any job."
    followups:
      - "Which of our databases do you know best?"
      - "What would you improve?"
    common_errors:
      - "No preparation."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "Suppose you start next month. What would you set out to learn and change first on the delivery side, and how would you pick your first improvement?"
    expected_concepts:
      - "realistic plan"
      - "learning"
      - "relationships"
      - "early wins"
    rubric:
      excellent: "Gives a realistic plan that starts with learning and builds to a small improvement."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "What would be a quick win?"
      - "How would you avoid breaking things?"
    common_errors:
      - "Planning large changes early."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "If you joined as a reliability engineer, how would you get ready for on-call and decide which reliability gap to work on first?"
    expected_concepts:
      - "learning the system"
      - "on-call readiness"
      - "relationships"
      - "early improvements"
    rubric:
      excellent: "Describes a staged plan covering learning, shadowing on-call and one measured improvement."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "Which improvements would you look for first?"
      - "How would you decide what mattered most?"
    common_errors:
      - "Making changes before understanding the system."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "On day one of a platform job, who would you want to talk to, and what would you hope to have shipped for them by the end of a quarter?"
    expected_concepts:
      - "user interviews"
      - "learning stack"
      - "small improvement"
      - "communication"
    rubric:
      excellent: "Includes user conversations and learning with a small, useful first delivery."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "How would you choose a first project?"
      - "Who would you talk to?"
    common_errors:
      - "Skipping user input."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "How would you go about getting to know an existing cloud estate in a new job, and what would you want to have improved by the end of a quarter?"
    expected_concepts:
      - "reviewing environment"
      - "understanding governance"
      - "relationships"
      - "first improvement"
    rubric:
      excellent: "Describes a review and learning phase followed by a prioritised, measurable improvement."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "What would you review first?"
      - "How would you prioritise findings?"
    common_errors:
      - "Restructuring before understanding."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "When you start in a security role, how do you work out where the biggest risks are, and what visible result would you aim for in the first quarter?"
    expected_concepts:
      - "understanding risks"
      - "relationships with engineers"
      - "priorities"
      - "early wins"
    rubric:
      excellent: "Describes learning the environment, building relationships and delivering one visible improvement."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "How would you prioritise risks?"
      - "How would you get buy-in?"
    common_errors:
      - "Starting with sweeping policy changes."

  - external_key: "recruiter_screening.motivation_infrastructure.net_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "You inherit a network you have never seen. What would you do to understand it safely, and what would you change first?"
    expected_concepts:
      - "understanding topology"
      - "documentation"
      - "relationships"
      - "early improvement"
    rubric:
      excellent: "Describes learning and documenting first, then one low-risk improvement."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "What documentation would you look for?"
      - "What risks would you look for?"
    common_errors:
      - "Making changes before mapping the network."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_first_90"
    competency_key: motivation
    topic: "Their first months"
    difficulty: medium
    text: "You take over a set of production databases you did not build. What do you check first, and what would you change in the first quarter?"
    expected_concepts:
      - "inventory"
      - "backup and restore review"
      - "performance baseline"
      - "relationships"
    rubric:
      excellent: "Describes inventory, reviewing recovery and baselining performance before proposing changes."
      good: "Gives relevant reasons and some concrete detail about their first months, but links to the role stay general."
      weak: "Vague or generic answer on their first months that could apply to any job."
    followups:
      - "How would you test recovery?"
      - "What would you look at first?"
    common_errors:
      - "Tuning blindly."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_values"
    competency_key: culture_values
    topic: "What they value"
    difficulty: medium
    text: "What do you value most in an infrastructure team's way of working, and how have you helped build it?"
    expected_concepts:
      - "specific practices such as reviews and runbooks"
      - "examples"
      - "contribution"
    rubric:
      excellent: "Names practices and gives examples of introducing them."
      good: "Gives relevant reasons and some concrete detail about what they value, but links to the role stay general."
      weak: "Vague or generic answer on what they value that could apply to any job."
    followups:
      - "Which have you introduced?"
      - "What do you do if the team lacks it?"
    common_errors:
      - "Listing values with no actions."

  - external_key: "recruiter_screening.motivation_infrastructure.sre_toil_culture"
    competency_key: culture_values
    topic: "Team practices"
    difficulty: medium
    text: "What practices do you look for on a reliability team, and which ones have you introduced?"
    expected_concepts:
      - "postmortems"
      - "runbooks"
      - "alert reviews"
      - "examples"
      - "contribution"
    rubric:
      excellent: "Gives specific practices and an example of introducing one."
      good: "Gives relevant reasons and some concrete detail about team practices, but links to the role stay general."
      weak: "Vague or generic answer on team practices that could apply to any job."
    followups:
      - "What worked and what didn't?"
      - "How do you get buy-in?"
    common_errors:
      - "Claiming everything is already perfect."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_values"
    competency_key: culture_values
    topic: "Team practices"
    difficulty: medium
    text: "What does good teamwork on a platform team look like to you?"
    expected_concepts:
      - "shared ownership"
      - "documentation"
      - "user focus"
      - "examples"
    rubric:
      excellent: "Shares specific habits with examples from past teams."
      good: "Gives relevant reasons and some concrete detail about team practices, but links to the role stay general."
      weak: "Vague or generic answer on team practices that could apply to any job."
    followups:
      - "How do you handle support duties?"
      - "How do you share knowledge?"
    common_errors:
      - "Abstract statements about teamwork."

  - external_key: "recruiter_screening.motivation_infrastructure.cloud_values"
    competency_key: culture_values
    topic: "Collaboration values"
    difficulty: medium
    text: "What matters most to you in how a cloud team shares responsibility with application teams?"
    expected_concepts:
      - "shared responsibility"
      - "guardrails"
      - "communication"
      - "examples"
    rubric:
      excellent: "Describes shared responsibility models and an example of making them work."
      good: "Gives relevant reasons and some concrete detail about collaboration values, but links to the role stay general."
      weak: "Vague or generic answer on collaboration values that could apply to any job."
    followups:
      - "How do you handle conflicts of priorities?"
      - "What does a good handover look like?"
    common_errors:
      - "Splitting teams into silos."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_values"
    competency_key: culture_values
    topic: "Professional values"
    difficulty: medium
    text: "What principles guide how you do security work, especially when you find a problem in someone else's code or system?"
    expected_concepts:
      - "responsible handling"
      - "respect"
      - "clear reports"
      - "remediation help"
      - "example"
    rubric:
      excellent: "Describes respectful, evidence-based reporting and helping with remediation, with an example."
      good: "Gives relevant reasons and some concrete detail about professional values, but links to the role stay general."
      weak: "Vague or generic answer on professional values that could apply to any job."
    followups:
      - "How do you report findings?"
      - "How do you handle disagreement about severity?"
    common_errors:
      - "Shaming teams for mistakes."

  - external_key: "recruiter_screening.motivation_infrastructure.net_values"
    competency_key: culture_values
    topic: "Professional values"
    difficulty: medium
    text: "What working principles matter to you when you manage changes to a shared network?"
    expected_concepts:
      - "change discipline"
      - "communication"
      - "documentation"
      - "risk thinking"
      - "examples"
    rubric:
      excellent: "Describes disciplined change habits and an example."
      good: "Gives relevant reasons and some concrete detail about professional values, but links to the role stay general."
      weak: "Vague or generic answer on professional values that could apply to any job."
    followups:
      - "How do you announce changes?"
      - "How do you handle an emergency change?"
    common_errors:
      - "Making silent changes."

  - external_key: "recruiter_screening.motivation_infrastructure.dba_values"
    competency_key: culture_values
    topic: "Professional values"
    difficulty: medium
    text: "What principles guide how you protect data and still let teams move quickly?"
    expected_concepts:
      - "data protection"
      - "automation"
      - "guardrails"
      - "communication"
      - "example"
    rubric:
      excellent: "Describes guardrails that balance safety and speed with an example."
      good: "Gives relevant reasons and some concrete detail about professional values, but links to the role stay general."
      weak: "Vague or generic answer on professional values that could apply to any job."
    followups:
      - "How do you say no to a risky request?"
      - "How do you handle urgent changes?"
    common_errors:
      - "Blocking changes by default."

  - external_key: "recruiter_screening.motivation_infrastructure.devops_future"
    competency_key: motivation
    topic: "Industry changes"
    difficulty: hard
    text: "Infrastructure work keeps changing with new platforms and automation, including AI-assisted tooling. What do you think will matter most for people in your role, and how are you preparing?"
    expected_concepts:
      - "view of the field"
      - "skills"
      - "actions"
      - "critical thinking"
      - "link to role"
    rubric:
      excellent: "Gives a reasoned view of change, concrete preparation and judgement about automation."
      good: "Gives relevant reasons and some concrete detail about industry changes, but links to the role stay general."
      weak: "Vague or generic answer on industry changes that could apply to any job."
    followups:
      - "Which tool changed how you work most?"
      - "What would you not trust to automation?"
    common_errors:
      - "Hype or dismissal."

  - external_key: "recruiter_screening.motivation_infrastructure.plat_hard_user"
    competency_key: motivation
    topic: "Difficult stakeholders"
    difficulty: hard
    text: "Tell me about a time a team strongly disliked something your platform required. How did you respond and what did it teach you?"
    expected_concepts:
      - "listening"
      - "evidence"
      - "compromise"
      - "communication"
      - "learning"
    rubric:
      excellent: "Shows listening, a considered response and a change that improved the relationship."
      good: "Gives relevant reasons and some concrete detail about difficult stakeholders, but links to the role stay general."
      weak: "Vague or generic answer on difficult stakeholders that could apply to any job."
    followups:
      - "Did you change the platform?"
      - "How did the relationship change?"
    common_errors:
      - "Defensive reactions."

  - external_key: "recruiter_screening.motivation_infrastructure.sec_resilience"
    competency_key: motivation
    topic: "Staying motivated"
    difficulty: hard
    text: "Security can be a thankless job when nothing happens or when problems keep appearing. What keeps you motivated over the long run?"
    expected_concepts:
      - "sources of motivation"
      - "metrics of success"
      - "support"
      - "learning"
      - "sustainability"
    rubric:
      excellent: "Shows a mature view of success in prevention, with concrete sources of motivation and sustainable habits."
      good: "Gives relevant reasons and some concrete detail about staying motivated, but links to the role stay general."
      weak: "Vague or generic answer on staying motivated that could apply to any job."
    followups:
      - "How do you celebrate success?"
      - "How do you avoid fatigue?"
    common_errors:
      - "Needing external recognition."

  - external_key: "recruiter_screening.motivation_infrastructure.net_pressure"
    competency_key: motivation
    topic: "Change windows and pressure"
    difficulty: medium
    text: "Network changes often happen in tight maintenance windows. How do you prepare for them and what do you like or dislike about that kind of work?"
    expected_concepts:
      - "planning"
      - "rollback"
      - "communication"
      - "verification"
      - "example"
    rubric:
      excellent: "Describes preparation such as rollback plans and verification and gives a specific example."
      good: "Gives relevant reasons and some concrete detail about change windows and pressure, but links to the role stay general."
      weak: "Vague or generic answer on change windows and pressure that could apply to any job."
    followups:
      - "Tell me about a change that did not go as planned."
      - "How do you rehearse a change?"
    common_errors:
      - "Improvising during the window."
