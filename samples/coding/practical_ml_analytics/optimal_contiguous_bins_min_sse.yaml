reference_solutions:
  python: |
    def min_sse_bins(values: list[int], k: int) -> float:
        xs = sorted(values)
        n = len(xs)
        pre = [0] * (n + 1)
        pre_sq = [0] * (n + 1)
        for i, x in enumerate(xs):
            pre[i + 1] = pre[i] + x
            pre_sq[i + 1] = pre_sq[i] + x * x

        def cost(lo: int, hi: int) -> float:
            # SSE of xs[lo:hi]; the numerator is an exact integer.
            size = hi - lo
            s = pre[hi] - pre[lo]
            return (size * (pre_sq[hi] - pre_sq[lo]) - s * s) / size

        inf = float("inf")
        prev = [inf] * (n + 1)
        prev[0] = 0.0
        for groups in range(1, k + 1):
            cur = [inf] * (n + 1)
            for end in range(groups, n - (k - groups) + 1):
                best = inf
                for start in range(groups - 1, end):
                    if prev[start] == inf:
                        continue
                    cand = prev[start] + cost(start, end)
                    if cand < best:
                        best = cand
                cur[end] = best
            prev = cur
        return prev[n]
  javascript: |
    function minSseBins(values, k) {
      const xs = [...values].sort((a, b) => a - b);
      const n = xs.length;
      const pre = new Array(n + 1).fill(0);
      const preSq = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) {
        pre[i + 1] = pre[i] + xs[i];
        preSq[i + 1] = preSq[i] + xs[i] * xs[i];
      }
      const cost = (lo, hi) => {
        const size = hi - lo;
        const s = pre[hi] - pre[lo];
        return (size * (preSq[hi] - preSq[lo]) - s * s) / size;
      };
      let prev = new Array(n + 1).fill(Infinity);
      prev[0] = 0;
      for (let groups = 1; groups <= k; groups++) {
        const cur = new Array(n + 1).fill(Infinity);
        for (let end = groups; end <= n - (k - groups); end++) {
          let best = Infinity;
          for (let start = groups - 1; start < end; start++) {
            if (prev[start] === Infinity) continue;
            const cand = prev[start] + cost(start, end);
            if (cand < best) best = cand;
          }
          cur[end] = best;
        }
        prev = cur;
      }
      return prev[n];
    }
