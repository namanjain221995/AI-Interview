title: Optimal Severity Bands by Minimum SSE
difficulty: hard
competency_keys: [algorithms, problem_solving, data_structures]
role_tags: [data_scientist, data_analyst, sre, ml]
time_limit_minutes: 35
prompt_markdown: |
  ## Optimal Severity Bands by Minimum SSE

  The reliability team wants to turn incident durations (in whole minutes) into exactly `k` severity
  bands, such as "short", "medium" and "long", so that the incidents inside each band are as alike as
  possible.

  Sort the durations in ascending order and cut the sorted list into **exactly `k` non-empty contiguous
  bands**. The cost of one band is its **sum of squared errors (SSE)**: the sum over its durations of
  `(duration - band_mean)^2`, where `band_mean` is the average duration of that band. The cost of a
  banding is the sum of its band costs.

  Return the **minimum total SSE** over all ways to cut the sorted list into `k` bands. The value is a
  float compared with a relative tolerance of `1e-6` (`|actual - expected| <= 1e-6 * max(1, |expected|)`).

  ### Example 1
  ```
  Input:  values = [12, 3, 45, 5, 40, 4], k = 2
  Output: 62.5
  Explanation: sorted [3, 4, 5, 12, 40, 45]. Bands [3, 4, 5, 12] (mean 6, SSE 9 + 4 + 1 + 36 = 50) and
  [40, 45] (mean 42.5, SSE 12.5) give 62.5, and no other cut is cheaper.
  ```

  ### Example 2
  ```
  Input:  values = [1, 2, 10, 11, 30], k = 3
  Output: 1.0
  Explanation: bands [1, 2], [10, 11] and [30] cost 0.5 + 0.5 + 0.
  ```

  ### Example 3
  ```
  Input:  values = [7, 7, 7], k = 1
  Output: 0.0
  ```

  ### Constraints
  - `1 <= values.length <= 300`
  - `0 <= values[i] <= 1000`
  - `1 <= k <= values.length`

  **Follow-up:** cutting at the `k - 1` largest gaps is fast but not always optimal. Can you find the
  exact optimum in `O(k * n^2)` time, and how would you go faster?
