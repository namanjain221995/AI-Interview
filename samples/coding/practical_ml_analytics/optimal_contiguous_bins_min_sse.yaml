expected_concepts:
  - sorting, then partitioning into contiguous segments
  - dynamic programming over (number of bands, prefix length)
  - O(1) segment SSE from prefix sums of values and squared values
  - why greedy largest-gap cuts are not optimal
  - floating-point care when subtracting large sums
optimal_complexity: {time: "O(k * n^2) for the DP (O(k * n log n) with divide-and-conquer optimisation)", space: "O(n) with rolling DP rows"}
rubric:
  excellent: "Sorts, defines the DP state as the best cost of splitting the first i values into j bands, computes each band's SSE in O(1) from prefix sums (ideally as an exact integer numerator divided by the size), enforces exactly k non-empty bands, explains why greedy gap cuts fail and mentions faster optimisations."
  good: "Correct DP with prefix sums after a hint, or a correct DP that recomputes SSE per segment in O(n) and acknowledges the extra factor."
  weak: "Uses greedy largest-gap cuts or equal-width or equal-count bands, forgets to sort, allows empty bands, or tries every cut combination exponentially."
  criteria:
    correctness: "All tests pass, including k = 1, k = n, duplicates and the cases where greedy cuts lose."
    efficiency: "O(k * n^2) or better using O(1) segment costs; memory kept to O(n) or O(k * n)."
    code_quality: "Clear DP state definition, a small helper for segment cost, no magic indices."
    edge_cases: "Single value, all equal values, k equal to n and values at the 0 and 1000 bounds."
    communication: "States the recurrence, the base case and why the result is optimal."
hints:
  - Once the durations are sorted, every banding is just a choice of k - 1 cut positions. Think about the best cost of splitting only the first i durations into j bands.
  - The best cost for the first i durations in j bands is the minimum, over where the last band starts, of the best cost for the shorter prefix in j - 1 bands plus the SSE of that last band. To make each SSE cheap, keep running totals of the values and of their squares.
  - With prefix sums S and Q, the SSE of a band of m values with sum s and sum of squares q equals (m times q minus s squared) divided by m, which keeps the numerator an exact integer. Fill a table band count by band count, start with zero cost for zero values in zero bands, make sure every band is non-empty, and answer with the entry for all n values in k bands.
followups:
  - Why is it safe to only consider contiguous bands of the sorted values for this objective?
  - How does this relate to one-dimensional k-means and the Jenks natural breaks method?
  - How would you choose k itself from the data?
  - What optimisation brings the DP below O(k * n^2), and why does it apply here?
common_errors:
  - Cutting at the k - 1 largest gaps, which is not optimal when gaps grow gradually.
  - Forgetting to sort before banding.
  - Allowing empty bands or returning the cost for fewer than k bands.
  - Recomputing each band's mean and SSE from scratch inside the DP, adding an O(n) factor.
  - Computing q minus s squared over m in a way that loses precision, then comparing against zero.
