expected_concepts:
  - exponentially weighted moving average recurrence
  - seeding the series with the first sample
  - constant memory state carried between samples
  - effect of alpha on responsiveness versus smoothness
optimal_complexity: {time: O(n), space: O(1) extra besides the output}
rubric:
  excellent: Implements the recurrence in one pass seeded with the first sample, handles empty input, and explains how alpha trades responsiveness against noise (and that the weight of a sample k steps old is alpha times (1 - alpha) to the power k).
  good: Correct series with a small slip such as seeding with zero or applying alpha to the first value, fixed after running the tests.
  weak: Recomputes a weighted sum over all previous samples for every position, swaps alpha and 1 - alpha, or crashes on empty input.
  criteria:
    correctness: All tests pass, including a single sample, alpha 1 and tiny alpha.
    efficiency: One pass that keeps only the previous smoothed value.
    code_quality: The recurrence is written once with clear names; the first sample is handled explicitly.
    edge_cases: Empty input, single sample, constant series and spikes.
    communication: Explains how the choice of alpha changes how quickly alerts react to a real latency increase.
hints:
  - Each smoothed value depends only on the new sample and on the previous smoothed value, not on the whole history.
  - Handle the first sample separately because it has no previous smoothed value, then apply the formula to every later sample in order.
  - Return an empty list for empty input; otherwise start the output with the first sample and, for each later sample, append alpha times the sample plus one minus alpha times the last appended value.
followups:
  - Roughly how many recent samples dominate the average for alpha = 0.1, and why?
  - How would you raise an alert only when the smoothed latency stays above a threshold for five minutes?
  - How would you handle missing minutes where no sample arrived?
common_errors:
  - Seeding the series with zero, which drags the first values far below the real latency.
  - Swapping alpha and 1 - alpha so that old samples get the larger weight.
  - Using the raw previous sample instead of the previous smoothed value in the recurrence.
  - Recomputing the full weighted history for every position in O(n^2).
