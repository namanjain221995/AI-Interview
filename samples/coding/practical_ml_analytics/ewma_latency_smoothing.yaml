title: EWMA Smoothing of Request Latency
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, data_analyst, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## EWMA Smoothing of Request Latency

  An alerting service receives one p95 latency sample (in milliseconds) per minute for an API. Raw
  samples are noisy, so before comparing them with a threshold the service smooths them with an
  **exponentially weighted moving average** (EWMA). Recent samples count the most and older samples fade
  out gradually:

  - `s[0] = latencies[0]`
  - `s[i] = alpha * latencies[i] + (1 - alpha) * s[i - 1]` for `i >= 1`

  Given the samples in arrival order and the smoothing factor `alpha` (`0 < alpha <= 1`), return the
  smoothed series `s` with the same length as the input; an empty input returns `[]`. Answers are
  compared with a tolerance of `1e-6` (relative to the size of the value).

  ### Example 1
  ```
  Input:  latencies = [100.0, 120.0, 80.0, 200.0], alpha = 0.5
  Output: [100.0, 110.0, 95.0, 147.5]
  Explanation: 0.5 * 120 + 0.5 * 100 = 110; 0.5 * 80 + 0.5 * 110 = 95; 0.5 * 200 + 0.5 * 95 = 147.5
  ```

  ### Example 2
  ```
  Input:  latencies = [250.0, 260.0, 240.0], alpha = 1.0
  Output: [250.0, 260.0, 240.0]
  Explanation: with alpha = 1 only the newest sample counts, so nothing is smoothed
  ```

  ### Example 3
  ```
  Input:  latencies = [], alpha = 0.3
  Output: []
  ```

  ### Constraints
  - `0 <= latencies.length <= 10^5`
  - `0 <= latencies[i] <= 10^6`
  - `0 < alpha <= 1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: ewma_smooth
  params:
    - {name: latencies, type: "float[]"}
    - {name: alpha, type: float}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    def ewma_smooth(latencies: list[float], alpha: float) -> list[float]:
        smoothed: list[float] = []
        for i, value in enumerate(latencies):
            if i == 0:
                smoothed.append(value)
            else:
                smoothed.append(alpha * value + (1 - alpha) * smoothed[-1])
        return smoothed
  javascript: |
    function ewmaSmooth(latencies, alpha) {
      const smoothed = [];
      for (let i = 0; i < latencies.length; i++) {
        if (i === 0) smoothed.push(latencies[0]);
        else smoothed.push(alpha * latencies[i] + (1 - alpha) * smoothed[i - 1]);
      }
      return smoothed;
    }
