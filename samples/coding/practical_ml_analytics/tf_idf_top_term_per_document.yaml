slug: tf_idf_top_term_per_document
title: Most Distinctive Term per Release Note
difficulty: medium
competency_keys: [machine_learning, algorithms, data_structures]
role_tags: [llm, data_scientist, ml, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Most Distinctive Term per Release Note

  The release-notes search index shows one keyword next to each note. A word that appears in every
  note ("fixed", "the") is useless as a keyword; a word that is frequent in **this** note but rare in
  the others is ideal. Score words with TF-IDF and pick the best word for every note.

  **Tokenising.** Lowercase each document. A term is a maximal run of the letters `a-z`; every other
  character (digits, spaces, punctuation) only separates terms. So `"v2.1: Fixed SSO-login"` gives
  `v`, `fixed`, `sso`, `login`.

  **Scoring.** Let `N` be the number of documents (including empty ones). For a term `t` in document `d`:

  - `tf(t, d) = (occurrences of t in d) / (number of terms in d)`
  - `df(t)` = the number of documents that contain `t` at least once
  - `idf(t) = ln((1 + N) / (1 + df(t))) + 1` (natural logarithm)
  - `score(t, d) = tf(t, d) * idf(t)`

  For every document, in input order, return the term with the **highest** score. If several terms
  share the highest score, return the lexicographically smallest of them. If a document has no terms,
  return the empty string `""` for it.

  Use double-precision floating point. In the tests, two scores in the same document are either
  exactly equal (same occurrence count and same `df`) or differ clearly, so you do not need an
  epsilon.

  ### Example 1
  ```
  Input:  documents = ["Fixed login timeout on mobile", "Fixed crash in export. Export now faster", "Fixed typo"]
  Output: ["login", "export", "typo"]
  Explanation: "fixed" is in all 3 notes, so its idf is the minimum (1.0).
               Note 1: login, mobile, on and timeout tie and "login" is the smallest.
               Note 2: "export" appears twice. Note 3: "typo" beats "fixed".
  ```

  ### Example 2
  ```
  Input:  documents = ["Bump to v2.0.1", "", "SSO: sso sso"]
  Output: ["bump", "", "sso"]
  Explanation: note 1 has terms bump, to, v; all appear in one document so they tie
               and "bump" wins. Note 2 has no terms. Note 3 is three copies of "sso".
  ```

  ### Constraints
  - `0 <= documents.length <= 2000`
  - `0 <= documents[i].length <= 5000`, printable ASCII only
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: top_tfidf_terms
  params:
    - {name: documents, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    import math
    import re
    from collections import Counter

    TOKEN = re.compile(r"[a-z]+")


    def top_tfidf_terms(documents: list[str]) -> list[str]:
        token_lists = [TOKEN.findall(doc.lower()) for doc in documents]
        n = len(documents)
        document_frequency: Counter[str] = Counter()
        for tokens in token_lists:
            document_frequency.update(set(tokens))
        result: list[str] = []
        for tokens in token_lists:
            if not tokens:
                result.append("")
                continue
            counts = Counter(tokens)
            best_term = ""
            best_score = -1.0
            for term in sorted(counts):  # ascending, so only a strictly higher score replaces
                idf = math.log((1 + n) / (1 + document_frequency[term])) + 1
                score = counts[term] / len(tokens) * idf
                if score > best_score:
                    best_term, best_score = term, score
            result.append(best_term)
        return result
  javascript: |
    function topTfidfTerms(documents) {
      const tokenLists = documents.map((doc) => doc.toLowerCase().match(/[a-z]+/g) || []);
      const n = documents.length;
      const df = new Map();
      for (const tokens of tokenLists) {
        for (const term of new Set(tokens)) df.set(term, (df.get(term) || 0) + 1);
      }
      return tokenLists.map((tokens) => {
        if (tokens.length === 0) return "";
        const counts = new Map();
        for (const t of tokens) counts.set(t, (counts.get(t) || 0) + 1);
        let bestTerm = "";
        let bestScore = -1;
        for (const term of [...counts.keys()].sort()) {
          const idf = Math.log((1 + n) / (1 + df.get(term))) + 1;
          const score = (counts.get(term) / tokens.length) * idf;
          if (score > bestScore) {
            bestTerm = term;
            bestScore = score;
          }
        }
        return bestTerm;
      });
    }
