expected_concepts:
  - "term frequency normalised by document length"
  - "document frequency counted once per document"
  - "smoothed inverse document frequency"
  - "two passes: corpus statistics first, then per-document scoring"
  - "deterministic tie-breaking on the term"
optimal_complexity: {time: "O(T + U log U)", space: "O(V)"}
rubric:
  excellent: "Computes document frequency in a first pass with one count per document, scores each document's distinct terms with the exact formula, breaks ties by the smallest term, returns empty strings for empty documents and explains why common terms are suppressed."
  good: "Correct TF-IDF with a small slip fixed after a hint, such as counting df per occurrence or forgetting the tie-break."
  weak: "Uses raw counts without idf, counts df per occurrence, recomputes df for each document by rescanning the corpus, or crashes on empty documents."
  criteria:
    correctness: "All tests pass, including empty documents, documents without letters and ties."
    efficiency: "One pass to build document frequencies and one pass to score, instead of rescanning all documents for every term."
    code_quality: "Tokenisation, df counting and scoring are separate helpers or clearly separated blocks with named quantities."
    edge_cases: "No documents, documents with no terms, a single document, identical documents and a stop word that appears everywhere."
    communication: "Explains what tf and idf each reward and why the smoothing keeps the idf finite and positive."
hints:
  - "A term's score depends on two things: how often it appears in this document and in how many documents it appears at all. Which of these can be computed once for the whole corpus?"
  - "Make a first pass that counts, for each term, the number of documents containing it (count each document once, for example via a set of its terms). Then score the terms of each document separately."
  - "Tokenise every document, build the document-frequency map from the set of terms per document, then for each document count its terms, compute count divided by the document's term total times the smoothed idf with the natural log, and keep the best score, replacing it only on a strictly higher score while visiting terms in ascending order. Return the empty string when a document has no terms."
followups:
  - "How would you return the top three terms per document instead of one?"
  - "How would you update the scores incrementally when a new release note is added?"
  - "Why does the smoothing add one to both N and df, and what would happen without it?"
  - "How would you use these TF-IDF vectors to find the most similar earlier release note?"
common_errors:
  - "Counting document frequency once per occurrence instead of once per document."
  - "Using log base 10 or forgetting the plus one after the logarithm."
  - "Using raw counts instead of dividing by the number of terms in the document."
  - "Ignoring the tie-break or breaking ties by first occurrence."
  - "Returning nothing or crashing for a document with no letters."
