version: 1
slug: cosine_similarity_of_embeddings
title: Cosine Similarity of Two Embeddings
difficulty: easy
competency_keys: [machine_learning, algorithms]
role_tags: [ml, llm, data_scientist, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Cosine Similarity of Two Embeddings

  A semantic search service turns the user's query and each help-centre article into embedding vectors
  of the same length. To rank articles it needs the **cosine similarity** between the query vector `a`
  and an article vector `b`:

  - `dot(a, b) = a[0] * b[0] + a[1] * b[1] + ... + a[n-1] * b[n-1]`
  - `|a| = sqrt(dot(a, a))` and `|b| = sqrt(dot(b, b))`
  - `similarity = dot(a, b) / (|a| * |b|)`

  The result lies between `-1.0` (opposite directions) and `1.0` (same direction). A vector made only of
  zeros has no direction: if **either** vector has zero norm, return `0.0`. Answers are compared with a
  tolerance of `1e-6`.

  ### Example 1
  ```
  Input:  a = [1.0, 2.0, 3.0], b = [4.0, 5.0, 6.0]
  Output: 0.9746318461970762
  Explanation: dot = 32, |a| = sqrt(14), |b| = sqrt(77)
  ```

  ### Example 2
  ```
  Input:  a = [1.0, -2.0, 0.5], b = [-2.0, 4.0, -1.0]
  Output: -1.0
  Explanation: b = -2 * a, so the vectors point in opposite directions
  ```

  ### Example 3
  ```
  Input:  a = [0.0, 0.0, 0.0], b = [1.0, 2.0, 3.0]
  Output: 0.0
  ```

  ### Constraints
  - `1 <= a.length == b.length <= 4096`
  - `-10^4 <= a[i], b[i] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: cosine_similarity
  params:
    - {name: a, type: "float[]"}
    - {name: b, type: "float[]"}
  return_type: float
  comparison: float_tolerance
reference_solutions:
  python: |
    import math


    def cosine_similarity(a: list[float], b: list[float]) -> float:
        dot = 0.0
        norm_a = 0.0
        norm_b = 0.0
        for x, y in zip(a, b):
            dot += x * y
            norm_a += x * x
            norm_b += y * y
        if norm_a == 0.0 or norm_b == 0.0:
            return 0.0
        return dot / (math.sqrt(norm_a) * math.sqrt(norm_b))
  javascript: |
    function cosineSimilarity(a, b) {
      let dot = 0, normA = 0, normB = 0;
      for (let i = 0; i < a.length; i++) {
        dot += a[i] * b[i];
        normA += a[i] * a[i];
        normB += b[i] * b[i];
      }
      if (normA === 0 || normB === 0) return 0.0;
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }
