expected_concepts:
  - dot product and Euclidean norm
  - cosine similarity as angle between vectors
  - zero-norm guard
  - single pass accumulation
  - pre-normalising vectors for repeated comparisons
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Accumulates the dot product and both squared norms in one pass, guards zero norms exactly as specified, and explains that pre-normalised embeddings reduce cosine similarity to a dot product for fast retrieval.
  good: Correct result with separate passes or a helper per quantity; the zero-norm case is added after running the tests.
  weak: Divides by zero for zero vectors, forgets the square roots, or normalises only one of the two vectors.
  criteria:
    correctness: All tests pass, including zero vectors, orthogonal vectors, opposite vectors and tiny components.
    efficiency: Linear time and constant extra memory.
    code_quality: Clear accumulators for the dot product and the two norms; no copies of the vectors.
    edge_cases: Either or both vectors zero, a single dimension and very small values.
    communication: Explains why magnitude is ignored and how this is used to rank search results.
hints:
  - Cosine similarity compares directions, so it is built from one product of the two vectors and the length of each vector.
  - You can collect the dot product and both squared lengths in the same loop, then take square roots at the end; check for a zero length before dividing.
  - Loop once adding a[i] times b[i], a[i] squared and b[i] squared to three running totals; return 0.0 if either squared total is zero, otherwise divide the dot product by the product of the two square roots.
followups:
  - If you compare one query against a million stored embeddings, what would you precompute?
  - How do cosine similarity and Euclidean distance relate for unit-length vectors?
  - How would you find the top 10 most similar articles without scoring every article?
common_errors:
  - Dividing by zero when a vector is all zeros.
  - Forgetting the square root on the norms.
  - Treating a very small but non-zero norm as zero with an arbitrary threshold.
  - Normalising only one vector, which makes the result depend on the other vector's magnitude.
