title: Best Gini Split for a Churn Stump
difficulty: hard
competency_keys: [machine_learning, algorithms, problem_solving]
role_tags: [ml, data_scientist, data]
time_limit_minutes: 30
prompt_markdown: |
  ## Best Gini Split for a Churn Stump

  The growth team wants a one-question rule ("does the account have at most `t` active seats?") that best
  separates accounts that cancelled their subscription from those that stayed. Each account is a row of
  integer usage metrics, `features[r]` (every row has the same length `d`), and `labels[r]` is `1` if the
  account churned and `0` otherwise.

  A **split** `(f, t)` sends row `r` to the **left** side when `features[r][f] <= t` and to the **right**
  side otherwise. A split is **valid** only when `t` is one of the values that occur in column `f` and
  **both sides are non-empty**.

  For a side holding `n_s` rows of which `p_s` churned, its Gini impurity is
  `1 - (p_s / n_s)^2 - ((n_s - p_s) / n_s)^2`. The **cost** of a split is
  `n_left * Gini_left + n_right * Gini_right`. Return `[f, t]` for the valid split with the **lowest**
  cost. Costs must be compared **exactly** (they are rational numbers, and floating-point rounding can
  misorder splits whose costs are equal). Break ties by the **lower feature index**, then the **lower
  threshold**. Return `[-1, -1]` when no valid split exists.

  ### Example 1
  ```
  Input:  features = [[3, 9], [24, 2], [6, 7], [30, 1], [12, 5], [18, 6]], labels = [1, 0, 1, 0, 1, 0]
  Output: [0, 12]
  Explanation: seats <= 12 sends the three churned accounts left and the three retained ones right, so both sides are pure (cost 0)
  ```

  ### Example 2
  ```
  Input:  features = [[5, 2], [5, 2], [5, 2]], labels = [0, 1, 1]
  Output: [-1, -1]
  Explanation: every column holds a single value, so any threshold puts all rows on the left
  ```

  ### Constraints
  - `1 <= n <= 2000` rows, `1 <= d <= 20` features per row
  - `-10^9 <= features[r][f] <= 10^9`
  - `labels[r]` is `0` or `1`

  **Follow-up:** checking every threshold by rescanning the rows costs `O(d * n^2)`; reach
  `O(d * n log n)`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_gini_split
  params:
    - {name: features, type: "int[][]"}
    - {name: labels, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def best_gini_split(features: list[list[int]], labels: list[int]) -> list[int]:
        n = len(labels)
        total_pos = sum(labels)
        best = [-1, -1]
        best_num, best_den = 0, 0  # best cost / 2 == best_num / best_den
        for f in range(len(features[0])):
            order = sorted(range(n), key=lambda r: features[r][f])
            left_pos = 0
            for pos, r in enumerate(order):
                left_pos += labels[r]
                left_n = pos + 1
                # A threshold is only valid at the last row of a run of equal values and not at the maximum.
                if left_n == n or features[order[pos + 1]][f] == features[r][f]:
                    continue
                right_n = n - left_n
                right_pos = total_pos - left_pos
                # n_s * Gini_s = 2 * p_s * (n_s - p_s) / n_s, so cost / 2 = num / den
                num = left_pos * (left_n - left_pos) * right_n + right_pos * (right_n - right_pos) * left_n
                den = left_n * right_n
                if best[0] == -1 or num * best_den < best_num * den:
                    best, best_num, best_den = [f, features[r][f]], num, den
        return best
  javascript: |
    function bestGiniSplit(features, labels) {
      const n = labels.length;
      let best = [-1, -1];
      let bestNum = 0;
      let bestDen = 0;
      let totalPos = 0;
      for (const y of labels) totalPos += y;
      for (let f = 0; f < features[0].length; f++) {
        const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => features[a][f] - features[b][f]);
        let leftPos = 0;
        for (let pos = 0; pos < n; pos++) {
          const r = order[pos];
          leftPos += labels[r];
          const leftN = pos + 1;
          if (leftN === n || features[order[pos + 1]][f] === features[r][f]) continue;
          const rightN = n - leftN;
          const rightPos = totalPos - leftPos;
          // n_s * Gini_s = 2 * p_s * (n_s - p_s) / n_s, so cost / 2 = num / den (all values stay below 2^53)
          const num = leftPos * (leftN - leftPos) * rightN + rightPos * (rightN - rightPos) * leftN;
          const den = leftN * rightN;
          if (best[0] === -1 || num * bestDen < bestNum * den) {
            best = [f, features[r][f]];
            bestNum = num;
            bestDen = den;
          }
        }
      }
      return best;
    }
