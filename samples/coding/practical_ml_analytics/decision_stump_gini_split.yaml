expected_concepts:
  - "Gini impurity and the weighted cost of a binary split"
  - "sorting each feature and sweeping prefix label counts"
  - "only thresholds at the end of a run of equal values are distinct splits"
  - "exact rational comparison by cross-multiplication"
  - "deterministic tie-breaking on feature then threshold"
optimal_complexity: {time: "O(d * n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts each feature once and sweeps prefix churn counts, evaluates thresholds only after the last of equal values and never at the column maximum, simplifies n_s * Gini_s to 2 p (n - p) / n, compares costs exactly by cross-multiplication within 64-bit range, and applies the tie-break order."
  good: "Correct results with an O(d * n^2) rescan, or the sweep with a hint about duplicate values, exact comparison or tie-breaking."
  weak: "Compares floating-point Gini values, splits between equal values, allows an empty side, uses unweighted Gini or ignores the tie-break order."
  criteria:
    correctness: "All tests pass, including exact ties between features and thresholds, constant columns and single rows."
    efficiency: "O(d * n log n) with a sort and a prefix sweep per feature."
    code_quality: "Clear prefix counters and a single comparison function for costs."
    edge_cases: "No valid split, duplicate values, negative values, all labels equal and constant features."
    communication: "Explains why floating point can misorder equal costs and how the integer form avoids it."
hints:
  - "For a fixed feature, sorting the rows by that feature turns every threshold into a prefix of the sorted rows; only the churn count of that prefix matters."
  - "Sweep the sorted rows keeping the number of rows and churned rows on the left; a threshold is valid only after the last row of a run of equal values and never at the largest value. Write n_s * Gini_s as 2 * p_s * (n_s - p_s) / n_s so the cost is a sum of two fractions."
  - "Represent each cost as an integer numerator over the denominator n_left * n_right and compare two costs by cross-multiplying; scan features in increasing order and thresholds in increasing order, replacing the best only on a strictly smaller cost, and return [-1, -1] if nothing was valid."
followups:
  - "How would you extend this to grow a full decision tree, and when would you stop splitting?"
  - "How would entropy (information gain) change the chosen split on this data?"
  - "How would you handle a categorical feature such as the subscription plan?"
  - "With millions of rows, how would histogram binning speed up the search, and what does it cost in accuracy?"
common_errors:
  - "Comparing floating-point Gini values, which can break exact ties in the wrong direction."
  - "Evaluating a threshold between two equal values, which is not a real split."
  - "Allowing the threshold equal to the column maximum, which leaves the right side empty."
  - "Averaging the two Gini values without weighting them by side size."
  - "Replacing the best split on equal cost, which breaks the lower-feature, lower-threshold tie rule."
