999958], description: "Stress - 800 irregular readings with bursts and long gaps, 30 second window"}
expected_concepts:
  - time-based sliding window
  - two pointers over a sorted timestamp array
  - running sum with additions and removals
  - strict versus inclusive window boundary
  - handling bursts of equal timestamps by position
optimal_complexity: {time: O(n), space: O(1) extra besides the output}
rubric:
  excellent: Uses a left pointer and a running sum, advances the pointer while the oldest timestamp is at or below the cutoff, divides by the current window size, explains why each reading enters and leaves once (O(n)), and handles the strict boundary and equal timestamps correctly.
  good: Correct two-pointer or clear O(n log n) binary-search solution with one boundary slip fixed after running the tests.
  weak: Uses a fixed count of readings instead of time, includes later readings with the same timestamp, or recomputes each window from scratch without discussing the cost.
  criteria:
    correctness: All tests pass, including equal timestamps, readings exactly window_seconds old and long gaps.
    efficiency: Linear time with a running sum; each reading is added and removed at most once.
    code_quality: Clear names for the window start, running total and cutoff; the boundary rule appears in one place.
    edge_cases: Empty stream, single reading, window wider than the stream and gaps longer than the window.
    communication: Explains the boundary choice and the floating-point drift of long running sums.
hints:
  - Because timestamps never decrease, the set of readings inside the window behaves like a range of positions whose left edge only ever moves to the right.
  - Keep a running total of the readings currently inside the window; when you move to a new reading, add it and drop old readings from the left until the oldest one is recent enough.
  - Use a left index and a sum; for each i add readings[i], then while timestamps[left] is less than or equal to timestamps[i] minus window_seconds subtract readings[left] and advance left; the answer is the sum divided by i minus left plus one.
followups:
  - How would you compute a time-weighted average, where each reading counts for as long as it stayed current?
  - How would you emit one smoothed value per fixed 10-second bucket instead of per reading?
  - If readings could arrive slightly out of order, what would you change?
common_errors:
  - Treating the window as a fixed number of readings instead of a time span.
  - Using a non-strict boundary so a reading exactly window_seconds old is still counted.
  - Including later readings that share the current timestamp.
  - Resetting the running sum or re-scanning from the beginning for every reading.
