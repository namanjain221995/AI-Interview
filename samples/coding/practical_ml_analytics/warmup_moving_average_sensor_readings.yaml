slug: warmup_moving_average_sensor_readings
title: Time-Window Average of Irregular Sensor Readings
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [data, data_analyst, sre, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Time-Window Average of Irregular Sensor Readings

  A cold-storage warehouse streams temperature readings to a dashboard. Sensors report **irregularly**:
  sometimes several readings arrive in the same second, sometimes nothing arrives for minutes. The
  dashboard smooths the line with a **time-based** trailing window instead of a fixed number of readings,
  and it must show a value for every reading, including the first ones while the window is still
  warming up.

  Reading `i` was taken at `timestamps[i]` (whole seconds) with value `readings[i]`. Timestamps are in
  **non-decreasing** order. For each position `i`, the smoothed value is the mean of every
  `readings[j]` with

  - `j <= i` (the reading itself and earlier positions only, even if a later position has the same timestamp), and
  - `timestamps[j] > timestamps[i] - window_seconds` (strictly inside the last `window_seconds` seconds).

  Return the smoothed values as an array of the same length; an empty input returns `[]`. Answers are
  compared with a tolerance of `1e-6` (relative to the size of the value).

  ### Example 1
  ```
  Input:  timestamps = [0, 10, 25, 30, 70], readings = [20.0, 22.0, 24.0, 21.0, 30.0], window_seconds = 30
  Output: [20.0, 21.0, 22.0, 22.333333333333332, 30.0]
  Explanation: at t = 30 the window keeps timestamps above 0, so the reading at t = 0 drops out: (22 + 24 + 21) / 3;
  at t = 70 only the reading itself is inside the window
  ```

  ### Example 2
  ```
  Input:  timestamps = [5, 5, 5, 6], readings = [1.0, 2.0, 3.0, 10.0], window_seconds = 1
  Output: [1.0, 1.5, 2.0, 10.0]
  Explanation: equal timestamps are averaged up to the current position only; at t = 6 the readings at t = 5 are exactly
  one second old and therefore outside the window
  ```

  ### Example 3
  ```
  Input:  timestamps = [], readings = [], window_seconds = 60
  Output: []
  ```

  ### Constraints
  - `0 <= timestamps.length == readings.length <= 10^5`
  - `0 <= timestamps[i] <= 10^9` and `timestamps[i] <= timestamps[i + 1]`
  - `-10^4 <= readings[i] <= 10^4`
  - `1 <= window_seconds <= 10^9`

  **Follow-up:** recomputing each window from scratch is `O(n^2)` in the worst case; aim for `O(n)`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: time_window_average
  params:
    - {name: timestamps, type: "int[]"}
    - {name: readings, type: "float[]"}
    - {name: window_seconds, type: int}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    def time_window_average(timestamps: list[int], readings: list[float], window_seconds: int) -> list[float]:
        result: list[float] = []
        start = 0
        total = 0.0
        for i, value in enumerate(readings):
            total += value
            cutoff = timestamps[i] - window_seconds
            while timestamps[start] <= cutoff:
                total -= readings[start]
                start += 1
            result.append(total / (i - start + 1))
        return result
  javascript: |
    function timeWindowAverage(timestamps, readings, windowSeconds) {
      const result = [];
      let start = 0;
      let total = 0;
      for (let i = 0; i < readings.length; i++) {
        total += readings[i];
        const cutoff = timestamps[i] - windowSeconds;
        while (timestamps[start] <= cutoff) {
          total -= readings[start];
          start++;
        }
        result.push(total / (i - start + 1));
      }
      return result;
    }
