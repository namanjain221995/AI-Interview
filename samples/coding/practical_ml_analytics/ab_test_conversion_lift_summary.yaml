version: 1
slug: ab_test_conversion_lift_summary
title: A/B Test Conversion Lift Summary
difficulty: easy
competency_keys: [problem_solving, algorithms]
role_tags: [data_analyst, data_scientist, product_manager, business_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## A/B Test Conversion Lift Summary

  The growth team is testing a redesigned checkout page. Visitors are split between the current page
  (**control**) and the new one (**treatment**), and the experiment dashboard needs a one-line summary
  of how the two groups converted.

  Given the number of visitors and the number of conversions (completed checkouts) in each group,
  return a list of four numbers in this order:

  1. `control_rate` = `control_conversions / control_visitors`, or `0.0` when `control_visitors` is `0`.
  2. `treatment_rate` = `treatment_conversions / treatment_visitors`, or `0.0` when
     `treatment_visitors` is `0`.
  3. `absolute_lift_points` = `(treatment_rate - control_rate) * 100` — the difference in
     **percentage points**.
  4. `relative_lift_percent` = `(treatment_rate - control_rate) / control_rate * 100` — the change
     **relative to control**, in percent, or `0.0` when `control_rate` is `0`.

  Lifts are negative when the treatment converts worse. Answers are compared with a tolerance of
  `1e-6` (relative to the size of the value), so ordinary floating-point rounding is fine — but
  integer division is not.

  ### Example 1
  ```
  Input:  control_visitors = 1000, control_conversions = 50,
          treatment_visitors = 1000, treatment_conversions = 60
  Output: [0.05, 0.06, 1.0, 20.0]
  Explanation: 5% vs 6% is a lift of 1 percentage point, which is 20% more than control.
  ```

  ### Example 2
  ```
  Input:  control_visitors = 400, control_conversions = 20,
          treatment_visitors = 500, treatment_conversions = 20
  Output: [0.05, 0.04, -1.0, -20.0]
  Explanation: the treatment converts worse, so both lifts are negative.
  ```

  ### Example 3
  ```
  Input:  control_visitors = 0, control_conversions = 0,
          treatment_visitors = 250, treatment_conversions = 10
  Output: [0.0, 0.04, 4.0, 0.0]
  Explanation: control has no traffic yet, so its rate is 0.0 and the relative lift is reported as 0.0.
  ```

  ### Constraints
  - `0 <= control_conversions <= control_visitors <= 10^9`
  - `0 <= treatment_conversions <= treatment_visitors <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: conversion_lift
  params:
    - {name: control_visitors, type: int}
    - {name: control_conversions, type: int}
    - {name: treatment_visitors, type: int}
    - {name: treatment_conversions, type: int}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    def conversion_lift(control_visitors: int, control_conversions: int,
                        treatment_visitors: int, treatment_conversions: int) -> list[float]:
        def rate(conversions: int, visitors: int) -> float:
            return conversions / visitors if visitors > 0 else 0.0

        control_rate = rate(control_conversions, control_visitors)
        treatment_rate = rate(treatment_conversions, treatment_visitors)
        diff = treatment_rate - control_rate
        relative = diff / control_rate * 100 if control_rate > 0 else 0.0
        return [control_rate, treatment_rate, diff * 100, relative]
  javascript: |
    function conversionLift(controlVisitors, controlConversions, treatmentVisitors, treatmentConversions) {
      const rate = (conversions, visitors) => (visitors > 0 ? conversions / visitors : 0);
      const controlRate = rate(controlConversions, controlVisitors);
      const treatmentRate = rate(treatmentConversions, treatmentVisitors);
      const diff = treatmentRate - controlRate;
      const relative = controlRate > 0 ? (diff / controlRate) * 100 : 0;
      return [controlRate, treatmentRate, diff * 100, relative];
    }
tests:
  - {id: t1, args: [1000, 50, 1000, 60], expected: [0.05, 0.06, 1.0, 20.0], description: "Example 1 - positive lift with equal traffic"}
  - {id: t2, args: [400, 20, 500, 20], expected: [0.05, 0.04, -1.0, -20.0], description: "Example 2 - negative lift with unequal traffic (same conversion count, different rates)"}
  - {id: t3, args: [0, 0, 250, 10], expected: [0.0, 0.04, 4.0, 0.0], description: "Example 3 - control has no visitors: rate 0.0 and relative lift 0.0"}
  - {id: t4, hidden: true, args: [300, 30, 0, 0], expected: [0.1, 0.0, -10.0, -100.0], description: "Treatment has no visitors - treatment rate 0.0, lift is minus the whole control rate (-100% relative)"}
  - {id: t5, hidden: true, args: [500, 0, 500, 25], expected: [0.0, 0.05, 5.0, 0.0], description: "Control has visitors but zero conversions - relative lift must be 0.0, not a division by zero or infinity"}
  - {id: t6, hidden: true, args: [7, 3, 9, 4], expected: [0.4285714286, 0.4444444444, 1.5873015873, 3.7037037037], description: "Small groups with non-terminating rates - catches integer division (3 / 7 must not become 0)"}
  - {id: t7, hidden: true, args: [1200, 84, 800, 56], expected: [0.07, 0.07, 0.0, 0.0], description: "Identical rates with different traffic - both lifts are exactly zero"}
  - {id: t8, hidden: true, args: [1000000000, 123456789, 999999999, 987654321], expected: [0.123456789, 0.987654322, 86.4197532988, 700.00000809], description: "Maximum visitors and conversions - no overflow, large positive lift"}
  - {id: t9, hidden: true, args: [50, 50, 60, 30], expected: [1.0, 0.5, -50.0, -50.0], description: "Control converts 100 percent and treatment 50 percent - lift of -50 points and -50 percent"}
  - {id: t10, hidden: true, args: [0, 0, 0, 0], expected: [0.0, 0.0, 0.0, 0.0], description: "No traffic in either group - all four values are 0.0"}
expected_concepts:
  - floating-point (not integer) division
  - guarding divisions by zero with an explicit fallback
  - percentage points versus relative percent change
  - computing derived metrics from one shared difference
optimal_complexity: {time: O(1), space: O(1)}
rubric:
  excellent: Computes both rates with real division, guards every division by zero exactly as specified, keeps percentage points and relative percent clearly separate and can explain to a stakeholder why a 1-point lift can be a 20 percent lift.
  good: Correct values for the normal cases but needs a hint about one zero-visitor or zero-rate guard, or about integer division in a typed language.
  weak: Uses integer division, crashes or returns infinity when control has no conversions, or mixes up absolute and relative lift.
  criteria:
    correctness: All tests pass within tolerance, including empty groups and a control rate of zero.
    efficiency: Constant time and space; no loops are needed.
    code_quality: A small helper for the guarded rate and clearly named intermediate values.
    edge_cases: Zero visitors in either group, zero control conversions, equal rates and values near 10^9.
    communication: Explains the difference between percentage points and percent change in plain words.
hints:
  - Work out the two conversion rates first; every other number in the answer is built from their difference.
  - Two different divisions can hit a zero denominator (visitors and the control rate), and in typed languages dividing two integers silently drops the fraction.
  - Convert to floating point before dividing, return 0.0 for a group without visitors, multiply the rate difference by 100 for percentage points, and divide that difference by the control rate (only when it is positive) before multiplying by 100 for the relative lift.
followups:
  - How would you tell whether a 1-point lift on 1,000 visitors per group is statistically meaningful?
  - Why is the relative lift misleading when the control rate is very small?
  - How would you extend the summary to several treatment variants compared against one control?
common_errors:
  - Integer division in Java, Go or C++ that turns every rate below 100 percent into 0.
  - Dividing by a zero control rate and returning infinity or NaN instead of 0.0.
  - Reporting the relative lift as a fraction (0.2) instead of a percent (20.0).
  - Swapping the order of the subtraction so lifts have the wrong sign.
