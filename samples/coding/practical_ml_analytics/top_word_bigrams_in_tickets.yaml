prompt_markdown: |
  ## Most Common Phrases in Support Tickets

  The support team wants to know which two-word phrases come up most often in incoming tickets, so
  they can write help-center articles for the top issues. You are given the ticket texts `tickets` and
  an integer `k`.

  **Tokenising.** Convert each ticket to lowercase. A token is a maximal run of the characters `a-z`
  and `0-9`; every other character (spaces, punctuation, symbols) only separates tokens. For example
  `"Can't log-in (v2)!"` becomes `can`, `t`, `log`, `in`, `v2`.

  **Counting.** A bigram is a pair of consecutive tokens **within the same ticket**, written as the two
  tokens joined by a single space, e.g. `"log in"`. Count every occurrence; a ticket that contains the
  same bigram twice contributes two. Tokens from different tickets are never paired.

  Return the `k` most frequent bigrams, ordered by count descending; bigrams with equal counts are
  ordered by the bigram string ascending (plain character-code order, so a space sorts before digits
  and digits before letters). If fewer than `k` distinct bigrams exist, return all of them.

  ### Example 1
  ```
  Input:  tickets = ["Password reset email never arrived", "The password reset link expired. Password reset again?", "Reset email went to spam"], k = 3
  Output: ["password reset", "reset email", "email never"]
  Explanation: "password reset" appears 3 times; "reset email" twice;
               every other bigram once, and "again" is not followed by another token.
               Among the bigrams seen once, "email never" is alphabetically first.
  ```

  ### Example 2
  ```
  Input:  tickets = ["Can't log-in (v2)!", "LOG IN fails on v2", "log"], k = 2
  Output: ["log in", "can t"]
  Explanation: tokens of ticket 1 are can, t, log, in, v2; "log in" appears twice.
               The remaining bigrams appear once and "can t" sorts first.
  ```

  ### Constraints
  - `0 <= tickets.length <= 10^4`
  - `0 <= tickets[i].length <= 2000`, printable ASCII only
  - `0 <= k <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: top_bigrams
  params:
    - {name: tickets, type: "string[]"}
    - {name: k, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    import re
    from collections import Counter

    TOKEN = re.compile(r"[a-z0-9]+")


    def top_bigrams(tickets: list[str], k: int) -> list[str]:
        counts: Counter[str] = Counter()
        for ticket in tickets:
            tokens = TOKEN.findall(ticket.lower())
            for first, second in zip(tokens, tokens[1:]):
                counts[first + " " + second] += 1
        ranked = sorted(counts.items(), key=lambda item: (-item[1], item[0]))
        return [bigram for bigram, _ in ranked[:k]]
  javascript: |
    function topBigrams(tickets, k) {
      const counts = new Map();
      for (const ticket of tickets) {
        const tokens = ticket.toLowerCase().match(/[a-z0-9]+/g) || [];
        for (let i = 0; i + 1 < tokens.length; i++) {
          const bigram = tokens[i] + " " + tokens[i + 1];
          counts.set(bigram, (counts.get(bigram) || 0) + 1);
        }
      }
      const ranked = [...counts.entries()].sort((a, b) => {
        if (a[1] !== b[1]) return b[1] - a[1];
        return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0;
      });
      return ranked.slice(0, k).map((entry) => entry[0]);
    }
