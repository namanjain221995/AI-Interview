expected_concepts:
  - "tokenising with a character class instead of splitting on spaces"
  - "counting with a hash map keyed by the bigram"
  - "keeping pairs inside one document"
  - "sorting by count descending with a deterministic tie-break"
  - "top-k selection (full sort or a bounded heap)"
optimal_complexity: {time: "O(T + B log B)", space: "O(B)"}
rubric:
  excellent: "Tokenises with a character class, counts bigrams per ticket in a hash map, sorts by (count descending, bigram ascending), handles k larger than the result and discusses a size-k heap for large vocabularies."
  good: "Correct counts and ordering after a nudge on punctuation, case or the tie-break."
  weak: "Splits only on spaces, pairs tokens across tickets, ignores ties, or returns counts instead of the bigram strings."
  criteria:
    correctness: "All tests pass, including punctuation, case folding, empty tickets and ties."
    efficiency: "Linear pass over the text plus one sort of the distinct bigrams (or a heap of size k)."
    code_quality: "Tokenising, counting and ranking are separate, readable steps with a single sort key."
    edge_cases: "No tickets, single-token tickets, k of zero or larger than the number of bigrams, repeated tokens."
    communication: "Explains the tokenisation rule and why ticket boundaries must break pairs."
hints:
  - "Start by turning each ticket into a clean list of tokens; once you have that, a bigram is just a token and the one right after it."
  - "Count bigrams per ticket in a hash map keyed by the joined string, so pairs never cross from one ticket into the next, then rank the distinct bigrams."
  - "Lowercase each ticket and extract runs of letters and digits, add one to the map for every adjacent pair joined by a single space, then sort the map entries by count from high to low and, for equal counts, by the bigram text in ascending character order, and return the first k strings."
followups:
  - "How would you keep only the top k without sorting every distinct bigram?"
  - "How would you exclude stop words such as the or to from the phrases?"
  - "How would you compute this over millions of tickets split across machines?"
  - "How would you extend this to phrases of any length n?"
common_errors:
  - "Splitting only on spaces, so punctuation stays attached and log-in never matches log in."
  - "Pairing the last token of one ticket with the first token of the next."
  - "Forgetting to lowercase, so the same phrase is counted under several spellings."
  - "Sorting ties in an unspecified order, which makes the output nondeterministic."
  - "Failing when k is larger than the number of distinct bigrams."
