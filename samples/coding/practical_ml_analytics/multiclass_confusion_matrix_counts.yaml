  - {id: t2, args: [2, [], []], expected: [[0, 0], [0, 0]], description: "Example 2 - no tickets gives the zero matrix, not an empty list"}
  - {id: t3, args: [3, [0, 0, 0], [2, 2, 1]], expected: [[0, 1, 2], [0, 0, 0], [0, 0, 0]], description: "Example 3 - asymmetric counts reveal a transposed matrix"}
