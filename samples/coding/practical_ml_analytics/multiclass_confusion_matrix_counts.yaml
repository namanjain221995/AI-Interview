  - {id: t7, hidden: true, args: [3, [2, 1, 0, 2, 1], [0, 0, 0, 0, 0]], expected: [[1, 0, 0], [2, 0, 0], [2, 0, 0]], description: "Model predicts one queue for everything - only column 0 is filled"}
