version: 1
slug: multiclass_confusion_matrix_counts
title: Ticket Router Confusion Matrix
difficulty: easy
competency_keys: [machine_learning, data_structures, problem_solving]
role_tags: [ml, data_scientist, data_analyst, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Ticket Router Confusion Matrix

  A help desk uses a model to route incoming support tickets to one of `num_classes` queues, numbered
  `0` to `num_classes - 1` (for example billing, login problems, shipping). To see which queues the model
  mixes up, the team builds a **confusion matrix** from a labelled sample: ticket `i` truly belongs to
  queue `actual[i]` and the model sent it to queue `predicted[i]`.

  Return a `num_classes x num_classes` matrix `m` where `m[r][c]` is the number of tickets whose **true**
  queue is `r` (the row) and whose **predicted** queue is `c` (the column). Every queue gets a row and a
  column even if no ticket uses it; with no tickets, return the all-zero matrix.

  ### Example 1
  ```
  Input:  num_classes = 3, actual = [0, 1, 2, 2, 1, 0], predicted = [0, 2, 2, 1, 1, 0]
  Output: [[2, 0, 0], [0, 1, 1], [0, 1, 1]]
  Explanation: both queue-0 tickets are correct; one queue-1 ticket went to queue 2 and one queue-2 ticket went to queue 1
  ```

  ### Example 2
  ```
  Input:  num_classes = 2, actual = [], predicted = []
  Output: [[0, 0], [0, 0]]
  ```

  ### Example 3
  ```
  Input:  num_classes = 3, actual = [0, 0, 0], predicted = [2, 2, 1]
  Output: [[0, 1, 2], [0, 0, 0], [0, 0, 0]]
  Explanation: rows are true queues and columns are predicted queues, so all counts sit in row 0
  ```

  ### Constraints
  - `1 <= num_classes <= 100`
  - `0 <= actual.length == predicted.length <= 10^5`
  - `0 <= actual[i], predicted[i] < num_classes`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: confusion_matrix
  params:
    - {name: num_classes, type: int}
    - {name: actual, type: "int[]"}
    - {name: predicted, type: "int[]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def confusion_matrix(num_classes: int, actual: list[int], predicted: list[int]) -> list[list[int]]:
        matrix = [[0] * num_classes for _ in range(num_classes)]
        for truth, guess in zip(actual, predicted):
            matrix[truth][guess] += 1
        return matrix
  javascript: |
    function confusionMatrix(numClasses, actual, predicted) {
      const matrix = Array.from({ length: numClasses }, () => new Array(numClasses).fill(0));
      for (let i = 0; i < actual.length; i++) {
        matrix[actual[i]][predicted[i]] += 1;
      }
      return matrix;
    }
