expected_concepts:
  - confusion matrix layout (rows true, columns predicted)
  - 2D array initialisation without shared rows
  - counting with direct indexing
  - reading per-class errors from off-diagonal cells
optimal_complexity: {time: O(n + k^2), space: O(k^2)}
rubric:
  excellent: Allocates an independent k by k zero matrix, fills it in one pass with matrix[actual][predicted], keeps rows as true classes, and explains how to read per-queue precision and recall from columns and rows.
  good: Correct matrix with a small slip (such as transposed indices or a missing empty case) fixed after running the tests.
  weak: Transposes rows and columns, shares one row object across the matrix so every row changes together, or only returns rows for queues that appear.
  criteria:
    correctness: All tests pass, including unused queues, the empty sample and asymmetric mix-ups.
    efficiency: One pass over the tickets plus O(k^2) to build the matrix.
    code_quality: Matrix creation is clear and each row is a separate list; no nested search per ticket.
    edge_cases: num_classes 1, no tickets, queues that never appear and a model that always predicts one queue.
    communication: Explains what the diagonal and off-diagonal cells mean for the help desk.
hints:
  - Each ticket contributes exactly one count to one cell; which two values decide that cell?
  - Start from a square grid of zeros sized by the number of queues, so unused queues are still present, then add one for every ticket.
  - Create num_classes separate rows of num_classes zeros, then for each index i increment matrix at row actual[i] and column predicted[i]; be careful not to reuse one row object for every row.
followups:
  - How would you compute per-queue precision and recall from this matrix?
  - How would you normalise the rows so each shows percentages of the true queue?
  - If there were 50,000 possible labels, how would you store the matrix efficiently?
common_errors:
  - Swapping rows and columns so the matrix is transposed.
  - Creating the rows with a repeated reference (for example list multiplication of a list in Python or one shared array in JavaScript), so every row changes together.
  - Returning an empty list instead of a zero matrix when there are no tickets.
  - Sizing the matrix by the largest label seen instead of num_classes.
