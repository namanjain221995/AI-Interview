version: 1
slug: roc_auc_from_scores_with_ties
title: ROC AUC of a Fraud Model with Tied Scores
difficulty: medium
competency_keys: [machine_learning, algorithms, problem_solving]
role_tags: [ml, data_scientist, data_analyst]
time_limit_minutes: 25
prompt_markdown: |
  ## ROC AUC of a Fraud Model with Tied Scores

  The payments team retrains its fraud model every night and gates the release on its **ROC AUC**
  measured on a labelled holdout set of transactions. You are writing that metric for the release
  pipeline.

  `scores[i]` is the model's fraud score for transaction `i` (higher means more suspicious) and
  `labels[i]` is `1` if the transaction was really fraud (a *positive*) or `0` if it was legitimate
  (a *negative*).

  Define the AUC through pairs: consider every pair made of one positive and one negative
  transaction. The pair scores `1` if the positive has a **strictly higher** score than the
  negative, `0.5` if the two scores are **equal**, and `0` otherwise. The AUC is the average pair
  score over all `P * N` pairs, where `P` and `N` are the numbers of positives and negatives.

  Return `-1.0` when there are no positives or no negatives (the AUC is undefined). Scores are
  compared exactly as given: two scores tie only when they are the same number. Answers are compared
  with a tolerance of `1e-6`.

  The holdout set can hold `10^5` transactions, so checking every pair is too slow; aim for
  `O(n log n)`.

  ### Example 1
  ```
  Input:  scores = [0.9, 0.7, 0.4, 0.2], labels = [1, 0, 1, 0]
  Output: 0.75
  Explanation: the pairs (0.9 vs 0.7), (0.9 vs 0.2) and (0.4 vs 0.2) are ranked correctly and
  (0.4 vs 0.7) is not: 3 of 4 pairs.
  ```

  ### Example 2
  ```
  Input:  scores = [0.8, 0.5, 0.5, 0.1], labels = [1, 1, 0, 0]
  Output: 0.875
  Explanation: 0.8 beats both negatives (2 points); the positive 0.5 ties the negative 0.5 (0.5
  points) and beats 0.1 (1 point). 3.5 / 4 = 0.875.
  ```

  ### Example 3
  ```
  Input:  scores = [0.3, 0.6], labels = [1, 1]
  Output: -1.0
  Explanation: there are no negatives, so no pairs exist.
  ```

  ### Constraints
  - `0 <= scores.length == labels.length <= 10^5`
  - `-10^6 <= scores[i] <= 10^6`
  - `labels[i]` is `0` or `1`
  - `P * N` can reach `2.5 * 10^9`, which does not fit in a 32-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: roc_auc
  params:
    - {name: scores, type: "float[]"}
    - {name: labels, type: "int[]"}
  return_type: float
  comparison: float_tolerance
reference_solutions:
  python: |
    def roc_auc(scores: list[float], labels: list[int]) -> float:
        positives = sum(labels)
        negatives = len(labels) - positives
        if positives == 0 or negatives == 0:
            return -1.0
        pairs = sorted(zip(scores, labels))
        doubled = 0          # twice the sum of pair scores, kept as an exact integer
        negatives_below = 0  # negatives with a strictly lower score than the current group
        i = 0
        while i < len(pairs):
            j = i
            group_pos = group_neg = 0
            while j < len(pairs) and pairs[j][0] == pairs[i][0]:
                if pairs[j][1] == 1:
                    group_pos += 1
                else:
                    group_neg += 1
                j += 1
            doubled += 2 * group_pos * negatives_below + group_pos * group_neg
            negatives_below += group_neg
            i = j
        return doubled / (2 * positives * negatives)
  javascript: |
    function rocAuc(scores, labels) {
      const n = scores.length;
      let positives = 0;
      for (const label of labels) positives += label;
      const negatives = n - positives;
      if (positives === 0 || negatives === 0) return -1;
      const order = scores.map((_, i) => i).sort((a, b) => scores[a] - scores[b]);
      let doubled = 0;
      let negativesBelow = 0;
      let i = 0;
      while (i < n) {
        let j = i;
        let groupPos = 0;
        let groupNeg = 0;
        while (j < n && scores[order[j]] === scores[order[i]]) {
          if (labels[order[j]] === 1) groupPos++;
          else groupNeg++;
          j++;
        }
        doubled += 2 * groupPos * negativesBelow + groupPos * groupNeg;
        negativesBelow += groupNeg;
        i = j;
      }
      return doubled / (2 * positives * negatives);
    }
