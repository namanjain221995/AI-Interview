expected_concepts:
  - AUC as the probability that a random positive outranks a random negative
  - sorting by score and grouping equal scores
  - counting negatives below each positive with a running total
  - half credit for ties (average ranks / Mann-Whitney U)
  - 64-bit counts for P * N
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Explains the pairwise definition, sorts once and sweeps groups of equal scores while keeping a running count of lower negatives, gives tied pairs half credit, guards the undefined case and uses 64-bit or floating-point accumulation for P * N; can connect the result to the rank-sum (Mann-Whitney) formula.
  good: Correct O(n log n) sweep or rank-sum solution that needs a hint about tie groups or the undefined case; or a correct O(n^2) solution that is then improved with guidance.
  weak: Only an O(n^2) pair loop, ignores ties (counting them as 0 or 1), builds a trapezoid ROC curve incorrectly at tied thresholds, or divides by zero when one class is missing.
  criteria:
    correctness: All tests pass within tolerance, including all-tied scores, inverted models and missing classes.
    efficiency: One sort plus a linear sweep; no per-pair work.
    code_quality: Tie groups are processed explicitly and the counters have clear names.
    edge_cases: Empty input, one class only, every score tied and negative raw scores.
    communication: Explains what AUC means for the fraud team and why ties deserve half credit.
hints:
  - Instead of comparing every pair, think about how many negatives sit below each positive once the transactions are sorted by score.
  - Process equal scores together as one group, since positives and negatives inside the same group tie with each other and each such pair is worth half a point.
  - Sort by score, walk the groups of equal scores from lowest to highest keeping a running count of negatives already passed, add each group's positives times that count plus half of positives times negatives inside the group, then divide by the number of positive-negative pairs (returning -1.0 if either class is empty).
followups:
  - How is this related to the Mann-Whitney U statistic and average ranks?
  - Why can AUC look good while the model is useless at the fraud team's chosen alert threshold?
  - How would you compute a confidence interval for this AUC on a small holdout set?
  - How would you compute AUC over a stream of scores that does not fit in memory?
common_errors:
  - Ignoring ties, which inflates or deflates the AUC when many scores are rounded.
  - Comparing every pair in O(n^2), which is too slow for 10^5 transactions.
  - Overflowing a 32-bit integer when multiplying P by N.
  - Dividing by zero instead of returning -1.0 when one class is missing.
