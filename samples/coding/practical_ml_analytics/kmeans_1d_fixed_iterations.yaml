expected_concepts:
  - "Lloyd's algorithm: alternating assignment and update steps"
  - "simultaneous update using the centroids from the start of the round"
  - "deterministic tie-breaking by index"
  - "handling empty clusters"
  - "convergence check and iteration cap"
optimal_complexity: {time: "O(iterations * n * k)", space: "O(k)"}
rubric:
  excellent: "Implements assignment and update as separate phases per round, breaks ties toward the lower index, keeps empty centroids, stops early when nothing moves, preserves index order and discusses sorting the centroids to assign in O(log k) per point."
  good: "Correct Lloyd iterations after a hint about empty clusters, tie-breaking or updating centroids in place mid-round."
  weak: "Updates centroids while still assigning points, divides by zero for empty clusters, sorts the output, or ignores the iteration cap."
  criteria:
    correctness: "All tests pass, including ties, duplicate centroids, empty clusters and the iteration cap."
    efficiency: "O(n * k) per round with O(k) extra memory; a sorted-centroid binary search is a good follow-up."
    code_quality: "Assignment and update phases are clearly separated with per-centroid sums and counts."
    edge_cases: "Zero iterations, no points, duplicate initial centroids, unsorted centroids and negative values."
    communication: "Explains why the update must use the centroids from the start of the round and how convergence is detected."
hints:
  - "Each round has two separate phases: first decide which centroid every point belongs to, then recompute the centroids. Keep those phases apart."
  - "During assignment, compare distances with a strict less-than while scanning centroids in index order so ties stay with the lower index. For the update, accumulate a sum and a count per centroid and leave a centroid alone when its count is zero."
  - "Loop up to the iteration limit: for every point find the closest centroid by absolute distance, preferring the lower index on equal distance, and add the point to that centroid's sum and count. Build the new centroid list as sum divided by count, or the old value when the count is zero, and stop as soon as the new list equals the old one. Return the list without sorting it."
followups:
  - "How would you assign points in O(log k) each by sorting the centroids, and why are the Voronoi cells intervals in one dimension?"
  - "How would you choose the initial centroids automatically, for example with k-means++?"
  - "In one dimension the optimal clustering can be found exactly with dynamic programming; how would that work?"
  - "How would you choose k for the price tiers?"
common_errors:
  - "Moving a centroid as soon as a point is assigned, so later points in the same round see a different centroid."
  - "Dividing by zero when a centroid receives no points."
  - "Breaking distance ties toward the higher index or the last centroid seen."
  - "Sorting the centroids before returning them."
  - "Running all iterations without stopping early, or stopping after one round regardless of movement."
