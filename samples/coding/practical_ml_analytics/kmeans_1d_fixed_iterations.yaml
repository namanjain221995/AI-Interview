slug: kmeans_1d_fixed_iterations
title: 1-D k-Means for Price Tier Centroids
difficulty: medium
competency_keys: [machine_learning, algorithms]
role_tags: [data_scientist, ml, data_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## 1-D k-Means for Price Tier Centroids

  The pricing team wants to group order values into a few price tiers. They seed `k` tier centres by
  hand (`centroids`) and refine them with the standard k-means (Lloyd) procedure on the one-dimensional
  order values `points`.

  Repeat the following **round** at most `iterations` times:

  1. **Assign.** Using the centroids as they were at the start of the round, assign every point to the
     centroid with the smallest absolute distance `|point - centroid|`. If several centroids are equally
     close, choose the one with the **lowest index**.
  2. **Update.** Move every centroid to the mean of the points assigned to it. A centroid that received
     **no** points keeps its current value.
  3. **Stop early** if no centroid changed its value in this round.

  Return the final centroids **in their original index order** (do not sort them). With `iterations = 0`
  or no points, the initial centroids are returned unchanged.

  Answers are compared with a relative tolerance of `1e-6`. The tests never place a point within
  rounding distance of being equally close to two centroids, unless the distances are exactly equal
  (as in Example 2).

  ### Example 1
  ```
  Input:  points = [12.0, 15.0, 14.0, 40.0, 42.0, 39.0, 95.0, 100.0], centroids = [10.0, 50.0, 90.0], iterations = 10
  Output: [13.666666666666666, 40.333333333333336, 97.5]
  Explanation: round 1 assigns {12, 15, 14}, {40, 42, 39} and {95, 100}; the centroids move
               to their means. Round 2 assigns the same points, nothing moves, so the loop stops.
  ```

  ### Example 2
  ```
  Input:  points = [1.0, 3.0, 5.0, 7.0], centroids = [3.0, 7.0, 100.0], iterations = 5
  Output: [3.0, 7.0, 100.0]
  Explanation: in round 1 the point 5 is at distance 2 from both 3 and 7, so it joins centroid 0.
               Centroid 2 never receives a point and stays at 100.0.
  ```

  ### Constraints
  - `0 <= points.length <= 10^4`
  - `1 <= centroids.length <= 50`
  - `0 <= iterations <= 100`
  - `-10^6 <= points[i], centroids[j] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: kmeans_1d
  params:
    - {name: points, type: "float[]"}
    - {name: centroids, type: "float[]"}
    - {name: iterations, type: "int"}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    def kmeans_1d(points: list[float], centroids: list[float], iterations: int) -> list[float]:
        current = [float(c) for c in centroids]
        k = len(current)
        for _ in range(iterations):
            sums = [0.0] * k
            counts = [0] * k
            for p in points:
                best = 0
                for j in range(1, k):
                    if abs(p - current[j]) < abs(p - current[best]):  # strict: ties keep the lower index
                        best = j
                sums[best] += p
                counts[best] += 1
            updated = [sums[j] / counts[j] if counts[j] else current[j] for j in range(k)]
            if updated == current:
                break
            current = updated
        return current
  javascript: |
    function kmeans1d(points, centroids, iterations) {
      let current = centroids.slice();
      const k = current.length;
      for (let it = 0; it < iterations; it++) {
        const sums = new Array(k).fill(0);
        const counts = new Array(k).fill(0);
        for (const p of points) {
          let best = 0;
          for (let j = 1; j < k; j++) {
            if (Math.abs(p - current[j]) < Math.abs(p - current[best])) best = j;
          }
          sums[best] += p;
          counts[best] += 1;
        }
        const updated = current.map((c, j) => (counts[j] > 0 ? sums[j] / counts[j] : c));
        if (updated.every((c, j) => c === current[j])) break;
        current = updated;
      }
      return current;
    }
