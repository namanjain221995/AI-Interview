expected_concepts:
  - building a sorted vocabulary from distinct values
  - hash map from category to column index
  - one row per input in the original order
  - case-sensitive lexicographic ordering
optimal_complexity: {time: "O(n * k + d log d) where k is the vocabulary size and d the number of distinct values", space: O(n * k) for the output}
rubric:
  excellent: Builds the sorted distinct vocabulary once, maps each word to its index with a hash map, emits one row per input in order, and discusses why a fixed vocabulary must be saved and reused at prediction time.
  good: Correct output but looks positions up with a linear search in the vocabulary, or needs a hint about the sort order.
  weak: Orders the vocabulary by first appearance, sorts case-insensitively or numerically, or returns one row per distinct value instead of per input.
  criteria:
    correctness: All tests pass, including mixed case, punctuation and numeric-looking strings.
    efficiency: One sort of the distinct values and constant-time index lookups per input.
    code_quality: Separate, clearly named steps for the vocabulary, the index map and the rows.
    edge_cases: Empty input, a single distinct value and values that are prefixes of each other.
    communication: Explains how unseen categories at prediction time would be handled in a real pipeline.
hints:
  - Before you can write any row you need to know how many columns there are and which column belongs to which value.
  - Collect the distinct values, sort them with the default string comparison, and remember each value's position so you do not have to search for it.
  - Build the sorted list of distinct values, store a map from value to its index, then for every input value create a row of zeros as long as the vocabulary and set the entry at that value's index to one.
followups:
  - At prediction time a new device type appears that was not in the training vocabulary; what should the encoder do?
  - With 100,000 distinct values, why might you prefer a sparse representation or feature hashing?
  - Why do some pipelines drop one of the columns (dummy encoding) before a linear model?
common_errors:
  - Ordering the vocabulary by first appearance instead of sorting it.
  - Using a case-insensitive or locale-aware sort that changes the column order.
  - Sorting numeric-looking strings as numbers.
  - Emitting one row per distinct value instead of one row per input value.
