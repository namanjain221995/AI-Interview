version: 1
slug: one_hot_encode_category_column
title: One-Hot Encode a Category Column
difficulty: easy
competency_keys: [machine_learning, data_structures]
role_tags: [ml, data_scientist, data]
time_limit_minutes: 12
prompt_markdown: |
  ## One-Hot Encode a Category Column

  A churn model is trained on session logs, and one of its features is the device type of each
  session (`"desktop"`, `"tablet"`, ...). Models need numbers, so the feature pipeline one-hot encodes
  the column.

  Given the column as a list of strings `values`:

  1. Build the **vocabulary**: the distinct values sorted in ascending order by plain string
     comparison (character codes, so the comparison is case-sensitive and every uppercase letter
     sorts before every lowercase letter).
  2. For each input value, in input order, output a row with one entry per vocabulary word: `1` at
     the position of that value in the vocabulary and `0` everywhere else.

  Return the list of rows, or an empty list when `values` is empty.

  ### Example 1
  ```
  Input:  values = ["tablet", "desktop", "mobile", "desktop"]
  Output: [[0, 0, 1], [1, 0, 0], [0, 1, 0], [1, 0, 0]]
  Explanation: the vocabulary is ["desktop", "mobile", "tablet"].
  ```

  ### Example 2
  ```
  Input:  values = ["tv", "TV", "tv"]
  Output: [[0, 1], [1, 0], [0, 1]]
  Explanation: "TV" and "tv" are different values and "TV" sorts first.
  ```

  ### Example 3
  ```
  Input:  values = []
  Output: []
  ```

  ### Constraints
  - `0 <= values.length <= 10^4`
  - The number of distinct values is at most `100`.
  - Each value has 1 to 20 printable ASCII characters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: one_hot_encode
  params:
    - {name: values, type: "string[]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def one_hot_encode(values: list[str]) -> list[list[int]]:
        vocabulary = sorted(set(values))
        position = {word: i for i, word in enumerate(vocabulary)}
        rows = []
        for value in values:
            row = [0] * len(vocabulary)
            row[position[value]] = 1
            rows.append(row)
        return rows
  javascript: |
    function oneHotEncode(values) {
      const vocabulary = [...new Set(values)].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      const position = new Map(vocabulary.map((word, i) => [word, i]));
      return values.map((value) => {
        const row = new Array(vocabulary.length).fill(0);
        row[position.get(value)] = 1;
        return row;
      });
    }
