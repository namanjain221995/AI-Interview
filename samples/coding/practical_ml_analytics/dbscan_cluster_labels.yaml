reference_solutions:
  python: |
    def dbscan(points: list[list[int]], eps: int, min_points: int) -> list[int]:
        n = len(points)
        limit = eps * eps
        neighbours: list[list[int]] = []
        for i in range(n):
            xi, yi = points[i]
            row = []
            for j in range(n):
                dx = points[j][0] - xi
                dy = points[j][1] - yi
                if dx * dx + dy * dy <= limit:
                    row.append(j)
            neighbours.append(row)
        core = [len(row) >= min_points for row in neighbours]
        labels = [-1] * n
        cluster = 0
        for start in range(n):
            if labels[start] != -1 or not core[start]:
                continue
            labels[start] = cluster
            stack = [start]
            while stack:
                p = stack.pop()
                for q in neighbours[p]:
                    if labels[q] == -1:
                        labels[q] = cluster
                        if core[q]:
                            stack.append(q)
            cluster += 1
        return labels
  javascript: |
    function dbscan(points, eps, minPoints) {
      const n = points.length;
      const limit = eps * eps;
      const neighbours = [];
      for (let i = 0; i < n; i++) {
        const row = [];
        for (let j = 0; j < n; j++) {
          const dx = points[j][0] - points[i][0];
          const dy = points[j][1] - points[i][1];
          if (dx * dx + dy * dy <= limit) row.push(j);
        }
        neighbours.push(row);
      }
      const core = neighbours.map((row) => row.length >= minPoints);
      const labels = new Array(n).fill(-1);
      let cluster = 0;
      for (let start = 0; start < n; start++) {
        if (labels[start] !== -1 || !core[start]) continue;
        labels[start] = cluster;
        const stack = [start];
        while (stack.length > 0) {
          const p = stack.pop();
          for (const q of neighbours[p]) {
            if (labels[q] === -1) {
              labels[q] = cluster;
              if (core[q]) stack.push(q);
            }
          }
        }
        cluster++;
      }
      return labels;
    }
