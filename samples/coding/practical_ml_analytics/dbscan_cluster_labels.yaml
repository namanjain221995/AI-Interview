expected_concepts:
  - neighbourhood query with an inclusive squared-distance test (no square roots)
  - core versus border versus noise points
  - graph traversal (BFS or DFS) that only expands from core points
  - deterministic cluster numbering by scan order
  - 64-bit arithmetic for squared distances
optimal_complexity: {time: "O(n^2) for the neighbour search (near O(n) per query with a spatial grid)", space: "O(n^2) worst case for stored neighbour lists, O(n) if recomputed"}
rubric:
  excellent: "Precomputes or queries neighbourhoods with an integer squared-distance test, marks core points, grows clusters with an explicit stack or queue that only expands through core points, numbers clusters by scan order, explains why border points keep their first cluster and discusses grid indexing for large inputs."
  good: "Correct clustering after a hint about border points expanding the cluster or about overflow, with an O(n^2) neighbour search and a clear traversal."
  weak: "Expands through border points (merging clusters that should stay apart), forgets that a point counts as its own neighbour, relabels border points with a later cluster, or uses 32-bit squared distances."
  criteria:
    correctness: "All tests pass, including shared border points, eps of 0, min_points larger than n and extreme coordinates."
    efficiency: "Neighbour lists computed once (O(n^2)); traversal visits each point a bounded number of times; mentions spatial grids or KD-trees."
    code_quality: "Separates neighbour search, core detection and cluster growth; uses an explicit stack or queue rather than deep recursion."
    edge_cases: "Empty input, single point, duplicates, inclusive distance boundary and 64-bit squared distances."
    communication: "Explains core, border and noise points and why the scan order makes labels deterministic."
hints:
  - Split the work into three steps - find every store's neighbours, decide which stores are core, then grow clusters from core stores in index order.
  - Growing a cluster is a graph traversal where edges connect neighbours, but you only continue the traversal from core stores. A store that already has a cluster is never relabelled, which is what makes a shared border store keep the first cluster.
  - Compare squared distances with eps squared using 64-bit integers. Keep a label list initialised to -1, and for each unlabelled core store in index order assign the next cluster id, push it on a stack, and while the stack is not empty pop a store and give every unlabelled neighbour the same id, pushing that neighbour only if it is core.
followups:
  - How would you choose eps and min_points for real store data, and what does a k-distance plot tell you?
  - What changes if the points are latitude and longitude instead of metres on a grid?
  - How would you make the neighbour search fast for a million stores?
  - Why can DBSCAN's border-point assignment depend on input order, and does that matter in practice?
common_errors:
  - Expanding the cluster from border points, which chains separate clusters together.
  - Not counting the store itself as a neighbour, which shifts every core decision by one.
  - Using a strict less-than comparison, which drops stores exactly eps away.
  - Computing squared distances in 32-bit integers, which overflows for coordinates near 10^6.
  - Letting a later cluster overwrite the label of a border store that already has one.
