version: 1
slug: sql_experiment_variant_conversions
title: "Experiment Variant Conversions (SQL)"
difficulty: easy
competency_keys: [sql, databases]
role_tags: [data_analyst, data, backend, business_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## Experiment Variant Conversions

  The product analytics team runs a pricing-page experiment. Every participating user is assigned to
  exactly one variant, and the shop records every purchase.

  Table `experiment_assignments`:

  | column | type | notes |
  |--------|------|-------|
  | user_id | INTEGER | primary key - each user is assigned once |
  | variant | VARCHAR(20) | variant name (lowercase letters only) |

  Table `purchases`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | user_id | INTEGER | the buyer; **NULL for guest checkouts**; may belong to a user who is not in the experiment |
  | amount | INTEGER | order value in cents (can be 0 for a fully discounted order) |

  For **every variant** that has at least one assigned user, return:

  - `variant`
  - `assigned_users` — how many users are assigned to the variant
  - `converted_users` — how many **distinct** assigned users of that variant have **at least one**
    purchase (any amount); `0` when nobody in the variant bought anything

  Purchases by guests or by users who are not in the experiment are ignored. A user who buys several
  times counts once. Order the result by `variant` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  experiment_assignments      purchases
  +---------+----------+      +----+---------+--------+
  | user_id | variant  |      | id | user_id | amount |
  +---------+----------+      +----+---------+--------+
  | 1       | control  |      | 1  | 1       | 40     |
  | 2       | control  |      | 2  | 1       | 25     |
  | 3       | control  |      | 3  | 4       | 60     |
  | 4       | redesign |      | 4  | 5       | 15     |
  | 5       | redesign |      | 5  | 9       | 80     |
  | 6       | onepage  |      | 6  | 5       | 30     |
  +---------+----------+      +----+---------+--------+

  Output
  +----------+----------------+-----------------+
  | variant  | assigned_users | converted_users |
  +----------+----------------+-----------------+
  | control  | 3              | 1               |
  | onepage  | 1              | 0               |
  | redesign | 2              | 2               |
  +----------+----------------+-----------------+
  User 1 bought twice but counts once; user 9 is not in the experiment; nobody in onepage bought.
  ```

  ### Example 2
  ```
  experiment_assignments      purchases
  +---------+-----------+     +----+---------+--------+
  | user_id | variant   |     | id | user_id | amount |
  +---------+-----------+     +----+---------+--------+
  | 10      | control   |     | 1  | NULL    | 99     |
  | 11      | treatment |     | 2  | 11      | 20     |
  +---------+-----------+     | 3  | NULL    | 5      |
                              +----+---------+--------+

  Output
  +-----------+----------------+-----------------+
  | variant   | assigned_users | converted_users |
  +-----------+----------------+-----------------+
  | control   | 1              | 0               |
  | treatment | 1              | 1               |
  +-----------+----------------+-----------------+
  Guest purchases (user_id NULL) belong to nobody in the experiment.
  ```

  ### Constraints
  - `0 <= rows in each table <= 10^5`
  - `0 <= amount <= 10^7`
languages: [sql]
starter_code:
  sql: |
    -- Return variant, assigned_users and converted_users for every variant, ordered by variant.
    SELECT variant, COUNT(*) AS assigned_users, 0 AS converted_users
    FROM experiment_assignments
    GROUP BY variant
    ORDER BY variant;
reference_solutions:
  sql: |
    SELECT a.variant,
           COUNT(*) AS assigned_users,
           COUNT(b.user_id) AS converted_users
    FROM experiment_assignments a
    LEFT JOIN (
      SELECT DISTINCT user_id
      FROM purchases
      WHERE user_id IS NOT NULL
    ) b ON b.user_id = a.user_id
    GROUP BY a.variant
    ORDER BY a.variant;
sql_setup: |
  CREATE TABLE experiment_assignments (
    user_id INTEGER PRIMARY KEY,
    variant VARCHAR(20) NOT NULL
  );
  CREATE TABLE purchases (
    id INTEGER PRIMARY KEY,
    user_id INTEGER,
    amount INTEGER NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - repeat buyers counted once, unassigned buyer ignored, variant with no buyers shows 0"
    ordered: true
    setup_sql: |
      INSERT INTO experiment_assignments (user_id, variant) VALUES (1, 'control'), (2, 'control'), (3, 'control'), (4, 'redesign'), (5, 'redesign'), (6, 'onepage');
      INSERT INTO purchases (id, user_id, amount) VALUES (1, 1, 40), (2, 1, 25), (3, 4, 60), (4, 5, 15), (5, 9, 80), (6, 5, 30);
    expected_rows: [["control", 3, 1], ["onepage", 1, 0], ["redesign", 2, 2]]
  - id: t2
    description: "Example 2 - guest purchases with NULL user_id are ignored"
    ordered: true
    setup_sql: |
      INSERT INTO experiment_assignments (user_id, variant) VALUES (10, 'control'), (11, 'treatment');
      INSERT INTO purchases (id, user_id, amount) VALUES (1, NULL, 99), (2, 11, 20), (3, NULL, 5);
    expected_rows: [["control", 1, 0], ["treatment", 1, 1]]
  - id: t3
    hidden: true
    description: "Empty tables return no rows"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Assignments but no purchases at all - every variant reports 0 converted users (LEFT JOIN needed)"
    ordered: true
    setup_sql: |
      INSERT INTO experiment_assignments (user_id, variant) VALUES (1, 'control'), (2, 'beta'), (3, 'beta');
    expected_rows: [["beta", 2, 0], ["control", 1, 0]]
  - id: t5
    hidden: true
    description: "Purchases only by unassigned users - no variant rows exist"
    ordered: true
    setup_sql: |
      INSERT INTO purchases (id, user_id, amount) VALUES (1, 7, 10), (2, 8, 20);
    expected_rows: []
  - id: t6
    hidden: true
    description: "One user with many purchases - COUNT of joined rows would inflate both assigned and converted counts"
    ordered: true
    setup_sql: |
      INSERT INTO experiment_assignments (user_id, variant) VALUES (1, 'alpha'), (2, 'alpha'), (3, 'beta');
      INSERT INTO purchases (id, user_id, amount) VALUES (1, 1, 5), (2, 1, 6), (3, 1, 7), (4, 1, 8), (5, 3, 9), (6, 3, 10);
    expected_rows: [["alpha", 2, 1], ["beta", 1, 1]]
  - id: t7
    hidden: true
    description: "Every assigned user converted, including zero-amount purchases (any purchase row counts)"
    ordered: true
    setup_sql: |
      INSERT INTO experiment_assignments (user_id, variant) VALUES (1, 'control'), (2, 'control'), (3, 'promo');
      INSERT INTO purchases (id, user_id, amount) VALUES (1, 1, 0), (2, 2, 15), (3, 3, 30), (4, 3, 30);
    expected_rows: [["control", 2, 2], ["promo", 1, 1]]
  - id: t8
    hidden: true
    description: "Variant names sort alphabetically, not by insertion order or size"
    ordered: true
    setup_sql: |
      INSERT INTO experiment_assignments (user_id, variant) VALUES (1, 'zeta'), (2, 'alpha'), (3, 'mid'), (4, 'zeta'), (5, 'alpha');
      INSERT INTO purchases (id, user_id, amount) VALUES (1, 4, 10), (2, 3, 10);
    expected_rows: [["alpha", 2, 0], ["mid", 1, 1], ["zeta", 2, 1]]
  - id: t9
    hidden: true
