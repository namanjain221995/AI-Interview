expected_concepts:
  - LEFT JOIN so that variants without buyers still appear
  - de-duplicating purchases per user before or while counting (COUNT DISTINCT)
  - avoiding row multiplication from one-to-many joins
  - ignoring NULL foreign keys and rows outside the experiment
optimal_complexity: {time: "O(a + p) with hashing, or O((a + p) log p) with an index on purchases.user_id", space: "O(a + p)"}
rubric:
  excellent: Joins assignments to a de-duplicated set of buyers (or uses COUNT DISTINCT on both sides), keeps variants without buyers through a LEFT JOIN, ignores guest and outside purchases naturally and explains how the one-to-many join would inflate counts.
  good: Correct query after a hint about repeat buyers inflating the counts or variants with zero conversions disappearing.
  weak: Uses an inner join that drops variants without buyers, counts purchases instead of users, or counts COUNT(*) after the join so assigned_users is inflated.
  criteria:
    correctness: All tests pass, including repeat buyers, guest purchases, unassigned buyers and variants with no buyers.
    efficiency: Set-based query; mentions an index on purchases.user_id for large tables.
    code_quality: Clear aliases, explicit output column names and an ORDER BY on variant.
    edge_cases: Empty tables, no purchases at all, only outside purchases and zero-amount orders.
    communication: Explains why join fan-out changes COUNT results and how DISTINCT or a pre-aggregated subquery fixes it.
hints:
  - Start from the assignments table, since every variant with assigned users must appear even if nobody in it bought anything.
  - Joining each user to all of their purchases repeats that user once per purchase, which inflates any plain row count; decide how to make each buyer appear only once.
  - LEFT JOIN the assignments to the set of distinct non-NULL buyer ids from purchases, group by variant, count all rows for assigned users and count only the matched buyer ids for converted users, then order by variant (counting distinct user ids on both sides also works).
followups:
  - How would you add the conversion rate per variant without integer division in PostgreSQL?
  - How would you count only purchases made after the user was assigned if assignments had a timestamp?
  - What index would you add to keep this fast with millions of purchases?
common_errors:
  - Using an inner join, which removes variants where nobody purchased.
  - Counting purchase rows instead of distinct users, so repeat buyers are counted several times.
  - COUNT(*) after joining to purchases, which inflates assigned_users for every repeat purchase.
  - Starting from purchases and losing assigned users who never bought.
