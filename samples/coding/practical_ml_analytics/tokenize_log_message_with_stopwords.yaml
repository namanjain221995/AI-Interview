  - {id: t2, args: ["Job 42 retried; RETRY limit=3 hit, retry_count=3", ["Hit"]], expected: ["job", "retried", "retry", "limit", "retry", "count"], description: "Example 2 - duplicates kept, underscore splits, upper-case stopword"}
