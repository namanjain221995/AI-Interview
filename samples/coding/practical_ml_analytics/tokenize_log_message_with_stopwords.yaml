slug: tokenize_log_message_with_stopwords
title: Tokenise a Log Message for Indexing
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [backend, sre, data, llm]
time_limit_minutes: 12
prompt_markdown: |
  ## Tokenise a Log Message for Indexing

  A log search service indexes every log message as a list of terms so that engineers can search for
  words such as `timeout` or `db`. Given one ASCII log message and a list of stopwords, produce its index
  terms:

  1. Lowercase the message.
  2. Split it into **tokens**: maximal runs of the characters `a-z` and `0-9`. Every other character
     (spaces, punctuation, underscores, tabs, symbols) only separates tokens.
  3. Drop every token that equals a stopword. Stopwords are compared **case-insensitively** (the list
     may contain upper-case letters).
  4. Drop every token made **only of digits** (request ids, counters, ports); tokens that mix letters and
     digits, such as `v2` or `x86`, are kept.

  Return the remaining tokens in their original order, **keeping duplicates**. Return `[]` when nothing
  remains.

  ### Example 1
  ```
  Input:  message = "ERROR: Connection to db-01 timed out after 3000 ms", stopwords = ["to", "after", "the"]
  Output: ["error", "connection", "db", "timed", "out", "ms"]
  Explanation: "to" and "after" are stopwords; "01" and "3000" are digits only
  ```

  ### Example 2
  ```
  Input:  message = "Job 42 retried; RETRY limit=3 hit, retry_count=3", stopwords = ["Hit"]
  Output: ["job", "retried", "retry", "limit", "retry", "count"]
  Explanation: the underscore splits retry_count, and the stopword Hit removes hit
  ```

  ### Example 3
  ```
  Input:  message = "  ...  ", stopwords = []
  Output: []
  ```

  ### Constraints
  - `0 <= message.length <= 10^5`, printable ASCII plus tab characters
  - `0 <= stopwords.length <= 1000`; each stopword is 1-20 ASCII letters or digits
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: tokenize_message
  params:
    - {name: message, type: string}
    - {name: stopwords, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def tokenize_message(message: str, stopwords: list[str]) -> list[str]:
        stop = {word.lower() for word in stopwords}
        tokens: list[str] = []
        current: list[str] = []
        for ch in message.lower() + " ":
            if ("a" <= ch <= "z") or ("0" <= ch <= "9"):
                current.append(ch)
            elif current:
                token = "".join(current)
                current = []
                if token not in stop and not token.isdigit():
                    tokens.append(token)
        return tokens
  javascript: |
    function tokenizeMessage(message, stopwords) {
      const stop = new Set(stopwords.map((w) => w.toLowerCase()));
      const tokens = message.toLowerCase().match(/[a-z0-9]+/g) || [];
      return tokens.filter((t) => !stop.has(t) && !/^[0-9]+$/.test(t));
    }
