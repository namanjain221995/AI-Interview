expected_concepts:
  - character-class tokenisation
  - set lookup for stopwords
  - case normalisation of both message and stopwords
  - filtering numeric-only tokens
  - flushing the last token at the end of the input
optimal_complexity: {time: O(m + s) for message length m and total stopword length s, space: O(m + s)}
rubric:
  excellent: Lowercases the message and the stopwords, scans once (or uses a regex) to extract maximal alphanumeric runs, flushes the final token, filters with a set and a digits-only check, and explains why the set beats scanning the stopword list per token.
  good: Correct tokens with a small slip such as forgetting to lowercase the stopwords or to flush the last token, fixed after running the tests.
  weak: Splits only on spaces so punctuation stays inside tokens, removes duplicates, compares stopwords case-sensitively, or drops tokens such as v2 that contain digits.
  criteria:
    correctness: All tests pass, including tabs, underscores, URL-like messages and mixed letter-digit tokens.
    efficiency: One pass over the message with constant-time stopword lookups.
    code_quality: Tokenising and filtering are separate, readable steps; the character rule is stated once.
    edge_cases: Empty message, separators only, every token a stopword and numeric stopwords.
    communication: Explains the tokenisation rule and why numeric ids are excluded from the index.
hints:
  - Separate the job into two steps - first cut the message into candidate tokens, then decide which tokens to keep.
  - A token ends at any character that is not a lowercase letter or a digit, so you can build tokens character by character (or use a pattern that matches runs of those characters); keep the stopwords in a lowercased set.
  - Lowercase the message, collect every maximal run of a-z and 0-9 (remember the run that ends at the end of the string), lowercase the stopwords into a set, and keep a token only if it is not in the set and contains at least one letter.
followups:
  - How would you tokenise identifiers like camelCase or snake_case into separate words for search?
  - How would you support non-ASCII messages correctly?
  - How would you build an inverted index from these tokens for many messages?
common_errors:
  - Splitting only on spaces, so tokens like db-01 or retry_count stay whole.
  - Forgetting to emit the final token when the message does not end with a separator.
  - Comparing stopwords case-sensitively.
  - Dropping every token that contains a digit instead of only digits-only tokens.
  - De-duplicating the output.
