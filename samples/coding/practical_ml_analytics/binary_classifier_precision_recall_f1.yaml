expected_concepts:
  - confusion counts (TP, FP, FN) for the positive class
  - precision versus recall trade-off
  - F1 as the harmonic mean
  - guarding against division by zero
  - single pass over parallel arrays
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Counts TP, FP and FN in one pass, applies each zero-denominator rule explicitly, and explains when precision or recall matters more for a spam filter (blocking real mail versus letting spam through).
  good: Correct metrics with one division-by-zero case fixed after running the tests; can define precision and recall correctly.
  weak: Swaps precision and recall, counts true negatives into the formulas, crashes on empty or all-negative input, or computes F1 as an arithmetic mean.
  criteria:
    correctness: All tests pass, including empty input, only false positives and only false negatives.
    efficiency: One linear pass with constant extra memory.
    code_quality: Named counters (tp, fp, fn) and each formula guarded once, not duplicated.
    edge_cases: Empty arrays, no predicted positives, no actual positives and all predictions wrong.
    communication: Explains what each metric means for users of a spam filter and why F1 uses the harmonic mean.
hints:
  - Every message falls into exactly one of four buckets depending on its label and its prediction; which of those buckets do the three formulas actually need?
  - Count true positives, false positives and false negatives in one pass, then compute each metric from those counts while checking each denominator before dividing.
  - Walk both arrays together incrementing tp, fp or fn; set precision to tp over tp plus fp only when that sum is positive (else zero), do the same for recall with tp plus fn, and compute f1 from them only when their sum is positive.
followups:
  - How would you extend this to macro- and micro-averaged F1 for more than two classes?
  - If the filter produced a spam probability instead of 0 or 1, how would you choose the decision threshold?
  - Why can accuracy be misleading when only a small share of messages is spam?
common_errors:
  - Swapping the definitions of precision and recall.
  - Dividing by zero when there are no predicted or no actual spam messages.
  - Using integer division in a language where it truncates the result.
  - Averaging precision and recall arithmetically instead of using the harmonic mean.
