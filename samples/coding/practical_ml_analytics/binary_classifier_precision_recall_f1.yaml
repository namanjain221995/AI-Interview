title: Spam Filter Precision, Recall and F1
difficulty: easy
competency_keys: [machine_learning, algorithms, problem_solving]
role_tags: [ml, data_scientist, data_analyst, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Spam Filter Precision, Recall and F1

  The mail team is evaluating a new spam filter. For a sample of messages, moderators recorded the true
  label and the filter recorded its prediction, both as `0` (legitimate) or `1` (spam). Message `i` has
  true label `actual[i]` and prediction `predicted[i]`.

  Treat spam (`1`) as the positive class and count:

  - **TP**: messages with `actual = 1` and `predicted = 1`
  - **FP**: messages with `actual = 0` and `predicted = 1`
  - **FN**: messages with `actual = 1` and `predicted = 0`

  Return `[precision, recall, f1]` where

  - `precision = TP / (TP + FP)`
  - `recall = TP / (TP + FN)`
  - `f1 = 2 * precision * recall / (precision + recall)`

  Whenever a denominator is zero the metric is `0.0` (so `f1` is `0.0` when `precision + recall = 0`).
  Answers are compared with a tolerance of `1e-6`.

  ### Example 1
  ```
  Input:  actual = [1, 0, 1, 1, 0, 1, 1, 0, 1, 0], predicted = [1, 1, 0, 1, 0, 0, 1, 0, 0, 0]
  Output: [0.75, 0.5, 0.6]
  Explanation: TP = 3, FP = 1, FN = 3; precision = 3/4, recall = 3/6, f1 = 2 * 0.375 / 1.25
  ```

  ### Example 2
  ```
  Input:  actual = [1, 1, 0, 1], predicted = [1, 0, 0, 0]
  Output: [1.0, 0.3333333333333333, 0.5]
  ```

  ### Example 3
  ```
  Input:  actual = [0, 0, 0], predicted = [0, 0, 0]
  Output: [0.0, 0.0, 0.0]
  Explanation: no message is predicted or labelled as spam, so every denominator is zero
  ```

  ### Constraints
  - `0 <= actual.length == predicted.length <= 10^5`
  - every value in `actual` and `predicted` is `0` or `1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: classification_metrics
  params:
    - {name: actual, type: "int[]"}
    - {name: predicted, type: "int[]"}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    def classification_metrics(actual: list[int], predicted: list[int]) -> list[float]:
        tp = fp = fn = 0
        for truth, guess in zip(actual, predicted):
            if guess == 1 and truth == 1:
                tp += 1
            elif guess == 1:
                fp += 1
            elif truth == 1:
                fn += 1
        precision = tp / (tp + fp) if tp + fp > 0 else 0.0
        recall = tp / (tp + fn) if tp + fn > 0 else 0.0
        if precision + recall == 0:
            f1 = 0.0
        else:
            f1 = 2 * precision * recall / (precision + recall)
        return [precision, recall, f1]
  javascript: |
    function classificationMetrics(actual, predicted) {
      let tp = 0, fp = 0, fn = 0;
      for (let i = 0; i < actual.length; i++) {
        if (predicted[i] === 1 && actual[i] === 1) tp++;
        else if (predicted[i] === 1) fp++;
        else if (actual[i] === 1) fn++;
      }
      const precision = tp + fp > 0 ? tp / (tp + fp) : 0.0;
      const recall = tp + fn > 0 ? tp / (tp + fn) : 0.0;
      const f1 = precision + recall === 0 ? 0.0 : (2 * precision * recall) / (precision + recall);
      return [precision, recall, f1];
    }
