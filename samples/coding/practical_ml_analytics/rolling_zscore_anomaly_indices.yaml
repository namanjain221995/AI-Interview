expected_concepts:
  - "trailing baseline that excludes the current point"
  - "population standard deviation"
  - "running sum and running sum of squares for O(1) window updates"
  - "guarding against zero standard deviation"
  - "strict threshold comparison"
optimal_complexity: {time: "O(n)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Maintains a running sum and sum of squares so each step is O(1), excludes the current value from its own baseline, guards the zero-spread case, compares strictly and discusses numerical stability (for example exact integer arithmetic or Welford's method)."
  good: "Correct results with an O(n * window) recomputation, or the O(n) version after a hint about the boundary or the zero-std rule."
  weak: "Includes the current value in the baseline, uses the sample (n - 1) deviation, divides by zero on flat baselines, or flags values equal to the threshold."
  criteria:
    correctness: "All tests pass, including flat baselines, exact-boundary z-scores and drops below the mean."
    efficiency: "O(n) using incremental sums; O(n * window) recomputation is acceptable only as a starting point."
    code_quality: "Window updates (add new, remove old) are clearly ordered relative to the check for the current index."
    edge_cases: "Empty input, fewer values than the window, window of one, constant series and very low thresholds."
    communication: "Explains why the current point is excluded and why a zero-spread baseline cannot flag anything."
hints:
  - "For each minute you need the mean and the spread of the minutes just before it. Think about how those statistics change when the window slides forward by one minute."
  - "The mean only needs a running sum, and the population variance can be written as the mean of the squares minus the square of the mean, so a running sum of squares is enough as well. Check the current minute before adding it to the window."
  - "Keep a running sum and sum of squares of the previous window values. For each index from window onward, compute the variance from those two totals, skip the minute if it is zero, otherwise flag it when the absolute deviation from the mean divided by the square root of the variance is strictly larger than the threshold; then add the current value and remove the oldest one. Working with window times sum of squares minus sum squared keeps everything in exact integers."
followups:
  - "Why does a single large spike hide the minutes right after it, and how would a median-based score (MAD) behave instead?"
  - "How would you avoid cancellation errors with the sum-of-squares formula on large floating-point values?"
  - "How would you add seasonality so that a Monday-morning peak is compared with previous Monday mornings?"
  - "How would you suppress repeated alerts for a burst that lasts several minutes?"
common_errors:
  - "Including the current minute in its own baseline, which shrinks every z-score."
  - "Using the sample standard deviation (dividing by window - 1) instead of the population one."
  - "Dividing by zero, or flagging everything, when the baseline is flat."
  - "Using greater-or-equal, which flags a z-score exactly equal to the threshold."
  - "Recomputing every window from scratch without noting the O(n * window) cost."
