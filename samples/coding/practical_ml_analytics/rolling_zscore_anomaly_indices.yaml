title: Rolling Z-Score Anomaly Detector
difficulty: medium
competency_keys: [algorithms, problem_solving, machine_learning]
role_tags: [sre, data_scientist, devops, data_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Rolling Z-Score Anomaly Detector

  An alerting pipeline receives the number of failed requests per minute for a service as `values`
  (time order). A minute is suspicious when it is far from what the service did just before it,
  measured in standard deviations of the recent past.

  For every index `i` with `i >= window`, look at the **previous** `window` values
  `values[i - window], ..., values[i - 1]` (the current value is not part of its own baseline):

  - `mean` is their arithmetic mean;
  - `std` is their **population** standard deviation, `sqrt(sum((x - mean)^2) / window)`;
  - if `std > 0`, the z-score of minute `i` is `|values[i] - mean| / std`.

  Flag minute `i` when `std > 0` **and** its z-score is **strictly greater** than `threshold`. A
  baseline whose values are all identical has `std = 0`, so the minute after it is never flagged
  (there is no spread to measure against). Minutes with `i < window` are never flagged.

  Return the flagged indices in increasing order (empty list if none).

  The tests never place a z-score within rounding distance of the threshold, except in cases where
  every quantity is exactly representable (for example a z-score of exactly `2.0` against a threshold
  of `2.0`, which is **not** flagged).

  ### Example 1
  ```
  Input:  values = [3, 4, 3, 5, 4, 18, 4, 3, 5, 4], window = 4, threshold = 2.0
  Output: [5]
  Explanation: at index 5 the baseline [4, 3, 5, 4] has mean 4 and std 0.707,
               so 18 has a z-score near 19.8. Afterwards the baseline contains 18 and its std
               is large, so no other minute crosses the threshold.
  ```

  ### Example 2
  ```
  Input:  values = [0, 2, 3, 1, 1, 1, 7], window = 2, threshold = 2.0
  Output: [3]
  Explanation: index 2: baseline [0, 2], mean 1, std 1, z = 2.0, not strictly greater.
               index 3: baseline [2, 3], mean 2.5, std 0.5, z = 3.0, flagged.
               index 6: baseline [1, 1] has std 0, so 7 is not flagged.
  ```

  ### Constraints
  - `0 <= values.length <= 10^5`
  - `0 <= values[i] <= 10^4`
  - `1 <= window <= 1000`
  - `0 < threshold <= 10`
  - Aim for `O(n)` time, independent of `window`.
languages: [python, javascript, typescript, java, go, cpp]
