reference_solutions:
  python: |
    import math


    def zscore_anomalies(values: list[int], window: int, threshold: float) -> list[int]:
        flagged: list[int] = []
        total = 0
        total_sq = 0
        for i, value in enumerate(values):
            if i >= window:
                # z = |value - mean| / std = |w*value - sum| / sqrt(w*sum_sq - sum^2)  (exact integers)
                spread = window * total_sq - total * total
                if spread > 0 and abs(window * value - total) / math.sqrt(spread) > threshold:
                    flagged.append(i)
                old = values[i - window]
                total -= old
                total_sq -= old * old
            total += value
            total_sq += value * value
        return flagged
  javascript: |
    function zscoreAnomalies(values, window, threshold) {
      const flagged = [];
      for (let i = window; i < values.length; i++) {
        let mean = 0;
        for (let j = i - window; j < i; j++) mean += values[j];
        mean /= window;
        let variance = 0;
        for (let j = i - window; j < i; j++) variance += (values[j] - mean) ** 2;
        variance /= window;
        const std = Math.sqrt(variance);
        if (std > 0 && Math.abs(values[i] - mean) / std > threshold) flagged.push(i);
      }
      return flagged;
    }
