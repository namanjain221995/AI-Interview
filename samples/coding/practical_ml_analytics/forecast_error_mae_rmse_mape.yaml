slug: forecast_error_mae_rmse_mape
title: Demand Forecast Error Report
difficulty: easy
competency_keys: [machine_learning, problem_solving]
role_tags: [data_scientist, data_analyst, ml, business_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Demand Forecast Error Report

  The inventory planning team forecasts how many units of a product will sell each day. Every week
  they compare the forecast with what actually sold and publish three error metrics.

  Given `actual` and `forecast` (same length `n >= 1`, day `i` in position `i`), let
  `error_i = actual[i] - forecast[i]` and return `[mae, rmse, mape_percent]`:

  - `mae` — mean absolute error: the average of `|error_i|` over **all** days.
  - `rmse` — root mean squared error: the square root of the average of `error_i^2` over **all** days.
  - `mape_percent` — mean absolute percentage error: the average of `|error_i| / |actual[i]| * 100`
    taken **only over days where `actual[i] != 0`** (a day with zero sales has no meaningful
    percentage error). If every actual value is `0`, `mape_percent` is `0.0`.

  Actual values can be negative (net demand after returns). Answers are compared with a tolerance of
  `1e-6` (relative to the size of the value), so ordinary floating-point rounding is fine.

  ### Example 1
  ```
  Input:  actual = [100.0, 100.0, 0.0, 200.0], forecast = [90.0, 110.0, 30.0, 250.0]
  Output: [25.0, 30.0, 15.0]
  Explanation: the absolute errors are 10, 10, 30 and 50, so MAE = 100 / 4 = 25 and
  RMSE = sqrt((100 + 100 + 900 + 2500) / 4) = sqrt(900) = 30. MAPE skips day 2 (zero sales) and
  averages 10%, 10% and 25%.
  ```

  ### Example 2
  ```
  Input:  actual = [0.0, 0.0], forecast = [7.0, 1.0]
  Output: [4.0, 5.0, 0.0]
  Explanation: no day had sales, so MAPE is 0.0; RMSE = sqrt((49 + 1) / 2) = 5.
  ```

  ### Constraints
  - `1 <= actual.length == forecast.length <= 10^5`
  - `-10^6 <= actual[i], forecast[i] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: forecast_errors
  params:
    - {name: actual, type: "float[]"}
    - {name: forecast, type: "float[]"}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    import math


    def forecast_errors(actual: list[float], forecast: list[float]) -> list[float]:
        n = len(actual)
        abs_sum = 0.0
        sq_sum = 0.0
        pct_sum = 0.0
        pct_days = 0
        for a, f in zip(actual, forecast):
            err = abs(a - f)
            abs_sum += err
            sq_sum += err * err
            if a != 0:
                pct_sum += err / abs(a) * 100
                pct_days += 1
        mape = pct_sum / pct_days if pct_days else 0.0
        return [abs_sum / n, math.sqrt(sq_sum / n), mape]
  javascript: |
    function forecastErrors(actual, forecast) {
      const n = actual.length;
      let absSum = 0;
      let sqSum = 0;
      let pctSum = 0;
      let pctDays = 0;
      for (let i = 0; i < n; i++) {
        const err = Math.abs(actual[i] - forecast[i]);
        absSum += err;
        sqSum += err * err;
        if (actual[i] !== 0) {
          pctSum += (err / Math.abs(actual[i])) * 100;
          pctDays += 1;
        }
      }
      return [absSum / n, Math.sqrt(sqSum / n), pctDays > 0 ? pctSum / pctDays : 0];
    }
