expected_concepts:
  - mean absolute error versus root mean squared error
  - excluding undefined terms from an average (zero actuals in MAPE)
  - absolute value in the percentage denominator
  - single pass accumulation of several aggregates
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Computes all three metrics in one pass, divides MAPE by the number of non-zero days rather than n, uses the absolute actual in the denominator and explains when RMSE and MAPE mislead (outliers, near-zero sales).
  good: Correct metrics with a small slip that is fixed after running the tests, such as dividing MAPE by n or forgetting the all-zero case.
  weak: Divides by a zero actual, averages MAPE over all days, takes the square root of each error before averaging, or returns a fraction instead of a percent.
  criteria:
    correctness: All tests pass within tolerance, including zero-sales days, negative actuals and the all-zero case.
    efficiency: One linear pass with constant extra space.
    code_quality: Clearly named running sums and a single guarded division for MAPE.
    edge_cases: Single day, perfect forecasts, outliers, negative actuals and every actual equal to zero.
    communication: Explains what each metric emphasises and why MAPE must skip zero-sales days.
hints:
  - All three metrics are averages of a per-day quantity, so one pass over the days can accumulate everything you need.
  - MAE and RMSE average over every day, but MAPE averages only over days with non-zero sales, so it needs its own day counter.
  - Keep a running sum of absolute errors, a running sum of squared errors, and a running sum of percentage errors with a count of non-zero days; divide the first two by n (taking the square root of the second), and divide the third by its own count, returning 0.0 when that count is zero.
followups:
  - Why does RMSE punish one bad day more than MAE does?
  - MAPE explodes when actual sales are tiny; what alternative metric would you suggest (for example a weighted or symmetric variant)?
  - How would you report these metrics per product when you have thousands of products?
common_errors:
  - Dividing the MAPE sum by n instead of by the number of non-zero days.
  - Dividing by a zero actual and producing infinity or NaN.
  - Averaging the per-day square roots instead of taking the root of the mean squared error.
  - Using actual minus forecast without an absolute value, so positive and negative errors cancel.
