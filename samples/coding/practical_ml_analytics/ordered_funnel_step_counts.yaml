slug: ordered_funnel_step_counts
title: Ordered Signup Funnel Counts
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data_analyst, product_manager, backend, business_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Ordered Signup Funnel Counts

  The growth team tracks a signup funnel such as `visit_pricing -> start_trial -> add_card -> subscribe`.
  The product clickstream is given as two parallel arrays in **chronological order**: event `i` is
  `events[i]`, performed by user `user_ids[i]`. You also get the ordered funnel steps `funnel`.

  A user **reaches step `j`** (0-based) if their own events contain `funnel[0], funnel[1], ..., funnel[j]`
  in this order, as a subsequence: other events may happen in between, and an event may repeat, but a
  later step only counts if it happens **after** the user has completed the previous step. A single
  event completes at most one step. The same event name may appear in the funnel more than once (for
  example a page that must be visited twice).

  Return an array of length `funnel.length` where entry `j` is the number of **distinct users** who
  reached step `j`. The counts are therefore non-increasing.

  ### Example 1
  ```
  Input:  user_ids = [7, 7, 9, 7, 9, 12, 7, 12], events = ["visit_pricing", "start_trial", "start_trial", "add_card", "visit_pricing", "visit_pricing", "subscribe", "start_trial"], funnel = ["visit_pricing", "start_trial", "add_card", "subscribe"]
  Output: [3, 2, 1, 1]
  Explanation: user 7 completes all four steps. User 12 visits pricing, then starts a trial.
               User 9 starts a trial before visiting pricing, so only the visit counts.
  ```

  ### Example 2
  ```
  Input:  user_ids = [3, 3, 3, 4, 4], events = ["open_app", "view_plan", "view_plan", "view_plan", "open_app"], funnel = ["view_plan", "view_plan", "upgrade"]
  Output: [2, 1, 0]
  Explanation: user 3 views the plan twice and reaches step 1; user 4 views it once.
  ```

  ### Constraints
  - `0 <= user_ids.length == events.length <= 10^5`
  - `1 <= user_ids[i] <= 10^9`
  - `0 <= funnel.length <= 20`
  - Event names are non-empty strings of lowercase letters and underscores, at most 30 characters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: funnel_counts
  params:
    - {name: user_ids, type: "int[]"}
    - {name: events, type: "string[]"}
    - {name: funnel, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def funnel_counts(user_ids: list[int], events: list[str], funnel: list[str]) -> list[int]:
        progress: dict[int, int] = {}  # user -> number of funnel steps completed so far
        for user, event in zip(user_ids, events):
            done = progress.get(user, 0)
            if done < len(funnel) and event == funnel[done]:
                done += 1
            progress[user] = done
        counts = [0] * len(funnel)
        for done in progress.values():
            for step in range(done):
                counts[step] += 1
        return counts
  javascript: |
    function funnelCounts(userIds, events, funnel) {
      const progress = new Map();
      for (let i = 0; i < userIds.length; i++) {
        let done = progress.get(userIds[i]) || 0;
        if (done < funnel.length && events[i] === funnel[done]) done += 1;
        progress.set(userIds[i], done);
      }
      // reached[j] = users who completed exactly j steps; suffix sums give "at least j + 1"
      const exactly = new Array(funnel.length + 1).fill(0);
      for (const done of progress.values()) exactly[done] += 1;
      const counts = new Array(funnel.length).fill(0);
      let running = 0;
      for (let j = funnel.length; j >= 1; j--) {
        running += exactly[j];
        counts[j - 1] = running;
      }
      return counts;
    }
