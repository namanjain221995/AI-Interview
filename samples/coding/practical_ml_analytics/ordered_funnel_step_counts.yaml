expected_concepts:
  - "per-user state in a hash map"
  - "greedy subsequence matching"
  - "single pass over a chronological event stream"
  - "counting distinct users per step"
  - "turning furthest-step-reached into cumulative counts"
optimal_complexity: {time: "O(n + u * f)", space: "O(u + f)"}
rubric:
  excellent: "Keeps one progress counter per user in a hash map, advances it greedily only when the event matches the next expected step, converts final progress into per-step counts (directly or with suffix sums), and justifies why the greedy match is optimal."
  good: "Correct per-user tracking after a nudge on ordering, repeated funnel steps or counting distinct users."
  weak: "Counts events instead of users, ignores the order of steps, or lets a single event complete several identical steps."
  criteria:
    correctness: "All tests pass, including out-of-order steps, repeated funnel steps and noise events."
    efficiency: "One pass over the events plus O(users * steps) or O(users + steps) to aggregate."
    code_quality: "A clear mapping from user to steps completed and a separate aggregation step."
    edge_cases: "Empty stream, empty funnel, a funnel with repeated steps and users who never start."
    communication: "Explains why matching each step at its earliest opportunity can never lose a later match."
hints:
  - "Think about each user separately: what is the only piece of information you need to remember about a user while reading their events in order?"
  - "For every user remember how many funnel steps they have completed. When one of their events equals the next step they still need, move them forward by one; any other event is ignored."
  - "Walk the stream once with a hash map from user to steps completed, advancing a user only when the event name equals the funnel step at their current position and they have not finished. Afterwards, every user who completed d steps contributes one to each of the first d entries of the result; suffix sums over how many users stopped at each depth do this in linear time."
followups:
  - "How would you add a time limit, for example the whole funnel must be completed within seven days?"
  - "How would you report the median time between consecutive steps?"
  - "How would you compute this in SQL over an events table?"
  - "How would you support funnels where some steps may happen in any order?"
common_errors:
  - "Counting events instead of distinct users."
  - "Checking only whether a user performed each event at all, ignoring the required order."
  - "Letting one event satisfy two consecutive identical funnel steps."
  - "Forgetting users whose first event is not the first funnel step."
  - "Returning only users who completed the whole funnel."
