  - {id: t1, args: [[7, 7, 9, 7, 9, 12, 7, 12], ["visit_pricing", "start_trial", "start_trial", "add_card", "visit_pricing", "visit_pricing", "subscribe", "start_trial"], ["visit_pricing", "start_trial", "add_card", "subscribe"]], expected: [3, 2, 1, 1], description: "Example 1 - interleaved users; one finishes, one reaches step 1, one does steps out of order"}
  - {id: t2, args: [[3, 3, 3, 4, 4], ["open_app", "view_plan", "view_plan", "view_plan", "open_app"], ["view_plan", "view_plan", "upgrade"]], expected: [2, 1, 0], description: "Example 2 - a funnel step repeated twice needs two separate events"}
