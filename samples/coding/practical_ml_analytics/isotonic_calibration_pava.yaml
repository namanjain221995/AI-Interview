version: 1
slug: isotonic_calibration_pava
title: Isotonic Calibration of Model Scores
difficulty: hard
competency_keys: [machine_learning, algorithms, data_structures]
role_tags: [ml, data_scientist]
time_limit_minutes: 30
prompt_markdown: |
  ## Isotonic Calibration of Model Scores

  A lead-scoring model ranks sales leads, and the team wants its scores turned into calibrated
  conversion probabilities. Leads were grouped into buckets by score, and the buckets are given in
  order of **increasing model score**. For bucket `i` you know `values[i]`, the observed conversion
  rate in that bucket, and `weights[i] > 0`, how much evidence the bucket carries (for example the
  number of leads in it).

  A higher score should never mean a lower probability, so the calibrated curve must be
  **non-decreasing**. Return the list `fitted` (same length as `values`) that

  - is non-decreasing: `fitted[0] <= fitted[1] <= ... <= fitted[n - 1]`, and
  - minimises the weighted squared error `sum(weights[i] * (values[i] - fitted[i])^2)`.

  This solution is unique. Return one fitted value per input position, in input order. Values are
  compared with a relative tolerance of `1e-6` (`|actual - expected| <= 1e-6 * max(1, |expected|)`).

  ### Example 1
  ```
  Input:  values = [0.1, 0.3, 0.2, 0.4], weights = [1.0, 1.0, 1.0, 1.0]
  Output: [0.1, 0.25, 0.25, 0.4]
  Explanation: 0.3 followed by 0.2 breaks the order; the best fix gives both buckets their mean, 0.25.
  ```

  ### Example 2
  ```
  Input:  values = [0.25, 0.75, 0.5, 0.0], weights = [2.0, 1.0, 1.0, 4.0]
  Output: [0.21875, 0.21875, 0.21875, 0.21875]
  Explanation: pooling buckets 1 and 2 gives 0.625; adding bucket 3 gives (0.75 + 0.5 + 0.0) / 6, about
  0.2083, which is below bucket 0's 0.25, so everything is pooled: (0.5 + 0.75 + 0.5 + 0.0) / 8 = 0.21875.
  ```

  ### Constraints
  - `0 <= values.length == weights.length <= 10^5` (empty input returns an empty list)
  - `0.0 <= values[i] <= 1.0`
  - `0 < weights[i] <= 10^6`

  **Follow-up:** a solution that repeatedly rescans the whole list for violations is `O(n^2)`. Aim for
  `O(n)` amortised time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: isotonic_fit
  params:
    - {name: values, type: "float[]"}
    - {name: weights, type: "float[]"}
  return_type: "float[]"
  comparison: float_tolerance
  tolerance: 1e-06
reference_solutions:
  python: |
    def isotonic_fit(values: list[float], weights: list[float]) -> list[float]:
        # Each block: [weighted sum, total weight, number of positions].
        blocks: list[list[float]] = []
        for value, weight in zip(values, weights):
            blocks.append([value * weight, weight, 1])
            while len(blocks) > 1 and blocks[-2][0] / blocks[-2][1] > blocks[-1][0] / blocks[-1][1]:
                total, weight_sum, count = blocks.pop()
                blocks[-1][0] += total
                blocks[-1][1] += weight_sum
                blocks[-1][2] += count
        fitted: list[float] = []
        for total, weight_sum, count in blocks:
            fitted.extend([total / weight_sum] * int(count))
        return fitted
  javascript: |
    function isotonicFit(values, weights) {
      // Each block: weighted sum, total weight, number of positions.
      const sums = [];
      const totals = [];
      const counts = [];
      for (let i = 0; i < values.length; i++) {
        sums.push(values[i] * weights[i]);
        totals.push(weights[i]);
        counts.push(1);
        let top = sums.length - 1;
        while (top > 0 && sums[top - 1] / totals[top - 1] > sums[top] / totals[top]) {
          sums[top - 1] += sums.pop();
          totals[top - 1] += totals.pop();
          counts[top - 1] += counts.pop();
          top--;
        }
      }
      const fitted = [];
      for (let b = 0; b < sums.length; b++) {
        const mean = sums[b] / totals[b];
        for (let c = 0; c < counts[b]; c++) fitted.push(mean);
      }
      return fitted;
    }
