expected_concepts:
  - pool adjacent violators algorithm (PAVA)
  - stack of blocks storing weighted sum, total weight and size
  - cascading merges after a pooled block lowers its mean
  - weighted mean as the least-squares fit of a block
  - isotonic regression for probability calibration
optimal_complexity: {time: "O(n) amortised (each block is merged at most once)", space: "O(n)"}
rubric:
  excellent: "Implements pool-adjacent-violators with a stack of (weighted sum, weight, size) blocks, keeps merging backwards while the previous block's mean is larger, expands blocks to per-position values, argues the O(n) amortised bound and connects the result to calibration (and to Platt scaling as an alternative)."
  good: "Correct output with a repeated-scan PAVA that is O(n^2) in the worst case, or a stack version reached after a hint about cascading merges."
  weak: "Uses plain instead of weighted means, merges only the immediate violating pair without re-checking earlier blocks, clips values to the previous maximum, or returns one value per block instead of per position."
  criteria:
    correctness: "All tests pass, including cascading pools, ties, heavy weights and fully decreasing input."
    efficiency: "Linear amortised time with a stack; no repeated full rescans."
    code_quality: "Block state kept together, clear merge loop, no floating-point equality tricks."
    edge_cases: "Empty input, single bucket, equal neighbours and very small or very large weights."
    communication: "Explains why pooling to the weighted mean is optimal for a block and why merging never needs to be undone."
hints:
  - When two neighbouring buckets are out of order, the best non-decreasing fit for just those two gives them one shared value. Which single value minimises their weighted squared error?
  - Pool violating neighbours into a block whose fitted value is the block's weighted mean. A pooled block can end up with a lower mean than the block before it, so after every merge you must check backwards again.
  - Walk the buckets once while keeping a stack of blocks, each holding its weighted sum, total weight and number of positions. Push each bucket as a new block, then while the block below the top has a larger mean, merge the top into it. Finally expand every block into its mean repeated once per position.
followups:
  - Why does merging never need to be undone - can a pooled block ever split again later?
  - How would you apply the fitted calibration to a new score that falls between two buckets?
  - When would you prefer Platt scaling (a fitted sigmoid) over isotonic calibration?
  - How would you measure whether calibration actually improved, for example with a reliability diagram or the Brier score?
common_errors:
  - Using plain averages and ignoring the weights.
  - Merging only the current violating pair without re-checking against earlier blocks.
  - Clipping each value to the running maximum, which is monotone but not least-squares optimal.
  - Returning one value per block instead of one per input position.
  - Sorting the buckets by observed rate, which destroys the score order the fit must respect.
