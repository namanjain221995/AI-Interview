expected_concepts:
  - "two sliding-window sums maintained in one pass"
  - "comparing averages exactly by cross-multiplication"
  - "carrying the last non-zero state through ties"
  - "64-bit arithmetic for the products"
  - "edge handling when there are fewer values than the long window"
optimal_complexity: {time: "O(n)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Maintains both window sums incrementally, compares them with integer cross-multiplication, carries the trend through ties, never signals on the first non-zero sign and explains the 64-bit requirement."
  good: "Correct sliding sums and signals, but needs a nudge on ties, the first-trend rule or floating-point comparison."
  weak: "Recomputes every window from scratch, emits a signal whenever the sign changes including to or from zero, or starts comparing before the long window is full."
  criteria:
    correctness: "All tests pass, including ties, leading zeros and inputs shorter than the long window."
    efficiency: "O(n) time with two running sums instead of O(n * long_window)."
    code_quality: "Clear names for the two sums and the remembered trend; the cross-multiplied comparison is explained in a comment."
    edge_cases: "Empty input, flat traffic, a tie followed by a return to the same side, alternating values and large products."
    communication: "Explains why cross-multiplication avoids rounding issues and why ties must not reset the trend."
hints:
  - "Both averages slide forward by one minute at a time; think about what changes in each window sum when a new value arrives."
  - "Keep a running sum for each window, add the new value and subtract the one that falls out. To avoid fractions, compare the two sums after scaling each by the other window's length."
  - "Once both windows are full, compute the sign of the short sum times the long window minus the long sum times the short window, using 64-bit integers. Remember the last non-zero sign; when a new non-zero sign differs from it, record the index and the new sign, and skip zeros entirely without updating the memory."
followups:
  - "How would you add a minimum gap so that a crossing must persist for k minutes before it counts?"
  - "How would you adapt this to exponentially weighted averages instead of simple windows?"
  - "What changes if the minutes arrive as a stream and you must emit signals in real time with O(long_window) memory?"
  - "Why can floating-point averages produce a spurious signal when the two averages are equal?"
common_errors:
  - "Treating a tie as a trend change, which emits a signal when the averages touch and separate again on the same side."
  - "Emitting a signal for the very first non-zero sign."
  - "Comparing floating-point averages, so exact ties are misclassified."
  - "Recomputing every window sum from scratch, which is O(n * long_window)."
  - "Overflowing 32-bit integers when multiplying the window sums by the window lengths."
