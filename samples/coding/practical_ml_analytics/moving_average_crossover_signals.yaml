    - {name: short_window, type: "int"}
    - {name: long_window, type: "int"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def crossover_signals(values: list[int], short_window: int, long_window: int) -> list[list[int]]:
        signals: list[list[int]] = []
        short_sum = 0
        long_sum = 0
        previous = 0  # last non-zero sign seen, 0 while none yet
        for i, value in enumerate(values):
            short_sum += value
            long_sum += value
            if i >= short_window:
                short_sum -= values[i - short_window]
            if i >= long_window:
                long_sum -= values[i - long_window]
            if i < long_window - 1:
                continue
            # shortAvg - longAvg has the sign of short_sum * long_window - long_sum * short_window
            diff = short_sum * long_window - long_sum * short_window
            sign = (diff > 0) - (diff < 0)
            if sign != 0:
                if previous != 0 and sign != previous:
                    signals.append([i, sign])
                previous = sign
        return signals
  javascript: |
    function crossoverSignals(values, shortWindow, longWindow) {
      const signals = [];
      let shortSum = 0;
      let longSum = 0;
      let previous = 0;
      for (let i = 0; i < values.length; i++) {
        shortSum += values[i];
        longSum += values[i];
        if (i >= shortWindow) shortSum -= values[i - shortWindow];
        if (i >= longWindow) longSum -= values[i - longWindow];
        if (i < longWindow - 1) continue;
        const diff = shortSum * longWindow - longSum * shortWindow;
        const sign = diff > 0 ? 1 : diff < 0 ? -1 : 0;
        if (sign !== 0) {
          if (previous !== 0 && sign !== previous) signals.push([i, sign]);
          previous = sign;
        }
      }
      return signals;
    }
