title: Traffic Trend Crossover Signals
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, data_analyst, devops, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Traffic Trend Crossover Signals

  The capacity-planning team records the number of requests per minute that reach the API gateway,
  in time order, as `values`. To spot when traffic turns, they compare two **trailing averages**:

  - the short average at minute `i` is the mean of the last `short_window` values ending at `i`
    (inclusive);
  - the long average at minute `i` is the mean of the last `long_window` values ending at `i`
    (inclusive), with `short_window < long_window`.

  Both averages exist from index `long_window - 1` onward. At each such index, look at the **sign** of
  `shortAvg - longAvg`: `+1` (short above long), `-1` (short below long) or `0` (exactly equal).

  A sign of `0` does not change the trend: carry the last non-zero sign through it. Emit a signal when
  the trend flips:

  - `[i, 1]` when the sign at index `i` is `+1` and the last non-zero sign before it was `-1`
    (traffic is turning up);
  - `[i, -1]` when the sign at index `i` is `-1` and the last non-zero sign before it was `+1`
    (traffic is turning down).

  The first non-zero sign only establishes the trend and never produces a signal. Return all signals
  in increasing index order, or an empty list when there are none (including when there are fewer than
  `long_window` values).

  Averages are fractions, so compare them exactly: `shortAvg > longAvg` is equivalent to
  `shortSum * long_window > longSum * short_window`. Use 64-bit integers for these products.

  ### Example 1
  ```
  Input:  values = [120, 118, 115, 110, 104, 109, 121, 130, 126, 112, 101], short_window = 2, long_window = 4
  Output: [[6, 1], [9, -1]]
  Explanation: from index 3 the short average is below the long one; at index 6
               (115.0 vs 111.0) it rises above, and at index 9 (119.0 vs 122.25) it drops below again.
  ```

  ### Example 2
  ```
  Input:  values = [30, 30, 20, 25, 30, 35], short_window = 1, long_window = 3
  Output: [[4, 1]]
  Explanation: index 2 is -1 (20 vs 26.67), index 3 is a tie (25 vs 25),
               index 4 is +1 (30 vs 25). The trend before index 4 was still -1, so the flip is reported at 4.
  ```

  ### Constraints
  - `0 <= values.length <= 10^5`
  - `0 <= values[i] <= 10^6`
  - `1 <= short_window < long_window <= 10^4`
  - Aim for `O(n)` time: do not recompute every window from scratch.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: crossover_signals
  params:
