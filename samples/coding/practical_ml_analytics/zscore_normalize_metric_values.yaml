expected_concepts:
  - mean and population standard deviation
  - two-pass (or Welford) variance for numerical stability
  - zero-variance guard
  - feature scaling before model training
optimal_complexity: {time: O(n), space: O(1) extra besides the output}
rubric:
  excellent: Computes the mean, then the population variance from squared deviations in a second pass (or with Welford), guards the all-equal case by comparing values, and explains why the E[x^2] - mean^2 shortcut fails for large values and why the scaling parameters must come from training data only.
  good: Correct two-pass solution with one slip (sample instead of population std, or the zero-variance case) fixed after running the tests.
  weak: Uses the sum-of-squares shortcut that breaks on large values, divides by zero on constant input, or divides by n - 1 without noticing the specification.
  criteria:
    correctness: All tests pass, including constant columns, a single value and large values with a small spread.
    efficiency: Linear time with a constant number of passes.
    code_quality: Mean, variance and the zero-variance guard are clearly separated; the input is not mutated.
    edge_cases: Empty input, single value, all-equal values and extreme magnitudes.
    communication: Explains population versus sample standard deviation and the numerical stability issue.
hints:
  - You need two numbers summarising the whole column before you can transform any value; what are they, and in what order can you compute them?
  - Compute the mean first, then the average squared distance from that mean in a second pass; avoid the formula that subtracts the squared mean from the mean of squares, because it cancels badly for large values.
  - Return an empty list for empty input and all zeros when the minimum equals the maximum; otherwise compute the mean, the population variance as the sum of squared deviations divided by n, take its square root, and map each value to its difference from the mean divided by that root.
followups:
  - How would you compute the mean and variance in a single streaming pass (Welford's algorithm)?
  - Why must the mean and standard deviation be computed on the training split only and reused for test data?
  - When would you prefer min-max scaling or a robust scaler based on the median instead?
common_errors:
  - Dividing by n - 1 (sample standard deviation) instead of n.
  - Using the mean-of-squares minus squared-mean shortcut, which loses precision for values near 10^9.
  - Dividing by zero, or by a tiny rounding residue, when all values are equal.
  - Recomputing the mean inside the loop for every value.
