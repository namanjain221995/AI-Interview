title: Z-Score Normalisation of a Metric Column
difficulty: easy
competency_keys: [machine_learning, algorithms]
role_tags: [data_scientist, ml, data_analyst, data]
time_limit_minutes: 12
prompt_markdown: |
  ## Z-Score Normalisation of a Metric Column

  Before training a demand-forecasting model, a feature pipeline standardises each numeric column (for
  example daily page views or basket value) so that columns with different units become comparable. Each
  value is replaced by its **z-score**:

  - `mean = (sum of all values) / n`
  - `std = sqrt((sum of (x - mean)^2) / n)` (the **population** standard deviation, dividing by `n`)
  - `z = (x - mean) / std`

  Return the z-scores in the same order as the input. Two special cases:

  - an empty column returns `[]`;
  - if **all values are equal**, the standard deviation is zero and every z-score is `0.0`. Detect this by
    comparing the values themselves rather than testing a computed standard deviation against zero,
    which floating-point rounding can leave slightly above zero.

  Values can be large (around `10^9`) while differing only a little from each other, so compute the
  variance in a numerically stable way. Answers are compared with a tolerance of `1e-6` (relative to the
  size of the value).

  ### Example 1
  ```
  Input:  values = [2.0, 4.0, 4.0, 4.0, 5.0, 5.0, 7.0, 9.0]
  Output: [-1.5, -0.5, -0.5, -0.5, 0.0, 0.0, 1.0, 2.0]
  Explanation: mean = 5 and population std = 2
  ```

  ### Example 2
  ```
  Input:  values = [3.5, 3.5, 3.5]
  Output: [0.0, 0.0, 0.0]
  ```

  ### Example 3
  ```
  Input:  values = [10.0, 20.0]
  Output: [-1.0, 1.0]
  ```

  ### Constraints
  - `0 <= values.length <= 10^5`
  - `-10^9 <= values[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: zscore_normalize
  params:
    - {name: values, type: "float[]"}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    import math


    def zscore_normalize(values: list[float]) -> list[float]:
        n = len(values)
        if n == 0:
            return []
        if min(values) == max(values):
            return [0.0] * n
        mean = sum(values) / n
        variance = sum((x - mean) ** 2 for x in values) / n
        std = math.sqrt(variance)
        return [(x - mean) / std for x in values]
  javascript: |
    function zscoreNormalize(values) {
      const n = values.length;
      if (n === 0) return [];
      if (values.every((x) => x === values[0])) return new Array(n).fill(0.0);
      let total = 0;
      for (const x of values) total += x;
      const mean = total / n;
      let squares = 0;
      for (const x of values) squares += (x - mean) * (x - mean);
      const std = Math.sqrt(squares / n);
      return values.map((x) => (x - mean) / std);
    }
