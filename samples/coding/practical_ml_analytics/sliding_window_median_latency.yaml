reference_solutions:
  python: |
    import heapq


    def time_window_medians(timestamps: list[int], latencies: list[int], window_seconds: int) -> list[float]:
        low: list[tuple[int, int]] = []  # smaller half as a max-heap of (-value, index)
        high: list[tuple[int, int]] = []  # larger half as a min-heap of (value, index)
        in_low = [False] * len(latencies)
        sizes = [0, 0]  # live samples in low and high
        start = 0  # first index still inside the window; heap entries before it are stale
        result: list[float] = []

        def prune(heap: list[tuple[int, int]]) -> None:
            while heap and heap[0][1] < start:
                heapq.heappop(heap)

        for i, value in enumerate(latencies):
            while timestamps[start] <= timestamps[i] - window_seconds:
                sizes[0 if in_low[start] else 1] -= 1
                start += 1
            prune(low)
            prune(high)
            if low and value <= -low[0][0]:
                heapq.heappush(low, (-value, i))
                in_low[i] = True
                sizes[0] += 1
            else:
                heapq.heappush(high, (value, i))
                sizes[1] += 1
            while sizes[0] > sizes[1] + 1:
                prune(low)
                neg, idx = heapq.heappop(low)
                heapq.heappush(high, (-neg, idx))
                in_low[idx] = False
                sizes[0] -= 1
                sizes[1] += 1
            while sizes[0] < sizes[1]:
                prune(high)
                val, idx = heapq.heappop(high)
                heapq.heappush(low, (-val, idx))
                in_low[idx] = True
                sizes[0] += 1
                sizes[1] -= 1
            prune(low)
            prune(high)
            if sizes[0] > sizes[1]:
                result.append(float(-low[0][0]))
            else:
                result.append((-low[0][0] + high[0][0]) / 2)
        return result
  javascript: |
    class Heap {
      constructor(before) {
        this.items = [];
        this.before = before; // before(a, b) is true when a belongs above b
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(item) {
        const a = this.items;
        a.push(item);
        let i = a.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!this.before(a[i], a[parent])) break;
          [a[i], a[parent]] = [a[parent], a[i]];
          i = parent;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let best = i;
            if (l < a.length && this.before(a[l], a[best])) best = l;
            if (r < a.length && this.before(a[r], a[best])) best = r;
            if (best === i) break;
            [a[i], a[best]] = [a[best], a[i]];
            i = best;
          }
        }
        return top;
      }
    }

    function timeWindowMedians(timestamps, latencies, windowSeconds) {
      // Entries are [value, index]; entries whose index is before `start` have left the window.
      const low = new Heap((a, b) => a[0] > b[0]); // smaller half, largest on top
      const high = new Heap((a, b) => a[0] < b[0]); // larger half, smallest on top
      const inLow = new Array(latencies.length).fill(false);
      let lowSize = 0;
      let highSize = 0;
      let start = 0;
      const prune = (heap) => {
        while (heap.size > 0 && heap.peek()[1] < start) heap.pop();
      };
      const result = [];
      for (let i = 0; i < latencies.length; i++) {
        while (timestamps[start] <= timestamps[i] - windowSeconds) {
          if (inLow[start]) lowSize--;
          else highSize--;
          start++;
        }
        prune(low);
        prune(high);
        const value = latencies[i];
        if (low.size > 0 && value <= low.peek()[0]) {
          low.push([value, i]);
          inLow[i] = true;
          lowSize++;
        } else {
          high.push([value, i]);
          highSize++;
        }
        while (lowSize > highSize + 1) {
          prune(low);
          const moved = low.pop();
          high.push(moved);
          inLow[moved[1]] = false;
          lowSize--;
          highSize++;
        }
        while (lowSize < highSize) {
          prune(high);
          const moved = high.pop();
          low.push(moved);
          inLow[moved[1]] = true;
          lowSize++;
          highSize--;
        }
        prune(low);
        prune(high);
        result.push(lowSize > highSize ? low.peek()[0] : (low.peek()[0] + high.peek()[0]) / 2);
      }
      return result;
    }
