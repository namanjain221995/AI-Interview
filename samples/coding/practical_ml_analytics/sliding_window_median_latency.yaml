expected_concepts:
  - "two heaps (max-heap for the lower half, min-heap for the upper half)"
  - "lazy deletion of expired samples by index"
  - "variable-size windows driven by a time-based left pointer"
  - "rebalancing heap sizes using live counts rather than heap lengths"
  - "64-bit or floating-point arithmetic for the even-size mean"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Moves a left pointer by time, keeps two heaps with lazy deletion keyed by index, tracks live counts per heap to rebalance, prunes stale tops before reading them, handles equal timestamps and explains the O(n log n) bound and why stale entries are popped at most once."
  good: "Correct two-heap or sorted-container solution that needs a hint about removing expired samples or about balancing with live counts; or a correct O(n * w) insertion-sort window with a clear plan for the faster version."
  weak: "Uses a fixed count of samples instead of a time window, re-sorts every window without discussing the cost, includes later requests from the same second, or overflows when adding two large middle values."
  criteria:
    correctness: "All tests pass, including bursts at one timestamp, long gaps and values near 10^9."
    efficiency: "O(n log n) with heaps or an order-statistics structure; no full re-sort per request."
    code_quality: "Clear invariants for the two halves and a single place where expired samples are discarded."
    edge_cases: "Single sample, windows that shrink to one sample after a gap, windows longer than the trace and equal values."
    communication: "States the heap invariants and how lazy deletion keeps removals cheap."
hints:
  - "Solve the window boundary and the median separately: the window start only moves forward as time advances, and the median of a changing multiset is a classic two-halves problem."
  - "Keep the smaller half in a max-heap and the larger half in a min-heap; heaps cannot delete arbitrary items cheaply, so leave expired samples inside and discard them when they reach the top."
  - "Store (value, index) in the heaps, remember which heap each index went to, and keep live counts per heap; when the start pointer passes an index decrement that heap's live count, rebalance so the lower half holds the same or one more live sample, and prune stale tops before reading the median."
followups:
  - "How would you report the p99 latency over the same windows instead of the median?"
  - "What would you change if samples could arrive slightly out of order?"
  - "How much memory do lazily deleted entries cost in the worst case, and how would you bound it?"
  - "How would an approximate structure such as a t-digest or a histogram trade accuracy for memory here?"
common_errors:
  - "Treating the window as the last k samples instead of the last window_seconds seconds."
  - "Including requests that arrive later in the same second in an earlier request's window."
  - "Balancing with heap lengths that still contain expired samples."
  - "Reading a heap top without pruning expired entries first."
  - "Adding two 32-bit middle values before dividing and overflowing."
