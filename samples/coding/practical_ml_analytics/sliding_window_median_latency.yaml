version: 1
slug: sliding_window_median_latency
title: Time-Window Median Latency
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [sre, backend, data, devops]
time_limit_minutes: 35
prompt_markdown: |
  ## Time-Window Median Latency

  An API gateway emits one latency sample per request. Requests do not arrive at a steady rate: there are
  bursts with many requests in the same second and quiet gaps with none. The alerting rule therefore
  watches the **median latency of the last `window_seconds` seconds**, not of the last fixed number of
  requests.

  You get two lists of equal length `n`: `timestamps[i]` (whole seconds, **non-decreasing**) and
  `latencies[i]` (milliseconds) of request `i`, in arrival order, plus `window_seconds`.

  For every request `i` (in order), its window holds the requests `j` with `j <= i` and
  `timestamps[j] > timestamps[i] - window_seconds`. The window always contains request `i` itself, and a
  request that arrives later in the same second as `i` is **not** in `i`'s window.

  Return a list of `n` medians, where entry `i` is the median latency of request `i`'s window: the middle
  value after sorting when the window holds an odd number of samples, and the mean of the two middle
  values when it holds an even number. Answers within `10^-6` (relative for large values) are accepted.

  ### Example 1
  ```
  Input:  timestamps = [0, 1, 2, 5, 6, 6, 9], latencies = [120, 80, 100, 300, 90, 95, 110], window_seconds = 3
  Output: [120.0, 100.0, 100.0, 300.0, 195.0, 95.0, 110.0]
  Explanation: at t = 5 the window covers seconds 3-5 and holds only 300; the second request at t = 6 sees [300, 90, 95]; at t = 9 only 110 is left
  ```

  ### Example 2
  ```
  Input:  timestamps = [10, 10, 10, 11], latencies = [5, 1, 3, 7], window_seconds = 1
  Output: [5.0, 3.0, 3.0, 7.0]
  Explanation: the three requests at t = 10 see windows [5], [5, 1] and [5, 1, 3]; at t = 11 the earlier second has left the window
  ```

  ### Constraints
  - `1 <= n <= 10^5`, `timestamps.length == latencies.length`
  - `0 <= timestamps[i] <= 10^9` and `timestamps[i] <= timestamps[i + 1]`
  - `0 <= latencies[i] <= 10^9`; the sum of two middle values can exceed the 32-bit integer range
  - `1 <= window_seconds <= 10^9`

  **Follow-up:** re-sorting every window is `O(n * w log w)` for windows of size `w`; aim for
  `O(n log n)` overall even when one window holds almost every request.
