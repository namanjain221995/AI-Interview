version: 1
slug: equal_frequency_quantile_bin_ids
title: Equal-Frequency Bins for Customer Spend
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data_analyst, data_scientist, data, business_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Equal-Frequency Bins for Customer Spend

  The analytics team segments customers into spend bands with roughly the same number of customers in
  each band (equal-frequency or quantile binning), rather than bands of equal width. You are given the
  monthly spend of every customer in `values` (whole currency units) and the number of bands
  `num_bins`.

  Two customers who spent exactly the same amount must always land in the same band, so the band is
  defined by rank rather than by position in a sorted list:

  - `less(v)` = the number of entries of `values` that are **strictly smaller** than `v`;
  - `bin(v) = floor(num_bins * less(v) / n)`, where `n = values.length`.

  Return an array with the band index of every customer, **in the input order**. Band indices are in
  `0 .. num_bins - 1`; some bands may be empty when many customers share the same spend.

  A solution that counts smaller values separately for every customer is `O(n^2)`; aim for
  `O(n log n)`.

  ### Example 1
  ```
  Input:  values = [120, 45, 300, 80, 45, 999, 15, 210], num_bins = 4
  Output: [2, 0, 3, 1, 0, 3, 0, 2]
  Explanation: sorted: 15, 45, 45, 80, 120, 210, 300, 999. less(45) = 1, so both 45s get
               floor(4 * 1 / 8) = 0. less(80) = 3 gives band 1, less(999) = 7 gives band 3.
  ```

  ### Example 2
  ```
  Input:  values = [50, 50, 50, 50, 10], num_bins = 2
  Output: [0, 0, 0, 0, 0]
  Explanation: less(10) = 0 and less(50) = 1, so every customer is in band 0.
  ```

  ### Constraints
  - `0 <= values.length <= 10^5`
  - `-10^9 <= values[i] <= 10^9` (refunds can make spend negative)
  - `1 <= num_bins <= 10^9`
  - `num_bins * n` can exceed `2^31`; use 64-bit arithmetic for the product.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: quantile_bins
  params:
    - {name: values, type: "int[]"}
    - {name: num_bins, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left


    def quantile_bins(values: list[int], num_bins: int) -> list[int]:
        n = len(values)
        ordered = sorted(values)
        # bisect_left gives the number of values strictly smaller than v
        return [num_bins * bisect_left(ordered, v) // n for v in values]
  javascript: |
    function quantileBins(values, numBins) {
      const n = values.length;
      const ordered = [...values].sort((a, b) => a - b);
      const less = new Map();
      for (let i = 0; i < n; i++) {
        if (!less.has(ordered[i])) less.set(ordered[i], i);
      }
      return values.map((v) => Math.floor((numBins * less.get(v)) / n));
    }
