expected_concepts:
  - "rank of a value as the count of strictly smaller values"
  - "sorting once and using binary search or a first-occurrence map"
  - "keeping ties in the same bin"
  - "integer floor division with 64-bit products"
  - "mapping results back to input order"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts a copy once, finds the count of strictly smaller values via binary search or the first index of each value, computes the band with 64-bit integer floor division, returns results in input order and explains why ties stay together."
  good: "Correct O(n log n) solution after a nudge on ties or integer division, or a correct O(n^2) solution with a clear path to the faster one."
  weak: "Assigns bands by position in the sorted array so tied values split, uses floating-point division that rounds wrongly, or returns bands in sorted order."
  criteria:
    correctness: "All tests pass, including ties, negative values and more bands than customers."
    efficiency: "O(n log n) with one sort; O(n^2) counting is only a baseline."
    code_quality: "The rank lookup and the band formula are clearly separated and named."
    edge_cases: "Empty input, a single customer, one band, more bands than customers and large products."
    communication: "Explains why rank-by-strictly-smaller keeps equal spends together and why some bands can be empty."
hints:
  - "The band depends only on how many customers spent strictly less. How could you answer that question quickly for every customer?"
  - "After sorting a copy of the values, the number of strictly smaller values equals the position where a value first appears in the sorted list. You can find it with a binary search or by recording first positions in one pass."
  - "Sort a copy, build a lookup from each value to the index of its first occurrence in the sorted copy (or binary-search the leftmost position), then for every customer in input order multiply the number of bands by that position and integer-divide by the number of customers, using 64-bit arithmetic."
followups:
  - "How would you compute the band boundaries (cut points) to show on a dashboard?"
  - "How would you assign bands to new customers next month without recomputing everything?"
  - "How would you approximate these bands on a stream of billions of values with limited memory?"
  - "When would equal-width bins be a better choice than equal-frequency bins?"
common_errors:
  - "Using the position in the sorted array, which puts equal spends into different bands."
  - "Counting values less than or equal instead of strictly smaller."
  - "Using floating-point division and rounding instead of integer floor division."
  - "Returning the bands in sorted order instead of input order."
  - "Overflowing 32-bit integers when multiplying the number of bands by the rank."
