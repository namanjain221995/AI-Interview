expected_concepts:
  - top-k accuracy metric
  - deterministic ranking with a tie-break rule
  - counting items ranked ahead instead of sorting
  - partial sort or heap as an alternative
optimal_complexity: {time: O(n * c), space: O(1) extra}
rubric:
  excellent: Counts, per product, how many categories rank ahead of the true label (higher score, or equal score with a lower index) and checks that count against k, giving O(n * c) without sorting; states the tie-break precisely and handles the empty case.
  good: Sorts each row's category indices by (score descending, index ascending) and checks the first k, with correct results and an O(n * c log c) cost it can explain.
  weak: Ignores the tie-break, sorts scores instead of category indices, uses k as an index without bounds checks, or returns the hit count instead of the fraction.
  criteria:
    correctness: All tests pass, including full ties, k larger than the number of categories and an empty input.
    efficiency: Linear in the size of the score matrix, or an explained sort-based solution.
    code_quality: The ranking rule lives in one comparison or one helper; names distinguish categories, scores and labels.
    edge_cases: No products, a single category, all-equal scores and negative scores.
    communication: Explains why the tie-break matters for a reproducible metric and when top-k accuracy is more useful than top-1.
hints:
  - The label is a hit exactly when fewer than k categories rank ahead of it; you do not need the full ranking.
  - For each product, look at the label's score and count the categories that beat it, remembering that an equal score with a lower index also beats it.
  - Return 0.0 for no products; for each row compare every category against the label's score, counting those with a higher score or the same score and a smaller index, add one hit when that count is below k, and divide the hits by the number of products.
followups:
  - How would you return the actual top-k category list for display, efficiently, when there are 50,000 categories?
  - How does top-k accuracy relate to recall at k in a recommender system?
  - Would a different tie-break rule change the metric much in practice, and how would you detect that?
common_errors:
  - Sorting the scores themselves and losing track of which category each score belongs to.
  - Breaking ties by higher index, or not breaking them at all, so results vary between runs.
  - Indexing the sorted list at position k when k exceeds the number of categories.
  - Returning the hit count instead of the fraction, or dividing by zero for an empty input.
