title: Top-k Accuracy of a Product Categoriser
difficulty: easy
competency_keys: [machine_learning, algorithms, problem_solving]
role_tags: [ml, data_scientist, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Top-k Accuracy of a Product Categoriser

  An online catalogue uses a model to suggest a category for each new product listing. The listing form
  shows the model's `k` best suggestions, so the team measures **top-k accuracy**: how often the correct
  category is among those `k` suggestions.

  For product `i`, the model gives an integer score `scores[i][c]` to every category `c` (all rows have
  the same length, the number of categories). Categories are ranked by score **from highest to lowest**,
  and equal scores are ranked by **lower category index first**. Product `i` is a **hit** when its true
  category `labels[i]` is among the first `k` categories of that ranking. If `k` is at least the number
  of categories, every product is a hit.

  Return `hits / number of products` as a float, or `0.0` when there are no products. Answers are
  compared with a tolerance of `1e-6`.

  ### Example 1
  ```
  Input:  scores = [[5, 9, 1], [7, 2, 8], [3, 3, 3]], labels = [1, 0, 2], k = 1
  Output: 0.3333333333333333
  Explanation: product 0 ranks category 1 first (hit); product 1 ranks category 2 first (miss);
  product 2 has a three-way tie, so category 0 is first (miss)
  ```

  ### Example 2
  ```
  Input:  scores = [[5, 9, 1], [7, 2, 8], [3, 3, 3]], labels = [1, 0, 2], k = 2
  Output: 0.6666666666666666
  Explanation: product 1's top two are categories 2 and 0 (hit); product 2's top two are categories 0 and 1 (miss)
  ```

  ### Example 3
  ```
  Input:  scores = [], labels = [], k = 3
  Output: 0.0
  ```

  ### Constraints
  - `0 <= scores.length == labels.length <= 10^4`
  - `1 <= scores[i].length <= 1000`, and every row has the same length
  - `-10^6 <= scores[i][c] <= 10^6`
  - `0 <= labels[i] < scores[i].length`
  - `1 <= k <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: top_k_accuracy
  params:
    - {name: scores, type: "int[][]"}
    - {name: labels, type: "int[]"}
    - {name: k, type: int}
  return_type: float
  comparison: float_tolerance
reference_solutions:
  python: |
    def top_k_accuracy(scores: list[list[int]], labels: list[int], k: int) -> float:
        if not scores:
            return 0.0
        hits = 0
        for row, label in zip(scores, labels):
            target = row[label]
            # categories ranked ahead of the label: higher score, or equal score with a lower index
            ahead = 0
            for c, score in enumerate(row):
                if score > target or (score == target and c < label):
                    ahead += 1
            if ahead < k:
                hits += 1
        return hits / len(scores)
  javascript: |
    function topKAccuracy(scores, labels, k) {
      if (scores.length === 0) return 0.0;
      let hits = 0;
      for (let i = 0; i < scores.length; i++) {
        const row = scores[i];
        const label = labels[i];
        const target = row[label];
        let ahead = 0;
        for (let c = 0; c < row.length; c++) {
          if (row[c] > target || (row[c] === target && c < label)) ahead++;
        }
        if (ahead < k) hits++;
      }
      return hits / scores.length;
    }
