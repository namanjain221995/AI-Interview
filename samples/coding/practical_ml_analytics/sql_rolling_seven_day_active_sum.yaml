expected_concepts:
  - "range-based (value) windows versus row-based windows"
  - "correlated subquery or self-join on a day range"
  - "SUM(...) OVER (ORDER BY day_number RANGE BETWEEN 6 PRECEDING AND CURRENT ROW)"
  - "gaps in time series data"
  - "deterministic ORDER BY"
optimal_complexity: {time: "O(n log n) with a range window or an index range scan per row", space: "O(n)"}
rubric:
  excellent: "Uses a RANGE window frame or a correlated subquery or self-join on day_number - 6 .. day_number, explains why ROWS BETWEEN 6 PRECEDING is wrong with missing days, keeps every original row and orders the output."
  good: "Correct query after a hint about missing days or the inclusive boundary."
  weak: "Uses ROWS BETWEEN 6 PRECEDING, LAG over six rows, a 7-day boundary that is off by one, or fills missing days with invented rows."
  criteria:
    correctness: "All tests pass, including gaps, exact window boundaries, out-of-order inserts and large totals."
    efficiency: "Set-based query; mentions that the primary key index makes each range lookup cheap."
    code_quality: "Clear aliases and an explicitly named rolling_7d_total column."
    edge_cases: "Empty table, a single day, gaps longer than a week and zero-activity days."
    communication: "Explains the difference between the previous six rows and the previous six days."
hints:
  - "The window is defined by calendar days, not by rows; think about what happens to 'the previous six rows' when a day is missing."
  - "For each row you need the rows whose day_number falls between day_number - 6 and day_number inclusive; that is a range condition on the value, which a correlated subquery, a self-join or a value-based window frame can express."
  - "Either SELECT each row with (SELECT SUM(active_users) FROM daily_active x WHERE x.day_number BETWEEN d.day_number - 6 AND d.day_number), or use SUM(active_users) OVER (ORDER BY day_number RANGE BETWEEN 6 PRECEDING AND CURRENT ROW); finish with ORDER BY day_number."
followups:
  - "How would you also output rows for the missing days with a total, using a generated calendar?"
  - "How would you compute a rolling seven-day count of distinct users from a raw events table?"
  - "Which index or partitioning would keep this fast on years of per-tenant data?"
  - "How would you flag days whose total drops more than 30 percent against the previous week?"
common_errors:
  - "Using ROWS BETWEEN 6 PRECEDING AND CURRENT ROW, which spans more than seven days when rows are missing."
  - "Using BETWEEN day_number - 7 AND day_number, which covers eight days."
  - "Filtering to days that have a full seven-day history instead of returning every row."
  - "Leaving out ORDER BY and relying on insertion order."
