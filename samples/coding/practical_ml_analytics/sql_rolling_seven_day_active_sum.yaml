version: 1
slug: sql_rolling_seven_day_active_sum
title: "Rolling Seven-Day Active Users (SQL)"
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data_analyst, data, backend, dba]
time_limit_minutes: 20
prompt_markdown: |
  ## Rolling Seven-Day Active Users

  The product analytics job writes one row per day into `daily_active`. Days are numbered consecutively
  (`day_number` 1 is the launch day), but the job sometimes fails, so **some days have no row at all**.

  | column | type | notes |
  |--------|------|-------|
  | day_number | INTEGER | primary key; `0` or greater |
  | active_users | INTEGER | users active on that day, `0` or greater |

  For **every row** of the table, return `day_number`, `active_users` and `rolling_7d_total`: the sum of
  `active_users` over all rows whose `day_number` lies between `day_number - 6` and `day_number`
  inclusive (the day itself and the six calendar days before it). Missing days simply contribute
  nothing; do not invent rows for them. Order the result by `day_number` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  daily_active
  +------------+--------------+
  | day_number | active_users |
  +------------+--------------+
  | 1          | 100          |
  | 2          | 120          |
  | 3          | 90           |
  | 5          | 110          |
  | 8          | 130          |
  | 9          | 80           |
  | 15         | 60           |
  +------------+--------------+

  Output
  +------------+--------------+------------------+
  | day_number | active_users | rolling_7d_total |
  +------------+--------------+------------------+
  | 1          | 100          | 100              |
  | 2          | 120          | 220              |
  | 3          | 90           | 310              |
  | 5          | 110          | 420              |
  | 8          | 130          | 450              |
  | 9          | 80           | 410              |
  | 15         | 60           | 140              |
  +------------+--------------+------------------+
  Day 8 covers days 2-8 (120 + 90 + 110 + 130); day 15 covers days 9-15 (80 + 60). The six rows before
  day 8 are not the same as the six days before it.
  ```

  ### Example 2
  ```
  daily_active
  +------------+--------------+
  | day_number | active_users |
  +------------+--------------+
  | 1          | 10           |
  | 2          | 20           |
  | 3          | 30           |
  | 4          | 40           |
  | 5          | 50           |
  | 6          | 60           |
  | 7          | 70           |
  | 8          | 80           |
  +------------+--------------+

  Output
  +------------+--------------+------------------+
  | day_number | active_users | rolling_7d_total |
  +------------+--------------+------------------+
  | 1          | 10           | 10               |
  | 2          | 20           | 30               |
  | 3          | 30           | 60               |
  | 4          | 40           | 100              |
  | 5          | 50           | 150              |
  | 6          | 60           | 210              |
  | 7          | 70           | 280              |
  | 8          | 80           | 350              |
  +------------+--------------+------------------+
  On day 8 the window is days 2-8, so day 1 no longer counts.
  ```

  ### Constraints
  - `0 <= rows <= 10^5`
  - `0 <= active_users <= 2 * 10^9`; totals can exceed the 32-bit integer range
languages: [sql]
starter_code:
  sql: |
    -- Return day_number, active_users and rolling_7d_total (days d-6..d), ordered by day_number.
    SELECT day_number, active_users, active_users AS rolling_7d_total
    FROM daily_active
    ORDER BY day_number;
reference_solutions:
  sql: |
    SELECT d.day_number,
           d.active_users,
           (SELECT SUM(x.active_users)
            FROM daily_active x
            WHERE x.day_number BETWEEN d.day_number - 6 AND d.day_number) AS rolling_7d_total
    FROM daily_active d
    ORDER BY d.day_number;
sql_setup: |
  CREATE TABLE daily_active (
    day_number INTEGER PRIMARY KEY,
    active_users INTEGER NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - missing days contribute nothing; a ROWS-based window gets days 8, 9 and 15 wrong"
    ordered: true
    setup_sql: |
      INSERT INTO daily_active (day_number, active_users) VALUES
        (1, 100), (2, 120), (3, 90), (5, 110),
        (8, 130), (9, 80), (15, 60);
    expected_rows: [[1, 100, 100], [2, 120, 220], [3, 90, 310], [5, 110, 420], [8, 130, 450], [9, 80, 410], [15, 60, 140]]
  - id: t2
    description: "Example 2 - consecutive days; day 1 leaves the window on day 8"
    ordered: true
    setup_sql: |
      INSERT INTO daily_active (day_number, active_users) VALUES
        (1, 10), (2, 20), (3, 30), (4, 40),
        (5, 50), (6, 60), (7, 70), (8, 80);
    expected_rows: [[1, 10, 10], [2, 20, 30], [3, 30, 60], [4, 40, 100], [5, 50, 150], [6, 60, 210], [7, 70, 280], [8, 80, 350]]
  - id: t3
    hidden: true
    description: "Empty table returns no rows"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Single day"
    ordered: true
    setup_sql: |
      INSERT INTO daily_active (day_number, active_users) VALUES
        (42, 7);
    expected_rows: [[42, 7, 7]]
  - id: t5
    hidden: true
    description: "Boundary - a day exactly 6 days earlier is included, 7 days earlier is not"
    ordered: true
    setup_sql: |
      INSERT INTO daily_active (day_number, active_users) VALUES
        (10, 1), (16, 2), (17, 4);
    expected_rows: [[10, 1, 1], [16, 2, 3], [17, 4, 6]]
  - id: t6
    hidden: true
    description: "Rows inserted out of order, day 0 present - ORDER BY required"
    ordered: true
    setup_sql: |
      INSERT INTO daily_active (day_number, active_users) VALUES
        (30, 5), (0, 3), (12, 8), (3, 2),
        (6, 1);
    expected_rows: [[0, 3, 3], [3, 2, 5], [6, 1, 6], [12, 8, 9], [30, 5, 5]]
  - id: t7
    hidden: true
    description: "Large values - totals exceed the 32-bit range"
    ordered: true
    setup_sql: |
      INSERT INTO daily_active (day_number, active_users) VALUES
        (1, 2000000000), (2, 2000000000), (3, 2000000000), (4, 0),
        (5, 1500000000);
    expected_rows: [[1, 2000000000, 2000000000], [2, 2000000000, 4000000000], [3, 2000000000, 6000000000], [4, 0, 6000000000], [5, 1500000000, 7500000000]]
  - id: t8
    hidden: true
    description: "Zero-activity days still appear with their totals"
    ordered: true
    setup_sql: |
      INSERT INTO daily_active (day_number, active_users) VALUES
        (1, 0), (2, 0), (9, 0), (10, 5);
    expected_rows: [[1, 0, 0], [2, 0, 0], [9, 0, 0], [10, 5, 5]]
  - id: t9
    hidden: true
    description: "Gaps longer than a week - each total is the day itself"
    ordered: true
    setup_sql: |
      INSERT INTO daily_active (day_number, active_users) VALUES
        (100, 9), (200, 8), (300, 7);
    expected_rows: [[100, 9, 9], [200, 8, 8], [300, 7, 7]]
  - id: t10
    hidden: true
