expected_concepts:
  - squared Euclidean distance with 64-bit arithmetic
  - stable ordering with a secondary key (index) for equal distances
  - majority vote with a deterministic tie-break
  - sorting all points versus a size-k heap or selection
optimal_complexity: {time: "O(n * d + n log k) with a bounded heap (O(n * d + n log n) by sorting)", space: O(n) or O(k) with a heap}
rubric:
  excellent: Computes exact squared distances in 64-bit integers, orders by (distance, index), counts votes among the first min(k, n) neighbours, applies the first-appearance tie-break correctly and discusses a size-k heap or quickselect for large n.
  good: Correct sort-based solution that needs a hint about one detail such as the tie-break order, k larger than n or 32-bit overflow.
  weak: Uses a non-deterministic order for equal distances, breaks vote ties by the smallest label, takes a square root with floating-point comparisons, or overflows on large coordinates.
  criteria:
    correctness: All tests pass, including distance ties, vote ties, k larger than n and 10-dimensional points at the limits.
    efficiency: O(n log n) sorting or O(n log k) heap selection; no repeated scans per neighbour.
    code_quality: Separate helpers for distance and voting, and the ordering key written explicitly as (distance, index).
    edge_cases: k = 1, k > n, identical points, negative coordinates and overflow-sized distances.
    communication: Explains the tie-break rules and why squared distance gives the same ordering as Euclidean distance.
hints:
  - You never need the actual Euclidean distance; the squared distance gives the same ordering and stays an exact integer.
  - Make the neighbour ordering fully deterministic by sorting on the pair (distance, original index), and remember that k can exceed the number of points.
  - Sort the indices by (squared distance using 64-bit integers, index), keep the first min(k, n), then walk them in order counting votes per label and recording the rank where each label first appears; return the label with the highest count, preferring the smaller first-appearance rank on ties.
followups:
  - How would you pick the k nearest points without sorting everything?
  - With millions of historical points, what index structure would speed up the query (k-d tree, ball tree, approximate search)?
  - How would you change the vote so that closer neighbours count more than distant ones?
  - Why does feature scaling matter for k-NN when coordinates have different units?
common_errors:
  - Storing squared distances in 32-bit integers, which overflow for large coordinates in many dimensions.
  - Using an unstable sort without the index as a secondary key, so equal distances come out in arbitrary order.
  - Breaking vote ties by the smallest or largest label instead of by first appearance.
  - Indexing past the end when k is larger than the number of training points.
