title: k-NN Delivery Zone Classifier
difficulty: medium
competency_keys: [machine_learning, algorithms, data_structures]
role_tags: [ml, data_scientist, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## k-NN Delivery Zone Classifier

  A logistics service assigns every new drop-off point to a delivery zone. Historical drop-off points
  are already labelled with their zone id, and the service labels a new point with a
  **k-nearest-neighbours** vote.

  You are given `train_points` (`n` points with integer coordinates, all of the same dimension `d`),
  their zone ids `train_labels`, a `query` point of dimension `d` and an integer `k`.

  1. The distance between two points is the **squared Euclidean distance**, the sum over all
     coordinates of `(a_j - b_j)^2`. Coordinates are integers, so distances are exact integers, but
     they can exceed the 32-bit range.
  2. Order the training points by distance to `query` ascending; points at the **same distance**
     are ordered by their **index** in `train_points` (lower index first). The neighbours are the
     first `min(k, n)` points of this ordering.
  3. Each neighbour casts one vote for its label. Return the label with the **most votes**.
  4. If several labels tie for the most votes, return the tied label whose **first appearance** in the
     neighbour ordering comes earliest (the label of the closest neighbour among the tied labels).

  ### Example 1
  ```
  Input:  train_points = [[0, 0], [1, 1], [5, 5], [6, 5], [1, 0]], train_labels = [1, 2, 2, 2, 1],
          query = [0, 1], k = 3
  Output: 1
  Explanation: the distances are 1, 1, 41, 52 and 2. The three nearest points are index 0 (label 1),
  index 1 (label 2, same distance as index 0 but a higher index) and index 4 (label 1). Label 1 has
  two votes. Label 2 has more points overall, but they are too far away to count.
  ```

  ### Example 2
  ```
  Input:  train_points = [[2, 3], [4, 3], [3, 5], [3, 0]], train_labels = [7, 4, 4, 7],
          query = [3, 3], k = 4
  Output: 7
  Explanation: the neighbour ordering is index 0 (distance 1), 1 (distance 1), 2 (distance 4) and
  3 (distance 9). Labels 7 and 4 have two votes each; label 7 appears first in the ordering.
  ```

  ### Example 3
  ```
  Input:  train_points = [[10], [20]], train_labels = [3, 5], query = [16], k = 5
  Output: 5
  Explanation: k is larger than n, so both points vote. The one-vote tie goes to label 5, whose point
  (distance 16) is closer than label 3's point (distance 36).
  ```

  ### Constraints
  - `1 <= n == train_points.length == train_labels.length <= 10^4`
  - `1 <= d == query.length == train_points[i].length <= 10`
  - `-10^4 <= coordinates <= 10^4`
  - `0 <= train_labels[i] <= 10^6`
  - `1 <= k <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: knn_predict
  params:
    - {name: train_points, type: "int[][]"}
    - {name: train_labels, type: "int[]"}
    - {name: query, type: "int[]"}
    - {name: k, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def knn_predict(train_points: list[list[int]], train_labels: list[int], query: list[int], k: int) -> int:
        def distance(point: list[int]) -> int:
            return sum((a - b) * (a - b) for a, b in zip(point, query))

        order = sorted(range(len(train_points)), key=lambda i: (distance(train_points[i]), i))
        neighbours = order[:k]
        votes: dict[int, int] = {}
        first_seen: dict[int, int] = {}
        for rank, i in enumerate(neighbours):
            label = train_labels[i]
            votes[label] = votes.get(label, 0) + 1
            first_seen.setdefault(label, rank)
        return min(votes, key=lambda label: (-votes[label], first_seen[label]))
  javascript: |
    function knnPredict(trainPoints, trainLabels, query, k) {
      const dist = trainPoints.map((p) => {
        let s = 0;
        for (let j = 0; j < query.length; j++) s += (p[j] - query[j]) * (p[j] - query[j]);
        return s;
      });
      const order = trainPoints.map((_, i) => i).sort((a, b) => dist[a] - dist[b] || a - b);
      const votes = new Map();
      const firstSeen = new Map();
      order.slice(0, k).forEach((i, rank) => {
        const label = trainLabels[i];
        votes.set(label, (votes.get(label) || 0) + 1);
        if (!firstSeen.has(label)) firstSeen.set(label, rank);
      });
      let best = null;
      for (const [label, count] of votes) {
        if (best === null || count > votes.get(best) || (count === votes.get(best) && firstSeen.get(label) < firstSeen.get(best))) {
          best = label;
        }
      }
      return best;
    }
