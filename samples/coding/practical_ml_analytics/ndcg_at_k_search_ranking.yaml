expected_concepts:
  - "discounted cumulative gain with a logarithmic position discount"
  - "exponential gain 2^rel - 1 for graded relevance"
  - "normalising by the ideal ordering of all results"
  - "cut-off at min(k, n) and the zero-ideal guard"
  - "counting sort for small integer grades"
optimal_complexity: {time: "O(n log n), or O(n + k) with counting sort over the grades", space: "O(n)"}
rubric:
  excellent: "Implements DCG with the exact gain and discount, builds the ideal DCG from all grades sorted descending and cut at k, guards the zero ideal, handles k larger than n, and discusses counting sort for small grades."
  good: "Correct formula and normalisation with a small slip fixed after a hint (for example the 0-based discount or the ideal cut-off)."
  weak: "Uses rel instead of 2^rel - 1, discounts with log2(p) at position 0, builds the ideal only from the first k results, or divides by zero."
  criteria:
    correctness: "All tests pass, including relevant results below the cut-off and k larger than the list."
    efficiency: "One sort (or counting pass) and two linear DCG passes."
    code_quality: "A single DCG helper reused for the actual and ideal orderings."
    edge_cases: "Empty list, all-zero grades, k = 1 and k beyond the list length."
    communication: "Explains why the ideal must consider every result, not just the top k."
hints:
  - "Write a helper that computes DCG for any ordering of grades; you then need it for two orderings."
  - "The second ordering is the best one possible: all the grades sorted from highest to lowest. Only the first min(k, n) positions count in both, and position p is divided by log2(p + 2)."
  - "Compute idealDCG from the grades sorted descending and cut at k; if it is zero return 0.0, otherwise return DCG of the given order divided by idealDCG. Use 2^rel - 1 as the gain."
followups:
  - "Why does NDCG use a logarithmic discount, and what would a linear one reward instead?"
  - "How would you average NDCG over thousands of queries, and what do you do with queries that have no relevant results?"
  - "How does NDCG differ from precision@k or mean reciprocal rank when grades are graded rather than binary?"
  - "How would you compute NDCG when only some returned results have been rated?"
common_errors:
  - "Using rel as the gain instead of 2^rel - 1."
  - "Discounting position 0 by log2(0) or log2(1), which divides by zero."
  - "Building the ideal ordering from only the first k results instead of all results."
  - "Forgetting the zero-ideal case and returning NaN."
