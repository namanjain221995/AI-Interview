slug: ndcg_at_k_search_ranking
title: NDCG@k for Search Results
difficulty: medium
competency_keys: [machine_learning, algorithms]
role_tags: [ml, data_scientist, backend, llm]
time_limit_minutes: 20
prompt_markdown: |
  ## NDCG@k for Search Results

  The store's product search is being retrained, and human raters graded the results one query returned.
  Each result got a **relevance grade** from `0` (useless) to `10` (perfect). The grades are given in the
  order the search engine ranked the results: `relevance[0]` is the top result.

  Score the ranking with **NDCG@k** (normalised discounted cumulative gain at cut-off `k`). Positions
  are 0-based and only the first `min(k, n)` results count, where `n = relevance.length`:

  - The gain of a result with grade `rel` is `2^rel - 1`; at position `p` it is discounted by
    `log2(p + 2)`, so `DCG@k = sum over p < min(k, n) of (2^relevance[p] - 1) / log2(p + 2)`.
  - The **ideal** DCG@k is the DCG@k of the same grades sorted from highest to lowest (the best
    possible ordering of **all** `n` results, then cut at `k`).
  - `NDCG@k = DCG@k / idealDCG@k`, and it is `0.0` when the ideal DCG@k is `0` (for example when every
    grade is `0` or there are no results).

  Return NDCG@k as a floating-point number. Answers within `10^-6` are accepted.

  ### Example 1
  ```
  Input:  relevance = [3, 2, 3, 0, 1, 2], k = 3
  Output: 0.9594535145926796
  Explanation: DCG@3 = 7/1 + 3/log2(3) + 7/2 = 12.3928...; the ideal order starts 3, 3, 2, so idealDCG@3 = 7/1 + 7/log2(3) + 3/2 = 12.9165...
  ```

  ### Example 2
  ```
  Input:  relevance = [0, 0, 1], k = 5
  Output: 0.5
  Explanation: only three results exist; DCG = 1/log2(4) = 0.5 and the ideal ordering [1, 0, 0] scores 1/log2(2) = 1
  ```

  ### Example 3
  ```
  Input:  relevance = [0, 0, 0], k = 2
  Output: 0.0
  ```

  ### Constraints
  - `0 <= relevance.length <= 10^4`
  - `0 <= relevance[i] <= 10`
  - `1 <= k <= 10^4`

  **Follow-up:** sorting all grades costs `O(n log n)`; since grades are small integers, can you build
  the ideal ordering in `O(n + k)`?
languages: [python, javascript, typescript, java, go, cpp]
