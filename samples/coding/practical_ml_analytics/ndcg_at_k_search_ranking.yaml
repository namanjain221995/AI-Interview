  return_type: "float"
  comparison: float_tolerance
  tolerance: 1e-06
reference_solutions:
  python: |
    import math


    def ndcg_at_k(relevance: list[int], k: int) -> float:
        def dcg(labels: list[int]) -> float:
            return sum((2 ** rel - 1) / math.log2(pos + 2) for pos, rel in enumerate(labels[:k]))

        ideal = dcg(sorted(relevance, reverse=True))
        if ideal == 0:
            return 0.0
        return dcg(relevance) / ideal
  javascript: |
    function ndcgAtK(relevance, k) {
      const dcg = (labels) => {
        let sum = 0;
        for (let pos = 0; pos < Math.min(k, labels.length); pos++) {
          sum += (2 ** labels[pos] - 1) / Math.log2(pos + 2);
        }
        return sum;
      };
      const ideal = dcg([...relevance].sort((a, b) => b - a));
      if (ideal === 0) return 0.0;
      return dcg(relevance) / ideal;
    }
