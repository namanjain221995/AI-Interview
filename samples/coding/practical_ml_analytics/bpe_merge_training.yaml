expected_concepts:
  - simulating an iterative training loop exactly as specified
  - hash map of adjacent-pair counts
  - deterministic tie-breaking on (left, right) string order
  - non-overlapping left-to-right replacement
  - incremental pair-count updates or priority queues for speed
optimal_complexity: {time: "O(num_merges * L) where L is the total number of characters (incremental count updates make each merge proportional to the affected words)", space: "O(L)"}
rubric:
  excellent: "Implements the loop exactly - pair counting including overlapping positions, tie-break on (left, right) string order, the stop rule, non-overlapping left-to-right merging - and explains how real tokenizers avoid recounting everything by updating counts only for words containing the merged pair."
  good: "Correct output after a hint on tie-breaking or overlapping runs such as aaa; recounts every round with a clear structure."
  weak: "Merges overlapping occurrences or right to left, ignores the tie-break, stops on the wrong count, or treats duplicate words as one."
  criteria:
    correctness: "All tests pass, including runs of one letter, ties between multi-character symbols and the merge budget."
    efficiency: "Each round is linear in the corpus size; mentions word-frequency deduplication and incremental pair updates."
    code_quality: "Separate helpers for counting, choosing and applying a merge; symbols kept as lists rather than re-split strings."
    edge_cases: "Empty corpus, zero merges, single-character words and counts that fall below 2."
    communication: "Explains why counting allows overlaps while merging does not, and how the learned merges are later applied to new text."
hints:
  - Keep each word as a list of symbols and simulate the rounds exactly - count, pick, stop check, merge, record - until the budget is used up.
  - A hash map from (left, right) to count rebuilt each round is enough at this size. Pick the winner by highest count, then smallest left symbol, then smallest right symbol, comparing symbols as strings rather than by length.
  - When applying a merge, build a new symbol list per word with an index that advances by two after a replacement and by one otherwise, so a run like a a a becomes aa a. Stop as soon as the best count is below two, and record each merge as left, a space, then right.
followups:
  - How would you encode a new word with the learned merges, and why must merges be applied in learned order?
  - How can you avoid recounting all pairs after every merge on a corpus of millions of words?
  - Why do production tokenizers work on bytes rather than characters, and what does that solve?
  - How would you add an end-of-word marker, and what changes in the merges?
common_errors:
  - Merging overlapping occurrences, turning a a a into two merged symbols.
  - Merging right to left, which yields a aa instead of aa a.
  - Ignoring the tie-break or comparing symbols by length.
  - Deduplicating the corpus and losing word frequencies.
  - Continuing to merge pairs that occur only once.
