reference_solutions:
  python: |
    def learn_bpe_merges(corpus: list[str], num_merges: int) -> list[str]:
        words = [list(word) for word in corpus]
        merges: list[str] = []
        while len(merges) < num_merges:
            counts: dict[tuple[str, str], int] = {}
            for word in words:
                for pair in zip(word, word[1:]):
                    counts[pair] = counts.get(pair, 0) + 1
            best = None
            best_count = 0
            for pair, count in counts.items():
                if count > best_count or (count == best_count and pair < best):
                    best, best_count = pair, count
            if best is None or best_count < 2:
                break
            left, right = best
            joined = left + right
            for idx, word in enumerate(words):
                out = []
                i = 0
                while i < len(word):
                    if i + 1 < len(word) and word[i] == left and word[i + 1] == right:
                        out.append(joined)
                        i += 2
                    else:
                        out.append(word[i])
                        i += 1
                words[idx] = out
            merges.append(f"{left} {right}")
        return merges
  javascript: |
    function learnBpeMerges(corpus, numMerges) {
      let words = corpus.map((word) => word.split(""));
      const merges = [];
      while (merges.length < numMerges) {
        const counts = new Map();
        for (const word of words) {
          for (let i = 0; i + 1 < word.length; i++) {
            const key = word[i] + " " + word[i + 1];
            counts.set(key, (counts.get(key) || 0) + 1);
          }
        }
        let bestLeft = null;
        let bestRight = null;
        let bestCount = 0;
        for (const [key, count] of counts) {
          const [left, right] = key.split(" ");
          const better =
            count > bestCount ||
            (count === bestCount &&
              (left < bestLeft || (left === bestLeft && right < bestRight)));
          if (better) {
            bestLeft = left;
            bestRight = right;
            bestCount = count;
          }
        }
        if (bestLeft === null || bestCount < 2) break;
        const joined = bestLeft + bestRight;
        words = words.map((word) => {
          const out = [];
          let i = 0;
          while (i < word.length) {
            if (i + 1 < word.length && word[i] === bestLeft && word[i + 1] === bestRight) {
              out.push(joined);
              i += 2;
            } else {
              out.push(word[i]);
              i += 1;
            }
          }
          return out;
        });
        merges.push(bestLeft + " " + bestRight);
      }
      return merges;
    }
