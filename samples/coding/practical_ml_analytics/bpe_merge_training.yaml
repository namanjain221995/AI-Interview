slug: bpe_merge_training
title: Train Byte-Pair Encoding Merges
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [llm, ml, data_scientist]
time_limit_minutes: 30
prompt_markdown: |
  ## Train Byte-Pair Encoding Merges

  The search team is building a small subword tokenizer for incident-ticket text and wants to learn
  its merge table with byte-pair encoding (BPE). You are given `corpus`, a list of lowercase words
  (a word may appear several times; every occurrence counts), and the maximum number of merges
  `num_merges`.

  At the start every word is split into single-character **symbols**: `"deploy"` becomes
  `d e p l o y`. Then training repeats these rounds:

  1. **Count** every pair of adjacent symbols in every word. Each position counts, so the symbols
     `a a a` contain the pair `(a, a)` twice.
  2. **Pick** the pair with the highest count. Break ties by the smaller left symbol, then by the
     smaller right symbol, using plain string comparison (so `"ab" < "b"`).
  3. **Stop** if there is no pair or the best count is less than `2`.
  4. **Merge**: in every word, scan left to right and replace each occurrence of the chosen left symbol
     immediately followed by the chosen right symbol with one joined symbol. Occurrences do not
     overlap: after a replacement the scan continues after the new symbol, so `a a a` becomes `aa a`.
  5. **Record** the merge as the string `"left right"` (the two symbols separated by one space).

  Training also stops once `num_merges` merges are recorded. Return the recorded merges in the order
  they were learned.

  ### Example 1
  ```
  Input:  corpus = ["deploy", "deploys", "redeploy", "employ"], num_merges = 4
  Output: ["l o", "lo y", "p loy", "d e"]
  Explanation: round 1 - (l, o), (o, y) and (p, l) all occur 4 times; "l" is the smallest left symbol.
  Round 2 - (lo, y) and (p, lo) both occur 4 times and "lo" < "p". Round 3 merges (p, loy).
  Round 4 - (d, e) and (e, ploy) both occur 3 times and "d" < "e".
  ```

  ### Example 2
  ```
  Input:  corpus = ["cache", "cached", "caches", "ache"], num_merges = 3
  Output: ["a c", "ac h", "ach e"]
  ```

  ### Example 3
  ```
  Input:  corpus = ["log", "gap"], num_merges = 5
  Output: []
  Explanation: every adjacent pair occurs only once, so training stops before the first merge.
  ```

  ### Constraints
  - `0 <= corpus.length <= 200`
  - `1 <= corpus[i].length <= 20`, lowercase English letters only
  - `0 <= num_merges <= 100`
