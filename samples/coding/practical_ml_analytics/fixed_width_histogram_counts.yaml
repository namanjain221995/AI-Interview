expected_concepts:
  - mapping a value to a bucket index with arithmetic instead of searching
  - closed upper edge for the last bin
  - exact integer arithmetic to avoid floating-point edge errors
  - filtering out-of-range values before indexing
optimal_complexity: {time: O(n + bins), space: O(bins)}
rubric:
  excellent: Computes each bin index directly with integer arithmetic, handles the closed upper edge and out-of-range values cleanly, and explains why dividing by a floating-point width can misplace edge values.
  good: Correct direct-index solution that needs one hint, for example about the value equal to high or about rounding at fractional edges.
  weak: Searches every bin for each value, drops or crashes on the value equal to high, or uses a rounded floating-point width that fails on exact edges.
  criteria:
    correctness: All tests pass, including values on fractional edges and the value equal to high.
    efficiency: One pass over the values with a constant-time index computation; O(bins) extra space.
    code_quality: The range check and the index formula are each written once and read clearly.
    edge_cases: Empty input, a single bin, more bins than the integer span and all values out of range.
    communication: Explains the half-open bins and the special case for the top of the range.
hints:
  - You do not need to compare a value against every bin; its position inside the range tells you its bin directly.
  - The offset of a value from low, scaled by the number of bins and divided by the range width, gives the bin; think about which value would produce an index one past the end.
  - Skip values outside the range, send the value equal to high to the last bin, and for every other value multiply its offset from low by bins and integer-divide by high minus low, all in integers, then add one to that bin's count.
followups:
  - How would you choose low, high and bins automatically for a new metric?
  - Latency is long-tailed; how would logarithmic bins change the index formula?
  - How would you merge histograms from many servers that used the same bin layout?
common_errors:
  - Indexing past the end of the list for the value equal to high.
  - Computing the width as a float and dividing by it, which puts values on fractional edges into the lower bin.
  - Counting out-of-range values in the first or last bin instead of ignoring them.
  - Integer division of high minus low by bins, which gives the wrong width when it does not divide evenly.
