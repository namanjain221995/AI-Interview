title: Fixed-Width Histogram of Response Times
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [data_analyst, sre, data, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Fixed-Width Histogram of Response Times

  A monitoring page draws a histogram of API response times, measured in whole milliseconds. The
  range `[low, high]` is split into `bins` **equal-width** bins, where
  `width = (high - low) / bins` (the width may be fractional).

  - Bin `i` (0-based) covers `low + i * width <= v < low + (i + 1) * width`, so a value that sits
    exactly on a boundary belongs to the **upper** bin.
  - The value `v == high` is the one exception: it goes into the **last** bin.
  - Values below `low` or above `high` are ignored.

  Equivalently, an in-range value `v < high` belongs to bin `floor((v - low) * bins / (high - low))`.
  Bin edges are often fractional, so compute the bin with **exact integer arithmetic**; dividing by
  a rounded floating-point width can put a value that sits exactly on an edge into the wrong bin.

  Return a list of `bins` counts, where position `i` is the number of values in bin `i`.

  ### Example 1
  ```
  Input:  values = [12, 47, 5, 99, 100, 63, 150, -3], low = 0, high = 100, bins = 4
  Output: [2, 1, 1, 2]
  Explanation: the bins are [0, 25), [25, 50), [50, 75) and [75, 100]. 100 equals high and goes into
  the last bin; 150 and -3 are out of range and ignored.
  ```

  ### Example 2
  ```
  Input:  values = [10, 20, 30, 0, 29], low = 0, high = 30, bins = 9
  Output: [1, 0, 0, 1, 0, 0, 1, 0, 2]
  Explanation: width is 10/3. 10 sits exactly on the edge between bins 2 and 3 and goes to bin 3;
  20 goes to bin 6; 29 and 30 both land in the last bin.
  ```

  ### Constraints
  - `0 <= values.length <= 10^5`
  - `-10^6 <= values[i] <= 10^7`
  - `0 <= low < high <= 10^6`
  - `1 <= bins <= 1000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: histogram_counts
  params:
    - {name: values, type: "int[]"}
    - {name: low, type: int}
    - {name: high, type: int}
    - {name: bins, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def histogram_counts(values: list[int], low: int, high: int, bins: int) -> list[int]:
        counts = [0] * bins
        span = high - low
        for v in values:
            if v < low or v > high:
                continue
            index = bins - 1 if v == high else (v - low) * bins // span
            counts[index] += 1
        return counts
  javascript: |
    function histogramCounts(values, low, high, bins) {
      const counts = new Array(bins).fill(0);
      const span = high - low;
      for (const v of values) {
        if (v < low || v > high) continue;
        const index = v === high ? bins - 1 : Math.floor(((v - low) * bins) / span);
        counts[index] += 1;
      }
      return counts;
    }
