      - [9, 2, 1801, 1801, 1]
      - [9, 3, 3602, 3602, 1]
      - [9, 4, 5403, 5403, 1]
  - id: t7
    description: "Users interleaved in time - gaps and session numbers are computed per user, never across users"
    hidden: true
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (1, 1, 100), (2, 2, 200), (3, 1, 300), (4, 2, 400), (5, 1, 5000), (6, 2, 5100),
        (7, 3, 150);
    expected_rows:
      - [1, 1, 100, 300, 2]
      - [1, 2, 5000, 5000, 1]
      - [2, 1, 200, 400, 2]
      - [2, 2, 5100, 5100, 1]
      - [3, 1, 150, 150, 1]
  - id: t8
    description: "Large epoch-like timestamps and a gap spanning almost the whole range"
    hidden: true
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (10, 4, 2000000000), (11, 4, 1999999000), (12, 4, 1999990000), (13, 8, 0), (14, 8, 2000000000);
    expected_rows:
      - [4, 1, 1999990000, 1999990000, 1]
      - [4, 2, 1999999000, 2000000000, 2]
      - [8, 1, 0, 0, 1]
      - [8, 2, 2000000000, 2000000000, 1]
