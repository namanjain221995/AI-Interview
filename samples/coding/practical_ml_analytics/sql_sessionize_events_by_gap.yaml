expected_concepts:
  - "gaps-and-islands with LAG to flag session starts"
  - "running SUM over a window to turn start flags into session numbers"
  - "PARTITION BY user_id with a deterministic ORDER BY viewed_at, id"
  - "NULL handling for each user's first view"
  - "aggregating per (user_id, session_number)"
optimal_complexity: {time: "O(n log n) for the window sorts (O(n) with an index on (user_id, viewed_at, id))", space: "O(n)"}
rubric:
  excellent: "Flags session starts with LAG partitioned by user and ordered by viewed_at and id, treats the first view (NULL previous) as a start, turns flags into numbers with a running SUM using an explicit ROWS frame, aggregates per session and explains the inclusive 1800-second boundary and the index that supports it."
  good: "Correct query after a hint about the first view's NULL gap, the inclusive boundary or numbering per user."
  weak: "Groups by fixed 30-minute time buckets, orders by id instead of time, numbers sessions globally across users, or splits on gaps of exactly 1800 seconds."
  criteria:
    correctness: "All tests pass, including exact-boundary gaps, duplicate timestamps, interleaved users and ids out of time order."
    efficiency: "Set-based window functions instead of a correlated subquery per row; mentions an index on (user_id, viewed_at, id)."
    code_quality: "Readable CTE steps (flag, number, aggregate), clear aliases and the required column names."
    edge_cases: "Empty table, single view, many views at the same second and very large timestamps."
    communication: "Explains the gaps-and-islands pattern and why the window ORDER BY needs a tie-breaker."
hints:
  - Think of each view as either starting a new session or continuing the previous one. If you could mark every view with a 1 or a 0 for that, how would you turn the marks into session numbers?
  - A window function can look at the previous view of the same user in time order. A view starts a session when it has no previous view or the gap to the previous view is more than 1800 seconds. A running total of those start marks per user gives the session number.
  - In one step use LAG over a window partitioned by user_id and ordered by viewed_at then id to flag starts (a missing previous value counts as a start). In the next step take a running SUM of the flags over the same window ordering. Finally group by user_id and session number, take MIN, MAX and COUNT, and order by user_id and session number.
followups:
  - Which index makes this query efficient on a table with hundreds of millions of rows?
  - How would you compute sessions incrementally as new views stream in each hour?
  - How would you report the median session length per user?
  - What changes if the timeout differs per platform (web versus mobile)?
common_errors:
  - Treating the first view's NULL gap as a continuation, so session numbering starts at 0 or the first session is lost.
  - Using a gap of 1800 or more instead of more than 1800 as the split rule.
  - Ordering by id instead of viewed_at, which breaks sessions when ids are out of time order.
  - Forgetting PARTITION BY user_id, so one user's views continue another user's session.
  - Bucketing by fixed 30-minute windows instead of measuring the gap between consecutive views.
