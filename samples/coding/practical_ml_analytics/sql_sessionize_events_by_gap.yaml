version: 1
slug: sql_sessionize_events_by_gap
title: "Sessionise Page Views by Inactivity Gap (SQL)"
difficulty: hard
competency_keys: [sql, databases]
role_tags: [data_analyst, data, backend, dba]
time_limit_minutes: 30
prompt_markdown: |
  ## Sessionise Page Views by Inactivity Gap

  The product analytics team stores raw page views in table `page_views`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key; ids are assigned by the ingestion pipeline and do **not** follow time order |
  | user_id | INTEGER | the viewer |
  | viewed_at | INTEGER | time of the view in seconds since the epoch |

  They want to split each user's activity into **sessions**. Order each user's views by `viewed_at`,
  breaking ties by `id`. A user's first view starts session `1`. Every later view continues the current
  session when it comes **at most 1800 seconds** (30 minutes) after the user's previous view, and starts
  the next session when the gap is **more than 1800 seconds**. Sessions are numbered per user: `1`, `2`,
  `3`, ...

  Return one row per session with the columns `user_id`, `session_number`, `start_at` (time of the
  session's first view), `end_at` (time of its last view) and `views` (number of views in it), ordered by
  `user_id`, then `session_number`.

  Write standard SQL that runs on both PostgreSQL and SQLite (window functions are available).

  ### Example 1
  ```
  page_views
  +----+---------+-----------+
  | id | user_id | viewed_at |
  +----+---------+-----------+
  | 1  | 1       | 0         |
  | 2  | 2       | 100       |
  | 3  | 1       | 600       |
  | 4  | 1       | 2400      |
  | 5  | 1       | 4300      |
  | 6  | 2       | 5000      |
  | 7  | 1       | 4400      |
  +----+---------+-----------+

  Output
  +---------+----------------+----------+--------+-------+
  | user_id | session_number | start_at | end_at | views |
  +---------+----------------+----------+--------+-------+
  | 1       | 1              | 0        | 2400   | 3     |
  | 1       | 2              | 4300     | 4400   | 2     |
  | 2       | 1              | 100      | 100    | 1     |
  | 2       | 2              | 5000     | 5000   | 1     |
  +---------+----------------+----------+--------+-------+
  User 1: 600 -> 2400 is a gap of exactly 1800 seconds, so the session continues; 2400 -> 4300 is
  1900 seconds, so a second session starts. User 2's two views are 4900 seconds apart.
  ```

  ### Example 2
  ```
  page_views
  +----+---------+-----------+
  | id | user_id | viewed_at |
  +----+---------+-----------+
  | 1  | 7       | 9000      |
  | 2  | 7       | 1000      |
  | 3  | 7       | 1500      |
  | 4  | 7       | 9000      |
  +----+---------+-----------+

  Output
  +---------+----------------+----------+--------+-------+
  | user_id | session_number | start_at | end_at | views |
  +---------+----------------+----------+--------+-------+
  | 7       | 1              | 1000     | 1500   | 2     |
  | 7       | 2              | 9000     | 9000   | 2     |
  +---------+----------------+----------+--------+-------+
  Ids do not follow time order. The two views at 9000 are 0 seconds apart and share a session.
  ```

  ### Constraints
  - `0 <= rows <= 10^5`
  - `0 <= viewed_at <= 2 * 10^9`
  - A user may have several views at the same second.
languages: [sql]
starter_code:
  sql: |
    -- Return user_id, session_number, start_at, end_at, views ordered by user_id, session_number.
    SELECT user_id, 1 AS session_number, MIN(viewed_at) AS start_at, MAX(viewed_at) AS end_at,
           COUNT(*) AS views
    FROM page_views
    GROUP BY user_id
    ORDER BY user_id;
reference_solutions:
  sql: |
    WITH flagged AS (
      SELECT
        id,
        user_id,
        viewed_at,
        CASE
          WHEN viewed_at - LAG(viewed_at) OVER (PARTITION BY user_id ORDER BY viewed_at, id) <= 1800 THEN 0
          ELSE 1
        END AS starts_session
      FROM page_views
    ),
    numbered AS (
      SELECT
        user_id,
        viewed_at,
        SUM(starts_session) OVER (
          PARTITION BY user_id ORDER BY viewed_at, id
          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
        ) AS session_number
      FROM flagged
    )
    SELECT
      user_id,
      session_number,
      MIN(viewed_at) AS start_at,
      MAX(viewed_at) AS end_at,
      COUNT(*) AS views
    FROM numbered
    GROUP BY user_id, session_number
    ORDER BY user_id, session_number;
sql_setup: |
  CREATE TABLE page_views (
    id INTEGER PRIMARY KEY,
    user_id INTEGER NOT NULL,
    viewed_at INTEGER NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - a gap of exactly 1800 continues the session, 1900 starts a new one; numbering per user"
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (1, 1, 0), (2, 2, 100), (3, 1, 600), (4, 1, 2400), (5, 1, 4300), (6, 2, 5000),
        (7, 1, 4400);
    expected_rows:
      - [1, 1, 0, 2400, 3]
      - [1, 2, 4300, 4400, 2]
      - [2, 1, 100, 100, 1]
      - [2, 2, 5000, 5000, 1]
  - id: t2
    description: "Example 2 - ids are not in time order; two views at the same second share a session"
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (1, 7, 9000), (2, 7, 1000), (3, 7, 1500), (4, 7, 9000);
    expected_rows: [[7, 1, 1000, 1500, 2], [7, 2, 9000, 9000, 2]]
  - id: t3
    description: "Empty table returns no rows"
    hidden: true
    ordered: true
    expected_rows: []
  - id: t4
    description: "Single view is a one-view session that starts and ends at the same time"
    hidden: true
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (42, 5, 123456);
    expected_rows: [[5, 1, 123456, 123456, 1]]
  - id: t5
    description: "Gaps of exactly 1800 chain into one long session (inclusive boundary)"
    hidden: true
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (1, 9, 0), (2, 9, 1800), (3, 9, 3600), (4, 9, 5400), (5, 9, 7200);
    expected_rows: [[9, 1, 0, 7200, 5]]
  - id: t6
    description: "Gaps of 1801 split every view into its own session (off-by-one on > vs >=)"
    hidden: true
    ordered: true
