slug: cosine_top_k_similar_items
title: Top-k Similar Products by Embedding
difficulty: medium
competency_keys: [machine_learning, algorithms, data_structures]
role_tags: [ml, llm, backend, data_scientist]
time_limit_minutes: 20
prompt_markdown: |
  ## Top-k Similar Products by Embedding

  The "you may also like" panel shows the products whose **embedding vectors** point in the most
  similar direction to the product a shopper is viewing. The embedding service exports the catalogue
  as one flat list: `m` products, each a vector of `dim` numbers, stored one after another, so product
  `i` is `embeddings[i * dim]` to `embeddings[i * dim + dim - 1]` and `m = embeddings.length / dim`.

  The similarity of product `i` to the `query` vector (length `dim`) is the **cosine similarity**
  `dot(v_i, query) / (|v_i| * |query|)`, where `|x|` is the Euclidean length. If `v_i` or `query` has
  length zero, the similarity is defined as `0.0`.

  Return the indices of the `min(k, m)` most similar products, ordered by similarity **descending**;
  products with equal similarity are ordered by **lower index first**. Treat two similarities as equal
  when they differ by at most `10^-9`, so floating-point noise does not decide ties.

  ### Example 1
  ```
  Input:  embeddings = [1.0, 0.0, 0.0, 1.0, 1.0, 1.0, -1.0, 0.0], dim = 2, query = [2.0, 1.0], k = 2
  Output: [2, 0]
  Explanation: the products are [1, 0], [0, 1], [1, 1] and [-1, 0]; their similarities are 0.894, 0.447, 0.949 and -0.894
  ```

  ### Example 2
  ```
  Input:  embeddings = [0.0, 0.0, 0.0, 1.0, 2.0, 2.0, 1.0, 2.0, 2.0, 0.0, -3.0, 0.0], dim = 3, query = [1.0, 0.0, 0.0], k = 4
  Output: [1, 2, 0, 3]
  Explanation: products 1 and 2 are identical (1/3 each, lower index first); product 0 is a zero vector and product 3 is orthogonal, both 0.0
  ```

  ### Example 3
  ```
  Input:  embeddings = [0.5, -0.5], dim = 1, query = [3.0], k = 5
  Output: [0, 1]
  ```

  ### Constraints
  - `1 <= dim <= 512`, `embeddings.length` is a multiple of `dim` and `0 <= m <= 10^4`
  - `query.length == dim`
  - `-10^6 <= embeddings[j], query[j] <= 10^6`
  - `1 <= k <= 10^4`

  **Follow-up:** sorting all `m` products costs `O(m log m)` after scoring; how would you keep only the
  best `k` in `O(m log k)`, and why can you skip normalising the query when ranking?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: top_k_similar
  params:
    - {name: embeddings, type: "float[]"}
    - {name: dim, type: int}
    - {name: query, type: "float[]"}
    - {name: k, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import math
    from functools import cmp_to_key


    def top_k_similar(embeddings: list[float], dim: int, query: list[float], k: int) -> list[int]:
        m = len(embeddings) // dim
        q_norm = math.sqrt(sum(x * x for x in query))
        scores = []
        for i in range(m):
            row = embeddings[i * dim:(i + 1) * dim]
            norm = math.sqrt(sum(x * x for x in row))
            if norm == 0 or q_norm == 0:
                scores.append(0.0)
            else:
                scores.append(sum(a * b for a, b in zip(row, query)) / (norm * q_norm))

        def compare(i: int, j: int) -> int:
            if abs(scores[i] - scores[j]) > 1e-9:
                return -1 if scores[i] > scores[j] else 1
            return i - j

        return sorted(range(m), key=cmp_to_key(compare))[:k]
  javascript: |
    function topKSimilar(embeddings, dim, query, k) {
      const m = Math.floor(embeddings.length / dim);
      let qNorm = 0;
      for (const x of query) qNorm += x * x;
      qNorm = Math.sqrt(qNorm);
      const scores = [];
      for (let i = 0; i < m; i++) {
        let dot = 0;
        let norm = 0;
        for (let j = 0; j < dim; j++) {
          const v = embeddings[i * dim + j];
          dot += v * query[j];
          norm += v * v;
        }
        norm = Math.sqrt(norm);
        scores.push(norm === 0 || qNorm === 0 ? 0 : dot / (norm * qNorm));
      }
      const order = Array.from({ length: m }, (_, i) => i);
      order.sort((a, b) => {
        if (Math.abs(scores[a] - scores[b]) > 1e-9) return scores[b] - scores[a];
        return a - b;
      });
      return order.slice(0, k);
    }
