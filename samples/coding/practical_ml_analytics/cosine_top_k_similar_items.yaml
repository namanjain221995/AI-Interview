expected_concepts:
  - "cosine similarity as a normalised dot product"
  - "row-major indexing of a flattened matrix"
  - "zero-norm guard to avoid division by zero"
  - "stable ranking with a tie-break on index"
  - "top-k selection with a bounded heap"
optimal_complexity: {time: "O(m * dim + m log k) with a size-k heap", space: "O(m) for the scores, or O(k) when scoring on the fly"}
rubric:
  excellent: "Indexes the flat array correctly, guards zero-length vectors, ranks with a comparator that applies the tolerance and the index tie-break, and discusses a size-k heap plus approximate nearest-neighbour indexes for large catalogues."
  good: "Correct scores and ordering with a full sort; needs a hint for zero vectors or tie-breaking."
  weak: "Ranks by raw dot product, divides by zero for empty vectors, mis-slices the flat array or ignores the index tie-break."
  criteria:
    correctness: "All tests pass, including zero vectors, a zero query, scalar multiples and k larger than m."
    efficiency: "Each product is scored once in O(dim); selection is O(m log m) or better."
    code_quality: "Separate scoring and ranking steps with clear names for the norms and the dot product."
    edge_cases: "Empty catalogue, zero query, negative similarities and very different vector magnitudes."
    communication: "Explains why cosine ignores vector length and why a tolerance is needed when comparing floats."
hints:
  - "Score every product first, then worry about ordering; product i occupies a contiguous slice of the flat list."
  - "Cosine similarity divides the dot product by both lengths, so a vector of length zero needs its own branch. For the ordering, compare scores first and fall back to the index when they are within 10^-9."
  - "Compute the query norm once, loop over products computing dot and norm in one pass over the slice, store each score (0.0 for zero norms), sort the indices with a comparator on (score descending within tolerance, index ascending) and return the first min(k, m)."
followups:
  - "How would you serve this for ten million products with a latency budget of a few milliseconds?"
  - "If all embeddings were stored pre-normalised, what would the ranking reduce to?"
  - "How would you exclude the product the shopper is already viewing, or products out of stock?"
  - "What changes if you need the k least similar products for diversity sampling?"
common_errors:
  - "Ranking by raw dot product, which favours long vectors."
  - "Dividing by a zero norm and producing NaN, which breaks the sort."
  - "Slicing the flat array as embeddings[i : i + dim] instead of embeddings[i * dim : (i + 1) * dim]."
  - "Comparing floats exactly so that equal similarities computed differently are ordered arbitrarily."
