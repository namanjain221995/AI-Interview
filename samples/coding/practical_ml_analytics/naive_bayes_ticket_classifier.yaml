  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    import math
    import re
    from collections import Counter

    TOKEN = re.compile(r"[a-z]+")


    def naive_bayes_predict(train_texts: list[str], train_labels: list[str], query: str) -> str:
        docs: Counter[str] = Counter(train_labels)
        word_counts: dict[str, Counter[str]] = {label: Counter() for label in docs}
        vocabulary: set[str] = set()
        for text, label in zip(train_texts, train_labels):
            tokens = TOKEN.findall(text.lower())
            word_counts[label].update(tokens)
            vocabulary.update(tokens)
        query_tokens = [t for t in TOKEN.findall(query.lower()) if t in vocabulary]
        best_label, best_score = "", -math.inf
        for label in sorted(docs):
            denominator = sum(word_counts[label].values()) + len(vocabulary)
            score = math.log(docs[label] / len(train_labels))
            for token in query_tokens:
                score += math.log((word_counts[label][token] + 1) / denominator)
            if score > best_score + 1e-9:
                best_label, best_score = label, score
        return best_label
  javascript: |
    function naiveBayesPredict(trainTexts, trainLabels, query) {
      const tokenize = (text) => text.toLowerCase().match(/[a-z]+/g) || [];
      const docs = new Map();
      const counts = new Map();
      const totals = new Map();
      const vocabulary = new Set();
      for (let i = 0; i < trainTexts.length; i++) {
        const label = trainLabels[i];
        docs.set(label, (docs.get(label) || 0) + 1);
        if (!counts.has(label)) {
          counts.set(label, new Map());
          totals.set(label, 0);
        }
        const wordCounts = counts.get(label);
        for (const token of tokenize(trainTexts[i])) {
          wordCounts.set(token, (wordCounts.get(token) || 0) + 1);
          totals.set(label, totals.get(label) + 1);
          vocabulary.add(token);
        }
      }
      const queryTokens = tokenize(query).filter((t) => vocabulary.has(t));
      const labels = [...docs.keys()].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      let bestLabel = "";
      let bestScore = -Infinity;
      for (const label of labels) {
        const denominator = totals.get(label) + vocabulary.size;
        const wordCounts = counts.get(label);
        let score = Math.log(docs.get(label) / trainLabels.length);
        for (const token of queryTokens) {
          score += Math.log(((wordCounts.get(token) || 0) + 1) / denominator);
        }
        if (score > bestScore + 1e-9) {
          bestLabel = label;
          bestScore = score;
        }
      }
      return bestLabel;
    }
