  - {id: t3, args: [["password reset link expired", "reset my password", "app crashes on start", "crash after update", "crash when uploading photo"], ["access", "access", "bug", "bug", "bug"], "password crash"], expected: "bug", description: "Example 3 - the prior tips a close call"}
  - {id: t4, hidden: true, args: [["disk full on node"], ["infra"], "disk pressure"], expected: "infra", description: "Single class"}
  - {id: t5, hidden: true, args: [["charged twice", "parcel lost", "parcel late"], ["billing", "shipping", "shipping"], ""], expected: "shipping", description: "Empty query - the larger prior wins"}
  - {id: t6, hidden: true, args: [["CHECKOUT_ERROR 500 on payment", "Payment-page timeout (504)", "dark mode request", "please add dark-mode"], ["payments", "payments", "feature", "feature"], "ERROR-500 on CHECKOUT!!"], expected: "payments", description: "Tokenisation - case, digits, underscores and punctuation split words"}
  - {id: t7, hidden: true, args: [["refund refund refund invoice", "refund status", "login reset password", "reset login", "login help"], ["billing", "billing", "access", "access", "access"], "refund refund refund login reset"], expected: "billing", description: "Repeated query words count every time (a set of query words picks access)"}
  - {id: t8, hidden: true, args: [["timeout while connecting", "timeout while connecting"], ["network", "database"], "Timeout!"], expected: "database", description: "Two classes with identical evidence - tie to the smaller label"}
  - {id: t9, hidden: true, args: [["export fails", "export fails again", "export is slow", "export broken", "report export", "sso token invalid"], ["data", "data", "data", "data", "data", "auth"], "export token"], expected: "data", description: "Laplace smoothing - a word unseen in the winning class must not zero it out"}
  - {id: t10, hidden: true, args: [["vpn drops every hour", "vpn client disconnects", "vpn tunnel down", "printer jam"], ["network", "network", "network", "hardware"], "vpn printer printer"], expected: "hardware", description: "Repeated rare word outweighs the larger class (set of query words picks network)"}
  - {id: t11, hidden: true, args: [["invoice amount wrong", "charged twice this month", "refund not received", "billing address update", "cannot reset password", "two factor code not arriving", "account locked after login attempts", "parcel stuck in transit", "tracking number invalid", "delivery to wrong address", "app freezes on checkout", "crash when opening settings", "search results empty after update"], ["billing", "billing", "billing", "billing", "access", "access", "access", "shipping", "shipping", "shipping", "bug", "bug", "bug"], "Locked out, the password reset code is not arriving"], expected: "access", description: "Four classes, thirteen tickets"}
expected_concepts:
  - "multinomial naive Bayes with class priors"
  - "Laplace (add-one) smoothing over a shared vocabulary"
  - "working in log space to avoid underflow"
  - "tokenisation rules and out-of-vocabulary handling"
  - "deterministic tie-breaking with a float tolerance"
optimal_complexity: {time: "O(T + C * q) for T training tokens, C labels and q query tokens", space: "O(C * |V|) for the per-label counts"}
rubric:
  excellent: "Builds per-label token counts and the shared vocabulary in one pass, scores in log space with add-one smoothing and |V| in the denominator, drops unknown words, keeps repeated query words, breaks ties with a tolerance and the smallest label, and explains why logs prevent underflow."
  good: "Correct classifier after a hint about unknown words, repeated query tokens or the smoothing denominator."
  weak: "Multiplies raw probabilities, forgets the prior, gives unseen words zero probability, uses per-label vocabularies or de-duplicates query words."
  criteria:
    correctness: "All tests pass, including empty or unknown-only queries, repeated words and exact ties."
    efficiency: "Training is linear in the number of tokens; scoring touches only the query tokens per label."
    code_quality: "Separate tokenise, train and score steps with clear count structures."
    edge_cases: "Single label, empty query, punctuation and digits, and labels with identical evidence."
    communication: "Explains what each term of the score means and why smoothing is needed."
hints:
  - "Split the work into training (counting) and scoring; the score of a label is its prior times the probability of each query word, which is easier to handle as a sum of logarithms."
  - "During training you need, per label, the number of tickets, each token's count and the total token count, plus one vocabulary shared by all labels. Smoothing adds one to every count and |V| to every denominator, so a word never seen with a label still has a small probability."
  - "Tokenise the query, keep only vocabulary tokens (repeats included), and for each label add ln(docs/N) and ln((count + 1) / (total + |V|)) per kept token; iterate labels in sorted order and replace the best only when a score is more than 10^-9 higher."
followups:
  - "Why does naive Bayes work reasonably well even though words in a ticket are clearly not independent?"
  - "How would you turn the scores into calibrated probabilities, and why are naive Bayes probabilities often overconfident?"
  - "How would you update the model incrementally as new labelled tickets arrive?"
  - "Which stop-word or n-gram changes would you try, and how would you measure whether they help?"
common_errors:
  - "Multiplying probabilities directly, which underflows to zero on long tickets."
  - "Giving tokens unseen with a label a probability of zero instead of smoothing."
  - "Smoothing unknown query words too, which favours labels with fewer training tokens."
  - "Counting each distinct query word once instead of every occurrence."
  - "Leaving out the class prior, so a rare queue wins too often."
