slug: naive_bayes_ticket_classifier
title: Naive Bayes Ticket Classifier
difficulty: medium
competency_keys: [machine_learning, algorithms, data_structures]
role_tags: [ml, data_scientist, llm, support_engineer]
time_limit_minutes: 25
prompt_markdown: |
  ## Naive Bayes Ticket Classifier

  The help desk wants a tiny, explainable baseline that routes a new support ticket to a queue before a
  larger model is trusted. Implement a **multinomial naive Bayes** classifier trained on past tickets.

  **Tokens.** Lowercase the text, then every maximal run of letters `a`-`z` is one token; everything else
  (digits, spaces, punctuation, underscores) separates tokens. `"ERROR-500 on Checkout!"` gives
  `error`, `on`, `checkout`.

  **Training** on `train_texts[i]` with label `train_labels[i]`:
  - `V` is the set of distinct tokens across **all** training texts (the vocabulary).
  - For each label `c`: `docs(c)` is the number of training tickets with label `c`, `count(w, c)` is how
    many times token `w` occurs in those tickets, and `total(c)` is the number of tokens in them.

  **Scoring** a `query`: tokenise it and **drop tokens that are not in `V`**; keep repeats. For every label
  `c` seen in training,

  `score(c) = ln(docs(c) / N) + sum over kept query tokens w of ln((count(w, c) + 1) / (total(c) + |V|))`

  where `N` is the number of training tickets. Return the label with the **highest** score. Labels whose
  scores differ by at most `10^-9` count as tied; ties go to the **lexicographically smallest** label.

  ### Example 1
  ```
  Input:  train_texts = ["Refund my order please", "I want a refund", "Cannot login to my account", "Login page error"], train_labels = ["billing", "billing", "access", "access"], query = "refund for my order"
  Output: "billing"
  Explanation: "for" is not in the vocabulary and is dropped; refund and order only occur in billing tickets, my occurs once in each label
  ```

  ### Example 2
  ```
  Input:  train_texts = ["Package arrived damaged", "Where is my package", "Charged twice for one order", "Invoice shows wrong amount"], train_labels = ["shipping", "shipping", "billing", "billing"], query = "Hello, anyone there?"
  Output: "billing"
  Explanation: no query token is in the vocabulary, so only the equal priors remain; the tie goes to "billing"
  ```

  ### Example 3
  ```
  Input:  train_texts = ["password reset link expired", "reset my password", "app crashes on start", "crash after update", "crash when uploading photo"], train_labels = ["access", "access", "bug", "bug", "bug"], query = "password crash"
  Output: "bug"
  Explanation: the words alone favour access (its tickets are shorter, and "crashes" is a different token from "crash"), but bug's prior of 3/5 against 2/5 outweighs that
  ```

  ### Constraints
  - `1 <= train_texts.length == train_labels.length <= 2000`
  - `0 <= train_texts[i].length, query.length <= 500`; texts are printable ASCII
  - Labels are non-empty strings of lowercase letters and underscores
  - Compare labels with plain character order (ASCII) for tie-breaking
languages: [python, javascript, typescript, java, go, cpp]
