expected_concepts:
  - "confusion counts (TP, FP, FN) per class from one pass"
  - "class set as the union of actual and predicted labels"
  - "F1 as the harmonic mean of precision and recall"
  - "macro versus micro averaging and why macro exposes rare classes"
  - "hash maps keyed by label"
optimal_complexity: {time: "O(n + c) for n messages and c classes", space: "O(c)"}
rubric:
  excellent: "Counts TP, FP and FN per label in a single pass with hash maps, builds the class set from both lists, uses the 2TP / (2TP + FP + FN) form that avoids dividing by zero, handles empty input and explains why macro F1 differs from accuracy on imbalanced data."
  good: "Correct result after a hint about labels that only appear in predicted, or computes precision and recall separately with correct zero handling."
  weak: "Takes classes only from actual, divides by zero when a class is never predicted, averages by support instead of equally, or returns accuracy."
  criteria:
    correctness: "All tests pass, including predicted-only labels, case-sensitive labels and empty input."
    efficiency: "Linear in the number of messages plus classes; no per-class rescans of the lists."
    code_quality: "Named counters (tp, fp, fn) and a small, readable per-class formula."
    edge_cases: "Empty lists, classes with zero TP, never-predicted classes and a constant predictor."
    communication: "Explains how one wrong prediction adds an FP to one class and an FN to another."
hints:
  - "Each message either matches or does not; think about which class gains a true positive, a false positive or a false negative in each case."
  - "One pass over the pairs is enough if you keep three counters per label; a mismatch adds a false positive to the predicted label and a false negative to the actual label. Remember that the classes come from both lists."
  - "After counting, loop over the union of labels, add 2*TP / (2*TP + FP + FN) for every label with TP above zero, and divide the sum by the number of labels; return 0.0 straight away for empty input."
followups:
  - "How would micro-averaged F1 differ, and what does it equal for single-label classification?"
  - "How would you add a weighted F1 that weights each class by its support in actual?"
  - "If the evaluation set streamed in from many workers, how would you merge partial results?"
  - "Which classes would you inspect first when macro F1 drops but accuracy rises?"
common_errors:
  - "Building the class set from actual only, which ignores labels the model invents."
  - "Computing precision as TP / (TP + FP) without guarding against zero predictions for a class."
  - "Weighting classes by frequency, which turns macro F1 into weighted F1."
  - "Lowercasing labels, which merges classes that are meant to be different."
