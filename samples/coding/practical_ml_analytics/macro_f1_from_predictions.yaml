version: 1
slug: macro_f1_from_predictions
title: Macro F1 for an Intent Classifier
difficulty: medium
competency_keys: [machine_learning, data_structures, problem_solving]
role_tags: [ml, llm, data_scientist]
time_limit_minutes: 20
prompt_markdown: |
  ## Macro F1 for an Intent Classifier

  The support chatbot routes each customer message to an **intent** (`"refund"`, `"login"`, ...). Before a
  new classifier version ships, the team scores it on a labelled evaluation set. Some intents are rare,
  so plain accuracy hides how badly they are handled; the team reports **macro F1** instead, which gives
  every intent the same weight.

  You get two lists of the same length: `actual[i]` is the correct intent of message `i` and
  `predicted[i]` is the classifier's output for it. Labels are compared exactly (case-sensitive).

  - The **classes** are every label that appears in `actual` **or** in `predicted`.
  - For each class `c`, count over all messages:
    - `TP` - messages where `actual[i] == c` and `predicted[i] == c`;
    - `FP` - messages where `predicted[i] == c` but `actual[i] != c`;
    - `FN` - messages where `actual[i] == c` but `predicted[i] != c`.
  - The class's F1 score is `2 * TP / (2 * TP + FP + FN)`, and it is `0.0` when `TP` is `0`.
  - **Macro F1** is the plain (unweighted) average of the F1 scores of all classes.

  Return the macro F1 as a floating-point number, or `0.0` when the lists are empty. Answers within
  `10^-6` are accepted.

  ### Example 1
  ```
  Input:  actual = ["refund", "refund", "billing", "login", "login"], predicted = ["refund", "billing", "billing", "login", "refund"]
  Output: 0.611111111111111
  Explanation: refund has TP 1, FP 1, FN 1 -> 0.5; billing has TP 1, FP 1 -> 2/3; login has TP 1, FN 1 -> 2/3; the mean is 0.6111...
  ```

  ### Example 2
  ```
  Input:  actual = ["greeting", "greeting", "cancel"], predicted = ["greeting", "escalate", "cancel"]
  Output: 0.5555555555555555
  Explanation: greeting -> 2/3, cancel -> 1.0, escalate (only ever predicted) -> 0.0; (2/3 + 1 + 0) / 3
  ```

  ### Example 3
  ```
  Input:  actual = [], predicted = []
  Output: 0.0
  ```

  ### Constraints
  - `0 <= actual.length == predicted.length <= 10^5`
  - `1 <= actual[i].length, predicted[i].length <= 40`
  - At most `1000` distinct labels in total.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: macro_f1
  params:
    - {name: actual, type: "string[]"}
    - {name: predicted, type: "string[]"}
  return_type: "float"
  comparison: float_tolerance
  tolerance: 1e-06
reference_solutions:
  python: |
    from collections import Counter


    def macro_f1(actual: list[str], predicted: list[str]) -> float:
        if not actual:
            return 0.0
        tp: Counter[str] = Counter()
        fp: Counter[str] = Counter()
        fn: Counter[str] = Counter()
        for truth, guess in zip(actual, predicted):
            if truth == guess:
                tp[truth] += 1
            else:
                fp[guess] += 1
                fn[truth] += 1
        classes = set(actual) | set(predicted)
        total = 0.0
        for label in classes:
            if tp[label] > 0:
                total += 2 * tp[label] / (2 * tp[label] + fp[label] + fn[label])
        return total / len(classes)
  javascript: |
    function macroF1(actual, predicted) {
      if (actual.length === 0) return 0.0;
      const tp = new Map();
      const fp = new Map();
      const fn = new Map();
      const classes = new Set();
      const bump = (map, key) => map.set(key, (map.get(key) || 0) + 1);
      for (let i = 0; i < actual.length; i++) {
        classes.add(actual[i]);
        classes.add(predicted[i]);
        if (actual[i] === predicted[i]) {
          bump(tp, actual[i]);
        } else {
          bump(fp, predicted[i]);
          bump(fn, actual[i]);
        }
      }
      let total = 0;
      for (const label of classes) {
        const t = tp.get(label) || 0;
        if (t > 0) total += (2 * t) / (2 * t + (fp.get(label) || 0) + (fn.get(label) || 0));
      }
      return total / classes.size;
    }
tests:
  - {id: t1, args: [["refund", "refund", "billing", "login", "login"], ["refund", "billing", "billing", "login", "refund"]], expected: 0.611111111111111, description: "Example 1"}
  - {id: t2, args: [["greeting", "greeting", "cancel"], ["greeting", "escalate", "cancel"]], expected: 0.5555555555555555, description: "Example 2 - a label that only appears in predicted still counts as a class"}
  - {id: t3, args: [[], []], expected: 0.0, description: "Example 3 - empty input"}
