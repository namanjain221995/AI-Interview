slug: cohort_weekly_retention_matrix
title: Weekly Cohort Retention Matrix
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data_analyst, product_manager, data, business_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Weekly Cohort Retention Matrix

  The product analytics team builds a retention table every Monday. Activity is logged as two
  parallel arrays: `user_ids[i]` was active in week number `weeks[i]`. The log is **not** sorted and
  may contain the same `(user, week)` pair many times (one row per session).

  - A user's **cohort** is the earliest week in which they were active.
  - A user is **retained at offset `d`** if they were active in week `cohort + d`.

  Build the retention matrix for offsets `0 .. horizon`. Return one row per cohort that has at least
  one user, ordered by cohort week ascending. Each row has `horizon + 2` entries:

  ```
  [cohort_week, users_at_offset_0, users_at_offset_1, ..., users_at_offset_horizon]
  ```

  where `users_at_offset_d` counts **distinct** users of that cohort active in week `cohort_week + d`.
  `users_at_offset_0` is therefore the cohort size. Activity later than `cohort + horizon` is ignored.
  Return an empty list when there is no activity.

  ### Example 1
  ```
  Input:  user_ids = [1, 2, 1, 3, 2, 1, 3, 4], weeks = [10, 10, 11, 11, 12, 12, 13, 11], horizon = 2
  Output: [[10, 2, 1, 2], [11, 2, 0, 1]]
  Explanation: users 1 and 2 start in week 10; user 1 returns in weeks 11 and 12, user 2 in week 12.
               Users 3 and 4 start in week 11; user 3 returns in week 13 (offset 2).
  ```

  ### Example 2
  ```
  Input:  user_ids = [5, 5, 5, 6, 6], weeks = [3, 1, 1, 7, 1], horizon = 1
  Output: [[1, 2, 0]]
  Explanation: user 5 starts in week 1 (logged twice) and is back in week 3, beyond offset 1.
               User 6 starts in week 1; week 7 is beyond the horizon.
  ```

  ### Constraints
  - `0 <= user_ids.length == weeks.length <= 10^5`
  - `1 <= user_ids[i] <= 10^9`
  - `0 <= weeks[i] <= 10^4`
  - `0 <= horizon <= 52`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: retention_matrix
  params:
    - {name: user_ids, type: "int[]"}
    - {name: weeks, type: "int[]"}
    - {name: horizon, type: "int"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def retention_matrix(user_ids: list[int], weeks: list[int], horizon: int) -> list[list[int]]:
        first_week: dict[int, int] = {}
        for user, week in zip(user_ids, weeks):
            if user not in first_week or week < first_week[user]:
                first_week[user] = week
        rows: dict[int, list[int]] = {}
        for user, week in set(zip(user_ids, weeks)):  # distinct (user, week) activity
            cohort = first_week[user]
            offset = week - cohort
            if offset <= horizon:
                row = rows.setdefault(cohort, [cohort] + [0] * (horizon + 1))
                row[1 + offset] += 1
        return [rows[cohort] for cohort in sorted(rows)]
  javascript: |
    function retentionMatrix(userIds, weeks, horizon) {
      const firstWeek = new Map();
      for (let i = 0; i < userIds.length; i++) {
        const seen = firstWeek.get(userIds[i]);
        if (seen === undefined || weeks[i] < seen) firstWeek.set(userIds[i], weeks[i]);
      }
      const seenPairs = new Set();
      const rows = new Map();
      for (let i = 0; i < userIds.length; i++) {
        const key = userIds[i] + ":" + weeks[i];
        if (seenPairs.has(key)) continue;
        seenPairs.add(key);
        const cohort = firstWeek.get(userIds[i]);
        const offset = weeks[i] - cohort;
        if (offset > horizon) continue;
        if (!rows.has(cohort)) rows.set(cohort, [cohort, ...new Array(horizon + 1).fill(0)]);
        rows.get(cohort)[1 + offset] += 1;
      }
      return [...rows.keys()].sort((a, b) => a - b).map((c) => rows.get(c));
    }
