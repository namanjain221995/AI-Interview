expected_concepts:
  - "two passes: first compute each user's cohort, then aggregate"
  - "deduplicating (user, week) pairs"
  - "hash maps keyed by user and by cohort"
  - "offset relative to the cohort week"
  - "ordering rows by cohort"
optimal_complexity: {time: "O(n + c log c)", space: "O(n)"}
rubric:
  excellent: "Computes each user's minimum week in a first pass, deduplicates (user, week) pairs, aggregates counts per cohort and offset within the horizon, emits rows sorted by cohort, and explains why a single pass over an unsorted log cannot know the cohort yet."
  good: "Correct matrix after a hint about duplicate sessions, the unsorted log or the horizon."
  weak: "Uses the first logged week as the cohort, counts sessions instead of users, emits rows for weeks without a cohort, or produces rows of the wrong length."
  criteria:
    correctness: "All tests pass, including duplicates, unsorted logs, gaps and horizon zero."
    efficiency: "Linear in the log size plus sorting the distinct cohort weeks."
    code_quality: "Cohort computation, deduplication and aggregation are separate, clearly named steps."
    edge_cases: "Empty log, horizon zero, users active only once, activity past the horizon and large ids."
    communication: "Explains how the rows read as retention curves and why offset 0 equals the cohort size."
hints:
  - "You cannot place an activity row into the matrix until you know which cohort its user belongs to. What could you compute first?"
  - "Make one pass to record every user's earliest week. Then make a second pass over the distinct (user, week) pairs and compute the offset of each pair from that user's cohort week."
  - "First build a map from user to minimum week. Then, for each distinct (user, week) pair, compute the offset from the user's cohort; when it is at most the horizon, add one to the cell for that cohort and offset, creating the row (cohort week followed by horizon plus one zeros) on first use. Finally output the rows ordered by cohort week."
followups:
  - "How would you turn the counts into retention percentages and what would you do about very small cohorts?"
  - "How would you compute the same matrix in SQL?"
  - "How would you change the definition to rolling retention (active at offset d or any later week)?"
  - "How would you handle a log of billions of rows that does not fit in memory?"
common_errors:
  - "Using the week of the first log row as the cohort instead of the minimum week."
  - "Counting every session row, so a user active twice in one week is counted twice."
  - "Producing rows of length horizon + 1 by forgetting the leading cohort week."
  - "Emitting rows for weeks in which no user started."
  - "Including activity beyond the horizon or crashing on it."
