  - {id: t2, args: [[5, 5, 5, 6, 6], [3, 1, 1, 7, 1], 1], expected: [[1, 2, 0]], description: "Example 2 - duplicate sessions count once; cohort is the earliest week even if logged later; activity beyond the horizon is dropped"}
