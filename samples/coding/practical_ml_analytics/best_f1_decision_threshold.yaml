expected_concepts:
  - sorting by score and sweeping thresholds from high to low
  - prefix counts of flagged windows and true positives
  - F1 rewritten as 2TP / (flagged + positives)
  - exact comparison of fractions by cross-multiplication
  - processing groups of equal scores together
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Sorts once, sweeps distinct scores from the top while maintaining TP and flagged counts, evaluates every threshold in O(1), compares F1 values exactly (fractions or cross-multiplication), applies the larger-threshold tie-break and explains the trade-off between paging fatigue and missed incidents.
  good: Correct O(n log n) sweep that needs a hint about equal-score groups, the tie-break direction or floating-point ties.
  weak: Recomputes the confusion matrix from scratch for each threshold (O(n^2)), splits a group of equal scores across thresholds, returns the smallest tied threshold, or divides by zero when there are no positives.
  criteria:
    correctness: All tests pass, including duplicate scores, exact F1 ties and histories without incidents.
    efficiency: One sort and one linear sweep with constant work per distinct score.
    code_quality: Clear running counters and a comparison that makes the tie-break rule obvious.
    edge_cases: Empty input, a single window, all windows positive, scores of exactly 0.0 and 1.0.
    communication: Explains why the threshold is only evaluated at distinct scores and why F1 suits rare incidents better than accuracy.
hints:
  - Lowering the threshold only ever adds windows to the flagged set, so think about visiting candidate thresholds in descending order and updating counts instead of recounting.
  - Once you know how many windows are flagged and how many of them are incidents, F1 needs no other information, because FP plus FN can be written using the flagged count and the total number of incidents.
  - Sort by score descending, consume each group of equal scores together while adding to the flagged and true-positive counts, compute F1 as two times TP over flagged plus total positives, and replace the best only when the new value is strictly greater (compare the fractions by cross-multiplying) so that ties keep the larger threshold found first.
followups:
  - The team says a missed incident costs ten times more than a false page; how would you change the objective?
  - How would you choose a threshold that guarantees at least 90 percent recall with the best precision?
  - Why might the best threshold on historical data drift after the model is retrained?
common_errors:
  - Treating each window separately and splitting a group of equal scores across two thresholds.
  - Returning the smallest threshold on a tie instead of the largest.
  - Computing F1 from floating-point precision and recall and missing exact ties.
  - Recounting TP and FP for every candidate threshold, which is quadratic.
