slug: best_f1_decision_threshold
title: Best F1 Alert Threshold
difficulty: medium
competency_keys: [machine_learning, algorithms, problem_solving]
role_tags: [ml, data_scientist, sre]
time_limit_minutes: 25
prompt_markdown: |
  ## Best F1 Alert Threshold

  An anomaly-detection model scores every five-minute window of a service's metrics, and the on-call
  team has labelled past windows: `1` if an incident really happened, `0` otherwise. Before the model
  pages anyone, the team must pick an alert threshold.

  With threshold `t`, a window is **flagged** when `score >= t`. Counting over all windows:

  - `TP` = flagged windows labelled `1`, `FP` = flagged windows labelled `0`,
    `FN` = unflagged windows labelled `1`.
  - `F1 = 2 * TP / (2 * TP + FP + FN)`.

  Consider only thresholds equal to one of the **distinct scores**. Return the threshold with the
  **highest F1**. If several thresholds reach the same F1 (equal as exact fractions), return the
  **largest** of them, because it pages people less often. Return `-1.0` if no window is labelled
  `1` (including when there are no windows at all).

  Compute F1 from the integer counts; two values that are mathematically equal must count as a tie
  (formulas built from rounded precision and recall can disagree in the last bit). The history can
  hold `10^5` windows, so aim for `O(n log n)`.

  ### Example 1
  ```
  Input:  scores = [0.9, 0.8, 0.6, 0.4, 0.2], labels = [1, 0, 1, 1, 0]
  Output: 0.4
  Explanation: thresholds 0.9, 0.8, 0.6, 0.4, 0.2 give F1 = 2/4, 2/5, 4/6, 6/7 and 6/8.
  The best is 6/7 at 0.4.
  ```

  ### Example 2
  ```
  Input:  scores = [0.2, 0.9, 0.4, 0.6], labels = [1, 1, 0, 0]
  Output: 0.9
  Explanation: threshold 0.9 flags one window (TP 1, FN 1): F1 = 2/3. Threshold 0.2 flags all four
  (TP 2, FP 2): F1 = 4/6 = 2/3 as well. 0.6 and 0.4 score lower. The tie goes to the larger
  threshold, 0.9.
  ```

  ### Example 3
  ```
  Input:  scores = [0.7, 0.1], labels = [0, 0]
  Output: -1.0
  Explanation: no window is labelled as an incident.
  ```

  ### Constraints
  - `0 <= scores.length == labels.length <= 10^5`
  - `0.0 <= scores[i] <= 1.0`
  - `labels[i]` is `0` or `1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_f1_threshold
  params:
    - {name: scores, type: "float[]"}
    - {name: labels, type: "int[]"}
  return_type: float
  comparison: float_tolerance
reference_solutions:
  python: |
    def best_f1_threshold(scores: list[float], labels: list[int]) -> float:
        positives = sum(labels)
        if positives == 0:
            return -1.0
        pairs = sorted(zip(scores, labels), reverse=True)
        best_threshold = -1.0
        best_num, best_den = -1, 1   # best F1 as the fraction best_num / best_den
        tp = flagged = 0
        i = 0
        while i < len(pairs):
            threshold = pairs[i][0]
            while i < len(pairs) and pairs[i][0] == threshold:
                tp += pairs[i][1]
                flagged += 1
                i += 1
            # 2TP + FP + FN simplifies to flagged + positives.
            num, den = 2 * tp, flagged + positives
            if num * best_den > best_num * den:   # strictly better; ties keep the larger threshold
                best_num, best_den, best_threshold = num, den, threshold
        return best_threshold
  javascript: |
    function bestF1Threshold(scores, labels) {
      let positives = 0;
      for (const label of labels) positives += label;
      if (positives === 0) return -1;
      const order = scores.map((_, i) => i).sort((a, b) => scores[b] - scores[a]);
      let bestThreshold = -1;
      let bestNum = -1;
      let bestDen = 1;
      let tp = 0;
      let flagged = 0;
      let i = 0;
      while (i < order.length) {
        const threshold = scores[order[i]];
        while (i < order.length && scores[order[i]] === threshold) {
          tp += labels[order[i]];
          flagged++;
          i++;
        }
        const num = 2 * tp;
        const den = flagged + positives;
        if (num * bestDen > bestNum * den) {
          bestNum = num;
          bestDen = den;
          bestThreshold = threshold;
        }
      }
      return bestThreshold;
    }
