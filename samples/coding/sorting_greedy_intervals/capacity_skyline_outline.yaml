reference_solutions:
  python: |
    import heapq


    def capacity_skyline_outline(reservations: list[list[int]]) -> list[list[int]]:
        starts = sorted(reservations, key=lambda r: r[0])
        xs = sorted({r[0] for r in reservations} | {r[1] for r in reservations})
        heap: list[tuple[int, int]] = []  # (-height, end), lazily pruned
        result: list[list[int]] = []
        current = 0
        i = 0
        for x in xs:
            while i < len(starts) and starts[i][0] == x:
                heapq.heappush(heap, (-starts[i][2], starts[i][1]))
                i += 1
            while heap and heap[0][1] <= x:
                heapq.heappop(heap)
            height = -heap[0][0] if heap else 0
            if height != current:
                result.append([x, height])
                current = height
        return result
  javascript: |
    function capacitySkylineOutline(reservations) {
      const starts = [...reservations].sort((a, b) => a[0] - b[0]);
      const xs = [...new Set(reservations.flatMap((r) => [r[0], r[1]]))].sort((a, b) => a - b);
      // Max-heap on height of [height, end] pairs, pruned lazily when the top has ended.
      const heap = [];
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p][0] >= heap[i][0]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const last = heap.pop();
        if (heap.length === 0) return;
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1;
          const r = l + 1;
          let m = i;
          if (l < heap.length && heap[l][0] > heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] > heap[m][0]) m = r;
          if (m === i) break;
          [heap[m], heap[i]] = [heap[i], heap[m]];
          i = m;
        }
      };
      const result = [];
      let current = 0;
      let i = 0;
      for (const x of xs) {
        while (i < starts.length && starts[i][0] === x) {
          push([starts[i][2], starts[i][1]]);
          i++;
        }
        while (heap.length > 0 && heap[0][1] <= x) pop();
        const height = heap.length > 0 ? heap[0][0] : 0;
        if (height !== current) {
          result.push([x, height]);
          current = height;
        }
      }
      return result;
    }
