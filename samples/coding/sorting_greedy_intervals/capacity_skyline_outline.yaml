expected_concepts:
  - "sweep over sorted start and end boundaries"
  - "max-heap (or ordered multiset) of active heights"
  - "lazy deletion of reservations that have already ended"
  - "half-open intervals: an end at x is inactive at x"
  - "emitting a point only when the maximum actually changes"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sweeps the distinct boundaries in order with a max-heap of active reservations, prunes ended ones lazily, emits a point only when the maximum changes, handles equal-height handovers and same-x events, and explains O(n log n)."
  good: "Correct sweep with a heap or sorted structure but needs a test run to fix same-x grouping or the equal-height merge, or uses an O(n) removal from a list that degrades to O(n^2) in the worst case."
  weak: "Paints a per-time-unit array (impossible at 10^9), compares only neighbouring reservations, emits duplicate x values or consecutive equal heights, or treats the end as still active."
  criteria:
    correctness: "All tests pass, including touching equal heights, shared start points and the empty input."
    efficiency: "O(n log n) with a heap and lazy deletion or an ordered multiset; no dependence on coordinate size."
    code_quality: "Boundary processing is grouped per x; the heap entries carry the end so stale tops can be discarded."
    edge_cases: "Empty input, nested reservations, duplicate reservations, ends coinciding with starts and coordinates up to 10^9."
    communication: "Explains why only boundaries can change the line and why stale heap entries are safe to keep until they reach the top."
hints:
  - "The line can only change value at a time when some reservation starts or ends, so you only need to look at those boundary times in order."
  - "Sweep the boundaries from left to right while keeping the active reservations in a structure that gives you the current maximum quickly; reservations that ended can be discarded when they surface at the top."
  - "Collect the distinct boundary times, sort them, and at each one add every reservation starting there to a max-heap keyed by height (remembering its end), pop from the top while the top's end is at or before the current time, read the maximum (zero if empty) and record a point only if it differs from the last recorded height."
followups:
  - "Why is it safe to leave reservations that have ended inside the heap until they reach the top?"
  - "How would the answer change if the line showed the total reserved capacity instead of the maximum?"
  - "How would you support reservations arriving one at a time while keeping the outline up to date?"
  - "What would you change if ranges were closed [start, end] instead of half-open?"
common_errors:
  - "Processing a start and an end at the same time separately, which emits two points with the same x."
  - "Emitting a point when one reservation hands over to another of the same height, producing consecutive equal heights."
  - "Treating a reservation as still active at its end time."
  - "Removing ended reservations from the middle of a list or heap with a linear search, which is quadratic in the worst case."
  - "Allocating an array indexed by time, which is infeasible for coordinates up to 10^9."
