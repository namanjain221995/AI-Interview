time_limit_minutes: 35
prompt_markdown: |
  ## Reserved Capacity Outline

  A capacity planner draws a single line on its dashboard: for every moment in time, the line sits at
  the **largest** reservation that is active at that moment (not the sum). Reservation `i` is
  `reservations[i] = [start, end, height]`: it reserves `height` units over the **half-open** time range
  `[start, end)`, so it is active at `start` and no longer active at `end`. When no reservation is
  active the line is at `0`.

  To redraw the line cheaply the dashboard only stores its **change points**. Return every point
  `[x, h]` where the line changes value at time `x` and takes the new value `h` from `x` onwards
  (before the first reservation the line is at `0`).

  - Points are sorted by `x` in increasing order, with at most one point per `x`.
  - Two consecutive points never share the same `h`: if the line keeps its value across a boundary
    (one reservation ends exactly where another of the same height starts), no point is emitted there.
  - The last point always has `h = 0`. Return an empty list when there are no reservations.

  ### Example 1
  ```
  Input:  reservations = [[1, 5, 3], [2, 4, 6], [3, 8, 2]]
  Output: [[1, 3], [2, 6], [4, 3], [5, 2], [8, 0]]
  Explanation: the line is 3 on [1, 2), 6 on [2, 4), 3 on [4, 5), 2 on [5, 8) and 0 from 8 on.
  ```

  ### Example 2
  ```
  Input:  reservations = [[0, 3, 4], [3, 6, 4], [8, 9, 1]]
  Output: [[0, 4], [6, 0], [8, 1], [9, 0]]
  Explanation: the two height-4 reservations touch at 3, so the line stays at 4 until 6.
  It drops to 0 at 6, rises to 1 at 8 and drops back to 0 at 9.
  ```

  ### Constraints
  - `0 <= reservations.length <= 10^4`
  - `reservations[i].length == 3`
  - `0 <= start < end <= 10^9`
  - `1 <= height <= 10^6`
  - Reservations are given in no particular order and may repeat.

  **Follow-up:** an `O(n^2)` scan over every boundary is easy; can you produce the outline in `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
