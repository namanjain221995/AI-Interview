title: Split Engineers Across Two Sites
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, project_manager]
time_limit_minutes: 20
prompt_markdown: |
  ## Split Engineers Across Two Sites

  A hardware rollout needs field engineers at two data-centre sites at the same time. There are `2n`
  engineers, and **exactly `n`** must go to site A and **exactly `n`** to site B.
  `costs[i] = [cost_a, cost_b]` gives the travel cost of sending engineer `i` to site A or to site B.

  Return the **minimum total travel cost** of a valid assignment.

  ### Example 1
  ```
  Input:  costs = [[30, 120], [200, 40], [80, 90], [60, 20]]
  Output: 170
  Explanation: engineers 0 and 2 go to site A (30 + 80); engineers 1 and 3 go to site B (40 + 20).
  ```

  ### Example 2
  ```
  Input:  costs = [[50, 50], [10, 70]]
  Output: 60
  ```

  ### Example 3
  ```
  Input:  costs = [[10, 100], [20, 90], [30, 80], [40, 70]]
  Output: 180
  Explanation: everyone is cheaper at site A, but only two can go there; engineers 0 and 1 save the most.
  ```

  ### Constraints
  - `2 <= costs.length <= 200`, and `costs.length` is even
  - `costs[i].length == 2`
  - `0 <= cost_a, cost_b <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: split_engineers_two_sites
  params:
    - {name: costs, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def split_engineers_two_sites(costs: list[list[int]]) -> int:
        # Engineers who save the most by choosing A over B go to A.
        by_preference = sorted(costs, key=lambda pair: pair[0] - pair[1])
        half = len(costs) // 2
        to_a = sum(pair[0] for pair in by_preference[:half])
        to_b = sum(pair[1] for pair in by_preference[half:])
        return to_a + to_b
  javascript: |
    function splitEngineersTwoSites(costs) {
      const byPreference = costs.slice().sort((x, y) => (x[0] - x[1]) - (y[0] - y[1]));
      const half = costs.length / 2;
      let total = 0;
      byPreference.forEach((pair, i) => {
        total += i < half ? pair[0] : pair[1];
      });
      return total;
    }
