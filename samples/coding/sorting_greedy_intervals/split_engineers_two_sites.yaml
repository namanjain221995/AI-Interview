expected_concepts:
  - cost difference between the two sites per engineer
  - sort by that difference
  - first half to site A and second half to site B
  - exchange argument for why the split by difference is optimal
  - dynamic programming over engineers and count sent to A as a slower alternative
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Reframes the cost as a baseline plus a per-engineer difference, sorts by that difference, assigns the first half to A, proves optimality with an exchange argument and states O(n log n) time.
  good: Finds the sort-by-difference greedy with some prompting, or a correct dynamic programming solution, and explains it adequately.
  weak: Sends each engineer to the cheaper site and then patches the counts arbitrarily, sorts by one site's cost only, or enumerates all subsets.
  criteria:
    correctness: All tests pass, including cases where everyone prefers the same site and ties in the difference.
    efficiency: One sort plus a linear pass; no exponential search.
    code_quality: The sort key and the half split are expressed clearly; each cost stays paired with its engineer.
    edge_cases: Two engineers, equal costs at both sites, zero costs and tied differences.
    communication: Explains why the difference, not the absolute cost, decides who goes where.
hints:
  - Imagine first sending everyone to site B. Moving one engineer to site A then changes the total by a fixed amount for that engineer. What is it?
  - You must move exactly half of the engineers to site A. Which engineers should you choose to make the total as small as possible?
  - Sort the engineers by cost to A minus cost to B, ascending; send the first half to site A and the second half to site B, and add up the matching costs.
followups:
  - Prove that sorting by the difference gives an optimal assignment.
  - How would you solve it if the split did not have to be exactly even, but each site needed at least k engineers?
  - What changes with three sites that each need exactly n engineers?
  - Could you do better than sorting, for example with a selection algorithm?
common_errors:
  - Sending every engineer to their cheaper site and then moving people arbitrarily to balance the counts.
  - Sorting by the cost to one site only instead of by the difference.
  - Sorting the A costs and B costs independently, breaking the pairing per engineer.
  - Using the wrong half after sorting, which gives the most expensive valid split.
