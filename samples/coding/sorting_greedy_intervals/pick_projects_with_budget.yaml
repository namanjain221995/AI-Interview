    - {name: budget, type: "int[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def pick_projects_with_budget(k: int, initial_budget: int, savings: list[int], budget: list[int]) -> int:
        projects = sorted(zip(budget, savings))
        affordable: list[int] = []  # max-heap (negated) of savings of startable projects
        current = initial_budget
        i = 0
        for _ in range(k):
            while i < len(projects) and projects[i][0] <= current:
                heapq.heappush(affordable, -projects[i][1])
                i += 1
            if not affordable:
                break
            current += -heapq.heappop(affordable)
        return current
  javascript: |
    function pickProjectsWithBudget(k, initialBudget, savings, budget) {
      const projects = budget.map((need, i) => [need, savings[i]]).sort((a, b) => a[0] - b[0]);
      const heap = [];
      const push = (value) => {
        heap.push(value);
        let i = heap.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (heap[parent] >= heap[i]) break;
          [heap[parent], heap[i]] = [heap[i], heap[parent]];
          i = parent;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const left = 2 * i + 1;
            const right = left + 1;
            let largest = i;
            if (left < heap.length && heap[left] > heap[largest]) largest = left;
            if (right < heap.length && heap[right] > heap[largest]) largest = right;
            if (largest === i) break;
            [heap[largest], heap[i]] = [heap[i], heap[largest]];
            i = largest;
          }
        }
        return top;
      };
      let current = initialBudget;
      let next = 0;
      for (let round = 0; round < k; round++) {
        while (next < projects.length && projects[next][0] <= current) {
          push(projects[next][1]);
          next++;
        }
        if (heap.length === 0) break;
        current += pop();
      }
      return current;
    }
