title: Pick Infrastructure Projects with Budget
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [platform, tech_lead, engineering_manager]
time_limit_minutes: 30
prompt_markdown: |
  ## Pick Infrastructure Projects with Budget

  A platform team funds its own infrastructure work. Each candidate project `i` needs the team to have
  at least `budget[i]` available before it can start (the amount is a requirement and is **not**
  spent), and once finished it frees up `savings[i]` per quarter, which is added to the available
  budget.

  The team has time for **at most `k` projects**, done one after another, and each project can be done
  at most once. Starting with `initial_budget` available, return the **maximum available budget** the
  team can end with.

  ### Example 1
  ```
  Input:  k = 2, initial_budget = 1, savings = [3, 5, 8], budget = [0, 1, 4]
  Output: 14
  Explanation: do project 1 (budget 1 -> 6), which unlocks project 2 (6 -> 14).
  ```

  ### Example 2
  ```
  Input:  k = 3, initial_budget = 0, savings = [2, 4, 6], budget = [1, 1, 1]
  Output: 0
  Explanation: no project can start, so the budget stays at 0.
  ```

  ### Constraints
  - `1 <= k <= 10^5`
  - `0 <= initial_budget <= 10^9`
  - `1 <= savings.length == budget.length <= 10^5`
  - `0 <= savings[i] <= 10^9`
  - `0 <= budget[i] <= 10^9`
  - The answer can exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: pick_projects_with_budget
  params:
