expected_concepts:
  - "greedy: always do the affordable project with the largest savings"
  - "sorting projects by required budget"
  - "max-heap of savings for the projects unlocked so far"
  - "exchange argument: a larger gain never makes fewer projects affordable"
  - "64-bit accumulation"
optimal_complexity: {time: "O(n log n + k log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by requirement, moves newly affordable projects into a max-heap of savings each round, takes the top k times or stops early, explains the exchange argument and uses 64-bit arithmetic."
  good: "Arrives at the greedy and the two-structure approach with a hint, or uses a correct O(n * k) scan for the best affordable project and recognises the heap improvement."
  weak: "Picks the cheapest or the first affordable project, subtracts the requirement from the budget, or reuses a project."
  criteria:
    correctness: "All tests pass, including unaffordable projects, zero savings and k larger than the number of projects."
    efficiency: "Each project enters the heap once; total work is O((n + k) log n)."
    code_quality: "The pointer into the sorted list and the heap of available savings are clearly named and the loop exits early when nothing is affordable."
    edge_cases: "k exceeding n, requirements exactly equal to the budget, zero-savings projects and large totals."
    communication: "Explains why taking the largest available saving now can never hurt later choices."
hints:
  - "Doing a project never lowers the budget, so a bigger budget can only make more projects startable; think about what the best choice is for the next single project."
  - "Among the projects you can start right now, the one with the largest savings is always a safe pick; the question is how to find it quickly as the budget grows."
  - "Sort projects by their requirement and keep a pointer into that order; before each pick, push the savings of every newly affordable project into a max-heap, then take the largest saving, and stop after k picks or when the heap is empty."
followups:
  - "How would you return the order of projects chosen?"
  - "What changes if starting a project actually spends its required budget?"
  - "How would you handle projects that become available over time?"
  - "Can you prove the greedy choice is optimal with an exchange argument?"
common_errors:
  - "Subtracting the requirement from the budget even though it is not spent."
  - "Choosing the cheapest affordable project instead of the one with the largest savings."
  - "Rescanning every project on each of the k rounds, which is too slow for large inputs."
  - "Looping forever or crashing when no project is affordable before k picks are made."
