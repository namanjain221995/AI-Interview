expected_concepts:
  - sorting followed by two pointers
  - greedy pairing of the heaviest parcel with the lightest
  - exchange argument for greedy optimality
optimal_complexity: {time: "O(n log n)", space: "O(1) extra beyond the sort"}
rubric:
  excellent: "Sorts the weights, pairs the heaviest remaining parcel with the lightest when they fit, otherwise sends the heaviest alone, and justifies the greedy choice with an exchange argument; states O(n log n)."
  good: "Reaches the sorted two-pointer solution with some prompting and handles the single-parcel middle case."
  weak: "Pairs adjacent parcels after sorting, pairs the two lightest together, or tries all pairings."
  criteria:
    correctness: "All tests pass, including no parcels, one parcel and cases where pairing light parcels together is wrong."
    efficiency: "Sort plus a linear two-pointer pass."
    code_quality: "Clear pointer names and a loop condition that counts the last single parcel exactly once."
    edge_cases: "Empty list, a parcel exactly at the limit, all parcels identical."
    communication: "Explains why the heaviest parcel should take the lightest partner if any partner fits."
hints:
  - "Think about the heaviest parcel: which partner, if any, gives it the best chance of sharing a trip?"
  - "If the heaviest parcel cannot travel with the lightest one, it cannot travel with any other parcel, so it must go alone; after sorting, two pointers can track the lightest and heaviest remaining parcels."
  - "Sort the weights and keep a left pointer at the lightest and a right pointer at the heaviest parcel; on each trip move the right pointer inward, also move the left pointer when the two together fit within the limit, and count one trip per step until the pointers cross."
followups:
  - "Prove that pairing the heaviest parcel with the lightest one never hurts the optimal answer."
  - "How would you solve it if a trip could carry any number of parcels up to the weight limit, and why is that much harder?"
  - "Weights are small integers bounded by the limit - can you avoid the comparison sort?"
common_errors:
  - "Pairing the two lightest parcels first, which can leave heavy parcels without partners."
  - "Pairing neighbours in sorted order instead of the extremes."
  - "Counting the final single parcel twice or missing it when the pointers meet."
  - "Allowing three or more parcels on one trip."
