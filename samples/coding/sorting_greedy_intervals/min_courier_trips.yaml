time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Courier Trips

  A same-day delivery hub sends parcels out on a cargo bike. On every trip the bike carries **one or two**
  parcels, and the total weight on a trip must not exceed `limit` kilograms. Every parcel weighs at most
  `limit` kilograms, so it can always travel alone.

  Given the parcel weights `weights` (in no particular order) and `limit`, return the **minimum number of
  trips** needed to deliver every parcel. With no parcels, no trip is needed.

  ### Example 1
  ```
  Input:  weights = [4, 2, 7, 5, 3], limit = 9
  Output: 3
  Explanation: for example 7 + 2, 5 + 4 and 3 alone.
  ```

  ### Example 2
  ```
  Input:  weights = [6, 6, 6], limit = 10
  Output: 3
  Explanation: no two parcels fit together, so each one travels alone.
  ```

  ### Constraints
  - `0 <= weights.length <= 5 * 10^4`
  - `1 <= weights[i] <= limit <= 3 * 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_courier_trips
  params:
    - {name: weights, type: "int[]"}
    - {name: limit, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_courier_trips(weights: list[int], limit: int) -> int:
        ordered = sorted(weights)
        light, heavy = 0, len(ordered) - 1
        trips = 0
        while light <= heavy:
            if light < heavy and ordered[light] + ordered[heavy] <= limit:
                light += 1
            heavy -= 1
            trips += 1
        return trips
  javascript: |
    function minCourierTrips(weights, limit) {
      const ordered = [...weights].sort((a, b) => a - b);
      let light = 0;
      let heavy = ordered.length - 1;
      let trips = 0;
      while (light <= heavy) {
        if (light < heavy && ordered[light] + ordered[heavy] <= limit) light++;
        heavy--;
        trips++;
      }
      return trips;
    }
