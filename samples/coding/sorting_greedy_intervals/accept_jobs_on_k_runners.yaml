role_tags: [platform, devops, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Accept Jobs on K Runners

  A CI platform has `k` identical build runners. Teams have requested time slots for heavy jobs:
  `jobs[i] = [start, end]` means the job must run during the **half-open** slot `[start, end)`; the
  slot is fixed and cannot be shifted or split. A runner handles one job at a time, so two jobs on the
  same runner must not overlap. A job ending at time `t` and another starting at `t` **can** share a
  runner.

  The platform may accept any subset of the requests and assign each accepted job to one runner.
  Return the **maximum number of jobs** that can be accepted.

  ### Example 1
  ```
  Input:  k = 2, jobs = [[1, 4], [2, 5], [3, 6], [5, 8]]
  Output: 3
  Explanation: accept [1, 4], [2, 5] and [5, 8]: runner A takes [1, 4] and runner B takes [2, 5] then [5, 8].
  At time 3 three jobs would be running, so not all four fit.
  ```

  ### Example 2
  ```
  Input:  k = 1, jobs = [[0, 10], [1, 3], [3, 5], [6, 9]]
  Output: 3
  Explanation: skipping the long job [0, 10] lets the single runner take [1, 3], [3, 5] and [6, 9].
  ```

  ### Constraints
  - `1 <= k <= 10^5`
  - `0 <= jobs.length <= 10^5`
  - `jobs[i].length == 2`
  - `0 <= start < end <= 10^9`

  **Follow-up:** with `k = 1` this is the classic earliest-finish greedy. What extra decision appears for `k > 1`, and can you still solve it in `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: accept_jobs_on_k_runners
  params:
    - {name: k, type: "int"}
    - {name: jobs, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_right, insort


    def accept_jobs_on_k_runners(k: int, jobs: list[list[int]]) -> int:
        busy_until: list[int] = []  # sorted finish times of runners already in use
        accepted = 0
        for start, end in sorted(jobs, key=lambda job: (job[1], job[0])):
            i = bisect_right(busy_until, start)
            if i > 0:
                # Reuse the runner that became free most recently (best fit).
                busy_until.pop(i - 1)
            elif len(busy_until) == k:
                continue  # every runner is still busy at start
            insort(busy_until, end)
            accepted += 1
        return accepted
  javascript: |
    function acceptJobsOnKRunners(k, jobs) {
      const ordered = [...jobs].sort((a, b) => a[1] - b[1] || a[0] - b[0]);
      const busyUntil = []; // sorted finish times of runners in use
      const upperBound = (x) => {
        let lo = 0;
        let hi = busyUntil.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (busyUntil[mid] <= x) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      };
      let accepted = 0;
      for (const [start, end] of ordered) {
        const i = upperBound(start);
        if (i > 0) {
          busyUntil.splice(i - 1, 1);
        } else if (busyUntil.length === k) {
          continue;
        }
        busyUntil.splice(upperBound(end), 0, end);
        accepted++;
      }
      return accepted;
    }
