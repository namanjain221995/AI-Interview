expected_concepts:
  - "sorting jobs by end time (earliest finish first)"
  - "best-fit assignment to the runner that became free latest but not after the start"
  - "ordered multiset or sorted list of runner finish times"
  - "half-open slots: an end equal to a start does not conflict"
  - "exchange argument for the greedy choice"
optimal_complexity: {time: "O(n log n)", space: "O(n + k)"}
rubric:
  excellent: "Sorts by end time, keeps runner finish times in an ordered structure, assigns each job to the runner with the latest finish time not after its start (or an idle runner), skips it otherwise, justifies best fit with an exchange argument and states O(n log n) with a balanced structure."
  good: "Reaches the earliest-finish order and an ordered structure for runners, with prompting on the best-fit choice, or uses a sorted list with linear insertion and discusses the cost."
  weak: "Sorts by start time, assigns to any free runner (for example the one free earliest), only counts maximum overlap, or treats touching slots as conflicts."
  criteria:
    correctness: "All tests pass, including the best-fit trap and back-to-back slots."
    efficiency: "O(n log n) with a balanced tree or multiset; sorted-list insertion is acceptable for discussion with its cost stated."
    code_quality: "The runner structure and the acceptance count are clearly separated; the comparison for reuse is the inclusive one."
    edge_cases: "No jobs, more runners than jobs, identical slots and times up to 10^9."
    communication: "Explains why finishing earliest first and fitting into the latest-free runner keeps the most room for future jobs."
hints:
  - "With a single runner, taking the job that finishes earliest first is a well-known strategy. Think about whether the same ordering still helps with several runners."
  - "Process jobs by finishing time. When a job can go on several free runners, the choice matters: keep the runners that became free early available for jobs that start early."
  - "Sort jobs by end time and keep the finish times of busy runners in a sorted structure; for each job find the largest finish time that is at most its start and replace it with the job's end, otherwise use an idle runner if one is left, otherwise reject the job, and count the accepted jobs."
followups:
  - "Why does giving a job to the runner that has been free the longest lose jobs? Construct a small example."
  - "How would you handle jobs with different values where the goal is maximum total value?"
  - "How would you return the actual runner assignment for each accepted job?"
  - "If runners had different speeds or capabilities, does the greedy still apply?"
common_errors:
  - "Sorting by start time and greedily accepting, which can block shorter later jobs."
  - "Assigning a job to the runner that became free earliest instead of the latest one that still fits."
  - "Treating a job that starts exactly when another ends as overlapping."
  - "Answering with the minimum number of runners needed or the maximum overlap instead of the number of accepted jobs."
  - "Using a plain unsorted list of runners and scanning it for every job, which is O(n * k)."
