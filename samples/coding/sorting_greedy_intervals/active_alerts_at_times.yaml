expected_concepts:
  - "sort start times and end times separately"
  - "active at t equals starts at or before t minus ends strictly before t"
  - "binary search per query (upper bound for starts, lower bound for ends)"
  - "closed ranges: inclusive at both ends"
  - "alternatively sort queries offline and sweep with a pointer"
optimal_complexity: {time: "O((n + q) log n)", space: "O(n + q)"}
rubric:
  excellent: "Separately sorts starts and ends, answers each query with an upper-bound search on starts minus a lower-bound search on ends (or an offline sweep over sorted queries that restores the original order), gets the closed-range boundaries right and states O((n + q) log n)."
  good: "Correct offline sweep or binary-search solution after a hint, with a small boundary fix found by testing the endpoint cases."
  weak: "Checks every alert for every query, or uses a per-second array over a range up to 10^9, or mixes up inclusive and exclusive bounds at the endpoints."
  criteria:
    correctness: "All tests pass, including endpoints, single-instant alerts, duplicates and unsorted repeated queries."
    efficiency: "Sorting plus a logarithmic search per query instead of O(n * q)."
    code_quality: "Named helpers or clearly chosen library calls for the two different bound searches."
    edge_cases: "No alerts, alerts with start equal to end, queries exactly at a start or an end and large time stamps."
    communication: "Explains why counting started alerts and subtracting finished ones gives the active count."
hints:
  - "An alert is active at a moment if it has started by then and has not yet finished. Can you count those two groups separately?"
  - "Sort all start times in one list and all end times in another. The number of alerts active at time t is the number that started at or before t minus the number that already ended before t."
  - "For each query, binary search the sorted starts for how many are less than or equal to the query time, and binary search the sorted ends for how many are strictly less than it. Subtract the second count from the first. Be careful to use the inclusive search for starts and the strict one for ends because both endpoints count."
followups:
  - "How would you solve it offline by sorting the queries instead, and keep the output in the original order?"
  - "What changes if the ranges were half-open, ending just before end?"
  - "How would you support alerts being added and resolved while queries keep arriving?"
  - "How would you return the ids of the active alerts rather than their count?"
common_errors:
  - "Subtracting alerts whose end equals the query time, which misses alerts active at their last second."
  - "Sorting the queries and returning answers in sorted order instead of the original order."
  - "Assuming starts and ends can be paired by index after sorting them separately and using that pairing."
  - "Scanning all alerts for each query, which is O(n * q)."
