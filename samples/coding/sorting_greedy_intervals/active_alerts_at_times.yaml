slug: active_alerts_at_times
title: "Active Alerts at Query Times"
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [sre, backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Active Alerts at Query Times

  An incident timeline tool lets responders click on any moment and see how many alerts were active then.
  Each entry of `alerts` is `[start, end]`: an alert that was active over the **closed** range
  `[start, end]`, so it counts at both its first and its last second. Alerts may overlap, repeat, be a
  single instant (`start == end`), and appear in any order.

  For each time in `queries`, compute how many alerts were active at that exact second. Return the counts
  in the same order as `queries`; queries may repeat and are not sorted.

  Both lists can be large, so checking every alert for every query is too slow. Aim for roughly
  `O((n + q) log n)` time.

  ### Example 1
  ```
  Input:  alerts = [[1, 5], [3, 8], [5, 5], [10, 12]], queries = [5, 0, 9, 3, 12]
  Output: [3, 0, 0, 2, 1]
  Explanation: At second 5, [1, 5], [3, 8] and the one-second alert [5, 5] are all active. At 3, [1, 5] and [3, 8] are active. At 12, only [10, 12]. Nothing is active at 0 or 9.
  ```

  ### Example 2
  ```
  Input:  alerts = [[0, 100]], queries = [100, 101, 0]
  Output: [1, 0, 1]
  ```

  ### Constraints
  - `0 <= alerts.length <= 10^5`
  - `alerts[i].length == 2` and `0 <= start <= end <= 10^9`
  - `1 <= queries.length <= 10^5`
  - `0 <= queries[j] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: active_alerts_at_times
  params:
    - {name: alerts, type: "int[][]"}
    - {name: queries, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left, bisect_right


    def active_alerts_at_times(alerts: list[list[int]], queries: list[int]) -> list[int]:
        starts = sorted(a[0] for a in alerts)
        ends = sorted(a[1] for a in alerts)
        result = []
        for t in queries:
            started = bisect_right(starts, t)  # alerts with start <= t
            finished = bisect_left(ends, t)    # alerts with end < t, already over
            result.append(started - finished)
        return result
  javascript: |
    function activeAlertsAtTimes(alerts, queries) {
      const starts = alerts.map((a) => a[0]).sort((x, y) => x - y);
      const ends = alerts.map((a) => a[1]).sort((x, y) => x - y);
      // Number of values v in arr with v < x (strict) or v <= x (inclusive).
      const countBelow = (arr, x, inclusive) => {
        let lo = 0;
        let hi = arr.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (arr[mid] < x || (inclusive && arr[mid] === x)) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      };
      return queries.map((t) => countBelow(starts, t, true) - countBelow(ends, t, false));
    }
