role_tags: [backend, data, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Count Out-of-Order Deploys

  Every build produced by the CI system gets an increasing build sequence number. Ideally builds reach
  production in that order, but parallel pipelines and manual rollouts sometimes apply an older build
  after a newer one. `seq[i]` is the build sequence number of the `i`-th deploy, listed in the order the
  deploys were applied.

  A pair of deploys `(i, j)` with `i < j` is **out of order** if `seq[i] > seq[j]`, that is, a newer build
  was applied before an older one. Deploying the same build number twice is **not** out of order.

  Return the number of out-of-order pairs as a 64-bit integer, a measure of how disordered the rollout
  history is. With up to `10^5` deploys the count can exceed the 32-bit range, and comparing every pair
  is too slow: aim for `O(n log n)`.

  ### Example 1
  ```
  Input:  seq = [3, 1, 2, 5, 4]
  Output: 3
  Explanation: The out-of-order pairs are (3, 1), (3, 2) and (5, 4).
  ```

  ### Example 2
  ```
  Input:  seq = [7, 7, 7]
  Output: 0
  ```

  ### Example 3
  ```
  Input:  seq = [40, 30, 20, 10]
  Output: 6
  ```

  ### Constraints
  - `0 <= seq.length <= 10^5`
  - `1 <= seq[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_out_of_order_deploys
  params:
    - {name: seq, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_out_of_order_deploys(seq: list[int]) -> int:
        def sort_count(values: list[int]) -> tuple[list[int], int]:
            if len(values) <= 1:
                return values, 0
            mid = len(values) // 2
            left, a = sort_count(values[:mid])
            right, b = sort_count(values[mid:])
            merged: list[int] = []
            count = a + b
            i = j = 0
            while i < len(left) and j < len(right):
                if left[i] <= right[j]:  # equal values are not out of order
                    merged.append(left[i])
                    i += 1
                else:
                    # right[j] is smaller than every remaining left value
                    count += len(left) - i
                    merged.append(right[j])
                    j += 1
            merged.extend(left[i:])
            merged.extend(right[j:])
            return merged, count

        return sort_count(list(seq))[1]
  javascript: |
    function countOutOfOrderDeploys(seq) {
      const a = seq.slice();
      const tmp = new Array(a.length);
      const sortCount = (lo, hi) => {
        if (hi - lo <= 1) return 0;
        const mid = (lo + hi) >> 1;
        let count = sortCount(lo, mid) + sortCount(mid, hi);
        let i = lo;
        let j = mid;
        let k = lo;
        while (i < mid && j < hi) {
          if (a[i] <= a[j]) tmp[k++] = a[i++];
          else {
            count += mid - i;
            tmp[k++] = a[j++];
          }
        }
        while (i < mid) tmp[k++] = a[i++];
        while (j < hi) tmp[k++] = a[j++];
        for (let t = lo; t < hi; t++) a[t] = tmp[t];
        return count;
      };
      return sortCount(0, a.length);
    }
