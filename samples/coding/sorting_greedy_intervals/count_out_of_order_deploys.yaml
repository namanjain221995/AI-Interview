  - "counting inversions"
  - "merge sort with a count during the merge step"
  - "strict comparison so equal values are not counted"
  - "alternative: Fenwick tree over compressed values"
  - "64-bit result"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Identifies the task as counting inversions, augments merge sort so that taking an element from the right half adds the number of remaining left elements, keeps equal values from counting, uses a 64-bit counter, states O(n log n) and can describe the Fenwick-tree alternative."
  good: "Correct O(n log n) solution after a hint towards merge sort or a binary indexed tree, or a correct solution with a small fix for the equal-values case."
  weak: "Only the O(n^2) double loop, counts equal values as out of order, or overflows a 32-bit counter."
  criteria:
    correctness: "All tests pass, including empty input, duplicates and fully reversed sequences."
    efficiency: "Divide and conquer or a Fenwick tree with O(n log n) time; no quadratic pair scan."
    code_quality: "The merge step is clean, with the counting line clearly explained, and the input is not mutated unexpectedly."
    edge_cases: "Empty and single-element inputs, all-equal values and large build numbers."
    communication: "Explains why every remaining left element forms an out-of-order pair with the right element being taken."
hints:
  - "Comparing every pair is quadratic. Think about how sorting the list would naturally have to fix each out-of-order pair."
  - "In merge sort, when two sorted halves are merged, an element taken from the right half is smaller than every element still waiting in the left half. That tells you how many pairs it forms at once."
  - "Write a recursive merge sort that returns the sorted part and the count. During the merge, take from the left half when its element is less than or equal to the right one, so ties are not counted. When you take from the right half, add the number of elements still left in the left half. Sum the counts from both halves and from the merge, using a 64-bit counter."
followups:
  - "How would you solve it with a Fenwick tree, and what does coordinate compression add?"
  - "How would you count out-of-order pairs within every sliding window of the last k deploys?"
  - "What is the maximum possible count for n deploys, and why does it need 64 bits?"
  - "If deploys arrive as a stream, how could you keep the count updated after each one?"
common_errors:
  - "Using a strict less-than when merging, which counts equal build numbers as out of order."
  - "Adding the size of the whole left half instead of only the elements not yet merged."
  - "Using a 32-bit counter, which overflows for large inputs."
  - "Stopping at the quadratic double loop."
