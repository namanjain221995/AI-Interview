expected_concepts:
  - "compute the remaining gap per container"
  - "greedy: fill the smallest gaps first"
  - "sorting the gaps"
  - "subtract from the remaining budget to avoid overflow"
optimal_complexity: {time: "O(n log n)", space: "O(n) for the gaps"}
rubric:
  excellent: "Reduces the problem to gaps, sorts them, fills the smallest first while the budget lasts, explains why this maximises the count and avoids overflow by subtracting from the budget."
  good: "Correct gap-sorting greedy with a small prompt on the stopping condition or overflow."
  weak: "Fills containers in input order, sorts by capacity instead of gap, or distributes crates one at a time."
  criteria:
    correctness: "All tests pass, including no spare crates, all-full input and very large stock."
    efficiency: "One sort plus a linear pass; never loops crate by crate."
    code_quality: "Gap computation and the greedy loop are clearly separated with descriptive names."
    edge_cases: "Zero gaps, zero spare crates, gaps up to 10^9 and spare stock exceeding all gaps."
    communication: "Explains the exchange argument: replacing a filled container with a cheaper unfilled one never reduces the count."
hints:
  - "What matters for each container is only how many crates it is still missing."
  - "To fill as many containers as possible, spend the spare crates on the containers that need the fewest first."
  - "Compute capacity[i] - loaded[i] for every container, sort these gaps ascending and walk them, subtracting each gap from the remaining stock and counting it until a gap is larger than what is left."
followups:
  - "Prove that filling the smallest gaps first maximises the number of full containers."
  - "If the gaps are small integers, how could you avoid a comparison sort?"
  - "How would you answer many queries with different extra_crates values efficiently?"
  - "What if each full container had a different value and you wanted the maximum total value?"
common_errors:
  - "Sorting by capacity or by loaded amount instead of by the remaining gap."
  - "Continuing after a gap does not fit, which can only skip to larger gaps and never helps."
  - "Summing gaps into a 32-bit accumulator that overflows instead of subtracting from the budget."
  - "Forgetting that already-full containers count with a gap of zero."
