title: Top Up Shipping Containers
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Top Up Shipping Containers

  A port operator only lets a shipping container sail when it is **completely full**. Container `i` can
  hold `capacity[i]` crates and already holds `loaded[i]` crates. A spare stock of `extra_crates` crates
  is waiting on the dock, and any number of them can be placed into any containers (no container may
  exceed its capacity, and leftover crates may stay on the dock).

  Return the **maximum number of containers that are completely full** after placing the spare crates.

  - Containers that are already full count without using any spare crates.
  - `capacity` and `loaded` have the same length.

  ### Example 1
  ```
  Input:  capacity = [5, 3, 4, 6], loaded = [2, 3, 1, 6], extra_crates = 4
  Output: 3
  Explanation: Two containers are already full; the others each need 3 crates, so only one of them can be filled.
  ```

  ### Example 2
  ```
  Input:  capacity = [10, 4, 8], loaded = [1, 2, 6], extra_crates = 3
  Output: 1
  Explanation: Gaps are 9, 2 and 2. Filling one 2-crate gap leaves 1 crate, not enough for the next.
  ```

  ### Constraints
  - `1 <= capacity.length == loaded.length <= 5 * 10^4`
  - `1 <= capacity[i] <= 10^9`
  - `0 <= loaded[i] <= capacity[i]`
  - `0 <= extra_crates <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: top_up_shipping_containers
  params:
    - {name: capacity, type: "int[]"}
    - {name: loaded, type: "int[]"}
    - {name: extra_crates, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def top_up_shipping_containers(capacity: list[int], loaded: list[int], extra_crates: int) -> int:
        gaps = sorted(c - l for c, l in zip(capacity, loaded))
        remaining = extra_crates
        full = 0
        for gap in gaps:
            if gap > remaining:
                break
            remaining -= gap
            full += 1
        return full
  javascript: |
    function topUpShippingContainers(capacity, loaded, extraCrates) {
      const gaps = capacity.map((c, i) => c - loaded[i]).sort((a, b) => a - b);
      let remaining = extraCrates;
      let full = 0;
      for (const gap of gaps) {
        if (gap > remaining) break;
        remaining -= gap;
        full += 1;
      }
      return full;
    }
