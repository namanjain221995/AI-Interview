version: 1
slug: common_uptime_window
title: "Common Uptime Window"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, network]
time_limit_minutes: 12
prompt_markdown: |
  ## Common Uptime Window

  A failover drill needs a moment when **every** server in a pool is online. Each server reports one
  uptime window `[start, end]` for the drill day; both ends are inclusive and `start <= end`. The
  reports arrive in no particular order.

  Return the window `[s, e]` containing exactly the instants at which every server is up at the same
  time. A single shared instant counts (then `s == e`). If there is no such instant, or the pool has
  no servers, return an empty list `[]`.

  ### Example 1
  ```
  Input:  windows = [[3, 15], [5, 20], [1, 12]]
  Output: [5, 12]
  ```

  ### Example 2
  ```
  Input:  windows = [[0, 4], [6, 9]]
  Output: []
  Explanation: The servers are never up at the same time.
  ```

  ### Example 3
  ```
  Input:  windows = [[2, 8], [8, 11]]
  Output: [8, 8]
  Explanation: Both servers are up only at instant 8.
  ```

  ### Constraints
  - `0 <= windows.length <= 10^5`
  - `windows[i].length == 2`
  - `0 <= start <= end <= 10^9`

  **Follow-up:** how would you find the longest stretch during which at least `k` servers are up?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: common_uptime_window
  params:
    - {name: windows, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def common_uptime_window(windows: list[list[int]]) -> list[int]:
        if not windows:
            return []
        latest_start = max(start for start, _ in windows)
        earliest_end = min(end for _, end in windows)
        if latest_start > earliest_end:
            return []
        return [latest_start, earliest_end]
  javascript: |
    function commonUptimeWindow(windows) {
      if (windows.length === 0) return [];
      let latestStart = -Infinity;
      let earliestEnd = Infinity;
      for (const [start, end] of windows) {
        if (start > latestStart) latestStart = start;
        if (end < earliestEnd) earliestEnd = end;
      }
      return latestStart > earliestEnd ? [] : [latestStart, earliestEnd];
    }
