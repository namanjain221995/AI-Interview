expected_concepts:
  - "intersection of intervals is [max of starts, min of ends]"
  - "single pass without sorting"
  - "inclusive endpoints so a single shared instant is valid"
  - "empty input and empty intersection handling"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "States that the intersection is from the latest start to the earliest end, solves it in one pass without sorting, and handles empty input and touching endpoints."
  good: "Correct result, perhaps after sorting or merging step by step, with the inclusive boundary handled."
  weak: "Only checks adjacent pairs, treats touching windows as disjoint, or crashes on an empty pool."
  criteria:
    correctness: "All tests pass, including touching endpoints and the empty pool."
    efficiency: "Linear single pass; sorting is acceptable but unnecessary."
    code_quality: "Clear names for the running latest start and earliest end; a simple final comparison."
    edge_cases: "No servers, one server, zero-length windows, nested windows and pairwise-overlapping windows with no common point."
    communication: "Explains why pairwise overlap is not enough and why the extreme start and end determine the answer."
hints:
  - "An instant is shared by everyone only if it is not before any server comes up and not after any server goes down."
  - "Which single start time and which single end time bound the shared window?"
  - "Track the largest start and the smallest end in one pass; if the largest start is not after the smallest end, they form the answer, otherwise return an empty list."
followups:
  - "How would you find the longest window during which at least k servers are up?"
  - "What if each server reported several uptime windows during the day?"
  - "How would you handle half-open windows where the end instant is excluded?"
common_errors:
  - "Checking only that each pair of consecutive windows overlaps."
  - "Using a strict comparison so a single shared instant is reported as no overlap."
  - "Indexing the first window without checking for an empty pool."
