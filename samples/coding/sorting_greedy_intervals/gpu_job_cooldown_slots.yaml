slug: gpu_job_cooldown_slots
title: GPU Job Cooldown Scheduling
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [ml, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## GPU Job Cooldown Scheduling

  A shared GPU executes queued jobs **one per time slot**; every job takes exactly one slot. Each job is
  labelled with its type, for example `"train"` or `"embed"`. Switching weights back in for the same
  model is expensive, so the scheduler enforces a rule: between two jobs of the **same type** there must
  be at least `cooldown` other slots. Those slots can run jobs of other types or be left idle.

  The jobs may run in **any order**. Return the **minimum total number of slots**, idle slots included,
  needed to finish every job. Return `0` when there are no jobs.

  ### Example 1
  ```
  Input:  job_types = ["train", "train", "train", "embed", "embed", "eval"], cooldown = 2
  Output: 7
  Explanation: train, embed, eval, train, embed, idle, train
  ```

  ### Example 2
  ```
  Input:  job_types = ["train", "embed", "eval", "train"], cooldown = 1
  Output: 4
  Explanation: train, embed, train, eval needs no idle slot.
  ```

  ### Example 3
  ```
  Input:  job_types = ["infer", "infer", "infer"], cooldown = 0
  Output: 3
  ```

  ### Constraints
  - `0 <= job_types.length <= 10^4`
  - `1 <= job_types[i].length <= 20`; types are case-sensitive
  - `0 <= cooldown <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: gpu_job_cooldown_slots
  params:
    - {name: job_types, type: "string[]"}
    - {name: cooldown, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def gpu_job_cooldown_slots(job_types: list[str], cooldown: int) -> int:
        if not job_types:
            return 0
        counts = Counter(job_types).values()
        peak = max(counts)
        peak_types = sum(1 for count in counts if count == peak)
        # The most frequent types fix a frame of (peak - 1) full cycles plus a final partial cycle.
        frame = (peak - 1) * (cooldown + 1) + peak_types
        return max(len(job_types), frame)
  javascript: |
    function gpuJobCooldownSlots(jobTypes, cooldown) {
      if (jobTypes.length === 0) return 0;
      const counts = new Map();
      for (const type of jobTypes) counts.set(type, (counts.get(type) || 0) + 1);
      let peak = 0;
      for (const count of counts.values()) peak = Math.max(peak, count);
      let peakTypes = 0;
      for (const count of counts.values()) if (count === peak) peakTypes += 1;
      const frame = (peak - 1) * (cooldown + 1) + peakTypes;
      return Math.max(jobTypes.length, frame);
    }
