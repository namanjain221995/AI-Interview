expected_concepts:
  - count jobs per type with a hash map
  - the most frequent type determines the idle frame
  - several types tied at the highest count share the last cycle
  - answer is the larger of the job count and the frame length
  - greedy simulation with a max-heap and a cooldown queue as an alternative
optimal_complexity: {time: O(n), space: O(k)}
rubric:
  excellent: Counts types, explains the frame built from the most frequent type, accounts for ties at the highest count and for the case where other jobs fill every gap, and states O(n) time; or implements a heap simulation and explains its cost.
  good: Reaches a correct formula or a correct heap-based simulation with some prompting and handles ties.
  weak: Simulates in the given order, ignores tied most-frequent types, or forgets that the answer can never be below the number of jobs.
  criteria:
    correctness: All tests pass, including ties at the highest count, zero cooldown and more distinct types than gaps.
    efficiency: Linear counting pass (or n log k heap simulation); no brute force over orders.
    code_quality: Clear separation of counting and the final computation with descriptive names.
    edge_cases: Empty list, a single job, cooldown of zero, a very large cooldown, case-sensitive type names.
    communication: Explains why the most frequent type forces idle slots and when other jobs absorb them.
hints:
  - The order is yours to choose, so only how many jobs of each type there are matters. Which type is hardest to fit?
  - Lay out the most frequent type first with exactly the required gap between its runs; the other jobs go into those gaps. What if several types share the highest count, and what if there are more jobs than gap positions?
  - Count each type, let the highest count be m and the number of types with that count be t. The frame needs m minus one full cycles of cooldown plus one slots, followed by t final slots; the answer is the larger of that frame length and the total number of jobs.
followups:
  - How would you produce an actual schedule, not just its length?
  - What changes if jobs of different types also take different numbers of slots?
  - How would you handle jobs that arrive over time instead of all being queued up front?
  - Why is it safe to say extra jobs never create new idle slots once the gaps are full?
common_errors:
  - Counting only one type with the highest count instead of all tied types.
  - Returning the frame length even when it is smaller than the number of jobs.
  - Simulating the jobs in the given order instead of choosing the order.
  - Using the cooldown as the cycle length instead of cooldown plus one.
