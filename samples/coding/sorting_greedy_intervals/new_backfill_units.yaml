slug: new_backfill_units
title: Newly Backfilled Units per Job
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [data, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Newly Backfilled Units per Job

  A data platform team repairs a large table one partition at a time. Partitions are numbered with
  integer ids, and a **backfill job** rewrites a contiguous block of them. Job `i` is given as
  `jobs[i] = [lo, hi]` and covers the partition ids `lo, lo + 1, ..., hi - 1` (the range includes `lo`
  and excludes `hi`).

  The jobs run one after another in the order they appear in `jobs`. Once a partition has been
  filled by any job it stays filled, so a later job that covers it again does no new work there.

  Return an array `result` with one entry per job, where `result[i]` is the number of partitions that
  job `i` fills **for the first time** (partitions in its range that no earlier job covered).

  ### Example 1
  ```
  Input:  jobs = [[2, 6], [4, 9], [0, 3], [1, 8]]
  Output: [4, 3, 2, 0]
  Explanation: job 0 fills 2-5; job 1 adds 6-8; job 2 adds 0-1; job 3 covers 1-7, which are all filled.
  ```

  ### Example 2
  ```
  Input:  jobs = [[10, 20], [10, 20], [15, 25]]
  Output: [10, 0, 5]
  Explanation: the repeated job finds 10-19 already filled; the third job only adds 20-24.
  ```

  ### Constraints
  - `1 <= jobs.length <= 2 * 10^4`
  - `0 <= lo < hi <= 5 * 10^4`
  - Simulating every partition of every job can take about `10^9` steps; aim for close to linear work.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: new_backfill_units
  params:
    - {name: jobs, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def new_backfill_units(jobs: list[list[int]]) -> list[int]:
        if not jobs:
            return []
        limit = max(hi for _, hi in jobs)
        # nxt[x] leads to the smallest unfilled partition >= x; limit is a sentinel.
        nxt = list(range(limit + 1))

        def find(x: int) -> int:
            root = x
            while nxt[root] != root:
                root = nxt[root]
            while nxt[x] != root:
                nxt[x], x = root, nxt[x]
            return root

        result: list[int] = []
        for lo, hi in jobs:
            filled = 0
            x = find(lo)
            while x < hi:
                filled += 1
                nxt[x] = x + 1
                x = find(x + 1)
            result.append(filled)
        return result
  javascript: |
    function newBackfillUnits(jobs) {
      if (jobs.length === 0) return [];
      let limit = 0;
      for (const [, hi] of jobs) limit = Math.max(limit, hi);
      const nxt = new Int32Array(limit + 1);
      for (let i = 0; i <= limit; i++) nxt[i] = i;
      const find = (x) => {
        let root = x;
        while (nxt[root] !== root) root = nxt[root];
        while (nxt[x] !== root) {
          const next = nxt[x];
          nxt[x] = root;
          x = next;
        }
        return root;
      };
      const result = [];
      for (const [lo, hi] of jobs) {
        let filled = 0;
        let x = find(lo);
        while (x < hi) {
          filled++;
          nxt[x] = x + 1;
          x = find(x + 1);
        }
        result.push(filled);
      }
      return result;
    }
