expected_concepts:
  - "half-open ranges and why back-to-back ranges do not overlap"
  - "skipping already-filled partitions with a next-unfilled pointer (union-find with path compression)"
  - "alternative: an ordered set of disjoint filled intervals merged as jobs arrive"
  - "amortised analysis: each partition is filled exactly once"
optimal_complexity: {time: "O((n + U) * alpha(U)) where U is the largest hi", space: "O(U)"}
rubric:
  excellent: "Identifies that each partition is filled at most once, uses a next-unfilled pointer with path compression (or a merged interval set) so total work is near linear, and explains the amortised argument and the half-open boundaries."
  good: "Reaches a correct interval-merging or union-find solution with a hint, or a correct solution whose worst case is slightly worse than linear but clearly better than per-partition rescans."
  weak: "Marks every partition of every job in a boolean array without skipping filled stretches, so repeated wide jobs take quadratic time, or mishandles the exclusive upper bound."
  criteria:
    correctness: "All tests pass, including repeated jobs, nested jobs and adjacent half-open ranges."
    efficiency: "Each partition is visited a constant amortised number of times; no full rescans of filled ranges."
    code_quality: "A small helper finds the next unfilled id; names make the half-open convention obvious."
    edge_cases: "Single-partition jobs, ranges touching id 0 or the upper bound, and jobs entirely inside filled areas."
    communication: "Explains why the pointer jumps stay valid and gives the amortised cost."
hints:
  - "Each partition can be filled only once, so the total amount of real work is bounded by the size of the id space, not by the sum of job lengths."
  - "The expensive part is walking over partitions that are already filled; try to jump straight from any id to the next id that is still empty."
  - "Keep for every id a pointer to the next unfilled id at or after it, follow pointers with path compression to find the first gap inside a job, and after filling an id point it at the following id so later searches skip it."
followups:
  - "How would you also report, per job, the list of new sub-ranges it filled?"
  - "What changes if the id space is up to 10^18 instead of 5 * 10^4?"
  - "How would you support undoing the most recent job?"
  - "Could jobs run in parallel if you wanted the same counts?"
common_errors:
  - "Treating hi as inclusive, which double counts partitions shared by back-to-back jobs."
  - "Marking a boolean array partition by partition, which is far too slow when large jobs repeat."
  - "Updating the skip pointers without path compression, so chains of filled ids get walked again and again."
