slug: single_worker_build_order
title: Single Worker Build Order
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [backend, platform, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## Single Worker Build Order

  A small CI installation has exactly **one** build worker. Build task `i` is described by
  `tasks[i] = [enqueue_time, duration]`: it enters the queue at time `enqueue_time` and needs `duration`
  time units of uninterrupted work.

  The worker follows these rules:

  - When the worker is idle and at least one queued task is available (`enqueue_time <= now`), it starts
    the available task with the **shortest duration**. If several have the same duration, it picks the one
    with the **smallest index**.
  - A started task always runs to completion; the worker becomes idle again at `start + duration` and
    immediately picks its next task at that same moment (tasks enqueued exactly at that moment are
    available).
  - If the worker is idle and nothing is available, it waits until the next task is enqueued.

  Return the task **indices in the order the worker executes them**. Return an empty list if there are
  no tasks.

  ### Example 1
  ```
  Input:  tasks = [[0, 5], [1, 2], [2, 1], [3, 2]]
  Output: [0, 2, 1, 3]
  Explanation: Task 0 starts at 0 and ends at 5. At time 5 tasks 1 (2), 2 (1) and 3 (2) are waiting: task 2 runs
               5-6, then tasks 1 and 3 tie on duration and the smaller index 1 runs 6-8, then task 3 runs 8-10.
  ```

  ### Example 2
  ```
  Input:  tasks = [[10, 3], [2, 4], [3, 1]]
  Output: [1, 2, 0]
  Explanation: Task 1 runs 2-6, task 2 runs 6-7, the worker waits until time 10 and runs task 0.
  ```

  ### Constraints
  - `0 <= tasks.length <= 10^5`
  - `tasks[i].length == 2`
  - `0 <= enqueue_time <= 10^9`
  - `1 <= duration <= 10^9`
  - The clock can exceed the 32-bit range; use 64-bit arithmetic for time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: single_worker_build_order
  params:
