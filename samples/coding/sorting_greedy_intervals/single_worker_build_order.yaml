  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def single_worker_build_order(tasks: list[list[int]]) -> list[int]:
        by_arrival = sorted(range(len(tasks)), key=lambda i: (tasks[i][0], i))
        ready: list[tuple[int, int]] = []  # (duration, index)
        order: list[int] = []
        now = 0
        k = 0
        n = len(tasks)
        while len(order) < n:
            if not ready and k < n and tasks[by_arrival[k]][0] > now:
                now = tasks[by_arrival[k]][0]  # idle: jump to the next enqueue
            while k < n and tasks[by_arrival[k]][0] <= now:
                i = by_arrival[k]
                heapq.heappush(ready, (tasks[i][1], i))
                k += 1
            duration, i = heapq.heappop(ready)
            order.append(i)
            now += duration
        return order
  javascript: |
    function singleWorkerBuildOrder(tasks) {
      const n = tasks.length;
      const byArrival = Array.from({ length: n }, (_, i) => i)
        .sort((a, b) => tasks[a][0] - tasks[b][0] || a - b);
      const heap = [];
      const less = (a, b) => (a[0] !== b[0] ? a[0] < b[0] : a[1] < b[1]);
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!less(heap[i], heap[p])) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1, r = l + 1;
            let m = i;
            if (l < heap.length && less(heap[l], heap[m])) m = l;
            if (r < heap.length && less(heap[r], heap[m])) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      const order = [];
      let now = 0;
      let k = 0;
      while (order.length < n) {
        if (heap.length === 0 && k < n && tasks[byArrival[k]][0] > now) now = tasks[byArrival[k]][0];
        while (k < n && tasks[byArrival[k]][0] <= now) {
          const i = byArrival[k++];
          push([tasks[i][1], i]);
        }
        const [duration, i] = pop();
        order.push(i);
        now += duration;
      }
      return order;
    }
