expected_concepts:
  - sorting task indices by enqueue time
  - min-heap keyed by (duration, index)
  - event simulation with a moving clock
  - jumping the clock forward when the worker is idle
  - 64-bit time arithmetic
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts indices by enqueue time, pushes every task that has arrived by the current time into a heap keyed by duration then index, jumps the clock when the heap is empty, uses 64-bit time and explains O(n log n)."
  good: "Correct heap simulation with a small fix after testing (idle jump or tie-break)."
  weak: "Scans all tasks every step (O(n^2)), forgets to jump over idle gaps, breaks ties by enqueue time, or loses original indices after sorting."
  criteria:
    correctness: "All tests pass, including idle gaps, exact-time arrivals and ties."
    efficiency: "Each task is pushed and popped once."
    code_quality: "Keeps original indices; the arrival pointer and the clock are clearly named."
    edge_cases: "Empty list, single task, identical tasks, very large times."
    communication: "States the tie-break rule and how the simulation advances time."
hints:
  - "At any moment, only tasks already enqueued can be chosen. How can you add tasks to the candidate pool in the order they become available?"
  - "Sort task indices by enqueue time and keep a priority queue of available tasks ordered by duration and then index. When nothing is available, the clock should jump to the next enqueue time."
  - "Loop until every task is scheduled; if the heap is empty move the clock to the next arrival, push every task whose enqueue time is at most the clock, pop the best task, record its index and advance the clock by its duration using 64-bit arithmetic."
followups:
  - "How would you compute each task's waiting time?"
  - "What changes with two workers?"
  - "What if running tasks could be preempted by a shorter arrival?"
common_errors:
  - "Not jumping the clock forward when idle, causing an infinite loop or a wrong pick."
  - "Breaking duration ties by enqueue time instead of index."
  - "Losing original indices after sorting."
  - "Using 32-bit time and overflowing on large durations."
