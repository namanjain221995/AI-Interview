time_limit_minutes: 20
prompt_markdown: |
  ## Merge Log Files at Minimum Cost

  A log archiver has collected several rotated log files and must combine them into **one** archive file.
  It can only merge **two files at a time**: merging a file of size `a` with a file of size `b` reads and
  writes `a + b` megabytes, so it **costs** `a + b`, and produces a single new file of size `a + b` that
  can take part in later merges. Any two current files may be merged, in any order.

  Given the sizes of the rotated files, return the **minimum total cost** to end up with a single file.
  If there are zero files or only one file, nothing needs to be merged and the cost is `0`.

  The answer can exceed the 32-bit integer range; return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  sizes = [4, 3, 6, 2]
  Output: 29
  Explanation: Merge 2 + 3 = 5 (cost 5), then 4 + 5 = 9 (cost 9), then 6 + 9 = 15 (cost 15).
               Total 5 + 9 + 15 = 29.
  ```

  ### Example 2
  ```
  Input:  sizes = [10, 10, 10]
  Output: 50
  Explanation: Merge 10 + 10 = 20 (cost 20), then 10 + 20 = 30 (cost 30). Total 50.
  ```

  ### Example 3
  ```
  Input:  sizes = []
  Output: 0
  ```

  ### Constraints
  - `0 <= sizes.length <= 10^5`
  - `0 <= sizes[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: merge_log_files_min_cost
  params:
    - {name: sizes, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def merge_log_files_min_cost(sizes: list[int]) -> int:
        heap = list(sizes)
        heapq.heapify(heap)
        total = 0
        while len(heap) > 1:
            a = heapq.heappop(heap)
            b = heapq.heappop(heap)
            total += a + b
            heapq.heappush(heap, a + b)
        return total
  javascript: |
    function mergeLogFilesMinCost(sizes) {
      const heap = [];
      const push = (v) => {
        heap.push(v);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p] <= heap[i]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1, r = l + 1;
            let m = i;
            if (l < heap.length && heap[l] < heap[m]) m = l;
            if (r < heap.length && heap[r] < heap[m]) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      for (const s of sizes) push(s);
      let total = 0;
      while (heap.length > 1) {
        const a = pop();
        const b = pop();
        total += a + b;
        push(a + b);
      }
      return total;
    }
