expected_concepts:
  - greedy choice of the two smallest current files
  - min-heap (priority queue) for repeated extract-min and insert
  - re-inserting the merged file so it can be merged again
  - optimal merge pattern / Huffman-style argument
  - 64-bit accumulation of the total cost
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Identifies that the two smallest current files should always be merged next, uses a min-heap, re-inserts merged files, justifies the greedy choice with an exchange argument, uses 64-bit totals and states O(n log n)."
  good: "Correct min-heap solution with 64-bit totals; the justification of the greedy choice is informal or needs a prompt."
  weak: "Sorts once and merges left to right without re-inserting, only merges adjacent files, re-sorts the whole list after every merge with no complexity discussion, or overflows a 32-bit total."
  criteria:
    correctness: "All tests pass, including zero-size files, a single file and an empty list."
    efficiency: "Each of the n - 1 merges costs O(log n) heap work."
    code_quality: "Clear heap usage; loop condition based on the number of remaining files."
    edge_cases: "Empty input, one file, zeros, very large sizes."
    communication: "Explains why a file's size is paid once per merge it takes part in, so small files should sit deepest in the merge tree."
hints:
  - "Each file's size is paid again every time the file (or a file containing it) takes part in a merge. Which files would you want to touch most often?"
  - "Merging the two smallest files available right now is always safe. You need a structure that repeatedly hands you the current minimum, including files you have just created."
  - "Put all sizes into a min-heap; while more than one file remains, pop the two smallest, add their sum to a 64-bit total and push the sum back. Return the total, which is zero when fewer than two files exist."
followups:
  - "How would you also output the merge order?"
  - "What if the archiver could merge up to k files at once for the sum of their sizes?"
  - "What if only neighbouring files in the rotation order could be merged?"
common_errors:
  - "Sorting once and merging in sorted order without re-inserting the merged file into its correct place."
  - "Only merging adjacent files, which answers a different (interval DP) problem."
  - "Accumulating in a 32-bit integer and overflowing on large inputs."
  - "Returning the final file size instead of the total merge cost."
