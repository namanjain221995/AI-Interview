slug: max_experiments_within_budget
title: "Maximum Experiments Within Budget"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [ml, data_scientist, cloud]
time_limit_minutes: 15
prompt_markdown: |
  ## Maximum Experiments Within Budget

  An ML research team has a queue of candidate training experiments. Running experiment `i` costs
  `costs[i]` compute credits, and each experiment runs at most once. The team has `budget` credits for
  the week and also holds **one priority voucher**: it may be applied to at most one of the chosen
  experiments, which then costs half its price **rounded up** (`ceil(costs[i] / 2)`).

  Return the **maximum number of experiments** the team can run so that the total credits spent
  (after the voucher, if used) does not exceed `budget`.

  ### Example 1
  ```
  Input:  costs = [6, 3, 10, 4], budget = 10
  Output: 3
  Explanation: Run the experiments costing 3, 4 and 6 with the voucher on the 6 (it costs 3): 3 + 4 + 3 = 10. All four would cost at least 3 + 4 + 6 + 5 = 18.
  ```

  ### Example 2
  ```
  Input:  costs = [9, 9, 9], budget = 4
  Output: 0
  Explanation: Even with the voucher one experiment costs 5 credits.
  ```

  ### Example 3
  ```
  Input:  costs = [5, 1, 1], budget = 7
  Output: 3
  ```

  ### Constraints
  - `1 <= costs.length <= 10^5`
  - `1 <= costs[i] <= 10^9`
  - `0 <= budget <= 2 * 10^9`
  - Running totals can exceed the 32-bit integer range.

  **Follow-up:** how would you answer many different budgets against the same queue efficiently?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_experiments_within_budget
  params:
    - {name: costs, type: "int[]"}
    - {name: budget, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_experiments_within_budget(costs: list[int], budget: int) -> int:
        ordered = sorted(costs)
        total = 0
        best = 0
        for k, cost in enumerate(ordered, start=1):
            total += cost
            # The voucher goes on the most expensive chosen experiment, which is this one.
            if total - cost // 2 > budget:
                break
            best = k
        return best
  javascript: |
    function maxExperimentsWithinBudget(costs, budget) {
      const ordered = [...costs].sort((a, b) => a - b);
      let total = 0;
      let best = 0;
      for (let k = 0; k < ordered.length; k++) {
        total += ordered[k];
        if (total - Math.floor(ordered[k] / 2) > budget) break;
        best = k + 1;
      }
      return best;
    }
