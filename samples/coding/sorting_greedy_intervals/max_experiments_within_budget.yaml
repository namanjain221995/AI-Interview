expected_concepts:
  - "sort costs ascending and take the cheapest experiments"
  - "exchange argument for choosing the k cheapest"
  - "apply the discount to the most expensive chosen item"
  - "half rounded up means the saving is floor(cost / 2)"
  - "64-bit running totals"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts ascending, argues that the k cheapest are optimal and that the voucher belongs on the largest of them, handles the rounding and 64-bit totals, and stops at the first k that fails."
  good: "Correct sort-and-prefix solution with the voucher on the right item after small hints; minor gaps in the justification."
  weak: "Applies the voucher to the cheapest item, rounds the half down, tries every subset, or overflows on large totals."
  criteria:
    correctness: "All tests pass, including the rounding trap and the case where nothing fits."
    efficiency: "One sort plus a linear scan; no subset enumeration or per-k re-summing."
    code_quality: "Clear running total, an explicit comment or name for the voucher saving and an early exit."
    edge_cases: "Zero budget, a single experiment, duplicate costs, odd costs and totals beyond 32-bit range."
    communication: "Explains why the discount should go on the most expensive chosen experiment and why that keeps the greedy valid."
hints:
  - "If you plan to run k experiments, which k experiments make the total as small as possible?"
  - "For a fixed chosen set, the voucher saves the most when it is applied to the most expensive experiment in that set."
  - "Sort the costs ascending and grow the prefix one experiment at a time; the newest one is the most expensive so far, so subtract half of it rounded down from the running total and stop at the first prefix that exceeds the budget."
followups:
  - "Prove that the minimal cost of running k experiments only grows as k grows."
  - "How would the solution change with two vouchers, or with a voucher that removes a fixed number of credits?"
  - "How would you answer many budget queries against the same queue?"
common_errors:
  - "Applying the voucher to the cheapest experiment, which saves the least."
  - "Rounding the discounted price down instead of up."
  - "Using a 32-bit running total that overflows on large costs."
  - "Forgetting that using the voucher is optional and never hurts."
