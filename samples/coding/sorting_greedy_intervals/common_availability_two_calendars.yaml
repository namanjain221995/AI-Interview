expected_concepts:
  - sorting and merging intervals (including touching half-open blocks)
  - two-pointer intersection of sorted interval lists
  - half-open interval semantics
  - filtering by minimum length after merging
optimal_complexity: {time: "O((n + m) log(n + m))", space: "O(n + m)"}
rubric:
  excellent: "Normalises each calendar by sorting and merging overlapping or touching blocks, intersects the merged lists with two pointers, filters by min_length only after merging, and explains why touching half-open blocks must merge."
  good: "Correct merge and intersection but initially forgets to merge touching blocks or applies the length filter to unmerged pieces."
  weak: "Intersects raw unsorted blocks pairwise without merging, splits continuous stretches, or treats touching blocks as overlapping in the result."
  criteria:
    correctness: "All tests pass, including touching, duplicate and contained blocks and the exact min_length boundary."
    efficiency: "Sorting plus linear merge and two-pointer passes; no per-minute arrays."
    code_quality: "Separate merge helper and a clear advance rule for the two pointers."
    edge_cases: "Empty calendars, blocks that only touch across calendars, stretches exactly min_length long."
    communication: "Explains the half-open convention and why maximality forces merging before filtering."
hints:
  - "Each calendar is messy - before comparing two people, think about rewriting each person's free time as a clean, sorted list of separate stretches."
  - "Sort each list and merge blocks that overlap or touch (a block starting exactly where the previous one ends continues it); two sorted, disjoint lists can then be intersected by walking both at once."
  - "Merge each calendar, then keep one pointer per list: the common part of the current pair is from the larger start to the smaller end, keep it when its length reaches min_length, and advance the pointer whose block ends first."
followups:
  - "How would you extend this to find stretches when all of k engineers are free?"
  - "How would you return only the earliest stretch long enough for the meeting, and can you stop early?"
  - "What changes if the blocks were closed intervals measured in whole minutes?"
common_errors:
  - "Not merging touching blocks, so a continuous stretch is split and may fall below min_length."
  - "Applying the min_length filter before merging, which drops pieces of a long stretch."
  - "Assuming the input lists are sorted and disjoint."
  - "Advancing both pointers at once and missing an intersection."
