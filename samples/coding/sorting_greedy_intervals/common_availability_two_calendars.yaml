time_limit_minutes: 25
prompt_markdown: |
  ## Common Availability of Two Calendars

  A scheduling assistant wants to book a pairing session for two engineers. Each engineer's free time
  was exported from **several** calendar sources, so each list of free blocks is **unsorted**, and blocks
  in the same list **may overlap, repeat or touch**.

  A block `[start, end]` is measured in minutes from the start of the week and is **half-open**: the
  engineer is free from minute `start` up to, but not including, minute `end` (`start < end`). The blocks
  `[60, 90]` and `[90, 120]` therefore describe one continuous free stretch `[60, 120]`.

  Return every **maximal** stretch of time during which **both** engineers are free and whose length
  (`end - start`) is **at least** `min_length` minutes. A continuous common stretch must be returned as a
  single `[start, end]` pair (never split into touching pieces), using the same half-open convention. Sort
  the result by `start`, and return an empty list when no common stretch is long enough.

  ### Example 1
  ```
  Input:  first = [[90, 120], [60, 90], [200, 260]], second = [[70, 100], [100, 110], [230, 300]], min_length = 30
  Output: [[70, 110], [230, 260]]
  Explanation: the first engineer is free during [60, 120] and [200, 260]; the second during [70, 110]
               and [230, 300]. Both are free during [70, 110] (40 minutes) and [230, 260] (30 minutes).
  ```

  ### Example 2
  ```
  Input:  first = [[0, 50]], second = [[30, 100], [10, 20]], min_length = 15
  Output: [[30, 50]]
  Explanation: the common stretch [10, 20] lasts only 10 minutes and is dropped.
  ```

  ### Constraints
  - `0 <= first.length, second.length <= 10^4`
  - `0 <= start < end <= 10^9` for every block
  - `1 <= min_length <= 10^9`
