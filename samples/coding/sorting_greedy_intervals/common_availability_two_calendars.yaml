reference_solutions:
  python: |
    def common_availability_two_calendars(
        first: list[list[int]], second: list[list[int]], min_length: int
    ) -> list[list[int]]:
        def merge(blocks: list[list[int]]) -> list[list[int]]:
            merged: list[list[int]] = []
            for start, end in sorted(blocks):
                if merged and start <= merged[-1][1]:
                    merged[-1][1] = max(merged[-1][1], end)
                else:
                    merged.append([start, end])
            return merged

        a, b = merge(first), merge(second)
        result: list[list[int]] = []
        i = j = 0
        while i < len(a) and j < len(b):
            start = max(a[i][0], b[j][0])
            end = min(a[i][1], b[j][1])
            if end - start >= min_length:
                result.append([start, end])
            if a[i][1] < b[j][1]:
                i += 1
            else:
                j += 1
        return result
  javascript: |
    function commonAvailabilityTwoCalendars(first, second, minLength) {
      const merge = (blocks) => {
        const sorted = blocks.map((b) => [b[0], b[1]]).sort((x, y) => x[0] - y[0] || x[1] - y[1]);
        const merged = [];
        for (const [start, end] of sorted) {
          if (merged.length && start <= merged[merged.length - 1][1]) {
            const last = merged[merged.length - 1];
            last[1] = Math.max(last[1], end);
          } else {
            merged.push([start, end]);
          }
        }
        return merged;
      };
      const a = merge(first);
      const b = merge(second);
      const result = [];
      let i = 0;
      let j = 0;
      while (i < a.length && j < b.length) {
        const start = Math.max(a[i][0], b[j][0]);
        const end = Math.min(a[i][1], b[j][1]);
        if (end - start >= minLength) result.push([start, end]);
        if (a[i][1] < b[j][1]) i++;
        else j++;
      }
      return result;
    }
