slug: build_then_test_pipeline
title: Build-Then-Test Pipeline Makespan
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [devops, qa, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Build-Then-Test Pipeline Makespan

  A release pipeline must ship `n` services. Service `i` first needs `build_time[i]` minutes on the
  **single shared builder**, which handles one build at a time and never interrupts a build. As soon as a
  service's build finishes, its test suite starts on its own test runner and takes `test_time[i]`
  minutes. There are enough test runners for every service, so tests of different services run in
  parallel with each other and with later builds.

  The builder starts at minute `0` and stays busy from one build to the next. You choose the **order** in
  which services are built. Return the **earliest minute at which every test has finished** over all
  possible build orders. With no services the answer is `0`.

  ### Example 1
  ```
  Input:  build_time = [3, 1, 2], test_time = [2, 5, 1]
  Output: 7
  Explanation: Build service 1 (done at 1, tested by 6), then service 0 (done at 4, tested by 6),
               then service 2 (done at 6, tested by 7). No order finishes before minute 7.
  ```

  ### Example 2
  ```
  Input:  build_time = [4, 4], test_time = [0, 10]
  Output: 14
  Explanation: Building service 1 first finishes its test at 14 while service 0 is built by 8.
               The other order would finish at 18.
  ```

  ### Constraints
  - `0 <= n <= 10^5`
  - `build_time.length == test_time.length == n`
  - `1 <= build_time[i] <= 10^4`
  - `0 <= test_time[i] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: build_then_test_pipeline
  params:
    - {name: build_time, type: "int[]"}
    - {name: test_time, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def build_then_test_pipeline(build_time: list[int], test_time: list[int]) -> int:
        # Longest tests first: they get the most overlap with later builds.
        order = sorted(range(len(build_time)), key=lambda i: -test_time[i])
        clock = 0
        finish = 0
        for i in order:
            clock += build_time[i]
            finish = max(finish, clock + test_time[i])
        return finish
  javascript: |
    function buildThenTestPipeline(buildTime, testTime) {
      const order = buildTime.map((_, i) => i).sort((a, b) => testTime[b] - testTime[a]);
      let clock = 0;
      let finish = 0;
      for (const i of order) {
        clock += buildTime[i];
        finish = Math.max(finish, clock + testTime[i]);
      }
      return finish;
    }
