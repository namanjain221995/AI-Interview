expected_concepts:
  - sorting by test time in descending order
  - exchange argument for adjacent services
  - prefix sums of build times
  - makespan as the maximum of build completion plus test time
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts services by test time descending, computes the running build clock and the maximum of clock plus test time, proves the order with an exchange argument and states O(n log n)."
  good: "Correct sort-by-test-descending solution with an informal justification."
  weak: "Sorts by build time, by build plus test, or by ratio; tries permutations; or returns the sum of all times."
  criteria:
    correctness: "All tests pass, including instant tests, ties and the empty pipeline."
    efficiency: "One sort plus a linear sweep."
    code_quality: "Does not reorder the two input arrays independently; keeps build and test of a service together."
    edge_cases: "Empty input, one service, zero test times, maximum values."
    communication: "Explains why swapping two adjacent services where the earlier has the shorter test never makes things worse."
hints:
  - "The builder is busy for the same total time regardless of order. What changes between orders is which tests are still running after the final build."
  - "Compare two services built back to back. Which one should go first so the later of their two test finish times is as small as possible?"
  - "Sort services by test time from longest to shortest, keep a running total of build time, and for each service take the maximum of that running total plus its test time; that maximum is the answer."
followups:
  - "What if there were only one test runner too (a two-machine flow shop)?"
  - "What if some services had to be built before others?"
  - "How would you output the build order as well?"
common_errors:
  - "Sorting by build time instead of test time."
  - "Sorting the two arrays separately, which breaks the pairing of build and test."
  - "Returning the total build time plus the maximum test time."
  - "Forgetting to take the maximum over all services, using only the last one."
