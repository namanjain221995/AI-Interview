title: Sort Error Codes by Frequency
difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [sre, backend, data_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Sort Error Codes by Frequency

  An incident triage tool samples error codes from application logs and wants to show the noisiest
  problems first. Given the sampled `codes`, return the **same codes** (every occurrence kept)
  rearranged so that:

  1. Codes that occur **more often** come first.
  2. Codes that occur equally often are ordered by **smaller code first** (numeric order; codes can
     be negative, for example internal client-side errors).
  3. All copies of the same code are next to each other.

  ### Example 1
  ```
  Input:  codes = [500, 503, 404, 503, 404, 503]
  Output: [503, 503, 503, 404, 404, 500]
  Explanation: 503 appears three times, 404 twice and 500 once.
  ```

  ### Example 2
  ```
  Input:  codes = [429, 502, 429, 401, 502, 401]
  Output: [401, 401, 429, 429, 502, 502]
  Explanation: Every code appears twice, so the groups are ordered by code value.
  ```

  ### Constraints
  - `0 <= codes.length <= 10^5`
  - `-10^5 <= codes[i] <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sort_error_codes_by_frequency
  params:
    - {name: codes, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def sort_error_codes_by_frequency(codes: list[int]) -> list[int]:
        counts = Counter(codes)
        result: list[int] = []
        for code in sorted(counts, key=lambda c: (-counts[c], c)):
            result.extend([code] * counts[code])
        return result
  javascript: |
    function sortErrorCodesByFrequency(codes) {
      const counts = new Map();
      for (const c of codes) counts.set(c, (counts.get(c) || 0) + 1);
      const distinct = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a) || a - b);
      const result = [];
      for (const c of distinct) {
        for (let k = 0; k < counts.get(c); k++) result.push(c);
      }
      return result;
    }
