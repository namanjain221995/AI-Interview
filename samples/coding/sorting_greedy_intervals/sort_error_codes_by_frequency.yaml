expected_concepts:
  - "count occurrences with a hash map"
  - "sort distinct codes by a composite key (frequency descending, code ascending)"
  - "expand counts back into a list"
  - "bucket sort by frequency as a linear-time alternative"
optimal_complexity: {time: "O(n + k log k)", space: "O(n)"}
rubric:
  excellent: "Counts once, sorts only the distinct codes by frequency descending then code ascending, expands the groups, and can describe a bucket-by-frequency alternative."
  good: "Correct result by sorting the full list with a frequency lookup in the comparator; complexity explained with some prompting."
  weak: "Recounts occurrences inside the comparator, gets the tie-break direction wrong, or loses duplicates."
  criteria:
    correctness: "All tests pass, including ties, negative codes and an all-identical sample."
    efficiency: "One counting pass and a sort of distinct codes (or the full list with O(1) lookups); no counting inside comparisons."
    code_quality: "Readable composite key, counting and expansion clearly separated."
    edge_cases: "Empty and single-element samples, all distinct, all identical, negative values."
    communication: "States the ordering rules and why sorting distinct codes is cheaper than sorting every occurrence."
hints:
  - "Before you can order anything, you need to know how often each code occurs."
  - "With a count per code, you only need to order the distinct codes; think about a sort rule that compares counts first and code values second."
  - "Count the codes in a map, sort the distinct codes by count from high to low and by code from low to high when counts are equal, then write each code out as many times as it occurred."
followups:
  - "How would you do this in linear time using buckets indexed by frequency?"
  - "How would you return only the codes that make up 80% of all errors?"
  - "What changes if the sample is a stream and you need the ranking at any moment?"
  - "Why can sorting the full list with a frequency comparator still be correct but slower?"
common_errors:
  - "Breaking frequency ties by larger code first or by first appearance."
  - "Counting occurrences inside the comparator, making the sort quadratic or worse."
  - "Returning each distinct code once instead of every occurrence."
  - "Comparing negative codes incorrectly by sorting them as strings."
