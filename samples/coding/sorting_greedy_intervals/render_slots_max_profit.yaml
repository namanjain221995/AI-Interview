expected_concepts:
  - sorting jobs by deadline
  - min-heap of accepted profits
  - evicting the least profitable job when the accepted count exceeds the current deadline
  - exchange argument for the greedy choice
  - deadlines up to 10^9 rule out an array of hours
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by deadline, keeps a min-heap of accepted profits sized by the current deadline, evicts the cheapest when it overflows, explains why the accepted set stays feasible and optimal, handles huge deadlines and uses a 64-bit total."
  good: "Correct heap solution, or a correct profit-descending greedy with a slot search that is only adequate for small deadlines, with the limitation acknowledged."
  weak: "Takes the highest-profit jobs regardless of deadlines, schedules by earliest deadline without eviction, or allocates an array sized by the maximum deadline."
  criteria:
    correctness: "All tests pass, including ties, zero profits and jobs that must be displaced."
    efficiency: "O(n log n) independent of deadline magnitude."
    code_quality: "Clear separation between sorting, the heap invariant and the final sum."
    edge_cases: "Empty input, a single job, many jobs sharing deadline 1, deadlines far larger than n."
    communication: "States the invariant: after processing deadline d, the heap holds the best set of at most d jobs among those seen, which can all be scheduled by their deadlines."
hints:
  - "A set of jobs can be scheduled exactly when, for every hour d, at most d of the chosen jobs have a deadline of d or earlier. Which order of processing makes that easy to check?"
  - "Walk the jobs in order of deadline and tentatively accept each one. If you now hold more jobs than the current deadline allows, one must go. Which one should you drop?"
  - "Sort by deadline, push each profit onto a min-heap, and whenever the heap size exceeds the current deadline pop the smallest profit; at the end the heap is the chosen set, so return the sum of its profits as a 64-bit value."
followups:
  - "How would you also output which job runs in which hour?"
  - "What changes if jobs take different numbers of hours?"
  - "What if the node could run two jobs per hour?"
common_errors:
  - "Taking the most profitable jobs without checking deadlines."
  - "Allocating an array of hours up to the maximum deadline, which fails for deadlines near 10^9."
  - "Earliest-deadline-first without evicting cheap jobs when a better one arrives."
  - "Summing profits in a 32-bit integer."
