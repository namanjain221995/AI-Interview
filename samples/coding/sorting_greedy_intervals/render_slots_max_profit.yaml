title: Render Farm Slot Profit
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [platform, backend, ml]
time_limit_minutes: 25
prompt_markdown: |
  ## Render Farm Slot Profit

  A studio rents out one render node by the hour. The node runs **at most one job per hour**, every job
  takes exactly **one hour**, and hours are numbered `1, 2, 3, ...` from now. Clients have submitted render
  jobs, where `jobs[i] = [deadline, profit]`: job `i` pays `profit` only if it runs in some hour `h` with
  `h <= deadline`. A job that cannot be finished by its deadline is simply declined and pays nothing.

  Choose which jobs to accept and assign each accepted job its own hour so that every accepted job meets
  its deadline. Return the **maximum total profit** you can earn. Return `0` if there are no jobs.

  The answer can exceed the 32-bit integer range; return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  jobs = [[3, 40], [1, 35], [1, 30], [3, 25], [2, 10], [3, 5]]
  Output: 100
  Explanation: Run the 35 job in hour 1 and the 40 and 25 jobs in hours 2 and 3: 35 + 40 + 25 = 100.
               The 30 job also needs hour 1, and the 10 and 5 jobs are worth less than the others.
  ```

  ### Example 2
  ```
  Input:  jobs = [[1, 8], [1, 12], [1, 3]]
  Output: 12
  Explanation: Only one job can run in hour 1, so take the one paying 12.
  ```

  ### Example 3
  ```
  Input:  jobs = [[5, 7], [5, 9]]
  Output: 16
  ```

  ### Constraints
  - `0 <= jobs.length <= 10^5`
  - `jobs[i].length == 2`
  - `1 <= deadline <= 10^9`
  - `0 <= profit <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: render_slots_max_profit
  params:
    - {name: jobs, type: "int[][]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def render_slots_max_profit(jobs: list[list[int]]) -> int:
        # Process jobs by deadline; keep the most profitable set that still fits.
        kept: list[int] = []  # min-heap of accepted profits
        for deadline, profit in sorted(jobs, key=lambda job: job[0]):
            heapq.heappush(kept, profit)
            if len(kept) > deadline:
                heapq.heappop(kept)  # drop the least profitable job
        return sum(kept)
  javascript: |
    function renderSlotsMaxProfit(jobs) {
      const heap = [];
      const push = (v) => {
        heap.push(v);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p] <= heap[i]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const popMin = () => {
        const last = heap.pop();
        if (heap.length === 0) return;
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1;
          let m = i;
          if (l < heap.length && heap[l] < heap[m]) m = l;
          if (r < heap.length && heap[r] < heap[m]) m = r;
          if (m === i) break;
          [heap[m], heap[i]] = [heap[i], heap[m]];
          i = m;
        }
      };
      const sorted = jobs.slice().sort((a, b) => a[0] - b[0]);
      for (const [deadline, profit] of sorted) {
        push(profit);
        if (heap.length > deadline) popMin();
      }
      return heap.reduce((acc, v) => acc + v, 0);
    }
