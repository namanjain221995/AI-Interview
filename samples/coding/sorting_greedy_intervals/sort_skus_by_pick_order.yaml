expected_concepts:
  - "count occurrences with a hash map"
  - "walk the route to emit lines in route order"
  - "sort only the leftover overflow SKUs"
  - "avoid re-scanning the order lines for every route bin"
optimal_complexity: {time: "O(n + m + k log k)", space: "O(n + m)"}
rubric:
  excellent: "Counts SKUs once in a hash map, walks the route to emit and remove matching entries, sorts only the leftovers numerically, and states the complexity in terms of order lines, route length and overflow SKUs."
  good: "Produces correct lines with a counting map but sorts more than necessary or needs a prompt about numeric ordering of the overflow section."
  weak: "Scans all order lines for every route bin, emits lines for unordered route SKUs, or outputs overflow SKUs in input order."
  criteria:
    correctness: "All tests pass, including empty inputs, unordered route SKUs and overflow ordering."
    efficiency: "Linear counting and route walk plus a sort of the leftover SKUs only."
    code_quality: "Counting, route pass and overflow pass are clearly separated; inputs are not mutated."
    edge_cases: "Empty order lines, empty route, all SKUs on the route, none on the route."
    communication: "Explains how the route pass and the overflow pass together cover every distinct SKU exactly once."
hints:
  - "Each printed line needs a quantity, so start by thinking about how to know how many units of each SKU were ordered."
  - "Once you have a count per SKU, the route already tells you the order for most lines; you only need extra work for SKUs the route never visits."
  - "Build a map from SKU to count, walk the route and emit a line for each SKU present in the map while removing it, then sort the SKUs still left in the map in ascending numeric order and emit their lines."
followups:
  - "How would you split the pick list across two pickers so each walks a contiguous part of the route?"
  - "What changes if the route is circular and the picker can start at any bin?"
  - "If the SKU ids were bounded and small, could you avoid the final sort?"
  - "How would you print the full unit list instead of lines with quantities?"
common_errors:
  - "Emitting lines with quantity zero for route SKUs nobody ordered."
  - "Sorting the overflow SKUs as strings instead of numbers."
  - "Scanning the whole order list once per route bin, which is quadratic."
  - "Forgetting SKUs that are not on the route entirely."
