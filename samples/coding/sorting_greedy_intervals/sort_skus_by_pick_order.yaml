version: 1
slug: sort_skus_by_pick_order
title: Build a Warehouse Pick List
difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [backend, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Build a Warehouse Pick List

  A warehouse picker receives a batch of order lines, given as `skus`: one entry per unit to pick, so
  the same SKU id can appear many times. The warehouse walk route visits bins in a fixed sequence,
  given as `pick_order`, a list of **distinct** SKU ids in the order the picker passes them.

  Build the printed pick list: return one line `[sku, quantity]` per distinct SKU in `skus`, where
  `quantity` is how many times that SKU appears. Order the lines as follows:

  1. SKUs that appear in `pick_order` come first, in the order of `pick_order`.
  2. SKUs that are **not** on the route (stored in overflow) come last, in ascending SKU id order.

  SKUs on the route that nobody ordered do not produce a line. Return an empty list when `skus` is
  empty.

  ### Example 1
  ```
  Input:  skus = [3, 9, 7, 3, 5, 7, 3], pick_order = [7, 3, 9, 4]
  Output: [[7, 2], [3, 3], [9, 1], [5, 1]]
  Explanation: The route passes 7, then 3, then 9. SKU 5 is not on the route, so it goes last.
  ```

  ### Example 2
  ```
  Input:  skus = [42, 8, 42, 15], pick_order = [1, 2]
  Output: [[8, 1], [15, 1], [42, 2]]
  Explanation: Nothing is on the route, so every line goes to the overflow section in ascending id order.
  ```

  ### Constraints
  - `0 <= skus.length <= 10^5`
  - `0 <= pick_order.length <= 10^4`, all values in `pick_order` are distinct
  - `1 <= skus[i], pick_order[j] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sort_skus_by_pick_order
  params:
    - {name: skus, type: "int[]"}
    - {name: pick_order, type: "int[]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def sort_skus_by_pick_order(skus: list[int], pick_order: list[int]) -> list[list[int]]:
        counts = Counter(skus)
        lines: list[list[int]] = []
        for sku in pick_order:
            if sku in counts:
                lines.append([sku, counts.pop(sku)])
        for sku in sorted(counts):
            lines.append([sku, counts[sku]])
        return lines
  javascript: |
    function sortSkusByPickOrder(skus, pickOrder) {
      const counts = new Map();
      for (const sku of skus) counts.set(sku, (counts.get(sku) || 0) + 1);
      const lines = [];
      for (const sku of pickOrder) {
        if (counts.has(sku)) {
          lines.push([sku, counts.get(sku)]);
          counts.delete(sku);
        }
      }
      const rest = [...counts.keys()].sort((a, b) => a - b);
      for (const sku of rest) lines.push([sku, counts.get(sku)]);
      return lines;
    }
