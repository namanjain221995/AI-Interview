title: Minimum Charging Stops
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Minimum Charging Stops

  A logistics company is planning a delivery route for an electric van and wants to minimise the time
  lost to charging. The route is a straight road of `target` kilometres. The van starts with enough
  charge for `initial_range` kilometres and uses exactly one unit of charge per kilometre.

  Charging stations along the road are given as `stations[i] = [position_km, range_added_km]`, sorted
  by strictly increasing position. Stopping at a station adds `range_added_km` kilometres of range (the
  battery has no upper limit), and each station can be used at most once. The van can use a station
  only if it reaches it, which includes arriving with exactly zero range left; the same applies to the
  destination.

  Return the **minimum number of charging stops** needed to reach the destination, or `-1` if it cannot
  be reached.

  ### Example 1
  ```
  Input:  target = 100, initial_range = 25, stations = [[10, 60], [20, 30], [30, 30], [60, 40]]
  Output: 2
  Explanation: charge at km 10 (range reaches km 85), then at km 60 (range reaches km 125).
  ```

  ### Example 2
  ```
  Input:  target = 100, initial_range = 10, stations = [[20, 50]]
  Output: -1
  Explanation: the van runs out of charge at km 10 before reaching the only station.
  ```

  ### Example 3
  ```
  Input:  target = 50, initial_range = 50, stations = [[25, 25]]
  Output: 0
  Explanation: the van arrives with exactly zero range left, which is enough.
  ```

  ### Constraints
  - `1 <= target <= 10^9`
  - `1 <= initial_range <= 10^9`
  - `0 <= stations.length <= 500`
  - `0 < position_km < target`, positions strictly increasing
  - `1 <= range_added_km <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_charging_stops
  params:
    - {name: target, type: int}
    - {name: initial_range, type: int}
    - {name: stations, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def min_charging_stops(target: int, initial_range: int, stations: list[list[int]]) -> int:
        passed: list[int] = []  # max-heap (negated) of charges at stations already within reach
        reach = initial_range
        stops = 0
        i = 0
        while reach < target:
            while i < len(stations) and stations[i][0] <= reach:
                heapq.heappush(passed, -stations[i][1])
                i += 1
            if not passed:
                return -1
            reach += -heapq.heappop(passed)
            stops += 1
        return stops
  javascript: |
    function minChargingStops(target, initialRange, stations) {
      const heap = [];
      const push = (value) => {
        heap.push(value);
        let i = heap.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (heap[parent] >= heap[i]) break;
          [heap[parent], heap[i]] = [heap[i], heap[parent]];
          i = parent;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const left = 2 * i + 1;
            const right = left + 1;
            let largest = i;
            if (left < heap.length && heap[left] > heap[largest]) largest = left;
            if (right < heap.length && heap[right] > heap[largest]) largest = right;
            if (largest === i) break;
            [heap[largest], heap[i]] = [heap[i], heap[largest]];
            i = largest;
          }
        }
        return top;
      };
      let reach = initialRange;
      let stops = 0;
      let i = 0;
      while (reach < target) {
        while (i < stations.length && stations[i][0] <= reach) {
          push(stations[i][1]);
          i++;
        }
        if (heap.length === 0) return -1;
        reach += pop();
        stops++;
      }
      return stops;
    }
