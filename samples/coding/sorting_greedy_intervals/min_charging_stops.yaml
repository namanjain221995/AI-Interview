expected_concepts:
  - "greedy choice deferred until it is needed"
  - "max-heap of charges from stations already within reach"
  - "exchange argument: the largest passed charge is never a worse stop"
  - "alternative O(n^2) dynamic programme on the farthest reach with k stops"
  - "detecting an unreachable destination"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Uses the deferred greedy with a max-heap of charges from passed stations, explains the exchange argument for why the largest passed charge is the right stop, and handles the exact-zero and unreachable cases."
  good: "Finds the O(n^2) dynamic programme over the farthest reach with k stops, or the heap greedy with some prompting about correctness."
  weak: "Stops at the nearest or farthest reachable station by a fixed rule without justification, explores all subsets, or treats arriving with zero range as failure."
  criteria:
    correctness: "All tests pass, including unreachable stations, exact-zero arrivals and the nearest-station trap."
    efficiency: "Each station enters and leaves the heap at most once, giving O(n log n)."
    code_quality: "A single loop with a clear reach variable and a heap of available charges."
    edge_cases: "No stations, no stops needed, stations reached with zero range and destinations that cannot be reached."
    communication: "Explains why choosing the stop retroactively is valid even though the van has already driven past the station."
hints:
  - "You do not have to decide at a station whether to charge there; think about deciding only when the van would otherwise run out."
  - "When the van cannot go further, any station it has already passed could have been used; which one of those gives the most benefit for a single stop?"
  - "Track the farthest reachable kilometre; push the charge of every station within that reach into a max-heap, and while the target is still beyond reach pop the largest charge, add it to the reach and count a stop, returning -1 when the heap is empty first."
followups:
  - "How would you return the positions of the stations to stop at?"
  - "What changes if the battery has a maximum capacity?"
  - "How would you solve it with dynamic programming, and how do the complexities compare?"
  - "If charging time depends on the amount added, how would you minimise total charging time instead?"
common_errors:
  - "Charging at the nearest reachable station each time, which can use more stops than necessary."
  - "Requiring strictly positive range to reach a station or the destination."
  - "Re-adding stations to the heap or using a station twice."
  - "Forgetting to return -1 when no passed station is left and the target is still out of reach."
