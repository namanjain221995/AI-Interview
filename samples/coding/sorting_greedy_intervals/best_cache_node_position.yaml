expected_concepts:
  - "the median minimises the sum of absolute deviations"
  - "sorting or selection to find the median"
  - "any slot between the two middle values is optimal for even counts"
  - "64-bit accumulation of the total"
optimal_complexity: {time: "O(n log n) (O(n) expected with quickselect)", space: "O(n)"}
rubric:
  excellent: "Identifies the median, justifies it by counting clients on each side, uses 64-bit totals and mentions linear-time selection."
  good: "Uses the median correctly after sorting, with a partial justification."
  weak: "Uses the mean, tries every slot in the range, or overflows on large totals."
  criteria:
    correctness: "All tests pass, including the extreme-value and outlier cases."
    efficiency: "One sort or a selection pass plus a linear sum; no scan over every possible slot."
    code_quality: "Clear median selection and a single accumulation loop with a 64-bit total."
    edge_cases: "Single client, all clients in one slot, even counts, negative positions and totals beyond 32-bit range."
    communication: "Explains why moving the node toward the side with more clients always lowers the total."
hints:
  - "Think about what happens to the total when the node moves one slot to the right: some clients get closer and some get farther."
  - "The total keeps dropping while more clients are on one side of the node than the other, so the best slot balances the two sides."
  - "Sort the positions, place the node at the middle element (either middle element works for an even count) and add up the absolute distances using a 64-bit total."
followups:
  - "What if each client had a weight, such as its request rate?"
  - "How would the answer change with two cache nodes, each client using the closer one?"
  - "What if clients were spread on a 2D floor grid with Manhattan cabling?"
common_errors:
  - "Placing the node at the average position, which is pulled by outliers."
  - "Accumulating the total in a 32-bit integer."
  - "Trying every slot between the minimum and maximum position."
