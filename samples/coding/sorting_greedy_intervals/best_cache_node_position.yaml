version: 1
slug: best_cache_node_position
title: "Best Cache Node Position"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [platform, network, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Best Cache Node Position

  Servers that read from a shared cache sit along a single rack row. `positions[i]` is the slot of
  client `i`, measured from a reference point (it may be negative), and several clients can share a
  slot. A cache node can be installed at any integer slot `p`; client `i` then pays a cabling cost of
  `|positions[i] - p|`.

  Return the **minimum possible total cabling cost** over all choices of `p`. The answer can exceed
  the 32-bit integer range.

  ### Example 1
  ```
  Input:  positions = [1, 4, 9]
  Output: 8
  Explanation: Placing the node at 4 costs 3 + 0 + 5 = 8.
  ```

  ### Example 2
  ```
  Input:  positions = [2, 7, 7, 3]
  Output: 9
  Explanation: Any slot from 3 to 7 costs 9, for example 1 + 0 + 4 + 4 at slot 3.
  ```

  ### Example 3
  ```
  Input:  positions = [-6, 10]
  Output: 16
  ```

  ### Constraints
  - `1 <= positions.length <= 10^5`
  - `-10^9 <= positions[i] <= 10^9`

  **Follow-up:** can you find the best slot without fully sorting the positions?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_cache_node_position
  params:
    - {name: positions, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def best_cache_node_position(positions: list[int]) -> int:
        ordered = sorted(positions)
        median = ordered[len(ordered) // 2]
        return sum(abs(p - median) for p in ordered)
  javascript: |
    function bestCacheNodePosition(positions) {
      const ordered = [...positions].sort((a, b) => a - b);
      const median = ordered[Math.floor(ordered.length / 2)];
      let total = 0;
      for (const p of ordered) total += Math.abs(p - median);
      return total;
    }
