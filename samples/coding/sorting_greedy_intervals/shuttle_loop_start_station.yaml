title: Electric Shuttle Loop Start
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Electric Shuttle Loop Start

  A campus runs an electric shuttle on a **circular** route with `n` stops numbered `0` to `n - 1`.
  Every stop has a charger:

  - At stop `i` the shuttle picks up `charge[i]` units of energy.
  - Driving from stop `i` to the next stop `(i + 1) % n` uses `cost[i]` units.

  The shuttle starts at a stop of your choice with an **empty** battery (the battery has no upper
  limit), charges there, then drives the stops in increasing order, wrapping from `n - 1` back to `0`,
  until it returns to the stop it started from. The battery must never go **below zero** on any leg;
  arriving at a stop with exactly `0` units is fine because the shuttle charges there before leaving.

  Return the **smallest** stop index from which the shuttle can complete one full loop, or `-1` if no
  stop works.

  ### Example 1
  ```
  Input:  charge = [2, 5, 1, 4], cost = [3, 2, 4, 2]
  Output: 1
  Explanation: from stop 1 the battery reads 3 at stop 2, 0 at stop 3, 2 at stop 0 and 1 back at stop 1.
  Starting at stop 0 fails on the first leg (2 - 3 < 0).
  ```

  ### Example 2
  ```
  Input:  charge = [3, 1, 2], cost = [2, 3, 2]
  Output: -1
  Explanation: the loop needs 7 units in total but only 6 are available.
  ```

  ### Example 3
  ```
  Input:  charge = [4, 4], cost = [4, 4]
  Output: 0
  Explanation: both stops work; return the smallest index.
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `charge.length == cost.length == n`
  - `0 <= charge[i], cost[i] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shuttle_loop_start_station
  params:
    - {name: charge, type: "int[]"}
    - {name: cost, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def shuttle_loop_start_station(charge: list[int], cost: list[int]) -> int:
        total = 0
        battery = 0
        start = 0
        for i in range(len(charge)):
            net = charge[i] - cost[i]
            total += net
            battery += net
            if battery < 0:
                # No stop from start..i can work; try the stop after i.
                start = i + 1
                battery = 0
        return start if total >= 0 else -1
  javascript: |
    function shuttleLoopStartStation(charge, cost) {
      let total = 0;
      let battery = 0;
      let start = 0;
      for (let i = 0; i < charge.length; i++) {
        const net = charge[i] - cost[i];
        total += net;
        battery += net;
        if (battery < 0) {
          start = i + 1;
          battery = 0;
        }
      }
      return total >= 0 ? start : -1;
    }
