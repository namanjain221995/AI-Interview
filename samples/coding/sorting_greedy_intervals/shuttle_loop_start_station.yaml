expected_concepts:
  - net energy per leg as charge minus cost
  - total net energy decides whether any start exists
  - a failed run from start to i rules out every stop in between
  - single pass greedy restart after the battery goes negative
  - the greedy candidate is the smallest valid start
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Starts from the O(n^2) simulation, derives the one-pass restart rule, proves that stops skipped after a failure cannot work and that a non-negative total guarantees the candidate succeeds, explains why the candidate is the smallest valid index, and states O(n) time and O(1) space.
  good: Implements the one-pass greedy correctly with some prompting and gives the right complexity, with a partial justification.
  weak: Only simulates from every stop, mishandles the wrap-around, or returns a valid stop that is not the smallest.
  criteria:
    correctness: All tests pass, including several valid starts, a single stop and an exactly balanced total.
    efficiency: Linear time with constant extra space; no nested simulation.
    code_quality: Clear names for the running battery, the overall total and the candidate start.
    edge_cases: One stop, zero charge or zero cost stops, arriving with exactly zero energy, total energy one unit short.
    communication: Explains why a failure at stop i lets the search jump straight to stop i plus one.
hints:
  - Look at each leg as a single number, the energy gained at the stop minus the energy spent driving onward. When is it impossible for any start to work?
  - Suppose a run starting at stop s first goes negative on the leg leaving stop i. Can any stop between s and i be a valid start? Use that to avoid restarting the simulation from scratch.
  - Scan once while keeping a running battery and an overall total; whenever the running battery drops below zero, make the next stop the new candidate and reset the battery to zero. If the overall total is non-negative the final candidate completes the loop, and it is the smallest valid start, otherwise return minus one.
followups:
  - Prove that when the total net energy is non-negative the candidate found by the scan really completes the loop.
  - Why is the candidate the smallest valid start and not just any valid start?
  - How would the problem change if the battery had a maximum capacity?
  - How would you return every valid start in linear time?
common_errors:
  - Restarting the simulation from every stop, giving O(n^2) time.
  - Forgetting the total check and returning a candidate even when the loop is impossible.
  - Resetting the candidate to the stop where the battery failed instead of the stop after it.
  - Treating arriving with exactly zero energy as a failure.
