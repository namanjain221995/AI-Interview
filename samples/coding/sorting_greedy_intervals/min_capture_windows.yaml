version: 1
slug: min_capture_windows
title: "Minimum Packet-Capture Windows"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, security, devops]
time_limit_minutes: 15
prompt_markdown: |
  ## Minimum Packet-Capture Windows

  A security team is replaying traffic around suspicious events. `timestamps` lists the second at
  which each event happened; the list is unsorted and may contain repeats. A packet-capture window can
  start at any integer second `t` and then covers every second in `[t, t + width]` (both ends
  inclusive).

  Return the **minimum number of capture windows** so that every event timestamp lies inside at least
  one window. Return `0` when there are no events.

  ### Example 1
  ```
  Input:  timestamps = [12, 3, 5, 20, 9], width = 4
  Output: 3
  Explanation: Windows starting at 3, 9 and 20 cover [3, 7], [9, 13] and [20, 24].
  ```

  ### Example 2
  ```
  Input:  timestamps = [100, 40, 70], width = 60
  Output: 1
  Explanation: One window [40, 100] covers all three events; the end is inclusive.
  ```

  ### Example 3
  ```
  Input:  timestamps = [5, 5, 6], width = 0
  Output: 2
  Explanation: With width 0 a window covers a single second.
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `0 <= timestamps[i] <= 10^9`
  - `0 <= width <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_capture_windows
  params:
    - {name: timestamps, type: "int[]"}
    - {name: width, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_capture_windows(timestamps: list[int], width: int) -> int:
        windows = 0
        covered_until = None
        for t in sorted(timestamps):
            if covered_until is None or t > covered_until:
                windows += 1
                covered_until = t + width
        return windows
  javascript: |
    function minCaptureWindows(timestamps, width) {
      const ordered = [...timestamps].sort((a, b) => a - b);
      let windows = 0;
      let coveredUntil = -Infinity;
      for (const t of ordered) {
        if (t > coveredUntil) {
          windows += 1;
          coveredUntil = t + width;
        }
      }
      return windows;
    }
