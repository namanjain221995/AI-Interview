expected_concepts:
  - "sort the timestamps"
  - "greedy: start a window at the earliest uncovered event"
  - "exchange argument: pushing a window right never loses coverage"
  - "inclusive window end"
optimal_complexity: {time: "O(n log n)", space: "O(1) extra beyond the sort"}
rubric:
  excellent: "Sorts, starts each window at the first uncovered event, proves the greedy with an exchange argument and handles inclusive ends, duplicates and empty input."
  good: "Correct sort plus greedy sweep with a brief justification; small slips fixed when prompted."
  weak: "Centres windows on events, treats the end as exclusive, forgets to sort, or tries every possible start time."
  criteria:
    correctness: "All tests pass, including events exactly at the window end and the empty input."
    efficiency: "One sort and a linear sweep."
    code_quality: "A single variable for how far coverage extends and a clean loop."
    edge_cases: "No events, width 0, duplicates, very large values and fully covering widths."
    communication: "Explains why starting a window exactly at the earliest uncovered event is always safe."
hints:
  - "Consider the earliest event: some window must cover it, and nothing before it needs covering."
  - "After sorting, a window that starts exactly at the first uncovered event covers as many later events as any window that covers it."
  - "Sort the timestamps and sweep once, remembering the last second the current window covers; whenever an event lies beyond that second, open a new window starting at that event and extend coverage by the width."
followups:
  - "Return the start times of the chosen windows as well."
  - "What if each window had a different allowed width chosen from a list?"
  - "How would you process timestamps arriving as an unbounded sorted stream?"
common_errors:
  - "Treating the window end as exclusive, which opens an extra window for events at t + width."
  - "Starting windows at the previous window end instead of at the next uncovered event."
  - "Forgetting to sort the timestamps first."
