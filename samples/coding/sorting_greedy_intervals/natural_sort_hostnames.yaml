  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    import re

    _CHUNK = re.compile(r"\d+|\D+")


    def _key(name: str):
        parts = []
        for chunk in _CHUNK.findall(name):
            if chunk[0].isdigit():
                digits = chunk.lstrip("0")
                # Numeric value via (length, digits) avoids big-integer parsing;
                # ties on value are broken by the original length (fewer leading zeros first).
                parts.append((0, len(digits), digits, len(chunk)))
            else:
                parts.append((1, chunk))
        return parts


    def natural_sort_hostnames(hostnames: list[str]) -> list[str]:
        return sorted(hostnames, key=_key)
  javascript: |
    function naturalSortHostnames(hostnames) {
      const chunks = (name) => name.match(/\d+|\D+/g) || [];
      const isNum = (c) => c[0] >= "0" && c[0] <= "9";
      const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
      const cmpChunk = (a, b) => {
        const na = isNum(a);
        const nb = isNum(b);
        if (na !== nb) return na ? -1 : 1;
        if (!na) return cmpStr(a, b);
        const da = a.replace(/^0+/, "");
        const db = b.replace(/^0+/, "");
        if (da.length !== db.length) return da.length - db.length;
        const byValue = cmpStr(da, db);
        if (byValue !== 0) return byValue;
        return a.length - b.length;
      };
      const keyed = hostnames.map((h) => [h, chunks(h)]);
      keyed.sort((x, y) => {
        const a = x[1];
        const b = y[1];
        for (let i = 0; i < Math.min(a.length, b.length); i++) {
          const c = cmpChunk(a[i], b[i]);
          if (c !== 0) return c;
        }
        return a.length - b.length;
      });
      return keyed.map((k) => k[0]);
    }
