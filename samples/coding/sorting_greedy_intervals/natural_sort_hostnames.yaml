time_limit_minutes: 25
prompt_markdown: |
  ## Natural Sort of Hostnames

  An inventory dashboard lists hosts such as `web2`, `web10` and `db-3.eu`. Plain string sorting puts
  `web10` before `web2`, which operators find confusing, so the dashboard needs a **natural sort**.

  Split each hostname into maximal **chunks** that are either all digits (a *number chunk*) or contain no
  digits at all (a *text chunk*). For example `db-12.eu3` splits into `"db-"`, `"12"`, `".eu"`, `"3"`.
  Compare two hostnames chunk by chunk from the left; the first position where the chunks differ decides:

  1. Two number chunks compare by **numeric value**. If the values are equal, the chunk with **fewer
     leading zeros** (the shorter one) comes first, so `7` < `07` < `007`.
  2. Two text chunks compare as ordinary strings by character code (so `-` < `.` < letters, and a string
     that is a prefix of the other comes first).
  3. A number chunk comes before a text chunk.
  4. If one hostname runs out of chunks while all chunks so far are equal, it comes first.

  Return the hostnames sorted in ascending natural order. Duplicates are kept. Number chunks can be up to
  30 digits long, so they may not fit in a 64-bit integer.

  ### Example 1
  ```
  Input:  hostnames = ["web10", "web2", "db1", "web1", "web02"]
  Output: ["db1", "web1", "web2", "web02", "web10"]
  Explanation: web2 and web02 have the same numeric value; web2 has fewer leading zeros, so it comes first.
  ```

  ### Example 2
  ```
  Input:  hostnames = ["api-3.eu", "api-3", "api-12.eu", "api-3.eu1"]
  Output: ["api-3", "api-3.eu", "api-3.eu1", "api-12.eu"]
  Explanation: api-3 is a prefix of api-3.eu by chunks, which in turn is a prefix of api-3.eu1; api-12.eu is last because 12 > 3.
  ```

  ### Example 3
  ```
  Input:  hostnames = ["node-a", "node-7", "7node"]
  Output: ["7node", "node-7", "node-a"]
  Explanation: 7node starts with a number chunk, so it precedes names that start with text. node- is a prefix of node-a as a string, so node-7 comes before node-a.
  ```

  ### Constraints
  - `1 <= hostnames.length <= 10^4`
  - `1 <= hostnames[i].length <= 60`
  - `hostnames[i]` contains only lowercase letters `a-z`, digits `0-9`, `-` and `.`
  - A number chunk has at most 30 digits
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: natural_sort_hostnames
  params:
