expected_concepts:
  - "tokenise into maximal digit and non-digit runs"
  - "custom comparator or composite sort key"
  - "compare numeric strings by length after stripping leading zeros, then lexicographically"
  - "tie-break equal values by leading-zero count"
  - "chunk-wise lexicographic comparison with prefix rule"
optimal_complexity: {time: "O(n log n * L) where L is the maximum hostname length", space: "O(n * L)"}
rubric:
  excellent: "Tokenises each hostname once, builds a comparator or composite key that follows all four rules, compares number chunks by stripped length then digits so arbitrarily long numbers work, breaks value ties by leading zeros and explains the total order and its O(n log n * L) cost."
  good: "Correct comparator for typical names but needs a hint for very long numbers or the leading-zero tie-break, or re-tokenises on every comparison."
  weak: "Parses number chunks into fixed-width integers that overflow, compares digit runs as plain strings, or ignores the ordering between number and text chunks."
  criteria:
    correctness: "All tests pass, including leading zeros, chunk prefixes, separators and 20+ digit numbers."
    efficiency: "Each hostname is split once and the comparison work is linear in the name length."
    code_quality: "Tokenising and comparing are separated into small, readable pieces; the four rules are visible in the code."
    edge_cases: "Duplicates, a name that is a prefix of another, all-zero numbers and names starting with digits."
    communication: "Explains why comparing digit strings by length first gives numeric order without parsing."
hints:
  - "Plain string order fails only inside runs of digits. Try splitting each name into pieces where the digit runs are kept separate from the rest."
  - "Compare the two lists of pieces position by position, like comparing words letter by letter. For two digit runs you can compare numerically without converting to a number: once leading zeros are removed, a longer run is a bigger number."
  - "Turn each hostname into a list of chunks once. To compare two chunks: if exactly one is a digit run, it comes first; if both are text, use normal string order; if both are digit runs, strip leading zeros, compare by length, then by the digit strings, and if still equal the original shorter chunk comes first. The first differing chunk decides, and if one list ends first that name comes first."
followups:
  - "How would you make the comparison case-insensitive for mixed-case hostnames?"
  - "How would you handle version-like names such as 1.10.2 versus 1.9.12 with the same approach?"
  - "Why is it better to precompute the chunks for each name rather than splitting inside the comparator?"
  - "Is your comparator a valid total order, and why does that matter for the sort routine?"
common_errors:
  - "Parsing digit runs into 32-bit or 64-bit integers, which overflows on long numbers."
  - "Comparing digit runs as strings, which puts 10 before 9."
  - "Forgetting the leading-zero tie-break, which makes the order of 7 and 07 depend on the sort's stability."
  - "Treating a name that is a chunk prefix of another as larger, or comparing beyond the end of the shorter chunk list."
