expected_concepts:
  - "greedy matching of smallest job to smallest sufficient runner"
  - "sorting both lists"
  - "two pointers over sorted arrays"
  - "exchange argument for greedy correctness"
optimal_complexity: {time: "O(n log n + m log m)", space: "O(n + m)"}
rubric:
  excellent: "Sorts both lists, uses two pointers to give each smallest remaining job the smallest runner that fits, and justifies the greedy choice with an exchange argument."
  good: "Reaches the sort-and-match greedy with correct results but a hand-wavy correctness argument or a prompt on equality."
  weak: "Matches jobs in input order, gives each job the largest runner, or tries an exponential or quadratic search without improving it."
  criteria:
    correctness: "All tests pass, including the greedy trap and exact-fit equality."
    efficiency: "Sorting plus a linear two-pointer pass; no nested scanning of runners per job."
    code_quality: "Clear pointer names, sorted copies instead of mutating inputs, no special cases beyond what is needed."
    edge_cases: "Empty lists on either side, nothing fits, more runners than jobs and vice versa."
    communication: "Explains why using a larger runner than necessary can never help."
hints:
  - "Which job is the easiest to place, and which runner is the least valuable to spend on it?"
  - "If the jobs and runners were both sorted by size, you could decide each match by looking at only the smallest remaining items on each side."
  - "Sort both lists and move through runners from smallest to largest; whenever the current runner fits the smallest unplaced job, place it and move to the next job, otherwise skip the runner because it cannot fit anything larger."
followups:
  - "Prove that matching the smallest job to the smallest runner that fits never reduces the total."
  - "What if each job also needed a minimum CPU count; does the greedy still work?"
  - "How would you maximise the total memory of placed jobs instead of their count?"
  - "How would you handle jobs and runners arriving continuously instead of in one batch?"
common_errors:
  - "Assigning the largest runner first and wasting capacity on small jobs."
  - "Using strict greater-than and refusing an exact memory match."
  - "Processing jobs in input order without sorting, which can strand jobs that would fit."
  - "Advancing the job pointer when a runner is too small instead of advancing the runner."
