version: 1
slug: match_jobs_to_runners
title: Match Jobs to CI Runners
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [devops, platform, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Match Jobs to CI Runners

  A CI scheduler has a queue of pending jobs and a pool of idle runners. `job_memory[i]` is the
  memory (in MiB) job `i` needs and `runner_memory[j]` is the memory runner `j` offers. A runner can
  take **at most one** job, a job runs on at most one runner, and a job may only be placed on a
  runner whose memory is **greater than or equal to** what the job needs.

  Return the **maximum number of jobs** that can be placed right now. Return `0` if either list is
  empty or nothing fits.

  ### Example 1
  ```
  Input:  job_memory = [4, 8, 2], runner_memory = [3, 8, 1]
  Output: 2
  Explanation: The 2 MiB job takes the 3 MiB runner and the 4 MiB job takes the 8 MiB runner. The 8 MiB job is left without a large enough runner.
  ```

  ### Example 2
  ```
  Input:  job_memory = [16, 16, 16], runner_memory = [32, 8]
  Output: 1
  Explanation: Only the 32 MiB runner is large enough for any job.
  ```

  ### Constraints
  - `0 <= job_memory.length, runner_memory.length <= 10^4`
  - `1 <= job_memory[i], runner_memory[j] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: match_jobs_to_runners
  params:
    - {name: job_memory, type: "int[]"}
    - {name: runner_memory, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def match_jobs_to_runners(job_memory: list[int], runner_memory: list[int]) -> int:
        jobs = sorted(job_memory)
        runners = sorted(runner_memory)
        placed = 0
        for capacity in runners:
            if placed < len(jobs) and jobs[placed] <= capacity:
                placed += 1
        return placed
  javascript: |
    function matchJobsToRunners(jobMemory, runnerMemory) {
      const jobs = [...jobMemory].sort((a, b) => a - b);
      const runners = [...runnerMemory].sort((a, b) => a - b);
      let placed = 0;
      for (const capacity of runners) {
        if (placed < jobs.length && jobs[placed] <= capacity) placed++;
      }
      return placed;
    }
