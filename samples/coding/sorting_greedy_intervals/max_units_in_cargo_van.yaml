version: 1
slug: max_units_in_cargo_van
title: Maximize Units in a Cargo Van
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Maximize Units in a Cargo Van

  A fulfilment centre is loading its last delivery van of the day. The van has room for at most
  `capacity` pallets. The warehouse offers several pallet types: `pallet_types[i] = [available, units]`
  means there are `available` pallets of type `i` ready to load and each of them holds `units` sellable
  items.

  You may load any mix of pallets (whole pallets only, at most `available` of each type) as long as the
  total number of pallets does not exceed `capacity`. Return the **maximum total number of units** the
  van can carry.

  - Loading fewer pallets than `capacity` is allowed (for example when the warehouse runs out).
  - With no pallet types or a capacity of `0`, the answer is `0`.
  - The result can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  pallet_types = [[2, 5], [4, 3], [3, 8]], capacity = 6
  Output: 37
  Explanation: Load all 3 pallets of 8 units (24), both pallets of 5 units (10) and one pallet of 3 units (3).
  ```

  ### Example 2
  ```
  Input:  pallet_types = [[5, 10], [2, 20]], capacity = 10
  Output: 90
  Explanation: All 7 pallets fit: 5 * 10 + 2 * 20 = 90.
  ```

  ### Constraints
  - `0 <= pallet_types.length <= 1000`
  - `pallet_types[i].length == 2`
  - `1 <= available <= 10^6`
  - `0 <= units <= 10^6`
  - `0 <= capacity <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_units_in_cargo_van
  params:
    - {name: pallet_types, type: "int[][]"}
    - {name: capacity, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def max_units_in_cargo_van(pallet_types: list[list[int]], capacity: int) -> int:
        total = 0
        remaining = capacity
        for available, units in sorted(pallet_types, key=lambda p: p[1], reverse=True):
            if remaining == 0:
                break
            take = min(available, remaining)
            total += take * units
            remaining -= take
        return total
  javascript: |
    function maxUnitsInCargoVan(palletTypes, capacity) {
      const ordered = [...palletTypes].sort((a, b) => b[1] - a[1]);
      let total = 0;
      let remaining = capacity;
      for (const [available, units] of ordered) {
        if (remaining === 0) break;
        const take = Math.min(available, remaining);
        total += take * units;
        remaining -= take;
      }
      return total;
    }
