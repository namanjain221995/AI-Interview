expected_concepts:
  - "greedy choice: highest units per pallet first"
  - "sorting by units descending (or bucketing by units)"
  - "taking a partial batch of the last type"
  - "64-bit total to avoid overflow"
optimal_complexity: {time: "O(m log m) for m pallet types", space: "O(m) for the sorted copy (O(1) extra if sorting in place)"}
rubric:
  excellent: "Argues why taking the richest pallets first is optimal (every pallet uses one slot), sorts by units, takes min(available, remaining) per type, stops early and uses a 64-bit total."
  good: "Correct greedy with sorting and the right complexity, but needs a prompt about overflow or about stopping when capacity is used up."
  weak: "Sorts by available count or total units of a type, loops pallet by pallet over huge counts, or overflows the total."
  criteria:
    correctness: "All tests pass, including empty input, zero capacity and capacity larger than the stock."
    efficiency: "O(m log m) sorting; never iterates pallet by pallet over counts up to 10^6."
    code_quality: "Clear names for remaining capacity and the amount taken from each type."
    edge_cases: "Zero capacity, zero-unit pallets, ties in units and totals beyond 32 bits."
    communication: "Gives a short exchange argument for the greedy choice."
hints:
  - "Every pallet takes exactly one slot in the van, whatever it contains. Which pallets deserve the slots?"
  - "Consider the pallet types from the most units per pallet to the fewest."
  - "Sort the types by units per pallet in decreasing order; from each type take as many pallets as both its stock and the remaining capacity allow, add pallets times units to a 64-bit total and stop once the van is full."
followups:
  - "Why does the greedy order stay optimal here, while it fails if pallets had different sizes (weights)?"
  - "Units per pallet are at most 10^6. How could you avoid comparison sorting?"
  - "How would the answer change if each pallet type also had a loading fee?"
  - "What if the van also had a weight limit in addition to the pallet count?"
common_errors:
  - "Sorting by the total units of a type (available * units) instead of units per pallet."
  - "Adding pallets one at a time in a loop, which is far too slow for counts up to 10^6."
  - "Using a 32-bit total that overflows on large inputs."
  - "Mutating the caller's input while sorting without mentioning it."
