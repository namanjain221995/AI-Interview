version: 1
slug: halve_incident_categories
title: "Halve the Incident Backlog"
difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [sre, support_engineer, data_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Halve the Incident Backlog

  The support team's open-incident backlog has `n` entries. Entry `i` is tagged with a root-cause
  category id `categories[i]`. When engineers fix the root cause of a category, **every** open entry
  with that category id is closed at once.

  The quarterly goal is to cut the backlog at least in half: after the fixes, at most `floor(n / 2)`
  entries may remain open. Return the **minimum number of categories** that must be fixed to reach
  the goal.

  ### Example 1
  ```
  Input:  categories = [4, 1, 4, 2, 4, 1, 9]
  Output: 2
  Explanation: n = 7, so at most 3 entries may remain. Fixing category 4 closes 3 entries (4 remain); also fixing category 1 closes 2 more (2 remain).
  ```

  ### Example 2
  ```
  Input:  categories = [8, 8, 8, 8]
  Output: 1
  ```

  ### Example 3
  ```
  Input:  categories = [6, 2, 7, 3]
  Output: 2
  Explanation: Every category has one entry and at most 2 of the 4 entries may remain, so two categories must be fixed.
  ```

  ### Constraints
  - `1 <= categories.length <= 10^5`
  - `1 <= categories[i] <= 10^9`

  **Follow-up:** the counts can be bucketed by frequency; can you avoid a comparison sort entirely?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: halve_incident_categories
  params:
    - {name: categories, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def halve_incident_categories(categories: list[int]) -> int:
        n = len(categories)
        must_close = n - n // 2
        closed = 0
        fixes = 0
        for count in sorted(Counter(categories).values(), reverse=True):
            if closed >= must_close:
                break
            closed += count
            fixes += 1
        return fixes
  javascript: |
    function halveIncidentCategories(categories) {
      const n = categories.length;
      const mustClose = n - Math.floor(n / 2);
      const counts = new Map();
      for (const c of categories) counts.set(c, (counts.get(c) || 0) + 1);
      const sizes = [...counts.values()].sort((a, b) => b - a);
      let closed = 0;
      let fixes = 0;
      for (const size of sizes) {
        if (closed >= mustClose) break;
        closed += size;
        fixes += 1;
      }
      return fixes;
    }
