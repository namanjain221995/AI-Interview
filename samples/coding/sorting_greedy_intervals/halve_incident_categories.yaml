expected_concepts:
  - "count entries per category with a hash map"
  - "greedily fix the largest categories first"
  - "exchange argument for why largest-first is optimal"
  - "target of n - floor(n / 2) entries to close, including odd n"
  - "bucket by frequency for linear time"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Counts categories, justifies largest-first with an exchange argument, gets the odd-n target right and mentions the linear frequency-bucket variant."
  good: "Counts and sorts frequencies correctly and passes the tests, with a brief or prompted justification of the greedy choice."
  weak: "Removes categories in input or id order, miscomputes the half target for odd n, or tries subsets exhaustively."
  criteria:
    correctness: "All tests pass, including n = 1, odd lengths and the exact-half boundary."
    efficiency: "O(n log n) sort of the frequencies or O(n) with buckets; no repeated rescans of the input."
    code_quality: "A clear counting step, a named target of entries to close and a simple loop that stops as soon as the goal is met."
    edge_cases: "Single entry, all ids distinct, all ids equal, ties in frequency and very large id values."
    communication: "Explains why fixing a larger category can never be worse than fixing a smaller one."
hints:
  - "Only the number of entries in each category matters, not the ids themselves."
  - "To use as few fixes as possible, each fix should close as many entries as it can."
  - "Count entries per category, order those counts from largest to smallest and keep adding them until the closed total reaches n minus floor of n over two."
followups:
  - "How would you solve it in linear time when n is very large?"
  - "What changes if each category fix also has an engineering cost and you want the cheapest plan?"
  - "How would you report which categories to fix, breaking ties by smallest id?"
common_errors:
  - "Computing the target as n / 2 entries to close, which is one short when n is odd."
  - "Fixing categories in the order they first appear instead of by size."
  - "Counting distinct categories instead of entries when checking the goal."
