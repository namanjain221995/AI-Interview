time_limit_minutes: 35
prompt_markdown: |
  ## Maximum Cluster Throughput

  A platform team is assembling a batch-processing cluster from a pool of `n` candidate machines.
  Machine `i` processes `throughput[i]` jobs per minute and has a reliability rating `reliability[i]`.
  Because the scheduler synchronises the whole cluster, it runs at the pace allowed by its **least
  reliable** member, so the cluster is scored as

  ```
  score = (sum of throughput of the chosen machines) * (minimum reliability among the chosen machines)
  ```

  Choose **at least one and at most `k`** machines (each machine at most once) to maximise the score,
  and return the maximum score. The answer can exceed `2^31 - 1`, so return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  throughput = [5, 2, 8, 6, 1], reliability = [7, 9, 3, 6, 10], k = 2
  Output: 66
  Explanation: choose machines 0 and 3: (5 + 6) * min(7, 6) = 66.
  The two fastest machines (8 and 6) would only give 14 * 3 = 42.
  ```

  ### Example 2
  ```
  Input:  throughput = [4, 10, 3], reliability = [9, 2, 8], k = 3
  Output: 56
  Explanation: machines 0 and 2 give (4 + 3) * 8 = 56; adding machine 1 drags the minimum reliability down to 2 (17 * 2 = 34).
  ```

  ### Constraints
  - `1 <= n == throughput.length == reliability.length <= 10^5`
  - `1 <= throughput[i] <= 10^5`
  - `1 <= reliability[i] <= 10^5`
  - `1 <= k <= n`
  - The answer is at most `10^15`, which fits in a signed 64-bit integer.

  **Follow-up:** trying every subset is exponential and fixing every pair is still too slow. Can you do it in `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_cluster_throughput
  params:
    - {name: throughput, type: "int[]"}
    - {name: reliability, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def max_cluster_throughput(throughput: list[int], reliability: list[int], k: int) -> int:
        machines = sorted(zip(reliability, throughput), reverse=True)
        chosen: list[int] = []  # min-heap of the throughputs kept
        total = 0
        best = 0
        for rel, tp in machines:
            heapq.heappush(chosen, tp)
            total += tp
            if len(chosen) > k:
                total -= heapq.heappop(chosen)
            best = max(best, total * rel)
        return best
  javascript: |
    function maxClusterThroughput(throughput, reliability, k) {
      const order = throughput.map((_, i) => i).sort((a, b) => reliability[b] - reliability[a]);
      // Min-heap of kept throughputs.
      const heap = [];
      const push = (v) => {
        heap.push(v);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p] <= heap[i]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && heap[l] < heap[m]) m = l;
            if (r < heap.length && heap[r] < heap[m]) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      let total = 0;
      let best = 0;
      for (const i of order) {
        push(throughput[i]);
        total += throughput[i];
        if (heap.length > k) total -= pop();
        best = Math.max(best, total * reliability[i]);
      }
      return best;
    }
