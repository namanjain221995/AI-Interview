expected_concepts:
  - "fixing the minimum reliability by iterating machines in decreasing reliability"
  - "greedy choice of the largest throughputs among eligible machines"
  - "min-heap of size k with a running sum"
  - "64-bit arithmetic for the product"
  - "exchange argument for why the top-k throughputs are optimal for a fixed minimum"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Observes that fixing the minimum-reliability member reduces the problem to picking the largest throughputs among more reliable machines, sorts by reliability descending, keeps a size-k min-heap with a running sum, uses 64-bit arithmetic and argues correctness and O(n log n)."
  good: "Reaches the sort-plus-heap solution with some prompting, or recomputes the top-k sum in a way that is slightly slower but still sub-quadratic; minor fixes after testing."
  weak: "Tries subsets or pairs, greedily picks the fastest or most reliable machines, forces exactly k machines, or overflows 32-bit integers."
  criteria:
    correctness: "All tests pass, including the cases where fewer than k machines win and reliability ties."
    efficiency: "O(n log n): one sort plus O(log k) heap work per machine."
    code_quality: "Clear pairing of throughput and reliability before sorting; running sum kept in step with the heap."
    edge_cases: "Single machine, k = 1, k = n, ties and values that overflow 32-bit products."
    communication: "Explains why each machine is tried as the least reliable member and why evicting the smallest throughput is safe."
hints:
  - "The score depends on just one machine's reliability, the weakest one. Try deciding first which machine plays that role."
  - "If a particular machine is the least reliable member, every other member must be at least as reliable, and among those you simply want the largest throughputs, up to k of them including it."
  - "Sort machines by reliability from highest to lowest and walk through them; keep the throughputs seen so far in a min-heap capped at k entries along with their running sum, evicting the smallest when it grows past k, and after each step compare the running sum times the current reliability with the best score."
followups:
  - "Why is it fine that the machine just added might be the one evicted from the heap?"
  - "What changes if the cluster must contain exactly k machines?"
  - "How would you also return which machines form the best cluster?"
  - "If the score used the average reliability instead of the minimum, would the same approach work?"
common_errors:
  - "Requiring exactly k machines, which misses better smaller clusters."
  - "Picking the k fastest machines or the k most reliable machines greedily."
  - "Computing the product in 32-bit integers, which overflows for large throughput sums."
  - "Re-summing the top k throughputs from scratch for every machine, giving O(n * k) or worse."
  - "Sorting throughput and reliability separately and losing which values belong to the same machine."
