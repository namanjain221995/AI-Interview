expected_concepts:
  - record the last position of every request id in a hash map
  - extend the current segment to the furthest last position seen
  - cut exactly when the scan reaches that furthest position
  - cutting at every safe position yields the maximum number of segments
  - two linear passes
optimal_complexity: {time: O(n), space: O(k)}
rubric:
  excellent: Precomputes last positions, extends a running reach, cuts as soon as the index meets the reach, argues why cutting at every safe point is optimal, and states O(n) time with O(k) space for k distinct ids.
  good: Reaches the last-position approach with some prompting and returns correct lengths, with a brief justification.
  weak: Checks every cut point by comparing prefix and suffix sets in quadratic time, returns segment contents or end indices instead of lengths, or cuts too early.
  criteria:
    correctness: All tests pass, including chained overlaps, adjacent duplicates and case-sensitive ids.
    efficiency: Linear time with a hash map; no repeated scans of the remaining log.
    code_quality: Clear names for the reach and the segment start; lengths computed without off-by-one errors.
    edge_cases: Empty log, a single line, an id at both ends, ids differing only by case.
    communication: Explains why a segment can end only when every id inside it has made its last appearance.
hints:
  - A segment that contains a request id must stretch at least as far as that id's final appearance in the log. What information would let you know where that is in constant time?
  - Walk the log while tracking how far the current segment is forced to extend by the ids seen so far. When can you be sure it is safe to cut?
  - First store each id's last index in a map. Then scan once keeping a reach value set to the largest last index of any id in the current segment; when the current index equals the reach, close the segment, record its length and start the next segment at the following index.
followups:
  - Why does cutting at every safe position give the maximum number of segments, and is that cut unique?
  - How would you handle a log too large to hold in memory, given a precomputed index of last positions?
  - What changes if the goal were segments of roughly equal size instead of as many as possible?
  - How would you return the segments themselves instead of their lengths?
common_errors:
  - Cutting as soon as the current id's own last position is reached, ignoring earlier ids in the same segment.
  - Off-by-one errors when computing a segment's length from its start and end indices.
  - Recomputing last positions inside the loop, turning the solution quadratic.
  - Returning end indices instead of lengths.
