slug: split_request_log_segments
title: Split Request Log into Segments
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, sre, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Split Request Log into Segments

  An API gateway writes one log line per event, and each line carries the id of the request it belongs
  to. A request can produce several lines, and lines of different requests interleave. You are given
  the request ids of the log lines in order.

  To process the log in parallel, you want to cut it into **contiguous segments** such that all lines of
  any one request id fall into the **same** segment. Among all valid ways to cut the log, choose the one
  with the **most segments** and return the segment lengths in log order.

  - Ids are compared exactly (case-sensitive).
  - Return an empty list for an empty log.

  ### Example 1
  ```
  Input:  request_ids = ["r1", "r2", "r1", "r3", "r4", "r3", "r5"]
  Output: [3, 3, 1]
  Explanation: ["r1", "r2", "r1"] | ["r3", "r4", "r3"] | ["r5"]
  ```

  ### Example 2
  ```
  Input:  request_ids = ["q1", "q2", "q3", "q1"]
  Output: [4]
  Explanation: q1 appears at both ends, so the log cannot be cut.
  ```

  ### Example 3
  ```
  Input:  request_ids = ["x", "y", "z"]
  Output: [1, 1, 1]
  ```

  ### Constraints
  - `0 <= request_ids.length <= 10^5`
  - `1 <= request_ids[i].length <= 32`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: split_request_log_segments
  params:
    - {name: request_ids, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def split_request_log_segments(request_ids: list[str]) -> list[int]:
        last_seen = {request_id: i for i, request_id in enumerate(request_ids)}
        lengths: list[int] = []
        segment_start = 0
        reach = 0
        for i, request_id in enumerate(request_ids):
            reach = max(reach, last_seen[request_id])
            if i == reach:
                # Every id seen in this segment ends here, so it is safe to cut.
                lengths.append(i - segment_start + 1)
                segment_start = i + 1
        return lengths
  javascript: |
    function splitRequestLogSegments(requestIds) {
      const lastSeen = new Map();
      requestIds.forEach((id, i) => lastSeen.set(id, i));
      const lengths = [];
      let segmentStart = 0;
      let reach = 0;
      for (let i = 0; i < requestIds.length; i++) {
        reach = Math.max(reach, lastSeen.get(requestIds[i]));
        if (i === reach) {
          lengths.push(i - segmentStart + 1);
          segmentStart = i + 1;
        }
      }
      return lengths;
    }
