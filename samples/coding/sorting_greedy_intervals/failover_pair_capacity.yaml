title: Failover Pair Capacity
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, platform, cloud]
time_limit_minutes: 12
prompt_markdown: |
  ## Failover Pair Capacity

  A platform team is grouping its servers into active/standby failover pairs. There is an even number
  of servers and `capacities[i]` is the number of requests per second server `i` can handle. Every
  server must belong to exactly one pair.

  If one member of a pair fails, the other must carry all of the pair's traffic, so a pair can only be
  trusted with as much traffic as its **weaker** member can handle: the safe capacity of a pair is the
  minimum of its two servers' capacities.

  Return the **maximum possible sum of safe capacities** over all ways to form the pairs.

  - Any two servers may be paired; their positions in the array do not matter.
  - The result can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  capacities = [6, 2, 9, 4]
  Output: 8
  Explanation: Pair (2, 4) and (6, 9): the safe capacities are 2 and 6, for a total of 8.
  ```

  ### Example 2
  ```
  Input:  capacities = [5, 5, 1, 8, 3, 3]
  Output: 9
  Explanation: Pair (1, 3), (3, 5) and (5, 8) for 1 + 3 + 5 = 9.
  ```

  ### Constraints
  - `2 <= capacities.length <= 2 * 10^4`, and `capacities.length` is even
  - `0 <= capacities[i] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: failover_pair_capacity
  params:
    - {name: capacities, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def failover_pair_capacity(capacities: list[int]) -> int:
        ordered = sorted(capacities)
        return sum(ordered[0::2])
  javascript: |
    function failoverPairCapacity(capacities) {
      const ordered = [...capacities].sort((a, b) => a - b);
      let total = 0;
      for (let i = 0; i < ordered.length; i += 2) {
        total += ordered[i];
      }
      return total;
    }
