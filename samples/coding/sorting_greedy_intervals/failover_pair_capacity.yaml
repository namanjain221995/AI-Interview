expected_concepts:
  - "sorting the capacities"
  - "pairing neighbours in sorted order"
  - "summing every other element starting with the smallest"
  - "exchange argument: the smallest server's partner should be the next smallest"
optimal_complexity: {time: "O(n log n)", space: "O(n) for the sorted copy (O(1) extra if sorting in place)"}
rubric:
  excellent: "Sorts, pairs neighbours, sums the elements at even positions and explains why the smallest server should be paired with the second smallest; states O(n log n)."
  good: "Correct sort-and-pair solution with minor prompting on the justification."
  weak: "Pairs smallest with largest, tries all pairings, or sums the maxima instead of the minima."
  criteria:
    correctness: "All tests pass, including two servers, equal capacities and zeros."
    efficiency: "One sort plus a linear pass."
    code_quality: "A short loop with a clear step of two, or a well-named slice."
    edge_cases: "Minimum size, zeros, equal values and large capacities."
    communication: "Explains that the smallest capacity is always lost as a minimum, so it should be paired with the server that wastes the least."
hints:
  - "The weakest server limits whatever pair it joins. Which partner wastes the least capacity next to it?"
  - "Pair the weakest server with the second weakest, then repeat on the rest."
  - "Sort the capacities ascending; pairs are (0, 1), (2, 3), and so on, so the answer is the sum of the elements at even indices, accumulated in 64 bits."
followups:
  - "Prove the neighbour pairing is optimal with an exchange argument."
  - "Capacities are bounded by 10^6. How could you solve this in O(n + max) time?"
  - "How would you return the pairs with their original server indices?"
  - "What if each failover group had three servers instead of two?"
common_errors:
  - "Pairing the smallest with the largest, which minimises the result instead."
  - "Summing the odd positions (the larger member of each pair)."
  - "Default lexicographic sort in JavaScript."
  - "Accumulating into a 32-bit integer without considering the bounds."
