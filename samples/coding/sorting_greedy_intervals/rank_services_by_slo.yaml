  - {id: t6, hidden: true, args: [["a", "b", "c", "d"], [10000, 0, 5000, 10000], [500, 1, 10, 20]], expected: ["d", "a", "c", "b"], description: "Perfect availability beats a much faster service; latency only matters within equal availability"}
