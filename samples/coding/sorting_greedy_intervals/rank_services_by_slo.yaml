expected_concepts:
  - "multi-key sorting with mixed ascending and descending keys"
  - "sorting indices or zipped records to keep parallel arrays aligned"
  - "tuple keys or a comparator that falls through tie-breakers"
  - "deterministic ordering via a unique final tie-breaker"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Keeps the parallel arrays aligned by sorting indices or records, expresses all three keys in one comparator or key (negating availability or reversing that comparison) and explains why the unique name makes the order deterministic."
  good: "Produces a correct ranking with a comparator; may need a nudge on descending availability or on the name tie-break."
  weak: "Sorts one array independently of the others, gets the direction of a key wrong, or ignores ties."
  criteria:
    correctness: "All tests pass, including full ties and two-level ties."
    efficiency: "One O(n log n) sort; no repeated sorting or quadratic selection."
    code_quality: "A single readable key or comparator with the rule order visible; parallel arrays never fall out of sync."
    edge_cases: "Empty input, single service, extreme availability and latency values."
    communication: "States the ranking rules back in order and explains how ties fall through."
hints:
  - "The three arrays describe the same services, so whatever you sort must keep each name attached to its own metrics."
  - "Sort positions (or name-metric records) rather than the arrays themselves, and decide how to express a descending key next to ascending ones."
  - "Sort the indices with a composite rule: availability from high to low, then latency from low to high, then name ascending; then map the sorted indices back to names."
followups:
  - "How would you return only the bottom three services without sorting everything?"
  - "What changes if availability arrives as a float percentage such as 99.95 instead of basis points?"
  - "How would you make the ranking stable across weeks if names were not unique?"
  - "How would you add a fourth criterion, such as error budget remaining, without rewriting the comparator?"
common_errors:
  - "Sorting the names array alone, losing the link to each service's metrics."
  - "Sorting availability ascending instead of descending."
  - "Forgetting the name tie-break, which makes the output depend on input order."
  - "Subtracting in the comparator in the wrong order for the descending key."
