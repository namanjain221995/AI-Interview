slug: rank_services_by_slo
title: Rank Services by SLO Health
difficulty: easy
competency_keys: [algorithms, code_quality]
role_tags: [sre, backend, devops]
time_limit_minutes: 12
prompt_markdown: |
  ## Rank Services by SLO Health

  A weekly reliability review ranks every service by how well it met its service-level objectives.
  You receive three arrays of equal length describing the same services: `names[i]` is the service
  name, `availability_bp[i]` its measured availability in **basis points** (`9995` means 99.95%) and
  `p99_ms[i]` its 99th-percentile latency in milliseconds.

  Return the service names ordered from healthiest to least healthy using these rules in order:

  1. Higher availability first.
  2. If availability is equal, lower p99 latency first.
  3. If both are equal, names in ascending order (plain character-by-character comparison).

  Names are unique, so the ranking is always fully determined.

  ### Example 1
  ```
  Input:  names = ["billing", "auth", "search"], availability_bp = [9990, 9950, 9990], p99_ms = [180, 90, 120]
  Output: ["search", "billing", "auth"]
  Explanation: search and billing tie on availability, so the faster search comes first; auth has the lowest availability.
  ```

  ### Example 2
  ```
  Input:  names = ["queue", "cache", "gateway"], availability_bp = [9999, 9999, 9999], p99_ms = [40, 40, 40]
  Output: ["cache", "gateway", "queue"]
  Explanation: All three tie on both metrics, so they are ordered by name.
  ```

  ### Constraints
  - `0 <= names.length <= 10^4`
  - `names.length == availability_bp.length == p99_ms.length`
  - `names[i]` is unique and consists of 1 to 30 lowercase letters, digits or hyphens
  - `0 <= availability_bp[i] <= 10000`
  - `1 <= p99_ms[i] <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rank_services_by_slo
  params:
    - {name: names, type: "string[]"}
    - {name: availability_bp, type: "int[]"}
    - {name: p99_ms, type: "int[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def rank_services_by_slo(names: list[str], availability_bp: list[int], p99_ms: list[int]) -> list[str]:
        order = sorted(range(len(names)), key=lambda i: (-availability_bp[i], p99_ms[i], names[i]))
        return [names[i] for i in order]
  javascript: |
    function rankServicesBySlo(names, availabilityBp, p99Ms) {
      const idx = names.map((_, i) => i);
      idx.sort((a, b) => {
        if (availabilityBp[a] !== availabilityBp[b]) return availabilityBp[b] - availabilityBp[a];
        if (p99Ms[a] !== p99Ms[b]) return p99Ms[a] - p99Ms[b];
        return names[a] < names[b] ? -1 : names[a] > names[b] ? 1 : 0;
      });
      return idx.map((i) => names[i]);
    }
