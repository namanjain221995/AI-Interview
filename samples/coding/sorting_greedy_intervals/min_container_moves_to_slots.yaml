role_tags: [devops, platform, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Minimum Container Moves to Rack Slots

  A data-centre technician is re-seating hardware containers along a single rack row. The row is a
  number line: `containers[i]` is the current position of container `i`, and `slots[j]` is the position
  of a free mounting slot. There are exactly as many slots as containers.

  Every container must be moved to a **different** slot. Moving a container from position `a` to
  position `b` costs `|a - b|`. Return the **minimum total cost** to seat every container.

  - Positions may repeat in either array (several containers can be stacked at one position, and
    several slots can share a position).
  - A container may already be at a slot's position; seating it there costs `0`.
  - If there are no containers, the cost is `0`.
  - The result can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  containers = [4, 1, 5], slots = [2, 6, 3]
  Output: 3
  Explanation: Move 1 -> 2, 4 -> 3 and 5 -> 6 for a total of 1 + 1 + 1 = 3.
  ```

  ### Example 2
  ```
  Input:  containers = [2, 2, 7], slots = [3, 2, 3]
  Output: 5
  Explanation: One container at 2 stays on the slot at 2, the other moves to 3 (cost 1), and 7 moves to 3 (cost 4).
  ```

  ### Constraints
  - `0 <= containers.length == slots.length <= 10^5`
  - `-10^9 <= containers[i], slots[j] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_container_moves_to_slots
  params:
    - {name: containers, type: "int[]"}
    - {name: slots, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def min_container_moves_to_slots(containers: list[int], slots: list[int]) -> int:
        return sum(abs(c - s) for c, s in zip(sorted(containers), sorted(slots)))
  javascript: |
    function minContainerMovesToSlots(containers, slots) {
      const c = [...containers].sort((a, b) => a - b);
      const s = [...slots].sort((a, b) => a - b);
      let total = 0;
      for (let i = 0; i < c.length; i++) {
        total += Math.abs(c[i] - s[i]);
      }
      return total;
    }
