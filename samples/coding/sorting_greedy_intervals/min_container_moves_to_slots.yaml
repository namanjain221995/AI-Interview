expected_concepts:
  - "sort both arrays"
  - "match the i-th smallest container with the i-th smallest slot"
  - "crossing assignments are never better (exchange argument)"
  - "64-bit accumulation"
optimal_complexity: {time: "O(n log n)", space: "O(n) for sorted copies (O(1) extra if sorting in place)"}
rubric:
  excellent: "Sorts both arrays, matches them index by index, sums absolute differences in 64 bits and explains why uncrossing two assignments never increases the cost."
  good: "Correct sort-and-match solution with the right complexity but a hand-wavy or missing justification."
  weak: "Assigns each container to its nearest free slot greedily, tries permutations, or overflows the total."
  criteria:
    correctness: "All tests pass, including empty input, duplicates and negative positions."
    efficiency: "Two sorts and one linear pass."
    code_quality: "Does not mutate the inputs unexpectedly; a single clear accumulation loop."
    edge_cases: "Empty arrays, containers already on slots, stacked positions and totals beyond 32 bits."
    communication: "Gives an exchange argument for matching sorted orders."
hints:
  - "Picture two containers and two slots on a line. When does swapping their destinations reduce the total distance?"
  - "Assignments that cross each other are never better than the uncrossed version, so the leftmost container should go to the leftmost slot."
  - "Sort the container positions and the slot positions independently, send the i-th smallest container to the i-th smallest slot for every i, and add up the absolute differences of each matched pair in a 64-bit total."
followups:
  - "Prove that an assignment with two crossing moves can always be uncrossed without increasing cost."
  - "If positions lie in a small range, how could you avoid comparison sorting?"
  - "What if there were more slots than containers?"
  - "How would the problem change if moving left cost more than moving right?"
common_errors:
  - "Sending each container to its nearest free slot greedily, which can block better choices later."
  - "Sorting only one of the two arrays."
  - "Accumulating into a 32-bit integer."
  - "Using the default lexicographic sort in JavaScript, which misorders negative and multi-digit numbers."
