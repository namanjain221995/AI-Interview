version: 1
slug: sort_release_versions
title: Sort Release Versions
difficulty: easy
competency_keys: [algorithms, code_quality, problem_solving]
role_tags: [backend, devops, platform, frontend]
time_limit_minutes: 15
prompt_markdown: |
  ## Sort Release Versions

  A release dashboard lists every version of a service that was ever deployed. Versions are strings
  of **1 to 4** segments separated by dots, where every segment is a non-negative integer written in
  decimal, for example `"1.10.0"`, `"2"` or `"0.9.12.3"`. A segment may have leading zeros, so
  `"1.02"` is the same version as `"1.2"`.

  Return the versions sorted in **ascending** version order. Two versions are compared segment by
  segment from the left, **numerically**; a missing trailing segment counts as `0`, so `"1.2"`,
  `"1.2.0"` and `"1.2.0.0"` are all equal. Versions that compare equal must keep the **relative
  order** they had in the input. Return the original strings unchanged (do not normalise them).

  ### Example 1
  ```
  Input:  versions = ["1.10.0", "1.2", "1.9.3", "0.9"]
  Output: ["0.9", "1.2", "1.9.3", "1.10.0"]
  Explanation: Numerically 10 > 9 > 2 in the second segment, so 1.10.0 is the newest; a plain string sort would put it before 1.2.
  ```

  ### Example 2
  ```
  Input:  versions = ["2.0", "1.2.0", "2", "1.2"]
  Output: ["1.2.0", "1.2", "2.0", "2"]
  Explanation: 1.2.0 and 1.2 are equal and keep their input order, as do 2.0 and 2.
  ```

  ### Constraints
  - `0 <= versions.length <= 10^4`
  - Each version has 1 to 4 segments separated by single dots; no empty segments
  - Each segment consists of 1 to 9 decimal digits
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sort_release_versions
  params:
    - {name: versions, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def sort_release_versions(versions: list[str]) -> list[str]:
        def key(version: str) -> tuple[int, ...]:
            parts = [int(part) for part in version.split(".")]
            return tuple(parts + [0] * (4 - len(parts)))

        return sorted(versions, key=key)
  javascript: |
    function sortReleaseVersions(versions) {
      const key = (v) => {
        const parts = v.split(".").map(Number);
        while (parts.length < 4) parts.push(0);
        return parts;
      };
      const decorated = versions.map((v, i) => ({ v, i, k: key(v) }));
      decorated.sort((a, b) => {
        for (let s = 0; s < 4; s++) {
          if (a.k[s] !== b.k[s]) return a.k[s] - b.k[s];
        }
        return a.i - b.i;
      });
      return decorated.map((d) => d.v);
    }
