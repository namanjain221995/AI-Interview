expected_concepts:
  - "parse each version into integer segments"
  - "pad missing segments with zero before comparing"
  - "custom sort key or comparator"
  - "stable sorting to preserve the order of equal versions"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Parses versions into numeric tuples once (decorate then sort), pads to a fixed length, relies on a stable sort or an index tiebreak for equal versions and explains why string comparison fails."
  good: "Writes a correct comparator or key with numeric segments; needs a prompt about padding, leading zeros or stability."
  weak: "Sorts the raw strings, compares segments as text, drops stability or returns normalised strings instead of the originals."
  criteria:
    correctness: "All tests pass, including leading zeros, missing segments and equal versions in different spellings."
    efficiency: "Each version parsed once (or a cheap comparator) with O(n log n) overall sorting."
    code_quality: "Parsing isolated in a small helper; no ad-hoc string slicing; original strings returned untouched."
    edge_cases: "Handles empty input, single segments, four segments and leading zeros."
    communication: "Explains why 1.10 sorts after 1.9 and how ties are kept in input order."
hints:
  - "Ask yourself why a plain alphabetical sort puts 1.10 before 1.9, and what each part of a version really represents."
  - "Turn each version into a list of whole numbers and compare those lists; think about what to do when one version has fewer parts than another."
  - "Build a sort key per version made of its numeric segments padded with zeros to four entries, and use a stable sort (or break ties by original position) so equal versions keep their input order while you still return the original strings."
followups:
  - "How would you support pre-release tags such as 1.2.0-rc1 that sort before 1.2.0?"
  - "Why does a stable sort matter here, and how would you guarantee it in a language whose default sort is not stable?"
  - "Would you parse inside the comparator or precompute keys? What does each cost?"
  - "How would you validate malformed input like empty segments or non-digit characters?"
common_errors:
  - "Sorting the version strings lexicographically so 1.10 comes before 1.9."
  - "Comparing segments as strings, which breaks on leading zeros and different lengths."
  - "Treating 1.2 and 1.2.0 as different versions instead of padding with zeros."
  - "Returning normalised strings (for example stripping leading zeros) instead of the originals."
