erts up to 10^6 minutes long over a 10^9 range, k = 2"}
expected_concepts:
  - "sweep line over start and end events"
  - "half-open ranges: process an end before a start at the same instant, or sum lengths between event times"
  - "running count of active alerts"
  - "accumulate segment lengths while the count meets the threshold"
  - "64-bit total"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Turns alerts into +1/-1 events, sorts them, keeps a running active count and adds the length of each segment between consecutive event times when the count is at least k; explains why same-time ends and starts are safe, rejects per-minute arrays and states O(n log n)."
  good: "Correct sweep-line or difference-map solution, perhaps after a hint about how to measure segment lengths or a fix for the touching-alert case."
  weak: "Iterates minute by minute, merges intervals (which only answers k = 1), or counts touching alerts as overlapping."
  criteria:
    correctness: "All tests pass, including empty input, touching alerts, identical alerts and thresholds above the number of alerts."
    efficiency: "Sorting the events dominates; each event is processed once."
    code_quality: "Events, running count and the previous time are clearly named; no special-case branches for k = 1."
    edge_cases: "Empty input, k larger than the alert count, alerts that touch and time stamps near 10^9."
    communication: "Explains why the active count is constant between two consecutive event times."
hints:
  - "The number of firing alerts only changes at the moments when an alert starts or resolves. What happens to the count between two such moments?"
  - "Turn every alert into two events, one that adds one at its start and one that subtracts one at its end. Visit the events in time order while keeping the current count."
  - "Sort all events by time. Keep the previous event time and the number of active alerts. Before applying each event, if the active count is at least k, add the distance from the previous time to this event's time to the answer. Then apply the event and remember this time as the previous one."
followups:
  - "How would you return the actual stretches of time instead of only the total?"
  - "How would you answer the same question for many different values of k at once?"
  - "What changes if alerts were closed ranges counted in whole minutes?"
  - "How would you compute this over a stream of alerts that arrive out of order?"
common_errors:
  - "Using an array indexed by minute, which is infeasible for time stamps near 10^9."
  - "Merging intervals first, which loses the overlap counts needed for k greater than 1."
  - "Applying a start before an end at the same instant and then counting a zero-length segment incorrectly or adding a phantom minute."
  - "Accumulating the total in a 32-bit integer."
