slug: minutes_with_k_alerts
title: "Minutes With At Least K Alerts"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Minutes With At Least K Alerts

  An on-call review wants to know how long the team was under heavy alert load. Each entry of `alerts`
  is `[start, end]`: an alert that started firing at minute `start` and resolved at minute `end`, so it
  was firing during the half-open range `[start, end)`. Alerts can overlap, repeat, and appear in any
  order.

  Given a threshold `k`, return the total number of minutes during which **at least `k` alerts were firing
  at the same time**. Minutes do not need to be contiguous: add up every stretch that meets the
  threshold. Return the total as a 64-bit integer; if the threshold is never reached (including when
  there are no alerts), return `0`.

  ### Example 1
  ```
  Input:  alerts = [[0, 10], [5, 15], [8, 12], [20, 25]], k = 2
  Output: 7
  Explanation: Two or more alerts fire from minute 5 to minute 12 (three of them from 8 to 10), which is 7 minutes.
  ```

  ### Example 2
  ```
  Input:  alerts = [[0, 10], [5, 15], [8, 12], [20, 25]], k = 1
  Output: 20
  Explanation: At least one alert fires during [0, 15) and [20, 25): 15 + 5 = 20 minutes.
  ```

  ### Example 3
  ```
  Input:  alerts = [[0, 10], [5, 15], [8, 12], [20, 25]], k = 3
  Output: 2
  ```

  ### Constraints
  - `0 <= alerts.length <= 10^5`
  - `alerts[i].length == 2` and `0 <= start < end <= 10^9`
  - `1 <= k <= 10^5`

  Time stamps are large, so a per-minute array is not an option; aim for `O(n log n)`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: minutes_with_k_alerts
  params:
    - {name: alerts, type: "int[][]"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def minutes_with_k_alerts(alerts: list[list[int]], k: int) -> int:
        events = []
        for start, end in alerts:
            events.append((start, 1))
            events.append((end, -1))
        events.sort()
        total = 0
        active = 0
        prev = 0
        for time, delta in events:
            # [prev, time) had `active` alerts firing.
            if active >= k:
                total += time - prev
            active += delta
            prev = time
        return total
  javascript: |
    function minutesWithKAlerts(alerts, k) {
      const events = [];
      for (const [start, end] of alerts) {
        events.push([start, 1]);
        events.push([end, -1]);
      }
      events.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      let total = 0;
      let active = 0;
      let prev = 0;
      for (const [time, delta] of events) {
        if (active >= k) total += time - prev;
        active += delta;
        prev = time;
      }
      return total;
    }
