title: "Count Essential Firewall Ranges"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [security, network, devops]
time_limit_minutes: 20
prompt_markdown: |
  ## Count Essential Firewall Ranges

  A network team is cleaning up a firewall allow-list. Each rule allows an **inclusive** port range
  `ranges[i] = [lo, hi]`. A rule is **redundant** when another rule already allows every port it allows,
  that is when the other rule's range contains its range (`other_lo <= lo` and `hi <= other_hi`). When
  several rules have exactly the same range, exactly **one** copy of that range is kept and the other
  copies are redundant.

  Return the number of rules that remain after every redundant rule is removed. Equivalently, count the
  distinct ranges that are not contained in any **different** range of the list. Ranges that merely
  overlap are both kept.

  ### Example 1
  ```
  Input:  ranges = [[20, 25], [10, 30], [22, 40], [80, 443], [100, 200]]
  Output: 3
  Explanation: [20, 25] lies inside [10, 30] and [100, 200] lies inside [80, 443].
               [22, 40] overlaps [10, 30] but is not contained in it.
  ```

  ### Example 2
  ```
  Input:  ranges = [[8000, 8080], [8000, 8080], [8000, 8090]]
  Output: 1
  Explanation: both copies of [8000, 8080] lie inside [8000, 8090].
  ```

  ### Example 3
  ```
  Input:  ranges = [[443, 443], [443, 443]]
  Output: 1
  Explanation: two identical rules - one copy is kept.
  ```

  ### Constraints
  - `1 <= ranges.length <= 10^5`
  - `0 <= lo <= hi <= 65535`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_essential_firewall_ranges
  params:
    - {name: ranges, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_essential_firewall_ranges(ranges: list[list[int]]) -> int:
        ordered = sorted(ranges, key=lambda r: (r[0], -r[1]))
        kept = 0
        widest_end = -1
        for lo, hi in ordered:
            if hi > widest_end:
                kept += 1
                widest_end = hi
        return kept
  javascript: |
    function countEssentialFirewallRanges(ranges) {
      const ordered = ranges.map((r) => [r[0], r[1]]).sort((a, b) => a[0] - b[0] || b[1] - a[1]);
      let kept = 0;
      let widestEnd = -1;
      for (const [, hi] of ordered) {
        if (hi > widestEnd) {
          kept++;
          widestEnd = hi;
        }
      }
      return kept;
    }
