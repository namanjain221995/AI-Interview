expected_concepts:
  - sorting by start ascending and end descending
  - single sweep tracking the furthest end seen
  - interval containment versus overlap
  - handling exact duplicates
optimal_complexity: {time: "O(n log n)", space: "O(n) for the sorted copy"}
rubric:
  excellent: "Sorts by start ascending and end descending, keeps a rule only when its end extends past the furthest end seen, explains why the tie-break on end handles equal starts and duplicates, and states O(n log n)."
  good: "Correct sort-and-sweep after a hint about the tie-break for equal starts, or a correct O(n^2) check with a clear path to the faster version."
  weak: "Merges overlapping ranges and counts the merged groups, or counts both copies of duplicates."
  criteria:
    correctness: "All tests pass, including duplicates, equal starts, equal ends and touching ranges."
    efficiency: "O(n log n) sort with a linear sweep; no pairwise comparison of all rules."
    code_quality: "Sort key and sweep condition are short and clearly named."
    edge_cases: "Single rule, exact duplicates, single-port ranges, the full 0-65535 range."
    communication: "Distinguishes containment from overlap and explains the strict comparison in the sweep."
hints:
  - "A rule can only be contained in a rule that starts no later than it does - think about the order in which to look at the rules."
  - "If rules are sorted by start, a rule is contained in an earlier one exactly when some earlier rule ends at or after its end; ties on start need care so that the widest rule is seen first."
  - "Sort by start ascending and, for equal starts, by end descending; sweep while remembering the largest end seen so far, and count a rule only when its end is strictly greater than that value, then update it."
followups:
  - "How would you return the remaining rules themselves, sorted by start?"
  - "How would you also merge rules that overlap or touch so that the allow-list is as short as possible?"
  - "Rules can also deny ports and are evaluated in order - what does redundancy mean then?"
common_errors:
  - "Sorting only by start, so a narrower rule with the same start is seen first and counted."
  - "Using >= in the sweep, which keeps exact duplicates or ranges with the same end."
  - "Treating overlapping ranges as redundant."
  - "Comparing every pair of rules in O(n^2)."
