version: 1
slug: maximize_positive_balance_days
title: "Maximize Positive Balance Days"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [data_analyst, business_analyst, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Maximize Positive Balance Days

  A finance analyst is building a cash-flow forecast for a project. Each entry of `flows` is the net
  cash flow of one day (positive for income, negative for spend, possibly zero), and the analyst may
  book the days in **any order**. The running balance starts at `0`, and after each booked day it is
  updated by that day's flow.

  Return the **maximum number of days** whose balance at the end of the day is **strictly positive**,
  over all possible orderings.

  ### Example 1
  ```
  Input:  flows = [-3, 5, 2, -4, -1]
  Output: 4
  Explanation: Booking 5, 2, -1, -3, -4 gives balances 5, 7, 6, 3, -1, so four days end positive.
  ```

  ### Example 2
  ```
  Input:  flows = [-2, -7]
  Output: 0
  ```

  ### Example 3
  ```
  Input:  flows = [4, -4, 0]
  Output: 2
  Explanation: Booking 4, 0, -4 gives balances 4, 4, 0; a balance of 0 is not positive.
  ```

  ### Constraints
  - `1 <= flows.length <= 10^5`
  - `-10^9 <= flows[i] <= 10^9`
  - The running balance can exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: maximize_positive_balance_days
  params:
    - {name: flows, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def maximize_positive_balance_days(flows: list[int]) -> int:
        balance = 0
        positive_days = 0
        for flow in sorted(flows, reverse=True):
            balance += flow
            if balance <= 0:
                break
            positive_days += 1
        return positive_days
  javascript: |
    function maximizePositiveBalanceDays(flows) {
      const ordered = [...flows].sort((a, b) => b - a);
      let balance = 0;
      let positiveDays = 0;
      for (const flow of ordered) {
        balance += flow;
        if (balance <= 0) break;
        positiveDays += 1;
      }
      return positiveDays;
    }
