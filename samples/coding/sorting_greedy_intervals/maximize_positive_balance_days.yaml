expected_concepts:
  - "sort flows in descending order"
  - "each prefix of the descending order has the largest possible sum for its length"
  - "once the running balance drops to zero or below it never recovers"
  - "strictly positive comparison"
  - "64-bit running balance"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts descending, argues that every prefix is maximal for its length and that the balance only falls once it hits the negatives, uses a 64-bit balance and the strict comparison."
  good: "Correct descending-sort solution with a brief justification."
  weak: "Keeps the input order, sorts ascending, counts zero balances as positive, or overflows on large flows."
  criteria:
    correctness: "All tests pass, including zero balances and the single-day cases."
    efficiency: "One sort and a linear pass with an early exit."
    code_quality: "Clear running balance and counter, with a break once the balance is no longer positive."
    edge_cases: "All negative, all positive, zeros, a balance landing exactly on zero and large values."
    communication: "Explains why booking the largest flows first is optimal and why the scan can stop early."
hints:
  - "To keep the balance high for as long as possible, which days would you book first?"
  - "For any number of days k, the first k days have the largest total when they are the k largest flows."
  - "Sort the flows from largest to smallest, keep a running balance in a 64-bit variable and count days until the balance is no longer strictly positive."
followups:
  - "What if a few days are fixed to specific positions in the order?"
  - "How would you return the ordering itself, not just the count?"
  - "Can you avoid a full sort when most flows are negative?"
common_errors:
  - "Counting a day whose balance is exactly zero."
  - "Sorting ascending or keeping the input order."
  - "Using a 32-bit balance that overflows with large positive flows."
