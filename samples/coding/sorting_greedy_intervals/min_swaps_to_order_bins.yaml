expected_concepts:
  - mapping each bin to its final slot by sorting a copy of the labels
  - viewing the arrangement as a permutation made of disjoint cycles
  - a cycle of length k needs exactly k - 1 swaps
  - visited markers so each cycle is counted once
  - O(n log n) time dominated by sorting
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Maps each bin to its sorted position, decomposes the permutation into cycles, sums cycle length minus one, explains why no strategy can do better and states O(n log n) time."
  good: "Correct solution (cycle counting or greedy swap-into-place with a position map) with a short justification, possibly after a hint about cycles."
  weak: "Counts adjacent swaps (bubble sort or inversions), counts misplaced bins instead of cycles, or uses an O(n^2) search that only works on small shelves."
  criteria:
    correctness: "All tests pass, including already ordered shelves, descending shelves and labels that are not 0..n-1."
    efficiency: "Sorting dominates; the cycle walk visits each slot once."
    code_quality: "Does not mutate the caller's list unexpectedly; clear names for the target-slot map and visited markers."
    edge_cases: "Empty shelf, single bin, negative and extreme labels, fixed points."
    communication: "Explains the cycle argument: each swap can fix at most one extra bin within a cycle, so k - 1 swaps per cycle is optimal."
hints:
  - "Sort a copy of the labels: now you know exactly which slot each bin must finally occupy."
  - "Follow the chain from a slot to the slot its bin belongs in, then to where that bin belongs, and so on. These chains close into loops that never share bins. How many swaps does one loop of k bins need?"
  - "Build a map from each current slot to its target slot using the sorted order, walk every unvisited slot around its loop while marking slots as visited, and add the loop length minus one to the answer; fixed points contribute zero."
followups:
  - "What changes if only adjacent bins may be swapped?"
  - "How would you also output the actual sequence of swaps?"
  - "What if labels could repeat and any ascending arrangement were acceptable?"
common_errors:
  - "Counting misplaced bins instead of summing cycle length minus one."
  - "Counting adjacent swaps (inversions), which answers a different question."
  - "Assuming labels are exactly 0..n-1 and indexing by label directly."
  - "Comparing with a subtraction comparator in a typed language, which overflows for extreme labels."
