prompt_markdown: |
  ## Minimum Swaps to Order Storage Bins

  A warehouse robot is tidying one shelf of storage bins. Every bin carries a **distinct** integer label,
  and `labels[i]` is the label of the bin currently in slot `i`. The robot has a single move: pick up
  **any two** bins (they do not have to be next to each other) and exchange their slots. Each exchange
  counts as one swap.

  Return the **minimum number of swaps** needed so that the labels read in **ascending order** from slot
  `0` to the last slot. A shelf that is already ordered (including an empty shelf or a shelf with one
  bin) needs `0` swaps.

  ### Example 1
  ```
  Input:  labels = [40, 30, 10, 20]
  Output: 3
  Explanation: Sorted order is [10, 20, 30, 40]. Bin 40 must go to slot 3, the bin there (20) to slot 1,
               the bin there (30) to slot 2 and the bin there (10) back to slot 0: one loop of 4 bins, 3 swaps.
  ```

  ### Example 2
  ```
  Input:  labels = [5, 2, 11, 9, 7]
  Output: 2
  Explanation: Swap 5 and 2, then swap 11 and 7; bin 9 is already in its slot.
  ```

  ### Example 3
  ```
  Input:  labels = [-3, 0, 8, 25]
  Output: 0
  ```

  ### Constraints
  - `0 <= labels.length <= 10^5`
  - `-10^9 <= labels[i] <= 10^9`
  - All labels are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_swaps_to_order_bins
  params:
    - {name: labels, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_swaps_to_order_bins(labels: list[int]) -> int:
        n = len(labels)
        # target[i] = slot where the bin currently in slot i must end up
        order = sorted(range(n), key=lambda i: labels[i])
        target = [0] * n
        for final_slot, current_slot in enumerate(order):
            target[current_slot] = final_slot
        seen = [False] * n
        swaps = 0
        for start in range(n):
            if seen[start]:
                continue
            length = 0
            slot = start
            while not seen[slot]:
                seen[slot] = True
                slot = target[slot]
                length += 1
            swaps += length - 1
        return swaps
  javascript: |
    function minSwapsToOrderBins(labels) {
      const n = labels.length;
      const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => labels[a] - labels[b]);
      const target = new Array(n);
      order.forEach((currentSlot, finalSlot) => { target[currentSlot] = finalSlot; });
      const seen = new Array(n).fill(false);
      let swaps = 0;
      for (let start = 0; start < n; start++) {
        if (seen[start]) continue;
        let length = 0;
        let slot = start;
        while (!seen[slot]) {
          seen[slot] = true;
          slot = target[slot];
          length++;
        }
        swaps += length - 1;
      }
      return swaps;
    }
