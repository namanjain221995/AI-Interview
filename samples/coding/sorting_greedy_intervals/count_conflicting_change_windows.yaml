slug: count_conflicting_change_windows
title: Count Conflicting Change Windows
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [devops, sre, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Count Conflicting Change Windows

  Before a freeze, the change-advisory board audits how many pairs of approved change windows clash.
  Each window is a half-open time range `windows[i] = [start, end)` with `start < end`: the window covers
  every moment `t` with `start <= t < end`.

  Two windows **conflict** when they share at least one moment, that is when
  `start_a < end_b` and `start_b < end_a`. Windows that only touch (one ends exactly when the other
  starts) do **not** conflict. Identical windows conflict with each other.

  Return the number of **unordered pairs** `(i, j)` with `i < j` whose windows conflict. With up to
  `10^5` windows the count can exceed the 32-bit range, so return a 64-bit integer, and aim for
  `O(n log n)` time; comparing every pair is too slow for the largest inputs.

  ### Example 1
  ```
  Input:  windows = [[1, 5], [2, 3], [4, 8], [8, 10]]
  Output: 2
  Explanation: [1, 5) conflicts with [2, 3) and with [4, 8). [4, 8) and [8, 10) only touch at 8,
               and [2, 3) ends before [4, 8) starts.
  ```

  ### Example 2
  ```
  Input:  windows = [[0, 10], [0, 10], [0, 10]]
  Output: 3
  Explanation: Every one of the 3 pairs shares the whole range.
  ```

  ### Example 3
  ```
  Input:  windows = [[1, 2], [2, 3], [3, 4]]
  Output: 0
  ```

  ### Constraints
  - `0 <= windows.length <= 10^5`
  - `windows[i].length == 2`
  - `-10^9 <= start < end <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_conflicting_change_windows
  params:
    - {name: windows, type: "int[][]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_right


    def count_conflicting_change_windows(windows: list[list[int]]) -> int:
        n = len(windows)
        ends = sorted(end for _, end in windows)
        # A pair is disjoint exactly when one window ends at or before the other starts;
        # because start < end, each disjoint pair is counted once this way.
        disjoint = 0
        for start, _ in windows:
            disjoint += bisect_right(ends, start)
        return n * (n - 1) // 2 - disjoint
  javascript: |
    function countConflictingChangeWindows(windows) {
      const n = windows.length;
      const ends = windows.map((w) => w[1]).sort((a, b) => a - b);
      let disjoint = 0;
      for (const [start] of windows) {
        let lo = 0;
        let hi = n;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (ends[mid] <= start) lo = mid + 1;
          else hi = mid;
        }
        disjoint += lo;
      }
      return (n * (n - 1)) / 2 - disjoint;
    }
