expected_concepts:
  - counting the complement - total pairs minus non-conflicting pairs
  - a pair is disjoint exactly when one window ends at or before the other starts
  - sorting end times and binary searching (or a sweep line over sorted starts and ends)
  - half-open intervals - touching endpoints do not overlap
  - 64-bit arithmetic for n(n - 1)/2
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Counts disjoint pairs by binary searching each start in the sorted ends (or a sweep that counts active windows), subtracts from n(n - 1)/2, explains why each disjoint pair is counted once, treats touching ends correctly and uses 64-bit arithmetic."
  good: "Correct O(n log n) sweep or complement solution after fixing the touching-endpoint comparison or the 64-bit total."
  weak: "Compares every pair in O(n^2), counts only overlaps between neighbours after sorting, or treats touching windows as conflicts."
  criteria:
    correctness: "All tests pass, including identical windows, touching chains and nested windows."
    efficiency: "Sorting dominates; each window costs one binary search or one sweep event."
    code_quality: "The overlap condition is written once and matches the half-open definition."
    edge_cases: "Empty input, one window, shared starts or ends, extreme coordinates."
    communication: "Explains the complement trick and why a sweep needs ends processed before starts at equal times."
hints:
  - "Counting conflicting pairs directly is awkward. Is it easier to count the pairs that do not conflict?"
  - "Two half-open windows are clash-free exactly when one of them ends at or before the other starts. For a fixed window, how many windows end at or before its start, and how can sorting make that count fast?"
  - "Sort all end times; for each window binary search how many ends are less than or equal to its start and add that up to get the disjoint pairs, then return n times n minus one over two minus that sum using 64-bit integers."
followups:
  - "How would you report, for each window, how many others it conflicts with?"
  - "What is the maximum number of windows active at the same moment?"
  - "How would the answer change for closed intervals where touching counts as a conflict?"
common_errors:
  - "Using less-than instead of less-than-or-equal when counting ends before a start, which counts touching windows as conflicts."
  - "Only comparing neighbours after sorting by start, which misses long windows covering many others."
  - "Computing n(n - 1)/2 in 32-bit arithmetic."
  - "Falling back to the O(n^2) pair loop."
