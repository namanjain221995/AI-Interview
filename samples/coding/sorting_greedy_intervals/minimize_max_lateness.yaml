slug: minimize_max_lateness
title: Minimize Maximum Lateness
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimize Maximum Lateness

  A single report-rendering worker processes queued jobs **one at a time**, starting at time `0`. Job `i`
  needs `durations[i]` time units and is due at time `due[i]`. Jobs cannot be paused or split, and the
  worker never sits idle while jobs remain, so each job finishes at the sum of the durations of the jobs
  run before it plus its own.

  If job `i` finishes at time `f`, its **lateness** is `max(0, f - due[i])`. You choose the order in
  which the jobs run. Return the **smallest possible value of the largest lateness** over all jobs.

  - Return `0` when there are no jobs.
  - The answer can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  durations = [4, 2, 3, 1], due = [5, 3, 9, 4]
  Output: 2
  Explanation: run jobs 1, 3, 0, 2. They finish at 2, 3, 7 and 10; job 0 is 2 late and job 2 is 1 late.
  ```

  ### Example 2
  ```
  Input:  durations = [5, 5], due = [2, 2]
  Output: 8
  Explanation: whichever job runs second finishes at 10 against a due time of 2.
  ```

  ### Constraints
  - `0 <= durations.length <= 10^5`
  - `due.length == durations.length`
  - `1 <= durations[i] <= 10^9`
  - `0 <= due[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: minimize_max_lateness
  params:
    - {name: durations, type: "int[]"}
    - {name: due, type: "int[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def minimize_max_lateness(durations: list[int], due: list[int]) -> int:
        worst = 0
        clock = 0
        # Earliest due time first is optimal (exchange argument on adjacent inversions).
        for i in sorted(range(len(durations)), key=lambda job: due[job]):
            clock += durations[i]
            worst = max(worst, clock - due[i])
        return worst
  javascript: |
    function minimizeMaxLateness(durations, due) {
      const order = durations.map((_, i) => i).sort((a, b) => due[a] - due[b]);
      let worst = 0;
      let clock = 0;
      for (const i of order) {
        clock += durations[i];
        worst = Math.max(worst, clock - due[i]);
      }
      return worst;
    }
