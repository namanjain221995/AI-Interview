expected_concepts:
  - earliest due time first ordering
  - exchange argument on adjacent jobs whose due times are inverted
  - finish time as a running prefix sum of durations
  - 64-bit accumulation for large totals
  - ties in due time do not change the result
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Proposes earliest-due-first, proves it by swapping adjacent inverted jobs without increasing the maximum lateness, rejects shortest-first and least-slack orders with counterexamples, uses 64-bit arithmetic and states O(n log n) time.
  good: Implements earliest-due-first correctly with some prompting and handles overflow, with an informal justification.
  weak: Sorts by duration or by slack, tries all permutations, sums lateness instead of taking the maximum, or overflows on large inputs.
  criteria:
    correctness: All tests pass, including cases where shortest-first and least-slack orders fail.
    efficiency: One sort of job indices plus a linear pass.
    code_quality: Sorts indices or pairs so durations and due times stay aligned; clear names for the clock and the worst lateness.
    edge_cases: No jobs, jobs that are all on time, due time zero, equal due times, totals beyond 32 bits.
    communication: Explains the exchange argument and why lateness is clamped at zero.
hints:
  - The total finishing time of the last job is fixed whatever the order. What should decide which job goes earlier?
  - Take any order where a job with a later due time runs immediately before a job with an earlier due time. What happens to the largest lateness if you swap those two?
  - Sort the job indices by due time, keeping each duration with its own due time, then run them in that order while accumulating the finish time in a 64-bit value and tracking the largest value of finish time minus due time, never letting it go below zero.
followups:
  - Give a counterexample showing that running the shortest job first is not optimal here.
  - Why does ordering by slack, due time minus duration, fail?
  - What if the goal were to minimise the number of late jobs instead of the largest lateness?
  - How would release times, jobs that cannot start before a given moment, change the problem?
common_errors:
  - Sorting by duration (shortest job first), which minimises average completion time but not the largest lateness.
  - Sorting durations and due times independently, breaking the pairing between them.
  - Summing lateness across jobs instead of taking the maximum.
  - Accumulating the finish time in a 32-bit integer.
