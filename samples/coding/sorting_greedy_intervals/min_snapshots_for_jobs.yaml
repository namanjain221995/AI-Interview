expected_concepts:
  - sort jobs by end time
  - place each snapshot at the end of the earliest-ending unrecorded job
  - closed intervals so a shared endpoint is covered by one snapshot
  - exchange argument showing the latest possible snapshot is never worse
  - linear scan after sorting
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Sorts by end time, places each snapshot at the end of the first unrecorded job, argues why delaying the snapshot to that end is optimal, handles closed endpoints and zero-length jobs, and states O(n log n) time.
  good: Reaches the end-time greedy with some prompting and passes the tests, with an informal justification.
  weak: Merges overlapping jobs and counts groups (wrong for chains), sorts by start without tracking the earliest end, or tries every instant.
  criteria:
    correctness: All tests pass, including nested jobs, chains that share endpoints and negative times.
    efficiency: One sort plus a linear scan; no iteration over individual time instants.
    code_quality: The snapshot position and count are tracked with clear names; no special cases beyond the empty list.
    edge_cases: Empty list, zero-length jobs, identical jobs, negative and very large timestamps.
    communication: Explains why the end of the earliest-ending job is the best place for the next snapshot.
hints:
  - Think about the job that finishes first. Some snapshot has to record it, so where within its range should that snapshot go to help as many other jobs as possible?
  - Taking that snapshot as late as allowed, exactly at the end of the earliest-ending job, records every job that has already started by then. Which order of processing makes this easy?
  - Sort the jobs by end time and keep the time of the last snapshot; for each job, if it starts after the last snapshot it is not yet recorded, so take a new snapshot at its end and count it.
followups:
  - Why is merging overlapping jobs and counting the merged groups not correct? Give a counterexample.
  - How would you return the actual snapshot instants as well as the count?
  - If jobs arrived as a stream sorted by start time, could you still compute the answer online?
  - What changes if the ranges were half-open instead of closed?
common_errors:
  - Merging all overlapping jobs and counting the merged groups, which undercounts chains such as [1, 2], [2, 3], [3, 4] where one group needs two snapshots.
  - Using a non-strict comparison so a job starting exactly at the last snapshot is counted again.
  - Sorting by start time and placing snapshots at start times.
  - Initialising the last snapshot to zero, which wrongly treats jobs with negative times as recorded.
