version: 1
slug: min_snapshots_for_jobs
title: Minimum Snapshots to Capture Every Job
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, platform, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Snapshots to Capture Every Job

  A batch platform records each job's lifetime as a **closed** range `[start, end]` in seconds: the job
  is running at every instant from `start` to `end`, **including both endpoints**. For an audit, the
  platform team can trigger cluster snapshots at any integer instant `t`. A snapshot taken at `t`
  records every job with `start <= t <= end`.

  Return the **minimum number of snapshots** needed so that every job is recorded by at least one
  snapshot.

  - The list is not sorted; jobs may share endpoints or be identical.
  - A job with `start == end` runs for a single instant.
  - Return `0` when there are no jobs.

  ### Example 1
  ```
  Input:  jobs = [[10, 16], [2, 8], [1, 6], [7, 12]]
  Output: 2
  Explanation: a snapshot at t = 6 records [2, 8] and [1, 6]; one at t = 12 records [10, 16] and [7, 12].
  ```

  ### Example 2
  ```
  Input:  jobs = [[1, 2], [3, 4], [5, 6], [7, 8]]
  Output: 4
  ```

  ### Example 3
  ```
  Input:  jobs = [[1, 2], [2, 3], [3, 4], [4, 5]]
  Output: 2
  Explanation: snapshots at t = 2 and t = 4; jobs that share an endpoint can be recorded together.
  ```

  ### Constraints
  - `0 <= jobs.length <= 10^4`
  - `jobs[i].length == 2`
  - `-10^9 <= start <= end <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_snapshots_for_jobs
  params:
    - {name: jobs, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_snapshots_for_jobs(jobs: list[list[int]]) -> int:
        snapshots = 0
        last_snapshot = None
        # Delay each snapshot as long as possible: take it when the earliest-ending job ends.
        for start, end in sorted(jobs, key=lambda job: job[1]):
            if last_snapshot is None or start > last_snapshot:
                snapshots += 1
                last_snapshot = end
        return snapshots
  javascript: |
    function minSnapshotsForJobs(jobs) {
      const byEnd = jobs.slice().sort((a, b) => a[1] - b[1]);
      let snapshots = 0;
      let lastSnapshot = -Infinity;
      for (const [start, end] of byEnd) {
        if (start > lastSnapshot) {
          snapshots += 1;
          lastSnapshot = end;
        }
      }
      return snapshots;
    }
