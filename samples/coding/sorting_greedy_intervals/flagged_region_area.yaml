expected_concepts:
  - "sweep line over x with coordinate compression"
  - "counting coverage depth along y within each strip"
  - "threshold on coverage depth instead of a plain union"
  - "64-bit area accumulation"
  - "segment tree with counts as the O(n log n) refinement"
optimal_complexity: {time: "O(n^2 log n)", space: "O(n)"}
rubric:
  excellent: "Compresses the x coordinates into strips, sweeps y events in each strip while tracking coverage depth, adds the length where the depth reaches min_flags times the strip width in 64-bit arithmetic, handles touching edges correctly and discusses a segment-tree refinement."
  good: "Correct compressed-grid or sweep solution (for example O(n^3) over compressed cells) with a clear explanation, possibly after fixing a boundary or overflow slip."
  weak: "Marks unit cells over the raw coordinates, uses pairwise inclusion-exclusion that double counts, solves only the plain union, or overflows 32-bit integers."
  criteria:
    correctness: "All tests pass, including min_flags above the rectangle count, touching edges and nested rectangles."
    efficiency: "Running time depends only on the number of rectangles: O(n^2 log n) sweep (or O(n^3) compressed grid for n up to 200)."
    code_quality: "Strip and event logic are separated; coordinates are compressed rather than iterated."
    edge_cases: "Empty input, identical rectangles, negative coordinates and areas beyond 32 bits."
    communication: "Explains why coverage is constant inside each compressed cell and why pairwise inclusion-exclusion does not generalise."
hints:
  - "Only the x and y values that appear as rectangle edges matter: between consecutive edge values, the number of rectangles covering a point does not change."
  - "Cut the plane into vertical strips at every distinct x edge. Inside one strip, each rectangle that spans it becomes a simple interval on the y axis, and you need the total length covered by enough of those intervals."
  - "For each strip between consecutive distinct x values, collect a start event at y1 and an end event at y2 for every rectangle spanning the strip, sort them, sweep while keeping the current depth, add the distance between consecutive events whenever the depth is at least min_flags, and multiply that length by the strip width using a 64-bit total."
followups:
  - "How would a segment tree that stores coverage counts bring the sweep down to O(n log n)?"
  - "Why does inclusion-exclusion over pairs of rectangles fail for min_flags of 2 or more?"
  - "How would you report the area flagged by exactly min_flags rectangles?"
  - "What changes if rectangles can be rotated?"
common_errors:
  - "Iterating over every unit cell, which is impossible for coordinates up to 10^7."
  - "Adding pairwise overlaps without correcting for regions covered three or more times."
  - "Computing the plain union and ignoring min_flags."
  - "Counting edge-touching rectangles as overlapping."
  - "Accumulating the area in 32-bit integers."
