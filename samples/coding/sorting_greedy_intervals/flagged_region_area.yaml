prompt_markdown: |
  ## Area Confirmed by Multiple Detectors

  Several anomaly detectors scan the same large map tile and each one flags an axis-aligned rectangle
  `rectangles[i] = [x1, y1, x2, y2]`: the region with `x1 <= x <= x2` and `y1 <= y <= y2`, where
  `x1 < x2` and `y1 < y2`. To cut false positives, the review team only investigates ground that is
  flagged by **at least `min_flags`** rectangles at the same time.

  Return the total **area** of the region covered by at least `min_flags` rectangles. Area where
  rectangles merely touch along an edge or at a corner is zero, and overlapping parts are counted once
  (an area covered by five rectangles is still counted once). Return `0` when no region qualifies,
  including when there are no rectangles.

  ### Example 1
  ```
  Input:  rectangles = [[0, 0, 4, 4], [2, 2, 6, 6], [3, 0, 5, 3]], min_flags = 2
  Output: 7
  Explanation: the first two overlap on [2, 4] x [2, 4] (area 4), the first and third on [3, 4] x [0, 3] (area 3)
  and the second and third on [3, 5] x [2, 3] (area 2); the 1 x 1 square [3, 4] x [2, 3] lies in all three,
  so the doubly flagged area is 4 + 3 + 2 - 2 = 7.
  ```

  ### Example 2
  ```
  Input:  rectangles = [[0, 0, 4, 4], [2, 2, 6, 6], [3, 0, 5, 3]], min_flags = 1
  Output: 30
  Explanation: by inclusion-exclusion the union is 16 + 16 + 6 - (4 + 3 + 2) + 1 = 30.
  ```

  ### Constraints
  - `0 <= rectangles.length <= 200`
  - `rectangles[i].length == 4`
  - `-10^7 <= x1 < x2 <= 10^7` and `-10^7 <= y1 < y2 <= 10^7`
  - `1 <= min_flags <= 200`
  - The answer is at most `4 * 10^14`; use a 64-bit result.

  **Follow-up:** the coordinates are far too large to mark unit cells. How do you make the running time depend only on the number of rectangles?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: flagged_region_area
  params:
    - {name: rectangles, type: "int[][]"}
    - {name: min_flags, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def flagged_region_area(rectangles: list[list[int]], min_flags: int) -> int:
        xs = sorted({x for r in rectangles for x in (r[0], r[2])})
        total = 0
        for left, right in zip(xs, xs[1:]):
            # Rectangles spanning this vertical strip, as +1/-1 events along y.
            events = []
            for x1, y1, x2, y2 in rectangles:
                if x1 <= left and right <= x2:
                    events.append((y1, 1))
                    events.append((y2, -1))
            events.sort()
            covered = 0
            depth = 0
            prev_y = 0
            for y, delta in events:
                if depth >= min_flags:
                    covered += y - prev_y
                depth += delta
                prev_y = y
            total += covered * (right - left)
        return total
  javascript: |
    function flaggedRegionArea(rectangles, minFlags) {
      const xs = [...new Set(rectangles.flatMap((r) => [r[0], r[2]]))].sort((a, b) => a - b);
      let total = 0;
      for (let i = 0; i + 1 < xs.length; i++) {
        const left = xs[i];
        const right = xs[i + 1];
        const events = [];
        for (const [x1, y1, x2, y2] of rectangles) {
          if (x1 <= left && right <= x2) {
            events.push([y1, 1], [y2, -1]);
          }
        }
        events.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        let covered = 0;
        let depth = 0;
        let prevY = 0;
        for (const [y, delta] of events) {
          if (depth >= minFlags) covered += y - prevY;
          depth += delta;
          prevY = y;
        }
        total += covered * (right - left);
      }
      return total;
    }
