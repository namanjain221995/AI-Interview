expected_concepts:
  - merging overlapping intervals after sorting by start
  - running maximum of end over preceding rows (window frame)
  - island numbering with a running SUM of block-start flags
  - half-open ranges, touching and empty ranges
  - two-level aggregation (per block, then per machine)
optimal_complexity: {time: "O(n log n) for the per-machine sort", space: O(n)}
rubric:
  excellent: Sorts each machine's ranges by start, compares every start with the running maximum end of all earlier ranges, numbers merged blocks with a running SUM of start flags, and sums MAX(end) - MIN(start) per block, explaining why comparing only with the previous row fails for nested ranges.
  good: Reaches a correct merge after a hint, for example by first using LAG and then switching to a running MAX after the nested case is pointed out.
  weak: Sums the raw range lengths, compares only with the previous row's end, expands ranges into one row per minute, or drops machines that only have empty ranges.
  criteria:
    correctness: All tests pass, including nested ranges, duplicates, touching ranges, empty ranges and very large minute values.
    efficiency: Set-based window functions over a sort; no per-minute expansion and no quadratic self-join.
    code_quality: Named CTEs for the running maximum, block numbering and aggregation, with an explicit window frame.
    edge_cases: Empty table, duplicates, shared start minutes, ranges nested inside an earlier range and machines with zero covered minutes.
    communication: Explains why the running maximum end, not the previous end, decides whether a new block starts.
hints:
  - Think about how you would merge one machine's ranges by hand after sorting them by start, and what you need to remember from the ranges you have already seen.
  - A range starts a new merged block only when its start is after the largest end among all earlier ranges of the same machine, not just the previous row; a window frame ending at 1 PRECEDING can give you that largest end.
  - Compute the running MAX(end_minute) over ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING per machine ordered by start and end, flag rows whose start exceeds it (or where it is NULL), turn the flags into block numbers with a running SUM, then sum MAX(end) - MIN(start) per block for each machine and order by machine.
followups:
  - How would you return the merged busy blocks themselves (machine, block start, block end) instead of totals?
  - How would you compute idle minutes for each machine inside a reporting window such as one shift?
  - Which index supports this query when the table holds a year of ranges for thousands of machines?
  - How would the answer change if ranges were closed (end minute included) instead of half-open?
common_errors:
  - Summing end_minute - start_minute per machine, which counts overlapping minutes several times.
  - Comparing each start with only the previous row's end (LAG), which splits a block when a short nested range ends early.
  - Using a default window frame or RANGE frame so the current row's own end is included in the running maximum.
  - Expanding ranges into one row per minute, which cannot finish for ranges of up to a billion minutes.
  - Filtering out empty ranges before grouping, which drops machines that only have cancelled bookings.
