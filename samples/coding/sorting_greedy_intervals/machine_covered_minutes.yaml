version: 1
slug: machine_covered_minutes
title: Covered Minutes per Machine
difficulty: hard
competency_keys: [sql, databases]
role_tags: [dba, data, sre]
time_limit_minutes: 30
prompt_markdown: |
  ## Covered Minutes per Machine

  A factory's utilisation report needs to know for how many minutes each machine was busy. Several
  systems write busy ranges into table `machine_busy`: production jobs, maintenance holds and
  calibration runs. They do not coordinate, so ranges of one machine can **overlap**, **nest** inside
  each other, **touch** or be **exact duplicates**.

  | column | type | notes |
  |--------|------|-------|
  | machine | VARCHAR(40) | machine name |
  | start_minute | INTEGER | first busy minute |
  | end_minute | INTEGER | first minute after the range; `start_minute <= end_minute` |

  Each row is the **half-open** range `[start_minute, end_minute)`: it covers the minutes
  `start_minute, start_minute + 1, ..., end_minute - 1`. A row with `start_minute = end_minute` is a
  cancelled booking and covers no minute. The table has no primary key.

  For every machine that appears in the table, return:

  - `machine`;
  - `covered_minutes`: the number of distinct minutes covered by **at least one** of the machine's
    ranges. A minute covered by several ranges counts **once**. A machine whose ranges are all empty
    has `covered_minutes = 0`.

  Order the result by `machine` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  machine_busy
  +---------+--------------+------------+
  | machine | start_minute | end_minute |
  +---------+--------------+------------+
  | cnc-a   | 0            | 10         |
  | cnc-a   | 5            | 15         |
  | cnc-a   | 20           | 30         |
  | cnc-a   | 22           | 25         |
  | cnc-b   | 3            | 8          |
  | cnc-b   | 8            | 12         |
  | cnc-c   | 100          | 160        |
  | cnc-c   | 110          | 120        |
  | cnc-c   | 130          | 140        |
  +---------+--------------+------------+

  Output
  +---------+-----------------+
  | machine | covered_minutes |
  +---------+-----------------+
  | cnc-a   | 25              |
  | cnc-b   | 9               |
  | cnc-c   | 60              |
  +---------+-----------------+
  cnc-a is busy during [0, 15) and [20, 30): 15 + 10 = 25 minutes.
  cnc-b's two ranges touch at minute 8 and cover [3, 12): 9 minutes.
  cnc-c's range [100, 160) contains both later ranges, so only its 60 minutes count. Note that
  [130, 140) starts after the previous row ends (120) but is still inside [100, 160).
  ```

  ### Example 2
  ```
  machine_busy
  +---------+--------------+------------+
  | machine | start_minute | end_minute |
  +---------+--------------+------------+
  | press-2 | 40           | 40         |
  | press-1 | 50           | 55         |
  | press-1 | 10           | 20         |
  | press-1 | 15           | 15         |
  | press-1 | 0            | 12         |
  | press-2 | 7            | 7          |
  +---------+--------------+------------+

  Output
  +---------+-----------------+
  | machine | covered_minutes |
  +---------+-----------------+
  | press-1 | 25              |
  | press-2 | 0               |
  +---------+-----------------+
  press-1 covers [0, 20) and [50, 55): 20 + 5 = 25 minutes; the empty range at 15 adds nothing.
  press-2 only has cancelled bookings, so it is returned with 0.
  ```

  ### Constraints
  - `0 <= rows <= 10^5`
  - `0 <= start_minute <= end_minute <= 10^9`
  - Rows are stored in no particular order; several rows of one machine can share a start minute.
  - Expanding ranges into one row per minute is too slow for ranges of up to `10^9` minutes.
languages: [sql]
starter_code:
  sql: |
    -- Return machine and covered_minutes (overlapping minutes counted once), ordered by machine.
    SELECT machine, SUM(end_minute - start_minute) AS covered_minutes
    FROM machine_busy
    GROUP BY machine
    ORDER BY machine;
reference_solutions:
  sql: |
    WITH ordered AS (
      SELECT
        machine,
        start_minute,
        end_minute,
        MAX(end_minute) OVER (
          PARTITION BY machine
          ORDER BY start_minute, end_minute
          ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING
        ) AS prev_max_end
      FROM machine_busy
    ),
    flagged AS (
      SELECT
        machine,
        start_minute,
        end_minute,
        CASE WHEN prev_max_end IS NULL OR start_minute > prev_max_end THEN 1 ELSE 0 END AS new_block
      FROM ordered
    ),
    numbered AS (
      SELECT
        machine,
        start_minute,
        end_minute,
        SUM(new_block) OVER (
          PARTITION BY machine
          ORDER BY start_minute, end_minute
          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
        ) AS block_id
      FROM flagged
    ),
    blocks AS (
      SELECT machine, MAX(end_minute) - MIN(start_minute) AS block_minutes
      FROM numbered
      GROUP BY machine, block_id
    )
    SELECT machine, SUM(block_minutes) AS covered_minutes
    FROM blocks
    GROUP BY machine
    ORDER BY machine;
sql_setup: |
  CREATE TABLE machine_busy (
    machine VARCHAR(40) NOT NULL,
    start_minute INTEGER NOT NULL,
    end_minute INTEGER NOT NULL,
    CHECK (start_minute <= end_minute)
  );
tests:
  - id: t1
    description: "Example 1 - overlap, touching ranges and nested ranges"
    ordered: true
    setup_sql: |
      INSERT INTO machine_busy (machine, start_minute, end_minute) VALUES
        ('cnc-a', 0, 10), ('cnc-a', 5, 15), ('cnc-a', 20, 30), ('cnc-a', 22, 25),
        ('cnc-b', 3, 8), ('cnc-b', 8, 12),
        ('cnc-c', 100, 160), ('cnc-c', 110, 120), ('cnc-c', 130, 140);
    expected_rows: [["cnc-a", 25], ["cnc-b", 9], ["cnc-c", 60]]
  - id: t2
    description: "Example 2 - unordered rows, empty ranges, machine with only empty ranges returns 0"
    ordered: true
