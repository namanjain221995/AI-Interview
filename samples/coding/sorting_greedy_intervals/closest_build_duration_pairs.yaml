expected_concepts:
  - "sort so the closest values become neighbours"
  - "single pass tracking the running minimum gap"
  - "reset the result list when a smaller gap appears"
  - "output ordering follows from the sorted scan"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Observes that after sorting the minimum difference must be between neighbours, collects pairs in one pass (resetting when a smaller gap appears) and explains why the output is already ordered."
  good: "Uses sorting with two passes (find minimum, then collect) or needs a prompt about resetting the result list."
  weak: "Compares all pairs in O(n^2), forgets to reset the result when a smaller gap appears, or orders pairs incorrectly."
  criteria:
    correctness: "All tests pass, including ties, overlapping pairs and empty input."
    efficiency: "One sort and one or two linear scans."
    code_quality: "Clear running-minimum logic without sentinels that can overflow; sorted copy instead of mutating the input."
    edge_cases: "Fewer than two durations, two durations, values near the upper limit."
    communication: "Justifies why non-neighbouring values can never be the closest pair once sorted."
hints:
  - "If the durations were in increasing order, which pairs could possibly be the closest?"
  - "After sorting, only neighbouring values need to be compared; think about how to track the smallest gap and the pairs that reach it in the same scan."
  - "Sort, then walk neighbouring pairs once: when a gap is smaller than the best so far, replace the collected pairs with just this one; when it equals the best, append it. The scan order already gives pairs sorted by their smaller value."
followups:
  - "How would the answer change if durations could repeat?"
  - "How would you return the k closest pairs instead of only the minimum-gap pairs?"
  - "Could you avoid the full sort if the durations were bounded to a small range?"
  - "How would you maintain the closest pair as new durations arrive one by one?"
common_errors:
  - "Checking all pairs with nested loops instead of sorting."
  - "Not clearing earlier pairs when a strictly smaller gap is found."
  - "Returning pairs as [larger, smaller] or in unsorted order."
  - "Crashing on an empty list or a single duration."
