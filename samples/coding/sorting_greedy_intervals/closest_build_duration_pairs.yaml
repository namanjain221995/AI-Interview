slug: closest_build_duration_pairs
title: Closest Build Duration Pairs
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Closest Build Duration Pairs

  A build-performance report wants to highlight builds whose durations are suspiciously close, which
  often means two pipelines share a cached step. You are given the durations (in seconds) of a set of
  builds; all durations are **distinct**.

  Find the smallest absolute difference between any two durations and return **every** pair
  `[a, b]` with `a < b` whose difference equals that minimum. Order the pairs by `a` ascending.
  Return an empty list when fewer than two durations are given.

  ### Example 1
  ```
  Input:  durations = [42, 17, 30, 25]
  Output: [[25, 30]]
  Explanation: Sorted: 17, 25, 30, 42. Neighbouring differences are 8, 5 and 12, so the minimum is 5.
  ```

  ### Example 2
  ```
  Input:  durations = [5, 9, 1, 13]
  Output: [[1, 5], [5, 9], [9, 13]]
  Explanation: Every neighbouring difference is 4, so all three pairs are reported.
  ```

  ### Constraints
  - `0 <= durations.length <= 10^5`
  - `1 <= durations[i] <= 10^9`
  - All values in `durations` are distinct
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: closest_build_duration_pairs
  params:
    - {name: durations, type: "int[]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def closest_build_duration_pairs(durations: list[int]) -> list[list[int]]:
        ordered = sorted(durations)
        best = None
        pairs: list[list[int]] = []
        for a, b in zip(ordered, ordered[1:]):
            gap = b - a
            if best is None or gap < best:
                best = gap
                pairs = [[a, b]]
            elif gap == best:
                pairs.append([a, b])
        return pairs
  javascript: |
    function closestBuildDurationPairs(durations) {
      const ordered = [...durations].sort((a, b) => a - b);
      let best = Infinity;
      let pairs = [];
      for (let i = 1; i < ordered.length; i++) {
        const gap = ordered[i] - ordered[i - 1];
        if (gap < best) {
          best = gap;
          pairs = [[ordered[i - 1], ordered[i]]];
        } else if (gap === best) {
          pairs.push([ordered[i - 1], ordered[i]]);
        }
      }
      return pairs;
    }
