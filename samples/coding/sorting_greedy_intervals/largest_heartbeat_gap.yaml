version: 1
slug: largest_heartbeat_gap
title: Longest Heartbeat Silence
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Longest Heartbeat Silence

  A monitoring agent sends a heartbeat to the control plane every few seconds. For an incident review
  you are given the heartbeat timestamps (in seconds) that the control plane recorded during the
  observation window `[window_start, window_end]`. Because of retries and batching, the timestamps
  arrive **unsorted** and may contain **duplicates**. Every timestamp lies inside the window.

  Return the length of the **longest silence** in the window: the largest difference between two
  consecutive moments in the sorted sequence made of `window_start`, all heartbeat timestamps and
  `window_end`. In other words, the silence before the first heartbeat and after the last heartbeat
  count as well. If there are no heartbeats, the whole window is silent.

  ### Example 1
  ```
  Input:  timestamps = [130, 104, 110, 135], window_start = 100, window_end = 140
  Output: 20
  Explanation: Sorted: 100, 104, 110, 130, 135, 140 (window bounds included). The longest silence is 110 to 130.
  ```

  ### Example 2
  ```
  Input:  timestamps = [], window_start = 0, window_end = 60
  Output: 60
  Explanation: No heartbeats at all, so the silence spans the whole window.
  ```

  ### Example 3
  ```
  Input:  timestamps = [10, 20, 10, 15], window_start = 0, window_end = 100
  Output: 80
  Explanation: The agent stopped reporting at 20; the silence from 20 to the end of the window is 80 seconds.
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `0 <= window_start <= window_end <= 10^9`
  - `window_start <= timestamps[i] <= window_end`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: largest_heartbeat_gap
  params:
    - {name: timestamps, type: "int[]"}
    - {name: window_start, type: "int"}
    - {name: window_end, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def largest_heartbeat_gap(timestamps: list[int], window_start: int, window_end: int) -> int:
        longest = 0
        previous = window_start
        for moment in sorted(timestamps) + [window_end]:
            longest = max(longest, moment - previous)
            previous = moment
        return longest
  javascript: |
    function largestHeartbeatGap(timestamps, windowStart, windowEnd) {
      const sorted = [...timestamps].sort((a, b) => a - b);
      sorted.push(windowEnd);
      let longest = 0;
      let previous = windowStart;
      for (const moment of sorted) {
        longest = Math.max(longest, moment - previous);
        previous = moment;
      }
      return longest;
    }
