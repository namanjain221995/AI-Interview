expected_concepts:
  - "sort timestamps before measuring neighbouring differences"
  - "include the window boundaries as sentinels"
  - "duplicates produce zero-length gaps"
  - "single linear scan after sorting"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts the timestamps, treats the window bounds as sentinels so the edges need no special case, handles duplicates naturally and states O(n log n), optionally mentioning a bucket-based linear approach."
  good: "Sorts and scans correctly but handles the window edges with separate special cases or needs a prompt about one of them."
  weak: "Forgets the silence before the first or after the last heartbeat, does not sort, or mishandles the empty list."
  criteria:
    correctness: "All tests pass, including empty input, zero-length windows and edge silences."
    efficiency: "Sorting followed by a single pass; no pairwise comparison of all timestamps."
    code_quality: "Sentinel-based loop or clearly named edge cases; input not mutated unexpectedly."
    edge_cases: "No heartbeats, heartbeats exactly on the bounds, duplicates and large timestamps."
    communication: "Explains why only neighbours in sorted order can form the longest silence."
hints:
  - "Silences are measured between moments that are next to each other in time, so think about putting the timestamps in order first."
  - "The window start and window end behave like extra moments: the agent was silent from the start until its first heartbeat and from its last heartbeat until the end."
  - "Sort the timestamps, then scan them once while remembering the previous moment, starting the previous moment at the window start and finishing with the window end, and keep the largest difference you see."
followups:
  - "How would you report where the longest silence starts, not just its length?"
  - "Can you find the answer without a comparison sort, for example by bucketing the window?"
  - "How would you list every silence longer than a threshold such as 30 seconds?"
  - "What changes if heartbeats arrive as an endless stream and you must alert in real time?"
common_errors:
  - "Ignoring the silence before the first heartbeat or after the last heartbeat."
  - "Measuring differences in input order without sorting."
  - "Crashing or returning 0 when there are no heartbeats instead of the window length."
  - "Removing duplicates incorrectly or treating them as an error."
