expected_concepts:
  - greedy choice of change (use the 10 before three 5s)
  - counting coins instead of storing them
  - single pass simulation
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Simulates in one pass with two counters, follows the 10-and-5-first rule for a 20, returns the first failing index, and explains why that rule keeps the kiosk able to serve more drivers."
  good: "Correct simulation with counters after a small slip such as returning a boolean or forgetting that 20 coins are never used."
  weak: "Tracks only the total amount of money held, ignores the coin mix, or always uses three 5s first."
  criteria:
    correctness: "All tests pass, including empty input, failure on the first driver and the 10-before-5s preference."
    efficiency: "Linear time with constant extra space; no list of coins is stored."
    code_quality: "Clear counter names and early return at the failing driver."
    edge_cases: "Empty queue, first coin 10 or 20, having enough money but the wrong coins."
    communication: "Explains why the total amount held is not enough to decide whether change is possible."
hints:
  - "The amount of money in the kiosk does not tell you whether change is possible - which coins does it actually need to keep track of?"
  - "A 20 coin is never given back, so counting how many 5 and 10 coins the kiosk holds is enough; update the counts as each driver pays."
  - "Walk the queue once with counters for 5 and 10 coins: a 5 adds a five, a 10 needs a five, and a 20 takes a ten plus a five if both exist, otherwise three fives; the first driver where the needed coins are missing is the answer."
followups:
  - "Show a queue where paying 15 with three 5 coins first would fail a driver that the stated rule serves."
  - "How would the simulation change if tickets cost a configurable price and coin values were arbitrary?"
  - "If the kiosk could reorder the queue, how would you decide whether everyone can be served?"
common_errors:
  - "Tracking only the total cash held, which says change is possible when the coins are the wrong denomination."
  - "Giving three 5 coins for a 20 even when a 10 is available, which is not the stated rule."
  - "Adding 20 coins to the change pool."
  - "Returning a 1-based index or the number of drivers served instead of the 0-based index of the failing driver."
