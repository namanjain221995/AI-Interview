prompt_markdown: |
  ## Parking Kiosk Change

  A self-service parking kiosk sells single-entry tickets that cost **5 units**. Drivers are served in
  queue order and each driver pays with exactly **one coin** worth `5`, `10` or `20` units. The kiosk
  starts the day with **no coins**; every coin a driver inserts is kept and can be handed out as change to
  later drivers.

  Change rules:

  - A `5` coin needs no change.
  - A `10` coin needs one `5` coin back.
  - A `20` coin needs `15` back. The kiosk pays it with one `10` coin and one `5` coin when it holds both;
    otherwise it uses three `5` coins.
  - `20` coins are never handed out as change.

  The kiosk stops at the first driver it cannot give exact change to. Return that driver's **0-based
  index** in `payments`, or `-1` if every driver is served.

  ### Example 1
  ```
  Input:  payments = [5, 5, 10, 20]
  Output: -1
  Explanation: after two 5 coins, the 10 gets one 5 back and the 20 gets the 10 and the last 5.
  ```

  ### Example 2
  ```
  Input:  payments = [5, 10, 10, 5]
  Output: 2
  Explanation: after the second driver the kiosk holds a 10 coin but no 5 coin, so driver 2 cannot get change.
  ```

  ### Example 3
  ```
  Input:  payments = [20]
  Output: 0
  ```

  ### Constraints
  - `0 <= payments.length <= 10^5`
  - Every `payments[i]` is `5`, `10` or `20`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: parking_kiosk_change
  params:
    - {name: payments, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def parking_kiosk_change(payments: list[int]) -> int:
        fives = tens = 0
        for i, coin in enumerate(payments):
            if coin == 5:
                fives += 1
            elif coin == 10:
                if fives == 0:
                    return i
                fives -= 1
                tens += 1
            else:
                if tens > 0 and fives > 0:
                    tens -= 1
                    fives -= 1
                elif fives >= 3:
                    fives -= 3
                else:
                    return i
        return -1
  javascript: |
    function parkingKioskChange(payments) {
      let fives = 0;
      let tens = 0;
      for (let i = 0; i < payments.length; i++) {
        const coin = payments[i];
        if (coin === 5) {
          fives++;
        } else if (coin === 10) {
          if (fives === 0) return i;
          fives--;
          tens++;
        } else if (tens > 0 && fives > 0) {
          tens--;
          fives--;
        } else if (fives >= 3) {
          fives -= 3;
        } else {
          return i;
        }
      }
      return -1;
    }
