prompt_markdown: |
  ## Maximum Maintenance Jobs by Deadline

  An SRE team has a single on-call engineer for a block of planned maintenance. The backlog lists
  jobs as `jobs[i] = [duration, deadline]`: job `i` takes `duration` hours of uninterrupted work and is
  only worth doing if it is **finished at or before** hour `deadline`.

  The engineer starts at hour `0`, works on one job at a time, never pauses a job once started, and may
  skip any job entirely. Jobs can be done in any order, and there is no idle time needed between jobs.

  Return the **maximum number of jobs** that can be finished on time.

  ### Example 1
  ```
  Input:  jobs = [[3, 5], [2, 4], [4, 9], [1, 6]]
  Output: 3
  Explanation: the four jobs need 10 hours but the latest deadline is hour 9. Doing [2, 4], [3, 5] and
  [1, 6] finishes at hours 2, 5 and 6.
  ```

  ### Example 2
  ```
  Input:  jobs = [[5, 3], [2, 2]]
  Output: 1
  Explanation: [5, 3] cannot finish by hour 3 even on its own; [2, 2] finishes exactly at hour 2.
  ```

  ### Constraints
  - `1 <= jobs.length <= 10^4`
  - `1 <= duration, deadline <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
