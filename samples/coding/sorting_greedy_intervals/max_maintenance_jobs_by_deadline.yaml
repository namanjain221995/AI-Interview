  return_type: int
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def max_maintenance_jobs_by_deadline(jobs: list[list[int]]) -> int:
        chosen: list[int] = []  # max-heap (negated) of durations of the jobs kept so far
        elapsed = 0
        for duration, deadline in sorted(jobs, key=lambda job: job[1]):
            heapq.heappush(chosen, -duration)
            elapsed += duration
            if elapsed > deadline:
                elapsed += heapq.heappop(chosen)  # drop the longest kept job
        return len(chosen)
  javascript: |
    function maxMaintenanceJobsByDeadline(jobs) {
      const order = jobs.slice().sort((a, b) => a[1] - b[1]);
      const heap = [];
      const push = (value) => {
        heap.push(value);
        let i = heap.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (heap[parent] >= heap[i]) break;
          [heap[parent], heap[i]] = [heap[i], heap[parent]];
          i = parent;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const left = 2 * i + 1;
            const right = left + 1;
            let largest = i;
            if (left < heap.length && heap[left] > heap[largest]) largest = left;
            if (right < heap.length && heap[right] > heap[largest]) largest = right;
            if (largest === i) break;
            [heap[largest], heap[i]] = [heap[i], heap[largest]];
            i = largest;
          }
        }
        return top;
      };
      let elapsed = 0;
      for (const [duration, deadline] of order) {
        push(duration);
        elapsed += duration;
        if (elapsed > deadline) elapsed -= pop();
      }
      return heap.length;
    }
