expected_concepts:
  - "processing jobs in order of deadline"
  - "max-heap of durations of the jobs kept so far"
  - "replacing the longest kept job when the schedule overflows"
  - "exchange argument: any feasible set can run in deadline order"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by deadline, keeps a max-heap of chosen durations, drops the longest job whenever the running total passes the current deadline, and argues why deadline order and the swap keep the schedule optimal."
  good: "Reaches the deadline-sorted greedy with replacement after a hint, or gives a correct dynamic programme over time with clear complexity."
  weak: "Uses earliest-deadline-first without replacement, shortest-job-first alone, or tries every subset."
  criteria:
    correctness: "All tests pass, including the swap trap, equal deadlines and jobs longer than their deadline."
    efficiency: "O(n log n) with a heap; no search over subsets or orders."
    code_quality: "A single pass with a clear running total and a heap of kept durations."
    edge_cases: "Single jobs, jobs finishing exactly on their deadline, duplicates and maximum values."
    communication: "Explains why dropping the longest job keeps the most room for later jobs without reducing the count."
hints:
  - "If a set of jobs can all be finished on time, they can always be finished by doing them in order of deadline, so think about processing jobs in that order."
  - "Taking every job that fits in deadline order is not enough; when a new job makes the schedule late, giving up one already chosen job can leave more room for later ones."
  - "Sort by deadline, add each job to a max-heap of durations and to a running total, and whenever the total exceeds the current deadline remove the longest duration from the heap and the total; the heap size at the end is the answer."
followups:
  - "How would you return which jobs to run and in what order?"
  - "What changes if each job also has a value and you maximise total value instead of count?"
  - "How would the answer change with two engineers working in parallel?"
  - "Why is it safe to drop the longest job rather than the one that was just added?"
common_errors:
  - "Taking jobs in deadline order and skipping any job that does not fit, without considering a swap."
  - "Sorting by duration only, which ignores tight deadlines."
  - "Treating a job that finishes exactly at its deadline as late."
  - "Removing the newest job instead of the longest kept job when the schedule overflows."
