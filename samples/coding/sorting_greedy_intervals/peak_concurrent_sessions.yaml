prompt_markdown: |
  ## Peak Concurrent Sessions

  A capacity-planning job reads one day of login sessions for a service. Session `i` is
  `sessions[i] = [login, logout]`, in seconds since the start of the log, and is active over the
  **half-open** range `[login, logout)`: it is active at second `login` and no longer active at second
  `logout`. A session that ends at second `t` and another that starts at second `t` are therefore never
  active together. The list is in no particular order.

  Return `[peak, peak_seconds]`, where:

  - `peak` is the largest number of sessions that are active at the same time, and
  - `peak_seconds` is the **total** number of seconds, summed over every stretch of the log, during which
    exactly `peak` sessions are active.

  ### Example 1
  ```
  Input:  sessions = [[1, 5], [2, 6], [4, 9], [8, 10]]
  Output: [3, 1]
  Explanation: three sessions are active only during [4, 5), which lasts 1 second.
  ```

  ### Example 2
  ```
  Input:  sessions = [[0, 10], [10, 20], [5, 15]]
  Output: [2, 10]
  Explanation: [0, 10) ends exactly when [10, 20) starts, so at most 2 sessions overlap.
               Two are active during [5, 10) and [10, 15): 5 + 5 = 10 seconds.
  ```

  ### Constraints
  - `1 <= sessions.length <= 10^5`
  - `0 <= login < logout <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
