  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def peak_concurrent_sessions(sessions: list[list[int]]) -> list[int]:
        changes: dict[int, int] = {}
        for login, logout in sessions:
            changes[login] = changes.get(login, 0) + 1
            changes[logout] = changes.get(logout, 0) - 1
        times = sorted(changes)
        active = 0
        peak = 0
        peak_seconds = 0
        for k in range(len(times) - 1):
            active += changes[times[k]]
            length = times[k + 1] - times[k]
            if active > peak:
                peak, peak_seconds = active, length
            elif active == peak:
                peak_seconds += length
        return [peak, peak_seconds]
  javascript: |
    function peakConcurrentSessions(sessions) {
      const changes = new Map();
      for (const [login, logout] of sessions) {
        changes.set(login, (changes.get(login) || 0) + 1);
        changes.set(logout, (changes.get(logout) || 0) - 1);
      }
      const times = [...changes.keys()].sort((a, b) => a - b);
      let active = 0;
      let peak = 0;
      let peakSeconds = 0;
      for (let k = 0; k + 1 < times.length; k++) {
        active += changes.get(times[k]);
        const length = times[k + 1] - times[k];
        if (active > peak) {
          peak = active;
          peakSeconds = length;
        } else if (active === peak) {
          peakSeconds += length;
        }
      }
      return [peak, peakSeconds];
    }
