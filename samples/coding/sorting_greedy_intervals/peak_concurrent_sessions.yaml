expected_concepts:
  - sweep line over start and end events
  - half-open interval semantics at equal timestamps
  - accumulating durations between consecutive event times
  - sorting events or using a difference map
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Builds +1/-1 events, sorts by time with logouts applied before or together with logins at the same second, tracks the active count between consecutive event times, and sums the lengths at the peak while resetting when a higher peak appears."
  good: "Correct sweep for the peak but needs help with the duration bookkeeping or the tie at equal timestamps."
  weak: "Checks every pair of sessions or every second of the day, or counts a session ending at t as overlapping one starting at t."
  criteria:
    correctness: "All tests pass, including back-to-back sessions, identical sessions and peaks that occur in several stretches."
    efficiency: "O(n log n) sort-based sweep; no iteration over individual seconds."
    code_quality: "Events and running counters are clearly named; the duration is added for the gap after processing all events at a time."
    edge_cases: "Single session, equal start and end times across sessions, very large timestamps."
    communication: "Explains how equal timestamps are handled and why the duration reset is needed when the peak grows."
hints:
  - "The number of active sessions only changes at login and logout times - think about those moments rather than every second."
  - "Turn each session into a +1 at login and a -1 at logout, process the times in increasing order, and make sure all changes at one second are applied before you look at the count; the count then holds until the next event time."
  - "After applying the changes at time t, the count stays constant until the next event time t2, so that stretch lasts t2 - t seconds: if the count beats the best so far, reset the total to that length, and if it equals the best, add the length."
followups:
  - "How would you return the list of stretches at peak concurrency rather than their total length?"
  - "If sessions arrive as a live stream, how would you maintain the current concurrency and alert when it exceeds a limit?"
  - "How would you compute the minimum number of servers if each server can hold at most k sessions?"
common_errors:
  - "Sorting logins before logouts at the same time, which counts back-to-back sessions as concurrent."
  - "Adding the stretch length before applying all events at that time, which credits the wrong count."
  - "Not resetting the accumulated duration when a new, higher peak is found."
  - "Looping over every second between the first login and the last logout."
