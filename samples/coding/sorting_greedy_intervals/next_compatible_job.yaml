version: 1
slug: next_compatible_job
title: Next Compatible Job
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Next Compatible Job

  A batch scheduler keeps a list of jobs, where `jobs[i] = [start, end]` with `start <= end` gives the
  time a job is booked to begin and finish. **No two jobs share the same start time**, and the list is in
  no particular order.

  To chain work on a single machine, the scheduler wants to know, for every job, which job could run
  **next** on the same machine: the job whose start time is the **smallest start that is greater than or
  equal to** this job's end time. A job may be its own next job when its start equals its end.

  Return an array `next` where `next[i]` is the index (into the original `jobs` list) of that job, or
  `-1` if no job starts at or after job `i` ends.

  ### Example 1
  ```
  Input:  jobs = [[2, 5], [6, 9], [5, 7], [10, 12]]
  Output: [2, 3, 3, -1]
  Explanation: Job 0 ends at 5 and job 2 starts exactly at 5. Jobs 1 and 2 end at 9 and 7; the first start at or
               after either is 10 (job 3). Nothing starts at or after 12.
  ```

  ### Example 2
  ```
  Input:  jobs = [[3, 3], [1, 2]]
  Output: [0, 0]
  Explanation: Job 0 ends at 3 and itself starts at 3. Job 1 ends at 2 and the smallest start at or after 2 is 3.
  ```

  ### Example 3
  ```
  Input:  jobs = [[7, 10]]
  Output: [-1]
  ```

  ### Constraints
  - `0 <= jobs.length <= 10^5`
  - `jobs[i].length == 2`
  - `-10^9 <= start <= end <= 10^9`
  - All start times are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: next_compatible_job
  params:
    - {name: jobs, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left


    def next_compatible_job(jobs: list[list[int]]) -> list[int]:
        by_start = sorted(range(len(jobs)), key=lambda i: jobs[i][0])
        starts = [jobs[i][0] for i in by_start]
        result = []
        for _, end in jobs:
            pos = bisect_left(starts, end)
            result.append(by_start[pos] if pos < len(starts) else -1)
        return result
  javascript: |
    function nextCompatibleJob(jobs) {
      const byStart = jobs.map((_, i) => i).sort((a, b) => jobs[a][0] - jobs[b][0]);
      const starts = byStart.map((i) => jobs[i][0]);
      return jobs.map(([, end]) => {
        let lo = 0;
        let hi = starts.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (starts[mid] < end) lo = mid + 1;
          else hi = mid;
        }
        return lo < starts.length ? byStart[lo] : -1;
      });
    }
