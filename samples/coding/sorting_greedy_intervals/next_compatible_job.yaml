expected_concepts:
  - sorting start times while remembering original indices
  - binary search for the first start greater than or equal to an end (lower bound)
  - mapping a sorted position back to the original index
  - inclusive comparison allowing a job to point to itself
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts (start, index) pairs, runs a lower-bound binary search for each end, maps positions back to original indices, handles self-references and -1, and states O(n log n)."
  good: "Correct sort plus binary search, or a two-pointer sweep over jobs sorted by end and by start, after minor fixes."
  weak: "O(n^2) scan for every job, returns positions in the sorted order instead of original indices, or uses a strict comparison so equal start and end are missed."
  criteria:
    correctness: "All tests pass, including zero-length jobs, unsorted input and the empty list."
    efficiency: "One sort plus n binary searches."
    code_quality: "Binary search is clearly a lower bound; index mapping is explicit."
    edge_cases: "Empty input, a single job, negative and extreme times, nested jobs."
    communication: "Explains why distinct starts make the answer unique and what the lower bound returns when no start qualifies."
hints:
  - "For each job you need a fast way to find the first start time at or after a given value. What would make that lookup cheap?"
  - "Sort the start times once, but keep each start paired with its original index so you can report the right job afterwards."
  - "Build a list of (start, original index) sorted by start; for every job run a lower-bound binary search for its end, and return the paired index if the position is inside the list or -1 if it falls off the end."
followups:
  - "How would you solve it in a single sweep if jobs were also sorted by end?"
  - "What changes if start times may repeat and ties should pick the smallest index?"
  - "How would you count, for each job, how many jobs start after it ends?"
common_errors:
  - "Returning the position in the sorted array instead of the original index."
  - "Using a strict greater-than comparison so a start equal to the end is missed."
  - "Sorting the jobs in place and losing the original order of the output."
  - "Off-by-one in the binary search when every start is smaller than the end."
