slug: min_cron_spacing
title: "Minimum Spacing Between Cron Jobs"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [devops, sre, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Minimum Spacing Between Cron Jobs

  A platform team wants to know how tightly its daily batch jobs are packed. Each job fires once a
  day at a time written as `"HH:MM"` in 24-hour format. Several jobs may fire at the same time.

  Return the **smallest number of minutes** between the firing times of any two jobs. The schedule
  repeats every day, so the gap may wrap past midnight: `"23:50"` and `"00:05"` are 15 minutes apart.

  ### Example 1
  ```
  Input:  times = ["09:15", "23:50", "00:05", "12:00"]
  Output: 15
  Explanation: 23:50 to 00:05 wraps past midnight: 15 minutes.
  ```

  ### Example 2
  ```
  Input:  times = ["06:30", "18:30"]
  Output: 720
  ```

  ### Example 3
  ```
  Input:  times = ["04:00", "13:45", "04:00"]
  Output: 0
  Explanation: Two jobs fire at 04:00.
  ```

  ### Constraints
  - `2 <= times.length <= 2 * 10^4`
  - every entry has the form `"HH:MM"` with `00 <= HH <= 23` and `00 <= MM <= 59`

  **Follow-up:** there are only 1440 minutes in a day; can you avoid a comparison sort?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_cron_spacing
  params:
    - {name: times, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_cron_spacing(times: list[str]) -> int:
        minutes = sorted(int(t[:2]) * 60 + int(t[3:]) for t in times)
        best = minutes[0] + 1440 - minutes[-1]
        for previous, current in zip(minutes, minutes[1:]):
            best = min(best, current - previous)
        return best
  javascript: |
    function minCronSpacing(times) {
      const minutes = times
        .map((t) => Number(t.slice(0, 2)) * 60 + Number(t.slice(3)))
        .sort((a, b) => a - b);
      let best = minutes[0] + 1440 - minutes[minutes.length - 1];
      for (let i = 1; i < minutes.length; i++) {
        best = Math.min(best, minutes[i] - minutes[i - 1]);
      }
      return best;
    }
