expected_concepts:
  - "convert HH:MM to minutes since midnight"
  - "sort and compare adjacent values only"
  - "wrap-around gap between the last and first time"
  - "counting sort or pigeonhole over 1440 minutes"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Converts to minutes, sorts, checks adjacent gaps plus the wrap gap, and notes the 1440-bucket linear variant and the early exit when there are more than 1440 entries."
  good: "Correct sorted adjacent-gap solution including the wrap gap."
  weak: "Compares all pairs, forgets the midnight wrap, or compares the strings directly as if they were numbers."
  criteria:
    correctness: "All tests pass, including midnight wrap and duplicate times."
    efficiency: "O(n log n) with sorting or O(n + 1440) with buckets; no all-pairs comparison."
    code_quality: "A small parsing step, clear conversion constant for minutes per day and one loop over neighbours."
    edge_cases: "Duplicates, 00:00 and 23:59, exactly two entries and evenly spaced schedules."
    communication: "Explains why only neighbours in sorted order and the wrap pair can be closest."
hints:
  - "Turn each time into a single number of minutes since midnight so the times are easy to compare."
  - "Once the values are sorted, the closest pair must be neighbours, except for one extra pair that crosses midnight."
  - "Sort the minute values, take the smallest difference between consecutive values and also compare it with the first value plus 1440 minus the last value."
followups:
  - "How would you solve this in linear time using the fact that a day has 1440 minutes?"
  - "What if jobs could also run on a weekly schedule with a day-of-week field?"
  - "How would you find the largest gap so you could slot in a new maintenance job?"
common_errors:
  - "Forgetting the gap between the last time of the day and the first time after midnight."
  - "Parsing hours and minutes but combining them as hours times 100 plus minutes."
  - "Comparing every pair, which is quadratic for large schedules."
