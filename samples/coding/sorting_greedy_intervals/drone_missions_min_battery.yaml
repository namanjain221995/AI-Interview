expected_concepts:
  - "greedy ordering by safety margin (required minus consumption)"
  - "exchange argument comparing two adjacent missions"
  - "computing the needed start as the maximum of prefix consumption plus requirement"
  - "building the answer backwards from the last mission"
  - "binary search on the starting charge as an alternative O(n log V) approach"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Identifies that missions with the largest margin (required minus consumption) should fly first, proves it with an adjacent-swap exchange argument, computes the answer in one pass (forwards with prefix sums or backwards with a running maximum) and states O(n log n)."
  good: "Finds the correct ordering by testing small cases or reaches a correct binary-search-plus-simulation solution, with a partial justification."
  weak: "Sorts by required or by consumption alone, simulates only one fixed order, or tries all permutations."
  criteria:
    correctness: "All tests pass, including equal requirements with different consumptions and zero-margin missions."
    efficiency: "One sort plus a linear pass; a binary search on the answer with an O(n) check is acceptable."
    code_quality: "The sort key is explicit and the running computation is short and well named."
    edge_cases: "Single mission, identical missions, zero margins and maximum values."
    communication: "Explains the exchange argument: swapping two adjacent missions into margin order never increases the needed start."
hints:
  - "For a fixed order, the needed starting charge is easy to compute. The real question is which order to fly, so compare what happens when two neighbouring missions are swapped."
  - "For two neighbouring missions, the one that leaves more slack between what it requires and what it consumes should usually go first; work out the needed charge for both orders to confirm."
  - "Sort the missions by required minus consumption; flying the largest margin first is optimal. You can compute the answer backwards by walking from the smallest margin up and keeping the charge needed for the remaining suffix as the larger of that charge plus the current consumption and the current requirement."
followups:
  - "Prove with an exchange argument that sorting by margin is optimal."
  - "How would a binary search on the starting charge work, and what would its complexity be?"
  - "If some missions were optional with a reward each, how would the problem change?"
  - "What if the drone could recharge once at a fixed point in the sequence?"
common_errors:
  - "Sorting by required descending, which fails when two missions have the same requirement but different consumption."
  - "Sorting by consumption, which ignores the safety margin entirely."
  - "Returning the total consumption or the maximum requirement instead of combining them."
  - "Checking the requirement after subtracting the consumption instead of before starting the mission."
  - "Enumerating permutations, which is infeasible beyond a handful of missions."
