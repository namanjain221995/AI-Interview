prompt_markdown: |
  ## Survey Drone Starting Charge

  A survey drone must fly a list of missions on a single battery charge before it returns to base.
  Mission `i` is `missions[i] = [consumption, required]`:

  - the drone may **start** mission `i` only if its remaining charge is **at least** `required`
    (a safety margin for wind and the return leg), and
  - completing the mission drains exactly `consumption` units, where `consumption <= required`.

  The drone flies every mission exactly once, one after another, and the operator may choose **any
  order**. There is no recharging in between. Return the **minimum starting charge** that makes it
  possible to complete all missions in some order.

  ### Example 1
  ```
  Input:  missions = [[2, 4], [3, 5], [5, 9]]
  Output: 12
  Explanation: start with 12 and fly [5, 9], [3, 5], [2, 4]: the charge before each mission is 12, 7 and 4,
  which meets the requirements 9, 5 and 4. With 11, whichever mission follows [5, 9] leaves too little for the last one.
  ```

  ### Example 2
  ```
  Input:  missions = [[1, 3], [2, 4], [10, 11], [10, 12], [10, 13]]
  Output: 34
  Explanation: fly [10, 13], [10, 12], [2, 4], [1, 3], [10, 11]: the charge before each mission is 34, 24, 14, 12 and 11,
  so the last mission starts with exactly the 11 it requires.
  ```

  ### Constraints
  - `1 <= missions.length <= 10^5`
  - `missions[i].length == 2`
  - `1 <= consumption <= required <= 10^4`
  - Return the answer as a 64-bit integer.

  **Follow-up:** trying every order is factorial. Can you find the answer in `O(n log n)` and prove the order you use is optimal?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: drone_missions_min_battery
  params:
    - {name: missions, type: "int[][]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def drone_missions_min_battery(missions: list[list[int]]) -> int:
        # Build the answer backwards: missions with the smallest safety margin fly last.
        charge = 0
        for consumption, required in sorted(missions, key=lambda m: m[1] - m[0]):
            charge = max(charge + consumption, required)
        return charge
  javascript: |
    function droneMissionsMinBattery(missions) {
      const ordered = [...missions].sort((a, b) => (a[1] - a[0]) - (b[1] - b[0]));
      let charge = 0;
      for (const [consumption, required] of ordered) {
        charge = Math.max(charge + consumption, required);
      }
      return charge;
    }
