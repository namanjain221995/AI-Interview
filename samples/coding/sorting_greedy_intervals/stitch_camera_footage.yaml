title: "Stitch Camera Footage for a Shift"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [security, general, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Stitch Camera Footage for a Shift

  An incident review needs uninterrupted footage of a security shift that runs from second `0` to second
  `shift_length`. Several cameras and recorders produced clips: clip `i` covers the closed time range
  `[clips[i][0], clips[i][1]]`, measured in seconds from the start of the shift. Clips may overlap, may
  repeat, may extend past the end of the shift, and any clip can be trimmed to a shorter piece.

  Select as few clips as possible so that together they cover **every instant** of `[0, shift_length]`.
  Clips that only touch at a single point (one ends at second `7`, the next starts at second `7`) leave
  no gap. Return that minimum number of clips, or `-1` if no selection covers the whole shift.

  The clips are given in no particular order.

  ### Example 1
  ```
  Input:  clips = [[0, 4], [3, 9], [2, 6], [8, 12], [5, 10]], shift_length = 12
  Output: 3
  Explanation: Use [0, 4], then [3, 9], then [8, 12]. No pair of clips covers the shift: the only clip starting at 0 ends at 4, and no clip starting by second 4 reaches second 12.
  ```

  ### Example 2
  ```
  Input:  clips = [[1, 5], [5, 9]], shift_length = 9
  Output: -1
  Explanation: No clip starts at second 0, so the start of the shift is missing.
  ```

  ### Example 3
  ```
  Input:  clips = [[0, 3], [3, 6], [0, 6]], shift_length = 5
  Output: 1
  ```

  ### Constraints
  - `1 <= clips.length <= 10^5`
  - `clips[i].length == 2` and `0 <= clips[i][0] <= clips[i][1] <= 10^9`
  - `1 <= shift_length <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: stitch_camera_footage
  params:
    - {name: clips, type: "int[][]"}
    - {name: shift_length, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def stitch_camera_footage(clips: list[list[int]], shift_length: int) -> int:
        ordered = sorted(clips)
        covered = 0  # footage is continuous over [0, covered]
        used = 0
        i, n = 0, len(ordered)
        while covered < shift_length:
            # Among clips that start inside the covered part, take the one reaching furthest.
            furthest = covered
            while i < n and ordered[i][0] <= covered:
                furthest = max(furthest, ordered[i][1])
                i += 1
            if furthest == covered:
                return -1  # nothing extends the footage: a gap right after `covered`
            used += 1
            covered = furthest
        return used
  javascript: |
    function stitchCameraFootage(clips, shiftLength) {
      const ordered = clips.map((c) => [c[0], c[1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      let covered = 0;
      let used = 0;
      let i = 0;
      while (covered < shiftLength) {
        let furthest = covered;
        while (i < ordered.length && ordered[i][0] <= covered) {
          furthest = Math.max(furthest, ordered[i][1]);
          i += 1;
        }
        if (furthest === covered) return -1;
        used += 1;
        covered = furthest;
      }
      return used;
    }
