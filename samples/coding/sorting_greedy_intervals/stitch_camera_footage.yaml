expected_concepts:
  - "sort clips by start time"
  - "greedy: among clips starting within the covered prefix, extend to the furthest end"
  - "detect a gap when no clip extends the covered prefix"
  - "touching endpoints count as continuous for closed ranges"
  - "single linear pass after sorting"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by start, maintains the covered prefix and greedily jumps to the furthest reachable end among clips that start inside it, returns -1 as soon as no clip extends coverage, justifies the greedy choice with an exchange argument and states O(n log n)."
  good: "Reaches the greedy solution or a correct dynamic-programming approach over sorted clips, with a hint about why the furthest end is the right choice or a small fix for the touching-endpoint case."
  weak: "Picks the longest clips first, ignores gaps or the uncovered start at second 0, or uses a per-second array that cannot scale to 10^9."
  criteria:
    correctness: "All tests pass, including gaps, zero-length clips, overshooting clips and touching endpoints."
    efficiency: "Sorting plus one pass in which each clip is examined once."
    code_quality: "A clearly named covered boundary and furthest candidate, with a single loop that both scans and decides."
    edge_cases: "No clip at second 0, a gap in the middle, coverage stopping just short of the end and clips extending past it."
    communication: "Explains why choosing the furthest-reaching clip never hurts later choices."
hints:
  - "Suppose you already have continuous footage from the start up to some second. Which clips could possibly be the next one you add?"
  - "Only clips that start no later than the end of your current coverage can extend it without a gap. Of those, the one that reaches furthest is always at least as good as any other choice."
  - "Sort the clips by start time and keep the covered boundary, initially zero. Repeatedly scan forward over every clip whose start is within the boundary, remember the largest end among them, count one clip and move the boundary to that end. If the largest end does not move past the boundary, report that the shift cannot be covered."
followups:
  - "How would you return the chosen clips themselves, trimmed to the shift?"
  - "What changes if the ranges were half-open, so that touching clips leave a one-instant gap?"
  - "If each clip had a storage cost, how would you minimise total cost instead of the number of clips?"
  - "How would you answer many shift lengths for the same set of clips efficiently?"
common_errors:
