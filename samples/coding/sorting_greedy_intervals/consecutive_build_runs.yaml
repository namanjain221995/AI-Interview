slug: consecutive_build_runs
title: Split Builds into Consecutive Runs
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Split Builds into Consecutive Runs

  A release team groups successful CI builds into **release trains**. You receive the build numbers as a
  list sorted in **non-decreasing** order. The same build number can appear more than once (the same
  build was produced on several pipelines, and each copy must be shipped).

  Every copy must be placed in **exactly one** train, and each train must be a run of **consecutive**
  build numbers `x, x + 1, x + 2, ...` (each number at most once per train) containing **at least 3**
  builds. Trains may share build numbers with other trains, and the number of trains is up to you.

  Return `true` if the whole list can be split into valid trains, otherwise `false`. An empty list needs
  no trains, so return `true`.

  ### Example 1
  ```
  Input:  builds = [3, 4, 5, 5, 6, 7]
  Output: true
  Explanation: Trains [3, 4, 5] and [5, 6, 7].
  ```

  ### Example 2
  ```
  Input:  builds = [10, 11, 12, 12, 13, 13, 14]
  Output: true
  Explanation: Trains [10, 11, 12, 13] and [12, 13, 14].
  ```

  ### Example 3
  ```
  Input:  builds = [20, 21, 22, 22, 23]
  Output: false
  Explanation: Whichever train takes the first 22, the remaining builds cannot form a run of 3.
  ```

  ### Constraints
  - `0 <= builds.length <= 10^5`
  - `-10^9 <= builds[i] <= 10^9`
  - `builds` is sorted in non-decreasing order.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: consecutive_build_runs
  params:
    - {name: builds, type: "int[]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def consecutive_build_runs(builds: list[int]) -> bool:
        remaining = Counter(builds)
        waiting = Counter()  # waiting[x] = trains that currently end at x - 1 and could take x
        for x in builds:
            if remaining[x] == 0:
                continue  # already used to start an earlier train
            remaining[x] -= 1
            if waiting[x] > 0:
                waiting[x] -= 1
                waiting[x + 1] += 1
            elif remaining[x + 1] > 0 and remaining[x + 2] > 0:
                remaining[x + 1] -= 1
                remaining[x + 2] -= 1
                waiting[x + 3] += 1
            else:
                return False
        return True
  javascript: |
    function consecutiveBuildRuns(builds) {
      const remaining = new Map();
      const waiting = new Map();
      const get = (m, k) => m.get(k) || 0;
      const add = (m, k, d) => m.set(k, get(m, k) + d);
      for (const x of builds) add(remaining, x, 1);
      for (const x of builds) {
        if (get(remaining, x) === 0) continue;
        add(remaining, x, -1);
        if (get(waiting, x) > 0) {
          add(waiting, x, -1);
          add(waiting, x + 1, 1);
        } else if (get(remaining, x + 1) > 0 && get(remaining, x + 2) > 0) {
          add(remaining, x + 1, -1);
          add(remaining, x + 2, -1);
          add(waiting, x + 3, 1);
        } else {
          return false;
        }
      }
      return true;
    }
