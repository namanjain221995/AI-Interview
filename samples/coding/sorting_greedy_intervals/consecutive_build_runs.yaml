expected_concepts:
  - greedy - extend an existing train before starting a new one
  - frequency map of unused builds
  - map of trains waiting for their next number
  - starting a new train only when the next two numbers are available
  - linear pass over sorted input
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Uses counts of unused builds plus counts of trains waiting for a number, always extends an existing train before starting a new one, starts a train only by reserving the next two numbers, explains why extending is never worse and runs in O(n)."
  good: "Correct greedy or a correct priority-queue approach (append to the shortest train ending at x - 1) with O(n log n) time."
  weak: "Builds maximal runs left to right, checks only that counts never drop, uses backtracking, or ignores duplicates."
  criteria:
    correctness: "All tests pass, including duplicates, gaps, negative numbers and impossible tails."
    efficiency: "Single pass with hash maps (or O(n log n) with a heap)."
    code_quality: "Two clearly named maps; the three cases (extend, start, fail) are easy to follow."
    edge_cases: "Empty list, fewer than three builds, values at the range limits, many duplicates."
    communication: "Justifies the greedy: a number that can extend a train should, because a new train would need two more numbers it may not get."
hints:
  - "Process the builds from smallest to largest. When you look at a build number, what are the only two things it can do?"
  - "It can either extend a train that currently ends one below it, or start a new train. Track how many trains are waiting for each next number, and prefer extending, because a new train needs two more builds to become valid."
  - "Keep a count of unused builds and a count of trains waiting for each number. For each unused build, extend a waiting train if one exists, otherwise start a train by also taking one copy each of the next two numbers, otherwise the answer is false."
followups:
  - "How would you return the trains themselves?"
  - "What changes if the minimum train length is k instead of 3?"
  - "What if the input were not sorted?"
common_errors:
  - "Starting a new train before trying to extend an existing one."
  - "Building maximal runs greedily, which strands later duplicates."
  - "Forgetting that a build used to start a train must be skipped later."
  - "Returning false for an empty list."
