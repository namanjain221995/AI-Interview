expected_concepts:
  - "half-open intervals: touching bookings do not overlap"
  - "per-room ordered structure of accepted bookings"
  - "binary search for the neighbouring bookings of a request"
  - "check only the predecessor and successor for overlap"
  - "first-fit by room number, processing in arrival order"
optimal_complexity: {time: "O(n * R * log n) with a balanced ordered map per room (R = room_count)", space: "O(n + R)"}
rubric:
  excellent: "Keeps the accepted bookings of each room in sorted order, uses binary search to find the neighbours of a request and checks only the predecessor and successor, applies the half-open touching rule correctly, explains why rooms cannot be summarised by a single free-from time and states the cost per request."
  good: "Correct first-fit solution that scans every accepted booking of each room (O(n^2 * R) worst case) and recognises with prompting how to reduce each check to a binary search."
  weak: "Sorts the requests by start time and changes the processing order, keeps only the last end time per room so gaps are never reused, or treats touching bookings as overlapping."
  criteria:
    correctness: "All tests pass, including bookings that fill gaps between earlier bookings and touching endpoints."
    efficiency: "Each room check is logarithmic in that room's bookings rather than a full scan."
    code_quality: "A small helper or clear block for the overlap test and a sorted container per room."
    edge_cases: "One room, identical requests, gap-filling requests, nested requests and times near 10^9."
    communication: "Explains why only the immediate neighbours in the sorted order can overlap a new booking."
hints:
  - "Because requests are not in time order, a later request may fit into a gap between earlier bookings. What do you need to remember about each room to decide whether a request fits?"
  - "If a room's bookings are kept sorted by start time, they cannot overlap each other, so a new request can only collide with the booking just before it or the booking just after it."
  - "For each room keep the accepted bookings sorted by start. For a request, binary search for the first booking that starts at or after the request's start. The request fits if the previous booking ends at or before the request's start and the next booking starts at or after the request's end. Try rooms from zero upward and insert into the first room that fits."
followups:
  - "Which data structure would make insertion logarithmic as well, in your language of choice?"
  - "How would you support cancelling an accepted booking?"
  - "What changes if each request should go to the room that leaves the smallest idle gap instead of the lowest number?"
  - "With thousands of rooms, how could you avoid checking every room for every request?"
common_errors:
  - "Tracking only the latest end time per room, which rejects requests that fit into earlier gaps."
  - "Treating a booking that ends exactly when another starts as an overlap."
  - "Sorting the requests by time, which changes which room each request receives."
  - "Checking only one neighbour in the sorted list instead of both the predecessor and successor."
