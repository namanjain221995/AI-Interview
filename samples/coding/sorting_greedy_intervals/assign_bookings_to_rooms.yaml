version: 1
slug: assign_bookings_to_rooms
title: "Assign Bookings to Rooms"
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [backend, fullstack, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Assign Bookings to Rooms

  An office booking service manages `room_count` meeting rooms numbered `0` to `room_count - 1`. Booking
  requests arrive one after another in the order given (which is **not** sorted by time). Request `i` is
  `[start, end]` and asks for a room over the half-open interval `[start, end)`, so a booking that ends
  at minute `30` does not conflict with one that starts at minute `30`.

  Process the requests in arrival order. Each request is placed in the **lowest-numbered** room in which
  it does not overlap any booking already accepted for that room. If no room can take it, the request is
  rejected and nothing changes. Accepted bookings are never moved later.

  Return an array with one entry per request, in arrival order: the room number assigned, or `-1` if the
  request was rejected.

  ### Example 1
  ```
  Input:  room_count = 2, requests = [[10, 20], [15, 25], [20, 30], [5, 12], [0, 10]]
  Output: [0, 1, 0, 1, 0]
  Explanation: [15, 25] overlaps room 0's [10, 20], so it goes to room 1. [20, 30] touches [10, 20] and fits room 0. [5, 12] overlaps room 0 but ends before [15, 25] in room 1. [0, 10] ends exactly when [10, 20] starts, so it fits room 0.
  ```

  ### Example 2
  ```
  Input:  room_count = 1, requests = [[0, 5], [3, 8], [5, 9]]
  Output: [0, -1, 0]
  ```

  ### Constraints
  - `1 <= room_count <= 100`
  - `1 <= requests.length <= 10^4`
  - `requests[i].length == 2` and `0 <= start < end <= 10^9`

  A request can land in a gap between bookings that were accepted earlier, so the rooms cannot be treated as only "free after time t". Aim for a logarithmic overlap check per room.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: assign_bookings_to_rooms
  params:
    - {name: room_count, type: "int"}
    - {name: requests, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left


    def assign_bookings_to_rooms(room_count: int, requests: list[list[int]]) -> list[int]:
        # For each room keep accepted bookings sorted by start; they never overlap,
        # so the ends are sorted in the same order.
        starts: list[list[int]] = [[] for _ in range(room_count)]
        ends: list[list[int]] = [[] for _ in range(room_count)]
        result = []
        for start, end in requests:
            assigned = -1
            for room in range(room_count):
                s, e = starts[room], ends[room]
                pos = bisect_left(s, start)  # first booking starting at or after `start`
                if pos > 0 and e[pos - 1] > start:
                    continue  # previous booking runs past our start
                if pos < len(s) and s[pos] < end:
                    continue  # next booking starts before we end
                s.insert(pos, start)
                e.insert(pos, end)
                assigned = room
                break
            result.append(assigned)
        return result
  javascript: |
    function assignBookingsToRooms(roomCount, requests) {
      const starts = Array.from({ length: roomCount }, () => []);
      const ends = Array.from({ length: roomCount }, () => []);
      const lowerBound = (arr, x) => {
        let lo = 0;
        let hi = arr.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (arr[mid] < x) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      };
      const result = [];
      for (const [start, end] of requests) {
        let assigned = -1;
        for (let room = 0; room < roomCount; room++) {
          const s = starts[room];
          const e = ends[room];
          const pos = lowerBound(s, start);
          if (pos > 0 && e[pos - 1] > start) continue;
          if (pos < s.length && s[pos] < end) continue;
          s.splice(pos, 0, start);
          e.splice(pos, 0, end);
          assigned = room;
          break;
        }
        result.push(assigned);
      }
      return result;
    }
