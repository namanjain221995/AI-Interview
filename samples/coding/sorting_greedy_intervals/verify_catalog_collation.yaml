expected_concepts:
  - "map each letter to its rank in the custom alphabet"
  - "compare only adjacent pairs (transitivity)"
  - "first differing letter decides the comparison"
  - "prefix rule: shorter word first"
optimal_complexity: {time: "O(total characters)", space: "O(1) (26-entry rank table)"}
rubric:
  excellent: "Builds a rank table, compares only adjacent pairs with a clear helper, explains transitivity and handles the prefix and equal-word cases."
  good: "Correct adjacent-pair comparison with the rank table; prefix handling may need a nudge."
  weak: "Compares every pair, uses the built-in alphabetical order, keeps comparing after the first differing letter, or misses the prefix rule."
  criteria:
    correctness: "All tests pass, including prefixes, equal words and single words."
    efficiency: "Linear in the total number of characters; constant-time rank lookups."
    code_quality: "A small comparison helper with an early return at the first differing letter."
    edge_cases: "Single word, equal adjacent words, a longer word before its prefix, and differences only at the last letter."
    communication: "Explains why checking neighbours is enough to prove the whole list is sorted."
hints:
  - "Precompute where each letter sits in the custom alphabet so comparisons are quick."
  - "If every adjacent pair is in order, the whole list is in order, so you never need to compare distant words."
  - "For each neighbouring pair, walk both words to the first differing letter and compare their ranks; if no letter differs, the pair is in order only when the first word is not longer than the second."
followups:
  - "How would you sort a list of words under this alphabet?"
  - "If you only had a sorted list but not the alphabet, what ordering facts could you infer?"
  - "How would you support uppercase letters or accented characters?"
common_errors:
  - "Returning true when a longer word comes before its own prefix."
  - "Continuing to compare after the first differing letter."
  - "Comparing letters with the default alphabetical order instead of the custom ranks."
