version: 1
slug: verify_catalog_collation
title: "Verify Catalog Collation Order"
difficulty: easy
competency_keys: [algorithms, code_quality]
role_tags: [frontend, backend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Verify Catalog Collation Order

  A storefront is launching a locale whose collation uses a custom ordering of the 26 lowercase
  letters. `alphabet` is that ordering: a permutation of `a` to `z`, where earlier letters sort first.

  Given the product entries `words` exactly as the catalog service returned them, return `true` if
  they are in **non-decreasing** order under this alphabet and `false` otherwise. Words compare at
  their first differing letter; if one word is a prefix of the other, the shorter word sorts first.
  Equal adjacent words are allowed.

  ### Example 1
  ```
  Input:  words = ["tea", "sun", "rope"], alphabet = "zyxwvutsrqponmlkjihgfedcba"
  Output: true
  Explanation: In this reversed alphabet t comes before s and s before r.
  ```

  ### Example 2
  ```
  Input:  words = ["cart", "car"], alphabet = "abcdefghijklmnopqrstuvwxyz"
  Output: false
  Explanation: car is a prefix of cart, so it must come first.
  ```

  ### Example 3
  ```
  Input:  words = ["desk", "lamp", "lamp"], alphabet = "qwertyuiopasdfghjklzxcvbnm"
  Output: true
  ```

  ### Constraints
  - `1 <= words.length <= 1000`
  - `1 <= words[i].length <= 20`
  - `words[i]` contains only lowercase English letters
  - `alphabet` is a permutation of the 26 lowercase English letters
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: verify_catalog_collation
  params:
    - {name: words, type: "string[]"}
    - {name: alphabet, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def verify_catalog_collation(words: list[str], alphabet: str) -> bool:
        rank = {letter: i for i, letter in enumerate(alphabet)}

        def in_order(left: str, right: str) -> bool:
            for a, b in zip(left, right):
                if a != b:
                    return rank[a] < rank[b]
            return len(left) <= len(right)

        return all(in_order(words[i], words[i + 1]) for i in range(len(words) - 1))
  javascript: |
    function verifyCatalogCollation(words, alphabet) {
      const rank = new Map();
      for (let i = 0; i < alphabet.length; i++) rank.set(alphabet[i], i);
      const inOrder = (left, right) => {
        const n = Math.min(left.length, right.length);
        for (let i = 0; i < n; i++) {
          if (left[i] !== right[i]) return rank.get(left[i]) < rank.get(right[i]);
        }
        return left.length <= right.length;
      };
      for (let i = 0; i + 1 < words.length; i++) {
        if (!inOrder(words[i], words[i + 1])) return false;
      }
      return true;
    }
