expected_concepts:
  - "sweep the days in order"
  - "among requests already open, serve the one whose window closes soonest"
  - "min-heap keyed by last day"
  - "discard requests whose window has already closed"
  - "jump over idle days instead of iterating every day"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by first day, sweeps days while a min-heap holds the last days of open requests, serves the earliest-closing request each day, drops expired ones, skips idle stretches of days, justifies the earliest-deadline choice with an exchange argument and states O(n log n)."
  good: "Reaches the sweep-plus-heap solution with a hint, or the sort-by-last-day approach that assigns each request the earliest free day using an efficient structure, with minor prompting on skipping idle days."
  weak: "Sorts by first day or by window length and assigns greedily without a priority queue, iterates every day up to 10^9, or uses a quadratic search for a free day."
  criteria:
    correctness: "All tests pass, including identical windows, nested windows and long windows that must not take a short request's only day."
    efficiency: "Each request is pushed and popped once from the heap and idle days are skipped."
    code_quality: "Clear separation between adding newly opened requests, discarding expired ones and serving one per day."
    edge_cases: "Single request, many requests on one day, days near 10^9 and gaps between clusters of requests."
    communication: "Explains why the request that closes soonest should be served first."
hints:
  - "Walk through the days in order. On a given day, several requests may be possible. Which one is the riskiest to postpone?"
  - "Serve the open request whose window closes first; the others can still wait. To find it quickly, keep the open requests in a priority queue ordered by their last day."
  - "Sort the requests by first day. Keep a current day and a min-heap of last days. When the heap is empty, jump the current day to the next first day. Push every request that has opened by the current day, pop and discard those whose last day is already in the past, then pop the smallest remaining one, count it as served and advance the day by one."
followups:
  - "How would you return which day each served request is assigned to?"
  - "What changes if the technician can make up to c visits per day?"
  - "If each request had a value, how would you maximise the total value served?"
  - "Can you solve it by sorting on last day instead, and what structure finds the earliest free day quickly?"
common_errors:
  - "Serving requests in order of first day, which lets a long window take a day that a short window needed."
  - "Looping over every calendar day up to the maximum day number."
  - "Forgetting to discard requests whose window has already closed before serving."
  - "Not jumping ahead when the heap is empty, causing an infinite loop or an index error."
