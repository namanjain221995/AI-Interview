title: "Maximum Technician Visits"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, general, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Maximum Technician Visits

  A field technician services customer equipment and can complete **at most one visit per day**. Service
  request `i` is given as `[first_day, last_day]`: the customer can host the visit on any single day in
  that inclusive window. One visit serves exactly one request, and a request needs only one visit.

  Plan the visits so that as many requests as possible are served, and return that maximum number.
  Requests are listed in no particular order, several requests may have identical windows, and day
  numbers can be very large, so the plan cannot rely on an array indexed by day.

  ### Example 1
  ```
  Input:  requests = [[1, 2], [1, 2], [1, 2], [3, 3]]
  Output: 3
  Explanation: Only two of the three requests with window [1, 2] fit on days 1 and 2; the last request is served on day 3.
  ```

  ### Example 2
  ```
  Input:  requests = [[1, 4], [2, 2], [2, 3], [3, 3]]
  Output: 3
  Explanation: Serve [2, 2] on day 2, [3, 3] on day 3 and [1, 4] on day 1 or 4. The request [2, 3] would need day 2 or 3, which are both taken, so at most 3 requests can be served.
  ```

  ### Example 3
  ```
  Input:  requests = [[5, 9], [1, 3], [2, 2], [1, 1]]
  Output: 4
  ```

  ### Constraints
  - `1 <= requests.length <= 10^5`
  - `requests[i].length == 2` and `1 <= first_day <= last_day <= 10^9`

  Aim for `O(n log n)` time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_technician_visits
  params:
    - {name: requests, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def max_technician_visits(requests: list[list[int]]) -> int:
        ordered = sorted(requests)  # by first_day
        open_deadlines: list[int] = []  # min-heap of last_day for requests already available
        served, i, n = 0, 0, len(ordered)
        day = 0
        while i < n or open_deadlines:
            if not open_deadlines:
                day = max(day, ordered[i][0])  # jump over idle days
            while i < n and ordered[i][0] <= day:
                heapq.heappush(open_deadlines, ordered[i][1])
                i += 1
            while open_deadlines and open_deadlines[0] < day:
                heapq.heappop(open_deadlines)  # window already closed
            if open_deadlines:
                heapq.heappop(open_deadlines)  # serve the most urgent request today
                served += 1
                day += 1
        return served
  javascript: |
    function maxTechnicianVisits(requests) {
      const ordered = requests.map((r) => [r[0], r[1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const heap = [];
      const push = (v) => {
        heap.push(v);
        let k = heap.length - 1;
        while (k > 0) {
          const p = (k - 1) >> 1;
          if (heap[p] <= heap[k]) break;
          [heap[p], heap[k]] = [heap[k], heap[p]];
          k = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let k = 0;
          for (;;) {
            const l = 2 * k + 1;
            const r = l + 1;
            let m = k;
            if (l < heap.length && heap[l] < heap[m]) m = l;
            if (r < heap.length && heap[r] < heap[m]) m = r;
            if (m === k) break;
            [heap[m], heap[k]] = [heap[k], heap[m]];
            k = m;
          }
        }
        return top;
      };
      let served = 0;
      let i = 0;
      let day = 0;
      while (i < ordered.length || heap.length > 0) {
        if (heap.length === 0) day = Math.max(day, ordered[i][0]);
        while (i < ordered.length && ordered[i][0] <= day) push(ordered[i++][1]);
        while (heap.length > 0 && heap[0] < day) pop();
        if (heap.length > 0) {
          pop();
          served += 1;
          day += 1;
        }
      }
      return served;
    }
