expected_concepts:
  - "offline processing: answering queries in sorted order"
  - "sorting windows by left edge and adding them as the sweep passes"
  - "min-heap keyed by window size"
  - "lazy removal of windows whose right edge is before the query"
  - "restoring the original query order with saved indices"
optimal_complexity: {time: "O((n + m) log(n + m))", space: "O(n + m)"}
rubric:
  excellent: "Processes incidents in sorted order while remembering their original positions, adds windows by left edge into a min-heap on size, discards heap tops whose right edge has passed, and justifies why discarded windows are never needed again; states O((n + m) log(n + m))."
  good: "Reaches the offline sweep with a heap but needs prompting on lazy removal or on restoring the query order, or uses a slightly slower but sub-quadratic structure."
  weak: "Scans every window for every incident (O(n * m)), returns answers in sorted rather than original order, or uses exclusive boundaries."
  criteria:
    correctness: "All tests pass, including repeated incidents, uncovered minutes and inclusive edges."
    efficiency: "Sub-quadratic: each window is pushed and popped at most once; sorting dominates."
    code_quality: "Clear separation of the window pointer, the heap and the answer array; no mutation of the caller's lists."
    edge_cases: "No windows, no incidents, single-minute windows, duplicates and coordinates near 10^9."
    communication: "Explains why a window whose right edge is before the current incident can be dropped permanently once the incidents are processed in increasing order."
hints:
  - "Answering incidents one by one in the given order makes each one scan many windows; think about whether a different processing order lets you reuse work between incidents."
  - "If incidents are handled from earliest to latest, a window becomes relevant once its left edge is reached and is useless forever once its right edge is passed, so keep the currently relevant windows in a structure ordered by size."
  - "Sort the windows by left edge and the incident indices by minute; for each incident push every window whose left edge is at most the minute into a min-heap of size with right edge, pop from the top while the top's right edge is before the minute, then the top's size (or minus one if the heap is empty) is the answer stored at the incident's original index."
followups:
  - "Why can a window that was popped because it ended before one incident never be the answer for a later incident?"
