version: 1
slug: smallest_window_per_incident
title: "Smallest Maintenance Window per Incident"
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [sre, backend, devops]
time_limit_minutes: 35
prompt_markdown: |
  ## Smallest Maintenance Window per Incident

  An SRE team is auditing which incidents happened while some maintenance was in progress. Maintenance
  window `i` is `windows[i] = [lo, hi]`, an **inclusive** range of minutes, so it covers every minute `t`
  with `lo <= t <= hi` and its size is `hi - lo + 1`. Windows may overlap, nest or repeat.

  For each incident minute `incidents[j]`, the auditors want to attribute the incident to the most
  specific maintenance, i.e. the **smallest** window that covers that minute. Return an array `answer`
  of the same length as `incidents` where `answer[j]` is the size of the smallest window covering
  `incidents[j]`, or `-1` if no window covers it. Answers are in the original order of `incidents`
  (which is not sorted and may contain repeats).

  ### Example 1
  ```
  Input:  windows = [[1, 4], [2, 4], [3, 6], [4, 4]], incidents = [2, 3, 4, 5]
  Output: [3, 3, 1, 4]
  Explanation: minute 2 is covered by [1, 4] (size 4) and [2, 4] (size 3); minute 4 by the single-minute window [4, 4];
  minute 5 only by [3, 6] (size 4).
  ```

  ### Example 2
  ```
  Input:  windows = [[2, 3], [2, 5], [1, 8], [20, 25]], incidents = [2, 19, 5, 22]
  Output: [2, -1, 4, 6]
  Explanation: minute 19 lies in no window, so its answer is -1.
  ```

  ### Constraints
  - `0 <= windows.length <= 10^5`
  - `0 <= incidents.length <= 10^5`
  - `windows[i].length == 2`
  - `1 <= lo <= hi <= 10^9`
  - `1 <= incidents[j] <= 10^9`

  **Follow-up:** checking every window for every incident is `O(n * m)`. Can you answer all incidents in `O((n + m) log(n + m))`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smallest_window_per_incident
  params:
    - {name: windows, type: "int[][]"}
    - {name: incidents, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def smallest_window_per_incident(windows: list[list[int]], incidents: list[int]) -> list[int]:
        ordered = sorted(windows)
        answer = [-1] * len(incidents)
        heap: list[tuple[int, int]] = []  # (size, hi)
        i = 0
        for j in sorted(range(len(incidents)), key=lambda q: incidents[q]):
            t = incidents[j]
            while i < len(ordered) and ordered[i][0] <= t:
                lo, hi = ordered[i]
                heapq.heappush(heap, (hi - lo + 1, hi))
                i += 1
            while heap and heap[0][1] < t:
                heapq.heappop(heap)
            if heap:
                answer[j] = heap[0][0]
        return answer
  javascript: |
    function smallestWindowPerIncident(windows, incidents) {
      const ordered = [...windows].sort((a, b) => a[0] - b[0]);
      const order = incidents.map((_, j) => j).sort((a, b) => incidents[a] - incidents[b]);
      const answer = new Array(incidents.length).fill(-1);
      // Min-heap of [size, hi].
      const heap = [];
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p][0] <= heap[i][0]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const last = heap.pop();
        if (heap.length === 0) return;
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1;
          const r = l + 1;
          let m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          [heap[m], heap[i]] = [heap[i], heap[m]];
          i = m;
        }
      };
      let i = 0;
      for (const j of order) {
        const t = incidents[j];
        while (i < ordered.length && ordered[i][0] <= t) {
          const [lo, hi] = ordered[i];
          push([hi - lo + 1, hi]);
          i++;
        }
        while (heap.length > 0 && heap[0][1] < t) pop();
        if (heap.length > 0) answer[j] = heap[0][0];
      }
      return answer;
    }
