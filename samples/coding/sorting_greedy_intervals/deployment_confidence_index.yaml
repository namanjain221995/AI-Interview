prompt_markdown: |
  ## Deployment Confidence Index

  A release dashboard shows a **confidence index** for the current deployment train. Changes are merged
  one at a time, and `approvals[i]` is the number of review approvals that the `i`-th merged change
  received.

  For a set of merged changes, the confidence index is the largest integer `k` such that **at least `k`
  of the changes** each have **`k` or more approvals**. A set with no approved change (or no changes at
  all) has index `0`.

  The dashboard refreshes after every merge. Return an array `result` of the same length as
  `approvals`, where `result[i]` is the confidence index of the first `i + 1` merged changes
  (`approvals[0..i]`).

  - Approval counts arrive in merge order, not sorted.
  - An empty input returns an empty array.

  ### Example 1
  ```
  Input:  approvals = [3, 0, 6, 1, 5]
  Output: [1, 1, 2, 2, 3]
  Explanation: After the fifth merge, three changes (3, 6 and 5 approvals) have at least 3 approvals, but only two have at least 4.
  ```

  ### Example 2
  ```
  Input:  approvals = [0, 0, 2, 1]
  Output: [0, 0, 1, 1]
  Explanation: The first two changes have no approvals, so the index stays 0 until a change with approvals is merged.
  ```

  ### Example 3
  ```
  Input:  approvals = [4, 4, 4, 4, 4]
  Output: [1, 2, 3, 4, 4]
  Explanation: Four changes with 4 approvals give index 4; a fifth change with only 4 approvals cannot raise it to 5.
  ```

  ### Constraints
  - `0 <= approvals.length <= 10^5`
  - `0 <= approvals[i] <= 10^4`

  **Goal:** recomputing the index from scratch after every merge is `O(n^2 log n)`; aim for
  `O(n log n)` or better overall.
