expected_concepts:
  - "definition of the index (largest k with at least k values >= k)"
  - "the index never decreases as changes are added"
  - "min-heap of counts above the current index, or bucket counts capped at n"
  - "amortised O(n log n) (heap) or O(n) (buckets) instead of re-sorting each prefix"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Notices the index only grows, maintains the values above the index in a min-heap (or capped bucket counts), raises the index while enough values remain and states O(n log n) or O(n) with a clear amortised argument."
  good: "Correct incremental solution that keeps a sorted structure or re-scans only part of the data, possibly O(n sqrt n) or needing a hint about monotonicity."
  weak: "Recomputes the index from scratch after every merge with a sort, or mishandles counts equal to the index."
  criteria:
    correctness: "All tests pass, including empty input, all zeros, duplicates at the threshold and very large counts."
    efficiency: "Amortised O(log n) or O(1) work per merge; total O(n log n) or O(n)."
    code_quality: "The invariant (what the heap or buckets hold relative to the index) is named and kept in one place."
    edge_cases: "Empty input, zero approvals, counts far larger than n and counts exactly equal to the current index."
    communication: "Explains why the index is monotonic and why each value is removed from the heap at most once."
hints:
  - "Adding a change can never lower the index. How much can a single merge raise it?"
  - "Keep only the changes whose approval count is still larger than the current index; the index can grow by one whenever at least index + 1 of them remain."
  - "Use a min-heap of counts greater than the index: push the new count if it beats the index, then while the heap holds at least index + 1 entries, increase the index and pop every count that is no longer greater than it."
followups:
  - "Why can the index never decrease, and how does that make the incremental update cheap?"
  - "Can you reach O(n) total time by capping counts at n and keeping buckets?"
  - "How would you support a change being reverted (its approvals removed) after it was merged?"
  - "How would you compute the index for an arbitrary window of the last w merges?"
common_errors:
  - "Re-sorting the whole prefix after every merge, which is O(n^2 log n)."
  - "Dropping counts equal to the new index too late or too early, giving an off-by-one index."
  - "Allocating buckets by the maximum approval value instead of capping at n."
  - "Returning only the final index instead of one value per merge."
