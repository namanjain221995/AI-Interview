reference_solutions:
  python: |
    import heapq


    def deployment_confidence_index(approvals: list[int]) -> list[int]:
        result: list[int] = []
        index = 0
        above: list[int] = []  # min-heap of approval counts greater than the current index
        for count in approvals:
            if count > index:
                heapq.heappush(above, count)
            # At least index + 1 changes have index + 1 or more approvals: the index can grow.
            while len(above) >= index + 1:
                index += 1
                while above and above[0] <= index:
                    heapq.heappop(above)
            result.append(index)
        return result
  javascript: |
    function deploymentConfidenceIndex(approvals) {
      const n = approvals.length;
      const counts = new Array(n + 2).fill(0); // counts[c] = changes with min(approvals, n) == c
      const result = [];
      let index = 0;
      let atLeastNext = 0; // changes with at least index + 1 approvals
      for (const raw of approvals) {
        const c = Math.min(raw, n);
        counts[c] += 1;
        if (c >= index + 1) atLeastNext += 1;
        while (atLeastNext >= index + 1) {
          index += 1;
          atLeastNext -= counts[index];
        }
        result.push(index);
      }
      return result;
    }
