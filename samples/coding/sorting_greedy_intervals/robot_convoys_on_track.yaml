time_limit_minutes: 20
prompt_markdown: |
  ## Robot Convoys on a Single Track

  Autonomous carts in a fulfilment centre share a one-lane track that ends at the loading dock, located
  at position `target`. Cart `i` starts at position `positions[i]` (every start position is different and
  lies before the dock) and drives toward the dock at a constant `speeds[i]` units per minute.

  The lane is too narrow to overtake. When a faster cart catches up with a slower cart ahead of it,
  anywhere before the dock **or exactly at the dock**, it falls in directly behind and from then on moves
  at the slower cart's speed. Carts that move together like this form one **convoy**, and a convoy can
  keep absorbing carts from behind. Carts are treated as points: catching up means being at the same
  position at the same moment.

  Return the number of convoys that arrive at the dock. A cart that neither catches anything nor is
  caught arrives as a convoy of its own. The arrays are not sorted by position.

  ### Example 1
  ```
  Input:  target = 20, positions = [14, 2, 10, 0, 6], speeds = [2, 4, 1, 1, 3]
  Output: 3
  Explanation: The cart at 14 arrives after 3 minutes on its own. The carts at 6 and 2 catch the slow cart at 10 before the dock, so those three arrive as one convoy after 10 minutes. The cart at 0 arrives alone after 20 minutes.
  ```

  ### Example 2
  ```
  Input:  target = 12, positions = [6, 0], speeds = [3, 6]
  Output: 1
  Explanation: Both carts would reach the dock after exactly 2 minutes, so they meet there and count as one convoy.
  ```

  ### Example 3
  ```
  Input:  target = 10, positions = [0, 5], speeds = [1, 1]
  Output: 2
  ```

  ### Constraints
  - `1 <= positions.length == speeds.length <= 10^5`
  - `1 <= target <= 10^6`
  - `0 <= positions[i] < target`, and all `positions[i]` are distinct
  - `1 <= speeds[i] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: robot_convoys_on_track
  params:
    - {name: target, type: "int"}
    - {name: positions, type: "int[]"}
    - {name: speeds, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def robot_convoys_on_track(target: int, positions: list[int], speeds: list[int]) -> int:
        # Process carts from the one closest to the dock backwards.
        order = sorted(range(len(positions)), key=lambda i: positions[i], reverse=True)
        convoys = 0
        lead_dist, lead_speed = 0, 1  # arrival time of the convoy just ahead = lead_dist / lead_speed
        for i in order:
            dist, speed = target - positions[i], speeds[i]
            # A cart that would arrive no later than the convoy ahead catches it and joins it.
            # Compare dist / speed <= lead_dist / lead_speed without floating point.
            if convoys > 0 and dist * lead_speed <= lead_dist * speed:
                continue
            convoys += 1
            lead_dist, lead_speed = dist, speed
        return convoys
  javascript: |
    function robotConvoysOnTrack(target, positions, speeds) {
      const order = positions.map((_, i) => i).sort((a, b) => positions[b] - positions[a]);
      let convoys = 0;
      let leadDist = 0;
      let leadSpeed = 1;
      for (const i of order) {
        const dist = target - positions[i];
        const speed = speeds[i];
        // Products stay below 10^12, well inside the exact integer range of a double.
        if (convoys > 0 && dist * leadSpeed <= leadDist * speed) continue;
        convoys += 1;
        leadDist = dist;
        leadSpeed = speed;
      }
      return convoys;
    }
