expected_concepts:
  - "sort carts by position, closest to the dock first"
  - "arrival time as distance divided by speed"
  - "a cart joins the convoy ahead when its own arrival time is not later"
  - "only the slowest (latest) convoy ahead matters, a monotonic scan or stack"
  - "exact comparison of fractions by cross-multiplication"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Realises that a convoy's arrival time is fixed by its front cart, sorts by position from the dock backwards, counts a new convoy only when a cart's unobstructed arrival time is strictly later than the convoy ahead, treats a tie as joining, compares times exactly and states O(n log n)."
  good: "Reaches the sort-and-scan solution with a hint or uses floating-point times correctly, but needs prompting on the tie-at-the-dock rule or on why the cart's own speed is irrelevant once it has joined."
  weak: "Simulates minute by minute, compares each cart only with its immediate neighbour's own speed, forgets to sort by position, or counts carts that meet exactly at the dock as separate convoys."
  criteria:
    correctness: "All tests pass, including ties at the dock, chains of catches and unsorted input."
    efficiency: "One sort plus a linear scan; no time-step simulation and no pairwise comparison of all carts."
    code_quality: "Clear pairing of position and speed, a single variable for the convoy ahead and a named comparison of arrival times."
    edge_cases: "Single cart, equal speeds, catching exactly at the dock and products of large distances and speeds."
    communication: "Explains why a joined cart can be forgotten and why the slower front cart determines the whole convoy's arrival."
hints:
  - "Think about each cart's arrival time if the track were empty, and about which cart actually sets the pace of a convoy."
  - "Look at the carts in order of how close they are to the dock. A cart either arrives no later than the group directly in front of it, in which case it is absorbed, or strictly later, in which case it starts a new group."
  - "Sort the carts by position from the dock backwards and keep only the arrival time of the most recent convoy. For each cart compute its unobstructed arrival time; if it is less than or equal to that stored time the cart joins, otherwise count a new convoy and store the cart's time. Compare times by cross-multiplying distance and speed to avoid rounding."
followups:
  - "How would you also report how many carts are in each convoy, in dock-arrival order?"
  - "What changes if the carts can start at the same position?"
  - "How would you compute the time at which each cart joins its convoy?"
  - "If carts are added to the track one at a time, can you maintain the convoy count incrementally?"
common_errors:
  - "Comparing a cart with the cart immediately ahead instead of with the convoy ahead, whose speed may be slower."
  - "Treating a catch exactly at the dock as two convoys by using a strict comparison."
  - "Forgetting to sort by position because the input arrays are unsorted."
  - "Using floating-point division and then testing equality, or overflowing 32-bit integers when cross-multiplying."
