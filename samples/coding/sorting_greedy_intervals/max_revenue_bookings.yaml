time_limit_minutes: 35
prompt_markdown: |
  ## Maximum Revenue Venue Bookings

  A conference venue rents out its single main hall. The booking system has collected a batch of
  offers, and the operations team wants to know the best revenue it could earn from them.

  Each offer is `offers[i] = [start, end, revenue]`: the client wants the hall from time `start` up to
  time `end` (the time range includes `start` and excludes `end`) and will pay `revenue` for it. The hall
  can host only one client at a time, so accepted offers must not overlap. An offer ending at time `t`
  and another starting at time `t` do **not** overlap and can both be accepted. Offers cannot be
  shortened or split, and an offer may be declined.

  Return the **maximum total revenue** of a set of non-overlapping offers. The offers are not given in
  any particular order.

  ### Example 1
  ```
  Input:  offers = [[1, 3, 50], [2, 5, 20], [3, 6, 75], [5, 8, 40]]
  Output: 125
  Explanation: accept [1, 3] and [3, 6] for 50 + 75.
  ```

  ### Example 2
  ```
  Input:  offers = [[0, 10, 100], [0, 4, 40], [4, 7, 40], [7, 10, 40]]
  Output: 120
  Explanation: the three back-to-back offers earn more than the single long one.
  ```

  ### Example 3
  ```
  Input:  offers = [[1, 4, 8], [2, 5, 9], [3, 6, 7]]
  Output: 9
  Explanation: every pair overlaps, so only the most valuable offer is accepted.
  ```

  ### Constraints
  - `1 <= offers.length <= 5 * 10^4`
  - `0 <= start < end <= 10^9`
  - `1 <= revenue <= 10^9`
  - The answer can exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_revenue_bookings
  params:
    - {name: offers, type: "int[][]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_right


    def max_revenue_bookings(offers: list[list[int]]) -> int:
        order = sorted(offers, key=lambda offer: offer[1])
        ends = [offer[1] for offer in order]
        # best[i] = maximum revenue using only the first i offers in end order.
        best = [0] * (len(order) + 1)
        for i, (start, _end, revenue) in enumerate(order):
            compatible = bisect_right(ends, start, 0, i)  # offers ending at or before start
            best[i + 1] = max(best[i], best[compatible] + revenue)
        return best[-1]
  javascript: |
    function maxRevenueBookings(offers) {
      const order = offers.slice().sort((a, b) => a[1] - b[1]);
      const n = order.length;
      const best = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) {
        const [start, , revenue] = order[i];
        let lo = 0;
        let hi = i;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (order[mid][1] <= start) lo = mid + 1;
          else hi = mid;
        }
        best[i + 1] = Math.max(best[i], best[lo] + revenue);
      }
      return best[n];
    }
