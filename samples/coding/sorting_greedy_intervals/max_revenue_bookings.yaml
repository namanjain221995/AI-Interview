expected_concepts:
  - "weighted interval scheduling"
  - "sorting offers by end time"
  - "dynamic programming over a prefix: take the offer or skip it"
  - "binary search for the last offer that ends at or before a start time"
  - "why greedy by revenue or by earliest end fails when offers have weights"
  - "64-bit accumulation of the total"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by end time, defines the take-or-skip recurrence, finds the compatible predecessor by binary search with the half-open boundary handled correctly, uses 64-bit totals and explains why greedy choices fail."
  good: "Reaches the sorted dynamic programme, perhaps with an O(n^2) predecessor scan first or after a hint about binary search, and handles touching offers correctly."
  weak: "Uses a greedy rule (highest revenue first or earliest end first), enumerates subsets, or treats offers that touch at an endpoint as overlapping."
  criteria:
    correctness: "All tests pass, including duplicates, shared end times, touching offers and the greedy trap."
    efficiency: "O(n log n) overall; no quadratic scan for the previous compatible offer."
    code_quality: "The recurrence is clearly expressed with a well-named best-so-far array and a separate search for the predecessor."
    edge_cases: "Single offers, identical offers, offers that share an endpoint and totals beyond 32 bits."
    communication: "States the recurrence and why sorting by end time makes the prefix optimum well defined."
hints:
  - "Greedy rules such as taking the most valuable offer first can be beaten; think about deciding, offer by offer, whether to accept it or not."
  - "If offers are processed in order of their end time, the best total using the first few offers can be built from smaller answers: either skip the current offer or accept it together with the best plan among offers that finish by its start."
  - "Sort by end time, keep an array where entry i is the best revenue using the first i offers, and for each offer binary search the number of offers whose end is at most its start; the new entry is the larger of skipping (previous entry) and accepting (entry at that count plus the revenue)."
followups:
  - "How would you also return which offers to accept?"
  - "What changes if the venue has two identical halls?"
  - "How would you handle a stream of offers arriving in end-time order?"
  - "If each client also needs a 15-minute cleaning buffer after their booking, what changes?"
common_errors:
  - "Using a strict comparison in the binary search so offers that touch at an endpoint are treated as overlapping."
  - "Applying a greedy choice that maximises revenue or count instead of total revenue."
  - "Sorting by start time and then looking backwards for compatible offers, which breaks the prefix recurrence."
  - "Accumulating revenue in a 32-bit integer."
