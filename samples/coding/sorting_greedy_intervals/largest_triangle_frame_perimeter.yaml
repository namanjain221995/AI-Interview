time_limit_minutes: 15
prompt_markdown: |
  ## Largest Triangular Antenna Frame

  A field team mounts rooftop antennas on triangular steel frames. From a bin of spare stock,
  `rods[i]` is the length in millimetres of rod `i`. A frame is welded from exactly three different
  rods (three different positions in the array), one per side.

  A frame is only usable if it is not flat: **each side must be strictly shorter than the sum of the
  other two**. A bigger frame gives a wider antenna footprint, so the team wants the **largest possible
  perimeter** (sum of the three lengths) of a usable frame. Return that perimeter, or `0` if no three
  rods form a usable frame.

  - Rods with equal lengths are different rods and can be used together.
  - The result can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  rods = [4, 9, 5, 2, 3]
  Output: 12
  Explanation: 9, 5 and 4 would be flat (9 is not shorter than 5 + 4). The best usable frame is 5, 4 and 3 with perimeter 12.
  ```

  ### Example 2
  ```
  Input:  rods = [1, 2, 3]
  Output: 0
  Explanation: 1 + 2 equals 3, so the only possible frame is flat.
  ```

  ### Example 3
  ```
  Input:  rods = [6, 6, 6, 1]
  Output: 18
  Explanation: Three rods of length 6 form a usable frame with perimeter 18.
  ```

  ### Constraints
  - `0 <= rods.length <= 10^4`
  - `0 <= rods[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: largest_triangle_frame_perimeter
  params:
    - {name: rods, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def largest_triangle_frame_perimeter(rods: list[int]) -> int:
        ordered = sorted(rods, reverse=True)
        for i in range(len(ordered) - 2):
            if ordered[i] < ordered[i + 1] + ordered[i + 2]:
                return ordered[i] + ordered[i + 1] + ordered[i + 2]
        return 0
  javascript: |
    function largestTriangleFramePerimeter(rods) {
      const ordered = [...rods].sort((a, b) => b - a);
      for (let i = 0; i + 2 < ordered.length; i++) {
        if (ordered[i] < ordered[i + 1] + ordered[i + 2]) {
          return ordered[i] + ordered[i + 1] + ordered[i + 2];
        }
      }
      return 0;
    }
