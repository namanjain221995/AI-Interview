expected_concepts:
  - "sort lengths in decreasing order"
  - "only consecutive triples need checking for the maximum"
  - "with sorted sides only the largest side's inequality can fail"
  - "64-bit perimeter"
optimal_complexity: {time: "O(n log n)", space: "O(n) for the sorted copy (O(1) extra if sorting in place)"}
rubric:
  excellent: "Sorts descending, explains why for a fixed longest side the two next-longest rods are the best partners, scans consecutive triples, uses a strict inequality and a 64-bit sum."
  good: "Correct sorted solution but checks extra triples or needs a hint for why consecutive triples suffice."
  weak: "Tries all triples in O(n^3), uses a non-strict inequality, or returns the first valid triple in input order."
  criteria:
    correctness: "All tests pass, including flat triples, zeros and fewer than three rods."
    efficiency: "One sort plus a linear scan."
    code_quality: "Loop bounds that never read past the end; a single clear inequality check."
    edge_cases: "Empty input, fewer than three rods, zeros, equal lengths and perimeters beyond 32 bits."
    communication: "Explains why if the triple (a, b, c) with a as longest fails, a can be discarded entirely."
hints:
  - "If you knew which rod is the longest side, which two other rods would give it the best chance of a usable frame and the largest perimeter?"
  - "After sorting, the longest side only needs to be checked against the next two rods; if even they are too short together, that rod cannot be in any frame."
  - "Sort descending and scan i from 0: return rods[i] + rods[i + 1] + rods[i + 2] at the first i where rods[i] < rods[i + 1] + rods[i + 2], computed in 64 bits; return 0 if no i works."
followups:
  - "Why can a rod be discarded forever once it fails with its two next-longest neighbours?"
  - "What is the worst-case input where the scan reaches the end, and how long can such an input be with lengths up to 10^9?"
  - "How would you count all usable frames instead of finding the largest?"
  - "How would you find the frame with the largest area instead of perimeter?"
common_errors:
  - "Using <= instead of <, which accepts flat frames."
  - "Checking only the three longest rods and returning 0 if they fail."
  - "Overflowing a 32-bit sum on lengths near 10^9."
  - "Default lexicographic sort in JavaScript."
