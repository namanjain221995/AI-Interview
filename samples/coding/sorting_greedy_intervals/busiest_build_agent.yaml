slug: busiest_build_agent
title: Busiest Build Agent
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [platform, devops, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Busiest Build Agent

  A CI system has `agent_count` build agents numbered `0` to `agent_count - 1`. Build jobs are given as
  `jobs[i] = [start, end]`: the job is submitted at time `start` and needs `end - start` time units of
  work. All `start` values are distinct, but `jobs` is not sorted.

  The scheduler handles jobs in order of their `start` time:

  - An agent is **idle** at time `t` if it has no job running at `t`; an agent whose job finishes at
    time `t` is idle at `t`.
  - If one or more agents are idle when a job is submitted, the job runs immediately on the idle agent
    with the **lowest number**.
  - If no agent is idle, the job waits for the agent that becomes idle **first** (the lowest-numbered
    one if several become idle at the same time) and then runs on it for its **original duration**.
    Waiting jobs are served in order of their `start` time.

  Return the number of the agent that ran the **most jobs**. If several agents ran the same largest
  number of jobs, return the lowest agent number.

  ### Example 1
  ```
  Input:  agent_count = 2, jobs = [[0, 10], [1, 3], [2, 7], [4, 6], [8, 9]]
  Output: 1
  Explanation: agent 0 runs [0, 10). Agent 1 runs [1, 3), then the job submitted at 2 waits for agent 1
  and runs during [3, 8), the job submitted at 4 waits for agent 1 and runs during [8, 10), and the job
  submitted at 8 waits until time 10 when both agents are idle and goes to agent 0. Agent 1 ran 3 jobs.
  ```

  ### Example 2
  ```
  Input:  agent_count = 3, jobs = [[5, 9], [1, 20], [2, 4], [3, 8], [6, 7]]
  Output: 1
  Explanation: agents 0, 1 and 2 take the jobs submitted at 1, 2 and 3. At time 5 agent 1 is idle again
  and takes the job; at time 6 every agent is busy, and agent 2 (idle at 8) is first, so it runs the
  job during [8, 9). Agents 1 and 2 each ran 2 jobs, so 1 is returned.
  ```

  ### Constraints
  - `1 <= agent_count <= 100`
  - `1 <= jobs.length <= 10^4`
  - `0 <= start < end <= 10^5`
  - All `start` values are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: busiest_build_agent
  params:
    - {name: agent_count, type: int}
    - {name: jobs, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def busiest_build_agent(agent_count: int, jobs: list[list[int]]) -> int:
        free = list(range(agent_count))  # min-heap of idle agent numbers
        busy: list[tuple[int, int]] = []  # min-heap of (free_at, agent)
        counts = [0] * agent_count
        for start, end in sorted(jobs):
            while busy and busy[0][0] <= start:
                _, agent = heapq.heappop(busy)
                heapq.heappush(free, agent)
            if free:
                agent = heapq.heappop(free)
                heapq.heappush(busy, (end, agent))
            else:
                free_at, agent = heapq.heappop(busy)
                heapq.heappush(busy, (free_at + end - start, agent))
            counts[agent] += 1
        best = 0
        for agent in range(1, agent_count):
            if counts[agent] > counts[best]:
                best = agent
        return best
  javascript: |
    function busiestBuildAgent(agentCount, jobs) {
      class MinHeap {
        constructor(less) {
          this.items = [];
          this.less = less;
        }
        get size() {
          return this.items.length;
        }
        peek() {
          return this.items[0];
        }
        push(value) {
          const a = this.items;
          a.push(value);
          let i = a.length - 1;
          while (i > 0) {
            const p = (i - 1) >> 1;
            if (!this.less(a[i], a[p])) break;
            [a[i], a[p]] = [a[p], a[i]];
            i = p;
          }
        }
        pop() {
          const a = this.items;
          const top = a[0];
          const last = a.pop();
          if (a.length > 0) {
            a[0] = last;
            let i = 0;
            for (;;) {
              const l = 2 * i + 1;
              const r = l + 1;
              let m = i;
              if (l < a.length && this.less(a[l], a[m])) m = l;
              if (r < a.length && this.less(a[r], a[m])) m = r;
              if (m === i) break;
              [a[i], a[m]] = [a[m], a[i]];
              i = m;
            }
          }
          return top;
        }
      }
      const free = new MinHeap((x, y) => x < y);
      for (let a = 0; a < agentCount; a++) free.push(a);
      const busy = new MinHeap((x, y) => x[0] < y[0] || (x[0] === y[0] && x[1] < y[1]));
      const counts = new Array(agentCount).fill(0);
      const order = jobs.slice().sort((x, y) => x[0] - y[0]);
      for (const [start, end] of order) {
        while (busy.size > 0 && busy.peek()[0] <= start) free.push(busy.pop()[1]);
        let agent;
        if (free.size > 0) {
          agent = free.pop();
          busy.push([end, agent]);
        } else {
          const [freeAt, a] = busy.pop();
          agent = a;
          busy.push([freeAt + end - start, agent]);
        }
        counts[agent]++;
      }
      let best = 0;
      for (let a = 1; a < agentCount; a++) if (counts[a] > counts[best]) best = a;
      return best;
    }
