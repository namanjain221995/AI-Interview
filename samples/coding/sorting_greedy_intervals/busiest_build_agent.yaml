expected_concepts:
  - "sorting jobs by submission time"
  - "min-heap of idle agent numbers"
  - "min-heap of busy agents keyed by (time idle, agent number)"
  - "releasing every agent that is idle by the current start before assigning"
  - "delayed jobs keep their duration, so their end time shifts"
optimal_complexity: {time: "O(n log n + n log k)", space: "O(n + k)"}
rubric:
  excellent: "Sorts by start, uses one heap of idle agent numbers and one heap of busy agents ordered by (idle time, number), releases all agents idle by each start before assigning, shifts delayed jobs by their duration and applies both tie-breaks correctly."
  good: "Simulates correctly with the two heaps after a hint, or uses an O(n * k) scan over agents per job with correct rules and tie-breaks."
  weak: "Picks the agent that became idle first even when several are idle, drops waiting jobs, uses the original end time for delayed jobs, or does not sort the input."
  criteria:
    correctness: "All tests pass, including exact-release times, delayed chains and tie-breaks on both heaps and on the final count."
    efficiency: "Each job causes O(log k) heap work after sorting; no per-time-unit simulation."
    code_quality: "Two clearly named heaps with explicit ordering and a separate count array."
    edge_cases: "One agent, more agents than jobs, agents freed exactly at a start time and ties in the final count."
    communication: "Explains why releasing idle agents into a heap by number is needed for the lowest-number rule."
hints:
  - "Process the jobs in start order and keep track, for every agent, of when it becomes idle; the rules only ever need the lowest-numbered idle agent or the agent that becomes idle first."
  - "Use two priority queues: one with the numbers of idle agents and one with busy agents ordered by when they become idle and then by number; before assigning a job, move every agent idle by its start time into the first queue."
  - "For each job, release all busy agents whose idle time is at most the start; if an idle agent exists take the smallest number and mark it busy until end, otherwise pop the earliest busy agent and push it back with its idle time plus the job's duration; count jobs per agent and return the first agent with the highest count."
followups:
  - "How would you report the time each job actually finished?"
  - "What changes if waiting jobs are dropped instead of delayed?"
  - "How would you support agents with different speeds?"
  - "What would you change if jobs arrived as an unbounded stream?"
common_errors:
  - "Choosing the agent that became idle earliest when several agents are idle, instead of the lowest number."
  - "Releasing only one busy agent per job, so agents that are already idle are missed."
  - "Running a delayed job until its original end time instead of shifting it by its duration."
  - "Treating an agent that finishes exactly at the start time as still busy."
