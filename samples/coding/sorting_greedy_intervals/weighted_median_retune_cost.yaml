expected_concepts:
  - "the optimal final configuration is a band [low, low + spread] with each device clamped into it"
  - "convex piecewise-linear cost as a function of the band position"
  - "weighted median (of the settings and the settings shifted by spread)"
  - "sorting with cumulative weights or a slope sweep over breakpoints"
  - "64-bit cost accumulation"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Argues that some band [low, low + spread] contains the optimal final settings and each device moves to its nearest band point, recognises the cost as convex in low with breakpoints at s and s - spread, finds the minimum with a weighted median or a slope sweep, uses 64-bit totals and states O(n log n)."
  good: "Reduces to choosing the band position and sweeps the candidate breakpoints with prefix sums, or solves spread = 0 by weighted median and generalises with some prompting."
  weak: "Uses the plain or unweighted median, the weighted average, only tries bands starting at existing settings, or scans every integer position."
  criteria:
    correctness: "All tests pass, including spread 0, a spread that already covers the range and bands that start between settings."
    efficiency: "O(n log n) from sorting the 2n breakpoints; evaluating the cost once is linear."
    code_quality: "Clamping into the band is expressed once; breakpoint weights are explicit."
    edge_cases: "Single thermostat, equal settings, very large costs and distances, even total weight ties."
    communication: "Explains why the cost is convex in the band position and why its minimum is at a weighted median of the breakpoints."
hints:
  - "Once you decide where the lowest allowed final setting sits, every thermostat's best move is forced: leave it alone if it is inside the allowed band, otherwise move it to the nearest edge."
  - "As the band slides one unit to the right, the cost changes by the total cost of thermostats below the band minus the total cost of thermostats above it, so the cost is convex in the band position and only changes slope at a setting or a setting minus spread."
  - "Collect each setting and each setting minus spread as breakpoints weighted by that thermostat's cost, sort them, and walk through the cumulative weight until it reaches half of the total; put the bottom of the band at that breakpoint, then add up each thermostat's cost times its distance to the band in a 64-bit total."
followups:
  - "Why is the cost convex in the band position, and why does that guarantee the weighted median is optimal?"
  - "How would you answer many queries with different spread values efficiently?"
  - "What changes if raising a setting and lowering it have different costs per unit?"
  - "If settings may only end at multiples of 5, how would you adapt the answer?"
common_errors:
  - "Using the unweighted median, which ignores the per-unit costs."
  - "Using the weighted average, which minimises squared distance rather than total cost."
  - "Only trying bands that start at an existing setting, missing bands that end at one."
  - "Moving every thermostat to the band centre instead of the nearest band edge."
  - "Accumulating the total in 32-bit integers."
