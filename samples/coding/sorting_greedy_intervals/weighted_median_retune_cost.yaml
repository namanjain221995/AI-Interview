prompt_markdown: |
  ## Retune Thermostats into a Comfort Band

  A building-automation team wants the thermostats on one floor to agree. Thermostat `i` is currently
  set to `settings[i]` (in tenths of a degree), and changing it by one unit in either direction costs
  `cost[i]` (some units sit behind locked panels and need a technician). Each thermostat may be retuned
  to any **integer** setting.

  After retuning, the **highest and lowest settings on the floor may differ by at most `spread`**. A
  thermostat whose final setting differs from its current one by `d` units costs `d * cost[i]`. Return
  the **minimum total cost** of a retuning that satisfies the rule (it is `0` if the floor already
  complies). With `spread = 0` every thermostat must end at the same setting.

  ### Example 1
  ```
  Input:  settings = [18, 25, 21, 30], cost = [1, 1, 1, 1], spread = 4
  Output: 8
  Explanation: move everything into the band [21, 25]: 18 -> 21 costs 3 and 30 -> 25 costs 5, total 8.
  No other band of width 4 is cheaper.
  ```

  ### Example 2
  ```
  Input:  settings = [10, 40, 25], cost = [5, 1, 2], spread = 0
  Output: 60
  Explanation: set everything to 10: 30 * 1 + 15 * 2 = 60.
  ```

  ### Constraints
  - `1 <= settings.length == cost.length <= 10^5`
  - `0 <= settings[i] <= 10^6`
  - `1 <= cost[i] <= 10^4`
  - `0 <= spread <= 10^6`
  - The answer fits in a signed 64-bit integer (it can exceed `2^31 - 1`).

  **Follow-up:** trying every possible band position is far too slow for settings up to `10^6`. Can you do it in `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: weighted_median_retune_cost
  params:
    - {name: settings, type: "int[]"}
    - {name: cost, type: "int[]"}
    - {name: spread, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def weighted_median_retune_cost(settings: list[int], cost: list[int], spread: int) -> int:
        # Final band is [low, low + spread]; a thermostat at s costs c * (max(0, low - s) + max(0, s - spread - low)),
        # which equals c / 2 * (|low - s| + |low - (s - spread)| - spread). Minimise over low with a weighted median.
        points = sorted([(s, c) for s, c in zip(settings, cost)] + [(s - spread, c) for s, c in zip(settings, cost)])
        half = sum(cost)  # total weight of all points is 2 * sum(cost)
        running = 0
        low = points[0][0]
        for value, weight in points:
            running += weight
            if running >= half:
                low = value
                break
        high = low + spread
        return sum(c * max(0, low - s, s - high) for s, c in zip(settings, cost))
  javascript: |
    function weightedMedianRetuneCost(settings, cost, spread) {
      const points = [];
      for (let i = 0; i < settings.length; i++) {
        points.push([settings[i], cost[i]], [settings[i] - spread, cost[i]]);
      }
      points.sort((a, b) => a[0] - b[0]);
      const half = cost.reduce((acc, c) => acc + c, 0);
      let running = 0;
      let low = points[0][0];
      for (const [value, weight] of points) {
        running += weight;
        if (running >= half) {
          low = value;
          break;
        }
      }
      const high = low + spread;
      let total = 0;
      for (let i = 0; i < settings.length; i++) {
        total += cost[i] * Math.max(0, low - settings[i], settings[i] - high);
      }
      return total;
    }
