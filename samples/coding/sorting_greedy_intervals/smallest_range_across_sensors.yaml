expected_concepts:
  - "merging all readings into one sorted sequence tagged with the sensor"
  - "sliding window over the merged sequence"
  - "per-sensor counts to track how many distinct sensors are inside the window"
  - "shrinking the window from the left while the quorum still holds"
  - "tie-breaking on the smaller start"
optimal_complexity: {time: "O(N log N)", space: "O(N)"}
rubric:
  excellent: "Merges the readings into one sorted list tagged by sensor, runs a two-pointer window with per-sensor counts and a distinct-sensor counter, records the band each time the quorum holds while shrinking, applies the tie rule and explains why the optimal band starts and ends at readings; O(N log N)."
  good: "Correct merge-and-window solution with small slips fixed after testing (tie-breaking or duplicate readings from one sensor), or a heap-based variant that only handles quorum equal to the number of sensors and is then generalised with prompting."
  weak: "Tries every pair of readings as band ends and counts sensors each time (cubic), counts readings instead of distinct sensors, or ignores the tie rule."
  criteria:
    correctness: "All tests pass, including repeated readings from one sensor, quorum 1 and ties in width."
    efficiency: "One sort plus a linear two-pointer pass; each reading enters and leaves the window once."
    code_quality: "Readings keep their sensor tag; counters are updated symmetrically when entering and leaving the window."
    edge_cases: "Single sensor, quorum 1, quorum equal to the sensor count, negative and extreme values."
    communication: "Explains why the window can be shrunk greedily and why both band edges can be taken from readings."
hints:
  - "An optimal band can always be shrunk until both of its edges are actual readings, so think in terms of readings from all sensors laid out on one number line."
  - "Put every reading on one sorted line, remembering which sensor it came from; a band is then a contiguous stretch of that line, and you need the shortest stretch that touches enough different sensors."
  - "Use two pointers over the merged sorted readings with a count per sensor and a counter of sensors currently present; extend the right pointer, and while at least quorum sensors are present record the band from the left reading to the right reading if it is narrower (or equally narrow with a smaller start), then drop the left reading and advance."
followups:
  - "If quorum always equalled the number of sensors, how could a heap holding one pointer per sensor solve it without merging everything?"
  - "How would you handle readings that arrive as live streams per sensor?"
  - "What changes if each sensor's readings were unsorted?"
  - "How would you report which sensors agree inside the returned band?"
common_errors:
  - "Counting readings instead of distinct sensors, so one chatty sensor satisfies the quorum alone."
  - "Forgetting to decrement the distinct-sensor counter only when a sensor's count drops to zero."
  - "Breaking ties by the larger start or by the first band found in an arbitrary order."
  - "Trying every pair of readings as edges and rescanning all sensors, which is far too slow."
  - "Assuming the band edges can be arbitrary integers and searching over values instead of readings."
