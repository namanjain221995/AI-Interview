slug: smallest_range_across_sensors
title: "Tightest Reading Range for a Sensor Quorum"
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [data, backend, ml]
time_limit_minutes: 30
prompt_markdown: |
  ## Tightest Reading Range for a Sensor Quorum

  A calibration job checks whether a fleet of temperature sensors agree. Sensor `i` reported the values
  `readings[i]` (in hundredths of a degree), listed in non-decreasing order; a sensor may report the same
  value more than once. The job accepts a band of values `[a, b]` (inclusive, `a <= b`) as a **consensus
  band** when at least `quorum` **different** sensors each have at least one reading inside it.

  Return the narrowest consensus band as `[a, b]`, i.e. the one with the smallest `b - a`. If several
  bands are equally narrow, return the one with the smallest `a`. Readings from the same sensor count
  only once towards the quorum, no matter how many of them fall inside the band.

  ### Example 1
  ```
  Input:  readings = [[4, 10, 15, 24], [0, 9, 12, 20], [5, 18, 22, 30]], quorum = 3
  Output: [20, 24]
  Explanation: [20, 24] holds 24, 20 and 22, one reading from each sensor (width 4).
  No narrower band contains a reading from all three sensors.
  ```

  ### Example 2
  ```
  Input:  readings = [[1, 2, 3], [40, 41], [44, 50]], quorum = 2
  Output: [41, 44]
  Explanation: [1, 3] has width 2 but only one sensor; [41, 44] is the narrowest band covering two sensors (width 3).
  ```

  ### Example 3
  ```
  Input:  readings = [[7, 30], [12, 30], [25]], quorum = 2
  Output: [30, 30]
  Explanation: both of the first two sensors reported 30, so [30, 30] (width 0) is a consensus band.
  ```

  ### Constraints
  - `1 <= readings.length <= 1000`
  - `1 <= readings[i].length <= 100`
  - `-10^9 <= readings[i][j] <= 10^9`
  - Each `readings[i]` is sorted in non-decreasing order.
  - `1 <= quorum <= readings.length`

  **Follow-up:** with `N` readings in total, can you find the band in `O(N log N)` (or `O(N log k)` for `k` sensors) time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smallest_range_across_sensors
  params:
    - {name: readings, type: "int[][]"}
    - {name: quorum, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def smallest_range_across_sensors(readings: list[list[int]], quorum: int) -> list[int]:
        merged = sorted((value, sensor) for sensor, values in enumerate(readings) for value in values)
        counts = [0] * len(readings)
        present = 0
        best: list[int] = []
        left = 0
        for value, sensor in merged:
            if counts[sensor] == 0:
                present += 1
            counts[sensor] += 1
            while present >= quorum:
                low = merged[left][0]
                if not best or value - low < best[1] - best[0] or (value - low == best[1] - best[0] and low < best[0]):
                    best = [low, value]
                dropped = merged[left][1]
                counts[dropped] -= 1
                if counts[dropped] == 0:
                    present -= 1
                left += 1
        return best
  javascript: |
    function smallestRangeAcrossSensors(readings, quorum) {
      const merged = [];
      readings.forEach((values, sensor) => {
        for (const value of values) merged.push([value, sensor]);
      });
      merged.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const counts = new Array(readings.length).fill(0);
      let present = 0;
      let best = null;
      let left = 0;
      for (const [value, sensor] of merged) {
        if (counts[sensor] === 0) present++;
        counts[sensor]++;
        while (present >= quorum) {
          const low = merged[left][0];
          const width = value - low;
          if (best === null || width < best[1] - best[0] || (width === best[1] - best[0] && low < best[0])) {
            best = [low, value];
          }
          const dropped = merged[left][1];
          counts[dropped]--;
          if (counts[dropped] === 0) present--;
          left++;
        }
      }
      return best;
    }
