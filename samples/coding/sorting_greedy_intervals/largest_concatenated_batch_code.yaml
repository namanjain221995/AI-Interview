expected_concepts:
  - custom comparator on string concatenation (a + b versus b + a)
  - why plain lexicographic or numeric sorting fails
  - handling the all-zero result
  - transitivity of the comparator
optimal_complexity: {time: "O(n log n * d) where d is the number of digits", space: "O(n * d)"}
rubric:
  excellent: "Sorts the decimal strings with the comparator a + b > b + a, handles the all-zero case, explains with an exchange argument why the order is optimal, and gives O(n log n * d) time."
  good: "Correct comparator-based sort after testing a few cases, with a hint needed for the all-zero case or the justification."
  weak: "Sorts numerically or lexicographically, pads strings, or tries all permutations."
  criteria:
    correctness: "All tests pass, including shared prefixes, zeros and very large concatenations."
    efficiency: "Sort-based solution; never converts the result to a number or enumerates permutations."
    code_quality: "Comparator is small and symmetric; result built with a single join."
    edge_cases: "All zeros, zeros mixed with other parts, prefixes such as 12 and 121, single part."
    communication: "Explains why comparing the two possible concatenations decides the relative order of a pair."
hints:
  - "Sorting the numbers by value or by text does not work for cases like 4 and 40 - think about what really decides which of two parts should come first."
  - "For two parts a and b, only two placements matter: a followed by b, or b followed by a. Compare those two strings."
  - "Convert every part to a string, sort with a comparator that puts a before b when a + b is larger than b + a, join the sorted strings, and return \"0\" if the result starts with 0."
followups:
  - "Why is the comparator a + b versus b + a transitive, so that sorting with it is valid?"
  - "How would you return the smallest possible code instead, and what changes about leading zeros?"
  - "How does the cost change if part numbers can have thousands of digits?"
common_errors:
  - "Sorting strings in reverse lexicographic order, which puts 30 before 3."
  - "Forgetting the all-zero case and returning \"00\"."
  - "Converting the result to an integer, which overflows or drops leading digits."
  - "Comparing only the first digit of each part."
