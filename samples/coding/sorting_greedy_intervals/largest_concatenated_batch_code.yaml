slug: largest_concatenated_batch_code
title: "Largest Concatenated Batch Code"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Largest Concatenated Batch Code

  A packaging line prints a batch code on every pallet by writing the decimal forms of the pallet's part
  numbers one after another, with no separators. The part numbers may be written in **any order**, and
  the plant wants the code that is **numerically largest**.

  Given the part numbers `parts`, return the largest possible batch code as a string. Every part number
  is used exactly once and written in its normal decimal form (no leading zeros of its own). The returned
  code must not start with `0` unless it is exactly `"0"`, which happens when every part number is `0`.

  ### Example 1
  ```
  Input:  parts = [7, 30, 34, 5, 9]
  Output: "9753430"
  ```

  ### Example 2
  ```
  Input:  parts = [40, 404, 4]
  Output: "440440"
  Explanation: "4" + "404" + "40" beats every other order, for example "404" + "40" + "4" = "404404".
  ```

  ### Example 3
  ```
  Input:  parts = [0, 0]
  Output: "0"
  ```

  ### Constraints
  - `1 <= parts.length <= 100`
  - `0 <= parts[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: largest_concatenated_batch_code
  params:
    - {name: parts, type: "int[]"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    from functools import cmp_to_key


    def largest_concatenated_batch_code(parts: list[int]) -> str:
        texts = [str(p) for p in parts]

        def compare(a: str, b: str) -> int:
            if a + b > b + a:
                return -1
            if a + b < b + a:
                return 1
            return 0

        texts.sort(key=cmp_to_key(compare))
        code = "".join(texts)
        return "0" if code[0] == "0" else code
  javascript: |
    function largestConcatenatedBatchCode(parts) {
      const texts = parts.map(String);
      texts.sort((a, b) => {
        const ab = a + b;
        const ba = b + a;
        if (ab > ba) return -1;
        if (ab < ba) return 1;
        return 0;
      });
      const code = texts.join("");
      return code[0] === "0" ? "0" : code;
    }
