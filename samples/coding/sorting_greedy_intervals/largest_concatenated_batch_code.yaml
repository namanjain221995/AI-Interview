  - {id: t2, args: [[40, 404, 4]], expected: "440440", description: "Example 2 - shared prefixes where length-based or lexicographic sort fails"}
  - {id: t3, args: [[0, 0]], expected: "0", description: "Example 3 - all zeros collapse to a single 0"}
