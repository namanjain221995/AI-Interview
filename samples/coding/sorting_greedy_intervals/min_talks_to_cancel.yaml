slug: min_talks_to_cancel
title: Minimum Talks to Cancel
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, project_manager]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Talks to Cancel

  A conference runs a **single track**, so only one talk can be on stage at a time. The programme
  committee has accepted more proposals than fit. Each talk is a slot `[start, end)` in minutes after
  the venue opens: it occupies the stage from `start` up to, but **not including**, `end`.

  Two talks conflict when their slots overlap. A talk that ends at minute `x` and another that starts at
  minute `x` do **not** conflict, so back-to-back talks are allowed.

  Return the **minimum number of talks** that must be cancelled so that no two of the remaining talks
  conflict.

  - The list is not sorted and may contain several talks with identical slots.
  - An empty list needs no cancellations, so the answer is `0`.

  ### Example 1
  ```
  Input:  talks = [[9, 11], [10, 12], [11, 13], [9, 13]]
  Output: 2
  Explanation: keep [9, 11] and [11, 13] (back to back); cancel [10, 12] and [9, 13].
  ```

  ### Example 2
  ```
  Input:  talks = [[1, 3], [3, 5], [5, 7]]
  Output: 0
  ```

  ### Example 3
  ```
  Input:  talks = [[4, 8], [4, 8], [4, 8]]
  Output: 2
  ```

  ### Constraints
  - `0 <= talks.length <= 10^4`
  - `talks[i].length == 2`
  - `0 <= start < end <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_talks_to_cancel
  params:
    - {name: talks, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_talks_to_cancel(talks: list[list[int]]) -> int:
        kept = 0
        stage_free_at = None
        # Always keep the talk that frees the stage earliest.
        for start, end in sorted(talks, key=lambda talk: talk[1]):
            if stage_free_at is None or start >= stage_free_at:
                kept += 1
                stage_free_at = end
        return len(talks) - kept
  javascript: |
    function minTalksToCancel(talks) {
      const byEnd = talks.slice().sort((a, b) => a[1] - b[1]);
      let kept = 0;
      let stageFreeAt = -Infinity;
      for (const [start, end] of byEnd) {
        if (start >= stageFreeAt) {
          kept += 1;
          stageFreeAt = end;
        }
      }
      return talks.length - kept;
    }
