expected_concepts:
  - sort talks by end time
  - greedy choice of the talk that frees the stage earliest
  - exchange argument for why earliest end is safe
  - half-open slots so back-to-back talks do not conflict
  - cancellations equal total talks minus the maximum kept
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Reframes the task as keeping the most compatible talks, sorts by end time, justifies the greedy with an exchange argument, handles back-to-back and identical slots, and states O(n log n) time.
  good: Implements the end-time greedy correctly with minor prompting and gives the right complexity, but the justification is informal.
  weak: Sorts by start time or by duration, treats back-to-back talks as conflicts, or only reaches an exponential subset search.
  criteria:
    correctness: All tests pass, including a long talk that spans many short ones and identical slots.
    efficiency: One sort plus a linear scan; no quadratic pairwise conflict checks.
    code_quality: Clear names for the last kept end time and the count of kept talks; the answer is derived as total minus kept.
    edge_cases: Empty list, a single talk, identical slots and talks that touch at an endpoint.
    communication: Explains why picking the earliest-finishing talk never hurts the rest of the schedule.
hints:
  - Instead of choosing which talks to cancel, think about the largest set of talks you can keep; the cancellations are everything else.
  - Among all talks, which one is the safest to keep first? Consider the property that leaves the most room for the talks that follow.
  - Sort the talks by end time and walk through them, keeping a talk whenever it starts at or after the end of the last talk you kept; the answer is the number of talks minus the number kept.
followups:
  - Why does sorting by start time or by shortest duration give wrong answers? Construct a counterexample.
  - If each talk had a priority score and you wanted to maximise the total score kept, how would the approach change?
  - How would you extend this to a venue with two parallel stages?
  - How would you return which talks to cancel rather than just how many?
common_errors:
  - Sorting by start time and keeping the first talk, which fails when one long talk spans several short ones.
  - Using a strict comparison so that back-to-back talks are treated as conflicts.
  - Returning the number of kept talks instead of the number cancelled.
  - Sorting by duration, which can keep a short talk that blocks two others.
