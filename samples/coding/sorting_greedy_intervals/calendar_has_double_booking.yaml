expected_concepts:
  - "sort bookings by start time"
  - "compare each booking only with its predecessor after sorting"
  - "half-open interval semantics (touching is not overlapping)"
  - "O(n log n) versus O(n^2) pairwise comparison"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Starts from the pairwise check, explains why sorting by start makes adjacent comparisons sufficient, applies the strict less-than for half-open ranges and states O(n log n) time."
  good: "Sorts and checks neighbours correctly with minor prompting on the touching case or on the complexity."
  weak: "Stays with an untested pairwise loop, treats touching bookings as conflicts, or compares against the wrong neighbour."
  criteria:
    correctness: "All tests pass, including identical bookings, nested bookings and bookings that only touch."
    efficiency: "Sorting followed by one linear pass; the quadratic baseline is named and improved on."
    code_quality: "Clear names for the sorted list and the previous end, early return on the first conflict, input not mutated unexpectedly."
    edge_cases: "Empty and single-booking calendars return false; equal start times are recognised as a conflict."
    communication: "Justifies why a conflict between non-neighbours implies a conflict between neighbours once sorted."
hints:
  - "If the bookings were listed in time order, where would a conflict have to show up?"
  - "After sorting by start time, a booking can only clash with something that started earlier; think about which earlier booking is the one to check."
  - "Sort by start, then walk the list once and report a conflict as soon as a booking starts strictly before the previous booking ends; a start equal to the previous end is fine."
followups:
  - "Why is checking only adjacent bookings enough once they are sorted by start time?"
  - "How would you return the minimum number of rooms needed instead of a yes or no answer?"
  - "What changes if bookings were closed ranges where touching endpoints do conflict?"
  - "How would you check a new booking against an existing calendar in better than linear time?"
common_errors:
  - "Using less-than-or-equal and flagging bookings that only touch as conflicts."
  - "Sorting by end time and then comparing the wrong pair of fields."
  - "Comparing every pair of bookings in O(n^2) without considering sorting."
  - "Forgetting that two bookings with the same start time always overlap."
