version: 1
slug: calendar_has_double_booking
title: Room Calendar Double-Booking Check
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, fullstack, frontend]
time_limit_minutes: 12
prompt_markdown: |
  ## Room Calendar Double-Booking Check

  A facilities team exports the calendar of one meeting room before migrating it to a new booking
  system. Each booking is a pair `[start, end]` measured in minutes from the start of the export
  period and means the half-open range `[start, end)`: the room is taken from minute `start` up to,
  but not including, minute `end`. The export is in **no particular order**.

  Return `true` if at least two bookings overlap, meaning some minute is covered by both of them.
  Bookings that only touch, such as `[540, 600]` and `[600, 660]`, do **not** conflict. Return
  `false` when no two bookings overlap, including for an empty calendar or a calendar with a single
  booking.

  ### Example 1
  ```
  Input:  meetings = [[540, 600], [600, 660], [480, 540]]
  Output: false
  Explanation: Sorted by start: [480, 540], [540, 600], [600, 660]. Each booking ends exactly when the next starts.
  ```

  ### Example 2
  ```
  Input:  meetings = [[60, 120], [0, 90], [200, 230]]
  Output: true
  Explanation: [0, 90] and [60, 120] both cover minutes 60 to 89.
  ```

  ### Constraints
  - `0 <= meetings.length <= 10^4`
  - `meetings[i].length == 2`
  - `0 <= start < end <= 10^6` (every booking lasts at least one minute)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: calendar_has_double_booking
  params:
    - {name: meetings, type: "int[][]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def calendar_has_double_booking(meetings: list[list[int]]) -> bool:
        ordered = sorted(meetings)
        for i in range(1, len(ordered)):
            if ordered[i][0] < ordered[i - 1][1]:
                return True
        return False
  javascript: |
    function calendarHasDoubleBooking(meetings) {
      const ordered = meetings.map((m) => [m[0], m[1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      for (let i = 1; i < ordered.length; i++) {
        if (ordered[i][0] < ordered[i - 1][1]) return true;
      }
      return false;
    }
