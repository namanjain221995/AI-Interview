version: 1
slug: shuttle_capacity_check
title: Shuttle Capacity Check
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, general, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Shuttle Capacity Check

  A campus shuttle drives in one direction along a road marked with kilometre posts `0` to `1000`; it
  never turns back. The booking service has collected ride requests for the next run:
  `trips[i] = [riders, pickup_km, dropoff_km]` means a group of `riders` people boards at `pickup_km`
  and leaves at `dropoff_km`.

  A group occupies seats from its pickup marker up to, but not including, its drop-off marker: at any
  marker, the groups getting off leave **before** new groups board. Return `true` if every request can
  be accepted without the number of riders on board ever exceeding `capacity` seats, otherwise `false`.

  - Requests are listed in booking order, not by pickup marker.
  - With no requests the answer is `true`.

  ### Example 1
  ```
  Input:  trips = [[2, 0, 4], [3, 2, 7]], capacity = 4
  Output: false
  Explanation: Between km 2 and km 4 both groups are on board: 2 + 3 = 5 riders, more than 4 seats.
  ```

  ### Example 2
  ```
  Input:  trips = [[3, 2, 6], [2, 6, 9], [4, 4, 8]], capacity = 7
  Output: true
  Explanation: At most 7 riders are on board (km 4 to 6); at km 6 the group of 3 leaves before the group of 2 boards.
  ```

  ### Constraints
  - `0 <= trips.length <= 1000`
  - `trips[i].length == 3`
  - `1 <= riders <= 100`
  - `0 <= pickup_km < dropoff_km <= 1000`
  - `1 <= capacity <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shuttle_capacity_check
  params:
    - {name: trips, type: "int[][]"}
    - {name: capacity, type: "int"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def shuttle_capacity_check(trips: list[list[int]], capacity: int) -> bool:
        change = [0] * 1002
        for riders, pickup, dropoff in trips:
            change[pickup] += riders
            change[dropoff] -= riders
        on_board = 0
        for delta in change:
            on_board += delta
            if on_board > capacity:
                return False
        return True
  javascript: |
    function shuttleCapacityCheck(trips, capacity) {
      const events = [];
      for (const [riders, pickup, dropoff] of trips) {
        events.push([pickup, riders]);
        events.push([dropoff, -riders]);
      }
      // At the same marker, drop-offs (negative) are processed before pickups.
      events.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      let onBoard = 0;
      for (const [, delta] of events) {
        onBoard += delta;
        if (onBoard > capacity) return false;
      }
      return true;
    }
