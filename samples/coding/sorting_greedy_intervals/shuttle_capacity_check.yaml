expected_concepts:
  - "difference array (or sorted boarding/leaving events)"
  - "half-open interval [pickup, dropoff)"
  - "processing drop-offs before pickups at the same marker"
  - "prefix sum of rider changes compared with capacity"
optimal_complexity: {time: "O(n + L) with a difference array over L = 1001 markers (O(n log n) with sorted events)", space: "O(L) or O(n)"}
rubric:
  excellent: "Uses a difference array over the bounded markers (or sorted events with drop-offs first), explains the half-open interval rule and states both complexities."
  good: "Correct sorted-events or per-marker solution with a minor fix on the tie rule."
  weak: "Simulates each trip by incrementing every marker it covers without noting the cost, counts riders on [pickup, dropoff] inclusively, or ignores unsorted input."
  criteria:
    correctness: "All tests pass, including back-to-back groups at shared markers and unsorted requests."
    efficiency: "O(n + L) or O(n log n); avoids per-kilometre updates for every trip."
    code_quality: "Clear separation of building the changes and scanning them."
    edge_cases: "Empty input, exact capacity, a single oversized group and boundary markers 0 and 1000."
    communication: "States the tie-breaking rule at shared markers and why it matches the half-open interval."
hints:
  - "The rider count only changes at pickup and drop-off markers. What happens to it at each one?"
  - "Record +riders at the pickup marker and -riders at the drop-off marker, then walk the markers in order keeping a running total."
  - "Because markers are bounded by 1000, use an array of size 1001 for the changes, add riders at pickup and subtract at drop-off, then take a running sum and return false as soon as it exceeds capacity; with sorted events instead, place drop-offs before pickups at equal markers."
followups:
  - "What if markers could be as large as 10^9 - which approach still works?"
  - "How would you return the first marker where the shuttle is over capacity?"
  - "How would you accept as many requests as possible instead of all-or-nothing?"
  - "What changes if riders occupy seats on the closed interval [pickup, dropoff]?"
common_errors:
  - "Treating the drop-off marker as occupied, which rejects valid back-to-back trips."
  - "Sorting events by marker only, so a pickup can be processed before a drop-off at the same marker."
  - "Assuming requests arrive sorted by pickup marker."
  - "Checking only each trip's pickup point against trips that started earlier, missing later overlaps."
