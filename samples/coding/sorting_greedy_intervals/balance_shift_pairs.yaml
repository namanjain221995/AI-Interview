expected_concepts:
  - "sorting the loads"
  - "the number of single-shift rotations is fixed at 2 * rotations - n"
  - "the heaviest shifts should be the singles"
  - "pairing the smallest remaining with the largest remaining (exchange argument)"
optimal_complexity: {time: "O(n log n)", space: "O(n) for the sorted copy (O(1) extra if sorting in place)"}
rubric:
  excellent: "Derives that exactly 2 * rotations - n rotations hold one shift, gives those to the heaviest shifts, pairs the rest smallest-with-largest, includes the heaviest single in the maximum and justifies both choices; states O(n log n)."
  good: "Reaches the sort, singles and pairing structure with a hint, or gets it right without a clear argument for why the heaviest shifts go alone."
  weak: "Pairs neighbours after sorting, pairs the heaviest shifts together, forgets the single-shift rotations, or tries all assignments."
  criteria:
    correctness: "All tests pass, including one shift, one rotation per shift and fully paired inputs."
    efficiency: "One sort plus a linear pass."
    code_quality: "The number of singles and the paired range are computed once and named clearly."
    edge_cases: "rotations equal to n, rotations equal to n / 2, a single shift and large loads."
    communication: "Explains with an exchange argument why heavy shifts go alone and why pairs are formed from opposite ends."
hints:
  - "Count how many rotations must cover two shifts and how many cover only one; that number is fixed by n and rotations."
  - "The single-shift rotations should go to the heaviest shifts. For the shifts that remain, think about which partner the heaviest remaining shift should get."
  - "Sort the loads, let singles = 2 * rotations - n and give the top singles shifts their own rotation; pair the remaining prefix by matching its first element with its last, its second with its second-to-last and so on, and return the larger of the heaviest shift and the largest pair sum."
followups:
  - "Prove that giving the heaviest shifts their own rotations never hurts."
  - "How would you return the actual assignment with the original shift indices?"
  - "What changes if a rotation may cover up to three shifts?"
  - "If loads are small integers, can you avoid a comparison sort?"
common_errors:
  - "Pairing adjacent shifts after sorting, which puts two heavy shifts together."
  - "Pairing across the whole array and ignoring that some rotations take a single shift."
  - "Forgetting that a single heavy shift can itself be the busiest rotation."
  - "Using the default lexicographic sort in JavaScript."
