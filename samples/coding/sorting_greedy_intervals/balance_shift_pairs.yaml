title: Balance Shifts Across Rotations
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, backend, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Balance Shifts Across Rotations

  An incident-response group staffs a fixed number of on-call `rotations`. Next month has
  `loads.length` shifts, and `loads[i]` is the number of pages forecast for shift `i`. Each shift goes to
  exactly one rotation, and every rotation covers **one or two** shifts (never more, never none). The
  workload of a rotation is the total number of pages of the shifts it covers.

  Assign the shifts so that the busiest rotation's workload is as small as possible, and return that
  workload.

  - `rotations` is always large enough: `2 * rotations >= loads.length`, and never larger than the number
    of shifts.
  - Which shifts share a rotation does not depend on their positions in the array.
  - Only the workload is returned, not the assignment.

  ### Example 1
  ```
  Input:  loads = [6, 1, 4, 2, 7], rotations = 3
  Output: 7
  Explanation: Shift 7 gets its own rotation; the others pair as (1, 6) and (2, 4), so the busiest rotation has 7 pages.
  ```

  ### Example 2
  ```
  Input:  loads = [5, 3, 2, 4], rotations = 2
  Output: 7
  Explanation: With two rotations every shift must be paired: (2, 5) and (3, 4) both have 7 pages.
  ```

  ### Example 3
  ```
  Input:  loads = [9, 2, 8, 3, 1], rotations = 4
  Output: 9
  Explanation: Only one rotation can take two shifts; pairing 1 with 2 keeps every rotation at or below 9.
  ```

  ### Constraints
  - `1 <= loads.length <= 10^5`
  - `ceil(loads.length / 2) <= rotations <= loads.length`
  - `0 <= loads[i] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: balance_shift_pairs
  params:
    - {name: loads, type: "int[]"}
    - {name: rotations, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def balance_shift_pairs(loads: list[int], rotations: int) -> int:
        ordered = sorted(loads)
        n = len(ordered)
        paired = 2 * (n - rotations)  # the smallest `paired` shifts are covered two per rotation
        worst = ordered[-1]  # the heaviest shift always sits in some rotation
        for i in range(paired // 2):
            worst = max(worst, ordered[i] + ordered[paired - 1 - i])
        return worst
  javascript: |
    function balanceShiftPairs(loads, rotations) {
      const ordered = [...loads].sort((a, b) => a - b);
      const n = ordered.length;
      const singles = 2 * rotations - n; // rotations that cover only one shift
      let worst = ordered[n - 1];
      let lo = 0;
      let hi = n - 1 - singles;
      while (lo < hi) {
        worst = Math.max(worst, ordered[lo] + ordered[hi]);
        lo += 1;
        hi -= 1;
      }
      return worst;
    }
