version: 1
slug: xor_of_ticket_range
title: "XOR of a Ticket Range"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, security, general, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## XOR of a Ticket Range

  A ticketing system hands out consecutive integer ticket numbers. To check that an archived batch was
  not altered, an auditor folds every ticket number in the batch together with bitwise XOR and compares
  the result with a stored checksum.

  Given the first ticket `lo` and the last ticket `hi` of a batch (both inclusive), return
  `lo XOR (lo + 1) XOR (lo + 2) XOR ... XOR hi`. A batch with `lo == hi` contains one ticket.

  Batches can contain up to `2^50` tickets, so visiting every number is far too slow: find a way to
  compute the result in constant time. Values exceed 32 bits, so use 64-bit integers (in JavaScript,
  the built-in bitwise operators work on 32-bit values only).

  ### Example 1
  ```
  Input:  lo = 3, hi = 6
  Output: 4
  Explanation: 3 XOR 4 = 7, 7 XOR 5 = 2, 2 XOR 6 = 4.
  ```

  ### Example 2
  ```
  Input:  lo = 0, hi = 7
  Output: 0
  ```

  ### Example 3
  ```
  Input:  lo = 5, hi = 5
  Output: 5
  ```

  ### Constraints
  - `0 <= lo <= hi <= 2^50`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: xor_range
  params:
    - {name: lo, type: "long"}
    - {name: hi, type: "long"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def xor_range(lo: int, hi: int) -> int:
        def prefix_xor(n: int) -> int:
            # XOR of 0..n follows a period-4 pattern: n, 1, n + 1, 0.
            if n < 0:
                return 0
            return (n, 1, n + 1, 0)[n % 4]

        # XOR is its own inverse, so the shared prefix 0..lo-1 cancels out.
        return prefix_xor(hi) ^ prefix_xor(lo - 1)
  javascript: |
    function xorRange(lo, hi) {
      // Values reach 2^50, beyond the 32-bit range of Number bitwise operators: use BigInt.
      const prefixXor = (n) => {
        if (n < 0n) {
          return 0n;
        }
        const r = n % 4n;
        if (r === 0n) return n;
        if (r === 1n) return 1n;
        if (r === 2n) return n + 1n;
        return 0n;
      };
      const result = prefixXor(BigInt(hi)) ^ prefixXor(BigInt(lo) - 1n);
      return Number(result); // below 2^51, so exactly representable
    }
tests:
  - {id: t1, args: [3, 6], expected: 4, description: "Example 1"}
  - {id: t2, args: [0, 7], expected: 0, description: "Example 2 - full block of eight cancels to zero"}
  - {id: t3, args: [5, 5], expected: 5, description: "Example 3 - single ticket"}
  - {id: t4, hidden: true, args: [0, 0], expected: 0, description: "Single ticket zero (lo - 1 is negative)"}
  - {id: t5, hidden: true, args: [4, 7], expected: 0, description: "lo divisible by four and hi = 3 mod 4 - result 0"}
  - {id: t6, hidden: true, args: [1125899906842624, 1125899906842624], expected: 1125899906842624, description: "Single ticket at the upper bound 2^50"}
  - {id: t7, hidden: true, args: [0, 1125899906842624], expected: 1125899906842624, description: "Whole range up to 2^50 - hi = 0 mod 4"}
  - {id: t8, hidden: true, args: [1125899906842621, 1125899906842624], expected: 2251799813685244, description: "Four tickets ending at 2^50 - high bits must survive (32-bit truncation pitfall)"}
  - {id: t9, hidden: true, args: [123456789012347, 987654321098772], expected: 1110561353207663, description: "Large arbitrary bounds near 10^15 with a 50-bit result"}
  - {id: t10, hidden: true, args: [4294967293, 4294967298], expected: 8589934591, description: "Range crossing 2^32 (result 2^33 - 1) - 32-bit operators give wrong answers"}
  - {id: t11, hidden: true, args: [1, 1000], expected: 1000, description: "Moderate range checked against a brute-force fold"}
expected_concepts:
  - "XOR identities (self-inverse, associativity)"
  - "period-4 pattern of prefix XORs 0..n"
  - "range query as the difference of two prefix values"
  - "64-bit integers beyond 32-bit bitwise operators"
optimal_complexity: {time: "O(1)", space: "O(1)"}
rubric:
  excellent: "Observes or derives that the XOR of 0..n is n, 1, n + 1 or 0 depending on n mod 4, combines prefix(hi) with prefix(lo - 1) because XOR cancels the shared prefix, handles lo = 0, and uses 64-bit or BigInt arithmetic for values above 2^32."
  good: "Reaches the prefix approach after experimenting with small cases or with a hint, with a minor issue in the lo = 0 or 64-bit handling fixed quickly."
  weak: "Loops over the range, which cannot finish for 2^50 values, or uses 32-bit operations that truncate large results."
  criteria:
    correctness: "All tests pass, including lo = 0, single tickets, the 2^50 bound and ranges crossing 2^32."
    efficiency: "Constant time; no loop over the range."
    code_quality: "A small prefix helper with the four cases spelled out and the cancellation explained."
    edge_cases: "lo = 0, lo = hi, ranges aligned to multiples of four and values above 32 bits."
    communication: "Explains why the pattern repeats every four numbers and why prefix values can be combined."
hints:
  - "XOR has a useful property: anything XORed with itself disappears. Could you express the XOR of lo through hi using XORs that start from zero?"
  - "The XOR of lo through hi equals the XOR of 0 through hi combined with the XOR of 0 through lo minus 1. Now compute the XOR of 0 through n for n from 0 to 8 by hand and look for a repeating pattern."
  - "The XOR of 0 through n depends only on n mod 4: it is n when the remainder is 0, 1 when the remainder is 1, n plus 1 when the remainder is 2, and 0 when the remainder is 3. Apply that to hi and to lo minus 1 (treating the empty prefix before zero as 0) and XOR the two results, using 64-bit integers or BigInt."
followups:
  - "Why does the period-4 pattern hold? Can you prove it from the behaviour of the lowest two bits?"
  - "How would you compute the XOR of every k-th ticket in a range?"
  - "Why is XOR a weak integrity checksum, and what would you use instead?"
common_errors:
  - "Iterating over the whole range, which times out for large batches."
  - "Using JavaScript bitwise operators or 32-bit ints, which truncate values above 2^32."
  - "Calling the prefix helper with lo - 1 = -1 without handling the empty prefix."
  - "Mixing up the order of the four cases (n, 1, n + 1, 0)."
