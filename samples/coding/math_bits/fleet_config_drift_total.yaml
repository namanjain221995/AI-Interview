time_limit_minutes: 20
prompt_markdown: |
  ## Fleet Config Drift Total

  A configuration-management agent packs the 30 boolean settings of each server into an integer bit mask:
  bit `j` of `masks[i]` is `1` when setting `j` is enabled on server `i`.

  The **drift** between two servers is the number of settings on which they disagree, i.e. the number of
  bit positions where their masks differ. To track how consistent the fleet is, the platform team wants
  the **total drift summed over every unordered pair of servers** (each pair counted once; a server is
  never paired with itself). Servers may have identical masks.

  The fleet can have up to `10^5` servers, so comparing every pair is too slow. Aim for `O(n * 30)`.

  ### Example 1
  ```
  Input:  masks = [5, 3, 6]
  Output: 6
  Explanation: 5 = 101, 3 = 011, 6 = 110. Each of the three pairs differs in exactly 2 positions.
  ```

  ### Example 2
  ```
  Input:  masks = [9, 9, 0]
  Output: 4
  Explanation: The two 9s agree everywhere; each differs from 0 in 2 positions.
  ```

  ### Example 3
  ```
  Input:  masks = [1023]
  Output: 0
  ```

  ### Constraints
  - `1 <= masks.length <= 10^5`
  - `0 <= masks[i] < 2^30`
  - The answer can exceed `2^31 - 1`; return it as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: total_config_drift
  params:
    - {name: masks, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def total_config_drift(masks: list[int]) -> int:
        n = len(masks)
        total = 0
        for bit in range(30):
            enabled = sum((mask >> bit) & 1 for mask in masks)
            total += enabled * (n - enabled)  # every enabled/disabled pair differs here
        return total
  javascript: |
    function totalConfigDrift(masks) {
      const n = masks.length;
      let total = 0;
      for (let bit = 0; bit < 30; bit++) {
        let enabled = 0;
        for (const mask of masks) enabled += (mask >> bit) & 1;
        total += enabled * (n - enabled); // every enabled/disabled pair differs here
      }
      return total;
    }
