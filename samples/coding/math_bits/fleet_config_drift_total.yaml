expected_concepts:
  - "decompose pairwise Hamming distance by bit position"
  - "a position with c ones contributes c * (n - c) differing pairs"
  - "O(30 n) instead of O(n^2) pairwise comparison"
  - "64-bit accumulation of the total"
optimal_complexity: {time: "O(30 n)", space: "O(1)"}
rubric:
  excellent: "Starts from the O(n^2) pairwise XOR baseline, switches the order of summation to bit positions, uses c * (n - c) per position with a 64-bit total and states O(30 n) time and O(1) space."
  good: "Reaches the per-bit counting solution with a hint, or fixes an overflow or double-counting issue after testing."
  weak: "Only compares every pair with XOR and popcount, counts ordered pairs twice, or accumulates in 32-bit integers."
  criteria:
    correctness: "All tests pass, including a single server, identical masks and the 30-bit maximum."
    efficiency: "One pass per bit (or one pass with 30 counters); no pairwise loop."
    code_quality: "The per-position formula is named and commented; loop bounds match the 30 settings."
    edge_cases: "Single server, all-identical fleets, masks using bit 29, and totals that exceed 32 bits."
    communication: "Explains why the total drift equals the sum over positions of enabled times disabled servers."
hints:
  - "The drift of a pair is a sum over individual settings. What happens if you swap the order: for each setting, how many pairs disagree on it?"
  - "For one bit position, a pair disagrees exactly when one server has the bit on and the other has it off. If you know how many servers have it on, you can count those pairs without listing them."
  - "For each of the 30 positions count the servers with the bit on, call it c; that position adds c times (n minus c) to the answer. Sum over all positions in a 64-bit integer."
followups:
  - "How would you support adding and removing servers while keeping the total up to date?"
  - "What if you needed the pair of servers with the largest drift instead of the total?"
  - "How would the approach change if settings had three possible values instead of two?"
  - "How would you parallelise the computation across many machines for a very large fleet?"
common_errors:
  - "Comparing every pair with XOR and popcount, which is O(n^2) and too slow for 10^5 servers."
  - "Counting ordered pairs, which doubles the answer."
  - "Accumulating the total in a 32-bit integer."
  - "Looping over fewer than 30 positions and missing the high settings."
