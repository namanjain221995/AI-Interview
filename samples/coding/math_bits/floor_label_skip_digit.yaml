slug: floor_label_skip_digit
title: "Floor Label Skipping a Digit"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, frontend, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Floor Label Skipping a Digit

  The elevator panels in a large office tower use a cheap display that cannot render one particular digit,
  `banned_digit`. The building-management system therefore labels floors with the increasing positive
  integers `1, 2, 3, ...` but **skips every label whose decimal form contains `banned_digit` anywhere**.
  The lowest floor gets the smallest allowed label, the next floor the next allowed label, and so on.

  Given `n` and `banned_digit`, return the label of the `n`-th floor (floors are counted from 1).

  `n` can be as large as `10^12`, so generating labels one by one is too slow.

  ### Example 1
  ```
  Input:  n = 4, banned_digit = 4
  Output: 5
  Explanation: The allowed labels are 1, 2, 3, 5, ... so the 4th floor is labelled 5.
  ```

  ### Example 2
  ```
  Input:  n = 15, banned_digit = 1
  Output: 27
  Explanation: Allowed labels: 2, 3, 4, 5, 6, 7, 8, 9, 20, 22, 23, 24, 25, 26, 27.
  ```

  ### Example 3
  ```
  Input:  n = 9, banned_digit = 9
  Output: 10
  Explanation: Labels 1 to 8 are allowed, 9 is skipped, so the 9th floor is 10.
  ```

  ### Constraints
  - `1 <= n <= 10^12`
  - `1 <= banned_digit <= 9`
  - The answer is below `10^13` and fits in a signed 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nth_floor_label
  params:
    - {name: n, type: "long"}
    - {name: banned_digit, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def nth_floor_label(n: int, banned_digit: int) -> int:
        # Allowed labels use 9 symbols, so the n-th one is n written in base 9
        # with each base-9 digit mapped to the allowed decimal digits in order.
        base9 = []
        while n:
            n, digit = divmod(n, 9)
            base9.append(digit)
        label = 0
        for digit in reversed(base9):
            label = label * 10 + (digit + 1 if digit >= banned_digit else digit)
        return label
  javascript: |
    function nthFloorLabel(n, bannedDigit) {
      // n <= 10^12 and the label < 10^13, both exact as Numbers
      const base9 = [];
      while (n > 0) {
        const digit = n % 9;
        base9.push(digit);
        n = (n - digit) / 9;
      }
      let label = 0;
      for (let i = base9.length - 1; i >= 0; i--) {
        const digit = base9[i];
        label = label * 10 + (digit >= bannedDigit ? digit + 1 : digit);
      }
      return label;
    }
