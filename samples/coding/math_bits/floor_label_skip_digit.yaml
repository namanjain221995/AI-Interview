expected_concepts:
  - "allowed labels form a positional system with 9 symbols"
  - "convert n to base 9 and map each digit past the banned one up by one"
  - "order preservation of the digit mapping (so the n-th allowed label maps from n)"
  - "O(log n) time instead of scanning labels"
optimal_complexity: {time: "O(log n)", space: "O(log n)"}
rubric:
  excellent: "Recognises that labels avoiding one digit are numerals over 9 ordered symbols, converts n to base 9, maps digits at or above banned_digit up by one, and justifies why the mapping preserves order; states O(log n)."
  good: "Reaches base 9 with a hint, or uses a correct digit-by-digit counting approach (count of allowed labels below a prefix) with a little help."
  weak: "Generates labels one by one, maps digits incorrectly (for example using greater-than instead of at-least), or ignores that 0 remains allowed."
  criteria:
    correctness: "All tests pass for every banned digit, including n = 1 and n near 10^12."
    efficiency: "Logarithmic in n; no scanning of candidate labels."
    code_quality: "Base conversion and digit mapping are clearly separated; uses 64-bit integers."
    edge_cases: "banned_digit 1 and 9, n below 9, base-9 powers that produce zeros, and large n."
    communication: "Explains why 0 is still allowed and why the n-th label is the n-th base-9 numeral relabelled."
hints:
  - "How many digit symbols can appear in an allowed label? Does that remind you of a number system?"
  - "If you list the allowed labels in order, they behave exactly like ordinary numbers written with nine symbols instead of ten. Think about counting in base 9 and then renaming the symbols."
  - "Write n in base 9. Every base-9 digit smaller than the banned digit stays the same, and every digit greater than or equal to it is increased by one. Read the resulting digits as a decimal number; that is the label."
followups:
  - "How would you compute the inverse: given an allowed label, which floor number is it?"
  - "What changes if two digits are banned instead of one?"
  - "How would you handle banning 0 as well (labels without zeros)?"
  - "How would you count the allowed labels in a range [a, b]?"
common_errors:
  - "Scanning labels one at a time, which is far too slow for n near 10^12."
  - "Shifting only digits strictly greater than the banned digit, which leaves the banned digit in the output."
  - "Converting n minus one instead of n, which is off by one floor."
  - "Building the label in a 32-bit integer."
