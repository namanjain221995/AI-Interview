version: 1
slug: rack_grid_layouts
title: Rack Grid Layouts
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, platform, devops, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Rack Grid Layouts

  A data-centre planning tool proposes floor layouts for a new hall. Every layout places exactly
  `servers` machines in a **completely filled** rectangular grid of `rows x columns` positions, with no
  empty positions and no extra machines.

  Return the number of different layouts, that is the number of ordered pairs of positive integers
  `(rows, columns)` with `rows * columns == servers`. Layouts are ordered: `3 x 4` and `4 x 3` are
  different, while a square layout such as `6 x 6` is counted once.

  The planner calls this for very large halls, so a scan over every value up to `servers` is too slow.

  ### Example 1
  ```
  Input:  servers = 12
  Output: 6
  Explanation: 1x12, 2x6, 3x4, 4x3, 6x2 and 12x1.
  ```

  ### Example 2
  ```
  Input:  servers = 36
  Output: 9
  Explanation: 1x36, 2x18, 3x12, 4x9, 6x6, 9x4, 12x3, 18x2 and 36x1.
  ```

  ### Example 3
  ```
  Input:  servers = 1
  Output: 1
  ```

  ### Constraints
  - `1 <= servers <= 10^12`
  - The expected solution runs in `O(sqrt(servers))` time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rack_grid_layouts
  params:
    - {name: servers, type: long}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def rack_grid_layouts(servers: int) -> int:
        count = 0
        rows = 1
        while rows * rows <= servers:
            if servers % rows == 0:
                columns = servers // rows
                # rows x columns and columns x rows, or one layout when square.
                count += 1 if rows == columns else 2
            rows += 1
        return count
  javascript: |
    function rackGridLayouts(servers) {
      let count = 0;
      for (let rows = 1; rows * rows <= servers; rows++) {
        if (servers % rows === 0) {
          count += rows === servers / rows ? 1 : 2;
        }
      }
      return count;
    }
tests:
  - {id: t1, args: [12], expected: 6, description: "Example 1 - 12 has six divisors"}
  - {id: t2, args: [36], expected: 9, description: "Example 2 - perfect square, the 6 x 6 layout counted once"}
  - {id: t3, args: [1], expected: 1, description: "Example 3 - a single server has exactly one layout"}
  - {id: t4, hidden: true, args: [2], expected: 2, description: "Smallest prime"}
  - {id: t5, hidden: true, args: [999999999989], expected: 2, description: "Largest prime below 10^12 - full sqrt scan with no early help"}
  - {id: t6, hidden: true, args: [999966000289], expected: 3, description: "Square of the prime 999983 - square root exactly at the loop boundary"}
  - {id: t7, hidden: true, args: [1000000000000], expected: 169, description: "10^12 = 2^12 * 5^12 has 169 divisors, value above 32-bit"}
  - {id: t8, hidden: true, args: [963761198400], expected: 6720, description: "Highly composite number below 10^12 with 6720 divisors"}
  - {id: t9, hidden: true, args: [1024], expected: 11, description: "Power of two"}
  - {id: t10, hidden: true, args: [735134400], expected: 1344, description: "Highly composite number that fits in 32 bits"}
expected_concepts:
  - "divisors come in pairs (d, n / d)"
  - "only divisors up to the square root need to be checked"
  - "perfect squares contribute one layout for the middle divisor"
  - "64-bit arithmetic for values above 2^31"
optimal_complexity: {time: "O(sqrt(n))", space: "O(1)"}
rubric:
  excellent: "Recognises the answer is the divisor count, pairs divisors to stop at the square root, handles perfect squares exactly once, uses 64-bit types and an overflow-safe loop condition, and can mention prime factorisation as an alternative view."
  good: "Reaches the square-root loop after starting from the linear scan; handles the perfect-square case after testing."
  weak: "Stays with the O(n) scan, double-counts the square-root divisor, or overflows on 10^12 inputs."
  criteria:
    correctness: "All tests pass, including 1, primes, perfect squares and 10^12."
    efficiency: "O(sqrt(n)) loop; at most about 10^6 iterations for the largest input."
    code_quality: "Loop condition is clear (rows times rows at most servers, or an equivalent integer bound); 64-bit types where needed."
    edge_cases: "servers = 1, large primes, squares of large primes, highly composite numbers."
    communication: "Explains the pairing argument and why the loop can stop at the square root."
hints:
  - "Each layout is fixed by choosing the number of rows; it works exactly when the row count divides the number of servers."
  - "If a row count r works, then so does the column count servers divided by r, and one of the two is never larger than the square root of servers."
  - "Try every row count from one while its square does not exceed servers; each one that divides evenly gives two ordered layouts, except when it equals its partner (a perfect square) where it gives one; use 64-bit integers for the value and the square."
followups:
  - "How would you compute the count from the prime factorisation, and when is that faster?"
  - "How would you list the layouts sorted by how close they are to square?"
  - "How would you answer the question for every value from 1 to N at once?"
common_errors:
  - "Counting the square-root divisor twice for perfect squares."
  - "Using a floating-point square root bound that is off by one for large perfect squares."
  - "Using a 32-bit loop variable whose square overflows near 10^12."
  - "Scanning every value up to servers, which is far too slow for 10^12."
