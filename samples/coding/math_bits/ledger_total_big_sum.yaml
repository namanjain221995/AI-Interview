prompt_markdown: |
  ## Ledger Total Without Overflow

  A settlement system exports balances in **minor units** (for example cents) as plain digit strings,
  because some balances are far beyond what a 64-bit integer can hold. The reconciliation job needs the
  grand total of one export.

  You are given `amounts`, a list of strings. Each string contains only the digits `0`-`9`, is at least
  one character long and may have **leading zeros** (such as `"005"`). Return the total of all amounts
  as a digit string with **no leading zeros**; the total of an empty list, or of a list of zeros, is
  `"0"`.

  Add the numbers **digit by digit**, as you would on paper. Do not convert whole amounts to a built-in
  big-integer, decimal or floating-point type.

  ### Example 1
  ```
  Input:  amounts = ["120", "75", "005"]
  Output: "200"
  ```

  ### Example 2
  ```
  Input:  amounts = ["99999999999999999999", "1"]
  Output: "100000000000000000000"
  Explanation: The carry moves through all twenty digits and creates a new leading digit.
  ```

  ### Example 3
  ```
  Input:  amounts = []
  Output: "0"
  ```

  ### Constraints
  - `0 <= amounts.length <= 100`
  - `1 <= amounts[i].length <= 200`
  - `amounts[i]` consists of digits only and may start with zeros.
languages: [python, javascript, typescript, java, go, cpp]
