expected_concepts:
  - "schoolbook addition from the least significant digit"
  - "carry that can exceed a single digit when many numbers are added"
  - "aligning numbers of different lengths from the right"
  - "normalising leading zeros and the empty case"
optimal_complexity: {time: "O(n * L)", space: "O(L)"}
rubric:
  excellent: "Adds column by column (or pairwise) from the right with a correct multi-digit carry, aligns different lengths, strips leading zeros while keeping a single 0, and explains the O(n * L) cost and why built-in types overflow."
  good: "Correct pairwise string addition repeated over the list; minor slips on leading zeros or the empty list fixed after testing."
  weak: "Converts to built-in integers or floats, assumes the carry is at most 1 when summing a whole column, or returns results with leading zeros."
  criteria:
    correctness: "All tests pass, including the empty list, all zeros, padded inputs and 200-digit values."
    efficiency: "Linear in the total number of digits; no quadratic string concatenation in the inner loop."
    code_quality: "Digits are collected in a list and reversed once; carry handling is easy to follow."
    edge_cases: "Empty list, only zeros, leading zeros, carries that create new digits, many entries."
    communication: "Explains the choice between column-wise and pairwise addition and the carry bound."
hints:
  - "Think about how you add a stack of long numbers on paper: right to left, one column at a time."
  - "Line the amounts up by their last character; for each position from the right, add the digit of every amount that is long enough plus the carry from the previous column."
  - "Keep the column total, write its last digit to a list of result digits and carry the rest (which can be more than one when many amounts are added); after the widest amount is used up, keep emitting carry digits, then drop leading zeros from the high end while keeping at least one digit, and reverse."
followups:
  - "How would you also support negative amounts?"
  - "If the export had millions of rows, how would you stream the sum without holding every string in memory?"
  - "Why do financial systems store money in minor units instead of floating point?"
common_errors:
  - "Assuming the carry is always 0 or 1, which breaks when a column of many digits is summed."
  - "Forgetting the final carry digits after the widest amount ends."
  - "Returning an empty string or leading zeros for all-zero input."
  - "Converting each amount to a 64-bit integer, which overflows."
