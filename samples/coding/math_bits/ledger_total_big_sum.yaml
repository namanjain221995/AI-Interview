reference_solutions:
  python: |
    def ledger_total(amounts: list[str]) -> str:
        width = max((len(a) for a in amounts), default=0)
        digits = []  # least significant digit first
        carry = 0
        for position in range(width):
            column = carry
            for amount in amounts:
                index = len(amount) - 1 - position
                if index >= 0:
                    column += ord(amount[index]) - ord("0")
            digits.append(column % 10)
            carry = column // 10
        while carry:
            digits.append(carry % 10)
            carry //= 10
        while len(digits) > 1 and digits[-1] == 0:
            digits.pop()
        if not digits:
            return "0"
        return "".join(str(d) for d in reversed(digits))
  javascript: |
    function ledgerTotal(amounts) {
      let width = 0;
      for (const a of amounts) width = Math.max(width, a.length);
      const digits = [];
      let carry = 0;
      for (let position = 0; position < width; position++) {
        let column = carry;
        for (const amount of amounts) {
          const index = amount.length - 1 - position;
          if (index >= 0) column += amount.charCodeAt(index) - 48;
        }
        digits.push(column % 10);
        carry = Math.floor(column / 10);
      }
      while (carry > 0) {
        digits.push(carry % 10);
        carry = Math.floor(carry / 10);
      }
      while (digits.length > 1 && digits[digits.length - 1] === 0) digits.pop();
      if (digits.length === 0) return '0';
      return digits.reverse().join('');
    }
