expected_concepts:
  - "Manhattan (grid) distance"
  - "single linear scan keeping the best candidate"
  - "strict comparison to keep the earliest index on ties"
  - "integer arithmetic instead of square roots"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Writes a clean single pass with the right distance formula, explains how the strict comparison gives the smallest index on ties, and notes that the largest distance (4 * 10^8) fits in 32-bit integers."
  good: "Correct scan; tie-breaking or the distance formula needs a small correction after testing."
  weak: "Uses straight-line distance, sorts all depots unnecessarily without handling ties, or returns the coordinates instead of the index."
  criteria:
    correctness: "All tests pass, including ties, duplicates and negative coordinates."
    efficiency: "One pass, constant extra memory; no sorting."
    code_quality: "Clear names for the best index and best distance; no floating point."
    edge_cases: "Single depot, order on top of a depot, multi-way ties, extreme coordinates."
    communication: "Explains the tie rule and how the approach would change for many orders against the same depots."
hints:
  - "Each depot can be scored independently with the grid distance, so you only need to remember the best one seen so far."
  - "Walk the depots in index order and keep the index and distance of the closest depot so far; think about whether a tie should replace the stored depot."
  - "Start with the first depot as the best, then for every later depot compute the absolute x difference plus the absolute y difference and replace the stored best only when the new distance is strictly smaller, which automatically keeps the smallest index among equally close depots."
followups:
  - "How would you answer many order queries against the same fixed set of depots faster than a full scan each time?"
  - "How does the answer change if vans can also drive diagonally (Chebyshev distance)?"
  - "How would you return the k nearest depots instead of one?"
common_errors:
  - "Using straight-line (Euclidean) distance, which can choose a different depot."
  - "Using less-than-or-equal, which returns the last of several tied depots."
  - "Initialising the best distance with a small sentinel that the largest real distance can exceed."
  - "Returning the depot coordinates instead of its index."
