  - {id: t1, args: [[[0, 0], [5, 5], [2, -1]], 3, 1], expected: 2, description: "Example 1 - distances 4, 6 and 3"}
  - {id: t2, args: [[[1, 1], [-1, -1], [4, 0]], 0, 0], expected: 0, description: "Example 2 - tie between depots 0 and 1, smaller index wins"}
  - {id: t3, hidden: true, args: [[[7, -3]], 100, 100], expected: 0, description: "Single depot always wins"}
  - {id: t4, hidden: true, args: [[[3, 3], [9, 9], [9, 9]], 9, 9], expected: 1, description: "Order exactly on a duplicated depot - distance 0, first copy wins"}
  - {id: t5, hidden: true, args: [[[10, 0], [0, 6], [-3, -3], [6, 0]], 0, 0], expected: 1, description: "Three-way tie at distance 6 among depots 1, 2 and 3 - index 1 wins"}
  - {id: t6, hidden: true, args: [[[-100000000, -100000000], [100000000, 100000000], [100000000, -100000000]], -100000000, 100000000], expected: 0, description: "Extreme coordinates - tie at 2*10^8 between depots 0 and 1; the far corner at 4*10^8 still fits in 32 bits"}
  - {id: t7, hidden: true, args: [[[-3, 0], [-1, -3], [2, 9]], -6, -3], expected: 1, description: "Negative coordinates; straight-line distance would pick depot 0 but grid distance picks depot 1"}
