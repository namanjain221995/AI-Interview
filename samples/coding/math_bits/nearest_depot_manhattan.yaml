version: 1
slug: nearest_depot_manhattan
title: Nearest Depot on a Street Grid
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, mobile, data_analyst, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Nearest Depot on a Street Grid

  A same-day delivery service dispatches each new order from the closest depot. Vans drive on a city
  grid with only east-west and north-south streets, so the travel distance between `(x1, y1)` and
  `(x2, y2)` is `|x1 - x2| + |y1 - y2|`, not the straight-line distance.

  You are given `depots`, where `depots[i] = [xi, yi]` is the location of depot `i`, and the location
  `(x, y)` of a new order. Return the **0-based index** of the depot with the smallest travel distance
  to the order. If several depots are equally close, return the **smallest index** among them.

  ### Example 1
  ```
  Input:  depots = [[0, 0], [5, 5], [2, -1]], x = 3, y = 1
  Output: 2
  Explanation: The distances are 3 + 1 = 4, 2 + 4 = 6 and 1 + 2 = 3, so depot 2 is closest.
  ```

  ### Example 2
  ```
  Input:  depots = [[1, 1], [-1, -1], [4, 0]], x = 0, y = 0
  Output: 0
  Explanation: Depots 0 and 1 are both at distance 2; the smaller index wins.
  ```

  ### Constraints
  - `1 <= depots.length <= 10^4`
  - `depots[i].length == 2`
  - `-10^8 <= xi, yi, x, y <= 10^8`
  - Several depots may share the same location.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nearest_depot
  params:
    - {name: depots, type: "int[][]"}
    - {name: x, type: int}
    - {name: "y", type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def nearest_depot(depots: list[list[int]], x: int, y: int) -> int:
        best_index = -1
        best_distance = 0
        for i, (dx, dy) in enumerate(depots):
            distance = abs(dx - x) + abs(dy - y)
            # Strictly smaller keeps the earliest index on ties.
            if best_index == -1 or distance < best_distance:
                best_index, best_distance = i, distance
        return best_index
  javascript: |
    function nearestDepot(depots, x, y) {
      let bestIndex = -1;
      let bestDistance = 0;
      for (let i = 0; i < depots.length; i++) {
        const distance = Math.abs(depots[i][0] - x) + Math.abs(depots[i][1] - y);
        if (bestIndex === -1 || distance < bestDistance) {
          bestIndex = i;
          bestDistance = distance;
        }
      }
      return bestIndex;
    }
