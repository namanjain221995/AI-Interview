version: 1
slug: composable_batch_sizes
title: "Composable Batch Sizes"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, platform, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Composable Batch Sizes

  A fulfilment line ships every batch as a stack of **identical** sealed packs. The packs come in the sizes
  listed in `pack_sizes` (units per pack), and a batch may not mix pack sizes. A batch size of `s` units is
  therefore **composable** when `s` is a positive multiple of at least one value in `pack_sizes`.

  The planning tool lists all composable batch sizes in increasing order, each size once even when several
  pack sizes can build it. Return the `n`-th size in that list (1-indexed).

  `pack_sizes` may contain repeated values, and one pack size may be a multiple of another.

  ### Example 1
  ```
  Input:  n = 7, pack_sizes = [4, 6]
  Output: 20
  Explanation: The composable sizes start 4, 6, 8, 12, 16, 18, 20, ... (12 is listed once although
  both pack sizes build it), so the 7th is 20.
  ```

  ### Example 2
  ```
  Input:  n = 5, pack_sizes = [3]
  Output: 15
  ```

  ### Constraints
  - `1 <= n <= 10^9`
  - `1 <= pack_sizes.length <= 5`
  - `1 <= pack_sizes[i] <= 10^5`
  - The answer is at most `n * min(pack_sizes) <= 10^14`, so it needs a 64-bit integer.

  **Follow-up:** generating the sizes one by one is far too slow for `n = 10^9`; aim for a solution whose
  running time depends on `log` of the answer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nth_batch_size
  params:
    - {name: n, type: "int"}
    - {name: pack_sizes, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    from math import gcd


    def nth_batch_size(n: int, pack_sizes: list[int]) -> int:
        hi = n * min(pack_sizes)  # the n-th multiple of the smallest pack is always composable
        m = len(pack_sizes)
        # Inclusion-exclusion terms: (lcm of a non-empty subset, sign). An lcm larger
        # than hi contributes nothing, so it is capped to keep numbers small.
        terms = []
        for mask in range(1, 1 << m):
            lcm = 1
            for i in range(m):
                if mask >> i & 1:
                    lcm = lcm // gcd(lcm, pack_sizes[i]) * pack_sizes[i]
                    if lcm > hi:
                        break
            if lcm <= hi:
                terms.append((lcm, 1 if bin(mask).count("1") % 2 else -1))

        def composable_up_to(x: int) -> int:
            return sum(sign * (x // lcm) for lcm, sign in terms)

        lo = 1
        while lo < hi:  # smallest x with at least n composable sizes in [1, x]
            mid = (lo + hi) // 2
            if composable_up_to(mid) >= n:
                hi = mid
            else:
                lo = mid + 1
        return lo
  javascript: |
    function nthBatchSize(n, packSizes) {
      const gcd = (a, b) => { while (b) { [a, b] = [b, a % b]; } return a; };
      const floorDiv = (x, d) => (x - (x % d)) / d; // exact for safe integers
      const hi0 = n * Math.min(...packSizes);
      const m = packSizes.length;
      const terms = [];
      for (let mask = 1; mask < (1 << m); mask++) {
        let lcm = 1;
        let bits = 0;
        let tooBig = false;
        for (let i = 0; i < m; i++) {
          if ((mask >> i) & 1) {
            bits++;
            lcm = (lcm / gcd(lcm, packSizes[i])) * packSizes[i];
            if (lcm > hi0) { tooBig = true; break; }
          }
        }
        if (!tooBig) terms.push([lcm, bits % 2 === 1 ? 1 : -1]);
      }
      const composableUpTo = (x) => {
        let count = 0;
        for (const [lcm, sign] of terms) count += sign * floorDiv(x, lcm);
        return count;
      };
      let lo = 1;
      let hi = hi0;
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (composableUpTo(mid) >= n) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }
