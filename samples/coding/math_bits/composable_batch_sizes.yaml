expected_concepts:
  - "binary search on the answer"
  - "counting multiples up to x with inclusion-exclusion over subsets"
  - "least common multiple via gcd"
  - "capping or pruning lcms that exceed the search range to avoid overflow"
  - "duplicates and divisor pairs handled naturally by the set formulation"
optimal_complexity: {time: "O(2^m * m * log(n * min(pack_sizes)))", space: "O(2^m)"}
rubric:
  excellent: "Turns the question into 'smallest x with at least n composable sizes up to x', counts them with inclusion-exclusion over lcms of subsets, binary searches x in [1, n * min], prunes lcms above the range so nothing overflows, and explains why duplicates need no special handling."
  good: "Finds binary search plus inclusion-exclusion but needs help with the overflow of subset lcms or with the exact boundary of the search."
  weak: "Generates sizes one at a time or with a heap (too slow for n = 10^9), or counts multiples per pack size without removing the overlaps."
  criteria:
    correctness: "All tests pass, including repeated sizes, divisor pairs, pack size 1 and the 10^9 case."
    efficiency: "Logarithmic number of counting steps, each over at most 31 subsets."
    code_quality: "Subset terms are precomputed once; the count function and the search are separate and readable."
    edge_cases: "n = 1, a pack size of 1, duplicate sizes and lcms that exceed the 64-bit range."
    communication: "Explains why the counting function is monotonic and why the search returns a composable size."
hints:
  - "Instead of building the list, ask a simpler question: for a given x, how many composable sizes are there between 1 and x?"
  - "That count only grows as x grows, so you can search for the smallest x whose count reaches n. To count, add the multiples of each pack size, but sizes divisible by two pack sizes were added twice."
  - "Count multiples up to x with inclusion and exclusion: for every non-empty subset of pack sizes, add or subtract x divided by the least common multiple of the subset depending on whether the subset has an odd or even size. Binary search x between 1 and n times the smallest pack size, and skip any subset whose least common multiple already exceeds that upper bound so the arithmetic never overflows."
followups:
  - "Why is the value returned by the binary search guaranteed to be composable itself?"
  - "How would the approach scale if there were 30 pack sizes instead of 5?"
  - "How would you list the first 1000 composable sizes efficiently?"
  - "What changes if a batch may mix pack sizes freely (any non-negative combination)?"
common_errors:
  - "Adding the multiples of each pack size without subtracting the overlaps, which double-counts shared sizes."
  - "Multiplying sizes instead of taking the least common multiple for non-coprime pairs."
  - "Overflowing 64-bit integers when computing the lcm of several large sizes."
  - "Stopping the binary search on the first x whose count equals n instead of the smallest such x."
