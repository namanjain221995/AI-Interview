expected_concepts:
  - "greatest common divisor (Euclid's algorithm)"
  - "adding fractions over the least common multiple"
  - "normalising sign and reducing to lowest terms"
  - "keeping intermediate values within 64-bit range"
  - "exact rational arithmetic instead of floating point"
optimal_complexity: {time: "O(n log M) where M bounds the values (one gcd per term)", space: "O(1)"}
rubric:
  excellent: "Accumulates a running fraction, moves negative signs to the numerator, adds over the lcm (or cross-multiplies) and reduces with gcd after every step, returns [0, 1] for zero, and explains why reducing early keeps values inside 64 bits."
  good: "Correct exact arithmetic that needs a prompt on the sign rule, the zero case or reducing at each step."
  weak: "Uses floating point, multiplies every denominator together without reducing (overflow), or returns a negative denominator or an unreduced result."
  criteria:
    correctness: "All tests pass, including zero totals, negative denominators and twenty-term sums."
    efficiency: "One pass with a gcd per term; no conversion to floating point or search for the denominator."
    code_quality: "A small gcd helper and a clearly separated normalisation step."
    edge_cases: "Single term, zero numerators, both signs negative, whole-number totals and large coprime denominators."
    communication: "Explains the invariant (running sum always reduced, denominator positive) and the overflow bound."
hints:
  - "Floating point cannot represent values like 1/3 exactly. How do you add two fractions by hand, keeping numerator and denominator as integers?"
  - "Keep a running total as a numerator and denominator. Add each share by bringing both to a common denominator, then divide both parts by their greatest common divisor so the numbers stay small. Decide early where the minus sign lives."
  - "Start from zero over one. For each share, flip both signs if its denominator is negative, combine it with the running total over the least common multiple of the two denominators, then divide numerator and denominator by the gcd of the absolute numerator and the denominator. A zero numerator reduces to zero over one automatically because the gcd of zero and d is d."
followups:
  - "How would you support arbitrarily large numerators and denominators?"
  - "How would you split a bill by these shares into whole cents so the parts still add up exactly?"
  - "Why does reducing only at the end risk overflow even when the final answer is small?"
common_errors:
  - "Converting to floating point and back, which produces rounding errors and wrong reductions."
  - "Multiplying all denominators together before reducing, which overflows 64-bit integers."
  - "Leaving the sign on the denominator or returning both values negative."
  - "Returning [0, d] or a negative zero instead of [0, 1] for a zero total."
  - "Computing gcd with a negative argument in a language whose remainder keeps the sign, giving a negative divisor."
