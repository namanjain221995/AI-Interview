slug: fraction_share_sum
title: "Fraction Share Sum"
difficulty: medium
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [backend, data, general, business_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Fraction Share Sum

  A cost-allocation service splits a shared cluster bill between teams. Each line of an allocation
  sheet assigns a team an exact share written as a fraction `numerators[i] / denominators[i]`.
  Corrections are entered as negative shares, and because the sheet is typed by hand a negative share
  may carry its minus sign on the denominator instead (`1 / -4` means the same as `-1 / 4`).

  Floating point would introduce rounding drift, so the service adds the shares **exactly**. Return the
  total as a two-element list `[numerator, denominator]` that is:

  - in **lowest terms** (the greatest common divisor of the two values is 1),
  - with a **positive** denominator (the sign is carried by the numerator), and
  - `[0, 1]` when the total is zero.

  ### Example 1
  ```
  Input:  numerators = [1, 1], denominators = [2, 3]
  Output: [5, 6]
  Explanation: 1/2 + 1/3 = 3/6 + 2/6 = 5/6.
  ```

  ### Example 2
  ```
  Input:  numerators = [-3, 5], denominators = [4, -6]
  Output: [-19, 12]
  Explanation: -3/4 + 5/(-6) = -9/12 - 10/12 = -19/12; the sign moves to the numerator.
  ```

  ### Example 3
  ```
  Input:  numerators = [1, 1, -1], denominators = [3, 6, 2]
  Output: [0, 1]
  Explanation: 1/3 + 1/6 - 1/2 = 0, which is written as 0/1.
  ```

  ### Constraints
  - `1 <= numerators.length == denominators.length <= 20`
  - `-1000 <= numerators[i] <= 1000`
  - `-1000 <= denominators[i] <= 1000` and `denominators[i] != 0`
  - If you add the shares one at a time and reduce after every step, every intermediate numerator and
    denominator stays within `10^12` in absolute value (64-bit integers are enough).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sum_of_fractions
  params:
    - {name: numerators, type: "long[]"}
    - {name: denominators, type: "long[]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    from math import gcd


    def sum_of_fractions(numerators: list[int], denominators: list[int]) -> list[int]:
        total_num, total_den = 0, 1
        for num, den in zip(numerators, denominators):
            if den < 0:  # carry the sign on the numerator
                num, den = -num, -den
            # Add over the least common multiple of the denominators to keep values small.
            common = total_den // gcd(total_den, den) * den
            total_num = total_num * (common // total_den) + num * (common // den)
            total_den = common
            g = gcd(abs(total_num), total_den)  # gcd(0, d) == d, so 0 becomes 0/1
            total_num //= g
            total_den //= g
        return [total_num, total_den]
  javascript: |
    function sumOfFractions(numerators, denominators) {
      const gcd = (a, b) => {
        a = Math.abs(a);
        b = Math.abs(b);
        while (b !== 0) {
          [a, b] = [b, a % b];
        }
        return a;
      };
      let totalNum = 0;
      let totalDen = 1;
      for (let i = 0; i < numerators.length; i += 1) {
        let num = numerators[i];
        let den = denominators[i];
        if (den < 0) {
          num = -num;
          den = -den;
        }
        // Values stay within 10^12 * 1000 < 2^53, so plain numbers are exact.
        const common = (totalDen / gcd(totalDen, den)) * den;
        totalNum = totalNum * (common / totalDen) + num * (common / den);
        totalDen = common;
        const g = gcd(totalNum, totalDen);
        totalNum /= g;
        totalDen /= g;
      }
      // Normalise -0 (from 0 divided by a positive number after negation) to 0.
      return [totalNum === 0 ? 0 : totalNum, totalDen];
    }
