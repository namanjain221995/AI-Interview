expected_concepts:
  - "set cover over a small universe encoded as bitmasks"
  - "breadth-first search or DP over 2^16 coverage states"
  - "masking team categories with required_mask"
  - "why greedy (largest team first) is not optimal"
  - "pruning duplicate and dominated masks"
optimal_complexity: {time: "O(2^k * t) for k required categories and t distinct teams", space: "O(2^k)"}
rubric:
  excellent: "Recognises set cover, rejects greedy with a counterexample, searches the 2^16 coverage states with BFS or DP (masking out irrelevant categories), handles 0 and -1 and states O(2^k * t)."
  good: "Implements a correct state-space DP or BFS with some guidance, or an iterative-deepening search with solid pruning that is correct on all tests."
  weak: "Uses the greedy heuristic, enumerates subsets of teams, or ignores categories outside required_mask incorrectly."
  criteria:
    correctness: "Passes all tests, including required_mask 0, impossible coverage and greedy-trap inputs."
    efficiency: "Work bounded by the number of coverage states times the number of distinct teams, not 2^60."
    code_quality: "Clear state definition (covered required categories); masking and deduplication done up front."
    edge_cases: "Handles required_mask 0, teams with no relevant categories, duplicate teams and extra categories."
    communication: "Explains why the number of distinct coverage states is small even though teams are many."
hints:
  - "Picking the team that covers the most remaining categories first can be wrong. Look for a quantity that is small here even though the number of teams is not."
  - "There are only 2^16 possible sets of covered categories. Treat each set as a state: inviting a team moves you from a state to the bitwise OR of the state and that team's mask."
  - "Mask every team with required_mask and drop duplicates. Run a breadth-first search from the empty state 0 where each step ORs in one team mask; the first time you reach required_mask, the number of steps is the answer. If the search runs out of new states first, return -1, and return 0 immediately when required_mask is 0."
followups:
  - "How would you return which teams to invite, not just how many?"
  - "If each team had a different paging cost, how would you minimise total cost?"
  - "What would you do if there were 60 categories instead of 16?"
  - "How would you count how many different minimum-size invitations exist?"
common_errors:
  - "Choosing teams greedily by how many uncovered categories they add."
  - "Comparing full team masks with required_mask for equality instead of checking containment."
  - "Returning -1 or 1 instead of 0 when required_mask is 0."
  - "Enumerating subsets of up to 60 teams."
  - "Forgetting to mask out categories that are not required, which inflates the state space."
