slug: minimum_alert_team_cover
title: "Minimum Alert Team Cover"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [sre, engineering_manager, devops, platform]
time_limit_minutes: 30
prompt_markdown: |
  ## Minimum Alert Team Cover

  An incident program defines 16 alert categories, numbered `0` to `15`. Each on-call team owns
  runbooks for some categories, given as a bitmask `team_masks[i]`: bit `c` is set when team `i` can
  handle category `c`. For a major-incident bridge, the coordinator must invite enough teams that
  **every category set in `required_mask`** is handled by at least one invited team.

  Return the **smallest number of teams** to invite. Categories outside `required_mask` do not
  matter. Return `0` if `required_mask` is `0`, and `-1` if even inviting every team cannot cover all
  required categories.

  ### Example 1
  ```
  Input:  team_masks = [5, 10, 3], required_mask = 15
  Output: 2
  Explanation: 5 (categories 0 and 2) together with 10 (categories 1 and 3) cover 15 (categories 0-3).
  ```

  ### Example 2
  ```
  Input:  team_masks = [15, 19, 44], required_mask = 63
  Output: 2
  Explanation: 19 (categories 0, 1, 4) and 44 (categories 2, 3, 5) suffice. Starting with the biggest team 15 would need all three teams.
  ```

  ### Example 3
  ```
  Input:  team_masks = [1, 2, 4], required_mask = 8
  Output: -1
  ```

  ### Constraints
  - `1 <= team_masks.length <= 60`
  - `0 <= team_masks[i] < 2^16`
  - `0 <= required_mask < 2^16`

  **Follow-up:** trying every subset of 60 teams is impossible. What can you enumerate instead?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_teams_for_coverage
  params:
    - {name: team_masks, type: "int[]"}
    - {name: required_mask, type: int}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_teams_for_coverage(team_masks: list[int], required_mask: int) -> int:
        if required_mask == 0:
            return 0
        # only required categories matter; drop empty and duplicate masks
        masks = sorted({m & required_mask for m in team_masks} - {0})
        # a team whose categories are a subset of another team's is never needed
        masks = [m for m in masks if not any(o != m and o & m == m for o in masks)]
        # breadth-first search over coverage states (subsets of required_mask)
        seen = bytearray(required_mask + 1)
        seen[0] = 1
        frontier = [0]
        steps = 0
        while frontier:
            steps += 1
            next_frontier = []
            for state in frontier:
                for m in masks:
                    covered = state | m
                    if not seen[covered]:
                        if covered == required_mask:
                            return steps
                        seen[covered] = 1
                        next_frontier.append(covered)
            frontier = next_frontier
        return -1
  javascript: |
    function minTeamsForCoverage(teamMasks, requiredMask) {
      if (requiredMask === 0) return 0;
      const unique = [...new Set(teamMasks.map((m) => m & requiredMask))].filter((m) => m !== 0);
      const dist = new Int8Array(requiredMask + 1).fill(-1);
      dist[0] = 0;
      let frontier = [0];
      while (frontier.length > 0) {
        const next = [];
        for (const state of frontier) {
          for (const m of unique) {
            const covered = state | m;
            if (dist[covered] === -1) {
              dist[covered] = dist[state] + 1;
              if (covered === requiredMask) return dist[covered];
              next.push(covered);
            }
          }
        }
        frontier = next;
      }
      return -1;
    }
