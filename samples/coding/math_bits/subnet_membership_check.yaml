expected_concepts:
  - "parsing and validating dotted-quad IPv4 strings"
  - "converting an address to an unsigned 32-bit integer"
  - "building a prefix mask that works for /0 and /32"
  - "masking both the rule and the address before comparing"
  - "signed versus unsigned 32-bit arithmetic pitfalls"
optimal_complexity: {time: "O(n * L) for n entries of length at most L", space: "O(n) for the output"}
rubric:
  excellent: "Writes one strict parser (exactly four parts, ASCII digits only, no leading zeros, range check), converts to unsigned 32-bit integers, builds a mask that is correct for /0 and /32, masks the rule's own address, and discusses why library parsers or int conversion can accept invalid input."
  good: "Correct membership logic with a parser that misses one or two malformed cases, or needs a nudge on /0 or the high half of the address space."
  weak: "Compares addresses as strings or whole octets, crashes on malformed entries, rejects rules with host bits set, or breaks for addresses at or above 128.0.0.0."
  criteria:
    correctness: "All tests pass, including /0, /1, /31, /32, host bits in the rule and every malformed entry."
    efficiency: "Linear in the total input length; the rule is parsed once."
    code_quality: "Parsing, mask construction and comparison are separate and readable."
    edge_cases: "Empty list, empty strings, leading zeros, out-of-range octets, extra or missing parts and non-ASCII digits."
    communication: "Explains the mask construction and why validation must be stricter than the language's integer parser."
hints:
  - "Treat an address as one 32-bit number instead of four separate numbers. Which bits must match for an address to be inside a network with prefix p?"
  - "Write a strict parser that returns nothing for a damaged entry and an unsigned integer otherwise. Then compare only the leading p bits of the address and of the rule's address, which ignores host bits in the rule automatically."
  - "Split each entry on dots and require exactly four parts, each one to three ASCII digits, no leading zero unless it is a single zero, and a value up to 255; accumulate the value as previous times 256 plus the part. Build a mask with the top p bits set (p equal to 0 gives zero, so avoid shifting by 32) or divide both values by 2 to the power 32 minus p. An entry is inside when it parsed and both masked values are equal."
followups:
  - "How would you check each address against thousands of rules efficiently?"
  - "How would you extend the parser and the comparison to IPv6?"
  - "Why might security tools deliberately reject addresses with leading zeros instead of interpreting them?"
common_errors:
  - "Relying on a general integer parser that accepts signs, spaces or non-ASCII digits."
  - "Shifting by 32 to build the /0 mask, which is a no-op or undefined in several languages."
  - "Using signed 32-bit integers so addresses at or above 128.0.0.0 compare incorrectly."
  - "Not masking the rule's address, so rules written with host bits never match."
  - "Accepting leading zeros or octets above 255, or crashing on an empty string."
