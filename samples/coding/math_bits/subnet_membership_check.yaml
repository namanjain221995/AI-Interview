slug: subnet_membership_check
title: "Subnet Membership Check"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, security, devops, cloud]
time_limit_minutes: 25
prompt_markdown: |
  ## Subnet Membership Check

  A firewall rule admits traffic from exactly one IPv4 network, written in CIDR notation as
  `a.b.c.d/p`. An address is **inside** the network when its first `p` bits (counting from the most
  significant bit of the 32-bit address) equal the first `p` bits of `a.b.c.d`. So `/0` admits every
  address and `/32` admits exactly one. Operators sometimes type the rule with host bits set, such as
  `192.168.5.77/24`; that means the same network as `192.168.5.0/24`, so ignore the bits after the
  prefix instead of rejecting the rule.

  The rule is replayed against client addresses copied from a raw access log, and some log entries are
  damaged. An entry is a **valid** address only if it consists of exactly four parts separated by
  single dots, where every part:

  - is 1 to 3 ASCII digits `0`-`9` (no spaces, signs or other characters),
  - has no leading zero unless the part is exactly `0`, and
  - has a value from `0` to `255`.

  Given the rule `cidr` and the list `ips`, return a list of booleans of the same length, in input
  order: `true` when the entry is a valid address inside the network, and `false` when it is outside
  the network or malformed.

  ### Example 1
  ```
  Input:  cidr = "10.20.0.0/14", ips = ["10.21.7.9", "10.24.0.1", "10.23.255.255", "10.19.255.255"]
  Output: [true, false, true, false]
  Explanation: A /14 keeps the top 6 bits of the second octet, so the network spans 10.20.0.0 to
  10.23.255.255.
  ```

  ### Example 2
  ```
  Input:  cidr = "192.168.5.77/24", ips = ["192.168.5.1", "192.168.6.1", "192.168.5.256", "192.168.05.1"]
  Output: [true, false, false, false]
  Explanation: The rule means 192.168.5.0/24. The last two entries are malformed (256 is out of range,
  05 has a leading zero).
  ```

  ### Example 3
  ```
  Input:  cidr = "0.0.0.0/0", ips = ["8.8.8.8", "255.255.255.255", "1.2.3"]
  Output: [true, true, false]
  Explanation: /0 admits every valid address, but "1.2.3" has only three parts.
  ```

  ### Constraints
  - `cidr` is always well formed: a valid address as defined above, `/`, and `0 <= p <= 32`.
  - `0 <= ips.length <= 10^4`
  - `0 <= ips[i].length <= 20`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: ips_in_subnet
  params:
    - {name: cidr, type: "string"}
    - {name: ips, type: "string[]"}
  return_type: "bool[]"
  comparison: exact
reference_solutions:
  python: |
    def ips_in_subnet(cidr: str, ips: list[str]) -> list[bool]:
        def parse(text: str) -> int | None:
            """Dotted quad -> unsigned 32-bit integer, or None when malformed."""
            parts = text.split(".")
            if len(parts) != 4:
                return None
            value = 0
            for part in parts:
                # str.isdigit() accepts non-ASCII digits and int() accepts signs and spaces: check by hand.
                if not 1 <= len(part) <= 3 or any(ch not in "0123456789" for ch in part):
                    return None
                if len(part) > 1 and part[0] == "0":
                    return None
                octet = int(part)
                if octet > 255:
                    return None
                value = value * 256 + octet
            return value

        network_text, prefix_text = cidr.split("/")
        prefix = int(prefix_text)
        # Top `prefix` bits set; prefix 0 gives an all-zero mask that matches everything.
        mask = (0xFFFFFFFF << (32 - prefix)) & 0xFFFFFFFF
        network = parse(network_text) & mask
        result = []
        for ip in ips:
            address = parse(ip)
            result.append(address is not None and (address & mask) == network)
        return result
  javascript: |
    function ipsInSubnet(cidr, ips) {
      const parse = (text) => {
        const parts = text.split(".");
        if (parts.length !== 4) {
          return null;
        }
        let value = 0;
        for (const part of parts) {
          if (!/^[0-9]{1,3}$/.test(part) || (part.length > 1 && part[0] === "0")) {
            return null;
          }
          const octet = Number(part);
          if (octet > 255) {
            return null;
          }
          value = value * 256 + octet; // arithmetic keeps values unsigned (no 32-bit sign issues)
        }
        return value;
      };
      const [networkText, prefixText] = cidr.split("/");
      const prefix = Number(prefixText);
      const blockSize = 2 ** (32 - prefix); // addresses per network; 2^32 for /0
      const networkId = Math.floor(parse(networkText) / blockSize);
      return ips.map((ip) => {
        const address = parse(ip);
        return address !== null && Math.floor(address / blockSize) === networkId;
      });
    }
