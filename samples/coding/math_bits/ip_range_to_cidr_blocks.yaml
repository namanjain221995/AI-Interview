expected_concepts:
  - converting dotted quads to a 32-bit unsigned integer and back
  - CIDR alignment via the lowest set bit of the start address
  - greedy choice of the largest aligned block that fits the remaining size
  - avoiding signed 32-bit overflow at 255.255.255.255 and for a /0 block
optimal_complexity: {time: O(32) blocks of O(32) work each, space: O(1) beyond the output}
rubric:
  excellent: Converts addresses to unsigned integers, explains that a block at start is limited both by the alignment of start (its lowest set bit) and by the remaining count, applies that greedy choice until the range is covered, argues why it is minimal, and handles 0.0.0.0, 255.255.255.255 and the /0 case without overflow.
  good: Correct greedy conversion with a small bug at an extreme (for example overflow at the top address or address 0) found and fixed during testing.
  weak: Emits one /32 per address, picks blocks that spill outside the range, ignores alignment, or produces unsorted or malformed output.
  criteria:
    correctness: All tests pass, including the whole space, single addresses and the 62-block worst case.
    efficiency: At most about 62 blocks, each found in constant or O(32) time; never iterates over individual addresses.
    code_quality: Separate helpers for parsing and formatting addresses; the block-size rule is one clear loop or bit expression.
    edge_cases: Address 0 (no lowest set bit), 255.255.255.255, ranges crossing octet boundaries and the full /0 range.
    communication: Explains why both the alignment and the remaining size bound each block, and why the greedy choice is optimal.
hints:
  - Treat every address as a 32-bit number. Which sizes of block can legally start at a given address, and what decides whether a block stays inside the range?
  - A block that starts at address x can have size 2^k only if x is a multiple of 2^k, which is governed by the lowest set bit of x; it also must not be larger than the number of addresses still left to cover.
  - Repeat from the current start - pick the largest power of two that divides start (any size works for start 0) and does not exceed end - start + 1, emit start with prefix 32 minus log2(size), then advance start by size. Use 64-bit or unbounded arithmetic so 255.255.255.255 and a size of 2^32 do not overflow.
followups:
  - How would you merge an arbitrary list of overlapping CIDR blocks into the minimum equivalent list?
  - How would you extend the converter to IPv6 ranges?
  - Given an allow-list of blocks, how would you test quickly whether an address is permitted?
  - How would you compute the blocks for a range minus a few excluded addresses?
common_errors:
  - Using signed 32-bit integers or bitwise operators that treat addresses above 127.255.255.255 as negative.
  - Taking only the lowest set bit of the start and overshooting the end of the range.
  - Looping forever or crashing at start 0, whose lowest set bit is undefined.
  - Computing end + 1 in 32-bit arithmetic, which wraps to 0 at 255.255.255.255.
