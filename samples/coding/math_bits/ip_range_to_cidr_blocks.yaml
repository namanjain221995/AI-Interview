version: 1
slug: ip_range_to_cidr_blocks
title: IP Range to CIDR Blocks
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [network, security, cloud, devops]
time_limit_minutes: 30
prompt_markdown: |
  ## IP Range to CIDR Blocks

  A partner sends you the IPv4 addresses their egress gateways use as an inclusive range such as
  `10.0.0.5 - 10.0.0.20`. Your cloud firewall's allow-list, however, accepts **only CIDR blocks**.
  Write the converter that turns the range into firewall rules.

  A CIDR block `a.b.c.d/p` covers the `2^(32 - p)` consecutive addresses that share their first `p`
  bits with `a.b.c.d`; the block's first address must have its last `32 - p` bits equal to zero (for
  example `10.0.0.8/29` covers `10.0.0.8` to `10.0.0.15`, while `10.0.0.6/29` is not a valid block).

  Given `first_ip` and `last_ip` as dotted quads with `first_ip <= last_ip`, return the **smallest
  possible number** of CIDR blocks whose union is **exactly** the addresses from `first_ip` to
  `last_ip` inclusive: nothing outside the range may be allowed. Return the blocks as strings
  `"a.b.c.d/p"`, where `a.b.c.d` is the block's first address written without leading zeros, sorted
  by ascending first address. The minimum set of blocks is unique, so the expected output is unique.

  ### Example 1
  ```
  Input:  first_ip = "10.0.0.5", last_ip = "10.0.0.20"
  Output: ["10.0.0.5/32", "10.0.0.6/31", "10.0.0.8/29", "10.0.0.16/30", "10.0.0.20/32"]
  ```

  ### Example 2
  ```
  Input:  first_ip = "192.168.1.0", last_ip = "192.168.1.255"
  Output: ["192.168.1.0/24"]
  ```

  ### Example 3
  ```
  Input:  first_ip = "172.16.0.255", last_ip = "172.16.1.0"
  Output: ["172.16.0.255/32", "172.16.1.0/32"]
  Explanation: the two addresses are adjacent but no aligned block of size 2 contains both.
  ```

  ### Constraints
  - `first_ip` and `last_ip` are valid IPv4 addresses: four decimal octets `0..255` separated by
    dots, without leading zeros.
  - `first_ip <= last_ip` when compared as 32-bit unsigned numbers.
  - The range may be a single address or the whole address space `0.0.0.0` to `255.255.255.255`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: range_to_cidrs
  params:
    - {name: first_ip, type: string}
    - {name: last_ip, type: string}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def range_to_cidrs(first_ip: str, last_ip: str) -> list[str]:
        def to_int(ip: str) -> int:
            value = 0
            for part in ip.split("."):
                value = value * 256 + int(part)
            return value

        def to_ip(value: int) -> str:
            return ".".join(str((value >> shift) & 255) for shift in (24, 16, 8, 0))

        start = to_int(first_ip)
        end = to_int(last_ip)
        blocks: list[str] = []
        while start <= end:
            remaining = end - start + 1
            # Largest power of two that keeps the block aligned at start and inside the range.
            size = 1
            while start % (size * 2) == 0 and size * 2 <= remaining:
                size *= 2
            prefix = 32 - (size.bit_length() - 1)
            blocks.append(f"{to_ip(start)}/{prefix}")
            start += size
        return blocks
  javascript: |
    function rangeToCidrs(firstIp, lastIp) {
      // Plain Number arithmetic: JavaScript bitwise operators are signed 32-bit and break above 2^31.
      const toInt = (ip) => ip.split(".").reduce((acc, part) => acc * 256 + Number(part), 0);
      const toIp = (value) => {
        const octets = [];
        for (let i = 0; i < 4; i++) {
          octets.unshift(value % 256);
          value = Math.floor(value / 256);
        }
        return octets.join(".");
      };

      let start = toInt(firstIp);
      const end = toInt(lastIp);
      const blocks = [];
      while (start <= end) {
        const remaining = end - start + 1;
        let size = 1;
        let hostBits = 0;
        while (start % (size * 2) === 0 && size * 2 <= remaining) {
          size *= 2;
          hostBits++;
        }
        blocks.push(`${toIp(start)}/${32 - hostBits}`);
        start += size;
      }
      return blocks;
    }
