expected_concepts:
  - "state = length of the current streak (1..max_streak)"
  - "linear recurrence between consecutive days"
  - "matrix exponentiation by repeated squaring in O(m^3 log days)"
  - "modular arithmetic with overflow-safe multiplication"
  - "64-bit day count"
optimal_complexity: {time: "O(max_streak^3 * log days)", space: "O(max_streak^2)"}
rubric:
  excellent: "Defines streak-length states, derives the transition (switch to one of teams - 1 others or extend the streak), turns it into a matrix and exponentiates in O(m^3 log days) with overflow-safe modular multiplication, and checks small cases by hand."
  good: "Finds the correct recurrence and a working day-by-day DP, then reaches matrix exponentiation with a hint, or has a minor modular-arithmetic slip that is fixed when pointed out."
  weak: "Only enumerates sequences or loops over 10^15 days, mixes up 'teams' and 'teams - 1' in the transition, or overflows the modular products."
  criteria:
    correctness: "Passes all tests, including max_streak 1, max_streak at least days, and the 10^15-day cases."
    efficiency: "Logarithmic in days via fast exponentiation; matrix size bounded by max_streak."
    code_quality: "States and the transition are documented; matrix multiply and the power loop are separate helpers."
    edge_cases: "Handles days = 1, teams near 10^9 (reduced modulo), and the case where the limit never binds."
    communication: "Explains why the streak length is the only state needed and verifies the recurrence on Example 1."
hints:
  - "Count rotations day by day. What is the smallest piece of information about the last few days you must remember to know which teams are allowed tomorrow?"
  - "Let the state be how many consecutive days the current team has been on call. Tomorrow either a different team takes over (teams - 1 choices, streak resets to 1) or the same team continues (streak grows by 1, only while it stays within max_streak). This is a linear recurrence over max_streak states."
  - "Write the transition as a max_streak by max_streak matrix: the first row has teams - 1 in every column and the sub-diagonal has 1s. Start from a vector with teams in the streak-1 slot, raise the matrix to the power days - 1 by repeated squaring, apply it, and sum the vector, reducing every product modulo 1_000_000_007 with 64-bit (or split) multiplication."
followups:
  - "How would you also forbid a team from being on call more than k days in any 7-day window?"
  - "Can you reduce the cost below O(m^3 log days) using the characteristic polynomial of the recurrence?"
  - "How would the model change if some teams had different streak limits?"
  - "How would you count rotations where a specific team covers the first and last day?"
common_errors:
  - "Using teams instead of teams - 1 for the 'switch' transition, which double-counts staying with the same team."
  - "Iterating day by day, which cannot finish for 10^15 days."
  - "Overflowing when multiplying two residues near 10^9 in 64-bit or double arithmetic before reducing."
  - "Off-by-one in the exponent (days instead of days - 1) or in the streak limit."
  - "Forgetting to reduce teams modulo 1_000_000_007 when it is close to 10^9."
