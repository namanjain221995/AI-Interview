slug: oncall_streak_rotations
title: "On-Call Streak Rotations"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [sre, engineering_manager, backend, platform]
time_limit_minutes: 35
prompt_markdown: |
  ## On-Call Streak Rotations

  An operations group plans a long on-call calendar. There are `teams` teams and the calendar covers
  `days` consecutive days. Every day **exactly one** team is on call. To limit fatigue, no team may be
  on call for more than `max_streak` days **in a row**; the same team may come back later after
  another team has taken at least one day.

  A rotation is the full sequence of on-call teams, one per day; two rotations differ if some day has
  a different team. Return the number of valid rotations **modulo `1_000_000_007`**.

  ### Example 1
  ```
  Input:  days = 3, teams = 2, max_streak = 2
  Output: 6
  Explanation: of the 8 sequences over teams A and B, only AAA and BBB break the limit.
  ```

  ### Example 2
  ```
  Input:  days = 4, teams = 3, max_streak = 1
  Output: 24
  Explanation: 3 choices on day 1, then 2 choices (any other team) on each later day.
  ```

  ### Example 3
  ```
  Input:  days = 5, teams = 3, max_streak = 2
  Output: 180
  ```

  ### Constraints
  - `1 <= days <= 10^15`
  - `2 <= teams <= 10^9`
  - `1 <= max_streak <= 20`
  - Intermediate products of two values below `1_000_000_007` exceed 32 bits (and the exact
    integer range of a double); multiply them safely.

  **Follow-up:** a day-by-day loop is fine for small `days`. How do you handle `days = 10^15`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_rotations
  params:
    - {name: days, type: "long"}
    - {name: teams, type: int}
    - {name: max_streak, type: int}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    MOD = 1_000_000_007


    def count_rotations(days: int, teams: int, max_streak: int) -> int:
        m = max_streak
        # state k means the current team has been on call for exactly k + 1 days in a row.
        # Next day: switching to any of the other teams - 1 teams starts a new streak of 1,
        # staying with the same team moves state k to k + 1 (only while k + 1 < m).
        transition = [[0] * m for _ in range(m)]
        for k in range(m):
            transition[0][k] = (teams - 1) % MOD
        for k in range(1, m):
            transition[k][k - 1] = 1

        def mat_mul(a: list[list[int]], b: list[list[int]]) -> list[list[int]]:
            columns = list(zip(*b))
            return [[sum(x * y for x, y in zip(row, col)) % MOD for col in columns] for row in a]

        def apply(mat: list[list[int]], vec: list[int]) -> list[int]:
            return [sum(x * y for x, y in zip(row, vec)) % MOD for row in mat]

        vec = [teams % MOD] + [0] * (m - 1)  # day 1: any team, streak 1
        power = days - 1
        base = transition
        while power:
            if power & 1:
                vec = apply(base, vec)
            power >>= 1
            if power:
                base = mat_mul(base, base)
        return sum(vec) % MOD
  javascript: |
    const MOD = 1000000007;

    // (a * b) % MOD without exceeding 2^53: split b into 15-bit halves.
    function mulMod(a, b) {
      const hi = Math.floor(b / 32768);
      const lo = b % 32768;
      return (((a * hi) % MOD) * 32768 + a * lo) % MOD;
    }

    function countRotations(days, teams, maxStreak) {
      const m = maxStreak;
      const trans = [];
      for (let i = 0; i < m; i++) trans.push(new Array(m).fill(0));
      for (let k = 0; k < m; k++) trans[0][k] = (teams - 1) % MOD;
      for (let k = 1; k < m; k++) trans[k][k - 1] = 1;

      const matMul = (a, b) => {
        const out = [];
        for (let i = 0; i < m; i++) {
          const row = new Array(m).fill(0);
          for (let k = 0; k < m; k++) {
            const aik = a[i][k];
            if (aik === 0) continue;
            for (let j = 0; j < m; j++) {
              if (b[k][j] !== 0) row[j] = (row[j] + mulMod(aik, b[k][j])) % MOD;
            }
          }
          out.push(row);
        }
        return out;
      };
      const apply = (mat, vec) => mat.map((row) => {
        let s = 0;
        for (let j = 0; j < m; j++) s = (s + mulMod(row[j], vec[j])) % MOD;
        return s;
      });

      let vec = new Array(m).fill(0);
      vec[0] = teams % MOD;
      let power = BigInt(days) - 1n;
      let base = trans;
      while (power > 0n) {
        if (power & 1n) vec = apply(base, vec);
        power >>= 1n;
        if (power > 0n) base = matMul(base, base);
      }
      return vec.reduce((s, v) => (s + v) % MOD, 0);
    }
