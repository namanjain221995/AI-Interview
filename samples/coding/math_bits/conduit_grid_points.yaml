version: 1
slug: conduit_grid_points
title: Conduit Grid Points
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist, mobile]
time_limit_minutes: 15
prompt_markdown: |
  ## Conduit Grid Points

  A raised floor in a server room has a junction box at **every integer coordinate**. An installer runs a
  perfectly straight cable conduit from the junction at `(x1, y1)` to the junction at `(x2, y2)`, and
  wants to know how many junction boxes the conduit passes **exactly** through, so that each one can be
  fitted with a pass-through clip.

  Return the number of integer points on the straight segment between the two junctions, **including
  both endpoints**. If both endpoints are the same junction, the answer is `1`.

  ### Example 1
  ```
  Input:  x1 = 0, y1 = 0, x2 = 6, y2 = 4
  Output: 3
  Explanation: The conduit passes through (0, 0), (3, 2) and (6, 4).
  ```

  ### Example 2
  ```
  Input:  x1 = -2, y1 = 3, x2 = 4, y2 = 3
  Output: 7
  Explanation: A horizontal run from x = -2 to x = 4 touches seven junctions.
  ```

  ### Example 3
  ```
  Input:  x1 = 5, y1 = 5, x2 = 5, y2 = 5
  Output: 1
  ```

  ### Constraints
  - `-10^9 <= x1, y1, x2, y2 <= 10^9`
  - Coordinate differences can reach `2 * 10^9`, which does not fit in a signed 32-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: conduit_grid_points
  params:
    - {name: x1, type: int}
    - {name: y1, type: int}
    - {name: x2, type: int}
    - {name: y2, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def conduit_grid_points(x1: int, y1: int, x2: int, y2: int) -> int:
        a, b = abs(x2 - x1), abs(y2 - y1)
        # Euclid's algorithm; gcd(a, 0) == a covers horizontal and vertical runs.
        while b:
            a, b = b, a % b
        return a + 1
  javascript: |
    function conduitGridPoints(x1, y1, x2, y2) {
      let a = Math.abs(x2 - x1);
      let b = Math.abs(y2 - y1);
      while (b !== 0) {
        const r = a % b;
        a = b;
        b = r;
      }
      return a + 1;
    }
tests:
  - {id: t1, args: [0, 0, 6, 4], expected: 3, description: "Example 1 - gcd 2 gives 3 junctions"}
  - {id: t2, args: [-2, 3, 4, 3], expected: 7, description: "Example 2 - horizontal run of length 6"}
  - {id: t3, args: [5, 5, 5, 5], expected: 1, description: "Example 3 - identical endpoints"}
  - {id: t4, hidden: true, args: [1, -4, 1, 7], expected: 12, description: "Vertical run"}
  - {id: t5, hidden: true, args: [0, 0, 7, 3], expected: 2, description: "Coprime offsets - only the two endpoints"}
  - {id: t6, hidden: true, args: [3, -7, -9, 11], expected: 7, description: "Negative direction with gcd 6"}
  - {id: t7, hidden: true, args: [-1000000000, -1000000000, 1000000000, 1000000000], expected: 2000000001, description: "Full diagonal of the range - difference 2*10^9 overflows 32-bit, answer above 2^31"}
  - {id: t8, hidden: true, args: [-1000000000, 0, 1000000000, 1], expected: 2, description: "Huge dx but dy 1 - only endpoints"}
  - {id: t9, hidden: true, args: [1000000000, -1000000000, -1000000000, 1000000000], expected: 2000000001, description: "Anti-diagonal across the full range in the negative direction"}
  - {id: t10, hidden: true, args: [0, 0, 0, 1], expected: 2, description: "Adjacent junctions"}
expected_concepts:
  - "lattice points on a segment equal gcd(|dx|, |dy|) + 1"
  - "Euclid's algorithm for the greatest common divisor"
  - "gcd with zero handles horizontal, vertical and identical endpoints"
  - "64-bit differences to avoid overflow"
optimal_complexity: {time: "O(log(max(|dx|, |dy|)))", space: "O(1)"}
rubric:
  excellent: "Explains why the step between consecutive grid points is (dx / g, dy / g) with g the gcd, implements Euclid's algorithm, notes that gcd with zero covers straight runs and identical points, and widens to 64 bits before subtracting."
  good: "Reaches the gcd formula with a hint and implements it correctly; may need a nudge on overflow or the zero cases."
  weak: "Walks the segment one unit at a time (far too slow), uses floating-point slope checks, or overflows on the full-range diagonal."
  criteria:
    correctness: "All tests pass, including identical endpoints, vertical and horizontal runs and full-range coordinates."
    efficiency: "Logarithmic time via Euclid's algorithm; no per-unit scanning."
    code_quality: "Absolute differences computed once; gcd loop is short and clear."
    edge_cases: "Zero differences, coprime differences, negative directions, 2 * 10^9 differences."
    communication: "Gives a clear argument for the gcd formula instead of only stating it."
hints:
  - "Consider the smallest step you can take along the conduit that lands exactly on another junction; every junction on the segment is a whole number of those steps from the start."
  - "If the horizontal and vertical distances share a common factor, dividing both by their greatest common divisor gives that smallest step, and the number of steps is that divisor."
  - "Take the absolute differences of the x and y coordinates in a 64-bit type, compute their greatest common divisor with Euclid's remainder loop (the divisor of a value and zero is the value itself), and add one to count the starting junction."
followups:
  - "How would you list the junction coordinates instead of counting them?"
  - "How would you count grid points strictly inside a triangle whose corners are junctions (Pick's theorem)?"
  - "How would you check whether three junctions lie on a common straight line without floating point?"
common_errors:
  - "Subtracting in 32-bit integers, which overflows for coordinates near plus and minus 10^9."
  - "Forgetting to add one for the starting endpoint."
  - "Special-casing horizontal or vertical runs incorrectly instead of relying on the gcd with zero."
  - "Comparing floating-point slopes to decide whether points lie on the segment."
