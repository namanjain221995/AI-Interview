  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def classify_points(polygon: list[list[int]], points: list[list[int]]) -> list[str]:
        n = len(polygon)
        labels: list[str] = []
        for px, py in points:
            on_edge = False
            inside = False
            for i in range(n):
                ax, ay = polygon[i]
                bx, by = polygon[(i + 1) % n]
                cross = (bx - ax) * (py - ay) - (by - ay) * (px - ax)
                if cross == 0 and min(ax, bx) <= px <= max(ax, bx) and min(ay, by) <= py <= max(ay, by):
                    on_edge = True
                    break
                # half-open rule: the edge counts if exactly one endpoint is strictly above py,
                # which handles rays through vertices and ignores horizontal edges
                if (ay > py) != (by > py):
                    # the crossing is to the right of the point iff cross has the sign of (by - ay)
                    if (cross > 0) == (by > ay):
                        inside = not inside
            if on_edge:
                labels.append("boundary")
            else:
                labels.append("inside" if inside else "outside")
        return labels
  javascript: |
    function classifyPoints(polygon, points) {
      const n = polygon.length;
      return points.map(([px, py]) => {
        let inside = false;
        for (let i = 0; i < n; i++) {
          const [ax, ay] = polygon[i];
          const [bx, by] = polygon[(i + 1) % n];
          const cross = (bx - ax) * (py - ay) - (by - ay) * (px - ax);
          if (cross === 0 && Math.min(ax, bx) <= px && px <= Math.max(ax, bx)
              && Math.min(ay, by) <= py && py <= Math.max(ay, by)) {
            return 'boundary';
          }
          if ((ay > py) !== (by > py)) {
            if ((cross > 0) === (by > ay)) inside = !inside;
          }
        }
        return inside ? 'inside' : 'outside';
      });
    }
