expected_concepts:
  - "point-on-segment test with a zero cross product and a bounding-box check"
  - "ray casting (crossing number) or winding number"
  - "half-open rule for edges to handle rays through vertices"
  - "ignoring horizontal edges in the crossing count"
  - "integer-only orientation tests (no division)"
optimal_complexity: {time: "O(n * q) for n vertices and q points", space: "O(q)"}
rubric:
  excellent: "Checks the boundary first with an exact integer test, applies a half-open crossing rule (or winding number) that is correct for rays through vertices and along horizontal edges, avoids floating point and explains orientation independence."
  good: "Correct ray casting for typical points, with vertex or horizontal-edge cases fixed after testing, or a correct solution that uses careful division."
  weak: "Counts a vertex crossing twice, treats boundary points as inside, relies on floating-point equality or only works for convex polygons."
  criteria:
    correctness: "Passes all tests, including concave notches, rays through vertices, horizontal edges and clockwise input."
    efficiency: "Linear in the number of edges per point."
    code_quality: "Separate helpers (or clearly separated blocks) for the boundary test and the crossing test; the sign convention is documented."
    edge_cases: "Points on vertices, on horizontal and vertical edges, collinear with an edge but outside it, and at extreme coordinates."
    communication: "Explains why the half-open rule counts each vertex exactly once."
hints:
  - "Handle the easy label first: when is a point exactly on a segment? Then think about what happens when you walk from the point in one direction to infinity and count how many edges you cross."
  - "A horizontal ray to the right crosses the boundary an odd number of times exactly when the point is inside. The tricky cases are rays through vertices and along horizontal edges: count an edge only when exactly one of its endpoints is strictly above the point."
  - "For each edge (a, b), first test the boundary with the cross product (b - a) x (p - a) equal to 0 plus a bounding-box check. Otherwise, if (a.y > p.y) differs from (b.y > p.y), the edge crosses the ray to the right of p exactly when that cross product is positive for an upward edge or negative for a downward edge; flip an inside flag for each such edge."
followups:
  - "How would you answer 10^5 queries against a fixed 10^5-vertex polygon faster than O(n) each?"
  - "How does the winding-number test differ from crossing number for self-intersecting polygons?"
  - "How would you handle real GPS coordinates (latitude and longitude) over large areas?"
  - "What precision issues appear if coordinates are floating point instead of integers?"
common_errors:
  - "Counting a crossing at a shared vertex twice (once per edge), flipping the answer."
  - "Counting horizontal edges that lie on the ray."
  - "Computing the intersection x with floating-point division and comparing for equality."
  - "Labelling points on the boundary as inside or outside."
  - "Testing collinearity without the bounding-box check, which marks points on the edge's extension as boundary."
