prompt_markdown: |
  ## Geofence Point Classification

  A delivery platform defines its service area as a geofence: a **simple polygon** (edges never
  cross or touch except consecutive edges at their shared vertex) that may be **concave**. The
  polygon is given as its vertices in order, `polygon[i] = [x, y]`, either clockwise or
  counter-clockwise; the last vertex connects back to the first.

  For each courier ping `points[j] = [x, y]`, decide where it lies:

  - `"boundary"` if it lies on any edge, including exactly on a vertex;
  - `"inside"` if it is strictly inside the polygon;
  - `"outside"` otherwise.

  Return the labels in the same order as `points`.

  ### Example 1
  ```
  Input:  polygon = [[0, 0], [6, 0], [6, 4], [0, 4]], points = [[3, 2], [6, 1], [7, 2], [0, 4]]
  Output: ["inside", "boundary", "outside", "boundary"]
  ```

  ### Example 2
  ```
  Input:  polygon = [[0, 0], [8, 0], [8, 6], [4, 2], [0, 6]], points = [[4, 4], [2, 2], [4, 2], [6, 3], [2, 6]]
  Output: ["outside", "inside", "boundary", "inside", "outside"]
  Explanation: [4, 4] sits in the V-shaped notch; [4, 2] is the notch vertex; a horizontal ray from [2, 2] passes exactly through that vertex.
  ```

  ### Constraints
  - `3 <= polygon.length <= 1000`, all vertices distinct
  - `1 <= points.length <= 1000`
  - `-10^4 <= x, y <= 10^4` for vertices and points
  - The polygon is simple and has non-zero area.

  **Follow-up:** can you classify every point using integer arithmetic only, with no division and no
  floating point?
languages: [python, javascript, typescript, java, go, cpp]
signature:
