version: 1
slug: recurring_rate_display
title: "Recurring Rate Display"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, fullstack, frontend, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Recurring Rate Display

  A billing system stores unit rates exactly, as an integer `numerator` over a non-zero integer
  `denominator` (for example, a monthly fee split across three seats is `1/3`). The invoice screen must
  show each rate as an exact decimal string, never a rounded one, so digits that repeat forever are
  shown once, enclosed in parentheses.

  Format the value `numerator / denominator` with these rules:

  - Write the integer part in plain decimal. If the value is negative, start with a single `-`.
  - If the value is a whole number, write only the integer part: no decimal point and no fractional
    digits. Zero is written `"0"` (never `"-0"`).
  - Otherwise write `.` and then the fractional digits. If the expansion terminates, write all of its
    digits. If it repeats, write the digits that come before the repeating part, then the **shortest**
    repeating block, starting at its **earliest** possible position, inside `(` and `)`.

  ### Example 1
  ```
  Input:  numerator = 1, denominator = 3
  Output: "0.(3)"
  ```

  ### Example 2
  ```
  Input:  numerator = 1, denominator = 6
  Output: "0.1(6)"
  Explanation: 1/6 = 0.1666..., so the 1 appears once and the 6 repeats.
  ```

  ### Example 3
  ```
  Input:  numerator = -50, denominator = 8
  Output: "-6.25"
  Explanation: The expansion terminates after two digits, so no parentheses are needed.
  ```

  ### Constraints
  - `-10^9 <= numerator <= 10^9`
  - `-10^5 <= denominator <= 10^5` and `denominator != 0`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: decimal_expansion
  params:
    - {name: numerator, type: "long"}
    - {name: denominator, type: "long"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def decimal_expansion(numerator: int, denominator: int) -> str:
        if numerator == 0:
            return "0"
        sign = "-" if (numerator < 0) != (denominator < 0) else ""
        num, den = abs(numerator), abs(denominator)
        whole, remainder = divmod(num, den)
        if remainder == 0:
            return sign + str(whole)
        digits: list[str] = []
        seen: dict[int, int] = {}  # remainder -> index of the digit it produces
        while remainder and remainder not in seen:
            seen[remainder] = len(digits)
            remainder *= 10
            digits.append(str(remainder // den))
            remainder %= den
        if remainder:  # the same remainder came back: digits from its first index repeat
            start = seen[remainder]
            fraction = "".join(digits[:start]) + "(" + "".join(digits[start:]) + ")"
        else:
            fraction = "".join(digits)
        return sign + str(whole) + "." + fraction
  javascript: |
    function decimalExpansion(numerator, denominator) {
      if (numerator === 0) {
        return "0";
      }
      const sign = (numerator < 0) !== (denominator < 0) ? "-" : "";
      const num = Math.abs(numerator);
      const den = Math.abs(denominator);
      const whole = Math.floor(num / den);
      let remainder = num % den;
      if (remainder === 0) {
        return sign + String(whole);
      }
      const digits = [];
      const seen = new Map(); // remainder -> index of the digit it produces
      while (remainder !== 0 && !seen.has(remainder)) {
        seen.set(remainder, digits.length);
        remainder *= 10;
        digits.push(String(Math.floor(remainder / den)));
        remainder %= den;
      }
      let fraction;
      if (remainder !== 0) {
        const start = seen.get(remainder);
        fraction = digits.slice(0, start).join("") + "(" + digits.slice(start).join("") + ")";
      } else {
        fraction = digits.join("");
      }
      return sign + String(whole) + "." + fraction;
    }
tests:
  - {id: t1, args: [1, 3], expected: "0.(3)", description: "Example 1"}
  - {id: t2, args: [1, 6], expected: "0.1(6)", description: "Example 2 - non-repeating digit before the cycle"}
  - {id: t3, args: [-50, 8], expected: "-6.25", description: "Example 3 - negative terminating value"}
  - {id: t4, hidden: true, args: [4, 2], expected: "2", description: "Whole number - no decimal point"}
  - {id: t5, hidden: true, args: [0, -5], expected: "0", description: "Zero over a negative denominator - must be \"0\", not \"-0\""}
  - {id: t6, hidden: true, args: [-1, -3], expected: "0.(3)", description: "Both negative - positive result"}
  - {id: t7, hidden: true, args: [7, -12], expected: "-0.58(3)", description: "Negative value below one with a prefix before the cycle (-0.58(3))"}
  - {id: t8, hidden: true, args: [22, 7], expected: "3.(142857)", description: "Integer part plus a six-digit cycle"}
  - {id: t9, hidden: true, args: [1, 81], expected: "0.(012345679)", description: "Cycle containing a leading zero digit (0.(012345679))"}
  - {id: t10, hidden: true, args: [1, 97], expected: "0.(010309278350515463917525773195876288659793814432989690721649484536082474226804123711340206185567)", description: "Long 96-digit cycle"}
  - {id: t11, hidden: true, args: [-1000000000, 1], expected: "-1000000000", description: "Most negative numerator over 1 - plain integer"}
  - {id: t12, hidden: true, args: [999999999, -100000], expected: "-9999.99999", description: "Large values with a terminating five-digit fraction"}
expected_concepts:
  - "long division producing one digit per remainder"
  - "cycle detection by remembering the position of each remainder"
  - "sign handling separate from magnitude"
  - "string building for integer, prefix and repeating parts"
optimal_complexity: {time: "O(d) where d < |denominator| is the number of fractional digits", space: "O(d) for the remainder map and the digits"}
rubric:
  excellent: "Handles the sign once up front, emits the integer part, simulates long division while mapping each remainder to the index of the digit it produces, inserts the parentheses at the index of the repeated remainder, and explains why the cycle starts there and is at most |denominator| - 1 digits long."
  good: "Correct long-division solution that needs a hint about where the parenthesis goes, the -0 case or negative denominators."
  weak: "Uses floating point and guesses the cycle from a fixed number of digits, detects repeats by digit instead of by remainder, or mishandles signs."
  criteria:
    correctness: "All tests pass, including -0, negative denominators, zeros inside the cycle and long cycles."
    efficiency: "Each remainder is processed at most once, so work is bounded by the denominator."
    code_quality: "Clear separation of sign, integer part and fractional part; the remainder map is named for what it stores."
    edge_cases: "Zero numerator, whole numbers, both signs negative, cycles that start after a prefix and long cycles."
    communication: "Explains why a repeated remainder implies a repeated digit sequence and why digit repeats are not enough."
hints:
  - "Think about how you divide by hand: at every step you have a remainder, write a digit, and carry the remainder on. What does it mean if a remainder you have already seen comes back?"
  - "Handle the sign and the integer part first, then do long division on the remainder. Remember, for each remainder, the position in the fractional digits where it was first used: once a remainder repeats, everything from that position onward repeats forever."
  - "Work with absolute values and prepend a minus sign only for a non-zero result with exactly one negative input. While the remainder is non-zero and not yet in your map, store remainder to current digit index, multiply the remainder by ten, append the quotient digit and keep the new remainder. If you stop because the remainder is zero the expansion terminates; otherwise insert an opening parenthesis at the stored index of that remainder and close it at the end."
followups:
  - "Why is the repeating block never longer than |denominator| - 1 digits?"
  - "How would you parse a string such as 0.1(6) back into a reduced fraction?"
  - "How would you render the rate in base 16 instead of base 10?"
common_errors:
  - "Using floating-point division, which loses exactness and cannot find long cycles."
  - "Detecting the cycle when a digit repeats instead of when a remainder repeats (the 96-digit cycle of 1/97 reuses every digit many times)."
  - "Producing \"-0\" for a zero numerator with a negative denominator."
  - "Adding a decimal point or trailing zeros to whole numbers."
  - "Overflowing when taking the absolute value of the most negative 32-bit integer in Java, Go or C-family languages."
