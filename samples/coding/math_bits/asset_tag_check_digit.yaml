slug: asset_tag_check_digit
title: Asset Tag Check Digit
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [backend, qa, support_engineer, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Asset Tag Check Digit

  The IT team tracks laptops, monitors and docks with printed asset tags. A tag is a string of
  decimal digits; people often add hyphens for readability, and hyphens carry no meaning (they may
  appear anywhere, including at the start, at the end or several in a row). After ignoring hyphens,
  the **last digit** is a check digit and all digits before it form the payload.

  To verify a tag, take the payload digits from **right to left**, starting with the digit
  immediately to the left of the check digit, and multiply them by the weights `3, 1, 3, 1, ...`
  in that order. Add up the products, then add the check digit. The tag is **valid** when this
  total is divisible by 10.

  Return `true` if the tag is valid and `false` otherwise. A tag is also invalid when:

  - it contains any character other than the digits `0`-`9` and `-` (spaces and letters included), or
  - it has fewer than 2 digits in total.

  ### Example 1
  ```
  Input:  tag = "7351-204-2"
  Output: true
  Explanation: Payload right to left: 4*3 + 0*1 + 2*3 + 1*1 + 5*3 + 3*1 + 7*3 = 58, and 58 + 2 = 60 is divisible by 10.
  ```

  ### Example 2
  ```
  Input:  tag = "7351-204-5"
  Output: false
  Explanation: 58 + 5 = 63 is not divisible by 10.
  ```

  ### Example 3
  ```
  Input:  tag = "7351-2O4-2"
  Output: false
  Explanation: The letter O is not a digit, so the tag is rejected.
  ```

  ### Constraints
  - `0 <= tag.length <= 100`
  - `tag` consists of printable ASCII characters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_valid_asset_tag
  params:
    - {name: tag, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def is_valid_asset_tag(tag: str) -> bool:
        digits: list[int] = []
        for ch in tag:
            if ch == "-":
                continue
            if not "0" <= ch <= "9":
                return False
            digits.append(ord(ch) - ord("0"))
        if len(digits) < 2:
            return False
        total = digits[-1]  # check digit
        weight = 3
        for digit in reversed(digits[:-1]):
            total += digit * weight
            weight = 4 - weight  # alternate 3, 1, 3, 1, ...
        return total % 10 == 0
  javascript: |
    function isValidAssetTag(tag) {
      const digits = [];
      for (const ch of tag) {
        if (ch === "-") continue;
        if (ch < "0" || ch > "9") return false;
        digits.push(ch.charCodeAt(0) - 48);
      }
      if (digits.length < 2) return false;
      let total = digits[digits.length - 1]; // check digit
      let weight = 3;
      for (let i = digits.length - 2; i >= 0; i--) {
        total += digits[i] * weight;
        weight = 4 - weight; // alternate 3, 1, 3, 1, ...
      }
      return total % 10 === 0;
    }
tests:
  - {id: t1, args: ["7351-204-2"], expected: true, description: "Example 1 - valid tag with hyphens"}
  - {id: t2, args: ["7351-204-5"], expected: false, description: "Example 2 - wrong check digit"}
  - {id: t3, args: ["7351-2O4-2"], expected: false, description: "Example 3 - letter O instead of zero"}
  - {id: t4, hidden: true, args: ["55"], expected: true, description: "Minimum length valid tag (one payload digit)"}
  - {id: t5, hidden: true, args: ["5"], expected: false, description: "Only one digit - invalid"}
  - {id: t6, hidden: true, args: [""], expected: false, description: "Empty string - invalid"}
  - {id: t7, hidden: true, args: ["--12-0-34--"], expected: true, description: "Leading, trailing and repeated hyphens are ignored (valid)"}
  - {id: t8, hidden: true, args: ["---"], expected: false, description: "Only hyphens - no digits"}
  - {id: t9, hidden: true, args: ["3141592665"], expected: false, description: "Adjacent digits transposed from a valid tag (weights must start at the right)"}
  - {id: t10, hidden: true, args: ["7351 2042"], expected: false, description: "Space separator is not allowed"}
  - {id: t11, hidden: true, args: ["987654321098765435"], expected: true, description: "Long valid tag (18 digits)"}
  - {id: t12, hidden: true, args: ["00-00"], expected: true, description: "All zeros is valid"}
expected_concepts:
  - "input validation before computation"
  - "weighted checksum anchored at the right end"
  - "modular arithmetic"
  - "separating parsing from verification"
optimal_complexity: {time: "O(n)", space: "O(n) (O(1) with a right-to-left scan)"}
rubric:
  excellent: "Validates characters and digit count first, anchors the weights at the right end of the payload, keeps parsing and checksum logic clearly separated and tests the tricky cases (hyphen-only, spaces, transpositions) out loud."
  good: "Correct checksum with hyphens ignored; misses one validation rule but fixes it when prompted."
  weak: "Starts the weights from the left, includes the check digit in the weighting, treats spaces as separators or crashes on empty input."
  criteria:
    correctness: "All tests pass, including empty, single-digit, hyphen-only and long tags."
    efficiency: "Single pass (or two) over the string; no repeated string rebuilding inside loops."
    code_quality: "Readable names for check digit, payload and weight; the alternating weight is expressed clearly."
    edge_cases: "Hyphens at both ends, repeated hyphens, non-digit characters, fewer than two digits."
    communication: "Explains why anchoring the weights at the right matters for tags of different lengths."
hints:
  - "Split the job in two: first clean the input and reject anything that is not a digit or a hyphen, then do the arithmetic on the digits that remain."
  - "Collect the digits in order while skipping hyphens. The check digit is the last one, and the weight pattern starts at the right end of the payload rather than the left, so tags of different lengths line up."
  - "Walk the payload digits from the rightmost to the leftmost, alternating a multiplier of three and one starting with three, and keep a running sum. Add the check digit and test whether the total leaves remainder zero when divided by ten. Reject early on any unexpected character and when fewer than two digits were found."
followups:
  - "Which single-digit typing errors does this scheme always detect, and which transpositions can it miss?"
  - "How would you generate the correct check digit for a new payload?"
  - "How would you report why a tag was rejected instead of returning only a boolean?"
  - "What changes if the tags can contain Unicode digits from other scripts?"
common_errors:
  - "Applying the weights from the left end of the payload."
  - "Weighting the check digit instead of adding it unweighted."
  - "Using a library digit test that accepts non-ASCII digits or treating spaces like hyphens."
  - "Returning true for an empty or hyphen-only tag because the total is 0."
