version: 1
slug: unscramble_ticket_number
title: "Unscramble Ticket Number"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, security, general, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Unscramble Ticket Number

  A support portal does not show internal ticket numbers in public links. Instead it shows a scrambled
  number computed as

  ```
  scrambled = (x * key) mod modulus
  ```

  where `x` is the internal ticket number, `0 <= x < modulus`. (This only hides sequential ids; it is not
  encryption.) The back end must map a public number back to its internal ticket number.

  Given `scrambled`, `key` and `modulus`, return the unique `x` in `[0, modulus)` that produces `scrambled`.
  The scrambling can only be reversed when `key` has a multiplicative inverse modulo `modulus`, which
  happens exactly when `gcd(key, modulus) = 1`. If it has no inverse, return `-1`: several ticket numbers
  would then share some scrambled values, so the mapping cannot be trusted.

  Intermediate products such as `x * key` can reach about `10^24`, far beyond the 64-bit range, so multiply
  carefully (use 128-bit arithmetic, big integers, or a multiply-by-doubling routine).

  ### Example 1
  ```
  Input:  scrambled = 1, key = 7, modulus = 1000
  Output: 143
  Explanation: 143 * 7 = 1001, and 1001 mod 1000 = 1.
  ```

  ### Example 2
  ```
  Input:  scrambled = 8, key = 4, modulus = 10
  Output: -1
  Explanation: gcd(4, 10) = 2, so 4 has no inverse modulo 10 (both 2 and 7 scramble to 8).
  ```

  ### Constraints
  - `2 <= modulus <= 10^12`
  - `0 <= key < modulus`
  - `0 <= scrambled < modulus`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: unscramble
  params:
    - {name: scrambled, type: "long"}
    - {name: key, type: "long"}
    - {name: modulus, type: "long"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def unscramble(scrambled: int, key: int, modulus: int) -> int:
        # Extended Euclid: keep old_s * key == old_r (mod modulus) as the remainders shrink.
        old_r, r = key, modulus
        old_s, s = 1, 0
        while r != 0:
            quotient = old_r // r
            old_r, r = r, old_r - quotient * r
            old_s, s = s, old_s - quotient * s
        if old_r != 1:
            return -1  # gcd(key, modulus) > 1, so key has no inverse
        inverse = old_s % modulus
        return scrambled * inverse % modulus
  javascript: |
    function unscramble(scrambled, key, modulus) {
      // BigInt keeps the 10^24-sized product exact; plain numbers lose precision above 2^53.
      const m = BigInt(modulus);
      let oldR = BigInt(key);
      let r = m;
      let oldS = 1n;
      let s = 0n;
      while (r !== 0n) {
        const quotient = oldR / r;
        [oldR, r] = [r, oldR - quotient * r];
        [oldS, s] = [s, oldS - quotient * s];
      }
      if (oldR !== 1n) return -1;
      const inverse = ((oldS % m) + m) % m;
      return Number((BigInt(scrambled) * inverse) % m);
    }
tests:
  - {id: t1, args: [1, 7, 1000], expected: 143, description: "Example 1"}
  - {id: t2, args: [8, 4, 10], expected: -1, description: "Example 2 - key shares a factor with the modulus"}
  - {id: t3, hidden: true, args: [1, 1, 2], expected: 1, description: "Smallest modulus with key 1"}
  - {id: t4, hidden: true, args: [0, 0, 5], expected: -1, description: "key = 0 is never invertible, even when scrambled is 0"}
  - {id: t5, hidden: true, args: [0, 3, 10], expected: 0, description: "scrambled = 0 with an invertible key maps back to ticket 0"}
  - {id: t6, hidden: true, args: [913426587693, 123456789012, 999999999989], expected: 876543210987, description: "Prime modulus near 10^12: the inverse times scrambled overflows 64 bits"}
  - {id: t7, hidden: true, args: [340565351662, 365435296162, 591286729879], expected: 400000000001, description: "Consecutive Fibonacci numbers as key and modulus (longest Euclid chain, negative Bezout coefficient)"}
  - {id: t8, hidden: true, args: [999999999997, 999999999999, 1000000000000], expected: 3, description: "key = modulus - 1 is its own inverse"}
  - {id: t9, hidden: true, args: [123456, 244140625, 1000000000000], expected: -1, description: "key = 5^12 shares factors with 10^12, return -1"}
  - {id: t10, hidden: true, args: [42, 777777777777, 999999999998], expected: 54, description: "Even composite modulus near 10^12 with a large coprime key (Fermat's theorem would give a wrong inverse)"}
expected_concepts:
  - "modular multiplicative inverse"
  - "extended Euclidean algorithm"
  - "invertible exactly when gcd(key, modulus) = 1"
  - "normalising a negative Bezout coefficient into [0, modulus)"
  - "overflow-safe modular multiplication (128-bit or big integers)"
optimal_complexity: {time: "O(log modulus)", space: "O(1)"}
rubric:
  excellent: "Recognises the need for the inverse of key, computes it with the extended Euclidean algorithm, returns -1 when the gcd is not 1, normalises the coefficient into range and multiplies without overflow, explaining why Fermat's little theorem does not apply to composite moduli."
  good: "Computes the inverse correctly but needs a hint for overflow-safe multiplication or for normalising a negative coefficient."
  weak: "Searches every x in a loop, uses Fermat's little theorem with a composite modulus, or overflows the product."
  criteria:
    correctness: "All tests pass, including key 0, non-invertible keys and moduli near 10^12."
    efficiency: "Logarithmic extended Euclid instead of a linear search over x."
    code_quality: "Iterative extended Euclid with clear names for the remainder and coefficient pairs."
    edge_cases: "key 0, scrambled 0, modulus 2 and keys sharing factors with the modulus."
    communication: "Explains why an inverse exists exactly when the gcd is 1 and where overflow can occur."
hints:
  - "Undoing a multiplication by key modulo modulus is a multiplication by some other number. What is that number called, and when does it exist?"
  - "The inverse of key exists exactly when key and modulus share no common factor. The extended form of Euclid's gcd algorithm finds coefficients that combine key and modulus into their gcd, and one of those coefficients is the inverse."
  - "Run the extended Euclidean algorithm on key and modulus while tracking the coefficient of key. If the final remainder is not 1, return minus one. Otherwise bring the coefficient into the range zero to modulus minus one, multiply it by scrambled using 128-bit or big-integer arithmetic, and reduce modulo modulus."
followups:
  - "Why can you not use Fermat's little theorem here, and when could you?"
  - "How would you multiply two 40-bit numbers modulo a 40-bit modulus using only 64-bit integers?"
  - "What property of the scrambling makes it easy for an outsider to reverse, and what would you use instead to hide ids?"
  - "How would you scramble ids so that consecutive tickets do not produce consecutive public numbers?"
common_errors:
  - "Using Fermat's little theorem, which only gives the inverse for a prime modulus."
  - "Returning the raw Bezout coefficient, which can be negative."
  - "Multiplying two values near 10^12 in 64-bit integers and overflowing."
  - "Treating key = 0 or a key sharing a factor with the modulus as invertible."
