  - {id: t10, hidden: true, args: [[8, 8, 8, 8]], expected: 8, description: "All batches equal"}
  - {id: t11, hidden: true, args: [[626502240, 839505240, 501822720, 101694600, 863319240, 260842680, 630594720, 866864880, 377901720, 739909800, 235987920, 413552160, 563192280, 705670560, 230801760, 711050760, 682597440, 425565000, 183209040, 740738880, 106386840, 211044960, 826610400, 696762360, 520044840, 122474520, 52284960, 685155240, 58511880, 742220640, 777077280, 234082800, 318402000, 722340360, 654267600, 224557200, 871874640, 169326360, 470547000, 869034600, 659665440, 200478600, 174477240, 350559720, 286403040, 710062920, 680304240, 462132720, 594820800, 242197200, 205770600, 720823320, 729325800, 858327120, 467512920, 215984160, 29582280, 816220440, 167809320, 519974280]], expected: 17640, description: "60 random multiples of 17640 (performance and correctness on a long list)"}
expected_concepts:
  - "greatest common divisor"
  - "Euclid's algorithm"
  - "folding a binary operation across a list"
  - "early exit when the running value reaches 1"
optimal_complexity: {time: "O(n log V)", space: "O(1)"}
rubric:
  excellent: "Recognises the greatest common divisor immediately, implements Euclid's algorithm (or uses the library function and can explain it), folds it across the list and explains the O(n log V) bound."
  good: "Correct gcd fold with a library call, or a correct but slower divisor search with a clear plan to improve it."
  weak: "Tries every capacity from the smallest batch downwards for large inputs, checks only pairs, or returns the minimum element."
  criteria:
    correctness: "All tests pass, including coprime sets, pairwise-sharing sets and maximum values."
    efficiency: "Logarithmic work per element via Euclid; no linear scan over candidate capacities."
    code_quality: "Small helper for the two-number case and a readable fold."
    edge_cases: "Single batch, a batch of 1, identical batches and large primes."
    communication: "Explains why the gcd of two values divides every remaining combination and why Euclid terminates quickly."
hints:
  - "A valid capacity has to divide every batch exactly. What is the name of the largest number that divides two given quantities?"
  - "The greatest common divisor of two numbers can be found quickly with Euclid's remainder method, and the result can be combined with the next batch one element at a time."
  - "Keep a running answer starting from the first batch. Replace it with the greatest common divisor of itself and each next batch, repeatedly swapping the pair for the smaller value and the remainder until the remainder is zero. You can stop early once the running value reaches 1."
followups:
  - "Why does Euclid's algorithm need only a logarithmic number of steps?"
  - "How many full crates would the whole delivery need at the chosen capacity?"
  - "What if one batch may be excluded to make the capacity larger?"
  - "How would you compute this when the batches arrive as a stream?"
common_errors:
  - "Returning the smallest batch, which only works when it divides all others."
  - "Checking that every pair shares a divisor instead of the whole set."
  - "Scanning every candidate from the smallest batch downwards, which is too slow for 10^9."
  - "Forgetting the single-batch case."
