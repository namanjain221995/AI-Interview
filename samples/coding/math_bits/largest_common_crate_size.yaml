  - {id: t2, args: [[9, 28]], expected: 1, description: "Example 2 - coprime quantities give 1"}
  - {id: t3, args: [[42]], expected: 42, description: "Example 3 - single batch returns its own quantity"}
  - {id: t4, hidden: true, args: [[1, 1000000000]], expected: 1, description: "A batch of 1 forces capacity 1"}
  - {id: t5, hidden: true, args: [[1000000000, 1000000000]], expected: 1000000000, description: "Identical maximum batches"}
  - {id: t6, hidden: true, args: [[500000000, 750000000, 1000000000]], expected: 250000000, description: "Large values with a large common divisor"}
