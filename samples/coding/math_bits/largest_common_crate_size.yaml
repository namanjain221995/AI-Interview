version: 1
slug: largest_common_crate_size
title: Largest Common Crate Size
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_analyst, business_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## Largest Common Crate Size

  A warehouse receives several batches of the same product, and `batches[i]` is the number of units
  in batch `i`. Operations wants to standardise on **one** crate capacity `c` such that every batch
  can be packed, on its own, into crates that are all **completely full**, with no units left over.

  Return the **largest** crate capacity that works for every batch. A list with a single batch
  returns that batch's quantity.

  ### Example 1
  ```
  Input:  batches = [12, 18, 30]
  Output: 6
  Explanation: Crates of 6 hold 2, 3 and 5 full crates; no larger size divides all three.
  ```

  ### Example 2
  ```
  Input:  batches = [9, 28]
  Output: 1
  Explanation: 9 and 28 share no divisor above 1, so only one-unit crates work.
  ```

  ### Example 3
  ```
  Input:  batches = [42]
  Output: 42
  ```

  ### Constraints
  - `1 <= batches.length <= 10^4`
  - `1 <= batches[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: largest_crate_size
  params:
    - {name: batches, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def largest_crate_size(batches: list[int]) -> int:
        capacity = batches[0]
        for quantity in batches[1:]:
            a, b = capacity, quantity
            while b:
                a, b = b, a % b  # Euclid's algorithm
            capacity = a
            if capacity == 1:
                break
        return capacity
  javascript: |
    function largestCrateSize(batches) {
      let capacity = batches[0];
      for (let i = 1; i < batches.length && capacity !== 1; i++) {
        let a = capacity;
        let b = batches[i];
        while (b !== 0) {
          const r = a % b; // Euclid's algorithm
          a = b;
          b = r;
        }
        capacity = a;
      }
      return capacity;
    }
tests:
