expected_concepts:
  - "coordinate compression of x (and optionally y) boundaries"
  - "sweep line over vertical slabs"
  - "merging overlapping intervals inside each slab"
  - "segment tree with cover counts for an O(n log n) sweep"
  - "64-bit area arithmetic"
optimal_complexity: {time: "O(n log n) with a segment-tree sweep (O(n^2 log n) slab sweep is acceptable for n = 200)", space: "O(n)"}
rubric:
  excellent: "Explains why inclusion-exclusion over all subsets explodes, compresses x coordinates, sweeps slabs while merging y-intervals (or uses a cover-count segment tree), handles touching edges, uses 64-bit products and states the complexity."
  good: "Implements a correct compressed-grid or slab sweep in O(n^2 log n) or O(n^3) with minor guidance, with correct 64-bit arithmetic."
  weak: "Marks unit cells, sums areas minus pairwise overlaps only, or double-counts regions covered by three or more zones."
  criteria:
    correctness: "Passes all tests, including nested, touching, identical and triple-overlapping zones."
    efficiency: "Work depends on the number of zones, not on coordinate magnitudes."
    code_quality: "Slab iteration and interval merging are clearly separated; no magic constants."
    edge_cases: "Handles an empty list, edge-only contact, duplicates and coordinates up to 10^7 without overflow."
    communication: "Explains why pairwise subtraction fails when three zones overlap the same spot."
hints:
  - "Pairwise overlap subtraction breaks when three or more zones overlap the same spot. Instead, try cutting the floor into strips in which the picture is simple."
  - "Only the x coordinates where some zone starts or ends matter. Between two consecutive such coordinates, every zone either spans the whole strip or misses it entirely, so the covered height in that strip is constant."
  - "Sort the distinct x boundaries. For each pair of neighbours, collect the [y1, y2] intervals of zones that span that strip, sort and merge them to get the covered height, and add height times strip width to a 64-bit total. A segment tree over compressed y values with cover counts lets you do the same sweep in O(n log n)."
followups:
  - "How would you speed this up to O(n log n) for 10^5 zones?"
  - "How would you compute the area covered by at least two zones (collision risk)?"
  - "How would you compute the perimeter of the covered region?"
  - "What changes if zones are added and removed online and you must report the area after each change?"
common_errors:
  - "Allocating a grid of unit cells, which is infeasible for coordinates up to 10^7."
  - "Subtracting only pairwise overlaps, which is wrong when three zones overlap."
  - "Treating zones that share only an edge as overlapping, or merging touching y-intervals incorrectly."
  - "Multiplying width by height in 32-bit arithmetic."
  - "Forgetting to return 0 for an empty list."
