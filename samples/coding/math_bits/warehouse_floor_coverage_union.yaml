prompt_markdown: |
  ## Warehouse Floor Coverage Union

  Autonomous robots in a warehouse are each assigned a rectangular work zone on the floor plan.
  Zone `i` is `zones[i] = [x1, y1, x2, y2]`: the axis-aligned rectangle with lower-left corner
  `(x1, y1)` and upper-right corner `(x2, y2)`, where `x1 < x2` and `y1 < y2`. Zones may overlap, nest
  inside each other or share edges.

  The safety team needs the total floor area that is inside **at least one** zone. Area covered by
  several zones is counted **once**; zones that only touch along an edge or at a corner add no
  overlap. Return the covered area (it is `0` when there are no zones).

  ### Example 1
  ```
  Input:  zones = [[0, 0, 4, 3], [2, 1, 6, 5]]
  Output: 24
  Explanation: 12 + 16 minus the 2 x 2 overlap counted twice.
  ```

  ### Example 2
  ```
  Input:  zones = [[1, 1, 3, 3], [3, 1, 5, 3], [0, 0, 10, 1]]
  Output: 18
  Explanation: the zones only touch along edges, so the areas 4 + 4 + 10 simply add up.
  ```

  ### Example 3
  ```
  Input:  zones = [[0, 0, 6, 6], [1, 1, 3, 3], [2, 2, 5, 4]]
  Output: 36
  Explanation: both smaller zones lie inside the first one.
  ```

  ### Constraints
  - `0 <= zones.length <= 200`
  - `zones[i].length == 4`
  - `0 <= x1 < x2 <= 10^7` and `0 <= y1 < y2 <= 10^7`
  - The area can be as large as `10^14`; use a 64-bit result.

  **Follow-up:** marking unit cells is impossible at this scale. How do you avoid depending on the
  coordinate values themselves?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: covered_area
  params:
    - {name: zones, type: "int[][]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def covered_area(zones: list[list[int]]) -> int:
        # Sweep over vertical slabs between consecutive distinct x coordinates.
        xs = sorted({z[0] for z in zones} | {z[2] for z in zones})
        total = 0
        for left, right in zip(xs, xs[1:]):
            # y-intervals of every zone spanning this whole slab
            spans = sorted((z[1], z[3]) for z in zones if z[0] <= left and z[2] >= right)
            covered = 0
            cur_start = cur_end = None
            for y1, y2 in spans:
                if cur_end is None or y1 > cur_end:
                    if cur_end is not None:
                        covered += cur_end - cur_start
                    cur_start, cur_end = y1, y2
                else:
                    cur_end = max(cur_end, y2)
            if cur_end is not None:
                covered += cur_end - cur_start
            total += covered * (right - left)
        return total
  javascript: |
    function coveredArea(zones) {
      const xs = [...new Set(zones.flatMap((z) => [z[0], z[2]]))].sort((a, b) => a - b);
      let total = 0;
      for (let i = 0; i + 1 < xs.length; i++) {
        const left = xs[i];
        const right = xs[i + 1];
        const spans = zones
          .filter((z) => z[0] <= left && z[2] >= right)
          .map((z) => [z[1], z[3]])
          .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        let covered = 0;
        let start = null;
        let end = null;
        for (const [y1, y2] of spans) {
          if (end === null || y1 > end) {
            if (end !== null) covered += end - start;
            start = y1;
            end = y2;
          } else if (y2 > end) {
            end = y2;
          }
        }
        if (end !== null) covered += end - start;
        total += covered * (right - left);
      }
      return total;
    }
