expected_concepts:
  - "extracting a byte with a shift and an 0xFF mask"
  - "reassembling bytes with left shifts and bitwise OR"
  - "signed versus unsigned 32-bit interpretation"
  - "endianness (big-endian network order versus little-endian hosts)"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Extracts and repositions each byte with shifts and masks, explains endianness, and proactively guards against sign problems (unsigned shift, 64-bit type or a final unsigned conversion); verifies with 0x80 and 0xFFFFFFFF."
  good: "Correct byte reversal; fixes a sign issue on high values after running the tests or with a nudge."
  weak: "Converts to strings and reverses characters, reverses bits instead of bytes, or returns negative numbers for values with the top bit set."
  criteria:
    correctness: "All tests pass, including values above 2^31 and results above 2^31."
    efficiency: "Constant work per value with bit operations; no string conversions."
    code_quality: "Named byte variables or a small loop; masks written in hexadecimal."
    edge_cases: "Empty list, zero, all-ones, top bit set in input or output, duplicates."
    communication: "Explains why network protocols fix a byte order and where conversion happens in real systems."
hints:
  - "Think of each value as four separate bytes; the task only moves bytes around, it never changes their contents."
  - "You can isolate any byte by shifting the value right by a multiple of eight and keeping only the lowest eight bits; placing a byte somewhere uses a left shift by a multiple of eight."
  - "Pull out the four bytes from lowest to highest, then combine them so the lowest byte is shifted left by twenty-four, the next by sixteen, the next by eight and the highest not at all; in a language with signed 32-bit bit operators, finish with an unsigned conversion or use a 64-bit type so large results do not turn negative."
followups:
  - "How would you swap 16-bit or 64-bit fields?"
  - "How would you detect at runtime whether the host is little-endian?"
  - "Which standard library functions do this in C, Java or Go, and when would you prefer them?"
common_errors:
  - "Using a signed right shift or signed result in JavaScript or Java, so values with the top bit set come out negative."
  - "Reversing the bits instead of the bytes."
  - "Reversing the decimal digits or the hexadecimal string without zero-padding to eight characters."
  - "Forgetting the mask after shifting, which leaves higher bytes mixed into the result."
