title: Network Byte Order Swap
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [network, backend, platform, security]
time_limit_minutes: 12
prompt_markdown: |
  ## Network Byte Order Swap

  A packet-capture decoder read a batch of **unsigned 32-bit header fields** with the wrong endianness:
  every field was assembled from its four bytes in reverse order. Write the fix-up step that converts the
  values back.

  For each value, reverse the order of its four bytes: the most significant byte becomes the least
  significant one and vice versa, and the two middle bytes trade places. In hexadecimal, `0x12345678`
  becomes `0x78563412` and `0x000000FF` becomes `0xFF000000`.

  Return a list with the converted values in the **same order** as the input. Every output value is also
  an unsigned 32-bit number, so it is never negative. An empty input returns an empty list.

  ### Example 1
  ```
  Input:  values = [305419896]
  Output: [2018915346]
  Explanation: 305419896 is 0x12345678; reversing the bytes gives 0x78563412 = 2018915346.
  ```

  ### Example 2
  ```
  Input:  values = [1, 4278190080]
  Output: [16777216, 255]
  Explanation: 0x00000001 becomes 0x01000000 and 0xFF000000 becomes 0x000000FF.
  ```

  ### Constraints
  - `0 <= values.length <= 10^4`
  - `0 <= values[i] <= 2^32 - 1`

  **Note:** values can exceed the signed 32-bit range, and results can too. In languages whose bit
  operators work on signed 32-bit integers, make sure the result stays unsigned.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: swap_byte_order
  params:
    - {name: values, type: "long[]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def swap_byte_order(values: list[int]) -> list[int]:
        result = []
        for value in values:
            b0 = value & 0xFF
            b1 = (value >> 8) & 0xFF
            b2 = (value >> 16) & 0xFF
            b3 = (value >> 24) & 0xFF
            result.append((b0 << 24) | (b1 << 16) | (b2 << 8) | b3)
        return result
  javascript: |
    function swapByteOrder(values) {
      return values.map((value) => {
        const b0 = value & 0xff;
        const b1 = (value >>> 8) & 0xff;
        const b2 = (value >>> 16) & 0xff;
        const b3 = (value >>> 24) & 0xff;
        // >>> 0 reinterprets the signed 32-bit result as unsigned.
        return ((b0 << 24) | (b1 << 16) | (b2 << 8) | b3) >>> 0;
      });
    }
