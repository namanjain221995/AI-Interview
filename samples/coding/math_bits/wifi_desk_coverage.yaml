expected_concepts:
  - "sweeping the floor column by column"
  - "integer square root to get the covered vertical span of a circle in one column"
  - "merging overlapping intervals and counting integer points"
  - "avoiding floating-point boundary errors"
optimal_complexity: {time: "O(W * k log k) where W is the width of the covered x-range and k = access_points.length", space: "O(k)"}
rubric:
  excellent: "Sweeps each integer column, computes every circle's vertical span with an exact integer square root, merges spans to count each desk once and explains why floating-point square roots are risky at the boundary; mentions the brute-force grid scan and its cost."
  good: "Counts correctly with a hash set of covered desks or a full grid scan over the bounding box, and can discuss the faster column sweep when prompted."
  weak: "Adds up per-circle counts (double counting overlaps), uses a rounded floating-point radius that misses boundary desks, or only scans non-negative coordinates."
  criteria:
    correctness: "Passes all tests, including duplicates, nested circles, touching circles and radius 0."
    efficiency: "Work proportional to columns times access points rather than every desk times every access point."
    code_quality: "Separate span computation and interval merging, with clear inclusive bounds."
    edge_cases: "Radius 0, identical access points, desks exactly on the circle boundary and negative coordinates."
    communication: "Explains the inclusive span arithmetic and why each desk is counted once."
hints:
  - "Counting desks circle by circle double-counts the overlap. Try looking at the floor one vertical column (fixed x) at a time instead."
  - "In one column, each access point covers either nothing or one unbroken vertical run of desks centred on its own y. The half-height of that run is the largest integer whose square does not exceed the radius squared minus the squared horizontal offset."
  - "For every integer x between the leftmost and rightmost reach of any access point, compute each access point's covered run in that column with an exact integer square root, sort the runs by their lower end, merge overlapping runs and add the number of integer points in the merged runs. Sum these counts over all columns; checking the square root with integers avoids losing boundary desks to floating-point error."
followups:
  - "How would you handle coordinates up to 10^9 where columns can no longer be enumerated one by one?"
  - "How would you find the desk covered by the largest number of access points?"
  - "What changes if each access point covers a square (Chebyshev distance) instead of a circle?"
common_errors:
  - "Adding up the desks of each circle separately, which counts overlaps several times."
  - "Using a floating-point square root without correcting it, which can drop desks on the boundary."
  - "Off-by-one errors in inclusive spans (high minus low instead of high minus low plus one)."
  - "Only scanning a fixed or non-negative region and missing desks at negative coordinates."
