slug: wifi_desk_coverage
title: "Wi-Fi Desk Coverage"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, general, backend, data_analyst]
time_limit_minutes: 25
prompt_markdown: |
  ## Wi-Fi Desk Coverage

  An open-plan office has a desk at **every integer point** `(x, y)` of the floor plan. The network team
  has placed access points; access point `i` is described by `access_points[i] = [cx, cy, r]` and
  covers a desk at `(x, y)` when

  `(x - cx)^2 + (y - cy)^2 <= r^2`

  (desks exactly on the edge of the circle are covered). Coverage areas may overlap, and two access
  points may even be identical.

  Return the number of desks covered by **at least one** access point. Each desk is counted once, no
  matter how many access points reach it.

  ### Example 1
  ```
  Input:  access_points = [[0, 0, 1]]
  Output: 5
  Explanation: the covered desks are (0, 0), (1, 0), (-1, 0), (0, 1) and (0, -1).
  ```

  ### Example 2
  ```
  Input:  access_points = [[0, 0, 2], [3, 0, 2]]
  Output: 24
  Explanation: each access point covers 13 desks on its own. The desks (1, 0) and (2, 0) are
  reached by both, so they are counted once: 13 + 13 - 2 = 24.
  ```

  ### Constraints
  - `1 <= access_points.length <= 50`
  - `access_points[i].length == 3`
  - `-100 <= cx, cy <= 100`
  - `0 <= r <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: covered_desks
  params:
    - {name: access_points, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |

    from math import isqrt


    def covered_desks(access_points: list[list[int]]) -> int:
        low_x = min(cx - r for cx, _, r in access_points)
        high_x = max(cx + r for cx, _, r in access_points)
        total = 0
        for x in range(low_x, high_x + 1):
            spans = []
            for cx, cy, r in access_points:
                dx = x - cx
                remaining = r * r - dx * dx
                if remaining < 0:
                    continue
                half = isqrt(remaining)
                spans.append((cy - half, cy + half))
            spans.sort()
            covered_up_to = None
            for low, high in spans:
                if covered_up_to is None or low > covered_up_to:
                    total += high - low + 1
                    covered_up_to = high
                elif high > covered_up_to:
                    total += high - covered_up_to
                    covered_up_to = high
        return total
  javascript: |

    function coveredDesks(accessPoints) {
      let lowX = Infinity;
      let highX = -Infinity;
      for (const [cx, , r] of accessPoints) {
        lowX = Math.min(lowX, cx - r);
        highX = Math.max(highX, cx + r);
      }
      let total = 0;
      for (let x = lowX; x <= highX; x++) {
        const spans = [];
        for (const [cx, cy, r] of accessPoints) {
          const dx = x - cx;
          const remaining = r * r - dx * dx;
          if (remaining < 0) continue;
          let half = Math.floor(Math.sqrt(remaining));
          while (half * half > remaining) half--;
          while ((half + 1) * (half + 1) <= remaining) half++;
          spans.push([cy - half, cy + half]);
        }
        spans.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
        let coveredUpTo = null;
        for (const [low, high] of spans) {
          if (coveredUpTo === null || low > coveredUpTo) {
            total += high - low + 1;
            coveredUpTo = high;
          } else if (high > coveredUpTo) {
            total += high - coveredUpTo;
            coveredUpTo = high;
          }
        }
      }
      return total;
    }
