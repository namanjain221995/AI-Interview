version: 1
slug: total_lit_bits
title: "Total Lit Bits"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## Total Lit Bits

  A hardware status panel has a row of LEDs that acts as a binary counter. On tick `0` it shows the value
  `0`, on tick `1` the value `1`, and so on: on tick `i` the LEDs show `i` in binary, and an LED is lit
  exactly when the corresponding bit of `i` is `1`. The counter runs from tick `0` through tick `n`
  inclusive and then stops.

  Every lit LED draws one unit of energy per tick. Return the total energy used, that is, the total
  number of `1` bits over all the values `0, 1, 2, ..., n`.

  `n` can be as large as `10^14`, so visiting every value one by one is far too slow. Aim for a running
  time proportional to the number of bits in `n`.

  ### Example 1
  ```
  Input:  n = 5
  Output: 7
  Explanation: 0, 1, 10, 11, 100, 101 have 0 + 1 + 1 + 2 + 1 + 2 = 7 lit LEDs in total.
  ```

  ### Example 2
  ```
  Input:  n = 0
  Output: 0
  Explanation: The counter shows only 0, so no LED is ever lit.
  ```

  ### Example 3
  ```
  Input:  n = 8
  Output: 13
  Explanation: Values 1 to 7 contribute 12 lit LEDs and 8 = 1000 adds one more.
  ```

  ### Constraints
  - `0 <= n <= 10^14`
  - The answer fits in a signed 64-bit integer (it is below `2.5 * 10^15`).

  **Follow-up:** how would you count only the lit LEDs between tick `a` and tick `b`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: total_set_bits
  params:
    - {name: n, type: "long"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def total_set_bits(n: int) -> int:
        total = 0
        bit = 1  # value of the bit position being counted
        while bit <= n:
            cycle = bit * 2  # this position repeats: bit zeros, then bit ones
            full_cycles, remainder = divmod(n + 1, cycle)
            total += full_cycles * bit
            total += max(0, remainder - bit)  # ones in the unfinished last cycle
            bit = cycle
        return total
  javascript: |
    function totalSetBits(n) {
      let total = 0;
      let bit = 1; // value of the bit position being counted (kept as a Number, never a 32-bit bitwise op)
      while (bit <= n) {
        const cycle = bit * 2; // this position repeats: bit zeros, then bit ones
        const fullCycles = Math.floor((n + 1) / cycle);
        const remainder = (n + 1) - fullCycles * cycle;
        total += fullCycles * bit;
        total += Math.max(0, remainder - bit); // ones in the unfinished last cycle
        bit = cycle;
      }
      return total;
    }
tests:
  - {id: t1, args: [5], expected: 7, description: "Example 1"}
  - {id: t2, args: [0], expected: 0, description: "Example 2 - only tick 0, nothing is lit"}
  - {id: t3, args: [8], expected: 13, description: "Example 3 - n is a power of two"}
  - {id: t4, hidden: true, args: [1], expected: 1, description: "Smallest non-trivial n"}
  - {id: t5, hidden: true, args: [7], expected: 12, description: "n is all ones (2^3 - 1): every position has only full cycles"}
  - {id: t6, hidden: true, args: [1023], expected: 5120, description: "n = 2^10 - 1, closed form 10 * 2^9"}
  - {id: t7, hidden: true, args: [1000000], expected: 9884999, description: "Medium n where an O(n) loop still works"}
  - {id: t8, hidden: true, args: [70368744177664], expected: 1618481116086273, description: "n = 2^46, a power of two far beyond the 32-bit range (32-bit shifts or ints break)"}
  - {id: t9, hidden: true, args: [99999999999999], expected: 2306412649693184, description: "n just below the upper bound, odd remainder in every position"}
  - {id: t10, hidden: true, args: [100000000000000], expected: 2306412649693201, description: "Upper bound n = 10^14, answer above 2^31 and 2^32 (needs 64-bit total)"}
expected_concepts:
  - "each bit position follows a periodic pattern of zeros then ones"
  - "count full cycles of length 2^(k+1) plus the partial remainder"
  - "O(log n) time instead of O(n log n) per-value counting"
  - "64-bit arithmetic for n and the running total"
  - "off-by-one: the range 0..n has n + 1 values"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Notices that bit k repeats 2^k zeros then 2^k ones, counts full cycles of n + 1 values plus the partial remainder per position, uses 64-bit arithmetic throughout and explains the O(log n) bound; may also mention the recursive highest-bit formulation."
  good: "Reaches the per-bit counting idea after a hint and gets it correct after fixing an off-by-one (n versus n + 1) or a 32-bit shift issue."
  weak: "Loops over every value from 0 to n with a popcount, which cannot finish for n near 10^14, or miscounts the partial cycle."
  criteria:
    correctness: "All tests pass, including n = 0, powers of two, all-ones values and the 10^14 upper bound."
    efficiency: "Constant work per bit position, about 47 iterations for the largest n."
    code_quality: "Names such as cycle, full_cycles and remainder make the per-position arithmetic readable; no 32-bit shifts on 64-bit values."
    edge_cases: "n = 0, n = 1, n of the form 2^k and 2^k - 1, and values that need 64-bit integers."
    communication: "Explains the periodic pattern of each bit column with a small worked table before coding."
hints:
  - "Write the numbers 0 to 15 in binary underneath each other and look at one column at a time. Does each column follow a pattern?"
  - "Bit position k alternates between a run of 2^k zeros and a run of 2^k ones. If you know how many complete runs-of-both fit into the n + 1 values, plus how far into the next one you get, you know how many ones that column contributes."
  - "For each position k while 2^k is at most n, let the cycle length be twice 2^k. The column contributes 2^k ones for every complete cycle in n + 1 values, plus the part of the leftover that exceeds 2^k (never negative). Sum these over all positions using 64-bit integers."
followups:
  - "How would you answer the total for an arbitrary range of ticks from a to b?"
  - "Can you derive a recursive solution based on the highest set bit of n, and how does its complexity compare?"
  - "How would you count the ticks on which exactly m LEDs are lit?"
  - "What would change if the counter counted down from n to 0 instead?"
common_errors:
  - "Summing a popcount for every value from 0 to n, which is O(n) and times out for large n."
  - "Using n instead of n + 1 values when counting cycles, which drops the last tick."
  - "Using 32-bit shifts or integers (for example a bitwise shift in JavaScript) once positions pass bit 30."
  - "Counting the leftover as the whole remainder instead of only the part beyond the first 2^k zeros."
