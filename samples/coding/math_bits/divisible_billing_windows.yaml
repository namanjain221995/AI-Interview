expected_concepts:
  - "prefix sums reduced modulo k"
  - "two prefixes with equal remainders bound a divisible window"
  - "normalising negative remainders into [0, k)"
  - "delaying the insertion of a prefix by min_len positions to enforce the length"
  - "64-bit counter for the result"
optimal_complexity: {time: "O(n + k)", space: "O(n + k)"}
rubric:
  excellent: "Derives that a window is divisible exactly when its two bounding prefix sums share a remainder, normalises negative remainders, enforces the minimum length by adding each prefix to the counts only once it is far enough behind the current end, uses a 64-bit counter and explains O(n + k)."
  good: "Reaches the prefix-remainder counting idea and handles either the negative remainders or the minimum length correctly after a hint or a failing test."
  weak: "Checks every window in O(n^2), or counts windows shorter than min_len, or loses matches because negative remainders are not normalised."
  criteria:
    correctness: "All tests pass, including negative totals, k = 1 and min_len equal to the ledger length."
    efficiency: "A single pass with a remainder count table, O(n + k) time instead of O(n^2)."
    code_quality: "Clear names for the prefix remainders and the eligible-start counts; the length rule is expressed once, not with special cases."
    edge_cases: "Negative remainders, zero-total windows, a single transaction and a result above 2^31."
    communication: "Explains why equal remainders imply a divisible window and why inserting a prefix late enforces the minimum length."
hints:
  - "The total of a window can be written as the difference of two running totals. What has to be true about those two running totals for the difference to be divisible by k?"
  - "Two running totals with the same remainder modulo k bound a divisible window. Count remainders as you scan, but make sure a negative running total maps to the same remainder as its positive equivalent."
  - "Keep a table of how many window starts have each remainder. When you reach end position e, first add the remainder of the running total at e minus min_len to the table, then add the table entry for the remainder at e to the answer. Normalise every remainder into the range zero to k minus one and keep the answer in a 64-bit integer."
followups:
  - "How would you return the longest cleanly settling window instead of the count?"
  - "What changes if windows may contain at most max_len transactions as well?"
  - "If k were up to 10^12, what would you use instead of an array indexed by remainder?"
  - "How would you process the ledger as a stream that never ends, reporting the running count?"
common_errors:
  - "Using the language's signed remainder so that -1 and k - 1 land in different buckets."
  - "Adding the current prefix to the counts before querying, which counts empty or too-short windows."
  - "Forgetting the empty prefix (remainder 0 before the first transaction), which misses windows starting at index 0."
  - "Accumulating the answer in a 32-bit integer."
