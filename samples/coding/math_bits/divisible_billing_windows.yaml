title: "Divisible Billing Windows"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, data_analyst, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Divisible Billing Windows

  A payments team reconciles one merchant's ledger for a day. `amounts[i]` is the `i`-th transaction in
  time order, in cents: charges are positive and refunds are negative. The settlement partner only clears
  money in whole **settlement units** of `k` cents, so an auditor samples **windows** of the ledger and
  checks whether each one would settle cleanly.

  A window is a contiguous run of transactions `amounts[i..j]` (inclusive) that contains **at least
  `min_len` transactions**, so `j - i + 1 >= min_len`. A window **settles cleanly** when its total is
  divisible by `k`; totals of `0` and negative multiples of `k` (for example `-2k`) also count.

  Return how many windows settle cleanly. Windows are identified by their start and end positions, so two
  windows with the same values at different positions are counted separately. The answer can exceed the
  32-bit range, so return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  amounts = [4, -1, 3, 6, -2], k = 3, min_len = 2
  Output: 5
  Explanation: The qualifying windows are [4, -1] (total 3), [4, -1, 3] (6), [4, -1, 3, 6] (12),
  [3, 6] (9) and [-1, 3, 6, -2] (6). The single transactions 3 and 6 are divisible by 3 too, but they
  are shorter than min_len.
  ```

  ### Example 2
  ```
  Input:  amounts = [5, 5, 5], k = 5, min_len = 1
  Output: 6
  Explanation: Every one of the 6 windows has a total that is a multiple of 5.
  ```

  ### Constraints
  - `1 <= amounts.length <= 10^5`
  - `-10^4 <= amounts[i] <= 10^4`
  - `1 <= k <= 10^4`
  - `1 <= min_len <= amounts.length`

  **Follow-up:** checking every window is `O(n^2)`; aim for `O(n + k)` time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_divisible_windows
  params:
    - {name: amounts, type: "int[]"}
    - {name: k, type: "int"}
    - {name: min_len, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_divisible_windows(amounts: list[int], k: int, min_len: int) -> int:
        n = len(amounts)
        # prefix[i] = (sum of the first i amounts) mod k, always in [0, k)
        prefix = [0] * (n + 1)
        for i, amount in enumerate(amounts):
            prefix[i + 1] = (prefix[i] + amount) % k
        seen = [0] * k  # how many eligible window starts have each remainder
        total = 0
        for end in range(min_len, n + 1):
            # A window [start, end) is long enough when start <= end - min_len,
            # so the start prefix becomes eligible exactly min_len steps late.
            seen[prefix[end - min_len]] += 1
            total += seen[prefix[end]]
        return total
  javascript: |
    function countDivisibleWindows(amounts, k, minLen) {
      const n = amounts.length;
      const prefix = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) {
        // JavaScript's % keeps the sign of the dividend, so normalise into [0, k)
        prefix[i + 1] = (((prefix[i] + amounts[i]) % k) + k) % k;
      }
      const seen = new Array(k).fill(0);
      let total = 0;
      for (let end = minLen; end <= n; end++) {
        seen[prefix[end - minLen]] += 1;
        total += seen[prefix[end]];
      }
      return total;
    }
