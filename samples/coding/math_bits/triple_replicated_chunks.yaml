expected_concepts:
  - "count each of the 32 bit positions modulo 3"
  - "bits contributed by tripled ids cancel out modulo 3"
  - "two's complement and reconstructing a negative 32-bit result"
  - "O(n) time with O(1) extra space (alternatively a ones/twos bitmask state machine)"
  - "hash map counting as the O(n)-space baseline"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Explains why XOR alone fails, counts every bit position modulo 3 (or derives the ones/twos state machine), reconstructs the sign correctly for bit 31 and states O(32 n) time with O(1) space."
  good: "Correct per-bit counting solution after a hint, possibly fixing the negative-number case after running the tests."
  weak: "Uses a hash map or sorting despite the space requirement, tries plain XOR, or returns a large positive number instead of the negative id."
  criteria:
    correctness: "All tests pass, including 0, the 32-bit minimum and maximum, and negative answers."
    efficiency: "Linear passes with a constant number of counters; no auxiliary map or sort."
    code_quality: "Clear loop over bit positions with a named counter; the sign fix is explicit and commented."
    edge_cases: "Single-element input, answer 0, all-negative input and the extreme 32-bit values."
    communication: "Explains why each bit's count modulo 3 equals that bit of the answer."
hints:
  - "XOR cancels values that appear twice. What property would let values that appear three times cancel out instead?"
  - "Look at a single bit position across all ids. The three copies of a tripled id add either 0 or 3 to that bit's count, so the count modulo 3 tells you whether the lonely id has the bit set."
  - "For each of the 32 bit positions, count how many ids have that bit set (use the two's complement bit for negatives), and set the bit in the answer when the count is not a multiple of 3. If the resulting bit 31 is set, convert the unsigned 32-bit value back to a negative number by subtracting 2 to the power 32."
followups:
  - "Can you derive a version that keeps two bit masks (seen once, seen twice) and does a single pass?"
  - "How would you generalise to ids that appear k times except one that appears once?"
  - "What changes if the under-replicated chunk appears twice instead of once?"
  - "If you were allowed O(n) memory, what would be the simplest correct solution and when would you prefer it?"
common_errors:
  - "XOR-ing all ids, which only works when the others appear an even number of times."
  - "Returning 2^32 minus the magnitude (a large positive value) for a negative answer in languages with arbitrary-precision integers."
  - "Iterating only 31 bit positions, which loses the sign bit."
  - "Using a hash map or sorting, which violates the space requirement."
