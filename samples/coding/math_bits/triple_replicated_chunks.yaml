slug: triple_replicated_chunks
title: "Triple Replicated Chunks"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, sre, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Triple Replicated Chunks

  A distributed object store writes every data chunk to **three** replicas. A nightly audit walks all the
  storage nodes and emits the chunk id it finds on each replica, in no particular order. Chunk ids are
  signed 32-bit integers (legacy chunks were assigned negative ids).

  After a disk failure the audit list `ids` has this shape: every chunk id appears **exactly three
  times**, except for **one** under-replicated chunk whose id appears **exactly once**.

  Return the id of the under-replicated chunk.

  The audit runs on a memory-constrained sidecar, so aim for `O(n)` time and `O(1)` extra space: no hash
  map or set of ids, and do not sort the list.

  ### Example 1
  ```
  Input:  ids = [12, 7, 12, 12]
  Output: 7
  Explanation: 12 appears three times; 7 appears once.
  ```

  ### Example 2
  ```
  Input:  ids = [-5, 40, 40, -5, 9, 40, -5]
  Output: 9
  Explanation: -5 and 40 each appear three times.
  ```

  ### Example 3
  ```
  Input:  ids = [-1]
  Output: -1
  ```

  ### Constraints
  - `1 <= ids.length <= 3 * 10^4 + 1`, and `ids.length % 3 == 1`
  - `-2^31 <= ids[i] <= 2^31 - 1`
  - Exactly one id appears once; every other id appears exactly three times.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: find_under_replicated
  params:
    - {name: ids, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def find_under_replicated(ids: list[int]) -> int:
        result = 0
        for bit in range(32):
            ones = 0
            for chunk_id in ids:
                ones += (chunk_id >> bit) & 1  # two's complement bit, also for negatives
            if ones % 3:  # triples contribute a multiple of 3 to every bit count
                result |= 1 << bit
        if result >= 1 << 31:  # bit 31 set: reinterpret as a negative 32-bit value
            result -= 1 << 32
        return result
  javascript: |
    function findUnderReplicated(ids) {
      let result = 0;
      for (let bit = 0; bit < 32; bit++) {
        let ones = 0;
        for (const chunkId of ids) ones += (chunkId >> bit) & 1;
        if (ones % 3 !== 0) result |= 1 << bit; // triples contribute a multiple of 3
      }
      return result | 0; // 32-bit signed reinterpretation
    }
