version: 1
slug: short_code_encoder
title: Short Code Encoder
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, fullstack, frontend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Short Code Encoder

  A link-shortening service turns numeric record ids into short codes. Each deployment configures
  its own `alphabet`: the character at position `i` of `alphabet` stands for the digit value `i`,
  and the base of the encoding is the length of the alphabet.

  Given a non-negative integer `value`, return its representation in that base written with the
  alphabet's characters, **most significant digit first** and with **no leading zero digits** (the
  zero digit is `alphabet[0]`). The value `0` is encoded as the single character `alphabet[0]`.

  ### Example 1
  ```
  Input:  value = 255, alphabet = "0123456789abcdef"
  Output: "ff"
  Explanation: 255 = 15 * 16 + 15, and digit 15 is the character f.
  ```

  ### Example 2
  ```
  Input:  value = 6, alphabet = "01"
  Output: "110"
  ```

  ### Example 3
  ```
  Input:  value = 0, alphabet = "kq7"
  Output: "k"
  Explanation: The zero digit of this alphabet is k.
  ```

  ### Constraints
  - `0 <= value <= 2^53 - 1`
  - `2 <= alphabet.length <= 62`
  - `alphabet` consists of distinct ASCII letters and digits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: encode_short_code
  params:
    - {name: value, type: "long"}
    - {name: alphabet, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def encode_short_code(value: int, alphabet: str) -> str:
        if value == 0:
            return alphabet[0]
        base = len(alphabet)
        chars: list[str] = []
        while value > 0:
            value, digit = divmod(value, base)
            chars.append(alphabet[digit])
        return "".join(reversed(chars))
  javascript: |
    function encodeShortCode(value, alphabet) {
      if (value === 0) return alphabet[0];
      const base = alphabet.length;
      const chars = [];
      while (value > 0) {
        chars.push(alphabet[value % base]);
        value = Math.floor(value / base); // exact for values below 2^53
      }
      return chars.reverse().join("");
    }
tests:
  - {id: t1, args: [255, "0123456789abcdef"], expected: "ff", description: "Example 1 - hexadecimal"}
  - {id: t2, args: [6, "01"], expected: "110", description: "Example 2 - binary"}
  - {id: t3, args: [0, "kq7"], expected: "k", description: "Example 3 - zero is the first alphabet character"}
  - {id: t4, hidden: true, args: [9007199254740991, "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"], expected: "fFgnDxSe7", description: "Largest value in base 62"}
  - {id: t5, hidden: true, args: [9007199254740991, "01"], expected: "11111111111111111111111111111111111111111111111111111", description: "Largest value in base 2 (53 digits)"}
  - {id: t6, hidden: true, args: [61, "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"], expected: "z", description: "Value base - 1 is a single character"}
  - {id: t7, hidden: true, args: [62, "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"], expected: "10", description: "Value equal to the base needs two digits"}
  - {id: t8, hidden: true, args: [1, "ab"], expected: "b", description: "Value 1 in a letter-only binary alphabet"}
  - {id: t9, hidden: true, args: [100, "9876543210"], expected: "899", description: "Reversed decimal alphabet (digit characters do not match their values)"}
  - {id: t10, hidden: true, args: [4096, "0123456789abcdef"], expected: "1000", description: "Exact power of the base produces zero digits after the first"}
  - {id: t11, hidden: true, args: [1000000007, "23456789ABCDEFGHJKLMNPQRSTUVWXYZ"], expected: "XTPLJ9", description: "Custom 32-character alphabet without look-alike characters"}
expected_concepts:
  - "base conversion by repeated division"
  - "remainder selects the digit character"
  - "reversing to get most significant digit first"
  - "special case for zero"
optimal_complexity: {time: "O(log_b V)", space: "O(log_b V)"}
rubric:
  excellent: "Implements repeated division with the remainder as an index into the alphabet, handles zero explicitly, reverses efficiently and explains why the output length is logarithmic in the value."
  good: "Correct conversion with a small slip (for example forgetting zero) fixed after testing."
  weak: "Uses a built-in radix conversion that ignores the custom alphabet, produces digits in reverse order, or loses precision on large values."
  criteria:
    correctness: "All tests pass, including 0, the largest value and alphabets whose characters differ from their digit values."
    efficiency: "Logarithmic number of iterations; avoids quadratic string prepending in a loop where that matters."
    code_quality: "Clear separation of base, digit and output buffer; no hard-coded base."
    edge_cases: "Zero, exact powers of the base, base 2 and base 62."
    communication: "Explains how the conversion would be reversed to decode a short code."
hints:
  - "This is ordinary base conversion, the same thing you do when writing a number in binary or hexadecimal, only with a custom set of digit characters."
  - "Repeatedly dividing by the base produces the digits from least significant to most significant; each remainder tells you which alphabet character to use."
  - "Handle zero up front by returning the first character. Otherwise, while the value is positive, take the remainder modulo the base, look up that position in the alphabet, collect it and replace the value with the integer quotient. Reverse the collected characters at the end so the most significant digit comes first."
followups:
  - "How would you decode a short code back into the number?"
  - "Why might a deployment remove characters such as 0, O, 1 and I from its alphabet?"
  - "How would you make sequential ids produce codes that do not look sequential?"
  - "What changes if values can exceed 2^53 in JavaScript?"
common_errors:
  - "Returning an empty string for 0."
  - "Forgetting to reverse, so the least significant digit comes first."
  - "Using the language's built-in radix conversion, which ignores the custom alphabet."
  - "Using floating-point division without flooring, which produces fractional indexes."
