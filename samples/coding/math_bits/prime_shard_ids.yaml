version: 1
slug: prime_shard_ids
title: Prime Shard IDs
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Prime Shard IDs

  A storage team spreads keys across shards with a modulo hash. To reduce clustering of related
  keys, it only allows shard counts that are **prime numbers**. Before building a configuration
  picker, the team wants to know how many valid shard counts exist up to a configured `limit`.

  Return how many prime numbers `p` satisfy `2 <= p <= limit`. A prime is an integer greater than 1
  whose only positive divisors are 1 and itself. When `limit` is 0 or 1 the answer is 0.

  ### Example 1
  ```
  Input:  limit = 10
  Output: 4
  Explanation: The primes up to 10 are 2, 3, 5 and 7.
  ```

  ### Example 2
  ```
  Input:  limit = 1
  Output: 0
  ```

  ### Example 3
  ```
  Input:  limit = 30
  Output: 10
  ```

  ### Constraints
  - `0 <= limit <= 10^6`

  **Follow-up:** testing every number by trial division is slow for large limits. Can you do better?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_prime_shards
  params:
    - {name: limit, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_prime_shards(limit: int) -> int:
        if limit < 2:
            return 0
        is_prime = bytearray([1]) * (limit + 1)
        is_prime[0] = is_prime[1] = 0
        p = 2
        while p * p <= limit:
            if is_prime[p]:
                # multiples below p * p were already crossed out by smaller primes
                is_prime[p * p :: p] = bytes(len(range(p * p, limit + 1, p)))
            p += 1
        return sum(is_prime)
  javascript: |
    function countPrimeShards(limit) {
      if (limit < 2) return 0;
      const composite = new Uint8Array(limit + 1);
      for (let p = 2; p * p <= limit; p++) {
        if (composite[p]) continue;
        // multiples below p * p were already crossed out by smaller primes
        for (let m = p * p; m <= limit; m += p) composite[m] = 1;
      }
      let count = 0;
      for (let n = 2; n <= limit; n++) if (!composite[n]) count++;
      return count;
    }
tests:
  - {id: t1, args: [10], expected: 4, description: "Example 1 - small limit"}
  - {id: t2, args: [1], expected: 0, description: "Example 2 - no primes below 2"}
  - {id: t3, args: [30], expected: 10, description: "Example 3 - limit is not prime"}
  - {id: t4, hidden: true, args: [0], expected: 0, description: "Limit 0"}
  - {id: t5, hidden: true, args: [2], expected: 1, description: "Smallest prime as the limit (inclusive bound)"}
  - {id: t6, hidden: true, args: [4], expected: 2, description: "First composite limit"}
  - {id: t7, hidden: true, args: [97], expected: 25, description: "Prime limit is counted (inclusive)"}
  - {id: t8, hidden: true, args: [100], expected: 25, description: "Square limit"}
  - {id: t9, hidden: true, args: [7919], expected: 1000, description: "The 1000th prime as the limit"}
  - {id: t10, hidden: true, args: [999983], expected: 78498, description: "Largest prime below 10^6"}
  - {id: t11, hidden: true, args: [1000000], expected: 78498, description: "Maximum limit (performance check)"}
expected_concepts:
  - "sieve of Eratosthenes"
  - "starting to cross out at p squared"
  - "stopping when p squared exceeds the limit"
  - "inclusive upper bound"
  - "O(n log log n) versus trial division"
optimal_complexity: {time: "O(n log log n)", space: "O(n)"}
rubric:
  excellent: "Implements the sieve with the p-squared start and the square-root stop, states O(n log log n) time and O(n) space, and handles the inclusive limit and limits below 2."
  good: "Correct sieve with a minor inefficiency (for example starting at 2p) or a correct square-root trial division with an accurate cost estimate."
  weak: "Trial division up to n for every number, excludes the limit itself, or crashes for limits 0 and 1."
  criteria:
    correctness: "All tests pass, including 0, 1, 2, prime limits and 10^6."
    efficiency: "Sieve-based; completes the 10^6 case comfortably."
    code_quality: "Compact boolean table with clear names; no repeated primality helper calls in the hot loop."
    edge_cases: "Limits 0, 1 and 2, prime and square limits."
    communication: "Explains why crossing out can start at p squared and why the outer loop can stop at the square root."
hints:
  - "Testing each number on its own by trial division works but repeats a lot of work for large limits. Think about what finding one prime tells you about other numbers."
  - "Every multiple of a prime, other than the prime itself, is composite. Mark those multiples in a table of booleans instead of testing numbers one by one."
  - "Build a table for every value from 0 to the limit, mark 0 and 1 as not prime, then for each number whose square does not exceed the limit, if it is still marked prime, cross out its multiples starting at its square. Finally count the entries still marked prime, and return 0 straight away when the limit is below 2."
followups:
  - "Why is it safe to start crossing out at p squared rather than at 2p?"
  - "How would you count primes in a window [low, high] when high is 10^12 but the window is small?"
  - "How would you halve the memory by skipping even numbers?"
  - "Why do prime shard counts reduce clustering for keys that share a common stride?"
common_errors:
  - "Excluding the limit itself when it is prime."
  - "Allocating limit cells instead of limit + 1 and indexing out of bounds."
  - "Running trial division up to n - 1 for every number, which is far too slow at 10^6."
  - "Counting 0 or 1 as prime."
