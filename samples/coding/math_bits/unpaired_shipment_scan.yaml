title: Unpaired Shipment Scans
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, qa, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Unpaired Shipment Scans

  Every parcel in a courier network is scanned twice: once when it leaves the depot and once
  when it is delivered. Both scans append the parcel's numeric id to one merged log, `scans`.
  Scanners upload in batches, so the log is in **no particular order** and the two scans of a
  parcel can be anywhere in it.

  Yesterday **two different parcels** were lost after leaving the depot, so each of their ids
  appears **exactly once**. Every other id appears **exactly twice**.

  Return the ids of the two lost parcels as a list in **ascending order**.

  ### Example 1
  ```
  Input:  scans = [4, 9, 4, 6]
  Output: [6, 9]
  Explanation: 4 is scanned twice; 9 and 6 only once, returned in ascending order.
  ```

  ### Example 2
  ```
  Input:  scans = [3, 8]
  Output: [3, 8]
  ```

  ### Example 3
  ```
  Input:  scans = [10, 2, 7, 10, 5, 7]
  Output: [2, 5]
  Explanation: 10 and 7 appear twice; 2 and 5 appear once.
  ```

  ### Constraints
  - `2 <= scans.length <= 3 * 10^4 + 2`, and `scans.length` is even
  - `0 <= scans[i] <= 2^31 - 1`
  - Exactly two distinct ids appear once; every other id appears exactly twice.

  **Follow-up:** a counting map is a fine first step. Can you solve it in `O(n)` time with `O(1)` extra space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: find_unpaired_scans
  params:
    - {name: scans, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def find_unpaired_scans(scans: list[int]) -> list[int]:
        both = 0
        for scan in scans:
            both ^= scan  # paired ids cancel; leaves first ^ second
        split_bit = both & -both  # lowest bit where the two lost ids differ
        first = 0
        for scan in scans:
            if scan & split_bit:
                first ^= scan
        second = both ^ first
        return [min(first, second), max(first, second)]
  javascript: |
    function findUnpairedScans(scans) {
      let both = 0;
      for (const scan of scans) both ^= scan; // paired ids cancel; leaves first ^ second
      const splitBit = both & -both; // lowest bit where the two lost ids differ
      let first = 0;
      for (const scan of scans) {
        if ((scan & splitBit) !== 0) first ^= scan;
      }
      const second = both ^ first;
      return [Math.min(first, second), Math.max(first, second)];
    }
