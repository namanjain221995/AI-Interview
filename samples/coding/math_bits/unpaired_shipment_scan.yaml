expected_concepts:
  - "counting map as an O(n)-space baseline"
  - "XOR cancels paired values regardless of order"
  - "splitting by a bit where the two answers differ"
  - "isolating the lowest set bit"
  - "O(1) extra space"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Gives the counting baseline, folds with XOR to get the XOR of the two lost ids, explains why any set bit separates them, partitions on it in a second pass and returns the sorted pair in O(n) time and O(1) space."
  good: "Correct counting-map or set solution in O(n) time and space, or the XOR partition idea with a small slip fixed after testing."
  weak: "Assumes the two scans of a parcel are adjacent, returns the XOR of the two ids, forgets the ascending order or uses nested loops."
  criteria:
    correctness: "All tests pass, including lost id 0, ids at the 32-bit limit and ids differing in one bit."
    efficiency: "Two linear passes with constant extra space for the follow-up."
    code_quality: "Accumulators named for what they hold; the split bit computation is explained."
    edge_cases: "Log with only the two lost ids, a lost id of 0 and lost ids in descending order."
    communication: "Explains why pairs still cancel inside each of the two groups."
hints:
  - "Folding every id together with XOR cancels the paired ids. Think about what that leaves behind when two different ids are unpaired."
  - "The folded value is the XOR of the two lost ids, so any bit set in it marks a position where they differ. Use one such bit to split the log into two groups."
  - "Pick the lowest set bit of the folded value. Fold again, but only over the ids that have that bit set: pairs still cancel inside that group, so the result is one lost id, and combining it with the first folded value by XOR gives the other. Return the two in ascending order."
followups:
  - "Why is the folded value never zero here?"
  - "What if every parcel were scanned three times except one?"
  - "How would you find the lost parcels if the log were split across several machines?"
  - "What changes if the number of lost parcels is unknown?"
common_errors:
  - "Returning the XOR of the two lost ids instead of the ids themselves."
  - "Assuming a parcel's two scans are next to each other in the log."
  - "Forgetting to sort the result."
  - "Computing the lowest set bit with an expression that overflows or misbehaves in the language used."
