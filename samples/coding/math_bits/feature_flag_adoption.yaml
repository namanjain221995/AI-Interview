version: 1
slug: feature_flag_adoption
title: "Feature Flag Adoption"
difficulty: easy
competency_keys: [sql, databases]
role_tags: [backend, data_analyst, dba, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Feature Flag Adoption

  A SaaS product stores which optional features each customer account has switched on as a single
  integer **bitmask**. Every feature flag owns one bit.

  Table `flags`:

  | column | type | notes |
  |--------|------|-------|
  | flag_name | VARCHAR(50) | primary key |
  | bit_value | INTEGER | the flag's bit as a number: a power of two (1, 2, 4, ...); distinct per flag |

  Table `accounts`:

  | column | type | notes |
  |--------|------|-------|
  | account_id | INTEGER | primary key |
  | plan | VARCHAR(20) | `free`, `pro`, `enterprise` or `closed` |
  | flag_mask | INTEGER | sum of the `bit_value`s of the account's enabled flags; never negative |

  An account has a flag enabled when the flag's bit is set in its `flag_mask`. Masks may contain bits
  that have no row in `flags` (retired features); ignore those bits.

  Product wants an adoption report: for **every** flag, return `flag_name` and `enabled_accounts`, the
  number of accounts that have the flag enabled, **excluding accounts whose plan is `closed`**. Flags
  that no counted account uses must still appear with `0`. Order the rows by `enabled_accounts`
  descending, then by `flag_name` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite. Both support the bitwise AND operator
  `&` on integers.

  ### Example 1
  ```
  flags                       accounts
  +-------------+-----------+ +------------+------------+-----------+
  | flag_name   | bit_value | | account_id | plan       | flag_mask |
  +-------------+-----------+ +------------+------------+-----------+
  | dark_mode   | 1         | | 1          | pro        | 3         |
  | bulk_export | 2         | | 2          | free       | 1         |
  | sso         | 4         | | 3          | enterprise | 7         |
  | audit_log   | 8         | | 4          | closed     | 15        |
  +-------------+-----------+ | 5          | pro        | 5         |
                              +------------+------------+-----------+

  Output
  +-------------+------------------+
  | flag_name   | enabled_accounts |
  +-------------+------------------+
  | dark_mode   | 4                |
  | bulk_export | 2                |
  | sso         | 2                |
  | audit_log   | 0                |
  +-------------+------------------+
  Account 4 is closed, so audit_log (bit 8) has no counted accounts. bulk_export and sso tie on 2
  and are ordered by name.
  ```

  ### Example 2
  ```
  flags                      accounts
  +------------+-----------+ +------------+------+-----------+
  | flag_name  | bit_value | | account_id | plan | flag_mask |
  +------------+-----------+ +------------+------+-----------+
  | csv_import | 1         | | 1          | free | 32        |
  | beta_api   | 16        | | 2          | pro  | 17        |
  +------------+-----------+ | 3          | free | 0         |
                             +------------+------+-----------+

  Output
  +------------+------------------+
  | flag_name  | enabled_accounts |
  +------------+------------------+
  | beta_api   | 1                |
  | csv_import | 1                |
  +------------+------------------+
  Bit 32 belongs to no flag and is ignored. Account 2 (17 = 16 + 1) has both flags.
  ```

  ### Constraints
  - `0 <= rows in each table <= 10^5`
  - `bit_value` is a power of two between `1` and `2^30`; `0 <= flag_mask <= 2^31 - 1`
languages: [sql]
starter_code:
  sql: |
    -- For every flag, count non-closed accounts whose flag_mask has the flag's bit set.
    SELECT f.flag_name, 0 AS enabled_accounts
    FROM flags f;
reference_solutions:
  sql: |
    SELECT f.flag_name, COUNT(a.account_id) AS enabled_accounts
    FROM flags f
    LEFT JOIN accounts a
      ON a.plan <> 'closed'
      AND (a.flag_mask & f.bit_value) <> 0
    GROUP BY f.flag_name
    ORDER BY enabled_accounts DESC, f.flag_name ASC;
sql_setup: |
  CREATE TABLE flags (
    flag_name VARCHAR(50) PRIMARY KEY,
    bit_value INTEGER NOT NULL
  );
  CREATE TABLE accounts (
    account_id INTEGER PRIMARY KEY,
    plan VARCHAR(20) NOT NULL,
    flag_mask INTEGER NOT NULL
  );
tests:
  - id: t1
    description: "Example 1"
    ordered: true
    setup_sql: |
      INSERT INTO flags (flag_name, bit_value) VALUES ('dark_mode', 1), ('bulk_export', 2), ('sso', 4), ('audit_log', 8);
      INSERT INTO accounts (account_id, plan, flag_mask) VALUES (1, 'pro', 3), (2, 'free', 1), (3, 'enterprise', 7), (4, 'closed', 15), (5, 'pro', 5);
    expected_rows: [["dark_mode", 4], ["bulk_export", 2], ["sso", 2], ["audit_log", 0]]
  - id: t2
    description: "Example 2 - bits without a flag row are ignored; tie broken by name"
    ordered: true
    setup_sql: |
      INSERT INTO flags (flag_name, bit_value) VALUES ('csv_import', 1), ('beta_api', 16);
      INSERT INTO accounts (account_id, plan, flag_mask) VALUES (1, 'free', 32), (2, 'pro', 17), (3, 'free', 0);
    expected_rows: [["beta_api", 1], ["csv_import", 1]]
  - id: t3
    hidden: true
    description: "No accounts - every flag reported with 0, ordered by name (inner join or COUNT(*) pitfalls)"
    ordered: true
    setup_sql: |
      INSERT INTO flags (flag_name, bit_value) VALUES ('sso', 4), ('audit_log', 8), ('dark_mode', 1);
    expected_rows: [["audit_log", 0], ["dark_mode", 0], ["sso", 0]]
  - id: t4
    hidden: true
    description: "No flags - empty result"
    ordered: true
    setup_sql: |
      INSERT INTO accounts (account_id, plan, flag_mask) VALUES (1, 'pro', 7), (2, 'free', 1);
    expected_rows: []
  - id: t5
    hidden: true
    description: "Every account is closed - filter must sit in the join condition so flags still appear with 0"
    ordered: true
    setup_sql: |
      INSERT INTO flags (flag_name, bit_value) VALUES ('dark_mode', 1), ('sso', 4);
      INSERT INTO accounts (account_id, plan, flag_mask) VALUES (1, 'closed', 5), (2, 'closed', 1);
    expected_rows: [["dark_mode", 0], ["sso", 0]]
  - id: t6
    hidden: true
    description: "Highest usable bit 2^30 and an all-bits mask 2^31 - 1"
    ordered: true
    setup_sql: |
      INSERT INTO flags (flag_name, bit_value) VALUES ('edge_cache', 1073741824), ('dark_mode', 1), ('geo_routing', 65536);
      INSERT INTO accounts (account_id, plan, flag_mask) VALUES (1, 'enterprise', 2147483647), (2, 'pro', 1073741824), (3, 'free', 65537), (4, 'pro', 0);
    expected_rows: [["dark_mode", 2], ["edge_cache", 2], ["geo_routing", 2]]
  - id: t7
    hidden: true
    description: "Equality on the whole mask instead of a bit test undercounts multi-flag accounts"
    ordered: true
    setup_sql: |
      INSERT INTO flags (flag_name, bit_value) VALUES ('a_reports', 2), ('b_webhooks', 8);
      INSERT INTO accounts (account_id, plan, flag_mask) VALUES (1, 'pro', 10), (2, 'pro', 10), (3, 'free', 2), (4, 'enterprise', 14);
    expected_rows: [["a_reports", 4], ["b_webhooks", 3]]
  - id: t8
    hidden: true
    description: "All flags tie - order falls back to flag_name"
    ordered: true
    setup_sql: |
      INSERT INTO flags (flag_name, bit_value) VALUES ('zeta', 1), ('alpha', 2), ('mid', 4);
      INSERT INTO accounts (account_id, plan, flag_mask) VALUES (1, 'pro', 7), (2, 'closed', 3);
    expected_rows: [["alpha", 1], ["mid", 1], ["zeta", 1]]
  - id: t9
    hidden: true
    description: "Forty accounts across all plans and six flags"
    ordered: true
    setup_sql: |
      INSERT INTO flags (flag_name, bit_value) VALUES ('f_bit0', 1), ('f_bit1', 2), ('f_bit2', 4), ('f_bit3', 8), ('f_bit4', 16), ('f_bit5', 32), ('f_unused', 64);
      INSERT INTO accounts (account_id, plan, flag_mask) VALUES (1, 'pro', 37), (2, 'enterprise', 10), (3, 'closed', 47), (4, 'free', 20), (5, 'pro', 57), (6, 'enterprise', 30), (7, 'closed', 3), (8, 'free', 40), (9, 'pro', 13), (10, 'enterprise', 50), (11, 'closed', 23), (12, 'free', 60), (13, 'pro', 33), (14, 'enterprise', 6), (15, 'closed', 43), (16, 'free', 16), (17, 'pro', 53), (18, 'enterprise', 26), (19, 'closed', 63), (20, 'free', 36), (21, 'pro', 9), (22, 'enterprise', 46), (23, 'closed', 19), (24, 'free', 56), (25, 'pro', 29), (26, 'enterprise', 2), (27, 'closed', 39), (28, 'free', 12), (29, 'pro', 49), (30, 'enterprise', 22), (31, 'closed', 59), (32, 'free', 32), (33, 'pro', 5), (34, 'enterprise', 42), (35, 'closed', 15), (36, 'free', 52), (37, 'pro', 25), (38, 'enterprise', 62), (39, 'closed', 35), (40, 'free', 8);
    expected_rows: [["f_bit3", 16], ["f_bit2", 15], ["f_bit4", 15], ["f_bit5", 15], ["f_bit0", 10], ["f_bit1", 10], ["f_unused", 0]]
expected_concepts:
  - "bitwise AND to test a flag bit"
  - "LEFT JOIN so flags with no matching account still appear"
  - "filtering in the ON clause versus the WHERE clause of an outer join"
  - "COUNT(column) versus COUNT(*) on outer-joined rows"
  - "deterministic multi-key ORDER BY"
optimal_complexity: {time: "O(f * a) for f flags and a accounts (each pair is tested once)", space: "O(f) for the grouped result"}
rubric:
  excellent: "LEFT JOINs flags to accounts on a bitwise AND test with the closed-plan filter inside the join condition, counts a column from accounts so empty flags show 0, orders by count descending then name, and explains why the filter cannot go in WHERE."
  good: "Correct bit test and grouping that needs a hint about keeping zero-adoption flags or about where the plan filter belongs."
  weak: "Uses an inner join (zero-adoption flags vanish), compares the whole mask to bit_value, counts with COUNT(*) so empty flags show 1, or filters closed accounts in WHERE and loses flags."
  criteria:
    correctness: "All tests pass, including empty tables, all-closed accounts and masks with several bits."
    efficiency: "One grouped outer join; no correlated subquery per flag needed (though one is acceptable)."
    code_quality: "Readable join condition with clear aliases and an explicit ORDER BY."
    edge_cases: "No accounts, no flags, only closed accounts, unknown bits, bit 2^30 and ties."
    communication: "Explains outer-join filter placement and why COUNT(a.account_id) yields 0."
hints:
  - "Each flag owns one bit. How can you test, inside a join condition, whether that bit is set in an account's mask?"
  - "Bitwise AND of the mask and the flag's bit value is non-zero exactly when the flag is enabled. To keep flags with no matching account, start from the flags table and use an outer join."
  - "LEFT JOIN accounts onto flags with two conditions in the ON clause: the account is not closed, and mask AND bit value is not zero. Group by flag name, count the joined account id (not every row) so unmatched flags count as zero, then order by that count descending and the flag name ascending."
followups:
  - "How would you report adoption per plan as separate columns?"
  - "Why can't an ordinary B-tree index speed up the bitwise test, and how would a normalised account_flags table change that?"
  - "How would you list accounts that have both sso and audit_log enabled?"
common_errors:
  - "Using an inner join, which drops flags with zero adoption."
  - "Putting the plan filter in WHERE, which turns the LEFT JOIN back into an inner join."
  - "COUNT(*) instead of COUNT(a.account_id), reporting 1 for flags nobody uses."
  - "Comparing flag_mask = bit_value, which misses accounts with more than one flag."
  - "Forgetting the flag_name tie-breaker, so rows with equal counts come back in arbitrary order."
