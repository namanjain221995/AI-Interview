title: Sensor Pair XOR Band
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, network, data, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Sensor Pair XOR Band

  A warehouse runs a mesh of battery-powered radio sensors. Each sensor is assigned a 15-bit
  **channel id**, and the radio firmware derives its hopping pattern from that id. Field testing showed
  that two sensors disturb each other exactly when the bitwise **XOR** of their channel ids falls inside
  a known interference band `[low, high]` (both ends inclusive).

  Before a new channel plan is rolled out, the planning tool must report how many sensor pairs would
  interfere. Given the planned `ids` (one entry per sensor, so the same id may appear more than once),
  return the number of index pairs `(i, j)` with `i < j` such that

  ```
  low <= ids[i] XOR ids[j] <= high
  ```

  Each unordered pair of sensors is counted once. Two sensors with the same id have XOR `0`, so they
  are counted only when `low` is `0`. Return `0` when no pair qualifies (including when there is only
  one sensor).

  ### Example 1
  ```
  Input:  ids = [3, 8, 2, 10], low = 2, high = 9
  Output: 3
  Explanation: 3 XOR 10 = 9, 8 XOR 10 = 2 and 2 XOR 10 = 8 are inside the band;
  3 XOR 8 = 11, 3 XOR 2 = 1 and 8 XOR 2 = 10 are not.
  ```

  ### Example 2
  ```
  Input:  ids = [5, 5, 1, 4], low = 0, high = 1
  Output: 3
  Explanation: the two sensors with id 5 give XOR 0, and each id 5 paired with id 4 gives XOR 1.
  ```

  ### Constraints
  - `1 <= ids.length <= 2 * 10^4`
  - `0 <= ids[i] <= 32767` (15 bits)
  - `0 <= low <= high <= 32767`
  - The answer can be as large as `n * (n - 1) / 2`; return it as a 64-bit integer.

  **Follow-up:** checking every pair is `O(n^2)`. Can you count the pairs in roughly `O(n * 15)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_pairs_in_xor_band
  params:
    - {name: ids, type: "int[]"}
    - {name: low, type: int}
    - {name: high, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_pairs_in_xor_band(ids: list[int], low: int, high: int) -> int:
        BITS = 15
        # Flat binary trie: node 0 is the root, child index 0 means "no child".
        children = [[0, 0]]
        count = [0]

        def insert(value: int) -> None:
            node = 0
            count[0] += 1
            for b in range(BITS - 1, -1, -1):
                bit = (value >> b) & 1
                if children[node][bit] == 0:
                    children.append([0, 0])
                    count.append(0)
                    children[node][bit] = len(children) - 1
                node = children[node][bit]
                count[node] += 1

        def count_below(value: int, bound: int) -> int:
            # How many stored ids y satisfy (value XOR y) < bound.
            if bound >= 1 << BITS:
                return count[0]
            total = 0
            node = 0
            for b in range(BITS - 1, -1, -1):
                v = (value >> b) & 1
                if (bound >> b) & 1:
                    # Every y matching v at this bit makes the XOR bit 0 < 1, so all of them count.
                    same = children[node][v]
                    if same:
                        total += count[same]
                    node = children[node][v ^ 1]
                else:
                    node = children[node][v]
                if node == 0:
                    break
            return total

        pairs = 0
        for value in ids:
            pairs += count_below(value, high + 1) - count_below(value, low)
            insert(value)
        return pairs
  javascript: |
    function countPairsInXorBand(ids, low, high) {
      const BITS = 15;
      const maxNodes = ids.length * BITS + 1;
      const zero = new Int32Array(maxNodes);
      const one = new Int32Array(maxNodes);
      const count = new Int32Array(maxNodes);
      let used = 1;

      function insert(value) {
        let node = 0;
        count[0]++;
        for (let b = BITS - 1; b >= 0; b--) {
          const kids = ((value >> b) & 1) ? one : zero;
          if (kids[node] === 0) kids[node] = used++;
          node = kids[node];
          count[node]++;
        }
      }

      function countBelow(value, bound) {
        if (bound >= 1 << BITS) return count[0];
        let total = 0;
        let node = 0;
        for (let b = BITS - 1; b >= 0; b--) {
          const v = (value >> b) & 1;
          const same = v ? one : zero;
          const other = v ? zero : one;
          if ((bound >> b) & 1) {
            if (same[node] !== 0) total += count[same[node]];
            node = other[node];
          } else {
            node = same[node];
          }
          if (node === 0) break;
        }
        return total;
      }

      let pairs = 0;
      for (const value of ids) {
        pairs += countBelow(value, high + 1) - countBelow(value, low);
        insert(value);
      }
      return pairs;
    }
