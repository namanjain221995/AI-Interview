expected_concepts:
  - counting pairs in a range as count(< high + 1) minus count(< low)
  - binary trie over fixed-width bit representations with subtree counts
  - walking the trie against a bound bit by bit to count XOR values below it
  - processing ids left to right so each unordered pair is counted once
  - 64-bit result for up to n * (n - 1) / 2 pairs
optimal_complexity: {time: O(n * B) with B = 15 bits, space: O(n * B)}
rubric:
  excellent: Reduces the band to two "XOR below a bound" counts, builds a binary trie with subtree counts, explains why a set bound bit lets the whole matching subtree be added at once, inserts after querying so pairs are counted once, and states O(n * 15) time and space.
  good: Reaches the trie idea with some prompting or implements a correct but less tidy variant (for example a counting map over prefixes); minor off-by-one on the bounds fixed after testing.
  weak: Stops at the O(n^2) double loop without a path to something faster, counts ordered pairs or self-pairs, or mishandles duplicates when low is 0.
  criteria:
    correctness: All tests pass, including duplicates with low 0, single-element input and a band that reaches 32767.
    efficiency: Near-linear in n times the bit width instead of comparing every pair.
    code_quality: A small insert routine and a separate count-below routine; no duplicated bit-walking logic for low and high.
    edge_cases: Bound of high + 1 = 32768 exceeding 15 bits, equal ids, and a single sensor.
    communication: Explains the prefix-bound argument and why querying before inserting avoids double counting.
hints:
  - Counting values inside a band is often easier as two simpler counts. How many pairs have an XOR strictly below some bound, and how do you combine two such counts?
  - Store the ids you have already seen in a binary trie keyed by their bits from most significant to least, and keep in each node how many ids pass through it. Then count, for the current id, how many stored ids give an XOR below a bound.
  - Walk the trie from the top bit with the current id and the bound side by side. Where the bound bit is 1, every stored id that matches the current id at this bit produces an XOR bit of 0, so add that whole child's count and continue down the opposite child; where the bound bit is 0 you must follow the matching child. Query with high + 1 and with low, subtract, then insert the current id.
followups:
  - How would you answer many different bands for the same set of ids without rebuilding the trie?
  - How would the approach change if ids were 64-bit values?
  - How would you support removing a sensor from the plan and recounting quickly?
  - How would you find the single pair with the largest XOR instead of counting pairs?
common_errors:
  - Counting ordered pairs or pairing an id with itself, which doubles the result or adds n.
  - Using count(<= high) minus count(<= low), which drops pairs whose XOR equals low.
  - Forgetting that high + 1 can be 32768 and needs one more bit than the ids.
  - Inserting the current id before querying, which pairs it with itself and counts it whenever low is 0.
