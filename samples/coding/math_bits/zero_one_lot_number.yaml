expected_concepts:
  - "work with remainders modulo k instead of huge numbers"
  - "breadth-first search over at most k remainder states"
  - "BFS order (shorter first, append 0 before 1) yields the smallest number"
  - "parent links to reconstruct the digit string"
  - "O(k) time and space"
optimal_complexity: {time: "O(k)", space: "O(k)"}
rubric:
  excellent: "Notes that only the remainder modulo k matters, runs BFS from remainder 1 appending 0 before 1, marks visited remainders, reconstructs the answer from parent links, and argues why the first time remainder 0 is reached gives the smallest number; states O(k)."
  good: "Correct BFS that stores full strings in the queue (more memory) or needs a hint about visited remainders."
  weak: "Enumerates candidate numbers as 64-bit integers (overflows), tries multiples of k one by one, or does not guarantee the smallest answer."
  criteria:
    correctness: "All tests pass, including k = 1, powers of two and ten, and answers longer than 64 bits."
    efficiency: "Each remainder is visited at most once, so the search is O(k)."
    code_quality: "Clear separation of search and reconstruction; queue and visited arrays are named."
    edge_cases: "k = 1, k that divides a power of ten, and k whose answer is very long."
    communication: "Explains why two prefixes with the same remainder are interchangeable and the smaller one wins."
hints:
  - "You never need the full value of a candidate number to test divisibility by k. What smaller piece of information is enough?"
  - "Appending a digit d to a number with remainder r gives remainder (10 r + d) mod k. Treat each remainder as a node in a graph with two outgoing edges and search it level by level so shorter numbers come first."
  - "Run a breadth-first search starting from the remainder of 1, trying digit 0 before digit 1 and visiting each remainder only once. Record for every remainder the previous remainder and the digit used. When remainder 0 is first reached, follow the records back to the start and reverse the digits to get the answer."
followups:
  - "Why does visiting each remainder only once never lose the smallest answer?"
  - "How would you generalise to an arbitrary set of allowed digits?"
  - "How long can the answer be in the worst case, and why is it bounded by k digits?"
  - "How would you find the smallest such multiple with an exact number of ones?"
common_errors:
  - "Storing candidates as 64-bit integers, which overflows for k such as 9999."
  - "Trying multiples k, 2k, 3k, ... and checking their digits, which can take astronomically long."
  - "Appending 1 before 0 or using DFS, which finds a valid but not the smallest number."
  - "Not handling k = 1, where the remainder of 1 is already 0."
