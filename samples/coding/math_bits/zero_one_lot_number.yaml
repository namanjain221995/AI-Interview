time_limit_minutes: 25
prompt_markdown: |
  ## Zero-One Lot Number

  A packaging line stamps a lot number on every batch, but the stamping head only has the digits `0` and
  `1`. For accounting, a lot number must be a **positive multiple of the batch size** `k`.

  Given `k`, return the **smallest positive integer whose decimal digits are all `0` or `1` and that is
  divisible by `k`**, as a decimal string without leading zeros. Such a number always exists.

  The answer can have many more digits than fit in a 64-bit integer, so build it as a string.

  ### Example 1
  ```
  Input:  k = 3
  Output: "111"
  Explanation: 1, 10 and 11 are not multiples of 3; 111 = 3 * 37 is the first that is.
  ```

  ### Example 2
  ```
  Input:  k = 4
  Output: "100"
  Explanation: 100 = 4 * 25; 1, 10, 11 are not divisible by 4.
  ```

  ### Example 3
  ```
  Input:  k = 7
  Output: "1001"
  Explanation: 1001 = 7 * 143.
  ```

  ### Constraints
  - `1 <= k <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smallest_zero_one_multiple
  params:
    - {name: k, type: "int"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def smallest_zero_one_multiple(k: int) -> str:
        start = 1 % k
        if start == 0:
            return "1"
        # BFS over remainders: shorter numbers first, and within a length smaller
        # numbers first (append 0 before 1), so the first visit is the smallest.
        parent = [-1] * k
        digit = [""] * k
        seen = [False] * k
        seen[start] = True
        digit[start] = "1"
        queue = deque([start])
        while queue and not seen[0]:
            r = queue.popleft()
            for d in (0, 1):
                nxt = (r * 10 + d) % k
                if not seen[nxt]:
                    seen[nxt] = True
                    parent[nxt] = r
                    digit[nxt] = str(d)
                    queue.append(nxt)
        out = []
        r = 0
        while r != -1:
            out.append(digit[r])
            r = parent[r]
        return "".join(reversed(out))
  javascript: |
    function smallestZeroOneMultiple(k) {
      const start = 1 % k;
      if (start === 0) return "1";
      const parent = new Int32Array(k).fill(-1);
      const digit = new Array(k).fill("");
      const seen = new Uint8Array(k);
      seen[start] = 1;
      digit[start] = "1";
      const queue = [start];
      for (let head = 0; head < queue.length && !seen[0]; head++) {
        const r = queue[head];
        for (const d of [0, 1]) {
          const next = (r * 10 + d) % k;
          if (!seen[next]) {
            seen[next] = 1;
            parent[next] = r;
            digit[next] = String(d);
            queue.push(next);
          }
        }
      }
      const out = [];
      for (let r = 0; r !== -1; r = parent[r]) out.push(digit[r]);
      return out.reverse().join("");
    }
