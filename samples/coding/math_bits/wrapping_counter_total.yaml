version: 1
slug: wrapping_counter_total
title: Wrapping Counter Total
difficulty: easy
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [sre, devops, network, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Wrapping Counter Total

  A monitoring agent polls a network interface for its received-bytes counter. The counter is an
  **unsigned integer `bits` wide**: it only ever increases, but after reaching `2^bits - 1` it wraps
  around to `0` and keeps counting. A naive dashboard that subtracts consecutive samples shows huge
  negative spikes whenever the counter wraps.

  You are given the polled values `samples` in time order and the counter width `bits`. Between two
  consecutive polls the counter wraps **at most once**, so the increase between a sample `prev` and the
  next sample `next` is `next - prev` when `next >= prev`, and `next - prev + 2^bits` otherwise.

  Return the total increase across all consecutive pairs. With fewer than two samples there is nothing
  to measure, so return `0`.

  ### Example 1
  ```
  Input:  samples = [250, 10, 40], bits = 8
  Output: 46
  Explanation: 250 -> 10 wraps: 10 - 250 + 256 = 16. Then 40 - 10 = 30. Total 46.
  ```

  ### Example 2
  ```
  Input:  samples = [100, 100, 300], bits = 16
  Output: 200
  ```

  ### Example 3
  ```
  Input:  samples = [7], bits = 32
  Output: 0
  ```

  ### Constraints
  - `8 <= bits <= 40`
  - `0 <= samples.length <= 2000`
  - `0 <= samples[i] <= 2^bits - 1`
  - The counter wraps at most once between consecutive samples.
  - The answer is below `2^53`, so it fits in a 64-bit integer (and in a JavaScript number).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: counter_total_increase
  params:
    - {name: samples, type: "long[]"}
    - {name: bits, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def counter_total_increase(samples: list[int], bits: int) -> int:
        modulus = 1 << bits
        total = 0
        for prev, nxt in zip(samples, samples[1:]):
            delta = nxt - prev
            if delta < 0:
                delta += modulus  # the counter wrapped once
            total += delta
        return total
  javascript: |
    function counterTotalIncrease(samples, bits) {
      // 2 ** bits rather than 1 << bits: shifts are 32-bit in JavaScript.
      const modulus = 2 ** bits;
      let total = 0;
      for (let i = 1; i < samples.length; i++) {
        let delta = samples[i] - samples[i - 1];
        if (delta < 0) delta += modulus;
        total += delta;
      }
      return total;
    }
tests:
