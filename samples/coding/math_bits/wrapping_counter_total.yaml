expected_concepts:
  - "modular arithmetic for wrapping unsigned counters"
  - "pairwise differences over consecutive samples"
  - "64-bit accumulation and integer width pitfalls"
  - "why bit shifts by 32 or more misbehave in some languages"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Computes each delta with a single wrap correction, accumulates in 64 bits, computes 2^bits safely for widths of 32 and above, and connects the problem to real counter-rate pitfalls (counter resets versus wraps)."
  good: "Correct deltas and total; a width or overflow issue (for example a 32-bit shift) is found and fixed after testing."
  weak: "Sums raw differences (negative on wrap), adds the modulus unconditionally, or overflows with 32-bit types."
  criteria:
    correctness: "All tests pass, including wraps at 8, 32 and 40 bits and the largest single step."
    efficiency: "One pass with constant extra memory."
    code_quality: "The wrap correction is explicit and commented; the modulus is computed once."
    edge_cases: "Empty and single-sample input, unchanged samples, drop by one (near-full lap), several wraps in a row."
    communication: "Explains the at-most-one-wrap assumption and what would break if polls were too far apart."
hints:
  - "Look at each pair of neighbouring samples on its own; the total is just the sum of the individual increases."
  - "A sample that is smaller than the one before it can only mean the counter passed its maximum and started again from zero."
  - "For each neighbouring pair take the later value minus the earlier value, and when that difference is negative add two to the power bits once; add the results in a 64-bit total, and compute the power of two with 64-bit or floating arithmetic because a 32-bit shift by 32 or more is not safe in every language."
followups:
  - "How would you tell a wrap from a counter reset caused by a device reboot?"
  - "How would you convert the totals into a per-second rate when poll intervals are uneven?"
  - "What is the longest safe polling interval for a 32-bit counter on a 10 Gbit/s link?"
common_errors:
  - "Summing raw differences, so each wrap produces a large negative contribution."
  - "Computing 2^bits with a 32-bit shift, which fails for bits of 32 or more."
  - "Masking with signed 32-bit bit operators in JavaScript, which gives negative results for 32-bit counters."
  - "Accumulating in a 32-bit integer, which overflows on large totals."
