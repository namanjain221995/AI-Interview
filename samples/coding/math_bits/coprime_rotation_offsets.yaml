slug: coprime_rotation_offsets
title: "Coprime Rotation Offsets"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, sre, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Coprime Rotation Offsets

  A job dispatcher arranges `ring_size` workers in a ring, numbered `0` to `ring_size - 1`. It is configured
  with a **hop size** `h`: after sending a job to worker `w`, the next job goes to worker
  `(w + h) mod ring_size`. Starting from any worker, the dispatcher reaches **every** worker before
  repeating one exactly when `gcd(h, ring_size) = 1` (the hop size and the ring size share no common factor
  greater than 1).

  The operations team wants to know how much choice it has. Return how many hop sizes `h` with
  `1 <= h <= limit` reach every worker. Note that `h` may be larger than `ring_size`. When `ring_size = 1`,
  every hop size reaches the single worker.

  ### Example 1
  ```
  Input:  limit = 10, ring_size = 12
  Output: 3
  Explanation: Only the hop sizes 1, 5 and 7 share no factor with 12.
  ```

  ### Example 2
  ```
  Input:  limit = 20, ring_size = 7
  Output: 18
  Explanation: Every hop size except 7 and 14 works.
  ```

  ### Constraints
  - `1 <= limit <= 10^12`
  - `1 <= ring_size <= 10^12`

  **Follow-up:** checking every candidate hop size is far too slow for `limit = 10^12`. Can you avoid
  looking at hop sizes one by one?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_coprime_offsets
  params:
    - {name: limit, type: "long"}
    - {name: ring_size, type: "long"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_coprime_offsets(limit: int, ring_size: int) -> int:
        # Distinct prime factors of ring_size by trial division up to its square root.
        primes = []
        rest = ring_size
        d = 2
        while d * d <= rest:
            if rest % d == 0:
                primes.append(d)
                while rest % d == 0:
                    rest //= d
            d += 1 if d == 2 else 2
        if rest > 1:
            primes.append(rest)  # one prime factor larger than the square root remains

        # Inclusion-exclusion: subtract hop sizes divisible by some prime factor.
        total = 0
        for mask in range(1 << len(primes)):
            product = 1
            bits = 0
            for i, p in enumerate(primes):
                if mask >> i & 1:
                    product *= p
                    bits += 1
            term = limit // product
            total += -term if bits % 2 else term
        return total
  javascript: |
    function countCoprimeOffsets(limit, ringSize) {
      const floorDiv = (x, d) => (x - (x % d)) / d; // exact for safe integers
      const primes = [];
      let rest = ringSize;
      for (let d = 2; d * d <= rest; d += d === 2 ? 1 : 2) {
        if (rest % d === 0) {
          primes.push(d);
          while (rest % d === 0) rest /= d;
        }
      }
      if (rest > 1) primes.push(rest);
      let total = 0;
      for (let mask = 0; mask < (1 << primes.length); mask++) {
        let product = 1; // a product of distinct prime factors divides ringSize, so it stays safe
        let bits = 0;
        for (let i = 0; i < primes.length; i++) {
          if ((mask >> i) & 1) { product *= primes[i]; bits++; }
        }
        const term = floorDiv(limit, product);
        total += bits % 2 === 1 ? -term : term;
      }
      return total;
    }
tests:
  - {id: t1, args: [10, 12], expected: 3, description: "Example 1"}
  - {id: t2, args: [20, 7], expected: 18, description: "Example 2 - prime ring size and hop sizes beyond the ring size"}
  - {id: t3, hidden: true, args: [1000000000000, 1], expected: 1000000000000, description: "ring_size = 1: every hop size qualifies (no prime factors)"}
  - {id: t4, hidden: true, args: [1, 1000000000000], expected: 1, description: "limit = 1: the hop size 1 always qualifies"}
  - {id: t5, hidden: true, args: [1000000000000, 999999999989], expected: 999999999999, description: "Largest prime ring size: trial division must finish within the square root and keep the leftover prime"}
  - {id: t6, hidden: true, args: [1000000000000, 1099511627776], expected: 500000000000, description: "ring_size = 2^40 (single repeated prime factor; must not be counted twice)"}
  - {id: t7, hidden: true, args: [987654321987, 200560490130], expected: 150965087946, description: "ring_size is the product of the first 11 primes: 2048 inclusion-exclusion terms"}
  - {id: t8, hidden: true, args: [500000000000, 999962000357], expected: 499998999982, description: "ring_size = 999983 * 999979, two primes just below 10^6"}
  - {id: t9, hidden: true, args: [999966000289, 999966000289], expected: 999965000306, description: "ring_size is the square of the prime 999983 and limit equals ring_size (Euler's totient)"}
  - {id: t10, hidden: true, args: [100, 360], expected: 26, description: "Small composite ring with repeated factors 2^3 * 3^2 * 5"}
expected_concepts:
  - "gcd and coprimality"
  - "factoring by trial division up to the square root"
  - "keeping the leftover prime factor larger than the square root"
  - "inclusion-exclusion over distinct prime factors"
  - "64-bit arithmetic for limits up to 10^12"
optimal_complexity: {time: "O(sqrt(ring_size) + 2^w * w) where w <= 11 is the number of distinct prime factors", space: "O(w)"}
rubric:
  excellent: "Reduces coprimality to avoiding the distinct prime factors of ring_size, factors it by trial division to the square root while keeping a large leftover prime, applies inclusion-exclusion over the at most 11 primes and explains why the number of terms stays small."
  good: "Reaches factoring plus inclusion-exclusion but needs a hint for the leftover prime, repeated factors or ring_size = 1."
  weak: "Loops over every hop size calling gcd, or subtracts multiples of each prime without adding back the overlaps."
  criteria:
    correctness: "All tests pass, including ring_size = 1, prime powers and a large prime ring size."
    efficiency: "Square-root factoring plus a small inclusion-exclusion; no per-hop work."
    code_quality: "Factoring and counting are clearly separated; distinct primes are collected without duplicates."
    edge_cases: "ring_size = 1, limit smaller than ring_size, prime powers, and a prime factor above the square root."
    communication: "Explains why only distinct primes matter and bounds the number of subsets."
hints:
  - "A hop size fails exactly when it shares a prime factor with ring_size. Which numbers do you need to know about ring_size to describe all failing hop sizes?"
  - "Find the distinct prime factors of ring_size; a value up to 10^12 can be factored by testing divisors up to its square root. Then count the hop sizes up to limit that are divisible by none of those primes."
  - "Use inclusion and exclusion over the distinct primes: for every subset, take the product of its primes and add or subtract limit divided by that product depending on whether the subset size is even or odd. Remember that whatever remains above 1 after trial division is itself a prime factor, and that ring_size has at most 11 distinct primes, so there are at most 2048 subsets."
followups:
  - "How does the answer relate to Euler's totient function when limit equals ring_size?"
  - "How would you answer many queries with different limits for the same ring_size?"
  - "Which hop size would you pick if you also wanted consecutive jobs to land far apart on the ring?"
  - "How would you factor ring_size if it could be as large as 10^18?"
common_errors:
  - "Dropping the leftover prime factor larger than the square root after trial division."
  - "Adding a repeated prime factor more than once, which corrupts the inclusion-exclusion."
  - "Subtracting multiples of each prime without adding back multiples of their products."
  - "Iterating over every hop size, which is far too slow for limit = 10^12."
