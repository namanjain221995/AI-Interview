slug: factorial_zeros_in_base
title: "Factorial Zeros in Base"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist, ml]
time_limit_minutes: 25
prompt_markdown: |
  ## Factorial Zeros in Base

  A test-orchestration tool reports how many different execution orders a suite of `n` independent test
  jobs has: `n!` (with `0! = 1`). The report stores that count as a numeral in a configurable radix
  `base`, and a storage optimiser strips the trailing zero digits before saving.

  Given `n` and `base`, return **how many trailing zeros** `n!` has when written in base `base`.

  `n!` is astronomically large for the allowed `n`, so it cannot be computed directly; work with the
  structure of `base` instead.

  ### Example 1
  ```
  Input:  n = 10, base = 10
  Output: 2
  Explanation: 10! = 3628800 ends in two zeros.
  ```

  ### Example 2
  ```
  Input:  n = 5, base = 12
  Output: 1
  Explanation: 5! = 120 = 10 * 12 + 0, written A0 in base 12 (digit A = 10): one trailing zero.
  ```

  ### Example 3
  ```
  Input:  n = 6, base = 9
  Output: 1
  Explanation: 6! = 720 is 880 in base 9; 720 contains 3^2 but not 3^4.
  ```

  ### Constraints
  - `0 <= n <= 10^15`
  - `2 <= base <= 10^6`
  - The answer fits in a signed 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: factorial_trailing_zeros
  params:
    - {name: n, type: "long"}
    - {name: base, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def factorial_trailing_zeros(n: int, base: int) -> int:
        def prime_power_in_factorial(p: int) -> int:
            # Legendre: multiples of p, of p^2, of p^3, ... up to n
            count, q = 0, n
            while q:
                q //= p
                count += q
            return count

        best = None
        remaining, p = base, 2
        while p * p <= remaining:
            if remaining % p == 0:
                exponent = 0
                while remaining % p == 0:
                    remaining //= p
                    exponent += 1
                zeros = prime_power_in_factorial(p) // exponent
                best = zeros if best is None else min(best, zeros)
            p += 1
        if remaining > 1:  # a prime factor larger than sqrt(base), exponent 1
            zeros = prime_power_in_factorial(remaining)
            best = zeros if best is None else min(best, zeros)
        return best
  javascript: |
    function factorialTrailingZeros(n, base) {
      // n <= 10^15 < 2^53, so Number division and Math.floor stay exact here
      const primePowerInFactorial = (p) => {
        let count = 0;
        let q = n;
        while (q > 0) {
          q = Math.floor(q / p);
          count += q;
        }
        return count;
      };
      let best = Infinity;
      let remaining = base;
      for (let p = 2; p * p <= remaining; p++) {
        if (remaining % p !== 0) continue;
        let exponent = 0;
        while (remaining % p === 0) {
          remaining /= p;
          exponent++;
        }
        best = Math.min(best, Math.floor(primePowerInFactorial(p) / exponent));
      }
      if (remaining > 1) best = Math.min(best, primePowerInFactorial(remaining));
      return best;
    }
tests:
  - {id: t1, args: [10, 10], expected: 2, description: "Example 1 - decimal"}
  - {id: t2, args: [5, 12], expected: 1, description: "Example 2 - composite base 12 = 2^2 * 3"}
  - {id: t3, args: [6, 9], expected: 1, description: "Example 3 - prime-power base 9 = 3^2"}
  - {id: t4, hidden: true, args: [0, 7], expected: 0, description: "n = 0: 0! = 1 has no trailing zeros"}
  - {id: t5, hidden: true, args: [100, 101], expected: 0, description: "Prime base larger than n gives 0"}
  - {id: t6, hidden: true, args: [1000, 36], expected: 249, description: "Base 36 = 2^2 * 3^2: the factor 3 is the bottleneck"}
  - {id: t7, hidden: true, args: [1000000000000000, 2], expected: 999999999999980, description: "Base 2 with n = 10^15: answer near 10^15 (64-bit result)"}
  - {id: t8, hidden: true, args: [1000000000000000, 999983], expected: 1000018000, description: "Largest prime base below 10^6"}
  - {id: t9, hidden: true, args: [1000000000000000, 524288], expected: 52631578947367, description: "Base 2^19: exponent division matters"}
  - {id: t10, hidden: true, args: [1000000000000000, 1000000], expected: 41666666666666, description: "Base 10^6 = 2^6 * 5^6: the factor 5 is the bottleneck"}
  - {id: t11, hidden: true, args: [999999999999999, 994009], expected: 502008032128, description: "Square of a large prime (997^2) as the base"}
expected_concepts:
  - "prime factorisation of the base by trial division"
  - "Legendre's formula for the exponent of a prime in n!"
  - "the answer is the minimum over prime powers p^e of floor(exponent / e)"
  - "logarithmic loops in n, sqrt(base) factorisation"
  - "64-bit arithmetic for large n"
optimal_complexity: {time: "O(sqrt(base) + log n * number of prime factors)", space: "O(1)"}
rubric:
  excellent: "Generalises the base-10 count of fives to an arbitrary base: factors the base into prime powers, applies Legendre's formula per prime, divides by the exponent, takes the minimum and explains the complexity; handles n = 0 and large primes."
  good: "Correct for most bases but needs a hint about repeated prime factors (dividing by the exponent) or the leftover large prime after trial division."
  weak: "Computes n! directly, only handles base 10, or uses only the largest prime factor of the base."
  criteria:
    correctness: "All tests pass, including prime bases, prime-power bases and n = 0."
    efficiency: "Trial division up to sqrt(base) and a logarithmic Legendre loop per prime factor."
    code_quality: "Separate helper for the prime exponent in n!; clear minimum over factors."
    edge_cases: "n = 0 or 1, base prime and larger than n, base a perfect power, and n near 10^15."
    communication: "Explains why each trailing zero needs one full copy of the base and why the scarcest prime power decides."
hints:
  - "In base 10 the number of trailing zeros of a number is how many times 10 divides it. What is the equivalent statement for an arbitrary base?"
  - "Factor the base into prime powers. Each trailing zero needs every prime power of the base once, so the prime that runs out first decides. You can count how many times a prime p divides n! without computing n! by counting multiples of p, of p squared, and so on."
  - "Trial-divide the base to get each prime p with its exponent e (remember a leftover prime factor above the square root). For each p, sum n divided by p, n divided by p squared, and so on (integer division) to get its exponent in n!, divide that by e, and return the minimum of these values over all primes of the base."
followups:
  - "How would you return the last non-zero digit of n! in base 10?"
  - "How many digits does n! have in base b, approximately?"
  - "Given a target count of trailing zeros, how would you find the smallest n that reaches it?"
  - "How would you handle many queries with different bases efficiently?"
common_errors:
  - "Computing n! directly, which overflows or takes too long."
  - "Only considering the largest prime factor of the base, which fails for bases like 36 or 12."
  - "Forgetting to divide by the exponent for repeated prime factors such as 9 = 3^2."
  - "Missing the final prime factor larger than the square root of the base after trial division."
  - "Using 32-bit integers for n or the counts."
