slug: ring_decommission_order
title: "Ring Decommission Order"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, platform, backend, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Ring Decommission Order

  A cluster's servers, labelled `1` to `n`, are arranged in a ring for a rolling decommission: after
  server `n` the ring continues with server `1`. The procedure is:

  1. Start counting at server `1` (it counts as `1`) and move clockwise through the servers still in the
     ring.
  2. The server reached on count `k` is decommissioned and removed from the ring.
  3. Counting restarts at `1` on the next surviving server clockwise, and step 2 repeats.

  The procedure ends when only one server remains. `k` can be larger than the number of servers still in
  the ring; counting simply keeps going around.

  Return the **label of the last server standing**. With `n` up to `10^6` and `k` up to `10^9`,
  simulating every count is far too slow; aim for `O(n)` time.

  ### Example 1
  ```
  Input:  n = 5, k = 2
  Output: 3
  Explanation: Servers are removed in the order 2, 4, 1, 5; server 3 remains.
  ```

  ### Example 2
  ```
  Input:  n = 4, k = 6
  Output: 3
  Explanation: Counting 6 from server 1 wraps around and removes 2; then 1, then 4 go; server 3 remains.
  ```

  ### Example 3
  ```
  Input:  n = 1, k = 7
  Output: 1
  ```

  ### Constraints
  - `1 <= n <= 10^6`
  - `1 <= k <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: last_server_standing
  params:
    - {name: n, type: "int"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def last_server_standing(n: int, k: int) -> int:
        # survivor = 0-based position of the survivor in a ring of `size` servers
        survivor = 0
        for size in range(2, n + 1):
            # removing the k-th server shifts every position by k, modulo the ring size
            survivor = (survivor + k) % size
        return survivor + 1
  javascript: |
    function lastServerStanding(n, k) {
      let survivor = 0; // 0-based survivor position in a ring of `size` servers
      for (let size = 2; size <= n; size++) {
        survivor = (survivor + k) % size;
      }
      return survivor + 1;
    }
tests:
  - {id: t1, args: [5, 2], expected: 3, description: "Example 1"}
  - {id: t2, args: [4, 6], expected: 3, description: "Example 2 - k larger than the ring"}
  - {id: t3, args: [1, 7], expected: 1, description: "Example 3 - a single server is already the last one"}
  - {id: t4, hidden: true, args: [2, 1], expected: 2, description: "k = 1 removes servers in label order: the last label survives"}
  - {id: t5, hidden: true, args: [10, 1], expected: 10, description: "k = 1 with more servers"}
  - {id: t6, hidden: true, args: [7, 10], expected: 5, description: "k exceeds n from the start"}
  - {id: t7, hidden: true, args: [100, 2], expected: 73, description: "k = 2 with n not a power of two"}
  - {id: t8, hidden: true, args: [1000000, 1], expected: 1000000, description: "Upper bound n with k = 1"}
  - {id: t9, hidden: true, args: [1000000, 1000000000], expected: 642255, description: "Upper bounds for both n and k (simulation is hopeless)"}
  - {id: t10, hidden: true, args: [999983, 37], expected: 407956, description: "Large prime n with a small k"}
expected_concepts:
  - "Josephus recurrence: survivor(size) = (survivor(size - 1) + k) mod size"
  - "re-indexing the ring after each removal"
  - "O(n) time and O(1) space versus O(n k) or O(n^2) simulation"
  - "0-based positions converted to 1-based labels"
  - "k larger than the ring handled by the modulo"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Derives the recurrence by re-indexing the ring after the first removal, iterates it bottom-up from a ring of size 1, converts to a 1-based label and explains why the modulo handles k larger than the ring; states O(n) time and O(1) space."
  good: "Implements the recurrence correctly with a hint, or writes a correct recursive version and then notes the recursion depth issue for n = 10^6."
  weak: "Simulates the counting with a list or queue, which is O(n k) or O(n^2), or mixes up 0-based and 1-based labels."
  criteria:
    correctness: "All tests pass, including n = 1, k = 1 and k much larger than n."
    efficiency: "Single loop over ring sizes with constant work per step."
    code_quality: "Iterative rather than deeply recursive; variable names convey the 0-based survivor position."
    edge_cases: "n = 1, k = 1, k greater than n and both at their upper bounds."
    communication: "Explains the re-indexing argument behind the recurrence with a small example."
hints:
  - "Simulating every count is too slow. After the first server is removed, the remaining problem looks like a smaller ring of the same kind. How are the two related?"
  - "Number positions from 0. If you know which position survives in a ring of size m minus 1, the first removal in a ring of size m shifts every position by k (wrapping around). That gives a recurrence from smaller rings to larger ones."
  - "Start with survivor position 0 for a ring of one server. For every ring size from 2 up to n, set the survivor to the previous survivor plus k, modulo the current size. Finally add one to convert the 0-based position to a label. Use a loop, not recursion, because n can be a million."
followups:
  - "How would you output the full decommission order efficiently (for example with an order-statistics tree)?"
  - "Is there a faster than O(n) method when k is small compared with n?"
  - "What is the closed form for k = 2?"
  - "How would the recurrence change if counting started at server s instead of server 1?"
common_errors:
  - "Simulating with a list and removing elements, which is O(n^2) and times out."
  - "Returning the 0-based survivor position instead of the 1-based label."
  - "Implementing the recurrence recursively and overflowing the stack for n = 10^6."
  - "Counting the first server as count 0 instead of count 1, which shifts every removal."
