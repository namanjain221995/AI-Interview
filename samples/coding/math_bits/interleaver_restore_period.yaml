  return_type: "int"
  comparison: exact
reference_solutions:
  python: |

    def restore_period(perm: list[int]) -> int:
        MOD = 1_000_000_007
        n = len(perm)
        seen = [False] * n
        best_exponent: dict[int, int] = {}
        for start in range(n):
            if seen[start]:
                continue
            length = 0
            i = start
            while not seen[i]:
                seen[i] = True
                i = perm[i]
                length += 1
            p = 2
            while p * p <= length:
                if length % p == 0:
                    exponent = 0
                    while length % p == 0:
                        length //= p
                        exponent += 1
                    if exponent > best_exponent.get(p, 0):
                        best_exponent[p] = exponent
                p += 1
            if length > 1 and length not in best_exponent:
                best_exponent[length] = 1
        result = 1
        for p, exponent in best_exponent.items():
            result = result * pow(p, exponent, MOD) % MOD
        return result
  javascript: |

    function restorePeriod(perm) {
      const MOD = 1000000007n;
      const n = perm.length;
      const seen = new Uint8Array(n);
      const bestExponent = new Map();
      for (let start = 0; start < n; start++) {
        if (seen[start]) continue;
        let length = 0;
        let i = start;
        while (!seen[i]) {
          seen[i] = 1;
          i = perm[i];
          length++;
        }
        for (let p = 2; p * p <= length; p++) {
          if (length % p === 0) {
            let exponent = 0;
            while (length % p === 0) {
              length /= p;
              exponent++;
            }
            if (exponent > (bestExponent.get(p) || 0)) bestExponent.set(p, exponent);
          }
        }
        if (length > 1 && !bestExponent.has(length)) bestExponent.set(length, 1);
      }
      let result = 1n;
      for (const [p, exponent] of bestExponent) {
        for (let k = 0; k < exponent; k++) result = (result * BigInt(p)) % MOD;
      }
      return Number(result);
    }
