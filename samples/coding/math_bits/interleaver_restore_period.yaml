expected_concepts:
  - "decomposing a permutation into disjoint cycles"
  - "the restore period is the least common multiple of the cycle lengths"
  - "building the lcm from the maximum exponent of each prime instead of multiplying reduced values"
  - "modular arithmetic and overflow-safe multiplication"
  - "visited marking for linear-time cycle detection"
optimal_complexity: {time: "O(n * sqrt(n)) worst case with trial division (O(n log n) with a smallest-prime-factor sieve)", space: "O(n)"}
rubric:
  excellent: "Recognises that each cycle returns after its length, that the answer is the lcm of cycle lengths, explains why gcd-based lcm cannot be reduced modulo a prime, builds the lcm from maximal prime-power exponents and reduces it modulo 1e9+7 with overflow-safe multiplication."
  good: "Finds the cycles and the lcm idea, but needs a hint to avoid computing the lcm with reduced values or to handle the modulus correctly."
  weak: "Simulates passes until the order repeats, multiplies cycle lengths instead of taking their lcm, or applies the modulus inside a gcd/lcm step."
  criteria:
    correctness: "Passes all tests, including equal and overlapping-factor cycle lengths and the huge stress case."
    efficiency: "Linear cycle discovery plus cheap factorisation of each cycle length; no pass-by-pass simulation."
    code_quality: "Separates cycle discovery from lcm assembly, with clear names for the per-prime exponent table."
    edge_cases: "Single element, identity permutation, many equal cycles and cycle lengths that are prime powers."
    communication: "Explains why lcm(a mod p, b mod p) is not lcm(a, b) mod p and how prime exponents fix it."
hints:
  - "Follow where one symbol goes pass after pass. It travels around a closed loop of positions and returns after a fixed number of passes; every position belongs to exactly one such loop."
  - "The block is restored exactly when every loop has completed a whole number of turns, so the answer is the least common multiple of the loop lengths. That number can be enormous, and an lcm cannot be computed from values that were already reduced modulo a prime."
  - "Find all loop lengths with a visited array. Factor each length into primes and remember, for every prime, the largest exponent seen in any length. The least common multiple is the product of each prime raised to that largest exponent, so multiply those prime powers together while reducing modulo 1000000007 after every multiplication."
followups:
  - "How would you speed up factorisation if many different cycle lengths appear (smallest-prime-factor sieve)?"
  - "How would you answer the question for the k-th power of the interleaver, or for applying two different interleavers alternately?"
  - "How many passes restore just one chosen position, and how does that differ from the whole block?"
common_errors:
  - "Simulating passes until the original order returns, which can take an astronomical number of passes."
  - "Multiplying the cycle lengths instead of taking their least common multiple."
  - "Computing lcm with gcd on values already reduced modulo 1e9+7, which gives a wrong remainder."
  - "Overflowing 64-bit integers when multiplying two residues in languages without big integers."
