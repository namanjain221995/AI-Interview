time_limit_minutes: 25
prompt_markdown: |
  ## Interleaver Restore Period

  A burst-error protection stage in a network appliance shuffles every block of `n` symbols with a
  fixed **interleaver**. The interleaver is described by an array `perm` that is a permutation of
  `0 .. n-1`: on every pass, the symbol currently at position `i` moves to position `perm[i]` (all
  moves happen at the same time).

  Applying the same pass again and again eventually puts every symbol back where it started. Return the
  **minimum positive** number of passes after which the block is in its original order again. Because
  this number can be astronomically large, return it **modulo `1_000_000_007`** (reduce the exact
  minimum, not an intermediate value that is merely a multiple of it).

  ### Example 1
  ```
  Input:  perm = [1, 2, 0, 4, 3]
  Output: 6
  Explanation: positions 0 -> 1 -> 2 -> 0 form a cycle of length 3 and positions 3 <-> 4 a
  cycle of length 2. Both are back in place for the first time after 6 passes.
  ```

  ### Example 2
  ```
  Input:  perm = [0, 1, 2, 3]
  Output: 1
  Explanation: nothing moves, so a single pass already restores the order.
  ```

  ### Example 3
  ```
  Input:  perm = [3, 0, 1, 2, 5, 6, 7, 8, 9, 4]
  Output: 12
  Explanation: positions 0..3 form a cycle of length 4 and positions 4..9 a cycle of
  length 6. The first pass count divisible by both 4 and 6 is 12.
  ```

  ### Constraints
  - `1 <= perm.length <= 10^5`
  - `perm` contains every integer from `0` to `perm.length - 1` exactly once
  - The exact answer may have hundreds of digits; only its remainder modulo `1_000_000_007` is returned.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: restore_period
  params:
