slug: crew_cycle_gcd_total
title: "Crew Cycle GCD Total"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist, ml]
time_limit_minutes: 30
prompt_markdown: |
  ## Crew Cycle GCD Total

  A maintenance planner models `n` crews; crew `i` (for `i = 1..n`) repeats its rotation every `i`
  days. When the planner checks two crews with cycles `i` and `j` for clashes, it has to examine
  `gcd(i, j)` alignment phases, where `gcd` is the greatest common divisor (two crews can only ever
  share a day if their start offsets agree modulo `gcd(i, j)`).

  Return the total number of phase checks for every unordered pair of distinct crews:

  `sum of gcd(i, j) over all 1 <= i < j <= n`

  Return `0` when `n = 1` (there are no pairs).

  ### Example 1
  ```
  Input:  n = 4
  Output: 7
  Explanation: gcd(1,2) + gcd(1,3) + gcd(1,4) + gcd(2,3) + gcd(2,4) + gcd(3,4) = 1 + 1 + 1 + 1 + 2 + 1
  ```

  ### Example 2
  ```
  Input:  n = 6
  Output: 20
  ```

  ### Example 3
  ```
  Input:  n = 1
  Output: 0
  ```

  ### Constraints
  - `1 <= n <= 5 * 10^5`
  - The answer exceeds the 32-bit range for large `n` (about `9.6 * 10^11` at `n = 5 * 10^5`).

  **Follow-up:** the `O(n^2 log n)` double loop is far too slow at `n = 5 * 10^5`. Can you reach about
  `O(n log log n)` or `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: total_pair_gcd
  params:
    - {name: n, type: int}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def total_pair_gcd(n: int) -> int:
        # Euler's totient sieve: phi[k] = how many 1 <= a <= k are coprime to k (phi[1] = 1)
        phi = list(range(n + 1))
        for p in range(2, n + 1):
            if phi[p] == p:  # p is prime
                for k in range(p, n + 1, p):
                    phi[k] -= phi[k] // p
        # coprime_pairs[m] = number of pairs 1 <= a < b <= m with gcd(a, b) = 1
        #                  = phi[2] + ... + phi[m]
        coprime_pairs = [0] * (n + 1)
        running = 0
        for k in range(2, n + 1):
            running += phi[k]
            coprime_pairs[k] = running
        # pairs with gcd exactly d are d * (a, b) with a < b <= n // d coprime
        return sum(d * coprime_pairs[n // d] for d in range(1, n + 1))
  javascript: |
    function totalPairGcd(n) {
      const phi = new Int32Array(n + 1);
      for (let k = 0; k <= n; k++) phi[k] = k;
      for (let p = 2; p <= n; p++) {
        if (phi[p] === p) {
          for (let k = p; k <= n; k += p) phi[k] -= phi[k] / p;
        }
      }
      const coprimePairs = new Float64Array(n + 1);
      let running = 0;
      for (let k = 2; k <= n; k++) {
        running += phi[k];
        coprimePairs[k] = running;
      }
      let total = 0;
      for (let d = 1; d <= n; d++) total += d * coprimePairs[Math.floor(n / d)];
      return total;
    }
