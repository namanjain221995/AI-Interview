expected_concepts:
  - "grouping pairs by their gcd d"
  - "pairs with gcd exactly d correspond to coprime pairs up to n / d"
  - "Euler's totient function computed with a sieve"
  - "prefix sums of totients"
  - "64-bit accumulation"
optimal_complexity: {time: "O(n log log n)", space: "O(n)"}
rubric:
  excellent: "Groups pairs by gcd, maps gcd-d pairs to coprime pairs up to n / d, counts those with totient prefix sums from a sieve, accumulates in 64 bits and states O(n log log n); alternatively uses the identity sum over d of phi(d) times pairs of multiples."
  good: "Reaches an O(n log n) inclusion-exclusion over multiples (counting pairs with gcd divisible by d, then subtracting) or the totient approach with some guidance."
  weak: "Computes gcd for every pair, or derives a formula but overflows 32-bit totals or double-counts ordered pairs."
  criteria:
    correctness: "Passes all tests, including n = 1, small n, a prime n and the maximum n."
    efficiency: "Near-linear sieve plus a linear pass; no quadratic loop."
    code_quality: "Sieve, prefix sums and the final sum are separate, named steps with the counting argument in comments."
    edge_cases: "n = 1 returns 0; phi(1) is excluded from pair counts; totals beyond 32 bits."
    communication: "Explains the bijection between pairs with gcd d and coprime pairs scaled by d."
hints:
  - "Instead of computing a gcd for every pair, group the pairs by the value of their gcd. For a fixed d, what do the pairs whose gcd is exactly d look like?"
  - "A pair (i, j) has gcd exactly d when i = d * a and j = d * b with a < b <= n / d and gcd(a, b) = 1. So you need the number of coprime pairs below each bound m = n / d, which Euler's totient function counts: for each b, phi(b) values a < b are coprime to b."
  - "Sieve phi for all values up to n (start with phi[k] = k and, for each prime p, subtract phi[k] / p from every multiple k). Build prefix sums C[m] = phi(2) + ... + phi(m), the number of coprime pairs a < b <= m. The answer is the sum over d from 1 to n of d * C[n / d] (integer division), accumulated in 64 bits."
followups:
  - "How would you compute the sum of lcm(i, j) over the same pairs?"
  - "How would you answer many different n values efficiently?"
  - "How could you handle n = 10^11 (hint: group equal values of n / d and use a sublinear totient-sum method)?"
  - "How would the formula change for ordered pairs, or for pairs with i = j included?"
common_errors:
  - "Computing gcd for every pair, which is quadratic."
  - "Including phi(1) in the coprime-pair count, which adds the pair (1, 1)."
  - "Counting ordered pairs and forgetting to halve, or halving twice."
  - "Accumulating the total in a 32-bit integer."
  - "Sieving with floating-point division, which can introduce rounding errors."
