version: 1
slug: next_flag_combination
title: "Next Flag Combination"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [qa, backend, general, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Next Flag Combination

  A QA test-matrix generator encodes a set of enabled feature flags as an integer **mask**: bit `i` (worth
  `2^i`) is `1` when flag `i` is enabled. To test every combination that enables exactly the same number
  of flags, the generator walks those masks in **increasing numeric order**, one at a time.

  Given the current `mask`, return the **smallest integer greater than `mask`** that has the same number of
  `1` bits. New flags can always be added, so the answer may use a higher bit than `mask` does.

  ### Example 1
  ```
  Input:  mask = 6
  Output: 9
  Explanation: 6 is 110 in binary. The next value with two 1 bits is 1001 = 9.
  ```

  ### Example 2
  ```
  Input:  mask = 23
  Output: 27
  Explanation: 23 is 10111. The next value with four 1 bits is 11011 = 27.
  ```

  ### Constraints
  - `1 <= mask <= 2^50`
  - The answer is below `2^52`, so it fits in a 64-bit integer (and is exact as a JavaScript number, but
    JavaScript bitwise operators only work on 32 bits).

  **Follow-up:** counting upwards and checking each value can take about `2^49` steps (for example from
  `mask = 2^49`). Find the answer in time proportional to the number of bits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: next_same_bit_count
  params:
    - {name: mask, type: "long"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def next_same_bit_count(mask: int) -> int:
        lowest = mask & -mask                  # lowest set bit
        ripple = mask + lowest                 # carries through the lowest run of 1 bits
        changed = ripple ^ mask                # the run plus the new bit above it
        # Move the remaining ones of the run (all but one) down to the bottom.
        return ripple | (changed >> 2) // lowest
  javascript: |
    function nextSameBitCount(mask) {
      // Pure arithmetic: bitwise operators would truncate values above 2^31 to 32 bits.
      let rest = mask;
      let lowest = 1;
      while (rest % 2 === 0) { rest /= 2; lowest *= 2; } // value of the lowest set bit
      let ones = 0;
      while (rest % 2 === 1) { rest = (rest - 1) / 2; ones++; } // length of the lowest run of 1 bits
      const ripple = mask + lowest; // clears the run and sets the bit just above it
      return ripple + (2 ** (ones - 1) - 1); // put the other ones - 1 bits at the very bottom
    }
tests:
  - {id: t1, args: [6], expected: 9, description: "Example 1 - run of ones moves up and splits"}
  - {id: t2, args: [23], expected: 27, description: "Example 2 - low run of three ones"}
  - {id: t3, hidden: true, args: [1], expected: 2, description: "Smallest mask: a single flag moves up one bit"}
  - {id: t4, hidden: true, args: [5], expected: 6, description: "Lowest set bit is isolated (run length one)"}
  - {id: t5, hidden: true, args: [1125899906842624], expected: 2251799813685248, description: "Largest single-bit mask: answer 2^51 needs a new high bit"}
  - {id: t6, hidden: true, args: [1125899906842623], expected: 1688849860263935, description: "Fifty consecutive ones: answer uses bit 50 and refills the bottom"}
  - {id: t7, hidden: true, args: [750599937895082], expected: 750599937895084, description: "Alternating 1010... pattern over 50 bits (values far above 32 bits)"}
  - {id: t8, hidden: true, args: [1125898833100800], expected: 1125899907366911, description: "Run of 20 ones starting at bit 30: ones must drop to the lowest bits"}
  - {id: t9, hidden: true, args: [844424930131968], expected: 1125899906842625, description: "Two adjacent high bits: answer 2^50 + 1, so counting upwards would take about 2^48 steps"}
  - {id: t10, hidden: true, args: [624], expected: 643, description: "Run of three ones in the middle with a gap above"}
expected_concepts:
  - "isolating the lowest set bit"
  - "adding the lowest set bit carries through the lowest run of ones"
  - "moving the leftover ones of that run to the least significant positions"
  - "64-bit integers (and avoiding 32-bit bitwise operators in JavaScript)"
  - "O(number of bits) instead of counting upwards"
optimal_complexity: {time: "O(1) word operations (O(bits) without bit tricks)", space: "O(1)"}
rubric:
  excellent: "Explains that the lowest run of ones must move up by one position as a single bit while the rest of the run drops to the bottom, implements it with lowest-set-bit arithmetic in 64-bit integers, and walks through an example such as 23 to 27."
  good: "Finds the rule by examining binary examples and implements it with a loop over bits, possibly needing a hint about refilling the low bits."
  weak: "Counts upwards and re-counts bits for each value, or moves the run without refilling the bottom, or truncates to 32 bits."
  criteria:
    correctness: "All tests pass, including single-bit masks, 50 consecutive ones and values above 2^32."
    efficiency: "Constant number of word operations or a single pass over the bits."
    code_quality: "Named intermediate values (lowest bit, ripple) and a short comment for each step."
    edge_cases: "Masks with one bit, runs reaching the top bit, isolated lowest bits and very large masks."
    communication: "Justifies why the result is the smallest larger value, not just a larger one."
hints:
  - "Write a few masks and their answers in binary. Which part of the mask changes, and which higher bits stay exactly the same?"
  - "Find the lowest group of consecutive 1 bits. To get a larger number with the same count you must move one bit of that group up by one position, and to keep the result as small as possible, the other bits of the group should go as low as possible."
  - "Isolate the lowest set bit and add it to the mask: the carry clears the lowest run of ones and sets the bit just above it. That run had some length r, and one of its bits is now the new higher bit, so place the remaining r minus one bits at positions zero upwards and combine them with the sum. In languages whose bitwise operators are 32-bit, compute the lowest bit and the run length with division by two instead."
followups:
  - "How would you generate all masks of n bits with exactly k ones in increasing order using this step?"
  - "How would you find the previous (largest smaller) mask with the same number of ones?"
  - "How do you detect that the next mask would exceed a fixed width of n flags?"
  - "Can you express the whole step with only additions, a bitwise AND and a division?"
common_errors:
  - "Moving the lowest run of ones up without refilling the bottom bits, which skips smaller valid answers."
  - "Using 32-bit bitwise operators in JavaScript or 32-bit integers in Java, C++ or Go."
  - "Counting upwards and recounting bits, which is far too slow for masks near 2^49."
  - "Shifting the leftover bits by the run length instead of placing them at the lowest positions."
