  - {id: t5, hidden: true, args: [[1125899906842624]], expected: [1125899906842624], description: "Largest request is an exact power of two (2^50)"}
  - {id: t6, hidden: true, args: [[562949953421313, 1125899906842623]], expected: [1125899906842624, 1125899906842624], description: "Just above 2^49 and just below 2^50 both round to 2^50"}
