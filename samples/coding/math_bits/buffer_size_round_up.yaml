expected_concepts:
  - "powers of two and bit length"
  - "single set bit characterises a power of two"
  - "64-bit arithmetic for sizes above 2^31"
  - "handling exact powers without over-rounding"
optimal_complexity: {time: "O(n)", space: "O(1) extra (O(n) for the output)"}
rubric:
  excellent: "Uses the bit length of request minus one (or a bounded doubling loop) per element, explains why exact powers stay unchanged, and deliberately uses 64-bit arithmetic for large sizes."
  good: "Correct doubling loop or logarithm-based solution that handles exact powers, with minor prompting about large values."
  weak: "Rounds exact powers up to the next power, overflows on values above 2^31, or relies on floating-point logarithms that misround large inputs."
  criteria:
    correctness: "All tests pass, including exact powers, 2^50 and values around 2^31 and 2^32."
    efficiency: "Constant or logarithmic work per request; no search over a precomputed table larger than needed."
    code_quality: "Clear per-request helper; no repeated conversions or magic constants."
    edge_cases: "Empty list, request of 1, exact powers and values that do not fit in 32 bits."
    communication: "Explains the link between powers of two and binary representation."
hints:
  - "Start from a buffer of size 1 and keep doubling until it is large enough. How many doublings can a single request need at most?"
  - "A number is a power of two exactly when its binary form has a single set bit. Think about what the number of bits needed to write request minus one tells you."
  - "For each request, compute how many binary digits request minus one needs; two raised to that count is the answer, and a request of 1 gives a count of zero so the answer is 1. A doubling loop from 1 also works in at most 50 steps; either way, use 64-bit values and avoid 32-bit shifts on large sizes."
followups:
  - "Why can a floating-point logarithm give the wrong answer for sizes near 2^50?"
  - "How would you round down to a power of two instead?"
  - "How would you check in constant time whether a request is already a power of two?"
  - "What would change if the allocator used sizes that are multiples of 4096 instead?"
common_errors:
  - "Doubling exact powers of two to the next size up."
  - "Using 32-bit integers or 32-bit shift operators so large requests overflow."
  - "Computing the exponent with a floating-point logarithm and rounding incorrectly near boundaries."
  - "Returning the exponent instead of the buffer size."
