slug: buffer_size_round_up
title: Buffer Size Round-Up
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, mobile, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Buffer Size Round-Up

  A pooled memory allocator only hands out buffers whose size in bytes is a **power of two**:
  1, 2, 4, 8, 16, and so on. Callers ask for arbitrary sizes, and each request is served with the
  smallest buffer that is large enough.

  Given the requested sizes `requests`, return a list of the same length where position `i` holds
  the smallest power of two that is **greater than or equal to** `requests[i]`.

  - A request that is already a power of two gets a buffer of exactly that size.
  - Keep the input order. An empty list returns an empty list.

  ### Example 1
  ```
  Input:  requests = [1, 5, 8, 1000]
  Output: [1, 8, 8, 1024]
  Explanation: 1 and 8 are already powers of two; 5 rounds up to 8 and 1000 to 1024.
  ```

  ### Example 2
  ```
  Input:  requests = []
  Output: []
  ```

  ### Example 3
  ```
  Input:  requests = [3, 17, 2]
  Output: [4, 32, 2]
  ```

  ### Constraints
  - `0 <= requests.length <= 10^4`
  - `1 <= requests[i] <= 2^50`
  - Sizes do not fit in 32 bits; use 64-bit integers. (In JavaScript numbers stay exact up to
    `2^53`, but the bitwise operators work on 32 bits only.)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: round_up_buffer_sizes
  params:
    - {name: requests, type: "long[]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def round_up_buffer_sizes(requests: list[int]) -> list[int]:
        # (request - 1) needs k bits, so 2^k is the smallest power of two >= request
        return [1 << (request - 1).bit_length() for request in requests]
  javascript: |
    function roundUpBufferSizes(requests) {
      return requests.map((request) => {
        let size = 1;
        while (size < request) size *= 2; // at most 50 doublings; no 32-bit shifts
        return size;
      });
    }
