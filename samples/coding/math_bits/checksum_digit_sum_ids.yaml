  - {id: t6, hidden: true, args: [1, 1000000000000000, 135], expected: 1, description: "Maximum target - only fifteen 9s"}
  - {id: t7, hidden: true, args: [1, 1000000000000000, 67], expected: 35460394945125, description: "Full range with a middle target - huge 64-bit count"}
  - {id: t8, hidden: true, args: [123456789012345, 987654321098765, 70], expected: 30722727307483, description: "Long range with both bounds tight across all 15 digits"}
  - {id: t9, hidden: true, args: [500, 599, 4], expected: 0, description: "Prefix digit already exceeds the target - no ids"}
  - {id: t10, hidden: true, args: [999999999999990, 1000000000000000, 134], expected: 1, description: "Range ending at 10^15 near the maximum target"}
  - {id: t11, hidden: true, args: [77777, 77777, 35], expected: 1, description: "lo equals hi and is accepted"}
  - {id: t12, hidden: true, args: [77778, 88888, 1], expected: 0, description: "Target too small for every id in the range"}
expected_concepts:
  - "digit DP over positions with a tight (prefix-equal) flag"
  - "count(hi) - count(lo - 1) to turn a range into two prefix counts"
  - "precomputed counts of free digit strings by length and sum"
  - "64-bit counts"
optimal_complexity: {time: "O(D * 10 * target) with D = 16 digits", space: "O(D * target)"}
rubric:
  excellent: "Reduces the range to two prefix counts, designs a digit DP with a tight flag (or free-digit table), handles the upper bound itself and lo - 1 correctly, and states the O(digits * 10 * target) cost."
  good: "Reaches a correct digit DP with some prompting, possibly memoised recursion with (position, remaining, tight) states, with a minor boundary slip fixed during testing."
  weak: "Iterates over the range, only handles hi with the same number of digits as lo, or miscounts the boundary values."
  criteria:
    correctness: "Passes all tests, including single-value ranges, the maximum target and the full 10^15 range."
    efficiency: "Work depends on the number of digits and target, not on the size of the range."
    code_quality: "Prefix count is a separate helper; the meaning of the tight state and of the table is clear."
    edge_cases: "Handles lo = 1 (count(0) = 0), hi = 10^15 (16 digits), unreachable targets and ranges with no hits."
    communication: "Explains why fixing a smaller digit at a position frees all later digits."
hints:
  - "Counting over a range is easier as a difference: how many accepted ids are at most hi, minus how many are at most lo - 1."
  - "To count ids up to some bound N, walk N's digits from the left. As long as your id copies N's digits it is still 'tight'; the moment you place a smaller digit, every later digit can be anything from 0 to 9."
  - "Precompute how many strings of L free digits sum to s. Then for each position of N, for every digit d smaller than N's digit there, add the number of free strings of the remaining length that sum to target minus the digits used so far minus d; afterwards subtract N's digit from the remaining sum and continue. Finally add 1 if N's own digit sum equals target."
followups:
  - "How would you find the k-th smallest accepted id at or after lo?"
  - "How would the DP change if the checksum were digit sum modulo 7 equal to 3?"
  - "What if ids could contain hexadecimal digits?"
  - "How would you count ids whose digit sum is divisible by the id itself, and why is that much harder?"
common_errors:
  - "Iterating over every id in the range."
  - "Counting up to lo instead of lo - 1, which includes or excludes lo incorrectly."
  - "Forgetting to count the bound N itself after the tight walk."
  - "Treating hi = 10^15 as a 15-digit number."
  - "Using 32-bit counters for results that can exceed 3 * 10^13."
