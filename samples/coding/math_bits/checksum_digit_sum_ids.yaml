slug: checksum_digit_sum_ids
title: "Checksum Digit-Sum IDs"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, qa, general]
time_limit_minutes: 30
prompt_markdown: |
  ## Checksum Digit-Sum IDs

  A legacy fulfilment system validates order ids with a crude checksum: an id is accepted only if
  the sum of its decimal digits is **exactly** `target`. Before migrating a block of ids, the team
  wants to know how many ids in the inclusive range `[lo, hi]` the legacy system would accept.

  Return the count of integers `x` with `lo <= x <= hi` whose decimal digit sum equals `target`.
  Return `0` if there are none. Ids are written without leading zeros (leading zeros would not change
  the digit sum anyway).

  ### Example 1
  ```
  Input:  lo = 1, hi = 100, target = 10
  Output: 9
  Explanation: 19, 28, 37, 46, 55, 64, 73, 82 and 91.
  ```

  ### Example 2
  ```
  Input:  lo = 150, hi = 210, target = 9
  Output: 5
  Explanation: 153, 162, 171, 180 and 207.
  ```

  ### Example 3
  ```
  Input:  lo = 1000, hi = 1000, target = 1
  Output: 1
  ```

  ### Constraints
  - `1 <= lo <= hi <= 10^15`
  - `1 <= target <= 135`
  - The answer can exceed the 32-bit integer range.

  **Follow-up:** the range can hold 10^15 ids, so checking each id is impossible. Can you count in
  time proportional to the number of digits times the target?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_ids_with_digit_sum
  params:
    - {name: lo, type: "long"}
    - {name: hi, type: "long"}
    - {name: target, type: int}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_ids_with_digit_sum(lo: int, hi: int, target: int) -> int:
        max_len = 17
        # ways[length][s] = number of digit strings of `length` free digits that sum to s
        ways = [[0] * (target + 1) for _ in range(max_len + 1)]
        ways[0][0] = 1
        for length in range(1, max_len + 1):
            prev = ways[length - 1]
            for s in range(target + 1):
                ways[length][s] = sum(prev[s - d] for d in range(min(9, s) + 1))

        def count_upto(n: int) -> int:
            # how many x in [0, n] have digit sum == target (target >= 1, so 0 never counts)
            if n < 0:
                return 0
            digits = [int(c) for c in str(n)]
            total = 0
            remaining = target
            for i, digit in enumerate(digits):
                free = len(digits) - i - 1
                # put a smaller digit here; every later digit becomes free
                for d in range(digit):
                    if d <= remaining:
                        total += ways[free][remaining - d]
                remaining -= digit  # stay tight: copy n's digit
                if remaining < 0:
                    break
            if remaining == 0:
                total += 1  # n itself
            return total

        return count_upto(hi) - count_upto(lo - 1)
  javascript: |
    function countIdsWithDigitSum(lo, hi, target) {
      const maxLen = 17;
      const ways = [];
      for (let len = 0; len <= maxLen; len++) ways.push(new Array(target + 1).fill(0));
      ways[0][0] = 1;
      for (let len = 1; len <= maxLen; len++) {
        for (let s = 0; s <= target; s++) {
          let acc = 0;
          for (let d = 0; d <= Math.min(9, s); d++) acc += ways[len - 1][s - d];
          ways[len][s] = acc;
        }
      }
      const countUpto = (n) => {
        if (n < 0) return 0;
        const digits = String(n).split('').map(Number);
        let total = 0;
        let remaining = target;
        for (let i = 0; i < digits.length; i++) {
          const free = digits.length - i - 1;
          for (let d = 0; d < digits[i]; d++) {
            if (d <= remaining) total += ways[free][remaining - d];
          }
          remaining -= digits[i];
          if (remaining < 0) break;
        }
        if (remaining === 0) total += 1;
        return total;
      };
      return countUpto(hi) - countUpto(lo - 1);
    }
