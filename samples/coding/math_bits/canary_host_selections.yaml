expected_concepts:
  - "binomial coefficient C(n, k) = n! / (k! (n - k)!)"
  - "precomputed factorial table modulo a prime"
  - "modular inverse via Fermat's little theorem and fast exponentiation"
  - "inverse factorials computed backwards in O(n)"
  - "overflow-safe modular multiplication"
optimal_complexity: {time: "O(N + q + log MOD) where N = max(hosts)", space: "O(N)"}
rubric:
  excellent: "Precomputes factorials and inverse factorials up to max(hosts) once (one Fermat exponentiation, then a backward pass), answers each query in O(1), guards k > n before indexing, and keeps every product within 64 bits."
  good: "Uses factorials with a modular inverse per query (O(log MOD) each) or needs a hint for the k > n guard or overflow."
  weak: "Computes the binomial with exact big integers or a Pascal triangle of size 10^5 by 10^5, or divides factorials modulo the prime without an inverse."
  criteria:
    correctness: "All tests pass, including k > n, k = 0 with an empty pool, and the largest central coefficient."
    efficiency: "Linear precomputation and constant time per query; a single modular exponentiation."
    code_quality: "Factorial tables are built once and the query loop is short; the modulus is a named constant."
    edge_cases: "Empty pool, canaries above the largest pool, k = n and symmetric queries."
    communication: "Explains why division is replaced by multiplication with an inverse and why the modulus being prime matters."
hints:
  - "The number of ways to pick k items out of n is a ratio of factorials. What goes wrong if you try to divide after reducing modulo 1,000,000,007?"
  - "Because 1,000,000,007 is prime, dividing by a value is the same as multiplying by its modular inverse, which fast exponentiation can compute. Since every query uses factorials up to at most 10^5, build the factorial table once."
  - "Build factorials up to the largest pool, compute the inverse of the largest factorial once by raising it to the power modulus minus two, then fill the inverse factorials downwards by multiplying by the next index each time. Each answer is the factorial of n times the inverse factorials of k and of n minus k, or zero when k exceeds n. Use 64-bit products reduced after every multiplication."
followups:
  - "How would you compute C(n, k) modulo a prime when n can be 10^18 but the prime is small (Lucas' theorem)?"
  - "What changes if the modulus were not prime, for example 10^9?"
  - "How would you count canary sets that must include at least one host from each of two availability zones?"
  - "Why is the backward pass for inverse factorials correct?"
common_errors:
  - "Indexing the factorial table with n - k or k when k > n, which reads a negative or out-of-range index."
  - "Dividing reduced factorials with integer division instead of multiplying by an inverse."
  - "Multiplying two residues in 32-bit integers (or JavaScript doubles) and losing precision."
  - "Recomputing factorials for every query, which is O(q * N)."
