prompt_markdown: |
  ## Canary Host Selections

  A release orchestrator rolls each new build out to a small set of **canary** hosts first. For rollout `i`,
  the target pool holds `hosts[i]` interchangeable hosts and the plan picks `canaries[i]` distinct hosts
  from it; only *which* hosts are picked matters, not the order in which they are picked.

  To size its randomised experiment schedule, the orchestrator needs, for every rollout, the number of
  different canary sets it could pick. These numbers are huge, so report each one **modulo
  1,000,000,007**.

  Return an array `result` with the same length as the inputs where `result[i]` is the number of ways to
  choose `canaries[i]` hosts out of `hosts[i]`, modulo `1_000_000_007`. Choosing `0` hosts can be done in
  exactly one way (even from an empty pool), and when `canaries[i] > hosts[i]` there are `0` ways.

  ### Example 1
  ```
  Input:  hosts = [5, 10, 3], canaries = [2, 3, 4]
  Output: [10, 120, 0]
  Explanation: 5 hosts give 10 pairs; 10 hosts give 120 sets of 3; 4 canaries cannot come from 3 hosts.
  ```

  ### Example 2
  ```
  Input:  hosts = [0, 7, 40], canaries = [0, 7, 20]
  Output: [1, 1, 846527861]
  Explanation: C(40, 20) = 137846528820, which is 846527861 modulo 1,000,000,007.
  ```

  ### Constraints
  - `1 <= hosts.length == canaries.length <= 10^4`
  - `0 <= hosts[i] <= 10^5`
  - `0 <= canaries[i] <= 10^5`

  **Follow-up:** many rollouts share the same large pools. Avoid recomputing products from scratch for
  every rollout.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_canary_selections
  params:
    - {name: hosts, type: "int[]"}
    - {name: canaries, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    MOD = 1_000_000_007


    def count_canary_selections(hosts: list[int], canaries: list[int]) -> list[int]:
        top = max(hosts)
        fact = [1] * (top + 1)
        for i in range(1, top + 1):
            fact[i] = fact[i - 1] * i % MOD
        inv_fact = [1] * (top + 1)
        inv_fact[top] = pow(fact[top], MOD - 2, MOD)  # Fermat: MOD is prime
        for i in range(top, 0, -1):
            inv_fact[i - 1] = inv_fact[i] * i % MOD
        result = []
        for n, k in zip(hosts, canaries):
            if k > n:
                result.append(0)
            else:
                result.append(fact[n] * inv_fact[k] % MOD * inv_fact[n - k] % MOD)
        return result
  javascript: |
    function countCanarySelections(hosts, canaries) {
      const MOD = 1000000007;
      // a * b can reach 10^18, beyond exact doubles, so split b into 16-bit halves.
      const mulMod = (a, b) => ((a * (b >>> 16)) % MOD * 65536 + a * (b & 65535)) % MOD;
      const powMod = (base, exp) => {
        let result = 1;
        base %= MOD;
        while (exp > 0) {
          if (exp & 1) result = mulMod(result, base);
          base = mulMod(base, base);
          exp = Math.floor(exp / 2);
        }
        return result;
      };
      const top = Math.max(...hosts);
      const fact = new Array(top + 1).fill(1);
      for (let i = 1; i <= top; i++) fact[i] = mulMod(fact[i - 1], i);
      const invFact = new Array(top + 1).fill(1);
      invFact[top] = powMod(fact[top], MOD - 2);
      for (let i = top; i > 0; i--) invFact[i - 1] = mulMod(invFact[i], i);
      return hosts.map((n, idx) => {
        const k = canaries[idx];
        if (k > n) return 0;
        return mulMod(mulMod(fact[n], invFact[k]), invFact[n - k]);
      });
    }
