expected_concepts:
  - "projecting a point onto a segment with the dot product"
  - "clamping the projection parameter to the segment [0, 1]"
  - "handling zero-length segments and single-point paths"
  - "comparing squared distances and taking one square root at the end"
optimal_complexity: {time: "O(k) where k = path.length", space: "O(1)"}
rubric:
  excellent: "Derives the projection parameter from the dot product, clamps it to [0, 1], handles zero-length segments and single-point paths explicitly, compares squared distances and explains floating-point care."
  good: "Correct segment distance after a hint about clamping or degenerate segments."
  weak: "Only measures distance to vertices, uses the infinite line instead of the segment, or divides by zero on repeated points."
  criteria:
    correctness: "Passes all tests, including points beyond segment ends, repeated vertices and a single-point path."
    efficiency: "Single pass over the segments with constant work each."
    code_quality: "A small helper for point-to-segment distance with clear variable names."
    edge_cases: "Zero-length segments, sensor on the pipeline, collinear points outside the segment and extreme coordinates."
    communication: "Explains what the projection parameter means geometrically and why it is clamped."
hints:
  - "Solve the problem for one straight segment first; the answer for the whole pipeline is the smallest of the per-segment answers. Note that the closest point is not always a vertex."
  - "For a segment from A to B, project the sensor onto the infinite line through A and B. The position of that projection can be written as A plus some fraction of the vector from A to B; if the fraction is outside the range zero to one, the closest point is the nearer endpoint instead."
  - "Compute the fraction as the dot product of (sensor minus A) with (B minus A), divided by the squared length of the segment, then clamp it into the range from zero to one. When the squared length is zero, treat the segment as the single point A. Build the closest point from the clamped fraction, keep the minimum squared distance over all segments and take its square root once at the end; a path with one point has no segments, so measure the distance to that point directly."
followups:
  - "How would you also return which segment and which point on it is closest?"
  - "If thousands of sensors query the same long pipeline, how would you avoid scanning every segment per query?"
  - "How would the computation change on real map coordinates given as latitude and longitude?"
common_errors:
  - "Measuring only the distances to vertices, which misses closest points in the middle of a segment."
  - "Using the distance to the infinite line without clamping the projection to the segment."
  - "Dividing by a zero squared length when two consecutive points coincide."
  - "Returning nothing (or infinity) for a single-point path because the segment loop never runs."
