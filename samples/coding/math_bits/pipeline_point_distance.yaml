slug: pipeline_point_distance
title: "Pipeline Point Distance"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [data_scientist, backend, mobile, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Pipeline Point Distance

  A leak sensor reports a reading at the point `(x, y)`. The pipeline it monitors is drawn on the site
  map as a polyline: `path[0], path[1], ..., path[k-1]`, where consecutive points are joined by straight
  segments. Consecutive points may coincide (a zero-length segment), and if the path contains a single
  point the pipeline is just that point.

  Return the **shortest Euclidean distance** from `(x, y)` to any point of the pipeline. That point may
  lie strictly inside a segment, not only at a vertex.

  Answers within `10^-6` (relative to `max(1, |expected|)`) of the exact value are accepted.

  ### Example 1
  ```
  Input:  path = [[0, 0], [10, 0]], x = 4, y = 3
  Output: 3.0
  Explanation: the closest pipeline point is (4, 0), straight below the sensor.
  ```

  ### Example 2
  ```
  Input:  path = [[0, 0], [4, 0], [4, 4]], x = 7, y = 8
  Output: 5.0
  Explanation: projecting onto either segment lands outside it, so the closest point is the
  vertex (4, 4), at distance sqrt(3^2 + 4^2) = 5.
  ```

  ### Example 3
  ```
  Input:  path = [[2, 3]], x = -1, y = 7
  Output: 5.0
  Explanation: the pipeline is a single point, so the answer is the distance to (2, 3).
  ```

  ### Constraints
  - `1 <= path.length <= 10^4`
  - `path[i].length == 2`
  - `-10^4 <= path[i][0], path[i][1], x, y <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: distance_to_pipeline
  params:
    - {name: path, type: "int[][]"}
    - {name: x, type: "int"}
    - {name: y, type: "int"}
  return_type: "float"
  comparison: float_tolerance
  tolerance: 1.0e-6
reference_solutions:
  python: |

    import math


    def distance_to_pipeline(path: list[list[int]], x: int, y: int) -> float:
        if len(path) == 1:
            return math.hypot(path[0][0] - x, path[0][1] - y)
        best_sq = math.inf
        for (ax, ay), (bx, by) in zip(path, path[1:]):
            dx, dy = bx - ax, by - ay
            length_sq = dx * dx + dy * dy
            if length_sq == 0:
                t = 0.0
            else:
                t = ((x - ax) * dx + (y - ay) * dy) / length_sq
                t = max(0.0, min(1.0, t))
            px = ax + t * dx
            py = ay + t * dy
            best_sq = min(best_sq, (x - px) ** 2 + (y - py) ** 2)
        return math.sqrt(best_sq)
  javascript: |

    function distanceToPipeline(path, x, y) {
      if (path.length === 1) return Math.hypot(path[0][0] - x, path[0][1] - y);
      let bestSq = Infinity;
      for (let i = 0; i + 1 < path.length; i++) {
        const [ax, ay] = path[i];
        const [bx, by] = path[i + 1];
        const dx = bx - ax;
        const dy = by - ay;
        const lengthSq = dx * dx + dy * dy;
        let t = 0;
        if (lengthSq !== 0) {
          t = ((x - ax) * dx + (y - ay) * dy) / lengthSq;
          t = Math.max(0, Math.min(1, t));
        }
        const px = ax + t * dx;
        const py = ay + t * dy;
        const d = (x - px) * (x - px) + (y - py) * (y - py);
        if (d < bestSq) bestSq = d;
      }
      return Math.sqrt(bestSq);
    }
