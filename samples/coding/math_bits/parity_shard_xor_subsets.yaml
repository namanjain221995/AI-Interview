expected_concepts:
  - "XOR as addition of bit vectors over GF(2)"
  - "linear (XOR) basis built by Gaussian elimination on bits"
  - "rank of the shard set and reachability of the target"
  - "counting solutions as 2^(n - rank)"
  - "64-bit result for up to 2^50 subsets"
optimal_complexity: {time: "O(n * B) with B = 30 bits", space: "O(B)"}
rubric:
  excellent: "Recognises XOR as vector addition over GF(2), builds a linear basis, tests whether the target reduces to zero, justifies the 2^(n - rank) count with a bijection argument and returns a 64-bit value."
  good: "Builds a correct basis and reaches the 2^(n - rank) formula with some prompting, or uses a correct but slower meet-in-the-middle approach and explains why brute force fails."
  weak: "Enumerates all subsets, counts distinct XOR values instead of subsets, or forgets that the empty subset reaches 0."
  criteria:
    correctness: "Passes all tests, including target 0, repeated fingerprints and unreachable targets."
    efficiency: "Linear in the number of shards times the bit width; no exponential enumeration."
    code_quality: "Basis insertion and target reduction are clearly separated and the basis slots are indexed by leading bit."
    edge_cases: "Counts the empty subset for target 0, handles all-zero shards (answer 2^n) and duplicate fingerprints."
    communication: "Explains why each dependent shard doubles the number of solutions once one solution exists."
hints:
  - "Think of every fingerprint as a vector of 30 bits where XOR is addition. Which questions about subsets become questions about the span of those vectors?"
  - "Reduce the shards to a small set of independent vectors (a basis) by repeatedly cancelling the highest set bit. The target is reachable exactly when it can be reduced to zero using that basis."
  - "Keep one basis slot per leading bit: insert each shard by XOR-ing away its leading bit with existing slots until it lands in an empty slot or becomes zero, and count the slots used as the rank. If the target reduces to zero, each of the n minus rank shards that did not add a slot can be included or not freely, giving 2 to the power of (n minus rank) subsets; otherwise the answer is 0."
followups:
  - "How would you return one subset of positions that reaches the target?"
  - "How would you find the maximum XOR any subset can produce?"
  - "What changes if shards arrive one at a time and you must answer after each arrival?"
  - "How would you count subsets of size exactly k with XOR equal to the target, and why is that much harder?"
common_errors:
  - "Counting distinct XOR values or distinct fingerprints instead of subsets of positions."
  - "Forgetting the empty subset when the target is 0."
  - "Returning 2^rank instead of 2^(n - rank)."
  - "Using a 32-bit integer for a result that can reach 2^50."
  - "Trying a DP over all 2^30 XOR values, which needs too much memory."
