slug: parity_shard_xor_subsets
title: "Parity Shard XOR Subsets"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, security, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Parity Shard XOR Subsets

  A backup cluster keeps `n` parity shards, each summarised by a 30-bit fingerprint `shards[i]`.
  During a restore drill the operator wants to know how many ways there are to rebuild a lost block
  whose fingerprint is `target`: a rebuild picks any **subset of shard positions** and combines the
  picked fingerprints with bitwise XOR.

  Return the number of subsets of positions `{0, 1, ..., n - 1}` whose XOR equals `target`.

  - Subsets are counted by **position**, so two shards with the same fingerprint are different
    choices.
  - The **empty subset** is allowed and has XOR `0`, so it counts when `target` is `0`.
  - Return `0` when no subset reaches `target`.

  ### Example 1
  ```
  Input:  shards = [3, 5, 6], target = 6
  Output: 2
  Explanation: {6} and {3, 5} both XOR to 6 (3 XOR 5 = 6).
  ```

  ### Example 2
  ```
  Input:  shards = [7, 7, 7], target = 7
  Output: 4
  Explanation: any single shard (3 ways) or all three shards together.
  ```

  ### Example 3
  ```
  Input:  shards = [1, 2, 4], target = 8
  Output: 0
  Explanation: bit 3 never appears in any shard.
  ```

  ### Constraints
  - `1 <= shards.length <= 50`
  - `0 <= shards[i] < 2^30`
  - `0 <= target < 2^30`
  - The answer can be as large as `2^50`; use a 64-bit result.

  **Follow-up:** enumerating all `2^n` subsets is far too slow for `n = 50`. Can you answer in
  `O(n * 30)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_xor_subsets
  params:
    - {name: shards, type: "int[]"}
    - {name: target, type: int}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_xor_subsets(shards: list[int], target: int) -> int:
        # basis[bit] holds a reduced vector whose highest set bit is `bit` (0 = empty slot)
        basis = [0] * 30
        rank = 0
        for value in shards:
            x = value
            for bit in range(29, -1, -1):
                if not (x >> bit) & 1:
                    continue
                if basis[bit] == 0:
                    basis[bit] = x
                    rank += 1
                    break
                x ^= basis[bit]
        # target is reachable iff it reduces to 0 against the basis
        x = target
        for bit in range(29, -1, -1):
            if (x >> bit) & 1 and basis[bit]:
                x ^= basis[bit]
        if x != 0:
            return 0
        # every one of the n - rank dependent shards can be toggled freely
        return 1 << (len(shards) - rank)
  javascript: |
    function countXorSubsets(shards, target) {
      const basis = new Array(30).fill(0);
      let rank = 0;
      for (const value of shards) {
        let x = value;
        for (let bit = 29; bit >= 0; bit--) {
          if (((x >> bit) & 1) === 0) continue;
          if (basis[bit] === 0) {
            basis[bit] = x;
            rank++;
            break;
          }
          x ^= basis[bit];
        }
      }
      let x = target;
      for (let bit = 29; bit >= 0; bit--) {
        if (((x >> bit) & 1) === 1 && basis[bit] !== 0) x ^= basis[bit];
      }
      if (x !== 0) return 0;
      return Math.pow(2, shards.length - rank);
    }
