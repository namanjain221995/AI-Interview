version: 1
slug: map_tile_morton_index
title: "Map Tile Morton Index"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, mobile, data, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Map Tile Morton Index

  A map service caches rendered tiles in a key-value store. To keep tiles that are close on the map
  close in the store, each tile at column `x` and row `y` is stored under a **Z-order key** built by
  interleaving the bits of the two coordinates:

  - bit `i` of `x` becomes bit `2i` of the key (the even positions), and
  - bit `i` of `y` becomes bit `2i + 1` of the key (the odd positions).

  Bit `0` is the least significant bit. Given `x` and `y`, return the key.

  Both coordinates are below `2^24`, so the key is below `2^48`. That is larger than 32 bits: languages
  whose bitwise operators work on 32-bit values need 64-bit integers or plain arithmetic to build it.

  ### Example 1
  ```
  Input:  x = 3, y = 5
  Output: 39
  Explanation: x = 011 and y = 101 in binary. Interleaving from bit 0 upwards gives
  x0=1, y0=1, x1=1, y1=0, x2=0, y2=1, which is binary 100111 = 39.
  ```

  ### Example 2
  ```
  Input:  x = 0, y = 1
  Output: 2
  Explanation: Bit 0 of y lands on bit 1 of the key.
  ```

  ### Example 3
  ```
  Input:  x = 6, y = 0
  Output: 20
  Explanation: x = 110, so bits 1 and 2 of x move to bits 2 and 4 of the key: 4 + 16 = 20.
  ```

  ### Constraints
  - `0 <= x < 2^24`
  - `0 <= y < 2^24`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: morton_index
  params:
    - {name: x, type: "int"}
    - {name: y, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def morton_index(x: int, y: int) -> int:
        key = 0
        for i in range(24):
            key |= ((x >> i) & 1) << (2 * i)
            key |= ((y >> i) & 1) << (2 * i + 1)
        return key
  javascript: |
    function mortonIndex(x, y) {
      // x and y fit in 24 bits, so reading their bits with >> is safe, but the key can reach 2^48:
      // build it with multiplication and addition instead of 32-bit bitwise operators.
      let key = 0;
      let weight = 1; // 2^(2i)
      for (let i = 0; i < 24; i += 1) {
        key += ((x >> i) & 1) * weight;
        key += ((y >> i) & 1) * weight * 2;
        weight *= 4;
      }
      return key;
    }
tests:
  - {id: t1, args: [3, 5], expected: 39, description: "Example 1"}
  - {id: t2, args: [0, 1], expected: 2, description: "Example 2 - y bit lands on an odd position"}
  - {id: t3, args: [6, 0], expected: 20, description: "Example 3 - x bits only"}
  - {id: t4, hidden: true, args: [0, 0], expected: 0, description: "Origin tile maps to key 0"}
  - {id: t5, hidden: true, args: [16777215, 16777215], expected: 281474976710655, description: "Both coordinates at the maximum - key is 2^48 - 1 (needs more than 32 bits)"}
  - {id: t6, hidden: true, args: [16777215, 0], expected: 93824992236885, description: "Only x bits set - every even bit of the 48-bit key"}
  - {id: t7, hidden: true, args: [0, 16777215], expected: 187649984473770, description: "Only y bits set - every odd bit, top bit 47 above 32-bit range"}
  - {id: t8, hidden: true, args: [8388608, 8388608], expected: 211106232532992, description: "Single highest bit in each coordinate - bits 46 and 47"}
  - {id: t9, hidden: true, args: [65535, 32768], expected: 3579139413, description: "Bit 15 of y lands on bit 31 - signed 32-bit overflow pitfall"}
  - {id: t10, hidden: true, args: [11259375, 1193046], expected: 77298043811453, description: "Mixed bit patterns in both coordinates"}
expected_concepts:
  - "bit extraction with shifts and masks"
  - "bit interleaving (Z-order / Morton codes)"
  - "64-bit integers versus 32-bit bitwise operators"
  - "locality-preserving keys for spatial data"
optimal_complexity: {time: "O(b) for b = 24 bits (or O(log b) with magic-number spreading)", space: "O(1)"}
rubric:
  excellent: "Loops over the 24 bit positions placing x bits on even and y bits on odd positions, uses a 64-bit type (or arithmetic in JavaScript) so keys above 2^32 are exact, verifies the example by hand and can describe the mask-and-shift spreading trick."
  good: "Correct interleaving that needs a prompt about the 32-bit limit, or swaps even and odd positions once before fixing it."
  weak: "Concatenates x and y instead of interleaving, puts y on the even bits, or overflows a 32-bit integer for large coordinates."
  criteria:
    correctness: "All tests pass, including the maximum coordinates whose key is 2^48 - 1."
    efficiency: "Constant work per bit (24 iterations) or a constant number of mask operations."
    code_quality: "The mapping from bit i to positions 2i and 2i + 1 is obvious from the code."
    edge_cases: "Zero coordinates, maximum coordinates, a single high bit and keys that cross bit 31."
    communication: "Explains why interleaving keeps nearby tiles close and where 32-bit arithmetic breaks."
hints:
  - "Look at one bit position at a time. Where does bit i of x end up in the key, and where does bit i of y end up?"
  - "Loop over the 24 bit positions, read bit i of each coordinate and place it at its target position in the key. The key can be as large as 2^48, so make sure the type and operations you use can hold it."
  - "For each i from 0 to 23, take bit i of x and add it at position 2i, then take bit i of y and add it at position 2i plus 1. In Java, Go and C-family languages build the key in a 64-bit integer and shift a 64-bit one; in JavaScript multiply by powers of two instead of shifting, because its bitwise operators truncate to 32 bits."
followups:
  - "How would you compute the key in a constant number of operations using mask-and-shift spreading?"
  - "How would you decode a key back into x and y?"
  - "Why do range queries over Z-order keys sometimes need to visit tiles outside the requested rectangle?"
common_errors:
  - "Building the key in a 32-bit int, which overflows as soon as bit 31 or higher is set."
  - "Using JavaScript bitwise OR or shift on the key, which silently truncates it to 32 bits."
  - "Swapping the roles of x and y (y on the even bits)."
  - "Concatenating y above x instead of interleaving the bits."
