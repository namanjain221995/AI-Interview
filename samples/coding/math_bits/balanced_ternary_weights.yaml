version: 1
slug: balanced_ternary_weights
title: "Balanced Ternary Calibration Weights"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## Balanced Ternary Calibration Weights

  A test bench calibrates force sensors by producing an exact **signed offset**. Its rig has exactly
  one weight of each power of three: `1, 3, 9, 27, ...` units. Every weight is placed in one of three
  states:

  - `+` - on the positive pan (adds its value to the offset),
  - `-` - on the negative pan (subtracts its value),
  - `0` - left off the rig.

  Given the required offset `load`, return the placement as a string, **heaviest weight first**: the
  last character describes the 1-unit weight, the one before it the 3-unit weight, and so on, so that
  the sum of `digit * 3^position` (position counted from the right, starting at `0`, with `+` = 1,
  `-` = -1, `0` = 0) equals `load`.

  The placement is unique once leading `0` characters are removed, and the answer must have **no
  leading `0`**. For `load = 0` return `"0"`.

  ### Example 1
  ```
  Input:  load = 5
  Output: "+--"
  Explanation: +9 - 3 - 1 = 5, so the 9 goes on the positive pan and the 3 and the 1 go on
  the negative pan.
  ```

  ### Example 2
  ```
  Input:  load = -7
  Output: "-+-"
  Explanation: -9 + 3 - 1 = -7.
  ```

  ### Example 3
  ```
  Input:  load = 0
  Output: "0"
  Explanation: no weight is needed; zero is written as a single "0".
  ```

  ### Constraints
  - `-10^9 <= load <= 10^9`
  - The answer contains only the characters `+`, `0` and `-`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: balance_weights
  params:
    - {name: load, type: "int"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |

    def balance_weights(load: int) -> str:
        if load == 0:
            return "0"
        digits: list[str] = []
        n = load
        while n != 0:
            remainder = n % 3
            if remainder == 0:
                digits.append("0")
            elif remainder == 1:
                digits.append("+")
                n -= 1
            else:
                digits.append("-")
                n += 1
            n //= 3
        return "".join(reversed(digits))
  javascript: |

    function balanceWeights(load) {
      if (load === 0) return "0";
      const digits = [];
      let n = load;
      while (n !== 0) {
        const remainder = ((n % 3) + 3) % 3;
        if (remainder === 0) {
          digits.push("0");
        } else if (remainder === 1) {
          digits.push("+");
          n -= 1;
        } else {
          digits.push("-");
          n += 1;
        }
        n /= 3;
      }
      return digits.reverse().join("");
    }
tests:
  - {id: t1, args: [5], expected: "+--", description: "Example 1 - positive load needing negative digits"}
  - {id: t2, args: [-7], expected: "-+-", description: "Example 2 - negative load"}
  - {id: t3, args: [0], expected: "0", description: "Example 3 - zero load returns a single 0"}
  - {id: t4, hidden: true, args: [1], expected: "+", description: "Smallest positive load"}
  - {id: t5, hidden: true, args: [-1], expected: "-", description: "Smallest negative load"}
  - {id: t6, hidden: true, args: [2], expected: "+-", description: "Remainder 2 needs a carry into the next weight"}
  - {id: t7, hidden: true, args: [13], expected: "+++", description: "All three weights on the positive pan"}
  - {id: t8, hidden: true, args: [387420489], expected: "+000000000000000000", description: "Exact power of three (3^18) - interior zeros must be kept"}
  - {id: t9, hidden: true, args: [581130733], expected: "+++++++++++++++++++", description: "(3^19 - 1) / 2 - nineteen plus signs, longest all-positive pattern"}
  - {id: t10, hidden: true, args: [1000000000], expected: "+0--+-0+-00+-+0+000+", description: "Upper bound 10^9 - needs the 3^19 weight"}
  - {id: t11, hidden: true, args: [-1000000000], expected: "-0++-+0-+00-+-0-000-", description: "Lower bound -10^9 - mirror image of the upper bound, negative modulo handling"}
expected_concepts:
  - "balanced ternary representation with digits -1, 0 and +1"
  - "repeated division by three with a carry when the remainder is 2"
  - "handling negative numbers (modulo of a negative value)"
  - "producing digits least significant first and reversing"
optimal_complexity: {time: "O(log |load|)", space: "O(log |load|)"}
rubric:
  excellent: "Derives balanced ternary from ordinary base 3: remainder 2 becomes a minus digit with a carry, handles negative loads with a non-negative remainder (or by symmetry), avoids leading zeros and explains why the representation is unique."
  good: "Correct conversion for positive loads, needing a hint for negative values or the remainder-2 carry."
  weak: "Brute-forces all 3^k placements, emits plain base-3 digits including 2, or mishandles negative numbers and zero."
  criteria:
    correctness: "Passes every test, including zero, negative loads, exact powers of three and both bounds."
    efficiency: "Logarithmic number of steps; no search over placements."
    code_quality: "Clear mapping from remainder to symbol and an explicit carry step."
    edge_cases: "Zero, plus or minus one, interior zeros and language-specific behaviour of the remainder operator on negative values."
    communication: "Explains why each step leaves an exact multiple of three for the next weight."
hints:
  - "Look only at the 1-unit weight first: whatever the other weights do, they always add a multiple of three. What does that tell you about the state of the 1-unit weight?"
  - "The remainder of the load modulo three fixes the lightest weight: remainder 0 means off, remainder 1 means positive pan, and remainder 2 is best treated as minus one, which pushes an extra unit onto the next heavier weight. After fixing that weight, the rest of the load is a multiple of three."
  - "Repeat: take the non-negative remainder of the current load modulo three, record a zero, plus or minus symbol for it, adjust the load by that digit so it becomes divisible by three, and divide it by three. Stop when the load reaches zero, then reverse the recorded symbols. Treat a load of zero as a special case and be careful with how your language computes the remainder of a negative number."
followups:
  - "How would you convert a placement string back into the load it produces?"
  - "How would you add two loads directly in balanced ternary without converting to integers?"
  - "Why can every integer be balanced with one weight of each power of three, but not with powers of two?"
common_errors:
  - "Using the language remainder operator on negative values (JavaScript, Java, Go and C++ return a negative remainder) without normalising it."
  - "Emitting a 2 digit instead of a minus digit with a carry."
  - "Returning an empty string for load 0 or leaving a leading 0."
  - "Dropping interior zeros for exact powers of three."
