expected_concepts:
  - "convex hull with Andrew's monotone chain or Graham scan"
  - "orientation test with the integer cross product"
  - "excluding collinear boundary points (pop on cross <= 0)"
  - "deduplicating points and handling degenerate inputs"
  - "rotating the output to the required starting corner"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Implements monotone chain or Graham scan with an integer cross product, removes duplicates, drops collinear points with the correct comparison, handles single-point and collinear inputs, rotates to the specified start and states O(n log n)."
  good: "Gets a correct hull for general inputs and fixes collinear or duplicate handling, or the start rotation, after testing."
  weak: "Uses floating-point angles with wrong tie handling, keeps collinear points, returns clockwise order, or fails on all-collinear input."
  criteria:
    correctness: "Passes all tests, including duplicates, collinear edges, all-identical points and all-collinear points."
    efficiency: "Sorting plus a linear scan; no O(n^2) or O(nh) loops at n = 10^4."
    code_quality: "Cross product helper with a documented sign convention; lower and upper chains built symmetrically."
    edge_cases: "Single point, repeated points, vertical and horizontal collinear sets, ties for the lowest y."
    communication: "Explains why popping on a non-left turn removes both right turns and collinear points."
hints:
  - "A point is a corner only if the fence turns there. How can you tell, using integer arithmetic only, whether three points make a left turn, a right turn or go straight?"
  - "Sort the distinct points by x then y and build the lower and upper halves of the boundary separately, keeping each half as a stack that must always turn the same way."
  - "Use the cross product of (b - a) and (c - b): while the last two stack points and the new point do not make a strict left turn (cross <= 0), pop. Join the lower chain and the reversed-pass upper chain without repeating their endpoints, then rotate the list so it starts at the corner with the lowest y and then lowest x. Handle the one-distinct-point case before the scan."
followups:
  - "How would you also report the fence length (perimeter) and enclosed area exactly?"
  - "What changes if collinear posts on the edges must be included in order?"
  - "How would you maintain the hull as new equipment points arrive one at a time?"
  - "How would you find the two equipment points that are farthest apart?"
common_errors:
  - "Popping only on cross < 0, which keeps collinear points on the fence."
  - "Not removing duplicate points, which creates repeated or zero-length edges."
  - "Returning the monotone chain's natural start (lowest x) instead of the lowest-y corner."
  - "Returning both chains with their shared endpoints repeated."
  - "Using atan2 angles, which mishandles ties and collinear points."
