prompt_markdown: |
  ## Fence Post Convex Hull

  A site crew must fence in every piece of equipment on a construction yard. Equipment positions are
  integer points `points[i] = [x, y]` (several pieces may share a position). The fence is the
  tightest convex boundary around all points, and a post is needed only where the fence **turns**.

  Return the post positions: the **strict corners** of the convex hull.

  - Points lying on a straight fence segment between two corners are **not** posts.
  - List the posts in **counter-clockwise** order, starting from the post with the **lowest `y`**,
    breaking ties by the **lowest `x`**. Each post appears once.
  - If all points are the same position, return that single point.
  - If all points lie on one straight line, return its two endpoints, starting with the one that
    has the lowest `y` (then lowest `x`).

  ### Example 1
  ```
  Input:  points = [[0, 0], [4, 0], [4, 4], [0, 4], [2, 2], [2, 0], [4, 2]]
  Output: [[0, 0], [4, 0], [4, 4], [0, 4]]
  Explanation: [2, 0] and [4, 2] sit on straight segments and [2, 2] is inside.
  ```

  ### Example 2
  ```
  Input:  points = [[3, 1], [1, 1], [5, 3], [2, 2], [3, 5], [1, 4], [3, 1]]
  Output: [[1, 1], [3, 1], [5, 3], [3, 5], [1, 4]]
  Explanation: [1, 1] and [3, 1] share the lowest y, so the start is [1, 1]; the duplicate [3, 1] is listed once.
  ```

  ### Example 3
  ```
  Input:  points = [[2, 7], [0, 1], [1, 4], [3, 10]]
  Output: [[0, 1], [3, 10]]
  Explanation: all points are collinear, so only the two endpoints are posts.
  ```

  ### Constraints
  - `1 <= points.length <= 10^4`
  - `points[i].length == 2`
  - `-10^4 <= x, y <= 10^4`

  **Follow-up:** can you do it in `O(n log n)` time using only integer arithmetic?
languages: [python, javascript, typescript, java, go, cpp]
