reference_solutions:
  python: |
    def fence_posts(points: list[list[int]]) -> list[list[int]]:
        pts = sorted(set(map(tuple, points)))
        if len(pts) == 1:
            return [list(pts[0])]

        def cross(o, a, b) -> int:
            # > 0: o -> a -> b turns left (counter-clockwise)
            return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0])

        # Andrew's monotone chain; popping on cross <= 0 drops collinear points
        lower: list[tuple[int, int]] = []
        for p in pts:
            while len(lower) >= 2 and cross(lower[-2], lower[-1], p) <= 0:
                lower.pop()
            lower.append(p)
        upper: list[tuple[int, int]] = []
        for p in reversed(pts):
            while len(upper) >= 2 and cross(upper[-2], upper[-1], p) <= 0:
                upper.pop()
            upper.append(p)
        hull = lower[:-1] + upper[:-1]  # counter-clockwise, starts at the lowest-x point
        start = min(range(len(hull)), key=lambda i: (hull[i][1], hull[i][0]))
        hull = hull[start:] + hull[:start]
        return [list(p) for p in hull]
  javascript: |
    function fencePosts(points) {
      const seen = new Set();
      const pts = [];
      for (const [x, y] of points) {
        const key = x + ',' + y;
        if (!seen.has(key)) {
          seen.add(key);
          pts.push([x, y]);
        }
      }
      pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      if (pts.length === 1) return [pts[0]];
      const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
      const lower = [];
      for (const p of pts) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
        lower.push(p);
      }
      const upper = [];
      for (let i = pts.length - 1; i >= 0; i--) {
        const p = pts[i];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
        upper.push(p);
      }
      const hull = lower.slice(0, -1).concat(upper.slice(0, -1));
      let start = 0;
      for (let i = 1; i < hull.length; i++) {
        if (hull[i][1] < hull[start][1] || (hull[i][1] === hull[start][1] && hull[i][0] < hull[start][0])) start = i;
      }
      return hull.slice(start).concat(hull.slice(0, start));
    }
