expected_concepts:
  - "shoelace formula for polygon area"
  - "absolute value makes the result independent of orientation"
  - "gcd of coordinate differences counts grid points on an edge"
  - "Pick's theorem relating area, boundary and interior points"
  - "64-bit integer arithmetic without floating point"
optimal_complexity: {time: "O(n log C) where C is the coordinate range", space: "O(1)"}
rubric:
  excellent: "Computes twice the area with the shoelace formula in exact integers, takes the absolute value for orientation, counts boundary points as the sum of gcds of edge deltas, derives the interior with Pick's theorem and explains why each corner is counted once."
  good: "Gets area and boundary right but needs a hint to recall or rearrange Pick's theorem, or fixes an orientation sign after testing."
  weak: "Scans grid points in the bounding box, uses floating-point area, or counts each corner twice on the boundary."
  criteria:
    correctness: "All tests pass, including clockwise input, collinear corners and the largest square."
    efficiency: "One pass over the corners with a gcd per edge."
    code_quality: "Integer-only arithmetic, clear names for the shoelace sum and boundary count, wrap-around edge handled with a modulo."
    edge_cases: "Clockwise order, collinear consecutive corners, negative coordinates and results above 2^31."
    communication: "States Pick's theorem and why gcd counts the grid steps along an edge."
hints:
  - "Treat the three numbers separately. The area of a polygon given by its corners has a classic closed formula, and the number of grid points on a straight segment depends only on its horizontal and vertical extent."
  - "The shoelace formula sums cross products of consecutive corners to get twice the signed area. A segment from one grid point to another passes through as many grid steps as the greatest common divisor of its absolute x and y differences. A theorem connects area, boundary points and interior points for grid polygons."
  - "Walk the corners once, including the edge from the last corner back to the first. Add each shoelace cross term and the gcd of each edge's absolute deltas, which counts the edge's grid points without its starting corner, so every corner is counted exactly once. Take the absolute value of the shoelace sum as twice the area, then use Pick's theorem: interior equals twice the area minus the boundary count plus two, all divided by two."
followups:
  - "How would you check that the corners really describe a simple polygon?"
  - "How would you compute the area of a polygon whose corners are not on the integer grid without losing precision?"
  - "How would you test whether a single survey marker lies inside, outside or on the boundary of a parcel?"
  - "Why does Pick's theorem fail for polygons with holes, and how would you adjust it?"
common_errors:
  - "Forgetting the closing edge from the last corner back to the first."
  - "Returning a negative area for clockwise input instead of taking the absolute value."
  - "Adding gcd + 1 per edge, which counts every corner twice."
  - "Using floating-point area and rounding, or 32-bit integers for the cross products."
