reference_solutions:
  python: |
    from math import gcd


    def parcel_lattice_stats(vertices: list[list[int]]) -> list[int]:
        n = len(vertices)
        cross_sum = 0
        boundary = 0
        for i in range(n):
            x1, y1 = vertices[i]
            x2, y2 = vertices[(i + 1) % n]
            cross_sum += x1 * y2 - x2 * y1          # shoelace term
            boundary += gcd(abs(x2 - x1), abs(y2 - y1))  # grid points on the edge, excluding its start
        twice_area = abs(cross_sum)
        # Pick's theorem: area = interior + boundary / 2 - 1
        interior = (twice_area - boundary + 2) // 2
        return [twice_area, boundary, interior]
  javascript: |
    function parcelLatticeStats(vertices) {
      const gcd = (a, b) => { while (b) { [a, b] = [b, a % b]; } return a; };
      const n = vertices.length;
      // Partial shoelace sums can exceed 2^53 with 10^4 corners near 10^6, so use BigInt.
      let crossSum = 0n;
      let boundary = 0;
      for (let i = 0; i < n; i++) {
        const [x1, y1] = vertices[i];
        const [x2, y2] = vertices[(i + 1) % n];
        crossSum += BigInt(x1) * BigInt(y2) - BigInt(x2) * BigInt(y1);
        boundary += gcd(Math.abs(x2 - x1), Math.abs(y2 - y1));
      }
      const twiceArea = crossSum < 0n ? -crossSum : crossSum;
      const interior = (twiceArea - BigInt(boundary) + 2n) / 2n;
      return [Number(twiceArea), boundary, Number(interior)];
    }
