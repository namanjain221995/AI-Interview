prompt_markdown: |
  ## Land Parcel Lattice Stats

  A land-survey service stores each parcel as a polygon whose corners sit on an integer survey grid (one
  grid step is one metre). `vertices[i] = [x, y]` is the `i`-th corner; the corners are listed in order
  around the boundary, either clockwise or counter-clockwise, and the last corner connects back to the
  first. The boundary never crosses or touches itself, all corners are distinct, the parcel has a positive
  area, and consecutive corners may lie on one straight line.

  Survey markers can only be placed on grid points (points with integer coordinates). For capacity
  planning the service needs three numbers about each parcel. Return them as an array of 64-bit integers
  `[twice_area, boundary_points, interior_points]` where:

  - `twice_area` is **twice** the parcel's area (always an integer for grid polygons);
  - `boundary_points` is the number of grid points lying on the boundary, corners included;
  - `interior_points` is the number of grid points strictly inside the parcel.

  ### Example 1
  ```
  Input:  vertices = [[0, 0], [4, 0], [4, 3], [0, 3]]
  Output: [24, 14, 6]
  Explanation: A 4 x 3 rectangle has area 12, 14 grid points on its edges and 3 * 2 = 6 inside.
  ```

  ### Example 2
  ```
  Input:  vertices = [[0, 0], [0, 5], [5, 0]]
  Output: [25, 15, 6]
  Explanation: The corners are listed clockwise. Area 12.5, 5 grid steps per edge give 15 boundary points,
  and the 6 points with x > 0, y > 0, x + y < 5 are inside.
  ```

  ### Constraints
  - `3 <= vertices.length <= 10^4`
  - `vertices[i].length == 2`
  - `-10^6 <= x, y <= 10^6`
  - The polygon is simple (non-self-intersecting) with positive area.

  **Follow-up:** counting grid points one by one inside a 2,000,000 x 2,000,000 box is far too slow. Can
  you get all three numbers in one pass over the corners?
languages: [python, javascript, typescript, java, go, cpp]
