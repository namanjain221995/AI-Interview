version: 1
slug: bounded_product_pairs
title: "Bounded Product Pairs"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data_analyst, business_analyst, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Bounded Product Pairs

  A pricing engine explores order configurations as pairs `(quantity, unit_price)` of **positive
  integers**. A configuration is affordable when `quantity * unit_price <= budget`. Pairs are ordered:
  `(2, 3)` and `(3, 2)` are different configurations.

  Given `budget`, return **how many affordable configurations** exist.

  `budget` can be as large as `10^12`, so iterating over every quantity is too slow. Aim for roughly
  `O(sqrt(budget))` time.

  ### Example 1
  ```
  Input:  budget = 4
  Output: 8
  Explanation: Quantity 1 allows prices 1-4, quantity 2 allows 1-2, quantities 3 and 4 allow price 1: 4 + 2 + 1 + 1.
  ```

  ### Example 2
  ```
  Input:  budget = 1
  Output: 1
  Explanation: Only (1, 1) is affordable.
  ```

  ### Example 3
  ```
  Input:  budget = 10
  Output: 27
  Explanation: 10 + 5 + 3 + 2 + 2 + 1 + 1 + 1 + 1 + 1 = 27.
  ```

  ### Constraints
  - `1 <= budget <= 10^12`
  - The answer fits in a signed 64-bit integer (it is below `3 * 10^13`).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_order_combinations
  params:
    - {name: budget, type: "long"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_order_combinations(budget: int) -> int:
        total = 0
        quantity = 1
        while quantity <= budget:
            max_price = budget // quantity  # affordable unit prices for this quantity
            # every quantity up to `last` allows the same number of unit prices
            last = budget // max_price
            total += max_price * (last - quantity + 1)
            quantity = last + 1
        return total
  javascript: |
    function countOrderCombinations(budget) {
      // budget <= 10^12 < 2^53, so Math.floor of the quotients is exact
      let total = 0;
      let quantity = 1;
      while (quantity <= budget) {
        const maxPrice = Math.floor(budget / quantity);
        const last = Math.floor(budget / maxPrice); // same quotient up to here
        total += maxPrice * (last - quantity + 1);
        quantity = last + 1;
      }
      return total;
    }
tests:
  - {id: t1, args: [4], expected: 8, description: "Example 1"}
  - {id: t2, args: [1], expected: 1, description: "Example 2 - minimum budget"}
  - {id: t3, args: [10], expected: 27, description: "Example 3"}
  - {id: t4, hidden: true, args: [2], expected: 3, description: "Budget 2: (1, 1), (1, 2), (2, 1)"}
  - {id: t5, hidden: true, args: [100], expected: 482, description: "Perfect square budget, block boundary at sqrt"}
  - {id: t6, hidden: true, args: [999983], expected: 13969705, description: "Prime budget near 10^6"}
  - {id: t7, hidden: true, args: [10000000000], expected: 231802823220, description: "Perfect square 10^10 (answer above 2^31)"}
  - {id: t8, hidden: true, args: [999999999999], expected: 27785452448917, description: "Budget just below the upper bound"}
  - {id: t9, hidden: true, args: [1000000000000], expected: 27785452449086, description: "Upper bound 10^12 (O(budget) loop times out)"}
  - {id: t10, hidden: true, args: [123456789012], expected: 3172047919142, description: "Large non-square budget with many distinct quotient blocks"}
expected_concepts:
  - "the count equals the sum over quantities of floor(budget / quantity)"
  - "the quotient takes only O(sqrt(budget)) distinct values"
  - "grouping quantities into blocks of equal quotient"
  - "alternatively the hyperbola (Dirichlet) method: 2 * sum up to sqrt minus sqrt squared"
  - "64-bit arithmetic"
optimal_complexity: {time: "O(sqrt(budget))", space: "O(1)"}
rubric:
  excellent: "Reduces the count to a sum of floor(budget / q), explains why the quotient has O(sqrt(budget)) distinct values, jumps over equal-quotient blocks (or uses the symmetric hyperbola formula), keeps 64-bit arithmetic and states the complexity."
  good: "Reaches the floor-sum formulation and the block or hyperbola idea with a hint; minor off-by-one fixed after testing."
  weak: "Loops over every quantity (O(budget)), double counts or misses ordered pairs, or overflows 32-bit integers."
  criteria:
    correctness: "All tests pass, including budget 1, perfect squares and the 10^12 upper bound."
    efficiency: "About 2 sqrt(budget) iterations at most."
    code_quality: "Block start, block end and quotient are clearly named; loop advances past each block."
    edge_cases: "Budget 1 and 2, perfect squares where the two halves meet, and very large budgets."
    communication: "Explains why the quotient changes only O(sqrt(budget)) times or why the pairs are symmetric about the square root."
hints:
  - "Fix the quantity. How many unit prices are affordable for it? Add that up and you have a correct but slow solution."
  - "The number of affordable prices for a quantity is the budget divided by the quantity, rounded down. Many consecutive quantities give exactly the same value; there are only about two times the square root of the budget distinct values."
  - "Start at quantity 1. Compute the quotient of the budget by the current quantity, then the largest quantity that still gives that same quotient (the budget divided by the quotient). Add the quotient times the length of that block and jump to the quantity just after it. Repeat until you pass the budget, using 64-bit integers."
followups:
  - "Can you derive the hyperbola formula that sums only up to the square root and corrects for double counting?"
  - "How would you count unordered pairs instead of ordered ones?"
  - "How would you count triples (a, b, c) with a * b * c at most the budget?"
  - "What if the quantity were capped at a maximum order size?"
common_errors:
  - "Iterating over every quantity up to the budget, which is O(budget) and too slow."
  - "Computing the end of a block incorrectly, which double counts or skips quantities."
  - "Counting only unordered pairs (or only pairs with quantity at most unit price)."
  - "Using 32-bit integers for the running total."
