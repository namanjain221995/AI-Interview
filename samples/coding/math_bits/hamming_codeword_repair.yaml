slug: hamming_codeword_repair
title: "Hamming Codeword Repair"
difficulty: medium
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [network, backend, platform, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Hamming Codeword Repair

  A telemetry radio link protects each frame with a **Hamming code**. A received codeword is a string
  of `'0'` and `'1'` characters, and its positions are numbered from **1**:

  - positions that are powers of two (`1, 2, 4, 8, ...`) hold **parity bits**;
  - every other position holds a **data bit**, in the original order.

  The sender chose the parity bits so that the XOR of the positions of all `'1'` bits in the codeword is
  `0`. During transmission **at most one** bit (parity or data) may have been flipped.

  The **syndrome** is the XOR of the positions of all `'1'` bits in the received word: `0` means the word
  arrived intact, otherwise it is exactly the position of the flipped bit. Repair the word and return
  **only the data bits**, in order of increasing position.

  ### Example 1
  ```
  Input:  codeword = "0110001"
  Output: "1011"
  Explanation: the bits set to 1 sit at positions 2, 3 and 7, and 2 XOR 3 XOR 7 = 6, so
  position 6 was flipped. The repaired word is 0110011; its data positions 3, 5, 6, 7
  hold 1, 0, 1, 1.
  ```

  ### Example 2
  ```
  Input:  codeword = "1010101000"
  Output: "110100"
  Explanation: the XOR of the positions holding a 1 is 0, so nothing was flipped. Data
  positions are 3, 5, 6, 7, 9 and 10.
  ```

  ### Constraints
  - `3 <= codeword.length <= 2047`
  - `codeword` contains only `'0'` and `'1'`
  - `codeword` is a valid codeword with at most one bit flipped, so a non-zero syndrome always points
    inside the word.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: decode_hamming
  params:
    - {name: codeword, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |

    def decode_hamming(codeword: str) -> str:
        syndrome = 0
        for position, bit in enumerate(codeword, start=1):
            if bit == "1":
                syndrome ^= position
        bits = list(codeword)
        if syndrome:
            bits[syndrome - 1] = "1" if bits[syndrome - 1] == "0" else "0"
        data = []
        for position, bit in enumerate(bits, start=1):
            if position & (position - 1):
                data.append(bit)
        return "".join(data)
  javascript: |

    function decodeHamming(codeword) {
      let syndrome = 0;
      for (let position = 1; position <= codeword.length; position++) {
        if (codeword[position - 1] === "1") syndrome ^= position;
      }
      const bits = codeword.split("");
      if (syndrome !== 0) bits[syndrome - 1] = bits[syndrome - 1] === "0" ? "1" : "0";
      const data = [];
      for (let position = 1; position <= bits.length; position++) {
        if ((position & (position - 1)) !== 0) data.push(bits[position - 1]);
      }
      return data.join("");
    }
tests:
  - {id: t1, args: ["0110001"], expected: "1011", description: "Example 1 - data bit at position 6 flipped"}
  - {id: t2, args: ["1010101000"], expected: "110100", description: "Example 2 - 10-bit word received intact"}
  - {id: t3, hidden: true, args: ["111"], expected: "1", description: "Shortest word (length 3), no error"}
  - {id: t4, hidden: true, args: ["110"], expected: "1", description: "Shortest word with its only data bit flipped"}
  - {id: t5, hidden: true, args: ["0100110"], expected: "0110", description: "Parity bit at position 1 flipped - data already correct"}
  - {id: t6, hidden: true, args: ["0001000"], expected: "0000", description: "All-zero data with the position-4 parity bit flipped"}
  - {id: t7, hidden: true, args: ["101000101000"], expected: "10011001", description: "Shortened 12-bit word, last position flipped"}
  - {id: t8, hidden: true, args: ["111011111111"], expected: "11111111", description: "All-ones data, parity bit 8 flipped"}
  - {id: t9, hidden: true, args: ["1000110010000010101111110110101"], expected: "01101000001101111110110001", description: "Full 31-bit word, data error near the end"}
  - {id: t10, hidden: true, args: [""], expected: "", description: "Stress: 600-bit word with a data bit flipped just past parity position 512"}
expected_concepts:
  - "syndrome as the XOR of the positions of set bits"
  - "power-of-two positions as parity positions"
  - "single-bit error correction by flipping the indicated position"
  - "1-indexed positions versus 0-indexed strings"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Computes the syndrome in one pass, flips the indicated bit when it is non-zero, filters out power-of-two positions with a bit test, keeps 1-based and 0-based indexing straight and explains why the syndrome names the flipped position."
  good: "Correct decoder after a hint about indexing or about which positions are parity bits."
  weak: "Computes each parity group separately with nested loops and gets them wrong, returns the whole codeword, or treats positions as 0-indexed."
  criteria:
    correctness: "Passes all tests, including errors in parity bits, the shortest word and shortened codes."
    efficiency: "Linear in the codeword length."
    code_quality: "Clear helper or expression for the power-of-two test; no duplicated parity-group code."
    edge_cases: "No error, error in a parity bit, error at the last position and a word whose length is not 2^k - 1."
    communication: "Explains why flipping position p changes the syndrome by exactly p."
hints:
  - "Write down the positions of every 1 bit in a correct codeword and combine them with XOR; the result is zero by construction. Ask yourself what flipping the bit at position p does to that XOR."
  - "Flipping one bit either adds or removes its position from the XOR, so the XOR of the received word is either zero or the position of the damaged bit. Once you know the position you can repair it, and then you only need to drop the parity positions."
  - "Walk the string once, XOR-ing the 1-based position of every 1 bit into a running syndrome. If the syndrome is non-zero, invert the bit at that 1-based position (index syndrome minus one in the string). Then walk the positions again and keep only those that are not powers of two, which you can test by checking that the position has more than one set bit."
followups:
  - "How would you add one overall parity bit to detect (but not correct) two flipped bits?"
  - "How would you write the matching encoder that places data bits and computes the parity bits?"
  - "What happens if two bits are flipped, and why can the decoder make things worse?"
common_errors:
  - "Using 0-based positions when computing the syndrome, which points one place off."
  - "Returning the parity bits along with the data bits."
  - "Treating position 1 or 2 as a data bit because the power-of-two test is wrong for small values."
  - "Recomputing each parity check with nested loops and mixing up which positions each one covers."
