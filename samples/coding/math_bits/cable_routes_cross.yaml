reference_solutions:
  python: |
    def cables_cross(a: list[int], b: list[int]) -> bool:
        p1, p2 = (a[0], a[1]), (a[2], a[3])
        q1, q2 = (b[0], b[1]), (b[2], b[3])

        def orientation(o, u, v):
            # Sign of the cross product (u - o) x (v - o): 1 left turn, -1 right turn, 0 collinear.
            cross = (u[0] - o[0]) * (v[1] - o[1]) - (u[1] - o[1]) * (v[0] - o[0])
            return (cross > 0) - (cross < 0)

        def within_box(s, t, p):
            # For a point p collinear with segment s-t: is p between s and t?
            return min(s[0], t[0]) <= p[0] <= max(s[0], t[0]) and min(s[1], t[1]) <= p[1] <= max(s[1], t[1])

        d1 = orientation(p1, p2, q1)
        d2 = orientation(p1, p2, q2)
        d3 = orientation(q1, q2, p1)
        d4 = orientation(q1, q2, p2)
        if d1 * d2 < 0 and d3 * d4 < 0:
            return True  # proper crossing: each run separates the other's endpoints
        # Remaining cases share a point only if some endpoint lies on the other run.
        if d1 == 0 and within_box(p1, p2, q1):
            return True
        if d2 == 0 and within_box(p1, p2, q2):
            return True
        if d3 == 0 and within_box(q1, q2, p1):
            return True
        if d4 == 0 and within_box(q1, q2, p2):
            return True
        return False
  javascript: |
    function cablesCross(a, b) {
      const p1 = [a[0], a[1]], p2 = [a[2], a[3]];
      const q1 = [b[0], b[1]], q2 = [b[2], b[3]];
      // Products stay below 2^53 for coordinates up to 10^6, so plain numbers are exact.
      const orientation = (o, u, v) => Math.sign((u[0] - o[0]) * (v[1] - o[1]) - (u[1] - o[1]) * (v[0] - o[0]));
      const withinBox = (s, t, p) =>
        Math.min(s[0], t[0]) <= p[0] && p[0] <= Math.max(s[0], t[0]) &&
        Math.min(s[1], t[1]) <= p[1] && p[1] <= Math.max(s[1], t[1]);
      const d1 = orientation(p1, p2, q1);
      const d2 = orientation(p1, p2, q2);
      const d3 = orientation(q1, q2, p1);
      const d4 = orientation(q1, q2, p2);
      if (d1 * d2 < 0 && d3 * d4 < 0) return true; // proper crossing
      if (d1 === 0 && withinBox(p1, p2, q1)) return true;
      if (d2 === 0 && withinBox(p1, p2, q2)) return true;
      if (d3 === 0 && withinBox(q1, q2, p1)) return true;
      if (d4 === 0 && withinBox(q1, q2, p2)) return true;
      return false;
    }
