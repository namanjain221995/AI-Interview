prompt_markdown: |
  ## Cable Routes Cross

  A data-centre floor planner lays network cables as straight runs on an integer floor grid. A run is given
  as `[x1, y1, x2, y2]`: it goes in a straight line from `(x1, y1)` to `(x2, y2)`, both endpoints included.
  A run whose two endpoints coincide is a single **floor box** at that point.

  Before two runs are approved, the planner checks for conflicts. Return `true` if runs `a` and `b` share
  **at least one point**, and `false` otherwise. Sharing a point includes crossing, one run ending on the
  other, two runs meeting at an endpoint, and two runs lying on the same line with overlapping parts.

  All inputs are integers; decide the answer **exactly** (floating-point line intersection can misjudge
  runs that only touch).

  ### Example 1
  ```
  Input:  a = [0, 0, 4, 4], b = [0, 4, 4, 0]
  Output: true
  Explanation: The runs cross at (2, 2).
  ```

  ### Example 2
  ```
  Input:  a = [0, 0, 4, 4], b = [5, 5, 8, 8]
  Output: false
  Explanation: Both runs lie on the line y = x, but a ends at (4, 4) before b starts at (5, 5).
  ```

  ### Example 3
  ```
  Input:  a = [0, 0, 4, 0], b = [4, 0, 4, 3]
  Output: true
  Explanation: The runs meet at their shared endpoint (4, 0).
  ```

  ### Constraints
  - `a.length == b.length == 4`
  - `-10^6 <= every coordinate <= 10^6`
  - A run may have zero length (both endpoints equal).
languages: [python, javascript, typescript, java, go, cpp]
signature:
