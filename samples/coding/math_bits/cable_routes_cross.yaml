expected_concepts:
  - "orientation test with the sign of a cross product"
  - "general case: each run's endpoints lie on opposite sides of the other"
  - "collinear special cases with a bounding-box (on-segment) check"
  - "zero-length runs handled by the same checks"
  - "exact integer arithmetic instead of floating point"
optimal_complexity: {time: "O(1)", space: "O(1)"}
rubric:
  excellent: "Uses four orientation tests to detect a proper crossing, then covers every touching and collinear case with on-segment checks, explains why the box check is valid only for collinear points, handles zero-length runs without special code and keeps the arithmetic exact."
  good: "Gets proper crossings right and most touching cases, needing a test or hint for collinear overlaps or zero-length runs."
  weak: "Computes the intersection of infinite lines with floating-point division, ignores collinear overlap, or divides by zero for parallel or vertical runs."
  criteria:
    correctness: "All tests pass, including collinear overlap, T-junctions, zero-length runs and near-parallel runs at the coordinate limits."
    efficiency: "Constant time with a handful of integer multiplications."
    code_quality: "Small named helpers for orientation and on-segment checks; no duplicated branches for each special case."
    edge_cases: "Shared endpoints, vertical runs, collinear gaps, zero-length runs and large coordinates."
    communication: "Explains what the sign of the cross product means and why the collinear cases need a separate check."
hints:
  - "Avoid computing where two lines meet. Instead ask, for each run, on which side of it the endpoints of the other run lie."
  - "The sign of a cross product tells you whether a point is to the left of, to the right of, or on the line through a run. Two runs cross properly when each run has the other's endpoints on opposite sides. What is left over are cases where some point is exactly on a line."
  - "Compute the four orientations of each run's endpoints relative to the other run. If both pairs have strictly opposite signs, the runs cross. Otherwise, for every orientation that is zero, check whether that endpoint lies within the bounding box of the other run, which for a collinear point means it lies on the run. Return true if any of those checks succeeds and false otherwise."
followups:
  - "How would you return the intersection point (or overlapping part) instead of a boolean?"
  - "Given 10^5 cable runs, how would you report whether any two of them conflict faster than checking every pair?"
  - "What would change if the coordinates were up to 10^9 in a language with 64-bit integers?"
  - "How would you treat runs that only touch as allowed but crossings as conflicts?"
common_errors:
  - "Using slopes or floating-point intersection, which fails for vertical runs and misjudges touching runs."
  - "Ignoring collinear runs, so overlapping runs on the same line are reported as disjoint."
  - "Applying the bounding-box check without first confirming the point is collinear."
  - "Treating a zero-length run as an error or dividing by its length."
