time_limit_minutes: 15
prompt_markdown: |
  ## Rotary Encoder Gray Sequence

  An absolute rotary encoder reports its angle on `bits` parallel tracks. If two tracks changed at the
  same moment, a reading taken mid-transition could be wildly wrong, so the disc is printed with a code
  in which **neighbouring positions differ in exactly one bit**, including the wrap-around from the last
  position back to the first.

  The firmware team uses the standard **reflected** sequence, defined like this:

  - for `1` track the sequence is `[0, 1]`;
  - for `k + 1` tracks, take the sequence for `k` tracks, then append the same sequence in **reverse
    order** with the new highest bit (value `2^k`) added to each of those reversed entries.

  Return the full sequence for `bits` tracks as a list of `2^bits` integers in order.

  ### Example 1
  ```
  Input:  bits = 1
  Output: [0, 1]
  ```

  ### Example 2
  ```
  Input:  bits = 2
  Output: [0, 1, 3, 2]
  Explanation: [0, 1] followed by its reverse [1, 0] with 2 added to each entry gives [3, 2].
  ```

  ### Example 3
  ```
  Input:  bits = 3
  Output: [0, 1, 3, 2, 6, 7, 5, 4]
  Explanation: [0, 1, 3, 2] followed by its reverse with 4 added: [6, 7, 5, 4].
  ```

  ### Constraints
  - `1 <= bits <= 10`
  - The answer has exactly `2^bits` entries and is unique.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: encoder_sequence
  params:
    - {name: bits, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def encoder_sequence(bits: int) -> list[int]:
        sequence = [0, 1]
        for k in range(1, bits):
            high = 1 << k
            # Mirror the current sequence and set the new top bit on the mirrored half.
            sequence += [high | value for value in reversed(sequence)]
        return sequence
  javascript: |
    function encoderSequence(bits) {
      const sequence = [0, 1];
      for (let k = 1; k < bits; k++) {
        const high = 1 << k;
        for (let i = sequence.length - 1; i >= 0; i--) {
          sequence.push(high | sequence[i]);
        }
      }
      return sequence;
    }
