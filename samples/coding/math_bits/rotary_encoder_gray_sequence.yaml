expected_concepts:
  - "reflected binary Gray code"
  - "building a sequence iteratively from a smaller one"
  - "setting a bit with OR or addition of a power of two"
  - "closed-form alternative: position i maps to i XOR (i shifted right by one)"
optimal_complexity: {time: "O(2^n)", space: "O(2^n)"}
rubric:
  excellent: "Implements the reflection cleanly and iteratively, explains why the one-bit-change property holds at the seam and at the wrap-around, and recognises or derives the closed form i XOR (i >> 1) as an equivalent."
  good: "Correct reflection-based solution, possibly recursive with extra copying, with complexity stated correctly."
  weak: "Produces a sequence that violates the definition (for example plain binary counting), or mutates the list while iterating over it and duplicates entries."
  criteria:
    correctness: "All tests pass for every bits value; exactly 2^bits entries in the defined order."
    efficiency: "Linear in the output size; no repeated full copies inside nested loops."
    code_quality: "The mirror step is clear; avoids modifying a list while iterating it forward."
    edge_cases: "bits = 1 and the largest sizes."
    communication: "Explains why only one bit flips between the two halves and at the end of the sequence."
hints:
  - "Start from the one-track answer and grow it one track at a time, exactly as the definition describes."
  - "Each step keeps the current list as the first half and builds the second half by walking the current list backwards and setting the new highest bit on each value."
  - "Keep a list starting with zero and one; for every additional track k, read the existing entries from last to first and append each one with the bit worth two to the power k set, taking care to read only the entries that existed before this step began; after the last track the list is the answer."
followups:
  - "Can you produce the i-th entry directly without building the whole list?"
  - "Given a reading from the encoder, how would you convert it back to the position index?"
  - "Why does the sequence still satisfy the one-bit property at the wrap-around from the last entry to the first?"
common_errors:
  - "Iterating forwards over the list while appending to it, which never terminates or duplicates entries."
  - "Mirroring without setting the new high bit, which repeats values."
  - "Returning plain binary order, which flips several bits at once."
  - "Starting from an empty list and producing the wrong length for one track."
