expected_concepts:
  - "bitwise OR is monotone: extending a range only adds bits"
  - "at most 31 distinct OR values among ranges ending at one index"
  - "rolling set of OR values ending at the current position"
  - "global set of all values seen"
optimal_complexity: {time: "O(n * 30)", space: "O(n * 30) in the worst case for the result set"}
rubric:
  excellent: "Observes that OR values of ranges ending at a fixed index form a chain of at most 31 distinct values, carries that small set forward, collects everything in a global set and states O(n * 30) time."
  good: "Reaches the rolling-set idea after a hint, or gives an O(n^2) solution with early termination and a sound explanation of its limits."
  weak: "Enumerates every range with an inner loop recomputing the OR from scratch (O(n^3)), or counts ranges instead of distinct sets."
  criteria:
    correctness: "Passes all tests, including zero masks, repeated masks and the all-distinct worst case."
    efficiency: "Linear in n times the bit width; no quadratic enumeration of ranges."
    code_quality: "Clear separation between the per-index set and the global set."
    edge_cases: "Single role, the empty permission set and the largest 30-bit mask."
    communication: "Explains why the per-index set stays small (each new distinct value adds at least one bit)."
hints:
  - "Fix the right end of the range and move the left end further back. What can happen to the permission set as more roles are added, and how many times can it actually change?"
  - "Because adding roles can only add bits, the different permission sets of ranges ending at one role form a short chain, never more than about thirty different values. You can compute that chain for the next role from the chain of the current role."
  - "Keep a set of the different OR values of ranges that end at the previous role. For the next role, build a new set holding the role's own mask plus the OR of that mask with every value in the previous set, then add all of them to one global set of results. After the last role, the size of the global set is the answer."
followups:
  - "How would you return the minimum number of roles needed to reach each distinct set?"
  - "What changes if permissions are combined with AND (only rights shared by all roles) instead of OR?"
  - "How would you answer how many ranges produce exactly a given target permission set?"
common_errors:
  - "Recomputing the OR of each range from scratch, which is cubic."
  - "Counting ranges instead of distinct permission sets."
  - "Forgetting that a zero mask produces the empty set, which counts once."
  - "Mutating the per-index set while iterating over it."
