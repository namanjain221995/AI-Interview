title: "Distinct Window Permission Sets"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [security, backend, platform, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Distinct Window Permission Sets

  An access-control service keeps its roles in a fixed hierarchy order: `masks[0]` is the most junior
  role and `masks[n-1]` the most senior. Each role carries a **permission bitmask**: bit `b` is set when
  the role grants permission number `b`.

  Administrators can only grant a **contiguous range** of roles at once (for example roles 2 through 5).
  A user who receives roles `i..j` ends up with the bitwise OR of `masks[i], masks[i+1], ..., masks[j]`.

  Return how many **different** permission sets can be produced by granting one non-empty contiguous
  range of roles. A permission set with no bits at all (the value `0`) counts like any other set.

  ### Example 1
  ```
  Input:  masks = [1, 2, 4]
  Output: 6
  Explanation: the ranges give 1, 2, 4, 1|2 = 3, 2|4 = 6 and 1|2|4 = 7 - six different sets.
  ```

  ### Example 2
  ```
  Input:  masks = [6, 2, 4, 6]
  Output: 3
  Explanation: every range gives 6, 2 or 4 (for example 2|4 = 6 and 6|2 = 6), so only three
  different permission sets are possible.
  ```

  ### Constraints
  - `1 <= masks.length <= 5 * 10^4`
  - `0 <= masks[i] < 2^30`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: distinct_window_unions
  params:
    - {name: masks, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |

    def distinct_window_unions(masks: list[int]) -> int:
        all_unions: set[int] = set()
        ending_here: set[int] = set()
        for mask in masks:
            ending_here = {mask | previous for previous in ending_here}
            ending_here.add(mask)
            all_unions |= ending_here
        return len(all_unions)
  javascript: |

    function distinctWindowUnions(masks) {
      const allUnions = new Set();
      let endingHere = new Set();
      for (const mask of masks) {
        const next = new Set([mask]);
        for (const previous of endingHere) next.add(previous | mask);
        endingHere = next;
        for (const value of endingHere) allUnions.add(value);
      }
      return allUnions.size;
    }
