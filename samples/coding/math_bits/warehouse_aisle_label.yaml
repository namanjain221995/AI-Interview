slug: warehouse_aisle_label
title: Warehouse Aisle Label
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, frontend, fullstack, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Warehouse Aisle Label

  A distribution centre labels its aisles with uppercase letters only. The first 26 aisles are
  `A` to `Z`; after that come the two-letter labels `AA`, `AB`, ..., `AZ`, `BA`, ..., `ZZ`, then the
  three-letter labels starting at `AAA`, and so on. Every label of length `k` comes after all labels
  of length `k - 1`, and labels of the same length are in alphabetical order. There is no "zero"
  letter, so a label never has a blank or placeholder position.

  Given the 1-based aisle number `index`, return its label.

  ### Example 1
  ```
  Input:  index = 1
  Output: "A"
  ```

  ### Example 2
  ```
  Input:  index = 28
  Output: "AB"
  Explanation: Aisles 1 to 26 are A to Z, aisle 27 is AA and aisle 28 is AB.
  ```

  ### Example 3
  ```
  Input:  index = 703
  Output: "AAA"
  Explanation: Aisle 702 is ZZ, the last two-letter label.
  ```

  ### Constraints
  - `1 <= index <= 10^15`
  - Use 64-bit integers; the input does not fit in 32 bits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: aisle_label
  params:
    - {name: index, type: "long"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def aisle_label(index: int) -> str:
        letters: list[str] = []
        while index > 0:
            index -= 1  # shift so each position is 0..25
            index, offset = divmod(index, 26)
            letters.append(chr(ord("A") + offset))
        return "".join(reversed(letters))
  javascript: |
    function aisleLabel(index) {
      const letters = [];
      while (index > 0) {
        index -= 1; // shift so each position is 0..25
        letters.push(String.fromCharCode(65 + (index % 26)));
        index = Math.floor(index / 26);
      }
      return letters.reverse().join("");
    }
