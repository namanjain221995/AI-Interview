  - {id: t7, hidden: true, args: [53], expected: "BA", description: "BA - carry into the next letter"}
  - {id: t8, hidden: true, args: [702], expected: "ZZ", description: "ZZ - all Z two-letter label"}
  - {id: t9, hidden: true, args: [18278], expected: "ZZZ", description: "ZZZ - last three-letter label"}
  - {id: t10, hidden: true, args: [18279], expected: "AAAA", description: "AAAA - first four-letter label"}
  - {id: t11, hidden: true, args: [1000000000000000], expected: "GBDPXGRZXJL", description: "Maximum index 10^15 (needs 64-bit arithmetic)"}
expected_concepts:
  - "bijective base-26 numbering"
  - "subtracting one before each remainder"
  - "building the label from least significant letter"
  - "64-bit arithmetic"
optimal_complexity: {time: "O(log V)", space: "O(log V)"}
rubric:
  excellent: "Explains why plain base 26 fails (no zero letter), derives the subtract-one-then-divide step, verifies it on Z, AA and ZZ, and handles 64-bit inputs."
  good: "Correct conversion after testing boundary values such as 26 and 52 with a little help."
  weak: "Treats A as zero in ordinary base 26 so 26 becomes BA or 27 becomes BB, or special-cases a few lengths instead of a general loop."
  criteria:
    correctness: "All tests pass, including Z, AZ, ZZ, ZZZ and 10^15."
    efficiency: "One iteration per letter of the output."
    code_quality: "Clear loop with a named offset; no large lookup tables or length-specific branches."
    edge_cases: "Indexes that are multiples of 26 and the first label of each length."
    communication: "Explains the difference between bijective numbering and positional numbering with a zero digit."
hints:
  - "Compare the labels with ordinary base-26 numbers. What goes wrong if you treat A as zero, and where would aisle 26 end up?"
  - "There is no letter for zero, so every position holds a value from 1 to 26. Shifting the number down by one before taking each remainder maps it onto the usual 0 to 25 range."
  - "While the index is positive, subtract one, take the remainder modulo 26 to pick the letter (zero means A), collect it, and replace the index with the integer quotient of the reduced value by 26. Reverse the collected letters at the end to get the label."
followups:
  - "How would you convert a label such as ABZ back into its aisle number?"
  - "How many labels have exactly k letters?"
  - "What changes if the scheme skips the letters I and O to avoid confusion with digits?"
  - "How would you list the labels for a range of aisles efficiently?"
common_errors:
  - "Using plain base 26 with A as zero, which breaks at 26 and every multiple of 26."
  - "Forgetting to reverse the collected letters."
  - "Using 32-bit integers for the index."
  - "Producing an extra leading A by stopping the loop one step too late."
