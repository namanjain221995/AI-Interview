version: 1
slug: second_highest_salary
title: Second Highest Salary
difficulty: easy
competency_keys: [sql, databases]
role_tags: [backend, data, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Second Highest Salary

  Table `employee`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | name | VARCHAR(100) | |
  | salary | INTEGER | |

  Write a query that returns the **second highest distinct salary** as a single row with one column named
  `second_highest_salary`. If there is no second highest salary, the query must return one row containing
  `NULL`.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example
  ```
  employee
  +----+------+--------+
  | id | name | salary |
  +----+------+--------+
  | 1  | Ava  | 100    |
  | 2  | Ben  | 200    |
  | 3  | Cleo | 300    |
  +----+------+--------+

  Output
  +-----------------------+
  | second_highest_salary |
  +-----------------------+
  | 200                   |
  +-----------------------+
  ```
languages: [sql]
starter_code:
  sql: |
    -- Return one row with a column named second_highest_salary (NULL when it does not exist).
    SELECT salary AS second_highest_salary
    FROM employee;
reference_solutions:
  sql: |
    SELECT MAX(salary) AS second_highest_salary
    FROM employee
    WHERE salary < (SELECT MAX(salary) FROM employee);
sql_setup: |
  CREATE TABLE employee (
    id INTEGER PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    salary INTEGER NOT NULL
  );
tests:
  - id: t1
    description: Example - three distinct salaries
    setup_sql: "INSERT INTO employee (id, name, salary) VALUES (1, 'Ava', 100), (2, 'Ben', 200), (3, 'Cleo', 300);"
    expected_rows: [[200]]
  - id: t2
    description: Only one employee - NULL
    setup_sql: "INSERT INTO employee (id, name, salary) VALUES (1, 'Ava', 100);"
    expected_rows: [[null]]
  - id: t3
    hidden: true
    description: Top salary is duplicated
    setup_sql: "INSERT INTO employee (id, name, salary) VALUES (1, 'Ava', 300), (2, 'Ben', 300), (3, 'Cleo', 200);"
    expected_rows: [[200]]
  - id: t4
    hidden: true
    description: Everyone earns the same - NULL
    setup_sql: "INSERT INTO employee (id, name, salary) VALUES (1, 'Ava', 100), (2, 'Ben', 100);"
    expected_rows: [[null]]
  - id: t5
    hidden: true
    description: Empty table - still one row with NULL
    expected_rows: [[null]]
  - id: t6
    hidden: true
    description: Second salary is duplicated
    setup_sql: "INSERT INTO employee (id, name, salary) VALUES (1, 'Ava', 500), (2, 'Ben', 400), (3, 'Cleo', 400), (4, 'Dev', 100);"
    expected_rows: [[400]]
  - id: t7
    hidden: true
    description: Zero is a valid second salary
    setup_sql: "INSERT INTO employee (id, name, salary) VALUES (1, 'Ava', 0), (2, 'Ben', 50);"
    expected_rows: [[0]]
  - id: t8
    hidden: true
    description: Rows inserted in random salary order
    setup_sql: "INSERT INTO employee (id, name, salary) VALUES (1, 'A', 70), (2, 'B', 90), (3, 'C', 10), (4, 'D', 90), (5, 'E', 85), (6, 'F', 30);"
    expected_rows: [[85]]
expected_concepts:
  - DISTINCT values versus rows
  - scalar subquery or LIMIT/OFFSET
  - returning NULL when no row qualifies
  - aggregate over an empty set
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Handles duplicates and the missing-value case in one portable query (MAX with a subquery, or DISTINCT with LIMIT/OFFSET wrapped in a scalar subquery) and explains why an aggregate returns NULL on an empty set.
  good: Correct for distinct salaries but needs a hint for duplicates or for returning NULL instead of no rows.
  weak: Uses ORDER BY ... LIMIT 1 OFFSET 1 without DISTINCT or a wrapper, returning a duplicate top salary or zero rows.
  criteria:
    correctness: All tests pass, including empty tables and duplicate salaries.
    efficiency: One or two passes over the table; no self-join explosion.
    code_quality: Readable query with the required column alias.
    edge_cases: Empty table, single row, ties at the top and second place.
    communication: Explains the NULL behaviour of aggregates.
hints:
  - Think about what "second highest" means when two people share the top salary.
  - The second highest salary is the largest salary that is smaller than the overall maximum.
  - Use MAX(salary) filtered by salary < (SELECT MAX(salary) FROM employee); an aggregate over no rows returns NULL, which gives you the required single NULL row.
followups:
  - How would you generalise this to the N-th highest salary?
  - Which index would help this query on a very large table?
  - How would you return the second highest salary per department?
common_errors:
  - Using LIMIT 1 OFFSET 1 without DISTINCT, which returns the duplicated top salary.
  - Returning zero rows instead of a single NULL row when no second salary exists.
  - Forgetting the second_highest_salary column alias.
