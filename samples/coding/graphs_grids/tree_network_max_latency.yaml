expected_concepts:
  - "tree diameter with non-negative edge weights"
  - "two traversals: farthest node from any start, then farthest from that node"
  - "alternative single DFS keeping the two longest downward paths per node"
  - "iterative traversal to avoid recursion depth limits on long chains"
  - "64-bit accumulation of path sums"
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Builds an adjacency list, uses either the two-pass farthest-node technique (and can explain why it works with non-negative weights) or a post-order DP combining the two longest child paths, keeps sums in 64-bit, avoids recursion depth problems and states O(n)."
  good: "Correct linear solution with minor prompting on 64-bit sums, the single-node case or recursion depth."
  weak: "Runs a traversal from every node (O(n^2)), counts hops instead of latency, assumes node 0 is an end of the longest route, or overflows 32-bit integers."
  criteria:
    correctness: "All tests pass, including zero-latency links, a single device and sums above 2^31."
    efficiency: "Linear time; a quadratic all-pairs approach is identified as too slow for 10^5 devices."
    code_quality: "Adjacency list built once, traversal helper reused, clear naming of distances."
    edge_cases: "Single device, two devices, zero-weight links, long chains, stars where the answer joins the two heaviest spokes."
    communication: "Explains why the farthest node from an arbitrary start must be an endpoint of a longest route when weights are non-negative."
hints:
  - "Because the network is a tree, any two devices have a single route, so the task is to find the two devices that are farthest apart by total latency."
  - "Trying every device as a starting point works but is quadratic. Consider what you learn from the device that is farthest from an arbitrary starting device."
  - "Build an adjacency list, run an iterative DFS or BFS from device 0 summing latencies to find the farthest device, then run the same traversal again from that device and return the largest distance found, using 64-bit sums throughout."
followups:
  - "Prove why the two-pass method fails when some latencies are negative, and what still works."
  - "How would you also return the two devices at the ends of that route?"
  - "If links are added one at a time while the network stays a tree, can you maintain the answer incrementally?"
  - "For every device, how would you compute its own worst-case latency to any other device in linear time?"
common_errors:
  - "Assuming device 0 is an end of the longest route and returning a single traversal's maximum."
  - "Counting links instead of summing latencies."
  - "Accumulating sums in 32-bit integers."
  - "Recursive DFS that overflows the call stack on a long chain of devices."
