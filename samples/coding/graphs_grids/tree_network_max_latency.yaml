time_limit_minutes: 22
prompt_markdown: |
  ## Tree Network Maximum Latency

  A branch-office network has `n` devices numbered `0` to `n - 1`. They are wired as a **tree**: there are
  exactly `n - 1` links, every device can reach every other one, and there is exactly one route between
  any two devices. `links[i] = [u, v, ms]` says that devices `u` and `v` are joined by a link with a
  one-way latency of `ms` milliseconds in either direction.

  The latency between two devices is the sum of the link latencies along the unique route between them.
  Before signing off a capacity plan, the network team wants the **worst case**: return the largest
  latency between any pair of devices. With a single device there is no pair, so return `0`.

  ### Example 1
  ```
  Input:  n = 4, links = [[0, 1, 3], [1, 2, 4], [1, 3, 2]]
  Output: 7
  Explanation: The route 0 -> 1 -> 2 costs 3 + 4 = 7.
  ```

  ### Example 2
  ```
  Input:  n = 5, links = [[0, 1, 10], [0, 2, 1], [2, 3, 6], [2, 4, 7]]
  Output: 18
  Explanation: The route 1 -> 0 -> 2 -> 4 costs 10 + 1 + 7 = 18. Device 0 sits in the middle of it.
  ```

  ### Example 3
  ```
  Input:  n = 1, links = []
  Output: 0
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `links.length == n - 1` and `links[i].length == 3`
  - `0 <= u, v < n`, `u != v`, and the links form a tree.
  - `0 <= ms <= 10^9`, so the answer can exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_tree_latency
  params:
    - {name: n, type: int}
    - {name: links, type: "int[][]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def max_tree_latency(n: int, links: list[list[int]]) -> int:
        adj: list[list[tuple[int, int]]] = [[] for _ in range(n)]
        for u, v, ms in links:
            adj[u].append((v, ms))
            adj[v].append((u, ms))

        def farthest(src: int) -> tuple[int, int]:
            dist = [-1] * n
            dist[src] = 0
            stack = [src]
            best = src
            while stack:
                x = stack.pop()
                if dist[x] > dist[best]:
                    best = x
                for y, w in adj[x]:
                    if dist[y] == -1:
                        dist[y] = dist[x] + w
                        stack.append(y)
            return best, dist[best]

        end, _ = farthest(0)
        _, length = farthest(end)
        return length
  javascript: |
    function maxTreeLatency(n, links) {
      const adj = Array.from({ length: n }, () => []);
      for (const [u, v, ms] of links) {
        adj[u].push([v, ms]);
        adj[v].push([u, ms]);
      }
      const farthest = (src) => {
        const dist = new Array(n).fill(-1);
        dist[src] = 0;
        const stack = [src];
        let best = src;
        while (stack.length > 0) {
          const x = stack.pop();
          if (dist[x] > dist[best]) best = x;
          for (const [y, w] of adj[x]) {
            if (dist[y] === -1) {
              dist[y] = dist[x] + w;
              stack.push(y);
            }
          }
        }
        return [best, dist[best]];
      };
      const [end] = farthest(0);
      return farthest(end)[1];
    }
