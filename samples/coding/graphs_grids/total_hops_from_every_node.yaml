slug: total_hops_from_every_node
title: "Total Hops From Every Node"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [network, backend, data_scientist]
time_limit_minutes: 35
prompt_markdown: |
  ## Total Hops From Every Node

  A content-delivery team is choosing where to place a new cache. Its edge sites are numbered `0` to
  `n - 1` and are wired as a **tree**: `links` contains exactly `n - 1` two-way links `[a, b]`, and
  every site can reach every other site through exactly one chain of links. The **hop distance**
  between two sites is the number of links on that chain.

  To compare candidate placements, the team wants the total hop distance from each site to all the
  others. Return an array `totals` of length `n` where `totals[i]` is the **sum of hop distances from
  site `i` to every other site**. The totals can exceed the 32-bit range for large trees, so compute
  them as 64-bit integers.

  ### Example 1
  ```
  Input:  n = 5, links = [[0, 1], [1, 2], [1, 3], [3, 4]]
  Output: [8, 5, 8, 6, 9]
  Explanation: From site 1: 1 hop to 0, 1 to 2, 1 to 3 and 2 to 4, total 5.
               From site 4: 3 + 2 + 3 + 1 = 9.
  ```

  ### Example 2
  ```
  Input:  n = 1, links = []
  Output: [0]
  ```

  ### Example 3
  ```
  Input:  n = 4, links = [[2, 0], [2, 1], [2, 3]]
  Output: [5, 5, 3, 5]
  Explanation: Site 2 is the hub of a star; every other site is 1 hop from the hub
               and 2 hops from the remaining two sites.
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `links.length == n - 1`, `links[i].length == 2`, `0 <= a, b < n`, `a != b`
  - The links form a single tree (connected, no cycles).
  - The answer for a site can exceed `2^31 - 1`.

  **Follow-up:** an `O(n^2)` approach runs a search from every site. Can you reach `O(n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
