    - {name: links, type: "int[][]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def total_hops(n: int, links: list[list[int]]) -> list[int]:
        adj: list[list[int]] = [[] for _ in range(n)]
        for a, b in links:
            adj[a].append(b)
            adj[b].append(a)
        # iterative depth-first order from site 0; parents always come before children
        parent = [-1] * n
        order: list[int] = []
        seen = [False] * n
        seen[0] = True
        stack = [0]
        while stack:
            site = stack.pop()
            order.append(site)
            for nxt in adj[site]:
                if not seen[nxt]:
                    seen[nxt] = True
                    parent[nxt] = site
                    stack.append(nxt)
        size = [1] * n  # sites in each subtree
        below = [0] * n  # sum of distances from a site to the sites in its subtree
        for site in reversed(order):
            p = parent[site]
            if p != -1:
                size[p] += size[site]
                below[p] += below[site] + size[site]
        totals = [0] * n
        totals[0] = below[0]
        for site in order:
            p = parent[site]
            if p != -1:
                # moving from p to site: size[site] sites get 1 closer, the rest 1 further
                totals[site] = totals[p] - size[site] + (n - size[site])
        return totals
  javascript: |
    function totalHops(n, links) {
      const adj = Array.from({ length: n }, () => []);
      for (const [a, b] of links) {
        adj[a].push(b);
        adj[b].push(a);
      }
      const parent = new Array(n).fill(-1);
      const order = [];
      const seen = new Array(n).fill(false);
      seen[0] = true;
      const stack = [0];
      while (stack.length > 0) {
        const site = stack.pop();
        order.push(site);
        for (const next of adj[site]) {
          if (!seen[next]) {
            seen[next] = true;
            parent[next] = site;
            stack.push(next);
          }
        }
      }
      const size = new Array(n).fill(1);
      const below = new Array(n).fill(0);
      for (let i = order.length - 1; i >= 0; i--) {
        const site = order[i];
        const p = parent[site];
        if (p !== -1) {
          size[p] += size[site];
          below[p] += below[site] + size[site];
        }
      }
      const totals = new Array(n).fill(0);
      totals[0] = below[0];
      for (const site of order) {
        const p = parent[site];
        if (p !== -1) totals[site] = totals[p] - size[site] + (n - size[site]);
      }
      return totals;
    }
