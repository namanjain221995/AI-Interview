expected_concepts:
  - "rerooting (two-pass) dynamic programming on a tree"
  - "subtree sizes and subtree distance sums from a post-order pass"
  - "moving the root across one link changes the total by n minus twice the subtree size"
  - "iterative traversal to avoid recursion depth limits on long chains"
  - "64-bit accumulation of the totals"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Starts from the O(n^2) search-from-every-site baseline, derives the two-pass rerooting idea (subtree sizes and sums bottom-up, then each child's total from its parent's as parent total minus child size plus n minus child size), implements it iteratively and uses 64-bit totals; states O(n) time and space."
  good: "Reaches the rerooting formula with some prompting, or implements it recursively and acknowledges the recursion-depth risk on a long chain."
  weak: "Only runs a breadth-first search from every site, mixes up the plus and minus terms of the shift, or overflows 32-bit totals."
  criteria:
    correctness: "All tests pass, including a single site, stars, chains and unordered link directions."
    efficiency: "Linear: two passes over the tree instead of one search per site."
    code_quality: "Separate, well-named arrays for subtree size, subtree distance sum and final totals."
    edge_cases: "Handles n equal to 1, links listed child-first and very deep trees."
    communication: "Explains with a picture why exactly size[child] sites get one hop closer when the viewpoint moves to the child."
hints:
  - "Computing the answer for one site is easy with a single search. Ask how the answer changes when you move from a site to one of its neighbours."
  - "Root the tree anywhere. Count how many sites live in each subtree, and the sum of distances from the root to everything; then think about which sites get closer and which get further when you step across one link."
  - "Do a bottom-up pass that records each subtree's size and the distance sum inside it, which gives the root's total. Then go top-down: the child's total equals the parent's total, minus the child's subtree size (those sites get one hop closer), plus the count of all other sites (they get one hop further). Use an explicit stack and 64-bit sums."
followups:
  - "How would you return the single best site for the cache, breaking ties by the lowest id?"
  - "If each link had a latency in milliseconds instead of counting as one hop, what changes?"
  - "How would you handle a forest of several separate trees?"
  - "Which site minimises the maximum distance instead of the total, and how would you find it?"
common_errors:
  - "Running a separate breadth-first search from every site, which is O(n^2) and times out at 10^5 sites."
  - "Recursing on a chain of 10^5 sites and hitting the recursion limit."
  - "Assuming each link is written parent-first instead of building an undirected adjacency list."
  - "Swapping the terms when moving the root, so the total grows for sites that should get closer."
  - "Storing totals in 32-bit integers in Java, Go or C++."
