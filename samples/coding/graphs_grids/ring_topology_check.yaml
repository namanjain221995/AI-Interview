expected_concepts:
  - "degree counting on an undirected graph"
  - "normalising undirected edges to detect duplicates"
  - "connectivity check with BFS, DFS or union-find"
  - "why degree two everywhere plus connectivity implies one cycle"
optimal_complexity: {time: "O(n + m)", space: "O(n + m)"}
rubric:
  excellent: "Rejects wrong cable counts, self-loops and duplicate cables (normalising direction), checks every degree is two, verifies connectivity with one traversal or union-find, and explains why these conditions together characterise a single ring."
  good: "Checks degrees and connectivity correctly but needs a prompt about duplicates written in opposite directions or self-loops."
  weak: "Only checks degrees (accepting two separate rings) or only checks connectivity (accepting chords), or compares directed pairs so [a, b] and [b, a] are not seen as duplicates."
  criteria:
    correctness: "All tests pass, including disconnected rings, duplicates in both directions and self-loops."
    efficiency: "Linear in switches plus cables with a single traversal."
    code_quality: "Each condition is a clear, separate check with early returns."
    edge_cases: "Empty cable list, smallest ring of three, chords and shuffled large rings."
    communication: "Explains why every switch having degree two means the graph is a union of cycles and connectivity leaves exactly one."
hints:
  - "Think about what is true of every switch in a ring and what is true of the network as a whole."
  - "Two local conditions and one global condition are needed: each switch has exactly two distinct neighbours, no cable is repeated or loops back to its own switch, and every switch is reachable from switch zero."
  - "Store each cable with the smaller label first in a set to catch repeats and self-loops, build neighbour lists and require exactly two neighbours per switch, then run one breadth-first or depth-first search from switch zero and check that it reaches all n switches."
followups:
  - "How would you return the switches in ring order if the plan is valid?"
  - "How would you check that the network forms a single line (a path) instead of a ring?"
  - "With union-find, how could you detect the ring property while reading cables as a stream?"
common_errors:
  - "Checking only that every degree is two, which accepts several disjoint rings."
  - "Treating [a, b] and [b, a] as different cables, so a duplicated cable passes the degree check."
  - "Forgetting that a self-loop adds two to a switch's degree."
  - "Walking the ring from switch zero without a visited set and looping forever on malformed input."
