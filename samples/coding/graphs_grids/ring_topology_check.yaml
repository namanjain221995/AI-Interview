title: "Ring Topology Check"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [network, general, sre]
time_limit_minutes: 15
prompt_markdown: |
  ## Ring Topology Check

  A data-centre network team is auditing a cabling plan for `n` switches labelled `0` to `n - 1`. Each
  pair `[a, b]` in `links` is one physical cable between switches `a` and `b`; cables are bidirectional,
  so `[a, b]` and `[b, a]` describe the same connection.

  The design requires a **single ring**: starting at any switch and following cables you pass through all
  `n` switches exactly once and return to the start. Concretely, the plan is a valid ring if and only if:

  - no cable connects a switch to itself,
  - no two cables connect the same pair of switches,
  - every switch has **exactly two** cables, and
  - all switches are connected to one another (one ring, not several separate ones).

  Return `true` if `links` forms such a ring and `false` otherwise.

  ### Example 1
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [2, 3], [3, 0]]
  Output: true
  Explanation: 0 - 1 - 2 - 3 - 0 visits every switch once.
  ```

  ### Example 2
  ```
  Input:  n = 6, links = [[0, 1], [1, 2], [2, 0], [3, 4], [4, 5], [5, 3]]
  Output: false
  Explanation: Every switch has two cables, but switches 0-2 and 3-5 form two separate rings.
  ```

  ### Example 3
  ```
  Input:  n = 3, links = [[0, 1], [1, 2]]
  Output: false
  Explanation: Switches 0 and 2 have only one cable each.
  ```

  ### Constraints
  - `3 <= n <= 10^4`
  - `0 <= links.length <= 2 * 10^4`
  - `links[i].length == 2` and `0 <= links[i][0], links[i][1] < n`
  - `links` may contain self-loops or repeated cables; detecting them is part of the task.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_ring
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def is_ring(n: int, links: list[list[int]]) -> bool:
        if len(links) != n:
            return False
        neighbours: list[list[int]] = [[] for _ in range(n)]
        seen_cables: set[tuple[int, int]] = set()
        for a, b in links:
            if a == b:
                return False
            cable = (min(a, b), max(a, b))
            if cable in seen_cables:
                return False
            seen_cables.add(cable)
            neighbours[a].append(b)
            neighbours[b].append(a)
        if any(len(adjacent) != 2 for adjacent in neighbours):
            return False
        visited = [False] * n
        visited[0] = True
        reached = 1
        to_visit = [0]
        while to_visit:
            switch = to_visit.pop()
            for other in neighbours[switch]:
                if not visited[other]:
                    visited[other] = True
                    reached += 1
                    to_visit.append(other)
        return reached == n
  javascript: |
    function isRing(n, links) {
      if (links.length !== n) return false;
      const neighbours = Array.from({ length: n }, () => []);
      const seenCables = new Set();
      for (const [a, b] of links) {
        if (a === b) return false;
        const key = Math.min(a, b) * n + Math.max(a, b);
        if (seenCables.has(key)) return false;
        seenCables.add(key);
        neighbours[a].push(b);
        neighbours[b].push(a);
      }
      if (neighbours.some((adjacent) => adjacent.length !== 2)) return false;
      const visited = new Array(n).fill(false);
      visited[0] = true;
      let reached = 1;
      const toVisit = [0];
      while (toVisit.length > 0) {
        const sw = toVisit.pop();
        for (const other of neighbours[sw]) {
          if (!visited[other]) {
            visited[other] = true;
            reached++;
            toVisit.push(other);
          }
        }
      }
      return reached === n;
    }
