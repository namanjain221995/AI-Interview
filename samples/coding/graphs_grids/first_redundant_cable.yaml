title: First Redundant Cable
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [network, backend, general]
time_limit_minutes: 20
prompt_markdown: |
  ## First Redundant Cable

  A field team is cabling a new office network with `n` hosts labelled `0` to `n - 1`. The installation
  log `cables` lists the cables in the order they were pulled; each entry `[u, v]` is a
  **bidirectional** cable between hosts `u` and `v`.

  A cable is **redundant** if, at the moment it is installed, its two ends were already connected
  through the cables installed before it (directly or through other hosts). A cable whose two ends
  are the same host is also redundant.

  Return the **first** redundant cable in installation order, exactly as it is written in the log
  (do not reorder its two ends). If no cable is redundant, return an empty list.

  ### Example 1
  ```
  Input:  n = 4, cables = [[0, 1], [1, 2], [2, 0], [2, 3]]
  Output: [2, 0]
  Explanation: Hosts 2 and 0 are already connected through 1 when the third cable is installed.
  ```

  ### Example 2
  ```
  Input:  n = 5, cables = [[0, 1], [3, 4], [1, 2]]
  Output: []
  Explanation: Every cable joins two previously separate groups of hosts.
  ```

  ### Example 3
  ```
  Input:  n = 5, cables = [[4, 3], [1, 0], [3, 2], [0, 4], [2, 4], [1, 3]]
  Output: [2, 4]
  Explanation: After the first four cables all hosts are connected, so [2, 4] is the first redundant cable; [1, 3] comes later.
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `0 <= cables.length <= 2 * 10^5`
  - `cables[i].length == 2` and `0 <= cables[i][0], cables[i][1] < n`

  **Follow-up:** aim for close to constant amortised time per cable.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_redundant_cable
  params:
    - {name: n, type: "int"}
    - {name: cables, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def first_redundant_cable(n: int, cables: list[list[int]]) -> list[int]:
        parent = list(range(n))
        size = [1] * n

        def find(host: int) -> int:
            while parent[host] != host:
                parent[host] = parent[parent[host]]
                host = parent[host]
            return host

        for u, v in cables:
            ru, rv = find(u), find(v)
            if ru == rv:
                return [u, v]
            if size[ru] < size[rv]:
                ru, rv = rv, ru
            parent[rv] = ru
            size[ru] += size[rv]
        return []
  javascript: |
    function firstRedundantCable(n, cables) {
      const parent = Array.from({ length: n }, (_, i) => i);
      const size = new Array(n).fill(1);
      const find = (host) => {
        while (parent[host] !== host) {
          parent[host] = parent[parent[host]];
          host = parent[host];
        }
        return host;
      };
      for (const [u, v] of cables) {
        let ru = find(u);
        let rv = find(v);
        if (ru === rv) return [u, v];
        if (size[ru] < size[rv]) [ru, rv] = [rv, ru];
        parent[rv] = ru;
        size[ru] += size[rv];
      }
      return [];
    }
