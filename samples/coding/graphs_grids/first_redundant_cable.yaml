expected_concepts:
  - "union-find (disjoint set union)"
  - "path compression and union by size or rank"
  - "processing edges incrementally in input order"
  - "cycle detection in an undirected graph"
optimal_complexity: {time: "O(n + m * alpha(n))", space: "O(n)"}
rubric:
  excellent: "Uses union-find with path compression and union by size, returns the cable exactly as written the moment both ends share a root, handles self-loops naturally and explains the near-constant amortised cost."
  good: "Correct union-find without one of the optimisations, or a correct per-cable search with a clear explanation of its higher cost."
  weak: "Rebuilds the graph and runs a full search for every cable without discussing the cost, normalises the returned pair, or returns the last redundant cable instead of the first."
  criteria:
    correctness: "All tests pass, including self-loops, reversed duplicates and the late closing cable."
    efficiency: "Near-linear overall; a per-cable traversal is identified as quadratic in the worst case."
    code_quality: "Small find and union helpers, iterative find, and no mutation of the input pairs."
    edge_cases: "Empty log, self-loop cables, duplicate cables and a long path built in scrambled order."
    communication: "Explains why checking connectivity before merging detects redundancy and why order matters."
hints:
  - "Process the cables in order and, for each one, ask whether its two ends are already in the same connected group."
  - "You need a structure that can both merge two groups and tell you which group a host belongs to, quickly and repeatedly as cables arrive."
  - "Keep a disjoint-set structure where each host points towards a representative; for each cable find both representatives, return the cable as written if they are equal, otherwise attach the smaller group under the larger, and shorten the pointer paths during lookups so long chains stay cheap."
followups:
  - "How would you return every redundant cable instead of only the first?"
  - "Which cables would you remove to keep the network connected with no loops at all?"
  - "How would the problem change if cables were one-directional?"
  - "Can you support removing a cable later, and what does that cost?"
common_errors:
  - "Normalising the pair to smaller label first and returning [0, 1] instead of [1, 0]."
  - "Merging before checking, so the redundant cable is never detected."
  - "Returning the last redundant cable instead of the first."
  - "Recursive find without path compression, which can be slow or overflow on a long chain."
