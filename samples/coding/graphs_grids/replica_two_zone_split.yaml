slug: replica_two_zone_split
title: Split Replicas Across Two Zones
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [cloud, sre, backend, dba]
time_limit_minutes: 20
prompt_markdown: |
  ## Split Replicas Across Two Zones

  A database cluster runs `n` replicas with ids `0` to `n - 1`, and the cloud region offers exactly
  **two** availability zones. Every replica must be placed in one of the two zones; a zone may hold
  any number of replicas, including none.

  Some replicas must not share a zone (for example because they hold copies of the same shard). Each
  entry `[a, b]` in `conflicts` says replicas `a` and `b` **must be placed in different zones**. A
  conflict is symmetric, the same pair may be listed more than once, and an entry `[a, a]` means
  the replica conflicts with itself, which no placement can satisfy.

  Return `true` if there is a placement that satisfies every conflict, otherwise `false`.

  ### Example 1
  ```
  Input:  n = 4, conflicts = [[0, 1], [1, 2], [2, 3]]
  Output: true
  Explanation: Replicas 0 and 2 go to one zone, replicas 1 and 3 to the other.
  ```

  ### Example 2
  ```
  Input:  n = 3, conflicts = [[0, 1], [1, 2], [2, 0]]
  Output: false
  Explanation: With only two zones, two of the three replicas would have to share a zone.
  ```

  ### Example 3
  ```
  Input:  n = 5, conflicts = [[0, 1], [2, 3], [3, 4], [4, 2]]
  Output: false
  Explanation: Replicas 0 and 1 are easy to split, but 2, 3 and 4 conflict with each other in a triangle.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= conflicts.length <= 5 * 10^4`
  - `conflicts[i].length == 2` and `0 <= conflicts[i][0], conflicts[i][1] < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: can_split_two_zones
  params:
    - {name: n, type: "int"}
    - {name: conflicts, type: "int[][]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def can_split_two_zones(n: int, conflicts: list[list[int]]) -> bool:
        neighbours = [[] for _ in range(n)]
        for a, b in conflicts:
            if a == b:
                return False
            neighbours[a].append(b)
            neighbours[b].append(a)
        zone = [-1] * n
        for seed in range(n):
            if zone[seed] != -1:
                continue
            zone[seed] = 0
            queue = deque([seed])
            while queue:
                replica = queue.popleft()
                for other in neighbours[replica]:
                    if zone[other] == -1:
                        zone[other] = 1 - zone[replica]
                        queue.append(other)
                    elif zone[other] == zone[replica]:
                        return False
        return True
  javascript: |
    function canSplitTwoZones(n, conflicts) {
      const neighbours = Array.from({ length: n }, () => []);
      for (const [a, b] of conflicts) {
        if (a === b) return false;
        neighbours[a].push(b);
        neighbours[b].push(a);
      }
      const zone = new Array(n).fill(-1);
      for (let seed = 0; seed < n; seed++) {
        if (zone[seed] !== -1) continue;
        zone[seed] = 0;
        const queue = [seed];
        for (let head = 0; head < queue.length; head++) {
          const replica = queue[head];
          for (const other of neighbours[replica]) {
            if (zone[other] === -1) {
              zone[other] = 1 - zone[replica];
              queue.push(other);
            } else if (zone[other] === zone[replica]) {
              return false;
            }
          }
        }
      }
      return true;
    }
