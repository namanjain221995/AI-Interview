expected_concepts:
  - "bipartite graph check"
  - "two-colouring with breadth-first or depth-first search"
  - "handling disconnected components"
  - "self-loops and odd cycles make a two-way split impossible"
optimal_complexity: {time: "O(n + C)", space: "O(n + C)"}
rubric:
  excellent: "Recognises a bipartite check, two-colours every component with an iterative search, rejects self-conflicts and odd cycles, and explains why the colouring is forced inside a component."
  good: "Correct two-colouring, perhaps after adding the loop over all components or the self-conflict case with a prompt."
  weak: "Tries all 2^n placements, colours only the component of replica 0, or greedily assigns zones without propagating constraints."
  criteria:
    correctness: "All tests pass, including self-conflicts, disconnected components and odd cycles."
    efficiency: "Linear in replicas plus conflicts."
    code_quality: "Clear zone array with a sentinel for unassigned and an explicit loop over every component."
    edge_cases: "No conflicts, self-conflicts, repeated pairs and many components."
    communication: "Explains that a placement exists exactly when no odd cycle exists and why fixing one replica's zone determines the rest of its component."
hints:
  - "Draw the replicas as points and each conflict as a line; think about what a valid two-zone placement looks like in that picture."
  - "Once you put one replica in a zone, every replica it conflicts with is forced into the other zone, and so on outward; a contradiction can only appear when a chain of conflicts loops back to a replica with an odd number of steps."
  - "Keep a zone value per replica, initially unassigned, and from every unassigned replica run a breadth-first search that gives each newly reached neighbour the opposite zone; report failure as soon as a neighbour already has the same zone as the current replica or a conflict names the same replica twice, and succeed once every component is processed."
followups:
  - "How would you return an actual placement instead of a boolean?"
  - "How would you report one conflict cycle that proves no placement exists?"
  - "What if conflicts arrive one by one and you must detect the first one that makes the split impossible?"
  - "Why does the problem become much harder with three zones?"
common_errors:
  - "Starting the search only from replica 0 and ignoring other components."
  - "Skipping self-conflict entries while building the adjacency lists, which turns an impossible input into a satisfiable one."
  - "Assigning zones greedily in input order without propagating, which fails on conflicts listed out of order."
  - "Recursive depth-first search that overflows the stack on long chains."
