time_limit_minutes: 25
prompt_markdown: |
  ## Capacity-Limited Release Waves

  A release manager ships `n` services, numbered `0` to `n - 1`, in numbered waves. Each pair
  `[a, b]` in `deps` means service `b` must ship in an **earlier wave** than service `a`. The change
  board limits every wave to at most `capacity` services.

  Waves are built one after another with this rule:

  - when building wave `k`, a service is **eligible** if it has not shipped yet and every service it
    depends on shipped in waves `1` to `k - 1`;
  - wave `k` takes the `capacity` eligible services with the **smallest numbers** (all of them if there
    are fewer); eligible services that do not fit wait for a later wave.

  Return the waves in order, each sorted in ascending order. If the dependencies contain a cycle
  (including a service that depends on itself), not every service can ever ship: return an empty list.
  The same pair may appear more than once.

  ### Example 1
  ```
  Input:  n = 5, deps = [[2, 0], [3, 1], [4, 2], [4, 3]], capacity = 2
  Output: [[0, 1], [2, 3], [4]]
  Explanation: Services 0 and 1 have no dependencies. 2 and 3 become eligible after wave 1, and 4 needs both of them.
  ```

  ### Example 2
  ```
  Input:  n = 4, deps = [[1, 0], [2, 0], [3, 0]], capacity = 2
  Output: [[0], [1, 2], [3]]
  Explanation: Services 1, 2 and 3 all become eligible after wave 1, but only two fit in wave 2, so the smallest two go first.
  ```

  ### Example 3
  ```
  Input:  n = 3, deps = [[0, 1], [1, 2], [2, 0]], capacity = 3
  Output: []
  Explanation: 0 waits for 1, 1 waits for 2 and 2 waits for 0, so no service can ever ship.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= deps.length <= 5 * 10^4`
  - `deps[i].length == 2` and `0 <= a, b < n`
  - `1 <= capacity <= n`
languages: [python, javascript, typescript, java, go, cpp]
