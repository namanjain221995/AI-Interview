reference_solutions:
  python: |
    import heapq


    def release_waves(n: int, deps: list[list[int]], capacity: int) -> list[list[int]]:
        waiting = [0] * n
        dependents = [[] for _ in range(n)]
        for a, b in deps:
            waiting[a] += 1
            dependents[b].append(a)
        ready = [s for s in range(n) if waiting[s] == 0]
        heapq.heapify(ready)
        waves = []
        shipped = 0
        while ready:
            wave = [heapq.heappop(ready) for _ in range(min(capacity, len(ready)))]
            waves.append(wave)
            shipped += len(wave)
            for s in wave:
                for a in dependents[s]:
                    waiting[a] -= 1
                    if waiting[a] == 0:
                        heapq.heappush(ready, a)
        return waves if shipped == n else []
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      push(value) {
        const items = this.items;
        items.push(value);
        let i = items.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!this.less(items[i], items[parent])) break;
          [items[i], items[parent]] = [items[parent], items[i]];
          i = parent;
        }
      }
      pop() {
        const items = this.items;
        const top = items[0];
        const last = items.pop();
        if (items.length > 0) {
          items[0] = last;
          let i = 0;
          for (;;) {
            const left = 2 * i + 1;
            const right = left + 1;
            let smallest = i;
            if (left < items.length && this.less(items[left], items[smallest])) smallest = left;
            if (right < items.length && this.less(items[right], items[smallest])) smallest = right;
            if (smallest === i) break;
            [items[i], items[smallest]] = [items[smallest], items[i]];
            i = smallest;
          }
        }
        return top;
      }
    }

    function releaseWaves(n, deps, capacity) {
      const waiting = new Array(n).fill(0);
      const dependents = Array.from({ length: n }, () => []);
      for (const [a, b] of deps) {
        waiting[a]++;
        dependents[b].push(a);
      }
      const ready = new MinHeap((a, b) => a < b);
      for (let s = 0; s < n; s++) if (waiting[s] === 0) ready.push(s);
      const waves = [];
      let shipped = 0;
      while (ready.size > 0) {
        const wave = [];
        while (wave.length < capacity && ready.size > 0) wave.push(ready.pop());
        waves.push(wave);
        shipped += wave.length;
        for (const s of wave) {
          for (const a of dependents[s]) {
            waiting[a]--;
            if (waiting[a] === 0) ready.push(a);
          }
        }
      }
      return shipped === n ? waves : [];
    }
