expected_concepts:
  - "topological sorting with remaining-dependency counts"
  - "min-heap of eligible services to pick the smallest numbers"
  - "deferring services unlocked during a wave until the next wave"
  - "cycle detection by counting shipped services"
  - "O((n + E) log n) time"
optimal_complexity: {time: "O((n + E) log n) for E dependency pairs", space: "O(n + E)"}
rubric:
  excellent: "Runs Kahn's algorithm wave by wave: pops up to capacity smallest services from a min-heap, only then releases their dependents into the heap so they wait for the next wave, detects cycles by the shipped count and explains O((n + E) log n)."
  good: "Correct waves using a sorted list of eligible services or a rescan per wave, with minor prompting about when newly unlocked services become eligible."
  weak: "Places newly unlocked services in the same wave, ignores the capacity, computes depth levels without the capacity rule, or loops forever on a cycle."
  criteria:
    correctness: "All tests pass, including capacity 1, capacity larger than any level, duplicates and cycles."
    efficiency: "Each service is pushed and popped once from a heap."
    code_quality: "The wave loop clearly separates choosing a wave from releasing dependents."
    edge_cases: "A single service, no dependencies, self-dependency, cycles that leave other services shippable."
    communication: "Explains why dependents of a wave must not join that same wave and how the capacity interacts with waiting services."
hints:
  - "Track which services are eligible right now, and think about what happens to that set after one wave ships."
  - "Keep the eligible services in a structure that always hands back the smallest number, and keep a count of unshipped dependencies per service. Be careful about when a service unlocked by the current wave becomes eligible."
  - "Count the dependencies of each service (repeated pairs counted each time) and record its dependents. Push every service with a count of zero into a min-heap. For each wave, pop up to capacity services from the heap and record them as the wave; only after the wave is chosen, decrement the counts of their dependents and push any that reach zero. Stop when the heap is empty and return an empty list if fewer than n services shipped."
followups:
  - "What is the minimum number of waves if you could choose freely instead of always taking the smallest numbers?"
  - "How would you give each service a weight and limit the total weight per wave?"
  - "How would you report which services are blocked by a cycle?"
  - "How would you re-plan if one service in the middle of the rollout fails?"
common_errors:
  - "Pushing unlocked services into the heap before the current wave is complete, so they ship together with their dependency."
  - "Ignoring capacity, which collapses the problem into plain depth levels."
  - "Leaving waiting services behind instead of letting them compete with newly eligible ones."
  - "Returning partial waves instead of an empty list when a cycle exists."
