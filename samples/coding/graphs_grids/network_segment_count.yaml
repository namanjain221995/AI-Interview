version: 1
slug: network_segment_count
title: Count Network Segments
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, network, sre, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Count Network Segments

  A test lab has `n` hosts numbered `0` to `n - 1`. The cabling inventory is exported as `cables`, where
  each entry `[a, b]` says that a cable joins host `a` and host `b`. Cables carry traffic in both
  directions.

  The export is messy: the same pair can be listed more than once (in either order), and a patch cable
  may loop from a host back into the same host, which connects nothing new.

  Two hosts belong to the same **segment** when a chain of one or more cables joins them. A host with no
  cables at all is a segment on its own. Return the number of segments in the lab.

  ### Example 1
  ```
  Input:  n = 6, cables = [[0, 1], [1, 2], [3, 4]]
  Output: 3
  Explanation: The segments are {0, 1, 2}, {3, 4} and {5}.
  ```

  ### Example 2
  ```
  Input:  n = 4, cables = [[2, 2], [0, 3], [3, 0]]
  Output: 3
  Explanation: The loop on host 2 and the repeated 0-3 cable add nothing; the segments are {0, 3}, {1} and {2}.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= cables.length <= 2 * 10^4`
  - `cables[i].length == 2` and `0 <= cables[i][0], cables[i][1] < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_segments
  params:
    - {name: n, type: "int"}
    - {name: cables, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_segments(n: int, cables: list[list[int]]) -> int:
        parent = list(range(n))

        def find(x: int) -> int:
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        segments = n
        for a, b in cables:
            root_a, root_b = find(a), find(b)
            if root_a != root_b:
                parent[root_a] = root_b
                segments -= 1
        return segments
  javascript: |
    function countSegments(n, cables) {
      const parent = Array.from({ length: n }, (_, i) => i);
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      let segments = n;
      for (const [a, b] of cables) {
        const ra = find(a);
        const rb = find(b);
        if (ra !== rb) {
          parent[ra] = rb;
          segments -= 1;
        }
      }
      return segments;
    }
