expected_concepts:
  - "connected components of an undirected graph"
  - "union-find (disjoint set union) or BFS/DFS over an adjacency list"
  - "ignoring duplicate edges and self-loops"
  - "counting isolated vertices as components"
optimal_complexity: {time: "O(n + m) with BFS/DFS or O((n + m) * alpha(n)) with union-find", space: "O(n + m)"}
rubric:
  excellent: "Models hosts and cables as an undirected graph, counts components with union-find (path compression) or an iterative BFS/DFS that marks visited hosts, explains why duplicates and self-loops are harmless and states near-linear time."
  good: "Correct component count with a recursive DFS or a union-find without path compression; handles isolated hosts after a prompt."
  weak: "Counts cables or distinct cable endpoints instead of components, forgets hosts with no cables, or decrements the count for every cable including duplicates and loops."
  criteria:
    correctness: "All tests pass, including n = 1, no cables, self-loops and repeated pairs."
    efficiency: "Linear or near-linear in hosts plus cables; no repeated graph scans per host."
    code_quality: "Clear separation of graph construction and traversal, or a small find/union helper."
    edge_cases: "Isolated hosts, only self-loops, duplicated pairs in either order, already merged groups."
    communication: "States the graph model and why each host is visited exactly once."
hints:
  - "Picture hosts as points and cables as lines between them; a segment is a group you can travel within."
  - "Start a search from every host that has not been seen yet, or merge groups of hosts as you read each cable; either way, each new starting host or each successful merge changes the count."
  - "Begin with n separate groups and a parent array; for each cable find the representative of both ends, and only when they differ join them and subtract one from the count. Loops and repeated cables then fall out naturally."
followups:
  - "How would you report which hosts are in each segment, sorted?"
  - "If cables are added one at a time and you must report the segment count after each, which approach fits best?"
  - "How would you handle cables being removed as well as added?"
  - "What happens to a recursive DFS on a chain of 10^5 hosts?"
common_errors:
  - "Starting the count at 0 and only counting hosts that appear in cables, missing isolated hosts."
  - "Decrementing for every cable instead of only when two different groups merge."
  - "Building a directed adjacency list so components look split depending on edge direction."
  - "Union-find that links the hosts themselves rather than their roots."
