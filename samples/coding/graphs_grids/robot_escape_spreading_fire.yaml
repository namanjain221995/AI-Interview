slug: robot_escape_spreading_fire
title: Robot Escape From Spreading Fire
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, sre]
time_limit_minutes: 35
prompt_markdown: |
  ## Robot Escape From Spreading Fire

  A safety team is testing evacuation plans for an automated warehouse. A fire has broken out, and an
  inspection robot must reach an exit before the fire cuts it off. The floor plan is given as `layout`,
  a list of equal-length strings, where each character is one cell:

  - `'R'` the robot's starting cell (exactly one; it is ordinary floor),
  - `'F'` a cell that is already burning,
  - `'E'` an exit,
  - `'#'` a wall,
  - `'.'` open floor.

  At minute `0` the robot stands on `'R'` and the `'F'` cells are burning. Then, every minute:

  - the fire spreads from every burning cell to its **up, down, left and right** neighbours that are not
    walls (fire also spreads into exits and into the robot's starting cell);
  - the robot moves exactly **one step** up, down, left or right. It can never enter a wall or leave
    the layout.

  Let `burn(cell)` be the minute at which the fire first reaches a cell. The robot may step onto a floor
  cell at minute `t` only if `t < burn(cell)` (strictly before the fire). It may step onto an exit at
  minute `t` if `t <= burn(exit)`: reaching an exit in the **same minute** as the fire still counts as an
  escape. Cells the fire never reaches are always safe.

  Return the **minimum number of minutes** the robot needs to reach any exit, or `-1` if it cannot
  escape.

  ### Example 1
  ```
  Input:  layout = ["FR.", "...", "E..", "..E"]
  Output: 4
  Explanation: The exit at row 2, column 0 is 3 steps away, but the fire reaches it at minute 2. The robot
  goes (1,1) -> (2,1) -> (2,2) -> (3,2), staying ahead of the fire, and escapes at minute 4.
  ```

  ### Example 2
  ```
  Input:  layout = ["R.E", "...", "..F"]
  Output: 2
  Explanation: The robot reaches the exit at minute 2, the same minute the fire does, which is allowed.
  ```

  ### Example 3
  ```
  Input:  layout = ["R.E", "#F#"]
  Output: -1
  Explanation: The fire reaches the corridor cell (0,1) at minute 1, the same minute the robot would
  step onto it, so the robot cannot get through.
  ```

  ### Constraints
  - `1 <= layout.length <= 50`
  - `1 <= layout[i].length <= 50`, all rows have the same length
  - every character is one of `R`, `F`, `E`, `#`, `.`
  - exactly one `R`; there may be any number of `F` and `E` cells, including none
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_escape_time
  params:
    - {name: layout, type: "string[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def min_escape_time(layout: list[str]) -> int:
        rows, cols = len(layout), len(layout[0])
        moves = ((1, 0), (-1, 0), (0, 1), (0, -1))
        never = rows * cols + 1  # later than any minute the robot can need
        fire = [[never] * cols for _ in range(rows)]
        queue: deque[tuple[int, int]] = deque()
        start = (0, 0)
        for r in range(rows):
            for c in range(cols):
                if layout[r][c] == "F":
                    fire[r][c] = 0
                    queue.append((r, c))
                elif layout[r][c] == "R":
                    start = (r, c)
        # Multi-source BFS: the minute at which fire reaches every cell.
        while queue:
            r, c = queue.popleft()
            for dr, dc in moves:
                nr, nc = r + dr, c + dc
                if 0 <= nr < rows and 0 <= nc < cols and layout[nr][nc] != "#" and fire[nr][nc] == never:
                    fire[nr][nc] = fire[r][c] + 1
                    queue.append((nr, nc))
        # BFS for the robot: earliest safe arrival minute at every cell.
        seen = [[False] * cols for _ in range(rows)]
        seen[start[0]][start[1]] = True
        queue.append((start[0], start[1], 0))
        while queue:
            r, c, t = queue.popleft()
            for dr, dc in moves:
                nr, nc = r + dr, c + dc
                if not (0 <= nr < rows and 0 <= nc < cols) or seen[nr][nc]:
                    continue
                cell = layout[nr][nc]
                if cell == "#":
                    continue
                if cell == "E":
                    if t + 1 <= fire[nr][nc]:
                        return t + 1
                    continue
                if t + 1 < fire[nr][nc]:
                    seen[nr][nc] = True
                    queue.append((nr, nc, t + 1))
        return -1
  javascript: |
    function minEscapeTime(layout) {
      const rows = layout.length;
      const cols = layout[0].length;
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      const never = rows * cols + 1; // later than any minute the robot can need
      const fire = Array.from({ length: rows }, () => new Array(cols).fill(never));
      let queue = [];
      let start = [0, 0];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (layout[r][c] === "F") {
            fire[r][c] = 0;
            queue.push([r, c]);
          } else if (layout[r][c] === "R") {
            start = [r, c];
          }
        }
      }
      // Multi-source BFS: the minute at which fire reaches every cell.
      for (let head = 0; head < queue.length; head++) {
        const [r, c] = queue[head];
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
          if (layout[nr][nc] === "#" || fire[nr][nc] !== never) continue;
          fire[nr][nc] = fire[r][c] + 1;
          queue.push([nr, nc]);
        }
      }
      // BFS for the robot: earliest safe arrival minute at every cell.
      const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
      seen[start[0]][start[1]] = true;
      queue = [[start[0], start[1], 0]];
      for (let head = 0; head < queue.length; head++) {
        const [r, c, t] = queue[head];
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || seen[nr][nc]) continue;
          const cell = layout[nr][nc];
          if (cell === "#") continue;
          if (cell === "E") {
            if (t + 1 <= fire[nr][nc]) return t + 1;
            continue;
          }
          if (t + 1 < fire[nr][nc]) {
            seen[nr][nc] = true;
            queue.push([nr, nc, t + 1]);
          }
        }
      }
      return -1;
    }
