expected_concepts:
  - multi-source BFS to compute the minute the fire reaches every cell
  - a second BFS for the robot that checks arrival time against the fire time
  - strict versus non-strict comparison for floor cells and exits
  - why earliest arrival is always the safest arrival because fire only grows
  - grid bounds and wall handling
optimal_complexity: {time: O(R*C), space: O(R*C)}
rubric:
  excellent: Precomputes fire arrival times with one multi-source BFS, runs a robot BFS that admits a cell only when the arrival minute is strictly earlier (or no later for exits), explains why BFS earliest arrival is sufficient because fire only spreads, handles layouts without fire or exits, and states O(R*C) time and space.
  good: Reaches the two-BFS solution, possibly after a hint, with a slip on the strict/non-strict rule or on unreachable cells that is fixed once the examples are traced.
  weak: Simulates minute by minute with repeated full-grid scans and no clear bound, ignores the fire, or applies the same comparison to floor cells and exits.
  criteria:
    correctness: Returns the minimum escape minute, honours the different rules for floor cells and exits, and returns -1 when no exit can be reached in time.
    efficiency: Two linear BFS passes over the grid instead of a per-minute simulation or a search over (cell, time) states without pruning.
    code_quality: Clear separation between the fire pass and the robot pass, a shared direction list and a sentinel for cells the fire never reaches.
    edge_cases: No fire, no exit, a walled-in robot, fire blocked by walls and ties at exits versus ties on floor cells.
    communication: Explains why the fire timeline can be computed independently of the robot and why reaching a cell earlier never hurts.
hints:
  - The fire does not depend on what the robot does; can you work out, before moving the robot at all, when the fire will reach each cell?
  - A breadth-first search started from all burning cells at once gives the burn minute of every cell; the robot then needs its own shortest-path search that only accepts safe arrival times.
  - Run a multi-source BFS for burn times, then a BFS from 'R' where moving onto a floor cell at minute t requires t < burn and onto an exit requires t <= burn; the first exit accepted is the answer, and an exhausted queue means -1.
followups:
  - How would the solution change if the robot could also wait in place, or if it moved two cells per minute?
  - What if the fire spread only every k minutes, or more slowly through some materials?
  - How would you report the latest minute the robot could start moving and still escape?
  - How would you handle several robots that must not occupy the same cell at the same minute?
common_errors:
  - Using the same comparison for floor cells and exits, which either blocks a legal same-minute escape or allows stepping into fire.
  - Running a separate fire BFS from each burning cell instead of one multi-source BFS.
  - Treating cells the fire never reaches as burning at minute 0 or forgetting a sentinel for them.
  - Letting the fire spread through walls, or blocking the robot on its own starting cell after it has left.
  - Searching for the closest exit while ignoring the fire and only checking that one exit, which misses a farther exit that is still safe.
