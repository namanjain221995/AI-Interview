expected_concepts:
  - "adjacency sets for O(1) direct-link checks"
  - "counting paths of length two through each neighbour (shared neighbours)"
  - "excluding the document itself and its direct neighbours"
  - "sorting by a composite key (strength descending, id ascending) or a bounded heap for top k"
  - "complexity proportional to the sum of the neighbours' degrees"
optimal_complexity: {time: "O(n + m + S log S), where S is the number of candidates (at most the sum of the neighbours' degrees)", space: "O(n + m)"}
rubric:
  excellent: "Builds adjacency sets, counts shared neighbours in a single pass over the neighbours of each neighbour, excludes the document and its direct links, ranks with a composite key or a size-k heap, and discusses the cost on hub documents with very high degree."
  good: "Correct counting and ordering with minor prompting on exclusions or tie-breaking."
  weak: "Uses BFS distance only and ignores strength, includes directly linked documents or the document itself, compares every pair of documents, or breaks ties incorrectly."
  criteria:
    correctness: "All tests pass, including triangles, ties cut by k and documents without links."
    efficiency: "Work proportional to the two-link neighbourhood plus sorting the candidates."
    code_quality: "Adjacency built once; exclusions and ranking expressed clearly."
    edge_cases: "Isolated document, k larger than the candidate count, mixed link orientation, ties."
    communication: "Explains why strength equals the number of length-two paths and how the ordering is enforced."
hints:
  - "A candidate is reached by going one link out to a neighbour and then one more link out; each such two-step path is one shared document."
  - "Visit each direct neighbour of the document and tally every document linked to it, skipping the document itself and anything already directly linked. The tally is the strength."
  - "Store each document's links in a set so the direct-link check is instant. For every neighbour of the document, add one to a counter for each of that neighbour's links that is neither the document nor one of its direct links. Then sort the counted documents by count from high to low and by id from low to high, and keep the first k."
followups:
  - "How would you avoid the cost explosion when the document links to a hub with a million links?"
  - "How would you weight shared documents so that very popular hubs count less?"
  - "How would you precompute suggestions for every document in a nightly batch job?"
  - "How would you return the top k without sorting all candidates?"
common_errors:
  - "Suggesting documents that are already directly linked to the document."
  - "Suggesting the document itself, which is always two links away through any neighbour."
  - "Counting strength as 1 for every candidate instead of the number of shared documents."
  - "Sorting by id first or by strength ascending."
  - "Treating links as one-way so half of the neighbourhood is missing."
