title: "Related Document Suggestions"
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [backend, data_scientist, fullstack, ml]
time_limit_minutes: 20
prompt_markdown: |
  ## Related Document Suggestions

  An internal knowledge base has `n` documents numbered `0` to `n - 1`. Editors connect documents with
  two-way "see also" links: each entry `[a, b]` in `links` means documents `a` and `b` link to each other.

  When a reader opens document `doc`, a "Related" panel suggests documents that are **not linked yet but are
  two links away**. A document `c` is a **candidate** when:

  - `c != doc`,
  - `c` is not directly linked to `doc`, and
  - at least one document `m` is directly linked to both `doc` and `c`.

  The **strength** of a candidate is the number of such shared documents `m`. Return at most `k`
  candidates, ordered by strength **descending** and, for equal strength, by id **ascending**. If there are
  fewer than `k` candidates return all of them, and if there are none return an empty list.

  ### Example 1
  ```
  Input:  n = 6, links = [[0, 1], [0, 2], [1, 3], [2, 3], [2, 4], [4, 5]], doc = 0, k = 2
  Output: [3, 4]
  Explanation: Document 3 shares 1 and 2 with document 0 (strength 2); document 4 shares only 2 (strength 1). Document 5 is three links away.
  ```

  ### Example 2
  ```
  Input:  n = 5, links = [[0, 1], [1, 2], [1, 3], [0, 2], [3, 4]], doc = 0, k = 3
  Output: [3]
  Explanation: Document 2 is reachable through 1 but is already linked to 0, so only document 3 is suggested.
  ```

  ### Example 3
  ```
  Input:  n = 3, links = [[0, 1]], doc = 2, k = 1
  Output: []
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 5 * 10^4`
  - `links[i] = [a, b]` with `0 <= a, b < n` and `a != b`; each unordered pair appears at most once.
  - `0 <= doc < n`
  - `1 <= k <= n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: suggest_related
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
    - {name: doc, type: "int"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def suggest_related(n: int, links: list[list[int]], doc: int, k: int) -> list[int]:
        neighbours: list[set[int]] = [set() for _ in range(n)]
        for a, b in links:
            neighbours[a].add(b)
            neighbours[b].add(a)
        direct = neighbours[doc]
        shared: dict[int, int] = {}
        for middle in direct:
            for candidate in neighbours[middle]:
                if candidate != doc and candidate not in direct:
                    shared[candidate] = shared.get(candidate, 0) + 1
        ranked = sorted(shared, key=lambda c: (-shared[c], c))
        return ranked[:k]
  javascript: |
    function suggestRelated(n, links, doc, k) {
      const neighbours = Array.from({ length: n }, () => new Set());
      for (const [a, b] of links) {
        neighbours[a].add(b);
        neighbours[b].add(a);
      }
      const direct = neighbours[doc];
      const shared = new Map();
      for (const middle of direct) {
        for (const candidate of neighbours[middle]) {
          if (candidate !== doc && !direct.has(candidate)) {
            shared.set(candidate, (shared.get(candidate) || 0) + 1);
          }
        }
      }
      const ranked = [...shared.keys()].sort((x, y) => shared.get(y) - shared.get(x) || x - y);
      return ranked.slice(0, k);
    }
