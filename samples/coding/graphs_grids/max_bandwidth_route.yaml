    - {name: target, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_bandwidth(n: int, links: list[list[int]], source: int, target: int) -> int:
        parent = list(range(n))

        def find(x: int) -> int:
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        # Add links from widest to narrowest; the first one that joins source and target
        # is the bottleneck of the best route.
        for u, v, capacity in sorted(links, key=lambda link: -link[2]):
            ru, rv = find(u), find(v)
            if ru != rv:
                parent[ru] = rv
                if find(source) == find(target):
                    return capacity
        return -1
  javascript: |
    function maxBandwidth(n, links, source, target) {
      const parent = Array.from({ length: n }, (_, i) => i);
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      const sorted = [...links].sort((a, b) => b[2] - a[2]);
      for (const [u, v, capacity] of sorted) {
        const ru = find(u);
        const rv = find(v);
        if (ru !== rv) {
          parent[ru] = rv;
          if (find(source) === find(target)) return capacity;
        }
      }
      return -1;
    }
