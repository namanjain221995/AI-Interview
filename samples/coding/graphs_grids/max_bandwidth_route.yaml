slug: max_bandwidth_route
title: Maximum Bandwidth Route
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [network, cloud, sre]
time_limit_minutes: 25
prompt_markdown: |
  ## Maximum Bandwidth Route

  A backbone network has `n` routers numbered `0` to `n - 1`. Each entry of `links` is
  `[u, v, capacity]`: a **bidirectional** link between routers `u` and `v` that can carry `capacity`
  Mbps. Two routers may be joined by several parallel links with different capacities.

  A transfer between two routers follows a route (a sequence of links), and its throughput is limited by
  the **narrowest** link on that route: the throughput of a route is the **minimum** capacity among its
  links.

  The operations team wants to move a large backup from router `source` to router `target`
  (`source != target`). Return the **largest throughput** achievable over any single route from `source`
  to `target`, or `-1` if no route connects them.

  ### Example 1
  ```
  Input:  n = 5, links = [[0, 1, 40], [1, 4, 25], [0, 2, 30], [2, 3, 35], [3, 4, 30], [0, 4, 10]], source = 0, target = 4
  Output: 30
  Explanation: Route 0 -> 2 -> 3 -> 4 has capacities 30, 35, 30, so its throughput is 30; 0 -> 1 -> 4 gives 25 and the direct link gives 10
  ```

  ### Example 2
  ```
  Input:  n = 4, links = [[0, 1, 100], [2, 3, 100]], source = 0, target = 3
  Output: -1
  Explanation: No sequence of links joins router 0 to router 3
  ```

  ### Constraints
  - `2 <= n <= 10^4`
  - `0 <= links.length <= 2 * 10^4`
  - `links[i].length == 3`, `0 <= u, v < n`, `u != v`
  - `1 <= capacity <= 10^9`
  - `0 <= source, target < n`, `source != target`
languages: [python, javascript, typescript, java, go, cpp]
